- id: hadith-9-prayer-better-than-sleep
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: '''Prayer is better than sleep'' in the first dawn call'
  read:
  - Jāmiʿ 9:1193.1-1194.1
  quran: []
  tags:
  - motif: prayer-better-than-sleep-in-dawn-call
    refs:
    - Jāmiʿ 9:1193.1
    - Jāmiʿ 9:1194.1
    note: 'وكنتُ أقول في أذان الفجر الأول: حيَّ على الفلاح، الصلاة خير من النوم، الصلاة خير من النوم'
- id: hadith-9-call-pairs-iqama-single
  tradition: islam
