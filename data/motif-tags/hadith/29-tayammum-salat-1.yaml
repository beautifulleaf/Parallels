  quran: []
  tags:
  - motif: night-caller-then-dawn-caller-eat-until-second
    refs:
    - Jāmiʿ 9:1199.1
    - Jāmiʿ 9:1201.2
    - Jāmiʿ 9:1201.3
    - Jāmiʿ 9:1202.2
    note: إن بلالًا يؤذِّن بليلٍ فكلوا واشربوا حتى ينادي ابن أم مكتوم ... إنَّ ابن مكتوم يؤذن بليل فكلوا واشربوا، حتَّى يؤذن بلال
  - motif: blind-muezzin-calls-when-told-you-are-at-morning
    refs:
    - Jāmiʿ 9:1199.1
    note: 'وكان رجلًا أعمى، لا يُنادي حتى يقال له: أصبحتَ أصبحتَ'
  - motif: night-call-to-send-back-the-stander-and-wake-the-sleeper
    refs:
    - Jāmiʿ 9:1201.1
    note: فإنه يؤذِّن - أو ينادي - بليلٍ ليرجعَ قائمكم، ولينتبه نائمُكم
  - motif: true-dawn-spreads-sideways-not-the-vertical-whiteness
    refs:
    - Jāmiʿ 9:1201.1
    - Jāmiʿ 9:1202.1
    note: 'وليس أن يقول: الفجرُ أو الصبحُ، وقال بأصابعه ورفعها إلى فوق، وطأطأ إلى أسفل ... ولا الفجر المستطيل، ولكنِ الفجرُ المستطيرُ في الأفق'
  - motif: woman-asks-muezzin-to-wait-till-she-finishes-meal
    refs:
    - Jāmiʿ 9:1202.2
    note: 'فإن كانت المرأة منا ليبقى عليها شيء من سحورها فتقول لبلال: أمهل حتَّى أفرغ من سَحوري'
  hints:
  - The true dawn as light spreading across the horizon, not the upright whiteness (Jāmiʿ 9:1201.1, 1202.1) against m. Yoma 3:1, the watcher's call that 'the whole face of the east is lit' before the morning offering
