    note: إني أَراك تحبُّ الغنم والبادية. فإذا كنت في غنمك، أو باديتك، فأذَّنت بالصلاة فارفع صوتك بالنداء
- id: hadith-9-bilal-on-the-roof
  tradition: islam
  corpus: hadith
  original: true
