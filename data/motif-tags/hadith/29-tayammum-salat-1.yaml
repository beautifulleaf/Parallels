    - Jāmiʿ 9:1134.1
    - Jāmiʿ 9:1135.1
    - Jāmiʿ 9:1136.1
    note: وصَلَّى بي الظُّهْر حين زالتِ الشمسُ، وكانت قدر الشِّراكِ، وصَلَّى بي العصرَ حين كان ظِلُّه مثله ... حين كان ظِلُّه مثْليْه
  - motif: maghrib-when-the-faster-breaks-dawn-when-food-forbidden
    refs:
    - Jāmiʿ 9:1133.1
    - Jāmiʿ 9:1134.1
    - Jāmiʿ 9:1135.1
