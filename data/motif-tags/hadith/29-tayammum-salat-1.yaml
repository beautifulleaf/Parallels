    - Jāmiʿ 9:1195.2
    note: 'أمر بلال أن يشفعَ الأذانَ، وأن يُوتر الإقامة ... الأذان ... مرتين مرتين، والاقامة مرةً مرةً غير أنه يقول: قد قامتِ الصلاة'
  - motif: ablution-on-hearing-the-iqama
    refs:
    - Jāmiʿ 9:1195.2
    note: فإذا سمعنا الإقامة توضأنا، ثم خرجنا إلى الصلاة
- id: hadith-9-two-dawn-calls
  tradition: islam
  corpus: hadith
