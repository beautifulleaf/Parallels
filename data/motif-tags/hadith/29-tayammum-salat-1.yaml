  - motif: hell-stoked-when-shadow-stands-with-the-spear
    refs:
    - Jāmiʿ 9:1138.1
    note: حتى يستَقِلَّ الظِلُّ بالرُمْحٍ، ثم أقْصِرْ عن الصلاةِ فإنَّ حينَئِذٍ تُسْجَرُ جَهَنَّمُ
  - motif: prayer-is-witnessed-and-attended
    refs:
