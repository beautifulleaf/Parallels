- id: hadith-9-answering-the-call
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Say as the muezzin says; 'no power save in God' at 'come to prayer'; bless me and ask the wasīla
  read:
  - Jāmiʿ 9:1213.1-1216.2
  - Jāmiʿ 9:1219.1-1221.1
  quran: []
  tags:
  - motif: say-what-the-muezzin-says
    refs:
    - Jāmiʿ 9:1213.1
    - Jāmiʿ 9:1214.1
    - Jāmiʿ 9:1214.2
    - Jāmiʿ 9:1214.4
    - Jāmiʿ 9:1219.1
    - Jāmiʿ 9:1220.1
    - Jāmiʿ 9:1221.1
    note: إذا سمعتم النداء فقولوا مِثل ما يقول المؤذن
  - motif: no-power-save-in-god-at-come-to-prayer
    refs:
    - Jāmiʿ 9:1214.2
    - Jāmiʿ 9:1214.4
    - Jāmiʿ 9:1219.1
    - Jāmiʿ 9:1220.1
    note: 'ثم قال: حيَّ على الصّلاة، قال: لا حول ولا قُوَّة إِلَّا بالله ... قال: لا إله إِلَّا الله من قَلْبه دخل الجنّة'
  - motif: one-blessing-returned-tenfold
    refs:
    - Jāmiʿ 9:1214.1
    - Jāmiʿ 9:1221.1
    note: ثم صلوا عليَّ، فإنه من صلى عليّ صلاة صلى الله عليه بها عشرَا
  - motif: wasila-a-station-for-one-servant
    refs:
    - Jāmiʿ 9:1214.1
    - Jāmiʿ 9:1221.1
    note: ثم سَلُوا الله لي الوسيلةَ، فإنها منزلة في الجنّة لا تنبغي إِلَّا لعبد من عباد الله، وأرجو أن أكون أنا هو
  - motif: pleased-with-god-as-lord-at-the-call-sins-forgiven
    refs:
    - Jāmiʿ 9:1214.3
    note: رضيتُ بالله ربًا، وبمحمدٍ رسولًا، وبالإسلام دينًا غفر له ذنبه
  - motif: and-i-too-in-answer-to-the-testimony
    refs:
    - Jāmiʿ 9:1216.1
    - Jāmiʿ 9:1216.2
    note: 'كان إذا سمع المؤذِّن يتشهد قال: "وأنا وأنا" ... فقال معاوية: وأنا ... إني سمعتُ رسول الله ﷺ على هذا المجلس'
- id: hadith-9-supplication-at-the-call
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Prayer between call and iqāma is not refused; 'Lord of this perfect call'; the wasīla
  read:
  - Jāmiʿ 9:1216.3-1218.3
  quran:
  - 17:79
  tags:
  - motif: supplication-between-call-and-iqama-not-refused
    refs:
    - Jāmiʿ 9:1216.3
    note: إن الدعاء لا يُرد بين الأذان والإقامة فادعوا
  - motif: lord-of-this-perfect-call-grant-wasila-and-praised-station
    refs:
    - Jāmiʿ 9:1217.1
    note: اللَّهُمَّ ربَّ هذه الدعوة التامة والصلاة القائمة، آتِ محمدًا الوسيلة والفضيلة، وابعثه مقامًا محمودًا الذي وعدته، حلَّتْ له شفاعتي يوم القيامة
  - motif: praised-station-of-the-prophet
    refs:
    - Jāmiʿ 9:1217.1
    note: وابعثه مقامًا محمودًا الذي وعدته
  - motif: wasila-a-station-for-one-servant
    refs:
    - Jāmiʿ 9:1218.1
    - Jāmiʿ 9:1218.2
    note: ثم سلوا الله لي الوسيلة فإنها منزلة في الجنّة لا تنبغي لعبد من عباد الله ... فإنه لا يسألها عبد في الدُّنيا إِلَّا كنت له شهيدًا أو شفيعًا
  - motif: muezzins-surpass-us-say-as-they-say-then-ask
    refs:
    - Jāmiʿ 9:1218.3
    note: 'إنَّ المؤذنين يَفْضُلوننا. فقال رسول الله ﷺ: "قل كما يقولون، فإذا انتهيت فسلْ تُعطه"'
- id: hadith-9-imam-guarantor-muezzin-trusted
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The imam a guarantor, the muezzin entrusted
  read:
  - Jāmiʿ 9:1222.1
  quran: []
  tags:
  - motif: imam-guarantor-muezzin-entrusted
    refs:
    - Jāmiʿ 9:1222.1
    note: الإمام ضامنٌ والمؤذن مُؤْتَمن، اللَّهُمَّ أَرْشِد الأئمة واغفر للمؤذنين
