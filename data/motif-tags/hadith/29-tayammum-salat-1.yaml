    note: كَتَبَ له كاتبه - أو كاتباه - بكلِّ خطوةٍ يخطوها إلى المسجد عشر حسنات، والقاعد يرعى الصلاة كالقانت
- id: hadith-9-prayer-expiates
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: A kiss expiated by prayer (Hūd 114); a confessed hadd forgiven for attending prayer
  read:
  - Jāmiʿ 9:1127.1-1127.3
  quran:
  - 11:114
  tags:
  - motif: good-deeds-erase-sins-kiss-case
    refs:
    - Jāmiʿ 9:1127.1
    note: 'أن رجلًا أصاب من امرأة قُبلة، فأتى النبي ﷺ فأخبره، فأنزل الله: ﴿وَأَقِمِ الصَّلَاةَ طَرَفَيِ النَّهَارِ ... إِنَّ الْحَسَنَاتِ يُذْهِبْنَ السَّيِّئَاتِ﴾ ... "لجميع أمتي كلهم"'
  - motif: good-deeds-remove-bad-deeds
    refs:
    - Jāmiʿ 9:1127.1
    note: ﴿إِنَّ الْحَسَنَاتِ يُذْهِبْنَ السَّيِّئَاتِ﴾
  - motif: confessed-hadd-forgiven-by-attending-prayer
    refs:
    - Jāmiʿ 9:1127.2
    - Jāmiʿ 9:1127.3
    note: 'أصبتُ حدًّا فأقمه عَليَّ ... "هل حضرت معنا الصلاة؟ ". قال: نعم. قال: "قد غفر لك" ... "فإن الله قد غفر لك حدَّك، أو قال: ذنبك"'
- id: hadith-9-ablution-forgives-intervals
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'ʿUthmān''s ablution: each prayer forgives what lies between it and the last; the ''lasting good things'' named'
  read:
  - Jāmiʿ 9:1128.1-1128.2
  quran:
  - 2:159
  - 11:114
  - '18:46'
  tags:
  - motif: ablution-and-prayer-forgive-intervals
    refs:
    - Jāmiʿ 9:1128.1
    - Jāmiʿ 9:1128.2
    note: لا يتوضأ رجل، فيحسن وضوءه، ثم يصلي الصلاة، إلا غفر له ما بينه وبين الصلاة التي تليها
  - motif: would-not-tell-but-for-a-verse-on-concealment
    refs:
    - Jāmiʿ 9:1128.1
    note: 'والله! لولا آية في كتاب الله ما حدثتكموه ... قال عروة الآية: ﴿إِنَّ الَّذِينَ يَكْتُمُونَ مَا أَنْزَلْنَا مِنَ الْبَيِّنَاتِ وَالْهُدَى﴾'
  - motif: each-of-five-forgives-gap-to-previous-night-rolling-in-sin
    refs:
    - Jāmiʿ 9:1128.2
    note: ثم لعله أن يبيت يتمرغ ليلته، ثم إن قام، فتوضأ، وصلى الصبح غفر له ما بينها وبين صلاة العشاء، وهن الحسنات يذهبن السيئات
  - motif: lasting-good-things-are-five-formulas
    refs:
    - Jāmiʿ 9:1128.2
    note: 'فما الباقيات يا عثمان؟ قال: هن: لا إله إلا الله، وسبحان الله، والحمد لله، والله أكبر، ولا حول ولا قوة إلا بالله'
- id: hadith-9-prayer-light-or-with-qarun
