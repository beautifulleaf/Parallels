  hints:
  - Gabriel's 'this is the time of the prophets before you' (Jāmiʿ 9:1133.1) against b. Berakhot 26b, the three daily prayers instituted by Abraham (morning), Isaac (afternoon) and Jacob (evening)
  - The afternoon prayer fixed by a man's shadow equal to his height (Jāmiʿ 9:1133.1-1136.1) against m. Berakhot 4:1, where the afternoon prayer runs 'until evening' or, for R. Judah, until plag ha-minḥa
- id: hadith-9-practice-of-the-times
