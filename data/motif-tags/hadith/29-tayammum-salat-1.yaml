  - motif: night-prayer-when-third-nights-moon-sets
    refs:
    - Jāmiʿ 9:1171.1
    note: أنا أعلم الناس بوقت هذه الصلاة، كان رسولُ الله ﷺ يُصَلِّيها لسقوط القمر الثالثة
  - motif: night-prayer-time-when-night-fills-every-valley
    refs:
    - Jāmiʿ 9:1174.1
    note: 'سُئِل رسولُ الله ﷺ عن وقت العشاء فقال: "إذا ملأ الليلُ بطن كُلِّ وادٍ"'
  - motif: night-prayer-never-prayed-by-a-nation-before
    refs:
    - Jāmiʿ 9:1172.2
    note: أَعْتِنموا بهذه الصلاة، فإنكم قد فُضِّلْتُم بها على سائر الأمم، ولم تُصَلِّها أمةٌ قبلكم
  hints:
  - The night prayer 'no nation before you prayed' (Jāmiʿ 9:1172.2) against b. Berakhot 27b, where the evening prayer (tefillat ʿarvit) is held optional (reshut)
