    - Jāmiʿ 9:1177.3
    note: فإنَّ رأسَ مائةِ سنةٍ لا يَبْقى ممن هو اليوم على ظهر الأرض أحدٌ
  - motif: century-saying-misread-means-end-of-that-generation
    refs:
    - Jāmiʿ 9:1177.3
    note: فوَهِلَ الناسُ في مقالة رسول الله ﷺ إلى ما يتحدثون من هذه الأحاديث عن مائة سنة ... يريد بذلك أنَّها تخرِمُ ذلك القرنَ
  - motif: night-talk-with-abu-bakr-on-muslims-affairs
    refs:
    - Jāmiʿ 9:1178.1
    note: كان رسول الله ﷺ يسْمُرُ مع أبي بكر في الأمر من أمور المسلمين، وأنا معهما
