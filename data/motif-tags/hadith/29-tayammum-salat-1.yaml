- id: hadith-9-beginning-of-the-call
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Bell like the Christians, horn like the Jews, or fire: rejected; the call shown in a dream'
  read:
  - Jāmiʿ 9:1180.1-1180.2
  - Jāmiʿ 9:1182.1-1182.2
  quran: []
  tags:
  - motif: bell-like-christians-horn-like-jews-rejected
    refs:
    - Jāmiʿ 9:1180.1
    - Jāmiʿ 9:1180.2
    - Jāmiʿ 9:1182.1
    note: 'اتخذوا ناقوسًا مثل ناقوس النصارى، وقال بعضهم: بل بوقًا مثل قرن اليهود ... فذكر له القُنْع - يعني الشَّبُّور ... "هو من أمر اليهود" ... "هو من أمر النصاري"'
  - motif: fire-or-banner-proposed-as-signal-for-prayer
    refs:
    - Jāmiʿ 9:1180.2
    - Jāmiʿ 9:1182.1
    note: ذكروا النارَ والناقوس ... أن يُنَوِّروا نارًا ... انصب راية عند حضور الصلاة، فإذا رأوها آذن بعضهم بعضًا
  - motif: first-call-a-man-crying-the-prayer
    refs:
    - Jāmiʿ 9:1180.1
    note: 'فقال عمر: أَوَلا تبعثون رجلًا ينادي بالصلاة؟ فقال رسول الله ﷺ: "يا بلال قُم فنادِ بالصلاة"'
  - motif: call-to-prayer-shown-in-a-dream-between-sleep-and-waking
    refs:
    - Jāmiʿ 9:1182.1
    - Jāmiʿ 9:1182.2
    note: فأرِي الأذان في منامه ... إني لبين نائم ويقظان إذ أتاني آتٍ فأراني الأذان ... "إن هذه الرؤيا حق"
  - motif: second-dreamer-kept-silent-twenty-days-for-shame
    refs:
    - Jāmiʿ 9:1182.1
    - Jāmiʿ 9:1182.2
    note: 'وكان عمر بن الخطاب ﵁، قد رآه قبل ذلك فكتمه عشرين يومًا ... فقال: سبقني عبد الله بن زيْد، فاستحييت ... خرج إلى رسول الله ﷺ يجر رداءه'
  - motif: louder-voice-chosen-to-call-dreamer-teaches-him
    refs:
    - Jāmiʿ 9:1182.1
    - Jāmiʿ 9:1182.2
    note: فقم مع بلال، فإنه أندي، أو أمدَّ - صوتًا منك، فألق عليه ما قيل لك ... لولا أنه كان يومئذ مريضًا لجعله رسول الله ﷺ مؤذنًا
  - motif: call-in-pairs-iqama-single
    refs:
    - Jāmiʿ 9:1180.2
    note: فأمر بلالا أن يشفع الأذان، وأن يُوتر الإقامة
  hints:
  - The Jews' horn (qarn, būq, shabbūr) proposed and refused as summons to prayer (Jāmiʿ 9:1180.1, 1182.1) against Num 10:2-3, the two silver trumpets made 'for summoning the congregation'
- id: hadith-9-abu-mahdhura-call
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The call Abū Maḥdhūra was taught, with the testimonies said again in a raised voice
  read:
  - Jāmiʿ 9:1180.3
  - Jāmiʿ 9:1189.2
  quran: []
  tags:
  - motif: call-with-testimonies-repeated-louder
    refs:
    - Jāmiʿ 9:1180.3
    - Jāmiʿ 9:1189.2
    note: 'ثم يعود فيقول: أشهد أن لا إله إلا الله ... ثم ارجع فمُدَّ من صوتك: أشهد أن لا إله إلا الله'
  - motif: call-of-nineteen-words-iqama-of-seventeen
    refs:
    - Jāmiʿ 9:1189.2
    note: 'وفي بعض الروايات: علَّمه الأذان تسعة عشر كلمة فذكرها'
- id: hadith-9-three-without-a-call
  tradition: islam
  corpus: hadith
  original: true
