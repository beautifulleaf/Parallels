  tags:
  - motif: watchman-sleeps-camp-wakes-after-sunrise
    refs:
    - Jāmiʿ 9:1203.2
    - Jāmiʿ 9:1207.1
    note: 'قال بلال: أنا أوقظكم ... فغلبته عيناه فنام ... "من يكلؤنا؟ " فقال بلال: أنا، فناموا حتَّى طلعتِ الشّمس'
  - motif: army-oversleeps-sun-wakes-them
    refs:
    - Jāmiʿ 9:1203.2
    - Jāmiʿ 9:1206.1
    - Jāmiʿ 9:1206.2
    note: فاستيقظ النَّبِيّ ﷺ وقد طلع حاجبُ الشّمسِ ... فاستيقظوا بحرِّ الشّمس
  - motif: god-took-your-souls-and-returned-them
    refs:
    - Jāmiʿ 9:1203.2
    note: إن الله قبض أرواحكم حين شاء، وردها عليكم حين شاء
  - motif: move-from-the-place-of-heedlessness
    refs:
    - Jāmiʿ 9:1204.1
    - Jāmiʿ 9:1206.1
    - Jāmiʿ 9:1206.2
    note: تحولوا عن مكانكم الذي أصابتكم فيه الغفلةُ ... فارتفعوا قليلًا حتَّى استقلت الشّمسُ ... تنحَّوا عن هذا المكان
  - motif: missed-dawn-made-up-with-call-two-rakaas-iqama
    refs:
    - Jāmiʿ 9:1203.2
    - Jāmiʿ 9:1206.1
    - Jāmiʿ 9:1206.2
    - Jāmiʿ 9:1207.1
    note: فلمّا ارتفعتِ الشّمسُ وابياضَّتْ قام فصلَّى ... ثم أمر مؤذِّنًا فأذَّن، فصلَّى ركعتين قبل الفجر، ثم أقام ... افعلوا كما كنتم تفعلون ... فكذلك فافعلوا لمن نام أو نسي
  - motif: trench-missed-prayers-each-with-iqama-before-fighting-verse
    refs:
    - Jāmiʿ 9:1205.1
    note: شَغَلَنا المشركون يوم الخندق عن صلاة الظهر حتَّى غربتِ الشمسُ، وذلك قبل أن ينزل في القتال ما نزل ... فأقام لصلاة الظهر ... ثم أقام للعصر ... ثم أذَّن للمغرب
