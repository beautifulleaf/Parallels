    refs:
    - Jāmiʿ 9:1185.1
    note: 'إذا نودي للصلاة أدْبَر الشيطان له ضراطٌ حتى لا يسمع النداء ... حتى يَخْطُر بين المرء ونفسه، يقول: أُذكر كذا أُذكر كذا ... حتى يَظَلَّ الرجُل إن يَدْرِي كم صلَّى'
  - motif: satan-flees-call-to-rawha-thirty-six-miles
    refs:
    - Jāmiʿ 9:1188.1
    note: إن الشيطان إذا سمع النداء بالصلاة ذهب حتى يكون مكان الرَّوْحاء ... هي من المدينة ستة وثلاثون ميلًا
