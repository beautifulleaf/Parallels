    refs:
    - Jāmiʿ 9:1130.1
    - Jāmiʿ 9:1130.2
    note: 'الصوم جُنّة، والصدقة تطفئ الخطيئة، والصلاة قربان - أو قال -: برهان ... والصدقة تطفئ الخطيئة كما يطفيء الماء النار'
  - motif: flesh-grown-from-unlawful-gain-fire-fitter-for-it
    refs:
