  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: One rakʿa before sunrise or sunset catches the prayer
  read:
  - Jāmiʿ 9:1178.2-1179.1
  quran: []
