    note: ما من ثلاثة في قرية لا يؤذَّنُ ولا تُقام فيهم الصلاة، إلا استحوذ عليهم الشيطان، فعليك بالجماعة، فإن الذئب يأكل القاصية
- id: hadith-9-satan-flees-the-call
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Satan turns tail at the call breaking wind, returns to whisper; flees as far as al-Rawḥāʾ
