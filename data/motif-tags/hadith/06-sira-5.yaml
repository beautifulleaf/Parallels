new_motifs:
  raid-watchword-amit-amit: {label: "The night-raid watchword is 'Kill! Kill!' (amit, amit)", cluster: warfare}
  captive-girl-requested-and-used-as-ransom: {label: "The prophet twice asks a warrior to give him a captive girl, then sends her to Mecca to ransom Muslim prisoners", cluster: warfare}
  arrow-shot-between-fugitives-and-mountain: {label: "An archer shoots an arrow between fleeing women and children and the mountain, and they stop", cluster: warfare}
  killing-one-who-said-la-ilaha-illa-llah: {label: "A man who says 'no god but God' as the sword is raised is killed; the prophet rebukes the killer", cluster: law}
  did-you-split-open-his-heart: {label: "'Did you split his heart open to know whether he said it?' (afala shaqaqta 'an qalbihi)", cluster: law}
  what-will-you-do-with-the-shahada-on-judgment-day: {label: "Repeated question: 'What will you do with No god but God when it comes on the day of resurrection?'", cluster: eschatology}
  commander-orders-troops-into-fire: {label: "An angry commander has his men gather wood, light a fire and orders them to enter it; they refuse and it dies down", cluster: law}
  obedience-only-in-what-is-right: {label: "Obedience is only in what is right (al-ta'a fi l-ma'ruf); obey no one who commands disobedience to God", cluster: law}
  commander-jest-to-leap-into-fire: {label: "A jesting commander bids his men leap into a fire, then stops them: 'I was only joking'", cluster: warfare}
  feet-wrapped-in-rags-names-the-raid: {label: "Six men share one camel; their feet are torn and nails fall off; they wrap them in rags, naming the raid Dhat al-Riqa'", cluster: warfare}
  sword-drawn-on-sleeping-prophet-who-will-protect-you: {label: "A bedouin draws the sleeping prophet's sword hung on a tree: 'Who will protect you from me?' - 'God'; he is not punished", cluster: prophecy}
  fear-prayer-imam-four-people-two: {label: "In the fear prayer the prophet prays two rak'as with each group: four for him, two for the people", cluster: ritual}
  fear-prayer-groups-alternate-imam-waits: {label: "In the fear prayer one group prays a rak'a with the imam, completes alone while he waits standing (or sitting), then the other group comes", cluster: ritual}
  umra-pilgrim-screened-from-meccans: {label: "On the umra the companions screen the prophet so no Meccan can hit him with anything", cluster: ritual}
  raml-three-circuits-to-show-strength: {label: "Weakened by Yathrib's fever, the pilgrims trot (raml) the first three circuits and walk between the two corners, to show the watching Meccans their strength", cluster: ritual}
  umra-in-rajab-denied: {label: "Ibn Umar says one of the prophet's umras was in Rajab; Aisha denies he ever made umra in Rajab", cluster: ritual}
  marriage-in-ihram-disputed: {label: "Reports differ whether the prophet married Maymuna while in ihram or when both were free of it (halal), at Sarif", cluster: law}
  treaty-title-messenger-of-god-erased: {label: "The opponents refuse 'Muhammad, messenger of God' in the treaty; Ali will not erase it, so the prophet writes 'Muhammad son of Abdallah' himself", cluster: treaty}
  orphan-girl-custody-to-maternal-aunt: {label: "Three kinsmen dispute custody of Hamza's orphan daughter; she is given to her maternal aunt: 'the maternal aunt is in the place of the mother'", cluster: law}
  three-commanders-named-in-succession: {label: "The prophet names three commanders in succession: if Zayd is killed, Ja'far; if Ja'far is killed, Abdallah b. Rawaha", cluster: warfare}
  martyr-with-ninety-odd-wounds-none-in-back: {label: "The fallen commander has ninety-odd (or fifty) spear and arrow wounds, none in his back", cluster: warfare}
  martyr-called-man-of-two-wings: {label: "The son of the fallen commander is greeted as 'son of the one with two wings' (ibn dhi l-janahayn)", cluster: afterlife}
  warrior-hamstrings-own-horse-before-death: {label: "The commander leaps from his horse and hamstrings it, then fights until killed", cluster: warfare}
  warrior-poem-urging-own-soul-to-paradise: {label: "The hesitating warrior addresses his soul in verse ('O soul, if you are not killed you will die'), throws away a bite of meat and fights till killed", cluster: warfare}
  mourners-praise-answered-are-you-so: {label: "As his sister wails his praises, the fainting man is asked of each praise 'Are you so?' (anta kadhalika)", cluster: mourning}
  death-of-commanders-announced-before-news: {label: "The prophet announces the commanders' deaths one by one, eyes streaming, before the news arrives", cluster: prophecy}
  sword-of-gods-swords: {label: "The leader who took the banner without appointment is called 'a sword of God's swords' (sayf min suyuf allah)", cluster: warfare}
  nine-swords-broken-in-one-hand: {label: "Nine swords break in the warrior's hand in one battle; only a Yemeni blade remains", cluster: warfare}
  throw-dust-in-wailers-mouths: {label: "Told the women of the dead will not stop weeping, the prophet says 'throw dust in their mouths'", cluster: mourning}
  killers-claim-to-spoils-withheld-by-commander: {label: "The commander takes a slain enemy's rich spoils from the killer; the prophet orders them returned, then revokes it: 'Will you leave me my commanders?'", cluster: law}
  hide-shield-and-hamstrung-horse-of-roman: {label: "A Yemeni auxiliary makes a shield of camel hide, hides behind a rock and hamstrings the gilded Roman horseman's horse", cluster: warfare}
  good-wealth-for-the-good-man: {label: "'How good is righteous wealth for a righteous man!' to one who says he did not convert for money", cluster: ethics}
  no-fires-lest-enemy-see-numbers: {label: "The commander forbids his men to light fires, lest the enemy see how few they are, and forbids pursuit; the prophet approves", cluster: warfare}
  most-beloved-person-aisha-then-her-father: {label: "Asked who is dearest to him the prophet says 'Aisha'; of men, 'her father', then Umar", cluster: sira}
  tayammum-for-fear-of-cold-quoting-verse: {label: "A commander in janaba on a cold night does tayammum and leads prayer, citing 'Do not kill yourselves'; the prophet laughs and says nothing", cluster: purity}
  shares-of-twelve-camels-and-bonus-camel: {label: "Raid shares are twelve or eleven camels each, and each man is given one extra camel (nafl)", cluster: warfare}
  greeting-of-peace-ignored-man-killed: {label: "A man passing on his camel greets the raiders with peace; one of them kills him for an old grudge and takes his camel, goods and milk-skin", cluster: law}
  ally-poem-appeal-for-help: {label: "An ally rides to the prophet and recites a poem invoking the old alliance: 'they slew us bowing and prostrating'", cluster: treaty}
  cloud-portends-victory: {label: "A passing cloud is said to 'pour forth with victory' for the wronged tribe", cluster: prophecy}
  drink-in-view-to-break-fast: {label: "On the march the prophet raises a cup so all can see and drinks, breaking his fast; those who keep fasting are called 'the disobedient'", cluster: ritual}
  quick-gait-cuts-the-land: {label: "Weary walkers are told to use a quick gait (nasl), which 'cuts the land' and lightens them", cluster: warfare}
  campaign-destination-concealed: {label: "The prophet orders preparation but names no destination; even his household does not know", cluster: warfare}
  letter-hidden-in-womans-hair: {label: "A woman courier carries a warning letter to Mecca hidden in her braids; riders sent to a named meadow threaten to strip her and she produces it", cluster: warfare}
  badr-veterans-told-do-what-you-will: {label: "The informer is spared: perhaps God looked on the people of Badr and said 'Do what you will, I have forgiven you'", cluster: theology}
  ten-thousand-march-in-ramadan: {label: "The army of ten thousand marches in Ramadan, fasting, and breaks the fast at al-Kadid", cluster: warfare}
  enemy-scout-sees-camp-fires: {label: "The enemy chief at night sees a camp's countless fires ('like the fires of Arafa') and cannot believe whose they are", cluster: warfare}
  night-rider-on-prophets-white-mule: {label: "The prophet's uncle rides his white mule at night to find someone to warn the city; recognised by the mule, he passes the camp-fires", cluster: sira}
  enemy-chief-held-at-defile-to-watch-army-pass: {label: "The enemy chief is held at the narrow of the valley while the tribes pass under their banners; he asks of each 'who are these?'", cluster: warfare}
  safe-in-his-house-closed-door-or-mosque: {label: "Amnesty: whoever enters Abu Sufyan's house, closes his door, lays down arms or enters the mosque is safe", cluster: warfare}
  wife-seizes-chiefs-moustache: {label: "When the chief announces the amnesty his wife seizes his moustache: 'Kill this fat greasy fellow!'", cluster: sira}
  idol-struck-in-the-eye-with-bow: {label: "The prophet strikes an idol beside the House in the eye with the end of his bow, saying 'The truth has come and falsehood has vanished'", cluster: polemic}
  living-and-dying-with-the-ansar: {label: "To the Ansar who fear he will stay in his town: 'my life is your life and my death is your death'", cluster: sira}
  enemy-mowed-down-like-harvest: {label: "'When you meet them tomorrow, mow them down' (tahsuduhum hasdan), with a gesture of the hand", cluster: warfare}
  kinsman-refused-then-admitted-on-threat-to-wander: {label: "A cousin refused audience threatens to take his small son and wander until both die of thirst and hunger; the prophet relents", cluster: sira}
  you-drove-me-away-every-driving: {label: "When the poet recites 'he who was driven every driving has led me to God', the prophet strikes his chest: 'You drove me every driving!'", cluster: sira}
  satire-worse-than-arrows: {label: "'Satirize Quraysh: it is harder on them than a volley of arrows'", cluster: polemic}
  poet-tongue-like-lion-tail: {label: "The poet thrusts out and wags his tongue: 'the lion that strikes with its tail'; 'I will cut them with my tongue as leather is cut'", cluster: polemic}
  holy-spirit-supports-poet: {label: "'The holy spirit (ruh al-qudus) does not cease to support you as long as you defend God and his messenger' (to Hassan)", cluster: theology}
  camp-where-they-swore-unbelief: {label: "The victors will camp at al-Khayf, where the enemy swore their pact of unbelief", cluster: sira}
  muslim-does-not-inherit-from-unbeliever: {label: "'Has Aqil left us any house?' - 'The believer does not inherit from the unbeliever, nor the unbeliever from the believer'", cluster: law}
  entry-from-upper-pass: {label: "The prophet enters the city from Kada', the upper pass", cluster: sira}
  conqueror-enters-in-black-turban-without-ihram: {label: "The prophet enters the sacred city with a helmet, then a black turban, not in ihram", cluster: ritual}
  enemy-clinging-to-kaba-curtains-killed: {label: "A condemned man clings to the curtains of the Ka'ba; the order is 'kill him'", cluster: law}
  surah-recited-with-trilled-voice-on-camel: {label: "On his camel the prophet recites Surat al-Fath with a trilled voice (tarji'), 'a-a-a' three times", cluster: ritual}
  day-of-slaughter-corrected-to-day-of-honouring: {label: "A commander's 'today is the day of slaughter, the Ka'ba made lawful' is corrected: 'a day God honours the Ka'ba, a day it is clothed'", cluster: temple}
  circumambulation-on-camel-touching-corner-with-stick: {label: "The prophet circles the House seven times on his camel, touching the corner with a crooked stick (mihjan)", cluster: ritual}
  wooden-dove-in-kaba-broken: {label: "Inside the Ka'ba he finds a dove made of sticks, breaks it with his hand and throws it away", cluster: polemic}
  three-hundred-sixty-idols-round-house: {label: "Three hundred and sixty idols stand round the House; he jabs them with a stick (or they are thrown on their faces) reciting 'the truth has come'", cluster: polemic}
  abraham-image-with-divining-arrows: {label: "Images of Abraham (and Ishmael, Isaac, Mary) in the Ka'ba hold divining arrows: 'they knew he never cast lots with them'", cluster: polemic}
  angels-do-not-enter-house-with-image: {label: "'Angels do not enter a house in which there is an image'", cluster: theology}
  images-daubed-with-saffron: {label: "The prophet calls for saffron and smears it over the statues", cluster: polemic}
  conquered-called-the-freed-ones: {label: "The people of Mecca are called 'the freed ones' (al-tulaqa'), Thaqif 'the emancipated' (al-'utaqa')", cluster: sira}
  no-qurashi-killed-bound-after-today: {label: "'No Qurashi will be killed bound (sabran) after this day'; 'this town will not be raided again'", cluster: law}
  renamed-asi-to-muti: {label: "A man named al-'Asi ('disobedient') is renamed Muti' ('obedient')", cluster: sira}
  no-alliance-in-islam-old-alliance-strengthened: {label: "'No alliance (hilf) in Islam; any alliance of the Jahiliyya Islam only strengthens'", cluster: treaty}
  conquest-sermon-legal-list: {label: "Conquest sermon lists rulings: no believer killed for an unbeliever, unbeliever's blood-money half, no shighar, alms taken at their homes, the least of them grants protection", cluster: law}
  child-belongs-to-the-bed-adulterer-the-stone: {label: "'The child belongs to the bed, and for the fornicator the stone (al-athlab)'", cluster: law}
  fingers-ten-camels-head-wounds-five: {label: "Blood-money: for each finger ten (camels), for each wound baring the bone (muwaddiha) five", cluster: law}
  heavy-blood-money-forty-pregnant: {label: "For quasi-deliberate killing with whip or stick: a hundred camels, forty of them pregnant", cluster: law}
  privileges-under-my-feet-except-keys-and-water: {label: "Every Jahiliyya claim of blood or honour is 'under these two feet of mine', except custody of the House and giving water to pilgrims", cluster: law}
  sanctity-lifted-for-an-hour-of-a-day: {label: "Mecca was made sacred by God, not people; fighting was allowed to the prophet for an hour of a day and its sanctity returned", cluster: temple}
  sacred-town-rules-trees-game-lost-property: {label: "In the sacred town: its thorn not cut, game not startled, grass not pulled, lost property picked up only to announce it", cluster: temple}
  idhkhir-grass-excepted: {label: "Al-Abbas asks an exception for idhkhir grass, used for smiths and graves and houses; 'except idhkhir'", cluster: temple}
  elephant-held-back-from-mecca: {label: "'God held back the Elephant from Mecca and gave dominion over it to his messenger'", cluster: theology}
  write-it-for-abu-shah: {label: "A Yemeni asks for the sermon in writing: 'Write it for Abu Shah'", cluster: revelation}
  sale-of-wine-carrion-pig-idols-forbidden: {label: "Sale of wine, carrion, swine and idols forbidden; carrion fat may not be sold even for caulking ships, oiling hides or lamps", cluster: law}
  jews-melted-forbidden-fat-and-sold-it: {label: "'God curse the Jews: when he forbade them the fat they melted it, sold it and ate its price'", cluster: law}
  boy-of-six-leads-prayer-cloak-too-short: {label: "A boy of six or seven, who knew most Quran from passing riders, leads his tribe's prayer; his short cloak bares him at prostration", cluster: ritual}
  arabs-wait-on-outcome-to-convert: {label: "The Arabs delay conversion: 'leave him and his people; if he prevails he is a true prophet'", cluster: sira}
  emigration-has-passed-pledge-for-islam-and-jihad: {label: "'Emigration has gone with its people'; the pledge is now on Islam, jihad and good", cluster: law}
  women-pledge-by-word-no-handshake: {label: "The prophet never touched a woman's hand in the pledge: 'my word to a hundred women is as my word to one'", cluster: law}
  woman-puts-hand-on-head-at-pledge: {label: "At the clause 'not commit adultery' the pledging woman puts her hand on her head for shame", cluster: law}
  blind-father-on-mountain-reads-army: {label: "A blind old man is led up a mountain; his daughter describes black masses and a running man, and he reads them as cavalry and its marshal", cluster: sira}
  white-hair-dyed-avoid-black: {label: "An old convert's hair is white as thaghama blossom: 'change it, and avoid black'", cluster: ritual}
  silver-collar-snatched-from-girl: {label: "A man snatches a silver collar from a girl's neck; her brother's public appeal returns nothing: 'reckon it with God'", cluster: sira}
  wife-may-take-from-miserly-husband: {label: "A wife of a miserly man may feed her children from his wealth 'only in what is right (bi-l-ma'ruf)'", cluster: law}
  no-spoils-taken-at-conquest: {label: "Asked whether they took spoils on the day of the conquest: 'No'", cluster: law}
  womans-protection-honoured: {label: "'We grant protection to whom you have granted protection, Umm Hani'", cluster: law}
  eight-rakat-forenoon-prayer: {label: "After bathing behind a screen held by his daughter, the prophet prays eight rak'as in the forenoon, lightly but completing bowing and prostration", cluster: ritual}
  prophet-may-not-signal-with-eye: {label: "'It does not befit a prophet to have a treacherous eye (kha'inat al-a'yun)': he would not signal a killing with his eye", cluster: prophecy}
  prayer-inside-kaba-with-three: {label: "The prophet enters the Ka'ba with Usama, Bilal and Uthman b. Talha, stays long and prays; Ibn Umar forgot to ask how many rak'as", cluster: ritual}
  takbir-in-kaba-corners-no-prayer: {label: "He said takbir in the corners of the House and did not pray in it (report of Ibn Abbas)", cluster: ritual}
  would-cut-hand-of-own-daughter: {label: "'If Fatima daughter of Muhammad stole I would cut off her hand'; earlier peoples spared the noble thief", cluster: law}
  intercession-in-hadd-rebuked: {label: "'Do you intercede in a hadd of God?' to the beloved companion sent to plead for a noble thief", cluster: law}
  nineteen-days-praying-two: {label: "The prophet stays nineteen days in Mecca shortening the prayer to two rak'as", cluster: ritual}
  all-prayers-with-one-ablution-on-purpose: {label: "On the day of conquest he prays all the prayers with one ablution and wipes his khuffs: 'I did it on purpose'", cluster: purity}
  only-god-punishes-with-fire: {label: "An order to burn two men is withdrawn: 'none punishes with fire but God (the Lord of the fire)'; kill them instead", cluster: law}
  goddess-shrine-cut-down-naked-woman-killed: {label: "The idol-shrine's trees are cut and house wrecked, but 'you have done nothing'; returning, the destroyer meets a naked woman with loosened hair throwing dust on her head and kills her: 'that was al-Uzza'", cluster: polemic}
  saba-na-instead-of-aslamna: {label: "A tribe cannot say 'we have submitted' and says 'we have changed religion (saba'na)'; they are killed and captured", cluster: law}
  i-am-quit-before-you-of-what-khalid-did: {label: "The prophet raises his hands: 'O God, I am quit before you of what Khalid did', twice", cluster: law}
  captive-lover-greets-beloved-before-beheading: {label: "A bound captive asks to be led to a woman, greets her in verse ('be safe, Hubaysh'), is beheaded, and she dies over him", cluster: love}
  was-there-no-merciful-man: {label: "'Was there not among you a merciful man?'", cluster: ethics}
  borrowed-armour-guaranteed: {label: "A hundred coats of mail borrowed from an unbeliever: 'not seized, a guaranteed loan ('ariya madmuna)'", cluster: law}
  enemy-brings-women-children-and-herds-to-battle: {label: "The enemy draws up in rows: horses, fighters, women behind, then sheep, then camels", cluster: warfare}
  army-flees-prophet-left-alone-calls-ansar: {label: "The army flees; the prophet, left almost alone, calls right and left 'O Ansar!' and they answer 'Here we are'", cluster: warfare}
  i-am-the-prophet-no-lie-son-of-abd-al-muttalib: {label: "On his white mule facing the enemy: 'I am the prophet, no lie; I am the son of Abd al-Muttalib'", cluster: warfare}
  call-to-companions-of-the-tree: {label: "The loud-voiced uncle calls 'Where are the companions of the Samura (tree)?'; they turn back like cows to their calves", cluster: warfare}
  the-oven-is-hot: {label: "'Now the oven is hot (hamiya l-watis)'", cluster: warfare}
  handful-of-dust-shahat-al-wujuh: {label: "The prophet throws pebbles or a handful of earth at the enemy - 'may the faces be disfigured' - and every eye is filled with dust", cluster: prophecy}
  hamstrung-camel-of-standard-bearer: {label: "The enemy standard-bearer on a red camel is felled by hamstringing the camel and cutting his leg", cluster: warfare}
  spy-joins-meal-then-flees: {label: "A stranger hobbles his red camel, eats with the troops and studies their weakness, then rides off; he is caught and beheaded, his gear given to the killer", cluster: warfare}
  sentry-who-never-dismounted: {label: "A night sentry posted on a mountain pass who never dismounted except to pray or relieve himself: 'you have made it obligatory; no harm if you do nothing after'", cluster: warfare}
  spoils-to-killer-with-proof: {label: "'Whoever has killed a man and has proof, his spoils (salab) are his'", cluster: law}
  lion-of-gods-lions: {label: "'He will not take from a lion of God's lions who fights for God and his messenger and give you his spoils'", cluster: warfare}
  woman-carries-dagger-to-rip-belly: {label: "A woman carries a dagger 'to rip open the belly' of any enemy who comes near; the prophet laughs", cluster: warfare}
  valiant-fighter-of-fire-kills-himself: {label: "A man who fought fiercely is declared 'of the people of the fire'; wounded, he kills himself; 'God supports this religion with a wicked man'", cluster: eschatology}
  dying-commander-names-his-killer-and-asks-forgiveness: {label: "A commander shot in the knee points out his killer, has the arrow drawn (water flows), sends greeting and a plea for forgiveness, and dies", cluster: warfare}
  captive-wives-lawful-after-waiting-period: {label: "Captive women with living husbands become lawful after their waiting period ('except what your right hands possess')", cluster: law}
  watering-anothers-crop-forbidden: {label: "'Let him not water another's crop with his water' - no intercourse with pregnant captives; a captive non-virgin only after istibra'", cluster: law}
  booty-mount-and-garment-not-used-up: {label: "Do not ride a beast of the spoils till it is lean, nor wear a garment of the spoils till worn out, then return it", cluster: law}
  siege-lifted-men-cheered: {label: "Told 'we leave tomorrow', the men protest; sent to fight and wounded, they welcome it, and the prophet laughs", cluster: warfare}
  effeminate-man-describes-woman-barred: {label: "An effeminate man describes a woman ('she comes with four, goes with eight'); such men are barred from the women's quarters", cluster: law}
  arrow-reaching-target-a-degree-in-paradise: {label: "'Whoever reaches (the enemy) with an arrow has a degree in paradise'; the narrator shot sixteen", cluster: warfare}
  slaves-coming-over-freed: {label: "Slaves who come down from the besieged fort are freed: 'he is God's freedman and his messenger's freedman'", cluster: law}
  claiming-false-father-paradise-forbidden: {label: "'Whoever claims a father other than his own, knowing it, paradise is forbidden him'", cluster: law}
  pray-guidance-for-enemy-not-curse: {label: "Asked to curse the archers of Thaqif: 'O God, guide Thaqif'", cluster: prayer}
  ansar-shirt-people-outer-cloak: {label: "'The Ansar are the inner garment (shi'ar), the people the outer (dithar)'; if people took a valley he would take the Ansar's", cluster: sira}
  others-take-sheep-you-take-the-prophet: {label: "'Are you not content that people go off with sheep and camels and you with the prophet to your homes?'", cluster: sira}
  meet-me-at-the-basin: {label: "'You will meet selfishness after me; be patient until you meet me at the Basin (al-hawd)'", cluster: eschatology}
  moses-was-hurt-more-and-endured: {label: "Accused of unjust division: 'Who is just if God and his messenger are not? May God have mercy on Moses: he was hurt with more than this and endured'", cluster: prophecy}
  gifts-to-the-anxious-heart: {label: "'I give to people for the anxiety and greed in their hearts, and leave others to the richness God put in their hearts'", cluster: ethics}
  hundred-camels-to-chiefs-hearts-won: {label: "Chiefs are given a hundred camels each to win their hearts; one who hated the prophet comes to love him most", cluster: sira}
  captives-or-wealth-choose-one: {label: "The returning enemy delegation must choose captives or wealth; the people's chiefs ('urafa') confirm each man's consent", cluster: law}
  cloak-snatched-by-thorn-tree: {label: "Pressed for the spoils, the prophet is forced against a thorn tree that snatches his cloak; 'if I had cattle as many as the trees of Tihama'", cluster: sira}
  needle-and-thread-ghulul: {label: "Return even the needle and thread: stolen spoils (ghulul) are shame, fire and disgrace on the day of resurrection", cluster: law}
  camel-hair-tuft-only-fifth: {label: "Holding a tuft of camel hair: 'I have of this booty only the fifth, and the fifth is returned to you'", cluster: law}
  water-from-prophets-mouth-poured-on-faces: {label: "The prophet washes and spits into a cup of water and bids two companions drink and pour it on faces and chests; a wife behind the curtain asks for the rest", cluster: ritual}
  pursuers-horse-sinks-and-smoke-rises: {label: "The pursuer's divining arrows twice say 'do not harm him'; his horse stumbles, its forelegs sink in the ground and smoke rises; he asks for a written safe-conduct", cluster: prophecy}
  day-of-keeping-faith: {label: "Presenting the old writ: 'Today is a day of keeping faith and of goodness'", cluster: treaty}
  digging-well-and-equipping-army-for-paradise: {label: "'Whoever digs the well of Ruma has paradise; whoever equips the army of hardship has paradise'", cluster: ethics}
  thousand-dinars-poured-in-lap: {label: "A thousand dinars poured into the prophet's lap: 'nothing he does after today will harm him'", cluster: ethics}
  oath-not-to-mount-then-mounts: {label: "Angry, the prophet swears he will not give mounts; then he gives six camels, saying God gave them", cluster: law}
  position-of-aaron-to-moses: {label: "Left behind with women and children: 'Are you not content to be to me as Aaron to Moses, except there is no prophet after me?'", cluster: prophecy}
  setting-out-on-thursday: {label: "The prophet liked to set out on Thursday", cluster: sira}
  share-in-booty-for-a-mount: {label: "A latecomer rides on an Ansari's camel for his share of the spoils; the Ansari returns the camels: 'it was not your share we wanted'", cluster: warfare}
  biter-loses-tooth-no-compensation: {label: "A man bites another's hand; the bitten pulls free, knocking out a front tooth; no compensation: 'should he leave his hand in your mouth like a stallion's?'", cluster: law}
  leftovers-on-leather-mat-multiplied: {label: "Leftover handfuls of corn, dates and crusts on a leather mat are blessed until every vessel is filled", cluster: prophecy}
  two-testimonies-without-doubt-paradise: {label: "'No servant meets God with these two (testimonies), without doubt, and is kept from paradise'", cluster: theology}
  prayer-carry-on-land-and-sea: {label: "Blowing on the weary mounts: 'carry on them the strong and weak, wet and dry, on land and sea'; later fulfilled in the sea-raid to Cyprus", cluster: prophecy}
  thirst-camel-stomach-water-drunk: {label: "So great the thirst that men slaughter camels to squeeze and drink the water of the stomach", cluster: warfare}
  rain-cloud-over-camp-only: {label: "At prayer a cloud rains until all vessels are filled, and goes no further than the camp", cluster: prophecy}
  masked-riders-plot-at-mountain-pass: {label: "Masked riders try to frighten the prophet's camel off the mountain pass (al-'Aqaba); fourteen or fifteen, twelve of them 'at war with God'", cluster: polemic}
  those-who-reached-water-first-cursed: {label: "Ordered that none reach the scarce water before him, he finds some there first and curses them", cluster: sira}
  lost-camel-location-revealed: {label: "A hypocrite mocks: 'he tells you heaven's news and does not know where his camel is'; the prophet: 'I know only what God teaches me' - the camel is held by a tree in a named ravine", cluster: prophecy}
  do-not-enter-dwellings-of-wrongdoers-except-weeping: {label: "'Do not enter the dwellings of those who wronged themselves unless weeping, lest what befell them befall you'", cluster: ritual}
  greater-wonder-a-man-from-yourselves: {label: "'A greater wonder: a man from among yourselves tells you what was before you and what will be after you'", cluster: prophecy}
  garden-yield-estimated-ten-wasqs: {label: "The prophet estimates a woman's garden at ten wasqs; on the return it yields ten", cluster: prophecy}
  storm-wind-carries-man-to-tayy-mountains: {label: "'A violent wind tonight: let no one stand'; one who stood is carried to the mountains of Tayy", cluster: prophecy}
  ranking-of-ansar-clans: {label: "Best houses of the Ansar ranked: Najjar, Abd al-Ashhal, al-Harith b. al-Khazraj, Sa'ida; 'in all is good'", cluster: sira}
  this-is-taba: {label: "Sighting Medina: 'This is Taba'", cluster: sira}
units:
  - id: hadith-48-raid-on-fazara
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Abu Bakr's raid on Fazara; the captive girl ransomed; the watchword amit
    read: ["Jāmiʿ 48:5444.1-5445.1"]
    quran: []
    tags:
      - {motif: arrow-shot-between-fugitives-and-mountain, refs: ["Jāmiʿ 48:5444.1"], note: "فرميت بسهم بينهم وبين الجبل، فلما رأوا السهم وقفوا"}
      - {motif: captive-girl-requested-and-used-as-ransom, refs: ["Jāmiʿ 48:5444.1"], note: "يا سلمة! هب لي المرأة ... فبعث بها رسول الله ﷺ إلى أهل مكة، ففدى بها ناسا من المسلمين"}
      - {motif: raid-watchword-amit-amit, refs: ["Jāmiʿ 48:5445.1"], note: "وكان شعارنا تلك الليلة: أمت، أمت ... سبعة أهل أبيات"}
  - id: hadith-48-killing-after-the-shahada
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Usama kills a man who said 'no god but God'
    read: ["Jāmiʿ 48:5445.2-5446.1"]
    quran: []
    tags:
      - {motif: killing-one-who-said-la-ilaha-illa-llah, refs: ["Jāmiʿ 48:5445.2", "Jāmiʿ 48:5446.1"], note: "أَقَتَلْتَهُ بَعْدَ مَا قَالَ لَا إِلَهَ إِلَّا اللَّهُ ... كَانَ مُتَعَوِّذًا"}
      - {motif: what-will-you-do-with-the-shahada-on-judgment-day, refs: ["Jāmiʿ 48:5446.1"], note: "فكيف تصنع بلا إله إلا الله إذا جاءت يوم القيامة"}
  - id: hadith-48-obedience-and-the-fire
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: The commander who ordered his men into a fire; obey in what is right
    read: ["Jāmiʿ 48:5447.1-5447.3"]
    quran: ["4:59"]
    tags:
      - {motif: commander-orders-troops-into-fire, refs: ["Jāmiʿ 48:5447.2"], note: "فَاجْمَعُوا لِي حَطَبًا ... أَوْقِدُوا نَارًا ... ادْخُلُوهَا ... فَرَرْنَا إِلَى النَّبِيِّ ﷺ مِنَ النَّارِ"}
      - {motif: obedience-only-in-what-is-right, refs: ["Jāmiʿ 48:5447.2", "Jāmiʿ 48:5447.3"], note: "لَوْ دَخَلُوهَا مَا خَرَجُوا مِنْهَا إِلَى يَوْمِ الْقِيَامَةِ، الطَّاعَةُ فِي الْمَعْرُوفِ؛ من أمركم منهم بمعصية الله فلا تطيعوه"}
      - {motif: commander-jest-to-leap-into-fire, refs: ["Jāmiʿ 48:5447.3"], note: "أعزم عليكم بحقي وطاعتي لما تواثبتم في هذه النار ... فإنما كنت أمزح معكم"}
    hints:
      - "Men ordered into a fire who refuse and are vindicated, against Dan 3:16-27, where the three refuse the king's image and are thrown into the furnace: here it is the commander's order that is refused, and entering would have been damnation."
  - id: hadith-48-dhat-al-riqa
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Why the raid was called Dhat al-Riqa'
    read: ["Jāmiʿ 48:5450.1"]
    quran: []
    tags:
      - {motif: feet-wrapped-in-rags-names-the-raid, refs: ["Jāmiʿ 48:5450.1"], note: "سِتَّةُ نَفَرٍ، بَيْنَنَا بَعِير نَعْتَقِبُهُ ... وَسَقَطَتْ أَظْفَارِي ... فَسُمِّيَتْ غَزْوَةَ ذَاتِ الرِّقَاعِ"}
  - id: hadith-48-sword-under-the-tree
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: The bedouin draws the sleeping prophet's sword; the fear prayer at Dhat al-Riqa'
    read: ["Jāmiʿ 48:5450.2-5451.1"]
    quran: []
    tags:
      - {motif: sword-drawn-on-sleeping-prophet-who-will-protect-you, refs: ["Jāmiʿ 48:5450.2", "Jāmiʿ 48:5451.1"], note: "تَحْتَ سَمُرَةٍ، فَعَلَّقَ بِهَا سَيْفَهُ ... مَنْ يَمْنَعُكَ مِنِّي؟ قُلْتُ: اللَّهُ ... ثُمَّ لَمْ يُعَاقِبْهُ"}
      - {motif: fear-prayer-imam-four-people-two, refs: ["Jāmiʿ 48:5451.1"], note: "فكانت لرسول الله ﷺ أربع ركعات. وللقوم ركعتان"}
  - id: hadith-48-forms-of-the-fear-prayer
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: The forms of the fear prayer
    read: ["Jāmiʿ 48:5451.2-5452.2"]
    quran: []
    tags:
      - {motif: fear-prayer-groups-alternate-imam-waits, refs: ["Jāmiʿ 48:5451.2", "Jāmiʿ 48:5451.3", "Jāmiʿ 48:5452.1"], note: "فصلى بالتي معه ركعة، ثم ثبت قائمًا، وأتموا لأنفسهم ... ثم ثبت جالسًا، وأتموا لأنفسهم، ثم سلم بهم"}
      - {motif: fear-prayer-in-two-rows, refs: ["Jāmiʿ 48:5451.3"], note: "فصفهم خلفه صفين ... ثم تقدموا وتأخر الذين كانوا قدامهم"}
  - id: hadith-48-umra-of-fulfilment
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: The umra of fulfilment; the raml; the prophet's four umras
    read: ["Jāmiʿ 48:5453.1-5454.2", "Jāmiʿ 48:5548.1"]
    quran: []
    tags:
      - {motif: umra-pilgrim-screened-from-meccans, refs: ["Jāmiʿ 48:5453.1"], note: "فكنا نستره من أهل مكة لا يصيبه أحد بشيء"}
      - {motif: treaty-entry-next-year-three-days, refs: ["Jāmiʿ 48:5453.2"], note: "وَقَاضاهُمْ عَلَى أَنْ يَعْتَمِرَ الْعَامَ الْمُقْبِلَ، وَلَا يَحْمِلَ سِلَاحًا عَلَيْهِمْ إِلَّا سُيُوفًا ... فَلَمَّا أَنْ أَقَامَ بِهَا ثَلَاثًا أَمَرُوهُ أَنْ يَخْرُجَ"}
      - {motif: umra-in-rajab-denied, refs: ["Jāmiʿ 48:5453.3"], note: "اعتمر أربعًا: إحداهن في رجب ... وما اعتمر في رجب قط"}
      - {motif: raml-three-circuits-to-show-strength, refs: ["Jāmiʿ 48:5454.1"], note: "وهنتهم حمى يثرب ... أن يرملوا ثلاثة أشواط، ويمشوا ما بين الركنين، ليرى المشركون جلدهم"}
      - {motif: four-umras-in-dhul-qada, refs: ["Jāmiʿ 48:5454.2", "Jāmiʿ 48:5548.1"], note: "اعتمر رسول الله ﷺ أربع عمر، كلهن في ذي القعدة، إلا التي كانت مع حجته"}
  - id: hadith-48-marriage-of-maymuna
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Maymuna married in or out of ihram
    read: ["Jāmiʿ 48:5454.3-5455.2"]
    quran: []
    tags:
      - {motif: marriage-in-ihram-disputed, refs: ["Jāmiʿ 48:5454.3", "Jāmiʿ 48:5454.4", "Jāmiʿ 48:5455.1", "Jāmiʿ 48:5455.2"], note: "تزوجني النبي ﷺ ونحن حلالان بسرف؛ تزوج النبي ﷺ ميمونة وهو محرم، وبنى بها وهو حلال، وماتت بسرف"}
  - id: hadith-48-treaty-text-and-hamzas-daughter
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: The treaty written without 'messenger of God'; custody of Hamza's daughter
    read: ["Jāmiʿ 48:5456.1"]
    quran: ["48:27"]
    tags:
      - {motif: treaty-title-messenger-of-god-erased, refs: ["Jāmiʿ 48:5456.1"], note: "امْحُ رَسُولَ اللَّهِ ... لَا وَاللَّهِ لَا أَمْحُوكَ أَبَدًا. فَأَخَذَ رَسُولُ اللَّهِ ﷺ الْكِتَابَ، وَلَيْسَ يُحْسِنُ يَكْتُبُ، فَكَتَبَ"}
      - {motif: treaty-entry-next-year-three-days, refs: ["Jāmiʿ 48:5456.1"], note: "عَلَى أَنْ يُقِيمَ بِهَا ثَلَاثَةَ أَيَّامٍ ... لَا يُدْخِلُ مَكَّةَ السِّلَاحَ، إِلَّا السَّيْفَ فِي الْقِرَابِ"}
      - {motif: orphan-girl-custody-to-maternal-aunt, refs: ["Jāmiʿ 48:5456.1"], note: "فَقَضَى بِهَا النَّبِيُّ ﷺ لِخَالَتِهَا وَقَالَ: الْخَالَةُ بِمَنْزِلَةِ الأُمّ"}
      - {motif: milk-kinship-bars-marriage, refs: ["Jāmiʿ 48:5456.1"], note: "إِنَّهَا ابْنَةُ أَخِي مِنَ الرَّضَاعَةِ"}
  - id: hadith-48-mutah-commanders-and-jafar
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Mu'ta - three commanders; Ja'far's wounds; Ibn Rawaha's verses
    read: ["Jāmiʿ 48:5460.1", "Jāmiʿ 48:5462.1-5464.1"]
    quran: []
    tags:
      - {motif: three-commanders-named-in-succession, refs: ["Jāmiʿ 48:5460.1", "Jāmiʿ 48:5462.2"], note: "إِنْ قُتِلَ زَيْدٌ فَجَعْفَرٌ، وَإنْ قُتِلَ جَعْفَرٌ فَعَبْدُ اللَّهِ بْنُ رَوَاحَةَ"}
      - {motif: martyr-with-ninety-odd-wounds-none-in-back, refs: ["Jāmiʿ 48:5460.1", "Jāmiʿ 48:5462.1", "Jāmiʿ 48:5462.2"], note: "بِضعًا وَتِسْعِينَ مِنْ طَعْنَةٍ وَرَمْيَةٍ؛ خمسين بين طعنة وضربة ليس منها شيء في دبره"}
      - {motif: martyr-called-man-of-two-wings, refs: ["Jāmiʿ 48:5462.3"], note: "السلام عليك يا ابن ذي الجناحين"}
      - {motif: warrior-hamstrings-own-horse-before-death, refs: ["Jāmiʿ 48:5462.4"], note: "حين اقتحم عن فرس له شقراء، فعقرها، ثم قاتل القوم، حتى قتل"}
      - {motif: warrior-poem-urging-own-soul-to-paradise, refs: ["Jāmiʿ 48:5463.1"], note: "أقسمت يا نفس لتنزلنه ... يا نفس إلا تقتلي تموتي ... وأنت في الدنيا! ثم ألقاه من يده"}
      - {motif: mourners-praise-answered-are-you-so, refs: ["Jāmiʿ 48:5464.1"], note: "واجبلاه! واكذا وكذا! تعدّد عليه ... ما قلت شيئًا إلا قيل لي: آنت كذلك"}
  - id: hadith-48-mutah-spoils-of-the-roman
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: The Yemeni auxiliary's spoils withheld by Khalid
    read: ["Jāmiʿ 48:5461.1"]
    quran: []
    tags:
      - {motif: hide-shield-and-hamstrung-horse-of-roman, refs: ["Jāmiʿ 48:5461.1"], note: "فاتخذه كهئة الدرق ... عليه سرج مذهب، وسلاح مذهب ... فعرقب فرسه، فخر وعلاه فقتله"}
      - {motif: killers-claim-to-spoils-withheld-by-commander, refs: ["Jāmiʿ 48:5461.1"], note: "قضى بالسلب للقاتل؟ قال: بلى ولكني استكثرته ... يا خالد لا ترده عليه هل أنتم تاركو لي أمرائي لكم صفوة أمرهم وعليهم كدره"}
  - id: hadith-48-mutah-news-and-the-sword
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: The deaths announced before the news; Khalid 'a sword of God'
    read: ["Jāmiʿ 48:5464.2-5465.2"]
    quran: []
    tags:
      - {motif: death-of-commanders-announced-before-news, refs: ["Jāmiʿ 48:5464.2", "Jāmiʿ 48:5464.3", "Jāmiʿ 48:5464.4"], note: "نعى زيدًا وجعفرًا، وابن رواحة للناس قبل أن يأتيهم خبرهم ... وعيناه تذرفان"}
      - {motif: sword-of-gods-swords, refs: ["Jāmiʿ 48:5464.2", "Jāmiʿ 48:5464.4"], note: "حتى أخذ الراية سيف من سيوف الله؛ ولم يكن من الأمراء هو أمّر نفسه ... اللهم هو سيف من سيوفك فانصره"}
      - {motif: nine-swords-broken-in-one-hand, refs: ["Jāmiʿ 48:5465.2"], note: "لقد انقطعت في يدي يوم مؤتة تسعة أسياف، فما بقي في يدي إلا صفيحة يمانية"}
  - id: hadith-48-mutah-grief-and-wailing
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Grief for the dead of Mu'ta; dust for the wailing women
    read: ["Jāmiʿ 48:5465.3-5466.1"]
    quran: []
    tags:
      - {motif: throw-dust-in-wailers-mouths, refs: ["Jāmiʿ 48:5465.3"], note: "فَاحْثُ فِي أَفْوَاهِهِنَّ مِنَ التُّرَابِ"}
  - id: hadith-48-dhat-al-salasil
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Amr b. al-As at Dhat al-Salasil
    read: ["Jāmiʿ 48:5467.1-5468.3"]
    quran: ["4:29"]
    tags:
      - {motif: good-wealth-for-the-good-man, refs: ["Jāmiʿ 48:5467.1"], note: "مَا أَسْلَمْتُ مِنْ أَجْلِ الْمَالِ ... يَا عَمْرُو! نِعِمَّا بالْمَال الصَّالِح لِلرجل الصَّالِحِ"}
      - {motif: most-beloved-person-aisha-then-her-father, refs: ["Jāmiʿ 48:5468.1", "Jāmiʿ 48:5468.2"], note: "أَيُّ النَّاسِ أَحَبُّ إِلَيْكَ؟ قَالَ: عَائِشَةُ. قُلْتُ: مِن الرِّجَالِ؟ قَالَ: أَبُوهَا"}
      - {motif: no-fires-lest-enemy-see-numbers, refs: ["Jāmiʿ 48:5468.2"], note: "لا يوقد أحد منهم نارًا إلا قذفته فيها ... كرهت أن آذن لهم أن يوقدوا نارًا فيرى عدوهم قلتهم"}
      - {motif: tayammum-for-fear-of-cold-quoting-verse, refs: ["Jāmiʿ 48:5468.3"], note: "احْتَلَمْتُ فِي لَيْلَةٍ بَارِدَةٍ ... فَتيَمَّمْتُ ... وَلَا تَقْتُلُوا أَنْفُسَكُمْ ... فَضَحِكَ رَسُولُ اللَّهِ ﷺ وَلَمْ يَقُلْ شَيْئًا"}
      - {motif: dry-ablution-with-earth, refs: ["Jāmiʿ 48:5468.3"], note: "فَتيَمَّمْتُ، ثُمَّ صَلَّيْتُ بِأَصْحَابِي الصُّبْحَ"}
  - id: hadith-48-najd-raid-shares
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Shares of a Najd raid
    read: ["Jāmiʿ 48:5469.1"]
    quran: []
    tags:
      - {motif: shares-of-twelve-camels-and-bonus-camel, refs: ["Jāmiʿ 48:5469.1"], note: "فكان سُهمانهم اثني عشر بعيرًا، أو أحد عشر بعيرًا، ونفّلوا بعيرًا بعيرًا"}
  - id: hadith-48-idam-greeting-killed
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Muhallim kills the man who greeted them; Q 4:94 revealed
    read: ["Jāmiʿ 48:5470.1"]
    quran: ["4:94"]
    tags:
      - {motif: greeting-of-peace-ignored-man-killed, refs: ["Jāmiʿ 48:5470.1"], note: "سلَّمَ عَلَيْنَا، فَأَمْسَكْنَا عَنْهُ، وَحَمَلَ عَلَيْهِ مُحَلَّمُ بْنُ جَثَّامَةَ، فَقَتَلَهُ بِشَيءٍ كَانَ بَيْنَهُ وَبَيْنَهُ ... وَوَطْبٌ مِنْ لَبَنٍ"}
  - id: hadith-48-khuzaas-appeal
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: The broken truce and Khuza'a's poem of appeal
    read: ["Jāmiʿ 48:5472.1-5473.1"]
    quran: []
    tags:
