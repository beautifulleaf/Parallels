      - {motif: scholar-adjured-by-who-gave-torah-admits-stoning, refs: ["Jāmiʿ 60:6932.1"], note: "أنشدك باللَّه الذي أنزل التوراة على موسى أهكذا تجدون حد الزاني في كتابكم؟ قال: لا ... نجده الرجم"}
      - {motif: penalty-spared-the-noble-applied-to-weak, refs: ["Jāmiʿ 60:6932.1"], note: "كثر في أشرافنا، فكنا إذا أخذنا الشريف، تركناه. وإذا أخذنا الضعيف، أقمنا عليه الحد"}
      - {motif: first-to-revive-a-command-they-killed, refs: ["Jāmiʿ 60:6932.1"], note: "اللهم إني أول من أحيا أمرك إذ أماتوه. فأمر به فرُجم"}
      - {motif: strong-tribe-takes-double-blood-price, refs: ["Jāmiʿ 60:6933.1"], note: "كل قتيل قتلته العزيزة من الذليلة، فديته خمسون وسقا، وكل قتيل قتلته الذليلة من العزيزة، فديته مائة وسق"}
      - {motif: spies-sent-to-learn-the-judges-ruling, refs: ["Jāmiʿ 60:6933.1"], note: "فدسوا إلى رسول اللَّه ﷺ ناسا من المنافقين ليخبروا لهم رأي رسول اللَّه ﷺ ... إن أعطاكم ما تريدون حكمتموه، وإن لم يعطكم حذرتم"}
    hints:
      - "The Torah's death penalty for adultery against Lev 20:10 and Deut 22:22-24; blackening and parading the adulterer against the Sotah ritual of m. Sotah 1:5-6 and 3:4 (the ordeal of the suspected wife)."
      - "The rabbi adjured 'by Him who gave the Torah to Moses' against the adjuration of witnesses in Lev 5:1 and m. Shevuot 4:13."
