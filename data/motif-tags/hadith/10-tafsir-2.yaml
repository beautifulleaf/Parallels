      - {motif: not-like-israel-to-moses-go-you-and-your-lord, refs: ["Jāmiʿ 60:6929.1", "Jāmiʿ 60:6930.1"], note: "إنّا لا نقول لك كما قالت بنو إسرائيل لموسى ﴿فَاذْهَبْ أَنْتَ وَرَبُّكَ فَقَاتِلَا إِنَّا هَاهُنَا قَاعِدُونَ﴾ ولكن امض ونحن معك"}
      - {motif: first-struck-by-arrow-declared-assured, refs: ["Jāmiʿ 60:6930.1"], note: "فرمي رجل من أصحابه بسَهم، فقال رسول اللَّه ﷺ: أوجب هذا"}
    hints:
      - "Israel's refusal to enter the land against Num 14:1-4 and Deut 1:26-28; the companion's reversal of the refusal sets the hadith against the spies' story."
