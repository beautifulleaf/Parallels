# Hadith chunk 10: al-Jāmiʿ al-Kāmil book 60 (tafsir), pp. 6820-6939: al-Baqara 2:271-286, Al Imran,
# al-Nisa, and al-Maida to 5:67. Read in full from the Arabic (223 hadith).
new_motifs:
  seven-shaded-on-day-without-shade: {label: "God shades seven kinds of people in his shade on the day there is no shade but his", cluster: eschatology}
  left-hand-not-know-right-hands-alms: {label: "One of the seven: a man who gives alms so secretly that his left hand does not know what his right spends", cluster: ethics}
  alms-to-polytheist-kin-permitted: {label: "Believers who disliked giving to polytheist relatives are allowed to, and a verse comes down", cluster: law}
  true-poor-is-the-one-who-refrains: {label: "The poor man is not the one turned away by a date or two, a morsel or two, but the one who refrains from asking", cluster: ethics}
  beggar-with-forty-dirhams-importunate: {label: "Whoever begs while owning forty dirhams is importunate; it is like swallowing hot sand (al-malla)", cluster: ethics}
  asking-lawful-for-three-only: {label: "Begging is lawful only for three: one who has shouldered a blood-debt, one whose property a disaster has swept away, one stricken by want; all else is unlawful gain", cluster: law}
  three-witnesses-attest-destitution: {label: "Destitution that makes begging lawful must be attested by three men of sense from the man's own people", cluster: law}
  usury-verses-recited-then-wine-trade-forbidden: {label: "When the usury verses came down the prophet went out to the mosque, recited them to the people, then forbade trade in wine", cluster: law}
  four-parties-to-usury-cursed: {label: "The eater of usury, the one who pays it, its scribe and its two witnesses are cursed alike: 'they are equal'", cluster: law}
  price-of-dog-and-blood-forbidden-tattooer-cursed: {label: "The prophet forbade the price of dogs and of blood (cupping), the tattooer and the tattooed, the eater and payer of usury, and cursed the image-maker", cluster: law}
  usury-ends-in-paucity: {label: "No one multiplies usury but his affair ends in scarcity", cluster: ethics}
  alms-raised-like-foal-to-mountain: {label: "God takes alms of a date's worth in his right hand and raises it as one raises a foal (or young camel) until it is like a mountain", cluster: theology}
  only-the-good-accepted: {label: "God accepts only what is good (lawfully earned)", cluster: ethics}
  angels-meet-the-soul-and-question-deeds: {label: "Angels meet a dead man's soul and ask whether he did any good; 'remember!'", cluster: eschatology}
  debtor-hides-in-wifes-alcove: {label: "A debtor hides in his wife's curtained couch on hearing the creditor's voice, fearing he would lie or break his promise", cluster: ethics}
  creditor-wipes-out-written-debt: {label: "The creditor brings his written record and wipes it out with his hand: 'pay if you find the means, else you are released'", cluster: ethics}
  oath-by-god-repeated-three-times: {label: "An oath exchanged as a single word, 'By God?' - 'By God', repeated three times", cluster: law}
  respite-earns-daily-alms-double-after-due: {label: "Respite to the insolvent earns alms each day, its like before the debt falls due and double after", cluster: ethics}
  last-verse-revealed: {label: "A report names the last verse (or sura) revealed", cluster: revelation}
  three-questions-left-unresolved-at-prophets-death: {label: "Umar wished the prophet had left a ruling on three things: the grandfather, the kalala and some kinds of usury", cluster: law}
  trust-verse-abrogates-debt-writing: {label: "'If you trust one another' abrogates the command to write debts down", cluster: law}
  prophet-pawns-armour-to-jew-for-food: {label: "The prophet buys food from a Jew on credit and pawns his coat of mail", cluster: sira}
  companions-kneel-protesting-unbearable-verse: {label: "The companions come and kneel, protesting that a verse lays on them what they cannot bear", cluster: revelation}
  god-answers-each-petition-yes: {label: "To each petition of the closing prayer of al-Baqara God answers 'yes' / 'I have done so'", cluster: revelation}
  verse-abrogated-by-the-next: {label: "A verse is abrogated by the verse that follows it", cluster: revelation}
  weeping-over-verse-of-reckoning: {label: "A companion weeps aloud at the verse that God will reckon what is in the soul: 'if he takes us by this we perish'", cluster: ethics}
  inner-thoughts-forgiven-until-spoken-or-done: {label: "God overlooks what his community's souls whisper to them until they act on it or speak", cluster: theology}
  beware-followers-of-ambiguous-verses: {label: "Those who pursue the ambiguous verses are the ones God named: beware of them", cluster: polemic}
  heart-between-two-fingers-of-the-merciful: {label: "Every heart lies between two of the fingers of the Lord of the worlds; he sets it straight or makes it swerve as he wills", cluster: theology}
  turner-of-hearts-make-firm: {label: "Prayer: 'O turner of hearts, make our hearts firm on your religion'", cluster: ritual}
  scale-in-the-merciful-hand-lowered-raised: {label: "The scale is in the hand of the Merciful; he lowers it and raises it", cluster: theology}
  heart-turns-faster-than-boiling-pot: {label: "The heart of the son of Adam turns faster than a cooking pot at full boil", cluster: ethics}
  soft-words-to-a-man-named-bad: {label: "The prophet calls a visitor 'a bad son of his clan', then speaks gently to him", cluster: ethics}
  worst-man-shunned-for-his-obscenity: {label: "The worst in rank before God is the one people leave alone to avoid his obscenity", cluster: ethics}
  mothers-refuge-prayer-answered: {label: "A mother's prayer to God for refuge for her daughter and her offspring from Satan is answered", cluster: christology}
  four-called-as-the-prophets-family: {label: "At the mutual-curse verse the prophet calls Ali, Fatima, Hasan and Husayn: 'O God, these are my family'", cluster: sira}
  letter-to-heraclius-quotes-common-word: {label: "The prophet's letter to Heraclius, 'great one of the Romans', quotes the verse of the common word", cluster: letters}
  submit-and-be-safe-reward-twice: {label: "'Submit and you will be safe; God will give you your reward twice; if you turn away the sin of the peasants is on you'", cluster: letters}
  abu-sufyan-hears-from-mouth-to-mouth: {label: "Abu Sufyan, in Syria during the truce, tells the story 'from his mouth to my mouth'", cluster: sira}
  false-oath-to-take-property-meets-angry-god: {label: "Whoever swears a binding false oath to cut off a Muslim's property meets God angry with him", cluster: law}
  your-proof-or-his-oath: {label: "In a property dispute the claimant is told: 'your proof, or his oath'", cluster: law}
  seller-swears-false-price-offer: {label: "A seller in the market swears he was offered more than he was, to trap a buyer", cluster: law}
  claims-not-granted-on-claim-alone: {label: "Were people given what they claim, they would claim men's blood and property", cluster: law}
  oath-on-the-defendant: {label: "The oath is on the one against whom the claim is made", cluster: law}
  accused-woman-confesses-when-verse-recited: {label: "A woman accused of piercing another's hand with an awl confesses when reminded of God and read the verse on false oaths", cluster: law}
  apostate-sent-verse-returns-penitent: {label: "An apostate Ansari who joined the polytheists is sent the verse by his people and returns penitent; the prophet accepts it", cluster: law}
  dearest-garden-given-on-hearing-verse: {label: "On hearing 'you will not attain piety until you spend of what you love', a companion gives his dearest garden facing the mosque", cluster: ethics}
  bakh-profitable-wealth: {label: "The prophet's exclamation 'bakh! that is profitable wealth', said twice", cluster: sira}
  alms-placed-among-nearest-kin: {label: "The prophet advises a gift be placed among the nearest kin; it is divided among cousins", cluster: law}
  jews-test-prophet-with-questions-only-prophet-knows: {label: "Jews put questions to the prophet that only a prophet could answer, binding themselves by God's covenant to follow him if right", cluster: polemic}
  jacob-vows-off-camel-meat-and-milk-in-sickness: {label: "Israel (Jacob), long and gravely ill, vows if healed to forbid himself his dearest food and drink: camel meat and camel milk", cluster: patriarchs}
  jacob-sciatica-vows-off-veins: {label: "Israel, suffering sciatica (ʿirq al-nasā) and crying out at night, vows if healed not to eat the veins", cluster: patriarchs}
  kaaba-and-aqsa-forty-years-apart: {label: "The Sacred Mosque was the first set on earth, then the Aqsa Mosque, forty years between them", cluster: cosmology}
  wherever-prayer-overtakes-you-is-mosque: {label: "Wherever prayer overtakes you, pray: that is a mosque", cluster: ritual}
  hajj-once-not-every-year: {label: "Asked 'every year?' three times, the prophet says had he said yes it would be binding and beyond them", cluster: law}
  earlier-peoples-destroyed-by-many-questions: {label: "Those before you perished by their many questions and disputes with their prophets", cluster: polemic}
  old-tribal-war-recalled-arms-taken-up: {label: "Aws and Khazraj, recalling their old war, rise against each other with weapons", cluster: sira}
  drop-of-zaqqum-would-embitter-earth: {label: "A drop of zaqqum dripped on earth would spoil the life of its people; how then those whose only food it is", cluster: eschatology}
  die-believing-treat-others-as-wished: {label: "Whoever would be removed from the fire should die believing and do to people what he would have done to himself", cluster: ethics}
  die-thinking-well-of-god: {label: "Three days before his death: let none die except thinking well of God", cluster: theology}
  brought-to-paradise-in-chains: {label: "The best people for people bring others in chains on their necks until they enter Islam (and paradise)", cluster: eschatology}
  none-other-remembers-god-at-this-hour: {label: "At the late night prayer: no one of other religions remembers God at this hour but you", cluster: ritual}
  isha-from-twilight-to-first-third: {label: "The night prayer was prayed between the setting of twilight and the first third of the night", cluster: ritual}
  two-inner-circles-good-and-evil: {label: "Every prophet and caliph has two inner circles, one urging good and one evil; protected is whom God protects", cluster: ethics}
  rebuke-welcomed-for-its-praise: {label: "Two clans glad of a verse that rebukes them because it says God is their protector", cluster: revelation}
  qunut-curse-after-bowing: {label: "The prophet curses named persons and tribes in the dawn prayer after rising from bowing, until a verse stops him", cluster: ritual}
  prayer-for-named-captives-to-be-saved: {label: "The prophet prays by name for believers held at Mecca: 'O God, save al-Walid, Salama, Ayyash and the oppressed believers'", cluster: ritual}
  prophet-wipes-blood-how-can-they-prosper: {label: "His tooth broken and head cut at Uhud, the prophet wipes the blood: 'how can a people prosper who wounded their prophet?'", cluster: sira}
  archers-told-not-to-move-even-if-birds-snatch-us: {label: "The archers are told not to leave their post even if they see the birds snatching the army", cluster: warfare}
  numbers-of-uhud-and-badr: {label: "Fifty archers; twelve left with the prophet; seventy lost at Uhud against a hundred and forty at Badr, seventy captive and seventy killed", cluster: warfare}
  enemy-asks-three-times-is-he-among-you: {label: "The enemy leader calls three times each: is Muhammad among you? Ibn Abi Quhafa? Ibn al-Khattab?; the prophet forbids an answer", cluster: warfare}
  sword-falls-from-drowsy-hand: {label: "Overcome by sleep in the battle line, a man's sword falls from his hand again and again", cluster: warfare}
  god-speaks-to-martyr-face-to-face: {label: "God spoke to no one except from behind a veil, but revived a martyr and spoke to him face to face", cluster: martyrdom}
  martyr-asks-to-return-and-be-killed-again: {label: "The martyr asks to be revived and killed again for God; it is decreed that they do not return", cluster: martyrdom}
  martyrs-ask-who-will-tell-our-brothers: {label: "The martyrs ask who will tell their brothers they are alive, lest they shirk fighting; God says 'I will tell them'", cluster: martyrdom}
  seventy-volunteer-to-pursue-after-defeat: {label: "After the defeat the prophet asks who will go after the enemy; seventy volunteer", cluster: warfare}
  retreating-enemy-regrets-and-would-return: {label: "The retreating enemy says 'you neither killed Muhammad nor carried off the maidens: go back'", cluster: warfare}
  rendezvous-kept-no-enemy-trade-instead: {label: "The appointed battle at the Badr fair is kept; no enemy comes and the believers trade", cluster: warfare}
  abrahams-last-words-in-the-fire: {label: "Abraham's last words when thrown into the fire: 'God suffices me and is the best guardian'", cluster: abraham}
  hoarded-wealth-becomes-bald-serpent-collar: {label: "Unpaid-alms wealth becomes a bald serpent with two black spots, collared on its owner, gripping his jaws: 'I am your wealth, your treasure'", cluster: eschatology}
  is-your-lord-poor-asking-a-loan: {label: "Jews mock 'who will lend God a goodly loan': is your Lord poor that he asks his servants for a loan?", cluster: polemic}
  whip-space-in-paradise-better-than-world: {label: "The space of one's whip in paradise is better than the world and what is in it", cluster: paradise}
  notable-covers-nose-against-prophets-dust: {label: "A notable covers his nose with his cloak against the dust of the prophet's mount: 'do not raise dust on us'", cluster: sira}
  prophet-rides-donkey-with-companion-behind: {label: "The prophet rides a donkey on a Fadak saddle-cloth with a companion seated behind him", cluster: sira}
  town-about-to-crown-a-man-when-prophet-came: {label: "The townspeople had agreed to crown a man and bind on the turban; he chokes with envy when the prophet comes", cluster: sira}
  stayers-behind-swear-and-want-praise: {label: "Hypocrites stay behind from raids, glad of it, then excuse themselves with oaths and want praise for what they did not do", cluster: polemic}
  scripture-people-conceal-answer-and-seek-praise: {label: "Asked by the prophet, scripture people conceal the answer, give another, and want praise for it", cluster: polemic}
  night-vigil-looks-at-sky-recites-creation-verse: {label: "Rising in the night the prophet looks at the sky and recites the verses on the creation of the heavens and earth", cluster: ritual}
  eleven-rakas-of-night-prayer: {label: "The prophet's night prayer of eleven rakas", cluster: ritual}
  six-pairs-of-rakas-then-witr: {label: "The night prayer in six pairs of rakas, then the witr", cluster: ritual}
  boys-ear-twisted-at-night-prayer: {label: "A boy who joins the prophet's night prayer has his right ear twisted by the prophet's right hand", cluster: ritual}
  weeps-until-beard-and-ground-wet: {label: "At night prayer the prophet weeps until his lap, then his beard, then the ground is wet", cluster: ritual}
  shall-i-not-be-a-grateful-servant: {label: "Asked why he weeps when forgiven, the prophet answers 'shall I not be a grateful servant?'", cluster: ethics}
  woe-to-reader-who-does-not-reflect: {label: "Woe to the one who recites the verse of creation and does not reflect on it", cluster: revelation}
  visit-seldom-to-be-loved-more: {label: "Proverb: visit now and then and you will be loved more", cluster: wisdom}
  woman-asks-why-women-unmentioned-verse-follows: {label: "A woman asks why women are passed over (in emigration, war, inheritance) and a verse is sent down in answer", cluster: revelation}
  first-woman-emigrant-to-arrive: {label: "The Ansar call Umm Salama the first woman emigrant to arrive among them", cluster: sira}
  funeral-prayer-for-absent-negus: {label: "The prophet orders prayer for the dead Negus; companions object 'an Abyssinian slave?' and a verse answers", cluster: ritual}
  ablution-in-hardship-steps-waiting-is-ribat: {label: "Full ablution in hardship, many steps to the mosques and waiting for prayer after prayer: that is the ribat", cluster: ritual}
  frontier-watch-day-better-than-month-fast: {label: "A day and night of frontier watch is better than a month of fasting and vigil; if he dies his deed continues and he is safe from the tester", cluster: warfare}
  guardian-marries-orphan-ward-for-her-wealth: {label: "A guardian wants to marry the orphan girl in his care for her wealth and beauty without a fair bride-price", cluster: law}
  orphan-ward-only-with-highest-dower: {label: "Guardians may marry orphan wards only if they give the highest customary dower; else they marry other women", cluster: law}
  convert-keeps-four-of-ten-wives: {label: "A man converting with ten wives is told to keep four", cluster: law}
  poor-guardian-eats-for-his-work: {label: "A poor guardian may eat of the orphan's property fairly, in return for his care", cluster: law}
  eat-of-orphans-property-not-saving-own: {label: "'Eat of your orphan's property without excess', and do not preserve your own property with his", cluster: law}
  seven-destroying-sins: {label: "Avoid the seven destroyers: associating, sorcery, unlawful killing, usury, the orphan's property, fleeing the battle, slandering chaste women", cluster: law}
  uncle-takes-orphan-girls-estate: {label: "A dead man's brother takes all his property; his two daughters cannot marry without wealth", cluster: law}
  daughters-two-thirds-widow-eighth-uncle-rest: {label: "The two daughters receive two-thirds, their mother an eighth, the uncle the rest", cluster: law}
  bequest-to-parents-replaced-by-shares: {label: "Property once went to children with a bequest to parents; God replaced this with fixed shares", cluster: law}
  god-has-made-a-way-for-them: {label: "'Take it from me, take it from me: God has made a way for them'", cluster: law}
  unmarried-adulterer-lashed-and-exiled-a-year: {label: "The unmarried with the unmarried: a hundred lashes and a year's exile", cluster: law}
  married-adulterer-lashed-then-stoned: {label: "The previously married: a hundred lashes, then stoning with stones", cluster: law}
  prophet-distressed-face-darkens-at-revelation: {label: "When revelation came the prophet was distressed and his face darkened; it was lifted from him afterwards", cluster: revelation}
  repentance-accepted-until-death-rattle: {label: "God accepts a servant's repentance until the death rattle (gargling)", cluster: theology}
  satan-swears-to-mislead-god-swears-to-forgive: {label: "Satan swears by God's might to mislead people while spirits are in bodies; God swears to forgive them as long as they ask", cluster: theology}
  dead-mans-heirs-own-his-widow: {label: "When a man died his heirs had the better right to his wife: to marry her, marry her off or keep her unmarried", cluster: law}
  inherited-widow-held-till-death-or-dower-returned: {label: "A kinsman who inherited a woman kept her from marrying until she died or gave back her dower", cluster: law}
  no-believer-hates-believing-wife-wholly: {label: "No believing man should hate a believing woman: if he dislikes one trait he is pleased with another", cluster: ethics}
  jahiliyya-allowed-fathers-wife-and-two-sisters: {label: "The pre-Islamic Arabs forbade all that is now forbidden except a father's wife and two sisters together", cluster: law}
  wife-of-father-or-son-forbidden-even-unconsummated: {label: "Any woman married by one's father or son is forbidden, whether or not the marriage was consummated", cluster: law}
  suicide-repeats-his-act-in-hell-forever: {label: "The suicide repeats his act in hell forever: falling from a mountain, sipping poison, stabbing himself with the iron", cluster: punishment}
  men-fight-women-get-half-share: {label: "A wife says: men go to war and we do not, and we have only half the inheritance", cluster: law}
  is-womans-good-deed-written-half: {label: "A woman asks whether, as she inherits half and witnesses as half, her good deed is written as half", cluster: law}
  sworn-brothers-inherit-until-abrogated: {label: "Emigrants inherited from Ansar brothers by the prophet's pact instead of their own kin, until the verse ended it; aid and bequest remain", cluster: law}
  strike-without-injury: {label: "If wives admit someone disliked to the bed, strike without causing injury (ghayr mubarrih)", cluster: law}
  flog-wife-like-slave-then-lie-with-her: {label: "Rebuke: one flogs his wife like a slave and then perhaps lies with her at day's end", cluster: ethics}
  prophet-never-struck-woman-or-servant: {label: "The prophet never struck anything with his hand, neither a woman nor a servant", cluster: sira}
  gods-right-and-servants-right: {label: "God's right on his servants is to be worshipped without associates; their right on him is not to be punished", cluster: theology}
  gabriel-urges-neighbour-until-heir: {label: "Gabriel kept urging the neighbour on the prophet until he thought he would make him an heir", cluster: ethics}
  gift-of-meat-to-jewish-neighbour: {label: "A companion has a sheep slaughtered and asks twice: have you sent some to our Jewish neighbour?", cluster: ethics}
  sin-against-neighbour-tenfold: {label: "Adultery with ten women is lighter than with a neighbour's wife; theft from ten houses lighter than from a neighbour", cluster: ethics}
  master-and-slave-dressed-alike: {label: "A companion and his slave wear the same garment (hulla)", cluster: ethics}
  servants-are-brothers-feed-them-as-yourself: {label: "Your servants are your brothers: feed them from what you eat, clothe them from what you wear, and help them with heavy work", cluster: ethics}
  taunting-mans-mother-is-jahiliyya: {label: "Reproaching a man with his mother: 'you are a man in whom there is jahiliyya'", cluster: ethics}
  god-loves-three-hates-three: {label: "God loves three and hates three; among the hated the swaggering boaster and the swaggering reminder of favours", cluster: ethics}
  hem-to-mid-shin-trailing-is-pride: {label: "Wear the waist-wrapper to mid-shin, or to the ankles; trailing it is pride, and God does not love pride", cluster: ethics}
  call-to-god-who-answers-in-distress: {label: "The call is to God alone who removes harm when called, returns the lost in the desert, and makes plants grow in drought", cluster: theology}
  empty-your-bucket-into-anothers-vessel: {label: "Do not despise any kindness, even pouring from your bucket into the vessel of one drawing water", cluster: ethics}
  god-loves-to-see-trace-of-his-favour: {label: "God loves to see the trace of his favour on his servant", cluster: ethics}
  taken-from-fire-with-grain-of-faith: {label: "Whoever has a dinar's (or mustard seed's) weight of faith in his heart is brought out of the fire", cluster: eschatology}
  tears-at-verse-of-the-witness: {label: "At 'how will it be when we bring from every community a witness, and you as witness over these' the prophet's tears flow", cluster: revelation}
  drunk-quarrel-nose-split-with-jawbone: {label: "At a feast before wine was forbidden a quarrel over Emigrants and Ansar ends with a man struck with a roast camel's jawbone, his nose split", cluster: sira}
  wine-forbidden-in-three-stages: {label: "Umar prays three times for a clear word on wine; three verses come in turn until 'will you not desist?' - 'we desist'", cluster: law}
  herald-no-drunk-may-approach-prayer: {label: "At the call to prayer the prophet's herald cries: no drunk may come near the prayer", cluster: ritual}
  earth-suffices-ten-years-without-water: {label: "Clean earth is the Muslim's ablution even ten years without water; when water is found let it touch his skin", cluster: purity}
  lost-necklace-found-under-camel: {label: "A necklace lost on the march delays the army without water; the tayammum verse comes; the necklace is under the camel", cluster: sira}
  not-the-first-blessing-of-abu-bakrs-house: {label: "'This is not the first of your blessings, family of Abu Bakr'", cluster: sira}
  dies-associating-enters-fire: {label: "Whoever dies associating anything with God enters the fire; whoever dies not associating enters paradise", cluster: theology}
  two-sins-perhaps-unforgiven: {label: "Every sin God may forgive except dying an unbeliever and deliberately killing a believer", cluster: theology}
  prayer-saved-as-intercession-for-grave-sinners: {label: "The prophet stored his prayer as intercession for the grave sinners of his community", cluster: eschatology}
  unbelievers-molar-like-uhud-skin-three-days: {label: "In the fire the unbeliever's molar is like Uhud and his skin three days' journey thick", cluster: eschatology}
  paradise-tree-shade-hundred-years-ride: {label: "A tree in paradise in whose shade a rider travels a hundred years without crossing it", cluster: paradise}
  wooden-dove-in-kaaba-broken: {label: "In the Kaaba the prophet finds a dove made of wood, breaks it with his hand and throws it away", cluster: idolatry}
  circuit-on-camel-touching-corner-with-staff: {label: "The prophet circles the House seven times on his mount, touching the corner with a crooked staff", cluster: ritual}
  kaaba-key-returned-to-keeper: {label: "The key of the Kaaba is returned to its keeper rather than to the prophet's kin: 'today is a day of piety and keeping faith'", cluster: sira}
  hearing-seeing-shown-by-finger-on-ear-and-eye: {label: "Reciting 'God is hearing, seeing', the prophet puts his thumb on his ear and the next finger on his eye", cluster: theology}
  verse-on-obedience-for-a-raid-commander: {label: "The verse of obedience to those in authority came down about the commander of a raid", cluster: revelation}
  soothsayer-judges-disputes: {label: "A soothsayer judges the Jews' disputes and some converts take their dispute to him", cluster: polemic}
  repeat-prayer-with-congregation-as-voluntary: {label: "One who prayed in his tent and then finds the congregation praying prays again with them as voluntary", cluster: ritual}
  prophet-asked-to-seek-forgiveness: {label: "A man asks the prophet to seek forgiveness for him and he does", cluster: ritual}
  prophets-hand-cool-and-fragrant: {label: "A man presses the prophet's hand to his face: nothing was sweeter or cooler", cluster: sira}
  upstream-waters-then-releases-to-neighbour: {label: "The upstream owner waters his land, then (in the ruling) holds the water until it reaches the walls, then releases it to his neighbour", cluster: law}
  litigant-alleges-kinship-favour: {label: "A losing litigant says to the prophet 'because he is your cousin?' and the prophet's face changes", cluster: sira}
  every-prophet-given-choice-before-death: {label: "Every prophet in his last illness is given the choice between this world and the next", cluster: death-of-prophet}
  lover-fears-not-seeing-prophet-in-paradise: {label: "A man who cannot bear to be away from the prophet fears that in paradise he will be raised with the prophets and he will not see him", cluster: eschatology}
  help-me-with-much-prostration: {label: "Asked for his company in paradise, the prophet says 'help me with yourself by much prostration'", cluster: ritual}
  who-will-bring-news-of-enemy-promised-company: {label: "'Will a man bring news of the enemy? God will put him with me on Resurrection Day', asked three times without answer", cluster: warfare}
  boy-and-mother-among-the-oppressed: {label: "A boy and his mother among the oppressed whom God excused: he of the children, she of the women", cluster: sira}
  honoured-as-pagans-abased-as-believers: {label: "Converts complain: we had honour as pagans and became abject as believers; the prophet is commanded to pardon", cluster: sira}
  eager-for-fighting-then-holding-back: {label: "Those who asked for fighting at Mecca hold back when it is prescribed at Medina", cluster: warfare}
  obey-commander-obey-prophet-obey-god: {label: "Who obeys me obeys God; who obeys my commander obeys me; disobedience likewise", cluster: law}
  prophet-throws-dust-at-disputers: {label: "Angry, his face red, the prophet throws dust at elders disputing a verse", cluster: sira}
  nations-perished-by-disputing-their-book: {label: "Earlier nations were destroyed by disputing over their scripture and striking books against each other", cluster: polemic}
  quran-confirms-itself-unknown-returned-to-knower: {label: "The Quran does not belie itself but confirms itself; act on what you know and refer what you do not to one who knows", cluster: revelation}
  intercede-and-be-rewarded: {label: "'Intercede and be rewarded; God decides by his prophet's tongue as he wills'", cluster: ethics}
  greeting-worth-ten-twenty-thirty: {label: "'Peace upon you' earns ten, adding 'and God's mercy' twenty, 'and his blessings' thirty", cluster: ritual}
  greet-on-leaving-as-on-arriving: {label: "Greet on joining a gathering and on leaving it; the first greeting is not more due than the last", cluster: ritual}
  companions-split-kill-or-spare-deserters: {label: "The believers split into two parties over the deserters: 'we kill them' - 'we do not'", cluster: sira}
  deliberate-murderer-has-no-repentance: {label: "Ibn Abbas holds that the deliberate killer of a believer has no repentance; the verse was revealed last and not abrogated", cluster: theology}
  furqan-repentance-verse-for-pagans-only: {label: "The repentance clause of the Furqan verse on killing is for pagans who converted, not for a Muslim who kills", cluster: theology}
  hard-verse-abrogates-soft-after-six-months: {label: "Six months after the 'soft' Furqan verse the 'hard' Nisa verse came and abrogated it", cluster: revelation}
  one-who-knew-islam-then-killed: {label: "A man who knew Islam and its laws and then killed: his reward is hell (Mujahid adds: unless he repented)", cluster: theology}
  man-killed-after-greeting-for-his-goods: {label: "A man greets a raiding party with 'peace' and is killed for his flock or goods", cluster: warfare}
  blind-man-complains-clause-added: {label: "A blind companion complains as the verse on those who stay behind is dictated; 'except those with impairment' is added", cluster: revelation}
  revelation-weight-on-scribes-thigh: {label: "Revelation comes while the prophet's thigh is on the scribe's; it grows so heavy he fears it will crush his thigh", cluster: revelation}
  prophet-at-revelation-eyes-open-staring: {label: "At revelation the prophet's eyes stayed fixed and open, his hearing and heart emptied for what came", cluster: revelation}
  blind-man-fears-the-prophets-anger: {label: "The blind man stands repeating 'I seek refuge in God from the anger of God's messenger'", cluster: revelation}
  stayers-from-badr-and-the-sick-excused: {label: "Those who stayed from Badr are not equal to those who went; the sick were excused", cluster: warfare}
  muslims-swelling-pagan-ranks-killed: {label: "Muslims who swelled the polytheists' ranks were killed by arrows and swords in battle", cluster: warfare}
  hidden-believers-forced-to-badr: {label: "Secret Meccan believers were forced out to Badr and some were killed; believers asked forgiveness for them", cluster: warfare}
  verses-written-to-believers-in-mecca: {label: "Each new verse is written and sent to the believers still in Mecca", cluster: revelation}
  sick-man-carried-out-toward-medina: {label: "A sick Meccan asks to be carried out of the town, pointing toward Medina", cluster: sira}
  four-two-one-raka-home-journey-fear: {label: "God prescribed prayer at home as four, on journey two, in fear one", cluster: ritual}
  shortening-in-safety-a-charity-from-god: {label: "Shortening the prayer when safe is 'a charity God has given you; accept his charity'", cluster: ritual}
  wounded-may-lay-down-arms-in-prayer: {label: "The wounded or those troubled by rain may lay down their weapons during the fear prayer", cluster: ritual}
  remembers-god-at-all-times: {label: "The prophet remembered God at all his moments", cluster: ritual}
  reconciliation-above-fasting-prayer-alms: {label: "Reconciling between people ranks above fasting, prayer and alms", cluster: ethics}
  discord-is-the-shaver: {label: "Discord between people is 'the shaver' (al-haliqa), that shaves religion", cluster: ethics}
  community-never-agreed-on-error: {label: "God will not gather this community on error; God's hand is on (with) the congregation", cluster: theology}
  listener-in-prayer-says-abrahams-mother-is-glad: {label: "Hearing 'God took Abraham as friend' in prayer, a listener says 'the eye of Abraham's mother is consoled'", cluster: abraham}
  guardian-bars-ward-to-keep-her-wealth: {label: "A guardian who shares in his ward's property, even a date-palm, keeps her from marrying lest another share it", cluster: law}
  later-verse-refers-back-to-earlier: {label: "A later verse's 'what is recited to you in the Book' is identified as an earlier verse", cluster: revelation}
  wife-waives-rights-to-stay-married: {label: "A wife whose husband would part from her offers to release him from some of her rights: 'keep me and divide as you will'", cluster: law}
  daily-round-of-all-wives-without-intercourse: {label: "The prophet visited all his wives nearly daily, approaching each without intercourse, and spent the night with the one whose day it was", cluster: sira}
  divorce-retaken-on-terms-of-preference: {label: "Divorced near the end of her waiting period, an older wife is taken back on condition she bear his preference for a younger wife", cluster: law}
  unfair-husband-rises-with-side-drooping: {label: "A husband who favours one of two wives comes on Resurrection Day with one side drooping", cluster: eschatology}
  isha-and-dawn-heaviest-on-hypocrites: {label: "The night and dawn prayers are the heaviest for the hypocrites", cluster: ritual}
  sun-between-satans-horns: {label: "The hypocrite waits until the sun is between Satan's horns, then pecks four rakas, hardly remembering God", cluster: ritual}
  hypocrite-like-sheep-between-two-flocks: {label: "The hypocrite is like a ewe straying between two flocks, going to this one and that one", cluster: parable}
  hypocrisy-sent-on-better-men-who-repented: {label: "Hypocrisy came down on people better than you; they repented and God turned to them", cluster: theology}
  jesus-descends-breaks-cross-kills-swine: {label: "The son of Mary will descend as a just judge, break the cross, kill the swine, abolish the poll-tax, and wealth will overflow", cluster: christology}
  jesus-remains-forty-years-then-dies: {label: "Jesus stays on earth forty years, then dies and the Muslims pray over him", cluster: christology}
  best-of-creation-is-abraham: {label: "Called 'best of creation', the prophet answers 'that is Abraham'", cluster: abraham}
  do-not-raise-me-above-my-rank: {label: "'I am Muhammad son of Abdallah, God's servant and messenger; I do not want you to raise me above my rank'", cluster: christology}
  sick-man-revived-by-ablution-water: {label: "The prophet pours his ablution water on an unconscious sick man, who comes to", cluster: miracle}
  half-to-daughter-half-to-sister: {label: "A man's estate with a daughter and a sister: half to each", cluster: law}
  sons-daughter-sixth-to-complete-two-thirds: {label: "Daughter half, son's daughter a sixth to complete two-thirds, the rest to the sister", cluster: law}
  pilgrims-with-offerings-not-to-be-raided: {label: "The believers want to raid pagan pilgrims bringing offerings to the House; 'do not profane God's rites'", cluster: law}
  game-hit-by-edge-eaten-by-flat-is-beaten: {label: "Game struck by the edge of a throwing-stick may be eaten; struck by its flat it is 'beaten to death' (waqidh)", cluster: law}
  people-eat-bowl-of-blood: {label: "A tribe gathers to eat from a bowl of blood and invites the prophet's envoy", cluster: idolatry}
  images-of-abraham-ishmael-with-divining-arrows: {label: "Images of Abraham and Ishmael holding divining arrows were in the Kaaba; 'they knew the two never cast them'", cluster: idolatry}
  prophet-refuses-to-enter-house-with-gods: {label: "The prophet will not enter the House while the gods are in it until they are taken out", cluster: idolatry}
  jew-says-we-would-make-that-day-a-feast: {label: "A Jew (or Kab) tells Umar: had that verse come to us we would take its day as a feast", cluster: polemic}
  revealed-at-arafa-on-friday-two-feasts: {label: "The verse of the perfected religion came at Arafa on a Friday: both are feasts for us", cluster: revelation}
  first-struck-by-arrow-declared-assured: {label: "When a companion is struck by an arrow at the start of battle the prophet says 'he has made it certain (paradise)'", cluster: warfare}
  be-like-the-son-of-adam-who-did-not-kill: {label: "In civil strife, if a man enters your house to kill you, 'be like the son of Adam' who would not stretch his hand", cluster: primeval}
  charm-for-scorpion-sting-permitted: {label: "'Whoever can benefit his brother, let him': a charm over a scorpion sting allowed", cluster: law}
  only-three-may-lawfully-be-killed: {label: "Only three may lawfully be killed: the adulterer after marriage, the killer of a soul, and one who wars on God and his messenger", cluster: law}
  adulterer-blackened-and-flogged-for-stoning: {label: "A Jewish adulterer is paraded with blackened face and flogged, in place of stoning", cluster: law}
  scholar-adjured-by-who-gave-torah-admits-stoning: {label: "A Jewish scholar adjured 'by Him who sent down the Torah to Moses' admits the penalty they find is stoning", cluster: polemic}
  penalty-spared-the-noble-applied-to-weak: {label: "The penalty was waived for nobles and applied to the weak, then replaced for all by a lighter one", cluster: law}
  first-to-revive-a-command-they-killed: {label: "'O God, I am the first to revive your command after they let it die'", cluster: law}
  strong-tribe-takes-double-blood-price: {label: "Of two Jewish tribes the stronger took a hundred wasqs for its dead and paid fifty for the weaker's", cluster: law}
  spies-sent-to-learn-the-judges-ruling: {label: "Litigants send men secretly to learn the judge's view before submitting to him", cluster: polemic}
  choice-to-judge-abrogated-by-duty: {label: "The prophet's choice to judge between them or turn away was abrogated by 'judge between them'", cluster: law}
  people-god-loves-are-abu-musas-folk: {label: "At 'a people he loves and who love him' the prophet points to Abu Musa: 'they are this man's people', the Yemenis", cluster: sira}
  seven-commands-to-abu-dharr: {label: "Abu Dharr's seven commands: love the poor, look to those below, keep kinship, ask no one, speak truth though bitter, fear no blame, say la hawla", cluster: ethics}
  no-power-but-god-treasure-under-throne: {label: "'No power and no strength but in God' is a treasure from beneath the Throne", cluster: theology}
  god-asks-why-wrong-was-not-opposed: {label: "God asks the servant why he did not oppose a wrong he saw; the answer: 'I trusted you and feared people'", cluster: eschatology}
  had-he-concealed-he-would-have-concealed-this: {label: "Had the prophet concealed any revelation, he would have concealed the verse rebuking him over Zayd's wife", cluster: revelation}
  no-secret-book-only-the-sheet: {label: "Ali has no book but God's, understanding, and a sheet on blood-money, ransoming captives and not killing a Muslim for an unbeliever", cluster: law}
  nothing-black-on-white-withheld: {label: "'The prophet left us nothing, black on white' beyond what he gave to all", cluster: revelation}
  crowd-testifies-message-delivered-god-witness: {label: "The crowd testifies the prophet has delivered; he raises his finger to the sky and points at them: 'O God, witness', three times", cluster: sira}
  book-left-to-hold-fast: {label: "'I have left among you that by which you will not go astray if you hold to it: God's book'", cluster: revelation}
units:
  # ============== al-Baqara 2:271-286
  - id: hadith-60-secret-alms-and-kin-of-polytheists
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Alms hidden from the left hand; alms to polytheist kin allowed (Q 2:271-272)
    read: ["Jāmiʿ 60:6820.1-6820.2"]
    quran: ["2:271", "2:272"]
    tags:
      - {motif: seven-shaded-on-day-without-shade, refs: ["Jāmiʿ 60:6820.1"], note: "سبعة يظلهم اللَّه في ظله يوم لا ظل إلا ظله"}
      - {motif: left-hand-not-know-right-hands-alms, refs: ["Jāmiʿ 60:6820.1"], note: "ورجل تصدق، أخفى حتى لا تعلم شماله ما تنفق يمينه"}
      - {motif: secret-charity-better, refs: ["Jāmiʿ 60:6820.1"], note: "the bab is Q 2:271; the hadith gives the hidden giver"}
      - {motif: alms-to-polytheist-kin-permitted, refs: ["Jāmiʿ 60:6820.2"], note: "كانوا يكرهون أن يرضخوا لأنسبائهم من المشركين، فسألوا، فرضخ لهم، فنزلت"}
    hints:
      - "The left hand not knowing what the right gives against Matt 6:3, 'let not thy left hand know what thy right hand doeth'."
  - id: hadith-60-true-poor-and-lawful-begging
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: The true poor man refrains from asking; forty dirhams make a beggar importunate; three for whom asking is lawful (Q 2:273)
    read: ["Jāmiʿ 60:6821.1-6821.3"]
    quran: ["2:273"]
    tags:
      - {motif: true-poor-is-the-one-who-refrains, refs: ["Jāmiʿ 60:6821.1"], note: "ليس المسكين الذي ترده التمرة والتمرتان، ولا اللقمة، ولا اللقمتان، إنما المسكين الذي يتعفف"}
      - {motif: beggar-with-forty-dirhams-importunate, refs: ["Jāmiʿ 60:6821.2"], note: "من سأل وله أربعون درهما فهو ملحف، وهو مثل سف الملة"}
      - {motif: asking-lawful-for-three-only, refs: ["Jāmiʿ 60:6821.3"], note: "إن المسألة لا تحل إلا لأحد ثلاثة: رجل تحمل حمالة ... ورجل أصابته جائحة ... ورجل أصابته فاقة حتى يقول ثلاثة من ذوي الحجا من قومه"}
      - {motif: three-witnesses-attest-destitution, refs: ["Jāmiʿ 60:6821.3"], note: "حتى يقول ثلاثة من ذوي الحجا من قومه: لقد أصابت فلانًا فاقة"}
  - id: hadith-60-usury-curses-and-punishments
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: The usury verses read out in the mosque and wine trade banned; the four parties to usury cursed; the usurer in the river of blood; usury ends in little (Q 2:275-276)
    read: ["Jāmiʿ 60:6822.1-6823.3"]
    quran: ["2:275", "2:275-281", "2:276"]
    tags:
      - {motif: usury-verses-recited-then-wine-trade-forbidden, refs: ["Jāmiʿ 60:6822.1"], note: "لما أنزلت الآيات من سورة البقرة في الربا خرج النبي ﷺ إلى المسجد، فقرأهن على الناس، ثم حرّم تجارة الخمر"}
      - {motif: four-parties-to-usury-cursed, refs: ["Jāmiʿ 60:6822.2"], note: "لعن رسول اللَّه ﷺ آكل الربا، ومؤكله، وكاتبه، وشاهديه، وقال: هم سواء"}
      - {motif: price-of-dog-and-blood-forbidden-tattooer-cursed, refs: ["Jāmiʿ 60:6823.1"], note: "نهى النبي ﷺ عن ثمن الكلاب وثمن الدم، ونهى عن الواشمة والموشومة، وآكل الربا وموكله، ولعن المصور"}
      - {motif: usurer-swims-red-river-fed-stones, refs: ["Jāmiʿ 60:6823.2"], note: "نهر من دم ... فإذا أراد أن يخرج رمى الرجل بحجر في فيه فرده حيث كان ... والذي رأيته في النهر آكلوا الربا"}
      - {motif: usury-ends-in-paucity, refs: ["Jāmiʿ 60:6823.3"], note: "ما أحد أكثر من الربا إلا كان عاقبة أمره إلى قلة"}
      - {motif: god-blots-out-usury-grows-alms, refs: ["Jāmiʿ 60:6823.3"], note: "bab gloss on يمحق اللَّه الربا"}
    hints:
      - "The curse on lender, borrower, scribe and witnesses against m. Bava Metzia 5:11: lender, borrower, guarantor and witnesses (and the scribe, in R. Meir) all transgress the ban on interest."
  - id: hadith-60-alms-grown-like-a-foal
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: A date's worth of lawful alms taken in God's right hand and raised like a foal to a mountain (Q 2:276)
    read: ["Jāmiʿ 60:6824.1"]
    quran: ["2:276"]
    tags:
      - {motif: alms-raised-like-foal-to-mountain, refs: ["Jāmiʿ 60:6824.1"], note: "إن اللَّه يتقبلها بيمينه، ثم يربيها لصاحبه كما يربي أحدكم فلوه حتى تكون مثل الجبل ... أو قلوصه"}
      - {motif: only-the-good-accepted, refs: ["Jāmiʿ 60:6824.1"], note: "من تصدق بعدل تمرة من كسب طيب -ولا يقبل اللَّه إلا الطيب-"}
  - id: hadith-60-respite-for-the-insolvent
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: The lender forgiven at death; Abu l-Yasar wipes out the debt; respite counts as daily alms (Q 2:280)
    read: ["Jāmiʿ 60:6824.2-6825.3"]
    quran: ["2:280"]
    tags:
      - {motif: lenient-creditor-forgiven, refs: ["Jāmiʿ 60:6824.2"], note: "تلقّت الملائكة روح رجل ممن كان قبلكم ... كنت أداين الناس فآمر فتياني أن ينظروا المعسر ويتجوزوا عن الموسر ... قال اللَّه ﷿: تجوّزوا عنه"}
      - {motif: angels-meet-the-soul-and-question-deeds, refs: ["Jāmiʿ 60:6824.2"], note: "تلقّت الملائكة روح رجل ... فقالوا: أعملت من الخير شيئًا؟ قال: لا، قالوا: تذكّر"}
      - {motif: debtor-hides-in-wifes-alcove, refs: ["Jāmiʿ 60:6825.1"], note: "سمع صوتك فدخل أريكة أمي ... خشيت، واللَّه أن أحدثك فأكذبك، وأن أعدك فأخلفك"}
      - {motif: creditor-wipes-out-written-debt, refs: ["Jāmiʿ 60:6825.1"], note: "فأتى بصحيفته فمحاها بيده، فقال: إن وجدت قضاء فاقضني، وإلا أنت في حل"}
      - {motif: oath-by-god-repeated-three-times, refs: ["Jāmiʿ 60:6825.1", "Jāmiʿ 60:6825.2"], note: "قلت: اللَّه، قال: اللَّه، قلت: اللَّه، قال: اللَّه ... / فقال: آللَّه، قال: اللَّه"}
      - {motif: respite-for-debtor-in-hardship, refs: ["Jāmiʿ 60:6825.1", "Jāmiʿ 60:6825.2", "Jāmiʿ 60:6825.3"], note: "من أنظر معسرًا، أو وضع عنه، أظله اللَّه في ظله / فلينفّس عن معسر، أو يضح عنه"}
      - {motif: respite-earns-daily-alms-double-after-due, refs: ["Jāmiʿ 60:6825.3"], note: "من أنظر معسرًا فله بكل يوم مثله صدقة ... بكل يوم صدقة قبل أن يحل الدين، فإذا حل الدين فأنظره فله بكل يوم مثليه صدقة"}
    hints:
      - "Respite for the hard-pressed debtor against Deut 15:2 and Exod 22:25-26 (the pledged cloak returned by sunset); here the merit is counted day by day."
  - id: hadith-60-last-verse-revealed
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Which verse was revealed last - 2:281 or the usury verses; Umar's three unresolved questions (Q 2:281)
    read: ["Jāmiʿ 60:6826.1-6826.3"]
    quran: ["2:281", "2:275-281"]
    tags:
      - {motif: last-verse-revealed, refs: ["Jāmiʿ 60:6826.1", "Jāmiʿ 60:6826.2"], note: "آخر شيء نزل من القرآن: ﴿وَاتَّقُوا يَوْمًا تُرْجَعُونَ فِيهِ إِلَى اللَّهِ﴾ / آخر آية نزلت على النبي ﷺ آية الربا"}
      - {motif: three-questions-left-unresolved-at-prophets-death, refs: ["Jāmiʿ 60:6826.3"], note: "وثلاثة وددت أن رسول اللَّه ﷺ لم يفارقنا حتى يعهد إلينا عهدًا: الجد والكلالة، وأبواب من أبواب الربا"}
  - id: hadith-60-debt-writing-and-pledge
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Trust abrogates the writing of debts; the prophet pledges his armour to a Jew for food (Q 2:282-283)
    read: ["Jāmiʿ 60:6827.1-6827.2"]
    quran: ["2:282-283", "2:283"]
    tags:
      - {motif: trust-verse-abrogates-debt-writing, refs: ["Jāmiʿ 60:6827.1"], note: "تلا: ﴿فَإِنْ أَمِنَ بَعْضُكُمْ بَعْضًا﴾ قال: هذه نسخت ما قبلها"}
      - {motif: prophet-pawns-armour-to-jew-for-food, refs: ["Jāmiʿ 60:6827.2"], note: "اشترى رسول اللَّه ﷺ من يهودي طعامًا بنسيئة ورهنه درعه"}
  - id: hadith-60-thoughts-not-reckoned
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Q 2:284 alarms the companions; 'we hear and obey' instead of 'we hear and disobey'; God answers each petition of 2:286; inner thoughts forgiven (Q 2:284-286)
    read: ["Jāmiʿ 60:6828.1-6830.1"]
    quran: ["2:284-286", "2:284"]
    tags:
      - {motif: companions-kneel-protesting-unbearable-verse, refs: ["Jāmiʿ 60:6828.1"], note: "فأتوا رسول اللَّه ﷺ، ثم بركوا على الركب، فقالوا ... وقد أنزلت عليك هذه الآية، ولا نطيقها"}
