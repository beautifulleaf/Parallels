  - id: hadith-60-convey-what-was-sent-down
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Aisha - had he concealed anything he would have concealed 'keep your wife'; Ali's sheet; 'not black on white'; 'O God, bear witness' (Q 5:67, 33:37)
    read: ["Jāmiʿ 60:6937.3-6939.1"]
    quran: ["5:67", "33:37"]
    tags:
      - {motif: had-he-concealed-he-would-have-concealed-this, refs: ["Jāmiʿ 60:6937.3", "Jāmiʿ 60:6938.1"], note: "ولو كان محمد ﷺ كاتما شيئًا مما أنزل عليه، لكتم هذه الآية: ﴿وَإِذْ تَقُولُ لِلَّذِي أَنْعَمَ اللَّهُ عَلَيْهِ ... أَمْسِكْ عَلَيْكَ زَوْجَكَ﴾"}
      - {motif: prophet-concealed-nothing-of-revelation, refs: ["Jāmiʿ 60:6937.3"], note: "من حدّثك أن محمدا ﷺ كتم شيئًا مما أنزل اللَّه عليه فقد كذب"}
      - {motif: no-secret-book-only-the-sheet, refs: ["Jāmiʿ 60:6938.2"], note: "هل عندكم كتاب؟ قال: لا إلا كتاب اللَّه، أو فهم أعطيه رجل مسلم، أو ما في هذه الصحيفة ... العقل وفكاك الأسير، ولا يقتل مسلم بكافر"}
      - {motif: nothing-black-on-white-withheld, refs: ["Jāmiʿ 60:6938.3"], note: "واللَّه ما ورثنا رسول اللَّه ﷺ سوداء في بيضاء"}
      - {motif: crowd-testifies-message-delivered-god-witness, refs: ["Jāmiʿ 60:6939.1"], note: "قَالُوا: نَشْهَدُ أَنَّكَ قَدْ بَلَّغْتَ وَأَدَّيْتَ وَنَصَحْتَ. فَقَالَ بِإِصْبَعِهِ السَّبَّابَةِ يَرْفَعُهَا إِلَى السَّمَاءِ وَيَنْكُتُهَا إِلَى النَّاسِ اللَّهُمَّ اشْهَدِ"}
      - {motif: book-left-to-hold-fast, refs: ["Jāmiʿ 60:6939.1"], note: "وَقَدْ تَرَكْتُ فِيكُمْ مَا لَنْ تَضلُّوا بَعْدَهُ إِنِ اعْتَصَمْتُمْ بِهِ كِتَابَ اللَّهِ"}
    hints:
      - "The farewell assembly asked to testify and heaven called as witness against Deut 31:28 / 32:1 and Josh 24:22-27 ('ye are witnesses against yourselves')."
