# Hadith chunk 16: al-Jāmiʿ al-Kāmil book 60 (tafsir), pp. 7540-7659: al-Mujadila 58:12 to al-Tin (Q 95).
# Read in full from the Arabic (239 hadith).
new_motifs:
  alms-before-private-talk-reduced-to-barleycorn: {label: "Asked what alms should precede a private talk with the prophet, Ali answers a dinar is too much, half too much, 'a barleycorn'; 'you are frugal'; the lightening verse comes down 'through me'", cluster: law}
  man-with-satans-eye-swears-falsely: {label: "The prophet foretells a man who 'looks at you with a devil's eye'; a blue-eyed man comes, is asked why he and his friends revile him, and they swear by God they did not", cluster: narrative}
  three-without-call-to-prayer-overpowered-by-satan: {label: "Any three in a village who give no call to prayer and hold no congregation are overpowered by Satan; 'the wolf eats the straggling sheep'", cluster: ritual}
  surah-names-tawba-the-exposer-hashr-al-nadir: {label: "Ibn Abbas names surahs: al-Tawba is 'the exposer' (al-fadiha) that kept saying 'and of them', al-Anfal came down on Badr, al-Hashr is 'say: the surah of al-Nadir'", cluster: scripture}
  quraysh-letter-threatens-medinan-idolaters: {label: "Quraysh write to Ibn Ubayy and the Medinan idolaters: you sheltered our man; kill him or expel him, or we march on you, kill your fighters and take your women", cluster: narrative}
  women-anklets-no-barrier-threat: {label: "Quraysh threaten the Jews after Badr: nothing will stand between us and your women's anklets (khadam, al-khalakhil)", cluster: narrative}
  nadir-palms-given-to-emigrants-and-two-poor-ansar: {label: "The Nadir palms were the prophet's alone; he gave most to the emigrants and only to two needy Ansar, the rest remained his alms in the hands of Fatima's sons", cluster: law}
  palms-of-buwayra-burned-and-cut: {label: "The prophet burned and cut the palms of the Nadir at al-Buwayra, and the verse on the cut palm (lina) came down", cluster: narrative}
  cut-palm-reward-left-palm-no-sin: {label: "Having cut some palms and left others, the Muslims ask whether there is reward for the cut and sin for the left; the verse answers both", cluster: law}
  tattooers-pluckers-gap-makers-cursed-as-altering-creation: {label: "God curses women who tattoo and are tattooed, pluck brows and file gaps in their teeth for beauty, 'altering God's creation'", cluster: law}
  woman-reads-between-two-covers-finds-no-curse: {label: "Umm Ya'qub: 'I read what is between the two covers and did not find it'; Ibn Mas'ud: 'whatever the messenger gives you, take it' (Q 59:7)", cluster: scripture}
  leave-me-as-i-leave-you: {label: "'Leave me as long as I leave you: those before you perished by their questions and disputes with their prophets; avoid what I forbid, do what you can of what I command'", cluster: law}
  caliph-charged-with-emigrants-and-ansar: {label: "Umar charges his successor to know the first emigrants' right, and to accept the good of the Ansar and pardon their wrongdoer", cluster: ethics}
  ansar-refuse-bahrain-grant-unless-emigrants-share: {label: "Offered grants of al-Bahrayn, the Ansar refuse unless the emigrants get the like; 'you will meet selfishness (athara) after me: be patient till you meet me at the pool'", cluster: narrative}
  ansar-decline-to-split-palms-share-fruit: {label: "Ansar ask to divide the palms with the emigrants; refused, they offer: you do the work and share the fruit; 'we hear and obey'", cluster: law}
  lamp-put-out-guest-eats-children-sleep: {label: "An Ansari with only his children's food puts them to sleep and puts out the lamp so the guest eats while host and wife go hungry; God 'wondered' or 'laughed', and Q 59:9 came down", cluster: narrative}
  avarice-destroyed-those-before-you: {label: "'Beware injustice, for it is darkness on Resurrection day; beware avarice (al-shuhh), for it destroyed those before you, driving them to shed blood and make lawful what was sacred'", cluster: ethics}
  ordered-to-pray-for-companions-they-reviled-them: {label: "Aisha: they were ordered to ask forgiveness for the prophet's companions, and they reviled them", cluster: ethics}
  ragged-mudar-tribe-moves-sermon-on-alms: {label: "A barefoot, naked tribe of Mudar in striped wool cloaks comes; the prophet's face changes, he preaches Q 4:1 and 59:18, 'even half a date'; heaps of food and clothing gather and his face shines like gilt", cluster: narrative}
  good-precedent-reward-bad-precedent-burden: {label: "Whoever sets a good precedent (sunna hasana) in Islam has its reward and the reward of all who follow it; a bad one, its burden and theirs, without lessening theirs", cluster: ethics}
  ninety-nine-names-memorized-enter-paradise: {label: "God has ninety-nine names, a hundred less one; whoever keeps them (ahsaha) enters paradise; he is odd (witr) and loves the odd", cluster: theology}
  slow-deeds-not-hastened-by-lineage: {label: "'Whoever is slowed by his deeds is not hastened by his lineage'", cluster: ethics}
  mother-visits-may-i-keep-ties: {label: "Asma's polytheist mother comes 'desiring' (ragiba); asked 'may I keep ties with her?', the prophet says yes, and Q 60:8 is said to concern her", cluster: law}
  messenger-title-struck-write-son-of-abdallah: {label: "Suhayl: had we known you were God's messenger we would not have barred you; the prophet: 'I am God's messenger though you deny me; write Muhammad son of Abd Allah'", cluster: narrative}
  fettered-convert-returned-under-treaty: {label: "Abu Jandal, Suhayl's son, comes in shackles and throws himself among the Muslims; Suhayl demands him as the first case of the treaty and he is returned", cluster: narrative}
  umar-questions-the-lowly-terms: {label: "Umar asks the prophet and then Abu Bakr: are we not right and they wrong? why accept the lowly term (al-daniyya) in our religion? both answer alike", cluster: narrative}
  umar-divorces-two-polytheist-wives: {label: "On the verse 'do not hold to ties with unbelieving women' Umar divorces two wives from his idolatrous days", cluster: law}
  escapee-kills-guard-with-his-own-sword: {label: "Abu Basir, returned to two Qurayshi guards, praises one's sword, asks to see it and kills him with it; the other flees to Medina", cluster: narrative}
  exiled-converts-raid-caravans-from-coast: {label: "Abu Basir and Abu Jandal gather converts at the seashore (sif al-bahr) and raid every Qurayshi caravan to Syria till Quraysh ask the prophet to take them in", cluster: narrative}
  women-pledged-by-word-not-handclasp: {label: "The prophet took the women's pledge by speech only; 'his hand never touched a woman's hand'", cluster: ritual}
  eid-sermon-to-women-rings-into-cloak: {label: "After the feast prayer the prophet crosses to the women with Bilal, recites the pledge verse, asks 'are you on that?', one woman answers; they throw rings and anklets into Bilal's spread cloak", cluster: ritual}
  no-wailing-pledge-kept-by-five: {label: "At the pledge the prophet forbade wailing; only five women kept it (Umm Sulaym, Umm al-'Ala', Abu Sabra's daughter, Mu'adh's wife and another)", cluster: ritual}
  wailing-debt-repaid-exception: {label: "A woman withdraws her hand: so-and-so wailed with me and I must repay her; the prophet allows 'except the family of so-and-so'", cluster: ritual}
  obedience-in-good-is-condition-for-women: {label: "'They do not disobey you in what is right' (Q 60:12) is a condition God laid on women", cluster: law}
  wish-to-know-best-deed-answered-by-surah: {label: "Companions say 'if we knew the deed God loves most'; al-Saff comes down; the surah is then recited down the chain, each teacher reciting it to his pupil (musalsal)", cluster: scripture}
  three-signs-of-hypocrite: {label: "The sign of the hypocrite is three: when he speaks he lies, when trusted he betrays, when he promises he breaks it", cluster: ethics}
  four-traits-of-pure-hypocrite: {label: "Four traits make a pure hypocrite: betraying a trust, lying, treachery in covenant, foul in dispute", cluster: ethics}
  god-laughs-to-night-prayer-and-ranks: {label: "God laughs to three: the man who rises at night, a people ranked for prayer, a people ranked for battle", cluster: theology}
  three-loved-by-god-secret-giver-night-reciter-rearguard: {label: "God loves three: one who secretly gives to a man refused by his people, one who rises in the night to 'flatter me' (yatamallaquni) while companions sleep, and one who faces the enemy as his band flees", cluster: ethics}
  prophet-messenger-of-abrahams-prayer-jesus-good-news: {label: "'I am the prayer of my father Abraham, the good news of Jesus, and my mother saw when she carried me a light go out from her that lit Busra in Syria'", cluster: narrative}
  negus-finds-messenger-in-gospel: {label: "The Negus: he is the one we find in the Gospel, the messenger whose coming Jesus son of Mary foretold; 'were it not for my kingship I would carry his sandals'", cluster: narrative}
  prophets-names-muqaffi-tawba-rahma: {label: "He named himself: Muhammad, Ahmad, al-Muqaffi, al-Hashir, the prophet of repentance and the prophet of mercy", cluster: theology}
  friday-readings-jumua-and-munafiqun: {label: "At Friday prayer the prophet read Surat al-Jumu'a and al-Munafiqun; at Friday dawn al-Sajda and al-Insan; also al-Ghashiya", cluster: ritual}
  faith-at-pleiades-reached-by-persians: {label: "'If faith were at the Pleiades men of these would reach it', with his hand on Salman the Persian, glossing 'others of them who have not yet joined them' (Q 62:3)", cluster: narrative}
  loins-of-loins-enter-without-reckoning: {label: "In the loins of the loins of the loins of men are men and women of my community who will enter paradise without reckoning; then he recites Q 62:3", cluster: eschatology}
  bathe-for-friday: {label: "'When one of you comes to Friday, let him bathe'", cluster: ritual}
  friday-day-adam-gathered: {label: "Asked what Friday is, Salman answers 'the day in which your father was gathered (jumi'a)'; whoever purifies, walks to the mosque and keeps silent till the prayer ends is expiated till the next Friday", cluster: ritual}
  walk-to-prayer-do-not-run: {label: "When the prayer is called do not come running; walk with calm; pray what you catch and complete what you missed", cluster: ritual}
  twelve-stay-when-caravan-comes: {label: "A caravan (suwayqa, 'ir from Syria) arrives during the Friday sermon; the people leave till only twelve men remain, Jabir among them (Abu Bakr and Umar in a variant)", cluster: narrative}
  preacher-sitting-rebuked-by-verse: {label: "Ka'b b. Ujra sees a governor preach sitting: 'look at this wretch preaching sitting', citing 'and they left you standing' (Q 62:11)", cluster: ritual}
  zayd-belied-then-verified-by-surah: {label: "Young Zayd b. Arqam reports Ibn Ubayy's words; Ibn Ubayy swears he did not; people say Zayd lied, until al-Munafiqun comes down: 'God has verified you'", cluster: narrative}
  hypocrites-like-propped-timbers-were-handsome: {label: "'Propped-up timbers' (Q 63:4): 'they were the handsomest of men'", cluster: narrative}
  kick-on-backside-sparks-clan-cry: {label: "An emigrant strikes an Ansari on the backside (kasa'a); 'O Ansar!', 'O emigrants!'; the prophet: 'leave it, it is rotten (muntina)'", cluster: ethics}
  let-not-people-say-muhammad-kills-companions: {label: "Umar asks to behead the hypocrite; 'leave him, lest people say Muhammad kills his companions'", cluster: narrative}
  spittle-in-palm-whence-you-were-made: {label: "The prophet spits in his palm, sets his finger on it: God says 'son of Adam, how can you escape me when I made you from the like of this?'; at the throat you say 'I will give alms' - and when is the time for alms?", cluster: theology}
  prophet-stops-sermon-to-lift-stumbling-grandsons: {label: "Hasan and Husayn in red shirts walk and stumble; the prophet comes down from the pulpit, lifts them and says 'God spoke truly: your wealth and children are a trial'", cluster: narrative}
  children-make-cowardly-sad-and-stingy: {label: "To a man who wished his newborn were food for the people: children are 'a cause of cowardice and sorrow (and stinginess)', yet the fruit of hearts and coolness of the eye", cluster: ethics}
  god-descends-asks-who-will-lend: {label: "God descends to the lowest heaven at half or the last third of the night: who will call on me, who will ask, 'who will lend to one not destitute nor unjust?', spreading out his hands", cluster: theology}
  divorce-in-purity-not-menses: {label: "Ibn Umar divorced his wife in menses; the prophet, angry, orders him to take her back till she is pure, has menses and is pure again, then divorce before touching her: 'that is the waiting period God commanded'", cluster: law}
  reading-in-the-front-of-their-waiting-period: {label: "Ibn Umar reports the prophet reading 'divorce them in the front (qubul) of their waiting period'", cluster: scripture}
  divorce-and-return-to-be-witnessed: {label: "Imran b. Husayn to one who divorced and took back without witnesses: you divorced and returned against the sunna; have both witnessed and do not repeat it", cluster: law}
  guard-god-and-he-guards-you-pens-lifted: {label: "'Boy, I teach you words: guard God and he guards you ... if the community gathered to benefit or harm you they could only by what God wrote; the pens are lifted and the pages dry'", cluster: theology}
  need-brought-to-god-relieved: {label: "Whoever brings his want to people is not relieved; whoever brings it to God, God soon gives him sufficiency by early death or early wealth", cluster: ethics}
  widow-giving-birth-forty-nights-remarries: {label: "Subay'a gave birth forty nights after her husband was killed; she was sought in marriage and the prophet married her off; 'the later of the two terms' is answered by Q 65:4", cluster: law}
  shorter-nisa-after-longer: {label: "Ibn Mas'ud: will you impose the harder term and not the easing? The shorter surah of Women (al-Talaq) came down after the longer", cluster: scripture}
  honey-at-zaynab-and-maghafir-ruse: {label: "Aisha and Hafsa agree to say 'I smell maghafir on you'; he says 'I drank honey at Zaynab's and will not again', and Q 66:1-4 comes down for the two", cluster: narrative}
  three-wives-rehearse-urfut-bee-line: {label: "Aisha has Sawda and Safiyya say 'you ate maghafir' and 'its bees grazed the 'urfut'; when Hafsa offers the honey he declines; Sawda: 'we have deprived him'", cluster: narrative}
  umar-a-year-afraid-to-ask: {label: "Ibn Abbas waits a year, too awed to ask Umar who the two wives were; on the road back from pilgrimage at the arak trees Umar answers 'Hafsa and Aisha'", cluster: narrative}
  wife-answers-back-umar-rebuked: {label: "Umar's wife answers him back: your daughter answers back the messenger till he is angry all day; Umar warns Hafsa; Umm Salama rebukes him for meddling", cluster: narrative}
  neighbour-takes-turns-bringing-news: {label: "Umar and an Ansari neighbour take turns bringing news; knocking 'open, open!' he says: worse than the Ghassanid, the prophet has withdrawn from his wives", cluster: narrative}
  mat-marks-on-side-kisra-and-caesar: {label: "In the upper room reached by a palm-trunk ladder, the prophet lies on a mat with nothing between, a leather pillow stuffed with fibre, mimosa leaves at his feet and hides hung; seeing the mat's mark Umar weeps for Kisra and Caesar: 'theirs the world and yours the next'", cluster: narrative}
  slave-girl-forbidden-to-himself: {label: "The prophet had a slave woman he went in to; Aisha and Hafsa pressed till he forbade her to himself, and Q 66:1 came down; 'Umm Ibrahim is forbidden to me', till the release of oaths came", cluster: law}
  forbidding-wife-is-an-oath-to-expiate: {label: "Ibn Abbas: a man who declares his wife forbidden to him has sworn an oath he must expiate", cluster: law}
  four-lines-drawn-for-four-best-women: {label: "The prophet draws four lines in the earth: 'the best women of the people of paradise: Khadija, Fatima, Asiya, Mary'", cluster: narrative}
  surah-of-thirty-verses-argues-for-its-reader: {label: "A surah of thirty verses disputed for its companion till it brought him into paradise (or interceded till he was forgiven): Tabarak", cluster: scripture}
  no-sleep-before-sajda-and-mulk: {label: "The prophet did not sleep until he had recited Alif Lam Mim al-Sajda and Tabarak", cluster: ritual}
  seven-shaded-list-in-full: {label: "The seven shaded: a just ruler, a youth grown up in worship, a man who remembers God alone and weeps, a man whose heart hangs on the mosque, two who love in God, a man refusing a woman of rank and beauty, a secret almsgiver", cluster: eschatology}
  changed-away-from-prophet-not-hypocrisy: {label: "'We are one way with you and another when we leave'; 'how are you with your Lord?' - 'God is our Lord in secret and open'; 'that is not hypocrisy'", cluster: ethics}
  fed-like-birds-going-out-hungry: {label: "Were you to trust God as he should be trusted, he would feed you as he feeds the birds: they go out hungry in the morning and return full", cluster: theology}
  his-character-was-the-quran: {label: "Asked about the prophet's character, Aisha: 'do you not read the Quran? His character was the Quran'", cluster: narrative}
  two-graves-talebearer-and-urine: {label: "Passing two graves: they are punished, not for a great thing: one went about with tale-bearing, the other did not screen himself from his urine; he splits a fresh palm stalk and plants one on each, 'it may lighten them while they stay moist'", cluster: eschatology}
  talebearer-not-enter-paradise: {label: "'A tale-bearer (qattat, nammam) will not enter paradise'", cluster: ethics}
  zanim-man-with-a-dewlap: {label: "'Coarse and moreover zanim' (Q 68:13): a man of Quraysh with a tag (zanama) like a sheep's dewlap, by which they recognised him", cluster: narrative}
  weak-of-paradise-coarse-of-hell: {label: "The people of paradise: every weak and humbled one whose oath God would fulfil; the people of hell: every coarse ('utull), greedy (jawwaz), arrogant one", cluster: eschatology}
  shin-uncovered-back-becomes-one-plate: {label: "Our Lord uncovers his shin; every believer prostrates; whoever prostrated for show tries and his back becomes a single plate", cluster: eschatology}
  worldly-gifts-for-sins-are-istidraj: {label: "When you see God give a servant what he loves of the world for his sins, it is only leading on step by step (istidraj)", cluster: theology}
  god-respites-oppressor-then-seizes: {label: "'God gives the oppressor respite, but when he seizes him he does not let him go'", cluster: theology}
  lead-ball-falls-five-hundred-years-chain-forty-autumns: {label: "A lead ball like a skull sent from heaven to earth, five hundred years' journey, would arrive before night; sent from the head of the chain it would travel forty autumns, night and day, before reaching its root", cluster: eschatology}
  day-of-fifty-thousand-years-of-branding-and-trampling: {label: "The withholder of zakat on gold and silver is branded with plates of fire, the owner of camels, cattle and sheep trampled and gored by them, 'in a day whose measure is fifty thousand years', till judgment is made among the servants", cluster: eschatology}
  idols-of-noah-were-righteous-men-commemorated: {label: "Wadd, Suwa', Yaghuth, Ya'uq and Nasr were names of righteous men of Noah's people; Satan inspired their people to set up stones (ansab) in their sitting places; they were worshipped only after knowledge was forgotten", cluster: theology}
  noahs-idols-assigned-to-arab-tribes: {label: "Wadd to Kalb at Dumat al-Jandal, Suwa' to Hudhayl, Yaghuth to Murad then Ghutayf at al-Jurf by Saba', Ya'uq to Hamdan, Nasr to Himyar of Dhu l-Kala'", cluster: theology}
  jinn-heard-on-way-to-ukaz: {label: "Shooting stars barred the devils from heaven's news; they searched east and west; those who went toward Tihama found the prophet at Nakhla on the way to the market of 'Ukaz praying the dawn with his companions", cluster: narrative}
  tree-announced-the-jinn: {label: "Asked who told the prophet of the jinn the night they listened: 'a tree announced them (adhanat bihim shajara)'", cluster: narrative}
  stones-not-bone-or-dung-for-cleansing: {label: "'Bring me stones to clean myself; do not bring a bone or dung' - they are food of the jinn", cluster: ritual}
  no-sleep-or-fasting-whole-month-or-whole-quran: {label: "Aisha: the prophet never read the whole Quran in a night, never prayed a night through to dawn, never fasted a whole month but Ramadan", cluster: ritual}
  night-prayer-obligatory-a-year-then-voluntary: {label: "God made night prayer obligatory at the start of al-Muzzammil; the prophet and companions stood a year (their feet swelling) and God held back its end twelve months in heaven till the lightening came, and it became voluntary", cluster: ritual}
  witr-nine-sitting-only-at-eighth: {label: "His witr: nine rak'as sitting only at the eighth, rising without salam for the ninth, then two sitting: eleven; grown heavy he prayed seven", cluster: ritual}
  missed-night-prayer-made-up-twelve-by-day: {label: "When sleep or pain kept him from night prayer he prayed twelve rak'as by day", cluster: ritual}
  six-companions-stopped-from-selling-all-to-fight: {label: "Sa'd b. Hisham, wanting to sell his property for arms and fight the Romans till death, is told six men wished it in the prophet's life and he forbade them: 'have you no example in me?'", cluster: ethics}
  recitation-hasty-like-poetry-paired-surahs: {label: "To one who read the Mufassal in one rak'a: 'hasty like the hasty reading of poetry!'; the prophet paired twenty surahs of the Mufassal, two in each rak'a", cluster: ritual}
  recite-and-ascend-last-verse-is-your-station: {label: "It will be said to the companion of the Quran: recite and ascend and chant as you chanted in the world; your station is at the last verse you recite", cluster: eschatology}
  vow-of-obedience-kept-of-disobedience-not: {label: "Whoever vows to obey God, let him obey; whoever vows to disobey him, let him not disobey", cluster: law}
  i-was-not-commanded-monasticism: {label: "To Uthman b. Maz'un who left women: 'I was not commanded with monasticism; my sunna is to pray and sleep, fast and eat, marry and divorce; your family has a right on you'; companions had agreed to castrate themselves if he allowed it", cluster: ethics}
  celibacy-forbidden: {label: "'The prophet forbade celibacy (tabattul)'", cluster: law}
  your-wealth-is-what-you-send-ahead: {label: "'Which of you loves his heir's wealth more than his own?' - his wealth is what he sent ahead; his heir's wealth is what he held back", cluster: ethics}
  walid-praises-quran-then-calls-it-magic: {label: "Al-Walid b. al-Mughira, moved by the Quran, tells Abu Jahl: none knows poetry, rajaz, qasida or the jinn's poems better than I; it has sweetness and grace, fruitful above, abundant below; pressed, he thinks and says 'it is magic handed down'", cluster: narrative}
  trumpeter-gaze-fixed-on-throne: {label: "The trumpeter's gaze since he was charged is fixed on the Throne, ready, lest he be ordered before his glance returns; his eyes like two shining stars", cluster: eschatology}
  say-god-suffices-at-the-trumpet: {label: "Asked what to say then: 'God suffices us, an excellent guardian; on God we rely'", cluster: ritual}
  gabriel-shown-hold-still-then-recited: {label: "After the verse, when Gabriel came the prophet bowed his head (atraqa) and listened; when he left he recited as God promised", cluster: scripture}
  lip-movement-imitated-down-the-chain: {label: "Ibn Abbas: 'I move my lips for you as he did'; Sa'id: 'I move them as Ibn Abbas did'", cluster: scripture}
  said-by-prophet-then-revealed: {label: "Ibn Abbas on 'woe to you, then woe' (Q 75:34-35): the prophet said it first, then God sent it down", cluster: scripture}
  see-lord-as-full-moon-and-sun: {label: "'Do you crowd one another to see the moon on a full night, the sun with no cloud?' - 'then you will see him so'", cluster: eschatology}
  woman-bathes-after-wet-dream-whence-resemblance: {label: "A woman who sees in sleep what a man sees must bathe; 'whence else the resemblance?'; the man's fluid thick and white, the woman's thin and yellow; whichever rises or precedes, the likeness is from it", cluster: law}
  rabbi-shoved-for-greeting-by-name: {label: "A rabbi greets 'peace on you, Muhammad'; Thawban shoves him; 'we call him by the name his family gave'; 'my name is Muhammad, given by my family'", cluster: narrative}
  rabbi-asks-only-a-prophet-knows-the-child: {label: "The rabbi asks what none but a prophet or one or two men know, the child; male if the man's fluid rises over the woman's, female if hers over his; 'I knew nothing of it till God brought it to me'", cluster: narrative}
  every-man-sells-his-soul-freeing-or-ruining: {label: "Every man goes out in the morning selling his soul, freeing it or ruining it", cluster: ethics}
  purity-half-of-faith-praise-fills-the-scale: {label: "Purity is half of faith; al-hamdu li-llah fills the scale; subhan Allah and al-hamdu li-llah fill what is between heaven and earth; prayer light, alms proof, patience brightness, the Quran an argument for or against you", cluster: ethics}
  flesh-grown-of-unlawful-gain-to-the-fire: {label: "To Ka'b b. Ujra: fasting a shield, alms put out sin, prayer an offering; no flesh grown from unlawful gain (suht) enters paradise, the fire is more fitting for it", cluster: ethics}
  ask-me-of-everything-all-from-water: {label: "Abu Hurayra asks 'tell me of everything'; 'everything was created from water'", cluster: cosmology}
  snake-in-cave-at-mina-spared: {label: "In a cave at Mina as al-Mursalat is revealed fresh on his lips, a snake comes out; 'kill it'; it escapes: 'it was spared your harm as you were spared its harm'", cluster: narrative}
  sparks-as-logs-and-ship-ropes: {label: "Ibn Abbas on 'it throws sparks like palaces (qasr)': logs three cubits long raised for winter, called qasr; 'like yellow camels (jimalat)': ships' ropes bound till they are as thick as a man's waist", cluster: eschatology}
  quaking-then-following-death-with-all-in-it: {label: "'The quaking (al-rajifa) has come, followed by the one that follows (al-radifa); death has come with all that is in it'", cluster: eschatology}
  kept-asking-of-the-hour-till-verse: {label: "The prophet kept being asked about (or kept mentioning) the Hour until 'what have you to do with mentioning it? to your Lord is its end' came down, and he stopped", cluster: scripture}
  sent-with-the-hour-like-two-fingers: {label: "'I was sent, I and the Hour, like these two', joining the forefinger and middle finger", cluster: eschatology}
  frowned-at-blind-man-for-a-chief: {label: "Ibn Umm Maktum the blind man comes saying 'guide me' while the prophet speaks with a chief of the idolaters (Ubayy b. Khalaf) and turns from him; 'He frowned and turned away' comes down; afterwards he honoured him", cluster: narrative}
  blind-man-at-qadisiyya-with-black-banner: {label: "Anas saw Ibn Umm Maktum on the day of al-Qadisiyya in a coat of mail with a black banner", cluster: narrative}
  fluent-reciter-with-noble-scribes-stammerer-two-rewards: {label: "One who recites the Quran by heart is with the noble righteous scribes; one who recites it with difficulty, struggling, has two rewards", cluster: ethics}
  naked-at-resurrection-too-grave-to-look: {label: "Gathered barefoot, naked, uncircumcised: 'men and women looking at one another?' - 'the matter is too grave for that to concern them' / 'people will be busy: every man that day will have enough to occupy him'", cluster: eschatology}
  sweat-reaches-earlobes: {label: "On Resurrection day people sweat till it bridles them and reaches their earlobes (shuhum al-adhan)", cluster: eschatology}
  surahs-show-resurrection-as-if-seen: {label: "Whoever would see the Day of Resurrection as with his eyes, let him read 'When the sun is rolled up', 'When the sky is cleft', 'When the sky is split' (and Hud)", cluster: scripture}
  three-fabrications-whoever-says-he-saw-his-lord: {label: "Aisha: three things whose speaker lies greatly against God; whoever claims Muhammad saw his Lord; 'it was only Gabriel, whom I saw in his created form only these two times, coming down filling all between heaven and earth'", cluster: theology}
  gabriel-filling-horizon-twice: {label: "The prophet saw Gabriel in the form in which he was created only twice, descending from the sky, the greatness of his frame filling what is between sky and earth", cluster: theology}
  muadh-are-you-a-tempter-long-prayer: {label: "Mu'adh lengthens the prayer reciting al-Baqara (and al-Nisa'); a man prays alone and is called a hypocrite; 'Mu'adh, are you a tempter (fattan)?' three times: recite al-A'la, al-Shams, al-Layl, al-Duha, al-Infitar, al-Tariq", cluster: ritual}
  servant-pleads-no-witness-but-himself-limbs-speak: {label: "The servant asks 'did you not protect me from injustice? I allow no witness against me but from myself'; 'your self suffices, and the noble scribes'; his mouth is sealed, his limbs speak; then: 'away with you, it was for you I was arguing'", cluster: eschatology}
  short-measure-at-medina-then-good-measure: {label: "When the prophet came to Medina its people were the worst in measuring; 'woe to the stinters' came down and they measured well after", cluster: law}
  sun-a-mile-off-sweat-by-deeds: {label: "The sun is brought near to a mile; people stand in sweat by their deeds: to the ankles, knees, waist, some bridled to the mouth; (the narrator: the mile of distance or the kohl stick?)", cluster: eschatology}
  ten-takbirs-opening-night-prayer: {label: "He opened the night prayer with ten takbirs, ten praises, ten glorifications, ten tahlils, ten requests of forgiveness, and sought refuge from the narrowness of the standing on Resurrection day", cluster: ritual}
  prostrated-at-inshiqaq-on-prophets-example: {label: "Abu Hurayra prostrates at 'when the sky is split': 'had I not seen the prophet prostrate I would not have'", cluster: ritual}
  scrutinized-reckoning-means-perdition: {label: "'None is reckoned but perishes'; the easy reckoning is only the presentation (al-'ard); 'whoever's reckoning is scrutinized (nuqisha) perishes / is punished'", cluster: eschatology}
  easy-reckoning-is-to-be-passed-over: {label: "'O God, reckon me with an easy reckoning'; it is to look into his book and pass it over; even the thorn that pricks the believer expiates", cluster: eschatology}
  maghrib-lasts-while-twilight-remains: {label: "The time of the sunset prayer lasts as long as the twilight (al-shafaq) has not gone", cluster: ritual}
  stage-after-stage-said-of-the-prophet: {label: "Ibn Abbas: 'you will ride stage upon stage' - state after state; 'your prophet said it'", cluster: scripture}
  child-in-arms-tells-mother-to-be-patient: {label: "A woman with her child hesitates at the fire-trench; the child says 'mother, be patient, you are on the truth'", cluster: narrative}
  first-to-come-to-medina-teach-quran: {label: "Al-Bara': Mus'ab b. Umayr and Ibn Umm Maktum came first and taught the Quran, then Ammar, Bilal and Sa'd, then Umar with twenty, then the prophet; maids and boys rejoiced; by then al-Bara' had read 'Glorify the name' with surahs like it", cluster: narrative}
  feast-and-friday-a-la-and-ghashiya: {label: "In the two feasts and Friday he read al-A'la and al-Ghashiya; if feast and Friday fell on one day, both in both prayers", cluster: ritual}
  witr-of-three-with-ala-kafirun-ikhlas: {label: "He prayed witr of three: al-A'la in the first, al-Kafirun in the second, al-Ikhlas in the third", cluster: ritual}
  sinners-made-charcoal-then-sprout-by-river: {label: "The people of the fire neither die nor live; but some the fire took for sins are made to die till they are charcoal; then brought in groups (dabair), spread on the rivers of paradise, water poured on them, and they sprout like seed in the flood's silt", cluster: eschatology}
  harm-the-passing-for-the-lasting: {label: "Whoever seeks this world harms his next, whoever seeks the next harms this; 'so harm the passing for the lasting'", cluster: ethics}
  rider-resting-under-tree-then-moving-on: {label: "Lying on a mat that marked his side: 'what have I to do with this world? I am only like a rider who shades under a tree, then goes and leaves it'", cluster: ethics}
  bedouin-asks-by-him-who-made-heaven: {label: "A bedouin: 'by him who made heaven and earth and set these mountains, did God send you?' and so for prayer, zakat, fasting, pilgrimage; 'I will add nothing and take nothing'; 'if he is truthful he enters paradise'", cluster: narrative}
  fight-until-there-is-no-god-but-god: {label: "'I was commanded to fight people until they say there is no god but God; then their blood and property are safe except by its right, and their reckoning is with God'; then he recited 'you are only a reminder' (Q 88:21-22)", cluster: law}
  all-enter-paradise-but-who-refuses: {label: "'All my community enter paradise except whoever refuses'; who refuses? 'whoever obeys me enters paradise, whoever disobeys me has refused'", cluster: theology}
  bolts-from-god-like-camel-from-family: {label: "'All of you will enter paradise except one who bolts from God as a camel bolts from its family'", cluster: theology}
  ten-ten-of-adha-witr-arafa-shaf-nahr: {label: "'The ten are the ten of al-Adha; the odd (witr) is the day of Arafa, the even (shaf') the day of sacrifice'", cluster: ritual}
  no-deeds-better-than-in-the-ten: {label: "No days are deeds more beloved to God than these ten; 'not even jihad?' - not even jihad, except a man who goes out with self and wealth and returns with none of it", cluster: ritual}
  orphan-guardian-beside-me-two-fingers: {label: "'I and the guardian of an orphan in paradise like this', with forefinger and middle finger", cluster: ethics}
  prostrate-from-birth-to-death-seems-little: {label: "Were a man to fall on his face from the day he was born to the day he dies of old age in God's pleasure, he would think it little on Resurrection day", cluster: eschatology}
  freed-slave-ransoms-limb-for-limb: {label: "Whoever frees a Muslim, God saves for every limb of his a limb from the fire; Ali b. Husayn freed a slave for whom Abd Allah b. Ja'far offered ten thousand dirhams", cluster: law}
  best-alms-to-hostile-kinsman: {label: "'The best alms is to the kinsman who bears enmity (al-kashih)'", cluster: ethics}
  no-mercy-to-people-none-from-god: {label: "'Whoever does not show mercy to people, God shows him no mercy'", cluster: ethics}
  mazinas-ask-is-it-decreed: {label: "Two men of Muzayna ask if what people strive at is decreed beforehand; 'decreed and passed upon them'; Imran tests Abu l-Aswad: 'would that not be injustice?' - 'everything is God's creation and his property'", cluster: theology}
  each-eased-to-what-he-was-created-for: {label: "'Can the people of paradise be known from the people of the fire?' - yes; 'then why do they work?' - 'each works for what he was created for, or what he is eased to'", cluster: theology}
  give-my-soul-its-piety-purify-it: {label: "'O God, give my soul its piety and purify it, you are the best to purify it, its guardian and master'; refuge from knowledge that does not benefit, a heart that does not humble itself, a soul never sated, a prayer not answered", cluster: ritual}
  wa-l-dhakari-wa-l-untha-reading: {label: "Ibn Mas'ud's and Abu l-Darda's reading 'by the night when it covers, the day when it shines, and the male and the female' (without 'and what created'), heard from the prophet's mouth", cluster: scripture}
  people-of-kufa-sandals-and-secret-keeper: {label: "Abu l-Darda': is not among you Ibn Umm Abd, keeper of the sandals, pillow and water-jug, and the one God protected from Satan, and the keeper of the prophet's secret?", cluster: narrative}
  abu-bakr-frees-weak-slaves-for-god: {label: "Abu Quhafa: 'you free weak slaves; free strong men who would defend you'; Abu Bakr: 'I want only what I want for God'; Q 92:5-21 is said to concern him", cluster: narrative}
  place-in-paradise-or-fire-written-work-anyway: {label: "At a funeral in Baqi' al-Gharqad, scratching the ground with a stick: every soul's place in paradise or fire is written; 'shall we rely on our book and leave work?' - 'work, each is eased to it', then Q 92:5-10", cluster: theology}
  warning-of-fire-heard-across-market: {label: "'I warn you of the fire! I warn you of the fire!' from the pulpit till a man at the far end of the market could hear, and his cloak fell at his feet", cluster: eschatology}
  ember-under-sole-boils-brain: {label: "The least punished of the fire on Resurrection day: a man with an ember under the hollow of his feet from which his brain boils", cluster: eschatology}
  thousand-palaces-for-what-is-opened-to-community: {label: "Shown what would be opened to his community after him, town by town, he was glad, and 'your Lord will give you and you will be content' came down: a thousand palaces in paradise with fitting wives and servants", cluster: eschatology}
  question-i-wished-not-asked-earlier-prophets: {label: "'I asked my Lord a question I wish I had not: before me were messengers, to some you subjected the winds, some revived the dead'; 'did I not find you an orphan and shelter you, astray and guide you, open your breast and lift your burden?' - 'yes, Lord'", cluster: narrative}
units:
  - id: hadith-60-alms-before-private-talk
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Alms before a private talk with the prophet cut down to a barleycorn; the lightening verse (Q 58:12-13)"
    read: ["Jāmiʿ 60:7540.1"]
    quran: ["58:12-13"]
    tags:
      - {motif: alms-before-private-talk-reduced-to-barleycorn, refs: ["Jāmiʿ 60:7540.1"], note: "ما ترى دينار؟ قلت: لا يطيقونه. قال: فنصف دينار؟ ... قلت: شعيرة. قال: إنك لزهيد ... فبي خفف الله عن هذه الأمة"}
  - id: hadith-60-false-oaths-and-satans-mastery
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "The man with a devil's eye and his friends swear falsely; three without a call to prayer overpowered by Satan (Q 58:18-19)"
    read: ["Jāmiʿ 60:7541.1-7541.2"]
    quran: ["58:18", "58:19"]
    tags:
      - {motif: man-with-satans-eye-swears-falsely, refs: ["Jāmiʿ 60:7541.1"], note: "يجيئكم رجل ينظر إليكم بعين شيطان ... فجاء رجل أزرق ... فجعلوا يحلفون بالله ما قالوا وما فعلوا"}
      - {motif: three-without-call-to-prayer-overpowered-by-satan, refs: ["Jāmiʿ 60:7541.2"], note: "ما من ثلاثة في قرية لا يؤذنون، ولا تقام فيهم الصلاة إلا استحوذ عليهم الشيطان ... فإن الذئب يأكل القاصية"}
  - id: hadith-60-surah-names-hashr
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Ibn Abbas on the names of surahs; al-Hashr is the surah of al-Nadir"
    read: ["Jāmiʿ 60:7542.1-7542.2"]
    quran: ["59:1-24", "9:1-129", "8:1-75"]
    tags:
      - {motif: surah-names-tawba-the-exposer-hashr-al-nadir, refs: ["Jāmiʿ 60:7542.1", "Jāmiʿ 60:7542.2"], note: "التوبة هي الفاضحة، ما زالت تنزل: ومنهم ومنهم ... قال: قل: سورة النضير"}
  - id: hadith-60-expulsion-of-nadir
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Quraysh's letters, the Nadir plot and the expulsion; palms cut, fay' for the prophet (Q 59:1-6)"
    read: ["Jāmiʿ 60:7542.3-7545.1"]
    quran: ["59:1-6", "59:5", "59:6"]
    tags:
      - {motif: quraysh-letter-threatens-medinan-idolaters, refs: ["Jāmiʿ 60:7542.3"], note: "إنكم آويتم صاحبنا ... وإنا نقسم بالله لتقتلنه أو لتخرجنه ... حتى نقتل مقاتلتكم، ونستبيح نساءكم"}
      - {motif: women-anklets-no-barrier-threat, refs: ["Jāmiʿ 60:7542.3"], note: "ولا يحول بيننا وبين خدم نسائكم شيء وهي الخلاخيل"}
      - {motif: thirty-rabbis-then-three, refs: ["Jāmiʿ 60:7542.3"], note: "اخرج إلينا في ثلاثين رجلا ... ثلاثين حبرا ... اخرج في ثلاثة ... واشتملوا على الخناجر؛ فأرسلت امرأة ناصحة من بني النضير إلى بني أخيها"}
      - {motif: houses-demolished-for-their-timber, refs: ["Jāmiʿ 60:7542.3"], note: "على أن لهم ما أقلت الإبل إلا الحلقة ... وأبواب بيوتهم، وخشبها، فكانوا يخربون بيوتهم"}
      - {motif: exile-first-gathering-to-sham, refs: ["Jāmiʿ 60:7542.3"], note: "وكان جلاؤهم ذلك أول حشر الناس إلى الشام، وكان بنو النضير من سبط من أسباط بني إسرائيل، لم يصبهم جلاء منذ كتب الله على بني إسرائيل الجلاء"}
      - {motif: nadir-palms-given-to-emigrants-and-two-poor-ansar, refs: ["Jāmiʿ 60:7542.3"], note: "فأعطى النبي ﷺ أكثرها للمهاجرين ... ولرجلين من الأنصار كانا ذوي حاجة ... وبقي منها صدقة رسول الله ﷺ في يد بني فاطمة"}
      - {motif: palms-of-buwayra-burned-and-cut, refs: ["Jāmiʿ 60:7544.1"], note: "حرق نخل بني النضير وقطع، وهي البويرة"}
      - {motif: palm-trees-cut-by-gods-leave, refs: ["Jāmiʿ 60:7544.1", "Jāmiʿ 60:7544.2"], note: "ما قطعتم من لينة أو تركتموها قائمة على أصولها فبإذن الله"}
      - {motif: cut-palm-reward-left-palm-no-sin, refs: ["Jāmiʿ 60:7544.2"], note: "اللينة: النخلة ... هل لنا فيما قطعنا من أجر؟ وهل علينا فيما تركنا من وزر؟"}
      - {motif: fay-revenue-kept-for-a-years-food, refs: ["Jāmiʿ 60:7545.1"], note: "ينفق على أهله منها نفقة سنته، ثم يجعل ما بقي في السلاح والكراع، عدة في سبيل الله"}
      - {motif: fay-booty-without-fighting-for-prophet-kin-poor, refs: ["Jāmiʿ 60:7545.1"], note: "مما لم يوجف المسلمون عليه بخيل ولا ركاب، فكانت لرسول الله ﷺ خاصة"}
    hints:
      - "Exiles told they may take what their camels carry except weapons, and wrecking their own houses for doors and beams, against the Israelites taking the Egyptians' goods at the exodus (Exod 12:35-36): the direction of the spoil is reversed."
  - id: hadith-60-what-the-messenger-gives-take-it
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "The curse on tattooing and plucking found in the Book through 'what the messenger gives you'; leave me as I leave you (Q 59:7)"
    read: ["Jāmiʿ 60:7545.2-7546.1"]
    quran: ["59:7"]
    tags:
      - {motif: tattooers-pluckers-gap-makers-cursed-as-altering-creation, refs: ["Jāmiʿ 60:7545.2"], note: "لعن الله الواشمات والموتشمات والمتنمصات والمتفلجات للحسن المغيرات خلق الله"}
      - {motif: woman-reads-between-two-covers-finds-no-curse, refs: ["Jāmiʿ 60:7545.2"], note: "لقد قرأت ما بين اللوحتين، فما وجدت فيه ما تقول. قال: لئن كنت قرأتيه لقد وجدتيه ... وما آتاكم الرسول فخذوه"}
      - {motif: leave-me-as-i-leave-you, refs: ["Jāmiʿ 60:7546.1"], note: "دعوني ما تركتكم ... فإذا نهيتكم عن شيء فاجتنبوه، وإذا أمرتكم بأمر فائتوا منه ما استطعتم"}
      - {motif: earlier-peoples-destroyed-by-many-questions, refs: ["Jāmiʿ 60:7546.1"], note: "إنما هلك من كان قبلكم بسؤالهم واختلافهم على أنبيائهم"}
    hints:
      - "Women tattooing and the tattooed cursed against Lev 19:28, 'nor print any marks upon you'."
  - id: hadith-60-ansar-and-preference
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "The Ansar who 'prefer others over themselves': Umar's charge, the Bahrain grants, the shared palms, the guest fed in the dark, avarice (Q 59:9)"
    read: ["Jāmiʿ 60:7546.2-7548.1"]
    quran: ["59:9"]
    tags:
      - {motif: caliph-charged-with-emigrants-and-ansar, refs: ["Jāmiʿ 60:7546.2"], note: "أوصي الخليفة بالمهاجرين الأولين: أن يعرف لهم حقهم، وأوصي الخليفة بالأنصار ... أن يقبل من محسنهم، ويعفو عن مسيئهم"}
      - {motif: ansar-refuse-bahrain-grant-unless-emigrants-share, refs: ["Jāmiʿ 60:7546.3"], note: "دعا النبي ﷺ الأنصار إلى أن يقطع لهم البحرين، فقالوا: لا، إلا أن تقطع لإخواننا من المهاجرين مثلها ... سيصيبكم بعدي أثرة"}
      - {motif: helpers-fear-taking-all-the-reward, refs: ["Jāmiʿ 60:7546.4"], note: "حتى لقد خفنا أن يذهبوا بالأجر كله. فقال: لا، ما دعوتم الله لهم وأثنيتم عليهم"}
      - {motif: ansar-decline-to-split-palms-share-fruit, refs: ["Jāmiʿ 60:7547.1"], note: "اقسم بيننا وبين إخواننا النخيل. قال: لا. قالوا: تكفونا المؤونة ونشرككم في الثمرة"}
      - {motif: lamp-put-out-guest-eats-children-sleep, refs: ["Jāmiʿ 60:7547.2"], note: "ما عندي إلا قوت الصبية ... فنوميهم ... فأطفئي السراج، ونطوي بطوننا الليلة ... لقد عجب الله أو ضحك من فلان وفلانة"}
      - {motif: avarice-destroyed-those-before-you, refs: ["Jāmiʿ 60:7548.1"], note: "اتقوا الشح، فإن الشح أهلك من كان قبلكم، حملهم على أن سفكوا دماءهم، واستحلوا محارمهم"}
    hints:
      - "Host who puts the lamp out so the guest does not see he eats alone, against the rabbinic tale of Mar Ukba and his wife hiding in the oven so as not to shame the poor man (b. Ketubbot 67b): concealment to spare the recipient."
  - id: hadith-60-pray-for-those-before
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Ordered to ask forgiveness for the companions, they reviled them (Q 59:10)"
    read: ["Jāmiʿ 60:7548.2"]
    quran: ["59:10"]
    tags:
      - {motif: ordered-to-pray-for-companions-they-reviled-them, refs: ["Jāmiʿ 60:7548.2"], note: "يا ابن أختي! أمروا أن يستغفروا لأصحاب النبي ﷺ فسبوهم"}
  - id: hadith-60-mudar-tribe-and-good-precedent
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "The ragged tribe of Mudar, the sermon on 'what it sent ahead for tomorrow', and the good and bad precedent (Q 59:18)"
    read: ["Jāmiʿ 60:7549.1"]
    quran: ["59:18", "4:1"]
    tags:
      - {motif: ragged-mudar-tribe-moves-sermon-on-alms, refs: ["Jāmiʿ 60:7549.1"], note: "قوم حفاة عراة مجتابي النمار ... فتمعر وجه رسول الله ﷺ ... ولو بشق تمرة ... حتى رأيت كومين من طعام وثياب ... كأنه مذهبة"}
      - {motif: good-precedent-reward-bad-precedent-burden, refs: ["Jāmiʿ 60:7549.1"], note: "من سن في الإسلام سنة حسنة فله أجرها وأجر من عمل بها بعده ... ومن سن في الإسلام سنة سيئة كان عليه وزرها ووزر من عمل بها"}
  - id: hadith-60-ninety-nine-names
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "God's ninety-nine names; he is odd and loves the odd (Q 59:24)"
    read: ["Jāmiʿ 60:7550.1"]
    quran: ["59:24"]
    tags:
      - {motif: ninety-nine-names-memorized-enter-paradise, refs: ["Jāmiʿ 60:7550.1"], note: "لله تسعة وتسعون اسما مائة إلا واحدة، لا يحفظها أحد إلا دخل الجنة، وهو وتر يحب الوتر"}
  - id: hadith-60-hatibs-letter
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Hatib's letter carried by a woman to Mecca, found in her braids; the people of Badr forgiven (Q 60:1)"
    read: ["Jāmiʿ 60:7550.2"]
    quran: ["60:1"]
    tags:
