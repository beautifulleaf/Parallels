  - motif: striking-scripture-parts-against-each-other
    refs:
    - Jāmiʿ 2:701.2
    note: بهذا أُمرتم؟ ! أو لهذا خُلقتُم؟ ! تضربون القرآن بعضَه ببعض، بهذا هلكتِ الأممُ قبلكم
  - motif: talk-of-decree-deferred-to-worst
    refs:
    - Jāmiʿ 2:701.3
    note: أُخِّر الكلام في القدر لشرار هذه الأمّة
- id: hadith-2-deniers-of-decree
