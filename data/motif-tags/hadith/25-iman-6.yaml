  - motif: first-band-faces-like-full-moon
    refs:
    - Jāmiʿ 2:683.2
    note: فتنجو أوّل زمرة، وجوههم كالقمر ليلة البدْر ... ثم الذين يلونهم كأضوإ نجم في السماء
  - motif: seventy-thousand-without-reckoning
    refs:
    - Jāmiʿ 2:683.2
    note: سبعون ألفًا لا يُحاسبون
  - motif: taken-from-fire-with-grain-of-faith
    refs:
    - Jāmiʿ 2:683.2
    note: وكان في قلبه من الخير ما يزنُ شعيرةً
  - motif: paradise-people-sprinkle-water-on-the-rescued
    refs:
    - Jāmiʿ 2:683.2
