    note: السّلام عليك يا محمّد! فدفعتُه ... إنّما ندعوه باسمه الذي سمّاه به أهلُه ... إنّ اسمي محمّد الذي سمّاني به أهلي
  - motif: rabbis-questions-darkness-fish-liver-ox
    refs:
    - Jāmiʿ 2:685.1
    note: 'فَنَكَتَ رسولُ اللَّه ﷺ بعُودٍ معه فقال: سَلْ ... قال: صدقت'
  - motif: people-in-darkness-below-the-bridge-when-earth-is-changed
    refs:
    - Jāmiʿ 2:685.1
    note: هم في الظُّلْمة دون الجسر
  - motif: poor-emigrants-cross-first
    refs:
