  - motif: faith-requires-four-beliefs
    refs:
    - Jāmiʿ 2:692.2
    note: 'لا يؤمنُ عبد حتّى يؤمن بأربع: يشهد أن لا إله إلا اللَّه ... ويؤمن بالموت، ويؤمن بالبعث بعد الموت، ويؤمن بالقدر'
  - motif: faith-includes-decree-good-and-evil
    refs:
    - Jāmiʿ 2:693.1
    note: لا يؤمنُ المرأُ حتّى يؤمن بالقدر خيره وشرّه
  - motif: what-strikes-you-could-not-miss-you
    refs:
    - Jāmiʿ 2:694.1
    note: لكلّ شيء حقيقة، وما بلغ عبد حقيقة الإيمان حتى يعلم أنّ ما أصابه لم يكن ليخطئه
- id: hadith-2-evil-eye-and-decree
