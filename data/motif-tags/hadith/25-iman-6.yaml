    note: 'إنّ بني جعفر تُصيبُهم العين، فأسترقي لهم؟ قال: نعم'
- id: hadith-2-pen-first-created
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The first thing God created was the Pen; 'Write!'; the copying of deeds from what is finished
  read:
  - Jāmiʿ 2:696.3-698.2
  quran:
  - '45:29'
  tags:
  - motif: dying-father-charges-son-with-decree
    refs:
    - Jāmiʿ 2:696.3
    note: 'قال لابنه: يا بني إنّك لن تجد طعم حقيقة الإيمان حتى تعلم ... من مات على غير هذا فليس مني'
  - motif: pen-first-created-and-told-to-write
    refs:
    - Jāmiʿ 2:696.3
    - Jāmiʿ 2:698.1
    - Jāmiʿ 2:698.2
    note: 'إنّ أول ما خلق اللَّه القلمَ، فقال له: اكتبْ. قال: ربِّ، ماذا أكتب؟ قال: اكتبْ مقادير كلِّ شيءٍ حتّى تقوم السّاعة'
  - motif: pen-taken-in-gods-right-hand
    refs:
    - Jāmiʿ 2:698.2
    note: فأخذه بيمينه -وكلتا يديه يمين- ... رطب أو يابس، فأحصاه عنده في الذّكر
  - motif: deeds-copied-from-a-finished-record
    refs:
    - Jāmiʿ 2:698.2
    note: إِنَّا كُنَّا نَسْتَنْسِخُ مَا كُنْتُمْ تَعْمَلُونَ ... فهل تكون النّسخة إلّا من شيء قد فُرغ منه
  hints:
  - The pen created first and told to write all that will be, against the Torah as the first-created instrument written before the world, Gen. Rab. 1:1-4 and m. Avot 5:6, where 'the writing and the pen' are among the ten things created on the eve of the first Sabbath
