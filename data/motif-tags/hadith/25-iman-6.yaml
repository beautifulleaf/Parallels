  - motif: belief-in-decree-condition-of-accepted-spending
    refs:
    - Jāmiʿ 2:700.1
    note: لو أنّ أحدهم مثل أُحد ذهبًا فأنْفَقَه ما قبل اللَّه منه، حتّى يؤمن بالقدر
  - motif: gabriel-in-human-form-teaches-faith
    refs:
    - Jāmiʿ 2:700.1
    note: إذْ طلع علينا رجلٌ شديد بياض الثّياب ... أن تؤمن بالقدر خيره وشرّه
