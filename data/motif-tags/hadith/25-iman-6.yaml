    refs:
    - Jāmiʿ 2:704.1
    note: 'إنّ فلانًا يقرؤُك السّلام، قال: إنّه بلغني أنّه قد أحدث، فإن كان قد أحدث فلا تقرئْهُ منّي السّلام'
  - motif: sinking-transformation-pelting-in-community
    refs:
    - Jāmiʿ 2:704.1
    note: يكون في أمّتي -أو في هذه الأمّة- مَسْخٌ وخَسْف وقَذْف، وذلك في أهل القدر
- id: hadith-2-embryo-and-the-writing
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The embryo's forty days and the angel's writing; the cubit from the goal
