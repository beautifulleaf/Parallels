    note: يُنحر لهم ثورُ الجنّة الذي كان يأكل من أطرافها
  - motif: spring-salsabil-drink-of-paradise
    refs:
    - Jāmiʿ 2:685.1
    note: من عين فيها تُسمّى سلسبيلًا
  hints:
  - The fish's liver-lobe and the ox that grazed the edges of paradise served to the blessed, against the rabbinic banquet of Leviathan and the wild ox (shor ha-bar, Behemoth) for the righteous, b. Bava Batra 74b-75a, and Behemoth grazing the mountains, Job 40:15-20
- id: hadith-2-wind-takes-believers
