  - motif: last-man-given-world-and-ten-like-it
    refs:
    - Jāmiʿ 2:683.2
    note: ثم يسألُ حتّى يُجعلَ له الدّنيا وعشرةُ أمثالها معها
- id: hadith-2-on-the-bridge-earth-changed
