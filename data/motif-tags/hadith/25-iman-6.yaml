# Hadith chunk 25: al-Jāmiʿ al-Kāmil book 2 (kitāb al-īmān), pp. 678-784 (printed 1/679-781, then the title pages of vol. 2):
# the last bābs on the bridge, intercession and the end (vision of God, the last man to enter paradise, the wind that
# takes the believers, the century), then the whole cycle on decree (qadar, bābs 1-46): the pen, the embryo, the
# two handfuls, Adam and Moses, Adam and David, fitra, the children of polytheists, withdrawal. Read in full from
# the Arabic (136 hadith).
new_motifs:
  seed-by-stone-yellow-green-by-shade-white:
    label: 'The sprouting seed: the side toward the sun comes up yellowish and greenish, the side in the shade white; the hearers say ''as if you herded in the desert'''
    cluster: eschatology
  laughter-chain-narrator-prophet-lord:
    label: 'The narrator laughs and asks ''will you not ask why I laugh?'': so the Prophet laughed, at the laughter of the Lord of the worlds'
    cluster: eschatology
  abraham-was-a-friend-from-behind-behind:
    label: 'Abraham declines to open paradise: ''I was only a friend (khalīl) from behind, behind'''
    cluster: abraham
  last-on-the-bridge-only-crawls:
    label: On the bridge deeds fail until a man comes who can only go crawling (zaḥfan)
    cluster: eschatology
  lord-appears-laughing:
    label: Asked to show himself, the Lord manifests himself to them laughing (yatajallā lahum yaḍḥak)
    cluster: eschatology
  hypocrites-light-put-out-on-bridge:
    label: Every person, hypocrite or believer, is given a light; on the bridge the hypocrite's light is put out
    cluster: eschatology
  paradise-people-sprinkle-water-on-the-rescued:
    label: The rescued are placed in the courtyard of paradise and its people sprinkle water on them until they sprout
    cluster: eschatology
  last-man-given-world-and-ten-like-it:
    label: The last rescued man asks until he is given the world and ten times its like
    cluster: eschatology
  water-of-life-is-washing-of-paradise-people:
    label: '''What is the (water of) life?'' ''The washing-water of the people of paradise'''
    cluster: eschatology
  called-by-the-name-his-family-gave:
    label: A Jewish scholar greets 'Muḥammad' and is pushed; he calls him by the name his family gave; 'my name is Muḥammad, which my family gave me'
    cluster: sira
  hundred-years-ease-of-the-community:
    label: 'ʿAlī corrects the report of the hundred years: none alive today remains, ''and the ease of this community is after a hundred years'''
    cluster: eschatology
  barred-from-paradise-undutiful-drinker-denier:
    label: 'Barred from paradise: one undutiful to parents, the addicted wine-drinker, and the denier of decree'
    cluster: ethics
  faith-requires-four-beliefs:
    label: 'No servant believes until he believes four: the witness to God and his messenger, death, resurrection after death, and decree'
    cluster: theology
  evil-eye-would-outstrip-decree:
    label: The evil eye is real; were anything to outstrip decree the eye would outstrip it
    cluster: magic
  wash-when-asked-for-eye-cure:
    label: When asked to wash (for one struck by the evil eye), wash
    cluster: magic
  dying-father-charges-son-with-decree:
    label: 'A dying Companion charges his son: you will not taste faith until you know what struck you could not miss you; ''whoever dies on other than this is not of me'''
    cluster: ethics
  first-to-speak-on-decree-at-basra:
    label: The first to speak on decree at Basra was Maʿbad al-Juhanī; two pilgrims flank Ibn ʿUmar in the mosque to ask, and he disowns the deniers
    cluster: sira
  face-red-as-if-pomegranate-seeds-burst:
    label: Finding his Companions disputing about decree he comes out so angry that it is as if pomegranate seeds were burst on his face
    cluster: sira
  striking-scripture-parts-against-each-other:
    label: '''Is it for this you were created, striking the Quran one part against another? By this the nations before you perished'''
    cluster: scripture
  talk-of-decree-deferred-to-worst:
    label: Talk about decree has been deferred for the worst of this community
    cluster: eschatology
  cubit-from-goal-the-book-overtakes:
    label: A man works until only a cubit lies between him and paradise (or the fire), then what was written overtakes him and he does the work of the other
    cluster: theology
  wretched-is-who-was-wretched-in-mothers-womb:
    label: The wretched is he who was wretched in his mother's womb; the happy he who was admonished by another's example
    cluster: theology
  angel-shapes-drop-after-forty-two-nights:
    label: When forty-two nights have passed over the drop God sends an angel who shapes it and creates its hearing, sight, skin, flesh and bones
    cluster: embryology
  embryo-sound-or-unsound-asked:
    label: 'The angel asks: male or female? sound or unsound (sawiyy aw ghayr sawiyy)? and God makes it so'
    cluster: embryology
  embryo-scrolls-folded-nothing-added:
    label: The angel's scroll goes out in his hand and is folded; nothing is added or taken away
    cluster: embryology
  written-between-eyes-what-he-will-meet:
    label: Between the newborn's eyes is written what it will meet, down to the misfortune that befalls it
    cluster: embryology
  companion-tests-students-mind:
    label: A Companion poses a hard question ('would that not be injustice?') only 'to weigh your mind'
    cluster: wisdom
  soul-dies-only-after-completing-provision:
    label: 'No soul dies until it has received all its provision, however slow: ''be moderate in seeking'''
    cluster: providence
  what-infected-the-first:
    label: '''Nothing infects anything'': to the bedouin whose mangy camel spreads scab, ''what infected the first?''; no contagion, no ṣafar, no hāma'
    cluster: providence
  god-finished-five-for-each-servant:
    label: 'God has finished for every servant five things: his provision, term, deed, trace and resting place (or wretched or happy)'
    cluster: providence
  stray-date-would-have-come-to-you:
    label: 'Giving a stray date to a beggar: ''had you not come to it, it would have come to you'''
    cluster: providence
  medicine-and-spells-are-decree:
    label: Medicine, spells and precautions do not turn back decree; they are themselves of God's decree
    cluster: providence
  vow-extracts-from-the-miser:
    label: A vow brings nothing not decreed; by it something is extracted from the miser
    cluster: law
  only-prayer-repels-decree-only-piety-lengthens-life:
    label: Nothing repels decree but prayer, nothing increases life but devotion (birr); a man is denied provision for a sin he commits
    cluster: providence
  fleeing-from-decree-to-decree:
    label: '''Fleeing from God''s decree?'' ''From God''s decree to God''s decree'': grazing the fertile or the barren slope of a valley is both by decree'
    cluster: providence
  caliph-consults-three-groups-on-plague:
    label: At Sargh ʿUmar consults the first emigrants, then the helpers, who both divide, then the elders of Quraysh, who agree to turn back
    cluster: sira
  boy-killed-by-khidr-stamped-unbeliever:
    label: The boy al-Khaḍir killed was stamped an unbeliever; had he lived he would have burdened his parents with transgression and unbelief
    cluster: moses-khidr
  white-progeny-right-shoulder-black-left:
    label: 'God strikes Adam''s right shoulder and brings out white offspring like small ants, his left and brings out black like charcoal: ''to paradise, I do not care; to the fire, I do not care'''
    cluster: primeval
  two-handfuls-this-for-this-i-do-not-care:
    label: 'God took a handful with his right hand and another with the other: ''this for this, this for this, and I do not care''; a dying Companion weeps not knowing which handful he is in'
    cluster: primeval
  trim-moustache-and-keep-it-till-you-meet-me:
    label: '''Take from your moustache, then keep to it until you meet me'' as a promise the dying Companion is reminded of'
    cluster: sira
  deeds-judged-by-their-endings:
    label: 'A man does the work of paradise for a long time and his work is sealed with that of the fire, and the reverse: deeds are by their endings'
    cluster: theology
  bilal-proclaims-only-muslim-soul-enters:
    label: 'Bilāl is told to call out: none enters paradise but a Muslim soul, and God supports this religion by the wicked man'
    cluster: sira
  road-of-paradise-presents-itself:
    label: A highway (jādda) of the highways of paradise (or of the fire) presents itself to a man and he follows it until he dies, by what was written
    cluster: theology
  deeds-like-vessel-good-top-good-bottom:
    label: 'Deeds are by their endings, like a vessel: if its top is good its bottom is good (printed ''ka-l-duʿāʾ'')'
    cluster: wisdom
  four-kinds-born-lived-died:
    label: 'Men are created in classes: born, living and dying a believer; or unbeliever; or born and living a believer and dying an unbeliever; or the reverse'
    cluster: theology
  god-employs-servant-in-good-before-death:
    label: 'When God wants good for a servant he ''employs'' (or ''honeys'': ʿasalahu) him: he grants him a good deed before death and takes him on it'
    cluster: theology
  islam-enters-houses-then-trials-like-canopies:
    label: Islam enters every household of Arabs or non-Arabs God wants good for; then trials fall like canopies and you become black snakes pouring down, striking each other's necks
    cluster: eschatology
  moses-asks-to-be-shown-adam:
    label: 'Moses asks: Lord, show us Adam who brought us and himself out of the garden; God shows him Adam and they dispute'
    cluster: primeval
  adam-forgot-so-his-offspring-forget:
    label: Adam denied, so his offspring deny; he forgot, so they forget; he erred, so they err
    cluster: primeval
  writing-and-witnesses-commanded-from-adams-denial:
    label: From the day Adam denied his gift, writing and witnesses were commanded
    cluster: law
  woman-not-to-seek-sisters-divorce:
    label: 'A woman must not ask for her sister''s divorce to empty her bowl and marry: she has only what was decreed for her'
    cluster: law
  bird-omens-run-by-decree-good-omen-liked:
    label: '''Birds (omens) run by decree''; and he liked the good omen (al-faʾl)'
    cluster: magic
  child-killed-in-night-raid-is-of-them:
    label: 'Asked about women and children struck in a night raid on polytheists: ''they are of them'' (of their fathers)'
    cluster: warfare
  god-knows-what-they-would-have-done:
    label: 'Of children who die young (of polytheists or believers): ''God knows best what they would have done'''
    cluster: eschatology
  ibn-abbas-gave-up-his-view-on-children:
    label: Ibn ʿAbbās held the children of each side go with their parents until he heard the Prophet's answer, met the man and held back from his view
    cluster: sira
  boy-fallen-from-litter-answers-question-on-lahin:
    label: Asked about 'al-lāhīn' he is silent; after the raid he sees a boy fallen from a litter digging in the ground, calls the questioner and forbids killing children
    cluster: warfare
  dead-children-little-creatures-of-paradise:
    label: Dead children are the little water-creatures (daʿāmīṣ) of paradise; one takes his father's garment-hem as I take yours and does not let go until he enters with him
    cluster: eschatology
  abraham-and-sarah-foster-muslim-children:
    label: The children of Muslims are in a mountain in paradise fostered by Abraham and Sarah, handed to their fathers on the day of resurrection
    cluster: abraham
  strong-believer-better-and-if-opens-satans-work:
    label: The strong believer is better and dearer to God than the weak; strive, seek God's help, do not say 'if only I had done...', for 'if' opens Satan's work
    cluster: ethics
  rank-reached-by-trials:
    label: A man may have a rank with God he cannot reach by deeds; God keeps trying him with what he dislikes until he reaches it
    cluster: providence
  slave-girl-conceives-despite-withdrawal:
    label: 'A man withdraws from his slave-girl, ''our servant and water-carrier''; she conceives: ''I told you what was decreed for her would come'''
    cluster: law
  seed-poured-on-rock-would-yield-child:
    label: Were the water from which the child comes poured on a rock, God would bring a child out of it
    cluster: embryology
  youth-asks-leave-to-castrate-pen-has-dried:
    label: 'A young man fearing sin, with nothing to marry on, asks three times to castrate himself: ''the pen has dried on what you will meet; castrate on that or leave it'''
    cluster: law
  god-just-if-he-punished-all:
    label: Were God to punish all the people of his heavens and earth he would punish them without wronging them; were he to show mercy, his mercy would be better for them than their deeds
    cluster: theology
  decree-already-passed-not-begun-anew:
    label: '''Is what we do something already finished or something begun anew (unuf, nastaʾnif)?'' ''Already finished'''
    cluster: theology
  refuge-from-fire-and-grave-better-than-long-life:
    label: Praying for long life with loved ones is praying for fixed terms; asking refuge from the fire or the grave's punishment would have been better
    cluster: piety
  torah-written-by-gods-hand-for-moses:
    label: 'Adam to Moses: God chose you for his speech and wrote (the Torah) for you with his hand'
    cluster: exodus
  children-follow-fathers-without-deeds-asked:
    label: '''The children of believers?'' ''From their fathers.'' ''Without deeds?'' ''God knows best what they would have done''; the same for the children of polytheists'
    cluster: eschatology
units:
- id: hadith-2-vision-bridge-abu-said
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Abū Saʿīd's long report of the vision of God, the bridge and the rescue from the fire
  read:
  - Jāmiʿ 2:679.1
  quran:
  - '4:40'
  - '68:42'
  tags:
  - motif: see-lord-as-full-moon-and-sun
    refs:
    - Jāmiʿ 2:679.1
    note: هل تُضارُّونَ في رؤية الشّمس بالظّهيرة صَحْوًا ... وهل تُضارُّونَ في رؤية القمر ليلة البدر
  - motif: each-community-follows-what-it-worshipped
    refs:
    - Jāmiʿ 2:679.1
    note: 'أَذَّنَ مُؤَذِّنٌ: لِيَتَّبِعْ كلُّ أُمَّةٍ ما كانت تعبُدُ ... من الأصنامِ والأنصاب إِلَّا يتساقطون في النّار'
  - motif: jews-and-christians-thirsty-led-to-fire-like-mirage
    refs:
    - Jāmiʿ 2:679.1
    note: كنّا نعبد عزيزَ ابن اللَّه ... كُنّا نعبد المسيحَ ابن اللَّه ... عَطِشْنا يا ربَّنا فاسْقِنا ... كأنّها سرابٌ يَحْطِمُ بعضُها بعضًا
  - motif: god-comes-in-unknown-form-then-known-form
    refs:
    - Jāmiʿ 2:679.1
    note: أتاهم ربُّ العالمين في أدنى صورة من التي رأوه فيها ... وقد تَحَوَّل في صورته التي رأوه فيها أَوَّل مرّة
  - motif: shin-uncovered-back-becomes-one-plate
    refs:
    - Jāmiʿ 2:679.1
    note: فَيُكشفُ عن ساقٍ ... جعل اللَّهُ ظهرَه طبقةً واحدةً كلّما أراد أن يسجد خَرَّ على قفاهُ
  - motif: bridge-slippery-with-hooks-and-sadan-thorns
    refs:
    - Jāmiʿ 2:679.1
    note: 'دَحْضٌ مَزِلَّةٌ، فيه خَطَاطِيُف وكلالِيبُ وَحَسَكٌ، تكونُ بنجدٍ فيها شُوَيْكةٌ يقال: لها السَّعْدانُ'
  - motif: crossing-bridge-by-speed-of-deeds
    refs:
    - Jāmiʿ 2:679.1
    note: فيمر المؤمنون كطَرْف العين وكالبرق وكالريح وكالطير وكأجاويد الخيل والرِّكاب
  - motif: believers-retrieve-brothers-by-dinar-half-dinar-atom
    refs:
    - Jāmiʿ 2:679.1
    note: مثقالَ دينار ... مثقالَ نصف دينار ... مثقالَ ذرة من خير فأخرجوه
  - motif: angels-prophets-martyrs-intercede-in-rounds
    refs:
    - Jāmiʿ 2:679.1
    note: شفعت الملائكةُ، وشفع النّبيون، وشفع المؤمنون، ولم يبق إلا أرحم الرّاحمين
  - motif: most-merciful-takes-handful-of-never-good-from-fire
    refs:
    - Jāmiʿ 2:679.1
    note: فيقبض قبضةً من النّار، فيُخرجُ منها قومًا لم يعملوا خيرًا قطّ قد عادوا حُمَمًا
  - motif: sinners-made-charcoal-then-sprout-by-river
    refs:
    - Jāmiʿ 2:679.1
    note: 'فيُلْقيهم في نَهر في أفواه الجنّة يقال له: نهر الحياة، فيخرُجُون كما تَخْرُجُ الْحِبَّة في حَمِيل السَّيْل'
  - motif: seed-by-stone-yellow-green-by-shade-white
    refs:
    - Jāmiʿ 2:679.1
    note: ما يكون إلى الشّمس أُصَيْفِرُ وأُخَيْضِرُ، وما يكون منها إلى الظل يكون أبيض ... كأنّك كنت ترعى بالبادية
  - motif: freed-of-god-with-seals-on-necks
    refs:
    - Jāmiʿ 2:679.1
    note: فيخرجون كاللؤلؤ في رقابهم الخواتم ... هؤلاء عتقاء اللَّه
  - motif: i-make-my-pleasure-alight-on-you
    refs:
    - Jāmiʿ 2:679.1
    note: رِضايَ فلا أسخطُ عليكم بعده أبدًا
  hints:
  - Jews told to follow what they worshipped answer 'ʿUzayr son of God' and are led thirsty to a mirage, against the Quran's own charge at Q 9:30 and, on the Jewish side, the absence of any Ezra-sonship claim; Ezra exalted as a second Moses in t. Sanhedrin 4:7 and 4 Ezra 14
- id: hadith-2-last-man-ibn-masud
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The last to enter paradise, three trees, and the chain of laughter (Ibn Masʿūd)
  read:
  - Jāmiʿ 2:682.1
  tags:
  - motif: last-man-out-stumbles-and-is-scorched
    refs:
    - Jāmiʿ 2:682.1
    note: فهو يمشي مرّة ويكبو مرّة، وتَسْفَعُه النّار مرّة
  - motif: last-man-brought-near-three-trees-god-excuses-him
    refs:
    - Jāmiʿ 2:682.1
    note: فَتُرْفَعُ له شَجَرةٌ ... وربُّه يُعذِرُه لأنه يرى ما لا صبر له عليه ... شجرة هي عند باب الجنّة هي أحسن من الأولَيَيْن
  - motif: what-will-end-your-asking-the-world-and-its-like
    refs:
    - Jāmiʿ 2:682.1
    note: ما يَصْرِيني منك؟ أيُرْضِيكَ أن أعطيك الدُّنيا ومثْلَها معها
  - motif: god-laughs-at-last-man-and-lets-him-in
    refs:
    - Jāmiʿ 2:682.1
    note: أتستهزئ مني وأنتَ ربُّ العالمين ... إنّي لا أستهزئُ منك، ولكنّي على ما أشاء قدير
  - motif: laughter-chain-narrator-prophet-lord
    refs:
    - Jāmiʿ 2:682.1
    note: 'فضحك ابنُ مسعود فقال: ألا تسألوني مم أضحك؟ ... هكذا ضحك رسول اللَّه ﷺ ... من ضحك ربّ العالمين'
- id: hadith-2-intercession-trust-kinship-bridge
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Adam, Abraham, Moses and Jesus decline to open paradise; trust and kinship flank the bridge
  read:
  - Jāmiʿ 2:683.1
  tags:
  - motif: intercession-chain-adam-to-muhammad
    refs:
    - Jāmiʿ 2:683.1
    note: فيأتون آدم ... إبراهيم خليل اللَّه ... موسى الذي كلّمه اللَّه تكليمًا ... عيسى كَلِمةِ اللَّه وروحه ... فيأتون محمّدًا فيقوم فيؤذن له (no Noah in this chain)
  - motif: prophets-decline-intercession-citing-a-fault
    refs:
    - Jāmiʿ 2:683.1
    note: وهل أَخْرجَكُم من الجنّة إلّا خطيئة أبيكم آدم؟ ! لستُ بصاحب ذلك
  - motif: abraham-was-a-friend-from-behind-behind
    refs:
    - Jāmiʿ 2:683.1
    note: لستُ بصاحب ذلك، إنما كنت خليلا من وراء وراء
  - motif: trust-and-kinship-stand-at-sides-of-bridge
    refs:
    - Jāmiʿ 2:683.1
    note: وترسل الأمانةُ والرَّحم، فتقومان جَنَبَتَيْ الصِّراط يمينًا وشمالًا
  - motif: crossing-bridge-by-speed-of-deeds
    refs:
    - Jāmiʿ 2:683.1
    note: كالبرق ... يمر ويرجع في طرفة عين؟ ثم كمرّ الرّيح، ثم كمرّ الطّير وشدّ الرّجال، تجري بهم أعمالهم
  - motif: messengers-cry-grant-safety-on-bridge
    refs:
    - Jāmiʿ 2:683.1
    note: 'ونبيُّكم قائمٌ على الصِّراط يقول: ربِّ سَلِّم سَلِّم'
  - motif: last-on-the-bridge-only-crawls
    refs:
    - Jāmiʿ 2:683.1
    note: حتّى تَعْجِز أعمالُ العباد حتى يجيء الرَّجُل فلا يستطيعُ السَّيْر إلّا زَحْفًا
  - motif: bridge-slippery-with-hooks-and-sadan-thorns
    refs:
    - Jāmiʿ 2:683.1
    note: وفي حافتي الصِّراط كلاليب مُعَلَّقة مأمورةٌ بأخذ مَنْ أُمِرتْ به
  - motif: depth-of-hell-seventy-autumns
    refs:
    - Jāmiʿ 2:683.1
    note: إن قعر جهنّم لسبعون خريفًا
- id: hadith-2-wurud-jabir
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Jābir on al-wurūd; the Lord appears laughing; the hypocrite's light put out
  read:
  - Jāmiʿ 2:683.2
  quran:
  - 19:71
  tags:
  - motif: each-community-follows-what-it-worshipped
    refs:
    - Jāmiʿ 2:683.2
    note: فتُدعى الأمم بأوثانها وما كانت تعبد، الأوّل فالأوّل
  - motif: lord-appears-laughing
    refs:
    - Jāmiʿ 2:683.2
    note: 'فيقولون: حتى ننظر إليك، فيتجلّى لهم يَضْحَك'
  - motif: hypocrites-light-put-out-on-bridge
    refs:
    - Jāmiʿ 2:683.2
