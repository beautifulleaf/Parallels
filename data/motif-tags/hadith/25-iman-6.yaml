  - Jāmiʿ 2:713.2-715.1
  quran:
  - 64:1-5
  tags:
  - motif: wretched-is-who-was-wretched-in-mothers-womb
    refs:
    - Jāmiʿ 2:713.2
    note: الشّقيُّ مَنْ شَقِي في بطن أمِّه والسَّعيدُ مَن وُعِظ بغيره ... وكيف يشقى رجلٌ بغير عمل؟
  - motif: angel-shapes-drop-after-forty-two-nights
    refs:
    - Jāmiʿ 2:713.2
    note: إذا مرَّ بالنُّطْفة اثنتان وأربعون ليلة بعث اللَّه إليها ملكًا فصوَّرَهَا، وخَلَقَ سمعها وبصرها وجِلْدَها ولَحْمها وعِظامَها
  - motif: angel-asks-male-or-female-wretched-or-blessed
    refs:
    - Jāmiʿ 2:713.2
    - Jāmiʿ 2:714.1
    - Jāmiʿ 2:714.2
    - Jāmiʿ 2:714.3
    - Jāmiʿ 2:714.4
    - Jāmiʿ 2:715.1
    note: يا ربّ أذكر أم أنثى؟ ... أشقي أم سعيد؟ فما الرّزق والأجل؟ فيكتب في بطن أمِّه
  - motif: womb-angel-announces-each-stage
    refs:
    - Jāmiʿ 2:714.1
    note: 'وكَّل بالرَّحم ملكًا يقول: يا ربّ نطفة، يا ربّ علقة، يا ربّ مضغة'
  - motif: embryo-scrolls-folded-nothing-added
    refs:
    - Jāmiʿ 2:713.2
    - Jāmiʿ 2:714.2
    note: ثم يخرج الملك بالصَّحيفة في يده فلا يزيدُ على ما أُمِر ولا يَنْقُص; بأربعين، أو خمسة وأربعين ليلة ... ثم تُطْوى الصُّحُف
  - motif: embryo-sound-or-unsound-asked
    refs:
    - Jāmiʿ 2:714.3
    note: إنّ النُّطفة تقع في الرَّحم أربعين ليلة ... يا ربّ أسويٌّ أو غير سويٍّ؟ فيجعله اللَّه سويًّا أو غير سويٍّ
  - motif: written-between-eyes-what-he-will-meet
    refs:
    - Jāmiʿ 2:714.4
    - Jāmiʿ 2:715.1
    note: ثم يكتب بين عينيه ما هو لاق حتى النّكبة يُنكبها; أتى ملكُ النّفس، فعرج إلى الرّب
  hints:
  - The womb-angel asks male or female and 'wretched or happy', against b. Niddah 16b, where the angel Laylah sets the drop before God and asks 'mighty or weak, wise or foolish, rich or poor?' but 'wicked or righteous' is not asked, since all is in heaven's hands but the fear of heaven
  - 'Forty days of the drop before its sex is fixed, against b. Berakhot 60a: for the first forty days one may still pray that it be male'
- id: hadith-2-wretched-in-the-womb
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The wretched is he who was wretched in his mother's womb
  read:
  - Jāmiʿ 2:716.1-717.1
  tags:
  - motif: wretched-is-who-was-wretched-in-mothers-womb
    refs:
    - Jāmiʿ 2:716.1
    - Jāmiʿ 2:717.1
    note: الشّقي من شقي في بطن أمِّه، والسّعيد من سَعِد في بطنها
- id: hadith-2-written-before-creation
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Written before creation - mercy over wrath above the throne; fifty thousand years; a book two thousand years before
  read:
  - Jāmiʿ 2:718.1-719.2
  tags:
  - motif: written-above-the-throne-mercy-prevails
    refs:
    - Jāmiʿ 2:718.1
    note: لما قضى اللَّه الخلق، كتب في كتابه فهو عنده فوق العرش، إنّ رحمتي غلبتْ غضبي
  - motif: god-was-and-nothing-else
    refs:
    - Jāmiʿ 2:718.2
    note: كان اللَّه ولم يكن شيء غيره، وكان عرشه على الماء، وكتب في الذِّكر كلّ شيء
  - motif: decrees-written-fifty-thousand-years-before-creation
    refs:
    - Jāmiʿ 2:719.1
    note: 'كتب اللَّه مقادير الخلائق قبل أن يخلق السماوات والأرض بخمسين ألف سنة، قال: وكان عرشه على الماء'
  - motif: book-written-two-thousand-years-before-creation
    refs:
    - Jāmiʿ 2:719.2
    note: إنّ اللَّه كتب كتابًا قبل أن يخلق السماوات والأرض بألفي عام، وأنزل منه آيتين ختم بهما سورة البقرة
  - motif: satan-flees-house-where-baqara-recited
    refs:
    - Jāmiʿ 2:719.2
    note: ولا يقرآن في دار ثلاث ليالٍ فيقربها شيطان
  hints:
  - A book written two thousand years before heaven and earth, from which the closing verses of al-Baqara were sent down, against the Torah that preceded the world by two thousand years, Gen. Rab. 8:2 and Lev. Rab. 19:1
  - '''My mercy prevails over my wrath'' written above the throne, against b. Berakhot 7a, God''s own prayer ''may my mercy overcome my anger'''
- id: hadith-2-each-eased-for-what-he-was-created
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Every place in paradise or fire is written - so work, each is eased for what he was created for
  read:
  - Jāmiʿ 2:720.1-723.1
  quran:
  - '92:5'
  - 91:7-8
  tags:
  - motif: place-in-paradise-or-fire-written-work-anyway
    refs:
    - Jāmiʿ 2:720.1
    note: كنّا في جنازة في بقيع الغرقد ... ومعه مخصرة فنكّس فجعل ينكتُ بمخصرته ... إلّا كُتب مكانُها من الجنّة والنّار ... أفلا نتكل على كتابنا وندع العمل
  - motif: each-eased-to-what-he-was-created-for
    refs:
    - Jāmiʿ 2:720.1
    - Jāmiʿ 2:720.2
    - Jāmiʿ 2:721.1
    - Jāmiʿ 2:722.1
    - Jāmiʿ 2:722.2
    - Jāmiʿ 2:723.1
    note: كلٌّ يعمل لما خُلق له، أو لما يُيَسَّرُ له; اعملوا فكلٌّ مُيسَّر; كلُّ امرئ مهيَّأٌ لما خُلق له; كلٌّ مُيسَّرٌ لما كُتب له وعليه
  - motif: pen-has-dried
    refs:
    - Jāmiʿ 2:721.1
    note: بيّن لنا ديننا كأنّا خُلقنا الآن ... أفيما جفَّتْ به الأقلام، وجرت به المقادير، أم فيما نستقبل؟
  - motif: companion-tests-students-mind
    refs:
    - Jāmiʿ 2:721.2
    note: 'أفلا يكون ظُلْمًا؟ قال: ففزعتُ من ذلك فزعًا شديدًا ... إنّي لَمْ أُرِدْ بما سألتك إلّا لأَحْزِر عَقْلَكَ'
  - motif: decree-already-passed-not-begun-anew
    refs:
    - Jāmiʿ 2:721.2
    - Jāmiʿ 2:722.1
    - Jāmiʿ 2:722.2
    - Jāmiʿ 2:723.1
    note: 'لا بلْ شيء قُضي عليهم ومضى فيهم; أمرٌ قد فُرغ منه، أم شيءٌ نسْتأنفه؟ قال: بل أمر قد فُرِغ منه; مرجعه من بدر'
- id: hadith-2-terms-and-provisions-fixed
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Terms fixed, days counted, provisions allotted; seek moderately; what infected the first? (bāb on Q 7:34, 35:11)
  read:
  - Jāmiʿ 2:725.1-729.1
  quran:
  - '7:34'
  - '35:11'
  tags:
  - motif: fixed-terms-days-and-provisions
    refs:
    - Jāmiʿ 2:725.1
    note: اللهمّ أمتعني بزوجي رسول اللَّه ﷺ، وبأبي أبي سفيان، وبأخي معاوية ... قد سألتِ اللَّه لآجال مضروبة، وأيام معدودة، وأرزاق مقسومة ... وآثار موطوءة
  - motif: refuge-from-fire-and-grave-better-than-long-life
    refs:
    - Jāmiʿ 2:725.1
    note: ولو كنتِ سألتِ اللَّه أن يُعيذكِ من عذاب النّار، أو عذاب القبر كان خيرًا وأفضل
  - motif: transformed-people-left-no-offspring
    refs:
    - Jāmiʿ 2:725.1
    note: القردة والخنازير هي مما مُسِخ؟ ... لم يُهلك قومًا أو يعذِّب قومًا، فيجعل لهم نسلًا، وإنّ القردة والخنازير كانوا قبل ذلك
  - motif: soul-dies-only-after-completing-provision
    refs:
    - Jāmiʿ 2:726.1
    - Jāmiʿ 2:727.1
    note: فإنّ نفسًا لن تموت حتى تستوفي رزقها، وإن أبطأ عنها ... وأجملوا في الطّلب; أجملوا في طلب الدّنيا، فإنّ كلًّا مُيَسَّرٌ لما كُتب له منها
  - motif: what-infected-the-first
    refs:
    - Jāmiʿ 2:727.2
    note: لا يُعدي شيءٌ شيئًا ... إنّ النُّقْبةَ تكون بمشْفر البعير، أو بعَجْبه فتشْتملُ الإبلَ جَرَبًا ... ما أعدى الأوّلَ؟ لا عدْوى، ولا صَفَر، ولا هامَةَ
  - motif: god-finished-five-for-each-servant
    refs:
    - Jāmiʿ 2:727.2
    - Jāmiʿ 2:728.1
    note: 'خلق اللَّه كلَّ نفس، فكتب حياتَها، وموتَها، ومُصيباتها، ورزْقها; فرغ اللَّه إلى كلّ عبد من خمس: من رزقه، وأجله، وعمله، وأثره، ومضجعه'
  - motif: stray-date-would-have-come-to-you
    refs:
    - Jāmiʿ 2:729.1
    note: 'فرأى تمرة عائرةً فأعطاها سائلًا، وقال: لو لم تأتها لأتتك'
- id: hadith-2-remedies-are-decree
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Medicine, spells and precautions are themselves of God's decree
  read:
  - Jāmiʿ 2:730.1
  tags:
  - motif: medicine-and-spells-are-decree
    refs:
    - Jāmiʿ 2:730.1
    note: 'أرأيتَ دواءً نتداوى به، ورُقي نسْترقيها، وتُقًى نتّقيها هل تردُّ ذلك من قدر اللَّه من شيء؟ فقال: إنّه من قدر اللَّه'
- id: hadith-2-vow-and-prayer-against-decree
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The vow changes nothing but extracts from the miser; prayer alone repels decree
  read:
  - Jāmiʿ 2:731.1-732.2
  tags:
  - motif: vow-extracts-from-the-miser
    refs:
    - Jāmiʿ 2:731.1
    - Jāmiʿ 2:731.2
    note: لا يأتي ابنَ آدم النّذرُ بشيء لم يكن قد قُدِّر له ... فيستخرج اللَّه به من البخيل; نهى النّبيُّ ﷺ عن النّذر ... إنّه لا يردُّ شيئًا
  - motif: only-prayer-repels-decree-only-piety-lengthens-life
    refs:
    - Jāmiʿ 2:731.3
    - Jāmiʿ 2:732.1
    - Jāmiʿ 2:732.2
    note: ادعوا فإنّ الدّعاء يردُّ القدر; لا يردّ القضاء إلّا الدّعاء، ولا يزيد في العمر إلّا البرُّ; وإنّ الرّجل ليُحرم الرِّزقَ بخطيئة يعملها
  hints:
  - The vow that brings nothing not decreed and only extracts from the miser, against Qoh 5:3-4 'better not to vow than to vow and not pay' and m. Nedarim 1:1 / b. Nedarim 22a, where one who vows is likened to building a high place
  - 'Prayer that turns back the decree, against b. Rosh Hashanah 16b: crying out, charity, change of name and deed tear up a person''s decree'
- id: hadith-2-umar-at-sargh
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: ʿUmar turns back from the plague at Sargh - fleeing from God's decree to God's decree
  read:
  - Jāmiʿ 2:734.1
  tags:
  - motif: caliph-consults-three-groups-on-plague
    refs:
    - Jāmiʿ 2:734.1
    note: ادعُ لي المهاجرين الأوّلين ... ادعُ لي الأنصار ... ادع لي من كان ها هنا من مشيخة قريش من مُهاجِرَةِ الفتح، فدعوتهم فلم يختلف عليه رجلان
  - motif: fleeing-from-decree-to-decree
    refs:
    - Jāmiʿ 2:734.1
    note: 'أفِرارًا من قدر اللَّه؟ ... نعم، نَفرُّ من قدر اللَّه إلى قدر اللَّه، أرأيت لو كانتْ لك إبل فهبطت واديًا له عُدْوتان: إحداهما خصبة والأخرى جدية'
  - motif: do-not-enter-or-flee-plague-land
    refs:
    - Jāmiʿ 2:734.1
    note: إذا سمعتم به بأرض فلا تَقْدَمُوا عليه، وإذا وقع بأرض وأنتم بها فلا تخرجوا فرارًا منه
- id: hadith-2-paradise-and-fire-each-has-its-people
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: '"A sparrow of paradise": God created paradise and fire each with its people while in their fathers'' loins'
  read:
  - Jāmiʿ 2:735.1
  quran:
  - 7:179
  - 11:118-119
  tags:
  - motif: dead-infant-called-righteous-refuted
    refs:
    - Jāmiʿ 2:735.1
    note: طوبي له، عصفور من عصافير الجنّة ... أو لا تدرين
  - motif: paradise-and-hell-each-created-with-its-people
    refs:
    - Jāmiʿ 2:735.1
    note: إن اللَّه خلق للجنة أهلا، خلقهم لها وهم في أصْلاب آبائهم
- id: hadith-2-four-plead-at-resurrection
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The deaf, the fool, the senile and the one who died in the interval plead, and are told to enter the fire
  read:
  - Jāmiʿ 2:735.2
  tags:
  - motif: four-who-plead-at-resurrection-tested-by-fire
    refs:
    - Jāmiʿ 2:735.2
    note: رجل أصمّ لا يسمع، ورجل أحمق، ورجل هرم، ورجل مات في فترة ... والصِّبيان يخذفونني بالبعر ... ويرسل إليهم أن ادخلوا النّار ... ما كانت عليهم إلّا بردًا وسلامًا
- id: hadith-2-light-cast-on-creation
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: God created his creatures in darkness and cast his light on them (bāb on Q 6:122)
  read:
  - Jāmiʿ 2:737.1
  quran:
  - 6:122
  tags:
  - motif: creation-in-darkness-light-cast-upon-them
    refs:
    - Jāmiʿ 2:737.1
    note: خلق خلقَه في ظلمة، فألقى عليهم من نوره، فمن أصابه من ذلك النّور اهتدى، ومن أخطأه ضلّ
- id: hadith-2-khidr-boy-stamped-unbeliever
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The boy al-Khaḍir killed was stamped an unbeliever (bāb on Q 18:80-81)
  read:
  - Jāmiʿ 2:738.1
  quran:
  - 18:80-81
  tags:
  - motif: boy-killed-by-khidr-stamped-unbeliever
    refs:
    - Jāmiʿ 2:738.1
    note: إنّ الغلام الذي قتله الخضر طُبع كافرًا، ولو عاش لأرهق أبويه طُغيانًا وكفرًا
- id: hadith-2-two-handfuls
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Adam from a handful of all the earth; the two handfuls and the offspring of the right and the left
  read:
  - Jāmiʿ 2:739.1-740.2
  quran:
  - 7:172
  tags:
  - motif: adam-from-soil-of-whole-earth-children-of-every-colour
    refs:
    - Jāmiʿ 2:739.1
    note: خلق آدم من قبضة قبضها من جميع الأرض ... الأحمر، والأبيض والأسود، وبين ذلك، والسّهل والحزن، والخبيث والطيّب
  - motif: white-progeny-right-shoulder-black-left
    refs:
    - Jāmiʿ 2:739.2
    note: فضرب كتفه اليمني، فأخرج ذريّة بيضاء كأنّهم الذّرُّ، وضرب كتفه اليسرى، فأخرج ذريّةً سوداء كأنّهم الْحُمَم ... إلى الجنّة ولا أُبالي ... إلى النّار ولا أبالي
  - motif: two-handfuls-this-for-this-i-do-not-care
    refs:
    - Jāmiʿ 2:739.3
    - Jāmiʿ 2:740.1
    - Jāmiʿ 2:740.2
    note: 'قبض بيمينه قبضةً، وأخرى باليد الأخرى، وقال: هذه لهذه، وهذه لهذه، ولا أُبالي. فلا أدري في أيّ القبضتين أنا; فتفرَّق النَّاسُ وهم لا يختلفون في القدر'
  - motif: trim-moustache-and-keep-it-till-you-meet-me
    refs:
    - Jāmiʿ 2:739.3
    note: دخل عليه أصحابه يعودونه وهو يبكي ... خذْ من شارِبك، ثم أقرَّه حتّى تلقاني
  - motif: progeny-drawn-from-adams-back
    refs:
    - Jāmiʿ 2:740.2
    note: إنّ اللَّه أخذ ذريّة آدم من ظهره، وأشهدهم على أنفسهم، ثم أفاض بهم في كفّيه
  hints:
  - 'Adam made from a handful of the whole earth so his children are red, white and black, against b. Sanhedrin 38a-b (R. Meir: Adam''s dust gathered from all the world) and Pirqe R. Eliezer 11 (dust from the four corners, red, black, white and green)'
- id: hadith-2-deeds-by-their-endings
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Deeds are by their endings - the brave fighter of the fire who kills himself; the road of paradise opens
  read:
  - Jāmiʿ 2:746.1-749.3
  tags:
  - motif: deeds-judged-by-their-endings
    refs:
    - Jāmiʿ 2:746.1
    - Jāmiʿ 2:747.2
    - Jāmiʿ 2:748.1
    - Jāmiʿ 2:749.2
    - Jāmiʿ 2:749.3
    note: إنّ الرّجل ليعمل عمل أهل الجنّة، فيما يبدو للنّاس وهو من أهل النّار; الزَّمَنَ الطّويلَ ... ثم يُخْتَمُ لهُ عملُهُ بعمل أهل النّار; وإنّه لمكتوب في الكتاب من أهل النّار; إنّما الأعمالُ بالخواتيم
  - motif: valiant-fighter-of-fire-kills-himself
    refs:
    - Jāmiʿ 2:747.1
    note: 'لرجل ممن يدّعي الإسلام: هذا من أهل النّار. فلما حضر القتال قاتل الرّجلُ قتالًا شديدًا ... فقتل نفسَه'
  - motif: suicide-with-arrow-from-own-quiver
    refs:
    - Jāmiʿ 2:747.1
    note: فأهوى بيده إلى كنانته فانتزع منها سَهْمًا فانتحر بها
  - motif: bilal-proclaims-only-muslim-soul-enters
    refs:
    - Jāmiʿ 2:747.1
    note: 'ثم أمر بلالًا فنادى بالنّاس: إنّه لا يدخل الجنّة إِلَّا نفسٌ مسلمةٌ'
  - motif: god-supports-religion-by-a-wicked-man
    refs:
    - Jāmiʿ 2:747.1
    note: وإنَّ اللَّه ليؤيِّدُ هذا الدِّينَ بالرَّجُل الفاجر
  - motif: god-employs-servant-in-good-before-death
    refs:
    - Jāmiʿ 2:748.2
    note: لا عليكم أن لا تُعْجَبُوا بأحدٍ حتّى تنظروا بِمَ يُخْتم له ... وإذا أراد اللَّه بعبد خيرًا استعمله قبل مَوْته ... يوفِّقه لعملٍ صالِحٍ، ثم يَقْبضُه عليه
  - motif: road-of-paradise-presents-itself
    refs:
    - Jāmiʿ 2:749.1
    note: ثم تعرض له الجادة من جَوادّ الجنّة فيعمل بها حتّى يموت عليها، وذلك لما كتب
  - motif: deeds-like-vessel-good-top-good-bottom
    refs:
    - Jāmiʿ 2:749.3
    note: إنّما الأعمال بخواتيمها، كالدعاء إذا طاب أعلاه طاب أسفله، وإذا خبُث أعلاه خبُث أسفلُه (printed كالدعاء)
  hints:
  - A man's last deeds outweigh the long years before them, against Ezek 18:24-27 (the righteous who turns to evil, his former righteousness not remembered; the wicked who turns lives) and b. Avodah Zarah 17a, 'some acquire their world in a single hour'
- id: hadith-2-classes-of-men
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The sons of Adam created in classes - born, living and dying believer or unbeliever
  read:
  - Jāmiʿ 2:750.1
  tags:
  - motif: four-kinds-born-lived-died
    refs:
    - Jāmiʿ 2:750.1
    note: 'إنّ بني آدم خلقوا على طبقات شتي: فمنهم من يولد مؤمنًا، ويحيا مؤمنًا، ويموت مؤمنًا ... ومنهم من يولد كافرًا، ويحيا كافرًا، ويموت مؤمنًا'
- id: hadith-2-god-employs-his-servant
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: When God wants good for a servant he 'employs' or 'honeys' him with a good deed before death
  read:
  - Jāmiʿ 2:751.1-752.1
  tags:
  - motif: god-employs-servant-in-good-before-death
    refs:
    - Jāmiʿ 2:751.1
    - Jāmiʿ 2:751.2
    - Jāmiʿ 2:752.1
    note: إذا أراد اللَّه بعبد خيرًا استعمله ... يوفّقه لعمل صالح قبل الموت; يُفتح له عمل صالح بين يدي موته، حتّى يرْضى عنه مَنْ حوله; إذا أراد اللَّه بعبد خيرًا عسَّله
- id: hadith-2-islam-enters-houses-then-trials
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Has Islam an end? It enters every house God wants good for, then trials like canopies and black snakes pouring down
  read:
  - Jāmiʿ 2:753.1
  tags:
  - motif: islam-enters-houses-then-trials-like-canopies
    refs:
    - Jāmiʿ 2:753.1
    note: أيّما أهل بيت من العرب، أو العجم، أراد اللَّه بهم خيرًا، أدخل عليهم الإسلام ... ثم تقع الفتن كأنّها الظُّلَل ... ثم تعودون فيها أساوِدَ صُبًّا يضربُ بعضكم رقاب بعض
- id: hadith-2-faith-only-to-whom-he-loves
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Characters divided like provisions; the world given to whom God loves and not, faith only to whom he loves
  read:
  - Jāmiʿ 2:753.2
  tags:
  - motif: god-gives-world-to-loved-and-unloved-faith-only-to-loved
    refs:
    - Jāmiʿ 2:753.2
    note: إنّ اللَّه قسم بينكم أخلاقكم، كما قسم بينكم أرزاقكم ... ولا يعطي الإيمان إِلَّا من يحبّ
- id: hadith-2-adam-and-moses-dispute
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Adam and Moses dispute, and Adam out-argues Moses - nine versions
  read:
  - Jāmiʿ 2:754.1-757.2
  quran:
  - 20:121
  tags:
  - motif: adam-moses-argue-adam-wins
    refs:
    - Jāmiʿ 2:754.1
    - Jāmiʿ 2:754.2
    - Jāmiʿ 2:755.1
    - Jāmiʿ 2:755.2
    - Jāmiʿ 2:755.3
    - Jāmiʿ 2:756.1
    - Jāmiʿ 2:756.2
    - Jāmiʿ 2:756.3
    - Jāmiʿ 2:757.1
    - Jāmiʿ 2:757.2
    note: أنت أبونا خيّبْتنا وأخرجْتنا من الجنّة; أغويتَ النَّاسَ; أشْقيتَ النَّاسَ; أدخلتَ ذريَّتَك النار ... أتلومني على أمر قدَّره اللَّه عليّ ... فحجَّ آدم موسى
  - motif: adams-deed-written-before-his-creation
    refs:
    - Jāmiʿ 2:754.1
    - Jāmiʿ 2:755.3
    note: 'قدَّره اللَّه عليّ قبل أن يخلقني بأربعين سنة; فبِكَمْ وجدْتَ اللَّهَ كتب التوراة قبل أن أُخلق؟ قال موسى: بأربعين عامًا'
  - motif: torah-written-forty-years-before-adam
    refs:
    - Jāmiʿ 2:755.3
    note: 'فهلْ وجدْتَ فيها: وعصى آدمُ ربَّه فغوى؟ قال: نعم'
  - motif: torah-written-by-gods-hand-for-moses
    refs:
    - Jāmiʿ 2:754.1
    note: اصطفاك اللَّه بكلامه، وخطّ لك بيده
  - motif: tablets-hold-explanation-of-everything
    refs:
    - Jāmiʿ 2:755.3
    note: وأعطاكَ الألواحَ فيها تبيان كلِّ شيء، وقرَّبك نَجيًّا
  - motif: moses-asks-to-be-shown-adam
    refs:
    - Jāmiʿ 2:757.2
    note: يا ربّ أَرِنَا آدمَ الذي أخرجنا ونفسَه من الجنّة، فأراه اللَّه آدم ... كلمك اللَّه من وراء الحجاب لم يجعل بينك وبينه رسولًا من خلقه
  hints:
  - Moses blaming Adam for bringing mankind out of the garden, against Deut. Rab. 11:10, where at his death Moses measures himself against Adam ('you were given one commandment and could not keep it'); here Adam wins by what was written before him
- id: hadith-2-adam-gives-david-years
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Adam shown his offspring gives David forty (or sixty) of his years, then denies it; hence writing and witnesses
  read:
  - Jāmiʿ 2:759.1-759.2
  tags:
  - motif: progeny-drawn-from-adams-back
    refs:
    - Jāmiʿ 2:759.1
    note: لما خلق اللَّه آدم مسح ظهره فسقط من ظهره كلُّ نسمة هو خالقها من ذريّته إلى يوم القيامة
  - motif: gleam-of-light-between-the-eyes-of-each-soul
    refs:
    - Jāmiʿ 2:759.1
    note: وجعل بين عيني كلِّ إنسان منهم وبيصًا من نور
  - motif: adam-gives-david-years-of-his-life
    refs:
    - Jāmiʿ 2:759.1
    - Jāmiʿ 2:759.2
    note: 'ستين سنة. قال: أيْ ربِّ، زِدْه من عمري أربعين سنة; قد كتب له عُمْرَ أربعين سنةً ... جعلتُ له من عُمْري ستين سنةً'
  - motif: adam-denies-the-gift-when-death-comes
    refs:
    - Jāmiʿ 2:759.1
    - Jāmiʿ 2:759.2
    note: 'جاءه ملك الموت، فقال: أو لم يبق من عمري أربعون سنة؟; قد عَجَّلْتَ، قد كُتِب لي ألْفُ سنةٍ'
  - motif: adam-forgot-so-his-offspring-forget
    refs:
    - Jāmiʿ 2:759.1
    - Jāmiʿ 2:759.2
    note: فجحد آدم فجحدتْ ذريَّتُه، ونَسِي آدمُ فنسيتْ ذرِّيَّتُه، وخَطئَ آدمُ فخطئت ذريَّتُه
  - motif: adam-sneezes-when-spirit-reaches-his-head
    refs:
    - Jāmiʿ 2:759.2
    note: 'لما خلق اللَّه آدم ونفخ فيه الرُّوح عَطَسَ، فقال: الحمد للَّه ... يرحمُك اللَّهُ يا آدم'
  - motif: adam-sent-to-greet-angels-greeting-of-descendants
    refs:
    - Jāmiʿ 2:759.2
    note: اذهبْ إلى أولئك الملائكةِ ... فَقُل السّلام عليكم ... إنّ هذه تحيَّتُك وتحيَّةُ بنيك بينهم
  - motif: adam-chooses-between-gods-closed-hands
    refs:
    - Jāmiʿ 2:759.2
    note: 'ويداه مقبوضتان- اخْتَرْ أَيَّهُما شِئْتَ؛ قال: اخْترتُ يمين ربّي -وكلتا يدي ربي يمين مباركة'
  - motif: adam-shown-descendants-with-lifespans-written
    refs:
    - Jāmiʿ 2:759.2
    note: فإذا كلُّ إنسان مكتوب عمره بين عينيه، فإذا فيهم رَجلٌ أضوؤهم
  - motif: writing-and-witnesses-commanded-from-adams-denial
    refs:
    - Jāmiʿ 2:759.2
    note: فجَحَدَ فجَحَدَتْ ذُرِّيَّتُه ... فَمِنْ يومئذٍ أُمِرَ بالكتاب والشّهود
  hints:
  - Adam gives David years of his thousand, against the midrash that Adam gave seventy of his thousand years to David, who was otherwise to die at birth (Pirqe R. Eliezer 19; Num. Rab. 14:12; Zohar I 55a, 91b); the hadith has forty out of sixty, or sixty out of forty
  - God shows Adam every generation of his descendants, against Gen. Rab. 24:2 and b. Sanhedrin 38b, where God shows Adam each generation with its expounders and leaders
- id: hadith-2-turner-of-hearts
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: All hearts between two fingers of the Merciful like one heart
  read:
  - Jāmiʿ 2:761.1
  tags:
  - motif: hearts-between-two-fingers-of-the-merciful-as-one-heart
    refs:
    - Jāmiʿ 2:761.1
    note: إنّ قلوب بني آدم كلَّها بين أصبعين من أصابع الرّحمن كقلب واحد، يصرِّفه حيث يشاء ... اللهمّ مصرِّف القلوب
- id: hadith-2-everything-by-decree
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Everything by decree, even incapacity and cleverness; a woman's lot; birds run by decree
  read:
  - Jāmiʿ 2:762.1-762.4
  quran:
  - 54:48-49
  tags:
  - motif: everything-by-decree-even-incapacity-and-cleverness
    refs:
    - Jāmiʿ 2:762.1
    note: 'أدركتُ ناسًا من أصحاب رسول اللَّه ﷺ يقولون: كلّ شيء بقدر ... حتّى العجز والكَيْس'
  - motif: woman-not-to-seek-sisters-divorce
    refs:
    - Jāmiʿ 2:762.2
    note: لا تسأل المرأةُ طلاق أختها لتستفرغ صحْفتها، ولتنكح، فإنّما لها ما قُدر لها
  - motif: quraysh-dispute-on-decree-verse-revealed
    refs:
    - Jāmiʿ 2:762.3
    note: جاء مشركوقريش يخاصمون رسول اللَّه ﷺ في القدر. فنزلت
  - motif: everything-created-by-measure
    refs:
    - Jāmiʿ 2:762.3
    note: إِنَّا كُلَّ شَيْءٍ خَلَقْنَاهُ بِقَدَرٍ
  - motif: bird-omens-run-by-decree-good-omen-liked
    refs:
    - Jāmiʿ 2:762.4
    note: يا أمّتاه ... الطّير تجري بقدر. وكان يعجبُه الفأل الحسن
- id: hadith-2-share-of-zina
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: God wrote for the son of Adam his share of zinā - the eyes, ears, tongue, hand and foot; the private part confirms or denies
  read:
  - Jāmiʿ 2:763.1-764.2
  quran:
  - '53:32'
  tags:
  - motif: each-limb-has-its-zina
    refs:
    - Jāmiʿ 2:763.1
    - Jāmiʿ 2:764.1
    - Jāmiʿ 2:764.2
    note: فالعينان زناهما النّظر، والأذنان زناهما الاستماع، واللّسان زناه الكلام، واليد زناها البطش، والرّجل زناها الْخُطَا ... ويصدّق ذلك الفرْجُ ويكذّبه
  - motif: zina-of-eye-and-tongue-decreed
    refs:
    - Jāmiʿ 2:763.1
    note: ما رأيتُ شيئًا أشبه باللمم ... إنّ اللَّه كتب على ابن آدم حظّه من الزِّنا، أدرك ذلك لا محالة
  hints:
  - Eyes, ears, tongue, hands and feet each committing zinā, against Num 15:39 ('do not go about after your heart and your eyes, after which you go whoring') read in y. Berakhot 1:5 as 'the heart and the eyes are the two agents of sin', and Matt 5:28, adultery by looking
- id: hadith-2-created-hanif
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: '"I created my servants ḥunafāʾ; the devils led them off"'
  read:
  - Jāmiʿ 2:765.1
  tags:
  - motif: servants-created-hanif-devils-led-them-off
    refs:
    - Jāmiʿ 2:765.1
    note: خلقتُ عبادي حتفاء كلّهم وإنهم أتتهم الشياطين فاجتالتهم عن دينهم، وحرّمتْ عليهم ما أحللتُ لهم
- id: hadith-2-born-on-the-fitra
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Every child born on the fitra, its parents make it Jew, Christian or Magian; Satan pricks all but Mary and her son
  read:
  - Jāmiʿ 2:765.2-766.2
  quran:
  - '30:30'
  tags:
  - motif: parents-make-child-jew-or-christian
    refs:
    - Jāmiʿ 2:765.2
    - Jāmiʿ 2:765.3
    - Jāmiʿ 2:766.1
    - Jāmiʿ 2:766.2
    note: فأبواه يهودانه وينصرانه; ويمجّسانه; ويشركانه; فإن كانا مسلمَيْنِ فمسلم
  - motif: newborn-beast-whole-until-ears-cut
    refs:
    - Jāmiʿ 2:765.2
    - Jāmiʿ 2:765.3
    note: كما تُنتجون البهيمة هل تجدون فيها من جدعاء حتى تكونوا أنتم تجدعونها
  - motif: fitra-primordial-nature
    refs:
    - Jāmiʿ 2:765.3
    note: فِطْرَتَ اللَّهِ الَّتِي فَطَرَ النَّاسَ عَلَيْهَا لَا تَبْدِيلَ لِخَلْقِ اللَّهِ
  - motif: god-knows-what-they-would-have-done
    refs:
    - Jāmiʿ 2:765.2
    - Jāmiʿ 2:766.1
    note: 'أفرأيتَ من يموت وهو صغير؟ قال: اللَّه أعلم بما كانوا عاملين'
  - motif: newborns-cry-from-satans-touch-except-mary-and-son
    refs:
    - Jāmiʿ 2:766.2
    note: كلّ إنسان تلده أمُّه يلكزه الشّيطان في حِضْنَيْه إلّا مريم وابنَها
- id: hadith-2-children-of-polytheists
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Children of polytheists - 'they are of them' in a night raid; 'God knows what they would have done'
  read:
  - Jāmiʿ 2:768.1-769.3
  tags:
  - motif: child-killed-in-night-raid-is-of-them
    refs:
    - Jāmiʿ 2:768.1
    note: 'مَرَّ بي النبيُّ ﷺ بالأبواء أو بودَّان ... أهل الدّار يُبيِّتون من المشركين، فيصاب من نسائهم وذراريهم؟ قال: هم منهم'
  - motif: god-knows-what-they-would-have-done
    refs:
    - Jāmiʿ 2:768.2
    - Jāmiʿ 2:768.3
    - Jāmiʿ 2:769.1
    - Jāmiʿ 2:769.2
    - Jāmiʿ 2:769.3
    note: 'سئل رسول اللَّه ﷺ عن ذراري المشركين، فقال: اللَّه أعلم بما كانوا عاملين; اللَّه إذْ خلقهم أعلم'
  - motif: ibn-abbas-gave-up-his-view-on-children
    refs:
    - Jāmiʿ 2:769.1
    note: 'أتي عليَّ زمانٌ، وأنا أقول: أولاد المسلمين مع المسلمين، وأولاد المشركين مع المشركين ... فأمْسَكتُ عن قولي'
  - motif: boy-fallen-from-litter-answers-question-on-lahin
    refs:
    - Jāmiʿ 2:769.2
    note: ما تقول في اللاهين؟ فسكت ... فإذا هو بصبي قد سقط من محفّة، فإذا هو يبحث في الأرض ... فنهى رسول اللَّه ﷺ عن قتل الأولاد
  - motif: children-follow-fathers-without-deeds-asked
    refs:
    - Jāmiʿ 2:769.3
    note: 'ذراري المؤمنين؟ فقال: هم من آبائهم. فقلت: يا رسول اللَّه، بلا عمل؟ ! ... فذراري المشركين؟ قال: من آبائهم'
- id: hadith-2-children-of-muslims-in-paradise
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Dead children are the little creatures of paradise; fostered by Abraham and Sarah; Abraham with the children in the dream (bāb on Q 52:21)
  read:
  - Jāmiʿ 2:771.1-772.1
  quran:
  - '52:21'
  tags:
  - motif: dead-children-little-creatures-of-paradise
    refs:
    - Jāmiʿ 2:771.1
    note: إنّه قد مات لي ابنان ... صغارهم دَعاميص الجنّة، يتلقَّى أحدُهم أباه ... فيأخذ بثوبه ... كما آخذ أنا بصنفة ثوبك هذا ... حتّى يدخله اللَّه وأباه الجنّة
  - motif: abraham-and-sarah-foster-muslim-children
    refs:
    - Jāmiʿ 2:771.2
    note: ذراري المسلمين في الجنّة يكفلهم إبراهيم; أولاد المسلمين في جبل في الجنّة يكفلهم إبراهيم وسارة، فإذا كان يوم القيامة دُفعوا إلى آبائهم
  - motif: abraham-in-meadow-with-children-who-died-on-fitra
    refs:
    - Jāmiʿ 2:772.1
    note: وأمّا الرّجل الطّويل الذي في الرّوضة فإنّه إبراهيم ... وأما الوِلْدان الذين حوله فكلُّ مولود مات على الفطرة
  - motif: children-of-polytheists-with-abraham
    refs:
    - Jāmiʿ 2:772.1
    note: 'يا رسول اللَّه، وأولاد المشركين؟ فقال رسول اللَّه ﷺ: وأولاد المشركين'
  hints:
  - Abraham (with Sarah) holding the dead children in paradise, against Abraham's bosom receiving the dead in Luke 16:22-23
- id: hadith-2-strong-believer-and-trial
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The strong believer; 'if' opens Satan's work; a rank reached through trials
  read:
  - Jāmiʿ 2:774.1-774.2
  tags:
  - motif: strong-believer-better-and-if-opens-satans-work
    refs:
    - Jāmiʿ 2:774.1
    note: 'المؤمن القوي خير وأحبّ إلى اللَّه من المؤمن الضعيف ... ولكن قل: قدرُ اللَّهِ، وما شاء فعل، فإنَّ لَوْ تفتحُ عمل الشّيطان'
  - motif: rank-reached-by-trials
    refs:
    - Jāmiʿ 2:774.2
    note: إنّ الرجل لتكون له عند اللَّه المنزلة فما يبلغها بعمل، فما يزال اللَّه يبتليه بما يكره حتَّى يُبلِّغه إيِّاها
- id: hadith-2-withdrawal-and-destined-souls
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Withdrawal (ʿazl) does not prevent a destined soul; seed on a rock would yield a child
  read:
  - Jāmiʿ 2:775.1-776.2
  tags:
  - motif: every-soul-destined-will-come-to-be
    refs:
    - Jāmiʿ 2:775.1
    - Jāmiʿ 2:776.2
    note: غزوة بني المصطلق ... وأَحْبَبْنا الفداءَ، فأردنا أن نعزل ... ما عليكم أن لا تفعلوا، ما من نسمة كائنة إلى يوم القيامة إلّا وهي كائنة; لم يخلق نسمة هو باريها إلّا وهي كائنة
  - motif: slave-girl-conceives-despite-withdrawal
    refs:
    - Jāmiʿ 2:775.2
    note: إنّ لي جاريةً هي خادمنا وسانيتُنا ... اعزلْ عنها إن شئتَ، فإنّه سيأتيها ما قُدِّر لها ... إنّ الجارية قد حَبِلتْ
  - motif: seed-poured-on-rock-would-yield-child
    refs:
    - Jāmiʿ 2:776.1
    note: لو أنّ الماء الذي يكون منه الولد أهرقته على صخرة لأخرج اللَّه منها -أو يخرج منها ولدًا
  hints:
  - Withdrawal permitted as useless against a destined soul, against Onan who 'spilled it on the ground' and was struck dead (Gen 38:9-10), and b. Niddah 13a on one who 'emits seed in vain'
- id: hadith-2-castration-pen-has-dried
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Abū Hurayra asks leave to castrate himself - 'the pen has dried on what you will meet'
  read:
  - Jāmiʿ 2:777.1
  tags:
  - motif: youth-asks-leave-to-castrate-pen-has-dried
    refs:
    - Jāmiʿ 2:777.1
    note: إنّي رجل شاب، وإنّي أخاف على نفسي العنت ... فأذن لي أن أختصي؟ ... ثلاث مرّات ... قد جفَّ القلم بما أنت لاق، فاختص على ذلك أو ذر
  - motif: pen-has-dried
    refs:
    - Jāmiʿ 2:777.1
    note: قد جفَّ القلم بما أنت لاق
  hints:
  - A young man asking to castrate himself for chastity is answered by decree, against Matt 19:12 ('eunuchs who made themselves eunuchs for the kingdom of heaven') and the bar on the castrated in Deut 23:1
- id: hadith-2-guard-god
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: '"Boy, guard God and he will guard you ... the pens are lifted and the pages dry"'
  read:
  - Jāmiʿ 2:777.2
  tags:
  - motif: guard-god-and-he-guards-you-pens-lifted
    refs:
    - Jāmiʿ 2:777.2
    note: 'كنتُ خلفَ رسول اللَّه ﷺ يومًا، فقال: يا غلام ... احفظ اللَّه يحفظك ... لو اجْتمعت على أن ينفعوك ... رُفعتِ الأقلام وجَفَّت الصُّحف'
- id: hadith-2-adam-and-the-black-shapes
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: In the ascent, Adam in the first heaven laughs at the shapes on his right and weeps at those on his left
  read:
  - Jāmiʿ 2:778.1
  tags:
  - motif: ascent-from-roof-opened-at-mecca
    refs:
    - Jāmiʿ 2:778.1
    note: فُرج عن سقف بيتي، وأنا بمكة، فنزل جبريل
  - motif: prophets-breast-split-washed-with-zamzam
    refs:
    - Jāmiʿ 2:778.1
    note: فَفَرَجَ صدري ثم غسله بماء زمزم ثم جاء بطست من ذهب ممتلئ حكمة وإيمانًا
  - motif: gatekeeper-of-heaven-asks-who-is-with-you
    refs:
    - Jāmiʿ 2:778.1
    note: 'قال جبريل لخازن السماء: افتح. قال: من هذا؟ ... هل معك أحد؟ ... أُرسل إليه؟'
  - motif: adam-laughs-right-weeps-left-at-offspring
    refs:
    - Jāmiʿ 2:778.1
    note: فإذا رجل قاعد على يمينه أَسْوِدة وعلى يساره أَسْوِدة، إذا نظر قبل يمينه ضحك، وإذا نظر قبل يساره بكي ... نسم بنيه
  hints:
  - Adam enthroned between the souls of his descendants, laughing at those bound for paradise and weeping at those bound for the fire, against Testament of Abraham (A) 11, where Adam sits between the narrow and the broad gate, rejoicing and weeping as souls pass
