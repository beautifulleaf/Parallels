      - {motif: sun-asks-leave-refused-lord-how-far-east, refs: ["Jāmiʿ 2:261.1"], note: "فتقول: أيْ ربّ إنّ المسير بعيد وإني لا يؤذن لي، لا أبلغ"}
      - {motif: gog-magog-each-leaves-thousand-offspring, refs: ["Jāmiʿ 2:261.1"], note: "ما يموتُ الرّجلُ منهم حتى يولد له من صلبه ألف، وإنّ من ورائهم ثلاثَ أمم، ما يعلم عدَّتَهم إلا اللَّه: منسك، وتاويل، وتاويس"}
