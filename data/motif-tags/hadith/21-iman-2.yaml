      - {motif: john-ordered-five-commandments, refs: ["Jāmiʿ 2:285.1"], note: "إنّ اللَّه أمر يحيى بن زكريا بخمس كلماتٍ"}
      - {motif: zakat-payer-killed-by-wrongful-collector-is-martyr, refs: ["Jāmiʿ 2:286.1"], note: "ثم أدّى الزّكاة فتعدى عليه الحقّ فأخذ سلاحه فقاتل فقُتِل فهو شهيد"}
      - {motif: delight-of-looking-on-gods-face-asked-in-prayer, refs: ["Jāmiʿ 2:286.2"], note: "وأسألك لذّة النّظر إلى وجهك والشّوق إلى لقائك"}
      - {motif: god-more-able-over-you-than-you-over-slave, refs: ["Jāmiʿ 2:287.1"], note: "أبا مسعود! اللَّه أقدر عليك منك عليه ... أما لو لم تفعل للفحتْك النّارُ"}
      - {motif: the-increase-is-looking-on-gods-face, refs: ["Jāmiʿ 2:287.2"], note: "النّظرُ إلى وجه ربِّنا"}
  - id: hadith-2-dajjal-one-eyed-god-not
