      - {motif: wicked-soul-refused-entry-at-heavens-gate, refs: ["Jāmiʿ 2:252.1"], note: "وأما الكافر قال: ينتهى به إلى السماء الدنيا، فيستفتحون فلا يُفتح له"}
      - {motif: the-merciful-are-shown-mercy-by-the-one-in-heaven, refs: ["Jāmiʿ 2:252.2"], note: "الرّاحمون يرحمهم الرحمن، ارْحمُوا أهلَ الأرض يرحمْكم من في السماء"}
