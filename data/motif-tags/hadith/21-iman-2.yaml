    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "God's face set to the praying servant (Yahya's five words again); alms-giver killed resisting an unjust collector is a martyr; Ammar's prayer; 'God is more able over you than you over him'; the 'increase' is looking on the face"
    read: ["Jāmiʿ 2:285.1-287.2"]
    quran: ["55:27", "28:88", "30:39", "76:9", "13:22", "18:28", "92:20", "10:26"]
