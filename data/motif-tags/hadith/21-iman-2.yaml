      - {motif: loved-in-god-on-pulpits-of-light-and-pearl, refs: ["Jāmiʿ 2:264.1", "Jāmiʿ 2:265.1", "Jāmiʿ 2:266.2"], note: "يضع اللَّه ﷿ لهم يوم القيامة منابر من نور، يخاف الناس ولا يخافون"}
  - id: hadith-2-trumpeter-and-the-kursi
