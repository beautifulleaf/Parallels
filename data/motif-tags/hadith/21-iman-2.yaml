    tags:
      - {motif: lord-descends-in-last-third-of-night, refs: ["Jāmiʿ 2:270.1", "Jāmiʿ 2:270.2", "Jāmiʿ 2:271.3", "Jāmiʿ 2:272.1", "Jāmiʿ 2:273.1", "Jāmiʿ 2:274.1"], note: "ينزل اللَّه ﵎ كلّ ليلة إلى السّماء الدّنيا حين يبقى ثلثُ اللّيل الآخر، فيقول: من يدعوني فأستجيبَ له"}
      - {motif: god-descends-asks-who-will-lend, refs: ["Jāmiʿ 2:271.1"], note: "من يُقْرِضُ غيرَ عديم ولا ظلوم"}
      - {motif: god-descends-to-judge-on-resurrection-day, refs: ["Jāmiʿ 2:271.2"], note: "إنّ اللَّه ﷿ إذا كان يوم القيامة نزل إلى العباد ليقضي بينهم"}
      - {motif: i-ask-no-one-about-my-servants-but-myself, refs: ["Jāmiʿ 2:271.3"], note: "لا أسألُ عن عبادي أحدًا غيري"}
      - {motif: seventy-thousand-enter-without-reckoning, refs: ["Jāmiʿ 2:271.3"], note: "وقد وعدني ربي ﷿ أن يُدخلَ من أُمّتي سبعين ألفًا لا حساب عليهم ولا عذاب"}
      - {motif: which-side-of-tree-nearer-prophet-hated, refs: ["Jāmiʿ 2:271.3"], note: "ما بال رجال يكون في شِقُّ الشجرة التي تلي رسولَ اللَّه ﷺ أبغضَ إليهم من الشِّقِ الآخر"}
      - {motif: toothstick-and-late-isha-not-imposed, refs: ["Jāmiʿ 2:273.1"], note: "لولا أن أشقّ على أمّتي لأمرتهم بالسّواك عند كلّ صلاة، ولأخرتُ العشاء الآخرة إلى ثلث اللّيل"}
      - {motif: gates-of-heaven-opened-god-stretches-hand, refs: ["Jāmiʿ 2:274.1"], note: "ثم تُفتح أبوابُ السماء، ثم يبسط يده فيقول: هل من سائل يُعطى سؤلَه"}
  - id: hadith-2-god-comes-in-unknown-form
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
