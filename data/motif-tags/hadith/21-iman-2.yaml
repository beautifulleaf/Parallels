    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Babs 27-28: the full hand (throne on the water, scale in the other hand); three hands: God's the highest, the giver's next, the asker's lowest; 'this wealth is green and sweet'"
    read: ["Jāmiʿ 2:306.1-307.1"]
    quran: ["48:10"]
    tags:
      - {motif: gods-full-hand-never-diminished, refs: ["Jāmiʿ 2:306.1"], note: "يد اللَّه ملآى لا يَغِيظُها نفقةٌ سحَّاءُ الليل والنهارَ ... وكان عرشُه على الماء، وبيده الأخرى الميزان"}
      - {motif: three-hands-gods-giver-asker, refs: ["Jāmiʿ 2:306.2", "Jāmiʿ 2:307.1"], note: "الأيدي ثلاثة: فيد اللَّه العليا، ويد المعطي التي تليها، ويد السائل السفلى"}
      - {motif: wealth-green-and-sweet-dirt-of-hands, refs: ["Jāmiʿ 2:306.2"], note: "إنّ هذا المال خضرة حُلوة، وإنَّما هو مع ذلك أوساخ أيدي الناس"}
  - id: hadith-2-hell-says-more-foot
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Hell keeps saying 'is there more?' until the Lord of might sets his foot in it: 'enough, enough by your might'; it folds in on itself; paradise has room left and God creates a people for it; paradise and hell dispute; the gathering, the followers of cross and images, death slaughtered on the wall"
    read: ["Jāmiʿ 2:308.1-310.1"]
    quran: ["50:30"]
    tags:
      - {motif: hell-asks-for-more, refs: ["Jāmiʿ 2:308.1", "Jāmiʿ 2:309.1", "Jāmiʿ 2:309.3", "Jāmiʿ 2:310.1"], note: "لا تزال جهنّم تقول: هل من مزيد"}
      - {motif: lord-sets-foot-hell-says-enough, refs: ["Jāmiʿ 2:308.1", "Jāmiʿ 2:309.1", "Jāmiʿ 2:309.2", "Jāmiʿ 2:309.3", "Jāmiʿ 2:310.1"], note: "حتى يضع ربُّ العزّة فيها قدمه، فتقول: قطْ قطْ وعزّتِك، ويُزْوى بعضُها إلى بعض"}
      - {motif: new-creation-made-for-paradises-spare-room, refs: ["Jāmiʿ 2:309.1", "Jāmiʿ 2:309.2", "Jāmiʿ 2:309.3"], note: "ولا يزالُ في الجنة فضْلٌ حتى ينشئَ اللَّه لها خلقًا آخر فيُسكنه في فضول الجنة"}
      - {motif: paradise-and-fire-dispute-proud-and-weak, refs: ["Jāmiʿ 2:309.2", "Jāmiʿ 2:309.3"], note: "تحاجت الجنّة والنار، فقالت النار: أُوثرتُ بالمتكبّرين والمتجبرين. وقالت الجنةُ: فما لي لا يدخلني إِلَّا ضعفاء الناس وسَقَطُهم"}
      - {motif: cross-worshipper-shown-his-cross-and-follows, refs: ["Jāmiʿ 2:310.1"], note: "فيُمثّل لصاحب الصليب صليبه، ولصاحب التصاوير تصاويره، ولصاحب النّار ناره"}
      - {motif: death-as-ram-slaughtered-between-paradise-and-hell, refs: ["Jāmiʿ 2:310.1"], note: "أُتِي بالموت مُلَبِّيًا فيوقف على السور الذي بين أهل الجنة وأهل النار"}
      - {motif: crossing-sirat-saying-sallim-sallim, refs: ["Jāmiʿ 2:310.1"], note: "ويوضع الصّراط فيمرون عليه مثل جياد الخيل والرّكاب وقولهم عليه: سلِّم سلِّم"}
    hints:
      - "Death slain at the end, against Isa 25:8 ('he will swallow up death') and Rev 20:14, and the rabbinic Angel of Death slaughtered by the Holy One (Had Gadya; b. Sukkah 52a slaughter of the evil inclination before the righteous and the wicked)."
  - id: hadith-2-umayya-throne-bearers
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Umayya b. Abi al-Salt's verses: 'a man and a bull beneath his right foot, the eagle for the other, and a lion lying in wait'; the sun that rises only punished and whipped: 'he spoke truly'"
    read: ["Jāmiʿ 2:311.1"]
    quran: ["50:30"]
    tags:
      - {motif: throne-bearers-man-bull-eagle-lion-in-verse, refs: ["Jāmiʿ 2:311.1"], note: "رجل وثور تحت رجل يمينه ... والنّسر للأخرى وليث مرصَّد"}
      - {motif: sun-rises-only-punished-and-whipped, refs: ["Jāmiʿ 2:311.1"], note: "إِلَّا معذبة وإلا تُجْلَدُ"}
    hints:
      - "Bearers in the forms of man, ox (bull), eagle and lion, against the four living creatures of Ezek 1:10 and Rev 4:7 (lion, calf, man, eagle); the reluctant sun driven out each dawn, against 1 En 72-75 and the sun's chariot drawn by angels in 2 En 11."
  - id: hadith-2-the-shin-uncovered
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "The shin: our Lord uncovers his shin, every believer prostrates; the one who prostrated for show finds his back a single plate; 'we will know him if he makes himself known'; backs like the horns of cattle"
    read: ["Jāmiʿ 2:313.1-313.3"]
    quran: ["68:42-43", "68:42"]
    tags:
      - {motif: shin-uncovered-back-becomes-one-plate, refs: ["Jāmiʿ 2:313.1", "Jāmiʿ 2:313.2", "Jāmiʿ 2:313.3"], note: "يكشِفُ ربُّنا عن ساقه، فيسجد له كلّ مؤمن ومؤمنة، ويبقى من كان يسجد في الدّنيا رياءً وسمعةً، فيذهب ليسجدَ فيعود ظهره طبقًا واحدًا"}
      - {motif: each-people-follows-what-it-worshipped-believers-wait, refs: ["Jāmiʿ 2:313.2", "Jāmiʿ 2:313.3"], note: "يلحقُ كلُّ قومٍ بما كانوا يعبدون ... فيقولون: إذا تعرّف إلينا عرفناه"}
      - {motif: hypocrites-backs-like-cattle-horns-cannot-bow, refs: ["Jāmiʿ 2:313.3"], note: "ويبقي فوم ظهورهم كصياصي البقر، يريدون السُّجود فلا يستطيعون"}
  - id: hadith-2-god-comes-in-forms-on-the-day
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "God comes on resurrection day: seen as plainly as the sun with no cloud and the full moon; worshippers of sun, moon and idols follow them; the community with its hypocrites; the unknown form then the known"
    read: ["Jāmiʿ 2:315.1"]
    tags:
      - {motif: seen-like-sun-and-full-moon-no-cloud, refs: ["Jāmiʿ 2:315.1"], note: "هل تضارون في الشمس ليس دونها سحاب"}
      - {motif: god-comes-in-unrecognized-form-then-known-form, refs: ["Jāmiʿ 2:315.1"], note: "فيأتيهم اللَّه في غير الصورة التي يعرفون ... فيأتيهم اللَّه في الصُّورة التي يعرفون"}
      - {motif: each-people-follows-what-it-worshipped-believers-wait, refs: ["Jāmiʿ 2:315.1"], note: "فيتبع من كان يعبد الشّمس، ويتبع من كان يعبد القمر، ويتبع من كان يعبد الطّواغيت"}
  - id: hadith-2-span-cubit-fathom-hurrying
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "'I am as my servant thinks of me': a span answered by a cubit, a cubit by a fathom; walking answered by running (harwala); remembered in himself or in a better assembly"
    read: ["Jāmiʿ 2:316.1-316.2"]
    tags:
      - {motif: span-for-cubit-cubit-for-fathom-walk-for-run, refs: ["Jāmiʿ 2:316.1", "Jāmiʿ 2:316.2"], note: "وإن تقرَّب إليَّ بشبر تقرّبتُ إليه ذراعًا، وإن تقرَّب إليَّ ذراعًا تقرّبتُ إليه باعًا، وإن أتاني يمشي أتيتُه هرولةً"}
      - {motif: i-am-as-my-servant-thinks-of-me, refs: ["Jāmiʿ 2:316.1"], note: "أنا عند ظن عبدي بي، وأنا معه إذا ذكرني"}
    hints:
      - "God running to meet the one who comes walking, against the father who 'ran, and fell on his neck' in Luke 15:20; 'return unto me and I will return unto you', Mal 3:7 and Zech 1:3."
  - id: hadith-2-god-laughs
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Laughter: God laughs at two men, one killing the other, both in paradise; at the persistent petitioner; at the last man to enter paradise ('do you mock me?'); 'our Lord comes to us laughing'; the clouds speak and laugh"
    read: ["Jāmiʿ 2:316.3-317.2"]
    tags:
      - {motif: god-laughs-at-killer-and-killed-both-in-paradise, refs: ["Jāmiʿ 2:316.3"], note: "يضحكُ اللَّه إلى رجلين يقتل أحدُهما الآخر، كلاهما يدخل الجنة"}
      - {motif: god-laughs-at-petitioner-then-admits-him, refs: ["Jāmiʿ 2:317.1"], note: "فلا يزال يدعو اللَّه حتى يضحك اللَّه ﵎ منه، فإذا ضحك اللَّه منه قال: أدخُل الجنّة"}
      - {motif: last-man-finds-paradise-full-three-times, refs: ["Jāmiʿ 2:317.2"], note: "أيُرضيك أن أُعطيك الدّنيا ومثلها معها"}
      - {motif: do-you-mock-me-and-you-lord-of-worlds, refs: ["Jāmiʿ 2:317.2"], note: "يا ربّ أتستهزئُ مني وأنت ربّ العالمين ... إنّي لا أستهزئ منك، ولكني على ما أشاء قادر"}
      - {motif: last-man-out-stumbles-and-is-scorched, refs: ["Jāmiʿ 2:317.2"], note: "رجلٌ يمشي مرة، ويكبو مرة، تسْعفُه النار مرة"}
    hints:
      - "God laughing, against Ps 2:4 and 37:13 ('he that sitteth in the heavens shall laugh') and the rabbinic 'my sons have defeated me' where God laughs (b. Bava Metzia 59b)."
