# Hadith chunk 21: al-Jāmiʿ al-Kāmil book 2 (kitāb al-īmān), Shamela pp. 198-317 (printed 1/199-319):
# the last bābs of the first series (54-62: reassurance of the heart, faith closed by the sun from the west, sins of
# Jahiliyya, the palm like the Muslim, not killing one who says the shahada, takfir, disowning one's father, the runaway
# slave, soothsayers), then 'jumūʿ abwāb al-īmān billāh' bābs 1-33: the primordial covenant, whispering, the call to
# tawḥīd, shirk and the major sins, the pledge, Noah's testament, the names, and the attributes (life, knowledge, power,
# highness, the Throne, the descent, form, face, eyes, hearing, hands, right hand, palm, fingers, foot, shin, coming,
# hurrying, laughter). Read in full from the Arabic (188 hadith). Many hadith recur under several bābs; each recurrence
# is read where it stands. One report on p. 221 (Abū Hurayra, 'which deed is best') is printed without a bullet and is
# not a line.
new_motifs:
  sun-rise-cycle-told-three-times: {label: "The sun's nightly round (run to its resting place under the Throne, fall prostrate, told 'rise, go back', rise in the east) is narrated three times over before the fourth night when it is told to rise from its setting place", cluster: cosmology}
  taunting-man-with-his-mother-is-jahiliyya: {label: "A companion who taunted a man with his (foreign) mother is told 'you are a man with Jahiliyya in you'; he then dresses his slave in a cloak like his own", cluster: ethics}
  satan-with-one-farther-from-two: {label: "Keep to the community: Satan is with the one alone and farther from two; whoever wants the middle of paradise (buhbuhat al-janna) keeps to the community", cluster: ethics}
  son-silent-father-wishes-he-had-spoken: {label: "The boy who knew the answer kept silent before his elders; his father: 'had you said it, it would be dearer to me than such and such'", cluster: wisdom}
  enemy-who-cut-off-hand-then-submits-not-to-be-killed: {label: "An unbeliever cuts off a companion's hand, then shelters behind a tree saying 'I submit to God'; he may not be killed: 'if you kill him he is in your place before you killed him, and you in his before he spoke'", cluster: law}
  wished-he-had-become-muslim-only-that-day: {label: "Rebuked again and again for killing a man after the shahada, the killer wished he had not become a Muslim before that day", cluster: sira}
  what-will-you-do-with-la-ilaha-on-judgment-day: {label: "To the commander who killed a man as he said 'no god but God' the prophet repeats only: 'what will you do with no god but God when it comes on resurrection day?'", cluster: eschatology}
  calling-brother-kafir-returns-on-one-of-them: {label: "Whoever says to his brother 'O unbeliever', one of the two incurs it: if it is not so, it returns on the speaker", cluster: ethics}
  cursing-believer-like-killing-him: {label: "Cursing a believer is like killing him, and accusing a believer of unbelief is like killing him", cluster: ethics}
  claiming-other-father-paradise-forbidden: {label: "Whoever knowingly claims a father other than his own: it is unbelief, and paradise is forbidden him; whoever claims a people he does not belong to, let him take his seat in the fire", cluster: law}
  heard-with-my-ears-kept-by-my-heart: {label: "Witness formula of the hearer: 'my two ears heard it and my heart kept it'", cluster: speech}
  runaway-slave-prayer-unaccepted-until-return: {label: "A slave who runs away from his masters: protection (al-dhimma) is lifted from him, his prayer is not accepted, he has disbelieved until he returns to them", cluster: law}
  beast-born-whole-no-cropped-ear: {label: "As a beast is born whole (jamʿāʾ): do you find any with a cropped ear (jadʿāʾ)?", cluster: nature}
  least-punished-would-give-earth-asked-less-in-adams-loins: {label: "God asks the least-punished of the fire whether he would ransom himself with all on earth; 'yes'; 'I wanted less of you while you were in Adam's loins: not to associate anything with me'", cluster: eschatology}
  offspring-poured-into-two-palms-paradise-and-fire: {label: "God pours Adam's offspring into his two palms: 'these for paradise, these for the fire'; each is eased toward its people's deeds", cluster: theology}
  covenant-taken-at-naman-offspring-like-ants: {label: "God took the covenant from Adam's back at Na'man (that is, Arafa): every offspring brought out of his loins, scattered before him like small ants (al-dharr), and spoken to face to face", cluster: theology}
  offspring-made-spirits-then-formed-then-spoke: {label: "Ubayy: God gathered all who would be until resurrection, made them spirits, then gave them forms, then made them speak, and took the covenant", cluster: theology}
  seven-heavens-seven-earths-and-adam-made-witnesses: {label: "God makes the seven heavens, the seven earths and their father Adam witnesses against the offspring, lest they say 'we did not know'", cluster: theology}
  adam-asks-why-not-equal-i-love-to-be-thanked: {label: "Adam, raised over his offspring, sees rich and poor, fair and less fair and asks 'Lord, if only you had made your servants equal'; God: 'I love to be thanked'", cluster: theology}
  prophets-among-offspring-like-lamps: {label: "Among the offspring the prophets were like lamps with light on them, singled out by a second covenant of messengership", cluster: theology}
  say-i-believe-in-god-and-his-messengers-against-doubt: {label: "When the question 'who created God?' comes, one says 'I believe in God (and his messengers)' and it goes away", cluster: ritual}
  people-will-keep-asking-till-who-created-god: {label: "People will not stop questioning one another until they say 'this is God, creator of everything; then who created God?' (in Muslim: God told the prophet of his community)", cluster: eschatology}
  dread-of-voicing-thought-is-clear-faith: {label: "Companions find in themselves what they think too grave to speak of; 'you have found it? That is clear faith (sarih al-iman / mahd al-iman)'", cluster: theology}
  rather-be-charcoal-than-speak-it: {label: "A man would rather be charcoal (humama) than speak what he finds in himself; the prophet: 'God is greatest' three times, 'praise God who turned his plot back to whispering'", cluster: theology}
  khubayb-verse-limbs-of-torn-body-blessed: {label: "Khubayb, led out of the sanctuary to be killed, recites: 'I care not on which side my death falls ... that is in the essence of God; if he wills he blesses the limbs of a torn body'", cluster: sira}
  captive-borrows-razor-before-execution: {label: "Before being led out to be killed the captive borrows a razor from his captor's daughter to shave", cluster: sira}
  call-in-order-shahada-prayers-alms: {label: "Mu'adh is to call People of the Book first to the shahada; if they obey, teach the five daily prayers; if they obey, alms taken from their rich and returned to their poor; avoid their choicest property", cluster: law}
  no-veil-between-wronged-prayer-and-god: {label: "Fear the prayer of the wronged: there is no veil between it and God", cluster: ethics}
  shahada-and-disbelief-in-other-gods-protect-blood: {label: "Whoever says 'no god but God' and disbelieves in what is worshipped besides God, his property and blood are inviolable, his reckoning with God", cluster: law}
  john-fears-swallowing-if-jesus-precedes: {label: "Jesus tells John either you command them or I will; John: 'I fear, if you get ahead of me with them, that I be swallowed by the earth or punished'; he fills the temple until they sit on the crenellations", cluster: prophets}
  idolater-like-slave-paying-wages-to-another: {label: "The associator is like a slave bought with his master's own gold or silver, told 'this is my house, this my work, work and pay me', who pays his earnings to someone else", cluster: theology}
  god-sets-his-face-to-praying-servant-unless-he-turns: {label: "In prayer do not turn aside: God sets his face toward his servant's face while he prays as long as he does not turn", cluster: ritual}
  remembrance-a-fortress-from-pursuing-enemy: {label: "Remembrance of God is like a man pursued by the enemy who reaches a strong fortress and is safe in it; so the servant is safe from Satan only by remembering God", cluster: ritual}
  leaving-community-a-span-removes-noose-of-islam: {label: "The prophet's five: hearing, obedience, jihad, emigration, the community; whoever leaves the community a span has thrown off the noose (ribqa) of Islam; who calls with the call of Jahiliyya is of the crowds (juthā) of hell even if he prays and fasts", cluster: law}
  best-slave-to-free-most-precious-to-owners: {label: "The best slave to free is the dearest in price and most precious to his owners; if not, help a craftsman or work for one who is clumsy (akhraq); if not, keep your harm from people: it is alms to yourself", cluster: ethics}
  immersing-oath-takes-muslims-property: {label: "The 'immersing' oath (al-yamin al-ghamus), among the major sins after shirk and undutifulness: the false oath by which one cuts off a Muslim's property", cluster: law}
  pledge-on-shahada-prayer-alms-and-sincerity-to-every-muslim: {label: "Jarir pledged on the shahada, prayer, alms, hearing and obeying, and sincere counsel (al-nush) to every Muslim", cluster: law}
  woman-withdraws-hand-to-repay-wailing: {label: "At the pledge forbidding wailing one woman draws back her hand: 'so-and-so helped me wail, I want to repay her'; she goes, returns, and pledges", cluster: ritual}
  pledge-to-ask-people-nothing-whip-falls: {label: "Pledged 'not to ask people anything', some of that band, when a whip fell, would not ask anyone to hand it up", cluster: ethics}
  thrice-asked-will-you-not-pledge: {label: "'Will you not pledge to God's messenger?' asked three times of nine, eight or seven men who had just pledged; the third time they stretch out their hands", cluster: sira}
  noah-dying-testament-two-commands-two-prohibitions: {label: "Noah at death tells his son: 'I command you two things and forbid you two': no god but God, and glory and praise to God; association and pride", cluster: prophets}
  glorification-is-prayer-of-all-things-and-their-provision: {label: "'Glory to God and his praise' is the prayer of every thing, and by it creatures receive their provision", cluster: ritual}
  bedouin-in-brocade-says-prophet-lowers-horsemen: {label: "A bedouin in a Sijan cloak buttoned with brocade says the prophet lowers every horseman son of a horseman and raises every shepherd son of a shepherd; the prophet takes him by the cloak", cluster: sira}
  asking-by-every-name-including-hidden-ones: {label: "Prayer of the grieved: 'I ask you by every name that is yours, by which you named yourself, sent down in your book, taught any of your creatures, or kept to yourself in the knowledge of the unseen'", cluster: ritual}
  servant-son-of-handmaid-forelock-in-gods-hand: {label: "'I am your servant, son of your servant, son of your handmaid; my forelock is in your hand; your judgment over me passes, your decree on me is just'", cluster: ritual}
  quran-the-spring-of-the-heart: {label: "Ask that the Quran be the spring (rabīʿ) of my heart, the light of my breast, the polishing away of my sorrow", cluster: ritual}
  womb-named-from-gods-name-rahman: {label: "God: 'I am al-Rahman and she is the womb (al-rahim); I derived her a name from my name: whoever joins her I join, whoever cuts her I sever'", cluster: theology}
  refuge-in-the-one-who-does-not-die-jinn-and-men-die: {label: "'I seek refuge in your might, no god but you, who does not die, while jinn and men die'", cluster: theology}
  ya-hayy-ya-qayyum-invocation: {label: "Among the prophet's prayers: 'O Living, O Self-subsisting' (ayy hayy ayy qayyum)", cluster: ritual}
  khidr-recognised-carried-without-fare: {label: "The ship's people recognise al-Khidr and carry him and Moses without fare", cluster: prophets}
  istikhara-two-rakas-and-prayer-naming-need: {label: "When one intends a matter: two rak'as beyond the obligatory, then 'O God I ask your choice by your knowledge and your power by your power ... if this matter is good for me in my religion, livelihood and outcome, decree it', naming the need", cluster: ritual}
  delight-of-looking-on-gods-face-asked-in-prayer: {label: "Ammar's prayer after a brief salat: 'let me live while life is better for me ... I ask you the delight of looking on your face and longing to meet you'", cluster: ritual}
  creation-in-darkness-light-sprinkled-on-them: {label: "God created his creatures in darkness and cast on them some of his light: whom the light struck was guided, whom it missed went astray; 'so the pen has dried on God's knowledge'", cluster: theology}
  hand-on-pain-bismillah-thrice-refuge-seven: {label: "For a pain in the body: place your hand on the place, say 'in the name of God' three times and seven times 'I seek refuge in God and his power from the evil of what I find and fear'", cluster: ritual}
  variant-reading-inni-ana-al-razzaq: {label: "The prophet taught Ibn Mas'ud the reading 'I, I am the Provider, the possessor of strength, the firm' (first person)", cluster: revelation}
  night-and-day-angels-meet-at-asr-and-fajr: {label: "Angels succeed one another among you by night and by day, gather at the afternoon and dawn prayers; those who spent the night ascend and are asked 'how did you leave my servants?': 'we left them praying and came to them praying'", cluster: angels}
  trustee-of-the-one-in-heaven: {label: "'Will you not trust me, when I am the trustee of the one in heaven, news of heaven coming to me morning and evening?'", cluster: sira}
  scratching-of-pens-heard-at-the-height: {label: "Raised in the ascent to a level where he heard the scratching (sarif) of the pens", cluster: cosmology}
  one-in-heaven-angry-with-wife-refusing-bed: {label: "A wife who refuses her husband's call to bed: the one in heaven is angry with her until he is pleased with her (in al-Bukhari: the angels curse her till morning)", cluster: law}
  index-finger-raised-to-sky-o-god-bear-witness: {label: "At Arafa: 'you will be asked about me'; he raises his index finger to the sky and points it at the people: 'O God, bear witness' three times", cluster: ritual}
  veil-of-light-face-would-burn-all-it-sees: {label: "His veil is light (or fire); were he to lift it the glories (subuhat) of his face would burn all of his creation his sight reaches", cluster: theology}
  slave-girl-asked-where-is-god-freed-as-believer: {label: "A master who struck his slave girl after a wolf took a sheep asks to free her; the prophet asks her 'where is God?' 'in heaven'; 'who am I?' 'God's messenger'; 'free her, she is a believer'", cluster: law}
  rain-fresh-from-its-lord: {label: "The prophet uncovers his body to the rain: 'because it is newly come from its Lord'", cluster: nature}
  joiner-of-kin-not-the-one-who-repays: {label: "The one who joins kin is not the one who repays in kind, but the one who joins it when it is cut", cluster: ethics}
  aishas-innocence-sent-down-from-above-seven-heavens: {label: "Ibn Abbas to the dying Aisha: your innocence was sent down from above seven heavens, brought by the trusted spirit, recited in every mosque night and day", cluster: sira}
  mistress-black-slave-asked-faith-in-resurrection: {label: "Asked before her freeing whether she testifies to God's oneness, his messenger, and believes in the resurrection after death: 'yes' to each", cluster: law}
  believers-soul-raised-to-seventh-heaven-written-in-illiyyin: {label: "Angels carry up the believer's soul, have heaven opened to them up to the seventh; God: 'write my servant's book in Illiyyin in the seventh heaven and return him to the earth, for from it I created them'", cluster: eschatology}
  the-merciful-are-shown-mercy-by-the-one-in-heaven: {label: "The merciful are shown mercy by the Merciful: have mercy on those on earth and the one in heaven will have mercy on you", cluster: ethics}
  good-soul-welcomed-gate-by-gate-up-to-god: {label: "'Come out, good soul that was in a good body'; it is raised to heaven, the gate is opened, 'who is this?' 'so-and-so', 'welcome to the good soul', until it reaches the heaven in which God is", cluster: eschatology}
  god-boasts-to-angels-of-those-waiting-for-prayer: {label: "Running, breathless, knees bared: 'your Lord has opened a gate of heaven and boasts of you to the angels: look at my servants, they have finished one obligation and wait for the next'", cluster: ritual}
  shaban-month-deeds-raised-fast-in-it: {label: "Sha'ban, neglected between Rajab and Ramadan, is the month in which deeds are raised to the Lord of the worlds: 'I love my deeds to be raised while I fast' (and Monday and Thursday when deeds are presented)", cluster: ritual}
  angel-of-death-came-to-people-openly: {label: "The angel of death used to come to people visibly ('iyanan')", cluster: angels}
  prayers-of-wronged-rise-like-sparks: {label: "Fear the prayers of the wronged: they rise to heaven as if they were sparks", cluster: ethics}
  angel-carries-forty-night-seed-to-lord-in-his-palm: {label: "When the seed has stayed forty nights in the womb the angel of souls lifts it to the Lord in his palm: 'male or female? wretched or happy?'; what it will meet is written between its eyes", cluster: theology}
  martyr-asks-bones-gathered-in-one-cloth: {label: "Before her death she asks one thing: that her bones and her children's be gathered in one cloth and buried; the tyrant: 'that is your right from us'", cluster: martyrdom}
  suckling-tells-mother-plunge-in: {label: "Her children are thrown in one by one; when she hesitates over her suckling, the infant says 'mother, plunge in: the punishment of this world is lighter than that of the next'", cluster: martyrdom}
  enough-sin-to-neglect-dependents: {label: "It is sin enough for a man to neglect those whose food he provides; the steward is sent back to leave the family enough", cluster: ethics}
  forty-years-gazing-up-god-descends-throne-to-footstool: {label: "God gathers the first and last for an appointed day, forty years, their eyes fixed on the sky awaiting judgment; God descends in shades of cloud from the Throne to the Footstool", cluster: eschatology}
  love-due-to-those-who-sit-visit-spend-for-god: {label: "God: 'my love is due to those who love one another in me, sit together in me, visit one another in me, and spend on one another in me'", cluster: ethics}
  loved-in-god-on-pulpits-of-light-and-pearl: {label: "Those who loved one another in God, of scattered tribes without kinship or trade between them, have faces of light and pulpits of light (or pearl) before the Merciful; they fear not when people fear", cluster: eschatology}
  old-woman-pushed-jar-broken-warns-of-kursi: {label: "In Abyssinia a youth pushes an old woman of their monks so she falls and breaks her water jar (in Burayda's version a horseman scatters a woman's basket of food); she says 'you will know when God sets up the Kursi and gathers the first and last'", cluster: eschatology}
  no-sanctified-people-where-weak-not-righted: {label: "'She spoke truly: how will God sanctify a community where the weak's right is not taken from the strong?'", cluster: ethics}
  god-descends-to-judge-on-resurrection-day: {label: "On resurrection day God descends to the servants to judge between them", cluster: eschatology}
  i-ask-no-one-about-my-servants-but-myself: {label: "At the descent: 'I ask no one about my servants but myself'", cluster: theology}
  which-side-of-tree-nearer-prophet-hated: {label: "Men asking leave to go to their families: 'why is the side of the tree next to God's messenger more hateful to some than the other side?'; all weep", cluster: sira}
  toothstick-and-late-isha-not-imposed: {label: "But for burdening his community he would have ordered the toothstick at every prayer and delayed the night prayer to a third of the night, when God descends", cluster: ritual}
  gates-of-heaven-opened-god-stretches-hand: {label: "In the last third the gates of heaven are opened, God descends and stretches out his hand: 'is there one asking who will be given?'", cluster: theology}
  god-comes-in-unrecognized-form-then-known-form: {label: "God comes to the community in a form other than the one they know: 'I am your Lord'; 'we seek refuge in God from you, this is our place till our Lord comes'; then he comes in the form they know", cluster: eschatology}
  bequest-limited-to-third-third-is-much: {label: "Sa'd, with one daughter as heir, asks to give two-thirds, then half, in alms: 'a third, and a third is much; better to leave your heirs rich than dependent, holding out their hands to people'", cluster: law}
  even-morsel-in-wifes-mouth-rewarded: {label: "No spending seeking God's face is unrewarded, even what you put in your wife's mouth", cluster: ethics}
  shahada-seeking-gods-face-forbids-fire: {label: "Of Malik b. al-Dukhshun called a hypocrite: 'does he not say no god but God seeking God's face?' None comes with it on resurrection day but God forbids the fire to him", cluster: eschatology}
  refuge-in-gods-face-from-punishment-above-and-below: {label: "At 'punishment from above you' the prophet says 'I seek refuge in your face', again at 'from beneath your feet'; at 'confound you in factions': 'this is easier'", cluster: ritual}
  idolaters-ask-drive-away-the-weak-six: {label: "The idolaters ask 'drive these away, they will not be bold against us': six weak companions (Sa'd, Ibn Mas'ud, a Hudhali, Bilal and two unnamed); Q 6:52 comes down", cluster: sira}
  woman-nearest-gods-face-in-depth-of-house: {label: "Woman is 'awra; when she goes out Satan raises his eyes to her; she is nearest to her Lord's face in the depth (qaʿr) of her house", cluster: law}
  zakat-payer-killed-by-wrongful-collector-is-martyr: {label: "Who pays his alms willingly seeking God's face, then a wrongful claim is pressed on him and he takes up arms, fights and is killed, is a martyr", cluster: law}
  god-more-able-over-you-than-you-over-slave: {label: "Abu Mas'ud beating his slave hears behind him: 'Abu Mas'ud, God is more able over you than you over him'; he frees him for God's face: 'had you not, the fire would have scorched you'", cluster: ethics}
  the-increase-is-looking-on-gods-face: {label: "'For those who did good, the best and an increase' (Q 10:26): the increase is looking on our Lord's face", cluster: eschatology}
  dajjals-right-eye-like-floating-grape: {label: "The Messiah Dajjal is blind in the right eye, as if his eye were a floating (protruding) grape", cluster: eschatology}
  kafir-on-dajjals-forehead-read-by-literate-and-illiterate: {label: "Between the Dajjal's eyes is written 'kafir', which every believer reads, writer and non-writer", cluster: eschatology}
  if-dajjal-comes-in-my-life-i-suffice-you: {label: "To Aisha (and Umm Salama) weeping at the Dajjal: 'if he comes out while I live I suffice you; if after me, your Lord is not one-eyed' (God will suffice you through the righteous)", cluster: eschatology}
  adam-and-moses-dispute-adam-wins: {label: "Adam and Moses dispute (before their Lord); Moses: 'you are our father, you disappointed us and brought us out of paradise'; Adam answers and 'Adam overcame Moses'", cluster: prophets}
  god-wrote-for-moses-with-his-hand: {label: "Adam to Moses: 'God chose you with his speech and wrote (the tablets) for you with his hand'", cluster: prophets}
  adam-created-by-hand-angels-bowed-lodged-in-garden: {label: "Moses lists Adam's honours: created by God's hand, breathed into with his spirit, angels made to bow, lodged in his garden, then brought people down to earth by his sin", cluster: prophets}
  moses-asks-highest-rank-honour-planted-by-gods-hand: {label: "Moses asks his Lord who has the highest station in paradise: 'those I wanted; I planted their honour with my hand and sealed it; no eye has seen, no ear heard, nor has it occurred to a human heart'", cluster: eschatology}
  pulpit-shakes-under-prophet-telling-of-gods-hands: {label: "As the prophet tells it, clenching and opening his fingers, the pulpit moves from its base till the narrator thinks it will fall with him", cluster: sira}
  i-am-the-king-where-are-kings-of-earth: {label: "Having seized the earth and folded the heavens in his right hand, God says 'I am the King; where are the kings of the earth?'", cluster: eschatology}
  balam-and-nun-ox-and-fish: {label: "A Jew: their relish is 'balam and nun' - an ox and a fish, from the lobe of whose liver seventy thousand eat; the prophet laughs till his molars show", cluster: eschatology}
  each-descendants-lifespan-written-between-eyes: {label: "In God's opened right hand Adam sees his offspring, each with his lifespan written between his eyes", cluster: theology}
  rabbi-god-holds-creation-on-five-fingers: {label: "A rabbi: God will hold the heavens on a finger, the earths on a finger, mountains and trees on a finger, water and soil on a finger, the rest of creation on a finger, shake them and say 'I am the King'; the prophet laughs in wonder confirming him and recites Q 39:67", cluster: eschatology}
  turner-of-hearts-make-my-heart-firm: {label: "The prophet's frequent prayer: 'O turner of hearts, make my heart firm on your religion'; 'do you fear for us?' 'yes'", cluster: ritual}
  scale-in-hand-of-merciful-raises-and-lowers: {label: "The scale is in the hand of the Merciful: he raises some peoples and lowers others until resurrection day", cluster: theology}
  three-hands-gods-giver-asker: {label: "The hands are three: God's hand is the highest, the giver's next to it, the asker's the lowest", cluster: ethics}
  wealth-green-and-sweet-dirt-of-hands: {label: "'This wealth is green and sweet, and with that it is the dirt (awsakh) of people's hands'", cluster: ethics}
  new-creation-made-for-paradises-spare-room: {label: "Paradise keeps a remainder until God creates (ansha'a) a new creation for it and settles them in its spare room", cluster: eschatology}
  paradise-and-fire-dispute-proud-and-weak: {label: "Paradise and the fire dispute: the fire 'I am given the proud and the tyrants'; paradise 'only the weak and lowly enter me'; God: 'you are my mercy, you my punishment, each of you shall be filled'", cluster: eschatology}
  cross-worshipper-shown-his-cross-and-follows: {label: "On the gathering each is told to follow what he worshipped: to the man of the cross his cross is represented, to the man of images his images, to the man of fire his fire, and they follow them", cluster: eschatology}
  crossing-sirat-saying-sallim-sallim: {label: "The bridge is set and the Muslims pass on it like fine horses and riders, saying 'grant safety, grant safety'", cluster: eschatology}
  throne-bearers-man-bull-eagle-lion-in-verse: {label: "Verses recited to the prophet: 'a man and a bull beneath his right foot, the eagle for the other and a lion lying in wait'; he says 'he spoke truly'", cluster: cosmology}
  sun-rises-only-punished-and-whipped: {label: "Umayya's verse that the sun refuses to come out unless punished and whipped is also confirmed 'he spoke truly'", cluster: cosmology}
  each-people-follows-what-it-worshipped-believers-wait: {label: "When God gathers the servants a crier calls 'let every people join what it worshipped'; the remaining say 'we wait for our God; if he makes himself known we will know him'", cluster: eschatology}
  hypocrites-backs-like-cattle-horns-cannot-bow: {label: "Some remain whose backs are like the horns (sayasi) of cattle; they want to prostrate and cannot", cluster: eschatology}
  seen-like-sun-and-full-moon-no-cloud: {label: "'Do you have trouble seeing the sun with no cloud before it, or the moon on the night it is full? So you will see him'", cluster: eschatology}
  span-for-cubit-cubit-for-fathom-walk-for-run: {label: "God: if my servant draws near me a span, I draw near a cubit; a cubit, I a fathom; if he comes walking, I come to him running", cluster: theology}
  i-am-as-my-servant-thinks-of-me: {label: "'I am as my servant thinks of me; I am with him when he remembers me: in himself, I remember him in myself; in an assembly, I remember him in a better assembly'", cluster: theology}
  god-laughs-at-killer-and-killed-both-in-paradise: {label: "God laughs at two men, one killing the other, both entering paradise: one fights in God's way and is killed, then God turns to the killer who fights and is martyred", cluster: theology}
  god-laughs-at-petitioner-then-admits-him: {label: "A man who swore not to ask more keeps asking ('Lord, do not make me the most wretched of your creatures') until God laughs at him, and when he laughs: 'enter paradise'", cluster: eschatology}
  do-you-mock-me-and-you-lord-of-worlds: {label: "Offered the world and its like, the last man says 'do you mock me, when you are Lord of the worlds?'; God laughs: 'I do not mock you, but I am able to do what I will'; Ibn Mas'ud laughs as he tells it", cluster: eschatology}
units:
  - id: hadith-2-abraham-doubt-lot-joseph
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "'We have more right to doubt than Abraham'; Lot's strong support; Joseph's long prison (bab on reassurance of the heart)"
    read: ["Jāmiʿ 2:198.1"]
    quran: ["2:260"]
    tags:
      - {motif: more-entitled-to-doubt-than-abraham, refs: ["Jāmiʿ 2:198.1"], note: "نحن أحقُّ بالشّك من إبراهيم إذ قال: ﴿رَبِّ أَرِنِي كَيْفَ تُحْيِ الْمَوْتَى"}
      - {motif: lot-wishes-for-strong-support, refs: ["Jāmiʿ 2:198.1"], note: "ويرحم اللَّه لوطًا لقد كان يأوي إلى ركن شديد"}
      - {motif: joseph-declined-release-from-prison, refs: ["Jāmiʿ 2:198.1"], note: "ولو لبثتُ في السّجن طول ما لبث يوسفُ لأجبتُ الدَّاعي"}
  - id: hadith-2-sun-from-west-faith-closed
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "When the sun rises from the west faith no longer profits; three signs; the sun prostrating under the Throne each night"
    read: ["Jāmiʿ 2:199.1-199.3"]
    quran: ["6:158", "36:38"]
    tags:
      - {motif: faith-unaccepted-after-sign-of-the-end, refs: ["Jāmiʿ 2:199.1", "Jāmiʿ 2:199.3"], note: "فإذا طلعتْ ورآها الناسُ آمن منْ عليها، فذاك حين ﴿لَا يَنْفَعُ نَفْسًا إِيمَانُهَا"}
      - {motif: three-signs-after-which-faith-avails-not, refs: ["Jāmiʿ 2:199.2"], note: "طلوع الشّمس من مغربها، والدّجال، ودابة الأرض"}
      - {motif: sun-prostrates-under-throne-each-night, refs: ["Jāmiʿ 2:199.3"], note: "تجري حتى تنتهي إلى مستقرِّها تحت العرش. فتخرُّ ساجدةً"}
      - {motif: sun-ordered-to-rise-from-the-west, refs: ["Jāmiʿ 2:199.3"], note: "ارْتفعيّ، أصبحي طالعةً من مغربك، فتصبحُ طالعةُ من مغربها"}
      - {motif: sun-rise-cycle-told-three-times, refs: ["Jāmiʿ 2:199.3"], note: "لا يستنكرُ الناس منها شيئًا حتى تنتهي إلى مستقرِّها ذاك تحت العرش"}
    hints:
      - "The sun bowing each night beneath the Throne and asking leave to rise, against the Egyptian sun-god's nightly passage through the underworld before his dawn rising (Amduat)."
  - id: hadith-2-abu-dharr-slave-same-cloak
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Abu Dharr and his slave wear matching cloaks: 'you are a man with Jahiliyya in you'; your servants are your brothers"
    read: ["Jāmiʿ 2:200.1"]
    tags:
      - {motif: servants-are-brothers-feed-them-as-yourself, refs: ["Jāmiʿ 2:200.1"], note: "إخوانكم خوَلُكم، جعلهم اللَّه تحت أيديكم، فمن كان أخوه تحت يده فليطْعمه مما يأكل، ولْيلبسه مما يلبس"}
      - {motif: taunting-man-with-his-mother-is-jahiliyya, refs: ["Jāmiʿ 2:200.1"], note: "أعيّرته بأمّه؟ إنّك امرؤٌ فيك جاهلية"}
  - id: hadith-2-sin-pricks-good-deed-pleases
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Sin is what pricks the soul; whoever is pleased by his good deed and grieved by his bad one is a believer (Abu Umama; Umar at al-Jabiya)"
    read: ["Jāmiʿ 2:200.2-200.3"]
    tags:
      - {motif: righteousness-good-character-sin-what-pricks-the-soul, refs: ["Jāmiʿ 2:200.2"], note: "إذا حكّ في نفسك شيءٌ فدعه"}
      - {motif: pleased-by-good-grieved-by-evil-is-believer, refs: ["Jāmiʿ 2:200.2", "Jāmiʿ 2:200.3"], note: "إذا ساءتك سيِّئتُك، وسرَتك حسنتُك، فأنت مؤمن"}
      - {motif: best-generation-then-second-third, refs: ["Jāmiʿ 2:200.3"], note: "أُوصيكم بأصحابي، ثم الذين يلونهم، ثم الذين يلونهم، ثم يفشو الكذب"}
      - {motif: satan-third-with-man-and-woman-alone, refs: ["Jāmiʿ 2:200.3"], note: "ألا لا يخلونّ رجلٌ بامرأة إِلَّا كان ثالثهما الشيطان"}
      - {motif: satan-with-one-farther-from-two, refs: ["Jāmiʿ 2:200.3"], note: "فإنّ الشيطان مع الواحد وهو من الاثنين أبعد، من أراد بحبوحة الجنة فليلزم الجماعة"}
  - id: hadith-2-palm-tree-like-the-muslim
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "The tree whose leaves do not fall is like the Muslim: the palm; Ibn Umar kept silent before Abu Bakr and Umar"
    read: ["Jāmiʿ 2:201.1"]
    tags:
      - {motif: believer-like-palm-tree-leaves-do-not-fall, refs: ["Jāmiʿ 2:201.1"], note: "إنّ من الشّجر شجرةً لا يسقط ورقُها، وإنَّها مثل المسلم"}
      - {motif: son-silent-father-wishes-he-had-spoken, refs: ["Jāmiʿ 2:201.1"], note: "لو كنتَ قلتَها كان أحبّ إليَّ من كذا وكذا"}
    hints:
      - "The palm whose leaf does not wither as the image of the righteous, against Ps 1:3 ('his leaf also shall not wither') and Ps 92:13 ('the righteous shall flourish like the palm tree')."
  - id: hadith-2-no-killing-after-shahada
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Do not kill the enemy who says 'there is no god but God': al-Miqdad's severed hand, Usama at al-Huraqa, Jundub's report"
    read: ["Jāmiʿ 2:202.1-203.1"]
    tags:
      - {motif: enemy-who-cut-off-hand-then-submits-not-to-be-killed, refs: ["Jāmiʿ 2:202.1"], note: "فإنْ قتلتَه فإنه بمنزلتك قبل أن تقتله، وإنَّك بمنزلته قبل أن يقول كلمته التي قال"}
      - {motif: did-you-split-open-his-heart, refs: ["Jāmiʿ 2:202.2"], note: "أقتلْتَه بعدما قال: لا إله إِلَّا اللَّه؟ ! \" قلت: كان متعوِّذًا"}
      - {motif: wished-he-had-become-muslim-only-that-day, refs: ["Jāmiʿ 2:202.2"], note: "فما زال يكرّرُها حتى تمنيتُ أني لم أكن أسلمتُ قبل ذلك اليوم"}
      - {motif: what-will-you-do-with-la-ilaha-on-judgment-day, refs: ["Jāmiʿ 2:203.1"], note: "فكيف تصنع بلا إله إلّا اللَّه إذا جاءت يوم القيامة"}
  - id: hadith-2-calling-brother-unbeliever
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Whoever calls his brother 'unbeliever' (or 'enemy of God'), one of the two bears it; the false oath by another religion, the suicide, cursing a believer"
    read: ["Jāmiʿ 2:203.2-204.4"]
    tags:
      - {motif: calling-brother-kafir-returns-on-one-of-them, refs: ["Jāmiʿ 2:203.2", "Jāmiʿ 2:204.1", "Jāmiʿ 2:204.3", "Jāmiʿ 2:204.4"], note: "من قال لأخيه: يا كافر، فقد باء بها أحدُهما"}
      - {motif: oath-by-other-religion-and-suicide-by-iron, refs: ["Jāmiʿ 2:204.2"], note: "من حلف بملة غير الإسلام كاذبًا فهو كما قال، ومن قتل نفسه بشيء عُذّب به في نار جهنّم"}
      - {motif: cursing-believer-like-killing-him, refs: ["Jāmiʿ 2:204.2"], note: "ولعنُ المؤمن كقتله، ومن رمي مؤمنًا بكفر فهو كقتله"}
  - id: hadith-2-disowning-ones-father
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Claiming a father other than one's own knowingly is unbelief and bars paradise; claiming a people not one's own"
    read: ["Jāmiʿ 2:205.1-206.2"]
    tags:
      - {motif: claiming-other-father-paradise-forbidden, refs: ["Jāmiʿ 2:205.1", "Jāmiʿ 2:205.2", "Jāmiʿ 2:206.1", "Jāmiʿ 2:206.2"], note: "من ادّعى أبًا في الإسلام غير أبيه، يعلم أنّه غير أبيه، فالجنّة عليه حرام"}
      - {motif: heard-with-my-ears-kept-by-my-heart, refs: ["Jāmiʿ 2:205.2", "Jāmiʿ 2:206.1"], note: "سمعتُه أُذناي ورعاه قلبي"}
  - id: hadith-2-runaway-slave-unbelief
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "The runaway slave: protection lifted, prayer not accepted, 'he has disbelieved until he returns'"
    read: ["Jāmiʿ 2:206.3"]
    tags:
      - {motif: runaway-slave-prayer-unaccepted-until-return, refs: ["Jāmiʿ 2:206.3"], note: "أيّما عبد أبق من مواليه فقد كفر حتى يرجع إليهم"}
  - id: hadith-2-soothsayers-jinni-hen
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Soothsayers are nothing: the jinni snatches a word of truth and clucks it into his ally's ear like a hen; a hundred lies are mixed in"
    read: ["Jāmiʿ 2:207.1"]
    tags:
      - {motif: soothsayers-are-nothing, refs: ["Jāmiʿ 2:207.1"], note: "إنَّهم ليسوا بشيء"}
      - {motif: jinni-clucks-word-into-soothsayers-ear, refs: ["Jāmiʿ 2:207.1"], note: "يخطفها الجنيّ فيقرقرها في أذن وليه كقرقرة الدّجاجة"}
      - {motif: one-stolen-word-mixed-with-hundred-lies, refs: ["Jāmiʿ 2:207.1"], note: "فيخلطون فيه أكثر من مائة كذبة"}
  - id: hadith-2-born-on-fitra
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Every child is born on the fitra; parents make it Jew, Christian or Magian; the beast born whole (bab of the covenant, Q 7:172)"
    read: ["Jāmiʿ 2:208.1"]
    quran: ["7:172", "30:30"]
    tags:
      - {motif: parents-make-child-jew-or-christian, refs: ["Jāmiʿ 2:208.1"], note: "ما من مولود إِلَّا يولد على الفطرة، فأبواه يهودانه وينصرانه ويمجّسانه"}
      - {motif: beast-born-whole-no-cropped-ear, refs: ["Jāmiʿ 2:208.1"], note: "كما تُنتج البهيمة بهيمةً جمعاء، هل تُحِسُّون فيها من جدعاء"}
      - {motif: fitra-primordial-nature, refs: ["Jāmiʿ 2:208.1"], note: "﴿فِطْرَتَ اللَّهِ الَّتِي فَطَرَ النَّاسَ عَلَيْهَا"}
  - id: hadith-2-least-punished-offered-earth-as-ransom
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "The least punished in the fire would ransom himself with all the earth: 'I asked of you less, while you were in Adam's loins'"
    read: ["Jāmiʿ 2:208.2"]
    quran: ["7:172"]
    tags:
      - {motif: least-punished-would-give-earth-asked-less-in-adams-loins, refs: ["Jāmiʿ 2:208.2"], note: "أردتُ منك أهون من هذا، وأنت في صُلب آدم: أن لا تُشرك بي شيئًا"}
      - {motif: no-ransom-on-judgment-day, refs: ["Jāmiʿ 2:208.2"], note: "لو أنّ لك ما في الأرض من شيء أكنت تفتدي به؟ فيقول: نعم"}
  - id: hadith-2-covenant-of-adams-offspring
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "God takes Adam's offspring from his back, makes them testify, and spreads them in his two palms: these for paradise, these for the fire; at Na'man (Arafa) like ants; Ubayy's long account"
    read: ["Jāmiʿ 2:209.1-211.1"]
    quran: ["7:172", "7:172-173", "33:7", "30:30", "53:56", "7:102"]
    tags:
      - {motif: primordial-covenant-of-descendants, refs: ["Jāmiʿ 2:209.1", "Jāmiʿ 2:210.1", "Jāmiʿ 2:211.1"], note: "أخذ ذرية آدم من ظهره، وأشهدهم على أنفسهم"}
      - {motif: offspring-poured-into-two-palms-paradise-and-fire, refs: ["Jāmiʿ 2:209.1"], note: "ثم أفاض بهم في كفيه فقال: هؤلاء للجنة، وهؤلاء للنّار"}
      - {motif: covenant-taken-at-naman-offspring-like-ants, refs: ["Jāmiʿ 2:210.1"], note: "أخذ اللَّه الميثاق من ظهر آدم بنَعمان -يعني عرفة- فأخرج من صلبه كل ذريّة ذرأها، فنثرهم بين يديه كالذّر، ثم كلَّمهم قبلًا"}
      - {motif: offspring-made-spirits-then-formed-then-spoke, refs: ["Jāmiʿ 2:211.1"], note: "فجعلهم أرواحًا ثم صوَّرهم، ثم استنطقهم وتكلَّموا"}
      - {motif: seven-heavens-seven-earths-and-adam-made-witnesses, refs: ["Jāmiʿ 2:211.1"], note: "فإني أشهد عليكم السموات السبع، والأرضين السبع، وأشهد عليكم أباكم آدم"}
      - {motif: adam-asks-why-not-equal-i-love-to-be-thanked, refs: ["Jāmiʿ 2:211.1"], note: "يا ربّ، لو سويت بين عبادك؟ قال: إني أحببتُ أن أشكر"}
      - {motif: prophets-among-offspring-like-lamps, refs: ["Jāmiʿ 2:211.1"], note: "وأري فيهم الأنبياء مثل السرج عليه النور، وخصوا بميثاق آخر من الرسالة والنبوة"}
    hints:
      - "Heaven and earth called to witness against the people lest they say they did not know, against Deut 30:19 and 31:28 ('I call heaven and earth to witness against you'); all generations present at the covenant, against Deut 29:14-15 ('with him that is not here with us this day')."
  - id: hadith-2-who-created-god
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Satan asks 'who created this?' until 'who created your Lord?': seek refuge, stop, say 'I believe in God'"
    read: ["Jāmiʿ 2:213.1-214.2"]
    quran: ["7:200", "41:36", "12:100", "114:1-6"]
    tags:
      - {motif: devil-prompts-question-who-created-god, refs: ["Jāmiʿ 2:213.1", "Jāmiʿ 2:214.1", "Jāmiʿ 2:214.2"], note: "من خلق كذا؟ من خلق كذا؟ حتى يقول: من خلق ربَّك؟ فإذا بلغه فليستعِذْ باللَّه ولينتهِ"}
      - {motif: say-i-believe-in-god-and-his-messengers-against-doubt, refs: ["Jāmiʿ 2:213.1", "Jāmiʿ 2:214.2"], note: "فليقْرأْ: آمنتُ باللَّه ورسله، فإنَّ ذلك يُذهب عنه"}
      - {motif: people-will-keep-asking-till-who-created-god, refs: ["Jāmiʿ 2:214.1"], note: "لن يبْرحَ النّاسُ يتساءلون حتى يقولوا: هذا اللَّهُ خالقُ كلِّ شيءٍ، فمن خلق اللَّه"}
  - id: hadith-2-inner-speech-forgiven
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "God overlooks what souls tell themselves until they act or speak; Abraham's doubt repeated"
    read: ["Jāmiʿ 2:215.1-216.1"]
    quran: ["7:200", "41:36", "12:100", "114:1-6", "2:260"]
    tags:
      - {motif: inner-thoughts-forgiven-until-spoken-or-done, refs: ["Jāmiʿ 2:215.1"], note: "إنّ اللَّه تجاوز عن أُمّتي ما حدَّثتْ به أنفسُها ما لم تعمل أو تتكلّم"}
      - {motif: more-entitled-to-doubt-than-abraham, refs: ["Jāmiʿ 2:216.1"], note: "نحن أحقُّ بالشّك من إبراهيم"}
      - {motif: joseph-declined-release-from-prison, refs: ["Jāmiʿ 2:216.1"], note: "ولو لبثتُ في السِّجن طولَ ما لبث يوسفُ لأجبتُ الدَّاعيَ"}
  - id: hadith-2-whispering-is-clear-faith
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Thoughts too grave to speak are 'clear faith'; 'praise God who returned his plot to whispering'"
    read: ["Jāmiʿ 2:216.2-217.1"]
    tags:
      - {motif: dread-of-voicing-thought-is-clear-faith, refs: ["Jāmiʿ 2:216.2", "Jāmiʿ 2:216.3"], note: "وقد وجدتموه؟ \" قالوا: نعم! قال: \"ذاك صريحُ الإيمان"}
      - {motif: rather-be-charcoal-than-speak-it, refs: ["Jāmiʿ 2:217.1"], note: "لأن يكون حُمَمَةً أحبُّ إليه من أن يتكلّم به. فقال: \"اللَّه أكبر! اللَّه أكبر! اللَّه أكبر! الحمد للَّه الذي ردّ كيده إلى الوسوسة"}
      - {motif: satans-plot-is-weak, refs: ["Jāmiʿ 2:217.1"], note: "الحمد للَّه الذي ردّ كيده إلى الوسوسة"}
  - id: hadith-2-in-the-essence-of-god
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Bab on 'dhat': Abraham's three lies, two 'in the essence of God'; Khubayb's verse 'that is in the essence of the God'"
    read: ["Jāmiʿ 2:218.1-218.2"]
    quran: ["37:89", "21:63"]
    tags:
      - {motif: abrahams-three-lies, refs: ["Jāmiʿ 2:218.1"], note: "لم يكذب إبراهيم قط إِلَّا ثلاث كذبات، ثنتين في ذات اللَّه"}
      - {motif: khubayb-verse-limbs-of-torn-body-blessed, refs: ["Jāmiʿ 2:218.2"], note: "وذلك في ذات الإله وإن يشأ ... يبارك على أوصال شِلو ممزّع"}
      - {motif: captive-borrows-razor-before-execution, refs: ["Jāmiʿ 2:218.2"], note: "استعار منها موسى يستحدّ بها"}
