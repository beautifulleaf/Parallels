      - {motif: love-due-to-those-who-sit-visit-spend-for-god, refs: ["Jāmiʿ 2:263.2", "Jāmiʿ 2:266.1"], note: "وجبتْ محبّتي للمتحابين فيَّ، والمتجالسين فيَّ، والمتزاورين فيَّ، والمتباذلين فيَّ"}
