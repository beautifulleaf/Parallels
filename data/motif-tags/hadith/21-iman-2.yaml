      - {motif: trustee-of-the-one-in-heaven, refs: ["Jāmiʿ 2:245.2"], note: "ألا تأْمنُوني وأنا أمين مَنْ في السّماء"}
      - {motif: alms-raised-like-foal-to-mountain, refs: ["Jāmiʿ 2:245.3"], note: "فإن اللَّه يتقبله بيمينه، ثم يربيها لصاحبه كما يربي أحدكم فلوه حتى تكون مثل الجبل"}
      - {motif: scratching-of-pens-heard-at-the-height, refs: ["Jāmiʿ 2:246.1"], note: "ثم عُرج بي حتى ظهرتُ لمستوى أسمع صريف الأقلام"}
  - id: hadith-2-the-one-in-heaven
