    read: ["Jāmiʿ 2:288.1-291.1"]
    quran: ["4:58"]
    tags:
      - {motif: dajjal-one-eyed-god-not, refs: ["Jāmiʿ 2:288.1", "Jāmiʿ 2:288.2", "Jāmiʿ 2:288.3", "Jāmiʿ 2:289.1", "Jāmiʿ 2:289.3", "Jāmiʿ 2:290.1", "Jāmiʿ 2:291.1"], note: "إنّه أعور، وإنّ ربّكم ليس بأعور، مكتوب بين عينيه كافر"}
      - {motif: dajjal-said-what-no-prophet-said-one-eyed, refs: ["Jāmiʿ 2:288.3"], note: "ولأصِفنّه صفةً لم يصفْها أحدٌ كان قبلي، إنّه أعور"}
      - {motif: dajjals-right-eye-like-floating-grape, refs: ["Jāmiʿ 2:288.2", "Jāmiʿ 2:289.3"], note: "أعور العين اليمنى، كأنّ عينه عنبة طافية"}
      - {motif: kafir-on-dajjals-forehead-read-by-literate-and-illiterate, refs: ["Jāmiʿ 2:290.1"], note: "بين عينيه مكتوب كافر يقرؤه كل مؤمن كاتب وغير كاتب"}
      - {motif: if-dajjal-comes-in-my-life-i-suffice-you, refs: ["Jāmiʿ 2:289.1", "Jāmiʿ 2:289.3"], note: "إن يخرج الدّجالُ وأنا حيٌّ كفيتُكموه"}
      - {motif: hearing-seeing-shown-by-finger-on-ear-and-eye, refs: ["Jāmiʿ 2:289.2"], note: "يضع إبهامه على أذنه والتي تليها على عينه"}
    hints:
      - "The false messiah marked on the forehead and a sign readable by all, against Rev 13:16-18 and 17:5 (names written on foreheads)."
  - id: hadith-2-god-hears
