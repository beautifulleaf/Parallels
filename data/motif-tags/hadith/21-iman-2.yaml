      - {motif: taif-prayer-complaint-of-weakness, refs: ["Jāmiʿ 2:292.1"], note: "فانطلقتُ وأنا مهموم على وجْهي، فلم أستفق إلّا وأنا بقرن الثّعالب"}
      - {motif: you-call-no-deaf-or-absent-one, refs: ["Jāmiʿ 2:292.2"], note: "اربعوا على أنفسكم، إنّكم لا تدعون أصمَّ ولا غائبًا، إنكم تدعون سميعًا قريبًا وهو معكم"}
      - {motif: three-men-at-kaaba-ask-whether-god-hears-whispers, refs: ["Jāmiʿ 2:293.1"], note: "قليل فقه قلوبهم، كثير لحم بطونهم، فقال أحدهم: أترون اللَّه يسمع ما نقول"}
      - {motif: hearing-seeing-shown-by-finger-on-ear-and-eye, refs: ["Jāmiʿ 2:293.2"], note: "يضع إبهامه على أذنه والتي تليها على عينه"}
      - {motif: gods-hearing-encompasses-all-voices, refs: ["Jāmiʿ 2:293.3"], note: "الحمد للَّه الذي وسِعَ سمعُه الأصوات، لقد جاءتْ خولةُ إلى رسول اللَّه ﷺ تشكو زوجها، فكان يخفى عليّ كلامُها"}
    hints:
      - "God hearing the whisper the neighbour in the room could not hear, against 1 Sam 1:13 (Hannah's lips moved, her voice not heard) and Ps 139:4."
  - id: hadith-2-created-with-gods-hand
