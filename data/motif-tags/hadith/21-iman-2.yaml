      - {motif: index-finger-raised-to-sky-o-god-bear-witness, refs: ["Jāmiʿ 2:246.3"], note: "بإصبعه السّبابة يرفعها إلى السّماء ويَنْكُتُها إلى النّاس: \"اللهم اشهد، اللهمّ اشهد\" ثلاث مرّات"}
      - {motif: wife-married-by-god-above-seven-heavens, refs: ["Jāmiʿ 2:246.4"], note: "زوّجكن أهاليكنّ، وزوّجني اللَّه من فوق سبع سماوات"}
      - {motif: god-does-not-sleep-veil-of-light, refs: ["Jāmiʿ 2:247.1"], note: "إنّ اللَّه ﷿ لا ينام ولا ينبغي له أن ينام، يخفضُ القسط ويرفعه"}
      - {motif: veil-of-light-face-would-burn-all-it-sees, refs: ["Jāmiʿ 2:247.1"], note: "حجابُه النّور -وفي رواية: النّار- ولو كشفه لأحرقت سُبُحات وجهه ما انتهى إليه بصرُه من خلقه"}
    hints:
