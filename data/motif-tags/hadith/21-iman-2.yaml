    read: ["Jāmiʿ 2:296.1-297.3"]
    quran: ["39:67"]
    tags:
      - {motif: heavens-folded-in-right-hand-earths-in-left, refs: ["Jāmiʿ 2:296.1", "Jāmiʿ 2:297.1", "Jāmiʿ 2:297.2"], note: "يأخذ اللَّه ﷿ سماواته وأرضيه بيديه فيقول: أنا اللَّه -ويقبض أصابعه ويبسطها- أنا الملك"}
      - {motif: pulpit-shakes-under-prophet-telling-of-gods-hands, refs: ["Jāmiʿ 2:296.1"], note: "حتى نظرتُ إلى المنبر يتحرّك من أسفل شيء، حتى إنّي لأقول: أساقط هو برسول اللَّه ﷺ"}
      - {motif: i-am-the-king-where-are-kings-of-earth, refs: ["Jāmiʿ 2:297.2"], note: "أنا الملك، أين ملوك الأرض"}
      - {motif: just-on-pulpits-of-light-at-gods-right, refs: ["Jāmiʿ 2:297.3"], note: "إنّ المقسطين عند اللَّه على منابر من نور عن يمين الرحمن ﷿، وكلتا يديه يمين"}
    hints:
      - "Heavens rolled up in God's hand at the end, against Isa 34:4 ('the heavens shall be rolled together as a scroll') and Isa 40:12 ('meted out heaven with the span')."
  - id: hadith-2-earth-one-loaf-full-hand
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "The earth one loaf turned by the Compeller as a traveller turns his bread; the Jew's 'balam and nun' (an ox and a fish whose liver-lobe feeds seventy thousand); God's right hand full; the throne on the water; the outstretched hand for repentance; Adam chooses the right hand"
    read: ["Jāmiʿ 2:298.1-299.2"]
    quran: ["39:67"]
    tags:
      - {motif: earth-becomes-one-loaf-for-paradise-guests, refs: ["Jāmiʿ 2:298.1"], note: "تكون الأرض يوم القيامة خبزة واحدة، يتكفّؤها الجبّار بيده، كما يكفأ أحدُكم خبزته في السّفر نُزُلًا لأهل الجنّة"}
      - {motif: balam-and-nun-ox-and-fish, refs: ["Jāmiʿ 2:298.1"], note: "إدامُهم بالامٌ ونون، وقالوا: وما هذا؟ قال: ثور ونون، يأكل من زائدة كبدها سبعون ألفًا"}
      - {motif: gods-right-hand-full-unspent, refs: ["Jāmiʿ 2:298.2"], note: "يمين اللَّه ملآى، لا يغيضها سحّاء الليل والنهار"}
      - {motif: spend-and-i-will-spend-on-you, refs: ["Jāmiʿ 2:298.2"], note: "يا ابن آدم، أَنْفِق أُنْفِق عليك"}
      - {motif: gods-full-hand-never-diminished, refs: ["Jāmiʿ 2:298.2"], note: "وعرشه على الماء، وبيده الأخرى القبض، يرفع ويخفض"}
      - {motif: alms-raised-like-foal-to-mountain, refs: ["Jāmiʿ 2:298.3"], note: "فإنّ اللَّه يتقبّلها بيمينه، ثم يربيها لصاحبه كما يُربّي أحدكم فلُوَّه حتى تكون مثل الجبل"}
      - {motif: god-stretches-hand-by-night-and-day-for-repentance, refs: ["Jāmiʿ 2:299.1"], note: "إنّ اللَّه ﷿ يبسط يدَه باللّيل ليتوب مسيءُ النّهار، ويبسط يدَه بالنّهار ليتوب مسيءُ اللّيل"}
      - {motif: adam-chooses-between-gods-closed-hands, refs: ["Jāmiʿ 2:299.2"], note: "اخترت يمين ربي -وكلتا يدي ربي يمين مباركة- ثم بسطها فإذا فيها آدم وذريته"}
      - {motif: each-descendants-lifespan-written-between-eyes, refs: ["Jāmiʿ 2:299.2"], note: "فإذا كلّ إنسان مكتوب عمره بين عينيه"}
    hints:
      - "'Balam and nun', the ox and the fish of the feast of the righteous, against Behemoth and Leviathan eaten at the messianic banquet (2 Bar 29:4; 1 En 60:7-9; b. Bava Batra 74b-75a); the compiler notes 'balam' is taken to be Hebrew."
  - id: hadith-2-palm-of-the-merciful
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Alms from good earnings placed in the palm of the Merciful and raised like a foal till a date becomes like a great mountain"
    read: ["Jāmiʿ 2:300.1"]
    tags:
      - {motif: alms-raised-like-foal-to-mountain, refs: ["Jāmiʿ 2:300.1"], note: "كأنَّها يضعها في كفِّ الرَّحمن ﷿، فيربّيها كما يربّي أحدُكم فَلُوَّه -أو فصيلَه- حتّى إنّ التمرة لتعود مثل الجبل العظيم"}
  - id: hadith-2-fingers-of-the-merciful
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Fingers: the rabbi's five fingers (heavens, earths, mountains and trees, water and soil, the rest of creation) and the prophet's laughter; the Jew's gesture; hearts between two fingers of the Merciful; 'turner of hearts'; the scale in the Merciful's hand"
    read: ["Jāmiʿ 2:301.1-305.1"]
    quran: ["39:67"]
    tags:
      - {motif: rabbi-god-holds-creation-on-five-fingers, refs: ["Jāmiʿ 2:301.1", "Jāmiʿ 2:302.1"], note: "إنّ اللَّه يُمسك السّماوات يوم القيامة على إصبع، والأرضين على إصبع، والجبال والشجر على إصبع، والماء والثّرى على إصبع، وسائر الخلق على إصبع"}
      - {motif: hearts-between-two-fingers-of-the-merciful-as-one-heart, refs: ["Jāmiʿ 2:302.2", "Jāmiʿ 2:302.3", "Jāmiʿ 2:303.1", "Jāmiʿ 2:304.1", "Jāmiʿ 2:304.2", "Jāmiʿ 2:305.1"], note: "إنّ قلوب بني آدم كلَّها بين إصبعين من أصابع الرحمن، كقلبٍ واحد يصرفه حيث يشاء"}
      - {motif: turner-of-hearts-make-my-heart-firm, refs: ["Jāmiʿ 2:303.1", "Jāmiʿ 2:304.1"], note: "يا مقلّب القلوب ثبِّتْ قلبي على دينك"}
      - {motif: scale-in-hand-of-merciful-raises-and-lowers, refs: ["Jāmiʿ 2:302.3"], note: "والميزان بيد الرّحمن يرفع أقوامًا، ويخفض آخرين إلى يوم القيامة"}
    hints:
      - "A rabbi telling of God holding creation on his fingers, endorsed with laughter, against Isa 40:12 and 48:13 ('my right hand hath spanned the heavens'); hearts turned by God's hand, against Prov 21:1 ('the king's heart is in the hand of the LORD ... he turneth it')."
  - id: hadith-2-hand-of-god-above
