      - {motif: moses-slaps-angel-of-death, refs: ["Jāmiʿ 2:254.2"], note: "فأتى موسى ﵇ فلطمه، فذهب بعينه، فعرج إلى ربّه"}
      - {motif: angel-of-death-came-to-people-openly, refs: ["Jāmiʿ 2:254.2"], note: "كان ملك الموت يأتي النّاس عِيانًا"}
      - {motif: prayers-of-wronged-rise-like-sparks, refs: ["Jāmiʿ 2:255.1"], note: "اتقوا دعوات المظلوم، فإنّها تصعد إلى السّماء كأنّها شرار"}
      - {motif: angel-carries-forty-night-seed-to-lord-in-his-palm, refs: ["Jāmiʿ 2:255.2"], note: "إذا مكث المني في الرَّحم أربعين ليلة أتاه ملك النفوس فعرج به إلى الرّب في راحته"}
      - {motif: ten-angels-race-to-write-praise, refs: ["Jāmiʿ 2:255.3"], note: "لقد ابتدرها عشرة أملاك كلّهم حريص على أن يكتبوها ... اكتبوها كما قال عبدي"}
    hints:
      - "Fate written on the forehead of the child in the womb (255.2), against the Mesopotamian 'tablet of destinies' and the rabbinic angel Laylah who brings the drop before God (b. Nid. 16b) to ask 'strong or weak, wise or foolish'."
  - id: hadith-2-hairdresser-of-pharaohs-daughter
