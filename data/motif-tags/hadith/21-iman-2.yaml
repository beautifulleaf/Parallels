    read: ["Jāmiʿ 2:282.1"]
    tags:
      - {motif: god-comes-in-unrecognized-form-then-known-form, refs: ["Jāmiʿ 2:282.1"], note: "فيأتيهم اللَّه في غير الصورة التي يعرفون، فيقول: أنا ربكم، فيقولون: نعوذ باللَّه منك"}
  - id: hadith-2-seeking-gods-face
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "The Face: Sa'd's third and 'even the morsel in your wife's mouth'; 'who is just if God and his messenger are not? Moses was harmed more'; the cloak of grandeur over his face; Itban; 'I seek refuge in your face'; the six weak companions; the woman nearest God's face in her inner room"
    read: ["Jāmiʿ 2:283.1-284.3"]
    quran: ["55:27", "28:88", "30:39", "76:9", "13:22", "18:28", "92:20", "6:65", "6:52"]
    tags:
      - {motif: bequest-limited-to-third-third-is-much, refs: ["Jāmiʿ 2:283.1"], note: "الثلث، والثلث كثير، إنّك إنْ تذرْ ورثتك أغنياء خير من أن تذرهم عالةً يتكفّفون النّاس"}
      - {motif: even-morsel-in-wifes-mouth-rewarded, refs: ["Jāmiʿ 2:283.1"], note: "حتى ما تجعل في في امرأتك"}
      - {motif: moses-was-harmed-more-and-was-patient, refs: ["Jāmiʿ 2:283.2"], note: "رحم اللَّهُ موسى قد أوذي بأكثر من هذا فصبر"}
      - {motif: two-gardens-silver-two-gold-cloak-of-pride, refs: ["Jāmiʿ 2:283.3"], note: "وما بين القوم وبين أن ينظروا إلى ربّهم إلّا رداء الكبرياء على وجهه في جنة عدن"}
      - {motif: shahada-seeking-gods-face-forbids-fire, refs: ["Jāmiʿ 2:283.4"], note: "فإنه لا يوافي عبد يوم القيامة به إلّا حرّم اللَّه عليه النار"}
      - {motif: refuge-in-gods-face-from-punishment-above-and-below, refs: ["Jāmiʿ 2:284.1"], note: "قال النبيُّ ﷺ: \"أعوذ بوجهك\" ... ﴿أَوْ يَلْبِسَكُمْ شِيَعًا﴾، فقال النبيُّ ﷺ: \"هذا أيسر"}
      - {motif: idolaters-ask-drive-away-the-weak-six, refs: ["Jāmiʿ 2:284.2"], note: "اطرد هؤلاء لا يجترئون علينا. قال: وكنت أنا وابن مسعود، ورجل من هذيل، وبلال، ورجلان لستُ أسميهما"}
      - {motif: woman-nearest-gods-face-in-depth-of-house, refs: ["Jāmiʿ 2:284.3"], note: "إنّ المرأة عورة، فإذا خرجت استشرفها الشّيطان، وأقرب ما تكون من وجه ربّها وهي في قعر بيتها"}
  - id: hadith-2-face-in-prayer-alms-and-vision
