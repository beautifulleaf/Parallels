      - {motif: hairdresser-drops-comb-says-bismillah, refs: ["Jāmiʿ 2:256.1"], note: "إذْ سقطتِ المدرَي من يدها، فقالت: بسم اللَّه، فقالت لها ابنةُ فرعون: أبي؟ قالت: لا ولكن ربّي وربُّ أبيك اللَّه"}
      - {motif: mother-and-children-thrown-into-heated-brass-cow, refs: ["Jāmiʿ 2:256.1"], note: "فأمر ببقرة من نحاس فأُحْميت، ثم أمر بها أن تُلقى هي وأولادها فيها"}
      - {motif: martyr-asks-bones-gathered-in-one-cloth, refs: ["Jāmiʿ 2:256.1"], note: "أحبُّ أن تجمع عظامي وعظام ولدي في ثوب واحد وتدفننا"}
      - {motif: suckling-tells-mother-plunge-in, refs: ["Jāmiʿ 2:256.1"], note: "قال: يا أمَّهْ اقتحمي، فإنّ عذاب الدّنيا أهونُ من عذاب الآخرة فاقتحمتْ"}
      - {motif: four-spoke-as-infants, refs: ["Jāmiʿ 2:256.1"], note: "تكلّم أربعةٌ صغار: عيسى ابن مريم ﵇، وصاحبُ جريج، وشاهد يوسف، وابنُ ماشطة ابنة فرعون"}
    hints:
