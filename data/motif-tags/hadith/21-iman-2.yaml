      - {motif: forty-years-gazing-up-god-descends-throne-to-footstool, refs: ["Jāmiʿ 2:262.3"], note: "أربعين سنة شاخصة أبصارهم إلى السّماء ينتظرون فصْل القضاء، وينزل اللَّه في ظلل من الغمام من العرش إلى الكرسيّ"}
