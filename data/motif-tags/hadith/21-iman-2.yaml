      - {motif: old-woman-pushed-jar-broken-warns-of-kursi, refs: ["Jāmiʿ 2:267.2", "Jāmiʿ 2:268.1"], note: "سوف تعلم يا غُدَر! إذا وضع اللَّه الكرسيَّ وجمع الأوّلين والآخرين وتكلمت الأيدي والأرجل بما كانوا يكسبون"}
      - {motif: no-sanctified-people-where-weak-not-righted, refs: ["Jāmiʿ 2:267.2", "Jāmiʿ 2:268.1"], note: "صدقتْ صدقتْ، كيف يقدس اللَّه أمّةً لا يؤخذ لضعيفهم من شديدهم"}
