    read: ["Jāmiʿ 2:294.1-295.2"]
    quran: ["5:64", "38:75", "36:83", "3:26", "32:17"]
    tags:
      - {motif: intercession-chain-adam-to-muhammad, refs: ["Jāmiʿ 2:294.1"], note: "لو استشفعنا على ربّنا حتى يريحنا من مكاننا هذا، فيأتون آدم فيقولون: أنت آدم أبو الخلق، خلقك اللَّه بيده"}
      - {motif: adam-and-moses-dispute-adam-wins, refs: ["Jāmiʿ 2:294.2", "Jāmiʿ 2:294.3", "Jāmiʿ 2:295.2"], note: "احتجّ آدم وموسى: فقال له موسى: يا آدم أنت أبونا خيّبتنا وأخرجتنا من الجنة"}
      - {motif: god-wrote-for-moses-with-his-hand, refs: ["Jāmiʿ 2:294.2"], note: "يا موسى اصطفاك اللَّهُ بكلامه، وخطّ لك بيده"}
      - {motif: adam-created-by-hand-angels-bowed-lodged-in-garden, refs: ["Jāmiʿ 2:294.3", "Jāmiʿ 2:295.2"], note: "أنت آدم الذي خلقك اللَّه بيده، ونفخ فيك من روحه، وأسجد لك ملائكته، وأسكنك في جنته"}
      - {motif: moses-asks-highest-rank-honour-planted-by-gods-hand, refs: ["Jāmiʿ 2:295.1"], note: "فرست كرامتهم بيدي، وختمتُ عليها، فلم تر عين، ولم تسمع أذن، ولم يخطر على قلب بشر"}
    hints:
      - "'No eye has seen, no ear heard, nor has it entered a human heart', against Isa 64:4 and 1 Cor 2:9; tablets written by God's hand, against Exod 31:18 ('written with the finger of God')."
  - id: hadith-2-folding-heavens-right-hand
