      - {motif: god-boasts-to-angels-of-those-waiting-for-prayer, refs: ["Jāmiʿ 2:253.2"], note: "هذا ربُّكم قد فتح بابًا من أبواب السّماء يباهي بكم الملائكة"}
  - id: hadith-2-deeds-raised-angel-of-death-and-more
