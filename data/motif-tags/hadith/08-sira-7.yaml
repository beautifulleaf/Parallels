    note: 'أصابتني جنابة ولا ماء، قال: عليك بالصعيد، فإنه يكفيك'
  - motif: water-skins-poured-out-yet-fuller-than-before
    refs:
    - Jāmiʿ 48:5724.1
    note: 'ونودي في الناس: اسقوا واستقوا ... وإنه ليخيل إلينا أنها أشد مِلأة منها حين ابتدأ فيها'
  - motif: prophet-called-the-sabi
    refs:
    - Jāmiʿ 48:5724.1
    note: 'قالت: الذي يقال له الصابئ؟'
  - motif: we-took-nothing-of-your-water-god-gave-us-drink
    refs:
    - Jāmiʿ 48:5724.1
