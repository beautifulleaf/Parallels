  - motif: pass-through-religion-like-arrow-through-game
    refs:
    - Jāmiʿ 48:5757.1
    note: يمرقون من الدين كما يمرق السهم من الرمية، ينظر إلى نصله ... رصافه ... نضيه ... قذذه فلا يوجد فيه شيء، قد سبق الفرث والدم
  - motif: sign-man-with-arm-like-a-womans-breast
    refs:
    - Jāmiʿ 48:5757.1
    note: آيتهم رجل أسود، إحدى عضديه مثل ثدي المرأة، أو مثل البضعة تدردر ... فأمر بذلك الرجل فالتمس فأتي به
- id: hadith-48-kisra-qaysar-and-security
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: No Chosroes after Chosroes; their treasures spent in God's path; the litter-woman from al-Hira to the Kaʿba; gold no one will take; the White Palace
  read:
  - Jāmiʿ 48:5758.1-5759.1
  quran: []
  tags:
  - motif: no-chosroes-or-caesar-after-them
    refs:
    - Jāmiʿ 48:5758.1
    - Jāmiʿ 48:5758.2
    note: إذا هلك كسرى فلا كسرى بعده، وإذا هلك قيصر فلا قيصر بعده ... لتنفقنّ كنوزهما في سبيل الله
  - motif: woman-travels-alone-fearing-only-god
    refs:
    - Jāmiʿ 48:5758.3
    note: لترين الظعينة ترتحل من الحيرة، حتى تطوف بالكعبة لا تخاف أحدا إلا الله
  - motif: none-will-accept-alms-of-gold
    refs:
    - Jāmiʿ 48:5758.3
    note: لترين الرجل يخرج ملء كفه من ذهب أو فضة، يطلب من يقبله منه فلا يجد أحدا يقبله منه
  - motif: god-speaks-to-man-without-interpreter
    refs:
    - Jāmiʿ 48:5758.3
    note: وليس بينه وبينه ترجمان يترجم له ... فينظر عن يمينه فلا يرى إلا جهنم، وينظر عن يساره فلا يرى إلا جهنم
  - motif: shield-from-fire-even-half-a-date
    refs:
    - Jāmiʿ 48:5758.3
    note: اتقوا النار ولو بشق تمرة، فمن لم يجد شق تمرة، فبكلمة طيبة
  - motif: treasure-of-chosroes-in-the-white-palace
    refs:
    - Jāmiʿ 48:5759.1
    note: لتفتحن عصابة من المسلمين ... كنز آل كسرى الذي في الأبيض
- id: hadith-48-sawn-and-combed-martyrs
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Earlier believers sawn in two and combed with iron combs did not turn back; 'but you are hasty'
  read:
  - Jāmiʿ 48:5759.2
  quran: []
  tags:
  - motif: earlier-believers-combed-with-iron-sawn-in-two
    refs:
    - Jāmiʿ 48:5759.2
    note: كان الرجل فيمن قبلكم يحفر له في الأرض، فيجعل فيه، فيجاء بالمنشار فيوضع على رأسه فيشق باثنتين، وما يصده ذلك عن دينه; ويمشط بأمشاط الحديد ما دون لحمه من عظم أو عصب
  - motif: rider-from-sanaa-to-hadramawt-fears-only-god
    refs:
    - Jāmiʿ 48:5759.2
    note: والله ليتمن هذا الأمر، حتى يسير الراكب من صنعاء إلى حضرموت، لا يخاف إلا الله، أو الذئب على غنمه
  - motif: prophet-reclining-on-cloak-in-kabas-shade
    refs:
    - Jāmiʿ 48:5759.2
    note: وهو متوسد بردة له في ظل الكعبة ... ولكنكم تستعجلون
  hints:
  - Believers 'sawn in two' for their faith (Heb 11:37, epristhēsan; Mart. Isa. 5:1-14, Isaiah sawn with a wood saw) against the earlier believer set in a pit and split in two with a saw laid on his head.
  - Torture by iron combs (2 Macc 7, the seven brothers' scalps torn; b. Berakhot 61b, Rabbi Akiva's flesh combed with iron combs, masreqot shel barzel) against 'combed with combs of iron down to bone and
    sinew'.
- id: hadith-48-liar-and-destroyer-of-thaqif
  tradition: islam
  corpus: hadith
  original: true
