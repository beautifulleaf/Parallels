  - motif: jerusalem-raised-before-him-to-answer-quraysh
    refs:
    - Jāmiʿ 48:5765.1
    - Jāmiʿ 48:5765.2
    note: 'فجلا الله لي بيت المقدس، فطفقت أخبرهم عن آياته، وأنا أنظر إليه؛ فكربت كربة ما كربت مثله قط، قال: فرفعه الله لي أنظر إليه'
