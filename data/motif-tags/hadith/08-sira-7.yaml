  - motif: not-even-this-palm-stalk
    refs:
    - Jāmiʿ 48:5760.1
    note: وَفِي يَدِ رَسُول اللَّهِ ﷺ قِطْعَةُ جَرِيدٍ ... لَوْ سَأَلْتَنِي هَذِهِ الْقِطْعَةَ مَا أَعْطَيْتُكَهَا ... وَلَئِنْ أَدْبَرْتَ لَيَعْقِرَنَّكَ اللَّهُ
  - motif: gold-bracelets-blown-away-are-two-liars
    refs:
    - Jāmiʿ 48:5760.1
    - Jāmiʿ 48:5761.1
    note: رَأَيْتُ فِي يَدَىَّ سِوَارَيْنِ مِنْ ذَهَبِ ... أَنِ انْفُخْهُمَا، فَنَفَخْتُهُمَا فَطَارَا، فَأَوَّلْتُهُمَا كَذَّابَيْنِ يَخْرُجَانِ بَعْدِي
  - motif: keys-of-earths-treasures-placed-in-hand
    refs:
    - Jāmiʿ 48:5761.1
    note: بينا أنا نائم أتيت بخزائن الأرض
