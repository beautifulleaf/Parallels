units:
- id: hadith-48-drinking-standing-and-sitting
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The Prophet drinks standing and sitting, prays shod and barefoot, turns right and left
  read:
  - Jāmiʿ 48:5683.1-5683.2
  quran: []
  tags:
  - motif: prophet-drinks-standing-and-sitting
    refs:
    - Jāmiʿ 48:5683.1
    - Jāmiʿ 48:5683.2
    note: يشرب قائمًا وقاعدًا
  - motif: prays-shod-and-barefoot
    refs:
    - Jāmiʿ 48:5683.2
    note: ويصلي منتعلا وحافيًا
  - motif: leaves-prayer-turning-right-or-left
    refs:
    - Jāmiʿ 48:5683.2
    note: وينصرف من الصلاة عن يمينه وعن يساره
- id: hadith-48-eating-with-three-fingers
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Eating with three fingers, licking them, the fallen morsel, wiping the bowl, squatting over dates
  read:
  - Jāmiʿ 48:5683.3-5684.3
  quran: []
  tags:
  - motif: eats-with-three-fingers-and-licks-them
    refs:
    - Jāmiʿ 48:5683.3
    - Jāmiʿ 48:5684.1
    note: كان يأكل بثلاث أصابع، فإذا فرغ لعقها
  - motif: fallen-morsel-not-left-for-satan
    refs:
    - Jāmiʿ 48:5684.1
    note: إذا سقطت لقمة أحدكم فليمط عنها الأذى وليأكلها، ولا يدعها للشيطان
  - motif: blessing-hidden-in-unknown-part-of-food
    refs:
    - Jāmiʿ 48:5684.1
    - Jāmiʿ 48:5684.2
    note: أمرنا أن نسلت القصعة ... فإنكم لا تدرون في أي طعامكم البركة؛ لا يدري في أيتهن البركة
  - motif: eats-dates-squatting
    refs:
    - Jāmiʿ 48:5684.3
    note: رأيت النبي ﷺ مقعيًا يأكل تمرًا
- id: hadith-48-reclining-on-left-side
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Reclining on a cushion on his left side
  read:
  - Jāmiʿ 48:5684.4
  quran: []
  tags:
  - motif: reclines-on-cushion-on-left-side
    refs:
    - Jāmiʿ 48:5684.4
    note: متكئًا على وسادة ... على يساره
- id: hadith-48-perfume-and-new-garment
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The perfume box (sukka); the prayer on putting on a new garment
  read:
  - Jāmiʿ 48:5685.1-5685.2
  quran: []
  tags:
  - motif: prophet-perfume-container-sukka
    refs:
    - Jāmiʿ 48:5685.1
    note: كان لرسول الله ﷺ سكة يتطيب منها
  - motif: prayer-for-good-of-new-garment-and-its-making
    refs:
    - Jāmiʿ 48:5685.2
    note: اللهم إني أسألك من خيره، ومن خير ما صنع له، وأعوذ بك من شره، وشر ما صنع له
- id: hadith-48-kohl-in-odd-numbers
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Kohl of antimony in odd numbers; cautery forbidden; hot drink disliked
  read:
  - Jāmiʿ 48:5686.1-5686.2
  quran: []
  tags:
  - motif: kohl-three-in-right-eye-two-in-left
    refs:
    - Jāmiʿ 48:5686.1
    note: يكتحل بالإثمد، ويكتحل اليمنى ثلاثَ قراود، واليُسْرى قِرْودين (mursal)
  - motif: kohl-and-stone-wiping-in-odd-numbers
    refs:
    - Jāmiʿ 48:5686.2
    note: إذا اكتحل اكتحل وترا، وإذا استجمر استجمر وترا
  - motif: cautery-forbidden
    refs:
    - Jāmiʿ 48:5686.2
    note: نهى رسول الله ﷺ عن الكيّ
  - motif: dislikes-hot-drink
    refs:
    - Jāmiʿ 48:5686.2
    note: وكان يكره شرب الحميم
- id: hadith-48-postures-lying-and-sitting
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Lying on his back with one leg over the other; sitting with knees clasped; Hasan in his lap; Qayla trembles
  read:
  - Jāmiʿ 48:5687.1-5688.1
  quran: []
  tags:
  - motif: lies-on-back-one-leg-over-other-in-mosque
    refs:
    - Jāmiʿ 48:5687.1
    note: مستلقيًا في المسجد، واضعًا إحدى رجليه على الأخرى
  - motif: sits-clasping-knees-with-hands
    refs:
    - Jāmiʿ 48:5687.2
    - Jāmiʿ 48:5687.3
    - Jāmiʿ 48:5688.1
    note: بفناء الكعبة محتبيًا بيده هكذا؛ فجلس فاحتبى؛ قاعد القُرفُصاء
  - motif: grandson-called-lukaa-runs-into-lap
    refs:
    - Jāmiʿ 48:5687.3
    note: أين لكاع؟ ادع لي لكاع، فجاء حسن يشتد فوقع في حجره
  - motif: puts-childs-mouth-in-his-mouth
    refs:
    - Jāmiʿ 48:5687.3
    note: يفتح فاه، فيدخل فاه في فيه
  - motif: prayer-i-love-him-so-love-him
    refs:
    - Jāmiʿ 48:5687.3
    note: اللهم إني أُحِبُّه فأَحِبَّه وأَحِبَّ من يحبه
  - motif: visitor-trembles-at-humble-prophet
    refs:
    - Jāmiʿ 48:5688.1
    note: فلما رأيت رسول الله ﷺ المتخشع في الجلسة، أرعدت من الفرق
- id: hadith-48-sleep-and-bedtime
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Sleeping on journeys; the bedtime praise; blowing into the palms with the last three surahs
  read:
  - Jāmiʿ 48:5688.2-5689.2
  quran:
  - '112:1'
  - '113:1'
  - '114:1'
  tags:
  - motif: sleeps-on-right-side-on-journey-halt
    refs:
    - Jāmiʿ 48:5688.2
    note: فعرس بليل، اضطجع على يمينه
  - motif: before-dawn-rests-head-on-raised-palm
    refs:
    - Jāmiʿ 48:5688.2
    note: وإذا عرس قبيل الصبح نصب ذراعيه، ووضع رأسه على كفه
  - motif: bedtime-praise-for-food-drink-shelter
    refs:
    - Jāmiʿ 48:5689.1
    note: الحمد لله الذي أطعمنا وسقانا وكفانا وآوانا، فكم ممن لا كافي له ولا مؤوي
  - motif: blows-into-palms-reciting-three-surahs-and-wipes-body
    refs:
    - Jāmiʿ 48:5689.2
    note: 'جمع كفيه ثم نفث فيهما، فقرأ فيهما: قل هو الله أحد، قل أعوذ برب الفلق، قل أعوذ برب الناس ... يفعل ذلك ثلاث مرات'
- id: hadith-48-work-in-the-house
