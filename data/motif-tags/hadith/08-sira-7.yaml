    note: لتأتيني أو لأبعثن إليك من يسحبك بقرونك ... والله! لا آتيك حتى تبعث إلي من يسحبني بقروني
  - motif: she-of-the-two-belts
    refs:
    - Jāmiʿ 48:5759.3
    note: أنا، والله! ذات النطاقين، أما أحدهما فكنت أرفع به طعام رسول الله ﷺ وطعام أبي بكر من الدواب
  - motif: in-thaqif-a-liar-and-a-destroyer
    refs:
    - Jāmiʿ 48:5759.3
    note: أن في ثقيف كذابا ومبيرا فأما الكذاب فرأيناه، وأما المبير فلا إخالك إلا إياه
