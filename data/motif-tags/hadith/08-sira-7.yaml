  - motif: seventy-thousand-without-reckoning
    refs:
    - Jāmiʿ 48:5762.1
    note: إن معه من أمته سبعين ألفا ليس عليهم حساب ولا عقاب ... وإنهم لأكثر من سبعين ألفا وسبعين ألفا، وسبعين ألفا
