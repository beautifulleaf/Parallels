- id: hadith-48-the-woman-with-water-skins
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The sleep past sunrise; the man in janaba told to use earth; the woman's water-skins pour for the army yet stay fuller; she and her clan accept Islam
  read:
