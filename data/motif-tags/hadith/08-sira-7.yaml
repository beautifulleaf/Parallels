  - motif: stranger-buys-camel-on-trust-face-like-full-moon
    refs:
    - Jāmiʿ 48:5769.1
    note: قد أخذتُه، ثم توارى بحيطان المدينة، فتلاومنا ... أعطيتم جملكم رجلا لا تعرفونه؟; فإني رأيت وجه رجل لم يكن ليحْقِركم، ما رأيت شيئا أشبه بالقمر ليلة البدر من وجهه
  - motif: giving-hand-is-the-upper-hand
    refs:
    - Jāmiʿ 48:5769.1
    note: 'يد المعطي يد العليا، وابدأ بمن تعول: أمك وأباك، أختك وأخاك، ثم أدناك أدناك'
  - motif: no-mother-bears-her-childs-crime
    refs:
    - Jāmiʿ 48:5769.1
    note: 'فخذ لنا بثأرنا منه، فرفع رسول الله ﷺ يديه حتى رأيت بياض إبطيه، وقال: ألا لا تجني أم على ولد'
  hints:
  - 'No one bears another''s guilt in a blood-feud (Deut 24:16, fathers not put to death for children nor children for fathers) against the refusal of vengeance for a pre-Islamic killing: ''no mother bears
    the crime of her child''.'
- id: hadith-48-the-bedouin-who-adjures-him
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The bedouin of the desert adjures him by the maker of sky, earth and mountains on prayer, alms, fast and pilgrimage - 'I will add nothing nor take away'
  read:
  - Jāmiʿ 48:5771.1
  quran:
  - 3:97
  tags:
  - motif: companions-forbidden-to-question-glad-of-bedouin
    refs:
    - Jāmiʿ 48:5771.1
    note: نُهينا أن نسأل رسول الله ﷺ عن شيءٍ، فكان يعجبنا أن يجيء الرّجلُ من أهل البادية العاقلُ
  - motif: oath-by-maker-of-sky-earth-mountains
    refs:
    - Jāmiʿ 48:5771.1
    note: 'فبالذي خلق السّماء وخلق الأرض ونصب هذه الجبال، آلله أرسلك؟ قال: نعم'
  - motif: neither-add-nor-subtract-gains-paradise
    refs:
    - Jāmiʿ 48:5771.1
    note: 'والذي بعثك بالحق لا أزيد عليهن ولا أنقص منهنّ، فقال النّبيُّ ﷺ: لئن صَدقَ لَيَدْخُلَنَّ الجنَّةَ'
  hints:
  - The formula 'you shall not add to it nor take from it' (Deut 4:2; 13:1) against the bedouin's oath 'I will neither add to them nor take from them' of the five duties.
- id: hadith-48-ashariyyun-and-abu-hurayras-arrival
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The Ashʿaris come chanting 'tomorrow we meet the beloved' and begin the handshake; Abu Hurayra's night verse and the runaway slave he frees
  read:
  - Jāmiʿ 48:5772.1-5772.2
  quran: []
  tags:
  - motif: tender-hearted-people-arrive-tomorrow
    refs:
    - Jāmiʿ 48:5772.1
    note: يقدم عليكم غدا أقوام، هم أرق قلوبا للإسلام منكم
  - motif: arrivals-chant-tomorrow-we-meet-the-beloved
    refs:
    - Jāmiʿ 48:5772.1
    note: 'جعلوا يرتجزون يقولون: غدا نلقى الأحِبّه ... محمدًا وحِزبه'
  - motif: first-to-shake-hands
    refs:
    - Jāmiʿ 48:5772.1
    note: فلما أن قدموا تصافحوا، فكانوا هم أول من أحدث المصافحة
  - motif: runaway-slave-returns-freed-for-gods-face
    refs:
    - Jāmiʿ 48:5772.2
    note: 'يا ليلة من طولها وعنائها ... وأبق غلام لي في الطريق ... هذا غلامك فقلت: هو لوجه الله، فأعتقته'
- id: hadith-48-tufayl-and-daws
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The Dawsi emigrant who cut his finger-joints and died - forgiven but told 'we will not mend what you spoiled'; 'O God, guide Daws'
  read:
  - Jāmiʿ 48:5773.1-5773.2
  quran: []
  tags:
  - motif: offer-of-tribal-fortress-refused-for-the-ansar
    refs:
    - Jāmiʿ 48:5773.1
    note: هل لك في حِصْنٍ حَصِيْنٍ ومنعةٍ؟ ... فأبى ذلك النبي ﷺ للذي ذخر الله للأنصار
  - motif: suicide-forgiven-but-hands-stay-covered
    refs:
    - Jāmiʿ 48:5773.1
    note: 'فأخذ مشاقص له، فقطع بها براجمه ... غفر لي بهجرتي إلى نبيه ﷺ ... ما لي أراك مغطيا يديك؟ قال: قيل لي: لن نصلح منك ما أفسدت'
  - motif: dead-man-reports-his-state-in-a-dream
    refs:
    - Jāmiʿ 48:5773.1
    note: 'فرآه الطفيل بن عمرو في منامه ... فقال له: ما صنع بك ربك؟'
  - motif: and-his-hands-too-forgive
    refs:
    - Jāmiʿ 48:5773.1
    note: اللهم وليديه فاغفر
  - motif: prayer-for-guidance-instead-of-curse
    refs:
    - Jāmiʿ 48:5773.2
    note: إن دوسا قد كفرت، وأبت فادع الله عليها ... اللهم اهْدِ دوسا وَأْتِ بهم
- id: hadith-48-abd-al-qays-four-and-four
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: ʿAbd al-Qays - four commands and four vessels forbidden; the hollowed trunk that makes a man strike his cousin; 'even if the rats eat them'; forbearance and deliberation
  read:
  - Jāmiʿ 48:5773.3-5774.2
  quran: []
  tags:
  - motif: welcome-without-disgrace-or-regret
    refs:
    - Jāmiʿ 48:5773.3
    note: مرحبا بالقوم -أو بالوفد- غير خزايا ولا ندامى
  - motif: four-commands-four-prohibitions
    refs:
    - Jāmiʿ 48:5773.3
    - Jāmiʿ 48:5774.1
    note: 'فأمرهم بأربع، ونهاهم عن أربع ... وأنْ تُعطوا من المغنم الخمس. ونهاهم عن أربع: عن الحنتم، والدُّباء، والنّقير، والمزفّت'
  - motif: four-forbidden-vessels-for-nabidh
    refs:
    - Jāmiʿ 48:5773.3
    - Jāmiʿ 48:5774.1
    - Jāmiʿ 48:5774.2
    note: الحنتم، والدُّباء، والنّقير، والمزفّت ... المقير
  - motif: drink-from-hollowed-trunk-makes-man-strike-cousin
    refs:
    - Jāmiʿ 48:5774.1
    note: جِذعٌ تنقرونه فتقذفون فيه من القُطَيْعاء ... حتى إنّ أحدكم ... ليضربُ ابنَ عمِّه بالسّيف ... وفي القوم رجل أصابته جراحة كذلك
  - motif: drink-from-tied-leather-skins-even-if-rats-eat-them
    refs:
    - Jāmiʿ 48:5774.1
    note: في أَسْقِية الأَدَم التي يُلاثُ على أفواهها ... وإن أكلتها الجرذانُ، وإن أكلتها الجِرذانُ، وإن أكلتها الجرذان
  - motif: forbearance-and-deliberation-loved-by-god
    refs:
    - Jāmiʿ 48:5774.1
    note: إنّ فيك لخصلتين يحبُّهما الله الحِلْمُ والأَنَاة
  - motif: can-come-only-in-sacred-month
    refs:
    - Jāmiʿ 48:5773.3
    - Jāmiʿ 48:5774.1
    note: إنّا لا نستطيع أن نأتيك إلا في الشّهر الحرام، وبيننا وبينك هذا الحيُّ من كفار مُضر
  hints:
  - Vessel material that determines whether a liquid is permitted or contaminated (Lev 11:32-33; m. Kelim on earthenware versus leather) against the four forbidden vessels (glazed jar, gourd, hollowed trunk,
    pitched) and the permitted tied leather skins.
- id: hadith-48-abd-al-qays-vessels-and-the-fevered-land
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Ibn ʿUmar names three vessels and Ibn al-Musayyab is unsure of the fourth; ʿAbd al-Qays come back yellow and swollen - 'drink what is good for you'
  read:
  - Jāmiʿ 48:5775.1-5776.1
  quran: []
  tags:
  - motif: four-forbidden-vessels-for-nabidh
    refs:
    - Jāmiʿ 48:5775.1
    note: 'فنهاهم عن الدباء والنقير والحنتم، فقلت له: يا أبا محمد، والمزفت ... لم أسمعه يومئذ من عبد الله بن عمر، وقد كان يكره'
  - motif: forbidden-drink-left-delegation-sick-in-fever-land
    refs:
    - Jāmiʿ 48:5776.1
    note: 'ما لكم قد اصفرت ألوانكم، وعظمت بطونكم، وظهرت عروقكم؟ ... وكنا بأرض محمة، قال: فاشربوا ما طاب لكم'
- id: hadith-48-banu-asad-boast-of-their-islam
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Banu Asad remind him they did not fight him - 'Satan speaks on their tongues'; Q 49:17 sent down
  read:
  - Jāmiʿ 48:5777.1
  quran:
  - '49:17'
  tags:
  - motif: tribe-counts-its-islam-a-favour
    refs:
    - Jāmiʿ 48:5777.1
    note: قاتلتك مضر كلها، ولم نقاتلك، ولسنا بأقلهم عددا، ولا أَكَلِّهم شوكة، وصلنا رحمك
  - motif: satan-speaks-on-their-tongues
    refs:
    - Jāmiʿ 48:5777.1
    note: إن فقههم لقليل، وإن الشيطان لينطق على لسانهم
  - motif: do-not-count-your-islam-a-favour-to-me
    refs:
    - Jāmiʿ 48:5777.1
    note: يمنون عليك أن أسلموا قل لا تمنوا علي إسلامكم بل الله يمن عليكم أن هداكم للإيمان
- id: hadith-48-hamdan-and-najran
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: All Hamdan accept Islam on ʿAli's reading of the letter - the Prophet falls prostrate, 'peace on Hamdan'; Najran's leaders decline the mutual curse; the trustworthy one of this community; the treaty
    of two thousand robes
  read:
  - Jāmiʿ 48:5779.1-5780.2
  quran:
  - 3:61
  tags:
  - motif: whole-tribe-converts-on-reading-of-letter
    refs:
    - Jāmiʿ 48:5779.1
    note: فقرأ عليهم كتاب رسول الله ﷺ، فأسلمت همدان جميعا
  - motif: prostration-of-thanks-at-good-news
    refs:
    - Jāmiʿ 48:5779.1
    note: 'فلما قرأ رسول الله ﷺ الكتاب خر ساجدًا، ثم رفع رأسه، فقال: السلام على همدان، السلام على همدان'
  - motif: christian-leaders-decline-the-mutual-curse
    refs:
    - Jāmiʿ 48:5780.1
    note: جاء العاقب والسيد صاحبا نجران ... يريدان أن يلاعناه ... لئن كان نبيا فلاعنَّا لا نفلحُ نحن، ولا عَقِبُنا من بعدنا
  - motif: trustworthy-one-of-this-community
    refs:
    - Jāmiʿ 48:5780.1
    note: 'لأبعثن معكم رجلا أمينا حق أمين فاستشرف له أصحاب رسول الله ﷺ، فقال: قم يا أبا عبيدة بن الجراح ... هذا أمين هذه الأمة'
  - motif: treaty-two-thousand-robes-in-two-instalments
    refs:
    - Jāmiʿ 48:5780.2
    note: 'على ألفي حلة: النصف في صفر والنصف في رجب ... وعاريةٍ ثلاثين درعا، وثلاثين فرسا، وثلاثين بعيرا'
  - motif: churches-not-demolished-priests-not-expelled
    refs:
    - Jāmiʿ 48:5780.2
    note: على أن لا تهدم لهم بيعة، ولا يخرج لهم قس، ولا يفتنوا عن دينهم ما لم يحدثوا حدثا أو يأكلوا الربا
- id: hadith-48-tamim-and-the-yemenis
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Banu Tamim answer good news with 'then give us'; the Yemenis accept it - faith is Yemeni; pride among camel-owners, calm among shepherds
  read:
  - Jāmiʿ 48:5782.1-5782.2
  quran: []
  tags:
  - motif: good-news-answered-with-demand-for-gifts
    refs:
    - Jāmiʿ 48:5782.1
    note: أبشروا يا بني تميم قالوا أما إذ بشرتنا فأعطنا. فتغير وجه رسول الله ﷺ ... اقبلوا البشرى إذ لم يقبلها بنو تميم
  - motif: faith-is-yemeni-wisdom-is-yemeni
    refs:
    - Jāmiʿ 48:5782.2
    note: هم أرق أفئدة، وألين قلوبا، الإيمان يمان، والحكمة يمانية
  - motif: pride-with-camel-owners-calm-with-shepherds
    refs:
    - Jāmiʿ 48:5782.2
    note: والفخر والخيلاء في أصحاب الإبل، والسكينة والوقار في أهل الغنم
- id: hadith-48-raised-voices-of-abu-bakr-and-umar
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Abu Bakr and ʿUmar quarrel over a commander for Tamim and raise their voices - the opening verses of al-Hujurat; ʿUmar afterwards speaks like one whispering
  read:
  - Jāmiʿ 48:5782.3-5782.4
  quran:
  - '49:1'
  - 49:2-3
  tags:
  - motif: two-elders-quarrel-over-a-tribal-commander
    refs:
    - Jāmiʿ 48:5782.3
    - Jāmiʿ 48:5782.4
    note: 'أمِّر القعقاع بن معبد بن زرارة. قال عمر: بل أمِّر الأقرع بن حابس. قال أبو بكر: ما أردت إلا خلافي'
  - motif: verse-against-raising-voices-above-the-prophet
    refs:
    - Jāmiʿ 48:5782.3
    - Jāmiʿ 48:5782.4
    note: 'فتماريا حتى ارتفعت أصواتهما، فنزل في ذلك: يا أيها الذين آمنوا لا تقدموا؛ لا ترفعوا أصواتكم فوق صوت النبي'
  - motif: speaks-like-a-whisperer-after-the-verse
    refs:
    - Jāmiʿ 48:5782.4
    note: فكان عمر بعد ... إذا حدث النبي ﷺ بحديث حدثه كأخي السرار، لم يسمعه حتى يستفهمه
- id: hadith-48-kinda-sons-of-al-nadr
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Al-Ashʿath asks 'are you not of us?' - 'we are the sons of al-Nadr b. Kinana; we do not trace descent through our mother nor disown our father'
  read:
  - Jāmiʿ 48:5783.1
  quran: []
  tags:
  - motif: we-do-not-trace-descent-through-mother
    refs:
    - Jāmiʿ 48:5783.1
    note: 'ألستم منا؟ فقال: نحن بنو النضر بن كنانة، لا نقفو أمنا، ولا ننتفي من أبينا'
- id: hadith-48-musaylima-and-the-bracelets-again
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Musaylima and the palm-stalk; the dream of two gold bracelets (repeated in the chapter on delegations), and the report of his lodging with Bint al-Harith
  read:
  - Jāmiʿ 48:5784.1-5785.2
  quran: []
  tags:
  - motif: claimant-asks-to-succeed-the-prophet
    refs:
    - Jāmiʿ 48:5784.1
    - Jāmiʿ 48:5785.2
    note: إن جعل لي محمد الأمر من بعده تبعته؛ إن شئت خليت بيننا وبين الأمر ثم جعلته لنا بعدك
  - motif: not-even-this-palm-stalk
    refs:
    - Jāmiʿ 48:5784.1
    - Jāmiʿ 48:5785.2
    note: لو سألتني هذه القطعة ما أعطيتكها؛ لو سألتني هذا القضيب ما أعطيتكه
  - motif: gold-bracelets-blown-away-are-two-liars
    refs:
    - Jāmiʿ 48:5784.1
    - Jāmiʿ 48:5785.1
    note: رأيت في يدي سوارين من ذهب ... أن انفخهما، فنفختهما فطارا؛ صاحب صنعاء، وصاحب اليمامة
  - motif: spokesman-answers-for-the-prophet
    refs:
    - Jāmiʿ 48:5784.1
    - Jāmiʿ 48:5785.2
    note: وهذا ثابت يجيبك عني ... وهو الذي يقال له خطيب رسول الله ﷺ
- id: hadith-48-envoys-are-not-killed
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Musaylima's two envoys say 'as he says' - 'were envoys not exempt from killing I would strike your necks'
  read:
  - Jāmiʿ 48:5786.1
  quran: []
  tags:
  - motif: envoys-not-killed
    refs:
    - Jāmiʿ 48:5786.1
    note: 'فما تقولان أنتما؟ قالا: نقول كما قال. فقال رسول الله ﷺ: أما والله لولا أن الرسل لا تقتل لضربت أعناقكما'
- id: hadith-48-thaqif-and-the-leper
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Thaqif stipulate no alms and no jihad - 'they will give and fight once Muslim'; the leper in the delegation told 'we have taken your pledge, go back'
  read:
  - Jāmiʿ 48:5788.1-5789.1
  quran: []
  tags:
  - motif: converts-exempted-from-alms-and-war-will-do-both
    refs:
    - Jāmiʿ 48:5788.1
    note: 'اشترطت على النبي ﷺ: أن لا صدقة عليها، ولا جهاد ... سيتصدقون ويجاهدون إذا أسلموا'
  - motif: leper-pledge-taken-at-a-distance
    refs:
    - Jāmiʿ 48:5789.1
    note: 'كان في وفد ثقيف رجل مجذوم فأرسل إليه النبي ﷺ: إنا قد بايعناك فارجع'
  hints:
  - The leper kept outside the camp (Lev 13:46; Num 5:2-3) against the leper of Thaqif whose pledge is accepted by message without his coming near.
- id: hadith-48-qaylas-journey
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Qayla flees her husband's brother with her daughter; omens of hare and fox, the camel's shivering cured by turning clothes inside out; she prays in the men's row; 'O poor woman, be calm'; al-Dahna
    denied to Hurayth
  read:
  - Jāmiʿ 48:5790.1
  quran: []
  tags:
  - motif: hare-and-fox-crossing-as-omens
    refs:
    - Jāmiʿ 48:5790.1
    note: 'إذ انتفجت الأرنب، فقالت الحديباء القَصِيّة: والله لا يزال كعبك أعلى من كعب أثؤب ... ثم سنح الثعلب'
  - motif: spell-broken-by-turning-clothes-inside-out
    refs:
    - Jāmiʿ 48:5790.1
    note: 'إذ برك الجمل، فأخذته رعدة، فقالت الحديباء: أدركتك والأمانةِ أَخْذةُ أثؤب ... اقلبي ثيابك ظهورها لبطونها، وادَّحرجي ظهرك لبطنك، واقلبي أحلاس جملك ... فلما فعلت ما أمرتني به انتفض الجمل'
  - motif: uncle-seizes-orphan-girls-with-sword
    refs:
    - Jāmiʿ 48:5790.1
    note: 'فإذا أثؤب يسعى وراءنا بالسيف صلتًا ... فأصابت ظبته طائفة من قروني، ثم قال: ألقي إلي بنت أخي يا دفار'
  - motif: woman-in-mens-row-sent-back
    refs:
    - Jāmiʿ 48:5790.1
    note: فصففت مع الرجال ... امرأة أنتِ أم رجل؟ ... إنك قد كدت تفتنيني، فصلِّي مع النساء وراءك
  - motif: prophet-in-worn-saffron-rags-with-palm-stalk
    refs:
    - Jāmiʿ 48:5790.1
    note: وعليه ... أسمال ملببتين كانتا بزعفران فقد نفضتا، ومعه عسيب نخلة مقشور غير خوصتين من أعلاه، وهو قاعد القرفصاء
  - motif: visitor-trembles-at-humble-prophet
    refs:
    - Jāmiʿ 48:5790.1
    note: فلما رأيت رسول الله ﷺ متخشعًا في الجلسة أرعدتُ من الفرق ... يا مسكينة عليك السكينة
  - motif: grant-of-pasture-revoked-on-womans-objection
    refs:
    - Jāmiʿ 48:5790.1
    note: يا غلام، اكتب له بالدهناء ... إنما هذه الدهناء عندك مقيد الجمل ومرعى الغنم ... أمسك يا غلام، صدقت المسكينة، المسلم أخو المسلم، يسعهما الماء والشجر
  - motif: proverb-sheep-carries-its-death-in-its-hooves
    refs:
    - Jāmiʿ 48:5790.1
    note: 'كنتُ أنا وأنت كما قيل: حتفها تحمل ضأن بأظلافها'
  - motif: do-not-torment-the-dead-by-weeping
    refs:
    - Jāmiʿ 48:5790.1
    note: إن أحيدكم ليبكي فيستعبر إليه صويحبه، فيا عباد الله لا تعذبوا إخوانكم
  - motif: charter-on-red-leather-women-not-forced-to-marry
    refs:
    - Jāmiʿ 48:5790.1
    note: 'وكتب لها في قطعة من أديم أحمر لقيلة وللنسوة بنات قيلة: أن لا يظلمن حقًا، ولا يكرهن على منكح'
- id: hadith-48-laqit-and-the-hundred-sheep
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Laqit's delegation - a flock kept at a hundred, a sheep slaughtered for each lamb born; the sharp-tongued wife; ablution between the fingers
  read:
  - Jāmiʿ 48:5793.1
  quran: []
  tags:
  - motif: flock-kept-at-a-hundred-slaughter-for-each-birth
    refs:
    - Jāmiʿ 48:5793.1
    note: لا تحسِبَنَّ أنا من أجلك ذبحناها، لنا غنم مائة لا نريد أن تزيد، فإذا ولد الراعي بهمة ذبحنا مكانها شاة
  - motif: do-not-beat-wife-as-you-beat-slave-girl
    refs:
    - Jāmiʿ 48:5793.1
    note: 'إن في لسانها شيئا يعني: البذاء ... فطلِّقْها إذا ... فمرها ... ولا تضرب ظعينتك كضربك أميتك'
  - motif: ablution-thorough-between-fingers-snuffing-unless-fasting
    refs:
    - Jāmiʿ 48:5793.1
    note: أسبغ الوضوء، وخلِّل بين الأصابع، وبالغ في الاستنشاق إلَّا أن تكون صائمًا
- id: hadith-48-the-sayyid-is-god
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: '''You are our lord'' - ''the Lord (al-sayyid) is God''; do not let Satan draw you on'
  read:
  - Jāmiʿ 48:5794.1
  quran: []
  tags:
  - motif: the-lord-is-god-refusal-of-title
    refs:
    - Jāmiʿ 48:5794.1
    note: 'فقلنا: أنت سيدنا، فقال: السيد الله ﵎ ... قولوا بقولكم أو بعض قولكم، ولا يستجرنّكم الشّيطان'
- id: hadith-48-letters-to-kings-and-the-seal
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Letters to Chosroes, Caesar, the Negus and every tyrant; the silver seal made because kings read only sealed letters
  read:
  - Jāmiʿ 48:5796.1-5796.2
  quran: []
  tags:
  - motif: letters-to-every-tyrant
    refs:
    - Jāmiʿ 48:5796.1
    note: كتب إلى كسرى، وإلى قيصر، وإلى النجاشي، وإلى كل جبار. يدعوهم إلى الله تعالى، وليس بالنجاشي الذي صلى عليه
  - motif: ring-made-because-foreign-kings-read-only-sealed-letters
    refs:
    - Jāmiʿ 48:5796.2
    note: 'إنهم لا يقرؤون كتابا إلا أن يكون مختوما، فاتخذ خاتما من فضة ... ونقش فيه: محمد رسول الله'
- id: hadith-48-heraclius-and-abu-sufyan
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Heraclius questions Abu Sufyan point by point and draws the marks of a messenger; the letter with Q 3:64; the star-gazer's 'king of the circumcised'; the doors of the palace at Hims shut on the
    fleeing Romans
  read:
  - Jāmiʿ 48:5797.1
  quran:
  - 3:64
  tags:
  - motif: king-interrogates-enemy-about-the-prophet
    refs:
    - Jāmiʿ 48:5797.1
    note: أيكم أقرب نسبا بهذا الرجل ... أدنوه مني، وقربوا أصحابه فاجعلوهم عند ظهره ... فإن كَذَبَني فكَذِّبوه
  - motif: marks-of-a-true-messenger-by-question
    refs:
    - Jāmiʿ 48:5797.1
    note: فكذلك الرسل تبعث في نسب قومها ... وهم أتباع الرسل ... وكذلك الإيمان حين تخالط بشاشته القلوب ... وكذلك الرسل لا تغدر
  - motif: shame-of-being-reported-a-liar
    refs:
    - Jāmiʿ 48:5797.1
    note: فوالله لولا الحياء من أن يأثروا علي كذبا لكذبت عنه
  - motif: he-will-rule-where-my-feet-stand
    refs:
    - Jāmiʿ 48:5797.1
    note: فسيملك موضع قدمي هاتين ... ولو كنت عنده لغَسَلْتُ عن قدمه
  - motif: accept-islam-and-be-safe-reward-twice
    refs:
    - Jāmiʿ 48:5797.1
    note: أسلم تسلم، يؤتك الله أجرك مرتين، فإن توليت فإن عليك إثم الأريسيين
  - motif: common-word-between-us-and-you
    refs:
    - Jāmiʿ 48:5797.1
    note: يا أهل الكتاب تعالوا إلى كلمة سواء بيننا وبينكم ألا نعبد إلا الله
  - motif: astrologer-king-sees-king-of-the-circumcised
    refs:
    - Jāmiʿ 48:5797.1
    note: وكان هرقل حَزَّاءً ينظر في النجوم ... إني رأيت الليلة حين نظرت في النجوم ملك الختان قد ظهر ... ليس يختتن إلا اليهود
  - motif: courtiers-bolt-like-wild-asses-to-locked-doors
    refs:
    - Jāmiʿ 48:5797.1
    note: ثم أمر بأبوابها فغُلِّقت ... فحاصوا حيصة حمر الوحش إلى الأبواب، فوجدوها قد غُلِّقَت ... إني قلت مقالتي آنفا أختبر بها شدتكم على دينكم
  hints:
  - A star seen at the rise of a new king of the Jews read by those who watch the stars (Matt 2:1-2) against Heraclius reading in the stars that 'the king of the circumcision' has appeared.
- id: hadith-48-caesar-feigns-islam-and-chosroes-tears-the-letter
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The letter thrown on Caesar's carpet; Caesar's feigned conversion tested on his troops; Chosroes tears the letter - 'may they be torn to pieces'; a people ruled by a woman
  read:
  - Jāmiʿ 48:5800.1-5801.1
  quran: []
  tags:
  - motif: letter-bearer-promised-paradise-even-if-not-killed
    refs:
    - Jāmiʿ 48:5800.1
    note: 'من ينطلق بصحيفتي هذه إلى قيصر وله الجنة؟ فقال رجل من القوم: وإن لم أقتل؟ قال: وإن لم تقتل'
  - motif: letter-thrown-on-the-kings-private-carpet
    refs:
    - Jāmiʿ 48:5800.1
    note: قد جعل له بساط لا يمشي عليه غيره، فرمى بالكتاب على البساط وتنحى
  - motif: king-proclaims-conversion-to-test-troops
    refs:
    - Jāmiʿ 48:5800.1
    note: ألا إن قيصر قد اتبع محمدًا ﷺ وترك النصرانية، فأقبل جنده وقد تسلحوا ... وإنما خبركم لينظر كيف صبركم على دينكم
  - motif: false-claim-of-islam-exposed
    refs:
    - Jāmiʿ 48:5800.1
    note: 'وكتب قيصر إلى رسول الله ﷺ: إني مسلم وبعث إليه بدنانير، فقال ...: كذب عدو الله ليس بمسلم، وهو على النصرانية'
  - motif: king-tears-letter-and-is-torn-apart
    refs:
    - Jāmiʿ 48:5800.2
    note: فلما قرأه مزقه ... فدعا عليهم رسول الله ﷺ أن يمزقوا كل ممزق
  - motif: people-ruled-by-a-woman-will-not-prosper
    refs:
    - Jāmiʿ 48:5801.1
    note: 'قد ملكوا عليهم بنت كسرى قال: لن يُفلح قوم ولوا أمرهم امرأة'
  hints:
  - A king who cuts up and burns a prophet's scroll (Jer 36:23-31, Jehoiakim; judgment then pronounced on him) against Chosroes tearing the letter and the prayer that his people be torn to pieces.
- id: hadith-48-muqawqis-and-letters-to-tribes
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The Muqawqis honours the letter and sends clothes, a grey mule and two slave girls, one the mother of Ibrahim; the red-leather letter to Banu Zuhayr; Bakr b. Wa'il find one reader, the 'sons of
    the scribe'
  read:
  - Jāmiʿ 48:5801.2-5803.2
  quran: []
  tags:
  - motif: ruler-of-egypt-sends-gifts-and-two-slave-girls
    refs:
    - Jāmiʿ 48:5801.2
    note: فقَبَّلَ كتابه وأكرم حاطبا ... وأهدى له مع حاطب كسوة وبغلة شهباء بسرجها وجاريتين، إحداهما أم إبراهيم
  - motif: letter-on-red-leather-carried-by-bedouin
    refs:
    - Jāmiʿ 48:5803.1
    note: رجل أشعث الرأس بيده قطعة أديم أحمر ... من محمد رسول الله إلى بنى زهير بن أقيش
  - motif: share-of-the-prophet-and-the-safi
    refs:
    - Jāmiʿ 48:5803.1
    note: وأديتم الخمس من المغنم وسهم النبى ﷺ وسهم الصفي أنتم آمنون بأمان الله ورسوله
  - motif: only-one-man-could-read-the-letter
    refs:
    - Jāmiʿ 48:5803.2
    note: أسلموا تسلموا ... فما وجدنا من يقرؤه إلا رجل من بني ضبيعة، فهم يُسَمون بني الكاتب
