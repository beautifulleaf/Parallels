  - motif: forbidden-to-touch-spring-before-prophet-comes
    refs:
    - Jāmiʿ 48:5726.1
    note: فمن جاءها منكم فلا يمس من مائها شيئا حتى آتي ... فسبهما النبي ﷺ
  - motif: trickle-spring-made-to-gush-by-washing-water
    refs:
