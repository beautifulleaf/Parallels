  tagger: Claude Opus 5.5, reading the Arabic
  title: Fatima weeps and laughs at two secrets; the wife with the longest arm will follow him first
  read:
  - Jāmiʿ 48:5749.1-5749.3
  quran: []
  tags:
  - motif: daughter-weeps-then-laughs-at-two-secrets
    refs:
    - Jāmiʿ 48:5749.1
    note: فسارها بشيء فبكت، ثم دعاها فسارها فضحكت ... أني أول أهل بيته أتبعه فضحكت
  - motif: longest-arm-first-to-follow-him
    refs:
    - Jāmiʿ 48:5749.2
    - Jāmiʿ 48:5749.3
    note: أسرعكن لحاقا بي أطولكن يدا ... فأخذوا قصبة يذرعونها ... أنما كانت طول يدها الصدقة
- id: hadith-48-news-of-mutah-and-hasan-the-peacemaker
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: He announces the deaths of Zayd, Jaʿfar and Ibn Rawaha before the news comes, eyes streaming; 'this son of mine is a sayyid'
  read:
  - Jāmiʿ 48:5750.1-5750.3
  quran: []
  tags:
  - motif: deaths-announced-before-news-arrives
    refs:
    - Jāmiʿ 48:5750.1
    - Jāmiʿ 48:5750.2
    note: نعى جعفرًا، وزيدًا قبل أن يجيء خبرهم، وعيناه تذرفان
  - motif: banner-passes-from-fallen-to-fallen
    refs:
    - Jāmiʿ 48:5750.2
    note: أَخَذَ الرَّايَةَ زَيْدٌ فَأُصِيبَ، ثُمَّ أَخَذَ جَعْفَرٌ فَأُصِيبَ، ثُمَّ أَخَذَ ابْنُ رَوَاحَةَ فَأُصِيبَ ... حَتَّى أَخَذَ الرَّايَةَ سَيْفٌ مِنْ سُيُوفِ اللَّهِ
  - motif: grandson-will-reconcile-two-great-factions
    refs:
    - Jāmiʿ 48:5750.3
    note: إن ابني هذا سيد، ولعل الله أن يصلح به بين فئتين عظيمتين من المسلمين
- id: hadith-48-umayya-foretold-death
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Saʿd tells Umayya b. Khalaf the Prophet said they would kill him; Umayya hobbles his camel at every halt until killed at Badr
  read:
  - Jāmiʿ 48:5751.1
  quran: []
  tags:
  - motif: guest-friends-across-enemy-cities
    refs:
    - Jāmiʿ 48:5751.1
    note: كَانَ أُمَيَّةُ إِذَا مَرَّ بِالْمَدِينَةِ نَزَلَ عَلَى سَعْدٍ، وَكَانَ سَعْدٌ إِذَا مَرَّ بِمَكَّةَ نَزَلَ عَلَى أُمَيَّةَ
  - motif: threat-to-close-the-caravan-road
    refs:
    - Jāmiʿ 48:5751.1
    note: 'لَئِنْ مَنَعْتَنِي هَذَا لأَمْنَعَنَّكَ مَا هُوَ أَشَدُّ عَلَيْكَ مِنْهُ: طَرِيقَكَ عَلَى الْمَدِينَةِ'
  - motif: foretold-death-place-unknown
    refs:
    - Jāmiʿ 48:5751.1
    note: 'إِنَّهُمْ قَاتِلُوكَ. قَالَ: بِمَكَّةَ؟ قَالَ: لَا أَدْرِي'
  - motif: doomed-man-tries-to-avoid-the-march
    refs:
    - Jāmiʿ 48:5751.1
    note: وَاللَّهِ لَا أَخْرُجُ مِنْ مَكَّةَ ... لأَشْتَرِيَنَّ أَجْوَدَ بَعِيرٍ بِمَكَّةَ ... أَخَذَ لَا يَنْزِلُ مَنْزِلًا إِلَّا عَقَلَ بَعِيرَهُ، فَلَمْ يَزَلْ بِذَلِكَ حَتَّى قَتَلَهُ اللَّهُ ﷿ بِبَدْرٍ
  - motif: abu-jahl-shames-the-chief-into-marching
    refs:
    - Jāmiʿ 48:5751.1
    note: إِنَّكَ مَتَى مَا يَرَاكَ النَّاسُ قَدْ تَخَلَّفْتَ وَأَنْتَ سَيِّدُ أَهْلِ الْوَادِي تَخَلَّفُوا مَعَكَ
  hints:
  - A man told by a prophet he will die in a coming battle, who takes precautions yet goes and is killed (1 Kgs 22:17-37, Ahab disguising himself at Ramoth-gilead) against Umayya hobbling his camel at each
    halt to be ready to flee, and killed at Badr.
- id: hadith-48-the-brave-fighter-of-the-fire
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The bravest fighter declared of the people of the Fire; he falls on his sword or stabs himself with an arrow; deeds as they appear to people
  read:
  - Jāmiʿ 48:5752.1-5753.2
  quran: []
  tags:
  - motif: brave-fighter-of-the-fire
    refs:
    - Jāmiʿ 48:5752.1
    - Jāmiʿ 48:5753.1
    - Jāmiʿ 48:5753.2
    note: 'مَا أَجْزَأَ مِنًّا الْيَوْمَ أَحَدٌ كَمَا أَجْزَأَ فُلَانٌ. فَقَالَ ...: أَمَا إِنَّهُ مِنْ أَهْلِ النَّارِ'
  - motif: suicide-by-falling-on-sword-point-between-breasts
    refs:
    - Jāmiʿ 48:5752.1
    note: فَوَضَعَ سَيْفَهُ بِالأَرْضِ وَذُبَابَهُ بَيْنَ ثَدْيَيْهِ، ثُمَّ تَحَامَلَ عَلَى سَيْفِهِ، فَقَتَلَ نَفْسَهُ
  - motif: suicide-with-arrow-from-own-quiver
    refs:
    - Jāmiʿ 48:5753.1
    - Jāmiʿ 48:5753.2
    note: فأهوى بيده إلى كنانته فانتزع منها سهما فانتحر بها
  - motif: companion-shadows-the-man-to-see-the-end
    refs:
    - Jāmiʿ 48:5752.1
    note: أَنَا صَاحِبُهُ أبدًا ... كُلَّمَا وَقَفَ وَقَفَ مَعَهُ، وَإِذَا أَسْرَعَ أَسْرَعَ مَعَهُ
  - motif: deeds-of-paradise-as-they-appear-to-people
    refs:
    - Jāmiʿ 48:5752.1
    note: إِنَّ الرَّجُلَ لَيَعْمَلُ عَمَلَ أَهْلِ الْجَنَّةِ، فِيمَا يَبْدُو لِلنَّاسِ، وَهْوَ مِنَ أَهْلِ النَّارِ
  - motif: god-supports-religion-by-a-wicked-man
    refs:
    - Jāmiʿ 48:5753.1
    note: 'يا بلال، قم فأذن: لا يدخل الجنة إلا مؤمن، وإن الله ليؤيد هذا الدين بالرجل الفاجر'
  hints:
  - Death by falling on one's own sword when wounded in battle (1 Sam 31:4-5, Saul and his armour-bearer) against the wounded fighter who sets the hilt in the ground and the point between his breasts.
- id: hadith-48-poisoned-sheep-and-the-days-in-the-fire
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The poisoned sheep at Khaybar; the Jews admit a false ancestor and a few days in the Fire; 'if you are a prophet it will not harm you'
  read:
  - Jāmiʿ 48:5756.1
  quran: []
  tags:
  - motif: poisoned-sheep-gift-at-khaybar
    refs:
    - Jāmiʿ 48:5756.1
    note: لَمَّا فُتِحَتْ خَيْبَرُ أُهْدِيَتْ لِلنَّبِيِّ ﷺ شَاةٌ فِيهَا سُمٌّ
  - motif: prophet-names-their-true-father
    refs:
    - Jāmiʿ 48:5756.1
    note: 'مَنْ أَبُوكُمْ؟ قَالُوا: فُلَانٌ، فَقَالَ: كَذَبْتُمْ، بَلْ أَبُوكُمْ فُلَانٌ'
  - motif: claim-of-a-short-stay-in-the-fire
    refs:
    - Jāmiʿ 48:5756.1
    note: 'نَكُونُ فِيهَا يَسِيرًا ثُمَّ تَخْلُفُونَا فِيهَا. فَقَالَ ...: اخْسَئُوا فِيهَا'
  - motif: poisoned-sheep-test-of-prophethood
    refs:
    - Jāmiʿ 48:5756.1
    note: أَرَدْنَا إِنْ كُنْتَ كَاذِبًا نَسْتَرِيحُ، وَإِنْ كُنْتَ نَبِيًّا لَمْ يَضُرَّكَ
- id: hadith-48-tabuk-wind-and-return
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: '''Now we raid them''; the garden''s yield estimated at ten wasqs; the night wind that carried a man to the mountains of Tayyiʾ; Uhud loves us; the ranking of the Ansar'
  read:
  - Jāmiʿ 48:5756.2-5756.3
  quran: []
  tags:
  - motif: now-we-raid-them
    refs:
    - Jāmiʿ 48:5756.2
    note: الآن نغزوهم، ولا يغزوننا، نحن نسير إليهم
  - motif: prophets-estimate-of-harvest-proves-exact
    refs:
    - Jāmiʿ 48:5756.3
    note: 'وخرصها رسول الله ﷺ عشرة أوسق ... كم بلغ ثمرها؟ فقالت: عشرة أوسق'
  - motif: storm-foretold-man-carried-to-distant-mountains
    refs:
    - Jāmiʿ 48:5756.3
    note: ستهب عليكم الليلة ريح شديدة ... فمن كان له بعير فليشد عقاله فهبت ريح شديدة، فقام رجل فحملته الريح حتى ألقته بجبلي طيء
  - motif: ruler-of-ayla-gifts-white-mule
    refs:
    - Jāmiʿ 48:5756.3
    note: وجاء رسول ابن العلماء، صاحب أيلة ... وأهدى له بغلة بيضاء ... وأهدى له بردا
  - motif: mountain-that-loves-us
    refs:
    - Jāmiʿ 48:5756.3
    note: هذه طابة، وهذا أحد، وهو جبل يحبنا ونحبه
  - motif: ranking-of-the-clans-of-the-ansar
    refs:
    - Jāmiʿ 48:5756.3
    note: إن خير دور الأنصار دار بني النجار، ثم دار بني عبد الأشهل ... وفي كل دور الأنصار خير
- id: hadith-48-dhul-khuwaysira-and-the-kharijites
  tradition: islam
