    refs:
    - Jāmiʿ 48:5742.4
    note: 'خيرنا وابن خيرنا ... فخرج إليهم عبد الله فقال: أشهد ... قالوا: شرنا وابن شرنا'
  - motif: rabbi-calls-him-by-the-name-his-family-gave
    refs:
    - Jāmiʿ 48:5743.1
    note: 'إنما ندعوه باسمه الذي سماه به أهله، فقال رسول الله ﷺ: إن اسمي محمد الذي سماني به أهلي'
  - motif: people-in-darkness-below-the-bridge-when-earth-is-changed
    refs:
    - Jāmiʿ 48:5743.1
    note: 'أين يكون الناس يوم تبدل الأرض غير الأرض والسماوات؟ فقال: هم في الظلمة دون الجسر'
  - motif: poor-emigrants-cross-first
    refs:
    - Jāmiʿ 48:5743.1
    note: 'فمن أول الناس إجازة؟ قال: فقراء المهاجرين'
  - motif: ox-of-paradise-slaughtered-for-the-blessed
    refs:
    - Jāmiʿ 48:5743.1
    note: ينحر لهم ثور الجنة الذي كان يأكل من أطرافها
  - motif: spring-salsabil-drink-of-paradise
    refs:
    - Jāmiʿ 48:5743.1
    note: من عين فيها تسمى سلسبيلا
  hints:
  - The great fish and the ox of the world to come served at the feast of the righteous (b. Bava Batra 74b-75a, Leviathan's flesh and the wild ox; 2 Bar 29:4) against the first food of paradise as the lobe
    of the fish's liver and the ox of paradise that grazed its borders.
  - 'Sex of the child decided by which parent''s seed comes first or prevails (b. Niddah 31a: ''if the woman emits seed first she bears a male'') against ''when the man''s fluid rises over the woman''s,
    they produce a male'', the reverse assignment.'
- id: hadith-48-the-earth-casts-out-the-apostate
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The apostate scribe who said Muhammad knew only what he wrote; the earth casts him out three times
  read:
  - Jāmiʿ 48:5744.1
  quran: []
  tags:
  - motif: apostate-scribe-claims-he-wrote-the-revelation
    refs:
    - Jāmiʿ 48:5744.1
    note: 'فكان يكتب للنبي ﷺ، فعاد نصرانيا، فكان يقول: ما يدري محمد إلا ما كتبت له'
  - motif: earth-casts-out-the-buried-three-times
    refs:
    - Jāmiʿ 48:5744.1
    note: 'فأصبح وقد لفظته الأرض ... فحفروا له وأعمقوا له في الأرض ما استطاعوا، فأصبح وقد لفظته الأرض، فعلموا: أنه ليس من الناس فألقوه'
- id: hadith-48-the-hijra-and-suraqa
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The noon halt under the rock, milk cooled with water; Suraqa's horse sinks in hard ground at the Prophet's prayer, and he turns back the pursuers
  read:
  - Jāmiʿ 48:5744.2
  quran:
  - '9:40'
  tags:
  - motif: shepherd-milks-for-fugitives-at-noon-rock
    refs:
    - Jāmiʿ 48:5744.2
    note: فإذا أنا براع مقبل بغنمه إلى الصخرة ... انفض الضرع من التراب والشعر والقذى ... فصببت من الماء على اللبن حتى برد أسفله
  - motif: grieve-not-god-is-with-us
    refs:
    - Jāmiʿ 48:5744.2
    note: 'واتبعنا سراقة بن مالك، فقلت: أتينا يا رسول الله، فقال: لا تحزن إن الله معنا'
  - motif: pursuers-horse-sinks-into-hard-ground
    refs:
    - Jāmiʿ 48:5744.2
    note: فدعا عليه النبي ﷺ فارتطمت به فرسه إلى بطنها -أرى- في جلد من الأرض
  - motif: pursuer-turned-protector-sends-others-back
    refs:
    - Jāmiʿ 48:5744.2
    note: 'فادعوا لي، فالله لكما أن أرد عنكما الطلب ... فلا يلقى أحدًا إلا رده، قال: ووفى لنا'
- id: hadith-48-healing-by-touch-and-breath
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Ibn ʿAtik's broken leg made whole by the Prophet's stroke after killing Abu Rafiʿ; Salama's wound breathed on three times
  read:
  - Jāmiʿ 48:5745.1-5746.1
  quran: []
  tags:
  - motif: intruder-hides-in-fortress-and-takes-keys-from-peg
    refs:
    - Jāmiʿ 48:5745.1
    note: ثُمَّ تَقَنَّعَ بِثَوْبِهِ كَأَنَّهُ يَقْضي حَاجَةً ... ثُمَّ عَلَّقَ الأَغَالِيقَ عَلَى وَتَدٍ قَالَ فَقُمْتُ إِلَى الأَقَالِيدِ
  - motif: locks-each-door-behind-him-while-climbing
    refs:
    - Jāmiʿ 48:5745.1
    note: فَجَعَلْتُ كُلَّمَا فَتَحْتُ بَابًا أَغْلَقْتُ عَلَيَّ مِنْ دَاخِلٍ
  - motif: assassin-finds-victim-in-dark-by-calling-his-name
    refs:
    - Jāmiʿ 48:5745.1
    note: 'فَإِذَا هُوَ فِي بَيْتٍ مُظْلِمٍ وَسْطَ عِيَالِهِ ... فَقُلْتُ: يَا أَبَا رَافِعٍ. قَالَ: مَنْ هَذَا؟ فَأَهْوَيْتُ نَحْوَ الصَّوْتِ'
  - motif: sword-point-through-belly-to-back
    refs:
    - Jāmiʿ 48:5745.1
    note: ثُمَّ وَضَعْتُ ضبيب السَّيْفِ فِي بَطْنِهِ حَتَّى أَخَذَ فِي ظَهْرِهِ
  - motif: death-announced-from-wall-at-cockcrow
    refs:
    - Jāmiʿ 48:5745.1
    note: 'فَلَمَّا صَاحَ الدِّيكُ قَامَ النَّاعِي عَلَى السُّورِ فَقَالَ: أَنْعَى أَبَا رَافِعٍ تَاجِرَ أَهْلِ الْحِجَازِ'
  - motif: broken-leg-healed-by-prophets-stroke
    refs:
    - Jāmiʿ 48:5745.1
    note: فَانْكَسَرَتْ سَاقِي، فَعَصَبْتُهَا بِعِمَامَةٍ ... ابْسُطْ رِجْلَكَ فَبَسَطْتُ رِجْلِي، فَمَسَحَهَا، فَكَأَنَّهَا لَمْ أَشْتَكِهَا قَطُّ
  - motif: three-breaths-heal-wound
    refs:
    - Jāmiʿ 48:5746.1
    note: هذه ضربة أصابتني يوم خيبر ... فنفث فيه ثلاث نفثات، فما اشتكيتها حتى الساعة
  hints:
  - Entry by deception, the doors locked behind him and the blade driven into the belly of the enemy alone in his upper chamber (Judg 3:20-25, Ehud and Eglon) against Ibn ʿAtik locking each door from within
    and thrusting the sword-point through the belly to the back.
- id: hadith-48-blessings-on-persons
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Abu Hurayra's spread cloak and never forgetting; ʿAmr b. Akhtab kept handsome past a hundred; al-Saʾib's sound hearing and sight at 94; the shine on Qatada's face
  read:
  - Jāmiʿ 48:5746.2-5747.3
  quran: []
  tags:
  - motif: memory-scooped-into-a-spread-cloak
    refs:
    - Jāmiʿ 48:5746.2
    note: 'ابسط رداءك فبسطت فغرف بيده فيه ثم قال: ضمه فضممت، فما نسيت حديثا بعد'
  - motif: blessing-keeps-hair-dark-past-a-hundred
    refs:
    - Jāmiʿ 48:5747.1
    note: اللهم جمله، وأدم جماله ... فلقد بلغ بضعا ومئة سنة وما في رأسه ولحيته بياض إلا نبذ يسير
  - motif: blessing-keeps-senses-sound-at-ninety-four
    refs:
    - Jāmiʿ 48:5747.2
    note: رأيت السائب بن يزيد ابن أربع وتسعين جلدًا معتدلًا ... ما متعت به -سمعي وبصري- إلا بدعاء رسول الله ﷺ
  - motif: face-stroked-by-prophet-reflects-like-oil
    refs:
    - Jāmiʿ 48:5747.3
    note: 'فمر رجل في أقصى الدار قال: فأبصرته في وجه قتادة ... كأن على وجهه الدهان ... وكان رسول الله ﷺ مسح على وجهه'
  hints:
  - The face that shines after contact with the holy (Exod 34:29-35, Moses's skin of the face shining, qaran ʿor panav) against Qatada's face, stroked by the Prophet, in which a man across the house could
    be seen as in oil.
- id: hadith-48-spittle-heals-ali-and-amr
  tradition: islam
  corpus: hadith
  original: true
