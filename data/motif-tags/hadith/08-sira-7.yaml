  - motif: rinse-water-poured-into-dry-well-refills-it
    refs:
    - Jāmiʿ 48:5725.2
    note: فَجَلَسَ عَلَى شَفِيرِهَا، ثُمَّ دَعَا بِإِنَاءٍ مِنْ مَاءٍ فَتَوَضَّأَ ثُمَّ مَضْمَض وَدَعَا، ثُمَّ صبَّهُ فِيهَا ... ثُمَّ إِنَّهَا أَصْدَرَتْنَا مَا شِئْنَا
  - motif: joining-prayers-on-campaign
    refs:
    - Jāmiʿ 48:5726.1
