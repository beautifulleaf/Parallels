  - motif: greatest-sorcerer-or-truly-gods-messenger
    refs:
    - Jāmiʿ 48:5724.1
    note: إنه لأسحر الناس من بين هذه وهذه ... أو إنه لرسول الله حقا
  - motif: spared-clan-follows-woman-into-islam
    refs:
    - Jāmiʿ 48:5724.1
    note: ولا يصيبون الصِّرم الذي هي منه ... فهل لكم في الإسلام؟ فأطاعوها
  hints:
