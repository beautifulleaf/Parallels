  - motif: spittle-heals-sore-eyes
    refs:
    - Jāmiʿ 48:5748.1
    - Jāmiʿ 48:5748.2
    note: يشتكي عينيه، فدعا له فبرأ؛ ما رمدت ولا صدعت منذ مسح رسول الله ﷺ وجهي، وتفل في عيني يوم خيبر
  - motif: severed-leg-healed-by-spittle
    refs:
    - Jāmiʿ 48:5748.3
    note: تفل في رِجْلِ عمرو بن معاذ حين قطعت رجله فبرأ
- id: hadith-48-foretold-deaths-in-his-house
  tradition: islam
