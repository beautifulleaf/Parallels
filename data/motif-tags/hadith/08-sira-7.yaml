- id: hadith-48-india-and-the-camel-that-knows
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: An expedition to Sind and India - Abu Hurayra 'the freed from the Fire'; the savage camel kneels, and everything between heaven and earth knows him but rebel jinn and men
  read:
  - Jāmiʿ 48:5768.1-5768.2
  quran: []
  tags:
  - motif: expedition-to-sind-and-hind
    refs:
    - Jāmiʿ 48:5768.1
    note: يكون في هذه الأمة بعث إلى السند والهند ... رجعت وأنا أبو هريرة المحرر قد أعتقني من النار
  - motif: savage-camel-kneels-before-the-prophet
    refs:
    - Jāmiʿ 48:5768.2
    note: إذا فيه جمل لا يدخل الحائط أحد إلا شد عليه ... فجاء واضعًا مشفره إلى الأرض، حتى برك بين يديه
  - motif: all-creation-knows-him-but-rebel-jinn-and-men
