  - motif: last-sermon-with-greasy-black-headband
    refs:
    - Jāmiʿ 48:5763.1
    note: في مرضه الذي مات فيه، بملحفة، قد عصب بعصابة دسماء ... فكان ذلك آخر مجلس جلس فيه
