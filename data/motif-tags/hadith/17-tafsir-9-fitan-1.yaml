# Hadith chunk 17: al-Jāmiʿ al-Kāmil book 60 (tafsir, suras 96-114), pp. 7660-7706, and book 65 (al-Fitan wa-Ashrat al-Sa'a), pp. 8342-8414.
# Read in full from the Arabic (236 hadith).
new_motifs:
  i-am-not-a-reader:
    label: Told 'recite!' by the angel, the prophet answers three times 'I am not a reader' (ma ana bi-qari')
    cluster: revelation
  revelation-pauses-after-first-vision:
    label: After the first revelation and Waraqa's death revelation pauses for a time (fatra) and the prophet grieves
    cluster: revelation
  assailant-recoils-from-trench-of-fire-and-wings:
    label: 'The enemy approaching the praying prophet recoils on his heels, shielding himself with his hands: between them a trench of fire, terror and wings'
    cluster: angels
  angels-would-snatch-him-limb-by-limb:
    label: Had he come near, the angels would have snatched him limb by limb
    cluster: angels
  threefold-did-i-not-forbid-you:
    label: 'The enemy rebukes the praying prophet three times: ''did I not forbid you this?''; the prophet rebuffs him'
    cluster: sira
  prostrating-in-water-and-mud-as-sign:
    label: Shown the Night of Decree, the prophet sees himself prostrating in water and mud as its sign
    cluster: dreams
  standing-night-of-decree-forgives-past-sins:
    label: Whoever stands (in prayer) the Night of Decree in faith and hope of reward is forgiven his past sins
    cluster: ritual
  god-names-companion-for-recitation:
    label: 'God commands the prophet to recite a sura to a named companion: ''did he name me to you?'' - ''yes''; ''was I mentioned before the Lord of the worlds?'''
    cluster: revelation
  companion-weeps-on-being-named-by-god:
    label: The companion weeps (his eyes overflow) on learning God named him
    cluster: sira
  son-of-adam-would-seek-third-valley-only-dust-fills:
    label: Given one valley of wealth, the son of Adam would ask a second and a third; only dust fills his belly; God turns to whoever repents
    cluster: ethics
  religion-with-god-is-hanifiyya-not-jewish-nor-christian:
    label: 'A recited passage: the religion with God is the hanifiyya, not associating, not Jewish, not Christian'
    cluster: polemic
  old-man-asks-for-comprehensive-sura:
    label: An aged man, his heart hardened and tongue thick, refuses the long sura groups and asks for one comprehensive sura; he is taught al-Zalzala
    cluster: ritual
  will-add-nothing-to-it:
    label: He swears he will add nothing to it; the prophet twice says 'the little man has prospered'
    cluster: ethics
  trim-hair-nails-moustache-as-complete-sacrifice:
    label: 'One with no animal but his son''s lent milch-beast is told to cut his hair, clip nails, trim moustache and shave pubes: that completes his sacrifice'
    cluster: ritual
  same-sura-in-both-rakas-of-dawn:
    label: The prophet recites al-Zalzala in both rakas of the dawn prayer; the hearer cannot tell if by forgetting or on purpose
    cluster: ritual
  earth-vomits-pieces-of-its-liver-gold-and-silver:
    label: The earth vomits the pieces of its liver, columns of gold and silver
    cluster: eschatology
  killer-severer-thief-each-says-for-this-i:
    label: The killer, the severer of kin and the thief each come and say 'for this I killed / cut my kin / had my hand cut', and leave it untouched
    cluster: eschatology
  only-wealth-eaten-worn-or-given-is-yours:
    label: The son of Adam says 'my wealth, my wealth'; his only wealth is what he ate and consumed, wore and wore out, or gave and sent ahead
    cluster: ethics
  disputes-of-this-world-resumed-before-god:
    label: 'Asked whether worldly disputes will be resumed before God at the resurrection: ''yes'''
    cluster: eschatology
  ripe-dates-and-water-are-bliss-asked-about:
    label: 'Fresh dates and water after a hard-won harvest: ''this is of the bliss you will be asked about'''
    cluster: ethics
  hunger-drives-three-out-at-midday:
    label: Abu Bakr and Umar, then the prophet, are driven from their houses by hunger at an odd hour; they go together to an Ansari's house
    cluster: sira
  do-not-slaughter-the-milch-animal:
    label: 'The host taking his knife is told: ''beware of the milking animal; do not slaughter one with milk'''
    cluster: ethics
  you-will-be-asked-about-this-bliss:
    label: 'After hunger and a full meal: ''by him in whose hand is my soul you will be asked about this bliss on the day of resurrection'''
    cluster: eschatology
  asked-about-all-but-rag-morsel-and-hole:
    label: 'Everything will be asked about except three: a rag covering nakedness, a crust stopping hunger, a hole sheltering from heat and cold'
    cluster: eschatology
  bismillah-before-and-praise-after-eating:
    label: At food say 'in God's name'; when sated 'praise God who sated us and favoured us'
    cluster: ritual
  prophet-sends-share-to-fatima:
    label: At a feast the prophet puts meat in a loaf for Fatima, who has not had its like for days
    cluster: sira
  host-repaid-with-slave-girl-whom-he-frees:
    label: The prophet repays his host next day with a slave girl, 'treat her well'; the host frees her
    cluster: ethics
  elephants-driver-and-groom-blind-beggars-in-mecca:
    label: Aisha saw the elephant's driver and groom in Mecca, blind and crippled, begging food
    cluster: sira
  quraysh-favoured-with-seven-traits:
    label: God favoured Quraysh with seven traits, among them ten years when only Qurashis worshipped him, victory at the Elephant while polytheists, and a sura about them alone
    cluster: sira
  kawthar-banks-domes-of-hollow-pearl:
    label: Al-Kawthar's two banks are domes of hollowed pearl
    cluster: eschatology
  sura-revealed-in-a-doze-prophet-smiles:
    label: 'The prophet dozes among them, raises his head smiling: ''a sura was just sent down to me'''
    cluster: revelation
  basin-vessels-numbered-as-the-stars:
    label: The basin's vessels are as many as the stars
    cluster: eschatology
  man-pulled-away-from-basin-you-know-not-what-he-innovated:
    label: A man of his community is pulled away from the basin; 'Lord, he is of my community' - 'you do not know what he innovated after you'
    cluster: eschatology
  kawthar-is-the-abundant-good:
    label: 'Ibn Abbas: al-Kawthar is the good God gave him; the river in paradise is part of that good'
    cluster: revelation
  jewish-leader-judges-pagans-better-guided:
    label: Asked by Quraysh, a Jewish leader judges them better than the prophet, and verses come down
    cluster: polemic
  kafirun-and-ikhlas-in-two-rakas-of-dawn:
    label: Al-Kafirun and al-Ikhlas recited in the two rakas before the dawn prayer (and after sunset)
    cluster: ritual
  kafirun-reciter-freed-from-shirk-ikhlas-reciter-forgiven:
    label: 'Hearing one man recite al-Kafirun: ''he is freed of associating''; another al-Ikhlas: ''he is forgiven'''
    cluster: ritual
  kafirun-at-sleep-then-sleep-on-its-end:
    label: 'Recite al-Kafirun at bedtime and sleep on its close: it is disavowal of associating'
    cluster: ritual
  prophet-places-child-with-foster-father:
    label: 'The prophet hands Umm Salama''s daughter to a man: ''you are her foster-father'''
    cluster: sira
  tribes-waited-on-conquest-of-mecca-to-convert:
    label: 'The Arab tribes delayed Islam awaiting the conquest: ''if he prevails over his people he is a true prophet'''
    cluster: sira
  glory-praise-forgive-formula-in-bowing:
    label: After al-Nasr the prophet says in bowing and prostration 'glory be to you our Lord and praise; O God forgive me', 'interpreting the Quran'
    cluster: ritual
  lord-told-him-of-a-sign-in-his-community:
    label: '''My Lord told me I would see a sign in my community; when I saw it I should glorify and ask forgiveness'''
    cluster: revelation
  caliph-tests-elders-with-youths-tafsir:
    label: Umar seats a youth with the old Badr veterans and tests them on a sura; only the youth reads it as the prophet's death notice
    cluster: sira
  woman-with-stone-cannot-see-the-prophet:
    label: 'The hostile woman comes with a stone in her hand but does not see the prophet sitting beside his companion: ''she will not see me'''
    cluster: miracle
  mudhammam-we-reject:
    label: 'The enemy woman''s rhyme: ''Mudhammam we reject, his religion we hate, his command we disobey''; stumbling she says ''perish Mudhammam'''
    cluster: polemic
  polytheists-ask-gods-lineage:
    label: The polytheists ask 'give us your Lord's lineage' and al-Ikhlas is revealed
    cluster: revelation
  what-is-born-dies-what-dies-is-inherited:
    label: Nothing born but will die, nothing dies but is inherited; God neither dies nor is inherited
    cluster: theology
  love-of-ikhlas-earns-gods-love-and-paradise:
    label: A man who loves al-Ikhlas because 'it is the description of the Merciful' is told God loves him; 'your love of it brings you into paradise'
    cluster: ritual
  imam-joins-ikhlas-to-every-raka:
    label: An imam opens every raka with al-Ikhlas and then adds another sura; his people object, the prophet approves
    cluster: ritual
  chose-meal-with-prophet-over-giving-good-news:
    label: A companion delays bringing a man good news for fear of missing his meal with the prophet, and finds him gone
    cluster: sira
  ikhlas-equals-third-of-quran:
    label: Al-Ikhlas equals one third of the Quran; God divided the Quran into three parts
    cluster: revelation
  man-repeats-one-sura-all-night:
    label: A man repeats al-Ikhlas through the night adding nothing; another thinks it little
    cluster: ritual
  assemble-i-will-recite-a-third:
    label: '''Gather, I will recite a third of the Quran to you''; he recites al-Ikhlas and goes in; they think news came from heaven'
    cluster: revelation
  verses-revealed-tonight-none-like-them:
    label: '''Verses were sent down tonight whose like was never seen'': the two refuge suras'
    cluster: revelation
  say-said-three-times-then-the-suras:
    label: '''Say!'' - ''what shall I say?'' three times, then the refuge suras; ''no asker asked and no seeker of refuge sought refuge with their like'''
    cluster: revelation
  sura-dearer-to-god-than-hud-and-yusuf:
    label: Asking to be taught Hud and Yusuf, he is told no sura is dearer or more effective with God than al-Falaq
    cluster: ritual
  it-was-said-to-me-so-i-said:
    label: 'On the refuge suras: ''it was said to me (qul), so I said''; ''we say as the prophet said'''
    cluster: revelation
  prophet-leads-camel-companion-rides:
    label: The prophet offers his mount to the companion leading it, dismounts, lets him ride a little, then rides again
    cluster: sira
  gabriel-recites-ruqya-over-sick-prophet:
    label: Gabriel asks 'are you ill?' and recites the charm 'in God's name I charm you from all that harms you, every soul and envious eye'
    cluster: angels
  prophets-jinn-companion-submitted:
    label: The prophet's jinn companion submitted (aslama) and commands only good
    cluster: demonology
  satan-swells-at-curse-shrinks-to-fly-at-gods-name:
    label: 'Say not ''Satan stumbled'': he swells and says ''by my strength I threw him''; at ''in God''s name'' he shrinks until like a fly'
    cluster: demonology
  trials-like-pieces-of-dark-night:
    label: Trials like pieces of the dark night before the Hour
    cluster: prophecy
  believer-at-morning-unbeliever-at-evening:
    label: In the trials a man is a believer at morning and an unbeliever by evening, and the reverse
    cluster: prophecy
  sells-religion-for-worldly-goods:
    label: He sells his religion for a thing of this world
    cluster: prophecy
  happy-is-he-spared-trials-thrice:
    label: '''The happy one is he who is spared trials'' said three times, ''and he who is tried and endures: waha!'''
    cluster: prophecy
  refuge-from-trials-outward-and-inward:
    label: '''Seek refuge in God from trials, what shows of them and what is hidden'', and from the Dajjal''s trial; the hearers repeat it'
    cluster: ritual
  sheep-led-to-peaks-fleeing-with-religion:
    label: Soon a Muslim's best wealth will be sheep he follows to mountain peaks and rain-places, fleeing with his religion from trials
    cluster: prophecy
  best-man-fighter-or-hermit-in-mountain-pass:
    label: 'The best people: one who strives with self and wealth, and a man in a mountain pass worshipping his Lord and sparing people his evil'
    cluster: ethics
  every-age-worse-than-the-one-before:
    label: No age comes but the one after it is worse, until you meet your Lord
    cluster: prophecy
  hold-to-it-gesture-grasping-carpet:
    label: 'Asked what to do in a coming trial the prophet grips the carpet: ''do like this''; ''return to your first affair'''
    cluster: prophecy
  leaving-tenth-perishes-holding-tenth-saves:
    label: 'Now, many learned and few orators: who leaves a tenth of what he knows perishes; later, few learned and many orators: who holds a tenth is saved'
    cluster: prophecy
  end-time-liars-bring-unheard-reports:
    label: 'At the end of time lying deceivers bring reports neither you nor your fathers heard: beware of them'
    cluster: prophecy
  hudhayfa-asked-about-evil-others-about-good:
    label: People asked the prophet about good; Hudhayfa asked about evil for fear it would overtake him
    cluster: prophecy
  good-with-smoke-in-it:
    label: 'After the evil comes good with smoke (dakhan) in it: people guiding by other than his guidance, some you know and some you reject'
    cluster: prophecy
  callers-at-gates-of-hell-of-our-own-skin:
    label: Callers at the gates of hell who throw in whoever answers them, of our own skin and speaking our tongues
    cluster: prophecy
  withdraw-biting-tree-root-until-death:
    label: With no community or imam, leave all the sects even if you bite on a tree root until death finds you
    cluster: prophecy
  dies-without-pledge-dies-jahiliyya-death:
    label: Whoever withdraws his hand from obedience meets God without argument; whoever dies with no pledge on his neck dies a jahiliyya death
    cluster: law
  satan-with-the-one-farther-from-two:
    label: Satan is with the one alone and further from two; whoever wants paradise's midst keeps to the community
    cluster: ethics
  satan-third-with-man-and-woman-alone:
    label: 'Let no man be alone with a woman: Satan is the third of them'
    cluster: ethics
  testimony-volunteered-before-asked:
    label: After three generations lying spreads until a man gives testimony and oath before he is asked
    cluster: prophecy
  sitter-better-than-stander-walker-than-runner:
    label: In the trial the sitter is better than the stander, the stander than the walker, the walker than the one running into it
    cluster: prophecy
  whoever-looks-toward-it-it-draws-in:
    label: Whoever looks out toward the trial it draws him in; whoever finds a refuge, let him take it
    cluster: prophecy
  missed-prayer-like-losing-family-and-wealth:
    label: There is a prayer which, whoever misses it, is as if robbed of his family and wealth
    cluster: ritual
  go-to-your-camels-sheep-or-land:
    label: When the trial falls, let the owner of camels join his camels, of sheep his sheep, of land his land
    cluster: prophecy
  beat-swords-edge-with-a-stone:
    label: One with no camels, sheep or land should beat his sword's edge with a stone and escape; break bows, cut strings
    cluster: prophecy
  forced-into-battle-killer-bears-both-sins:
    label: If forced into a battle-line and killed, the killer bears his own sin and yours and is of the people of the fire
    cluster: law
  be-like-the-better-son-of-adam:
    label: If one enters on you to kill you, be like the (better) son of Adam
    cluster: prophecy
  thrice-did-i-convey:
    label: '''O God, have I conveyed?'' said three times'
    cluster: sira
  sword-of-wood-in-time-of-strife:
    label: 'A companion charged to take a sword of wood in strife between Muslims shows it: ''this is my sword'''
    cluster: prophecy
  break-sword-on-uhud-or-biggest-rock:
    label: Take your sword to Uhud (or the greatest rock of the Harra) and strike until it breaks
    cluster: prophecy
  sit-at-home-until-sinful-hand-or-fated-death:
    label: Then sit in your house until a sinful hand or a fated death comes to you
    cluster: prophecy
  withdraw-room-to-inner-room-then-kneel:
    label: If entered upon, go to your inner room; if entered there, kneel and say 'bear my sin and yours'
    cluster: prophecy
  trials-butt-like-bulls-foreheads:
    label: Trials strike a man as the foreheads of stallion bulls butt
    cluster: prophecy
  be-gods-slain-servant-not-the-killer:
    label: Hold your hands; be God's slain servant, not God's killing servant; stay in your houses and keep yourselves unknown
    cluster: ethics
  fight-polytheists-until-swords-clash-among-muslims:
    label: 'Given a sword: fight the polytheists while they fight, but when two swords clash between Muslims strike it until it notches'
    cluster: prophecy
  sleeper-to-galloper-graded-ladder:
    label: 'A seven-step ladder in the trial: sleeper, reclining, sitting, standing, walking, riding, galloping, each better than the next; all its slain in the fire'
    cluster: prophecy
  harj-when-none-trusts-his-sitting-companion:
    label: 'The days of harj: when a man does not trust the one sitting with him'
    cluster: prophecy
  house-room-then-mosque-gripping-wrist:
    label: Withdraw to house, then room, then your place of prayer, grip your wrist with your right hand and say 'my Lord is God' until death
    cluster: prophecy
  famine-plague-and-slaughter-three-questions:
    label: 'Three questions: a famine too weak to rise for prayer (be abstinent), a plague when a grave costs a slave (be patient), killing that drowns the stones of al-Zayt in blood (stay home)'
    cluster: prophecy
  cast-cloak-over-face-against-sword-glint:
    label: If the glint of the sword frightens you, throw the edge of your cloak over your face, that he bear your sin and his
    cluster: prophecy
  holding-religion-like-grasping-thorns-or-embers:
    label: The one who holds his religion then is like one gripping thorny branches or embers of ghada wood
    cluster: prophecy
  worship-in-harj-like-hijra:
    label: Worship in the time of tumult (harj) is like emigration to me
    cluster: ritual
  told-from-creation-until-people-enter-their-abodes:
    label: Standing among them he told from the beginning of creation until the people of paradise and of hell entered their abodes
    cluster: prophecy
  did-not-ask-what-drives-medinans-out:
    label: Hudhayfa asked about all that will be except what will drive the people of Medina out of it
    cluster: prophecy
  three-trials-leave-nothing-others-like-summer-winds:
    label: Of the trials three leave almost nothing standing; others are like summer winds, small and large
    cluster: prophecy
  household-trial-expiated-by-prayer-fast-alms:
    label: A man's trial in family, wealth, self, child and neighbour is expiated by fasting, prayer, alms, commanding good and forbidding wrong
    cluster: ethics
  trial-surging-like-the-sea:
    label: The trial that surges like the waves of the sea
    cluster: prophecy
  closed-door-broken-not-opened-is-umar:
    label: Between Umar and the great trial is a closed door that will be broken, not opened, never to close again; the door is Umar, a man killed or dying
    cluster: prophecy
  trust-descended-into-root-of-hearts:
    label: Trust (al-amana) came down into the root of men's hearts, then the Quran came down
    cluster: prophecy
  trust-taken-in-sleep-leaving-blister:
    label: In sleep trust is taken from the heart, leaving a spot, then a blister like an ember rolled on the foot, swollen with nothing inside
    cluster: prophecy
  one-trustworthy-man-in-a-clan:
    label: People trade but hardly one fulfils trust, until it is said 'in such a clan is a trustworthy man'; one praised as clever has not a mustard seed of faith
    cluster: prophecy
  rulers-with-hearts-of-devils-in-human-bodies:
    label: Rulers will arise with hearts of devils in human bodies; hear and obey even if your back is struck
    cluster: prophecy
  learn-gods-book-said-three-times:
    label: 'Asked of coming evil: ''Hudhayfa, learn God''s Book and follow what is in it'', three times'
    cluster: ethics
  mudar-humbled-till-it-cannot-defend-a-gully:
    label: This clan of Mudar leaves no righteous servant unharmed until God humbles it so it cannot defend the bottom of a gully
    cluster: prophecy
  prophethood-caliphate-biting-kingship-tyranny:
    label: Prophethood, then caliphate on its pattern, then biting kingship, then tyrannical kingship, then caliphate on the pattern of prophethood
    cluster: prophecy
  islam-effaced-like-garment-embroidery-quran-taken-in-a-night:
    label: Islam wears away like a garment's embroidery until fast, prayer and alms are unknown; the Book is taken away in one night, not a verse left on earth
    cluster: eschatology
  old-people-keep-only-la-ilaha-illa-allah:
    label: Old men and women remain saying only 'we found our fathers on this word, there is no god but God'; it saves them from the fire
    cluster: eschatology
  truce-on-smoke-remnant-on-motes:
    label: 'After the sword: a remnant upon motes and a truce upon smoke; hearts do not return to what they were'
    cluster: prophecy
  hour-before-a-foal-is-born:
    label: If a man had a mare foaling it would not foal before the Hour came
    cluster: eschatology
  blood-will-be-shed-oath-against-oath:
    label: Two men trade oaths 'blood will be shed here today' - 'no, by God', three times; the one who knew was Hudhayfa
    cluster: sira
  revolt-returns-without-a-cupping-of-blood:
    label: The revolt will turn back without a cupping-glass of blood shed; the one who fights today God kills tomorrow, his heart upturned
    cluster: prophecy
  twelve-hypocrites-among-companions:
    label: Among my companions (community) are twelve hypocrites
    cluster: prophecy
  ulcer-of-fire-emerging-from-chest:
    label: 'Eight of them the dubayla suffices: a lamp of fire appearing between their shoulders until it bursts from their chests'
    cluster: eschatology
  hypocrisy-now-open-unbelief:
    label: Hypocrisy was in the prophet's time; today it is unbelief after faith; then they concealed, now they declare
    cluster: polemic
  twenty-seven-liars-four-women:
    label: In my community are twenty-seven liars and deceivers, four of them women; I am the seal of the prophets
    cluster: prophecy
  people-will-wish-for-the-dajjal:
    label: A time will come when my community wishes for the Dajjal, from the misery they meet
    cluster: eschatology
  dajjals-water-is-fire-and-fire-water:
    label: 'The Dajjal brings water and fire: what looks like water burns, what looks like fire is cool sweet water; fall into it, close your eyes, bow your head and drink'
    cluster: eschatology
  dajjal-eye-wiped-with-thick-film:
    label: The Dajjal's eye is wiped out with a thick film over it; blind in the left eye, with thick hair
    cluster: eschatology
  lesser-trials-feared-more-than-dajjal:
    label: Your trials among yourselves I fear more than the Dajjal's; whoever survives the trials before it survives it
    cluster: eschatology
  dajjal-with-river-and-fire-reward-reversed:
    label: Whoever falls into the Dajjal's fire is rewarded and freed of sin; whoever falls into his river bears sin and loses reward
    cluster: eschatology
  deed-like-vessel-good-top-good-bottom:
    label: 'A deed is like a vessel: if its top is good its bottom is good, if its top is foul its bottom is foul'
    cluster: ethics
  treasures-and-trials-sent-down-in-a-night:
    label: 'Waking alarmed at night: ''glory to God, what treasures and what trials have been sent down!'''
    cluster: prophecy
  wake-the-women-of-the-chambers-to-pray:
    label: '''Who will wake the women of the chambers'', that they pray'
    cluster: sira
  clothed-in-world-naked-in-hereafter:
    label: Many a woman clothed in this world is naked in the hereafter
    cluster: eschatology
  millstone-of-islam-turns-thirty-five-years:
    label: The millstone of Islam turns for thirty-five, thirty-six or thirty-seven years; if they stand, seventy years
    cluster: prophecy
  islam-enters-houses-god-wills-good-for:
    label: Islam enters any house, Arab or non-Arab, for which God wills good
    cluster: prophecy
  trials-like-canopies:
    label: Then trials fall like overhanging canopies (zulal)
    cluster: prophecy
  return-as-black-serpents-pouring:
    label: You will return in them as black serpents striking downward, one striking another's neck
    cluster: prophecy
  trials-of-ahlas-sarra-and-duhayma:
    label: 'Three trials named: the saddle-cloths (flight and plunder), prosperity (its smoke from under a false claimant of the house), and the black one that slaps everyone'
    cluster: prophecy
  people-settle-on-man-like-hip-on-rib:
    label: People agree on a man like a hip set on a rib (an ill fit)
    cluster: prophecy
  two-tents-of-faith-and-hypocrisy-then-dajjal:
    label: People divide into two camps, faith without hypocrisy and hypocrisy without faith; then await the Dajjal that day or the next
    cluster: eschatology
  sees-trials-falling-on-houses-like-rain:
    label: 'Looking from a fortress of Medina: ''I see trials falling among your houses like rain falling'''
    cluster: prophecy
  every-prophet-bound-to-warn-his-people:
    label: Every prophet before was bound to show his people the best he knew and warn them of the worst
    cluster: prophecy
  community-wellbeing-at-start-trial-at-end:
    label: This community's wellbeing was put in its beginning; its end will meet affliction
    cluster: prophecy
  each-trial-makes-the-previous-seem-slight:
    label: A trial comes that makes the one before seem thin; the believer says 'this is my ruin', then 'this, this'
    cluster: prophecy
  strike-neck-of-second-claimant:
    label: Obey the imam you pledged your hand and heart to; if another contends, strike the other's neck
    cluster: law
  do-not-revert-striking-each-others-necks:
    label: '''Do not become unbelievers (or strayers) after me, striking one another''s necks'''
    cluster: prophecy
  first-of-you-to-die-followed-in-groups:
    label: '''You think I will be the last of you to die? I am among the first; you will follow me in scattered groups destroying one another'''
    cluster: prophecy
  killer-and-killed-both-in-fire:
    label: 'When two Muslims meet with swords killer and killed are in the fire: ''he was eager to kill his fellow'''
    cluster: law
  advised-to-turn-back-from-civil-war:
    label: Going to aid a side in civil war, a man is told by a companion 'go back' and the reason
    cluster: sira
  sword-once-laid-never-lifted:
    label: When the sword is laid in my community it will not be lifted from it until the day of resurrection
    cluster: prophecy
  killing-suffices-for-my-companions:
    label: Killing suffices for my companions (as their expiation)
    cluster: prophecy
  gap-opened-in-gog-and-magog-barrier:
    label: Today a gap like this was opened in the barrier of Gog and Magog, shown with a ring of the fingers
    cluster: eschatology
  wakes-red-faced-saying-woe-to-arabs:
    label: The prophet wakes red-faced saying 'there is no god but God, woe to the Arabs from an evil drawn near'
    cluster: prophecy
  perish-with-righteous-among-them-when-filth-abounds:
    label: '''Shall we perish with the righteous among us?'' - ''yes, when filth abounds'''
    cluster: prophecy
  blind-deaf-dumb-trial-woe-to-runner:
    label: A trial blind, deaf and dumb; woe to the one who runs in it, from God on the day of resurrection
    cluster: prophecy
  factions-fight-only-for-the-world:
    label: 'A companion angered at all the factions: God raised you from abasement by Islam; the one in Syria fights only for the world'
    cluster: sira
  gatekeeper-admits-three-with-glad-tidings-of-paradise:
    label: A companion makes himself the prophet's doorkeeper and admits three in turn, each with 'give him glad tidings of paradise'
    cluster: sira
  legs-dangled-in-well-seating-order:
    label: The prophet sits on the well's rim with legs dangling in it; the first on his right, the second on his left, the rim full so the third sits facing
    cluster: sira
  paradise-with-an-affliction-for-the-third:
    label: The third is promised paradise 'with an affliction that will strike him'
    cluster: prophecy
  shall-we-write-you-asked-three-times:
    label: Dictating to a scribe the prophet asks a man three times 'shall we write you?'; he sees Umar's name and consents
    cluster: sira
  trial-like-cows-horns-then-rabbits-leap:
    label: A trial at the ends of the earth like cows' horns, then another making the first seem a rabbit's leap
    cluster: prophecy
  follow-the-man-turning-away-uthman:
    label: '''Follow this one'' of a man walking away; turned round by the shoulders he is Uthman'
    cluster: prophecy
  hold-to-the-trustworthy-and-his-companions:
    label: '''Hold to the trustworthy one and his companions'', pointing to Uthman'
    cluster: prophecy
  saved-from-three-my-death-caliphs-killing-dajjal:
    label: 'Whoever is saved from three is saved: my death, the killing of a caliph steadfast in right, and the Dajjal'
    cluster: prophecy
  carries-two-bricks-while-others-carry-one:
    label: Building the mosque, others carry one brick at a time, he carries two; the prophet wipes the dust from his head
    cluster: sira
  calls-them-to-god-they-call-him-to-fire:
    label: He calls them to God and they call him to the fire
    cluster: prophecy
  two-men-dispute-who-killed-him:
    label: Two men dispute before the ruler over a slain man's head, each saying 'I killed him'
    cluster: sira
  obey-father-but-do-not-fight:
    label: Told to obey his father while he lives, a son goes with his side but does not fight
    cluster: ethics
  those-who-brought-him-killed-him:
    label: 'Faced with the prophecy, the ruler answers: ''did we kill him? those who brought him killed him'''
    cluster: polemic
  killer-scruples-at-silver-cup-after-killing:
    label: A man refuses a silver-plated cup, though he speared a famous companion through the gap of his mail
    cluster: ethics
  aisha-his-wife-in-world-and-hereafter:
    label: Though she marched against them, she is your prophet's wife in this world and the next; God tests whom you obey, him or her
    cluster: sira
  prayer-fast-make-yours-seem-small:
    label: You will think your prayer and fast slight beside theirs
    cluster: polemic
  trusted-by-him-in-heaven:
    label: '''Do you not trust me when I am trusted by the one in heaven, news of heaven reaching me morning and evening?'''
    cluster: revelation
  not-ordered-to-bore-into-hearts:
    label: '''I was not commanded to bore into people''s hearts or split their bellies'''
    cluster: law
  would-kill-them-as-thamud-killed:
    label: '''If I reach them I will kill them as Thamud were killed'''
    cluster: polemic
  shaving-as-their-mark:
    label: Their mark is shaving (tahliq, tasbid)
    cluster: polemic
  killed-by-the-party-nearer-truth:
    label: A breakaway band emerges at a split among Muslims and is killed by the party nearer the truth
    cluster: prophecy
  they-come-from-the-east:
    label: They come out from the east (toward Iraq)
    cluster: prophecy
  god-forbid-people-say-i-kill-my-companions:
    label: 'Refusing to kill the man: ''God forbid people say I kill my companions'''
    cluster: sira
  worst-of-creation-blessed-who-kills-them:
    label: They are the worst of creation; blessed is who kills them and whom they kill; killing them earns reward
    cluster: polemic
  young-in-years-foolish-in-mind:
    label: Young in years, foolish in mind, saying the best words of people
    cluster: polemic
  each-horn-cut-off-until-dajjal-in-their-midst:
    label: Each time a generation of them comes out it is cut off, more than twenty times, until the Dajjal comes out in their midst
    cluster: eschatology
  rather-fall-from-sky-than-lie-on-him:
    label: '''To fall from the sky is dearer to me than to say of him what he did not say; but war is deception'''
    cluster: ethics
  dogs-of-the-fire:
    label: They are the dogs of the fire
    cluster: eschatology
  advise-ruler-privately-in-his-house:
    label: Keep to the great mass; if the ruler listens to you go to his house and tell him; if not leave him, you are not more knowing
    cluster: ethics
  who-will-kill-him-praying-man-spared:
    label: '''Who will kill him?'': those sent find him praying (in a circle he drew, or prostrate) and cannot kill him'
    cluster: sira
  killing-him-would-be-first-and-last-trial:
    label: '''Had you killed him it would have been the first trial and the last'''
    cluster: prophecy
  maimed-hand-like-breast-with-hairs:
    label: Among them a man with a stunted hand, upper arm without forearm, its end like a breast-nipple with white hairs
    cluster: prophecy
  word-of-truth-meant-for-falsehood:
    label: 'To the cry ''judgment is God''s alone'': ''a word of truth meant for falsehood'''
    cluster: polemic
  swears-by-lord-of-kaaba-three-times:
    label: Asked if he heard it from the prophet he swears 'yes by the Lord of the Kaaba' three times
    cluster: sira
  body-found-after-search-in-ruin:
    label: 'The marked man is not found; ''I did not lie nor was lied to''; found in a ruin (beneath the dead) and brought: ''God spoke truly'''
    cluster: prophecy
  victors-would-rely-on-promise-and-stop-working:
    label: Were the army told what is promised to those who kill them they would rely on it and stop working
    cluster: ethics
  throw-away-spears-draw-swords:
    label: The rebel leader orders 'throw away your spears and draw swords' lest they be adjured as before
    cluster: warfare
  trial-from-the-east-where-satans-horn-rises:
    label: 'Facing east: ''here is the trial, from where the horn of Satan rises'''
    cluster: prophecy
  blessing-for-syria-and-yemen-not-najd:
    label: '''O God bless our Syria, bless our Yemen''; asked for Najd: ''there are earthquakes and trials, there Satan''s horn rises'''
    cluster: prophecy
  lands-withhold-their-measures-and-coins:
    label: Iraq will withhold its dirham and qafiz, Syria its mudy and dinar, Egypt its irdabb and dinar
    cluster: prophecy
  you-returned-to-where-you-began-thrice:
    label: '''You returned to where you began'', three times'
    cluster: prophecy
  thin-shanked-abyssinian-takes-kaaba-treasure:
    label: None will take out the Kaaba's treasure but the thin-shanked one of Abyssinia
    cluster: eschatology
  fear-for-community-of-misleading-imams:
    label: '''What I fear for my community is the misleading imams'''
    cluster: prophecy
  men-with-whips-like-cows-tails:
    label: Men with whips like cows' tails who beat people, going out in God's anger and returning in his wrath
    cluster: prophecy
  women-clothed-naked-heads-like-camel-humps:
    label: Women clothed yet naked, swaying and making sway, heads like leaning humps of Bactrian camels; they will not smell paradise
    cluster: eschatology
  three-asked-two-granted-mutual-violence-refused:
    label: 'Asked three for his community, granted two (no destroying famine, no outside enemy or drowning), refused the third: that their violence not be among themselves'
    cluster: prophecy
  decree-once-made-is-not-turned-back:
    label: 'God: ''when I decree a decree it is not turned back'''
    cluster: theology
  thirty-liars-each-claiming-prophecy:
    label: There will be thirty liars in my community, each claiming to be a prophet; I am the seal of the prophets
    cluster: prophecy
  tribes-of-community-will-worship-idols:
    label: The Hour will not come until tribes of my community join the polytheists and worship idols
    cluster: prophecy
  a-party-stays-on-truth-until-gods-command:
    label: A party of my community will stay on the truth, unharmed by opponents, until God's command comes
    cluster: prophecy
  prayer-of-longing-and-dread:
    label: 'A long, unusual prayer: ''a prayer of longing and dread'''
    cluster: ritual
  prayer-at-mosque-of-banu-muawiya:
    label: He prays two rakas in the mosque of Banu Mu'awiya and calls on his Lord at length there
    cluster: ritual
  intercession-asked-for-community-that-will-shed-blood:
    label: Seeing his community shedding one another's blood after him, as decreed for earlier nations, he asks and is given intercession for them
    cluster: eschatology
  punishment-of-this-community-is-the-sword:
    label: '''The punishment of this community is the sword'''
    cluster: prophecy
  ruin-at-hands-of-quraysh-youths:
    label: '''The ruin of my community is at the hands of youths of Quraysh''; he could name the clans'
    cluster: prophecy
  if-people-withdrew-from-them:
    label: This clan of Quraysh will destroy people - 'what do you command?' - 'if only people withdrew from them'
    cluster: prophecy
  woman-finds-sandal-this-is-a-qurashis:
    label: Quraysh will perish fastest; a woman will pass a sandal and say 'this is a Qurashi's sandal'
    cluster: prophecy
  death-finds-them-sweet-the-rest-like-locust-nymphs:
    label: Death finds them sweet and their community envies them; after them people are locust-nymphs, the strong eating the weak, till the Hour
    cluster: prophecy
  feather-matched-to-feather:
    label: The worst of this community will follow the ways of the scripture-people as feather is matched to feather
    cluster: prophecy
  tree-for-hanging-weapons-dhat-anwat:
    label: Passing the polytheists' tree Dhat Anwat on which they hang weapons, new Muslims ask 'make us a Dhat Anwat as they have one'
    cluster: idolatry
  request-likened-to-make-us-a-god:
    label: '''Glory to God! This is as Moses'' people said: make us a god as they have gods'''
    cluster: idolatry
  even-if-one-lay-with-his-mother-in-the-road:
    label: Even if one of them lay with his mother in the road you would do it
    cluster: prophecy
  seventy-one-seventy-two-seventy-three-sects:
    label: 'Jews split into seventy-one sects, Christians seventy-two, this community seventy-three, one in paradise: the community'
    cluster: prophecy
  passions-run-through-them-like-rabies:
    label: Passions run through them as rabies runs through the bitten, leaving no vein or joint untouched
    cluster: prophecy
  others-likelier-to-neglect-if-arabs-do:
    label: If you Arabs do not uphold what your prophet brought, others are likelier not to
    cluster: ethics
  non-arabs-become-lions-and-eat-your-spoil:
    label: God will fill your hands with non-Arabs, who then become lions that do not flee, kill your fighters and eat your spoil
    cluster: prophecy
units:
- id: hadith-60-iqra-first-revelation
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The first revelation in the cave of Hira and Waraqa's verdict (Q 96:1-5)
  read:
  - Jāmiʿ 60:7661.1
  quran:
  - 96:1-5
  tags:
  - motif: true-dreams-like-daybreak-before-revelation
    refs:
    - Jāmiʿ 60:7661.1
    note: '''al-ru''ya al-sadiqa fi l-nawm ... illa ja''at mithla falaq al-subh'''
  - motif: solitary-devotion-in-mountain-cave
    refs:
    - Jāmiʿ 60:7661.1
    note: '''yalhaqu bi-ghar hira'' fa-yatahannathu fihi ... al-layali dhawat al-''adad'' with provisions, tahannuth glossed as ta''abbud'
  - motif: i-am-not-a-reader
    refs:
    - Jāmiʿ 60:7661.1
    note: '''ma ana bi-qari'''' said three times'
  - motif: angel-squeezes-prophet-three-times
    refs:
    - Jāmiʿ 60:7661.1
    note: '''fa-akhadhani fa-ghattani hatta balagha minni al-jahd'' (al-thaniya, al-thalitha)'
  - motif: prophet-trembling-asks-to-be-wrapped
    refs:
    - Jāmiʿ 60:7661.1
    note: '''zammiluni zammiluni'' while ''tarjufu bawadiruhu'''
  - motif: wife-reassures-by-listing-his-virtues
    refs:
    - Jāmiʿ 60:7661.1
    note: '''innaka la-tasilu al-rahim wa-tasduqu al-hadith wa-tahmilu al-kall wa-taksibu al-ma''dum wa-taqri al-dayf'''
  - motif: christian-kinsman-recognizes-the-namus-of-moses
    refs:
    - Jāmiʿ 60:7661.1
    note: 'Waraqa, ''tanassara fi l-jahiliyya ... yaktubu min al-injil bi-l-''arabiyya'', blind: ''hadha al-namus alladhi unzila ''ala musa'''
  - motif: every-bringer-of-such-message-met-hostility
    refs:
    - Jāmiʿ 60:7661.1
    note: '''lam ya''ti rajul bi-mithli ma ji''ta bihi illa udhiya''; ''a-wa mukhrijiyya hum?'''
  - motif: revelation-pauses-after-first-vision
    refs:
    - Jāmiʿ 60:7661.1
    note: '''thumma lam yanshab waraqa an tuwuffiya wa-fatara al-wahy'''
  hints:
  - 'Waraqa''s ''namus sent down on Moses'': compare the Greek nomos for the Torah; the call of a reluctant prophet who protests he cannot speak (Exod 4:10, Jer 1:6).'
- id: hadith-60-abu-jahl-and-the-praying-prophet
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Abu Jahl threatens to tread on the praying prophet; the trench of fire and the zabaniya (Q 96:6-19)
  read:
  - Jāmiʿ 60:7662.1-7662.3
  quran:
  - 96:6-19
  tags:
  - motif: angels-would-seize-the-one-who-treads-on-prophets-neck
    refs:
    - Jāmiʿ 60:7662.1-7662.2
    note: '''la-ata''anna ''ala raqabatihi aw la-u''affiranna wajhahu fi l-turab'' sworn ''wa-l-lat wa-l-''uzza'''
  - motif: assailant-recoils-from-trench-of-fire-and-wings
    refs:
    - Jāmiʿ 60:7662.1
    note: '''inna bayni wa-baynahu la-khandaqan min nar wa-hawlan wa-ajniha''; he ''yankisu ''ala ''aqibayhi'''
  - motif: angels-would-snatch-him-limb-by-limb
    refs:
    - Jāmiʿ 60:7662.1-7662.2
    note: '''law dana minni la-khtatafathu al-mala''ika ''udwan ''udwan'''
  - motif: opponent-calls-his-council-god-calls-zabaniya
    refs:
    - Jāmiʿ 60:7662.1-7662.3
    note: 'Abu Jahl: ''ma biha nadin akthar minni''; ''law da''a nadiyahu la-akhadhathu zabaniyat allah'''
  - motif: threefold-did-i-not-forbid-you
    refs:
    - Jāmiʿ 60:7662.3
    note: '''a-lam anhaka ''an hadha'' three times'
- id: hadith-60-night-of-decree
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'The Night of Decree: shown and forgotten; standing in it forgives past sins (Q 97)'
  read:
  - Jāmiʿ 60:7663.1-7664.1
  quran:
  - '97:1'
  - '97:3'
  tags:
  - motif: night-of-decree-shown-then-forgotten
    refs:
    - Jāmiʿ 60:7663.1
    note: '''inni urittu laylat al-qadr thumma unsituha aw nussituha'''
  - motif: seek-night-of-decree-in-odd-last-ten
    refs:
    - Jāmiʿ 60:7663.1
    note: '''fa-ltamisuha fi l-''ashr al-awakhir fi l-witr''; retreat in the middle ten, sermon on the morning of the twentieth'
  - motif: prostrating-in-water-and-mud-as-sign
    refs:
    - Jāmiʿ 60:7663.1
    note: '''wa-inni ra''aytu anni asjudu fi ma'' wa-tin'''
  - motif: standing-night-of-decree-forgives-past-sins
    refs:
    - Jāmiʿ 60:7664.1
    note: '''man qama laylat al-qadr imanan wa-htisaban ghufira lahu ma taqaddama min dhanbihi'''
- id: hadith-60-recite-to-ubayy
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: God orders the prophet to recite al-Bayyina to Ubayy by name; the verse of the valley of wealth (Q 98)
  read:
  - Jāmiʿ 60:7665.1-7665.3
  quran:
  - 98:1-8
  tags:
  - motif: god-names-companion-for-recitation
    refs:
    - Jāmiʿ 60:7665.1-7665.2
    note: '''inna allaha amarani an aqra''a ''alayka'' - ''wa-sammani lak?'' ''na''am'' - ''wa-qad dhukirtu ''inda rabb al-''alamin?'''
  - motif: companion-weeps-on-being-named-by-god
    refs:
    - Jāmiʿ 60:7665.1-7665.2
    note: '''fa-baka''; ''fa-dharafat ''aynahu'''
  - motif: son-of-adam-would-seek-third-valley-only-dust-fills
    refs:
    - Jāmiʿ 60:7665.3
    note: '''law anna ibn adam sa''ala wadiyan min mal ... la-sa''ala thalithan wa-la yamla''u jawfa ibn adam illa al-turab'''
  - motif: religion-with-god-is-hanifiyya-not-jewish-nor-christian
    refs:
    - Jāmiʿ 60:7665.3
    note: '''inna dhalika al-din ''inda allah al-hanifiyya ghayr al-mushrika wa-la al-yahudiyya wa-la al-nasraniyya'' recited in al-Bayyina'
  hints:
  - 'The words read ''in'' al-Bayyina but absent from the mushaf (cf. 7674.1, ''we thought this was Quran''): a reported unrecited reading, compare the Rabbinic category of non-canonical readings.'
- id: hadith-60-zalzala-comprehensive-sura
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Al-Zalzala as the comprehensive sura; the sacrifice by trimming hair and nails (Q 99)
  read:
  - Jāmiʿ 60:7667.1-7668.1
  quran:
  - 99:1-8
  tags:
  - motif: old-man-asks-for-comprehensive-sura
    refs:
    - Jāmiʿ 60:7667.1
    note: '''kaburat sinni wa-shtadda qalbi wa-ghaluza lisani ... aqri''ni ... sura jami''a''; offered three of the Alif-Lam-Ra, Ha-Mim and musabbihat suras'
  - motif: will-add-nothing-to-it
    refs:
    - Jāmiʿ 60:7667.1
    note: '''la azidu ''alayha abadan'' - ''aflaha al-ruwayjil'' twice'
  - motif: trim-hair-nails-moustache-as-complete-sacrifice
    refs:
    - Jāmiʿ 60:7667.1
    note: 'with only his son''s lent milch-animal (maniha): ''ta''khudhu min sha''rika wa-tuqallimu azfaraka wa-taqussu sharibaka wa-tahliqu ''anataka fa-dhalika tamam udhiyatika'''
  - motif: same-sura-in-both-rakas-of-dawn
    refs:
    - Jāmiʿ 60:7668.1
    note: '''yaqra''u fi l-subh idha zulzilat ... fi l-rak''atayn kiltayhima'', the hearer unsure whether he forgot'
- id: hadith-60-earth-vomits-gold-and-atom
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The earth vomits columns of gold; the atom's weight verse as the one revealed on donkeys (Q 99:2, 99:7-8)
  read:
  - Jāmiʿ 60:7669.1-7670.1
  quran:
  - '99:2'
  - 99:7-8
  tags:
  - motif: earth-vomits-pieces-of-its-liver-gold-and-silver
    refs:
    - Jāmiʿ 60:7669.1
    note: '''taqi''u al-ard aflaadh kabidiha amthal al-ustuwan min al-dhahab wa-l-fidda'''
  - motif: killer-severer-thief-each-says-for-this-i
    refs:
    - Jāmiʿ 60:7669.1
    note: 'the killer ''fi hadha qataltu'', the severer of kin ''qata''tu rahimi'', the thief ''qutti''at yadi'', and they leave it: ''fa-la ya''khudhuna minhu shay''an'''
  - motif: donkeys-under-the-atoms-weight-verse
    refs:
    - Jāmiʿ 60:7670.1
    note: 'asked about donkeys: ''ma anzala allah ''alayya fiha illa hadhihi al-aya al-fadhdha al-jami''a'''
- id: hadith-60-fire-seventy-parts
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Worldly fire one part of seventy of hell's (Q 101:11)
  read:
  - Jāmiʿ 60:7672.1
  quran:
  - '101:11'
  tags:
  - motif: worldly-fire-one-seventieth-of-hell
    refs:
    - Jāmiʿ 60:7672.1
    note: '''naru bani adam ... juz'' min sab''in juz''an min nar jahannam ... fuddilat ''alayha bi-tis''a wa-sittin juz''an kulluhunna mithlu harriha'''
- id: hadith-60-takathur-mine-mine
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Al-Takathur: ''my wealth, my wealth''; the valley verse once thought Quran (Q 102:1-2)'
  read:
  - Jāmiʿ 60:7674.1-7674.2
  quran:
  - 102:1-2
  tags:
  - motif: son-of-adam-would-seek-third-valley-only-dust-fills
    refs:
    - Jāmiʿ 60:7674.1
    note: 'Ubayy: ''kunna nara hadha min al-qur''an hatta nazalat alhakum al-takathur'' (the valley saying)'
  - motif: only-wealth-eaten-worn-or-given-is-yours
    refs:
    - Jāmiʿ 60:7674.2
