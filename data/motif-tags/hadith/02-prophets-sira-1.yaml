new_motifs:
  moses-in-seventh-heaven-for-gods-speech: {label: "On the ascent Moses is in the seventh heaven 'by the preference of God's speech' (bi-tafdil kalam allah); an unnamed prophet in the fifth was not remembered", cluster: ascent}
  abraham-tested-with-ten-purities: {label: "The 'words' with which Abraham was tested are ten purity practices: five of the head (toothstick, nose-rinsing, mouth-rinsing, trimming the moustache, parting the hair) and five of the body (nails, pubic hair, circumcision, washing after stool and urine, plucking the armpit)", cluster: ritual}
  resurrected-barefoot-naked-uncircumcised: {label: "People are gathered at the resurrection barefoot, naked and uncircumcised (hufatan ʿuratan ghurlan), as first created", cluster: eschatology}
  abraham-first-clothed-at-resurrection: {label: "The first to be clothed on resurrection day is Abraham", cluster: eschatology}
  companions-taken-to-the-left-as-apostates: {label: "Men of the prophet's companions are taken to the left; he cries 'my companions!' and is told they kept turning back on their heels after he left them", cluster: eschatology}
  prophet-answers-in-words-of-jesus-at-judgment: {label: "At judgment the prophet answers as 'the righteous servant Jesus son of Mary' did: 'I was a witness over them while I was among them ... if you punish them they are your servants'", cluster: eschatology}
  abraham-and-mary-pictured-in-kaba: {label: "Inside the Ka'ba the prophet finds pictures of Abraham and of Mary; Abraham and Ishmael are painted holding divining arrows, which they never used", cluster: idolatry}
  angels-do-not-enter-house-with-picture: {label: "Angels do not enter a house in which there is a picture (sura)", cluster: angels}
  abraham-protects-sons-with-perfect-words: {label: "Abraham protected Ishmael and Isaac with the formula 'I seek refuge in God's perfect words from every devil and venomous creature and every harmful eye'; the prophet uses it over Hasan and Husayn", cluster: ritual}
  pearl-palace-for-abraham-in-paradise: {label: "In paradise is a palace (of pearl) with no crack or weakness, prepared by God for his friend Abraham as a lodging (nuzul)", cluster: eschatology}
  half-fair-half-ugly-are-mixed-deeds: {label: "In the dream-journey a people half fair and half ugly are those who mixed good and bad deeds; God passed over them", cluster: eschatology}
  children-of-polytheists-with-abraham: {label: "Asked about the children of the polytheists, the prophet answers that they too are among the children around Abraham", cluster: eschatology}
  circling-bird-reveals-water: {label: "Travellers see a bird circling ('a'if) over a dry valley and infer water; their scouts find it", cluster: wilderness}
  abraham-stands-on-stone-while-building: {label: "As the walls rise Ishmael brings 'this stone' and Abraham stands on it to build, both saying 'Our Lord, accept from us'", cluster: abraham}
  ishmael-first-to-speak-clear-arabic: {label: "Ishmael was the first whose tongue God opened in clear Arabic (al-ʿarabiyya al-mubina)", cluster: language}
  sons-of-ishmael-your-father-was-an-archer: {label: "The prophet urges archers of Aslam: 'Shoot, sons of Ishmael, your father was an archer'; when one side stops because he joined the other, he joins both", cluster: ishmael}
  satan-obstructs-abraham-at-ritual-stations: {label: "When Abraham is shown the rites, Satan bars his way at the course (mas'a), where Abraham outruns him, and at each of the pillars (jamarat), where he pelts him with seven pebbles until he goes", cluster: abraham}
  son-asks-to-be-shrouded-in-his-shirt: {label: "The son to be sacrificed wears a white shirt and asks his father to take it off to shroud him in, having no other", cluster: abraham}
  white-horned-ram-appears-behind: {label: "Called from behind, Abraham turns and finds a white, horned, wide-eyed ram (kabsh abyad aqran a'yan)", cluster: abraham}
  noble-son-of-noble-fourfold: {label: "'The noble son of the noble son of the noble son of the noble': Joseph son of Jacob son of Isaac son of Abraham", cluster: genealogy}
  people-are-mines: {label: "People are mines (ma'adin): the best of them in the Jahiliyya are the best in Islam if they gain understanding", cluster: ethics}
  you-are-the-women-of-joseph: {label: "When his wives argue that Abu Bakr is too tender (he weeps when reciting) to lead the prayer, the dying prophet says 'you are the companions (sawahib) of Joseph'", cluster: joseph}
  years-like-the-years-of-joseph: {label: "The prophet prays against Mudar: 'make them years like the years of Joseph', after praying for named captive Muslims to be rescued", cluster: joseph}
  joseph-given-half-of-beauty: {label: "In the third heaven Joseph is met; he has been given half of (all) beauty (shatr al-husn)", cluster: joseph}
  golden-locusts-rain-on-bathing-job: {label: "While Job bathes naked a swarm of golden locusts falls on him and he scoops them into his garment; God asks whether he had not made him rich; Job: 'there is no doing without your blessing'", cluster: job}
  none-may-say-better-than-jonah: {label: "No one (no servant, no prophet) may say 'I am better than Jonah son of Matta'; whoever says it has lied", cluster: prophecy}
  prophets-seen-passing-in-talbiya: {label: "The prophet, passing a named valley or pass on the road between Mecca and Medina, says 'as if I see' a former prophet (Moses, Jonah) passing there in pilgrimage, calling the talbiya", cluster: pilgrimage}
  jonah-on-red-camel-in-wool-cloak: {label: "Jonah son of Matta rides a red, firm-fleshed she-camel, wearing a woollen jubba, its halter of palm fibre (khulba), calling the talbiya at the pass of Harsha", cluster: pilgrimage}
  moses-fingers-in-ears-crying-talbiya: {label: "Moses passes through Wadi al-Azraq with two fingers in his ears, crying out loud (ju'ar) to God in the talbiya", cluster: pilgrimage}
  moses-like-the-zutt: {label: "Moses is brown (adam), heavy-bodied and straight-haired 'like a man of the Zutt'; Jesus red, curly-haired, broad-chested", cluster: moses}
  stone-runs-off-with-moses-garment: {label: "Moses, who bathed alone out of modesty, lays his garment on a stone; the stone runs off with it; he chases it crying 'my garment, stone!' until the Israelites see him naked and unblemished", cluster: moses}
  moses-rumoured-to-have-hernia: {label: "The Israelites, who bathed naked together, say Moses keeps covered because he is scrotally swollen (adar), leprous or blemished", cluster: moses}
  marks-of-moses-blows-on-the-stone: {label: "Moses beats the stone with his staff; its marks (nadab) remain on it, three to seven", cluster: moses}
  moses-served-the-longer-term: {label: "Moses fulfilled the longer and better of the two terms (ten years) agreed with his father-in-law", cluster: moses}
  jews-fast-day-moses-was-saved: {label: "In Medina the Jews fast 'Ashura, the day God saved Moses and drowned Pharaoh's people, which Moses fasted in thanks; the prophet: 'I have more right to Moses' and fasts it", cluster: ritual}
  moses-holding-throne-leg-at-resurrection: {label: "When all swoon at the resurrection the prophet is first to wake and finds Moses holding a leg (qa'ima) of the Throne: either he woke first or was spared, repaid by his swoon at the Mount", cluster: eschatology}
  mountain-sank-at-a-fingertip-of-glory: {label: "Reciting 'when his Lord manifested himself to the mountain' the prophet shows the extent with the tip of his thumb on a fingertip: the mountain sank (sakha)", cluster: theophany}
  moses-was-hurt-more-and-was-patient: {label: "Accused of an unjust division of booty, the prophet says: 'May God have mercy on Moses: he was hurt with more than this and was patient'", cluster: moses}
  lowest-and-highest-in-paradise: {label: "Moses asks the lowest rank in paradise: a late-comer offered a worldly king's dominion and then ten times as much; the highest are those whose honour God planted with his hand and sealed: no eye has seen, no ear heard", cluster: eschatology}
  moses-asks-god-seven-questions: {label: "Moses asks God which of his servants is most pious, best guided, most just, most learned, mightiest, richest and poorest, and is answered each time", cluster: moses}
  moses-slaps-angel-of-death: {label: "The angel of death comes for Moses; Moses slaps him and puts out his eye; God restores the eye and sends him back", cluster: moses}
  a-year-for-each-hair-under-hand-on-ox: {label: "Offered more life: as many years as hairs covered by his hand on an ox's back; 'and then?' 'death'; 'then now'", cluster: death}
  moses-asks-to-die-stone-throw-from-holy-land: {label: "Moses asks to be brought within a stone's throw of the Holy Land; his grave is by the road at the red sandhill (al-kathib al-ahmar)", cluster: moses}
  moses-praying-in-his-grave: {label: "On the night journey the prophet passes Moses standing in prayer in his grave at the red sandhill", cluster: moses}
  moses-weeps-at-later-prophets-community: {label: "On the ascent Moses weeps: 'this youth sent after me, more of his community enter paradise than of mine'", cluster: ascent}
  prophets-shown-with-their-followers: {label: "The communities are shown: a prophet with a small band, one with one or two men, one with none; a great mass is Moses and his people; the prophet's community fills the horizons", cluster: eschatology}
  seventy-thousand-enter-without-reckoning: {label: "Seventy thousand of the community enter paradise without reckoning or punishment: those who do not seek or give charms, do not take omens and trust in their Lord; Ukkasha is among them, 'Ukkasha has beaten you to it'", cluster: eschatology}
  fast-of-david-alternate-days: {label: "No fast is above David's fast: half of time, fasting one day and breaking one; refused a smaller count of monthly fasting days", cluster: ritual}
  david-recites-while-mounts-saddled: {label: "Recitation was made light for David: he would order his mounts saddled and recite the scripture before they were ready", cluster: david}
  david-ate-from-his-handiwork: {label: "David ate only from the work of his own hands; no food is better than one's own earning", cluster: david}
  sad-prostration-following-david: {label: "The prostration in Sura Sad is done because David prostrated and the prophet was told to follow the guidance of the prophets", cluster: ritual}
  davids-post-prayer-plea-found-in-torah: {label: "Ka'b swears by him who split the sea for Moses that the Torah records David's plea after prayer (mend my religion and my world ... I seek refuge in you from you ...), which the prophet also said", cluster: david}
  flute-of-the-family-of-david: {label: "A beautiful reciter is said to have been given 'a flute (mizmar) of the flutes of the family of David'", cluster: david}
  light-between-the-eyes-of-each-soul: {label: "God wipes Adam's back and every soul to the end falls from it; between each one's eyes is a gleam of light (wabis)", cluster: primeval}
  adam-denied-so-offspring-deny: {label: "'Adam denied, so his offspring deny; Adam forgot, so his offspring forget; Adam erred, so his offspring err'", cluster: primeval}
  prophet-spares-ifrit-for-solomons-prayer: {label: "A demon ('ifrit) attacks the prophet at prayer; he seizes and nearly ties it to a mosque pillar for the people to see, but remembers Solomon's prayer and lets it go", cluster: jinn}
  iblis-brings-firebrand-to-prophets-face: {label: "Iblis comes with a firebrand of fire to put in the prophet's face; three refuges and a curse do not stop him; but for Solomon's prayer he would be bound for Medina's children to play with", cluster: jinn}
  solomon-vows-sons-from-many-wives: {label: "Solomon swears to go round his wives in one night (sixty, seventy, ninety or a hundred) that each bear a horseman for God's cause; he omits 'if God wills' and one bears half a child", cluster: solomon}
  saying-if-god-wills-would-have-fulfilled: {label: "Had he said 'if God wills' he would not have broken his oath and they would all have fought as horsemen", cluster: oath}
  solomon-calls-for-knife-to-divide-child: {label: "A wolf takes one of two women's sons; each claims the survivor; David gives him to the elder; Solomon calls for a knife to split him; the younger says 'he is hers' and he gives him to her", cluster: judgment}
  solomon-three-requests-at-temple: {label: "Having built the Jerusalem temple Solomon asks three things: judgment that hits the mark, a kingdom no one after him should have, and that whoever comes only to pray in it leave as sinless as at birth", cluster: solomon}
  ant-raising-legs-brings-rain: {label: "A prophet goes out to pray for rain and sees an ant lifting some of its legs: 'go back, you have been answered because of this ant'", cluster: prayer}
  zechariah-was-a-carpenter: {label: "Zechariah was a carpenter (najjar)", cluster: prophecy}
  jesus-and-john-sons-of-two-sisters: {label: "Jesus and John are 'the two sons of the maternal aunt' (ibnay al-khala), met together in the second heaven", cluster: ascent}
  john-and-jesus-excepted-from-hasan-husayn: {label: "Hasan and Husayn are lords of the youths of paradise, except the two cousins John and Jesus", cluster: eschatology}
  john-ordered-five-commandments: {label: "God orders John son of Zechariah to keep and teach Israel five words; when he delays, Jesus offers to teach them; John gathers the people in the Jerusalem temple and teaches them", cluster: john}
  parable-slave-who-pays-another-master: {label: "Associating with God is like a slave bought with his master's gold who works and pays his earnings to another", cluster: parable}
  god-faces-the-praying-servant: {label: "In prayer do not look aside, for God sets his face to the face of his servant as long as he does not turn", cluster: ritual}
  fasters-breath-better-than-musk: {label: "Fasting is like a man in a company carrying a purse of musk that all admire; the breath of the faster is better with God than musk", cluster: ritual}
  charity-as-ransom-of-condemned-captive: {label: "Charity is like a captive whose hand is tied to his neck, about to be beheaded, who ransoms himself with little and much", cluster: parable}
  remembrance-as-fortress-from-enemy: {label: "Remembering God is like a man pursued by enemies who reaches an impregnable fortress; the servant is safe from Satan only by remembrance", cluster: parable}
  five-commands-of-the-prophet: {label: "The prophet's own five commands: hearing, obeying, jihad, emigration, and the community: whoever leaves it a handspan has thrown off the halter of Islam", cluster: law}
  john-never-intended-a-sin: {label: "No one should say he is better than John son of Zechariah, who never intended a sin nor did one", cluster: john}
  jesus-believes-oath-over-his-eye: {label: "Jesus sees a man stealing; the man swears by God he did not; Jesus says 'I believe God and give my eye the lie'", cluster: jesus}
  prophets-are-sons-of-one-father: {label: "Prophets are half-brothers by one father ('allat): different mothers, one religion; no prophet between Jesus and Muhammad", cluster: prophecy}
  jesus-circling-kaba-hair-dripping: {label: "In a dream at the Ka'ba the prophet sees a brown man of handsome hair combed and dripping water, leaning on two men, circling the House: the Messiah son of Mary", cluster: jesus}
  three-get-double-reward: {label: "Double reward goes to the man who educates, frees and marries his slave-girl, to one who believed in Jesus and then in Muhammad, and to the slave who fears his Lord and obeys his masters", cluster: ethics}
  prophet-burns-ant-nest-rebuked: {label: "A prophet bitten by an ant under a tree has his gear moved and the ant nest burned; God reproaches him: a nation that glorifies burned for one ant; 'why not one ant?'", cluster: animals}
  three-men-excluded-from-the-raid: {label: "A prophet going to war forbids three to follow: a man who has married and not consummated, one who built a house and has not roofed it, one who bought pregnant beasts awaiting their birth", cluster: war}
  beaten-prophet-prays-they-do-not-know: {label: "A prophet whose people beat him bloody wipes the blood from his face and says 'O God, forgive my people, for they do not know'", cluster: prophecy}
  three-punishments-offered-death-chosen: {label: "A prophet proud of his people's numbers is told to let them choose: enemy, famine or death; they choose death and seventy thousand die in one night", cluster: punishment}
  stone-worshipped-replaced-by-better: {label: "Before Islam they worshipped a stone, exchanging it for a better one; lacking a stone they heaped earth, milked a ewe over it and circled it", cluster: idolatry}
  rajab-spearheads-removed: {label: "In Rajab they called it 'remover of spearheads' (munsil al-asinna) and took the iron off every spear and arrow for the month", cluster: idolatry}
  arab-ignorance-in-anam-above-130: {label: "To know the ignorance of the Arabs read above verse 130 of al-An'am: those who killed their children and forbade what God provided", cluster: idolatry}
  amr-b-luhayy-drags-guts-in-fire: {label: "The prophet saw 'Amr b. Luhayy b. Qam'a b. Khindif dragging his entrails (qusb) in the Fire", cluster: idolatry}
  god-chose-kinana-quraysh-hashim: {label: "God chose Kinana of Ishmael's offspring, Quraysh of Kinana, Hashim of Quraysh, and the prophet of Hashim", cluster: genealogy}
  we-do-not-disown-our-father: {label: "'We are the sons of al-Nadr b. Kinana; we do not trace through our mother nor disown our father'", cluster: genealogy}
  born-and-first-revealed-on-monday: {label: "Monday's fast: 'that is the day I was born and the day revelation came to me'", cluster: sira}
  born-in-year-of-the-elephant: {label: "The prophet was born in the Year of the Elephant; a Companion says 'we are of the same birth' (lidan)", cluster: sira}
  mothers-of-prophets-see-such-visions: {label: "'And so the mothers of prophets see' (visions at the birth)", cluster: sira}
  jew-of-mecca-announces-birth-tonight: {label: "A Jewish trader at Mecca asks Quraysh on the night of the birth whether a child was born, announcing the last community's prophet, with a hairy mark between his shoulders like a horse's mane", cluster: annunciation}
  jinni-finger-stops-newborn-suckling: {label: "The newborn will not suckle for two nights because a jinni put his finger in his mouth", cluster: sira}
  jew-faints-prophecy-gone-from-israel: {label: "Shown the child's mark the Jew faints and cries 'prophecy has gone from the Children of Israel'; he will assault you with a fame from east to west", cluster: annunciation}
  thuwayba-freed-slave-of-abu-lahab-nursed: {label: "Thuwayba, a freedwoman of Abu Lahab, nursed the prophet; Hamza's daughter is his niece by fosterage", cluster: sira}
  chest-opened-black-clot-removed: {label: "Two men in white (two white birds like vultures; Gabriel) lay the child down, split him, take out his heart and remove a black clot ('alaqa), 'Satan's share', and wash it (with snow, ice-water, or Zamzam in a gold basin)", cluster: sira}
  sakina-and-seal-put-in-heart: {label: "Calm (sakina) is sprinkled into the washed heart; it is stitched and sealed with the seal of prophethood", cluster: sira}
  child-outweighs-thousand-of-community: {label: "Weighed in a balance against ten, a hundred, a thousand of his community, the child outweighs them; 'if weighed against all of them he would outweigh them'", cluster: sira}
  mark-of-the-stitch-on-chest: {label: "Anas: 'I used to see the mark of that stitching on his chest'", cluster: sira}
  five-names-of-the-prophet: {label: "The prophet's names: Muhammad, Ahmad, al-Mahi by whom God erases unbelief, al-Hashir at whose feet people are gathered, al-'Aqib; also al-Muqaffi, prophet of repentance, prophet of mercy", cluster: sira}
  quraysh-curse-mudhammam: {label: "Quraysh curse 'Mudhammam' (the blamed one); 'I am Muhammad' (the praised one), so their curse misses him", cluster: sira}
  name-me-not-my-kunya: {label: "Take my name but not my kunya (Abu l-Qasim): 'I am the distributor (qasim) among you'", cluster: sira}
  my-father-and-yours-in-the-fire: {label: "Asked where his father is, a man is told 'in the Fire'; called back: 'my father and your father are in the Fire'", cluster: sira}
  mothers-grave-visit-allowed-forgiveness-not: {label: "The prophet weeps at his mother's grave: he was allowed to visit it but not to ask forgiveness for her; 'visit graves, they remind you of death'", cluster: sira}
  umm-ayman-abyssinian-nurse-freed: {label: "Umm Ayman, an Abyssinian maid of the prophet's father, nursed him, was freed and married to Zayd b. Haritha", cluster: sira}
  prophet-faints-when-loincloth-removed: {label: "Carrying stones for the Ka'ba the boy puts his loincloth on his neck at 'Abbas's urging, falls down with eyes fixed on the sky and says 'my loincloth!'", cluster: sira}
  voice-commands-cover-your-nakedness: {label: "When his short cloak (namira) leaves him exposed as he carries stones, a voice calls 'Muhammad, cover your nakedness!' and he was never seen naked again", cluster: sira}
  monk-recognizes-boy-as-lord-of-worlds: {label: "A monk who never came out to the caravan walks among them, takes the boy's hand and says 'this is the master of the worlds, sent as mercy to the worlds'", cluster: annunciation}
  trees-and-stones-bow-to-a-prophet: {label: "Every tree and stone fell prostrate as the caravan came over the pass; they prostrate only to a prophet", cluster: annunciation}
  seal-like-apple-below-shoulder: {label: "The monk knows him by the seal of prophethood below the cartilage of his shoulder, like an apple", cluster: annunciation}
  cloud-and-tree-shade-follow-boy: {label: "The boy comes with a cloud shading him, and the shade of the tree leans over him when he sits", cluster: annunciation}
  romans-sent-to-seize-awaited-prophet: {label: "Seven Romans come searching every road for the prophet 'due to come out this month'; the monk tells them none can turn back what God decrees", cluster: annunciation}
  every-prophet-herded-sheep: {label: "Every prophet herded sheep; the prophet herded for the people of Mecca for qirats; 'take the black ones' of the arak berries", cluster: prophecy}
  pact-of-the-perfumed-not-for-red-camels: {label: "He was present with his uncles at the oath of the Perfumed (al-mutayyabin) and would not break it for red camels; no pact in Islam, but Islam adds strength to pre-Islamic pacts", cluster: sira}
  hired-by-khadija-for-two-journeys: {label: "Khadija hired the prophet for two journeys to Jurash, a young she-camel (qalus) each", cluster: sira}
  first-to-come-through-the-pass-arbitrates: {label: "Clans quarrelling over who sets the Black Stone agree to let the first man to come through the pass judge; it is the prophet, 'the trustworthy' (al-amin)", cluster: sira}
  stone-set-on-cloth-lifted-by-all-clans: {label: "He puts the stone on a cloth (mirt), has each clan take a side, and sets it in place himself", cluster: sira}
  carved-stone-anointed-with-milk-dog-urinates: {label: "A man worshipped a stone he carved; he poured over it milk he grudged himself; a dog came, licked it, lifted its leg and urinated", cluster: idolatry}
  serpent-guards-kaba-taken-by-great-bird: {label: "A black-backed, white-bellied snake on the Ka'ba wall lunges open-mouthed at anyone who would demolish it; Quraysh pray; a bird bigger than an eagle seizes it and drags it toward Ajyad", cluster: sanctuary}
  kaba-of-loose-stone-rebuilt-with-wrecked-ship-timber: {label: "The pre-Islamic Ka'ba was loose stone without mortar, roofless, the height a kid could jump; Quraysh rebuild it to twenty cubits with timber from a wrecked Roman ship and its Roman carpenter", cluster: sanctuary}
  prophet-forbids-touching-idols-before-call: {label: "Circling the House before the call, the prophet forbids Zayd to touch the idols; he never touched one until he received the Book", cluster: sira}
  never-will-i-worship-lat-or-uzza: {label: "'Khadija, by God I will never worship al-Lat, by God I will never worship al-'Uzza'", cluster: sira}
  stood-at-arafat-before-the-call: {label: "Before revelation the prophet stood on his camel at 'Arafat with the people (not with Quraysh at Muzdalifa) and moved off with them", cluster: pilgrimage}
  hums-stood-at-muzdalifa: {label: "Quraysh and their adherents, the Hums ('we are the dwellers of the House'), stood at Muzdalifa while others stood at 'Arafat", cluster: pilgrimage}
  naked-woman-circling-chants-what-shows: {label: "A woman circling the House naked asks 'who will lend me a garment?', covers her private part with her hand and chants 'today part or all of it shows; what shows I do not make lawful'", cluster: pilgrimage}
  jinniya-tells-of-jinn-despair: {label: "A former diviner's female jinni comes in fright: 'have you not seen the jinn and their despair ... their joining the young camels and their saddle-cloths?'", cluster: jinn}
  voice-from-sacrificed-calf: {label: "At the idols a calf is slaughtered and a voice cries from it: 'O Jalih, a successful matter, an eloquent man says: no god but God'", cluster: annunciation}
  jew-foretells-prophet-from-mecca-yemen: {label: "A Jewish neighbour describes resurrection, reckoning, scales and fire to the idolaters and points toward Mecca and Yemen for a coming prophet; the youngest present will see him; later he denies him", cluster: annunciation}
  hottest-oven-rather-than-fire: {label: "Each would wish to be shut in the hottest oven of this world in exchange for escaping that Fire", cluster: eschatology}
  jews-of-medina-expelled: {label: "Banu Nadir are expelled, Qurayza spared then fought: men killed, women, children and goods divided; Qaynuqa' and all Medina's Jews expelled", cluster: sira}
  sent-from-best-generations: {label: "'I was sent from the best generations of the sons of Adam, generation after generation, until the generation I am of'", cluster: sira}
  stone-in-mecca-greeted-me: {label: "'I know a stone in Mecca that used to greet me before I was sent; I know it now'", cluster: sira}
  feeds-poor-then-circles-house-after-retreat: {label: "During his yearly month of retreat at Hira (the tahannuth of Quraysh) he fed the poor who came; after it he circled the Ka'ba seven times before entering his house", cluster: sira}
  share-of-gods-anger-or-curse: {label: "A Jewish scholar tells the seeker he must take his share of God's anger, a Christian one his share of God's curse; both point him to the hanif religion of Abraham", cluster: hanif}
  refuses-meat-sacrificed-on-stones: {label: "Zayd b. 'Amr refuses food 'sacrificed on your altar-stones (ansab)': God created the sheep, sent down water and grew pasture, and you slaughter it to another name", cluster: hanif}
  sent-at-forty-thirteen-and-ten: {label: "Sent at forty, he stayed thirteen years in Mecca receiving revelation, emigrated for ten and died at sixty-three", cluster: sira}
  satan-has-left-you-taunt: {label: "After two or three nights without his rising a woman taunts 'I hope your devil has left you'; Q 93:1-3 is revealed", cluster: revelation}
  ya-sabahah-from-safa: {label: "On Safa the prophet cries the alarm 'ya sabahah!', calls clan by clan, and asks: if I told you horsemen are coming from behind this hill, would you believe me? 'I am a warner before a severe punishment'", cluster: sira}
  abu-lahab-perish-you: {label: "Abu Lahab answers the warning 'perish you! did you gather us for this?' and the sura 'perish the hands of Abu Lahab' is revealed", cluster: sira}
  buy-yourselves-from-god: {label: "Calling clan, uncle, aunt and daughter by name: 'buy yourselves from God; I avail you nothing against God; ask of my wealth what you will; I will only moisten the kinship with its moisture'", cluster: sira}
  warner-like-scout-who-sees-enemy: {label: "From the top of a rock: 'my likeness and yours is a man who saw the enemy and went to watch over his people, and fearing they would outrun him, shouted ya sabahah'", cluster: parable}
  seven-first-to-declare-islam: {label: "The first seven to show their Islam: the prophet, Abu Bakr, 'Ammar, his mother Sumayya, Suhayb, Bilal, al-Miqdad; the others were put in iron coats in the sun; Bilal alone held out, dragged by boys crying 'One, One'", cluster: sira}
  five-slaves-two-women-and-abu-bakr: {label: "At first the prophet had with him only five slaves, two women and Abu Bakr", cluster: sira}
  third-of-islam: {label: "Sa'd: 'I was a third of Islam'; none became Muslim but on the day I did, and I stayed seven days", cluster: sira}
  mother-hunger-strike-against-sons-faith: {label: "Sa'd's mother swears not to speak to him, eat or drink until he abandons his religion, faints after three days; the verse 'if they strive to make you associate ... do not obey them, but keep company with them kindly' is revealed", cluster: sira}
  sent-with-kinship-and-breaking-idols: {label: "'Sent with joining kinship, breaking idols and declaring God one'; 'who is with you?' 'a free man and a slave'", cluster: sira}
  first-to-pray-was-ali: {label: "The first to become Muslim, or to pray, was 'Ali (against those who say Abu Bakr)", cluster: sira}
  sooner-light-torch-from-sun: {label: "Pointing at the sun: 'I am no more able to leave this than you are to light a torch for me from it'", cluster: sira}
  moon-split-shown-as-sign: {label: "Asked for a sign, the prophet shows the Meccans the moon split in two (Hira between the halves; one part behind the mountain): 'bear witness'", cluster: miracle}
  safa-of-gold-declined-for-respite: {label: "Meccans ask that Safa be turned to gold and the mountains moved; offered the sign with destruction if they then disbelieve, the prophet chooses respite and the gate of repentance", cluster: miracle}
  placenta-on-prostrating-prophet: {label: "At Abu Jahl's urging the most wretched of them lays a camel's afterbirth (sala) on the prostrating prophet's back; they laugh while he stays prostrate", cluster: sira}
  seven-named-cursed-found-at-badr-well: {label: "The prophet curses Quraysh three times and names Abu Jahl, 'Utba, Shayba, al-Walid, Umayya, 'Uqba and a seventh; they are seen dead in the well of Badr", cluster: sira}

units:
  - id: hadith-47-prophets-in-the-heavens-sharik
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Prophets in the heavens in Sharik's version - Moses in the seventh
    read: ["Jāmiʿ 47:4963.1"]
    quran: []
    tags:
      - {motif: prophets-placed-in-the-heavens, refs: ["Jāmiʿ 47:4963.1"], note: "إدريس في الثانية، وهارون في الرابعة، وآخر في الخامسة لم أحفظ اسمه، وإبراهيم في السادسة"}
      - {motif: moses-in-seventh-heaven-for-gods-speech, refs: ["Jāmiʿ 47:4963.1"], note: "وموسى في السابعة بتفضيل كلام الله"}
  - id: hadith-47-abraham-tested-with-purities
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Abraham's test was ten purity practices (Ibn Abbas on Q 2:124)
    read: ["Jāmiʿ 47:4963.2"]
    quran: ["2:124"]
    tags:
      - {motif: abraham-tested-with-ten-purities, refs: ["Jāmiʿ 47:4963.2"], note: "ابتلاه الله بالطهارة: خمس في الرأس، وخمس في الجسد ... والختان"}
    hints:
      - "Abraham tried by a set number: here ten purity rites (five of head, five of body, circumcision among them), against m. Avot 5:3, 'with ten trials was Abraham our father tried', which are trials of faith, not body practices."
  - id: hadith-47-first-clothed-at-resurrection
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Gathered barefoot, naked, uncircumcised; Abraham first clothed; the companions taken to the left
    read: ["Jāmiʿ 47:4963.3", "Jāmiʿ 47:5015.2"]
    quran: ["21:104", "5:117-118"]
    tags:
      - {motif: resurrected-barefoot-naked-uncircumcised, refs: ["Jāmiʿ 47:4963.3", "Jāmiʿ 47:5015.2"], note: "تُحشرون حُفاةً عُراةً غُرْلا ... كما بدأنا أول خلق نعيده"}
      - {motif: abraham-first-clothed-at-resurrection, refs: ["Jāmiʿ 47:4963.3", "Jāmiʿ 47:5015.2"], note: "فأول من يُكسى إبراهيم"}
      - {motif: companions-taken-to-the-left-as-apostates, refs: ["Jāmiʿ 47:4963.3", "Jāmiʿ 47:5015.2"], note: "يؤخذ برجال من أصحابي ذات اليمين وذات الشمال ... لم يزالوا مرتدين على أعقابهم"}
      - {motif: prophet-answers-in-words-of-jesus-at-judgment, refs: ["Jāmiʿ 47:4963.3", "Jāmiʿ 47:5015.2"], note: "فأقول كما قال العبد الصالح عيسى ابن مريم: وكنت عليهم شهيدا ما دمت فيهم"}
  - id: hadith-47-abraham-pictured-in-kaba
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Pictures of Abraham and Mary in the Ka'ba
    read: ["Jāmiʿ 47:4964.1"]
    quran: []
    tags:
      - {motif: abraham-and-mary-pictured-in-kaba, refs: ["Jāmiʿ 47:4964.1"], note: "فوجد فيه صورة إبراهيم وصورة مريم ... هذا إبراهيم مصور فما له يستقسم؟"}
      - {motif: angels-do-not-enter-house-with-picture, refs: ["Jāmiʿ 47:4964.1"], note: "الملائكة لا تدخل بيتا فيه صورة"}
  - id: hadith-47-abrahams-protective-formula
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Abraham's refuge formula over Ishmael and Isaac
    read: ["Jāmiʿ 47:4964.2"]
    quran: []
    tags:
      - {motif: abraham-protects-sons-with-perfect-words, refs: ["Jāmiʿ 47:4964.2"], note: "إن أباكما كان يعوذ بها إسماعيل وإسحاق: أعوذ بكلمات الله التامة من كل شيطان وهامة، ومن كل عين لامة"}
  - id: hadith-47-tall-abraham-in-the-meadow
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: In the dream, tall Abraham in a meadow among the children who died on the fitra
    read: ["Jāmiʿ 47:4965.1"]
    quran: []
    tags:
      - {motif: abraham-in-meadow-with-children-who-died-on-fitra, refs: ["Jāmiʿ 47:4965.1"], note: "رجل طويل لا أكاد أرى رأسه طولا في السماء ... فإنه إبراهيم ... فكل مولود مات على الفطرة"}
      - {motif: children-of-polytheists-with-abraham, refs: ["Jāmiʿ 47:4965.1"], note: "وأولاد المشركين؟ فقال ... وأولاد المشركين"}
      - {motif: half-fair-half-ugly-are-mixed-deeds, refs: ["Jāmiʿ 47:4965.1"], note: "شطرًا منهم حسن، وشطرًا منهم قبيح فإنهم قوم خلطوا عملا صالحا وآخر سيئا"}
    hints:
      - "The dead children gathered around Abraham in a garden, against Luke 16:22, where the poor man is carried by angels to 'Abraham's bosom'."
  - id: hadith-47-abrahams-palace
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: A pearl palace in paradise for Abraham
    read: ["Jāmiʿ 47:4965.2"]
    quran: []
    tags:
      - {motif: pearl-palace-for-abraham-in-paradise, refs: ["Jāmiʿ 47:4965.2"], note: "إن في الجنة قصرًا - أحسبه قال: من لؤلؤ - ليس فيه فصمٌ ولا وهنٌ أعده الله لخليله إبراهيم نزلا"}
  - id: hadith-47-hagar-ishmael-and-the-house
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Hagar and Ishmael at Mecca, Zamzam, Jurhum, the two wives and the building of the House
    read: ["Jāmiʿ 47:4967.1"]
    quran: ["19:54-55", "14:37", "2:127"]
    tags:
      - {motif: hagar-first-to-wear-the-girdle, refs: ["Jāmiʿ 47:4967.1"], note: "أول ما اتخذ النساء المنطق من قبل أم إسماعيل اتخذت منطقا لتعفي أثرها على سارة"}
      - {motif: mother-and-child-left-with-skin-of-water-and-dates, refs: ["Jāmiʿ 47:4967.1"], note: "ووضع عندهما جرابا فيه تمر وسقاء فيه ماء"}
      - {motif: hagar-asks-did-god-command-this, refs: ["Jāmiʿ 47:4967.1"], note: "آلله الذي أمرك بهذا؟ قال: نعم. قالت: إذن لا يضيعنا"}
      - {motif: seven-runs-between-safa-and-marwa, refs: ["Jāmiʿ 47:4967.1"], note: "ففعلت ذلك سبع مرات ... فذلك سعي الناس بينهما"}
      - {motif: angel-strikes-ground-with-heel-and-water-gushes, refs: ["Jāmiʿ 47:4967.1"], note: "فإذا هي بالملك عند موضع زمزم، فبحث بعقبه - أو قال: بجناحه - حتى ظهر الماء"}
      - {motif: zamzam-would-have-been-flowing-spring, refs: ["Jāmiʿ 47:4967.1"], note: "لو لم تغرف من الماء لكانت زمزم عينا معينا"}
      - {motif: circling-bird-reveals-water, refs: ["Jāmiʿ 47:4967.1"], note: "فرأوا طائرا عائفا فقالوا: إن هذا الطائر ليدور على ماء"}
      - {motif: settlers-allowed-but-no-right-to-the-water, refs: ["Jāmiʿ 47:4967.1"], note: "نعم، ولكن لا حق لكم في الماء"}
      - {motif: ishmael-learns-arabic-from-jurhum-and-marries-among-them, refs: ["Jāmiʿ 47:4967.1"], note: "وتعلم العربية منهم ... زوجوه امرأة منهم"}
      - {motif: abraham-tests-sons-wives-change-the-threshold, refs: ["Jāmiʿ 47:4967.1"], note: "يغير عتبة بابه ... ذاك أبي وأنتِ العتبة، أمرني أن أمسكك"}
      - {motif: abraham-blesses-meat-and-water-of-mecca, refs: ["Jāmiʿ 47:4967.1"], note: "اللهم بارك لهم في اللحم والماء ... ولم يكن لهم يومئذ حب"}
      - {motif: abraham-ishmael-raise-foundations-of-house, refs: ["Jāmiʿ 47:4967.1"], note: "فعند ذلك رفعا القواعد من البيت ... ربنا تقبل منا"}
      - {motif: abraham-stands-on-stone-while-building, refs: ["Jāmiʿ 47:4967.1"], note: "جاء بهذا الحجر فوضعه له، فقام عليه وهو يبني"}
    hints:
      - "Abraham visits Ishmael's home twice in his absence, the first wife told to have him change the threshold ('atabat babihi), the second to keep it, against Pirqe de-Rabbi Eliezer 30, where Abraham tells Ishmael's first wife to have him change the tent-peg and blesses the second."
      - "Water in the wilderness: an angel digs with his heel and the mother runs seven times between two hills, against Gen 21:19, where God opens Hagar's eyes and she sees a well."
  - id: hadith-47-ishmael-first-arabic
    tradition: islam
    corpus: hadith
