    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Ishmael first to speak clear Arabic
    read: ["Jāmiʿ 47:4969.1"]
    quran: ["19:54-55"]
    tags:
      - {motif: ishmael-first-to-speak-clear-arabic, refs: ["Jāmiʿ 47:4969.1"], note: "أول من فتق الله لسانه بالعربية المبينة إسماعيل"}
  - id: hadith-47-ishmael-the-archer
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Shoot, sons of Ishmael, your father was an archer
    read: ["Jāmiʿ 47:4971.1-4971.2"]
    quran: []
    tags:
      - {motif: sons-of-ishmael-your-father-was-an-archer, refs: ["Jāmiʿ 47:4971.1", "Jāmiʿ 47:4971.2"], note: "ارموا بني إسماعيل، فإن أباكم كان راميا ... ارموا وأنا معكم كلكم"}
    hints:
      - "Ishmael the archer: 'your father was an archer (raamiyan)' against Gen 21:20, 'he became an archer' (rove qashet) in the wilderness."
  - id: hadith-47-the-sacrifice-and-the-pillars
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Satan at the ritual stations, the son on his forehead, the white ram (Ibn Abbas)
    read: ["Jāmiʿ 47:4971.3"]
    quran: ["37:99-107", "11:71"]
    tags:
      - {motif: satan-obstructs-abraham-at-ritual-stations, refs: ["Jāmiʿ 47:4971.3"], note: "عرض له الشيطان عند المسعى فسابقه فسبقه إبراهيم ... فرماه بسبع حصيات حتى ذهب"}
      - {motif: laid-on-forehead-for-slaughter, refs: ["Jāmiʿ 47:4971.3"], note: "قد تله للجبين"}
      - {motif: son-asks-to-be-shrouded-in-his-shirt, refs: ["Jāmiʿ 47:4971.3"], note: "وعلى إسماعيل قميص أبيض وقال: يا أبت إنه ليس لي ثوب تكفنني فيه غيره، فاخلعه"}
      - {motif: white-horned-ram-appears-behind, refs: ["Jāmiʿ 47:4971.3"], note: "فنودي من خلفه ... فالتفت إبراهيم، فإذا هو بكبش أبيض أقرن أعين"}
    hints:
      - "The voice from behind and the ram found on turning, against Gen 22:13, 'he lifted his eyes and saw, and behold a ram behind him (ahar) caught in the thicket by its horns'."
      - "Satan opposing Abraham on the way to the sacrifice, against Gen. Rab. 56:4 (Samael meets Abraham on the road to Moriah and argues with him)."
  - id: hadith-47-noblest-joseph
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: The noble son of the noble, Joseph; people are mines
    read: ["Jāmiʿ 47:4973.1-4974.1", "Jāmiʿ 47:4976.1-4976.2", "Jāmiʿ 47:4977.1"]
    quran: ["37:112-113", "11:69-73", "6:84", "12:7", "40:34"]
    tags:
      - {motif: noble-son-of-noble-fourfold, refs: ["Jāmiʿ 47:4973.1", "Jāmiʿ 47:4976.2"], note: "الكريم ابن الكريم ابن الكريم ابن الكريم: يوسف بن يعقوب بن إسحاق بن إبراهيم"}
      - {motif: joseph-prophet-son-of-prophets-of-gods-friend, refs: ["Jāmiʿ 47:4974.1", "Jāmiʿ 47:4976.1", "Jāmiʿ 47:4977.1"], note: "فأكرم الناس يوسف نبي الله ابن نبي الله ابن نبي الله ابن خليل الله"}
      - {motif: people-are-mines, refs: ["Jāmiʿ 47:4974.1", "Jāmiʿ 47:4976.1", "Jāmiʿ 47:4977.1"], note: "الناس معادن، خيارهم في الجاهلية، خيارهم في الإسلام إذا فقهوا"}
  - id: hadith-47-doubt-lot-and-joseph
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: More right to doubt than Abraham; Lot's strong support; Joseph's prison
    read: ["Jāmiʿ 47:4975.1"]
    quran: ["2:260", "11:74-83", "12:50"]
    tags:
      - {motif: we-have-more-right-to-doubt-than-abraham, refs: ["Jāmiʿ 47:4975.1"], note: "نحن أحق بالشك من إبراهيم إذ قال: رب أرني كيف تحيي الموتى"}
      - {motif: lot-wishes-for-strong-support, refs: ["Jāmiʿ 47:4975.1"], note: "ويرحم الله لوطا لقد كان يأوي إلى ركن شديد"}
      - {motif: joseph-declined-release-from-prison, refs: ["Jāmiʿ 47:4975.1"], note: "ولو لبثت في السجن طول ما لبث يوسف لأجبت الداعي"}
  - id: hadith-47-aisha-and-jacobs-patience
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Aisha in the slander affair takes Jacob as her likeness
    read: ["Jāmiʿ 47:4976.3"]
    quran: ["12:18", "24:11-20"]
    tags:
      - {motif: accused-wife-likens-herself-to-jacob, refs: ["Jāmiʿ 47:4976.3"], note: "إني والله لا أجد مثلا إلا أبا يوسف"}
      - {motif: jacob-beautiful-patience, refs: ["Jāmiʿ 47:4976.3"], note: "فصبر جميل والله المستعان على ما تصفون"}
  - id: hadith-47-women-of-joseph-and-years-of-joseph
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: You are the women of Joseph; years like Joseph's
    read: ["Jāmiʿ 47:4977.2-4978.3"]
    quran: ["12:7"]
    tags:
      - {motif: you-are-the-women-of-joseph, refs: ["Jāmiʿ 47:4977.2", "Jāmiʿ 47:4978.1", "Jāmiʿ 47:4978.2"], note: "مري أبا بكر فليصل بالناس، فإنكن صواحب يوسف ... رجل رقيق إذا قرأ غلبه البكاء"}
      - {motif: years-like-the-years-of-joseph, refs: ["Jāmiʿ 47:4978.3"], note: "اللهم اشدد وطأتك على مضر، اللهم اجعلها سنين كسني يوسف"}
    hints:
      - "'Years like the years of Joseph' as a curse of famine on Mudar, against Gen 41:30, 54, the seven years of famine."
  - id: hadith-47-joseph-in-third-heaven
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Joseph met in the third heaven, given half of beauty
    read: ["Jāmiʿ 47:4978.4-4979.1"]
    quran: []
    tags:
      - {motif: gatekeeper-of-heaven-asks-who-is-with-you, refs: ["Jāmiʿ 47:4978.4"], note: "قيل: من هذا؟ قيل: جبريل قيل: من معك؟ قيل: محمد قيل: وقد أرسل إليه؟"}
      - {motif: prophets-placed-in-the-heavens, refs: ["Jāmiʿ 47:4978.4"], note: "فأتينا السماء الثالثة ... فأتيت على يوسف"}
      - {motif: welcome-as-righteous-brother-or-son, refs: ["Jāmiʿ 47:4978.4"], note: "مرحبا بك من أخ ونبي"}
      - {motif: joseph-given-half-of-beauty, refs: ["Jāmiʿ 47:4979.1"], note: "فإذا أنا بيوسف إذا هو قد أُعطيَ شطرَ الحسن"}
    hints:
      - "Joseph's beauty quantified as 'half of beauty', against Gen 39:6, 'Joseph was beautiful of form and beautiful of appearance'."
  - id: hadith-47-job-and-the-golden-locusts
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Golden locusts fall on Job as he bathes
    read: ["Jāmiʿ 47:4979.2-4980.1"]
    quran: ["6:84", "21:83", "38:41"]
    tags:
      - {motif: golden-locusts-rain-on-bathing-job, refs: ["Jāmiʿ 47:4979.2", "Jāmiʿ 47:4980.1"], note: "بينما أيوب يغتسل عريانا خرَّ عليه رجل جراد من ذهب فجعل يحثي في ثوبه ... ولكن لا غنى لي عن بركتك"}
    hints:
      - "Gold given to Job after his healing, against Job 42:11, where each visitor gives him a qesita and a ring of gold."
  - id: hadith-47-not-better-than-jonah
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: None may say he is better than Jonah son of Matta
    read: ["Jāmiʿ 47:4981.1-4982.4"]
