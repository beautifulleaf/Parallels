      - {motif: neither-believe-nor-deny-people-of-the-book, refs: ["Jāmiʿ 60:6769.2"], note: "كان أهل الكتاب يقرؤون التوراة بالعبرانية، ويفسرونها بالعربية ... لا تصدقوا أهل الكتاب ولا تكذبوهم وقولوا: آمنا باللَّه وما أنزل إلينا"}
    hints:
      - "Pre-existence 'while Adam was between clay' against the rabbinic list of things created or conceived before the world, including 'the name of the Messiah' (b. Pesahim 54a; Gen. Rabbah 1:4)."
  - id: hadith-60-change-of-qibla
