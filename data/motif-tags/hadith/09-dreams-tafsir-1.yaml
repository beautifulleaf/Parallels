      - {motif: congregation-turns-to-kaaba-mid-prayer, refs: ["Jāmiʿ 60:6770.1", "Jāmiʿ 60:6771.1", "Jāmiʿ 60:6771.2"], note: "فمر على أهل المسجد وهم راكعون ... فداروا كما هم قبل البيت ... وهم ركوع في صلاه الفجر، وقد صلوا ركعة ... فمالوا كما هو نحو القبلة"}
      - {motif: dead-before-qibla-change-not-lost, refs: ["Jāmiʿ 60:6770.1", "Jāmiʿ 60:6770.2"], note: "كيف بإخواننا الذين ماتوا وهم يصلون إلى بيت المقدس؟ فأنزل اللَّه تعالى: وما كان اللَّه ليضيع إيمانكم"}
      - {motif: community-testifies-for-noah, refs: ["Jāmiʿ 60:6771.3"], note: "يدعى نوح يوم القيامة ... فيقال لأمته: هل بلغكم؟ فيقولون: ما أتانا من نذير، فيقول: من يشهد لك؟ فيقول: محمد وأمته ... الوسط العدل"}
  - id: hadith-60-remembrance-and-calamity
