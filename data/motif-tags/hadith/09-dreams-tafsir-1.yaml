      - {motif: change-of-qibla, refs: ["Jāmiʿ 60:6770.1", "Jāmiʿ 60:6771.1", "Jāmiʿ 60:6771.2"], note: "أنزل اللَّه على النبي ﷺ قرآنا أن يستقبل الكعبة"}
