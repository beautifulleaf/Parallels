      - {motif: fought-until-there-was-no-fitna, refs: ["Jāmiʿ 60:6787.2"], note: "قاتلنا حتى لم تكن فتنة وكان الدين للَّه، وأنتم تريدون أن تقاتلوا حتى تكون فتنة"}
      - {motif: perdition-is-staying-with-property, refs: ["Jāmiʿ 60:6788.1", "Jāmiʿ 60:6788.2", "Jāmiʿ 60:6789.1"], note: "فكانت التهلكة الإقامة على الأموال وإصلاحها، وتركنا الغزو ... نزلت في النفقة"}
      - {motif: despair-of-forgiveness-is-perdition, refs: ["Jāmiʿ 60:6789.2", "Jāmiʿ 60:6790.1"], note: "هو الرجل يصيب الذنوب فيلقي بيده إلى التهلكة يقول: لا توبة لي ... لا يغفر اللَّه لي"}
  - id: hadith-60-pilgrimage
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Pilgrimage - the lice ransom, tamattu', rafath defined, provision, markets, Arafa and the Hums, the days of Mina
    read: ["Jāmiʿ 60:6790.2-6793.2"]
    quran: ["2:196", "2:197", "2:198", "2:199", "2:201", "2:203"]
    tags:
      - {motif: lice-on-face-fast-three-or-feed-six, refs: ["Jāmiʿ 60:6790.2"], note: "حملت إلى النبي ﷺ والقمل يتناثر على وجهي ... صم ثلاثة أيام، أو أطعم ستة مساكين، لكل مسكين نصف صاع من طعام، واحلق رأسك"}
      - {motif: tamattu-never-forbidden-by-quran-or-prophet, refs: ["Jāmiʿ 60:6790.3"], note: "أنزلت آية المتعة في كتاب اللَّه، ففعلناها مع رسول اللَّه ﷺ، ولم ينزل قرآن يحرمه ... قال رجل برأيه ما شاء"}
      - {motif: rafath-fusuq-jidal-defined, refs: ["Jāmiʿ 60:6791.1"], note: "الرفث الإعرابة والتعرض للنساء بالجماع، والفسوق المعاصي كلها، والجدال جدال الرجل صاحبه"}
      - {motif: pilgrims-without-provision-called-themselves-trusters, refs: ["Jāmiʿ 60:6791.2"], note: "كان أهل اليمن يحجون ولا يتزودون، ويقولون: نحن المتوكلون، فإذا قدموا مكة سألوا الناس"}
      - {motif: trade-at-pilgrimage-markets-allowed, refs: ["Jāmiʿ 60:6791.3"], note: "كانت عكاظ ومجنة وذو المجاز أسواقا في الجاهلية، فتأثموا أن يتجروا في المواسم"}
      - {motif: camel-hirer-still-has-a-pilgrimage, refs: ["Jāmiʿ 60:6792.1"], note: "إني رجل أكري في هذا الوجه ... أليس تحرم وتلبي، وتطوف البيت، وتفيض من عرفات، وترمي الجمار؟ ... لك حج"}
      - {motif: hums-stood-at-muzdalifa-not-arafa, refs: ["Jāmiʿ 60:6792.2", "Jāmiʿ 60:6792.3"], note: "كانت قريش ومن دان دينها يقفون بالمزدلفة، وكانوا يسمون الحمس، وكان سائر العرب يقفون بعرفات"}
