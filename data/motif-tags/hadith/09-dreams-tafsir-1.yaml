      - {motif: ransom-for-fast-abrogated-kept-for-aged, refs: ["Jāmiʿ 60:6779.1", "Jāmiʿ 60:6779.2"], note: "كان من أراد أن يفطر ويفتدي، حتى نزلت الآية التي بعدها فنسختها ... ليست منسوخة، هو الشيخ الكبير، والمرأة الكبيرة ... فليطعمان مكان كل يوم مسكينا"}
      - {motif: no-blame-between-fasters-and-breakers-on-journey, refs: ["Jāmiʿ 60:6780.1"], note: "فيصوم الصائم ويفطر المفطر، فلا يعيب بعضهم على بعض"}
      - {motif: fast-and-break-by-crescent-or-thirty, refs: ["Jāmiʿ 60:6780.2", "Jāmiʿ 60:6780.3"], note: "لا تصوموا حتى تروا الهلال، ولا تفطروا حتى تروه، فإن غم عليكم فاقدروا له ... فعدوا ثلاثين"}
  - id: hadith-60-fast-nights
