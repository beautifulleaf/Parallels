      - {motif: begin-with-what-god-began-with, refs: ["Jāmiʿ 60:6774.2"], note: "أبدأ بما بدأ اللَّه به فبدأ بالصفا، فرقي عليه حتى رأى البيت ... حتى إذا انصبت قدماه في بطن الوادي سعى"}
  - id: hadith-60-rivals-good-food-lawful-dead
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
