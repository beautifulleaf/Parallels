# Hadith chunk 9: al-Jāmiʿ al-Kāmil book 58 (dreams and their interpretation, pp. 6638-6668)
# and book 60 (tafsir) pp. 6731-6819: al-Fatiha and al-Baqara to 2:268. Read in full from the Arabic.
# Pages 6665-6668 are the title, imprint and publisher pages of vol. 10 (no hadith).
new_motifs:
  # ---- dreams: status and kinds
  good-dream-one-of-forty-six-parts-of-prophecy: {label: "The good dream of the believer is one part of forty-six parts of prophecy", cluster: dreams}
  good-dream-one-of-seventy-parts-of-prophecy: {label: "The good (true) dream is one part of seventy parts of prophecy", cluster: dreams}
  only-glad-tidings-remain-of-prophecy: {label: "Messengership and prophecy are cut off; only the glad tidings (al-mubashshirat), the good dream, remain", cluster: dreams}
  glad-tidings-of-this-life-are-good-dreams: {label: "The 'glad tidings in this life' are the good dream a believer sees or that is seen for him", cluster: dreams}
  satan-cannot-take-the-prophets-form-in-dream: {label: "Whoever sees the prophet in a dream has seen him, for Satan cannot take his form", cluster: dreams}
  three-kinds-of-dreams: {label: "Dreams are three: terrors from Satan, what a man is preoccupied with awake, and a part of prophecy", cluster: dreams}
  dreams-truer-as-the-hour-nears: {label: "When time draws near (the end), the believer's dream hardly ever lies; the most truthful in speech has the truest dreams", cluster: dreams}
  fetter-in-dream-is-firmness-in-religion: {label: "In a dream the leg-fetter (qayd) is liked as firmness in religion and the neck-shackle (ghull) disliked", cluster: dreams}
  good-dream-from-god-bad-dream-from-satan: {label: "The good dream (ru'ya) is from God, the bad dream (hulm) from Satan", cluster: dreams}
  spit-to-left-three-times-after-bad-dream: {label: "After a disliked dream one spits or blows lightly to the left three times and seeks refuge in God; it will not harm", cluster: dreams}
  turn-to-other-side-after-bad-dream: {label: "After a disliked dream one turns over from the side one was lying on", cluster: dreams}
  rise-and-pray-after-bad-dream: {label: "After a disliked dream one rises and prays and tells no one", cluster: dreams}
  tell-good-dream-only-to-a-loved-one: {label: "A liked dream is told only to one who loves the dreamer; a disliked one to no one", cluster: dreams}
  satan-toying-in-sleep-not-to-be-told: {label: "A frightening dream is Satan's toying with the sleeper and must not be told to people", cluster: dreams}
  dream-of-own-head-cut-off-rolling: {label: "A man dreams his head is struck off and rolls away and he runs after it", cluster: dreams}
  dream-liar-made-to-tie-two-barley-grains: {label: "Whoever claims a dream he did not see is made to tie a knot between two barley grains, and cannot", cluster: dreams}
  molten-lead-in-ears-of-eavesdropper: {label: "Whoever listens to people's talk against their will has molten lead (anuk) poured into his ears on the Day of Resurrection", cluster: punishment}
  image-maker-made-to-breathe-life: {label: "The maker of an image is punished and charged to breathe a spirit into it, which he cannot", cluster: punishment}
  greatest-lie-to-show-eyes-unseen: {label: "Among the greatest lies: to claim another father, to make one's eyes see what they did not see, to say of the prophet what he did not say", cluster: ethics}
  concurring-dreams-locate-night-of-decree: {label: "Several companions' dreams agree that the Night of Decree is in the last seven nights", cluster: dreams}
  sea-raiders-like-kings-on-thrones: {label: "In a midday dream the prophet sees raiders of his community riding the sea's crest like kings on thrones", cluster: dreams}
  woman-asks-to-be-among-the-sea-raiders: {label: "A woman asks to be among the sea raiders, is told she is among the first, and dies thrown from her mount after the crossing", cluster: dreams}
  tell-dream-only-to-scholar-or-adviser: {label: "Tell a dream only to a learned man or a sincere adviser", cluster: dreams}
  dream-falls-as-it-is-interpreted: {label: "A dream comes to pass as it is interpreted, like a man who has lifted his foot and waits to set it down", cluster: dreams}
  interpret-dreams-for-good: {label: "Interpret a Muslim's dream for good, for the dream turns out as its interpreter reads it", cluster: dreams}
  broken-house-pillar-and-one-eyed-son-dream: {label: "A wife dreams her house pillar breaks and she bears a one-eyed son; read for good the husband returns, read for ill he dies", cluster: dreams}
  # ---- the prophet's dreams
  dream-land-of-palms-is-medina: {label: "The prophet dreams he emigrates to a land of palms; he thinks it al-Yamama or Hajar but it is Medina", cluster: dreams}
  dream-sword-breaks-then-is-restored: {label: "The prophet shakes a sword in a dream and its front breaks (the losses of Uhud); shaken again it is whole (the victory)", cluster: dreams}
  dream-slaughtered-cows-are-slain-believers: {label: "Cows (slaughtered) seen in the prophet's dream are the believers killed at Uhud", cluster: dreams}
  dream-strong-armour-is-medina: {label: "The prophet sees himself in a strong coat of mail and reads it as Medina", cluster: dreams}
  tooth-stick-handed-to-the-elder: {label: "In a dream the prophet gives his tooth-stick to the younger of two men and is told 'the elder!'", cluster: dreams}
  gold-bracelets-blown-away-are-two-liars: {label: "Two gold bracelets on the prophet's arms are blown away at a revealed command and read as two lying claimants (of San'a and al-Yamama)", cluster: dreams}
  keys-of-earths-treasures-placed-in-hand: {label: "In sleep the prophet is brought the keys of the treasures of the earth and they are put in his hand", cluster: dreams}
  night-of-decree-shown-then-forgotten: {label: "The prophet is shown the Night of Decree and then made to forget it", cluster: dreams}
  two-visitors-lead-dreamer-on-a-tour: {label: "Two visitors come by night, raise the dreamer and lead him from scene to scene, explaining nothing until the end", cluster: dreams}
  head-crushed-with-rock-for-neglecting-prayer: {label: "A man's head is smashed with a rock, heals and is smashed again: he took the Quran and rejected it and slept through prayer", cluster: punishment}
  cheek-torn-to-nape-for-the-liar: {label: "An iron hook tears a man's mouth-corner, nostril and eye back to the nape, side after side: he spread a lie that reached the horizons", cluster: punishment}
  naked-adulterers-in-an-oven-of-flame: {label: "Naked men and women in an oven-like pit cry out when flame comes up from below: the adulterers", cluster: punishment}
  usurer-swims-red-river-fed-stones: {label: "A man swims in a river red as blood and a man on the bank feeds him a stone each time he returns: the eater of usury", cluster: punishment}
  abraham-in-meadow-with-children-who-died-on-fitra: {label: "A very tall man in a meadow surrounded by children is Abraham with every child who died on the natural disposition, the polytheists' children too", cluster: eschatology}
  city-of-gold-and-silver-bricks: {label: "A city built of bricks of gold and bricks of silver, opened at request", cluster: eschatology}
  half-fair-half-ugly-washed-in-white-river: {label: "Men half fair and half ugly fall into a river white as milk and come out wholly fair: those who mixed good and bad deeds, forgiven", cluster: eschatology}
  palace-like-white-cloud-is-prophets-dwelling: {label: "The prophet is shown his dwelling, a palace like a white cloud in the Garden of Eden, but may not enter it yet", cluster: eschatology}
  epidemic-as-black-woman-leaving-the-city: {label: "A black woman with dishevelled hair leaves Medina and settles at Mahya'a: the epidemic moved to al-Juhfa", cluster: dreams}
  jesus-seen-circling-kaaba-hair-dripping: {label: "In a dream at the Kaaba the prophet sees the Messiah son of Mary, brown, his combed locks dripping water, leaning on two men and circling the House", cluster: dreams}
  dajjal-blind-right-eye-like-floating-grape: {label: "The Dajjal is a curly-haired man blind in the right eye, the eye like a floating grape, most like Ibn Qatan", cluster: eschatology}
  bride-shown-in-silk-by-an-angel: {label: "An angel shows the prophet his future wife wrapped in a piece of silk, twice or three nights: 'if this is from God he will bring it about'", cluster: dreams}
  shirt-length-is-religion: {label: "People in shirts of various lengths pass before the prophet; one's trailing shirt is read as religion", cluster: dreams}
  surplus-milk-given-is-knowledge: {label: "The prophet drinks milk until he sees the moisture flow from his nails and gives the rest to another: knowledge", cluster: dreams}
  palace-in-paradise-and-owners-jealousy: {label: "The prophet sees a woman making ablution beside a companion's palace in paradise and turns away, remembering his jealousy", cluster: dreams}
  drawing-water-weak-then-strong: {label: "Drawing water at a well: the first successor draws one or two buckets weakly, the second's bucket becomes huge and he waters everyone", cluster: dreams}
  fresh-dates-of-ibn-tab-read-as-good-religion: {label: "Fresh dates of the Ibn Tab variety read as exaltation in this world, well-being in the next, and that 'our religion has become good (tab)'", cluster: dreams}
  white-clothes-in-dream-sign-not-of-fire: {label: "A dead man seen in white clothes is taken as not being of the people of the fire", cluster: dreams}
  white-sheep-enter-black-flock-non-arabs: {label: "Many white sheep enter a black flock: the non-Arabs will share your religion and lineage; faith hung on the Pleiades would be reached by them", cluster: dreams}
  # ---- companions' dreams
  hell-cased-like-a-well: {label: "In a dream two angels take a young companion to the fire, cased like a well, with people he knows in it; another angel says 'you will not be harmed'", cluster: dreams}
  silk-cloth-flies-to-any-place-in-paradise: {label: "A piece of silk in the dreamer's hand flies with him to any place in paradise he points it to", cluster: dreams}
  iron-pillar-from-earth-to-sky-with-handhold: {label: "In a meadow an iron pillar stands from earth to sky with a handhold (urwa) at the top; the dreamer is lifted up and grips it: Islam until death", cluster: dreams}
  paths-of-left-and-right-and-mountain-of-martyrs: {label: "The dreamer is turned from the paths on the left (companions of the left) to the right; a mountain he cannot climb is the abode of martyrs", cluster: dreams}
  flowing-spring-is-dead-mans-deeds: {label: "A flowing spring seen for a dead man is his deeds still flowing for him", cluster: dreams}
  canopy-dripping-ghee-and-honey-is-quran: {label: "A canopy drips ghee and honey that people catch in their palms (the Quran), and a rope from sky to earth is climbed by successive men, one breaking and reconnected", cluster: dreams}
  interpreter-right-in-part-wrong-in-part: {label: "The prophet tells his companion's dream-reading 'you were right in part and wrong in part' and refuses to say which", cluster: dreams}
  dream-foretells-twelve-martyrs-of-a-raid: {label: "A woman dreams twelve men in dark clothes with gushing jugulars are dipped in a river of paradise and come out faces like the full moon; the raid's news confirms all twelve", cluster: dreams}
  ghee-and-honey-on-two-fingers-two-books: {label: "Ghee on one finger and honey on another, licked in a dream: you will read the two books, the Torah and the Furqan", cluster: dreams}
  dream-forbids-what-god-wills-and-muhammad-wills: {label: "A companion dreams that Jews and Christians reproach Muslims for saying 'what God wills and Muhammad wills'; the prophet then forbids the phrase", cluster: dreams}
  limb-of-prophet-in-house-foretells-grandson: {label: "A woman dreams a limb of the prophet is in her house: his daughter will bear a boy whom she will nurse", cluster: dreams}
  boys-urine-sprinkled-girls-washed: {label: "A girl's urine is washed off, water is only poured over a boy's", cluster: purity}
  bucket-from-sky-drunk-by-three-successors: {label: "A bucket let down from the sky: the first drinks weakly, the second to his fill, the third's bucket is jerked away and splashes him", cluster: dreams}
  scale-from-sky-weighs-the-successors: {label: "A scale comes down from the sky and weighs the prophet against the first successor, then each against the next, then is lifted up", cluster: dreams}
  # ---- al-Fatiha
  prayer-interrupted-to-answer-the-prophet: {label: "A companion at prayer does not answer the prophet's call and is reminded 'Answer God and the Messenger when he calls you'", cluster: ritual}
  no-sura-like-it-in-torah-gospel-psalms: {label: "No sura like al-Fatiha was sent down in the Torah, the Gospel, the Psalms or the Furqan", cluster: revelation}
  fatiha-as-healing-charm-for-sting: {label: "A companion recites al-Fatiha as a charm over a stung chief, who recovers; he is paid thirty sheep and the prophet takes a share", cluster: healing}
  greeting-returned-only-after-purification: {label: "The prophet, having relieved himself, does not return a greeting three times until he has purified himself, then returns it three times", cluster: ritual}
  door-of-heaven-opened-angel-brings-two-lights: {label: "A door of heaven opened for the first time; an angel who never came down before brings 'two lights' no prophet had: al-Fatiha and the end of al-Baqara", cluster: revelation}
  prayer-without-fatiha-is-defective: {label: "A prayer without the Mother of the Quran is defective (khidaj), three times, incomplete", cluster: ritual}
  prayer-divided-between-god-and-servant: {label: "God has divided the prayer in halves between himself and his servant and answers each verse of al-Fatiha in turn", cluster: ritual}
  amin-coinciding-with-angels-forgives: {label: "Say 'amin' when the imam ends al-Fatiha; whose amin coincides with the angels' is forgiven his past sins", cluster: ritual}
  wrath-on-jews-astray-christians: {label: "Those who incur wrath are the Jews, those astray the Christians", cluster: polemic}
  # ---- al-Baqara: merits
  angels-like-canopy-of-lamps-listen-to-recitation: {label: "As a companion recites at night his horse shies three times; a canopy with lamps in it rises out of sight: angels listening, who would have been seen at dawn", cluster: angels}
  satan-flees-house-where-baqara-recited: {label: "Do not make your houses graves: Satan flees the house where al-Baqara is recited", cluster: demonology}
  book-written-two-thousand-years-before-creation: {label: "God wrote a book two thousand years before creating heavens and earth and sent down from it the two verses ending al-Baqara; no devil approaches a house where they are read three nights", cluster: revelation}
  empty-house-without-scripture-is-emptiest: {label: "The emptiest house is the hollow empty of God's book; do not sit legs crossed singing and leave al-Baqara", cluster: ethics}
  closing-verses-of-baqara-suffice-the-night: {label: "Whoever recites the two last verses of al-Baqara at night, they suffice him", cluster: ritual}
  three-gifts-at-the-lote-tree: {label: "At the Lote-Tree of the Boundary the prophet is given three things: the five prayers, the end of al-Baqara, and forgiveness of grave sins for those who associate nothing", cluster: ascent}
  closing-verses-from-treasury-under-throne: {label: "The closing verses of al-Baqara are given from a treasure-house beneath the Throne, given to no prophet before", cluster: revelation}
  throne-verse-greatest-verse: {label: "The Throne Verse is the greatest verse in God's book", cluster: revelation}
  throne-verse-after-each-prayer: {label: "Whoever recites the Throne Verse after every prescribed prayer, only death stands between him and paradise", cluster: ritual}
  two-suras-as-clouds-or-bird-flocks-pleading: {label: "Al-Baqara and Al Imran come on the Day of Resurrection like two clouds, two shades, or two flocks of birds in ranks, pleading for their companion", cluster: eschatology}
  quran-meets-reader-as-pale-man-at-grave: {label: "The Quran meets its companion as his grave splits open like a pale man: 'I made you thirsty in the noon heat and kept you awake'", cluster: eschatology}
  reader-crowned-parents-clothed-climbs-by-reciting: {label: "The Quran reader is given kingship in his right hand and eternity in his left, a crown of dignity; his parents are clothed; he climbs paradise's steps as long as he recites", cluster: eschatology}
  seven-long-suras-make-a-scholar: {label: "Whoever takes up the first seven (long) suras is a learned man (hibr)", cluster: revelation}
  moses-given-six-two-lifted-when-tablets-thrown: {label: "The prophet is given seven of the long mathani, Moses six; when Moses threw down the tablets two were lifted and four remained", cluster: revelation}
  suras-given-in-place-of-earlier-books: {label: "The seven long suras are given in place of the Torah, the mi'un in place of the Psalms, the mathani in place of the Gospel, and the mufassal as extra", cluster: revelation}
  # ---- al-Baqara: tafsir
  sin-leaves-black-spot-on-heart: {label: "A sin is a black spot on the heart; repentance polishes it; if sins increase the spot spreads: that is the ran", cluster: ethics}
  trials-presented-to-hearts-like-reed-mat: {label: "Trials are presented to hearts like a reed mat strand by strand; a heart that drinks them gets a black spot, one that refuses a white, until there are two hearts", cluster: ethics}
  heart-is-the-morsel-that-governs-the-body: {label: "In the body is a morsel which, sound or corrupt, makes the whole body so: the heart; between lawful and unlawful lie doubtful things like pasture round a king's preserve", cluster: ethics}
  beneficial-downpour-said-at-rain: {label: "On seeing rain the prophet says 'a beneficial downpour (sayyiban nafi'an)'", cluster: prayer}
  greatest-sins-rival-child-killing-neighbours-wife: {label: "The greatest sin is to set up a rival to God who created you; then to kill your child fearing he will eat with you; then adultery with your neighbour's wife", cluster: law}
  gods-right-on-servants-and-theirs-on-him: {label: "God's right on his servants is that they worship him and associate nothing; theirs on him is that he not punish them", cluster: theology}
  what-god-wills-then-you-will: {label: "Not 'what God wills and you will' but 'what God wills, then you will'; swear 'by the Lord of the Kaaba', not 'by the Kaaba'", cluster: theology}
  people-of-paradise-do-not-excrete: {label: "The people of paradise eat and drink but do not spit, urinate, defecate or blow their noses; food leaves as belching and musk-sweat; praise is inspired in them like breath", cluster: eschatology}
  best-words-chosen-for-the-angels: {label: "The best words are those God chose for his angels: subhan allah wa-bi-hamdih", cluster: angels}
  satan-weeps-when-man-prostrates: {label: "When a man prostrates at a prostration verse Satan withdraws weeping: he was commanded and obeyed and has paradise, I was commanded and refused and have the fire", cluster: demonology}
  preacher-entrails-spill-turns-like-donkey-at-mill: {label: "A man thrown into the fire has his bowels spill out and turns round them like a donkey at a millstone: he commanded good and did not do it", cluster: punishment}
  preachers-lips-cut-with-fire-shears: {label: "On the night journey the prophet sees people whose lips are cut with shears of fire: preachers who commanded piety and forgot themselves", cluster: punishment}
  truffle-is-of-the-manna: {label: "The truffle is of the manna God sent down on the Children of Israel, and its water is a cure for the eye", cluster: healing}
  israelites-shuffle-on-buttocks-say-grain-in-hair: {label: "Told to enter the gate prostrating and say hitta, the Israelites go in shuffling on their buttocks and say 'a grain in a hair (habba fi sha'ra)'", cluster: punishment-stories}
  unlettered-nation-month-twenty-nine-or-thirty: {label: "We are an unlettered nation, we neither write nor reckon; the month is so and so, twenty-nine or thirty", cluster: calendar}
  angels-would-seize-the-one-who-treads-on-prophets-neck: {label: "Had the enemy carried out his threat to tread on the praying prophet's neck the angels would have seized him openly", cluster: angels}
  jews-wishing-death-would-die-and-see-their-seats: {label: "Had the Jews wished for death they would have died and seen their seats in the fire; those who came to imprecation would have found no family or wealth", cluster: polemic}
  three-questions-only-a-prophet-knows: {label: "A rabbi tests the prophet with three questions only a prophet knows: the first sign of the Hour, the first food of paradise, why a child resembles father or mother", cluster: polemic}
  first-food-of-paradise-fish-liver-lobe: {label: "The first food of the people of paradise is the extra lobe of a fish's liver", cluster: eschatology}
  fire-drives-people-east-to-west-first-sign: {label: "The first sign of the Hour is a fire that gathers people from the east to the west", cluster: eschatology}
  child-resembles-parent-whose-fluid-precedes: {label: "If the man's fluid precedes the woman's the child takes after him; if hers precedes, after her", cluster: embryology}
  gabriel-the-jews-enemy-among-angels: {label: "Gabriel is called the enemy of the Jews among the angels; had another angel been the prophet's patron they would have followed him", cluster: polemic}
  convert-slandered-by-his-own-people: {label: "A rabbi's people praise him as 'our best and son of our best' until he declares his faith, then call him 'our worst'", cluster: polemic}
  companion-refuses-to-drop-anything-heard: {label: "A companion refuses to drop anything he heard from the prophet; he is answered with the verse on abrogation", cluster: revelation}
  question-that-causes-a-prohibition: {label: "The worst offender among Muslims is one who asks about a thing not forbidden, which is then forbidden because of his question", cluster: law}
  prayer-on-mount-facing-any-direction: {label: "Travelling, the prophet prays on his mount facing wherever it faces", cluster: ritual}
  umar-agreed-with-his-lord-in-three: {label: "Umar 'agreed with his Lord' in three things: the Station of Abraham as place of prayer, the veiling of the prophet's wives, and the warning to them", cluster: revelation}
  abraham-stands-on-stone-while-ishmael-hands-stones: {label: "Abraham builds the House on a mound while Ishmael brings stones; when it rises Abraham stands on 'this stone', both saying 'Our Lord, accept from us'", cluster: abraham}
  kaaba-not-on-abrahams-foundations: {label: "The prophet's people rebuilt the Kaaba short of Abraham's foundations; he would restore them but for their recent unbelief", cluster: sacred-space}
  seal-of-prophets-while-adam-in-clay: {label: "The prophet was God's servant and seal of the prophets while Adam lay prostrate in his clay", cluster: prophecy}
  prayer-of-abraham-tidings-of-jesus-mothers-vision: {label: "The prophet is the prayer of Abraham, the good news of Jesus, and his mother's vision", cluster: prophecy}
  light-from-mother-lights-syrian-palaces: {label: "When pregnant the prophet's mother saw a light come out of her that lit the palaces of Syria (Busra)", cluster: prophecy}
  uncle-is-twin-of-father: {label: "A man's paternal uncle is the twin trunk (sinw) of his father", cluster: law}
  neither-believe-nor-deny-people-of-the-book: {label: "When the People of the Book read the Torah in Hebrew and explain it in Arabic, neither believe nor deny them, say 'We believe in God and what was sent down to us'", cluster: polemic}
  prayer-toward-jerusalem-sixteen-or-seventeen-months: {label: "In Medina the prophet prays toward Jerusalem sixteen or seventeen months, wishing to face the House", cluster: ritual}
  congregation-turns-to-kaaba-mid-prayer: {label: "A man announces the change of qibla and a congregation turns toward the Kaaba while in the middle of the prayer, bowing", cluster: ritual}
  dead-before-qibla-change-not-lost: {label: "Those who died praying toward Jerusalem: 'God would not let your faith (your prayer) be lost'", cluster: ritual}
  community-testifies-for-noah: {label: "On Resurrection Noah says he delivered the message, his people deny it, and Muhammad and his community bear witness for him; wasat means just", cluster: eschatology}
  god-as-servant-thinks-span-cubit-running: {label: "I am as my servant thinks of me; if he draws near a span I draw near a cubit, a cubit a fathom, if he comes walking I come running", cluster: theology}
  calamity-formula-brings-better-replacement: {label: "Whoever says at a calamity 'To God we belong and to him we return; O God reward me and replace it with better' is given better", cluster: prayer}
  hardship-expiates-even-a-thorn: {label: "No toil, illness, worry or grief befalls a Muslim, even a thorn's prick, without God expiating his sins by it", cluster: ethics}
  ansar-shunned-safa-marwa-for-manat: {label: "The Ansar, who had dedicated pilgrimage to the idol Manat at al-Mushallal, felt it wrong to go between Safa and Marwa", cluster: idolatry}
  begin-with-what-god-began-with: {label: "Reciting the Safa verse the prophet says 'I begin with what God began with', climbs Safa till he sees the House, and runs in the valley bottom", cluster: ritual}
  death-calling-on-rival-means-fire: {label: "Who dies calling on a rival besides God enters the fire; who dies associating nothing enters paradise", cluster: theology}
  god-good-accepts-only-good: {label: "God is good and accepts only good; a dishevelled traveller raising his hands 'O Lord' whose food, drink and clothes are unlawful is not answered", cluster: prayer}
  two-dead-things-two-bloods-lawful: {label: "Two dead things and two bloods are lawful: locusts and fish, liver and spleen", cluster: law}
  best-charity-while-healthy-and-greedy: {label: "The best charity is given while healthy and greedy, fearing poverty, not delayed until the soul reaches the throat", cluster: ethics}
  give-the-beggar-even-a-burnt-hoof: {label: "If you have nothing for the poor man at your door, put even a burnt hoof in his hand", cluster: ethics}
  brave-shelter-behind-prophet-in-battle: {label: "When the fighting grew red the companions sheltered behind the prophet; the brave one stood level with him", cluster: warfare}
  tooth-for-tooth-oath-honoured: {label: "A woman breaks a girl's front tooth; retaliation is ordered, her brother swears it will not be broken, the family forgives: some, if they swear by God, he fulfils it", cluster: law}
  israel-had-retaliation-without-blood-money: {label: "Among the Children of Israel there was retaliation but no blood-money; this community is allowed the blood-money as a lightening", cluster: law}
  mecca-lawful-for-an-hour-only: {label: "God held back the elephant from Mecca; it was made lawful to the prophet for an hour of one day and to no one before or after", cluster: sacred-space}
  will-written-before-two-nights-pass: {label: "A Muslim with something to bequeath should not pass two nights without his will written by him", cluster: law}
  bequest-limited-to-one-third: {label: "A dying man may bequeath a third, 'and a third is much'; better to leave heirs rich than begging", cluster: law}
  ashura-fast-optional-after-ramadan: {label: "The prophet had ordered the Ashura fast; once Ramadan was prescribed, whoever wished fasted it", cluster: ritual}
  ransom-for-fast-abrogated-kept-for-aged: {label: "Feeding a poor man instead of fasting was allowed until the next verse abrogated it; the aged who cannot fast feed one poor man a day", cluster: ritual}
  fast-and-break-by-crescent-or-thirty: {label: "Do not fast until you see the crescent nor break until you see it; if clouded, complete thirty", cluster: calendar}
  no-blame-between-fasters-and-breakers-on-journey: {label: "On journeys with the prophet some fasted and some did not, and none blamed the other", cluster: ritual}
  you-call-one-not-deaf-or-absent: {label: "Do not shout: you are not calling one deaf or absent but one hearing and near, who is with you", cluster: prayer}
  sleep-before-iftar-forbade-food-till-next-night: {label: "At first a faster who slept before breaking his fast could not eat until the next evening; a labourer faints at midday and the permission is revealed", cluster: ritual}
  intercourse-after-sleep-on-fast-night-confessed: {label: "A companion lies with his wife after she (or he) had slept on a fast night and confesses; the verse 'God knew you were betraying yourselves' is revealed", cluster: ritual}
  black-and-white-cords-under-pillow: {label: "A companion puts a black and a white hobbling cord under his pillow to see the dawn threads; 'your pillow is wide', it is the black of night and white of day", cluster: ritual}
  min-al-fajr-sent-down-later: {label: "Men tied white and black threads to their legs until 'of the dawn' was sent down later", cluster: revelation}
  night-from-here-day-goes-from-here: {label: "When night comes from here and day goes from here and the sun has set, the faster has broken his fast", cluster: ritual}
  in-retreat-head-combed-through-door: {label: "In retreat in the mosque the prophet puts his head into the house to have it combed and enters only for need", cluster: ritual}
  judge-ruling-on-false-plea-is-piece-of-fire: {label: "I am only human; if I rule for one more eloquent with his brother's right, I cut him a piece of the fire", cluster: law}
  hums-use-doors-others-enter-from-back: {label: "Pilgrims in ihram entered houses from the back; the Hums (Quraysh) used the doors; a companion follows the prophet out of a door", cluster: ritual}
  rules-of-raid-no-mutilation-no-child-killing: {label: "Raid in God's name: do not steal from the spoils, betray, mutilate or kill a child", cluster: warfare}
  fought-until-there-was-no-fitna: {label: "We fought until there was no fitna and religion was God's; you want to fight until there is fitna", cluster: warfare}
  perdition-is-staying-with-property: {label: "Perdition was the Ansar's staying to mend their property and leaving the raid, not a man charging the enemy ranks", cluster: warfare}
  despair-of-forgiveness-is-perdition: {label: "Throwing oneself into perdition is the sinner who says 'there is no repentance for me', 'God will not forgive me'", cluster: ethics}
  lice-on-face-fast-three-or-feed-six: {label: "A pilgrim with lice falling on his face may shave and fast three days, feed six poor half a sa' each, or sacrifice a sheep", cluster: ritual}
  tamattu-never-forbidden-by-quran-or-prophet: {label: "The verse of tamattu' was sent down and practised with the prophet; nothing forbade it till he died; a man said what he wished by his own opinion", cluster: law}
  rafath-fusuq-jidal-defined: {label: "Rafath is approaching women for intercourse, fusuq all sins, jidal a man's quarrelling with his companion", cluster: ritual}
  pilgrims-without-provision-called-themselves-trusters: {label: "Yemenis came on pilgrimage without provisions calling themselves 'those who trust (al-mutawakkilun)' and begged at Mecca", cluster: ritual}
  trade-at-pilgrimage-markets-allowed: {label: "Ukaz, Majanna and Dhu l-Majaz were pre-Islamic markets; trading in the pilgrimage season is permitted", cluster: ritual}
  camel-hirer-still-has-a-pilgrimage: {label: "A man who hires out camels on the pilgrimage road still has a valid pilgrimage", cluster: ritual}
  hums-stood-at-muzdalifa-not-arafa: {label: "Quraysh and their followers, the Hums, stood at Muzdalifa while the rest of the Arabs stood at Arafat", cluster: ritual}
  naked-circumambulation-except-in-hums-clothes: {label: "In the Jahiliyya people circled the House naked unless the Hums gave them clothes", cluster: ritual}
  most-frequent-prayer-good-in-both-worlds: {label: "The prophet's most frequent prayer: 'Our Lord, give us good in this world and in the next and guard us from the fire'", cluster: prayer}
  hajj-is-arafa-mina-three-days: {label: "The pilgrimage is Arafa; whoever arrives before dawn of the night of Jam' has it; the days of Mina are three", cluster: ritual}
  most-hated-the-fierce-disputant: {label: "The most hateful of men to God is the fierce, skilled disputant", cluster: ethics}
  sale-profited-of-one-who-sold-himself: {label: "Of the emigrant who gave up his wealth to the pursuers: 'Abu Yahya, the sale has profited'", cluster: ethics}
  paradise-mostly-poor-hell-mostly-women: {label: "Most who enter paradise are the poor, the rich are held back; most who enter the fire are women", cluster: eschatology}
  poor-man-better-than-earthful-of-notables: {label: "A poor Muslim no one would marry or hear is better than an earthful of a notable", cluster: ethics}
  ten-centuries-between-adam-and-noah: {label: "Adam was a prophet spoken to; between him and Noah were ten centuries", cluster: primeval}
  earlier-believers-combed-with-iron-sawn-in-two: {label: "Believers before you were combed with iron combs to the bone and had saws set on their heads and split in two without leaving their religion", cluster: martyrdom}
  rider-safe-from-sana-to-hadramawt: {label: "A rider will travel from San'a to Hadramawt fearing only God and the wolf for his sheep", cluster: eschatology}
  sealed-orders-opened-at-destination: {label: "The leader of a raid is given a letter not to be read until he reaches a certain place, and told to compel no one", cluster: warfare}
  wine-poured-out-at-news-of-prohibition: {label: "On hearing the herald that wine is forbidden the drinkers have the jars poured out and never ask again", cluster: law}
  every-intoxicant-is-wine-and-forbidden: {label: "Every intoxicant is wine and every intoxicant forbidden; who drinks it addicted and unrepentant will not drink it in the hereafter", cluster: law}
  upper-hand-better-begin-with-dependents: {label: "The upper hand is better than the lower; begin with those you support; charity from surplus", cluster: ethics}
  jews-isolate-the-menstruant: {label: "The Jews would not eat with a menstruating woman nor be with her in the house; 'do everything except intercourse'", cluster: purity}
  jews-say-rear-entry-makes-child-squint: {label: "The Jews said that if a man comes to his wife from behind the child will be cross-eyed", cluster: marriage}
  wife-asks-prophet-before-yielding: {label: "An Ansari wife refuses her husband's way of intercourse until she asks the prophet; too shy, she leaves and the prophet's wife asks for her", cluster: marriage}
  verse-occasion-disputed-in-ibn-umar-reports: {label: "Reports from Ibn Umar differ on what 'your women are tillage' was revealed about; his freedman denies one version and gives Quraysh's practice meeting the Ansar's Jewish-derived custom", cluster: marriage}
  one-opening-any-position: {label: "Coming to one's wife from front or behind is allowed, in the one opening; avoid the anus and menstruation", cluster: marriage}
  wives-rights-and-husbands-rights-farewell-sermon: {label: "Fear God in women: you took them in God's trust; they must not let anyone you dislike onto your beds, else a light beating; they are owed provision and clothing", cluster: marriage}
  guardian-blocks-sisters-return-to-ex-husband: {label: "A brother swears never to remarry his sister to the cousin who divorced her; the verse is revealed, he expiates his oath and marries them", cluster: marriage}
  mourning-only-three-days-except-for-husband: {label: "A believing woman mourns no dead beyond three nights except a husband, four months and ten days", cluster: ritual}
  widow-denied-kohl-in-mourning: {label: "A widowed daughter with sore eyes may not use kohl during the waiting period", cluster: ritual}
  jahiliyya-widows-year-in-hut-and-dung-throw: {label: "In the Jahiliyya a widow sat a year in a hovel in her worst clothes, then rubbed herself with an animal (which often died) and threw a piece of dung", cluster: ritual}
  widow-of-unconsummated-marriage-gets-full-dower: {label: "A woman widowed before consummation with no dower fixed gets the full dower, waiting period and inheritance", cluster: law}
  pregnant-widow-free-on-delivery: {label: "A widow who gives birth some nights after her husband's death is free to marry", cluster: law}
  middle-prayer-is-asr: {label: "The middle prayer is the afternoon prayer; enemies who kept the prophet from it till sunset are cursed: 'God fill their graves and houses with fire'", cluster: ritual}
  verse-read-with-and-the-asr-prayer: {label: "The verse was first read 'and the asr prayer', then abrogated; a wife has her scribe write 'and the middle prayer and the asr prayer'", cluster: revelation}
  speech-in-prayer-forbidden: {label: "Companions talked in prayer until 'stand before God devoutly' came and silence was commanded", cluster: ritual}
  long-standing-best-prayer: {label: "The best prayer is the one with the longest standing (qunut)", cluster: ritual}
  fear-prayer-on-foot-or-riding-any-direction: {label: "In greater fear, pray standing on foot or riding, facing the qibla or not", cluster: ritual}
  abrogated-verse-left-in-place: {label: "Asked why an abrogated verse was written, the caliph says he will not move anything from its place", cluster: revelation}
  do-not-enter-or-flee-plague-land: {label: "If you hear of plague in a land do not go to it; if it falls where you are do not flee it", cluster: law}
  badr-number-equals-taluts-crossers: {label: "The men of Badr were as many as those who crossed the river with Talut, only believers, three hundred and ten-odd", cluster: warfare}
  preferred-over-prophets-in-six: {label: "The prophet is preferred over prophets in six: concise speech, victory by terror, spoils made lawful, the earth a mosque and purifier, sent to all, the seal of prophets", cluster: prophecy}
  god-does-not-sleep-veil-of-light: {label: "God does not sleep, nor would it befit him; he lowers and raises the balance; the day's deeds are raised to him by night and the night's by day", cluster: theology}
  ansar-vowed-surviving-sons-to-judaism: {label: "Ansari women whose children died vowed to make a surviving son a Jew; at the expulsion of al-Nadir such sons were among them", cluster: law}
  more-entitled-to-doubt-than-abraham: {label: "'We are more entitled to doubt than Abraham' when he said 'show me how you give life to the dead'", cluster: abraham}
  first-judged-martyr-scholar-giver-for-show: {label: "First judged: a martyr, a scholar-reciter and a generous man, each told 'you did it to be called brave, learned, generous' and dragged on his face into the fire", cluster: eschatology}
  secret-shirk-adorning-prayer-for-viewers: {label: "The hidden associating (shirk al-sara'ir) is a man adorning his prayer for those watching; showing off is the lesser associating", cluster: ethics}
  go-to-those-you-showed-off-to: {label: "On Resurrection God tells the show-offs to go to those they performed for and see if they have any reward", cluster: eschatology}
  garden-parable-is-rich-man-who-sinned-late: {label: "The burned garden of the old man is a parable of a rich man who obeyed God, then Satan was sent and he sinned until he drowned his deeds", cluster: parable}
  bad-date-bunches-hung-in-mosque: {label: "Date bunches were hung in the mosque for the poor; some hung bunches of bad and broken dates, and the verse on giving the good was revealed", cluster: ethics}
  david-ate-from-his-own-handiwork: {label: "No one eats better food than from his own hands' work; the prophet David ate from his own handiwork", cluster: prophecy}
  do-not-count-or-hoard-lest-god-count: {label: "Spend and do not count, lest God count against you; do not hoard, lest he hoard against you", cluster: ethics}
  gods-full-hand-never-diminished: {label: "God's hand is full, spending day and night never lessens it; his throne was on the water and in his hand the balance", cluster: theology}
units:
  # ============== book 58: dreams
  - id: hadith-58-dreams-and-prophecy
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: True dreams at the start of revelation; the good dream a fraction of prophecy; the glad tidings of Q 10:64
    read: ["Jāmiʿ 58:6638.1-6641.2"]
    quran: ["10:64"]
    tags:
      - {motif: true-dreams-like-daybreak-before-revelation, refs: ["Jāmiʿ 58:6638.1"], note: "الرؤيا الصادقة في النوم، فكان لا يرى رؤيا إلا جاءت مثل فلق الصبح"}
      - {motif: only-glad-tidings-remain-of-prophecy, refs: ["Jāmiʿ 58:6638.2", "Jāmiʿ 58:6639.4"], note: "لم يبق من النبوة إلا المبشرات ... إن الرسالة والنبوة قد انقطعت، فلا رسول بعدي، ولا نبي ... لكن المبشرات"}
      - {motif: good-dream-one-of-forty-six-parts-of-prophecy, refs: ["Jāmiʿ 58:6638.3", "Jāmiʿ 58:6639.1", "Jāmiʿ 58:6639.2", "Jāmiʿ 58:6639.3", "Jāmiʿ 58:6640.1", "Jāmiʿ 58:6641.2"], note: "رؤيا المؤمن جزء من ستة وأربعين جزء من النبوة"}
      - {motif: good-dream-one-of-seventy-parts-of-prophecy, refs: ["Jāmiʿ 58:6640.2", "Jāmiʿ 58:6640.3"], note: "الرؤيا الصالحة جزء من سبعين جزء من النبوة (Ibn Umar, Ibn Masud)"}
      - {motif: satan-cannot-take-the-prophets-form-in-dream, refs: ["Jāmiʿ 58:6639.3"], note: "من رآني في المنام فقد رآني، فإن الشيطان لا يتمثل بي"}
      - {motif: glad-tidings-of-this-life-are-good-dreams, refs: ["Jāmiʿ 58:6641.1", "Jāmiʿ 58:6641.2"], note: "لهم البشرى في الحياة الدنيا ... هي الرؤيا الصالحة يراها المؤمن أو ترى له"}
      - {motif: spit-to-left-three-times-after-bad-dream, refs: ["Jāmiʿ 58:6641.2"], note: "ومن رأى سوى ذلك فإنما هو الشيطان ليحزنه، فلينفث عن يساره ثلاثا، وليسكت"}
    hints:
      - "The fraction 'one part of forty-six (or seventy) of prophecy' against b. Berakhot 57b, where a dream is 'one sixtieth of prophecy' (ehad mi-shishim li-nevu'ah)."
  - id: hadith-58-three-kinds-of-dream
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: The three kinds of dream; dreams truer near the end; fetter liked, shackle disliked
    read: ["Jāmiʿ 58:6642.1-6642.2"]
    quran: []
    tags:
      - {motif: three-kinds-of-dreams, refs: ["Jāmiʿ 58:6642.1", "Jāmiʿ 58:6642.2"], note: "منها أهاويل من الشيطان ليحزن بها ابن آدم، ومنها ما يهم به الرجل في يقظته فيراه في منامه، ومنها جزء من ستة وأربعين جزء من النبوة"}
      - {motif: dreams-truer-as-the-hour-nears, refs: ["Jāmiʿ 58:6642.2"], note: "إذا اقترب الزمان لم تكد تكذب رؤيا المؤمن"}
      - {motif: rise-and-pray-after-bad-dream, refs: ["Jāmiʿ 58:6642.2"], note: "فمن رأى شيئًا يكرهه فلا يقصه على أحد، وليقم فليصل"}
      - {motif: fetter-in-dream-is-firmness-in-religion, refs: ["Jāmiʿ 58:6642.2"], note: "وكان يكره الغل في النوم، وكان يعجبهم القيد، ويقال: القيد ثبات في الدين"}
    hints:
      - "'What a man is preoccupied with awake he sees in sleep' against b. Berakhot 55b: a man is shown in his dream only the thoughts of his heart (hirhurei libbo)."
  - id: hadith-58-disliked-dream-remedy
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: What to do after a disliked dream - spit left thrice, seek refuge, turn over, tell no one
    read: ["Jāmiʿ 58:6643.1-6645.1"]
    quran: []
    tags:
      - {motif: good-dream-from-god-bad-dream-from-satan, refs: ["Jāmiʿ 58:6643.1", "Jāmiʿ 58:6644.1", "Jāmiʿ 58:6644.2", "Jāmiʿ 58:6644.4"], note: "الرؤيا الصالحة من اللَّه، والحلم من الشيطان"}
      - {motif: spit-to-left-three-times-after-bad-dream, refs: ["Jāmiʿ 58:6643.1", "Jāmiʿ 58:6644.1", "Jāmiʿ 58:6644.2", "Jāmiʿ 58:6644.3", "Jāmiʿ 58:6645.1"], note: "فليتفل عن يساره ثلاثا ... فليبصق عن يساره ثلاثا، وليستعذ باللَّه من الشيطان ثلاثا"}
      - {motif: turn-to-other-side-after-bad-dream, refs: ["Jāmiʿ 58:6644.1", "Jāmiʿ 58:6644.3"], note: "وليتحول عن جنبه الذي كان عليه"}
      - {motif: tell-good-dream-only-to-a-loved-one, refs: ["Jāmiʿ 58:6643.1", "Jāmiʿ 58:6644.4"], note: "فإذا رأى أحدكم ما يحب فلا يحدث بها إلا من يحب ... فليحمد اللَّه عليها، وليحدث بها"}
    hints:
      - "The remedy for a troubling dream against b. Berakhot 55b, where the dreamer has the dream 'made good' (hatavat halom) before three friends and recites verses of turning curse to blessing."
  - id: hadith-58-satan-toying-in-sleep
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: The bedouin whose head rolled away in a dream; Satan's toying is not to be told
    read: ["Jāmiʿ 58:6645.2-6645.4"]
    quran: []
    tags:
      - {motif: dream-of-own-head-cut-off-rolling, refs: ["Jāmiʿ 58:6645.2", "Jāmiʿ 58:6645.4"], note: "رأيت في المنام كأن رأسي ضرب، فتدحرج، فاشتددت على إثره ... رأسي ضرب، فرأيته يتدهده"}
      - {motif: satan-toying-in-sleep-not-to-be-told, refs: ["Jāmiʿ 58:6645.2", "Jāmiʿ 58:6645.3", "Jāmiʿ 58:6645.4"], note: "لا تحدث الناس بتلعب الشيطان بك في منامك ... يعمد الشيطان إلى أحدكم، فيتهول له"}
      - {motif: satan-cannot-take-the-prophets-form-in-dream, refs: ["Jāmiʿ 58:6645.3"], note: "إنه لا ينبغي للشيطان أن يتمثل في صورتي"}
  - id: hadith-58-lying-about-dreams
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: The dream-liar and the barley grains; lead in the eavesdropper's ears; the image-maker
    read: ["Jāmiʿ 58:6646.1-6646.3"]
    quran: []
    tags:
      - {motif: dream-liar-made-to-tie-two-barley-grains, refs: ["Jāmiʿ 58:6646.1"], note: "من تحلم بحلم لم يره كلف أن يعقد بين شعيرتين، ولن يفعل"}
      - {motif: molten-lead-in-ears-of-eavesdropper, refs: ["Jāmiʿ 58:6646.1"], note: "صب في أذنيه الآنك يوم القيامة"}
      - {motif: image-maker-made-to-breathe-life, refs: ["Jāmiʿ 58:6646.1"], note: "ومن صور صورة عذب وكلف أن ينفخ فيها وليس بنافخ"}
      - {motif: greatest-lie-to-show-eyes-unseen, refs: ["Jāmiʿ 58:6646.2", "Jāmiʿ 58:6646.3"], note: "من أفرى الفرى أن يري عينيه ما لم تر ... أن يدعي الرجل إلى غير أبيه"}
  - id: hadith-58-concurring-dreams-and-day-dreams
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Concurring dreams of the Night of Decree; Umm Haram and the sea raiders seen at a midday nap
    read: ["Jāmiʿ 58:6647.1-6647.2"]
    quran: []
    tags:
      - {motif: concurring-dreams-locate-night-of-decree, refs: ["Jāmiʿ 58:6647.1"], note: "إني أرى رؤياكم قد تواطأت في السبع الأواخر"}
      - {motif: sea-raiders-like-kings-on-thrones, refs: ["Jāmiʿ 58:6647.2"], note: "ناس من أمتي عرضوا علي غزاة في سبيل اللَّه يركبون ثبج هذا البحر ملوكا على الأسرة"}
      - {motif: woman-asks-to-be-among-the-sea-raiders, refs: ["Jāmiʿ 58:6647.2"], note: "أنت من الأولين ... فركبت البحر في زمن معاوية فصرعت عن دابتها حين خرجت من البحر فهلكت"}
  - id: hadith-58-seeing-the-prophet
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Whoever sees the prophet in a dream has seen the truth
    read: ["Jāmiʿ 58:6648.1-6648.3"]
    quran: []
    tags:
      - {motif: satan-cannot-take-the-prophets-form-in-dream, refs: ["Jāmiʿ 58:6648.1", "Jāmiʿ 58:6648.2", "Jāmiʿ 58:6648.3"], note: "من رآني فقد رأى الحق، فإن الشيطان لا يتكونني"}
  - id: hadith-58-telling-and-interpreting
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Tell a dream only to the learned; it falls as interpreted; the woman whose house pillar broke
    read: ["Jāmiʿ 58:6649.1-6650.1"]
    quran: []
    tags:
      - {motif: tell-dream-only-to-scholar-or-adviser, refs: ["Jāmiʿ 58:6649.1", "Jāmiʿ 58:6649.2"], note: "لا تقصوا الرؤيا إلا على عالم أو ناصح"}
      - {motif: dream-falls-as-it-is-interpreted, refs: ["Jāmiʿ 58:6649.2"], note: "إن الرؤيا تقع على ما تعبر، ومثل ذلك مثل رجل رفع رجله، فهو ينتظر متى يضعها"}
      - {motif: broken-house-pillar-and-one-eyed-son-dream, refs: ["Jāmiʿ 58:6650.1"], note: "أن سارية بيتي انكسرت، وأني ولدت غلامًا أعور ... ليموتن زوجك وتلدين غلامًا فاجرًا"}
      - {motif: interpret-dreams-for-good, refs: ["Jāmiʿ 58:6650.1"], note: "إذا عبرتم للمسلم الرؤيا فاعبروها على الخير، فإن الرؤيا تكون على ما يعبرها صاحبها"}
    hints:
      - "The dream that 'falls as it is interpreted' against b. Berakhot 55b-56a: 'all dreams follow the mouth' (kol ha-halomot holekhin ahar ha-peh), with Gen 41:13 'as he interpreted to us, so it was'; the twenty-four Jerusalem interpreters each read one dream differently and all came true."
  - id: hadith-58-prophets-dreams-hijra-uhud
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: The prophet's dreams of the land of palms, the sword, the cows and the armour; the tooth-stick
