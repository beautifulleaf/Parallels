      - {motif: bequest-limited-to-one-third, refs: ["Jāmiʿ 60:6778.3"], note: "أوصي بمالي كله؟ قال: لا قلت: فالشطر؟ قال: لا قلت: الثلث؟ قال: الثلث والثلث كثير، إنك أن تدع ورثتك أغنياء خير من أن تدعهم عالة"}
  - id: hadith-60-prescribed-fast
