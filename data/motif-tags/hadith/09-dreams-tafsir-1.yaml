    read: ["Jāmiʿ 60:6775.1-6776.1"]
    quran: ["2:165", "2:172", "23:51", "2:173"]
    tags:
      - {motif: death-calling-on-rival-means-fire, refs: ["Jāmiʿ 60:6775.1", "Jāmiʿ 60:6775.2"], note: "من مات وهو يدعو من دون اللَّه ندا دخل النار ... من مات لا يشرك باللَّه شيئًا دخل الجنة"}
      - {motif: god-good-accepts-only-good, refs: ["Jāmiʿ 60:6775.3"], note: "إن اللَّه طيب لا يقبل إلا طيبا ... الرجل يطيل السفر، أشعث أغبر، يمد يديه إلى السماء، يا رب يا رب، ومطعمه حرام"}
      - {motif: two-dead-things-two-bloods-lawful, refs: ["Jāmiʿ 60:6776.1"], note: "أحلت لنا ميتتان ودمان: الجراد والحيتان، والكبد والطحال"}
    hints:
      - "Locusts and fish as permitted 'dead' things against m. Hullin 3:7 and Lev 11:9-22, where fish and certain locusts are clean and need no slaughter (b. Hullin 27b), and the liver as permitted though full of blood (b. Hullin 109a)."
  - id: hadith-60-piety-giving
