      - {motif: give-the-beggar-even-a-burnt-hoof, refs: ["Jāmiʿ 60:6776.3"], note: "إن لم تجدي شيئًا تعطينه إياه، إلا ظلفا محرقا فادفعيه إليه في يده"}
