      - {motif: calamity-formula-brings-better-replacement, refs: ["Jāmiʿ 60:6772.2"], note: "إنا للَّه وإنا إليه راجعون، اللهم أجرني في مصيبتي، وأخلف لي خيرًا منها ... فأخلف اللَّه لي رسول اللَّه ﷺ"}
      - {motif: hardship-expiates-even-a-thorn, refs: ["Jāmiʿ 60:6773.1", "Jāmiʿ 60:6773.2"], note: "من يرد اللَّه به خيرًا يصب منه ... حتى الشوكة يشاكها إلا كفر اللَّه بها من خطاياه"}
  - id: hadith-60-safa-and-marwa
