  - id: hadith-60-retaliation
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Retaliation - the broken tooth and the oath; Mecca lawful for an hour; blood-money a lightening Israel did not have
    read: ["Jāmiʿ 60:6777.2-6778.1"]
    quran: ["2:178"]
    tags:
      - {motif: tooth-for-tooth-oath-honoured, refs: ["Jāmiʿ 60:6777.2"], note: "كسرت ثنية جارية ... أتكسر ثنية الربيع؟ ... يا أنس، كتاب اللَّه القصاص ... إن من عباد اللَّه من لو أقسم على اللَّه لأبره"}
      - {motif: mecca-lawful-for-an-hour-only, refs: ["Jāmiʿ 60:6777.3"], note: "إن اللَّه حبس عن مكة الفيل ... وإنها أحلت لي ساعة من نهار ... لا يختلى شوكها، ولا يعضد شجرها"}
      - {motif: blood-money-pardon-option, refs: ["Jāmiʿ 60:6777.3", "Jāmiʿ 60:6778.1"], note: "ومن قتل له قتيل فهو بخير النظرين: إما يودى وإما يقاد ... فالعفو أن يقبل الدية في العمد"}
      - {motif: israel-had-retaliation-without-blood-money, refs: ["Jāmiʿ 60:6778.1"], note: "كان في بني إسرائيل القصاص ولم تكن فيهم الدية ... ذلك تخفيف من ربكم ورحمة مما كتب على من كان قبلكم"}
      - {motif: qisas-free-for-free-slave-for-slave, refs: ["Jāmiʿ 60:6778.1"], note: "كتب عليكم القصاص في القتلى"}
    hints:
      - "Israel had retaliation and no blood-money against Num 35:31: 'you shall accept no ransom (kofer) for the life of a murderer'; and the tooth case against Exod 21:24 'tooth for tooth'."
  - id: hadith-60-bequest
