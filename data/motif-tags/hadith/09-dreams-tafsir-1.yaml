      - {motif: you-call-one-not-deaf-or-absent, refs: ["Jāmiʿ 60:6782.1"], note: "اربعوا على أنفسكم، إنكم ليس تدعون أصم ولا غائبا، إنكم تدعون سميعا قريبًا وهو معكم"}
      - {motif: nearness-of-the-hearing-god, refs: ["Jāmiʿ 60:6782.1"], note: "تدعون سميعا قريبًا"}
      - {motif: marital-relations-permitted-fast-nights, refs: ["Jāmiʿ 60:6782.2", "Jāmiʿ 60:6782.3", "Jāmiʿ 60:6784.1"], note: "كانوا لا يقربون النساء رمضان كله ... أحل لكم ليلة الصيام الرفث إلى نسائكم"}
      - {motif: sleep-before-iftar-forbade-food-till-next-night, refs: ["Jāmiʿ 60:6782.3", "Jāmiʿ 60:6783.1", "Jāmiʿ 60:6783.2"], note: "فنام قبل أن يفطر لم يأكل ليلته ولا يومه حتى يمسي ... فغلبته عيناه ... فلما انتصف النهار غشي عليه ... إذا صلوا العتمة حرم عليهم الطعام والشراب والنساء"}
      - {motif: intercourse-after-sleep-on-fast-night-confessed, refs: ["Jāmiʿ 60:6783.2", "Jāmiʿ 60:6783.3", "Jāmiʿ 60:6784.1"], note: "فوجد امرأته قد نامت، فأرادها، فقالت: إني قد نمت، قال: ما نمت، ثم وقع بها ... فأنزل اللَّه تعالى: علم اللَّه أنكم كنتم تختانون أنفسكم"}
      - {motif: fast-white-thread-black-thread, refs: ["Jāmiʿ 60:6784.2", "Jāmiʿ 60:6785.1"], note: "حتى يتبين لكم الخيط الأبيض من الخيط الأسود من الفجر"}
      - {motif: black-and-white-cords-under-pillow, refs: ["Jāmiʿ 60:6784.2"], note: "عمدت إلى عقال أسود وإلى عقال أبيض فجعلتها تحت وسادتي ... إنما ذلك سواد الليل وبياض النهار"}
      - {motif: min-al-fajr-sent-down-later, refs: ["Jāmiʿ 60:6785.1"], note: "ولم ينزل: من الفجر فكان رجال إذا أرادوا الصوم ربط أحدهم في رجله الخيط الأبيض والخيط الأسود"}
      - {motif: night-from-here-day-goes-from-here, refs: ["Jāmiʿ 60:6785.2"], note: "إذا أقبل الليل من ها هنا، وأدبر النهار من ها هنا، وغربت الشمس فقد أفطر الصائم"}
      - {motif: in-retreat-head-combed-through-door, refs: ["Jāmiʿ 60:6785.3"], note: "ليدخل علي رأسه وهو في المسجد، فأرجله، وكان لا يدخل البيت إلا لحاجة إذا كان معتكفا"}
    hints:
      - "Telling dawn by two colours against m. Berakhot 1:2: the morning Shema may be recited 'from when one can distinguish between blue (tekhelet) and white'."
