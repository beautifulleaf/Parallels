      - {motif: feast-even-with-one-sheep, refs: ["Jāmiʿ 48:5186.1"], note: "وزن نواة من ذهب ... أولم ولو بشاة"}
      - {motif: no-alliance-yet-alliance-in-my-house, refs: ["Jāmiʿ 48:5186.2", "Jāmiʿ 48:5187.2"], note: "لا حلف في الإسلام؟ فقال أنس: قد حالف رسول الله بين قريش والأنصار في داري"}
      - {motif: emigrants-housed-by-lot, refs: ["Jāmiʿ 48:5186.3"], note: "طار له سهمه في السكنى حين أقرعت الأنصار سكنى المهاجرين"}
      - {motif: who-knows-god-honoured-him, refs: ["Jāmiʿ 48:5186.3"], note: "وما يدريك أن الله أكرمه ... والله ما أدري وأنا رسول الله ما يفعل به"}
      - {motif: dream-spring-is-his-deeds, refs: ["Jāmiʿ 48:5186.3"], note: "فأريت لعثمان عينًا تجري ... فقال: ذلك عمله"}
      - {motif: palms-lent-then-returned-after-khaybar, refs: ["Jāmiʿ 48:5187.3"], note: "على أن يعطوهم ثمار أموالهم كل عام ... رد المهاجرون إلى الأنصار منائحهم"}
      - {motif: helpers-fear-taking-all-the-reward, refs: ["Jāmiʿ 48:5188.1"], note: "حتى لقد خفنا أن يذهبوا بالأجر كله ... لا ما دعوتم الله لهم وأثنيتم عليهم"}
      - {motif: blood-money-written-for-each-clan, refs: ["Jāmiʿ 48:5188.2"], note: "كتب على كل بطن عقولهم ... لا يحل لمسلم أن يتولى مولى رجل مسلم بغير إذنه"}
      - {motif: emigrants-and-helpers-mutual-protectors, refs: ["Jāmiʿ 48:5185.2", "Jāmiʿ 48:5187.1"], note: "للأخوة التي آخى النبي بينهم؛ آخى بين أبي عبيدة بن الجراح وبين أبي طلحة"}
