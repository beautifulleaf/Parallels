new_motifs:
  garment-twisted-round-prophets-neck: {label: "An enemy twists the prophet's garment round his neck and throttles him while he prays at the Ka'ba", cluster: sira}
  defender-quotes-killing-a-man-for-saying-my-lord-is-god: {label: "A companion shields the prophet crying 'Will you kill a man for saying: my Lord is God?' (Q 40:28)", cluster: sira}
  i-have-come-to-you-with-slaughter: {label: "Taunted three times while circling the House, the prophet tells Quraysh 'I have come to you with slaughter (al-dhabh)'", cluster: sira}
  hearers-still-as-if-bird-on-head: {label: "His hearers fall still 'as if a bird were perched on each man's head'", cluster: sira}
  food-only-what-bilal-hides-under-armpit: {label: "Three days and nights with no food for any living thing but what Bilal's armpit could hide", cluster: sira}
  earlier-believers-combed-with-iron-and-sawn-in-two: {label: "Believers before you were combed with iron combs to the bone and sawn in two from the parting of the head, and did not turn from their religion", cluster: martyrdom}
  rider-from-sana-to-hadramawt-fearing-only-god: {label: "The cause will be completed until a rider goes from San'a to Hadramawt fearing only God (and the wolf for his sheep)", cluster: prophecy}
  angel-of-mountains-offers-to-crush-the-town: {label: "Gabriel in a cloud sends the angel of the mountains, who offers to bring the two great mountains (al-akhshabayn) together on the town", cluster: angels}
  prophet-hopes-for-believing-descendants-of-enemies: {label: "The prophet declines the punishment, hoping God will bring from their loins people who worship him alone", cluster: sira}
  hypocrite-covers-nose-from-dust-of-mount: {label: "The chief covers his nose with his cloak from the dust of the prophet's donkey: 'do not raise dust on us'", cluster: sira}
  chief-about-to-be-crowned-when-prophet-came: {label: "The town had agreed to crown its chief and bind him with the turban; the prophet's coming choked him with envy", cluster: sira}
  preacher-in-market-followed-by-stone-thrower: {label: "The prophet preaches 'say: no god but God and prosper' in the fair, followed by his uncle who calls him a liar and stones him till his ankles bleed", cluster: sira}
  stranger-buys-camel-on-trust-face-like-full-moon: {label: "An unknown man takes the travellers' camel on credit; the woman says a face like the full moon would not cheat them", cluster: sira}
  mother-not-liable-for-sons-crime: {label: "'No mother bears the crime of her child' (no blood-vengeance on kin for another's crime)", cluster: law}
  begin-giving-with-mother-father-sister-brother: {label: "'The giving hand is the upper; begin with those you support: your mother, father, sister, brother, then the nearest'", cluster: ethics}
  abuse-turned-on-mudhammam-not-muhammad: {label: "Quraysh curse 'Mudhammam' (the blamed), so their abuse falls on another name than Muhammad (the praised)", cluster: sira}
  gabriel-points-at-each-mocker-and-he-dies: {label: "Gabriel gestures at a vein, the eyes, the head, the belly, the sole of each of five mockers; each dies of that part", cluster: punishment}
  six-poor-companions-asked-to-be-dismissed: {label: "The idolaters ask the prophet to drive away six poor companions who 'dare against us'", cluster: sira}
  seven-years-like-the-seven-of-joseph: {label: "The prophet prays 'O God, seven like the seven (years) of Joseph' against Quraysh; famine follows", cluster: punishment}
  famine-sky-seen-as-smoke: {label: "In the famine they eat hides and carrion and, looking at the sky, see it as smoke: the 'smoke' of Q 44:10", cluster: punishment}
  five-signs-already-passed: {label: "Five (signs) have already passed: the lizam, the Romans, the batsha, the moon, the smoke", cluster: eschatology}
  jinn-and-idolaters-prostrate-at-surat-al-najm: {label: "At the end of Surat al-Najm the prophet prostrated and with him Muslims, idolaters, jinn and men", cluster: ritual}
  envoys-bribe-patriarchs-before-king: {label: "Quraysh's envoys give each patriarch (bitriq) a gift of leather before speaking to the king", cluster: sira}
  refugees-speech-before-the-negus: {label: "Ja'far lists their former ways (idols, carrion, cutting kin, the strong eating the weak) and what the prophet commanded", cluster: sira}
  king-weeps-till-beard-wet-at-maryam: {label: "Hearing the opening of Kaf Ha Ya 'Ayn Sad, the Negus weeps till his beard is wet and his bishops wet their books", cluster: sira}
  from-one-niche-with-moses: {label: "The Negus: 'this and what Moses brought come from one lamp-niche (mishkat)'", cluster: sira}
  jesus-servant-messenger-spirit-word-cast-to-virgin: {label: "Asked about Jesus, the refugees say: God's servant and messenger, his spirit and word cast to the virgin Mary (al-'adhra' al-batul)", cluster: christology}
  king-draws-stick-from-ground-not-a-stick-more: {label: "The Negus picks a stick from the ground: Jesus is not a stick's worth more than what you said", cluster: sira}
  god-took-no-bribe-for-my-kingdom: {label: "The Negus returns the gifts: God took no bribe when he restored my kingdom, so I take none", cluster: sira}
  swimmer-on-inflated-skin-crosses-nile: {label: "The youngest refugee swims the Nile on an inflated waterskin to watch the king's battle and bring news", cluster: sira}
  refugees-refuse-to-prostrate-to-king: {label: "The envoys prostrate to the king; Ja'far greets without prostrating: 'we prostrate to none but God'", cluster: sira}
  king-would-carry-prophets-sandals: {label: "The Negus: but for my kingship I would go to him and carry his sandals and give him water for ablution", cluster: sira}
  ship-blown-to-abyssinia: {label: "Emigrants from Yemen take ship and are cast ashore with the Negus, where they wait with Ja'far until Khaybar", cluster: sira}
  protector-of-the-qara-grants-protection: {label: "Ibn al-Dughunna, chief of the Qara, turns back the emigrating Abu Bakr: 'such as you does not leave nor is driven out', and grants him protection", cluster: sira}
  protection-returned-content-with-gods: {label: "Abu Bakr returns the pagan's protection: 'I am content with the protection of God'", cluster: sira}
  weeping-reciter-in-courtyard-mosque: {label: "Abu Bakr builds a place of prayer in his courtyard, recites weeping, and the idolaters' women and children crowd to watch", cluster: sira}
  shown-the-land-of-palms-between-two-lava-fields: {label: "'I have been shown your place of emigration: a land of palms between two lava fields'", cluster: sira}
  camels-fed-four-months-waiting-for-leave: {label: "Abu Bakr feeds two riding camels on acacia leaves four months, waiting to accompany the prophet", cluster: sira}
  prophet-takes-camel-only-at-a-price: {label: "Offered a camel for the journey, the prophet will take it only 'at the price'", cluster: sira}
  waistband-torn-to-tie-provisions: {label: "Asma' cuts her waistband (nitaq) to tie the provision bag and is called 'she of the two waistbands'", cluster: sira}
  three-nights-in-cave-of-thawr-fed-by-shepherd: {label: "Three nights in the cave of Thawr: a son brings Mecca's news at night, a freedman's flock brings milk, a pagan guide meets them on the third morning", cluster: sira}
  boycott-sworn-at-khayf-of-bani-kinana: {label: "Quraysh swore at the Khayf of Bani Kinana not to marry or trade with Hashim and al-Muttalib until they gave up the prophet", cluster: sira}
  uncle-in-shallows-of-fire-to-ankles: {label: "The protecting uncle is in a shallow (dahdah) of fire reaching his ankles; but for the prophet he would be in the lowest depth", cluster: eschatology}
  sandals-of-fire-make-brain-boil: {label: "The lightest punished: wearing two sandals of fire from which his brain boils", cluster: eschatology}
  dying-uncle-chooses-religion-of-his-father: {label: "Urged by Abu Jahl, the dying uncle's last words: 'on the religion of 'Abd al-Muttalib'", cluster: sira}
  uncle-fears-quraysh-would-say-it-was-fear-of-death: {label: "The uncle would say the formula but that Quraysh would taunt that fear of death made him", cluster: sira}
  taif-prayer-complaint-of-weakness: {label: "Prayer at Ta'if under a tree: 'to you I complain of my weakness ... to whom do you entrust me? If you are not angry with me I do not care'", cluster: prayer}
  ascent-from-roof-opened-at-mecca: {label: "The roof of his house in Mecca is opened and Gabriel descends to take him up", cluster: ascent}
  gold-basin-of-wisdom-and-faith-emptied-into-breast: {label: "A gold basin full of wisdom and faith is emptied into the opened breast and it is closed", cluster: ascent}
  scratching-of-the-pens-heard: {label: "Raised to a level where he hears the scratching of the pens (sarif al-aqlam)", cluster: ascent}
  fifty-prayers-reduced-at-moses-urging: {label: "God imposes fifty prayers; Moses sends the prophet back to ask reduction until five remain", cluster: ascent}
  five-that-are-fifty-word-not-changed: {label: "'They are five and they are fifty; the word with me is not changed'", cluster: ascent}
  ashamed-to-return-to-his-lord: {label: "At the end the prophet will not go back again: 'I am ashamed before my Lord'", cluster: ascent}
  paradise-domes-of-pearl-soil-of-musk: {label: "In paradise are domes (janabidh) of pearl and its soil is musk", cluster: paradise}
  one-of-three-between-two-men: {label: "Asleep at the House he hears 'one of the three, between the two men' and is taken", cluster: ascent}
  buraq-white-beast-stride-to-horizon: {label: "Al-Buraq: a white beast above an ass and below a mule, setting its hoof at the furthest reach of its sight", cluster: ascent}
  moses-weeps-that-the-young-man-surpasses-him: {label: "Moses weeps as he passes: 'this youth sent after me will bring more of his people into paradise than mine'", cluster: ascent}
  four-rivers-from-root-of-the-lote-tree: {label: "From the root (of the lote tree) issue four rivers: two hidden in paradise and two outer, the Nile and the Euphrates", cluster: ascent}
  buraq-tied-at-ring-of-the-prophets: {label: "At Jerusalem he ties al-Buraq to the ring where the prophets tie their mounts and prays two rak'as", cluster: ascent}
  joseph-given-half-of-beauty: {label: "In the third heaven Joseph, who was given half of beauty", cluster: ascent}
  reduced-by-fives: {label: "God takes off five each time; he goes back and forth between his Lord and Moses", cluster: ascent}
  intended-good-written-done-written-tenfold: {label: "A good deed intended is written as one; done, as ten; an evil intended and not done is not written, done is written as one", cluster: theology}
  three-came-to-him-before-revelation: {label: "Three persons come to him sleeping in the Sacred Mosque: 'which is he?' 'the middle one, the best of them'", cluster: ascent}
  prophets-eyes-sleep-hearts-do-not: {label: "His eyes sleep and his heart does not; so prophets' eyes sleep and their hearts do not", cluster: prophecy}
  nile-and-euphrates-flow-in-lowest-heaven: {label: "In the lowest heaven two rivers run: the Nile and Euphrates at their source (unsuruhuma)", cluster: ascent}
  kawthar-river-with-pearl-palace-and-musk: {label: "Another heavenly river with a palace of pearl and chrysolite, its mud of strong musk: al-Kawthar kept for him", cluster: paradise}
  moses-in-seventh-by-gods-speech: {label: "Moses is placed above (in the seventh heaven) 'by the preference of God's speech'; he says 'I did not think anyone would be raised above me'", cluster: ascent}
  jabbar-draws-near-two-bow-lengths: {label: "The Almighty draws near and comes down until he is two bow-lengths or nearer (in the Sharik version)", cluster: ascent}
  prophet-glances-at-gabriel-for-counsel: {label: "Before each return the prophet turns to Gabriel as if to consult him; Gabriel signals 'yes, if you wish'", cluster: ascent}
  backbiters-scratch-faces-with-copper-nails: {label: "On the ascent: people with nails (of copper) scratching their faces and chests: those who eat people's flesh", cluster: eschatology}
  preachers-lips-cut-with-fire-scissors: {label: "People whose lips are cut with scissors of fire: preachers who command piety and forget themselves", cluster: eschatology}
  buraq-balks-then-sweats: {label: "The saddled Buraq balks; Gabriel tells it none nobler has ridden it, and it pours with sweat", cluster: ascent}
  moses-and-jonah-seen-reciting-talbiya: {label: "The prophet sees Moses descending a pass with loud talbiya, and Jonah on a red camel in a wool cloak with palm-fibre halter", cluster: prophecy}
  keeper-of-fire-seen-and-greets-first: {label: "Malik, keeper of the fire, is shown to him; he greets the prophet first", cluster: ascent}
  jerusalem-mosque-brought-before-his-eyes: {label: "Questioned about Jerusalem, the mosque is brought and set before him and he describes it while looking", cluster: ascent}
  hearers-clap-and-hold-heads-at-night-journey: {label: "Quraysh, told of the night journey, clap or put hands on heads in amazement", cluster: ascent}
  hairdresser-drops-comb-says-bismillah: {label: "Combing Pharaoh's daughter, the woman drops the comb and says 'in the name of God': 'my Lord and your father's Lord is God'", cluster: martyrdom}
  mother-and-children-thrown-into-heated-brass-cow: {label: "Pharaoh heats a cow (vessel) of brass and throws the woman's children into it one by one, then her", cluster: martyrdom}
  bones-gathered-in-one-cloth: {label: "The condemned woman asks that her bones and her children's be gathered in one cloth and buried", cluster: martyrdom}
  four-spoke-as-infants: {label: "Four spoke as infants: Jesus, Jurayj's child, Joseph's witness, and the son of Pharaoh's daughter's hairdresser", cluster: wonder}
  pleasant-scent-of-martyrs-in-night-journey: {label: "On the night journey a sweet smell: that of the hairdresser of Pharaoh's daughter and her children", cluster: ascent}
  zaqqum-mocked-as-dates-and-butter: {label: "Abu Jahl mocks the tree of Zaqqum: 'bring dates and butter and stuff yourselves (tazaqqamu)'", cluster: sira}
  dajjal-eye-like-shining-star-hair-like-branches: {label: "The Dajjal: huge, pale-white, one eye standing like a shining star, hair like the branches of a tree", cluster: eschatology}
  vision-was-a-seeing-of-the-eye: {label: "The vision of Q 17:60 'was a seeing of the eye' on the night journey; the cursed tree is Zaqqum", cluster: ascent}
  footsteps-of-bilal-heard-in-paradise: {label: "In paradise he hears a soft step (wajs): 'this is Bilal the muezzin'", cluster: paradise}
  prophets-pray-behind-him-in-aqsa: {label: "In the Aqsa he turns and all the prophets are praying with him (he leads them)", cluster: ascent}
  milk-and-honey-offered: {label: "Two cups, one of milk and one of honey, are offered; he takes the milk: 'you hit the fitra'", cluster: ascent}
  gabriel-resembles-dihya: {label: "Gabriel most resembles Dihya (b. Khalifa)", cluster: angels}
  jesus-resembles-urwa-b-masud: {label: "Jesus most resembles 'Urwa b. Mas'ud", cluster: prophecy}
  no-prayer-in-jerusalem-or-it-would-be-prescribed: {label: "Hudhayfa: he did not pray in Jerusalem that night, or prayer there would have been prescribed as at the ancient House", cluster: ascent}
  why-tie-what-god-subjected: {label: "'They say he tied it - lest it flee from him? The Knower of the unseen subjected it to him'", cluster: ascent}
  gabriel-bores-rock-with-finger-to-tie-buraq: {label: "At Jerusalem Gabriel bores the rock with his finger and tethers al-Buraq to it", cluster: ascent}
  prayers-at-yathrib-madyan-bethlehem: {label: "On the way he dismounts and prays at Yathrib, at Madyan by Moses' tree, and at Bethlehem 'where Jesus was born'", cluster: ascent}
  hell-seen-in-a-valley-like-carpets: {label: "In a valley hell uncovers like spread carpets (zarabi); felt like hot springs", cluster: eschatology}
  caravan-led-by-ash-camel-as-proof: {label: "As proof he names a Quraysh caravan, its lost camel, and its arrival day, led by a grey camel with black sacks; it comes at noon", cluster: ascent}
  abu-bakr-named-siddiq-for-believing-the-journey: {label: "Abu Bakr: 'if he said it, he spoke the truth; I believe him in what is further - news from heaven'; so he was named al-Siddiq", cluster: sira}
  lote-tree-in-sixth-heaven-where-things-stop: {label: "The lote tree is in the sixth heaven: what ascends from earth stops there and what descends from above stops there", cluster: ascent}
  golden-moths-cover-the-lote-tree: {label: "What covers the lote tree is moths (farash) of gold", cluster: ascent}
  three-given-prayers-baqara-end-forgiveness: {label: "He was given three: the five prayers, the end of Surat al-Baqara, and forgiveness of grave sins for those of his community who associate nothing", cluster: ascent}
  lote-fruit-like-jars-leaves-like-elephant-ears: {label: "The lote tree's fruit is like the jars of Hajar, its leaves like elephants' ears", cluster: ascent}
  who-will-carry-me-to-his-people: {label: "At the pilgrim stations: 'who will take me to his people? Quraysh prevent me from conveying my Lord's word'", cluster: sira}
  men-pointed-at-with-fingers-beware-the-quraysh-youth: {label: "Tribesmen are warned 'beware the youth of Quraysh, lest he tempt you', and point at him with their fingers", cluster: sira}
  pledge-to-protect-as-wives-and-children: {label: "Pledge at al-'Aqaba: hear and obey, spend, enjoin good, and protect him as you protect yourselves, wives and children; yours is paradise", cluster: sira}
  youngest-warns-cost-of-the-pledge: {label: "The youngest, As'ad b. Zurara, warns: taking him means parting from all the Arabs, your best killed, the swords biting you", cluster: sira}
  uncle-squints-two-plaits-shouts-he-is-a-liar: {label: "Behind him walks a squinting, fair man with two plaits saying 'he is a sabi', a liar'", cluster: sira}
  allies-among-the-jinn: {label: "Abu Lahab: he would make you strip al-Lat and al-'Uzza from your necks and your allies among the jinn", cluster: sira}
  battle-day-set-before-his-coming: {label: "The day of Bu'ath: God set it before his messenger, the chiefs being killed and the people split before he came", cluster: sira}
  handful-of-pebbles-thrown-in-converts-face: {label: "An elder throws a handful of the valley's pebbles in the face of the youth who says 'this is better than what we came for'", cluster: sira}
  jews-threatened-with-coming-prophet: {label: "The Jews used to threaten the Aws and Khazraj: a prophet is about to be sent; we will follow him and kill you as 'Ad and Iram were killed", cluster: sira}
  pledge-of-the-women-clauses: {label: "Pledge: not to associate, steal, commit adultery, kill your children, bring a fabricated slander, or disobey in good", cluster: law}
  punishment-in-world-is-expiation: {label: "Whoever commits one of these and is punished in this world, it is expiation; if God conceals it, it is with God to pardon or punish", cluster: law}
  praying-toward-kaba-on-the-road-before-the-change: {label: "Al-Bara' b. Ma'rur prays toward the Ka'ba on the road while his fellows pray toward Syria; the prophet: 'you were on a qibla, had you kept to it'", cluster: ritual}
  slip-out-like-sandgrouse-to-the-pledge: {label: "After a third of the night they slip out of their camp 'as the sandgrouse slip out'", cluster: sira}
  seventy-three-men-and-two-women: {label: "At the second 'Aqaba: seventy-three men and two women", cluster: sira}
  blood-is-blood-destruction-is-destruction: {label: "'Blood, blood; destruction, destruction - I am of you and you of me; I war with whom you war, make peace with whom you make peace'", cluster: sira}
  twelve-headmen-nine-and-three: {label: "'Bring out twelve headmen (naqib)': nine from the Khazraj and three from the Aws", cluster: sira}
  dream-sword-broken-and-restored-cows: {label: "In the dream of emigration he brandishes a sword whose edge breaks (Uhud's dead), then it is whole again; and sees cows: the believers of Uhud", cluster: dreams}
  dream-emigration-to-land-of-palms-thought-yamama: {label: "He dreams he emigrates to a land of palms and thinks it Yamama or Hajar, but it is Yathrib", cluster: dreams}
  pity-for-emigrant-who-died-in-mecca: {label: "'O God, carry through my companions' emigration and do not turn them back on their heels; but the pitiable Sa'd b. Khawla' (who died in Mecca)", cluster: sira}
  fever-of-medina-moved-to-juhfa: {label: "'O God, make us love Medina as Mecca or more, bless its sa' and mudd, and move its fever to al-Juhfa'", cluster: prayer}
  feverish-companions-yearn-in-verse-for-mecca: {label: "Feverish in Medina, Bilal recites longing for a night among idhkhir and jalil and the waters of Majanna", cluster: sira}
  dearer-than-mecca-arrival-joy-of-slave-girls: {label: "Medina never rejoiced at anything as at his coming; even the slave-girls said 'the messenger of God has come'", cluster: sira}
  replace-for-me-better-at-calamity: {label: "At calamity say 'we are God's and to him we return; reward me and replace it with better'; God replaced Abu Salama with the prophet", cluster: prayer}
  mother-vows-no-comb-no-shade-until-she-sees-son: {label: "Envoys say the emigrant's mother has vowed no comb shall touch her head nor shade cover her until she sees him", cluster: sira}
  emigrant-lured-back-and-bound-on-the-road: {label: "Asked to change mounts, the emigrant kneels his camel and they seize and bind him and take him to Mecca", cluster: sira}
  verse-sent-written-understood-at-dhu-tuwa: {label: "Umar writes the verse 'O my servants who have transgressed' on a sheet; Hisham reads it up and down at Dhu Tuwa until he understands it is about them", cluster: sira}
  medina-house-of-emigration-and-sunna: {label: "Medina is 'the house of emigration and of the sunna' where the people of understanding gather, unlike the rabble of the season", cluster: sira}
  forty-thirteen-ten-sixty-three: {label: "Sent at forty, thirteen years in Mecca, ten after emigrating, died at sixty-three", cluster: sira}
  mecca-best-land-but-i-was-driven-out: {label: "At al-Hazwara: 'you are the best of God's land and the dearest to God; had I not been driven out I would not have left'", cluster: sira}
  stones-under-cloth-to-calm-blind-grandfather: {label: "Asma' puts stones in the money niche under a cloth and has blind Abu Quhafa feel them, to calm him", cluster: sira}
  first-born-in-islam-chewed-date-first-in-belly: {label: "The first child born in Islam (in Medina): the prophet's chewed date and spittle are the first thing in his belly", cluster: ritual}
  devil-as-elder-of-najd-in-council: {label: "Iblis comes to the council house as an old man of Najd and judges each proposal (prison, banishment) until the killing plan", cluster: sira}
  one-youth-from-each-tribe-blood-scattered: {label: "Abu Jahl: a youth from each clan strikes at once, so his blood is spread among all clans and Hashim must accept blood-money", cluster: sira}
  two-whose-third-is-god: {label: "'What do you think of two whose third is God?' (in the cave, when the pursuers' feet were in view)", cluster: sira}
  he-guides-me-on-the-way: {label: "Asked who rides before him, Abu Bakr says 'he guides me on the way' (meaning the way of good)", cluster: sira}
  pursuer-casts-divining-arrows: {label: "The pursuer draws divining arrows (azlam) from his quiver to ask whether to harm them; the arrow he dislikes comes out, again and again", cluster: divination}
  pursuers-horse-sinks-to-knees: {label: "The pursuer's horse sinks in the ground to its knees (in hard ground to its belly)", cluster: sira}
  smoke-rises-from-horses-forefeet: {label: "As the horse pulls out its forelegs a dust like smoke rises to the sky from their traces", cluster: sira}
  letter-of-safety-on-leather: {label: "The pursuer asks a written safe-conduct; it is written on a piece of leather and later shown at Ji'rana: 'a day of fulfilment'", cluster: sira}
  reward-in-every-moist-liver: {label: "Watering a stray at one's cistern: 'in every moist (lit. hot) liver there is reward'", cluster: ethics}
  milking-shepherds-ewe-after-cleaning-udder: {label: "Abu Bakr has a shepherd clean the ewe's udder and his hands of dust, milks a little and cools the milk with water", cluster: sira}
  virgin-goat-gives-milk-at-his-touch: {label: "A young she-goat never covered (or dry) gives milk when he strokes the udder; 'shrink' and it shrinks", cluster: wonder}
  shepherd-boy-learns-seventy-suras-from-his-mouth: {label: "The shepherd boy ('you are a taught boy') later took seventy suras from his mouth", cluster: sira}
  dry-ewe-of-umm-mabad-milked: {label: "At Umm Ma'bad's tent he strokes the exhausted ewe's udder; it fills a vessel for the company twice", cluster: wonder}
  umm-mabad-describes-the-prophet: {label: "Umm Ma'bad's portrait: radiant face, black eyes, long lashes, hoarse voice, long neck, thick beard, 'a branch between two branches'", cluster: sira}
  unseen-voice-sings-of-two-companions: {label: "A voice heard in Mecca whose speaker is unseen sings of the two companions who stopped at Umm Ma'bad's tent", cluster: sira}
  route-of-the-hijra-named: {label: "The stations of the coastal route are named one by one from Mecca to Quba'", cluster: sira}
  jew-on-tower-sees-them-in-mirage: {label: "A Jew on a tower sees them in white clothes appearing in the mirage and cries 'your fortune (jadd) has come'", cluster: sira}
  abu-bakr-shades-prophet-with-cloak: {label: "When the sun reaches him Abu Bakr shades him with his cloak, and the people then know which is the prophet", cluster: sira}
  bought-land-for-mosque-refusing-gift: {label: "Two orphans offer their date-drying floor as a gift; he refuses and buys it for the mosque", cluster: sira}
  builder-verse-this-load-not-khaybars: {label: "Carrying bricks he says 'this load, not Khaybar's load, is more pious, our Lord, and purer'", cluster: sira}
  only-whole-verse-he-quoted: {label: "Ibn Shihab: he never quoted a complete line of poetry but this one", cluster: sira}
  camel-is-commanded-let-her-go: {label: "'Let her go, she is under command': the camel kneels where the mosque will be", cluster: sira}
  horseman-pursuer-becomes-guard: {label: "The horseman thrown at his prayer asks to be commanded; at the start of the day against him, at its end his guard", cluster: sira}
  three-times-what-if-he-converts: {label: "Asked three times 'what if he becomes Muslim?', the Jews say 'God forbid'; when he comes out they say 'our worst'", cluster: sira}
  three-questions-only-a-prophet-knows: {label: "Three questions only a prophet knows: first sign of the Hour, first food of paradise, why a child resembles father or mother", cluster: prophecy}
  fire-gathers-from-east-to-west: {label: "The first sign of the Hour: a fire that drives people from east to west", cluster: eschatology}
  first-food-of-paradise-lobe-of-fish-liver: {label: "The first food of paradise is the extra lobe of the fish's liver", cluster: paradise}
  child-resembles-parent-whose-water-precedes: {label: "If the man's water precedes, the child takes after the father; if the woman's, after the mother", cluster: anatomy}
  gabriel-enemy-of-jews-among-angels: {label: "Told Gabriel brought the answer, Ibn Salam says: that is the enemy of the Jews among the angels", cluster: angels}
  abyssinians-play-spears-for-joy: {label: "At his arrival the Abyssinians played with their spears for joy", cluster: sira}
  brightest-and-darkest-day: {label: "Anas: no day brighter than the day he entered Medina, none darker than the day he died", cluster: sira}
  host-will-not-live-above-him: {label: "Abu Ayyub will not walk above the prophet; he moves him upstairs and lives below", cluster: sira}
  host-eats-where-his-fingers-were: {label: "The host traces the place of the prophet's fingers in returned food to eat there; he leaves the garlic dish untouched", cluster: sira}
  garlic-disliked-because-of-the-visitant: {label: "Garlic is not forbidden but he dislikes it, 'for I am visited' (by revelation)", cluster: ritual}
  only-blanket-used-to-dry-spill: {label: "A jar breaks and the hosts use their only blanket to sop the water lest it drip on him", cluster: sira}
  graves-of-idolaters-dug-up-for-mosque: {label: "The garden has graves of idolaters, ruins and palms: the graves dug up, ruins levelled, palms cut and set as the qibla wall", cluster: sira}
  inheritance-by-brotherhood-abrogated: {label: "Emigrant inherited from Helper by the brotherhood, not from kin, until abrogated; help and counsel remain and bequest", cluster: law}
  helper-offers-half-wealth-emigrant-asks-market: {label: "Paired brother offers half his property and family; the emigrant asks only 'show me the market'", cluster: sira}
  feast-even-with-one-sheep: {label: "'Give a wedding feast even with one sheep'; dower a date-stone's weight of gold", cluster: law}
  emigrants-housed-by-lot: {label: "The Helpers cast lots for which emigrant each would house", cluster: sira}
  who-knows-god-honoured-him: {label: "'How do you know God honoured him? By God, I, God's messenger, do not know what will be done with him'", cluster: theology}
  dream-spring-is-his-deeds: {label: "She dreams the dead man has a flowing spring: 'that is his deed'", cluster: dreams}
  no-alliance-yet-alliance-in-my-house: {label: "'No alliance in Islam'? Anas: he allied Quraysh and Helpers in my house", cluster: sira}
  palms-lent-then-returned-after-khaybar: {label: "Helpers give the emigrants the fruit of their palms; after Khaybar the emigrants return the gifts", cluster: sira}
  helpers-fear-taking-all-the-reward: {label: "Emigrants fear the Helpers will take all the reward; 'no, as long as you pray for them and praise them'", cluster: ethics}
  blood-money-written-for-each-clan: {label: "He wrote for every clan its blood-money; no one may take a client without his patron's leave", cluster: law}
  first-verse-of-fighting: {label: "Q 22:39 'permission is given to those who are fought' is the first verse revealed on fighting", cluster: war}
  count-of-the-raids: {label: "The raids counted: nineteen (Zayd, Jabir), sixteen (Burayda), fifteen (al-Bara'), seven plus nine expeditions (Salama)", cluster: sira}
  first-raid-al-ushayra: {label: "The first raid Zayd b. Arqam joined: al-'Ushayra", cluster: sira}
  cursed-camel-sent-away: {label: "A man curses his lagging camel; 'get off it; do not keep company with us on a cursed one; do not curse yourselves, children, property'", cluster: ethics}
  sealed-orders-opened-at-a-place: {label: "The leader is given a letter not to be read until he reaches a certain place; none is to be compelled to go on", cluster: war}
  leader-weeps-longing-and-is-replaced: {label: "The appointed leader weeps from longing for the prophet and another is sent in his place", cluster: war}
  killing-in-the-sacred-month-question: {label: "They kill Ibn al-Hadrami not knowing whether it is Rajab or Jumada; the idolaters charge them with fighting in the sacred month", cluster: war}
  went-out-for-the-caravan-not-war: {label: "He went out seeking Quraysh's caravan, not battle; God brought them together without appointment", cluster: war}
  caravan-of-forty-out-from-syria: {label: "Abu Sufyan with forty riders returns from Syria with Quraysh's goods; 'go out to it, God may give it to you as booty'", cluster: war}
  messenger-cries-help-with-torn-shirt: {label: "Damdam cries in the valley, his camel's nose cut, saddle reversed, shirt torn: 'the caravan! help!'", cluster: war}
  army-of-quraysh-with-singing-girls: {label: "Quraysh march 950 strong with 200 horses and singing girls beating drums and satirizing the Muslims", cluster: war}
  only-those-with-mount-at-hand: {label: "'We have something to seek: whoever has his mount here, ride with us', not those whose mounts are in upper Medina", cluster: war}
  dream-rider-cries-hasten-to-your-deaths-in-three: {label: "In Atika's dream a rider at al-Abtah, on the Ka'ba and on Abu Qubays cries 'go out to your deaths in three days'", cluster: dreams}
  boulder-shatters-a-piece-in-every-house: {label: "In the dream a boulder rolled down the mountain bursts and a fragment enters every house of Mecca", cluster: dreams}
  women-prophesying-too-taunt: {label: "Abu Jahl: not content that your men prophesy, now your women prophesy", cluster: sira}
  censer-brought-sit-like-a-woman: {label: "To shame the reluctant Umayya, 'Uqba brings him a censer: 'perfume yourself, you are one of the women'", cluster: sira}
  absent-man-hires-substitute-for-debt: {label: "Abu Lahab stays behind and sends al-'As b. Hisham in his place for a debt of four thousand dirhams", cluster: war}

units:
  - id: hadith-48-persecution-at-the-kaba
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "The prophet throttled and beaten at the Ka'ba; Abu Bakr's defence; the slaughter warning; hunger with Bilal"
    read: ["Jāmiʿ 48:5083.1-5084.2"]
    quran: ["40:28"]
    tags:
      - {motif: garment-twisted-round-prophets-neck, refs: ["Jāmiʿ 48:5083.1"], note: "فأخذ بمنكب رسول الله ﷺ ولوى ثوبه في عنقه فخنقه خنقًا شديدًا"}
      - {motif: defender-quotes-killing-a-man-for-saying-my-lord-is-god, refs: ["Jāmiʿ 48:5083.1", "Jāmiʿ 48:5083.2", "Jāmiʿ 48:5084.2"], note: "أتقتلون رجلا أن يقول ربي الله ... فقالوا: من هذا؟ قال: ابن أبي قحافة المجنون"}
      - {motif: i-have-come-to-you-with-slaughter, refs: ["Jāmiʿ 48:5083.2"], note: "مر بهم الثالثة ... لقد جئتكم بالذبح"}
      - {motif: hearers-still-as-if-bird-on-head, refs: ["Jāmiʿ 48:5083.2"], note: "حتى ما منهم رجل إلا كأنما على رأسه طائر واقع"}
      - {motif: food-only-what-bilal-hides-under-armpit, refs: ["Jāmiʿ 48:5084.1"], note: "ثلاثة من بين يوم وليلة، وما لي ولبلال طعام يأكله ذو كبد، إلا ما يواري إبط بلال"}
  - id: hadith-48-combed-with-iron
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Khabbab's complaint; earlier believers combed with iron and sawn in two"
    read: ["Jāmiʿ 48:5084.3"]
    quran: []
    tags:
      - {motif: earlier-believers-combed-with-iron-and-sawn-in-two, refs: ["Jāmiʿ 48:5084.3"], note: "ليمشط بمشاط الحديد ما دون عظامه من لحم أو عصب ... ويوضع المنشار على مفرق رأسه فيشق باثنين"}
      - {motif: rider-from-sana-to-hadramawt-fearing-only-god, refs: ["Jāmiʿ 48:5084.3"], note: "حتى يسير الراكب من صنعاء إلى حضر موت ما يخاف إلا الله ... والذئب على غنمه"}
    hints:
      - "The sawing in two from the parting of the head against Heb 11:37 ('they were sawn in two') and the Martyrdom of Isaiah (Ascension of Isaiah 5:1), where Isaiah is sawn asunder with a wood-saw."
  - id: hadith-48-taif-and-the-angel-of-mountains
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "The day of al-'Aqaba (Ta'if) - the angel of the mountains and the Ta'if prayer"
    read: ["Jāmiʿ 48:5085.1", "Jāmiʿ 48:5111.1", "Jāmiʿ 48:5113.1"]
    quran: []
    tags:
      - {motif: angel-of-mountains-offers-to-crush-the-town, refs: ["Jāmiʿ 48:5085.1", "Jāmiʿ 48:5111.1"], note: "فإذا أنا بسحابة قد أظلتني فإذا فيها جبريل ... ملك الجبال ... إن شئت أن أطبق عليهم الأخشبين"}
      - {motif: prophet-hopes-for-believing-descendants-of-enemies, refs: ["Jāmiʿ 48:5085.1", "Jāmiʿ 48:5111.1"], note: "بل أرجو أن يخرج الله من أصلابهم من يعبد الله وحده"}
      - {motif: taif-prayer-complaint-of-weakness, refs: ["Jāmiʿ 48:5113.1"], note: "اللهم إليك أشكو ضعف قوتي وقلة حيلتي ... إلى من تكلني ... إن لم يكن بك غضب علي فلا أبالي ... لك العتبى حتى ترضى"}
    hints:
      - "The offer to destroy the rejecting town declined against Luke 9:54-55, where the disciples offer to call fire from heaven on the Samaritan village that would not receive Jesus and he rebukes them."
  - id: hadith-48-ibn-ubayy-and-the-dust
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Ibn Ubayy covers his nose; the would-be crowned chief; patience with insult"
    read: ["Jāmiʿ 48:5085.2"]
    quran: ["3:186", "2:109"]
    note: "The book prints the verse 'wa-latasma'unna ... adhan kathiran' as Al 'Imran 185; it is 3:186, recorded here."
    tags:
      - {motif: hypocrite-covers-nose-from-dust-of-mount, refs: ["Jāmiʿ 48:5085.2"], note: "خمّر عبد الله بن أبي أنفه بردائه ثم قال: لا تغبّروا علينا"}
      - {motif: chief-about-to-be-crowned-when-prophet-came, refs: ["Jāmiʿ 48:5085.2"], note: "اصطلح أهل هذه البحيرة على أن يتوجوه فيعصبونه بالعصابة ... شرق بذلك"}
  - id: hadith-48-fair-of-dhul-majaz
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Preaching at Dhu l-Majaz and 'Ukaz with Abu Lahab behind him; the camel bought on trust"
    read: ["Jāmiʿ 48:5086.1", "Jāmiʿ 48:5136.1-5138.2"]
    quran: []
    tags:
      - {motif: preacher-in-market-followed-by-stone-thrower, refs: ["Jāmiʿ 48:5086.1", "Jāmiʿ 48:5138.2", "Jāmiʿ 48:5136.1", "Jāmiʿ 48:5137.1"], note: "قولوا: لا إله إلا الله تفلحوا ... ورجل يتبعه يرميه بالحجارة قد أدمى عرقوبيه ... هذا عبد العزى أبو لهب؛ وأبو جهل يحثي عليه التراب"}
      - {motif: uncle-squints-two-plaits-shouts-he-is-a-liar, refs: ["Jāmiʿ 48:5137.1", "Jāmiʿ 48:5137.2", "Jāmiʿ 48:5138.1"], note: "رجلا أحول وضيء الوجه ذا غديرتين يقول: إنه صابئ كاذب"}
      - {motif: allies-among-the-jinn, refs: ["Jāmiʿ 48:5138.1"], note: "أن تسلخوا اللات والعزى من أعناقكم وحلفاءكم من الجن من بني مالك بن أقيس"}
      - {motif: stranger-buys-camel-on-trust-face-like-full-moon, refs: ["Jāmiʿ 48:5086.1"], note: "ما رأيت شيئًا أشبه بالقمر ليلة البدر من وجهه ... إن لكم أن تأكلوا حتى تشبعوا وتكتالوا حتى تستوفوا"}
      - {motif: begin-giving-with-mother-father-sister-brother, refs: ["Jāmiʿ 48:5086.1"], note: "يد المعطي العليا، وابدأ بمن تعول: أمك وأباك، وأختك وأخاك، وأدناك أدناك"}
      - {motif: mother-not-liable-for-sons-crime, refs: ["Jāmiʿ 48:5086.1"], note: "خذ لنا بثأرنا ... ألا لا تجني أم على ولد"}
    hints:
      - "'No mother bears the crime of her child' against Deut 24:16, 'fathers shall not be put to death for the children, nor children for the fathers'."
  - id: hadith-48-mudhammam
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Quraysh curse 'Mudhammam'"
    read: ["Jāmiʿ 48:5088.1"]
    quran: []
    tags:
      - {motif: abuse-turned-on-mudhammam-not-muhammad, refs: ["Jāmiʿ 48:5088.1"], note: "يشتمون مذممًا، ويلعنون مذممًا، وأنا محمد"}
  - id: hadith-48-foreign-teacher
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "The charge that a slave of the Hadrami teaches him"
    read: ["Jāmiʿ 48:5089.1"]
    quran: ["16:103", "16:105"]
    tags:
      - {motif: accusation-of-foreign-teacher, refs: ["Jāmiʿ 48:5089.1"], note: "إنما يعلم محمدًا عبد بن الحضرمي وهو صاحب الكتب"}
  - id: hadith-48-the-mockers-struck
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "The five mockers and the parts Gabriel pointed at"
    read: ["Jāmiʿ 48:5089.2"]
    quran: ["15:95", "6:10", "25:41"]
    tags:
      - {motif: mockers-overtaken-by-their-mockery, refs: ["Jāmiʿ 48:5089.2"], note: "إنا كفيناك المستهزئين ... قال: كفيته"}
      - {motif: gabriel-points-at-each-mocker-and-he-dies, refs: ["Jāmiʿ 48:5089.2"], note: "فأومأ جبريل إلى أبجله ... إلى عينيه ... إلى رأسه ... إلى بطنه ... إلى أخمصه"}
  - id: hadith-48-poor-companions-not-dismissed
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Six poor companions not to be driven away"
    read: ["Jāmiʿ 48:5090.1"]
    quran: ["6:52"]
    tags:
      - {motif: six-poor-companions-asked-to-be-dismissed, refs: ["Jāmiʿ 48:5090.1"], note: "كنا مع النبي ﷺ ستة نفر فقال المشركون: اطرد هؤلاء يجترئون علينا"}
      - {motif: do-not-drive-away-poor-believers, refs: ["Jāmiʿ 48:5090.1"], note: "ولا تطرد الذين يدعون ربهم بالغداة والعشي"}
  - id: hadith-48-seven-years-and-the-smoke
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "The prayer for seven years like Joseph's; the smoke and the batsha"
    read: ["Jāmiʿ 48:5092.1-5092.2"]
    quran: ["44:10-16", "38:86"]
    tags:
      - {motif: seven-years-like-the-seven-of-joseph, refs: ["Jāmiʿ 48:5092.1"], note: "اللهم سبع كسبع يوسف ... فأخذتهم سنة حصت كل شيء"}
      - {motif: famine-sky-seen-as-smoke, refs: ["Jāmiʿ 48:5092.1"], note: "حتى أكلوا الجلود والميتة من الجوع وينظر إلى السماء أحدهم فيرى كهيئة الدخان"}
      - {motif: five-signs-already-passed, refs: ["Jāmiʿ 48:5092.2", "Jāmiʿ 48:5092.1"], note: "خمس قد مضين: اللزام، والروم، والبطشة، والقمر، والدخان؛ فالبطشة يوم بدر"}
    hints:
      - "'Seven like the seven of Joseph' against Gen 41:27-30, the seven years of famine that consume the land."
  - id: hadith-48-prostration-at-al-najm
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "All prostrate at Surat al-Najm"
    read: ["Jāmiʿ 48:5098.1"]
    quran: ["53:62"]
    tags:
      - {motif: jinn-and-idolaters-prostrate-at-surat-al-najm, refs: ["Jāmiʿ 48:5098.1"], note: "سجد النبي ﷺ بالنجم، وسجد معه المسلمون والمشركون والجن والإنس"}
  - id: hadith-48-negus-umm-salama
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "The emigrants before the Negus (Umm Salama's account)"
    read: ["Jāmiʿ 48:5098.2"]
    quran: ["19:1", "4:171"]
    tags:
      - {motif: envoys-bribe-patriarchs-before-king, refs: ["Jāmiʿ 48:5098.2"], note: "ادفعوا إلى كل بطريق هديته قبل أن تكلموا النجاشي ... الأدم"}
      - {motif: refugees-speech-before-the-negus, refs: ["Jāmiʿ 48:5098.2"], note: "كنا قومًا أهل جاهلية نعبد الأصنام ونأكل الميتة ... يأكل القوي منا الضعيف"}
      - {motif: king-weeps-till-beard-wet-at-maryam, refs: ["Jāmiʿ 48:5098.2"], note: "فقرأ عليه صدرًا من كهيعص ... فبكى النجاشي حتى أخضل لحيته، وبكت أساقفته حتى أخضلوا مصاحفهم"}
      - {motif: from-one-niche-with-moses, refs: ["Jāmiʿ 48:5098.2"], note: "إن هذا والذي جاء به موسى ليخرج من مشكاة واحدة"}
      - {motif: jesus-servant-messenger-spirit-word-cast-to-virgin, refs: ["Jāmiʿ 48:5098.2"], note: "هو عبد الله ورسوله وروحه وكلمته ألقاها إلى مريم العذراء البتول"}
      - {motif: jesus-word-and-spirit-from-god, refs: ["Jāmiʿ 48:5098.2"], note: "وروحه وكلمته ألقاها إلى مريم"}
      - {motif: king-draws-stick-from-ground-not-a-stick-more, refs: ["Jāmiʿ 48:5098.2"], note: "فضرب النجاشي يده على الأرض فأخذ منها عودًا ... ما عدا عيسى ابن مريم ما قلت هذا العود"}
      - {motif: god-took-no-bribe-for-my-kingdom, refs: ["Jāmiʿ 48:5098.2"], note: "ما أخذ الله مني الرشوة حين رد علي ملكي فآخذ الرشوة فيه"}
      - {motif: swimmer-on-inflated-skin-crosses-nile, refs: ["Jāmiʿ 48:5098.2"], note: "فنفخوا له قربة فجعلها في صدره ثم سبح عليها ... النيل"}
  - id: hadith-48-negus-ibn-masud
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Ja'far refuses to prostrate; the Negus would carry his sandals"
    read: ["Jāmiʿ 48:5103.1"]
    quran: ["4:171", "61:6"]
    tags:
      - {motif: refugees-refuse-to-prostrate-to-king, refs: ["Jāmiʿ 48:5103.1"], note: "سجدا له ... فسلم ولم يسجد ... إنا لا نسجد إلا لله"}
      - {motif: jesus-servant-messenger-spirit-word-cast-to-virgin, refs: ["Jāmiʿ 48:5103.1"], note: "هو كلمة الله وروحه، ألقاها إلى العذراء البتول التي لم يمسها بشر ولم يفرضها ولد"}
      - {motif: king-draws-stick-from-ground-not-a-stick-more, refs: ["Jāmiʿ 48:5103.1"], note: "فرفع عودًا من الأرض ... ما يزيدون على الذي نقول فيه ما يسوى هذا"}
      - {motif: king-would-carry-prophets-sandals, refs: ["Jāmiʿ 48:5103.1"], note: "فإنه الذي نجد في الإنجيل ... لولا ما أنا فيه من الملك لأتيته حتى أكون أنا أحمل نعليه وأوضؤه"}
    hints:
      - "Carrying the coming one's sandals against Mark 1:7 / John 1:27, where the Baptist is not worthy to untie (or carry, Matt 3:11) the sandals of the one who comes after."
  - id: hadith-48-ship-people
    tradition: islam
    corpus: hadith
    original: true
