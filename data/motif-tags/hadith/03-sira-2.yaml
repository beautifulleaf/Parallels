      - {motif: boulder-shatters-a-piece-in-every-house, refs: ["Jāmiʿ 48:5200.1"], note: "ثم أخذ صخرة فأرسلها ... ارفضت فما بقي بيت من بيوت مكة ولا دار إلا دخلتها منها فلقة"}
      - {motif: women-prophesying-too-taunt, refs: ["Jāmiʿ 48:5200.1"], note: "أما رضيتم أن يتنبأ رجالكم حتى تتنبأ نساؤكم"}
