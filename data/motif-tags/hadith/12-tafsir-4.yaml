      - "The sea as ink too little for God's words against the rabbinic image of R. Eliezer / Johanan b. Zakkai (Avot de-R. Nathan A 25; Shir ha-Shirim Rabbah 1:3): if all seas were ink and all reeds pens, they could not write the Torah I learned."
