# Hadith chunk 12: al-Jāmiʿ al-Kāmil book 60 (tafsir), pp. 7060-7179 (printed 10/396-515):
# Q 9:81 (al-Tawba) to Q 20:40 (Taha). Read in full from the Arabic.
# Page 7060 only finishes hadith 7059.3 of chunk 11. Surah-level hadith with no bab verse are linked
# to the whole surah they name.
new_motifs:
  # ---- al-Tawba
  worldly-fire-one-seventieth-of-hell: {label: "The fire people kindle is one part of seventy of the fire of hell; it was made to exceed it by sixty-nine parts", cluster: eschatology}
  farewell-sermon-teeth-on-the-sunna: {label: "An admonition that makes eyes weep is taken as a farewell; the counsel: obey even an Abyssinian slave, hold the practice of the rightly guided successors with the molars, every innovation is error", cluster: ethics}
  laggards-bind-themselves-to-mosque-pillars: {label: "Men who stayed back from the raid tie themselves to the mosque pillars until God releases them; then they bring their wealth and the alms verse comes down", cluster: sira}
  prophet-blesses-family-of-alms-giver: {label: "When a people brought their alms the prophet said 'O God, bless the family of so-and-so': 'bless the family of Abu Awfa'", cluster: ritual}
  god-stretches-hand-by-night-and-day-for-repentance: {label: "God stretches out his hand by night for the day's sinner to repent and by day for the night's sinner, until the sun rises from the west", cluster: eschatology}
  god-rears-charity-like-a-foal: {label: "God receives a charity from lawful earnings in his hand and rears it as a man rears his foal or young slave or weaned camel", cluster: ritual}
  rival-mosque-founder-goes-to-caesar: {label: "Abu Amir tells the builders of the rival mosque to arm themselves while he goes to Caesar to bring a Roman army against the prophet", cluster: sira}
  pebbles-struck-on-ground-naming-the-mosque: {label: "Asked which mosque was founded on piety, the prophet takes a handful of pebbles, strikes the ground and says 'this mosque of yours' (Medina)", cluster: sira}
  wandering-of-community-is-jihad: {label: "A man asks leave for wandering devotion (siyaha); 'the wandering of my community is jihad in God's way'", cluster: ethics}
  abraham-meets-father-at-resurrection: {label: "On resurrection day Abraham meets his father, his face dusty and dark; the father now promises obedience; Abraham reminds God of his promise not to shame him", cluster: eschatology}
  prayer-for-rain-cloud-stops-at-camp-edge: {label: "In the thirst of the hard raid the prophet raises his hands; a cloud shades and pours, and they find it did not pass beyond the camp", cluster: sira}
  burns-enemy-kings-letter-in-oven: {label: "A letter from the king of Ghassan inviting the boycotted man to join him is fed into the oven: 'this too is a trial'", cluster: sira}
  separation-from-wife-ordered-not-divorce: {label: "On the fortieth night the boycotted men are told to keep away from their wives, not divorce them; one is sent to her family", cluster: ritual}
  herald-on-mount-sal-announces-repentance: {label: "A crier from the top of Mount Sal' calls 'Ka'b, good news!'; the voice is faster than the horseman; the hearer falls prostrate and gives the herald his two garments", cluster: sira}
  truthfulness-leads-to-paradise-lie-to-fire: {label: "Truth leads to righteousness and righteousness to paradise; a man keeps speaking truth till he is written truthful; lying leads to wickedness and the fire till he is written a liar", cluster: ethics}
  world-punishment-lighter-than-hereafter: {label: "To the couple who swore the curse-oath: the punishment of this world is lighter than the punishment of the hereafter", cluster: eschatology}
  # ---- Yunus
  believers-affair-all-good: {label: "Wonderful is the believer's affair: in ease he gives thanks, in hardship he is patient, and both are good for him", cluster: ethics}
  two-angels-proclaim-daily-at-sunrise-and-sunset: {label: "Each day two angels on the sun's flanks call, heard by all creatures but men and jinn: 'come to your Lord; little that suffices beats much that distracts' and 'O God give the spender a return, the withholder ruin'", cluster: cosmology}
  angels-parable-house-banquet-and-caller: {label: "Angels over the sleeping prophet give a parable: a man built a house, set a banquet and sent a caller; the house is paradise, the caller Muhammad", cluster: revelation}
  veil-lifted-sight-of-lord-is-the-increase: {label: "In paradise God asks 'do you want anything more?'; the veil is lifted and nothing is dearer to them than looking at their Lord (the 'increase' of Q 10:26)", cluster: eschatology}
  god-forbade-injustice-to-himself: {label: "Divine saying: I have forbidden injustice to myself; all of you are astray, hungry, naked save whom I guide, feed, clothe; all asking together diminish me no more than a needle dipped in the sea", cluster: cosmology}
  ear-slit-cattle-made-forbidden: {label: "Do your people's camels give birth with sound ears, and you cut the ears with a razor and call it bahira, slit hides and call it sarm, and forbid it? God's forearm is stronger, his razor sharper", cluster: ritual}
  friends-in-god-envied-by-prophets: {label: "Some servants, neither prophets nor martyrs, are envied by prophets and martyrs: men who loved one another in God without kinship or trade; on pulpits of light they do not fear when people fear", cluster: eschatology}
  praise-of-people-is-quick-glad-tidings: {label: "A man's good deed praised by people is 'the believer's hastened glad tidings'", cluster: ethics}
  repentance-accepted-until-death-rattle: {label: "God accepts the servant's repentance as long as he has not reached the death rattle (yugharghir)", cluster: eschatology}
  gabriel-stuffs-mud-in-pharaohs-mouth: {label: "Gabriel kept stuffing mud into Pharaoh's mouth for fear he would say 'no god but God' and be shown mercy", cluster: prophets}
  men-boys-women-rows-in-prayer: {label: "In the taught prayer the men stand in the front row, the boys behind them, the women behind the boys", cluster: ritual}
  # ---- Hud
  folding-breasts-from-shame-before-sky: {label: "Some were ashamed to relieve themselves or lie with their wives exposed to the sky, and folded their breasts (Q 11:5)", cluster: ritual}
  god-was-and-nothing-else: {label: "God was and nothing else was; his throne was on the water; he wrote everything in the Reminder and created heavens and earth", cluster: cosmology}
  hardship-even-a-thorn-expiates: {label: "No fatigue, illness, worry, grief, harm or sorrow befalls a Muslim, even a thorn that pricks him, but God expiates his sins by it", cluster: ethics}
  jew-or-christian-who-hears-and-does-not-believe: {label: "No Jew or Christian of this community hears of me and dies without believing in what I was sent with but he is of the fire", cluster: eschatology}
  god-draws-believer-near-and-covers-sins: {label: "God draws the believer near, puts his cover (kanaf) over him and makes him confess sins: 'I veiled them in the world and forgive them today'; the disbelievers are cried out before the witnesses", cluster: eschatology}
  blessing-on-muhammad-as-on-family-of-abraham: {label: "The taught blessing: 'O God, bless Muhammad and his family as you blessed the family of Abraham; you are praiseworthy, glorious'", cluster: ritual}
  god-respites-wrongdoer-then-seizes: {label: "God gives the wrongdoer respite, and when he seizes him does not let him go (Q 11:102)", cluster: eschatology}
  messengers-only-speak-sallim: {label: "On that day none speaks but the messengers, and their words are 'O God, keep safe, keep safe'", cluster: eschatology}
  scorched-ones-called-jahannamiyyun: {label: "A people come out of the fire after a scorching (saf') and enter paradise; its people name them 'the Jahannamis'", cluster: eschatology}
  good-deeds-erase-sins-kiss-case: {label: "A man who kissed or touched a woman short of intercourse confesses; Q 11:114 'good deeds remove bad ones' comes down; 'for all people'", cluster: ethics}
  ablution-and-prayer-forgive-intervals: {label: "Whoever performs ablution well and prays is forgiven what lies between that prayer and the next", cluster: ritual}
  shahada-covers-all-sins: {label: "A man who left no desire or need unmet is asked thrice whether he testifies to God and his messenger: 'that comes over all that'", cluster: ethics}
  # ---- Yusuf
  quran-revealed-in-answer-to-request-for-stories: {label: "The companions ask 'if only you told us stories' and Q 12:1-3 comes; 'if only you spoke to us' and Q 39:23 'the best speech' comes", cluster: revelation}
  joseph-noblest-of-people: {label: "Asked who is noblest: the most God-fearing; then Joseph, prophet son of prophet son of prophet son of God's friend; then the best of the Arabs in ignorance are best in Islam", cluster: prophets}
  falsely-accused-wife-cites-father-of-joseph: {label: "Accused of adultery, Aisha finds no likeness but the father of Joseph: 'fair patience' (Q 12:18)", cluster: sira}
  joseph-delayed-release-prophet-would-have-answered: {label: "Had I stayed in prison as long as Joseph I would have answered the summoner; I would have hastened and not sought the excuse", cluster: prophets}
  wife-would-be-told-to-prostrate-to-husband: {label: "Were I to command anyone to prostrate to another, I would command the wife to prostrate to her husband", cluster: ethics}
  messengers-despaired-of-their-followers: {label: "Aisha reads 'they were belied' (kudhdhibu): the messengers thought their followers had disbelieved them, never that God failed them", cluster: revelation}
  hayta-laka-read-as-taught: {label: "Ibn Mas'ud reads 'hayta laka' (Q 12:23): 'we read it only as we were taught it'", cluster: revelation}
  # ---- al-Ra'd
  dates-differ-in-taste: {label: "'Some excel others in taste' (Q 13:4): poor dates, Persian dates, sweet and sour", cluster: cosmology}
  five-keys-of-the-unseen: {label: "The keys of the unseen are five that only God knows: tomorrow, what the wombs shrink, when rain comes, where one dies, when the Hour comes", cluster: cosmology}
  thunderbolt-burns-man-who-asks-gods-metal: {label: "A pagan chief asks the envoy thrice whether his Lord is of copper, iron, silver or gold; a thunderbolt burns him", cluster: punishment}
  flood-foam-parable-certainty-and-doubt: {label: "The torrent's foam is doubt that vanishes, the water that remains is certainty, as ornament is put in fire and its dross left", cluster: revelation}
  angels-greet-poor-emigrants-at-every-gate: {label: "The first of God's creatures into paradise are the poor emigrants who guard the frontiers and die with their need in their breasts; angels enter on them from every gate with 'peace be on you'", cluster: eschatology}
  world-is-finger-dipped-in-sea: {label: "The world beside the hereafter is what a finger dipped in the sea brings back", cluster: eschatology}
  world-cheaper-than-dead-earless-kid: {label: "The prophet holds a dead, small-eared kid by the ear and asks who would buy it for a dirham: the world is cheaper to God than this to you", cluster: ethics}
  rahman-refused-in-treaty-heading: {label: "At al-Hudaybiya Suhayl refuses 'In the name of God the Rahman, the Rahim': 'as for al-Rahman I do not know what it is; write bismika allahumma'", cluster: sira}
  grape-cluster-of-paradise-reached-for: {label: "In the eclipse prayer the prophet reaches for a cluster of grapes in paradise; had he taken it they would have eaten of it as long as the world lasts", cluster: eschatology}
  tree-in-paradise-rider-shade-hundred-years: {label: "In paradise is a tree in whose shade a rider travels a hundred years without crossing it", cluster: eschatology}
  kinship-ties-extend-life-and-provision: {label: "Whoever would have his provision enlarged and his trace (life) prolonged, let him keep ties of kinship", cluster: ethics}
  # ---- Ibrahim
  five-things-given-to-no-prophet-before: {label: "I was given five things no one before me was given: awe at a month's distance, the earth a mosque and purifier, spoils lawful, intercession, sent to all people", cluster: revelation}
  moses-reminds-of-days-of-god: {label: "Moses stood in his people and reminded them of the days of God, and the days of God are his favours", cluster: prophets}
  believer-like-palm-tree-leaves-do-not-fall: {label: "A tree like the Muslim whose leaves do not fall and gives its fruit every season: the palm; the boy who knew kept silent before his elders", cluster: revelation}
  questioning-in-grave-firm-word: {label: "The firm word (Q 14:27) is the grave: asked 'who is your Lord?' he says 'my Lord is God and my prophet Muhammad'", cluster: eschatology}
  quraysh-exchanged-favour-for-unbelief-at-badr: {label: "Those who exchanged God's favour for unbelief are the unbelievers of Quraysh; the favour is Muhammad; the abode of ruin is the fire on the day of Badr", cluster: sira}
  prophet-weeps-my-community-god-will-please-you: {label: "Reciting Abraham's and Jesus' prayers for their people, the prophet raises his hands, weeps 'my community'; God sends Gabriel: 'we will please you in your community'", cluster: eschatology}
  resurrection-earth-white-like-pure-loaf: {label: "People are gathered on a white earth like a loaf of pure flour with no landmark of anyone", cluster: eschatology}
  earth-becomes-one-loaf-for-paradise-guests: {label: "On resurrection day the earth becomes one loaf which the Compeller turns in his hand like a traveller his bread, a hospitality for the people of paradise", cluster: eschatology}
  rabbis-questions-darkness-fish-liver-ox: {label: "A Jewish rabbi asks where people will be when the earth is changed (in darkness before the bridge), the first to cross (poor emigrants), their gift (the fish's liver lobe), their food (the ox of paradise), their drink (the spring Salsabil), and the child", cluster: eschatology}
  ox-of-paradise-slaughtered-for-guests: {label: "After the fish liver, the ox of paradise that grazed its edges is slaughtered for the people of paradise", cluster: eschatology}
  male-or-female-whose-water-prevails: {label: "Man's water is white, woman's yellow; if the man's semen prevails the child is male by God's leave, if the woman's, female", cluster: cosmology}
  people-on-the-bridge-when-earth-changed: {label: "Asked where people will be when the earth and heavens are changed: 'on the bridge (sirat)'", cluster: eschatology}
  four-jahiliyya-customs-and-wailer-in-tar: {label: "Four customs of ignorance my community will not leave: boasting of lineage, slandering lineage, rain by stars, wailing; the unrepentant wailer is raised in a shirt of tar and a coat of scab", cluster: punishment}
  prophet-preferred-sent-to-jinn-and-men: {label: "God preferred Muhammad over the dwellers of heaven (forgiven in advance while angels are threatened, Q 21:29) and over the prophets (each sent in his people's tongue, he to all people), sent to jinn and men", cluster: revelation}
  # ---- al-Hijr
  intercession-chain-adam-to-muhammad: {label: "People seek an intercessor: Adam, Noah, Abraham, Moses, Jesus each say 'I am not there for you' and send them on; Muhammad prostrates, is told to raise his head, and intercedes in bounds again and again", cluster: eschatology}
  polytheists-taunt-muslims-in-fire-then-wish: {label: "Polytheists in the fire taunt the Muslims with them; God permits intercession and they are taken out; the unbelievers wish they had been Muslims (Q 15:2)", cluster: eschatology}
  jahannamis-wash-in-river-to-lose-name: {label: "Those taken out of the fire are called the Jahannamis for the black in their faces; at their plea they bathe in a river of paradise and it goes", cluster: eschatology}
  soothsayer-mixes-word-with-hundred-lies: {label: "The soothsayer mixes the stolen word with a hundred lies; the jinni clucks it into his ally's ear like a hen", cluster: cosmology}
  angels-of-light-jinn-of-fire-adam-as-described: {label: "Angels were created of light, the jinn of smokeless fire, and Adam of what you have been told", cluster: cosmology}
  fire-takes-each-to-ankles-knees-waist-collarbone: {label: "The fire takes some to their ankles, some to the knees, some to the waist, some to the collarbone", cluster: eschatology}
  believers-held-on-bridge-for-retaliation: {label: "Believers saved from the fire are held on a bridge between paradise and fire where wrongs are settled; cleansed, they enter and know their homes better than in the world", cluster: eschatology}
  khadija-greeted-house-of-reed: {label: "Gabriel tells the prophet to convey God's greeting and his own to Khadija, who comes with a dish, and to give her glad tidings of a house of hollow pearl (qasab) in paradise without noise or toil", cluster: sira}
  enter-ruins-of-punished-only-weeping: {label: "Do not enter on these punished people unless weeping, lest what struck them strike you; he hurried until he had passed", cluster: ritual}
  fatiha-is-seven-oft-repeated: {label: "'Praise be to God the Lord of the worlds' is the seven oft-repeated (al-sab' al-mathani) and the great Quran given to him", cluster: revelation}
  naked-warner-who-saw-the-army: {label: "I am like a man who came to his people: I have seen the army with my eyes, I am the naked warner, flee! Some set out by night and escaped, some stayed and the army destroyed them at dawn", cluster: revelation}
  prophet-holds-people-by-waists-from-fire-moths: {label: "Like a man who lit a fire and moths and insects fall in; he pulls them away and they overpower him; I hold you by your waists from the fire and you rush in", cluster: revelation}
  quran-split-into-parts-by-people-of-book: {label: "The splitters (al-muqtasimin) who made the Quran into parts are the people of the book: they believed part and disbelieved part", cluster: revelation}
  gabriel-points-at-mockers-each-dies: {label: "Gabriel points at each mocker's vein, belly or sole; one is cut by an arrow-feather, one blinded by thorns, one dies of head sores, one of dropsy voiding filth from his mouth, one of a thorn in his foot", cluster: sira}
  certainty-is-death-none-may-attest-salvation: {label: "Of a dead companion: 'certainty (al-yaqin) has come to him; by God I do not know, though I am God's messenger, what will be done with me'; she never vouched for anyone again", cluster: eschatology}
  # ---- al-Nahl
  caller-shares-followers-reward-or-sin: {label: "Whoever calls to guidance has the reward of those who follow him, and whoever calls to error bears their sins, without lessening theirs", cluster: ethics}
  honey-cure-belly-of-brother-lied: {label: "A man's brother has loose bowels; 'give him honey' four times though it worsens: 'God spoke truth and your brother's belly lied'; he is cured", cluster: healing}
  revelation-seen-received-beside-companion: {label: "Sitting with a companion the prophet stares at the sky, turns to his right, nods as if understanding, then follows the angel with his eyes as it ascends; the verse of justice (Q 16:90) had come", cluster: revelation}
  four-traits-of-hypocrite: {label: "Four traits make a pure hypocrite: he lies when he speaks, breaks promises, betrays when he covenants, is wicked when he disputes; three signs: lies, breaks promise, betrays trust", cluster: ethics}
  success-is-islam-sufficiency-contentment: {label: "Successful is he who submits, is given just enough (kafaf) and is made content with it", cluster: ethics}
  unbeliever-paid-for-good-in-world: {label: "An unbeliever's good deed is repaid with food in this world; the believer's good deeds are stored for the hereafter and he is given provision as well", cluster: eschatology}
  coerced-muslims-at-badr-verses-sent-in-letters: {label: "Meccan Muslims forced to march to Badr are killed; verses on emigration are written to those still in Mecca, who set out, are caught and brought back; each new verse is sent to them in writing", cluster: sira}
  jews-saturday-christians-sunday-us-friday: {label: "The day was imposed on those before us and they differed; God guided us: the Jews have tomorrow, the Christians the day after; we are last in the world and first at the resurrection", cluster: ritual}
  # ---- al-Isra'
  prophet-recites-isra-and-zumar-before-sleep: {label: "The prophet would not sleep until he recited Bani Isra'il and al-Zumar", cluster: ritual}
  oldest-suras-are-my-early-store: {label: "Ibn Mas'ud: Bani Isra'il, al-Kahf and Maryam are among the first excellent suras (al-'itaq al-uwal) and my old possessions (tiladi)", cluster: revelation}
  gatekeeper-of-each-heaven-asks-who-is-with-you: {label: "At each heaven Gabriel asks the keeper to open: 'who is this?' 'Gabriel' 'is anyone with you?' 'Muhammad' 'has he been sent for?' 'yes'", cluster: cosmology}
  creaking-of-the-pens-heard: {label: "Raised to a level, the prophet hears the scratching (sarif) of the pens", cluster: cosmology}
  jerusalem-displayed-to-prophet-at-hijr: {label: "When Quraysh belied him, God displayed Jerusalem to him as he stood in the Hijr, and he described its features looking at it", cluster: sira}
  four-who-plead-at-resurrection-tested-by-fire: {label: "Four plead on resurrection day: the deaf, the fool, the very old, the one who died in the interval; they are ordered into a fire that would be cool and safe if they entered", cluster: eschatology}
  nose-in-dust-who-had-old-parents: {label: "'May his nose be in the dust' thrice: the one whose parents reached old age with him and he did not enter paradise", cluster: ethics}
  give-to-mother-father-sister-brother-nearest: {label: "The upper hand of the giver; begin with your dependants: your mother, your father, your sister, your brother, then the nearest and the nearest", cluster: ethics}
  miser-and-spender-in-iron-coats: {label: "The miser and the spender in two iron coats from breast to collarbone: the spender's widens till it covers his fingertips and effaces his trace; every ring of the miser's sticks in place", cluster: ethics}
  youth-asks-leave-for-fornication: {label: "A youth asks leave to fornicate; 'would you like it for your mother, daughter, sister, paternal and maternal aunt?' He lays his hand on him and prays; the youth never again turned to it", cluster: ethics}
  three-cases-lawful-blood: {label: "A Muslim's blood is lawful only in three cases: the married adulterer, a life for a life, the one who leaves his religion and the community", cluster: ritual}
  weak-man-not-to-govern-or-hold-orphan-property: {label: "To Abu Dharr: 'I see you are weak ... do not lead even two, do not manage an orphan's property'", cluster: ethics}
  left-for-god-replaced-with-better: {label: "You will never leave a thing out of fear of God but God gives you better", cluster: ethics}
  noah-dying-testament-to-son: {label: "Dying, Noah tells his son: I command you two things and forbid two; 'no god but God' outweighs seven heavens and seven earths; 'glory and praise' is the prayer of everything and by it creatures are fed; I forbid idolatry and pride", cluster: prophets}
  humans-worshipped-jinn-who-became-muslim: {label: "Some humans worshipped a group of jinn; the jinn became Muslim and the humans kept their worship (Q 17:57)", cluster: cosmology}
  eclipse-not-for-death-god-most-jealous: {label: "Sun and moon do not eclipse for anyone's death or life; pray, magnify, give alms; none is more jealous than God that his servant should fornicate; if you knew what I know you would laugh little and weep much", cluster: ritual}
  satan-flees-house-where-baqara-read: {label: "Do not make your houses graves; Satan flees the house in which al-Baqara is read", cluster: ritual}
  thief-of-alms-teaches-throne-verse: {label: "A night thief caught at the Ramadan alms teaches the throne verse at bedtime as a guard against Satan: 'he told you the truth though he is a great liar; that was a devil'", cluster: ritual}
  hundredfold-tahlil-as-guard-from-satan: {label: "Whoever says 'no god but God alone ...' a hundred times a day: worth ten slaves freed, a hundred good deeds written, a hundred sins erased, a guard from Satan till evening", cluster: ritual}
  angels-of-night-and-day-meet-at-dawn-and-asr: {label: "Angels of night and day take turns among you and meet at the dawn and afternoon prayers; asked how they left my servants: 'we left them praying and came while they prayed'", cluster: ritual}
  group-prayer-twenty-five-degrees: {label: "Prayer in congregation exceeds the lone prayer by twenty-five degrees", cluster: ritual}
  praised-station-intercession: {label: "On resurrection day people kneel in groups, each following its prophet asking intercession, until it ends with the prophet: that is the praised station", cluster: eschatology}
  jews-ask-about-spirit-prophet-silent: {label: "Jews ask the prophet, leaning on a palm stick, about the spirit; he falls silent under revelation; then 'the spirit is of my Lord's command' (Q 17:85)", cluster: revelation}
  ink-of-sea-answer-to-torah-boast: {label: "Told 'you have little knowledge', the Jews boast 'we were given the Torah, much good'; Q 18:109 comes: if the sea were ink for my Lord's words", cluster: revelation}
  disbeliever-walks-on-face: {label: "Asked how the unbeliever is gathered on his face: 'is not he who made him walk on his feet able to make him walk on his face?'", cluster: eschatology}
  three-companies-gathered: {label: "People are gathered in three companies: riding, fed and clothed; walking and running; dragged on their faces by angels to the fire; a blight on mounts leaves a garden traded for an old camel", cluster: eschatology}
  prayer-voice-neither-loud-nor-silent: {label: "Q 17:110 came while the prophet hid in Mecca: loud recitation made the polytheists curse the Quran; neither loud nor silent", cluster: ritual}
  quiet-and-loud-night-prayer-adjusted: {label: "Abu Bakr prays softly (I let Him hear whom I confide in), Umar loudly (I wake the drowsy and drive off Satan); 'raise yours a little', 'lower yours a little'", cluster: ritual}
  # ---- al-Kahf
  sakina-descends-at-recitation-horse-shies: {label: "A man recites al-Kahf beside a tethered horse; a cloud covers him and draws closer, the horse shies; 'that is the sakina, it came down for the Quran'", cluster: revelation}
  ten-verses-of-kahf-protect-from-dajjal: {label: "Whoever memorises ten verses of the start (or end) of al-Kahf is protected from the Dajjal", cluster: eschatology}
  world-sweet-green-beware-women: {label: "The world is sweet and green and God makes you successors in it to see how you act; beware the world and women; the first trial of the Israelites was in women", cluster: ethics}
  man-most-contentious-thigh-struck: {label: "Woken for night prayer, Ali says 'our souls are in God's hand'; the prophet leaves striking his thigh: 'man is more contentious than anything' (Q 18:54)", cluster: sira}
  moses-claims-most-knowledge-rebuked: {label: "Asked who is most learned, Moses says 'I'; God rebukes him for not referring knowledge to Him: a servant at the meeting of the two seas knows more", cluster: prophets}
  fish-revived-tunnels-into-sea: {label: "At the rock the fish stirs in the basket, falls into the sea and God holds back the water's flow so that it stands over it like an arch (taq)", cluster: prophets}
  khidr-scuttles-kills-rebuilds: {label: "The servant pulls a plank from the ship that carried them free, wrenches off a playing boy's head, and props up a falling wall in a village that refused them food", cluster: prophets}
  variant-reading-every-sound-ship: {label: "Ibn Abbas read 'before them a king who took every sound ship by force' and 'the boy was an unbeliever'", cluster: revelation}
  gog-magog-drink-lake-tiberias: {label: "Gog and Magog pass Lake Tiberias: the first drink it dry, the last say 'there was water here once'", cluster: eschatology}
  gog-magog-killed-by-neck-worms: {label: "God sends worms (naghaf) on the necks of Gog and Magog and they die as one soul; birds like Bactrian camels' necks carry off the bodies; rain washes the earth like a mirror", cluster: eschatology}
  gog-magog-dig-barrier-daily: {label: "Gog and Magog dig every day until they almost see the sunlight; it is restored overnight until their leader says 'if God wills'; they shoot arrows at the sky that return bloodied", cluster: eschatology}
  trumpet-is-a-horn: {label: "Asked what the trumpet (sur) is: 'a horn blown into'", cluster: eschatology}
  horn-holder-poised-to-blow: {label: "How can I enjoy myself when the holder of the horn has put it to his mouth, bent his brow and waits to be commanded? Say: God suffices us", cluster: eschatology}
  hell-dragged-by-seventy-thousand-reins: {label: "Hell is brought that day with seventy thousand reins, each rein with seventy thousand angels dragging it", cluster: eschatology}
  greatest-losers-jews-and-christians: {label: "Sa'd: the greatest losers (Q 18:103) are not the Haruriyya but the Jews who belied Muhammad and the Christians who denied food and drink in paradise", cluster: revelation}
  fat-man-weighs-less-than-gnat-wing: {label: "A great fat man comes on resurrection day weighing with God not a gnat's wing: 'we will set up no weight for them'", cluster: eschatology}
  hundred-degrees-firdaws-under-throne: {label: "Paradise has a hundred degrees for those who fight in God's way, each as far apart as heaven and earth; ask for Firdaws, the middle and highest, under the throne, source of paradise's rivers", cluster: eschatology}
  judge-human-piece-of-fire: {label: "I am only human; a more eloquent litigant may win my judgment; whatever I award of a Muslim's right is a piece of fire: take it or leave it", cluster: ethics}
  prophet-forgets-as-you-forget: {label: "I am only a human like you; I forget as you forget; when I forget, remind me", cluster: ritual}
  # ---- Maryam
  prophets-leave-no-inheritance: {label: "We are not inherited: what we leave is alms; my heirs do not divide dinars; what I leave after my wives' upkeep and my agent's provision is charity", cluster: ritual}
  named-after-prophets-and-righteous: {label: "Asked at Najran how Mary is 'sister of Aaron' when Moses lived long before: 'they used to name after their prophets and the righteous before them'", cluster: prophets}
  none-more-patient-at-insult-than-god: {label: "None is more patient at an insult he hears than God: they ascribe a son to him, yet he keeps them well and provides for them", cluster: cosmology}
  death-as-ram-slaughtered-between-paradise-and-hell: {label: "Death is brought as a white-and-black ram, stood between paradise and the fire; both peoples recognise it; it is slaughtered: 'eternity, no death'", cluster: eschatology}
  each-shown-other-seat-in-hell-or-paradise: {label: "None enters paradise without being shown the seat in the fire he would have had, to thank more; none enters the fire without seeing his seat in paradise, as regret", cluster: eschatology}
  abandoning-prayer-borders-shirk: {label: "Between a man and idolatry and unbelief is the abandoning of prayer", cluster: ritual}
  gabriel-asked-to-visit-more: {label: "The prophet asks Gabriel why he does not visit more often; Q 19:64 comes: 'we descend only by your Lord's command'", cluster: revelation}
  silence-of-scripture-is-pardon: {label: "What God made lawful in his book is lawful, what he forbade is forbidden, what he was silent on is pardon; God is not forgetful", cluster: ritual}
  son-of-adam-belies-and-insults-god: {label: "Divine saying: the son of Adam belies me in saying I will not restore him, and insults me in saying God took a son", cluster: cosmology}
  all-come-to-the-fire-then-leave-by-deeds: {label: "All people come to the fire, then go out of it according to their deeds (Q 19:71); none of the tree's pledgers will enter it", cluster: eschatology}
  debtor-claims-wealth-and-children-after-death: {label: "A smith's debtor will not pay until he disbelieves; told 'not until you die and rise', he says 'then I will pay you when I return to wealth and children' (Q 19:77)", cluster: sira}
  god-tells-gabriel-of-love-heaven-then-earth: {label: "When God loves a servant he tells Gabriel, Gabriel calls in heaven, the heavenly host love him, and acceptance is set for him on earth; the same for hatred", cluster: cosmology}
  # ---- Taha
  greatest-name-in-three-suras: {label: "God's greatest name, by which he answers, is in three suras: al-Baqara, Al Imran and Taha", cluster: ritual}
  forgotten-prayer-prayed-when-remembered: {label: "Whoever forgets a prayer prays it when he remembers; no expiation but that: 'establish prayer for my remembrance'", cluster: ritual}
  gabriel-as-questioner-hour-unknown: {label: "A man asks the prophet before the people what is faith, islam, ihsan and when is the Hour; 'the one asked knows no more'; its signs; he leaves and is not found: 'that was Gabriel teaching people their religion'", cluster: revelation}
  moses-killed-in-error-trial-from-east: {label: "Ibn Umar's son to Iraqis killing one another: 'trial comes from the east where Satan's two horns rise'; Moses killed the man of Pharaoh's people in error and God said 'you killed a soul and we saved you'", cluster: prophets}
units:
  # ================= al-Tawba (Q 9:81-128)
  - id: hadith-60-q9-worldly-fire-one-seventieth
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Your fire is one part of seventy of hell's fire (on 'the fire of hell is hotter', Q 9:81)
    read: ["Jāmiʿ 60:7061.1"]
    quran: ["9:81"]
    tags:
      - {motif: worldly-fire-one-seventieth-of-hell, refs: ["Jāmiʿ 60:7061.1"], note: "نار بني آدم التي يوقدون جزء من سبعين جزءا من نار جهنم ... إنها فضلت عليها بتسعة وستين جزءا"}
    hints:
      - "Worldly fire one seventieth of hell's against b. Berakhot 57b, where fire is one sixtieth of Gehinnom (esh ehad mi-shishim le-gehinnom)."
  - id: hadith-60-q9-irbad-farewell-admonition
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Al-Irbad, of those too poor to be mounted (Q 9:92), reports the farewell-like admonition
    read: ["Jāmiʿ 60:7061.2"]
    quran: ["9:92"]
    tags:
      - {motif: farewell-sermon-teeth-on-the-sunna, refs: ["Jāmiʿ 60:7061.2"], note: "كأن هذه موعظة مودع ... وإن كان عبدا حبشيا ... عضوا عليها بالنواجذ ... وكل بدعة ضلالة"}
  - id: hadith-60-q9-kab-truth-saved-him
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Ka'b's greatest blessing was not lying, unlike those who swore (Q 9:95)
    read: ["Jāmiʿ 60:7062.1"]
    quran: ["9:95-96"]
    tags:
      - {motif: laggard-confesses-truth-refusing-excuse, refs: ["Jāmiʿ 60:7062.1"], note: "ما أنعم الله علي من نعمة بعد إذ هداني أعظم من صدقي رسول الله أن لا أكون كذبته فأهلك كما هلك الذين كذبوا"}
  - id: hadith-60-q9-mixed-deeds-city-of-gold-bricks
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: The half-fair, half-ugly men washed in the river are those who mixed good and bad deeds (Q 9:102)
    read: ["Jāmiʿ 60:7062.2"]
    quran: ["9:102-103"]
    tags:
      - {motif: city-of-gold-and-silver-bricks, refs: ["Jāmiʿ 60:7062.2"], note: "مدينة مبنية بلبن ذهب ولبن فضة"}
      - {motif: half-fair-half-ugly-washed-in-white-river, refs: ["Jāmiʿ 60:7062.2"], note: "شطر من خلقهم كأحسن ما أنت راء وشطر كأقبح ... فقعوا في ذلك النهر ... خلطوا عملا صالحا وآخر سيئا تجاوز الله عنهم"}
  - id: hadith-60-q9-men-tied-to-pillars
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Abu Lubaba and the laggards bind themselves to the mosque pillars; their alms taken (Q 9:102-103)
    read: ["Jāmiʿ 60:7063.1-7063.2"]
    quran: ["9:102-103"]
    tags:
      - {motif: laggards-bind-themselves-to-mosque-pillars, refs: ["Jāmiʿ 60:7063.1", "Jāmiʿ 60:7063.2"], note: "كان عشرة رهط ... أوثق سبعة منهم أنفسهم بسواري المسجد ... لا أطلقهم ولا أعذرهم حتى يكون الله هو الذي يطلقهم / كان ممن تخلف ... ستة ... فربطوا أنفسهم بالسواري"}
  - id: hadith-60-q9-blessing-on-alms-givers
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: '"Pray for them": the prophet blesses the family of each alms-bringer'
    read: ["Jāmiʿ 60:7064.1"]
    quran: ["9:103"]
    tags:
      - {motif: prophet-blesses-family-of-alms-giver, refs: ["Jāmiʿ 60:7064.1"], note: "إذا أتاه قوم بصدقتهم قال: اللهم صل على آل فلان ... اللهم صل على آل أبي أوفى"}
  - id: hadith-60-q9-god-accepts-repentance-and-alms
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: God's hand stretched for repentance; he rears the lawful charity like a foal (Q 9:104)
    read: ["Jāmiʿ 60:7064.2-7064.3"]
    quran: ["9:104"]
    tags:
      - {motif: god-stretches-hand-by-night-and-day-for-repentance, refs: ["Jāmiʿ 60:7064.2"], note: "يبسط يده بالليل ليتوب مسيء النهار ويبسط يده بالنهار ليتوب مسيء الليل حتى تطلع الشمس من مغربها"}
      - {motif: faith-unaccepted-after-sign-of-the-end, refs: ["Jāmiʿ 60:7064.2"], note: "حتى تطلع الشمس من مغربها"}
      - {motif: god-rears-charity-like-a-foal, refs: ["Jāmiʿ 60:7064.3"], note: "فيتلقاه الرحمن بيده فيربيها كما يربي أحدكم فلوه ووصيفه أو فصيله"}
  - id: hadith-60-q9-mosque-of-harm-and-of-piety
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: The rival mosque and Abu Amir's appeal to Caesar; which mosque was founded on piety (Q 9:107-108)
    read: ["Jāmiʿ 60:7065.1-7067.1"]
    quran: ["9:107-108"]
    tags:
      - {motif: mosque-of-harm, refs: ["Jāmiʿ 60:7065.1"], note: "هم أناس من الأنصار ابتنوا مسجدا"}
      - {motif: rival-mosque-founder-goes-to-caesar, refs: ["Jāmiʿ 60:7065.1"], note: "فإني ذاهب إلى قيصر ملك الروم فآتي بجند من الروم فأخرج محمدا وأصحابه"}
      - {motif: mosque-founded-on-piety, refs: ["Jāmiʿ 60:7066.1", "Jāmiʿ 60:7066.2", "Jāmiʿ 60:7067.1"], note: "وأسس المسجد الذي أسس على التقوى (in Banu Amr b. Awf) / هو مسجدكم هذا - لمسجد المدينة / هو مسجدي هذا"}
      - {motif: pebbles-struck-on-ground-naming-the-mosque, refs: ["Jāmiʿ 60:7066.2"], note: "فأخذ كفا من حصباء فضرب به الأرض ثم قال: هو مسجدكم هذا"}
  - id: hadith-60-q9-wandering-is-jihad
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: The 'wanderers' (al-sa'ihun, Q 9:112) - the wandering of this community is jihad
    read: ["Jāmiʿ 60:7068.1"]
    quran: ["9:112"]
    tags:
      - {motif: wandering-of-community-is-jihad, refs: ["Jāmiʿ 60:7068.1"], note: "ائذن لي بالسياحة ... إن سياحة أمتي الجهاد في سبيل الله"}
  - id: hadith-60-q9-forgiveness-for-polytheist-kin
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Abu Talib's death, the prophet's mother, and Abraham's prayer for his father (Q 9:113-114)
    read: ["Jāmiʿ 60:7068.2-7069.4"]
    quran: ["9:113-114", "28:56"]
    tags:
      - {motif: dying-uncle-chooses-religion-of-his-father, refs: ["Jāmiʿ 60:7068.2", "Jāmiʿ 60:7069.1"], note: "هو على ملة عبد المطلب وأبى أن يقول لا إله إلا الله / لولا أن تعيرني قريش يقولون إنما حمله على ذلك الجزع لأقررت بها عينيك"}
      - {motif: no-forgiveness-prayer-for-polytheist-kin, refs: ["Jāmiʿ 60:7068.2", "Jāmiʿ 60:7069.3", "Jāmiʿ 60:7069.4"], note: "لأستغفرن لك ما لم أنه عنك ... ما كان للنبي والذين آمنوا أن يستغفروا للمشركين / أتستغفر لهما وهما مشركان فقال أولم يستغفر إبراهيم لأبيه"}
      - {motif: mothers-grave-visit-allowed-forgiveness-not, refs: ["Jāmiʿ 60:7069.2"], note: "استأذنت ربي أن أستغفر لأمي فلم يأذن لي واستأذنته أن أزور قبرها فأذن لي"}
  - id: hadith-60-q9-azar-hyena
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Abraham meets Azar at the resurrection; the father becomes a hyena (Q 9:114)
    read: ["Jāmiʿ 60:7070.1"]
    quran: ["9:114"]
    tags:
      - {motif: father-named-azar, refs: ["Jāmiʿ 60:7070.1"], note: "يلقى إبراهيم أباه آزر يوم القيامة وعلى وجه آزر قترة وغبرة"}
      - {motif: abraham-meets-father-at-resurrection, refs: ["Jāmiʿ 60:7070.1"], note: "ألم أقل لك لا تعصني فيقول أبوه فاليوم لا أعصيك ... إنك وعدتني أن لا تخزيني يوم يبعثون فأي خزي أخزى من أبي الأبعد"}
      - {motif: azar-turned-into-a-hyena, refs: ["Jāmiʿ 60:7070.1"], note: "فإذا هو بذيخ ملتطخ فيؤخذ بقوائمه فيلقى في النار"}
  - id: hadith-60-q9-hour-of-hardship
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Umar on the hour of hardship (Q 9:117) - thirst, camel stomachs, and the rain-cloud
    read: ["Jāmiʿ 60:7070.2"]
    quran: ["9:117-118"]
    tags:
      - {motif: thirst-camel-stomach-water-drunk, refs: ["Jāmiʿ 60:7070.2"], note: "حتى أن الرجل لينحر بعيره فيعصر فرثه فيشربه ويجعل ما بقي على كبده"}
      - {motif: prayer-for-rain-cloud-stops-at-camp-edge, refs: ["Jāmiʿ 60:7070.2"], note: "فرفع يديه فلم يرجعهما حتى أظلت سحابة فسكبت ... فلم نجدها جاوزت العسكر"}
  - id: hadith-60-q9-three-left-behind
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Ka'b b. Malik's story of the three who were left behind (Q 9:117-119)
    read: ["Jāmiʿ 60:7071.1"]
    quran: ["9:117-119", "9:95-96"]
    tags:
      - {motif: laggard-confesses-truth-refusing-excuse, refs: ["Jāmiʿ 60:7071.1"], note: "وكانوا بضعة وثمانين رجلا فقبل منهم علانيتهم ... لا والله ما كان لي من عذر ... أما هذا فقد صدق فقم حتى يقضي الله فيك"}
      - {motif: community-boycott-of-fifty-nights, refs: ["Jāmiʿ 60:7071.1"], note: "ونهى رسول الله المسلمين عن كلامنا أيها الثلاثة ... حتى تنكرت في نفسي الأرض ... فلبثنا على ذلك خمسين ليلة"}
      - {motif: burns-enemy-kings-letter-in-oven, refs: ["Jāmiʿ 60:7071.1"], note: "دفع إلي كتابا من ملك غسان ... فالحق بنا نواسك ... وهذا أيضا من البلاء فتيممت بها التنور فسجرته بها"}
      - {motif: separation-from-wife-ordered-not-divorce, refs: ["Jāmiʿ 60:7071.1"], note: "حتى إذا مضت أربعون ليلة من الخمسين ... يأمرك أن تعتزل امرأتك فقلت أطلقها ... لا بل اعتزلها ولا تقربها"}
      - {motif: herald-on-mount-sal-announces-repentance, refs: ["Jāmiʿ 60:7071.1"], note: "صارخ أوفى على جبل سلع بأعلى صوته يا كعب بن مالك أبشر ... فخررت ساجدا ... وكان الصوت أسرع من الفرس ... نزعت له ثوبي"}
  - id: hadith-60-q9-truthfulness-leads-to-paradise
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: '"Be with the truthful" (Q 9:119): truth leads to righteousness and paradise'
    read: ["Jāmiʿ 60:7075.1"]
    quran: ["9:119"]
    tags:
      - {motif: truthfulness-leads-to-paradise-lie-to-fire, refs: ["Jāmiʿ 60:7075.1"], note: "إن الصدق يهدي إلى البر وإن البر يهدي إلى الجنة ... حتى يكون صديقا ... حتى يكتب عند الله كذابا"}
  # ================= Yunus (Q 10)
  - id: hadith-60-q10-do-not-curse-camel
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: The man who cursed his camel; do not pray against yourselves (Q 10:11)
    read: ["Jāmiʿ 60:7077.1"]
    quran: ["10:11"]
    tags:
      - {motif: cursed-camel-sent-away, refs: ["Jāmiʿ 60:7077.1"], note: "شأ لعنك الله ... انزل عنه فلا تصحبنا بملعون لا تدعوا على أنفسكم ولا على أولادكم ولا على أموالكم لا توافقوا من الله ساعة يسأل فيها عطاء فيستجيب لكم"}
  - id: hadith-60-q10-believers-affair-all-good
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: The believer's affair is all good (Q 10:12)
    read: ["Jāmiʿ 60:7077.2"]
    quran: ["10:12"]
    tags:
      - {motif: believers-affair-all-good, refs: ["Jāmiʿ 60:7077.2"], note: "عجبا لأمر المؤمن إن أمره كله خير ... إن أصابته سراء شكر ... وإن أصابته ضراء صبر"}
  - id: hadith-60-q10-two-angels-and-the-banquet
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Two angels call at every sunrise and sunset; the angels' parable of the house and the caller (Q 10:25)
    read: ["Jāmiʿ 60:7078.1-7079.1"]
    quran: ["10:25", "92:1-10"]
    tags:
      - {motif: two-angels-proclaim-daily-at-sunrise-and-sunset, refs: ["Jāmiʿ 60:7078.1"], note: "إلا وكل بجنبتيها ملكان يناديان نداء يسمعه خلق الله كلهم غير الثقلين: يا أيها الناس هلموا إلى ربكم ... اللهم أعط منفقا خلفا وأعط ممسكا تلفا"}
      - {motif: prophets-eyes-sleep-hearts-do-not, refs: ["Jāmiʿ 60:7079.1"], note: "إن العين نائمة والقلب يقظان (thrice)"}
      - {motif: angels-parable-house-banquet-and-caller, refs: ["Jāmiʿ 60:7079.1"], note: "مثله كمثل رجل بنى دارا وجعل فيها مأدبة وبعث داعيا ... فالدار الجنة والداعي محمد"}
    hints:
      - "The daily angelic proclamation heard by all creation against m. Avot 6:2: 'every day a heavenly voice (bat qol) goes out from Mount Horeb and proclaims'."
      - "The house, the banquet and the caller against Matt 22:1-10 / Luke 14:16-24, the man who made a great supper and sent his servant to call; here the sleeping prophet's angels explain the caller is Muhammad."
  - id: hadith-60-q10-the-increase-is-seeing-god
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: The 'increase' (Q 10:26) - the veil is lifted
    read: ["Jāmiʿ 60:7079.2"]
    quran: ["10:26"]
    tags:
      - {motif: veil-lifted-sight-of-lord-is-the-increase, refs: ["Jāmiʿ 60:7079.2"], note: "تريدون شيئا أزيدكم ... فيكشف الحجاب فما أعطوا شيئا أحب إليهم من النظر إلى ربهم"}
  - id: hadith-60-q10-god-forbade-injustice
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: '"God does not wrong people" (Q 10:44): the divine saying of Abu Dharr'
    read: ["Jāmiʿ 60:7080.1"]
    quran: ["10:44"]
    tags:
      - {motif: god-forbade-injustice-to-himself, refs: ["Jāmiʿ 60:7080.1"], note: "إني حرمت الظلم على نفسي ... إلا كما ينقص المخيط إذا أدخل البحر ... إنما هي أعمالكم أحصيها لكم"}
