    quran: ["19:39"]
    tags:
      - {motif: death-as-ram-slaughtered-between-paradise-and-hell, refs: ["Jāmiʿ 60:7171.2", "Jāmiʿ 60:7172.1"], note: "يجاء بالموت يوم القيامة كأنه كبش أملح فيوقف بين الجنة والنار ... نعم هذا الموت ... فيؤمر به فيذبح ... خلود فلا موت"}
      - {motif: each-shown-other-seat-in-hell-or-paradise, refs: ["Jāmiʿ 60:7172.2"], note: "لا يدخل أحد الجنة إلا أري مقعده من النار لو أساء ليزداد شكرا ولا يدخل النار أحد إلا أري مقعده من الجنة لو أحسن ليكون عليه حسرة"}
    hints:
      - "Death brought and slaughtered before the righteous and the wicked against b. Sukkah 52a, where God brings the evil inclination and slaughters it (shohato) before the righteous and the wicked, and Isa 25:8, 'he will swallow up death forever'."
      - "Each shown his place in the other abode against b. Hagigah 15a: every person has two portions, one in Eden and one in Gehinnom, and the righteous take the wicked's portion in Eden."
