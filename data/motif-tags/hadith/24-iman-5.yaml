    note: أُريت ما تلقى أمّتي بعدي، وسفك بعضهم دماء بعضٍ، وسبق ذلك من اللَّه، كما سبق على الأمم قبلهم، فسألته أن يولّيني شفاعةً يوم القيامة فيهم
  - motif: companions-held-back-forgiveness-prayers-for-grave-sinners
    refs:
    - Jāmiʿ 2:643.2
    note: ما زلنا نُمسك عن الاستغفار لأهل الكبائر حتى سمعنا من في نبيِّنا ﷺ
  - motif: intercession-for-grave-sinners
    refs:
    - Jāmiʿ 2:643.2
    note: فإنّي أخّرتُ شفاعتي لأهل الكبائر من أمّتي يوم القيامة
- id: hadith-2-god-keeps-the-confessors
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: '''This is not for you but for me'': by my might, forbearance and mercy I leave none in the fire who said no god but God'
  read:
  - Jāmiʿ 2:646.1
  tags:
  - motif: fourth-return-god-keeps-those-who-said-no-god-but-god
    refs:
    - Jāmiʿ 2:646.1
    note: 'فيقول: ليست هذه لك يا محمد، إنّما هي لي، أما وعزّتي وحِلْمي ورحمتي لا أدعُ في النّار أحدًا -أو قال: عبدًا- قال: لا إله إلّا اللَّه'
- id: hadith-2-prayer-at-the-call
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The prayer on hearing the call earns his intercession
  read:
  - Jāmiʿ 2:647.1
  tags:
  - motif: prayer-at-the-call-earns-intercession
    refs:
    - Jāmiʿ 2:647.1
    note: اللهمَّ ربَّ هذه الدّعوة التّامة، والصّلاة القائمة، آتِ محمّدًا الوسيلة والفضيلة، وابعثه مقامًا محمودًا الذي وعدته، حلَّتْ له شفاعتي يوم القيامة
- id: hadith-2-medina-intercession
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Who dies in Medina, who endures its hardship: he will intercede or witness for him'
  read:
