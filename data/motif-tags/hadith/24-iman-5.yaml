  - motif: you-are-digging-them-out
    refs:
    - Jāmiʿ 2:570.2
    note: 'قال أبو هريرة: وقد ذهب رسول اللَّه ﷺ، وأنتم تنتثلونها'
- id: hadith-2-al-kawthar
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Al-Kawthar: a river with banks of hollow pearl domes, mud of musk, vessels as the stars, birds with camel necks; a sura sent down in a doze'
  read:
  - Jāmiʿ 2:570.3-573.2
  quran:
  - '108:1'
  - 108:1-3
  tags:
  - motif: prophet-given-al-kawthar
    refs:
    - Jāmiʿ 2:570.3
    - Jāmiʿ 2:571.4
    - Jāmiʿ 2:572.1
    - Jāmiʿ 2:573.2
    note: نهر أعطيه نبيّكم ﷺ; "فإنّه نهر وعدنيه ربّي ﷿، عليه خير كثير"
  - motif: kawthar-banks-domes-of-hollow-pearl
    refs:
    - Jāmiʿ 2:570.3
    - Jāmiʿ 2:571.1
    - Jāmiʿ 2:571.2
    - Jāmiʿ 2:572.1
    - Jāmiʿ 2:572.2
    note: شاطئاه عليه دُرّ مجوّف; حافتاه قِباب اللؤلؤ مجوفًا; حافتاه خيامُ اللؤلؤ
  - motif: basin-vessels-numbered-as-the-stars
    refs:
    - Jāmiʿ 2:570.3
    - Jāmiʿ 2:571.4
    note: آنيته كعدد النّجوم; آنيته عدد النّجوم
  - motif: kawthar-river-with-pearl-palace-and-musk
    refs:
    - Jāmiʿ 2:571.2
    - Jāmiʿ 2:571.3
    - Jāmiʿ 2:572.2
    note: فإذا طينُه أو طيبُه مسك أذفر; فإذا هو بنهر آخر عليه قصر من لؤلؤ وزبرجد فضرب يده، فإذا هو مسك أذفر
  - motif: nile-and-euphrates-flow-in-lowest-heaven
    refs:
    - Jāmiʿ 2:571.3
    note: فإذا هو في السّماء الدّنيا بنهرين بَطَّرِدان ... هذا النِّيل والفرات عنصرهما
  - motif: prophet-smiles-waking-from-a-doze-new-sura
    refs:
    - Jāmiʿ 2:571.4
    note: إذ أغْفى إغفاءةً، ثم رفع رأسه مبتسمًا ... "أنزلت عليّ آنفًا سورة"
  - motif: man-pulled-away-from-basin-you-know-not-what-he-innovated
    refs:
    - Jāmiʿ 2:571.4
    note: 'فيختلج العبد منهم. فأقول: ربّ إنّه من أمّتي. فيقول: ما تدري ما أحدثت بعدك'
  - motif: kawthar-river-not-dug-in-a-trench
    refs:
    - Jāmiʿ 2:572.1
    note: فإذا هو نهر يجري، ولم يشق شقا، فإذا حافتاه قباب اللؤلؤ ... وإذا حصاه اللؤلؤ
  - motif: kawthar-birds-necks-like-camels
    refs:
    - Jāmiʿ 2:572.3
    note: فيها طيرٌ أعناقُها كأعناق الجزر
  - motif: kawthar-banks-of-gold-bed-of-pearl-and-ruby
    refs:
    - Jāmiʿ 2:573.1
    - Jāmiʿ 2:573.2
    note: حافتاه من ذهب، ومجراه على الدّر والياقوت، تربته أطيب من المسك; يجري على جنادل الدُّرّ والياقوت
  hints:
  - The Nile and the Euphrates flowing in the lowest heaven at their source (Jāmiʿ 2:571.3), against Gen 2:10-14, the four rivers going out of Eden, Perath (Euphrates) and Gihon among them
- id: hadith-2-basin-distance-and-the-driven-away
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The basin as from Ayla to Ṣanʿāʾ with vessels like the stars; companions recognised and pulled away; the dream of the herdsman to the fire
