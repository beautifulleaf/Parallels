    note: حتى إنّ المؤمن ليشفعُ لأكثر من ربيعة ومضر
- id: hadith-2-jesus-at-the-bridge
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Waiting at the bridge, Jesus brings the prophets; creation bridled in sweat; one of every ninety-nine; whoever witnessed sincerely one day
  read:
  - Jāmiʿ 2:621.1
  tags:
  - motif: jesus-brings-prophets-to-him-at-the-bridge
    refs:
    - Jāmiʿ 2:621.1
    note: 'إني لقائمٌ أنتظرُ أمَّتي تَعْبُر على الصِّراط إذْ جاءني عيسى، فقال: هذه الأنبياءُ قد جاءتْك يا محمّد يسألون'
  - motif: people-bridled-in-sweat-believer-as-a-cold
    refs:
    - Jāmiʿ 2:621.1
    note: فالخلقُ مُلْجَمُون في العَرَقِ، فأمّا المؤمنُ فهو عليه كالزُّكْمة، وأمّا الكافر فيتغشَّاهُ الموتُ
  - motif: one-of-every-ninety-nine-brought-out
    refs:
    - Jāmiʿ 2:621.1
    note: فَشُفِّعْتُ في أُمّتي أن أُخْرِجَ من كلِّ تسعة وتسعين إنسانا واحدًا
  - motif: one-day-sincere-witness-enters
    refs:
    - Jāmiʿ 2:621.1
    note: من شهد أنه لا إله إلا اللَّه يومًا واحدًا مخلصا ومات على ذلك
