  - motif: companions-press-to-be-of-his-intercession
    refs:
    - Jāmiʿ 2:637.2
    - Jāmiʿ 2:638.1
    - Jāmiʿ 2:639.1
    note: ننشُدُك اللَّهَ والصُّحبةَ لَمَا جعلْتَنَا من أهل شفاعتك ... فلمّا أضَبُّوا عليه
  - motif: prophet-guarded-in-enemy-land
    refs:
    - Jāmiʿ 2:640.1
    note: أنّ النّبيّ ﷺ كان يحرُسُه أصحابه، فقمتُ ذات ليلة، فلم أره في منامه
