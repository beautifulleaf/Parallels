  - motif: sent-to-the-red-and-the-black
    refs:
    - Jāmiʿ 2:651.3
    - Jāmiʿ 2:652.2
    note: وبُعثتُ إلى الأحمر والأسود; بُعثتُ إلى النّاس كافّة، الأحمر والأسود
  - motif: earlier-peoples-burned-spoils-and-prayed-only-in-churches
    refs:
    - Jāmiʿ 2:652.1
    note: كانوا يحرقُونَها ... إنما كانوا يُصلُّون في كَنائِسهم وبِيَعِهم
- id: hadith-2-beyond-intercession
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Two his intercession will not reach: the unjust ruler and the extremist who passes out of religion'
