    note: 'فرفع يديه وقال: "اللهمّ أمّتي أمّتي" وبكي. فقال اللَّهُ ﷿: يا جبريل، اذْهب إلى محمّد -وربُّك أعلم- فسلْه ما يُبكيك؟ ... إنا سنرضيك في أمّتكَ ولا نسوءك'
- id: hadith-2-the-praised-station
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'The praised station is the intercession: sweat to mid-ear, nations kneeling each behind its prophet; the green robe on a hill; Gabriel at the right of the Merciful'
  read:
  - Jāmiʿ 2:626.1-627.1
  quran:
  - 17:79
  tags:
  - motif: beggar-comes-with-no-flesh-on-face
    refs:
