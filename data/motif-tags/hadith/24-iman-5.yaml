# Hadith chunk 24: al-Jāmiʿ al-Kāmil book 2 (kitāb al-īmān), pp. 558-677 (printed 1/559-678): the end of the bābs on
# prophethood (the glad tidings, the night ascent, his humanity, his preferences), al-Kawthar and the Basin (bābs 23-27), the
# bābs of intercession (1-20), and the first bābs of belief in the Last Day (the trumpet, the gathering, the reckoning, the bridge).
# Read in full from the Arabic (193 hadith). Reports the book repeats under several bābs are read again where they stand.
new_motifs:
  asks-companions-their-dreams-after-dawn-prayer:
    label: Turning from the dawn prayer, the prophet asks 'did any of you see a dream last night?'
    cluster: dreams
  good-dream-seen-by-a-man-or-shown-for-him:
    label: The glad tidings that remain are the good dream a man sees or that is seen for him (yarāhā aw turā lahu)
    cluster: dreams
  all-between-heaven-and-earth-know-him-but-rebel-jinn-and-men:
    label: Nothing between heaven and earth but knows he is God's messenger, except the rebels of jinn and men
    cluster: prophethood
  savage-camel-lays-its-lip-on-the-ground-and-kneels:
    label: A camel that charges everyone entering a garden comes when called, its lip (mishfar) to the ground, kneels, and is haltered and handed to its owner
    cluster: animals
  gatekeeper-of-heaven-asks-has-he-been-sent-for:
    label: At each heaven Gabriel says 'open'; the keeper asks 'who is it? is anyone with you? has he been sent for?' and opens
    cluster: ascension
  lote-tree-veiled-in-colours-unknown:
    label: At the Lote-Tree of the Boundary colours cover it 'I do not know what they are'
    cluster: ascension
  warner-before-severe-punishment:
    label: '''I am a warner to you before a severe punishment'''
    cluster: prophethood
  abu-lahab-tabban-laka:
    label: 'Abū Lahab answers the summons: ''perish you (tabban laka) the rest of the day, is it for this you gathered us?''; the sura ''perish the hands of Abū Lahab'' comes'
    cluster: sira
  prophets-curse-made-purification-for-the-cursed:
    label: 'The prophet''s condition with his Lord: any Muslim he curses, reviles or flogs undeservedly, let it be purification, alms and nearness for him'
    cluster: prophethood
  orphan-girl-told-may-your-age-not-grow:
    label: He tells Umm Sulaym's orphan girl 'you have grown, may your age not grow'; she weeps, and he explains his condition with his Lord
    cluster: sira
  pleased-and-angry-as-humans-are:
    label: '''I am human: I am pleased as humans are pleased and angry as humans are angry'''
    cluster: prophethood
  the-master-is-god:
    label: Called 'our master' (sayyid) by a delegation, he answers 'the master is God'; 'say your word, and let not Satan draw you on'
    cluster: theology
  not-raised-above-the-station-god-gave:
    label: '''I am Muhammad, servant of God and his messenger; I do not like you to raise me above the station God gave me'''
    cluster: prophethood
  walking-among-us-a-man-of-paradise:
    label: '''We used to see him walking among us, a man of the people of paradise'''
    cluster: sira
  hadith-given-free-once-travelled-for:
    label: A transmitter hands on a report 'for nothing', though men used to ride to Medina for less
    cluster: transmission
  ranks-like-the-ranks-of-angels:
    label: '''We were preferred over people by three: our ranks made like the ranks of the angels, all the earth a mosque, its soil a purifier when water is lacking'''
    cluster: ritual
  earlier-peoples-burned-spoils-and-prayed-only-in-churches:
    label: Those before him held eating spoils too grave and burned them, and held praying anywhere too grave, praying only in their churches and synagogues (kanāʾis, biyaʿ)
    cluster: law
  each-prophet-asked-his-request-mine-delayed:
    label: '''Ask, for every prophet has asked''; he delays his request to the Day of Resurrection for whoever bears witness there is no god but God'
    cluster: eschatology
  sent-to-the-red-and-the-black:
    label: '''I was sent to the red and the black'' (all people)'
    cluster: prophethood
  paradise-keeper-commanded-to-open-for-him-first:
    label: At paradise's gate the keeper asks 'who are you?' - 'Muhammad' - 'for you I was commanded; I open to none before you'
    cluster: eschatology
  you-are-digging-them-out:
    label: 'Abū Hurayra: the prophet is gone and you are drawing them out (the treasures)'
    cluster: sira
  kawthar-river-not-dug-in-a-trench:
    label: Al-Kawthar is a river that flows without having been dug (lam yushaqq shaqqan); its pebbles pearl, its soil musk
    cluster: paradise
  kawthar-banks-of-gold-bed-of-pearl-and-ruby:
    label: Al-Kawthar's two banks are of gold, its course runs over pearl and ruby, its soil better than musk, its water sweeter than honey and whiter than snow
    cluster: paradise
  prophet-smiles-waking-from-a-doze-new-sura:
    label: 'Dozing among them he raises his head smiling: ''a sura was sent down on me just now'' and recites al-Kawthar'
    cluster: revelation
  basin-as-wide-as-ayla-to-sana:
    label: 'The basin''s extent is given as between two named places: Ayla and Ṣanʿāʾ, Ṣanʿāʾ and Medina, Medina and ʿAmmān, Ayla and ʿAdan, ʿAdan and ʿAmmān, Ayla and Mecca, Ṣanʿāʾ and Buṣrā, Jarbāʾ and Adhruḥ'
    cluster: eschatology
  basin-a-months-journey-square:
    label: The basin is a month's journey, its corners equal (its breadth as its length)
    cluster: eschatology
  basin-whiter-than-milk-sweeter-than-honey-never-thirst:
    label: The basin's water is whiter than milk (or snow), sweeter than honey, more fragrant than musk; who drinks once never thirsts again
    cluster: eschatology
  companions-turned-back-on-their-heels-at-basin:
    label: 'Men of his companions are driven from the basin: ''they turned back on their heels (irtaddū ʿalā adbārihim al-qahqarā) after you''; ''away, away (suḥqan suḥqan) with whoever changed after me'''
    cluster: eschatology
  driven-from-basin-as-strange-camels-from-a-trough:
    label: He will drive men from his basin as stray (gharība) camels are driven from a trough
    cluster: eschatology
  dream-herdsman-leads-group-to-the-fire:
    label: In sleep he sees a group; a man comes between them and says 'come' - 'where?' - 'to the fire'; hardly any escape but like stray cattle (hamal al-naʿam)
    cluster: eschatology
  greets-graveyard-as-abode-of-believers:
    label: 'At the cemetery: ''peace on you, abode of a believing people; we shall join you, if God wills'''
    cluster: ritual
  brothers-are-those-not-yet-come:
    label: '''I wished we had seen our brothers'' - ''are we not your brothers?'' - ''you are my companions; our brothers are those who have not yet come'''
    cluster: eschatology
  own-horses-known-by-blazes-among-black-ones:
    label: As a man knows his blazed white-footed horses among wholly black ones, he will know his community by ablution's blazes
    cluster: eschatology
  prays-over-uhud-dead-after-eight-years-as-farewell:
    label: 'Eight years after Uḥud he prays over its dead like one bidding farewell to the living and the dead, then from the pulpit: ''I fear for you not idolatry but the world, that you vie for it'''
    cluster: sira
  prophet-forerunner-at-the-basin:
    label: '''I am your forerunner (faraṭ) at the basin'': he goes ahead to the water as the one who prepares the trough'
    cluster: eschatology
  woman-hears-ayyuha-al-nas-i-am-of-the-people:
    label: 'Umm Salama, her hair being combed, hears ''O people!''; the maid says he called the men; she: ''I am of the people'' and goes to hear of the basin'
    cluster: sira
  two-spouts-of-gold-and-silver-from-paradise-into-basin:
    label: Two spouts (mīzābān, mathʿabān) from paradise pour into the basin, one of gold, one of silver
    cluster: eschatology
  strikes-with-staff-at-basin-for-people-of-yemen:
    label: At the basin's edge ('uqr) he drives people back for the people of Yemen, striking with his staff until it flows over them
    cluster: eschatology
  vessels-more-than-stars-on-a-clear-dark-night:
    label: The basin's vessels outnumber the stars and planets 'on the dark cloudless night', vessels of paradise
    cluster: eschatology
  i-will-boast-of-your-numbers-do-not-fight-after-me:
    label: '''I am your forerunner at the basin and will vie with the nations by your number; do not fight one another after me'''
    cluster: eschatology
  people-come-with-vessels-and-skins-and-taste-nothing:
    label: Men and women will come with vessels and waterskins and taste nothing of it
    cluster: eschatology
  letter-written-on-question-from-companion:
    label: A Successor writes to a Companion by his slave asking for something he heard from the prophet; the Companion writes back the saying
    cluster: transmission
  seek-me-at-bridge-scale-or-basin:
    label: '''Seek me first at the bridge (ṣirāṭ), then at the scale (mīzān), then at the basin: I will not miss these three places'''
    cluster: eschatology
  each-thousand-with-seventy-thousand-and-three-handfuls:
    label: Seventy thousand without reckoning, with every thousand seventy thousand more, and three handfuls (ḥathayāt) of his Lord besides
    cluster: eschatology
  drinker-at-basin-never-darkens-in-face:
    label: Who drinks from the basin never thirsts again nor does his face ever darken
    cluster: eschatology
  god-extends-basin-with-a-stream-of-unknown-ends:
    label: God extends the basin for him with a kurāʿ (a tongue of water from paradise) whose two ends no created man knows
    cluster: eschatology
  poor-emigrants-crowd-the-basin:
    label: The poor emigrants, who fight and die in God's path, crowd to the basin first
    cluster: eschatology
  hiss-on-burning-fingers-son-of-adam-says-hiss:
    label: 'His fingers burned in a hot pot, he says ''ḥass'': the son of Adam says ''ḥass'' when cold strikes him and ''ḥass'' when heat strikes him'
    cluster: sira
  seventy-thousand-like-a-yellow-fly-among-flies:
    label: 'A companion: the seventy thousand are among your community only like a reddish fly among flies'
    cluster: eschatology
  dearest-that-your-people-drink-from-it:
    label: 'To the Anṣārī woman: ''the dearest of people to me are that your people drink their fill from it'''
    cluster: eschatology
  prophet-holds-your-waist-wraps-from-the-fire-moths:
    label: '''I hold you by your waist-wraps (ḥujaz) from the fire, and you overpower me, plunging into it as moths and locusts plunge'''
    cluster: eschatology
  my-kinship-benefits-in-both-worlds-but-you-changed:
    label: '''My kinship (raḥim) is joined in this world and the next''; at the basin men give their lineage: ''the lineage I know, but you innovated after me'''
    cluster: eschatology
  arrive-together-and-in-scattered-groups:
    label: '''You will come down to me (at the basin) together and in scattered groups'''
    cluster: eschatology
  governor-doubts-basin-and-sends-for-companions:
    label: ʿUbayd Allāh b. Ziyād doubts the basin and sends for Companions one after another to ask of it
    cluster: sira
  companionship-held-a-disgrace-dahdah:
    label: 'The governor mocks the old Companion Abū Barza as ''this Muḥammadī of yours, the dumpy one (al-daḥdāḥ)''; he: ''I never thought to live among people who count the companionship of Muḥammad a shame'''
    cluster: sira
  who-denies-basin-god-not-give-him-drink:
    label: '''Whoever denies it (the basin), may God not give him to drink from it'''
    cluster: eschatology
  dictated-sheet-from-companion-ridden-for:
    label: A written sheet the Companion ʿAbd Allāh b. ʿAmr dictated is fetched at a gallop till the horse sweats; the governor believes and keeps the sheet
    cluster: transmission
  believer-like-gold-blown-on-and-bee:
    label: The believer is like a piece of gold its owner blows on and it neither changes nor lessens; like the bee that eats good, lays good, and alights without breaking or spoiling
    cluster: wisdom
  old-women-pray-after-every-prayer-for-the-basin:
    label: Old women of Medina never prayed a prayer without asking God to bring them to the basin of Muḥammad
    cluster: ritual
  you-are-not-a-hundred-thousandth-part:
    label: 'At a halt: ''you are not one part in a hundred thousand of those who will come to me at the basin''; they were seven or eight hundred'
    cluster: eschatology
  signs-of-hour-obscenity-bad-neighbourliness-trust-reversed:
    label: The Hour will not come until obscenity, bad neighbourliness and cutting of kin appear, the trustworthy is called traitor and the traitor trusted
    cluster: eschatology
  companion-called-senile-cites-lying-hadith:
    label: Told 'you lie, you are an old man gone senile', the Companion answers with 'whoever lies about me deliberately, let him take his seat in hell'
    cluster: transmission
  who-abets-lying-rulers-not-at-basin:
    label: Rulers will come after him; whoever enters on them, confirms their lies and helps their wrong 'is not of me nor I of him' and will not come to the basin
    cluster: ethics
  ka-ab-told-fasting-a-shield-flesh-of-unlawful-gain:
    label: 'To Kaʿb b. ʿUjra: fasting is a shield, alms put out sin, prayer is an offering (or proof); flesh grown from unlawful gain (suḥt) does not enter paradise; people go out at morning, selling themselves, freeing or ruining them'
    cluster: ethics
  nine-men-five-and-four-arabs-and-non-arabs:
    label: He comes out to nine men, five and four, one number Arabs and the other non-Arabs (ʿajam)
    cluster: sira
  between-house-and-pulpit-a-garden-pulpit-on-basin:
    label: '''Between my house and my pulpit is a garden of the gardens of paradise, and my pulpit is on my basin'''
    cluster: sacred-space
  every-people-has-a-forerunner:
    label: '''Every people has a forerunner (faraṭ), and I am your forerunner at the basin; who does not thirst enters paradise'''
    cluster: eschatology
  most-followed-of-prophets-one-believed-by-one-man:
    label: '''I am the prophet with most followers; there is a prophet whom only one man of his community believed'''
    cluster: prophethood
  first-to-knock-at-paradise-gate:
    label: '''I am the first to knock (yaqraʿ) at the gate of paradise'''
    cluster: eschatology
  imam-and-spokesman-of-the-prophets:
    label: '''On the Day of Resurrection I will be the imam of the prophets, their spokesman (khaṭīb), and the holder of their intercession, without boast'''
    cluster: eschatology
  abu-hurayra-and-kaab-trade-prophet-and-books:
    label: 'Abū Hurayra and Kaʿb meet: Abū Hurayra tells from the prophet, Kaʿb from the books; Kaʿb asks ''did you hear this from God''s messenger?'''
    cluster: transmission
  intercession-reaches-who-died-associating-nothing:
    label: His intercession reaches whoever of his community died associating nothing with God
    cluster: eschatology
  quran-on-seven-letters-after-three-requests:
    label: 'Sent word to recite on one letter (ḥarf), he asks ease for his community; then two, then seven, with a request for each return: two prayers for forgiveness and the third kept for the day all creation, even Abraham, seek him'
    cluster: revelation
  struck-on-chest-sweats-as-if-seeing-god-in-fear:
    label: 'Doubt seizes Ubayy; the prophet strikes his chest: ''I poured with sweat, as if looking at God in fear'''
    cluster: revelation
  prophets-request-spent-on-world-or-against-people:
    label: 'God gave every prophet a request: some took it as worldly goods, some used it against their people who disobeyed and were destroyed; he hid his as intercession'
    cluster: prophethood
  hated-entering-then-loved:
    label: A delegation arrives hating no one more than whoever enters on him, and leaves loving no one more
    cluster: sira
  shoulder-of-meat-bites-then-tells-of-the-day:
    label: Brought meat, the foreleg he liked is lifted to him; he bites from it and says 'I am the master of people on the Day of Resurrection'
    cluster: sira
  gathered-on-one-plain-caller-heard-sight-penetrates:
    label: 'God gathers first and last on one plain (ṣaʿīd): the caller makes them hear, sight penetrates them, the sun draws near'
    cluster: eschatology
  praises-taught-him-under-the-throne:
    label: Under the Throne he falls prostrate and God opens to him praises he never opened to anyone before
    cluster: eschatology
  raise-your-head-ask-and-be-given:
    label: '''Muhammad, raise your head; ask and you will be given; intercede and your intercession will be accepted'''
    cluster: eschatology
  faith-weighed-barley-then-mustard-then-least:
    label: He is sent to bring out whoever has in his heart faith the weight of a barley grain (or wheat), then a mustard seed, then 'less, less, less than a mustard seed'
    cluster: eschatology
  fourth-return-god-keeps-those-who-said-no-god-but-god:
    label: 'At the fourth return he asks leave for whoever said ''no god but God''; God: ''that is not for you; by my might, pride, greatness and majesty, I will bring them out'''
    cluster: eschatology
  anas-held-back-the-end-lest-they-rely-on-it:
    label: Al-Ḥasan says Anas told them it twenty years before, when sound of memory, and now left out the end, forgot it or feared they would rely on it
    cluster: transmission
  none-left-in-fire-but-those-the-quran-holds:
    label: 'At the fourth return: ''none remains in the fire but whom the Quran has held and for whom eternity is due'''
    cluster: eschatology
  intercedes-within-a-set-limit:
    label: Each time he intercedes 'a limit is set for me' and he brings that number into paradise
    cluster: eschatology
  jesus-sealed-vessel-parable:
    label: 'Jesus sends them to Muhammad, ''seal of the prophets'': ''if goods were in a vessel sealed shut, could one get at them before the seal is broken?'''
    cluster: eschatology
  takes-ring-of-paradise-gate-and-asks-to-open:
    label: 'He comes to the gate of paradise, takes its door-ring and asks it opened: ''who are you?'' - ''Muhammad'''
    cluster: eschatology
  adam-intercedes-for-ten-million:
    label: After the prophet's intercessions Adam is given leave and intercedes for ten thousand thousand; then angels and prophets, and a believer for more than Rabīʿa and Muḍar
    cluster: eschatology
  adams-offspring-not-to-be-burned-today:
    label: 'The plea throughout: ''the offspring of Adam, let them not be burned in the fire today'''
    cluster: eschatology
  prophets-each-say-and-i-am-with-you:
    label: Each prophet sends them on with 'I will guide you ... and I am with you'
    cluster: eschatology
  faith-weighed-dinar-then-qirat-then-atom:
    label: Bring out whoever has in his heart the weight of a dinar of faith, then a qīrāṭ, then an atom
    cluster: eschatology
  lord-of-mankind-banner-of-praise-adam-under-it:
    label: '''I am the lord of people on the Day of Resurrection, without boast; in my hand the banner of praise (liwāʾ al-ḥamd), under it Adam and those after him'''
    cluster: eschatology
  jesus-brings-prophets-to-him-at-the-bridge:
    label: 'As he waits for his community to cross the bridge, Jesus comes: ''these are the prophets come to you asking you to pray God to part the gathered nations'''
    cluster: eschatology
  people-bridled-in-sweat-believer-as-a-cold:
    label: 'Creation is bridled in sweat: for the believer it is like a head-cold, the unbeliever death overwhelms'
    cluster: eschatology
  one-of-every-ninety-nine-brought-out:
    label: He is granted to bring out of his community one person of every ninety-nine
    cluster: eschatology
  one-day-sincere-witness-enters:
    label: 'God grants: bring in whoever bore witness there is no god but God sincerely for one day and died so'
    cluster: eschatology
  sweat-nearly-bridles-them:
    label: Gathered on one plain, the sweat almost bridles them (yukād yuljimuhum) as they go to Adam
    cluster: eschatology
  silent-from-forenoon-to-night-after-a-laugh:
    label: He laughs at forenoon and sits through noon, afternoon, sunset and night prayers without speaking; asked, he says all that will be of this world and the next was shown him
    cluster: sira
  prostrate-the-length-of-a-week:
    label: He falls prostrate the measure of a week (qadr jumuʿa), and again a week, until Gabriel takes him by the upper arms
    cluster: eschatology
  truthful-then-prophets-then-martyrs-intercede:
    label: '''Call the truthful (ṣiddīqūn)'' and they intercede; then the prophets, one with a band, one with five or six, one with none; then the martyrs'
    cluster: eschatology
  forgiven-for-leniency-in-buying-and-selling:
    label: 'One found in the fire who did no good but was lenient (asāmiḥ) with people in buying and selling: ''be lenient with my servant as he was with my servants'''
    cluster: eschatology
  burned-mans-reward-world-and-ten-times:
    label: 'The man who had himself burned from fear is told to look at the greatest king''s kingdom: he has its like and ten times more; ''do you mock me, and you the King?'' - this is what made the prophet laugh'
    cluster: eschatology
  weeps-my-community-gabriel-sent-to-ask:
    label: 'Reciting Abraham''s ''whoever follows me is of me'' and Jesus''s ''if you punish them'', he raises his hands, weeps ''my community, my community''; God sends Gabriel to ask why, ''and your Lord knows best'': ''we will please you in your community and not grieve you'''
    cluster: eschatology
  beggar-comes-with-no-flesh-on-face:
    label: The man who keeps begging comes on the Day of Resurrection without a scrap of flesh on his face
    cluster: ethics
  sweat-reaches-half-the-ear:
    label: The sun draws near until sweat reaches half the ear; they seek help of Adam, then Moses, then Muhammad
    cluster: eschatology
  clothed-in-green-robe-on-a-hill:
    label: 'He and his community stand on a hill; his Lord clothes him in a green robe, then gives him leave to say what God wills: that is the praised station'
    cluster: eschatology
  gabriel-at-right-of-the-merciful-confirmed:
    label: 'Earth stretched for God''s majesty, each man only room for his feet; called first, he says ''Lord, this one (Gabriel, at the right of the Merciful, never seen there before) told me you sent him to me''; God: ''he spoke truly'''
    cluster: eschatology
  earth-stretched-each-has-room-for-his-feet:
    label: On the Day of Resurrection the earth is stretched out for the Merciful's majesty; no human has more than the room for his two feet
    cluster: eschatology
  your-servants-worshipped-you-in-the-ends-of-earth:
    label: 'His intercession: ''Lord, your servants worshipped you in the far ends of the earth'''
    cluster: eschatology
  happiest-with-intercession-who-said-it-sincerely:
    label: 'Asked who is happiest with his intercession, he tells Abū Hurayra he thought none would ask before him, for his eagerness: whoever said ''no god but God'' sincerely from his heart'
    cluster: eschatology
  jahannamiyyun-named-by-paradise:
    label: Some come out of the fire after it scorched them and enter paradise; its people call them 'the Jahannamīs'
    cluster: eschatology
  brought-out-like-thaarir:
    label: Brought out of the fire by intercession 'like thaʿārīr' (small cucumbers, ḍaghābīs)
    cluster: eschatology
  kharijite-band-turned-back-by-jabir:
    label: Yazīd al-Faqīr, taken by a Khārijī view, sets out with a band; Jābir, by a pillar, tells of the praised station and of those brought out; they return, all but one man
    cluster: sira
  brought-out-like-sesame-sticks-washed-white-as-paper:
    label: They come out like sesame stalks, enter a river of paradise, wash, and come out like sheets of paper (qarāṭīs)
    cluster: eschatology
  intercession-for-grave-sinners:
    label: '''My intercession is for the people of the grave sins (kabāʾir) of my community'''
    cluster: eschatology
  as-if-he-had-lived-in-the-desert:
    label: At the image of seeds sprouting in flood-silt a hearer says 'it is as if God's messenger had been in the desert (bādiya)'
    cluster: sira
  choice-half-of-community-or-intercession:
    label: 'A visitor from his Lord offers him the choice: half (or a third) of his community enter paradise, or the intercession; he chooses intercession, ''more embracing for them'''
    cluster: eschatology
  sound-like-a-mill-in-upper-valley:
    label: At night, the prophet missing from camp, his companions hear at the top of the valley a sound like the whirr of a mill (hazīz al-raḥā) or the humming of bees
    cluster: revelation
  prophet-guarded-in-enemy-land:
    label: 'Companions find him gone from camp at night in enemy land and rebuke the risk: ''a prophet in enemy land has a guard'''
    cluster: sira
  companions-press-to-be-of-his-intercession:
    label: His companions adjure him 'by God and the companionship' to be of those he intercedes for; as more crowd him he declares it for all who associate nothing
    cluster: eschatology
  intercession-prayer-for-every-muslim-who-believes-in-me:
    label: 'His intercession: ''O God, forgive every Muslim servant who meets you believing in me, associating nothing with you'''
    cluster: eschatology
  god-faces-him-inside-paradise:
    label: He enters paradise's gate and 'the Compeller is facing me'; he prostrates and is told to raise his head
    cluster: eschatology
  fire-dwellers-taunt-worshippers-god-frees-them:
    label: 'Those of his community left in the fire are taunted: ''what good did your worship of God avail you?''; the Compeller: ''by my might I will free them''; written between their eyes ''freedmen of God'''
    cluster: eschatology
  freedmen-of-the-compeller-not-jahannamis:
    label: 'Paradise''s people call them ''the Jahannamīs''; the Compeller: ''no, these are the freedmen (''utaqāʾ) of the Compeller'''
    cluster: eschatology
  shown-his-community-shedding-blood-asks-intercession:
    label: Shown what his community will meet after him, shedding one another's blood as decreed for nations before, he asks to be given intercession for them
    cluster: eschatology
  companions-held-back-forgiveness-prayers-for-grave-sinners:
    label: 'Ibn ʿUmar: we held back from asking forgiveness for people of grave sins until we heard ''God does not forgive association ... I have kept my intercession for the people of grave sins'''
    cluster: eschatology
  prayer-at-the-call-earns-intercession:
    label: Who says at the call to prayer 'O God, Lord of this complete call and the established prayer, give Muhammad the means (wasīla) and excellence and raise him to the praised station you promised him' has his intercession
    cluster: ritual
  who-can-should-die-in-medina:
    label: '''Whoever can die in Medina, let him die there, for I will intercede for (and witness for) whoever dies there'''
    cluster: medina
  intercessor-or-witness-for-who-endures-medinas-hardship:
    label: None endures Medina's hardship (laʾwāʾ) and distress but he is his intercessor or witness on the Day of Resurrection
    cluster: medina
  abu-talib-in-shallow-fire-to-ankles-brain-boils:
    label: Abū Ṭālib is set in a shallow (ḍaḥḍāḥ) of fire reaching his ankles, from which his brain boils; but for the prophet he would be in the lowest depth
    cluster: eschatology
  uncle-who-guarded-him:
    label: 'Al-ʿAbbās: what did you avail your uncle, who used to guard you and be angry for you?'
    cluster: sira
  unjust-ruler-and-zealot-beyond-intercession:
    label: 'Two kinds of his community his intercession will not reach: an unjust, oppressive ruler (imām ẓalūm ghashūm) and every extremist (ghālin) who passes out of the religion'
    cluster: eschatology
  cursers-neither-witnesses-nor-intercessors:
    label: Those who curse much will be neither witnesses nor intercessors on the Day of Resurrection
    cluster: ethics
  servant-asks-his-company-in-paradise-help-by-prostration:
    label: 'His servant, asked what he wants, asks his company in paradise (or his intercession to be freed from the fire): ''help me against yourself by much prostration'''
    cluster: ritual
  world-passes-ask-for-the-hereafter:
    label: 'Given time to think, the servant reasons the world will end and asks for the hereafter: to be freed from the fire'
    cluster: ethics
  hundred-praying-over-dead-are-granted-intercession:
    label: No dead man is prayed over by a company of Muslims reaching a hundred, all interceding for him, but their intercession is accepted
    cluster: ritual
  forty-at-a-funeral-intercession-granted:
    label: No Muslim dies and forty men who associate nothing stand at his bier but God accepts their intercession; Ibn ʿAbbās waits for forty at his son's funeral
    cluster: ritual
  believers-plead-for-brothers-who-fasted-prayed-with-them:
    label: 'Believers plead with God for their brothers in the fire: ''they fasted, prayed and made pilgrimage with us''; told to bring out those they know, whose faces the fire may not touch'
    cluster: eschatology
  god-takes-a-handful-of-who-never-did-good:
    label: '''Angels, prophets and believers have interceded; there remains only the Most Merciful'': he takes a handful from the fire of people who never did good, charred, and casts them in the river of life'
    cluster: eschatology
  seed-in-flood-silt-yellow-green-in-sun-white-in-shade:
    label: 'They sprout like a seed in flood-silt: what is toward the sun yellowish and greenish, what is in shade white'
    cluster: eschatology
  freed-ones-with-seals-on-necks:
    label: 'They come out like pearls with seals (khawātim) on their necks, which paradise''s people know: freedmen of God admitted without deed'
    cluster: eschatology
  gods-pleasure-greater-than-paradise:
    label: '''I have for you better than this: my pleasure (riḍwān), I will never be angry with you after it'''
    cluster: eschatology
  man-intercedes-for-a-crowd-a-tribe-or-one-man:
    label: A man of his community intercedes for a crowd (fiʾām), another for a tribe, a band, three, two, one
    cluster: eschatology
  more-than-banu-tamim-by-one-mans-intercession:
    label: More than Banū Tamīm enter paradise by the intercession of one man of his community, 'other than me'
    cluster: eschatology
  jahannamiyyun-stinking-brought-out:
    label: God brings out a stinking (muntinīn) people the fire has burned by the intercessors' intercession; they are called the Jahannamīs
    cluster: eschatology
  tuba-tree-like-syrian-walnut:
    label: In paradise the tree Ṭūbā, like the walnut tree of Syria on a single trunk spreading at the top; a young camel would die of age before circling its root
    cluster: paradise
  grape-cluster-a-months-crow-flight:
    label: A grape cluster of paradise is a month's flight for the piebald crow without pause; one grape as a great he-goat's skin, enough for a household and its clan
    cluster: paradise
  angels-prophets-martyrs-intercede-thrice:
    label: Angels, prophets and martyrs are given leave and intercede and bring out, three (or four) times, down to whoever has an atom's weight of faith
    cluster: eschatology
  abraham-says-you-burned-my-sons:
    label: On the Day of Resurrection Abraham calls 'O my Lord!' - 'Here am I (yā labbaykāh)' - 'Lord, you have burned my sons'; whoever has an atom or barley-grain of faith is brought out
    cluster: eschatology
  martyr-six-traits-crown-seventy-two-wives-seventy-kin:
    label: 'The martyr has six traits: forgiven at the first spurt, sees his seat in paradise, saved from the grave''s punishment, safe from the great terror, a crown of dignity whose ruby is better than the world, married to seventy-two of the ḥūr, and intercedes for seventy of his kin'
    cluster: eschatology
  quran-comes-as-intercessor-for-its-people:
    label: '''Read the Quran, for it comes on the Day of Resurrection as an intercessor for its companions''; al-Baqara cannot be borne by the idle (baṭala)'
    cluster: eschatology
  rain-like-dew-and-bodies-grow:
    label: After the first blast God sends a rain like dew (or shade) and from it people's bodies grow; then the second blast
    cluster: eschatology
  worst-left-light-as-birds-minds-of-beasts-satan-bids-idols:
    label: The worst people remain, light as birds with the minds of beasts of prey; Satan appears and bids them worship idols, while their provision flows and life is good
    cluster: eschatology
  trumpeter-has-put-horn-to-mouth-brow-bent:
    label: '''How can I be at ease when the trumpeter has taken the horn in his mouth and bent his brow, waiting for the order to blow?'''
    cluster: eschatology
  no-one-enters-fire-while-owed-a-right-even-a-slap:
    label: 'God calls in a voice heard far as near, ''I am the King, I am the Judge (al-dayyān)'': none of the fire enters it while one of paradise owes him a right, nor the reverse, till I settle it, even a slap - paid in good and bad deeds'
    cluster: eschatology
  gathered-buhm-with-nothing:
    label: 'People are gathered naked, uncircumcised and buhm: ''having nothing with them'''
    cluster: eschatology
  walks-on-his-face-who-walked-on-feet:
    label: 'Asked how the unbeliever is gathered on his face: ''is not he who made him walk on two feet in this world able to make him walk on his face?'''
    cluster: eschatology
  adam-first-called-sees-his-offspring:
    label: 'The first called on the Day of Resurrection is Adam; his offspring see him: ''this is your father Adam''; he answers ''labbayka wa-saʿdayka'' and is told to bring out the contingent of hell, ninety-nine of every hundred'
    cluster: eschatology
  ninety-nine-of-every-hundred-to-hell:
    label: 'The contingent of hell from Adam''s offspring: ninety-nine of every hundred'
    cluster: eschatology
  aisha-questions-what-she-does-not-know:
    label: ʿĀʾisha never heard a thing she did not understand without going back over it until she understood
    cluster: transmission
  each-follows-what-he-worshipped-sun-moon-tawaghit:
    label: '''Whoever worshipped a thing, let him follow it'': sun-worshippers follow the sun, moon-worshippers the moon, those of the ṭawāghīt the ṭawāghīt; this community remains with its hypocrites'
    cluster: eschatology
  god-comes-in-a-form-not-known-then-known:
    label: 'God comes to them in a form other than the one they know: ''I am your Lord'' - ''we seek refuge in God from you''; then in the form they know, and they follow him'
    cluster: eschatology
  fire-eats-all-but-trace-of-prostration:
    label: The fire eats all of the son of Adam but the trace of prostration; God forbade the fire to eat it; by it the angels know whom to bring out
    cluster: eschatology
  last-man-promises-to-ask-no-more:
    label: 'The last to enter paradise asks his face turned from the fire, swearing to ask nothing else; then to be brought to the gate, then in: ''woe to you, son of Adam, how faithless you are!'''
    cluster: eschatology
  god-laughs-at-the-last-man:
    label: He keeps praying until God laughs at him; when God laughs, he says 'enter paradise'
    cluster: eschatology
  last-man-given-wish-and-its-like-or-tenfold:
    label: 'Told to wish till his wishes are spent, the last man is given: ''that is yours and its like with it'''
    cluster: eschatology
units:
- id: hadith-2-mubashshirat-remain
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Of prophecy only the glad tidings, the good dream, remain after him; he asks his companions their dreams after the dawn prayer
  read:
  - Jāmiʿ 2:558.1-559.1
  tags:
  - motif: only-good-dreams-left-of-prophecy
    refs:
    - Jāmiʿ 2:558.1
    - Jāmiʿ 2:558.2
    - Jāmiʿ 2:558.3
    - Jāmiʿ 2:559.1
    note: ليس يبقى بعدي من النّبوة، إلّا الرّؤيا الصّالحة; ذهبتِ النّبوةُ، وبقيت المبشِّراتُ; لا يبقى بعدي من النبوة شيء إلّا المبشرات
  - motif: asks-companions-their-dreams-after-dawn-prayer
    refs:
    - Jāmiʿ 2:558.1
    note: 'كان إذا انصرف من صلاة الغداة يقول: "هل رأى أحدٌ منكم اللّيلة رؤيا"'
  - motif: good-dream-seen-by-a-man-or-shown-for-him
    refs:
    - Jāmiʿ 2:558.3
    - Jāmiʿ 2:559.1
    note: الرّؤيا الصّالحة يراها الرجلُ، أو ترى له
- id: hadith-2-camel-of-bani-najjar
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'The savage camel in a garden of Banū l-Najjār kneels before him: all between heaven and earth know he is God''s messenger but rebel jinn and men'
  read:
  - Jāmiʿ 2:559.2
  tags:
  - motif: savage-camel-kneels-before-the-prophet
    refs:
    - Jāmiʿ 2:559.2
    note: إذا فيه جملٌ لا يدخل الحائط أحدٌ إلّا شدّ عليه
  - motif: savage-camel-lays-its-lip-on-the-ground-and-kneels
    refs:
    - Jāmiʿ 2:559.2
    note: فجاء واضعًا مشْفَرَه إلى الأرض، حتى برك بين يديه ... "هاتُوا خطامه" فخطمه ودفعه إلى صاحبه
  - motif: all-between-heaven-and-earth-know-him-but-rebel-jinn-and-men
    refs:
    - Jāmiʿ 2:559.2
    note: إنّه ليس شيءٌ بين السّماء والأرض، إلّا يعلمُ أنّي رسولُ اللَّه، إلّا عاصيَ الجنّ والإنس
- id: hadith-2-stone-greeted-him
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: A stone in Mecca greeted him before he was sent; he knows it still
  read:
  - Jāmiʿ 2:560.1
  tags:
  - motif: stone-in-mecca-greeted-me
    refs:
    - Jāmiʿ 2:560.1
    note: إنّي لأعرفُ حجرًا بمكة كان يُسلّم عليَّ قبل أن أُبعث، إنّي لأعرفه الآن
- id: hadith-2-night-journey-ascent
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'The roof split, the breast washed with Zamzam, the ascent: Adam between the souls of his offspring, the prophets'' welcomes, the scratching of pens, fifty prayers reduced to five, the lote-tree, paradise of pearl domes and musk soil'
  read:
  - Jāmiʿ 2:560.2
  quran:
  - '17:1'
  tags:
  - motif: prophets-breast-split-washed-with-zamzam
    refs:
    - Jāmiʿ 2:560.2
    note: فُرِجَ سقفُ بيتي وأنا بمكة فنزل جبريلُ ﷺ، فَفَرَجَ صَدْري. ثم غَسَلَهُ من ماء زمزم
  - motif: gold-basin-of-wisdom-and-faith-emptied-into-breast
    refs:
    - Jāmiʿ 2:560.2
    note: جاء بِطَسْتٍ من ذهب ممتلئ حكمة وإيمانًا فأفرغَها في صدري ثم أطبقه
  - motif: gatekeeper-of-heaven-asks-has-he-been-sent-for
    refs:
    - Jāmiʿ 2:560.2
    note: 'قال جبريلُ ﵇ لخازن السّماء الدّنيا: افتح. قال: مَنْ هذا؟ قال: هذا جبريل. قال: هل معك أحد؟ قال: نعم معي محمد ﷺ، قال: فأُرسل إليه؟'
  - motif: adam-laughs-right-weeps-left-at-offspring
    refs:
    - Jāmiʿ 2:560.2
    note: فإذا نظر قبل يمينه ضحك، وإذا نظر قبل شماله بكي ... نَسَمُ بنيه
  - motif: welcome-as-righteous-brother-or-son
    refs:
    - Jāmiʿ 2:560.2
    note: مرحبًا بالنّبي الصّالح والابن الصّالح; مرحبًا بالنّبيّ الصّالح، والأخ الصّالح
  - motif: scratching-of-the-pens-heard
    refs:
    - Jāmiʿ 2:560.2
    note: ثم عرج بي حتى ظهرْتُ لمستوًى أسمعُ فيه صريفَ الأقلام
  - motif: fifty-prayers-reduced-at-moses-urging
    refs:
    - Jāmiʿ 2:560.2
    note: ففرض اللَّه على أمّتي خمسين صلاة ... هي خمس وهي خمسون لا يبدل القول لدي ... قد استحييت من ربي
  - motif: lote-tree-veiled-in-colours-unknown
    refs:
    - Jāmiʿ 2:560.2
    note: حتى نأتي سدرةَ المنتهى فغشيها ألوانٌ لا أدري ما هي
  - motif: paradise-domes-of-pearl-soil-of-musk
    refs:
    - Jāmiʿ 2:560.2
    note: فإذا فيها جَنابذُ اللؤلؤ وإذا ترابُها المسك
  hints:
  - Fifty prayers bargained down to five as the prophet goes back and forth between God and Moses (Jāmiʿ 2:560.2), against Gen 18:23-32, Abraham bargaining God down from fifty righteous to ten
- id: hadith-2-warner-on-safa
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'On ''warn your nearest kin'' he calls the clans of Quraysh from Safa: horsemen in the valley; Abū Lahab''s ''perish'' and the sura on him'
  read:
  - Jāmiʿ 2:562.1
  quran:
  - 26:214
  - 111:1-2
  tags:
  - motif: ya-sabahah-from-safa
    refs:
    - Jāmiʿ 2:562.1
    note: 'صعد النّبيُّ ﷺ على الصّفا، فجعل ينادي: "يا بني فِهْر، يا بني عدي" ... أنّ خيلًا بالوادي تريد أن تغير عليكم أكنتم مُصدّقيَّ؟'
  - motif: warner-before-severe-punishment
    refs:
    - Jāmiʿ 2:562.1
    note: فإنّي نذيرٌ لكم بين يدي عذاب شديد
  - motif: abu-lahab-tabban-laka
    refs:
    - Jāmiʿ 2:562.1
    note: 'فقال أبو لهب: تبًّا لك سائر اليوم ألهذا جمعتنا؟'
- id: hadith-2-only-a-human
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: '''I am only a human'': he forgets, may misjudge a litigant, and his curses become purification for the cursed'
  read:
  - Jāmiʿ 2:563.1-564.1
  quran:
  - 18:110
  - '21:34'
  - '25:7'
  tags:
  - motif: prophet-forgets-as-you-forget
    refs:
    - Jāmiʿ 2:563.1
    note: إنّما أنا بشر مثلكم، أنسى كما تنسون، فإذا نسيتُ فذكّروني
  - motif: judge-human-piece-of-fire
    refs:
    - Jāmiʿ 2:563.2
    note: فمن قضيتُ له بحقّ مسلم فإنّما هي قطعة من النّار، فليأخذها أو فليتركها
  - motif: prophets-curse-made-purification-for-the-cursed
    refs:
    - Jāmiʿ 2:563.3
    - Jāmiʿ 2:563.4
    - Jāmiʿ 2:563.5
    - Jāmiʿ 2:564.1
    note: فأيّما رجل من المسلمين سببتُه، أو لعنتُه، أو جلدته فاجعلها له زكاة ورحمة; أو ما علمت ما شارطتُ عليه ربّي؟; اشترطت على ربيّ ﷿
  - motif: orphan-girl-told-may-your-age-not-grow
    refs:
    - Jāmiʿ 2:564.1
    note: آنتِ هِيَهْ؟ لقدْ كبِرْتِ، لا كبرَ سِنُّكِ ... فخرجتْ أمُّ سُليم مُستعجلةً تلوثُ خِمارها
  - motif: pleased-and-angry-as-humans-are
    refs:
    - Jāmiʿ 2:564.1
    note: إنّما أنا بشر. أرْضي كما يرْضى البشرُ، وأَغْضبُ كما يغضبُ البشر
- id: hadith-2-not-above-his-station
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Feet swollen in prayer though forgiven; 'do not extol me as the Christians extolled the son of Mary'; 'the master is God'
  read:
  - Jāmiʿ 2:564.2-565.3
  quran:
  - '48:2'
  tags:
  - motif: prays-until-feet-swell
    refs:
    - Jāmiʿ 2:564.2
    note: صَلَّى حتى انتفختْ قدماه
  - motif: shall-i-not-be-a-grateful-servant
    refs:
    - Jāmiʿ 2:564.2
    note: 'أتُكلّف هذا، وقد غفر اللَّه لك ما تقدّم من ذنبك وما تأخّر؟ فقال: "أفلا أكونُ عبدًا شكورًا"'
  - motif: do-not-extol-me-as-son-of-mary
    refs:
    - Jāmiʿ 2:564.3
    - Jāmiʿ 2:565.1
    note: 'لا تطْروني كما أَطْرتِ النّصارى ابنَ مريم، فإنّما أنا عبده، فقولوا: عبد اللَّه ورسوله'
  - motif: not-raised-above-the-station-god-gave
    refs:
    - Jāmiʿ 2:565.2
    note: أنا محمد، عبد اللَّه ورسوله، ما أحبُّ أن ترفعوني فوق منزلتي التي أنزلني اللَّه
  - motif: the-master-is-god
    refs:
    - Jāmiʿ 2:565.3
    note: 'فقلنا: أنت سيدنا، فقال: "السيد اللَّه ﵎" ... "قولوا بقولكم أو بعض قولكم، ولا يستجرنّكم الشّيطان"'
  hints:
  - '''Do not extol me as the Christians extolled the son of Mary; say servant of God'' (Jāmiʿ 2:564.3) against Mark 10:18, ''why do you call me good? none is good but God alone'''
- id: hadith-2-thabit-raised-voice
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Thābit b. Qays, who raised his voice above the prophet's, sits at home thinking himself of the fire; told he is of paradise
  read:
  - Jāmiʿ 2:565.4-566.1
  quran:
  - '49:2'
  tags:
  - motif: loud-voiced-man-thinks-himself-damned
    refs:
    - Jāmiʿ 2:565.4
    - Jāmiʿ 2:566.1
    note: 'كان يرفع صوته فوق صوت النّبيّ ﷺ فقد حبط عملُه، وهو من أهل النّار; "اذهب إليه فقل له: إنّك لست من أهل النّار، ولكن من أهل الجنّة"'
  - motif: walking-among-us-a-man-of-paradise
    refs:
    - Jāmiʿ 2:566.1
    note: فكنا نراه يمشي بين أظهرنا رجل من أهل الجنّة
- id: hadith-2-double-reward
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'The scriptuary believer''s double reward: the letter to Heraclius, and the three who receive their reward twice'
  read:
  - Jāmiʿ 2:567.1-567.2
  quran:
  - 28:52-54
  - 3:64
  tags:
  - motif: letter-to-heraclius-quotes-common-word
    refs:
    - Jāmiʿ 2:567.1
    note: من محمد رسول اللَّه إلى هرقل عظيم الرّوم. سلامٌ على من اتّبع الهدى
  - motif: submit-and-be-safe-reward-twice
    refs:
    - Jāmiʿ 2:567.1
    note: أسْلم تَسْلم، وأسْلم يؤتكَ اللَّه أجرك مرّتين، وإنْ تولّيتَ فإنّ عليك إثم الأريسيين
  - motif: three-get-double-reward
    refs:
    - Jāmiʿ 2:567.2
    note: 'ثلاثة يؤتون أجرهم مرّتين: الرّجل تكون له الأمة فيعلّمها ... ثم يعتقها فيتزوّجها ... ومؤمن أهل الكتاب ... والعبد يؤدي حقّ اللَّه وينصح لسيّده'
  - motif: hadith-given-free-once-travelled-for
    refs:
    - Jāmiʿ 2:567.2
    note: 'ثم قال الشّعبيّ: وأعطيتُكها بغير شيء، وقد كان الرّجلُ يرحل في أهون منها إلى المدينة'
- id: hadith-2-five-things-given
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Five (or six, or three) things given him that no prophet before had
  read:
  - Jāmiʿ 2:568.1-569.2
  tags:
  - motif: given-five-things-none-before
    refs:
    - Jāmiʿ 2:568.1
    - Jāmiʿ 2:568.3
    - Jāmiʿ 2:569.2
    note: 'أُعطيتُ خمسًا لم يُعطهنّ أحدٌ من الأنبياء قبلي: نُصرتُ بالرُّعب مسيرة شهر، وجعلتْ لي الأرض مسجدًا وطهورًا'
  - motif: preferred-over-prophets-by-six
    refs:
    - Jāmiʿ 2:568.2
    note: 'فُضِّلْتُ على الأنبياء بست: أُعطيت جوامع الكلم ... وخُتم بي النبيّون'
  - motif: sent-to-the-red-and-the-black
    refs:
    - Jāmiʿ 2:568.3
    note: وبُعثتُ إلى الأحمر والأسود
  - motif: ranks-like-the-ranks-of-angels
    refs:
    - Jāmiʿ 2:569.1
    note: فُضّلنا على النّاس بثلاثٍ، جعلتْ صفوفنا كصفوف الملائكة
  - motif: earlier-peoples-burned-spoils-and-prayed-only-in-churches
    refs:
    - Jāmiʿ 2:569.2
    note: وكان مَنْ قبلي يُعَظِّمون أَكْلَها كانوا يحرقُونَها ... إنّما كانوا يُصلُّون في كَنائِسهم وبِيَعِهم
  - motif: each-prophet-asked-his-request-mine-delayed
    refs:
    - Jāmiʿ 2:569.2
    note: 'قيل لي: سَلْ فإنَّ كلَّ نبيٍّ قد سأل، فأخَّرْتُ مسألتي إلى يوم القيامة'
  hints:
  - 'Earlier prophets'' spoils burned (Jāmiʿ 2:569.2), against Deut 13:16 and Josh 6:24, the herem: the spoil burned whole to the LORD'
- id: hadith-2-first-at-paradise-gate
  tradition: islam
