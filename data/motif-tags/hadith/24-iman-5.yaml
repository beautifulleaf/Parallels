    note: ما يزال الرّجلُ يسأل النّاس حتى يأتي يوم القيامة ليس في وجهه مُزْعة لحم
  - motif: sweat-reaches-half-the-ear
    refs:
    - Jāmiʿ 2:626.1
    note: إنّ الشّمس تدنو يوم القيامة حتى يبلغ العرقُ نصف الأذن، فبينما هم كذلك استغاثوا بآدم، ثم بموسى، ثم بمحمد ﷺ
  - motif: praised-station-intercession
    refs:
    - Jāmiʿ 2:626.1
    - Jāmiʿ 2:626.2
    - Jāmiʿ 2:626.3
    - Jāmiʿ 2:627.1
    note: فيومئذ يبعثه اللَّه مقامًا محمودًا، يحمده أهل الجمع كلهم; إنّ النّاس يصيرون يوم القيامة جُثًا، كلّ أمّة تتبع نبيَّها; فذاك المقام المحمود
  - motif: clothed-in-green-robe-on-a-hill
    refs:
    - Jāmiʿ 2:626.3
    note: فأكون أنا وأمّتي على تلٍّ، ويكسوني ربي ﵎ حُلَّةً خضراء
  - motif: earth-stretched-each-has-room-for-his-feet
    refs:
    - Jāmiʿ 2:627.1
    note: تمدُّ الأرض يوم القيامة مدًّا لعظمة الرّحمن، ثم لا يكون لبشر من بني آدم إلّا موضع قدميه
  - motif: gabriel-at-right-of-the-merciful-confirmed
    refs:
    - Jāmiʿ 2:627.1
    note: 'يارب أخبرني هذا -لجبريل- وهو عن يمين الرحمن، -واللَّه ما رآه جبريل قبلها قطّ- إنك أرسلته إلي ... حتى يقول اللَّه: صدق'
  - motif: your-servants-worshipped-you-in-the-ends-of-earth
    refs:
    - Jāmiʿ 2:627.1
    note: يا ربّ عبادك عبدوك في أطراف الأرض
- id: hadith-2-intercession-for-who-said-no-god
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The happiest with his intercession; the scorched Jahannamīs; charcoal sprouting like seed in flood-silt; Jābir turns back the Khārijī band; intercession for the grave sinners
  read:
  - Jāmiʿ 2:633.1-637.1
  quran:
  - 3:192
  - '32:20'
  - 17:79
  tags:
  - motif: happiest-with-intercession-who-said-it-sincerely
    refs:
    - Jāmiʿ 2:633.1
    note: 'لقد ظننتُ يا أبا هريرة أن لا يسألني عن هذا الحديث أحدٌ أوّلُ منك، لما رأيتُ من حرصك على الحديث. أسعدُ النّاس بشفاعتي يوم القيامة، من قال: لا إله إلّا اللَّه خالصًا من قلبه أو نفسه'
  - motif: taken-from-fire-with-grain-of-faith
    refs:
    - Jāmiʿ 2:634.1
    note: 'أدخل الجنّة من كان في قلبه خردلة، فيدخلون، ثم أقول: أدخل الجنّة من كان في قلبه أدنى شيء'
  - motif: jahannamiyyun-named-by-paradise
    refs:
    - Jāmiʿ 2:634.2
    - Jāmiʿ 2:636.1
    note: يخرجُ قومٌ من النّار بعد ما مسّهم منها سَفْعٌ فيدخلون الجنّة، فيسمّيهم أهل الجنّة الجهنميين; يُسَمَّون الجهنميين
  - motif: sinners-made-charcoal-then-sprout-by-river
    refs:
    - Jāmiʿ 2:634.3
    note: فأماتهم إماتةً حتّى إذا كانوا فحمًا أُذن بالشّفاعة، فجيء بهم ضبائر ضبائر، فبثُّوا على أنهار الجنّة ... فينبتون نبات الحِبَّةِ تكون في حَميل السّيل
  - motif: as-if-he-had-lived-in-the-desert
    refs:
    - Jāmiʿ 2:634.3
    note: 'فقال رجل من القوم: كأنّ رسول اللَّه ﷺ قد كان بالبادية'
  - motif: brought-out-like-thaarir
    refs:
    - Jāmiʿ 2:635.1
    note: 'يخرج من النّار بالشّفاعة كأنّهم الثّعارير". قلت: ما الثّعارير؟ قال: الضغابيس'
  - motif: kharijite-band-turned-back-by-jabir
    refs:
    - Jāmiʿ 2:635.2
    note: كنتُ قد شغفني رأيٌ مِنْ رأي الخوارج ... فرجعنا، فلا واللَّه ما خرج منا غير رجل واحد
  - motif: brought-out-like-sesame-sticks-washed-white-as-paper
    refs:
    - Jāmiʿ 2:635.2
    note: 'فيخرجون كأنهم عيدان السّماسم. قال: فيدخلون نهرًا من أنهار الجنّة، فيغسلون فيه، فيخرجون كأنّهم القراطيس'
  - motif: intercession-for-grave-sinners
    refs:
    - Jāmiʿ 2:636.2
    - Jāmiʿ 2:636.3
    - Jāmiʿ 2:637.1
    note: شفاعتي لأهل الكبائر من أمّتي
