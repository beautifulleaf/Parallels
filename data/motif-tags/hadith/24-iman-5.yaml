- id: hadith-2-basin-spouts-and-the-yemenis
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'The basin: two spouts of gold and silver from paradise, vessels beyond the stars, his staff for the people of Yemen; some come with vessels and taste nothing'
  read:
  - Jāmiʿ 2:582.3-585.1
  tags:
