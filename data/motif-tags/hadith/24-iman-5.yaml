  tags:
  - motif: who-can-should-die-in-medina
    refs:
    - Jāmiʿ 2:648.1
    - Jāmiʿ 2:648.2
    - Jāmiʿ 2:649.1
    note: من استطاع أن يموت بالمدينة فلْيمتْ بها، فإنّي أشفع لمن يموت بها; إلّا كنتُ له شفيعًا أو شهيدًا يوم القيامة
  - motif: intercessor-or-witness-for-who-endures-medinas-hardship
    refs:
    - Jāmiʿ 2:649.2
    - Jāmiʿ 2:649.3
    - Jāmiʿ 2:650.1
    - Jāmiʿ 2:650.2
    note: لا يصبرْ على لأوائها وشدّتها أحدٌ إلا كنتُ له شفيعًا، أو شهيدًا يوم القيامة
  - motif: medina-better-for-them-if-they-knew
    refs:
    - Jāmiʿ 2:650.1
    note: المدينة خير لهم لو كانوا يعلمون، لا يدعُها أحدٌ رغبةً عنها إلّا أبدل اللَّه فيها من هو خير منه
- id: hadith-2-abu-talib
  tradition: islam
  corpus: hadith
  original: true
