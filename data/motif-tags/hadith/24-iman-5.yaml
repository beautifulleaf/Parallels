    note: مثقال دينار من إيمان ... مثقال قيراط من إيمان ... مثقال ذرّة من إيمان
  - motif: adam-intercedes-for-ten-million
    refs:
    - Jāmiʿ 2:619.1
    note: ثم يؤذن لآدم بالشّفاعة فيشفع لعشرة آلاف ألف
  - motif: one-mans-intercession-for-multitudes-like-rabia-mudar
    refs:
