    - Jāmiʿ 2:583.3
    note: يشخُب فيه ميزابان من الجنة; يغتُّ فيه ميزابان يُمدَّانِه من الجنّة، أحدهما من ذهب، والآخر من ورق
  - motif: strikes-with-staff-at-basin-for-people-of-yemen
