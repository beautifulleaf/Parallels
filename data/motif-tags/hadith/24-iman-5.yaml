- id: hadith-2-freedmen-of-the-compeller
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The banner of praise; the Compeller facing him in paradise; barley, half a barley-grain, mustard seed; the taunt of the fire's people; 'freedmen of the Compeller'
