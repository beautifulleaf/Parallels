  - motif: god-faces-him-inside-paradise
    refs:
    - Jāmiʿ 2:641.1
    note: فيفْتَحُون لي فأدخلُ فإذا الجبّار مستقبلي، فأسجدُ له
  - motif: faith-weighed-barley-then-mustard-then-least
    refs:
    - Jāmiʿ 2:641.1
    note: مثقال حبّة من شعير ... نصف حبة من شعير ... مثقالَ حبَّةٍ من خَرْدل
  - motif: fire-dwellers-taunt-worshippers-god-frees-them
    refs:
    - Jāmiʿ 2:641.1
    note: 'فيقول أهلُ النّار: ما أغني عنكم أنَّكم كنتم تعبدون اللَّه ﷿ لا تشركون به شيئًا! . فيقول الجبار: فبعِزَّتِي لأعتِقَنَّهم من النّار'
  - motif: sinners-made-charcoal-then-sprout-by-river
    refs:
    - Jāmiʿ 2:641.1
    note: وقد امْتَحَشُوا فيدخلون في نَهْر الحياة، فَينْبُتُونَ فيه كما تَنْبُتُ الحبَّةُ في غُثاءِ السَّيْل
  - motif: freedmen-of-the-compeller-not-jahannamis
    refs:
    - Jāmiʿ 2:641.1
    note: 'ويُكْتَبُ بين أعينهم: هؤلاء عتقاءُ اللَّه ... فيقول الجبار: بل هؤلاء عتقاءُ الجبار'
