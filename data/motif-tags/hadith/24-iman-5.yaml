    note: أُعطيتُ خمسًا لم يُعطهنّ أحدٌ من الأنبياء قبلي ... وأعطيتُ الشّفاعة
  - motif: each-prophet-asked-his-request-mine-delayed
    refs:
    - Jāmiʿ 2:621.3
    - Jāmiʿ 2:622.1
    note: سلْ تُعطه، فاختبأتُها شفاعةً لأمّتي; فأخَّرْتُ مسألتي إلى يوم القيامة
- id: hadith-2-intercession-abu-bakr
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: All of this world and the next shown him; prostration the length of a week; the truthful, the prophets with few or none, the martyrs; the lenient trader and the man who had himself burned
  read:
