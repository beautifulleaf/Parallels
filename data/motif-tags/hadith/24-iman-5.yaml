    refs:
    - Jāmiʿ 2:622.2
    note: ضَحِك رسولُ اللَّه ﷺ، ثم جلس مكانه حتى صلّى الأُولى والعصر والمغرب كلُّ ذلك لا يتكلّم ... عُرِض عليَّ ما هو كائنٌ من أمر الدّنيا وأمر الآخرة
  - motif: intercession-chain-adam-to-muhammad
    refs:
    - Jāmiʿ 2:622.2
    note: انطلقوا إلى أبيكم بعد أبيكم إلى نوح ... فإنه يبرئ الأكمه والأبرص ويُحيي الموتى ... انطلقوا إلى سيّد ولد آدم
  - motif: sweat-nearly-bridles-them
    refs:
