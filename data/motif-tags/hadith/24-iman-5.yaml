    - Jāmiʿ 2:576.1
    note: 'حتى إذا عرفتهم اختلجوا دُوني فأقول: أصحابي؟ فيقول: لا تدري ما أحدثوا بعدك; إنّهم ارتدّوا على أدبارهم القَهْقرى'
  - motif: basin-as-wide-as-ayla-to-sana
    refs:
    - Jāmiʿ 2:575.2
    - Jāmiʿ 2:575.3
    note: إنّ قدر حوضي كما بين أيلة وصنعاءَ من اليمن; ما بين ناحيتي حوضي كما بين صنعاء والمدينة
  - motif: basin-vessels-numbered-as-the-stars
    refs:
    - Jāmiʿ 2:575.2
    - Jāmiʿ 2:575.4
    note: وإنّ فيه من الأباريق كعدد نجوم السّماء; تُرى فيه أباريق الذّهب والفضّة كعدد نجوم السّماء
  - motif: driven-from-basin-as-strange-camels-from-a-trough
    refs:
    - Jāmiʿ 2:575.5
    note: لأذودنَّ رجالًا عن حوضي كما تُذاد الغريبة من الإبل عن الحوض
  - motif: dream-herdsman-leads-group-to-the-fire
    refs:
    - Jāmiʿ 2:576.2
    note: 'بينا أنا نائم إذا زُمرة ... فقال: هلّمَ، فقلتُ: أينْ؟ قال: إلى النّار واللَّهِ ... فلا أُراهُ يخلُصُ منهم إلّا مثل همَل النَّعَم'
- id: hadith-2-brothers-and-the-blazes
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: At the graveyard he longs for his brothers yet to come; known at the basin by blazes of ablution, as one knows his blazed horses
  read:
