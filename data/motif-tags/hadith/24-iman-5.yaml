    note: فيخرُّ ساجدًا قدْرَ جُمعةٍ ... خرَّ ساجدًا قدر جُمعة أخْرى ... فيأخذُ جبريلُ ﵇ بضَبْعَيْه
  - motif: first-whose-grave-splits-first-intercessor
    refs:
    - Jāmiʿ 2:622.2
    note: أيْ ربِّ خلقتني سيِّدَ ولد آدم ولا فخر، وأوّل من تنشق عنه الأرض يوم القيامة ولا فخر
  - motif: truthful-then-prophets-then-martyrs-intercede
    refs:
    - Jāmiʿ 2:622.2
    note: 'ادعوا الصّدِّيقين فيشفعون ... فيجيء النبي ومعه العصابة، والنّبي ومعه الخمسة والسّتة، والنبيُّ وليس معه أحد. ثم يقال: أدعوا الشّهداء'
  - motif: forgiven-for-leniency-in-buying-and-selling
    refs:
    - Jāmiʿ 2:622.2
    note: 'لا غير أنّي كنتُ أسامحُ النّاسَ في البيع والشِّراء. فيقول اللَّه ﷿: اسمحوا لعبدي كإسماحه إلى عبيدي'
  - motif: sinner-orders-body-burnt-ashes-scattered
    refs:
    - Jāmiʿ 2:622.2
    note: أمرتُ ولدي إذا مِتُّ فأحرقوني بالنار ثم اطحنوني، حتّى إذا كنت مثل الكُحل فاذهبوا بي إلى البحر فاذْرُوني في الرِّيح
  - motif: burned-mans-reward-world-and-ten-times
    refs:
    - Jāmiʿ 2:622.2
    note: 'انظر إلى مُلكِ أعظمِ مَلِكٍ فإنّ لك مثلَه وعشرةَ أمثالِه. قال: فيقول: لِم تسخرُ بي وأنت الملك؟ ! قال: وذاك الذي ضحكتُ منه من الضُّحى'
- id: hadith-2-my-community-my-community
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: He recites Abraham's prayer, weeps for his community; Gabriel is sent to ask; 'we will please you in your community'
  read:
