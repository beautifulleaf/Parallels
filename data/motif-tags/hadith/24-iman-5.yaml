    refs:
    - Jāmiʿ 2:586.1
    note: أَيْ رَبِّ خلقتني سيّدَ ولد آدم ولا فخر، وأوّل من تنشق عنه الأرض يوم القيامة ولا فخر
  - motif: seek-me-at-bridge-scale-or-basin
    refs:
    - Jāmiʿ 2:586.2
    note: اطلبني أوّل ما تطلبني على الصّراط ... فاطلبني عند الميزان ... فاطلبني عند الحوض، فإنّي لا أخطئ هذه الثلاث المواطن
  - motif: each-thousand-with-seventy-thousand-and-three-handfuls
    refs:
    - Jāmiʿ 2:586.3
    note: فإنّ ربِّي قد وَعَدني سبعين ألفًا، مع كلِّ ألفٍ سبعون ألفًا، وزادني ثلاثَ حَثَياتٍ
  - motif: seventy-thousand-like-a-yellow-fly-among-flies
    refs:
    - Jāmiʿ 2:586.3
    note: واللَّه ما أولئك في أمَّتك إِلَّا كالذُّباب الأَصْهب في الذِّبَّان
  - motif: two-spouts-of-gold-and-silver-from-paradise-into-basin
    refs:
    - Jāmiʿ 2:586.3
    note: فيه مَثْعَبان من ذهب وفضة
  - motif: drinker-at-basin-never-darkens-in-face
    refs:
    - Jāmiʿ 2:586.3
    note: مَن شرب منه لم يظْمأ بعدها، ولم يَسْودَّ وجهُه أبدًا
  - motif: god-extends-basin-with-a-stream-of-unknown-ends
    refs:
    - Jāmiʿ 2:587.1
    note: هو كما بين صنعاء إلى بُصْرى، ثم يمدّني اللَّه فيه بكُراعٍ لا يدري بشر ممن خُلق أي طرفيه
  - motif: poor-emigrants-crowd-the-basin
    refs:
    - Jāmiʿ 2:587.1
    note: فيزدحم عليه فقراء المهاجرين الذين يُقْتتلون في سبيل اللَّه ويموتون في سبيل اللَّه
  - motif: hiss-on-burning-fingers-son-of-adam-says-hiss
    refs:
    - Jāmiʿ 2:588.1
    note: 'فاحترقتْ أصابعه، فقال: "حَسِّ". ثم قال: "ابنُ آدم إن أصابه البرد قال: حسّ، وإن أصابه الحرُّ قال: حسّ"'
  - motif: dearest-that-your-people-drink-from-it
    refs:
    - Jāmiʿ 2:588.1
    note: أَجَلْ، وأَحبُّ النّاس إليَّ أن يروي منه قومُكِ
- id: hadith-2-basin-kinship-and-the-moths
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Abū l-Dardāʾ 'you are not of them'; holding them from the fire like moths; 'the lineage I know, but you innovated'
  read:
  - Jāmiʿ 2:589.1-590.1
  tags:
  - motif: prophet-forerunner-at-the-basin
    refs:
    - Jāmiʿ 2:589.1
    - Jāmiʿ 2:589.2
    - Jāmiʿ 2:590.1
    note: أنا فرطكم على الحوض; وأفرط لكم على الحوض; وإنّي أيّها النّاس فرط لكم على الحوض
  - motif: companions-turned-back-on-their-heels-at-basin
    refs:
    - Jāmiʿ 2:589.1
    note: 'فيقال: إنّك لا تدري ما أحدثوا بعدك. قال أبو الدّرداء: يا رسول اللَّه، ادع اللَّه أن لا يجعلني منهم قال: "لستَ منهم"'
  - motif: prophet-holds-your-waist-wraps-from-the-fire-moths
    refs:
    - Jāmiʿ 2:589.2
    note: أنا ممسك بحجزكم عن النّار، وتغلبون تقاحمون فيها تفاحم الفراش والجنادب
  - motif: my-kinship-benefits-in-both-worlds-but-you-changed
    refs:
    - Jāmiʿ 2:590.1
    note: بلى واللَّهِ إِنَّ رحمي موصولةٌ في الدّنيا والآخرة ... أما النَّسبُ فقد عرفتُه، ولكنكم أحدثتم بعدي وارتدتُم القهقرى
  - motif: arrive-together-and-in-scattered-groups
    refs:
    - Jāmiʿ 2:589.2
    note: وتردون علي معًا وأشتاتًا
- id: hadith-2-ibn-ziyad-and-the-basin
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'ʿUbayd Allāh b. Ziyād''s doubt: Abū Barza mocked, the sheet of ʿAbd Allāh b. ʿAmr fetched at a gallop, Anas''s old women, Zayd b. Arqam called senile'
  read:
  - Jāmiʿ 2:590.2-595.1
  tags:
  - motif: two-spouts-of-gold-and-silver-from-paradise-into-basin
    refs:
    - Jāmiʿ 2:590.2
    note: فيه ميزابان يَنْثَعِبان من الجنة، من وَرِق، والآخر من ذهب
  - motif: basin-as-wide-as-ayla-to-sana
    refs:
    - Jāmiʿ 2:590.2
    - Jāmiʿ 2:591.1
    note: إنّ لي حوضًا ما بين أيلة إلى صنعاء، عرضُه كطوله; كما بين أيلة إلى مكة -أو قال صنعاء إلى المدينة-
  - motif: governor-doubts-basin-and-sends-for-companions
    refs:
    - Jāmiʿ 2:591.1
    - Jāmiʿ 2:594.1
    - Jāmiʿ 2:594.2
    note: شكّ عبيد اللَّه بن زياد في الحوض ... أرأيتم الحوض الذي يُذكر ما أُراه شيئًا!; فأنكر ذلك
  - motif: companionship-held-a-disgrace-dahdah
    refs:
    - Jāmiʿ 2:591.1
    - Jāmiʿ 2:593.1
    - Jāmiʿ 2:593.2
    note: إن مُحمّديَّكم هذا الدحداح ... ألا أَراني في قومي يعدُّون صحابة محمّد ﷺ عارًا
  - motif: who-denies-basin-god-not-give-him-drink
    refs:
    - Jāmiʿ 2:591.1
    - Jāmiʿ 2:593.1
    - Jāmiʿ 2:593.2
    note: فمن كذَّب به فلا سقاه اللَّه منه
  - motif: dictated-sheet-from-companion-ridden-for
    refs:
    - Jāmiʿ 2:591.1
    note: 'فإنّي أقسمتُ عليك لما أَعْرقَتَ هذا البِرْذون حتى تأتيني بالكتاب. قال: فركبت البرذون فركضته حتى عَرِقَ'
  - motif: believer-like-gold-blown-on-and-bee
    refs:
    - Jāmiʿ 2:591.1
    note: إنَّ مثل المؤمن كمثل القطعة من الذهب نفخ عليها صاحبها فلم تتغير ولم تنقص ... كمثل النّحلة أكلت طيبًا ووضعت طيبًا ووقعت فلم تكسر ولم تفسد
  - motif: signs-of-hour-obscenity-bad-neighbourliness-trust-reversed
    refs:
    - Jāmiʿ 2:591.1
    note: لا تقوم السّاعة حتى يظهر الفحش والتّفحش، وسوء الجوار، وقطيعة الأرحام، وحتى يخون الأمين، ويؤتمن الخائن
  - motif: old-women-pray-after-every-prayer-for-the-basin
    refs:
    - Jāmiʿ 2:594.1
    note: ولقد أدركت عجائز بالمدينة لا يصلين صلاة إلا سألن اللَّه تعالى أن يوردهن حوض محمد ﷺ
  - motif: companion-called-senile-cites-lying-hadith
    refs:
    - Jāmiʿ 2:594.2
    note: 'قال: كذبتَ، ولكنّك شيخٌ قد خَرِفْتَ! . قال: إنّي قد سَمِعَتْه أذناي، ورعاه قلبي ... "من كذب عليَّ متعمِّدًا، فليتبوأ مقعده من جهنّم"'
  - motif: you-are-not-a-hundred-thousandth-part
    refs:
    - Jāmiʿ 2:595.1
    note: 'ما أنتم جزء من مائة ألف جزء ممن يرد عليَّ الحوض ... قال: سبعمائة أو ثمانمائة'
- id: hadith-2-rulers-who-lie
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Those who confirm lying rulers will not come to the basin; the counsels to Kaʿb b. ʿUjra
  read:
  - Jāmiʿ 2:600.1-601.1
  tags:
  - motif: who-abets-lying-rulers-not-at-basin
    refs:
    - Jāmiʿ 2:600.1
    - Jāmiʿ 2:600.2
    - Jāmiʿ 2:601.1
    note: فمن دخل عليهم فصدّقهم بكذبهم، وأعانهم على ظلمهم فليس مني ولستُ منه، وليس بوارد عليّ الحوض
  - motif: nine-men-five-and-four-arabs-and-non-arabs
    refs:
    - Jāmiʿ 2:600.1
    note: ونحن تسعة، خمسة، وأربعة، أحد العددين من العرب، والآخر من العجم
  - motif: ka-ab-told-fasting-a-shield-flesh-of-unlawful-gain
    refs:
    - Jāmiʿ 2:600.2
    note: الصَّوْمُ جُنَّةٌ، والصَّدقة تُطفئُ الخطيئة، والصّلاةُ قُربان ... إنّه لا يدخُلُ الجنَّةَ لَحْمٌ نبت من سُحتٍ ... فمُبتاع نفسّه فمُعْتِقُها، وبائعٌ نفسه فمُوبقها
- id: hadith-2-ansar-meet-at-basin
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'The Anṣār will meet selfishness after him: be patient until you meet me at the basin'
  read:
  - Jāmiʿ 2:603.1-603.4
  tags:
  - motif: meet-me-at-the-basin
    refs:
    - Jāmiʿ 2:603.1
    - Jāmiʿ 2:603.2
    - Jāmiʿ 2:603.3
    - Jāmiʿ 2:603.4
    note: إنّكم ستلقون بعدي أَثَرة، فاصبروا حتى تلقوني على الحوض; يا معشر الأنصار موعدكم حوضي
  - motif: basin-as-wide-as-ayla-to-sana
    refs:
    - Jāmiʿ 2:603.4
    note: وإن عرضه كما بيني وبين صنعاء أو كما بيني وبين عمان
- id: hadith-2-pulpit-on-the-basin
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Between his house and pulpit a garden of paradise; the pulpit stands on his basin
  read:
  - Jāmiʿ 2:604.1
  tags:
  - motif: between-house-and-pulpit-a-garden-pulpit-on-basin
    refs:
    - Jāmiʿ 2:604.1
    note: ما بين بيتي ومنبري روضة من رياض الجنة، ومنبري على حوضي
- id: hadith-2-every-people-a-forerunner
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Every people has its forerunner; he is theirs at the basin
  read:
  - Jāmiʿ 2:605.1
  tags:
  - motif: every-people-has-a-forerunner
    refs:
    - Jāmiʿ 2:605.1
    note: إنّ لكلّ قوم فَرَطًا، وإنّي فرطُكم على الحوض، فمن ورد عليَّ الحوض فشرب لم يظمأ، ومن لم يظما دخل الجنّة
- id: hadith-2-first-intercessor
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: First intercessor in paradise, most followed of the prophets, first whose grave splits, imam and spokesman of the prophets
  read:
  - Jāmiʿ 2:609.1-609.3
  tags:
  - motif: most-followed-of-prophets-one-believed-by-one-man
    refs:
    - Jāmiʿ 2:609.1
    note: وإنّ من الأنبياء نبيًّا ما يصدِّقه من أمّته إلّا رجل واحد
  - motif: first-to-knock-at-paradise-gate
    refs:
    - Jāmiʿ 2:609.1
    note: وأنا أوّل من يقْرع باب الجنّة
  - motif: first-whose-grave-splits-first-intercessor
    refs:
    - Jāmiʿ 2:609.2
    note: أنا سيّد ولد آدم يوم القيامة، وأوّل من ينشق عنه القبر، وأوّل شافع وأوّل مشفَّع
  - motif: imam-and-spokesman-of-the-prophets
    refs:
    - Jāmiʿ 2:609.3
    note: كنت إمام النّبيين وخطيبَهم، وصاحب شفاعتهم غير فخر
- id: hadith-2-each-prophet-one-prayer
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Every prophet had one answered prayer and hastened it; his is hidden as intercession for his community; told to Kaʿb al-Aḥbār
  read:
  - Jāmiʿ 2:612.1-613.3
  tags:
  - motif: each-prophet-had-one-granted-request-his-kept-for-intercession
    refs:
    - Jāmiʿ 2:612.1
    - Jāmiʿ 2:612.2
    - Jāmiʿ 2:612.3
    - Jāmiʿ 2:613.1
    - Jāmiʿ 2:613.2
    - Jāmiʿ 2:613.3
    note: لكلّ نبي دعوة مستجابة، فتعجّل كل نبي دعوته، وإنّي اختبأتُ دعوتي شفاعة لأمّتي يوم القيامة
  - motif: intercession-reaches-who-died-associating-nothing
    refs:
    - Jāmiʿ 2:612.2
    note: فهي نائلة إن شاء اللَّه من مات من أمّتي لا يشرك باللَّه شيئًا
  - motif: abu-hurayra-and-kaab-trade-prophet-and-books
    refs:
    - Jāmiʿ 2:612.3
    - Jāmiʿ 2:613.1
    note: أنّه قال لكعب الأحبار; فجعل أبو هريرة يحدِّث كعبًا عن النّبيّ ﷺ، وكعب يحدِّث أبا هريرة عن الكتب
- id: hadith-2-seven-letters
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Two men recite differently; Ubayy's doubt struck from his chest; the Quran on seven letters, a request for each return, the third kept for the day all seek him
  read:
  - Jāmiʿ 2:613.4
  tags:
  - motif: struck-on-chest-sweats-as-if-seeing-god-in-fear
    refs:
    - Jāmiʿ 2:613.4
    note: ضرب في صدري ففِضْتُ عَرَقًا، وكأنّما أنظرُ إلى اللَّه ﷿ فَرَقًا
  - motif: quran-on-seven-letters-after-three-requests
    refs:
    - Jāmiʿ 2:613.4
    note: أن اقْرإ القرآن على حرف ... اقْرَأْهُ على حرفين ... اقرَأْهُ على سبعة أحرف، فلك بكُلِّ رَدَّةٍ رَدَدْتُكَهَا مسألةٌ تَسْأَلُنِيهَا ... وأَخَّرْتُ الثّالثة ليوم يرغبُ إليَّ الخلقُ كلُّهم حتى إبراهيمُ ﷺ
- id: hadith-2-better-than-solomons-kingdom
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Asked why he did not ask a kingdom like Solomon''s: some prophets spent their request on this world, some against their people; his is kept for intercession'
  read:
  - Jāmiʿ 2:614.1
  quran:
  - '38:35'
  tags:
  - motif: prophets-request-spent-on-world-or-against-people
    refs:
    - Jāmiʿ 2:614.1
    note: ألا سألت ربّك مُلكًا كملك سليمان؟ ... فمنهم من اتخذها دنيا فأعطيها، ومنهم من دعا بها على قومه إذ عصوه فأهلكوا بها
  - motif: hated-entering-then-loved
    refs:
    - Jāmiʿ 2:614.1
    note: وما في النّاس أبغض إلينا من رجل يلج عليه، فما خرجنا حتى ما في الناس أحد أحبّ إلينا من رجل يدخل عليه
- id: hadith-2-intercession-chain-abu-hurayra
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The foreleg; first and last on one plain; Adam, Noah, Abraham, Moses, Jesus each say 'myself, myself'; Muhammad under the Throne; the right-hand gate; the gate's leaves as Mecca to Hajar
  read:
  - Jāmiʿ 2:615.1
  quran:
  - 38:75
  - '17:3'
  - 4:171
  - '48:2'
  tags:
  - motif: shoulder-of-meat-bites-then-tells-of-the-day
    refs:
    - Jāmiʿ 2:615.1
    note: أُتِي رسولُ اللَّه ﷺ يومًا بلَحْمٍ، فَرُفِع إليه الذِّراعُ وكانت تعجبُه فَنَهَسَ منها نَهْسَةً
  - motif: gathered-on-one-plain-caller-heard-sight-penetrates
    refs:
    - Jāmiʿ 2:615.1
    note: يجمع اللَّه يوم القيامة الأوّلين والآخرين في صعيد واحد فيسمعهم الدّاعي ويَنْفُذُهم البَصَرُ، وتدنو الشّمسُ
  - motif: intercession-chain-adam-to-muhammad
    refs:
    - Jāmiʿ 2:615.1
    note: ائْتُوا آدم ... اذهبوا إلى نوح ... اذهبوا إلى إبراهيم ﷺ ... اذهبوا إلى موسى ... اذهبوا إلى عيسى ﷺ ... اذهبوا إلى محمد ﷺ
  - motif: prophets-decline-intercession-citing-a-fault
    refs:
    - Jāmiʿ 2:615.1
    note: وإنّه نهاني عن الشّجرة، فعصيته، نفسي نفسي; كانت لي دعوةٌ دعوتُ بها على قومي; وذكر كذباته; وإني قتلت نفسا لم أُومَر بقتلها; ولم يذكر له ذنبًا
  - motif: god-angry-today-as-never-before-or-after
    refs:
    - Jāmiʿ 2:615.1
    note: إنِّ ربّي غضب اليوم غضبًا لم يغضب قبله مثله ولن يغضب بعده مثله
  - motif: praises-taught-him-under-the-throne
    refs:
    - Jāmiʿ 2:615.1
    note: فأنطلقُ فآتي تحت العرش فأقع ساجدًا لربّي ثم يفتح اللَّه عليَّ ويُلهِمُني من محامده وحسن الثّناء عليه شيئًا لم يفْتَحْه لأحد قبلي
  - motif: raise-your-head-ask-and-be-given
    refs:
    - Jāmiʿ 2:615.1
    note: يا محمد ارفعْ رأسك سَلْ تُعْطَهْ اشْفَعْ تُشَفَّعْ
  - motif: right-gate-for-those-without-reckoning
    refs:
    - Jāmiʿ 2:615.1
    note: أدخل الجنّة من أمّتك من لا حساب عليه من الباب الأيمن من أبواب الجنّة
  - motif: paradise-door-leaves-apart-as-mecca-to-hajar
    refs:
    - Jāmiʿ 2:615.1
    note: إنّ ما بين المصراعين من مصاريع الجنّة لكما بين مكة وهجر أو كما بين مكة وبصرى
  hints:
  - Noah 'first of the messengers to the earth' named 'a grateful servant' (Jāmiʿ 2:615.1), against Gen 6:9, Noah 'a righteous man, blameless in his generation'
- id: hadith-2-intercession-chain-anas-mabad
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Maʿbad b. Hilāl''s visit to Anas: ''I am not for it'' passed on; ''I am for it''; out of the fire by barley, mustard seed, less; the fourth return kept by God; al-Ḥasan supplies the end'
  read:
  - Jāmiʿ 2:616.1
  tags:
  - motif: intercession-chain-adam-to-muhammad
    refs:
    - Jāmiʿ 2:616.1
    note: 'فيأتون آدمَ فيقولون له: اشْفَعْ لذُرِيِّتِك، فيقول: لستُ لها ... فأُوتَى، فأقول: أنا لها'
  - motif: raise-your-head-ask-and-be-given
    refs:
    - Jāmiʿ 2:616.1
    note: يا محمّد ارْفَعْ رأسك، وقُلْ يُسْمَعُ لك، وَسَلْ تُعْطَهْ، واشْفَعْ تُشَفَّعْ
  - motif: faith-weighed-barley-then-mustard-then-least
    refs:
    - Jāmiʿ 2:616.1
    note: مثقال حبّة من بُرّة أو شعيرة من إيمان ... مثقال حبّة من خردل من إيمان ... أدنى أدنى أدنى من مثقال حبة من خردل من إيمان
  - motif: fourth-return-god-keeps-those-who-said-no-god-but-god
    refs:
    - Jāmiʿ 2:616.1
    note: 'ثم أرجع إلى ربي في الرابعة ... فأقول: يا ربّ ائذن لي فيمن قال لا إله إلّا اللَّه. قال: ليس ذاك لك ... ولكن وعزّتي وكبريائي وعظمتي وجبريائي لأُخرِجَنَّ من قال: لا إله إلّا اللَّه'
  - motif: anas-held-back-the-end-lest-they-rely-on-it
    refs:
    - Jāmiʿ 2:616.1
    note: قد حدّثنا به منذ عشرين سنة وهو يومئذ جَميعٌ ولقد ترك شيئًا ما أدري أنسي الشّيخ أو كره أن يحدّثكم فتتكلوا
- id: hadith-2-intercession-chain-anas-qatada
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'The believers gathered seek relief: Adam ashamed of his sin, Noah of asking what he had no knowledge of, Moses of killing; limits set for each intercession; only those the Quran holds remain'
  read:
  - Jāmiʿ 2:617.1
  quran:
  - '21:37'
  tags:
  - motif: intercession-chain-adam-to-muhammad
    refs:
    - Jāmiʿ 2:617.1
    note: 'فيأتون آدم، فيقولون: أنت أبو الناس خلقك اللَّهُ بيده، وأسجد لك ملائكته، وعلَّمك أسماءَ كلِّ شيءٍ ... فيقول: لستُ هُناكُم'
  - motif: prophets-decline-intercession-citing-a-fault
    refs:
    - Jāmiʿ 2:617.1
    note: ويذكر ذنبه فيستحيي; ويذكر سؤاله ربه ما ليس له به علم فيستحيي; ويذكر قتل النفس بغير نفس فيستحيي من ربه
  - motif: intercedes-within-a-set-limit
    refs:
    - Jāmiʿ 2:617.1
    note: ثم أشفع فَيُحُدُّ لي حدًّا فأدخلهم الجنّة
  - motif: none-left-in-fire-but-those-the-quran-holds
    refs:
    - Jāmiʿ 2:617.1
    note: ما بقي في النّار إلا من حبسه القرآن ووجب عليه الخلود
