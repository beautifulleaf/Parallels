  tags:
  - motif: greets-graveyard-as-abode-of-believers
    refs:
    - Jāmiʿ 2:577.1
    note: السّلامُ عليكم دار قوم مؤمنين، وإنّا إن شاء اللَّه بكم لاحقون
  - motif: brothers-are-those-not-yet-come
    refs:
    - Jāmiʿ 2:577.1
    note: وددتُ أنّا قد رأينا إخواننا ... "أنتم أصحابي، وإخواننا الذين لم يأتوا بعد"
  - motif: own-horses-known-by-blazes-among-black-ones
    refs:
    - Jāmiʿ 2:577.1
    note: أرأيت لو أنّ رجلا له خيل غرّ محجّلة بين ظهري خيل دُهْم بُهْم ألا يعرفُ خيلَه
  - motif: community-known-by-white-blazes-of-ablution
    refs:
    - Jāmiʿ 2:577.1
    - Jāmiʿ 2:577.2
    note: فإنّهم يأتون غرًّا محجّلين من الوُضوء; لكم سيما ليست لأحد من الأمم، تردون عليَّ غرًّا محجلين من أثر الوضوء
  - motif: driven-from-basin-as-strange-camels-from-a-trough
    refs:
    - Jāmiʿ 2:577.1
    - Jāmiʿ 2:577.2
    note: ألا لَيُذادنَّ رجالٌ عن حوضي كما يُذاد البعير الضّال; وإني لأصد النّاس عنه كما يصدّ الرّجل إبل النّاس عن حوضه
  - motif: companions-turned-back-on-their-heels-at-basin
    refs:
    - Jāmiʿ 2:577.1
    - Jāmiʿ 2:577.2
    note: 'إنّهم قد بدّلوا بعدك فأقول سُحْقًا سُحْقًا; فيجيبني ملكٌ فيقول: وهل تدري ما أحدثوا بعدك؟'
  - motif: basin-as-wide-as-ayla-to-sana
    refs:
    - Jāmiʿ 2:577.2
    note: إنّ حوضي أبعد من أيلة من عدن
