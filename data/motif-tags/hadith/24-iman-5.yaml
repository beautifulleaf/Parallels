    refs:
    - Jāmiʿ 2:655.1
    note: إنّ اللّعانين لا يكونون شهداء ولا شفعاء يوم القيامة
- id: hadith-2-help-me-by-prostration
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Rabīʿa, his servant, asked his wish, asks his company in paradise: ''help me against yourself by much prostration'''
  read:
  - Jāmiʿ 2:655.2-656.1
  tags:
  - motif: servant-asks-his-company-in-paradise-help-by-prostration
    refs:
    - Jāmiʿ 2:655.2
    - Jāmiʿ 2:655.3
    - Jāmiʿ 2:656.1
    note: 'أسألُك مرافتَك في الجنّة ... "فأعنّي على نفسك بكثرة السّجود"; حاجتي أن تشفع لي يوم القيامة. قال: "ومن دلَّك على هذا؟ ". قال: ربِّي'
  - motif: world-passes-ask-for-the-hereafter
    refs:
    - Jāmiʿ 2:656.1
    note: إنّ أمر الدّنيا ينقطع، فلا أرى شيئًا خيرًا من شيء آخذُه لنفسي لآخرتي ... فلْيُعْتقني من النّار
- id: hadith-2-funeral-intercession
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: A hundred, or forty, praying over the dead are granted their intercession
  read:
  - Jāmiʿ 2:657.1-657.2
  tags:
  - motif: hundred-praying-over-dead-are-granted-intercession
    refs:
    - Jāmiʿ 2:657.1
    note: ما من ميّتٍ يصلّي عليه أمَّةٌ من المسلمين يبلغون مائةً كلّهم يشفعون له، إلّا شُفِّعوا فيه
  - motif: forty-at-a-funeral-intercession-granted
    refs:
    - Jāmiʿ 2:657.2
    note: 'يا كريب، انظر ما اجتمع له من النّاس ... تقول: هم أربعون؟ قال: نعم. قال: أخرجوه ... فيقوم على جنازته أربعون رجلًا، لا يشركون باللَّه شيئًا إلّا شفّعهم اللَّه فيه'
- id: hadith-2-believers-plead-for-brothers
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Believers plead for their brothers; out by dinar, half-dinar, atom; God's handful of those who never did good; seed in flood-silt; seals on their necks; God's pleasure
  read:
  - Jāmiʿ 2:658.1
  quran:
  - '4:40'
  tags:
  - motif: believers-plead-for-brothers-who-fasted-prayed-with-them
    refs:
    - Jāmiʿ 2:658.1
    note: 'ربَّنا كانوا يصومون معنا، ويصلُّون ويحجُّون؟ فيقال لهم: أخرجُوا من عرفتم، فتحرم صورهم على النّار'
  - motif: faith-weighed-dinar-then-qirat-then-atom
    refs:
    - Jāmiʿ 2:658.1
    note: مثقال دينار من خير ... مثقال نصف دينار من خير ... مثقال ذرة من خير
  - motif: god-takes-a-handful-of-who-never-did-good
    refs:
    - Jāmiʿ 2:658.1
    note: شفعت الملائكةُ، وشفع النّبيُّون، وشفع المؤمنون، ولم يبقَ إلا أرحمُ الرّاحمين فيقبض قبضةً من النّار فيخرج منها قوما لم يعملوا خيرًا قطّ، قد عادوا حُممًا
  - motif: seed-in-flood-silt-yellow-green-in-sun-white-in-shade
    refs:
    - Jāmiʿ 2:658.1
    note: ألا ترونها تكون إلى الحجر أو إلى الشّجر، ما يكون إلى الشّمس أُصيفر وأُخَيضر. وما يكون منها إلى الظّل يكون أبيض؟
  - motif: as-if-he-had-lived-in-the-desert
    refs:
    - Jāmiʿ 2:658.1
    note: 'فقالوا: يا رسول اللَّه، كأنّك كنتَ ترعى بالبادية!'
  - motif: freed-ones-with-seals-on-necks
    refs:
    - Jāmiʿ 2:658.1
    note: فيخرجون كاللؤلؤ في رقابهم الخواتم يعرفهم أهلُ الجنَّة. هؤلاء عتقاء اللَّه
  - motif: gods-pleasure-greater-than-paradise
    refs:
    - Jāmiʿ 2:658.1
    note: لكم عندي أفضلُ من هذا ... رِضاي فلا أسخط عليكم بعده أبدًا
- id: hadith-2-believers-intercede
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Believers, martyrs and angels intercede: for crowds, tribes, one man; more than Banū Tamīm by one man; the bridge''s moths; Ṭūbā and the grape cluster'
  read:
  - Jāmiʿ 2:659.1-662.1
  tags:
  - motif: each-prophet-had-one-granted-request-his-kept-for-intercession
    refs:
    - Jāmiʿ 2:659.1
    note: قد أُعطي كلُّ نبيٍّ عطيّة، فكلّ قد تعجّلها، وإنّي أخّرتُ عطيتي شفاعةً لأمّتي
  - motif: man-intercedes-for-a-crowd-a-tribe-or-one-man
    refs:
    - Jāmiʿ 2:659.1
    - Jāmiʿ 2:659.3
    note: وإنّ الرّجل من أمّتي ليشفع للفئام من النّاس ... للقبيلة ... للعُصبة ... للثلاثة وللرّجلين وللرّجل
  - motif: truthful-then-prophets-then-martyrs-intercede
    refs:
    - Jāmiʿ 2:659.2
    note: 'ادعوا الصّدِّيقين فيشفعون، ثم يقال: ادْعُوا الأنبياء ... ثم يقال: ادعوا الشّهداء فيشفعون لمن أرادوا'
  - motif: more-than-banu-tamim-by-one-mans-intercession
    refs:
    - Jāmiʿ 2:660.1
    note: 'ليُدخلنّ الجنّة بشفاعة رجل من أمّتي أكثر من بني تميم". قالوا: يا رسول اللَّه، سواك؟ قال: "سوايَ"'
  - motif: people-dashed-on-bridge-like-moths-into-fire
    refs:
    - Jāmiʿ 2:660.2
    note: فتقادعُ بهم جنبتا الصّراط تقادعُ الفراش في النّار
  - motif: angels-prophets-martyrs-intercede-thrice
    refs:
    - Jāmiʿ 2:660.2
    note: ثم يؤذن للملائكة والنّبيين والشّهداء أن يشفعوا، فيشفعون ويخرجون، ويشفعون ويُخرجون، ويشفعون ويُخرجون
  - motif: adam-intercedes-for-ten-million
    refs:
    - Jāmiʿ 2:660.3
    note: ثم يؤذن لآدم بالشّفاعة فيشفع لعشرة آلاف ألف
  - motif: jahannamiyyun-stinking-brought-out
    refs:
    - Jāmiʿ 2:661.1
    note: يُخرجُ اللَّهُ قومًا مُنْتنين قد محشتْهم النَّارُ بشفاعة الشّافعين، فيدخلهم الجنّة، فيُسَمَّون الجهنميُّون
  - motif: one-mans-intercession-for-multitudes-like-rabia-mudar
    refs:
    - Jāmiʿ 2:661.2
    note: يخرجُ من النّار بشفاعة رجل من أمّتي أكثر من ربيعة ومضر
  - motif: each-thousand-intercedes-for-seventy-thousand-three-handfuls
    refs:
    - Jāmiʿ 2:662.1
    note: سبعين ألفًا بغير حساب، ثم يشفع كلُّ ألف لسبعين ألفًا، ثم يَحثي ربي ﵎ بكفيه ثلاث حَثَيَات
  - motif: god-extends-basin-with-a-stream-of-unknown-ends
    refs:
    - Jāmiʿ 2:662.1
    note: كما بين البيضاء إلى بصري يمدُّني اللَّه فيه بكُراعٍ لا يدري إنسانٌ مِمَّن خُلق أين طرفاه
  - motif: tuba-tree-like-syrian-walnut
    refs:
    - Jāmiʿ 2:662.1
    note: وفيها شجرة تدعى طوبى ... فإنَّها تشبه شجرة في الشّام تُدعى الجوْزَةَ تنبت على ساق واحد، ثم ينتشر أعلاها ... لو ارتحلتَ جذعةً من إبل أهلك لما قطعتها حتى تنكسر ترقوتُها هَرَمًا
  - motif: grape-cluster-a-months-crow-flight
    refs:
    - Jāmiʿ 2:662.1
    note: مسيرة شهر للغراب الأبقع لا ينثني ولا يفتر ... فإن تلك الحبة تشبعني وأهل بيتي
- id: hadith-2-abrahams-intercession
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Abraham: ''Lord, you have burned my sons'''
  read:
  - Jāmiʿ 2:664.1
  tags:
  - motif: abraham-says-you-burned-my-sons
    refs:
    - Jāmiʿ 2:664.1
    note: 'يقول إبراهيم يوم القيامة: يا ربَّاه، فيقول الرَّبُّ جَلَّ وعلا: يا لبَّيكاه فيقول إبراهيم: يا ربّ، حرَّقْتَ بنيَّ'
  hints:
  - Abraham pleading at the last for his burned descendants (Jāmiʿ 2:664.1), against Gen 18:23-32 where he pleads for Sodom; the compiler (p. 1/665) quotes ʿAbd Allāh b. Salām 'I find it in the book of God', which he takes for the Torah
- id: hadith-2-martyr-intercedes
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'The martyr''s six traits: the crown, seventy-two wives, intercession for seventy of his family'
  read:
  - Jāmiʿ 2:665.1-666.1
  tags:
  - motif: martyr-gifts-at-first-drop-of-blood
    refs:
    - Jāmiʿ 2:665.1
    note: يُغفر له في أول دَفْعةٍ، ويرى مقعده من الجنّة، ويجار من عذاب القبر، ويأمن من الفزع الأكبر
  - motif: martyr-six-traits-crown-seventy-two-wives-seventy-kin
    refs:
    - Jāmiʿ 2:665.1
    - Jāmiʿ 2:666.1
    note: 'ويوضع على رأسه تاج الوقار: الياقوتةُ منها خيرٌ من الدُّنيا وما فيها، ويزوّج اثنين وسبعين زوجة من الحور العين، ويُشفَّع في سبعين من أقاربه; يُشفَّع الشّهيد في سبعين من أهل بيته'
- id: hadith-2-quran-intercedes
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The Quran intercedes; al-Baqara and Āl ʿImrān like two clouds or two flocks pleading; the thirty-verse sura that interceded
  read:
  - Jāmiʿ 2:666.2-667.1
  quran:
  - 67:1-30
  tags:
  - motif: quran-comes-as-intercessor-for-its-people
    refs:
    - Jāmiʿ 2:666.2
    note: اقرأوا القرآن، فإنّه يأتي يوم القيامة شفيعًا لأصحابه ... اقرأوا سورة البقرة، فإنّ أخذها بركة، وتركها حسرة، ولا يستطيعها البطلة
  - motif: two-suras-as-clouds-or-bird-flocks-pleading
    refs:
    - Jāmiʿ 2:666.2
    note: اقرأوا الزّهراوين البقرة وسورة آل عمران، فإنّهما تأتيان يوم القيامة كأنهما غمامنان، أو كأنهما غياتيان، أو كأنهما فرقان من طير صوافّ تُحاجّان عن أصحابهما
  - motif: surah-of-thirty-verses-argues-for-its-reader
    refs:
    - Jāmiʿ 2:667.1
    note: إنّ سورة من القرآن ثلاثون آية شفعت لرجل حتى غفر له
- id: hadith-2-the-trumpet
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'The blasts: Moses holding the Throne; the first to hear it plastering his trough; dew-like rain grows bodies; the trumpeter''s horn at his lips; his eyes on the Throne like two stars'
  read:
  - Jāmiʿ 2:668.1-670.1
  quran:
  - 39:68
  - 6:73
  tags:
  - motif: do-not-prefer-among-prophets-moses-at-throne
    refs:
    - Jāmiʿ 2:668.1
    note: لا تفضّلوا بين أنبياء اللَّه ... فإذا موسى آخذ بالعرش، فلا أدري أحُوسب بصعقته يوم الطّور، أم بُعث قبلي
  - motif: worst-left-light-as-birds-minds-of-beasts-satan-bids-idols
    refs:
    - Jāmiʿ 2:669.1
    note: فيبقى شرار النّاس في خفّة الطّير وأحلام السِّباع ... فيتمثَّل لهم الشّيطان ... فيأمرهم بعبادة الأوثان، وهم في ذلك دارّةٌ أرزاقهم، وحسنٌ عيشُهم
  - motif: trumpet-heard-tilting-neck
    refs:
    - Jāmiʿ 2:669.1
    note: ثم ينفخ في الصُّور، فلا يسمعه أحدٌ إِلَّا أضغى لِيتًا، ورفع لِيتًا
  - motif: first-to-hear-trumpet-plastering-his-camels-trough
    refs:
    - Jāmiʿ 2:669.1
    note: وأوّلُ من يسمعه رجل يلوط حوض إبله
  - motif: rain-like-dew-and-bodies-grow
    refs:
    - Jāmiʿ 2:669.1
    note: 'ثم يرسل اللَّه -أو قال: ينزل اللَّه- مطرًا كأنّه الطّلُّ أو الظّلُّ -نعمان الشّاك- فتنبتُ منه أجسادُ النّاس'
  - motif: trumpeter-has-put-horn-to-mouth-brow-bent
    refs:
    - Jāmiʿ 2:669.2
    note: كيف أُنعم وصاحبُ الصّور قد الْتقم، وحنا جبهته ينتظر متى يُؤمر أن ينفخ
  - motif: say-god-suffices-at-the-trumpet
    refs:
    - Jāmiʿ 2:669.2
    note: 'قولوا: حسبنا اللَّه ونعم الوكيل على اللَّه توكّلنا'
  - motif: trumpeter-gaze-fixed-on-throne
    refs:
    - Jāmiʿ 2:670.1
    note: إن طَرْف صاحب الصّور مذ وكِّل به مستعد ينظر نحو العرش مخافة أن يؤمر قبل أن يرتدّ إليه طرْفه، كأنّ عينيه كوكبان درّيان
  hints:
  - Bodies growing from a dew-like rain before the second blast (Jāmiʿ 2:669.1), against Isa 26:19, 'your dew is a dew of lights, and the earth shall cast out the dead'; and the rabbinic 'dew of resurrection' (b. Ḥagigah 12b)
- id: hadith-2-trumpet-is-a-horn
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'A bedouin asks what the trumpet is: a horn that is blown'
  read:
  - Jāmiʿ 2:673.1
  quran:
  - 39:68
  tags:
  - motif: trumpet-is-a-horn
    refs:
    - Jāmiʿ 2:673.1
    note: 'جاء أعرابيٌّ إلى النبيّ ﷺ فقال: ما الصُّور؟ قال: "قرنٌ يُنفخُ فيه"'
  hints:
  - The ṣūr glossed as a horn (qarn) (Jāmiʿ 2:673.1), against the shofar of the ingathering, Isa 27:13 'a great shofar shall be blown'
- id: hadith-2-the-gathering
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Gathered barefoot, naked, uncircumcised; Abraham clothed first; 'as the righteous servant said'; too grave to look; three ways of the gathering; the King's settlement even of a slap
  read:
  - Jāmiʿ 2:673.2-675.1
  quran:
  - 21:104
  - 5:117-118
  tags:
  - motif: resurrected-barefoot-naked-uncircumcised
    refs:
    - Jāmiʿ 2:673.2
    - Jāmiʿ 2:674.1
    - Jāmiʿ 2:675.1
    note: إنّكم تحشرون حفاةً عراة غُرلًا; تُحشرون حُفاة عُراة غُرْلًا; عُراةً غرلًا بُهْمًا
  - motif: abraham-first-clothed-at-resurrection
    refs:
    - Jāmiʿ 2:673.2
    note: وأوَّل من يُكسى يوم القيامة إبراهيم
  - motif: prophet-answers-in-words-of-jesus-at-judgment
    refs:
    - Jāmiʿ 2:673.2
    note: وإنَّ ناسًا من أصحابي يؤخذ بهم ذات الشّمال ... فأقول كما قال العبد الصَّالح
  - motif: naked-at-resurrection-too-grave-to-look
    refs:
    - Jāmiʿ 2:674.1
    note: 'الرّجال والنّساء ينظر بعضهم إلى بعض؟ ! فقال: "الأمر أشدّ من أن يهمّهم ذاك"'
  - motif: gathered-two-three-four-ten-on-a-camel
    refs:
    - Jāmiʿ 2:674.2
    note: 'يُحشر النَّاسُ على ثلاث طرائق: راغبين راهين، واثنان على بعير، وثلاثة على بعير، وأربعة على بعير، وعشرة على بعير، ويَحْشرُ بقيتهم النّارُ، تقيل معهم حيث قالوا'
  - motif: gathered-buhm-with-nothing
    refs:
    - Jāmiʿ 2:675.1
    note: 'قال: قلنا: وما بُهْمًا؟ قال: "ليس معهم شيء"'
  - motif: no-one-enters-fire-while-owed-a-right-even-a-slap
    refs:
    - Jāmiʿ 2:675.1
    note: أنا الملك، أنا الدَّيَّان، ولا ينبغي لأحد من أهل النّار أن يدخل النّار، وله عند أحد من أهل الجنّة حقٌّ حتّى أُقِصَّهُ منه ... حتّى اللَّطْمةَ ... "بالحسنات والسَّيِّئات"
- id: hadith-2-unbeliever-on-his-face
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: How is the unbeliever gathered on his face? He who made him walk on two feet can make him walk on his face
  read:
  - Jāmiʿ 2:676.1
  quran:
  - 17:97
  - '25:34'
  tags:
  - motif: walks-on-his-face-who-walked-on-feet
    refs:
    - Jāmiʿ 2:676.1
    note: أليس الذي أمشاه على الرِّجْلين في الدّنيا قادرًا على أن يُمْشيه على وجهه يوم القيامة
- id: hadith-2-white-earth
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Gathered on a white earth like a loaf of pure flour, no landmark
  read:
  - Jāmiʿ 2:676.2
  tags:
  - motif: resurrection-earth-white-like-pure-loaf
    refs:
    - Jāmiʿ 2:676.2
    note: يُحشر النّاس يوم القيامة على أرض بيضاء عَفْراء كقُرصة نقي ... ليس فيها معلم لأحد
- id: hadith-2-adam-first-called
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Adam called first: bring out ninety-nine of every hundred; the community like a white hair on a black ox'
  read:
  - Jāmiʿ 2:677.1
  tags:
  - motif: adam-first-called-sees-his-offspring
    refs:
    - Jāmiʿ 2:677.1
    note: 'أوّل من يُدعى يوم القيامة آدم، فتراءى ذريتُه، فيقال: هذا أبوكم آدم، فيقول: لبيك وسعديك. فيقول: أخرج بعث جهنّم من ذريَّتك'
  - motif: ninety-nine-of-every-hundred-to-hell
    refs:
    - Jāmiʿ 2:677.1
    note: 'فيقول: يا ربّ، كم أُخرج؟ فيقول: أخرج من كلّ مائة تسعة وتسعين'
  - motif: believers-like-white-hair-on-black-ox
    refs:
    - Jāmiʿ 2:677.1
    note: إنّ أمّتي في الأمم كالشّعرة البيضاء في الثور الأسود
- id: hadith-2-reckoning
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Whoever is reckoned is punished; the easy reckoning is the presentation; whoever is scrutinized perishes
  read:
  - Jāmiʿ 2:677.2-677.3
  quran:
  - '84:8'
  tags:
  - motif: scrutinized-reckoning-means-perdition
    refs:
    - Jāmiʿ 2:677.2
    - Jāmiʿ 2:677.3
    note: من حُوسب عُذِّب ... إنّما ذلك العرْض، ولكنْ مَنْ نُوقش الحساب يهلك; مَنْ نُوقش الحساب بعمله هلك
  - motif: aisha-questions-what-she-does-not-know
    refs:
    - Jāmiʿ 2:677.2
    note: كانتْ لا تسمعُ شيئًا لا تعرفه راجعتْ فيه حتّى تعرفَه
- id: hadith-2-the-bridge-and-the-last-man
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Seen as the full moon; each follows what he worshipped; God in a form not known then known; the bridge over hell with sa'dan hooks; the trace of prostration; the last man to enter, God's laughter, his like or tenfold
  read:
  - Jāmiʿ 2:677.4
  tags:
  - motif: see-your-lord-like-full-moon
    refs:
    - Jāmiʿ 2:677.4
    note: هل تضارُّون في رؤية القمر ليلة البدر؟ ... فإنّكم ترونه كذلك
  - motif: each-follows-what-he-worshipped-sun-moon-tawaghit
    refs:
    - Jāmiʿ 2:677.4
    note: مَنْ كان يعبد شيئًا فَلْيَتَّبِعْهُ فَيَتَّبِعُ مَنْ كان يعبد الشّمسَ الشّمسَ، ويَتَّبعُ من كان يعبد القمرَ القمرَ، ويَتَّبِعُ من كان يعبد الطَّواغيتَ الطَّواغيتَ
  - motif: god-comes-in-a-form-not-known-then-known
    refs:
    - Jāmiʿ 2:677.4
    note: فيأتيهم اللَّهُ ﵎ في صورةٍ غير صورته التي يعرفونَ ... نعوذ باللَّه منك! ... فيأتيهم اللَّه تعالى في صورته التي يعرفون
  - motif: messengers-cry-grant-safety-on-bridge
    refs:
    - Jāmiʿ 2:677.4
    note: 'ولا يتكلَّمُ يومئذ إِلَّا الرُّسُل، ودَعْوَى الرُّسُل يومئذٍ: اللَّهُمَّ سَلِّمْ، سَلِّم'
  - motif: bridge-slippery-with-hooks-and-sadan-thorns
    refs:
    - Jāmiʿ 2:677.4
    note: وفي جهنّمَ كلاليبُ مثلُ شَوْك السَّعْدان ... تَخْطَفُ النّاس بأعمالهم
  - motif: fire-eats-all-but-trace-of-prostration
    refs:
    - Jāmiʿ 2:677.4
    note: يعرفونهم بأثر السُّجود تأكل النّارُ من ابن آدم إِلَّا أثر السُّجود، حرَّم اللَّهُ على النّار أن تأكل أثر السُّجود
  - motif: sinners-made-charcoal-then-sprout-by-river
    refs:
    - Jāmiʿ 2:677.4
    note: وقد امْتَحَشُوا، فَيُصَبُّ عليهم ماءُ الحياةِ فَيَنْبُتُون منه كما تَنْبُتُ الحبَّةُ في حَمِيل السَّيْل
  - motif: last-man-promises-to-ask-no-more
    refs:
    - Jāmiʿ 2:677.4
    note: أي ربِّ اصْرِفْ وجهي عن النّار، فإنه قد قَشَبَنِي ريحُها وأحرقني ذَكاؤُها ... ويَلْك يا ابن آدم ما أغْدَرَكَ
  - motif: god-laughs-at-the-last-man
    refs:
    - Jāmiʿ 2:677.4
    note: 'فلا يزال يدعو اللَّه حتّى يَضْحَكَ اللَّهُ ﵎ منه فإذا ضَحِكَ اللَّه منه. قال: أُدْخُل الجنّة'
  - motif: last-man-given-wish-and-its-like-or-tenfold
    refs:
    - Jāmiʿ 2:677.4
    note: 'قال اللَّه تعالى: ذلك لك ومثلُه معه'
  hints:
  - God appearing first 'in a form other than his own' and then 'in the form they know' (Jāmiʿ 2:677.4), against Exod 33:18-23, Moses shown God's back and not his face
