    read: ["Jāmiʿ 47:4926.1"]
    quran: ["2:30-38", "38:71-85"]
    tags:
      - {motif: progeny-drawn-from-adams-back, refs: ["Jāmiʿ 47:4926.1"], note: "لما خلق الله آدم مسح ظهره فسقط من ظهره كل نسمة هو خالقها من ذريته إلى يوم القيامة"}
      - {motif: gleam-of-light-between-the-eyes-of-each-soul, refs: ["Jāmiʿ 47:4926.1"], note: "وجعل بين عيني كل إنسان منهم وبيصا من نور"}
      - {motif: adam-gives-david-years-of-his-life, refs: ["Jāmiʿ 47:4926.1"], note: "يقال له داود ... كم جعلت عمره؟ قال: ستين سنة قال: أي رب زده من عمري أربعين سنة"}
      - {motif: adam-denies-the-gift-when-death-comes, refs: ["Jāmiʿ 47:4926.1"], note: "جاءه ملك الموت فقال: أولم يبق من عمري أربعون سنة؟ قال: أولم تعطها ابنك داود؟"}
      - {motif: adams-denial-forgetting-sin-inherited, refs: ["Jāmiʿ 47:4926.1"], note: "فجحد آدم فجحدت ذريته ونسي آدم فنسيت ذريته وخطئ آدم فخطئت ذريته"}
    hints:
      - "Close match with a number changed: in Jewish tradition Adam is shown David, destined to live no time at all, and gives him seventy years of his thousand, so that Adam lives 930 (Gen 5:5) and David seventy (Pirqe de-R. Eliezer 19; Num. Rab. 14:12; Zohar I 55a, 140a; Yalqut Shimoni Bereshit 41). The hadith has David given sixty and receiving forty."
