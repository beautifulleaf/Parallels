      - {motif: lost-camel-beyond-the-mirage, refs: ["Jāmiʿ 45:4859.1"], note: "أدرك ناقتك فقد ذهبت ... فإذا السراب ينقطع دونها"}
    hints:
      - "The pen made first and ordered to write: compare m. Avot 5:6, where 'the writing and the stylus' (ha-ketav ve-ha-mikhtav) are among the things created at twilight of the sixth day."
      - "The throne on the water before heaven and earth: compare Gen 1:2, the spirit of God over the face of the waters."
