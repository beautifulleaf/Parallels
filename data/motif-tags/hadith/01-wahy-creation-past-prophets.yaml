new_motifs:
  deeds-judged-by-intention: {label: "Deeds count only by their intentions; each person gets what he intended", cluster: ethics}
  emigration-for-a-woman-counts-as-such: {label: "One who emigrates for worldly gain or to marry a woman has emigrated only for that", cluster: ethics}
  true-dreams-like-daybreak-before-revelation: {label: "Revelation begins with true dreams that come true like the breaking of dawn (falaq al-subh)", cluster: revelation}
  solitary-devotion-in-mountain-cave: {label: "The prophet secludes himself for nights of devotion (tahannuth) in a mountain cave, taking provisions", cluster: revelation}
  angel-commands-recite-prophet-cannot-read: {label: "The angel says 'Recite!' and the prophet answers 'I am not one who recites (ma ana bi-qari')'", cluster: revelation}
  angel-squeezes-prophet-three-times: {label: "The angel seizes and presses the prophet until he is exhausted, three times, before the first verses", cluster: revelation}
  prophet-trembling-asks-to-be-wrapped: {label: "Trembling after the vision, the prophet asks his household to wrap or cover him (zammiluni, daththiruni)", cluster: revelation}
  wife-reassures-by-listing-his-virtues: {label: "The wife reassures the frightened prophet that God will not disgrace him, listing his kindnesses to kin, the weak and guests", cluster: revelation}
  christian-kinsman-recognizes-the-namus-of-moses: {label: "An aged blind Christian kinsman who copied the Gospel in Hebrew identifies the visitor as the namus sent to Moses", cluster: revelation}
  every-bringer-of-such-message-met-hostility: {label: "No one ever brought such a message without being met with enmity; his people will drive him out", cluster: prophecy}
  each-prophet-given-a-convincing-sign: {label: "Every prophet was given a sign of the kind people believed in; this prophet was given revelation (the Quran)", cluster: prophecy}
  prophet-hopes-most-followers-on-judgment-day: {label: "The prophet hopes to have the most followers of all prophets on the day of resurrection", cluster: eschatology}
  revelation-like-ringing-of-a-bell: {label: "Revelation sometimes comes like the ringing (salsala) of a bell, the hardest kind", cluster: revelation}
  angel-takes-form-of-a-man: {label: "The angel takes the likeness of a man and speaks to the prophet", cluster: angels}
  prophet-sweats-in-cold-at-revelation: {label: "Under revelation the prophet's brow streams with sweat like pearls even on a cold day", cluster: revelation}
  prophet-covered-with-cloth-during-revelation: {label: "The prophet is screened with a cloth while revelation descends; a companion lifts its edge to look", cluster: revelation}
  prophet-snores-like-young-camel-at-revelation: {label: "Under revelation the prophet makes a snoring sound like a young camel (ghatit al-bakr)", cluster: revelation}
  pilgrim-told-to-wash-off-saffron-and-remove-robe: {label: "A man in umra is told to wash off the saffron scent and take off his robe, and do in umra what he does in hajj", cluster: ritual}
  face-darkens-and-heads-bow-at-revelation: {label: "At revelation the prophet's face darkens with distress and he and his companions bow their heads", cluster: revelation}
  weight-of-revelation-on-a-companions-thigh: {label: "Revelation descends while the prophet's thigh lies on a scribe's thigh, pressing it nearly to breaking", cluster: revelation}
  camel-sinks-under-weight-of-revelation: {label: "When revelation comes while he rides, his camel strikes the ground with its neck (jiran) under the weight", cluster: revelation}
  angel-seated-on-throne-between-heaven-and-earth: {label: "The prophet hears a voice and sees the angel of the cave seated on a throne (kursi, 'arsh) between sky and earth", cluster: revelation}
  voice-calls-from-all-sides-none-seen: {label: "He is called, looks in front, behind, right and left and sees no one, until he raises his head", cluster: revelation}
  retreat-of-a-month-at-hira: {label: "The prophet keeps a month's retreat (jiwar) at Hira before the call", cluster: revelation}
  rujz-glossed-as-idols: {label: "The 'filth' (rujz) to be shunned is glossed as the idols (al-awthan)", cluster: idolatry}
  prophet-moves-lips-to-hold-revelation: {label: "The prophet moves his lips hurrying to retain the revelation; a transmitter imitates the movement", cluster: revelation}
  god-gathers-revelation-in-the-prophets-breast: {label: "God undertakes to gather the revelation in the prophet's breast; he is to listen in silence and recite after the angel leaves", cluster: revelation}
  devils-sent-east-and-west-to-find-cause: {label: "Devils barred from heaven's news are sent across the east and west of the earth to find what new thing caused it", cluster: jinn}
  jinn-hear-quran-at-dawn-prayer: {label: "A band of jinn hears the prophet reciting the Quran at the dawn prayer and recognizes the cause of their exclusion", cluster: jinn}
  prophet-concealed-nothing-of-revelation: {label: "Whoever says the prophet concealed any of the revelation is not to be believed", cluster: revelation}
  angels-beat-wings-sound-like-chain-on-rock: {label: "When God speaks a decree the angels beat their wings in submission with a sound like a chain dragged on smooth rock", cluster: angels}
  angels-swoon-at-gods-speech-until-gabriel-comes: {label: "The heavenly beings fall stunned at God's speech until Gabriel comes; they ask 'what did your Lord say?' and answer 'The truth'", cluster: angels}
  eavesdroppers-stacked-one-above-another: {label: "Stealers of hearing stand one above another, passing a heard word down to the earth", cluster: jinn}
  one-stolen-word-mixed-with-hundred-lies: {label: "A soothsayer mixes one word stolen from heaven with a hundred lies and is believed for the true one", cluster: divination}
  scribe-called-with-tablet-inkwell-shoulder-blade: {label: "The prophet calls his scribe to bring the tablet, inkwell and shoulder-blade to write a verse", cluster: revelation}
  revelation-most-frequent-before-prophets-death: {label: "Revelation came most densely in the period just before the prophet's death", cluster: revelation}
  weeping-that-revelation-from-heaven-has-ceased: {label: "After the prophet's death a woman weeps not for him but because revelation from heaven has been cut off", cluster: revelation}
  sermon-from-creation-to-final-abodes: {label: "The prophet stands and tells everything from the beginning of creation to the Hour and the final abodes; some remember, some forget", cluster: prophecy}
  man-denies-and-insults-god: {label: "Divine saying: the son of Adam belies me (saying I will not recreate him) and insults me (saying God took a son)", cluster: theology}
  first-creation-not-easier-than-repeating-it: {label: "The first creation is no easier for God than its repetition", cluster: eschatology}
  all-creatures-made-from-water: {label: "Asked what creation was made from, the prophet answers: from water; everything was created from water", cluster: cosmology}
  greeting-feeding-kinship-night-prayer-enter-paradise: {label: "Spread greeting, feed others, keep kinship ties, pray at night while people sleep, and enter paradise in peace", cluster: ethics}
  devil-prompts-question-who-created-god: {label: "Satan leads a person through 'who created this?' until 'who created your Lord?'; one must seek refuge and stop", cluster: demonology}
  sermon-interrupted-only-by-the-prayers: {label: "A sermon from the dawn prayer to sunset, broken only by descending for the noon and afternoon prayers", cluster: prophecy}
  forgotten-prediction-recognized-like-a-face: {label: "A forgotten prediction is recalled when it happens, as one recognizes the face of a man long absent", cluster: prophecy}
  god-alone-before-anything: {label: "God was, and nothing was before him (or besides him)", cluster: cosmology}
  all-things-written-in-the-dhikr: {label: "God wrote everything in the Record (al-dhikr) at the beginning", cluster: cosmology}
  pen-first-created-and-told-to-write: {label: "The first thing God created was the Pen; he told it 'Write!' and it wrote the measures of everything until the Hour", cluster: cosmology}
  pen-taken-in-gods-right-hand: {label: "God takes the first-created pen in his right hand, 'and both his hands are right'", cluster: cosmology}
  deeds-copied-from-a-finished-record: {label: "Human deeds are 'transcribed' (nastansikh), and a copy can only be made from something already complete", cluster: theology}
  what-strikes-you-could-not-miss-you: {label: "What befell you could never have missed you, and what missed you could never have befallen you", cluster: theology}
  lost-camel-beyond-the-mirage: {label: "A listener leaves to chase his strayed camel, the mirage cutting off his view, and regrets missing the rest", cluster: narrative-frame}
  god-in-a-cloud-with-air-above-and-below: {label: "Before creating, God was in a cloud ('ama'), with air beneath it and air above it", cluster: cosmology}
  seventy-thousand-angels-daily-never-returning: {label: "Seventy thousand angels enter (pray in) the heavenly house each day and never return to it", cluster: angels}
  heavenly-house-directly-above-the-kaba: {label: "The heavenly house (al-durah) is built like the Ka'ba and stands directly above it: if it fell it would fall on it", cluster: sacred-space}
  abraham-met-in-seventh-heaven: {label: "On the ascent the prophet meets Abraham in the seventh heaven, his back against the frequented House", cluster: ascent}
  lote-tree-of-the-boundary-shown: {label: "On the ascent the Lote-Tree of the Boundary is raised up before the prophet", cluster: ascent}
  stolen-land-hung-as-collar-through-seven-earths: {label: "Whoever takes a handspan of land unjustly has it hung round his neck as a collar from seven earths", cluster: eschatology}
  land-thief-sunk-through-seven-earths: {label: "Whoever takes land without right is sunk on resurrection day down through seven earths", cluster: eschatology}
  time-returned-to-its-form-at-creation: {label: "Time has come round to its form on the day God created heaven and earth", cluster: calendar}
  blood-property-honour-sacred-as-this-day: {label: "Your blood, property and honour are sacred as this day, in this land, in this month", cluster: law}
  present-to-inform-the-absent: {label: "Let the one present convey to the one absent; the hearer may understand better than the witness", cluster: transmission}
  decrees-written-fifty-thousand-years-before-creation: {label: "God wrote the measures of creatures fifty thousand years before creating heaven and earth", cluster: cosmology}
  lord-of-gabriel-michael-israfil: {label: "Night prayer opening: 'O God, Lord of Gabriel, Michael and Israfil, originator of heaven and earth'", cluster: prayer}
  gods-right-hand-full-unspent: {label: "God's right hand is full; spending night and day has not diminished it; in the other hand is the scale that raises and lowers", cluster: theology}
  oath-by-maker-of-sky-earth-mountains: {label: "A bedouin adjures the prophet by the one who made the sky, earth and set up the mountains: did God send you?", cluster: prophecy}
  five-prayers-zakat-ramadan-pilgrimage-listed: {label: "The duties listed: five daily prayers, alms on property, fast of Ramadan, pilgrimage for whoever is able", cluster: law}
  neither-add-nor-subtract-gains-paradise: {label: "One who swears to do these duties without adding or subtracting will enter paradise if truthful", cluster: law}
  sun-prostrates-under-throne-each-night: {label: "Each night the sun goes to its resting place under the Throne and falls prostrate until told to return and rise", cluster: cosmology}
  sun-ordered-to-rise-from-the-west: {label: "One day the sun is told: rise from your setting place, and it rises in the west", cluster: eschatology}
  faith-unaccepted-after-sign-of-the-end: {label: "When the sun rises from the west, faith not believed before will no longer profit a soul", cluster: eschatology}
  sun-and-moon-rolled-up-at-resurrection: {label: "Sun and moon will be rolled up (mukawwaran) on the day of resurrection", cluster: eschatology}
  eclipse-not-for-anyones-death-or-life: {label: "Sun and moon do not eclipse for anyone's death or life; they are two signs of God", cluster: cosmology}
  eclipse-on-the-day-the-prophets-son-died: {label: "The sun eclipsed the day the prophet's son Ibrahim died and people said it was for his death", cluster: cosmology}
  prayer-and-remembrance-at-eclipse: {label: "When you see an eclipse, pray, remember and call on God until it clears", cluster: ritual}
  eclipse-sent-to-frighten-gods-servants: {label: "God frightens his servants by eclipses of sun and moon", cluster: cosmology}
  helped-by-east-wind-ad-destroyed-by-west-wind: {label: "The prophet was helped by the east wind (saba) and 'Ad were destroyed by the west wind (dabur)", cluster: punishment-stories}
  prophet-alarmed-by-wind-and-cloud: {label: "At strong wind or a gathering cloud the prophet paces, goes in and out, his face changes, until rain falls", cluster: piety}
  angels-created-from-light: {label: "The angels were created from light (nur)", cluster: angels}
  adam-made-of-what-was-described: {label: "Adam was created 'from what has been described to you'", cluster: primeval}
  three-kinds-of-jinn: {label: "Three kinds of jinn: winged ones that fly in the air, snakes (and dogs), and those who camp and move on", cluster: jinn}
  prophet-taken-by-summoner-of-the-jinn: {label: "A summoner of the jinn takes the prophet away by night to recite the Quran to them; next day he shows their traces and fires", cluster: jinn}
  companions-fear-prophet-snatched-by-jinn: {label: "Companions search valleys all night fearing the prophet was carried off (ustutir) or assassinated", cluster: jinn}
  bones-and-dung-food-of-jinn: {label: "Bones over which God's name was said are food of the jinn, refleshed; dung is fodder for their animals", cluster: jinn}
  no-cleansing-with-bone-or-dung: {label: "Do not clean yourself after relieving yourself with bone or dung, for they are your brothers' food", cluster: purity}
  prophet-neither-saw-nor-recited-to-jinn: {label: "Report that the prophet did not recite to the jinn nor see them; they overheard him", cluster: jinn}
  nine-jinn-one-named-zawba-a: {label: "The jinn who listened at Nakhla were nine; one was named Zawba'a; they said 'hush' (sah)", cluster: jinn}
  jinn-delegation-of-nisibin: {label: "A delegation of the jinn of Nisibin ('excellent jinn') comes asking provision", cluster: jinn}
  gods-name-at-door-and-meal-bars-devil: {label: "If God is named on entering the house and at supper, the devil tells his fellows: no lodging, no supper", cluster: demonology}
  privies-frequented-by-jinn: {label: "Privies are haunted; on entering say 'I seek refuge with God from the male and female foul ones (khubth, khaba'ith)'", cluster: demonology}
  all-within-earshot-of-adhan-testify: {label: "No jinn, human or thing within reach of the muezzin's voice hears it but will testify for him at resurrection", cluster: ritual}
  jinni-clucks-word-into-soothsayers-ear: {label: "The jinni cackles the snatched word into the ear of his human ally like a hen clucking (qarqarat al-dajaja)", cluster: divination}
  bridegroom-and-snake-die-together: {label: "A newly married man spears a great snake coiled on his bed; it writhes on the spear and both die, none knows which first", cluster: jinn}
  house-snakes-are-muslim-jinn-warned-three-days: {label: "Some snakes in houses are jinn who became Muslim; warn them for three days, then kill as a devil", cluster: jinn}
  two-striped-and-tailless-snakes-blind-and-abort: {label: "The two-striped (dhu l-tufyatayn) and tailless (abtar) snakes are to be killed: they blind the eye and make women miscarry", cluster: law}
  young-husband-returns-at-noon-from-the-trench: {label: "A newly wed youth asks leave from the Trench at midday to visit his wife and is told to take his weapons", cluster: narrative-frame}
  black-dog-with-two-spots-is-devil: {label: "The jet-black dog with two spots (above the eyes) is a devil and may be killed", cluster: demonology}
  killing-of-dogs-ordered-then-restricted: {label: "The order to kill dogs, even a desert woman's dog, is later withdrawn except for the black one", cluster: law}
  thief-caught-three-times-pleads-family: {label: "A night thief at the alms store, caught three times, pleads need and dependants and is let go each time", cluster: demonology}
  prophet-foretells-the-thief-will-return: {label: "The prophet tells the guard 'he lied to you and will return' before it happens", cluster: prophecy}
  captive-devil-teaches-throne-verse-as-protection: {label: "To be released the captive devil teaches the Throne Verse (ayat al-kursi): recited at bedtime, a guardian stays till morning", cluster: demonology}
  he-told-you-truth-though-a-liar: {label: "'He told you the truth, though he is a liar' - the prophet reveals the night visitor was a devil", cluster: demonology}
  jinni-with-dogs-hand-and-hair: {label: "A jinni like an adolescent boy has a dog's hand and dog's hair: 'thus are the jinn created'", cluster: jinn}
  ghoul-steals-dates-from-store: {label: "A ghoul (ghul) comes to steal dates from a storage alcove", cluster: demonology}
  devil-enters-as-elephant-through-door-crack: {label: "A great shadow covers the door, enters through its crack and turns into the form of an elephant eating the dates", cluster: demonology}
  jinn-expelled-from-town-at-prophets-coming: {label: "The thief-jinni says the town was theirs until the prophet was sent and they were driven out", cluster: jinn}
  end-of-baqara-keeps-devil-from-house: {label: "Reciting the end of the Cow (2:284-286) keeps the devil from entering the house", cluster: demonology}
  captive-told-in-gods-name-answer-the-prophet: {label: "The householder is told to say to the ghoul 'In God's name, answer the Messenger of God', and so seizes her", cluster: demonology}
  devil-despairs-of-worship-in-arabia: {label: "Satan despairs of being worshipped by those who pray in Arabia, but works by setting them against one another", cluster: demonology}
  iblis-throne-on-the-water: {label: "Iblis sets his throne on the water (the sea)", cluster: demonology}
  iblis-sends-troops-and-praises-who-splits-a-couple: {label: "Iblis sends out troops; he brings nearest the one who caused the greatest trial, praising the one who parted a man from his wife", cluster: demonology}
  false-seer-sees-throne-on-water: {label: "Ibn Sayyad says he sees a throne on the water; the prophet: you see Iblis's throne on the sea", cluster: demonology}
  no-sitting-between-sun-and-shade: {label: "Prohibition of sitting partly in sun and partly in shade", cluster: demonology}
  children-kept-in-at-nightfall-when-devils-spread: {label: "At nightfall keep children in, for devils spread abroad; let them out after an hour", cluster: demonology}
  devil-cannot-open-closed-door: {label: "Close doors naming God, for the devil does not open a closed door; tie waterskins, cover vessels, put out lamps", cluster: demonology}
  devil-walks-in-one-sandal: {label: "Walking in one sandal is forbidden: the devil walks in one sandal", cluster: demonology}
  gabriel-sent-to-inspect-paradise-and-hell: {label: "After creating paradise and hell God sends Gabriel to look at each and at what is prepared for its people", cluster: eschatology}
  paradise-ringed-with-hardships-hell-with-desires: {label: "God surrounds paradise with hardships (makarih) and hell with desires (shahawat)", cluster: eschatology}
  none-will-enter-none-will-escape: {label: "Gabriel fears that now no one will enter paradise, and no one escape hell", cluster: eschatology}
  paradise-and-hell-each-created-with-its-people: {label: "God created paradise and hell and created for each its people; a dead child is not to be called a sparrow of paradise", cluster: theology}
  human-made-of-360-joints: {label: "Every human is created with three hundred and sixty joints; a charity for each saves from the fire", cluster: anatomy}
  forty-between-the-two-trumpet-blasts: {label: "Between the two blasts are 'forty'; the narrator refuses to say forty days, months or years", cluster: eschatology}
  rain-makes-the-dead-sprout-like-herbs: {label: "God sends down water from the sky and the dead sprout as herbs sprout", cluster: eschatology}
  tailbone-never-decays-man-rebuilt-from-it: {label: "All of a man decays but one bone, the tailbone ('ajb al-dhanab): from it he was made and from it he is reassembled", cluster: eschatology}
  embryo-forty-days-each-as-drop-clot-lump: {label: "The embryo is gathered forty days, then is a clot for the like, then a lump for the like", cluster: anatomy}
  angel-writes-four-things-for-the-embryo: {label: "An angel is sent to the embryo to write four things: deeds, provision, term, and wretched or blessed", cluster: theology}
  spirit-breathed-in-after-embryo-stages: {label: "After the embryo's stages the spirit is breathed into it", cluster: anatomy}
  decree-overtakes-one-a-cubit-from-the-end: {label: "One works till a cubit from paradise, then the written decree overtakes him and he does the deeds of hell, and the reverse", cluster: theology}
  parents-make-child-jew-or-christian: {label: "Every child is born on the fitra; its parents make it a Jew or a Christian", cluster: theology}
  newborn-beast-whole-until-ears-cut: {label: "As a beast is born whole and people cut its ears, so the child is born sound", cluster: parable}
  god-knows-what-dead-children-would-have-done: {label: "Of children who die young: God knows best what they would have done", cluster: theology}
  devils-drive-hanif-servants-from-their-religion: {label: "Divine saying: I created my servants all hanifs; devils came and turned them from their religion, forbade what I allowed, commanded shirk", cluster: theology}
  souls-mustered-troops-that-recognize-each-other: {label: "Souls are mustered troops: those that knew each other (before) are drawn together, those that did not are at odds", cluster: anthropology}
  crooked-rib-breaks-if-straightened: {label: "The rib's most crooked part is its top; straighten it and it breaks, leave it and it stays crooked - so treat women well", cluster: ethics}
  god-makes-every-maker-and-his-work: {label: "God makes every maker and what he makes", cluster: theology}
  mercy-in-hundred-parts-one-on-earth: {label: "God made mercy in a hundred parts; one he sent down among all creatures, ninety-nine he kept", cluster: theology}
  mare-lifts-hoof-from-her-foal: {label: "From that one part of mercy the mare lifts her hoof from her foal lest she hurt it", cluster: theology}
  each-mercy-fills-space-of-heaven-and-earth: {label: "Each of the hundred mercies fills what lies between heaven and earth", cluster: theology}
  ninety-nine-mercies-completed-at-resurrection: {label: "On resurrection day God completes the ninety-nine mercies with the one on earth", cluster: eschatology}
  unbeliever-would-not-despair-believer-not-feel-safe: {label: "If the unbeliever knew God's mercy he would not despair of paradise; if the believer knew his punishment he would not feel safe", cluster: theology}
  refusal-of-meat-slaughtered-on-cult-stones: {label: "A pre-Islamic monotheist refuses to eat what is slaughtered on the cult stones (ansab), only what God's name was said over", cluster: idolatry}
  god-made-sheep-and-its-rain-and-pasture: {label: "God made the sheep, sent rain for it and grew its pasture - yet you slaughter it in another's name", cluster: idolatry}
  ridden-cow-protests-made-for-ploughing: {label: "A man rides and beats a cow; it speaks: we were not created for this, only for ploughing", cluster: animals}
  wolf-claims-the-sheep-on-the-day-of-the-beast: {label: "A wolf robbed of its sheep says: who will guard her on the day of the beast (yawm al-sab'), when she has no shepherd but me?", cluster: animals}
  prophet-believes-it-with-abu-bakr-and-umar: {label: "The prophet answers wonder at a speaking animal: I believe it, and Abu Bakr and 'Umar - though they were not present", cluster: narrative-frame}
  ablution-after-camel-meat-not-mutton: {label: "Ablution is required after eating camel meat but not mutton", cluster: purity}
  no-prayer-in-camel-pens-pray-in-sheepfolds: {label: "Do not pray in camels' resting places, which are of the devils; pray in sheepfolds, which are blessing", cluster: purity}
  devil-on-every-camels-hump: {label: "On the hump of every camel is a devil: name God when you mount", cluster: demonology}
  jesus-kills-dajjal-at-gate-of-lydda: {label: "Jesus overtakes the Dajjal at the eastern gate of Lydda and kills him with a blow he had foretold", cluster: eschatology}
  stones-and-trees-speak-except-gharqad: {label: "At the end every stone, tree, wall and beast that hides a Jew speaks to betray him, except the gharqad, 'their tree'", cluster: eschatology}
  god-is-the-physician: {label: "Told 'I am a physician', the prophet answers: God is the physician; you are a gentle one; its physician is he who made it", cluster: theology}
  lump-between-the-prophets-shoulders: {label: "A visitor sees a lump like a growth (sil'a) between the prophet's shoulders and offers to cut it", cluster: prophecy}
  fixed-terms-days-and-provisions: {label: "Terms of life are set, days counted, provisions apportioned; nothing comes before or after its time", cluster: theology}
  transformed-people-left-no-offspring: {label: "God gave no progeny to people he transformed (maskh); apes and pigs existed before them", cluster: punishment-stories}
  lost-israelite-nation-perhaps-the-mice: {label: "A nation of Israel went missing; the prophet thinks they became the mice", cluster: punishment-stories}
  mouse-refuses-camels-milk-drinks-sheeps: {label: "The sign: the mouse will not drink camels' milk but drinks sheep's milk", cluster: punishment-stories}
  do-i-read-the-torah-retort-to-kab: {label: "Asked by Ka'b whether he heard it from the prophet, Abu Hurayra retorts: do I read the Torah? / was the Torah sent down to me?", cluster: transmission}
  convey-even-a-single-verse: {label: "Convey from me even if it is one verse", cluster: transmission}
  narrate-from-israelites-no-harm: {label: "Narrate from the Children of Israel, and there is no harm", cluster: transmission}
  liar-against-prophet-takes-seat-in-fire: {label: "Whoever deliberately lies about the prophet, let him take his seat in the fire", cluster: transmission}
  meat-rots-because-of-israel: {label: "Were it not for the Children of Israel food would not go bad nor meat rot", cluster: primeval}
  eves-betrayal-inherited-by-women: {label: "Were it not for Eve no female would ever betray her husband", cluster: primeval}
  zamzam-would-have-been-flowing-spring: {label: "Had Ishmael's mother not hurried (scooping the water), Zamzam would have been a flowing spring", cluster: abraham}
  buyer-and-seller-each-refuse-found-treasure: {label: "A buyer finds a jar of gold in land he bought; he and the seller each insist it belongs to the other", cluster: law}
  judge-marries-their-son-and-daughter-with-the-treasure: {label: "The arbiter asks whether they have children and has the one's son marry the other's daughter, the treasure spent on them and in charity", cluster: law}
  god-accepted-as-witness-and-surety-for-loan: {label: "A lender accepts God alone as witness and as guarantor for a loan of a thousand dinars", cluster: law}
  debt-sent-sealed-in-hollow-log-on-the-sea: {label: "Finding no ship, the debtor seals the money and a letter in a hollowed log and commits it to the sea, entrusting it to God", cluster: providence}
  lender-finds-the-log-as-firewood: {label: "The lender takes the drifting log home as firewood and finds the money and letter when he saws it", cluster: providence}
  debtor-pays-twice-lender-returns-it: {label: "The debtor arrives with a second thousand; the lender says God has delivered what you sent, and sends him away with it", cluster: providence}
  thirsty-dog-watered-from-a-shoe-earns-forgiveness: {label: "A thirsty dog is given water drawn in a shoe (khuff, muq), and God forgives the one who did it", cluster: ethics}
  hermit-chooses-prayer-over-mothers-call: {label: "A monk in his cell, called by his mother while praying, says 'my mother or my prayer?' and keeps praying", cluster: holy-men}
  mother-curses-son-to-see-prostitutes-faces: {label: "The slighted mother prays that her son not die until he sees the faces of prostitutes", cluster: holy-men}
  hermit-falsely-named-father-of-shepherds-child: {label: "A woman who conceived by a shepherd names the monk as father; the people pull down his cell and beat him", cluster: holy-men}
  infant-names-his-real-father: {label: "The accused prays, pokes the infant and asks 'who is your father?'; the infant names the shepherd", cluster: holy-men}
  hermitage-rebuilt-of-clay-not-gold: {label: "Offered a cell rebuilt of gold, the vindicated monk asks it be rebuilt of mud as before", cluster: holy-men}
  only-three-spoke-in-the-cradle: {label: "Only three spoke in the cradle: Jesus son of Mary, the child in Jurayj's story, and a suckling infant", cluster: wonder-children}
  suckling-infant-rejects-tyrant-chooses-slandered-slave: {label: "A suckling infant prays not to be like a splendid rider (a tyrant) but to be like a slave-girl beaten as an adulteress and thief, who is innocent", cluster: wonder-children}
  prophet-mimics-suckling-with-finger: {label: "The prophet acts out the infant's sucking with his forefinger in his mouth", cluster: narrative-frame}
  kings-sorcerer-asks-for-a-boy-to-train: {label: "An aging court sorcerer asks the king for a boy to teach sorcery", cluster: martyrdom}
  boy-tests-monk-against-sorcerer-by-a-stone: {label: "The boy throws a stone at a great beast blocking the road, praying it die if the monk's way is dearer to God than the sorcerer's", cluster: martyrdom}
  healing-the-blind-and-leper-by-gods-name: {label: "He heals the born-blind and the leper, saying 'I heal no one; God heals'", cluster: martyrdom}
  martyrs-sawn-in-half-from-the-parting: {label: "Those who will not leave their religion are sawn in two with a saw set at the parting of the hair", cluster: martyrdom}
  mountain-shakes-and-ship-capsizes-on-executioners: {label: "Taken to be thrown from a mountain and drowned at sea, the boy prays 'suffice me against them' and the executioners fall and drown", cluster: martyrdom}
  boy-dictates-his-own-execution-in-gods-name: {label: "The boy tells the king he can kill him only by gathering the people, crucifying him and shooting his own arrow 'in the name of God, Lord of the boy'", cluster: martyrdom}
  crowd-believes-in-the-lord-of-the-boy: {label: "Seeing the boy die, the crowd cries three times 'We believe in the Lord of the boy'", cluster: martyrdom}
  believers-thrown-into-fire-trenches: {label: "The king digs trenches at the road-mouths, lights fires and throws in whoever will not recant", cluster: martyrdom}
  infant-tells-mother-be-patient-enter-fire: {label: "A woman hesitates before the fire with her infant; the child says 'Mother, be steadfast, you are in the right'", cluster: martyrdom}
  rock-seals-cave-mouth-on-three-men: {label: "Three men shelter from rain in a mountain cave and a rock falls over its mouth", cluster: parable}
  each-pleads-a-deed-and-rock-moves-a-third: {label: "Each prays by a deed done for God's face and the rock moves a little, until all are freed", cluster: parable}
  son-holds-milk-all-night-by-sleeping-parents: {label: "A son stands all night with the milk at his sleeping parents' heads, unwilling to wake them or feed his crying children first", cluster: parable}
  man-leaves-cousin-at-the-last-moment: {label: "A man who paid his cousin a hundred dinars leaves her when she says 'fear God, do not break the seal without right'", cluster: parable}
  hired-mans-wage-grown-into-herd: {label: "An employer invests a refused wage of rice until it becomes cattle and herdsmen, and gives them all to the worker", cluster: parable}
  people-ruled-by-a-woman-will-not-prosper: {label: "On the Persians crowning Chosroes' daughter: a people who give their affairs to a woman will not prosper", cluster: politics}
  khidr-named-for-ground-turning-green: {label: "Khidr ('the green') was so named because he sat on bare white ground and it stirred green behind him", cluster: khidr}
  moses-says-he-is-most-learned-and-is-rebuked: {label: "Asked who is most learned, Moses says 'I', and God reproaches him for not referring knowledge to God", cluster: khidr}
  lost-fish-marks-the-place: {label: "Moses takes a fish in a basket: where he loses the fish, there the servant will be", cluster: khidr}
  fish-revives-and-water-stands-like-arch: {label: "The fish stirs, leaps into the sea, and the water's flow is held round its path like an arch (taq)", cluster: khidr}
  servant-named-joshua-son-of-nun: {label: "Moses' young servant on the journey is named: Joshua son of Nun", cluster: khidr}
  sage-lying-covered-with-a-cloth: {label: "Moses finds the sage lying wrapped in a garment; he answers the greeting 'whence peace in your land?'", cluster: khidr}
  bird-pecks-sea-measure-of-human-knowledge: {label: "A sparrow pecks once or twice from the sea: our knowledge takes from God's no more than its beak from the sea", cluster: khidr}
  boat-plank-pulled-out-with-adze: {label: "Carried free of fare, the sage pulls out a plank of the ship with an adze", cluster: khidr}
  wall-straightened-by-a-touch-without-pay: {label: "In a town that refused them food the sage straightens a falling wall with a gesture of his hand, taking no wage", cluster: khidr}
  variant-reading-every-sound-ship: {label: "Ibn Abbas reads 'before them a king seizing every sound ship' and 'the boy was an unbeliever'", cluster: khidr}
  wish-that-moses-had-been-patient: {label: "The prophet wishes Moses had been patient so that more of their story were told", cluster: khidr}
  none-now-living-survives-a-century: {label: "In a hundred years none of those now on the earth will remain alive", cluster: eschatology}
  prayer-as-light-proof-and-rescue: {label: "Prayer kept faithfully is light, proof and rescue on resurrection day", cluster: ritual}
  sun-held-back-for-joshua: {label: "The sun was held back for no human but Joshua as he marched on the Holy House: 'you are commanded and I am commanded'", cluster: conquest}
  newly-wed-builder-and-herd-owner-barred-from-campaign: {label: "A prophet bars from his campaign the man who married and has not consummated, who built and has not roofed, who awaits his flocks' young", cluster: warfare}
  fire-from-heaven-consumes-the-spoils: {label: "Fire comes to consume the gathered spoils and refuses until the stolen part is returned, then consumes all", cluster: warfare}
  thief-found-by-hand-sticking-tribe-by-tribe: {label: "One man of each tribe pledges by hand; a hand sticks, then that tribe pledges and two or three hands stick", cluster: warfare}
  stolen-golden-cow-head: {label: "The concealed spoil is gold the size of a cow's head", cluster: warfare}
  spoils-lawful-only-for-this-community: {label: "Spoils were lawful to none before us; God saw our weakness and made them lawful", cluster: law}
  angel-heals-and-enriches-three-to-test-them: {label: "God sends an angel to a leper, a bald man and a blind man; he heals each by touch and gives them flocks", cluster: parable}
  healed-given-camel-cow-and-sheep: {label: "The three receive a pregnant she-camel, a pregnant cow and a ewe with young, which become valleys of each", cluster: parable}
  angel-returns-disguised-as-their-former-self: {label: "The angel returns to each in the form he had before, a poor stranded traveller asking for help", cluster: parable}
  ingrate-claims-inherited-wealth: {label: "The ungrateful says 'I inherited it from generation to generation' and is returned to his former state", cluster: parable}
  grateful-one-told-keep-your-wealth-it-was-a-test: {label: "The grateful one says take what you want; the angel says keep it, you were only tested; God is pleased with you", cluster: parable}
  sinner-orders-body-burnt-ashes-scattered: {label: "A sinner orders his sons to burn him, grind him and scatter him in wind and sea, lest God punish him", cluster: eschatology}
  earth-ordered-to-give-back-what-it-took: {label: "God tells the earth 'give back what you took' (or says 'Be') and the man stands whole", cluster: eschatology}
  forgiven-for-fear-of-god-alone: {label: "Asked why he did it, he answers 'fear of you', and God forgives him for that", cluster: theology}
  dying-father-takes-oaths-from-sons: {label: "The dying father asks 'what father was I?' and binds his sons by oath to carry out his order", cluster: narrative-frame}
  four-best-women-mary-asiya-khadija-fatima: {label: "The best women of the worlds: Mary daughter of Imran, Asiya wife of Pharaoh, Khadija, Fatima", cluster: women}
  few-women-perfected: {label: "Many men were perfected, of women only Asiya and Mary", cluster: women}
  aisha-over-women-as-tharid-over-food: {label: "Aisha's excellence over women is like tharid over other food", cluster: women}
  newborns-cry-from-satans-touch-except-mary-and-son: {label: "Satan touches every newborn and it cries out, except Mary and her son", cluster: mary}
  quraysh-women-best-of-camel-riders: {label: "Women of Quraysh are the best who ride camels, kindest to children, most careful of a husband's means", cluster: women}
  mary-never-rode-a-camel: {label: "Mary daughter of Imran never rode a camel (so is not counted among camel-riders)", cluster: mary}
  named-after-earlier-prophets-and-saints: {label: "People were named after their prophets and righteous ones before them", cluster: polemic}
  wrong-in-verse-means-shirk: {label: "The 'wrong' (zulm) in 'those who did not mix their faith with wrong' is shirk, not self-wrong", cluster: exegesis}
  woman-in-fire-for-starving-a-cat: {label: "A woman entered the fire for a cat she tied up, neither feeding it nor letting it eat the vermin of the earth", cluster: ethics}
  cat-claws-its-tormentor-in-hell: {label: "In the vision of the fire the prophet sees the cat clawing the woman who starved it", cluster: eschatology}
  lenient-creditor-forgiven: {label: "A trader who gave the solvent respite and let off the insolvent is forgiven: God lets him off", cluster: ethics}
  dying-man-asked-for-any-good-deed: {label: "The angel of death asks the dying man if he did any good; he knows of none but his leniency in trade", cluster: eschatology}
  killer-of-ninety-nine-kills-the-monk-too: {label: "A man who killed ninety-nine asks a monk if he may repent, is told no, and kills him to make a hundred", cluster: repentance}
  scholar-sends-penitent-to-a-land-of-worshippers: {label: "A scholar says nothing bars repentance and sends him to a land where people worship God, not to return to his own", cluster: repentance}
  angels-of-mercy-and-punishment-dispute-a-soul: {label: "The angels of mercy and of punishment dispute over the soul of a man who died on the road", cluster: eschatology}
  dead-mans-place-measured-between-two-lands: {label: "An angel in human form rules: measure between the two lands; he is found nearer the good land and taken by mercy", cluster: eschatology}
  reward-in-every-moist-liver: {label: "There is reward in (kindness to) every creature with a moist liver", cluster: ethics}
  seeker-told-jews-share-wrath-christians-curse: {label: "A seeker of religion is told by a Jewish scholar he must take his share of God's wrath, by a Christian his share of God's curse", cluster: polemic}
  seeker-raises-hands-declaring-abrahams-religion: {label: "Leaving both, the seeker raises his hands: 'O God, I bear witness I am on the religion of Abraham'", cluster: abraham}
  only-one-on-abrahams-religion-against-kaba: {label: "Leaning against the Ka'ba, a man tells Quraysh none of them is on Abraham's religion but he", cluster: abraham}
  rescuer-of-girls-about-to-be-buried: {label: "He saved girls from being buried alive, raising them and offering them back to their fathers grown", cluster: ethics}
  short-woman-walks-on-wooden-legs: {label: "A short woman walking with two tall women makes herself legs of wood", cluster: vanity}
  hollow-gold-ring-filled-with-musk: {label: "She fills a closed gold ring with musk, the best of perfumes", cluster: vanity}
  monkey-throws-diluted-wine-profit-into-sea: {label: "A monkey takes the wine-seller's purse up the mast and throws a dinar into the sea and a dinar into the ship until it is divided", cluster: parable}
  watering-wine-before-sale: {label: "The merchant mixes his wine with water before selling it", cluster: parable}
  adam-created-in-his-image: {label: "God created Adam in his image (ʿala suratihi; variants 'the image of his face', 'the image of the Merciful')", cluster: primeval}
  adam-sixty-cubits-tall: {label: "Adam's height was sixty cubits", cluster: primeval}
  adam-sent-to-greet-angels-greeting-of-descendants: {label: "God sends Adam to greet a group of angels: their reply is his and his descendants' greeting; they add 'and the mercy of God'", cluster: primeval}
  stature-diminishing-since-adam: {label: "People have kept diminishing in stature since Adam; all who enter paradise will have Adam's form", cluster: primeval}
  face-spared-in-fighting-because-of-the-image: {label: "When fighting, avoid the face (do not disfigure it), for God created Adam in his image", cluster: law}
  adam-created-entered-and-expelled-on-friday: {label: "Friday: on it Adam was created, entered paradise, was put out (sent down), was forgiven, and died", cluster: primeval}
  hour-will-come-on-a-friday: {label: "The Hour will come on a Friday", cluster: eschatology}
  iblis-circles-adams-hollow-form: {label: "Adam's formed body lies in the garden; Iblis circles it, sees it is hollow and knows it is a creature without self-control", cluster: primeval}
  adam-a-prophet-spoken-to-by-god: {label: "Adam was a prophet, one addressed by God (mukallam)", cluster: primeval}
  ten-generations-from-adam-to-noah: {label: "Between Adam and Noah were ten generations (qurun)", cluster: primeval}
  boasting-ancestors-coal-of-hell-or-dung-beetle: {label: "Those who boast of dead fathers who are coal of hell will be lower than the dung beetle rolling filth with its nose", cluster: ethics}
  all-people-sons-of-adam-adam-from-dust: {label: "All people are sons of Adam and Adam is from dust; only the pious believer and wretched sinner differ", cluster: ethics}
  progeny-drawn-from-adams-back: {label: "God strokes Adam's back and every soul he will create to the end falls out of it", cluster: primeval}
  gleam-of-light-between-the-eyes-of-each-soul: {label: "Between the eyes of each pre-existent soul God puts a gleam of light (wabis)", cluster: primeval}
  adam-gives-david-years-of-his-life: {label: "Adam, shown David with a short life (sixty years), gives him forty years of his own", cluster: primeval}
  adam-denies-the-gift-when-death-comes: {label: "When the angel of death comes Adam says forty years remain to him, denying he gave them to David", cluster: primeval}
  adams-denial-forgetting-sin-inherited: {label: "Adam denied, forgot and erred, and so his offspring deny, forget and err", cluster: primeval}
  adam-sneezes-when-spirit-reaches-his-head: {label: "When the spirit reached Adam's head he sneezed and said 'praise be to God, Lord of the worlds'; God answered 'God have mercy on you'", cluster: primeval}
  adam-from-soil-of-whole-earth-children-of-every-colour: {label: "God made Adam from a handful of all the earth's surface, so his children are white, black, red, between, smooth, rough, bad and good", cluster: primeval}
  adam-chooses-between-gods-closed-hands: {label: "God holds out his two closed hands and tells Adam to choose; Adam chooses the right ('both his hands are right')", cluster: primeval}
  adam-shown-descendants-with-lifespans-written: {label: "In the opened hand are Adam and his descendants, each with his lifespan written by him", cluster: primeval}
  devil-weeps-at-human-prostration: {label: "When a man prostrates at a verse of prostration, the devil withdraws weeping: he was told to prostrate and refused, so the fire is his", cluster: demonology}
  adam-told-to-send-out-the-share-of-the-fire: {label: "At resurrection Adam is called first and told to send out of his offspring the contingent for the fire", cluster: eschatology}
  nine-hundred-ninety-nine-of-every-thousand-to-fire: {label: "Of every thousand, nine hundred and ninety-nine go to the fire and one to paradise", cluster: eschatology}
  ninety-nine-of-every-hundred-to-fire: {label: "Variant: of every hundred, ninety-nine to the fire", cluster: eschatology}
  believers-like-white-hair-on-black-ox: {label: "The believers among the nations are like a white hair on a black ox, a mole on a camel's flank, or a mark on a donkey's foreleg", cluster: eschatology}
  gog-and-magog-make-up-the-numbers: {label: "Gog and Magog (and the damned of men and jinn) fill out the count: a thousand of them for one of you", cluster: eschatology}
  hope-to-be-quarter-third-half-of-paradise: {label: "The prophet hopes his community will be a quarter, then a third, then half of paradise", cluster: eschatology}
  dajjal-forty-then-jesus-kills-him: {label: "The Dajjal stays 'forty' (days, months or years); God sends Jesus, who looks like 'Urwa b. Mas'ud, and he destroys him", cluster: eschatology}
  cold-wind-from-syria-takes-every-believer: {label: "A cold wind from Syria takes the soul of everyone with an atom of good or faith, even inside a mountain", cluster: eschatology}
  first-to-hear-trumpet-plastering-his-camels-trough: {label: "The first to hear the trumpet is a man plastering his camels' trough; he falls stunned and the people with him", cluster: eschatology}
  dying-adam-craves-fruit-of-paradise: {label: "Dying, Adam tells his sons he craves fruit of paradise, and they go to seek it", cluster: primeval}
  angels-come-with-shroud-spices-and-spades: {label: "Angels meet the sons carrying Adam's shroud and embalming spices with axes, spades and baskets: 'go back, your father's end is decreed'", cluster: primeval}
  adam-pushes-eve-away-at-death: {label: "Eve clings to Adam on seeing the angels; he says 'away from me, I was afflicted through you'", cluster: primeval}
  angels-bury-adam-as-model-for-his-sons: {label: "The angels take, wash, shroud, embalm, dig a niche-grave, pray over and bury Adam and say 'children of Adam, this is your practice (sunna)'", cluster: primeval}
  beasts-listen-anxiously-every-friday-dawn: {label: "Every beast listens anxiously each Friday from dawn to sunrise, fearing the Hour, except jinn and humans", cluster: eschatology}
  hour-of-answered-prayer-on-friday: {label: "On Friday is an hour in which a praying Muslim is given whatever he asks", cluster: ritual}
  companion-exchanges-hadith-for-torah-with-kab: {label: "At the Mount (al-Tur) a companion sits with Ka'b al-Ahbar, who tells him of the Torah while he tells of the prophet", cluster: transmission}
  prophets-breast-split-washed-with-zamzam: {label: "The roof opens; Gabriel splits the prophet's breast, washes it with Zamzam water and fills it from a gold basin full of wisdom and faith", cluster: ascent}
  gatekeeper-of-heaven-asks-who-is-with-you: {label: "At each heaven the gatekeeper asks 'who is it? who is with you? has he been sent for?' before opening", cluster: ascent}
  adam-laughs-right-weeps-left-at-offspring: {label: "In the lowest heaven Adam looks at the shadowy souls of his offspring: laughing at those on his right (paradise), weeping at those on his left (fire)", cluster: ascent}
  prophets-placed-in-the-heavens: {label: "On the ascent prophets are met in particular heavens (Adam first; Idris fourth or second; Abraham sixth or seventh)", cluster: ascent}
  welcome-as-righteous-brother-or-son: {label: "Prophets welcome Muhammad 'righteous prophet and righteous brother'; Adam and Abraham say 'righteous son'", cluster: ascent}
  a-prophet-who-divined-by-drawing-lines: {label: "A prophet used to draw lines (in the sand); whoever's lines agree with his, that is right", cluster: divination}
  noah-first-messenger-to-people-of-earth: {label: "Noah is the first messenger God sent to the people of the earth", cluster: flood}
  noah-called-a-grateful-servant: {label: "God named Noah 'a grateful servant' ('abdan shakuran)", cluster: flood}
  prophets-decline-intercession-citing-a-fault: {label: "At resurrection people ask prophet after prophet to intercede; each says 'myself, myself', recalls a fault and sends them on", cluster: eschatology}
  noah-ashamed-of-asking-what-he-had-no-knowledge-of: {label: "Noah declines to intercede, ashamed of having asked his Lord about what he had no knowledge of", cluster: flood}
  every-prophet-warned-of-the-dajjal-noah-first: {label: "Every prophet warned his people of the Dajjal; Noah warned his", cluster: eschatology}
  dajjal-one-eyed-god-not: {label: "The Dajjal is one-eyed, and your Lord is not one-eyed", cluster: eschatology}
  dajjals-paradise-is-fire: {label: "The Dajjal brings a likeness of paradise and fire; what he calls paradise is the fire", cluster: eschatology}
  noahs-people-deny-he-delivered-the-message: {label: "At judgment Noah says he delivered the message; his people say 'no prophet came to us'", cluster: flood}
  muhammads-community-testifies-for-noah: {label: "Asked for witnesses, Noah names Muhammad and his community, who testify that he delivered it", cluster: flood}
  noahs-idols-passed-to-arab-tribes: {label: "Noah's people's idols later belonged to Arab tribes: Wadd to Kalb at Dumat al-Jandal, Suwa' to Hudhayl, Yaghuth to Murad, Ya'uq to Hamdan, Nasr to Himyar", cluster: idolatry}
  idols-began-as-memorial-statues-of-righteous-men: {label: "The idols were named for righteous men; at Satan's prompting statues were set up in their places, and worshipped once knowledge was forgotten", cluster: idolatry}
  ten-named-in-paradise: {label: "Ten named men promised paradise, the narrator the ninth and the prophet the tenth", cluster: community}
  one-battle-outweighs-noahs-lifespan: {label: "One battle with the prophet, face dusted, outweighs the deeds of a life as long as Noah's", cluster: warfare}
  noahs-deathbed-charge-two-and-two: {label: "Dying, Noah charges his son with two commands and two prohibitions", cluster: flood}
  no-god-but-god-outweighs-seven-heavens-and-earths: {label: "Seven heavens and seven earths in one pan of the scale, 'no god but God' in the other, outweighs them; if a ring it would break them", cluster: theology}
  subhan-allah-prayer-of-all-things-and-their-provision: {label: "'Glory to God and praise' is the prayer of every thing and by it creatures are provided for", cluster: piety}
  pride-is-rejecting-truth-and-despising-people: {label: "Pride is not fine sandals, robes, a mount or friends but rejecting the truth and despising people", cluster: ethics}
  killing-as-ad-were-killed: {label: "Of those who will go out of Islam like an arrow through its game: 'if I meet them I will kill them as 'Ad were killed', leaving none", cluster: punishment-stories}
  reciters-whose-quran-passes-no-further-than-throats: {label: "From this man's stock come people who recite the Quran without it passing their throats, kill Muslims and leave idolaters", cluster: eschatology}
  prayer-for-the-good-of-the-wind: {label: "In a storm: 'I ask you for its good and the good of what it is sent with, and seek refuge from its evil'", cluster: prayer}
  prophet-smiles-never-laughs-open-mouthed: {label: "The prophet was never seen laughing so his uvula showed; he only smiled", cluster: prophecy}
  drought-stricken-people-send-an-envoy-to-pray-for-rain: {label: "Struck by drought, 'Ad send an envoy (qayl) to pray for rain", cluster: punishment-stories}
  envoy-delays-a-month-drinking-with-two-singing-girls: {label: "The envoy stays a month with Bakr drinking wine while two singing girls, 'the two locusts' (al-jaradatan), sing to him", cluster: punishment-stories}
  envoy-prays-water-ad-as-you-used-to: {label: "On the mountains of Mahra he prays: I have not come for a sick man to cure or a captive to ransom - water 'Ad as you used to", cluster: punishment-stories}
  black-cloud-announces-ashes-for-ad: {label: "Black clouds pass and a voice from them says: take it as ashes, leave none of 'Ad", cluster: punishment-stories}
  destroying-wind-no-more-than-a-ring-hole: {label: "The wind sent on 'Ad was no more than would pass through a signet ring", cluster: punishment-stories}
  proverb-like-the-envoy-of-ad: {label: "Proverb: 'do not be like the envoy of 'Ad'", cluster: proverbs}
  proverb-goat-carried-its-own-death: {label: "Proverb: 'a goat that carried its own death' (mi'za hamalat hatfan)", cluster: proverbs}
  camel-killer-a-mighty-man-of-his-clan: {label: "The one who hamstrung the she-camel was a mighty, wicked man, powerful in his clan, like Abu Zam'a", cluster: punishment-stories}
  wife-flogged-like-a-slave-then-bedded: {label: "Rebuke: one of you flogs his wife like a slave and may lie with her at the end of the day", cluster: ethics}
  why-laugh-at-a-breaking-of-wind: {label: "Why do you laugh at what you yourselves do (breaking wind)?", cluster: ethics}
  enter-dwellings-of-the-destroyed-only-weeping: {label: "Do not enter the dwellings of those who wronged themselves unless weeping, lest what struck them strike you", cluster: punishment-stories}
  prophet-veils-head-and-hurries-through-valley: {label: "Passing the ruins of Thamud the prophet covers his head with his cloak and hastens through the valley", cluster: punishment-stories}
  water-of-destroyed-town-poured-out-dough-to-camels: {label: "Water drawn from Thamud's wells is poured out, dough made with it fed to camels; water is taken only from the she-camel's well", cluster: purity}
  do-not-ask-for-signs-like-salihs-people: {label: "Do not ask for signs: Salih's people asked, and the she-camel came", cluster: punishment-stories}
  she-camel-came-and-went-by-two-paths: {label: "The she-camel came down to water by one mountain pass and went out by another", cluster: punishment-stories}
  alternate-days-water-and-milk: {label: "The she-camel drank their water one day, and they drank her milk the next", cluster: punishment-stories}
  thamud-destroyed-by-the-shout: {label: "A shout (sayha) seized Thamud and silenced all under the sky", cluster: punishment-stories}
  one-sheltered-in-sanctuary-struck-on-leaving: {label: "One man escaped by being in God's sanctuary (Abu Righal); when he left it he was struck like his people", cluster: punishment-stories}
  abraham-reminds-god-of-promise-not-to-disgrace-him: {label: "Abraham pleads: you promised not to disgrace me on the day they are raised - what disgrace greater than my father?", cluster: abraham}
  azar-turned-into-a-hyena: {label: "Abraham's father is turned into a filth-smeared male hyena (dhikh) and thrown by its legs into the fire", cluster: abraham}
  father-says-today-i-will-not-disobey: {label: "On resurrection day Abraham's father, his face dusty and dark, says 'today I will not disobey you'", cluster: abraham}
  joseph-prophet-son-of-prophets-of-gods-friend: {label: "The noblest is Joseph, prophet, son of a prophet, son of a prophet, son of God's friend", cluster: patriarchs}
  best-in-jahiliyya-best-in-islam: {label: "The best of you in the Jahiliyya are the best in Islam if they understand", cluster: community}
  muhammad-taken-as-friend-like-abraham: {label: "God took Muhammad as friend (khalil) as he took Abraham; had he taken a human friend it would be Abu Bakr", cluster: abraham}
  graves-of-prophets-taken-as-places-of-worship: {label: "Those before you made the graves of their prophets and saints into places of worship; do not do so", cluster: polemic}
  gecko-blew-on-abrahams-fire: {label: "The gecko blew on the fire in which Abraham was thrown; so geckos are to be killed", cluster: abraham}
  frog-tried-to-put-out-abrahams-fire: {label: "The frog (and every beast) tried to put out Abraham's fire; so frogs may not be killed", cluster: abraham}
  we-have-more-right-to-doubt-than-abraham: {label: "'We have more right to doubt than Abraham' (said of his asking to see the dead raised)", cluster: abraham}
  joseph-declined-release-from-prison: {label: "Had I stayed in prison as long as Joseph I would have answered the summoner (Joseph declined release till cleared)", cluster: patriarchs}
  abraham-circumcised-at-eighty-with-adze: {label: "Abraham circumcised himself at eighty years old with an adze (al-qadum)", cluster: abraham}
  sister-in-religion-justifies-the-claim: {label: "Abraham's 'sister' is justified: she is his sister in Islam, they being the only believers in the land", cluster: abraham}
  sarah-prays-and-the-king-is-seized: {label: "Sarah performs ablution and prays; the king reaching for her is choked till he kicks (or his hand is seized)", cluster: abraham}
  king-seized-three-times-and-released-at-her-prayer: {label: "Three times the king is seized and three times released at her prayer, promising not to harm her", cluster: abraham}
  king-says-you-brought-me-a-devil: {label: "The king says to his men: you brought me a devil, not a human; send her back", cluster: abraham}
  king-gives-hagar-to-sarah: {label: "The king gives Sarah Hagar (Ajar) as a servant: 'God thwarted the wicked and gave a maid'", cluster: abraham}
  abrahams-three-lies: {label: "Abraham told only three lies: two for God ('I am sick', 'the biggest of them did it') and one about Sarah", cluster: abraham}
  arabs-sons-of-the-water-of-heaven: {label: "Abu Hurayra: 'that is your mother (Hagar), sons of the water of heaven'", cluster: abraham}
  abraham-asks-mahyam-what-news: {label: "Abraham asks Sarah 'mahyam?' (what news?) and she answers 'good'", cluster: abraham}
  hagar-first-to-wear-the-girdle: {label: "Women first took the girdle (mintaq) from Ishmael's mother, who wore it to hide her tracks from Sarah", cluster: abraham}
  mother-and-child-left-with-skin-of-water-and-dates: {label: "Abraham leaves the mother and nursing child with a bag of dates and a skin of water", cluster: abraham}
  hagar-asks-did-god-command-this: {label: "Hagar follows Abraham asking why he leaves them; 'Did God command you?' 'Yes.' 'Then he will not abandon us'", cluster: abraham}
  mother-turns-away-not-to-watch-child-die: {label: "When the water runs out the mother goes off so as not to watch her writhing child die", cluster: abraham}
  seven-runs-between-safa-and-marwa: {label: "She climbs Safa, runs across the valley bottom to Marwa looking for anyone, seven times: 'so is the people's running between them'", cluster: abraham}
  angel-strikes-ground-with-heel-and-water-gushes: {label: "An angel (Gabriel) digs with his heel (or wing) at the place of Zamzam and water gushes", cluster: abraham}
  angel-says-father-and-boy-will-build-the-house: {label: "The angel tells her: fear no ruin, here is God's House which this boy and his father will build", cluster: abraham}
  circling-bird-shows-travellers-water: {label: "Travellers of Jurhum see a bird circling and reason it must circle over water", cluster: abraham}
  settlers-allowed-but-no-right-to-the-water: {label: "Hagar lets Jurhum settle by her but grants them no right in the water", cluster: abraham}
  ishmael-learns-arabic-from-jurhum-and-marries-among-them: {label: "Ishmael grows up among Jurhum, learns Arabic from them and marries one of their women", cluster: abraham}
  abraham-tests-sons-wives-change-the-threshold: {label: "Abraham visits in Ishmael's absence: the complaining wife is to tell him 'change your threshold'; the grateful one, 'keep your threshold'", cluster: abraham}
  abraham-blesses-meat-and-water-of-mecca: {label: "Told they live on meat and water, Abraham blesses their meat and water; they had no grain, or he would have blessed it", cluster: abraham}
  medina-made-sacred-as-abraham-made-mecca: {label: "The prophet makes sacred what lies between Medina's two mountains as Abraham made Mecca sacred, and blesses its measures", cluster: sacred-space}
  mountain-that-loves-us: {label: "Uhud: 'a mountain that loves us and we love it'", cluster: sacred-space}
  refuge-from-eight-afflictions: {label: "Prayer for refuge from worry, grief, incapacity, laziness, miserliness, cowardice, the burden of debt and being overpowered by men", cluster: prayer}
  kaba-rebuilt-short-of-abrahams-foundations: {label: "Quraysh rebuilt the Ka'ba short of Abraham's foundations; the prophet would restore them but for his people's recent unbelief", cluster: sacred-space}
  two-corners-by-the-hijr-not-touched: {label: "The prophet did not touch the two corners next to the Hijr because the House was not complete on Abraham's foundations", cluster: ritual}
  abraham-resembles-muhammad: {label: "Abraham looks like Muhammad: 'look at your companion'; 'I am the most like him of his children'", cluster: abraham}
  moses-like-a-man-of-shanua: {label: "Moses is tall, brown, curly-haired, like a man of Shanu'a, riding a red camel and calling the talbiya", cluster: prophecy}
  jesus-ruddy-as-if-from-a-bath: {label: "Jesus is of middle height, ruddy as if just out of a bath (dimas), most like 'Urwa b. Mas'ud", cluster: prophecy}
  gabriel-resembles-dihya: {label: "Gabriel most resembles Dihya b. Khalifa", cluster: angels}
  milk-chosen-over-wine-is-the-fitra: {label: "Offered a vessel of milk and one of wine, the prophet takes the milk: 'you are guided to the fitra; had you taken wine your community would have strayed'", cluster: ascent}
  dajjal-has-kafir-written-between-eyes: {label: "The Dajjal has 'kafir' written between his eyes", cluster: eschatology}
  abraham-the-best-of-creation: {label: "Addressed as 'best of creation', the prophet says: that is Abraham", cluster: abraham}

units:
  - id: hadith-1-deeds-by-intentions
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Deeds are by intentions; the emigrant to a woman or to the world
    read: ["Jāmiʿ 1:106.1"]
    quran: []
    tags:
      - {motif: deeds-judged-by-intention, refs: ["Jāmiʿ 1:106.1"], note: "إنما الأعمال بالنيات، وإنما لكل امرئ ما نوى"}
      - {motif: emigration-for-a-woman-counts-as-such, refs: ["Jāmiʿ 1:106.1"], note: "ومن كانت هجرته إلى دنيا يصيبها، أو إلى امرأة ينكحها، فهجرته إلى ما هاجر إليه"}
  - id: hadith-1-first-revelation-hira
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: The first revelation in the cave of Hira, Khadija and Waraqa
    read: ["Jāmiʿ 1:107.1"]
    quran: ["96:1-5", "4:163"]
    tags:
      - {motif: true-dreams-like-daybreak-before-revelation, refs: ["Jāmiʿ 1:107.1"], note: "الرؤيا الصالحة في النوم، فكان لا يرى رؤيا إلا جاءت مثل فلق الصبح"}
      - {motif: solitary-devotion-in-mountain-cave, refs: ["Jāmiʿ 1:107.1"], note: "يخلو بغار حراء فيتحنث فيه -وهو التعبد- الليالي ذوات العدد"}
      - {motif: angel-commands-recite-prophet-cannot-read, refs: ["Jāmiʿ 1:107.1"], note: "فقال: اقرأ، قال: ما أنا بقارئ"}
      - {motif: angel-squeezes-prophet-three-times, refs: ["Jāmiʿ 1:107.1"], note: "فأخذني فغطني حتى بلغ مني الجهد ... الثانية ... الثالثة"}
      - {motif: prophet-trembling-asks-to-be-wrapped, refs: ["Jāmiʿ 1:107.1"], note: "يرجف فؤاده ... زملوني زملوني"}
      - {motif: wife-reassures-by-listing-his-virtues, refs: ["Jāmiʿ 1:107.1"], note: "كلا والله ما يخزيك الله أبدا، إنك لتصل الرحم وتحمل الكل ..."}
      - {motif: christian-kinsman-recognizes-the-namus-of-moses, refs: ["Jāmiʿ 1:107.1"], note: "ورقة ... تنصر في الجاهلية ... يكتب من الإنجيل بالعبرانية ... هذا الناموس الذي نزل الله على موسى"}
      - {motif: every-bringer-of-such-message-met-hostility, refs: ["Jāmiʿ 1:107.1"], note: "لم يأت رجل قط بمثل ما جئت به إلا عودي ... إذ يخرجك قومك"}
    hints:
      - "The answer 'I am not a reader' (ma ana bi-qari') against Isa 29:12, where the book is given to one who says 'I do not know writing' (lo yada'ti sefer)."
  - id: hadith-1-prophets-signs-and-the-quran
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Each prophet given a sign; the Prophet given revelation
    read: ["Jāmiʿ 1:108.1"]
    quran: []
    tags:
      - {motif: each-prophet-given-a-convincing-sign, refs: ["Jāmiʿ 1:108.1"], note: "ما من الأنبياء نبي إلا أعطي ما مثله آمن عليه البشر"}
      - {motif: prophet-hopes-most-followers-on-judgment-day, refs: ["Jāmiʿ 1:108.1"], note: "وإنما الذي أوتيت وحيا ... فأرجو أن أكون أكثرهم تابعا يوم القيامة"}
  - id: hadith-1-manner-and-weight-of-revelation
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: How revelation came - the bell, the angel as a man, sweat, snoring, bowed heads, the weight on camel and thigh
    read: ["Jāmiʿ 1:108.2-110.2"]
    quran: ["73:5", "4:95"]
    tags:
      - {motif: revelation-like-ringing-of-a-bell, refs: ["Jāmiʿ 1:108.2"], note: "أحيانا يأتيني مثل صلصلة الجرس وهو أشد علي"}
      - {motif: angel-takes-form-of-a-man, refs: ["Jāmiʿ 1:108.2"], note: "وأحيانا يتمثل لي الملك رجلا فيكلمني"}
      - {motif: prophet-sweats-in-cold-at-revelation, refs: ["Jāmiʿ 1:108.2", "Jāmiʿ 1:109.2"], note: "في اليوم الشديد البرد ... وإن جبينه ليتفصد عرقا؛ مثل الجمان وهو في يوم شات"}
      - {motif: prophet-covered-with-cloth-during-revelation, refs: ["Jāmiʿ 1:108.3"], note: "فستر بثوب ... فرفع عمر طرف الثوب"}
      - {motif: prophet-snores-like-young-camel-at-revelation, refs: ["Jāmiʿ 1:108.3"], note: "له غطيط كغطيط البكر"}
      - {motif: pilgrim-told-to-wash-off-saffron-and-remove-robe, refs: ["Jāmiʿ 1:108.3"], note: "اغسل عنك أثر الصفرة ... واخلع عنك جبتك، واصنع في عمرتك ما أنت صانع في حجك"}
      - {motif: face-darkens-and-heads-bow-at-revelation, refs: ["Jāmiʿ 1:109.1", "Jāmiʿ 1:110.1"], note: "كرب لذلك وتربد وجهه ... نكس رأسه ونكس أصحابه رؤوسهم"}
      - {motif: heavy-word-cast-on-prophet, refs: ["Jāmiʿ 1:109.2", "Jāmiʿ 1:110.2"], note: "من ثقل القول الذي أنزل عليه"}
      - {motif: weight-of-revelation-on-a-companions-thigh, refs: ["Jāmiʿ 1:109.3"], note: "وفخذه على فخذي، فثقلت علي حتى خفت أن ترض فخذي"}
      - {motif: disabled-exempt-from-fighting, refs: ["Jāmiʿ 1:109.3"], note: "غير أولي الضرر - sent down for the blind Ibn Umm Maktum"}
      - {motif: camel-sinks-under-weight-of-revelation, refs: ["Jāmiʿ 1:110.2"], note: "إن كان ليوحى إليه وهو على راحلته فتضرب بجرانها"}
  - id: hadith-1-pause-and-the-muddaththir
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: The pause in revelation; the angel on a throne between sky and earth; "O you wrapped"
    read: ["Jāmiʿ 1:111.1-112.1"]
    quran: ["74:1-5", "96:1"]
    tags:
      - {motif: angel-seated-on-throne-between-heaven-and-earth, refs: ["Jāmiʿ 1:111.1", "Jāmiʿ 1:112.1"], note: "فإذا الملك الذي جاءني بحراء جالسا على كرسي بين السماء والأرض؛ على العرش في الهواء"}
      - {motif: voice-calls-from-all-sides-none-seen, refs: ["Jāmiʿ 1:112.1"], note: "فنوديت فنظرت أمامي وخلفي وعن يميني وعن شمالي فلم أر أحدا"}
      - {motif: prophet-trembling-asks-to-be-wrapped, refs: ["Jāmiʿ 1:111.1", "Jāmiʿ 1:112.1"], note: "زملوني ... دثروني ... فصبوا علي ماء"}
      - {motif: retreat-of-a-month-at-hira, refs: ["Jāmiʿ 1:112.1"], note: "جاورت بحراء شهرا"}
      - {motif: rujz-glossed-as-idols, refs: ["Jāmiʿ 1:111.1"], note: "والرجز فاهجر وهي الأوثان"}
  - id: hadith-1-hastening-the-tongue
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Moving the lips with the revelation; Ibn Abbas shows how
    read: ["Jāmiʿ 1:113.1"]
    quran: ["75:16-19"]
    tags:
      - {motif: prophet-moves-lips-to-hold-revelation, refs: ["Jāmiʿ 1:113.1"], note: "كان مما يحرك شفتيه ... فأنا أحركهما لكم كما كان رسول الله يحركهما"}
      - {motif: god-gathers-revelation-in-the-prophets-breast, refs: ["Jāmiʿ 1:113.1"], note: "جمعه لك في صدرك ... فاستمع له وأنصت"}
  - id: hadith-1-jinn-hear-the-quran
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Devils barred from heaven's news search the earth and hear the dawn prayer at Nakhla
    read: ["Jāmiʿ 1:113.2"]
    quran: ["72:1-2"]
    tags:
      - {motif: spirits-eavesdrop-on-heaven-repelled-by-meteors, refs: ["Jāmiʿ 1:113.2"], note: "حيل بين الشياطين وبين خبر السماء وأرسلت عليهم الشهب"}
      - {motif: devils-sent-east-and-west-to-find-cause, refs: ["Jāmiʿ 1:113.2"], note: "فاضربوا مشارق الأرض ومغاربها فانظروا ما هذا الذي حال بينكم"}
      - {motif: jinn-hear-quran-at-dawn-prayer, refs: ["Jāmiʿ 1:113.2"], note: "وهو بنخلة ... يصلي بأصحابه صلاة الفجر، فلما سمعوا القرآن استمعوا له"}
  - id: hadith-1-nothing-concealed
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Whoever says Muhammad concealed any revelation lies
    read: ["Jāmiʿ 1:114.1"]
    quran: ["5:67"]
    tags:
      - {motif: prophet-concealed-nothing-of-revelation, refs: ["Jāmiʿ 1:114.1"], note: "من حدثك أن محمدا كتم شيئا من الوحي فلا تصدقه"}
  - id: hadith-1-heaven-at-the-word
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Angels beat their wings at God's decree; the stacked eavesdroppers and the soothsayer's hundred lies
    read: ["Jāmiʿ 1:115.1-115.2"]
    quran: ["34:23"]
    tags:
      - {motif: angels-beat-wings-sound-like-chain-on-rock, refs: ["Jāmiʿ 1:115.1", "Jāmiʿ 1:115.2"], note: "ضربت الملائكة بأجنحتها خضعانا لقوله كالسلسلة على صفوان؛ صلصلة كجر السلسلة على الصفا"}
      - {motif: angels-swoon-at-gods-speech-until-gabriel-comes, refs: ["Jāmiʿ 1:115.2"], note: "فيصعقون ... حتى يأتيهم جبريل ... ماذا قال ربك؟ فيقول: الحق"}
      - {motif: eavesdroppers-stacked-one-above-another, refs: ["Jāmiʿ 1:115.1"], note: "مسترقو السمع هكذا واحد فوق آخر -ووصف سفيان بيده"}
      - {motif: devils-eavesdrop-pelted-with-shooting-stars, refs: ["Jāmiʿ 1:115.1"], note: "فربما أدرك الشهاب المستمع قبل أن يرمي بها إلى صاحبه فيحرقه"}
      - {motif: one-stolen-word-mixed-with-hundred-lies, refs: ["Jāmiʿ 1:115.1"], note: "فتلقى على فم الساحر فيكذب معها مائة كذبة"}
  - id: hadith-1-verse-sent-in-two-parts
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: The blind man's objection and the exemption added to the verse
    read: ["Jāmiʿ 1:117.1-117.2"]
    quran: ["4:95"]
    tags:
      - {motif: scribe-called-with-tablet-inkwell-shoulder-blade, refs: ["Jāmiʿ 1:117.1", "Jāmiʿ 1:117.2"], note: "ادع لي زيدا وليجئ معه باللوح والدواة والكتف"}
      - {motif: disabled-exempt-from-fighting, refs: ["Jāmiʿ 1:117.1", "Jāmiʿ 1:117.2"], note: "عمرو بن أم مكتوم الأعمى ... فنزلت مكانها: غير أولي الضرر"}
  - id: hadith-1-revelation-dense-then-cut
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Revelation densest before his death; Umm Ayman weeps that it is cut off
    read: ["Jāmiʿ 1:117.3-118.1"]
    quran: []
    tags:
      - {motif: revelation-most-frequent-before-prophets-death, refs: ["Jāmiʿ 1:117.3"], note: "تابع على رسوله الوحي قبل وفاته حتى توفاه أكثر ما كان الوحي"}
      - {motif: weeping-that-revelation-from-heaven-has-ceased, refs: ["Jāmiʿ 1:118.1"], note: "ولكن أبكي أن الوحي قد انقطع من السماء؛ فهيجتهما على البكاء"}
  - id: hadith-45-sermon-on-the-beginning
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: A sermon from the beginning of creation to the people of paradise and hell; man's denial and insult of God
    read: ["Jāmiʿ 45:4856.1-4856.2"]
    quran: ["112:1-4"]
    tags:
      - {motif: sermon-from-creation-to-final-abodes, refs: ["Jāmiʿ 45:4856.1"], note: "فأخبرنا عن بدء الخلق حتى دخل أهل الجنة منازلهم وأهل النار منازلهم، حفظ ذلك من حفظه ونسيه من نسي"}
