      - {motif: king-seized-three-times-and-released-at-her-prayer, refs: ["Jāmiʿ 47:4954.3", "Jāmiʿ 47:4955.1"], note: "ادعي الله أن يطلق يدي ولا أضرك ففعلت فعاد فقبضت أشد من القبضة الأولى ... الثانية أو الثالثة"}
      - {motif: king-says-you-brought-me-a-devil, refs: ["Jāmiʿ 47:4954.3", "Jāmiʿ 47:4955.1"], note: "إنك إنما أتيتني بشيطان ولم تأتني بإنسان"}
      - {motif: king-gives-hagar-to-sarah, refs: ["Jāmiʿ 47:4954.3", "Jāmiʿ 47:4955.1"], note: "وأعطوها آجر ... وأعطها هاجر ... كبت الكافر وأخدم وليدة"}
      - {motif: abrahams-three-lies, refs: ["Jāmiʿ 47:4955.1"], note: "لم يكذب إبراهيم قط إلا ثلاث كذبات: ثنتين في ذات الله قوله: إني سقيم وقوله: بل فعله كبيرهم هذا وواحدة في شأن سارة"}
      - {motif: arabs-sons-of-the-water-of-heaven, refs: ["Jāmiʿ 47:4955.1"], note: "قال أبو هريرة: فتلك أمكم يا بني ماء السماء"}
      - {motif: abraham-asks-mahyam-what-news, refs: ["Jāmiʿ 47:4955.1"], note: "فقال لها: مهيم قالت: خيرا كف الله يد الفاجر"}
    hints:
      - "Gen 12:10-20 and 20:1-18 (wife-sister episodes; Pharaoh and Abimelech struck by God); Gen 20:12 'she is indeed my sister, daughter of my father' - the hadith justifies the word as 'sister in Islam'."
      - "Sarah's prayer and the king's paralysis: Genesis Apocryphon 20:12-29 (Abram prays, a spirit afflicts Pharaoh who cannot approach her; released when Abram lays hands on him); Gen. Rab. 41:2 (an angel strikes Pharaoh at Sarah's word). Hagar given to Sarah by the king: Gen. Rab. 45:1 (Pharaoh gives his daughter Hagar as maid)."
  - id: hadith-47-hagar-ismail-and-the-house
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Hagar and Ishmael left at the House; the run between Safa and Marwa; Zamzam struck by the angel; Jurhum; the two wives and the threshold; the building of the House
    read: ["Jāmiʿ 47:4956.1-4958.1"]
    quran: ["14:37", "2:127"]
    tags:
      - {motif: hagar-first-to-wear-the-girdle, refs: ["Jāmiʿ 47:4956.1"], note: "أول ما اتخذ النساء المنطق من قبل أم إسماعيل اتخذت منطقا لتعفي أثرها على سارة"}
      - {motif: offspring-settled-in-barren-valley-at-sacred-house, refs: ["Jāmiʿ 47:4956.1"], note: "حتى وضعهما عند البيت عند دوحة فوق زمزم ... وليس بمكة يومئذ أحد وليس بها ماء ... ربنا إني أسكنت من ذريتي بواد غير ذي زرع"}
      - {motif: mother-and-child-left-with-skin-of-water-and-dates, refs: ["Jāmiʿ 47:4956.1", "Jāmiʿ 47:4958.1"], note: "ووضع عندهما جرابا فيه تمر وسقاء فيه ماء؛ ومعهم شنة فيها ماء"}
      - {motif: hagar-asks-did-god-command-this, refs: ["Jāmiʿ 47:4956.1", "Jāmiʿ 47:4958.1"], note: "آلله الذي أمرك بهذا؟ قال: نعم قالت: إذن لا يضيعنا؛ إلى من تتركنا؟ قال: إلى الله. قالت: رضيت بالله"}
      - {motif: mother-turns-away-not-to-watch-child-die, refs: ["Jāmiʿ 47:4956.1", "Jāmiʿ 47:4958.1"], note: "وجعلت تنظر إليه يتلوى ... فانطلقت كراهية أن تنظر إليه؛ كأنه ينشغ للموت"}
      - {motif: seven-runs-between-safa-and-marwa, refs: ["Jāmiʿ 47:4956.1", "Jāmiʿ 47:4958.1"], note: "ففعلت ذلك سبع مرات قال النبي: فذلك سعي الناس بينهما"}
      - {motif: safa-and-marwa, refs: ["Jāmiʿ 47:4956.1", "Jāmiʿ 47:4958.1"], note: "فوجدت الصفا أقرب جبل ... ثم أتت المروة"}
      - {motif: angel-strikes-ground-with-heel-and-water-gushes, refs: ["Jāmiʿ 47:4956.1", "Jāmiʿ 47:4958.1"], note: "فإذا هي بالملك عند موضع زمزم فبحث بعقبه - أو قال بجناحه - حتى ظهر الماء؛ فإذا جبريل ... وغمز عقبه على الأرض فانبثق الماء"}
      - {motif: zamzam-would-have-been-flowing-spring, refs: ["Jāmiʿ 47:4956.1", "Jāmiʿ 47:4958.1"], note: "لو تركت زمزم ... لكانت زمزم عينا معينا؛ لو تركته كان الماء ظاهرا"}
      - {motif: angel-says-father-and-boy-will-build-the-house, refs: ["Jāmiʿ 47:4956.1"], note: "لا تخافوا الضيعة فإن ها هنا بيت الله يبني هذا الغلام وأبوه"}
      - {motif: circling-bird-shows-travellers-water, refs: ["Jāmiʿ 47:4956.1", "Jāmiʿ 47:4958.1"], note: "فرأوا طائرا عائفا فقالوا: إن هذا الطائر ليدور على ماء"}
      - {motif: settlers-allowed-but-no-right-to-the-water, refs: ["Jāmiʿ 47:4956.1"], note: "أتأذنين لنا أن ننزل عندك؟ فقالت: نعم ولكن لا حق لكم في الماء"}
      - {motif: ishmael-learns-arabic-from-jurhum-and-marries-among-them, refs: ["Jāmiʿ 47:4956.1", "Jāmiʿ 47:4958.1"], note: "وشب الغلام وتعلم العربية منهم ... فلما أدرك زوجوه امرأة منهم"}
      - {motif: abraham-tests-sons-wives-change-the-threshold, refs: ["Jāmiʿ 47:4956.1", "Jāmiʿ 47:4958.1"], note: "نحن بشر نحن في ضيق وشدة ... وقولي له يغير عتبة بابه ... نحن بخير وسعة ... ومريه يثبت عتبة بابه"}
      - {motif: abraham-blesses-meat-and-water-of-mecca, refs: ["Jāmiʿ 47:4956.1", "Jāmiʿ 47:4958.1"], note: "ما طعامكم؟ قالت: اللحم ... الماء قال: اللهم بارك لهم في اللحم والماء ... ولم يكن لهم يومئذ حب"}
      - {motif: abraham-ishmael-raise-foundations-of-house, refs: ["Jāmiʿ 47:4956.1", "Jāmiʿ 47:4958.1"], note: "فعند ذلك رفعا القواعد من البيت فجعل إسماعيل يأتي بالحجارة وإبراهيم يبني ... ربنا تقبل منا إنك أنت السميع العليم"}
      - {motif: station-of-abraham, refs: ["Jāmiʿ 47:4956.1", "Jāmiʿ 47:4958.1"], note: "جاء بهذا الحجر فوضعه له فقام عليه وهو يبني؛ فقام على حجر المقام"}
    hints:
      - "Gen 21:14-19: bread and a skin of water (hemet), the child cast under a bush, the mother sits a bowshot away 'let me not look on the death of the child', an angel calls and God opens her eyes to a well - in the wilderness of Beersheba, not at a sacred house."
      - "Abraham's two visits to Ishmael's wives with the message about the tent: Pirqe de-R. Eliezer 30 (the first wife 'Ayesha refuses bread and water and he tells her to say 'change the tent peg'; the second, Fatima, gives bread and he tells her the peg is good)."
  - id: hadith-47-abraham-made-mecca-sacred
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Returning from Khaybar with Safiyya; Uhud loves us; Medina made sacred as Abraham made Mecca
    read: ["Jāmiʿ 47:4960.1"]
    quran: []
    tags:
      - {motif: medina-made-sacred-as-abraham-made-mecca, refs: ["Jāmiʿ 47:4960.1"], note: "اللهم إني أحرم ما بين جبليها مثل ما حرم به إبراهيم مكة اللهم بارك لهم في مدهم وصاعهم"}
      - {motif: mountain-that-loves-us, refs: ["Jāmiʿ 47:4960.1"], note: "حتى إذا بدا له أحد قال: هذا جبل يحبنا ونحبه"}
      - {motif: refuge-from-eight-afflictions, refs: ["Jāmiʿ 47:4960.1"], note: "اللهم إني أعوذ بك من الهم والحزن والعجز والكسل والبخل والجبن وضلع الدين وغلبة الرجال"}
  - id: hadith-47-kaba-short-of-abrahams-foundations
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Quraysh built the Kaba short of Abraham's foundations; the prophet would restore it but for his people's recent unbelief
    read: ["Jāmiʿ 47:4960.2"]
    quran: []
    tags:
      - {motif: kaba-rebuilt-short-of-abrahams-foundations, refs: ["Jāmiʿ 47:4960.2"], note: "إن قومك حين بنوا الكعبة اقتصروا عن قواعد إبراهيم ... لولا حدثان قومك بالكفر لفعلت"}
      - {motif: two-corners-by-the-hijr-not-touched, refs: ["Jāmiʿ 47:4960.2"], note: "ما أرى رسول الله ترك استلام الركنين اللذين يليان الحجر إلا أن البيت لم يتمم على قواعد إبراهيم"}
  - id: hadith-47-what-the-prophets-looked-like
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Abraham looks like your companion; Moses tall and curly on a red camel; Jesus ruddy as from a bath; Gabriel like Dihya; milk chosen over wine
    read: ["Jāmiʿ 47:4961.1-4961.3"]
    quran: []
    tags:
      - {motif: abraham-resembles-muhammad, refs: ["Jāmiʿ 47:4961.1", "Jāmiʿ 47:4961.2", "Jāmiʿ 47:4961.3"], note: "أما إبراهيم فانظروا إلى صاحبكم؛ وأنا أشبه ولده به؛ فإذا أقرب من رأيت به شبها صاحبكم"}
      - {motif: moses-like-a-man-of-shanua, refs: ["Jāmiʿ 47:4961.1", "Jāmiʿ 47:4961.2", "Jāmiʿ 47:4961.3"], note: "وأما موسى فرجل آدم جعد على جمل أحمر مخطوم بخلبة ... يلبي؛ كأنه من رجال شنوءة"}
      - {motif: jesus-ruddy-as-if-from-a-bath, refs: ["Jāmiʿ 47:4961.2", "Jāmiʿ 47:4961.3"], note: "فإذا ربعة أحمر كأنما خرج من ديماس يعني حماما؛ أقرب من رأيت به شبها عروة بن مسعود"}
      - {motif: gabriel-resembles-dihya, refs: ["Jāmiʿ 47:4961.3"], note: "ورأيت جبريل فإذا أقرب من رأيت به شبها دحية"}
      - {motif: milk-chosen-over-wine-is-the-fitra, refs: ["Jāmiʿ 47:4961.2"], note: "فأتيت بإناءين في أحدهما لبن وفي الآخر خمر ... فأخذت اللبن ... هديت الفطرة ... لو أخذت الخمر غوت أمتك"}
      - {motif: dajjal-has-kafir-written-between-eyes, refs: ["Jāmiʿ 47:4961.1"], note: "إنه مكتوب بين عينيه كافر"}
  - id: hadith-47-best-of-creation
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Called "best of creation", the prophet answers "that is Abraham"
    read: ["Jāmiʿ 47:4962.1"]
    quran: []
    tags:
      - {motif: abraham-the-best-of-creation, refs: ["Jāmiʿ 47:4962.1"], note: "يا خير البرية فقال رسول الله: ذاك إبراهيم"}
  - id: hadith-47-abraham-in-the-seventh-heaven
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Abraham met in the seventh heaven, his back against the frequented House (or the sixth)
    read: ["Jāmiʿ 47:4962.2-4962.4"]
    quran: []
    tags:
      - {motif: abraham-met-in-seventh-heaven, refs: ["Jāmiʿ 47:4962.2", "Jāmiʿ 47:4962.3"], note: "ثم عرج بي إلى السماء السابعة ... فإذا أنا بإبراهيم مسندا ظهره إلى البيت المعمور"}
      - {motif: frequented-house-heavenly-temple, refs: ["Jāmiʿ 47:4962.2", "Jāmiʿ 47:4962.3"], note: "فرفع لي البيت المعمور"}
      - {motif: prophets-placed-in-the-heavens, refs: ["Jāmiʿ 47:4962.4"], note: "وجد آدم في السماء الدنيا وإبراهيم في السماء السادسة"}
      - {motif: gatekeeper-of-heaven-asks-who-is-with-you, refs: ["Jāmiʿ 47:4962.2", "Jāmiʿ 47:4962.3"], note: "فاستفتح جبريل فقيل من هذا قال: جبريل قيل: ومن معك؟"}
