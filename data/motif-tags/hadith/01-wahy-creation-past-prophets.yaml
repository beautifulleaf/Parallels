    read: ["Jāmiʿ 47:4933.1"]
    quran: []
    tags:
      - {motif: dying-adam-craves-fruit-of-paradise, refs: ["Jāmiʿ 47:4933.1"], note: "أي بني إني أشتهي من ثمار الجنة فذهبوا يطلبون له"}
      - {motif: angels-come-with-shroud-spices-and-spades, refs: ["Jāmiʿ 47:4933.1"], note: "فاستقبلتهم الملائكة ومعهم أكفانه وحنوطه ومعهم الفؤوس والمساحي والمكاتل ... ارجعوا فقد قضي قضاء أبيكم"}
      - {motif: adam-pushes-eve-away-at-death, refs: ["Jāmiʿ 47:4933.1"], note: "فلما رأتهم حواء عرفتهم فلاذت بآدم فقال: إليك إليك عني فإني إنما أوتيت من قبلك"}
      - {motif: angels-bury-adam-as-model-for-his-sons, refs: ["Jāmiʿ 47:4933.1"], note: "فقبضوه وغسلوه وكفنوه وحنطوه وحفروا له وألحدوا له وصلوا عليه ... يا بني آدم هذه سنتكم"}
    hints:
      - "Close match: Life of Adam and Eve - Seth and Eve sent to paradise for the oil of mercy are turned back by Michael, Adam dies (Vita 36-44); angels wrap and bury Adam and tell Seth 'bury every man who dies like this' (Apocalypse of Moses 40-43). Adam blaming Eve 'what have you done?' (Apoc. Mos. 14, 21)."
      - "The compiler himself notes that Ubayy b. Kaʿb took this from the books of the People of the Book; it is mawquf on Ubayy."
