    note: لأُعْطِيَنَّ هَذِهِ الرَّايَةَ غَدًا رَجُلًا، يَفْتَحُ اللَّهُ عَلَى يَدَيْهِ، يُحِبُّ اللَّهَ وَرَسُولَهُ
  - motif: spittle-heals-sore-eyes
    refs:
    - Jāmiʿ 48:5413.3
    - Jāmiʿ 48:5414.1
    - Jāmiʿ 48:5416.1
    note: فَبَصَقَ رَسُولَ اللَّهِ ﷺ فِي عَيْنَيْهِ، وَدَعَا لَهُ، فَبَرَأَ حَتَّى كَأَنْ لَمْ يَكُنْ بِهِ وَجَعٌ
  - motif: one-guided-better-than-red-camels
    refs:
