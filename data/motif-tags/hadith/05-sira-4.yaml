    - Jāmiʿ 48:5392.1
    note: لقد وفدت على الملوك، ووفدت على قيصر وكسرى والنجاشي
  - motif: sacrificial-animals-sent-to-meet-envoy
    refs:
    - Jāmiʿ 48:5387.3
    - Jāmiʿ 48:5392.1
    note: هذا فلان، وهو من قوم يعظمون البدن، فابعثوها له / هذا من قوم يتألهون، فابعثوا الهدي في وجهه
  - motif: invocation-bismika-allahumma
    refs:
    - Jāmiʿ 48:5387.3
    - Jāmiʿ 48:5392.1
    note: أما الرحمن فوالله ما أدري ما هي، ولكن اكتب باسمك اللهم
  - motif: title-erased-from-treaty
    refs:
    - Jāmiʿ 48:5387.3
    - Jāmiʿ 48:5392.1
    note: 'والله إني لرسول الله وإن كذبتموني، اكتب: محمد بن عبد الله'
  - motif: son-in-chains-returned-to-father
    refs:
