    - Jāmiʿ 48:5392.1
    note: إذ دخل أبو جندل بن سهيل بن عمرو يرسف في قيوده ... هذا يا محمد أول ما أقاضيك عليه أن ترده إليّ
  - motif: is-it-a-victory
    refs:
    - Jāmiʿ 48:5387.3
    - Jāmiʿ 48:5392.1
    note: فلم نعطي الدنية في ديننا إذًا؟ ... إنِّي رسول الله، ولست أعصيه، وهو ناصري
  - motif: dispirited-army-follows-silent-example
    refs:
    - Jāmiʿ 48:5387.3
    - Jāmiʿ 48:5392.1
    note: فوالله ما قام منهم رجل حتَّى قال ذلك ثلاث مرات ... اخرج لا تكلم أحدًا منهم كلمة، حتَّى تنحر بدنك، وتدعو حالقك
  - motif: returned-convert-kills-escort
    refs:
    - Jāmiʿ 48:5387.3
    note: أرني أنظر إليه، فأمكنه منه، فضربه حتَّى برد
  - motif: fugitive-band-raids-caravans
    refs:
