  - motif: treasure-of-paradise-la-hawla
    refs:
    - Jāmiʿ 48:5413.1
    note: أَلَا أَدُلُّكَ عَلَى كَلِمَةٍ مِنْ كَنْزٍ مِنْ كُنُوزِ الْجَنَّةِ؟ ... لَا حَوْل وَلَا قُوَّةَ إِلَّا بِاللَّهِ
  hints:
  - 'Calling loudly to a god as if he were far or asleep, contrasted with one who hears: 1 Kgs 18:27 (Elijah: ''cry aloud ... perhaps he is asleep'') against ''you call no deaf or absent one''.'
- id: hadith-48-banner-to-ali
  tradition: islam
  corpus: hadith
