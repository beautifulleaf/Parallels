    note: 'مَنْ أَبُوكُمْ؟ قَالُوا: فُلَانٌ، فَقَالَ: كَذَبْتُمْ، بَلْ أَبُوكُمْ فُلَانٌ'
  - motif: jews-say-fire-only-a-few-days
