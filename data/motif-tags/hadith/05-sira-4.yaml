    note: بات أبو أيوب على باب النَّبِيّ ﷺ ... ومع أبي أيوب السيف ... وكنت قتلت أباها، وأخاها وزوجها، فلم آمنها عليك
  - motif: daughter-of-aaron-niece-of-moses
    refs:
    - Jāmiʿ 48:5433.2
    note: وإنك لابنة نبي، وإن عمك لنبي، وإنك لتحت نبي
  hints:
  - 'A captive woman taken in war and married: Deut 21:10-13 (the captive woman''s month of mourning before marriage).'
