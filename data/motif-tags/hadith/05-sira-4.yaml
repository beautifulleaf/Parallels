    - Jāmiʿ 48:5385.1
    note: 'إِنَّمَا خرَجُوا هَرَبًا مِنَ الرِّقِّ ... وَأَبَى أَنْ يَرُدَّهُمْ وَقَالَ: "هُمْ عُتَقَاءُ اللَّهِ"'
  hints:
  - 'Refusal to hand back slaves who fled to him: Deut 23:16-17 (MT; 23:15-16 Eng.), ''You shall not give up to his master a slave who has escaped to you''.'
