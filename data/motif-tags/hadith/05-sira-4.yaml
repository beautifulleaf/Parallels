  - motif: wedding-feast-of-hays-on-mat
    refs:
    - Jāmiʿ 48:5431.1
    - Jāmiʿ 48:5432.2
    - Jāmiʿ 48:5432.3
    note: وَبَسَطَ نِطَعًا ... بالأقط ... بِالتَّمْرِ ... بِالسَّمْنِ، فَحَاسُوا حَيْسًا، فَكَانَتْ وَليمَةَ رَسُولِ اللَّهِ ﷺ
  - motif: knee-as-stirrup
    refs:
    - Jāmiʿ 48:5432.2
    note: فَيَضَعُ رُكْبَتَهُ، وَتَضَعُ صَفِيَّةُ رِجْلَهَا عَلَى رُكْبَتِهِ حَتَّى تَرْكَبَ
  - motif: fall-from-camel-shielded
    refs:
