    note: فَوَاللَّهِ لأَنْ يَهْدِيَ اللَّهُ بِكَ رَجُلًا وَاحِدًا خَيْرٌ لَكَ مِنْ أَنْ يَكُونَ لَكَ حُمْرُ النَّعَمِ
  - motif: duel-rajaz-marhab-haydara
    refs:
    - Jāmiʿ 48:5416.1
    note: أنا الذي سمتني أمي حيدره ... كليث الغابات كريه المنظره ... فضرب رأس مرحب فقتله
  - motif: own-sword-rebounds-two-rewards
    refs:
    - Jāmiʿ 48:5416.1
    note: فرجع سيفه على نفسه. فقطع أكحله ... بل له أجره مرتين
  hints:
  - 'Healing sight with spittle: Mark 8:23 and John 9:6 (Jesus spits on or makes clay for the blind man''s eyes).'
- id: hadith-48-khaybar-sharecropping-and-expulsion
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Khaybar worked for half; Huyayy's treasure; expulsion under Umar
  read:
  - Jāmiʿ 48:5417.1-5420.1
  quran: []
  tags:
  - motif: land-worked-for-half-the-crop
    refs:
    - Jāmiʿ 48:5417.1
    - Jāmiʿ 48:5418.1
    - Jāmiʿ 48:5418.2
    - Jāmiʿ 48:5419.1
    note: عامل النَّبِيّ ﷺ خيبر بشطر ما يخرج منها ... نقركم بها على ذلك ما شئنا
  - motif: jews-expelled-to-tayma-and-jericho
    refs:
    - Jāmiʿ 48:5418.2
    - Jāmiʿ 48:5418.3
    - Jāmiʿ 48:5419.1
    - Jāmiʿ 48:5420.1
    note: حتَّى أجلاهم عمر إلى تيماء وأريحاء ... ففدعت يداه ورجلاه
  - motif: expulsion-foretold-camel-by-night
    refs:
    - Jāmiʿ 48:5418.3
    note: كيف بك إذا أخرجت من خيبر تعدو بك قلوصك ليلة بعد ليلة ... كانت هذه هُزَيلة من أبي القاسم
  - motif: hidden-treasure-found-in-ruin
    refs:
    - Jāmiʿ 48:5419.1
    note: ما فعل مسك حيي ... قد رأيت حييا يطوف في خربة ها هنا ... فوجدوا المسك في الخربة
  - motif: assessor-refuses-bribe
    refs:
    - Jāmiʿ 48:5419.1
    note: تطعموني السحت ... ولأنتم أبغض إلي من عدتكم من القردة والخنازير ... بهذا قامت السموات والأرض
  - motif: dream-moon-falls-in-lap
    refs:
    - Jāmiʿ 48:5419.1
    note: 'بعيني صفية خضرة ... فرأيت كأن قمرًا وقع في حجري ... فلطمني وقال: تمنين ملك يثرب؟'
  - motif: wives-allotment-hundred-wasq
    refs:
    - Jāmiʿ 48:5419.1
    note: يعطي كل امرأة من نسائه ثمانين وسقًا من تمر كل عام وعشرين وسقًا من شعير
  hints:
  - 'A woman''s dream of a heavenly body falling to her, read by a hostile kinsman as a claim to kingship: Gen 37:9-10 (Joseph''s sun, moon and stars; his father rebukes him).'
