    note: وَيَرْجِعُ ذُبَابُ سَيْفِهِ، فَأَصَابَ عَيْنَ رُكْبَةِ عَامِرٍ ... إِنَّ لَهُ لأَجْرَيْنِ - وَجَمَعَ بَيْنَ إِصْبَعَيْهِ
