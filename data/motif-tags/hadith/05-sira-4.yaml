new_motifs:
  mother-told-of-rumour-faints-with-fever:
    label: A woman hearing that the slander about her has reached the prophet and her father falls fainting and wakes with shivering fever (humma bi-nafid)
    cluster: sira
  accused-wife-likens-herself-to-jacob:
    label: The accused wife says her case and her accusers' is that of Jacob and his sons, and quotes 'beautiful patience' (Q 12:18)
    cluster: sira
  acquitted-wife-praises-god-not-husband:
    label: Told of her acquittal, the wife says she praises God alone, not anyone, not even the prophet
    cluster: sira
  blindness-as-the-great-punishment:
    label: Asked why the slanderer may visit her, Aisha says no punishment is greater than blindness (al-'ama), which he suffered
    cluster: sira
  poet-draws-lineage-like-hair-from-dough:
    label: The poet promises to draw the prophet out of the enemy's shared lineage as a hair is drawn from dough before satirizing them
    cluster: sira
  marriage-frees-captive-tribe:
    label: 'When the prophet pays a captive woman''s contract and marries her, the people free their captives of her tribe as his in-laws: a hundred households'
    cluster: sira
  slanderers-flogged-after-acquittal:
    label: After the acquittal is revealed and recited from the pulpit, the two men and the woman who spread the slander are flogged the fixed penalty
    cluster: law
  one-who-took-the-greater-part:
    label: The slander's chief instigator is named as the one 'who took upon himself the greater part' of it (tawalla kibrahu)
    cluster: sira
  age-fifteen-admitted-to-battle:
    label: A boy of fourteen is refused for battle and accepted at fifteen
    cluster: law
  restrained-word-to-avoid-bloodshed:
    label: A companion untied his garment to answer a rival's claim to rule but held back the word lest it split the community and shed blood, recalling paradise instead
    cluster: ethics
  enemy-came-from-above-and-below:
    label: '''When they came at you from above you and below you and eyes swerved and hearts reached the throats'' is said to be the day of the Trench'
    cluster: sira
  spy-sent-into-enemy-camp-at-night:
    label: On a freezing night the leader asks three times who will bring news of the enemy; the one named goes into the enemy camp, sees its chief, and returns
    cluster: warfare
  messenger-walks-as-in-warm-bath:
    label: Sent out in bitter cold, the messenger walks as though in a hot bath (ka-annama amshi fi hammam) going and returning
    cluster: sira
  spy-forbears-to-shoot-enemy-chief:
    label: The spy sets an arrow to his bow to shoot the enemy chief warming his back at a fire but refrains because he was told not to alarm them
    cluster: warfare
  covered-with-the-prophets-cloak:
    label: The prophet covers a returning companion with the surplus of the cloak he prays in
    cluster: sira
  women-and-children-in-towers:
    label: During the siege women and children are placed in the fortified towers (atam)
    cluster: warfare
  enemy-demands-half-the-dates:
    label: A desert chief demands half of the city's date crop or he will fill it with horse and men; the leader consults the chiefs, who refuse
    cluster: sira
  poets-tongue-would-mix-the-sea:
    label: 'The enemy begs the prophet to restrain his poet''s tongue: mixed into the sea''s water it would mix all of it'
    cluster: sira
  trench-dug-by-the-community:
    label: The emigrants and helpers dig the trench around the city and carry the earth on their backs on a cold morning, having no slaves to do it
    cluster: warfare
  no-life-but-the-life-hereafter:
    label: The prophet chants 'O God, there is no life but the life of the hereafter; forgive the Helpers and the Emigrants' while they dig
    cluster: sira
  workers-answer-with-oath-of-allegiance:
    label: 'The diggers answer: ''We are those who pledged to Muhammad to fight (or: on Islam) as long as we live'''
    cluster: sira
  rancid-fat-for-hungry-diggers:
    label: Hungry diggers are fed a handful of barley cooked with stale rancid fat (ihala sanikha) that sticks in the throat and stinks
    cluster: sira
  prophet-carries-earth-dust-covers-chest:
    label: The prophet carries earth until the dust covers the hair of his chest
    cluster: sira
  rajaz-without-god-we-would-not-be-guided:
    label: 'Rajaz: ''O God, without you we would not have been guided, nor given alms nor prayed; send down calm upon us and make our feet firm'''
    cluster: sira
  ammar-to-be-killed-by-rebel-party:
    label: Seeing Ammar, the prophet says the rebellious party (al-fi'a al-baghiya) will kill him
    cluster: prophecy
  small-meal-feeds-the-army:
    label: A householder's small meal (a sa' of barley and one young goat) feeds the whole army of a thousand; the pot still boils and the dough is still baked as before
    cluster: miracle
  prophet-spits-into-dough-and-pot:
    label: The prophet spits into the dough and into the cooking pot and blesses them
    cluster: miracle
  stone-tied-on-belly-for-hunger:
    label: The prophet stands with a stone bound over his belly; they had tasted nothing for three days
    cluster: sira
  hard-rock-turned-to-sand-by-pick:
    label: A rock the diggers cannot break crumbles into flowing sand (kathib ahyal) under the prophet's pickaxe
    cluster: miracle
  three-strikes-flash-and-show-cities:
    label: Three blows on the rock each break off a third and flash; in each flash the prophet sees the cities of Kisra, of Caesar and of Abyssinia
    cluster: prophecy
  leave-abyssinians-and-turks-alone:
    label: Leave the Abyssinians alone as long as they leave you alone, and the Turks as long as they leave you
    cluster: warfare
  volunteer-guard-lets-prophet-sleep:
    label: Sleepless, the prophet wishes for a righteous man to guard him; Sa'd comes armed, and the prophet sleeps until he snores
    cluster: sira
  each-prophet-has-a-hawari:
    label: '''Every prophet has a disciple (hawari), and my disciple is al-Zubayr'' after he volunteers three times'
    cluster: prophecy
  prayer-to-rout-the-confederates:
    label: '''O God, revealer of the Book, swift in reckoning, defeat the confederates; defeat them and shake them'''
    cluster: prayer
  fill-their-houses-and-graves-with-fire:
    label: 'The prophet curses the besiegers: may God fill their houses and graves with fire for keeping us from the middle prayer until sunset'
    cluster: sira
  afternoon-prayer-prayed-after-sunset:
    label: Kept by fighting, the prophet prays the afternoon prayer after sunset and then the sunset prayer
    cluster: ritual
  prayer-cover-our-nakedness:
    label: 'Asked for words in extremity: ''O God, cover our nakedness and make our fears safe''; God routed them with the wind'
    cluster: prayer
  god-alone-routed-the-confederates:
    label: 'Formula: ''He made his host mighty, helped his servant, and defeated the confederates alone (wahdahu)'''
    cluster: prayer
  returning-travellers-formula:
    label: Returning from war or pilgrimage the prophet says takbir three times and 'returning, worshipping, prostrating, praising our Lord'
    cluster: ritual
  victory-by-east-wind-ad-by-west-wind:
    label: '''I was helped by the east wind (saba), and ''Ad was destroyed by the west wind (dabur)'''
    cluster: cosmology
  now-we-raid-them:
    label: 'After the confederates withdraw: ''Now we raid them and they do not raid us; we march to them'''
    cluster: prophecy
  angel-has-not-laid-down-arms:
    label: When the prophet has laid down his weapons and bathed, Gabriel comes, dust on him, saying the angels have not laid theirs down, and points to Qurayza
    cluster: sira
  dust-of-gabriels-cavalcade:
    label: The dust rising in a street is the cavalcade (mawkib) of Gabriel as the prophet rides out
    cluster: sira
  angel-taken-for-dihya:
    label: Asked who passed by, people say Dihya al-Kalbi, whose beard and face resembled Gabriel's
    cluster: sira
  pray-afternoon-only-at-qurayza:
    label: No one is to pray the afternoon prayer except at Qurayza; some pray on the road, others wait until after sunset, and neither group is blamed
    cluster: law
  gabriel-with-the-satirist:
    label: '''Satirize them, and Gabriel is with you'' (to the poet Hassan)'
    cluster: sira
  arbiter-judges-men-killed-women-captive:
    label: 'The arbiter rules: their fighting men killed, women and children taken captive, property divided; the prophet: ''you have judged with God''s judgment'''
    cluster: law
  stand-for-your-master:
    label: As the wounded arbiter arrives on a donkey the prophet tells the Helpers 'Stand for your master'
    cluster: sira
  wound-reopens-at-the-prayer:
    label: 'The wounded man prays: if war remains keep me for it, else let it burst; his wound bursts and blood flows into the neighbouring tent'
    cluster: sira
  wound-cauterized-twice:
    label: The prophet cauterizes the severed vein with an arrowhead (mishqas, or with fire); it swells and he cauterizes it a second time
    cluster: medicine
  life-held-until-eye-cooled:
    label: '''Do not take my soul until my eye is cooled by Qurayza'': the vein stops bleeding until the judgment, then bursts and he dies'
    cluster: sira
  weeping-of-two-friends-distinguished:
    label: Aisha could tell Umar's weeping from Abu Bakr's from her room; the prophet's eye shed no tears but he would grip his beard
    cluster: sira
  gesture-it-is-slaughter:
    label: 'The besieged consult a former ally, who points to his throat: it is slaughter'
    cluster: sira
  pubic-hair-test-for-execution:
    label: 'Captives are inspected: whoever has grown pubic hair is killed, whoever has not is spared'
    cluster: law
  woman-laughs-before-execution:
    label: The one woman of Qurayza executed laughs and chats until her name is called; she goes knowing she will be killed
    cluster: sira
  four-hundred-executed:
    label: The men of Qurayza killed were four hundred
    cluster: sira
  jews-of-medina-expelled:
    label: Al-Nadir are exiled, Qurayza first spared then killed; then all the Jews of Medina are expelled, Qaynuqa' and the rest
    cluster: sira
  gifts-of-palms-returned:
    label: After Qurayza and Nadir the prophet returns the palms the helpers had given him; Umm Ayman refuses until given ten times as much
    cluster: sira
  captive-tied-to-mosque-pillar-three-days:
    label: A captured chief is tied to a pillar of the mosque and asked each day for three days 'What have you, Thumama?' then released
    cluster: sira
  convert-bathes-then-testifies:
    label: Released, the captive goes to palms near the mosque, bathes, and pronounces the testimony
    cluster: ritual
  most-hated-face-becomes-most-loved:
    label: '''No face on earth was more hateful to me than yours; now it is the dearest'' (also of the religion and the town)'
    cluster: sira
  grain-embargo-until-prophet-permits:
    label: '''Not a grain of wheat will come to you from Yamama until the prophet permits it'''
    cluster: sira
  fear-prayer-in-two-rows:
    label: 'Facing an enemy in the qibla direction, the army prays in two rows: all bow, one row prostrates while the other stands guard, then they change places'
    cluster: ritual
  enemy-plans-attack-during-prayer:
    label: The enemy says a prayer is coming that is dearer to them than their children and selves; Gabriel brings the verses of the fear prayer between noon and afternoon
    cluster: ritual
  army-reduced-to-one-date-a-day:
    label: An army of three hundred pools its provisions until each gets one date a day, sucked like a child and followed by water; then they eat leaves (khabat)
    cluster: sira
  sea-casts-up-great-beast:
    label: The sea casts up a beast called al-'anbar like a large dune; the army eats from it for weeks
    cluster: miracle
  carcass-permitted-in-necessity:
    label: 'The commander first calls the beached animal carrion (mayta), then permits it: we are God''s messengers'' envoys and in need'
    cluster: law
  rib-arch-camel-rider-passes-under:
    label: Two ribs of the beast are set up as an arch and the tallest camel with its rider passes beneath without touching
    cluster: sira
  men-sit-in-eye-socket:
    label: Thirteen men sit inside the beast's eye socket; fat is ladled out with jars
    cluster: sira
  sustenance-god-brought-out:
    label: '''It is sustenance God brought out for you; have you any of its meat to feed us?'' and the prophet eats of it'
    cluster: law
  man-slaughters-camels-three-by-three:
    label: A man slaughters three camels, then three, then three for the hungry army until forbidden
    cluster: sira
  turban-tail-four-fingers:
    label: The prophet unwinds a black turban, winds it himself and lets a tail of four fingers hang behind
    cluster: ritual
  rules-of-the-raid:
    label: 'Raid in God''s name: do not steal from spoils, do not betray, do not mutilate, do not kill a child'
    cluster: law
  herdsmen-cured-by-camel-milk-and-urine:
    label: Desert people sick in the town are sent to the herd to drink the camels' milk and urine; recovered, they kill the herdsman and drive off the camels
    cluster: sira
  raiders-eyes-branded-hands-cut:
    label: The raiders' eyes are branded with heated nails, hands (and feet) cut, and they are left in the lava field until they die
    cluster: law
  four-umras-in-dhul-qada:
    label: 'The prophet made four umras, all in Dhu l-Qa''da except the one with his hajj: Hudaybiya, the next year, al-Ji''rana, and with the hajj'
    cluster: ritual
  garlanding-and-marking-sacrificial-animals:
    label: At Dhu l-Hulayfa the prophet garlands and marks (ish'ar) the sacrificial animals and enters ihram for umra
    cluster: ritual
  blocked-pilgrim-sacrifices-and-shaves:
    label: Kept from the House, the prophet slaughters his sacrificial animals and shaves; his companions shave or cut short
    cluster: ritual
  mountain-pass-forgives-like-israel:
    label: Whoever climbs the pass of al-Murar has his sins put down as was put down from the Israelites; the pass is like the gate they were told to enter
    cluster: prophecy
  rain-by-mercy-or-by-star:
    label: '''Some of my servants rose believing, some disbelieving: who said we had rain by God''s mercy believes in me; who said by such a star believes in the stars'''
    cluster: theology
  spittle-in-dry-well-makes-it-gush:
    label: At the drained well the prophet sits on its rim, rinses his mouth or spits into it, or puts an arrow in it; it gushes for 1,400 men and their mounts
    cluster: miracle
  water-flows-from-between-fingers:
    label: The prophet puts his hand in a small leather vessel and water flows from between his fingers like springs; 1,500 drink and make ablution
    cluster: miracle
  people-of-the-tree-enumerated:
    label: 'Numbers at the pledge: 1,300, 1,400 or 1,500; Aslam one eighth of the emigrants'
    cluster: sira
  righteous-depart-chaff-remains:
    label: The righteous depart one after another and a dregs remains like chaff of barley or dates; God does not care for them at all
    cluster: eschatology
  tree-forgotten-next-year:
    label: Those who pledged under the tree could not find it the next year; the later generation claims to know it better
    cluster: sira
  tree-cut-down-by-umar:
    label: People came to pray at the tree of the pledge; Umar threatened them and had it cut down
    cluster: ritual
  do-not-light-fires-at-night:
    label: '''Do not light fires at night'' at Hudaybiya; afterwards ''light and cook, no people after you will reach your sa'' and mudd'''
    cluster: sira
  leftover-provisions-blessed-on-mat:
    label: Leftover provisions are heaped on a leather mat; the prophet prays over it, all fill their vessels, and he testifies he is God's messenger
    cluster: miracle
  pledge-unto-death:
    label: At Hudaybiya they pledged 'unto death'; a companion later refuses such a pledge to anyone after the prophet
    cluster: sira
  none-of-the-tree-enters-fire:
    label: None of those who pledged under the tree will enter the fire; to the objection 'every one of you will come to it' (Q 19:71) he answers with Q 19:72
    cluster: eschatology
  best-people-on-earth:
    label: '''You are the best people on earth'' to the 1,400 of Hudaybiya'
    cluster: sira
  prophets-hand-for-absent-man:
    label: The prophet holds up his right hand 'this is Uthman's hand' and strikes it on his other hand for the absent envoy
    cluster: ritual
  pledge-taken-three-times:
    label: Salama pledges at the start, middle and end of the crowd; the prophet gives him a shield, which he passes to his unarmed uncle
    cluster: sira
  hypocrite-hides-under-camel:
    label: All pledged except al-Jadd b. Qays, who hid under his camel's belly
    cluster: sira
  escaped-slaves-are-gods-freedmen:
    label: 'Masters ask for slaves who came over; the prophet refuses: ''They are God''s freedmen'' (utaqa'' Allah)'
    cluster: law
  attackers-blinded-by-prayer:
    label: Thirty armed youths rush the camp; the prophet prays and God takes their sight; they are seized and released
    cluster: miracle
  invocation-bismika-allahumma:
    label: 'The Meccan envoy rejects ''In the name of God the Merciful, the Compassionate'': ''we do not know al-Rahman''; it is written ''In your name, O God'''
    cluster: treaty
  title-erased-from-treaty:
    label: '''Muhammad the messenger of God'' is struck from the document and replaced with ''Muhammad son of Abd Allah''; the prophet erases it with his own hand'
    cluster: treaty
  treaty-entry-next-year-three-days:
    label: 'Terms: they return this year; next year they enter for three days with only sheathed swords (julban al-silah)'
    cluster: treaty
  camel-halted-by-who-halted-the-elephant:
    label: The prophet's camel kneels at the pass; 'she has not balked, it is not her nature; he who held back the elephant held her back'
    cluster: sira
  envoy-grasps-prophets-beard:
    label: The enemy envoy grasps the prophet's beard as he speaks; a guard strikes his hand with the sword's scabbard tip
    cluster: sira
  followers-catch-spittle-and-ablution-water:
    label: 'The envoy reports: his spittle falls only into a man''s hand who rubs it on face and skin; they almost fight over his ablution water'
    cluster: sira
  envoy-compares-kings-courts:
    label: '''I have visited Caesar, Kisra and the Negus; I never saw a king honoured by his people as Muhammad by his'''
    cluster: sira
  sacrificial-animals-sent-to-meet-envoy:
    label: For a man of a tribe that reveres sacrificial animals, the garlanded animals are sent toward him; he returns saying they must not be barred
    cluster: ritual
  son-in-chains-returned-to-father:
    label: The envoy's own son comes shackled, having escaped, and is returned to him under the just-agreed terms
    cluster: treaty
  dispirited-army-follows-silent-example:
    label: Three times told to slaughter and shave, no one rises; on Umm Salama's advice the prophet does it without a word and they all follow
    cluster: sira
  returned-convert-kills-escort:
    label: A returned convert admires an escort's sword, takes it and kills him; the other flees to Medina
    cluster: sira
  fugitive-band-raids-caravans:
    label: The returned converts gather on the coast and attack every Meccan caravan until Mecca asks the prophet to receive them
    cluster: sira
  ten-year-truce-terms:
    label: 'Truce: no war for ten years, a closed bag between us (no theft, no treachery), each may join either side''s pact'
    cluster: treaty
  is-it-a-victory:
    label: Umar objects 'why accept humiliation in our religion?'; when the Victory sura comes he asks 'Is it a victory?' – 'Yes'
    cluster: sira
  doubt-your-own-opinion:
    label: '''Suspect your opinion: on the day of Abu Jandal I would have rejected the prophet''s order if I could'''
    cluster: ethics
  sura-dearer-than-all-under-sun:
    label: After Umar asks three times unanswered, a sura is revealed 'dearer to me than all on which the sun rises'
    cluster: revelation
  you-have-mastered-so-be-gentle:
    label: '''You have prevailed, so be gentle'' (malakta fa-asjih) to the man who recovered the camels'
    cluster: ethics
  lone-archer-recovers-herd:
    label: Calling 'Ya sabahah' three times from a hill, a runner pursues raiders alone with arrows and rajaz 'I am Ibn al-Akwa', today is the day of the base-born'
    cluster: sira
  khaybar-promised-on-the-way-back:
    label: 'The Victory sura, revealed on the way back, gave him Khaybar: ''God promised you much booty and hastened this'''
    cluster: sira
  reciting-the-measurers:
    label: Hearing 'Woe to the stinters' in the dawn prayer, a man thinks of one who measures full for himself and short for others
    cluster: ethics
  rinse-mouth-after-food-no-ablution:
    label: After eating parched barley (sawiq) the prophet rinses his mouth and prays without renewing ablution
    cluster: ritual
  camel-song-and-mercy-means-martyrdom:
    label: The prophet says 'May God have mercy on him' to a man singing to the camels; 'it became due' – he was killed
    cluster: sira
  donkey-meat-pots-broken-or-washed:
    label: 'Pots of domestic donkey meat: ''Pour it out and break them'' – ''or pour and wash?'' – ''or that''; donkey meat is filth (rijs)'
    cluster: law
  own-sword-rebounds-two-rewards:
    label: 'A man''s own short sword rebounds on his knee and kills him; people say his deed is void, the prophet: he has two rewards'
    cluster: sira
  accursed-morning-of-the-warned:
    label: 'Seeing the town: ''God is greatest, Khaybar is ruined; when we descend on a people''s yard, evil is the morning of the warned'''
    cluster: warfare
  muhammad-and-the-army-five:
    label: Workers coming out with spades and baskets cry 'Muhammad and the khamis (army)!'
    cluster: sira
  you-call-no-deaf-one:
    label: '''Go easy: you call no deaf or absent one; you call one who hears and is near'''
    cluster: theology
  treasure-of-paradise-la-hawla:
    label: '''There is no power and no strength save in God'' is a treasure of the treasures of paradise'
    cluster: prayer
  banner-to-the-man-god-loves:
    label: '''Tomorrow I will give the banner to a man who loves God and his messenger and whom they love''; all hope for it'
    cluster: sira
  spittle-heals-sore-eyes:
    label: The prophet spits into the sore eyes of Ali and he is cured as if he had no pain
    cluster: miracle
  one-guided-better-than-red-camels:
    label: '''That God guides one man by you is better than red camels'''
    cluster: ethics
  duel-rajaz-marhab-haydara:
    label: Marhab boasts 'Khaybar knows I am Marhab'; Ali answers 'I am the one my mother named Haydara, like the lion of the thickets' and kills him
    cluster: warfare
  land-worked-for-half-the-crop:
    label: The conquered farmers stay on the land for half the produce of fruit and grain, 'we let you stay as long as we wish'
    cluster: law
  hidden-treasure-found-in-ruin:
    label: A chief's leather bag of treasure, said to be spent, is found in a ruin where he had been seen walking
    cluster: sira
  assessor-refuses-bribe:
    label: 'The crop assessor refuses a bribe: ''I hate you more than apes and pigs, yet this will not make me unjust''; ''by this heavens and earth stand'''
    cluster: ethics
  dream-moon-falls-in-lap:
    label: A bride dreams a moon fell into her lap; her husband strikes her, 'you wish for the king of Yathrib'; the green bruise is still on her eye
    cluster: dream
  expulsion-foretold-camel-by-night:
    label: Umar recalls the prophet telling a Khaybar Jew 'how will it be when you are driven from Khaybar, your young camel running with you night after night'; the man calls it a jest
    cluster: prophecy
  envoy-held-rumour-of-death:
    label: The envoy sent to Mecca is detained there and word reaches the prophet that he has been killed
    cluster: sira
  council-whether-to-raid-families:
    label: 'Told the enemy has gathered to bar him, the prophet asks counsel whether to fall on their families; Abu Bakr: you came for the House, not to kill; ''go on in God''s name'''
    cluster: sira
  jews-expelled-to-tayma-and-jericho:
    label: Umar expels the Jews from Khaybar to Tayma and Ariha after Ibn Umar's hands are dislocated
    cluster: sira
  horse-gets-two-shares:
    label: Of the spoils the horse receives two shares and the foot soldier one
    cluster: law
  hashim-and-muttalib-one-thing:
    label: Banu Hashim and Banu l-Muttalib are one thing; the other branches get nothing of the fifth
    cluster: law
  land-kept-as-treasury-for-later:
    label: 'Umar: but for leaving the last people destitute I would divide every conquered village; I leave it as a treasury'
    cluster: law
  khaybar-in-thirty-six-shares:
    label: Khaybar is divided in two halves, one for the prophet's needs and one for the Muslims in eighteen shares
    cluster: law
  we-are-not-inherited:
    label: '''We are not inherited; what we leave is alms'' – Fatima''s claim is refused and she shuns Abu Bakr'
    cluster: law
  two-emigrations-for-the-ship:
    label: The people of the ship who went to Abyssinia have two emigrations; the others one
    cluster: sira
  weasel-from-mountain-top:
    label: A rival scorns Abu Hurayra as a wabr come down from the mountain top
    cluster: sira
  slave-given-goods-not-share:
    label: A slave at Khaybar is girded with a sword he drags; he is given household goods but no share, and told to keep part of his charm (ruqya)
    cluster: law
  pots-overturned-each-ten-a-sheep:
    label: 'Pots cooking looted meat are overturned and the meat divided: one sheep to every ten'
    cluster: law
  newborn-given-a-share:
    label: A woman and her newborn daughter are given a share at Khaybar
    cluster: law
  small-food-taken-as-needed:
    label: Food at Khaybar was not divided into fifths; each took what he needed
    cluster: law
  now-we-will-eat-our-fill-of-dates:
    label: '''Now we will have our fill of dates'' – ''we were never full until Khaybar'''
    cluster: sira
  manumission-as-dowry:
    label: The captive is freed and married; her dowry is her freedom
    cluster: law
  wedding-feast-of-hays-on-mat:
    label: A leather mat is spread, each brings dates, curd or butter, and the hays made of them is the wedding feast
    cluster: ritual
  veiling-shows-wife-not-concubine:
    label: If he veils her she is his wife, if not a slave-mother; he veils her and seats her behind him
    cluster: law
  knee-as-stirrup:
    label: The prophet sets his knee for the bride to step on and mount the camel
    cluster: sira
  fall-from-camel-shielded:
    label: The camel stumbles; both fall; the prophet rises and screens her as the women watch
    cluster: sira
  guard-at-wedding-door:
    label: A companion guards the prophet's door all night with a sword, fearing the bride whose father, brother and husband were killed
    cluster: sira
  daughter-of-aaron-niece-of-moses:
    label: '''You are the daughter of a prophet, your uncle is a prophet, and you are under a prophet'' to Safiyya mocked as a Jew''s daughter'
    cluster: sira
  wives-allotment-hundred-wasq:
    label: 'Each wife received a hundred wasq a year: eighty of dates and twenty of barley; under Umar they chose land and water or the allotment'
    cluster: law
  poisoned-sheep-test-of-prophethood:
    label: 'A poisoned sheep is given; asked why, they say: if you are a liar we are rid of you, if a prophet it will not harm you'
    cluster: sira
  jews-say-fire-only-a-few-days:
    label: Asked who the people of the fire are, they say 'we will be in it a little and you will succeed us'; he answers 'Be gone in it (ikhsa'u)'
    cluster: eschatology
  lies-about-ancestor-exposed:
    label: '''Who is your father?'' – they name one; ''you lie, it is so-and-so'' – ''you are right'''
    cluster: sira
  poison-felt-until-death:
    label: 'He feels the food eaten at Khaybar until his last illness: ''now my aorta (abhar) is severed by that poison''; he had himself cupped when he felt it'
    cluster: medicine
  three-breaths-heal-wound:
    label: The prophet breathes on a sword wound three times and it never hurts again
    cluster: miracle
  brave-fighter-of-the-fire:
    label: A man who fights hardest is declared of the fire; wounded, he kills himself with his arrows; 'God supports this religion even with a wicked man'
    cluster: sira
  permitted-lie-to-recover-wealth:
    label: A convert is allowed to say what he likes about the prophet to recover his money in Mecca; he spreads false news of defeat
    cluster: sira
  stolen-cloak-burns-in-fire:
    label: 'A slave killed by an arrow is not a martyr: the cloak he took from the spoils burns on him with fire; a returned sandal-strap is a strap of fire'
    cluster: eschatology
  none-but-believers-enter-paradise:
    label: The prophet has it proclaimed that none but believers enter paradise
    cluster: eschatology
units:
- id: hadith-48-ifk-umm-ruman-and-hassan
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Umm Ruman's faint, Aisha's Jacob saying, and Hassan's visit
  read:
  - Jāmiʿ 48:5326.1-5327.1
  quran:
  - '12:18'
  - '24:11'
  tags:
  - motif: mother-told-of-rumour-faints-with-fever
    refs:
    - Jāmiʿ 48:5326.1
    note: فَخَرَّتْ مَغْشِيًّا عَلَيْهَا، فَمَا أَفَاقَتْ إِلَّا وَعَلَيْهَا حُمَّى بِنَافِضٍ
  - motif: accused-wife-likens-herself-to-jacob
    refs:
    - Jāmiʿ 48:5326.1
    note: مَثَلِي وَمَثَلُكُمْ كَيَعْقُوبَ وَبَنِيهِ، ﴿فَصَبْرٌ جَمِيلٌ﴾
  - motif: jacob-beautiful-patience
    refs:
    - Jāmiʿ 48:5326.1
    note: '﴿فَصَبْرٌ جَمِيلٌ وَاللَّهُ الْمُسْتَعَانُ عَلَى مَا تَصِفُونَ﴾ [يوسف: ١٨]'
  - motif: acquitted-wife-praises-god-not-husband
    refs:
    - Jāmiʿ 48:5326.1
    note: بِحَمْدِ اللهِ لَا بِحَمْدِ أَحَدٍ وَلَا بِحَمْدِكَ
  - motif: blindness-as-the-great-punishment
    refs:
    - Jāmiʿ 48:5326.2
    note: وَأَيُّ عَذَابٍ أَشَدُّ مِنَ الْعَمَى؟
  - motif: poet-draws-lineage-like-hair-from-dough
    refs:
    - Jāmiʿ 48:5327.1
    note: لأَسُلَّنَّكَ مِنْهُمْ كَمَا تُسَلُّ الشَّعْرَةُ مِنَ الْعَجِينِ
- id: hadith-48-juwayriya-marriage
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Juwayriya's contract paid and the Mustaliq captives freed
  read:
  - Jāmiʿ 48:5327.2
  quran: []
  tags:
  - motif: marriage-frees-captive-tribe
    refs:
    - Jāmiʿ 48:5327.2
    note: أصهار رسول الله ﷺ! فأرسلوا ما بأيديهم ... مائة أهل بيت من بني المصطلق
- id: hadith-48-ifk-aftermath
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Who spread the slander, the flogging, and Ali's stance
  read:
  - Jāmiʿ 48:5328.1-5329.1
  quran:
  - '24:11'
  tags:
  - motif: one-who-took-the-greater-part
    refs:
    - Jāmiʿ 48:5328.1
    note: وهو الذي تولى كبره منهم هو وحمنة
  - motif: slanderers-flogged-after-acquittal
    refs:
    - Jāmiʿ 48:5328.2
    note: أمر بالرجلين والمرأة فضربوا حدهم
- id: hadith-48-khandaq-age-fifteen
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Ibn Umar refused at fourteen, admitted at fifteen
  read:
  - Jāmiʿ 48:5330.1-5330.2
  quran:
  - 33:9-10
  tags:
  - motif: age-fifteen-admitted-to-battle
    refs:
    - Jāmiʿ 48:5330.1
    note: وهو ابن أربع عشرة فلم يجزه ... وهو ابن خمس عشرة فأجازه
- id: hadith-48-ibn-umar-holds-his-word
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Ibn Umar restrains his answer to Mu'awiya
  read:
  - Jāmiʿ 48:5330.3
  quran: []
  tags:
  - motif: restrained-word-to-avoid-bloodshed
    refs:
    - Jāmiʿ 48:5330.3
    note: فحللت حبوتي ... فخشيت أن أقول كلمة تفرق بين الجمع، وتسفك الدم
- id: hadith-48-khandaq-above-and-below
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Q 33:10 said to be the day of the Trench
  read:
  - Jāmiʿ 48:5332.1
  quran:
  - '33:10'
  tags:
  - motif: enemy-came-from-above-and-below
    refs:
    - Jāmiʿ 48:5332.1
    note: ﴿إِذْ جَاءُوكُمْ مِنْ فَوْقِكُمْ وَمِنْ أَسْفَلَ مِنْكُمْ﴾ ... كان ذلك يوم الخندق
- id: hadith-48-hudhayfa-night-mission
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Hudhayfa sent into the confederates' camp on the cold night
  read:
  - Jāmiʿ 48:5332.2
  quran: []
  tags:
  - motif: spy-sent-into-enemy-camp-at-night
    refs:
    - Jāmiʿ 48:5332.2
    note: ألا رجل يأتيني بخبر القوم، جعله الله معي يوم القيامة؟ (ثلاثًا) ... قم، يا حذيفة!
  - motif: messenger-walks-as-in-warm-bath
    refs:
    - Jāmiʿ 48:5332.2
    note: جعلت كأنما أمشي في حمام
  - motif: spy-forbears-to-shoot-enemy-chief
    refs:
    - Jāmiʿ 48:5332.2
    note: فرأيت أبا سفيان يَصْلي ظهره بالنار، فوضعت سهمًا في كبد القوس ... ولا تذعرهم علي
  - motif: covered-with-the-prophets-cloak
    refs:
    - Jāmiʿ 48:5332.2
    note: فألبسني رسول الله ﷺ من فضل عباءة كانت عليه يصلي فيها ... قم، يا نومان!
  hints:
  - 'A man sent alone into the enemy camp at night to learn its state, and returning unharmed: 1 Sam 26:6-12 (David and Abishai in Saul''s camp) and Judg 7:9-15 (Gideon goes down to the Midianite camp).'
- id: hadith-48-women-in-the-towers
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Children kept with the women in Hassan's tower
  read:
  - Jāmiʿ 48:5334.1
  quran: []
  tags:
  - motif: women-and-children-in-towers
    refs:
    - Jāmiʿ 48:5334.1
    note: كنت أنا وعمر بن أبي سلمة يوم الخندق مع النسوة في أطم حسّان
- id: hadith-48-ghatafan-asks-half-dates
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Al-Harith demands half the dates; Hassan's verses
  read:
  - Jāmiʿ 48:5335.1
  quran: []
  tags:
  - motif: enemy-demands-half-the-dates
    refs:
    - Jāmiʿ 48:5335.1
    note: ناصفنا تمر المدينة، وإلا ملأناها عليك خيلًا ورجالًا ... حتى أستأمر السعود
  - motif: poets-tongue-would-mix-the-sea
    refs:
    - Jāmiʿ 48:5335.1
    note: كف عنا يا محمد! لسان حسان، فلو مزج به ماء البحر لمزجه
- id: hadith-48-digging-the-trench
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Digging the trench: chants, hunger and dust'
  read:
  - Jāmiʿ 48:5337.1-5339.1
  quran: []
  tags:
  - motif: trench-dug-by-the-community
    refs:
    - Jāmiʿ 48:5337.1
    - Jāmiʿ 48:5337.2
    - Jāmiʿ 48:5337.3
    note: يحفرون في غداة باردة، فلم يكن لهم عبيد يعملون ذلك لهم ... وينقلون التراب على متونهم
  - motif: no-life-but-the-life-hereafter
    refs:
    - Jāmiʿ 48:5337.1
    - Jāmiʿ 48:5337.2
    - Jāmiʿ 48:5338.1
    - Jāmiʿ 48:5338.3
    note: اللهم لا عيش إلا عيش الآخرة، فاغفر للأنصار والمهاجرة
  - motif: workers-answer-with-oath-of-allegiance
    refs:
    - Jāmiʿ 48:5337.2
    - Jāmiʿ 48:5337.3
    note: نحن الذين بايعوا محمدًا ... على الجهاد ما بقينا أبدًا
  - motif: rancid-fat-for-hungry-diggers
    refs:
    - Jāmiʿ 48:5337.3
    note: يؤتون بملء كفيّ من الشعير، فيصنع لهم بإهالة سنخة ... بشعة في الحلق ولها ريح منتن
  - motif: rajaz-without-god-we-would-not-be-guided
    refs:
    - Jāmiʿ 48:5338.2
    - Jāmiʿ 48:5339.1
    note: اللهم لولا أنت ما اهتدينا ... فأنزلن سكينة علينا ... وثبت الأقدام إن لاقينا
  - motif: prophet-carries-earth-dust-covers-chest
    refs:
    - Jāmiʿ 48:5339.1
    - Jāmiʿ 48:5338.3
    note: ينقل التراب حتى وارى التراب شعر صدره
  - motif: ammar-to-be-killed-by-rebel-party
    refs:
    - Jāmiʿ 48:5338.3
    note: ويحك ابن سمية تقتله الفئة الباغية
- id: hadith-48-jabirs-feast-at-the-trench
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Jabir's small meal feeds the diggers
  read:
  - Jāmiʿ 48:5339.2-5340.1
  quran: []
  tags:
  - motif: small-meal-feeds-the-army
    refs:
    - Jāmiʿ 48:5339.2
    - Jāmiʿ 48:5340.1
    note: صاع من شعير ... بُهيمة داجن ... وهم ألف ... إن برمتنا لتغط كما هي، وإن عجيننا ليخبز كما هو
  - motif: prophet-spits-into-dough-and-pot
    refs:
    - Jāmiʿ 48:5339.2
    note: فأخرجت له عجينًا فبصق فيه وبارك، ثمّ عمد إلى برمتنا فبصق وبارك
  - motif: stone-tied-on-belly-for-hunger
    refs:
    - Jāmiʿ 48:5340.1
    note: وبطنه معصوب بحجر، ولبثنا ثلاثة أيام لا نذوق ذواقا
  - motif: hard-rock-turned-to-sand-by-pick
    refs:
    - Jāmiʿ 48:5340.1
    note: فضرب في الكدية، فعاد كثيبًا أهيل، أو أهيم
  hints:
  - 'The small store that feeds many with food left over: 2 Kgs 4:42-44 (twenty barley loaves for a hundred men, ''they ate and had some left'') and Mark 6:35-44 (five loaves, the crowd satisfied, baskets of fragments).'
- id: hadith-48-rock-of-three-strikes
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Three strikes on the rock and the cities shown
  read:
  - Jāmiʿ 48:5341.1
  quran:
  - 6:115
  tags:
  - motif: three-strikes-flash-and-show-cities
    refs:
    - Jāmiʿ 48:5341.1
    note: فندر ثلث الحجر ... فبرق مع ضربة رسول الله ﷺ برقة ... رفعت لي مدائن كسرى ... مدائن قيصر ... مدائن الحبشة
  - motif: leave-abyssinians-and-turks-alone
    refs:
    - Jāmiʿ 48:5341.1
    note: دعوا الحبشة ما ودعوكم، واتركوا الترك ما تركوكم
- id: hadith-48-saad-guards-the-prophet
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Sa'd comes to guard the sleepless prophet
  read:
  - Jāmiʿ 48:5344.1
  quran: []
  tags:
  - motif: volunteer-guard-lets-prophet-sleep
    refs:
    - Jāmiʿ 48:5344.1
    note: ليت رجل صالح من أصحابي يحرسني الليلة ... فنام النَّبِيّ ﷺ حتَّى سمعنا غطيطه
- id: hadith-48-zubayr-the-hawari
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Al-Zubayr volunteers three times and is named hawari
  read:
  - Jāmiʿ 48:5345.1
  quran: []
  tags:
  - motif: each-prophet-has-a-hawari
    refs:
    - Jāmiʿ 48:5345.1
    note: إنَّ لكل نبي حواريًا، وإن حواري الزُّبير
- id: hadith-48-ahzab-prayers-and-the-lost-afternoon
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Prayers against the confederates; the afternoon prayer lost
  read:
  - Jāmiʿ 48:5345.2-5346.1
  quran:
  - 2:238
  tags:
  - motif: prayer-to-rout-the-confederates
    refs:
    - Jāmiʿ 48:5345.2
    note: اللهم منزل الكتاب، سريع الحساب، اهزم الأحزاب، اللهم اهزمهم وزلزلهم
  - motif: fill-their-houses-and-graves-with-fire
    refs:
    - Jāmiʿ 48:5345.3
    note: ملأ الله عليهم بيوتهم وقبورهم نارًا كما شغلونا عن الصّلاة الوسطى حتَّى غابت الشّمس
  - motif: afternoon-prayer-prayed-after-sunset
    refs:
    - Jāmiʿ 48:5345.4
    note: فنزلنا ... بطحان، فتوضأ ... فصلى العصر بعدما غربت الشمس، ثمّ صلى بعدها المغرب
  - motif: prayer-cover-our-nakedness
    refs:
    - Jāmiʿ 48:5346.1
    note: اللهم استر عوراتنا، وآمن روعاتنا ... فهزم الله بالريح
- id: hadith-48-ahzab-routed-by-god-alone
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: God alone routed the confederates; the east wind
  read:
  - Jāmiʿ 48:5348.1-5348.4
  quran: []
  tags:
  - motif: god-alone-routed-the-confederates
    refs:
    - Jāmiʿ 48:5348.1
    - Jāmiʿ 48:5348.2
    note: أعز جنده، ونصر عبده، وغلب الأحزاب وحده، فلا شيء بعده
  - motif: returning-travellers-formula
    refs:
    - Jāmiʿ 48:5348.2
    note: يكبر ثلاث مرار ... آيبون عابدون ساجدون، لربنا حامدون
  - motif: victory-by-east-wind-ad-by-west-wind
    refs:
    - Jāmiʿ 48:5348.3
    - Jāmiʿ 48:5348.4
    note: نصرت بالصّبا، وأهلكت عاد بالدبور
  - motif: barren-wind-on-ad
    refs:
    - Jāmiʿ 48:5348.3
    note: وأهلكت عاد بالدبور
- id: hadith-48-now-we-raid-them
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'After the Trench: now we raid them'
  read:
  - Jāmiʿ 48:5349.1-5349.2
  quran: []
  tags:
  - motif: now-we-raid-them
    refs:
    - Jāmiʿ 48:5349.1
    - Jāmiʿ 48:5349.2
    note: الآن نغزوهم، ولا يغزوننا نحن نسير إليهم
- id: hadith-48-gabriel-sends-to-qurayza
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Gabriel's call to Qurayza and the afternoon prayer on the road
  read:
  - Jāmiʿ 48:5351.1-5352.1
  quran: []
  tags:
  - motif: angel-has-not-laid-down-arms
    refs:
    - Jāmiʿ 48:5351.1
    - Jāmiʿ 48:5351.3
    note: قد وضعت السلاح، والله! ما وضعناه. فاخرج إليهم
  - motif: dust-of-gabriels-cavalcade
    refs:
    - Jāmiʿ 48:5351.2
    note: كأني أنظر إلى الغبار ساطعًا في زقاق بني غنم، موكب جبريل
  - motif: pray-afternoon-only-at-qurayza
    refs:
    - Jāmiʿ 48:5351.3
    - Jāmiʿ 48:5352.1
    note: لا يصلين أحد العصر إِلَّا في بني قريظة ... فلم يعنف واحدًا منهم
- id: hadith-48-hassan-and-gabriel
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Satirize them, and Gabriel is with you
  read:
  - Jāmiʿ 48:5352.2
  quran: []
  tags:
  - motif: gabriel-with-the-satirist
    refs:
    - Jāmiʿ 48:5352.2
    note: اهجهم - أو هاجهم - وجبريل معك
- id: hadith-48-saad-judgment-on-qurayza
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Sa'd b. Mu'adh's wound, his judgment and death
  read:
  - Jāmiʿ 48:5349.3
  - Jāmiʿ 48:5353.1-5356.2
  quran:
  - '48:29'
  tags:
  - motif: stand-for-your-master
    refs:
    - Jāmiʿ 48:5353.1
    - Jāmiʿ 48:5354.1
    note: قوموا إلى سيدكم أو خيركم ... فأنزلوه
  - motif: arbiter-judges-men-killed-women-captive
    refs:
    - Jāmiʿ 48:5353.1
    - Jāmiʿ 48:5353.2
    - Jāmiʿ 48:5354.1
    - Jāmiʿ 48:5356.2
    note: 'تَقتل مقاتلتهم، وتَسبِي ذراريهم ... قضيتَ بحكم الله، وربما قال: بحكم الملك'
  - motif: wound-reopens-at-the-prayer
    refs:
    - Jāmiʿ 48:5353.2
    - Jāmiʿ 48:5354.1
    note: اللهم ... فافجرها واجعل موتتي فيها، فانفجرت من لبته ... إِلَّا الدم يسيل إليهم
  - motif: angel-has-not-laid-down-arms
    refs:
    - Jāmiʿ 48:5353.2
    - Jāmiʿ 48:5354.1
