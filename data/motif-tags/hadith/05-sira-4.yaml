  - motif: poisoned-sheep-test-of-prophethood
    refs:
    - Jāmiʿ 48:5435.1
    - Jāmiʿ 48:5435.2
    - Jāmiʿ 48:5435.3
    note: أَرَدْنَا إِنْ كُنْتَ كَاذِبًا نَسْتَرِيحُ، وَإنْ كُنْتَ نَبِيًّا لَمْ يَضرَّكَ
  - motif: poison-felt-until-death
    refs:
    - Jāmiʿ 48:5435.2
    - Jāmiʿ 48:5435.3
    - Jāmiʿ 48:5436.1
    note: فما زلت أعرفها في لهوات رسول الله ﷺ ... احتجم ... فهذا أوان انقطاع أبهري من ذلك السم
