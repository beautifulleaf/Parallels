  tags:
  - motif: two-rakas-with-heart-and-face-paradise-due
    refs:
    - Jāmiʿ 7:1057.3
    note: ثم يقوم فيصلي ركعتين مقبل عليهما بقلبه ووجهه إلَّا وجبتْ له الجنة
  - motif: eight-gates-after-testimony-at-ablution
    refs:
    - Jāmiʿ 7:1057.3
    note: 'ثم يقول: أشهد أن لا إله إلا الله وأن محمدًا عبده ورسوله، إلَّا فتحت له أبواب الجنة الثمانية يدخل من أيها شاء'
- id: hadith-7-junub-before-sleep
