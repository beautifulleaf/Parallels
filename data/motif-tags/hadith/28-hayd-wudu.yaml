    resting on the hands after sleep, washed off three times, b. Shabbat 108b-109a
- id: hadith-7-transgressing-in-purification
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Transgressing in purification and supplication
