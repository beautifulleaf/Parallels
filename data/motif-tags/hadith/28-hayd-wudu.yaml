    - Jāmiʿ 7:1052.3
    note: 'توضّأ فترك موضع ظُفْر على قدمه، فأبصره النبي ﷺ فقال: ارجع! فأحسن وضوءك'
  - motif: dry-patch-of-a-dirham-repeat-ablution-and-prayer
    refs:
    - Jāmiʿ 7:1053.1
    note: وفي ظهر قدمه لمعة قدر الدرهم لم يصبها الماءُ، فأمره النبي ﷺ أن يعيد الوضوء والصلاة
  - motif: three-things-special-to-the-prophets-house
    refs:
    - Jāmiʿ 7:1052.2
    note: ما خصَّنا رسول الله ﷺ بشيء دون الناس، إلَّا ثلاثة أشياء؛ فإنه أمرنا أن نُسبغ الوضوء، ولا نأكل الصدقة، ولا نُنْزي
      الحمرَ على الخيل
  hints:
  - Not mounting donkeys on mares (breeding mules) against Lev 19:19, 'you shall not let your cattle breed with a different
    kind'
  - A patch left dry invalidating the washing against the rabbinic ḥaṣiṣah (an intervening substance) that invalidates immersion
    if water does not reach every part, m. Mikvaot 9:1-4
