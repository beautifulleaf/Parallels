  - motif: no-prayer-in-camel-pens-pray-in-sheepfolds
    refs:
    - Jāmiʿ 7:1062.1
    - Jāmiʿ 7:1062.2
    note: لا تصلوا في مبارك الإبل؛ فإنها من الشياطين ... صلوا فيها؛ فإنها بركة
  hints:
  - The camel singled out from the sheep against Lev 11:4 and Deut 14:7, where the camel alone of the cud-chewers named is
    unclean to eat
