    refs:
    - Jāmiʿ 7:1050.1
    - Jāmiʿ 7:1050.3
    - Jāmiʿ 7:1051.1
    - Jāmiʿ 7:1052.1
    note: ويلٌ للأعقاب من النار ... ويلٌ للعراقيب من النار
  - motif: soles-of-feet-with-heels-in-fire
    refs:
