# Hadith chunk 28: al-Jāmiʿ al-Kāmil book 6 (kitāb al-ḥayḍ, pp. 985-1005, printed 2/205-225) and book 7
# (kitāb al-wuḍūʾ, pp. 1006-1102, printed 2/226-322): the menstruant's prayer, fast, garment, bed and table; the woman with
# prolonged bleeding (istiḥāḍa); then intention, the merits of ablution, its description, the counts, the heels, what
# breaks it (camel meat, fire-touched food, sleep, touching the penis, wind, madhy) and wiping over socks and turbans.
# Read in full from the Arabic (185 hadith).
new_motifs:
  menstruant-makes-up-fast-not-prayer:
    label: Women who menstruated were ordered to make up the fast but not the prayer
    cluster: law
  asked-are-you-a-haruri:
    label: Asked why the menstruant makes up the fast and not the prayer, Aisha retorts 'are you a Haruriyya?'; 'no, I only
      ask'
    cluster: polemic
  postpartum-woman-sits-forty-days:
    label: The woman after childbirth sat (abstained) forty days in the Prophet's time
    cluster: law
  face-smeared-with-wars-against-blotches:
    label: Women in their postpartum days smeared their faces with wars (yellow dye) against dark blotches (kalaf)
    cluster: ritual
  menstrual-blood-pinched-sprinkled-prayed-in:
    label: 'Menstrual blood on a garment: pinch it off, sprinkle with water, then pray in it'
    cluster: ritual
  single-garment-blood-scraped-with-saliva-and-nail:
    label: Women had a single garment to menstruate in; a spot of blood was moistened with saliva and scraped with a fingernail
    cluster: ritual
  blood-scraped-with-rib-washed-with-lote:
    label: Menstrual blood on a garment is scraped with a rib-bone (ḍilaʿ) and washed with water and lote (sidr)
    cluster: ritual
  prophets-garment-touches-menstruant-in-prostration:
    label: He prays beside his menstruating wife lying on her mat; when he prostrates part of his garment touches her
    cluster: ritual
  one-wrap-over-praying-man-and-menstruant:
    label: He prays at night beside his menstruating wife with one wrap (mirṭ) lying partly on her and partly on him
    cluster: ritual
  prays-in-garment-of-intercourse-unless-stained:
    label: 'Asked whether he prayed in the garment he lay with his wife in: yes, if he saw no harm (adhā) on it'
    cluster: ritual
  no-prayer-in-wives-coverlets:
    label: He would not pray in the women's undergarments (shuʿur) or coverlets (luḥuf)
    cluster: ritual
  drinks-and-bites-where-menstruant-put-her-mouth:
    label: He puts his mouth where his menstruating wife drank and bites the bone where she bit
    cluster: ritual
  eat-with-the-menstruant:
    label: 'Asked about eating with a menstruating woman: ''eat with her'''
    cluster: law
  slips-away-at-menses-and-is-called-back-under-the-cover:
    label: Lying with him under a cloak she gets her period, slips away for her menstrual clothes; 'have you been bled (nufisti)?'
      and he calls her back under the coverlet
    cluster: ritual
  lies-with-menstruant-cloth-between:
    label: He lies with his menstruating wife with a garment between them
    cluster: ritual
  only-the-spot-washed-not-beyond:
    label: Sleeping in one cloth with the menstruant, if any of her blood touches him he washes that place only, not beyond,
      and prays in it
    cluster: ritual
  fondles-menstruant-over-waist-wrap:
    label: He has the menstruating wife put on a waist-wrap at the height of her flow, then touches (yubāshir) her
    cluster: law
  who-controls-his-desire-as-he-did:
    label: '''Which of you controls his desire (irb) as the Prophet controlled his?'''
    cluster: ethics
  cloth-laid-over-menstruants-private-part:
    label: Wanting something of a menstruating wife he laid a cloth over her private part
    cluster: law
  jews-angered-he-leaves-nothing-undifferent:
    label: The Jews say 'this man wants to leave nothing of our ways without differing from it'
    cluster: polemic
  companions-ask-to-have-intercourse-to-differ-from-jews:
    label: Two Companions ask, to differ from the Jews, 'shall we not lie with them?'; his face changes; he sends milk after
      them to show no anger
    cluster: sira
  menstruant-combs-hair-of-man-in-retreat:
    label: The menstruating wife in her room combs the hair of the Prophet, in retreat in the mosque, who puts his head out
      to her
    cluster: ritual
  your-menstruation-is-not-in-your-hand:
    label: 'Told to hand him the mat (khumra) from the mosque, she says she is menstruating: ''your menstruation is not in
      your hand'''
    cluster: ritual
  menstruant-anus-soothsayer-disbelief:
    label: Whoever goes to a menstruating woman, or to a woman in her anus, or to a soothsayer, has disbelieved in what was
      revealed to Muhammad
    cluster: law
  yellow-and-turbid-not-counted:
    label: Turbid and yellowish discharge was not counted as anything (after purity)
    cluster: law
  prolonged-bleeding-a-vein-not-menstruation:
    label: 'Prolonged bleeding (istiḥāḍa) is ''a vein, not menstruation'': leave prayer when the period comes, wash off the
      blood and pray when it goes'
    cluster: law
  count-the-days-of-the-former-cycle:
    label: The bleeding woman counts the nights and days she used to menstruate before her affliction and leaves prayer for
      that much of the month
    cluster: law
  bind-a-cloth-and-pray:
    label: After her days she bathes, binds herself with a cloth (tastathfir) and prays
    cluster: ritual
  bathes-in-tub-till-red-rises-over-water:
    label: Bleeding for seven years she bathed for every prayer in a tub in her sister's room until the red of the blood rose
      over the water
    cluster: ritual
  wept-because-she-could-not-pray:
    label: '''May God have mercy on Hind: she used to weep because she could not pray'''
    cluster: ethics
  menstrual-blood-black-and-known:
    label: 'Menstrual blood is black and known; the other is a vein: make ablution and pray'
    cluster: law
  ablution-for-every-prayer-of-bleeding-woman:
    label: The woman with prolonged bleeding makes ablution for every prayer until that time comes again
    cluster: law
  bleeding-woman-bathes-for-every-prayer:
    label: The woman who pours blood is ordered to bathe at every prayer and pray
    cluster: law
  three-baths-a-day-after-yellow-on-water:
    label: She sits in a tub; when she sees yellow over the water she bathes once for noon and afternoon, once for sunset
      and night, once for dawn
    cluster: ritual
  prolonged-bleeding-is-from-satan:
    label: '''Glory be to God! This is from Satan'''
    cluster: demonology
  bleeding-is-a-kick-of-satan:
    label: '''This is only a kick (rakḍa) of the kicks of Satan'''
    cluster: demonology
  menstruate-six-or-seven-days-in-gods-knowledge:
    label: '''Menstruate six or seven days in God''s knowledge'', then pray twenty-three or twenty-four nights'
    cluster: law
  cotton-cloth-then-gushing:
    label: '''I prescribe cotton (kursuf)''; ''it is more''; ''take a cloth''; ''it is more, I gush (athujju thajjan)'''
    cluster: ritual
  two-commands-either-suffices:
    label: '''I will order you two things; whichever you do suffices for the other'' - the second, combining prayers with
      one bath, ''is the dearer to me'''
    cluster: law
  emigration-for-world-or-woman:
    label: Whoever emigrated for worldly gain or a woman to marry, his emigration is to what he emigrated for
    cluster: ethics
  ablution-in-gods-name-from-fingers:
    label: 'He puts his hand in the water: ''make ablution in the name of God''; water comes from between his fingers till
      about seventy have washed'
    cluster: miracle
  no-prayer-accepted-after-hadath-till-ablution:
    label: The prayer of one who has broken his purity (aḥdatha) is not accepted until he makes ablution; the ḥadath is 'fusāʾ
      or ḍurāṭ'
    cluster: law
  no-prayer-without-purity-no-alms-from-theft:
    label: God accepts no prayer without purification and no alms from embezzled booty (ghulūl)
    cluster: law
  ablution-only-when-rising-to-pray:
    label: 'Coming from the privy he is brought food and asked about ablution: ''Why? Am I going to pray, that I should make
      ablution?'''
    cluster: law
  key-of-prayer-purity-takbir-taslim:
    label: The key of prayer is purification; its consecration (taḥrīm) is the takbīr and its release (taḥlīl) the taslīm
    cluster: ritual
  sins-leave-each-limb-with-last-drop:
    label: Washing the face, every sin his eyes looked at leaves with the water (or the last drop); the hands, every sin they
      seized; the feet, every sin they walked to
    cluster: theology
  sins-exit-from-under-the-nails:
    label: Whoever perfects ablution, his sins leave his body until they come out from under his nails
    cluster: theology
  ablution-like-mine-forgives-past:
    label: '''Whoever makes ablution like this ablution of mine'' has his past sins forgiven; his prayer and walk to the mosque
      are extra'
    cluster: theology
  obligatory-prayer-expiates-unless-major-sin-always:
    label: Prayer with good ablution, humility and bowing expiates the sins before it so long as no major sin is committed,
      'and that is for all time'
    cluster: theology
  hesitates-whether-to-tell-or-keep-silent:
    label: '''I do not know whether to tell you something or keep silent''; ''if it is good tell us'''
    cluster: transmission
  would-not-tell-but-for-a-verse:
    label: '''By God, I would tell you a hadith; were it not in God''s book I would not tell you'''
    cluster: transmission
  each-goes-out-selling-himself-freeing-or-ruining:
    label: Prayer is light, alms a proof, patience radiance, the Quran a proof for or against you; every man goes out selling
      his soul, freeing it or ruining it
    cluster: ethics
  sun-rises-between-satans-horns-unbelievers-bow:
    label: 'The sun rises and sets between the two horns of a devil, when the unbelievers prostrate to it: no prayer then'
    cluster: ritual
  hell-stoked-at-noon:
    label: 'When the shadow stands upright on the spear, hell is stoked (tusjar): do not pray'
    cluster: eschatology
  prayer-witnessed-and-attended:
    label: Pray then, for the prayer is witnessed and attended (mashhūda maḥḍūra)
    cluster: ritual
  sins-fall-from-mouth-nostrils-beard-fingers-hair:
    label: Rinsing and snuffing, the sins of face, mouth and nostrils fall; washing, from the tips of the beard, the fingertips,
      the hair-ends, the toes
    cluster: theology
  returns-from-sin-as-on-day-mother-bore-him:
    label: 'Prayer after such ablution with a heart emptied for God: he leaves his sin as on the day his mother bore him'
    cluster: theology
  heard-it-seven-times-and-more:
    label: '''Had I not heard it from him once, twice, three times - he counted to seven - I would never have told it; I heard
      it more'''
    cluster: transmission
  walk-to-prayer-purified-like-pilgrim-in-ihram:
    label: Going out purified to an obligatory prayer earns the reward of the pilgrim in iḥrām; to the forenoon prayer, of
      the ʿumra pilgrim; prayer after prayer without idle talk is written in ʿIlliyyūn
    cluster: ritual
  ablution-expiates-prayer-becomes-extra:
    label: Ablution expiates what is before it and the prayer becomes extra (nāfila); heard 'not once, twice, three, four,
      five times'
    cluster: theology
  knots-untied-limb-by-limb-in-night-ablution:
    label: A man rising at night struggles to purify himself under knots; with hands, face, head and feet washed a knot is
      untied each time; God tells those behind the veil 'look at my servant'
    cluster: theology
  prays-after-every-purification:
    label: 'Bilal: never did I purify at any hour of night or day but I prayed with that purity what was written for me'
    cluster: ritual
  five-prayers-like-river-at-the-door:
    label: 'The five prayers are like a river at a man''s door in which he bathes five times a day: does any dirt remain?'
    cluster: parable
  later-dying-brother-raised-by-his-prayers:
    label: Of two brothers the better died; the other lived forty more nights; 'do you know what his prayer brought him to?'
    cluster: ethics
  sin-then-ablution-two-rakas-forgiven:
    label: 'A man sins, makes ablution well, prays two rakʿas and asks forgiveness: God forgives him'
    cluster: theology
  ali-made-narrators-swear:
    label: 'Ali: when another told me a hadith from the Prophet I made him swear; but Abu Bakr told me, and Abu Bakr spoke
      truth'
    cluster: transmission
  two-rakas-without-distraction-forgives-past:
    label: 'Ablution then two rakʿas in which he does not drift (or talk to himself): his past sins are forgiven'
    cluster: theology
  only-a-believer-guards-ablution:
    label: '''Be steady and keep close; the best of your works is prayer, and none guards ablution but a believer'''
    cluster: ethics
  lengthen-the-blaze:
    label: '''Whoever can lengthen his blaze (ghurra), let him do it''; Abu Hurayra washes to the shoulders and shins'
    cluster: ritual
  ornament-reaches-where-ablution-reaches:
    label: 'Abu Hurayra stretches his washing to the armpit: ''the ornament (ḥilya) of the believer reaches where the ablution
      reaches'''
    cluster: eschatology
  greeting-the-abode-of-believing-dead:
    label: 'At the cemetery: ''Peace on you, abode of a believing people; we shall join you, God willing'''
    cluster: ritual
  basin-wider-than-ayla-to-aden:
    label: His basin is wider than from Ayla to Aden; he drives men from it as a man drives strange camels from his trough
    cluster: eschatology
  blaze-from-prostration-stockings-from-ablution:
    label: 'His community on the day of resurrection: white-faced from prostration, white-limbed from ablution'
    cluster: eschatology
  piebald-from-ablution:
    label: 'Asked how he knows those he never saw: ''blazed, white-footed, piebald (bulq) from the traces of ablution'''
    cluster: eschatology
  right-first-in-sandal-comb-purification:
    label: He liked to begin with the right in putting on sandals, combing and purifying, in all his affairs
    cluster: ritual
  begin-with-right-in-dress-and-ablution:
    label: '''When you dress and when you make ablution, begin with your right sides'''
    cluster: ritual
  head-wiped-front-to-nape-and-back:
    label: Head wiped with both hands from the forehead to the nape and back to where he began; hands twice, face and mouth
      thrice
    cluster: ritual
  one-scoop-per-limb:
    label: Ibn Abbas takes one scoop of water for mouth and nose, one for the face with both hands, one for each hand, and
      sprinkles one scoop on each foot
    cluster: ritual
  ali-ablution-ewer-and-basin-head-once:
    label: 'Ali, having prayed, calls for a vessel and a basin to teach: hands, mouth and nose, face, each arm, each foot
      thrice; head once'
    cluster: ritual
  beyond-three-is-wrong-and-unjust:
    label: '''This is the ablution: whoever exceeds this or falls short has done wrong and been unjust'''
    cluster: law
  forefingers-inside-ears-thumbs-outside:
    label: 'Wiping the ears: the two forefingers inside the ears, the thumbs over their backs'
    cluster: ritual
  head-wiped-without-moving-the-hair:
    label: He wiped all the head from the hairline, every direction down the fall of the hair, without moving the hair from
      its set
    cluster: ritual
  head-wiped-with-leftover-water-in-hand:
    label: He wiped his head with the water left over in his hand
    cluster: ritual
  mouth-rinsed-after-the-forearms:
    label: 'Miqdam''s description: hands, face, forearms thrice, then mouth and nose thrice, then head and ears'
    cluster: ritual
  scoop-poured-on-crown-till-it-drips:
    label: Muʿawiya takes a scoop in his left hand and sets it on the middle of his head till it drips, then wipes front to
      back and back to front
    cluster: ritual
  ablution-twice-twice:
    label: He made ablution twice twice
    cluster: ritual
  ablution-thrice-thrice:
    label: He made ablution thrice thrice
    cluster: ritual
  shows-sons-not-knowing-how-long-he-has-with-them:
    label: 'Al-Baraʾ gathers his sons: ''I do not know how long I shall be with you''; shows the ablution, then leads the
      prayers, verses of Yā Sīn heard at noon'
    cluster: transmission
  arms-drawn-out-from-under-tight-syrian-jubba:
    label: His Syrian jubba too tight in the sleeves, he draws his arms out from under it to wash them
    cluster: sira
  wipes-forelock-turban-and-khuffs:
    label: He wipes his forelock and over the turban and over the leather socks (khuffs)
    cluster: ritual
  prophet-prays-behind-abd-al-rahman:
    label: Late from his need he finds Abd al-Rahman b. Awf leading the prayer, forbids interrupting him and completes the
      missed rakʿa
    cluster: sira
  twenty-two-takbirs-in-noon-prayer:
    label: 'Abu Malik shows the Prophet''s prayer: noon prayer with the Fatiha and twenty-two takbīrs'
    cluster: ritual
  do-not-begin-with-mouth-unbeliever-does:
    label: '''Do not begin with your mouth, for the unbeliever begins with his mouth''; he washes his hands first'
    cluster: ritual
  ablution-of-one-not-in-hadath:
    label: 'Ali wipes face, forearms, head and feet with one palmful and drinks the rest standing: ''this is the ablution
      of one who has not broken purity'''
    cluster: ritual
  drinks-ablution-leftover-standing:
    label: 'After ablution he drinks the leftover water standing: ''people dislike this, but I saw the Prophet do it'''
    cluster: ritual
  fingers-run-through-beard:
    label: He used to run water through his beard (yukhallil liḥyatahu)
    cluster: ritual
  rubs-toes-with-little-finger:
    label: Making ablution he rubbed between his toes with his little finger
    cluster: ritual
  between-fingers-and-toes:
    label: '''When you make ablution, run water between the fingers of your hands and feet'''
    cluster: ritual
  satan-spends-night-on-nostril:
    label: On waking, snuff water thrice, for Satan spends the night on his nostril (khayshūm)
    cluster: demonology
  snuff-twice-thoroughly-or-thrice:
    label: '''Snuff out twice thoroughly, or three times'''
    cluster: ritual
  son-asks-for-white-palace-on-right-of-paradise:
    label: 'A son prays for ''the white palace on the right of paradise''; the father: ask for paradise and refuge from the
      fire'
    cluster: ethics
  people-who-transgress-in-purification-and-prayer:
    label: '''There will be in this community people who transgress in purification and supplication'''
    cluster: eschatology
  woe-to-the-heels-from-the-fire:
    label: '''Woe to the heels (aʿqāb, ʿarāqīb) from the fire!'' at heels left dry in ablution'
    cluster: eschatology
  soles-of-feet-with-heels-in-fire:
    label: '''Woe to the heels and the soles of the feet from the fire'''
    cluster: eschatology
  dry-spot-of-a-nail-go-back:
    label: 'A man leaves a spot the size of a nail dry on his foot: ''go back and make your ablution well'''
    cluster: law
  dry-patch-of-a-dirham-repeat-ablution-and-prayer:
    label: A man prays with a dry patch the size of a dirham on his foot and is told to repeat ablution and prayer
    cluster: law
  three-things-special-to-the-prophets-house:
    label: 'Ibn Abbas: he singled us out only in three: to complete ablution, not to eat alms, not to mount donkeys on mares'
    cluster: law
  angels-pray-for-one-awaiting-prayer:
    label: 'The angels say over him who sits awaiting the next prayer: ''O God, forgive him, O God, have mercy on him'''
    cluster: angels
  sees-the-rows-from-behind-his-back:
    label: '''Straighten the rows and close the gaps, for I see you from behind my back'''
    cluster: miracle
  women-lower-eyes-in-mens-prostration:
    label: Best rows of men the front, of women the back; 'women, lower your eyes when the men prostrate, lest you see their
      nakedness through tight wraps'
    cluster: ritual
  ablution-every-prayer-then-one-sufficing:
    label: 'He made ablution at every prayer; the Companions: one ablution suffices us until we break it'
    cluster: ritual
  eight-gates-after-testimony-at-ablution:
    label: Whoever completes ablution and says the testimony, the eight gates of paradise are opened for him to enter by whichever
      he will
    cluster: eschatology
  two-rakas-with-heart-and-face-paradise-due:
    label: 'Ablution done well then two rakʿas with heart and face turned to them: paradise is due'
    cluster: theology
  junub-makes-ablution-to-sleep-or-eat:
    label: When in a state of major impurity (junub) and wanting to eat or sleep he made the ablution of prayer; 'wash your
      penis, make ablution, then sleep'
    cluster: law
  leapt-and-poured-water-not-stood-and-bathed:
    label: 'Aisha: at the first call he leapt up (''by God she did not say stood'') and poured water over himself (''by God
      she did not say bathed'')'
    cluster: transmission
  ablution-between-two-intercourses:
    label: Whoever comes to his wife and wants to return, let him make an ablution between
    cluster: law
  ablution-from-what-fire-touched:
    label: '''Ablution from what the fire has touched'''
    cluster: law
  ablution-for-pieces-of-dried-curd:
    label: Abu Hurayra makes ablution at the mosque for pieces of dried curd (athwār aqiṭ) he ate
    cluster: law
  ate-shoulder-prayed-without-ablution:
    label: He ate a shoulder (or side) of mutton and prayed without making ablution
    cluster: law
  knife-thrown-down-at-the-call:
    label: Cutting meat from a shoulder, called to prayer, he throws down the knife and prays without ablution
    cluster: sira
  last-of-two-commands-no-ablution-from-fire:
    label: The last of the two commands from the Prophet was leaving ablution from what fire altered
    cluster: law
  moustache-trimmed-over-a-toothstick:
    label: 'Bilal calls him from carving the roast: ''what is wrong with him, may his hands be dusty''; and my long moustache
      he trimmed for me over a toothstick'
    cluster: sira
  milk-has-grease-rinse:
    label: 'He drank milk, called for water and rinsed: ''it has grease (dasam)'''
    cluster: ritual
  drank-milk-without-rinsing:
    label: He drank milk and did not rinse or make ablution, and prayed
    cluster: ritual
  companions-doze-waiting-and-pray-without-ablution:
    label: He talked with a man till the people slept; they then prayed without ablution
    cluster: law
  none-on-earth-awaits-prayer-but-you:
    label: 'Delaying the night prayer till they slept: ''none of the people of the earth awaits this prayer but you'''
    cluster: ritual
  slept-till-he-blew-then-prayed:
    label: He slept until he breathed loudly (nafakha), then rose and prayed without ablution
    cluster: law
  boy-moved-from-left-to-right:
    label: Ibn Abbas stands at his left in the night prayer and is turned round to his right
    cluster: ritual
  pours-water-on-head-in-faint:
    label: Standing in the eclipse prayer till a faint covers her, Asmaʾ pours water over her head
    cluster: ritual
  shown-all-even-paradise-and-fire-in-this-place:
    label: '''There is nothing I had not seen that I have not seen in this standing place of mine, even paradise and the fire'''
    cluster: eschatology
  tried-in-graves-like-the-dajjal:
    label: '''You will be tried in your graves like, or close to, the trial of the Dajjal'''
    cluster: eschatology
  grave-question-about-this-man:
    label: 'In the grave: ''what do you know of this man?'' The believer: ''Muhammad, God''s messenger''; ''sleep, righteous'';
      the hypocrite: ''I heard people say something and said it'''
    cluster: eschatology
  touching-penis-requires-ablution:
    label: '''When one of you touches his penis let him make ablution'''
    cluster: law
  hand-reaching-private-part-without-barrier:
    label: '''When one of you lets his hand reach his private part with no cover or barrier between, let him make ablution'''
    cluster: law
  penis-only-a-piece-of-you:
    label: 'Asked about a man touching his penis after ablution: ''is it anything but a lump (muḍgha, baḍʿa) of him?'''
    cluster: law
  messenger-sent-to-busra-confirms:
    label: Urwa disputes with Marwan until he sends one of his guards to Busra, who sends back the same
    cluster: transmission
  not-to-leave-prayer-until-sound-or-smell:
    label: One who imagines he feels something in prayer is not to leave until he hears a sound or finds a smell
    cluster: law
  satan-blows-in-the-seat:
    label: Satan comes in prayer and blows in a man's seat so he imagines he broke wind; let him not leave until he hears
      it with his ear or smells it with his nose
    cluster: demonology
  hadath-is-the-sound:
    label: A man is in prayer while awaiting it in the mosque, until he breaks purity; 'what is the ḥadath?' 'a sound'
    cluster: law
  no-ablution-except-from-sound-or-wind:
    label: '''No ablution except from a sound or wind'''
    cluster: law
  freedwoman-beaten-for-reporting-the-rule:
    label: 'Abu Rafiʿ strikes Salma for telling him the Prophet ordered ablution after wind; the Prophet laughs: ''she ordered
      you nothing but good'''
    cluster: sira
  vomited-broke-fast-water-poured:
    label: 'He vomited and broke his fast; Thawban: ''I poured his ablution water for him'''
    cluster: law
  ashamed-to-ask-sends-miqdad:
    label: Ali, a man of much pre-seminal fluid (madhy), is ashamed to ask because of the Prophet's daughter and sends al-Miqdad
    cluster: sira
  madhy-wash-penis-and-make-ablution:
    label: 'For pre-seminal fluid: wash the penis (and testicles) and make the ablution of prayer; no full bath'
    cluster: law
  palmful-sprinkled-on-garment-for-madhy:
    label: For madhy on the garment it suffices to take a palmful of water and sprinkle where he sees it struck
    cluster: ritual
  every-stallion-emits-madhy:
    label: '''That is madhy, and every stallion emits madhy'''
    cluster: law
  arm-thrust-between-skin-and-flesh:
    label: 'Passing a boy skinning a sheep: ''stand aside, I will show you''; he thrusts his hand between skin and flesh to
      the armpit, then prays without ablution'
    cluster: sira
  no-ablution-after-the-bath:
    label: He bathed and prayed the two rakʿas and the dawn prayer without a new ablution after the bath
    cluster: law
  returns-greeting-only-after-ablution:
    label: 'Greeted while urinating, he does not answer till he has made ablution: ''I disliked to mention God except in purity'''
    cluster: ritual
  feet-entered-pure-wipe-over-socks:
    label: '''Leave them, for I put them on pure'', and he wipes over the leather socks'
    cluster: law
  jarirs-islam-after-al-maida:
    label: 'Jarir wipes his socks: ''I saw the Prophet do it''; they liked it because Jarir became Muslim after al-Māʾida
      was revealed'
    cluster: revelation
  wipes-over-leather-socks:
    label: He wiped over the leather socks (khuffs)
    cluster: law
  ask-no-one-after-sad:
    label: 'Umar: when Saʿd tells you something from the Prophet ask no one else about it'
    cluster: transmission
  wipes-over-turban-and-socks:
    label: He wiped over the socks and the head-cloth (khimār, turban)
    cluster: law
  let-the-water-touch-the-hair:
    label: 'Asked about wiping over the turban: ''let the hair be touched by the water'''
    cluster: law
  turbans-and-foot-warmers-for-cold-troop:
    label: A troop struck by cold is told to wipe over their turbans (ʿaṣāʾib) and foot-warmers (tasākhīn)
    cluster: law
  removes-socks-for-love-of-washing:
    label: 'Abu Ayyub removes his socks: ''I saw him wipe over them, but washing is made dear to me'''
    cluster: ritual
  three-days-traveller-one-day-resident:
    label: 'Wiping the socks: three days and nights for the traveller, a day and a night for the resident'
    cluster: law
  socks-kept-on-except-for-janaba:
    label: Travellers keep their socks on three days except for major impurity, but not for stool, urine or sleep
    cluster: law
  ask-ali-he-travelled-with-him:
    label: 'Asked about wiping the socks, Aisha: ''ask Ali, for he travelled with the Prophet'''
    cluster: transmission
  tabuk-command-to-wipe:
    label: At the campaign of Tabuk he ordered wiping the socks three days for the traveller, a day and a night for the resident
    cluster: law
  wipes-over-socks-and-sandals:
    label: He made ablution and wiped over the woollen socks (jawrabayn) and the sandals
    cluster: law
  four-practices-of-ibn-umar:
    label: '''I saw you do four things none of your fellows does'', among them wearing hairless sibtī sandals'
    cluster: sira
  if-religion-were-by-opinion-underside:
    label: '''Were religion by opinion, the underside of the sock would be worthier of wiping than its top'''
    cluster: law
  wipe-top-of-socks:
    label: He wiped over the socks on their top
    cluster: law
units:
- id: hadith-6-make-up-fast-not-prayer
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The menstruant makes up the fast, not the prayer
  read:
  - Jāmiʿ 6:985.1
  tags:
  - motif: menstruant-makes-up-fast-not-prayer
    refs:
    - Jāmiʿ 6:985.1
    note: فنُؤمر بقضاء الصوم، ولا نؤمر بقضاء الصلاة
  - motif: asked-are-you-a-haruri
    refs:
    - Jāmiʿ 6:985.1
    note: 'أحرورية أنتِ؟ قلت: لست بحرورية، ولكني أسأل'
- id: hadith-6-postpartum-forty-days
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The woman after childbirth sits forty days
  read:
  - Jāmiʿ 6:985.2
  tags:
  - motif: postpartum-woman-sits-forty-days
    refs:
    - Jāmiʿ 6:985.2
    note: كانت النُّفساءُ تَجلِسُ على عهدِ رسول الله ﷺ أربعينَ يومًا
  - motif: face-smeared-with-wars-against-blotches
    refs:
    - Jāmiʿ 6:985.2
    note: فكنَّا نَطلي وُجوهَنا بالورس منَ الكَلَفِ
  hints:
  - Forty days after childbirth against Lev 12:2-4, where after a son she is unclean seven days and then 'sits' (tēšēb) thirty-three
    days in the blood of purity, forty in all (eighty for a daughter, 12:5)
- id: hadith-6-menstrual-blood-on-garment
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Washing menstrual blood from the garment
  read:
  - Jāmiʿ 6:986.1-987.2
  tags:
  - motif: menstrual-blood-pinched-sprinkled-prayed-in
    refs:
    - Jāmiʿ 6:986.1
    note: لتَقرُصه، ثم لتَنضحه بماء، ثم لتُصَلِّي فيه
  - motif: single-garment-blood-scraped-with-saliva-and-nail
    refs:
    - Jāmiʿ 6:987.1
    note: 'ما كان لإحدانا إلَّا ثوب واحد تحيض فيه؛ فإذا أصابه شيءٌ من دم قالت بريقها: فقصعته بظفرها'
  - motif: blood-scraped-with-rib-washed-with-lote
    refs:
    - Jāmiʿ 6:987.2
    note: حُكِّيه بضِلَع واغسِليه بماء وسِدرٍ
  hints:
  - 'Saliva and a plant cleanser for a bloodstain against m. Niddah 9:6, the seven substances passed over a stain: tasteless
    saliva, water of crushed beans, urine, natron, borit, cimolian earth and ashlag'
- id: hadith-6-prayer-beside-the-menstruant
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Praying beside the menstruating wife
  read:
  - Jāmiʿ 6:988.1-988.2
  tags:
  - motif: prophets-garment-touches-menstruant-in-prostration
    refs:
    - Jāmiʿ 6:988.1
    note: وهي مفترشة بحذاء مسجد رسول الله ﷺ وهو يصلي على خمرته، إذا سجد أصابني بعض ثوبه
  - motif: one-wrap-over-praying-man-and-menstruant
    refs:
    - Jāmiʿ 6:988.2
    note: وأنا إلى جنبه، وأنا حائضٌ، وعليَّ مِرطٌ، وعليه بعضه إلى جنبه
  hints:
  - The praying man's garment touching the menstruant against Lev 15:19-23, where whoever touches her or anything she lies
    on is unclean until evening
- id: hadith-6-garment-of-intercourse-and-coverlets
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Praying in the garment of intercourse; not in the wives' coverlets
  read:
  - Jāmiʿ 6:988.3-989.1
  tags:
  - motif: prays-in-garment-of-intercourse-unless-stained
    refs:
    - Jāmiʿ 6:988.3
    note: 'هل كان النبي ﷺ يصلي في الثوب الذي يجامعها فيه؟ فقال: نعم، إذا لم ير فيه أذىً'
  - motif: no-prayer-in-wives-coverlets
    refs:
    - Jāmiʿ 6:989.1
    note: كان رسول الله ﷺ لا يصلي في شُعُرنا، أو في لُحفِنا
  hints:
  - The garment of intercourse prayed in unless stained, against Lev 15:17, where every garment with semen on it is washed
    and unclean until evening
- id: hadith-6-drinking-and-eating-with-the-menstruant
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Drinking from her place and eating with the menstruant
  read:
  - Jāmiʿ 6:989.2-990.1
  tags:
  - motif: drinks-and-bites-where-menstruant-put-her-mouth
    refs:
    - Jāmiʿ 6:989.2
    note: كنت أشرب وأنا حائض، ثم أناولُه النبي ﷺ، فيضع فاه على موضع فيّ فيشربُ، وأتعرّقَ وأنا حائض
  - motif: eat-with-the-menstruant
    refs:
    - Jāmiʿ 6:990.1
    note: 'سألت النبي ﷺ عن مؤاكلة الحائض فقال: واكِلها'
  hints:
  - 'Eating and drinking from the menstruant''s place against the rabbinic separation of the niddah at table (t. Shabbat 1:14;
    b. Shabbat 13a: ''the zav shall not eat with the zavah'')'
- id: hadith-6-lying-with-the-menstruant
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Lying under one cover with the menstruant
  read:
  - Jāmiʿ 6:990.2-991.2
  tags:
  - motif: slips-away-at-menses-and-is-called-back-under-the-cover
    refs:
    - Jāmiʿ 6:990.2
    note: 'فانسلَلتُ فأخذت ثياب حِيضتي، قال: أنُفِست؟ قلت: نعم، فدعاني فاضطجعت معه في الخَميلة'
  - motif: lies-with-menstruant-cloth-between
    refs:
    - Jāmiʿ 6:990.3
    note: يضطجع معي وأنا حائض، وبيني وبينه ثوب
  - motif: only-the-spot-washed-not-beyond
    refs:
    - Jāmiʿ 6:991.1
    note: نبيت في الشِّعار الواحد وأنا حائض طامث، فإن أصابه مني شيءٌ غسل مكانه، ولم يَعدُه، ثم صلَّى فيه
  - motif: lies-with-menstruant-cloth-between
    refs:
    - Jāmiʿ 6:991.2
    note: كنت أتزر وأنا حائض، ثم أدخل مع رسول الله ﷺ في لحافه
  hints:
  - Lying under one blanket with the menstruant against the tale in b. Shabbat 13a (Avot de-Rabbi Natan A 2) of the scholar
    who died young because in her days 'he ate with me, drank with me and slept with me in bodily contact'
- id: hadith-6-fondling-above-the-wrap
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Touching the menstruant above the waist-wrap
  read:
  - Jāmiʿ 6:991.3-992.2
  quran:
  - 2:222
  tags:
  - motif: fondles-menstruant-over-waist-wrap
    refs:
    - Jāmiʿ 6:991.3
    - Jāmiʿ 6:991.4
    note: أمرها أن تتّزر في فور حَيضتِها، ثم يُباشرها ... أمرها فاتَّزرت وهي حائض
  - motif: who-controls-his-desire-as-he-did
    refs:
    - Jāmiʿ 6:991.3
    note: وأيكم يملِكُ إربَه كما كان رسول الله ﷺ يملك إربَه
  - motif: jews-isolate-the-menstruant
    refs:
    - Jāmiʿ 6:992.1
    note: إذا حاضت المرأةُ فيهم لم يؤاكِلُوها ولم يُجامِعوهنّ في البيوت ... اصنعوا كل شيء إلا النكاح
  - motif: jews-angered-he-leaves-nothing-undifferent
    refs:
    - Jāmiʿ 6:992.1
    note: ما يريد هذا الرجل أن يَدَعَ من أمرنا شيئًا إلَّا خالَفَنا فيه
  - motif: companions-ask-to-have-intercourse-to-differ-from-jews
    refs:
    - Jāmiʿ 6:992.1
    note: أفلا نُجامِعهنَّ؟ فتَغيَّر وجهُ رسول الله ﷺ ... فأرسل في آثارهما فسقاهما
  - motif: cloth-laid-over-menstruants-private-part
    refs:
    - Jāmiʿ 6:992.2
    note: كان إذا أراد من الحائض شيئًا ألقي على فرجها ثوبًا
  hints:
  - The Jews not sharing the house with the menstruant against m. Niddah 7:4, which knows 'houses of uncleanness' (bēt ha-ṭumʾot)
    set apart for menstruants
  - '''Everything except intercourse'' against Ezek 18:6 and Lev 18:19, where approaching a niddah is forbidden, and the rabbinic
    fence against any intimacy in her days (b. Shabbat 13a)'
- id: hadith-6-combing-in-retreat
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The menstruant combs his hair through the door of the mosque
  read:
  - Jāmiʿ 6:993.1
  tags:
  - motif: menstruant-combs-hair-of-man-in-retreat
    refs:
    - Jāmiʿ 6:993.1
    note: يُدني لها رأسَه وهي في حُجرتِها، فترجِّلُه وهي حائض
- id: hadith-6-menstruation-not-in-the-hand
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: '''Your menstruation is not in your hand'''
  read:
  - Jāmiʿ 6:993.2-994.1
  tags:
  - motif: your-menstruation-is-not-in-your-hand
    refs:
    - Jāmiʿ 6:993.2
    - Jāmiʿ 6:994.1
    note: 'ناوليني الخُمرةَ من المسجد. قالت قلت: إنِّي حائض، قال: إن حَيضتَكِ ليست في يدك'
  hints:
  - The menstruant's hand not carrying her state against Lev 15:19-21, where her touch conveys uncleanness to persons and
    objects
- id: hadith-6-menstruant-anus-soothsayer
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Going to the menstruant, the anus, or the soothsayer
  read:
  - Jāmiʿ 6:995.1
  tags:
  - motif: intercourse-during-menstruation-forbidden
    refs:
    - Jāmiʿ 6:995.1
    note: من أتى حائضًا
  - motif: menstruant-anus-soothsayer-disbelief
    refs:
    - Jāmiʿ 6:995.1
    note: من أتى حائضًا أو امرأةٌ في دبرها، أو كاهنًا، فقد كفر بما أنزل على محمد
  hints:
  - Lying with a menstruant ranked with the gravest sins, against Lev 20:18 (both cut off) and Ezek 18:6 (among the marks
    of the wicked)
- id: hadith-6-yellow-and-turbid
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Yellow and turbid discharge not counted
  read:
  - Jāmiʿ 6:996.1
  tags:
  - motif: yellow-and-turbid-not-counted
    refs:
    - Jāmiʿ 6:996.1
    note: كنّا لا نَعُدّ الكدرة والصفرةَ شيئًا
  hints:
  - Yellowish discharge not counted against m. Niddah 2:6-7, where five colours of blood are unclean, including 'like bright
    crocus'
- id: hadith-6-prolonged-bleeding-a-vein
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Prolonged bleeding is a vein, not menstruation
  read:
  - Jāmiʿ 6:997.1-999.1
  tags:
  - motif: prolonged-bleeding-a-vein-not-menstruation
    refs:
    - Jāmiʿ 6:997.1
    - Jāmiʿ 6:998.1
    note: إنَّما ذلك عرق، وليست بالحَيضة؛ فإذا أقبلت الحَيضةُ فاتُركِي الصلاة، فإذا ذهب قدرُها فاغسِلي عن الدم وصلِّي
  - motif: count-the-days-of-the-former-cycle
    refs:
    - Jāmiʿ 6:997.2
    - Jāmiʿ 6:999.1
    note: لتنظر إلى عددِ الليالي والأيام التي كانت تحيضُهُنّ من الشَّهر قبل أن يُصِيبَها الذي أصابها؛ فلتتركِ الصلاةَ قدرَ
      ذلك
  - motif: bind-a-cloth-and-pray
    refs:
    - Jāmiʿ 6:997.2
    note: فإذا خلَّفت ذلك فلتغتَسِل، ثم لتستنفر بثوب، ثم لتصلي
  - motif: bathes-in-tub-till-red-rises-over-water
    refs:
    - Jāmiʿ 6:998.1
    note: أُستحيضت سبع سنين ... فكانت تغتسل في مِركن في حجرة أختها زينب بنت جحش حتَّى تعلُو حمرةُ الدمِ الماءَ
  - motif: wept-because-she-could-not-pray
    refs:
    - Jāmiʿ 6:998.1
    note: يرحم الله هندًا! ... إن كانت لتبكي لأنها كانت لا تصلي
  hints:
  - The woman bleeding beyond her days counted by her former cycle, then praying, against Lev 15:25-30, where the zavah is
    unclean all the days of the flow, counts seven clean days and brings two birds
- id: hadith-6-bleeding-woman-bathing
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The bleeding woman bathes for every prayer or combines
  read:
  - Jāmiʿ 6:1000.1-1001.2
  tags:
  - motif: bleeding-woman-bathes-for-every-prayer
    refs:
    - Jāmiʿ 6:1000.1
    note: أن رسول الله ﷺ أمرها أن تغتسل عند كل صلاة وتصلي
  - motif: prolonged-bleeding-is-from-satan
    refs:
    - Jāmiʿ 6:1001.1
    note: سبحان الله! إن هذا من الشيطان
  - motif: three-baths-a-day-after-yellow-on-water
    refs:
    - Jāmiʿ 6:1001.1
    note: لتجلس في مِركن، فإذا رأت صفرةً فوق الماء فلتغتسل للظهر والعصر غسلًا واحدًا، وتغتسل للمغرب والعشاء غُسلًا واحدًا،
      وتغتسل للفجر
  - motif: bleeding-is-a-kick-of-satan
    refs:
    - Jāmiʿ 6:1001.2
    note: إنَّما هذه رَكْضةٌ من رَكضاتِ الشيطان
  - motif: menstruate-six-or-seven-days-in-gods-knowledge
    refs:
    - Jāmiʿ 6:1001.2
    note: فتحيَّضي سِتّة أيام أو سبعة في علم الله ... فصَلِّي ثلاثًا وعشرين ليلة، أو أربعًا وعشرين ليلة
  - motif: cotton-cloth-then-gushing
    refs:
    - Jāmiʿ 6:1001.2
    note: أنْعَتُ لكِ الكُرْسُفَ ... اتّخذِي ثوبًا ... إنَّما أثجُّ ثجًّا
  - motif: two-commands-either-suffices
    refs:
    - Jāmiʿ 6:1001.2
    note: سآمرك بأمرين أيَّهما فعلتِ أجزأ عنك من الآخر ... وهذا أعجبُ الأمرين إليّ
  hints:
  - Six or seven days of menstruation against Lev 15:19, 'seven days she shall be in her impurity'
- id: hadith-6-black-blood-and-ablution
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Black blood is known; ablution for every prayer
  read:
  - Jāmiʿ 6:1003.1-1004.1
  tags:
  - motif: prolonged-bleeding-a-vein-not-menstruation
    refs:
    - Jāmiʿ 6:1003.1
    note: إنَّما ذلك عِرقٌ، وليستْ بالحيضة
  - motif: ablution-for-every-prayer-of-bleeding-woman
    refs:
    - Jāmiʿ 6:1003.1
    note: ثمَّ توضَّئي لكلِّ صلاةٍ حتَّى يجيء ذلك الوقت
  - motif: menstrual-blood-black-and-known
    refs:
    - Jāmiʿ 6:1004.1
    note: إذا كان دمُ الحيضة - فإنه دم أسود يُعرف - فإذا كان ذلك فأمْسكي عن الصلاة، فإذا كان الآخر فتوضّئِي وصَلِّي
  hints:
  - Menstrual blood known by being black against m. Niddah 2:6, where black is one of the five unclean colours ('like ink')
- id: hadith-7-deeds-by-intentions
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Deeds by intentions
  read:
  - Jāmiʿ 7:1006.1
  quran:
  - '98:5'
  tags:
  - motif: deeds-judged-by-intention
    refs:
    - Jāmiʿ 7:1006.1
    note: إنما الأعمال بالنيات، وإنما لكل امرئ ما نوى
  - motif: emigration-for-world-or-woman
    refs:
    - Jāmiʿ 7:1006.1
    note: ومن كانت هجرته لدنيا يُصيبها، أو امرأةٍ يتزوجها فهجرته إلى ما هاجر إليه
- id: hadith-7-ablution-in-gods-name
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Ablution in God's name; water from his fingers
  read:
  - Jāmiʿ 7:1006.2
  tags:
