    note: فلم يؤت إلَّا بالسويق، فأكلنا وشربنا، ثم قام النبي ﷺ إلى المغرب، فمضمض، ثم صلَّى المغرب ولم يتوضأ
  - motif: all-prayers-with-one-ablution-on-purpose
