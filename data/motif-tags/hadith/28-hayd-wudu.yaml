    refs:
    - Jāmiʿ 7:1059.1
    - Jāmiʿ 7:1060.1
    - Jāmiʿ 7:1060.2
    note: إذا كان جُنبًا فأراد أن يأكل أو ينام، توضأ وضوءه للصلاة ... توضأ واغسل ذكرك، ثُمَّ نَمْ
  - motif: leapt-and-poured-water-not-stood-and-bathed
    refs:
    - Jāmiʿ 7:1060.3
    note: 'قالت: وَثَب (ولا والله! ما قالت: قام) فأفاض عليه الماء، (ولا والله! ما قالت: اغتسل، وأنا أعلم ما تريد)'
  - motif: ablution-between-two-intercourses
    refs:
    - Jāmiʿ 7:1061.1
    note: إذا أتى أحدكم أهلَه، ثم بدا له أن يُعاود فليتوضّأ بينهما وضوءًا
  hints:
  - The man after emission sleeping after only an ablution against Lev 15:16-18 and Deut 23:11-12, where he bathes in water
    and is unclean until evening
- id: hadith-7-camel-meat
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Ablution from camel meat, not mutton
  read:
  - Jāmiʿ 7:1062.1-1062.2
  tags:
  - motif: ablution-after-camel-meat-not-mutton
    refs:
    - Jāmiʿ 7:1062.1
    - Jāmiʿ 7:1062.2
