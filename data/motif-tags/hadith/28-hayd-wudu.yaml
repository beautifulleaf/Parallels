    - Jāmiʿ 7:1040.2
    note: فمضمض ثلاثًا، واستنشق ثلاثًا، وغسل وجهه ثلاثًا ... توضأ ثلاثًا ثلاثًا
- id: hadith-7-not-with-the-mouth-first
