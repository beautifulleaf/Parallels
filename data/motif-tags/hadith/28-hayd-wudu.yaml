  - motif: angels-pray-for-one-awaiting-prayer
    refs:
    - Jāmiʿ 7:1055.3
    note: 'ثم يجلس في المجلس ينتظر الصلاة الأُخرى، إن الملائكة تقول: اللَّهم! اغفر له، اللهم! ارحمه'
  - motif: sees-the-rows-from-behind-his-back
    refs:
    - Jāmiʿ 7:1055.3
    note: فاعدلوا صفوفكم، وأقيموها، وسُدّوا الفُرَج؛ فإني أراكم من وراءِ ظهري
  - motif: women-lower-eyes-in-mens-prostration
    refs:
    - Jāmiʿ 7:1055.3
    note: يا معشر النساء! إذا سجد الرجال فاغْضُضْنَ أبصاركُنَّ؛ لا ترين عورات الرجال من ضيق الأزُر
  hints:
  - Nakedness exposed by bowing worshippers against Exod 20:26, no steps to the altar 'that your nakedness be not exposed
    on it', and the linen breeches of Exod 28:42
- id: hadith-7-ablution-at-every-prayer
