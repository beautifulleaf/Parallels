# Hadith chunk 14: al-Jāmiʿ al-Kāmil book 60 (tafsir), pp. 7300-7419: the end of al-Qasas (28:82-85),
# al-ʿAnkabut, al-Rum, Luqman, al-Sajda, al-Ahzab, Saba', Fatir, Ya Sin, al-Saffat, Sad, al-Zumar and the
# opening of Ghafir (40:7-14). Read in full from the Arabic (239 hadith).
new_motifs:
  god-gives-world-to-loved-and-unloved-faith-only-to-loved: {label: "God apportions characters as he apportions provision; he gives the world to whom he loves and whom he does not, but faith only to whom he loves", cluster: theology}
  god-revealed-be-humble-none-boast-over-another: {label: "God revealed to the prophet: be humble, so that none boasts over another and none wrongs another", cluster: ethics}
  atom-of-pride-bars-paradise-god-beautiful: {label: "No one with an atom's weight of pride enters paradise; a man liking fine clothes and sandals is told God is beautiful and loves beauty; pride is spurning truth and despising people", cluster: ethics}
  return-to-a-place-is-mecca: {label: "'He will bring you back to a place of return' (ma'ad) glossed by Ibn Abbas: to Mecca", cluster: revelation}
  mother-hunger-strike-against-sons-faith: {label: "A mother swears not to speak to her son, eat or drink until he renounces his religion; after three days she faints and is given drink; verses on parents come down", cluster: sira}
  bequest-capped-at-one-third: {label: "A sick man asks to bequeath all, then half, then a third; the prophet refuses, refuses, then falls silent; a third became the permitted limit", cluster: law}
  camel-jaw-strikes-nose-at-wine-party: {label: "At a wine party in a garden before wine was banned, a man strikes a boasting guest with the jawbone of a roast camel's head and splits his nose; the wine verse comes down", cluster: sira}
  spoils-sword-returned-to-pile: {label: "A man asks the prophet for a sword from the spoils; told 'put it back where you took it' twice; the verse on spoils comes down", cluster: sira}
  meccan-converts-forced-out-to-badr-killed: {label: "Secret Meccan converts forced out with the polytheists at Badr are killed; verses are written to those left in Mecca that they have no excuse; they set out, are caught and give in", cluster: sira}
  caller-to-guidance-shares-reward-caller-to-error-shares-sin: {label: "Whoever calls to guidance has the reward of all who follow him and whoever calls to error bears the sin of all who follow him, without lessening theirs", cluster: ethics}
  first-son-of-adam-shares-every-unjust-killing: {label: "No soul is killed unjustly but the first son of Adam bears a share (kifl) of its blood, for he first made killing a custom", cluster: primeval}
  the-bankrupt-pays-with-good-deeds-then-takes-sins: {label: "The bankrupt of the community comes with prayer, fasting and alms but has reviled, slandered, devoured property and shed blood; his good deeds are paid out, then the victims' sins thrown on him and he is cast in the fire", cluster: eschatology}
  wronged-paid-from-good-deeds-at-judgment: {label: "On judgment day a man with good deeds like mountains is called; all with claims against him come; 'pay from his good deeds' until none remain, then 'take of their sins and load them on him'", cluster: eschatology}
  belief-in-decree-condition-of-accepted-spending: {label: "Were you to spend gold like Uhud in God's path he would not accept it until you believe in the decree: what struck you could not have missed you", cluster: theology}
  night-prayer-will-stop-the-thief: {label: "Told a man prays by night and steals by morning, the prophet says: what you say (his prayer) will stop him", cluster: ethics}
  neither-believe-nor-deny-people-of-the-book: {label: "When the People of the Book read the Torah in Hebrew and explain it in Arabic: neither believe nor disbelieve them; say 'we believe in God and what was sent down'", cluster: polemic}
  does-the-bier-speak: {label: "A Jew asks whether a passing bier speaks; the prophet says God knows; the Jew says it speaks; the prophet: do not believe or deny what the People of the Book tell you", cluster: polemic}
  book-not-washed-away-by-water-read-asleep-and-awake: {label: "God says: I sent down on you a book that water does not wash away, which you recite asleep and awake", cluster: revelation}
  each-prophet-given-signs-mine-is-revelation: {label: "Every prophet was given signs at which people believed; what I was given is revelation, so I hope to have the most followers on the day of resurrection", cluster: revelation}
  paradise-chamber-seen-through-from-inside-and-out: {label: "In paradise is a chamber whose outside is seen from its inside and inside from its outside, for him who feeds, speaks gently, fasts in succession and prays while people sleep", cluster: eschatology}
  rome-persia-wager-on-bid-years: {label: "Abu Bakr makes a wager with the Meccans on the Romans defeating the Persians; a term of years is fixed too short (five or six) and lost; 'bid' is under ten; the Romans win later", cluster: sira}
  abu-bakr-cries-the-verse-through-mecca: {label: "When 'the Romans have been defeated' comes down, Abu Bakr goes out shouting it through the quarters of Mecca", cluster: sira}
  five-signs-already-past: {label: "Ibn Masud: five have passed: the smoke, the lizam, the Romans, the great seizure and the moon", cluster: eschatology}
  say-god-knows-is-part-of-knowledge: {label: "Ibn Masud angered by a storyteller: whoever knows let him speak, whoever does not say 'God knows'; that is part of knowledge", cluster: ethics}
  subhan-allah-wa-bihamdihi-hundred-times: {label: "Saying 'glory to God and his praise' a hundred times a day erases sins though like the foam of the sea; morning and evening none brings better", cluster: ritual}
  son-of-adam-belies-and-reviles-god: {label: "God says: the son of Adam belied me (saying I will not restore him as I began him) and reviled me (saying God took a son); I am the One, the Samad", cluster: theology}
  servants-created-hanif-devils-led-them-off: {label: "God says: I created my servants all hanif; devils came and led them away (ijtalathum) from their religion, forbade what I allowed and bade them associate", cluster: theology}
  believers-affair-all-good-thanks-and-patience: {label: "Wondrous is the believer's affair: in prosperity he gives thanks, in hardship he is patient, and both are good for him", cluster: ethics}
  god-keeps-what-is-entrusted: {label: "Luqman the sage used to say: when God is entrusted with a thing he guards it", cluster: wisdom}
  greatest-sins-rival-to-god-killing-child-neighbours-wife: {label: "The greatest sin: to set up a rival to God who created you; then to kill your child fearing it will eat with you; then to commit adultery with your neighbour's wife", cluster: law}
  wrong-in-verse-is-shirk-as-luqman-said: {label: "When 'did not mix their faith with wrong' troubled the companions, the prophet said it is not as they think but as Luqman told his son: association is a great wrong", cluster: revelation}
  nose-in-dust-who-missed-paradise-with-old-parents: {label: "'May his nose be in the dust' three times: whoever reached his parents' old age, one or both, and did not thereby enter paradise", cluster: ethics}
  greatest-of-great-sins-false-witness-repeated: {label: "The greatest of great sins: association, disobeying parents; then, sitting up from reclining, 'false speech and false witness' repeated until they wished he would stop", cluster: ethics}
  hardest-trial-prophets-then-the-next-best: {label: "Most severely tried are the prophets, then the next best; a man is tried by the measure of his religion until he walks the earth without sin", cluster: ethics}
  dishevelled-one-whose-oath-god-fulfils: {label: "Many a dishevelled man driven from doors, were he to swear by God, God would fulfil his oath", cluster: ethics}
  gabriel-asks-iman-islam-ihsan-and-the-hour: {label: "A stranger asks the prophet what faith, islam and ihsan are and when the Hour is; he names its signs; the stranger vanishes: it was Gabriel come to teach people their religion", cluster: angelology}
  signs-of-hour-slave-bears-mistress-herders-build-tall: {label: "Signs of the Hour: the slave woman bears her mistress, the barefoot naked become heads of the people, herders of camels compete in tall buildings", cluster: eschatology}
  ask-may-i-enter-greeting-first: {label: "A man asks entry with 'may I come in?'; the prophet sends a servant to teach him to say 'peace be upon you, may I enter?'", cluster: law}
  death-place-set-by-a-need-there: {label: "When God decrees a man shall die in a land he gives him a need there; at the farthest point of his trace God takes him, and the earth says on the last day: Lord, this is what you entrusted to me", cluster: eschatology}
  sajda-and-mulk-read-friday-dawn-and-before-sleep: {label: "The prophet read al-Sajda (Alif Lam Mim Tanzil) and al-Mulk in the Friday dawn prayer, and would not sleep before reading them", cluster: ritual}
  alms-quench-sin-as-water-quenches-fire: {label: "Fasting is a shield; alms extinguish sin as water extinguishes fire; and a man's prayer in the depth of night (then 32:16 is recited)", cluster: ethics}
  night-prayer-custom-of-righteous-before-you: {label: "Night prayer is the custom of the righteous before you, nearness to your Lord, expiation of sins and a bar to wrongdoing", cluster: ritual}
  god-marvels-at-man-leaving-bed-and-fighter-returning: {label: "God marvels at two men: one who leaves bed, wife and blanket for prayer, one who turns back to the fight until his blood is shed; 'look, my angels, at my servant'", cluster: theology}
  isha-in-congregation-like-half-night: {label: "Whoever prays the night prayer in congregation is as if he stood half the night; whoever prays dawn in congregation as if he prayed all night", cluster: ritual}
  what-no-eye-has-seen-no-ear-heard: {label: "God prepared for his righteous servants what no eye has seen, no ear heard, and has not occurred to a human heart", cluster: eschatology}
  moses-asks-lowest-and-highest-rank-in-paradise: {label: "Moses asks God about the lowest in paradise (a king's dominion and its like four times, then tenfold) and the highest, whose honour God planted with his hand and sealed", cluster: eschatology}
  lesser-punishment-is-worldly-afflictions: {label: "The 'nearer punishment' glossed by Ubayy: afflictions of this world, the Romans, the seizure or the smoke", cluster: eschatology}
  zayd-called-son-of-muhammad-until-verse: {label: "Zayd b. Haritha was called 'Zayd son of Muhammad' until 'call them by their fathers' came down", cluster: law}
  adoptee-salim-returned-to-father-or-client: {label: "Abu Hudhayfa adopted Salim and married him to his niece; after the verse adoptees were returned to their fathers, or became clients and brothers in religion", cluster: law}
  four-jahiliyya-customs-community-keeps: {label: "Four things of the Jahiliyya my community will not give up: boasting of lineage, attacking lineage, seeking rain from the stars and wailing", cluster: ethics}
  claiming-false-father-is-unbelief: {label: "Whoever claims a man not his father, knowing it, has disbelieved; whoever claims a people not his, let him take his seat in the fire", cluster: law}
  calls-companion-ya-bunayya: {label: "The prophet calls Anas 'my little son' (ya bunayya)", cluster: sira}
  prophet-pays-dead-believers-debts: {label: "The prophet would not pray over a man who died in debt without leaving payment; after the conquests: I am nearer the believers than themselves; whoever leaves a debt, its payment is on me; whoever leaves wealth, it is his heirs'", cluster: law}
  sworn-brothers-inherited-until-abrogated: {label: "A man would ally with an unrelated man and inherit from him, until 'blood relatives are nearer to one another' abrogated it; Zubayr inherited from Ka'b b. Malik by brotherhood until then", cluster: law}
  prayer-cover-our-weaknesses-calm-our-fears: {label: "On the day of the Trench: say 'O God cover our weak points and make safe our fears'; God routed them by the wind", cluster: ritual}
  victory-by-east-wind-ad-destroyed-by-west: {label: "I was helped by the east wind (saba) and Ad were destroyed by the west wind (dabur)", cluster: cosmology}
  spy-walks-as-in-bathhouse-warmth: {label: "The spy sent into the cold night walks going and coming 'as if in a bathhouse'; he spares Abu Sufyan warming his back at the fire; on return he feels the cold and sleeps in the prophet's cloak: 'up, sleeper!'", cluster: sira}
  lost-verse-found-only-with-khuzayma: {label: "Copying the codices, Zayd b. Thabit misses a verse of al-Ahzab he heard the prophet recite and finds it only with Khuzayma, whose testimony counted as two men's", cluster: revelation}
  anas-ibn-nadr-smells-paradise-before-uhud: {label: "Anas b. al-Nadr, absent from Badr, at Uhud says 'paradise, by the Lord of al-Nadr! I find its scent beyond Uhud'; found with eighty-odd wounds, recognised only by his sister from his fingertips", cluster: sira}
  man-in-green-is-one-who-fulfilled-vow: {label: "Asked three times who 'fulfilled his vow', the prophet turns away; when Talha enters in green garments: 'this is one who fulfilled his vow'", cluster: sira}
  prayer-against-confederates-shake-them: {label: "'O God, revealer of the Book, swift in reckoning, rout the Confederates, rout them and shake them'", cluster: ritual}
  four-prayers-missed-at-trench-made-up-in-order: {label: "Held back from noon, afternoon, sunset and night prayers on the day of the Trench, after relief Bilal gives the iqama for each and they are prayed in order, before the fear-prayer verse", cluster: ritual}
  god-alone-defeated-the-confederates: {label: "'No god but God alone, who strengthened his army, helped his servant and alone defeated the Confederates; nothing after him'", cluster: ritual}
  now-we-raid-them-not-they-us: {label: "When the Confederates withdrew: 'now we raid them and they do not raid us; we go to them'", cluster: sira}
  saad-judges-qurayza-by-gods-judgment: {label: "Sa'd, wounded in the median vein, is given the judgment on Qurayza: fighters killed, women and children taken, property divided; 'you judged with God's judgment'", cluster: sira}
  aisha-first-to-be-offered-choice: {label: "The prophet begins with Aisha, telling her not to hasten but to consult her parents; she says: in what would I consult my parents? I want God, his messenger and the last abode", cluster: sira}
  umar-and-neighbour-alternate-days-at-prophet: {label: "Umar and an Ansari neighbour take turns going down to the prophet, each bringing back the day's revelation and news", cluster: sira}
  month-of-twenty-nine-nights: {label: "Having sworn not to go in to his wives for a month, the prophet comes after twenty-nine nights: 'the month is twenty-nine nights'", cluster: law}
  prophet-on-mat-marks-on-side-three-hides: {label: "Umar finds the prophet lying on a palm-rope mat with nothing between, its weave marked on his side, on a leather pillow stuffed with fibre; nothing in the house but three hides", cluster: sira}
  persians-and-romans-got-good-things-early: {label: "Asked to pray for plenty like Persia and Rome: 'those are a people whose good things were hastened to them in this life'", cluster: ethics}
  abu-bakr-and-umar-jab-daughters-necks: {label: "Abu Bakr and Umar rise and jab the necks of Aisha and Hafsa for asking the prophet for maintenance he does not have", cluster: sira}
  sent-as-teacher-not-to-make-hardship: {label: "'God did not send me to make things hard or seek out hardship, but as a teacher who makes things easy'", cluster: ethics}
  choice-not-counted-as-divorce: {label: "'The prophet gave us the choice, we chose God and his messenger, and it was not counted against us as anything' (not a divorce)", cluster: law}
  household-verse-for-prophets-wives: {label: "Ibn Abbas: 'God wishes to remove impurity from you, people of the house' came down about the prophet's wives specifically", cluster: revelation}
  cloak-wrapped-over-ali-fatima-hasan-husayn: {label: "The prophet wraps Hasan, Husayn, Fatima and Ali in his cloak (mirt, kisa') and recites the purification verse: 'these are my household'", cluster: sira}
  umm-salama-told-you-are-in-your-place: {label: "Umm Salama asks 'and I with them?' and is told 'you are in your place, you are on good'", cluster: sira}
  wathila-also-of-the-family: {label: "Wathila from the side of the house asks 'and I, of your family?': 'and you are of my family'", cluster: sira}
  women-ask-why-not-mentioned-verse-names-both: {label: "Women (Umm Salama, Umm Umara) ask why the Quran mentions men and not women; the verse naming Muslim men and women, believing men and women ... comes down", cluster: revelation}
  umm-salama-hears-verse-at-palm-frond-wall: {label: "Umm Salama, combing her hair, gathers it and puts her ear to the palm-frond partition to hear the prophet recite the verse from the pulpit", cluster: sira}
  julaybib-marriage-girl-overrules-parents: {label: "The prophet asks an Ansari's daughter in marriage for Julaybib; the mother refuses ('Julaybib?!' thrice); the girl: would you refuse the prophet's command? Give me to him", cluster: sira}
  julaybib-killed-seven-buried-on-prophets-forearms: {label: "Julaybib is found beside seven he had killed; 'he is of me and I of him'; with no bier but the prophet's forearms he is laid in the grave, unwashed", cluster: sira}
  most-beloved-of-family-fatima-then-usama: {label: "Asked which of his family he loves most: Fatima; then Usama son of the one 'God favoured and you favoured'", cluster: sira}
  had-he-concealed-anything-this-verse: {label: "Aisha: had the prophet concealed anything of what was sent down he would have concealed this verse (33:37)", cluster: revelation}
  awe-of-people-no-bar-to-speaking-truth: {label: "Let awe of people not stop any of you from speaking the truth when he sees, witnesses or hears it", cluster: ethics}
  prophet-is-the-missing-corner-brick: {label: "My likeness and the prophets' before me is a man who built a fine house but for one brick in a corner; people walk round admiring it and say 'why was this brick not set?' I am that brick; I am the seal of the prophets", cluster: christology}
  mufarridun-are-those-who-remember-god: {label: "Passing the mountain Jumdan: 'the mufarridun have gone ahead': those, men and women, who remember God much", cluster: ritual}
  remembrance-better-than-gold-and-jihad: {label: "Best of deeds and better than spending gold and silver or meeting the enemy and striking necks: the remembrance of God", cluster: ritual}
  captive-mother-suckles-found-child-god-more-merciful: {label: "A captive woman who finds a child among the captives presses it to her belly and suckles it; 'would she throw her child in the fire? God is more merciful to his servants than she to her child'", cluster: theology}
  mother-runs-crying-my-son-god-will-not-cast-beloved: {label: "A mother runs crying 'my son, my son' lest he be trampled; the prophet: no, God does not cast his beloved into the fire", cluster: theology}
  not-crude-nor-loud-in-markets: {label: "In the Torah's description: not crude nor harsh nor shouting in the markets, not repaying evil with evil, but pardoning; he opens blind eyes, deaf ears and uncircumcised hearts", cluster: christology}
  bride-seeks-refuge-from-prophet-sent-home: {label: "Al-Jawniyya, told 'give yourself to me', answers 'does a queen give herself to a commoner?' and 'I seek refuge with God from you'; 'you sought refuge with one who grants it'; sent home with two linen garments", cluster: sira}
  married-for-what-he-knows-of-quran: {label: "A man with not even an iron ring, whose single waist-wrap would leave one of them bare, is married to the woman for the suras he knows by heart", cluster: law}
  mother-offers-daughter-never-ill: {label: "A woman offers the prophet her daughter, praising her beauty until she says she has never had a headache or complained; 'I have no need of your daughter'", cluster: sira}
  aishas-lord-hastens-your-wish: {label: "Aisha, at the verse letting him defer or take wives: 'I see your Lord only hastens to fulfil your wish'", cluster: sira}
  women-who-gave-themselves-khawla: {label: "Khawla bint Hakim was among the women who gave themselves to the prophet; Aisha: is a woman not ashamed to give herself to a man?", cluster: sira}
  prophet-asks-leave-on-a-wifes-day: {label: "After 33:51 the prophet still asked leave on the day of the wife whose turn it was; Aisha answered she would prefer no one over him", cluster: law}
  women-made-lawful-before-his-death: {label: "Aisha: the prophet did not die until women were made lawful to him", cluster: law}
  sawda-recognised-at-night-hijab-revealed: {label: "Tall, stout Sawda going out at night to relieve herself is called out by Umar, eager for the veiling; revelation then permits wives to go out for their needs (or the hijab verse comes down)", cluster: law}
  revelation-comes-while-bone-in-hand: {label: "Revelation comes and lifts while a meat-bone is still in the prophet's hand: 'you are permitted to go out for your needs'", cluster: revelation}
  zayd-turns-back-to-zaynab-to-propose: {label: "Sent to ask Zaynab for the prophet, Zayd finds her leavening dough; she seems so great to him he turns his back and speaks; she will do nothing until she consults her Lord and goes to her prayer-place", cluster: sira}
  guests-linger-curtain-let-down-hijab-revealed: {label: "After Zaynab's wedding meal guests stay talking; the prophet goes out and returns; when they leave he lets the curtain fall between himself and Anas, and the hijab verse comes down", cluster: law}
  fingers-touch-umar-wishes-wives-unseen: {label: "Eating hays with Aisha, Umar's finger touches hers: 'were I obeyed concerning you, no eye would see you'; the hijab came down", cluster: sira}
  accept-invitation-even-to-a-trotter: {label: "Answer an invitation, wedding or other; 'were I invited to a foreleg or a trotter I would answer, and accept it if given'", cluster: law}
  milk-uncle-may-enter-after-hijab: {label: "Aflah, brother of Abu al-Qu'ays, asks to see Aisha after the hijab; she refuses since his brother's wife nursed her; 'admit him, he is your uncle'; forbid by nursing what is forbidden by birth", cluster: law}
  blessing-on-muhammad-as-on-family-of-abraham: {label: "The form of blessing: 'O God bless Muhammad and his family as you blessed the family of Abraham ... and grant blessing as you blessed the family of Abraham; you are praised, glorious'", cluster: ritual}
  miser-is-one-who-hears-name-without-blessing: {label: "The miser is he before whom I am mentioned and who does not bless me", cluster: ritual}
  one-blessing-returned-tenfold: {label: "Whoever blesses me once, God blesses him ten times (ten good deeds, ten sins erased, ten degrees raised)", cluster: ritual}
  backbiting-and-slander-defined: {label: "Backbiting is mentioning your brother with what he dislikes; if it is in him you have backbitten him, if not you have slandered him", cluster: ethics}
  moses-was-harmed-more-and-was-patient: {label: "Told his division of spoils was unjust, the prophet's face turns red: 'who is just if God and his messenger are not? May God have mercy on Moses, he was harmed with more than this and was patient'", cluster: prophets}
  stone-runs-with-moses-clothes: {label: "Moses lays his clothes on a stone to bathe alone; the stone runs off with them; he chases it naked crying 'my clothes, stone!' until the Israelites see him unblemished; he beats the stone, leaving marks", cluster: prophets}
  saba-a-man-of-ten-sons: {label: "Asked whether Saba' is a man, a woman or a land: a man who begot ten (Arabs); six settled Yemen (Madhhij, Kinda, al-Azd, the Ash'aris, Anmar, Himyar), four Syria (Lakhm, Judham, Amila, Ghassan)", cluster: genealogy}
  stars-not-shot-for-a-birth-or-death: {label: "The Jahiliyya said a shooting star meant a great man was born or died; the prophet: they are not shot for anyone's death or life", cluster: cosmology}
  decree-passes-down-through-ranks-of-angels: {label: "When God decrees, the throne-bearers glorify, then each heaven's angels below; those near ask 'what did your Lord say?' and the news passes down to the lowest heaven, where the jinn snatch it", cluster: angelology}
  sent-to-red-and-black: {label: "Every prophet was sent to his people alone; I was sent to every red and black", cluster: revelation}
  successful-who-has-sufficiency-and-contentment: {label: "Successful is he who submitted, was given sufficiency and made content by God with what he gave", cluster: ethics}
  god-looks-at-hearts-not-forms-and-wealth: {label: "God does not look at your forms and wealth but at your hearts and deeds", cluster: theology}
  upper-chambers-seen-like-a-distant-star: {label: "The people of paradise see the dwellers of the chambers above them as you see a brilliant star far on the eastern or western horizon", cluster: eschatology}
  spend-and-i-will-spend-on-you: {label: "God said to me: spend, and I will spend on you; God's hand is full, not lessened by spending night and day; his throne was on the water and in his hand the scale", cluster: theology}
  two-angels-pray-for-giver-and-against-miser: {label: "Every morning two angels descend: one says 'O God give the spender a replacement', the other 'O God give the withholder ruin'", cluster: angelology}
  alarm-with-cloth-im-attacked: {label: "My likeness and yours is a people fearing an enemy who send a lookout; seeing it he fears to be overtaken and waves his garment: 'people, you are attacked!' three times", cluster: sira}
  lower-your-voices-you-call-one-near: {label: "Travellers shout 'God is greatest'; 'go easy on yourselves; you call not on one deaf or absent but on one hearing and near, and he is with you'", cluster: ritual}
  gabriel-six-hundred-wings: {label: "The prophet saw Gabriel with six hundred wings", cluster: angelology}
  none-withholds-what-god-gives: {label: "After each prayer: 'O God none withholds what you give, none gives what you withhold, and the fortune of the fortunate avails him nothing against you'", cluster: ritual}
  creation-in-darkness-light-sprinkled: {label: "God created his creation in darkness and cast on them of his light; whoever it struck was guided, whoever it missed went astray", cluster: theology}
  praises-circle-throne-humming-like-bees: {label: "Glorifying, declaring unity and praising God circle round the throne with a humming like bees, reminding of the one who said them", cluster: angelology}
  ten-angels-race-to-write-praise: {label: "Ten angels race to write a man's new formula of praise, unsure how to write it, until they raise it to the Mighty, who says: write it as my servant said", cluster: angelology}
  ancestors-coal-of-hell-dung-beetle: {label: "Let those who boast of dead fathers, who are charcoal of hell, stop, or they will be lower with God than the dung beetle rolling dung with its nose; people are all sons of Adam and Adam was from dust", cluster: ethics}
  kinship-extends-life-and-provision: {label: "Whoever wishes his provision widened and his trace (life) prolonged, let him keep ties of kinship", cluster: ethics}
  ornament-reaches-where-ablution-reaches: {label: "Abu Hurayra washes up to his armpits: the believer's ornament (in paradise) reaches where the ablution reaches", cluster: ritual}
  silk-and-gold-vessels-theirs-here-ours-hereafter: {label: "Do not wear silk or brocade or drink from gold and silver vessels or eat from their plates: they are theirs in this world and ours in the hereafter", cluster: law}
  none-enters-paradise-by-deeds-not-even-prophet: {label: "No one's deeds will bring him into paradise, not even mine, unless God covers me with grace and mercy; do not wish for death", cluster: theology}
  sinners-burned-to-charcoal-sprout-by-river: {label: "Believers in the fire for their sins are made to die until charcoal, brought in batches, spread on the rivers of paradise, and sprout like a seed in the flood's silt", cluster: eschatology}
  sixty-years-leave-no-excuse: {label: "God leaves no excuse to a man whose term he delayed until sixty years", cluster: ethics}
  lifespans-of-community-sixty-to-seventy: {label: "The lives of my community are between sixty and seventy, and few exceed it", cluster: ethics}
  steps-to-mosque-are-recorded-traces: {label: "Banu Salima wish to move near the mosque; 'your traces are written; stay in your homes'", cluster: ritual}
  whoever-founds-good-or-bad-sunna: {label: "Whoever establishes a good practice in Islam has its reward and that of all who act on it; whoever establishes a bad one bears its burden and theirs", cluster: ethics}
  mouth-sealed-thigh-speaks: {label: "The hypocrite's mouth is sealed and his thigh, flesh and bones are told to speak; they tell his deeds", cluster: eschatology}
  servant-asks-witness-from-himself-limbs-speak: {label: "The servant asks God not to admit any witness against him but one from himself; his mouth is sealed and his limbs speak; then he says to them 'away with you, for you I was fighting'", cluster: eschatology}
  mouths-gagged-thigh-first-to-speak: {label: "You will be called with your mouths gagged with a filter (fidam); the first to speak for one of you will be his thigh and palm", cluster: eschatology}
  i-am-the-prophet-no-lie-son-of-abd-al-muttalib: {label: "At Hunayn on his white mule: 'I am the prophet, no lie; I am the son of Abd al-Muttalib'", cluster: sira}
  bleeding-finger-verse: {label: "His finger bleeding in a battle, the prophet says: 'are you but a finger that bled? and in God's path is what you met'", cluster: sira}
  bone-crumbled-will-he-revive-this: {label: "Al-As b. Wa'il crumbles a bone and asks: will God revive this? 'Yes, God will make you die, revive you and put you in Jahannam'", cluster: sira}
  spittle-in-palm-whence-do-you-defy-me: {label: "Spitting in his palm the prophet says: God says: son of Adam, how can you defy me when I made you from the like of this? You walked in two cloaks, the earth groaning under you, gathered and withheld, and at the collarbones said 'I will give alms'", cluster: ethics}
  glory-to-lord-of-might-and-dominion: {label: "In bowing and prostration at night: 'glory to the possessor of might (jabarut), dominion (malakut), grandeur and majesty'", cluster: ritual}
  angels-complete-rows-before-their-lord: {label: "Angels line up before their Lord completing the front rows and closing the gaps", cluster: angelology}
  jinn-added-nine-to-each-true-word: {label: "The jinn ascended to hear revelation and added nine (falsehoods) to each word heard; after the prophet was sent they were barred from their seats and stars were shot", cluster: cosmology}
  iblis-sends-troops-finds-prophet-praying: {label: "Barred from heaven, the jinn tell Iblis; he sends his troops, who find the prophet standing in prayer between two mountains in Mecca: 'this is what happened on earth'", cluster: cosmology}
  ordered-to-fight-until-no-god-but-god: {label: "I was ordered to fight people until they say 'no god but God'; whoever says it protects his life and property; God mentioned in his book a people who grew proud", cluster: law}
  ishmael-asks-to-be-shrouded-in-white-shirt: {label: "Laid on his brow, Ishmael in a white shirt says: father, I have no other garment to be shrouded in; take it off me; as Abraham tries, the call comes and he sees a white, horned, wide-eyed ram", cluster: patriarchs}
  ram-horns-kept-in-kaaba: {label: "The prophet saw the ram's two horns in the House and told the keeper to cover them so nothing distracts the worshipper; they stayed until the House burned", cluster: patriarchs}
  prophets-dreams-are-revelation: {label: "The prophet's eyes sleep but his heart does not; prophets' dreams are revelation, recited with 'I see in sleep that I sacrifice you'", cluster: revelation}
  do-not-prefer-among-prophets-moses-at-throne: {label: "Do not prefer among God's prophets; at the trumpet I am first raised and find Moses holding the throne: was he spared by his swoon at al-Tur or raised before me?", cluster: prophets}
  best-speech-what-god-chose-for-angels: {label: "Best speech is what God chose for his angels or servants: 'glory to God and his praise'", cluster: ritual}
  evil-morning-for-the-warned-khaybar: {label: "At Khaybar the Jews come out with spades and baskets and cry 'Muhammad and the army!'; 'God is greatest, Khaybar is ruined; when we descend on a people's courtyard, evil is the morning of the warned'", cluster: sira}
  sad-revealed-at-abu-talibs-gathering: {label: "Sad was revealed about Abu Talib's gathering, with Abu Jahl and Quraysh disputing with the prophet", cluster: revelation}
  sad-prostration-davids-repentance-ours-thanks: {label: "Sad is not among the binding prostrations, but the prophet prostrated in it: David prostrated in repentance and we prostrate in thanks", cluster: ritual}
  david-among-prophets-to-imitate: {label: "Ibn Abbas derives the prostration in Sad from 'follow their guidance': David is among those whom the prophet was told to imitate", cluster: ritual}
  people-ready-to-prostrate-only-a-prophets-repentance: {label: "On a second reading of Sad from the pulpit the people get ready to prostrate; 'it is only the repentance of a prophet, but I saw you ready', and he descends and prostrates", cluster: ritual}
  aishas-doll-horse-with-wings: {label: "Aisha's dolls include a horse with two cloth wings: 'have you not heard Solomon had horses with wings?' The prophet laughs until his molars show", cluster: prophets}
  confession-of-unity-opens-eight-gates: {label: "Whoever bears witness to God's unity, Muhammad as servant and messenger, Jesus as God's servant, son of his handmaid, his word and a spirit from him, and paradise and hell as true, God admits by whichever of the eight gates he wishes", cluster: eschatology}
  ablution-and-witness-open-eight-gates: {label: "Whoever performs ablution well and says the double witness has the eight gates of paradise opened for him to enter by any", cluster: eschatology}
  angels-of-light-jinn-of-fire-adam-as-described: {label: "Angels were created of light, the jinn of smokeless fire (marij), and Adam of what you have been told", cluster: cosmology}
  zumar-and-bani-israil-before-sleep: {label: "The prophet would not sleep until he had read al-Zumar and Bani Isra'il", cluster: ritual}
  o-my-servants-i-forbade-wrong-to-myself: {label: "God: O my servants, I forbade wrong to myself; all are astray, hungry, naked except whom I guide, feed, clothe; all jinn and men asking at once would lessen what I have only as a needle dipped in the sea", cluster: theology}
  ten-hundred-thousand-verses-of-night-prayer: {label: "Standing with ten verses one is not written among the heedless, with a hundred among the devout (qanitin), with a thousand among the muqantirin", cluster: ritual}
  hope-and-fear-together-at-death: {label: "A dying youth hopes in God and fears his sins: these do not meet in a servant's heart at such a time but God gives him what he hopes and secures him from what he fears", cluster: eschatology}
  paradise-bricks-gold-silver-mortar-musk-soil-saffron: {label: "Paradise is built of a brick of gold and a brick of silver, mortar of strong musk, pebbles of pearl and ruby, soil of saffron; its dweller never despairs, dies, wears out clothes or loses youth", cluster: eschatology}
  abu-bakr-whoever-worshipped-muhammad: {label: "Abu Bakr kisses the dead prophet ('God will not make you taste two deaths') and says: whoever worshipped Muhammad, Muhammad is dead; whoever worshipped God, God is alive", cluster: sira}
  disputes-repeated-at-judgment-until-every-right-paid: {label: "Will what was between us in the world be gone over again? 'Yes, it will be gone over until every right is paid to its owner'", cluster: eschatology}
  first-two-disputants-are-neighbours: {label: "The first two disputants on the day of resurrection are two neighbours", cluster: eschatology}
  guard-god-and-he-guards-you-pens-lifted: {label: "Guard God and he will guard you; ask God; the community gathered could not help or harm you except as God wrote; the pens are lifted and the pages dry", cluster: theology}
  bedtime-dust-bed-with-wrap-lie-on-right: {label: "Going to bed, dust the bed with the inner edge of the waist-wrap, name God, lie on the right side and say: if you keep my soul forgive it, if you send it back guard it", cluster: ritual}
  pagans-ask-expiation-for-killing-and-fornication: {label: "Polytheists who had killed and fornicated much say: what you call to is good, if only our deeds had an expiation; 25:68 and 39:53 come down", cluster: revelation}
  ayyash-lured-back-by-mothers-vow: {label: "Ayyash is told his mother vowed no comb in her hair and no shade until she sees him; he goes back, is bound on the road and seduced from his faith; Umar later writes him 39:53, which Hisham understands at Dhu Tuwa", cluster: sira}
  if-you-did-not-sin-god-would-bring-sinners: {label: "Did you not sin, God would take you away and bring a people who sin and ask forgiveness and are forgiven", cluster: theology}
  each-sees-his-seat-in-other-abode: {label: "Every dweller of the fire sees his seat in paradise and says 'if God had guided me', a regret; every dweller of paradise sees his seat in the fire: 'had God not guided me', a thanks", cluster: eschatology}
  proud-gathered-as-ants-in-prison-bulas: {label: "The proud are gathered on resurrection day like ants (dharr) in human form, trodden by everything, driven into a prison of Jahannam named Bulas, drinking the pus of the people of the fire", cluster: eschatology}
  rabbi-says-god-holds-creation-on-fingers: {label: "A rabbi says God will hold the heavens on a finger, the earths on a finger, mountains and trees on a finger, water and soil on a finger, all creation on a finger, shake them and say 'I am the King'; the prophet laughs confirming and recites 39:67", cluster: theology}
  i-am-the-king-where-are-earths-kings: {label: "God grips the earth and folds the heaven in his right hand: 'I am the King; where are the kings of the earth?'", cluster: eschatology}
  pulpit-shakes-as-prophet-mimes-gods-grip: {label: "Ibn Umar mimes the prophet closing and opening his fingers ('I am God ... I am the King') until the pulpit shakes and he fears it will fall with the prophet", cluster: sira}
  doors-of-paradise-called-by-deed: {label: "Whoever spends a pair in God's path is called from paradise's gates: the gate of prayer, of jihad, of alms, of fasting (al-Rayyan); Abu Bakr hoped to be called from all", cluster: eschatology}
  rayyan-gate-only-for-fasters: {label: "In paradise is a gate called al-Rayyan by which only the fasters enter; when the last has entered it is shut", cluster: eschatology}
  angel-says-and-for-you-the-like: {label: "Whoever prays for his brother in his absence, the angel says: 'and for you the like'", cluster: ritual}
  tahlil-after-prayer-mukhlisin: {label: "After each prayer Ibn al-Zubayr and the prophet said the tahlil ending 'no god but God, devoting religion to him though the unbelievers hate it'", cluster: ritual}
units:
  # ============== al-Qasas (end)
  - id: hadith-60-q28-faith-only-to-loved-and-humility
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: World given to all, faith only to whom God loves; be humble, none boasts; an atom of pride; return to Mecca (Q 28:82-85)
    read: ["Jāmiʿ 60:7300.1-7301.1"]
    quran: ["28:82", "28:83", "28:85"]
    tags:
      - {motif: god-gives-world-to-loved-and-unloved-faith-only-to-loved, refs: ["Jāmiʿ 60:7300.1"], note: 'إنّ الله قسم بينكم أخلاقكم، كما قسم بينكم أرزاقكم، وإنّ الله يُعطي الدُّنيا مَنْ يحبُّ ومن لا يحبّ، ولا يعطي الإيمان إلّا من يحبّ'}
      - {motif: god-revealed-be-humble-none-boast-over-another, refs: ["Jāmiʿ 60:7300.2"], note: 'إن الله أوحى إليّ أن تواضعوا حتى لا يفخر أحد على أحد، ولا يبغي أحد على أحد'}
      - {motif: atom-of-pride-bars-paradise-god-beautiful, refs: ["Jāmiʿ 60:7300.3"], note: 'لا يدخل الجنة من كان في قلبه مثقال ذرّة من كِبْر ... إنّ الله جميلٌ يحبُّ الجمال؛ الكِبر بَطَرُ الحقّ، وغَمْط النّاس'}
      - {motif: return-to-a-place-is-mecca, refs: ["Jāmiʿ 60:7301.1"], note: '﴿لَرَادُّكَ إِلَى مَعَادٍ﴾ قال: إلى مكة'}
  # ============== al-ʿAnkabut
  - id: hadith-60-q29-saad-mother-and-verses
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Sa'd's mother's oath of hunger; the sword from the spoils; the third of a bequest; the camel-jaw at a wine party (Q 29:8; 31:15; 8:1; 5:90)
    read: ["Jāmiʿ 60:7302.1"]
    quran: ["29:8", "31:15", "8:1", "5:90"]
    tags:
      - {motif: mother-hunger-strike-against-sons-faith, refs: ["Jāmiʿ 60:7302.1"], note: 'حلفت أم سعد أن لا تكلمه أبدا حتى يكفر بدينه، ولا تأكل، ولا تشرب ... مكثت ثلاثا حتى غُشِيَ عليها من الجهد، فقام ابن لها يقال له: عمارة، فسقاها'}
      - {motif: spoils-sword-returned-to-pile, refs: ["Jāmiʿ 60:7302.1"], note: 'نفِّلني هذا السيف ... رده من حيث أخذته ... فشدَّ لي صوته'}
      - {motif: bequest-capped-at-one-third, refs: ["Jāmiʿ 60:7302.1"], note: 'دعني أقسم مالي حيث شئت. قال: فأبى. قلت: فالنصف. قال: فأبى. قلت: فالثلث. قال: فسكت، فكان بعد الثلث جائزا'}
      - {motif: camel-jaw-strikes-nose-at-wine-party, refs: ["Jāmiʿ 60:7302.1"], note: 'فإذا رأس جزور مشويّ عندهم، وزق من خمر ... فأخذ رجل أحد لحيي الرأس فضربني به فجرح بأنفي'}
  - id: hadith-60-q29-meccan-converts-tried
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Meccan converts taken to Badr and killed; letters to those left behind; they give in under trial, then emigrate and fight (Q 29:10; 4:97; 16:110)
    read: ["Jāmiʿ 60:7303.1"]
    quran: ["29:10", "4:97", "16:110"]
    tags:
      - {motif: meccan-converts-forced-out-to-badr-killed, refs: ["Jāmiʿ 60:7303.1"], note: 'فأخرجهم المشركون يوم بدر معهم، فأصيب بعضهم وقتل بعض ... فكتب إلى من بقي بمكة من المسلمين بهذه الآية: أن لا عذر لهم ... فأعطوهم الفتنة'}
  - id: hadith-60-q29-burdens-of-those-misled
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Burdens upon burdens - the caller to error, the first son of Adam, the bankrupt, the wronged paid from good deeds (Q 29:13)
    read: ["Jāmiʿ 60:7304.1-7305.2"]
    quran: ["29:13"]
    tags:
      - {motif: caller-to-guidance-shares-reward-caller-to-error-shares-sin, refs: ["Jāmiʿ 60:7304.1"], note: 'ومن دعا إلى ضلالة كان عليه من الإثم مثلُ آثام من تَبعه لا ينقص ذلك من آثامهم شيئًا'}
      - {motif: first-son-of-adam-shares-every-unjust-killing, refs: ["Jāmiʿ 60:7304.2"], note: 'لا تقتل نفس ظلمًا، إلا كان على ابن آدم الأول كفل من دمها، لأنه كان أول من سنّ القتل'}
      - {motif: first-murder-fratricide, refs: ["Jāmiʿ 60:7304.2"], note: 'ابن آدم الأول ... أول من سنّ القتل'}
      - {motif: the-bankrupt-pays-with-good-deeds-then-takes-sins, refs: ["Jāmiʿ 60:7305.1"], note: 'إن المفلس من أمتي يأتي يوم القيامة بصلاة وصيام وزكاة ... فإن فنيت حسناته ... أخذ من خطاياهم، فطرحت عليه، ثم طرح في النار'}
      - {motif: wronged-paid-from-good-deeds-at-judgment, refs: ["Jāmiʿ 60:7305.2"], note: 'وعزتي لا يحوزني اليوم ظلم ... تتبعه من الحسنات أمثال الجبال ... خذوا من سيئاتهم فاحملوها عليه. ثم نزع النبي ﷺ بهذه الآية'}
    hints:
      - "The first killer bearing a share of every later unjust killing against m. Sanhedrin 4:5, where Cain is charged with 'the bloods of your brother' (Gen 4:10), his blood and that of his unborn descendants."
  - id: hadith-60-q29-decree-and-prayer
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Spending like Uhud accepted only with belief in the decree; night prayer will stop the thief (Q 29:21, 29:45)
    read: ["Jāmiʿ 60:7306.1-7308.1"]
    quran: ["29:21", "29:45"]
    tags:
      - {motif: belief-in-decree-condition-of-accepted-spending, refs: ["Jāmiʿ 60:7306.1"], note: 'لو أنّ الله عذّب أهل سماواته، وأهل أرضه عذَّبهم وهو غير ظالم لهم ... ولو أنفقتَ مثل أُحد ذهبًا في سبيل الله ما قبله الله منك حتى تؤمن بالقدر'}
      - {motif: night-prayer-will-stop-the-thief, refs: ["Jāmiʿ 60:7308.1"], note: 'إن فلانا يصلى بالليل فإذا أصبح سرق قال: إنه سينهاه ما تقول'}
  - id: hadith-60-q29-people-of-the-book
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Torah read in Hebrew and explained in Arabic - neither believe nor deny; does a bier speak? (Q 29:46)
    read: ["Jāmiʿ 60:7308.2-7309.1"]
    quran: ["29:46", "2:136"]
    tags:
      - {motif: neither-believe-nor-deny-people-of-the-book, refs: ["Jāmiʿ 60:7308.2", "Jāmiʿ 60:7309.1"], note: 'كان أهلُ الكتاب يقرؤون التّوراة بالعبرانية، ويفسّرونها بالعربيّة لأهل الإسلام ... لا تصدّقوا أهل الكتاب ولا تكذّبوهم'}
      - {motif: does-the-bier-speak, refs: ["Jāmiʿ 60:7309.1"], note: 'يا محمد، هل تتكلّم هذه الجنازة؟ فقال النبيُّ ﷺ: الله أعلم. قال اليهوديُّ: إنّها تتكلَّم'}
  - id: hadith-60-q29-book-and-signs
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: A book water cannot wash away; each prophet's signs and his revelation; the transparent chamber (Q 29:49, 29:51, 29:58)
    read: ["Jāmiʿ 60:7309.2-7310.2"]
    quran: ["29:49", "29:51", "29:58"]
    tags:
      - {motif: book-not-washed-away-by-water-read-asleep-and-awake, refs: ["Jāmiʿ 60:7309.2"], note: 'إنما بعثتك لأبتليك وأبتلي بك وأنزلت عليك كتابا لا يغسله الماء تقرؤه نائما ويقظان'}
      - {motif: each-prophet-given-signs-mine-is-revelation, refs: ["Jāmiʿ 60:7310.1"], note: 'ما من الأنبياء من نبي إلا قد أعطي من الآيات ما مثله آمن عليه البشر، وإنما كان الذي أوتيت وحيا'}
      - {motif: paradise-chamber-seen-through-from-inside-and-out, refs: ["Jāmiʿ 60:7310.2"], note: 'إن في الجنة غرفةً يُرى ظاهِرُها من باطنها، وباطِنُها من ظاهرها، أعده الله لمن أطعم الطعام، وألانَ الكلامَ، وتابع الصيامَ، وصلّى والناسُ نيام'}
  # ============== al-Rum
  - id: hadith-60-q30-romans-and-persians-wager
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Abu Bakr's wager on the Romans against Persia; 'bid' years (Q 30:1-6)
    read: ["Jāmiʿ 60:7311.1-7312.1"]
    quran: ["30:1-6"]
    tags:
      - {motif: rome-persia-wager-on-bid-years, refs: ["Jāmiʿ 60:7311.1", "Jāmiʿ 60:7312.1"], note: 'فجعل أجل خمس سنين فلم يظهروا ... ألا جعلته إلى دون ... والبضع ما دون العشر؛ فسمّوا بينهم ست سنين ... فلما دخلت السنة السابعة ظهرت الروم على فارس'}
      - {motif: abu-bakr-cries-the-verse-through-mecca, refs: ["Jāmiʿ 60:7312.1"], note: 'خرج أبو بكر الصديق يصيح في نواحي مكة ﴿الم (١) غُلِبَتِ الرُّومُ﴾'}
  - id: hadith-60-q30-smoke-and-five-past
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Ibn Masud on the smoke - Quraysh's famine 'seven like Joseph's'; five signs already past (Q 30:1-6; 44:10-16)
    read: ["Jāmiʿ 60:7313.1-7313.2"]
    quran: ["30:1-6", "44:10-15", "44:16", "25:77", "38:86"]
    tags:
      - {motif: say-god-knows-is-part-of-knowledge, refs: ["Jāmiʿ 60:7313.1"], note: 'من علم فليقل، ومن لم يعلم فليقل: الله أعلم، فإن من العلم أن يقول لما لا يعلم: لا أعلم'}
      - {motif: seven-years-like-the-seven-of-joseph, refs: ["Jāmiʿ 60:7313.1"], note: 'اللهم أعني عليهم بسبع كسبع يوسف، فأخذتهم سنة حتى هلكوا فيها وأكلوا الميتة، والعظام'}
      - {motif: five-signs-already-past, refs: ["Jāmiʿ 60:7313.2"], note: 'خمس قد مضين: الدخان، واللزام، والروم، والبطشة، والقمر'}
    hints:
      - "The famine prayed for as 'seven like the seven of Joseph' against Gen 41:27-30, the seven years of famine."
