      - {motif: ayyash-lured-back-by-mothers-vow, refs: ["Jāmiʿ 60:7413.2"], note: 'إن أمك قد نذرت أن لا يمس رأسها مشط حتَّى تراك، ولا تستظل من شمس حتَّى تراك ... فأوثقاه وربطاه ... فكتبتها بيدي في صحيفة ... جعلت أقرؤها بذي طوى'}
      - {motif: killer-of-ninety-nine-kills-the-monk-too, refs: ["Jāmiʿ 60:7414.1"], note: 'رجل قتل تسعة وتسعين نفسا ... فدلّ على راهب ... فقال: لا. فقتله، فكمّل به مائة'}
      - {motif: if-you-did-not-sin-god-would-bring-sinners, refs: ["Jāmiʿ 60:7415.1", "Jāmiʿ 60:7415.2"], note: 'لو لم تذنبوا لذهب الله بكم ولجاء بقومٍ يذنبون، فيستغفرون الله، فيغفر لهم'}
  - id: hadith-60-q39-regret-and-the-proud
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Each sees his seat in the other abode; the proud as ants in the prison Bulas (Q 39:56-57, 39:60)
    read: ["Jāmiʿ 60:7415.3-7416.1"]
    quran: ["39:56-57", "39:60"]
    tags:
      - {motif: each-sees-his-seat-in-other-abode, refs: ["Jāmiʿ 60:7415.3"], note: 'كل أهل النّار يَرَى مقعده من الجنّة، فيقول: لو أن الله هداني. فيكون عليه حسرة ... لولا أن الله هداني ... فيكون له شكرا'}
      - {motif: proud-gathered-as-ants-in-prison-bulas, refs: ["Jāmiʿ 60:7416.1"], note: 'يحشر المتكبرون يوم القيامة أمثال الذر في صور الناس ... سجنا في جهنّم، يقال له: بُولَس، فتعلوهم نار الأنيار، يسقون من طينة الخبال'}
    hints:
      - "Each person's place in both the garden and the fire against b. Hagigah 15a, 'each one has two portions, one in the Garden of Eden and one in Gehinnom'."
  - id: hadith-60-q39-earth-in-his-grip
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: The earth in his grip, heavens folded in his right hand - the rabbi's fingers; 'I am the King'; the pulpit shakes (Q 39:67)
    read: ["Jāmiʿ 60:7416.2-7416.4"]
    quran: ["39:67"]
    tags:
      - {motif: earth-in-gods-grip-heavens-folded-in-right-hand, refs: ["Jāmiʿ 60:7416.2", "Jāmiʿ 60:7416.3", "Jāmiʿ 60:7416.4"], note: 'يقبض الله الأرض يوم القيامة، ويطوي السماء بيمينه'}
      - {motif: rabbi-says-god-holds-creation-on-fingers, refs: ["Jāmiʿ 60:7416.2"], note: 'جاء حبر ... يمسك السماوات يوم القيامة على إصبع والأرضين على إصبع، والجبال والشجر على إصبع، والماء والثرى على إصبع، وسائر الخلق على إصبع، ثمّ يهزهن ... فضحك رسول الله ﷺ تعجبا مما قال الحبر، تصديقا له'}
      - {motif: i-am-the-king-where-are-earths-kings, refs: ["Jāmiʿ 60:7416.3"], note: 'ثمّ يقول: أنا الملك، أين ملوك الأرض؟'}
      - {motif: pulpit-shakes-as-prophet-mimes-gods-grip, refs: ["Jāmiʿ 60:7416.4"], note: 'ويقبض أصابعه ويبسطها - أنا الملك ... حتَّى نظرت إلى المنبر يتحرك من أسفل شيء منه'}
    hints:
      - "God holding creation on his fingers against Isa 40:12 (heaven meted with a span) and 48:13 ('my right hand has spread out the heavens'); 'I am the King, where are the kings of the earth?' against Pesiqta Rabbati 1."
  - id: hadith-60-q39-two-blasts
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Forty between the two blasts; rain and sprouting like herbs; the tailbone (Q 39:68)
    read: ["Jāmiʿ 60:7417.1"]
    quran: ["39:68"]
    tags:
      - {motif: forty-between-the-two-trumpet-blasts, refs: ["Jāmiʿ 60:7417.1"], note: 'ما بين النفختين أربعون ... أربعون يومًا؟ قال: أبيت ... أربعون شهرًا؟ قال: أبيت ... أربعون سنة؟ قال: أبيت'}
      - {motif: tailbone-never-decays-man-rebuilt-from-it, refs: ["Jāmiʿ 60:7417.1"], note: 'ثمّ ينزل الله من السماء ماء، فينبتون كما ينبت البقل ... إِلَّا عظما واحدًا، وهو عجْبُ الذَنَب، ومنه يُرَكّب الخلق يوم القيامة'}
    hints:
      - "The one bone that does not decay and from which man is rebuilt against Gen. Rabbah 28:3 and Lev. Rabbah 18:1 (the luz of the spine from which God makes man sprout at the resurrection); rain from heaven making the dead sprout like herbs against Isa 26:19 and b. Ketubot 111b (the dew of resurrection)."
  - id: hadith-60-q39-gates-of-paradise
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: The gates opened - eight gates for ablution and witness; called from the gate of one's deed; al-Rayyan for the fasters (Q 39:73)
    read: ["Jāmiʿ 60:7418.1-7418.3"]
    quran: ["39:73"]
    tags:
      - {motif: ablution-and-witness-open-eight-gates, refs: ["Jāmiʿ 60:7418.1"], note: 'إِلَّا فتحت له أبواب الجنّة الثمانية، يدخل من أيّها شاء'}
      - {motif: doors-of-paradise-called-by-deed, refs: ["Jāmiʿ 60:7418.2"], note: 'فمن كان من أهل الصّلاة دُعي من باب الصّلاة، ومن كان من أهل الجهاد دُعِي من باب الجهاد ... وباب الريان ... وأرجو أن تكون منهم، يا أبا بكر'}
      - {motif: rayyan-gate-only-for-fasters, refs: ["Jāmiʿ 60:7418.3"], note: 'إنَّ في الجنّة بابا يقال له: الريان. يدخل منه الصّائمون ... فإذا دخل آخرهم أغلق'}
