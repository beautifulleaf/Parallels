      - {motif: moses-was-harmed-more-and-was-patient, refs: ["Jāmiʿ 60:7361.2"], note: 'فأعطى الأقرع بن حابس مائة من الإبل ... فتغير وجهه حتَّى كان كالصرف ... يرحم الله موسى، قد أوذي بأكثر من هذا فصبر'}
      - {motif: moses-rumoured-to-have-hernia, refs: ["Jāmiʿ 60:7361.3", "Jāmiʿ 60:7362.1", "Jāmiʿ 60:7362.2"], note: 'ما يمنع موسى أن يغتسلَ معنا إِلَّا أنه آدر ... إما برص وإما أدرة، وإما آفة'}
      - {motif: stone-runs-with-moses-clothes, refs: ["Jāmiʿ 60:7361.3", "Jāmiʿ 60:7362.1", "Jāmiʿ 60:7362.2"], note: 'ففرَّ الحجرُ بثوبه، فخرج موسى في إثره يقول: ثوبي يا حجر! ... فوالله إن بالحجر لندبا من أثر ضربه ثلاثًا أو أربعًا أو خمسًا'}
    hints:
      - "Moses striking the stone, which keeps the marks of his blows, against Num 20:11, where Moses strikes the rock twice with his staff."
