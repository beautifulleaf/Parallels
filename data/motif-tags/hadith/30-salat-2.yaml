- id: hadith-9-noon-and-afternoon
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'The noon and afternoon prayers: the long first rakʿa and Saʿd''s prayer against his accuser'
  read:
  - Jāmiʿ 9:1294.1-1295.1
  quran:
  - 1:1-7
  tags:
  - motif: first-raka-lengthened-second-shortened
    refs:
    - Jāmiʿ 9:1294.1
    note: يقرأ في الركعتين الأوليين من صلاة الظهر بفاتحة الكتاب، وسورتين. يُطَوِّلُ في الأولى، ويُقَصِّر في الثانية، ويُسمع
      الآية أحيانًا
  - motif: lingers-in-first-two-lightens-last-two
    refs:
    - Jāmiʿ 9:1295.1
    note: أصلي صلاة العشاء فأركدُ في الأُولَيين، وأخِفُّ في الأُخْريين
  - motif: governor-investigated-mosque-by-mosque
    refs:
    - Jāmiʿ 9:1295.1
    note: شكا أهل الكوفة سعدًا إلى عمر فعزله ... ولم يدع مسجدًا إلا سأل عنه ويُثنون معروفًا، حتى دخل مسجدًا لبني عبسٍ
  - motif: three-charges-three-curses-of-sad
    refs:
    - Jāmiʿ 9:1295.1
    note: كان لا يسير بالسرية، ولا يَقْسِم بالسوية، ولا يعدل في القضية ... فأطل عمره، وأطِل فقره، وعَرِّضه بالفتن
  - motif: cursed-old-man-eyebrows-over-eyes-accosts-girls
    refs:
    - Jāmiʿ 9:1295.1
    note: شيخ كبير مفتون، أصابتني دعوة سعد ... قد سقط حاجباه على عينيه من الكبر، وإنه ليتعرض للجواري في الطرق يغمزهُنَّ
  hints:
  - Saʿd's three curses on a false accuser (long life, long poverty, trials), against the lengthened life as curse and the
    falsely accusing witness punished with what he plotted, Deut 19:16-19
- id: hadith-9-noon-recitation
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: How the noon and afternoon recitation was known and measured; the governor who prayed most like the prophet
  read:
  - Jāmiʿ 9:1296.1-1300.2
  quran:
  - '32:1'
  - '84:1'
  - '85:1'
  - '86:1'
  - '87:1'
  - '88:1'
  - '91:1'
  tags:
  - motif: silent-recitation-known-by-moving-beard
    refs:
    - Jāmiʿ 9:1296.1
    - Jāmiʿ 9:1300.2
    note: 'بم كنتم تعرفون ذلك؟ قال: باضطراب لحيته ... كانت تعرف قراءة النبي ﷺ في الظهر بتحريك لحيته'
  - motif: thirty-verses-noon-fifteen-afternoon
    refs:
    - Jāmiʿ 9:1296.2
    note: في كل ركعة قدر ثلاثين آية، وفي الأخريين قدر خمس عشرة آية ... فحزرنا قيامه في الركعتين الأوليين من الظهر قدر قراءة
      ﴿الم (١) تَنْزِيلُ﴾
  - motif: named-suras-of-noon-and-afternoon
    refs:
    - Jāmiʿ 9:1296.3
    - Jāmiʿ 9:1297.1
    - Jāmiʿ 9:1299.1
    - Jāmiʿ 9:1300.1
    note: كان يقرأ في الظهر بـ ﴿سَبِّحِ اسْمَ رَبِّكَ الْأَعْلَى﴾ ... بـ ﴿وَالسَّمَاءِ وَالطَّارِقِ﴾ و ﴿وَالسَّمَاءِ ذَاتِ
      الْبُرُوجِ﴾ ... و ﴿هَلْ أَتَاكَ حَدِيثُ الْغَاشِيَةِ﴾ ... بـ ﴿إِذَا السَّمَاءُ انْشَقَّتْ﴾
  - motif: ibn-abbas-denies-noon-recitation-khamshan
    refs:
    - Jāmiʿ 9:1297.2
    note: 'فقال: لا، لا. فقيل له: فلعله كان يقرأ في نفسه، فقال: خَمشًا هذه شر من الأولى، كان عبدًا مأمورًا بلَّغ ما أرسل به'
  - motif: three-things-the-prophets-house-was-singled-out-for
    refs:
    - Jāmiʿ 9:1297.2
    note: 'وما اختصَّنا دون الناس بشيْء إلا بثلاث خصال: "أمرنا أن نُسْبغ الوضوء، وأن لا نأكل الصدقة، وأن لا نُنزي الحمار على
      الفرس"'
  - motif: leader-who-prays-most-like-the-prophet
    refs:
    - Jāmiʿ 9:1298.1
    - Jāmiʿ 9:1298.2
    - Jāmiʿ 9:1299.2
    note: ما صليت وراء أحد أشبه صلاة برسول الله ﷺ من فلان ... ما رأيتُ أحدًا أشبه بصلاة رسول الله ﷺ من هذا الفتى، يعني عمر
      بن عبد العزيز ... ما صليتُ وراء إمام أشبه صلاةً برسول الله ﷺ من إمامكم هذا
  - motif: long-first-two-light-last-two-noon-short-mufassal-maghrib
    refs:
    - Jāmiʿ 9:1298.1
    note: وكان يُطيل الأُولَيين من الظهر، ويخفف في الأخريين، ويُخَفِّفُ في العصر ويقرأ في المغرب بقصار المُفَصَّل، ويقرأ في
      العشاء بالشمس وضحاها وأشباهِها، ويقرأ في الصبح بسورتين طويلتين
  - motif: lingers-in-first-two-lightens-last-two
    refs:
    - Jāmiʿ 9:1299.2
    note: وكان عمر بن عبد العزيز يُتم الركوع والسجود ويخفّف القيام والقعود
  hints:
  - The prophet's house forbidden to put a donkey to a mare, against the Torah's ban on crossbreeding animals, Lev 19:19 'you
    shall not let your cattle breed with a different kind', and m. Kilʾayim 1:6 and 8:1 on horse and donkey
