      وعافني واهدني"'
  - motif: closes-his-hand-has-filled-his-hand-with-good
    refs:
    - Jāmiʿ 9:1312.1
    note: 'فلما قام قال هكذا بيده، فقال رسولُ الله ﷺ: "أما هذا فقد ملأ يده من الخير"'
