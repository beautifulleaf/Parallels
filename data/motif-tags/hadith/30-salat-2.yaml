    note: فافتتح بسورة البقرة. فانحرف رجل فسلَّم ... أنافقت يا فلان؟ ... إنا أصحاب نواضح نعمل بالنهار ... أفتَّان أنت؟ اقرأ
      بكذا. واقرأ بكذا
  - motif: wife-circles-house-riding-behind-people-while-prophet-recites-tur
    refs:
