  - '2:1'
  - '3:1'
  - '4:1'
  - '75:40'
  - '87:1'
  tags:
  - motif: baqara-nisa-al-imran-in-one-night-raka
    refs:
    - Jāmiʿ 9:1313.2
    note: 'فافتتح البقرة فقلت: يركع عند المائة ثم مضى ... ثم افتتح النساء فقرأها، ثم افتتح آل عمران فقرأها، يقرأ مترسلا'
  - motif: glorify-at-glory-ask-at-mercy-refuge-at-punishment
    refs:
    - Jāmiʿ 9:1313.2
    - Jāmiʿ 9:1313.3
    note: إذا مرَّ بآية فيها تسبيح سبَّح، وإذا مرَّ بسؤال سأل، وإذا مرَّ بتعوذ تعوذ ... لا يمر بآية رحمة إلا وقف فسأل، ولا
      يمر بآية عذاب إلا وقف فتعوّذ
  - motif: glory-to-you-yes-at-75-40
    refs:
    - Jāmiʿ 9:1314.1
    note: 'كان رجل يصلي فوق بيته، وكان إذا قرأ: ﴿أَلَيْسَ ذَلِكَ بِقَادِرٍ عَلَى أَنْ يُحْيِيَ الْمَوْتَى﴾ [القيامة: ٤٠] قال:
      سبحانك، فبلى'
  - motif: glory-to-my-lord-most-high-at-87-1
    refs:
    - Jāmiʿ 9:1314.2
    note: 'كان إذا قرأ ﴿سَبِّحِ اسْمَ رَبِّكَ الْأَعْلَى﴾ [الأعلى: ١] قال: "سبحان ربي الأعلى"'
- id: hadith-9-the-bow
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'The form of the bow: hands on the knees (the abrogated pressing of the palms), head level, fingers spread'
  read:
  - Jāmiʿ 9:1316.1-1318.1
  tags:
  - motif: palms-pressed-between-thighs-forbidden-hands-on-knees
    refs:
    - Jāmiʿ 9:1316.1
    note: 'فطبَّقتُ بين كفيَّ، ثم وضعتُهما بين فخذِيَّ، فنهاني أبي وقال: "كنَّا نفعله فنُهينا عنه، وأمرنا أن نضع أيدينا على
      الركب"'
  - motif: ibn-masud-still-presses-palms-between-thighs
    refs:
    - Jāmiʿ 9:1316.2
    note: فضرب أيدينا، وطبَّق بين كفَّيه، ثم أدخلهما بين فخذيه ... فكأَنِّي أنظر إلى اختلاف أصابع رسول الله ﷺ فأراهم
  - motif: two-followers-set-right-and-left-of-imam
    refs:
    - Jāmiʿ 9:1316.2
    note: فأخذ بأيدينا فجعل أحدنا عن يمينه، والآخر عن شماله
  - motif: amirs-strangle-prayer-to-the-dying-gasp
    refs:
    - Jāmiʿ 9:1316.2
    note: إنه سيكون عليكم أمراء يؤخرون الصلاة عن ميقاتها، ويخنُقونها إلى شَرَقِ الموتى، فإذا رأيتُم قد فعلوا ذلك فصلُّوا الصلاة
      لميقاتها، واجعلوا صلاتكم معهم سُبْحَةً
  - motif: forehead-pressed-till-earth-felt
    refs:
    - Jāmiʿ 9:1317.1
    note: وإذا سَجدتَ فأَمْكِنْ جبَهتَك من الأرضي، حتى تجدَ حَجْم الأرضِ
  - motif: head-neither-lowered-nor-raised-in-the-bow
    refs:
    - Jāmiʿ 9:1317.2
    note: لا يَصُبُّ رأسه ولا يُقْنِعُ، معتدلًا
  - motif: ten-companions-test-abu-humayd-on-prophets-prayer
    refs:
    - Jāmiʿ 9:1317.2
    note: 'سمعتُ أبا حميد الساعدي في عشرةٍ من أصحاب رسول الله ﷺ فيهم: أبو قتادة فقال أبو حُميد: أنا أعلمُكم لِصلاة رسول الله
      ﷺ'
  - motif: fingers-spread-in-bow-closed-in-prostration
    refs:
    - Jāmiʿ 9:1318.1
    note: كان رسول الله ﷺ إذا ركع فرَّج أصابعه، وإذا سجد ضَمَّ أصابعه
- id: hadith-9-repose-in-bow-and-prostration
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Repose in the bow and prostration: the man who did not pray, the eyes behind the back, the straight spine'
  read:
  - Jāmiʿ 9:1318.2-1325.1
  quran:
  - '1:2'
  - 23:1-2
  tags:
  - motif: man-told-go-back-and-pray-you-have-not-prayed
    refs:
    - Jāmiʿ 9:1318.2
    - Jāmiʿ 9:1319.2
    note: فإنك لم تُصلِّ" - ثلاثًا ... والذي بعثك بالحق ما أحسن غيره، فعَلِّمْنِي ... حتى كان عند الثالثة أو الرابعة
  - motif: every-bone-returns-to-its-place
    refs:
    - Jāmiʿ 9:1318.2
    - Jāmiʿ 9:1319.2
    - Jāmiʿ 9:1322.2
    - Jāmiʿ 9:1323.1
    - Jāmiʿ 9:1323.3
    - Jāmiʿ 9:1325.1
    note: ثم اركع حتى تطمئن راكعًا، ثم ارفع حتى تعدِلَ قائمًا ... حَتَّى أَخَذَ كُلُّ عُضْوٍ مَأْخَذَهُ ... حتَّى استقر كل
      شيء منه ... حتَّى يرجعَ كلُّ عظْمٍ في موضعه معتدلًا ... ثمّ امكث حتَّى يأخذ كل عضو مأخذه
  - motif: prophet-sees-behind-his-back-in-prayer
    refs:
    - Jāmiʿ 9:1319.1
    - Jāmiʿ 9:1321.1
    note: أترون قِبلَي هاهنا؟ فوالله! ما يخفي علي خشوعُكم، ولا ركوعُكم، إنِّي لأراكم من وراء ظهري ... فوالله! إني لأراكم من
      بَعدي
  - motif: prayer-expiates-past-sins-while-no-major-sin
    refs:
    - Jāmiʿ 9:1321.2
    note: فيُحسن وضوءَها، وخشوعَها، وركوعَها، إِلَّا كانت كفَّارةَ لما قبلها من الذنوب، ما لم يُؤت كبيرةً، وذلك الدَّهر كلّه
  - motif: head-neither-lowered-nor-raised-in-the-bow
    refs:
    - Jāmiʿ 9:1321.3
    - Jāmiʿ 9:1323.3
    note: لم يُشْخِصْ رأسه ولم يُصوِّبْه ولكن بين ذلك ... فلم يُصَوِّبْ رأسه، ولم يُقْنِع
  - motif: sits-on-left-foot-right-foot-upright
    refs:
    - Jāmiʿ 9:1321.3
    note: وكان يفْرِشُ رجْلَه اليُسرى، وينصِبُ رجله اليُمنى
  - motif: devils-squat-and-beasts-spread-forbidden
    refs:
    - Jāmiʿ 9:1321.3
    note: وكان ينهى عن عُقْبَة الشّيطان، وينهي أن يفترِشَ الرّجل ذِراعَيه افتراش السبُعِ
  - motif: no-prayer-without-straightening-the-back
    refs:
    - Jāmiʿ 9:1322.1
    - Jāmiʿ 9:1323.2
    note: لا تُجْزِئُ صلاةُ الرّجل حتَّى يُقيمَ ظَهره في الركوع والسجود ... فلمح بمؤْخِر عَيْنِه رجلًا لا يُقيم صلاتَه ...
      لا صلاة لمن لا يُقيمُ صُلْبَه في الركوع والسجود
  - motif: companion-stands-and-shows-the-prayer
    refs:
    - Jāmiʿ 9:1322.2
    - Jāmiʿ 9:1323.1
    note: أَلَا أُرِيكُمْ صَلَاةَ رَسُولِ اللَّهِ ﷺ ... هَكَذَا صَلَاةُ رَسُولِ اللَّهِ ﷺ ... فقام بين أيدينا في المسجد ...
      هكذا رأينا رسول الله ﷺ يُصَلِّي
  - motif: ten-companions-test-abu-humayd-on-prophets-prayer
    refs:
    - Jāmiʿ 9:1323.3
    note: 'قالوا: لِم؟ ما كنتَ أكثرَنا له اتباعًا، ولا أقْدَمنا له صحبةً'
  - motif: last-sitting-on-buttock-left-foot-forward
    refs:
    - Jāmiʿ 9:1323.3
    note: أخَّر رجله اليُسرى وقعد على شِقِّه مُتَورِّكًا
  - motif: stranger-has-a-right-ask-first
    refs:
    - Jāmiʿ 9:1325.1
    note: إنه رجل غريب وإن للغريب حقًّا فابدأ به
  - motif: question-answered-before-it-is-asked
    refs:
    - Jāmiʿ 9:1325.1
    note: 'جئت تسألني عن الرّكوع والسّجود والصّلاة والصوم". فقال: لا والذي بعثك بالحق ما أخطأتَ مما كان في نفسي شيئًا'
  - motif: fingers-spread-in-bow-closed-in-prostration
    refs:
    - Jāmiʿ 9:1325.1
    note: فإذا ركعت فضع راحتيك على ركبتين ثمّ فرج بين أصابعك
  - motif: forehead-pressed-till-earth-felt
    refs:
    - Jāmiʿ 9:1325.1
    note: وإذا سجدت فمكن جبهتك ولا تنقر نقرًا
  - motif: pray-at-start-and-end-of-day
    refs:
    - Jāmiʿ 9:1325.1
    note: 'وصلِّ أوَّل النهار وآخره". فقال: يا نبي الله! فإن أنا صليت بينهما؟ قال: "فأنت إذا مصلي"'
- id: hadith-9-pecking-prayer
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Prayer pecked like a crow, a rooster; the thief of his prayer; the beast's spread and the camel's spot
  read:
  - Jāmiʿ 9:1326.1-1328.2
  tags:
  - motif: pecks-prayer-as-crow-pecks-blood
    refs:
    - Jāmiʿ 9:1326.1
    note: مَنْ مات على هذا مات على غير ملّة محمّد ينقر صلاته كما ينقر الغُراب الدَّم
  - motif: pecking-prostrator-like-hungry-man-eating-a-date-or-two
    refs:
    - Jāmiʿ 9:1326.1
    note: إنّما مثل الذي يركع وينقر في سجوده كالجائع لا يأكل إِلَّا التمرة والتمرتين فماذا تغنيان عنه
  - motif: four-army-commanders-heard-it
    refs:
    - Jāmiʿ 9:1326.1
    note: أمراء الأجناد عمرو بن العاص وخالد بن الوليد ويزيد بن أبي سفيان وشرحبيل بن حسنة كل هؤلاء سمعوه من النَّبِيّ ﷺ
  - motif: three-commands-three-forbiddings-fox-monkey-rooster
    refs:
    - Jāmiʿ 9:1327.1
    note: أمرني بصيام ثلاثة أيام من كل شهر، وأن لا أنام إِلَّا على وتر، وركعتي الضحى. ونهاني عن الالتفات في الصّلاة التفات
      الثعلب، وأقعى إقعاء القرد، وأنقر نقر الديك
  - motif: worst-thief-steals-his-prayer
    refs:
    - Jāmiʿ 9:1328.1
    note: 'أسوأ الناس سرقة الذي يسرق صلاته" قال: وكيف يسرق صلاته؟ قال: "لا يتُم ركوعها ولا سجودها'
  - motif: crow-peck-beast-spread-camels-fixed-place
    refs:
    - Jāmiʿ 9:1328.2
    note: 'ينهى عن ثلاث: عن نقرة الغراب، وعن افتراش السبع، وأن يوطن الرّجل المقام كما يوطن البعير'
- id: hadith-9-rising-from-the-bow
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'What is said on rising from the bow: the fill of heaven and earth, snow and hail, the thirty-odd angels'
  read:
  - Jāmiʿ 9:1330.1-1333.1
  tags:
  - motif: praise-filling-heavens-earth-and-what-you-will
    refs:
    - Jāmiʿ 9:1330.1
    - Jāmiʿ 9:1330.2
    - Jāmiʿ 9:1331.1
    - Jāmiʿ 9:1331.2
    note: اللَّهُمَّ ربنا لك الحمدُ، مِلأُ السماواتِ ومِلأُ الأرض. ومِلأُ ما شِئت من شيء بعدُ ... مِلْءَ السماوات والأرض،
      ومِلْءَ ما شئت من شيء بعدُ
  - motif: purify-me-with-snow-hail-and-cold-water
    refs:
    - Jāmiʿ 9:1330.1
    note: اللَّهُمَّ طَهِّرني بالثَلْجِ والبَرَدِ والماء البارد، اللَّهُمَّ طَهِّرني من الذنوب والخطايا كما يُنَقَّى الثوبُ
      الأبيضُ من الوسخ
  - motif: none-withholds-what-god-gives
    refs:
    - Jāmiʿ 9:1330.2
    - Jāmiʿ 9:1331.1
    note: لا مانع لما أعطيتَ، ولا مُعْطِي لما منعتَ، ولا ينفعُ ذا الجدِّ منك الجدُّ
  - motif: praise-heard-then-our-lord-to-you-praise
    refs:
    - Jāmiʿ 9:1331.3
    - Jāmiʿ 9:1332.1
    - Jāmiʿ 9:1332.2
    note: 'ربنا ولك الحمد ... إذا قال الإمام سمع الله لمن حَمِدَه، فقولوا: اللَّهُمَّ ربنا لك الحمد، فإنه من وافق قولُه قولَ
      الملائكة، غفر له ما تقدّم من ذنبه'
  - motif: thirty-odd-angels-race-to-write-praise
    refs:
    - Jāmiʿ 9:1332.3
    note: ربنا ولك الحمدُ حمدًا كثيرًا طيبًا مباركًا فيه ... رأيتُ بضعةً وثلاثين مَلَكًا يبتدرونها أيُّهم يكتُبهن أول
  - motif: fell-from-horse-right-side-grazed-prayed-sitting
    refs:
    - Jāmiʿ 9:1333.1
    note: سقط النَّبِيّ ﷺ عن فَرَسٍ فجُحِشَ شِقُّه الأيْمَنُ ... فَصَلَّى بنا قاعدًا. فصلَّينا وراءه قعودًا
  - motif: pray-sitting-behind-seated-imam
    refs:
    - Jāmiʿ 9:1333.1
    note: وإذا صلى قاعدًا فصلوا قُعودًا أجمعون
  hints:
  - '''Purify me with snow, hail and cold water'', against Ps 51:9 ''wash me and I shall be whiter than snow'' and Job 9:30
    ''if I wash myself with snow water and cleanse my hands with lye'''
- id: hadith-9-going-down-to-prostrate
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Going down to prostrate: hands before knees, not kneeling like a camel'
  read:
  - Jāmiʿ 9:1333.2-1334.1
  tags:
  - motif: hands-before-knees-going-down
    refs:
    - Jāmiʿ 9:1333.2
    - Jāmiʿ 9:1334.1
    note: 'أنه كان يضع يديه قبل ركبتيه، وقال: كان رسول الله ﷺ يفعل ذلك ... وليضع يديه قبل ركبتيه'
  - motif: do-not-kneel-as-the-camel-kneels
    refs:
    - Jāmiʿ 9:1334.1
    note: إذا سجد أحدكم فلا يبرك كما يبرك البعير
- id: hadith-9-prostration
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'The prostration: arms held from the body until the armpits show, not spread like a dog''s, on seven limbs'
  read:
  - Jāmiʿ 9:1337.1-1342.1
  tags:
  - motif: forearms-not-spread-like-a-dog
    refs:
    - Jāmiʿ 9:1337.1
    - Jāmiʿ 9:1337.2
    - Jāmiʿ 9:1338.1
    note: اعتدِلُوا في السجود، ولا يَبْسُط أحدكم ذراعيه انبساط الكلب ... ولا يسجد الرّجل باسطًا ذراعيه كالكلب ... أن يفترش
      أحدنا ذراعيه افتراش الكلب أو السبع
  - motif: whiteness-of-armpits-seen
    refs:
    - Jāmiʿ 9:1338.2
    - Jāmiʿ 9:1339.1
    - Jāmiʿ 9:1339.2
    - Jāmiʿ 9:1340.1
    - Jāmiʿ 9:1340.2
    - Jāmiʿ 9:1341.2
    note: فرَّج بين يديه حتَّى يبدوَ بياضُ إبطيه ... حتَّى يُرَى وَضَحُ إبطيه من ورائه ... فكنتُ أنظر إلى عُفرتي إبطيه إذا
      سجد ... جافَى حتى يُرَى بياضُ إبطيه ... لو كنت قُدَّام النبي ﷺ لرأيتُ إِبْطيه ... إذا سجد يُري بياض إِبطَيه
  - motif: palms-down-elbows-raised
    refs:
    - Jāmiʿ 9:1338.3
    - Jāmiʿ 9:1338.4
    note: إذا سجدت فضَعْ كفَّيك، وارفَع مرفقيك ... فوضع يديه، واعتمد على ركبتيه، ورفع عجيزته
  - motif: a-lamb-could-pass-under-him
    refs:
    - Jāmiʿ 9:1339.1
    note: لو شاءت بَهْمَةٌ أن تمر بين يديه لمرَّتْ
  - motif: every-limb-prostrates-when-arms-held-apart
    refs:
    - Jāmiʿ 9:1341.1
    note: لا تَبْسُط ذِرَاعَيك كبَسْطِ السبع، وادَّعِمْ على رَاحَتَيك، وجَافِ عن ضَبْعَيك، فإنك إذا فعلت ذلك سجد كل عضو منك
  - motif: at-salam-face-turned-till-cheek-seen
    refs:
    - Jāmiʿ 9:1341.2
    note: ثم إذا سَلَّم أقْبل بوجهه عن يمينه حتى يُري بياض خدِّ، وعن يساره
  - motif: seven-limbs-of-prostration-hair-and-garment-not-gathered
    refs:
    - Jāmiʿ 9:1342.1
    note: 'أن يسجدَ على سبعة أعضاء، ولا يكُفُّ شعرًا، ولا ثوبًا: الجبهةِ واليدين والركبتين والرجلين'
