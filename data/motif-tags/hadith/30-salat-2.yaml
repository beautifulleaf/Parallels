  - motif: last-sitting-on-buttock-left-foot-forward
    refs:
    - Jāmiʿ 9:1244.1
    note: وإذا جلس في الركعة الآخرة قدَّم رجله اليُسرى ونصب الأخرى، وقعد على مقعدته
- id: hadith-9-opening-supplications
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'What is said after the opening takbir: the pause, ''I have turned my face'', the latecomer''s praise and the angels'
  read:
  - Jāmiʿ 9:1254.1-1257.1
  quran:
  - '1:2'
  - '1:7'
  - 6:79
  - 6:162-163
  tags:
  - motif: opening-pause-sins-distanced-washed-with-snow-and-hail
    refs:
    - Jāmiʿ 9:1254.1
    note: يسكتُ بين التكبير وبين القراءةِ إسكاتةً ... اللهم باعد بيني وبين خطايايَ كما باعدتَ بين المشرق والمغرب، اللهم نقِّني
      من الخطايا كما يُنَقَّى الثوبُ الأبيضُ من الدنَس، اللَّهم اغسِل خطايايَ بالماء والثلج والبَرد
  - motif: no-pause-on-rising-to-second-raka
    refs:
    - Jāmiʿ 9:1255.1
    note: إذا نهض من الركعة الثانية استفتح القراءة بـ ﴿الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ﴾ ولم يسكت
  - motif: opening-i-have-turned-my-face-evil-not-to-you
    refs:
    - Jāmiʿ 9:1255.2
    note: وجَّهتُ وجهي للذي فطر السماواتِ والأرضَ حنيفًا ... لبيك وسعديك، والخيرُ كله في يديك، والشر ليس إليك
  - motif: bow-humbles-hearing-sight-marrow-bone-sinew
    refs:
    - Jāmiʿ 9:1255.2
    note: خشع لك سَمْعي وبصري، ومُخي وعظْمِي وعصبي
  - motif: praise-filling-heavens-earth-and-what-you-will
    refs:
    - Jāmiʿ 9:1255.2
    note: اللهم ربنا لك الحمدُ مِلأَ السماوات ومِلأَ الأرضِ ومِلأَ ما بينهما، ومِلأَ ما شئت من شيء بعدُ
  - motif: face-prostrates-to-who-shaped-it-and-split-its-hearing
    refs:
    - Jāmiʿ 9:1255.2
    note: سجد وجْهي للذي خلقه وصوَّره، وشق سمْعَه، وبصرَه، تبارك الله أحسنُ الخالقين
  - motif: you-are-the-advancer-and-the-postponer
    refs:
    - Jāmiʿ 9:1255.2
    note: 'بين التشهد والتسليم: "اللهم اغفر لي ما قدَّمتُ وما أخَّرتُ ... أنت المقدِّمُ، وأنت المؤخِّر'
  - motif: twelve-angels-race-to-raise-praise
    refs:
    - Jāmiʿ 9:1256.1
    note: 'وقد حفزه النَفَسِّ فقال: "الحمد لله حمدًا كثيرًا طيبًا مباركًا فيه" ... لقد رأيتُ اثني عشر مَلَكًا يبتدرونها، أيُّهم
      يرفعُها'
  - motif: gates-of-heaven-opened-for-a-formula
    refs:
    - Jāmiʿ 9:1256.2
    note: الله أكبر كبيرًا، والحمد لله كثيرًا، وسبحان الله بكرة وأصيلًا ... عجبتُ لها، فتحت لها أبواب السماء
  - motif: two-pauses-dispute-settled-by-letter-to-ubayy
    refs:
    - Jāmiʿ 9:1256.3
    note: سكتة إذا كبَّر، وسكتة إذا فرغ من قراءة ﴿غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ﴾ ... فكتبا في ذلك إلى
      أبي بن كعب
  - motif: umar-says-subhanaka-aloud
    refs:
    - Jāmiʿ 9:1257.1
    note: 'كان يجهر بهؤلاء الكلمات يقول: سبحانك اللهمَّ وبحمدك، تبارك اسمك، وتعالى جدُّك، ولا إله غيرك'
  hints:
  - '''Wash my sins with water, snow and hail'' and ''cleanse me as a white garment is cleansed of dirt'', against Ps 51:9
    ''purge me with hyssop ... wash me and I shall be whiter than snow'' and Isa 1:18 ''though your sins be like scarlet they
    shall be white as snow'''
- id: hadith-9-right-hand-on-left
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The right hand on the left in standing, and the prophets' threefold command
  read:
