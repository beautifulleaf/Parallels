    note: يُؤَخِّر العِشاء إلى ثُلُث اللَّيل، ويكره النوم قَبْلَها، والحديثَ بعدَها، وكان يقرأُ في صلاة الفَجْر من المائة
      إلى السِتِّين. وكان ينصرف حين يعرفُ بعضُنا وجه بَعْضٍ
  - motif: qaf-recited-at-dawn-friday-and-eids
    refs:
    - Jāmiʿ 9:1288.1
    - Jāmiʿ 9:1288.3
    - Jāmiʿ 9:1289.2
    - Jāmiʿ 9:1291.1
    note: 'فقرأ: ﴿ق وَالْقُرْآنِ الْمَجِيدِ﴾ [سورة ق: ١] حتى قرأ: ﴿وَالنَّخْلَ بَاسِقَاتٍ﴾ ... ما أخذتُ ﴿ق وَالْقُرْآنِ الْمَجِيدِ
      (١)﴾ إلا من وراء رسول الله ﷺ'
  - motif: night-as-it-departs-recited-at-dawn
    refs:
    - Jāmiʿ 9:1288.2
    note: 'يقرأ في الفجر: ﴿وَاللَّيْلِ إِذَا عَسْعَسَ﴾'
  - motif: waqia-at-dawn-yet-lighter-than-yours
    refs:
    - Jāmiʿ 9:1288.3
    - Jāmiʿ 9:1289.1
    note: وكانت صلاته بعد تخفيفا ... كانت صلاتُه أخفَّ من صلاتِكم، وكان يقرأ في الفجر "الواقعة" ونحوَها من السور
  - motif: cough-cuts-recitation-short
    refs:
    - Jāmiʿ 9:1289.3
    note: فاستفتح سورة (المؤمنين) حتى جاء ذكر موسى وهارون، أو ذكر عيسى ﵈ أخذتِ النبيَّ ﷺ سَعْلَهٌ فركع
  - motif: zalzala-in-both-rakas-forgot-or-deliberate
    refs:
    - Jāmiʿ 9:1290.1
    note: في الركعتين كلتيهما، فلا أدري أنَسِي رسول الله ﷺ أم قرأ ذلك عمدًا
  - motif: saffat-at-dawn
    refs:
    - Jāmiʿ 9:1290.2
    note: إن كان رسول الله ﷺ ليؤمُّنا في الفجر بالصافات
  - motif: best-two-suras-taught-then-prayed-at-dawn
    refs:
    - Jāmiʿ 9:1291.2
    note: كنتُ أقودُ برسولِ الله ﷺ في السفر ... ألا أعلمُك خير سورتين قرئتا؟ ... فلم يرني سررتُ بهما جدًّا، فلما نزل لصلاة
      الصبح، صلى بهما ... يا عقبةُ! كيف رأيت؟
  - motif: followers-bad-ablution-confuses-recitation
    refs:
    - Jāmiʿ 9:1292.1
    note: فقرأ "الروم" فالتبس عليه ... ما بال أقوام يصلّون معنا لا يحسنون الطهور، فإنما يلبس علينا القرآن أولئك
