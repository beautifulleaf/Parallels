  tags:
  - motif: devil-named-khinzab-confuses-prayer-spit-left-thrice
    refs:
    - Jāmiʿ 9:1313.1
    note: إن الشيطان قد حال بيني وبين صلاتي وقراءتي. يلبسُها عليَّ ... ذاك شيطان يقال له خِنْزَبٌ، فإذا أحسسته فتعوذ بالله
      منه. واتفل على يسارك ثلاثًا ... فأذْهَبَه الله عني
