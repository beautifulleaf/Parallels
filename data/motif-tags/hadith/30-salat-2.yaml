  tags:
  - motif: people-were-ordered-right-hand-on-left-forearm
    refs:
    - Jāmiʿ 9:1261.1
    note: كان الناس يؤمرون أن يضع الرّجلُ اليد اليُمني على ذراعه اليُسرى في الصّلاة ... لا أعلم إِلَّا أنه يَنْمي ذلك
  - motif: wrapped-in-garment-brings-hands-out-to-bow
    refs:
    - Jāmiʿ 9:1262.1
    note: ثمّ التحف بثوبه، ثمّ وضع يده اليُمنى على اليُسْرى. فلمّا أراد أن يركع أخرج يديه من الثوب
  - motif: prostrates-with-head-between-hands
    refs:
    - Jāmiʿ 9:1262.1
    note: فلمّا سجد، سجد بين كفيه
  - motif: hands-raised-to-the-ears
    refs:
    - Jāmiʿ 9:1262.1
    note: وصف همام حيال أذنيه
  - motif: prophet-moves-praying-mans-hands-right-over-left
    refs:
    - Jāmiʿ 9:1263.1
    note: فوضع يده اليُسرى على اليُمنى، فرآه النَّبِيّ ﷺ، فوضع يده اليُمنى على اليُسرى
  - motif: never-forgot-seeing-right-on-left
    refs:
    - Jāmiʿ 9:1263.2
    note: ما نسيتُ من الأشياء، لم أنس أني رأيتُ رسول الله ﷺ واضعًا يمينَه على شماله في الصّلاة
  - motif: right-hand-grasps-left-in-prayer
    refs:
    - Jāmiʿ 9:1261.1
    - Jāmiʿ 9:1262.1
    - Jāmiʿ 9:1263.1
    - Jāmiʿ 9:1263.2
    - Jāmiʿ 9:1264.1
    note: وضع يده اليُمنى على اليُسْرى ... واضعًا يمينَه على شماله
  - motif: prophets-hasten-iftar-delay-sahur-right-on-left
    refs:
    - Jāmiʿ 9:1264.1
    note: إنَّا معاشر الأنبياء أمرنا أن نُعجل الإفطار، ونُؤخر السحور، وأن نَضرب بأيماننا على شمائلنا
- id: hadith-9-opening-with-the-fatiha
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The prayer opened with 'Praise be to God, Lord of the worlds', read verse by verse
  read:
  - Jāmiʿ 9:1265.1-1267.1
  quran:
  - 1:1-4
  - '1:2'
  tags:
  - motif: prayer-opened-with-al-hamdu-by-prophet-and-first-caliphs
    refs:
    - Jāmiʿ 9:1265.1
    - Jāmiʿ 9:1265.3
    note: إن النَّبِيّ ﷺ وأبا بكر وعمر ﵄ كانوا يفتتحون الصّلاة بـ ﴿الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ﴾ ... يستفتح الصّلاة
      بالتكبير، والقراءة بـ
  - motif: no-pause-on-rising-to-second-raka
    refs:
    - Jāmiʿ 9:1265.2
    note: استفتح القراءة بـ ﴿الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ﴾، ولم يسكت
  - motif: fatiha-recited-verse-by-verse-with-stops
    refs:
    - Jāmiʿ 9:1267.1
    note: 'كان رسول الله ﷺ يقطع قراءته يقول: ﴿بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ﴾ ثمّ يقف ... هكذا يقطعه قراءته آية آية'
- id: hadith-9-no-prayer-without-fatiha
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: No prayer without the Opening of the Book; the prayer divided between God and his servant
  read:
  - Jāmiʿ 9:1268.1-1273.1
  quran:
  - 1:1-7
  - 1:2-7
  tags:
  - motif: no-prayer-without-the-fatiha
    refs:
    - Jāmiʿ 9:1268.1
    - Jāmiʿ 9:1269.1
    - Jāmiʿ 9:1273.1
    note: لا صلاة لمن لم يقرأ بفاتحة الكتاب ... لا تجزئ صلاة لا يقرأ فيها بفاتحة الكتاب
  - motif: recitation-heavy-for-prophet-when-followers-recite
    refs:
    - Jāmiʿ 9:1269.1
    note: 'فثقلتْ عليه القراءةُ فلمّا فرغ قال: "لعلكم تقرأون خلف إمامكم"'
  - motif: behind-imam-recite-only-the-fatiha
    refs:
    - Jāmiʿ 9:1269.1
    note: 'قلنا: نعم هذًّا يا رسول الله! قال: "لا تفعلوا إِلَّا بفاتحة الكتاب'
  - motif: prayer-without-fatiha-is-defective
    refs:
    - Jāmiʿ 9:1272.1
    note: فهي خداج، فهي خداج، فهي خداج غير تام
  - motif: read-it-in-yourself-o-persian
    refs:
    - Jāmiʿ 9:1272.1
    note: 'فغمز ذراعي ثمّ قال: اقرأ بها في نفسك يا فارسيُّ'
  - motif: prayer-divided-between-god-and-servant
    refs:
    - Jāmiʿ 9:1272.1
    note: 'قَسمتُ الصّلاة بيني وبين عَبدي نِصفين ... يقول الله ﵎: حَمِدني عبديّ ... يقول الله: أثنى عليّ عبديّ ... يقول الله:
      مجَّدني عبديّ ... فهذه الآية بيني وبين عبدي ولعبدي ما سأل'
- id: hadith-9-reciting-behind-the-imam
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Reciting behind the imam: ''why am I contended with in the Quran'', silence for the imam, the Opening in oneself'
  read:
  - Jāmiʿ 9:1273.2-1277.1
  quran:
  - 1:1-7
  - '1:7'
  tags:
  - motif: why-am-i-contended-with-in-the-quran
    refs:
    - Jāmiʿ 9:1273.2
    note: 'هل قرأ مَعِي منكم أحد آنفًا ... إنِّي أقول: ما لي أُنازع القرآن ... فانتهى الناس عن القراءة مع رسول الله ﷺ فيما
      جهر فيه'
  - motif: when-imam-recites-be-silent
    refs:
    - Jāmiʿ 9:1274.1
    note: إنّما جعل الإمام ليؤتم به، فإذا كبَّر فكبِّرُوا، وإذا قرأ فأنصتوا
  - motif: pray-sitting-behind-seated-imam
    refs:
    - Jāmiʿ 9:1274.1
    note: وإذا صلى جالسًا فصلوا جلوسًا
  - motif: behind-imam-recite-only-the-fatiha
    refs:
    - Jāmiʿ 9:1275.1
    note: لعلكم تقرؤن والإمام يقرأ؟ " مرتين أو ثلاثًا ... فلا تفعلوا إِلَّا أن يقرأ أحدكم بفاتحة الكتاب
  - motif: recite-fatiha-and-what-god-wills
    refs:
    - Jāmiʿ 9:1275.2
    - Jāmiʿ 9:1276.1
    note: ثمّ اقرأ بأمِّ القرآن، وبما شاء الله أن تقرأ ... ونحمد الله وتقرأ بأم القرآن
  - motif: man-told-go-back-and-pray-you-have-not-prayed
    refs:
    - Jāmiʿ 9:1276.1
    note: 'ارجع فصلِّ، فإنَّك لم تُصلِّ" ثلاثًا ... فحلف له: كيف؟ اجتهدت كذا'
  - motif: say-amin-god-will-answer-you
    refs:
    - Jāmiʿ 9:1276.2
    note: 'إذا صليتم فأقيموا صفوفكم، ثمّ ليؤمكم أحدكم ... فقولوا: آمين، يجبكم الله'
  - motif: prayer-without-fatiha-is-defective
    refs:
    - Jāmiʿ 9:1276.3
    - Jāmiʿ 9:1277.1
    note: كل صلاة لا يقرأ فيها بفاتحة الكتاب فهي خِداج، فهي خِداج ... كل صلاة لا يقرأ فيها بأم الكتاب فهي خِداج
- id: hadith-9-more-than-the-fatiha
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'What is added to the Opening: ''if you add it is better''; the herald; the youth''s humming'
  read:
  - Jāmiʿ 9:1278.1-1280.2
  quran:
  - 1:1-7
  tags:
  - motif: what-he-made-audible-we-make-audible
    refs:
    - Jāmiʿ 9:1278.1
    note: فما أسمعنا رسولُ الله ﷺ أسمعناكم، وما أخفى عنَّا أَخفينا عنكم، وإن لم تزد على أم القرآن أجزأتْ، وإن زدتَ فهو خير
  - motif: herald-sent-to-cry-no-prayer-without-recitation
    refs:
    - Jāmiʿ 9:1278.2
    note: اخرج فنادِ، أنه لا صلاة إِلَّا بقراءة فاتحة الكتاب، فما زاد
  - motif: fatiha-and-what-is-easy
    refs:
    - Jāmiʿ 9:1279.1
    note: أُمِرنا أن نقرأ بفاتحة الكتاب وما تيسر
  - motif: recite-fatiha-and-what-god-wills
    refs:
    - Jāmiʿ 9:1280.1
    note: ثم اقرأ بأم القرآن، وبما شاء الله أن تقرأ
  - motif: my-humming-and-muadhs-is-about-these-two
    refs:
    - Jāmiʿ 9:1280.2
    note: أقرأ بفاتحة الكتاب، وأسأل الله الجنة، وأعوذ به من النار، وإني لا أدري ما دندنتك ولا دندنةَ معاذ ... إني ومعاذٌ حول
      هاتين
- id: hadith-9-no-loud-recitation-behind-imam
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'No loud recitation behind the imam: ''pulled from me'', ''confused for me'''
  read:
  - Jāmiʿ 9:1281.1-1282.1
  quran:
  - '87:1'
  tags:
  - motif: you-pulled-it-from-me-sabbih-behind-him
    refs:
    - Jāmiʿ 9:1281.1
    note: 'أيكم قرأ خلفي بسبِّح اسم ربك الأعلى" فقال رجل: أنا، ولم أرد بها إلا الخير، قال: "قد علمت أن بعضكم خالجنيها'
  - motif: you-have-confused-the-quran-for-me
    refs:
    - Jāmiʿ 9:1282.1
    note: 'كان الناس يجهرون بالقرآن خلف رسول الله ﷺ فقال لهم رسول الله ﷺ: "خلطتم عليَّ القرآن'
- id: hadith-9-amin
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Amin after the Opening: aloud, coinciding with the angels, envied by the Jews'
  read:
  - Jāmiʿ 9:1282.2-1286.2
  quran:
  - 1:1-7
  - '1:7'
  tags:
  - motif: amin-coinciding-with-angels-forgives
    refs:
    - Jāmiʿ 9:1282.2
    note: 'فقولوا: آمين، فإنه من وافق قولُه قول الملائكة غُفِر له ما تقدم من ذنبه'
  - motif: prophet-raises-voice-with-amin
    refs:
    - Jāmiʿ 9:1283.1
    - Jāmiʿ 9:1284.2
    note: 'إذا فرغ من قراءة أمّ القرآن، رفع صوته وقال: "آمين" ... فقال: "آمين" ومدَّ بها صوته'
  - motif: say-amin-god-will-answer-you
    refs:
    - Jāmiʿ 9:1284.1
    note: 'فقولوا: آمين، يجبكم الله'
  - motif: do-not-outpace-the-imam
    refs:
    - Jāmiʿ 9:1286.1
    note: لا تُبادروا الإمام، إذا كبَّر فكبِّروا
  - motif: jews-envy-you-for-the-greeting-and-amin
    refs:
    - Jāmiʿ 9:1286.2
    note: ما حسَدَتْكم اليهودُ على شيء ما حسدتْكم على السلام والتأمين
  hints:
  - 'The amin that, coinciding with the angels'', wins forgiveness of past sins, against b. Shabbat 119b: whoever answers
    ''amen, yehe shemeh rabba'' with all his strength has his evil decree torn up (and the gates of the Garden opened, R.
    Yehoshua b. Levi); amen answered to the leader''s blessing, m. Berakhot 8:8'
- id: hadith-9-dawn-recitation
  tradition: islam
  corpus: hadith
