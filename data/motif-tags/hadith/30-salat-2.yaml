    note: طوفي من وراء الناس وأنت راكبةٌ ... فطُفتُ راكبةً بعيري، ورسول الله ﷺ حينئذ يُصَلِّي إلى جانب البيت، وهو يقرأ بـ
      ﴿وَالطُّورِ﴾
  - motif: prostrates-at-inshiqaq-until-he-meets-him
    refs:
