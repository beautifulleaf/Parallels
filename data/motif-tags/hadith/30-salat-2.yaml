# Hadith chunk 30: al-Jāmiʿ al-Kāmil book 9 (kitāb al-ṣalāt), pp. 1223-1342 (printed 2/443-562): the imam and the
# muezzin, the change of the qibla, the description of the prayer (takbir, raising the hands, the opening supplications,
# the right hand on the left, the Opening and amin, what was recited at each prayer, answering the verses), the bow,
# the repose, the rising and the prostration. Read in full from the Arabic (174 hadith).
new_motifs:
  imam-guarantor-muezzin-trusted:
    label: 'The imam is a guarantor (ḍāmin), the muezzin one entrusted (muʾtaman): ''O God, guide the imams and forgive the
      muezzins'''
    cluster: ritual
  leader-who-prays-right-prayer-is-his-and-theirs:
    label: Whoever leads the people and gets it right, the prayer is his and theirs; whatever he falls short in is on him
      and not on them
    cluster: ritual
  companion-on-ship-refuses-to-lead-prayer:
    label: On a ship the travellers ask the Companion ʿUqba b. ʿĀmir to lead the prayer as the most entitled; he refuses and
      cites the saying on the leader's burden
    cluster: ritual
  bilal-twists-neck-at-hayya-without-turning:
    label: At 'come to prayer, come to success' Bilal twists his neck right and left but does not turn round (lam yastadir)
    cluster: ritual
  prophet-in-red-leather-tent-red-yemeni-suit:
    label: At Mecca the prophet is in a red dome-tent of leather and comes out in a red suit of striped Yemeni (qiṭrī) cloth
    cluster: sira
  muezzin-followed-mouth-this-way-and-that:
    label: The narrator follows the muezzin's mouth this way and that as he calls
    cluster: ritual
  iqama-only-when-imam-appears:
    label: Bilal calls when the sun declines but gives the iqāma only when he sees the prophet come out
    cluster: ritual
  imam-remembers-impurity-leaves-returns-washed:
    label: Standing in his place before the takbir he remembers (that he is impure), says 'stay where you are', and returns
      washed, his head dripping water
    cluster: ritual
  do-not-stand-until-you-see-me:
    label: When the iqāma is called, do not stand until you see me
    cluster: ritual
  man-detains-prophet-after-iqama:
    label: After the iqāma is called a man accosts the prophet and keeps him (talking)
    cluster: ritual
  youths-stay-twenty-days-sent-home-to-teach:
    label: A band of youths of like age stays twenty days and nights; seeing they miss their families, he sends them home
      to teach them
    cluster: sira
  pray-as-you-have-seen-me-pray:
    label: '''Pray as you have seen me pray'''
    cluster: ritual
  eldest-of-you-leads-prayer:
    label: When the prayer comes let one of you give the call and the eldest of you lead
    cluster: ritual
  jews-rejoice-at-jerusalem-qibla:
    label: Most of Medina's people being Jews, God orders the prophet to face Jerusalem and the Jews rejoice; he loves the
      qibla of Abraham and looks to heaven
    cluster: polemic
  qibla-first-thing-abrogated-in-quran:
    label: The qibla was the first thing in the Quran that God abrogated
    cluster: scripture
  at-mecca-faced-jerusalem-with-kaba-before-him:
    label: At Mecca he prayed toward Jerusalem with the Kaʿba in front of him
    cluster: sira
  two-rakas-each-way-at-qibla-change:
    label: The herald comes when the imam has prayed two rakʿas; they pray the remaining two toward the Kaʿba
    cluster: ritual
  face-qibla-then-takbir:
    label: When you rise to pray, complete the ablution, face the qibla, then say the takbir
    cluster: ritual
  between-east-and-west-is-qibla:
    label: What lies between the east and the west is qibla
    cluster: ritual
  supplicated-in-kaba-corners-prayed-outside-this-is-qibla:
    label: 'Inside the House he supplicates in all its sides and does not pray; coming out he prays two rakʿas before its
      front: ''This is the qibla'''
    cluster: ritual
  takbir-at-every-lowering-and-rising:
    label: 'He says ''God is greatest'' at every lowering and rising: rising, bowing, going down, raising the head, prostrating,
      and standing up from the second rakʿa'
    cluster: ritual
  leader-swears-he-prays-most-like-prophet:
    label: 'A prayer leader (Abū Hurayra) swears: ''I am the one of you whose prayer most resembles the messenger of God''s'''
    cluster: ritual
  ali-prayer-reminds-of-muhammads:
    label: 'After praying behind ʿAlī, ʿImrān takes Muṭarrif''s hand: ''this man has reminded me of the prayer of Muhammad'''
    cluster: ritual
  takbir-man-at-maqam-motherless-one:
    label: 'A man at the Maqām says takbir at every lowering and rising; told of it, Ibn ʿAbbās: ''is that not the prayer
      of the prophet, you motherless one (lā umma lak)!'''
    cluster: ritual
  men-boys-women-in-successive-rows:
    label: He ranges the men in the front row, the boys behind them, and the women behind the boys
    cluster: ritual
  six-takbirs-in-first-raka:
    label: His takbirs in the first rakʿa were six
    cluster: ritual
  tribe-gathered-with-wives-and-sons-to-be-taught-prayer:
    label: Abū Mālik gathers the Ashʿarīs with their women and sons to show them the prophet's ablution and prayer
    cluster: ritual
  subhan-allah-wa-bihamdihi-thrice-in-ruku:
    label: In the bow he says 'Glory to God and his praise' three times
    cluster: ritual
  fatiha-and-sura-recited-silently:
    label: He recites the Opening of the Book and a sura silently (yusirruhumā)
    cluster: ritual
  bedouin-kneels-and-gestures-describe-them:
    label: A bedouin from the far edge of the crowd kneels, waves his hand toward the prophet and asks 'describe them to us';
      the prophet's face is gladdened by the question
    cluster: sira
  pulpits-of-light-faces-and-clothes-light:
    label: God sets for them pulpits of light on the day of resurrection, makes their faces light and their clothes light;
      the people panic and they do not
    cluster: eschatology
  hands-raised-to-shoulders-at-opening-bow-and-rising:
    label: He raises his hands level with his shoulders (ḥadhw mankibayh) when opening the prayer, when bowing and when rising
      from the bow
    cluster: ritual
  hands-raised-to-the-ears:
    label: He raises his hands until they are level with his ears
    cluster: ritual
  no-hand-raising-in-prostration-or-sitting:
    label: He does not raise his hands in the prostration, nor anywhere in the prayer while sitting
    cluster: ritual
  hands-raised-on-rising-from-two-rakas:
    label: He raises his hands again on standing up from the two rakʿas
    cluster: ritual
  right-hand-grasps-left-in-prayer:
    label: In standing he places his right hand on his left (grasps his left with his right)
    cluster: ritual
  two-fingers-closed-ring-formed-index-points:
    label: Sitting, he closes two fingers, forms a ring of thumb and middle finger and points with the index
    cluster: ritual
  prostrates-with-head-between-hands:
    label: He prostrates with his head between his palms
    cluster: ritual
  hands-like-tails-of-restive-horses:
    label: '''Why do I see you raising your hands like the tails of restive horses (khayl shums)? Be still in the prayer'''
    cluster: ritual
  ten-companions-test-abu-humayd-on-prophets-prayer:
    label: Among ten Companions Abū Ḥumayd claims to know the prophet's prayer best; they challenge him ('you were not the
      most with him') and, when he has shown it, say 'you speak true'
    cluster: ritual
  every-bone-returns-to-its-place:
    label: He holds each posture until every vertebra (or bone, or limb) returns to its place
    cluster: ritual
  toes-turned-to-qibla-in-prostration:
    label: In prostration he turns the tips of his toes toward the qibla
    cluster: ritual
  sits-on-left-foot-right-foot-upright:
    label: Sitting after two rakʿas he sits on his left foot and sets the right foot upright
    cluster: ritual
  last-sitting-on-buttock-left-foot-forward:
    label: In the last sitting he puts the left foot forward, sets the other upright and sits on his seat (tawarruk)
    cluster: ritual
  back-bent-level-in-the-bow:
    label: Bowing he grips his knees and bends his back level (haṣara ẓahrah)
    cluster: ritual
  opening-pause-sins-distanced-washed-with-snow-and-hail:
    label: 'In the pause between takbir and recitation: ''distance me from my sins as you distanced east and west; cleanse
      me of sins as a white garment is cleansed of dirt; wash my sins with water, snow and hail'''
    cluster: ritual
  no-pause-on-rising-to-second-raka:
    label: Rising to the second rakʿa he opens the recitation with 'Praise be to God, Lord of the worlds' and does not pause
    cluster: ritual
  opening-i-have-turned-my-face-evil-not-to-you:
    label: 'Opening the prayer: ''I have turned my face to him who split the heavens and the earth ... at your service ...
      all good is in your hands and evil is not to you (wa-l-sharr laysa ilayk)'''
    cluster: ritual
  bow-humbles-hearing-sight-marrow-bone-sinew:
    label: 'Bowing: ''to you my hearing, my sight, my marrow, my bone and my sinew are humbled'''
    cluster: ritual
  face-prostrates-to-who-shaped-it-and-split-its-hearing:
    label: 'Prostrating: ''my face prostrates to him who created it and shaped it and split its hearing and its sight; blessed
      is God the best of creators'''
    cluster: ritual
  praise-filling-heavens-earth-and-what-you-will:
    label: 'On rising from the bow: ''Our Lord, to you be praise, the fill of the heavens and the fill of the earth (and what
      is between them) and the fill of whatever you will after'''
    cluster: ritual
  you-are-the-advancer-and-the-postponer:
    label: 'The last words before the salām: ''forgive me what I have put forward and put back, hidden and shown ... you are
      the Advancer and the Postponer (al-muqaddim, al-muʾakhkhir)'''
    cluster: ritual
  twelve-angels-race-to-raise-praise:
    label: A latecomer, out of breath, says 'Praise be to God, much, good, blessed'; 'I saw twelve angels racing to be the
      one to raise it'
    cluster: angelology
  gates-of-heaven-opened-for-a-formula:
    label: 'A man says ''God is greatest greatly, praise be to God much, glory to God morning and evening'': ''I marvelled
      at it: the gates of heaven were opened for it'''
    cluster: angelology
  two-pauses-dispute-settled-by-letter-to-ubayy:
    label: Samura remembers two pauses (after the takbir and after 'nor of those astray'); ʿImrān denies it; they write to
      Ubayy b. Kaʿb, who replies that Samura has remembered
    cluster: ritual
  umar-says-subhanaka-aloud:
    label: ʿUmar says aloud 'Glory to you O God and your praise, blessed is your name, exalted your majesty, there is no god
      but you'
    cluster: ritual
  people-were-ordered-right-hand-on-left-forearm:
    label: 'People were ordered to place the right hand on the left forearm in prayer; Abū Ḥāzim: ''I know only that he traced
      it (to the prophet)'''
    cluster: ritual
  wrapped-in-garment-brings-hands-out-to-bow:
    label: After the takbir he wraps himself in his garment, puts his right hand on his left, and brings his hands out of
      the garment to raise them for the bow
    cluster: ritual
  prophet-moves-praying-mans-hands-right-over-left:
    label: Seeing Ibn Masʿūd praying with his left hand over his right, the prophet sets his right hand over the left
    cluster: ritual
  never-forgot-seeing-right-on-left:
    label: '''Of all things I forgot, I did not forget that I saw the messenger of God with his right hand on his left in
      prayer'''
    cluster: ritual
  prophets-hasten-iftar-delay-sahur-right-on-left:
    label: '''We, the company of prophets, were commanded to hasten the breaking of the fast, delay the predawn meal, and
      strike our right hands on our left'''
    cluster: prophecy
  prayer-opened-with-al-hamdu-by-prophet-and-first-caliphs:
    label: The prophet, Abū Bakr and ʿUmar opened the prayer with 'Praise be to God, Lord of the worlds'
    cluster: ritual
  fatiha-recited-verse-by-verse-with-stops:
    label: 'He cut his recitation verse by verse: ''In the name of God ...'', stop; ''Praise be to God ...'', stop; ''the
      Merciful the Compassionate'', stop; ''Master of the day of judgment'''
    cluster: ritual
  no-prayer-without-the-fatiha:
    label: There is no prayer (no prayer suffices) for one who does not recite the Opening of the Book
    cluster: ritual
  behind-imam-recite-only-the-fatiha:
    label: '''Perhaps you recite behind your imam?'' ''Yes, rapidly (hadhdhan).'' ''Do not, except the Opening of the Book'''
    cluster: ritual
  recitation-heavy-for-prophet-when-followers-recite:
    label: At the dawn prayer the recitation grew heavy for him; after it he asks whether they were reciting behind him
    cluster: ritual
  read-it-in-yourself-o-persian:
    label: 'Asked about praying behind the imam, Abū Hurayra presses the questioner''s forearm: ''recite it in yourself, O
      Persian!'''
    cluster: ritual
  why-am-i-contended-with-in-the-quran:
    label: 'After a loud prayer: ''did anyone recite with me just now? ... I say: why am I contended with in the Quran (mā
      lī unāzaʿu l-qurʾān)''; the people stop reciting with him in the loud prayers'
    cluster: ritual
  when-imam-recites-be-silent:
    label: 'The imam is appointed to be followed: when he says takbir say takbir, when he recites be silent, when he says
      ''nor those astray'' say amin'
    cluster: ritual
  pray-sitting-behind-seated-imam:
    label: When the imam prays sitting, pray sitting all of you
    cluster: ritual
  man-told-go-back-and-pray-you-have-not-prayed:
    label: A man prays while the prophet watches and is told, three times, 'go back and pray, for you have not prayed', then
      is taught the prayer
    cluster: ritual
  recite-fatiha-and-what-god-wills:
    label: '''Then recite the Mother of the Quran and whatever God wills you to recite'''
    cluster: ritual
  say-amin-god-will-answer-you:
    label: '''When he says nor those astray, say amin: God will answer you (yujibkum allāh)'''
    cluster: ritual
  what-he-made-audible-we-make-audible:
    label: '''In every prayer there is recitation: what the messenger made us hear we make you hear, what he hid we hide from
      you; if you add nothing to the Mother of the Quran it suffices, if you add it is better'''
    cluster: ritual
  herald-sent-to-cry-no-prayer-without-recitation:
    label: '''Go out and proclaim: no prayer except with the recitation of the Opening of the Book, and what is more'''
    cluster: ritual
  fatiha-and-what-is-easy:
    label: '''We were commanded to recite the Opening of the Book and what is easy'''
    cluster: ritual
  my-humming-and-muadhs-is-about-these-two:
    label: 'A youth: ''I recite the Opening, ask God for paradise and seek refuge from the fire; I do not know your humming
      (dandana) or Muʿādh''s''; ''I and Muʿādh hum around these two'''
    cluster: ritual
  you-pulled-it-from-me-sabbih-behind-him:
    label: 'At the noon or afternoon prayer: ''which of you recited Sabbiḥ behind me?'' ''I, meaning only good.'' ''I knew
      one of you was pulling it from me (khālajanīhā)'''
    cluster: ritual
  you-have-confused-the-quran-for-me:
    label: 'People recited the Quran aloud behind him: ''you have confused the Quran for me (khalaṭtum ʿalayya)'''
    cluster: ritual
  prophet-raises-voice-with-amin:
    label: Finishing the Mother of the Quran he raised his voice and said amin (drew out his voice with it)
    cluster: ritual
  do-not-outpace-the-imam:
    label: '''Do not outpace the imam'': when he says takbir say takbir, ''nor those astray'' say amin, when he bows bow,
      ''God hears who praises him'' say ''O God our Lord, to you be praise'''
    cluster: ritual
  jews-envy-you-for-the-greeting-and-amin:
    label: '''The Jews have envied you for nothing as they envied you for the greeting (al-salām) and the amin'''
    cluster: polemic
  isha-delayed-to-third-sleep-before-talk-after-disliked:
    label: He delayed the night prayer to a third of the night, disliked sleep before it and talk after it, and at dawn recited
      from sixty to a hundred verses, finishing when one could recognise his neighbour's face
    cluster: ritual
  night-as-it-departs-recited-at-dawn:
    label: At dawn he is heard reciting 'and the night when it departs (ʿasʿas)'
    cluster: ritual
  waqia-at-dawn-yet-lighter-than-yours:
    label: His prayers were like yours but lighter; at dawn he recited al-Wāqiʿa and the like
    cluster: ritual
  zalzala-in-both-rakas-forgot-or-deliberate:
    label: 'At dawn he recited ''When the earth is shaken'' in both rakʿas: ''I do not know whether he forgot or recited it
      deliberately'''
    cluster: ritual
  saffat-at-dawn:
    label: '''The messenger of God would lead us at dawn with al-Ṣāffāt'''
    cluster: ritual
  best-two-suras-taught-then-prayed-at-dawn:
    label: 'Leading the prophet''s mount, ʿUqba is taught ''the best two suras recited'', the two refuges; seeing him unimpressed,
      the prophet prays the dawn with them: ''ʿUqba, how did you find it?'''
    cluster: ritual
  followers-bad-ablution-confuses-recitation:
    label: 'Confused while reciting al-Rūm at dawn: ''what of people who pray with us and do not purify well? It is they who
      confuse the Quran for us'''
    cluster: ritual
  sajda-and-insan-at-friday-dawn:
    label: At the dawn prayer of Friday he recited 'Alif Lām Mīm, the sending down' (al-Sajda) and 'Has there come upon man'
      (al-Insān)
    cluster: ritual
  first-raka-lengthened-second-shortened:
    label: At noon he recites the Opening and a sura in each of the first two rakʿas, lengthening the first and shortening
      the second, sometimes letting a verse be heard
    cluster: ritual
  lingers-in-first-two-lightens-last-two:
    label: '''I linger (arkudu) in the first two and lighten the last two'', the prayer of the messenger of God'
    cluster: ritual
  governor-investigated-mosque-by-mosque:
    label: 'Accused of not praying well, Saʿd is investigated: an envoy asks about him in every mosque of Kufa, and all praise
      him until a man of Banū ʿAbs'
    cluster: sira
  three-charges-three-curses-of-sad:
    label: 'Usāma b. Qatāda charges that Saʿd does not march with the raid, divide equally or judge justly; Saʿd prays three
      things on him if he lies: lengthen his life, lengthen his poverty, expose him to trials'
    cluster: sira
  cursed-old-man-eyebrows-over-eyes-accosts-girls:
    label: The man, grown old, says 'an old man tried, Saʿd's prayer struck me'; his eyebrows have fallen over his eyes and
      he accosts girls in the streets, pinching them
    cluster: sira
  silent-recitation-known-by-moving-beard:
    label: '''How did you know he recited at noon and afternoon?'' ''By the moving of his beard'''
    cluster: ritual
  thirty-verses-noon-fifteen-afternoon:
    label: At noon he recited about thirty verses in each of the first two rakʿas and fifteen in the last two; at the afternoon
      fifteen in the first two and half that in the last
    cluster: ritual
  named-suras-of-noon-and-afternoon:
    label: 'Suras named for the noon and afternoon prayers: Sabbiḥ (al-Aʿlā), al-Ṭāriq, al-Burūj, al-Ghāshiya, al-Inshiqāq'
    cluster: ritual
  ibn-abbas-denies-noon-recitation-khamshan:
    label: 'Asked whether the prophet recited at noon and afternoon Ibn ʿAbbās says ''no, no''; told ''perhaps in himself'':
      ''khamshan! this is worse than the first: he was a servant under command who conveyed what he was sent with'''
    cluster: ritual
  three-things-the-prophets-house-was-singled-out-for:
    label: 'He singled us (the Hāshimites) out for nothing but three: to complete the ablution, not to eat alms, and not to
      put a donkey to a mare'
    cluster: law
  leader-who-prays-most-like-the-prophet:
    label: '''I have not prayed behind anyone more like the messenger of God in prayer than so-and-so'' (a governor at Medina;
      ʿUmar b. ʿAbd al-ʿAzīz, ''this young man'')'
    cluster: ritual
  long-first-two-light-last-two-noon-short-mufassal-maghrib:
    label: The governor most like the prophet lengthened the first two of noon, lightened the last two and the afternoon,
      recited short mufaṣṣal at sunset, al-Shams at night and two long suras at dawn
    cluster: ritual
  short-mufassal-at-sunset:
    label: At sunset he recited the short suras of the mufaṣṣal
    cluster: ritual
  longest-of-the-two-long-at-sunset:
    label: 'Zayd b. Thābit to Marwān: ''why do you recite short ones at sunset? I heard the prophet recite the longer of the
      two long ones'' (al-Aʿrāf, or al-Anfāl, or Muḥammad, split over two rakʿas)'
    cluster: ritual
  named-suras-of-the-night-prayer:
    label: At the night prayer he recited 'By the fig and the olive' and 'By the sun and its morning brightness' and the like
    cluster: ritual
  wife-circles-house-riding-behind-people-while-prophet-recites-tur:
    label: Being unwell, Umm Salama is told to circle the House riding behind the people; she rides her camel round while
      the prophet prays beside the House reciting al-Ṭūr
    cluster: ritual
  prostrates-at-inshiqaq-until-he-meets-him:
    label: 'Abū Hurayra prostrates at ''When the sky is split'' in the night prayer: ''I prostrated at it behind Abū l-Qāsim
      and will not cease until I meet him'''
    cluster: ritual
  recited-where-commanded-silent-where-commanded:
    label: 'Ibn ʿAbbās: the prophet recited where he was commanded and kept silent where he was commanded, ''and your Lord
      is not forgetful'''
    cluster: scripture
  raid-leader-closes-every-recitation-with-ikhlas:
    label: 'The leader of a raiding party ends his recitation in every prayer with ''Say: he is God, one'', ''because it is
      the description of the Merciful''; ''tell him that God loves him'''
    cluster: ritual
  joined-suras-of-the-mufassal:
    label: 'Asked whether the prophet joined suras in one rakʿa, ʿĀʾisha: ''the mufaṣṣal'''
    cluster: ritual
  give-each-sura-its-share-of-bow-and-prostration:
    label: '''Give every sura its share of bowing and prostration'''
    cluster: ritual
  praises-in-place-of-quran-for-one-who-cannot-learn:
    label: 'To a man who cannot take any of the Quran: say ''Glory to God, praise to God, no god but God, God is greatest,
      no might nor power but in God''; ''that is for God, what is for me?'' ''O God, have mercy on me, provide for me, keep
      me well, guide me'''
    cluster: ritual
  closes-his-hand-has-filled-his-hand-with-good:
    label: The man closes his hand as he leaves; 'this one has filled his hand with good'
    cluster: ritual
  devil-named-khinzab-confuses-prayer-spit-left-thrice:
    label: '''The devil has come between me and my prayer and recitation, confusing it'': ''that is a devil called Khinzab;
      when you sense him seek refuge in God and spit to your left three times''; it went'
    cluster: demonology
  baqara-nisa-al-imran-in-one-night-raka:
    label: 'Praying one night he opened al-Baqara (Ḥudhayfa thinks: he will bow at the hundredth verse), went on, then al-Nisāʾ,
      then Āl ʿImrān, reciting slowly'
    cluster: ritual
  glorify-at-glory-ask-at-mercy-refuge-at-punishment:
    label: Passing a verse of glorification he glorified, a verse of asking he asked, a verse of refuge (punishment) he stopped
      and sought refuge
    cluster: ritual
  glory-to-you-yes-at-75-40:
    label: 'A man praying on his roof, reciting ''Is not he able to give life to the dead?'', says ''Glory to you, yes indeed
      (fa-balā)'': ''I heard it from the messenger of God'''
    cluster: ritual
  glory-to-my-lord-most-high-at-87-1:
    label: Reciting 'Glorify the name of your Lord most high' he says 'Glory to my Lord most high'
    cluster: ritual
  palms-pressed-between-thighs-forbidden-hands-on-knees:
    label: 'Bowing with palms pressed together between the thighs (taṭbīq): ''we used to do it and were forbidden, and ordered
      to put our hands on our knees''; his father strikes his hands'
    cluster: ritual
  ibn-masud-still-presses-palms-between-thighs:
    label: Ibn Masʿūd strikes his companions' hands off their knees, presses his palms together between his thighs and says
      he sees the prophet's fingers interlaced as he bowed
    cluster: ritual
  two-followers-set-right-and-left-of-imam:
    label: Ibn Masʿūd, praying with two men, sets one at his right and the other at his left
    cluster: ritual
  amirs-strangle-prayer-to-the-dying-gasp:
    label: '''Amirs will delay the prayer from its time and strangle it to the death-gasp of the day (sharaq al-mawtā): pray
      it at its time and make your prayer with them supererogatory'''
    cluster: eschatology
  forehead-pressed-till-earth-felt:
    label: '''When you prostrate set your forehead firm on the ground until you feel the bulk of the earth (ḥajm al-arḍ)'''
    cluster: ritual
  head-neither-lowered-nor-raised-in-the-bow:
    label: Bowing, he neither let his head droop nor raised it, but between the two
    cluster: ritual
  fingers-spread-in-bow-closed-in-prostration:
    label: Bowing he spread his fingers apart, prostrating he closed them
    cluster: ritual
  prayer-expiates-past-sins-while-no-major-sin:
    label: A prescribed prayer with ablution, humility and bowing done well expiates the sins before it, so long as no major
      sin is committed, 'and that for all time'
    cluster: ritual
  devils-squat-and-beasts-spread-forbidden:
    label: He forbade the devil's squat (ʿuqbat al-shayṭān) and a man's spreading his forearms as a beast of prey spreads
      them
    cluster: ritual
  no-prayer-without-straightening-the-back:
    label: '''A man''s prayer does not suffice until he straightens his back in bowing and prostration''; seeing with the
      corner of his eye one who does not, ''no prayer for one who does not straighten his spine'''
    cluster: ritual
  companion-stands-and-shows-the-prayer:
    label: 'A Companion stands up before his hearers and prays, holding each posture until everything settles: ''thus was
      the prayer of the messenger of God'''
    cluster: ritual
  stranger-has-a-right-ask-first:
    label: 'An Anṣārī yields his turn to a man of Thaqīf: ''he is a stranger and the stranger has a right'''
    cluster: ethics
  question-answered-before-it-is-asked:
    label: '''If you wish I will tell you what you came to ask'': ''you came to ask about the bow, the prostration, the prayer
      and the fast''; ''by him who sent you with the truth, you missed nothing of what was in my mind'''
    cluster: sira
  pray-at-start-and-end-of-day:
    label: '''Pray at the beginning and end of the day''; ''and if I pray between them?'' ''then you are one who prays'''
    cluster: ritual
  pecks-prayer-as-crow-pecks-blood:
    label: 'Of a man who bows and pecks in his prostration: ''whoever dies like this dies outside the religion of Muhammad;
      he pecks his prayer as the crow pecks blood'''
    cluster: ritual
  pecking-prostrator-like-hungry-man-eating-a-date-or-two:
    label: 'The one who pecks in prostration is like a hungry man who eats only a date or two: what good do they do him?'
    cluster: parable
  four-army-commanders-heard-it:
    label: 'Asked who told him, Abū ʿAbd Allāh al-Ashʿarī names the commanders of the armies: ʿAmr b. al-ʿĀṣ, Khālid b. al-Walīd,
      Yazīd b. Abī Sufyān and Shuraḥbīl b. Ḥasana'
    cluster: sira
  three-commands-three-forbiddings-fox-monkey-rooster:
    label: 'Three commands (three days'' fast each month, no sleep but after witr, the two rakʿas of forenoon) and three forbiddings:
      turning like a fox, squatting like a monkey, pecking like a rooster'
    cluster: ritual
  worst-thief-steals-his-prayer:
    label: '''The worst thief is he who steals his prayer'': he does not complete its bowing and prostration'
    cluster: ritual
  crow-peck-beast-spread-camels-fixed-place:
    label: 'He forbade three: the crow''s peck, the beast of prey''s spread, and a man fixing his place (in the mosque) as
      the camel fixes its spot'
    cluster: ritual
  purify-me-with-snow-hail-and-cold-water:
    label: 'Rising from the bow: ''O God, purify me with snow, hail and cold water; purify me of sins as the white garment
      is cleansed of filth'''
    cluster: ritual
  praise-heard-then-our-lord-to-you-praise:
    label: 'When the imam says ''God hears who praises him'' say ''O God our Lord, to you be praise'': whose words coincide
      with the angels'' is forgiven his past sins'
    cluster: ritual
  fell-from-horse-right-side-grazed-prayed-sitting:
    label: The prophet falls from a horse and his right side is grazed; they visit him, he leads them sitting and they pray
      behind him sitting
    cluster: sira
  hands-before-knees-going-down:
    label: Going down to prostrate he puts his hands down before his knees
    cluster: ritual
  do-not-kneel-as-the-camel-kneels:
    label: '''When one of you prostrates let him not kneel as the camel kneels; let him put his hands before his knees'''
    cluster: ritual
  forearms-not-spread-like-a-dog:
    label: '''Be balanced in prostration; let none of you spread his forearms as the dog spreads them'' (or the beast of prey)'
    cluster: ritual
  palms-down-elbows-raised:
    label: '''When you prostrate put down your palms and raise your elbows''; al-Barāʾ shows it, leaning on his knees and
      raising his buttocks'
    cluster: ritual
  a-lamb-could-pass-under-him:
    label: When he prostrated, had a lamb (bahma) wished to pass under him between his arms it could have
    cluster: ritual
  every-limb-prostrates-when-arms-held-apart:
    label: '''Do not spread your forearms as a beast does; lean on your palms and keep your upper arms apart: then every limb
      of you prostrates'''
    cluster: ritual
  at-salam-face-turned-till-cheek-seen:
    label: At the salām he turned his face right and left until the whiteness of his cheek was seen
    cluster: ritual
  seven-limbs-of-prostration-hair-and-garment-not-gathered:
    label: He was commanded to prostrate on seven limbs, forehead, two hands, two knees and two feet, and not to gather up
      hair or garment
    cluster: ritual
units:
- id: hadith-9-imam-guarantor
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The imam as guarantor and the muezzin as trustee; the leader bears the prayer's shortcomings
  read:
  - Jāmiʿ 9:1223.1-1224.1
  tags:
  - motif: imam-guarantor-muezzin-trusted
    refs:
    - Jāmiʿ 9:1223.1
    note: الإمام ضامنٌ، والمؤذِّن موتَمن ... اللَّهُمَّ ارشد الأئمَّة واغفر للمؤذِّنين
  - motif: leader-who-prays-right-prayer-is-his-and-theirs
    refs:
    - Jāmiʿ 9:1224.1
    note: من أم الناس فأصاب فالصلاة له ولهم، ومن انتقص من ذلك شيئًا فعليه، ولا عليهم
  - motif: companion-on-ship-refuses-to-lead-prayer
    refs:
    - Jāmiʿ 9:1224.1
    note: خرج في سفينة فيها عقبة بن عامر الجُهنيّ ... إنك أحقُّنا بذلك، أنت صاحب رسول الله ﷺ فأبى
  hints:
  - The leader who prays for the congregation and carries their prayer, against the rabbinic prayer leader (sheliaḥ ṣibbur)
    who discharges the many of their obligation, m. Rosh Hashanah 4:9, b. Rosh Hashanah 34b-35a
- id: hadith-9-bilal-adhan-at-abtah
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Bilal''s call at al-Abṭaḥ: the neck turned at the two summons, the red tent and red suit'
  read:
  - Jāmiʿ 9:1224.2
  tags:
  - motif: bilal-twists-neck-at-hayya-without-turning
    refs:
    - Jāmiʿ 9:1224.2
    note: 'فلمّا بلغ: "حيَّ على الصّلاة، حيَّ على الفلاح" لوى عُنُقَه يمينًا وشمالًا، ولم يستدر'
  - motif: prophet-in-red-leather-tent-red-yemeni-suit
    refs:
    - Jāmiʿ 9:1224.2
    note: وهو في قُبَّةٍ حمراء من أدَم ... وعليه حُلَّةٌ حمراءُ بُرودٌ يمانية قِطري
  - motif: muezzin-followed-mouth-this-way-and-that
    refs:
    - Jāmiʿ 9:1224.2
    note: فكنتُ أتتبعُ فَمه ههنا وههنا
- id: hadith-9-iqama-and-the-imam
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'When the iqāma is called and when the people stand: Bilal waits for the prophet; the prophet leaves to wash and
    returns'
  read:
  - Jāmiʿ 9:1225.1-1228.1
  tags:
  - motif: iqama-only-when-imam-appears
    refs:
    - Jāmiʿ 9:1225.1
    note: كان بلال يؤذِّن إذا دحضتْ، فلا يُقيم حتَّى يخرجَ النَّبِيّ ﷺ ... أقام الصّلاةَ حين يراه
  - motif: imam-remembers-impurity-leaves-returns-washed
    refs:
    - Jāmiʿ 9:1226.1
    note: 'حتَّى إذا قام في مصلاه قبل أن يكبر ذكر، فانصرف وقال لنا: "مكانكم" ... وقد اغتسل، ينظفُ رأسُه ماء'
  - motif: do-not-stand-until-you-see-me
    refs:
    - Jāmiʿ 9:1226.2
    note: إذا أقيمت الصّلاة فلا تقوموا حتَّى تروْني
  - motif: man-detains-prophet-after-iqama
    refs:
    - Jāmiʿ 9:1228.1
    note: فعرض للنبي ﷺ رجل فحبسه بعد ما أقيمت الصّلاة
- id: hadith-9-pray-as-you-saw-me
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Mālik b. al-Ḥuwayrith''s band: ''pray as you have seen me pray'', the eldest to lead'
  read:
  - Jāmiʿ 9:1229.1
  tags:
  - motif: youths-stay-twenty-days-sent-home-to-teach
    refs:
    - Jāmiʿ 9:1229.1
    note: ونحن شَبَبَةٌ متقاربون، فأقمنا عنده عشرين يومًا وليلةً ... ارجعوا إلى أهليكم فأقيموا فيهم وعلِّموهم
  - motif: pray-as-you-have-seen-me-pray
    refs:
    - Jāmiʿ 9:1229.1
    note: وصلُّوا كما رأيتموني أصَلِّي
  - motif: eldest-of-you-leads-prayer
    refs:
    - Jāmiʿ 9:1229.1
    note: فليؤذِّنْ لكم أحدُكم ولْيؤمَّكم أكبرُكم
- id: hadith-9-change-of-qibla
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The change of the qibla from Jerusalem to the Kaʿba and the congregations that turned in mid-prayer
  read:
  - Jāmiʿ 9:1229.2-1231.4
  quran:
  - 2:115
  - 2:142
  - 2:144
  tags:
  - motif: prayer-toward-jerusalem-sixteen-or-seventeen-months
    refs:
    - Jāmiʿ 9:1229.2
    - Jāmiʿ 9:1231.2
    - Jāmiʿ 9:1231.4
    note: صلَّى نحو بيت المقدس ستة عشر - أو سبعة عشر - شهرًا ... ستة عشر شهرًا، ثمّ صُرف إلى الكعبة ... فاستقبلها رسول الله
      ﷺ بضعة عشر شهرًا
  - motif: prophet-face-turning-to-heaven
    refs:
    - Jāmiʿ 9:1229.2
    - Jāmiʿ 9:1230.3
    - Jāmiʿ 9:1231.4
    note: قَدْ نَرَى تَقَلُّبَ وَجْهِكَ فِي السَّمَاءِ ... فكان يدعو وينظر إلى السماء
  - motif: change-of-qibla
    refs:
    - Jāmiʿ 9:1229.2
    - Jāmiʿ 9:1231.4
    note: 'وقال السفهاء من الناس - وهم اليهود -: ﴿مَا وَلَّاهُمْ عَنْ قِبْلَتِهِمُ الَّتِي كَانُوا عَلَيْهَا'
  - motif: congregation-turns-to-kaaba-mid-prayer
    refs:
    - Jāmiʿ 9:1229.2
    - Jāmiʿ 9:1230.2
    - Jāmiʿ 9:1230.3
    - Jāmiʿ 9:1231.1
    - Jāmiʿ 9:1231.3
    note: 'فمَرَّ على قوم من الأنصار في صلاة العصر ... بينما الناس بقباء في صلاة الصُّبْحِ ... وهم ركوع في صلاة الفجر، وقد
      صلَّوا ركعة فنادى: ألا إن القبلة حُوِّلَتْ ... فاستداروا وإمامهم نحو الكعبة'
  - motif: two-rakas-each-way-at-qibla-change
    refs:
    - Jāmiʿ 9:1231.1
    note: والإمام في الصّلاة قد صلّى ركعتين ... فصلّوا الركعتين الباقيتين إلى الكعبة
  - motif: praying-toward-kaba-on-the-road-before-the-change
    refs:
    - Jāmiʿ 9:1230.1
    note: فرأيتُ ألا أجعل هذه البِنيةَ مني بظهر، فصليتُ إليها ... قد كنت على قبلة لو صبرتَ عليها
  - motif: at-mecca-faced-jerusalem-with-kaba-before-him
    refs:
    - Jāmiʿ 9:1231.2
    note: كان رسول الله ﷺ يصلي وهو بمكة نحو بيت المقدس، والكعبة بين يديه
  - motif: jews-rejoice-at-jerusalem-qibla
    refs:
    - Jāmiʿ 9:1231.4
    note: وكان أكثر أهلها اليهود، أمره الله ﷿ أن يستقبل بيت المقدس، ففرحت اليهودُ ... فكان رسول الله ﷺ يحبُّ قبلة إبراهيم
  - motif: qibla-first-thing-abrogated-in-quran
    refs:
    - Jāmiʿ 9:1231.4
    note: كان أولَ ما نسخ اللهُ من القرآن القبلة
  hints:
  - Prayer toward Jerusalem for sixteen or seventeen months, against Daniel praying three times a day toward Jerusalem through
    windows opened toward it (Dan 6:11) and Solomon's prayer that Israel pray 'toward the city and the house' (1 Kgs 8:44,
    48); m. Berakhot 4:5-6 has the one who cannot face it direct his heart toward the Holy of Holies
- id: hadith-9-facing-the-qibla
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Facing the qibla: the instruction to the man who prayed badly, ''between east and west'', and ''this is the qibla'''
  read:
  - Jāmiʿ 9:1233.1-1235.1
  tags:
  - motif: face-qibla-then-takbir
    refs:
    - Jāmiʿ 9:1233.1
    note: إذا قمت إلى الصّلاة فأسبغ الوضوء، ثمّ استقبل القبلة، فكبِّر
  - motif: between-east-and-west-is-qibla
    refs:
    - Jāmiʿ 9:1233.2
    note: ما بين المشرق والمغرب قبلة
  - motif: supplicated-in-kaba-corners-prayed-outside-this-is-qibla
    refs:
    - Jāmiʿ 9:1235.1
    note: 'لما دخل البيت دعا في نواحيه كلها، ولم يُصلِّ فيه حتَّى خرج ... ركع في قُبُل البيت ركعتين، وقال: "هذه القبلة"'
- id: hadith-9-takbir-throughout
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Takbir at every movement, and the Companions who restored it
  read:
  - Jāmiʿ 9:1237.1
  tags:
  - motif: takbir-at-every-lowering-and-rising
    refs:
    - Jāmiʿ 9:1237.1
    note: يُكبِّر حين يقوم، ثمّ يكبِّر حين يركع ... ثمّ يُكبِّر حين يهويّ ... ويُكبِّر حين يقوم من الثنتين بعد الجلوس
- id: hadith-9-abu-malik-teaches-prayer
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Abū Mālik al-Ashʿarī shows his tribe the prophet's prayer; the men God's prophets envy
  read:
  - Jāmiʿ 9:1237.2
  quran:
  - 10:62
  tags:
  - motif: tribe-gathered-with-wives-and-sons-to-be-taught-prayer
    refs:
    - Jāmiʿ 9:1237.2
    note: يا معشَرَ الأشعرِيِّين! اجتَمِعُوا وأجْمِعُوا نساءَكم وأبناءكم، أُعلِّمُكُم صلاة النَّبِيِّ ﷺ
  - motif: men-boys-women-in-successive-rows
    refs:
    - Jāmiʿ 9:1237.2
    note: فصَفَّ الرِّجالَ في أَدنى الصف، وصَفَّ الولْدانَ خلفَهم، وصَفَّ النساءَ خلفَ الولْدان
  - motif: fatiha-and-sura-recited-silently
    refs:
    - Jāmiʿ 9:1237.2
    note: فقرأَ بفاتحة الكتاب وسورةٍ يُسِرُّهما
  - motif: subhan-allah-wa-bihamdihi-thrice-in-ruku
    refs:
    - Jāmiʿ 9:1237.2
    note: '"سُبْحانَ الله وَبِحَمْدِه" ثلاثَ مِرارٍ'
  - motif: six-takbirs-in-first-raka
    refs:
    - Jāmiʿ 9:1237.2
    note: فكان تكبيرُه في أول ركعةٍ ستَّ تكبيرات
  - motif: friends-in-god-envied-by-prophets
    refs:
    - Jāmiʿ 9:1237.2
    note: أنَّ لله عِبَادًا ليسوا بأنبياء ولا شُهداء يَغْبِطُهم النبيُّون والشُّهداء على مَجالِسِهم وقُرْبهم من الله ... تَحَابُّوا
      في الله وَتَصَافَوْا
  - motif: bedouin-kneels-and-gestures-describe-them
    refs:
    - Jāmiʿ 9:1237.2
    note: فجَثى رجلٌ من الأعراب من قاصِيَة الناس وألْوَى بيده ... فسُرَّ وَجْهُ رسول الله ﷺ لسؤال الأعرابيّ
  - motif: pulpits-of-light-faces-and-clothes-light
    refs:
    - Jāmiʿ 9:1237.2
    note: يَضَعُ الله لهم يومَ القِيامَةِ مَنَابِرَ من نُورٍ، فيُجلِسُهم عليها فيَجْعَلُ وَجُوهَهم نُورًا وثِيابَهم نورًا،
      يَفْزَعُ النَّاسُ يومَ القِيَامَةِ ولا يَفْزَعُون
- id: hadith-9-takbir-restored
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Companions who said takbir at every movement: ʿAlī at Basra, Abū Hurayra, Abū Saʿīd, the man at the Maqām'
  read:
  - Jāmiʿ 9:1239.1-1240.3
  tags:
  - motif: takbir-at-every-lowering-and-rising
    refs:
    - Jāmiʿ 9:1239.1
    - Jāmiʿ 9:1240.1
    - Jāmiʿ 9:1240.2
    - Jāmiʿ 9:1240.3
    note: فكان إذا سجد كبَّر، وإذا رفع كبَّر، وإذا نهض من الركعتين كبَّر ... فيكبِّر كلما خَفَضَ ورَفَع ... فجهر بالتكبير
      حين رفع رأسه من السجود ... يُكبِّر في كل خفضٍ ورفع
  - motif: ali-prayer-reminds-of-muhammads
    refs:
    - Jāmiʿ 9:1239.1
    note: 'فلمّا سلَّم أخذ عمران بيدي فقال: لقد صلَّى بنا هذا صلاةَ محمدٍ ﷺ'
  - motif: leader-swears-he-prays-most-like-prophet
    refs:
    - Jāmiʿ 9:1240.1
    note: والله! إني لأشبهُكم بصلاةِ رسول الله ﷺ
  - motif: takbir-man-at-maqam-motherless-one
    refs:
    - Jāmiʿ 9:1240.3
    note: رأيت رجلًا عند المقام ... أو ليس تلك صلاةَ النبي ﷺ لا أمَّ لك
- id: hadith-9-raising-the-hands
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Raising the hands at the opening, the bow and the rising, to the shoulders or the ears
  read:
  - Jāmiʿ 9:1241.1-1251.1
  tags:
  - motif: hands-raised-to-shoulders-at-opening-bow-and-rising
    refs:
    - Jāmiʿ 9:1241.1
    - Jāmiʿ 9:1242.1
    - Jāmiʿ 9:1246.1
    - Jāmiʿ 9:1248.1
    - Jāmiʿ 9:1248.2
    note: كان إذا افتتح الصلاة رفع يديه حذو منكبيه، وإذا رفع رأسَه من الركوع رفعهما كذلك ... إذا كبَّر للصلاة جعل يديه حذو
      منكبيه ... فكان يرفع يديه إذا افتتح الصلاة، وإذا ركع، وإذا رفع رأسه من الركوع
  - motif: hands-raised-to-the-ears
    refs:
    - Jāmiʿ 9:1247.1
    - Jāmiʿ 9:1247.2
    note: فكبَّر فرفع يديه حتى حاذتا أُذنيه ... ورفع إبراهيم بن طهمان يديه إلى أُذنيه
  - motif: no-hand-raising-in-prostration-or-sitting
    refs:
    - Jāmiʿ 9:1241.1
    - Jāmiʿ 9:1248.2
    note: وكان لا يفعل ذلك في السجود ... ولا يرفع يديه في شيء من صلاته وهو قاعد
  - motif: hands-raised-on-rising-from-two-rakas
    refs:
    - Jāmiʿ 9:1246.1
    - Jāmiʿ 9:1248.2
    note: وإذا قام من الركعتين فعل مثل ذلك ... وإذا قام من السجدتين رفع يديه كذلك وكبَّر
  - motif: right-hand-grasps-left-in-prayer
    refs:
    - Jāmiʿ 9:1247.1
    note: ثم أَخذ شماله بيمينه
  - motif: two-fingers-closed-ring-formed-index-points
    refs:
    - Jāmiʿ 9:1247.1
    note: وقبض ثنتين وحلَّق حلقة ... وحلَّق بِشْرٌ الإبهامَ والوُسطى وأشار بالسبابة
  - motif: prostrates-with-head-between-hands
    refs:
    - Jāmiʿ 9:1247.1
    note: فلما سجد وضع رأسه بذلك المنزل من بين يديه
  - motif: hands-like-tails-of-restive-horses
    refs:
    - Jāmiʿ 9:1251.1
    note: ما لي أراكم رافعي أيديكم كأنّها أذناب خيل شُمْسْ؛ اسكنوا في الصّلاة
- id: hadith-9-abu-humayd-describes
  tradition: islam
