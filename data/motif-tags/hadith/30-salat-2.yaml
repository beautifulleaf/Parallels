  tags:
  - motif: ten-companions-test-abu-humayd-on-prophets-prayer
    refs:
    - Jāmiʿ 9:1244.1
    note: أنا كنت أحفظكم لصلاة رسول الله ﷺ
  - motif: hands-raised-to-shoulders-at-opening-bow-and-rising
    refs:
    - Jāmiʿ 9:1244.1
    note: رأيته إذا كبَّر جعل يديه حِذاء منكبيه
  - motif: back-bent-level-in-the-bow
    refs:
    - Jāmiʿ 9:1244.1
    note: وإذا ركع أمكن يديه من ركبتيه، ثم هصر ظهرَه
  - motif: every-bone-returns-to-its-place
    refs:
