      - {motif: prophets-face-shines-like-gilded-silver, refs: ["Jāmiʿ 3:798.2"], note: "حتّى رأيتُ كومين من طعام وثياب حتّى رأيت وجهَ رسول اللَّه ﷺ يتهلَّل كأنّه مُذْهَبَةٌ"}
      - {motif: pointing-to-good-earns-doers-reward, refs: ["Jāmiʿ 3:799.1"], note: "إنّي أُبْدِعَ بي فاحملني ... من دلَّ على خير فله مثل أجر فاعله"}
