      - {motif: end-time-liars-bring-unheard-hadith, refs: ["Jāmiʿ 3:865.4"], note: "يكون في آخر الزّمان دجّالون كذَّابون، يأتونكم من الأحاديث بما لم تسمعوا أنتم ولا آباؤكم"}
  - id: hadith-3-world-cursed-and-worldly-learning
