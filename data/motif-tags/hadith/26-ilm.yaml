  - id: hadith-3-scholar-who-does-not-act
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "The preacher's entrails in the fire; lips cut with fire scissors; the lamp that burns itself; the palmful of blood"
    read: ["Jāmiʿ 3:878.1-880.1"]
    quran: ["2:44", "61:2-3", "62:5"]
    tags:
      - {motif: preacher-entrails-spill-turns-like-donkey-at-mill, refs: ["Jāmiʿ 3:878.1", "Jāmiʿ 3:879.2"], note: "فتندلق أقتاب بطنه، فيدور بها كما يدور الحمار بالرَّحى ... قد كنتُ آمرُ بالمعروف ولا آتيه، وأنْهى عن المنْكر وآتيه"}
      - {motif: refuge-from-knowledge-without-benefit, refs: ["Jāmiʿ 3:878.2"], note: "اللَّهُمَّ! إنّي أعوذ بك من علم لا ينفع، ومن قلبٍ لا يخشع، ومن نفسٍ لا تشبع، ومن دعوةٍ لا يستجاب لها"}
      - {motif: feet-do-not-move-till-asked-four, refs: ["Jāmiʿ 3:879.1"], note: "لا تزولُ قدما عبدٍ يوم القيامة حتّى يُسأل ... وعن علمه فيما فعل"}
      - {motif: preachers-lips-cut-with-fire-scissors, refs: ["Jāmiʿ 3:879.3"], note: "مررتُ ليلة أُسري بي على قومٍ تُقرض شفاههم بمقاريض من نار ... خطباء من أهل الدُّنيا ممّن كانوا يأمرون النّاس بالبر، وينسون أنفسهم وهم يتلون الكتاب"}
      - {motif: teacher-forgets-self-like-lamp-burning-itself, refs: ["Jāmiʿ 3:880.1"], note: "مثلُ العالم الذي يعلِّمُ النَّاسَ الخيرَ وينسى نفسه، كمثل السِّراج يُضيء للنّاس ويُحْرق نفسه"}
      - {motif: handful-of-blood-bars-paradise, refs: ["Jāmiʿ 3:880.1"], note: "لا يَحُولَنَّ بين أحدِكم وبين الجنّة وهو ينظر إلى أبوابها مِلْءُ كَفٍّ مِنْ دم مُسلمٍ أَهْراقَهُ ظُلْمًا"}
    hints:
      - "The teacher who does not practise, against Matt 23:3 ('they say, and do not') and Rom 2:21 ('thou that teachest another, teachest thou not thyself?'); the self-consuming lamp against the rabbinic image of the candle that lights others (b. Shabbat 122a, 'a light for one is a light for a hundred')."
