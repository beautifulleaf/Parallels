# Hadith chunk 26: al-Jāmiʿ al-Kāmil book 3 (kitāb al-ʿilm), Shamela pp. 785-881 (printed 2/5-101): the two series
# 'jumūʿ abwāb mā warada fī l-targhīb fī l-ʿilm' (bābs 1-57: the spirit question, envy only in two, going out for
# knowledge, the journey for one hadith, Moses and al-Khiḍr, the scholars as heirs, conveying, writing forbidden and
# allowed, narrating from the Israelites, useful knowledge, storytellers, standing for people) and 'jumūʿ abwāb mā
# warada min al-tarhīb' (bābs 1-21: knowledge lifted, fatwa without knowledge, disputing the Book, lying about the
# prophet, concealing knowledge, questions, reciters who show off, storytelling, Torah sheets, astrology, the scholar
# who does not act). Read in full from the Arabic (207 hadith). Several reports recur under more than one bāb
# (the Abū l-Dardāʾ 'heirs of the prophets', the Abū Hurayra 'two verses', the Abū Barza 'feet do not move', the Zayd
# b. Arqam refuge); each recurrence is read where it stands. Bāb 21 of the tarhīb series (forty hadith) has no
# hadith, only the compiler's verdict that none is sound.
new_motifs:
  prophet-angered-by-you-are-forgiven-so-need-not-strive: {label: "Told 'we are not like you; God has forgiven you your past and later sins', the prophet grows angry till it shows in his face: 'the most God-fearing and most knowing of God among you is I'", cluster: ethics}
  envy-only-in-two-wealth-spent-and-wisdom-taught: {label: "No envy (hasad, glossed ghibta) except in two: a man God gave wealth who spends it in the right, and a man God gave wisdom (or the Quran) who judges by it and teaches it, reciting night and day", cluster: ethics}
  neighbour-wishes-to-be-given-the-same-and-do-the-same: {label: "A neighbour hears the reciter and says 'would I were given what he was given, I would do as he does'", cluster: ethics}
  path-of-knowledge-made-path-to-paradise: {label: "Whoever takes a path seeking knowledge, God makes easy for him a path to paradise", cluster: eschatology}
  two-banners-at-every-door-angel-and-devil: {label: "At the door of every man going out stand two banners, one in an angel's hand and one in a devil's; he walks under the angel's banner if he goes out for what God loves, under the devil's for what angers him, until he comes home", cluster: angelology}
  scholars-heirs-of-prophets-who-left-no-dinar: {label: "The scholars are the heirs of the prophets; the prophets left no dinar or dirham, they left knowledge, and whoever takes it takes an abundant share", cluster: ethics}
  creatures-of-heaven-earth-and-fish-ask-forgiveness-for-scholar: {label: "Whoever is in the heavens and the earth, and the fish in the water, ask forgiveness for the one who knows (or the teacher of good)", cluster: cosmology}
  scholar-over-worshipper-as-full-moon-over-stars: {label: "The merit of the knower over the worshipper is like that of the moon on the night it is full over all the other stars", cluster: ethics}
  traveller-came-for-one-hadith-only: {label: "A man comes from the prophet's city to a companion for a single hadith: 'did you come for no need, no trade, only for this hadith?' - 'yes'", cluster: transmission}
  going-out-for-knowledge-is-in-gods-way: {label: "Whoever goes out seeking knowledge is in God's way until he returns", cluster: ethics}
  morning-to-mosque-to-learn-as-complete-hajj: {label: "Whoever goes in the morning to the mosque wanting only to learn or teach good has the reward of a pilgrim whose hajj is complete", cluster: ritual}
  entering-prophets-mosque-to-learn-as-jihad: {label: "Who enters 'this mosque of mine' to learn or teach good is like the fighter in God's way; who enters for anything else is like a man looking at a thing that pleases him but belongs to another", cluster: ritual}
  god-calls-with-voice-heard-far-as-near: {label: "God calls the gathered with a voice heard by the far as by the near: 'I am the King, I am the Requiter (al-dayyan)'", cluster: eschatology}
  no-entry-till-claims-settled-even-a-slap: {label: "No one of the fire enters it, and no one of paradise enters it, while another holds a claim against him, until I settle it, even a slap; paid with good and bad deeds", cluster: eschatology}
  moses-says-none-knows-more-god-names-khidr: {label: "Asked whether he knows anyone more knowing than himself, Moses says no; God reveals 'Yes, our servant Khidr' and makes the fish his sign: 'when you lose the fish, go back, you will meet him'", cluster: moses}
  moses-reproved-for-not-referring-knowledge-to-god: {label: "Asked who is most knowing Moses says 'I am'; God reproves him for not referring knowledge to God and tells him of a servant at the meeting of the two seas who knows more; 'carry a fish in a basket (miktal)'", cluster: moses}
  welcome-to-prophets-bequest-for-young-seekers: {label: "A companion greets young students 'Welcome to the bequest of God's messenger: he used to charge us with you'", cluster: transmission}
  provided-for-through-brother-who-attends-prophet: {label: "Two brothers: one attends the prophet, the other works a trade and complains of him; 'perhaps you are provided for through him'", cluster: ethics}
  teacher-of-good-forgiven-by-everything-even-fish: {label: "Everything asks forgiveness for the teacher of good, even the fish in the seas", cluster: cosmology}
  caller-to-guidance-earns-followers-reward: {label: "Who calls to guidance has the reward of all who follow him without lessening theirs; who calls to error bears the sin of all who follow him", cluster: ethics}
  founder-of-good-practice-shares-later-reward: {label: "Who institutes a good practice (sanna sunna hasana) in Islam has its reward and the reward of all who act on it after him; a bad practice, its burden and theirs", cluster: ethics}
  prophets-face-shines-like-gilded-silver: {label: "As heaps of food and clothes pile up the prophet's face shines as if it were gilded (mudhhaba)", cluster: prophet-person}
  pointing-to-good-earns-doers-reward: {label: "A man whose mount has perished asks to be carried; another offers to direct him to one who will: 'who points to good has the reward of its doer'", cluster: ethics}
  dying-on-guard-reward-runs-to-resurrection: {label: "Whoever dies guarding the frontier (murabitan) in God's way has the guard's reward running for him until he is raised", cluster: law}
  guiding-one-man-better-than-red-camels: {label: "That God guide a single man through you is better for you than red camels (humr al-na'am)", cluster: ethics}
  god-wills-good-gives-understanding-of-religion: {label: "Whom God wants good for, he gives understanding of the religion (yufaqqihhu fi l-din)", cluster: ethics}
  i-only-distribute-god-gives: {label: "'I am only a distributor (qasim) and God gives'", cluster: prophet-person}
  party-stays-on-gods-command-till-it-comes: {label: "This community will remain upholding God's command, unharmed by those who oppose them, until God's command comes", cluster: eschatology}
  knowledge-by-learning-forbearance-by-practice: {label: "Knowledge comes only by learning and forbearance only by practising forbearance; who seeks good is given it, who guards against evil is guarded", cluster: wisdom}
  scholar-over-worshipper-as-prophet-over-least: {label: "The merit of the knower over the worshipper is like my merit over the least of you", cluster: ethics}
  god-angels-ant-and-fish-bless-teacher-of-good: {label: "God, his angels, the people of the heavens and earths, even the ant in its hole and the fish, bless (yusallun 'ala) the one who teaches people good", cluster: cosmology}
  merit-of-knowledge-over-worship-best-religion-scruple: {label: "The merit of knowledge is dearer to me than the merit of worship, and the best of your religion is scrupulousness (al-wara')", cluster: ethics}
  three-men-at-the-circle-shelter-shame-turn-away: {label: "Three men come to the prophet's circle: one finds a gap and sits, one sits behind out of shame, one turns away; God shelters the first, is ashamed before the second, turns from the third", cluster: ethics}
  admonition-spaced-for-fear-of-weariness: {label: "The prophet spaced out his admonitions over the days for fear of wearying us; Ibn Masud reminds only every Thursday", cluster: transmission}
  boy-remembers-water-spat-in-face-at-five: {label: "A companion recalls, at five years old, the prophet spurting a mouthful of water from a bucket into his face", cluster: transmission}
  guidance-like-rain-on-three-grounds: {label: "Parable: the guidance and knowledge sent with the prophet are like rain falling on three kinds of ground: good soil that drinks and grows herbage, hard ground (ajadib) that holds water for people to drink and water, and bare flats (qi'an) that neither hold water nor grow grass", cluster: parable}
  teaching-a-verse-rewarded-as-long-as-recited: {label: "Who teaches one verse of God's Book has its reward as long as it is recited", cluster: ethics}
  hear-and-be-heard-chain-of-hearing: {label: "'You hear, and it is heard from you, and it is heard from those who heard from you'", cluster: transmission}
  god-brighten-the-one-who-hears-and-conveys: {label: "'May God brighten (naddara) a man who heard my word, kept it and conveyed it: many a carrier of understanding brings it to one who understands better, many a carrier of understanding has none'", cluster: transmission}
  three-things-a-believers-heart-does-not-betray: {label: "Three things against which a believer's heart bears no rancour: sincerity of deeds for God, good counsel to those in authority, keeping to the community, whose prayer encompasses them from behind", cluster: ethics}
  word-repeated-thrice-to-be-understood: {label: "When he spoke a word he repeated it three times so that it would be understood; when he came to people he greeted them three times", cluster: prophet-person}
  women-ask-a-day-of-their-own: {label: "A woman: 'the men have taken all your speech; give us a day of yours'; he names a day and teaches the gathered women", cluster: women}
  three-children-a-screen-from-fire-and-two: {label: "A woman whose three children die before her has them as a screen from the fire; asked 'and two?' he repeats 'and two, and two, and two'", cluster: eschatology}
  do-not-write-from-me-but-the-quran-erase-it: {label: "'Do not write from me; whoever has written from me anything but the Quran, let him erase it; narrate from me, there is no harm'", cluster: transmission}
  companion-refuses-to-let-hadith-be-written: {label: "A companion refuses to let students write: 'we will not make it a Quran; take from us as we took from the prophet'; narrate, for hadith recalls hadith", cluster: transmission}
  father-erases-sons-written-hadith: {label: "A father has his son bring what he wrote down of his words, erases it, and says 'memorise as we memorised from the prophet'", cluster: transmission}
  writer-and-non-writer-companions: {label: "None had more hadith from the prophet than Abu Hurayra except Abd Allah b. Amr, 'for he used to write and I did not write'", cluster: transmission}
  sermon-from-dawn-to-sunset-of-what-was-and-will-be: {label: "The prophet prays dawn, mounts the pulpit and preaches till noon, prays, preaches till afternoon, prays, preaches till sunset, telling what was and what will be; the most knowing of us is the best at memorising", cluster: prophecy}
  no-bird-flaps-wings-but-we-have-knowledge-of-it: {label: "The prophet left us and there is not a bird flapping its wings in the sky but we have some knowledge of it from him", cluster: prophecy}
  abu-hurayra-narrates-because-of-two-verses: {label: "'But for two verses in God's Book I would not narrate a hadith' (Q 2:159-160); the emigrants were busy in the markets, the helpers with their property, Abu Hurayra stayed with the prophet for his belly's fill", cluster: transmission}
  spread-cloak-and-forgot-nothing: {label: "The prophet tells Abu Hurayra to spread his cloak; he scoops with his hands into it, says 'gather it', and after that he forgot nothing he heard", cluster: miracle}
  two-vessels-of-knowledge-one-would-cost-the-throat: {label: "'I kept two vessels from the prophet: one I spread; the other, if I spread it, this gullet would be cut'", cluster: transmission}
  unshared-knowledge-like-unspent-treasure: {label: "One who learns knowledge and does not speak of it is like one who hoards treasure and spends none of it", cluster: ethics}
  ansar-women-not-held-back-by-shyness: {label: "'The best of women are the women of the Ansar: shyness did not keep them from learning the religion'", cluster: women}
  prophet-told-of-israelites-till-dawn: {label: "The prophet would tell them of the Children of Israel through the night until morning, rising only for the obligatory prayer", cluster: transmission}
  learned-jewish-script-in-half-a-month: {label: "The prophet orders Zayd b. Thabit to learn the writing of the Jews, 'I do not trust the Jews with my letters'; he masters it in half a month and writes and reads the prophet's letters", cluster: transmission}
  refuge-from-knowledge-without-benefit: {label: "Prayer for refuge from knowledge that does not benefit, a heart that is not humble, a soul that is not sated and a prayer not heard (and a deed not raised)", cluster: prayer}
  ask-god-for-useful-knowledge: {label: "Ask God for useful knowledge; 'benefit me by what you taught me, teach me what benefits me'", cluster: prayer}
  deeds-cut-off-at-death-but-three: {label: "When a man dies his deeds are cut off except three: ongoing charity, knowledge benefited from, a righteous child who prays for him", cluster: eschatology}
  seven-things-that-reach-believer-after-death: {label: "What reaches the believer after death: knowledge he taught and spread, a righteous child, a Quran copy he bequeathed, a mosque he built, a house for the wayfarer, a river he made flow, charity given in health", cluster: eschatology}
  angels-surround-those-studying-gods-book: {label: "No people gather in a house of God reciting and studying his Book together but calm (sakina) descends on them, mercy covers them, angels surround them, and God mentions them among those with him", cluster: angelology}
  when-god-mentions-a-thing-it-is-magnified: {label: "Finding men in the mosque recalling God's Book and the sunna: 'when God mentions a thing its mention is magnified'", cluster: theology}
  none-preaches-but-commander-appointee-or-showoff: {label: "None tells stories to people (yaqussu) except a commander, one commanded, or a show-off (mura'i / mukhtal / mutakallif)", cluster: law}
  no-storytelling-before-the-fitna: {label: "There was no storytelling in the time of the prophet, Abu Bakr, Umar or Uthman; it began in the time of the fitna", cluster: transmission}
  hadith-known-by-softening-of-skin-and-hair: {label: "A hadith from me that your hearts recognise and your hair and skin soften to, which you find near you, I am nearest to; one your hearts reject, your hair and skin shrink from, I am farthest from", cluster: transmission}
  israelites-wrote-a-book-and-left-torah: {label: "The Children of Israel wrote a book, followed it, and left the Torah", cluster: polemic}
  companions-relayed-from-each-other-none-lied: {label: "Not all we tell you from the prophet did we hear from him; our companions told us, and none of us called another a liar (we were busy herding camels)", cluster: transmission}
  abu-dharr-held-to-the-hard-ruling: {label: "Abu Dharr would hear a severe word, go out to his people, and miss the later relaxation, so he held to the severe command", cluster: transmission}
  feet-do-not-move-till-asked-four: {label: "A servant's feet will not move on the day of resurrection until he is asked of his life and how he spent it, his knowledge and what he did with it, his wealth whence earned and where spent, his body (youth) and how he wore it out", cluster: eschatology}
  ruin-of-community-in-the-book-and-milk: {label: "The ruin of my community is in the Book and milk: they learn the Quran and interpret it otherwise than God revealed it, and love milk so leave the congregations and Fridays and go out to the desert", cluster: eschatology}
  successors-after-sixty-years-waste-prayer: {label: "After sixty years come successors who waste the prayer and follow lusts (Q 19:59), then reciters whose Quran goes no further than their collarbones; three recite the Quran: believer, hypocrite and sinner", cluster: eschatology}
  eloquence-is-magic-poetry-is-wisdom: {label: "Two men from the east speak and people wonder at their eloquence: 'some eloquence is magic (sihr)'; and some poetry is wisdom (hukm)", cluster: wisdom}
  blessing-is-with-your-elders: {label: "Blessing is with your elders (akabirikum)", cluster: wisdom}
  overlook-slips-of-people-of-standing-except-hadd: {label: "Overlook the stumbles of people of good standing (dhawi l-hay'at), except in the hadd punishments", cluster: law}
  honouring-grey-haired-quran-bearer-just-ruler: {label: "It is of honouring God to honour the grey-haired Muslim, the bearer of the Quran who neither exceeds nor neglects it, and the just ruler", cluster: ethics}
  companion-runs-to-congratulate-penitent: {label: "When Ka'b enters the mosque after his repentance is accepted, Talha runs to shake his hand and congratulate him, the only one of the emigrants to rise; Ka'b never forgets it", cluster: ethics}
  father-and-daughter-rise-kiss-and-seat-each-other: {label: "When Fatima came in the prophet rose to her, kissed her and seated her in his place; when he came in she did the same; none more like him in bearing and gait", cluster: prophet-person}
  standing-over-seated-ruler-is-persian-roman: {label: "Seeing the people stand behind him as he prays seated, the prophet: 'you nearly did what Persia and Rome do, standing over their kings who sit'; if the imam prays sitting, pray sitting", cluster: ritual}
  who-loves-men-to-stand-for-him-seat-in-fire: {label: "Whoever loves that men stand before him (yamthula lahu l-rijal qiyaman), let him take his seat in the fire", cluster: ethics}
  companions-did-not-rise-for-him: {label: "No one was dearer to them than the prophet, yet when they saw him they did not rise, knowing his dislike of it", cluster: prophet-person}
  knowledge-lifted-by-taking-of-scholars: {label: "God does not take knowledge by snatching it from people but by taking the scholars; when no scholar is left people take ignorant heads who give fatwas without knowledge, stray and lead astray", cluster: eschatology}
  aisha-tests-report-a-year-later: {label: "Aisha doubts a companion's report, has her nephew ask him again a year later, and finding it unchanged says 'he spoke the truth, he added nothing and left nothing out'", cluster: transmission}
  time-draws-close-knowledge-taken-avarice-cast: {label: "Time draws together, knowledge is taken, trials appear, avarice is thrown in (yulqa l-shuhh), and the harj grows", cluster: eschatology}
  knowledge-snatched-torah-gospel-avail-nothing: {label: "Looking at the sky: 'this is the time when knowledge is snatched'; a companion protests they read the Quran and teach it to wives and children; 'here are the Torah and Gospel with the Jews and Christians: what use are they to them?'", cluster: eschatology}
  humility-first-knowledge-lifted: {label: "The first knowledge to be lifted from people is humility (al-khushu'): soon you will enter a congregational mosque and see not one humble man", cluster: eschatology}
  sin-of-fatwa-on-the-mufti: {label: "Whoever is given a fatwa without knowledge, its sin is on the one who gave it", cluster: law}
  striking-gods-book-part-against-part: {label: "Those before you perished by this: they struck God's Book part against part; it came down confirming itself, so do not belie part by part; say what you know and leave what you do not to one who knows", cluster: polemic}
  disputing-about-the-quran-is-unbelief: {label: "Disputing (al-mira') about the Quran is unbelief", cluster: polemic}
  recite-while-hearts-agree-rise-when-you-differ: {label: "Recite the Quran while your hearts agree on it; when you differ over it, rise", cluster: ritual}
  both-readings-correct-those-before-differed-and-perished: {label: "Two men read a verse differently; the prophet: 'both of you do well, recite'; those before you differed and were destroyed", cluster: polemic}
  face-as-if-pomegranate-seeds-burst: {label: "The prophet comes out to men contending over verses, his face as if pomegranate seeds had burst in it: 'was it for this you were sent? do not turn back unbelievers after me striking one another's necks'", cluster: prophet-person}
  forbidder-of-lawful-like-permitter-of-forbidden: {label: "One who forbids the lawful is like one who makes the forbidden lawful", cluster: law}
  reciters-who-boast-are-fuel-of-fire: {label: "Islam will spread until horses wade the seas and merchants cross them; then a people will read the Quran saying 'who reads better than we? who understands better?' - 'they are the fuel of the fire, and they are of you'", cluster: eschatology}
  greatest-lies-false-father-false-dream-false-hadith: {label: "Among the greatest lies (afra l-firā): to claim a father not one's own, to make one's eyes see what they did not see (a false dream), and to say of me what I did not say", cluster: ethics}
  house-built-in-fire-for-liar-about-prophet: {label: "Whoever lies about me deliberately, let him take a house (bayt) in the fire; 'a house is built in the fire for him'", cluster: eschatology}
  beware-much-hadith-from-me: {label: "From the pulpit: 'beware of much narrating from me; whoever speaks of me let him say only what is true'", cluster: transmission}
  silk-here-denied-hereafter: {label: "Whoever wears silk in this world is denied it in the next (said with the lying-hadith warning, in a governor's sermon on silk)", cluster: law}
  bridle-of-fire-for-concealed-knowledge: {label: "Whoever is asked about knowledge and conceals it will be bridled on the day of resurrection with a bridle of fire", cluster: eschatology}
  narrating-all-one-hears-enough-of-a-lie: {label: "It is enough of a lie for a man to narrate everything he hears", cluster: transmission}
  narrator-of-a-known-lie-is-one-of-the-liars: {label: "Whoever narrates from me a hadith he sees to be a lie is one of the liars", cluster: transmission}
  end-time-liars-bring-unheard-hadith: {label: "At the end of time there will be lying dajjals who bring you hadiths neither you nor your fathers heard: beware of them", cluster: eschatology}
  world-cursed-but-remembrance-knower-learner: {label: "The world is cursed and all in it, except remembrance of God and what goes with it, a knower or a learner", cluster: ethics}
  knowledge-for-worldly-gain-no-scent-of-paradise: {label: "Who learns knowledge by which God's face is sought, only to gain some worldly good, will not find the scent ('arf) of paradise on the day of resurrection", cluster: eschatology}
  do-not-learn-to-vie-with-scholars: {label: "Do not learn knowledge to vie with scholars, dispute with fools, or win the best seats; who does so, the fire, the fire", cluster: ethics}
  am-i-in-paradise-asked-and-answered: {label: "'Ask me what you will': one asks 'who is my father?', one 'am I in paradise?' - 'in paradise', another - 'in the fire'; Umar: 'we are content with God as Lord'", cluster: prophecy}
  three-forbidden-three-disliked: {label: "God has forbidden you disobeying mothers, burying daughters alive, and withholding while demanding (man' wa-hat), and dislikes for you three: 'it was said and he said', much questioning, and wasting wealth", cluster: law}
  forbidden-to-overburden-ourselves: {label: "Umar: 'we were forbidden over-burdening ourselves (al-takalluf)'", cluster: law}
  most-hypocrites-of-community-are-its-reciters: {label: "Most of the hypocrites of my community are its reciters (qurra'uha)", cluster: ethics}
  israelites-told-stories-when-they-perished: {label: "When the Children of Israel perished, they told stories (qassu)", cluster: polemic}
  storyteller-rises-to-pleiades-then-under-feet: {label: "Umar fears for a would-be storyteller: he will rise above them in his own eyes until he thinks himself at the Pleiades (al-thurayya), and God will put him under their feet on resurrection day", cluster: ethics}
  separate-from-woman-in-prayer-by-cloth: {label: "In a narrow room where a woman must pray beside him, a man screens between them with a cloth and she may pray abreast", cluster: ritual}
  companion-rebukes-standing-storyteller: {label: "A companion rebukes a man telling stories standing: 'we did not leave our prophet's covenant or cut our ties until you and your fellows rose among us'", cluster: transmission}
  storytellers-hold-tip-of-error: {label: "Ibn Masud stands up at a storyteller's group glorifying God in set counts: 'are you better guided than Muhammad and his companions? you are holding the tip of an error'", cluster: transmission}
  torah-copy-angers-prophet-moses-would-follow: {label: "Umar reads a copy of the Torah in Arabic to the prophet, whose face changes: 'do not ask the People of the Book; they will not guide you, having strayed; you will belie truth or believe falsehood; by God, if Moses were among you he could do nothing but follow me'", cluster: polemic}
  brought-it-white-and-pure: {label: "'Are you confused about it, Ibn al-Khattab? I brought it to you white and pure (bayda' naqiyya)'", cluster: revelation}
  knowledge-of-stars-a-branch-of-sorcery: {label: "Whoever takes up a piece of knowledge of the stars takes up a branch of sorcery: the more he adds, the more", cluster: law}
  extremists-perished-said-thrice: {label: "'The extremists (al-mutanatti'un) have perished', said three times", cluster: ethics}
  teacher-forgets-self-like-lamp-burning-itself: {label: "The knower who teaches people good and forgets himself is like a lamp (siraj) that lights people and burns itself", cluster: parable}
  handful-of-blood-bars-paradise: {label: "Let nothing come between one of you and paradise, as he looks at its gates, a palmful of a Muslim's blood he shed unjustly", cluster: eschatology}
units:
  - id: hadith-3-jews-ask-about-the-spirit
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Jews in the ruins of Medina ask about the spirit; the prophet silent under revelation, then Q 17:85"
    read: ["Jāmiʿ 3:785.1"]
    quran: ["17:85"]
    tags:
      - {motif: jews-ask-about-spirit-prophet-silent, refs: ["Jāmiʿ 3:785.1"], note: "في خرب المدينة -وهو يتوكأ على عسيب معه- ... سلوه عن الرّوح ... يا أبا القاسم! ما الرّوح؟ فسكت"}
  - id: hadith-3-most-knowing-of-god
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "'The most God-fearing and knowing of God is I': anger at the excuse that he is forgiven"
    read: ["Jāmiʿ 3:786.1"]
    tags:
