      - {motif: write-it-for-abu-shah, refs: ["Jāmiʿ 3:815.2"], note: "فجاء رجل من أهل اليمن، فقال: اكتُبْ لي يا رسول اللَّه ﷺ. فقال: اكتبوا لأبي فلان"}
      - {motif: idhkhir-grass-excepted, refs: ["Jāmiʿ 3:815.2"], note: "إلّا الإذخرَ يا رسول اللَّه! فإنّا نجعله في بيوتنا وقبورنا"}
      - {motif: writer-and-non-writer-companions, refs: ["Jāmiʿ 3:816.1"], note: "إلا ما كان من عبد اللَّه بن عمرو، فإنه كان يكتب، ولا أكتب"}
      - {motif: dying-prophet-asks-for-writing, refs: ["Jāmiʿ 3:816.2"], note: "ائتوني بكتاب أكتب لكم كتابًا لا تضلُّوا بعدها ... إنّ الرزيّة كلّ الرزيّة ما حال بين رسول اللَّه ﷺ وبين كتابه"}
      - {motif: alis-sheet-in-sword-scabbard, refs: ["Jāmiʿ 3:816.3"], note: "لا إلّا كتاب اللَّه، أو فهم أُعطيَهُ رجلٌ مسلمٌ، أو ما في هذه الصّحيفة ... العقل، وفكاك الأسير، ولا يقتل مسلم بكافر"}
      - {motif: write-nothing-but-truth-comes-out, refs: ["Jāmiʿ 3:816.4", "Jāmiʿ 3:817.1"], note: "فأومأ بإصبعه إلى فيه، فقال: اكتبْ، فوالذي نفسي بيده ما يخرجُ منه إلّا حقّ"}
