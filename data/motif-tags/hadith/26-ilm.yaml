      - {motif: neighbour-wishes-to-be-given-the-same-and-do-the-same, refs: ["Jāmiʿ 3:786.4"], note: "فسمعه جارٌ له فقال: ليتني أُوتيت مثل ما أوتي فلان، فعملتُ مثل ما يعمل"}
  - id: hadith-3-path-of-knowledge-angels-wings
