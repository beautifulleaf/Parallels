      - {motif: god-calls-with-voice-heard-far-as-near, refs: ["Jāmiʿ 3:792.1"], note: "ثم يناديهم بصوتٍ يسمعه مَن بعُد كما يسمعه مَن قَرُب، أنا الملك، أنا الدّيان"}
      - {motif: no-entry-till-claims-settled-even-a-slap, refs: ["Jāmiʿ 3:792.1"], note: "حتّى أُقِصَّه منه حتّى اللَّطمة ... قال: بالحسنات والسّيئات"}
  - id: hadith-3-moses-seeks-khidr-fish-sign
