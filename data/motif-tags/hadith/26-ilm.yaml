      - {motif: daughter-weeps-then-laughs-at-secret, refs: ["Jāmiʿ 3:842.2"], note: "أخبرني أنه ميت من وجعه هذا فبكيت، ثم أخبرني أني أسرعُ أهله لُحوقا به فذاك حين ضحكت"}
  - id: hadith-3-standing-disliked
