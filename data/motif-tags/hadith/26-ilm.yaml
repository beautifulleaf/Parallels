      - {motif: father-erases-sons-written-hadith, refs: ["Jāmiʿ 3:815.1"], note: "فأتيتُه به، فمحاه ثم قال: احفظ كما حفظنا عن رسول اللَّه ﷺ"}
  - id: hadith-3-writing-allowed
