      - {motif: knowledge-for-worldly-gain-no-scent-of-paradise, refs: ["Jāmiʿ 3:866.2"], note: "لا يتعلّمه إِلَّا ليصيب به عرضًا من الدّنيا، لم يجد عرف الجنّة يوم القيامة"}
      - {motif: do-not-learn-to-vie-with-scholars, refs: ["Jāmiʿ 3:867.1"], note: "لا تعلّموا العلم لتُباهوا به العلماء، ولا لتماروا به السُّفهاء، ولا لتحتازوا به المجالس، فمن فعل ذلك فالنَّارُ النَّارُ"}
  - id: hadith-3-much-questioning
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "'Who is my father?' and Q 5:101; 'ask me'; leave me as I leave you; three forbidden, three disliked; Uwaymir's question; who created God?; no over-burdening"
    read: ["Jāmiʿ 3:868.1-870.5"]
    quran: ["5:101"]
    tags:
      - {motif: laugh-little-weep-much, refs: ["Jāmiʿ 3:868.1"], note: "لو تعلمون ما أعلم لضحكتم قليلًا ولبكيتم كثيرًا. قال: فغطّى أصحاب رسول اللَّه ﷺ وجوههم لهم حنين"}
      - {motif: do-not-ask-about-things, refs: ["Jāmiʿ 3:868.1", "Jāmiʿ 3:868.2"], note: "فقال رجل: مَنْ أبي؟ قال: أبوك فلان. فنزلت هذه الآية ... ويقول الرّجل تضلُّ ناقته: أين ناقتي؟"}
      - {motif: your-father-is-hudhafa, refs: ["Jāmiʿ 3:868.3"], note: "مَنْ أبي؟ فقال: أبوك حذافة. ثم قام آخر فقال: يا رسول اللَّه، مَنْ أَبي؟ فقال: أبوك سالم مولى شيبة"}
      - {motif: am-i-in-paradise-asked-and-answered, refs: ["Jāmiʿ 3:869.1"], note: "سلوني عمَّا شئتم ... أفي الجنّة أنا؟ فقال: في الجنّة. وقال آخر: أفي الجنّة أنا؟ قال: في النّار"}
      - {motif: umar-kneels-content-with-god-islam-muhammad, refs: ["Jāmiʿ 3:869.1"], note: "فقام عمر ﵁، فقال: رضينا باللَّه ربًّا"}
      - {motif: leave-me-as-i-leave-you, refs: ["Jāmiʿ 3:869.2"], note: "ادعوني ما تركتكم إنّما هلك مَنْ كان قبلكم بسؤالهم، واختلافهم على أنبيائهم"}
      - {motif: three-forbidden-three-disliked, refs: ["Jāmiʿ 3:869.3", "Jāmiʿ 3:870.4"], note: "حرَّم عليكم عقوق الأمّهات، ووأد البنات، ومنعًا وهاتِ، وكره لكم ثلاثًا: قيل وقال، وكثرة السؤال، وإضاعة المال"}
      - {motif: female-infanticide-condemned, refs: ["Jāmiʿ 3:869.3"], note: "ووأد البنات"}
      - {motif: question-that-causes-a-prohibition, refs: ["Jāmiʿ 3:870.1"], note: "أعظم المسلمين في المسلمين جرما مَنْ سأل عن أمر لم يحرم فحرم على النّاس من أجل مسألته"}
      - {motif: question-that-causes-a-prohibition, refs: ["Jāmiʿ 3:870.2"], note: "كيف تقولون في رجل وجد مع امرأته رجلًا أيقتله ... فكره رسولُ اللَّه ﷺ المسائلَ ... قال عويمر: واللَّهِ! لا أنتهي حتّى أسأل"}
      - {motif: people-will-keep-asking-till-who-created-god, refs: ["Jāmiʿ 3:870.3"], note: "لن يبرح النَّاسُ يتساءلون حتّى يقولوا: هذا اللَّه خالقُ كلِّ شيءٍ، فمن خلق اللَّه؟"}
      - {motif: forbidden-to-overburden-ourselves, refs: ["Jāmiʿ 3:870.5"], note: "كنّا عند عمر فقال: نُهينا عن التّكلُّف"}
