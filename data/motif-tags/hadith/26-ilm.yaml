      - {motif: angels-lower-wings-for-seeker-of-knowledge, refs: ["Jāmiʿ 3:787.2"], note: "ما مِنْ خارجٍ خرج من بيته في طلب العلم إِلَّا وضع له الملائكةُ أجنحتها رضًا بما يصنع"}
  - id: hadith-3-two-banners-at-the-door
