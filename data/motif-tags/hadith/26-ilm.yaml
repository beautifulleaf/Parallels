    read: ["Jāmiʿ 3:856.1-860.2"]
    tags:
      - {motif: lying-about-the-prophet-earns-seat-in-fire, refs: ["Jāmiʿ 3:856.1", "Jāmiʿ 3:856.2", "Jāmiʿ 3:856.3", "Jāmiʿ 3:857.1", "Jāmiʿ 3:857.2", "Jāmiʿ 3:857.3", "Jāmiʿ 3:857.4", "Jāmiʿ 3:858.2", "Jāmiʿ 3:858.3", "Jāmiʿ 3:859.1", "Jāmiʿ 3:859.2", "Jāmiʿ 3:860.1", "Jāmiʿ 3:860.2"], note: "لا تكذبوا عليَّ، فإنّه مَنْ كذب عليَّ فلْيلج النّار ... إنّ كذبًا عليَّ ليس ككذب على أحد ... من كذب عليَّ متعمِّدًا ليُضلَّ به النَّاسَ"}
      - {motif: name-me-not-my-kunya, refs: ["Jāmiʿ 3:856.2"], note: "تَسمُّوا باسْمي ولا تكتنوا بكنيتي"}
      - {motif: satan-cannot-take-the-prophets-form-in-dream, refs: ["Jāmiʿ 3:856.2"], note: "ومن رآني في المنام فقد رآني، فإنّ الشّيطان لا يتمثّل في صورتي"}
      - {motif: convey-even-a-single-verse, refs: ["Jāmiʿ 3:857.4"], note: "بلِّغوا عنّي ولو آية"}
      - {motif: house-built-in-fire-for-liar-about-prophet, refs: ["Jāmiʿ 3:858.1"], note: "من كذب عليَّ متعمِّدًا فليتبوّأ بيتًا في النّار"}
      - {motif: beware-much-hadith-from-me, refs: ["Jāmiʿ 3:858.2"], note: "يا أيّها النّاس إيّاكم وكثرة الحديث عنّي، من قال عليَّ فلا يقولنَّ إلّا حقًّا -أو صدقًا-"}
      - {motif: silk-here-denied-hereafter, refs: ["Jāmiʿ 3:858.3"], note: "أما لكم في العَصْب والكَتَّان ما يكفيكم من الحرير ... من لبس الحريرَ في الدُّنيا، حُرِمه أن يلبسَه في الآخرة"}
      - {motif: companion-called-senile-cites-lying-hadith, refs: ["Jāmiʿ 3:858.4"], note: "تحدِّث أنّ له حوضًا في الجنّة؟ ... قال: كذبتَ، ولكنّك شيخٌ قد خَرِفْتَ"}
      - {motif: greatest-lies-false-father-false-dream-false-hadith, refs: ["Jāmiʿ 3:859.3"], note: "مِنْ أفرى الفِرى من ادّعى إلى غير والده، ومِنْ أفرى الفِري من أرڑي عينيه ما لم ترَ، ومن أفرى الفِرى من قال عليَّ ما لم أقل"}
  - id: hadith-3-concealing-knowledge
