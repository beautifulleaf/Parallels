      - {motif: moses-says-none-knows-more-god-names-khidr, refs: ["Jāmiʿ 3:794.1"], note: "هل تعلمُ أحدًا أعلم منك؟ قال موسى: لا، فأوحى اللَّه إلى موسى: بلى، عبدنا خضر ... فجعل اللَّه له الحوتَ آية، وقيل له: إذا فقدتَ الحوت فارجعْ فإنَّك ستلقاه"}
