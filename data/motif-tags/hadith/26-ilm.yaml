      - {motif: unshared-knowledge-like-unspent-treasure, refs: ["Jāmiʿ 3:820.2"], note: "مثل الذي يتعلّم العلم ولا يتحدّث به كمثل الذي يكنز الذّهب ولا ينفق منه"}
