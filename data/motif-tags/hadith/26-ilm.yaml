      - {motif: scholar-over-worshipper-as-full-moon-over-stars, refs: ["Jāmiʿ 3:788.2"], note: "وفضلُ العالم على العابد كفضل القمر ليلة البدر على سائر الكواكب"}
      - {motif: scholars-heirs-of-prophets-who-left-no-dinar, refs: ["Jāmiʿ 3:788.2"], note: "إنّ العلماء ورثة الأنبياء، إنّ الأنبياء لم يورِّثوا دينارًا ولا درهمًا، وأورثوا العلم، فمن أخذه أخذ بحظّ وافر"}
