      - {motif: founder-of-good-practice-shares-later-reward, refs: ["Jāmiʿ 3:798.2", "Jāmiʿ 3:799.2", "Jāmiʿ 3:799.3", "Jāmiʿ 3:800.1"], note: "مَنْ سَنَّ في الإسلام سنةً حسنةً، فعُمل بها بعده، كُتب له مثل أجر من عمل بها ... ومَنْ سنَّ في الإسلام سنَّة سيِّئةً"}
