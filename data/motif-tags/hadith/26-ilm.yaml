      - {motif: guidance-like-rain-on-three-grounds, refs: ["Jāmiʿ 3:808.2"], note: "كمثل غيث أصاب أرضًا، فكانت منها طائفة طيبة ... وكان منها أجادب أمسكت الماء ... إنّما هي قيعان، لا تمسك ماء، ولا تُنبتُ كلأ"}
      - {motif: teaching-a-verse-rewarded-as-long-as-recited, refs: ["Jāmiʿ 3:808.3"], note: "من علَّم آيةً من كتاب اللَّه ﷿ كان له ثوابها ما تُليت"}
    hints:
      - "The word received by three kinds of ground of which only good soil bears, against the sower in Mark 4:3-8 (path, rocky ground, thorns, good soil); here the middle ground that holds water for others is counted useful though it grows nothing itself."
