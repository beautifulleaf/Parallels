    read: ["Jāmiʿ 3:830.1-830.3"]
    tags:
      - {motif: people-are-mines, refs: ["Jāmiʿ 3:830.1", "Jāmiʿ 3:830.2", "Jāmiʿ 3:830.3"], note: "النّاس معادن، خيارهم في الجاهلية خيارهم في الإسلام إذا فقهوا"}
      - {motif: joseph-noblest-of-people, refs: ["Jāmiʿ 3:830.2"], note: "من أكرم النّاس؟ قال: أتقاهم ... فيوسف نبي اللَّه ابن نبي اللَّه ابن خليل اللَّه"}
  - id: hadith-3-report-not-like-seeing
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Report is not like seeing: Moses throws the tablets only when he sees the calf"
    read: ["Jāmiʿ 3:831.1"]
    quran: ["2:260", "7:150"]
    tags:
      - {motif: moses-told-of-calf-did-not-throw-tablets-until-he-saw, refs: ["Jāmiʿ 3:831.1"], note: "ليس الخبر كالمعاينة، إنّ اللَّه ﷿ أخبر موسى بما صنع قومه في العجل، فلم يلقِ الألواح، فلمّا عاين ما صنعوا، ألقى الألواحَ فانكسرتْ"}
    hints:
      - "God tells Moses on the mountain of the calf (Exod 32:7-8), yet he breaks the tablets only 'as soon as he came nigh unto the camp, that he saw the calf' (Exod 32:19); the hadith makes the order of telling and seeing its point."
  - id: hadith-3-companions-relay-and-abu-dharr
