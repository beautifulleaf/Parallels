      - {motif: face-as-if-pomegranate-seeds-burst, refs: ["Jāmiʿ 3:853.4"], note: "كأنّما تفقّأ في وجهه حبُّ الزمان ... لا ترجعوا بعدي كفّارًا يضرب بعضكم رقاب بعض"}
