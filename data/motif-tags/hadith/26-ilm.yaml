      - {motif: abu-dharr-held-to-the-hard-ruling, refs: ["Jāmiʿ 3:831.4"], note: "ثم إنّ رسول اللَّه ﷺ يرخِّص فيه بعدُ فلم يسمعه أبو ذرّ، فيتعلَّق أبو ذر بالأمر الشَّديد"}
  - id: hadith-3-told-all-that-will-be
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "He told everything until the Hour; a sermon from dawn to sunset; no bird flaps its wings but we know of it"
    read: ["Jāmiʿ 3:832.1-833.1"]
    tags:
      - {motif: forgotten-prediction-recognized-like-a-face, refs: ["Jāmiʿ 3:832.1"], note: "قد نسيتُه فأراه فأذكره، كما يذكرُ الرّجلُ وجه الرّجل إذا غاب عنه، ثم إذا رآه عرفه"}
      - {motif: sermon-from-dawn-to-sunset-of-what-was-and-will-be, refs: ["Jāmiʿ 3:832.2"], note: "فخطبنا حتّى حضرت الظّهر ... حتّى حضرت العصر ... حتّى غربت الشّمس، فأخبرنا بما كان وبما هو كائن. فأعلمُنا أحْفظنا"}
      - {motif: no-bird-flaps-wings-but-we-have-knowledge-of-it, refs: ["Jāmiʿ 3:833.1"], note: "تركنا رسول اللَّه ﷺ وما طائر يطير بجناحيه إلّا عندنا منه علم"}
  - id: hadith-3-feet-do-not-move
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "The servant's feet do not move till he is asked of life, knowledge, wealth and body"
    read: ["Jāmiʿ 3:833.2-833.3"]
    tags:
      - {motif: feet-do-not-move-till-asked-four, refs: ["Jāmiʿ 3:833.2", "Jāmiʿ 3:833.3"], note: "لا تزولُ قدما عبدٍ يوم القيامة حتّى يُسأل عن عمره فيما أفناه، وعن علمه فيما فعل، وعن ماله من أين اكتسبه وفيما أنفقه، وعن جسمه فيما أبلاه"}
    hints:
      - "Each man asked at judgment of named uses of his life, against the questions put to the soul in b. Shabbat 31a ('did you deal faithfully, fix times for Torah, engage in procreation ...')."
