      - {motif: who-loves-men-to-stand-for-him-seat-in-fire, refs: ["Jāmiʿ 3:843.2"], note: "من أحبَّ أن يَمْثُل له الرّجال قيامًا فليتبوّأُ مقعده من النّار"}
      - {motif: companions-did-not-rise-for-him, refs: ["Jāmiʿ 3:843.3"], note: "وكانوا إذا رأوه لم يقوموا لما يعلمون من كراهيته لذلك"}
  - id: hadith-3-knowledge-lifted
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Knowledge lifted by the death of scholars; fifty women to one man; harj; Torah and Gospel avail nothing; humility the first to go"
    read: ["Jāmiʿ 3:845.1-848.2"]
    tags:
      - {motif: fifty-women-one-guardian, refs: ["Jāmiʿ 3:845.1"], note: "أن يقلَّ العلمُ، ويظهَر الجهلُ، ويظهرَ الزِّنا، وتَكْثُرَ النّساءُ، ويقلَّ الرِّجالُ، حتّى يكون لخمسين امرأةً القيِّمُ الواحدُ"}
      - {motif: harj-is-killing, refs: ["Jāmiʿ 3:845.2", "Jāmiʿ 3:846.1", "Jāmiʿ 3:847.2"], note: "ويكثر فيها الهرْجُ، -والهرْجُ: القتل- ... قالوا: وما الهرج؟ قال: القتل"}
      - {motif: knowledge-lifted-by-taking-of-scholars, refs: ["Jāmiʿ 3:845.3", "Jāmiʿ 3:845.4", "Jāmiʿ 3:847.1", "Jāmiʿ 3:847.3"], note: "إنّ اللَّه لا يقبض العلم انتزاعًا ينتزعه من النّاس، ولكن يقبض العلم بقبض العلماء، حتّى إذا لم يترك عالمًا اتّخذ النّاسُ رؤوسًا جهّالًا"}
      - {motif: aisha-tests-report-a-year-later, refs: ["Jāmiʿ 3:845.4"], note: "حتّى إذا كان قابلٌ ... فذكره لي نحو ما حدّثني به في مرّته الأولى ... ما أحسَبه إلّا قد صدق، أَراه لم يَزِدْ فيه شيئًا ولم يَنْقُصْ"}
      - {motif: time-draws-close-knowledge-taken-avarice-cast, refs: ["Jāmiʿ 3:846.1"], note: "يتقارب الزّمان ويقبض العلم، وتظهر الفتن، ويُلقى الشُّح، ويكثر الهرج"}
      - {motif: many-reciters-few-jurists, refs: ["Jāmiʿ 3:847.2"], note: "يكثر القرّاء، ويقلُّ الفقهاء ... ثم يأتي زمان يجادل المنافق المشركُ المؤمن"}
      - {motif: knowledge-snatched-torah-gospel-avail-nothing, refs: ["Jāmiʿ 3:848.1", "Jāmiʿ 3:848.2"], note: "هذا أوانُ يُختلسُ العلمُ من النّاس ... هذه التّوراة والإنجيل عند اليهود والنّصارى فماذا تغني عنهم؟"}
      - {motif: humility-first-knowledge-lifted, refs: ["Jāmiʿ 3:848.1", "Jāmiʿ 3:848.2"], note: "إن شئت لأحدّثنَّك بأوّل عِلم يُرفع من النّاس: الخشوع يُوشِكُ أن تدخل مسجد جماعةٍ فلا ترى فيه رجلًا خاشعًا"}
    hints:
      - "Knowledge failing as the sages die, against m. Sotah 9:15 ('when R. Meir died the makers of parables ceased; when Ben Azzai died the diligent ceased ...'), where each sage's death ends a kind of learning."
