      - {motif: three-things-a-believers-heart-does-not-betray, refs: ["Jāmiʿ 3:810.1", "Jāmiʿ 3:810.2", "Jāmiʿ 3:811.1", "Jāmiʿ 3:811.2"], note: "ثلاث لا يغلُّ عليهنَّ قلبُ امرئ مسلم: إخلاص العمل للَّه، والنّصيحة لولاة الأمر، ولزوم جماعتهم، فإنّ دعوتهم تحيط من ورائهم"}
