    read: ["Jāmiʿ 3:841.3-842.2"]
    tags:
      - {motif: stand-for-your-master, refs: ["Jāmiʿ 3:841.3"], note: "لما نزلتْ بنو قريظة على حكم سعد ... فجاء على حمار، فلما دنا قال النبيّ ﷺ: قوموا إلى سيّدكم"}
      - {motif: companion-runs-to-congratulate-penitent, refs: ["Jāmiʿ 3:842.1"], note: "فقام إليَّ طلحةُ بن عبيد اللَّه يُهرول حتّى صافحني وهنّأني، ما قام إليَّ رجلٌ من المهاجرين غيره، ولا أنساها لطلحة"}
