# Hadith chunk 31: al-Jāmiʿ al-Kāmil book 9 (kitāb al-ṣalāt), pp. 1343-1462 (printed 2/563-642, the title pages of vol. 3,
# then 3/5-40): the rest of prostration, the tashahhud and the blessing on the prophet, the supplications before the
# salam, the salam and leaving, the remembrance after prayer, then the imamate (who leads, the seated imam, following
# the imam) and the rows. Read in full from the Arabic (209 hadith).
new_motifs:
  seven-limbs-prostrate-with-the-servant:
    label: 'When the servant prostrates, seven limbs prostrate with him: face, two palms, two knees, two feet'
    cluster: ritual
  mud-on-forehead-and-nose-tip-after-prayer:
    label: The prophet is seen after leading prayer with traces of mud on his forehead and the tip of his nose (arnaba)
    cluster: ritual
  nose-and-forehead-firmly-on-ground:
    label: In prostration he set his nose and forehead firmly on the ground
    cluster: ritual
  seven-bones-forehead-with-hand-pointing-to-nose:
    label: '''I was ordered to prostrate on seven bones'': the forehead (pointing with his hand to his nose), the hands, knees and feet'
    cluster: ritual
  hands-prostrate-as-face-prostrates:
    label: 'The two hands prostrate as the face prostrates: put them down with it and raise them with it'
    cluster: ritual
  feet-upright-soles-felt-in-dark:
    label: Missing him at night from the bed, she feels in the dark for him and her hand falls on the soles of his feet, upright, in prostration
    cluster: ritual
  refuge-in-you-from-you:
    label: 'Prostration prayer: ''I seek refuge in your pleasure from your anger, in your pardon from your punishment, and in you from you; I cannot count your praise'''
    cluster: theology
  heels-pressed-toes-toward-qibla:
    label: Found prostrate with heels pressed together (rāṣṣan ʿaqibayhi) and the tips of his toes facing the qibla
    cluster: ritual
  every-human-has-a-devil-mine-submitted:
    label: '''Your devil has taken you, Aisha.'' ''Have you no devil?'' ''Every human has a devil; I too, but I prayed against him and he submitted (aslama)'''
    cluster: theology
  hands-near-ears-in-prostration:
    label: In prostration his hands were near his ears
    cluster: ritual
  prostrate-on-heels-of-palms:
    label: He prostrated on the fleshy heels of the palms (alyatay al-kaff)
    cluster: ritual
  fingers-toward-qibla-limbs-spread:
    label: Bowing he flattened his back; prostrating he turned his fingers toward the qibla and spread his limbs apart (tafājja)
    cluster: ritual
  fingers-spread-in-bowing-joined-in-prostration:
    label: Bowing he spread his fingers apart; prostrating he joined them
    cluster: ritual
  sit-upright-before-rising-from-odd-rakaa:
    label: In an odd rak'a he did not rise until he had sat upright (the resting sitting)
    cluster: ritual
  squatting-on-heels-is-sunna-not-coarseness:
    label: Asked about squatting on the heels (iqʿāʾ) between prostrations, Ibn Abbas says it is the sunna of your prophet, not coarseness to a man
    cluster: ritual
  devils-heel-sitting-forbidden:
    label: He forbade the devil's heel-sitting (ʿuqbat al-shayṭān)
    cluster: ritual
  leaning-on-left-hand-is-prayer-of-jews:
    label: 'A man sits in prayer leaning on his left hand: ''that is the prayer of the Jews'''
    cluster: polemic
  prays-to-show-how-prophet-prayed:
    label: 'A Companion leads prayer only to show how the prophet prayed: ''I pray with you and do not intend prayer'''
    cluster: ritual
  rise-leaning-on-ground-with-hands:
    label: After the second prostration he sat, leaned on the ground with his hands, and rose
    cluster: ritual
  only-good-dream-left-of-prophecy:
    label: 'Lifting the curtain in his last illness: nothing remains of the heralds of prophecy but the good dream the Muslim sees or is shown'
    cluster: dreams
  nearest-to-lord-while-prostrate:
    label: The servant is nearest his Lord while prostrating, so multiply supplication
    cluster: ritual
  each-prostration-raises-degree-removes-sin:
    label: You do not prostrate once to God but he raises you a degree and removes a sin from you (and writes a good deed)
    cluster: ritual
  asks-for-company-in-paradise:
    label: Asked 'ask', the servant who brings his water asks to be the prophet's companion in paradise
    cluster: sira
  servant-asks-intercession-my-lord-guided-me:
    label: A servant asked his need asks for intercession on the day of resurrection; 'who directed you?' 'My Lord'
    cluster: eschatology
  abu-dharr-weeps-three-times-in-jerusalem:
    label: 'In Jerusalem a man prostrating much, asked if he knew whether he ended on even or odd, weeps three times saying ''my beloved Abu al-Qasim told me'': it is Abu Dharr'
    cluster: sira
  if-i-do-not-know-god-knows:
    label: '''If I do not know (whether even or odd), God knows'''
    cluster: theology
  glory-to-you-no-god-but-you-in-bowing:
    label: 'Missing him at night she thinks he went to another wife and finds him bowing or prostrating: ''glory and praise to you, no god but you''; ''I am in one concern and you in another'''
    cluster: ritual
  glory-to-my-lord-great-and-most-high:
    label: In bowing 'glory to my Lord the Great', in prostration 'glory to my Lord the Most High'
    cluster: ritual
  pause-at-verse-of-mercy-and-punishment:
    label: Reciting at night he stops at every verse of mercy to ask and at every verse of punishment to seek refuge
    cluster: ritual
  forgive-my-sin-small-and-great-first-and-last:
    label: 'Prostration prayer: ''forgive me all my sin, its small and great, first and last, open and secret'''
    cluster: ritual
  face-prostrates-to-who-split-its-hearing:
    label: '''My face prostrates to the one who created and formed it and split open its hearing and sight; blessed is God, the best of creators'''
    cluster: ritual
  hearing-sight-marrow-bone-sinew-humbled:
    label: 'In bowing: ''my hearing, sight, marrow, bone and sinew (blood and flesh) are humbled to you'''
    cluster: ritual
  bowing-as-long-as-standing-baqara-al-imran:
    label: At night he recites al-Baqara, bows as long as he stood, prostrates as long, then recites Al Imran and sura after sura
    cluster: ritual
  glorification-three-times-in-bowing:
    label: He says the glorification in bowing three times
    cluster: ritual
  light-in-heart-hearing-sight-all-sides:
    label: 'Prostration prayer: ''put light in my heart, hearing and sight, beneath me and above me, right and left, before and behind, and make light great for me'''
    cluster: ritual
  untied-waterskin-ablution-between-two:
    label: He unties the waterskin's strap and does an ablution 'between two ablutions', sleeps, then rises again for the full one
    cluster: ritual
  sleeps-till-snores-bilal-wakes:
    label: After the night prayer he sleeps until he breathes heavily (nafakha), and Bilal wakes him for prayer
    cluster: ritual
  stands-so-long-they-say-he-forgot:
    label: After bowing and between the prostrations he remained so long that one would say 'he has forgotten'
    cluster: ritual
  lord-forgive-me-twice-between-prostrations:
    label: 'Between the two prostrations: ''Lord forgive me, Lord forgive me'''
    cluster: ritual
  five-requests-between-prostrations:
    label: 'Between the prostrations: ''O God forgive me, have mercy on me, keep me well, guide me, provide for me'''
    cluster: ritual
  all-pillars-nearly-equal:
    label: His standing, bowing, rising, prostration and sitting between the prostrations were nearly equal in length
    cluster: ritual
  fifty-three-hand-sign-index-pointed:
    label: Seated in the tashahhud he made the hand-count sign for fifty-three ('aqada thalāthatan wa-khamsīn') and pointed with the index finger
    cluster: ritual
  left-foot-between-thigh-and-shin:
    label: Seated in prayer he put his left foot between his thigh and shin, laid down the right, thumb on the middle finger, the left palm 'feeding' (yulqim) the knee
    cluster: ritual
  playing-with-pebbles-corrected:
    label: 'A man playing with the pebbles in prayer is told: do as the prophet did, all fingers closed and the one next to the thumb pointing'
    cluster: ritual
  cross-legged-because-my-legs-fail:
    label: 'Ibn Umar sits cross-legged in prayer and forbids his son: the sunna is right foot up, left folded; ''my legs do not carry me'''
    cluster: ritual
  next-year-hands-raised-under-burnus:
    label: Returning the next year he sees them raising their hands inside their hooded cloaks (barānis)
    cluster: ritual
  tawarruk-in-last-sitting:
    label: In the last rak'a he put his left foot forward, raised the other, and sat on his seat (the hip)
    cluster: ritual
  tashahhud-in-middle-and-end-then-choose-prayer:
    label: He taught the tashahhud for the middle and the end; in the middle he rose after it, at the end he prayed what he wished then gave the salam
    cluster: ritual
  rose-after-two-without-sitting-prostrated-before-salam:
    label: He stood up after two rak'as without sitting; at the end, before the salam, he made two prostrations seated
    cluster: ritual
  index-finger-harder-on-satan-than-iron:
    label: '''It is harder on Satan than iron'' - the index finger raised in the tashahhud, his eyes following it'
    cluster: ritual
  middle-and-thumb-ring-index-points:
    label: He closed two fingers, made a ring of thumb and middle finger, and pointed the index
    cluster: ritual
  gaze-does-not-pass-the-finger:
    label: Pointing with the index finger, his gaze did not go beyond his pointing
    cluster: ritual
  make-it-one-make-it-one:
    label: 'Seeing a man supplicate with two fingers: ''make it one, make it one'' (aḥḥid aḥḥid)'
    cluster: ritual
  tashahhud-said-silently:
    label: It is sunna to say the tashahhud silently
    cluster: ritual
  peace-on-gabriel-and-michael-god-is-peace:
    label: They used to say 'peace on Gabriel and Michael, peace on so-and-so'; 'God is Peace (al-salām)', so say 'the greetings are God's...'
    cluster: angels
  salam-reaches-every-righteous-servant-in-heaven-and-earth:
    label: Saying 'peace on us and on God's righteous servants' reaches every righteous servant of God in heaven and earth
    cluster: angels
  tahiyyat-text:
    label: 'The tashahhud: ''the greetings are God''s, and the prayers and the good things; peace on you, O prophet, and God''s mercy and blessings...'''
    cluster: ritual
  taught-tashahhud-as-a-sura:
    label: He taught the tashahhud as he taught a sura of the Quran
    cluster: ritual
  ibn-umar-i-added-blessings-and-alone:
    label: 'Ibn Umar inserts into the prophet''s tashahhud ''I added: and his blessings'' and ''I added: alone, without partner'''
    cluster: transmission
  umar-teaches-tashahhud-from-pulpit:
    label: 'Umar teaches the people the tashahhud from the pulpit: ''the greetings are God''s, the pure things are God''s...'''
    cluster: ritual
  aisha-tashahhud-ends-peace-upon-you:
    label: Aisha's tashahhud puts the witness first and ends 'peace be upon you'
    cluster: ritual
  blessing-as-on-family-of-abraham:
    label: '''O God bless Muhammad (and his wives and offspring) as you blessed the family of Abraham, and bless (bārik) as you blessed the family of Abraham; you are praised, glorious'''
    cluster: abraham
  silent-until-they-wished-he-had-not-been-asked:
    label: Asked how to bless him, he is silent until they wish the man had not asked
    cluster: sira
  a-gift-i-heard-from-the-prophet:
    label: '''Shall I not give you a gift?'' - the formula of blessing is handed on as a gift (hadiyya)'
    cluster: transmission
  praise-then-blessing-then-ask:
    label: 'A man prays without glorifying God or blessing the prophet: ''he hurried''; begin with praise of your Lord, then bless the prophet, then ask'
    cluster: ritual
  strive-then-say-bless:
    label: '''Pray, and strive (in supplication), then say: O God bless Muhammad...'''
    cluster: ritual
  four-refuges-grave-fire-life-death-dajjal:
    label: 'Seek refuge in God from four: punishment of hell, punishment of the grave, the trial of life and death, the trial of the false messiah'
    cluster: eschatology
  debtor-lies-and-breaks-promise:
    label: '''Why so often refuge from debt?'' ''A man in debt speaks and lies, promises and breaks it'''
    cluster: ethics
  jewish-women-tell-of-grave-punishment:
    label: 'A Jewish woman (two old Jewish women) tells Aisha the dead are punished in their graves; he confirms: ''punished so that all the beasts hear it''; after that he always sought refuge from it in prayer'
    cluster: eschatology
  beasts-hear-the-punished-in-graves:
    label: The dead are punished in their graves with a punishment all the beasts hear
    cluster: eschatology
  refuge-from-evil-done-and-not-done:
    label: '''I seek refuge in you from the evil of what I did and the evil of what I did not do'''
    cluster: ritual
  easy-reckoning-book-looked-at-and-passed:
    label: '''Make my reckoning easy'': the easy reckoning is that he looks into his book and passes over it; whoever''s account is disputed is ruined'
    cluster: eschatology
  around-it-we-hum:
    label: 'A man says he cannot do the prophet''s ''humming'' (dandana) nor Muadh''s, only asks paradise and refuge from fire: ''around it we hum'''
    cluster: ritual
  i-wronged-myself-much:
    label: 'Taught to Abu Bakr for his prayer: ''O God I have wronged myself much, and none forgives sins but you'''
    cluster: ritual
  you-are-the-one-who-brings-forward-and-back:
    label: 'Between tashahhud and salam: ''forgive me what I sent ahead and kept back ... you are the one who brings forward (al-muqaddim) and puts back'''
    cluster: ritual
  asks-by-the-one-the-eternal-forgiven-thrice:
    label: A man asks by 'God, the One, the Eternal, who begets not and was not begotten'; the prophet says three times 'he has been forgiven'
    cluster: ritual
  greatest-name-when-asked-gives:
    label: '''You have asked God by the name which, when he is asked by it he gives, and when called by it he answers'''
    cluster: theology
  ten-glorify-ten-praise-then-ask-yes-yes:
    label: 'Umm Sulaym is told: glorify God ten times, praise him ten, then ask your need: he says ''yes, yes'''
    cluster: ritual
  ask-to-live-while-life-is-better:
    label: '''By your knowledge of the unseen ... let me live while life is better for me and take me when death is better'''
    cluster: theology
  white-of-cheek-seen-at-salam:
    label: He gave the salam to right and left until the white of his cheek was seen
    cluster: ritual
  where-did-he-pick-it-up:
    label: 'A governor in Mecca gives two salams; Ibn Masud: ''where did he pick that up (annā ʿaliqahā)?'' - the prophet used to do it'
    cluster: ritual
  two-salams-with-wa-barakatuh:
    label: 'To right and left: ''peace be on you and God''s mercy and his blessings'''
    cluster: ritual
  one-loud-salam-wakes-household:
    label: At night after the ninth (eighth) rak'a he gives a single salam, 'peace be on you', raising his voice until he wakes us
    cluster: ritual
  single-salam-separates-witr:
    label: He separated the even from the odd (witr) with a single salam, letting us hear it
    cluster: ritual
  hold-nose-and-leave:
    label: Whoever breaks wudu' in prayer should hold his nose and leave
    cluster: ritual
  women-leave-before-men-rise:
    label: After the salam the women rose and left while he stayed a little, so they could get home before the men
    cluster: ritual
  turns-mostly-to-the-right:
    label: Most often I saw him turn away to his right
    cluster: ritual
  lord-guard-me-on-day-you-raise-servants:
    label: 'Praying behind him they liked to be on his right, facing him: ''Lord, guard me from your punishment on the day you raise (gather) your servants'''
    cluster: eschatology
  give-satan-no-share-turning-left:
    label: '''Let none give Satan a share of his prayer, thinking he must turn only to the right'': I often saw him turn to his left'
    cluster: ritual
  faces-people-after-prayer-asks-dreams:
    label: After a prayer he turned his face to us (and asked, 'did any of you see a dream?')
    cluster: dreams
  prays-barefoot-and-shod-standing-and-sitting:
    label: He prayed barefoot and shod, standing and sitting (drank standing and sitting), and turned away right and left
    cluster: ritual
  no-preventer-of-what-you-give:
    label: 'After every obligatory prayer: ''no god but God alone ... none withholds what you give, none gives what you withhold, the fortune of the fortunate avails not against you'''
    cluster: ritual
  dictated-letter-to-muawiya:
    label: Al-Mughira dictates to his scribe a letter to Muawiya with what he heard the prophet say after prayer
    cluster: transmission
  loud-dhikr-told-prayer-end:
    label: Raising the voice in dhikr after the obligatory prayer was done in his time; Ibn Abbas knew they had finished when he heard it
    cluster: ritual
  poor-complain-rich-take-rewards:
    label: 'The poor complain that the owners of wealth took the high degrees: they pray and fast as we do and give charity from surplus'
    cluster: ethics
  hundredth-is-tahlil-sins-like-sea-foam:
    label: 'Thirty-three each makes ninety-nine; the hundredth is ''no god but God alone...'': his sins are forgiven though like the foam of the sea'
    cluster: ritual
  refuge-from-cowardice-and-worst-of-age:
    label: 'Sa''d teaches his sons as a teacher teaches boys writing: refuge from cowardice, from being returned to the worst of age, the trial of the world and of the grave'
    cluster: ritual
  ibn-zubayr-tahlil-even-if-unbelievers-hate:
    label: 'After the salam: ''no god but God ... sincere to him in religion, though the unbelievers hate it'''
    cluster: ritual
  three-istighfar-you-are-peace:
    label: On turning from prayer he asked forgiveness three times and said 'O God you are Peace and from you is peace; blessed are you, owner of majesty and honour'
    cluster: ritual
  sat-only-as-long-as-allahumma-anta-al-salam:
    label: After the salam he sat only as long as it takes to say 'O God you are Peace ...'
    cluster: ritual
  muaqqibat-thirty-three-thirty-three-thirty-four:
    label: '''Following phrases (muʿaqqibāt) whose sayer is not disappointed'': 33 glorifications, 33 praises, 34 takbirs'
    cluster: ritual
  dream-changes-dhikr-to-twenty-five-with-tahlil:
    label: 'An Ansari dreams he is told: make them twenty-five each and add the tahlil; the prophet: ''do it'''
    cluster: dreams
  ten-each-150-on-tongue-1500-in-balance:
    label: Ten each after the five prayers is 150 on the tongue and 1,500 in the balance; at bed 100 is 1,000; 'who of you does 2,500 bad deeds a day?'
    cluster: eschatology
  counted-on-his-hand:
    label: I saw the prophet count them on his hand (yaʿqiduhā bi-yadihi)
    cluster: ritual
  satan-reminds-in-prayer-lulls-to-sleep:
    label: Satan comes in prayer saying 'remember this, remember that', and at bed lulls him to sleep, so few keep the two practices
    cluster: theology
  by-god-i-love-you-help-me-remember:
    label: 'Taking Muadh''s hand: ''By God I love you''; never omit after prayer ''O God help me to remember you, thank you and worship you well''; the charge passed on down the chain'
    cluster: transmission
  muawwidhat-after-every-prayer:
    label: He ordered me to recite the protective suras (al-muʿawwidhāt) after every prayer
    cluster: ritual
  throne-verse-after-prayer-only-death-bars-paradise:
    label: Whoever recites the Throne Verse after every obligatory prayer, nothing keeps him from paradise but dying
    cluster: eschatology
  kaab-swears-torah-david-prayer:
    label: Ka'b swears by him who split the sea for Moses that the Torah says David, turning from prayer, said 'set right my religion ... my world'; Suhayb said Muhammad said these words
    cluster: polemic
  most-versed-in-quran-leads-then-sunna-hijra-islam:
    label: The one most versed in God's book leads; if equal, the most learned in sunna, then earliest in emigration, then earliest in Islam (age)
    cluster: law
  no-leading-in-anothers-authority-nor-his-cushion:
    label: No man leads another in his domain of authority nor sits on his place of honour (takrima) in his house without leave
    cluster: law
  eldest-leads-young-men-sent-home:
    label: 'Young men stay twenty nights; he sends them home: let one call the adhan and the eldest lead; ''pray as you have seen me pray'''
    cluster: law
  abu-bakr-ordered-to-lead-weeps:
    label: 'In his last illness: ''tell Abu Bakr to lead the people''; Aisha: he is tender and weeps when he stands in your place'
    cluster: sira
  hafsa-i-never-get-good-from-you:
    label: 'Hafsa, having passed on Aisha''s plea, says to her: ''I was never to get any good from you'''
    cluster: sira
  fainting-asks-did-people-pray:
    label: Fainting and waking three times he asks 'has the prayer come?', each time ordering Bilal to call and Abu Bakr to lead
    cluster: sira
  ansar-refuse-to-go-before-abu-bakr:
    label: At the Ansar's 'a leader from us and a leader from you' Umar asks who would put himself before the man the prophet set to lead prayer
    cluster: sira
  leans-on-barira-and-another:
    label: Feeling lighter he asks 'find me someone to lean on'; Barira and a man come
    cluster: sira
  imam-not-higher-than-people:
    label: He forbade the imam to stand on something higher with the people below him
    cluster: law
  prays-on-pulpit-steps-back-to-prostrate:
    label: 'He prays on the pulpit, bows on it, comes down backwards to prostrate at its foot: ''so you may follow and learn my prayer'''
    cluster: ritual
  arabs-awaited-the-conquest:
    label: 'The Arabs waited on the conquest for their Islam: ''leave him and his people; if he prevails he is a true prophet'''
    cluster: sira
  blind-man-leads-his-people:
    label: A blind man leads his people in prayer (Itban; Ibn Umm Maktum left over Medina; Abd Allah b. Umayr of Banu Khatma, who also went on raids blind)
    cluster: law
  blind-imam-also-went-on-raids:
    label: The blind imam of Banu Khatma also went on raids with the prophet while blind
    cluster: sira
  client-leads-first-emigrants-at-quba:
    label: Before the prophet arrived, Salim the client of Abu Hudhayfa led the first emigrants at al-ʿUṣba, being the most versed in Quran
    cluster: sira
  book-raises-some-lowers-others:
    label: 'Umar, told a client was put over Mecca''s valley for knowing the book and the shares: ''God raises peoples by this book and lowers others'''
    cluster: theology
  three-whose-prayer-rises-not-a-span:
    label: 'Three whose prayer does not rise a span above their heads: one leading people who dislike him, a wife whose husband is angry overnight, two brothers cut off from each other'
    cluster: ethics
  only-the-son-of-abu-quhafa:
    label: 'Abu Bakr steps back: ''it was not for the son of Abu Quhafa to pray in front of the messenger of God'''
    cluster: sira
  clapping-for-women-tasbih-for-men:
    label: Whoever is troubled by something in prayer should say 'glory to God'; clapping is for women
    cluster: ritual
  abu-bakr-raises-hands-praising-god:
    label: Told to stay in place, Abu Bakr raises his hands and praises God for the order, then steps back
    cluster: sira
  lighten-for-weak-sick-old-needy:
    label: 'Who leads people should lighten: among them are the weak, the sick, the old (the young, the one with a need); alone pray as long as you wish'
    cluster: law
  some-of-you-drive-people-away:
    label: 'Never angrier in a sermon: ''some of you drive people away (munaffirūn)'''
    cluster: ethics
  brief-yet-complete-prayer:
    label: He made the prayer brief and complete (yūjiz wa-yukmil)
    cluster: ritual
  umar-lengthened-the-dawn-prayer:
    label: The prophet's and Abu Bakr's prayers were even; Umar lengthened the dawn prayer
    cluster: ritual
  hand-on-chest-then-between-shoulders:
    label: 'Uthman b. Abi al-As finds something in himself; the prophet seats him, puts his palm on his chest between his breasts, then between his shoulders: ''lead your people, and lighten'''
    cluster: sira
  led-with-al-saffat:
    label: He commanded lightness yet led us with al-Saffat
    cluster: ritual
  lightest-for-people-longest-alone:
    label: He was the lightest of people in prayer for others and the longest in prayer for himself
    cluster: ritual
  shortens-prayer-at-babys-crying:
    label: Hearing a baby cry he shortens the prayer, fearing the mother be distressed
    cluster: ritual
  fell-from-horse-grazed-right-side:
    label: He fell from a horse and his right side was grazed; he prayed sitting and they prayed behind him sitting
    cluster: sira
  imam-is-to-be-followed:
    label: '''The imam is appointed to be followed: when he says takbir say it, when he bows bow, ... when he prays sitting pray sitting all of you'''
    cluster: law
  like-persians-and-romans-standing-before-kings:
    label: '''You nearly did as Persia and Rome do: they stand before their kings who are seated'''
    cluster: polemic
  obey-your-imams-part-of-obeying-me:
    label: '''Obeying me is obeying God, and obeying your imams is obeying me: if they pray sitting, pray sitting'''
    cluster: law
  people-marvel-at-muawiyas-truth:
    label: 'Muawiya: ''if the commander prays sitting, pray sitting''; people marvelled at his truthfulness'
    cluster: law
  abu-bakr-follows-prophet-people-follow-abu-bakr:
    label: Seated beside Abu Bakr, the prophet leads; Abu Bakr prays standing following him, and the people follow Abu Bakr
    cluster: ritual
  washes-from-tub-three-times-faints:
    label: Asking 'have the people prayed?' he washes from a tub (mikhḍab), tries to rise and faints, three times
    cluster: sira
  carried-between-two-feet-trailing:
    label: He comes out between two men (al-Abbas and Ali) with his feet trailing on the ground
    cluster: sira
  no-back-bent-until-forehead-on-ground:
    label: None bent his back until the prophet put his forehead on the ground; then those behind him fell prostrate
    cluster: ritual
  i-see-you-in-front-and-behind:
    label: '''Do not precede me in bowing, prostration, standing or leaving; I see you in front of me and behind me'''
    cluster: miracle
  laugh-little-weep-much-saw-paradise-and-fire:
    label: '''Had you seen what I saw you would laugh little and weep much'' - ''I saw paradise and the fire'''
    cluster: eschatology
  i-have-grown-heavy:
    label: '''Do not race me in bowing and prostration: I have grown old/heavy (baddantu)'''
    cluster: sira
  head-turned-into-donkeys-head:
    label: 'Whoever raises his head before the imam: does he not fear God will make his head a donkey''s head, his form a donkey''s form?'
    cluster: eschatology
  left-out-a-verse-made-to-forget:
    label: He left out a verse in the dawn prayer; Ubayy asks 'was it abrogated or did you forget?' 'I was made to forget it'
    cluster: revelation
  why-did-you-not-remind-me:
    label: A man says 'you left out verse such-and-such'; 'why did you not remind me of it?'
    cluster: ritual
  let-the-mature-stand-next-to-me:
    label: '''Let those of mind and understanding stand next to me, then those after them; beware the clamour of the markets'''
    cluster: law
  ubayy-pulls-youth-from-first-row:
    label: Ubayy pulls a youth out of the front row and takes his place, citing the prophet's charge; then 'the people of the knot are ruined, by the Lord of the Kaaba'
    cluster: sira
  single-follower-moved-from-left-to-right:
    label: Standing at his left, the boy is taken by the head (forelock) and moved behind him to his right
    cluster: ritual
  two-followers-pushed-behind:
    label: Jabir at his right and Jabbar at his left; he takes both hands and pushes them behind him
    cluster: ritual
  ibn-masud-stands-between-two-and-claps-hands:
    label: 'Ibn Masud stands between Alqama and al-Aswad, strikes their hands off their knees and puts his palms together between his thighs (taṭbīq): ''so the prophet did'''
    cluster: ritual
  mat-black-with-use-sprinkled:
    label: At his grandmother Mulayka's meal he leads two rak'as on a mat blackened from long use, sprinkled with water; the orphan and Anas behind, the old woman behind them
    cluster: ritual
  increase-his-wealth-and-children:
    label: 'His mother asks a prayer for her little servant Anas; last of all: ''O God increase his wealth and his children and bless him in them'''
    cluster: sira
  boys-rows-behind-men:
    label: 'The men form rows and behind them the boys: ''thus is the prayer (of my community)'''
    cluster: law
  draw-lots-for-first-row:
    label: If people knew what is in the call and the first row and found no way but to draw lots for it, they would draw lots; they would come to the night and dawn prayers crawling
    cluster: ritual
  best-mens-row-first-womens-last:
    label: The best of men's rows is the first, the worst the last; the best of women's rows the last, the worst the first
    cluster: law
  god-delays-those-who-hang-back:
    label: A people keep hanging back until God puts them back
    cluster: eschatology
  women-lower-eyes-short-waist-wrappers:
    label: '''Women, when the men prostrate lower your eyes, lest you see the men''s nakedness through their narrow waist-wrappers'''
    cluster: law
  angel-prays-for-one-waiting-for-prayer:
    label: 'The man who sits in the mosque awaiting the next prayer: the angel says ''O God forgive him, have mercy on him'''
    cluster: angels
  walks-through-rows-touching-chests:
    label: 'He passed through the row from side to side, touching our chests and shoulders: ''do not differ, or your hearts will differ'''
    cluster: ritual
  forgiveness-three-for-first-row-once-for-second:
    label: He asked forgiveness for the front row three times and for the second once
    cluster: ritual
  straightening-rows-part-of-prayer:
    label: '''Straighten your rows: straightening the rows is part of establishing the prayer'''
    cluster: ritual
  i-see-you-behind-my-back:
    label: '''Set your rows and press close (tarāṣṣū): I see you from behind my back'''
    cluster: miracle
units:
- id: hadith-9-seven-limbs
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Seven limbs prostrate with the servant
  read:
  - Jāmiʿ 9:1343.1
  tags:
  - motif: seven-limbs-prostrate-with-the-servant
    refs:
    - Jāmiʿ 9:1343.1
    note: 'إذا سجد العبدُ سجد معه سبعةُ أطراف: وجهُه وكفاه وركبتاه وقدماه'
- id: hadith-9-forehead-and-nose
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Prostration on forehead and nose; the seven bones
  read:
  - Jāmiʿ 9:1343.2-1345.2
  tags:
  - motif: mud-on-forehead-and-nose-tip-after-prayer
    refs:
    - Jāmiʿ 9:1343.2
    note: رُئي على جَبْهتِه، وعلى أرْنَبيِه أثرُ طين
  - motif: nose-and-forehead-firmly-on-ground
    refs:
    - Jāmiʿ 9:1343.3
    note: إذا سجد أمكن أنفه وجبهته من الأرض
  - motif: seven-bones-forehead-with-hand-pointing-to-nose
    refs:
    - Jāmiʿ 9:1345.1
    note: 'أُمرتُ أن أسجد على سبعة أعظم: على الجبهة. وأشار بيده على أنفه'
  - motif: hands-prostrate-as-face-prostrates
    refs:
    - Jāmiʿ 9:1345.2
    note: إن اليدين تسجدان كما يسجد الوجه
- id: hadith-9-feet-upright-refuge
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Feet upright in the night prostration; 'refuge in you from you'; every human's devil
  read:
  - Jāmiʿ 9:1346.1-1346.2
  tags:
  - motif: feet-upright-soles-felt-in-dark
    refs:
    - Jāmiʿ 9:1346.1
    note: فوقعتْ يدي على بطْن قدميه وهو في المسجد (أي في السجود) وهما منصوبتان
  - motif: refuge-in-you-from-you
    refs:
    - Jāmiʿ 9:1346.1
    - Jāmiʿ 9:1346.2
    note: أعوذ برضاك من سخطك، وبمعافاتك من عقوبتك، وأعوذ بك منك
  - motif: heels-pressed-toes-toward-qibla
    refs:
    - Jāmiʿ 9:1346.2
    note: ساجدًا راصًّا عقبيه، مستقبلًا بأطراف أصابعه القبلة
  - motif: every-human-has-a-devil-mine-submitted
    refs:
    - Jāmiʿ 9:1346.2
    note: ما من آدمي إلا له شيطان ... وأنا، ولكني دعوتُ الله عليه فأسلم
- id: hadith-9-hands-in-prostration
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Hands near the ears, on the heels of the palms; fingers spread or joined
  read:
  - Jāmiʿ 9:1346.3-1347.3
  tags:
  - motif: hands-near-ears-in-prostration
    refs:
    - Jāmiʿ 9:1346.3
    note: حين سجد ويديه قريبًا من أذنيه
  - motif: prostrate-on-heels-of-palms
    refs:
    - Jāmiʿ 9:1347.1
    note: كان رسول الله ﷺ يسجد على أليتي الكفّ
  - motif: fingers-toward-qibla-limbs-spread
    refs:
    - Jāmiʿ 9:1347.2
    note: إذا ركع بسط ظهره، وإذا سجد وّجه أصابعه قبل القبلة، فتفاجَّ
  - motif: fingers-spread-in-bowing-joined-in-prostration
    refs:
    - Jāmiʿ 9:1347.3
    note: إذا ركع فرَّج أصابعه، وإذا سجد ضمَّ أصابعه
- id: hadith-9-resting-sitting
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The resting sitting before rising
  read:
  - Jāmiʿ 9:1348.1-1348.2
  tags:
  - motif: sit-upright-before-rising-from-odd-rakaa
    refs:
    - Jāmiʿ 9:1348.1
    note: فإذا كان في وترٍ من صلاته لم ينهض حتى يستوي قاعدًا
  - motif: every-bone-returns-to-its-place
    refs:
    - Jāmiʿ 9:1348.2
    note: ثم يثني رجله فيقعد عليها معتدلًا حتى يرجع، أو يقر كل عظم موضعه معتدلًا
- id: hadith-9-iqaa
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Squatting on the heels: sunna, and the devil''s heel-sitting forbidden; leaning on the left hand'
  read:
  - Jāmiʿ 9:1349.1-1351.2
  tags:
  - motif: squatting-on-heels-is-sunna-not-coarseness
    refs:
    - Jāmiʿ 9:1349.1
    note: 'في الإقعاء على القدمين؟ فقال: هي السنَّة، فقلنا له: إنا لنراه جفاءً بالرجُلِ'
  - motif: devils-heel-sitting-forbidden
    refs:
    - Jāmiʿ 9:1351.1
    note: وكان ينهى عن عُقْبةِ الشيطان
  - motif: leaning-on-left-hand-is-prayer-of-jews
    refs:
    - Jāmiʿ 9:1351.2
    note: 'نهى رجلًا وهو جالس معتمدًا على يده اليسرى في الصلاة، فقال: إنّها صلاة اليهود'
- id: hadith-9-rising-on-hands
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Rising leaning on the hands; praying only to demonstrate
  read:
  - Jāmiʿ 9:1352.1-1352.2
  tags:
  - motif: prays-to-show-how-prophet-prayed
    refs:
    - Jāmiʿ 9:1352.1
    note: إنِّي لأصَلِّي بكم وما أريد الصلاةَ، ولكن أريد أن أريكم كيف رأيتُ النبي ﷺ يُصَلِّي
  - motif: rise-leaning-on-ground-with-hands
    refs:
    - Jāmiʿ 9:1352.1
    - Jāmiʿ 9:1352.2
    note: وإذا رفع رأسه عن السجدة الثانية جلس، واعتمد على الأرض، ثم قام
- id: hadith-9-no-quran-in-sujud
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: No Quran in bowing or prostration; supplication in prostration; the good dream
  read:
  - Jāmiʿ 9:1354.1-1355.3
  tags:
  - motif: no-quran-in-bowing-or-prostration
    refs:
    - Jāmiʿ 9:1354.1
    - Jāmiʿ 9:1354.2
    - Jāmiʿ 9:1355.2
    note: ألا وإني نُهيتُ أن أقرأ القرآن راكعًا أو ساجدًا، فأما الركوع فعظموا فيه الربَّ ﷿، وأما السجودُ فاجتهدوا في الدعاء
  - motif: only-good-dream-left-of-prophecy
    refs:
    - Jāmiʿ 9:1354.1
    - Jāmiʿ 9:1355.2
    note: إنه لم يبق من مبشرات النبوة إلا الرؤيا الصالحة يراها المسلم. أو تُرَى له
  - motif: fire-spares-marks-of-prostration
    refs:
    - Jāmiʿ 9:1355.1
    note: تأكل النار ابن آدم إلَّا أثر السجود. حرَّم الله على النار أن تأكل أثر السجود
  - motif: nearest-to-lord-while-prostrate
    refs:
    - Jāmiʿ 9:1355.3
    note: أقرب ما يكون العبد من ربِّه وهو ساجد فأكثرِوا الدُّعاء
- id: hadith-9-much-prostration
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Much prostration: a degree raised and a sin removed; asking for paradise and intercession'
  read:
  - Jāmiʿ 9:1356.1-1358.1
  tags:
  - motif: each-prostration-raises-degree-removes-sin
    refs:
    - Jāmiʿ 9:1356.1
    - Jāmiʿ 9:1357.2
    - Jāmiʿ 9:1358.1
    note: فإنك لا تسجد لله سجدةً إلا رفعك الله بها درجةً، وحطَّ عنك بها خطيئةً
  - motif: asks-for-company-in-paradise
    refs:
    - Jāmiʿ 9:1356.2
    note: أسألك مرافقتك في الجنة
  - motif: help-me-with-much-prostration
    refs:
    - Jāmiʿ 9:1356.2
    - Jāmiʿ 9:1357.1
    note: فَأعِنِّي على نفسِك بكثرة السجود
  - motif: servant-asks-intercession-my-lord-guided-me
    refs:
    - Jāmiʿ 9:1357.1
    note: 'حاجتي أن تشفع لي يوم القيامة. قال: ومن دلك على هذا؟ " قال: ربّي'
  - motif: abu-dharr-weeps-three-times-in-jerusalem
    refs:
    - Jāmiʿ 9:1358.1
    note: دخلت بيت المقدس، فوجدت فيه رجلًا يُكثِر السجود ... ثمّ بكى ... أنا أبو ذرٍّ
  - motif: if-i-do-not-know-god-knows
    refs:
    - Jāmiʿ 9:1358.1
    note: إن أك لا أدري، فإنّ الله ﷿ يدري
- id: hadith-9-bowing-prostration-formulas-1
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'What is said in bowing and prostration: Aisha''s and Hudhayfa''s reports'
  read:
  - Jāmiʿ 9:1358.2-1360.2
  quran:
  - 110:1-3
  tags:
  - motif: glory-praise-forgive-formula-in-bowing
    refs:
    - Jāmiʿ 9:1358.2
    note: سبحانك اللهم ربنا وبحمدك، اللهم اغفر لي" يتأوَّلُ القرآن
  - motif: glory-to-you-no-god-but-you-in-bowing
    refs:
    - Jāmiʿ 9:1359.1
    note: فظننتُ أنه ذهب إلى بعض نسائه ... سبحانك وبحمدك لا إله إلا أنت
  - motif: refuge-in-you-from-you
    refs:
    - Jāmiʿ 9:1359.2
    note: وأعوذ بك منك لا أحصي ثناءً عليك أنت كما أثنيت على نفسك
  - motif: subbuh-quddus-lord-of-angels-and-spirit
    refs:
    - Jāmiʿ 9:1359.3
    note: سُبُّوحٌ قُدُّوس ربُّ الملائكة والروح
  - motif: glory-to-my-lord-great-and-most-high
    refs:
    - Jāmiʿ 9:1360.1
    note: 'سبحان ربي العظيم" وفي سجوده: "سبحان ربي الأعلى'
  - motif: pause-at-verse-of-mercy-and-punishment
    refs:
    - Jāmiʿ 9:1360.1
    note: وما مر بآية رحمة إِلَّا وقف عندها، فسأل، ولا بأية عذاب إِلَّا وقف عندها فتعوذ
  - motif: forgive-my-sin-small-and-great-first-and-last
    refs:
    - Jāmiʿ 9:1360.2
    note: اغفر لي ذنبي كله، دِقَّه وجِلَّه، وأوَّلَه وآخِرَه، وعلانيتَه وسِرُّه
- id: hadith-9-bowing-prostration-formulas-2
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'What is said in bowing and prostration: the face prostrates to its maker; the number of glorifications'
  read:
  - Jāmiʿ 9:1360.3-1361.5
  quran:
  - '23:14'
  tags:
  - motif: glory-to-my-lord-great-and-most-high
    refs:
    - Jāmiʿ 9:1361.3
    - Jāmiʿ 9:1361.5
    note: سبحان ربي العظيم" ثلاثًا، وفي سجوده "سبحان ربي الأعلى
  - motif: pause-at-verse-of-mercy-and-punishment
    refs:
    - Jāmiʿ 9:1360.4
    note: لا يمر بآية رحمةٍ إِلَّا وقف فسأل، ولا يمر بأية عذابٍ إِلَّا وقف فتعوذ
  - motif: face-prostrates-to-who-split-its-hearing
    refs:
    - Jāmiʿ 9:1360.3
    - Jāmiʿ 9:1361.1
    note: سجد وَجْهِي لِلذِي خلقَه، وصوَّره، وشقَّ سَمْعَه، وبصرَه، تبارك الله أحسنُ الخالقين
  - motif: best-of-creators
    refs:
    - Jāmiʿ 9:1360.3
    - Jāmiʿ 9:1361.1
    note: تبارك الله أحسنُ الخالقين
  - motif: hearing-sight-marrow-bone-sinew-humbled
    refs:
    - Jāmiʿ 9:1360.3
    - Jāmiʿ 9:1361.2
    note: خشع لك سَمعِي وبَصَرِيّ، ومُخِّي وعَظْمِي وعصبي
  - motif: glory-to-lord-of-might-and-dominion
    refs:
    - Jāmiʿ 9:1360.4
    note: سبحان ذي الجبروت والملكوت والكبرياء والعظمة
  - motif: bowing-as-long-as-standing-baqara-al-imran
    refs:
    - Jāmiʿ 9:1360.4
    note: فقام فقرأ سورة البقرة ... ثمّ ركع بقدر قيامه ... ثمّ سجد بقدر قيامه، ثمّ قال في سجوده مثل ذلك، ثمّ قام فقرأ بآل عمران
  - motif: glorification-three-times-in-bowing
    refs:
    - Jāmiʿ 9:1361.3
    - Jāmiʿ 9:1361.4
    - Jāmiʿ 9:1361.5
    note: سبحان الله وبحمده ثلاث مرات
- id: hadith-9-light-prayer
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Prostration prayer for light on all sides; the night ablution
  read:
  - Jāmiʿ 9:1363.1
  tags:
  - motif: untied-waterskin-ablution-between-two
    refs:
    - Jāmiʿ 9:1363.1
    note: فأتى القرية فحل شناقَها، ثمّ توضأ وضوءًا بين الوضوئين
  - motif: light-in-heart-hearing-sight-all-sides
    refs:
    - Jāmiʿ 9:1363.1
    note: اللَّهُمَّ اجعل في قلبي نورًا، واجعل في سمعي نورًا، واجعل في بصري نورًا
  - motif: sleeps-till-snores-bilal-wakes
    refs:
    - Jāmiʿ 9:1363.1
    note: ثمّ نام حتَّى نفخ، فأتاه بلال فأيقظه للصلاة
- id: hadith-9-between-prostrations
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Lingering and supplication between the prostrations; pillars nearly equal
  read:
  - Jāmiʿ 9:1364.1-1366.1
  tags:
  - motif: stands-so-long-they-say-he-forgot
    refs:
    - Jāmiʿ 9:1364.1
    note: 'قام حتَّى يقول القائل: قد نَسِيَ، وبين السجدتين حتَّى يقول القائل: قد نَسِيَ'
  - motif: lord-forgive-me-twice-between-prostrations
    refs:
    - Jāmiʿ 9:1364.2
    note: ربّ اغفر لي ربّ اغفر لي
  - motif: five-requests-between-prostrations
    refs:
    - Jāmiʿ 9:1365.1
    note: اللَّهُمَّ اغفر ليّ، وارحمنيّ، وعافنيّ، واهدِنيّ، وارزُقْنِي
  - motif: all-pillars-nearly-equal
    refs:
    - Jāmiʿ 9:1366.1
    note: وبين السجدتين قريبًا من السواء
- id: hadith-9-tashahhud-sitting
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Sitting for the tashahhud: hand signs, feet, the first and last sitting'
  read:
  - Jāmiʿ 9:1367.1-1371.1
  tags:
  - motif: fifty-three-hand-sign-index-pointed
    refs:
    - Jāmiʿ 9:1367.1
    note: وعقد ثلاثة وخمسين، وأشار بالسَّبابة
  - motif: left-foot-between-thigh-and-shin
    refs:
    - Jāmiʿ 9:1367.2
    note: جعل قدَمه اليُسرى بين فخذه وساقه، وفرش قدمه اليُمنى
