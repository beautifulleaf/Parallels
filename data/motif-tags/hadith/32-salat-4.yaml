  - motif: dawn-two-when-muezzin-falls-silent
    refs:
    - Jāmiʿ 9:1526.1
    - Jāmiʿ 9:1526.3
    - Jāmiʿ 9:1527.1
    - Jāmiʿ 9:1527.2
