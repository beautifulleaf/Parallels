  - motif: ibn-umar-ten-rakas-and-friday-at-home
    refs:
    - Jāmiʿ 9:1521.1
    note: كان يُصَلِّي قبل الظهر ركعتين، وبعدها ركعتين، وبعد المغرب ركعتين في بيته، وبعد العشاء ركعتين، وكان لا يُصَلِّي بعد الجُمعة حتى ينصرف فيركع ركعتين
