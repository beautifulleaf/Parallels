  tags:
  - motif: womans-prayer-better-the-further-inside
    refs:
    - Jāmiʿ 9:1511.1
    - Jāmiʿ 9:1511.2
    - Jāmiʿ 9:1512.1
    note: وصلاتها في مَخْدَعِها أفضل من صلاتها في بيتها ... وصلاتك في مسجد قومك خير لك من صلاتك في مسجدي ... خير مساجد النساء قعر بيوتهن
  - motif: mosque-built-in-darkest-corner-of-house
    refs:
    - Jāmiʿ 9:1511.2
    note: فأمرتْ فَبُنِيَ لها مسجد في أقصى شيء من بيتها وأظلَمِه، فكانت تُصلي فيه حتَّى لقيتِ الله ﷿
- id: hadith-9-friend-of-god-and-nawafil
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'God''s word: whoever is hostile to my friend; drawing near by supererogatory works until I am his hearing and sight'
  read:
  - Jāmiʿ 9:1513.1
  tags:
  - motif: whoever-harms-my-friend-war-declared
    refs:
    - Jāmiʿ 9:1513.1
    note: من عادَى لي وليًّا فقد آذنتُه بالحرب
  - motif: god-becomes-hearing-sight-hand-foot-of-beloved
    refs:
    - Jāmiʿ 9:1513.1
    note: وما يزال عبدي يتقرب إلي بالنوافل حتَّى أحِبَّه، فإذا أحببتُه كنت سَمْعَه الذي يسمع به، وبصرَه الذي يُبصر به، ويَده التي يبطِشُ بها، ورجلَه التي يمشِي بها
  - motif: obligatory-dearest-means-of-nearness
    refs:
    - Jāmiʿ 9:1513.1
    note: وما تقرب إليَّ عبدي بشيء أحبَّ إليَّ مما افترضتُ عليه
  - motif: god-hesitates-over-believers-soul
    refs:
    - Jāmiʿ 9:1513.1
    note: وما ترددتُّ عن شيء أنا فاعله ترددِي عن نفس المؤمن، يكره الموتَ، وأنا أكره مساءتَه
- id: hadith-9-two-rakas-dearer-to-the-dead
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'At a grave: ''two rak''as are dearer to this man than the rest of your world'''
  read:
  - Jāmiʿ 9:1514.1
  tags:
  - motif: two-rakas-dearer-to-the-dead-than-world
    refs:
    - Jāmiʿ 9:1514.1
    note: 'مرَّ بقبرٍ فقال: "من صاحب هذا القبر؟ " فقالوا: فلان. فقال: "ركعتان أحب إلى هذا من بقية دنياكم'
- id: hadith-9-voluntary-prayer-at-home
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Voluntary prayer belongs in the house: the mat-room, houses not graves, the living and the dead, al-Baqara, the house''s share'
  read:
  - Jāmiʿ 9:1514.2-1517.1
  tags:
  - motif: night-prayer-withheld-lest-it-be-prescribed
    refs:
    - Jāmiʿ 9:1514.2
    note: ما زال بكم صنيعُكم حتَّى ظننتُ أنه سيكتبُ عليكم
  - motif: people-pelt-the-door-with-pebbles
    refs:
    - Jāmiʿ 9:1514.2
    note: فرفعوا أصواتهم، وحصبوا البابَ، فخرج إليهم رسولُ الله ﷺ مغضبًا
  - motif: best-prayer-at-home-except-prescribed
    refs:
    - Jāmiʿ 9:1514.2
    - Jāmiʿ 9:1516.1
    - Jāmiʿ 9:1517.1
    note: فإن خيرَ صلاةِ المرءِ في بيته إلا الصلاةَ المكتوبةَ ... ما أقربه من المسجد! فلأن أصلي في بيتي أحبُّ إلي
  - motif: do-not-make-houses-graves
    refs:
    - Jāmiʿ 9:1514.3
    - Jāmiʿ 9:1515.2
    note: اجعلوا في بيوتكم من صلاتكم، ولا تتخذوها قبورا ... لا تجعلوا بيوتكم مقابر
  - motif: house-with-gods-remembrance-like-living
    refs:
    - Jāmiʿ 9:1515.1
    note: مثلُ البيتِ الذي يُذكرُ اللهُ فيه، والبيتِ الذي لا يُذكرُ الله فيه، مثلُ الحي والميت
  - motif: satan-flees-house-where-baqara-recited
    refs:
    - Jāmiʿ 9:1515.2
    note: إن الشيطان يَنْفِرُ من البيت الذي تُقرأ فيه سورةُ البقرة
  - motif: give-the-house-a-share-of-prayer
    refs:
    - Jāmiʿ 9:1515.3
    note: فليجعلْ لبيته نصيبًا من صلاته، فإن الله جاعل في بيته من صلاته خيرًا
  hints:
  - Houses where God is not remembered are 'graves' and like the dead, against m. Avot 3:3, a table at which no words of Torah are spoken is as if they ate of sacrifices of the dead
- id: hadith-9-twelve-rakas-and-regular-sunna
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The twelve rak'as a day and night for a house in paradise; Aisha and Ibn Umar list the regular voluntary prayers
  read:
  - Jāmiʿ 9:1518.1-1521.1
  tags:
  - motif: twelve-rakas-daily-house-in-paradise
    refs:
