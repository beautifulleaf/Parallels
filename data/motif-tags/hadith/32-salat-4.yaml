    - Jāmiʿ 9:1527.4
    - Jāmiʿ 9:1528.3
    note: 'يوشك أن يُصَلِّي أحدكم الصبح أربعًا؟ ... آلصبح أربعًا آلصبحَ أربعًا ... فجذب رسول الله ﷺ بثوبه فقال: "أتُصلي الصُّبح أربعًا'
  - motif: which-of-two-prayers-did-you-count
    refs:
    - Jāmiʿ 9:1528.1
    note: بأي الصلاتين اعتدت، بصلاتك وحدك، أم بصلاتك معنا
  - motif: no-prayer-but-obligatory-once-iqama-called
    refs:
    - Jāmiʿ 9:1528.2
    note: إذا أُقيمتِ الصلاة، فلا صلاة إلا المكتوبة
  - motif: two-prayers-together-rebuke
    refs:
    - Jāmiʿ 9:1529.1
    note: 'فرأى ناسًا يصلون ركعتين بالعجلة، فقال: "أصلاتان معا؟ " فنهى أن يُصلَّى في المسجد إذا أقيمت الصلاة'
  - motif: shoulder-nudged-why-not-before
    refs:
    - Jāmiʿ 9:1530.1
    note: 'فغمز النبي ﷺ منكبه وقال: "ألا كان هذا قبل هذا'
- id: hadith-9-dawn-sunna-made-up
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Missed dawn two: made up after sunrise, or after the obligatory prayer with the prophet silent'
  read:
  - Jāmiʿ 9:1530.2-1531.1
  tags:
  - motif: dawn-two-made-up-after-sunrise
    refs:
    - Jāmiʿ 9:1530.2
    note: نام عن ركعتي الفجر فقضاهما بعد ما طلعت الشمس
  - motif: dawn-two-after-obligatory-prophet-silent
    refs:
    - Jāmiʿ 9:1531.1
    note: 'صلاة الصبح ركعتان" فقال الرجل: إني لم أكن صليت الركعتين اللتين قبلهما، فصليتهما الآن. فسكت رسول الله ﷺ'
- id: hadith-9-lying-down-after-dawn-two
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: After the two of dawn he lay on his right side, or talked with Aisha if she was awake
  read:
  - Jāmiʿ 9:1534.1-1535.1
  tags:
  - motif: lies-on-right-side-after-dawn-two
    refs:
    - Jāmiʿ 9:1534.1
    - Jāmiʿ 9:1534.2
    - Jāmiʿ 9:1535.1
    note: إذا صلى ركعتي الفجر، اضطجع على شِقِّه الأيمن ... فإن كنت مستيقظة حدثني وإلا اضطجع حتى يؤذَّن بالصلاة
- id: hadith-9-noon-voluntary
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Four before and after noon forbid the flesh to the fire; four after the zenith when heaven's gates open
  read:
  - Jāmiʿ 9:1535.2-1536.2
  tags:
  - motif: four-before-and-after-noon-flesh-barred-from-fire
    refs:
    - Jāmiʿ 9:1535.2
    note: من صلى أربع ركعات قبل الظهر، وأربعًا بعدها حَرَّمَ الله لحمَه على النار
  - motif: never-leaves-four-before-noon-two-before-dawn
    refs:
    - Jāmiʿ 9:1536.1
    note: كان لا يدعُ أربعًا قبل الظهر، وركعتين قبل الغداة
  - motif: gates-of-heaven-open-at-zenith
    refs:
    - Jāmiʿ 9:1536.2
    note: إنها ساعة تُفتحُ فيها أبوابُ السماء، وأحب أن يصعدَ لي فيها عمل صالح
  hints:
  - An hour after noon when heaven's gates open and deeds ascend, against the rabbinic 'gates of prayer' and the afternoon (minḥa) hour of Elijah's answered prayer, 1 Kings 18:36 and b. Berakhot 6b
- id: hadith-9-afternoon-voluntary
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Four before the afternoon prayer: ''God have mercy on a man who prays four''; or two'
  read:
  - Jāmiʿ 9:1538.1-1539.2
  tags:
  - motif: mercy-on-who-prays-four-before-asr
    refs:
    - Jāmiʿ 9:1538.1
    note: رحم الله امرأً صلَّى قبل العصر أربعًا
  - motif: pairs-separated-by-greeting-on-angels-and-prophets
    refs:
    - Jāmiʿ 9:1539.1
    note: كان النبي ﷺ يُصلي قبل العصر أربع ركعات، يفصل بينهن بالتسليم على الملائكة المقربين
  - motif: two-before-asr
    refs:
    - Jāmiʿ 9:1539.2
    note: كان يُصلي قبل العصر ركعتين
- id: hadith-9-before-maghrib-and-between-calls
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Two before the sunset prayer: crowds at the pillars, Uqba''s ''business'', ''for whoever wishes'', between every two calls a prayer'
  read:
  - Jāmiʿ 9:1539.3-1540.3
  tags:
  - motif: crowd-at-pillars-stranger-thinks-prayer-done
    refs:
    - Jāmiʿ 9:1539.3
    note: فإذا أذَّن المؤذن لصلاة المغرب ابتدروا السواري، فيركعون ركعتين ركعتين، حتى إن الرجل الغريب ليدخلُ المسجد فيحسبُ أن الصلاة قد صُلِّيتْ
  - motif: used-to-do-it-business-stops-me
    refs:
    - Jāmiʿ 9:1539.4
    note: 'إنا كنا نفعله على عهد رسول الله ﷺ، قلت: فما يمنعك الآن؟ قال: الشُغل'
  - motif: for-whoever-wishes-lest-it-be-taken-as-sunna
    refs:
    - Jāmiʿ 9:1540.1
    - Jāmiʿ 9:1540.3
    note: 'صلوا قبل صلاة المغرب - قال في الثالثة - لمن شاء، كراهية أن يتخذها الناس سنة ... بين كل أذانين صلاة، بين كل أذانين صلاة" ثم قال في الثالثة: "لمن شاء'
  - motif: umar-beat-hands-for-prayer-after-asr
    refs:
    - Jāmiʿ 9:1540.2
    note: كان عمر يضرب الأيدي على صلاةٍ بعد العصر ... كان يرانا نصليهما فلم يأمرنا، ولم ينهنا
- id: hadith-9-between-maghrib-and-isha
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Hudhayfa's mother; the prophet prays from sunset until the night prayer
  read:
  - Jāmiʿ 9:1541.1
  tags:
  - motif: prayed-from-maghrib-till-isha
    refs:
    - Jāmiʿ 9:1541.1
    note: 'فهمَّتْ بي، فقلت: يا أمَّه دَعِينِي حتى أذهب إلى النبي ﷺ فلا أدعَه حتى يستغفر لي، ويستغفر لكِ ... فلما قضى الصلاة قام يُصَلِّي، فلم يزل يُصلي حتى صلى العشاء'
- id: hadith-9-deficit-made-up-from-voluntary
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: First reckoned is the prayer; what is lacking is completed from voluntary prayer
  read:
  - Jāmiʿ 9:1541.2
  tags:
  - motif: prayer-first-reckoned-deficit-made-up-from-voluntary
    refs:
    - Jāmiʿ 9:1541.2
    note: أول ما يحاسب به العبدُ يوم القيامة صلاتُه ... انظروا، هل تجدون لعبدي من تطوع؟ فأكملوا بها ما ضيّع من فريضته
- id: hadith-9-separating-prayer-from-prayer
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Not joining one prayer to another without speaking or moving; Umar: the People of the Book perished for want of a break'
  read:
  - Jāmiʿ 9:1544.1-1545.1
  tags:
  - motif: no-prayer-joined-to-prayer-without-speaking-or-leaving
    refs:
    - Jāmiʿ 9:1544.1
    note: إذا صلَّيتَ فلا تَصِلْها بصلاةٍ حتى تكلَّم أو تخرجَ. فإن رسولَ الله ﷺ أمرنا بذلك
  - motif: people-of-book-perished-no-break-between-prayers
    refs:
    - Jāmiʿ 9:1545.1
    note: 'اجلسْ، فإنما هلك أهل الكتاب أنه لم يكن لصلاتهم فصلٌ، فقال رسول الله ﷺ: "أحسنَ ابن الخطاب'
- id: hadith-9-forgetfulness-doubt
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Satan confuses the worshipper; who does not know how many he prayed builds on certainty and prostrates twice
  read:
  - Jāmiʿ 9:1548.1-1552.2
  tags:
  - motif: satan-confuses-count-of-rakas
    refs:
    - Jāmiʿ 9:1548.1
    - Jāmiʿ 9:1549.1
    note: إنّ أحدكم إذا قام يُصلي، جاءه الشيطان، فلَبَسَ عليه. حتى لا يدري كم صلَّى؟ فإذا وجد أحدكم فليسجد سجدتين، وهو جالس
  - motif: satan-flees-call-breaking-wind-returns-between-man-and-self
    refs:
    - Jāmiʿ 9:1549.1
    note: 'إذا نُوديَ بالصلاة أدبر الشيطانُ وله ضراطٌ حتى لا يسمعَ الأذانَ ... حتى يَخطِرَ بين المرءِ ونفسه، يقول: أذكر كذا وكذا - ما لم يكن يذكرُ'
  - motif: doubt-build-on-certainty-prostrations-spite-satan
    refs:
    - Jāmiʿ 9:1549.2
    - Jāmiʿ 9:1552.1
    - Jāmiʿ 9:1552.2
    note: فليطرح الشكَّ، وليبْن على ما استيقَ، ثم يسجدْ سَجْدتين قبل أن يُسلِّم. فإن كان صلى خمسًا شفعنَ له صلاتَه، وإن كان صلَّى إتمامًا لأربع كانتا ترغيمًا للشيطان
  - motif: beware-satan-toying-with-you-in-prayer
    refs:
    - Jāmiʿ 9:1551.1
    note: إيايَ، وأن يتلعَّبَ بكم الشيطانُ في صلاتكم، من صلَّى منكم فلم يدرِ أشَفَعَ أو أوْتَر، فليسجدْ سجدتين
- id: hadith-9-dhul-yadayn
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Dhu l-Yadayn: the prophet greets after two (or three) rak''as, completes, then prostrates twice after the greeting; the noon prayer prayed five'
  read:
  - Jāmiʿ 9:1553.1-1556.1
  tags:
  - motif: dhul-yadayn-asks-shortened-or-forgot
    refs:
    - Jāmiʿ 9:1553.1
    - Jāmiʿ 9:1555.1
    note: 'أقَصُرَتِ الصلاةُ أم نسيتَ يا رسول الله؟ فقال رسول الله ﷺ: "أصدق ذو اليدين؟ '
  - motif: khirbaq-long-armed-three-rakas
    refs:
    - Jāmiʿ 9:1554.1
    note: فقام إليه رجل يقال له الخِرباق، وكان في يديه طول ... وخرج غضبان يجرُّ رداءَه
  - motif: not-shortened-not-forgotten
    refs:
    - Jāmiʿ 9:1555.1
    note: 'ما قَصُرَتْ وما نسيتُ" قال: إذًا فَصليتَ ركعتين'
  - motif: noon-prayed-five-prostrations-after
    refs:
    - Jāmiʿ 9:1556.1
    note: 'صَلَّى الظهر خمسًا، فقيل له: أزيد في الصلاة؟ فقال: "ما ذاك؟ " قال: صلَّيتَ خمسًا. فسجد سجدتين بعد ما سلمَّ'
- id: hadith-9-prostration-before-greeting
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Ibn Buhayna: rising from the second rak''a without sitting, he prostrates twice before the greeting'
  read:
  - Jāmiʿ 9:1558.1
  tags:
  - motif: missed-first-sitting-prostrate-before-greeting
    refs:
    - Jāmiʿ 9:1558.1
    note: ثم قام فلم يجلس، فقام الناس معه. فلما قضى صلاته، ونظرنا تسليمه، كبَّر، ثم سجد سجدتين، وهو جالس قبل التسليم
- id: hadith-9-rising-from-two-without-sitting
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'If he stands fully from the second rak''a he goes on and prostrates; companions tell ''subhan allah'' and keep standing: ''the sunna is what I did'''
  read:
  - Jāmiʿ 9:1559.1-1561.1
  tags:
  - motif: stood-up-fully-go-on-not-yet-sit-back
    refs:
    - Jāmiʿ 9:1559.1
    note: فإن لم يَسْتَتِم قائمًا فليجلس، وليس عليه سجدتان، فإن استوى قائمًا فَلْيَمْضِ في صلاته، ولْيَسْجُدْ سجدتين وهو جالس
  - motif: congregation-says-subhan-allah-imam-stays-standing
    refs:
    - Jāmiʿ 9:1560.1
    - Jāmiʿ 9:1560.2
    - Jāmiʿ 9:1561.1
    note: إنه لم يخف عليَّ الذي أردتم، ولم يمنعني من الجلوس إلا الذي صنعت من السنة ... لكن السنة الذي صنعت
- id: hadith-9-talha-one-raka-forgotten
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: He greets with one rak'a left; a man (Talha) tells him; he has Bilal give the iqāma and prays the one
  read:
  - Jāmiʿ 9:1561.2
  tags:
  - motif: forgotten-raka-prayed-after-new-iqama
    refs:
    - Jāmiʿ 9:1561.2
    note: 'فرجع فدخل المسجد، وأمر بلالًا فأقام الصلاة، فصلَّى للناس ركعة ... فقالوا: هذا طلحة بن عبيد الله'
- id: hadith-9-three-forbidden-hours
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Three hours of no prayer or burial; the sun rises and sets between Satan's horns, unbelievers prostrate to it, hell is stoked at noon
  read:
  - Jāmiʿ 9:1563.1-1565.1
  tags:
  - motif: three-hours-no-prayer-no-burial
    refs:
    - Jāmiʿ 9:1563.1
    note: 'ثلاث ساعات كان رسولُ الله ﷺ ينهانا أن نصلي فيهن، أو نقبر فيهن موتانا: حين تطلعُ الشمسُ بازغة حتى ترتفع، وحين يقوم قائم الظهيرة حتى تميلَ الشمسُ، وحين تضيف الشمسُ للغروب حتى تغربَ'
  - motif: sun-between-satans-horns
    refs:
    - Jāmiʿ 9:1563.2
    - Jāmiʿ 9:1564.1
    note: فإنها تطلع حين تطلع بين قرني شيطان، وحينئذ يسجد لها الكفار ... فإنها تغربُ بين قرني شيطان، وحينئذ يسجد لها الكفار
  - motif: hell-stoked-at-noon
    refs:
    - Jāmiʿ 9:1563.2
    - Jāmiʿ 9:1564.1
    note: ثم أقْصِر عن الصلاة فإن حينئذ تُسْجرُ جَهنمُ ... فإنَّ تلك الساعة تُسْجَرُ فيها جَهَنَّمُ وتُفْتَحُ فيها أبْوابُها، حتى تَزِيغَ الشَّمْسُ عن حاجِبِكَ الأيْمَن
  - motif: prayer-witnessed-and-attended
    refs:
    - Jāmiʿ 9:1563.2
    - Jāmiʿ 9:1564.1
    note: فإن الصلاة مشهودة محضورة ... فالصلاةُ محَضُورةٌ مُتَقَبَّلَةٌ
  - motif: tell-me-what-god-taught-you-that-i-do-not-know
    refs:
    - Jāmiʿ 9:1563.2
    - Jāmiʿ 9:1564.1
    note: أخبرني عمَّا علمَّك الله وأجهلُه ... إني سائلكَ عن أمْر أنتَ به عالمٌ وأنا به جاهِلٌ
  - motif: no-prayer-at-noon-in-heat
    refs:
    - Jāmiʿ 9:1565.1
    note: 'وبنصف النهار. قال: في شدة الحر'
  hints:
  - Unbelievers prostrating to the sun at its rising, the hour when prayer is barred, against the men 'with their backs to the temple, bowing eastward to the sun', Ezekiel 8:16
- id: hadith-9-no-prayer-after-dawn-and-asr
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: No prayer after the dawn prayer till sunrise and after the afternoon prayer till sunset
  read:
  - Jāmiʿ 9:1566.1-1569.2
  tags:
  - motif: no-prayer-after-dawn-and-afternoon-prayers
    refs:
    - Jāmiʿ 9:1566.1
    - Jāmiʿ 9:1566.2
    - Jāmiʿ 9:1567.1
    - Jāmiʿ 9:1567.4
    - Jāmiʿ 9:1568.2
    - Jāmiʿ 9:1569.2
    note: نهى عن الصلاة بعد الصبح حتى تشرقَ الشمسُ، وبعد العصر حتى تغرُب ... لا صلاة بعد الصبح حتى ترتفع الشمسُ، ولا صلاة بعد العصر حتى تغيبَ الشمسُ
  - motif: prophet-never-seen-praying-after-asr
    refs:
    - Jāmiʿ 9:1567.2
    - Jāmiʿ 9:1568.1
    note: لقد صحبنا رسولَ الله ﷺ فما رأيناه يُصَلِّيها. ولقد نهى عنها ... فما رأيتُه صلى بعد العصر، ولا بعد الصبح قط
  - motif: asr-offered-to-earlier-peoples-who-lost-it
    refs:
    - Jāmiʿ 9:1567.3
    note: إن هذه الصلاة عُرضتْ على من كان قبلكم فضيَّعوها. فمن حافظ عليها كان له أجره مرتين. ولا صلاة بعدها حتى يطلع الشاهد" والشاهد النجم
  - motif: two-after-every-prayer-except-dawn-and-asr
    refs:
    - Jāmiʿ 9:1569.1
    note: كان رسول الله ﷺ يُصَلِّي على إثر كل صلاة مكتوبة ركعتين إلا الفجر والعصر
  hints:
  - The afternoon prayer 'offered to those before you, who lost it', against the rabbinic weight on the afternoon prayer (minḥa), b. Berakhot 6b 'one should always be careful with the minḥa prayer, for Elijah was answered only at minḥa' (1 Kings 18:36)
- id: hadith-9-not-at-sunrise-or-sunset
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Do not aim your prayer at sunrise or sunset; Aisha: Umar was mistaken; Bilal; Satan''s horn'
  read:
  - Jāmiʿ 9:1571.1-1573.2
  tags:
  - motif: do-not-aim-prayer-at-sunrise-sunset
    refs:
    - Jāmiʿ 9:1571.1
    - Jāmiʿ 9:1571.2
    - Jāmiʿ 9:1571.3
    note: لا يتحرَّى أحدكم فيصلي عند طلوع الشمس، ولا عند غروبها ... وَهِم عمر إنما نهى رسول الله ﷺ أن يُتحرَّى طلوعُ الشمس وغروبُها
  - motif: sun-between-satans-horns
    refs:
    - Jāmiʿ 9:1572.1
    - Jāmiʿ 9:1572.2
    - Jāmiʿ 9:1573.1
    - Jāmiʿ 9:1573.2
    note: فإنها تطلع بين قرنَي شيطان، وتغرب بين قرنَي شيطان
  - motif: pray-between-as-you-wish
    refs:
    - Jāmiʿ 9:1573.1
    note: وصلوا بين ذلك ما شئتُم
- id: hadith-9-two-after-asr
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'The two rak''as after the afternoon prayer: Aisha says he never left them; Umm Salama''s maid; the Abd al-Qays delegation'
  read:
  - Jāmiʿ 9:1574.1-1576.1
  tags:
  - motif: two-after-asr-never-left-at-aishas
    refs:
    - Jāmiʿ 9:1574.1
    - Jāmiʿ 9:1576.1
    note: ركعتان لم يكن رسول الله ﷺ يدعُهما سِرًّا ولا علانية، ركعتان قبل صلاة الصبح، وركعتان بعد العصر ... لم يدخُل بيتها إلا صلاهما
  - motif: missed-two-made-up-then-kept
    refs:
