  - motif: pairs-separated-by-greeting-on-angels-and-prophets
    refs:
    - Jāmiʿ 9:1521.2
    note: يفصِلُ بينَ كلِّ ركعتين بالتسليم على الملائكة المُقرَّبين والنَّبِيِّينَ، ومن تبعهم من المسلمين والمؤمنين
  - motif: hadith-worth-mosque-full-of-gold
    refs:
    - Jāmiʿ 9:1521.2
    note: ما أحبُّ أن لي بحديثك هذا ملْءَ مسْجِدِك هذا ذَهَبًا
- id: hadith-9-dawn-sunna-merit
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'The two rak''as of dawn: none kept so faithfully, better than the world and what is in it'
