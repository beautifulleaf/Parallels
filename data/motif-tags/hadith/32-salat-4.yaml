    note: ثم إنه شُغِل عنهما أو نسيهما فصلاهما بعد العصر، ثم أثبتهما. وكان إذا صَلَّى صلاةً أثبتها
  - motif: maid-sent-to-ask-stand-back-if-he-signals
    refs:
