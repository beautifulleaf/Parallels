    note: 'فأرسلتُ إليهِ الجاريةَ فقلت: قومي بجَنبهِ ... فإن أشارَ بيدِه فاستأخِري عنهُ ... وإنه أتاني ناسٌ من عبد القيس فشغلوني عن الركعتين اللتَين بعدَ الظهر، فهُما هاتانِ'
