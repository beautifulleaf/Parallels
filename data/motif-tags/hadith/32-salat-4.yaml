  tags:
  - motif: prayer-credited-tenth-to-half
    refs:
    - Jāmiʿ 9:1506.1
    note: إن الرجل لينصرفُ، وما كُتبَ إلا عُشْرُ صلاته، تُسْعُها، ثُمُنُها، سُبُعُها، سُدُسُها، خُمُسُها، رُبُعُها، ثُلُثُها، نِصْفُها
- id: hadith-9-women-to-the-mosque
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Women not to be kept from the mosques; Umar's jealous wife; houses better; going out unperfumed; perfume and incense
  read:
  - Jāmiʿ 9:1507.1-1510.1
  tags:
  - motif: do-not-keep-gods-handmaids-from-gods-mosques
    refs:
    - Jāmiʿ 9:1507.1
    - Jāmiʿ 9:1507.2
    - Jāmiʿ 9:1508.1
    - Jāmiʿ 9:1508.2
    - Jāmiʿ 9:1508.3
    - Jāmiʿ 9:1508.4
    note: إذا استأذنتِ امرأةُ أحدِكم إلى المسجد فلا يمنعها ... لا تمنعوا إماء الله مساجد الله
  - motif: jealous-husband-held-back-by-prophets-word
    refs:
    - Jāmiʿ 9:1507.2
    note: 'وقد تعلمين أن عمر يكره ذلك ويغار؟ قالت: وما يمنعه أن ينهاني؟ قال: يمنعه قول رسول الله ﷺ'
  - motif: women-go-out-unperfumed-houses-better
    refs:
    - Jāmiʿ 9:1508.1
    - Jāmiʿ 9:1508.2
    - Jāmiʿ 9:1508.3
    - Jāmiʿ 9:1508.4
    note: وبيوتهن خير لهن ... ولكن ليخرجْن وهُنَّ تفلاتٌ
  - motif: had-he-seen-women-now-he-would-forbid
    refs:
    - Jāmiʿ 9:1508.4
    note: 'قالت عائشة: ولو رأى حالهن اليومَ منعهن'
  - motif: no-perfume-or-incense-for-women-at-night-prayer
    refs:
    - Jāmiʿ 9:1509.1
    - Jāmiʿ 9:1509.2
    note: إذا شهدَتْ إحداكن العِشاءَ فلا تطيَّبْ تلك الليلة ... أيُّما امرْأةٍ أصابت بَخُورًا فلا تشهدْ معنا العِشاءَ الآخرةَ
  - motif: perfumed-woman-must-wash-as-from-janaba
    refs:
    - Jāmiʿ 9:1509.3
    note: أيما امرأة تطيبتْ، ثم خرجتْ إلى المسجد، لم تُقبلَ لها صلاةٌ حتَّى تغتسلَ غُسْلَها من الجنابة
  - motif: perfumed-woman-passing-men-is-such-and-such
    refs:
    - Jāmiʿ 9:1510.1
    note: إذا استعطرتِ المرأة فمرتْ على القوم ليجدوا ريحَها فهي كذا وكذا" قال قولًا شديدًا
  hints:
  - The perfumed woman barred from prayer and told to wash as from major impurity, against Isaiah 3:16-24, the daughters of Zion whose perfume (bōśem) is turned to rot
- id: hadith-9-woman-prayer-innermost-room
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'A woman''s prayer: the inner room better than the chamber, the closet better still; Umm Humayd''s mosque in the darkest corner'
  read:
