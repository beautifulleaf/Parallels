  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'What he recited in the two rak''as of dawn: Q 2:136 and 3:52/64, or al-Kafirun and al-Ikhlas; ''a servant who knew his Lord'''
  read:
  - Jāmiʿ 9:1524.1-1525.2
  quran:
  - 2:136
  - '3:52'
  - 3:64
  - 3:84
  - '3:53'
  - 2:119
  - 109:1-6
  - 112:1-4
  tags:
  - motif: dawn-two-with-qulu-amanna-and-ahl-al-kitab-verse
    refs:
    - Jāmiʿ 9:1524.1
    - Jāmiʿ 9:1524.2
    note: '﴿قُولُوا آمَنَّا بِاللَّهِ وَمَا أُنْزِلَ إِلَيْنَا﴾ [البقرة: ١٣٦] وفي الآخرة منهما: ﴿آمَنَّا بِاللَّهِ وَاشْهَدْ بِأَنَّا مُسْلِمُونَ﴾'
  - motif: kafirun-and-ikhlas-in-two-rakas-of-dawn
    refs:
    - Jāmiʿ 9:1525.1
    - Jāmiʿ 9:1525.2
    note: 'رمَقْتُ النبي ﷺ شهرًا، فكان يقرأ في الركعتين قبل الفجر: ﴿قُلْ يَاأَيُّهَا الْكَافِرُونَ﴾ و ﴿قُلْ هُوَ اللَّهُ أَحَدٌ﴾'
  - motif: servant-who-knew-his-lord-believed-in-his-lord
    refs:
    - Jāmiʿ 9:1525.2
