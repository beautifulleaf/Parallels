  tags:
  - motif: women-fewest-in-paradise
    refs:
    - Jāmiʿ 67:8630.2
    note: إن أقل ساكني الجنة النساء ... كان لمطرف بن عبد اللَّه امرأتان
  - motif: women-in-paradise-like-red-legged-crow-among-crows
    refs:
    - Jāmiʿ 67:8630.3
