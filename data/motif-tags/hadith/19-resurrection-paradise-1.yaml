  - motif: paradise-door-leaves-apart-as-mecca-to-hajar
    refs:
    - Jāmiʿ 66:8545.1
    note: إن ما بين المصراعين من مصاريع الجنة لكما بين مكة وهجر أو كما بين مكة وبصرى
  - motif: prophet-hopes-most-followers-on-judgment-day
    refs:
    - Jāmiʿ 66:8546.1
    note: أنا أول الناس يشفع في الجنة وأنا أكثر الأنبياء تبعا ... أول من يقرع باب الجنة
  - motif: prophet-believed-by-a-single-man
    refs:
    - Jāmiʿ 66:8546.1
    note: وإن من الأنبياء نبيا ما يصدقه من أمته إلا رجل واحد
