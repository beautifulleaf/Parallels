  - motif: prophet-bites-foreleg-before-intercession-hadith
    refs:
    - Jāmiʿ 66:8545.1
    note: أتي رسول اللَّه ﷺ يوما بلحم فرفع إليه الذراع وكانت تعجبه فنهس منها نهسة
  - motif: right-gate-for-those-without-reckoning
    refs:
