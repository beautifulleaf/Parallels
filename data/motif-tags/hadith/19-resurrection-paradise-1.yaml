# Hadith chunk 19: al-Jāmiʿ al-Kāmil book 66 (the Resurrection and its terrors, pp. 8526-8578) and
# book 67 (paradise and hell and their people, pp. 8579-8645). Read in full from the Arabic.
# Bab-head verses are linked to the hadith of their bab; verses quoted or named in a matn are added.
new_motifs:
  # ---- the Hour, the blasts, the raising
  friday-blast-and-swoon-blessings-shown-to-prophet: {label: "Friday holds the blast and the swoon; increase blessings on the prophet that day, for they are shown to him", cluster: ritual}
  earth-forbidden-to-consume-prophets-bodies: {label: "Asked how blessings reach him when he has crumbled: God forbade the earth the bodies of the prophets", cluster: eschatology}
  seven-years-without-enmity-after-jesus: {label: "After Jesus kills the Dajjal people live seven years with no enmity between any two", cluster: eschatology}
  worst-left-light-as-birds-minds-of-beasts-told-to-worship-idols: {label: "After the believers are taken, the worst remain with the lightness of birds and the minds of beasts of prey; Satan appears and bids them worship idols while their provision flows", cluster: eschatology}
  hearer-of-trumpet-tilts-neck: {label: "Whoever hears the trumpet inclines one side of his neck and raises the other (asgha litan wa-rafa'a litan)", cluster: eschatology}
  raised-while-sky-drizzles: {label: "People are raised on resurrection day while the sky drizzles on them (tatishshu)", cluster: eschatology}
  ansari-slaps-jew-over-oath-moses-chosen: {label: "A Jew selling goods swears 'by him who chose Moses over mankind'; an Ansari slaps him; the Jew pleads his protected status", cluster: sira}
  each-raised-on-state-he-died-in: {label: "Every servant is raised on what he died upon", cluster: eschatology}
  punishment-strikes-all-then-raised-by-deeds: {label: "When God sends punishment on a people it strikes all among them; then they are raised according to their deeds", cluster: eschatology}
  army-against-the-house-swallowed-at-bayda: {label: "An army marching on a Qurayshi refugee at the House is swallowed at al-Bayda, the willing, the compelled and the wayfarer together, each raised on his intention", cluster: eschatology}
  muhrim-killed-by-camel-raised-saying-talbiya: {label: "A pilgrim thrown by his mount at Arafa: wash him with water and lote, shroud him in his two cloths, no perfume, head uncovered - he will be raised saying the talbiya", cluster: ritual}
  wound-in-gods-path-gushes-blood-smells-of-musk: {label: "One wounded in God's path comes on resurrection day with the wound gushing: the colour is blood, the scent musk", cluster: eschatology}
  gathered-buhm-with-nothing-paid-in-good-and-bad-deeds: {label: "Gathered naked and 'buhm' - having nothing; then how are claims settled? 'With good and bad deeds'", cluster: eschatology}
  god-calls-in-voice-heard-far-as-near-i-am-king-and-requiter: {label: "God calls in a voice heard by the far as by the near: 'I am the King, I am the Requiter (al-dayyan)'", cluster: eschatology}
  no-one-enters-paradise-or-fire-with-a-claim-unsettled-even-a-slap: {label: "None of hell's people enters hell, and none of paradise's people enters paradise, while another holds a right against him - until I exact it, even a slap", cluster: eschatology}
  dead-raised-in-clothes-he-died-in: {label: "The dead man is raised in the clothes he dies in; the narrator dresses in new clothes on his deathbed", cluster: eschatology}
  # ---- the standing: sweat, shade, God's grasp
  sweat-sinks-seventy-cubits-into-earth: {label: "People sweat until their sweat goes seventy cubits into the earth and bridles them to their ears", cluster: eschatology}
  mile-is-distance-or-kohl-stick: {label: "The sun brought within a 'mile' of creatures; the narrator does not know whether the land-mile or the kohl stick (mil) is meant", cluster: eschatology}
  skulls-boil-like-pots-in-sun-of-resurrection: {label: "The sun's heat increased so that skulls boil as pots boil", cluster: eschatology}
  unbeliever-in-sweat-begs-relief-even-to-fire: {label: "Bridled by sweat the unbeliever says 'Relieve me, even into the fire'", cluster: eschatology}
  those-loving-for-gods-majesty-shaded-under-throne: {label: "God calls 'Where are those who loved one another for my majesty? Today I shade them in my shade' - in the shade of the Throne", cluster: eschatology}
  heavens-in-right-hand-earths-in-left: {label: "God rolls up the heavens and takes them in his right hand, rolls up the earths in his left: 'I am the King; where are the tyrants, where the proud?'", cluster: theology}
  forty-years-gazing-skyward-awaiting-judgment: {label: "First and last gathered forty years, standing, eyes fixed on the sky, awaiting the judgment", cluster: eschatology}
  long-day-eased-for-believer-like-sun-setting: {label: "The standing lasts half a day of fifty thousand years; for believers it passes like the sun dipping to set", cluster: eschatology}
  # ---- intercession
  god-angry-today-as-never-before-or-after: {label: "Each prophet says 'my Lord is angry today as he never was before nor will be after'", cluster: eschatology}
  prophet-takes-ring-of-paradise-door: {label: "The prophet walks until he takes hold of the ring of the door; that day God raises him to the praised station", cluster: eschatology}
  prostration-then-raise-your-head-ask-and-be-given: {label: "He falls prostrate before his Lord, is inspired with praises none had before; 'raise your head, ask and be given, intercede and be heard'; a limit is set for him each time", cluster: eschatology}
  prophet-bites-foreleg-before-intercession-hadith: {label: "Brought meat, the foreleg he liked is raised to him; he bites it and begins 'I am the master of people on resurrection day'", cluster: sira}
  right-gate-for-those-without-reckoning: {label: "Those of his community with no reckoning enter by the right-hand gate of paradise, sharing the other gates with the rest", cluster: eschatology}
  paradise-door-leaves-apart-as-mecca-to-hajar: {label: "Between two leaves of a gate of paradise is as between Mecca and Hajar, or Mecca and Busra", cluster: eschatology}
  prophet-believed-by-a-single-man: {label: "Among the prophets is one whom only a single man of his people believed", cluster: prophecy}
  brought-out-of-fire-like-small-cucumbers: {label: "Those brought out of the fire by intercession are like tha'arir - explained as small cucumbers (daghabis)", cluster: eschatology}
  believers-retrieve-brothers-by-dinar-half-dinar-atom: {label: "Believers plead for brothers who fasted, prayed and made pilgrimage; told to bring out whom they know, then any with a dinar's, a half-dinar's, an atom's weight of good", cluster: eschatology}
  faces-forbidden-to-the-fire: {label: "Their faces (suwar) are forbidden to the fire, so the believers know them", cluster: eschatology}
  most-merciful-takes-handful-of-never-good-from-fire: {label: "Angels, prophets and believers have interceded; the Most Merciful remains and takes a handful from the fire of people who never did good", cluster: eschatology}
  people-dashed-on-bridge-like-moths-into-fire: {label: "The two sides of the bridge dash people as moths dash into fire", cluster: eschatology}
  angels-prophets-martyrs-intercede-in-rounds: {label: "Angels, prophets and martyrs are permitted to intercede and bring out, three or four rounds, any with an atom's weight of faith", cluster: eschatology}
  # ---- the reckoning
  last-nation-first-reckoned-unlettered-called: {label: "'We are the last of nations and the first reckoned': it is called 'Where is the unlettered nation and its prophet?'", cluster: eschatology}
  narrator-faints-repeatedly-before-telling: {label: "Asked for a hadith he heard alone with the prophet, Abu Hurayra begins and faints (nashagha) four times before he can tell it", cluster: sira}
  three-first-fuel-of-the-fire: {label: "Those three - the reciter, the rich man, the fighter - are the first of God's creatures by whom the fire is lit", cluster: eschatology}
  prayer-first-reckoned-deficit-made-up-from-voluntary: {label: "First reckoned is a servant's prayer; if incomplete God bids the angels look for voluntary prayer to complete the obligatory, then other deeds likewise", cluster: ritual}
  blood-first-judged-between-people: {label: "The first matter judged between people on resurrection day is blood", cluster: eschatology}
  first-bliss-asked-healthy-body-and-cool-water: {label: "The first bliss a servant is asked about: 'Did we not make your body healthy and give you cool water to drink?'", cluster: eschatology}
  feet-stay-until-asked-of-life-knowledge-wealth-body: {label: "A servant's feet do not move until asked of his life and how spent, his knowledge and what he did, his wealth whence and where, his body how worn", cluster: eschatology}
  endure-medinas-hardship-prophet-witness-or-intercessor: {label: "None endures Medina's hardship (la'wa') and dies there but the prophet is his witness or intercessor on resurrection day", cluster: sira}
  muezzin-forgiven-reach-of-voice-twenty-five-prayers: {label: "The muezzin is forgiven the reach of his voice, every wet and dry thing witnesses for him; one present at the prayer is written twenty-five prayers", cluster: ritual}
  black-stone-raised-with-eyes-and-tongue-to-witness: {label: "God will raise the Black Stone with two eyes that see and a tongue that speaks, witnessing for whoever touched it rightly", cluster: ritual}
  unbelievers-cried-out-before-all-creation: {label: "Unbelievers and hypocrites are called out before all creatures: 'These are they who lied against God'", cluster: eschatology}
  night-worshippers-who-violate-limits-in-private: {label: "People who keep night vigils like you but, when alone with God's forbidden things, violate them: their Tihama-mountains of white deeds become scattered dust", cluster: ethics}
  unjust-blow-retaliated-at-resurrection: {label: "Whoever strikes a blow unjustly is retaliated upon on resurrection day", cluster: eschatology}
  hornless-ewe-avenged-on-horned: {label: "Rights are paid so fully that the hornless ewe is avenged on the horned one (and the ant on the ant)", cluster: eschatology}
  # ---- the scale
  two-phrases-light-on-tongue-heavy-in-scale: {label: "Two phrases light on the tongue, heavy in the scale, beloved of the Merciful: subhan allah wa-bi-hamdihi, subhan allah al-'azim", cluster: ritual}
  card-of-shahada-outweighs-ninety-nine-scrolls: {label: "Ninety-nine scrolls of a man's sins, each as far as the eye reaches, laid in one pan; a card with the testimony in the other - the scrolls fly up", cluster: eschatology}
  thin-shins-heavier-in-scale-than-uhud: {label: "People laugh at Ibn Masud's thin shins as the wind topples him gathering arak twigs; they weigh more in the scale than Uhud", cluster: eschatology}
  # ---- the pool
  pool-a-months-journey-cups-like-stars: {label: "The prophet's pool is a month's journey, its sides equal, water whiter than milk, scent finer than musk, cups as many as the stars; who drinks never thirsts", cluster: eschatology}
  pool-fed-by-two-spouts-from-paradise-amman-to-ayla: {label: "Two spouts from paradise pour into the pool; its breadth equals its length, from Amman to Ayla", cluster: eschatology}
  drives-men-from-pool-like-stray-camels: {label: "He will drive men from his pool as stray camels are driven from a trough", cluster: eschatology}
  community-known-by-white-blazes-of-ablution: {label: "His community comes with white blazes on brow and limbs from ablution, a mark no other nation has", cluster: ritual}
  prophet-forerunner-at-the-pool: {label: "'I am your forerunner (farat) at the pool'", cluster: eschatology}
  # ---- the bridge and the long accounts
  bridge-slippery-with-hooks-and-sadan-thorns: {label: "The bridge over hell is slippery, with hooks, grapnels and thorns like the sa'dan of Najd", cluster: eschatology}
  crossing-bridge-by-speed-of-deeds: {label: "Believers cross like an eye's blink, lightning, wind, birds, fine horses and camels, men running, then crawling - unharmed, scratched, or cast into hell", cluster: eschatology}
  messengers-cry-grant-safety-on-bridge: {label: "The cry of the messengers that day on the bridge: 'O God, keep safe, keep safe' (sallim sallim)", cluster: eschatology}
  trust-and-kinship-stand-at-sides-of-bridge: {label: "Trust (amana) and kinship (rahim) are sent to stand at the two sides of the bridge", cluster: eschatology}
  depth-of-hell-seventy-autumns: {label: "The bottom of hell is seventy autumns deep", cluster: eschatology}
  last-man-out-stumbles-and-is-scorched: {label: "The last to enter paradise walks, stumbles and is scorched by the fire; past it he turns and says 'Blessed is he who saved me from you'", cluster: eschatology}
  light-loaded-cross-the-slippery-road-safer: {label: "Before the bridge of hell is a slippery road; to cross it with light loads is likelier to save than to come laden", cluster: ethics}
  each-community-follows-what-it-worshipped: {label: "A caller bids each people follow what it worshipped; idol-worshippers fall into the fire; each is shown the likeness of its object", cluster: eschatology}
  jews-and-christians-thirsty-led-to-fire-like-mirage: {label: "Jews (Uzayr) and Christians (the Messiah) told they lied, say 'we thirst', are pointed to water and driven to a fire like a mirage whose parts crush one another", cluster: eschatology}
  god-comes-in-unknown-form-then-known-form: {label: "God comes to the remaining community in a form they do not know; they seek refuge from him; then in the form they know, and they follow him", cluster: theology}
  freed-of-god-with-seals-on-necks: {label: "Those brought out without any deed come out like pearls with seals on their necks; paradise's people call them God's freedmen ('utaqa' allah)", cluster: eschatology}
  bridge-thinner-than-hair-sharper-than-sword: {label: "The bridge is finer than a hair and sharper than a sword (Abu Said's report)", cluster: eschatology}
  followers-of-sun-moon-and-tawaghit: {label: "Who worshipped the sun follows the sun, the moon the moon, the tawaghit the tawaghit; this community remains with its hypocrites", cluster: eschatology}
  fire-spares-marks-of-prostration: {label: "The fire eats all of a man but the marks of prostration; God forbade it to eat them; by these the angels know whom to bring out", cluster: eschatology}
  last-man-asks-face-turned-from-fire-breaks-promises: {label: "The last man asks his face be turned from the fire whose smell poisons him, swears to ask nothing more, then asks to be brought to the gate, then inside: 'Woe to you, son of Adam, how faithless you are!'", cluster: eschatology}
  god-laughs-at-last-man-and-lets-him-in: {label: "The last man asks until God laughs at him; when God laughs he lets him in; 'Do you mock me, and you the Lord?'", cluster: theology}
  wish-and-the-like-of-it-or-ten-times: {label: "Told to wish until wishes run out and prompted by God, he is given 'that and its like' - or 'ten times it' (Abu Said against Abu Hurayra)", cluster: eschatology}
  cross-images-fire-shown-to-their-worshippers: {label: "The man of the cross is shown his cross, the man of images his images, the man of fire his fire, and they follow them", cluster: eschatology}
  paradise-folk-look-fearful-hell-folk-hopeful: {label: "Called before death is slaughtered, paradise's people look out afraid and hell's people hopeful of intercession", cluster: eschatology}
  light-given-by-deeds-last-on-big-toe: {label: "Light is given by deeds - like a great mountain, like a palm, down to the last whose light is on his big toe, lit and out by turns", cluster: eschatology}
  lords-track-through-fire-like-swords-edge: {label: "The Lord goes before them through the fire, leaving a track like a sword's edge, slippery; they cross by their light", cluster: eschatology}
  last-man-washes-in-pool-at-paradise-gate: {label: "The last saved is led to a pool at the gate of paradise, bathes, and paradise's scent and colours return to him", cluster: eschatology}
  man-prostrates-to-palace-thinking-it-his-lord: {label: "Seeing a palace of pearl (or a light) the last man falls prostrate: 'My Lord appeared to me' - 'It is only one of your dwellings'", cluster: eschatology}
  steward-with-thousand-stewards-not-an-angel: {label: "He moves to prostrate to a man; 'I am a steward (qahraman) of yours, with a thousand stewards under me like me'", cluster: eschatology}
  houri-seventy-robes-marrow-seen-liver-a-mirror: {label: "The least houri wears seventy robes, her shin-marrow seen through them; her liver his mirror and his hers; each turning away, the other grows seventy-fold in his eye", cluster: eschatology}
  like-the-world-from-creation-to-end-and-ten-times: {label: "God offers the lowest man the like of the world from its creation to its ending and ten times more; his realm a hundred years' journey his sight crosses", cluster: eschatology}
  kab-hells-sigh-every-angel-and-prophet-kneels: {label: "Ka'b: hell gives a sigh on resurrection day at which every near angel and sent prophet falls to his knees; Abraham says 'my self, my self'", cluster: eschatology}
  kab-hidden-abode-no-eye-has-seen: {label: "Ka'b: God made an abode, filled it, sealed it, and none of creation has seen it, not Gabriel; the people of 'Illiyyun dwell there", cluster: eschatology}
  # ---- paradise: gates and buildings
  who-fears-sets-out-by-night-gods-merchandise-costly: {label: "Who fears sets out by night, and who sets out by night reaches the halt; God's merchandise is costly - it is paradise", cluster: ethics}
  where-is-fire-as-where-is-day-under-night: {label: "Asked where hell is if paradise is as wide as heaven and earth: 'When night covers everything, where is the day put?'", cluster: theology}
  two-rakas-with-heart-and-face-earn-paradise: {label: "Who performs ablution well and prays two rak'as turned to them with heart and face is owed paradise", cluster: ritual}
  three-children-dead-meet-parent-at-eight-gates: {label: "A Muslim who loses three children before puberty is met by them at the eight gates, entering by whichever he wishes", cluster: eschatology}
  spender-of-pairs-called-by-every-gatekeeper: {label: "Who spends a pair of anything in God's path is called by the keepers of every gate - 'So-and-so, come!'; Abu Bakr hopes to be called from all", cluster: ritual}
  gates-open-monday-thursday-except-two-at-enmity: {label: "Paradise's gates open on Monday and Thursday and all who associate nothing are forgiven, except two at enmity: 'Postpone these two until they reconcile' (thrice)", cluster: ritual}
  gate-leaves-forty-years-apart-yet-crowded: {label: "Between two leaves of a gate is forty years' journey, yet a day will come when it is jammed with the crowd", cluster: eschatology}
  stone-falls-seventy-years-in-hell-finds-no-bottom: {label: "A stone thrown from hell's rim falls seventy years without reaching the bottom, and hell will be filled", cluster: eschatology}
  seventh-of-seven-eating-tree-leaves: {label: "Utba b. Ghazwan: 'I was the seventh of seven with the prophet with no food but tree leaves until our cheeks were sore'", cluster: sira}
  you-complete-seventy-nations-the-last-and-noblest: {label: "'You complete seventy nations; you are the last and the noblest of them to God'", cluster: eschatology}
  see-through-chamber-for-soft-speech-food-fasting-night-prayer: {label: "A chamber in paradise whose outside is seen from inside and inside from outside, for who speaks gently, feeds, fasts often and prays while people sleep", cluster: eschatology}
  tent-of-hollow-pearl-sixty-miles: {label: "In paradise a tent of one hollow pearl sixty miles wide; in each corner a family that does not see the others", cluster: eschatology}
  rivers-gush-from-eden-then-divide: {label: "These rivers gush from the garden of Eden, then split into rivers", cluster: eschatology}
  soil-of-paradise-white-darmak-pure-musk: {label: "The soil of paradise is a white fine flour (darmaka), pure musk; to the Jews' 'bread' he answers 'the bread is of darmak'", cluster: eschatology}
  jews-ask-number-of-hells-keepers-fingers-ten-and-nine: {label: "Jews ask how many are hell's keepers; the prophet shows his hands, ten and then nine; he asks them paradise's soil and they say 'bread'", cluster: sira}
  killer-of-protected-person-never-smells-paradise: {label: "Who kills a person under covenant (mu'ahad) will not smell paradise's scent", cluster: law}
  scent-of-paradise-from-forty-seventy-hundred-years: {label: "Paradise's scent is found from a distance of forty, seventy or a hundred years", cluster: eschatology}
  claimant-to-another-father-denied-scent-of-paradise: {label: "Who claims descent from other than his father will not smell paradise", cluster: law}
  in-paradise-clothes-never-wear-youth-never-fades: {label: "Who enters paradise enjoys and never despairs, lives and never dies; his clothes do not wear out nor his youth fade", cluster: eschatology}
  rumaysa-seen-in-paradise: {label: "In paradise he sees al-Rumaysa, wife of Abu Talha, and hears Bilal's footsteps", cluster: sira}
  wasila-a-station-for-one-servant: {label: "Ask God for me al-Wasila, a station in paradise fitting only one of God's servants; whoever asks it for me, intercession is due him", cluster: ritual}
  woman-of-paradise-looking-down-would-light-earth: {label: "Were a woman of paradise to look down on earth she would light and fill with scent all between; her head-veil (nasif) is better than the world", cluster: eschatology}
  thorns-of-lote-and-acacia-become-fruits-of-many-colours: {label: "Bedouins object the lote and acacia have thorns; God strips them and puts a fruit for each thorn - seventy-two or seventy kinds of food, no colour like another", cluster: eschatology}
  tuba-tree-like-walnut-of-syria: {label: "Tuba, a tree matching al-Firdaws, like the Syrian walnut on one trunk spreading at the top; a young camel would die of age before circling its root", cluster: eschatology}
  grape-cluster-a-crows-month-grape-feeds-a-household: {label: "A grape cluster of paradise is a month's flight for a piebald crow; one grape like a waterskin from a great he-goat feeds a household and the clan", cluster: eschatology}
  fire-shown-between-prophet-and-ranks-saw-shadows: {label: "The fire shown between him and the rows until he saw his shadow and theirs; told 'leave them, they submitted, emigrated and fought as you did'", cluster: sira}
  balam-and-nun-ox-and-fish-liver-lobe-feeds-seventy-thousand: {label: "A Jew names the relish of paradise's guests 'Balam and Nun' - an ox and a fish, from the lobe of whose livers seventy thousand eat", cluster: eschatology}
  paradise-birds-with-necks-like-camels: {label: "Birds by al-Kawthar have necks like slaughter-camels'; 'those who eat them are finer'", cluster: eschatology}
  four-seas-water-honey-milk-wine-then-rivers: {label: "In paradise are a sea of water, a sea of honey, a sea of milk, a sea of wine; the rivers then split from them", cluster: eschatology}
  rivers-of-paradise-from-hills-of-musk: {label: "Paradise's rivers come out from hills (or under mountains) of musk", cluster: eschatology}
  children-of-believers-playing-between-two-rivers: {label: "In a dream-journey he sees boys playing between two rivers: the offspring of believers", cluster: eschatology}
  abraham-moses-jesus-drinking-wine-awaiting-him: {label: "On a height three drink wine: Abraham, Moses and Jesus, waiting for him", cluster: prophecy}
  sayhan-jayhan-euphrates-nile-from-paradise: {label: "Sayhan, Jayhan, the Euphrates and the Nile are all rivers of paradise", cluster: cosmology}
  wives-of-paradise-sing-we-are-the-immortal: {label: "The wives of paradise sing in the finest voices: 'We are the good and beautiful, wives of noble men ... we are immortal and do not die, safe and do not fear, abiding and do not depart'", cluster: eschatology}
  friday-market-north-wind-adds-beauty: {label: "A market in paradise each Friday; a north wind scatters on faces and clothes; they return more beautiful and their families too", cluster: eschatology}
  paradise-bracelet-effaces-sun-as-sun-the-stars: {label: "Were a man of paradise to look out and his bracelets show, they would efface the sun's light as the sun effaces the stars'", cluster: eschatology}
  forgo-wine-and-silk-here-to-have-them-there: {label: "Who would have God give him wine and silk in the hereafter should leave them in this world", cluster: law}
  # ---- who enters
  do-not-wish-for-death-good-may-increase-bad-may-repent: {label: "Let none wish for death: the good may increase his good, the bad may seek to make amends", cluster: ethics}
  keeper-told-open-for-none-before-muhammad: {label: "He asks the gate opened; the keeper asks 'Who are you?' - 'Muhammad' - 'I was commanded for you: open for none before you'", cluster: eschatology}
  only-a-muslim-soul-enters-paradise: {label: "Proclaimed by heralds: none enters paradise but a Muslim soul (or believers)", cluster: theology}
  days-of-mina-days-of-eating-and-drinking: {label: "Two heralds proclaim in the days of tashriq: none enters paradise but a believer, and the days of Mina are days of eating and drinking", cluster: ritual}
  gabriel-says-even-if-he-stole-and-fornicated: {label: "Gabriel at the edge of the harra: whoever dies associating nothing enters paradise - 'even if he stole and fornicated?' - 'yes, and drank wine'", cluster: theology}
  sincere-shahada-from-heart-fire-does-not-touch: {label: "Whoever witnesses there is no god but God sincerely from the heart enters paradise and the fire does not touch him (Muadh on his deathbed)", cluster: theology}
  guarantee-what-is-between-jaws-and-legs: {label: "Whoever guarantees me what is between his jaws and between his legs, I guarantee him paradise", cluster: ethics}
  abu-dharr-waters-his-camels-at-rabadha: {label: "At al-Rabadha Abu Dharr waters his own camels, a waterskin hung on a camel's neck: 'I have my work'", cluster: sira}
  bereaved-of-dearest-who-bears-it-has-paradise: {label: "God: my believing servant has no reward but paradise when I take his dearest of this world and he bears it for my sake", cluster: ethics}
  hearts-like-birds-hearts-enter-paradise: {label: "People whose hearts are like birds' hearts enter paradise", cluster: eschatology}
  poor-enter-before-rich-forty-autumns-or-five-hundred-years: {label: "The poor emigrants (or poor believers) enter paradise before the rich by forty autumns, or by five hundred years", cluster: eschatology}
  poor-emigrants-light-like-the-sun: {label: "A people come on resurrection day with light like the sun's: not Abu Bakr's kind but the poor emigrants gathered from the ends of the earth", cluster: eschatology}
  blessed-are-the-strangers: {label: "'Blessed are the strangers' thrice: righteous people among many bad, those who disobey them more than those who obey", cluster: eschatology}
  poor-first-in-while-rich-and-rulers-reckoned-chairs-of-light: {label: "'Where are the poor of this community?' - 'You tried us, we endured, and gave wealth and power to others'; they enter first, the hard reckoning stays with men of wealth and power; believers sit on chairs of light under clouds", cluster: eschatology}
  no-charms-no-cautery-no-omens-trust-in-lord: {label: "The seventy thousand are those who neither practise nor seek charms, nor cauterize, nor take omens, but trust in their Lord", cluster: ritual}
  ukkasha-beat-you-to-it: {label: "Ukkasha asks to be among the seventy thousand and is told he is; a second man asks: 'Ukkasha beat you to it'", cluster: sira}
  no-charm-except-for-eye-or-sting: {label: "Stung, a man used a charm on the saying 'no charm except for the evil eye or a sting'; Said b. Jubayr answers with the seventy thousand who seek no charms", cluster: ritual}
  first-band-faces-like-full-moon: {label: "The first band to enter paradise have faces like the moon on the night it is full; the next like the brightest star", cluster: eschatology}
  seventy-thousand-enter-holding-hands-abreast: {label: "Seventy thousand (or seven hundred thousand) enter holding one another, the first not entering till the last enters", cluster: eschatology}
  seventy-thousand-with-each-thousand-and-three-handfuls: {label: "Promised seventy thousand without reckoning, with every thousand seventy thousand more, and three handfuls (hathayat) of the Lord's palms", cluster: eschatology}
  few-as-red-flies-among-flies: {label: "Yazid b. al-Akhnas: seventy thousand in your community are like reddish flies among flies", cluster: eschatology}
  completed-from-the-bedouin: {label: "If the emigrants of his community do not reach the number, God will complete it from the bedouin", cluster: eschatology}
  thawban-letter-shames-governor-into-visiting: {label: "Sick in Hims, Thawban writes to the governor who did not visit: 'Had Moses or Jesus a freedman by you, you would visit him'; the governor comes in alarm", cluster: sira}
  god-could-admit-all-with-one-handful: {label: "Umar to Abu Bakr asking 'more': if God wills he could admit them all to paradise with one handful", cluster: theology}
  adam-called-first-shown-his-progeny: {label: "Adam is the first called on resurrection day; his progeny are shown him - 'this is your father Adam' - and he is told to bring out hell's share", cluster: eschatology}
  paradise-hundred-twenty-rows-eighty-of-this-community: {label: "Paradise's people are a hundred and twenty rows, eighty of them this community, forty all other nations", cluster: eschatology}
  women-fewest-in-paradise: {label: "The fewest dwellers of paradise are women", cluster: eschatology}
  women-in-paradise-like-red-legged-crow-among-crows: {label: "Among crows one 'a'sam' crow with red beak and legs: only women like this crow among crows enter paradise", cluster: eschatology}
  lowest-jahannami-could-feed-all-the-world: {label: "The Jahannamiyyun are at the lowest of paradise; one of them could host the whole world, feed, clothe and bed them, with nothing lessened", cluster: eschatology}
  successor-heard-it-from-thirty-companions: {label: "Challenged by a man of Kharijite views, Ubayd b. Umayr says he would not tell it had he not heard it from more than thirty Companions", cluster: sira}
  believers-soul-a-bird-feeding-on-paradise-trees: {label: "The believer's soul (nasama) is a bird feeding in paradise's trees until God returns it to its body on resurrection day", cluster: afterlife}
  last-man-brought-near-three-trees-god-excuses-him: {label: "The last man asks to be brought near a tree, then a finer, then a third at the gate, promising each time; God excuses him, seeing he cannot bear it", cluster: eschatology}
  what-will-end-your-asking-the-world-and-its-like: {label: "'Son of Adam, what will end your asking (ma yasrini minka)? Would the world and its like satisfy you?'", cluster: eschatology}
  two-houri-wives-praise-god-who-gave-you-life-for-us: {label: "Two houri wives enter to the lowest man: 'Praise God who made you live for us and us for you'", cluster: eschatology}
  small-sins-shown-each-replaced-by-good: {label: "His small sins are shown and great ones withheld; 'for each bad deed a good'; then he says 'I did things I do not see here' and the prophet laughs", cluster: eschatology}
  last-man-finds-paradise-full-three-times: {label: "The last man, crawling out of the fire, is sent to paradise, imagines it full and returns three times; given the world and ten times it: 'Do you mock me, and you the King?'", cluster: eschatology}
  people-of-paradise-hairless-beardless-kohl-eyed: {label: "Paradise's people are hairless, beardless, kohl-eyed (jurd murd kuhl); their youth does not pass nor their clothes wear", cluster: eschatology}
  raised-at-thirty-adams-form-josephs-beauty-jobs-heart: {label: "Miscarried or decrepit, all are raised at thirty, paradise's people in Adam's form, Joseph's beauty and Job's heart; hell's are enlarged like mountains", cluster: eschatology}
  herald-calls-health-life-youth-bliss-forever: {label: "A herald calls: you shall be healthy and never sick, live and never die, be young and never age, enjoy and never despair (Q 7:43)", cluster: eschatology}
  gold-combs-aloes-censers-two-wives-marrow-seen: {label: "Their combs gold (and silver), their censers aloes-wood, their sweat musk; each has two wives whose shin-marrow is seen through the flesh", cluster: eschatology}
  praise-inspired-like-breath-hearts-as-one: {label: "No dispute nor hatred, hearts as one heart; glorifying God morning and evening, inspired with praise as you are with breath", cluster: eschatology}
  hour-strikes-mid-sale-milking-trough-morsel: {label: "The Hour strikes in mid-task: a cloth spread for sale, milk carried home, a trough being plastered, a morsel at the mouth - none completed", cluster: eschatology}
units:
- id: hadith-66-hour-strikes-mid-task
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The Hour strikes mid-task - the cloth unsold, the milk undrunk, the trough unplastered, the morsel at the mouth
  read:
  - Jāmiʿ 66:8527.1
  quran:
  - 7:187
  - 43:66
  tags:
  - motif: hour-comes-suddenly
    refs:
    - Jāmiʿ 66:8527.1
    note: لا تقوم الساعة إلا بغتة (bab head, Q 7:187)
  - motif: hour-strikes-mid-sale-milking-trough-morsel
    refs:
    - Jāmiʿ 66:8527.1
    note: نشر الرجلان ثوبهما بينهما فلا يتبايعانه ولا يطويانه ... انصرف الرجل بلبن لقحته فلا يطعمه ... وهو يليط حوضه فلا يسقي فيه ... رفع أحدكم أكلته إلى فيه فلا يطعمها
- id: hadith-66-hour-on-friday
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The Hour comes only on a Friday, the day of Adam's creation, fall, repentance and death; beasts listen at dawn
  read:
  - Jāmiʿ 66:8527.2-8528.2
  tags:
  - motif: hour-will-come-on-a-friday
    refs:
    - Jāmiʿ 66:8527.2
    - Jāmiʿ 66:8528.1
    note: ولا تقوم الساعة إلا في يوم الجمعة
  - motif: adam-created-entered-and-expelled-on-friday
    refs:
    - Jāmiʿ 66:8527.2
    - Jāmiʿ 66:8528.1
    - Jāmiʿ 66:8528.2
    note: فيه خلق آدم، وفيه أدخل الجنة، وفيه أخرج منها / وفيه أهبط من الجنة، وفيه تيب عليه، وفيه مات
  - motif: beasts-listen-anxiously-every-friday-dawn
    refs:
    - Jāmiʿ 66:8528.1
    note: وما من دابة إلا وهي مصيخة يوم الجمعة من حين تصبح حتى تطلع الشمس شفقا من الساعة إلا الجن والإنس
  - motif: companion-exchanges-hadith-for-torah-with-kab
    refs:
    - Jāmiʿ 66:8528.1
    note: خرجت إلى الطور فلقيت كعب الأحبار ... فحدثني عن التوراة وحدثته عن رسول اللَّه
  - motif: friday-blast-and-swoon-blessings-shown-to-prophet
    refs:
    - Jāmiʿ 66:8528.2
    note: وفيه النفخة وفيه الصعقة فأكثروا علي من الصلاة فيه فإن صلاتكم معروضة علي
  - motif: earth-forbidden-to-consume-prophets-bodies
    refs:
    - Jāmiʿ 66:8528.2
    note: 'وقد أرمت -يقولون: بليت- ... إن اللَّه حرم على الأرض أجساد الأنبياء'
  hints:
  - Friday as the day of Adam's creation, sin and expulsion (8527.2, 8528.1) against b. Sanhedrin 38b, where Adam is created, sins and is expelled within the sixth day (Friday) in twelve hours.
- id: hadith-66-repeating-creation-not-harder
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'God: the son of Adam belied me (''he will not restore me'') and reviled me (''God took a son'')'
  read:
  - Jāmiʿ 66:8528.3
  quran:
  - 17:49-51
  - 112:1-4
  tags:
  - motif: son-of-adam-belies-and-reviles-god
    refs:
    - Jāmiʿ 66:8528.3
    note: 'كذبني ابن آدم ... فأما تكذيبه إياي فقوله: لن يعيدني كما بدأني، وليس أول الخلق بأهون من إعادته، وأما شتمه إياي فقوله: اتخذ اللَّه ولدًا'
- id: hadith-66-the-trumpet
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The trumpeter has the horn in his mouth, brow bent, waiting; the trumpet is a horn
  read:
  - Jāmiʿ 66:8529.1-8529.2
  quran:
  - 39:68
  - 27:87
  - 69:13-16
  tags:
  - motif: horn-holder-poised-to-blow
    refs:
    - Jāmiʿ 66:8529.1
    note: كيف أنعم وصاحب الصور قد التقم وحنا جبهته ينتظر متى يؤمر أن ينفخ
  - motif: say-god-suffices-at-the-trumpet
    refs:
    - Jāmiʿ 66:8529.1
    note: 'قولوا: حسبنا اللَّه ونعم الوكيل، على اللَّه توكلنا'
  - motif: trumpet-is-a-horn
    refs:
    - Jāmiʿ 66:8529.2
    note: 'ما الصور؟ قال: قرن ينفخ فيه'
  hints:
  - The sur as a 'horn blown into' (qarn) against the shofar of the end-time in Isa 27:13 and Zech 9:14 ('the Lord God will blow the shofar').
- id: hadith-66-from-dajjal-to-second-blast
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Ibn Amr''s sequence: Dajjal forty, Jesus kills him, seven peaceful years, the cold wind, the worst left, the blast, rain like dew, the second blast, 999 of 1000 to the fire'
  read:
  - Jāmiʿ 66:8529.3-8530.1
  quran:
  - 36:51-53
  - 39:68
  - '73:17'
  - '68:42'
  - '37:24'
  tags:
  - motif: dajjal-forty-then-jesus-kills-him
    refs:
    - Jāmiʿ 66:8529.3
    note: 'يخرج الدجال في أمتي فيمكث أربعين - لا أدري: أربعين يوما أو أربعين شهرا أو أربعين عاما'
  - motif: jesus-resembles-urwa-b-masud
    refs:
    - Jāmiʿ 66:8529.3
    note: فيبعث اللَّه عيسى ابن مريم كأنه عروة بن مسعود فيطلبه فيهلكه
  - motif: seven-years-without-enmity-after-jesus
    refs:
    - Jāmiʿ 66:8529.3
    note: ثم يمكث الناس سبع سنين ليس بين اثنين عداوة
  - motif: cold-wind-from-syria-takes-every-believer
    refs:
    - Jāmiʿ 66:8529.3
    note: ريحا باردة من قبل الشام ... حتى لو أن أحدكم دخل في كبد جبل لدخلته عليه حتى تقبضه
  - motif: worst-left-light-as-birds-minds-of-beasts-told-to-worship-idols
    refs:
    - Jāmiʿ 66:8529.3
    note: فيبقى شرار الناس في خفة الطير وأحلام السباع ... فيتمثل لهم الشيطان ... فيأمرهم بعبادة الأوثان وهم في ذلك دار رزقهم
  - motif: hearer-of-trumpet-tilts-neck
    refs:
    - Jāmiʿ 66:8529.3
    - Jāmiʿ 66:8530.1
    note: فلا يسمعه أحد إلا أصغى ليتا ورفع ليتا
  - motif: first-to-hear-trumpet-plastering-his-camels-trough
    refs:
    - Jāmiʿ 66:8529.3
    - Jāmiʿ 66:8530.1
    note: وأول من يسمعه رجل يلوط حوض إبله قال فيصعق ويصعق الناس
  - motif: rain-makes-the-dead-sprout-like-herbs
    refs:
    - Jāmiʿ 66:8529.3
    - Jāmiʿ 66:8530.1
    note: مطرا كأنه الطل أو الظل -نعمان الشاك- فتنبت منه أجساد الناس
  - motif: nine-hundred-ninety-nine-of-every-thousand-to-fire
    refs:
    - Jāmiʿ 66:8529.3
    note: 'أخرجوا بعث النار، فيقال: من كم؟ فيقال: من كل ألف تسعمائة وتسعة وتسعين'
  hints:
  - Bodies made to sprout by a rain 'like dew' (ka-annahu al-tall) against Isa 26:19, 'your dew is a dew of lights, and the earth shall give birth to the shades', and the rabbinic 'dew of resurrection' (tal tehiyyah, b. Hagigah 12b; y. Berakhot 5:2).
- id: hadith-66-tailbone-and-the-forty
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The earth eats all but the tailbone; forty between the blasts; men grow like herbs; the sky drizzles on the raised
  read:
  - Jāmiʿ 66:8531.1-8531.4
  quran:
  - 36:51-53
  tags:
  - motif: tailbone-never-decays-man-rebuilt-from-it
    refs:
    - Jāmiʿ 66:8531.1
    - Jāmiʿ 66:8531.2
    - Jāmiʿ 66:8531.4
    note: كل ابن آدم تأكله الأرض إلا عجب الذنب منه خلق وفيه يركب / عظما لا تأكله الأرض أبدا
  - motif: raised-while-sky-drizzles
    refs:
    - Jāmiʿ 66:8531.3
    note: يبعث الناس يوم القيامة والسماء تطش عليهم
  - motif: forty-between-the-two-trumpet-blasts
    refs:
    - Jāmiʿ 66:8531.4
    note: 'ما بين النفختين أربعون ... أربعون يوما؟ قال: أبيت'
  - motif: rain-makes-the-dead-sprout-like-herbs
    refs:
    - Jāmiʿ 66:8531.4
    note: ثم ينزل اللَّه من السماء ماء فينبتون كما ينبت البقل
  hints:
  - The one bone that does not decay and from which man is rebuilt ('ajb al-dhanab) against the rabbinic luz bone of the spine from which God makes man sprout at the resurrection (Genesis Rabbah 28:3; Leviticus Rabbah 18:1).
- id: hadith-66-moses-holding-the-throne
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Do not prefer among the prophets - the first raised finds Moses holding a leg of the Throne
  read:
  - Jāmiʿ 66:8532.1-8532.2
  quran:
  - 39:68
  tags:
  - motif: do-not-prefer-among-prophets-moses-at-throne
    refs:
    - Jāmiʿ 66:8532.1
    - Jāmiʿ 66:8532.2
    note: فإذا أنا بموسى آخذ بقائمة من قوائم العرش فلا أدري أكان فيمن صعق أم حوسب بصعقة الأولى / بصعقته يوم الطور
  - motif: ansari-slaps-jew-over-oath-moses-chosen
    refs:
    - Jāmiʿ 66:8532.2
    note: لا والذي اصطفى موسى على البشر ... فقام فلطم وجهه ... إن لي ذمة وعهدا
- id: hadith-66-raised-on-what-he-died
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Each is raised on what he died on; the punished are raised by deeds; the swallowed army raised by intentions
  read:
  - Jāmiʿ 66:8532.3-8533.2
  tags:
  - motif: each-raised-on-state-he-died-in
    refs:
    - Jāmiʿ 66:8532.3
    note: يبعث كل عبد على ما مات عليه
  - motif: punishment-strikes-all-then-raised-by-deeds
    refs:
    - Jāmiʿ 66:8533.1
    note: إذا أنزل اللَّه بقوم عذابا أصاب العذاب من كان فيهم ثم بعثوا على أعمالهم
  - motif: army-against-the-house-swallowed-at-bayda
    refs:
    - Jāmiʿ 66:8533.2
    note: يؤمون بالبيت برجل من قريش قد لجأ بالبيت حتى إذا كانوا بالبيداء خسف بهم ... المستبصر والمجبور وابن السبيل ... يبعثهم اللَّه على نياتهم
  - motif: deeds-judged-by-intention
    refs:
    - Jāmiʿ 66:8533.2
    note: يهلكون مهلكا واحدا ويصدرون مصادر شتى يبعثهم اللَّه على نياتهم
- id: hadith-66-pilgrim-raised-in-talbiya
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The pilgrim thrown by his camel at Arafa is raised saying the talbiya - washed in lote water, two cloths, no scent, head uncovered
  read:
  - Jāmiʿ 66:8533.3
  tags:
  - motif: muhrim-killed-by-camel-raised-saying-talbiya
    refs:
    - Jāmiʿ 66:8533.3
    note: اغسلوه بماء وسدر وكفنوه في ثوبين ولا تحنطوه ولا تخمروا رأسه فإن اللَّه يبعثه يوم القيامة ملبيا
- id: hadith-66-martyr-wound-scent-of-musk
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The one wounded in God's path comes with his wound gushing - colour of blood, scent of musk
  read:
  - Jāmiʿ 66:8533.4
  tags:
  - motif: wound-in-gods-path-gushes-blood-smells-of-musk
    refs:
    - Jāmiʿ 66:8533.4
    note: جاء يوم القيامة وجرحه يثعب دما اللون لون دم والريح ريح المسك
- id: hadith-66-gathered-naked-uncircumcised
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Gathered barefoot, naked, uncircumcised and with nothing (buhm); the King calls in a voice heard far as near
  read:
  - Jāmiʿ 66:8534.1-8535.1
  quran:
  - 56:49-50
  - 19:93-95
  - 21:104
  - 80:34-37
  tags:
  - motif: resurrected-barefoot-naked-uncircumcised
    refs:
    - Jāmiʿ 66:8534.1
    - Jāmiʿ 66:8534.2
    - Jāmiʿ 66:8534.3
    - Jāmiʿ 66:8534.4
    - Jāmiʿ 66:8535.1
    note: يحشر الناس يوم القيامة حفاة عراة غرلا / مشاة حفاة عراة غرلا ﴿كما بدأنا أول خلق نعيده﴾
  - motif: naked-at-resurrection-too-grave-to-look
    refs:
    - Jāmiʿ 66:8534.1
    - Jāmiʿ 66:8535.1
    note: النساء والرجال جميعا ينظر بعضهم إلى بعض ... الأمر أشد من أن ينظر بعضهم إلى بعض / واسوأتاه ... شغل الناس عن ذلك
  - motif: gathered-buhm-with-nothing-paid-in-good-and-bad-deeds
    refs:
    - Jāmiʿ 66:8534.4
    note: 'عراة غرلا بهما ... ليس معهم شيء ... قال: بالحسنات والسيئات'
  - motif: god-calls-in-voice-heard-far-as-near-i-am-king-and-requiter
    refs:
    - Jāmiʿ 66:8534.4
    note: 'يناديهم بصوت يسمعه من بعد كما يسمعه من قرب: أنا الملك، أنا الديان'
  - motif: no-one-enters-paradise-or-fire-with-a-claim-unsettled-even-a-slap
    refs:
    - Jāmiʿ 66:8534.4
    note: ولا ينبغي لأحد من أهل النار أن يدخل النار وله عند أحد من أهل الجنة حق حتى أقصه منه ... حتى اللطمة
  - motif: sweat-reaches-earlobes
    refs:
    - Jāmiʿ 66:8535.1
    note: يلجمهم العرق ويبلغ شحمة الأذن
- id: hadith-66-raised-in-death-clothes
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The dead are raised in the clothes they die in - Abu Said calls for new clothes at death
  read:
  - Jāmiʿ 66:8535.2
  tags:
  - motif: dead-raised-in-clothes-he-died-in
    refs:
    - Jāmiʿ 66:8535.2
    note: لما حضره الموت دعا بثياب جدد فلبسها ... إن الميت يبعث في ثيابه التي يموت فيها
- id: hadith-66-abraham-first-clothed
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
