    refs:
    - Jāmiʿ 66:8552.1
    note: أول ما يحاسب به العبد يوم القيامة صلاته ... انظروا هل تجدون لعبدي من تطوع؟ فأكملوا بها ما ضيع من فريضته
  - motif: blood-first-judged-between-people
    refs:
    - Jāmiʿ 66:8552.2
    note: أول ما يقضى بين الناس يوم القيامة في الدماء
  - motif: first-two-disputants-are-neighbours
    refs:
    - Jāmiʿ 66:8552.3
    note: أول خصمين يوم القيامة جاران
- id: hadith-66-asked-about-bliss
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: First asked of bliss - a healthy body and cool water; the hungry three fed by the Ansari asked of 'this bliss'; four questions
  read:
