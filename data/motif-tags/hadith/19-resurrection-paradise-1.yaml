  - motif: feet-stay-until-asked-of-life-knowledge-wealth-body
    refs:
    - Jāmiʿ 66:8554.1
    note: لا تزول قدما عبد يوم القيامة حتى يسأل عن عمره فيما أفناه وعن علمه فيم فعل وعن ماله من أين اكتسبه وفيم أنفقه وعن جسمه فيم أبلاه
- id: hadith-66-community-witness-for-noah
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Noah asked 'did you convey?', his people deny; Muhammad and his community testify
  read:
  - Jāmiʿ 66:8554.2
  quran:
  - 2:143
  tags:
  - motif: muhammads-community-testifies-for-noah
    refs:
    - Jāmiʿ 66:8554.2
    note: 'يدعى نوح ... هل بلغت؟ ... ما أتانا من نذير فيقول: من يشهد لك؟ فيقول: محمد وأمته'
  - motif: middle-community-witnesses
    refs:
    - Jāmiʿ 66:8554.2
    note: 'والوسط: العدل / وما علمكم؟ فيقولون: جاءنا نبينا فأخبرنا أن الرسل قد بلغوا'
- id: hadith-66-medina-hardship
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Who bears Medina's hardship has the prophet as witness or intercessor - told to a freedwoman and to a man in the days of al-Harra
  read:
  - Jāmiʿ 66:8555.1-8555.2
  tags:
  - motif: endure-medinas-hardship-prophet-witness-or-intercessor
    refs:
    - Jāmiʿ 66:8555.1
    - Jāmiʿ 66:8555.2
    note: اقعدي لكاع ... لا يصبر على لأوائها وشدتها أحد إلا كنت له شهيدا أو شفيعا يوم القيامة / ليالي الحرة
- id: hadith-66-limbs-testify
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The mouth sealed, thigh, flesh and bones speak; the servant demands a witness from himself; mouths gagged, thigh and palm first
  read:
  - Jāmiʿ 66:8555.3-8556.2
  quran:
  - '24:24'
  - 41:20-21
  - '17:14'
  - '82:11'
  tags:
  - motif: mouth-sealed-thigh-speaks
    refs:
    - Jāmiʿ 66:8555.3
    note: 'فيختم على فيه ويقال لفخذه ولحمه وعظامه: انطقي ... وذلك المنافق'
  - motif: servant-asks-witness-from-himself-limbs-speak
    refs:
    - Jāmiʿ 66:8556.1
    note: 'فإني لا أجيز على نفسي إلا شاهدا مني ... فيقال لأركانه: انطقي ... فيقول: بعدا لكن وسحقا فعنكن كنت أناضل'
  - motif: mouths-gagged-thigh-first-to-speak
    refs:
    - Jāmiʿ 66:8556.2
    note: مفدمة أفواهكم بالفدام ثم إن أول ما يبين عن أحدكم لفخذه وكفه
  - motif: prophet-holds-people-by-waists-from-fire-moths
    refs:
    - Jāmiʿ 66:8556.2
    note: ما لي أمسك بحجزكم عن النار
- id: hadith-66-witnesses-muezzin-black-stone
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Jinn, men and every wet and dry thing within the muezzin's reach witness for him; the Black Stone raised with eyes and tongue
  read:
  - Jāmiʿ 66:8557.1-8557.3
  tags:
  - motif: all-within-earshot-of-adhan-testify
    refs:
    - Jāmiʿ 66:8557.1
    - Jāmiʿ 66:8557.2
    note: لا يسمع مدى صوت المؤذن جن ولا إنس ولا شيء إلا شهد له / ويشهد له كل رطب ويابس
  - motif: muezzin-forgiven-reach-of-voice-twenty-five-prayers
    refs:
    - Jāmiʿ 66:8557.2
    note: المؤذن يغفر له مدى صوته ... وشاهد الصلاة يكتب له خمس وعشرون صلاة
  - motif: black-stone-raised-with-eyes-and-tongue-to-witness
    refs:
    - Jāmiʿ 66:8557.3
    note: ليبعثنه اللَّه يوم القيامة له عينان يبصر بهما ولسان ينطق به يشهد على من استلمه بحق
- id: hadith-66-believer-screened-and-forgiven
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The believer drawn under God's side and made to confess - 'I covered them in the world, I forgive them today'; the unbeliever paid in the world
  read:
  - Jāmiʿ 66:8558.1-8558.2
  tags:
  - motif: god-draws-believer-near-and-covers-sins
    refs:
    - Jāmiʿ 66:8558.1
    note: يدنى المؤمن ... حتى يضع عليه كنفه فيقرره بذنوبه ... فإني قد سترتها عليك في الدنيا وإني أغفرها لك اليوم
  - motif: unbelievers-cried-out-before-all-creation
    refs:
    - Jāmiʿ 66:8558.1
    note: وأما الكفار والمنافقون فينادى بهم على رؤوس الخلائق هؤلاء الذين كذبوا على اللَّه
  - motif: unbeliever-paid-for-good-in-world
    refs:
    - Jāmiʿ 66:8558.2
    note: وأما الكافر فيطعم بحسنات ما عمل بها للَّه في الدنيا حتى إذا أفضى إلى الآخرة لم تكن له حسنة يجزى بها
- id: hadith-66-forgotten-as-he-forgot
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: '"Did you think you would meet me?" - "I forget you as you forgot me"; the third boasts and his thigh speaks'
  read:
  - Jāmiʿ 66:8559.1-8559.2
  quran:
  - 45:33-34
  tags:
  - motif: see-lord-as-full-moon-and-sun
    refs:
    - Jāmiʿ 66:8559.1
    note: هل تضارون في رؤية الشمس في الظهيرة ليست في سحابة ... القمر ليلة البدر
  - motif: god-forgets-one-who-forgot-meeting
    refs:
    - Jāmiʿ 66:8559.1
    - Jāmiʿ 66:8559.2
    note: 'أي فل ألم أكرمك وأسودك وأزوجك وأسخر لك الخيل والإبل وأذرك ترأس وتربع ... أفظننت أنك ملاقي؟ فيقول: لا فيقول: فإني أنساك كما نسيتني'
- id: hadith-66-mountains-of-deeds-to-dust
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Deeds like the mountains of Tihama made scattered dust - those who violate God's limits when alone
  read:
  - Jāmiʿ 66:8560.1
  tags:
  - motif: deeds-made-scattered-dust
    refs:
    - Jāmiʿ 66:8560.1
    note: بحسنات أمثال جبال تهامة بيضا فيجعلها اللَّه هباء منثورا
  - motif: night-worshippers-who-violate-limits-in-private
    refs:
    - Jāmiʿ 66:8560.1
    note: ويأخذون من الليل كما تأخذون ولكنهم أقوام إذا خلوا بمحارم اللَّه انتهكوها
- id: hadith-66-retaliation-of-wrongs
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Retaliation - believers held on a bridge, wrongs paid in good deeds, the bankrupt, the slap, the blow, the hornless ewe
  read:
  - Jāmiʿ 66:8560.2-8563.1
  tags:
  - motif: believers-held-on-bridge-for-retaliation
    refs:
    - Jāmiʿ 66:8560.2
    note: فيحبسون على قنطرة بين الجنة والنار فيقص لبعضهم من بعض ... لأحدهم أهدى بمنزله في الجنة منه بمنزله كان في الدنيا
  - motif: wronged-paid-from-good-deeds-at-judgment
    refs:
    - Jāmiʿ 66:8560.3
    note: فليتحلله منها فإنه ليس ثم دينار ولا درهم ... فإن لم يكن له حسنات أخذ من سيئات أخيه فطرحت عليه
  - motif: the-bankrupt-pays-with-good-deeds-then-takes-sins
    refs:
    - Jāmiʿ 66:8561.1
    note: إن المفلس من أمتي يأتي يوم القيامة بصلاة وصيام وزكاة ويأتي قد شتم هذا وقذف هذا ... ثم طرح في النار
  - motif: no-one-enters-paradise-or-fire-with-a-claim-unsettled-even-a-slap
    refs:
    - Jāmiʿ 66:8561.2
    note: حتى أقصه منه حتى اللطمة
  - motif: unjust-blow-retaliated-at-resurrection
    refs:
    - Jāmiʿ 66:8561.3
    note: من ضرب ضربا ظلما اقتص منه يوم القيامة
  - motif: hornless-ewe-avenged-on-horned
    refs:
    - Jāmiʿ 66:8562.1
    - Jāmiʿ 66:8563.1
    note: حتى يقاد للشاة الجلحاء من الشاة القرناء / فنطحت إحداهما الأخرى فأجهضتها ... ليقادن لها يوم القيامة
  hints:
  - The hornless ewe avenged on the horned (8562.1) against Ezek 34:20-21, God judging 'between the fat sheep and the lean' that 'push with horns'.
- id: hadith-66-the-scale
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: In the scale - two light phrases, praise filling it, a war-horse's dung, the card against ninety-nine scrolls, Ibn Masud's thin shins
  read:
  - Jāmiʿ 66:8563.2-8565.1
  quran:
  - '21:47'
  - 7:8-9
  - 101:6-11
  tags:
  - motif: two-phrases-light-on-tongue-heavy-in-scale
    refs:
    - Jāmiʿ 66:8563.2
    note: 'كلمتان خفيفتان على اللسان ثقيلتان في الميزان حبيبتان إلى الرحمن: سبحان اللَّه وبحمده سبحان اللَّه العظيم'
  - motif: purity-half-of-faith-praise-fills-the-scale
    refs:
    - Jāmiʿ 66:8563.3
    note: الطهور شطر الإيمان والحمد للَّه تملأ الميزان
  - motif: horses-food-and-dung-in-the-balance
    refs:
    - Jāmiʿ 66:8564.1
    note: من احتبس فرسا في سبيل اللَّه ... فإن شبعه وريه وروثه وبوله في ميزانه يوم القيامة
  - motif: card-of-shahada-outweighs-ninety-nine-scrolls
    refs:
    - Jāmiʿ 66:8564.2
    note: فينشر عليه تسعة وتسعين سجلا كل سجل مثل مد البصر ... فتخرج بطاقة فيها أشهد أن لا إله إلا اللَّه ... فطاشت السجلات وثقلت البطاقة
  - motif: thin-shins-heavier-in-scale-than-uhud
    refs:
    - Jāmiʿ 66:8565.1
    note: يجتني سواكا من الأراك وكان دقيق الساقين فجعلت الريح تكفؤه ... لهما أثقل في الميزان من أحد
  hints:
  - Deeds weighed in a two-pan balance where a single slip tips it (8564.2) against the Testament of Abraham 12-14 (Rec. A), where an angel weighs the souls' deeds in a balance and one soul's sins and good deeds are equal until one more is found.
- id: hadith-66-fat-man-weightless
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The great fat man weighs less than a gnat's wing
  read:
  - Jāmiʿ 66:8565.2
  quran:
  - 18:103-105
  tags:
  - motif: fat-man-weighs-less-than-gnat-wing
    refs:
    - Jāmiʿ 66:8565.2
    note: إنه ليأتي الرجل العظيم السمين يوم القيامة لا يزن عند اللَّه جناح بعوضة
- id: hadith-66-the-pool
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The pool - a month's journey, whiter than milk, cups like stars, fed by two spouts from paradise; some driven off like stray camels
  read:
  - Jāmiʿ 66:8565.3-8567.3
  quran:
  - '108:1'
  tags:
  - motif: pool-a-months-journey-cups-like-stars
    refs:
    - Jāmiʿ 66:8565.3
    - Jāmiʿ 66:8566.1
    - Jāmiʿ 66:8566.4
    note: حوضي مسيرة شهر ماؤه أبيض من اللبن وريحه أطيب من المسك وكيزانه كنجوم السماء من شرب منها فلا يظمأ أبدا / وزواياه سواء
  - motif: pool-fed-by-two-spouts-from-paradise-amman-to-ayla
    refs:
    - Jāmiʿ 66:8566.1
    - Jāmiʿ 66:8566.4
    note: يشخب فيه ميزابان من الجنة ... عرضه مثل طوله ما بين عمان إلى أيلة / أبعد من أيلة من عدن
  - motif: kawthar-river-with-pearl-palace-and-musk
    refs:
    - Jāmiʿ 66:8566.2
    note: بنهر حافتاه قباب الدر المجوف ... هذا الكوثر ... فإذا طينه -أو طيبه- مسك أذفر
  - motif: drives-men-from-pool-like-stray-camels
    refs:
    - Jāmiʿ 66:8566.3
    - Jāmiʿ 66:8566.4
    note: لأذودن رجالا عن حوضي كما تذاد الغريبة من الإبل عن الحوض
  - motif: community-known-by-white-blazes-of-ablution
    refs:
    - Jāmiʿ 66:8566.4
    note: لكم سيما ليست لأحد من الأمم تردون علي غرا محجلين من أثر الوضوء
  - motif: man-pulled-away-from-basin-you-know-not-what-he-innovated
    refs:
    - Jāmiʿ 66:8566.4
    - Jāmiʿ 66:8567.1
    - Jāmiʿ 66:8567.2
    - Jāmiʿ 66:8567.3
    note: 'اختلجوا دوني فأقول: أي رب أصحابي يقول: لا تدري ما أحدثوا بعدك / سحقا سحقا لمن بدل بعدي / أصيحابي'
  - motif: prophet-forerunner-at-the-pool
    refs:
    - Jāmiʿ 66:8567.1
    - Jāmiʿ 66:8567.2
    note: أنا فرطكم على الحوض
- id: hadith-66-vision-and-walking-on-face
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: You will see your Lord as this full moon - guard the dawn and afternoon prayers; the unbeliever walks on his face
  read:
  - Jāmiʿ 66:8568.1-8568.2
  quran:
  - 20:130
  - '25:34'
  tags:
  - motif: see-lord-as-full-moon-and-sun
    refs:
    - Jāmiʿ 66:8568.1
    note: سترون ربكم كما ترون هذا القمر لا تضامون في رؤيته فإن استطعتم أن لا تغلبوا على صلاة قبل طلوع الشمس وصلاة قبل غروب الشمس فافعلوا
  - motif: disbeliever-walks-on-face
    refs:
    - Jāmiʿ 66:8568.2
    note: أليس الذي أمشاه على رجليه في الدنيا قادرا على أن يمشيه على وجهه يوم القيامة
- id: hadith-66-the-bridge
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The bridge over hell - slippery, with hooks and sadan thorns; crossing like an eye-blink, lightning, wind, birds, horses; trust and kinship at its sides
  read:
  - Jāmiʿ 66:8568.3-8570.4
  quran:
  - 57:12-15
  - '66:8'
  - '14:48'
  tags:
  - motif: people-on-the-bridge-when-earth-changed
    refs:
    - Jāmiʿ 66:8568.3
    note: 'فأين يكون الناس يومئذ؟ فقال: على الصراط'
  - motif: bridge-slippery-with-hooks-and-sadan-thorns
    refs:
    - Jāmiʿ 66:8569.1
    - Jāmiʿ 66:8569.2
    - Jāmiʿ 66:8570.3
    note: دحض مزلة فيه خطاطيف وكلاليب وحسك تكون بنجد فيها شويكة يقال لها السعدان
  - motif: crossing-bridge-by-speed-of-deeds
    refs:
    - Jāmiʿ 66:8569.1
    - Jāmiʿ 66:8569.2
    note: فيمر المؤمنون كطرف العين وكالبرق وكالريح وكالطير وكأجاويد الخيل والركاب فناج مسلم ومخدوش مرسل ومكدوس في نار جهنم
  - motif: messengers-cry-grant-safety-on-bridge
    refs:
    - Jāmiʿ 66:8569.1
    - Jāmiʿ 66:8569.2
    note: 'ويقولون: اللهم سلم سلم / ونبيكم قائم على الصراط يقول: رب سلم سلم / ودعوى الرسل يومئذ: اللهم سلم سلم'
  - motif: trust-and-kinship-stand-at-sides-of-bridge
    refs:
    - Jāmiʿ 66:8569.2
    note: وترسل الأمانة والرحم فتقومان جنبتي الصراط يمينا وشمالا
  - motif: depth-of-hell-seventy-autumns
    refs:
    - Jāmiʿ 66:8569.2
    note: والذي نفس أبي هريرة بيده إن قعر جهنم لسبعون خريفا
  - motif: last-man-out-stumbles-and-is-scorched
    refs:
    - Jāmiʿ 66:8570.1
    note: آخر من يدخل الجنة رجل فهو يمشي مرة ويكبو مرة وتسفعه النار مرة ... تبارك الذي نجاني منك
  - motif: light-loaded-cross-the-slippery-road-safer
    refs:
    - Jāmiʿ 66:8570.2
    note: إن دون جسر جهنم طريقا ذا دحض ومزلة وإنا نأتي عليه وفي أحمالنا اقتدار ... أحرى أن ننجو من أن نأتي عليه ونحن مواقير
  - motif: people-dashed-on-bridge-like-moths-into-fire
    refs:
    - Jāmiʿ 66:8570.4
    note: تقادع الفراش في النار
  hints:
  - A bridge over hell that the righteous cross swiftly and the wicked fall from (8569.1) against the Zoroastrian Chinvat bridge (Videvdad 19.29-30; Dadestan i Denig 21), broad for the righteous and turning to a razor's edge for the wicked.
- id: hadith-66-scenes-of-the-day-abu-said
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Abu Said''s long account: each follows what it worshipped; Jews and Christians led to a mirage-fire; God in a form, the shin uncovered; the freed of God'
  read:
  - Jāmiʿ 66:8571.1
  quran:
  - '4:40'
  - '68:42'
  - '9:30'
  - '72:3'
  tags:
  - motif: each-community-follows-what-it-worshipped
    refs:
    - Jāmiʿ 66:8571.1
    note: أذن مؤذن ليتبع كل أمة ما كانت تعبد فلا يبقى أحد كان يعبد غير اللَّه ... من الأصنام والأنصاب إلا يتساقطون في النار
  - motif: jews-and-christians-thirsty-led-to-fire-like-mirage
    refs:
    - Jāmiʿ 66:8571.1
    note: كنا نعبد عزيرا ابن اللَّه ... عطشنا يا ربنا فاسقنا فيشار إليهم ألا تردون فيحشرون إلى النار كأنها سراب يحطم بعضها بعضا ... المسيح ابن اللَّه
  - motif: god-comes-in-unknown-form-then-known-form
    refs:
    - Jāmiʿ 66:8571.1
    note: أتاهم رب العالمين في أدنى صورة من التي رأوه فيها ... نعوذ باللَّه منك ... ثم يرفعون رؤوسهم وقد تحول في صورته التي رأوه فيها أول مرة
  - motif: shin-uncovered-back-becomes-one-plate
    refs:
    - Jāmiʿ 66:8571.1
    note: فيكشف عن ساق ... ولا يبقى من كان يسجد اتقاء ورياء إلا جعل اللَّه ظهره طبقة واحدة كلما أراد أن يسجد خر على قفاه
  - motif: freed-of-god-with-seals-on-necks
    refs:
    - Jāmiʿ 66:8571.1
    note: فيخرجون كاللؤلؤ في رقابهم الخواتم يعرفهم أهل الجنة هؤلاء عتقاء اللَّه الذين أدخلهم اللَّه الجنة بغير عمل عملوه
  - motif: i-make-my-pleasure-alight-on-you
    refs:
    - Jāmiʿ 66:8571.1
    note: 'لكم عندي أفضل من هذا ... أي شيء أفضل من هذا؟ فيقول: رضاي فلا أسخط عليكم بعده أبدا'
  - motif: bridge-thinner-than-hair-sharper-than-sword
    refs:
    - Jāmiʿ 66:8571.1
    note: 'قال أبو سعيد: بلغني أن الجسر أدق من الشعرة وأحد من السيف'
- id: hadith-66-scenes-of-the-day-abu-hurayra
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Abu Hurayra''s long account: followers of sun, moon and tawaghit; the fire spares the marks of prostration; the last man who breaks his promises; ''that and its like'' or ''ten times'''
  read:
  - Jāmiʿ 66:8573.1
  tags:
  - motif: followers-of-sun-moon-and-tawaghit
    refs:
    - Jāmiʿ 66:8573.1
    note: فيتبع من كان يعبد الشمس الشمس ويتبع من كان يعبد القمر القمر ويتبع من كان يعبد الطواغيت الطواغيت وتبقى هذه الأمة فيها منافقوها
  - motif: fire-spares-marks-of-prostration
    refs:
    - Jāmiʿ 66:8573.1
    note: يعرفونهم بأثر السجود تأكل النار من ابن آدم إلا أثر السجود حرم اللَّه على النار أن تأكل أثر السجود
  - motif: last-man-asks-face-turned-from-fire-breaks-promises
    refs:
    - Jāmiʿ 66:8573.1
    note: اصرف وجهي عن النار فإنه قد قشبني ريحها وأحرقني ذكاؤها ... ويلك يا ابن آدم ما أغدرك ... لا أكون أشقى خلقك
  - motif: god-laughs-at-last-man-and-lets-him-in
    refs:
    - Jāmiʿ 66:8573.1
    note: 'فلا يزال يدعو اللَّه حتى يضحك اللَّه منه فإذا ضحك اللَّه منه قال: ادخل الجنة'
  - motif: wish-and-the-like-of-it-or-ten-times
    refs:
    - Jāmiʿ 66:8573.1
    note: 'تمنه ... ذلك لك ومثله معه ... قال أبو سعيد: وعشرة أمثاله معه'
- id: hadith-66-death-slaughtered-hell-filled
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Each shown what he worshipped - cross, images, fire; hell asks 'is there more?' until the Merciful sets his foot; death slaughtered on the wall
  read:
  - Jāmiʿ 66:8574.1
  quran:
  - '50:30'
  tags:
  - motif: cross-images-fire-shown-to-their-worshippers
    refs:
    - Jāmiʿ 66:8574.1
    note: فيمثل لصاحب الصليب صليبه ولصاحب التصاوير تصاويره ولصاحب النار ناره
  - motif: hell-asks-for-more
    refs:
    - Jāmiʿ 66:8574.1
    note: 'هل امتلأت؟ فتقول: هل من مزيد ... حتى إذا أوعبوا فيها وضع الرحمن قدمه فيها وأزوي بعضها إلى بعض ثم قال: قط، قالت: قط قط'
  - motif: death-brought-and-slaughtered-between-paradise-and-fire
    refs:
    - Jāmiʿ 66:8574.1
    note: أتي بالموت ملببا فيوقف على السور ... هو الموت الذي وكل بنا فيضجع فيذبح ذبحا على السور ... خلود لا موت
  - motif: paradise-folk-look-fearful-hell-folk-hopeful
    refs:
    - Jāmiʿ 66:8574.1
    note: 'يا أهل الجنة فيطلعون خائفين ثم يقال: يا أهل النار فيطلعون مستبشرين يرجون الشفاعة'
  hints:
  - Death brought in and slaughtered before the people of paradise and of the fire (8574.1) against b. Sukkah 52a, where in the time to come God brings the evil inclination and slaughters it before the righteous and the wicked, and both weep.
- id: hadith-66-ibn-masud-long-account
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Ibn Masud''s long account: light by deeds down to a big toe; the Lord''s track in the fire like a sword''s edge; the last man''s palace of pearl and steward; Kaab on hell''s sigh'
  read:
  - Jāmiʿ 66:8575.1
  quran:
  - '32:17'
  - '68:42'
  - '57:12'
  - 21:102
  tags:
  - motif: each-community-follows-what-it-worshipped
    refs:
    - Jāmiʿ 66:8575.1
    note: ويمثل لمن كان يعبد عيسى شيطان عيسى ويمثل لمن كان يعبد عزيرا شيطان عزير
  - motif: light-given-by-deeds-last-on-big-toe
    refs:
    - Jāmiʿ 66:8575.1
    note: فمنهم من يعطى نوره مثل الجبل العظيم ... حتى يكون آخرهم رجلا يعطى نوره على إبهام قدمه يضيء مرة ويطفئ مرة
  - motif: lords-track-through-fire-like-swords-edge
    refs:
    - Jāmiʿ 66:8575.1
    note: والرب أمامهم حتى يمر في النار فيبقى أثره كحد السيف دحض مزلة
  - motif: last-man-washes-in-pool-at-paradise-gate
    refs:
    - Jāmiʿ 66:8575.1
    note: فينطلق به إلى غدير عند باب الجنة فيغتسل فيعود إليه ريح أهل الجنة وألوانهم
  - motif: man-prostrates-to-palace-thinking-it-his-lord
    refs:
    - Jāmiʿ 66:8575.1
    note: 'رفع له قصر من درة فيخر ساجدا ... رأيت ربي أو تراءى لي ربي فيقال له: إنما هو منزل من منازلك'
  - motif: steward-with-thousand-stewards-not-an-angel
    refs:
    - Jāmiʿ 66:8575.1
    note: 'فيتهيأ للسجود له فيقال له: مه ... إنما أنا خازن من خزانك ... تحت يدي ألف قهرمان'
  - motif: houri-seventy-robes-marrow-seen-liver-a-mirror
    refs:
    - Jāmiʿ 66:8575.1
    note: أدناهن حوراء عيناء عليها سبعون حلة يرى مخ ساقها من وراء حللها كبدها مرآته وكبده مرآتها ... ازددت في عيني سبعين ضعفا
  - motif: like-the-world-from-creation-to-end-and-ten-times
    refs:
    - Jāmiʿ 66:8575.1
    note: ألم ترض أن أعطيك مثل الدنيا منذ خلقتها إلى يوم أفنيتها وعشرة أضعافه ... ملكك مسيرة مائة عام ينفذه بصره
  - motif: kab-hells-sigh-every-angel-and-prophet-kneels
    refs:
    - Jāmiʿ 66:8575.1
    note: 'إن لجهنم يوم القيامة لزفرة ما من ملك مقرب ولا نبي مرسل إلا يخر لركبتيه حتى إن إبراهيم خليل اللَّه ليقول: رب نفسي نفسي'
  - motif: kab-hidden-abode-no-eye-has-seen
    refs:
    - Jāmiʿ 66:8575.1
    note: إن اللَّه جعل دارا فجعل فيها ما شاء من الأزواج والثمرات والأشربة ثم أطبقها ثم لم يرها أحد من خلقه لا جبريل ولا غيره ... من كان كتابه في عليين
- id: hadith-67-gods-costly-merchandise
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Who fears sets out by night and reaches the halt - God's merchandise is costly, it is paradise
  read:
  - Jāmiʿ 67:8579.1-8579.2
  tags:
  - motif: who-fears-sets-out-by-night-gods-merchandise-costly
    refs:
    - Jāmiʿ 67:8579.1
    - Jāmiʿ 67:8579.2
    note: من خاف أدلج ومن أدلج بلغ المنزل ألا إن سلعة اللَّه غالية ألا إن سلعة اللَّه الجنة
  - motif: quaking-then-following-death-with-all-in-it
    refs:
    - Jāmiʿ 67:8579.1
    note: جاءت الراجفة تتبعها الرادفة جاء الموت بما فيه
- id: hadith-67-breadth-of-paradise
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: A garden as wide as heavens and earth - Umayr throws away his dates; where then is the fire? where is day when night covers all?
  read:
  - Jāmiʿ 67:8580.1-8580.2
  quran:
  - 3:133
  - '57:21'
  tags:
  - motif: paradise-wide-as-heavens-and-earth
    refs:
    - Jāmiʿ 67:8580.1
    - Jāmiʿ 67:8580.2
    note: قوموا إلى جنة عرضها السماوات والأرض
  - motif: dates-thrown-away-to-hasten-martyrdom
    refs:
    - Jāmiʿ 67:8580.1
    note: بخ بخ ... فأخرج تمرات من قرنه ... لئن أنا حييت حتى آكل تمراتي هذه إنها لحياة طويلة فرمى بما كان معه من التمر ثم قاتلهم حتى قتل
  - motif: where-is-fire-as-where-is-day-under-night
    refs:
    - Jāmiʿ 67:8580.2
    note: 'أرأيت جنة عرضها السماوات والأرض فأين النار؟ قال: أرأيت الليل الذي قد ألبس كل شيء فأين جعل النهار'
- id: hadith-67-eight-gates
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Eight gates - al-Rayyan for the fasters; the confession, the ablution and witness, three children dead open them all
  read:
  - Jāmiʿ 67:8580.3-8582.1
  quran:
  - 39:73
  - 4:171
  tags:
  - motif: rayyan-gate-only-for-fasters
    refs:
    - Jāmiʿ 67:8580.3
    note: في الجنة ثمانية أبواب فيها باب يسمى الريان لا يدخله إلا الصائمون
  - motif: confession-of-unity-opens-eight-gates
    refs:
    - Jāmiʿ 67:8581.1
    - Jāmiʿ 67:8581.3
    note: وأن عيسى عبد اللَّه وابن أمته وكلمته ألقاها إلى مريم وروح منه ... أدخله اللَّه من أي أبواب الجنة الثمانية شاء / من مات لا يشرك باللَّه شيئا فتحت له أبواب الجنة
  - motif: ablution-and-witness-open-eight-gates
    refs:
    - Jāmiʿ 67:8581.2
    note: 'يتوضأ فيبلغ -أو فيسبغ- الوضوء ثم يقول: أشهد أن لا إله إلا اللَّه ... إلا فتحت له أبواب الجنة الثمانية'
  - motif: two-rakas-with-heart-and-face-earn-paradise
    refs:
    - Jāmiʿ 67:8581.2
    note: ثم يقوم فيصلي ركعتين مقبل عليهما بقلبه ووجهه إلا وجبت له الجنة ... رعاية الإبل فجاءت نوبتي
  - motif: three-children-dead-meet-parent-at-eight-gates
    refs:
    - Jāmiʿ 67:8582.1
    note: ما من مسلم يموت له ثلاثة من الولد لم يبلغوا الحنث إلا تلقوه من أبواب الجنة الثمانية
- id: hadith-67-gates-named-by-deeds
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Gates of prayer, jihad, alms and fasting; the spender of pairs called by every gate's keeper - Abu Bakr hoped to be called from all
  read:
  - Jāmiʿ 67:8582.2
  tags:
  - motif: doors-of-paradise-called-by-deed
    refs:
    - Jāmiʿ 67:8582.2
    note: فمن كان من أهل الصلاة دعي من باب الصلاة ومن كان من أهل الجهاد دعي من باب الجهاد ... الصدقة ... الصيام وباب الريان
  - motif: spender-of-pairs-called-by-every-gatekeeper
    refs:
    - Jāmiʿ 67:8582.2
    note: من أنفق زوجين من شيء من الأشياء في سبيل اللَّه دعي من أبواب ... هل يدعى منها كلها أحد ... نعم وأرجو أن تكون منهم يا أبا بكر
- id: hadith-67-gates-open-monday-thursday
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The gates open Monday and Thursday; all forgiven but two at enmity - 'wait for these two' said three times
  read:
  - Jāmiʿ 67:8583.1
  tags:
  - motif: gates-open-monday-thursday-except-two-at-enmity
    refs:
    - Jāmiʿ 67:8583.1
    note: 'تفتح أبواب الجنة يوم الاثنين ويوم الخميس ... إلا رجلا كانت بينه وبين أخيه شحناء فيقال: أنظروا هذين حتى يصطلحا (ثلاثا)'
- id: hadith-67-width-of-the-gates
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Between two leaves of a gate - Mecca to Hajar, or forty years, yet a day comes when it is jammed; a stone falls seventy years in hell
  read:
  - Jāmiʿ 67:8583.2-8584.1
  tags:
  - motif: paradise-door-leaves-apart-as-mecca-to-hajar
    refs:
    - Jāmiʿ 67:8583.2
    note: إن ما بين المصراعين من مصاريع الجنة لكما بين مكة وهجر أو كما بين مكة وبصرى
  - motif: gate-leaves-forty-years-apart-yet-crowded
    refs:
    - Jāmiʿ 67:8583.3
    - Jāmiʿ 67:8584.1
    note: أن ما بين مصراعين من مصاريع الجنة مسيرة أربعين سنة وليأتين عليها يوم وهو كظيظ من الزحام
  - motif: stone-falls-seventy-years-in-hell-finds-no-bottom
    refs:
    - Jāmiʿ 67:8583.3
    note: أن الحجر يلقى من شفة جهنم فيهوي فيها سبعين عاما لا يدرك لها قعرا وواللَّه لتملأن
  - motif: seventh-of-seven-eating-tree-leaves
    refs:
    - Jāmiʿ 67:8583.3
    note: ولقد رأيتني سابع سبعة مع رسول اللَّه ﷺ ما لنا طعام إلا ورق الشجر حتى قرحت أشداقنا
  - motif: you-complete-seventy-nations-the-last-and-noblest
    refs:
    - Jāmiʿ 67:8584.1
    note: أنتم توفون سبعين أمة أنتم آخرها وأكرمها على اللَّه
- id: hadith-67-keepers-and-chambers
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Keepers of each gate call the spender of pairs; chambers seen like a far star; a chamber seen through for soft speakers who feed and pray at night
  read:
  - Jāmiʿ 67:8585.1-8586.3
  quran:
  - 39:73
  - '39:20'
  - '29:58'
  tags:
  - motif: spender-of-pairs-called-by-every-gatekeeper
    refs:
    - Jāmiʿ 67:8585.1
    note: دعاه خزنة الجنة -كل خزنة باب- أي فل هلم ... ذاك الذي لا توى عليه
  - motif: upper-chambers-seen-like-a-distant-star
    refs:
    - Jāmiʿ 67:8585.2
    - Jāmiʿ 67:8585.3
    - Jāmiʿ 67:8585.4
    - Jāmiʿ 67:8586.1
    note: ليتراءون الغرف في الجنة كما تتراءون الكوكب في السماء / الكوكب الدري الغابر من الأفق ... لتفاضل ما بينهم ... رجال آمنوا باللَّه وصدقوا المرسلين
  - motif: see-through-chamber-for-soft-speech-food-fasting-night-prayer
    refs:
    - Jāmiʿ 67:8586.2
    - Jāmiʿ 67:8586.3
    note: إن في الجنة غرفة يرى ظاهرها من باطنها وباطنها من ظاهرها ... لمن ألان الكلام وأطعم الطعام وتابع الصيام وصلى والناس نيام
- id: hadith-67-tent-and-gardens
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: A tent of a hollow pearl sixty miles wide; two gardens of silver, two of gold; only the cloak of pride between them and their Lord
  read:
  - Jāmiʿ 67:8587.1-8587.2
  quran:
  - 55:72
  - 76:15-18
  - 43:71
  - 56:17-18
  tags:
  - motif: tent-of-hollow-pearl-sixty-miles
    refs:
    - Jāmiʿ 67:8587.1
    note: إن في الجنة خيمة من لؤلؤة مجوفة عرضها ستون ميلا في كل زاوية منها أهل ما يرون الآخرين
  - motif: two-gardens-silver-two-gold-cloak-of-pride
    refs:
    - Jāmiʿ 67:8587.1
    - Jāmiʿ 67:8587.2
    note: 'وما بين القوم وبين أن ينظروا إلى ربهم إلا رداء الكبر على وجهه في جنة عدن / جنان الفردوس أربع: ثنتان من ذهب ... وثنتان من فضة'
  - motif: rivers-gush-from-eden-then-divide
    refs:
    - Jāmiʿ 67:8587.2
    note: وهذه الأنهار تشخب من جنة عدن ثم تصدع بعد ذلك أنهارا
  hints:
  - Rivers that issue from Eden and then part into rivers (8587.2) against Gen 2:10, 'a river went out of Eden ... and from there it was parted and became four heads'.
- id: hadith-67-soil-of-paradise
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Domes of pearl and soil of musk; its soil a white flour (darmak); the Jews' question of hell's keepers - ten then nine
  read:
  - Jāmiʿ 67:8588.1-8588.3
  quran:
  - 4:153
  tags:
  - motif: paradise-domes-of-pearl-soil-of-musk
    refs:
    - Jāmiʿ 67:8588.1
    note: ثم أدخلت الجنة فإذا فيها جنابذ اللؤلؤ وإذا ترابها المسك
  - motif: soil-of-paradise-white-darmak-pure-musk
    refs:
    - Jāmiʿ 67:8588.2
    - Jāmiʿ 67:8588.3
    note: 'ابن صياد سأل النبي ﷺ عن تربة الجنة فقال: درمكة بيضاء مسك خالص / الخبز من الدرمك'
  - motif: jews-ask-number-of-hells-keepers-fingers-ten-and-nine
    refs:
    - Jāmiʿ 67:8588.3
    note: هل يعلم نبيكم كم عدد خزنة جهنم ... هكذا وهكذا في مرة عشرة وفي مرة تسعة ... ما تربة الجنة؟ ... خبزة يا أبا القاسم
- id: hadith-67-scent-of-paradise
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Who never smell paradise - the whip-bearers, the clothed-naked women, the killer of a protected person, the failing ruler, the false claimant of a father; the scent from forty, seventy, a hundred years
  read:
  - Jāmiʿ 67:8589.1-8590.4
  tags:
  - motif: men-with-whips-like-cows-tails
    refs:
    - Jāmiʿ 67:8589.1
    note: قوم معهم سياط كأذناب البقر يضربون بها الناس
  - motif: women-clothed-naked-heads-like-camel-humps
    refs:
    - Jāmiʿ 67:8589.1
    note: ونساء كاسيات عاريات مميلات مائلات رؤوسهن كأسنمة البخت المائلة لا يدخلن الجنة ولا يجدن ريحها
  - motif: killer-of-protected-person-never-smells-paradise
    refs:
    - Jāmiʿ 67:8589.2
    - Jāmiʿ 67:8589.3
    - Jāmiʿ 67:8589.4
    - Jāmiʿ 67:8590.1
    - Jāmiʿ 67:8590.2
    note: من قتل نفسا معاهدا لم يرح رائحة الجنة وإن ريحها ليوجد من مسيرة أربعين عاما / سبعين عاما / سبعين خريفا / مائة عام
  - motif: scent-of-paradise-from-forty-seventy-hundred-years
    refs:
    - Jāmiʿ 67:8589.2
    - Jāmiʿ 67:8589.3
    - Jāmiʿ 67:8590.1
    - Jāmiʿ 67:8590.3
    - Jāmiʿ 67:8590.4
    note: مسيرة أربعين عاما / سبعين عاما / مائة عام
  - motif: shepherd-who-fails-flock-denied-scent-of-paradise
    refs:
    - Jāmiʿ 67:8590.3
    note: 'من استرعي رعية فلم يحطهم بنصيحة لم يجد ريح الجنة ... قال ابن زياد: ألا كنت حدثتني بهذا قبل الآن'
  - motif: claimant-to-another-father-denied-scent-of-paradise
    refs:
    - Jāmiʿ 67:8590.4
    note: من ادعى إلى غير أبيه لم يرح رائحة الجنة
- id: hadith-67-bricks-of-gold-and-silver
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
