    refs:
    - Jāmiʿ 67:8591.1
    - Jāmiʿ 67:8591.2
    note: لبنة ذهب ولبنة فضة وملاطها المسك الأذفر وحصباؤها اللؤلؤ والياقوت وترابها الزعفران
  - motif: in-paradise-clothes-never-wear-youth-never-fades
    refs:
    - Jāmiʿ 67:8591.1
