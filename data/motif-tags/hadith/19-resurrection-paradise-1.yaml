  hints:
  - Walls of alternating gold and silver bricks (8591.1) against the heavenly Jerusalem of Rev 21:18-21, wall of jasper, city of pure gold, gates of pearl; and Tobit 13:16-17, Jerusalem built with sapphire, emerald and streets of gold.
- id: hadith-67-palaces
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Umar's palace of gold with a maid at its court - the prophet kept out by Umar's jealousy; al-Rumaysa and Bilal's footsteps
  read:
  - Jāmiʿ 67:8592.1-8592.2
  tags:
  - motif: palace-in-paradise-and-owners-jealousy
    refs:
    - Jāmiʿ 67:8592.1
    - Jāmiʿ 67:8592.2
    note: 'ورأيت قصرا بفنائه جارية فقلت: لمن هذا؟ فقال: لعمر ... فذكرت غيرتك ... أعليك أغار / بقصر من ذهب ... لشاب من قريش فظننت أني أنا هو'
  - motif: footsteps-of-bilal-heard-in-paradise
    refs:
    - Jāmiʿ 67:8592.1
    note: 'وسمعت خشفة فقلت: من هذا؟ فقال: هذا بلال'
  - motif: rumaysa-seen-in-paradise
    refs:
    - Jāmiʿ 67:8592.1
    note: فإذا أنا بالرميصاء امرأة أبي طلحة
- id: hadith-67-great-tree
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: A tree whose shade a rider on a lean swift horse cannot cross in a hundred years
  read:
  - Jāmiʿ 67:8592.3-8593.4
  quran:
  - '56:30'
  tags:
  - motif: paradise-tree-shade-hundred-years-ride
    refs:
    - Jāmiʿ 67:8592.3
    - Jāmiʿ 67:8593.1
    - Jāmiʿ 67:8593.2
    - Jāmiʿ 67:8593.3
    - Jāmiʿ 67:8593.4
    note: إن في الجنة شجرة يسير الراكب الجواد المضمر السريع مائة عام ما يقطعها / ﴿وظل ممدود﴾
- id: hadith-67-degrees
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: A hundred degrees as heaven from earth, al-Firdaws the highest under the Throne; al-Wasila; a degree for each arrow; 'many gardens' for Haritha
  read:
  - Jāmiʿ 67:8594.1-8595.2
  quran:
  - '8:4'
  - '23:11'
  tags:
  - motif: hundred-degrees-firdaws-under-throne
    refs:
    - Jāmiʿ 67:8594.1
    - Jāmiʿ 67:8594.2
    - Jāmiʿ 67:8595.1
    note: إن في الجنة مائة درجة أعدها اللَّه للمجاهدين ... كل درجتين ما بينهما كما بين السماء والأرض ... فسلوه الفردوس فإنه أوسط الجنة وأعلى الجنة وفوقه عرش الرحمن ومنه تفجر أنهار الجنة
  - motif: wasila-a-station-for-one-servant
    refs:
    - Jāmiʿ 67:8594.3
    note: ثم سلوا اللَّه لي الوسيلة فإنها منزلة في الجنة لا تنبغي إلا لعبد من عباد اللَّه وأرجو أن أكون أنا هو
  - motif: arrow-reaching-target-a-degree-in-paradise
    refs:
    - Jāmiʿ 67:8594.4
    note: حاصرنا ... حصن الطائف ... من بلغ بسهم فله درجة في الجنة ... فبلغت يومئذ ستة عشر سهما
  - motif: many-gardens-highest-firdaws
    refs:
    - Jāmiʿ 67:8595.2
    note: ويحك أوهبلت أوجنة واحدة هي؟ إنها جنان كثيرة وإنه لفي جنة الفردوس
- id: hadith-67-a-whips-length
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: A bow's length or a whip's place in paradise is better than the world; a woman of paradise looking down would light and scent all between
  read:
  - Jāmiʿ 67:8595.3-8596.3
  tags:
  - motif: whip-space-in-paradise-better-than-world
    refs:
    - Jāmiʿ 67:8595.3
    - Jāmiʿ 67:8596.1
    - Jāmiʿ 67:8596.2
    - Jāmiʿ 67:8596.3
    note: ولقاب قوس أحدكم أو موضع قدم من الجنة خير من الدنيا وما فيها / موضع سوط في الجنة / قيد سوط أحدكم
  - motif: woman-of-paradise-looking-down-would-light-earth
    refs:
    - Jāmiʿ 67:8595.3
    - Jāmiʿ 67:8596.3
    note: ولو أن امرأة من نساء أهل الجنة اطلعت إلى الأرض لأضاءت ما بينهما ولملأت ما بينهما ريحا ولنصيفها -يعني الخمار- خير من الدنيا وما فيها
- id: hadith-67-napkins-of-saad
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Saad b. Muadh's napkins in paradise finer than a gifted silk robe
  read:
  - Jāmiʿ 67:8596.4
  tags:
  - motif: napkins-of-saad-in-paradise-better-than-silk
    refs:
    - Jāmiʿ 67:8596.4
    note: أهدي للنبي ﷺ جبة سندس ... لمناديل سعد بن معاذ في الجنة أحسن من هذا
- id: hadith-67-fruits-of-paradise
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Fruits - the lote tree's moths of gold and jar-like fruit, thorns turned into fruits of seventy colours, Tuba like a walnut tree, a grape cluster a crow's month; the cluster reached for in prayer
  read:
  - Jāmiʿ 67:8597.1-8599.3
  quran:
  - '2:25'
  - 55:68
  - '56:28'
  tags:
  - motif: lote-fruit-like-jars-leaves-like-elephant-ears
    refs:
    - Jāmiʿ 67:8597.1
    note: سدرة المنتهى ... يسير الراكب في ظل الفنن منها مائة سنة ... فيها فراش الذهب كأن ثمرها القلال
  - motif: thorns-of-lote-and-acacia-become-fruits-of-many-colours
    refs:
    - Jāmiʿ 67:8597.2
    - Jāmiʿ 67:8597.3
    note: يخضد اللَّه شوكه فيجعل مكان كل شوكة ثمرة ... عن اثنين وسبعين لونا / مثل خصوة التيس الملبود ... فيها سبعون لونا من الطعام
  - motif: tuba-tree-like-walnut-of-syria
    refs:
    - Jāmiʿ 67:8598.1
    note: شجرة تدعى طوبى هي تطابق الفردوس ... تشبه شجرة في الشام تدعى الجوزة تنبت على ساق واحد ثم ينتشر أعلاها ... لو ارتحلت جذعة ... حتى تنكسر ترقوتها هرما
  - motif: grape-cluster-a-crows-month-grape-feeds-a-household
    refs:
    - Jāmiʿ 67:8598.1
    note: 'ما عظم العنقود منها؟ قال: مسيرة شهر للغراب الأبقع لا ينثني ولا يفتر ... فإن تلك الحبة تشبعني وأهل بيتي ... وعامة عشيرتك'
  - motif: pool-a-months-journey-cups-like-stars
    refs:
    - Jāmiʿ 67:8598.1
    note: كما بين البيضاء إلى بصرى يمدني اللَّه فيه بكراع
  - motif: seventy-thousand-without-reckoning
    refs:
    - Jāmiʿ 67:8598.1
    note: سبعين ألفا بغير حساب ثم يشفع كل ألف بسبعين ألفا ثم يحثي ربي بكفيه ثلاث حثيات
  - motif: grape-cluster-of-paradise-reached-for
    refs:
    - Jāmiʿ 67:8599.1
    - Jāmiʿ 67:8599.2
    - Jāmiʿ 67:8599.3
    note: فتناولت عنقودا ولو أصبته لأكلتم منه ما بقيت الدنيا / دالية قطوفها دانية حبها كالدباء ... فأوحي إليها أن استأخري
  - motif: fire-shown-between-prophet-and-ranks-saw-shadows
    refs:
    - Jāmiʿ 67:8599.3
    note: ثم عرضت علي النار بيني وبينكم حتى رأيت ظلي وظلكم ... فلم أر لي عليكم فضلا إلا بالنبوة
  hints:
  - A single grape cluster too great to carry (8598.1) against Num 13:23, the cluster of Eshcol borne on a pole between two men, and the rabbinic future vine whose grape fills a ship or a jar (b. Ketubot 111b; 2 Baruch 29:5, a thousand grapes to a cluster).
- id: hadith-67-first-food
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: First food of paradise - the lobe of the fish's liver; the earth one loaf for the guests; 'Balam and Nun', ox and fish, their liver lobe feeds seventy thousand
  read:
  - Jāmiʿ 67:8600.1-8601.2
  quran:
  - 2:97
  - '14:48'
  - '76:18'
  tags:
  - motif: three-questions-only-a-prophet-knows
    refs:
    - Jāmiʿ 67:8600.1
    note: إني سائلك عن ثلاث لا يعلمهن إلا نبي ... نار تحشر الناس من المشرق إلى المغرب ... زيادة كبد حوت ... إذا سبق ماء الرجل ماء المرأة نزع الولد
  - motif: first-food-of-paradise-fish-liver-lobe
    refs:
    - Jāmiʿ 67:8600.1
    note: وأما أول طعام أهل الجنة فزيادة كبد حوت
  - motif: gabriel-enemy-of-jews-among-angels
    refs:
    - Jāmiʿ 67:8600.1
    note: 'قال: جبريل؟ قال: نعم قال: ذاك عدو اليهود من الملائكة'
  - motif: earth-becomes-one-loaf-for-paradise-guests
    refs:
    - Jāmiʿ 67:8601.1
    note: تكون الأرض يوم القيامة خبزة واحدة يكفؤها الجبار بيده كما يكفأ أحدكم خبزته في السفر نزلا لأهل الجنة
  - motif: balam-and-nun-ox-and-fish-liver-lobe-feeds-seventy-thousand
    refs:
    - Jāmiʿ 67:8601.1
    note: 'إدامهم بالام ونون قالوا: وما هذا؟ قال: ثور ونون يأكل من زائدة كبدهما سبعون ألفا'
  - motif: rabbis-questions-darkness-fish-liver-ox
    refs:
    - Jāmiʿ 67:8601.2
    note: هم في الظلمة دون الجسر ... فقراء المهاجرين ... زيادة كبد النون ... ينحر لهم ثور الجنة الذي كان يأكل من أطرافها ... عين فيها تسمى سلسبيلا
  - motif: rabbi-calls-him-by-the-name-his-family-gave
    refs:
    - Jāmiʿ 67:8601.2
    note: السلام عليك يا محمد فدفعته ... إنما ندعوه باسمه الذي سماه به أهله ... إن اسمي محمد الذي سماني به أهلي
  hints:
  - The ox and the great fish (nun) eaten by the blessed (8601.1-8601.2) against the Behemoth and Leviathan feast of the righteous (b. Bava Batra 74b-75a; 2 Baruch 29:4; 1 Enoch 60:7-9, 24); the hadith's 'Balam' is given as 'ox' as Behemoth is the land beast of Job 40:15.
- id: hadith-67-birds-of-paradise
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Birds by al-Kawthar with necks like camels' - 'those who eat them are finer'
  read:
  - Jāmiʿ 67:8601.3
  quran:
  - '56:21'
  tags:
  - motif: paradise-birds-with-necks-like-camels
    refs:
    - Jāmiʿ 67:8601.3
    note: 'فيها طير أعناقها كأعناق الجزر قال عمر: إن هذه لناعمة قال: أكلتها أحسن منها'
- id: hadith-67-rivers-of-paradise
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Seas of water, honey, milk and wine; rivers from hills of musk; Sayhan, Jayhan, Euphrates and Nile from paradise; two hidden and two visible rivers at the Lote Tree
  read:
  - Jāmiʿ 67:8602.1-8604.1
  quran:
  - '47:15'
  tags:
  - motif: four-seas-water-honey-milk-wine-then-rivers
    refs:
    - Jāmiʿ 67:8602.1
    note: إن في الجنة بحر الماء وبحر العسل وبحر اللبن وبحر الخمر ثم تشقق الأنهار بعد
  - motif: hundred-degrees-firdaws-under-throne
    refs:
    - Jāmiʿ 67:8602.2
    - Jāmiʿ 67:8602.3
    note: والفردوس أعلاها درجة ومنها تفجر أنهار الجنة الأربعة ومن فوقها يكون العرش
  - motif: rivers-of-paradise-from-hills-of-musk
    refs:
    - Jāmiʿ 67:8603.1
    note: أنهار الجنة تخرج من تلال -أو من تحت جبال- مسك
  - motif: children-of-believers-playing-between-two-rivers
    refs:
    - Jāmiʿ 67:8603.2
    note: فإذا أنا بالغلمان يلعبون بين نهرين ... هؤلاء ذراري المؤمنين
  - motif: abraham-moses-jesus-drinking-wine-awaiting-him
    refs:
    - Jāmiʿ 67:8603.2
    note: فإذا أنا بثلاثة يشربون من خمر لهم ... هذا إبراهيم وموسى وعيسى وهم ينتظرونك
  - motif: sayhan-jayhan-euphrates-nile-from-paradise
    refs:
    - Jāmiʿ 67:8603.3
    - Jāmiʿ 67:8603.4
    note: سيحان وجيحان والفرات والنيل كل من أنهار الجنة / فجرت أربعة أنهار من الجنة
  - motif: four-rivers-from-root-of-the-lote-tree
    refs:
    - Jāmiʿ 67:8604.1
    note: في أصلها أربعة أنهار نهران باطنان ونهران ظاهران ... أما الباطنان ففي الجنة وأما الظاهران النيل والفرات
  - motif: lote-fruit-like-jars-leaves-like-elephant-ears
    refs:
    - Jāmiʿ 67:8604.1
    note: فإذا نبقها كأنه قلال هجر وورقها كأنه آذان الفيول
  hints:
  - Four rivers of paradise, two named Euphrates and Nile, with Sayhan and Jayhan (8603.3) against Gen 2:10-14, the four heads Pishon, Gihon, Tigris and Euphrates - Jayhan echoing Gihon.
- id: hadith-67-wives-sing
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The wives of paradise sing in the finest voices - 'we are the good and beautiful ... the immortal, the safe, the abiding'
  read:
  - Jāmiʿ 67:8604.2
  quran:
  - 43:70
  - '30:15'
  tags:
  - motif: wives-of-paradise-sing-we-are-the-immortal
    refs:
    - Jāmiʿ 67:8604.2
    note: إن أزواج أهل الجنة ليغنين أزواجهن بأحسن أصوات ... نحن الخيرات الحسان أزواج قوم كرام ... نحن الخالدات فلا يمتنه نحن الآمنات فلا يخفنه نحن المقيمات فلا يظعنه
- id: hadith-67-friday-market
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: A market every Friday where the north wind blows in faces and clothes; each finds the other more beautiful on return
  read:
  - Jāmiʿ 67:8605.1
  tags:
  - motif: friday-market-north-wind-adds-beauty
    refs:
    - Jāmiʿ 67:8605.1
    note: إن في الجنة لسوقا يأتونها كل جمعة فتهب ريح الشمال فتحثو في وجوههم وثيابهم فيزدادون حسنا وجمالا ... واللَّه لقد ازددتم بعدنا حسنا وجمالا
- id: hadith-67-ornaments
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: A bracelet of paradise would efface the sun as the sun the stars; ornament reaches where ablution reached; forgo wine and silk here
  read:
  - Jāmiʿ 67:8606.1-8606.3
  quran:
  - '22:23'
  - '18:31'
  tags:
  - motif: paradise-bracelet-effaces-sun-as-sun-the-stars
    refs:
    - Jāmiʿ 67:8606.1
    note: لو أن رجلا من أهل الجنة اطلع فبدا أساوره لطمس ضوء الشمس كما تطمس الشمس ضوء النجوم ... ما يقل ظفر
  - motif: ornament-reaches-where-ablution-reaches
    refs:
    - Jāmiʿ 67:8606.2
    note: فكان يمد يده حتى تبلغ إبطه ... يا بني فروخ ... تبلغ الحلية من المؤمن حيث يبلغ الوضوء
  - motif: forgo-wine-and-silk-here-to-have-them-there
    refs:
    - Jāmiʿ 67:8606.3
    note: من سره أن يسقيه اللَّه الخمر في الآخرة فليتركها في الدنيا ومن سره أن يكسوه اللَّه الحرير في الآخرة فليتركه في الدنيا
  - motif: rivers-of-paradise-from-hills-of-musk
    refs:
    - Jāmiʿ 67:8606.3
    note: أنهار الجنة تفجر من تحت تلال -أو من تحت جبال- المسك
- id: hadith-67-no-eye-has-seen
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: What no eye has seen, no ear heard, no heart conceived; Moses asks the lowest and highest rank
  read:
  - Jāmiʿ 67:8607.1-8607.3
  quran:
  - 32:16-17
  tags:
  - motif: what-no-eye-has-seen-no-ear-heard
    refs:
    - Jāmiʿ 67:8607.1
    - Jāmiʿ 67:8607.2
    - Jāmiʿ 67:8607.3
    note: أعددت لعبادي الصالحين ما لا عين رأت ولا أذن سمعت ولا خطر على قلب بشر ذخرا بله ما أطلعتم عليه
  - motif: moses-asks-lowest-and-highest-rank-in-paradise
    refs:
    - Jāmiʿ 67:8607.3
    note: سأل موسى ربه ما أدنى أهل الجنة منزلة ... مثل ملك ملك من ملوك الدنيا ... ومثله ومثله ومثله ومثله ... وعشرة أمثاله ... غرست كرامتهم بيدي وختمت عليها
  hints:
  - '''What no eye has seen, no ear heard, nor has entered the heart of man'' (8607.2) against 1 Cor 2:9, ''eye hath not seen, nor ear heard, neither have entered into the heart of man, the things which God hath prepared for them that love him'', itself after Isa 64:4.'
- id: hadith-67-not-by-deeds
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: No one's deed brings him into paradise - 'not even you?' - 'not even I, unless God covers me with mercy'
  read:
  - Jāmiʿ 67:8609.1-8609.4
  tags:
  - motif: none-enters-paradise-by-deeds-not-even-prophet
    refs:
    - Jāmiʿ 67:8609.1
    - Jāmiʿ 67:8609.2
    - Jāmiʿ 67:8609.3
    - Jāmiʿ 67:8609.4
    note: 'لن يدخل أحدا عمله الجنة قالوا: ولا أنت يا رسول اللَّه؟ قال: لا ولا أنا إلا أن يتغمدني اللَّه بفضل ورحمة'
  - motif: do-not-wish-for-death-good-may-increase-bad-may-repent
    refs:
    - Jāmiʿ 67:8609.1
    note: ولا يتمنين أحدكم الموت إما محسنا فلعله أن يزداد خيرا وإما مسيئا فلعله أن يستعتب
  - motif: most-beloved-deed-most-constant
    refs:
    - Jāmiʿ 67:8609.2
    note: واعلموا أن أحب العمل إلى اللَّه أدومه وإن قل
- id: hadith-67-first-at-the-door
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: First to knock - the keeper asks 'who are you?' and is told 'open for none before you'; the last and first community
  read:
  - Jāmiʿ 67:8610.1-8610.3
  tags:
  - motif: prophet-hopes-most-followers-on-judgment-day
    refs:
    - Jāmiʿ 67:8610.1
    note: أنا أكثر الأنبياء تبعا يوم القيامة وأنا أول من يقرع باب الجنة
  - motif: keeper-told-open-for-none-before-muhammad
    refs:
    - Jāmiʿ 67:8610.2
    note: 'آتي باب الجنة يوم القيامة فأستفتح فيقول الخازن: من أنت؟ فأقول: محمد فيقول: بك أمرت لا أفتح لأحد قبلك'
  - motif: jews-saturday-christians-sunday-us-friday
    refs:
    - Jāmiʿ 67:8610.3
    note: نحن الآخرون الأولون ... ونحن أول من يدخل الجنة ... فاليوم لنا وغدا لليهود وبعد غد للنصارى
- id: hadith-67-only-believers-enter
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Only a Muslim soul enters - proclaimed in the days of Mina and after Khaybar over the man in a stolen cloak
  read:
  - Jāmiʿ 67:8610.4-8611.2
  tags:
  - motif: only-a-muslim-soul-enters-paradise
    refs:
    - Jāmiʿ 67:8610.4
    - Jāmiʿ 67:8611.1
    - Jāmiʿ 67:8611.2
    note: إن الجنة لا يدخلها إلا نفس مسلمة / أنه لا يدخل الجنة إلا مؤمن / ألا إنه لا يدخل الجنة إلا المؤمنون
  - motif: days-of-mina-days-of-eating-and-drinking
    refs:
    - Jāmiʿ 67:8611.1
    note: بعثه وأوس بن الحدثان أيام التشريق فناديا ... وأيام منى أيام أكل وشرب
  - motif: stolen-cloak-burns-in-fire
    refs:
    - Jāmiʿ 67:8611.2
    note: فلان شهيد ... كلا إني رأيته في النار في بردة غلها أو عباءة ... يا ابن الخطاب اذهب فناد في الناس
- id: hadith-67-abraham-and-his-father
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Abraham meets Azar with dust on his face; 'which shame is worse than my remote father?'; the father turned into a filthy hyena and thrown in
  read:
  - Jāmiʿ 67:8611.3-8611.4
  quran:
  - 26:87
  tags:
  - motif: abraham-meets-father-at-resurrection
    refs:
    - Jāmiʿ 67:8611.3
    - Jāmiʿ 67:8611.4
    note: يلقى إبراهيم أباه آزر يوم القيامة وعلى وجه آزر قترة وغبرة / ليأخذن رجل بيد أبيه ... كان أصحاب محمد ﷺ يرون أنه إبراهيم
  - motif: father-says-today-i-will-not-disobey
    refs:
    - Jāmiʿ 67:8611.3
    note: 'ألم أقل لك لا تعصني فيقول أبوه: فاليوم لا أعصيك'
  - motif: abraham-reminds-god-of-promise-not-to-disgrace-him
    refs:
    - Jāmiʿ 67:8611.3
    note: يا رب إنك وعدتني أن لا تخزيني يوم يبعثون فأي خزي أخزى من أبي الأبعد ... إني حرمت الجنة على الكافرين
  - motif: azar-turned-into-a-hyena
    refs:
    - Jāmiʿ 67:8611.3
    - Jāmiʿ 67:8611.4
    note: فإذا هو بذيخ ملتطخ فيؤخذ بقوائمه فيلقى في النار / فيتحول في صورة قبيحة وريح منتنة فيتركه
- id: hadith-67-whom-you-love
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: '"When is the Hour?" - "What have you prepared?" - "Love of God and his messenger" - "You are with whom you love"'
  read:
  - Jāmiʿ 67:8612.1
  tags:
  - motif: you-are-with-whom-you-love
    refs:
    - Jāmiʿ 67:8612.1
    note: 'متى الساعة؟ ... ما أعددت لها؟ قال: حب اللَّه ورسوله قال: أنت مع من أحببت'
- id: hadith-67-witness-of-unity
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Who dies witnessing unity enters - 'even if he stole and fornicated', Gabriel in the harra; Muadh's deathbed report
  read:
  - Jāmiʿ 67:8612.2-8613.3
  quran:
  - 4:171
  tags:
  - motif: confession-of-unity-opens-eight-gates
    refs:
    - Jāmiʿ 67:8612.2
    note: وأن عيسى عبد اللَّه ورسوله وكلمته ألقاها إلى مريم وروح منه ... أدخله اللَّه الجنة على ما كان من العمل
  - motif: gabriel-says-even-if-he-stole-and-fornicated
    refs:
    - Jāmiʿ 67:8612.3
    note: 'ذلك جبريل عرض لي في جانب الحرة قال: بشر أمتك أنه من مات لا يشرك باللَّه شيئا دخل الجنة ... وإن سرق وإن زنى ... وإن شرب الخمر'
  - motif: the-most-are-the-least
    refs:
    - Jāmiʿ 67:8612.3
    note: إن المكثرين هم المقلون يوم القيامة إلا من أعطاه اللَّه خيرا فنفح فيه يمينه وشماله
  - motif: dies-associating-enters-fire
    refs:
    - Jāmiʿ 67:8613.1
    note: 'من مات يشرك باللَّه شيئا دخل النار وقلت أنا: من مات لا يشرك باللَّه شيئا دخل الجنة'
  - motif: sincere-shahada-from-heart-fire-does-not-touch
    refs:
    - Jāmiʿ 67:8613.2
    - Jāmiʿ 67:8613.3
    note: صادقا من قلبه دخل الجنة / اكشفوا عني سجف القبة ... مخلصا من قلبه أو يقينا من قلبه دخل الجنة ولم تمسه النار
- id: hadith-67-conditions-for-paradise
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: All enter but who refuses; guard what is between jaws and legs; the spender of pairs met by the gate-keepers; the bereaved who bears it
  read:
  - Jāmiʿ 67:8614.1-8615.1
  quran:
  - '51:49'
  tags:
  - motif: all-enter-paradise-but-who-refuses
    refs:
    - Jāmiʿ 67:8614.1
    note: كل أمتي يدخلون الجنة إلا من أبى ... من أطاعني دخل الجنة ومن عصاني فقد أبى
  - motif: guarantee-what-is-between-jaws-and-legs
    refs:
    - Jāmiʿ 67:8614.2
    note: من يضمن لي ما بين لحييه وما بين رجليه أضمن له الجنة
  - motif: spender-of-pairs-called-by-every-gatekeeper
    refs:
    - Jāmiʿ 67:8614.3
    note: من أنفق زوجين من ماله ابتدرته حجبة الجنة ... إن كانت رجالا فرجلان وإن كانت خيلا ففرسان وإن كانت إبلا فبعيران
  - motif: abu-dharr-waters-his-camels-at-rabadha
    refs:
    - Jāmiʿ 67:8614.3
    note: قد تلقاني برواحل قد أوردها ثم أصدرها وقد أعلق قربة في عنق بعير منها ... لي عملي
  - motif: bereaved-of-dearest-who-bears-it-has-paradise
    refs:
    - Jāmiʿ 67:8615.1
    note: ما لعبدي المؤمن عندي جزاء إذا قبضت صفيه من أهل الدنيا ثم احتسبه إلا الجنة
- id: hadith-67-in-chains-and-bird-hearts
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: God wonders at people led into paradise in chains; people with hearts like birds' enter
  read:
  - Jāmiʿ 67:8615.2-8615.4
  tags:
  - motif: brought-to-paradise-in-chains
    refs:
    - Jāmiʿ 67:8615.2
    - Jāmiʿ 67:8615.3
    note: عجب اللَّه من قوم يدخلون الجنة في السلاسل / قوم يساقون إلى الجنة مقرنين في السلاسل
  - motif: hearts-like-birds-hearts-enter-paradise
    refs:
    - Jāmiʿ 67:8615.4
    note: يدخل الجنة أقوام أفئدتهم مثل أفئدة الطير
- id: hadith-67-poor-before-rich
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The poor emigrants precede the rich by forty autumns or five hundred years; light like the sun; blessed are the strangers; angels sent to greet the frontier poor
  read:
  - Jāmiʿ 67:8616.1-8618.1
  quran:
  - '13:24'
  - '14:48'
  tags:
  - motif: poor-enter-before-rich-forty-autumns-or-five-hundred-years
    refs:
    - Jāmiʿ 67:8616.1
    - Jāmiʿ 67:8616.2
    - Jāmiʿ 67:8616.3
    note: إن فقراء المهاجرين يسبقون الأغنياء يوم القيامة إلى الجنة بأربعين خريفا / بخمسمائة سنة / بخمس مئة عام
  - motif: poor-emigrants-light-like-the-sun
    refs:
    - Jāmiʿ 67:8617.1
    note: يأتي اللَّه قوم يوم القيامة نورهم كنور الشمس ... الفقراء والمهاجرون الذين يحشرون من أقطار الأرض
  - motif: blessed-are-the-strangers
    refs:
    - Jāmiʿ 67:8617.1
    note: طوبى للغرباء (ثلاثا) ... ناس صالحون في ناس سوء كثير من يعصيهم أكثر ممن يطيعهم
  - motif: angels-greet-poor-emigrants-at-every-gate
    refs:
    - Jāmiʿ 67:8617.2
    note: 'الذين تسد بهم الثغور ... ويموت أحدهم وحاجته في صدره ... ائتوهم فحيوهم فتقول الملائكة: نحن سكان سمائك ... أفتأمرنا أن نأتي هؤلاء ... ﴿سلام عليكم بما صبرتم﴾'
  - motif: poor-first-in-while-rich-and-rulers-reckoned-chairs-of-light
    refs:
    - Jāmiʿ 67:8617.3
    note: أين فقراء هذه الأمة ومساكينها ... ابتليتنا فصبرنا ... ويبقى شدة الحساب على ذوي الأموال والسلطان ... يوضع لهم كراسي من نور وتظلل عليهم الغمام
  - motif: poor-emigrants-cross-first
    refs:
    - Jāmiʿ 67:8618.1
    note: 'فمن أول الناس إجازة؟ قال: فقراء المهاجرين'
  - motif: rabbis-questions-darkness-fish-liver-ox
    refs:
    - Jāmiʿ 67:8618.1
    note: 'هم في الظلمة دون الجسر ... فمن أول الناس إجازة؟ قال: فقراء المهاجرين'
  hints:
  - '''Blessed are the poor'' who precede the rich (8616.1-8617.3) against Luke 6:20-24, ''blessed be ye poor ... woe unto you that are rich''; the angels sent to greet them saying ''peace on you for your patience'' against Luke 16:22, Lazarus carried by angels.'
- id: hadith-67-rancor-removed
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Rancor drawn from breasts on the bridge between paradise and fire before entry
  read:
  - Jāmiʿ 67:8619.1
  quran:
  - '15:47'
  tags:
  - motif: believers-held-on-bridge-for-retaliation
    refs:
    - Jāmiʿ 67:8619.1
    note: فيحبسون على قنطرة بين الجنة والنار ... حتى إذا هذبوا ونقوا أذن لهم في دخول الجنة
- id: hadith-67-seventy-thousand
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Seventy thousand without reckoning - who neither cauterize, seek charms nor take omens; Ukkasha's request; Moses's great crowd; seventy thousand with each thousand and three handfuls
  read:
  - Jāmiʿ 67:8620.1-8626.2
  tags:
  - motif: seventy-thousand-without-reckoning
    refs:
    - Jāmiʿ 67:8620.1
    - Jāmiʿ 67:8621.1
    - Jāmiʿ 67:8621.2
    - Jāmiʿ 67:8621.3
    - Jāmiʿ 67:8621.4
    - Jāmiʿ 67:8622.1
    - Jāmiʿ 67:8622.2
    - Jāmiʿ 67:8622.3
    - Jāmiʿ 67:8622.4
    - Jāmiʿ 67:8623.1
    note: هذه أمتك ومعهم سبعون ألفا يدخلون الجنة بغير حساب ولا عذاب
  - motif: no-charms-no-cautery-no-omens-trust-in-lord
    refs:
    - Jāmiʿ 67:8620.1
    - Jāmiʿ 67:8622.2
    - Jāmiʿ 67:8622.4
    note: هم الذين لا يرقون ولا يسترقون ولا يتطيرون وعلى ربهم يتوكلون / لا يكتوون
  - motif: ukkasha-beat-you-to-it
    refs:
    - Jāmiʿ 67:8620.1
    - Jāmiʿ 67:8621.1
    - Jāmiʿ 67:8621.2
    - Jāmiʿ 67:8622.2
    - Jāmiʿ 67:8622.4
    - Jāmiʿ 67:8623.1
    note: 'فقام عكاشة بن محصن فقال: ادع اللَّه أن يجعلني منهم ... سبقك بها عكاشة'
  - motif: prophets-shown-with-their-followers
    refs:
    - Jāmiʿ 67:8620.1
    - Jāmiʿ 67:8622.4
    - Jāmiʿ 67:8623.1
    note: فرأيت النبي ومعه الرهيط ... والنبي ليس معه أحد ... هذا موسى وقومه ... فإذا الظراب ظراب مكة قد سد بوجوه الرجال ... فإذا الأفق قد سد
  - motif: no-charm-except-for-eye-or-sting
    refs:
    - Jāmiʿ 67:8620.1
    note: أيكم رأى الكوكب الذي انقض البارحة ... لدغت ... استرقيت ... لا رقية إلا من عين أو حمة
  - motif: first-band-faces-like-full-moon
    refs:
    - Jāmiʿ 67:8621.2
    - Jāmiʿ 67:8621.3
    - Jāmiʿ 67:8621.4
    - Jāmiʿ 67:8622.1
    note: زمرة هي سبعون ألفا تضيء وجوههم إضاءة القمر / ثم الذين يلونهم كأضوأ نجم في السماء
  - motif: seventy-thousand-enter-holding-hands-abreast
    refs:
    - Jāmiʿ 67:8622.1
    note: سبعون ألفا أو سبعمائة ألف ... متماسكون آخذ بعضهم بعضا لا يدخل أولهم حتى يدخل آخرهم
  - motif: seventy-thousand-with-each-thousand-and-three-handfuls
    refs:
    - Jāmiʿ 67:8623.2
    - Jāmiʿ 67:8624.1
    - Jāmiʿ 67:8624.2
    - Jāmiʿ 67:8625.1
    - Jāmiʿ 67:8625.2
    - Jāmiʿ 67:8626.1
    - Jāmiʿ 67:8626.2
    note: مع كل ألف سبعون ألفا وزادني ثلاث حثيات / ثم يحثي ربي بكفيه ثلاث حثيات / فحثا بيده
  - motif: few-as-red-flies-among-flies
    refs:
    - Jāmiʿ 67:8623.2
    note: ما أولئك في أمتك إلا كالذباب الأصهب في الذبان
  - motif: completed-from-the-bedouin
    refs:
    - Jāmiʿ 67:8624.1
    - Jāmiʿ 67:8625.2
    note: 'إن لم يكن هؤلاء مهاجري أمتي قال: إذن أكملهم لك من الأعراب'
  - motif: thawban-letter-shames-governor-into-visiting
    refs:
    - Jāmiʿ 67:8625.1
    note: فإنه لو كان لموسى وعيسى مولى بحضرتك لعدته
  - motif: god-could-admit-all-with-one-handful
    refs:
    - Jāmiʿ 67:8626.2
    note: إن شاء اللَّه أدخلهم الجنة بحفنة واحدة
- id: hadith-67-share-of-paradise
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: A quarter, a third, a half of paradise - like a white hair on a black ox; Adam told to bring out 999 of every thousand; 120 rows, eighty of this community
  read:
  - Jāmiʿ 67:8628.1-8630.1
  quran:
  - 22:1-2
  tags:
  - motif: hope-to-be-quarter-third-half-of-paradise
    refs:
    - Jāmiʿ 67:8628.1
    - Jāmiʿ 67:8628.2
    - Jāmiʿ 67:8628.3
    note: أترضون أن تكونوا ربع أهل الجنة ... ثلث ... شطر ... إني لأرجو أن تكونوا نصف أهل الجنة
  - motif: believers-like-white-hair-on-black-ox
    refs:
    - Jāmiʿ 67:8628.1
    - Jāmiʿ 67:8628.2
    - Jāmiʿ 67:8629.1
    - Jāmiʿ 67:8629.2
    - Jāmiʿ 67:8629.3
    note: كالشعرة البيضاء في جلد الثور الأسود أو كالشعرة السوداء في جلد الثور الأحمر / الرقمة في ذراع الحمار / كالشامة في جنب البعير
  - motif: nine-hundred-ninety-nine-of-every-thousand-to-fire
    refs:
    - Jāmiʿ 67:8628.2
    - Jāmiʿ 67:8629.2
    - Jāmiʿ 67:8629.3
    note: يا آدم ... أخرج بعث النار ... من كل ألف تسع مائة وتسعة وتسعين
  - motif: ninety-nine-of-every-hundred-to-fire
    refs:
    - Jāmiʿ 67:8629.1
    note: أخرج من كل مائة تسعة وتسعين
  - motif: gog-and-magog-make-up-the-numbers
    refs:
    - Jāmiʿ 67:8628.2
    - Jāmiʿ 67:8629.2
    note: 'فإن من يأجوج ومأجوج ألفا ومنكم رجل / خليقتين ما كانتا مع شيء قط إلا كثرتاه: يأجوج ومأجوج'
  - motif: adam-called-first-shown-his-progeny
    refs:
    - Jāmiʿ 67:8629.1
    note: 'أول من يدعى يوم القيامة آدم فتراءى ذريته فيقال: هذا أبوكم آدم'
  - motif: paradise-hundred-twenty-rows-eighty-of-this-community
    refs:
    - Jāmiʿ 67:8630.1
    note: أهل الجنة عشرون ومائة صف ثمانون منها من هذه الأمة وأربعون من سائر الأمم
- id: hadith-67-few-women
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Women the fewest dwellers of paradise - as rare as a red-billed, red-legged crow among crows
  read:
