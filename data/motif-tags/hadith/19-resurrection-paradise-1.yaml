  title: The Jahannamiyyun - scorched ones brought out, washed in the river of life, at the lowest of paradise; could host the whole world
  read:
  - Jāmiʿ 67:8631.1-8633.2
  tags:
  - motif: scorched-ones-called-jahannamiyyun
    refs:
    - Jāmiʿ 67:8631.1
    - Jāmiʿ 67:8631.2
    - Jāmiʿ 67:8631.3
    - Jāmiʿ 67:8633.1
    note: يخرج قوم من النار بعد ما مسهم منها سفع فيدخلون الجنة فيسميهم أهل الجنة الجهنميين / منتنين قد محشتهم النار
  - motif: lowest-jahannami-could-feed-all-the-world
    refs:
    - Jāmiʿ 67:8631.3
    note: فيكونون في أدنى الجنة ... لو أضاف أحدهم أهل الدنيا لأطعمهم وسقاهم ولحفهم وفرشهم ... وزوجهم
  - motif: brought-out-of-fire-like-small-cucumbers
    refs:
    - Jāmiʿ 67:8632.1
    - Jāmiʿ 67:8633.2
    note: كأنهم الثعارير ... الضغابيس
  - motif: sinners-made-charcoal-then-sprout-by-river
    refs:
    - Jāmiʿ 67:8631.3
    - Jāmiʿ 67:8632.2
    - Jāmiʿ 67:8632.3
    - Jāmiʿ 67:8633.2
    note: فيلقون في نهر الحياة فينبتون كما تنبت الحبة في حميل السيل ... ألم تروا أنها تنبت صفراء ملتوية / صاروا فحما
  - motif: fire-spares-marks-of-prostration
    refs:
    - Jāmiʿ 67:8632.3
    note: تأكل النار من ابن آدم إلا أثر السجود
  - motif: freed-of-god-with-seals-on-necks
    refs:
    - Jāmiʿ 67:8633.2
    note: هؤلاء عتقاء اللَّه من النار
  - motif: successor-heard-it-from-thirty-companions
    refs:
    - Jāmiʿ 67:8633.2
    note: إليك عني يا علج فلو لم أسمعه من أكثر من ثلاثين من أصحاب رسول اللَّه ﷺ لم أحدث به
- id: hadith-67-souls-as-birds
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Martyrs' souls in green birds with lamps hung from the Throne; the believer's soul a bird feeding in paradise's trees until returned to its body
  read:
  - Jāmiʿ 67:8633.3-8634.1
  quran:
  - 3:169
  tags:
  - motif: martyrs-souls-in-green-birds-ask-to-die-again
    refs:
    - Jāmiʿ 67:8633.3
    note: أرواحهم في جوف طير خضر لها قناديل معلقة بالعرش تسرح من الجنة حيث شاءت ثم تأوي إلى تلك القناديل
  - motif: believers-soul-a-bird-feeding-on-paradise-trees
    refs:
    - Jāmiʿ 67:8634.1
    note: إنما نسمة المؤمن طير يعلق في شجر الجنة حتى يرجعه اللَّه إلى جسده يوم القيامة
- id: hadith-67-know-their-homes
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Each knows his home in paradise better than his home in the world
  read:
  - Jāmiʿ 67:8636.1
  tags:
  - motif: believers-held-on-bridge-for-retaliation
    refs:
    - Jāmiʿ 67:8636.1
    note: لأحدهم أهدى بمنزله في الجنة منه بمنزله كان في الدنيا
- id: hadith-67-lowest-in-rank
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The lowest in rank - three trees each finer, God excuses him; two houris greet him; small sins shown, each turned to good; paradise seems full; 'wish, and the like of it'
  read:
  - Jāmiʿ 67:8636.2-8640.1
  quran:
  - '32:17'
  tags:
  - motif: last-man-brought-near-three-trees-god-excuses-him
    refs:
    - Jāmiʿ 67:8636.2
    - Jāmiʿ 67:8637.1
    note: فترفع له شجرة ... أدنني من هذه الشجرة فلأستظل بظلها وأشرب من مائها ... وربه يعذره لأنه يرى ما لا صبر له عليه ... هي عند باب الجنة
  - motif: god-laughs-at-last-man-and-lets-him-in
    refs:
    - Jāmiʿ 67:8636.2
    - Jāmiʿ 67:8638.2
    - Jāmiʿ 67:8639.2
    note: أتستهزئ مني وأنت رب العالمين ... من ضحك رب العالمين ... إني لا أستهزئ منك ولكني على ما أشاء قدير / تسخر مني أو تضحك مني وأنت الملك
  - motif: what-will-end-your-asking-the-world-and-its-like
    refs:
    - Jāmiʿ 67:8636.2
    note: يا ابن آدم ما يصريني منك؟ أيرضيك أن أعطيك الدنيا ومثلها معها
  - motif: two-houri-wives-praise-god-who-gave-you-life-for-us
    refs:
    - Jāmiʿ 67:8637.1
    note: 'فتدخل عليه زوجتاه من الحور العين فتقولان: الحمد للَّه الذي أحياك لنا وأحيانا لك'
  - motif: wish-and-the-like-of-it-or-ten-times
    refs:
    - Jāmiʿ 67:8637.1
    - Jāmiʿ 67:8639.1
    - Jāmiʿ 67:8639.2
    - Jāmiʿ 67:8640.1
    note: 'هو لك وعشرة أمثاله / فإن لك ما تمنيت ومثله معه / حتى إذا لم يجد شيئا لقن فقيل له: قل كذا'
  - motif: moses-asks-lowest-and-highest-rank-in-paradise
    refs:
    - Jāmiʿ 67:8637.2
    note: 'سأل موسى ربه: ما أدنى أهل الجنة منزلة ... ومثله ومثله ومثله ومثله فقال في الخامسة: رضيت رب'
  - motif: small-sins-shown-each-replaced-by-good
    refs:
    - Jāmiʿ 67:8638.1
    note: 'اعرضوا عليه صغار ذنوبه وارفعوا عنه كبارها ... فإن لك مكان كل سيئة حسنة فيقول: رب قد عملت أشياء لا أراها ها هنا'
  - motif: last-man-finds-paradise-full-three-times
    refs:
    - Jāmiʿ 67:8638.2
    note: 'رجل يخرج من النار كبوا ... فيخيل إليه أنها ملأى فيرجع فيقول: يا رب وجدتها ملأى ... مثل الدنيا وعشرة أمثالها'
  - motif: last-man-asks-face-turned-from-fire-breaks-promises
    refs:
    - Jāmiʿ 67:8639.2
    note: أي رب اصرف وجهي عن النار ... ويلك يا ابن آدم ما أغدرك
- id: hadith-67-steward-and-adams-stature
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The steward mistaken for God; all enter in Adam's form, sixty cubits; Adam taught the greeting; beardless and kohl-eyed; raised at thirty with Joseph's beauty and Job's heart
  read:
  - Jāmiʿ 67:8640.2-8642.1
  tags:
  - motif: man-prostrates-to-palace-thinking-it-his-lord
    refs:
    - Jāmiʿ 67:8640.2
    note: 'إذ رأى ضوءا فيخر ساجدا فيقال له: ما لك؟ فيقول: أليس هذا ربي تجلى لي'
  - motif: steward-with-thousand-stewards-not-an-angel
    refs:
    - Jāmiʿ 67:8640.2
    note: هذا منزل من منازلك وأنا قهرمان من قهارمتك ولك مثلي ألف قهرمان ... مسيرة مائة سنة
  - motif: adam-sixty-cubits-tall
    refs:
    - Jāmiʿ 67:8640.3
    - Jāmiʿ 67:8641.1
    note: خلق اللَّه آدم على صورته طوله ستون ذراعا ... فكل من يدخل الجنة على صورة آدم ... فلم يزل الخلق ينقص بعده حتى الآن / وعلى ذلك قطعت سررهم
  - motif: adam-sent-to-greet-angels-greeting-of-descendants
    refs:
    - Jāmiʿ 67:8640.3
    note: اذهب فسلم على أولئك النفر ... فإنها تحيتك وتحية ذريتك ... السلام عليك ورحمة اللَّه
  - motif: people-of-paradise-hairless-beardless-kohl-eyed
    refs:
    - Jāmiʿ 67:8641.2
    note: أهل الجنة جرد مرد كحل لا يفنى شبابهم ولا تبلى ثيابهم
  - motif: raised-at-thirty-adams-form-josephs-beauty-jobs-heart
    refs:
    - Jāmiʿ 67:8642.1
    note: ما من أحد يموت سقطا ولا هرما ... إلا بعث ابن ثلاثين سنة ... على مسحة آدم وصورة يوسف وقلب أيوب ومن كان من أهل النار عظموا وفخموا كالجبال
  hints:
  - Humanity diminishing in stature since a giant first man (8640.3) against the rabbinic Adam whose height reached from earth to heaven and was reduced after the sin (b. Hagigah 12a; b. Sanhedrin 38b).
- id: hadith-67-no-sickness-no-waste
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The fourfold call - health, life, youth, bliss forever; they eat but do not void, spit or blow the nose; a musk belch and sweat; praise as breath
  read:
  - Jāmiʿ 67:8643.1-8645.3
  quran:
  - '7:43'
  tags:
  - motif: in-paradise-clothes-never-wear-youth-never-fades
    refs:
    - Jāmiʿ 67:8643.1
    - Jāmiʿ 67:8644.2
    note: من يدخل الجنة ينعم لا يبأس لا تبلى ثيابه ولا يفنى شبابه
  - motif: herald-calls-health-life-youth-bliss-forever
    refs:
    - Jāmiʿ 67:8644.1
    note: 'ينادي مناد: إن لكم أن تصحوا فلا تسقموا أبدا وإن لكم أن تحيوا فلا تموتوا أبدا وإن لكم أن تشبوا فلا تهرموا أبدا وإن لكم أن تنعموا فلا تبأسوا أبدا'
  - motif: paradise-bricks-gold-silver-mortar-musk-soil-saffron
    refs:
    - Jāmiʿ 67:8644.2
    note: لبنة ذهب ولبنة فضة وملاطها المسك الأذفر
  - motif: people-of-paradise-do-not-excrete
    refs:
    - Jāmiʿ 67:8644.3
    - Jāmiʿ 67:8645.1
    - Jāmiʿ 67:8645.2
    - Jāmiʿ 67:8645.3
    note: 'لا يبولون ولا يتغوطون ولا يتفلون ولا يمتخطون ... فما بال الطعام؟ قال: جشاء ورشح كرشح المسك / يصير رشحا مثل حباب المسك'
  - motif: first-band-faces-like-full-moon
    refs:
    - Jāmiʿ 67:8644.3
    - Jāmiʿ 67:8645.1
    note: إن أول زمرة يدخلون الجنة على صورة القمر ليلة البدر ثم الذين يلونهم على أشد كوكب دري
  - motif: gold-combs-aloes-censers-two-wives-marrow-seen
    refs:
    - Jāmiʿ 67:8644.3
    - Jāmiʿ 67:8645.1
    note: أمشاطهم الذهب ورشحهم المسك ومجامرهم الألوة ... ولكل واحد منهم زوجتان يرى مخ سوقهما من وراء اللحم من الحسن
  - motif: adam-sixty-cubits-tall
    refs:
    - Jāmiʿ 67:8644.3
    note: على خلق رجل واحد على صورة أبيهم آدم ستون ذراعا في السماء
  - motif: praise-inspired-like-breath-hearts-as-one
    refs:
    - Jāmiʿ 67:8645.1
    - Jāmiʿ 67:8645.2
    note: لا اختلاف بينهم ولا تباغض قلوبهم قلب واحد يسبحون اللَّه بكرة وعشيا / يلهمون التسبيح والتحميد كما تلهمون النفس
