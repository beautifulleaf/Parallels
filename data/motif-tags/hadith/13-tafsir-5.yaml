      - "Hagar and the boy sent off with bread and a skin of water; she casts him down so as not to see him die and an angel shows her a well (Gen 21:14-19). In the hadith Abraham himself settles them, the angel digs the spring, and the place becomes the House."
      - "Abraham's visits to Ishmael's two wives in Pirqe de-Rabbi Eliezer 30 (Ayesha and Fatima): the first wife sends him away hungry and he tells her to change the tent-peg; the second feeds him and he leaves word that the peg is good."
