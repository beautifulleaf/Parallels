      - {motif: last-out-of-fire-small-sins-become-good, refs: ["Jāmiʿ 60:7276.3"], note: "اعرضوا عليه صغار ذنوبه، وارفعوا عنه كبارها ... فإن لك مكان كل سيئة حسنة، فيقول: رب قد عملت أشياء لا أراها ههنا"}
