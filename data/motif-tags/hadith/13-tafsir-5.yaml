      - {motif: abraham-stands-on-stone-while-ishmael-hands-stones, refs: ["Jāmiʿ 60:7216.1"], note: "جاء بهذا الحجر فوضعه له، فقام عليه وهو يبني، وإسماعيل يناوله الحجارة"}
