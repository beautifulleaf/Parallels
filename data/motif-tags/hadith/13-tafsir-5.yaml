# Hadith chunk 13: al-Jāmiʿ al-Kāmil book 60 (tafsir), pp. 7180-7299: Taha 20:41 to al-Qasas 28:81.
# Read in full from the Arabic (239 hadith). The long Futun report (pp. 7180-7187) has no bullet: it is the compiler's
# discussion of a report he judges largely Isra'iliyyat, used only as context.
new_motifs:
  adam-moses-argue-adam-wins: {label: "Adam and Moses meet and argue; Moses blames Adam for bringing mankind out of the garden, Adam answers that it was written before him: 'Adam out-argued Moses'", cluster: prophets}
  moses-chosen-for-gods-own-self: {label: "Moses is the one God 'chose for himself' and to whom he gave the Torah", cluster: moses}
  adams-deed-written-before-his-creation: {label: "Adam's act was written for him before he was created (forty years before, in one wording)", cluster: theology}
  letter-greets-only-followers-of-guidance: {label: "The prophet's letter to a king opens 'peace on whoever follows guidance', the formula of Moses and Aaron to Pharaoh", cluster: letters}
  sinners-made-charcoal-then-sprout-like-seed: {label: "Believing sinners are made to die in the fire until charcoal, brought out in bundles, spread on paradise's rivers, and sprout like a seed in flood-silt", cluster: eschatology}
  upper-chamber-dwellers-seen-like-setting-star: {label: "People of paradise look up at the dwellers of the upper chambers as one sees a brilliant star setting on the horizon", cluster: paradise}
  high-ranks-not-only-for-prophets: {label: "The highest stations are not only for prophets: men who believed and trusted the messengers reach them", cluster: paradise}
  four-rivers-of-paradise-from-firdaws: {label: "The four rivers of paradise gush from Firdaws, the highest degree, above which is the Throne", cluster: paradise}
  intercessor-bounded-by-limit-four-times: {label: "The prophet prostrates, praises, intercedes and is set a limit, four times, until none remains in the fire but whom the Quran has held", cluster: eschatology}
  wrong-is-darkness-on-resurrection-day: {label: "Wrongdoing will be darknesses on resurrection day", cluster: ethics}
  avarice-destroyed-those-before-you: {label: "Avarice destroyed those before you: it drove them to shed their blood and make lawful what was sacred", cluster: ethics}
  bankrupt-pays-victims-with-good-deeds: {label: "The bankrupt brings prayer, fasting and alms, but has wronged others; his good deeds are paid to his victims, then their sins put on him and he is thrown in the fire", cluster: eschatology}
  torah-written-forty-years-before-adam: {label: "Moses found the Torah written forty years before Adam was created, with 'Adam disobeyed his Lord' in it", cluster: revelation}
  tablets-hold-explanation-of-everything: {label: "God gave Moses the tablets, in which is the explanation of everything, and brought him near in confidential talk", cluster: moses}
  believers-grave-green-garden-widened-seventy-cubits: {label: "The believer's grave is a green garden widened seventy cubits and lit like the full moon", cluster: eschatology}
  ninety-nine-dragons-in-unbelievers-grave: {label: "Ninety-nine dragons, each of seventy snakes with seventy heads, bite and scratch the unbeliever in his grave until resurrection", cluster: eschatology}
  straitened-life-is-grave-torment: {label: "The 'straitened life' of the verse is the torment of the grave", cluster: eschatology}
  lord-seen-like-full-moon: {label: "You will see your Lord as you see the full moon, without crowding to see it", cluster: eschatology}
  dawn-and-afternoon-prayer-keep-from-fire: {label: "No one who prays before sunrise and before sunset (dawn and afternoon prayers) will enter the fire", cluster: ritual}
  mat-marks-prophets-side-world-for-kings: {label: "The prophet lies on a bare mat that marks his side, a leather pillow of fibre under his head; Umar weeps; 'theirs the world, ours the hereafter' of Chosroes and Caesar", cluster: sira}
  spring-pasture-kills-glutton-spares-steady-grazer: {label: "What spring grows kills or nearly kills by bloating, except the beast that eats green fodder, turns to the sun, chews the cud, voids and returns to eat", cluster: ethics}
  world-as-aim-poverty-between-eyes: {label: "Whose aim is the world, God scatters his affair and sets poverty between his eyes; whose intent is the hereafter, the world comes to him humbled", cluster: ethics}
  spouse-sprinkles-water-to-wake-for-night-prayer: {label: "A husband who wakes his wife for night prayer, and sprinkles water in her face if she refuses, is blessed, and the wife likewise", cluster: ritual}
  couple-praying-two-rakas-written-among-rememberers: {label: "A couple who rise at night and pray two rakas together are written among the men and women who remember God", cluster: ritual}
  five-suras-among-first-excellent-ones: {label: "Five suras (Banu Israil, al-Kahf, Maryam, Taha, al-Anbiya) are of 'the first excellent ones' and the narrator's oldest learning", cluster: revelation}
  heaven-creaks-angel-in-every-span: {label: "The heaven creaks under its load; there is no handspan without an angel prostrating or standing", cluster: cosmology}
  two-light-words-heavy-in-scale: {label: "Two words light on the tongue are heavy in the scale: 'glory to God and his praise, glory to God the great'", cluster: ritual}
  card-of-shahada-outweighs-ninety-nine-scrolls: {label: "A man's ninety-nine scrolls of sins, each as far as the eye reaches, are outweighed by one card bearing the two testimonies", cluster: eschatology}
  abraham-prays-while-wife-is-taken: {label: "While the tyrant has Sarah brought, Abraham stands in prayer", cluster: abraham}
  david-rules-for-elder-solomon-reverses: {label: "David judges the child to the elder woman; Solomon, hearing of it, reverses the judgment", cluster: prophets}
  narrator-first-hears-word-sikkin: {label: "The narrator says he first heard the word sikkin (knife) that day; they had only said mudya", cluster: language}
  jonahs-prayer-in-fish-always-answered: {label: "Jonah's prayer in the fish ('no god but you, glory to you, I was a wrongdoer') is answered for any Muslim who prays it", cluster: prophets}
  companion-stamps-feet-to-catch-up-prophet: {label: "Fearing the prophet would reach home first, a companion stamps his feet on the ground so he turns round", cluster: sira}
  jesus-told-to-shelter-servants-on-the-mount: {label: "God tells Jesus he has brought out servants none can fight: 'gather my servants to the mount (al-Tur)'", cluster: eschatology}
  ox-head-worth-hundred-dinars-in-siege: {label: "Besieged, Jesus and his companions value an ox's head above a hundred dinars", cluster: eschatology}
  birds-like-camel-necks-carry-off-corpses: {label: "God sends birds with necks like Bactrian camels to carry off and throw away the stinking dead", cluster: eschatology}
  rain-washes-earth-like-mirror: {label: "A rain no house of clay or hair can keep out washes the earth until it is like a mirror (zalafa)", cluster: eschatology}
  earth-told-to-bring-forth-fruit-band-eats-one-pomegranate: {label: "The earth is told to bring forth its fruit and restore its blessing; a band eats from one pomegranate", cluster: eschatology}
  objector-cites-worshipped-jesus-ezra-angels: {label: "A Meccan objector says Christians worship Jesus, Jews Ezra and a clan the angels: are they fuel of hell too?", cluster: polemic}
  exception-verse-for-righteous-worshipped: {label: "A verse comes down exempting those to whom good was promised (Jesus, Ezra, the angels) from the fuel of hell", cluster: revelation}
  jews-worship-ezra-claim: {label: "The Jews are said to worship Ezra (Uzayr)", cluster: polemic}
  verse-of-the-good-promise-for-uthman: {label: "Ali says the verse on those to whom good was promised came down about Uthman and his companions", cluster: sira}
  heavens-folded-in-right-hand-earths-in-left: {label: "God folds the heavens on resurrection day and takes them in his right hand, and folds the earths in his left", cluster: eschatology}
  i-am-the-king-where-are-the-tyrants: {label: "God calls 'I am the King: where are the tyrants, where the proud, where the kings of the earth?'", cluster: eschatology}
  prophets-angry-curse-made-blessing: {label: "The prophet asks that any curse he spoke in anger, being a son of Adam who angers as they do, be made a blessing on resurrection day", cluster: sira}
  hajj-sura-has-two-prostrations: {label: "Surat al-Hajj is excelled by two prostration verses; who does not prostrate should not recite them", cluster: ritual}
  adam-told-to-bring-out-fires-share: {label: "God tells Adam: rise and bring out the share of the fire (baʿth al-nar)", cluster: eschatology}
  community-like-white-hair-on-black-bull: {label: "The community among nations is like a white hair on a black bull's hide, or a mark on a donkey's foreleg", cluster: eschatology}
  naked-at-resurrection-none-looks: {label: "Asked whether men and women will look at each other naked at the gathering, the prophet says the matter is too grave for that", cluster: eschatology}
  womb-angel-announces-each-stage: {label: "An angel set over the womb calls out 'Lord, a drop; Lord, a clot; Lord, a lump'", cluster: cosmology}
  angel-asks-male-or-female-wretched-or-blessed: {label: "The womb-angel asks: male or female, wretched or blessed, what provision and term? and it is written in the mother's belly", cluster: cosmology}
  religion-judged-by-births-and-rain: {label: "A newcomer judges the religion good if his wife bears a son, his mares foal and the year is rainy, bad if not", cluster: polemic}
  damned-restored-to-be-punished-again: {label: "The boiling water passes through the damned, then he is restored as he was", cluster: eschatology}
  ornament-reaches-where-ablution-reached: {label: "The believer's ornament in paradise reaches as far as his ablution reached; so Abu Hurayra washes up to the armpit", cluster: paradise}
  silk-and-gold-vessels-theirs-here-ours-hereafter: {label: "Silk, brocade and gold and silver vessels are for them in this world and for us in the next", cluster: law}
  companion-throws-cup-at-magian-server: {label: "Given water by a Magian in a silver vessel, Hudhayfa throws the cup at him", cluster: sira}
  three-most-hateful-to-god: {label: "Most hateful to God are three: a deviator in the sanctuary, one who seeks jahiliyya custom in Islam, one who seeks a man's blood without right", cluster: ethics}
  talbiya-begun-when-mount-stands: {label: "The prophet mounts at Dhu l-Hulayfa and begins the talbiya when the camel stands up with him", cluster: ritual}
  pilgrims-on-foot-and-mounted-every-side: {label: "At the farewell pilgrimage riders and walkers fill the view before, right, left and behind the prophet", cluster: ritual}
  deeds-of-first-ten-days-best: {label: "No deeds are better than in the first ten days of Dhu l-Hijja, not even jihad, except a man who risks life and wealth and returns with nothing", cluster: ritual}
  tahlil-and-tahmid-in-the-ten-days: {label: "In the ten days say 'there is no god but God' and 'praise to God' often", cluster: ritual}
  sixty-three-camels-slaughtered-by-his-hand: {label: "The prophet slaughters sixty-three camels with his own hand and Ali the rest", cluster: ritual}
  piece-of-every-camel-cooked-in-one-pot: {label: "A piece of every sacrificial camel is put in one pot, cooked, and its meat eaten and broth drunk", cluster: ritual}
  sacrificial-meat-cloths-and-hides-all-divided: {label: "Ali is told to divide the sacrificial camels' meat, then their cloths and hides", cluster: ritual}
  menstruant-who-did-ifada-may-leave: {label: "A wife who menstruates after the circuit of ifada need not delay the departure: 'did she not circle with you? then go'", cluster: ritual}
  hijr-is-part-of-the-house: {label: "The Hijr is part of the House, since the prophet circled behind it", cluster: ritual}
  greatest-sins-and-false-witness-repeated: {label: "The greatest sins: associating with God, undutifulness to parents and false witness; he sat up and repeated 'false speech' until they wished he would stop", cluster: ethics}
  fast-void-without-leaving-false-speech: {label: "God has no need of the fast of one who does not leave false speech, acting on it and ignorance", cluster: ritual}
  wicked-soul-refused-entry-at-heavens-gate: {label: "Angels carry the wicked soul up; at each host 'what is this foul spirit?'; at the lowest heaven the gate is not opened", cluster: eschatology}
  soul-returned-to-body-two-angels-question: {label: "The soul is returned to the body and two angels sit the dead man up and ask 'who is your Lord?'", cluster: eschatology}
  ride-the-sacrificial-camel: {label: "The prophet tells a man driving his sacrificial camel to ride it, three times, though he protests it is an offering", cluster: ritual}
  ride-offering-only-when-compelled: {label: "Ride the offering decently when compelled, until you find another mount", cluster: ritual}
  two-piebald-rams-foot-on-neck: {label: "The prophet sacrifices two piebald rams with his own hand, foot on their necks, saying God's name and 'God is greatest'", cluster: ritual}
  camel-slaughtered-standing-hobbled: {label: "Camels are slaughtered standing, the left foreleg hobbled; Ibn Umar tells a man to raise his kneeling camel", cluster: ritual}
  four-rakas-at-medina-two-at-dhu-l-hulayfa: {label: "Leaving for pilgrimage the prophet prays noon as four rakas at Medina and afternoon as two at Dhu l-Hulayfa", cluster: ritual}
  flesh-cut-from-living-beast-is-carrion: {label: "What is cut from a beast while alive is carrion; in Medina they cut camels' humps and sheep's tails", cluster: law}
  god-looks-at-hearts-not-forms: {label: "God does not look at your forms and wealth but at your hearts and deeds", cluster: ethics}
  image-makers-challenged-to-create-a-grain: {label: "Who is more wrong than one who tries to create like God? Let them create an atom, a grain or a barley-corn", cluster: polemic}
  jews-to-know-latitude-in-our-religion: {label: "'Let the Jews know there is latitude in our religion: I was sent with tolerant hanifiyya'", cluster: polemic}
  two-envoys-told-to-agree: {label: "Two envoys to Yemen are told: make easy, give good news, and agree with one another", cluster: law}
  jahiliyya-call-makes-one-of-hells-heaps: {label: "Whoever calls with the call of the jahiliyya is of the heaps of hell, even if he prays and fasts", cluster: ethics}
  god-named-you-muslims: {label: "'Call with God's call, who named you Muslims, believers, servants of God'", cluster: theology}
  cough-cuts-recitation-short: {label: "Reciting at the dawn prayer, the prophet is taken by a cough at the mention of Moses and Aaron (or Jesus) and bows", cluster: ritual}
  prayer-on-time-then-parents-then-jihad: {label: "The deed dearest to God: prayer at its time, then goodness to parents, then jihad", cluster: ethics}
  two-dwellings-heirs-take-the-damneds-place: {label: "Everyone has a dwelling in paradise and one in the fire; when one enters the fire the people of paradise inherit his dwelling", cluster: eschatology}
  companions-words-revealed-as-verse: {label: "A companion speaks words that are then revealed in the same wording as a verse", cluster: revelation}
  eat-and-anoint-with-oil-of-blessed-tree: {label: "Eat olive oil and anoint with it, for it is from a blessed tree", cluster: ritual}
  unlawful-food-blocks-the-prayer-of-traveller: {label: "A long-travelling, dishevelled man raises his hands, 'Lord, Lord', but his food, drink and clothing are unlawful: how can he be answered?", cluster: ethics}
  famine-eaters-of-hair-and-blood: {label: "In the famine Meccans ate 'ilhiz, camel hair with blood", cluster: sira}
  claiming-god-a-son-is-reviling-him: {label: "God says the son of Adam reviles him by saying he has a child and belies him by saying he will not restore him", cluster: theology}
  prayer-to-die-before-trial-comes: {label: "'When you will a trial for a people, take me to you unseduced'", cluster: ritual}
  mosque-entry-refuge-guards-whole-day: {label: "Who says the refuge formula on entering the mosque, Satan says 'he is guarded from me the rest of the day'", cluster: ritual}
  refuge-from-evil-deaths-and-satans-touch: {label: "Refuge from death by collapse, falling, drowning, burning, decrepitude, Satan's touch at death, flight in battle and snakebite", cluster: ritual}
  prophet-cannot-avail-own-daughter: {label: "The prophet tells Fatima, Safiyya and his kin to ask him of his wealth but that he can avail them nothing against God", cluster: sira}
  clans-called-by-name-to-save-themselves: {label: "The prophet calls the clans of Quraysh one by one: 'save yourselves from the fire'", cluster: sira}
  kinship-moistened-with-its-moisture: {label: "'You have a bond of kinship I will moisten with its moisture' (keep in this world)", cluster: ethics}
  lineage-cannot-hasten-one-slowed-by-deeds: {label: "Whom his deeds slow, his lineage will not hasten", cluster: ethics}
  verses-recited-into-ear-heal-afflicted: {label: "Ibn Masud recites the end of al-Muminun into an afflicted man's ear and he is healed", cluster: ritual}
  certain-mans-recitation-would-move-mountain: {label: "Were a man of certain faith to recite these verses over a mountain it would move", cluster: ritual}
  verse-recited-morning-and-evening-gives-safety-and-spoil: {label: "A raiding party told to recite a verse morning and evening take spoil and come back safe", cluster: warfare}
  ransom-for-hadd-returned: {label: "A father who paid a hundred sheep and a slave-girl to buy off his son's penalty has them returned", cluster: law}
  married-woman-stoned-on-confession: {label: "A companion is sent to the married woman: 'if she confesses, stone her'; she confesses and is stoned", cluster: law}
  judge-by-gods-book-asked: {label: "Two disputants ask the prophet to judge by God's book; he swears he will", cluster: law}
  smuggler-of-captives-refuses-former-lover: {label: "A man smuggling Muslim captives out of Mecca refuses his old lover's invitation, 'God has forbidden zina', and she betrays him", cluster: sira}
  pursuers-stand-over-cave-blinded: {label: "Pursuers stand over the hiding man in a cave and urinate on his head, but God blinds them to him", cluster: sira}
  adulterer-to-marry-only-adulteress-or-idolatress: {label: "The flogged adulterer marries only his like; the prophet forbids Marthad to marry the harlot", cluster: law}
  repentant-may-marry-former-partner: {label: "Ibn Abbas lets a man marry the woman he had sinned with after repentance: 'any sin is on me'", cluster: law}
  husband-finding-man-with-wife-asks-may-he-kill: {label: "A husband asks: if a man finds another with his wife, may he kill him and be killed for it, or what should he do?", cluster: law}
  mutual-imprecation-of-spouses: {label: "A husband who accuses his wife without witnesses swears four times and invokes God's curse the fifth; she swears four times and invokes God's anger; they are separated", cluster: law}
  childs-looks-decide-paternity-after-imprecation: {label: "After the imprecation the prophet describes how the child will look if the husband told the truth or lied; it is born as the accused man's likeness", cluster: law}
  proof-or-flogging-of-the-back: {label: "'Proof, or the penalty on your back' to the husband who accuses his wife", cluster: law}
  fifth-oath-stops-the-woman: {label: "At the fifth oath they stop the woman, warning it is binding; she hesitates, then says 'I will not shame my people'", cluster: law}
  one-of-you-is-lying-will-either-repent: {label: "'God knows one of you is lying: will either of you repent?'", cluster: law}
  child-given-to-mother-couple-separated: {label: "After the imprecation the child is assigned to the mother and the couple separated", cluster: law}
  god-more-jealous-than-any: {label: "'I am more jealous than Sad and God more jealous than I; from his jealousy he forbade indecencies'", cluster: theology}
  none-loves-excuse-and-praise-more-than-god: {label: "None loves to excuse more than God, so he sent messengers; none loves praise more, so he promised paradise", cluster: theology}
  rear-guard-gathers-dropped-goods: {label: "Safwan rides behind the army, picking up a dropped cup, bag or water-skin", cluster: sira}
  dying-wish-to-be-forgotten-thing: {label: "Praised on her deathbed, Aisha wishes she had been 'a thing forgotten'", cluster: sira}
  only-virgin-bride-acquittal-from-heaven: {label: "Aisha praised as the prophet's only virgin bride, whose acquittal came from heaven", cluster: sira}
  poet-defends-prophets-honour-with-his-own: {label: "Hassan: 'my father, his father and my honour are a shield for Muhammad's honour'", cluster: sira}
  variant-reading-walaq-lying: {label: "Aisha read 'idh taliquna-hu', from walaq, lying", cluster: revelation}
  careless-word-drops-man-east-to-west-into-fire: {label: "A man speaks a word without weighing it and falls by it into the fire further than east is from west", cluster: ethics}
  expiate-oath-and-do-the-better: {label: "Who swears an oath and sees something better should expiate the oath and do the better", cluster: law}
  revelation-comes-like-stupor: {label: "When revelation came on him it took him like a stupor; then he sat up wiping his face", cluster: revelation}
  man-accepts-no-witness-but-himself: {label: "At judgment a man refuses any witness against him except from himself", cluster: eschatology}
  man-curses-his-own-limbs: {label: "After his limbs testify the man says to them 'away with you! it was for you I was pleading'", cluster: eschatology}
  prophet-laughs-at-servants-dispute-with-lord: {label: "The prophet laughs at the servant's bargaining with his Lord at judgment", cluster: eschatology}
  thigh-flesh-and-bones-speak: {label: "The hypocrite's mouth is sealed and his thigh, flesh and bones are told to speak his deeds", cluster: eschatology}
  ask-leave-three-times-then-return: {label: "Ask leave to enter three times; if not given, go back", cluster: law}
  umar-demands-witness-to-the-hadith: {label: "Umar demands proof that the prophet said it; the youngest present goes to testify", cluster: sira}
  answering-i-to-who-is-there-disliked: {label: "To 'who is it?' the visitor answers 'I'; the prophet repeats 'I, I' in dislike", cluster: ethics}
  visitor-stands-beside-door-not-facing-it: {label: "The prophet stood to the right or left of a door, not facing it, greeting twice, as houses then had no curtains", cluster: ethics}
  sudden-glance-turn-eyes-away: {label: "Asked about the sudden glance, the prophet orders the eyes turned away", cluster: ethics}
  first-glance-yours-second-not: {label: "'Do not follow a glance with a glance: the first is yours, the second is not'", cluster: ethics}
  rights-of-the-road: {label: "The road's due: lowering the gaze, refraining from harm, returning greetings, enjoining good and forbidding evil", cluster: ethics}
  each-limb-has-its-zina: {label: "Each limb has its share of zina: eyes by looking, ears by listening, tongue by speech, hand by grasping, foot by stepping; the private part confirms or denies", cluster: ethics}
  guarantee-of-tongue-and-private-parts: {label: "Who guarantees what is between his jaws and between his legs is guaranteed paradise", cluster: ethics}
  god-more-deserving-of-modesty-when-alone: {label: "Guard your nakedness except from wife and slave; when alone, God is more deserving of modesty", cluster: ethics}
  veiled-women-at-dawn-like-crows: {label: "After the head-covering verse the Ansar women pray at dawn wrapped so that crows seem to sit on their heads", cluster: ritual}
  father-and-slave-may-see-her: {label: "Fatima's cloth too short to cover head and feet together; 'it is only your father and your slave'", cluster: law}
  repent-to-god-hundred-times-a-day: {label: "'Repent to God: I repent to him a hundred times a day'", cluster: ritual}
  three-god-is-bound-to-help: {label: "God is bound to help three: the fighter in his way, the slave buying his freedom, the one marrying for chastity", cluster: ethics}
  young-men-marry-or-fast-as-gelding: {label: "'Young men, who can should marry; who cannot should fast, it is a gelding (wija')'", cluster: law}
  master-forces-slave-girls-to-prostitution: {label: "Ibn Ubayy forces his slave-girls Musayka and Umayma to prostitute themselves; they complain and the verse comes", cluster: law}
  earnings-of-slave-girls-forbidden: {label: "The prophet forbade the earnings of slave-girls", cluster: law}
  dog-price-harlot-hire-soothsayer-fee-forbidden: {label: "The price of a dog, the harlot's hire and the soothsayer's fee are forbidden", cluster: law}
  creation-in-darkness-sprinkled-with-gods-light: {label: "God created his creatures in darkness and cast on them of his light; whom it struck was guided, whom it missed went astray", cluster: theology}
  pen-has-dried: {label: "'The pen has dried on God's knowledge'", cluster: theology}
  mosque-built-answered-by-house-in-paradise: {label: "Who builds a mosque for God, God builds him its like (a house) in paradise", cluster: ritual}
  bedouin-urinates-in-mosque-left-to-finish: {label: "A bedouin urinates in the mosque; the prophet stops the men, lets him finish and has a bucket poured over it", cluster: law}
  mosques-only-for-remembrance-prayer-quran: {label: "Mosques are not fit for urine or filth, only for remembrance, prayer and recitation", cluster: ritual}
  womans-prayer-best-in-innermost-room: {label: "A woman's prayer in her inner room is better than in her chamber, house, tribe's mosque or the prophet's mosque", cluster: ritual}
  woman-builds-prayer-place-in-darkest-corner: {label: "Umm Humayd has a prayer place built in the furthest, darkest corner of her house and prays there till death", cluster: ritual}
  obey-unjust-rulers-each-bears-his-charge: {label: "Rulers who take their right and deny ours: 'hear and obey; theirs what they bear, yours what you bear'", cluster: law}
  believers-sleep-and-wake-armed: {label: "In Medina, all Arabs against them, believers slept and woke with weapons", cluster: sira}
  community-promised-eminence-and-rule: {label: "The community is promised splendour, height, victory and power; who works for the hereafter for the world's sake has no share in it", cluster: eschatology}
  treasures-of-chosroes-opened: {label: "The treasures of Chosroes son of Hormizd will be opened; the narrator is among those who opened them", cluster: sira}
  do-not-tell-lest-they-rely-on-it: {label: "'Do not tell people the good news lest they rely on it'", cluster: ethics}
  donkey-named-ufayr: {label: "The prophet's donkey is named Ufayr", cluster: sira}
  band-of-community-ever-on-the-truth: {label: "A band of the community will remain victorious on the truth, unharmed by deserters, until God's command", cluster: eschatology}
  scruple-to-eat-at-anothers-house-lifted: {label: "After the verse against devouring property unlawfully, believers refuse to eat at one another's homes; a verse allows it", cluster: law}
  keys-left-with-stay-at-homes-who-will-not-eat: {label: "Men going on raids leave their keys with those who stay, permitting them to eat; they refuse, fearing the leave was not sincere", cluster: law}
  dearest-food-has-most-hands: {label: "The food dearest to God is that on which hands are many", cluster: ethics}
  food-of-one-suffices-two: {label: "Food for one suffices two, for two suffices four, for four suffices eight", cluster: ethics}
  prophet-sent-to-test-and-be-a-test: {label: "God tells the prophet: 'I sent you only to test you and to test others by you'", cluster: theology}
  why-not-revealed-all-at-once: {label: "Polytheists ask why the Quran is not sent down all at once rather than verse by verse", cluster: revelation}
  stone-god-discarded-for-finer-stone: {label: "A pagan worships a white stone and throws it away when he finds a finer one", cluster: polemic}
  come-to-prayer-calmly-not-running: {label: "Do not come running to prayer; come with calm, pray what you catch and complete what you missed", cluster: ritual}
  verse-revealed-confirming-prophets-word: {label: "A verse comes down confirming what the prophet has just said", cluster: revelation}
  converts-ask-expiation-for-past-killing-and-zina: {label: "Polytheists who killed and fornicated much ask if Islam offers expiation for what they did", cluster: law}
  only-four-commands-at-farewell-pilgrimage: {label: "'They are only four': no association, no unlawful killing, no zina, no theft", cluster: law}
  last-out-of-fire-small-sins-become-good: {label: "The last out of the fire is shown his small sins; each is made a good deed, and he asks after the great ones not shown", cluster: eschatology}
  sinner-of-every-sin-converted-sins-made-good: {label: "A man who did every sin asks if he may repent; on conversion his deeds are made good, even his treacheries; he goes off crying 'God is greatest'", cluster: ethics}
  do-not-wish-to-have-witnessed-the-prophet: {label: "Do not wish you had seen the prophet's time: you know not how you would have stood", cluster: ethics}
  furqan-divides-father-from-son: {label: "The prophet's criterion divided father from son", cluster: polemic}
  no-coolness-of-eye-while-kin-in-fire: {label: "A believer cannot be glad while knowing a beloved father or son is bound for the fire", cluster: ethics}
  prayer-to-join-the-righteous-undisgraced: {label: "'Make us live and die as Muslims and join us to the righteous, not disgraced nor seduced'", cluster: ritual}
  one-dip-erases-memory-of-life: {label: "The most comfortable of the damned dipped once in the fire has never seen good; the most wretched of the blessed dipped once in paradise has never seen hardship", cluster: eschatology}
  jinn-add-nine-lies-to-each-word: {label: "Jinn who overheard a word of revelation added nine to it: the word true, the additions false", cluster: cosmology}
  iblis-sends-his-troops-to-find-the-event: {label: "Barred from heaven, the jinn report to Iblis, who sends his troops and they find the prophet praying at Mecca", cluster: cosmology}
  cavalry-in-valley-would-you-believe-me: {label: "'If I told you horsemen in the valley mean to raid you, would you believe me?' 'We have known only truth from you'", cluster: sira}
  prophet-climbs-highest-rock-to-call: {label: "The prophet climbs to the highest stone of a rock-heap to call the clan of Abd Manaf", cluster: sira}
  angels-discuss-decrees-in-the-clouds: {label: "Angels come down into the clouds (anan) and speak of what is decreed in heaven; the devils steal the hearing", cluster: cosmology}
  soothsayers-are-nothing: {label: "Asked about soothsayers the prophet says 'they are nothing'", cluster: polemic}
  belly-full-of-pus-better-than-of-poetry: {label: "'Seize the devil': better a man's belly full of pus than full of poetry", cluster: ethics}
  believing-poets-excepted: {label: "The verse on poets is qualified by the exception of those who believe and do good", cluster: revelation}
  believer-fights-with-sword-and-tongue-like-arrows: {label: "The believer fights with sword and tongue; the verses hurled at them are like the shooting of arrows", cluster: warfare}
  some-poetry-is-wisdom: {label: "'Some poetry is wisdom'", cluster: ethics}
  all-requests-lessen-god-as-needle-in-sea: {label: "Were all men and jinn to ask and be given, it would lessen God's store only as a needle dipped in the sea", cluster: theology}
  all-are-hungry-naked-astray-but-whom-god-feeds: {label: "'All of you are astray but whom I guide, hungry but whom I feed, naked but whom I clothe'", cluster: theology}
  slave-woman-bears-her-mistress-sign: {label: "Signs of the Hour: the slave-woman bears her master, the barefoot naked become chiefs, herders vie in tall buildings", cluster: eschatology}
  worship-as-though-you-see-him: {label: "Ihsan: worship God as though you see him; if you do not see him, he sees you", cluster: theology}
  ten-signs-before-the-hour: {label: "Ten signs before the Hour: smoke, the Dajjal, the beast, sun from the west, Jesus' descent, Gog and Magog, three earth-swallowings, and a fire from Yemen", cluster: eschatology}
  fire-from-yemen-drives-people-to-gathering: {label: "The last sign: a fire comes out of Yemen driving people to their gathering place", cluster: eschatology}
  hasten-deeds-before-six-signs: {label: "Hasten good deeds before six: the sun from the west, the smoke, the Dajjal, the beast, one's own death, the general calamity", cluster: eschatology}
  martyrs-are-those-spared-at-the-blast: {label: "Gabriel says those spared at the blast are the martyrs girt with their swords around the Throne", cluster: eschatology}
  martyrs-ride-ruby-camels-god-laughs-to-them: {label: "Angels bring martyrs ruby camels with silk-soft saddles to the gathering; God laughs to them, and whom he laughs to has no reckoning", cluster: eschatology}
  do-not-prefer-me-over-moses: {label: "After a Muslim strikes a Jew in a quarrel over Moses and Muhammad: 'do not prefer me over Moses'", cluster: polemic}
  town-sacred-from-creation-of-heavens: {label: "God made Mecca sacred the day he created the heavens and earth, sacred till resurrection", cluster: ritual}
  no-hijra-after-conquest-but-jihad-and-intention: {label: "After the conquest: 'no emigration, but jihad and intention; when called out, go'", cluster: law}
  jew-asks-which-term-moses-served: {label: "A Jew of al-Hira (in another wording a Christian scholar) asks which of the two terms Moses fulfilled", cluster: polemic}
  no-wholesale-destruction-after-torah: {label: "After the Torah was given God destroyed no people with punishment from sky or earth", cluster: history}
  verse-revealed-about-ten-scripture-converts: {label: "Rifa'a al-Qurazi: the verse on those given scripture before came down about ten men, he among them", cluster: revelation}
  convert-from-two-books-rewarded-twice: {label: "Who of the people of the two books submits has his reward twice, and his rights and duties are as ours", cluster: polemic}
  lord-self-and-family-each-have-a-due: {label: "'Your Lord, your self and your family each have a right over you: give each his due'; the prophet says Salman spoke truly", cluster: ethics}
  ascetic-husband-neglects-wife: {label: "A companion's wife goes unkempt: 'your brother has no need of this world'", cluster: ethics}
  guest-will-not-eat-till-faster-eats: {label: "A guest refuses to eat until his fasting host eats with him", cluster: ethics}
  proud-man-swallowed-by-earth-sinking-till-resurrection: {label: "A man strutting in a fine robe, hair combed, admiring himself, is swallowed by the earth and goes on sinking until resurrection day", cluster: eschatology}
units:
  # ============== Taha 20:41-133 (the long Futun report on pp. 7180-7187 is the compiler's own discussion: context only)
  - id: hadith-60-adam-moses-chosen-for-himself
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Adam and Moses meet; Moses whom God 'chose for himself' loses the argument (Q 20:41)"
    read: ["Jāmiʿ 60:7187.1"]
    quran: ["20:41"]
    tags:
      - {motif: adam-moses-argue-adam-wins, refs: ["Jāmiʿ 60:7187.1"], note: "أنت الذي أشقيت الناس، وأخرجتهم من الجنة؟ ... فحجّ آدمُ موسى"}
      - {motif: moses-chosen-for-gods-own-self, refs: ["Jāmiʿ 60:7187.1"], note: "أنت الذي اصطفاك الله برسالته، واصطفاك لنفسه، وأنزل عليك التوراة"}
      - {motif: adams-deed-written-before-his-creation, refs: ["Jāmiʿ 60:7187.1"], note: "فوجدتها كتب علي قبل أن يخلقني، قال: نعم"}
  - id: hadith-60-peace-on-who-follows-guidance-letter
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Moses' 'peace on whoever follows guidance' used as the greeting of the letter to Heraclius (Q 20:47)"
    read: ["Jāmiʿ 60:7188.1"]
    quran: ["20:47"]
    tags:
      - {motif: letter-greets-only-followers-of-guidance, refs: ["Jāmiʿ 60:7188.1"], note: "من محمد عبد الله ورسوله إلى هرقل عظيم الروم، سلام على من اتبع الهدى"}
      - {motif: accept-islam-and-be-safe-reward-twice, refs: ["Jāmiʿ 60:7188.1"], note: "أسلم تسلم، يؤتك الله أجرك مرتين"}
  - id: hadith-60-sinners-charred-then-revived
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "The people of the fire neither die nor live; sinners are put to death, made charcoal, and sprout on paradise's rivers (Q 20:74)"
    read: ["Jāmiʿ 60:7188.2"]
    quran: ["20:74"]
    tags:
      - {motif: hell-neither-die-nor-live, refs: ["Jāmiʿ 60:7188.2"], note: "أما أهل النار الذين هم أهلها، فإنهم لا يموتون فيها، ولا يحيون"}
      - {motif: sinners-made-charcoal-then-sprout-like-seed, refs: ["Jāmiʿ 60:7188.2"], note: "فأماتهم إماتة حتى إذا كانوا فحما أُذِن بالشفاعة، فجيء بهم ضبائر ضبائر، فبثوا على أنهار الجنة ... فينبتون نبات الحبة تكون في حميل السيل"}
  - id: hadith-60-upper-chambers-and-hundred-degrees
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "The dwellers of the upper chambers seen like a star at the horizon; a hundred degrees, Firdaws the highest (Q 20:75-76)"
    read: ["Jāmiʿ 60:7188.3-7189.1"]
    quran: ["20:75-76"]
    tags:
      - {motif: upper-chamber-dwellers-seen-like-setting-star, refs: ["Jāmiʿ 60:7188.3"], note: "إن أهل الجنة يتراءون أهل الغرف من فوقهم كما يتراءون الكوكب الدّرِّي الغابر في الأفق"}
      - {motif: high-ranks-not-only-for-prophets, refs: ["Jāmiʿ 60:7188.3"], note: "تلك منازل الأنبياء، لا يبلغها غيرهم، قال: \"بلى، والذي نفسي بيده، رجال آمنوا بالله وصدقوا المرسلين"}
      - {motif: hundred-degrees-firdaws-under-throne, refs: ["Jāmiʿ 60:7189.1"], note: "في الجنة مائة درجة، ما بين كل درجتين كما بين السماء والأرض، والفردوس أعلاها درجة"}
      - {motif: four-rivers-of-paradise-from-firdaws, refs: ["Jāmiʿ 60:7189.1"], note: "ومنها تفجر أنهار الجنة الأربعة، ومن فوقها يكون العرش"}
    hints:
      - "Four rivers flowing out of the highest garden against Gen 2:10, the river out of Eden parting into four heads."
  - id: hadith-60-ashura-moses-victory
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "The Jews fast Ashura, the day Moses prevailed over Pharaoh; 'we have more right to Moses' (Q 20:77-79)"
    read: ["Jāmiʿ 60:7189.2"]
    quran: ["20:77-79"]
    tags:
      - {motif: jews-fast-day-moses-was-saved, refs: ["Jāmiʿ 60:7189.2"], note: "هذا اليوم الذي ظهر فيه موسى على فرعون ... نحن أولى بموسى منهم فصوموه"}
    hints:
      - "A fast on the day of Moses' victory over Pharaoh against the Passover commemoration of the Exodus (Exod 12:14), though Ashura's date (10th of a month) answers rather the 10th of Tishri, Yom Kippur (Lev 16:29)."
  - id: hadith-60-intercession-chain
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Believers seek an intercessor from Adam to Muhammad; four returns, the last for those the Quran holds (Q 20:109)"
    read: ["Jāmiʿ 60:7189.3"]
    quran: ["20:109"]
    tags:
      - {motif: intercession-chain-adam-to-muhammad, refs: ["Jāmiʿ 60:7189.3"], note: "فيأتون آدم ... ائتوا نوحا ... ائتوا خليل الرحمن ... ائتوا موسى ... ائتوا عيسى ... ائتوا محمدا"}
      - {motif: prophets-decline-intercession-citing-a-fault, refs: ["Jāmiʿ 60:7189.3"], note: "ويذكر قتل النفس بغير نفس، فيستحيي من ربه"}
      - {motif: noah-first-messenger-to-people-of-earth, refs: ["Jāmiʿ 60:7189.3"], note: "فإنه أوّل رسول بعثه الله إلى أهل الأرض"}
      - {motif: intercessor-bounded-by-limit-four-times, refs: ["Jāmiʿ 60:7189.3"], note: "فيحد لي حدا، فأدخلهم الجنة ... ثم أعود الرابعة، فأقول ما بقي في النار إلّا مَن حبسهُ القرآن"}
  - id: hadith-60-injustice-darkness-and-bankrupt
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Wrong is darkness on resurrection day; avarice destroyed earlier peoples; the bankrupt whose good deeds go to his victims (Q 20:111)"
    read: ["Jāmiʿ 60:7190.1-7190.3"]
    quran: ["20:111"]
    tags:
      - {motif: wrong-is-darkness-on-resurrection-day, refs: ["Jāmiʿ 60:7190.1", "Jāmiʿ 60:7190.2"], note: "الظلم ظلمات يوم القيامة"}
      - {motif: avarice-destroyed-those-before-you, refs: ["Jāmiʿ 60:7190.2"], note: "فإن الشُّح أهلك من كان قبلكم، حملهم على أن سفكوا دماءهم، واستحلّوا محارمهم"}
      - {motif: bankrupt-pays-victims-with-good-deeds, refs: ["Jāmiʿ 60:7190.3"], note: "فيعطى هذا من حسناته، وهذا من حسناته، فإن فنيت حسناته ... أُخِذ من خطاياهم، فَطُرِحت عليه، ثم طُرِح في النار"}
  - id: hadith-60-adam-moses-forty-years
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Adam and Moses argue before their Lord; the Torah written forty years before Adam, with 'Adam disobeyed' in it (Q 20:121)"
    read: ["Jāmiʿ 60:7191.1"]
    quran: ["20:121"]
    tags:
      - {motif: adam-moses-argue-adam-wins, refs: ["Jāmiʿ 60:7191.1"], note: "احتج آدم وموسى ﵉ عند ربهما، فحج آدم موسى"}
      - {motif: torah-written-forty-years-before-adam, refs: ["Jāmiʿ 60:7191.1"], note: "فَبِكَمْ وجدت الله كتب التوراة قبل أن أُخلَق، قال موسى: بأربعين عاما"}
      - {motif: tablets-hold-explanation-of-everything, refs: ["Jāmiʿ 60:7191.1"], note: "وأعطاك الألواح، فيها تبيان كل شيء، وقرّبك نجيّا"}
      - {motif: adams-deed-written-before-his-creation, refs: ["Jāmiʿ 60:7191.1"], note: "أفتلومني على أن عملت عملا كتبه الله على أن أعمله قبل أن يخلقني بأربعين سنة"}
    hints:
      - "The Torah existing before creation against rabbinic tradition (b. Pesahim 54a; Gen. Rab. 1:4) that the Torah preceded the world, there by 2,000 years."
  - id: hadith-60-straitened-life-is-grave-torment
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "The believer's grave widened seventy cubits; the 'straitened life' is the unbeliever's grave with ninety-nine dragons (Q 20:124)"
    read: ["Jāmiʿ 60:7191.2-7192.1"]
    quran: ["20:124"]
    tags:
      - {motif: believers-grave-green-garden-widened-seventy-cubits, refs: ["Jāmiʿ 60:7191.2"], note: "إنّ المؤمن في قبره لفي روضة خضراء، ويُرْحَب له قبره سبعون ذراعا، وينور له كالقمر ليلة البدر"}
      - {motif: ninety-nine-dragons-in-unbelievers-grave, refs: ["Jāmiʿ 60:7191.2"], note: "يسلط عليه تسعة وتسعون تِنِّينا ... سبعون حية، لكل حية سبعون رؤوس يلسعونه، ويخدشونه إلى يوم القيامة"}
      - {motif: straitened-life-is-grave-torment, refs: ["Jāmiʿ 60:7191.2", "Jāmiʿ 60:7192.1"], note: "﴿مَعِيشَةً ضَنْكًا﴾ قال: \"عذاب القبر\""}
  - id: hadith-60-seeing-the-lord-and-dawn-afternoon-prayers
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "You will see your Lord as you see the full moon; guard the prayers before sunrise and sunset (Q 20:130)"
    read: ["Jāmiʿ 60:7192.2-7192.3"]
    quran: ["20:130"]
    tags:
      - {motif: lord-seen-like-full-moon, refs: ["Jāmiʿ 60:7192.2"], note: "إنكم سترون ربكم، كما ترون هذا القمر، لا تُضامّون في رؤيته"}
      - {motif: praise-before-sunrise-and-sunset, refs: ["Jāmiʿ 60:7192.2", "Jāmiʿ 60:7192.3"], note: "صلاة قبل طلوع الشمس وقبل غروبها\". يعني العصر والفجر"}
      - {motif: dawn-and-afternoon-prayer-keep-from-fire, refs: ["Jāmiʿ 60:7192.3"], note: "لن يلج النار أحد صلى قبل طلوع الشمس وقبل غروبها"}
  - id: hadith-60-do-not-crave-the-worlds-flower
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "The prophet on a mat with its mark in his side; the flower of the world and the grazing beast; the world-centred man (Q 20:131)"
    read: ["Jāmiʿ 60:7193.1-7193.3"]
    quran: ["20:131"]
    tags:
      - {motif: mat-marks-prophets-side-world-for-kings, refs: ["Jāmiʿ 60:7193.1"], note: "فرأيت أثر الحصير في جنبه، فبكيت ... إن كسرى وقيصر فيما هما فيه ... أما ترضى أن تكون لهم الدنيا ولنا الآخرة"}
      - {motif: spring-pasture-kills-glutton-spares-steady-grazer, refs: ["Jāmiʿ 60:7193.2"], note: "إن كل ما أنبت الربيع يَقتل أو يُلِمّ، إلا آكلة الخضر، فإنها تأكل حتى إذا امتدت خاصرتاها استقبلت الشمس، ثم اجترت، وبالت، وثلطت"}
      - {motif: world-sweet-green-beware-women, refs: ["Jāmiʿ 60:7193.2"], note: "إن هذا المال خضرة حلوة ... ومن أخذه بغير حقه، كان كالذي يأكل ولا يشبع"}
      - {motif: world-as-aim-poverty-between-eyes, refs: ["Jāmiʿ 60:7193.3"], note: "من كانت الدنيا همه، فرق الله عليه أمره، وجعل فقره بين عينيه ... ومن كانت الآخرة نيته ... وأتته الدنيا وهي راغمة"}
  - id: hadith-60-waking-spouse-for-night-prayer
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Husband and wife wake each other for night prayer, sprinkling water on the face; the good outcome in a dream of Ibn Tab's dates (Q 20:132)"
    read: ["Jāmiʿ 60:7194.1-7194.3"]
    quran: ["20:132"]
    tags:
      - {motif: spouse-sprinkles-water-to-wake-for-night-prayer, refs: ["Jāmiʿ 60:7194.1"], note: "فإن أبت نضح في وجهها الماء ... فإن أبى، نضحت في وجهه الماء"}
      - {motif: couple-praying-two-rakas-written-among-rememberers, refs: ["Jāmiʿ 60:7194.2"], note: "فصليا أو صلى ركعتين جميعا كتبا في الذاكرين والذاكرات"}
      - {motif: fresh-dates-of-ibn-tab-read-as-good-religion, refs: ["Jāmiʿ 60:7194.3"], note: "فأتينا برطب من رطب ابن طاب، فأولت الرفعة لنا في الدنيا، والعاقبة في الآخرة، وأن ديننا قد طاب"}
  - id: hadith-60-each-prophet-a-sign-mine-revelation
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Every prophet was given signs men believed; the prophet's was revelation (Q 20:133)"
    read: ["Jāmiʿ 60:7195.1"]
    quran: ["20:133"]
    tags:
      - {motif: each-prophet-given-a-convincing-sign, refs: ["Jāmiʿ 60:7195.1"], note: "ما من الأنبياء من نبي إلا قد أعطي من الآيات ما مثله آمن عليه البشر، وإنما كان الذي أوتيت وحيا"}
      - {motif: prophet-hopes-most-followers-on-judgment-day, refs: ["Jāmiʿ 60:7195.1"], note: "فأرجو أن أكون أكثرهم تابعا يوم القيامة"}
  # ============== al-Anbiya 21
  - id: hadith-60-ancient-suras-of-ibn-masud
    tradition: islam
    corpus: hadith
    original: true
