      - {motif: blood-property-honour-sacred-as-this-day, refs: ["Jāmiʿ 60:7042.1"], note: "فإن دماءكم وأموالكم وأعراضكم حرام عليكم، كحرمة يومكم هذا ... ألا ليبلغ الشاهد الغائب"}
