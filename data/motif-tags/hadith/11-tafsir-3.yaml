      - {motif: laugh-little-weep-much, refs: ["Jāmiʿ 60:6954.1"], note: "وَلَوْ تَعْلَمُونَ مَا أَعْلَمُ، لَضَحِكْتُمْ قَلِيلًا وَلَبَكَيْتُمْ كَثِيرًا ... غَطَّوْا رُءُوسَهُمْ وَلَهُمْ خَنِينٌ"}
