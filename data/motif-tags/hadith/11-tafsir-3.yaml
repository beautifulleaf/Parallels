      - {motif: rules-of-the-raid, refs: ["Jāmiʿ 60:7022.2"], note: "اغزوا، ولا تغلوا، ولا تغدروا، ولا تمثلوا، ولا تقتلوا وليدا"}
      - {motif: three-options-islam-hijra-jizya, refs: ["Jāmiʿ 60:7022.2"], note: "فادعهم إلى ثلاث خصال ... إلى التحول من دارهم إلى دار المهاجرين ... كأعراب المسلمين ... فسلهم الجزية"}
      - {motif: do-not-give-them-gods-protection-give-yours, refs: ["Jāmiʿ 60:7022.2"], note: "فلا تجعل لهم ذمة اللَّه ولا ذمة نبيه ... فلا تنزلهم على حكم اللَّه ... فإنك لا تدري أتصيب حكم اللَّه فيهم أم لا"}
    hints:
      - "Offering terms before attacking a town against Deut 20:10-12 (offer it peace; if it opens, its people serve you as forced labour; if not, besiege it)."
