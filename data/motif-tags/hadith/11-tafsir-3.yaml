  - id: hadith-60-recipients-of-alms-9-60
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "The eight recipients - the rich and strong excluded, the true poor, the collector, the Prophet's kin, the reconciled hearts, slaves, debtors"
    read: ["Jāmiʿ 60:7047.1-7052.1"]
    quran: ["9:60"]
    tags:
      - {motif: no-share-for-rich-or-able-earner, refs: ["Jāmiʿ 60:7047.1", "Jāmiʿ 60:7047.2"], note: "فقلّب فيهما البصر، فرآهما جلدين ... ولا حظ فيها لغني، ولا لقوي مكتسب ... لا تحل الصدقة لغني ولا لذي مِرّة سويٍّ"}
      - {motif: poor-is-not-the-beggar-round-the-doors, refs: ["Jāmiʿ 60:7048.1"], note: "ليس المسكين بهذا الطواف الذي يطوف على الناس، فترده اللقمة واللقمتان ... الذي لا يجد غنى يغنيه، ولا يفطن الناس له"}
      - {motif: wage-for-the-collector-take-what-unasked, refs: ["Jāmiʿ 60:7048.2"], note: "أمر لي بعمالة، فقلت: إنما عملت لله ... إذا أعطيت شيئا من غير أن تسأل، فكل وتصدق"}
      - {motif: alms-are-the-dirt-of-people, refs: ["Jāmiʿ 60:7048.3"], note: "إن الصدقة لا تنبغي لآل محمد. إنما هي أوساخ الناس ... أنكح هذا الغلام ابنتك ... أَصدِق عنهما من الخمس كذا وكذا"}
      - {motif: zaynab-signals-from-behind-curtain, refs: ["Jāmiʿ 60:7048.3"], note: "وجعلت زينب تُلمِع علينا من وراء الحجاب أن لا تكلّماه"}
      - {motif: safwan-given-hundreds-until-he-loved-him, refs: ["Jāmiʿ 60:7050.1"], note: "صفوان بن أميه مائة من النعم، ثم مائة، ثم مائة ... وإنه لأبغض الناس إليّ، فما برح يعطينى حتى إنه لأحب الناس إليّ"}
      - {motif: believer-or-muslim, refs: ["Jāmiʿ 60:7050.2"], note: "إني لأراه مؤمنا. قال: أو مسلما؟ ... إني لأعطي الرجل، وغيره أحبّ إليّ منه، خشية أن يكب في النار على وجهه"}
      - {motif: gold-in-its-earth-divided-among-four, refs: ["Jāmiʿ 60:7050.3"], note: "بِذَهَبَةٍ في تربتها ... فقسمها ... بين أربعة نفر ... أتعطي صناديد نجد وتدعنا ... إني إنما فعلت ذلك لأتألفهم"}
      - {motif: man-of-thick-beard-shaved-head, refs: ["Jāmiʿ 60:7050.3"], note: "فجاء رجل كثُّ اللحية، مشرف الوجنتين، غائر العينين، ناتئ الجبين، محلوق الرأس، فقال: اتق الله، يا محمد"}
      - {motif: pass-through-religion-like-arrow-through-game, refs: ["Jāmiʿ 60:7050.3"], note: "إن من ضئضئ هذا قوما يقرؤون القرآن، لا يجاوز حناجرهم ... يمرقون من الإسلام كما يمرق السهم من الرمية"}
      - {motif: killing-as-ad-were-killed, refs: ["Jāmiʿ 60:7050.3"], note: "يقتلون أهل الإسلام، ويدعون أهل الأوثان ... لئن أدركتُهم لأقتلنّهم قتل عاد"}
      - {motif: three-whom-god-must-help, refs: ["Jāmiʿ 60:7051.1"], note: "ثلاثة حق على الله عونهم: المجاهد في سبيل الله، والمكاتب الذي يريد الأداء، والناكح الذي يريد التعفف"}
      - {motif: creditors-take-what-you-find, refs: ["Jāmiʿ 60:7051.2"], note: "أصيب رجل ... في ثمار ابتاعها، فكثر دينه ... خذوا ما وجدتم وليس لكم إلا ذلك"}
      - {motif: asking-lawful-for-three-only, refs: ["Jāmiʿ 60:7051.3"], note: "إن المسألة لا تحل إلا لأحد ثلاثة: رجل تحمّل حمالة ... ورجل أصابته جائحة ... حتى يقوم ثلاثة من ذوي الحجا من قومه ... سحتا يأكلها صاحبها سحتا"}
      - {motif: alms-lawful-to-five-rich, refs: ["Jāmiʿ 60:7052.1"], note: "لا تحل الصدقة لغني إلا لخمسة: لعامل عليها، أو لغاز في سبيل الله، أو غني اشتراها بماله، أو فقير تُصدِّق عليه فأهداها لغني، أو غارم"}
    hints:
      - "Poverty attested by 'three men of understanding of his people' before begging is lawful against m. Pe'ah 8:7-8, where the poor man's claim is checked and a fixed threshold (two hundred zuz) decides who may take the gleanings and tithe."
