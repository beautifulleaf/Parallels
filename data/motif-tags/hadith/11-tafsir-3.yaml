      - {motif: punishment-in-world-is-expiation, refs: ["Jāmiʿ 60:6975.1"], note: "فعوقب في الدنيا، فهو كفارة له، ومن أصاب من ذلك شيئًا، ثم ستره اللَّه، فهو إلى اللَّه إن شاء عفا عنه، وإن شاء عاقبه"}
      - {motif: none-more-jealous-than-god-forbade-indecencies, refs: ["Jāmiʿ 60:6976.1"], note: "لا أحد أغير من اللَّه. ولذلك حرم الفواحش ما ظهر منها وما بطن، ولا أحد أحب إليه المدح من اللَّه، ولذلك مدح نفسه"}
      - {motif: gods-jealousy-is-believer-doing-forbidden, refs: ["Jāmiʿ 60:6976.2"], note: "إن اللَّه يغار، وإن المؤمن يغار، وغيرة اللَّه أن يأتي المؤمن ما حُرِّمَ عليه"}
      - {motif: greatest-sins-rival-child-killing-neighbours-wife, refs: ["Jāmiʿ 60:6977.1"], note: "أن تجعل للَّه ندا وهو خلقك ... أن تقتل ولدك خشية أن يطعم معك ... أن تزاني بحليلة جارك"}
      - {motif: jealous-god, refs: ["Jāmiʿ 60:6976.1", "Jāmiʿ 60:6976.2"], note: "لا أحد أغير من اللَّه ... إن اللَّه يغار"}
    hints:
      - "God's jealousy (ghayra) as the ground of the ban on indecencies against Exod 34:14-16, where 'YHWH whose name is Jealous' forbids the covenant that leads sons to 'whore after' other gods."
