  - id: hadith-60-sun-held-and-the-fire-8-69
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "The raiding prophet who held the sun - the exempted men, the hand that sticks, the gold cow's head, the fire"
    read: ["Jāmiʿ 60:7019.2"]
    quran: ["8:69"]
    tags:
      - {motif: bridegroom-builder-herdsman-not-to-follow-raid, refs: ["Jāmiʿ 60:7019.2"], note: "لا يتبعني رجل قد ملك بضع امرأة، وهو يريد أن يبني بها، ولمّا يبن، ولا آخر قد بنى بنيانا، ولما يرفع سقفها، ولا آخر قد اشترى غنما أو خلفات، وهو منتظر ولادها"}
      - {motif: sun-held-for-raiding-prophet-till-conquest, refs: ["Jāmiʿ 60:7019.2"], note: "فأدنى للقرية حين صلاة العصر ... فقال للشمس: أنتِ مأمورة وأنا مأمور، اللهم احبسها علي شيئًا. فحُبِست عليه حتى فتح اللَّه عليه"}
      - {motif: thief-found-by-hand-sticking-tribe-by-tribe, refs: ["Jāmiʿ 60:7019.2"], note: "فليبايعني من كل قبيلة رجل. فبايعوه، فلصقت يد رجل بيده ... فلصقت بيد رجلين أو ثلاثة"}
      - {motif: gold-head-of-a-cow-brought-out, refs: ["Jāmiʿ 60:7019.2"], note: "فأخرجوا له مثل رأس بقرة من ذهب. قال: فوضعوه في المال وهو بالصعيد، فأقبلت النار، فأكلته"}
      - {motif: fire-from-heaven-consumes-the-spoils, refs: ["Jāmiʿ 60:7019.2"], note: "فأقبلت النار لتأكله، فأبت أن تطعمه، فقال: فيكم غلول"}
      - {motif: spoils-lawful-only-for-this-community, refs: ["Jāmiʿ 60:7019.2"], note: "فلم تحل الغنائم لأحدٍ من قبلنا، ذلك بأن اللَّه ﵎ رأى ضعفنا وعجزنا، فطيبها لنا"}
    hints:
      - "The men barred from following the raid - one who has a woman and has not gone in to her, one who built and has not roofed - against Deut 20:5-7 (who has built a new house and not dedicated it, planted a vineyard, betrothed a wife and not taken her: let him go home)."
      - "The sun held back at the town's conquest until afternoon's end against Josh 10:12-13 ('Sun, stand still at Gibeon'), and the thief found by successive groups with stolen gold against Josh 7:16-21 (Achan taken tribe by tribe, clan by clan, with a wedge of gold)."
