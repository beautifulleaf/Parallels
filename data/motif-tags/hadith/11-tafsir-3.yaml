      - {motif: captive-mother-suckling-any-child, refs: ["Jāmiʿ 60:6965.2"], note: "إذا وجدت صبيا في السبي أخذته، فألصقته ببطنها، وأرضعته ... للَّه أرحم بعباده من هذه بولدها"}
