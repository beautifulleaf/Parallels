# Hadith chunk 11: al-Jāmiʿ al-Kāmil book 60 (tafsir), pp. 6940-7059 (printed 10/276-395):
# the end of al-Ma'ida (from 5:67), al-An'am, al-A'raf, al-Anfal and al-Tawba to 9:80.
# Read in full from the Arabic. The compiler's commentary, his 'wa-ruwiya' reports he grades weak
# (e.g. Tha'laba b. Hatib, 7057) and the athar he quotes are context only, not lines.
new_motifs:
  # ---- al-Ma'ida
  arab-takes-sleeping-prophets-sword-from-tree-asks-who-protects: {label: "On a raid a man takes the sleeping prophet's sword from the tree he rests under and asks 'who will protect you from me tonight?'; answer 'God', and 5:67 is sent down", cluster: sira}
  ten-jews-following-would-bring-all-jews: {label: "If ten of the Jews followed the prophet, no Jew on earth would remain without becoming Muslim", cluster: polemic}
  food-as-alms-refused-as-gift-eaten: {label: "Food brought as alms (sadaqa) the prophet gives to his companions and does not eat; brought as a gift (hadiyya) he eats of it", cluster: law}
  no-good-in-christians-then-praised-ones-revealed: {label: "Asked about the Christians the prophet says 'no good in them'; then 5:82-83 is sent down and he tells Salman 'your companions are those God mentioned'", cluster: polemic}
  negus-and-companions-weep-at-recitation: {label: "5:83 (eyes overflowing with tears at what they recognise as truth) is said to be revealed about the Negus and his companions", cluster: sira}
  campaigners-ask-to-castrate-themselves: {label: "Companions on campaign without wives ask 'shall we castrate ourselves?'; he forbids it and permits marrying a woman for a garment for a term", cluster: law}
  i-fast-and-eat-pray-and-sleep-marry-women: {label: "Companions resolve to cut off their members, renounce desire and wander like monks; the prophet: 'I fast and break fast, pray and sleep, marry women: whoever does not take my sunna is not of me'", cluster: law}
  idle-oath-is-no-by-god-yes-by-god: {label: "The idle oath (laghw) of 5:89 is a man's saying 'no, by God' and 'yes, by God'", cluster: law}
  abu-bakr-broke-no-oath-until-expiation-revealed: {label: "Abu Bakr never broke an oath until the expiation was revealed; thereafter he did what was better and took God's concession", cluster: law}
  average-food-between-ample-and-scanty: {label: "'The average of what you feed your families' (5:89): one man fed his family amply, another scantily", cluster: law}
  wine-forbidden-when-five-drinks-none-of-grape: {label: "When wine was forbidden there were five drinks in Medina and none of them of grapes", cluster: law}
  wine-from-five-things-what-befogs-the-mind: {label: "'Wine is from five things: grapes, dates, honey, wheat and barley; wine is what befogs (khamara) the mind' (Umar from the pulpit)", cluster: law}
  three-matters-wished-settled-grandfather-kalala-usury: {label: "Umar wishes the prophet had left a decisive ruling on three things: the grandfather, kalala and some kinds of usury", cluster: law}
  wine-jars-poured-out-at-the-news: {label: "At a drinking party the news 'wine has been forbidden' comes; the host says 'pour out these jars' and no one asks again", cluster: law}
  poured-wine-runs-in-medinas-streets: {label: "The poured-out wine runs in the streets (sikak) of Medina", cluster: law}
  dicer-dyes-hand-in-pigs-flesh-and-blood: {label: "Whoever plays nardashir (backgammon) is as if he dyed his hand in the flesh and blood of a pig", cluster: law}
  dead-wine-drinkers-not-blamed: {label: "Some ask about those killed or dead with wine in their bellies before the ban; 5:93 answers that there is no blame for what they ate", cluster: law}
  martyrs-of-uhud-drank-wine-that-morning: {label: "Some men drank wine the morning of Uhud and were all killed as martyrs that day, before it was forbidden", cluster: sira}
  prophet-told-you-are-among-them: {label: "When 5:93 came down the prophet told Ibn Mas'ud: 'I was told: you are among them'", cluster: revelation}
  sea-casts-up-beast-called-anbar: {label: "Three hundred riders on the shore, starving and eating leaves (khabat), are given by the sea a beast called al-'anbar; they eat it half a month and oil themselves with its fat", cluster: sira}
  rider-and-camel-pass-under-the-rib: {label: "The commander sets up one rib of the sea-beast and the tallest man on a camel passes under it", cluster: sira}
  three-camels-slaughtered-three-times: {label: "A man of the army slaughters three camels, then three, then three, until the commander forbids him", cluster: sira}
  ask-me-anything-from-the-pulpit: {label: "Pressed with questions, the prophet mounts the pulpit: 'ask me; you will ask me nothing but I tell you, while I stand here'; men weep with heads wrapped", cluster: sira}
  your-father-is-hudhafa: {label: "A man whose paternity was disputed asks 'who is my father?' and is told 'your father is Hudhafa'", cluster: sira}
  umar-we-are-content-with-god-as-lord: {label: "Umar kneels: 'we are content with God as Lord, Islam as religion, Muhammad as messenger', and the prophet falls silent", cluster: sira}
  paradise-and-fire-shown-beyond-the-wall: {label: "Paradise and hell were shown (pictured) to the prophet just now beyond (in the breadth of) this wall; 'I have never seen a day like this in good and evil'", cluster: eschatology}
  mother-rebukes-son-for-risking-her-shame: {label: "His mother: what if I had done what women of the Jahiliyya did and you exposed me before everyone? He: had he joined me to a black slave I would have accepted it", cluster: sira}
  mocking-questions-where-is-my-camel: {label: "Some asked mockingly 'who is my father?', 'where is my lost camel?', and 5:101 was revealed", cluster: revelation}
  god-dislikes-gossip-waste-and-much-asking: {label: "God dislikes three things for you: 'it was said and he said', wasting wealth, and much questioning", cluster: ethics}
  emigrants-did-not-question-the-prophet: {label: "A man stays a year in Medina without emigrating only so as to ask, for an emigrant would not ask the prophet anything", cluster: sira}
  righteousness-good-character-sin-what-pricks-the-soul: {label: "Righteousness is good character; sin is what pricks (haka) in your soul and you dislike people to see", cluster: ethics}
  bahira-milk-withheld-saiba-freed-for-the-gods: {label: "The bahira is the she-camel whose milk is withheld for the idols (tawaghit); the sa'iba is let loose for their gods and carries nothing", cluster: law}
  wasila-and-hami-defined: {label: "The wasila is the she-camel that bears a female first and then another female with no male between, freed for the idols; the hami the stud that has completed its count of coverings, freed from burden", cluster: law}
  first-to-let-loose-the-saiba: {label: "The man seen dragging his entrails in hell was the first to let loose the sa'iba camels", cluster: eschatology}
  hell-parts-crushing-one-another: {label: "The prophet saw hell, its parts crushing (yahtimu) one another", cluster: eschatology}
  people-misplace-the-verse-on-minding-yourselves: {label: "Abu Bakr: you read 'you are responsible for yourselves' (5:105) wrongly; people who see wrong and do not change it will be engulfed by God's punishment", cluster: ethics}
  stay-home-hold-tongue-mind-yourself: {label: "When covenants are confused and trusts slight, people intertwined like fingers: keep to your house, hold your tongue, take what you know, mind your own affair and leave the commons", cluster: eschatology}
  days-of-patience-like-grasping-embers: {label: "Days of patience will come when holding fast is like grasping a live coal; the doer then has the reward of fifty of you", cluster: eschatology}
  avarice-obeyed-passion-followed: {label: "Signs when to mind oneself: avarice obeyed, passion followed, the world preferred, everyone pleased with his own opinion", cluster: eschatology}
  missing-silver-cup-and-heirs-oath: {label: "A man dies abroad with two non-Muslim companions; a silver cup inlaid with gold is missing; they swear, the cup is found in Mecca, and two heirs swear 'our testimony is truer'", cluster: law}
  prophet-quotes-jesus-words-of-517: {label: "Seeing his men taken to the left, the prophet says as 'the righteous servant' said: 'I was a witness over them while among them; when you took me, you were the watcher over them'", cluster: eschatology}
  apostatized-since-you-left-them: {label: "'These have not ceased turning back on their heels since you parted from them'", cluster: eschatology}
  # ---- al-An'am
  praise-to-him-who-feeds-and-is-not-fed: {label: "After a meal the prophet says 'praise to God who feeds and is not fed', with a long praise of food, drink, clothing, guidance and sight", cluster: ritual}
  none-withholds-what-god-gives: {label: "After each prescribed prayer: 'none withholds what you give, none gives what you withhold; the fortune of the fortunate avails nothing against you'", cluster: ritual}
  worldly-gifts-to-sinner-are-gradual-snare: {label: "When you see God give a servant what he loves of the world while he persists in sin, that is a gradual luring (istidraj)", cluster: ethics}
  six-weak-followers-and-drive-them-away: {label: "The polytheists ask the prophet to drive away six poor followers; something occurs in his soul and 6:52 is revealed", cluster: revelation}
  written-above-the-throne-mercy-prevails: {label: "When God completed creation he wrote in his book that is with him above the Throne: 'my mercy prevails over my wrath'", cluster: cosmology}
  hundred-mercies-each-spanning-heaven-and-earth: {label: "God created a hundred mercies the day he created heaven and earth, each filling the space between; one he put on earth, by it the mother inclines to her child and beasts and birds to each other", cluster: cosmology}
  captive-mother-suckling-any-child: {label: "A captive woman with milk takes any child she finds among the captives, presses it to her belly and suckles it; 'God is more merciful to his servants than she to her child'", cluster: ethics}
  i-seek-refuge-in-your-face: {label: "At 'from above you' and 'from beneath your feet' the prophet says 'I seek refuge in your face'; at 'split you into factions' he says 'this is lighter'", cluster: revelation}
  zulm-in-682-is-shirk: {label: "Companions ask 'who of us has not wronged himself?'; the wrong (zulm) of 6:82 is not as they think but shirk, as Luqman told his son", cluster: revelation}
  prostration-in-sad-from-following-prophets: {label: "Ibn Abbas finds the prostration in Sura Sad in 6:90: 'follow their guidance' - David is among them, and your prophet was ordered to follow them", cluster: ritual}
  my-wealth-three-things-only: {label: "'My wealth, my wealth!' - of his wealth he has only three: what he ate and consumed, wore and wore out, or gave and so sent ahead", cluster: ethics}
  every-bringer-of-this-was-opposed: {label: "Waraqa: no man ever brought the like of what you bring but he was opposed (ʿudiya)", cluster: revelation}
  what-god-killed-you-do-not-eat: {label: "Disputers say: what God slaughtered you do not eat and what you slaughter you eat; 6:121 is revealed", cluster: law}
  creation-in-darkness-light-cast-upon-them: {label: "God created his creatures in darkness and cast upon them of his light; whom it reached was guided, whom it missed went astray: the pen has dried", cluster: cosmology}
  ignorance-of-arabs-in-anam-130-140: {label: "To know the ignorance of the Arabs read above verse 130 of al-An'am to 'they have gone astray'", cluster: revelation}
  sale-of-wine-carrion-swine-idols-forbidden: {label: "God and his messenger have forbidden selling wine, carrion, swine and idols; carrion fat used to caulk ships, oil hides and light lamps is still forbidden", cluster: law}
  umar-curses-man-who-sold-wine: {label: "Told that a man sold wine, Umar curses him, citing the prophet's curse on the Jews who sold the forbidden fat", cluster: law}
  pledge-on-the-forbidden-acts-of-6151: {label: "The prophet takes a pledge from a band of companions: no shirk, theft, adultery, killing children, slander, disobedience; whoever is punished here it expiates, whom God conceals is in his will", cluster: law}
  none-more-jealous-than-god-forbade-indecencies: {label: "None is more jealous (aghyar) than God; for that he forbade indecencies open and hidden; none loves praise more than God, so he praised himself", cluster: theology}
  gods-jealousy-is-believer-doing-forbidden: {label: "God is jealous and the believer is jealous; God's jealousy is that the believer do what is forbidden him", cluster: theology}
  line-of-god-and-side-lines-with-devils: {label: "The prophet draws a line: 'this is God's path', then lines to its right and left: 'paths, on each a devil calling to it'", cluster: ethics}
  path-with-walls-open-doors-curtains-two-callers: {label: "A straight path with a wall on each side, open doors with curtains let down, a caller at its head and a caller above it who warns any who would open a door", cluster: ethics}
  three-signs-after-which-faith-avails-not: {label: "Three, once they come out, faith avails no soul that had not believed: the sun rising from the west, the Dajjal, and the Beast of the earth", cluster: eschatology}
  sun-rises-from-west-all-believe: {label: "The Hour will not come until the sun rises from its setting place; when people see it all believe, and that is when faith avails not", cluster: eschatology}
  intended-good-written-whole-done-tenfold-to-700: {label: "An intended good deed not done is written a whole good deed; done, ten to seven hundredfold and more; an intended bad deed left is written a good deed, done is written one", cluster: eschatology}
  # ---- al-A'raf
  never-sick-never-die-never-old-call-in-paradise: {label: "A caller in paradise: you shall be healthy and never sick, live and never die, be young and never old, be at ease and never in misery", cluster: eschatology}
  manifestation-like-tip-of-little-finger: {label: "On 'when his Lord manifested himself to the mountain' the prophet shows the tip of his little finger: so much", cluster: theology}
  moses-told-of-calf-did-not-throw-tablets-until-he-saw: {label: "Report is not like seeing: God told Moses what his people did with the calf and he did not throw the tablets; when he saw it he threw them and they broke", cluster: moses}
  each-prophet-sent-to-his-people-i-to-all: {label: "Every prophet was sent to his own people only; I am sent to all people (every red and black)", cluster: revelation}
  given-five-things-none-before: {label: "Given five none had before: sent to all, spoils made lawful, the earth made pure and a place of prayer, help by terror a month's journey, intercession", cluster: revelation}
  preferred-over-prophets-by-six: {label: "Preferred over the prophets by six: concise speech (jawami' al-kalim), terror, spoils, earth pure and a mosque, sent to all creation, prophets sealed with me", cluster: revelation}
  hurr-recites-take-pardon-to-angry-umar: {label: "A rude bedouin chief insults Umar; his nephew recites 7:199 'turn away from the ignorant'; Umar stops at it, 'one who stopped at God's book'", cluster: ethics}
  take-pardon-revealed-for-peoples-manners: {label: "'Take what is pardon' (7:199) was revealed only about people's manners (akhlaq)", cluster: revelation}
  join-who-cut-you-give-who-denied-you: {label: "'Join who cuts you off, give who withholds from you, pardon who wrongs you'", cluster: ethics}
  you-call-no-deaf-or-absent-one: {label: "Shouting takbir over a valley, they are told: go easy, you do not call one deaf or absent; he is with you, hearing, near", cluster: ritual}
  # ---- al-Anfal
  anfal-revealed-on-badr: {label: "Sura al-Anfal was revealed about Badr (and al-Hashr about Banu al-Nadir; al-Tawba is 'the exposer')", cluster: revelation}
  young-fighters-and-elders-at-banners-dispute-spoils: {label: "The prophet promises shares to whoever does such and such; the young men rush forward, the elders hold the banners; they dispute the spoils and 8:1 is revealed", cluster: law}
  spoils-were-the-prophets-alone-needle-and-thread: {label: "The spoils were the prophet's alone; whoever kept back a needle or a thread committed ghulul; then the fifth (8:41) was sent down", cluster: law}
  sword-asked-as-booty-put-it-back: {label: "Sa'd asks the sword he took as a gift; 'put it back where you took it' is said again and again until 8:1 comes and it is given him", cluster: sira}
  paradise-chambers-seen-like-a-far-star: {label: "The people of paradise see those of the upper chambers as you see a brilliant star lingering on the horizon; not prophets only but men who believed and trusted the messengers", cluster: eschatology}
  one-of-the-two-parties-caravan-or-army: {label: "God promised them one of the two parties, the caravan of Abu Sufyan or Quraysh, and their souls were at ease", cluster: sira}
  badr-thousand-against-three-hundred-nineteen: {label: "At Badr the polytheists were a thousand and the prophet's men three hundred and nineteen", cluster: sira}
  cloak-falls-from-shoulders-in-supplication: {label: "Facing the qibla with hands outstretched the prophet cries 'if this band perishes you will not be worshipped on earth' until his cloak falls; Abu Bakr puts it back and holds him from behind", cluster: sira}
  whip-mark-turns-green: {label: "The enemy struck by the unseen horseman falls with nose split and face cut as by a whip, and the whole of it turns green", cluster: sira}
  prophet-and-abu-bakr-weep-over-ransom: {label: "Abu Bakr advises ransom, Umar killing; the prophet inclines to Abu Bakr; next day Umar finds them weeping: their punishment was shown 'nearer than this tree'", cluster: sira}
  prophet-leaves-tent-reciting-the-host-will-be-routed: {label: "In his tent at Badr the prophet pleads 'I adjure you by your covenant'; Abu Bakr takes his hand; he leaps out in his mail reciting 'the host will be routed' (54:45)", cluster: sira}
  angels-of-badr-are-best-of-angels: {label: "Gabriel asks how the Badr fighters rank among you - 'among the best' - 'so too the angels who were at Badr'", cluster: angels}
  gabriel-holding-his-horses-head-in-armour: {label: "'This is Gabriel holding his horse's head, with the gear of war on him'", cluster: angels}
  only-horseman-at-badr-al-miqdad: {label: "There was no horseman among us at Badr but al-Miqdad; all slept except the prophet, praying and weeping under a tree until morning", cluster: sira}
  night-drizzle-shelter-under-trees-and-shields: {label: "In the Badr night a drizzle of rain fell and they sheltered under trees and leather shields", cluster: sira}
  avoid-the-seven-destroyers: {label: "Avoid the seven destroyers (al-mubiqat): shirk, sorcery, killing a soul, usury, an orphan's property, fleeing the day of the advance, slandering chaste women", cluster: law}
  gabriel-tells-him-take-handful-of-dust: {label: "Gabriel tells the prophet 'take a handful of dust'; he throws it in their faces and every polytheist gets dust in eyes, nostrils and mouth", cluster: sira}
  sound-like-pebble-in-a-basin: {label: "At Badr a sound fell from heaven to earth like a pebble falling in a basin, and he threw the pebbles", cluster: sira}
  abu-jahl-prays-destroy-the-kin-cutter: {label: "Abu Jahl at Badr prays: 'O God, whichever of us most cut kinship and brought the unknown, destroy him this morning' - he was the one seeking judgment (8:19)", cluster: sira}
  two-young-ansar-kill-abu-jahl: {label: "Two young Ansari boys each ask Abd al-Rahman b. Awf to point out Abu Jahl, rush him with their swords; 'did you wipe your swords?' - 'both of you killed him'", cluster: sira}
  man-of-old-sawn-in-two-combed-with-iron: {label: "Men before you had a pit dug, a saw set on the head and were split in two, or were combed with iron combs below the flesh, and it did not turn them from their religion", cluster: martyrdom}
  deaf-dumb-are-a-clan-of-quraysh: {label: "'The worst beasts, deaf and dumb' (8:22) are a party of Banu Abd al-Dar", cluster: revelation}
  fatiha-the-greatest-sura-seven-mathani: {label: "Al-Hamd is the greatest sura of the Quran, the seven oft-repeated (al-sab' al-mathani) and the great Quran given to the prophet", cluster: revelation}
  hearts-between-two-fingers-of-the-merciful-as-one-heart: {label: "All the hearts of the children of Adam are between two of the fingers of the Merciful as one heart, turned as he wills", cluster: theology}
  passengers-on-a-ship-drilling-the-lower-deck: {label: "Those upholding God's limits and those breaking them are like people who drew lots for a ship: those below, drawing water, propose to bore a hole in their own share; if left all perish, if stopped all are saved", cluster: ethics}
  fatima-warns-of-oath-to-kill: {label: "Fatima weeps to her father that the chiefs have sworn to kill him; 'not one but knows his share of your blood'", cluster: sira}
  iblis-as-old-man-of-najd: {label: "Iblis comes to the Quraysh council as a venerable old man 'from Najd', rejects imprisonment and banishment and approves Abu Jahl's plan", cluster: sira}
  plan-to-imprison-till-death-like-the-poets: {label: "One proposes to chain him till he dies 'as the poets died before, Zuhayr and al-Nabigha' - answered by 52:30 'a poet; let us await for him the turn of fate'", cluster: sira}
  day-of-the-crowding: {label: "That day of the plot was called 'the day of the crowding' (yawm al-zahma)", cluster: sira}
  abu-jahl-asks-for-stones-from-heaven: {label: "Abu Jahl said 'O God, if this is the truth from you, rain stones on us from heaven' (8:32), and 8:33-34 came down", cluster: sira}
  polytheist-talbiya-except-a-partner-you-own: {label: "The polytheists' talbiya at the House: 'labbayk, no partner have you' - the prophet says 'enough, enough' - 'except a partner who is yours, whom you own with what he owns'", cluster: ritual}
  two-safeguards-prophet-and-asking-forgiveness: {label: "They had two safeguards (amanan): the prophet and asking forgiveness; the prophet went and the asking of forgiveness remained", cluster: revelation}
  whistling-and-clapping-defined: {label: "Al-muka' is whistling and al-tasdiya clapping; the people of the Jahiliyya circled the House naked", cluster: ritual}
  good-in-islam-not-taken-for-jahiliyya: {label: "Whoever does well in Islam is not taken to task for what he did in the Jahiliyya; whoever does ill is taken for both the first and the last", cluster: law}
  you-became-muslim-with-past-good: {label: "Asked about his alms, freeing slaves and ties of kin in the Jahiliyya: 'you have become Muslim with the good you did before'", cluster: law}
  amr-withdraws-hand-to-stipulate: {label: "Amr b. al-As draws back his hand at the pledge to stipulate forgiveness: 'do you not know that Islam demolishes what was before it?'", cluster: sira}
  who-fights-for-gods-word-highest: {label: "One fights for booty, one for renown, one to be seen; 'whoever fights so that God's word is highest is in God's path'", cluster: law}
  killed-after-saying-la-ilaha-illallah: {label: "Usama spears a man who said 'there is no god but God' when overtaken; 'did you kill him after he said it?' is repeated until Usama wishes he had not been Muslim before that day", cluster: law}
  ordered-to-fight-till-they-witness-pray-give: {label: "Ordered to fight people until they witness there is no god but God and Muhammad is his messenger, pray and give zakat; then their blood and property are safe", cluster: law}
  ibn-umar-declines-civil-war: {label: "Pressed with 49:9 to fight, Ibn Umar prefers to be 'deceived' by that verse than by 4:93; 'we fought when Islam was few and men were tried in religion; now there is no fitna'", cluster: sira}
  fitna-was-entering-among-polytheists: {label: "Ibn Umar: the prophet fought the polytheists, and entering among them was a fitna; not like your fighting for kingship", cluster: sira}
  disobedient-town-fifth-to-god: {label: "A town you come to and stay in, your share is in it; a town that disobeyed God and his messenger, its fifth is God's and his messenger's, then it is yours", cluster: law}
  camel-hair-tuft-only-the-fifth-mine: {label: "Praying toward a booty camel, the prophet plucks a tuft of its hair: 'not even this of your spoils is lawful for me except the fifth, and the fifth is returned to you'", cluster: law}
  women-raiders-tend-wounded-get-gift-not-share: {label: "Women went on raids, treated the wounded and were given something from the booty, but no share was struck for them; children were not killed", cluster: law}
  orphanhood-ends-when-he-takes-for-himself: {label: "Orphanhood ends not with the beard but when a man takes for himself the right things people take; the fifth 'we said it is ours; our people refused'", cluster: law}
  slayers-claim-with-proof-gets-the-spoil: {label: "'Whoever killed a slain man and has proof of it has his spoil' is called three times; Abu Bakr: shall a lion of God's lions fight for God and you be given his spoil?", cluster: law}
  first-property-gained-in-islam: {label: "Abu Qatada sells the mail coat he won and buys a garden plot in Banu Salima: 'the first property I acquired in Islam'", cluster: sira}
  day-of-criterion-is-badr: {label: "The day of the criterion (yawm al-furqan) is Badr, when God divided truth from falsehood", cluster: revelation}
  met-without-appointment-at-badr: {label: "The prophet went out wanting the Quraysh caravan until God brought them and their enemy together without appointment; none was blamed for staying away", cluster: sira}
  caravan-of-forty-riders: {label: "Abu Sufyan returned from Syria with forty riders; the prophet went out with three hundred and some riders, eighty camels and a horse, most on foot", cluster: sira}
  paradise-under-shades-of-swords: {label: "Do not wish to meet the enemy; ask God for well-being; when you meet them be steadfast, and know paradise is under the shades of swords", cluster: warfare}
  revealer-of-book-driver-of-clouds-routing-confederates: {label: "Prayer: 'O God, revealer of the Book, driver of the clouds, router of the confederates, rout them and help us'", cluster: ritual}
  iblis-in-form-of-suraqa-withdraws-hand: {label: "Iblis comes to Badr with a troop of devils and a banner as Suraqa b. Malik of Mudlij; seeing Gabriel he snatches his hand from a polytheist's and flees: 'I see what you do not see'", cluster: sira}
  o-my-servants-i-forbade-injustice-to-myself: {label: "'O my servants, I have forbidden injustice to myself and made it forbidden among you'; all are astray, hungry, naked unless God guides, feeds, clothes", cluster: theology}
  needle-dipped-in-the-sea: {label: "If all men and jinn asked and each were given, it would lessen God's store only as a needle lessens the sea when dipped in it", cluster: theology}
  god-is-great-fidelity-not-treachery: {label: "Mu'awiya raids the Byzantines as the truce ends; a rider cries 'God is greatest, fidelity not treachery': no knot is untied before the term or notice given 'on equal terms', and Mu'awiya withdraws", cluster: law}
  force-is-shooting-three-times: {label: "From the pulpit: 'Prepare what force you can' - 'force is shooting' three times", cluster: warfare}
  horse-reward-shelter-or-burden: {label: "Horses are reward for one man, cover for another, a burden on a third; even the grazing, dung and water of the God's-path horse count as good deeds", cluster: warfare}
  donkeys-under-the-atoms-weight-verse: {label: "Asked about donkeys: nothing was revealed but this unique comprehensive verse, the atom's weight of good and evil (99:7-8)", cluster: revelation}
  good-tied-to-forelocks-of-horses: {label: "Good is tied to the forelocks of horses until the Day of Resurrection: reward and booty", cluster: warfare}
  ten-horsemen-scouts-against-the-dajjal: {label: "Ten horsemen are sent as scouts against the Dajjal; the prophet knows their names, their fathers' names and the colours of their horses", cluster: eschatology}
  horses-food-and-dung-in-the-balance: {label: "Whoever keeps a horse in God's path: its fill, drink, dung and urine are in his balance on the Day of Resurrection", cluster: warfare}
  rider-flying-at-every-alarm-or-shepherd-on-peak: {label: "Best livelihood: a man holding his horse's rein in God's path flying to every alarm, or one with a few sheep on a mountaintop praying until certainty comes", cluster: ethics}
  ansar-were-astray-divided-poor: {label: "To the Ansar after Hunayn: 'did I not find you astray and God guided you through me, divided and God joined you, poor and God enriched you?'", cluster: sira}
  one-against-ten-eased-to-one-against-two: {label: "It was prescribed that one must not flee from ten; it was eased to one from two, and patience was lessened as the number was lessened", cluster: law}
  i-do-not-punish-till-i-have-warned: {label: "'Had a decree not preceded' (8:68): were it not that I punish no one who disobeys until I have warned him first", cluster: theology}
  nearly-afflicted-for-opposing-you: {label: "After the ransom verse the prophet tells Umar: 'a calamity nearly befell us for opposing you'", cluster: sira}
  spoils-burned-by-fire-for-black-headed-peoples: {label: "Spoils were not lawful to any 'black-headed' people before you: fire came down from heaven and consumed them; at Badr people hastened to the booty and 8:68 came", cluster: law}
  sad-laughs-at-the-akhnas-insult: {label: "Told that 'the little snub-nose' (al-ukhaynis) hated and reviled him, Sa'd laughs until it overcomes him: a man may be angry with his brother without it touching his trust", cluster: sira}
  they-are-your-brothers-of-yesterday: {label: "Umar thrice says 'strike their necks'; the prophet turns away and says 'they are your brothers of yesterday'; Abu Bakr advises pardon and ransom and the gloom leaves his face", cluster: sira}
  bridegroom-builder-herdsman-not-to-follow-raid: {label: "A prophet going to war says: let no man follow me who has married a woman and not yet gone in to her, nor one who built a house and has not raised its roof, nor one who bought sheep or she-camels and awaits their young", cluster: warfare}
  sun-held-for-raiding-prophet-till-conquest: {label: "Near the town at the afternoon prayer the prophet tells the sun 'you are commanded and I am commanded; O God, hold it back for me', and it is held until the conquest", cluster: warfare}
  gold-head-of-a-cow-brought-out: {label: "The thieves bring out the like of a cow's head in gold; set with the spoil on the open ground, the fire comes and consumes it", cluster: warfare}
  abbas-forty-ounces-repaid-forty-slaves: {label: "Al-Abbas ransomed himself at Badr for forty ounces of gold and God gave him forty slaves, and the hope of forgiveness", cluster: sira}
  buried-money-known-only-to-abbas-and-umm-al-fadl: {label: "The prophet tells al-Abbas of the money he buried with Umm al-Fadl, which no one else knew; Abbas witnesses he is God's messenger; twenty ounces repaid with twenty slaves each trading with wealth", cluster: sira}
  not-a-dirham-of-the-ransom-remitted: {label: "Ansar ask leave to waive the ransom of 'our sister's son' Abbas: 'do not leave a single dirham of it'", cluster: sira}
  emigrants-helpers-allies-freedmen-allies: {label: "Emigrants and Ansar are allies of one another in this world and the next; the freed captives (tulaqa') of Quraysh and freedmen of Thaqif are allies of one another to the Day of Resurrection", cluster: sira}
  no-hijra-now-but-jihad-and-intention: {label: "Aisha: no emigration today; the believer used to flee with his religion lest he be tried; now God has made Islam prevail and each worships his Lord where he will", cluster: law}
  three-options-islam-hijra-jizya: {label: "Invite the enemy to three things: Islam (and moving to the abode of the emigrants, else they are like Muslim bedouin with no share of booty), else the jizya, else fight", cluster: law}
  do-not-give-them-gods-protection-give-yours: {label: "Besieging a fort: do not grant them God's and his prophet's guarantee but yours; do not bring them down on God's judgment but on yours, for you do not know if you hit it", cluster: law}
  brothered-emigrant-and-helper-inherited: {label: "The prophet paired emigrant and helper as brothers and they expected to inherit from each other until 'blood relatives are nearer one to another' (8:75)", cluster: law}
  sworn-ally-inheritance-abrogated: {label: "A man would ally himself with another without kinship and each inherit from the other; al-Anfal abrogated it", cluster: law}
  # ---- al-Tawba
  tawba-the-exposer-and-them-and-them: {label: "Al-Tawba is 'the exposer' (al-fadiha): it kept coming down 'and of them... and of them...' until they thought it would leave none unmentioned", cluster: revelation}
  last-verse-kalala-last-sura-baraa: {label: "The last verse revealed was 'they ask you for a ruling: say God gives you a ruling on kalala' (4:176) and the last sura Bara'a", cluster: revelation}
  ali-sent-after-to-proclaim-baraa: {label: "Abu Bakr sends criers at Mina on the day of sacrifice: no polytheist to make pilgrimage after this year, none to circle naked; Ali is sent after to proclaim Bara'a", cluster: sira}
  day-of-sacrifice-is-greatest-pilgrimage: {label: "Standing among the jamarat on the day of sacrifice: 'what day is this?' - 'the day of sacrifice' - 'this is the day of the greatest pilgrimage'", cluster: ritual}
  messenger-not-commander-reads-baraa-at-each-station: {label: "Abu Bakr hears the grumble of the prophet's camel al-Jad'a; Ali on it: 'messenger, not commander'; Abu Bakr preaches the rites and Ali reads Bara'a to the end at each station", cluster: sira}
  four-hypocrites-left-one-old-man: {label: "Only three of the people of 9:12 and four of the hypocrites remain; one an old man who if he drank cold water would not feel its coolness", cluster: sira}
  builder-of-mosque-given-house-in-paradise: {label: "Whoever builds a mosque seeking God's face, God builds the like for him in paradise", cluster: ritual}
  going-to-mosque-prepares-hospitality: {label: "Whoever goes to the mosque morning or evening, God prepares for him a hospitality (nuzul) in paradise each time", cluster: ritual}
  three-claim-best-deed-at-the-pulpit: {label: "At the pulpit one says watering pilgrims is best, another tending the Sacred Mosque, a third jihad; Umar rebukes their raised voices on Friday; 9:19 comes", cluster: revelation}
  abbas-captive-claims-tending-house-and-watering: {label: "Al-Abbas, captured at Badr: 'if you preceded us in Islam, emigration and jihad, we tended the Sacred Mosque, watered pilgrims and freed captives'", cluster: sira}
  prophet-drinks-from-common-trough: {label: "At the water-station the prophet asks 'give me to drink' though 'they put their hands in it', drinks, and tells the Zamzam workers 'were it not that you would be overcome I would put the rope on my shoulder'", cluster: ritual}
  pilgrims-given-nabidh-not-honey-or-milk: {label: "Ibn Abbas's family gives pilgrims nabidh, not honey and milk: the prophet drank nabidh with Usama behind him and said 'well done, do so'", cluster: ritual}
  more-beloved-than-father-child-and-all: {label: "None of you believes until I am more beloved to him than his father, his child and all people (than his family and wealth)", cluster: ethics}
  more-beloved-than-yourself-now-umar: {label: "Umar: 'you are dearer to me than everything but myself' - 'no, until dearer than yourself' - 'now, by God, dearer than myself' - 'now, Umar'", cluster: ethics}
  people-of-the-acacia-called-back: {label: "Abbas, a loud-voiced man, cries 'where are the people of the acacia (al-samura)?'; they turn back like cows to their calves, crying labbayk", cluster: sira}
  now-the-oven-is-hot: {label: "Watching the battle from his mule the prophet says 'now the oven (al-watis) is hot'; he throws pebbles: 'they are routed, by the Lord of Muhammad'", cluster: sira}
  handsome-faced-men-say-shahat-al-wujuh: {label: "A man who fought at Hunayn as an unbeliever: when they reached the prophet, men with handsome faces stood between and said 'disfigured be the faces, go back', and they were routed", cluster: sira}
  believer-does-not-become-impure: {label: "A companion slips away being in a state of janaba to wash; 'glory to God, the believer (Muslim) does not become impure'", cluster: purity}
  enemy-like-bird-head-two-wings-two-feet: {label: "Al-Hurmuzan: the enemy is like a bird with a head, two wings and two feet; break the head (Chosroes) and all fall: march on Chosroes", cluster: sira}
  we-sucked-hides-and-date-stones: {label: "Before Chosroes' governor al-Mughira: we were Arabs in hardship, sucking hides and date-stones for hunger, wearing hair, worshipping trees and stones, until God sent us a prophet", cluster: sira}
  throw-off-this-idol-gold-cross: {label: "Adi b. Hatim comes with a gold cross on his neck: 'throw this idol off you'", cluster: polemic}
  lords-by-making-lawful-and-unlawful: {label: "They did not worship their rabbis and monks, but when these made something lawful they took it as lawful and when they forbade, forbidden", cluster: polemic}
  woman-travels-from-hira-to-kaba-safe: {label: "A litter-woman will travel from al-Hira and circle the Kaaba fearing none but God; Chosroes' treasures will be opened; a man will offer a handful of gold and find none to take it", cluster: eschatology}
  no-interpreter-between-man-and-god: {label: "Each will meet God with no interpreter between them; he looks right and sees only hell, left and sees only hell: guard against the fire with half a date", cluster: eschatology}
  lat-and-uzza-worshipped-again-after-good-wind: {label: "Night and day will not end until al-Lat and al-Uzza are worshipped; God sends a good wind that takes everyone with a mustard seed of faith and the rest return to their fathers' religion", cluster: eschatology}
  earth-gathered-for-me-east-and-west: {label: "God gathered (zawa) the earth for me so I saw its east and west; my community's rule will reach what was gathered; given the red and the white treasures", cluster: eschatology}
  not-destroyed-by-famine-nor-outside-enemy: {label: "Asked for his community: not destroyed by a general famine nor an outside enemy, but they will destroy and capture one another", cluster: eschatology}
  religion-enters-every-house-of-clay-and-hair: {label: "This religion will reach where night and day reach; God leaves no house of clay or of hair (madar, wabar) without entering it, with honour for the honoured or humiliation for the humbled", cluster: eschatology}
  zakat-made-purification-of-wealth: {label: "Ibn Umar: the hoarding verse was before zakat came down; then God made zakat a purification of wealth", cluster: law}
  hoard-heated-into-plates-to-brand: {label: "Every owner of a hoard who pays no zakat: it is heated in hell, made into plates, his sides and forehead branded, in a day of fifty thousand years", cluster: eschatology}
  hot-stones-on-nipple-through-shoulder: {label: "Abu Dharr: give the hoarders glad tidings of hot stones heated in hell, put on the nipple till they come out at the shoulder-blade and on the shoulder-blade till out at the nipple", cluster: eschatology}
  hoard-becomes-bald-serpent-with-two-spots: {label: "Unpaid zakat is made a bald serpent with two black spots, coiled round him on the Day of Resurrection, seizing his jaws: 'I am your wealth, I am your hoard'", cluster: eschatology}
  abu-dharr-and-muawiya-on-the-hoarding-verse: {label: "At al-Rabadha Abu Dharr explains his exile: in Syria Mu'awiya said 9:34 was about the People of the Book, he said 'about us and them'; Uthman offered him a place apart", cluster: sira}
  not-even-uhud-in-gold-three-days: {label: "Seeing Uhud: I would not like to have its like in gold with a dinar left after three days, except to spend 'thus and thus' right, left and behind", cluster: ethics}
  the-most-are-the-least: {label: "The most (wealthy) are the least on the Day of Resurrection, except who spends thus and thus, and few they are", cluster: eschatology}
  unpaid-livestock-trample-and-gore: {label: "Camels, cows and sheep whose zakat was not paid come on the Day of Resurrection bigger and fatter, goring with horns and trampling with hooves, the first returning when the last has passed", cluster: eschatology}
  gold-tied-up-is-live-coal: {label: "Any gold or silver tied up is a live coal on its owner until he spends it in God's path; Abu Dharr has his surplus spent at once on small coins", cluster: ethics}
  time-turned-round-as-on-day-of-creation: {label: "Time has turned round to its form on the day God created heaven and earth; the year is twelve months, four sacred: three consecutive and Rajab of Mudar between Jumada and Sha'ban", cluster: ritual}
  what-day-what-month-silence: {label: "At the sermon the prophet asks 'which month, which land, which day is this?', and each time is silent until they think he will rename it", cluster: sira}
  world-to-hereafter-as-finger-dipped-in-sea: {label: "The world beside the hereafter is like what a finger dipped in the sea brings back", cluster: eschatology}
  world-meaner-than-a-dead-earless-kid: {label: "Holding a dead earless kid by the ear in the market: 'who would buy this for a dirham?'; 'the world is more worthless to God than this to you'", cluster: ethics}
  going-out-verse-abrogated-by-9122: {label: "Ibn Abbas: 'if you do not go out' (9:39) and 9:120-121 were abrogated by 9:122, not all the believers are to go out", cluster: law}
  feet-above-the-cave: {label: "Abu Bakr in the cave sees the polytheists' feet over their heads: 'if one looked at his feet he would see us beneath them'", cluster: sira}
  god-guarantees-the-raider-paradise-or-return: {label: "God guarantees whoever goes out only for jihad in his path either paradise or return home with reward or booty", cluster: warfare}
  asking-leave-verse-abrogated-by-2462: {label: "'Those who believe do not ask your leave' (9:44) was abrogated by al-Nur 24:62", cluster: law}
  who-is-just-if-i-am-not: {label: "A man says 'be just' as the prophet divides: 'woe to you, who is just if I am not?'; Umar asks to strike his neck: 'leave him'", cluster: sira}
  arrow-examined-at-feathers-shaft-head-no-trace: {label: "They pass through religion as the arrow passes the game: its head, shaft, binding and feathers are examined and nothing is found; it outran the dung and blood", cluster: polemic}
  no-share-for-rich-or-able-earner: {label: "Two strong men ask for alms: 'if you wish I give you; no share in it for the rich or the strong earner'", cluster: law}
  poor-is-not-the-beggar-round-the-doors: {label: "The poor (miskin) is not the one going round for a mouthful or a date, but who has not enough, is not noticed and does not stand up to ask", cluster: law}
  wage-for-the-collector-take-what-unasked: {label: "Umar pays the alms collector who protests he worked for God: 'take it; when given without asking, eat and give alms'", cluster: law}
  alms-are-the-dirt-of-people: {label: "Alms are not fit for the family of Muhammad, they are the dirt (awsakh) of people; instead the youths are married and dowered from the fifth", cluster: law}
  zaynab-signals-from-behind-curtain: {label: "While the two youths wait, Zaynab signals to them from behind the curtain not to speak", cluster: sira}
  safwan-given-hundreds-until-he-loved-him: {label: "At Hunayn Safwan b. Umayya is given a hundred camels, then a hundred, then a hundred: 'he was the most hateful of people to me, and kept giving until he was the most beloved'", cluster: sira}
  believer-or-muslim: {label: "Sa'd thrice says 'I see him a believer'; the prophet: 'or a Muslim?' I give a man while another is dearer, lest he be thrown on his face into the fire", cluster: theology}
  gold-in-its-earth-divided-among-four: {label: "Ali sends from Yemen a piece of gold still in its earth; it is divided among four chiefs to win them, and Quraysh is angered", cluster: sira}
  man-of-thick-beard-shaved-head: {label: "A man with thick beard, prominent cheeks, sunken eyes, bulging forehead and shaved head says 'fear God, Muhammad'", cluster: sira}
  three-whom-god-must-help: {label: "Three God is bound to help: the fighter in God's path, the slave under contract wanting to pay, the one marrying to be chaste", cluster: law}
  creditors-take-what-you-find: {label: "A man ruined by fruit he bought is given alms but not enough; creditors are told 'take what you find; you have nothing but that'", cluster: law}
  alms-lawful-to-five-rich: {label: "Alms are not lawful to a rich man except five: the collector, the fighter, one who bought it, one gifted it by a poor recipient, the debtor", cluster: law}
  hypocrite-clings-to-camel-girth-stones-bruise-him: {label: "A man who called the reciters greediest, most lying and most cowardly clings to the girth of the prophet's camel, stones bruising his feet, saying 'we were only chatting and playing'", cluster: sira}
  makhshi-asks-to-be-killed-unknown: {label: "Makhshi, pardoned, renamed Abd al-Rahman, asks to die a martyr whose death is unknown; killed at al-Yamama, no trace found", cluster: sira}
  follow-predecessors-into-lizards-hole: {label: "You will follow the ways of those before you span by span and cubit by cubit, even into a lizard's hole - the Jews and Christians? - who else? (Persians and Romans - who else are people?)", cluster: eschatology}
  believer-to-believer-as-building: {label: "The believer to the believer is like a building, one part bracing another, and he interlaces his fingers", cluster: ethics}
  believers-as-one-body-fever-and-sleeplessness: {label: "Believers in mutual mercy are like one body: when a limb complains, the rest answers with sleeplessness and fever", cluster: ethics}
  two-gardens-silver-two-gold-cloak-of-pride: {label: "Two gardens of silver, their vessels and all in them, two of gold; nothing between them and seeing their Lord but the cloak of pride on his face in the garden of Eden", cluster: eschatology}
  i-make-my-pleasure-alight-on-you: {label: "God asks paradise's people 'are you content?'; 'I give you better: I make my pleasure alight on you and will never be angry with you after'", cluster: eschatology}
  worse-than-donkeys-if-he-is-truthful: {label: "Al-Julas: 'if this man is truthful we are worse than donkeys'; Umayr b. Sa'd reports it, Julas swears he did not, and 9:74 comes", cluster: sira}
  man-looking-with-satans-eyes: {label: "'A man will come who looks with a devil's eyes; do not speak to him'; a blue-eyed man appears and is asked why he reviles", cluster: sira}
  hypocrite-three-signs-covenant-broken: {label: "Ibn Mas'ud: judge the hypocrites by three: when he speaks he lies, promises he breaks, covenants he betrays; 9:75-77 confirm it", cluster: ethics}
  half-sa-mocked-large-gift-called-show: {label: "Abu Aqil brings half a sa'; the hypocrites: God has no need of this; a man brings more: only for show; 9:79 is revealed", cluster: revelation}
  forty-ounces-of-gold-and-a-sa-of-food: {label: "Abd al-Rahman b. Awf brings forty ounces of gold, an Ansari a sa' of food; the hypocrites call the first show and say God and his messenger are rich beyond the sa'", cluster: revelation}
  shirt-given-to-shroud-ibn-ubayy: {label: "The son of Abd Allah b. Ubayy asks the prophet's shirt to shroud his father; he gives it and stands to pray over him", cluster: sira}
  given-choice-i-will-exceed-seventy: {label: "Umar seizes his garment; the prophet: 'God gave me the choice ... and I will add more than seventy'; he prays and 9:84 is revealed", cluster: sira}
  umar-wonders-at-his-daring: {label: "Umar afterwards wonders at his own daring with the prophet", cluster: sira}
  visitor-overstays-three-times-hijab-revealed: {label: "A man overstays; the prophet goes out three times so he will follow; Umar urges a curtain for his wives and 33:53 comes", cluster: sira}
  umar-says-blessed-is-god-best-of-creators: {label: "When the creation verses of al-Mu'minun come down Umar says 'blessed be God the best of creators', and 'so blessed be God...' (23:14) is revealed", cluster: revelation}
  if-we-agreed-i-would-not-defy-you: {label: "'If you two agreed I would not disobey you' - the prophet takes Abu Bakr's counsel of ransom and 8:67 comes", cluster: sira}

units:
  # ================= al-Ma'ida (end)
  - id: hadith-60-sword-taken-from-tree-5-67
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "The sleeping prophet's sword taken from a tree - 'who will protect you from me?' - and 5:67"
    read: ["Jāmiʿ 60:6940.1-6940.2"]
    quran: ["5:67"]
    tags:
      - {motif: sword-drawn-over-sleeper-who-protects-you, refs: ["Jāmiʿ 60:6940.1"], note: "تحت شجرة، وعلَّق بها سيْفَهُ ... إن هذا اخترطَ عليَّ سيفي وأنا نائم ... من يمنعك مني؟ فقلت: اللَّه ثلاثًا، ولم يعاقبْهُ"}
      - {motif: arab-takes-sleeping-prophets-sword-from-tree-asks-who-protects, refs: ["Jāmiʿ 60:6940.2"], note: "نظروا أعظم شجرة ... وقد علق السيف عليها، إذ جاء أعرابي ... يا محمد من يمنعك مني الليلة؟ فقال: اللَّه، فأنزل اللَّه: ﴿وَاللَّهُ يَعْصِمُكَ مِنَ النَّاسِ﴾"}
  - id: hadith-60-jews-salman-christians-5-82
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Ten Jews would bring all Jews; Salman's alms and gift; the Christians and 5:82-83"
    read: ["Jāmiʿ 60:6944.1-6945.1"]
    quran: ["5:82-83"]
    tags:
      - {motif: ten-jews-following-would-bring-all-jews, refs: ["Jāmiʿ 60:6944.1"], note: "لو تابعني عشرة من اليهود، لم يبق على ظهرها يهودي إِلَّا أسلم"}
      - {motif: food-as-alms-refused-as-gift-eaten, refs: ["Jāmiʿ 60:6945.1"], note: "صَدَقَةٌ، فَقَال لأَصْحَابِهِ: كُلُوا، وَلَمْ يَأْكُلْ ... هَدِيَّةٌ، فَضَرَبَ بِيَدِهِ فَأَكَلَ"}
      - {motif: no-good-in-christians-then-praised-ones-revealed, refs: ["Jāmiʿ 60:6945.1"], note: "أَخْبِرْنِي عَنِ النَّصَارَى؟ قَال: لا خَيْرَ فِيهِمْ ... يَا سَلْمَانُ إِنَّ أَصْحَابَكَ هَؤُلاءِ الَّذِينَ ذَكَرَ اللَّهُ"}
  - id: hadith-60-negus-weeping-5-83
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "5:83 revealed about the Negus and his companions"
    read: ["Jāmiʿ 60:6945.2"]
    quran: ["5:83"]
    tags:
      - {motif: negus-and-companions-weep-at-recitation, refs: ["Jāmiʿ 60:6945.2"], note: "نزلت هذه الآية في النجاشي، وفي أصحابه ﴿تَرَى أَعْيُنَهُمْ تَفِيضُ مِنَ الدَّمْعِ﴾"}
  - id: hadith-60-castration-and-monks-5-87
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
