    read: ["Jāmiʿ 60:7059.1-7059.3"]
    quran: ["9:80", "9:84", "63:6", "33:53", "8:67", "23:12-14"]
    tags:
      - {motif: shirt-given-to-shroud-ibn-ubayy, refs: ["Jāmiʿ 60:7059.1", "Jāmiʿ 60:7059.3"], note: "فسأله أن يعطيه قميصه يكفن فيه أباه، فأعطاه ... اطلب لي من رسول الله ﷺ ثوبا من ثيابه تكفنني فيه"}
      - {motif: given-choice-i-will-exceed-seventy, refs: ["Jāmiʿ 60:7059.1", "Jāmiʿ 60:7059.2", "Jāmiʿ 60:7059.3"], note: "إنما خيّرني الله ... وسأزيده على السبعين ... إني خيرت فاخترت، لو أعلم أني إن زدت على السبعين يغفر له لزدت عليها"}
      - {motif: seventy-times-forgiveness-useless, refs: ["Jāmiʿ 60:7059.1", "Jāmiʿ 60:7059.2"], note: "﴿إِنْ تَسْتَغْفِرْ لَهُمْ سَبْعِينَ مَرَّةً فَلَنْ يَغْفِرَ اللَّهُ لَهُمْ﴾"}
      - {motif: no-funeral-prayer-for-hypocrites, refs: ["Jāmiʿ 60:7059.1", "Jāmiʿ 60:7059.2", "Jāmiʿ 60:7059.3"], note: "فأنزل الله ﴿وَلَا تُصَلِّ عَلَى أَحَدٍ مِنْهُمْ مَاتَ أَبَدًا﴾"}
      - {motif: umar-wonders-at-his-daring, refs: ["Jāmiʿ 60:7059.2"], note: "فعجبت بعد من جرأتي على رسول الله ﷺ"}
      - {motif: visitor-overstays-three-times-hijab-revealed, refs: ["Jāmiʿ 60:7059.3"], note: "فأطال الجلوس، فخرج النبي ﷺ ثلاثا، لكي يتبعه، فلم يفعل ... لو اتخذت حاجبا، فإن نساءك لسن كسائر النساء"}
      - {motif: etiquette-of-prophets-house-and-curtain, refs: ["Jāmiʿ 60:7059.3"], note: "﴿وَإِذَا سَأَلْتُمُوهُنَّ مَتَاعًا فَاسْأَلُوهُنَّ مِنْ وَرَاءِ حِجَابٍ﴾"}
      - {motif: if-we-agreed-i-would-not-defy-you, refs: ["Jāmiʿ 60:7059.3"], note: "استحيي قومك، وخذ منهم الفداء ... اقتلهم. فقال: لو اجتمعنا ما عصيناكم"}
      - {motif: umar-says-blessed-is-god-best-of-creators, refs: ["Jāmiʿ 60:7059.3"], note: "فقال عمر: تبارك الله أحسن الخالقين، فأنزلت ﴿فَتَبَارَكَ اللَّهُ أَحْسَنُ الْخَالِقِينَ﴾"}
