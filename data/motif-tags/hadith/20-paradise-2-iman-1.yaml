  # ---- Book 2: faith (kitab al-iman), babs 1-53
  - id: hadith-2-gabriel-questions
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Gabriel as an unknown man asks of islam, iman, ihsan and the Hour; the slave woman bears her master; the herdsmen build tall"
    read: ["Jāmiʿ 2:119.1-121.2"]
    quran: ["31:34"]
    tags:
      - {motif: gabriel-asks-iman-islam-ihsan-and-the-hour, refs: ["Jāmiʿ 2:119.1", "Jāmiʿ 2:119.2", "Jāmiʿ 2:121.1", "Jāmiʿ 2:121.2"], note: "ما الإيمان؟ ... ما الإسلام؟ ... ما الإحسان؟ قال: أن تعبد الله كأنك تراه فإن لم تكن تراه فإنه يراك ... متى الساعة؟ قال: ما المسؤول عنها بأعلم من السائل"}
      - {motif: gabriel-in-human-form-teaches-faith, refs: ["Jāmiʿ 2:119.1", "Jāmiʿ 2:119.2"], note: "إذ طلع علينا رجل شديد بياض الثياب شديد سواد الشعر، لا يرى عليه أثر السفر، ولا يعرفه منا أحد ... فأسند ركبتيه إلى ركبتيه، ووضع كفيه على فخذيه ... فإنه جبريل أتاكم يعلمكم دينكم"}
      - {motif: questioner-confirms-answers-you-speak-truly, refs: ["Jāmiʿ 2:119.2", "Jāmiʿ 2:121.1"], note: "قال: صدقت! قال: فعجبنا له يسأله ويصدقه"}
      - {motif: gabriel-vanishes-when-sought, refs: ["Jāmiʿ 2:119.1"], note: "ثم أدبر فقال: ردوه فلم يروا شيئا!"}
      - {motif: slave-woman-bears-her-mistress-sign, refs: ["Jāmiʿ 2:119.1", "Jāmiʿ 2:119.2", "Jāmiʿ 2:121.2"], note: "إذا ولدت الأمة ربها ... أن تلد الأمة ربتها"}
      - {motif: barefoot-naked-shepherds-vie-in-building, refs: ["Jāmiʿ 2:119.1", "Jāmiʿ 2:119.2", "Jāmiʿ 2:121.2"], note: "وأن ترى الحفاة العراة العالة رعاء الشاء يتطاولون في البنيان ... ومن أصحاب الشاء والحفاة الجياع العالة؟ قال: العرب"}
      - {motif: five-keys-of-the-unseen, refs: ["Jāmiʿ 2:119.1", "Jāmiʿ 2:121.2"], note: "في خمس لا يعلمهن إلا الله، ثم تلا: ﴿إن الله عنده علم الساعة﴾"}
      - {motif: faith-includes-decree-good-and-evil, refs: ["Jāmiʿ 2:119.2", "Jāmiʿ 2:121.1", "Jāmiʿ 2:121.2"], note: "وتؤمن بالقدر خيره وشره (the question was prompted by Ma'bad al-Juhani's denial of qadar at Basra)"}
  - id: hadith-2-questioners-on-the-pillars
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "The Najdi who will add nothing; Dimam b. Tha'laba adjures the prophet by his Lord; Mu'awiya b. Hayda swears by his fingers"
    read: ["Jāmiʿ 2:122.1-126.1"]
    tags:
      - {motif: neither-add-nor-subtract-gains-paradise, refs: ["Jāmiʿ 2:122.1", "Jāmiʿ 2:123.1", "Jāmiʿ 2:124.1"], note: "خمس صلوات في اليوم والليلة. فقال: هل علي غيرهن قال: لا إلا أن تطوع ... والله لا أزيد على هذا ولا أنقص منه ... أفلح الرجل إن صدق"}
      - {motif: oath-by-maker-of-sky-earth-mountains, refs: ["Jāmiʿ 2:123.1", "Jāmiʿ 2:124.1"], note: "أسألك بربك ورب من قبلك، آلله أرسلك إلى الناس كلهم؟ فقال: اللهم نعم ... أنشدك الله إلهك، وإله من كان قبلك، وإله من هو كائن بعدك"}
      - {motif: camel-couched-and-hobbled-in-the-mosque, refs: ["Jāmiʿ 2:123.1", "Jāmiʿ 2:124.1"], note: "دخل رجل على جمل فأناخه في المسجد ثم عقله ثم قال لهم: أيكم محمد؟ ... هذا الرجل الأبيض المتكئ"}
      - {motif: envoy-of-two-plaits-converts-whole-tribe-in-a-day, refs: ["Jāmiʿ 2:124.1"], note: "وكان ضمام رجلا جلدا أشعر ذا غديرتين ... إن يصدق ذو العقيصتين يدخل الجنة ... بئست اللات والعزى. قالوا: مه يا ضمام، اتق البرص والجذام، اتق الجنون ... فوالله ما أمسى من ذلك اليوم وفي حاضره رجل ولا امرأة إلا مسلما"}
      - {motif: swore-by-his-fingers-not-to-come, refs: ["Jāmiʿ 2:126.1"], note: "ما أتيتك حتى حلفت عدد أصابعي هذه أن لا آتيك -أرانا عفان وطبق كفيه-"}
      - {motif: wife-fed-and-clothed-face-not-struck, refs: ["Jāmiʿ 2:126.1"], note: "ما حق زوجة أحدنا عليه؟ قال: تطعمها إذا طعمت، وتكسوها إذا اكتسيت، ولا تضرب الوجه، ولا تقبح، ولا تهجر إلا في البيت"}
      - {motif: gathered-toward-syria-mouths-gagged-thigh-speaks-first, refs: ["Jāmiʿ 2:126.1"], note: "تحشرون ههنا -وأومأ بيده إلى نحو الشام- مشاة وركبانا وعلى وجوهكم، تعرضون على الله وعلى أفواهكم الفدام، وأول ما يعرب عن أحدكم فخذه"}
      - {motif: withheld-surplus-becomes-serpent-biting-the-miser, refs: ["Jāmiʿ 2:126.1"], note: "ما من مولى يأتي مولى له فيسأله من فضل عنده فيمنعه إلا جعله الله عليه شجاعا ينهشه قبل القضاء"}
  - id: hadith-2-built-on-five
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Islam built on five; faith of sixty- or seventy-odd branches, modesty one of them"
    read: ["Jāmiʿ 2:126.2-127.1"]
    tags:
      - {motif: islam-built-on-five, refs: ["Jāmiʿ 2:126.2"], note: "بني الإسلام على خمس: شهادة أن لا إله إلا الله، وأن محمدا رسول الله وإقام الصلاة، وإيتاء الزكاة، والحج، وصوم رمضان (told to a man urging Ibn Umar to go raiding)"}
      - {motif: faith-sixty-or-seventy-odd-branches, refs: ["Jāmiʿ 2:127.1"], note: "الإيمان بضع وستون شعبة، والحياء شعبة من الإيمان (Muslim: بضع وسبعون؛ highest saying la ilaha illa allah, lowest removing harm from the road)"}
  - id: hadith-2-perfection-of-faith
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Faith completed by loving, hating, giving and withholding for God; the most perfect in faith are the best in character"
    read: ["Jāmiʿ 2:128.1-129.1"]
    tags:
      - {motif: love-hate-give-withhold-for-god-completes-faith, refs: ["Jāmiʿ 2:128.1", "Jāmiʿ 2:128.2"], note: "من أحب لله، وأبغض لله، وأعطى لله، ومنع لله فقد استكمل الإيمان (Mu'adh b. Anas adds: وأنكح لله)"}
      - {motif: most-perfect-faith-best-character-best-to-wives, refs: ["Jāmiʿ 2:128.3", "Jāmiʿ 2:129.1"], note: "أكمل المؤمنين إيمانا أحسنهم خلقا، وخياركم خياركم لنسائهم خلقا ... وإن حسن الخلق ليبلغ درجة الصوم والصلاة"}
  - id: hadith-2-faith-leaves-the-sinner
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "No adulterer, thief or drinker is a believer while he does it; faith hovers above him like a canopy; no faith without trust"
    read: ["Jāmiʿ 2:130.1-133.1"]
    tags:
      - {motif: no-adulterer-is-believer-while-he-commits-it, refs: ["Jāmiʿ 2:130.1", "Jāmiʿ 2:131.1", "Jāmiʿ 2:131.2", "Jāmiʿ 2:131.3"], note: "لا يزني الزاني حين يزني وهو مؤمن، ولا يشرب الخمر حين يشربها وهو مؤمن، ولا يسرق السارق حين يسرق وهو مؤمن (Ibn Abbas adds: ولا يقتل وهو مؤمن)"}
      - {motif: plunder-of-renown-while-eyes-are-raised, refs: ["Jāmiʿ 2:131.3"], note: "ولا ينتهب نهبة ذات شرف -أو سرف- وهو مؤمن"}
      - {motif: faith-withdrawn-like-unlaced-fingers, refs: ["Jāmiʿ 2:131.1"], note: "كيف ينزع الإيمان منه؟ قال: هكذا -وشبك بين أصابعه، ثم أخرجها-، فإن تاب عاد إليه - وشبك بين أصابعه"}
      - {motif: faith-hovers-over-adulterer-like-canopy, refs: ["Jāmiʿ 2:132.1"], note: "إذا زنى الرجل خرج منه الإيمان كان عليه كالظلة، فإذا انقلع رجع إليه الإيمان"}
      - {motif: no-faith-without-trust-no-religion-without-covenant, refs: ["Jāmiʿ 2:133.1"], note: "ما خطبنا نبي الله ﷺ إلا قال فيه: لا إيمان لمن لا أمانة له، ولا دين لمن لا عهد له"}
  - id: hadith-2-deficiency-of-religion
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Women told they are deficient in intellect and religion: two women's witness for one man, menstruation without prayer or fast; Zaynab's jewellery"
    read: ["Jāmiʿ 2:134.1-136.1"]
    tags:
      - {motif: women-most-of-fire-for-ingratitude-to-husband, refs: ["Jāmiʿ 2:134.1", "Jāmiʿ 2:134.2", "Jāmiʿ 2:135.1", "Jāmiʿ 2:136.1"], note: "فإني أريتكن أكثر أهل النار ... تكثرن اللعن، وتكفرن العشير"}
      - {motif: women-deficient-in-intellect-and-religion, refs: ["Jāmiʿ 2:134.1", "Jāmiʿ 2:134.2", "Jāmiʿ 2:134.3", "Jāmiʿ 2:135.1", "Jāmiʿ 2:136.1"], note: "ما رأيت من ناقصات عقل ودين أذهب للب الرجل الحازم من إحداكن"}
      - {motif: two-womens-witness-equals-one-mans, refs: ["Jāmiʿ 2:134.1", "Jāmiʿ 2:134.2", "Jāmiʿ 2:135.1"], note: "أليس شهادة المرأة مثل نصف شهادة الرجل ... فذلك من نقصان عقلها ... شهادة امرأتين تعدل شهادة رجل"}
      - {motif: menstruant-neither-prays-nor-fasts-deficiency-of-religion, refs: ["Jāmiʿ 2:134.1", "Jāmiʿ 2:134.2", "Jāmiʿ 2:135.1"], note: "أليس إذا حاضت لم تصل ولم تصم؟ ... فذلك من نقصان دينها ... وتمكث الليالي ما تصلي، وتفطر في رمضان"}
      - {motif: wife-gives-jewellery-as-alms-to-husband-and-children, refs: ["Jāmiʿ 2:135.1"], note: "وأخذت حليا لها ... فقال ابن مسعود: ... هلم تصدقي به علي وعلى ولدي ... فقال: أي الزيانب هي؟ ... تصدقي به عليه وعلى بنيه فإنهم له موضع"}
      - {motif: women-told-give-alms-even-from-jewellery, refs: ["Jāmiʿ 2:136.1"], note: "تصدقن يا معشر النساء، ولو من حليكن، فإنكن أكثر أهل النار"}
  - id: hadith-2-increase-of-faith
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Faith increases and decreases: those with a dinar, half a dinar, an atom of good brought out; the handful of those who never did good; the river of life"
    read: ["Jāmiʿ 2:137.1-139.2"]
    quran: ["33:22", "74:31", "9:124", "3:173", "48:4", "4:40"]
    tags:
      - {motif: believers-plead-for-brothers-who-prayed-with-them, refs: ["Jāmiʿ 2:137.1"], note: "ما منكم من أحد بأشد مناشدة لله في استقصاء الحق من المؤمنين لله يوم القيامة لإخوانهم الذين في النار، يقولون: ربنا كانوا يصومون معنا، ويصلون ويحجون"}
      - {motif: faces-forbidden-to-the-fire, refs: ["Jāmiʿ 2:137.1"], note: "فيقال لهم: أخرجوا من عرفتم، فتحرم صورهم على النار"}
      - {motif: brought-out-by-dinar-half-dinar-atom-of-good, refs: ["Jāmiʿ 2:137.1", "Jāmiʿ 2:138.2"], note: "فمن وجدتم في قلبه مثقال دينار من خير فأخرجوه ... مثقال نصف دينار ... مثقال ذرة ... (Anas: وزن شعيرة ... وزن برة ... وزن ذرة)"}
      - {motif: most-merciful-scoops-handful-who-never-did-good, refs: ["Jāmiʿ 2:137.1"], note: "شفعت الملائكة، وشفع النبيون، وشفع المؤمنون، ولم يبق إلا أرحم الراحمين فيقبض قبضة من النار فيخرج منها قوما لم يعملوا خيرا قط، قد عادوا حمما"}
      - {motif: burnt-thrown-in-river-of-life-sprout-like-seed, refs: ["Jāmiʿ 2:137.1", "Jāmiʿ 2:138.1", "Jāmiʿ 2:139.1"], note: "فيلقيهم في نهر في أفواه الجنة يقال له: نهر الحياة فيخرجون كما تخرج الحبة في حميل السيل ... ألم تر أنها تخرج صفراء ملتوية"}
      - {motif: mustard-seed-of-faith-or-of-pride, refs: ["Jāmiʿ 2:138.1", "Jāmiʿ 2:138.3", "Jāmiʿ 2:139.1"], note: "لا يدخل النار أحد في قلبه مثقال حبة خردل من إيمان. ولا يدخل الجنة أحد في قلبه مثقال حبة خردل من كبرياء"}
      - {motif: freed-of-god-written-on-necks-called-jahannamiyyun, refs: ["Jāmiʿ 2:139.1"], note: "فتسقط محاشهم على حافة النهر ويخرجون بيضا مثل الثعارير ... فيكتب في رقابهم: عتقاء الله، ثم يدخلون الجنة فيسمون فيها الجهنميين"}
      - {motif: god-brings-out-by-his-own-knowledge-and-mercy, refs: ["Jāmiʿ 2:139.1"], note: "ثم يقول الله ﷿: أنا الآن أخرج بعلمي ورحمتي. قال: فيخرج أضعاف ما أخرجوا وأضعافه"}
      - {motif: faith-learned-before-quran-then-increased, refs: ["Jāmiʿ 2:139.2"], note: "كنا مع النبي ﷺ ونحن فتيان حزاورة، فتعلمنا الإيمان قبل أن نتعلم القرآن، ثم تعلمنا القرآن، فازددنا به إيمانا"}
  - id: hadith-2-deeds-that-bring-to-paradise
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Deeds that bring a man to paradise: the man at the camel's halter, the bedouin who adds nothing, the deputation of Abd al-Qays, Mu'adh on the road"
    read: ["Jāmiʿ 2:139.3-144.1"]
    quran: ["32:16-17"]
    tags:
      - {motif: grabs-camels-halter-to-ask-the-way-to-paradise, refs: ["Jāmiʿ 2:139.3"], note: "أرب ما له، تعبد الله ولا تشرك به شيئا، وتقيم الصلاة، وتؤتي الزكاة، وتصل الرحم (Muslim's wording: فأخذ بخطام ناقته ... دع الناقة)"}
      - {motif: neither-add-nor-subtract-gains-paradise, refs: ["Jāmiʿ 2:140.1", "Jāmiʿ 2:143.1"], note: "والذي نفسي بيده! لا أزيد على هذا. فلما ولى قال النبي ﷺ: من سره أن ينظر إلى رجل من أهل الجنة فلينظر إلى هذا"}
      - {motif: four-commands-four-prohibitions-fifth-of-spoils, refs: ["Jāmiʿ 2:140.2", "Jāmiʿ 2:141.1"], note: "فأمرهم بأربع، ونهاهم عن أربع ... وأن تعطوا من المغنم الخمس ... احفظوهن وأخبروا بهن من وراءكم"}
      - {motif: four-forbidden-vessels-for-nabidh, refs: ["Jāmiʿ 2:140.2", "Jāmiʿ 2:141.1"], note: "عن الحنتم، والدباء والنقير، والمزفت ... النقير؟ قال: بلى جذع تنقرونه فتقذفون فيه من القطيعاء ... في أسقية الأدم التي يلاث على أفواهها"}
      - {motif: drunk-man-strikes-cousin-with-sword, refs: ["Jāmiʿ 2:141.1"], note: "حتى إن أحدكم -أو إن أحدهم- ليضرب ابن عمه بالسيف. قال: وفي القوم رجل أصابته جراحة كذلك. قال: وكنت أخبأها حياء من رسول الله ﷺ"}
      - {motif: leather-skins-even-if-rats-eat-them, refs: ["Jāmiʿ 2:141.1"], note: "إن أرضنا كثيرة الجرذان، ولا تبقى بها أسقية الأدم. فقال: وإن أكلتها الجرذان، وإن أكلتها الجرذان، وإن أكلتها الجرذان"}
      - {motif: forbearance-and-deliberation-loved-by-god, refs: ["Jāmiʿ 2:140.2", "Jāmiʿ 2:141.1"], note: "قال لأشج عبد القيس: إن فيك لخصلتين يحبهما الله الحلم والأناة"}
      - {motif: welcome-without-shame-or-regret, refs: ["Jāmiʿ 2:140.2"], note: "مرحبا بالقوم -أو بالوفد- غير خزايا ولا ندامى ... إنا لا نستطيع أن نأتيك إلا في الشهر الحرام، وبيننا وبينك هذا الحي من كفار مضر"}
      - {motif: alms-quench-sin-as-water-quenches-fire, refs: ["Jāmiʿ 2:144.1"], note: "الصوم جنة، والصدقة تطفئ الخطيئة كما يطفئ الماء النار، وصلاة الرجل من جوف الليل، ثم تلا: ﴿تتجافى جنوبهم عن المضاجع﴾"}
      - {motif: head-islam-pillar-prayer-hump-jihad, refs: ["Jāmiʿ 2:144.1"], note: "رأس الأمر الإسلام، وعموده الصلاة، وذروة سنامه الجهاد"}
      - {motif: thrown-on-faces-for-harvest-of-tongues, refs: ["Jāmiʿ 2:144.1"], note: "فأخذه بلسانه قال: كف عليك هذا ... ثكلتك أمك يا معاذ! وهل يكب الناس في النار على وجوههم -أو على مناخرهم- إلا حصائد ألسنتهم؟"}
  - id: hadith-2-spread-the-greeting
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Spread the greeting, feed others, pray while people sleep; Ibn Salam knows the face is not a liar's; the renaming of Abu l-Hakam and Abd al-Hajar"
    read: ["Jāmiʿ 2:144.2-146.1"]
    tags:
      - {motif: not-believe-until-love-spread-greeting, refs: ["Jāmiʿ 2:144.2"], note: "لا تدخلون الجنة حتى تؤمنوا، ولا تؤمنوا حتى تحابوا. أولا أدلكم على شيء إذا فعلتموه تحاببتم؟ أفشوا السلام بينكم"}
      - {motif: ask-me-of-everything-all-from-water, refs: ["Jāmiʿ 2:145.1"], note: "إني إذا رأيتك طابت نفسي، وقرت عيني، فأنبئني عن كل شيء، فقال: كل شيء خلق من ماء"}
      - {motif: greeting-feeding-kinship-night-prayer-enter-paradise, refs: ["Jāmiʿ 2:145.1", "Jāmiʿ 2:145.2", "Jāmiʿ 2:145.3"], note: "أفش السلام، وأطعم الطعام، وصل الأرحام، وقم بالليل والناس نيام، ثم ادخل الجنة بسلام"}
      - {motif: face-not-the-face-of-a-liar, refs: ["Jāmiʿ 2:145.3"], note: "فلما استثبت وجه رسول الله ﷺ عرفت أن وجهه ليس بوجه كذاب، وكان أول شيء تكلم به ... أفشوا السلام"}
      - {motif: abu-l-hakam-renamed-abu-shurayh, refs: ["Jāmiʿ 2:146.1"], note: "إن الله هو الحكم، وإليه الحكم، فلم تكنيت بأبي الحكم؟ ... فمن أكبرهم؟ قلت: شريح. قال: فأنت أبو شريح"}
      - {motif: abd-al-hajar-renamed-abd-allah, refs: ["Jāmiʿ 2:146.1"], note: "وسمع النبي ﷺ قوما يسمون رجلا منهم: عبد الحجر، فقال ... لا، أنت عبد الله"}
      - {motif: good-speech-and-giving-food-oblige-paradise, refs: ["Jāmiʿ 2:146.1"], note: "أخبرني بأي شيء يوجب لي الجنة؟ قال: عليك بحسن الكلام، وبذل الطعام"}
  - id: hadith-2-muslim-not-mumin
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "'Or a Muslim': Sa'd vouches for a man's faith; the gift to the weaker lest God throw him in the fire"
    read: ["Jāmiʿ 2:146.2"]
    quran: ["49:14", "3:19"]
    tags:
      - {motif: or-a-muslim-not-a-believer, refs: ["Jāmiʿ 2:146.2"], note: "فوالله إني لأراه مؤمنا. فقال: أو مسلما (three times)"}
      - {motif: gift-to-weaker-lest-he-fall-into-fire, refs: ["Jāmiʿ 2:146.2"], note: "يا سعد، إني لأعطي الرجل وغيره أحب إلي منه، خشية أن يكبه الله في النار"}
  - id: hadith-2-who-dies-on-unity
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Who dies on God's unity enters paradise: Jesus God's word and spirit; Mu'adh behind the prophet on the donkey; 'do not tell them lest they rely on it'"
    read: ["Jāmiʿ 2:148.1-150.1"]
    tags:
      - {motif: confession-of-unity-opens-eight-gates, refs: ["Jāmiʿ 2:148.1"], note: "وأن عيسى عبد الله ورسوله، وكلمته ألقاها إلى مريم وروح منه، والجنة حق، والنار حق، أدخله الله الجنة على ما كان من العمل (Muslim adds: من أي أبواب الجنة الثمانية شاء)"}
      - {motif: dying-companion-tells-the-one-withheld-hadith, refs: ["Jāmiʿ 2:148.1", "Jāmiʿ 2:149.2"], note: "إلا حديثا واحدا. وسوف أحدثكموه اليوم، وقد أحيط بنفسي ... فأخبر بها معاذ عند موته تأثما"}
      - {motif: called-three-times-labbayk-then-taught, refs: ["Jāmiʿ 2:148.2", "Jāmiʿ 2:149.2"], note: "يا معاذ قلت: لبيك رسول الله وسعديك. ثم سار ساعة ثم قال: يا معاذ ... (three times)"}
      - {motif: right-of-god-on-servants-and-of-servants-on-god, refs: ["Jāmiʿ 2:148.2", "Jāmiʿ 2:149.1"], note: "حق الله على عباده أن يعبدوه ولا يشركوا به شيئا ... حق العباد على الله أن لا يعذبهم"}
      - {motif: riding-pillion-on-donkey-named-ufayr, refs: ["Jāmiʿ 2:149.1"], note: "كنت ردف النبي ﷺ على حمار يقال له: عفير"}
      - {motif: do-not-tell-lest-they-rely-on-it, refs: ["Jāmiʿ 2:149.1", "Jāmiʿ 2:149.2"], note: "أفلا أبشر به الناس؟ قال: لا تبشرهم فيتكلوا"}
      - {motif: dies-on-unity-with-certain-heart-forgiven, refs: ["Jāmiʿ 2:150.1"], note: "ما على الأرض نفس تموت لا تشرك بالله شيئا تشهد أني رسول الله ﷺ يرجع ذاكم إلى قلب موقن إلا غفر لها ... فعنفني القوم"}
  - id: hadith-2-brought-out-of-the-fire
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "The Jahannamiyyun; the four brought out; Itban's mosque and Malik b. al-Dukhshum; the fire does not eat the marks of prostration"
    read: ["Jāmiʿ 2:150.2-151.1"]
    tags:
      - {motif: freed-of-god-written-on-necks-called-jahannamiyyun, refs: ["Jāmiʿ 2:150.2"], note: "يخرج قوم من النار بعد ما مسهم منها سفع فيدخلون الجنة، فيسميهم أهل الجنة الجهنميين"}
      - {motif: four-brought-out-one-asks-not-to-be-returned, refs: ["Jāmiʿ 2:150.3"], note: "يخرج من النار أربعة ... أي رب إذا أخرجتني منها فلا تعدني فيها"}
      - {motif: blind-man-asks-prophet-to-pray-in-his-house, refs: ["Jāmiʿ 2:150.4"], note: "بعثت إلى رسول الله ﷺ أني أحب أن تأتيني فتصلي في منزلي فأتخذه مصلى (variant: أنه عمي ... فخط لي مسجدا)"}
      - {motif: fire-forbidden-to-who-says-it-seeking-gods-face, refs: ["Jāmiʿ 2:150.4"], note: "أسندوا عظم ذلك وكبره إلى مالك بن دخشم ... إنه يقول ذلك وما هو في قلبه! قال: لا يشهد أحد أن لا إله إلا الله وأني رسول الله فيدخل النار أو تطعمه"}
      - {motif: fire-does-not-eat-marks-of-prostration, refs: ["Jāmiʿ 2:151.1"], note: "فيعرفونهم بعلامة آثار السجود، وحرم الله على النار أن تأكل من ابن آدم أثر السجود ... فيصب عليهم ماء يقال له: ماء الحياة"}
      - {motif: burnt-thrown-in-river-of-life-sprout-like-seed, refs: ["Jāmiʿ 2:151.1"], note: "فينبتون نبات الحبة في حميل السيل"}
  - id: hadith-2-glad-tidings-withheld
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Abu Hurayra sent with the prophet's sandals is struck down by Umar; the blessed provisions at the raid; the last man out of the fire"
    read: ["Jāmiʿ 2:152.1-154.1"]
    tags:
      - {motif: squeezes-into-garden-like-a-fox-through-the-stream, refs: ["Jāmiʿ 2:152.1"], note: "فإذا ربيع يدخل في جوف حائط من بئر خارجة (والربيع: الجدول) فاحتفزت كما يحتفز الثعلب"}
      - {motif: sandals-given-as-token-of-the-message, refs: ["Jāmiʿ 2:152.1"], note: "وأعطاني نعليه قال: اذهب بنعلي هاتين، فمن لقيت من وراء هذا الحائط يشهد أن لا إله إلا الله مستيقنا بها قلبه فبشره بالجنة"}
      - {motif: umar-turns-back-bearer-of-good-news, refs: ["Jāmiʿ 2:152.1"], note: "فضرب عمر بيده بين ثديي فخررت لإستي فقال: ارجع ... فلا تفعل فإني أخشى أن يتكل الناس عليها، فخلهم يعملون. قال رسول الله ﷺ: فخلهم"}
      - {motif: leftover-provisions-blessed-fill-every-vessel, refs: ["Jāmiʿ 2:153.1"], note: "فدعا بنطع فبسطه ... فجعل الرجل يجيء بكف ذرة ... ويجيء الآخر بكسرة ... حتى ما تركوا في العسكر وعاء إلا ملأوه ... وذو النواة بنواه ... كانوا يمصونه ويشربون عليه الماء"}
      - {motif: two-testimonies-without-doubt-not-barred-from-paradise, refs: ["Jāmiʿ 2:153.1"], note: "أشهد أن لا إله إلا الله وأني رسول الله لا يلقى الله بهما عبد غير شاك فيهما إلا دخل الجنة"}
      - {motif: last-out-crawling-told-ten-worlds-asks-are-you-mocking, refs: ["Jāmiʿ 2:153.2"], note: "رجل يخرج من النار كبوا ... فيخيل إليه أنها ملأى ... فإن لك مثل الدنيا وعشرة أمثالها ... فيقول: أتسخر مني -أو تضحك مني- وأنت الملك! فلقد رأيت رسول الله ﷺ ضحك حتى بدت نواجذه"}
      - {motif: two-necessities-dying-with-or-without-shirk, refs: ["Jāmiʿ 2:154.1"], note: "من مات يشرك بالله شيئا دخل النار. وقلت أنا: من مات لا يشرك بالله شيئا دخل الجنة (the threat marfu', the promise Ibn Mas'ud's own inference)"}
  - id: hadith-2-even-if-he-steals-and-fornicates
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Gabriel in the lava field: whoever dies associating nothing enters paradise, even if he steals and fornicates, despite Abu Dharr's nose"
    read: ["Jāmiʿ 2:154.2-156.2"]
    tags:
      - {motif: the-many-are-the-few-but-who-gives-this-way, refs: ["Jāmiʿ 2:154.2", "Jāmiʿ 2:155.1"], note: "إن المكثرين هم المقلون يوم القيامة، إلا من أعطاه الله خيرا، فنفح فيه يمينه وشماله ... ما أحب أن أحدا لي ذهبا يأتي علي ليلة أو ثلاث عندي منه دينار إلا أرصده لدين"}
      - {motif: told-sit-here-voice-heard-in-the-lava-field, refs: ["Jāmiʿ 2:154.2", "Jāmiʿ 2:155.1"], note: "فأجلسني في قاع حوله حجارة ... فانطلق في الحرة حتى لا أراه ... ثم إني سمعته وهو مقبل وهو يقول: وإن سرق وإن زنى ... ذلك جبريل ﵇ عرض لي في جانب الحرة"}
      - {motif: even-if-he-steals-and-fornicates, refs: ["Jāmiʿ 2:154.2", "Jāmiʿ 2:155.1", "Jāmiʿ 2:155.2"], note: "بشر أمتك أنه من مات لا يشرك بالله شيئا دخل الجنة. قلت: يا جبريل وإن سرق وإن زنى؟ قال: نعم ... وإن شرب الخمر"}
      - {motif: dies-knowing-no-god-but-god-enters-paradise, refs: ["Jāmiʿ 2:156.1"], note: "من مات وهو يعلم أنه لا إله إلا الله دخل الجنة"}
      - {motif: word-of-piety-is-shahada, refs: ["Jāmiʿ 2:156.2"], note: "هي كلمة الإخلاص التي ألزمها الله ﵎ محمدا وأصحابه، وهي كلمة التقوى التي ألاص عليها نبي الله ﷺ عمه أبا طالب عند الموت"}
  - id: hadith-2-out-by-intercession
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Brought out by intercession like tharir; faces spared; Jabir turns Yazid al-Faqir from the Kharijite view"
    read: ["Jāmiʿ 2:157.1-158.2"]
    quran: ["3:192", "32:20"]
    tags:
      - {motif: brought-out-by-intercession-like-tharir, refs: ["Jāmiʿ 2:157.1", "Jāmiʿ 2:157.2"], note: "يخرج من النار بالشفاعة كأنهم الثعارير ... إن الله يخرج ناسا من النار فيدخلهم الجنة"}
      - {motif: burnt-all-but-the-circles-of-their-faces, refs: ["Jāmiʿ 2:157.3"], note: "إن قوما يخرجون من النار يحترقون فيها إلا دارات وجوههم حتى يدخلون الجنة"}
      - {motif: kharijite-band-turned-back-by-jabirs-hadith, refs: ["Jāmiʿ 2:158.1"], note: "كنت قد شغفني رأي من رأي الخوارج ... فإذا جابر بن عبد الله يحدث القوم ... فهل سمعت بمقام محمد ﵇؟ ... فرجعنا، فلا والله ما خرج منا غير رجل واحد"}
      - {motif: out-like-sesame-stalks-washed-white-as-paper, refs: ["Jāmiʿ 2:158.1"], note: "فيخرجون كأنهم عيدان السماسم ... فيدخلون نهرا من أنهار الجنة، فيغتسلون فيه، فيخرجون كأنهم القراطيس"}
      - {motif: two-necessities-dying-with-or-without-shirk, refs: ["Jāmiʿ 2:158.2"], note: "ما الموجبتان؟ قال: من مات لا يشرك بالله شيئا دخل الجنة، ومن مات يشرك بالله شيئا دخل النار"}
  - id: hadith-2-card-and-scrolls
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Jabir sent to proclaim and pushed back by Umar; the card of the testimony outweighs ninety-nine scrolls"
    read: ["Jāmiʿ 2:159.1-159.2"]
    tags:
      - {motif: umar-turns-back-bearer-of-good-news, refs: ["Jāmiʿ 2:159.1"], note: "ناد في الناس: من قال: لا إله إلا الله دخل الجنة ... فلقيه عمر ... فلهزني لهزة في صدري ... إن الناس قد طمعوا وخشوا، فقال النبي ﷺ: اقعد"}
      - {motif: card-of-shahada-outweighs-ninety-nine-scrolls, refs: ["Jāmiʿ 2:159.2"], note: "فينشر عليه تسعة وتسعين سجلا كل سجل مثل مد البصر ... فتخرج بطاقة فيها: أشهد أن لا إله إلا الله ... فطاشت السجلات وثقلت البطاقة، فلا يثقل مع اسم الله شيء"}
  - id: hadith-2-trust-lifted
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Trust came down into the root of men's hearts and is taken in sleep, leaving a blister"
    read: ["Jāmiʿ 2:160.1"]
    tags:
      - {motif: trust-taken-in-sleep-leaving-blister, refs: ["Jāmiʿ 2:160.1"], note: "ينام الرجل النومة فتقبض الأمانة من قلبه فيظل أثرها مثل أثر الوكت ... مثل المجل كجمر دحرجته على رجلك فنفط فتراه منتبرا"}
      - {motif: trust-descended-into-root-of-hearts, refs: ["Jāmiʿ 2:160.1"], note: "أن الأمانة نزلت في جذر قلوب الرجال، ثم علموا من القرآن، ثم علموا من السنة"}
      - {motif: once-traded-with-anyone-now-with-few, refs: ["Jāmiʿ 2:160.1"], note: "لئن كان مسلما رده الإسلام وإن كان نصرانيا رده علي ساعيه، فأما اليوم فما كنت أبايع إلا فلانا وفلانا"}
  - id: hadith-2-only-believers-enter
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "The brave fighter of Khaybar kills himself; the cloak stolen from the spoils; only believers enter paradise, proclaimed by Bilal, Umar and Bishr"
    read: ["Jāmiʿ 2:161.1-162.1"]
    tags:
      - {motif: valiant-fighter-of-the-fire-kills-himself, refs: ["Jāmiʿ 2:161.1"], note: "هذا من أهل النار. فلما حضر القتال قاتل الرجل قتالا شديدا ... فلما كان من الليل لم يصبر على الجراح فقتل نفسه ... الله أكبر أشهد أني عبد الله ورسوله"}
      - {motif: god-supports-religion-by-the-wicked-man, refs: ["Jāmiʿ 2:161.1"], note: "وإن الله ليؤيد هذا الدين بالرجل الفاجر"}
      - {motif: proclaim-only-believers-enter-paradise, refs: ["Jāmiʿ 2:161.1", "Jāmiʿ 2:161.2", "Jāmiʿ 2:162.1"], note: "ثم أمر بلالا فنادى بالناس: إنه لا يدخل الجنة إلا نفس مسلمة ... يا ابن الخطاب، اذهب فناد في الناس: أنه لا يدخل الجنة إلا المؤمنون"}
      - {motif: stolen-cloak-burns-in-fire, refs: ["Jāmiʿ 2:161.2"], note: "فلان شهيد ... كلا إني رأيته في النار في بردة غلها أو عباءة"}
      - {motif: tashriq-days-of-eating-and-drinking, refs: ["Jāmiʿ 2:162.1"], note: "أمره أن ينادي أيام التشريق: أنه لا يدخل الجنة إلا مؤمن، وهي أيام أكل وشرب"}
  - id: hadith-2-father-of-abraham
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Abraham pleads for Azar on the day of resurrection; paradise forbidden to unbelievers; the father turned into a hyena"
    read: ["Jāmiʿ 2:162.2-163.1"]
    tags:
      - {motif: azar-turned-into-a-hyena, refs: ["Jāmiʿ 2:162.2"], note: "وعلى وجه آزر قترة وغبرة ... فأي خزي أخزى من أبي الأبعد؟ فيقول الله تعالى: إني حرمت الجنة على الكافرين ... فإذا هو بذيخ ملتطخ، فيؤخذ بقوائمه فيلقى في النار"}
      - {motif: father-says-today-i-will-not-disobey, refs: ["Jāmiʿ 2:162.2"], note: "ألم أقل لك: لا تعصني؟ فيقول أبوه: فاليوم لا أعصيك"}
      - {motif: son-leads-father-by-hand-father-changed-and-left, refs: ["Jāmiʿ 2:163.1"], note: "ليأخذن رجل بيد أبيه يوم القيامة يريد أن يدخله الجنة ... فيتحول في صورة قبيحة، وريح منتنة، فيتركه. قال أبو سعيد: كان أصحاب محمد ﷺ يرون أنه إبراهيم"}
    hints:
      - "On the day of judgement no father can intercede for his son nor son for father (4 Ezra 7:102-105); here Abraham pleads and is answered by the father's change into a filth-smeared hyena (dhikh)."
  - id: hadith-2-pride-mercy-neighbour
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "An atom of pride; none saved by his deeds; the neighbour not safe from one's harms"
    read: ["Jāmiʿ 2:163.2-164.1"]
    tags:
      - {motif: atom-of-pride-bars-paradise-god-beautiful, refs: ["Jāmiʿ 2:163.2"], note: "لا يدخل الجنة من كان في قلبه مثقال ذرة من كبر ... إن الله جميل يحب الجمال؛ الكبر بطر الحق، وغمط الناس"}
      - {motif: none-enters-paradise-by-deeds-not-even-prophet, refs: ["Jāmiʿ 2:163.3"], note: "لن ينجي أحدا منكم عمله. قالوا: ولا أنت يا رسول الله؟ قال: ولا أنا إلا أن يتغمدني الله برحمة. سددوا وقاربوا ... القصد القصد تبلغوا"}
      - {motif: not-enter-whose-neighbour-unsafe-from-harms, refs: ["Jāmiʿ 2:164.1"], note: "لا يدخل الجنة من لا يأمن جاره بوائقه"}
  - id: hadith-2-sweetness-and-taste-of-faith
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Three things give the sweetness of faith; the taste of faith; the prophet dearer than father and son; you are with whom you love"
    read: ["Jāmiʿ 2:164.2-165.3"]
    tags:
      - {motif: three-give-sweetness-of-faith, refs: ["Jāmiʿ 2:164.2"], note: "ثلاث من كن فيه وجد حلاوة الإيمان: أن يكون الله ورسوله أحب إليه مما سواهما، وأن يحب المرء لا يحبه إلا الله، وأن يكره أن يعود إلى الكفر كما يكره أن يقذف في النار"}
      - {motif: taste-of-faith-content-with-god-islam-muhammad, refs: ["Jāmiʿ 2:164.3"], note: "ذاق طعم الإيمان من رضي بالله ربا، وبالإسلام دينا، وبمحمد رسولا"}
      - {motif: love-a-man-only-for-god-gives-taste-of-faith, refs: ["Jāmiʿ 2:164.4"], note: "من أحب أن يجد طعم الإيمان فليحب المرء لا يحبه إلا الله"}
      - {motif: prophet-dearer-than-father-child-and-all, refs: ["Jāmiʿ 2:165.1", "Jāmiʿ 2:165.2"], note: "لا يؤمن أحدكم حتى أكون أحب إليه من والده وولده والناس أجمعين"}
      - {motif: you-are-with-whom-you-love, refs: ["Jāmiʿ 2:165.3"], note: "متى الساعة؟ فقال له رسول الله ﷺ: ما أعددت لها قال: حب الله ورسوله. قال: أنت مع من أحببت"}
  - id: hadith-2-neighbour-guest-and-evil
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Love for your brother what you love for yourself; honour the guest: a day and night, three days' hospitality; change evil by hand, tongue, heart"
    read: ["Jāmiʿ 2:166.1-167.2"]
    tags:
      - {motif: love-for-brother-what-you-love-for-self, refs: ["Jāmiʿ 2:166.1"], note: "لا يؤمن أحدكم حتى يحب لأخيه ما يحب لنفسه (variant: لجاره أو لأخيه)"}
      - {motif: whoever-believes-honours-guest-and-neighbour-speaks-good-or-is-silent, refs: ["Jāmiʿ 2:166.2", "Jāmiʿ 2:166.3"], note: "من كان يؤمن بالله واليوم الآخر فلا يؤذ جاره ... فليكرم ضيفه ... فليقل خيرا أو ليصمت"}
      - {motif: guests-due-a-day-and-night-hospitality-three-days, refs: ["Jāmiʿ 2:166.3"], note: "فليكرم ضيفه جائزته قال: وما جائزته يا رسول الله؟ قال: يوم وليلة، والضيافة ثلاثة أيام، فما كان وراء ذلك فهو صدقة عليه"}
      - {motif: change-evil-by-hand-tongue-or-heart, refs: ["Jāmiʿ 2:167.1"], note: "من رأى منكم منكرا فليغيره بيده، فإن لم يستطع فبلسانه، فإن لم يستطع فبقلبه، وذلك أضعف الإيمان (told when Marwan put the feast sermon before the prayer)"}
      - {motif: prophets-disciples-then-successors-who-say-not-do, refs: ["Jāmiʿ 2:167.2"], note: "إلا كان له من أمته حواريون وأصحاب يأخذون بسنته ... ثم إنها تخلف من بعدهم خلوف، يقولون ما لا يفعلون، ويفعلون ما لا يؤمرون، فمن جاهدهم بيده فهو مؤمن ... وليس وراء ذلك من الإيمان حبة خردل"}
    hints:
      - "Love your fellow as yourself (Lev 19:18), with the negative form attributed to Hillel (b. Shabbat 31a), against 'none believes until he loves for his brother what he loves for himself'."
  - id: hadith-2-ansar-and-modesty
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Love of the Ansar a sign of faith; modesty is of faith; Imran angered by a 'book of wisdom'; love of Ali"
    read: ["Jāmiʿ 2:168.1-170.1"]
    tags:
      - {motif: love-of-ansar-sign-of-faith, refs: ["Jāmiʿ 2:168.1", "Jāmiʿ 2:168.2", "Jāmiʿ 2:168.3", "Jāmiʿ 2:168.4"], note: "آية الإيمان حب الأنصار، وآية النفاق بغض الأنصار ... لا يحبهم إلا مؤمن، ولا يبغضهم إلا منافق"}
      - {motif: leave-him-modesty-is-of-faith, refs: ["Jāmiʿ 2:168.5"], note: "مر على رجل وهو يعظ أخاه في الحياء، فقال ... دعه فإن الحياء من الإيمان"}
      - {motif: modesty-brings-only-good, refs: ["Jāmiʿ 2:169.1"], note: "الحياء لا يأتي إلا بخير"}
      - {motif: shyer-than-virgin-in-seclusion, refs: ["Jāmiʿ 2:169.2"], note: "كان النبي ﷺ أشد حياء من العذراء في خدرها، فإذا رأى شيئا يكرهه عرفناه في وجهه"}
      - {motif: modesty-in-paradise-obscenity-in-fire, refs: ["Jāmiʿ 2:169.3"], note: "الحياء من الإيمان، والإيمان في الجنة، والبذاء من الجفاء، والجفاء في النار"}
      - {motif: modesty-and-faith-paired-one-lifted-other-lifted, refs: ["Jāmiʿ 2:169.4"], note: "الحياء والإيمان قرنا جميعا، فإذا رفع أحدهما رفع الآخر"}
      - {motif: only-believer-loves-ali, refs: ["Jāmiʿ 2:170.1"], note: "والذي فلق الحبة وبرأ النسمة إنه لعهد النبي الأمي ﷺ إلي: أن لا يحبني إلا مؤمن، ولا يبغضني إلا منافق"}
  - id: hadith-2-loyalty-and-flight
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "The clan of Abu so-and-so are not my friends; sheep on the mountain peaks; the census of fifteen hundred"
    read: ["Jāmiʿ 2:170.2-171.2"]
    tags:
      - {motif: clan-of-abu-blank-not-my-friends, refs: ["Jāmiʿ 2:170.2"], note: "إن آل أبي -قال عمرو: في كتاب محمد بن جعفر بياض- ليسوا بأوليائي، إنما وليي الله وصالح المؤمنين"}
      - {motif: sheep-on-mountain-peaks-flight-from-strife, refs: ["Jāmiʿ 2:170.3", "Jāmiʿ 2:171.1"], note: "يوشك أن يكون خير مال المسلم غنم يتبع بها شعف الجبال، ومواقع القطر، يفر بدينه من الفتن"}
      - {motif: best-is-fighter-then-recluse-in-a-ravine, refs: ["Jāmiʿ 2:170.4", "Jāmiʿ 2:171.1"], note: "مؤمن يجاهد في سبيل الله بنفسه وماله ... ثم من؟ قال: مؤمن في شعب من الشعاب، يتقي الله، ويدع الناس من شره"}
      - {motif: rider-flies-to-every-alarm, refs: ["Jāmiʿ 2:171.1"], note: "رجل ممسك عنان فرسه في سبيل الله، يطير على متنه كلما سمع هيعة أو فزعة طار عليه يبتغي القتل والموت مظانه"}
      - {motif: census-of-those-who-professed-islam, refs: ["Jāmiʿ 2:171.2"], note: "اكتبوا لي من تلفظ بالإسلام من الناس، فكتبنا له ألفا وخمسمائة رجل ... حتى إن الرجل ليصلي وحده وهو خائف (Muslim: ما بين الستمائة إلى السبعمائة)"}
    hints:
      - "A count of the professing community ordered by the leader, given as 1,500 or as 600-700: compare the census of Israel (Num 1; 2 Sam 24, where the count itself brings a plague); here the count is followed by trial."
  - id: hadith-2-brothers-not-yet-come
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "At the graveyard: 'God willing we will join you'; brothers yet to come known by the white blaze of ablution; men driven from the basin"
    read: ["Jāmiʿ 2:172.1"]
    quran: ["48:27"]
    tags:
      - {motif: greeting-the-dead-god-willing-we-will-join-you, refs: ["Jāmiʿ 2:172.1"], note: "أتى المقبرة فقال: السلام عليكم دار قوم مؤمنين، وإنا إن شاء الله بكم لاحقون"}
      - {motif: brothers-yet-to-come-known-by-white-blaze-of-ablution, refs: ["Jāmiʿ 2:172.1"], note: "أنتم أصحابي، وإخواننا الذين لم يأتوا بعد ... لو أن رجلا له خيل غر محجلة بين ظهري خيل دهم بهم، ألا يعرف خيله؟ ... فإنهم يأتون غرا محجلين من الوضوء"}
      - {motif: men-driven-from-the-basin-like-stray-camels, refs: ["Jāmiʿ 2:172.1"], note: "وأنا فرطهم على الحوض. ألا ليذادن رجال عن حوضي كما يذاد البعير الضال ... فيقال: إنهم قد بدلوا بعدك. فأقول: سحقا سحقا"}
  - id: hadith-2-purity-steadfastness-ranks
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Purity is half of faith; 'say I believe in God, then be upright'; shirts of faith of different lengths; Ammar filled with faith"
    read: ["Jāmiʿ 2:173.1-173.4"]
    tags:
      - {motif: purity-half-of-faith-praise-fills-the-scale, refs: ["Jāmiʿ 2:173.1"], note: "الطهور شطر الإيمان، والحمد لله تملأ الميزان ... والصلاة نور، والصدقة برهان، والصبر ضياء، والقرآن حجة لك أو عليك، كل الناس يغدو فبائع نفسه فمعتقها أو موبقها"}
      - {motif: say-i-believe-then-be-upright, refs: ["Jāmiʿ 2:173.2"], note: "قل لي في الإسلام قولا لا أسأل عنه أحدا بعدك. قال: قل: آمنت بالله، فاستقم"}
      - {motif: dream-shirts-of-faith-umar-trails-his, refs: ["Jāmiʿ 2:173.3"], note: "رأيت الناس يعرضون علي، وعليهم قميص منها ما يبلغ الثدي ومنها ما دون ذلك، وعرض علي عمر ... وعليه قميص يجره ... فما أولت ذلك؟ قال: الدين"}
      - {motif: ammar-filled-with-faith-to-bone-ends, refs: ["Jāmiʿ 2:173.4"], note: "مرحبا بالطيب المطيب. سمعت رسول الله ﷺ يقول: ملئ عمار إيمانا إلى مشاشه"}
  - id: hadith-2-yemen-and-hijaz
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Faith is Yemeni; hardness among the camel-drovers where the devil's horns rise; faith in the Hijaz"
    read: ["Jāmiʿ 2:174.1-176.1"]
    tags:
      - {motif: faith-is-yemeni-wisdom-is-yemeni, refs: ["Jāmiʿ 2:174.1", "Jāmiʿ 2:174.2", "Jāmiʿ 2:175.1"], note: "الإيمان يمان ... والحكمة يمانية ... أتاكم أهل اليمن هم أرق أفئدة، وألين قلوبا"}
      - {motif: hardness-among-camel-drovers-where-devils-horns-rise, refs: ["Jāmiʿ 2:174.1"], note: "ألا إن القسوة وغلظ القلوب في الفدادين عند أصول أذناب الإبل حيث يطلع قرنا الشيطان في ربيعة ومضر"}
      - {motif: pride-with-camel-owners-calm-with-sheep-owners, refs: ["Jāmiʿ 2:174.2", "Jāmiʿ 2:175.1"], note: "الفخر والخيلاء في الفدادين أهل الوبر، والسكينة في أهل الغنم ... والسكينة والوقار في أهل الغنم"}
      - {motif: faith-in-hijaz-harshness-in-the-east, refs: ["Jāmiʿ 2:176.1"], note: "غلظ القلوب والجفاء في الشرق، والإيمان في أهل الحجاز"}
  - id: hadith-2-good-islam
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "When one's islam is good each good deed is tenfold to seven hundred; leaving what does not concern him; past good deeds credited"
    read: ["Jāmiʿ 2:176.2-177.1"]
    tags:
      - {motif: good-deed-tenfold-to-seven-hundred-bad-as-one, refs: ["Jāmiʿ 2:176.2", "Jāmiʿ 2:177.1"], note: "فكل حسنة يعملها تكتب له بعشر أمثالها إلى سبعمائة ضعف، وكل سيئة يعملها تكتب له بمثلها"}
      - {motif: leaving-what-does-not-concern-him, refs: ["Jāmiʿ 2:176.3"], note: "إن من حسن إسلام المرء تركه ما لا يعنيه"}
      - {motif: convert-credited-with-good-done-before-islam, refs: ["Jāmiʿ 2:177.1"], note: "إذا أسلم العبد فحسن إسلامه، كتب الله له كل حسنة كان أزلفها، ومحيت عنه كل سيئة كان أزلفها، ثم كان بعد ذلك القصاص"}
  - id: hadith-2-religion-is-sincere-counsel
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Pledged to prayer, alms and sincere counsel to every Muslim; religion is sincere counsel"
    read: ["Jāmiʿ 2:178.1-178.2"]
    tags:
      - {motif: pledge-of-sincere-counsel-to-every-muslim, refs: ["Jāmiʿ 2:178.1"], note: "بايعت رسول الله ﷺ على إقام الصلاة، وإيتاء الزكاة، والنصح لكل مسلم (variant: على السمع والطاعة -فلقنني: فيما استطعت-)"}
      - {motif: religion-is-sincere-counsel, refs: ["Jāmiʿ 2:178.2"], note: "الدين النصيحة قلنا: لمن؟ قال: لله، ولكتابه، ولرسوله، ولأئمة المسلمين وعامتهم"}
  - id: hadith-2-abu-talib-at-death
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Abu Talib at death refuses the testimony; the verses on forgiveness for polytheists and 'you do not guide whom you love'"
    read: ["Jāmiʿ 2:178.3-179.1"]
    quran: ["9:113", "28:56"]
    tags:
      - {motif: dying-uncle-chooses-religion-of-his-father, refs: ["Jāmiʿ 2:178.3"], note: "أي عم، قل: لا إله إلا الله أحاج لك بها عند الله فقال أبو جهل، وعبد الله بن أبي أمية: يا أبا طالب، أترغب عن ملة عبد المطلب؟"}
      - {motif: i-will-seek-forgiveness-until-forbidden, refs: ["Jāmiʿ 2:178.3"], note: "لأستغفرن لك ما لم أنه عنك فنزلت: ﴿ما كان للنبي والذين آمنوا أن يستغفروا للمشركين﴾"}
      - {motif: uncle-fears-quraysh-would-say-it-was-fear-of-death, refs: ["Jāmiʿ 2:179.1"], note: "قل: لا إله إلا الله، أشهد لك بها يوم القيامة فأبى (variant: لولا أن تعيرني قريش يقولون: إنما حمله على ذلك الجزع، لأقررت بها عينك)"}
  - id: hadith-2-heraclius-faith-mingles
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Heraclius: faith, once its delight mingles with hearts, is resented by none"
    read: ["Jāmiʿ 2:179.2"]
    tags:
      - {motif: faith-once-mingled-with-hearts-none-resent-it, refs: ["Jāmiʿ 2:179.2"], note: "هل يزيدون أم ينقصون؟ فزعمت أنهم يزيدون، وكذلك الإيمان حتى يتم ... هل يرتد أحد سخطة لدينه ... وكذلك الإيمان حين تخالط بشاشته القلوب لا يسخطه أحد"}
  - id: hadith-2-religion-is-ease
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Religion is ease: none overdoes it but it defeats him"
    read: ["Jāmiʿ 2:179.3"]
    tags:
      - {motif: religion-is-ease-none-overdoes-it-but-is-beaten, refs: ["Jāmiʿ 2:179.3"], note: "إن الدين يسر، ولن يشاد الدين أحد إلا غلبه، فسددوا، وقاربوا، وأبشروا، واستعينوا بالغدوة والروحة وشيء من الدلجة"}
  - id: hadith-2-burden-only-what-is-borne
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "On Q 2:284 the companions kneel: say 'we hear and obey', not as the people of the two books said; God answers each petition 'yes' / 'I have done it'"
    read: ["Jāmiʿ 2:180.1-181.1"]
    quran: ["2:284", "2:285", "2:286"]
    tags:
      - {motif: say-we-hear-and-obey-not-we-hear-and-disobey, refs: ["Jāmiʿ 2:180.1", "Jāmiʿ 2:181.1"], note: "أتريدون أن تقولوا كما قال أهل الكتابين من قبلكم: سمعنا وعصينا؟ بل قولوا: سمعنا وأطعنا غفرانك ربنا وإليك المصير ... فلما اقترأها القوم ذلت بها ألسنتهم"}
      - {motif: companions-kneel-at-the-unbearable-verse, refs: ["Jāmiʿ 2:180.1"], note: "فاشتد ذلك على أصحاب رسول الله ﷺ ... ثم بركوا على الركب، فقالوا: ... وقد أنزلت عليك هذه الآية ولا نطيقها"}
      - {motif: god-answers-each-petition-yes-i-have-done-it, refs: ["Jāmiʿ 2:180.1", "Jāmiʿ 2:181.1"], note: "﴿ربنا لا تؤاخذنا إن نسينا أو أخطأنا﴾ قال: نعم ... (Ibn Abbas: قال: قد فعلت)"}
      - {motif: verse-abrogated-by-the-next, refs: ["Jāmiʿ 2:180.1"], note: "فلما فعلوا ذلك نسخها الله تعالى، فأنزل الله ﷿: ﴿لا يكلف الله نفسا إلا وسعها﴾"}
    hints:
      - "'We hear and obey' set against the people of the two books' 'we hear and disobey': compare Deut 5:27 (ve-shama'nu ve-'asinu, 'we will hear and do') and Exod 24:7 ('we will do and hear')."
  - id: hadith-2-hope-and-fear
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Good opinion of God: 'this was not my hope'; I am as my servant thinks of me; two fears and two securities are not joined"
    read: ["Jāmiʿ 2:181.2-182.2"]
    tags:
      - {motif: four-brought-out-one-asks-not-to-be-returned, refs: ["Jāmiʿ 2:181.2", "Jāmiʿ 2:181.3"], note: "يخرج من النار أربعة ... إذ أخرجتني منها لا تعدني فيها"}
      - {motif: brought-out-then-ordered-back-this-was-not-my-hope, refs: ["Jāmiʿ 2:181.3"], note: "يخرج رجلان من النار، فيعرضان على الله، ثم يؤمر بهما إلى النار، فيلتفت أحدهما فيقول: يا رب، ما كان هذا رجائي! ... فيرحمه الله فيدخله الجنة"}
      - {motif: i-am-as-my-servant-thinks-good-or-bad, refs: ["Jāmiʿ 2:182.1"], note: "أنا عند ظن عبدي بي، إن ظن خيرا فله، وإن ظن شرا فله"}
      - {motif: two-fears-and-two-securities-not-joined, refs: ["Jāmiʿ 2:182.2"], note: "وعزتي لا أجمع على عبدي خوفين وأمنين، إذا خافني في الدنيا أمنته يوم القيامة، وإذا أمنني في الدنيا أخفته يوم القيامة"}
  - id: hadith-2-uthman-bin-mazun
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Umm al-Ala vouches that God honoured Uthman b. Maz'un: 'I do not know, though God's messenger, what will be done with me'"
    read: ["Jāmiʿ 2:182.3"]
    tags:
      - {motif: emigrants-allotted-to-hosts-by-lot, refs: ["Jāmiʿ 2:182.3"], note: "أنه اقتسم المهاجرون قرعة، فطار لنا عثمان بن مظعون، فأنزلناه في أبياتنا"}
      - {motif: what-makes-you-know-god-honoured-him, refs: ["Jāmiʿ 2:182.3"], note: "رحمة الله عليك أبا السائب، فشهادتي عليك، لقد أكرمك الله. فقال: وما يدريك أن الله أكرمه؟ ... والله ما أدري وأنا رسول الله ما يفعل بي. قالت: فوالله لا أزكي أحدا بعده أبدا"}
  - id: hadith-2-burned-and-scattered
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "A man orders his body burned, ground and scattered in wind and sea for fear of God, and is forgiven"
    read: ["Jāmiʿ 2:183.1-184.1"]
    tags:
      - {motif: sinner-orders-body-burned-ground-scattered-forgiven-for-fear, refs: ["Jāmiʿ 2:183.1", "Jāmiʿ 2:183.2", "Jāmiʿ 2:184.1"], note: "إذا مت فأحرقوني، ثم اسحقوني، ثم ذروني في يوم عاصف ... فجمعه الله ﷿ فقال: ما حملك؟ قال: مخافتك، فتلقاه برحمته"}
      - {motif: half-scattered-on-land-half-in-sea-each-gives-back, refs: ["Jāmiʿ 2:183.2", "Jāmiʿ 2:184.1"], note: "ثم اذروا نصفه في البر، ونصفه في البحر، فوالله لئن قدر الله عليه ليعذبنه ... فأمر الله البر فجمع ما فيه، وأمر البحر فجمع ما فيه ... فذروني في اليم"}
    hints:
      - "Ashes scattered on land and sea so that the body cannot be raised, and land and sea ordered to give it back: compare 1 Enoch 61:5 and Rev 20:13 ('the sea gave up the dead in it'), and the rabbinic tradition that the earth and the sea restore what was deposited in them (Pirqe de-Rabbi Eliezer 34)."
  - id: hadith-2-no-compulsion
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Ansari sons vowed to Judaism, 'no compulsion in religion'; 'submit, even if unwilling'"
    read: ["Jāmiʿ 2:184.2-185.1"]
    quran: ["2:256"]
    tags:
      - {motif: ansar-vowed-surviving-sons-to-judaism, refs: ["Jāmiʿ 2:184.2"], note: "كانت المرأة من الأنصار لا يكاد يعيش لها ولد، فتحلف: لئن عاش لها ولد لتهودنه. فلما أجليت بنو النضير إذا فيهم ناس من أبناء الأنصار"}
      - {motif: submit-even-if-unwilling, refs: ["Jāmiʿ 2:185.1"], note: "قال لرجل: أسلم. قال: إني أجدني كارها! قال: وإن كنت كارها"}
  - id: hadith-2-fighting-among-believers
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Killer and killed both in the fire; reviling a Muslim is sin, fighting him unbelief; do not turn unbelievers striking each other's necks"
    read: ["Jāmiʿ 2:185.2-186.3"]
    quran: ["49:9"]
    tags:
      - {motif: killer-and-killed-both-in-fire, refs: ["Jāmiʿ 2:185.2"], note: "إذا التقى المسلمان بسيفيهما فالقاتل والمقتول في النار ... إنه كان حريصا على قتل صاحبه (Abu Bakra turns back al-Ahnaf going to help Ali)"}
      - {motif: reviling-a-muslim-is-sin-fighting-him-unbelief, refs: ["Jāmiʿ 2:186.1"], note: "سباب المسلم فسوق، وقتاله كفر"}
      - {motif: do-not-revert-to-unbelief-striking-necks, refs: ["Jāmiʿ 2:186.2", "Jāmiʿ 2:186.3"], note: "استنصت الناس ... لا ترجعوا بعدي كفارا يضرب بعضكم رقاب بعض (Ibn Umar: ويلكم أو ويحكم)"}
  - id: hadith-2-rain-by-a-star
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "After rain at Hudaybiya some woke believers, some unbelievers saying 'rained on by such a star'; Q 56:75-82"
    read: ["Jāmiʿ 2:186.4-187.2"]
    quran: ["56:75-82"]
    tags:
      - {motif: rain-by-mercy-or-by-star, refs: ["Jāmiʿ 2:186.4", "Jāmiʿ 2:187.1", "Jāmiʿ 2:187.2"], note: "أصبح من عبادي مؤمن بي وكافر بي. فأما من قال: مطرنا بفضل الله ورحمته، فذلك مؤمن بي، كافر بالكوكب. وأما من قال: مطرنا بنوء كذا وكذا، فذلك كافر بي، مؤمن بالكوكب"}
    hints:
      - "Rain credited to a star's setting (naw') rather than to God: compare Jer 10:2 ('do not be dismayed at the signs of the heavens') and the rabbinic 'Israel is not under the stars' (b. Shabbat 156a)."
  - id: hadith-2-jahiliyya-practices
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Two things that are unbelief in people: attacking lineage and wailing; three jahiliyya practices that will not be left"
    read: ["Jāmiʿ 2:187.3-188.1"]
    tags:
      - {motif: attacking-lineage-and-wailing-are-unbelief, refs: ["Jāmiʿ 2:187.3"], note: "اثنتان في الناس هما بهم كفر: الطعن في النسب، والنياحة على الميت"}
      - {motif: three-jahiliyya-practices-never-left, refs: ["Jāmiʿ 2:188.1"], note: "ثلاث من عمل أهل الجاهلية لا يتركهن أهل الإسلام: النياحة، والاستسقاء بالأنواء، وكذا ... دعوى الجاهلية: يا آل فلان، يا آل فلان (Ibn Hibban: التعاير)"}
  - id: hadith-2-islam-demolishes-the-past
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Islam demolishes what was before it: the killers and fornicators who asked expiation; Amr b. al-As on his deathbed"
    read: ["Jāmiʿ 2:188.2-189.1"]
    quran: ["25:68", "39:53"]
    tags:
      - {motif: converts-ask-expiation-for-past-killing-and-zina, refs: ["Jāmiʿ 2:188.2"], note: "قد قتلوا وأكثروا، وزنوا وأكثروا ... لو تخبرنا أن لما عملنا كفارة، فنزلت: ﴿والذين لا يدعون مع الله إلها آخر﴾ ... ونزل: ﴿قل يا عبادي الذين أسرفوا﴾"}
      - {motif: good-in-islam-not-held-for-jahiliyya-deeds, refs: ["Jāmiʿ 2:188.3"], note: "من أحسن في الإسلام لم يؤاخذ بما عمل في الجاهلية، ومن أساء في الإسلام أخذ بالأول والآخر"}
      - {motif: dying-man-recounts-three-stages-of-life, refs: ["Jāmiʿ 2:189.1"], note: "إني قد كنت على أطباق ثلاث: لقد رأيتني وما أحد أشد بغضا لرسول الله ﷺ مني ... ثم ولينا أشياء ما أدري ما حالي فيها"}
      - {motif: withdraws-hand-to-set-a-condition-at-pledge, refs: ["Jāmiʿ 2:189.1"], note: "ابسط يمينك فلأبايعك. فبسط يمينه. قال: فقبضت يدي ... أردت أن أشترط ... أن يغفر لي"}
      - {motif: islam-hijra-hajj-demolish-what-came-before, refs: ["Jāmiʿ 2:189.1"], note: "أما علمت أن الإسلام يهدم ما كان قبله، وأن الهجرة تهدم ما كان قبلها، وأن الحج يهدم ما كان قبله؟"}
      - {motif: could-not-fill-his-eyes-with-the-prophet, refs: ["Jāmiʿ 2:189.1"], note: "وما كنت أطيق أن أملأ عيني منه إجلالا له، ولو سئلت أن أصفه ما أطقت"}
      - {motif: stay-at-grave-while-a-camel-is-slaughtered, refs: ["Jāmiʿ 2:189.1"], note: "فلا تصحبني نائحة ولا نار، فإذا دفنتموني فشنوا علي التراب شنا، ثم أقيموا حول قبري قدر ما تنحر جزور ويقسم لحمها حتى أستأنس بكم، وأنظر ماذا أراجع به رسل ربي"}
  - id: hadith-2-good-done-before-islam
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Hakim b. Hizam's good deeds of the jahiliyya; Ibn Jud'an never asked forgiveness; Hatim sought renown and got it"
