      - {motif: god-creates-new-people-for-paradises-surplus, refs: ["Jāmiʿ 67:8679.1"], note: "ولا يزال في الجنة فضل حتى ينشئ الله لها خلقا، فيسكنهم فضل الجنة"}
  - id: hadith-67-death-slaughtered
    tradition: islam
    corpus: hadith
