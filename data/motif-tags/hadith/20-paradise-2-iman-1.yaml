      - {motif: ramadan-paradise-opened-hell-shut-devils-chained, refs: ["Jāmiʿ 67:8677.1", "Jāmiʿ 67:8677.2"], note: "إذا جاء رمضان فتحت أبواب الجنة، وغلقت أبواب النار، وصفدت الشياطين ... فتحت أبواب الرحمة ... وسلسلت الشياطين"}
  - id: hadith-67-seats-shown-and-inherited
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Each is shown the seat he would have had in the other abode; the unbeliever inherits the believer's place in the fire and the reverse; one dip makes each forget"
