# Hadith chunk 20: al-Jāmiʿ al-Kāmil book 67 (paradise and hell, end) pp. 8646-8686, and book 2 (faith) pp. 119-197, babs 1-53.
# Read in full from the Arabic (268 hadith).
new_motifs:
  marrow-seen-like-red-drink-in-white-glass: {label: "The marrow of the wives' shins is seen through their robes as red drink is seen in a white glass", cluster: eschatology}
  paradise-womans-headcloth-better-than-world: {label: "The headcloth (nasif, khimar) of a woman of paradise is better than the world and what is in it", cluster: eschatology}
  bow-length-of-paradise-better-than-world: {label: "A bow's length or a foot's place in paradise is better than the world and what is in it", cluster: eschatology}
  houri-finger-scent-reaches-every-living-being: {label: "Were a houri to put out one finger, every living being would find its scent", cluster: eschatology}
  paradise-woman-would-blot-out-sun-and-moon: {label: "Were a woman of paradise to look down on the earth she would fill it with musk and take away the light of sun and moon", cluster: eschatology}
  governor-gives-away-stipend-prefers-houris-to-wife: {label: "A companion-governor sent ten thousand by Umar gives it away in purses; pressed by his wife, he says he would rather leave her for the houris than them for her, and pushes her chest", cluster: narrative}
  jew-argues-eating-in-paradise-implies-excretion: {label: "A Jew tells his friends he will defeat the prophet if he admits eating in paradise, since eating means need; answer: their need is a musk-scented sweat and the belly shrinks", cluster: eschatology}
  strength-of-a-hundred-men-in-paradise: {label: "Each man of paradise is given the strength of a hundred in food, drink, desire and intercourse", cluster: eschatology}
  paradise-dweller-sows-crop-ripens-in-a-glance: {label: "A man of paradise asks God's leave to sow; it sprouts, ripens, is reaped and heaped like mountains in the blink of an eye: 'take it, son of Adam, nothing fills you'", cluster: eschatology}
  bedouin-only-qurashi-or-ansari-would-farm: {label: "A bedouin listener says only a Qurashi or an Ansari, who are farmers, would ask that; the prophet laughs", cluster: narrative}
  kindler-of-the-fire-is-malik-with-gabriel-and-michael: {label: "In a dream two men explain: the one kindling the fire is Malik its keeper, 'I am Gabriel and this is Michael'", cluster: eschatology}
  world-left-like-last-drops-of-a-vessel: {label: "The world has announced its end and turned swiftly away; only a dreg remains like the last drops of a vessel its owner sips", cluster: ethics}
  prophet-never-laughed-after-hearing-the-rock-land: {label: "The prophet hears a crash: a rock thrown into the fire seventy autumns before has just settled; he was not seen laughing after that day", cluster: eschatology}
  image-makers-among-the-three-seized-by-the-fire: {label: "The neck from the fire is charged with every obstinate tyrant, every associator and the image-makers", cluster: eschatology}
  worldly-fire-one-hundredth-of-hell: {label: "This fire is one part of a hundred of hell", cluster: eschatology}
  fire-complains-granted-two-breaths: {label: "The fire complains to its Lord that it eats itself; it is allowed two breaths, one in winter and one in summer: the fiercest heat and the bitterest cold", cluster: cosmology}
  intoxicant-drinker-given-mire-of-corruption: {label: "God has bound himself to give the drinker of intoxicants the mire of corruption (tinat al-khabal): the sweat or juice of the people of the fire", cluster: eschatology}
  prayer-missed-drunk-four-times: {label: "Who leaves prayer through drunkenness once is as one robbed of the world; four times, God is bound to give him the mire of corruption", cluster: law}
  fire-forbidden-to-who-says-it-seeking-gods-face: {label: "Whoever comes on resurrection day saying 'no god but God' seeking God's face, God forbids the fire to him", cluster: theology}
  angels-prophets-martyrs-intercede-and-bring-out: {label: "Angels, prophets and martyrs are given leave to intercede and bring out, again and again, whoever has an atom's weight of faith", cluster: eschatology}
  believers-plead-for-brothers-who-prayed-with-them: {label: "Believers miss men who prayed, gave alms, fasted, made pilgrimage and raided with them, plead for them with God and are sent to bring them out of the fire", cluster: eschatology}
  burnt-thrown-in-river-of-life-sprout-like-seed: {label: "Those brought out charred are thrown into the river (water) of life at paradise's mouth and sprout like a seed in the flood's silt, coming up yellow and twisted", cluster: eschatology}
  four-brought-out-one-asks-not-to-be-returned: {label: "Four are brought out and shown to God; one turns and says 'Lord, since you took me out, do not return me', and God saves him", cluster: eschatology}
  ember-under-instep-boils-brain: {label: "The lightest punished: an ember (or two) placed under the hollow of his foot boils his brain like a cauldron", cluster: eschatology}
  lightest-punished-is-abu-talib: {label: "The lightest punished of the people of the fire is Abu Talib, wearing two sandals that boil his brain", cluster: eschatology}
  less-asked-in-adams-loins-not-to-associate: {label: "To the damned willing to ransom himself with the earth: 'I wanted less of you while you were in Adam's loins: that you not associate anything with me'", cluster: theology}
  two-men-lead-dreamer-up-rugged-mountain: {label: "In a dream two men take him by the upper arms to a rugged mountain and bid him climb; halfway he hears the howling of the people of the fire", cluster: eschatology}
  early-fast-breakers-hung-by-hamstrings-mouths-torn: {label: "Those who broke their fast before its time hang by their hamstrings, the corners of their mouths torn and running blood", cluster: eschatology}
  adulterers-most-swollen-and-stinking: {label: "The adulterers and adulteresses are the most swollen, foulest-smelling and ugliest", cluster: eschatology}
  snakes-bite-breasts-of-women-who-withheld-milk: {label: "Snakes bite the breasts of women who withheld their milk from their children", cluster: eschatology}
  unbelievers-shoulders-three-days-fast-ride-apart: {label: "Between the shoulders of the unbeliever in the fire is three days' journey for a fast rider", cluster: eschatology}
  unbelievers-skin-forty-two-cubits-by-the-jabbars-cubit: {label: "The unbeliever's skin in the fire is forty-two cubits thick 'by the cubit of the jabbar' (or seventy cubits broad)", cluster: eschatology}
  unbelievers-seat-in-fire-as-mecca-to-medina: {label: "The unbeliever's seat in the fire spans as far as Mecca to Medina, or to al-Rabadha, or Qudayd to Mecca; his thigh like al-Bayda' or Warqan", cluster: eschatology}
  earlobe-to-shoulder-seventy-autumns-valleys-of-pus: {label: "Between a damned man's earlobe and shoulder is seventy autumns' journey, through which run valleys (not rivers) of pus and blood", cluster: eschatology}
  hell-crushing-itself: {label: "He saw hell, its parts crushing one another", cluster: eschatology}
  lookalike-of-the-damned-not-harmed: {label: "The man in the fire most resembles Aktham b. al-Jawn; Aktham asks whether the likeness harms him: 'no, you are a Muslim and he an unbeliever'", cluster: narrative}
  saved-only-as-few-as-stray-cattle: {label: "Of the companions led off to the fire for turning back, none escapes but as few as stray untended cattle", cluster: eschatology}
  cat-woman-israelite-or-himyarite: {label: "The woman punished over the cat is an Israelite, or a tall black Himyarite woman", cluster: narrative}
  prophet-steps-back-from-heat-of-fire-in-prayer: {label: "In the eclipse prayer the fire is brought and he steps back for fear of its blast; paradise is brought and he steps forward", cluster: eschatology}
  pilgrim-thief-with-crooked-staff-in-fire: {label: "The man of the crooked staff, who stole from pilgrims with its hook and said 'it caught on my staff' if noticed, drags his guts in the fire leaning on the staff", cluster: eschatology}
  thief-of-sacrificial-camels-driven-with-forked-stick: {label: "The thief of the prophet's two sacrificial camels, the brother of Da'da', is pushed in the fire with a two-pronged stick", cluster: eschatology}
  did-you-not-promise-not-to-punish-them-while-i-am-among-them: {label: "Shown the fire, the prophet pleads: 'did you not promise not to punish them while I am among them and while they ask forgiveness?'", cluster: theology}
  women-most-of-fire-for-ingratitude-to-husband: {label: "He saw that most of the fire were women: they curse much and are ungrateful to the husband; after a lifetime of kindness one fault makes her say 'I never saw good from you'", cluster: ethics}
  women-told-give-alms-even-from-jewellery: {label: "At the feast the prophet tells the women: give alms, even from your jewellery, for you are most of the fire (the fuel of hell)", cluster: ritual}
  feast-prayer-before-sermon-no-adhan-no-iqama: {label: "At the feast he prays before the sermon without call or iqama, then stands leaning on Bilal and goes on to preach to the women", cluster: ritual}
  women-deficient-in-intellect-and-religion: {label: "'I have not seen any deficient in intellect and religion more able to take away a resolute man's mind than you'", cluster: ethics}
  the-corrupt-are-women-ungrateful-and-impatient: {label: "'The corrupt (fussaq) are the people of the fire': women, who when given do not thank and when tried do not endure", cluster: ethics}
  jew-or-christian-as-muslims-ransom-from-fire: {label: "On resurrection day God gives each Muslim a Jew or Christian: 'this is your ransom from the fire'; Muslims' sins like mountains are laid on them", cluster: eschatology}
  ramadan-paradise-opened-hell-shut-devils-chained: {label: "When Ramadan comes the gates of paradise (of mercy) are opened, the gates of hell shut and the devils chained", cluster: ritual}
  paradise-and-fire-nearer-than-sandal-strap: {label: "Paradise is nearer to each of you than his sandal-strap, and the fire likewise", cluster: ethics}
  man-asking-his-entrance-told-the-fire: {label: "Asked 'where do I enter?', the prophet answers 'the fire'", cluster: narrative}
  umar-kneels-content-with-god-islam-muhammad: {label: "Umar kneels: 'we are content with God as Lord, Islam as religion, Muhammad as messenger', and the prophet falls silent", cluster: narrative}
  god-creates-new-people-for-paradises-surplus: {label: "Room remains in paradise until God creates a new people and settles them in its surplus", cluster: eschatology}
  herald-eternity-no-death: {label: "A herald stands between them: 'people of paradise, eternity, no death; people of the fire, eternity, no death; each abides in what he is in'", cluster: eschatology}
  death-led-by-collar-to-the-wall-between: {label: "Death is led by the collar and stood on the wall between paradise and the fire; paradise's people look out afraid, the fire's hopeful of intercession; it is laid down and slaughtered on the wall", cluster: eschatology}
  two-necessities-dying-with-or-without-shirk: {label: "The two necessities (mujibatan): who dies associating nothing with God enters paradise, who dies associating enters the fire", cluster: theology}
  god-loathed-earth-but-remnants-of-scripture-people: {label: "God looked at the people of the earth and loathed them, Arabs and non-Arabs, except remnants of the people of the book", cluster: theology}
  ordered-to-burn-quraysh-head-made-into-bread: {label: "God orders the prophet to burn Quraysh; 'they will break my head like bread'; 'drive them out as they drove you; raise an army, we send five like it'", cluster: narrative}
  three-people-of-paradise-five-of-the-fire: {label: "People of paradise are three (just ruler, tender-hearted man, chaste man with dependants); of the fire five (the weak without restraint, the greedy cheat, the one who deceives you over family and wealth, the miser or liar, the obscene)", cluster: ethics}
  fire-forbidden-to-the-near-gentle-easy: {label: "The fire is forbidden to everyone near (approachable), gentle and easy", cluster: ethics}
  questioner-confirms-answers-you-speak-truly: {label: "The stranger confirms each answer 'you speak truly'; they wonder that he asks and then confirms", cluster: narrative}
  gabriel-vanishes-when-sought: {label: "The questioner turns away; 'bring him back' - they see nothing: 'this was Gabriel come to teach the people their religion'", cluster: narrative}
  faith-includes-decree-good-and-evil: {label: "Faith includes belief in the decree, its good and its evil (prompted by Ma'bad al-Juhani's denial of qadar)", cluster: theology}
  camel-couched-and-hobbled-in-the-mosque: {label: "A man rides into the mosque, couches and hobbles his camel and asks 'which of you is Muhammad?'", cluster: narrative}
  envoy-of-two-plaits-converts-whole-tribe-in-a-day: {label: "Dimam, a man with two plaits, returns and says 'wretched are al-Lat and al-'Uzza'; his people warn of leprosy and madness; by evening every man and woman of the camp is Muslim", cluster: narrative}
  swore-by-his-fingers-not-to-come: {label: "He swore as many oaths as his fingers not to come, showing his two hands spread", cluster: narrative}
  wife-fed-and-clothed-face-not-struck: {label: "The wife's right: feed her when you eat, clothe her when you clothe yourself, do not strike the face, do not revile, do not shun her except in the house", cluster: law}
  gathered-toward-syria-mouths-gagged-thigh-speaks-first: {label: "You will be gathered toward Syria on foot, riding and on your faces, your mouths gagged; the first to speak for a man is his thigh", cluster: eschatology}
  withheld-surplus-becomes-serpent-biting-the-miser: {label: "A master who withholds his surplus from his client is given a bald serpent that bites him before the judgement", cluster: eschatology}
  islam-built-on-five: {label: "Islam is built on five: the two testimonies, prayer, alms, pilgrimage, fast of Ramadan", cluster: ritual}
  faith-sixty-or-seventy-odd-branches: {label: "Faith is sixty-odd (seventy-odd) branches; modesty is a branch of faith", cluster: theology}
  love-hate-give-withhold-for-god-completes-faith: {label: "Who loves, hates, gives and withholds (and marries) for God has completed faith", cluster: ethics}
  most-perfect-faith-best-character-best-to-wives: {label: "The most perfect in faith are the best in character, and the best of you are the best to their wives; good character reaches the rank of fasting and prayer", cluster: ethics}
  no-adulterer-is-believer-while-he-commits-it: {label: "The adulterer is not a believer while he commits adultery, nor the drinker while he drinks, nor the thief while he steals (nor the killer)", cluster: ethics}
  plunder-of-renown-while-eyes-are-raised: {label: "Nor does one plunder a prized spoil to which people raise their eyes while he is a believer", cluster: ethics}
  faith-withdrawn-like-unlaced-fingers: {label: "Faith leaves him thus: Ibn Abbas interlaces his fingers and draws them apart; if he repents it returns, interlacing them again", cluster: theology}
  faith-hovers-over-adulterer-like-canopy: {label: "When a man commits adultery faith goes out of him and is over him like a canopy; when he stops it returns", cluster: theology}
  no-faith-without-trust-no-religion-without-covenant: {label: "No faith for one without trustworthiness, no religion for one without covenant", cluster: ethics}
  two-womens-witness-equals-one-mans: {label: "The deficiency of intellect: two women's testimony equals one man's", cluster: law}
  menstruant-neither-prays-nor-fasts-deficiency-of-religion: {label: "The deficiency of religion: in menstruation she stays nights without prayer and breaks the fast in Ramadan", cluster: ritual}
  wife-gives-jewellery-as-alms-to-husband-and-children: {label: "Zaynab brings her jewellery to give in alms; Ibn Mas'ud claims it for himself and his children; 'which Zaynab?'; 'give it to him and his sons, they are a fit place for it'", cluster: law}
  brought-out-by-dinar-half-dinar-atom-of-good: {label: "They bring out whoever has a dinar's weight of good in his heart, then half a dinar, then an atom (or barley, wheat, atom)", cluster: eschatology}
  most-merciful-scoops-handful-who-never-did-good: {label: "Angels, prophets and believers have interceded; only the Most Merciful remains and takes a handful from the fire of people who never did good, turned to charcoal", cluster: eschatology}
  mustard-seed-of-faith-or-of-pride: {label: "None with a mustard seed of faith in his heart enters the fire; none with a mustard seed of pride enters paradise", cluster: eschatology}
  freed-of-god-written-on-necks-called-jahannamiyyun: {label: "Those brought out are written on the necks 'God's freedmen' and in paradise are called the Jahannamiyyun", cluster: eschatology}
  god-brings-out-by-his-own-knowledge-and-mercy: {label: "After the intercessors God says 'now I bring out by my knowledge and mercy' and brings out many times as many", cluster: eschatology}
  faith-learned-before-quran-then-increased: {label: "As strong boys with the prophet we learned faith before the Quran, then learned the Quran and our faith increased by it", cluster: theology}
  grabs-camels-halter-to-ask-the-way-to-paradise: {label: "A bedouin seizes the halter of the prophet's camel to ask what brings him near paradise; answered, he is told 'let go of the camel'", cluster: narrative}
  four-commands-four-prohibitions-fifth-of-spoils: {label: "The delegation of Abd al-Qays is commanded four things including giving a fifth of the spoils, and forbidden four vessels", cluster: law}
  drunk-man-strikes-cousin-with-sword: {label: "Drinking from the hollowed trunk, a man strikes his cousin with the sword; one of the delegation hides such a wound for shame", cluster: narrative}
  leather-skins-even-if-rats-eat-them: {label: "Told to drink from tied leather skins, they say rats eat them in their land: 'even if rats eat them' three times", cluster: law}
  welcome-without-shame-or-regret: {label: "Welcome to the delegation, 'neither disgraced nor regretful'", cluster: narrative}
  head-islam-pillar-prayer-hump-jihad: {label: "The head of the matter is islam, its pillar prayer, the top of its hump jihad", cluster: theology}
  thrown-on-faces-for-harvest-of-tongues: {label: "Holding his tongue: 'restrain this'; 'are people thrown on their faces into the fire for anything but the harvest of their tongues?'", cluster: ethics}
  not-believe-until-love-spread-greeting: {label: "You will not enter paradise till you believe nor believe till you love one another: spread the greeting among you", cluster: ethics}
  face-not-the-face-of-a-liar: {label: "Ibn Salam looks at the prophet's face at his arrival in Medina and knows it is not a liar's; the first words: spread the greeting, feed, pray while people sleep", cluster: narrative}
  abu-l-hakam-renamed-abu-shurayh: {label: "A man called Abu l-Hakam: 'God is the judge (al-hakam)'; he names his eldest son Shurayh and is renamed Abu Shurayh", cluster: narrative}
  abd-al-hajar-renamed-abd-allah: {label: "A man named Abd al-Hajar (servant of the stone) is renamed Abd Allah", cluster: narrative}
  good-speech-and-giving-food-oblige-paradise: {label: "What obliges paradise: good speech and giving food", cluster: ethics}
  or-a-muslim-not-a-believer: {label: "Sa'd says of a man left out of a gift 'I see him a believer'; three times the prophet answers 'or a Muslim'", cluster: theology}
  dying-companion-tells-the-one-withheld-hadith: {label: "A dying companion tells the one hadith he had withheld, for fear of sin in keeping it", cluster: narrative}
  called-three-times-labbayk-then-taught: {label: "Riding behind him, Mu'adh is called by name three times, each answered 'labbayk', before the teaching", cluster: narrative}
  right-of-god-on-servants-and-of-servants-on-god: {label: "God's right on his servants is that they worship him and associate nothing; the servants' right on God is that he not punish whoever associates nothing", cluster: theology}
  riding-pillion-on-donkey-named-ufayr: {label: "Mu'adh rides behind the prophet on a donkey named 'Ufayr", cluster: narrative}
  dies-on-unity-with-certain-heart-forgiven: {label: "No soul dies associating nothing, testifying to the messenger, its witness returning to a certain heart, but it is forgiven", cluster: theology}
  blind-man-asks-prophet-to-pray-in-his-house: {label: "Going blind, Itban asks the prophet to pray in his house so he may take the spot as his place of prayer", cluster: ritual}
  fire-does-not-eat-marks-of-prostration: {label: "Angels recognise those to be brought out by the marks of prostration; God forbade the fire to eat the marks of prostration", cluster: eschatology}
  squeezes-into-garden-like-a-fox-through-the-stream: {label: "Searching for the prophet, Abu Hurayra squeezes into a walled garden like a fox through the channel that feeds it", cluster: narrative}
  sandals-given-as-token-of-the-message: {label: "The prophet gives Abu Hurayra his sandals as token: tell whoever testifies with certainty that he has paradise", cluster: narrative}
  umar-turns-back-bearer-of-good-news: {label: "Umar strikes the bearer of the good news on the chest and sends him back, fearing people will rely on it; the prophet agrees: 'let them work'", cluster: narrative}
  leftover-provisions-blessed-fill-every-vessel: {label: "Starving on a raid, they bring the remnants of their provisions to a leather mat; he blesses them and every vessel in the camp is filled", cluster: narrative}
  two-testimonies-without-doubt-not-barred-from-paradise: {label: "No servant meets God with the two testimonies, not doubting them, and is barred from paradise", cluster: theology}
  last-out-crawling-told-ten-worlds-asks-are-you-mocking: {label: "The last out of the fire comes crawling, finds paradise seeming full, returns twice, is given ten times the world and asks 'do you mock me, and you the King?'; the prophet laughs till his molars show", cluster: eschatology}
  the-many-are-the-few-but-who-gives-this-way: {label: "The many (in wealth) are the few on resurrection day, except who scatters it right, left, before and behind; he would not keep a dinar of Uhud in gold three nights", cluster: ethics}
  told-sit-here-voice-heard-in-the-lava-field: {label: "Abu Dharr is told to sit in a hollow ringed with stones; the prophet disappears in the lava field and is heard answering someone: Gabriel", cluster: narrative}
  even-if-he-steals-and-fornicates: {label: "Whoever dies associating nothing enters paradise, 'even if he steals and fornicates' (and drinks wine)", cluster: theology}
  dies-knowing-no-god-but-god-enters-paradise: {label: "Whoever dies knowing there is no god but God enters paradise", cluster: theology}
  brought-out-by-intercession-like-tharir: {label: "They come out of the fire by intercession like tharir (small cucumbers, explained as daghabis)", cluster: eschatology}
  burnt-all-but-the-circles-of-their-faces: {label: "A people come out of the fire burnt all over except the circles of their faces", cluster: eschatology}
  kharijite-band-turned-back-by-jabirs-hadith: {label: "A band holding the Kharijite view, on the way to pilgrimage and revolt, hear Jabir on the praised station and those brought out; all but one turn back", cluster: narrative}
  out-like-sesame-stalks-washed-white-as-paper: {label: "They come out like sesame stalks, wash in a river of paradise and come out like sheets of paper", cluster: eschatology}
  once-traded-with-anyone-now-with-few: {label: "Once I did not care with whom I traded, for Muslim or Christian would be made to return my due; now I trade only with so-and-so", cluster: ethics}
  valiant-fighter-of-the-fire-kills-himself: {label: "A man who fought fiercely at Khaybar, declared of the fire, cannot bear his wounds and kills himself; 'God is great, I bear witness I am God's servant and messenger'", cluster: narrative}
  god-supports-religion-by-the-wicked-man: {label: "God supports this religion by the wicked man", cluster: theology}
  proclaim-only-believers-enter-paradise: {label: "Bilal, Umar and Bishr are sent to proclaim to the people that only a believing (Muslim) soul enters paradise", cluster: ritual}
  tashriq-days-of-eating-and-drinking: {label: "The days of tashriq are days of eating and drinking", cluster: ritual}
  son-leads-father-by-hand-father-changed-and-left: {label: "A man takes his father's hand to bring him into paradise; told it is forbidden to every associator, the father changes into an ugly form with a stench and he leaves him", cluster: eschatology}
  not-enter-whose-neighbour-unsafe-from-harms: {label: "He will not enter paradise whose neighbour is not safe from his harms (bawa'iq)", cluster: ethics}
  three-give-sweetness-of-faith: {label: "Three bring the sweetness of faith: God and his messenger dearer than all else, loving a man only for God, hating to return to unbelief as to be thrown into fire", cluster: ethics}
  taste-of-faith-content-with-god-islam-muhammad: {label: "He tastes faith who is content with God as Lord, Islam as religion and Muhammad as messenger", cluster: theology}
  love-a-man-only-for-god-gives-taste-of-faith: {label: "Whoever would find the taste of faith, let him love a man only for God", cluster: ethics}
  prophet-dearer-than-father-child-and-all: {label: "None of you believes till I am dearer to him than his father, his child and all people", cluster: theology}
  love-for-brother-what-you-love-for-self: {label: "None of you believes till he loves for his brother (or neighbour) what he loves for himself", cluster: ethics}
  whoever-believes-honours-guest-and-neighbour-speaks-good-or-is-silent: {label: "Whoever believes in God and the last day does not harm his neighbour, honours his guest, and speaks good or keeps silent", cluster: ethics}
  guests-due-a-day-and-night-hospitality-three-days: {label: "The guest's due (ja'iza) is a day and a night; hospitality is three days; beyond that it is charity", cluster: law}
  change-evil-by-hand-tongue-or-heart: {label: "Whoever sees an evil let him change it by his hand, if not by his tongue, if not by his heart, the weakest of faith", cluster: ethics}
  prophets-disciples-then-successors-who-say-not-do: {label: "Every prophet had disciples who held to his way; then came successors who say what they do not and do what they are not commanded; whoever strives against them by hand, tongue or heart is a believer", cluster: ethics}
  love-of-ansar-sign-of-faith: {label: "The sign of faith is love of the Ansar, the sign of hypocrisy hatred of them", cluster: ethics}
  leave-him-modesty-is-of-faith: {label: "Passing a man reproaching his brother for modesty: 'leave him, modesty is of faith'", cluster: ethics}
  modesty-brings-only-good: {label: "Modesty brings nothing but good", cluster: ethics}
  modesty-in-paradise-obscenity-in-fire: {label: "Modesty is of faith and faith in paradise; obscenity is of coarseness and coarseness in the fire", cluster: ethics}
  modesty-and-faith-paired-one-lifted-other-lifted: {label: "Modesty and faith are joined; when one is lifted the other is lifted", cluster: ethics}
  only-believer-loves-ali: {label: "Ali swears by him who split the seed and made the soul: only a believer loves me and only a hypocrite hates me", cluster: ethics}
  clan-of-abu-blank-not-my-friends: {label: "'The family of Abu [blank in the scribe's copy] are not my friends; my friend is God and the righteous believers'", cluster: narrative}
  sheep-on-mountain-peaks-flight-from-strife: {label: "The best wealth will be sheep followed to the mountain peaks and rain-places, fleeing with one's religion from strife", cluster: ethics}
  best-is-fighter-then-recluse-in-a-ravine: {label: "Best is the believer fighting with self and wealth, then the believer in a ravine who fears God and spares people his evil", cluster: ethics}
  rider-flies-to-every-alarm: {label: "Best livelihood: a man holding his horse's rein who flies on its back at every cry of alarm seeking death where it may be found", cluster: ethics}
  census-of-those-who-professed-islam: {label: "'Write down for me who has professed islam': fifteen hundred (or six to seven hundred); later they were tried till a man prayed alone in fear", cluster: narrative}
  greeting-the-dead-god-willing-we-will-join-you: {label: "At the graveyard: 'peace on you, abode of believers; we will join you, God willing'", cluster: ritual}
  brothers-yet-to-come-known-by-white-blaze-of-ablution: {label: "He longs for his brothers yet to come; he will know them as a man knows his white-blazed horses among black: they come with blaze and stockings from ablution", cluster: eschatology}
  men-driven-from-the-basin-like-stray-camels: {label: "Men are driven from his basin as a stray camel is driven; he calls them and is told 'they changed after you': 'away, away'", cluster: eschatology}
  dream-shirts-of-faith-umar-trails-his: {label: "In a dream people are shown in shirts reaching the breast or less; Umar's he trails; interpreted as religion", cluster: narrative}
  ammar-filled-with-faith-to-bone-ends: {label: "Ali greets Ammar 'the good and made good': 'Ammar is filled with faith to the ends of his bones'", cluster: narrative}
  hardness-among-camel-drovers-where-devils-horns-rise: {label: "Hardness and coarseness of heart are among the loud camel-drovers at the camels' tails, where the devil's two horns rise, in Rabi'a and Mudar", cluster: ethics}
  pride-with-camel-owners-calm-with-sheep-owners: {label: "Pride and vanity are among the camel people of the tents, calm and dignity among the sheep owners", cluster: ethics}
  faith-in-hijaz-harshness-in-the-east: {label: "Coarseness of heart and harshness are in the east, faith in the people of the Hijaz", cluster: ethics}
  good-deed-tenfold-to-seven-hundred-bad-as-one: {label: "When a man's islam is good, each good deed is written tenfold to seven hundred, each bad deed as one", cluster: theology}
  leaving-what-does-not-concern-him: {label: "Part of a man's good islam is leaving what does not concern him", cluster: ethics}
  convert-credited-with-good-done-before-islam: {label: "When a man becomes Muslim and his islam is good, God writes every good he did before and erases every evil; then the reckoning begins", cluster: theology}
  pledge-of-sincere-counsel-to-every-muslim: {label: "Pledged to prayer, alms and sincere counsel to every Muslim; told to add 'as far as I am able'", cluster: ritual}
  religion-is-sincere-counsel: {label: "Religion is sincere counsel: to God, his book, his messenger, the leaders of the Muslims and their common folk", cluster: ethics}
  i-will-seek-forgiveness-until-forbidden: {label: "'I will ask forgiveness for you as long as I am not forbidden', and Q 9:113 came down", cluster: narrative}
  faith-once-mingled-with-hearts-none-resent-it: {label: "Heraclius: so is faith, growing till complete; when its joy mingles with hearts none apostatises in resentment of it", cluster: narrative}
  religion-is-ease-none-overdoes-it-but-is-beaten: {label: "Religion is ease; none overburdens himself in religion but it overcomes him; aim right, come near, use the morning, evening and part of the night", cluster: ethics}
  say-we-hear-and-obey-not-we-hear-and-disobey: {label: "Do not say as the people of the two books said 'we hear and disobey'; say 'we hear and obey, your forgiveness our Lord'", cluster: scripture}
  companions-kneel-at-the-unbearable-verse: {label: "At Q 2:284 the companions come and kneel: we can bear prayer, fasting, jihad and alms, but not this", cluster: narrative}
  god-answers-each-petition-yes-i-have-done-it: {label: "To each petition of the closing verses God answers 'yes' (or 'I have done it')", cluster: scripture}
  brought-out-then-ordered-back-this-was-not-my-hope: {label: "Two brought out are ordered back to the fire; one turns: 'this was not my hope'; asked his hope, 'that you would not return me', and he is let into paradise", cluster: eschatology}
  i-am-as-my-servant-thinks-good-or-bad: {label: "'I am as my servant thinks of me: if he thinks good, it is his; if he thinks evil, it is his'", cluster: theology}
  two-fears-and-two-securities-not-joined: {label: "God swears: I do not join on my servant two fears or two securities; who fears me in the world I make safe on the day, who feels safe I make afraid", cluster: theology}
  emigrants-allotted-to-hosts-by-lot: {label: "The emigrants were divided among the Ansar by lot; Uthman b. Maz'un fell to Umm al-Ala's household", cluster: narrative}
  what-makes-you-know-god-honoured-him: {label: "'What makes you know God honoured him? I do not know, though God's messenger, what will be done with me'; she never vouched for anyone again", cluster: theology}
  sinner-orders-body-burned-ground-scattered-forgiven-for-fear: {label: "A man of old who did no good orders his sons to burn him, grind him and scatter him on a windy day; God gathers him: 'why?' - 'fear of you'; he is forgiven", cluster: narrative}
  half-scattered-on-land-half-in-sea-each-gives-back: {label: "Half the ashes are strewn on land and half in the sea; God commands land and sea to gather what is in them", cluster: narrative}
  submit-even-if-unwilling: {label: "'Become Muslim' - 'I find myself unwilling' - 'even if you are unwilling'", cluster: theology}
  reviling-a-muslim-is-sin-fighting-him-unbelief: {label: "Reviling a Muslim is wickedness and fighting him unbelief", cluster: ethics}
  do-not-revert-to-unbelief-striking-necks: {label: "At the farewell pilgrimage: 'do not turn unbelievers after me, striking one another's necks'", cluster: ethics}
  attacking-lineage-and-wailing-are-unbelief: {label: "Two things in people are unbelief: attacking lineage and wailing over the dead", cluster: ethics}
  three-jahiliyya-practices-never-left: {label: "Three practices of the jahiliyya the people of islam will not leave: wailing, seeking rain by the stars, and the jahiliyya cry 'O family of so-and-so' (or reviling lineage)", cluster: ethics}
  good-in-islam-not-held-for-jahiliyya-deeds: {label: "Who does good in islam is not held to account for what he did in the jahiliyya; who does evil in it is taken for the first and the last", cluster: theology}
  dying-man-recounts-three-stages-of-life: {label: "Dying, Amr b. al-As weeps with his face to the wall and recounts three stages: hatred, love of the prophet, offices whose end he does not know", cluster: narrative}
  withdraws-hand-to-set-a-condition-at-pledge: {label: "At the pledge he draws back his hand to set a condition: that he be forgiven", cluster: narrative}
  islam-hijra-hajj-demolish-what-came-before: {label: "Islam demolishes what was before it, emigration what was before it, pilgrimage what was before it", cluster: theology}
  could-not-fill-his-eyes-with-the-prophet: {label: "For reverence he could not fill his eyes with the prophet and could not describe him if asked", cluster: narrative}
  stay-at-grave-while-a-camel-is-slaughtered: {label: "No wailer and no fire with the bier; pour the earth on me, then stay round my grave as long as a camel is slaughtered and its meat divided, that I may have your company while I answer my Lord's messengers", cluster: ritual}
  you-became-muslim-with-the-good-you-did: {label: "Asked about acts of devotion in the jahiliyya (alms, freeing slaves, kinship): 'you became Muslim with the good that went before'", cluster: theology}
  hundred-slaves-freed-hundred-camels-given-before-and-after: {label: "Hakim b. Hizam freed a hundred slaves and gave a hundred camels in the jahiliyya, and did the same in islam", cluster: narrative}
  ibn-judan-never-asked-forgiveness-for-the-day-of-judgement: {label: "Ibn Jud'an kept kinship and fed the poor, but it does not avail him: he never once said 'Lord, forgive my sin on the day of judgement'", cluster: theology}
  father-sought-renown-and-attained-it: {label: "Of Adi b. Hatim's generous father: 'your father wanted a thing and attained it', meaning renown", cluster: theology}
  islam-began-strange-will-return-strange: {label: "Islam began as a stranger and will return a stranger as it began; blessed are the strangers", cluster: eschatology}
  faith-shrinks-between-two-mosques-like-snake-to-hole: {label: "Islam (faith) will shrink back between the two mosques as a snake shrinks back into its hole", cluster: eschatology}
  strangers-are-those-righteous-when-people-corrupt: {label: "The strangers are those who are righteous when people are corrupt", cluster: ethics}
  few-righteous-among-many-wicked: {label: "The strangers: a few righteous people among many bad, those who disobey them more than those who obey", cluster: ethics}
units:
  # ---- Book 67: paradise (end), hell, the people of hell, paradise and hell together
  - id: hadith-67-no-sleep-in-paradise
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "The people of paradise do not sleep: sleep is the brother of death"
    read: ["Jāmiʿ 67:8646.1"]
    tags:
      - {motif: no-sleep-in-paradise-sleep-brother-of-death, refs: ["Jāmiʿ 67:8646.1"], note: "هل ينام أهل الجنة؟ قال: لا، النوم أخو الموت"}
  - id: hadith-67-women-of-paradise
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "The women of paradise: two wives, seventy robes, marrow seen through; a houri's finger or glance would fill the earth with scent"
    read: ["Jāmiʿ 67:8646.2-8648.2"]
    quran: ["56:22-23", "38:52", "55:70-75", "4:57"]
    tags:
      - {motif: first-group-like-full-moon-two-wives-marrow-seen, refs: ["Jāmiʿ 67:8646.2", "Jāmiʿ 67:8647.3"], note: "أول زمرة تدخل الجنة على صورة القمر ليلة البدر ... لكل امرئ منهم زوجتان اثنتان، يرى مخ سوقهما من وراء اللحم"}
      - {motif: no-bachelor-in-paradise, refs: ["Jāmiʿ 67:8646.2"], note: "وما في الجنة أعزب؟ (asked as Ibn Sirin's companions debate whether men or women are more in paradise)"}
      - {motif: houri-wears-seventy-robes-marrow-seen, refs: ["Jāmiʿ 67:8647.1", "Jāmiʿ 67:8647.3"], note: "زوجتان من حور العين، على كل واحدة سبعون حلة، يرى مخ ساقها من وراء الثياب"}
      - {motif: marrow-seen-like-red-drink-in-white-glass, refs: ["Jāmiʿ 67:8647.3"], note: "يرى مخ سوقهن من وراء الحلل، كما ترى الشراب الأحمر في الزجاجة البيضاء"}
      - {motif: woman-of-paradise-would-light-the-earth, refs: ["Jāmiʿ 67:8647.2", "Jāmiʿ 67:8648.2"], note: "لو أن امرأة من نساء أهل الجنة اطلعت إلى الأرض لأضاءت ما بينهما، ولملأت ما بينهما ريحا"}
      - {motif: paradise-womans-headcloth-better-than-world, refs: ["Jāmiʿ 67:8647.2"], note: "ولنصيفها -يعني الخمار- خير من الدنيا وما فيها"}
      - {motif: bow-length-of-paradise-better-than-world, refs: ["Jāmiʿ 67:8647.2"], note: "ولقاب قوس أحدكم أو موضع قدم من الجنة خير من الدنيا وما فيها"}
      - {motif: houri-finger-scent-reaches-every-living-being, refs: ["Jāmiʿ 67:8648.1"], note: "لو أن حورا أطلعت أصبعا من أصابعها لوجد ريحها كل ذي روح"}
      - {motif: paradise-woman-would-blot-out-sun-and-moon, refs: ["Jāmiʿ 67:8648.2"], note: "لملأت الأرض ريح مسك، ولأذهبت ضوء الشمس والقمر"}
      - {motif: governor-gives-away-stipend-prefers-houris-to-wife, refs: ["Jāmiʿ 67:8648.1", "Jāmiʿ 67:8648.2"], note: "فبعث إليه بعشرة آلاف ... فجعل يفرقها صررا ... فأنا أدعهن، لكن والله! لأنتن أحق أن أدعكن لهن ... ودفع في صدرها"}
  - id: hadith-67-intercourse-in-paradise
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "A Jew's challenge on eating in paradise; the strength of a hundred men; a hundred virgins a day; the wife returns a virgin"
    read: ["Jāmiʿ 67:8649.1-8650.1"]
    tags:
      - {motif: jew-argues-eating-in-paradise-implies-excretion, refs: ["Jāmiʿ 67:8649.1"], note: "إن أقر لي بهذه خصمته ... فإن الذي يأكل ويشرب تكون له الحاجة ... حاجة أحدهم عرق يفيض من جلودهم مثل ريح المسك، فإذا البطن قد ضمر"}
      - {motif: strength-of-a-hundred-men-in-paradise, refs: ["Jāmiʿ 67:8649.1", "Jāmiʿ 67:8649.2"], note: "إن أحدهم ليعطى قوة مائة رجل في المطعم والمشرب والشهوة والجماع"}
      - {motif: wife-returns-virgin-after-intercourse, refs: ["Jāmiʿ 67:8649.3"], note: "أنطأ في الجنة؟ قال: نعم ... دحما دحما، فإذا قام عنها رجعت مطهرة بكرا"}
      - {motif: hundred-virgins-a-day, refs: ["Jāmiʿ 67:8650.1"], note: "إن الرجل ليفضي في اليوم الواحد إلى مائة عذراء"}
    hints:
      - "A Jew holds that eating and drinking in paradise must bring bodily need, and is answered that it leaves as musk-scented sweat: compare b. Berakhot 17a (Rav), 'in the world to come there is no eating, no drinking, no procreation'."
  - id: hadith-67-child-in-paradise
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "A child in paradise, if desired, is carried, born and grown in an hour"
    read: ["Jāmiʿ 67:8650.2"]
    quran: ["50:35", "41:31"]
    tags:
      - {motif: child-in-paradise-in-an-hour, refs: ["Jāmiʿ 67:8650.2"], note: "المؤمن إذا اشتهى الولد في الجنة كان حمله ووضعه وسنه في ساعة كما يشتهي"}
  - id: hadith-67-farming-in-paradise
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "A man of paradise asks leave to sow; the crop sprouts, ripens and is heaped like mountains in a glance"
    read: ["Jāmiʿ 67:8651.1"]
    tags:
      - {motif: paradise-dweller-sows-crop-ripens-in-a-glance, refs: ["Jāmiʿ 67:8651.1"], note: "استأذن ربه في الزرع ... فبذر، فتبادر الطرف نباته واستواؤه واستحصاده وتكويره أمثال الجبال، فيقول الله تعالى: دونك يا ابن آدم، فإنه لا يشبعك شيء"}
      - {motif: bedouin-only-qurashi-or-ansari-would-farm, refs: ["Jāmiʿ 67:8651.1"], note: "لا تجد هذا إلا قرشيا أو أنصاريا، فإنهم أصحاب زرع، فأما نحن فلسنا بأصحاب زرع، فضحك رسول الله ﷺ"}
  - id: hadith-67-praise-as-breath
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "The people of paradise do not excrete; they are inspired with praise as with breath; God's pleasure that is never withdrawn"
    read: ["Jāmiʿ 67:8651.2-8652.1"]
    quran: ["10:9-10"]
    tags:
      - {motif: people-of-paradise-do-not-excrete, refs: ["Jāmiʿ 67:8651.2"], note: "ولا يتفلون ولا يبولون ولا يتغوطون ولا يمتخطون ... جشاء ورشح كرشح المسك، يلهمون التسبيح والتحميد، كما تلهمون النفس"}
      - {motif: i-make-my-pleasure-alight-on-you, refs: ["Jāmiʿ 67:8651.3", "Jāmiʿ 67:8652.1"], note: "هل رضيتم؟ ... أحل عليكم رضواني، فلا أسخط عليكم بعده أبدا"}
  - id: hadith-67-no-interpreter-half-a-date
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Each will be spoken to by God with no interpreter; guard against the fire with half a date"
    read: ["Jāmiʿ 67:8653.1"]
    tags:
      - {motif: no-interpreter-between-man-and-god, refs: ["Jāmiʿ 67:8653.1"], note: "ليس بينه وبينه ترجمان، فينظر أيمن منه فلا يرى إلا ما قدم ... فاتقوا النار ولو بشق تمرة ... فمن لم يجد فبكلمة طيبة"}
  - id: hadith-67-hell-brought-and-filled
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Hell is dragged with seventy thousand reins; it asks for more until the Lord sets his foot in it"
    read: ["Jāmiʿ 67:8653.2-8653.3"]
    quran: ["50:30"]
    tags:
      - {motif: hell-dragged-by-seventy-thousand-reins, refs: ["Jāmiʿ 67:8653.2"], note: "يؤتى بجهنم يومئذ لها سبعون ألف زمام، مع كل زمام سبعون ألف ملك يجرونها"}
      - {motif: lord-sets-foot-hell-says-enough, refs: ["Jāmiʿ 67:8653.3"], note: "لا تزال جهنم تقول: هل من مزيد؟ حتى يضع فيها رب العزة قدمه، فتقول: قط قط وعزتك. ويزوى بعضها إلى بعض"}
  - id: hadith-67-malik-keeper-of-the-fire
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Malik, the keeper who kindles the fire, shown in a dream and on the night journey"
    read: ["Jāmiʿ 67:8653.4-8654.1"]
    tags:
      - {motif: kindler-of-the-fire-is-malik-with-gabriel-and-michael, refs: ["Jāmiʿ 67:8653.4"], note: "رأيت الليلة رجلين أتياني قالا: الذي يوقد النار مالك خازن النار، وأنا جبريل، وهذا ميكائيل"}
      - {motif: malik-keeper-of-hell, refs: ["Jāmiʿ 67:8654.1"], note: "وأري مالكا خازن النار"}
      - {motif: moses-like-a-man-of-shanua, refs: ["Jāmiʿ 67:8654.1"], note: "على موسى بن عمران، رجل آدم طوال جعد كأنه من رجال شنوءة، ورأيت عيسى ابن مريم مربوع الخلق إلى الحمرة والبياض سبط الرأس"}
  - id: hadith-67-depth-of-hell
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "A stone falling seventy autumns to hell's bottom; a careless word that drops a man into the fire; a lead ball and the chain"
    read: ["Jāmiʿ 67:8654.2-8655.2"]
    quran: ["40:71-72"]
    tags:
      - {motif: stone-falls-seventy-years-in-hell, refs: ["Jāmiʿ 67:8654.2", "Jāmiʿ 67:8654.5", "Jāmiʿ 67:8655.1"], note: "إذ سمع وجبة ... هذا حجر رمي به في النار منذ سبعين خريفا فهو يهوي في النار الآن حتى انتهى إلى قعرها"}
      - {motif: careless-word-drops-man-east-to-west-into-fire, refs: ["Jāmiʿ 67:8654.3"], note: "إن العبد ليتكلم بالكلمة ما يتبين ما فيها، يهوي بها في النار أبعد ما بين المشرق والمغرب"}
      - {motif: careless-word-raises-or-hurls-into-hell, refs: ["Jāmiʿ 67:8654.4"], note: "بالكلمة من رضوان الله لا يلقي لها بالا يرفعه الله بها درجات ... من سخط الله ... يهوي بها في جهنم"}
      - {motif: world-left-like-last-drops-of-a-vessel, refs: ["Jāmiʿ 67:8654.5"], note: "إن الدنيا قد آذنت بصرم وولت حذاء، ولم يبق منها إلا صبابة كصبابة الإناء، يتصابها صاحبها"}
      - {motif: prophet-never-laughed-after-hearing-the-rock-land, refs: ["Jāmiʿ 67:8655.1"], note: "سمعت هدة لم أسمع مثلها ... هذا صخر قذف به في النار منذ سبعين خريفا فاليوم استقر قراره ... ما رأيته ضاحكا بعد ذلك اليوم حتى واراه التراب"}
      - {motif: lead-ball-falls-five-hundred-years-chain-forty-autumns, refs: ["Jāmiʿ 67:8655.2"], note: "لو أن رصاصة مثل هذه -وأشار إلى مثل جمجمة- أرسلت من السماء إلى الأرض وهي مسيرة خمس مائة سنة لبلغت الأرض قبل الليل ... من رأس السلسلة لسارت أربعين خريفا"}
  - id: hadith-67-neck-from-the-fire
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "A neck comes out of the fire with eyes, ears and a tongue, charged with three"
    read: ["Jāmiʿ 67:8656.1-8656.2"]
    tags:
      - {motif: neck-from-fire-seizes-three, refs: ["Jāmiʿ 67:8656.1", "Jāmiʿ 67:8656.2"], note: "تخرج عنق من النار ... لها عينان تبصران، وأذنان تسمعان، ولسان ينطق يقول: إني وكلت بثلاثة: بكل جبار عنيد، وبكل من دعا مع الله إلها آخر، وبالمصورين"}
      - {motif: image-makers-among-the-three-seized-by-the-fire, refs: ["Jāmiʿ 67:8656.1"], note: "وبالمصورين (in Abu Sa'id's version the third is: وبمن قتل نفسا بغير نفس)"}
  - id: hadith-67-heat-of-hell
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Worldly fire is one part of seventy (or of a hundred) of hell's; the fire takes each by his deeds; it complains and is given two breaths"
    read: ["Jāmiʿ 67:8657.1-8658.2"]
    tags:
      - {motif: earthly-fire-one-seventieth-of-hell, refs: ["Jāmiʿ 67:8657.1"], note: "نار بني آدم التي يوقدون جزء من سبعين جزءا من نار جهنم ... إن كانت لكافية ... فضلت عليها بتسعة وستين جزءا"}
      - {motif: worldly-fire-one-hundredth-of-hell, refs: ["Jāmiʿ 67:8657.2"], note: "هذه النار جزء من مئة جزء من جهنم"}
      - {motif: fire-takes-each-to-ankles-knees-waist-collarbone, refs: ["Jāmiʿ 67:8658.1"], note: "منهم من تأخذه النار إلى كعبيه ... إلى ركبتيه ... إلى حجزته ... إلى ترقوته"}
      - {motif: fire-complains-granted-two-breaths, refs: ["Jāmiʿ 67:8658.2"], note: "اشتكت النار إلى ربها، فقالت: رب! أكل بعضي بعضا، فأذن لها بنفسين: نفس في الشتاء، ونفس في الصيف، فأشد ما تجدون من الحر وأشد ما تجدون من الزمهرير"}
  - id: hadith-67-food-and-drink-of-hell
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "A drop of Zaqqum; boiling water poured on the head passes through; the drinker of intoxicants given the mire of corruption"
    read: ["Jāmiʿ 67:8659.1-8660.1"]
    quran: ["44:43-48", "69:35-37", "88:4-7", "3:102"]
    tags:
      - {motif: drop-of-zaqqum-would-embitter-earth, refs: ["Jāmiʿ 67:8659.1"], note: "ولو أن قطرة من الزقوم قطرت لأمرت على أهل الأرض عيشهم، فكيف من ليس لهم طعام إلا الزقوم (Ibn Abbas, seated with a crooked staff while people circle the House, first recites 3:102)"}
      - {motif: boiling-water-poured-on-head, refs: ["Jāmiʿ 67:8659.2"], note: "إن الحميم ليصب على رؤوسهم، فينفذ الحميم حتى يخلص إلى جوفه"}
      - {motif: damned-restored-to-be-punished-again, refs: ["Jāmiʿ 67:8659.2"], note: "فيسلت ما في جوفه حتى يمرق من قدميه -وهو الصهر-، ثم يعاد كما كان"}
      - {motif: every-intoxicant-is-wine-and-forbidden, refs: ["Jāmiʿ 67:8659.3"], note: "شراب يشربونه بأرضهم من الذرة يقال له: المزر ... أو مسكر هو؟ قال: نعم ... كل مسكر حرام"}
      - {motif: intoxicant-drinker-given-mire-of-corruption, refs: ["Jāmiʿ 67:8659.3", "Jāmiʿ 67:8660.1"], note: "إن على الله عهدا لمن يشرب المسكر أن يسقيه من طينة الخبال ... عرق أهل النار، أو عصارة أهل النار"}
      - {motif: prayer-missed-drunk-four-times, refs: ["Jāmiʿ 67:8660.1"], note: "من ترك الصلاة سكرا مرة واحدة، فكأنما كانت له الدنيا وما عليها فسلبها، ومن ترك الصلاة سكرا أربع مرات، كان حقا على الله ﷿ أن يسقيه من طينة الخبال"}
  - id: hadith-67-fire-forbidden-to-the-sincere-confessor
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "The fire forbidden to whoever says 'no god but God' seeking God's face"
    read: ["Jāmiʿ 67:8661.1"]
    tags:
      - {motif: fire-forbidden-to-who-says-it-seeking-gods-face, refs: ["Jāmiʿ 67:8661.1"], note: "لن يوافي عبد يوم القيامة يقول: لا إله إلا الله يبتغي به وجه الله إلا حرم الله عليه النار"}
  - id: hadith-67-brought-out-of-the-fire
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Angels, prophets and martyrs intercede; believers miss those who prayed and fasted with them; the burnt are thrown in the water of life; four brought out"
    read: ["Jāmiʿ 67:8661.2-8662.1"]
    tags:
      - {motif: angels-prophets-martyrs-intercede-and-bring-out, refs: ["Jāmiʿ 67:8661.2"], note: "ثم يؤذن للملائكة والنبيين والشهداء أن يشفعوا، فيشفعون ويخرجون ... من كان في قلبه ما يزن ذرة من إيمان"}
      - {motif: believers-plead-for-brothers-who-prayed-with-them, refs: ["Jāmiʿ 67:8661.3"], note: "يفقد المؤمنون رجالا كانوا معهم في الدنيا يصلون بصلاتهم ... فيقولون: أي ربنا! عباد من عبادك ... لا نراهم؟ فيقول: اذهبوا إلى النار فمن وجدتم فيها منهم فأخرجوه"}
      - {motif: fire-takes-each-to-ankles-knees-waist-collarbone, refs: ["Jāmiʿ 67:8661.3"], note: "فمنهم من أخذته إلى قدميه ... ومنهم من أزرته، ومنهم من أخذته إلى ثدييه، ومنهم من أخذته إلى عنقه، ولم تغش الوجوه"}
      - {motif: burnt-thrown-in-river-of-life-sprout-like-seed, refs: ["Jāmiʿ 67:8661.3"], note: "فيطرحون في ماء الحياة. قيل: ... وما الحياة؟ قال: غسل أهل الجنة، فينبتون نبات الزرعة ... كما تنبت الزرعة في غثاء السيل"}
      - {motif: four-brought-out-one-asks-not-to-be-returned, refs: ["Jāmiʿ 67:8662.1"], note: "يخرج من النار أربعة، فيعرضون على الله، فيلتفت أحدهم، فيقول: أي رب! إذ أخرجتني منها فلا تعدني فيها، فينجيه الله منها"}
  - id: hadith-67-lightest-punishment
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "The lightest punishment: an ember under the instep, sandals of fire that boil the brain; Abu Talib in a shallow of fire"
    read: ["Jāmiʿ 67:8662.2-8664.2"]
    tags:
      - {motif: ember-under-instep-boils-brain, refs: ["Jāmiʿ 67:8662.2"], note: "لرجل توضع في أخمص قدميه جمرة يغلي منها دماغه"}
      - {motif: sandals-of-fire-make-brain-boil, refs: ["Jāmiʿ 67:8663.1", "Jāmiʿ 67:8663.2", "Jāmiʿ 67:8663.3"], note: "ينتعل بنعلين من نار يغلي دماغه من حرارة نعليه"}
      - {motif: lightest-punished-is-abu-talib, refs: ["Jāmiʿ 67:8663.2"], note: "أهون أهل النار عذابا أبو طالب وهو منتعل بنعلين يغلي منهما دماغه"}
      - {motif: uncle-in-shallows-of-fire-to-ankles, refs: ["Jāmiʿ 67:8664.1", "Jāmiʿ 67:8664.2"], note: "فيجعل في ضحضاح من نار يبلغ كعبيه يغلي منه دماغه ... لولا أنا لكان في الدرك الأسفل من النار ... وجدته في غمرات من النار فأخرجته إلى ضحضاح"}
  - id: hadith-67-ransom-of-the-earth
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "The damned would ransom himself with the earth's fill of gold; less was asked of him in Adam's loins"
    read: ["Jāmiʿ 67:8664.3-8665.1"]
    quran: ["5:36", "7:172"]
    tags:
      - {motif: earthful-of-gold-no-ransom, refs: ["Jāmiʿ 67:8664.3", "Jāmiʿ 67:8665.1"], note: "لو كان لك ملء الأرض ذهبا أكنت تفتدي به؟ فيقول: نعم، فيقال له: قد كنت سئلت ما هو أيسر من ذلك ... كذبت"}
      - {motif: less-asked-in-adams-loins-not-to-associate, refs: ["Jāmiʿ 67:8664.3"], note: "أردت منك أهون من هذا، وأنت في صلب آدم: أن لا تشرك بي شيئا، فأبيت إلا أن تشرك بي"}
  - id: hadith-67-dream-tour-of-punishments
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "In a dream two men lead the prophet up a rugged mountain past the howling of hell and punishments fitted to sins"
    read: ["Jāmiʿ 67:8665.2"]
    tags:
      - {motif: two-men-lead-dreamer-up-rugged-mountain, refs: ["Jāmiʿ 67:8665.2"], note: "إذ أتاني رجلان فأخذا بضبعي فأتيا بي جبلا وعرا فقالا لي: اصعد ... هذا عواء أهل النار"}
      - {motif: early-fast-breakers-hung-by-hamstrings-mouths-torn, refs: ["Jāmiʿ 67:8665.2"], note: "بقوم معلقين بعراقيبهم مشققة أشداقهم تسيل أشداقهم دما ... الذين يفطرون قبل تحلة صومهم"}
      - {motif: adulterers-most-swollen-and-stinking, refs: ["Jāmiʿ 67:8665.2"], note: "بقوم أشد شيء انتفاخا وأنتنه ريحا وأسوئه منظرا ... الزانون والزواني"}
      - {motif: snakes-bite-breasts-of-women-who-withheld-milk, refs: ["Jāmiʿ 67:8665.2"], note: "بنساء تنهشن ثديهن الحيات ... هؤلاء يمنعن أولادهن ألبانهن"}
    hints:
      - "Sinners hung up by a body part and punished by the member that sinned, seen on a guided tour: compare the Apocalypse of Peter (Akhmim 22-24: blasphemers hung by their tongues, adulteresses hung by their hair) and the Apocalypse of Paul 31-42."
  - id: hadith-67-size-of-the-damned
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "The unbeliever enlarged in the fire: a molar like Uhud, skin forty-two cubits, shoulders three days' ride, a seat as far as Mecca from Medina"
    read: ["Jāmiʿ 67:8666.1-8668.1"]
    quran: ["4:56", "39:67"]
    tags:
      - {motif: unbelievers-molar-like-uhud-skin-three-days, refs: ["Jāmiʿ 67:8666.1", "Jāmiʿ 67:8666.3", "Jāmiʿ 67:8666.4", "Jāmiʿ 67:8666.5", "Jāmiʿ 67:8667.1", "Jāmiʿ 67:8667.2"], note: "ضرس الكافر -أو ناب الكافر- مثل أحد، وغلظ جلده مسيرة ثلاث"}
      - {motif: unbelievers-shoulders-three-days-fast-ride-apart, refs: ["Jāmiʿ 67:8666.2"], note: "ما بين منكبي الكافر في النار مسيرة ثلاثة أيام للراكب المسرع"}
      - {motif: unbelievers-skin-forty-two-cubits-by-the-jabbars-cubit, refs: ["Jāmiʿ 67:8666.3", "Jāmiʿ 67:8666.5", "Jāmiʿ 67:8667.1"], note: "إن غلظ جلد الكافر اثنان وأربعون ذراعا ... وكثافة جلده اثنان وأربعون ذراعا بذراع الجبار (variant: وعرض جلده سبعون ذراعا)"}
      - {motif: unbelievers-seat-in-fire-as-mecca-to-medina, refs: ["Jāmiʿ 67:8666.3", "Jāmiʿ 67:8666.4", "Jāmiʿ 67:8666.5", "Jāmiʿ 67:8667.1"], note: "وإن مجلسه من جهنم كما بين مكة والمدينة ... ومقعده من النار مسيرة ثلاث مثل الربذة ... كما بين قديد ومكة؛ وفخذه مثل البيضاء / ورقان"}
      - {motif: earlobe-to-shoulder-seventy-autumns-valleys-of-pus, refs: ["Jāmiʿ 67:8668.1"], note: "إن بين شحمة أذن أحدهم وبين عاتقه مسيرة سبعين خريفا، تجري فيها أودية القيح والدم، قلت: أنهارا؟ قال: لا، بل أودية"}
      - {motif: people-on-the-bridge-when-earth-changed, refs: ["Jāmiʿ 67:8668.1"], note: "سألت رسول الله ﷺ عن قوله: ﴿والأرض جميعا قبضته يوم القيامة﴾ فأين الناس يومئذ؟ قال: هم على جسر جهنم"}
  - id: hadith-67-amr-bin-luhayy
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Amr b. Luhayy, first to free beasts to the idols, drags his guts in the fire; Aktham resembles him"
    read: ["Jāmiʿ 67:8668.2-8669.2"]
    tags:
      - {motif: amr-b-luhayy-drags-guts-in-fire, refs: ["Jāmiʿ 67:8668.2", "Jāmiʿ 67:8668.3", "Jāmiʿ 67:8669.1", "Jāmiʿ 67:8669.2"], note: "رأيت عمرو بن عامر الخزاعي يجر قصبه في النار، كان أول من سيب السوائب ... وغير عهد إبراهيم"}
      - {motif: hell-crushing-itself, refs: ["Jāmiʿ 67:8668.2"], note: "رأيت جهنم يحطم بعضه بعضا"}
      - {motif: lookalike-of-the-damned-not-harmed, refs: ["Jāmiʿ 67:8669.2"], note: "وأشبه من رأيت به أكثم بن الجون. قال: فقال أكثم: يا رسول الله أيضرني شبهه؟ قال: لا، إنك مسلم وهو كافر"}
  - id: hadith-67-hypocrites-and-apostates
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Twelve hypocrites who will not smell paradise; companions led off to the fire for turning back"
    read: ["Jāmiʿ 67:8669.3-8669.4"]
    quran: ["4:138", "4:140", "4:145", "9:68"]
    tags:
      - {motif: twelve-hypocrites-among-companions, refs: ["Jāmiʿ 67:8669.3"], note: "إن في أمتي اثنا عشر منافقا لا يدخلون الجنة، ولا يجدون ريحها، حتى يلج الجمل في سم الخياط"}
      - {motif: ulcer-of-fire-emerging-from-chest, refs: ["Jāmiʿ 67:8669.3"], note: "ثمانية منهم تكفيكهم الدبيلة، سراج من النار يظهر في أكتافهم، حتى ينجم من صدورهم"}
      - {motif: companions-taken-to-the-left-as-apostates, refs: ["Jāmiʿ 67:8669.4"], note: "إذا زمرة حتى إذا عرفتهم خرج رجل من بيني وبينهم، فقال: هلم ... إلى النار والله ... إنهم ارتدوا بعدك على أدبارهم القهقرى"}
      - {motif: saved-only-as-few-as-stray-cattle, refs: ["Jāmiʿ 67:8669.4"], note: "فلا أراه يخلص منهم إلا مثل همل النعم"}
  - id: hadith-67-woman-and-cat-and-eclipse-visions
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "A woman in the fire for a cat she starved; the eclipse-prayer visions of the fire and paradise"
    read: ["Jāmiʿ 67:8670.1-8671.2"]
    tags:
      - {motif: woman-in-fire-for-starving-a-cat, refs: ["Jāmiʿ 67:8670.1", "Jāmiʿ 67:8670.2", "Jāmiʿ 67:8670.3", "Jāmiʿ 67:8671.1", "Jāmiʿ 67:8671.2"], note: "عذبت امرأة في هرة سجنتها حتى ماتت ... لا هي أطعمتها ولا سقتها ... ولا هي تركتها تأكل من خشاش الأرض"}
      - {motif: cat-claws-its-tormentor-in-hell, refs: ["Jāmiʿ 67:8671.2"], note: "فرأيت فيها الحميرية السوداء صاحبة الهرة ... فرأيتها كلما أدبرت نهشت في النار"}
      - {motif: cat-woman-israelite-or-himyarite, refs: ["Jāmiʿ 67:8670.3", "Jāmiʿ 67:8671.2"], note: "امرأة من بني إسرائيل تعذب في هرة لها (variant: امرأة حميرية سوداء طويلة)"}
      - {motif: amr-b-luhayy-drags-guts-in-fire, refs: ["Jāmiʿ 67:8670.3"], note: "ورأيت أبا ثمامة عمرو بن مالك يجر قصبه في النار"}
      - {motif: grape-cluster-of-paradise-reached-for, refs: ["Jāmiʿ 67:8670.3", "Jāmiʿ 67:8671.1", "Jāmiʿ 67:8671.2"], note: "فعرضت علي الجنة، حتى لو تناولت منها قطفا أخذته ... فقصرت يدي عنه"}
      - {motif: prophet-steps-back-from-heat-of-fire-in-prayer, refs: ["Jāmiʿ 67:8671.1"], note: "لقد جيء بالنار، وذلكم حين رأيتموني تأخرت، مخافة أن يصيبني من لفحها"}
      - {motif: pilgrim-thief-with-crooked-staff-in-fire, refs: ["Jāmiʿ 67:8671.1", "Jāmiʿ 67:8671.2"], note: "صاحب المحجن يجر قصبه في النار، كان يسرق الحاج بمحجنه، فإن فطن له قال: إنما تعلق بمحجني ... فرأيته في النار على محجنه متوكئا"}
      - {motif: thief-of-sacrificial-camels-driven-with-forked-stick, refs: ["Jāmiʿ 67:8671.2"], note: "ورأيت فيها صاحب بدنتي رسول الله ﷺ أخا دعدع، يدفع في النار بقضيبين ذي شعبتين"}
      - {motif: did-you-not-promise-not-to-punish-them-while-i-am-among-them, refs: ["Jāmiʿ 67:8671.2"], note: "فجعلت أقول: ألم تعدني أن لا تعذبهم وأنا فيهم، رب ألم تعدني أن لا تعذبهم وهم يستغفرونك"}
  - id: hadith-67-women-most-of-the-fire
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Women shown as most of the fire for ingratitude to husbands; give alms even from your jewellery; the corrupt are women"
    read: ["Jāmiʿ 67:8672.1-8674.1"]
    tags:
      - {motif: women-most-of-fire-for-ingratitude-to-husband, refs: ["Jāmiʿ 67:8672.1", "Jāmiʿ 67:8673.1", "Jāmiʿ 67:8673.2", "Jāmiʿ 67:8673.3", "Jāmiʿ 67:8673.4"], note: "أريت النار فإذا أكثر أهلها النساء، يكفرن ... يكفرن العشير، ويكفرن الإحسان، لو أحسنت إلى إحداهن الدهر، ثم رأت منك شيئا، قالت: ما رأيت منك خيرا قط"}
      - {motif: women-told-give-alms-even-from-jewellery, refs: ["Jāmiʿ 67:8672.2", "Jāmiʿ 67:8673.1", "Jāmiʿ 67:8673.3", "Jāmiʿ 67:8673.4"], note: "يا معشر النساء! تصدقن، ولو من حليكن؛ فإنكن أكثر أهل جهنم يوم القيامة ... فإن أكثركن حطب جهنم"}
      - {motif: feast-prayer-before-sermon-no-adhan-no-iqama, refs: ["Jāmiʿ 67:8673.3"], note: "فبدأ بالصلاة قبل الخطبة بغير أذان ولا إقامة، ثم قام متوكئا على بلال ... ثم مضى حتى أتى النساء"}
      - {motif: women-deficient-in-intellect-and-religion, refs: ["Jāmiʿ 67:8673.4"], note: "وما رأيت ناقصات عقل ودين أغلب للب الرجال منكن"}
      - {motif: the-corrupt-are-women-ungrateful-and-impatient, refs: ["Jāmiʿ 67:8674.1"], note: "إن الفساق هم أهل النار. قيل: ... ومن الفساق؟ قال: النساء ... إذا أعطين لم يشكرن، وإذا ابتلين لم يصبرن"}
  - id: hadith-67-ransom-from-the-fire
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "A Jew or Christian given to each Muslim as his ransom from the fire; each has a home in paradise and in the fire"
    read: ["Jāmiʿ 67:8674.2-8675.1"]
    quran: ["23:10"]
    tags:
      - {motif: jew-or-christian-as-muslims-ransom-from-fire, refs: ["Jāmiʿ 67:8674.2", "Jāmiʿ 67:8674.3", "Jāmiʿ 67:8674.4"], note: "دفع الله ﷿ إلى كل مسلم يهوديا أو نصرانيا، فيقول: هذا فكاكك من النار ... يغفرها الله لهم ويضعها على اليهود والنصارى"}
      - {motif: every-person-has-seat-in-paradise-and-fire, refs: ["Jāmiʿ 67:8675.1"], note: "ما منكم من أحد إلا له منزلان: منزل في الجنة ومنزل في النار. فإذا مات فدخل النار، ورث أهل الجنة منزله"}
    hints:
      - "The sinner's place filled by another, each person having a share in paradise and in Gehenna that the righteous inherits: compare b. Hagigah 15a (the righteous takes his own portion and his fellow's portion in the Garden; the wicked his own and his fellow's in Gehenna)."
  - id: hadith-67-paradise-and-hell-surrounded
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "God's punishment and mercy; paradise ringed with hardships, the fire with desires; Gabriel sent to look at both"
    read: ["Jāmiʿ 67:8676.1-8676.4"]
    tags:
      - {motif: unbeliever-would-not-despair-believer-not-feel-safe, refs: ["Jāmiʿ 67:8676.1"], note: "لو يعلم المؤمن ما عند الله من العقوبة، ما طمع بجنته أحد، ولو يعلم الكافر ما عند الله من الرحمة، ما قنط من جنته أحد"}
      - {motif: paradise-ringed-with-hardships-hell-with-desires, refs: ["Jāmiʿ 67:8676.2", "Jāmiʿ 67:8676.3", "Jāmiʿ 67:8676.4"], note: "حفت الجنة بالمكاره، وحفت النار بالشهوات ... حجبت النار بالشهوات"}
      - {motif: gabriel-sent-to-inspect-paradise-and-hell, refs: ["Jāmiʿ 67:8676.4"], note: "لما خلق الله الجنة والنار أرسل جبريل إلى الجنة، فقال: انظر إليها، وإلى ما أعددت لأهلها فيها"}
      - {motif: none-will-enter-none-will-escape, refs: ["Jāmiʿ 67:8676.4"], note: "وعزتك لقد خفت أن لا يدخلها أحد ... وعزتك لقد خشيت أن لا ينجو منها أحد إلا دخلها"}
  - id: hadith-67-ramadan-gates
