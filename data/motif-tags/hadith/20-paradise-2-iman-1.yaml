      - {motif: your-father-is-hudhafa, refs: ["Jāmiʿ 67:8678.3"], note: "فقام عبد الله بن حذافة، فقال: من أبي يا رسول الله؟ قال: أبوك حذافة"}
      - {motif: man-asking-his-entrance-told-the-fire, refs: ["Jāmiʿ 67:8678.3"], note: "فقام إليه رجل: فقال: أين مدخلي يا رسول الله؟ قال: النار"}
      - {motif: paradise-and-fire-shown-beyond-the-wall, refs: ["Jāmiʿ 67:8678.3"], note: "لقد عرضت علي الجنة والنار آنفا في عرض هذا الحائط وأنا أصلي، فلم أر كاليوم في الخير والشر"}
      - {motif: umar-kneels-content-with-god-islam-muhammad, refs: ["Jāmiʿ 67:8678.3"], note: "فبرك عمر على ركبتيه، فقال: رضينا بالله ربا، وبالإسلام دينا، وبمحمد ﷺ رسولا ... فسكت رسول الله ﷺ"}
  - id: hadith-67-room-left-in-paradise
