      - {motif: every-person-has-seat-in-paradise-and-fire, refs: ["Jāmiʿ 67:8677.4"], note: "ما من أحد إلا وله منزل في الجنة، ومنزل في النار، فالكافر يرث المؤمن منزله من النار، والمؤمن يرث الكافر منزله من الجنة"}
      - {motif: one-dip-erases-memory-of-life, refs: ["Jāmiʿ 67:8678.1"], note: "يؤتى بأنعم أهل الدنيا من أهل النار ... فيصبغ في النار صبغة ... هل رأيت خيرا قط؟ ... لا، والله! يا رب"}
      - {motif: paradise-and-fire-nearer-than-sandal-strap, refs: ["Jāmiʿ 67:8678.2"], note: "الجنة أقرب إلى أحدكم من شراك نعله، والنار مثل ذلك"}
    hints:
      - "Each soul has a place in both paradise and Gehenna, and the righteous takes the wicked man's place in the Garden: b. Hagigah 15a."
  - id: hadith-67-ask-me-and-the-wall
