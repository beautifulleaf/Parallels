  - id: hadith-67-weak-and-tyrants
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Paradise and the fire dispute; the weak to paradise, the coarse and proud to the fire; the sermon of Iyad b. Himar"
    read: ["Jāmiʿ 67:8683.1-8686.1"]
    tags:
      - {motif: paradise-and-fire-dispute, refs: ["Jāmiʿ 67:8683.1", "Jāmiʿ 67:8683.2", "Jāmiʿ 67:8683.4"], note: "تحاجت الجنة والنار، فقالت النار: أوثرت بالمتكبرين والمتجبرين، وقالت الجنة: فما لي لا يدخلني إلا ضعفاء الناس وسقطهم وغرتهم؟ ... إنما أنت رحمتي ... إنما أنت عذابي"}
      - {motif: lord-sets-foot-hell-says-enough, refs: ["Jāmiʿ 67:8683.1", "Jāmiʿ 67:8683.2"], note: "فأما النار فلا تمتلئ حتى يضع الله ﵎ رجله، تقول: قط قط قط"}
      - {motif: god-creates-new-people-for-paradises-surplus, refs: ["Jāmiʿ 67:8683.1", "Jāmiʿ 67:8683.2"], note: "وأما الجنة فإن الله ينشئ لها خلقا (in the Bukhari wording of 8683.2: وإنه ينشئ للنار من يشاء)"}
      - {motif: weak-of-paradise-coarse-of-hell, refs: ["Jāmiʿ 67:8683.3", "Jāmiʿ 67:8684.2", "Jāmiʿ 67:8685.1", "Jāmiʿ 67:8685.2", "Jāmiʿ 67:8685.3", "Jāmiʿ 67:8685.4"], note: "كل ضعيف متضعف، لو أقسم على الله لأبره ... كل عتل جواظ مستكبر ... كل جعظري جواظ مستكبر جماع مناع"}
      - {motif: servants-created-hanif-devils-led-them-off, refs: ["Jāmiʿ 67:8684.1"], note: "وإني خلقت عبادي حنفاء كلهم، وإنهم أتتهم الشياطين فاجتالتهم عن دينهم"}
      - {motif: book-not-washed-away-by-water-read-asleep-and-awake, refs: ["Jāmiʿ 67:8684.1"], note: "وأنزلت عليك كتابا لا يغسله الماء، تقرؤه نائما ويقظان"}
      - {motif: god-loathed-earth-but-remnants-of-scripture-people, refs: ["Jāmiʿ 67:8684.1"], note: "وإن الله نظر إلى أهل الأرض، فمقتهم عربهم وعجمهم إلا بقايا من أهل الكتاب"}
      - {motif: ordered-to-burn-quraysh-head-made-into-bread, refs: ["Jāmiʿ 67:8684.1"], note: "إن الله أمرني أن أحرق قريشا، فقلت: رب إذا يثلغوا رأسي فيدعوه خبزة، قال: استخرجهم كما استخرجوك ... وابعث جيشا نبعث خمسة مثله"}
      - {motif: three-people-of-paradise-five-of-the-fire, refs: ["Jāmiʿ 67:8684.1"], note: "وأهل الجنة ثلاثة: ذو سلطان مقسط متصدق موفق، ورجل رحيم رقيق القلب ... وعفيف متعفف ذو عيال ... وأهل النار خمسة: الضعيف الذي لا زبر له ... والخائن ... ورجل يخادعك عن أهلك ومالك ... والشنظير الفحاش"}
      - {motif: fire-forbidden-to-the-near-gentle-easy, refs: ["Jāmiʿ 67:8686.1"], note: "ألا أخبركم بمن يحرم على النار أو بمن تحرم عليه النار، على كل قريب هين سهل"}
  - id: hadith-67-two-words-in-the-scale
