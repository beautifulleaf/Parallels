      - {motif: death-as-ram-slaughtered-between-paradise-and-hell, refs: ["Jāmiʿ 67:8680.1", "Jāmiʿ 67:8680.3", "Jāmiʿ 67:8681.2", "Jāmiʿ 67:8681.3"], note: "يؤتى بالموت كهيئة كبش أملح ... هل تعرفون هذا؟ فيقولون: نعم، هذا الموت، وكلهم قد رآه ... فيذبح"}
      - {motif: herald-eternity-no-death, refs: ["Jāmiʿ 67:8680.1", "Jāmiʿ 67:8680.2", "Jāmiʿ 67:8680.3", "Jāmiʿ 67:8681.1", "Jāmiʿ 67:8681.2", "Jāmiʿ 67:8681.3"], note: "يا أهل الجنة لا موت، ويا أهل النار لا موت، كل خالد فيما هو فيه ... خلود فلا موت"}
      - {motif: death-led-by-collar-to-the-wall-between, refs: ["Jāmiʿ 67:8681.2"], note: "أتي بالموت ملببا فيوقف على السور الذي بين أهل الجنة وأهل النار، ثم يقال: يا أهل الجنة فيطلعون خائفين ... يا أهل النار فيطلعون مستبشرين يرجون الشفاعة"}
  - id: hadith-67-the-two-necessities
