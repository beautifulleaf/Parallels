      - {motif: wound-stanched-with-burnt-mat, refs: ["Jāmiʿ 48:5299.5"], note: "فاطمة تغسله، وعليّ يسكب الماء بالمجنّ ... أخذت قطعة من حصير فأحرقتها وألصقتها، فاستمسك الدم"}
      - {motif: seventy-volunteer-to-pursue, refs: ["Jāmiʿ 48:5300.1"], note: "الذين استجابوا لله والرسول من بعد ما أصابهم القرح ... من يذهب في إثرهم؟ فانتدب منهم سبعون رجلًا"}
