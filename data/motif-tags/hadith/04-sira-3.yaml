  - id: hadith-48-ifk
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "The hadith of the lie (ifk) against Aisha"
    read: ["Jāmiʿ 48:5322.1"]
    quran: ["12:18", "24:11-20", "24:22"]
    tags:
      - {motif: lots-cast-among-wives-for-journey, refs: ["Jāmiʿ 48:5322.1"], note: "إذا أراد سفرًا أقرع بين أزواجه، فأيهن خرج سهمها، خرج بها"}
      - {motif: lost-necklace-left-behind-by-caravan, refs: ["Jāmiʿ 48:5322.1"], note: "فإذا عقد لي من جزع ظفار قد انقطع ... فلم يستنكر القوم خفة الهودج ... فجئت منازلهم وليس بها منهم داع ولا مجيب"}
      - {motif: rear-guard-finds-her-says-only-inna-lillah, refs: ["Jāmiʿ 48:5322.1"], note: "فاستيقظت باسترجاعه حين عرفني ... والله ما تكلمنا بكلمة ... فانطلق يقود بي الراحلة"}
      - {motif: slander-affair-ifk, refs: ["Jāmiʿ 48:5322.1"], note: "فهلك فيّ من هلك ... إن الذين جاءوا بالإفك عصبة منكم العشر الآيات"}
      - {motif: one-who-took-the-greater-part, refs: ["Jāmiʿ 48:5322.1"], note: "وكان الذي تولى كبر الإفك عبد الله بن أبي ابن سلول"}
      - {motif: husbands-coolness-in-illness, refs: ["Jāmiʿ 48:5322.1"], note: "لا أعرف من رسول الله ﷺ اللطف الذي كنت أرى منه حين أشتكي ... كيف تيكم؟ ثم ينصرف"}
      - {motif: news-learned-from-woman-stumbling, refs: ["Jāmiʿ 48:5322.1"], note: "فعثرت أم مسطح في مرطها فقالت: تعس مسطح ... أتسبين رجلًا شهد بدرًا؟"}
      - {motif: counsellors-divided-and-maid-questioned, refs: ["Jāmiʿ 48:5322.1"], note: "أهلك ولا نعلم إلا خيرًا ... والنساء سواها كثير، وسل الجارية تصدقك ... تنام عن عجين أهلها، فتأتي الداجن فتأكله"}
      - {motif: tribes-near-fighting-in-the-mosque, refs: ["Jāmiʿ 48:5322.1"], note: "من يعذرني من رجل قد بلغني عنه أذاه في أهلي ... فثار الحيان الأوس والخزرج حتى هموا أن يقتتلوا"}
      - {motif: confess-and-repent-or-be-cleared, refs: ["Jāmiʿ 48:5322.1"], note: "فإن كنت بريئة، فسيبرئك الله، وإن كنت ألممت بذنب، فاستغفري الله وتوبي إليه، فإن العبد إذا اعترف ثم تاب تاب الله عليه"}
      - {motif: accused-wife-likens-herself-to-jacob, refs: ["Jāmiʿ 48:5322.1"], note: "فوالله لا أجد لي ولكم مثلًا إلا أبا يوسف حين قال: فصبر جميل والله المستعان على ما تصفون"}
      - {motif: jacob-beautiful-patience, refs: ["Jāmiʿ 48:5322.1"], note: "فصبر جميل والله المستعان على ما تصفون"}
      - {motif: hoped-for-a-dream-not-a-recited-verse, refs: ["Jāmiʿ 48:5322.1"], note: "ما كنت أظن أن الله منزل في شأني وحيًا يتلى ... ولكن كنت أرجو أن يرى رسول الله ﷺ في النوم رؤيا يبرئني الله بها"}
      - {motif: revelation-sweat-like-pearls-in-winter, refs: ["Jāmiʿ 48:5322.1"], note: "فأخذه ما كان يأخذه من البرحاء، حتى إنه ليتحدر منه من العرق مثل الجمان وهو في يوم شات"}
      - {motif: i-praise-only-god, refs: ["Jāmiʿ 48:5322.1"], note: "قومي إليه. فقلت: والله لا أقوم إليه، فإني لا أحمد إلا الله"}
      - {motif: stopped-maintenance-restored-by-verse, refs: ["Jāmiʿ 48:5322.1"], note: "والله لا أنفق على مسطح شيئًا أبدًا ... ولا يأتل أولو الفضل منكم ... فرجع إلى مسطح النفقة"}
      - {motif: rival-co-wife-protected-by-piety, refs: ["Jāmiʿ 48:5322.1"], note: "أحمي سمعي وبصري، والله ما علمت إلا خيرًا ... وهي التي كانت تساميني ... فعصمها الله بالورع"}
      - {motif: accused-man-never-uncovered-a-woman, refs: ["Jāmiʿ 48:5322.1"], note: "سبحان الله فوالذي نفسي بيده ما كشفت من كنف أنثى قط ... ثم قتل بعد ذلك في سبيل الله"}
    hints:
      - "A wife suspected without witnesses, her case settled by divine decision rather than human proof, against Num 5:11-31, the ordeal of the sotah - here the clearing comes by revealed verses (Q 24:11-20) and not by ordeal."
