  - id: hadith-48-nadir
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "The fay' of al-Nadir; the burning of the palms; 'we are not inherited'; the plot and the exile"
    read: ["Jāmiʿ 48:5316.1-5318.1"]
    quran: ["59:1-6", "59:5", "59:6"]
    tags:
      - {motif: fay-revenue-kept-for-a-years-food, refs: ["Jāmiʿ 48:5316.1", "Jāmiʿ 48:5317.1"], note: "مما لم يوجف المسلمون عليه بخيل ولا ركاب ... ينفق على أهله منها نفقة سنته، ثم يجعل ما بقي في السلاح والكراع"}
      - {motif: jews-of-medina-expelled, refs: ["Jāmiʿ 48:5316.2"], note: "فأجلى بني النضير، وأقر قريظة ... وأجلى يهود المدينة كلهم، بني قينقاع ... ويهود بني حارثة"}
      - {motif: palm-trees-cut-by-gods-leave, refs: ["Jāmiʿ 48:5316.3", "Jāmiʿ 48:5316.4"], note: "حرق النبي ﷺ نخل بني النضير - وقطع وهي البويرة - فنزلت: ما قطعتم من لينة"}
      - {motif: poem-of-the-burning-at-buwayra, refs: ["Jāmiʿ 48:5316.4"], note: "وهان على سراة بني لؤي ... حريق بالبويرة مستطير"}
      - {motif: we-are-not-inherited, refs: ["Jāmiʿ 48:5317.1"], note: "لا نورث، ما تركنا صدقة ... تسألني نصيبك من ابن أخيك ... نصيب امرأته من أبيها"}
      - {motif: thirty-rabbis-then-three, refs: ["Jāmiʿ 48:5318.1"], note: "اخرج إلينا في ثلاثين رجلًا ... ولنخرج في ثلاثين حبرًا ... اخرج في ثلاثة ... واشتملوا على الخناجر ... فأرسلت امرأة ناصحة من بني النضير إلى بني أخيها"}
      - {motif: houses-demolished-for-their-timber, refs: ["Jāmiʿ 48:5318.1"], note: "واحتملوا ما أقلت إبل من أمتعتهم، وأبواب بيوتهم، وخشبها، فكانوا يخربون بيوتهم"}
      - {motif: exile-first-gathering-to-sham, refs: ["Jāmiʿ 48:5318.1"], note: "وكان جلاؤهم ذلك أول حشر الناس إلى الشام وكان بنو النضير من سبط من أسباط بني إسرائيل، لم يصبهم جلاء منذ كتب الله على بني إسرائيل الجلاء"}
    hints:
      - "Burning and felling the besieged tribe's palms, permitted by the verse 'by God's leave', against Deut 20:19-20, the ban on cutting fruit trees in a siege."
      - "'Of a tribe of Israel never exiled since God decreed exile (al-jala') on Israel' against Deut 28:64 and 2 Kgs 17:6 / 25:11, the decreed dispersion."
