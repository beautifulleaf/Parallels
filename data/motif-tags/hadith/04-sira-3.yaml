# Hadith full read, chunk 4: al-Jāmiʿ al-Kāmil, book 48 (sīra), Shamela pages 5203-5322
# (printed 8/183-8/302): Badr from the consultation to its aftermath, the events between Badr and
# Uhud (Qaynuqa', Ka'b b. al-Ashraf, Abu Rafi'), Uhud, al-Raji', Bi'r Ma'una, al-Nadir, and the
# opening of al-Muraysi' (the ifk hadith, which runs on to p. 5326).
new_motifs:
  consulted-army-would-ride-into-the-sea: {label: "Asked for counsel before battle, a chief of the helpers says that if commanded they would plunge their mounts into the sea or drive them to Bark al-Ghimad", cluster: warfare}
  not-like-israel-to-moses-go-you-and-your-lord: {label: "The companions vow not to say what the Israelites said to Moses, 'go you and your Lord and fight, we will sit here', but to fight on his right and left, before and behind", cluster: warfare}
  captive-beaten-for-truth-left-for-lie: {label: "A captured water-carrier is beaten when he tells the truth (Abu Jahl's army) and left alone when he lies (Abu Sufyan's caravan); the praying prophet rebukes them", cluster: warfare}
  dates-thrown-away-to-hasten-martyrdom: {label: "Promised a paradise as wide as heaven and earth, a fighter eats from his dates, says living to finish them would be too long a life, throws them away and fights until killed", cluster: warfare}
  camel-bells-cut-before-battle: {label: "The prophet orders the bells cut from the camels' necks on the day of battle", cluster: warfare}
  prayer-if-this-band-perishes-you-will-not-be-worshipped: {label: "Battle prayer: 'O God, if this band (al-'isaba, al-fi'a) perishes, you will not be worshipped on earth'", cluster: warfare}
  prophet-weeps-in-prayer-all-night-before-battle: {label: "On the night before battle all sleep but the prophet, who prays under a tree weeping until morning", cluster: ritual}
  army-number-three-hundred-and-ten-odd: {label: "The believers at the battle number three hundred and ten-odd (313, 315, 317 or 319) against a thousand", cluster: warfare}
  prayer-for-barefoot-naked-hungry-army: {label: "'O God, they are barefoot, carry them; naked, clothe them; hungry, fill them' - each returns with a camel or two, clothed and fed", cluster: warfare}
  three-men-to-a-camel-prophet-takes-his-turn: {label: "Three men share each camel; the prophet refuses to let his two companions walk for him: 'you are no stronger than I, nor am I less in need of the reward'", cluster: warfare}
  only-two-horses-in-the-army: {label: "The believers had only two horses at the battle (al-Zubayr's and al-Miqdad's); al-Miqdad the only horseman", cluster: warfare}
  boys-turned-back-as-too-young: {label: "Boys are judged too young (ustusghira) to fight; one weeps, is allowed, and is killed", cluster: warfare}
  oath-to-enemy-kept-by-not-fighting: {label: "Two men caught by the enemy swear by God not to fight with the prophet; he sends them home: 'we will keep their covenant and seek God's help against them'", cluster: law}
  enemy-counted-by-camels-slaughtered: {label: "A captive will not give the enemy's number; asked how many camels they slaughter a day, 'ten' - 'they are a thousand, a camel for each hundred'", cluster: warfare}
  prophet-nearest-the-enemy: {label: "The companions took shelter behind the prophet, who was nearest of them to the enemy and fiercest in battle", cluster: warfare}
  scars-of-battle-fingered-by-a-child: {label: "A fighter's sword-wounds on his shoulder are deep enough for his small son to put his fingers in them in play", cluster: warfare}
  notched-sword-valued-in-thousands: {label: "A hero's sword bears a notch from the battle; his sons value it at three thousand", cluster: warfare}
  first-to-kneel-in-dispute-before-god: {label: "'I will be the first to kneel (yajthu) before the Merciful for the dispute on the day of resurrection' - said of the first duel", cluster: eschatology}
  three-against-three-duel-before-battle: {label: "Before the battle three enemy kinsmen (father, brother, son) call for single combat, refuse three young helpers and demand their cousins; three of the prophet's kin go out", cluster: warfare}
  two-disputants-verse-of-the-duellists: {label: "'These are two disputants who disputed about their Lord' (Q 22:19) said to be revealed of the three-against-three duel", cluster: warfare}
  shoot-when-they-come-close-spare-arrows: {label: "'When they come near you, shoot them, and spare your arrows'", cluster: warfare}
  battle-prayer-till-cloak-falls: {label: "Facing the qibla with hands stretched, the prophet cries to his Lord until his cloak falls from his shoulders; Abu Bakr replaces it and holds him from behind: 'enough of your adjuring'", cluster: warfare}
  angel-horseman-cries-aqdim-hayzum: {label: "A fighter hears a whip-crack above him and a horseman's voice 'Forward, Hayzum!'; the enemy before him falls with nose slit and face split as by a whip, the mark turned green", cluster: angels}
  help-from-the-third-heaven: {label: "The angelic help at the battle is called 'help of the third heaven'", cluster: angels}
  seventy-killed-seventy-captured: {label: "Seventy of the enemy were killed and seventy captured", cluster: warfare}
  captor-was-an-unseen-angel: {label: "A captive says his captor was not the short helper but a bald-fronted handsome man on a piebald horse whom he cannot see among them: 'God aided you with a noble angel'", cluster: angels}
  angels-who-fought-are-the-best-angels: {label: "Gabriel asks how they rank the men of the battle; 'among the best Muslims' - 'so are the angels who were present'", cluster: angels}
  gabriel-holds-his-horses-head-armed: {label: "'This is Gabriel holding his horse's head, wearing the gear of war'", cluster: angels}
  gabriel-michael-israfil-in-battle: {label: "Gabriel is with one companion, Michael with the other, and Israfil, a great angel, attends the battle", cluster: angels}
  gabriel-turbaned-dust-on-teeth: {label: "Waking from a nap in the booth: 'Gabriel, turbaned, leading his horse by the reins, dust on its front teeth'", cluster: angels}
  handful-of-pebbles-shahat-al-wujuh: {label: "The prophet throws a handful of pebbles or dust at the enemy saying 'Shahat al-wujuh' (may the faces be disfigured); every eye, nostril and mouth is filled and they turn in flight", cluster: warfare}
  sound-of-pebble-falling-in-basin: {label: "On the day of battle a sound falls from heaven to earth like a pebble dropped in a basin; the pebbles are thrown and the enemy flees", cluster: warfare}
  sword-drops-from-hand-in-drowsiness: {label: "Overcome by drowsiness in the ranks, a fighter's sword keeps falling from his hand and he picks it up", cluster: warfare}
  enemy-asks-god-to-destroy-the-cutter-of-kin: {label: "The enemy leader prays as the armies meet: 'whichever of us cuts kinship most and brings what is unknown, destroy him this morning' - and so he asked for the judgement (istaftah)", cluster: warfare}
  man-on-red-camel-counsels-retreat: {label: "A chief on a red camel urges his side to turn back and lay the cowardice on his head; 'if any among them commands good it is the man on the red camel'", cluster: warfare}
  insult-musaffir-istihi: {label: "Taunted as a coward, the chief replies 'is it me you shame, you with saffron-dyed rump (musaffir istihi)?'", cluster: warfare}
  two-youths-kill-the-tyrant: {label: "Two young helpers ask an elder to point out the enemy chief who reviles the prophet, run at him and kill him; their swords are inspected: 'both of you killed him'", cluster: warfare}
  dying-tyrant-asks-is-there-greater-than-a-man-you-killed: {label: "Found dying, the enemy chief says 'Is there anyone greater than a man you have killed (or whom his own people killed)?' and 'if only other than a farmer had killed me'", cluster: warfare}
  spear-in-eye-of-armoured-foe-passes-to-caliphs: {label: "A fully armoured enemy showing only his eyes is speared in the eye; the bent spear passes from the prophet to each caliph in turn", cluster: warfare}
  refuses-name-al-rahman-calls-him-abd-amr: {label: "A pagan correspondent says 'I do not know al-Rahman' and makes the convert write his pre-Islamic name 'Abd 'Amr", cluster: polemic}
  protector-lies-on-captive-swords-strike-beneath: {label: "To shield his kneeling captive the protector throws himself on him; the pursuers stab him through from beneath and wound the protector's foot", cluster: warfare}
  prostrates-on-dust-in-his-hand: {label: "When all prostrate at the sura, one old man takes a handful of dust and prostrates on it; he is later killed an unbeliever", cluster: ritual}
  who-for-the-children-the-fire: {label: "The captive about to be executed asks 'who will care for the children?' and is answered 'the fire'", cluster: warfare}
  no-remission-of-ransom-for-kin: {label: "Helpers ask leave to waive their kinsman-captive's ransom: 'by God, you will not leave a single dirham of it'", cluster: law}
  ransom-four-thousand-a-man: {label: "Each captive is ransomed for four thousand (dirhams)", cluster: law}
  dead-addressed-in-the-well: {label: "After three days the prophet stands at the well of the slain and calls them by their names and their fathers' names: 'have you found what your Lord promised you true?'", cluster: eschatology}
  dead-hear-better-than-the-living: {label: "Asked how he speaks to bodies without souls: 'you do not hear what I say better than they, but they cannot answer'", cluster: eschatology}
  dead-know-not-hear-aishas-correction: {label: "Aisha corrects the report: he said they now know (not hear) that what he told them was true, and recites 'you cannot make the dead hear'", cluster: eschatology}
  body-too-swollen-for-the-well: {label: "One slain enemy swelled in his armour and fell apart when moved, so he was left and covered with earth and stones", cluster: warfare}
  victor-stays-three-nights-on-field: {label: "When he overcame a people the prophet stayed three nights in the open field (al-'arsa)", cluster: warfare}
  curse-at-the-kaba-fulfilled-at-badr: {label: "Facing the House the prophet curses six named Qurayshis; they are seen lying dead at the battle, changed by the sun on a hot day", cluster: prophecy}
  enemies-sworn-by-idols-struck-mute-and-pelted: {label: "The chiefs swear by al-Lat, al-'Uzza, Manat, Na'ila and Isaf to kill him; he performs ablution, enters, they lower their eyes, chins on chests; every man hit by his handful of pebbles is killed at Badr", cluster: prophecy}
  spare-the-kin-who-came-unwillingly: {label: "'Take captive whom you can of the Banu 'Abd al-Muttalib, for they came out unwillingly'", cluster: warfare}
  captives-counsel-ransom-or-kill: {label: "On the captives Abu Bakr counsels ransom (they are kin), 'Umar counsels each to behead his own kinsman; the prophet inclines to ransom", cluster: warfare}
  punishment-shown-nearer-than-a-tree: {label: "Next day the prophet and Abu Bakr weep: 'their punishment was shown to me nearer than this tree' for taking the ransom", cluster: punishment}
  forbid-mourning-lest-the-enemy-rejoice: {label: "The defeated forbid their women to wail for the dead lest the victors gloat; ransom is delayed so the price will not rise", cluster: warfare}
  prophet-reveals-hidden-buried-money: {label: "The captive pleads poverty; the prophet tells him of the money he buried with his wife and what he said over it; known to none but the two, he confesses faith", cluster: prophecy}
  twenty-ounces-replaced-by-twenty-slaves: {label: "Twenty ounces of gold taken as ransom are replaced in Islam by twenty slaves each trading with capital", cluster: law}
  ransom-by-teaching-children-to-write: {label: "Captives without means are ransomed by teaching the helpers' children writing; a boy beaten by his teacher is kept home: 'he seeks revenge for Badr'", cluster: law}
  necklace-sent-as-ransom-moves-the-prophet: {label: "The prophet's daughter sends as her husband's ransom the necklace Khadija gave her at marriage; he is moved and asks that the captive be freed and her property returned", cluster: sira}
  would-have-freed-them-for-a-dead-protector: {label: "'Had al-Mut'im b. 'Adi been alive and spoken to me for these stinkers (al-natna), I would have released them to him'", cluster: sira}
  hundred-shares-for-the-emigrants: {label: "One hundred shares were struck for the emigrants at the battle", cluster: law}
  veterans-stipend-five-thousand: {label: "The stipend of the men of Badr was five thousand; 'Umar: 'I will prefer them above those after them'", cluster: law}
  news-of-victory-arrives-as-daughter-is-buried: {label: "The herald of victory reaches Medina as earth is being levelled over the prophet's daughter; her husband, kept back to nurse her, receives a share", cluster: sira}
  captives-fed-bread-captors-eat-dates: {label: "'Treat the captives well': the helpers eat dates and give their captive the bread", cluster: ethics}
  sitters-not-equal-to-goers-to-badr: {label: "'Not equal are those who sit' (Q 4:95) refers to those who stayed from Badr and those who went out", cluster: warfare}
  many-gardens-highest-firdaws: {label: "To a mother of a slain youth: 'Is it one garden? They are many gardens, and he is in the Firdaws'", cluster: paradise}
  none-of-badr-and-hudaybiyya-enters-the-fire: {label: "'I hope none who witnessed Badr and al-Hudaybiyya will enter the fire'; asked about 'none of you but will come to it', he cites 'then we will save the God-fearing'", cluster: eschatology}
  martyrs-souls-in-green-birds-ask-to-die-again: {label: "The slain believers' spirits are put in green birds roaming paradise; asked thrice 'what do you desire', the fourth time they ask to be returned to their bodies to be killed again", cluster: paradise}
  assassin-with-poisoned-sword-revealed-and-converts: {label: "A man sent to kill the prophet, his sword polished and poisoned, is told the secret pact he made in the hijr with his patron; known to none, he converts", cluster: prophecy}
  pagan-greeting-replaced-by-salam: {label: "'An'im sabahan', the greeting of the Jahiliyya, is answered: God gave us instead the greeting of the people of paradise, al-salam", cluster: ritual}
  enemy-boasts-we-are-the-real-fighters: {label: "Called to accept Islam, a tribe boasts the slain were untested youths: 'if you fought us you would learn we are the men'", cluster: warfare}
  prayer-on-mount-facing-east-in-campaign: {label: "On campaign the prophet prays voluntary prayer on his mount facing the east", cluster: ritual}
  may-god-strike-his-neck-in-gods-path: {label: "The prophet says of a poorly dressed man 'may God strike his neck'; the man asks 'in God's path?' - 'in God's path' - and he is killed in God's path", cluster: warfare}
  assassin-permitted-to-say-something: {label: "Volunteering to kill an enemy who 'harmed God and his messenger', the companion asks leave to 'say something' (to deceive) and is permitted", cluster: warfare}
  pledge-women-sons-or-weapons: {label: "Asked for a loan, the enemy demands their women, then their sons as pledge; they offer weapons (al-la'ma) instead", cluster: warfare}
  wife-hears-voice-dripping-blood: {label: "His wife says 'I hear a voice as if blood drips from it'; he answers that a noble man called to a spear-thrust at night would answer", cluster: warfare}
  killed-while-smelling-his-hair: {label: "The assassin asks to smell his perfumed hair, then smells it again and when he has hold of his head tells the others 'take him'", cluster: warfare}
  assassins-sent-off-in-gods-name: {label: "The prophet walks with the assassins to Baqi' al-Gharqad: 'go in the name of God; O God, help them'", cluster: warfare}
  covenant-document-after-killing: {label: "After the killing the frightened Jews and polytheists complain; the prophet writes a document (sahifa) between himself, them and the Muslims", cluster: law}
  infiltrator-takes-keys-locks-doors-behind: {label: "The infiltrator hides inside the fort, takes the keys from the peg, and locks each door behind him as he climbs to the upper rooms ('alali)", cluster: warfare}
  sword-into-belly-out-through-back: {label: "He places the point of the sword in the enemy's belly until it comes out at his back", cluster: warfare}
  broken-leg-healed-by-stroking: {label: "The assassin falls from the stairs on a moonlit night, breaks his shin and binds it with a turban; the prophet strokes it and it is as if never hurt", cluster: prophecy}
  death-announced-at-cockcrow-from-the-wall: {label: "At cockcrow the death-announcer (al-na'i) on the wall cries 'I announce Abu Rafi', merchant of the Hijaz'", cluster: warfare}
  no-killing-of-boys-or-women: {label: "The raiders are charged not to kill a boy or a woman", cluster: law}
  dream-armour-is-the-city: {label: "Dream: he is in a fortified coat of mail, interpreted as Medina (stay and fight within it)", cluster: dreams}
  dream-riding-behind-a-ram: {label: "Dream: he rides with a ram behind him, interpreted as the leader (kabsh) of the enemy squadron", cluster: dreams}
  prophet-does-not-remove-armour-once-worn: {label: "'It is not for a prophet, once he has put on his armour, to lay it down until he fights' (or God judges)", cluster: warfare}
  no-help-from-polytheists: {label: "Six hundred Jewish clients come out with the hypocrite leader; not being Muslims, they are sent back: 'we do not seek help from polytheists against polytheists'", cluster: war-law}
  two-coats-of-mail: {label: "The prophet wore two coats of mail, one over the other (zahara bayna dir'ayn)", cluster: warfare}
  companion-becomes-step-to-the-rock: {label: "Weighted by two coats of mail he cannot climb the rock; a companion crouches under him as a step: 'Talha has earned (paradise)'", cluster: warfare}
  sword-taken-by-its-right: {label: "'Who will take this sword with its due?' - all reach out, then hold back; Abu Dujana takes it and splits the heads of the enemy", cluster: warfare}
  bent-sword-handed-to-wife: {label: "A warrior gives his wife his bent sword, 'it has healed me'; the prophet names four others who also struck well", cluster: warfare}
  say-i-am-the-ansari-not-the-persian: {label: "A Persian client strikes an enemy crying 'take it from the Persian lad'; the prophet: 'why not say: from the Ansari lad?'", cluster: ethics}
  iblis-cries-your-rear-and-father-killed: {label: "When the enemy is routed Iblis shouts 'your rear!'; the front turns on the rear and they kill a companion's father while he cries 'my father!'", cluster: demonology}
  son-forgives-his-fathers-killers: {label: "Seeing his father killed by his own side, the son says 'may God forgive you'", cluster: ethics}
  shout-muhammad-is-killed: {label: "A shouter thought to be Satan cries that Muhammad is killed; the army breaks into thirds, wounded, slain and fled", cluster: demonology}
  woman-raises-the-fallen-standard: {label: "The enemy's standard lies untouched after its bearers fall until a woman ('Amra bint 'Alqama) raises it and men rally to it", cluster: warfare}
  archers-leave-the-hill-for-spoils: {label: "Fifty archers told not to leave the hill even if birds snatch the army leave it for the spoils; the horse comes from behind and the rout follows", cluster: warfare}
  only-twelve-remain-with-prophet: {label: "Only twelve men remain with the prophet when the army flees", cluster: warfare}
  answer-hubal-with-god-is-higher: {label: "The enemy leader shouts 'Be high, Hubal!' and 'we have al-'Uzza and you have none'; the answer: 'God is higher and more majestic', 'God is our protector and you have none'", cluster: polemic}
  day-for-day-war-is-buckets: {label: "'A day for the day of Badr; war is buckets (sijal)' - answered 'not equal: our dead in paradise, yours in the fire'", cluster: warfare}
  enemy-calls-for-each-leader-three-times: {label: "The enemy leader calls three times each for Muhammad, Abu Bakr and 'Umar; forbidden to answer, they keep silent until 'Umar cannot hold back", cluster: warfare}
  greatest-victory-is-the-day-of-defeat: {label: "'God never gave victory as he did at Uhud' - proved from the verse on the archers' failure", cluster: warfare}
  prayer-if-you-will-you-will-not-be-worshipped: {label: "On the day of the second battle: 'O God, if you will, you will not be worshipped on earth'", cluster: warfare}
  hypocrites-only-care-for-themselves: {label: "The other party, the hypocrites, cared only for themselves, most cowardly and fearful", cluster: polemic}
  hypocrites-words-heard-as-in-a-dream: {label: "Through the drowsiness a fighter hears, as in a dream, a hypocrite say 'had we any say in the matter we would not be killed here'", cluster: polemic}
  fled-companion-pardoned-by-verse: {label: "Accused of fleeing the battle, absence from Badr and the pledge, the companion is defended: God pardoned the fleeing (Q 3:155), he nursed the prophet's daughter, and the prophet's hand stood for his", cluster: sira}
  you-went-far-with-it: {label: "Men who fled to a mountain and stayed three days return: 'you went off with it wide (la-qad dhahabtum fiha 'arida)'", cluster: sira}
  eyes-recognised-under-helmet: {label: "After the rumour of his death a companion recognises the prophet's eyes shining under the helmet and cries the good news; he signs him to be silent", cluster: sira}
  prophet-kills-attacker-with-spear: {label: "A pursuer cries 'may I not survive if you survive'; the prophet takes a spear, shakes his companions off like hair off a camel's back, and wounds him so he rolls from his horse", cluster: warfare}
  helpers-seventy-at-three-battles: {label: "Seventy of the helpers were killed at each of Uhud, Bi'r Ma'una and al-Yamama", cluster: warfare}
  wine-drunk-the-morning-they-were-martyred: {label: "Some drank wine on the morning of the battle and were killed martyrs that day, before it was forbidden", cluster: law}
  shroud-too-short-feet-covered-with-idhkhir: {label: "A martyr's only shroud is a striped cloak too short: cover the head, and put idhkhir grass over the feet", cluster: ritual}
  rewards-hastened-in-this-world: {label: "Those who died before the conquests did not eat their reward; the survivor weeps, fearing his good deeds were rewarded in this world", cluster: ethics}
  smell-of-paradise-before-uhud: {label: "'Paradise, by the Lord of al-Nadr! I find its scent this side of Uhud'", cluster: paradise}
  body-known-only-by-fingertips: {label: "The mutilated martyr has eighty-odd wounds; only his sister knows him, by his fingertips", cluster: warfare}
  angels-shade-martyr-with-wings: {label: "A mutilated martyr lies covered; to his weeping kinswoman: 'why weep? The angels kept shading him with their wings until he was lifted'", cluster: angels}
  martyr-foresees-death-and-charges-son: {label: "The father tells his son by night he will be the first killed, charges him to pay his debt and care for his sisters, and is the first slain", cluster: sira}
  body-unchanged-after-six-months: {label: "The son exhumes his father after six months: he is as on the day he was buried, but for his ear", cluster: eschatology}
  lame-man-will-walk-sound-in-paradise: {label: "A lame man asks if, killed, he will walk on this foot sound in paradise; 'I see you walking on it sound in paradise'", cluster: paradise}
  defenders-fall-one-by-one: {label: "Left with seven helpers and two Qurashis: 'who will drive them back and have paradise?' - each helper goes and is killed in turn; 'we have not been fair to our companions'", cluster: warfare}
  retaliation-in-kind-then-patience: {label: "Vowing to repay the mutilation many times over, they hear 'if you punish, punish in the measure you were punished; but patience is better' (Q 16:126): 'we will be patient'", cluster: law}
  paradise-without-a-single-prayer: {label: "A man who refused Islam converts on the day of battle, fights, dies, and enters paradise without having prayed a single prayer", cluster: paradise}
  every-calamity-after-you-is-slight: {label: "A woman whose husband, brother and father are killed asks only to see the prophet: 'every calamity after you is slight (jalal)'", cluster: sira}
  freed-slave-kills-hero-with-javelin-from-ambush: {label: "Promised freedom for killing the uncle, the slave lies in wait under a rock and throws his javelin into his lower belly until it comes out between his hips", cluster: warfare}
  son-of-the-circumciser-woman: {label: "In the duel the hero mocks his opponent as 'son of Umm Anmar, cutter of clitorises'", cluster: polemic}
  killer-asked-to-hide-his-face: {label: "The killer comes to the prophet with an embassy; 'can you hide your face from me?'", cluster: sira}
  same-javelin-kills-false-prophet: {label: "To make amends the killer throws the same javelin at Musaylima, between the breasts; a girl on a roof: 'the black slave killed the commander of the faithful'", cluster: sira}
  left-for-beasts-to-be-raised-from-their-bellies: {label: "'Were it not that Safiyya would grieve, I would leave him for the wild beasts to eat, to be raised from their bellies'", cluster: eschatology}
  prayer-over-slain-after-eight-years-as-farewell: {label: "The prophet prays over the slain of the battle eight years later like one bidding farewell to the living and dead: 'I am your forerunner (farat)'", cluster: ritual}
  hamza-has-no-weeping-women: {label: "Hearing women weep for their slain: 'but Hamza has no women to weep for him'; then 'let them not weep for any dead after today'", cluster: ritual}
  martyr-washed-by-angels-went-out-in-janaba: {label: "'The angels are washing your companion Hanzala'; his wife says he went out in a state of janaba at the alarm", cluster: angels}
  medina-expels-men-as-fire-dross-from-iron: {label: "'It (Medina) expels men as fire expels the dross of iron', after the deserters turn back and the believers split over them", cluster: sira}
  two-men-in-white-fight-for-the-prophet: {label: "On the prophet's right and left two men in white clothes fight fiercely, never seen before or after", cluster: angels}
  shield-bearer-my-throat-before-yours: {label: "An archer shields the prophet with a leather shield, breaking two or three bows: 'do not look out, an arrow may hit you; my throat before your throat'", cluster: warfare}
  women-carry-water-skins-to-wounded: {label: "Aisha and Umm Sulaym, skirts tucked, carry water-skins on their backs and pour into the mouths of the men", cluster: warfare}
  ransom-my-father-and-mother-for-archer: {label: "'Shoot, may my father and mother be your ransom' - said to one archer alone; he hits an enemy with a headless arrow, exposing him, and the prophet laughs", cluster: warfare}
  hand-paralysed-shielding-the-prophet: {label: "A companion's hand is paralysed (shalla') from shielding the prophet", cluster: warfare}
  said-hiss-not-bismillah: {label: "Fingers cut off, he cries 'hiss!'; 'had you said bi-smi llah the angels would have lifted you up while people watched'", cluster: angels}
  wrath-on-those-who-bloodied-the-prophet: {label: "'God's wrath is severe on a people who bloodied the face of his prophet' and on a man the prophet himself kills in God's path", cluster: punishment}
  wounded-prophet-prays-forgive-my-people: {label: "The prophet tells of a prophet beaten bloody by his people, wiping the blood from his face: 'O God, forgive my people, for they do not know'", cluster: prophecy}
  wound-stanched-with-burnt-mat: {label: "Water only increases the bleeding; his daughter burns a piece of reed mat and presses the ash on the wound and the blood stops", cluster: sira}
  not-for-you-is-the-matter: {label: "'How can a people prosper who split their prophet's head and broke his tooth?' - answered 'not for you is anything of the matter' (Q 3:128)", cluster: revelation}
  seventy-volunteer-to-pursue: {label: "Fearing the enemy's return, 'who will go after them?' - seventy volunteer (Q 3:172)", cluster: warfare}
  martyrs-buried-two-in-a-cloth-quran-first: {label: "Two martyrs in one cloth; the one who knew more Quran is put first into the niche; buried in their blood, not washed or prayed over", cluster: ritual}
  praise-in-ranks-after-defeat: {label: "'Line up so I may praise my Lord': a long prayer in ranks - none withholds what you give, make faith beloved, take us as Muslims, fight the unbelievers who deny your messengers", cluster: ritual}
  tracked-by-date-stones-of-yathrib: {label: "Pursuers find date-stones at the raiders' camp: 'these are dates of Yathrib' and follow the track", cluster: warfare}
  i-will-not-come-down-under-unbelievers-protection: {label: "Offered a covenant, the leader refuses to descend under an unbeliever's protection: 'O God, tell our prophet of us'", cluster: warfare}
  captive-with-razor-spares-the-child: {label: "The captive borrows a razor to shave; a child crawls into his lap; to the frightened mother: 'do you fear I will kill him?'", cluster: ethics}
  captive-fed-grapes-out-of-season: {label: "The chained captive is seen eating a bunch of grapes when there was no fruit in Mecca: 'provision God gave him'", cluster: prophecy}
  two-rakas-before-execution: {label: "Before execution he prays two rak'as, short lest they think him afraid; he first instituted the two rak'as for one to be killed", cluster: ritual}
  hornets-guard-martyrs-body: {label: "Sent for a piece of the martyr's body, the enemy are kept off by a cloud of hornets (dabr)", cluster: providence}
  enemy-recognised-by-shiver: {label: "'When you see him you will feel a shudder (iqsha'rira)' - and so the assassin knows his target", cluster: warfare}
  prayer-while-walking-by-nods: {label: "Fearing to miss the afternoon prayer, he prays walking toward his target, nodding for bowing and prostration", cluster: ritual}
  staff-as-token-on-resurrection-day: {label: "The prophet gives him a staff: 'a sign between me and you on the day of resurrection; few will lean on staffs then'; it is put in his shroud", cluster: eschatology}
  reciters-killed-by-treachery: {label: "Seventy reciters (al-qurra') sent to a tribe are killed at the well of Ma'una by Ri'l, Dhakwan and 'Usayya", cluster: sira}
  month-of-qunut-cursing-tribes: {label: "For a month the prophet curses Ri'l, Dhakwan, 'Usayya and Lihyan in the dawn (or all five) prayers after the bowing - the beginning of the qunut", cluster: ritual}
  abrogated-verse-we-met-our-lord: {label: "A verse revealed and recited, then lifted: 'Tell our people we have met our Lord, he is pleased with us and has pleased us'", cluster: revelation}
  fuztu-wa-rabbil-kaba: {label: "Speared from behind while delivering the message, the envoy sprinkles his blood on his face and head: 'I have won, by the Lord of the Ka'ba!'", cluster: sira}
  chief-dies-of-camel-plague-on-horseback: {label: "The enemy chief, who demanded the plain or the caliphate, is struck with a bubo 'like a young camel's' in a woman's house and dies on his horse", cluster: punishment}
  martyr-raised-to-heaven-and-set-down: {label: "The captor says the slain freedman was lifted to heaven after death until he saw the sky between him and the earth, then set down", cluster: eschatology}
  sons-named-for-the-martyrs: {label: "'Urwa and al-Mundhir were named after martyrs of Bi'r Ma'una", cluster: sira}
  umm-ayman-holds-out-for-tenfold: {label: "Asked to return palms given her, the freedwoman puts her cloth round the boy's neck and refuses until given ten times as much", cluster: sira}
  fay-revenue-kept-for-a-years-food: {label: "From the fay' the prophet took his family's food for a year and put the rest into weapons and horses", cluster: law}
  poem-of-the-burning-at-buwayra: {label: "Hassan: 'it was light for the nobles of Lu'ayy, a flaming fire at al-Buwayra'; Abu Sufyan b. al-Harith replies with a counter-verse", cluster: polemic}
  thirty-rabbis-then-three: {label: "The tribe proposes thirty of his men meet thirty rabbis, then three and three; their three carry daggers; a woman warns her Muslim brother", cluster: sira}
  exile-first-gathering-to-sham: {label: "Their exile was the first gathering (hashr) of people to Syria; they were a tribe of Israel never exiled since God decreed exile on Israel", cluster: sira}
  houses-demolished-for-their-timber: {label: "The exiles carry off what their camels can bear, their doors and woodwork, demolishing their own houses for the timber", cluster: sira}
  attack-without-summons-on-watering: {label: "Summoning before battle was early Islam; the tribe was raided unawares while their cattle drank, the men killed and the families taken", cluster: war-law}
  every-soul-destined-will-come-to-be: {label: "Asked about withdrawal ('azl) with captives: 'no harm if you do not; no soul destined to exist until the resurrection but will exist'", cluster: law}
  lots-cast-among-wives-for-journey: {label: "Before a journey the prophet casts lots among his wives and takes the one whose lot comes out", cluster: law}
  lost-necklace-left-behind-by-caravan: {label: "Searching for her broken onyx necklace, the young wife is left behind; the bearers lift her light litter, not noticing she is not in it", cluster: sira}
  rear-guard-finds-her-says-only-inna-lillah: {label: "The rear-guard finds her asleep, wakes her with 'inna li-llahi' alone, kneels his camel and leads it without a word", cluster: sira}
  husbands-coolness-in-illness: {label: "In her illness she misses his usual kindness; he only asks 'how is that one (kayfa tikum)?' and leaves", cluster: sira}
  news-learned-from-woman-stumbling: {label: "Her companion trips on her gown and curses her own son; so the accused learns the rumour", cluster: sira}
  counsellors-divided-and-maid-questioned: {label: "One counsellor says 'we know only good', the other 'women are many, ask the maid'; the maid says only that she sleeps and the goat eats the dough", cluster: sira}
  tribes-near-fighting-in-the-mosque: {label: "The prophet asks from the pulpit who will excuse him; the two tribes' chiefs trade 'you lie' until they nearly fight", cluster: sira}
  confess-and-repent-or-be-cleared: {label: "'If you are innocent God will clear you; if you slipped, ask forgiveness: when a servant confesses and repents, God turns to him'", cluster: ethics}
  hoped-for-a-dream-not-a-recited-verse: {label: "She thought herself too slight for God to speak of her in recited revelation; she hoped the prophet would see a dream clearing her", cluster: revelation}
  revelation-sweat-like-pearls-in-winter: {label: "Revelation comes on him in the room; sweat drips from him like pearls on a winter day from the weight of the word", cluster: revelation}
  i-praise-only-god: {label: "Told to rise and thank the prophet: 'I will not rise to him; I praise only God'", cluster: ethics}
  stopped-maintenance-restored-by-verse: {label: "The father vows to stop supporting a kinsman slanderer; 'let not the men of bounty swear off giving' (Q 24:22) - he resumes it forever", cluster: ethics}
  rival-co-wife-protected-by-piety: {label: "The co-wife who rivalled her says 'I protect my hearing and sight; I know only good'; her sister fought for her and perished", cluster: ethics}
  accused-man-never-uncovered-a-woman: {label: "The accused man said 'glory be to God, I never uncovered a woman's robe'; he was later killed in God's path", cluster: sira}

units:
  - id: hadith-48-badr-consultation
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Consultation before Badr; the captured water-carrier; the marked death-places"
    read: ["Jāmiʿ 48:5203.1-5204.2"]
    quran: ["5:24", "8:5-7"]
    tags:
      - {motif: consulted-army-would-ride-into-the-sea, refs: ["Jāmiʿ 48:5203.1", "Jāmiʿ 48:5204.1"], note: "لو أمرتنا أن نُخيضها البحر لأخضناها، ولو أمرتنا أن نضرب أكبادها إلى برك الغماد لفعلنا"}
      - {motif: captive-beaten-for-truth-left-for-lie, refs: ["Jāmiʿ 48:5203.1"], note: "غلام أسود لبني الحجاج ... لتضربوه إذا صدقكم وتتركوه إذا كذبكم"}
      - {motif: death-places-marked-before-battle, refs: ["Jāmiʿ 48:5203.1"], note: "هذا مصرع فلان ... فما ماط أحدهم عن موضع يد رسول الله"}
      - {motif: not-like-israel-to-moses-go-you-and-your-lord, refs: ["Jāmiʿ 48:5204.1", "Jāmiʿ 48:5204.2"], note: "لا نقول كما قال قوم موسى: فاذهب أنت وربك فقاتلا ... ولكنا نقاتل عن يمينك وعن شمالك وبين يديك وخلفك"}
    hints:
      - "The vow not to answer as Israel answered Moses (Q 5:24) against Num 14:1-4 and Deut 1:26-28, the people's refusal to go up against the land."
  - id: hadith-48-badr-scout-and-dates
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "The scout Busaysa; 'Umayr b. al-Humam throws away his dates"
    read: ["Jāmiʿ 48:5205.1"]
    quran: ["3:133"]
    tags:
      - {motif: dates-thrown-away-to-hasten-martyrdom, refs: ["Jāmiʿ 48:5205.1"], note: "قوموا إلى جنة عرضها السماوات والأرض ... بخ بخ ... لئن أنا حييت حتى آكل تمراتي هذه إنها لحياة طويلة"}
  - id: hadith-48-badr-camel-bells
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Bells cut from the camels' necks at Badr"
    read: ["Jāmiʿ 48:5206.1"]
    quran: []
    tags:
      - {motif: camel-bells-cut-before-battle, refs: ["Jāmiʿ 48:5206.1"], note: "أمر بالأجراس أن تقطع من أعناق الإبل يوم بدر"}
  - id: hadith-48-badr-booth-and-rain
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "The prophet's booth; the night rain and the prayer for the band"
    read: ["Jāmiʿ 48:5207.1-5208.1"]
    quran: ["8:11"]
    tags:
      - {motif: prayer-if-this-band-perishes-you-will-not-be-worshipped, refs: ["Jāmiʿ 48:5208.1"], note: "اللهم إنك إن تهلك هذه الفئة لا تعبد"}
    hints:
      - "Night rain before the battle (Q 8:11) against Judg 5:4, 20-21, the heavens dropping water and the torrent Kishon sweeping the enemy."
  - id: hadith-48-badr-numbers
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "The number of the men of Badr, as Talut's men who crossed the river"
    read: ["Jāmiʿ 48:5208.2-5209.4"]
    quran: ["2:249"]
    tags:
      - {motif: badr-number-equals-taluts-crossers, refs: ["Jāmiʿ 48:5208.2", "Jāmiʿ 48:5209.4"], note: "عدة أصحاب طالوت الذين جاوزوا معه النهر: بضعة عشر وثلاث مئة ... ما جاوز معه النهر إلا مؤمن؛ ثلاثمائة وسبعة عشر"}
      - {motif: army-number-three-hundred-and-ten-odd, refs: ["Jāmiʿ 48:5209.1", "Jāmiʿ 48:5209.2", "Jāmiʿ 48:5209.3"], note: "المهاجرون نيفًا على ستين، والأنصار نيفًا وأربعين ومائتين؛ وهم ألف وأصحابه ثلاثمائة وتسعة عشر؛ في ثلاث مائة وخمسة عشر"}
      - {motif: boys-turned-back-as-too-young, refs: ["Jāmiʿ 48:5209.1"], note: "استصغرت أنا وابن عمر يوم بدر"}
      - {motif: prayer-for-barefoot-naked-hungry-army, refs: ["Jāmiʿ 48:5209.3"], note: "اللهم إنهم حفاة فاحملهم اللهم إنهم عراة فاكسُهم، اللهم إنهم جياع فأشبعهم"}
    hints:
      - "The force sifted to only believers at the river and numbered at three hundred and ten-odd against Judg 7:4-7, Gideon's three hundred chosen at the water."
  - id: hadith-48-badr-camels-and-horses
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Three to a camel; two horses; the prophet weeping in prayer all night"
    read: ["Jāmiʿ 48:5212.1-5213.2"]
    quran: []
    tags:
      - {motif: three-men-to-a-camel-prophet-takes-his-turn, refs: ["Jāmiʿ 48:5212.1"], note: "كل ثلاثة على بعير ... ما أنتما بأقوى مني، ولا أنا بأغنى من الأجر منكما"}
      - {motif: only-two-horses-in-the-army, refs: ["Jāmiʿ 48:5213.1", "Jāmiʿ 48:5213.2"], note: "ما كان فينا فارس يوم بدر غير المقداد؛ ما كان معنا إلا فرسان: فرس للزبير، وفرس للمقداد"}
      - {motif: prophet-weeps-in-prayer-all-night-before-battle, refs: ["Jāmiʿ 48:5213.1"], note: "وما فينا إلا نائم، إلا رسول الله ﷺ تحت شجرة يصلي، ويبكي حتى أصبح"}
  - id: hadith-48-badr-too-young-and-kept-oath
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Boys judged too young; Hudhayfa and his father keep an oath to the enemy"
    read: ["Jāmiʿ 48:5214.1-5214.3"]
    quran: []
    tags:
      - {motif: boys-turned-back-as-too-young, refs: ["Jāmiʿ 48:5214.1", "Jāmiʿ 48:5214.2"], note: "نظر إلى عمير بن أبي وقاص فاستصغره ... ثم أجازه ... قتل يوم بدر"}
      - {motif: oath-to-enemy-kept-by-not-fighting, refs: ["Jāmiʿ 48:5214.3"], note: "فأخذوا منا عهد الله وميثاقه لننصرفنّ إلى المدينة، ولا نقاتل معه ... انصرفا، نفي لهم بعهدهم، ونستعين الله عليهم"}
    hints:
      - "An oath extracted by the enemy kept to the letter against Josh 9:15-20, the oath to the Gibeonites honoured though obtained by deceit."
  - id: hadith-48-badr-enemy-count
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "The enemy counted by the camels they slaughter"
    read: ["Jāmiʿ 48:5215.1"]
    quran: []
    tags:
      - {motif: enemy-counted-by-camels-slaughtered, refs: ["Jāmiʿ 48:5215.1"], note: "كم ينحرون من الجزور؟ فقال: عشر كل يوم ... القوم ألف، كل جزور لمائة وتبعها"}
  - id: hadith-48-badr-courage
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "The prophet nearest the enemy; al-Zubayr's wounds and notched sword"
    read: ["Jāmiʿ 48:5215.2-5216.2"]
    quran: []
    tags:
      - {motif: prophet-nearest-the-enemy, refs: ["Jāmiʿ 48:5215.2"], note: "ونحن نلوذ برسول الله ﷺ وهو أقربنا إلى العدو"}
      - {motif: scars-of-battle-fingered-by-a-child, refs: ["Jāmiʿ 48:5216.1", "Jāmiʿ 48:5216.2"], note: "كنت أدخل أصابعي في تلك الضربات ألعب وأنا صغير"}
      - {motif: notched-sword-valued-in-thousands, refs: ["Jāmiʿ 48:5216.2"], note: "فيه فلّة فلّها يوم بدر ... فأقمناه بيننا ثلاثة آلاف"}
  - id: hadith-48-badr-duel
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "The three-against-three duel at Badr and the verse of the two disputants"
    read: ["Jāmiʿ 48:5217.1-5217.4"]
    quran: ["22:19"]
    tags:
      - {motif: first-to-kneel-in-dispute-before-god, refs: ["Jāmiʿ 48:5217.1"], note: "أنا أول من يجثو بين يدي الرحمن للخصومة يوم القيامة"}
      - {motif: two-disputants-verse-of-the-duellists, refs: ["Jāmiʿ 48:5217.1", "Jāmiʿ 48:5217.2"], note: "هذان خصمان اختصموا في ربهم ... نزلت في الذين برزوا يوم بدر"}
      - {motif: three-against-three-duel-before-battle, refs: ["Jāmiʿ 48:5217.2", "Jāmiʿ 48:5217.4"], note: "فانتدب له شباب من الأنصار ... لا حاجة لنا فيكم، إنما أردنا بني عمّنا ... قم يا حمزة! قم يا علي! قم يا عبيدة"}
      - {motif: two-coats-of-mail, refs: ["Jāmiʿ 48:5217.3"], note: "بارز وظاهر (أي لبس درعًا على درع)"}
    hints:
      - "Champions in matched numbers opening the battle against 2 Sam 2:14-16, twelve youths of Benjamin against twelve of David's men at Gibeon."
  - id: hadith-48-badr-arrows-and-ranks
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Orders to shoot and to keep the ranks"
    read: ["Jāmiʿ 48:5218.1-5218.2"]
    quran: []
    tags:
      - {motif: shoot-when-they-come-close-spare-arrows, refs: ["Jāmiʿ 48:5218.1"], note: "إذا أكثبوكم فارموهم، واستبقوا نبلكم"}
  - id: hadith-48-badr-prayer-and-angels
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "The prophet's adjuration at Badr and the angels in the battle"
    read: ["Jāmiʿ 48:5219.1-5223.2"]
    quran: ["3:123-126", "8:9-13", "8:67-69", "54:45-46"]
    tags:
      - {motif: prayer-if-this-band-perishes-you-will-not-be-worshipped, refs: ["Jāmiʿ 48:5219.1", "Jāmiʿ 48:5219.2", "Jāmiʿ 48:5221.1"], note: "اللهم إن شئت لم تعبد بعد اليوم أبدًا؛ اللهم! إن تهلك هذه العصابة من أهل الإسلام لا تعبد في الأرض"}
      - {motif: battle-prayer-till-cloak-falls, refs: ["Jāmiʿ 48:5219.2"], note: "مادًا يديه، مستقبل القبلة، حتى سقط رداؤه عن منكبيه، فأتاه أبو بكر، فأخذ رداءه ... ثم التزمه من ورائه"}
      - {motif: the-host-will-be-routed, refs: ["Jāmiʿ 48:5219.1"], note: "فخرج وهو يقول: سيهزم الجمع ويولون الدبر"}
      - {motif: angelic-reinforcement-in-battle, refs: ["Jāmiʿ 48:5219.2"], note: "فأنزل الله: إذ تستغيثون ربكم فاستجاب لكم أني ممدكم بألف من الملائكة مردفين، فأمده الله بالملائكة"}
      - {motif: angel-horseman-cries-aqdim-hayzum, refs: ["Jāmiʿ 48:5219.2"], note: "سمع ضربة بالسوط فوقه، وصوت الفارس يقول: أقدم حيزوم ... خطم أنفه، وشق وجهه كضربة السوط. فاخضرّ ذلك أجمع"}
      - {motif: help-from-the-third-heaven, refs: ["Jāmiʿ 48:5219.2"], note: "صدقت، ذلك من مدد السماء الثالثة"}
      - {motif: seventy-killed-seventy-captured, refs: ["Jāmiʿ 48:5219.2", "Jāmiʿ 48:5221.1"], note: "فقتلوا يومئذ سبعين وأسروا سبعين"}
      - {motif: captives-counsel-ransom-or-kill, refs: ["Jāmiʿ 48:5219.2"], note: "أرى أن تأخذ منهم فدية ... أرى أن تمكنا فنضرب أعناقهم، فتمكن عليًا من عقيل"}
      - {motif: punishment-shown-nearer-than-a-tree, refs: ["Jāmiʿ 48:5219.2"], note: "لقد عُرض علي عذابهم أدنى من هذه الشجرة"}
      - {motif: man-on-red-camel-counsels-retreat, refs: ["Jāmiʿ 48:5221.1"], note: "إن يكن في القوم أحد يأمر بخير، فعسى أن يكون صاحب الجمل الأحمر ... اعصبوها اليوم برأسي، وقولوا: جبن عتبة"}
      - {motif: insult-musaffir-istihi, refs: ["Jāmiʿ 48:5221.1"], note: "إياي تعير يا مصفر استه؟"}
      - {motif: three-against-three-duel-before-battle, refs: ["Jāmiʿ 48:5221.1"], note: "فخرج فتية من الأنصار ستة، فقال عتبة: لا نريد هؤلاء، ولكن يبارزنا من بني عمنا"}
      - {motif: captor-was-an-unseen-angel, refs: ["Jāmiʿ 48:5221.1"], note: "لقد أسرني رجل أجلح، من أحسن الناس وجهًا، على فرس أبلق، ما أراه في القوم ... فقد أيدك الله تعالى بملك كريم"}
      - {motif: angels-who-fought-are-the-best-angels, refs: ["Jāmiʿ 48:5222.1"], note: "ما تعدّون أهل بدر فيكم؟ قال: من أفضل المسلمين ... وكذلك من شهد بدرًا من الملائكة"}
      - {motif: gabriel-holds-his-horses-head-armed, refs: ["Jāmiʿ 48:5222.2"], note: "هذا جبريل آخذ برأس فرسه، عليه أداة الحرب"}
