- id: hadith-60-only-truth-from-his-mouth
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Nothing but truth from his mouth; jesting yet truthful; the intercession of one man (Q 53:3-5)
  read:
  - Jāmiʿ 60:7501.1-7502.2
  quran:
  - 53:3-5
  tags:
  - motif: write-nothing-but-truth-comes-out
    refs:
    - Jāmiʿ 60:7501.1
    note: 'ورسول الله ﷺ بشر يتكلّم في الغضب والرِّضا ... فأومأ بإصبحه إلى فيه، فقال: اكتبْ، فوالذي نفسي بيده! ما يخرجُ منه إلّا حقّ'
  - motif: jests-but-says-only-truth
    refs:
    - Jāmiʿ 60:7501.2
    note: 'إنك تداعبنا فقال: إني لا أقول إلا حقا'
  - motif: one-mans-intercession-for-multitudes-like-rabia-mudar
    refs:
    - Jāmiʿ 60:7502.1
    note: ليدخلن الجنة بشفاعة رجل ليمس بنبي مثل الحيين ... ربيعة ومضر ... إنما أقُولُ ما أُقَوَّل
  - motif: write-nothing-but-truth-comes-out
    refs:
    - Jāmiʿ 60:7502.2
    note: ما أخبرتكم أنه من عند الله فهو الذي لا شك فيه
- id: hadith-60-he-saw-gabriel
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Aisha: he did not see his Lord; Gabriel seen twice in his true form, six hundred wings, the green rafraf, the lote tree (Q 53:9-18)'
  read:
  - Jāmiʿ 60:7502.3-7504.3
  quran:
  - 53:9-18
  - '81:23'
  - 6:103
  - '42:51'
  - 5:67
  - 27:65
  - '31:34'
  tags:
  - motif: whoever-says-muhammad-saw-his-lord-lies
    refs:
    - Jāmiʿ 60:7502.3
    - Jāmiʿ 60:7503.1
    note: ثلاث من تكلم بواحدة منهن فقد أعظم على الله الفرية ... من زعم أن محمدا ﷺ رأى ربه ... كتم شيئا من كتاب الله ... يخبر بما يكون في غد / لقد قَفَّ شعري مما قلت
  - motif: gabriel-seen-in-true-form-twice
    refs:
    - Jāmiʿ 60:7502.3
    - Jāmiʿ 60:7503.1
    - Jāmiʿ 60:7504.1
    note: إنما هو جبريل لم أره على صورته التي خلق عليها غير هاتين المرتين، رأيته منهبطا من السماء، سادا عظم خلقه ما بين السماء إلى الأرض / رأى جبريل
  - motif: three-modes-of-divine-speech
    refs:
    - Jāmiʿ 60:7502.3
    - Jāmiʿ 60:7503.1
    note: Aisha cites Q 42:51 وما كان لبشر أن يكلمه الله إلا وحيا أو من وراء حجاب
  - motif: gabriel-six-hundred-wings
    refs:
    - Jāmiʿ 60:7503.2
    note: 'فكان قاب قوسين أو أدنى ... حدثنا ابن مسعود: أنه رأى جبريل له ست مائة جناح'
  - motif: green-rafraf-filling-horizon
    refs:
    - Jāmiʿ 60:7504.2
    note: 'لقد رأى من آيات ربه الكبرى قال: رأى رفرفا أخضر قد سدَّ الأفق'
  - motif: lote-tree-in-sixth-heaven-where-things-stop
    refs:
    - Jāmiʿ 60:7504.3
    note: سدرة المنتهى، وهي في السماء السادسة، إليها ينتهي ما يُعْرَجُ به من الأرض ... وإليها ينتهي ما يُهْبَط به من فوقها
  - motif: golden-moths-cover-the-lote-tree
    refs:
    - Jāmiʿ 60:7504.3
    note: 'إذ يغشى السدرة ما يغشى قال: فراش من ذهب'
  - motif: three-given-at-lote-tree
    refs:
    - Jāmiʿ 60:7504.3
    note: 'فأعطي رسول الله ﷺ ثلاثا: أعطي الصلوات الخمس، وأعطي خواتيم سورة البقرة، وغُفِرَ - لمن لم يشرك بالله من أمته شيئا - المُقحماتُ'
  hints:
  - No one sees God against Exod 33:20, 'there shall no man see me, and live', and John 1:18.
  - Gabriel's six hundred wings against the six wings of the seraphim in Isa 6:2.
- id: hadith-60-lat-uzza-manat
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Al-Lat the sawiq-mixer; al-'Uzza at Uhud and at Nakhla; oaths by them; Manat and Safa-Marwa (Q 53:19-20)
  read:
  - Jāmiʿ 60:7504.4-7506.1
  quran:
  - 53:19-20
  - 2:158
  tags:
  - motif: al-lat-al-uzza-manat
    refs:
    - Jāmiʿ 60:7504.4
    - Jāmiʿ 60:7505.1
    - Jāmiʿ 60:7506.1
    note: bab Q 53:19-20; each goddess given its report
  - motif: lat-was-man-who-mixed-sawiq
    refs:
    - Jāmiʿ 60:7504.4
    note: كان اللات رجلا يلت السويق، سويق الحاج
  - motif: answer-hubal-with-god-is-higher
    refs:
    - Jāmiʿ 60:7504.5
    note: اعْلُ هُبَل ... لنا العزى، ولا عزى لكم ... الله مولانا، ولا مولى لكم
  - motif: enemy-asks-three-times-is-he-among-you
    refs:
    - Jāmiʿ 60:7504.5
    note: أفي القوم محمد؟ ... ابن أبي قحافة؟ ... ابن الخطاب؟
  - motif: goddess-shrine-cut-down-naked-woman-killed
    refs:
    - Jāmiʿ 60:7505.1
    note: بعث خالد بن الوليد إلى نخلة ... فقطع السمرات وهدم البيت ... ارجع فإنك لم تصنع شيئًا ... يا عزى خَبِّليه، يا عزى عَوِّريه ... فإذا امرأة عريانة ناشرة شعرها تحثو التراب على رأسها فعممها بالسيف ... تلك العزى
  - motif: oath-by-lat-undone-by-tahlil
    refs:
    - Jāmiʿ 60:7505.2
    - Jāmiʿ 60:7505.3
    note: 'من حلف فقال في حلفه: واللات والعزى، فليقل: لا إله إلا الله، ومن قال لصاحبه: تعال أقامرك فليتصدق / قل: لا إله إلا الله وحده، ثلاثا، ثم انفُث عن يسارك ثلاثا، وتعوّذ ولا تعُدْ'
  - motif: ansar-shunned-safa-marwa-for-manat
    refs:
    - Jāmiʿ 60:7506.1
    note: كانوا قبل أن يسلموا يهلون لمناة الطاغية، التي كانوا يعبدونها عند المشلل، فكان من أهلَّ يتحرج أن يطوف بالصفا والمروة
  hints:
  - Swearing by other gods forbidden and repaired against Exod 23:13 ('make no mention of the name of other gods') and Josh 23:7 ('neither make mention of the name of their gods, nor cause to swear by them').
- id: hadith-60-wishes-and-suspicion
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Look at what you wish for; suspicion the most lying speech; the world not our greatest care (Q 53:24-30)
  read:
  - Jāmiʿ 60:7507.1-7508.2
  quran:
  - '53:24'
  - '53:28'
  - 53:29-30
  tags:
  - motif: look-at-what-you-wish-for
    refs:
    - Jāmiʿ 60:7507.1
    note: إذا تمنى أحدكم فلينظر ما يتمنى، فإنه لا يدري ما يكتب له من أمنيته
  - motif: suspicion-the-most-lying-speech
    refs:
    - Jāmiʿ 60:7508.1
    note: إياكم والظنَّ، فإن الظنَّ أكذب الحديث
  - motif: prayer-let-not-world-be-our-greatest-care
    refs:
    - Jāmiʿ 60:7508.2
    note: اللهم! اقسم لنا من خشيتك ما يحول بيننا وبين معاصيك ... ولا تجعل الدنيا أكبر همنا، ولا مبلغ علمنا، ولا تسلط علينا من لا يرحمنا
- id: hadith-60-lamam-and-self-praise
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Small faults (al-lamam), the dead infant called righteous, and the ban on praising oneself or others (Q 53:32)
  read:
  - Jāmiʿ 60:7509.1-7510.3
  quran:
  - '53:32'
  tags:
  - motif: zina-of-eye-and-tongue-decreed
    refs:
    - Jāmiʿ 60:7509.1
    note: ما رأيت شيئا أشبه باللمم ... إن الله كتب على ابن آدم حظه من الزنا ... فزنا العين النظر، وزنا اللسان المنطق، والنفس تتمنى وتشتهي، والفرج يصدِّق ذلك ويكذِّبه
  - motif: if-you-forgive-forgive-much
    refs:
    - Jāmiʿ 60:7509.2
    note: إنْ تغفِرْ اللهم! تغفِر جمًّا وأي عبدٍ لك لا ألمّا
  - motif: dead-infant-called-righteous-refuted
    refs:
    - Jāmiʿ 60:7509.3
    note: 'كانت اليهود تقول إذا هلك لهم صبي صغير: هو صدِّيق ... كذبت يهود، ما من نسمه يخلقها الله في بطن أمه إلا شقي أو سعيد'
  - motif: name-barra-changed-do-not-praise-yourselves
    refs:
    - Jāmiʿ 60:7510.1
    note: سمَّيت ابنتي بَرَّة ... لا تزكوا أنفسكم، الله أعلم بأهل البر منكم ... سمُّوها زينب
  - motif: praise-cuts-friends-neck-say-i-reckon
    refs:
    - Jāmiʿ 60:7510.2
    note: 'ويلك قطعت عنق صاحبك ... فليقل: أحسب فلانا، والله حسيبه، ولا أزكي على الله أحدا'
  - motif: throw-dust-in-flatterers-faces
    refs:
    - Jāmiʿ 60:7510.3
    note: فجثا على ركبتيه - وكان رجلا ضخما - فجعل يحثو في وجهه الحصباء ... إذا رأيتم المداحين فاحثوا في وجوههم التراب
  hints:
  - Adultery by the eye against Matt 5:28, 'whosoever looketh on a woman to lust after her hath committed adultery with her already in his heart'.
- id: hadith-60-prostration-of-al-najm
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: All prostrate at al-Najm but Umayya, who lifts dust to his forehead; recited once without prostration (Q 53:62)
  read:
  - Jāmiʿ 60:7510.4-7511.2
  quran:
  - 53:62
  tags:
  - motif: one-man-lifts-dust-to-forehead-instead-of-prostrating
    refs:
    - Jāmiʿ 60:7510.4
    note: أول سورة أنزلت فيها سجدة ... إلا رجلا رأيته أخذ كفا من تراب فسجد عليه، فرأيته بعد ذلك قُتِلَ كافرا، وهو أمية بن خلف
  - motif: jinn-and-idolaters-prostrate-at-surat-al-najm
    refs:
    - Jāmiʿ 60:7511.1
    note: سجد النبي ﷺ بالنجم، وسجد معه المسلمون والمشركون والجن والإنس
  - motif: najm-recited-without-prostrating
    refs:
    - Jāmiʿ 60:7511.2
    note: قرأت على النبي ﷺ والنجم فلم يسجد فيها
- id: hadith-60-qamar-at-the-feasts
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Qaf and al-Qamar recited at the two feasts (Q 54:1)
  read:
  - Jāmiʿ 60:7512.1
  quran:
  - '50:1'
  - '54:1'
  tags:
  - motif: qaf-recited-at-dawn-friday-and-eids
    refs:
    - Jāmiʿ 60:7512.1
    note: 'ما كان يقرأ به رسول الله ﷺ في الأضحى والفطر؟ فقال: كان يقرأ بـ ق ... و اقتربت الساعة'
- id: hadith-60-the-hour-has-drawn-near
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The Hour like two fingers; your term as from asr to sunset; Utba b. Ghazwan's sermon (Q 54:1)
  read:
  - Jāmiʿ 60:7512.2-7513.4
  quran:
  - '54:1'
  tags:
  - motif: hour-near-moon-split
    refs:
    - Jāmiʿ 60:7512.2
    note: bab Q 54:1 اقتربت الساعة
  - motif: sent-with-hour-like-two-fingers
    refs:
    - Jāmiʿ 60:7512.2
    - Jāmiʿ 60:7512.3
    - Jāmiʿ 60:7512.4
    - Jāmiʿ 60:7513.1
    - Jāmiʿ 60:7513.2
    note: بعثت أنا والساعة كهذه من هذه أو كهاتين، وقرن بين السبابة والوسطى / وقرن شعبة بين إصبعيه ... يحكيه / أنتم والساعة كهاتين
  - motif: your-term-like-asr-to-sunset
    refs:
    - Jāmiʿ 60:7513.3
    note: إنما أجلكم في أجل من خلا من الأمم كما بين صلاة العصر ومغرب الشمس
  - motif: world-gone-like-dregs-of-a-vessel
    refs:
    - Jāmiʿ 60:7513.4
    note: فإن الدنيا قد آذنت بِصُرْمٍ، وولت حذَّاءَ، ولم يبق منها إلا صُبابة كصبابة الإناء يتصابها صاحبها
  - motif: stone-falls-seventy-years-in-hell
    refs:
    - Jāmiʿ 60:7513.4
    note: إن الحجر يلقى من شفة جهنم، فيهوي فيها سبعين عاما لا يدرك لها قعرا، ووالله لتُمْلأَنَّ
  - motif: gate-of-paradise-forty-years-wide-yet-crowded
    refs:
    - Jāmiʿ 60:7513.4
    note: أن ما بين مصراعين من مصاريع الجنة مسيرة أربعين سنة، وليأتين عليها يوم وهو كظيظ من الزحام
  - motif: seventh-of-seven-eating-leaves-sharing-cloak
    refs:
    - Jāmiʿ 60:7513.4
    note: رأيتني سابع سبعة مع رسول الله ﷺ، ما لنا طعام إلا ورق الشجر، حتى قرحت أشداقنا، فالتقطت بردة، فشققتها بيني وبين سعد بن مالك
  - motif: prophethood-ends-in-kingship
    refs:
    - Jāmiʿ 60:7513.4
    note: وإنها لم تكن نبوة قط إلا تناسخت حتى يكون آخر عاقبتها مُلْكا
  hints:
  - Prophetic rule passing into kingship against 1 Sam 8:4-7, Israel asking Samuel for a king.
- id: hadith-60-moon-split
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'The moon split in two at Mecca: ''bear witness''; travellers confirm it (Q 54:1)'
  read:
  - Jāmiʿ 60:7514.1-7515.2
  quran:
  - '54:1'
  tags:
  - motif: moon-split-shown-as-sign
    refs:
    - Jāmiʿ 60:7514.1
    - Jāmiʿ 60:7514.2
    - Jāmiʿ 60:7515.1
    - Jāmiʿ 60:7515.2
    note: 'أن أهل مكة سألوا رسول الله ﷺ أن يريهم آية، فأراهم القمر شقين، حتى رأوا حراء بينهما / انشق القمر ... شقين، فقال: اشهدوا'
  - motif: travellers-confirm-moon-split
    refs:
    - Jāmiʿ 60:7514.3
    note: هذا سحر سحرنا به ابن أبي كبشة، فانظروا إلى السفار يأتونكم ... فما جاءهم أحد من وجه من الوجوه إلا أخبرهم أنهم رأوا مثل ما رأوا
- id: hadith-60-muddakir
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: '''Is there any who will remember?'' read muddakir with dal (Q 54:15)'
  read:
  - Jāmiʿ 60:7516.1
  quran:
  - 54:14-15
  tags:
  - motif: muddakir-read-with-dal
    refs:
    - Jāmiʿ 60:7516.1
    note: 'فهل من مدكر أدالا أم ذالا؟ قال: بل دالا، سمعت عبد الله بن مسعود يقول: سمعت رسول الله ﷺ يقول: مدكر'
- id: hadith-60-the-host-will-be-routed
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Badr: the plea in the tent; Aisha a girl at play when the verse came; the order of revelation (Q 54:45-46)'
  read:
  - Jāmiʿ 60:7517.1-7517.3
  quran:
  - 54:45-46
  tags:
  - motif: prophet-pleads-in-tent-at-badr-abu-bakr-says-enough
    refs:
    - Jāmiʿ 60:7517.1
    note: 'وهو في قبة له يوم بدر: أنشدك عهدك ووعدك، اللهم! إن شئت لم تعبد بعد اليوم أبدًا فأخذ أبو بكر بيده وقال: حسبك يا رسول الله! فقد ألححت على ربك، وهو في الدرع، فخرج وهو يقول: سيهزم الجمع'
  - motif: verse-revealed-when-aisha-was-a-girl-at-play
    refs:
    - Jāmiʿ 60:7517.2
    - Jāmiʿ 60:7517.3
    note: 'لقد أنزل على محمد ﷺ بمكة وإني لجارية ألعب: بل الساعة موعدهم ... وما نزلت سورة البقرة والنساء إلا وأنا عنده'
  - motif: first-revealed-paradise-and-hell-then-law
    refs:
    - Jāmiʿ 60:7517.3
    note: 'إنما نزل أول ما نزل منه سورة من المفصل، فيها ذكر الجنة والنار، حتى إذا ثاب الناس إلى الإسلام نزل الحلال والحرام، ولو نزل أول شيء: لا تشربوا الخمر لقالوا: لا ندع الخمر أبدا'
  hints:
  - A leader's plea before battle that God's name not be lost against Josh 7:9, 'what wilt thou do unto thy great name?'
- id: hadith-60-everything-by-measure
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Everything created by measure: the disputers of decree; even incapacity and cleverness; trifling deeds recorded (Q 54:48-53)'
  read:
  - Jāmiʿ 60:7518.1-7518.4
  quran:
  - 54:48-49
  - '54:53'
  tags:
  - motif: quraysh-dispute-on-decree-verse-revealed
    refs:
    - Jāmiʿ 60:7518.1
    note: جاء مشركو قريش يخاصمون رسول الله ﷺ في القدر، فنزلت
  - motif: deniers-of-decree-worst-of-community
    refs:
    - Jāmiʿ 60:7518.2
    note: وهو ينزع في ماء زمزم ... ما نزلت هذه الآية إلا فيهم ... لا تعودوا مرضاهم، ولا تصلوا على موتاهم، إن أريتني أحدا منهم فقأت عينيه بأصبعي هاتين
  - motif: everything-by-decree-even-incapacity-and-cleverness
    refs:
    - Jāmiʿ 60:7518.3
    note: كل شيء بقدر، حتى العجز والكيس أو الكيس والعجز
  - motif: beware-trifling-deeds-they-have-a-seeker
    refs:
    - Jāmiʿ 60:7518.4
    note: يا عائشة! إياك ومحقرات الأعمال فإن لها من الله طالبا / إياكم ومحقرات الذنوب
- id: hadith-60-seat-of-truth
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The just on pulpits of light at the Merciful's right (Q 54:54-55)
  read:
  - Jāmiʿ 60:7519.1
  quran:
  - 54:54-55
  tags:
  - motif: just-on-pulpits-of-light-at-gods-right
    refs:
    - Jāmiʿ 60:7519.1
    note: إن المقسطين على منابر من نور عن يمين الرحمن ﷿، وكلتا يديه يمين
- id: hadith-60-light-fire-and-clay
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Angels from light, jinn from smokeless fire, Adam from what you were told (Q 55:14-15)
  read:
  - Jāmiʿ 60:7519.2
  quran:
  - 55:14-15
  tags:
  - motif: angels-created-from-light
    refs:
    - Jāmiʿ 60:7519.2
    note: خُلقت الملائكةُ من نور، وخُلق الجانُّ من مارج من نار، وخُلق آدمُ مما وصِفَ لكم
- id: hadith-60-the-jinn-answered-better
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Al-Rahman recited: the jinn answered every refrain (Q 55:16)'
  read:
  - Jāmiʿ 60:7519.3-7520.1
  quran:
  - '55:16'
  tags:
  - motif: jinn-answer-refrain-better-than-companions
    refs:
    - Jāmiʿ 60:7519.3
    - Jāmiʿ 60:7520.1
    note: 'لقد قرأتها على الجن ليلة الجن فكانوا أحسن مردودا منكم ... قالوا: لا بشيء من نعمك ربنا نكذّب فلك الحمد'
  hints:
  - A congregational response after each refrain against Ps 136, where every verse is answered 'for his mercy endureth for ever'.
- id: hadith-60-every-day-in-an-affair
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'His affair each day: to forgive, relieve, raise and lower (Q 55:29)'
  read:
  - Jāmiʿ 60:7520.2
  quran:
  - '55:29'
  tags:
  - motif: gods-affair-forgive-relieve-raise-lower
    refs:
    - Jāmiʿ 60:7520.2
    note: من شأنه أن يغفر ذنبا، ويُفرِّج كربا، ويرفع قوما، ويخفض آخرين
  hints:
  - God who raises and lowers against 1 Sam 2:7, 'he bringeth low, and lifteth up', and Ps 75:7.
- id: hadith-60-two-gardens
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Two gardens for him who fears his Lord's station, even if he fornicated and stole; the lote's branch (Q 55:46-48)
  read:
  - Jāmiʿ 60:7521.1-7521.2
  quran:
  - '55:46'
  - '55:48'
  tags:
  - motif: even-if-he-fornicated-and-stole
    refs:
    - Jāmiʿ 60:7521.1
    note: وهو يقص على المنبر ... وإن زنى وإن سرق يا رسول الله؟ ... الثالثة ... نعم، وإن رغم أنف أبي الدرداء
  - motif: rider-in-shade-of-lote-branch-hundred-years
    refs:
    - Jāmiʿ 60:7521.2
    note: 'وذكر سدرة المنتهى، قال: يسير الراكب في ظل الفنن منها مائة سنة، أو يستظل بظلها مائة راكب ... فيها فراش الذهب، كأن ثمرها القلال'
  - motif: golden-moths-cover-the-lote-tree
    refs:
    - Jāmiʿ 60:7521.2
    note: فيها فراش الذهب
- id: hadith-60-wives-of-paradise
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The first group like the full moon; two wives whose marrow shows; no bachelor; the woman who would light the earth (Q 55:58)
  read:
  - Jāmiʿ 60:7522.1-7522.4
  quran:
  - '55:58'
  tags:
  - motif: first-group-like-full-moon-two-wives-marrow-seen
    refs:
    - Jāmiʿ 60:7522.1
    - Jāmiʿ 60:7522.2
    note: صورتهم على صورة القمر ليلة البدر لا يبصقون فيها، ولا يمتخطون، ولا يتغوطون، آنيتهم فيها الذهب ... ومجامرهم الألوة، ورشحهم المسك، ولكل واحد منهم زوجتان يرى مخ سوقهما من وراء اللحم
  - motif: no-bachelor-in-paradise
    refs:
    - Jāmiʿ 60:7522.2
    note: الرجال في الجنة أكثر أم النساء؟ ... والتي تليها على أضوإ كوكب دري ... وما في الجنة أعزب
  - motif: woman-of-paradise-would-light-the-earth
    refs:
    - Jāmiʿ 60:7522.3
    note: ولو أن امرأة من أهل الجنة اطلعت إلى أهل الأرض لأضاءت ما بينهما، ولملأته ريحا، ولنصيفها على رأسها خير من الدنيا وما فيها
  - motif: houri-wears-seventy-robes-marrow-seen
    refs:
    - Jāmiʿ 60:7522.4
    note: للرجل من أهل الجنة زوجتان من حور العين، على كل واحدة سبعون حُلَّة، يُرى مُخُّ ساقها من وراء الثياب
- id: hadith-60-gardens-of-silver-and-gold
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Two gardens of silver, two of gold; the cloak of grandeur on his face (Q 55:62)
  read:
  - Jāmiʿ 60:7523.1
  quran:
  - 55:62
  tags:
  - motif: two-gardens-silver-two-gold-cloak-of-grandeur
    refs:
    - Jāmiʿ 60:7523.1
    note: جنتان من فضة آنيتهما وما فيهما، وجنتان من ذهب ... وما بين القوم وبين أن ينظروا إلى ربهم إلا رداء الكبر على وجهه في جنة عدن
  - motif: might-his-loincloth-grandeur-his-cloak
    refs:
    - Jāmiʿ 60:7523.1
    note: رداء الكبر على وجهه
- id: hadith-60-tent-of-pearl
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Houris in tents: a tent of one hollow pearl sixty miles (Q 55:72)'
  read:
  - Jāmiʿ 60:7523.2
  quran:
  - 55:72
  tags:
  - motif: tent-of-hollow-pearl-sixty-miles
    refs:
    - Jāmiʿ 60:7523.2
    note: إن في الجنة خيمة من لؤلؤة مجوفة، عرضها ستون ميلا، في كل زاوية منها أهلٌ ما يرون الآخرين، يطوف عليهم المؤمنون / طولها في السماء ستون ميلا
- id: hadith-60-possessor-of-majesty
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: '''O Possessor of majesty and honour'' after prayer (Q 55:78)'
  read:
  - Jāmiʿ 60:7523.3-7524.1
  quran:
  - 55:78
  tags:
  - motif: cling-to-ya-dha-l-jalal
    refs:
    - Jāmiʿ 60:7523.3
    note: ألظوا بيا ذا الجلال والإكرام
  - motif: after-salam-istighfar-thrice-anta-l-salam
    refs:
    - Jāmiʿ 60:7523.4
    - Jāmiʿ 60:7524.1
    note: 'استغفر الله ثلاثًا، وقال: اللهم! أنت السلام، ومنك السلام، تباركت ذا الجلال والإكرام / إذا سَلَّم لم يقعد إلا مقدار ما يقول'
- id: hadith-60-the-raid-dream
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: A woman's dream of twelve martyrs eating fruit of their choosing (Q 56:20)
  read:
  - Jāmiʿ 60:7524.2
  quran:
  - '56:20'
  tags:
  - motif: prophet-asks-who-dreamt
    refs:
    - Jāmiʿ 60:7524.2
    note: 'كان رسول الله ﷺ تعجبه الرؤيا الحسنة، فربما قال: هل رأى أحد منكم رؤيا؟'
  - motif: dream-foretells-twelve-martyrs-of-a-raid
    refs:
    - Jāmiʿ 60:7524.2
    note: حتى عدت اثني عشر رجلا ... عليهم ثياب طلس تشخب أوداجهم ... نهر البيذخ ... فخرجوا منه وجوههم كالقمر ليلة البدر ... بكراسي من ذهب ... فيها بسر ... فما يقلبونها لشق إلا أكلوا من فاكهة ما أرادوا
- id: hadith-60-birds-of-al-kawthar
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The birds of al-Kawthar (Q 56:21)
  read:
  - Jāmiʿ 60:7525.1
  quran:
  - '56:21'
  tags:
  - motif: kawthar-birds-necks-like-camels
    refs:
    - Jāmiʿ 60:7525.1
    note: ذاك نهر أعطانيه الله ... أشد بياضا من اللبن، وأحلى من العسل، فيها طير أعناقها كأعناق الجزر ... أكلتها أحسن منها
- id: hadith-60-trees-of-paradise
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Thornless lote and talh, the hundred-year shade, the grape cluster, Tuba, the pool and the handfuls (Q 56:28-34)
  read:
  - Jāmiʿ 60:7525.2-7527.3
  quran:
  - 56:28-34
  tags:
  - motif: lote-thorns-become-fruits-seventy-two-colours
    refs:
    - Jāmiʿ 60:7525.2
    note: لقد ذكر الله في القرآن شجرة مؤذية ... السدر؟ فإن لها شوكا ... يخضد الله شوكه، فيجعل مكان كل شوكة ثمرة ... عن اثنين وسبعين لونا
  - motif: talh-thorn-like-castrated-goat-seventy-colours
    refs:
    - Jāmiʿ 60:7526.1
    note: 'شجرة لا أعلم أكثر شوكا منها يعني الطلح، فقال: التيس الملبود يعني الخصي، فيها سبعون لونا من الطعام'
  - motif: paradise-tree-shade-hundred-years-ride
    refs:
    - Jāmiʿ 60:7526.2
    - Jāmiʿ 60:7526.3
    - Jāmiʿ 60:7526.4
    - Jāmiʿ 60:7527.1
    note: إن في الجنة شجرة يسير الراكب في ظلها مائة عام لا يقطعها / الراكبُ الجوادَ الْمُضمَّر السريعَ مائة عام
  - motif: grape-cluster-reached-in-eclipse-prayer
    refs:
    - Jāmiʿ 60:7527.2
    note: 'رأيناك تناولت شيئا ... ثم رأيناك تكعكعت. فقال: إني رأيت الجنة، فتناولت منها عنقودا، ولو أخذته لأكلتم منه ما بقيت الدنيا'
  - motif: pool-as-far-as-bayda-to-busra
    refs:
    - Jāmiʿ 60:7527.3
    note: كما بين البيضاء إلى بُصرى، يَمُدُّني الله فيه بكراع لا يدري إنسان ممن خُلِق أين طرفاه ... فقراء المهاجرين
  - motif: seventy-thousand-enter-without-reckoning
    refs:
    - Jāmiʿ 60:7527.3
    note: أن يدخل الجنة من أمتي سبعين ألفا بغير حساب
  - motif: each-thousand-intercedes-for-seventy-thousand-three-handfuls
    refs:
    - Jāmiʿ 60:7527.3
    note: ثم يشفع كل ألف بسبعين ألف، ثم يحثي ربي ﵎ بكفيه ثلاث حثيات
  - motif: tuba-tree-like-walnut-of-syria
    refs:
    - Jāmiʿ 60:7527.3
    note: وفيها شجرة تدعى طوبى، هي تطابق الفردوس ... تشبه شجرة في الشام، تدعى الجوزة، تنبت على ساق واحد ... لو ارتحلت جذعة من إبل أهلك لما قطعتها حتى تنكسر ترقوتها هرما
  - motif: grape-cluster-a-month-of-crows-flight
    refs:
    - Jāmiʿ 60:7527.3
    note: 'ما عظم العنقود منها؟ قال: مسيرة شهر للغراب الأبقع لا ينثني ولا يفتر ... فإن تلك الحبة تشبعني وأهل بيتي ... وعامة عشيرتك'
  hints:
  - Grape clusters of fabulous size in the coming age against 2 Bar 29:5 and Papias (Irenaeus, Adv. Haer. 5.33.3), each cluster of ten thousand grapes and each grape yielding twenty-five measures of wine; the grape cluster carried by two men in Num 13:23.
- id: hadith-60-virgins-of-paradise
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Wives made virgins again (Q 56:35-37)
  read:
  - Jāmiʿ 60:7529.1-7529.2
  quran:
  - 56:35-37
  tags:
  - motif: hundred-virgins-a-day
    refs:
    - Jāmiʿ 60:7529.1
    note: 'أنفضي إلى نسائنا في الجنة؟ فقال: أي والذي نفسي بيده! إن الرجل ليفضي في اليوم الواحد إلى مائة عذراء'
  - motif: wife-returns-virgin-after-intercourse
    refs:
    - Jāmiʿ 60:7529.2
    note: 'أنطأ في الجنة؟ قال: نعم، والذي نفسي بيده دحمًا دحمًا، فإذا قام عنها رجعت مطهرة بكرا'
- id: hadith-60-a-throng-of-the-later
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The prophets shown with their followers; seventy thousand; Ukkasha; half of paradise (Q 56:39-40)
  read:
  - Jāmiʿ 60:7530.1
  quran:
  - 56:39-40
  tags:
  - motif: prophets-shown-with-followers-some-with-none
    refs:
    - Jāmiʿ 60:7530.1
    note: عرضت عليّ الأنبياء الليلة بأتباعها ... والنبيّ ليس معه من قومه أحد، حتى أتى عليَّ موسى بن عمران في كبكبة من بني إسرائيل ... وإذا ظراب من ظراب مكة قد سدَّ وجوه الرجال
  - motif: seventy-thousand-enter-without-reckoning
    refs:
    - Jāmiʿ 60:7530.1
    note: إن مع هؤلاء سبعين ألفا يدخلون الجنة لا حساب عليهم ... الذين لا يسترقون ولا يكتوون ولا يتطيرون وعلى ربهم يتوكلون
  - motif: sabaqaka-biha-ukkasha
    refs:
    - Jāmiʿ 60:7530.1
    note: اللهم! اجعله منهم ... سبقك بها عكاشة
  - motif: hope-quarter-third-half-of-paradise
    refs:
    - Jāmiʿ 60:7530.1
    note: إني لأرجو أن يكون من تبعني من أمتي ربع أهل الجنة ... الثلث ... الشطر
- id: hadith-60-the-sower
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: What a bird or beast eats of one's planting is charity (Q 56:63-64)
  read:
  - Jāmiʿ 60:7531.1
  quran:
  - 56:63-64
  tags:
  - motif: planting-eaten-by-bird-or-beast-is-charity
    refs:
    - Jāmiʿ 60:7531.1
    note: ما من مسلم يغرس غرسا، أو يزرع زرعا فيأكل منه طير أو إنسان أو بهيمة إلا كان له به صدقة
- id: hadith-60-fire-as-reminder
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Earthly fire one seventieth of hell's (Q 56:73)
  read:
  - Jāmiʿ 60:7531.2
  quran:
  - 56:73
  tags:
  - motif: earthly-fire-one-seventieth-of-hell
    refs:
    - Jāmiʿ 60:7531.2
    note: نار بني آدم التي يوقدون جزء من سبعين جزءا من نار جهنم ... إنها فُضِّلت عليها بتسعة وستين جزءا
  hints:
  - Earthly fire as a sixtieth part of Gehinnom against b. Berakhot 57b, 'fire is one sixtieth of Gehinnom'.
- id: hadith-60-rain-by-a-star
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: '''We had rain by such a star'' (Q 56:75-82)'
  read:
  - Jāmiʿ 60:7532.1-7532.3
  quran:
  - 56:75-82
  tags:
  - motif: rain-by-mercy-or-by-star
    refs:
    - Jāmiʿ 60:7532.1
    - Jāmiʿ 60:7532.2
    - Jāmiʿ 60:7532.3
    note: 'لقد صدق نوءُ كذا وكذا ... فنزلت / بالحديبيّة على إثر سماء ... مُطرنا بفضل الله ورحمته ... مُطرنا بنوء كذا وكذا، فذلك كافر بي، مؤمن بالكوكب / يقولون: الكواكب وبالكواكب'
- id: hadith-60-rest-and-fragrance
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: '''Fa-ruhun'' read with u; the love of meeting God (Q 56:89)'
  read:
  - Jāmiʿ 60:7533.1-7533.2
  quran:
  - 56:89
  tags:
  - motif: fa-ruhun-read-with-damma
    refs:
    - Jāmiʿ 60:7533.1
    note: 'سمعت النبي ﷺ يقرؤها: فَرُوْحٌ وَرَيْحَانٌ برفع الراء'
  - motif: love-of-meeting-god-returned
    refs:
    - Jāmiʿ 60:7533.2
    note: من أحب لقاءَ الله أحب الله لقاءَه ... أكراهيةُ الموت؟ فكلنا نكره الموتَ ... إذا بُشِّر برحمة الله ورضوانه وجنته
- id: hadith-60-glorify-the-name
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Two phrases heavy in the balance; a palm planted in paradise (Q 56:96)
  read:
  - Jāmiʿ 60:7534.1-7534.2
  quran:
  - 56:96
  tags:
  - motif: two-words-light-on-tongue-heavy-in-scale
    refs:
    - Jāmiʿ 60:7534.1
    note: 'كلمتان خفيفتان على اللسان، ثقيلتان في الميزان، حبيبتان إلى الرحمن: سبحان الله وبحمده، سبحان الله العظيم'
  - motif: palm-planted-in-paradise-for-glorification
    refs:
    - Jāmiʿ 60:7534.2
    note: 'من قال: سبحان الله العظيم وبحمده غُرست له نخلة في الجنة'
- id: hadith-60-first-and-last
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'The bedtime prayer: First, Last, Outward, Inward (Q 57:3)'
  read:
  - Jāmiʿ 60:7535.1
  quran:
  - '57:3'
  tags:
  - motif: bedtime-prayer-first-last-outward-inward
    refs:
    - Jāmiʿ 60:7535.1
    note: أن يضطجع على شقه الأيمن ... ومنزل التوراة والإنجيل والفرقان ... اللهم! أنت الأول فليس قبلك شيء، وأنت الآخر فليس بعدك شي، وأنت الظاهر فليس فوقك شيء، وأنت الباطن فليس دونك شيء، اقض عنا الدين
  hints:
  - '''The First and the Last'' against Isa 44:6 (''I am the first, and I am the last'') and Rev 22:13.'
- id: hadith-60-time-for-hearts-to-humble
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Four years from islam to the rebuke (Q 57:16)
  read:
  - Jāmiʿ 60:7536.1
  quran:
  - '57:16'
  tags:
  - motif: rebuke-verse-four-years-after-islam
    refs:
    - Jāmiʿ 60:7536.1
    note: ما كان بين إسلامنا وبين أن عاتبنا الله بهذه الآية ... إلا أربع سنين
- id: hadith-60-the-upper-rooms
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The people of the upper rooms seen like a star on the horizon (Q 57:18-19)
  read:
  - Jāmiʿ 60:7536.2
  quran:
  - 57:18-19
  tags:
  - motif: people-of-upper-rooms-seen-like-distant-star
    refs:
    - Jāmiʿ 60:7536.2
    note: إن أهل الجنة يتراءون أهل الغرف من فوقهم، كما تتراءون الكوكب الدرّي الغابر من الأفق ... تلك منازل الأنبياء ... رجال آمنوا وصدقوا المرسلين
  hints:
  - The righteous shining like stars in ranks against Dan 12:3, 'they that turn many to righteousness as the stars for ever and ever'.
- id: hadith-60-the-woman-who-disputed
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Khawla's complaint of her husband's zihar and the expiation (Q 58:1)
  read:
  - Jāmiʿ 60:7537.1-7537.2
  quran:
  - '58:1'
  - 58:1-4
  tags:
  - motif: woman-who-disputes-with-prophet-heard
    refs:
    - Jāmiʿ 60:7537.1
    - Jāmiʿ 60:7537.2
    note: جاءت خولة بنت ثعلبة إلى رسول الله ﷺ تشكو زوجها
  - motif: gods-hearing-encompasses-all-voices
    refs:
    - Jāmiʿ 60:7537.1
    note: الحمد لله الذي وسع سمعه الأصوات ... فكان يخفى علي كلامهما
  - motif: zihar-repudiation-wife-as-mothers-back
    refs:
    - Jāmiʿ 60:7537.2
    note: 'وكان شيخًا كبيرًا قد ساء خلقه وضجر ... فغضب فقال: أنت علي كظهر أمي'
  - motif: wife-overpowers-old-husband-borrows-clothes
    refs:
    - Jāmiʿ 60:7537.2
    note: فواثبني وامتنعت منه، فغلبته بما تغلب به المرأة الشيخ الضعيف، فألقيته عني ... فاستعرت منها ثيابها
  - motif: zihar-expiation-slave-fast-or-feeding
    refs:
    - Jāmiʿ 60:7537.2
    note: مريه، فليعتق رقبة ... فليصم شهرين متتابعين ... فليطعم ستين مسكينًا وسقًا من تمر
  - motif: prophet-and-wife-each-give-a-basket-of-dates
    refs:
    - Jāmiʿ 60:7537.2
    note: 'فإنا سنعينه بعرق من تمر ... وأنا يا رسول الله! سأعينه بعرق آخر، قال: قد أصبت وأحسنت ... العرق: الصن'
- id: hadith-60-al-sam-alaykum
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: '''Death upon you'' answered ''and upon you''; God loves gentleness (Q 58:8)'
  read:
  - Jāmiʿ 60:7538.1-7539.3
  quran:
  - '58:8'
  tags:
  - motif: greeting-the-prophet-with-a-false-greeting
    refs:
    - Jāmiʿ 60:7538.1
    - Jāmiʿ 60:7539.1
    - Jāmiʿ 60:7539.2
    - Jāmiʿ 60:7539.3
    note: 'استأذن رهط من اليهود ... فقالوا: السام عليك / السام عليك يا أبا القاسم / سام عليك، ثم يقولون في أنفسهم'
  - motif: sam-alaykum-answered-wa-alaykum
    refs:
    - Jāmiʿ 60:7538.1
    - Jāmiʿ 60:7539.1
    - Jāmiʿ 60:7539.2
    note: 'قلت: عليكم / فقال: وعليكم'
  - motif: aisha-curses-back-told-god-loves-gentleness
    refs:
    - Jāmiʿ 60:7538.1
    - Jāmiʿ 60:7539.1
    note: 'بل عليكم السام واللعنة، فقال: يا عائشة! إن الله رفيق يحب الرفق في الأمر كله / وعليكم السام والذام ... لا تكوني فحاشة ... إن الله لا يحب الفحش والتفحش'
  - motif: our-prayer-on-them-answered-theirs-not
    refs:
    - Jāmiʿ 60:7539.2
    note: بلى قد سمعت، فرددت عليهم، وإنا نجاب عليهم، ولا يجابون علينا
