  - motif: returning-travellers-formula
    refs:
    - Jāmiʿ 60:7433.1
    note: 'وإذا رجع قالهن وزاد فيهن: آيبون تائبون عابدون لربنا حامدون'
- id: hadith-60-world-for-them
