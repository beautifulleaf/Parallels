  tags:
  - motif: see-your-lord-like-full-moon
    refs:
    - Jāmiʿ 60:7493.1
    note: 'فنظر إلى القمر ليلة أربع عشرة فقال: إنكم سترون ربكم كما ترون هذا، لا تضامون في رؤيته، فإن استطعتم أن لا تغلبوا على صلاة قبل طلوع الشمس وقبل غروبها'
  - motif: thirty-three-glorifications-after-prayer
    refs:
    - Jāmiʿ 60:7493.2
    - Jāmiʿ 60:7493.3
    note: 'ثلاثًا وثلاثين ... فتلك تسعة وتسعون ... تمامَ المائة: لا إله إلا الله ... غفرت خطاياه وإن كانت مثلَ زبدِ البحر'
  - motif: poor-complain-rich-outdo-them
    refs:
