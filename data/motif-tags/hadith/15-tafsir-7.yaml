  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'This world is theirs: the unbeliever fed for his good deeds, the mat on the prophet''s side, gold and silver vessels, the dead sheep (Q 43:33-35)'
