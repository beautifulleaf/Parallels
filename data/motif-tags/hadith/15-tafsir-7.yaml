# Hadith chunk 15: al-Jāmiʿ al-Kāmil book 60 (tafsir), pp. 7420-7539: Ghafir 40:27 to al-Mujadila 58:8.
# Read in full from the Arabic (292 hadith).
new_motifs:
  god-set-at-enemies-throats-prayer:
    label: 'Prayer when fearing a people: ''O God, we set you at their throats (nuhurihim) and seek refuge in you from their evils'''
    cluster: ritual
  abu-bakr-shields-prophet-quoting-will-you-kill-a-man:
    label: Abu Bakr pulls the throttler off the prophet at the Kaaba, crying 'Will you kill a man for saying my Lord is God?'
    cluster: sira
  sent-to-you-with-slaughter:
    label: To Quraysh seated in the Kaaba's shade the prophet says 'I was sent to you only with slaughter (al-dhabh)', pointing to his throat
    cluster: sira
  prophet-beaten-unconscious-abu-bakr-called-madman:
    label: They beat the prophet until he faints; Abu Bakr shouts the verse and they call him 'Ibn Abi Quhafa the madman'
    cluster: sira
  shepherd-who-fails-flock-denied-scent-of-paradise:
    label: Any servant whom God makes shepherd of a flock (ra'iyya) and who does not surround it with good counsel will not smell the scent of paradise
    cluster: ethics
  dead-shown-their-seat-morning-and-evening:
    label: 'When one of you dies his seat (in paradise or the fire) is shown to him morning and evening: ''this is your seat until God raises you'''
    cluster: eschatology
  whoever-harms-my-friend-war-declared:
    label: 'God: ''whoever is hostile to a friend (wali) of mine, I have declared war on him'''
    cluster: theology
  god-becomes-servants-hearing-sight-hand-foot:
    label: 'God: when I love my servant I become the hearing he hears with, the sight he sees with, the hand he strikes with, the foot he walks with'
    cluster: theology
  god-hesitates-over-believers-soul:
    label: 'God: I hesitate over nothing I do as over the believer''s soul: he hates death and I hate to hurt him'
    cluster: theology
  supplication-is-worship:
    label: '''Supplication is worship'' (al-du''a'' huwa l-''ibada), then the verse ''call on me and I will answer'' is recited'
    cluster: ritual
  god-angry-at-one-who-does-not-ask:
    label: Whoever does not ask God, God is angry with him
    cluster: theology
  old-woman-pushed-jar-broken-appeals-to-judgment:
    label: A youth in Abyssinia pushes an old woman carrying a water jar on her head; it breaks; she warns him of the day God sets the kursi and hands and feet speak
    cluster: eschatology
  community-that-does-not-right-the-weak-not-sanctified:
    label: '''How will God sanctify a community in which the weak is not given his due from the strong?'''
    cluster: ethics
  three-men-at-kaaba-ask-whether-god-hears-whispers:
    label: Three men at the House, 'little understanding in their hearts, much fat on their bellies', debate whether God hears what they say aloud but not what they hide
    cluster: polemic
  say-i-believe-then-be-upright:
    label: 'Asked for one saying that needs no further asking: ''Say: I believe in God, then be upright (fa-staqim)'''
    cluster: ethics
  love-of-meeting-god-returned:
    label: 'Who loves meeting God, God loves meeting him; who hates meeting God, God hates meeting him: told at death of God''s pleasure or punishment'
    cluster: eschatology
  gabriel-in-human-form-teaches-faith:
    label: 'A man questions the prophet before the people on faith, islam, ihsan and the Hour, then goes; sought, he is not found: ''that was Gabriel, come to teach people their religion'''
    cluster: angelology
  slave-woman-bears-her-lord-herders-vie-in-building:
    label: 'Signs of the Hour: the slave-woman gives birth to her lord, and the herders of camels compete in tall buildings'
    cluster: eschatology
  hour-among-five-known-only-to-god:
    label: The time of the Hour is among five things none knows but God (Q 31:34)
    cluster: eschatology
  revelation-like-ringing-bell:
    label: Revelation sometimes comes like the ringing of a bell (salsalat al-jaras), the hardest on him; sometimes the angel takes the form of a man and speaks
    cluster: revelation
  mecca-best-of-gods-land-left-only-when-driven-out:
    label: 'Standing at al-Hazwara in Mecca''s market: ''you are the best of God''s land, the dearest to God; had I not been driven out I would not have left'''
    cluster: sira
  sent-to-red-and-black-not-one-people:
    label: Every prophet was sent to his own people; this prophet to every red and black
    cluster: revelation
  you-are-with-whom-you-love:
    label: 'Asked when the Hour is: ''what have you prepared for it?'' - ''love of God and his messenger'' - ''you are with whom you love'''
    cluster: eschatology
  community-promised-height-victory-worldly-deed-unrewarded:
    label: Give this community tidings of brightness, height, victory and power in the land; who does a deed of the hereafter for this world has no share in the hereafter
    cluster: ethics
  kinship-with-every-clan-of-quraysh:
    label: 'There was no clan of Quraysh with which the prophet had no kinship: ''only that you keep the kinship between me and you'''
    cluster: sira
  lost-camel-found-man-misspeaks-in-joy:
    label: 'God''s joy at repentance is greater than that of a man in the desert who finds his lost camel with his food on it and in his joy misspeaks: ''O God, you are my servant and I am your lord'''
    cluster: theology
  rebuke-may-his-forehead-be-dusted:
    label: 'His only reproach: ''what is wrong with him, may his forehead be dusted (tariba jabinuhu)'''
    cluster: sira
  takbir-three-times-on-mounting-for-journey:
    label: Mounting his camel for a journey he says 'God is greatest' three times, then the verse of subjection and a travel prayer
    cluster: ritual
  god-the-companion-on-journey-deputy-over-family:
    label: '''O God, you are the companion on the journey and the deputy (khalifa) over the family'''
    cluster: ritual
  unbeliever-fed-in-world-for-his-good-deeds:
    label: The believer is rewarded for a good deed in this world and the next; the unbeliever is fed in this world for good done for God and arrives with no good deed left
    cluster: eschatology
  prophet-on-mat-marks-on-side-kisra-and-caesar:
    label: 'Umar finds the prophet on a mat with nothing between, its marks on his side, and weeps: Kisra and Caesar live as they do: ''are you not content it is theirs in this world and ours in the next?'''
    cluster: sira
  gold-silver-vessels-and-silk-are-theirs-in-world:
    label: 'Do not drink from gold or silver vessels or wear brocade and silk: they are theirs in this world and yours in the hereafter'
    cluster: law
  world-worth-less-than-gnats-wing:
    label: 'A dead sheep with leg in the air: the world is meaner to God than this to its owner; were it worth a gnat''s wing he would not give an unbeliever a sip of it'
    cluster: ethics
  people-astray-given-disputation:
    label: No people went astray after guidance but they were given disputation (al-jadal)
    cluster: polemic
  nothing-worshipped-besides-god-has-good:
    label: '''There is no one worshipped besides God in whom there is good'' - Quraysh object: then Jesus too?'
    cluster: polemic
  no-one-enters-paradise-by-deeds-not-even-prophet:
    label: No one's deeds will bring him into paradise - 'not even you?' - 'not even I, unless God covers me with his mercy'
    cluster: theology
  most-beloved-deed-most-constant:
    label: The deed most beloved to God is the most constant even if little
    cluster: ethics
  every-person-has-seat-in-paradise-and-fire:
    label: Everyone has two dwellings, one in paradise and one in the fire; when one dies and enters the fire, the people of paradise inherit his dwelling
    cluster: eschatology
  seek-night-of-decree-in-odd-last-ten:
    label: Seek the Night of Decree in the odd nights of the last ten of Ramadan
    cluster: ritual
  years-like-josephs-years-invoked-on-quraysh:
    label: When Quraysh resisted, the prophet prayed against them for 'years like the years of Joseph'; they ate bones in the famine
    cluster: sira
  great-assault-is-badr:
    label: '''The day we strike the great assault'' (al-batsha al-kubra) is the day of Badr'
    cluster: sira
  five-signs-already-past:
    label: 'Five have already passed: al-lizam, al-Rum, the assault, the moon and the smoke'
    cluster: eschatology
  ten-signs-before-the-hour:
    label: 'The Hour will not come before ten signs: smoke, Dajjal, the beast, sun rising from the west, descent of Jesus, Gog and Magog, three sinkings (east, west, Arabia), and a fire from Yemen driving people to their gathering'
    cluster: eschatology
  death-brought-and-slaughtered-between-paradise-and-fire:
    label: When paradise and fire are filled, death is brought, set between them and slaughtered; a herald calls 'no death' to both
    cluster: eschatology
  paradise-herald-four-nevers:
    label: 'A herald in paradise: you will be healthy and never ill, live and never die, be young and never age, enjoy and never be wretched'
    cluster: eschatology
  no-sleep-in-paradise-sleep-brother-of-death:
    label: Do the people of paradise sleep? 'No; sleep is the brother of death'
    cluster: eschatology
  do-not-curse-time-god-is-time:
    label: 'God: the son of Adam hurts me by cursing Time; I am Time (ana l-dahr), the affair is in my hand, I turn night and day'
    cluster: theology
  paradise-and-fire-dispute:
    label: 'Paradise and the fire dispute: the fire is given the proud and tyrants, paradise only the weak and lowly; God: ''you are my mercy'', ''you are my punishment'', each will be filled'
    cluster: eschatology
  god-forgets-one-who-forgot-meeting:
    label: 'God meets the servant: ''did I not honour you, give you lordship, a wife, horses and camels, let you rule and take the fourth?... did you think you would meet me?'' ''No.'' ''Then I forget you as you forgot me'''
    cluster: eschatology
  might-his-loincloth-grandeur-his-cloak:
    label: Might is his loincloth (izar), grandeur his cloak (rida'); whoever contends with me for them I punish
    cluster: theology
  trace-of-knowledge-is-line-drawing:
    label: '''a trace of knowledge'' (atharatin min ''ilm) explained as ''the line-drawing'' (al-khatt)'
    cluster: divination
  lots-cast-to-lodge-emigrants:
    label: The Ansar cast lots for the Emigrants; Uthman b. Maz'un fell to Umm al-'Ala''s household
    cluster: sira
  do-not-vouch-that-god-honoured-the-dead:
    label: '''How do you know God honoured him? By God, I do not know, though I am God''s messenger, what will be done with me'' - she never vouched for anyone again'
    cluster: eschatology
  prophet-in-synagogue-asks-for-twelve-witnesses:
    label: 'On their feast day the prophet enters the Jews'' synagogue in Medina: ''show me twelve men who bear witness... and God will lift his anger from every Jew under heaven''; none answers, three times'
    cluster: polemic
  names-hashir-aqib-muqaffi:
    label: '''I am al-Hashir, I am al-''Aqib, I am al-Muqaffi, whether you believe or deny'''
    cluster: sira
  scholar-praised-then-reviled-on-converting:
    label: The Jews call Ibn Salam the most learned of them and of his father and grandfather; when he witnesses for the prophet they say 'you lie' and revile him
    cluster: polemic
  only-ibn-salam-told-of-paradise-while-living:
    label: Sa'd heard the prophet say of no one walking the earth that he is of paradise except Abd Allah b. Salam
    cluster: sira
  verse-claimed-against-opponent-aisha-denies:
    label: 'Marwan says the verse on the son who says ''uff'' to his parents was revealed of Abd al-Rahman b. Abi Bakr; Aisha from behind the curtain: God revealed nothing of us except my acquittal'
    cluster: sira
  prophet-fears-clouds-and-wind:
    label: When he saw clouds or wind dislike showed in his face, he came and went; 'what assures me there is no punishment in it? A people were punished by wind'
    cluster: sira
  ads-envoy-drinks-with-two-singing-girls:
    label: '''Ad''s envoy (qayl) stays a month with Bakr drinking wine while two singing girls called ''the two locusts'' (al-jaradatan) sing'
    cluster: past-peoples
  black-clouds-take-it-as-ashes:
    label: 'Black clouds pass; a voice from them: ''take it as fine ash (ramadan rimdidan), leave none of ''Ad'''
    cluster: past-peoples
  wind-sent-on-ad-only-as-through-a-ring:
    label: Only as much wind was sent on 'Ad as passes through a finger-ring
    cluster: past-peoples
  jinn-search-east-and-west-for-cause:
    label: Barred from heaven's news, the devils are told 'travel the east and west of the earth' to find what came between them; one band finds the prophet praying at Nakhla
    cluster: angelology
  night-of-the-jinn-prophet-missing:
    label: 'The companions lose the prophet one night, fear he was snatched or assassinated, spend ''the worst night''; at dawn he comes from Hira'': ''the jinn''s summoner came to me'''
    cluster: angelology
  umars-guess-never-wrong:
    label: 'Whenever Umar said ''I think it is so'' it was as he thought: he identifies a passer-by as a former soothsayer'
    cluster: sira
  martyr-gifts-at-first-drop-of-blood:
    label: 'The martyr''s gifts with the first spurt of his blood: forgiven, shown his seat in paradise, spared the grave''s torment and the great terror, clothed in faith''s robe, wed to the houris, intercedes for seventy kin'
    cluster: martyrdom
  martyr-forgiven-all-but-debt:
    label: Every sin of the martyr is forgiven except debt
    cluster: martyrdom
  believers-held-on-bridge-for-retaliation:
    label: Believers saved from the fire are held on a bridge (qantara) between paradise and fire and settle wrongs between them before entering
    cluster: eschatology
  knows-paradise-home-better-than-earthly-home:
    label: Each knows his way to his dwelling in paradise better than to his dwelling in this world
    cluster: eschatology
  women-flee-up-mountain-anklets-showing:
    label: At Uhud the enemy women run up the mountain, skirts raised, anklets showing; the archers cry 'the booty!'
    cluster: warfare
  unbeliever-eats-in-seven-intestines:
    label: The believer eats in one intestine (mi'an wahid), the unbeliever in seven
    cluster: ethics
  guest-drinks-seven-goats-milk-then-one-after-islam:
    label: An unbelieving guest drinks the milk of seven goats; next morning, Muslim, he cannot finish a second
    cluster: sira
  ibn-umar-eats-only-with-a-poor-man:
    label: Ibn Umar would not eat until a poor man was brought to eat with him; he sends away one who eats much
    cluster: ethics
  four-seas-of-paradise-rivers-branch:
    label: In paradise is a sea of milk, a sea of water, a sea of honey and a sea of wine, and the rivers split off from them
    cluster: eschatology
  hundred-degrees-firdaws-under-throne-rivers-spring:
    label: A hundred degrees in paradise for those who strive, each two as far apart as heaven and earth; ask for al-Firdaws, its middle and highest, the Merciful's throne above it, paradise's rivers bursting from it
    cluster: eschatology
  sent-with-hour-like-two-fingers:
    label: '''I was sent and the Hour like these two'', joining forefinger and middle finger'
    cluster: eschatology
  companion-sees-seal-between-shoulders:
    label: After the prophet asks forgiveness for him, a companion goes round behind him and sees the seal of prophethood between his shoulders
    cluster: sira
  prayer-forgive-error-ignorance-excess:
    label: 'Prayer: ''forgive my error, my ignorance, my excess ... my seriousness and my jest ... what I put first and what I put last, what I hid and what I showed'''
    cluster: ritual
  prophet-seeks-forgiveness-over-seventy-times-daily:
    label: '''By God, I ask God''s forgiveness and repent to him more than seventy times a day'''
    cluster: ritual
  womb-seeks-refuge-from-severance:
    label: 'When God finished creation the womb (al-rahim) stood: ''this is the stand of one seeking refuge from severance''; God: ''I will join whoever joins you and cut whoever cuts you'''
    cluster: theology
  womb-a-branch-of-the-merciful:
    label: The womb is a branch (shijna) of the Merciful (al-Rahman); in Muslim's wording it hangs on the throne
    cluster: theology
  severing-kin-and-oppression-punished-in-this-world:
    label: No sin more deserves punishment hastened in this world besides what is stored for the next than oppression and cutting kinship
    cluster: ethics
  kin-keeping-extends-provision-and-life:
    label: Whoever wishes his provision widened and his trace (athar, lifespan) delayed should keep his kinship
    cluster: ethics
  true-kin-keeper-rejoins-when-cut:
    label: The kin-keeper is not the one who returns like for like but the one who rejoins when his kinship is cut
    cluster: ethics
  salmans-people-would-reach-religion-at-pleiades:
    label: 'Asked who would replace them, the prophet strikes Salman''s thigh: ''this man and his people; were religion at the Pleiades, men of Persia would reach it'''
    cluster: sira
  question-thrice-unanswered-fear-of-revelation:
    label: Umar asks the prophet three times on a night march and gets no answer; rebuking himself he rides ahead, fearing a verse will come down about him; he is called back
    cluster: sira
  surah-dearer-than-all-the-sun-rises-on:
    label: '''Tonight a surah was sent down to me dearer to me than all the sun rises on'' (al-Fath)'
    cluster: revelation
  why-accept-lowliness-in-our-religion:
    label: 'Umar asks the prophet, then Abu Bakr, in the same words: ''are we not in the right? why give lowliness (al-daniyya) in our religion?''; each answers ''he is God''s messenger and God will not abandon him'''
    cluster: sira
  is-it-a-conquest-yes:
    label: 'When al-Fath is revealed it is read to Umar: ''is it a conquest?'' - ''yes''; he is content'
    cluster: sira
  watchman-sleeps-camp-wakes-after-sunrise:
    label: '''Who will guard us?'' Bilal: ''I''; all sleep till sunrise; ''do as you used to do ... so do whoever sleeps or forgets'''
    cluster: ritual
  prophet-covers-head-under-revelation:
    label: When revelation came he withdrew behind them, covering his head with his garment, and it weighed on him
    cluster: revelation
  prays-until-feet-swell:
    label: He stood in prayer until his feet swelled or cracked; when he grew heavy he prayed sitting and stood to recite before bowing
    cluster: ritual
  sakina-descends-as-cloud-at-recitation:
    label: 'A man reciting al-Kahf with his mount in the house: it shies, a mist or cloud covers him: ''that was the sakina that came down for the Quran'''
    cluster: angelology
  opens-blind-eyes-deaf-ears-uncircumcised-hearts:
    label: 'In the Torah: God will not take him until he straightens the crooked creed, and by it opens blind eyes, deaf ears and uncircumcised hearts (qulub ghulf)'
    cluster: polemic
  pledged-not-to-flee-or-to-death:
    label: 'The pledge under the tree: Jabir ''not to flee, not to death''; Salama b. al-Akwa'' ''to death'''
    cluster: sira
  uthman-defended-on-three-charges:
    label: 'A pilgrim charges Uthman with fleeing at Uhud, missing Badr, missing the pledge; Ibn Umar: God pardoned the first, his wife the prophet''s daughter was ill (reward and share given), he was envoy in Mecca'
    cluster: sira
  pebble-flicking-forbidden:
    label: The prophet forbade flicking pebbles (al-khadhf)
    cluster: law
  oath-by-other-religion-and-suicide-by-iron:
    label: Whoever swears falsely by a religion other than Islam is as he said; whoever kills himself with iron is punished with it in hell
    cluster: law
  best-people-on-earth-today:
    label: '''You are today the best people on earth'', to the fourteen hundred at Hudaybiya; blind Jabir: ''could I see I would show you the tree''s place'''
    cluster: sira
  badr-and-hudaybiya-veteran-will-not-enter-fire:
    label: 'A slave complains Hatib will enter the fire: ''you lie; he will not enter it, for he was at Badr and Hudaybiya'''
    cluster: sira
  eighty-armed-meccans-captured-and-spared:
    label: Eighty armed Meccans come down from Mount al-Tan'im to take the prophet unawares; he takes them without a fight and lets them live
    cluster: sira
  treaty-written-muhammad-son-of-abd-allah:
    label: 'Suhayl holds the writer''s hand: ''we would have wronged you were you his messenger''; it is written ''what Muhammad son of Abd Allah made peace on'''
    cluster: sira
  armed-youths-blinded-and-released:
    label: Thirty armed youths rush the camp; the prophet prays, God seizes their sight, they are taken; asked if they came under anyone's protection, they say no, and he lets them go
    cluster: sira
  word-of-piety-is-shahada:
    label: '''The word of piety'' is ''no god but God, Muhammad is God''s messenger'', which the polytheists were too proud to accept at Hudaybiya'
    cluster: revelation
  umra-of-fulfilment-terms:
    label: 'Kept from the House he sacrifices and shaves at Hudaybiya; terms: perform umra next year, carry only swords, stay only as long as they like; after three days they tell him to leave'
    cluster: sira
  ramal-to-show-strength:
    label: Weakened by the fever of Yathrib, the pilgrims are told to jog (ramal) three circuits and walk between the corners so the polytheists by the hijr see their vigour
    cluster: ritual
  mercy-on-shavers-then-shorteners:
    label: '''O God, have mercy on those who shave''; asked ''and those who shorten?'' twice, he adds them the third time'
    cluster: ritual
  companions-mudd-outweighs-mountain-of-gold:
    label: 'Do not revile my companions: were one of you to spend gold like Uhud he would not reach a mudd of theirs, nor half'
    cluster: ethics
  best-generation-then-second-third:
    label: 'The best people: the generation (qarn) I am in, then the second, then the third'
    cluster: ethics
  voices-raised-over-tamims-commander:
    label: Abu Bakr proposes al-Qa'qa' b. Ma'bad, Umar al-Aqra' b. Habis to command Tamim; they quarrel until their voices rise, and the verse comes down
    cluster: sira
  umar-speaks-so-low-he-must-repeat:
    label: After the verse Umar spoke to the prophet so softly that he had to ask him to repeat
    cluster: sira
  loud-voiced-man-thinks-himself-damned:
    label: 'Thabit b. Qays, loud of voice, shuts himself at home saying ''my deeds are void, I am of the fire''; the prophet: ''no, he is of the people of paradise'''
    cluster: sira
  fighter-embalmed-and-shrouded-before-battle:
    label: 'At al-Yamama, when the line wavers, Thabit comes perfumed for burial and wearing his shroud: ''how badly you accustom your foes'', and fights till killed'
    cluster: warfare
  my-praise-adorns-my-blame-shames:
    label: 'A man calling from behind the rooms: ''my praise adorns and my blame disgraces''; the prophet: ''that is God'''
    cluster: sira
  prayer-in-ranks-after-uhud:
    label: 'After Uhud, the enemy gone: ''line up that I may praise my Lord''; in ranks he prays ''make faith beloved to us and adorn it in our hearts, make unbelief, transgression and disobedience hateful'''
    cluster: ritual
  pleased-by-good-grieved-by-evil-is-believer:
    label: '''Whoever is pleased by his good deed and pained by his bad deed is a believer'' (Umar at al-Jabiya quoting the prophet)'
    cluster: ethics
  donkey-smell-sparks-fight-with-palm-stalks:
    label: 'Abd Allah b. Ubayy: ''keep off, your donkey''s stink has hurt me''; an Ansari: ''his donkey smells better than you''; the two sides fight with palm stalks, hands and sandals'
    cluster: sira
  son-will-reconcile-two-great-parties:
    label: 'On the pulpit with al-Hasan beside him: ''this son of mine is a lord, and perhaps God will reconcile through him two great parties of Muslims'''
    cluster: sira
  help-wrongdoing-brother-by-restraining:
    label: '''Help your brother wrongdoer or wronged'' - ''how the wrongdoer?'' - ''take hold above his hands'''
    cluster: ethics
  just-on-pulpits-of-light-at-gods-right:
    label: The just will be on pulpits of light at the right of the Merciful, and both his hands are right
    cluster: eschatology
  relieve-distress-relieved-on-resurrection:
    label: The Muslim is the Muslim's brother; whoever relieves a believer's distress God relieves his on the day of resurrection; whoever covers a Muslim God covers him
    cluster: ethics
  angel-answers-and-to-you-likewise:
    label: No Muslim prays for his brother in his absence but the angel says 'and to you the like'
    cluster: angelology
  believers-like-building-fingers-interlaced:
    label: The believer to the believer is like a building, each part bracing the other - and he interlaced his fingers
    cluster: ethics
  believers-one-body-fever-and-sleeplessness:
    label: 'Believers in mutual love are like one body: when one limb complains the whole body answers with sleeplessness and fever'
    cluster: ethics
  two-or-three-names-each-nicknames:
    label: 'When the prophet came to Medina every man had two or three names; called by one he was angered: ''do not insult one another by nicknames'' came down'
    cluster: law
  suspicion-the-most-lying-speech:
    label: Beware suspicion, it is the most lying speech; do not spy, do not pry, do not compete, envy, hate or turn your backs; be servants of God, brothers
    cluster: ethics
  piety-is-here-pointing-to-chest:
    label: '''Piety is here'', pointing to his chest three times; all of a Muslim is sacred to a Muslim: his blood, wealth and honour'
    cluster: ethics
  no-shunning-brother-beyond-three-nights:
    label: It is not lawful for a Muslim to shun his brother more than three nights
    cluster: law
  backbiting-true-is-backbiting-false-is-slander:
    label: Backbiting is mentioning your brother with what he dislikes; if it is true you have backbitten him, if not you have slandered him (bahattahu)
    cluster: ethics
  word-that-would-pollute-the-sea:
    label: 'Aisha gestures that Safiyya is short: ''you have said a word that, mixed with the water of the sea, would pollute it'''
    cluster: ethics
  who-hunts-faults-exposed-in-own-house:
    label: '''You who believe with your tongue but faith has not entered your heart'': whoever tracks his brother''s faults, God tracks his and exposes him inside his house'
    cluster: ethics
  believer-more-sacred-than-the-kaaba:
    label: 'Ibn Umar to the Kaaba: ''how great you are and your sanctity, yet the believer is greater in sanctity before God than you'''
    cluster: ethics
  stinking-wind-from-backbiters:
    label: 'A foul wind like carrion rises: ''hypocrites backbit Muslims, and this wind was sent for it'' / ''this is the wind of those who backbite believers'''
    cluster: ethics
  backbiters-flesh-seen-between-teeth:
    label: 'Two companions ask the prophet for relish; ''you have had relish: your brother''s flesh, I see it between your front teeth''; the backbitten man must ask forgiveness for them'
    cluster: ethics
  shuub-great-tribes-qabail-clans:
    label: Peoples (shu'ub) are the great tribes, tribes (qaba'il) the clans (butun)
    cluster: law
  learn-genealogy-to-keep-kin:
    label: 'Learn enough of your genealogies to keep your kin: kin-keeping is love in the family, increase in wealth, delay in the term'
    cluster: ethics
  god-looks-at-hearts-not-forms:
    label: God does not look at your forms and wealth but at your hearts and deeds
    cluster: theology
  noblest-joseph-prophet-son-of-prophets:
    label: Who is noblest? 'the most pious' - not that - 'Joseph, prophet of God son of a prophet son of a prophet son of God's friend' - not that - 'the best of the Arabs before Islam are best in Islam if they understand'
    cluster: prophets
  no-arab-better-than-non-arab-but-by-piety:
    label: 'Mid-tashriq sermon: your Lord is one, your father is one; no Arab is better than a non-Arab nor red than black except by piety'
    cluster: ethics
  children-of-adam-short-of-the-measure:
    label: 'Your genealogies are no ground to revile anyone: you are children of Adam, a measure short of full (tuff al-sa'')'
    cluster: ethics
  gift-to-weaker-lest-he-fall-into-fire:
    label: Sa'd thrice calls a man a believer; 'or a Muslim?'; 'I give a man while another is dearer to me, fearing God will throw him on his face in the fire'
    cluster: ethics
  tribe-boasts-of-not-fighting-the-prophet:
    label: 'Banu Asad: ''all Mudar fought you and we did not ... we kept your kinship''; Abu Bakr and Umar: ''their understanding is little, Satan speaks on their tongues'''
    cluster: sira
  qaf-recited-at-dawn-friday-and-eids:
    label: The prophet recited Qaf in the dawn prayer, every Friday on the pulpit in the sermon, and with al-Qamar at both feasts
    cluster: ritual
  son-of-adam-denies-and-reviles-god:
    label: 'God: the son of Adam belies me saying I will not restore him as I began him, and reviles me saying God has taken a son'
    cluster: theology
  careless-word-raises-or-hurls-into-hell:
    label: A servant speaks a word pleasing God without heeding it and is raised degrees; a word angering God without heeding it and falls into hell
    cluster: ethics
  guarantee-what-between-jaws-and-legs:
    label: Whoever guarantees me what is between his two jaws and his two legs, I guarantee him paradise
    cluster: ethics
  speak-good-or-be-silent:
    label: 'Whoever believes in God and the last day: let him speak good or be silent, not harm (or do good to) his neighbour, and honour his guest'
    cluster: ethics
  death-has-agonies-wiping-face-with-water:
    label: 'Dying, the prophet dips his hands in a water vessel and wipes his face: ''no god but God, death has agonies''; then raising his hand: ''in the highest company'' until taken'
    cluster: sira
  neck-from-fire-seizes-three:
    label: 'A neck comes out of the fire speaking: ''I am charged today with three: every tyrant, whoever set another god with God, whoever killed a soul without right''; it folds over them and casts them into hell'
    cluster: eschatology
  lord-sets-foot-hell-says-enough:
    label: Hell is not full until the Lord of might sets his foot (rijl, qadam) in it; it says 'enough, enough' (qatt qatt) and folds in on itself
    cluster: eschatology
  new-creation-made-to-fill:
    label: 'To fill what remains God creates a new creation: for paradise in one wording, for the fire ''whom he wills'' in another'
    cluster: eschatology
  child-in-paradise-in-an-hour:
    label: When the believer in paradise desires a child, its carrying, birth and growth take an hour, as he wishes
    cluster: eschatology
  veil-lifted-sight-of-god-the-increase:
    label: In paradise God offers more; the veil is lifted and nothing given them is dearer than looking at their Lord (the 'increase')
    cluster: eschatology
  see-your-lord-like-full-moon:
    label: 'Looking at the full moon of the fourteenth: ''you will see your Lord as you see this, not crowding to see him''; so do not miss the prayers before sunrise and sunset'
    cluster: eschatology
  thirty-three-glorifications-after-prayer:
    label: 'After every prayer: ''glory to God'' 33, ''praise to God'' 33, ''God is greatest'' 33, completing a hundred with the tahlil; sins forgiven though like sea-foam'
    cluster: ritual
  poor-complain-rich-outdo-them:
    label: The poor complain the rich have taken the high ranks, praying and fasting like them but also giving; they are given the glorifications after prayer
    cluster: ritual
  glorify-after-every-prayer-adbar-al-sujud:
    label: '''After the prostrations'' (adbar al-sujud): he was told to glorify after all the prayers'
    cluster: ritual
  first-whose-grave-splits-first-intercessor:
    label: '''I am the lord of Adam''s children on the day of resurrection, the first from whom the grave splits, first to intercede, first whose intercession is accepted'''
    cluster: eschatology
  face-not-a-liars-face:
    label: Seeing the prophet's face on his arrival in Medina, Abd Allah b. Salam knew it was not the face of a liar
    cluster: sira
  lord-descends-in-last-third-of-night:
    label: 'Every night when the last third remains the Lord descends to the lowest heaven: ''who calls me that I may answer, asks me that I may give, seeks forgiveness that I may forgive?'''
    cluster: theology
  victory-by-east-wind-ad-destroyed-by-west-wind:
    label: '''I was given victory by the east wind (al-saba), and ''Ad were destroyed by the west wind (al-dabur)'''
    cluster: past-peoples
  devote-to-worship-chest-filled-with-wealth:
    label: 'God: son of Adam, devote yourself to my worship and I will fill your chest with wealth and close your need; if not, I will fill your hands with toil and not close it'
    cluster: theology
  tawaf-riding-behind-people-while-tur-recited:
    label: Umm Salama, ill, circles the House riding behind the people while the prophet prays beside the House reciting al-Tur
    cluster: ritual
  tur-recited-at-maghrib:
    label: The prophet recited al-Tur in the sunset prayer
    cluster: ritual
  rank-raised-by-childs-forgiveness-prayer:
    label: God raises a righteous servant a degree in paradise; 'whence this?' - 'by your child's asking forgiveness (or praying) for you'
    cluster: eschatology
  bind-him-and-await-death-like-the-poets:
    label: 'At Dar al-Nadwa one says: ''bind him and await the accident of fate till he perishes like the poets before him, Zuhayr and al-Nabigha'''
    cluster: sira
  heart-nearly-flew-at-verses:
    label: Hearing the prophet recite 'were they created from nothing...' in the sunset prayer, Jubayr b. Mut'im says 'my heart nearly flew'
    cluster: sira
  two-rakas-of-dawn-better-than-world:
    label: The two rak'as of dawn are better than the world and all in it; of all voluntary prayers he kept these most
    cluster: ritual
  write-nothing-but-truth-comes-out:
    label: 'Quraysh say do not write all he says, he speaks in anger and pleasure; he points to his mouth: ''write; by him in whose hand is my soul, only truth comes out of it'''
    cluster: revelation
  jests-but-says-only-truth:
    label: '''You joke with us'' - ''I say only what is true'''
    cluster: sira
  one-mans-intercession-for-multitudes-like-rabia-mudar:
    label: 'By the intercession of one man, not a prophet, as many as the two tribes Rabi''a and Mudar will enter paradise: ''I say only what I am made to say'''
    cluster: eschatology
  whoever-says-muhammad-saw-his-lord-lies:
    label: 'Aisha: three claims are a great lie against God: that Muhammad saw his Lord, that he hid any of God''s book, that he knows tomorrow; each answered with a verse'
    cluster: theology
  gabriel-seen-in-true-form-twice:
    label: '''It was Gabriel; I saw him in the form he was created in only these two times, descending from heaven, his vast frame filling what is between heaven and earth'''
    cluster: angelology
  gabriel-six-hundred-wings:
    label: He saw Gabriel with six hundred wings
    cluster: angelology
  green-rafraf-filling-horizon:
    label: Of 'his Lord's greatest signs' he saw a green rafraf (a green spread or cushion) that filled the horizon
    cluster: angelology
  three-given-at-lote-tree:
    label: 'At the lote tree he was given three: the five prayers, the closing verses of al-Baqara, and forgiveness of the grave sins for those of his community who associate nothing with God'
    cluster: revelation
  lat-was-man-who-mixed-sawiq:
    label: Al-Lat was a man who mixed barley-meal (sawiq) for the pilgrims
    cluster: polemic
  oath-by-lat-undone-by-tahlil:
    label: Whoever swears 'by al-Lat and al-'Uzza' must say 'no god but God' (three times, spit to the left thrice, seek refuge and not repeat); whoever says 'come, I will gamble with you' must give alms
    cluster: law
  look-at-what-you-wish-for:
    label: When one of you wishes, let him look at what he wishes, for he does not know what of his wish will be written for him
    cluster: ethics
  prayer-let-not-world-be-our-greatest-care:
    label: 'Rising from a gathering: ''apportion us fear of you ... do not make this world our greatest care nor the extent of our knowledge, nor set over us one who has no mercy'''
    cluster: ritual
  zina-of-eye-and-tongue-decreed:
    label: 'God has written for the son of Adam his share of fornication: the eye''s is looking, the tongue''s speaking; the soul wishes and desires, and the private part confirms or belies it'
    cluster: ethics
  if-you-forgive-forgive-much:
    label: 'The prophet''s verse: ''If you forgive, O God, you forgive much; and what servant of yours has not slipped (alamma)?'''
    cluster: ritual
  dead-infant-called-righteous-refuted:
    label: 'The Jews said of a small child who died ''he is a siddiq''; ''the Jews lie: no soul God creates in its mother''s belly but is wretched or blessed'''
    cluster: polemic
  name-barra-changed-do-not-praise-yourselves:
    label: 'A girl named Barra (''pious''): ''do not praise yourselves; God knows best who among you is pious; call her Zaynab'''
    cluster: law
  praise-cuts-friends-neck-say-i-reckon:
    label: '''Woe to you, you have cut your friend''s neck''; whoever must praise should say ''I reckon him so, God is his reckoner, I vouch for no one before God'''
    cluster: ethics
  throw-dust-in-flatterers-faces:
    label: 'Al-Miqdad kneels and throws pebbles in the face of a man praising Uthman: ''when you see the flatterers, throw dust in their faces'''
    cluster: ethics
  one-man-lifts-dust-to-forehead-instead-of-prostrating:
    label: 'At the first surah with a prostration all prostrate except one man who lifts a handful of dust and prostrates on it; he was later killed an unbeliever: Umayya b. Khalaf'
    cluster: sira
  najm-recited-without-prostrating:
    label: Zayd b. Thabit recited al-Najm to the prophet and he did not prostrate in it
    cluster: ritual
  your-term-like-asr-to-sunset:
    label: Your term among past nations is as between the afternoon prayer and sunset
    cluster: eschatology
  world-gone-like-dregs-of-a-vessel:
    label: 'Utba b. Ghazwan: the world has announced its end and turned away swiftly; only dregs remain like the dregs of a vessel'
    cluster: eschatology
  stone-falls-seventy-years-in-hell:
    label: A stone thrown from the lip of hell falls seventy years without reaching its bottom, and hell will be filled
    cluster: eschatology
  gate-of-paradise-forty-years-wide-yet-crowded:
    label: Between two leaves of a gate of paradise is forty years' journey, yet a day will come when it is jammed with the crowd
    cluster: eschatology
  seventh-of-seven-eating-leaves-sharing-cloak:
    label: '''I was the seventh of seven with the prophet; our only food was tree leaves until our mouths were sore; I found a cloak and split it with Sa''d'' - now each is governor of a city'
    cluster: sira
  prophethood-ends-in-kingship:
    label: There was never a prophethood but it was transformed till its end became kingship
    cluster: polemic
  travellers-confirm-moon-split:
    label: Quraysh call the split moon sorcery of Ibn Abi Kabsha and wait for travellers; all who came from every side said they saw it too
    cluster: sira
  muddakir-read-with-dal:
    label: 'Asked whether ''muddakir'' is read with dal or dhal: ''with dal; I heard Ibn Mas''ud say he heard the prophet say muddakir'''
    cluster: revelation
  prophet-pleads-in-tent-at-badr-abu-bakr-says-enough:
    label: 'In his tent at Badr: ''I adjure you by your covenant and promise; if you will, you will not be worshipped after today''; Abu Bakr takes his hand: ''enough, you have pressed your Lord''; he goes out in his mail reciting ''the host will be routed'''
    cluster: sira
  verse-revealed-when-aisha-was-a-girl-at-play:
    label: 'Aisha: ''the Hour is their tryst'' was revealed in Mecca when I was a girl at play; al-Baqara and al-Nisa'' only when I was with him'
    cluster: revelation
  first-revealed-paradise-and-hell-then-law:
    label: First came a surah of the mufassal with paradise and hell; when people turned to Islam the lawful and unlawful came; had 'do not drink wine' come first they would have said 'we will never leave wine'
    cluster: revelation
  quraysh-dispute-on-decree-verse-revealed:
    label: Polytheists of Quraysh come to argue with the prophet about decree (qadar), and 'we created everything by measure' comes down
    cluster: polemic
  deniers-of-decree-worst-of-community:
    label: 'Ibn Abbas, drawing Zamzam water: the verse came down about the deniers of decree; do not visit their sick or pray over their dead; ''I would gouge his eyes with these two fingers'''
    cluster: polemic
  everything-by-decree-even-incapacity-and-cleverness:
    label: '''Everything is by decree, even incapacity and cleverness (al-''ajz wa-l-kays)'''
    cluster: theology
  beware-trifling-deeds-they-have-a-seeker:
    label: '''Aisha, beware of deeds you think trifling, for they have a seeker from God'''
    cluster: ethics
  jinn-answer-refrain-better-than-companions:
    label: 'He recites al-Rahman and the companions are silent: the jinn answered better; at each ''which of your Lord''s favours will you deny?'' they said ''none of your favours, our Lord, do we deny; to you be praise'''
    cluster: angelology
  gods-affair-forgive-relieve-raise-lower:
    label: '''Every day he is in an affair'': it is of his affair to forgive a sin, relieve a distress, raise a people and lower others'
    cluster: theology
  even-if-he-fornicated-and-stole:
    label: 'On the pulpit: ''for him who fears his Lord''s station are two gardens''; Abu l-Darda'' asks three times ''even if he fornicated and stole?'' - ''yes, even if Abu l-Darda''''s nose be rubbed in dust'''
    cluster: theology
  rider-in-shade-of-lote-branch-hundred-years:
    label: In the shade of a branch of the lote of the boundary a rider travels a hundred years (or a hundred riders shelter); in it are golden moths, its fruit like jars (qilal)
    cluster: eschatology
  first-group-like-full-moon-two-wives-marrow-seen:
    label: The first group to enter paradise are like the full moon; they do not spit, blow their noses or defecate; vessels of gold, combs of gold and silver, censers of aloes-wood, sweat of musk; each has two wives whose shin-marrow is seen through the flesh
    cluster: eschatology
  no-bachelor-in-paradise:
    label: Disputing whether men or women are more in paradise, Abu Hurayra cites 'each has two wives ... and there is no bachelor in paradise'
    cluster: eschatology
  woman-of-paradise-would-light-the-earth:
    label: Were a woman of paradise to look out on the earth she would light and perfume all between; her headscarf is better than the world and what is in it
    cluster: eschatology
  houri-wears-seventy-robes-marrow-seen:
    label: Each man of paradise has two wives of the houris, each wearing seventy robes, the marrow of her shin seen through the clothes
    cluster: eschatology
  two-gardens-silver-two-gold-cloak-of-grandeur:
    label: Two gardens of silver, vessels and all in them, two of gold; nothing stands between the people and seeing their Lord but the cloak of grandeur on his face in the garden of Eden
    cluster: eschatology
  tent-of-hollow-pearl-sixty-miles:
    label: In paradise a tent of one hollow pearl sixty miles wide (or high); in each corner a family that does not see the others, and the believer goes round to them
    cluster: eschatology
  cling-to-ya-dha-l-jalal:
    label: '''Hold fast to (alizzu bi-) O Possessor of majesty and honour'''
    cluster: ritual
  after-salam-istighfar-thrice-anta-l-salam:
    label: Finishing prayer he asks forgiveness three times and says 'O God, you are Peace and from you is peace, blessed are you, possessor of majesty and honour', sitting only as long as that takes
    cluster: ritual
  prophet-asks-who-dreamt:
    label: Good dreams pleased him; he would ask 'has any of you seen a dream?' and question the dreamer
    cluster: sira
  kawthar-birds-necks-like-camels:
    label: 'Al-Kawthar, a river whiter than milk and sweeter than honey, has birds with necks like slaughter-camels; Umar: ''they are plump''; ''those who eat them are finer'''
    cluster: eschatology
  lote-thorns-become-fruits-seventy-two-colours:
    label: 'A bedouin objects that the lote (sidr) has thorns: ''thornless lote: God strips its thorns and puts a fruit in place of each, splitting into seventy-two colours of food, none like another'''
    cluster: eschatology
  talh-thorn-like-castrated-goat-seventy-colours:
    label: 'Of the thorny talh in paradise: (its fruit like) the castrated, felted billy-goat, seventy colours of food none like another'
    cluster: eschatology
  grape-cluster-reached-in-eclipse-prayer:
    label: 'In the eclipse prayer he reached forward then stepped back: ''I saw paradise and took a cluster; had I taken it you would eat from it as long as the world lasts'''
    cluster: eschatology
  pool-as-far-as-bayda-to-busra:
    label: The pool is like the distance from al-Bayda' to Busra; God supplies it with a stream (kura') whose ends no human knows
    cluster: eschatology
  each-thousand-intercedes-for-seventy-thousand-three-handfuls:
    label: Seventy thousand without reckoning, each thousand interceding for seventy thousand, then my Lord scoops three handfuls with his palms
    cluster: eschatology
  tuba-tree-like-walnut-of-syria:
    label: In paradise is a tree called Tuba, matching al-Firdaws; it resembles the walnut (jawza) of Syria, growing on one trunk spreading at the top; a young camel would not round its root before dying of age
    cluster: eschatology
  grape-cluster-a-month-of-crows-flight:
    label: A grape cluster of paradise is a month's journey for the piebald crow without pausing; one grape is like a great goatskin bucket and would feed a man's whole clan
    cluster: eschatology
  hundred-virgins-a-day:
    label: '''Shall we reach our wives in paradise?'' - ''yes, a man reaches in one day a hundred virgins'''
    cluster: eschatology
  wife-returns-virgin-after-intercourse:
    label: Intercourse in paradise 'dahman dahman', and when he rises from her she returns purified, a virgin
    cluster: eschatology
  prophets-shown-with-followers-some-with-none:
    label: 'The prophets are shown by night with their followers: three, a band, a few, one with none; then Moses in a host of the Children of Israel; then the prophet''s community filling the ridges of Mecca'
    cluster: eschatology
  sabaqaka-biha-ukkasha:
    label: 'Ukkasha asks to be of the seventy thousand: ''O God, make him one of them''; a second asks: ''Ukkasha has beaten you to it'''
    cluster: sira
  hope-quarter-third-half-of-paradise:
    label: '''I hope my followers will be a quarter of the people of paradise'' - they cry God is greatest - ''a third'' - ''half'''
    cluster: eschatology
  planting-eaten-by-bird-or-beast-is-charity:
    label: No Muslim plants a tree or sows a crop from which a bird, a person or a beast eats but it is charity for him
    cluster: ethics
  earthly-fire-one-seventieth-of-hell:
    label: The fire people kindle is one of seventy parts of the fire of hell; 'it would suffice!' - 'it was given sixty-nine parts more'
    cluster: eschatology
  fa-ruhun-read-with-damma:
    label: Aisha heard the prophet recite 'fa-ruhun wa-rayhan' with u (ruh, life) not 'fa-rawhun'
    cluster: revelation
  two-words-light-on-tongue-heavy-in-scale:
    label: 'Two phrases light on the tongue, heavy in the balance, beloved to the Merciful: ''glory to God and praise to him, glory to God the mighty'''
    cluster: ritual
  palm-planted-in-paradise-for-glorification:
    label: Whoever says 'glory to God the mighty and praise to him' has a palm tree planted for him in paradise
    cluster: ritual
  bedtime-prayer-first-last-outward-inward:
    label: 'Bedtime, lying on the right side: ''you are the First, nothing before you; the Last, nothing after you; the Outward, nothing above you; the Inward, nothing beneath you; settle our debt and free us from poverty'''
    cluster: ritual
  rebuke-verse-four-years-after-islam:
    label: Between our islam and God's rebuke in 'is it not time for those who believe ...' there were only four years
    cluster: revelation
  people-of-upper-rooms-seen-like-distant-star:
    label: The people of paradise see those of the upper rooms above them as you see a brilliant star lingering on the horizon; 'those are prophets' stations?' - 'men who believed and trusted the messengers'
    cluster: eschatology
  gods-hearing-encompasses-all-voices:
    label: 'Aisha: ''praise God whose hearing encompasses all voices'': the disputing woman''s words with the prophet were hidden from me in the same room, and God heard'
    cluster: theology
  wife-overpowers-old-husband-borrows-clothes:
    label: Khawla refuses her husband after his zihar, overpowers the weak old man, borrows a neighbour's clothes and goes to complain to the prophet
    cluster: law
  prophet-and-wife-each-give-a-basket-of-dates:
    label: 'The husband cannot free a slave, fast or feed sixty: ''we will help him with a basket (''araq) of dates'' - ''and I with another'' - ''you did well'''
    cluster: law
  sam-alaykum-answered-wa-alaykum:
    label: Jews greet the prophet 'al-sam (death) upon you'; he answers 'and upon you' (wa-'alaykum)
    cluster: polemic
  aisha-curses-back-told-god-loves-gentleness:
    label: Aisha retorts 'upon you be death and the curse'; 'Aisha, God is gentle and loves gentleness in all things ... do not be obscene'
    cluster: ethics
  our-prayer-on-them-answered-theirs-not:
    label: '''I returned it to them; we are answered against them and they are not answered against us'''
    cluster: theology
units:
- id: hadith-60-prayer-setting-god-at-enemies-throats
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Fearing a people, the prophet sets God at their throats (Q 40:27)
  read:
  - Jāmiʿ 60:7420.1
  quran:
  - '40:27'
  tags:
  - motif: god-set-at-enemies-throats-prayer
    refs:
    - Jāmiʿ 60:7420.1
    note: اللهم! إنا نجعلك في نحورهم، ونعوذ بك من شرورهم
- id: hadith-60-abu-bakr-will-you-kill-a-man
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Uqba throttles the prophet at the Kaaba; Abu Bakr cries the believer's words; 'I was sent to you with slaughter' (Q 40:28)
  read:
  - Jāmiʿ 60:7420.2-7421.1
  quran:
  - '40:28'
  tags:
  - motif: garment-twisted-round-prophets-neck
    refs:
    - Jāmiʿ 60:7420.2
    - Jāmiʿ 60:7420.3
    note: ولوى ثوبه في عنقه، فخنقه به خنقا شديدًا / فجعل رداءه في عنقه، ثمّ جذبه حتَّى وجب لركبتيه
  - motif: abu-bakr-shields-prophet-quoting-will-you-kill-a-man
    refs:
    - Jāmiʿ 60:7420.2
    - Jāmiʿ 60:7420.3
    - Jāmiʿ 60:7421.1
    note: 'فأخذ بمنكبه، ودفع عن رسول الله ﷺ، وقال: أتقتلون رجلا أن يقول ربي الله'
  - motif: sent-to-you-with-slaughter
    refs:
