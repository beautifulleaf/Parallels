# Hadith chunk 15: al-Jāmiʿ al-Kāmil book 60 (tafsir), pp. 7420-7539: Ghafir 40:27 to al-Mujadila 58:8.
# Read in full from the Arabic (292 hadith).
new_motifs:
  god-set-at-enemies-throats-prayer:
    label: 'Prayer when fearing a people: ''O God, we set you at their throats (nuhurihim) and seek refuge in you from their evils'''
    cluster: ritual
  abu-bakr-shields-prophet-quoting-will-you-kill-a-man:
    label: Abu Bakr pulls the throttler off the prophet at the Kaaba, crying 'Will you kill a man for saying my Lord is God?'
    cluster: sira
  sent-to-you-with-slaughter:
    label: To Quraysh seated in the Kaaba's shade the prophet says 'I was sent to you only with slaughter (al-dhabh)', pointing to his throat
    cluster: sira
  prophet-beaten-unconscious-abu-bakr-called-madman:
    label: They beat the prophet until he faints; Abu Bakr shouts the verse and they call him 'Ibn Abi Quhafa the madman'
    cluster: sira
  shepherd-who-fails-flock-denied-scent-of-paradise:
    label: Any servant whom God makes shepherd of a flock (ra'iyya) and who does not surround it with good counsel will not smell the scent of paradise
    cluster: ethics
  dead-shown-their-seat-morning-and-evening:
    label: 'When one of you dies his seat (in paradise or the fire) is shown to him morning and evening: ''this is your seat until God raises you'''
    cluster: eschatology
  whoever-harms-my-friend-war-declared:
    label: 'God: ''whoever is hostile to a friend (wali) of mine, I have declared war on him'''
    cluster: theology
  god-becomes-servants-hearing-sight-hand-foot:
    label: 'God: when I love my servant I become the hearing he hears with, the sight he sees with, the hand he strikes with, the foot he walks with'
    cluster: theology
  god-hesitates-over-believers-soul:
    label: 'God: I hesitate over nothing I do as over the believer''s soul: he hates death and I hate to hurt him'
    cluster: theology
  supplication-is-worship:
    label: '''Supplication is worship'' (al-du''a'' huwa l-''ibada), then the verse ''call on me and I will answer'' is recited'
    cluster: ritual
  god-angry-at-one-who-does-not-ask:
    label: Whoever does not ask God, God is angry with him
    cluster: theology
  old-woman-pushed-jar-broken-appeals-to-judgment:
    label: A youth in Abyssinia pushes an old woman carrying a water jar on her head; it breaks; she warns him of the day God sets the kursi and hands and feet speak
    cluster: eschatology
  community-that-does-not-right-the-weak-not-sanctified:
    label: '''How will God sanctify a community in which the weak is not given his due from the strong?'''
    cluster: ethics
  three-men-at-kaaba-ask-whether-god-hears-whispers:
    label: Three men at the House, 'little understanding in their hearts, much fat on their bellies', debate whether God hears what they say aloud but not what they hide
    cluster: polemic
  say-i-believe-then-be-upright:
    label: 'Asked for one saying that needs no further asking: ''Say: I believe in God, then be upright (fa-staqim)'''
    cluster: ethics
  love-of-meeting-god-returned:
    label: 'Who loves meeting God, God loves meeting him; who hates meeting God, God hates meeting him: told at death of God''s pleasure or punishment'
    cluster: eschatology
  gabriel-in-human-form-teaches-faith:
    label: 'A man questions the prophet before the people on faith, islam, ihsan and the Hour, then goes; sought, he is not found: ''that was Gabriel, come to teach people their religion'''
    cluster: angelology
  slave-woman-bears-her-lord-herders-vie-in-building:
    label: 'Signs of the Hour: the slave-woman gives birth to her lord, and the herders of camels compete in tall buildings'
    cluster: eschatology
  hour-among-five-known-only-to-god:
    label: The time of the Hour is among five things none knows but God (Q 31:34)
    cluster: eschatology
  revelation-like-ringing-bell:
    label: Revelation sometimes comes like the ringing of a bell (salsalat al-jaras), the hardest on him; sometimes the angel takes the form of a man and speaks
    cluster: revelation
  mecca-best-of-gods-land-left-only-when-driven-out:
    label: 'Standing at al-Hazwara in Mecca''s market: ''you are the best of God''s land, the dearest to God; had I not been driven out I would not have left'''
    cluster: sira
  sent-to-red-and-black-not-one-people:
    label: Every prophet was sent to his own people; this prophet to every red and black
    cluster: revelation
  you-are-with-whom-you-love:
    label: 'Asked when the Hour is: ''what have you prepared for it?'' - ''love of God and his messenger'' - ''you are with whom you love'''
    cluster: eschatology
  community-promised-height-victory-worldly-deed-unrewarded:
    label: Give this community tidings of brightness, height, victory and power in the land; who does a deed of the hereafter for this world has no share in the hereafter
    cluster: ethics
  kinship-with-every-clan-of-quraysh:
    label: 'There was no clan of Quraysh with which the prophet had no kinship: ''only that you keep the kinship between me and you'''
    cluster: sira
  lost-camel-found-man-misspeaks-in-joy:
    label: 'God''s joy at repentance is greater than that of a man in the desert who finds his lost camel with his food on it and in his joy misspeaks: ''O God, you are my servant and I am your lord'''
    cluster: theology
  rebuke-may-his-forehead-be-dusted:
    label: 'His only reproach: ''what is wrong with him, may his forehead be dusted (tariba jabinuhu)'''
    cluster: sira
  takbir-three-times-on-mounting-for-journey:
    label: Mounting his camel for a journey he says 'God is greatest' three times, then the verse of subjection and a travel prayer
    cluster: ritual
  god-the-companion-on-journey-deputy-over-family:
    label: '''O God, you are the companion on the journey and the deputy (khalifa) over the family'''
    cluster: ritual
  unbeliever-fed-in-world-for-his-good-deeds:
    label: The believer is rewarded for a good deed in this world and the next; the unbeliever is fed in this world for good done for God and arrives with no good deed left
    cluster: eschatology
  prophet-on-mat-marks-on-side-kisra-and-caesar:
    label: 'Umar finds the prophet on a mat with nothing between, its marks on his side, and weeps: Kisra and Caesar live as they do: ''are you not content it is theirs in this world and ours in the next?'''
    cluster: sira
  gold-silver-vessels-and-silk-are-theirs-in-world:
    label: 'Do not drink from gold or silver vessels or wear brocade and silk: they are theirs in this world and yours in the hereafter'
    cluster: law
  world-worth-less-than-gnats-wing:
    label: 'A dead sheep with leg in the air: the world is meaner to God than this to its owner; were it worth a gnat''s wing he would not give an unbeliever a sip of it'
    cluster: ethics
  people-astray-given-disputation:
    label: No people went astray after guidance but they were given disputation (al-jadal)
    cluster: polemic
  nothing-worshipped-besides-god-has-good:
    label: '''There is no one worshipped besides God in whom there is good'' - Quraysh object: then Jesus too?'
    cluster: polemic
  no-one-enters-paradise-by-deeds-not-even-prophet:
    label: No one's deeds will bring him into paradise - 'not even you?' - 'not even I, unless God covers me with his mercy'
    cluster: theology
  most-beloved-deed-most-constant:
    label: The deed most beloved to God is the most constant even if little
    cluster: ethics
  every-person-has-seat-in-paradise-and-fire:
    label: Everyone has two dwellings, one in paradise and one in the fire; when one dies and enters the fire, the people of paradise inherit his dwelling
    cluster: eschatology
  seek-night-of-decree-in-odd-last-ten:
    label: Seek the Night of Decree in the odd nights of the last ten of Ramadan
    cluster: ritual
  years-like-josephs-years-invoked-on-quraysh:
    label: When Quraysh resisted, the prophet prayed against them for 'years like the years of Joseph'; they ate bones in the famine
    cluster: sira
  great-assault-is-badr:
    label: '''The day we strike the great assault'' (al-batsha al-kubra) is the day of Badr'
    cluster: sira
  five-signs-already-past:
    label: 'Five have already passed: al-lizam, al-Rum, the assault, the moon and the smoke'
    cluster: eschatology
  ten-signs-before-the-hour:
    label: 'The Hour will not come before ten signs: smoke, Dajjal, the beast, sun rising from the west, descent of Jesus, Gog and Magog, three sinkings (east, west, Arabia), and a fire from Yemen driving people to their gathering'
    cluster: eschatology
  death-brought-and-slaughtered-between-paradise-and-fire:
    label: When paradise and fire are filled, death is brought, set between them and slaughtered; a herald calls 'no death' to both
    cluster: eschatology
  paradise-herald-four-nevers:
    label: 'A herald in paradise: you will be healthy and never ill, live and never die, be young and never age, enjoy and never be wretched'
    cluster: eschatology
  no-sleep-in-paradise-sleep-brother-of-death:
    label: Do the people of paradise sleep? 'No; sleep is the brother of death'
    cluster: eschatology
  do-not-curse-time-god-is-time:
    label: 'God: the son of Adam hurts me by cursing Time; I am Time (ana l-dahr), the affair is in my hand, I turn night and day'
    cluster: theology
  paradise-and-fire-dispute:
    label: 'Paradise and the fire dispute: the fire is given the proud and tyrants, paradise only the weak and lowly; God: ''you are my mercy'', ''you are my punishment'', each will be filled'
    cluster: eschatology
  god-forgets-one-who-forgot-meeting:
    label: 'God meets the servant: ''did I not honour you, give you lordship, a wife, horses and camels, let you rule and take the fourth?... did you think you would meet me?'' ''No.'' ''Then I forget you as you forgot me'''
    cluster: eschatology
  might-his-loincloth-grandeur-his-cloak:
    label: Might is his loincloth (izar), grandeur his cloak (rida'); whoever contends with me for them I punish
    cluster: theology
  trace-of-knowledge-is-line-drawing:
    label: '''a trace of knowledge'' (atharatin min ''ilm) explained as ''the line-drawing'' (al-khatt)'
    cluster: divination
  lots-cast-to-lodge-emigrants:
    label: The Ansar cast lots for the Emigrants; Uthman b. Maz'un fell to Umm al-'Ala''s household
    cluster: sira
  do-not-vouch-that-god-honoured-the-dead:
    label: '''How do you know God honoured him? By God, I do not know, though I am God''s messenger, what will be done with me'' - she never vouched for anyone again'
    cluster: eschatology
  prophet-in-synagogue-asks-for-twelve-witnesses:
    label: 'On their feast day the prophet enters the Jews'' synagogue in Medina: ''show me twelve men who bear witness... and God will lift his anger from every Jew under heaven''; none answers, three times'
    cluster: polemic
  names-hashir-aqib-muqaffi:
    label: '''I am al-Hashir, I am al-''Aqib, I am al-Muqaffi, whether you believe or deny'''
    cluster: sira
  scholar-praised-then-reviled-on-converting:
    label: The Jews call Ibn Salam the most learned of them and of his father and grandfather; when he witnesses for the prophet they say 'you lie' and revile him
    cluster: polemic
  only-ibn-salam-told-of-paradise-while-living:
    label: Sa'd heard the prophet say of no one walking the earth that he is of paradise except Abd Allah b. Salam
    cluster: sira
  verse-claimed-against-opponent-aisha-denies:
    label: 'Marwan says the verse on the son who says ''uff'' to his parents was revealed of Abd al-Rahman b. Abi Bakr; Aisha from behind the curtain: God revealed nothing of us except my acquittal'
    cluster: sira
  prophet-fears-clouds-and-wind:
    label: When he saw clouds or wind dislike showed in his face, he came and went; 'what assures me there is no punishment in it? A people were punished by wind'
    cluster: sira
  ads-envoy-drinks-with-two-singing-girls:
    label: '''Ad''s envoy (qayl) stays a month with Bakr drinking wine while two singing girls called ''the two locusts'' (al-jaradatan) sing'
    cluster: past-peoples
  black-clouds-take-it-as-ashes:
    label: 'Black clouds pass; a voice from them: ''take it as fine ash (ramadan rimdidan), leave none of ''Ad'''
    cluster: past-peoples
  wind-sent-on-ad-only-as-through-a-ring:
    label: Only as much wind was sent on 'Ad as passes through a finger-ring
    cluster: past-peoples
  jinn-search-east-and-west-for-cause:
    label: Barred from heaven's news, the devils are told 'travel the east and west of the earth' to find what came between them; one band finds the prophet praying at Nakhla
    cluster: angelology
  night-of-the-jinn-prophet-missing:
    label: 'The companions lose the prophet one night, fear he was snatched or assassinated, spend ''the worst night''; at dawn he comes from Hira'': ''the jinn''s summoner came to me'''
    cluster: angelology
  umars-guess-never-wrong:
    label: 'Whenever Umar said ''I think it is so'' it was as he thought: he identifies a passer-by as a former soothsayer'
    cluster: sira
units:
- id: hadith-60-prayer-setting-god-at-enemies-throats
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Fearing a people, the prophet sets God at their throats (Q 40:27)
  read:
  - Jāmiʿ 60:7420.1
  quran:
  - '40:27'
  tags:
  - motif: god-set-at-enemies-throats-prayer
    refs:
    - Jāmiʿ 60:7420.1
    note: اللهم! إنا نجعلك في نحورهم، ونعوذ بك من شرورهم
- id: hadith-60-abu-bakr-will-you-kill-a-man
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Uqba throttles the prophet at the Kaaba; Abu Bakr cries the believer's words; 'I was sent to you with slaughter' (Q 40:28)
  read:
  - Jāmiʿ 60:7420.2-7421.1
  quran:
  - '40:28'
  tags:
  - motif: garment-twisted-round-prophets-neck
    refs:
    - Jāmiʿ 60:7420.2
    - Jāmiʿ 60:7420.3
    note: ولوى ثوبه في عنقه، فخنقه به خنقا شديدًا / فجعل رداءه في عنقه، ثمّ جذبه حتَّى وجب لركبتيه
  - motif: abu-bakr-shields-prophet-quoting-will-you-kill-a-man
    refs:
    - Jāmiʿ 60:7420.2
    - Jāmiʿ 60:7420.3
    - Jāmiʿ 60:7421.1
    note: 'فأخذ بمنكبه، ودفع عن رسول الله ﷺ، وقال: أتقتلون رجلا أن يقول ربي الله'
  - motif: sent-to-you-with-slaughter
    refs:
    - Jāmiʿ 60:7420.3
    note: ما أرسلت إليكم إِلَّا بالذبح. وأشار بيده إلى حلقه ... أنت منهم (to Abu Jahl)
  - motif: prophet-beaten-unconscious-abu-bakr-called-madman
    refs:
    - Jāmiʿ 60:7421.1
    note: ضربوا رسول الله ﷺ مرة حتَّى غشي عليه ... ابن أبي قحافة المجنون
- id: hadith-60-shepherd-without-counsel
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The ruler who does not counsel his flock will not smell paradise (Q 40:29)
  read:
  - Jāmiʿ 60:7422.1
  quran:
  - '40:29'
  tags:
  - motif: shepherd-who-fails-flock-denied-scent-of-paradise
    refs:
    - Jāmiʿ 60:7422.1
    note: ما من عبد استرعاه الله رعية، فلم يَحُطها بنصيحة إِلَّا لم يجد رائحة الجنّة (told by the dying Ma`qil to Ubayd Allah b. Ziyad)
  hints:
  - The ruler as shepherd judged for failing the flock against Ezek 34:2-10, the shepherds of Israel who feed themselves and not the sheep.
- id: hadith-60-seat-shown-morning-and-evening
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The dead shown their seat morning and evening (Q 40:46)
  read:
  - Jāmiʿ 60:7422.2
  quran:
  - '40:46'
  tags:
  - motif: dead-shown-their-seat-morning-and-evening
    refs:
    - Jāmiʿ 60:7422.2
    note: إذا مات عرض عليه مقعده بالغداة والعشي ... هذا مقعدك حتَّى يبعثك الله إلى يوم القيامة
- id: hadith-60-war-on-gods-friend
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: God declares war on whoever harms his friend and becomes the hearing and sight of the servant he loves (Q 40:51)
  read:
  - Jāmiʿ 60:7422.3
  quran:
  - '40:51'
  tags:
  - motif: whoever-harms-my-friend-war-declared
    refs:
    - Jāmiʿ 60:7422.3
    note: من عادى لي وليا، فقد آذنته بالحرب
  - motif: god-becomes-servants-hearing-sight-hand-foot
    refs:
    - Jāmiʿ 60:7422.3
    note: كنت سمعه الذي يسمع به، وبصره الذي يبصر به، ويده التي يبطش بها، ورجله التي يمشي بها
  - motif: god-hesitates-over-believers-soul
    refs:
    - Jāmiʿ 60:7422.3
    note: وما ترددت عن شيء أنا فاعله تردّدي عن نفس المؤمن، يكره الموت، وأنا أكره مساءته
- id: hadith-60-supplication-is-worship
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Supplication is worship; God is angry with whoever does not ask (Q 40:60)
  read:
  - Jāmiʿ 60:7423.1-7423.2
  quran:
  - 40:60
  tags:
  - motif: supplication-is-worship
    refs:
    - Jāmiʿ 60:7423.1
    note: 'الدعاء هو العبادة، ثمّ قرأ: وقال ربكم ادعوني أستجب لكم'
  - motif: god-angry-at-one-who-does-not-ask
    refs:
    - Jāmiʿ 60:7423.2
    note: 'من لم يسأل الله يغضب عليه، وفي لفظ: من لم يدع الله'
- id: hadith-60-old-womans-broken-jar
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Wonders of Abyssinia: the old woman whose jar was broken warns of the day hands and feet speak (Q 41:20-21)'
  read:
  - Jāmiʿ 60:7425.1
  quran:
  - 41:20-21
  tags:
  - motif: old-woman-pushed-jar-broken-appeals-to-judgment
    refs:
    - Jāmiʿ 60:7425.1
    note: عجوز من عجائز رهابينهم، تحمل على رأسها قلة من ماء ... فانكسرت قلتها ... سوف تعلم، يا غدر! إذا وضع الله الكرسي، وجمع الأوّلين والآخرين، وتكلمت الأيدي والأرجل
  - motif: skins-testify-against-damned
    refs:
    - Jāmiʿ 60:7425.1
    note: 'bab Q 41:20-21; in the report the hands and feet speak: وتكلمت الأيدي والأرجل بما كانوا يكسبون'
  - motif: community-that-does-not-right-the-weak-not-sanctified
    refs:
    - Jāmiʿ 60:7425.1
    note: صدقت، صدقت، كيف يقدّس اللهُ أُمَّةً لا يؤخذ لضعيفهم من شديدهم
- id: hadith-60-does-god-hear-our-whisper
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Three men at the House debate whether God hears what they hide (Q 41:22-23)
  read:
  - Jāmiʿ 60:7426.1
  quran:
  - 41:22-23
  tags:
  - motif: three-men-at-kaaba-ask-whether-god-hears-whispers
    refs:
    - Jāmiʿ 60:7426.1
    note: قرشيان وثقفي أو ثقفيان وقرشي، قليل فقه قلوبهم، كثير شحم بطونهم ... يسمع إن جهرنا ولا يسمع إن أخفينا
  hints:
  - The doubt whether God hears what is hidden against Ps 94:7-9, 'they say, The LORD shall not see ... He that planted the ear, shall he not hear?'
- id: hadith-60-be-upright-and-love-of-meeting
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: '''Say I believe, then be upright''; the angels'' tidings at death and the love of meeting God (Q 41:30)'
  read:
  - Jāmiʿ 60:7426.2-7427.1
  quran:
  - '41:30'
  tags:
  - motif: say-i-believe-then-be-upright
    refs:
    - Jāmiʿ 60:7426.2
    note: 'قل لي في الإسلام قولا لا أسأل عنه أحدًا بعدك؟ قال: قل: آمنت بالله، فاستقم'
  - motif: love-of-meeting-god-returned
    refs:
    - Jāmiʿ 60:7427.1
    note: من أحب لقاء الله أحب الله لقاءه ... المؤمن إذا حضره الموت بُشِّر برضوان الله وكرامته ... الكافر إذا حضر بشَر بعذاب الله وعقوبته
- id: hadith-60-gabriel-teaches-religion
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Gabriel asks about faith, islam, ihsan and the Hour; the Hour among the five (Q 41:47)
  read:
  - Jāmiʿ 60:7427.2
  quran:
  - '41:47'
  - '31:34'
  tags:
  - motif: gabriel-in-human-form-teaches-faith
    refs:
    - Jāmiʿ 60:7427.2
    note: 'ما الإيمان؟ ... ما الإسلام؟ ... ما الإحسان؟ قال: أن تعبد الله كأنك تراه ... ردوه، فلم يروا شيئًا، فقال: هذا جبريل، جاء يعلّم الناس دينهم'
  - motif: slave-woman-bears-her-lord-herders-vie-in-building
    refs:
    - Jāmiʿ 60:7427.2
    note: إذا ولدت الأمة ربها، وإذا تطاول رعاة الإبل البهم في البنيان
  - motif: hour-among-five-known-only-to-god
    refs:
    - Jāmiʿ 60:7427.2
    note: 'ما المسئول عنها بأعلم من السائل ... في خمس لا يعلمهن إِلَّا الله، ثمّ تلا: إن الله عنده علم الساعة'
- id: hadith-60-how-revelation-comes
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Revelation like a ringing bell or an angel in a man's form; sweat on a cold day (Q 42:3)
  read:
  - Jāmiʿ 60:7428.1
  quran:
  - '42:3'
  tags:
  - motif: revelation-like-ringing-bell
    refs:
    - Jāmiʿ 60:7428.1
    note: أحيانًا يأتيني في مثل صلصلة الجرس، وهو أشده علي، فيفصم عني ... وأحيانا يتمثل لي الملك رجلًا
  - motif: prophet-sweats-in-cold-at-revelation
    refs:
    - Jāmiʿ 60:7428.1
    note: ينزل عليه في اليوم الشديد البرد، فيفصم عنه وإن جبينه ليتفصد عرقا
