  read:
  - Jāmiʿ 60:7498.1-7498.2
  quran:
  - '52:4'
  tags:
  - motif: abraham-met-in-seventh-heaven
    refs:
    - Jāmiʿ 60:7498.1
    note: ثم عُرِجَ بي إلى السماء السابعة ... فإذا أنا بإبراهيم ﷺ مسندا ظهره إلى البيت المعمور
  - motif: seventy-thousand-angels-daily-never-returning
    refs:
    - Jāmiʿ 60:7498.1
    - Jāmiʿ 60:7498.2
    note: وإذا هو يدخله كل يوم سبعون ألف ملك، لا يعودون إليه / لا يعودون فيه أبدًا
  - motif: heavenly-house-directly-above-the-kaba
    refs:
    - Jāmiʿ 60:7498.2
    note: 'البيت الذي في السماء يقال له: الضرَّاح، وهو مثل بناء هذا البيت الحرام، ولو سقط لسقط عليه'
  - motif: frequented-house-heavenly-temple
    refs:
    - Jāmiʿ 60:7498.1
    - Jāmiʿ 60:7498.2
    note: bab Q 52:4 والبيت المعمور
  hints:
  - A heavenly sanctuary set exactly over the earthly one against b. Hagigah 12b (Zevul, where the heavenly Jerusalem, temple and altar stand and Michael offers) and the tradition that the heavenly Jerusalem lies opposite the earthly (b. Ta'anit 5a).
- id: hadith-60-raised-by-childs-prayer
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
