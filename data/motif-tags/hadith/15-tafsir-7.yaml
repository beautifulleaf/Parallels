  - motif: jesus-sign-of-the-hour
    refs:
    - Jāmiʿ 60:7436.1
    note: 'وإنه لعلم للساعة، قال: هو خروج عيسى ابن مريم ﵇ قبل يوم القيامة'
- id: hadith-60-paradise-inherited
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: No one enters paradise by his deeds; everyone has a dwelling in paradise and one in the fire (Q 43:72)
