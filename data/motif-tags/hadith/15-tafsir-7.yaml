  - Jāmiʿ 60:7439.1
  quran:
  - 44:1-3
  tags:
  - motif: seek-night-of-decree-in-odd-last-ten
    refs:
    - Jāmiʿ 60:7439.1
    note: تحرَّوا ليلة القدر في الوتر من العشر الأواخر من رمضان
  - motif: night-of-decree-revelation
    refs:
    - Jāmiʿ 60:7439.1
    note: bab Q 44:3 إنا أنزلناه في ليلة مباركة, linked to the Night of Decree
- id: hadith-60-the-smoke
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The smoke as Quraysh's famine and the great assault as Badr; five signs past; the ten signs before the Hour (Q 44:10-16)
  read:
  - Jāmiʿ 60:7439.2-7440.2
  quran:
  - 44:10-16
  tags:
  - motif: famine-sky-seen-as-smoke
    refs:
    - Jāmiʿ 60:7439.2
    note: فأصابهم قحط وجهد حتَّى جعل الرّجل ينظر إلى السماء فيرى بينه وبينها كهيئة الدخان من الجهد، وحتى أكلوا العظام
  - motif: years-like-josephs-years-invoked-on-quraysh
    refs:
    - Jāmiʿ 60:7439.2
    note: دعا عليهم بسنين كسني يوسف
  - motif: great-assault-is-badr
    refs:
    - Jāmiʿ 60:7439.2
    note: 'يوم نبطش البطشة الكبرى إنا منتقمون قال: يعني يوم بدر'
  - motif: five-signs-already-past
    refs:
    - Jāmiʿ 60:7440.1
    note: 'خمس قد مضين: اللزام، والروم، والبطشة، والقمر، والدخان'
  - motif: ten-signs-before-the-hour
    refs:
    - Jāmiʿ 60:7440.2
    note: لن تقوم حتى ترون قبلها عشر آيات فذكر الدخان، والدجال، والدابة، وطلوع الشمس من مغربها، ونزول عيسى ابن مريم، ويأجوج ومأجوج، وثلاثة خسوف ... نار تخرج من اليمن تطرد الناس إلى محشرهم
  hints:
  - Famine years invoked by the prophet 'like the years of Joseph' against Gen 41:27-30, the seven years of famine in Egypt.
- id: hadith-60-death-slaughtered
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Death slaughtered between paradise and fire; the herald's four nevers; no sleep in paradise (Q 44:56)
  read:
  - Jāmiʿ 60:7441.1-7441.3
  quran:
  - '44:56'
  - '7:43'
  tags:
  - motif: death-brought-and-slaughtered-between-paradise-and-fire
    refs:
    - Jāmiʿ 60:7441.1
    note: 'أُتِيَ بالموت حتى يُجْعَل بين الجنة والنار، ثم يُذْبَح، ثم ينادي منادٍ: يا أهل الجنة لا موت، ويا أهل النار لا موت'
  - motif: paradise-herald-four-nevers
    refs:
    - Jāmiʿ 60:7441.2
    note: إن لكم أن تصحوا فلا تسقموا أبدا، وإن لكم أن تحيوا فلا تموتوا أبدا، وإن لكم أن تشبوا فلا تهرموا أبدا، وإن لكم أن تنعموا فلا تبأسوا أبدا
  - motif: no-sleep-in-paradise-sleep-brother-of-death
    refs:
    - Jāmiʿ 60:7441.3
    note: 'هل ينام أهل الجنة؟ قال: لا، النوم أخو الموت'
  hints:
  - Death itself destroyed at the end against Rev 20:14, death and Hades thrown into the lake of fire, and Isa 25:8, death swallowed up for ever.
- id: hadith-60-stone-swapped-for-better
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The Arab who worshipped a stone and took a better one when found (Q 45:23)
  read:
  - Jāmiʿ 60:7442.1
  quran:
  - '45:23'
  tags:
  - motif: stone-worshipped-replaced-by-better
    refs:
    - Jāmiʿ 60:7442.1
    note: 'كان الرجل من العرب يعبد الحجر، فإذا وجد أحسن منه أخذه، وأبقى الآخر، فأنزل الله: من اتخذ إلهه هواه'
- id: hadith-60-i-am-time
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Do not curse Time: ''I am Time, I turn night and day'' (Q 45:24)'
  read:
  - Jāmiʿ 60:7443.1-7443.3
  quran:
  - '45:24'
  tags:
  - motif: only-time-destroys-us
    refs:
    - Jāmiʿ 60:7443.1
    note: bab Q 45:24 وما يهلكنا إلا الدهر
  - motif: do-not-curse-time-god-is-time
    refs:
    - Jāmiʿ 60:7443.1
    - Jāmiʿ 60:7443.2
    - Jāmiʿ 60:7443.3
    note: 'يؤذيني ابن آدم، يسب الدهر وأنا الدهر، بيدي الأمر أقلب الليل والنهار / يقول: يا خيبة الدهر ... أقلِّب ليله ونهاره، فإذا شئت قبضتهما / لا تسبوا الدهر، فإن الله هو الدهر'
- id: hadith-60-paradise-and-fire-dispute
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Paradise and the fire dispute; 'you are my mercy' (Q 45:30)
  read:
  - Jāmiʿ 60:7444.1
  quran:
  - '45:30'
  tags:
  - motif: paradise-and-fire-dispute
    refs:
    - Jāmiʿ 60:7444.1
    note: 'تحاجت الجنة والنار، فقالت النار: أوثرت بالمتكبرين والمتجبرين، وقالت الجنة: ما لي لا يدخلني إلا ضعفاء الناس وسقطهم؟ قال الله للجنة: أنت رحمتي'
- id: hadith-60-i-forget-you-as-you-forgot-me
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: God forgets the servant who forgot the meeting (Q 45:34)
  read:
  - Jāmiʿ 60:7444.2
  quran:
  - '45:34'
  tags:
  - motif: god-forgets-one-who-forgot-meeting
    refs:
    - Jāmiʿ 60:7444.2
    note: 'أي فلُ، ألم أكرمك، وأسودك، وأزوجك، وأسخر لك الخيل والإبل، وأذرك تَرْأَسُ وتَرْبَعُ؟ ... أفظننت أنك ملاقي؟ فيقول. لا، فيقول: فإني أنساك كما نسيتني'
- id: hadith-60-grandeur-gods-cloak
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Might his loincloth, grandeur his cloak (Q 45:37)
  read:
  - Jāmiʿ 60:7444.3
  quran:
  - '45:37'
  tags:
  - motif: might-his-loincloth-grandeur-his-cloak
    refs:
    - Jāmiʿ 60:7444.3
    note: العِزُّ إزاره، والكبرياء رداؤه، فمن ينازعني عذَّبْته
  hints:
  - God clothed in majesty and strength against Ps 93:1, 'the LORD is clothed with majesty; the LORD is clothed with strength, wherewith he hath girded himself'.
- id: hadith-60-trace-of-knowledge-the-line
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: '''A trace of knowledge'' is the line-drawing (Q 46:4)'
  read:
  - Jāmiʿ 60:7445.1
  quran:
  - '46:4'
  tags:
  - motif: trace-of-knowledge-is-line-drawing
    refs:
    - Jāmiʿ 60:7445.1
    note: 'أو أثارة من علم قال: الخط (Sufyan: I know it only from the prophet)'
- id: hadith-60-uthman-b-mazun
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Umm al-'Ala' vouches for the dead Uthman b. Maz'un and is checked (Q 46:9)
  read:
  - Jāmiʿ 60:7445.2
  quran:
  - '46:9'
  tags:
  - motif: lots-cast-to-lodge-emigrants
    refs:
    - Jāmiʿ 60:7445.2
    note: اقتُسم المهاجرون قرعةً، فطار لنا عثمان بن مظعون، فأنزلناه في أبياتنا
  - motif: do-not-vouch-that-god-honoured-the-dead
    refs:
    - Jāmiʿ 60:7445.2
    note: 'رحمة الله عليك أبا السّائب، فشهادتي عليك، لقد أكرمك الله. فقال: وما يدريك أن الله أكرمه؟ ... قالت: فواللهِ لا أزكي أحدًا بعده أبدًا'
  - motif: prophet-no-novelty-among-messengers
    refs:
    - Jāmiʿ 60:7445.2
    note: والله ما أدري وأنا رسول الله ما يُفعل بي
- id: hadith-60-witness-from-israel
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: In the synagogue on a feast day; Ibn Salam the witness from the Children of Israel (Q 46:10)
  read:
  - Jāmiʿ 60:7446.1-7447.1
  quran:
  - '46:10'
  tags:
  - motif: prophet-in-synagogue-asks-for-twelve-witnesses
    refs:
    - Jāmiʿ 60:7446.1
    note: دخلنا كنيسة اليهود بالمدينة يوم عيدهم ... أروني انني عشر رجلا يشهد أن لا إله إلا الله وأني رسول الله، يحبط الله عن كل يهودي تحت أديم السماء الغضب ... ثم ثلَّث فلم يجبه أحد
  - motif: names-hashir-aqib-muqaffi
    refs:
    - Jāmiʿ 60:7446.1
    note: فوالله! إني لأنا الحاشر، وأنا العاقب، وأنا المقفى، آمنتم أو كذبتم
  - motif: scholar-praised-then-reviled-on-converting
    refs:
    - Jāmiʿ 60:7446.1
    note: 'ما نعلم أنه كان فينا رجل أعلم بكتاب الله ولا أفقه منك، ولا من أبيك ... ولا من جدك ... فإني أشهد له بالله أنه نبي الله الذي تجدونه في التوراة، قالوا: كذبت'
  - motif: only-ibn-salam-told-of-paradise-while-living
    refs:
    - Jāmiʿ 60:7447.1
    note: 'ما سمعت النبي ﷺ يقول لأحد يمشي على الأرض: إنه من أهل الجنة إلا لعبد الله بن سلام قال، وفيه نزلت هذه الآية'
- id: hadith-60-son-who-said-uff
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Marwan applies the verse of the son who said 'uff' to Abd al-Rahman b. Abi Bakr; Aisha denies it (Q 46:17)
  read:
  - Jāmiʿ 60:7448.1
  quran:
  - '46:17'
  tags:
  - motif: verse-claimed-against-opponent-aisha-denies
    refs:
    - Jāmiʿ 60:7448.1
    note: 'فجعل يذكر يزيد بن معاوية، لكي يبايع له بعد أبيه ... فدخل بيت عائشة فلم يقدروا عليه ... فقالت عائشة من وراء الحجاب: ما أنزل الله فينا شيئا من القرآن إلا أن الله أنزل عذري'
- id: hadith-60-cloud-of-ad
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The prophet's fear at clouds; the envoy of 'Ad and the black clouds (Q 46:24)
  read:
  - Jāmiʿ 60:7448.2-7449.2
  quran:
  - '46:24'
  tags:
  - motif: prophet-smiles-never-laughs-open-mouthed
    refs:
    - Jāmiʿ 60:7448.2
    note: ما رأيت رسول الله ﷺ ضاحكا حتى أرى منه لهواته، إنما كان يتبسم
  - motif: prophet-fears-clouds-and-wind
    refs:
    - Jāmiʿ 60:7448.2
    - Jāmiʿ 60:7449.1
    note: وكان إذا رأى غيما أو ريحا عرف في وجهه ... ما يؤمني أن يكون فيه عذاب؟ عُذِّبَ قوم بالريح / وإذا تخيلت السماء تغير لونه، وخرج ودخل، وأقبل وأدبر، فإذا مطرت سُرِّيَ عنه
  - motif: doom-cloud-mistaken-for-rain
    refs:
    - Jāmiʿ 60:7448.2
    - Jāmiʿ 60:7449.1
    note: 'وقد رأى قوم العذاب فقالوا: هذا عارض ممطرنا / كما قال قوم عاد'
  - motif: prayer-for-the-good-of-the-wind
    refs:
    - Jāmiʿ 60:7449.1
    note: اللهم! إني أسألك خيرها وخير ما فيها وخير ما أرسلت به، وأعوذ بك من شرها وشر ما فيها وشر ما أرسلت به
  - motif: drought-stricken-people-send-an-envoy-to-pray-for-rain
    refs:
    - Jāmiʿ 60:7449.2
    note: إن عادًا قُحِطوا فبعثوا قَيْلا وافدًا
  - motif: ads-envoy-drinks-with-two-singing-girls
    refs:
    - Jāmiʿ 60:7449.2
    note: 'فنزل على بكرٍ، فسقاه الخمرَ شهرًا وتغنّيه جاريتان يقال لهما الجرادتان، فخرج إلى جبال مهرة، فنادى: اللهم! فاسقِ عادًا ما كانت تُسْقِيه'
  - motif: black-clouds-take-it-as-ashes
    refs:
    - Jāmiʿ 60:7449.2
    note: 'فمرت به سحابات سُودٌ، فنودي منها: خذها رمادًا رِمْدِدًا، لا تبقي من عادٍ أحدًا'
  - motif: wind-sent-on-ad-only-as-through-a-ring
    refs:
    - Jāmiʿ 60:7449.2
    note: فما بَلَغني أنَّه أرسل عليهم من الريح، يا رسول الله! إلا قَدْر ما يجري في خاتمي
  - motif: proverb-like-the-envoy-of-ad
    refs:
    - Jāmiʿ 60:7449.2
    note: 'أعوذ بالله ورسوله أن أكون كوافد عاد ... فكانت المرأة تقول: لا تكن كوافد عادٍ'
- id: hadith-60-jinn-hear-the-quran
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The jinn at Nakhla, the night of the jinn, the jinn's food, and the voice from the slaughtered calf (Q 46:29-32)
  read:
  - Jāmiʿ 60:7450.1-7452.1
  quran:
  - 46:29-32
  - '72:1'
  tags:
  - motif: nine-jinn-one-named-zawba-a
    refs:
    - Jāmiʿ 60:7450.1
    note: 'هبطوا على النبي ﷺ وهو يقرأ القرآن ببطن نخلة، فلما سمعوه قالوا: انصتوا، قالوا: صه. وكانوا تسعة أحدهم زوبعة'
  - motif: jinn-listen-to-quran
    refs:
    - Jāmiʿ 60:7450.1
    - Jāmiʿ 60:7450.2
    note: 'فلما سمعوا القرآن استمعوا له، وقالوا: هذا الذي حال بيننا وبين خبر السماء'
  - motif: spirits-eavesdrop-on-heaven-repelled-by-meteors
    refs:
    - Jāmiʿ 60:7450.2
    note: وقد حيل بين الشياطين وبين خبر السماء، وأرسلت عليهم الشهب
  - motif: jinn-search-east-and-west-for-cause
    refs:
    - Jāmiʿ 60:7450.2
    note: فاضربوا مشارق الأرض ومغاربها ... فمر النفر الذين أخذوا نحو تهامة - وهو بنخل - عامدين إلى سوق عكاظ، - وهو يصلي بأصحابه صلاة الفجر
  - motif: night-of-the-jinn-prophet-missing
    refs:
    - Jāmiʿ 60:7451.1
    note: 'ففقدناه، فالتمسناه في الأودية والشعاب، فقلنا: استطير، أو اغتيل ... أتاني داعي الجنِّ، فذهبت معه، فقرأت عليهم القرآن ... فأرانا آثارهم وآثار نيرانهم'
  - motif: bones-and-dung-food-of-jinn
    refs:
    - Jāmiʿ 60:7451.1
    - Jāmiʿ 60:7451.2
    note: لكم كلُّ عظمٍ ذُكر اسم الله عليه يقع في أيديكم أوفر ما يكون لحمًا. وكلُّ بعرة علفٌ لدوابكم
  - motif: no-cleansing-with-bone-or-dung
    refs:
    - Jāmiʿ 60:7451.1
    - Jāmiʿ 60:7451.2
    note: فلا تستنجوا بهما؛ فإنَّهما طعام إخوانكم / ابْغِنِيْ أحجارا أستنفض بها، ولا تأتِني بعظم، ولا بروثة
  - motif: jinn-delegation-of-nisibin
    refs:
    - Jāmiʿ 60:7451.2
    note: وإنه أتاني وفد جن نصيبين - ونعم الجن - فسألوني الزاد
  - motif: umars-guess-never-wrong
    refs:
    - Jāmiʿ 60:7452.1
    note: 'ما سمعت عمر لشيء قط يقول: إني لأظنه كذا إلا كان كما يظن ... أو لقد كان كاهنهم'
  - motif: jinniya-tells-of-jinn-despair
    refs:
    - Jāmiʿ 60:7452.1
    note: ألم تر الجن وإبلاسها، ويأسها من بعد إنكاسها، ولحوقها بالقلاص وأحلاسها
  - motif: voice-from-sacrificed-calf
    refs:
    - Jāmiʿ 60:7452.1
    note: 'إذ جاء رجل بعجل فذبحه، فصرخ به صارخ ... يا جليح، أمر نجيح، رجل فصيح. يقول: لا إله إلا أنت'
- id: hadith-60-martyrs-gifts
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The martyr's gifts at the first drop of blood; all forgiven but debt (Q 47:4)
  read:
  - Jāmiʿ 60:7453.1-7454.2
  quran:
  - '47:4'
  tags:
  - motif: martyr-gifts-at-first-drop-of-blood
    refs:
    - Jāmiʿ 60:7453.1
    - Jāmiʿ 60:7454.1
    note: 'للشهيد عند الله ست خصال: يغفر له في أول دفعة من دمه ... ويشفع في سبعين إنسانا من أقاربه (seven listed under six) / يُعْطى الشهيد ست خصال عند أول قطرة من دمه'
  - motif: martyr-forgiven-all-but-debt
    refs:
    - Jāmiʿ 60:7454.2
    note: يغفر للشهيد كل ذنب إلا الدين
- id: hadith-60-bridge-before-paradise
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Believers held on a bridge to settle wrongs; each knows his home in paradise (Q 47:5-6)
  read:
  - Jāmiʿ 60:7454.3
  quran:
  - 47:5-6
  tags:
  - motif: believers-held-on-bridge-for-retaliation
    refs:
    - Jāmiʿ 60:7454.3
    note: فيحبسون على قنطرة بين الجنة والنار، فيقص لبعضهم من بعض مظالم كانت بينهم في الدنيا، حتى إذا هذبوا ونقوا أذن لهم
  - motif: knows-paradise-home-better-than-earthly-home
    refs:
    - Jāmiʿ 60:7454.3
    note: لأحدهم أهدى بمنزله في الجنة منه بمنزله كان في الدنيا
- id: hadith-60-god-our-protector-at-uhud
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Uhud: the archers leave, Abu Sufyan calls, ''God is our protector and you have none'' (Q 47:11)'
  read:
  - Jāmiʿ 60:7455.1
  quran:
  - '47:11'
  tags:
  - motif: archers-told-not-to-move-even-if-birds-snatch-us
    refs:
    - Jāmiʿ 60:7455.1
    note: 'here: لا تبرحوا، إن رأيتمونا ظهرنا عليهم فلا تبرحوا، وإن رأيتموهم ظهروا علينا فلا تعينونا'
  - motif: women-flee-up-mountain-anklets-showing
    refs:
    - Jāmiʿ 60:7455.1
    note: 'رأيت النساء يشتددن في الجبل، رفعن عن سوقهن قد بدت خلاخلهن، فأخذوا يقولون: الغنيمة الغنيمة'
  - motif: enemy-asks-three-times-is-he-among-you
    refs:
    - Jāmiʿ 60:7455.1
    note: أفي القوم محمد؟ ... ابن أبي قحافة؟ ... ابن الخطاب؟
  - motif: answer-hubal-with-god-is-higher
    refs:
    - Jāmiʿ 60:7455.1
    note: 'اعل هبل ... قولوا: الله أعلى وأجل ... لنا العزَّى ولا عزى لكم ... قولوا: الله مولانا، ولا مولى لكم'
- id: hadith-60-seven-intestines
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The believer eats in one intestine, the unbeliever in seven (Q 47:12)
  read:
  - Jāmiʿ 60:7455.2-7457.1
  quran:
  - '47:12'
  tags:
  - motif: unbeliever-eats-in-seven-intestines
    refs:
    - Jāmiʿ 60:7455.2
    - Jāmiʿ 60:7455.3
    - Jāmiʿ 60:7456.1
    - Jāmiʿ 60:7456.2
    - Jāmiʿ 60:7456.3
    - Jāmiʿ 60:7456.4
    - Jāmiʿ 60:7456.5
    - Jāmiʿ 60:7457.1
    note: 'الكافر يأكل في سبعة أمعاء، والمؤمن يأكل في معي واحد (Bukhari: or the hypocrite)'
  - motif: guest-drinks-seven-goats-milk-then-one-after-islam
    refs:
    - Jāmiʿ 60:7456.1
    note: حتى شرب حلاب سبع شياه، ثم إنه أصبح فأسلم ... ثم أمر له بأخرى فلم يستتمها
  - motif: ibn-umar-eats-only-with-a-poor-man
    refs:
    - Jāmiʿ 60:7456.5
    note: كان ابن عمر لا يأكل حتى يؤتى بمسكين يأكل معه ... يا نافع، لا تدخل هذا عليَّ
- id: hadith-60-seas-and-rivers-of-paradise
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Seas of milk, water, honey and wine; al-Firdaws under the throne, source of the rivers (Q 47:15)
  read:
  - Jāmiʿ 60:7457.2-7457.3
  quran:
  - '47:15'
  tags:
  - motif: four-seas-of-paradise-rivers-branch
    refs:
    - Jāmiʿ 60:7457.2
    note: في الجنة بحر اللبن، وبحر الماء، وبحر العسل، وبحر الخمر، ثم تنشق الأنهار منها بعد
  - motif: hundred-degrees-firdaws-under-throne-rivers-spring
    refs:
    - Jāmiʿ 60:7457.3
    note: إن في الجنة مائة درجة أعدها الله للمجاهدين ... فسلوه الفردوس، فإنه أوسط الجنة وأعلى الجنة، وفوقه عرش الرحمن، ومنه تفجر أنهار الجنة
  hints:
  - Four streams in paradise and rivers flowing out of its highest garden against Gen 2:10, a river going out of Eden and parting into four heads.
- id: hadith-60-sent-with-the-hour
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: '''I was sent and the Hour like these two'' (Q 47:18)'
  read:
  - Jāmiʿ 60:7458.1
  quran:
  - '47:18'
  tags:
  - motif: sent-with-hour-like-two-fingers
    refs:
    - Jāmiʿ 60:7458.1
    note: 'قال بأصبعيه هكذا بالوسطى والتي تلي الإبهام: بُعِثْتُ والساعة كهاتين'
- id: hadith-60-asking-forgiveness
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Ask forgiveness for your sin: the prophet''s forgiveness-seeking and Satan''s vow (Q 47:19)'
  read:
  - Jāmiʿ 60:7458.2-7459.2
  quran:
  - '47:19'
  tags:
  - motif: companion-sees-seal-between-shoulders
    refs:
    - Jāmiʿ 60:7458.2
    note: 'أستغفر لك النبي ﷺ؟ قال: نعم ولك، ثم تلا هذه الآية ... ثم درت خلفه، فنظرت إلى خاتم النبوة بين كتفيه'
  - motif: prayer-forgive-error-ignorance-excess
    refs:
    - Jāmiʿ 60:7458.3
    note: رب اغفر لي خطيئتي وجهلي وإسرافي في أمري كله ... اللهم! اغفر لي خطاياي، وعمدي، وجهلي، وهزلي ... ما قدمت وما أخرت، وما أسررت وما أعلنت
  - motif: prophet-seeks-forgiveness-over-seventy-times-daily
    refs:
    - Jāmiʿ 60:7459.1
    note: إني أستغفر الله وأتوب إليه في اليوم أكثر من سبعين مرة
  - motif: satan-swears-to-mislead-god-swears-to-forgive
    refs:
    - Jāmiʿ 60:7459.2
    note: 'وعزتك يا رب! لا أبرح أغوي عبادك ما دامت أرواحهم في أجسادهم، قال الرب: وعزتي وجلالي لا أزال أغفر لهم ما استغفروني'
- id: hadith-60-womb-and-kinship
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The womb seeks refuge from severance; keeping and cutting kinship (Q 47:22)
  read:
  - Jāmiʿ 60:7459.3-7461.2
  quran:
  - '47:22'
  tags:
  - motif: womb-seeks-refuge-from-severance
    refs:
    - Jāmiʿ 60:7459.3
    note: 'إن الله خلق الخلق حتى إذا فرغ منهم قامت الرحم فقالت: هذا مقام العائذ من القطيعة. قال: نعم، أما ترضين أن أصل من وصلك وأقطع من قطعك'
  - motif: womb-a-branch-of-the-merciful
    refs:
    - Jāmiʿ 60:7460.5
    - Jāmiʿ 60:7461.1
    note: 'الرحم شجنة، فمن وصلها وصلته ... ولفظ مسلم: الرحم معلقة بالعرش / إن الرحم شجنة من الرحمن'
  - motif: severing-kin-and-oppression-punished-in-this-world
    refs:
    - Jāmiʿ 60:7460.1
    note: 'ما من ذنب أجدر أن يعجل الله تعالى لصاحبه العقوبة في الدنيا مع ما يدَّخر له في الآخرة: مثل البغي وقطيعة الرحم'
  - motif: kin-keeping-extends-provision-and-life
    refs:
    - Jāmiʿ 60:7460.3
    - Jāmiʿ 60:7460.4
    note: من أحب أن يُبْسَطَ له في رزقه، ويُنْسَأ له في أثره، فليَصِلْ رحمه
  - motif: true-kin-keeper-rejoins-when-cut
    refs:
    - Jāmiʿ 60:7461.2
    note: ليس الواصل بالمكافئ، ولكن الواصل الذي إذا قُطِعَت رحمُه وصلها
  - motif: divine-names-rahman-rahim
    refs:
    - Jāmiʿ 60:7461.1
    note: 'the womb (rahim) named a branch of al-Rahman: الرحم شجنة من الرحمن'
  hints:
  - Long life as the reward of a family duty against Exod 20:12, 'honour thy father and thy mother, that thy days may be long'.
- id: hadith-60-salman-and-his-people
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'The people who would replace them: Salman''s people, who would reach religion at the Pleiades (Q 47:38)'
  read:
  - Jāmiʿ 60:7461.3
  quran:
  - '47:38'
  tags:
  - motif: salmans-people-would-reach-religion-at-pleiades
    refs:
    - Jāmiʿ 60:7461.3
    note: 'فضرب على فخذ سلمان، قال: هذا وقومه، ولو كان الدين عند الثريا لتناوله رجال من الفرس'
- id: hadith-60-surah-of-the-conquest-revealed
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Al-Fath dearer than all the sun rises on; recited with trills on the day of the conquest (Q 48:1)
  read:
  - Jāmiʿ 60:7462.1-7463.2
  quran:
  - '48:1'
  - 48:1-5
  - 48:1-29
  tags:
  - motif: question-thrice-unanswered-fear-of-revelation
    refs:
    - Jāmiʿ 60:7462.1
    note: فسأله عمر بن الخطاب عن شيء فلم يجبه ... ثكلتك أمك يا عمر، نزرت رسول الله ﷺ ثلاث مرات ... وخشيت أن ينزل فِيَّ قرآنٌ
  - motif: surah-dearer-than-all-the-sun-rises-on
    refs:
    - Jāmiʿ 60:7462.1
    - Jāmiʿ 60:7463.1
    note: لقد أنزلت عليَّ الليلة سورة لَهِيَ أَحَبُّ إليَّ مما طلعت عليه الشمس / مرجعه من الحديبية ... لقد أنزلت علي آية هي أحبُّ إلَيَّ من الدنيا جميعا
  - motif: surah-recited-with-trilled-voice-on-camel
    refs:
    - Jāmiʿ 60:7463.2
    note: 'يوم الفتح على ناقة له يقرأ سورة الفتح ... فرجَّع فيها ... كيف كان ترجيعه؟ قال: آآ آثلاث مرات'
- id: hadith-60-is-it-a-conquest
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Hudaybiya: Umar''s protest, the night they overslept, the drained well (Q 48:1)'
  read:
  - Jāmiʿ 60:7463.3-7464.2
  quran:
  - '48:1'
  tags:
  - motif: why-accept-lowliness-in-our-religion
    refs:
    - Jāmiʿ 60:7463.3
    note: 'ألسنا على حق وهم على باطل؟ ... ففيم نعطي الدنية في ديننا ... فأتى أبا بكر فقال: يا أبا بكر! ألسنا على حق ... فقال: يا ابن الخطاب! إنه رسول الله ولن يضيعه الله أبدا'
  - motif: is-it-a-conquest-yes
    refs:
    - Jāmiʿ 60:7463.3
    note: 'فأرسل إلى عمر فأقرأه إياه. فقال: يا رسول الله! أو فتح هو؟ قال: نعم فطابت نفسه'
  - motif: watchman-sleeps-camp-wakes-after-sunrise
    refs:
    - Jāmiʿ 60:7464.1
    note: 'من يكلؤنا؟ فقال بلال: أنا ... فناموا حتى طلعت الشمس ... كذلك فافعلوا، لمن نام أو نسي'
  - motif: prophet-covers-head-under-revelation
    refs:
    - Jāmiʿ 60:7464.1
    note: 'فتنحى منتبذا خلفنا، قال: فجعل يغطي رأسه بثوبه، ويشتد ذلك عليه'
  - motif: the-true-conquest-was-the-pledge-of-ridwan
    refs:
    - Jāmiʿ 60:7464.2
    note: تعدون أنتم الفتح فتح مكة ... ونحن نعد الفتح بيعة الرضوان يوم الحديبية، كنا مع النبي ﷺ أربع عشرة مائة
  - motif: spittle-in-dry-well-makes-it-gush
    refs:
    - Jāmiʿ 60:7464.2
    note: فجلس على شفيرها، ثم دعا بإناء من ماء فتوضأ، ثم مضمض ودعا ثم صبه فيها ... ثم إنها أصدرتنا ما شئنا نحن وركابنا
- id: hadith-60-feet-swollen-in-prayer
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Forgiven past and future, he prays till his feet swell: ''shall I not be a grateful servant?'' (Q 48:2-3)'
  read:
  - Jāmiʿ 60:7465.1-7465.2
  quran:
  - 48:2-3
  tags:
  - motif: prays-until-feet-swell
    refs:
    - Jāmiʿ 60:7465.1
    - Jāmiʿ 60:7465.2
    note: قام النبي ﷺ حتى تورمت قدماه / حتى تتفطَّر قدماه ... فلما كَثُر لحْمه صلَّى جالسًا، فإذا أراد أن يركع قام فقرأ
  - motif: shall-i-not-be-a-grateful-servant
    refs:
    - Jāmiʿ 60:7465.1
    - Jāmiʿ 60:7465.2
    note: 'غفر الله لك ما تقدم من ذنبك وما تأخر، قال: أفلا أكون عبدا شكورا'
- id: hadith-60-sakina-at-recitation
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The sakina as a cloud over a reciter; angels like a canopy of lamps over Usayd (Q 48:4)
  read:
  - Jāmiʿ 60:7465.3-7466.1
  quran:
  - '48:4'
  tags:
  - motif: sakina-descends-as-cloud-at-recitation
    refs:
    - Jāmiʿ 60:7465.3
    note: قرأ رجل الكهف وفي الدار الدابة، فجعلت تنفر ... فإذا ضبابة أو سحابة غشيته ... فإنها السكينة نزلت للقرآن
  - motif: angels-like-canopy-of-lamps-listen-to-recitation
    refs:
    - Jāmiʿ 60:7466.1
    note: إذ جالت فرسه ... فخشيت أن تطأ يحيى ... فإذا مثل الظلة فوق رأسي، فيها أمثال السرج، عرجت في الجو ... تلك الملائكة كانت تستمع لك، ولو قرأتَ لأصبحت يراها الناس
  hints:
  - The divine presence descending as a cloud (sakina, cf. shekhinah) against Exod 40:34-35 and 1 Kgs 8:10-11, the cloud filling the tent and the temple.
- id: hadith-60-prophet-in-the-torah
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Abd Allah b. Amr: the prophet as described in the Torah (Q 48:8)'
  read:
  - Jāmiʿ 60:7466.2
  quran:
  - '48:8'
  tags:
  - motif: prophet-described-in-torah
    refs:
    - Jāmiʿ 60:7466.2
    note: 'قال في التوراة: يا أيها النبي إنا أرسلناك شاهدا ومبشرا وحرزا للأميين، أنت عبدي ورسولي سَمَّيتك المتوكل'
  - motif: not-harsh-not-shouting-in-markets
    refs:
    - Jāmiʿ 60:7466.2
    note: ليس بفظ، ولا غليظ، ولا سخاب بالأسواق، ولا يدفع السيئة بالسيئة، ولكن يعفو ويصفح
  - motif: opens-blind-eyes-deaf-ears-uncircumcised-hearts
    refs:
    - Jāmiʿ 60:7466.2
    note: ولن يقبضه الله حتى يقيم به الملة العوجاء ... فيفتح بها أعينا عميا، وآذانا صما، وقلوبا غلفا
  hints:
  - '''My servant'', who does not cry out in the street, opening blind eyes against Isa 42:1-7: ''Behold my servant ... He shall not cry, nor lift up, nor cause his voice to be heard in the street ... to open the blind eyes''; ''uncircumcised hearts'' against Jer 9:26 and Deut 10:16.'
- id: hadith-60-pledge-under-the-tree
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'The pledge under the tree: its terms, its number, Uthman''s absent hand, the forgotten and felled tree, none of them in the fire (Q 48:18)'
  read:
  - Jāmiʿ 60:7467.1-7469.2
  quran:
  - '48:18'
  - 19:71-72
  tags:
  - motif: pledged-not-to-flee-or-to-death
    refs:
    - Jāmiʿ 60:7467.1
    - Jāmiʿ 60:7467.2
    note: 'كنا يوم الحديبية ألفا وأربعمائة، فبايعناه وعمر آخذ بيده تحت الشجرة، وهي سمرة ... على أن لا نفر، ولم نبايعه على الموت / على أي شيء بايعتم ... قال: على الموت'
  - motif: uthman-defended-on-three-charges
    refs:
    - Jāmiʿ 60:7467.3
    note: أتعلم أن عثمان فرّ يوم أحد؟ ... تغيّب عن بدر ... تخلف عن بيعة الرضوان ... إن لك أجر رجل ممن شهد بدرًا وسهمه
  - motif: prophets-hand-for-absent-man
    refs:
    - Jāmiʿ 60:7467.3
    note: 'فقال النبي ﷺ بيده اليمنى: هذه يد عثمان، فضرب بها على يده فقال: هذه لعثمان'
  - motif: pebble-flicking-forbidden
    refs:
    - Jāmiʿ 60:7467.4
    note: إني ممن شهد الشجرة، نهى النبي ﷺ عن الخذف
  - motif: oath-by-other-religion-and-suicide-by-iron
    refs:
    - Jāmiʿ 60:7468.1
    note: وكان من أصحاب الشجرة ... من حلف بملة غير الإسلام كاذبا متعمدا فهو كما قال، ومن قتل نفسه بحديدة عُذِّب به في نار جهنم
  - motif: best-people-on-earth-today
    refs:
    - Jāmiʿ 60:7468.2
    note: 'كنا يوم الحديبية ألفا وأربعمائة، فقال لنا النبي ﷺ: أنتم اليوم خير أهل الأرض ... لو كنت أبصر لأريتكم موضع الشجرة'
  - motif: tree-forgotten-next-year
    refs:
    - Jāmiʿ 60:7468.3
    note: فَلَمَّا خَرَجْنَا مِنَ الْعَامِ الْمُقْبِلِ نَسِينَاهَا، فَلَمْ نَقْدِرْ عَلَيْهَا ... فَأَنْتُمْ أَعْلَمُ
  - motif: tree-cut-down-by-umar
    refs:
    - Jāmiʿ 60:7468.4
    note: كان الناس يأتون الشجرة التي يقال لها شجرة الرضوان فيصلون عندها ... فأوعدهم فيها، وأمر بها فقطعت
  - motif: none-of-the-tree-enters-fire
    refs:
    - Jāmiʿ 60:7469.1
    note: 'لا يدخل النار إن شاء الله من أصحاب الشجرة أحد ... فقالت حفصة: وإن منكم إلا واردها ... ثم ننجي الذين اتقوا'
  - motif: badr-and-hudaybiya-veteran-will-not-enter-fire
    refs:
    - Jāmiʿ 60:7469.2
    note: 'ليدخلَنَّ حاطبٌ النارَ، فقال: كذبت لا يدخلها فإنه شهد بدرا والحديبية'
  hints:
  - A sacred tree where people came to pray, cut down by the ruler, against 2 Kgs 18:4, Hezekiah breaking the bronze serpent to which Israel burned incense, and Deut 12:3, 'hew down the graven images'.
- id: hadith-60-hands-restrained-at-mecca
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Armed Meccans captured and spared; the treaty's wording; youths struck blind and released (Q 48:24)
  read:
  - Jāmiʿ 60:7469.3-7469.4
  quran:
  - '48:24'
  tags:
  - motif: eighty-armed-meccans-captured-and-spared
    refs:
    - Jāmiʿ 60:7469.3
    note: أن ثمانين رجلا من أهل مكة هبطوا على رسول الله ﷺ من جبل التنعيم متسلحين يريدون غرة النبي ﷺ ... فأخذهم سلْمًا فاستحياهم
  - motif: invocation-bismika-allahumma
    refs:
    - Jāmiʿ 60:7469.4
    note: اكْتُبْ بِسْمِ اللهِ الرَّحْمَنِ الرَّحِيِمِ ... مَا نَعْرِفُ الرَّحْمَنِ الرَّحِيم ... اكْتُبْ بِاسْمِكَ اللَّهُمَّ
  - motif: treaty-written-muhammad-son-of-abd-allah
    refs:
    - Jāmiʿ 60:7469.4
    note: لَقَدْ ظَلَمْنَاكَ إِنْ كُنْتَ رَسُولَهُ ... اكْتُبْ هَذَا مَا صَالَحَ عَلَيْهِ مُحَمَّدُ بْنُ عَبْدِ اللَّهِ بْنِ عَبْدِ الْمُطَّلِبِ وَأَنَا رَسولُ اللَّهِ
  - motif: armed-youths-blinded-and-released
    refs:
    - Jāmiʿ 60:7469.4
    note: ثَلَاثُونَ شَابًّا عَلَيْهِمُ السِّلَاحُ ... فَدَعَا عَلَيْهِمْ ... فَأَخَذَ اللَّهُ بِأَبْصارِهِمْ ... هَلْ جِئْتُمْ فِي عَهْدِ أَحَدٍ ... فَخَلَّى سَبِيلَهُمْ
  hints:
  - Armed men struck blind at a prophet's prayer, captured and set free against 2 Kgs 6:18-23, Elisha's prayer blinding the Aramean force, which is led captive to Samaria, fed and released.
- id: hadith-60-word-of-piety
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The word of piety is the shahada the polytheists refused at Hudaybiya (Q 48:26)
  read:
  - Jāmiʿ 60:7470.1
  quran:
  - '48:26'
  - '37:35'
  tags:
  - motif: word-of-piety-is-shahada
    refs:
    - Jāmiʿ 60:7470.1
    note: وهي لا إله إلا الله محمد رسول الله استكبر عنها المشركون يوم الحديبية يوم كاتبهم رسول الله ﷺ في قضية المدة
- id: hadith-60-vision-fulfilled
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'The vision fulfilled: the umra of the following year, the jogging, the shavers and shorteners (Q 48:27)'
  read:
  - Jāmiʿ 60:7471.1-7472.2
  quran:
  - '48:27'
  tags:
  - motif: umra-of-fulfilment-terms
    refs:
    - Jāmiʿ 60:7471.1
    note: فنحر هديه وحلق رأسه بالحديبية، وقاضاهم على أن يعتمر العام المقبل، ولا يحمل سلاحًا عليهم إلّا سيوفًا ... فلمّا أن أقام بها ثلاثًا، أمروه أن يخرج
  - motif: ramal-to-show-strength
    refs:
    - Jāmiʿ 60:7471.2
    note: وقد وهنتهم حمى يثرب ... أن يرملوا ثلاثة أشواط، ويمشوا ما بين الركنين، ليرى المشركون جلدهم ... ولم يمنع أن يأمرهم أن يرملوا الأشواط كلها، إلا الإبقاء عليهم
  - motif: mercy-on-shavers-then-shorteners
    refs:
    - Jāmiʿ 60:7472.1
    - Jāmiʿ 60:7472.2
    note: حلق النبي ﷺ وطائفة من أصحابه، وقَصَّر بعضهم / اللهمّ ارْحم المحلِّقين ... والمقصرين
- id: hadith-60-the-companions
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Do not revile my companions; the best generation (Q 48:29)
  read:
  - Jāmiʿ 60:7472.3-7472.4
  quran:
  - '48:29'
  tags:
  - motif: companions-mudd-outweighs-mountain-of-gold
    refs:
    - Jāmiʿ 60:7472.3
    note: لا تَسُبُّوا أصحابي ... لو أن أحدكم أنفق مثل أحد ذهبا ما أدرك مُدَّ أحدِهم ولا نصيفه
  - motif: best-generation-then-second-third
    refs:
    - Jāmiʿ 60:7472.4
    note: 'أي الناس خير؟ قال: القرن الذي أنا فيه، ثم الثاني، ثم الثالث'
- id: hadith-60-raised-voices
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Abu Bakr and Umar raise their voices; Thabit b. Qays fears for his deeds; speaking like one who whispers (Q 49:1-3)
  read:
  - Jāmiʿ 60:7473.1-7475.1
  quran:
  - 49:1-3
  tags:
  - motif: voices-raised-over-tamims-commander
    refs:
    - Jāmiʿ 60:7473.1
    - Jāmiʿ 60:7473.2
    note: 'أمِّر القعقاع بن معبد. وقال عمر: بل أمِّر الأقرع بن حابس ... فتماريا حتى ارتفعت أصواتهما / كاد الْخَيِّران أن يهلكا'
  - motif: umar-speaks-so-low-he-must-repeat
    refs:
    - Jāmiʿ 60:7473.2
    note: فما كان عمر يسمع رسول الله ﷺ بعد هذه الآية حتى يستفهمه
  - motif: loud-voiced-man-thinks-himself-damned
    refs:
    - Jāmiʿ 60:7474.1
    - Jāmiʿ 60:7474.2
    note: 'جلس ثابت بن قيس في بيته، وقال: أنا من أهل النار ... بل هو من أهل الجنة / حبط عملي'
  - motif: fighter-embalmed-and-shrouded-before-battle
    refs:
    - Jāmiʿ 60:7474.2
    note: 'فلما كان يوم اليمامة ... وقد تحنط ولبس كفنه، فقال: بئسما تعوّدون أقرانكم، فقاتلهم حتى قُتل'
  - motif: speaks-like-a-whisperer-after-the-verse
    refs:
    - Jāmiʿ 60:7475.1
    note: لا أكلمك إلا كأخي السرار حتى ألقى الله
- id: hadith-60-my-praise-adorns
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: '''My praise adorns, my blame shames'' - ''that is God'' (Q 49:4)'
  read:
  - Jāmiʿ 60:7475.2
  quran:
  - '49:4'
  tags:
  - motif: my-praise-adorns-my-blame-shames
    refs:
    - Jāmiʿ 60:7475.2
    note: 'إن حمدي زين، وإن ذمي شين، فقال النبي ﷺ: ذاك الله'
- id: hadith-60-faith-made-beloved
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The Uhud prayer in ranks; pleased by one's good deed (Q 49:7)
  read:
  - Jāmiʿ 60:7476.1-7476.2
  quran:
  - '49:7'
  tags:
  - motif: prayer-in-ranks-after-uhud
    refs:
    - Jāmiʿ 60:7476.1
    note: استووا حتى أثني على ربي ... فصاروا خلفه صفوفًا ... اللهم حبب إلينا الإيمان وزينه في قلوبنا، وكره إلينا الكفر والفسوق والعصيان ... اللهم قاتل الكفرة الذين أوتوا الكتاب
  - motif: pleased-by-good-grieved-by-evil-is-believer
    refs:
    - Jāmiʿ 60:7476.2
    note: خطب بالجابية ... ومن سرته حسنته وساءته سيئته فهو مؤمن
- id: hadith-60-two-parties-of-believers
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Two parties fight; al-Hasan the reconciler; help your brother; believers as building and body (Q 49:9-10)
  read:
  - Jāmiʿ 60:7477.1-7479.4
  quran:
  - 49:9-10
  tags:
  - motif: donkey-smell-sparks-fight-with-palm-stalks
    refs:
    - Jāmiʿ 60:7477.1
    note: إليك عني، فوالله لقد آذاني نتن حمارك ... لحمار رسول الله ﷺ أطيب ريحا منك ... فكان بينهم ضرب بالجريد وبالأيدي وبالنعال
  - motif: son-will-reconcile-two-great-parties
    refs:
    - Jāmiʿ 60:7477.2
    note: استقبل والله الحسن بن علي معاويةَ بكتائب أمثال الجبال ... إن ابني هذا سيد، ولعل الله أن يصلح به بين فئتين عظيمتين من المسلمين
  - motif: help-wrongdoing-brother-by-restraining
    refs:
    - Jāmiʿ 60:7478.1
    note: 'انصر أخاك ظالما أو مظلوما ... فكيف ننصره ظالما؟ قال: تأخذ فوق يديه'
  - motif: just-on-pulpits-of-light-at-gods-right
    refs:
    - Jāmiʿ 60:7478.2
    note: إن المقسطين عند الله على منابر من نور عن يمين الرحمن ﷿، وكلتا يديه يمين
  - motif: relieve-distress-relieved-on-resurrection
    refs:
    - Jāmiʿ 60:7478.3
    - Jāmiʿ 60:7479.1
    note: المسلم أخو المسلم، لا يظلمه ولا يُسْلمه ... ومن فرَّج عن مسلم كربة فرَّج الله عنه كربة من كربات يوم القيامة / والله في عون العبد ما كان العبد في عون أخيه
  - motif: angel-answers-and-to-you-likewise
    refs:
    - Jāmiʿ 60:7478.4
    note: 'ما من عبد مسلم يدعو لأخيه بظهر الغيب إلا قال الملك: ولك بمثل'
  - motif: believers-like-building-fingers-interlaced
    refs:
    - Jāmiʿ 60:7479.2
    note: المؤمن للمؤمن كالبنيان يَشُدُّ بعضه بعضا وشَبَّك بين أصابعه
  - motif: believers-one-body-fever-and-sleeplessness
    refs:
    - Jāmiʿ 60:7479.3
    - Jāmiʿ 60:7479.4
    note: مثل الجسد، إذا اشتكى منه عضو تداعى له سائر الجسد بالسهر والحمّى / بمنزلة الرأس من الجسد
  hints:
  - The community as one body whose members suffer together against 1 Cor 12:26, 'whether one member suffer, all the members suffer with it'.
- id: hadith-60-nicknames
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Every man had two or three names: insulting by nicknames forbidden (Q 49:11)'
  read:
  - Jāmiʿ 60:7480.1
  quran:
  - '49:11'
  tags:
  - motif: two-or-three-names-each-nicknames
    refs:
    - Jāmiʿ 60:7480.1
    note: 'وما منا رجل إلا له اسمان أو ثلاثة، كان إذا دعا الرجل بالاسم، قلنا: يا رسول الله! إنه يغضب من هذا، فأنزلت'
- id: hadith-60-suspicion-spying-backbiting
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Suspicion, spying and backbiting: the word that would foul the sea, the fault-hunter exposed, the stinking wind, copper nails, the brother''s flesh between the teeth (Q 49:12)'
  read:
  - Jāmiʿ 60:7480.2-7483.2
  quran:
  - '49:12'
  tags:
  - motif: suspicion-the-most-lying-speech
    refs:
    - Jāmiʿ 60:7480.2
    note: إياكم والظن، فإن الظن أكذب الحديث، ولا تجسسوا، ولا تحسسوا، ولا تنافسوا، ولا تحاسدوا
  - motif: piety-is-here-pointing-to-chest
    refs:
    - Jāmiʿ 60:7480.3
    note: التقوى ها هنا، ويشير إلى صدره ثلاث مرات ... كل المسلم على المسلم حرام، دمه وماله وعرضه
  - motif: no-shunning-brother-beyond-three-nights
    refs:
    - Jāmiʿ 60:7481.1
    note: ولا يحِلُّ لمسلم أن يهاجر أخاه فوق ثلاث ليال
  - motif: backbiting-true-is-backbiting-false-is-slander
    refs:
    - Jāmiʿ 60:7481.2
    note: ذكرك أخاك بما يكره ... إن كان فيه ما تقول فقد اغتبته، وإن لم يكن فيه فقد بهته
  - motif: word-that-would-pollute-the-sea
    refs:
    - Jāmiʿ 60:7481.3
    note: 'إن صفية امرأة - وقال بيده، كأنه يعني قصيرة - فقال: لقد مَزَجت بكلمة لو مُزِج بها ماء البحر مَزَجت'
  - motif: who-hunts-faults-exposed-in-own-house
    refs:
    - Jāmiʿ 60:7481.4
    - Jāmiʿ 60:7481.5
    - Jāmiʿ 60:7482.1
    note: يا معشر من آمن بلسانه ولم يدخل الإيمان قلبه ... من اتبع عوراتهم يتَّبع الله عورته، ومن يتَّبع الله عورته يفضحه في بيته / حتى أسمع العواتق في بيوتها
  - motif: believer-more-sacred-than-the-kaaba
    refs:
    - Jāmiʿ 60:7482.1
    note: ما أعظمك، وأعظم حرمتك، والمؤمن أعظم حرمة عند الله منك
  - motif: stinking-wind-from-backbiters
    refs:
    - Jāmiʿ 60:7482.2
    note: هاجت ريح منتنة ... إن ناسا من المنافقين اغتابوا أناسا من المسلمين، فبعثت هذه الريح لذلك / هذه ريح الذين يغتابون المؤمنين
  - motif: backbiters-scratch-faces-with-copper-nails
    refs:
    - Jāmiʿ 60:7483.1
    note: لما عُرِج بي مررت بقوم لهم أظفار من نحاس يخمشون بها وجوههم وصدورهم ... هؤلاء الذين يأكلون لحوم الناس، ويقعون في أعراضهم
  - motif: backbiters-flesh-seen-between-teeth
    refs:
    - Jāmiʿ 60:7483.2
    note: إن هذا لنؤوم ... بأكلكما لحم أخيكما، إني لأرى لحمه بين ثناياكم ... هو فليستغفر لكما
  hints:
  - A punishment fitted to the sinning organ seen in an otherworld tour against the Apocalypse of Peter (Akhmim 22-24), where blasphemers hang by their tongues and others gnaw their lips.
  - '''Eating the flesh'' of the slandered against Aramaic akal qarsin, ''to eat the pieces of'', as the idiom for accusing (Dan 3:8, 6:25).'
- id: hadith-60-peoples-and-tribes
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Peoples and tribes; learn your genealogies; God looks at hearts; the noblest; no Arab above a non-Arab (Q 49:13)
  read:
  - Jāmiʿ 60:7483.3-7484.5
  quran:
  - '49:13'
  tags:
  - motif: shuub-great-tribes-qabail-clans
    refs:
    - Jāmiʿ 60:7483.3
    note: 'الشعوب: القبائل العظام. والقبائل: البطون'
  - motif: learn-genealogy-to-keep-kin
    refs:
    - Jāmiʿ 60:7484.1
    note: تعلموا من أنسابكم ما تصلون به أرحامكم، فإن صلة الرحم محبة في الأهل، مثراة في المال، منسأة في الأثر
  - motif: god-looks-at-hearts-not-forms
    refs:
    - Jāmiʿ 60:7484.2
    note: إن الله لا ينظر إلى صوركم وأموالكم ولكن ينظر إلى قلوبكم وأعمالكم
  - motif: noblest-joseph-prophet-son-of-prophets
    refs:
    - Jāmiʿ 60:7484.3
    note: 'من أكرم الناس؟ قال: أتقاهم ... فيوسف نبي الله ابن نبي الله ابن نبي الله ابن خليل الله ... خيارهم في الجاهلية خيارهم في الإسلام إذا فقهوا'
  - motif: no-arab-better-than-non-arab-but-by-piety
    refs:
    - Jāmiʿ 60:7484.4
    note: في وسط أيام التّشريق ... ألا إنّ ربكم واحد، وإنّ أباكم واحد، ألا لا فضل لعربي على عجمي ... إلا بالتقوى
  - motif: children-of-adam-short-of-the-measure
    refs:
    - Jāmiʿ 60:7484.5
    note: إن أنسابكم هذه ليست بسِباب على أحد، وإنما أنتم ولد آدم، طَفُّ الصَّاع لم تملؤوه
  hints:
  - God looking at the heart, not the outward form, against 1 Sam 16:7, 'man looketh on the outward appearance, but the LORD looketh on the heart'.
- id: hadith-60-islam-and-faith
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: '''Or a Muslim?''; Banu Asad count their islam as a favour (Q 49:14-17)'
  read:
  - Jāmiʿ 60:7485.1-7485.2
  quran:
  - '49:14'
  - '49:17'
  tags:
  - motif: gift-to-weaker-lest-he-fall-into-fire
    refs:
    - Jāmiʿ 60:7485.1
    note: 'إني لأراه مؤمنا؟ فقال: أو مسلما؟ ... إني لأعطي الرجل وغيره أحب إلي منه، خشية أن يكبه الله في النار'
  - motif: tribe-boasts-of-not-fighting-the-prophet
    refs:
    - Jāmiʿ 60:7485.2
    note: قاتلتك مضر كلها، ولم نقاتلك، ولسنا بأقلهم عددا ... وصلنا رحمك ... إن فقههم لقليل، وإن الشيطان لينطق على لسانهم
- id: hadith-60-qaf-in-prayer-and-sermon
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Qaf at dawn, on the Friday pulpit and at the two feasts (Q 50:1)
  read:
  - Jāmiʿ 60:7487.1-7487.4
  quran:
  - '50:1'
  - 50:1-10
  - '54:1'
  tags:
  - motif: qaf-recited-at-dawn-friday-and-eids
    refs:
    - Jāmiʿ 60:7487.1
    - Jāmiʿ 60:7487.2
    - Jāmiʿ 60:7487.3
    - Jāmiʿ 60:7487.4
    note: كان يقرأ في الفجر بـ ق / فجعلت أرددها (والنخل باسقات) / لقد كان تنورنا وتنور رسول الله ﷺ واحدا ... يقرؤها كل يوم جمعة على المنبر / في الأضحى والفطر ... ق ... واقتربت الساعة
- id: hadith-60-first-creation-and-return
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The son of Adam belies and reviles God (Q 50:15)
  read:
  - Jāmiʿ 60:7488.1
  quran:
  - '50:15'
  tags:
  - motif: son-of-adam-denies-and-reviles-god
    refs:
    - Jāmiʿ 60:7488.1
    note: 'كذَّبني ابن آدم ... لن يعيدني كما بدأني. وليس أول الخلق بأهون عليَّ من إعادته، وأما شتمه إياي فقوله: اتخذ الله ولدا'
- id: hadith-60-whispers-overlooked
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: What the soul whispers is overlooked until spoken or done (Q 50:16)
  read:
  - Jāmiʿ 60:7488.2
  quran:
  - '50:16'
  tags:
  - motif: inner-thoughts-forgiven-until-spoken-or-done
    refs:
    - Jāmiʿ 60:7488.2
    note: إن الله تجاوز عن أمتى ما حدَّثَ به أنفسها ما لم تعمل أو تتكلم
- id: hadith-60-guarding-the-tongue
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The heedless word that raises or sinks; what is between the jaws; speak good or be silent (Q 50:18)
  read:
  - Jāmiʿ 60:7488.3-7489.4
  quran:
  - '50:18'
  tags:
  - motif: careless-word-raises-or-hurls-into-hell
    refs:
    - Jāmiʿ 60:7488.3
    - Jāmiʿ 60:7489.1
    note: إن العبد ليتكلم بالكلمة من رضوان الله، لا يُلقي لها بالا، يرفع الله بها درجات ... يهوي بها في جهنم / فيكتب الله له بها رضوانه إلى يوم القيامة
  - motif: guarantee-what-between-jaws-and-legs
    refs:
    - Jāmiʿ 60:7489.2
    note: من يضمن لي ما بين لحييه وما بين رجليه أضمن له الجنة
  - motif: speak-good-or-be-silent
    refs:
    - Jāmiʿ 60:7489.3
    - Jāmiʿ 60:7489.4
    note: فليقل خيرا أو ليصمت ... فلا يؤذ جاره ... فليكرم ضيفه / فليحسن إلى جاره
  hints:
  - Every idle word reckoned against Matt 12:36, 'every idle word that men shall speak, they shall give account thereof in the day of judgment'.
- id: hadith-60-agonies-of-death
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'The prophet''s death: ''death has agonies'', ''in the highest company'' (Q 50:19)'
  read:
  - Jāmiʿ 60:7490.1
  quran:
  - '50:19'
  tags:
  - motif: death-has-agonies-wiping-face-with-water
    refs:
    - Jāmiʿ 60:7490.1
    note: 'ركوة - أو علبة فيها ماء ... فيمسح بهما وجهه، ويقول: لا إله إلا الله، إن للموت سكرات ثم نصب يده، فجعل يقول: في الرفيق الأعلى حتى قبض ومالت يده'
- id: hadith-60-neck-from-the-fire
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: A speaking neck from the fire seizes three kinds (Q 50:24-26)
  read:
  - Jāmiʿ 60:7490.2
  quran:
  - 50:24-26
  tags:
  - motif: neck-from-fire-seizes-three
    refs:
    - Jāmiʿ 60:7490.2
    note: 'يخرج عنق من النار، يتكلم يقول: وُكِّلتُ اليوم بثلاثة: بكل جبَّار، وبمن جعل مع الله إلها آخر، وبمن قتل نفسا بغير نفس، فينطوي عليهم، فيقذفهم في غمرات جهنم'
- id: hadith-60-hell-asks-for-more
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: '''Are there more?'': the dispute of paradise and fire and the foot set in hell (Q 50:30)'
  read:
  - Jāmiʿ 60:7491.1-7491.4
  quran:
  - '50:30'
  tags:
  - motif: paradise-and-fire-dispute
    refs:
    - Jāmiʿ 60:7491.1
    - Jāmiʿ 60:7491.2
    - Jāmiʿ 60:7491.4
    note: 'تحاجت الجنة والنار ... أنت رحمتي ... إنما أنت عذابي ... ولكل واحدة منهما ملؤها / احتجت الجنة والنار، فقالت النار: فيَّ الجبارون والمتكبرون'
  - motif: hell-asks-for-more
    refs:
    - Jāmiʿ 60:7491.2
    - Jāmiʿ 60:7491.3
    note: 'فتقول: هل من مزيد، ثلاثا / لا تزال جهنم تقول: هل من مزيد'
  - motif: lord-sets-foot-hell-says-enough
    refs:
    - Jāmiʿ 60:7491.1
    - Jāmiʿ 60:7491.2
    - Jāmiʿ 60:7491.3
    note: 'فلا تمتلئ حتى يضع رجله، فتقول: قط قط قط، فهنالك تمتلئ ويزوي بعضها إلى بعض / حتى يضع فيها قدمه / رب العزة ... قدمه، فتقول: قط قط، وعزتك'
  - motif: new-creation-made-to-fill
    refs:
    - Jāmiʿ 60:7491.1
    - Jāmiʿ 60:7491.2
    note: وأما الجنة فإن الله ﷿ ينشئ لها خلقا / فأما الجنة فإن الله لا يظلم من خلقه أحدا، وإنه ينشئ للنار من يشاء، فيلقون فيها
  hints:
  - The underworld that is never full against Prov 30:15-16 ('the grave ... say not, It is enough') and Isa 5:14, Sheol enlarging herself and opening her mouth without measure.
