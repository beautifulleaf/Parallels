  - motif: prophet-on-mat-marks-on-side-kisra-and-caesar
    refs:
    - Jāmiʿ 60:7434.1
    note: فرأيت أثر الحصير في جنب رسول الله ﷺ، فبكيت ... إن كسرى وقيصر فيما هما فيه ... أما ترضى أن تكون لهم في الدُّنيا ولنا في الآخرة
  - motif: bed-of-leather-stuffed-with-palm-fibre
    refs:
    - Jāmiʿ 60:7434.1
    note: وتحت رأسه وسادة من أدم، حشوها ليف، وإن عند رجليه قرظا مصبوبا، وعند رأسه أهب معلقة
  - motif: gold-silver-vessels-and-silk-are-theirs-in-world
