  - motif: world-worth-less-than-gnats-wing
    refs:
    - Jāmiʿ 60:7434.3
    note: بشاة ميته شائلة برجلها ... لو كانت الدُّنيا تزن عند الله جناح بعوضة، ما سقى كافرًا منها قطرة
- id: hadith-60-son-of-mary-as-example
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Disputation the mark of a people gone astray; Quraysh and the example of Jesus; Jesus' coming as knowledge of the Hour (Q 43:57-61)
  read:
  - Jāmiʿ 60:7435.1-7436.1
  quran:
  - 43:57-61
  tags:
  - motif: people-astray-given-disputation
    refs:
    - Jāmiʿ 60:7435.1
    note: 'ما ضلّ قوم بعد هدى كانوا عليه إِلَّا أوتوا الجدل. ثمّ تلا: ما ضربوه لك إلا جدلا'
  - motif: nothing-worshipped-besides-god-has-good
    refs:
    - Jāmiʿ 60:7436.1
