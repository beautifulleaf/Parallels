    note: 'ذهب أهلُ الدثور من الأموال بالدرجات العُلى ... فقال بعضُنا: ... ونكبِّرُ أربعًا وثلاثين'
  - motif: glorify-after-every-prayer-adbar-al-sujud
    refs:
