  - motif: riding-prayer-on-mounts-and-ships
    refs:
    - Jāmiʿ 60:7433.1
    note: سبحان الذي سخر لنا هذا وما كنا له مقرنين وإنا إلى ربنا لمنقلبون
  - motif: god-the-companion-on-journey-deputy-over-family
