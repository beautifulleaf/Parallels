      - {motif: abraham-image-with-divining-arrows, refs: ['Jāmiʿ 2:421.2'], note: وجد فيه صورة إبراهيم وصورة مريم; هذا إبراهيم مصور، فما له يسْتَقْسِمُ}
      - {motif: gabriel-kept-away-by-puppy-under-bed, refs: ['Jāmiʿ 2:421.3', 'Jāmiʿ 2:422.1'], note: ثم وقع في نفسه جرو كلب تحت فُسطاط لنا; فإذا جرو كلبٍ تحت سريره}
      - {motif: dogs-killed-small-garden-dog-killed-large-spared, refs: ['Jāmiʿ 2:421.3'], note: حتى إنّه ليأمر بقتل كلب الحائط الصّغير، ويترك كلب الحائط الكبير}
    hints:
      - 'The ban on images made into a punishment of the makers (''give life to what you created''): Exod 20:4 and Deut 4:16-18 forbid the image; Isa 44:9-20 mocks the maker who cannot give it breath (Jer 10:14 ''no breath in them'')'
  - id: hadith-2-bell-and-dog-on-the-road
    tradition: islam
    corpus: hadith
    original: true
    tagger: Claude Opus 5.5, reading the Arabic
    title: The bell is the devil's pipes; angels do not travel with a company that has a dog or a bell
    read: ['Jāmiʿ 2:424.1-424.4']
    tags:
      - {motif: bell-is-the-devils-pipes, refs: ['Jāmiʿ 2:424.1'], note: الجرسُ مزامير الشيطان}
      - {motif: angels-do-not-accompany-company-with-dog-or-bell, refs: ['Jāmiʿ 2:424.2', 'Jāmiʿ 2:424.3', 'Jāmiʿ 2:424.4'], note: لا تصحبُ الملائكةُ رفقةً فيها كلب ولا جرس}
  - id: hadith-2-angels-pray-for-the-sitter
    tradition: islam
    corpus: hadith
    original: true
    tagger: Claude Opus 5.5, reading the Arabic
    title: Angels pray for one who stays in his place of prayer
    read: ['Jāmiʿ 2:425.1']
    tags:
      - {motif: angels-pray-for-one-sitting-where-he-prayed, refs: ['Jāmiʿ 2:425.1'], note: الملائكةُ تصلي على أحدكم ما دام في مصلاه الذي صلّى فيه، ما لم يحدث، اللهم اغفرْ له، اللهمّ ارْحمه}
  - id: hadith-2-god-boasts-of-arafa
    tradition: islam
    corpus: hadith
    original: true
    tagger: Claude Opus 5.5, reading the Arabic
    title: On the day of 'Arafa God draws near and boasts to the angels of the dishevelled, dusty pilgrims
    read: ['Jāmiʿ 2:426.1-427.1']
    tags:
      - {motif: god-draws-near-on-arafa-boasts-of-dishevelled-pilgrims, refs: ['Jāmiʿ 2:426.1', 'Jāmiʿ 2:426.2', 'Jāmiʿ 2:426.3', 'Jāmiʿ 2:427.1'], note: 'وإنّه ليدنو ثم يباهي بهم الملائكة فيقول: ما أراد هؤلاء; إنّ اللَّه ينزل إلى السّماء الدّنيا يباهي بأهل عرفة الملائكة; انظُروا إلى عبادي شُعْثًا غُبْرًا'}
  - id: hadith-2-angels-in-human-form
    tradition: islam
    corpus: hadith
    original: true
    tagger: Claude Opus 5.5, reading the Arabic
    title: 'Angels take a man''s form: the leper, bald and blind man tested; the angel on the road of one who visits a brother for God'
    read: ['Jāmiʿ 2:428.1-428.2']
    tags:
      - {motif: angel-heals-and-enriches-three-to-test-them, refs: ['Jāmiʿ 2:428.1'], note: أبرص وأقرع وأعمى بدا للَّه أن يبتليهم، فبعث إليهم ملكًا}
      - {motif: angel-waylays-man-visiting-brother-for-god, refs: ['Jāmiʿ 2:428.2'], note: فأرْصد اللَّه له على مدرجته ملكًا; فإنّي رسولُ اللَّه إليك، بأنّ اللَّه قد أحبَّك كما أحببته}
    hints:
      - 'An angel waiting on the road to question a traveller: the angel in the road before Balaam, Num 22:22-35, and Raphael on Tobias'' road (Tob 5); here the angel brings a blessing'
  - id: hadith-2-angels-say-amen
    tradition: islam
    corpus: hadith
    original: true
    tagger: Claude Opus 5.5, reading the Arabic
    title: 'The angels'' amen: at prayer, at the sickbed, and over a prayer for an absent brother'
    read: ['Jāmiʿ 2:428.3-429.3']
    tags:
      - {motif: amen-agreeing-with-angels-forgives-past-sins, refs: ['Jāmiʿ 2:428.3'], note: فإنّه من وافق تأمينُه تأمين الملائكة غفر له ما تقدّم من ذنبه}
      - {motif: angels-say-amen-at-sickbed-and-deathbed, refs: ['Jāmiʿ 2:429.1'], note: إذا حضرتُم المريض أو الميت فقولوا خيرًا، فإن الملائكة يؤمِّنون على ما تقولون}
      - {motif: angel-at-head-says-and-for-you-likewise, refs: ['Jāmiʿ 2:429.2', 'Jāmiʿ 2:429.3'], note: 'إلّا قال الملك: ولك بمثل; عند رأسه ملك موكَّل'}
  - id: hadith-2-angel-of-the-mountains
    tradition: islam
    corpus: hadith
    original: true
    tagger: Claude Opus 5.5, reading the Arabic
    title: 'After Ta''if: the angel of the mountains offers to bring the two Akhshabs down on Mecca; the Prophet hopes for believers from their loins'
    read: ['Jāmiʿ 2:429.4']
    tags:
      - {motif: angel-of-mountains-offers-to-crush-the-town, refs: ['Jāmiʿ 2:429.4'], note: إن شئتَ أن أطبِّق عليهم الأخشبين; بل أرجو أن يخرجَ اللَّهُ من أصلابهم من يعبد اللَّه وحدَه}
    hints:
      - 'A prophet offered destruction of a rejecting town and declining it: against 2 Kgs 1:10-12 (Elijah calls fire on the soldiers) and Luke 9:54-55, where Jesus rebukes the disciples who would call down fire on a Samaritan village'
  - id: hadith-2-angel-of-the-womb-forty-days
    tradition: islam
    corpus: hadith
    original: true
    tagger: Claude Opus 5.5, reading the Arabic
    title: 'The angel of the womb: forty days drop, clot, lump; the four things written; at forty-two nights the angel shapes the embryo'
    read: ['Jāmiʿ 2:430.1-431.1']
    tags:
      - {motif: embryo-forty-days-each-as-drop-clot-lump, refs: ['Jāmiʿ 2:430.1'], note: إنّ خلق أحدكم يُجمع في بطن أمه أربعين يومًا وأربعين ليلةً، ثم يكون علقة مثله، ثم يكون مضغة مثله}
      - {motif: angel-writes-four-things-for-the-embryo, refs: ['Jāmiʿ 2:430.1'], note: 'فيؤذن بأربع كلمات فيكتب: رزقه، وأجله، وعمله، وشقي أم سعيد'}
      - {motif: spirit-breathed-in-after-embryo-stages, refs: ['Jāmiʿ 2:430.1'], note: ثم ينفخ فيه الرّوح}
      - {motif: deeds-of-paradise-till-a-cubit-then-book-overtakes, refs: ['Jāmiʿ 2:430.1'], note: حتى لا يكون بينها وبينه إلّا ذراع فيسبق عليه الكتاب}
      - {motif: angel-shapes-embryo-at-forty-two-nights-asks-male-or-female, refs: ['Jāmiʿ 2:430.2'], note: إذا مرَّ بالنّطفة ثنتان وأربعون ليلة، بعث اللَّه إليها ملكًا فصوَّرها; ثم يخرج الملك بالصّحيفة في يده فلا يزيد ما أمر ولا ينقص}
      - {motif: angel-of-womb-announces-drop-clot-lump, refs: ['Jāmiʿ 2:431.1'], note: يا ربّ نطفة، با ربّ عَلَقة، يا ربّ مُضغة}
    hints:
      - 'Forty days before the embryo is formed and an angel over conception: the rabbinic forty days of formation (m. Nid 3:7; b. Men 99b ''water'' for forty days) and the angel Laylah who takes the drop before God and asks ''strong or weak, wise or foolish, rich or poor'' (b. Nid 16b)'
  - id: hadith-2-angels-seek-remembrance
    tradition: islam
    corpus: hadith
    original: true
    tagger: Claude Opus 5.5, reading the Arabic
    title: 'Roving angels seek gatherings of remembrance; God''s questions: have they seen me, paradise, the fire? ''Their companion is not wretched'''
    read: ['Jāmiʿ 2:434.1']
    tags:
      - {motif: angels-roam-roads-seeking-gatherings-of-remembrance, refs: ['Jāmiʿ 2:434.1'], note: إن للَّه ملائكة يطوفون في الطُّرق يلتمسون أهلَ الذِّكْرِ; هُمُ الجلساء لا يشقى بهم جليسُهم}
  - id: hadith-2-angels-convey-greeting-lower-wings
    tradition: islam
    corpus: hadith
    original: true
    tagger: Claude Opus 5.5, reading the Arabic
    title: Roaming angels convey the community's greeting; angels lower their wings for the seeker of knowledge
    read: ['Jāmiʿ 2:434.2-436.1']
    tags:
      - {motif: roaming-angels-convey-communitys-greeting-to-prophet, refs: ['Jāmiʿ 2:434.2'], note: إنّ للَّه ملائكةً سياحين في الأرض يبلّغون من أمتي السّلامَ}
      - {motif: angels-lower-wings-for-seeker-of-knowledge, refs: ['Jāmiʿ 2:436.1'], note: ما من خارج خرج من بيته في طلب العلم إلا وضعتِ الملائكةُ أجنحتها رضا بما يصنع}
  - id: hadith-2-angels-guard-medina
    tradition: islam
    corpus: hadith
    original: true
    tagger: Claude Opus 5.5, reading the Arabic
    title: Angels on the passes of Medina keep out the plague and the Dajjal; seven gates, two angels each; the Dajjal turned at Uhud; Ibn Sayyad's protest
    read: ['Jāmiʿ 2:436.2-437.4']
    tags:
      - {motif: plague-and-dajjal-kept-from-medina, refs: ['Jāmiʿ 2:436.2'], note: على أنقاب المدينة ملائكة، لا يدخلُها الطّاعون والدّجال}
      - {motif: angels-guard-gates-of-mecca-and-medina, refs: ['Jāmiʿ 2:436.3'], note: ليس من بلد إلا سيطؤُه الدّجَّال إلّا مكّة والمدينة، ليس له من نقابها نَقْب إلّا عليه الملائكة صافّين يحرسونها}
      - {motif: medina-shakes-three-times-expels-unbelievers-and-hypocrites, refs: ['Jāmiʿ 2:436.3'], note: ثم ترجفُ المدينة بأهلها ثلاث رجَفات، فيخرجُ اللَّه كلَّ كافرٍ ومنافقٍ}
      - {motif: medina-seven-gates-two-angels-each, refs: ['Jāmiʿ 2:437.1'], note: لها يومئذ سبعة أبواب، على كلّ باب ملكان}
      - {motif: dajjal-turned-at-uhud-perishes-in-syria, refs: ['Jāmiʿ 2:437.2'], note: حتى ينزل دُبر أحد، ثم تَصْرفُ الملائكةُ وجهه قِبل الشام، وهنالك يُهْلِكُ}
      - {motif: angels-with-drawn-swords-at-passes, refs: ['Jāmiʿ 2:437.3'], note: استقبلني ملك بيده السّيف صَلْتًا يَصُدّني عنها}
      - {motif: dajjal-forty-nights-every-town-but-mecca-and-tayba, refs: ['Jāmiʿ 2:437.3'], note: فلا أدع قرية إلا هبطتُها في أربعين ليلةً غير مكة وطيبة}
      - {motif: ibn-sayyad-argues-he-is-not-the-dajjal, refs: ['Jāmiʿ 2:437.4'], note: 'ألستَ سمعتَ رسول اللَّه ﷺ يقول: "إنّه لا يولد له"؟ قال: قلت: بلى. قال: فقد وُلد لي'}
    hints:
      - 'An angel with a drawn sword barring the way (437.3): the angel with drawn sword in the road against Balaam, Num 22:23, and the cherubim with the flaming sword guarding the way, Gen 3:24'
