      - 'The ''highest assembly'' (al-malaʾ al-aʿlā) disputing before God: the heavenly council of 1 Kgs 22:19-22 and Ps 82:1, and the rabbinic ''academy on high'' (yeshiva shel maʿala) that disputes a ruling, b. BM 86a'
