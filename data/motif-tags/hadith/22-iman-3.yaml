      - {motif: divine-palm-between-shoulders-coolness-between-breasts, refs: ['Jāmiʿ 2:354.1', 'Jāmiʿ 2:357.1', 'Jāmiʿ 2:358.1', 'Jāmiʿ 2:359.1'], note: وضع كفَّه بين كتفيَّ حتى وجتُ بَرْد أنامله بين ثدييَّ، فتجلّى لي كلُّ شيءٍ وعرفتُ; أو وضعهما بين ثديي حتى وجدت بردها بين كتفي}
      - {motif: highest-assembly-disputes-expiations-and-degrees, refs: ['Jāmiʿ 2:354.1', 'Jāmiʿ 2:357.1', 'Jāmiʿ 2:358.1'], note: 'مشيُ الأقدام إلى الحسنات، والجلوس في المساجد بعد الصّلوات، وإسباغُ الوضوء حين الكَرِيهات; والدّرجات: إطعام الطّعام، وبذلُ السّلام، والقيام باللّيل والنّاس نيام'}
      - {motif: prayer-take-me-unseduced-when-you-will-trial, refs: ['Jāmiʿ 2:354.1', 'Jāmiʿ 2:357.1', 'Jāmiʿ 2:358.1'], note: وإذا أردت فتنة قوم فتوفني غير مفتون}
