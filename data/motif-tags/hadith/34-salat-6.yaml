    note: أربع ركعات ويزيد ما شاء
- id: hadith-9-forenoon-charity-of-joints
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Charity due on the joints, suffered by two forenoon rakʿas; four rakʿas suffice the day
  read:
  - Jāmiʿ 9:1815.2-1817.2
  tags:
  - motif: charity-on-every-joint-two-forenoon-rakas-suffice
    refs:
    - Jāmiʿ 9:1815.2
    note: يُصبح على كلِّ سُلامَى من أحدكم صدقةٌ ... ويُجزِئُ من ذلك ركعتان يركعهما من الضُّحى
  - motif: three-bequests-fast-forenoon-witr
    refs:
    - Jāmiʿ 9:1816.1
    - Jāmiʿ 9:1817.1
    note: أوصاني بصلاة الضُّحى، وبالوتر قبل النوم ... بصيام ثلاثة أيام من كل شهر، وصلاةِ الضُّحى، وبأن لا أنامَ حتى أوتر
  - motif: four-forenoon-rakas-god-suffices-the-day
    refs:
    - Jāmiʿ 9:1816.2
    note: ابن آدم اركع لي من أوَّل النهار أربع ركعات أكفِك آخِرَه
  - motif: human-made-of-360-joints
    refs:
    - Jāmiʿ 9:1817.2
    note: في الإنسان ثلاثمائة وستون مفْصلًا، فعليه أن يتصدق عن كل مفْصلٍ منه بصدقةٍ
  - motif: spittle-buried-obstacle-removed-as-joint-charity
    refs:
    - Jāmiʿ 9:1817.2
    note: النخاعة في المسجد تدفِنُها، والشيء تُنحّيه عن الطريق، فإن لم تجد فركعتا الضُّحي تُجزئك
  hints:
  - 'Three hundred and sixty joints each owing a charity (Jāmiʿ 9:1817.2) - compare the rabbinic count of the body''s 248 limbs (M. Ohalot 1:8), matched to the 248 positive commandments (b. Makkot 23b): a number of body parts tied to a number of duties'
