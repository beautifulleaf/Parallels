# Hadith chunk 34: al-Jāmiʿ al-Kāmil book 9 (kitāb al-ṣalāt), pp. 1703-1822 (printed 3/281-400): the end of the
# night prayer (its length and count, sitting, missing it, constancy and moderation), the witr (its status, times, counts,
# suras and words), the qunut, the traveller's prayer (shortening, joining, prayer on the mount), the fear prayer, and
# the forenoon prayer. Read in full from the Arabic (198 hadith).
new_motifs:
  night-prostration-as-long-as-fifty-verses:
    label: In his night prayer each prostration lasted as long as one of you takes to recite fifty verses
    cluster: ritual
  lightens-with-them-lengthens-alone-for-your-sake:
    label: 'In Ramadan he comes out and prays lightly with them, goes in and prays long, again and again: ''I did it for your sake'''
    cluster: ritual
  wipes-sleep-recites-last-ten-of-al-imran:
    label: Waking at about midnight he wipes the sleep from his face with his hand and recites the last ten verses of Al Imran
    cluster: ritual
  ablution-from-hanging-waterskin:
    label: At night he rises to a hanging old waterskin (shann muʿallaq), makes a good ablution from it and stands to pray
    cluster: ritual
  boy-sleeps-across-cushion-couple-along-it:
    label: The boy sleeps across the width of the cushion, the prophet and his wife along its length
    cluster: sira
  thirteen-rakas-of-night-prayer:
    label: His night prayer was thirteen rakʿas (counting the witr, or the two of dawn)
    cluster: ritual
  four-then-four-do-not-ask-their-beauty:
    label: 'Never more than eleven, in Ramadan or out: ''he prayed four - do not ask how fine and long they were - then four, then three'''
    cluster: ritual
  two-rakas-seated-after-witr:
    label: After the witr he prayed two rakʿas sitting, standing up to bow
    cluster: ritual
  seven-nine-eleven-besides-dawn-two:
    label: 'Asked of his night prayer Aisha says: seven, nine and eleven, besides the two of dawn'
    cluster: ritual
  witr-of-five-sitting-only-at-end:
    label: He made the witr of five, sitting in none of them but the last
    cluster: ritual
  watches-night-prayer-pillowed-on-threshold:
    label: 'Resolved to watch the prophet''s night prayer, a Companion pillows his head on his threshold (or tent) and counts: two long, then pairs each shorter than the last, then the witr: thirteen'
    cluster: sira
  night-prayer-two-by-two-one-raka-at-dawn-fear:
    label: The night prayer is two by two; when one fears the dawn he prays one rakʿa, which makes odd what he has prayed
    cluster: ritual
  you-are-dense-let-me-finish:
    label: Interrupted, Ibn Umar says 'you are dense (ḍakhm) - bah bah - will you not let me tell the whole hadith?'
    cluster: transmission
  as-if-the-call-in-his-ears:
    label: He prayed the two before dawn as if the call to prayer were in his ears (quickly)
    cluster: ritual
  first-seated-voluntary-a-year-before-death:
    label: Hafsa never saw him pray his voluntary prayer sitting until a year before his death
    cluster: ritual
  sura-drawn-out-longer-than-longer:
    label: He recited a sura so slowly (yurattiluhā) that it became longer than a longer one
    cluster: ritual
  did-not-die-until-praying-seated:
    label: He did not die until much (most) of his prayer, all but the obligatory, was prayed sitting
    cluster: ritual
  bows-standing-if-recited-standing:
    label: 'Long nights standing and long nights sitting: reciting standing he bowed standing, reciting sitting he bowed sitting'
    cluster: ritual
  rises-for-last-thirty-or-forty-verses:
    label: Grown old, he recited sitting and rose to recite thirty or forty verses standing before bowing
    cluster: ritual
  seated-half-reward-lying-half-of-seated:
    label: Prayer sitting earns half the reward of standing; prayer lying (nāʾim) half that of sitting
    cluster: ritual
  hand-on-head-i-am-not-like-you:
    label: Finding the prophet praying sitting after teaching that sitting is half the prayer, a Companion puts his hand on his head; 'yes, but I am not like any of you'
    cluster: ritual
  prays-cross-legged:
    label: Aisha saw the prophet praying cross-legged (mutarabbiʿan)
    cluster: ritual
  missed-portion-read-before-noon-counts-as-night:
    label: Whoever sleeps through his nightly portion (ḥizb) and reads it between the dawn and noon prayers has it written as if read at night
    cluster: ritual
  overcome-by-sleep-sleep-is-charity-from-lord:
    label: Whoever goes to bed meaning to rise for prayer and sleeps till morning has what he intended written, and his sleep is a charity to him from his Lord
    cluster: ritual
  skipped-night-prayer-sick-one-or-two-nights:
    label: Ill, the prophet did not rise for one or two nights
    cluster: sira
  twelve-rakas-by-day-for-missed-night:
    label: When sleep or pain kept him from night prayer he prayed twelve rakʿas by day
    cluster: ritual
  prayer-of-desire-and-dread-three-asked-two-given:
    label: 'A long prayer ''of desire and dread'': he asked God three things, was given two (no destroying famine, no outside enemy) and refused one (that they not taste one another''s violence)'
    cluster: eschatology
  doze-in-prayer-may-curse-himself:
    label: 'Who dozes in prayer should sleep it off: meaning to ask forgiveness he may revile himself'
    cluster: ritual
  sleep-until-you-know-what-you-recite:
    label: Drowsy in prayer, sleep until you know what you recite
    cluster: ritual
  quran-garbled-on-tongue-lie-down:
    label: If at night the Quran becomes garbled on his tongue (istaʿjama) and he does not know what he says, let him lie down
    cluster: ritual
  his-work-was-steady-rain:
    label: 'Asked if he singled out days, Aisha: no, his work was steady rain (dīma); which of you can do what he could?'
    cluster: ritual
  god-does-not-tire-until-you-tire:
    label: 'Take of deeds what you can bear: God does not tire until you tire'
    cluster: theology
  mat-screen-by-night-seat-by-day:
    label: He screened off a mat by night to pray in and spread it by day to sit on; people gathered to pray behind him
    cluster: ritual
  aisha-kept-to-a-deed:
    label: When Aisha did a deed she kept to it
    cluster: ritual
  woman-praised-for-prayer-told-mah:
    label: 'Told of a woman who does not sleep at night for prayer: ''Mah! Hold to what you can bear'''
    cluster: ritual
  rope-between-pillars-for-tired-worshipper:
    label: 'A rope stretched between two pillars for Zaynab to hang on when she flags: ''untie it; let each pray while lively and sit when he flags'''
    cluster: ritual
  eye-sunken-soul-exhausted:
    label: Standing every night and fasting every day, 'your eye will sink and your soul be exhausted'
    cluster: ethics
  self-family-guest-have-a-right:
    label: 'Your self has a right over you, your family a right, your guest a right: fast and break fast, stand and sleep'
    cluster: ethics
  every-deed-has-zeal-then-slackening:
    label: Every deed has its zeal (shirra) then its slackening (fatra); slackening into sunna is guidance, into innovation is ruin
    cluster: ethics
  neglected-wife-shabby-appearance:
    label: 'The prophet notices a wife''s shabby look (badhādha): her husband fasts by day and stands by night, so she is as one without a husband'
    cluster: ethics
  men-would-have-castrated-themselves:
    label: Had the prophet let Uthman b. Mazʿun go on as he was, Muslim men had agreed to castrate themselves and live celibate
    cluster: ethics
  five-prayers-a-covenant-to-enter-paradise:
    label: 'Five prayers God wrote on his servants: whoever keeps them has a covenant with God to enter paradise; who does not has none - punished or admitted as God wills'
    cluster: theology
  god-is-odd-loves-the-odd:
    label: God is odd (witr) and loves the odd
    cluster: theology
  people-of-the-quran-pray-witr:
    label: '''O people of the Quran, pray the witr, for God is odd and loves the odd'''
    cluster: ritual
  god-added-a-prayer-the-witr:
    label: 'God has added a prayer for you, the witr: pray it between the night prayer and dawn'
    cluster: ritual
  witr-on-camel:
    label: The prophet prayed the witr on his camel; a man who dismounted to pray it is asked 'have you no model in the messenger?'
    cluster: ritual
  wakes-wife-to-pray-witr:
    label: He prays while his wife sleeps crosswise on his bed; when about to pray the witr he wakes her and she prays it
    cluster: ritual
  make-witr-last-of-night:
    label: Make the witr the last of your night prayer
    cluster: ritual
  no-two-witrs-in-one-night:
    label: 'A Companion who led the witr at his hosts'' puts another man forward for his own congregation''s witr: ''no two witrs in one night'''
    cluster: ritual
  witr-every-part-of-night-ending-at-sahar:
    label: He prayed the witr in every part of the night, first, middle and last; at the end his witr reached the pre-dawn (saḥar)
    cluster: ritual
  praise-god-who-made-latitude:
    label: 'Hearing that the prophet did it sometimes early, sometimes late: ''God is greatest; praise God who made latitude in the matter'''
    cluster: ritual
  last-of-night-prayer-is-witnessed:
    label: 'Whoever expects to rise, let him pray witr at the end of the night: prayer (recitation) at the end of the night is witnessed (mashhūda)'
    cluster: ritual
  abu-bakr-prudence-umar-strength:
    label: 'Abu Bakr prays witr before sleeping, Umar at the end of the night: ''this one took the prudent way, that one the strong way'''
    cluster: sira
  three-bequests-fast-forenoon-witr:
    label: '''My friend charged me with three I will not leave till death: three days'' fast each month, the forenoon prayer, and sleeping only after the witr'''
    cluster: ritual
  witr-before-dawn-else-none:
    label: Pray the witr before morning; whoever reaches dawn without praying it has no witr; when dawn breaks the night prayer and witr are gone
    cluster: ritual
  missed-witr-prayed-on-waking-or-remembering:
    label: Whoever sleeps through or forgets his witr prays it when he wakes or remembers
    cluster: ritual
  witr-reduced-when-aged-and-heavy:
    label: He prayed witr with nine (or thirteen); when he aged and grew heavy (fleshy) he prayed it with seven
    cluster: ritual
  after-witr-two-with-zalzala-and-kafirun:
    label: 'In the two seated rakʿas after the witr he recited ''When the earth is shaken'' and ''Say: O unbelievers'''
    cluster: ritual
  journey-two-rakas-after-witr-in-case:
    label: '''This journey is strain and weight'': after the witr pray two rakʿas; if you wake (pray), if not they count for you'
    cluster: ritual
  witr-one-raka-at-end-of-night:
    label: The witr is one rakʿa at the end of the night
    cluster: ritual
  glory-to-holy-king-three-times-after-witr:
    label: After the salam of the witr he said 'Glory to the King, the Holy' three times, raising his voice at the third
    cluster: ritual
  witr-four-and-three-to-ten-and-three:
    label: He prayed witr with four and three, six and three, eight and three, ten and three; never fewer than seven nor more than thirteen
    cluster: ritual
  salam-between-even-and-odd-audible:
    label: He separated the even (shafʿ) from the odd (witr) by a salam that he let them hear
    cluster: ritual
  witr-a-right-five-three-or-one:
    label: 'The witr is a right (ḥaqq) on every Muslim: whoever likes, with five, with three, or with one'
    cluster: ritual
  witr-by-nod-if-unable:
    label: Pray witr with five; if you cannot, three; if not, one; if not, nod (awmiʾ)
    cluster: ritual
  witr-of-three-not-like-maghrib:
    label: Do not pray witr with three, resembling the sunset prayer; pray it with five or seven
    cluster: ritual
  witr-ikhlas-and-the-two-refuge-suras:
    label: In the two before the witr al-Aʿla and al-Kafirun; in the witr al-Ikhlas and the two suras of refuge
    cluster: ritual
  qunut-guide-me-among-those-you-guided:
    label: 'Words taught for the witr: ''O God, guide me among those you guided ... you decree and none decrees against you; none you befriend is abased, none you oppose is mighty'''
    cluster: ritual
  stood-a-moment-after-second-raka-of-dawn:
    label: Rising from the second bowing of the dawn prayer he stood a moment (hunayya)
    cluster: ritual
  qunut-before-and-after-bowing:
    label: 'Anas: we used to make the qunut both before and after the bowing'
    cluster: ritual
  only-passing-on-the-prophets-errand:
    label: Met by two clans at the well, the reciters say 'By God, it is not you we want; we are passing on an errand for the prophet' - and are killed
    cluster: sira
  reciters-gather-wood-by-day-pray-by-night:
    label: The seventy called the reciters gathered firewood by day and prayed by night
    cluster: sira
  prays-for-rescue-of-named-captives:
    label: Standing after the bowing he prays 'save al-Walid b. al-Walid, Salama b. Hisham, Ayyash b. Abi Rabia and the oppressed believers'
    cluster: ritual
  abu-hurayra-qunut-to-bring-prayer-near:
    label: '''I will bring the prophet''s prayer near to you'': Abu Hurayra makes the qunut in noon, night and dawn, praying for believers and cursing unbelievers'
    cluster: ritual
  ghifar-forgiven-aslam-made-safe-usayya-disobeyed:
    label: 'Wordplay in the prayer: ''Ghifar, God forgive it; Aslam, God make it safe; Usayya disobeyed God and his messenger'''
    cluster: ritual
  qunut-in-dawn-and-sunset:
    label: He made the qunut in the dawn and sunset prayers
    cluster: ritual
  qunut-a-month-then-left:
    label: He made qunut for a month against Arab clans, then left it
    cluster: ritual
  stopped-praying-for-them-they-have-come:
    label: 'He stopped praying for the captives: ''do you not see they have come?'''
    cluster: ritual
  father-calls-dawn-qunut-innovation:
    label: 'Asked whether the prophet and the four caliphs made qunut, a Companion who prayed behind them says: ''my son, it is new (muḥdath)'''
    cluster: ritual
  qunut-only-for-or-against-a-people:
    label: He made qunut only to pray for a people or against a people
    cluster: ritual
  those-behind-say-amen-to-qunut:
    label: A month of qunut in all five prayers after the last bowing against clans of Sulaym, those behind him saying amen
    cluster: ritual
  hands-raised-cursing-the-killers:
    label: Every dawn prayer he raised his hands to pray against the killers of the reciters
    cluster: ritual
  prayer-first-imposed-as-two:
    label: Prayer was first imposed as two and two, at home and travelling; the travel prayer was kept and the home prayer increased
    cluster: ritual
  four-at-home-two-travelling-one-in-fear:
    label: 'God imposed prayer by your prophet''s tongue: four at home, two travelling, one in fear'
    cluster: ritual
  two-complete-not-shortened:
    label: 'Travel prayer, Friday, the two feasts: two rakʿas each, complete, not shortened'
    cluster: ritual
  travel-prayer-not-in-quran:
    label: '''We find home prayer and fear prayer in the Quran, not travel prayer'' - ''we knew nothing; we do as we saw Muhammad do'''
    cluster: scripture
  fig-and-olive-in-travel-night-prayer:
    label: Travelling, he recited 'By the fig and the olive' in one rakʿa of the night prayer
    cluster: ritual
  fearing-none-but-god-prayed-two:
    label: Going from Medina to Mecca fearing none but God, Lord of the worlds, he prayed two
    cluster: ritual
  two-with-prophet-abu-bakr-umar:
    label: I prayed two with the prophet, two with Abu Bakr, two with Umar (on journeys, at Mina)
    cluster: ritual
  god-loves-dispensations-taken:
    label: God loves his dispensations (rukhaṣ) to be taken as he hates his disobedience (as he loves his firm commands) to be done
    cluster: theology
  adders-to-two-rakas-pass-through-like-arrow:
    label: 'Seeing men add two rakʿas to the travel prayer Anas says ''God make the faces ugly'' and quotes: people who go deep in religion pass through it like an arrow through the game'
    cluster: ethics
  four-at-medina-two-at-dhul-hulayfa:
    label: Noon four at Medina, afternoon two at Dhu l-Hulayfa
    cluster: ritual
  shortening-at-short-distance:
    label: He shortened to two on going out three miles or three farsakhs; a governor prays two at seventeen or eighteen miles
    cluster: ritual
  ten-days-at-mecca-two-each:
    label: Medina to Mecca and back he prayed two and two; he stayed at Mecca ten days
    cluster: ritual
  two-at-mecca-sunna-of-abul-qasim:
    label: 'At Mecca, praying without the imam: ''two, the sunna of Abu l-Qasim'''
    cluster: ritual
  uthman-four-at-mina-wish-for-two-accepted:
    label: Uthman prays four at Mina; Ibn Masud says 'we are God's' and wishes his share of the four were two accepted rakʿas
    cluster: ritual
  with-imam-four-alone-two:
    label: After Uthman began praying four at Mina, Ibn Umar prayed four behind the imam and two alone
    cluster: ritual
  two-at-mina-safest-of-times:
    label: He prayed two at Mina, when people were safest and most numerous
    cluster: ritual
  noon-delayed-to-afternoon-if-leaving-before-zenith:
    label: Leaving before the sun declined he delayed noon to afternoon and joined them; if it had declined he prayed noon and rode
    cluster: ritual
  joined-while-halted-at-tabuk:
    label: At Tabuk he delayed the prayer one day, came out and prayed noon and afternoon together, went in, came out and prayed sunset and night together
    cluster: ritual
  joined-so-as-not-to-burden-community:
    label: 'Asked why he joined the prayers, Ibn Abbas: he wanted not to burden (yuḥrij) his community'
    cluster: ritual
  joined-in-medina-without-fear-or-travel:
    label: At Medina he prayed noon with afternoon and sunset with night, without fear or travel; Malik thinks it was rain
    cluster: ritual
  only-two-prayers-out-of-time-at-muzdalifa:
    label: 'Ibn Masud never saw him pray out of its time but two: sunset joined with night, and dawn before its time, at Jam'''
    cluster: ritual
  noon-prayed-before-leaving-even-at-midday:
    label: Halting, he did not move on until he had prayed noon, even at midday
    cluster: ritual
  would-have-completed-if-praying-extras:
    label: 'Seeing men pray extras after the travel prayer Ibn Umar says: ''if I prayed extras I would complete my prayer''; the prophet, Abu Bakr, Umar, Uthman never added to two'
    cluster: ritual
  voluntary-on-mount-any-direction-not-obligatory:
    label: He prayed voluntary prayer on his mount whichever way it faced, nodding, but not the obligatory; for that he dismounted and faced the qibla
    cluster: ritual
  women-no-license-to-pray-on-mounts:
    label: 'Asked whether women may pray on their beasts, Aisha: they were given no license in hardship or ease'
    cluster: ritual
  prays-on-donkey-toward-khaybar:
    label: He prayed on a donkey heading for Khaybar; Anas prays on a donkey facing off the qibla, 'I would not had I not seen him'
    cluster: ritual
  wherever-you-turn-revealed-for-mount-prayer:
    label: 'Praying on his camel coming from Mecca to Medina, facing wherever: ''about this was revealed: wherever you turn, there is the face of God'''
    cluster: scripture
  faces-qibla-for-opening-takbir-then-any-way:
    label: Wishing to pray voluntary prayer on a journey, he turned his camel to the qibla, said the takbir, then prayed wherever his mount turned
    cluster: ritual
  prostration-lower-than-bowing-on-mount:
    label: On his mount facing east, his prostration (by nodding) was lower than his bowing
    cluster: ritual
  fear-prayer-one-raka-each-group-completes-alone:
    label: 'Fear prayer: each group prays one rakʿa with the prophet; after his salam each man prays one rakʿa for himself'
    cluster: ritual
  gabriel-tells-of-enemy-plan:
    label: The polytheists say 'if we fell on them once we would cut them off'; Gabriel tells the prophet
    cluster: angels
  as-guards-do-with-their-commanders:
    label: 'Jabir: as your guards do with your commanders now (as your commanders pray now)'
    cluster: ritual
  group-backs-to-qibla-facing-enemy:
    label: In the fear prayer at Najd the group facing the enemy stands with its back to the qibla; all say the opening takbir together
    cluster: ritual
  withdraw-walking-backwards:
    label: The first group, done, steps back on their heels walking backwards (al-qahqarā) to stand behind the others
    cluster: ritual
  bedouin-takes-hung-sword-who-protects-you:
    label: 'Under a shady tree a polytheist takes the prophet''s sword hung on a tree and draws it: ''who will keep you from me?'' - ''God'''
    cluster: sira
  fear-prayer-one-raka-not-made-up:
    label: 'In the fear prayer the prophet prayed one rakʿa with each group: two for him, one for each group, ''and they did not make it up'''
    cluster: ritual
  in-greater-fear-pray-riding-or-standing-by-nods:
    label: If the fear is greater, pray riding or standing, nodding
    cluster: ritual
  praying-and-guarding-each-other:
    label: 'All in prayer, but guarding one another: one group prostrates while the other stands guard, by turns (ʿuqab)'
    cluster: ritual
  target-like-a-devil-wild-haired:
    label: 'Sent to kill a man gathering forces, the Companion asks how to know him: ''wild-haired, like a devil; you will feel a shudder'''
    cluster: sira
  kills-the-gatherer-after-walking-prayer:
    label: He walks along with the enemy chief, then 'when I could, I struck him with my sword until he was cold'
    cluster: sira
  saw-him-pray-forenoon-only-that-day:
    label: 'Asked if the prophet prayed the forenoon prayer, Anas: I saw him pray it only that day'
    cluster: ritual
  forenoon-four-and-more:
    label: 'Forenoon prayer: four rakʿas and more as he wished'
    cluster: ritual
  charity-on-every-joint-two-forenoon-rakas-suffice:
    label: 'Each morning a charity is due on every joint (sulāmā): each glorification, praise, tahlil, takbir, command of good is charity, and two forenoon rakʿas suffice for it all'
    cluster: ritual
  spittle-buried-obstacle-removed-as-joint-charity:
    label: 'For the 360 joints: bury spittle in the mosque, move a thing from the road; if not, two forenoon rakʿas'
    cluster: ritual
  four-forenoon-rakas-god-suffices-the-day:
    label: 'God says: ''Son of Adam, pray four rakʿas to me at the start of the day; I will suffice you its end'''
    cluster: theology
  forenoon-in-house-they-pray-behind:
    label: He prayed the forenoon prayer in Itban's house and they stood behind him and prayed with him
    cluster: ritual
  quicker-return-greater-booty-than-raid:
    label: A raid returns quickly with great booty; 'shall I tell you of quicker return and greater booty?' - ablution, the dawn prayer in the mosque, then the forenoon prayer
    cluster: ritual
  he-prayed-some-forenoon:
    label: 'Ali: the prophet prayed some of the forenoon'
    cluster: ritual
  never-saw-forenoon-left-deeds-lest-imposed:
    label: Aisha never saw him pray the forenoon prayer, though she prays it; he would leave a deed he loved lest people do it and it be imposed on them
    cluster: ritual
units:
