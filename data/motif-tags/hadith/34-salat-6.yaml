- id: hadith-9-forenoon-rewards
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Forenoon prayer: reward of the umra pilgrim, better than a raid; Ali saw him pray it'
