  - motif: saw-him-pray-forenoon-only-that-day
    refs:
    - Jāmiʿ 9:1814.2
    note: 'أكان النبي ﷺ يصلِّي الضُحى؟ قال: ما رأيتُه صلَّاها إلا يوَمئِذٍ'
  - motif: forenoon-four-and-more
    refs:
