  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Light with the people, long alone: ''for your sake'''
  read:
  - Jāmiʿ 9:1703.2
  tags:
  - motif: lightens-with-them-lengthens-alone-for-your-sake
    refs:
    - Jāmiʿ 9:1703.2
    note: فخفَّف بهم، ثمّ دخل فأطال ... من أجلكم فعلتُ
- id: hadith-9-ibn-abbas-night-at-maymuna
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Ibn Abbas''s night at Maymuna''s: the ear, the waterskin, six pairs and the witr'
  read:
  - Jāmiʿ 9:1704.1
  quran:
  - 3:190-200
  tags:
  - motif: boy-sleeps-across-cushion-couple-along-it
    refs:
    - Jāmiʿ 9:1704.1
    note: فاضطجعتُ في عرض الوسادة، واضطجع رسول الله ﷺ وأهله في طولها
  - motif: wipes-sleep-recites-last-ten-of-al-imran
    refs:
    - Jāmiʿ 9:1704.1
    note: فجلس يمسح النوم عن وجهه بيده. ثمّ قرأ العشر الآيات الخواتم من سورة آل عمران
  - motif: ablution-from-hanging-waterskin
    refs:
    - Jāmiʿ 9:1704.1
    note: ثمّ قام إلى شَنٍّ معلَّقٍ فتوضَّأ منه
  - motif: boys-ear-twisted-at-night-prayer
    refs:
    - Jāmiʿ 9:1704.1
    note: فوضع رسول الله ﷺ يده اليُمنى على رأسي، وأخذ بأُذُنِي اليُمنى يَفْتِلُها
  - motif: six-pairs-of-rakas-then-witr
    refs:
    - Jāmiʿ 9:1704.1
    note: ثمّ ركعتين، ثمّ ركعتين، ثمّ أوتر
  - motif: dawn-two-when-muezzin-falls-silent
    refs:
    - Jāmiʿ 9:1704.1
    note: حتَّى أتاه المؤذن فصَلَّى ركعتين خفيفتين
  hints:
  - Waking 'when half the night had passed, or a little before or after' (حتَّى إذا انتصف الليلُ) to pray - compare Ps 119:62 'at midnight I rise to give thanks to you', which the rabbis tie to David's harp waking him at midnight (b. Berakhot 3b-4a)
- id: hadith-9-count-of-night-rakas
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'The count of the night prayer: thirteen, eleven, ''four then four then three'''
  read:
  - Jāmiʿ 9:1706.1-1708.1
  tags:
  - motif: thirteen-rakas-of-night-prayer
    refs:
    - Jāmiʿ 9:1706.1
    - Jāmiʿ 9:1706.2
    - Jāmiʿ 9:1707.4
    - Jāmiʿ 9:1708.1
    note: يصلِّي من الليل ثلاث عشر ركعة ... فتلك ثلاث عشر ركعة ... ثلاث عشرة ركعة بركعتي الفجر
  - motif: eleven-rakas-of-night-prayer
    refs:
    - Jāmiʿ 9:1706.3
    - Jāmiʿ 9:1707.1
    note: ما كان رسولُ الله ﷺ يزيدُ في رمضان ولا في غيره على إحدى عشرة ركعة
  - motif: four-then-four-do-not-ask-their-beauty
    refs:
    - Jāmiʿ 9:1706.3
    note: يُصَلِّي أربعًا فلا تسأل عن حسنهن وطولهن
  - motif: prophets-eyes-sleep-hearts-do-not
    refs:
    - Jāmiʿ 9:1706.3
    note: إن عينيَّ تنامان، ولا ينام قلبي
  - motif: two-rakas-seated-after-witr
    refs:
    - Jāmiʿ 9:1706.4
    - Jāmiʿ 9:1707.3
    note: ثمّ يوتر، ثمّ يُصلِّي ركعتين وهو جالس ... وركعتين جالسًا
  - motif: night-prostration-as-long-as-fifty-verses
    refs:
    - Jāmiʿ 9:1707.1
    note: فيسجد السجدة من ذلك قدر ما يقرأ أحدكم خمسين آية
  - motif: lies-on-right-side-after-dawn-two
    refs:
    - Jāmiʿ 9:1707.1
    note: ثمّ يضطجع على شِقِّه الأيمن حتَّى يأتيه المؤذِّن
  - motif: seven-nine-eleven-besides-dawn-two
    refs:
    - Jāmiʿ 9:1707.2
    note: سبع وتسع وإحدى عشرة سوى ركعتي الفجر
  - motif: dawn-two-when-muezzin-falls-silent
    refs:
    - Jāmiʿ 9:1708.1
    note: ثمّ يُصلِّي إذا سمع النداء بالصبحِ ركعتين خفيفتين
- id: hadith-9-witr-of-five-and-nine
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Witr of five, of nine; witr with one and lying on the right; Zayd watches from the threshold
  read:
  - Jāmiʿ 9:1708.2-1709.2
  tags:
  - motif: witr-of-five-sitting-only-at-end
    refs:
    - Jāmiʿ 9:1708.2
    note: يوتر من ذلك بخمس، لا يجلس في شيء إِلَّا في آخرها
  - motif: eleven-rakas-of-night-prayer
    refs:
    - Jāmiʿ 9:1708.3
    note: إحدى عشرة ركعة، يوتر منها بواحدة
  - motif: lies-on-right-side-after-dawn-two
    refs:
    - Jāmiʿ 9:1708.3
    note: فإذا فرغ اضطجع على شِقِّه الأيمن
  - motif: witr-nine-sitting-only-at-eighth
    refs:
    - Jāmiʿ 9:1708.4
    note: لا يجلس فيها إِلَّا في الثامنة ... ثمّ ينهضُ ولا يُسلم
  - motif: witr-reduced-when-aged-and-heavy
    refs:
    - Jāmiʿ 9:1708.4
    - Jāmiʿ 9:1709.1
    note: فلمّا أسَنَّ نبي الله ﷺ، وأخذه اللحم، أوتر بسبع ... فلمّا أسَنَّ وثقل صلَّى سبعًا
  - motif: watches-night-prayer-pillowed-on-threshold
    refs:
    - Jāmiʿ 9:1709.2
    note: لأرمُقَنَّ الليلةَ صلاة رسول الله ﷺ ... فتوسدتُ عَتَبَتَه، أو فُسْطاطَه ... فتلك ثلاث عشرة ركعة
  - motif: thirteen-rakas-of-night-prayer
    refs:
    - Jāmiʿ 9:1709.2
    note: فتلك ثلاث عشرة ركعة
- id: hadith-9-night-two-by-two
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The night prayer two by two, one rakʿa when dawn is feared
  read:
  - Jāmiʿ 9:1709.3-1711.1
  tags:
  - motif: night-prayer-two-by-two-one-raka-at-dawn-fear
    refs:
    - Jāmiʿ 9:1709.3
    - Jāmiʿ 9:1710.1
    - Jāmiʿ 9:1711.1
    note: صلاة الليل مثنى مثنى، فإذا خَشِي أحدكم الصبحَ صلَّى ركعةً واحدةً تُوتِر له ما قد صَلَّى ... أن يُسلم في كل ركعتين
  - motif: you-are-dense-let-me-finish
    refs:
    - Jāmiʿ 9:1710.1
    note: إنك لضخمٌ. ألا تدعُني استقرئُ لك الحديث ... بَهْ بَهْ إنك لضخمٌ
  - motif: as-if-the-call-in-his-ears
    refs:
    - Jāmiʿ 9:1710.1
    note: كأنَّ الأذان بأُذُنَيه
  - motif: night-prayer-two-by-two-one-raka-at-dawn-fear
    refs:
    - Jāmiʿ 9:1711.1
    note: فإن أحسَّ أن يُصبح سجد سجدةً فأوترتْ له ما صلى
- id: hadith-9-voluntary-sitting
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Voluntary prayer sitting: late in life, half the reward, bowing as one recited, cross-legged'
  read:
  - Jāmiʿ 9:1711.2-1715.1
  tags:
  - motif: first-seated-voluntary-a-year-before-death
    refs:
    - Jāmiʿ 9:1711.2
    note: ما رأيتُ رسول الله صلى في سُبحته قاعدًا قطُّ. حتَّى كان قبل وفاته بعام
  - motif: sura-drawn-out-longer-than-longer
    refs:
    - Jāmiʿ 9:1711.2
    note: ويقرأ بالسورة فيرتِّلُها، حتَّى تكون أطولَ من أطول منها
  - motif: did-not-die-until-praying-seated
    refs:
    - Jāmiʿ 9:1712.1
    - Jāmiʿ 9:1712.2
    - Jāmiʿ 9:1712.4
    note: لم يمت حتَّى صلى قاعدًا ... حتَّى كان أكثرُ صلاته قاعدًا إِلَّا المكتوبة
  - motif: aisha-sick-or-weary-prayed-sitting
    refs:
    - Jāmiʿ 9:1712.3
    note: لا تدعْ قيام الليل، فإن رسول الله ﷺ كان لا يدعُه، وكان إذا مرض أو كسل صلى قاعدًا
  - motif: most-beloved-deed-most-constant
    refs:
    - Jāmiʿ 9:1712.4
    note: وكان أحب العمل إليه ما داوَم عليه العبد وإن كان يسيرًا
  - motif: bows-standing-if-recited-standing
    refs:
    - Jāmiʿ 9:1713.1
    note: كان يُصَلِّي ليلًا طويلًا قائمًا. وليلًا طويلًا قاعدًا، وكان إذا قرأ قائمًا ركع قائمًا
  - motif: rises-for-last-thirty-or-forty-verses
    refs:
    - Jāmiʿ 9:1713.2
    note: حتَّى أسَنَّ، فكان يقرأ قاعدًا، حتَّى إذا أراد أن يركع قام فقرأ نحوًا من ثلاثين، أو أربعين آية
  - motif: seated-half-reward-lying-half-of-seated
    refs:
    - Jāmiʿ 9:1714.1
    - Jāmiʿ 9:1714.2
    note: ومن صلى قاعدًا فله نصف أجر القائم، ومن صلى نائمًا فله نصف أجر القاعد ... صلاة الرّجل قاعدًا نصفُ الصّلاة
  - motif: hand-on-head-i-am-not-like-you
    refs:
    - Jāmiʿ 9:1714.2
    note: فوضعتُ يدي على رأسي ... أجل، ولكنِّي لست كأحد منكم
  - motif: prays-cross-legged
    refs:
    - Jāmiʿ 9:1715.1
    note: رأيت النَّبِيّ ﷺ يُصَلِّي متربِّعًا
- id: hadith-9-missed-night-prayer
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Missed night portion: read before noon, sleep as charity, twelve by day; ill for a night or two'
  read:
  - Jāmiʿ 9:1716.1-1718.1
  quran:
  - 93:1-3
  tags:
  - motif: missed-portion-read-before-noon-counts-as-night
    refs:
    - Jāmiʿ 9:1716.1
    note: من نام عن حِزْبه، أو عن شيء منه، فقرأه فيما بين صلاة الفجر وصلاة الظهر، كتِب له كأنَّما قرأه من الليل
  - motif: overcome-by-sleep-sleep-is-charity-from-lord
    refs:
    - Jāmiʿ 9:1716.2
    - Jāmiʿ 9:1717.1
    note: فغلبتْه عيناه حتَّى يُصبِحَ كُتِبَ له ما نوى، وكان نومُه صدقةً عليه من ربِّه ... وكان نومُه عليه صدقةً
  - motif: skipped-night-prayer-sick-one-or-two-nights
    refs:
    - Jāmiʿ 9:1717.2
    note: اشتكى النَّبِيّ ﷺ فلم يَقُم ليلةً أو ليلتين
  - motif: twelve-rakas-by-day-for-missed-night
    refs:
    - Jāmiʿ 9:1718.1
    note: وكان إذا غلبه نوم، أو وجع عن قيام الليل صلَّى من النهار ثنتي عشرةَ ركعةً
  - motif: vigil-ended-eleven-later-nine-never-whole-night
    refs:
    - Jāmiʿ 9:1718.1
    note: ولا أعلم نبيَّ الله ﷺ قرأ القرآن كلَّه في ليلة. ولا صلَّى ليلة إلى الصبح
- id: hadith-9-prayer-of-desire-and-dread
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'A night-long prayer of desire and dread: three asked, two given; no whole-night vigil'
  read:
  - Jāmiʿ 9:1718.2-1719.1
  tags:
  - motif: prayer-of-desire-and-dread-three-asked-two-given
    refs:
    - Jāmiʿ 9:1718.2
    note: إنها صلاة رغبةٍ ورهبةً، إنِّي سألت الله فيها ثلاثًا، فأعطاني اثنتين، ومنعني واحدةً
  - motif: not-destroyed-by-famine-nor-outside-enemy
    refs:
    - Jāmiʿ 9:1718.2
    note: سألتُه أن لا يُهلك أمتي بسنةٍ فأعطانيها، وسألتُه أن لا يُسلِّط عليهم عدوًّا من غيرهم ... وسألتُه أن لا يُذيق بعضَهم بأسَ بعضٍ فمنعنيها
  - motif: vigil-ended-eleven-later-nine-never-whole-night
    refs:
    - Jāmiʿ 9:1719.1
    note: ولا صلَّى ليلةً إلى الصبح، ولا صام شهرًا كاملًا غير رمضان
- id: hadith-9-drowsy-in-prayer
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Drowsy in prayer: sleep first, lest one revile oneself'
  read:
  - Jāmiʿ 9:1719.2-1719.4
  tags:
  - motif: doze-in-prayer-may-curse-himself
    refs:
    - Jāmiʿ 9:1719.2
    note: إذا نَعَس أحدُكم وهو يُصَلِّي فليرقُدْ حتَّى يذهب عنه النومُ ... لعلّه يذهبُ يستغفر فيسبُّ نفسَه
  - motif: sleep-until-you-know-what-you-recite
    refs:
    - Jāmiʿ 9:1719.3
    note: إذا نعَس أحدُكم في الصّلاة فلينَمْ حتَّى يعلمَ ما يقرأ
  - motif: quran-garbled-on-tongue-lie-down
    refs:
    - Jāmiʿ 9:1719.4
    note: 'فاستعجم القرآن على لسانه فلم يدر ما يقول: فليضطجع'
- id: hadith-9-constancy-in-deeds
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Constancy: steady rain, God does not tire, the rope between the pillars'
  read:
  - Jāmiʿ 9:1720.1-1721.3
  tags:
  - motif: his-work-was-steady-rain
    refs:
    - Jāmiʿ 9:1720.1
    note: 'هل كان يخصُّ شيئًا من الأيام؟ قالت: لا، كان عملُه دِيمةً'
  - motif: most-beloved-deed-most-constant
    refs:
    - Jāmiʿ 9:1720.2
    - Jāmiʿ 9:1720.3
    - Jāmiʿ 9:1720.4
    - Jāmiʿ 9:1721.1
    - Jāmiʿ 9:1721.2
    note: 'فقالت: الدائم ... أدومها وإن قل ... وإن أحب الأعمال إلى الله ما دام وإن قلَّ'
  - motif: mat-screen-by-night-seat-by-day
    refs:
    - Jāmiʿ 9:1720.4
    note: كان يحتجر حصيرًا بالليل فيصلِّي، ويبسطه بالنهار فيجلس عليه
  - motif: god-does-not-tire-until-you-tire
    refs:
    - Jāmiʿ 9:1720.4
    - Jāmiʿ 9:1721.2
    note: فإن الله لا يَملُّ حتَّى تملُّوا ... لا يملُّ اللهُ حتَّى تَمَلُّوا
  - motif: aisha-kept-to-a-deed
    refs:
    - Jāmiʿ 9:1721.1
    note: وكانت عائشة إذا عملت العملَ لزِمَتْه
  - motif: woman-praised-for-prayer-told-mah
    refs:
    - Jāmiʿ 9:1721.2
    note: 'فلانة، تذكر من صلاتها. قال: "مَهْ! عليكم بما تطيقون'
  - motif: rope-between-pillars-for-tired-worshipper
    refs:
    - Jāmiʿ 9:1721.3
    note: فإذا حبل ممدود بين الساريتين ... هذا حبل لزينب، فإذا فترتْ تعلقتْ ... حُلوا ليُصلِّ أحدكم نشاطَه فإذا فتر فليقعُد
- id: hadith-9-moderation-in-worship
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Moderation: your eye and your family have a right; zeal and slackening; no monasticism'
  read:
  - Jāmiʿ 9:1723.1-1725.1
  tags:
  - motif: eye-sunken-soul-exhausted
    refs:
    - Jāmiʿ 9:1723.1
    note: فإنَّك إن فعلت ذلك هَجَمَتْ عينُك، ونَفِهَتْ نفسك
  - motif: self-family-guest-have-a-right
    refs:
    - Jāmiʿ 9:1723.1
    - Jāmiʿ 9:1724.2
    - Jāmiʿ 9:1725.1
    note: وإنَّ لنفسِك حقًّا، ولأهلك حقًّا ... وإن لضَيْفِك عليك حقًّا
  - motif: i-fast-and-eat-pray-and-sleep-marry-women
    refs:
    - Jāmiʿ 9:1724.1
    - Jāmiʿ 9:1724.2
    note: لكني أنا أنام وأُصلِّي، وأصوم وأُفطِر ... وأَنْكِحُ النِّساء
  - motif: every-deed-has-zeal-then-slackening
    refs:
    - Jāmiʿ 9:1724.1
    note: إنَّ لكل عملٍ شِرَّةً ثمّ فترةً، فمن كانت فترتُه إلى بدعةٍ فقد ضلَّ
  - motif: neglected-wife-shabby-appearance
    refs:
    - Jāmiʿ 9:1724.2
    note: يا عائشه! ما أبذَّ هيئة خُوَيْلةَ ... امرأةُ لا زَوْجَ لها يَصُوم النَّهار ويقوم الليل
  - motif: i-was-not-commanded-monasticism
    refs:
    - Jāmiʿ 9:1725.1
    note: يا عثمان! إني لم أُومَر بالرهبانيّة ... وأنكح وأطلق
  - motif: men-would-have-castrated-themselves
    refs:
    - Jāmiʿ 9:1725.1
    note: إن هو أقرَّ عثمان على ما هو عليه أن نختصي فنتبتَّلَ
- id: hadith-9-prayer-stops-thief
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The man who prays at night and steals by morning
  read:
  - Jāmiʿ 9:1726.1-1727.1
  quran:
  - '29:45'
  tags:
  - motif: night-prayer-will-stop-the-thief
    refs:
    - Jāmiʿ 9:1726.1
    - Jāmiʿ 9:1727.1
    note: 'إن فُلانًا يُصَلِّي بالليل، فإذا أصبح سرق، قال: إنه سينهاه ما تقول'
- id: hadith-9-witr-not-obligatory
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'The witr not obligatory: five prayers the covenant; God is odd; a prayer added'
  read:
  - Jāmiʿ 9:1728.1-1730.1
  tags:
  - motif: witr-claimed-obligatory-companion-says-he-lied
    refs:
    - Jāmiʿ 9:1728.1
    note: إن الوتر واجب ... كذب أبو محمد
  - motif: five-prayers-a-covenant-to-enter-paradise
    refs:
    - Jāmiʿ 9:1728.1
    note: خمسُ صلواتٍ كتبهنَّ الله ﷿ على العباد ... كان له عند الله عهد أن يدخله الجنّة ... إن شاء عذَّبه، وإن شاء أدْخَلَه الجنّة
  - motif: god-is-odd-loves-the-odd
    refs:
    - Jāmiʿ 9:1729.1
    - Jāmiʿ 9:1729.2
    note: إنَّ الله وِتر يحبُّ الوتر
  - motif: people-of-the-quran-pray-witr
    refs:
    - Jāmiʿ 9:1729.2
    note: يا أهل القرآن! أوتروا
  - motif: god-added-a-prayer-the-witr
    refs:
    - Jāmiʿ 9:1730.1
    note: إنَّ الله زادكم صلاةً، وهي الوتر، فصلوها فيما بين صلاة العِشاء إلى صلاة الفجر
- id: hadith-9-witr-on-camel
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Witr on the camel; waking the wife for witr
  read:
  - Jāmiʿ 9:1734.1-1735.1
  tags:
  - motif: witr-on-camel
    refs:
    - Jāmiʿ 9:1734.1
    note: فلمّا خشيتُ الصبح، نزلتُ فأوترتُ ... أليس لك في رسول الله أُسوَةٌ ... كان يُوتر على البعير
  - motif: wife-lies-crosswise-before-praying-prophet
    refs:
    - Jāmiʿ 9:1735.1
    note: وأنا راقدةٌ معترضةً على فراشه
  - motif: wakes-wife-to-pray-witr
    refs:
    - Jāmiʿ 9:1735.1
    note: فإذا أراد أن يُوتر أَيقظني فأَوترتُ
- id: hadith-9-witr-last-not-twice
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Witr the last of the night; no two witrs in a night
  read:
  - Jāmiʿ 9:1736.1-1736.2
  tags:
  - motif: make-witr-last-of-night
    refs:
    - Jāmiʿ 9:1736.1
    note: اجعلوا آخر صلاتكم بالليل وترًا
  - motif: no-two-witrs-in-one-night
    refs:
    - Jāmiʿ 9:1736.2
    note: 'حتَّى إذا بقي الوتر قدَّم رجلًا فقال: أوتر بأصحابك ... لا وتران في ليلة'
- id: hadith-9-hours-of-witr
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The hours of the witr; Abu Bakr's prudence, Umar's strength; the three bequests
  read:
  - Jāmiʿ 9:1737.1-1740.3
  tags:
  - motif: witr-every-part-of-night-ending-at-sahar
    refs:
    - Jāmiʿ 9:1737.1
    - Jāmiʿ 9:1738.1
    note: مِن كُلِّ الليل قد أوتر رسولُ الله ﷺ فانتهى وِتره إلى السَّحَر ... من أوَّلِ اللَّيل، وأوسطه، وآخره
  - motif: bath-witr-recitation-early-or-late-loud-or-soft
    refs:
    - Jāmiʿ 9:1737.2
    note: ربما اغتسل في أول الليل، وربما اغتسل في آخره ... ربما أوتر في أول الليل، وربما أوتر في آخره
  - motif: praise-god-who-made-latitude
    refs:
    - Jāmiʿ 9:1737.2
    note: الله أكبر الحمد لله الذي جعل في الأمر سعة
  - motif: last-of-night-prayer-is-witnessed
    refs:
    - Jāmiʿ 9:1738.2
    note: من خاف أن لا يقوم من آخر الليل فليُوتِر أوَّلَه ... فإن صلاة آخر الليل مشهودة ... فإن قراءة آخر الليل محضورة
  - motif: abu-bakr-prudence-umar-strength
    refs:
    - Jāmiʿ 9:1738.3
    - Jāmiʿ 9:1739.1
    note: 'أخذ هذا بالحزم" وقال لِعُمَر: "أخذ هذا بالقوة ... فأخذت بالوُثْقى'
  - motif: three-bequests-fast-forenoon-witr
    refs:
    - Jāmiʿ 9:1740.1
    - Jāmiʿ 9:1740.2
    - Jāmiʿ 9:1740.3
    note: أوصاني خليلي بثلاثٍ. لا أدعهن حتَّى أموت، صوم ثلاثة أيام من كل شهر، وصلاة الضُّحى، ونومٌ على وترٍ ... وأن لا أنام حتى أوتر
- id: hadith-9-witr-before-dawn
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Witr before dawn, or none; the missed witr prayed on waking
  read:
  - Jāmiʿ 9:1741.1-1742.1
  tags:
  - motif: witr-before-dawn-else-none
    refs:
    - Jāmiʿ 9:1741.1
    - Jāmiʿ 9:1741.2
    - Jāmiʿ 9:1741.3
    - Jāmiʿ 9:1741.4
    note: أوتروا قبل أن تُصبِحوا ... مَن أدرك الصبحَ فلم يوتر فَلا وِتْر له ... بادروا الصُبح بالوتر ... إذا طلع الفجر، فقد ذهب كلُّ صلاة الليل والوتر
  - motif: missed-witr-prayed-on-waking-or-remembering
    refs:
    - Jāmiʿ 9:1742.1
    note: من نام عن وتره، أو نسيه فليصله إذا أصبح أو ذكره
- id: hadith-9-two-after-witr
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Two rakʿas after the witr: seated, with al-Zalzala and al-Kafirun; on a hard journey'
  read:
  - Jāmiʿ 9:1744.1-1745.1
  quran:
  - 99:1-8
  - 109:1-6
  tags:
  - motif: two-rakas-seated-after-witr
    refs:
    - Jāmiʿ 9:1744.1
    - Jāmiʿ 9:1744.2
    note: ثم يُوتر، ثم يصلي ركعتين وهو جالس ... وصلَّى ركعتين وهو جالس
  - motif: witr-reduced-when-aged-and-heavy
    refs:
    - Jāmiʿ 9:1744.2
    note: كان رسول الله ﷺ يُوتر بِتِسع حتَّى إذا بَدُن وكَثُر لحمُه أوتر بسبعٍ
  - motif: after-witr-two-with-zalzala-and-kafirun
    refs:
    - Jāmiʿ 9:1744.2
    note: 'يقرأ فيهما: ﴿إِذَا زُلْزِلَتِ﴾ و ﴿قُلْ يَاأَيُّهَا الْكَافِرُونَ﴾'
  - motif: journey-two-rakas-after-witr-in-case
    refs:
    - Jāmiʿ 9:1745.1
    note: إن هذا السفر جهد وثقل، فإذا أوتر أحدكم فليركع ركعتين، فإن استيقظ وإلّا كانتا له
- id: hadith-9-witr-of-one
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Witr with one rakʿa at the end of the night
  read:
  - Jāmiʿ 9:1746.1-1747.2
  tags:
  - motif: night-prayer-two-by-two-one-raka-at-dawn-fear
    refs:
    - Jāmiʿ 9:1746.1
    - Jāmiʿ 9:1746.2
    note: كان النبي ﷺ يُصَلِّي من الليل مثنى مثنى، ويوتر بركعةٍ ... فإذا خشي أحدكم الصبح فصلى ركعة واحدة توتر له ما قد صلَّى
  - motif: as-if-the-call-in-his-ears
    refs:
    - Jāmiʿ 9:1746.1
    note: وكأن الأذانَ بأُذُنَيه
  - motif: witr-one-raka-at-end-of-night
    refs:
    - Jāmiʿ 9:1746.3
    - Jāmiʿ 9:1747.1
    note: الوتر ركعة من آخر الليل ... ركعةٌ من آخر اللَّيل
  - motif: eleven-rakas-of-night-prayer
    refs:
    - Jāmiʿ 9:1747.2
    note: يُصلِّي من الليل إحدى عشرة ركعة، يوتر منها بواحدة
  - motif: lies-on-right-side-after-dawn-two
    refs:
    - Jāmiʿ 9:1747.2
    note: فإذا فرغ اضطجع على شقه الأيمن
- id: hadith-9-witr-three-five-nine-thirteen
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Witr of three, five, nine, thirteen; 'Glory to the King, the Holy' after it
  read:
  - Jāmiʿ 9:1747.3-1749.1
  quran:
  - 87:1-19
  - 109:1-6
  - 112:1-4
  tags:
  - motif: four-then-four-do-not-ask-their-beauty
    refs:
    - Jāmiʿ 9:1747.3
    note: يُصلِّي أربعًا فلا تسأل عن حُسنِهن وطُولِهِن، ثم يُصلِّي أربعًا ... ثمَّ يُصَلِّي ثلاثًا
  - motif: witr-of-three-with-ala-kafirun-ikhlas
    refs:
    - Jāmiʿ 9:1747.4
    note: كان رسول الله ﷺ يقرأ في الوتر بـ ﴿سَبِّحِ اسْمَ رَبِّكَ الْأَعْلَى﴾ ... ولا يسلم إلا في آخرهن
  - motif: glory-to-holy-king-three-times-after-witr
    refs:
    - Jāmiʿ 9:1747.4
    note: 'يعني بعد التسليم: "سبحان الملك القدوس ثلاثًا'
  - motif: witr-of-five-sitting-only-at-end
    refs:
    - Jāmiʿ 9:1748.1
    note: يُوتر من ذلك بخمس، ولا يجلس في شيء إلا في آخرها
  - motif: witr-nine-sitting-only-at-eighth
    refs:
    - Jāmiʿ 9:1748.2
    note: يُصلي ثمان ركعات لا يجلس فيهن إلا عند الثامنة ... ثم ينهض ولا يُسَلِّم، ثم يصلِّي التاسعة
  - motif: witr-reduced-when-aged-and-heavy
    refs:
    - Jāmiʿ 9:1748.3
    note: كان رسول الله ﷺ يوتر بثلاث عشرة ركعة، فلما كبر وضعف أوتر بسبع
  - motif: witr-four-and-three-to-ten-and-three
    refs:
    - Jāmiʿ 9:1749.1
    note: كان يُوتر بأربع وثلاث، وست وثلاث، وثمان وثلاث، وعشر وثلاث، ولم يكن يُوتر بأنقص من سبع، ولا بأكثر من ثلاث عشرة
  hints:
  - '''Glory to the King, the Holy'' three times, the voice raised at the third (Jāmiʿ 9:1747.4, 1753.2) - compare the threefold ''Holy'' of the seraphim (Isa 6:3) recited in the Qedushah, where God is also hailed as King (Isa 6:5)'
- id: hadith-9-witr-choices
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Separating even and odd; five, three or one; a nod if unable; not like the sunset prayer
  read:
  - Jāmiʿ 9:1750.1-1752.1
  tags:
  - motif: salam-between-even-and-odd-audible
    refs:
    - Jāmiʿ 9:1750.1
    note: يفصِلُ بين الوتر والشفع بتسليمة ويُسمعنا
  - motif: witr-a-right-five-three-or-one
    refs:
    - Jāmiʿ 9:1751.1
    note: الوتر حقٌّ على كلِّ مسلم، فمن أحبَّ أن يُوتِرَ بخمس فليفعل
  - motif: witr-by-nod-if-unable
    refs:
    - Jāmiʿ 9:1751.2
    note: فإن لم تستطِع فبواحدة، فإن لم تستطِع فأومئ إيماءً
  - motif: witr-of-three-not-like-maghrib
    refs:
    - Jāmiʿ 9:1752.1
    note: لا تُوتروا بثلاث، أوتروا بخمس أو بسبع، ولا تُشبه بصلاة المغرب
- id: hadith-9-suras-of-witr
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The suras of the witr
  read:
  - Jāmiʿ 9:1753.1-1754.2
  quran:
  - 87:1-19
  - 109:1-6
  - 112:1-4
  - 113:1-5
  - 114:1-6
  tags:
  - motif: witr-of-three-with-ala-kafirun-ikhlas
    refs:
    - Jāmiʿ 9:1753.1
    - Jāmiʿ 9:1753.2
    - Jāmiʿ 9:1753.3
    - Jāmiʿ 9:1754.1
    note: 'يوتر بثلاث، يقرأ في الأولى: بـ ﴿سَبِّحِ اسْمَ ... وفي الثانية بـ ﴿قُلْ يَاأَيُّهَا الْكَافِرُونَ﴾ وفي الثالثة بـ ﴿قُلْ هُوَ اللَّهُ أَحَدٌ﴾'
  - motif: glory-to-holy-king-three-times-after-witr
    refs:
    - Jāmiʿ 9:1753.2
    note: 'وكان يقول إذا سلَّم: سبحان الملك القدوس ثلاثًا ويرفع صوتَه بالثالثة'
  - motif: witr-ikhlas-and-the-two-refuge-suras
    refs:
    - Jāmiʿ 9:1754.2
    note: ويقرأ في الوتر بـ ﴿قُلْ هُوَ اللَّهُ أَحَدٌ﴾ و ﴿قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ﴾ و ﴿قُلْ أَعُوذُ بِرَبِّ النَّاسِ﴾
- id: hadith-9-words-of-witr
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Words said in the witr: refuge in you from you; ''guide me among those you guided'''
  read:
  - Jāmiʿ 9:1756.1-1756.2
  tags:
  - motif: refuge-in-you-from-you
    refs:
    - Jāmiʿ 9:1756.1
    note: اللهم إني أعوذ برضاك من سَخَطِك، وأعوذ بمعافاتك من عقوبتك، وأعوذ بك منك
  - motif: qunut-guide-me-among-those-you-guided
    refs:
    - Jāmiʿ 9:1756.2
    note: اللَّهُمَّ اهدني فيمن هديتَ ... إنَّك تقضي ولا يُقضى عليك، وإنَّه لا يَذِلُّ من واليتَ، ولا يَعِزُّ من عاديتَ
- id: hadith-9-qunut-after-bowing
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Qunut after the bowing, for a month; before and after
  read:
  - Jāmiʿ 9:1758.1-1761.2
  tags:
  - motif: qunut-curse-after-bowing
    refs:
    - Jāmiʿ 9:1758.1
    note: 'هل قنت رسول الله ﷺ في الصبح؟ قال: نعم، بعد الركوع يسيرًا'
  - motif: month-of-qunut-cursing-tribes
    refs:
    - Jāmiʿ 9:1758.2
    note: إنما قنت رسول الله ﷺ بعد الركوع شهرًا
  - motif: reciters-killed-by-treachery
    refs:
    - Jāmiʿ 9:1758.2
    note: 'بعث قومًا يقال لهم: القُرَّاء زُهاء سبعين رجلًا إلى قوم من المشركين'
  - motif: stood-a-moment-after-second-raka-of-dawn
    refs:
    - Jāmiʿ 9:1758.3
    note: فلمَّا رفع رأسه من الركعة الثانية قام هُنَيَّةً
  - motif: qunut-before-and-after-bowing
    refs:
    - Jāmiʿ 9:1761.1
    note: كنا نقنتُ قبل الركوع وبعده
  - motif: glory-to-holy-king-three-times-after-witr
    refs:
    - Jāmiʿ 9:1761.2
    note: 'إذا جلس في آخر صلاته في الوتر يقول: يعني بعد التسليم: "سبحان الملك القدُّوس" ثلاثًا'
- id: hadith-9-bir-mauna-and-the-qunut
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Bir Maʿuna and the beginning of the qunut; the lifted verse; the named captives
  read:
  - Jāmiʿ 9:1761.3-1764.1
  quran:
  - 3:128
  tags:
  - motif: reciters-killed-by-treachery
    refs:
    - Jāmiʿ 9:1761.3
    - Jāmiʿ 9:1762.1
    note: بعث النبي ﷺ سبعين رجلًا لحاجةٍ، يقال لهم القُرَّاء ... عند بئرٍ يُقال لها بئرُ مَعونة
  - motif: only-passing-on-the-prophets-errand
    refs:
    - Jāmiʿ 9:1761.3
    note: والله! ما إيَّاكُم أردنا، إنَّما نحن مجتازون في حاجة للنبي ﷺ فقتلوهم
  - motif: month-of-qunut-cursing-tribes
    refs:
    - Jāmiʿ 9:1761.3
    - Jāmiʿ 9:1761.4
    - Jāmiʿ 9:1762.1
    note: فدعا النبي ﷺ عليهم شهرًا في صلاة الغَداة، وذلك بَدْؤُ القُنوتِ وما كنا نَقنُتُ ... ثلاثين صباحًا، حين يدعو على رِعْلٍ ولَحيانَ وعُصيَّةَ
  - motif: qunut-before-and-after-bowing
    refs:
    - Jāmiʿ 9:1761.3
    note: 'أبعد الركوع، أو عند فَراغٍ من القراءة؟ قال: لا بل عند فَراغٍ من القراءةِ'
  - motif: abrogated-verse-we-met-our-lord
    refs:
    - Jāmiʿ 9:1761.4
    - Jāmiʿ 9:1762.1
    note: 'قرآنًا قرأناه حتَّى نُسخ بعدُ: "بَلِّغُوا قومَنا فقد لَقِينا ربَّنا، فرضي عنَّا، ورضينا عنه ... ثم إنَّ ذلك رُفِع'
  - motif: reciters-gather-wood-by-day-pray-by-night
    refs:
    - Jāmiʿ 9:1762.1
    note: كنَّا نُسمِّيهم القُراءَ في زمانهم كانوا يحتطبون بالنهار، ويُصلُّون بالليل
  - motif: prays-for-rescue-of-named-captives
    refs:
    - Jāmiʿ 9:1763.1
    note: اللهم أنْجِ الوليد بن الوليد، وسلمة بن هشام، وعياش بن أبي ربيعة، والمستضعفين من المؤمنين
  - motif: years-like-the-years-of-joseph
    refs:
    - Jāmiʿ 9:1763.1
    note: اللهم اشدُدْ وَطْأتك على مُضَرَ، واجعلها عليهم كَسِنِيِّ يوسفَ
  - motif: qunut-curse-after-bowing
    refs:
    - Jāmiʿ 9:1763.1
    note: اللهم العَنْ لَحْيانَ ورِعْلًا وذَكوانَ وعُصَيَّة عصتِ الله ورسولَه" ثم بلغنا أنه ترك ذلك لما أُنزل
  - motif: abu-hurayra-qunut-to-bring-prayer-near
    refs:
    - Jāmiʿ 9:1763.1
    note: لأُقَرِّبَنَّ بكم صلاة رسول الله ﷺ، فكان أبو هريرة يقنت في الظهر، والعِشاء الآخرة، وصلاة الصبح
  - motif: ghifar-forgiven-aslam-made-safe-usayya-disobeyed
    refs:
    - Jāmiʿ 9:1764.1
    note: اللهم العَنْ بني لَحيان ورِعْلًا وذكوانَ، وعُصَيَّةَ عَصَوا الله ورسوله. غِفار غَفَر الله لها، وأسلم سالمها الله
  hints:
  - '''Make them years like the years of Joseph'' (كَسِنِيِّ يوسف) against Muḍar - the seven lean years of Gen 41:27-31 (and Q 12:47-48) invoked as a curse'
- id: hadith-9-verse-stops-the-curse
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: '''You have nothing of the matter'': the verse ends the cursing of named men'
  read:
  - Jāmiʿ 9:1764.2-1765.1
  quran:
  - 3:128
  tags:
  - motif: qunut-curse-after-bowing
    refs:
    - Jāmiʿ 9:1764.2
    - Jāmiʿ 9:1765.1
    note: 'إذا رفع رأسه من الركوع من الركعة الآخرة من الفجر يقول: "اللهم العَن فلانًا وفلانًا وفلانًا ... يدعو على أُناس من المنافقين'
- id: hadith-9-qunut-occasions
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: When the qunut is made and when left; amen behind it; hands raised
  read:
  - Jāmiʿ 9:1765.2-1769.1
  tags:
  - motif: qunut-in-dawn-and-sunset
    refs:
    - Jāmiʿ 9:1765.2
    note: كان يقنتُ في الصبح والمغرب
  - motif: qunut-a-month-then-left
    refs:
    - Jāmiʿ 9:1766.1
    note: قنت شهرًا يدعو على أحياء من أحياء العرب، ثم ترك
  - motif: years-like-the-years-of-joseph
    refs:
    - Jāmiʿ 9:1766.2
    note: اللهمَّ اجعلها عليهم سنين كَسِنِي يوسف
  - motif: prays-for-rescue-of-named-captives
    refs:
    - Jāmiʿ 9:1766.2
    note: اللهمَّ أَنج الوليد بن الوليد، اللهمَّ نَجِّ سلمة بن هشام
  - motif: stopped-praying-for-them-they-have-come
    refs:
    - Jāmiʿ 9:1766.2
    note: ثمَّ رأيتُ رسول الله ﷺ ترك الدعاء بَعدُ ... وما تراهم قد قدموا
  - motif: father-calls-dawn-qunut-innovation
    refs:
    - Jāmiʿ 9:1766.3
    note: 'إنَّك قد صليتَ خلْفَ رسول الله ﷺ وأبي بكر وعمر وعثمان وعلي ... أكانوا يَقْنُتُون؟ قال: أي بُنيَّ محدَثٌ'
  - motif: qunut-only-for-or-against-a-people
    refs:
    - Jāmiʿ 9:1767.1
    - Jāmiʿ 9:1768.1
    note: كان لا يقنت إلا أن يدعو ... كان لا يقنت إلا إذا دعا لقوم، أو على قوم
  - motif: those-behind-say-amen-to-qunut
    refs:
    - Jāmiʿ 9:1768.2
    note: قنت رسول الله ﷺ شهرًا متتابِعًا في الظهر والعصر والمغرب والعشاء وصلاة الصبح ... ويُؤَمِّنُ مَن خَلفَه
  - motif: hands-raised-cursing-the-killers
    refs:
    - Jāmiʿ 9:1769.1
    note: كلّما صلّى الغداة رفع يديه يدعو عليهم
- id: hadith-9-travel-prayer-imposed
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Travel prayer: first imposed as two; four, two and one; not in the Quran'
  read:
  - Jāmiʿ 9:1771.1-1773.1
  tags:
  - motif: prayer-first-imposed-as-two
    refs:
    - Jāmiʿ 9:1771.1
    note: فُرضت الصلاةُ ركعتين ركعتين في الحضر والسفر، فأُقِرَّتْ صلاةُ السفر، وزيد في صلاة الحضر
  - motif: four-at-home-two-travelling-one-in-fear
    refs:
    - Jāmiʿ 9:1772.1
    note: فرض الله الصلاةَ على لسان نبيكم في الحضر أربعًا وفي السفر ركعتين، وفي الخوف ركعة
  - motif: two-complete-not-shortened
    refs:
    - Jāmiʿ 9:1772.2
    note: صلاة السفر ركعتان، وصلاة الجمعة ركعتان، والفطر والأضحى ركعتان، تمام غير قَصْرٍ
  - motif: travel-prayer-not-in-quran
    refs:
    - Jāmiʿ 9:1773.1
    note: إنَّا نَجِد صلاة الحضر وصلاة الخوف في القرآن. ولا نجد صلاة السفر في القرآن ... وإنَّما نفعل كما رأينا محمدًا ﷺ يفعل
- id: hadith-9-shortening-in-safety
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Shortening in safety: a charity; God loves his dispensations taken'
  read:
  - Jāmiʿ 9:1773.2-1775.2
  quran:
  - 4:101
  - 95:1-8
  tags:
  - motif: shortening-in-safety-a-charity-from-god
    refs:
    - Jāmiʿ 9:1773.2
    note: فقد أمِن الناس ... صدقة تصدق الله بها عليكم فاقبلوا صدقته
  - motif: fig-and-olive-in-travel-night-prayer
    refs:
    - Jāmiʿ 9:1774.1
    note: 'أنَّه كان في سفر فصلَّى العشاء الآخِرة. فقرأ في إحدى الركعتين: ﴿وَالتِّينِ وَالزَّيْتُونِ﴾'
  - motif: fearing-none-but-god-prayed-two
    refs:
    - Jāmiʿ 9:1774.2
    note: خرج من المدينة إلى مكة، لا يخاف إلا الله رب العالمين، فصلَّى ركعتين
  - motif: two-with-prophet-abu-bakr-umar
    refs:
    - Jāmiʿ 9:1774.3
    note: صلَّيت مع رسول الله ﷺ في السفر ركعتين، ومع أبي بكر ركعتين، ومع عمرَ ركعتين
  - motif: god-loves-dispensations-taken
    refs:
    - Jāmiʿ 9:1774.4
    - Jāmiʿ 9:1775.1
    note: إنَّ الله يُحِبُّ أن تُؤتَى رُخَصُه، كما يكره أن تُؤْتَى معصيتُه ... كما يُحِبُّ أن يؤتى عزائمه
  - motif: adders-to-two-rakas-pass-through-like-arrow
    refs:
    - Jāmiʿ 9:1775.2
    note: يُضيفون إلى ركعتيه ركعتين أخْريين ... قبَّح الله الوجوه ... إن أَقوامًا يتعمقون في الدين، يمرُقُون كما يمرُقُ السهمُ من الرمية
- id: hadith-9-where-shortening-begins
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Where shortening begins: Dhu l-Hulayfa, three miles or farsakhs'
  read:
  - Jāmiʿ 9:1776.1-1776.3
  tags:
  - motif: four-at-medina-two-at-dhul-hulayfa
    refs:
    - Jāmiʿ 9:1776.1
    note: صلَّيتُ مع رسول الله ﷺ الظهر بالمدينة أربعًا، وصلَّيتُ معه العصر بذي الحُليفة ركعتين
  - motif: shortening-at-short-distance
    refs:
    - Jāmiʿ 9:1776.2
    - Jāmiʿ 9:1776.3
    note: إلى قرية على رأس سبعة عشر، أو ثمانية عشر ميلًا. فصلى ركعتين ... إذا خرج مسيرة ثلاثة أميالٍ، أو ثلاثة فراسخ
- id: hadith-9-length-of-stay
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'How long one shortens: ten days at Mecca, nineteen, twenty at Tabuk'
  read:
  - Jāmiʿ 9:1777.1-1779.1
  tags:
  - motif: ten-days-at-mecca-two-each
    refs:
    - Jāmiʿ 9:1777.1
    note: 'فكان يُصلي ركعتين ركعتين حتى رجعنا إلى المدينة. قلت: كم أقام بمكة؟ قال: عشرًا'
  - motif: nineteen-days-praying-two
    refs:
    - Jāmiʿ 9:1778.1
    note: أقام النبي ﷺ تسعة عشر يَقْصُر، فنحن إذا سافرنا تسعة عشر قصرنا، وإن زدنا أتممنا
  - motif: shortening-prayer-twenty-days-at-camp
    refs:
    - Jāmiʿ 9:1779.1
    note: أقام رسول الله ﷺ بتبوك عشرين يومًا يقصُر الصلاة
- id: hadith-9-mecca-and-mina
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Two at Mecca and Mina; Uthman's four
  read:
  - Jāmiʿ 9:1780.1-1781.2
  tags:
  - motif: two-at-mecca-sunna-of-abul-qasim
    refs:
    - Jāmiʿ 9:1780.1
    note: 'كيف أصلِّي إذا كنت بمكة إذا لم أصلِّ مع الإمام؟ فقال: ركعتين سنة أبي القاسم'
  - motif: uthman-four-at-mina-wish-for-two-accepted
    refs:
    - Jāmiʿ 9:1780.2
    note: صلَّى بنا عثمان بمنىً أربع ركعات، فقيل ذلك لعبد الله بن مسعود فاسترجع ... فليت حَظِّي من أربع ركعات ركعتان متقبَّلتان
  - motif: two-with-prophet-abu-bakr-umar
    refs:
    - Jāmiʿ 9:1780.2
    - Jāmiʿ 9:1781.1
    note: وصليت مع أبي بكر بمنًى ركعتين، وصليت مع عمر بمنًى ركعتين ... وعثمان صدرًا من خلافته
  - motif: with-imam-four-alone-two
    refs:
    - Jāmiʿ 9:1781.1
    note: فكان ابن عمر إذا صلَّى مع الإمام صلَّى أربعًا، وإذا صلَّاها وحده صلَّى ركعتين
  - motif: two-at-mina-safest-of-times
    refs:
    - Jāmiʿ 9:1781.2
    note: صلى بنا النبي ﷺ آمَنَ مَا كَان - بِمِنًى ركعتين
- id: hadith-9-joining-on-journey
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Joining prayers on the journey: hurried, delayed, at Tabuk'
  read:
  - Jāmiʿ 9:1781.3-1786.2
  tags:
  - motif: joining-prayers-on-campaign
    refs:
    - Jāmiʿ 9:1781.3
    - Jāmiʿ 9:1784.1
    - Jāmiʿ 9:1785.1
    - Jāmiʿ 9:1786.1
    - Jāmiʿ 9:1786.2
    note: إذا عجل به السيرُ يجمعُ بين المغرب والعِشاء ... يجمع بين الظهر والعصر، والمغرب والعشاء ... يجمع بين الصلاتين في السفر
  - motif: noon-delayed-to-afternoon-if-leaving-before-zenith
    refs:
    - Jāmiʿ 9:1783.1
    note: إذا ارتحل قبل أن تزيغَ الشمسُ أخَّر الظهر إلى وقت العصر، ثم يجمع بينهما. وإذا زاغ صلى الظهر ثم ركب
  - motif: joined-while-halted-at-tabuk
    refs:
    - Jāmiʿ 9:1784.1
    note: فأخَّر الصلاة يومًا. ثم خرج فصلى الظهر والعصر جميعًا، ثم دخل. ثم خرج فصلى المغرب والعشاء جميعًا
  - motif: joined-so-as-not-to-burden-community
    refs:
    - Jāmiʿ 9:1785.1
    note: 'ما حمله على ذلك؟ قال: أراد أن لا يُحرِج أمَّته'
  - motif: joining-prayers-on-campaign
    refs:
    - Jāmiʿ 9:1786.1
    note: وأخَّر المغرب وعجَّل العشاء فصلاهما جميعًا
- id: hadith-9-joining-at-home
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Joining at Medina without fear or travel; only two prayers out of time
  read:
  - Jāmiʿ 9:1787.1-1790.1
  tags:
  - motif: joined-in-medina-without-fear-or-travel
    refs:
    - Jāmiʿ 9:1787.1
    note: صلَّى رسول الله ﷺ الظهر والعصر جميعًا، والمغرب والعشاء جميعًا في غير خوف ولا سفر
  - motif: only-two-prayers-out-of-time-at-muzdalifa
    refs:
    - Jāmiʿ 9:1790.1
    note: ما رأيتُ النبي ﷺ صلَّى صلاة لغير ميقاتها، إلَّا صلاتين، جمع بين المغرب والعشاء، وصلى الفجر قبل ميقاتها ... وذلك بجمع
- id: hadith-9-noon-early-on-journey
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Noon prayed before moving on, even at midday
  read:
  - Jāmiʿ 9:1791.1
  tags:
  - motif: noon-prayed-before-leaving-even-at-midday
    refs:
    - Jāmiʿ 9:1791.1
    note: 'إذا نزل منزلًا لم يرتحل حتى يُصلي الظهر. فقال له رجل: وإن كان بنصف النهار؟ قال: وإن كان بنصف النهار'
- id: hadith-9-no-extras-on-journey
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: No voluntary prayers with the travel prayer
  read:
  - Jāmiʿ 9:1792.1-1793.1
  quran:
  - '33:21'
  tags:
  - motif: would-have-completed-if-praying-extras
    refs:
    - Jāmiʿ 9:1792.1
    note: 'ما يصنع هؤلاء؟ قلت: يُسبِّحون. قال: لو كنتُ مسبِّحًا لأتممتُ صلاتي ... فلم يزد على ركعتين حتَّى قبضه الله'
  - motif: would-have-completed-if-praying-extras
    refs:
    - Jāmiʿ 9:1793.1
    note: رأيتُ رسول الله ﷺ لا يسبح في الصلاة في السفر قبل الصلاة ولا بعدها
- id: hadith-9-prayer-on-mount
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Voluntary prayer on the mount, not the obligatory; the donkey; 'wherever you turn'
  read:
  - Jāmiʿ 9:1793.2-1797.2
  quran:
  - 2:115
  tags:
  - motif: voluntary-on-mount-any-direction-not-obligatory
    refs:
    - Jāmiʿ 9:1793.2
    - Jāmiʿ 9:1793.3
    - Jāmiʿ 9:1794.1
    - Jāmiʿ 9:1795.1
    note: وهو على راحلته يُسَبِّح، يومئْ برأسه قِبل أيِّ وجه توجَّه، ولم يكن رسول الله ﷺ يصنع ذلك في الصلاة المكتوبة ... فإذا أراد الفريضة نزل فاستقبل القبلة
  - motif: women-no-license-to-pray-on-mounts
    refs:
    - Jāmiʿ 9:1794.2
    note: 'هل رُخِّص للنساء أن يُصلين على الدواب؟ قالت: لم يُرخص له في ذلك في شِدَّة، ولا رخاء'
  - motif: prays-on-donkey-toward-khaybar
    refs:
    - Jāmiʿ 9:1796.1
    - Jāmiʿ 9:1796.3
    note: يُصلي وهو على حمار، وهو متوجِّه إلى خيبر ... فرأيتُه يُصَلِّي على حمار ووجهه من ذا الجانب ... لولا أني رأيتُ رسول الله ﷺ فعله لم أفعله
  - motif: wherever-you-turn-revealed-for-mount-prayer
    refs:
    - Jāmiʿ 9:1796.2
    note: 'يُصلي وهو مقبل من مكة إلى المدينة على راحلته حيث كان وجههُ، قال: وفيه نزلت'
  - motif: faces-qibla-for-opening-takbir-then-any-way
    refs:
    - Jāmiʿ 9:1797.1
    note: فأراد أن يتطوع استقبل بناقته القبلة فكَّبر، ثم صلَّى حيث وجَّهه رِكابُه
  - motif: prostration-lower-than-bowing-on-mount
    refs:
    - Jāmiʿ 9:1797.2
    note: يُصَلِّي على راحلته نحو المشرق، والسجود أخفضُ من الركوع
  hints:
  - 'Dismounting for the obligatory prayer and facing the qibla, turning the camel to the qibla for the opening takbir and then praying as it goes (Jāmiʿ 9:1794.1, 1797.1) - compare M. Berakhot 4:5: one riding a donkey should dismount; if he cannot, turn his face (toward Jerusalem); if he cannot, direct his heart to the Holy of Holies'
- id: hadith-9-fear-prayer-one-raka-each
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Fear prayer: a rakʿa with each group, each completing alone'
  read:
  - Jāmiʿ 9:1799.1-1800.1
  quran:
  - 4:101-102
  tags:
  - motif: fear-prayer-one-raka-each-group-completes-alone
    refs:
    - Jāmiʿ 9:1799.1
    note: فقامت طائفة معه يُصلِّي، وأقبلت طائفة على العدوِّ ... فقام كل واحد منهم فركع لنفسه ركعةً، وسجد سجدتين
  - motif: fear-prayer-groups-alternate-imam-waits
    refs:
    - Jāmiʿ 9:1800.1
    note: فصلَّى بالذين معه ركعةً، ثمَّ ثبت قائمًا وأتمُّوا لأنفسهم ... ثم ثبت جالسًا، وأتمُّوا لأَنفُسِهِمْ، ثمَّ سَلَّمَ بهم
- id: hadith-9-fear-prayer-two-rows
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Fear prayer in two rows with the enemy toward the qibla; Gabriel warns
  read:
  - Jāmiʿ 9:1801.1-1802.1
  quran:
  - 4:101-102
  tags:
  - motif: gabriel-tells-of-enemy-plan
    refs:
    - Jāmiʿ 9:1801.1
    note: لو مِلْنا عليهم ميلةً لاقتطعناهم، فأخبر جبريل رسولَ الله ﷺ ذلك
  - motif: enemy-plans-attack-during-prayer
    refs:
    - Jāmiʿ 9:1801.1
    - Jāmiʿ 9:1802.1
    note: إنَّه ستأتيهم صلاةٌ هي أحبُّ إليهم من الأولاد ... لو كُنَّا حملنا عليهم وهم في الصلاة، فنزلت آية القَصْر بين الظهر والعصر
  - motif: fear-prayer-in-two-rows
    refs:
    - Jāmiʿ 9:1801.1
    - Jāmiʿ 9:1801.2
    - Jāmiʿ 9:1802.1
    note: صَفَّنا صَفَّين، والمشركون بيننا وبين القبلة ... ثم تأخَّر الصف الأول وتقدم الصف الثاني
  - motif: as-guards-do-with-their-commanders
    refs:
    - Jāmiʿ 9:1801.1
    - Jāmiʿ 9:1801.2
    note: كما يُصَلِّي أمَرَاؤُكم هؤلاء ... كما يصنع حرسُكم هؤلاء بأمرائهم
- id: hadith-9-fear-prayer-at-najd
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Fear prayer at Najd: backs to the qibla, walking backwards'
  read:
  - Jāmiʿ 9:1802.2-1804.1
  quran:
  - 4:101-102
  tags:
  - motif: group-backs-to-qibla-facing-enemy
    refs:
    - Jāmiʿ 9:1802.2
    note: وطائفة أخرى مقابل العدوِّ وظهورهم إلى القبلة، فكبَّر رسول الله ﷺ، فكبروا جميعًا
  - motif: fear-prayer-groups-alternate-imam-waits
    refs:
    - Jāmiʿ 9:1802.2
    note: فركعوا وسجدوا، ورسول الله ﷺ قائم كما هو
  - motif: withdraw-walking-backwards
    refs:
    - Jāmiʿ 9:1804.1
    note: ثم قاموا فنكصوا على أعقابهم يمشون القهقرَى، حتى قاموا من ورائهم
- id: hadith-9-fear-prayer-four-and-two
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Four for the imam, two for the people; the sword on the tree
  read:
  - Jāmiʿ 9:1805.1
  quran:
  - 4:101-102
  tags:
  - motif: bedouin-takes-hung-sword-who-protects-you
    refs:
    - Jāmiʿ 9:1805.1
    note: 'وسيفُ رسول الله ﷺ مُعَلَّقٌ بشجرةٍ، فأخذ سيف نبي الله ﷺ فاخترطه ... فمن يمنعك مني؟ قال: "الله يمنَعُني منك'
  - motif: fear-prayer-imam-four-people-two
    refs:
    - Jāmiʿ 9:1805.1
    note: فكانت لرسُول الله ﷺ أربعُ ركعَاتٍ، ولِلْقوم ركعتان
- id: hadith-9-fear-prayer-one-raka
