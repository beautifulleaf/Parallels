      - {motif: sheets-borrowed-from-hafsa-and-returned, refs: ["Jāmiʿ 2:491.2"], note: "أَنْ أرسلي إلينا بالصُّحُف ننسخها في المصاحف، ثم نَردّها إليك"}
      - {motif: codex-sent-to-each-region-others-burned, refs: ["Jāmiʿ 2:491.2"], note: "وأرسل إلى كلِّ أُفُقٍ بمصحف مما نسخوا، وأمر بما سواه من القرآن في كل صحيفة أو مصحف أن يُحْرق"}
  - id: hadith-2-the-reciters-among-companions
