    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "Given five (or six) not given to prophets before - terror a month's distance, the earth a mosque and purifier, spoils lawful, sent to all, intercession; concise words; the seal"
    read: ["Jāmiʿ 2:535.1-535.3", "Jāmiʿ 2:548.3"]
    quran: ["34:28", "7:158", "4:174"]
    tags:
      - {motif: helped-by-terror-a-months-journey, refs: ["Jāmiʿ 2:535.1", "Jāmiʿ 2:535.2", "Jāmiʿ 2:535.3"], note: "نُصرتُ بالرُّعب مسيرة شهر"}
      - {motif: earth-made-mosque-and-means-of-purification, refs: ["Jāmiʿ 2:535.1", "Jāmiʿ 2:535.2", "Jāmiʿ 2:535.3"], note: "وجعلتْ لي الأرض مسجدًا وطهورًا، وأيما رجل من أمّتي أدركتْه الصّلاة فليصلِّ"}
      - {motif: spoils-lawful-only-for-this-community, refs: ["Jāmiʿ 2:535.1", "Jāmiʿ 2:535.3"], note: "وأحلت لي الغنائم ولم تُحل لأحد كان قبلي"}
      - {motif: sent-to-red-and-black-not-one-people, refs: ["Jāmiʿ 2:535.1", "Jāmiʿ 2:535.2", "Jāmiʿ 2:535.3"], note: "وكان النبيُّ يبعث إلى قومه خاصة، وبُعثت إلى الناس كافة; وبُعثتُ إلى الأحمر والأسود"}
      - {motif: each-prophet-had-one-granted-request-his-kept-for-intercession, refs: ["Jāmiʿ 2:535.1", "Jāmiʿ 2:535.3"], note: "وقيل لي: سلْ تُعطه، فاختبأتُهَا شفاعةً لأمّتي، وهي نائلة منكم ... من لقي اللَّه لا يشرك به شيئًا"}
      - {motif: sent-with-comprehensive-words, refs: ["Jāmiʿ 2:535.2", "Jāmiʿ 2:548.3"], note: "فُضِّلْتُ على الأنبياء بست: أُعطيت جوامع الكلم ... وخُتم بي النبيّون"}
  - id: hadith-2-who-hears-and-does-not-believe
