      - {motif: you-know-your-worldly-affairs-best, refs: ["Jāmiʿ 2:508.1", "Jāmiʿ 2:508.2", "Jāmiʿ 2:508.3"], note: "فإنّي إنّما ظننتُ ظنًّا فلا تُؤاخذوني بالظّن ... أنتم أعلم بأمر دنياكم"}
