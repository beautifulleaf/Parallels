      - {motif: sent-at-forty-ten-years-in-each-city, refs: ["Jāmiʿ 2:490.2"], note: "لبث النبيُّ ﷺ بمكة عشر سنين يُنزل عليه القرآن، وبالمدينة عشرًا"}
  - id: hadith-2-quran-like-hobbled-camels
