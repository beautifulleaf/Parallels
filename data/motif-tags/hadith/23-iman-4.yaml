      - {motif: jesus-kills-dajjal-at-gate-of-lydda, refs: ["Jāmiʿ 2:526.2"], note: "إنّ لي فيك ضربةً لن تسبقني بها فيدركهـ عند باب اللُّدِّ الشّرقي فيقتله"}
      - {motif: stone-and-tree-call-out-hidden-jew, refs: ["Jāmiʿ 2:526.2"], note: "لا حجر ولا شجر ولا حائط ولا دابة -إلّا الغَرْقَدَة فإنّها من شجرهم لا تنطق- إلّا قال: يا عبد اللَّه المسلم هذا يهودي"}
