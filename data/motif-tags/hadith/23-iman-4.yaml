      - {motif: four-ansar-collected-the-quran, refs: ["Jāmiʿ 2:492.2", "Jāmiʿ 2:492.3"], note: "أربعة كلّهم من الأنصار: أُبي بن كعب، ومعاذ بن جبل، وزيد بن ثابت، وأبو زيد; أبو الدرداء، ومعاذ بن جبل، وزيد بن ثابت، وأبو زيد"}
