      - {motif: no-travel-with-quran-to-enemy-land, refs: ["Jāmiʿ 2:492.5"], note: "نهى رسول اللَّه ﷺ أن يسافر بالقرآن إلى أرض العدو"}
  - id: hadith-2-every-prophet-given-a-sign
