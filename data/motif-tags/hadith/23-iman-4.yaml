      - {motif: who-hears-of-him-and-disbelieves-is-in-fire, refs: ["Jāmiʿ 2:536.2"], note: "لا يسمعُ بي أحدٌ من هذه الأمّة يهوديٌّ ولا نصرانيّ، ثم يموت ولم يؤمن بالذي أرسلت به إلّا كان من أصحاب النّار"}
  - id: hadith-2-mission-to-the-jinn
