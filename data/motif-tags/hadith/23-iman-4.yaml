    read: ["Jāmiʿ 2:553.1-556.2"]
    quran: ["47:19"]
    tags:
      - {motif: seal-between-shoulders-like-pigeon-egg, refs: ["Jāmiʿ 2:553.1", "Jāmiʿ 2:553.2"], note: "فنظرتُ إلى خاتمه بين كتفيه كزِرّ الحَجَلة; رأيتُ خاتمًا في ظهر رسول اللَّه ﷺ كأنّه بيضة حمام"}
      - {motif: companion-sees-seal-between-shoulders, refs: ["Jāmiʿ 2:554.1"], note: "فنظرت إلى خاتم النبوة بين كتفيه عند ناغِض كتفه اليُسرى. جُمْعًا عليه خِيلانٌ كأمثال الثآليل"}
      - {motif: shirt-buttons-left-open-hand-touches-seal, refs: ["Jāmiʿ 2:554.2"], note: "وإنّ قميصه لمطلق الأزرار. قال: فبايعتُه ثم أدخلتُ يدي في جيب قميصه فمستُ الخاتم"}
      - {motif: seal-is-hair-gathered-on-shoulder, refs: ["Jāmiʿ 2:555.1"], note: "فمسحتُ ظهره، وجعلتُ الخاتم بين أصابعي ... قال: شعر مجتمع على كتفه"}
      - {motif: seeker-recognises-prophet-by-the-seal, refs: ["Jāmiʿ 2:555.2"], note: "فنظر سلمان إلى الخاتم الذي على ظهر رسول اللَّه ﷺ فآمن به"}
      - {motif: seal-a-raised-piece-of-flesh, refs: ["Jāmiʿ 2:556.1"], note: "كان في ظهره بضعة ناشزة"}
      - {motif: people-take-the-prophets-ablution-water, refs: ["Jāmiʿ 2:553.1"], note: "إنّ ابن أخي وَجِعٌ، فمسح رأسي ودعا لي بالبركة، ثم توضّأ فشربت من وَضوئه"}
      - {motif: prophet-asks-forgiveness-for-his-sin, refs: ["Jāmiʿ 2:554.1"], note: "أستغفر لك النبيُّ ﷺ؟ قال: نعم. ولك ثم تلا هذه الآية: وَاسْتَغْفِرْ لِذَنْبِكَ وَلِلْمُؤْمِنِينَ وَالْمُؤْمِنَاتِ"}
      - {motif: throne-of-merciful-shook-for-sad, refs: ["Jāmiʿ 2:556.2"], note: "اهتزّ عرش الرحمن ﵎. يريد سعد ابن معاذ يوم توفي"}
  - id: hadith-2-only-good-tidings-remain
