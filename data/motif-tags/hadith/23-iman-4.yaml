      - {motif: voice-calls-from-all-sides-none-seen, refs: ["Jāmiʿ 2:486.2"], note: "فنظرتُ عن يميني فلم أرَ شيئًا، ونظرتُ عن شمالي فلم أرَ شيئًا، ونظرتُ أمامي ... ونظرتُ خلفي ... فرفعتُ رأسي فرأيتُ شيئًا"}
