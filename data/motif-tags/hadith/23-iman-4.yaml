  - id: hadith-2-five-names
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "The five names - Muhammad, Ahmad, al-Mahi, al-Hashir, al-Aqib"
    read: ["Jāmiʿ 2:547.1"]
    quran: ["33:40"]
    tags:
      - {motif: five-names-of-the-prophet, refs: ["Jāmiʿ 2:547.1"], note: "لي خمسةُ أسماء: أنا محمد، وأنا أحمد، وأنا الماحي الذي يمحو اللَّه بي الكفر، وأنا الحاشر الذي يُحشر الناس على قدمي، وأنا العاقب"}
  - id: hadith-2-no-prophet-after-him
