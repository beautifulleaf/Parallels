      - {motif: prophet-believed-by-only-one-man, refs: ["Jāmiʿ 2:501.2"], note: "وإنّ من الأنبياء نبيًّا ما يصدّقه من أمّته إِلَّا رجلٌ واحد"}
      - {motif: first-intercessor-in-paradise, refs: ["Jāmiʿ 2:501.2"], note: "أنا أوّل شفيع في الجنّة، لم يُصدَّق نبيٌّ من الأنبياء ما صُدِّقتُ"}
