    read: ["Jāmiʿ 2:548.1-548.2", "Jāmiʿ 2:548.4-549.1"]
    quran: ["33:40"]
    tags:
      - {motif: israel-governed-by-prophets-now-caliphs, refs: ["Jāmiʿ 2:548.1"], note: "كانت بنو إسرائيل تسوسُهم الأنبياء، كلّما هلك نبيٌّ خلفه نبيٌّ، وأنّه لا نبي بعدي، وسيكون خلفاء فيكثرون"}
      - {motif: fulfil-pledge-to-first-then-first, refs: ["Jāmiʿ 2:548.1"], note: "فوا ببيعة الأوّل فالأوّل، أعطوهم حقَّهم، فإنّ اللَّه سائلُهم عمّا اسْترعَاهُم"}
      - {motif: intercession-chain-adam-to-muhammad, refs: ["Jāmiʿ 2:548.2"], note: "يا محمد أنت رسول اللَّه وخاتم الأنبياء، وغفر اللَّه لك ما تقدّم من ذنبك وما تأخّر اشفع لنا إلى ربِّك"}
      - {motif: last-prophet-last-mosque, refs: ["Jāmiʿ 2:548.4"], note: "فإنّي آخر الأنبياء، وإنّ مسجدي آخر المساجد"}
      - {motif: thirty-liars-claim-prophethood, refs: ["Jāmiʿ 2:549.1"], note: "وإنّه سيكون في أمّتي ثلاثون كذّابون كلّهم يزعم أنّه نبيٌّ، وأنا خاتم الأنبياء لا نبيّ بعدي"}
      - {motif: tribes-join-idolaters-and-worship-idols, refs: ["Jāmiʿ 2:549.1"], note: "حتى تلحق قبائلُ من أمّتي بالمشركين، وحتّى يعبدوا الأوثان"}
  - id: hadith-2-the-missing-brick
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "The parable of the house complete but for one brick - 'I am the brick, and I am the seal of the prophets'"
    read: ["Jāmiʿ 2:549.2-550.3"]
    quran: ["33:40"]
    tags:
      - {motif: prophet-is-the-missing-corner-brick, refs: ["Jāmiʿ 2:549.2", "Jāmiʿ 2:550.1", "Jāmiʿ 2:550.2", "Jāmiʿ 2:550.3"], note: "كمثل رجلٍ بنى بيتًا فأحسنه وأجمله إلّا موضع لبنة من زاوية، فجعل النّاس يطوفون به ويعجبون له، ويقولون: هلّا وُضِعتْ هذه اللّبنة؟ قال: وأنا اللّبنة، وأنا خاتم النّبيين"}
    hints:
      - "The building completed by one stone, against Ps 118:22 'the stone which the builders refused is become the head stone of the corner' (and Matt 21:42)."
  - id: hadith-2-ali-as-aaron-to-moses
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "\"You are to me as Aaron to Moses, except that there is no prophet after me\" - Ali left behind at Tabuk"
    read: ["Jāmiʿ 2:551.1-552.1"]
    tags:
      - {motif: position-of-aaron-to-moses, refs: ["Jāmiʿ 2:551.1", "Jāmiʿ 2:551.2", "Jāmiʿ 2:552.1"], note: "تُخَلِّفُني في النّساء والصّبيان؟ ! فقال: أما ترضى أن تكون مني بمنزلة هارون من موسى، غير أنّه لا نبيَّ بعدي"}
    hints:
      - "Aaron left in charge of the people while Moses goes up, against Exod 24:14 and Q 7:142 ('take my place among my people')."
  - id: hadith-2-seal-of-prophethood
