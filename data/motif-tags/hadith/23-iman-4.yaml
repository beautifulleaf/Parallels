      - {motif: wife-consoles-you-join-kin-bear-burdens, refs: ["Jāmiʿ 2:485.1"], note: "كلا واللَّهِ ما يخزيك اللَّه أبدا، إنّك لتصل الرّحم، وتحملُ الكلّ، وتكسب المعدوم، وتقري الضيف، وتعين على نوائب الحقّ"}
      - {motif: christian-kinsman-recognizes-the-namus-of-moses, refs: ["Jāmiʿ 2:485.1"], note: "وكان امرءًا تنصَّر في الجاهليّة وكان يكتب الكتاب العبرانيَّ ... هذا النّاموس الذي نزل اللَّه على موسى"}
      - {motif: every-bringer-of-this-was-opposed, refs: ["Jāmiʿ 2:485.1"], note: "لم يأتِ رجلٌ قطُّ بمثل ما جئتَ به إلّا عودي"}
      - {motif: revelation-pauses-after-first-vision, refs: ["Jāmiʿ 2:485.1"], note: "ثم لم ينشبْ ورقةُ أن توفي وَفَتَرَ الوحيُ"}
    hints:
      - "The reluctant call answered by overpowering touch, against Jer 1:6-9 ('I cannot speak'; the LORD touches his mouth) and Isa 6:5-7."
  - id: hadith-2-first-and-last-revealed
