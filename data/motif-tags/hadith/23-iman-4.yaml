      - {motif: dajjal-days-year-month-week, refs: ["Jāmiʿ 2:513.1"], note: "أربعون يومًا يوم كسنة، ويوم كشهر ويوم كجمعة وسائر أيامه كأيامكم"}
      - {motif: prayer-measured-in-long-day, refs: ["Jāmiʿ 2:513.1"], note: "فذلك اليوم الذي كسنة أتكفِينا فيه صلاةُ يومٍ؟ قال: لا اقدُرُوا له قدْرَه"}
      - {motif: ruin-treasures-follow-like-bee-swarms, refs: ["Jāmiʿ 2:513.1"], note: "ويَمرُّ بالخَرِبَة فيقول لها: أخْرجِي كنوزَك فتتبعه كنوزُها كيعاسِيب النّحلِ"}
      - {motif: dajjal-cuts-youth-in-two-and-calls-him, refs: ["Jāmiʿ 2:513.1"], note: "ثم يدْعُو رَجُلًا ممتلئًا شبابًا فيضربه بالسّيف فيقطعه جَزِلَتَيْن رَمْيةَ الغَرَضِ. ثم يدعوه فيقبلُ ويتهلّلُ وجهُه يَضْحَكُ"}
      - {motif: jesus-descends-at-white-minaret-east-of-damascus, refs: ["Jāmiʿ 2:513.1"], note: "فينزل عند المنارة البيضاء شرقي دمشق بين مَهْرُودَتَيْنِ واضعًا كَفَّيْه على أَجنحةِ مَلَكَيْنِ"}
      - {motif: jesus-breath-kills-unbelievers-to-horizon, refs: ["Jāmiʿ 2:513.1"], note: "فلا يَحل لكافرٍ يجدُ ريحَ نفسه إِلَّا مات، ونفسُه ينتهي حيث ينتهي طرْفُه"}
      - {motif: jesus-kills-dajjal-at-gate-of-lydda, refs: ["Jāmiʿ 2:513.1"], note: "فيطلُبُه حتّى يُدْركَه بباب لُدٍّ، فَيَقْتُلَه"}
      - {motif: take-my-servants-up-to-the-mount, refs: ["Jāmiʿ 2:513.1"], note: "إنّي قد أخرجتُ عبادًا لي، لا يَدانِ لأحدٍ بقتالهم فحَرِّزْ عِبادي إلى الطُّور"}
      - {motif: gog-magog-drink-lake-tiberias, refs: ["Jāmiʿ 2:513.1"], note: "فيمرُّ أَوائِلُهم على بُحيرةِ طَبَريَّةَ فيشربون ما فيها، ويمرُّ آخرهم فيقولون: لقد كان بهذه مرَّةً ماءٌ"}
      - {motif: ox-head-better-than-hundred-dinars, refs: ["Jāmiʿ 2:513.1"], note: "حتّى يكونَ رأسُ الثّور لأحدهم خيرًا من مائة دينار لأحدكم اليوم"}
      - {motif: gog-magog-killed-by-neck-worms, refs: ["Jāmiʿ 2:513.1"], note: "فيرسل اللَّه عليهمُ النَّغَفَ في رقابِهم فيصبحون فَرْسَى كموت نفسٍ واحدةٍ; فيرسل اللَّه طيرًا كأعناقِ البُخْت فتحملهم فتطرحهم حيثُ شاء اللَّه"}
      - {motif: rain-washes-earth-like-mirror, refs: ["Jāmiʿ 2:513.1"], note: "ثم يرسل اللَّه مطرًا لا يَكُنّ منه بيتُ مَدر ولا وَبر فيغسلُ الأرض حتى يترُكَها كالزَّلَفَةِ"}
      - {motif: band-eats-pomegranate-shades-in-rind, refs: ["Jāmiʿ 2:513.1"], note: "فيومئذ تَأْكُلُ العصابة من الرُّمانة، ويستظلون بقِحْفِها، ويبارك في الرّسْل حتّى إنّ اللَّقْحَةَ من الإبل لتكفي الفئام من الناس"}
      - {motif: wind-takes-believers-under-armpits, refs: ["Jāmiʿ 2:513.1"], note: "إذ بعث اللَّهُ ريحًا طيّبة فتأخذهم تحت آباطهم فتقبض روح كلِّ مؤمن ... ويبقى شرارُ النّاس يتهارجون فيها تهارج الحمر فعليهم تقوم السّاعة"}
    hints:
      - "Gog and Magog's multitude and its corpses given to the birds, against Ezek 39:4, 17-20 (birds summoned to eat the flesh of Gog's host)."
