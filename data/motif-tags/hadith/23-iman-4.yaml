      - {motif: seeing-prophet-dearer-than-family-and-wealth, refs: ["Jāmiʿ 2:542.2"], note: "من أشدّ أمتي حُبًّا ناسٌ يكونون بعدي، يودُّ أحدُهم لو رآني بأهله وماله"}
  - id: hadith-2-blessed-who-believed-unseen
