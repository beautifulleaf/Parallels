# Hadith chunk 23: al-Jāmiʿ al-Kāmil book 2 (kitāb al-īmān), Shamela pp. 438-557 (printed 1/439-558): the end of
# the bābs on belief in the angels (angels guarding Medina, disputing a soul, cursing, blessing the rows, recording
# intentions, washing Adam and Hanzala), the bābs on Gabriel and the other angels (Michael, Israfil, Munkar and Nakir,
# the keepers of paradise and hell, the angel of death), belief in the revealed books and the history of the Quran's
# revelation and collection, belief in the messengers (with the long bābs on Jesus's descent and the Dajjal), and
# belief in the prophet (love of him, his names, the seal of prophethood, no prophet after him). Read in full from the
# Arabic (216 hadith). The compiler's discussion and the weak reports he gives inside it (e.g. the long Abu Dharr
# report on the number of prophets, pp. 495-497) are context only and not tagged.
new_motifs:
  dajjal-on-uhud-white-palace-mosque-of-ahmad: {label: "The Dajjal climbs Uhud, looks on Medina and says 'see this white palace? It is Ahmad's mosque'; he pitches his tent at the salt flat of al-Jurf", cluster: eschatology}
  rooster-crows-at-angel-donkey-brays-at-devil: {label: "When you hear cocks crow ask God's bounty, for they have seen an angel; when you hear a donkey bray seek refuge from Satan, for it has seen a devil", cluster: angels}
  prophet-covers-himself-for-uthman-alone: {label: "Reclining with thighs uncovered he receives Abu Bakr and Umar as he is, but sits up and arranges his clothes for Uthman", cluster: sira}
  angels-feel-shame-before-uthman: {label: "'Shall I not feel shame before a man before whom the angels feel shame?' (of Uthman)", cluster: angels}
  god-and-angels-bless-who-join-the-rows: {label: "God and his angels bless those who join (close) the rows of prayer", cluster: ritual}
  prophet-wipes-chests-in-the-row: {label: "He passes through the row wiping chests and shoulders: 'do not differ, lest your hearts differ'", cluster: ritual}
  god-and-angels-bless-the-first-row: {label: "God and his angels bless (yusalluna 'ala) the first row (the first rows)", cluster: ritual}
  god-and-angels-bless-those-eating-suhur: {label: "God and his angels bless those who eat the pre-dawn meal (al-mutasahhirin)", cluster: ritual}
  two-angels-carry-good-soul-up-scent-of-musk: {label: "When the believer's soul goes out two angels meet it and take it up; its fragrance (musk) is described", cluster: eschatology}
  heaven-blesses-good-soul-and-body-it-lived-in: {label: "The people of heaven say: a good soul from the earth; God bless you and the body you inhabited", cluster: eschatology}
  souls-taken-on-to-the-end-of-the-term: {label: "After the soul is brought to its Lord it is said: 'take it to the end of the term'", cluster: eschatology}
  prophet-draws-cloth-over-nose-at-stench-of-soul: {label: "Telling of the unbeliever's foul-smelling soul the prophet draws his thin cloak over his nose", cluster: eschatology}
  angels-of-mercy-bring-white-silk-for-believers-soul: {label: "Angels of mercy bring a white silk cloth for the believer's soul, which comes out like the best musk and is passed from hand to hand to the gate of heaven", cluster: eschatology}
  angels-of-punishment-bring-sackcloth-for-unbelievers-soul: {label: "Angels of punishment (black-faced) bring sackcloth (mish) for the unbeliever's soul, which comes out like the foulest carrion and is taken to the gate of the earth", cluster: eschatology}
  soul-told-come-out-good-soul-from-good-body: {label: "The angels say to the dying righteous man: 'come out, good soul that was in a good body, to God's mercy (or forgiveness and pleasure)'", cluster: eschatology}
  sun-faced-angels-with-shroud-and-balm-of-paradise: {label: "White-faced angels, faces like the sun, come down with a shroud and embalming spice of paradise and sit as far as the eye reaches", cluster: eschatology}
  angel-of-death-sits-at-the-head: {label: "The angel of death comes and sits at the dying man's head and addresses the soul", cluster: eschatology}
  angels-flank-bridge-saying-sallim: {label: "Angels on both sides of the bridge over hell say 'O God, keep safe, keep safe'", cluster: eschatology}
  medina-sanctuary-trees-not-cut: {label: "Medina is a sanctuary from 'Ayr to such-and-such; its trees are not cut", cluster: law}
  curse-of-god-angels-and-all-people: {label: "Formula: 'upon him is the curse of God, the angels and all people'", cluster: law}
  no-exchange-or-ransom-accepted-from-him: {label: "No exchange or ransom (sarf wa-ʿadl) will be accepted from him on the day of resurrection", cluster: eschatology}
  alis-sheet-in-sword-scabbard: {label: "Ali: we have nothing but God's Book and this sheet (sahifa) from the prophet, hung in his sword's scabbard", cluster: law}
  curse-on-who-claims-other-than-his-father: {label: "Whoever claims descent from other than his father or takes patrons other than his own is cursed by God, angels and people", cluster: law}
  preaching-from-camel-saliva-on-hearers-shoulders: {label: "The prophet preaches from his she-camel chewing the cud; the hearer stands under her neck and her saliva runs between his shoulders", cluster: sira}
  muslims-guarantee-is-one-lowest-may-give-it: {label: "The protection (dhimma) of the Muslims is one, the lowest of them may extend it; whoever breaks a Muslim's guarantee is cursed", cluster: law}
  blind-melee-killing-pays-error-bloodwit: {label: "One killed in a blind melee (ʿimmiyya) or partisan fighting, by stone, whip or stick, is owed the blood-money of error", cluster: law}
  deliberate-killing-is-retaliation: {label: "Deliberate killing is retaliation (qawad); whoever comes between the avenger and it is cursed", cluster: law}
  angels-curse-wife-who-deserts-husbands-bed: {label: "The angels curse the wife who spends the night away from her husband's bed until she returns (or until morning)", cluster: angels}
  angels-curse-who-points-iron-at-brother: {label: "The angels curse whoever points a piece of iron at his brother, even his full brother", cluster: angels}
  thirty-odd-angels-race-to-write-praise: {label: "Thirty-odd angels race to be first to write the words 'Our Lord, to you be praise, much, good, blessed praise'", cluster: angels}
  angels-greeting-stops-at-cautery: {label: "The angels used to greet a companion; when he was cauterized it stopped, and when he gave up cautery it returned", cluster: angels}
  hajj-and-umra-joined-never-forbidden: {label: "The prophet joined hajj and umra and did not forbid it until he died, and no Quran came down forbidding it", cluster: ritual}
  voice-in-cloud-names-garden-to-water: {label: "A man in the desert hears a voice in a cloud: 'water so-and-so's garden'; the cloud empties on a lava field and a channel carries it to that man", cluster: miracle}
  harvest-in-thirds-alms-family-replanting: {label: "He divides his garden's yield in thirds: a third in alms, a third for himself and family, a third put back into it", cluster: ethics}
  angels-spread-wings-over-syria: {label: "'Blessed is Syria': the angels of the Merciful spread their wings over it", cluster: angels}
  quran-composed-from-scraps-in-prophets-presence: {label: "With the prophet they were arranging (composing) the Quran from scraps (riqa')", cluster: revelation}
  companion-from-jinn-and-from-angels: {label: "Every person has been assigned a companion (qarin) from the jinn and a companion from the angels", cluster: angels}
  angel-and-devil-race-to-sleeper-seal-with-good-or-evil: {label: "When a man goes to bed an angel and a devil race to him: 'seal with good' / 'seal with evil'; on waking 'open with good' / 'open with evil'", cluster: angels}
  angel-guards-sleeper-who-remembered-god: {label: "If he remembers God before sleeping the angel spends the night guarding him", cluster: angels}
  waking-praise-who-returned-my-soul: {label: "On waking: 'praise God who returned my soul and did not make it die in its sleep', and who holds heaven and earth lest they fall", cluster: ritual}
  evil-intent-not-written-until-done: {label: "God tells the angels: do not write an evil deed a servant intends until he does it; then write it as one", cluster: angels}
  abandoned-sin-written-as-good-deed: {label: "An evil deed intended and then left 'for my sake' is written as a good deed", cluster: angels}
  good-deed-tenfold-to-seven-hundred: {label: "A good deed done is written ten times its like up to seven hundred", cluster: angels}
  angels-report-mans-intent-god-says-watch-him: {label: "The angels tell God 'your servant wants to do an evil deed' (he knows better); God says 'watch him'", cluster: angels}
  prophets-angels-believers-intercede-gods-remains: {label: "Prophets, angels and believers intercede; the Compeller says 'my intercession remains'", cluster: eschatology}
  guest-prayer-fasting-broke-fast-angels-blessed: {label: "The prophet's prayer for a host who fed him bread and oil: 'the fasting broke their fast with you, the pious ate your food, the angels blessed you'", cluster: ritual}
  no-spitting-ahead-or-right-angel-on-right: {label: "In prayer do not spit ahead (he is confiding with God) nor to the right (an angel is there), but to the left or under the foot, and bury it", cluster: ritual}
  pearls-and-rubies-scatter-from-gabriels-feathers: {label: "Gabriel at the lote tree with six hundred wings; from his feathers scatter many-coloured wonders (tahawil), pearls and rubies", cluster: angels}
  hatred-proclaimed-in-heaven-placed-on-earth: {label: "When God hates a servant he tells Gabriel, Gabriel proclaims it in heaven, and hatred is placed for him on earth", cluster: angels}
  stranger-in-white-no-trace-of-travel-is-gabriel: {label: "A man in very white clothes with very black hair, no trace of travel on him and known to none, is Gabriel come to teach religion", cluster: angels}
  chest-opened-while-playing-with-boys: {label: "Gabriel comes to the boy playing with other boys, throws him down, splits his chest and takes out his heart", cluster: sira}
  subbuh-quddus-lord-of-angels-and-spirit: {label: "In bowing and prostration: 'all-glorious, all-holy (subbuh quddus), Lord of the angels and the Spirit'", cluster: ritual}
  poetry-recited-in-mosque-umar-glares: {label: "Umar glares at Hassan reciting poetry in the mosque; Hassan: I recited here when one better than you was in it", cluster: sira}
  gabriel-leads-five-prayers-to-fix-times: {label: "Gabriel comes down and prays, the prophet praying with him, five times: 'with this I was commanded'", cluster: ritual}
  governor-rebuked-for-delaying-prayer: {label: "A companion rebukes a governor (al-Mughira; Umar b. Abd al-Aziz in turn) for delaying the prayer, citing Gabriel's fixing of the times", cluster: ritual}
  quran-reviewed-twice-in-last-year-sign-of-death: {label: "Gabriel reviewed the Quran with him once a year, twice in his last year: 'I see my term has come'", cluster: revelation}
  fatima-lady-of-women-of-paradise: {label: "Fatima is the lady (sayyida) of the women of paradise (or of the believing women)", cluster: sira}
  quran-in-seven-modes-by-asking-more: {label: "Gabriel taught him in one mode; he kept asking for more and was given more until seven modes (ahruf)", cluster: revelation}
  mans-fluid-white-thick-womans-yellow-thin: {label: "The man's fluid is white and thick, the woman's yellow and thin; whichever prevails, the child and likeness are its", cluster: polemic}
  gabriel-guardian-of-every-prophet: {label: "'My guardian (wali) is Gabriel; God never sent a prophet but he was his guardian'; the Jews: he is our enemy", cluster: angels}
  adjured-by-him-who-sent-torah-to-moses: {label: "The prophet adjures the Jews 'by Him who sent down the Torah to Moses, do you know...?' and they answer 'O God, yes'", cluster: polemic}
  covenant-as-jacob-took-from-his-sons: {label: "The prophet asks the Jews for God's pledge 'and what Jacob took from his sons' that they will follow him if they recognise his answers", cluster: polemic}
  gabriel-greets-aisha-she-sees-not: {label: "'Aisha, this is Gabriel greeting you'; she returns the greeting: 'you see what I do not see'", cluster: angels}
  angel-first-descent-tidings-fatima-hasan-husayn: {label: "An angel who never came down to earth before asks his Lord leave to greet the prophet with tidings of Fatima and of Hasan and Husayn", cluster: angels}
  paradise-for-monotheist-even-if-thief-and-adulterer: {label: "Gabriel brings tidings that whoever dies associating nothing with God enters paradise - 'even if he stole and fornicated?' - 'even if'", cluster: theology}
  two-guides-name-themselves-gabriel-and-michael: {label: "The two men of the dream explain: the one kindling the fire is Malik keeper of the fire, 'I am Gabriel, and this is Michael'", cluster: angels}
  two-men-take-prophet-to-holy-land-in-dream: {label: "In a dream two men take him by the hand and bring him out to the holy land", cluster: dreams}
  who-saw-a-dream-last-night: {label: "After a prayer he turns to them: 'who of you saw a dream last night?'", cluster: dreams}
  munkar-and-nakir-black-and-blue: {label: "At burial two black-blue angels come, one named al-Munkar, the other al-Nakir", cluster: eschatology}
  grave-question-what-did-you-say-of-this-man: {label: "The two grave angels ask the dead: 'what did you say of this man?'", cluster: eschatology}
  keeper-of-paradise-opens-first-for-muhammad: {label: "At paradise's gate the keeper asks 'who are you?' - 'Muhammad' - 'for you I was commanded to open to none before you'", cluster: eschatology}
  god-wrote-torah-for-moses-with-his-hand: {label: "God 'wrote for you with his hand' (wrote you the Torah with his hand), Adam says to Moses", cluster: revelation}
  hand-covers-the-verse-of-stoning: {label: "Reading the opened Torah a Jew puts his hand over the verse of stoning and reads around it; 'lift your hand' - it is there", cluster: polemic}
  torah-penalty-said-to-be-exposure-and-flogging: {label: "Asked what the Torah says on stoning, the Jews say 'we expose them and they are flogged'", cluster: polemic}
  man-bends-over-woman-to-shield-her-from-stones: {label: "At the stoning the man bends over the woman to shield her from the stones", cluster: law}
  wife-consoles-you-join-kin-bear-burdens: {label: "His wife consoles him: 'God will never disgrace you: you join ties of kin, carry the burdened, earn for the destitute, honour the guest and help in true calamities'", cluster: sira}
  first-sura-revealed-iqra: {label: "The first sura sent down was 'Recite in the name of your Lord who created'", cluster: revelation}
  quran-sent-whole-to-lowest-heaven-on-night-of-decree: {label: "The Quran was sent down all at once to the lowest heaven on the Night of Decree, then sent down in parts", cluster: revelation}
  quran-placed-in-house-of-might-twenty-fourth-ramadan: {label: "The Quran came down whole on the twenty-fourth night of Ramadan and was placed in the House of Might (bayt al-ʿizza)", cluster: revelation}
  sent-down-by-positions-of-the-stars: {label: "The Quran was at the positions of the stars (mawaqiʿ al-nujum) and sent down part after part over months and days", cluster: revelation}
  revealed-when-god-willed-to-bring-about-a-thing: {label: "Whenever God willed to bring something about on earth he sent down part of it, until he had gathered it", cluster: revelation}
  quran-like-hobbled-camels: {label: "The holder of the Quran is like the owner of hobbled camels: watch them and he keeps them, let them go and they wander off", cluster: revelation}
  write-it-in-tongue-of-quraysh: {label: "If you differ with Zayd over any Arabic of the Quran, write it in the tongue of Quraysh, for it came down in their tongue (al-tabut, not al-tabuh)", cluster: revelation}
  hudhayfa-alarmed-by-differing-readings: {label: "Hudhayfa, alarmed at the troops' differing readings in Armenia and Azerbaijan, urges Uthman to act before they differ over the Book as Jews and Christians did", cluster: revelation}
  sheets-borrowed-from-hafsa-and-returned: {label: "Uthman borrows the sheets (suhuf) from Hafsa to copy into codices and returns them to her", cluster: revelation}
  codex-sent-to-each-region-others-burned: {label: "A copied codex is sent to every region and all other written Quran sheets and codices are ordered burned", cluster: revelation}
  learn-quran-from-four-named-companions: {label: "Learn the Quran from four: Ibn Masud, Salim the client of Abu Hudhayfa, Ubayy b. Kab and Muadh b. Jabal", cluster: revelation}
  four-ansar-collected-the-quran: {label: "Four men, all of the Ansar, collected the Quran in the prophet's lifetime: Ubayy, Muadh, Zayd b. Thabit and Abu Zayd (or Abu l-Darda')", cluster: revelation}
  drowsy-night-reciter-should-lie-down: {label: "If at night the Quran grows confused on the tongue and he does not know what he says, let him lie down", cluster: ritual}
  no-travel-with-quran-to-enemy-land: {label: "Do not travel with the Quran into enemy land, lest the enemy get hold of it", cluster: law}
  prophet-believed-by-only-one-man: {label: "There is a prophet whom only one man of his community believed", cluster: prophecy}
  first-intercessor-in-paradise: {label: "'I am the first intercessor in paradise; no prophet was believed as I was believed'", cluster: eschatology}
  prophet-taken-first-as-forerunner-of-community: {label: "When God wills mercy on a community he takes its prophet before it, as its forerunner (farat) and predecessor", cluster: prophecy}
  nation-destroyed-before-its-prophets-eyes: {label: "When God wills a community's ruin he punishes it while its prophet lives, delighting his eye with their ruin for denying him", cluster: prophecy}
  prophets-alive-in-graves-praying: {label: "The prophets are alive in their graves, praying", cluster: prophecy}
  friday-adam-created-and-taken-trumpet-and-swoon: {label: "Friday: on it Adam was created and taken, on it the trumpet blast and the swoon; increase blessings on me then, for they are presented to me", cluster: ritual}
  lay-down-after-dawn-prayer-and-snored: {label: "After the dawn prayer he lay down until he breathed heavily; 'my eyes sleep, my heart does not'", cluster: prophecy}
  severest-punishment-prophet-killer-misleading-imam-image-maker: {label: "Most severely punished at resurrection: a man a prophet killed or who killed a prophet, an imam of misguidance, and an image-maker (mumaththil)", cluster: eschatology}
  palm-pollination-advice-crop-fails: {label: "The prophet doubts that pollinating the palms helps; they stop, and the crop fails (yields bad dates)", cluster: sira}
  you-know-your-worldly-affairs-best: {label: "'I only supposed; do not hold me to a supposition; when I tell you something from God take it' - 'you know best the affairs of your world'", cluster: prophecy}
  jesus-leads-prayer-says-god-killed-dajjal: {label: "Jesus descends and leads the people; raising his head from bowing he says 'God hears who praises him; God has killed the Dajjal'", cluster: eschatology}
  dajjal-spreads-forty-days-from-east: {label: "The one-eyed Dajjal comes from the east in a time of division and reaches what God wills of the earth in forty days, 'God knows their measure'", cluster: eschatology}
  take-my-servants-up-to-the-mount: {label: "God tells Jesus: I have brought out servants none can fight; take my servants up to al-Tur", cluster: eschatology}
  who-says-my-lord-is-god-is-safe-from-dajjal: {label: "Whoever tells the Dajjal 'you are my Lord' is tempted; whoever says 'my Lord is God' until death is protected", cluster: eschatology}
  band-raiding-india-and-band-with-jesus: {label: "Two bands of the community God has guarded from the fire: one that raids India and one that will be with Jesus son of Mary", cluster: eschatology}
  jewish-boy-born-with-wiped-eye: {label: "A Jewish woman of Medina bears a boy with one eye wiped and the other protruding; the prophet fears he is the Dajjal", cluster: eschatology}
  jesus-follows-muhammads-way: {label: "Jesus descends confirming Muhammad and on his religion (milla), a guided imam and just judge", cluster: eschatology}
  convey-my-greeting-to-jesus: {label: "'Whoever of you meets Jesus son of Mary, convey my greeting to him'", cluster: eschatology}
  jesus-will-greet-at-the-prophets-grave: {label: "Jesus will come to the prophet's grave and greet him, and he will answer", cluster: eschatology}
  prayer-gathered-for-him-cross-effaced: {label: "At Jesus's descent the cross is effaced, the prayer gathered for him, and he goes on pilgrimage from al-Rawha", cluster: eschatology}
  who-hears-of-him-and-disbelieves-is-in-fire: {label: "No Jew or Christian of this community hears of me and dies without believing in my message but is of the people of the fire", cluster: theology}
  prophet-while-adam-between-spirit-and-body: {label: "'When were you written a prophet?' - 'While Adam was between spirit and body'", cluster: prophecy}
  prophet-dearer-than-father-son-and-all-people: {label: "None of you believes until I am dearer to him than his father, his son and all people", cluster: ethics}
  blessed-thrice-who-believed-without-seeing: {label: "'Tuba' once for him who saw and believed, three times for him who believed without seeing", cluster: ethics}
  riders-recognised-as-kinda-and-madhhij: {label: "Seeing two riders approach he says 'Kindis, Madhhijis', and they prove to be of Madhhij", cluster: sira}
  later-believers-who-never-saw-him: {label: "'Is anyone better than us?' - 'yes, a people after you who believe in me without seeing me'", cluster: ethics}
  prayer-little-world-for-believer-much-for-denier: {label: "Prayer: for whoever believes and testifies, make your meeting dear, your decree easy and the world little; for whoever does not, the reverse and much of the world", cluster: ethics}
  israel-governed-by-prophets-now-caliphs: {label: "The Israelites were governed by prophets, each succeeded by another; after me no prophet, but many caliphs", cluster: prophecy}
  fulfil-pledge-to-first-then-first: {label: "Fulfil the pledge to the first, then the next first; give the rulers their due, for God will ask them about what he entrusted to them", cluster: law}
  last-prophet-last-mosque: {label: "'I am the last of the prophets and my mosque the last of the mosques'; a prayer in it better than a thousand elsewhere but the Sacred Mosque", cluster: prophecy}
  seal-is-hair-gathered-on-shoulder: {label: "Asked to rub his back a companion feels the seal between his fingers: 'hair gathered on his shoulder'", cluster: prophet-body}
  seeker-recognises-prophet-by-the-seal: {label: "Salman looks at the seal on the prophet's back and believes", cluster: prophet-body}
  seal-a-raised-piece-of-flesh: {label: "The seal of prophethood was a raised piece of flesh on his back", cluster: prophet-body}
  throne-of-merciful-shook-for-sad: {label: "'The throne of the Merciful shook' at the death of Sa'd b. Mu'adh", cluster: sira}
  lifts-curtain-on-rows-behind-abu-bakr: {label: "In his last illness he lifts the curtain on the people in rows behind Abu Bakr", cluster: sira}
  no-quran-in-bowing-or-prostration: {label: "'I was forbidden to recite the Quran bowing or prostrating; in bowing magnify the Lord, in prostration strive in prayer'", cluster: ritual}
units:
  - id: hadith-2-dajjal-isfahan-medina-gates-angels
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "The Dajjal from the Jewry of Isfahan; Medina's seven gates with two angels each; the Day of Deliverance and the three tremors"
    read: ["Jāmiʿ 2:438.1-439.1"]
    tags:
      - {motif: dajjal-from-jewry-of-isfahan, refs: ["Jāmiʿ 2:438.1"], note: "إنّه يخرج في يهودية أصبهان حتى يأتي المدينة"}
      - {motif: medina-seven-gates-two-angels-each, refs: ["Jāmiʿ 2:438.1"], note: "ولها يومئذ سبعة أبواب، على كلّ نقبٍ منها ملكان"}
      - {motif: dajjal-one-eyed-god-not, refs: ["Jāmiʿ 2:438.1"], note: "فإنّ ربّكم ﷿ ليس بأعور"}
      - {motif: dajjal-on-uhud-white-palace-mosque-of-ahmad, refs: ["Jāmiʿ 2:438.2"], note: "يجيءُ الدّجّال فيصعدُ أحدًا فينظر إلى المدينة فيقول لأصحابه: أترون هذا القصر الأبيض؟ هذا مسجد أحمد"}
      - {motif: medina-quakes-three-times-expels-hypocrites, refs: ["Jāmiʿ 2:438.2"], note: "فيأتي سبخة الجرف فيضرب رواقَه، ثم ترجف المدينة ثلاث رَجَفات، فلا يبقى منافق ولا منافقة ... إلّا خرج إليه. فذلك يومُ الخلاص"}
      - {motif: angels-with-drawn-swords-at-passes, refs: ["Jāmiʿ 2:438.2"], note: "فيجد بكلّ نقْب منها ملكًا مصلْتًا"}
      - {motif: angels-guard-gates-of-mecca-and-medina, refs: ["Jāmiʿ 2:439.1"], note: "إنّ الدّجال يرد كلّ ماء ومنهل إلّا المدينة ومكّة، حرّمهما اللَّه عليه، وقامت الملائكةُ بأبوابها"}
  - id: hadith-2-killer-of-hundred-angels-dispute
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: "The killer of a hundred who set out to repent; the angels of mercy and punishment dispute him; the lands are measured"
    read: ["Jāmiʿ 2:439.2"]
    tags:
