      - {motif: more-beloved-than-yourself-now-umar, refs: ["Jāmiʿ 2:541.3"], note: "لأنت أحبُّ إليَّ من كلَّ شيء إلّا من نفسي ... لا والذي نفسي بيده، حتى أكونَ أحبَّ إليك من نفسك ... الآن يا عمر"}
      - {motif: taste-of-faith-content-with-god-islam-muhammad, refs: ["Jāmiʿ 2:541.4"], note: "ذاق طَعْم الإيمان من رضي باللَّه ربًّا، وبالإسلام دينًا، وبمحمّد رسولًا"}
  - id: hadith-2-with-whom-you-love
