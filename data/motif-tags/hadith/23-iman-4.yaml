      - {motif: rome-at-amaq-or-dabiq-thirds, refs: ["Jāmiʿ 2:510.2"], note: "حتى ينزل الرُّومُ بالأعماقِ أو بدابق ... فينهزمُ ثلثٌ لا يتوب اللَّه عليهم أبدًا، ويُقتل ثلثُهم أفضل الشّهداء"}
      - {motif: swords-hung-on-olive-trees, refs: ["Jāmiʿ 2:510.2"], note: "قد عَلّقوا سيوفَهم بالزّيتون إذْ صاح فيهم الشّيطان إنّ المسيحَ قد خلفكم في أهليكم"}
      - {motif: dajjal-melts-like-salt-at-jesus, refs: ["Jāmiʿ 2:510.2"], note: "فإذا رآه عدُوُّ اللَّه ذاب كما يذوبُ الملح في الماء"}
      - {motif: jesus-shows-dajjals-blood-on-spear, refs: ["Jāmiʿ 2:510.2"], note: "ولكنْ يَقْتُلُه اللَّهُ بيده، فَيُريهمْ دَمَهُ في حَرْبَتِه"}
      - {motif: your-imam-from-among-you, refs: ["Jāmiʿ 2:511.1"], note: "كيف أنتم إذا نزل ابنُ مريم، وإمامُكم منكم"}
      - {motif: jesus-leads-prayer-says-god-killed-dajjal, refs: ["Jāmiʿ 2:511.2"], note: "ثم ينزل عيسى ابن مريم ﷺ من السماء، فيؤمُّ النّاس، فإذا رفع رأسه من ركعته قال: سمع اللَّه لمن حمده، قتل اللَّه المسيح الدّجال"}
      - {motif: dajjal-spreads-forty-days-from-east, refs: ["Jāmiʿ 2:511.2"], note: "يخرجُ أعورُ الدّجال مسيح الضّلالة قبل المشرق ... في أربعين يومًا، اللَّه أعلم ما مقدارها"}
      - {motif: jesus-medium-reddish-white-head-drips-dry, refs: ["Jāmiʿ 2:512.1"], note: "رجل مربوع إلى الحمرة والبياض بين ممصرَّتين، كأن رأسه يقطر وإن لم يصبه بلل"}
      - {motif: god-destroys-all-religions-but-islam, refs: ["Jāmiʿ 2:512.1"], note: "فيقاتل النّاس على الإسلام ... ويُهلك اللَّهُ في زمانه المللَ كلَّها إِلَّا الإسلام"}
      - {motif: jesus-remains-forty-years-then-dies, refs: ["Jāmiʿ 2:512.1"], note: "فيمكث في الأرض أربعين سنة، ثم يتوفّى فيصلي عليه المسلمون"}
    hints:
      - "Peace in Jesus' time in the fuller version (lions with camels, children with snakes, in the commentary), against Isa 11:6-8."
  - id: hadith-2-nawwas-dajjal-jesus-gog-magog
