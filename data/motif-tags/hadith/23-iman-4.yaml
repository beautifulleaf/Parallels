      - {motif: friday-adam-created-and-taken-trumpet-and-swoon, refs: ["Jāmiʿ 2:502.3"], note: "إنّ من أفضل أيامكم يومَ الجمعة، فيه خلق آدم، وفيه قبض، وفيه النفخة، وفيه الصعقة"}
