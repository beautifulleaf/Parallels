      - {motif: nation-destroyed-before-its-prophets-eyes, refs: ["Jāmiʿ 2:501.3"], note: "وإذا أراد هلكة أمةٍ عذَّبها، ونبيها حيّ، فأقر عينه بهلكتها حين كذبوه"}
