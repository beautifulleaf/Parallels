      - {motif: jesus-will-greet-at-the-prophets-grave, refs: ["Jāmiʿ 2:533.2"], note: "وليأتينّ قبري حتى يسلّم عليَّ ولأردنَّ عليه"}
  - id: hadith-2-nearest-to-jesus-sons-of-one-father
