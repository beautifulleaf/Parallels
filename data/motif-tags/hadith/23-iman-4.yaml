      - {motif: riders-recognised-as-kinda-and-madhhij, refs: ["Jāmiʿ 2:542.3"], note: "طَلَعَ رَكبان، فلمّا رآهما قال: كِنْدِيَّان مَذْحِجِيَّان"}
      - {motif: later-believers-who-never-saw-him, refs: ["Jāmiʿ 2:543.1"], note: "هل أحد خير منا؟ أسلمنا معك وجاهدنا معك، قال: نعم، قوم يكونون من بعدكم يؤمنون بي ولم يروني"}
    hints:
      - "'Blessed are those who have not seen and yet have believed', against John 20:29."
  - id: hadith-2-prayer-for-who-testifies
