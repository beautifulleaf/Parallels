    quran: ["46:29-30", "72:1", "6:130"]
    tags:
      - {motif: jinn-search-east-and-west-for-cause, refs: ["Jāmiʿ 2:538.1"], note: "وقد حيل بين الشياطين وبين خبر السماء ... فانطلقوا يضربون مشارق الأرض ومغاربها"}
      - {motif: jinn-hear-quran-at-dawn-prayer, refs: ["Jāmiʿ 2:538.1"], note: "فمر النفر الذين أخذوا نحو تهامة -وهو بنخل- ... وهو يصلي بأصحابه صلاة الفجر- فلما سمعوا القرآن استمعوا له، وقالوا: هذا الذي حال بيننا وبين خبر السماء"}
      - {motif: bones-and-dung-food-of-jinn, refs: ["Jāmiʿ 2:538.2"], note: "هما من طعام الجن، وإنه أتاني وفد جن نصيبين ... فدعوت اللَّه لهم أن لا يمروا بعظمٍ ولا بروثةٍ إلا وجدوا عليها طعامًا"}
      - {motif: prophet-taken-by-summoner-of-the-jinn, refs: ["Jāmiʿ 2:538.3"], note: "أتاني داعي الجن فذهبت معه، فقرأت عليهم القرآن، قال: فانطلق بنا فأرانا آثارهم وآثار نيرانهم"}
  - id: hadith-2-prophet-when-adam-between-spirit-and-body
