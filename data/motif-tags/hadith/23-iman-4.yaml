      - {motif: quran-placed-in-house-of-might-twenty-fourth-ramadan, refs: ["Jāmiʿ 2:488.1"], note: "أنزل القرآن جملة من الذّكر في ليلة أربع وعشرين من رمضان، فجُعل في بيت العزّة"}
      - {motif: revelation-sent-piecemeal, refs: ["Jāmiʿ 2:488.2", "Jāmiʿ 2:490.1"], note: "ثم نزل بعد ذلك بعشرين سنة: وَلَا يَأْتُونَكَ بِمَثَلٍ إِلَّا جِئْنَاكَ بِالْحَقِّ"}
      - {motif: sent-down-by-positions-of-the-stars, refs: ["Jāmiʿ 2:489.1", "Jāmiʿ 2:489.2"], note: "فكان بموقع النّجوم، فكان اللَّه ينزل على رسوله بعضه إثر بعض; ثم أنزل على مواقع النّجوم رتلا في الشهور والأيام"}
      - {motif: revealed-when-god-willed-to-bring-about-a-thing, refs: ["Jāmiʿ 2:488.3"], note: "فكان اللَّه إذا أراد أن يُحدث في الأرض شيئًا أنزله منه حتى جمعه"}
