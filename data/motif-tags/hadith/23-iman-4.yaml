      - {motif: do-not-prefer-among-prophets-moses-at-throne, refs: ["Jāmiʿ 2:505.4", "Jāmiʿ 2:505.5"], note: "لا تخيّروني على موسى; لا تخيّروا بين الأنبياء"}
