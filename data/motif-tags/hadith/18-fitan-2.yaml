    read: ["Jāmiʿ 65:8489.1-8489.3"]
    tags:
      - {motif: dajjal-head-hubuk-thrice, refs: ["Jāmiʿ 65:8489.1"], note: "إن من بعدكم الكذاب المضل، وإن رأسه من بعده حُبُكٌ حُبُكٌ حُبُكٌ -ثلاث مرات-"}
      - {motif: formula-against-dajjal-our-lord-is-god, refs: ["Jāmiʿ 65:8489.1"], note: "فمن قال: لستَ ربنا، لكن ربنا اللَّه، عليه توكلنا، وإليه أنبنا، نعوذ باللَّه من شرِّكَ، لم يكن له عليه سلطان"}
      - {motif: dajjal-eye-like-green-glass, refs: ["Jāmiʿ 65:8489.2"], note: "إحدى عينيه كأنها زجاجة خضراء، وتعوذوا باللَّه ﵎ من عذاب القبر"}
      - {motif: rumour-at-kufa-dajjal-out-lie-of-dyer, refs: ["Jāmiʿ 65:8489.3"], note: "هذا الدجال قد خرج وأهل الكوفة يطاعنونه ... فنودي أنها كذبة صباغ"}
      - {motif: children-would-pelt-dajjal, refs: ["Jāmiʿ 65:8489.3"], note: "إن الدجال لو خرج في زمانكم لرمته الصبيان بالخذف"}
      - {motif: earth-folded-for-dajjal-like-ram-fleece, refs: ["Jāmiʿ 65:8489.3"], note: "فتطوى له الأرض طي فروة الكبش"}
      - {motif: only-donkey-serves-dajjal-filth-on-filth, refs: ["Jāmiʿ 65:8489.3"], note: "ولا يسخر له من المطايا إلا الحمار فهو رجس على رجس"}
      - {motif: be-like-ibn-labun-no-back-no-udder, refs: ["Jāmiʿ 65:8489.3"], note: "فكن كابن اللبون لا ظهر فيركب ولا ضرع فيحلب"}
  - id: hadith-65-samura-dajjal-heals
