# Hadith chunk 18: al-Jāmiʿ al-Kāmil book 65 (al-fitan wa-ashrāṭ al-sāʿa), pp. 8415-8525 (printed 12/328-438):
# the last bābs of the trials (nations falling on Islam, word of truth before a tyrant, renewers), then the
# minor signs of the Hour (bābs 1-43), then the ten major signs (smoke, Dajjal with the Jassāsa and Ibn Ṣayyād,
# the Beast, the sun from the west, the descent of Jesus with the Mahdī, Gog and Magog, three sinkings, the fire
# that drives people). Read in full from the Arabic (248 hadith). Many hadith recur under several bābs; each
# recurrence is read where it stands and tagged where the bāb makes it bear on a new point.
new_motifs:
  nations-call-each-other-like-eaters-to-bowl: {label: "The nations will call one another against the believers as eaters call one another to their bowl", cluster: eschatology}
  many-but-froth-of-the-torrent: {label: "The believers will be many then, but froth like the froth of a torrent; awe of them is taken from enemies' hearts", cluster: eschatology}
  wahn-love-of-life-dislike-of-death: {label: "Weakness (al-wahn) cast in hearts is defined as love of life and dislike of death", cluster: ethics}
  muslims-besieged-back-to-medina-outpost-at-salah: {label: "The Muslims will be driven back to Medina until their farthest outpost is at Salāḥ", cluster: eschatology}
  mawali-army-raised-in-great-wars: {label: "When the great wars (al-malāḥim) come God raises an army of the freedmen (mawālī), the best horsemen and best armed of the Arabs", cluster: warfare}
  punishment-strikes-all-then-raised-by-deeds: {label: "When God's punishment falls on a people it strikes all among them; then they are raised according to their deeds (or intentions)", cluster: eschatology}
  best-jihad-word-of-truth-before-tyrant: {label: "The best jihad is a word of truth (or justice) before an unjust ruler", cluster: ethics}
  question-answered-after-third-pillar: {label: "Asked at the first and second pillars, the prophet is silent, and answers after stoning the third, foot in the stirrup", cluster: ritual}
  believer-must-not-abase-himself-with-unbearable-trial: {label: "A believer must not abase himself by exposing himself to a trial he cannot bear", cluster: ethics}
  renewer-at-head-of-each-century: {label: "God sends this community at the head of every hundred years one who renews its religion", cluster: eschatology}
  questioner-told-hour-beyond-his-lifetime: {label: "Bedouins ask when the Hour is; looking at the youngest, the prophet says old age will not reach him before your Hour comes", cluster: eschatology}
  you-are-with-whom-you-love: {label: "A bedouin who prepared only love of God and his messenger for the Hour is told: you are with whom you love", cluster: ethics}
  hasten-deeds-before-six-signs: {label: "Hasten to good deeds before six: the Dajjal, the smoke, the Beast of the earth, the sun rising from the west, the general affair, and one's own private affair", cluster: eschatology}
  hour-strikes-mid-trade-mid-meal: {label: "The Hour strikes while two men have spread a cloth between them unsold, a man carries home his camel's milk undrunk, one plasters his trough, one lifts a morsel to his mouth", cluster: eschatology}
  rich-man-cannot-find-taker-for-alms: {label: "Wealth floods until the owner worries who will take his alms, and the one offered it says 'I have no need of it'", cluster: eschatology}
  man-passes-grave-wishes-he-were-in-it: {label: "A man passes another's grave and says 'would that I were in his place'", cluster: eschatology}
  six-before-the-hour-counted-on-the-hand: {label: "'Count six before the Hour': my death, the conquest of Jerusalem, a mass death like the murrain of sheep, wealth until a hundred dinars displease, a trial entering every Arab house, a truce with the Banū l-Aṣfar who betray it", cluster: eschatology}
  eighty-banners-twelve-thousand-each: {label: "The Romans come under eighty banners, under each banner twelve thousand", cluster: warfare}
  sent-with-the-hour-like-two-fingers: {label: "'I and the Hour were sent like these two', joining the index and middle fingers", cluster: eschatology}
  hour-nearly-outran-the-prophet: {label: "'I was sent with the Hour, and it nearly outran me'; like two racehorses", cluster: eschatology}
  scout-waves-his-garment-you-are-attacked: {label: "The prophet as the scout sent by his people who, fearing to be overtaken, waves his garment: 'you are attacked, you are attacked'", cluster: eschatology}
  world-left-like-the-rest-of-a-day-at-sunset: {label: "What remains of the world against what has passed is like what remains of this day, as the sun is setting", cluster: eschatology}
  communities-time-like-asr-to-sunset: {label: "Your term among the communities is like the time between the afternoon prayer and sunset", cluster: eschatology}
  death-like-sheep-murrain: {label: "A mass death will take you like the qu'ās of sheep", cluster: eschatology}
  trials-like-pieces-of-dark-night: {label: "Before the Hour are trials like pieces of the dark night: a man is a believer at morning and an unbeliever by evening", cluster: eschatology}
  trust-lost-when-affairs-given-to-unfit: {label: "When trust is lost await the Hour: when authority is given to those not fit for it", cluster: ethics}
  people-like-hundred-camels-hardly-a-mount: {label: "People are like a hundred camels among which you hardly find one fit to ride", cluster: wisdom}
  trust-lifted-in-sleep-leaves-blister: {label: "Trust is taken from the heart during sleep, leaving a trace like a blister, like an ember rolled on the foot that swells with nothing inside", cluster: ethics}
  trust-came-down-in-root-of-hearts: {label: "Trust came down into the root (jadhr) of men's hearts, then the Quran came down", cluster: revelation}
  harj-is-killing: {label: "Al-harj, which will multiply before the Hour, is explained: killing, killing", cluster: eschatology}
  killer-and-killed-know-not-why: {label: "A day comes when the killer does not know why he killed nor the killed why he was killed; both are in the fire", cluster: eschatology}
  time-contracts-before-hour: {label: "Time draws together before the Hour: a year like a month, a month like a week, a week like a day, a day like an hour, an hour like the burning of a palm frond", cluster: eschatology}
  markets-draw-near: {label: "Before the Hour the markets draw near to one another", cluster: eschatology}
  many-reciters-few-jurists: {label: "A time when reciters are many and jurists few, then men recite the Quran that goes no deeper than their throats, then the hypocrite disputes with the believer", cluster: eschatology}
  arabia-returns-to-meadows-and-rivers: {label: "The land of the Arabs will return to meadows and rivers, and a rider will go between Iraq and Mecca fearing only to lose his way", cluster: eschatology}
  silk-wine-music-made-lawful-then-transformed: {label: "People of the community will make lawful fornication, silk, wine and musical instruments; some camping by a hill put off a poor man and are destroyed in the night, others are transformed into apes and swine", cluster: eschatology}
  fifty-women-one-guardian: {label: "Men go and women remain until fifty women have one man to look after them", cluster: eschatology}
  minds-taken-dust-of-people-left: {label: "In that time most people's minds are removed, and a dust (habāʾ) of people without minds is left", cluster: eschatology}
  mating-in-the-road-like-donkeys: {label: "Before the Hour people will copulate in the road as donkeys copulate", cluster: eschatology}
  best-says-hide-her-behind-the-wall: {label: "When a man takes a woman in the road, the best of them is the one who says 'if only you had hidden her behind this wall'", cluster: eschatology}
  usury-fornication-wine-appear: {label: "Before the Hour usury, fornication and wine appear", cluster: eschatology}
  no-care-whether-wealth-lawful: {label: "A time when a man does not care whether he takes wealth from the lawful or the unlawful", cluster: ethics}
  greeting-only-for-acquaintance: {label: "A sign of the Hour: a man greets another only because he knows him (taslīm al-khāṣṣa)", cluster: ethics}
  wife-helps-husband-in-trade-pen-spreads: {label: "Before the Hour trade spreads until the wife helps her husband in it, ties of kin are cut, the pen spreads, false witness appears and true witness is hidden", cluster: eschatology}
  seller-consults-merchant-scribe-not-found: {label: "A man will not sell until he consults the merchant of a clan, and in a great quarter a scribe is sought and not found", cluster: eschatology}
  deceptive-years-ruwaybida-speaks: {label: "Before the Hour come deceptive years: the truthful called liar, the liar believed, the trustworthy called traitor, and al-ruwaybiḍa speaks: the fool talking on public affairs", cluster: eschatology}
  vying-in-mosques: {label: "The Hour will not come until people vie with one another over mosques", cluster: eschatology}
  houses-striped-like-cloaks: {label: "People will build houses and adorn them like striped cloaks (marāḥil)", cluster: eschatology}
  knowledge-sought-from-the-young: {label: "A sign of the Hour: knowledge is sought from the young (al-aṣāghir)", cluster: eschatology}
  tribes-join-idolaters-and-worship-idols: {label: "Tribes of the community will join the idolaters and worship idols before the Hour", cluster: eschatology}
  women-of-daws-hips-sway-at-dhul-khalasa: {label: "The hips of the women of Daws will sway again around Dhū l-Khalaṣa, the idol of Daws", cluster: idolatry}
  thirty-liars-claim-prophethood: {label: "About thirty lying dajjāls, each claiming to be God's messenger (a prophet); 'I am the seal of the prophets, no prophet after me'", cluster: eschatology}
  twenty-seven-liars-four-women: {label: "Liars and dajjāls in the community: twenty-seven, four of them women", cluster: eschatology}
  liars-named-yamama-sana-himyar: {label: "Among the liars before the Hour: the man of al-Yamāma, the man of Ṣanʿāʾ, the man of Ḥimyar, and the Dajjāl the greatest trial", cluster: eschatology}
  slave-girl-bears-her-master: {label: "A sign: the slave-woman gives birth to her lord (or mistress)", cluster: eschatology}
  barefoot-naked-shepherds-vie-in-building: {label: "A sign: the barefoot, naked, destitute shepherds of sheep compete in tall buildings and become heads of people", cluster: eschatology}
  five-known-only-to-god: {label: "The Hour is among five things known only to God; the prophet recites the verse on the five", cluster: theology}
  world-ends-with-lukaa-son-of-lukaa: {label: "The world will not pass until the happiest in it is lukaʿ son of lukaʿ (the base son of the base)", cluster: eschatology}
  best-man-believer-between-two-noble: {label: "The best of people is a believer between two noble (parents)", cluster: ethics}
  alms-refused-had-you-come-yesterday: {label: "A man walks with his alms and the recipient says 'had you brought it yesterday I would have taken it; today I have no need'", cluster: eschatology}
  earth-vomits-pillars-of-gold-and-silver: {label: "The earth vomits up its liver-pieces like pillars of gold and silver; the killer, the kin-breaker and the thief come, say 'for this I...', and leave it untouched", cluster: eschatology}
  euphrates-uncovers-mountain-of-gold: {label: "The Euphrates will uncover a mountain (treasure) of gold; whoever is present should take nothing of it", cluster: eschatology}
  ninety-nine-of-hundred-killed-over-gold: {label: "People fight over the Euphrates gold and ninety-nine of every hundred are killed, each hoping he is the survivor", cluster: eschatology}
  wolf-rebukes-shepherd-for-taking-its-provision: {label: "A wolf sitting on its tail rebukes the shepherd: 'do you not fear God? You take from me provision God sent me'", cluster: animals}
  wolf-tells-of-prophet-at-yathrib: {label: "The speaking wolf tells the shepherd of something more wonderful: a man at Yathrib telling the news of what has passed (and what will be)", cluster: animals}
  beasts-speak-whip-and-sandal-report-family: {label: "The Hour will not come until beasts of prey speak to men and a man's whip-tip, sandal-strap or thigh tells him what his family did after him", cluster: eschatology}
  cow-says-created-for-ploughing: {label: "A cow loaded by her driver turns and says 'I was not created for this, but for ploughing'", cluster: animals}
  i-believe-it-with-abu-bakr-and-umar: {label: "To people's amazement at a speaking beast the prophet says 'I believe it, I, Abū Bakr and ʿUmar'", cluster: sira}
  medina-better-for-them-if-they-knew: {label: "A man calls his cousin away to ease, but Medina is better for them; none leaves it from aversion but God replaces him with better", cluster: medina}
  buildings-reach-sal-leave-for-qudaa: {label: "When you see building rise over Salʿ, go to the Arabs, the land of Quḍāʿa", cluster: eschatology}
  dwellings-reach-ihab: {label: "The dwellings (of Medina) will reach Ihāb (or Yahāb)", cluster: eschatology}
  medina-left-to-wild-beasts-and-birds: {label: "Medina will be left at its best to the scavenging beasts and birds (al-ʿawāfī)", cluster: eschatology}
  last-gathered-two-muzayna-shepherds: {label: "The last to be gathered are two shepherds of Muzayna heading to Medina, calling their flocks; they find it wild and fall on their faces at Thaniyyat al-Wadāʿ", cluster: eschatology}
  bad-dates-hung-as-alms: {label: "The prophet pokes with his staff a cluster of bad dates hung as alms in the mosque: its owner will eat bad dates on resurrection day", cluster: ethics}
  medina-left-forty-years-to-scavengers: {label: "'People of Medina, you will leave it forty years to the scavengers' (birds and beasts; the Persians' karākī)", cluster: eschatology}
  two-great-parties-one-claim: {label: "Two great parties will fight with a great slaughter between them, their claim one", cluster: eschatology}
  turks-small-eyes-shield-faces-hair-sandals: {label: "You will fight the Turks: small-eyed, red-faced, flat-nosed, their faces like hammered shields, wearing hair and walking in sandals of hair", cluster: eschatology}
  khuz-and-kirman-fought: {label: "You will fight Khūz and Kirmān of the Persians: red-faced, flat-nosed, small-eyed, faces like hammered shields, sandals of hair", cluster: eschatology}
  eyes-like-locust-eyes-horses-tied-to-palms: {label: "A people with eyes like the eyes of locusts, faces like hammered shields, who take leather shields and tie their horses to the palms", cluster: eschatology}
  qahtani-drives-people-with-staff: {label: "A man of Qaḥṭān will come out driving people with his staff", cluster: eschatology}
  king-named-jahjah: {label: "A man called al-Jahjāh, one of the freedmen, will rule", cluster: eschatology}
  four-words-counted-on-hand: {label: "A companion who stood guard between the prophet and strangers memorised four words, counting them on his hand", cluster: sira}
  conquests-arabia-persia-rome-dajjal: {label: "You will raid Arabia, Persia, Rome and then the Dajjal, and God will conquer each for you", cluster: eschatology}
  romans-most-numerous-at-hour: {label: "The Hour will come when the Romans are the most numerous of people", cluster: eschatology}
  five-virtues-of-the-romans: {label: "The Romans' traits: most forbearing in trial, quickest to recover, quickest to return after flight, best to the poor, orphan and weak, and most resistant to kings' oppression", cluster: polemic}
  red-wind-at-kufa-hour-come: {label: "A red wind rises at Kufa and a man cries 'the Hour has come'", cluster: eschatology}
  no-inheritance-shared-no-spoil-rejoiced: {label: "The Hour will not come until no inheritance is divided and no booty rejoiced in", cluster: eschatology}
  death-pledged-band-three-days: {label: "Three days running the Muslims put forward a death-pledged vanguard that must return victorious; night parts them and the band perishes; on the fourth day the rest advance and God turns the rout on the enemy", cluster: warfare}
  bird-falls-dead-passing-the-slain: {label: "So great the slaughter that a bird passing over the slain falls dead before it clears them", cluster: warfare}
  hundred-sons-of-a-father-one-left: {label: "The sons of one father, a hundred, count themselves and find one man left", cluster: warfare}
  scream-dajjal-behind-in-families: {label: "A cry comes that the Dajjal has come behind them among their families; they drop what they hold and turn back", cluster: eschatology}
  rome-at-amaq-or-dabiq-thirds: {label: "The Romans camp at al-Aʿmāq or Dābiq; an army from Medina meets them; a third flees and God never forgives them, a third are killed, the best martyrs, a third conquer and are never tried", cluster: eschatology}
  swords-hung-on-olive-trees: {label: "Dividing the booty of Constantinople, they have hung their swords on the olive trees when Satan cries that the Messiah is behind them", cluster: eschatology}
  dajjal-melts-like-salt-at-jesus: {label: "When God's enemy sees Jesus he melts as salt melts in water", cluster: eschatology}
  jesus-shows-dajjals-blood-on-spear: {label: "God kills the Dajjal by Jesus's hand and he shows them his blood on his spear", cluster: eschatology}
  muslims-and-romans-fight-common-enemy: {label: "You will make a secure peace with the Romans and raid together an enemy behind them, and be victorious and take booty", cluster: eschatology}
  cross-victorious-cry-cross-broken: {label: "At a meadow of hills a Roman says 'the cross has conquered', a Muslim says 'God has conquered' and breaks the cross; the Romans kill him and the battle begins", cluster: eschatology}
  muslim-camp-at-ghuta-by-damascus: {label: "On the day of the great battle the Muslims' camp (fusṭāṭ) is at al-Ghūṭa beside Damascus, best of Syria's cities", cluster: eschatology}
  city-walls-fall-to-tahlil-and-takbir: {label: "Seventy thousand of the sons of Isaac come to a city half on land and half on sea; without weapon or arrow they say 'no god but God, God is greatest' and one side falls, then the other, then it opens", cluster: eschatology}
  stone-and-tree-call-out-hidden-jew: {label: "The Muslims fight the Jews until stone and tree say 'O Muslim, servant of God, here is a Jew behind me, come and kill him', except the gharqad, a tree of the Jews", cluster: eschatology}
  famine-is-rain-without-growth: {label: "The (true) drought is not that you get no rain, but that you are rained on and rained on and the earth grows nothing", cluster: eschatology}
  husband-sees-woman-once-had-a-man: {label: "A husband looks at a woman passing and says 'this one once had a man'", cluster: eschatology}
  thunderbolts-multiply-who-was-struck: {label: "Thunderbolts multiply near the Hour until a man comes to people and asks who was struck that morning; 'so-and-so and so-and-so'", cluster: eschatology}
  earthquakes-multiply: {label: "Before the Hour knowledge is taken and earthquakes multiply", cluster: eschatology}
  sinking-transformation-pelting-in-community: {label: "In this community there will be sinking (khasf), transformation (maskh) and pelting (qadhf) before the Hour", cluster: eschatology}
  greeting-refused-to-innovator: {label: "Ibn ʿUmar refuses to return greetings from a man said to have introduced innovation", cluster: ethics}
  army-swallowed-at-the-baida: {label: "An army raids the Kaaba; at a desert (al-Baydāʾ) the earth swallows them first to last", cluster: eschatology}
  swallowed-together-raised-on-intentions: {label: "Those swallowed with the army (markets, the compelled, the wayfarer) perish as one but are raised on their intentions", cluster: eschatology}
  prophet-stirs-in-sleep-wonders: {label: "The prophet moves in his sleep as never before and says 'a wonder': men of his community making for the House after a man of Quraysh who has taken refuge there", cluster: eschatology}
  middle-swallowed-one-survivor-tells: {label: "The army's middle is swallowed, the front calls to the rear, then all are swallowed but a single fugitive who tells of them", cluster: eschatology}
  refugee-at-the-house-without-defence: {label: "A people with no defence, number or equipment will take refuge in this House; an army is sent against them", cluster: eschatology}
  swallowed-army-hour-overshadows: {label: "When you hear of an army swallowed nearby, the Hour has cast its shadow", cluster: eschatology}
  house-raided-until-an-army-swallowed: {label: "Expeditions will not stop raiding this House until an army of them is swallowed", cluster: eschatology}
  pilgrimage-continues-after-gog-and-magog: {label: "The House will be visited in pilgrimage and ʿumra after the coming out of Gog and Magog", cluster: eschatology}
  hour-not-until-house-not-visited: {label: "The Hour will not come until the House is no longer visited in pilgrimage", cluster: eschatology}
  son-of-mary-hails-at-fajj-al-rawha: {label: "The son of Mary will raise the pilgrim's cry at Fajj al-Rawḥāʾ for hajj, ʿumra or both", cluster: eschatology}
  kaaba-wrecked-by-thin-shanked-abyssinian: {label: "The Kaaba will be wrecked by the one with two thin shanks (dhū l-suwayqatayn) from Abyssinia", cluster: eschatology}
  black-bandy-legged-man-pulls-kaaba-stone-by-stone: {label: "'As if I see him, black, bandy-legged, pulling it out stone by stone'", cluster: eschatology}
  pledge-between-corner-and-station: {label: "Allegiance is given to a man between the Corner and the Station; the House is profaned only by its own people", cluster: eschatology}
  abyssinians-take-out-its-treasure: {label: "The Abyssinians ruin the House beyond rebuilding, and they are the ones who take out its treasure", cluster: eschatology}
  house-demolished-twice-lifted-third: {label: "Enjoy this House: it has been demolished twice and will be lifted up at the third", cluster: eschatology}
  ancient-house-burned: {label: "How will you be when religion is confused, desire appears, brothers differ and the Ancient House is burned?", cluster: eschatology}
  rolls-on-grave-wishing-place: {label: "A man passes a grave, rolls on it and says 'would that I were in this grave's owner's place', not for religion but for affliction", cluster: eschatology}
  people-will-wish-for-the-dajjal: {label: "A time comes when people of the community wish for the Dajjal, from the hardship they suffer", cluster: eschatology}
  wind-takes-believers-under-armpits: {label: "God sends a pleasant wind that takes the believers under their armpits; the worst remain, copulating like donkeys, and on them the Hour comes", cluster: eschatology}
  band-fights-until-hour: {label: "A band of the community will keep fighting for God's command, prevailing over their enemy, until the Hour comes on them", cluster: eschatology}
  wind-like-musk-touch-of-silk: {label: "A wind like musk, with the touch of silk, takes every soul with a grain of faith; then the worst remain", cluster: eschatology}
  yemen-wind-softer-than-silk: {label: "God sends a wind from Yemen softer than silk that leaves none with a grain of faith", cluster: eschatology}
  hour-only-on-worst-people: {label: "The Hour will come only upon the worst of people", cluster: eschatology}
  worst-are-those-alive-at-hour-and-grave-mosques: {label: "Among the worst are those the Hour overtakes alive, and those who take graves as mosques", cluster: eschatology}
  righteous-go-one-by-one-dregs-remain: {label: "The righteous go one after another; dregs remain like the dregs of barley or dates, of whom God takes no account", cluster: eschatology}
  sifted-like-dates-die-if-you-can: {label: "You will be picked over as dates are sorted from their refuse; your best will go and your worst remain; die if you can", cluster: eschatology}
  no-one-says-allah-allah: {label: "The Hour will not come while anyone on earth says 'Allāh, Allāh'", cluster: eschatology}
  hour-on-dregs-of-people: {label: "The Hour comes only on the dregs (ḥuthāla) of people", cluster: eschatology}
  ten-major-signs-listed: {label: "The Hour will not come until ten signs: the smoke, the Dajjal, the Beast, the sun from the west, Jesus's descent, Gog and Magog, three sinkings (east, west, Arabia), and last a fire from Yemen driving people to their gathering", cluster: eschatology}
  signs-like-beads-on-broken-string: {label: "The signs are beads strung on a thread: when the thread breaks, one follows another", cluster: eschatology}
  kafir-spelled-k-f-r: {label: "'Kāfir' between the Dajjal's eyes is spelled out letter by letter, k-f-r, and every believer reads it, literate or not", cluster: eschatology}
  dajjal-warned-as-noah-warned: {label: "'I warn you of him as Noah warned his people'", cluster: eschatology}
  no-creature-greater-than-dajjal: {label: "Between the creation of Adam and the Hour there is no creature (or affair) greater than the Dajjal", cluster: eschatology}
  people-flee-dajjal-to-mountains-arabs-few: {label: "People will flee the Dajjal into the mountains; 'where are the Arabs then?' - 'they are few'", cluster: eschatology}
  dajjals-water-is-fire-fall-into-fire: {label: "The Dajjal has water and fire: what people see as water is burning fire, what they see as fire is cool sweet water; let one fall into what he sees as fire", cluster: eschatology}
  dajjal-two-rivers-close-eyes-and-drink: {label: "The Dajjal has two flowing rivers, one white water to the eye, one blazing fire; come to the fiery one, close your eyes, lower your head and drink: it is cold water", cluster: eschatology}
  dajjal-eye-with-thick-nail: {label: "The Dajjal's eye is wiped out, with a thick fleshy growth (ẓafara) over it", cluster: eschatology}
  dajjal-left-eye-blind-thick-hair: {label: "The Dajjal is blind in the left eye, with thick hair (jufāl al-shaʿr)", cluster: eschatology}
  lesser-trials-prepare-for-dajjal: {label: "No trial, small or great, but prepares for the Dajjal's trial; whoever survives the trials before it survives it", cluster: eschatology}
  dajjal-said-what-no-prophet-said-one-eyed: {label: "Every prophet warned of the Dajjal, but 'I tell you what no prophet told his people: he is one-eyed, and God is not'", cluster: eschatology}
  dajjal-circles-kaaba-behind-jesus: {label: "In the dream at the Kaaba, behind Jesus a curly man blind in the right eye circles the House, hands on two men's shoulders: the Messiah Dajjal", cluster: eschatology}
  jesus-not-red-but-brown: {label: "Ibn ʿUmar swears the prophet did not call Jesus red: Jesus was brown (ādam) with lank hair; the red one was the Dajjal", cluster: christology}
  laylat-al-qadr-forgotten-after-quarrel: {label: "The prophet was shown the Night of Decree and the Messiah of error; two men quarrelling made him forget the night: seek it in the last ten, on the odd", cluster: ritual}
  dajjal-broad-chest-bald-brow: {label: "The Messiah of error: a man with a receding hairline, wiped-out left eye and broad chest, like ʿAbd al-ʿUzzā b. Qaṭan", cluster: eschatology}
  he-is-too-slight-for-god: {label: "Told the Dajjal has rivers of water and mountains of bread: 'he is too slight before God for that'", cluster: eschatology}
  none-sees-his-lord-until-he-dies: {label: "'Know that none of you will see his Lord until he dies'", cluster: theology}
  dajjal-short-bandy-legged-curly: {label: "The Messiah Dajjal is a short, bandy-legged, curly-haired man, one-eyed, the eye wiped out, neither protruding nor sunken", cluster: eschatology}
  prophet-as-dajjals-adversary: {label: "If he comes out while I am among you I am his disputant for you; if not, each man is his own disputant, and God is my deputy over every Muslim", cluster: eschatology}
  read-opening-of-kahf-to-dajjal: {label: "Whoever meets the Dajjal should recite against him the opening verses of al-Kahf", cluster: ritual}
  dajjal-comes-from-path-between-syria-and-iraq: {label: "The Dajjal comes out on a path (khalla) between Syria and Iraq and wreaks havoc right and left", cluster: eschatology}
  dajjal-days-year-month-week: {label: "The Dajjal stays forty days: a day like a year, a day like a month, a day like a week, the rest like your days", cluster: eschatology}
  prayer-measured-in-long-day: {label: "Asked whether one day's prayers suffice in the day like a year: 'no, estimate its measure'", cluster: ritual}
  dajjal-rain-for-believers-drought-for-refusers: {label: "The Dajjal calls a people who believe him: he commands sky and earth and their herds come home fattest; those who refuse wake destitute", cluster: eschatology}
  ruin-treasures-follow-like-bee-swarms: {label: "The Dajjal tells a ruin 'bring out your treasures' and they follow him like swarms of bees", cluster: eschatology}
  dajjal-cuts-youth-in-two-and-calls-him: {label: "The Dajjal strikes a youth with the sword into two pieces a target's distance apart, then calls him and he comes laughing", cluster: eschatology}
  jesus-descends-at-white-minaret-east-of-damascus: {label: "Jesus descends at the white minaret east of Damascus in two dyed garments, hands on the wings of two angels; his head drips when lowered, pearls when raised", cluster: eschatology}
  jesus-breath-kills-unbelievers-to-horizon: {label: "No unbeliever who finds the scent of Jesus's breath but dies, and his breath reaches as far as his sight", cluster: eschatology}
  jesus-wipes-faces-tells-ranks: {label: "Jesus wipes the faces of those God protected and tells them their ranks in paradise", cluster: eschatology}
  believers-taken-to-the-tur: {label: "God tells Jesus: 'I have brought out servants of mine none can fight; take my servants up to al-Ṭūr'", cluster: eschatology}
  ox-head-better-than-hundred-dinars: {label: "Besieged, an ox's head is better to them than a hundred dinars to you today", cluster: eschatology}
  birds-like-camel-necks-carry-corpses: {label: "God sends birds like the necks of Bactrian camels that carry off the dead and throw them where God wills", cluster: eschatology}
  earth-washed-like-mirror-rain: {label: "God sends a rain from which no house of clay or hair shelters, washing the earth until it is like a mirror (or pool)", cluster: eschatology}
  band-eats-pomegranate-shades-in-rind: {label: "After Gog and Magog a company eats from one pomegranate and shades under its rind; one milch-camel suffices a crowd", cluster: eschatology}
  shoot-arrows-at-heaven-return-bloodied: {label: "'We have killed those on earth; come, let us kill those in heaven': they shoot at the sky and the arrows come back stained with blood", cluster: eschatology}
  jabal-al-khamr-is-jerusalems-mountain: {label: "Gog and Magog reach Jabal al-Khamr, the mountain of Jerusalem", cluster: eschatology}
  dajjal-in-ebb-of-religion: {label: "The Dajjal comes out at an ebb of religion and a waning of knowledge", cluster: eschatology}
  dajjals-donkey-forty-cubits-between-ears: {label: "The Dajjal has a donkey he rides, forty cubits between its ears", cluster: eschatology}
  dajjal-says-i-am-your-lord: {label: "The Dajjal says to people 'I am your Lord'", cluster: eschatology}
  angels-guard-gates-of-mecca-and-medina: {label: "The Dajjal reaches every water but Mecca and Medina; angels stand at their gates (passes) guarding them", cluster: eschatology}
  dajjal-devils-speak-to-people: {label: "God sends devils with the Dajjal who speak to people", cluster: eschatology}
  dajjal-kills-and-revives-in-appearance: {label: "The Dajjal kills a soul and revives it 'in what people see', and is given power over no other", cluster: eschatology}
  muslims-flee-to-mountain-of-smoke: {label: "The Muslims flee to the Mountain of Smoke in Syria; the Dajjal besieges and exhausts them", cluster: eschatology}
  jesus-calls-at-dawn-come-out-to-the-liar: {label: "Jesus descends and calls at dawn 'what keeps you from going out to the foul liar?'; they think him a jinn", cluster: eschatology}
  jesus-declines-to-lead-prayer: {label: "Told 'step forward, Spirit of God', Jesus says 'let your imam lead you'", cluster: eschatology}
  tree-and-stone-call-spirit-of-god: {label: "Tree and stone call 'Spirit of God, here is a Jew'; none of the Dajjal's followers is spared", cluster: eschatology}
  dajjal-worst-liar: {label: "The Dajjal is one-eyed and the most extreme of liars", cluster: eschatology}
  no-trial-since-adam-greater-than-dajjal: {label: "Since God spread Adam's seed there has been no trial on earth greater than the Dajjal's; God sent no prophet but he warned his community", cluster: eschatology}
  last-prophet-last-community: {label: "'I am the last of the prophets and you the last of the communities'", cluster: theology}
  dajjal-first-claims-prophecy-then-lordship: {label: "The Dajjal begins 'I am a prophet' (there is no prophet after me), then says 'I am your Lord' (you will not see your Lord until you die)", cluster: eschatology}
  kahf-makes-dajjals-fire-cool-as-for-abraham: {label: "Whoever is tried by the Dajjal's fire should seek God's help and recite the opening of al-Kahf; it becomes cool and safe as the fire was for Abraham", cluster: eschatology}
  devils-take-form-of-parents: {label: "The Dajjal asks a bedouin 'if I raise your father and mother will you testify I am your Lord?'; two devils take their shapes: 'my son, follow him, he is your Lord'", cluster: eschatology}
  dajjal-saws-man-in-two: {label: "The Dajjal is given power over one soul: he kills him and saws him with the saw into two halves, then raises him: 'who is your Lord?'", cluster: eschatology}
  never-surer-of-you-than-today: {label: "The revived man: 'by God, I was never more certain about you than today: you are the Dajjal'", cluster: eschatology}
  refusers-herds-perish: {label: "The Dajjal passes a clan that belies him and none of their grazing beasts is left alive", cluster: eschatology}
  angels-with-drawn-swords-at-passes: {label: "At every pass of Mecca and Medina angels meet the Dajjal with drawn swords", cluster: eschatology}
  medina-quakes-three-times-expels-hypocrites: {label: "Medina shakes with its people three times; every hypocrite goes out to the Dajjal; it expels the dross as the bellows expels iron's dross: the Day of Deliverance", cluster: eschatology}
  imam-steps-back-jesus-hand-between-shoulders: {label: "As the imam leads the dawn prayer Jesus descends; the imam steps back; Jesus places his hand between his shoulders: 'go forward, it was called for you'", cluster: eschatology}
  dajjal-with-seventy-thousand-jews-armed: {label: "Behind the door is the Dajjal with seventy thousand Jews, each with an adorned sword and a green shawl (sāj)", cluster: eschatology}
  i-have-a-blow-for-you: {label: "Jesus: 'I have a blow for you you will not escape'; he overtakes him at the eastern gate of Lydda", cluster: eschatology}
  everything-speaks-but-gharqad: {label: "No stone, tree, wall or beast behind which a Jew hides but God makes it speak, except the gharqad, a tree of theirs", cluster: eschatology}
  dajjal-forty-years-like-sparks: {label: "The Dajjal's days: forty years, a year like half a year, a year like a month, a month like a week; the last days like a spark: a man at one gate of the city does not reach the other before evening", cluster: eschatology}
  jesus-just-judge-removes-venom-and-enmity: {label: "Jesus as just judge: enmity removed, the sting taken from every stinging thing, the child puts his hand in the snake's mouth, the girl makes the lion flee, the wolf among the sheep like their dog", cluster: eschatology}
  earth-filled-with-peace-as-vessel-with-water: {label: "The earth is filled with peace as a vessel is filled with water; war lays down its burdens; Quraysh is stripped of its kingship", cluster: eschatology}
  earth-like-silver-platter-grows-as-in-adams-time: {label: "The earth becomes like a silver platter (fāthūr) and grows its plants as in Adam's time; a company is filled by one bunch of grapes or one pomegranate", cluster: eschatology}
  ox-dear-horse-cheap: {label: "Then an ox costs so much and a horse a few dirhams: the horse will never be ridden to war, the ox ploughs the whole earth", cluster: eschatology}
  three-years-of-withheld-rain-before-dajjal: {label: "Before the Dajjal three hard years: the sky withholds a third of its rain, then two-thirds, then all; the earth its growth likewise; every hoofed beast dies", cluster: eschatology}
  praise-feeds-them-as-food: {label: "In the famine people live on tahlīl, takbīr, tasbīḥ and taḥmīd, which runs in them as food does (as it suffices the people of heaven)", cluster: eschatology}
  devil-takes-form-of-camels-and-kin: {label: "The Dajjal offers to revive a bedouin's camels, or a man's dead father and brother; Satan takes their likeness", cluster: eschatology}
  we-knead-and-hunger-before-baking: {label: "Asmāʾ: we knead our dough and are hungry before we bake it; how will the believers be then?", cluster: eschatology}
  dajjal-white-gleaming-head-like-viper: {label: "The Dajjal: one-eyed, white and gleaming (hijān azhar), his head like a viper's (aṣala)", cluster: eschatology}
  dajjal-read-by-unlettered-and-literate: {label: "'Kāfir' between his eyes, read by the unlettered and the literate", cluster: eschatology}
  two-angels-like-prophets-with-dajjal: {label: "Two angels resembling two prophets go with the Dajjal; to 'am I not your Lord?' one says 'you lie', heard only by his companion, the other 'you speak truly', heard by all", cluster: eschatology}
  this-is-that-mans-village: {label: "Refused leave to enter Medina, the Dajjal says 'this is that man's village' and goes on to Syria, where God destroys him at the pass of Afīq", cluster: eschatology}
  aisha-weeps-at-thought-of-dajjal: {label: "ʿĀʾisha weeps at the thought of the Dajjal; 'if he comes while I live I will suffice you'", cluster: eschatology}
  dajjal-from-jewry-of-isfahan: {label: "The Dajjal comes out from the Jewish quarter of Isfahan", cluster: eschatology}
  medina-seven-gates-two-angels-each: {label: "Medina then has seven gates (passes), with two angels on each", cluster: eschatology}
  jesus-remains-forty-years-just-imam: {label: "Jesus remains on earth forty years, a just imam and equitable judge", cluster: eschatology}
  dajjal-from-khurasan-shield-faced-followers: {label: "The Dajjal comes from a land in the east called Khurāsān, followed by peoples whose faces are like hammered shields", cluster: eschatology}
  dajjal-head-hubuk-thrice: {label: "The misleading liar to come after you: his head behind is ḥubuk, ḥubuk, ḥubuk (tightly curled)", cluster: eschatology}
  formula-against-dajjal-our-lord-is-god: {label: "Whoever says 'you are not our Lord; our Lord is God, on him we rely, to him we turn; we seek refuge in God from you' is beyond his power", cluster: ritual}
  dajjal-eye-like-green-glass: {label: "One of the Dajjal's eyes is like green glass", cluster: eschatology}
  rumour-at-kufa-dajjal-out-lie-of-dyer: {label: "At Kufa it is cried that the Dajjal has come out and people are fighting him; then it is announced as a dyer's lie", cluster: eschatology}
  children-would-pelt-dajjal: {label: "If the Dajjal came out in your time the children would pelt him with pebbles", cluster: eschatology}
  earth-folded-for-dajjal-like-ram-fleece: {label: "The earth is folded up for the Dajjal like the fleece of a ram", cluster: eschatology}
  only-donkey-serves-dajjal-filth-on-filth: {label: "Of mounts only the donkey is made to serve the Dajjal: 'filth upon filth'", cluster: eschatology}
  be-like-ibn-labun-no-back-no-udder: {label: "In the trials be like a two-year-old camel: no back to ride, no udder to milk", cluster: wisdom}
  dajjal-heals-blind-leper-revives-dead: {label: "The Dajjal heals the born-blind and the leper and gives life to the dead, saying 'I am your Lord'", cluster: eschatology}
  jesus-comes-from-the-west-confirming-muhammad: {label: "Jesus son of Mary comes from the west, confirming Muhammad and on his religion, and kills the Dajjal; then it is the Hour", cluster: eschatology}
  seventy-thousand-isfahan-jews-in-taylasans: {label: "Seventy thousand of the Jews of Isfahan follow the Dajjal, wearing ṭayālisa", cluster: eschatology}
  plague-and-dajjal-kept-from-medina: {label: "Angels on Medina's passes keep out both the plague and the Dajjal", cluster: eschatology}
  dajjal-camps-at-salt-flat: {label: "The Dajjal camps at the salt-flat by Medina and pitches his tent", cluster: eschatology}
  best-man-testifies-you-are-the-dajjal: {label: "A man, the best of people, comes out to the Dajjal: 'I testify you are the Dajjal of whom God's messenger told us'", cluster: eschatology}
  neck-turned-to-copper-against-knife: {label: "The Dajjal goes to slaughter the believer, but the place between neck and collarbone is made copper", cluster: eschatology}
  thrown-into-what-seems-fire-is-paradise: {label: "The Dajjal throws him by hands and feet; people think into fire, but he is cast into paradise: the greatest martyr before the Lord of the worlds", cluster: eschatology}
  dajjals-patrols-say-dont-kill-without-lord: {label: "The Dajjal's patrols would kill the believer, but say 'has your lord not forbidden you to kill anyone without him?'", cluster: eschatology}
  dajjal-turned-at-uhud-perishes-in-syria: {label: "The Messiah comes from the east aiming at Medina, halts behind Uhud; the angels turn his face to Syria, and there he perishes", cluster: eschatology}
  dajjal-shuns-four-mosques: {label: "The Dajjal stays forty mornings, reaches every water, but does not approach four mosques: the Sacred, Medina's, al-Ṭūr's and al-Aqṣā", cluster: eschatology}
  dajjal-rains-but-no-tree-grows: {label: "The Dajjal makes rain fall but makes no tree grow", cluster: eschatology}
  refuge-from-dajjal-in-prayer: {label: "The prophet sought refuge in his prayer from the trial of the Dajjal", cluster: ritual}
  flee-far-from-dajjal: {label: "Whoever hears of the Dajjal should keep far from him: a man comes to him thinking himself a believer and follows him for the doubts he raises", cluster: ethics}
  remove-to-blind-cousin-not-busy-widow: {label: "The prophet sends a divorcee from the busy house of a generous widow to a blind cousin, lest her veil slip before guests", cluster: law}
  tamim-shipwreck-island-thirty-men: {label: "Tamīm al-Dārī, a Christian convert, tells how he and thirty men of Lakhm and Judhām were tossed a month at sea and landed on an island", cluster: eschatology}
  jassasa-hairy-beast-front-from-back: {label: "On the island a beast so hairy none can tell its front from its back: 'I am the Jassāsa (the spy); go to the man in the monastery'", cluster: eschatology}
  chained-giant-in-monastery: {label: "In the monastery the greatest man they ever saw, fettered: hands bound to neck, iron from knees to ankles", cluster: eschatology}
  baysan-palms-tiberias-zughar-spring: {label: "The chained man asks whether the palms of Baysān bear, whether Lake Tiberias has water, whether the spring of Zughar waters crops; all will fail", cluster: eschatology}
  chained-man-asks-of-unlettered-prophet: {label: "The chained man asks of the prophet of the unlettered: has he left Mecca, settled Yathrib, fought the Arabs and prevailed? 'Better for them to obey him'", cluster: eschatology}
  i-am-the-messiah-leave-to-go-out-soon: {label: "'I am the Messiah, and soon I will be given leave to go out'; he will descend on every town in forty nights save Mecca and Ṭayba", cluster: eschatology}
  this-is-tayba-thrice-staff-on-pulpit: {label: "Striking the pulpit with his staff: 'this is Ṭayba, this is Ṭayba, this is Ṭayba'; Tamīm's story agreed with what he had taught", cluster: eschatology}
  sea-of-syria-or-yemen-no-east: {label: "'He is in the sea of Syria or of Yemen - no, from the east, from the east', pointing east", cluster: eschatology}
  ibn-sayyad-says-messenger-of-unlettered: {label: "Asked 'do you testify I am God's messenger?', Ibn Ṣayyād says 'you are the messenger of the unlettered; do you testify I am God's messenger?'", cluster: eschatology}
  true-and-false-come-to-him: {label: "Ibn Ṣayyād: 'a truthful one and a liar come to me'; 'the matter is confused for you'", cluster: eschatology}
  hidden-thing-dukh: {label: "The prophet hides something for Ibn Ṣayyād (smoke); he says 'al-dukh'; 'begone, you will not exceed your measure'", cluster: eschatology}
  if-he-is-him-you-cannot-kill-him: {label: "ʿUmar asks leave to kill Ibn Ṣayyād: 'if it is he, you will not be given power over him; if not, no good for you in killing him'", cluster: eschatology}
  prophet-creeps-behind-palms-to-overhear: {label: "The prophet creeps behind palm trunks to overhear Ibn Ṣayyād murmuring in his velvet wrap; his mother warns him: 'Ṣāf, here is Muḥammad'", cluster: eschatology}
  ibn-sayyad-sees-throne-on-water: {label: "Ibn Ṣayyād: 'I see a throne on the water'; 'you see the throne of Iblīs on the sea'", cluster: eschatology}
  soil-of-paradise-white-flour-pure-musk: {label: "The soil of paradise is white fine flour (darmaka), pure musk", cluster: paradise}
  ibn-sayyad-protests-muslim-has-child: {label: "Ibn Ṣayyād protests: the Dajjal is an unbeliever and I am a Muslim, childless and I have a son, barred from Mecca and Medina and I come from one to the other", cluster: eschatology}
  ibn-sayyad-knows-where-he-is: {label: "Ibn Ṣayyād: 'I know him, his birth and where he is now'; asked if he would like to be him: 'I would not mind'", cluster: eschatology}
  ibn-sayyad-thinks-of-hanging-himself: {label: "Ibn Ṣayyād says people's talk makes him want to hang himself from a tree", cluster: eschatology}
  if-not-him-no-killing-a-protected-man: {label: "'If it is he, you are not his slayer, only Jesus son of Mary; if not, you may not kill a man of the covenant'", cluster: eschatology}
  ibn-sayyad-swells-to-fill-street: {label: "Angered, Ibn Ṣayyād swells until he fills the street", cluster: eschatology}
  dajjal-comes-out-from-anger: {label: "'The first thing that sends him out on people is an anger he is angered with'", cluster: eschatology}
  ibn-sayyad-snorts-like-donkey-eye-swollen: {label: "Ibn Ṣayyād, his eye swollen, snorts like the loudest donkey; Ibn ʿUmar breaks his staff on him without noticing", cluster: eschatology}
  jabir-swears-ibn-sayyad-is-dajjal: {label: "Jābir swears Ibn Ṣayyād is the Dajjal because ʿUmar swore it before the prophet and he did not deny it", cluster: eschatology}
  dukh-or-zukh-you-already-differ: {label: "They differ whether Ibn Ṣayyād said dukh or zukh: 'you differ while I am among you; after me you will differ more'", cluster: eschatology}
  beast-comes-out-at-forenoon: {label: "The first signs: the sun rising from the west and the Beast coming out on people at forenoon; whichever is first, the other follows close", cluster: eschatology}
  beast-marks-noses-buyer-from-marked: {label: "The Beast comes out and brands people on their snouts; they multiply until a man buying a camel says he bought it 'from one of the branded'", cluster: eschatology}
  beast-from-greatest-mosque-earth-cracks: {label: "The Beast comes out from the most sacred of mosques: as they sit, the earth shakes, then splits", cluster: eschatology}
  sun-asks-leave-refused-lord-how-far-east: {label: "The sun sets, greets, prostrates and asks leave; one day leave is withheld: 'Lord, the way is long, I will not reach'; it is told to rise where it set", cluster: eschatology}
  neglect-of-dependants-enough-sin: {label: "It is sin enough for a man to neglect those whose food he provides", cluster: ethics}
  gog-magog-each-leaves-thousand-offspring: {label: "None of Gog and Magog dies until a thousand are born of his loins; behind them three nations whose number only God knows: Mansak, Tāwīl, Tāwīs", cluster: eschatology}
  repentance-gate-in-west-seventy-years-wide: {label: "Toward the sun's setting is a gate open for repentance seventy years wide; it stays open until the sun rises from its direction", cluster: eschatology}
  wealth-overflows-one-prostration-better: {label: "Wealth overflows until no one accepts it, until one prostration is better than the world and what is in it", cluster: eschatology}
  young-camels-left-unridden: {label: "Young she-camels (qilāṣ) are left and no one goes after them; rancour, mutual hatred and envy go", cluster: eschatology}
  jesus-forty-years-dies-muslims-pray-over-him: {label: "Jesus stays forty years, then dies, and the Muslims pray over him", cluster: eschatology}
  jesus-medium-reddish-white-head-drips-dry: {label: "Jesus is of medium height, between red and white, in two yellowish garments, his head as if dripping though no wet touched it", cluster: christology}
  god-destroys-all-religions-but-islam: {label: "In Jesus's time God destroys all religions except Islam", cluster: eschatology}
  no-prophet-between-me-and-jesus: {label: "'There is no prophet between me and him', that is, Jesus", cluster: christology}
  some-of-you-commanders-over-others: {label: "Asked to lead the prayer, Jesus says 'no; some of you are commanders over others, God's honour to this community'", cluster: eschatology}
  people-like-birds-in-lightness-beasts-in-mind: {label: "The worst remain in the lightness of birds and the minds of beasts, knowing no good, rejecting no evil; Satan bids them worship idols, yet their provision flows", cluster: eschatology}
  trumpet-heard-tilting-neck: {label: "The trumpet is blown: none hears it but he tilts one side of his neck and raises the other", cluster: eschatology}
  rain-like-dew-bodies-grow: {label: "God sends a rain like dew (ṭall) and people's bodies grow from it; then a second blast and they stand looking", cluster: resurrection}
  nine-hundred-ninety-nine-of-thousand-to-fire: {label: "'Bring out the contingent of the fire': of every thousand, nine hundred and ninety-nine", cluster: eschatology}
  mahdi-bald-brow-hooked-nose-seven-years: {label: "The Mahdī is of me: receding brow, aquiline nose; he fills the earth with equity and justice as it was filled with tyranny, and rules seven years", cluster: eschatology}
  man-of-my-family-fills-earth-with-justice: {label: "A man of my kin (ʿitra) or household will come out and fill the earth with equity and justice as it was filled with oppression", cluster: eschatology}
  mahdi-time-rain-plenty-wealth-correct: {label: "In the Mahdī's time God waters with rain, the earth brings out its growth, wealth is given rightly, flocks multiply, the community grows great; he lives seven or eight years", cluster: eschatology}
  mahdi-name-like-prophets-father-like-his-father: {label: "If one day remained God would lengthen it to send a man of my house whose name matches mine and his father's name my father's", cluster: eschatology}
  last-night-a-man-of-the-house-rules: {label: "If only one night remained of the world, a man of the Prophet's household would rule in it", cluster: eschatology}
  mahdi-from-children-of-fatima: {label: "The Mahdī is of my kin, of the children of Fāṭima", cluster: eschatology}
  mahdi-invites-jesus-to-lead: {label: "Jesus descends and their commander the Mahdī says 'come, lead us in prayer'; he says 'no, some of you are commanders over others'", cluster: eschatology}
  your-imam-from-among-you: {label: "'How will you be when the son of Mary descends among you and your imam is from among you?'", cluster: eschatology}
  caliph-scatters-wealth-without-counting: {label: "In the last days a caliph will scoop out wealth by handfuls without counting it", cluster: eschatology}
  iraq-and-syria-cut-off-from-tribute: {label: "Iraq will soon receive no qafīz or dirham (the Persians stop it), Syria no dinar or mudy (the Romans stop it)", cluster: eschatology}
  muslims-burn-gog-weapons-seven-years: {label: "The Muslims will kindle fires from the bows, arrows and shields of Gog and Magog for seven years", cluster: eschatology}
  beasts-fatten-on-gog-flesh: {label: "The flocks have no pasture but Gog's flesh and grow fat on it; the beasts of the earth grow fat in gratitude from their flesh and blood", cluster: eschatology}
  volunteer-goes-down-finds-them-dead: {label: "'Will a man sell his soul and see what the enemy has done?' One goes down expecting death and finds them dead on one another: 'rejoice'", cluster: eschatology}
  gog-will-say-in-sha-allah: {label: "Gog and Magog's chief says 'we will dig tomorrow, if God wills', and they find the wall as they left it and break through", cluster: eschatology}
  opening-of-barrier-like-this-ninety: {label: "'Woe to the Arabs from an evil drawn near: today the barrier of Gog and Magog opened this much', with a ring of the fingers (ninety, or ten)", cluster: eschatology}
  destroyed-though-righteous-when-filth-abounds: {label: "'Shall we perish when there are righteous among us?' - 'yes, when filth (al-khabath) abounds'", cluster: eschatology}
  sinking-in-east-with-muslims: {label: "A sinking in the east is mentioned; 'will a land with Muslims be swallowed?' - 'yes, when most of its people are filth'", cluster: eschatology}
  fire-from-aden-moves-and-rests-with-them: {label: "The last sign: a fire from Yemen (the depth of Aden) driving people to their gathering; it halts when they halt and rests at noon when they rest; and a wind casting people into the sea", cluster: eschatology}
  ibn-salam-three-questions: {label: "ʿAbd Allāh b. Salām asks three things only a prophet knows: the first sign of the Hour, the first food of paradise, why a child takes after father or mother", cluster: polemic}
  whose-fluid-precedes-child-resembles: {label: "If the man's fluid precedes the woman's the child takes after him; if hers, after her", cluster: anthropology}
  jews-praise-then-revile-ibn-salam: {label: "The Jews call ʿAbd Allāh b. Salām 'our best and son of our best' until he declares Islam, then 'our worst and son of our worst'", cluster: polemic}
  gabriel-enemy-of-jews: {label: "'That is the enemy of the Jews among the angels', said of Gabriel", cluster: polemic}
  fire-from-hadramawt-go-to-syria: {label: "A fire will come from Ḥaḍramawt before the resurrection and drive people; 'what do you command us?' - 'go to Syria'", cluster: eschatology}
  gathered-two-three-four-ten-on-a-camel: {label: "People are gathered in three ways: eager, fearful; two on a camel, three, four, ten on a camel; the fire drives the rest, staying the night with them and resting at noon", cluster: eschatology}
  three-companies-riding-walking-dragged: {label: "People are gathered in three companies: riding, fed and clothed; walking and hurrying; dragged on their faces by angels", cluster: eschatology}
  orchard-traded-for-old-camel: {label: "God sends a blight on the mounts until a man gives his fine orchard for an old she-camel with a saddle, and cannot get it", cluster: eschatology}
  gathered-on-faces-mouths-bridled: {label: "You will be gathered riding and walking and on your faces, your mouths bridled (fidām); you complete seventy nations, the best and most honoured", cluster: eschatology}
  thigh-first-to-speak: {label: "The first thing to speak (yuʿrib) for one of you is his thigh", cluster: eschatology}
  sworn-by-fingers-not-to-follow: {label: "A man had sworn by the number of his fingers not to follow the prophet or his religion", cluster: sira}
  wifes-right-feed-clothe-no-face-blow: {label: "A wife's right: feed her when you eat, clothe her when you clothe yourself, do not strike the face nor revile her, nor shun her except within the house", cluster: law}
  jesus-descends-and-leads-them-in-prayer: {label: "As the prayer is called and the ranks are set, Jesus son of Mary descends and leads them (amma-hum) in prayer", cluster: eschatology}

units:
  # ============== the last bābs of the trials
  - id: hadith-65-nations-call-to-the-bowl
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: The nations call one another against the believers like eaters to a bowl; froth of the torrent; wahn
    read: ["Jāmiʿ 65:8415.1"]
    tags:
      - {motif: nations-call-each-other-like-eaters-to-bowl, refs: ["Jāmiʿ 65:8415.1"], note: "يُوشك أن تداعَى عليكم الأممُ من كل أفق كما تَدَاعى الأكلةُ على قَصْعتها"}
      - {motif: many-but-froth-of-the-torrent, refs: ["Jāmiʿ 65:8415.1"], note: "أنتم يومئذ كثير، ولكن تكونون غُثَاءً كغُثاءِ السيلِ تُنْزع المهابةُ من قلوب عدوكم"}
      - {motif: wahn-love-of-life-dislike-of-death, refs: ["Jāmiʿ 65:8415.1"], note: "وما الوهن؟ قال: \"حبُّ الحياة، وكراهيةُ الموت\""}
  - id: hadith-65-medina-besieged-to-salah
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: The Muslims driven back to Medina, their farthest outpost at Salāḥ
    read: ["Jāmiʿ 65:8415.2"]
    tags:
      - {motif: muslims-besieged-back-to-medina-outpost-at-salah, refs: ["Jāmiʿ 65:8415.2"], note: "يُوشك المسلمون أن يحاصروا إلى المدينة حتى يكون أبعد مسالحهم سلاح"}
  - id: hadith-65-mawali-army
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: In the great wars God raises an army of freedmen
    read: ["Jāmiʿ 65:8416.1"]
    tags:
      - {motif: mawali-army-raised-in-great-wars, refs: ["Jāmiʿ 65:8416.1"], note: "إذا وقعت الملاحم بعث اللَّه بعثا من الموالي هم أكرم العرب فرسًا، وأجوده سلاحًا"}
  - id: hadith-65-punishment-strikes-all
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Punishment strikes all in a people; they are raised on their deeds
    read: ["Jāmiʿ 65:8416.2"]
    tags:
      - {motif: punishment-strikes-all-then-raised-by-deeds, refs: ["Jāmiʿ 65:8416.2"], note: "أصاب العذاب من كان فيهم، ثم بعثوا على أعمالهم"}
    hints:
      - "All in a town struck though some are righteous, each then judged by his deeds, against Gen 18:23-25, Abraham's 'wilt thou destroy the righteous with the wicked?'"
  - id: hadith-65-word-of-truth-before-tyrant
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: The best jihad, a word of truth before an unjust ruler (bāb on Q 20:43-44, Moses and Aaron's gentle word to Pharaoh)
    read: ["Jāmiʿ 65:8416.3-8417.1"]
    quran: ["20:43-44"]
    tags:
      - {motif: best-jihad-word-of-truth-before-tyrant, refs: ["Jāmiʿ 65:8416.3", "Jāmiʿ 65:8416.4", "Jāmiʿ 65:8417.1"], note: "كلمة حق عند سلطان جائر; إن من أعظم الجهاد كلمة عدل عند سلطان جائر"}
      - {motif: question-answered-after-third-pillar, refs: ["Jāmiʿ 65:8416.4"], note: "عند الجمرة الأولى ... فسكت عنه، فلما رأى الجمرة الثانية سأله، فسكت عنه، فلما رمى جمرة العقبة، وضع رجله في الغرز ليركب"}
  - id: hadith-65-not-abase-oneself
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: A believer does not abase himself by courting a trial beyond him (Ibn ʿUmar on hearing al-Ḥajjāj)
    read: ["Jāmiʿ 65:8417.2"]
    tags:
      - {motif: believer-must-not-abase-himself-with-unbearable-trial, refs: ["Jāmiʿ 65:8417.2"], note: "لا ينبغي للمؤمن أن يذل نفسه ... يتعرض من البلاء لما لا يُطيق"}
  - id: hadith-65-community-not-on-error
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: The community will not agree on error; God's hand is on the congregation
    read: ["Jāmiʿ 65:8418.1-8419.1"]
    tags:
      - {motif: community-never-agreed-on-error, refs: ["Jāmiʿ 65:8418.1", "Jāmiʿ 65:8419.1"], note: "لن تجتمع أمتي على الضلالة أبدًا فعليكم بالجماعة فإن يد اللَّه على الجماعة"}
  - id: hadith-65-renewer-each-century
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: A renewer at the head of every hundred years
    read: ["Jāmiʿ 65:8420.1"]
    tags:
      - {motif: renewer-at-head-of-each-century, refs: ["Jāmiʿ 65:8420.1"], note: "إن اللَّه يبعث لهذه الأمة على رأس كل مائة سنة من يجدد لها دينها"}
  # ============== minor signs of the Hour
  - id: hadith-65-when-is-the-hour
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: When is the Hour? Gabriel's question and its signs; old age will not reach the youngest; you are with whom you love; no soul alive in a hundred years (bāb on Q 7:187, 33:63, 79:42-44)
    read: ["Jāmiʿ 65:8422.1-8423.3"]
    quran: ["7:187", "33:63", "79:42-44", "31:34"]
    tags:
      - {motif: gabriel-as-questioner-hour-unknown, refs: ["Jāmiʿ 65:8422.1"], note: "ما المسؤول عنها بأعلم من السائل ... فلم يروا شيئًا ... هذا جبريل، جاء ليعلّم الناسَ دينَهم"}
      - {motif: slave-girl-bears-her-master, refs: ["Jāmiʿ 65:8422.1"], note: "إذا ولدت الأمة ربها، فذاك من أشراطها"}
      - {motif: barefoot-naked-shepherds-vie-in-building, refs: ["Jāmiʿ 65:8422.1"], note: "وإذا كانت العراة الحفاة رؤوس الناس ... وإذا تطاول رعاء البهم في البنيان"}
      - {motif: five-known-only-to-god, refs: ["Jāmiʿ 65:8422.1"], note: "في خمس لا يعلمهن إلا اللَّه\"، ثم تلا ﷺ ﴿إِنَّ اللَّهَ عِنْدَهُ عِلْمُ السَّاعَةِ"}
      - {motif: hour-known-only-to-god, refs: ["Jāmiʿ 65:8422.1", "Jāmiʿ 65:8423.2"], note: "تسألوني عن الساعة؟ وإنما علمها عند اللَّه"}
      - {motif: questioner-told-hour-beyond-his-lifetime, refs: ["Jāmiʿ 65:8422.2", "Jāmiʿ 65:8423.1"], note: "فكان ييظر إلى أصغرهم فيقول: \"إن يعشْ هذا لا يدركه الهرمُ حتى تقوم عليكم ساعتُكم\"; Hishām: يعني موتهم"}
      - {motif: you-are-with-whom-you-love, refs: ["Jāmiʿ 65:8423.1"], note: "ما أعددتُ لها إلا أني أحب اللَّه ورسوله، قال: \"إنك مع من أحببت\""}
      - {motif: none-now-living-survives-a-century, refs: ["Jāmiʿ 65:8423.2", "Jāmiʿ 65:8423.3"], note: "قبل أن يموت بشهر ... ما على الأرض من نفس منفوسة تأتي عليها مائة سنة; لما رجع النبي ﷺ من تبوك"}
    hints:
      - "The Hour unknown even to the one asked against Mark 13:32, 'of that day and that hour knoweth no man, no, not the angels ... neither the Son, but the Father'."
  - id: hadith-65-hasten-deeds-before-six
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Hasten good deeds before six signs
    read: ["Jāmiʿ 65:8423.4-8424.1"]
    tags:
      - {motif: hasten-deeds-before-six-signs, refs: ["Jāmiʿ 65:8423.4", "Jāmiʿ 65:8424.1"], note: "بادروا بالأعمال ستا: الدجال، والدخان، ودابة الأرض، وطلوع الشمس من مغربها، وأمر العامة، وخويصة أحدكم"}
  - id: hadith-65-catalogue-of-signs
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: A catalogue of signs ending with the sun from the west and the Hour striking mid-trade and mid-meal (Q 6:158)
    read: ["Jāmiʿ 65:8424.2"]
    quran: ["6:158"]
    tags:
      - {motif: two-great-parties-one-claim, refs: ["Jāmiʿ 65:8424.2"], note: "حتى تقتتل فئتان عظيمتان يكون بينهما مقتلة عظيمة، دعوتهما واحدة"}
      - {motif: thirty-liars-claim-prophethood, refs: ["Jāmiʿ 65:8424.2"], note: "دجالون كذابون، قريب من ثلاثين، كلهم يزعم أنه رسول اللَّه"}
      - {motif: earthquakes-multiply, refs: ["Jāmiʿ 65:8424.2"], note: "وحتى يقبض العلم، وتكثر الزلازل، ويتقارب الزمان"}
      - {motif: rich-man-cannot-find-taker-for-alms, refs: ["Jāmiʿ 65:8424.2"], note: "حتى يهم رب المال من يقبل صدقته ... لا أرب لي به"}
      - {motif: man-passes-grave-wishes-he-were-in-it, refs: ["Jāmiʿ 65:8424.2"], note: "وحتى يمر الرجل بقبر الرجل، فيقول: يا ليتني مكانه"}
      - {motif: sun-rises-from-west-all-believe, refs: ["Jāmiʿ 65:8424.2"], note: "وحتى تطلع الشمس من مغربها فإذا طلعت ورآها الناس، يعني آمنوا أجمعون"}
      - {motif: hour-strikes-mid-trade-mid-meal, refs: ["Jāmiʿ 65:8424.2"], note: "وقد نشر الرجلان ثوبهما بينهما فلا يتبايعانه ولا يطويانه ... وقد رفع أكلته إلى فيه فلا يطعمها"}
    hints:
      - "The Hour falling on men mid-trade, mid-meal and at the trough against Luke 17:27-28, 34-35: they ate, drank, bought, sold, and 'two shall be grinding together'."
  - id: hadith-65-count-six-before-the-hour
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Count six before the Hour (ʿAwf b. Mālik in a leather tent at Tabūk)
    read: ["Jāmiʿ 65:8424.3"]
    tags:
      - {motif: six-before-the-hour-counted-on-the-hand, refs: ["Jāmiʿ 65:8424.3"], note: "اعدد ستًّا بين يدي الساعة: موتي، ثم فتح بيت المقدس، ثم موتان يأخذ فيكم كقعاص الغنم ... ثم هدنة تكون بينكم وبين بني الأصفر"}
      - {motif: death-like-sheep-murrain, refs: ["Jāmiʿ 65:8424.3"], note: "ثم موتان يأخذ فيكم كقعاص الغنم"}
      - {motif: eighty-banners-twelve-thousand-each, refs: ["Jāmiʿ 65:8424.3"], note: "فيأتونكم تحت ثمانين غاية، تحت كل غاية اثنا عشر ألفا"}
  - id: hadith-65-sent-with-the-hour-two-fingers
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Sent with the Hour like two fingers; like two racehorses; the scout who waves his garment (bāb on Q 16:77)
    read: ["Jāmiʿ 65:8425.1-8426.5"]
    quran: ["16:77"]
    tags:
      - {motif: sent-with-the-hour-like-two-fingers, refs: ["Jāmiʿ 65:8425.1", "Jāmiʿ 65:8425.3", "Jāmiʿ 65:8426.1", "Jāmiʿ 65:8426.2", "Jāmiʿ 65:8426.3"], note: "بعثت أنا والساعة كهذه من هذه أو كهاتين\". وقرن بين السبابة والوسطى"}
      - {motif: hour-nearly-outran-the-prophet, refs: ["Jāmiʿ 65:8425.2", "Jāmiʿ 65:8426.4", "Jāmiʿ 65:8426.5"], note: "كمثل فرسي رهان; بعثت أنا والساعة جميعا إنْ كادت لتسبقني; فسبقتُها في نفس الساعة"}
      - {motif: scout-waves-his-garment-you-are-attacked, refs: ["Jāmiʿ 65:8425.2"], note: "كمثل رجل بعثه قومه طليعة، فلما خشي أن يسبق ألاح بثوبه أُتِيتم أتيتم ... \"أنا ذلك\""}
  - id: hadith-65-rest-of-the-day
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Your term like the afternoon to sunset; what remains of the world like what remains of the day (Q 16:77 bāb)
    read: ["Jāmiʿ 65:8427.1-8427.2"]
    quran: ["16:77"]
    tags:
      - {motif: communities-time-like-asr-to-sunset, refs: ["Jāmiʿ 65:8427.1"], note: "إنما أجلكم في أجل من خلا من الأمم ما بين صلاة العصر إلى مغرب الشمس"}
      - {motif: world-left-like-the-rest-of-a-day-at-sunset, refs: ["Jāmiʿ 65:8427.2"], note: "وقد كادت الشمس أن تغرب ... ما بقي من الدنيا فيما مضى منها إلا كما بقي من يومكم هذا فيما مضى منه"}
  - id: hadith-65-six-repeat-and-dark-trials
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: The six before the Hour (repeated for the death and the plague); trials like pieces of the dark night
    read: ["Jāmiʿ 65:8428.1-8428.2"]
    tags:
      - {motif: death-like-sheep-murrain, refs: ["Jāmiʿ 65:8428.1"], note: "موتي، ثم فتح بيت المقدس، ثم موتان يأخذ فيكم كقعاص الغنم"}
      - {motif: trials-like-pieces-of-dark-night, refs: ["Jāmiʿ 65:8428.2"], note: "إن بين يدي الساعة فتنا كقطع الليل المظلم، يصبح الرجل فيها مؤمنا ويمسي كافرًا"}
  - id: hadith-65-trust-lost
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Trust lost and lifted from hearts in sleep; people like a hundred camels
    read: ["Jāmiʿ 65:8429.1-8429.3"]
    tags:
      - {motif: trust-lost-when-affairs-given-to-unfit, refs: ["Jāmiʿ 65:8429.1"], note: "إذا ضيعت الأمانة فانتظر الساعة ... إذا أسند الأمر إلى غير أهله"}
      - {motif: people-like-hundred-camels-hardly-a-mount, refs: ["Jāmiʿ 65:8429.2"], note: "إنما الناس كالإبل المائة لا تكاد تجد فيها راحلة"}
      - {motif: trust-came-down-in-root-of-hearts, refs: ["Jāmiʿ 65:8429.3"], note: "أن الأمانة نزلت في جذر قلوب الرجال، ثم نزل القرآن"}
      - {motif: trust-lifted-in-sleep-leaves-blister, refs: ["Jāmiʿ 65:8429.3"], note: "ينام الرجل النومة، فتقبض الأمانة من قلبه، فيظل أثرها مثل الوكت ... كجمر دحرجته على رجلك، فنفط، فتراه منتبرًا، وليس فيه شيء"}
  - id: hadith-65-harj-and-knowledge-lifted
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Knowledge lifted, ignorance sent down, al-harj (killing) multiplies; time contracts, markets draw near; Arabia meadows again
    read: ["Jāmiʿ 65:8429.4-8431.1"]
    tags:
      - {motif: harj-is-killing, refs: ["Jāmiʿ 65:8429.4", "Jāmiʿ 65:8430.1", "Jāmiʿ 65:8430.2", "Jāmiʿ 65:8430.4", "Jāmiʿ 65:8431.1"], note: "ويكثر الهرج\"، قالوا: يا رسول اللَّه، أيم هو؟ قال: \"القتل، القتل\""}
      - {motif: killer-and-killed-know-not-why, refs: ["Jāmiʿ 65:8430.3"], note: "لا يدري القاتلُ فيما قتل؟ ولا المقتولُ فيم قتل؟ ... القاتل والمقتول في النار"}
      - {motif: markets-draw-near, refs: ["Jāmiʿ 65:8430.4"], note: "ويتقارب الزمان، وتتقارب الأسواق، ويكثر الهرج"}
      - {motif: many-reciters-few-jurists, refs: ["Jāmiʿ 65:8430.5"], note: "يكثر فيه القراء، ويقلّ الفقهاء ... يقرأ القرآن رجال لا يجاوز تراقيهم، ثم يأتي زمان يجادل المنافقُ المشركُ المؤمنُ"}
