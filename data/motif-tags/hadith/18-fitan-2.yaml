      - {motif: dajjal-camps-at-salt-flat, refs: ["Jāmiʿ 65:8493.5"], note: "فينزل بعض السباخ التي تلي المدينة"}
      - {motif: best-man-testifies-you-are-the-dajjal, refs: ["Jāmiʿ 65:8493.5"], note: "فيخرج إليه يومئذ رجل وهو خير الناس ... فيقول: أشهد أنك الدجال الذي حدّثنا رسول اللَّه ﷺ حديثه"}
      - {motif: never-surer-of-you-than-today, refs: ["Jāmiʿ 65:8493.5"], note: "فيقتله ثم يحييه؛ فيقول: واللَّه ماكنت فيك أشد بصيرة مني اليوم، فيريد الدجال أن يقتله فلا يُسلّطُ عليه"}
      - {motif: dajjals-patrols-say-dont-kill-without-lord, refs: ["Jāmiʿ 65:8494.1"], note: "فتلقاه المسالح مسالح الدجال ... أليس قد نهاكم ربكم أن تقتلوا أحدًا دونه"}
      - {motif: dajjal-saws-man-in-two, refs: ["Jāmiʿ 65:8494.1"], note: "فيؤشر بالمئشار من مفرقه حتى يفرق بين رجليه، قال: ثم يمشي الدجال بين القطعتين، ثم يقول له: قم فيستوي قائما"}
      - {motif: neck-turned-to-copper-against-knife, refs: ["Jāmiʿ 65:8494.1"], note: "فيأخذه الدجال ليذبحه، فيجعل ما بين رقبته إلى ترقوته نحاسا فلا يستطيع إليه سبيلا"}
      - {motif: thrown-into-what-seems-fire-is-paradise, refs: ["Jāmiʿ 65:8494.1"], note: "فيقذف به، فيحسب الناس أنما قذفه إلى النار، وإنما ألقي في الجنة ... هذا أعظم الناس شهادة عند رب العالمين"}
      - {motif: dajjal-turned-at-uhud-perishes-in-syria, refs: ["Jāmiʿ 65:8494.2"], note: "يأتي المسيح من قبل المشرق، همته المدينة، حتى ينزل دبر أحد، ثم تصرف الملائكة وجهه قبل الشام، وهنالك يهلك"}
      - {motif: dajjal-shuns-four-mosques, refs: ["Jāmiʿ 65:8495.1"], note: "ولا يقرب أربعة مساجد: مسجد الحرام، ومسجد المدينة، ومسجد الطور، ومسجد الأقصى"}
      - {motif: dajjal-rains-but-no-tree-grows, refs: ["Jāmiʿ 65:8495.1"], note: "وإنه يمطر المطر، ولا ينبت الشجر"}
      - {motif: dajjal-days-year-month-week, refs: ["Jāmiʿ 65:8495.1"], note: "وإنه يمكث في الأرض أربعين صباحا، يبلغ فيها كل منهل"}
  - id: hadith-65-protection-from-dajjal
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Ten verses of al-Kahf; refuge in prayer; keep far from him (Q 18:1-10)
    read: ["Jāmiʿ 65:8495.2-8496.1"]
    quran: ["18:1-10"]
    tags:
      - {motif: ten-verses-of-kahf-protect-from-dajjal, refs: ["Jāmiʿ 65:8495.2"], note: "من حفظ عشر آيات من أول سورة الكهف عُصِم من الدجال\". وفي لفظ: \"من آخر الكهف"}
      - {motif: refuge-from-dajjal-in-prayer, refs: ["Jāmiʿ 65:8495.3"], note: "سمعت رسول اللَّه ﷺ يستعيذ في صلاته من فتنة الدجال"}
      - {motif: flee-far-from-dajjal, refs: ["Jāmiʿ 65:8496.1"], note: "من سمع بالدجال فلينأ عنه، فواللَّه إن الرجل ليأتيه وهو يحسب أنه مؤمن فيتبعه مما يبعث به من الشبهات"}
  - id: hadith-65-jassasa
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Fāṭima bt. Qays - the Jassāsa and the chained man on the island (Tamīm al-Dārī's story told from the pulpit)
    read: ["Jāmiʿ 65:8496.2"]
    tags:
      - {motif: remove-to-blind-cousin-not-busy-widow, refs: ["Jāmiʿ 65:8496.2"], note: "لا تفعلي إن أم شريك امرأة كثيرة الضيفان فإني أكره أن يسقط عنك خمارك ... ولكن انتقلي إلى ابن عمك عبد اللَّه بن عمرو بن أم مكتوم"}
      - {motif: tamim-shipwreck-island-thirty-men, refs: ["Jāmiʿ 65:8496.2"], note: "لأن تميما الداري كان رجلا نصرانيا، فجاء فبايع، وأسلم ... ركب في سفينة بحرية مع ثلاثين رجلا من لخم وجذام، فلعب بهم الموج شهرًا في البحر"}
      - {motif: jassasa-hairy-beast-front-from-back, refs: ["Jāmiʿ 65:8496.2"], note: "فلقيتهم دابة أهلب كثير الشعر، لا يدرون ما قبله من دبره من كثرة الشعر ... أنا الجساسة"}
      - {motif: chained-giant-in-monastery, refs: ["Jāmiʿ 65:8496.2"], note: "فإذا فيه أعظم إنسان رأيناه قط خلقا، وأشده وثاقا، مجموعة يداه إلى عنقه ما بين ركبتيه إلى كعبيه بالحديد"}
      - {motif: baysan-palms-tiberias-zughar-spring, refs: ["Jāmiʿ 65:8496.2"], note: "أخبروني عن نخل بيسان ... أخبروني عن بحيرة الطبرية ... أخبروني عن عين زغر"}
      - {motif: chained-man-asks-of-unlettered-prophet, refs: ["Jāmiʿ 65:8496.2"], note: "أخبروني عن نبي الأميين ما فعل؟ ... أما إن ذلك خير لهم أن يطيعوه"}
      - {motif: i-am-the-messiah-leave-to-go-out-soon, refs: ["Jāmiʿ 65:8496.2"], note: "إني أنا المسيح، وإني أوشك أن يؤذن لي في الخروج ... فلا أدع قرية إلا هبطتها في أربعين ليلة غير مكة وطيبة"}
      - {motif: angels-with-drawn-swords-at-passes, refs: ["Jāmiʿ 65:8496.2"], note: "استقبلني ملك بيده السيف صلتا يصدني عنها، وإن على كل نقب منها ملائكة يحرسونها"}
      - {motif: this-is-tayba-thrice-staff-on-pulpit, refs: ["Jāmiʿ 65:8496.2"], note: "وطعن بمخصرته في المنبر: \"هذه طيبة، هذه طيبة، هذه طيبة -يعني المدينة-"}
      - {motif: sea-of-syria-or-yemen-no-east, refs: ["Jāmiʿ 65:8496.2"], note: "ألا إنه في بحر الشام أو بحر اليمن، لا بل من قبل المشرق، ما هو! من قبل المشرق"}
    hints:
      - "A great figure bound in iron on a remote island, waiting to be let loose at the end, against Rev 20:1-3, 7 (Satan bound and loosed 'a little season') and 1 Enoch 10:4-5 (Azazel bound hand and foot in the desert)."
  - id: hadith-65-ibn-sayyad
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Ibn Ṣayyād - tested with the hidden word, overheard in his wrap, the throne on the water, his protests to Abū Saʿīd, swelling with anger, sworn to be the Dajjal
    read: ["Jāmiʿ 65:8498.1-8504.1"]
    tags:
      - {motif: ibn-sayyad-says-messenger-of-unlettered, refs: ["Jāmiʿ 65:8498.1", "Jāmiʿ 65:8499.1", "Jāmiʿ 65:8499.2", "Jāmiʿ 65:8501.1", "Jāmiʿ 65:8501.2"], note: "أشهد أنك رسول الأميين، فقال ابن صياد لرسول اللَّه ﷺ: أتشهد أني رسول اللَّه؟ ... آمنت باللَّه وبرسله"}
      - {motif: true-and-false-come-to-him, refs: ["Jāmiʿ 65:8498.1", "Jāmiʿ 65:8499.2", "Jāmiʿ 65:8501.2"], note: "يأتيني صادق وكاذب، فقال له رسول اللَّه ﷺ: \"خلط عليك الأمر\""}
      - {motif: hidden-thing-dukh, refs: ["Jāmiʿ 65:8498.1", "Jāmiʿ 65:8499.1", "Jāmiʿ 65:8501.2"], note: "إني قد خبأت لك خبيئا\"، فقال ابن صياد: هو الدخ، فقال له رسول اللَّه ﷺ: \"اخسأ، فلن تعدو قدرك"}
      - {motif: if-he-is-him-you-cannot-kill-him, refs: ["Jāmiʿ 65:8498.1", "Jāmiʿ 65:8499.1"], note: "إن يكنه فلن تسلط عليه، وإن لم يكنه فلا خير لك في قتله"}
      - {motif: prophet-creeps-behind-palms-to-overhear, refs: ["Jāmiʿ 65:8498.1", "Jāmiʿ 65:8501.2"], note: "طفق يتقي بجذوع النخل، وهو يختل أن يسمع من ابن صياد شيئًا ... يا صاف! (وهو اسم ابن صياد) هذا محمد ... \"لو تركتْه بَيَّنَ\""}
      - {motif: dajjal-said-what-no-prophet-said-one-eyed, refs: ["Jāmiʿ 65:8498.1"], note: "ولكن أقول لكم فيه قولا لم يقله نبي لقومه، تعلَّموا أنه أعور"}
      - {motif: ibn-sayyad-sees-throne-on-water, refs: ["Jāmiʿ 65:8499.2", "Jāmiʿ 65:8501.1", "Jāmiʿ 65:8501.2"], note: "أرى عرشا على الماء، فقال رسول اللَّه ﷺ: \"ترى عرش إبليس على البحر"}
      - {motif: soil-of-paradise-white-flour-pure-musk, refs: ["Jāmiʿ 65:8500.1"], note: "أن ابن صيّاد سأل النبي ﷺ عن تربة الجنة فقال: \"درمكة بيضاء، مسك خالص\""}
      - {motif: ibn-sayyad-thinks-of-hanging-himself, refs: ["Jāmiʿ 65:8500.2"], note: "لقد هممت أن آخذ حبلا فأعلقه بشجرة ثم أختنق مما يقول لي الناس"}
      - {motif: ibn-sayyad-protests-muslim-has-child, refs: ["Jāmiʿ 65:8500.2"], note: "هو كافر\" وأنا مسلم؟ ... \"هو عقيم لا يولد له\"، وقد تركت ولدي بالمدينة؟ ... \"لا يدخل المدينة ولا مكة\"، وقد أقبلت من المدينة وأنا أريد مكة؟"}
      - {motif: ibn-sayyad-knows-where-he-is, refs: ["Jāmiʿ 65:8500.2"], note: "أما واللَّه إني لأعرفه، وأعرف مولده، وأين هو الآن ... أيسرك أنك ذاك الرجل؟ قال: فقال: لو عرض علي ما كرهت"}
      - {motif: if-not-him-no-killing-a-protected-man, refs: ["Jāmiʿ 65:8501.2"], note: "إن يكن هو فلست صاحبه، إنما صاحبه عيسى ابن مريم ﷺ، وإن لا يكن هو فليس لك أن تقتل رجلا من أهل العهد"}
      - {motif: ibn-sayyad-snorts-like-donkey-eye-swollen, refs: ["Jāmiʿ 65:8503.1"], note: "فلقيته لقيةً أخرى وقد نفرت عينه ... فنخر كأشد نخير حمار سمعت ... أني ضربته بعصا كانت معي حتى تكسرت"}
      - {motif: ibn-sayyad-swells-to-fill-street, refs: ["Jāmiʿ 65:8503.1"], note: "فقال له قولا أغضبه، فانتفخ حتى ملأ السكة"}
      - {motif: dajjal-comes-out-from-anger, refs: ["Jāmiʿ 65:8503.1"], note: "إن أول ما يبعثه على الناس غضب يغضبه; إنما يخرج من غضبة يغضبها"}
      - {motif: jabir-swears-ibn-sayyad-is-dajjal, refs: ["Jāmiʿ 65:8503.2"], note: "رأيت جابر بن عبد اللَّه يحلف باللَّه أن ابن الصائد الدجال ... إني سمعت عمر يحلف على ذلك عند النبي ﷺ فلم ينكره النبي ﷺ"}
      - {motif: dukh-or-zukh-you-already-differ, refs: ["Jāmiʿ 65:8504.1"], note: "خبأ لابن صياد دخانًا ... فقال بعضهم: \"دخ\" وقال بعضهم بل قال: ديخ ... قد اختلفتم وأنا بين أظهركم، وأنتم بعدي أشد اختلافا"}
  - id: hadith-65-beast-of-the-earth
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: The Beast of the earth - at forenoon, branding noses, from the greatest mosque (bāb on Q 27:82)
    read: ["Jāmiʿ 65:8505.1-8506.1"]
    quran: ["27:82", "6:158"]
    tags:
      - {motif: beast-comes-out-at-forenoon, refs: ["Jāmiʿ 65:8505.1"], note: "إن أول الآيات خروجا طلوع الشمس من مغربها، وخروج الدابة على الناس ضحى، وأيهما ما كانت قبل صاحبتها فالأخرى على أثرها قريبا"}
      - {motif: three-signs-after-which-faith-avails-not, refs: ["Jāmiʿ 65:8505.2"], note: "ثلاث إذا خرجن لا ينفع نفسا إيمانُها ... طلوع الشمس من مغربها، والدجال، ودابة الأرض"}
      - {motif: beast-marks-noses-buyer-from-marked, refs: ["Jāmiʿ 65:8505.3"], note: "تخرج الدابة، فتسم الناس على خراطيمهم، ثم يغمرون فيكم حتى يشتري الرجل البعير، فيقول: ممن اشتريته؟ فيقول: اشتريتُه من أحد المخطمين"}
      - {motif: beast-from-greatest-mosque-earth-cracks, refs: ["Jāmiʿ 65:8506.1"], note: "تخرج الدابة من أعظم المساجد حرمة، فبينا هم قعود إذ رنت الأرض، فبيناهم كذلك إذ تصدعت"}
    hints:
      - "A beast that brands people so that buying and selling are done under the mark, against Rev 13:16-17, the mark on hand or forehead without which 'no man might buy or sell'."
  - id: hadith-65-sun-from-the-west
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: The sun from the west - its prostration under the throne and the leave withheld; the gate of repentance seventy years wide (Q 6:158)
    read: ["Jāmiʿ 65:8506.2-8509.1"]
    quran: ["6:158"]
    tags:
      - {motif: sun-rises-from-west-all-believe, refs: ["Jāmiʿ 65:8506.2"], note: "حتى تطلع الشمس من مغربها فإذا طلعت ورآها الناس يعني آمنوا أجمعون"}
      - {motif: hour-strikes-mid-trade-mid-meal, refs: ["Jāmiʿ 65:8506.2"], note: "ولتقومن الساعة وهو يليط حوضه فلا يسقي فيه"}
      - {motif: three-signs-after-which-faith-avails-not, refs: ["Jāmiʿ 65:8507.1"], note: "طلوع الشمس من مغربها، والدجال، ودابة الأرض"}
      - {motif: sun-prostrates-under-throne-each-night, refs: ["Jāmiʿ 65:8507.2"], note: "إنّ هذه تجري حتى تنتهي إلى مستقرِّها تحت العرش. فتخرُّ ساجدةً ... ارْتفعي، أصبحي طالعةً من مغربك"}
      - {motif: faith-unaccepted-after-sign-of-the-end, refs: ["Jāmiʿ 65:8507.2", "Jāmiʿ 65:8508.1", "Jāmiʿ 65:8509.1"], note: "ذاك حين ﴿لَا يَنْفَعُ نَفْسًا إِيمَانُهَا لَمْ تَكُنْ آمَنَتْ مِنْ قَبْلُ"}
      - {motif: beast-comes-out-at-forenoon, refs: ["Jāmiʿ 65:8507.3"], note: "وخروج الدابة على الناس ضحى"}
      - {motif: neglect-of-dependants-enough-sin, refs: ["Jāmiʿ 65:8508.1"], note: "كفى إثمًا أن يضيّع الرّجلُ من يقوت"}
      - {motif: sun-asks-leave-refused-lord-how-far-east, refs: ["Jāmiʿ 65:8508.1"], note: "غربتْ فسلّمتْ وسجدت واستأذنت فلا يؤذن لها، فتقول: أيْ ربّ إنّ المسير بعيد وإني لا يؤذن لي، لا أبلغ ... اطْلعي من حيث غربت"}
      - {motif: gog-magog-each-leaves-thousand-offspring, refs: ["Jāmiʿ 65:8508.1"], note: "ما يموتُ الرّجلُ منهم حتى يولد له من صلبه ألف، وإنّ من ورائهم ثلاث أمم، ما يعلم عدَّتَهم إلا اللَّه: منسك، وتاويل، وتاويس"}
      - {motif: repentance-gate-in-west-seventy-years-wide, refs: ["Jāmiʿ 65:8509.1"], note: "إن من قبل مغرب الشمس بابا مفتوحا، عرضه سبعون سنة، فلا يزال ذلك الباب مفتوحا للتوبة حتى تطلع الشمس من نحوه"}
  - id: hadith-65-descent-of-jesus
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: The descent of Jesus - breaks the cross, kills the swine, ends the jizya; the young camels left; forty years and his funeral; the trumpet and the contingent of the fire; not to lead the prayer (Q 4:159)
    read: ["Jāmiʿ 65:8509.2-8510.2", "Jāmiʿ 65:8511.2-8512.1"]
    quran: ["4:159", "37:24", "73:17", "68:42"]
    tags:
      - {motif: jesus-descends-breaks-cross-kills-swine, refs: ["Jāmiʿ 65:8509.2", "Jāmiʿ 65:8509.3", "Jāmiʿ 65:8511.2"], note: "ليوشكنَّ أن ينزل فيكم ابنُ مريم حكمًا عدلًا، فيكسر الصّليب، ويقتل الخنزير، ويضع الجزية"}
      - {motif: wealth-overflows-one-prostration-better, refs: ["Jāmiʿ 65:8509.2"], note: "ويفيض المالُ حمتى لا يقبله أحدٌ حتى تكون السّجدة الواحدة خير من الدّنيا وما فيها"}
      - {motif: young-camels-left-unridden, refs: ["Jāmiʿ 65:8509.3"], note: "ولتتركن القِلاص، فلا يُسعى عليها، ولتذهبن الشحناء والتباغض والتحاسد"}
      - {motif: jesus-remains-forty-years-just-imam, refs: ["Jāmiʿ 65:8510.1"], note: "ثم يمكث عيسى ﵇ في الأرض أربعين سنة إمامًا عدْلًا وحكمًا مقْسطًا"}
      - {motif: dajjal-forty-then-jesus-kills-him, refs: ["Jāmiʿ 65:8510.2"], note: "فيبعث اللَّه عيسى ابن مريم، كأنه عروة بن مسعود، فيطلبه، فيهلكه، ثم يمكث الناس سبع سنين، ليس بين اثنين عداوة"}
      - {motif: cold-wind-from-syria-takes-every-believer, refs: ["Jāmiʿ 65:8510.2"], note: "ثم يرسل اللَّه ريحا باردة من قبل الشام"}
      - {motif: people-like-birds-in-lightness-beasts-in-mind, refs: ["Jāmiʿ 65:8510.2"], note: "فيبقى شرار الناس في خفة الطير وأحلام السباع، لا يعرفون معروفًا ولا ينكرون منكرًا، فيتمثل لهم الشيطان ... فيأمرهم بعبادة الأوثان"}
      - {motif: trumpet-heard-tilting-neck, refs: ["Jāmiʿ 65:8510.2"], note: "ثم ينفخ في الصور، فلا يسمعه أحد إلا أصغى لِيتا ورفع ليتا"}
      - {motif: first-to-hear-trumpet-plastering-his-camels-trough, refs: ["Jāmiʿ 65:8510.2"], note: "وأول من يسمعه رجل يلوط حوض إبله، قال: فيصعق، ويصعق الناس"}
      - {motif: rain-like-dew-bodies-grow, refs: ["Jāmiʿ 65:8510.2"], note: "مطرًا كأنه الطل أو الظل (نعمان الشاك) فتنبت منه أجساد الناس، ثم ينفخ فيه أخرى، فإذا هم قيام ينظرون"}
      - {motif: nine-hundred-ninety-nine-of-thousand-to-fire, refs: ["Jāmiʿ 65:8510.2"], note: "أخرجوا بعث النار، فيقال: من كم؟ فيقال: من كل ألف تسعمائة وتسعة وتسعين"}
      - {motif: no-prophet-between-me-and-jesus, refs: ["Jāmiʿ 65:8511.2"], note: "ليس بيني وبينه نبيٌّ -يعني عيسى ابن مريم- وإنّه نازلٌ، فإذا رأيتموه فاعرفوه"}
      - {motif: jesus-medium-reddish-white-head-drips-dry, refs: ["Jāmiʿ 65:8511.2"], note: "رجل مربوع إلى الحمرة والبياض بين ممصَّرَتين، كأن رأسه يقطر وإن لم يصبه بلل"}
      - {motif: god-destroys-all-religions-but-islam, refs: ["Jāmiʿ 65:8511.2"], note: "ويُهلِكُ اللَّهُ في زمانه المللَ كلَّها إلّا الإسلام"}
      - {motif: jesus-forty-years-dies-muslims-pray-over-him, refs: ["Jāmiʿ 65:8511.2"], note: "فيمكث في الأرض أربعين سنة، ثم يتوفّى، فيصلي عليه المسلمون"}
      - {motif: some-of-you-commanders-over-others, refs: ["Jāmiʿ 65:8512.1"], note: "فيقول أميرهم: تعال صلِّ لنا. فيقول: لا، إنّ بعضكم على بعض أمراء تكرمةَ اللَّه هذه الأمّة"}
      - {motif: band-fights-until-hour, refs: ["Jāmiʿ 65:8512.1"], note: "لا تزال طائفةٌ من أمّتي يقاتلون على الحقّ ظاهرين إلى يوم القيامة"}
    hints:
      - "Jesus breaking the cross and dying a natural death after forty years with Muslims praying over him, against the Christian expectation of the returning Christ who reigns (Rev 20:4-6, a thousand years) - the same returner, a different reign and end."
      - "A rain like dew from which the dead grow their bodies against Isa 26:19, 'thy dew is as the dew of herbs, and the earth shall cast out the dead'."
  - id: hadith-65-mahdi
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: The Mahdī - of the prophet's house and Fāṭima's line, his name like the prophet's, filling the earth with justice; the caliph who scoops out wealth; your imam from among you
    read: ["Jāmiʿ 65:8512.2-8518.3"]
    tags:
      - {motif: mahdi-bald-brow-hooked-nose-seven-years, refs: ["Jāmiʿ 65:8512.2", "Jāmiʿ 65:8513.1"], note: "المهدي مني أجلى الجبهة، أقنى الأنف، يملأ الأرض قسطا وعدلا كما ملئت جورًا وظلمًا، ويملك سبع سنين"}
      - {motif: man-of-my-family-fills-earth-with-justice, refs: ["Jāmiʿ 65:8512.3", "Jāmiʿ 65:8515.1"], note: "ثم يخرج رجل من عِترتي أو من أهل بيتي يملؤها قسطا وعدلا كما ملئت ظلمًا وعدوانًا"}
      - {motif: mahdi-time-rain-plenty-wealth-correct, refs: ["Jāmiʿ 65:8513.2"], note: "يخرج في آخر أمتي المهدي، يسقيه اللَّه الغيث، وتخرج الأرض نباتها، ويعطي المال صحاحًا، وتكثر الماشية، وتعظم الأمة، يعيش سبعًا أو ثمانيا"}
      - {motif: mahdi-name-like-prophets-father-like-his-father, refs: ["Jāmiʿ 65:8514.1"], note: "لو لم يبق من الدنيا إلا يوم لطول اللَّه ذلك اليوم حتى يبعمث اللَّه فيه رجلا مني -أو من أهل بيتي- يواطئ اسمه اسمي، واسم أبيه اسم أبي"}
      - {motif: last-night-a-man-of-the-house-rules, refs: ["Jāmiʿ 65:8514.2"], note: "لو لم يبق من الدنيا إلا ليلة لملك فيها رجل من أهل بيت النبي ﷺ"}
      - {motif: mahdi-from-children-of-fatima, refs: ["Jāmiʿ 65:8515.2"], note: "المهدي من عترتي، من ولد فاطمة"}
      - {motif: mahdi-invites-jesus-to-lead, refs: ["Jāmiʿ 65:8516.1", "Jāmiʿ 65:8516.2"], note: "ينزل عيسى ابن مريم فيقول أميرهم المهدي: تعال صلِّ بنا، فيقول: لا، إن بعضهم أمير بعض، تكرمة اللَّه لهذه الأمة"}
      - {motif: your-imam-from-among-you, refs: ["Jāmiʿ 65:8517.1"], note: "كيف أنتم إذا نزل ابنُ مريم، وإمامُكم منكم؟"}
      - {motif: caliph-scatters-wealth-without-counting, refs: ["Jāmiʿ 65:8518.1", "Jāmiʿ 65:8518.2", "Jāmiʿ 65:8518.3"], note: "يكون في آخر الزمان خليفة يقسم المال ولا يعده; خليفة يحثو المال حثيا لا يعده عددًا"}
      - {motif: iraq-and-syria-cut-off-from-tribute, refs: ["Jāmiʿ 65:8518.3"], note: "يوشك أهل العراق ألا يجبى إليهم قفيز ولا درهم ... من قبل العَجَم ... يوشك أهل الشام أن لا يجبى إليهم دينار ولا مُدْي ... من قبل الروم"}
    hints:
      - "God lengthening the last day so that the Mahdī may come, against Matt 24:22, where 'for the elect's sake those days shall be shortened' - the same last days, the opposite adjustment."
  - id: hadith-65-gog-and-magog
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Gog and Magog - Tiberias drunk dry, arrows at heaven, worms on the neck, their weapons burned seven years, the barrier dug daily until 'if God wills', the ring of fingers (bāb on Q 21:96-97, 18:94-96)
    read: ["Jāmiʿ 65:8519.1-8522.1"]
    quran: ["21:96-97", "18:94-96"]
    tags:
      - {motif: gog-magog-drink-lake-tiberias, refs: ["Jāmiʿ 65:8519.1"], note: "فيمرُّ أَوائِلُهم على بُحيرةِ طَبَريَّةَ فيشربون ما فيها"}
      - {motif: gog-magog-killed-by-neck-worms, refs: ["Jāmiʿ 65:8519.1"], note: "فيرسل اللَّه عليهمُ النَّغَفَ في رقابِهم فيصبحون فَرْسَى كموت نفسٍ واحدةٍ"}
      - {motif: jabal-al-khamr-is-jerusalems-mountain, refs: ["Jāmiʿ 65:8519.1"], note: "حتى ينتهوا إلى جبل الخمر -وهو جبل بيت المقدس-"}
      - {motif: shoot-arrows-at-heaven-return-bloodied, refs: ["Jāmiʿ 65:8519.1", "Jāmiʿ 65:8520.1", "Jāmiʿ 65:8521.1"], note: "هلمَّ فلنقتل من في السماء، فيرمون بنشابهم إلى السماء، فيرد اللَّه عليهم نشابهم مخضوبة دمًا"}
      - {motif: muslims-burn-gog-weapons-seven-years, refs: ["Jāmiʿ 65:8519.2"], note: "سيوقد المسلمون من قسي يأجوج ومأجوج، ونشا بهم، وأترستهم، سبع سنين"}
      - {motif: gog-magog-released-at-end, refs: ["Jāmiʿ 65:8520.1"], note: "يفتح يأجوج ومأجوج يخرجون على الناس كما قال اللَّه ﷿: ﴿مِنْ كُلِّ حَدَبٍ يَنْسِلُونَ"}
      - {motif: gog-magog-drink-lake-tiberias, refs: ["Jāmiʿ 65:8520.1"], note: "حتى إن بعضهم ليمر بالنهر فيشربون ما فيه، حتى يتركوه يبسا ... قد كان هاهنا ماء مرة"}
      - {motif: volunteer-goes-down-finds-them-dead, refs: ["Jāmiʿ 65:8520.1"], note: "ألا رجل يشري نفسه، فينظر ما فعل هذا العدو ... فيجدهم موتى بعضهم على بعض، فينادي يا معشرالمسلمين، ألا أبشروا"}
      - {motif: beasts-fatten-on-gog-flesh, refs: ["Jāmiʿ 65:8520.1", "Jāmiʿ 65:8521.1"], note: "فما يكون لها رعي إلا لحومهم، فتشكر عنه; إن دواب الأرض لتسمن شكرًا من لحومهم ودمائهم"}
      - {motif: gog-magog-dig-barrier-daily, refs: ["Jāmiʿ 65:8521.1"], note: "إن يأجوج ومأجوج ليحفرون السد كل يوم، حتى إذا كادوا يرون شعاع الشمس، قال الذي عليهم: ارجعوا فستحفرونه غدا"}
      - {motif: gog-will-say-in-sha-allah, refs: ["Jāmiʿ 65:8521.1"], note: "ارجعوا فستحفرونه غدًا إن شاء اللَّه، ويستثني، فيعودون إليه وهو كهيئته حين تركوه"}
      - {motif: pilgrimage-continues-after-gog-and-magog, refs: ["Jāmiʿ 65:8521.2"], note: "ليحجن البيت وليعتمرن بعد خروج يأجوج ومأجوج"}
      - {motif: opening-of-barrier-like-this-ninety, refs: ["Jāmiʿ 65:8521.3", "Jāmiʿ 65:8522.1"], note: "ويل للعرب، من شر قد اقترب، فتح اليوم من ردم يأجوج ومأجوج مثل هذه\" -وعقد سفيان تسعين أو مائة-"}
      - {motif: destroyed-though-righteous-when-filth-abounds, refs: ["Jāmiʿ 65:8521.3"], note: "قيل: أنهلك، وفينا الصالحون؟ قال: \"نعم، إذا كثر الخبث\""}
    hints:
      - "The Muslims kindling fires from Gog's bows, arrows and shields for seven years against Ezek 39:9-10, Israel burning Gog's 'shields and bucklers, the bows and the arrows ... seven years'."
      - "Beasts fattening on Gog's flesh and blood against Ezek 39:17-19, the birds and beasts summoned to 'eat the flesh of the mighty and drink the blood'."
  - id: hadith-65-three-sinkings
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Three sinkings - east, west and Arabia; a land with Muslims swallowed when filth is most
    read: ["Jāmiʿ 65:8522.2-8522.3"]
    tags:
      - {motif: ten-major-signs-listed, refs: ["Jāmiʿ 65:8522.2"], note: "وثلاث خسوف: خسف بالمشرق، وخسف بالمغرب، وخسف بجزيرة العرب"}
      - {motif: sinking-in-east-with-muslims, refs: ["Jāmiʿ 65:8522.3"], note: "ذكر في زمان النبي ﷺ خسف قبل المشرق فقال بعض الناس: يا رسول اللَّه، يخسف بأرض فيها المسلمون؟ فقال: \"نعم، إذا كان أكثر أهلها الخبث\""}
  - id: hadith-65-fire-that-gathers
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: The fire that drives people to their gathering - from Aden, from Ḥaḍramawt; ʿAbd Allāh b. Salām's three questions; gathered riding, walking, on their faces (Q 2:97)
    read: ["Jāmiʿ 65:8522.4-8525.2"]
    quran: ["2:97"]
    tags:
      - {motif: fire-from-aden-moves-and-rests-with-them, refs: ["Jāmiʿ 65:8522.4"], note: "وآخر ذلك نار تخرج من اليمن تطرد النّاس إلى محشرهم ... ونارٌ تخرج من قُعرة عدن ترحل الناس ... تنزل معهم إذا نزلوا، وتقيل معهم إذا قالوا ... وريح تُلقي الناس في البحر"}
      - {motif: ibn-salam-three-questions, refs: ["Jāmiʿ 65:8523.1"], note: "إنّي سائلُك عن ثلاثٍ لا يعلمهُنّ إلّا نَبيٌّ: فما أوّل أشراط السّاعة؟ وما أوّل طعام أهل الجنة؟ وما ينزع الولد إلى أبيه أو إلى أمه؟"}
      - {motif: gabriel-enemy-of-jews, refs: ["Jāmiʿ 65:8523.1"], note: "ذاك عدو اليهود من الملائكة فقرأ هذه الآية: ﴿مَنْ كَانَ عَدُوًّا لِجِبْرِيلَ"}
      - {motif: fire-gathers-from-east-to-west, refs: ["Jāmiʿ 65:8523.1", "Jāmiʿ 65:8523.2"], note: "أمّا أوّل أشراط السّاعة فنار تحشر الناس من المشرق إلى المغرب"}
      - {motif: first-food-of-paradise-fish-liver-lobe, refs: ["Jāmiʿ 65:8523.1"], note: "وأما أوّل طعام أهل الجنّة فزيادة كبد حوتٍ"}
      - {motif: whose-fluid-precedes-child-resembles, refs: ["Jāmiʿ 65:8523.1"], note: "وإذا سبق ماءُ الرّجل ماء المرأة نزع الولد، وإذا سبق ماءُ المرأة نزعت"}
      - {motif: jews-praise-then-revile-ibn-salam, refs: ["Jāmiʿ 65:8523.1"], note: "قالوا: خيرنا وابن خيرنا، وسيّدنا وابن سيدنا ... فقالوا: شرّنا وابن شرنا، وانتقصوه"}
      - {motif: fire-from-hadramawt-go-to-syria, refs: ["Jāmiʿ 65:8524.1"], note: "ستخرج نار من حضرموت أو من نحو بحر حضرموت قبل يوم القيامة تحشر الناس\". قالوا: يا رسول اللَّه فما تأمرنا؟ قال: \"عليكم بالشام\""}
      - {motif: gathered-two-three-four-ten-on-a-camel, refs: ["Jāmiʿ 65:8524.2"], note: "يحشر الناس ثلاث طرائق راغبين راهبين، واثنان على بعير، وثلاثة على بعير، وأربعة على بعير، وعشرة على بعير، وتحشر بقيتهم النار، تبيت معهم حيث باتوا، وتقيل معهم حيث قالوا"}
      - {motif: three-companies-riding-walking-dragged, refs: ["Jāmiʿ 65:8524.3"], note: "أن الناس يحشرون على ثلاثة أفواج: فوج راكبين طاعمين كاسين، وفوج يمشون ويسعون، وفوج تسحبهم الملائكة على وجوههم"}
      - {motif: orchard-traded-for-old-camel, refs: ["Jāmiʿ 65:8524.3"], note: "يلقي اللَّه الآفة على الظهر حتى لا يبقى ظهر، حتى إن الرجل ليكون له الحديقة المعجبة، فيعطيها بالشارف ذات القتب، فلا يقدر عليها"}
      - {motif: gathered-on-faces-mouths-bridled, refs: ["Jāmiʿ 65:8525.1", "Jāmiʿ 65:8525.2"], note: "إنكم محشورون رجالا وركبانا، وتجرون على وجوهكم; على أفواهكم الفدام، توفون سبعين أمة، أنتم أخيرهم وأكرمهم على اللَّه"}
      - {motif: sworn-by-fingers-not-to-follow, refs: ["Jāmiʿ 65:8525.2"], note: "إني حلفت بعدد أصابعي ألا أتبعك ولا أتبع دينك"}
      - {motif: wifes-right-feed-clothe-no-face-blow, refs: ["Jāmiʿ 65:8525.2"], note: "تطعمها إذا طعمتَ، وتكسوها إذا اكتسيتَ، ولا تضرب الوجهَ، ولا تقبحه، ولا تهجر إلا في البيت"}
      - {motif: thigh-first-to-speak, refs: ["Jāmiʿ 65:8525.2"], note: "وإن أول ما يعرب على أحدكم فخذه"}
    hints:
      - "A fire that drives the people on, halting where they halt and resting at noon where they rest, against Exod 13:21-22 and Num 9:17-23, the pillar of fire and cloud that moves and rests with Israel's camp."
