      - {motif: medina-quakes-three-times-expels-hypocrites, refs: ["Jāmiʿ 65:8493.1"], note: "ثم ترجف المدينة بأهلها ثلاث رجفاتٍ، فيخرج اللَّهُ كل كافرٍ ومنافقٍ"}
      - {motif: plague-and-dajjal-kept-from-medina, refs: ["Jāmiʿ 65:8493.2", "Jāmiʿ 65:8493.4"], note: "على أنقاب المدينة ملائكة لا يدخلها الطاعون ولا الدجال"}
