      - {motif: band-eats-pomegranate-shades-in-rind, refs: ["Jāmiʿ 65:8478.3"], note: "فيومئذ تَأْكُلُ العصابة من الرُّمانة، ويستظلون بقِحْفِها ... إنّ اللَّقْحَةَ من الإبل لتكفي الفئام من الناس"}
      - {motif: wind-takes-believers-under-armpits, refs: ["Jāmiʿ 65:8478.3"], note: "إذ بعث اللَّهُ ريحًا طيّبة فتأخذهم تحت آباطهم ... يتهارجون فيها تهارج الحمر فعليهم تقوم السّاعة"}
