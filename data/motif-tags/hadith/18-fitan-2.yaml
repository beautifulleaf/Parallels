      - {motif: dajjal-from-jewry-of-isfahan, refs: ["Jāmiʿ 65:8487.2"], note: "إنّه يخرج في يهودية أصبهان، حتى يأتي المدينة"}
      - {motif: medina-seven-gates-two-angels-each, refs: ["Jāmiʿ 65:8487.2"], note: "ولها يومئذ سبعة أبواب، على كلّ نقب منها ملكان"}
      - {motif: jesus-kills-dajjal-at-gate-of-lydda, refs: ["Jāmiʿ 65:8487.2"], note: "حتى يأتي فلسطين باب لُدَّ، فينزل عيسى ﵇ فيقتله"}
      - {motif: jesus-remains-forty-years-just-imam, refs: ["Jāmiʿ 65:8487.2"], note: "ثم يمكث عيسى ﵇ في الأرض أربعين سنة إمامًا عدْلًا وحكمًا مقْسطًا"}
      - {motif: dajjal-from-khurasan-shield-faced-followers, refs: ["Jāmiʿ 65:8488.1", "Jāmiʿ 65:8488.2"], note: "الدجال يخرج من أرض بالمشرق يقال لها: خراسان يتبعه أقوام كأنّ وجوههم المجان المطرقة; يخرج الدجال من هاهنا، وأشار نحو المشرق"}
  - id: hadith-65-dajjal-hubuk-and-abu-tufayl
