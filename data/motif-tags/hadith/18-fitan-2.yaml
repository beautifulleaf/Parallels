    tagger: "Claude Opus 5.5, reading the Arabic"
    title: The Dajjal one-eyed with k-f-r on his brow; his paradise and fire, his water and fire; none greater since Adam; flight to the mountains; every prophet warned
    read: ["Jāmiʿ 65:8473.2-8475.2"]
    tags:
      - {motif: dajjal-one-eyed-god-not, refs: ["Jāmiʿ 65:8473.2", "Jāmiʿ 65:8475.2"], note: "ألا إنه أعور، وإن ربكم ليس بأعور"}
      - {motif: dajjal-has-kafir-written-between-eyes, refs: ["Jāmiʿ 65:8473.2", "Jāmiʿ 65:8473.3", "Jāmiʿ 65:8474.3", "Jāmiʿ 65:8475.1"], note: "ومكتوب بين عينيه: ك ف ر"}
      - {motif: kafir-spelled-k-f-r, refs: ["Jāmiʿ 65:8473.3", "Jāmiʿ 65:8474.3"], note: "مكتوب بين عينيه كافر، ثم تهجاها ك ف ر، يقرؤه كل مسلم; يقرؤه كل مؤمن كاتب وغير كاتب"}
      - {motif: every-prophet-warned-of-the-dajjal-noah-first, refs: ["Jāmiʿ 65:8473.2", "Jāmiʿ 65:8473.4", "Jāmiʿ 65:8475.2"], note: "ما من نبي إلا وقد أنذر أمته الأعور الكذاب; لقد أنذره نوح قومه"}
      - {motif: dajjal-warned-as-noah-warned, refs: ["Jāmiʿ 65:8473.4"], note: "وإني أنذرتكم به كما أنذر به نوح قومه"}
      - {motif: dajjals-paradise-is-fire, refs: ["Jāmiʿ 65:8473.4", "Jāmiʿ 65:8474.4"], note: "يجيء معه مثل الجنة والنار، فالتي يقول: إنها الجنة، هي النار; معه جنةٌ ونارٌ، فنارُه جنةٌ، وجنته نارٌ"}
      - {motif: no-creature-greater-than-dajjal, refs: ["Jāmiʿ 65:8473.5"], note: "ما بين خلق آدم إلى قيام الساعة خلق أكبر من الدجال"}
      - {motif: people-flee-dajjal-to-mountains-arabs-few, refs: ["Jāmiʿ 65:8474.1"], note: "ليفرن الناس من الدجال في الجبال ... فأين العرب يومئذ؟ قال: \"هم قليل\""}
      - {motif: dajjals-water-is-fire-fall-into-fire, refs: ["Jāmiʿ 65:8474.2"], note: "فأما الذي يراه الناسُ ماءًا، فنارٌ تحرق، وأما الذي يراه الناس نارًا، فماءٌ باردٌ عذبٌ، فمن أدرك ذلك منكم فليقعْ في الذي يراه نارًا"}
      - {motif: dajjal-two-rivers-close-eyes-and-drink, refs: ["Jāmiʿ 65:8474.3"], note: "معه نهران يجريان ... فليأت النهر الذي يراه نارًا وليغمض، ثم ليطأطئ رأسه فيشرب منه، فإنه ماء بارد"}
      - {motif: dajjal-eye-with-thick-nail, refs: ["Jāmiʿ 65:8474.3"], note: "وإن الدجال ممسوح العين، عليها ظفرة غليظة"}
      - {motif: dajjal-left-eye-blind-thick-hair, refs: ["Jāmiʿ 65:8474.4"], note: "الدجال أعور العين اليسرى، جُفال الشعر"}
      - {motif: lesser-trials-prepare-for-dajjal, refs: ["Jāmiʿ 65:8475.1"], note: "لفتنة بعضكم أخوف عندي من فتنة الدجال، إنها ليستْ من فتنة صغيرة، ولا كبيرة إلا تضع لفتنة الدجال"}
      - {motif: dajjal-said-what-no-prophet-said-one-eyed, refs: ["Jāmiʿ 65:8475.2"], note: "ولكن أقول لكم فيه قولا لم يقله نبي لقومه، تعلّموا أنه أعور"}
    hints:
      - "Signs that look like the opposite of what they are (fire that is water, paradise that is fire) against 2 Cor 11:14 'Satan himself is transformed into an angel of light' and 2 Thess 2:9-10 'lying wonders'."
