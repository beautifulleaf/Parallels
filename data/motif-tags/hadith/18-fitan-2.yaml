      - {motif: band-fights-until-hour, refs: ["Jāmiʿ 65:8468.1"], note: "لا تزال عصابة من أمتي يقاتلون على أمر اللَّه، قاهرين لعدوهم ... حتى تأتيهم الساعة"}
      - {motif: wind-like-musk-touch-of-silk, refs: ["Jāmiʿ 65:8468.1"], note: "ثم يبعث اللَّه ريحا كريح المسك، مسها مس الحرير"}
      - {motif: lat-and-uzza-worshipped-again-after-good-wind, refs: ["Jāmiʿ 65:8468.2"], note: "لا يذهب الليل والنهار حتى تعبد اللات والعزى ... فيرجعون إلى دين آبائهم"}
      - {motif: dajjal-forty-then-jesus-kills-him, refs: ["Jāmiʿ 65:8468.3"], note: "فيمكث أربعين -لا أدري أربعين يومًا أو أربعين شهرًا أو أربعين عامًا- فيبعث اللَّه عيسى ابن مريم، كأنه عروة بن مسعود"}
      - {motif: cold-wind-from-syria-takes-every-believer, refs: ["Jāmiʿ 65:8468.3"], note: "ثم يرسل اللَّه ريحا باردة من قبل الشام ... حتى لو أن أحدكم دخل في كبد جبل لدخلته عليه"}
      - {motif: yemen-wind-softer-than-silk, refs: ["Jāmiʿ 65:8469.1"], note: "إن اللَّه يبعث ريحًا من اليمن ألينَ من الحرير"}
      - {motif: hour-only-on-worst-people, refs: ["Jāmiʿ 65:8469.2"], note: "لا تقوم الساعة إلا على شرار الناس"}
      - {motif: worst-are-those-alive-at-hour-and-grave-mosques, refs: ["Jāmiʿ 65:8469.3"], note: "إن من شرار الناس من تدركه الساعة، وهم أحياء، ومن يتخذ القبور مساجد"}
      - {motif: righteous-go-one-by-one-dregs-remain, refs: ["Jāmiʿ 65:8470.1"], note: "يذهب الصالحون الأول فالأول، ويبقى حفالة كحفالة الشعير أو التمر لا يباليهم اللَّه بالة"}
      - {motif: sifted-like-dates-die-if-you-can, refs: ["Jāmiʿ 65:8470.2"], note: "لتنتقون كما ينتقى التمر من أغفاله، فليذهبن خياركم، وليبقين شراركم، فموتوا إن استطعتم"}
      - {motif: no-one-says-allah-allah, refs: ["Jāmiʿ 65:8471.1"], note: "لا تقوم الساعة حتى لا يقال في الأرض: اللَّه اللَّه"}
      - {motif: hour-on-dregs-of-people, refs: ["Jāmiʿ 65:8471.2"], note: "لا تقوم الساعة إلا على حثالة الناس"}
