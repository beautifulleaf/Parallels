      - {motif: angels-guard-gates-of-mecca-and-medina, refs: ["Jāmiʿ 65:8481.1"], note: "يرد كل ماء ومنهل إلا المدينة ومكة، حرمهما اللَّه عليه، وقامت الملائكة بأبوابها"}
      - {motif: dajjals-paradise-is-fire, refs: ["Jāmiʿ 65:8481.1"], note: "نهر يقول الجنة، ونهر يقول النار، فمن أدخل الذي يسميه الجنة فهو النار"}
      - {motif: dajjal-devils-speak-to-people, refs: ["Jāmiʿ 65:8481.1"], note: "ويبعث اللَّه معه شياطين، تكلم الناس"}
      - {motif: dajjal-kills-and-revives-in-appearance, refs: ["Jāmiʿ 65:8481.1"], note: "يأمر السماء فتمطر فيما يرى الناس، ويقتل نفسا ثم يحييها فيما يرى الناس، لا يسلط على غيرها من الناس"}
      - {motif: muslims-flee-to-mountain-of-smoke, refs: ["Jāmiʿ 65:8481.1"], note: "فيفر المسلمون إلى جبل الدخان بالشام، فيأتيهم، فيحاصرهم فيشتد حصارهم"}
      - {motif: jesus-calls-at-dawn-come-out-to-the-liar, refs: ["Jāmiʿ 65:8481.1"], note: "ثم ينزل عيسى ابن مريم فينادي من السحر، فيقول: يا أيها الناس ما يمنعكم أن تخرجوا إلى الكذاب الخبيث؟ فيقولون: هذا رجل جني"}
      - {motif: jesus-declines-to-lead-prayer, refs: ["Jāmiʿ 65:8481.1"], note: "فيقال له: تقدَّمْ يا روح اللَّه، فيقول: ليتقدَّمْ إمامكم، فليصلِّ بكم"}
      - {motif: dajjal-melts-like-salt-at-jesus, refs: ["Jāmiʿ 65:8481.1"], note: "فحين يرى الكذاب ينماث كما ينماث الملح في الماء"}
      - {motif: tree-and-stone-call-spirit-of-god, refs: ["Jāmiʿ 65:8481.1"], note: "حتى إن الشجرة والحجر ينادي: يا روح اللَّه، هذا يهودي"}
      - {motif: dajjal-worst-liar, refs: ["Jāmiʿ 65:8482.1"], note: "الدجال أعور وهو أشد الكذابين"}
    hints:
      - "The Dajjal riding a donkey against Zech 9:9, the king who comes 'lowly, and riding upon an ass'."
      - "Making rain fall and raising the dead 'in what people see', and devils speaking for him, against Rev 13:13-15 (the second beast makes fire fall and gives breath to the image)."
  - id: hadith-65-abu-umama-dajjal-sermon
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Abū Umāma's sermon - prophet then lord; Kahf against his fire as for Abraham; the parents' likeness; the sawn man; the three quakes of Medina; Jesus and the imam; seventy thousand Jews; the peaceable earth; the three years of drought (Q 18 opening, 21:69)
    read: ["Jāmiʿ 65:8482.2"]
    quran: ["18:1-10", "21:69"]
    tags:
      - {motif: no-trial-since-adam-greater-than-dajjal, refs: ["Jāmiʿ 65:8482.2"], note: "إنه لم تكن فتنة في الأرض منذ ذرأ اللَّه ذرية آدم أعظم من فتنة الدجال"}
      - {motif: last-prophet-last-community, refs: ["Jāmiʿ 65:8482.2"], note: "وأنا آخر الأنبياء، وأنتم آخر الأمم"}
      - {motif: prophet-as-dajjals-adversary, refs: ["Jāmiʿ 65:8482.2"], note: "وإن يخرج وأنا بين ظهرانيكم فأنا حجيج لكل مسلم، وإن يخرج من بعدي فكل امريء حجيج نفسه"}
      - {motif: dajjal-first-claims-prophecy-then-lordship, refs: ["Jāmiʿ 65:8482.2"], note: "إنه يبدؤ فيقول أنا نبي ولا نبي بعدي، ثم يثني فيقول: أنا ربكم، ولا ترون ربكم حتى تموتوا"}
      - {motif: kahf-makes-dajjals-fire-cool-as-for-abraham, refs: ["Jāmiʿ 65:8482.2"], note: "فمن ابتلي بناره فليستغث باللَّه وليقرأ فواتح الكهف، فتكون عليه بردًا وسلامًا، كما كانت النار على إبراهيم"}
      - {motif: devils-take-form-of-parents, refs: ["Jāmiʿ 65:8482.2"], note: "أرأيت إن بعثت لك أباك وأمك ... فيتمثل له شيطانان في صورة أبيه وأمه، فيقولان: يا بني اتبعه، فإنه ربك"}
      - {motif: dajjal-saws-man-in-two, refs: ["Jāmiʿ 65:8482.2"], note: "أن يسلّط على نفس واحدة فيقتلها وينشرها بالمنشار حتى يلقى شقتين ... ويقول له الخبيث: من ربك؟"}
      - {motif: never-surer-of-you-than-today, refs: ["Jāmiʿ 65:8482.2"], note: "ربي اللَّه وأنت عدو اللَّه، أنت الدجال، واللَّه ما كنت بعد أشد بصيرة بك مني اليوم"}
      - {motif: refusers-herds-perish, refs: ["Jāmiʿ 65:8482.2"], note: "أن يمر بالحي فيكذبونه، فلا تبقى لهم سائمة إلا هلكت"}
      - {motif: angels-with-drawn-swords-at-passes, refs: ["Jāmiʿ 65:8482.2"], note: "إلا مكة والمدينة، لا يأتيهما من نقب من نقابهما إلا لقيته الملائكة بالسيوف صلتةً"}
      - {motif: medina-quakes-three-times-expels-hypocrites, refs: ["Jāmiʿ 65:8482.2"], note: "فترجف المدينة بأهلها ثلاث رجفات ... فتنفي الخبث منها كما ينفي الكير خبث الحديد ويدعى ذلك اليوم يوم الخلاص"}
      - {motif: imam-steps-back-jesus-hand-between-shoulders, refs: ["Jāmiʿ 65:8482.2"], note: "فرجع ذلك الإمام ينكص يمشي القهقري ليتقدم عيسى يصلى بالناس، فيضع عيسى يده بين كتفيه ثم يقول له تقدم فصلِّ، فإنها لك أقيمت"}
      - {motif: dajjal-with-seventy-thousand-jews-armed, refs: ["Jāmiʿ 65:8482.2"], note: "ووراءه الدجال، معه سبعون ألف يهودي، كلهم ذو سيف محلى وساج"}
      - {motif: i-have-a-blow-for-you, refs: ["Jāmiʿ 65:8482.2"], note: "إن لي فيك ضربة لن تسبقني بها، فيدركه عند باب اللد الشرقي فيقتله"}
      - {motif: everything-speaks-but-gharqad, refs: ["Jāmiʿ 65:8482.2"], note: "لا حجر ولا شجر ولا حائط ولا دابة (إلا الغرقدة فإنها من شجرهم لا تنطق) إلا قال يا عبد اللَّه المسلم هذا يهودي"}
      - {motif: dajjal-forty-years-like-sparks, refs: ["Jāmiʿ 65:8482.2"], note: "وإن أيامه أربعون سنة، السنة كنصف السنة ... وآخر أيامه كالشررة، يصبح أحدكم على باب المدينة، فلا يبلغ بابها الآخر حتى يمسي"}
      - {motif: jesus-just-judge-removes-venom-and-enmity, refs: ["Jāmiʿ 65:8482.2"], note: "وتنزع حمة كل ذات حمة حتى يدخل الوليد يده في الحية فلا تضره، وتفر الوليدة الأسد فلا تضرها، ويكون الذئب في الغنم كأنه كلبها"}
      - {motif: earth-filled-with-peace-as-vessel-with-water, refs: ["Jāmiʿ 65:8482.2"], note: "وتملأ الأرض من السلم كما يملأ الإناء من الماء ... وتضع الحرب أوزارها، وتسلب قريش ملكها"}
      - {motif: earth-like-silver-platter-grows-as-in-adams-time, refs: ["Jāmiʿ 65:8482.2"], note: "وتكون الأرض كفاثور الفضة تنبت نباتها بعهد آدم حتى يجتمع النفر على القطف من العنب فيشبعهم"}
      - {motif: ox-dear-horse-cheap, refs: ["Jāmiʿ 65:8482.2"], note: "ويكون الثور بكذا وكذا من المال، وتكون الفرس بالدريهمان ... \"لا يركب لحرب أبدًا\" ... \"تحرث الأرض كلها\""}
      - {motif: three-years-of-withheld-rain-before-dajjal, refs: ["Jāmiʿ 65:8482.2"], note: "وأن قبل خروج الدجال ثلاث سنوات شداد ... أن تحبس ثلث مطرها ... فتحبس مطرها كله فلا تقطر قطرة"}
      - {motif: praise-feeds-them-as-food, refs: ["Jāmiʿ 65:8482.2"], note: "التهليل والتكبير والتسبيح والتحميد، ويجري ذلك عليهم مجرى الطعام"}
    hints:
      - "The child's hand on the snake, the lion, the wolf among the sheep in Jesus's reign against Isa 11:6-8, 'the wolf also shall dwell with the lamb ... the weaned child shall put his hand on the cockatrice' den'."
      - "The earth full of peace as a vessel of water against Isa 11:9, 'the earth shall be full of the knowledge of the LORD, as the waters cover the sea'."
      - "The horse cheap because never ridden to war, the ox dear because it ploughs, against Isa 2:4 / Mic 4:3, swords into ploughshares."
      - "The man sawn in two and still confessing against the Christian Martyrdom of Isaiah (Ascension of Isaiah 5:1-14) and Heb 11:37 'they were sawn asunder'."
      - "Three years of withheld rain before the Dajjal against 1 Kgs 17:1 / 18:1 and Luke 4:25, Jas 5:17 (heaven shut three years and six months), and Rev 11:6."
  - id: hadith-65-asma-dajjal-famine
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: Asmāʾ bt. Yazīd - the three years of drought, the camels and kin impersonated, kneading before hunger
    read: ["Jāmiʿ 65:8485.1"]
    tags:
      - {motif: three-years-of-withheld-rain-before-dajjal, refs: ["Jāmiʿ 65:8485.1"], note: "إن بين يديه ثلاث سنين، سنة تمسك السماء ثلث قطرها ... والثالثة تمسك السماء قطرها كله"}
      - {motif: devil-takes-form-of-camels-and-kin, refs: ["Jāmiʿ 65:8485.1"], note: "أرأيت إن أحييت لك إبلا ... فيتمثل له الشيطان نحو إبله ... فيتمثل له الشيطان نحو أبيه ونحو أخيه"}
      - {motif: prophet-as-dajjals-adversary, refs: ["Jāmiʿ 65:8485.1"], note: "إن يخرج وأنا حي فأنا حجيجه، وإلا فإن ربي خليفتي من بعدي على كل مؤمن"}
      - {motif: we-knead-and-hunger-before-baking, refs: ["Jāmiʿ 65:8485.1"], note: "واللَّه إنا لنعجن عجينتنا فما نخبزها حتى نجوع فكيف بالمؤمنين يومئذ؟"}
      - {motif: praise-feeds-them-as-food, refs: ["Jāmiʿ 65:8485.1"], note: "يجزئهم ما يجزئ أهل السماء من التسبيح والتقديس"}
  - id: hadith-65-dajjal-features-2
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: White and gleaming, head like a viper; read by unlettered and literate; two angels like prophets at his side; 'this is that man's village'; destroyed at the pass of Afīq
    read: ["Jāmiʿ 65:8486.1-8487.1"]
    tags:
      - {motif: dajjal-white-gleaming-head-like-viper, refs: ["Jāmiʿ 65:8486.1"], note: "أعور هجان أزهر كأن رأسه أصلة، أشبه الناس بعبد العزى بن قطن"}
      - {motif: dajjal-read-by-unlettered-and-literate, refs: ["Jāmiʿ 65:8486.2"], note: "الدجال أعور بعين الشمال، بين عينيه مكتوب: كافر يقرؤه الأمي والكاتب"}
      - {motif: dajjal-eye-with-thick-nail, refs: ["Jāmiʿ 65:8487.1"], note: "وهو أعوَرُ عينه اليسرى، بعينه اليُمْنى ظَفَرَةٌ غَلِيظَةٌ"}
      - {motif: two-angels-like-prophets-with-dajjal, refs: ["Jāmiʿ 65:8487.1"], note: "معه ملكان من الملائكة يُشبهان نبيّين من الأنبياء ... فيقول له أحد الملكين: كذبتَ، ما يسمعه أحدٌ من الناس إلّا صاحبُه فيقول له: صدقتَ فيسمعه الناس"}
      - {motif: this-is-that-mans-village, refs: ["Jāmiʿ 65:8487.1"], note: "حتى يأتي المدينة فلا يؤذن له فيها فيقول: هذه قريةُ ذلك الرجل، ثم يسير حتى يأتي الشّام فيهلكه اللَّه ﷿ عند عَقَبة أَفِيقٍ"}
  - id: hadith-65-dajjal-from-the-east
