      - {motif: dajjal-heals-blind-leper-revives-dead, refs: ["Jāmiʿ 65:8490.1"], note: "وإنه يبرئُ الأكْمه والأبْرص، ويحيى الموتى، ويقول للناس: أنا ربّكم"}
      - {motif: jesus-comes-from-the-west-confirming-muhammad, refs: ["Jāmiʿ 65:8490.1"], note: "ثم يجيء عيسى ابن مريم من قبل المغرب مصدّقًا بمحمّد وعلى ملّته، فيقتل الدّجال، ثم إنما هو قيام الساعة"}
    hints:
      - "The Dajjal is given the very miracles Q 3:49 and 5:110 give Jesus (healing the born-blind and the leper, reviving the dead), as in Matt 24:24 false christs 'shall shew great signs and wonders'."
  - id: hadith-65-isfahan-jews
