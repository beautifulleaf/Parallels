  - id: hadith-65-wind-and-the-worst
    tradition: islam
    corpus: hadith
    original: true
    tagger: "Claude Opus 5.5, reading the Arabic"
    title: A wind takes the believers; the Hour comes on the worst; al-Lāt and al-ʿUzzā worshipped again; the righteous go and dregs remain; none says 'Allāh, Allāh' (Q 9:33, 61:9)
