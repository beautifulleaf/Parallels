    note: وأسس المسجد الذي أسِّس على التقوي، وصلَّى فيه رسول الله ﷺ
  - motif: camel-is-commanded-let-her-go
    refs:
    - Jāmiʿ 10:1921.1
    note: ثم ركب راحلته، فسار يمشي معه الناس، حتي بركت عند مسجد رسول الله بالمدينة
  - motif: quba-visited-every-saturday-riding-or-walking
    refs:
    - Jāmiʿ 10:1921.2
    - Jāmiʿ 10:1922.1
    - Jāmiʿ 10:1922.2
    note: كان رسول الله يأتي مسجد قُباء راكبًا وماشيًا، فيصلي فيه ركعتين ... كان يأتي قُباء راكبًا وماشيًا ... كان النبي ﷺ
      يأتي قُباء كلَّ سبتٍ ماشيًا وراكبًا، وكان عبد الله يفعله
  - motif: prayer-at-quba-equal-to-umra
    refs:
    - Jāmiʿ 10:1922.3
    note: من خرج حتى يأتي هذا المسجد مسجد قُباء، فصلى فيه كان له عدلَ عمرةٍ
- id: hadith-10-house-mosques-and-the-church
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Mosques in houses and quarters, kept clean and scented; the church broken, sprinkled with the prophet's ablution
    water and made a mosque; the graves dug up
  read:
  - Jāmiʿ 10:1923.1-1925.1
  tags:
  - motif: blind-man-asks-prophet-to-pray-in-his-house
    refs:
    - Jāmiʿ 10:1923.1
    note: قد أَنكرتُ بَصَرِي وأنا أصلِّي بقومي ... وودِدْتُ يا رسول الله! أنَّك تأتيني فتصلِّي في بيتي فأتخذه مصلًّى
  - motif: where-would-you-like-me-to-pray-in-your-house
    refs:
    - Jāmiʿ 10:1923.1
    note: أينَ تُحِبُّ أن أصلِّيَ من بيتِكَ؟ ... فصلَّى ركعتين ثم سلَّمَ، قال وحبسناه على خزيرة صَنْعناها له
  - motif: mosques-in-quarters-kept-clean-and-scented
    refs:
    - Jāmiʿ 10:1923.2
    note: أمر رسول الله ﷺ ببناء المساجد في الدور، وأن تُنَظَّفَ وتُطيب
  - motif: church-broken-sprinkled-with-ablution-water-made-mosque
    refs:
    - Jāmiʿ 10:1924.1
    note: فدعا بماء فتوضأ، وتمضمض ثم صبَّه في إداوةٍ ... فاكسروا بيعتكم وانضحوا مكانَها بهذا الماء واتخذوها مسجدًا ... مُدُّوه
      من الماء، فإنه لا يزيده إلا طيبًا
  - motif: monk-hears-the-call-and-vanishes
    refs:
    - Jāmiʿ 10:1924.1
    note: 'والراهب رجل من طيّء فلما سمع الأذان قال: دعوة حق، ثم استقبل تلعةً من تلاعِنا فلم نره بعد'
  - motif: graves-of-idolaters-dug-up-for-mosque
    refs:
    - Jāmiʿ 10:1925.1
    note: فأمر النبي ﷺ بقُبورِ المشركين فنُبِشَتْ، ثم بالخرب فسُوِّيتْ، وبالنخل فقُطِعَ، فصَفُّوا النخلَ قِبلَة المسجد
- id: hadith-10-graves-as-mosques
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Graves taken as mosques: the curse on Jews and Christians, the grave left hidden, the cloth on the dying face, the
    pictured church of Abyssinia'
  read:
  - Jāmiʿ 10:1926.1-1927.3
  tags:
  - motif: graves-of-prophets-taken-as-places-of-worship
    refs:
    - Jāmiʿ 10:1926.1
    - Jāmiʿ 10:1926.2
    - Jāmiʿ 10:1926.3
    - Jāmiʿ 10:1927.2
    - Jāmiʿ 10:1927.3
    note: قاتل الله اليهود اتخذوا قبور أنبيائهم مساجد ... لعن الله اليهود والنصارى اتخذوا قبور أنبيائهم مساجد ... لعنةُ الله
      على اليهود والنصاري، اتخذوا قبور أنبيائهم مساجد ... ألا وإن من كان قبلكم كانوا يتخذون قبور أنبيائهم وصالحيهم مساجدَ،
      ألا فلا تتخذوا القبور مساجدَ ... واعلموا أن شرار الناس الذين اتخذوا قبور أنبيائهم مساجدَ
  - motif: prophets-grave-not-exposed-lest-taken-as-mosque
    refs:
    - Jāmiʿ 10:1926.2
    note: ولولا ذلك لأبرزوا قبره، غير أني أخشى أن يتخذ مسجدًا
  - motif: dying-prophet-throws-cloth-over-face
    refs:
    - Jāmiʿ 10:1926.3
    note: طَفِق يطرح خَميصةً على وجهه، فإذا اغتمَّ كشفها عن وجهه
  - motif: church-of-abyssinia-with-pictures-over-righteous-graves
    refs:
    - Jāmiʿ 10:1927.1
    note: ذكرتا كنيسةً رأينَها بالحبشة فيها تصاوير ... إن أولئك إذا كان فيهم الرجل الصالح فمات بنوا على قبره مسجدًا، وصوَّروا
      فيه تلك الصورَ، فأولئك شرار الخلق عند الله يوم القيامة
  - motif: warning-given-five-days-before-death
    refs:
    - Jāmiʿ 10:1927.2
    note: قبل أن يموت بخمس وهو يقول
- id: hadith-10-sleeping-and-tents-in-the-mosque
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Sleeping and tents in the mosque: ʿAlī ''Abu Turāb'', Ibn ʿUmar the bachelor, Abu Dharr; Saʿd''s tent and the flowing
    blood; the freed woman''s tent and the kite; the women''s door'
  read:
  - Jāmiʿ 10:1928.1-1931.1
  tags:
  - motif: abu-turab-dust-wiped-from-sleeper-in-mosque
    refs:
    - Jāmiʿ 10:1928.1
    note: 'هو في المسجد راقد. فجاء رسول الله ﷺ وهو مضطجع قد سقط رداءَه عن شِقِّه وأصابه تراب فجعل رسول الله ﷺ يمسحه عنه ويقول:
      "قم أبا تراب، قم أبا تُراب'
  - motif: young-bachelor-sleeps-in-mosque
    refs:
    - Jāmiʿ 10:1929.1
    note: أنه كان ينام -وهو شاب أعزب لا أهل له- في مسجد النبي ﷺ
  - motif: abu-dharr-nudged-awake-in-mosque-no-other-home
    refs:
    - Jāmiʿ 10:1929.2
    note: فوجد أبا ذر منجدلًا في المسجد فَنَكَتَهُ رسول الله برجله حتى استوى جالسًا ... فأين أنام وهل لي بيت غيره؟
  - motif: tent-in-mosque-for-wounded-sad-blood-flows-to-neighbours
    refs:
    - Jāmiʿ 10:1930.1
    note: رماه في الأكحل، فضرب النبي ﷺ خيمةً في المسجد ليعوده من قريب. فلم يَرُعْهُم -وفي المسجد خيمة من بني غِفار- إلا الدمُ
      يسيلُ إليهم ... فإذا سعد يغذو جُرْحُه دمًا، فمات فيها
  - motif: kite-takes-red-sash-slave-woman-searched
    refs:
    - Jāmiʿ 10:1930.2
    note: عليها وِشاحٌ أحمرُ من سُيُورٍ ... فمَرّتْ به حُدَيَّاة وهوَ مُلْقى، فحَسِبَتْهُ لحْمًا فخطِفَتْهُ ... فاتَّهَمُوني
      به ... حتَّى فَتَّشُوا قُبُلَها ... إذ مرت الحدَيّاة فألقته
  - motif: freed-woman-lives-in-tent-in-mosque-recites-verse
    refs:
    - Jāmiʿ 10:1930.2
    note: فكان لها خِباءٌ في المسجد أو حِفْشٌ ... ويومَ الوِشاح من تعاجيبِ ربِّنا ... ألا إنَّه من بلدةِ الكفرِ أنجاني
  - motif: door-left-for-the-women
    refs:
    - Jāmiʿ 10:1931.1
    note: 'لو تركنا هذا الباب للنساء" قال نافع: فلم يدخل منه ابن عمر حتى مات'
- id: hadith-10-lying-play-and-dispute-in-mosque
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Lying with one leg over the other, allowed and forbidden; the Abyssinians at play; the debt halved
  read:
  - Jāmiʿ 10:1931.2-1932.3
  tags:
  - motif: lies-on-back-one-leg-over-other-in-mosque
    refs:
    - Jāmiʿ 10:1931.2
    note: رأى رسول الله ﷺ مستلقيًا في المسجد، واضِعًا إحدى رجليه على الأُخرى
  - motif: no-lying-on-back-with-leg-over-leg
    refs:
    - Jāmiʿ 10:1932.1
    note: لا يستَلْقِينَّ أحدكم، ثم يضعُ إحدى رجليه على الأخرى
  - motif: abyssinians-play-in-mosque-aisha-screened-by-cloak
    refs:
    - Jāmiʿ 10:1932.2
    note: والحبشة يلْعبون في المسجد، ورسول الله ﷺ يسترني بردائه أنظر إلى لعبهم
  - motif: creditor-told-to-drop-half-the-debt
    refs:
    - Jāmiʿ 10:1932.3
    note: 'تقاضي ابنَ أبي حدْردٍ دينًا كان له عليه في المسجد، فارتفعت أصواتُهما ... حتي كشف سِجْفَ حُجرته فنادى: "يا كعب"
      ... ضَعْ من دينك هذا" وأومأ إليه -أي الشطر ... قُم فاقضه'
- id: hadith-10-sweeper-captive-and-envoy
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The mosque's sweeper prayed over at the grave; Thumāma tied to a pillar; Ḍimām's camel in the mosque and his oath-questions
  read:
  - Jāmiʿ 10:1933.1-1934.1
  quran:
  - '3:35'
  tags:
  - motif: prays-over-grave-of-mosque-sweeper
    refs:
    - Jāmiʿ 10:1933.1
    note: 'أن رجلًا أسود -أو امرأة سوداءَ- كان يَقمُّ المسجدَ، فمات فسأل النبي ﷺ عنه فقالوا: مات، قال: "أفلا كنتم آذنتموني
      به، دُلُّوني على قبره -أو قال- قبرها" فأتى قبره فصلى عليه'
  - motif: captive-tied-to-mosque-pillar-three-days
    refs:
    - Jāmiʿ 10:1933.2
    note: ثُمامة بن أُثال، سيد أهل اليمامة، فربطوه بسارية من سواري المسجد
  - motif: envoy-kneels-camel-in-mosque-asks-by-god-of-each-duty
    refs:
    - Jāmiʿ 10:1933.3
    - Jāmiʿ 10:1934.1
    note: 'دخل رجل على جمل، فأناخه في المسجد ثم عقله، ثم قال لهم: أيُّكم محمد؟ ... أنْشُدُكَ باللهِ، الله أمركَ أن نُصَلِّي
      الصلوات الخمس في اليوم والليلة؟ قال: "اللَّهُمَّ نَعَمْ" ... فأناخ بعيره على باب المسجد، ثم عقله'
  - motif: the-white-man-reclining
    refs:
    - Jāmiʿ 10:1933.3
    note: هذا الرجل الأبيض المُتَّكِئُ
- id: hadith-10-interlacing-fingers
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Interlacing the fingers: believers like a building, after the mistaken prayer, people in confusion; not on the way
    to prayer'
  read:
  - Jāmiʿ 10:1934.2-1935.2
  tags:
  - motif: believers-like-building-fingers-interlaced
    refs:
    - Jāmiʿ 10:1934.2
    note: المؤمن للمؤمن كالبنيان، يشدُّ بعضه بعضًا" وشبك بين أصابعه
  - motif: leans-on-beam-as-if-angry-fingers-interlaced
    refs:
    - Jāmiʿ 10:1934.3
    note: فقام إلى خَشَبةٍ معروضةٍ في المسجد فاتكأ عليها كأنَّه غَضْبانَ ووضع يدَه اليُمنى على يده اليسرى، وشبك بين أصابعه
  - motif: people-mixed-like-interlaced-fingers-keep-to-your-house
    refs:
    - Jāmiʿ 10:1935.1
    note: إذا رأيتُم الناسَ قد مرجتْ عهودهم، وخفّت أماناتُهم، وكانوا هكذا" وشبك بين أصابعه ... الزم بيتك، وأملك عليك لسانك،
      وخُذ بما تعرف، ودع ما تنكر، وعليك بأمر خاصة نفسك، ودع عنك أمر العامة
  - motif: no-interlacing-on-way-to-prayer
    refs:
    - Jāmiʿ 10:1935.2
    note: من توضأ ثم خرج بريد الصلاة فهو في صلاة حتى يرجع إلى بيته فلا تقولوا هكذا" وشبك بين أصابعه
- id: hadith-10-spitting-in-the-mosque
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Spitting in the mosque: not toward the qibla or the right, but left or under the left foot, or into the garment;
    burial its expiation; the prophet scrapes it off and perfumes the place; the imam who spat deposed'
  read:
  - Jāmiʿ 10:1936.1-1942.3
  tags:
  - motif: no-spitting-forward-god-is-before-his-face
    refs:
    - Jāmiʿ 10:1936.1
    - Jāmiʿ 10:1938.1
    - Jāmiʿ 10:1938.3
    - Jāmiʿ 10:1939.3
    - Jāmiʿ 10:1940.4
    - Jāmiʿ 10:1942.1
    note: إن أحدكم إذا قام في صلاته، فإنه يناجي ربه، أو إن ربه بينه وبين القِبْلَة، فلا يَبْزُقَنَّ أحدكم قِبَلَ قبلتِه ...
      فلا يبصُق قِبَل وجهه، فإن الله ﵎ قِبَلَ وجهه إذا صلي ... إنَّ أحدكم إذا استقبل القبلة فإنَّما يستقبل ربّه ﷿ ... ما بال
      أحدكم يقوم مستقبلَ ربِّه فيتنخَّعُ أمامه؟ ... إن أحدكم إذا قام يُصَلِّي فإن الله قِبَل وجهه، فلا يَبْصُقَنَّ قِبَل وجهه
      ... إن الرجل إذا قام يُصلي أقبل الله عليه بوجهه
  - motif: no-spitting-ahead-or-right-angel-on-right
    refs:
    - Jāmiʿ 10:1938.3
    - Jāmiʿ 10:1939.2
    note: والملك عن يمينه، فلا يتفُل عن يمينه، ولا في قبلته ... ولا عن يمينه، فإن عن يمينه ملَكًا
  - motif: spit-to-left-or-under-left-foot
    refs:
    - Jāmiʿ 10:1936.1
    - Jāmiʿ 10:1938.2
    - Jāmiʿ 10:1939.1
    - Jāmiʿ 10:1939.2
    - Jāmiʿ 10:1940.4
    - Jāmiʿ 10:1941.2
    - Jāmiʿ 10:1942.2
    note: ولكن عن يساره، أو تحت قدميه ... ولكن عن يساره، أو تحت قدمه اليُسرى ... ولْيبصُق عن يساره، أو تحت قدمه اليسرى ...
      وليبصق عن يساره، أو تحت قدمه فيدفنُها ... وليبصُق عن يساره تحت رجله اليُسرى ... ولكن عن تلقاء يساره إن كان فارغًا، أو
      تحت قدمه اليُسرى ... ولكن عن يساره، أو تحت قدمه
  - motif: spit-into-garment-and-fold-it
    refs:
    - Jāmiʿ 10:1936.1
    - Jāmiʿ 10:1938.3
    - Jāmiʿ 10:1939.3
    - Jāmiʿ 10:1940.4
    - Jāmiʿ 10:1940.1
    note: 'ثم أخذ طرف ردائه فبصق فيه، ثم رد بعضه على بعض فقال: "أو يفعلُ هكذا ... أن يتفل في ثوبه ثم يرد بعضه على بعض ...
      فتفلَ في ثوبه، ثم مسح بعضَه على بعض ... فليقُل بثوبه هكذا ووضعه على فيه، ثم دَلكه ... فليبزق في ثوبه، ثم ليخرج به'
  - motif: spitting-in-mosque-a-sin-burying-it-the-expiation
    refs:
    - Jāmiʿ 10:1936.2
    - Jāmiʿ 10:1940.1
    note: البزاق في المسجد خِطِيئة، وكَفَّارتُها دَفْنُها ... فليحِفر فليدفِنْه
  - motif: prophet-scrapes-spittle-off-qibla-wall
    refs:
    - Jāmiʿ 10:1936.1
    - Jāmiʿ 10:1937.2
    - Jāmiʿ 10:1938.1
    - Jāmiʿ 10:1938.2
    - Jāmiʿ 10:1939.1
    - Jāmiʿ 10:1940.4
    note: فقام فحكَّه بيده ... مُخاطًا أو بُصاقًا، أو نُخامةً فحكَّه ... رأي بصاقًا في جدار القِبلة فحكَّه ... فحكَّها بحصاةٍ
      ... فتناول حصاة فحكَّها ... فأقبل عليها فحتَّها بالعرجون
  - motif: perfume-put-where-the-sputum-was
    refs:
    - Jāmiʿ 10:1937.1
    - Jāmiʿ 10:1940.4
    note: 'فقامت امرأة من الأنصار فحكَّتْها، وجعلت مكانها خلوقًا. فقال رسول الله ﷺ: ما أحسن هذا؟ ... أروني عبيرًا" فقام فتّى
      من الحي يشتد إلى أهله فجاء بخلوق في راحته، فأخذه رسول الله ﷺ فجعله على رأس العرجون، ثم لطخ به على أثر النُخامة. قال
      جابر: فمن هنا جعلتم الخلوق في مساجدكم'
  - motif: would-you-like-to-be-spat-at-in-the-face
    refs:
    - Jāmiʿ 10:1938.3
    - Jāmiʿ 10:1939.3
    - Jāmiʿ 10:1940.4
    note: أيسُرّ أحدكم أن يُبصق في وجهه؟ ... أيُحبّ أحدُكم أن يُستقبلَ فَيُتَنَخَّعَ في وجههِ؟ ... أيُّكم يُحب أن يُعرِضَ
      الله عنه بوجهه؟
  - motif: unburied-sputum-among-bad-deeds-harm-removed-among-good
    refs:
    - Jāmiʿ 10:1940.2
    note: عُرضت عليَّ أعمال أمتي، حسنُها وسيّئُها، فوجدت في محاسن أعمالِها الأذي يُماط عن الطريق. ووجدت في مساوئِ أعمالها
      النُخاعةَ تكون في المسجد لا تُدفن
  - motif: rubs-sputum-with-left-sandal
    refs:
    - Jāmiʿ 10:1940.3
    note: فرأيته تنخَّع فدلكها بنعْلِه
  - motif: loves-date-stalks-always-one-in-hand
    refs:
    - Jāmiʿ 10:1938.3
    - Jāmiʿ 10:1940.4
    note: كان يحب العراجين ولا يزال في يده منها ... وفي يده عُرجون ابن طاب
  - motif: imam-who-spat-toward-qibla-barred-from-leading
    refs:
    - Jāmiʿ 10:1941.1
    note: 'أن رجلًا أمّ قومًا فبصق في القبلة، ورسول الله ﷺ ينظر، فقال رسول الله ﷺ حين فرغ: "لا يُصلِّي لكم" ... إنك آذيت الله
      ورسوله'
  - motif: god-faces-worshipper-until-he-turns-or-breaks-purity
    refs:
    - Jāmiʿ 10:1942.1
    note: إن الرجل إذا قام يُصلي أقبل الله عليه بوجهه، حتى ينقلب أو يحدِثَ حدث سُوءٍ
  - motif: hide-sputum-lest-it-touch-a-believer
    refs:
    - Jāmiʿ 10:1942.3
    note: إذا تنخَّم أحدُكم في المسجد، فليغَيِّبْ نُخامتَه أن تصيب جِلْد مؤمن، أو ثوبَه فتؤذَيَه
