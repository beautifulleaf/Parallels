  title: Thumama, tied to a pillar, released, bathes and testifies; Qays b. Asim told to bathe with water and lote leaves on conversion
  read:
  - Jāmiʿ 5:982.1-983.1
  tags:
  - motif: captive-tied-to-mosque-pillar-three-days
    refs:
    - Jāmiʿ 5:982.1
