    note: كان يغتسل من إناء - وهو الفَرَقُ - من الجنابة
  - motif: ablution-from-two-thirds-of-a-mudd
    refs:
    - Jāmiʿ 5:970.1
    note: فأُتي بإناءٍ فيه ماء قدرُ ثُلُثَيِ المُدِّ
  hints:
  - A fixed small measure of water for ablution (a mudd, even two-thirds of one) and a ṣāʿ for the bath, against the mishnaic minimum of a quarter-log for washing the hands (m. Yadayim 1:1) and forty se'ah for immersion (m. Miqwaot 1:7).
- id: hadith-5-braids-not-undone
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: A woman need not undo her braids for the bath; Aisha mocks Ibn ʿAmr; Aisha told to undo and comb her hair for the pilgrimage
  read:
  - Jāmiʿ 5:970.2-971.1
  tags:
  - motif: braids-not-undone-for-bath
    refs:
    - Jāmiʿ 5:970.2
    note: 'إني امرأة أشُدُّ ضَفْرَ رأسيّ، أَفأنْقُضُه لغُسْل الجنابة؟ قال: "لا'
  - motif: why-not-order-them-to-shave-their-heads
    refs:
    - Jāmiʿ 5:970.3
    note: أفلا يأمرهنّ أن يحلقن رؤوسَهْنَّ
  - motif: menstruant-at-arafa-undoes-hair-combs-enters-hajj
    refs:
    - Jāmiʿ 5:971.1
    note: دَعي عمرتَك، وانقُضي رأسَكِ، وامتْشِطي وأهِلِّي بحجّ
  hints:
  - The woman's braids left as they are for the bath, against the rabbinic rule of interposition (ḥaṣiṣa) that requires hair to be loosened and combed before immersion (b. Niddah 66b; b. Bava Qamma 82a-b on Ezra's ordinance of combing).
