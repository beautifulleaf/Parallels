  - motif: stone-runs-off-with-moses-garment
    refs:
    - Jāmiʿ 5:977.1
    note: 'ففرَّ الحجرُ بثوبه، فخرج موسى في إثره يقول: ثوبي يا حجر'
  - motif: marks-of-moses-blows-on-the-stone
    refs:
    - Jāmiʿ 5:977.1
    note: إنه لنَدَبٌ بالحجر ستة أو سبعة ضربًا بالحجر
  - motif: golden-locusts-rain-on-bathing-job
    refs:
    - Jāmiʿ 5:977.2
    note: فخرّ عليه جرادٌ من ذهب، فجعل أيوب يَحْتَثي في ثوبه
  hints:
  - 'The rumour that Moses had a bodily defect and the public proof of his soundness, against the rabbinic tradition of Moses'' modesty and the aggadic accusations against Moses (b. Sanhedrin 110a: suspected of adultery with their wives, Num 16).'
- id: hadith-5-guarding-nakedness
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The boy faints when his wrapper is put on his shoulder; 'go back for your garment, do not walk naked'; 'God is more deserving of modesty'; the naked Quraysh youths; no looking at another's nakedness
  read:
  - Jāmiʿ 5:977.3-979.2
  tags:
  - motif: prophet-faints-when-loincloth-removed
    refs:
    - Jāmiʿ 5:977.3
    note: فحلَّه فجعله على منْكِبَيه، فسقط مغشيًا عليه، فما رُئي بعد ذلك عريانًا ﷺ
  - motif: wrapper-drops-carrying-stone-do-not-walk-naked
    refs:
    - Jāmiʿ 5:978.1
    note: ارجع إلى ثوبك فخذه، ولا تَمْشُوا عُراةً
  - motif: god-more-deserving-of-modesty-when-alone
    refs:
    - Jāmiʿ 5:978.2
    note: الله أحق أن يُسْتَحْيى منه من الناس
  - motif: naked-youths-whip-with-twisted-wrappers
    refs:
    - Jāmiʿ 5:979.1
    note: قد حلوا أُزرهم، فجعلوها مخاريق يجلدون بها، وهم عراة
  - motif: passers-taken-for-priests
    refs:
    - Jāmiʿ 5:979.1
    note: إن هؤلاء قسيسون فدعوهم
  - motif: no-looking-at-same-sex-nakedness-no-sharing-one-garment
    refs:
    - Jāmiʿ 5:979.2
    note: لا يَنْظُرُ الرّجل إلى عورة الرَّجُل، ولا المرأةُ إلى عَورةِ المرأة
  hints:
  - 'Ham''s look at his father''s nakedness and Shem and Japheth covering him backwards (Gen 9:22-23) against the general rule that no man look on another man''s nakedness: the hadith legislates what Genesis narrates.'
