- id: hadith-5-moses-and-job-bathing
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The Israelites bathed naked; Moses alone, called scrotal; the stone runs off with his garment; Job and the golden locusts
  read:
  - Jāmiʿ 5:977.1-977.2
  tags:
  - motif: israelites-bathed-naked-looking-at-each-other
    refs:
    - Jāmiʿ 5:977.1
    note: كانت بنو إسرائيل يَغْتَسِلُون عُراةً ينظر بعضُهم إلى بعض، وكان موسى يغتسلُ وحده
  - motif: moses-rumoured-to-have-hernia
    refs:
