# Hadith chunk 27: al-Jāmiʿ al-Kāmil book 4 (kitāb al-ṭahāra), Shamela pp. 882-955 (printed 2/102-175), bābs 1-46
# (sea water, two qullas, the dog's licking, the cat, the fitra, circumcision, the toothstick, the privy and its rules,
# the qibla, urine and the graves, infant urine, semen, sandals, greeting), and book 5 (kitāb al-ghusl), pp. 956-984
# (printed 2/176-204), bābs 1-18 (water from water and its abrogation, the rabbi's questions, the woman's dream, the
# manner and measure of the bath, braids, screening, the bathhouse, Moses' and Job's bathing, nakedness, the convert's
# bath). Read in full from the Arabic: 176 hadith. Reports the compiler gives inside his commentary (weak hadith, athar)
# are not lines. The ornament '• * *' on p. 984 is not a hadith.
new_motifs:
  sea-water-purifying-its-dead-lawful:
    label: 'Asked about the sea''s water, the prophet: ''its water is purifying, its dead (creatures) lawful'' (huwa l-ṭahūr māʾuhu, al-ḥill maytatuh)'
    cluster: purity
  seafarers-short-of-water-ask-about-ablution:
    label: 'Seafarers carry little water: if they use it for ablution they go thirsty; may they use the sea?'
    cluster: purity
  wash-hand-before-vessel-after-sleep:
    label: On waking from sleep one washes the hand before putting it into the ablution vessel, for one does not know where one's hand spent the night
    cluster: purity
  water-of-two-qullas-bears-no-filth:
    label: Water amounting to two qullas (large jars) does not carry filth, though beasts and predators come to it again and again
    cluster: purity
  water-does-not-become-junub:
    label: 'A wife bathed from a tub while in major impurity; the prophet uses its water: ''water does not become junub'''
    cluster: purity
  budaa-well-water-not-made-impure:
    label: 'The well of Buḍāʿa, into which menstrual cloths, dogs'' flesh and stinking things are thrown: ''water is purifying, nothing makes it impure'''
    cluster: purity
  ablution-from-brass-basin:
    label: Water is brought out in a brass basin (tawr min ṣufr) and the prophet performs ablution from it
    cluster: purity
  ablution-face-thrice-arms-twice-head-forward-and-back:
    label: 'Ablution: face washed three times, arms twice each, the head wiped by drawing the hands forward and back, the feet washed'
    cluster: purity
  vessel-licked-by-dog-washed-seven-times:
    label: When a dog drinks from (licks) a vessel it is washed seven times
    cluster: purity
  eighth-washing-rubbed-with-earth:
    label: After the seven washings for a dog's licking, the vessel is rubbed with earth the eighth time
    cluster: purity
  hunting-herding-and-crop-dogs-exempted:
    label: After ordering dogs killed he allowed the hunting dog, the sheep dog (and the crop dog)
    cluster: law
  water-drunk-from-polytheist-womans-skin:
    label: Forty thirsty men drink from the water-skin (mazāda) of a polytheist woman and wash their companion who was junub with it
    cluster: sira
  cat-not-impure-one-who-goes-round:
    label: 'A cat drinks from the ablution water as Abu Qatada tilts the vessel for it: ''it is not impure, it is of those (male or female) who go round among you'''
    cluster: purity
  five-practices-of-the-fitra:
    label: 'Five things are of the fitra: circumcision, shaving the pubes (istiḥdād), paring the nails, plucking the armpits, trimming the moustache'
    cluster: body
  ten-practices-of-the-fitra-tenth-forgotten:
    label: Ten things are of the fitra (moustache, beard, toothstick, sniffing water, nails, washing the knuckles, armpit, pubes, washing with water); the narrator forgot the tenth, 'unless it is rinsing the mouth'
    cluster: body
  washing-the-knuckles:
    label: Washing the knuckle-joints (ghasl al-barājim) listed among the practices of the fitra
    cluster: body
  trim-moustache-grow-beard-to-differ:
    label: 'Trim (clip close) the moustache and let the beard grow: ''differ from the polytheists'' / ''differ from the Magians'''
    cluster: body
  beard-grasped-excess-cut-at-pilgrimage:
    label: Ibn Umar, on hajj or umra, would grasp his beard and cut what exceeded his fist
    cluster: body
  grooming-not-left-beyond-forty-days:
    label: 'A time limit is set: moustache, nails, armpits and pubes are not left more than forty days'
    cluster: body
  moustache-trimmed-over-a-toothstick:
    label: The prophet trims a guest's overgrown moustache over a toothstick, after leaving off carving roast meat when Bilal calls to prayer ('what ails him, may his hands be dusty')
    cluster: body
  who-does-not-trim-moustache-not-of-us:
    label: '''Whoever does not take from his moustache is not of us'''
    cluster: body
  remembers-god-in-every-state:
    label: The prophet remembered God in all his states (ʿalā kulli aḥyānih)
    cluster: ritual
  only-the-pure-touch-the-quran:
    label: 'In the prophet''s written letter to Amr b. Hazm: ''none touches the Quran except one who is pure'''
    cluster: scripture
  spat-into-as-a-boy-from-their-well:
    label: Maḥmūd b. al-Rabīʿ is the one into whose face the prophet squirted water from their well when he was a boy
    cluster: sira
  sick-boy-wiped-drinks-ablution-water:
    label: An aunt brings her ailing nephew; the prophet wipes his head, prays for blessing, and the boy drinks from his ablution water
    cluster: sira
  cup-washed-and-spat-into-drunk-and-poured-on-faces:
    label: 'Refused by a bedouin, the ''good news'' is given to Abu Musa and Bilal: the prophet washes hands and face in a cup and spits in it, ''drink from it and pour it on your faces and chests''; Umm Salama calls from behind the screen for her share'
    cluster: sira
  drinks-leftover-ablution-water-standing:
    label: 'Ali performs ablution three times each, then stands and drinks the rest of his ablution water: ''the prophet did as I did'''
    cluster: ritual
  not-bathe-with-other-sexs-leftover:
    label: The prophet forbade a woman to bathe with the man's leftover water or a man with the woman's (or to perform ablution with it)
    cluster: purity
  husband-and-wife-bathe-from-one-vessel:
    label: The prophet and his wife (Aisha, Umm Salama, Maymuna) bathe from the one vessel, both in major impurity
    cluster: purity
  men-and-women-perform-ablution-together:
    label: In the prophet's time men and women performed ablution together
    cluster: purity
  hands-alternate-in-one-vessel:
    label: A woman's hand and the prophet's hand alternate in the one vessel
    cluster: purity
  refuge-from-male-and-female-devils-on-entering-privy:
    label: 'On entering the privy: ''O God, I seek refuge in you from the khubuth and the khabāʾith'' (male and female devils)'
    cluster: ritual
  privies-are-attended-by-devils:
    label: '''These privies (ḥushūsh) are attended (muḥtaḍara)'': so one says the refuge on entering'
    cluster: jinn
  your-forgiveness-on-leaving-privy:
    label: On coming out of the privy the prophet said 'Your forgiveness' (ghufrānak)
    cluster: ritual
  relieve-oneself-before-prayer:
    label: When the prayer is due and one needs to relieve oneself, one begins with that before the prayer
    cluster: purity
  no-prayer-with-food-served-or-urge-pressing:
    label: No prayer in the presence of food, nor while the two foul things (al-akhbathān) press
    cluster: ritual
  imam-goes-to-relieve-himself-before-leading:
    label: ʿAbd Allāh b. Arqam, leading his companions, goes to relieve himself first when the prayer is called
    cluster: ritual
  washes-face-and-hands-after-night-relief-and-sleeps:
    label: At night the prophet rises, relieves himself, washes his face and hands, and goes back to sleep
    cluster: purity
  said-much-about-the-toothstick:
    label: '''I have said a great deal to you about the toothstick'''
    cluster: ritual
  toothstick-behind-ear-like-scribes-pen:
    label: Zayd b. Khālid sits in the mosque with the toothstick behind his ear 'where the scribe keeps his pen', using it whenever he stands to pray
    cluster: sira
  ablution-for-every-prayer-replaced-by-toothstick:
    label: He was ordered to perform ablution for every prayer, pure or not; when that weighed on him he was ordered the toothstick for every prayer; Ibn Umar kept to ablution for every prayer
    cluster: purity
  toothstick-scrubs-mouth-on-rising-at-night:
    label: When he rose at night he scrubbed his mouth (yashūṣ) with the toothstick
    cluster: purity
  toothstick-and-water-prepared-before-night:
    label: His wives prepared his toothstick and water for purification; God woke him when he willed in the night
    cluster: purity
  revelation-to-give-toothstick-to-elder:
    label: 'While cleaning his teeth with two men present, God reveals to him concerning the toothstick: ''Give precedence to the elder'': give it to the elder'
    cluster: ethics
  vigil-cycle-sky-verse-toothstick-ablution-prayer-repeated:
    label: 'The night cycle: go out, look at the sky, recite the verse, return, use the toothstick, perform ablution, pray, lie down; then the same again'
    cluster: ritual
  toothstick-purifies-mouth-pleases-lord:
    label: '''The toothstick is a means of purifying the mouth (maṭhara) and of pleasing the Lord (marḍāh)'''
    cluster: ritual
  thin-shins-heavier-in-balance-than-uhud:
    label: Ibn Masʿūd climbs a tree to gather an arak toothstick; the wind tips him over and the people laugh at his thin shins; 'they are heavier in the Balance than Uhud'
    cluster: companions
  toothstick-gathered-from-arak:
    label: The toothstick is gathered from the arak tree (al-arāk)
    cluster: ritual
  water-into-nose-and-blown-out:
    label: In ablution one puts water in the nose and blows it out (intithār)
    cluster: purity
  rites-are-odd-stoning-running-circling:
    label: '''Stone-wiping is odd (taww), stoning the pillars is odd, the running between Ṣafā and Marwa is odd, the circling is odd'''
    cluster: ritual
  taught-even-how-to-relieve-oneself:
    label: 'A mocker: ''your prophet has taught you everything, even how to relieve yourselves (al-khirāʾa)''; Salmān: ''Yes indeed'''
    cluster: sira
  not-facing-qibla-when-relieving:
    label: When relieving oneself one does not face (or turn one's back on) the qibla
    cluster: purity
  no-cleansing-with-right-hand:
    label: One does not cleanse oneself (or hold one's member) with the right hand
    cluster: purity
  no-fewer-than-three-stones:
    label: One does not cleanse oneself with fewer than three stones
    cluster: purity
  not-breathing-into-the-drinking-vessel:
    label: When one drinks one does not breathe into the vessel
    cluster: manners
  right-hand-for-food-drink-clothes-left-for-rest:
    label: The prophet kept his right hand for his food, drink and clothes and his left for everything else
    cluster: manners
  dung-thrown-away-as-riks:
    label: 'Asked for three stones, Ibn Masʿūd finds two and brings a piece of dung; the prophet takes the stones, throws the dung away: ''this is riks (filth)'''
    cluster: purity
  companions-fear-prophet-snatched-or-killed-at-night:
    label: Missing him one night, the companions search the valleys and ravines, fearing he was snatched away (istuṭīra) or assassinated, and spend the worst night
    cluster: jinn
  caller-of-the-jinn-recited-quran-to-them:
    label: '''A caller of the jinn came to me and I went with him and recited the Quran to them''; he shows them the jinn''s tracks and the traces of their fires near Ḥirāʾ'
    cluster: jinn
  tied-beard-bowstring-amulet-dung-cleansing-disowned:
    label: '''Tell the people: whoever ties his beard in knots, hangs a bowstring (as amulet) on his neck, or cleans himself with an animal''s dung or a bone, Muhammad is quit of him'''
    cluster: magic
  lent-camel-for-half-the-spoils:
    label: In the prophet's time a man would take his brother's lean camel for half of what he took as booty; one got the arrowhead and feathers, the other the shaft
    cluster: law
  cleansing-with-water-from-small-skin:
    label: When he went out to relieve himself Anas and a boy brought a skin (idāwa) of water and he cleansed himself with it
    cluster: purity
  wives-tell-husbands-to-wash-with-water:
    label: 'Aisha to the women: ''tell your husbands to cleanse themselves with water; I am shy of telling them; the prophet did it'''
    cluster: purity
  wives-relieve-themselves-at-al-manasi:
    label: The prophet's wives went out at night to relieve themselves at al-Manāṣiʿ, a broad open plain
    cluster: sira
  goes-far-out-of-sight-to-relieve:
    label: When the prophet went to relieve himself he went far, until no one could see him
    cluster: purity
  relieves-himself-at-al-mughammas-two-miles-from-mecca:
    label: He went to relieve himself at al-Mughammas, about two miles from Mecca
    cluster: sira
  urinated-only-sitting-aisha-denies-standing:
    label: 'Aisha: ''whoever tells you the prophet urinated standing, do not believe him; he urinated only sitting'''
    cluster: purity
  urinated-standing-at-rubbish-heap:
    label: At a people's rubbish heap (subāṭa) the prophet urinated standing and called Hudhayfa close, behind his heels, then wiped over his khuffs
    cluster: purity
  first-to-hear-and-tell-the-qibla-ban:
    label: 'ʿAbd Allāh b. al-Ḥārith: ''I am the first to have heard the prophet say: let none urinate facing the qibla, and the first to tell people of it'''
    cluster: sira
  seen-from-roof-relieving-on-two-bricks-facing-jerusalem:
    label: Ibn Umar climbs onto the roof of a house and sees the prophet sitting on two bricks relieving himself facing Jerusalem (Bayt al-Maqdis)
    cluster: sira
  those-who-pray-on-their-haunches:
    label: 'Ibn Umar to his questioner: ''perhaps you are one of those who pray on their haunches (ʿalā awrākihim)'', who prostrate clinging to the ground'
    cluster: ritual
  faced-qibla-a-year-before-death:
    label: 'Jabir: he forbade facing the qibla in urinating; then I saw him face it a year before he died'
    cluster: purity
  screen-between-permits-facing-qibla:
    label: 'Ibn Umar makes his camel kneel toward the qibla and urinates toward it: the ban is for open ground; with something screening you from the qibla there is no harm'
    cluster: purity
  good-deed-written-for-not-facing-qibla:
    label: Whoever does not face or turn his back on the qibla when relieving himself has a good deed written and a bad deed wiped out
    cluster: theology
  clothes-not-lifted-until-near-the-ground:
    label: When the prophet went to relieve himself he went aside and did not raise his clothes until close to the ground
    cluster: purity
  called-for-basin-and-died-no-bequest-to-ali:
    label: '''They say the prophet appointed Ali by bequest; he called for the basin to urinate in and slumped (inkhanathat nafsuh) without my knowing; to whom did he make a bequest?'''
    cluster: death-of-prophet
  no-urinating-into-holes:
    label: '''Let none urinate into a hole (juḥr)''; Qatāda: ''it is said they are the dwellings of the jinn'''
    cluster: purity
  holes-said-to-be-dwellings-of-the-jinn:
    label: Holes in the ground are said to be the dwellings of the jinn
    cluster: jinn
  mouse-drags-wick-and-burns-house:
    label: 'Put out the lamp when you sleep: the mouse takes the wick and burns the people of the house'
    cluster: household
  tie-skins-cover-drink-lock-doors-at-night:
    label: At night tie the water-skins, cover the drink and lock the doors
    cluster: household
  no-urinating-in-standing-water-then-bathing:
    label: Let none urinate into standing water that does not flow, then bathe in it
    cluster: purity
  junub-scoops-from-standing-water:
    label: 'One in major impurity does not bathe in standing water; Abu Hurayra: ''he takes it out (scoops it)'''
    cluster: purity
  two-curse-bringers-road-and-shade:
    label: '''Beware the two curse-bringers'': relieving oneself on the people''s road or in their shade'
    cluster: ethics
  fresh-stalk-split-and-planted-on-two-graves:
    label: 'He splits a fresh palm stalk in two and plants one on each grave: ''it may lighten their punishment as long as they do not dry'''
    cluster: eschatology
  most-punishment-of-grave-from-urine:
    label: '''Most of the punishment of the grave is from urine'''
    cluster: eschatology
  hears-graves-colour-changes-sleeve-trembles:
    label: 'At two graves the prophet stands, his colour changes until his shirt-sleeve trembles: ''Do you not hear what I hear?'''
    cluster: eschatology
  graves-punished-for-urine-and-backbiting:
    label: In Abu Bakra's report the two are punished 'only for urine and backbiting (ghība)'; companions race to bring a palm stalk
    cluster: eschatology
  infant-urinates-on-him-water-poured-over:
    label: A baby brought to the prophet urinates on his garment; he calls for water and pours it over (nadaḥa), without washing
    cluster: purity
  servant-screens-bathing-prophet-with-his-back:
    label: 'Abu al-Samḥ, his servant: ''when he wanted to bathe he said: turn your back to me'', and I screened him'
    cluster: purity
  sent-to-make-easy-not-hard:
    label: '''You were sent to make things easy, not to make them hard'''
    cluster: ethics
  dogs-urinated-in-mosque-unsprinkled:
    label: In the prophet's time dogs urinated and came and went in the mosque and nothing was sprinkled
    cluster: purity
  semen-washed-from-garment-wet-at-prayer:
    label: Aisha washes the traces of janāba from his garment; he goes out to prayer with the water patches still on it
    cluster: purity
  dry-semen-scraped-off-with-fingernail:
    label: 'A guest who had a wet dream plunges his garments in water; Aisha: ''had you seen something you could have washed it; I used to scrape it dry from the prophet''s garment with my nail'''
    cluster: purity
  foul-road-offset-by-cleaner-road-after:
    label: 'A woman asks about their foul road to the mosque in rain: ''is there not a cleaner road after it?'' ''Yes.'' ''Then this for that'''
    cluster: purity
  no-ablution-for-what-is-trodden-hair-and-clothes-not-tucked:
    label: '''We did not perform ablution for what we trod on, nor tuck up hair or clothes'''
    cluster: purity
  gabriel-reports-filth-on-sandals-in-prayer:
    label: 'During prayer the prophet takes off his sandals and the people follow; afterward: ''Gabriel came and told me there was filth on them''; look at your sandals, wipe and pray in them'
    cluster: angels
  carries-grandson-saliva-running-on-him:
    label: The prophet carries al-Ḥasan b. ʿAlī on his shoulder with the child's saliva running onto him
    cluster: sira
  greeting-not-returned-while-urinating:
    label: A man greets the prophet while he is urinating and he does not return it
    cluster: ritual
  do-not-greet-me-in-this-state:
    label: '''If you see me in this state, do not greet me; if you do, I will not answer you'''
    cluster: ritual
  intercourse-without-emission-wash-and-ablution-only:
    label: 'Asked about a man who lies with his wife and does not ejaculate (yuksil): ''he washes what touched him of the woman, performs ablution and prays'''
    cluster: purity
  water-is-from-water:
    label: '''Water (the bath) is only from water (emission)'' (innamā l-māʾ min al-māʾ)'
    cluster: purity
  man-called-from-his-wife-comes-out-dragging-wrapper:
    label: 'On the way to Qubāʾ the prophet calls at ʿItbān''s door; he comes out dragging his wrapper: ''we have hurried the man'''
    cluster: sira
  senior-companions-concur-in-ruling:
    label: Asked about the ruling, Ali, al-Zubayr, Ṭalḥa and Ubayy b. Kaʿb all ordered the same
    cluster: law
  four-limbs-and-meeting-circumcised-parts-require-bath:
    label: '''When he sits between her four limbs (shuʿabihā l-arbaʿ) and strives, and the circumcised part touches the circumcised part, bathing is obligatory'''
    cluster: purity
  emigrants-and-helpers-disagree-on-bath:
    label: 'The Anṣār: no bath except from gushing (al-dafq); the Muhājirūn: once he mingles, bathing is obligatory; Abu Musa goes to ask Aisha'
    cluster: law
  ask-me-as-your-mother:
    label: 'Abu Musa is shy to ask; Aisha: ''do not be shy to ask me what you would ask the mother who bore you; I am your mother''; ''you have come to one who knows'' (ʿalā l-khabīr saqaṭta)'
    cluster: sira
  i-and-this-one-do-it-then-bathe:
    label: 'Asked in Aisha''s presence, the prophet: ''I do that, I and this one, then we bathe'''
    cluster: purity
  god-not-shy-of-the-truth:
    label: 'Answering questions on the bath and emissions: ''God is not shy of the truth'''
    cluster: theology
  every-stallion-emits-madhy:
    label: 'The water after water is madhy, ''and every stallion emits madhy'': wash the private part and perform ablution'
    cluster: purity
  prayer-at-home-dearer-except-obligatory:
    label: '''You see how near my house is to the mosque, yet to pray in my house is dearer to me, except the obligatory prayer'''
    cluster: ritual
  eat-with-the-menstruant:
    label: 'Asked about eating with a menstruating woman: ''eat with her'''
    cluster: purity
  water-from-water-concession-for-few-clothes:
    label: 'Ubayy b. Kaʿb: the prophet made it (''water from water'') a concession at the beginning of Islam because clothes were few, then ordered the bath and forbade it'
    cluster: purity
  poor-emigrants-first-to-cross:
    label: The first of people to be allowed across (ijāza) are the poor of the emigrants
    cluster: eschatology
  mans-water-white-womans-yellow-higher-decides-sex:
    label: '''The man''s water is white, the woman''s yellow; when they meet, if the man''s semen rises above the woman''s they make a male by God''s leave, if the woman''s rises above the man''s, a female'''
    cluster: embryology
  knew-nothing-of-it-until-god-told-me:
    label: 'After the rabbi leaves: ''he asked me about what he asked, and I had no knowledge of any of it until God brought it to me'''
    cluster: prophethood
  prophet-scratches-ground-with-a-stick:
    label: Before answering, the prophet scratches the ground with a stick he has ('nakatha bi-ʿūd')
    cluster: sira
  aisha-scolds-may-your-hand-be-dusty:
    label: 'Aisha to Umm Sulaym: ''fie on you, does a woman see that?''; the prophet to Aisha: ''may your right hand be dusty! whence comes the resemblance?'''
    cluster: sira
  bath-if-she-sees-moisture:
    label: '''When she sees moisture (al-raṭb), let her bathe'''
    cluster: purity
  bath-sequence-hands-ablution-hair-three-handfuls-body:
    label: 'The bath from janāba: wash the hands, ablution as for prayer, fingers into the roots of the hair, three handfuls on the head, then water over the whole skin'
    cluster: purity
  women-three-handfuls-then-each-side:
    label: 'Aisha: when one of us was junub she took three handfuls over her head, then her hand to the right side and the other to the left'
    cluster: purity
  left-hand-rubbed-on-ground-after-washing-private-part:
    label: After washing his private part with the left hand he strikes the ground with it and rubs it hard
    cluster: purity
  moves-aside-to-wash-feet-last:
    label: He moves aside from where he stood and then washes his feet
    cluster: purity
  towel-refused-water-shaken-off:
    label: Maymuna brings a towel (mandīl, khirqa) and he refuses it, shaking the water off with his hand
    cluster: purity
  man-undoes-hair-woman-need-not:
    label: The man loosens his hair and washes to its roots; the woman need not undo hers, three handfuls over her head suffice
    cluster: purity
  head-not-wiped-in-bath-ablution:
    label: In the ablution within the bath, when he reaches his head he does not wipe it but pours water over it
    cluster: purity
  three-handfuls-on-head-suffice:
    label: '''As for me, I pour three (handfuls) over my head'''
    cluster: purity
  prophet-had-more-hair-than-you-and-better:
    label: 'To one who says his hair is abundant: ''the prophet had more hair than you, and better (aṭyab)'''
    cluster: prophet-body
  cold-land-asks-how-much-for-bath:
    label: 'The delegation of Thaqīf: ''our land is a cold land; what suffices us for the bath from janāba?'''
    cluster: sira
  folds-washed-hands-rubbed-on-wall:
    label: He washes his body folds (marāfigh), and when he has cleaned them he takes his hands to a wall (to rub them), then begins the ablution
    cluster: purity
  bath-from-milking-pail-right-side-first:
    label: He calls for something like a milking-pail (al-ḥilāb), takes in his palm and begins with the right side of his head, then the left
    cluster: purity
  bath-with-a-sa-ablution-with-a-mudd:
    label: He bathed with a ṣāʿ (up to five mudds) of water and performed ablution with a mudd
    cluster: purity
  bathed-from-the-faraq:
    label: He bathed from janāba from a vessel, the faraq
    cluster: purity
  ablution-from-two-thirds-of-a-mudd:
    label: He performed ablution from a vessel holding two-thirds of a mudd
    cluster: purity
  braids-not-undone-for-bath:
    label: 'Umm Salama, who braids her hair tightly: ''shall I undo it for the bath?'' ''No; three scoops over your head suffice, then pour water over yourself'''
    cluster: purity
  why-not-order-them-to-shave-their-heads:
    label: 'Aisha on Ibn ʿAmr who orders women to undo their hair: ''how strange! why not order them to shave their heads?'''
    cluster: sira
  menstruant-at-arafa-undoes-hair-combs-enters-hajj:
    label: 'Menstruating on the day of ʿArafa, Aisha is told: leave your umra, undo your hair, comb it and enter the hajj; later her brother takes her to al-Tanʿīm for an umra in its place'
    cluster: pilgrimage
  musked-cloth-to-follow-trace-of-blood:
    label: 'An Anṣārī woman asks about the bath from menstruation: ''take a piece of cloth (firṣa) with musk and purify yourself with it''; Aisha draws her aside: ''follow the trace of the blood with it'''
    cluster: purity
  glory-to-god-too-shy-to-explain:
    label: Asked thrice how to purify herself with it, he says 'purify yourself with it' and 'Glory to God!', leaving Aisha to explain
    cluster: sira
  screened-with-cloth-while-bathing:
    label: Umm Hāniʾ finds the prophet bathing in the year of the conquest with his daughter Fatima screening him with a cloth; Maymuna screens him too
    cluster: purity
  favourite-screen-a-mound-or-palm-cluster:
    label: The screen he liked best for relieving himself was a mound (hadaf) or a cluster of palms; he took ʿAbd Allāh b. Jaʿfar behind him on his mount and told him a secret
    cluster: sira
  urinates-behind-leather-shield-like-a-woman:
    label: He comes out with a leather shield, screens himself with it and urinates; they say 'look, he urinates as a woman does'
    cluster: sira
  israelites-cut-off-what-urine-touched-forbidder-punished:
    label: '''Do you not know what befell the man of the Israelites? When urine touched them they cut off what it touched; he forbade them, and was punished in his grave'''
    cluster: israelites
  god-is-modest-and-screening-loves-modesty:
    label: 'Seeing a man bathe in the open without a wrapper, he mounts the pulpit: ''God is modest and screening (ḥayiyy sittīr), he loves modesty and screening; when you bathe, screen yourselves'''
    cluster: theology
  woman-undressing-outside-home-tears-veil-with-god:
    label: '''Any woman who takes off her clothes outside her own house tears what is between her and God''; Aisha to women of Syria from the district whose women enter the baths'
    cluster: purity
  bathhouse-only-with-wrapper-no-wife-no-wine-table:
    label: Whoever believes in God and the last day does not enter the bathhouse without a wrapper, does not take his wife to the bathhouse, and does not sit at a table where wine goes round
    cluster: purity
  israelites-bathed-naked-looking-at-each-other:
    label: The Israelites used to bathe naked, looking at one another; Moses bathed alone
    cluster: moses
  wrapper-drops-carrying-stone-do-not-walk-naked:
    label: 'al-Miswar, carrying a heavy stone, loses his light wrapper and cannot put the stone down: ''go back to your garment and take it; do not walk naked'''
    cluster: purity
  naked-youths-whip-with-twisted-wrappers:
    label: 'Quraysh youths take off their wrappers, twist them into whips (makhārīq) and lash each other naked; they call the passers ''priests (qissīsūn), leave them''; the prophet comes out angry: ''they neither felt shame before God nor screened themselves from his messenger'''
    cluster: sira
  passers-taken-for-priests:
    label: 'Seeing two passers-by, the naked youths say: ''these are priests (qissīsūn), leave them'''
    cluster: sira
  no-looking-at-same-sex-nakedness-no-sharing-one-garment:
    label: No man looks at a man's nakedness nor woman at a woman's, nor does a man lie with a man (or woman with woman) under one garment
    cluster: purity
  goes-round-his-wives-with-one-bath:
    label: The prophet went round his wives with a single bath
    cluster: purity
  sometimes-bathed-sometimes-only-ablution-before-sleep:
    label: 'Asked whether he bathed from janāba before sleeping: ''he did both; sometimes he bathed and slept, sometimes he performed ablution and slept'''
    cluster: purity
  god-made-latitude-in-the-matter-refrain:
    label: The questioner answers each 'sometimes this, sometimes that' with 'God is greatest! Praise God who made latitude in the matter'
    cluster: ritual
  bath-witr-recitation-early-or-late-loud-or-soft:
    label: 'The bath in the first or last part of the night, the witr early or late, the recitation loud or soft: each sometimes one way, sometimes the other'
    cluster: ritual
  remembers-janaba-at-prayer-place-stay-in-places:
    label: 'The rows straightened and standing, the prophet in his place remembers he is junub: ''stay in your places''; he bathes and returns with his head dripping, says the takbir and leads them'
    cluster: ritual
  convert-bathes-with-water-and-lote-leaves:
    label: Coming to accept Islam, Qays b. ʿĀṣim is told to bathe with water and lote leaves (sidr)
    cluster: conversion
units:
- id: hadith-4-sea-water-pure
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Sea water is purifying and its dead lawful: the seafarers'' question'
  read:
  - Jāmiʿ 4:882.1-882.2
  tags:
  - motif: sea-water-purifying-its-dead-lawful
    refs:
    - Jāmiʿ 4:882.1
    - Jāmiʿ 4:882.2
    note: هو الطَّهور ماؤه، الحِلُّ ميتتُه
  - motif: seafarers-short-of-water-ask-about-ablution
    refs:
    - Jāmiʿ 4:882.1
    note: إنا نركبُ البحْرَ، ونَحْمِلُ معنا القَليلَ من الماء، فإن توضَّأنا به عَطِشْنا
- id: hadith-4-hand-washed-after-sleep
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Wash the hand before putting it in the vessel on waking: ''he does not know where his hand spent the night'''
  read:
  - Jāmiʿ 4:884.1
  tags:
  - motif: wash-hand-before-vessel-after-sleep
    refs:
    - Jāmiʿ 4:884.1
    note: فإن أحدكم لا يدري أين بانت يدُه
- id: hadith-4-water-not-made-impure
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Water of two qullas bears no filth; 'water does not become junub'; the well of Buḍāʿa
  read:
  - Jāmiʿ 4:884.2-885.2
  tags:
  - motif: water-of-two-qullas-bears-no-filth
    refs:
    - Jāmiʿ 4:884.2
    note: إذا كان الماء قلتين لم يحمل الخبَث
  - motif: water-does-not-become-junub
    refs:
    - Jāmiʿ 4:885.1
    note: إن الماء لا يُجْنِبُ
  - motif: budaa-well-water-not-made-impure
    refs:
    - Jāmiʿ 4:885.2
    note: يُطرح فيها الحيضُ ولحوم الكلاب والنَّتْنُ
  hints:
  - 'The quantity rule (two qullas: water above a measure is not defiled) against the mishnaic minimum of forty se''ah for an immersion pool (m. Miqwaot 2:1-2); both set a volume below which water can be made impure.'
- id: hadith-4-believer-not-impure
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Taking a junub man by the hand: ''the believer does not become impure'''
  read:
  - Jāmiʿ 4:888.1-888.2
  tags:
  - motif: believer-does-not-become-impure
    refs:
    - Jāmiʿ 4:888.1
    - Jāmiʿ 4:888.2
    note: إن المؤمن لا ينجُس
- id: hadith-4-brass-vessel-ablution
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Ablution from a brass basin: face three times, arms twice, head wiped forward and back'
  read:
  - Jāmiʿ 4:888.3
  tags:
  - motif: ablution-from-brass-basin
    refs:
    - Jāmiʿ 4:888.3
    note: فأخرجنا له ماءً في تَوْرٍ من صُفْر
  - motif: ablution-face-thrice-arms-twice-head-forward-and-back
    refs:
    - Jāmiʿ 4:888.3
    note: فغسل وجهه ثلاثا، ويديه مرتين مرتين، ومسح برأسه فأقبل به وأدبر
- id: hadith-4-dog-licked-vessel
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: A vessel a dog drank from is washed seven times, the eighth rubbed with earth; dogs killed then hunting and herd dogs allowed
  read:
  - Jāmiʿ 4:889.1-890.1
  tags:
  - motif: vessel-licked-by-dog-washed-seven-times
    refs:
    - Jāmiʿ 4:889.1
    - Jāmiʿ 4:890.1
    note: فليغسله سبع مرات
  - motif: eighth-washing-rubbed-with-earth
    refs:
    - Jāmiʿ 4:890.1
    note: وعَفِّرُوه الثامنةَ في التراب
  - motif: killing-of-dogs-ordered-then-restricted
    refs:
    - Jāmiʿ 4:890.1
    note: 'أمر رسول اللَّه ﷺ بقتل الكلاب، ثم قال: "ما بالُهم وبالُ الكلاب؟ "، ثم رخَّصَ في كلب الصيدِ وكلب الغَنَم'
  - motif: hunting-herding-and-crop-dogs-exempted
    refs:
    - Jāmiʿ 4:890.1
    note: ورخص في كلب الغنم والصيد والزرع
  hints:
  - Seven washings and earth for a vessel a dog licked, against the Hittite instructions to temple personnel where food or vessels touched by a pig or a dog are polluted and must not reach the god (cf. vocabulary 'polluted-food-to-god-repaid-with-dung-urine'); against Lev 15:12 and 11:32-33, where a defiled earthen vessel is broken and a wooden one rinsed in water.
- id: hadith-4-water-from-polytheist-woman
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Forty thirsty men drink from a polytheist woman's water-skin and wash their junub companion
  read:
  - Jāmiʿ 4:890.2
  tags:
  - motif: water-drunk-from-polytheist-womans-skin
    refs:
    - Jāmiʿ 4:890.2
    note: شربنا ونحن أربعون رجلًا عِطاشٌ، من مزادة امرأة مشركةٍ
- id: hadith-4-cat-not-impure
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Abu Qatada tilts the vessel for a cat: ''it is not impure; it is of those who go round among you'''
  read:
  - Jāmiʿ 4:890.3
  tags:
  - motif: cat-not-impure-one-who-goes-round
    refs:
    - Jāmiʿ 4:890.3
    note: إنها ليستْ بنجسٍ؛ إنما هي من الطوافين عليكم أو الطوافات
- id: hadith-4-practices-of-the-fitra
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: The five (and the ten) practices of the fitra
  read:
  - Jāmiʿ 4:892.1
  - Jāmiʿ 4:893.1
  tags:
  - motif: five-practices-of-the-fitra
    refs:
    - Jāmiʿ 4:892.1
    note: الختان، والاستحداد، وتقليم الأظفار، ونتف الإبط، وقص الشارب
  - motif: ten-practices-of-the-fitra-tenth-forgotten
    refs:
    - Jāmiʿ 4:893.1
    note: ونسيتُ العاشرة، إلا أن تكون المضمضة
  - motif: washing-the-knuckles
    refs:
    - Jāmiʿ 4:893.1
    note: وغسل البراجم
  hints:
  - Ten purity practices listed as the fitra against the vocabulary's 'abraham-tested-with-ten-purities' (the tafsir of Q 2:124), where the same items are the 'words' Abraham was tested with; here they carry no Abraham frame.
- id: hadith-4-moustache-and-beard
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Trim the moustache, let the beard grow, differ from the polytheists and the Magians; forty-day limit; trimmed over a toothstick
  read:
  - Jāmiʿ 4:892.2
  - Jāmiʿ 4:893.2-894.3
  tags:
  - motif: trim-moustache-grow-beard-to-differ
    refs:
    - Jāmiʿ 4:892.2
    - Jāmiʿ 4:893.2
    note: خالفوا المشركين؛ وفِّروا اللِّحَى، واحفوا الشوارب
  - motif: beard-grasped-excess-cut-at-pilgrimage
    refs:
    - Jāmiʿ 4:892.2
    note: وكان ابن عمر إذا حجّ أو اعتمر قبض على لحيته، فما فضل أخذه
  - motif: grooming-not-left-beyond-forty-days
    refs:
    - Jāmiʿ 4:894.1
    note: أن لا تترك أكثر من أربعين يومًا
  - motif: moustache-trimmed-over-a-toothstick
    refs:
    - Jāmiʿ 4:894.2
    note: وكان شاربي وفَي فقصَّه لي رسول اللَّه ﷺ على سواكٍ
  - motif: who-does-not-trim-moustache-not-of-us
    refs:
    - Jāmiʿ 4:894.3
    note: من لم يأخذ شاربه فليس منَّا
  hints:
  - Letting the beard grow and clipping the moustache 'to differ from the Magians' (khālifū l-majūs) against Lev 19:27 and 21:5, which forbid marring the corners of the beard; the hadith names the community it differs from, the Levitical law gives no reason.
- id: hadith-4-abraham-circumcision
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Abraham circumcised at eighty with the adze
  read:
  - Jāmiʿ 4:895.1
  tags:
  - motif: abraham-circumcised-at-eighty-with-adze
    refs:
    - Jāmiʿ 4:895.1
    note: اختتن إبراهيم ﵇ وهو ابن ثمانين سنةً بالقدُّومِ
  hints:
  - Abraham circumcised at eighty with an adze (al-qadūm) against Gen 17:24, where he is ninety-nine; the instrument against the flint knives of Josh 5:2-3.
- id: hadith-4-remembers-god-in-all-states
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: He remembered God in all his states
  read:
  - Jāmiʿ 4:900.1
  tags:
  - motif: remembers-god-in-every-state
    refs:
    - Jāmiʿ 4:900.1
    note: كان النبي ﷺ يذكر الله على كل أحيانه
- id: hadith-4-only-pure-touch-quran
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'The letter to Amr b. Hazm: none touches the Quran but one who is pure'
  read:
  - Jāmiʿ 4:900.2
  tags:
  - motif: only-the-pure-touch-the-quran
    refs:
    - Jāmiʿ 4:900.2
    note: ولا يمسُّ القرآن إلّا طاهر
  hints:
  - A written ruling that only the pure touch the scripture against the rabbinic rule that sacred scrolls 'defile the hands' (m. Yadayim 3:2, 3:5), where touching scripture makes the hands impure rather than requiring purity before touch.
- id: hadith-4-prophets-ablution-water
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'People take the prophet''s leftover ablution water: rubbing it on themselves, near fighting over it, drinking it, poured over Jabir, Ali drinks his own'
  read:
  - Jāmiʿ 4:905.1-907.2
  tags:
  - motif: people-take-the-prophets-ablution-water
    refs:
    - Jāmiʿ 4:905.1
    - Jāmiʿ 4:906.2
    note: فجعل الناس يأخذون من فضل وَضوئه، فيتمسحون به
  - motif: followers-catch-spittle-and-ablution-water
    refs:
    - Jāmiʿ 4:906.1
    note: وإذا توضأ النبي ﷺ كادوا يقتّتلون على وَضوئه
  - motif: spat-into-as-a-boy-from-their-well
    refs:
    - Jāmiʿ 4:906.1
    note: وهو الذي مجَّ رسول الله ﷺ في وجهه وهو غلام من بئرهم
  - motif: seal-between-shoulders-like-pigeon-egg
    refs:
    - Jāmiʿ 4:906.2
    note: فنظرت إلى خاتم النبوة بين كتفيه مثل زِرَّ الحَجَلة
  - motif: sick-boy-wiped-drinks-ablution-water
    refs:
    - Jāmiʿ 4:906.2
    note: فمسح رأسي ودعا لي بالبركة، ثم توضأ فشربت من وَضُوئه
  - motif: cup-washed-and-spat-into-drunk-and-poured-on-faces
    refs:
    - Jāmiʿ 4:906.3
    note: اشربا منه، وأفرِغا على وجوهكما ونحوركما وأبشرا
  - motif: sick-man-revived-by-ablution-water
    refs:
    - Jāmiʿ 4:907.1
    note: فتوضأ النبي ﷺ، ثم صبَّ وَضوءَه عليَّ
  - motif: drinks-leftover-ablution-water-standing
    refs:
    - Jāmiʿ 4:907.2
    note: ثم قام فشَرِب فضلَ وضوئه
- id: hadith-4-leftover-of-other-sex
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Forbidden: man bathing with a woman''s leftover water, or woman with a man''s'
  read:
  - Jāmiʿ 4:907.3-908.1
  tags:
  - motif: not-bathe-with-other-sexs-leftover
    refs:
    - Jāmiʿ 4:907.3
    - Jāmiʿ 4:908.1
    note: نهى رسول الله ﷺ أن تغتسل المرأةُ بفضل الرجل، أو يغتسل الرجل بفضل المرأة
- id: hadith-4-one-vessel-for-husband-and-wife
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Husband and wife bathing from one vessel (the faraq); men and women performing ablution together
  read:
  - Jāmiʿ 4:908.2-910.1
  tags:
  - motif: husband-and-wife-bathe-from-one-vessel
    refs:
    - Jāmiʿ 4:908.2
    - Jāmiʿ 4:909.1
    - Jāmiʿ 4:909.2
    - Jāmiʿ 4:909.3
    note: كنت أغتسل أنا والنبي ﷺ من إناء واحد من قدح، يقال له الفَرَقُ
  - motif: men-and-women-perform-ablution-together
    refs:
    - Jāmiʿ 4:909.4
    note: كان الرجال والنساء يتوضَّؤُون في زمان النبي ﷺ جميعًا
  - motif: hands-alternate-in-one-vessel
    refs:
    - Jāmiʿ 4:910.1
    note: اختلفت يدي ويد رسول الله ﷺ في إناء واحد
- id: hadith-4-privy-formulas
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'Entering and leaving the privy: refuge from the male and female devils; privies are haunted; ''your forgiveness'''
  read:
  - Jāmiʿ 4:910.2-912.1
  tags:
  - motif: refuge-from-male-and-female-devils-on-entering-privy
    refs:
    - Jāmiʿ 4:910.2
    - Jāmiʿ 4:911.1
    note: اللهم إني أعوذ بك من الخُبُث والخبائث
  - motif: privies-are-attended-by-devils
    refs:
    - Jāmiʿ 4:911.1
    note: إن هذه الحُشوش مُحْتَضَرة
  - motif: your-forgiveness-on-leaving-privy
    refs:
    - Jāmiʿ 4:912.1
    note: 'كان إذا خرج من الغائط قال: "غفرانك"'
  hints:
  - 'A formula on entering the privy against the demons who frequent it, and another on leaving: compare b. Berakhot 60b, which prescribes words on entering the privy (addressed to the attending angels, ''be honoured, honoured ones'') and the blessing ''who formed man in wisdom'' on leaving; and the demon of the privy (shed shel beit ha-kise) of b. Berakhot 62a and b. Shabbat 67a.'
- id: hadith-4-relieve-before-prayer
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Relieve yourself before prayer; no prayer with food present or when the two foul things press
  read:
  - Jāmiʿ 4:913.1-914.1
  tags:
  - motif: relieve-oneself-before-prayer
    refs:
    - Jāmiʿ 4:913.1
    - Jāmiʿ 4:914.1
    note: إذا أراد أحدكم الغائط فليبدأ به قبل الصلاة
  - motif: no-prayer-with-food-served-or-urge-pressing
    refs:
    - Jāmiʿ 4:913.2
    note: لا صلاة بحضرة الطعام، ولا وهو يُدافعه الأخْبثان
  - motif: imam-goes-to-relieve-himself-before-leading
    refs:
    - Jāmiʿ 4:913.1
    note: فحضرت الصلاة يومًا، فذهب لحاجته ثم رجع
  hints:
  - 'No prayer while the bowels press, against b. Berakhot 23a: ''one who needs to relieve himself should not pray, and if he prayed, his prayer is an abomination''.'
- id: hadith-4-washes-face-after-night-relief
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Rising at night he relieves himself, washes face and hands and sleeps
  read:
  - Jāmiʿ 4:915.1
  tags:
  - motif: washes-face-and-hands-after-night-relief-and-sleeps
    refs:
    - Jāmiʿ 4:915.1
    note: فقضى حاجته، ثم غسل وجهه، ويديه، ثم نام
- id: hadith-4-toothstick-at-every-prayer
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: 'But for the hardship: the toothstick at every prayer (and every ablution); ''I have said much to you about the toothstick''; the pen behind the ear'
