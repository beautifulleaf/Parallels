- id: hadith-5-screened-bathing-and-relieving
  tradition: islam
  corpus: hadith
  original: true
  tagger: Claude Opus 5.5, reading the Arabic
  title: Screened while bathing (Fatima, Maymuna, Abu al-Samh); the best screen a mound or a palm grove; the Israelite punished in his grave; God is modest and screening
  read:
  - Jāmiʿ 5:972.2-975.1
  tags:
  - motif: screened-with-cloth-while-bathing
    refs:
    - Jāmiʿ 5:972.2
    - Jāmiʿ 5:973.1
    note: فوجدتُه يَغْتَسِلُ، وفاطمةُ ابنتُه تستُره بثوبٍ
  - motif: favourite-screen-a-mound-or-palm-cluster
    refs:
    - Jāmiʿ 5:973.2
    note: وكان أحبَّ ما استتر به رسولُ الله ﷺ لحاجته هَدَفٌ، أو حائِشٌ نَخْلٍ
  - motif: urinates-behind-leather-shield-like-a-woman
    refs:
    - Jāmiʿ 5:973.3
    note: 'فخرج ومعه دَرَقةٌ، ثم استتر بها، ثم بال، فقلنا: انظروا إليه يَبولُ كما تَبولُ المرأة'
  - motif: israelites-cut-off-what-urine-touched-forbidder-punished
    refs:
    - Jāmiʿ 5:973.3
    note: كانوا إذا أصابهم البولُ قطعوا ما أصابه البول منهم؛ فنهاهم فعُذِّب في قبره
  - motif: god-is-modest-and-screening-loves-modesty
    refs:
    - Jāmiʿ 5:974.1
    note: إنَّ الله ﷿ حَيِيٌّ سِتِّير يُحبّ الحياءَ والسِّتْرَ
  - motif: servant-screens-bathing-prophet-with-his-back
    refs:
    - Jāmiʿ 5:975.1
    note: فأوَلِّيه قفايّ، وأنشر الثوبَ، فأستره به
  hints:
  - The Israelites cutting away what urine touched (their garment, in the compiler's reading, or skin) against the severity of Israelite purity law (Lev 13:47-58, the garment with a plague torn out or burned); the forbidder punished in his grave.
- id: hadith-5-women-and-the-bathhouse
  tradition: islam
  corpus: hadith
