      - {motif: pledge-without-consultation-void, note: من بايع رجلا عن غير مشورة من المسلمين فلا يبايع هو ولا الذي بايعه تغرة أن يقتلا ... إنما كانت بيعة أبي بكر فلتة, refs: ['Jāmiʿ 48:5608.1']}
      - {motif: rulers-from-quraysh-helpers-ministers, note: إن رسول الله كان من المهاجرين وإنما الإمام يكون من المهاجرين ونحن أنصاره, refs: ['Jāmiʿ 48:5610.1']}
      - {motif: rulers-from-quraysh-helpers-ministers, note: فأيكم تطيب نفسه أن يتقدم أبا بكر؟, refs: ['Jāmiʿ 48:5611.1']}
      - {motif: second-of-two-in-the-cave, note: وإن أبا بكر صاحب رسول الله ثاني اثنين فإنه أولى المسلمين بأموركم, refs: ['Jāmiʿ 48:5607.1']}
      - {motif: second-of-two-in-the-cave, note: ثاني اثنين إذ هما في الغار ... لا تحزن إن الله معنا, refs: ['Jāmiʿ 48:5611.2']}
      - {motif: people-had-no-prophet-die-before, note: وكانوا أميين لم يكن فيهم نبي قبله فقالوا ... كيف نصلي عليه؟, refs: ['Jāmiʿ 48:5611.2']}
      - {motif: prophet-buried-where-soul-taken, note: في المكان الذي قبض فيه روحه فإنه لم يقبض روحه إلا في مكان طيب, refs: ['Jāmiʿ 48:5611.2']}
      - {motif: you-are-companions-of-joseph, note: إن أبي رجل أسيف ... إنكن صواحب يوسف, refs: ['Jāmiʿ 48:5611.2']}
    hints:
      - "Umar's 'verse of stoning' for whoever commits adultery when muhsan, 'if proof is established or pregnancy or confession', against Deut 22:22-24, stoning of the betrothed girl and the man, with the witnesses' role."
