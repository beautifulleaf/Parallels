      - {motif: stoning-verse-in-gods-book, note: فكان مما أنزل الله آية الرجم فقرأناها وعقلناها ووعيناها رجم رسول الله ورجمنا بعده ... إذا قامت البينة أو كان الحبل أو الاعتراف, refs: ['Jāmiʿ 48:5608.1']}
      - {motif: stoning-verse-in-gods-book, note: ثم إنا كنا نقرأ فيما نقرأ من كتاب الله أن لا ترغبوا عن آبائكم فإنه كفر بكم, refs: ['Jāmiʿ 48:5608.1']}
