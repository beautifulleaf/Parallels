    title: Described in the Torah and the Gospel
    read: ['Jāmiʿ 48:5655.3-5655.4']
    quran: ['33:45']
    tags:
      - {motif: prophet-described-in-torah, note: إنه لموصوف في التوراة ببعض صفته في القرآن يا أيها النبي إنا أرسلناك شاهدا ومبشرا ونذيرا وحرزا للأميين أنت عبدي ورسولي سميتك المتوكل, refs: ['Jāmiʿ 48:5655.3']}
      - {motif: not-harsh-not-shouting-in-markets, note: ليس بفظ ولا غليظ ولا سخاب في الأسواق ولا يدفع السيئة ولكن يعفو ويغفر, refs: ['Jāmiʿ 48:5655.3']}
      - {motif: crooked-community-straightened-before-death, note: ولن يقبضه الله حتى يقيم به الملة العوجاء بأن يقولوا لا إله إلا الله ويفتح بها أعينا عميا وآذانا صما وقلوبا غلفا, refs: ['Jāmiʿ 48:5655.3']}
      - {motif: not-harsh-not-shouting-in-markets, note: مكتوب في الانجيل لا فظ ولا غليظ ولا صخاب في الأسواق ولا يجزي بالسيئة مثلها ولكن يعفو ويصفح, refs: ['Jāmiʿ 48:5655.4']}
    hints:
      - "The Torah description 'my servant ... not harsh, not clamouring in the markets ... to open blind eyes, deaf ears' against Isa 42:1-7: 'Behold my servant (avdi) ... he shall not cry nor lift up, nor cause his voice to be heard in the street (ba-hus) ... a bruised reed he shall not break ... to open the blind eyes'."
      - "The Gospel description 'not clamouring in the markets' against Matt 12:18-20, which quotes Isa 42 of Jesus: 'he shall not strive nor cry, neither shall any man hear his voice in the streets (en tais plateiais)'."
      - "The 'uncircumcised hearts' (qulub ghulf) to be opened, against Deut 10:16 and Jer 4:4, 'circumcise the foreskin of your heart'."
