      - {motif: no-distress-after-today, note: 'واكرب أباه فقال لها: ليس على أبيك كرب بعد اليوم', refs: ['Jāmiʿ 48:5603.3']}
      - {motif: no-distress-after-today, note: إنه قد حضر من أبيك ما ليس بتارك منه أحدا الموافاة يوم القيامة, refs: ['Jāmiʿ 48:5603.4']}
  - id: hadith-48-abu-bakr-kisses-umar-denies
