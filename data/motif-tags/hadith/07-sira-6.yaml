new_motifs:
  best-man-holds-horse-rein-or-tends-flock: {cluster: ethics, label: 'Best of people: a man holding his horse''s rein in God''s path, and a man in the desert with his flock who hosts his guest and pays its due'}
  repeated-question-did-he-say-it: {cluster: transmission, label: 'A listener asks three times ''Did he say it?'' and is told ''He said it'', then glorifies God'}
  raid-destination-concealed-by-feint: {cluster: warfare, label: 'The prophet never announced a raid''s real destination but feigned another (warra bi-ghayriha), except this one'}
  laggard-postpones-preparation-day-by-day: {cluster: narrative-frame, label: 'A man goes out each morning to prepare for the march, returns having done nothing, and tells himself he can still catch up'}
  laggard-confesses-truth-refusing-excuse: {cluster: repentance, label: 'Of the men who stayed behind, eighty-odd swear false excuses and are accepted; one tells the truth that he had no excuse and is told to wait for God''s decision'}
  community-boycott-of-fifty-nights: {cluster: law, label: The community is forbidden to speak to three men; no one returns their greeting for fifty nights until the earth seems strange}
  greeting-unanswered-by-dearest-kinsman: {cluster: narrative-frame, label: 'The boycotted man climbs his cousin''s garden wall and greets him; the cousin will not answer, only ''God and his messenger know best'''}
  foreign-king-letter-burned-in-oven: {cluster: narrative-frame, label: A Nabataean trader brings a letter from the king of Ghassan inviting the shunned man over; he calls it a trial and burns it in the oven}
  boycotted-man-told-to-keep-from-wife: {cluster: law, label: On the fortieth night the shunned men are ordered to keep away from their wives; one wife may still serve her old husband but he may not approach her}
  glad-tidings-shouted-from-mountain: {cluster: repentance, label: A crier on Mount Sal' shouts the good news of forgiveness; the voice is faster than the horseman sent}
  messenger-of-good-news-given-garments: {cluster: custom, label: The man forgiven strips off his only two garments to give the bearer of good news and borrows two to wear}
  prophets-face-like-piece-of-moon: {cluster: prophet-body, label: When the prophet was glad his face shone as though it were a piece of the moon}
  penitent-keeps-part-of-wealth: {cluster: repentance, label: 'The penitent offers to give away all his property; told to keep some, he keeps his share at Khaybar'}
  shortening-prayer-twenty-days-at-camp: {cluster: ritual, label: The prophet stayed twenty days at Tabuk shortening the prayer}
  mountain-loves-us-and-we-love-it: {cluster: sacred-space, label: 'Returning to Medina: ''This is Taba, and this is Uhud, a mountain that loves us and we love it'''}
  those-held-back-by-excuse-share-reward: {cluster: ethics, label: Men who stayed in Medina held back by an excuse were with the army in every valley it crossed}
  children-meet-returning-army-at-farewell-pass: {cluster: custom, label: Boys go out to meet the prophet returning from Tabuk at Thaniyyat al-Wada'}
  napkins-of-saad-in-paradise-better-than-silk: {cluster: eschatology, label: 'Shown a silk robe whose softness amazes people, the prophet says Sa''d b. Mu''adh''s napkins in paradise are better and softer'}
  gold-woven-gift-of-ruler-returned: {cluster: law, label: 'A Christian ruler''s gift, a gold-woven coat of the kind Chosroes gave, is refused since whoever wears it here is denied it hereafter, then sent to Umar to sell'}
  no-naked-circumambulation-after-this-year: {cluster: ritual, label: 'Proclamation at the pilgrimage: after this year no polytheist shall make pilgrimage and no one shall circle the House naked'}
  young-judge-promised-steady-tongue: {cluster: prophecy, label: 'Sent to judge people older than himself, the young envoy is told God will make his tongue firm and guide his heart'}
  envoy-takes-slave-girl-from-the-fifth: {cluster: law, label: 'The envoy apportions the captives, the best slave-girl falls to the fifth then to his own family, and he comes out with his head dripping from the bath'}
  share-in-fifth-greater-than-the-girl: {cluster: law, label: 'Do not hate him: his family''s share of the fifth is greater than a slave-girl'}
  gold-in-its-earth-divided-among-four-chiefs: {cluster: law, label: 'A nugget of gold still in its ore is divided among four Najdi chiefs to win their hearts, angering Quraysh'}
  objector-with-shaven-head-tells-prophet-fear-god: {cluster: polemic, label: 'A man with thick beard, prominent cheeks, sunken eyes, bulging brow and shaven head tells the prophet ''Fear God, Muhammad!'''}
  troops-may-return-or-stay-with-new-commander: {cluster: warfare, label: 'When a new commander replaces the old, each soldier may choose to stay on (yu''aqqib) with him or go home'}
  make-easy-not-hard-give-good-news: {cluster: ethics, label: 'Two governors are told: make things easy not hard, give good news and do not repel, agree and do not differ'}
  barley-beer-and-honey-mead-named: {cluster: law, label: 'Local drinks are named, mizr from barley and bit'' from honey; answer: every intoxicant is forbidden'}
  sleep-counted-as-worship-like-vigil: {cluster: piety, label: One governor reads the Quran by snatches day and night; the other sleeps then rises and 'counts my sleep as I count my rising'}
  apostate-executed-before-dismounting: {cluster: law, label: 'Visiting his colleague, the governor finds a Jew who accepted Islam and apostatized bound, and refuses to dismount until he is killed'}
  call-to-people-of-book-in-ordered-steps: {cluster: law, label: 'Mission to People of the Book in steps: first the two testimonies, then five daily prayers, then alms taken from the rich and returned to the poor'}
  oppressed-mans-prayer-no-veil-to-god: {cluster: ethics, label: 'Beware the prayer of the wronged: there is no veil between it and God'}
  prophet-walks-beside-mounted-envoy: {cluster: narrative-frame, label: 'The prophet walks beneath the mount of the departing envoy, advising him, and says he may next pass only his mosque and grave'}
  weeping-from-satan: {cluster: demonology, label: '''Do not weep, Mu''adh: weeping is from Satan'''}
  rival-kaaba-burned-and-broken: {cluster: idolatry, label: 'Dhu l-Khalasa, a house with a worshipped stone called the Yemeni Ka''ba, is burned with fire and broken by 150 riders'}
  hand-struck-on-chest-for-firm-seat: {cluster: miracle, label: 'A man who cannot sit a horse is struck on the chest, the print of the hand left there, and never falls from a horse again'}
  diviner-made-to-break-arrows: {cluster: idolatry, label: A man casting divining arrows is made to break them and confess God or lose his head}
  idol-house-left-like-mangy-camel: {cluster: idolatry, label: 'The messenger reports the idol-house left ''like a mangy (tarred) camel'', blackened'}
  blessing-five-times-on-horses-and-men: {cluster: ritual, label: The prophet blesses the horses and men of Ahmas five times}
  jews-would-make-day-of-verse-a-feast: {cluster: polemic, label: 'Jews say: had the verse ''Today I have perfected your religion'' come to us we would take that day as a feast; Umar: it came at Arafa'}
  one-pilgrimage-after-emigration: {cluster: ritual, label: The prophet made nineteen raids and only one pilgrimage after the emigration}
  wives-confined-after-this-pilgrimage: {cluster: law, label: 'To his wives: ''This pilgrimage, then the backs of the mats'' (stay home)'}
  jahiliyya-blood-and-usury-under-my-feet: {cluster: law, label: 'Everything of the Jahiliyya is under my feet: its blood-claims and its usury abolished, beginning with our own'}
  finger-raised-to-sky-pointed-at-people: {cluster: ritual, label: 'He raises the forefinger to the sky and points it at the people: ''O God, bear witness'' three times'}
  silent-pause-before-naming-month-and-land: {cluster: narrative-frame, label: 'He asks which month, land and day this is, and falls silent until they think he will rename them'}
  no-approach-to-house-until-after-arafa: {cluster: ritual, label: 'After the arrival circumambulation and running, he did not approach the Ka''ba until he returned from Arafa'}
  two-weighty-things-book-and-household: {cluster: prophecy, label: 'At the pool of Khumm: I leave you two weighty things, God''s book and my household (repeated three times)'}
  household-defined-by-barred-from-alms: {cluster: law, label: 'The household are those barred from alms: the families of Ali, Aqil, Ja''far and Abbas'}
  young-commander-like-his-father: {cluster: warfare, label: Those who challenge the young commander's appointment challenged his father's before him}
  dying-prophet-chooses-house-of-favorite-wife: {cluster: death-of-prophet, label: 'In his last illness he asks ''Where am I tomorrow?'', and the wives let him be nursed in Aisha''s house'}
  died-between-chest-and-throat: {cluster: death-of-prophet, label: 'He died between her chest and throat, her saliva mixed with his through a softened toothstick'}
  water-from-seven-untied-skins: {cluster: ritual, label: '''Pour on me from seven waterskins whose ties have not been undone'', seated in a tub'}
  forced-medicine-all-but-one-must-take: {cluster: death-of-prophet, label: 'Dosed against his will (ladd), he orders everyone present dosed except his uncle who was not there'}
  pleurisy-god-would-not-send: {cluster: death-of-prophet, label: 'Feared to have pleurisy (dhat al-janb), he says it is a disease God would not cast on him'}
  slave-of-the-stick-after-three: {cluster: death-of-prophet, label: 'Abbas: ''After three days you will be the slave of the stick; I know the faces of Abd al-Muttalib''s sons at death'''}
  dying-prophet-asks-for-writing: {cluster: death-of-prophet, label: 'Thursday: ''Bring me something to write a document after which you will not go astray''; they dispute and are dismissed'}
  three-last-bequests-third-forgotten: {cluster: death-of-prophet, label: 'Three bequests: expel the polytheists from Arabia, reward delegations as I did; the third was forgotten'}
  suffering-sheds-sins-like-leaves: {cluster: theology, label: No Muslim is struck by harm but God sheds his sins as a tree sheds its leaves; the prophet's fever is double}
  wife-blows-protective-suras-with-his-hand: {cluster: ritual, label: In his last illness his wife breathes the protective suras over him and wipes him with his own hand}
  last-prayer-recited-al-mursalat: {cluster: death-of-prophet, label: 'The last prayer he led was the sunset prayer, reciting al-Mursalat'}
  fainting-and-washing-before-prayer-thrice: {cluster: death-of-prophet, label: 'Three times he washes in the tub, tries to rise, faints, wakes and asks ''Have the people prayed?'''}
  you-are-companions-of-joseph: {cluster: narrative-frame, label: 'Rebuking the wives who urge another prayer leader: ''You are the women of Joseph''s story'''}
  face-like-page-of-mushaf: {cluster: prophet-body, label: On his last Monday he lifts the curtain and smiles at the rows; his face is like a page of a Quran codex}
  ansar-my-stomach-and-saddlebag: {cluster: ethics, label: 'The Ansar are ''my stomach and my saddlebag'' (karishi wa-''aybati): accept their good and pass over their wrong'}
  only-good-dreams-left-of-prophecy: {cluster: dreams, label: Nothing remains of the heralds of prophecy but the good dream a righteous man sees or is shown}
  last-words-prayer-and-slaves: {cluster: death-of-prophet, label: 'His last words: ''The prayer, the prayer; fear God regarding those your right hands own'''}
  no-special-bequest-only-gods-book: {cluster: death-of-prophet, label: 'He made no bequest to anyone; asked who was his executor, his wife says he died in her lap; his only bequest was the Book'}
  prophet-shown-seat-then-given-choice: {cluster: death-of-prophet, label: 'No prophet dies until he is shown his seat in paradise and given the choice; hoarse, he says ''the highest companion'''}
  servant-chose-what-is-with-god: {cluster: death-of-prophet, label: '''A servant was offered the world''s flower and chose what is with God''; only Abu Bakr understands and weeps'}
  only-abu-bakrs-door-left-open: {cluster: sacred-space, label: Every small door into the mosque is to be closed except Abu Bakr's}
  sees-the-basin-from-the-pulpit: {cluster: eschatology, label: 'From the pulpit: ''I am looking at the Basin from where I stand'''}
  death-has-its-stupors: {cluster: death-of-prophet, label: 'Dipping his hands in water and wiping his face: ''There is no god but God; death has its stupors'''}
  surat-al-nasr-as-notice-of-death: {cluster: death-of-prophet, label: The sura of help and victory is read as God's notice to the prophet of his term}
  daughter-weeps-then-laughs-at-secret: {cluster: death-of-prophet, label: 'He whispers to his daughter and she weeps (he will die), whispers again and she laughs (she will be first of his family to follow)'}
  city-lit-on-arrival-dark-on-death: {cluster: death-of-prophet, label: The day he entered Medina everything in it shone; the day he died everything in it went dark}
  distant-sage-knows-death-before-news: {cluster: prophecy, label: A Yemeni noble tells the envoy 'your master passed his term three days ago' before the riders bring the news}
  rule-by-consultation-becomes-kingship-by-sword: {cluster: polity, label: The Arabs will prosper while they choose a new ruler when one dies; when it is by the sword they will be kings with kings' moods}
  restraint-with-wives-fearing-revelation: {cluster: revelation, label: Companions avoided relaxing with their wives in the prophet's lifetime lest revelation come down about them}
  died-at-sixty-three: {cluster: chronology, label: 'The prophet died aged sixty-three (thirteen years in Mecca, ten in Medina); Abu Bakr, Umar and Mu''awiya likewise at sixty-three'}
  daughter-laments-father-in-rhymed-cries: {cluster: mourning, label: 'His daughter laments: ''Father, who answered a Lord who called; whose refuge is Firdaws; to Gabriel we announce his death'''}
  no-distress-after-today: {cluster: death-of-prophet, label: '''No distress on your father after today'': what has come to him spares no one'}
  god-will-not-join-two-deaths: {cluster: death-of-prophet, label: 'Kissing the dead prophet: ''God will not join two deaths on you; the death written for you you have died'''}
  companion-denies-death-awaiting-return: {cluster: death-of-prophet, label: 'Umar denies the prophet has died: his Lord summoned him as Moses was absent forty nights; he will return and cut off hypocrites'}
  my-head-cry-before-final-illness: {cluster: death-of-prophet, label: 'Aisha complains of her head; the prophet answers ''Rather, oh my head!'' and is soon carried in sick'}
  cold-drop-from-dying-mouth: {cluster: death-of-prophet, label: A cold drop falls from his mouth onto the hollow of her throat; her skin shivers and she thinks he has fainted}
  three-kisses-three-cries: {cluster: mourning, label: Abu Bakr kisses his forehead three times crying 'O prophet! O chosen one! O dear friend!'}
  whoever-worshipped-muhammad-he-is-dead: {cluster: theology, label: 'Whoever worshipped Muhammad, Muhammad is dead; whoever worshipped God, God is alive and does not die'}
  verse-heard-as-if-never-known: {cluster: revelation, label: People hear the verse 'Muhammad is but a messenger' as if they had never known it; Umar's legs give way}
  rulers-from-quraysh-helpers-ministers: {cluster: polity, label: 'At the portico of Banu Sa''ida: ''From us a ruler and from you a ruler'' answered by ''We are the rulers, you the ministers'''}
  stoning-verse-in-gods-book: {cluster: law, label: 'Umar: among what God sent down was the verse of stoning; we read it, the prophet stoned and we stoned; fear people will say it is not in the Book'}
  do-not-extol-me-as-son-of-mary: {cluster: christology, label: '''Do not extol me as the Christians extolled the son of Mary; I am his servant: say servant of God and his messenger'''}
  pledge-without-consultation-void: {cluster: polity, label: 'Whoever pledges to a man without consultation of the Muslims, neither he nor the one pledged to is to be followed, lest both be killed'}
  sick-chief-wrapped-among-his-people: {cluster: narrative-frame, label: 'At the portico the Ansar''s chief lies wrapped up (muzammal), fevered, among them'}
  rubbed-post-and-propped-palm: {cluster: polity, label: An Ansari boasts 'I am its well-rubbed post and its propped palm' (judhayluha al-muhakkak wa-'udhayquha al-murajjab)}
  people-had-no-prophet-die-before: {cluster: death-of-prophet, label: 'They were unlettered; no prophet had died among them before, so they asked how to pray over him and where to bury him'}
  prophet-buried-where-soul-taken: {cluster: death-of-prophet, label: A prophet is buried where his soul is taken; God takes it only in a good place}
  washers-overcome-by-sleep-and-voice: {cluster: death-of-prophet, label: 'Disputing whether to strip him, the washers fall asleep chins on chests; a speaker from the corner of the house says wash him in his clothes'}
  washed-in-his-shirt-rubbed-with-it: {cluster: death-of-prophet, label: 'He is washed in his shirt, water poured over it and rubbed through it, not with their hands'}
  nothing-seen-of-the-dead-in-him: {cluster: death-of-prophet, label: 'The washer looks for what is seen of the dead and sees nothing: ''How good you are, living and dead'''}
  three-white-cloths-no-shirt-no-turban: {cluster: death-of-prophet, label: Shrouded in three white Sahuli cloths without shirt or turban}
  living-more-entitled-to-new-cloth: {cluster: ethics, label: 'Shroud me in this worn garment washed: the living have more right to new cloth; it is for the pus'}
  funeral-prayer-in-groups-without-leader: {cluster: death-of-prophet, label: 'They enter in groups (arsalan), pray over him and leave by the other door, with no one leading'}
  last-to-touch-the-prophet: {cluster: death-of-prophet, label: Al-Mughira goes down into the grave to touch his feet and boasts 'I am the last of you in contact with the messenger'}
  niche-digger-arrives-first: {cluster: death-of-prophet, label: 'Two gravediggers, one cutting a side-niche, one a trench; they wait to see who comes first: the niche-digger'}
  red-velvet-in-grave: {cluster: death-of-prophet, label: A red velvet cloth is put in the prophet's grave}
  burial-heard-by-shovels-at-night: {cluster: death-of-prophet, label: We knew of his burial only when we heard the shovels in the night of Wednesday}
  wife-refuses-burial-beside-prophet: {cluster: death-of-prophet, label: 'Aisha asks to be buried with the other wives, not beside the prophet, ''lest I be praised''; she grants the place to Umar'}
  left-only-mule-weapons-and-land: {cluster: death-of-prophet, label: 'He left no dirham, dinar, slave or thing but his white mule, his weapons and land he made alms'}
  armour-pawned-with-jew-for-barley: {cluster: death-of-prophet, label: He died with his armour pawned with a Jew for thirty measures of barley}
  mountain-of-gold-but-two-dinars-for-debt: {cluster: ethics, label: Uhud turned to gold would not please him unless he kept two dinars for a debt}
  prophets-not-inherited-leave-alms: {cluster: law, label: '''We are not inherited; what we leave is alms; the family of Muhammad eat from this property'''}
  relic-water-revives-unconscious: {cluster: relics, label: The unconscious man has the prophet's ablution water poured on him and comes to}
  sweat-collected-in-flasks: {cluster: relics, label: Umm Sulaym collects the sleeping prophet's sweat from a leather mat into flasks for the children's blessing and her perfume}
  fingers-traced-in-leftover-food: {cluster: relics, label: The host asks where the prophet's fingers touched the food and eats from those places}
  washed-hands-water-drunk-and-poured-on-face: {cluster: relics, label: He washes his hands and face in a cup and spits in it; two men are to drink and pour it on faces and chests; a wife asks for some}
  hair-distributed-among-people: {cluster: relics, label: 'After shaving at the pilgrimage, the right half of his hair is given to Abu Talha, the left divided among the people'}
  hair-in-water-vessel-for-evil-eye: {cluster: relics, label: A silver vessel holds the prophet's red hairs; water from it is sent for anyone struck by the evil eye}
  cup-and-prayer-place-kept: {cluster: relics, label: A companion offers a drink from a cup the prophet drank from and prayer in a place he prayed}
  cloak-asked-for-own-shroud: {cluster: relics, label: 'A man asks for the cloak the prophet wore, hoping its blessing, ''that I may be shrouded in it'''}
  robe-washed-for-sick-to-heal: {cluster: relics, label: The prophet's robe is kept and washed for the sick to seek cure from it}
  visits-all-wives-in-one-hour: {cluster: marriage, label: 'He went round his wives, eleven (or nine), in one hour; ''he was given the strength of thirty'''}
  bride-shown-in-dream-in-silk: {cluster: dreams, label: 'Shown her in a dream three nights: an angel brings her in a piece of silk, he uncovers her face: ''if this is from God he will carry it out'''}
  married-at-seven-brought-at-nine: {cluster: marriage, label: 'Married at seven, brought to him at nine with her toys, widowed at eighteen'}
  wife-gives-her-day-to-co-wife: {cluster: marriage, label: An aged wife gives her day with the prophet to the youngest}
  father-offers-widowed-daughter-to-friends: {cluster: marriage, label: 'A father offers his widowed daughter to two friends; one declines, one keeps silent because the prophet had mentioned her'}
  recompense-prayer-brings-better-husband: {cluster: piety, label: '''To God we belong... recompense me and give me better'': she says it for her dead husband and is given the prophet'}
  wife-married-by-god-above-seven-heavens: {cluster: marriage, label: '''Your families married you off; God married me from above seven heavens'''}
  foreign-king-marries-wife-by-proxy: {cluster: marriage, label: The Negus marries the exiled widow to the prophet in Abyssinia and pays her dowry of four thousand himself}
  rejected-bride-sought-refuge: {cluster: marriage, label: 'A new bride says ''I seek refuge with God from you'': ''You have sought refuge with a Great One; go to your family'''}
  ruler-sends-two-sister-slave-girls-and-mule: {cluster: marriage, label: 'The Coptic ruler sends two sister slave-girls and a mule; one bears Ibrahim, the other is given to Hassan'}
  son-nursed-in-smoky-smiths-house: {cluster: family, label: His infant son is nursed by a blacksmith's wife; the house is full of smoke from the bellows}
  eye-weeps-heart-grieves: {cluster: mourning, label: '''The eye weeps and the heart grieves; we say only what pleases our Lord'''}
  dead-infant-suckled-in-paradise: {cluster: eschatology, label: His son died at the breast; two wet-nurses complete his suckling in paradise}
  gravedigger-who-did-not-lie-with-wife: {cluster: mourning, label: 'At his daughter''s grave: ''Is there a man who did not lie with his wife last night?''; Abu Talha goes down'}
  daughter-too-young-for-elders: {cluster: marriage, label: 'Abu Bakr and Umar ask for Fatima: ''She is young''; Ali asks and is given her'}
  bride-furnished-with-velvet-waterskin-pillow: {cluster: marriage, label: 'The bride is furnished with a velvet cloth, a waterskin and a leather pillow stuffed with fibre'}
  daughter-buried-at-night-without-caliph: {cluster: mourning, label: His daughter lived six months after him; her husband buried her at night and did not tell Abu Bakr}
  neither-tall-nor-short-nor-stark-white: {cluster: prophet-body, label: 'Neither very tall nor short, neither stark white nor brown, hair neither tightly curled nor lank'}
  fewer-than-twenty-white-hairs: {cluster: prophet-body, label: He died with fewer than twenty white hairs in head and beard; the white was under the lower lip and at the temples}
  walks-as-if-descending-slope: {cluster: prophet-body, label: 'He walked leaning forward as though coming down a slope (yanhattu min sabab), and turned his whole body'}
  thick-palms-and-soles: {cluster: prophet-body, label: 'Thick palms and soles (shathn), big head and joints, a long line of hair down the chest'}
  hair-let-hang-like-people-of-book: {cluster: law, label: 'He let his hair hang like the People of the Book (the polytheists parted it), liking to agree with them where no command came, then parted it'}
  face-like-moon-not-sword: {cluster: prophet-body, label: 'Asked whether his face was like a sword: ''No, like the moon'', round, like sun and moon'}
  seal-between-shoulders-like-pigeon-egg: {cluster: prophet-body, label: 'The seal of prophethood between his shoulders, like a pigeon''s egg, a bridal-canopy button, a fist with moles like warts'}
  softer-than-silk-sweeter-than-musk: {cluster: prophet-body, label: 'No silk or brocade softer than his palm, no musk or ambergris sweeter than his scent'}
  sweat-like-pearls: {cluster: prophet-body, label: His sweat was like pearls}
  hand-cool-as-from-perfumers-box: {cluster: prophet-body, label: He stroked a boy's cheeks; his hand felt cool and fragrant as if taken from a perfumer's box}
  whiteness-of-armpits-seen: {cluster: prophet-body, label: The whiteness of his armpits showed when he spread his arms in prostration and raised his hands in the rain prayer}
  big-mouth-long-eyes-lean-heels: {cluster: prophet-body, label: 'Wide-mouthed, long-slitted eyes, little flesh on the heels (Simak''s glosses)'}
  hair-dyed-with-henna-kept: {cluster: relics, label: Dyed hairs of the prophet were kept and shown; one saw him with a henna trace in his locks and two green cloaks}
  character-was-the-quran: {cluster: ethics, label: '''His character was the Quran'': she recites ''The believers have prospered'' to verse 9'}
  servant-never-told-why-did-you: {cluster: ethics, label: 'Served him ten years and he never said ''Uff'', nor ''Why did you do this?'' or ''Why did you not?'''}
  prophet-described-in-torah: {cluster: prophecy, label: 'Described in the Torah: witness, bearer of good news, warner, refuge for the unlettered, ''my servant and messenger'', named al-Mutawakkil'}
  not-harsh-not-shouting-in-markets: {cluster: prophecy, label: Neither harsh nor coarse nor clamouring in the markets; does not repay evil with evil but pardons}
  crooked-community-straightened-before-death: {cluster: prophecy, label: 'God will not take him until he straightens the crooked community by ''no god but God'', opening blind eyes, deaf ears and uncircumcised hearts'}
  dust-on-his-forehead-reproach: {cluster: ethics, label: 'His sharpest reproach: ''What is wrong with him? May his forehead be dusted'''}
  slave-girl-leads-him-by-hand: {cluster: ethics, label: Any slave-girl of Medina could take his hand and lead him wherever she wished}
  angel-offers-king-prophet-or-servant-messenger: {cluster: prophecy, label: 'An angel never before descended offers: king-prophet or servant-messenger? Gabriel: be humble; he chooses servant-messenger'}
  moses-holding-throne-at-resurrection-swoon: {cluster: eschatology, label: 'Do not prefer me over Moses: all swoon at the resurrection, I wake first and find Moses holding the side of the Throne'}
  more-generous-than-the-sent-wind: {cluster: ethics, label: 'Most generous in Ramadan when Gabriel met him each night to study the Quran: more generous than the sent wind'}
  successor-pays-dead-prophets-promises: {cluster: law, label: His successor has it cried that whoever had a debt or promise from the prophet should come; he pays out handfuls}
  flock-between-two-mountains-gift: {cluster: ethics, label: He gave a man a flock filling the space between two mountains; 'Muhammad gives like one who fears no poverty'}
  stripped-to-carry-stones-falls-senseless: {cluster: purity, label: 'Carrying stones for the Ka''ba with his waist-wrap on his neck, he falls, eyes to the sky; ''My wrap!''; a voice says do not uncover'}
  shyer-than-virgin-in-seclusion: {cluster: ethics, label: More shy than a virgin in her curtained seclusion; dislike was seen in his face}
  never-faulted-food: {cluster: food, label: 'He never found fault with food: he ate what he liked and left what he disliked'}
  rides-bareback-to-alarm-horse-a-sea: {cluster: warfare, label: 'At a night alarm he rides out first on Abu Talha''s unsaddled horse, sword on neck: ''Do not fear''; ''we found it a sea'''}
  shield-behind-him-in-battle: {cluster: warfare, label: When the fighting grew red they took shelter behind him; he was nearest the enemy at Badr}
  thorn-tree-snatches-cloak: {cluster: ethics, label: 'Bedouins press him against a thorn tree that snatches his cloak: ''If I had camels as many as these thorn trees I would divide them'''}
  greets-children-in-passing: {cluster: ethics, label: He greeted boys when passing them}
  who-shows-no-mercy-gets-none: {cluster: ethics, label: 'A chief with ten children never kissed one: ''Whoever does not show mercy is not shown mercy'''}
  women-as-glass-vessels: {cluster: ethics, label: 'To the camel-driver singing to the women''s camels: ''Gently, Anjasha, do not break the glass vessels'''}
  dips-hand-in-servants-water-vessels: {cluster: relics, label: 'After dawn prayer the servants of Medina bring water vessels and he dips his hand in each, even on cold mornings'}
  walks-any-lane-with-troubled-woman: {cluster: ethics, label: 'To a woman with something in her mind: choose any lane and I will see to your need'}
  never-struck-woman-or-servant: {cluster: ethics, label: 'He never struck anyone with his hand, woman or servant, except fighting in God''s path'}
  sword-drawn-over-sleeper-who-protects-you: {cluster: miracle, label: 'A bedouin takes the sleeping prophet''s sword from a thorn tree: ''Who will protect you from me?'' ''God''; he is not punished'}
  i-know-god-best-and-fear-him-most: {cluster: ethics, label: 'Those who shun a concession he allowed are rebuked: ''I know God best and fear him most'''}
  jokes-only-with-truth: {cluster: ethics, label: 'He jested but said only the truth: ''I will mount you on a she-camel''s young''; ''O two-eared one''; ''Abu Umayr, what did the little bird do?'''}
  ugly-bedouin-hugged-sold-as-slave: {cluster: ethics, label: 'He hugs an ugly bedouin from behind in the market: ''Who will buy this slave?'' ''You will find me worthless'' ''With God you are dear'''}
  laughs-till-molars-show: {cluster: prophet-body, label: He laughed till his back teeth showed}
  laughs-at-fallen-enemy-exposed: {cluster: warfare, label: A headless arrow fells a polytheist whose nakedness is exposed and the prophet laughs till his molars show}
  earth-folded-for-his-walk: {cluster: miracle, label: 'No one walked faster: as if the earth were folded for him; we strained and he was unhurried'}
  sun-runs-in-his-face: {cluster: prophet-body, label: As if the sun ran in his face}
  lots-cast-among-wives-for-journey: {cluster: marriage, label: Before a journey he cast lots among his wives and took the one whose lot came out}
  grasps-beard-when-worried: {cluster: prophet-body, label: When something worried him he took hold of his beard}
  cloak-yanked-leaves-mark-on-neck: {cluster: ethics, label: A bedouin yanks his coarse Najrani cloak leaving its mark on his neck; he laughs and gives}
  two-black-things-dates-and-water: {cluster: food, label: 'They had their fill only of ''the two black things'', dates and water; he found not even poor dates to fill his belly'}
  trotters-kept-fifteen-days: {cluster: food, label: The family kept sheep's trotters to eat after fifteen days; never full of wheat bread three days running}
  three-day-sacrifice-meat-rule-for-famine: {cluster: law, label: 'The ban on keeping sacrificial meat beyond three days was only for a famine year, so the rich would feed the poor'}
  gourd-picked-from-around-bowl: {cluster: food, label: He picked the pieces of gourd from around the bowl; the servant then always loved gourd}
  loved-sweets-and-honey: {cluster: food, label: He loved sweets and honey}
  foreleg-preferred-and-poisoned: {cluster: food, label: The foreleg of the sheep was his favourite; he was poisoned in the foreleg and thought the Jews had done it}
  hot-and-cold-foods-balanced: {cluster: food, label: 'He ate watermelon with fresh dates: ''we break the heat of this with the cold of that'''}
  garlic-eater-kept-from-mosque: {cluster: purity, label: Whoever eats garlic or onion keeps away from our mosque; 'I converse with one you do not converse with'}
  not-forbidden-but-disliked-for-smell: {cluster: food, label: 'Asked if garlic is forbidden: ''No, I dislike it for its smell''; the host: ''I dislike what you dislike'''}
  lizard-not-of-my-peoples-land: {cluster: food, label: 'Roasted lizard (dabb) is not forbidden: ''it was not in my people''s land and I find myself averse''; Khalid eats it as he watches'}
  sweet-cold-drink-best: {cluster: food, label: The best drink is the sweet and cold}
  three-breaths-in-drinking: {cluster: food, label: 'He breathed three times while drinking: more quenching, healthier, more wholesome'}
  drinks-standing-zamzam-and-waterskin: {cluster: food, label: He drank Zamzam standing; Ali drinks standing at Kufa against those who dislike it}
  waterskin-mouth-cut-off-kept: {cluster: relics, label: A woman cuts off the mouth of the waterskin he drank from standing and keeps it}
  no-second-wife-while-first-lived: {cluster: marriage, label: He took no other wife while Khadija lived}
  married-while-not-in-pilgrim-state: {cluster: law, label: Maymuna reports he married her while he was not in the pilgrim state (wa-huwa halal)}
  night-of-decree-in-seventh-of-last-ten: {cluster: ritual, label: 'A late emigrant, arriving five days after the burial, learns from Bilal that the Night of Decree is in the seventh of the last ten'}
  most-beautiful-voice-reciting: {cluster: ritual, label: 'Reciting ''By the fig and the olive'' at the night prayer, no one had a more beautiful voice or reading'}
  never-said-no-to-a-request: {cluster: ethics, label: He was never asked for anything and said 'No'}
  chooses-easier-takes-no-personal-revenge: {cluster: ethics, label: 'Given two choices he took the easier unless it was a sin; he never took revenge for himself, only when God''s sanctity was violated'}
  walks-with-widow-and-poor: {cluster: ethics, label: 'Much remembrance, little idle talk, long prayer, short sermon; not too proud to walk with the widow and the poor to see to their need'}
  hair-reaching-earlobes-or-shoulders: {cluster: prophet-body, label: 'His hair reached his earlobes, the middle of his ears or his shoulders: above the wafra, below the jumma'}
  sent-at-forty-ten-years-in-each-city: {cluster: chronology, label: 'Sent at forty, ten years in Mecca and ten in Medina, taken at the head of sixty (round numbers)'}
units:
  - id: hadith-48-tabuk-sermon
    tradition: islam
    corpus: hadith
    original: true
    tagger: Claude Opus 5.5, reading the Arabic
    title: 'Sermon at Tabuk: the horseman and the herdsman'
    read: ['Jāmiʿ 48:5563.1']
    quran: []
    tags:
      - {motif: best-man-holds-horse-rein-or-tends-flock, note: مثل رجل آخذ بعنان فرسه فيجاهد في سبيل الله ... ومثل رجل باد في غنمه يقري ضيفه ويؤدي حقه, refs: ['Jāmiʿ 48:5563.1']}
      - {motif: repeated-question-did-he-say-it, note: 'قلت: أقالها؟ قال: قالها (ثلاثا) فكبرت الله', refs: ['Jāmiʿ 48:5563.1']}
  - id: hadith-48-kab-and-the-three-left-behind
    tradition: islam
    corpus: hadith
    original: true
    tagger: Claude Opus 5.5, reading the Arabic
    title: Ka'b b. Malik and the three who stayed behind from Tabuk
    read: ['Jāmiʿ 48:5563.2']
    quran: ['9:117-119', '9:95-96']
    tags:
      - {motif: raid-destination-concealed-by-feint, note: لم يكن رسول الله يريد غزوة إلا ورى بغيرها حتى كانت تلك الغزوة, refs: ['Jāmiʿ 48:5563.2']}
      - {motif: laggard-postpones-preparation-day-by-day, note: 'فطفقت أغدو لكي أتجهز معهم فأرجع ولم أقض شيئا فأقول في نفسي: أنا قادر عليه', refs: ['Jāmiʿ 48:5563.2']}
      - {motif: hypocrites-ask-leave-to-stay-behind, note: جاءه المخلفون فطفقوا يعتذرون إليه ويحلفون له وكانوا بضعة وثمانين رجلا, refs: ['Jāmiʿ 48:5563.2']}
      - {motif: laggard-confesses-truth-refusing-excuse, note: تبسم تبسم المغضب ... لا والله ما كان لي من عذر ... أما هذا فقد صدق فقم حتى يقضي الله فيك, refs: ['Jāmiʿ 48:5563.2']}
      - {motif: community-boycott-of-fifty-nights, note: نهى رسول الله المسلمين عن كلامنا أيها الثلاثة ... حتى تنكرت في نفسي الأرض ... خمسين ليلة, refs: ['Jāmiʿ 48:5563.2']}
      - {motif: greeting-unanswered-by-dearest-kinsman, note: تسورت جدار حائط أبي قتادة ... فوالله ما رد علي السلام ... الله ورسوله أعلم, refs: ['Jāmiʿ 48:5563.2']}
      - {motif: foreign-king-letter-burned-in-oven, note: نبطي من أنباط أهل الشام ... كتابا من ملك غسان ... فتيممت بها التنور فسجرته بها, refs: ['Jāmiʿ 48:5563.2']}
      - {motif: boycotted-man-told-to-keep-from-wife, note: إذا مضت أربعون ليلة من الخمسين ... يأمرك أن تعتزل امرأتك ... لا بل اعتزلها ولا تقربها, refs: ['Jāmiʿ 48:5563.2']}
      - {motif: glad-tidings-shouted-from-mountain, note: 'صوت صارخ أوفى على جبل سلع بأعلى صوته: يا كعب بن مالك أبشر ... وكان الصوت أسرع من الفرس', refs: ['Jāmiʿ 48:5563.2']}
      - {motif: messenger-of-good-news-given-garments, note: نزعت له ثوبي فكسوته إياهما ببشراه والله ما أملك غيرهما يومئذ واستعرت ثوبين, refs: ['Jāmiʿ 48:5563.2']}
      - {motif: prophets-face-like-piece-of-moon, note: إذا سر استنار وجهه حتى كأنه قطعة قمر, refs: ['Jāmiʿ 48:5563.2']}
      - {motif: penitent-keeps-part-of-wealth, note: أنخلع من مالي صدقة ... أمسك عليك بعض مالك ... فإني أمسك سهمي الذي بخيبر, refs: ['Jāmiʿ 48:5563.2']}
      - {motif: three-left-behind-forgiven, note: وعلى الثلاثة الذين خلفوا ... إنما هو تخليفه إيانا وإرجاؤه أمرنا, refs: ['Jāmiʿ 48:5563.2']}
    hints:
      - "The fifty-night ban in which no one greets the three and they are told to keep from their wives, against the rabbinic niddui (bMoed Qatan 15a-16a), where the banned man is not greeted, others keep four cubits from him, and his marital relations are discussed."
  - id: hadith-48-return-from-tabuk
    tradition: islam
    corpus: hadith
    original: true
    tagger: Claude Opus 5.5, reading the Arabic
    title: Stay at Tabuk and the return to Medina
    read: ['Jāmiʿ 48:5567.1-5568.3']
    quran: []
    tags:
      - {motif: shortening-prayer-twenty-days-at-camp, note: أقام رسول الله بتبوك عشرين يوما يقصر الصلاة, refs: ['Jāmiʿ 48:5567.1']}
      - {motif: mountain-loves-us-and-we-love-it, note: هذه طابة وهذا أحد جبل يحبنا ونحبه, refs: ['Jāmiʿ 48:5568.1']}
      - {motif: those-held-back-by-excuse-share-reward, note: ما سرتم مسيرا ولا قطعتم واديا إلا كانوا معكم ... حبسهم العذر, refs: ['Jāmiʿ 48:5568.2']}
      - {motif: children-meet-returning-army-at-farewell-pass, note: خرجت مع الصبيان نتلقى النبي إلى ثنية الوداع, refs: ['Jāmiʿ 48:5568.3']}
  - id: hadith-48-ukaydir-gifts
    tradition: islam
    corpus: hadith
    original: true
    tagger: Claude Opus 5.5, reading the Arabic
    title: 'Gifts of Ukaydir of Dumat al-Jandal: silk and a gold-woven coat'
    read: ['Jāmiʿ 48:5569.1-5570.1']
    quran: []
    tags:
      - {motif: napkins-of-saad-in-paradise-better-than-silk, note: لمناديل سعد بن معاذ في الجنة خير منها وألين, refs: ['Jāmiʿ 48:5569.1']}
      - {motif: napkins-of-saad-in-paradise-better-than-silk, note: 'أهدي للنبي جبة سندس ... وفي رواية: أن أكيدر دومة الجندل أهدى لرسول الله حلة', refs: ['Jāmiʿ 48:5569.2']}
      - {motif: gold-woven-gift-of-ruler-returned, note: قباء منسوجا بالذهب مما كان كسرى يكسوهم ... ليس أحد يلبس هذا في الدنيا إلا حرمه في الآخرة ... ولكن تبيعه فتستعين بثمنه, refs: ['Jāmiʿ 48:5570.1']}
  - id: hadith-48-abu-bakr-pilgrimage-proclamation
    tradition: islam
    corpus: hadith
    original: true
    tagger: Claude Opus 5.5, reading the Arabic
    title: 'The pilgrimage led by Abu Bakr: no polytheist, no naked circumambulation'
    read: ['Jāmiʿ 48:5571.1']
    quran: []
    tags:
      - {motif: no-naked-circumambulation-after-this-year, note: لا يحج بعد العام مشرك ولا يطوف بالبيت عريان, refs: ['Jāmiʿ 48:5571.1']}
      - {motif: disavowal-of-polytheists-proclaimed, note: في رهط يؤذن في الناس يوم النحر, refs: ['Jāmiʿ 48:5571.1']}
  - id: hadith-48-ali-in-yemen
    tradition: islam
    corpus: hadith
    original: true
    tagger: Claude Opus 5.5, reading the Arabic
    title: 'Ali sent to Yemen: the young judge and the slave-girl from the fifth'
    read: ['Jāmiʿ 48:5574.1-5575.1']
    quran: []
    tags:
      - {motif: young-judge-promised-steady-tongue, note: تبعثني إلى قوم هم أسن مني لأقضي بينهم ... سيثبت لسانك ويهدي قلبك, refs: ['Jāmiʿ 48:5574.1']}
      - {motif: envoy-takes-slave-girl-from-the-fifth, note: وفي السبي وصيفة ... فصارت في الخمس ثم صارت في أهل بيت النبي ثم صارت في آل علي ووقعت بها ... ورأسه يقطر, refs: ['Jāmiʿ 48:5575.1']}
      - {motif: share-in-fifth-greater-than-the-girl, note: لا تبغضه فإن له في الخمس أكثر من ذلك, refs: ['Jāmiʿ 48:5574.2']}
      - {motif: share-in-fifth-greater-than-the-girl, note: لنصيب آل علي في الخمس أفضل من وصيفة, refs: ['Jāmiʿ 48:5575.1']}
  - id: hadith-48-gold-nugget-and-the-objector
    tradition: islam
    corpus: hadith
    original: true
    tagger: Claude Opus 5.5, reading the Arabic
    title: Gold from Yemen divided among four chiefs; the objector and his stock
    read: ['Jāmiʿ 48:5576.1']
    quran: []
    tags:
      - {motif: gold-in-its-earth-divided-among-four-chiefs, note: بذهبة في تربتها ... فقسمها بين أربعة نفر ... لأتألفهم, refs: ['Jāmiʿ 48:5576.1']}
      - {motif: objector-with-shaven-head-tells-prophet-fear-god, note: 'كث اللحية مشرف الوجنتين غائر العينين ناتئ الجبين محلوق الرأس فقال: اتق الله يا محمد', refs: ['Jāmiʿ 48:5576.1']}
      - {motif: reciters-whose-quran-passes-no-further-than-throats, note: يقرءون القرآن لا يجاوز حناجرهم ... يمرقون من الإسلام كما يمرق السهم من الرمية, refs: ['Jāmiʿ 48:5576.1']}
      - {motif: killing-as-ad-were-killed, note: لئن أدركتهم لأقتلنهم قتل عاد, refs: ['Jāmiʿ 48:5576.1']}
  - id: hadith-48-khalid-and-ali-yemen-troops
    tradition: islam
    corpus: hadith
    original: true
    tagger: Claude Opus 5.5, reading the Arabic
    title: Khalid's troops in Yemen choose to stay with Ali
    read: ['Jāmiʿ 48:5577.1']
    quran: []
    tags:
      - {motif: troops-may-return-or-stay-with-new-commander, note: من شاء منهم أن يعقب معك فليعقب ومن شاء فليقفل ... فغنمت أواقي ذوات عدد, refs: ['Jāmiʿ 48:5577.1']}
  - id: hadith-48-abu-musa-and-muadh-in-yemen
    tradition: islam
    corpus: hadith
    original: true
    tagger: Claude Opus 5.5, reading the Arabic
    title: Abu Musa and Mu'adh as governors of Yemen
    read: ['Jāmiʿ 48:5577.2-5578.3']
    quran: []
    tags:
      - {motif: make-easy-not-hard-give-good-news, note: يسرا ولا تعسرا وبشرا ولا تنفرا وتطاوعا ولا تختلفا, refs: ['Jāmiʿ 48:5578.2']}
      - {motif: barley-beer-and-honey-mead-named, note: 'المزر من الشعير وشراب يقال له البتع من العسل فقال: كل مسكر حرام', refs: ['Jāmiʿ 48:5578.3']}
      - {motif: every-intoxicant-is-wine-and-forbidden, note: كل مسكر حرام, refs: ['Jāmiʿ 48:5577.2']}
      - {motif: sleep-counted-as-worship-like-vigil, note: أتفوقه تفوقا ... أنام أول الليل فأقوم ... فأحتسب نومتي كما أحتسب قومتي, refs: ['Jāmiʿ 48:5578.1']}
      - {motif: apostate-executed-before-dismounting, note: 'رجل كفر بعد إسلامه قال: لا أنزل حتى يقتل', refs: ['Jāmiʿ 48:5578.1']}
      - {motif: apostate-executed-before-dismounting, note: 'يهودي أسلم ثم ارتد فقال معاذ: لأضربن عنقه', refs: ['Jāmiʿ 48:5577.2']}
  - id: hadith-48-muadh-sent-to-people-of-book
    tradition: islam
    corpus: hadith
    original: true
    tagger: Claude Opus 5.5, reading the Arabic
    title: Instructions and farewell to Mu'adh
    read: ['Jāmiʿ 48:5579.1-5579.2']
    quran: []
    tags:
      - {motif: call-to-people-of-book-in-ordered-steps, note: ستأتي قوما أهل كتاب ... خمس صلوات في كل يوم وليلة ... صدقة تؤخذ من أغنيائهم فترد على فقرائهم, refs: ['Jāmiʿ 48:5579.1']}
      - {motif: oppressed-mans-prayer-no-veil-to-god, note: فإياك وكرائم أموالهم واتق دعوة المظلوم فإنه ليس بينه وبين الله حجاب, refs: ['Jāmiʿ 48:5579.1']}
      - {motif: prophet-walks-beside-mounted-envoy, note: ومعاذ راكب ورسول الله يمشي تحت راحلته ... لعلك أن تمر بمسجدي هذا وقبري, refs: ['Jāmiʿ 48:5579.2']}
      - {motif: weeping-from-satan, note: لا تبك يا معاذ للبكاء أو إن البكاء من الشيطان, refs: ['Jāmiʿ 48:5579.2']}
  - id: hadith-48-dhul-khalasa-destroyed
    tradition: islam
    corpus: hadith
    original: true
    tagger: Claude Opus 5.5, reading the Arabic
    title: Jarir destroys Dhu l-Khalasa, the 'Yemeni Ka'ba'
    read: ['Jāmiʿ 48:5579.3-5580.1']
    quran: []
    tags:
      - {motif: rival-kaaba-burned-and-broken, note: ذو الخلصة بيتا باليمن لخثعم وبجيلة فيه نصب تعبد يقال له الكعبة ... فحرقها بالنار وكسرها, refs: ['Jāmiʿ 48:5579.3']}
      - {motif: rival-kaaba-burned-and-broken, note: يقال له ذو الخلصة والكعبة اليمانية والكعبة الشامية ... فنفرت في مائة وخمسين راكبا, refs: ['Jāmiʿ 48:5580.1']}
      - {motif: hand-struck-on-chest-for-firm-seat, note: فضرب يده على صدري حتى رأيت أثر يده في صدري ... فما وقعت عن فرس بعد, refs: ['Jāmiʿ 48:5579.3']}
      - {motif: diviner-made-to-break-arrows, note: رجل يستقسم بالأزلام ... لتكسرنها ولتشهدن أن لا إله إلا الله أو لأضربن عنقك, refs: ['Jāmiʿ 48:5579.3']}
      - {motif: idol-house-left-like-mangy-camel, note: ما جئت حتى تركتها كأنها جمل أجرب, refs: ['Jāmiʿ 48:5579.3']}
      - {motif: blessing-five-times-on-horses-and-men, note: فبرك النبي على خيل أحمس ورجالها خمس مرات, refs: ['Jāmiʿ 48:5579.3']}
    hints:
      - "The cult house burned with fire and broken, against Deut 12:3 ('burn their Asherim with fire, break their pillars'), with the house itself named a rival 'Ka'ba'."
  - id: hadith-48-farewell-pilgrimage
