      - {motif: companion-denies-death-awaiting-return, note: إن رسول الله لم يمت ولكن ربه أرسل إليه كما أرسل إلى موسى فمكث عن قومه أربعين ليلة ... حتى يقطع أيدي رجال من المنافقين, refs: ['Jāmiʿ 48:5604.3']}
      - {motif: moses-forty-on-the-mountain, note: كما أرسل إلى موسى فمكث عن قومه أربعين ليلة, refs: ['Jāmiʿ 48:5604.3']}
      - {motif: face-like-page-of-mushaf, note: فنظرت إلى وجهه كأنه ورقة مصحف وهو يتبسم, refs: ['Jāmiʿ 48:5604.3']}
      - {motif: my-head-cry-before-final-illness, note: 'أشتكي رأسي فقال: أنا وارأساه ... حتى جيء به محمولا في كساء', refs: ['Jāmiʿ 48:5605.1']}
      - {motif: cold-drop-from-dying-mouth, note: فخرجت من فيه نطفة باردة فوقعت على ثغرة نحري فاقشعر لها جلدي, refs: ['Jāmiʿ 48:5605.1']}
      - {motif: companion-denies-death-awaiting-return, note: كذبت بل أنت رجل تحوسك فتنة إن رسول الله لا يموت حتى يفني الله المنافقين, refs: ['Jāmiʿ 48:5605.1']}
      - {motif: three-kisses-three-cries, note: 'فحدر فاه وقبل جبهته ثم قال: وانبياه ... واصفياه ... واخليلاه', refs: ['Jāmiʿ 48:5605.1']}
      - {motif: whoever-worshipped-muhammad-he-is-dead, note: فمن كان يعبد الله فإن الله حي ومن كان يعبد محمدا فإن محمدا قد مات, refs: ['Jāmiʿ 48:5605.1']}
      - {motif: whoever-worshipped-muhammad-he-is-dead, note: من كان منكم يعبد محمدا فإن محمدا قد مات ومن كان منكم يعبد الله فإن الله حي لا يموت, refs: ['Jāmiʿ 48:5606.1']}
      - {motif: verse-heard-as-if-never-known, note: لكأن الناس لم يعلموا أن الله أنزل هذه الآية حتى تلاها أبو بكر ... فعقرت حتى ما تقلني رجلاي, refs: ['Jāmiʿ 48:5606.1']}
      - {motif: verse-heard-as-if-never-known, note: أو إنها لفي كتاب الله؟ ما شعرت أنها في كتاب الله, refs: ['Jāmiʿ 48:5605.1']}
    hints:
      - "Umar's 'his Lord sent for him as for Moses, who stayed away from his people forty nights', against Exod 32:1, where the people say of the absent Moses 'we do not know what has become of him'."
      - "'Oh my head!' (wa-ra'sah) said by the prophet just before he is carried in sick, against 2 Kgs 4:19-20, where the Shunammite's boy cries 'my head, my head' (roshi roshi) and dies on his mother's knees."
      - "Abu Bakr bending over the dead man's face to kiss it, against Gen 50:1, Joseph falling on his father's face, weeping and kissing him."
