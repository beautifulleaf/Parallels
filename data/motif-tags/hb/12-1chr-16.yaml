units:
  - id: hb-1chr-16-ark-installed-levite-choirs
    tradition: judaism
    title: The ark installed in David's tent; Levite singers appointed
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["1Chr 16:1-7", "1Chr 16:37-43"]
    tags:
      - {motif: ark-of-the-covenant, refs: ["1Chr 16:1", "1Chr 16:37"]}
      - {motif: whole-burnt-offering, refs: ["1Chr 16:1", "1Chr 16:2"]}
      - {motif: peace-offering-shelamim, refs: ["1Chr 16:1", "1Chr 16:2"]}
      - {motif: king-blesses-people-in-gods-name, refs: ["1Chr 16:2", "1Chr 16:43"]}
      - {motif: festal-bread-raisin-cake-distribution, refs: ["1Chr 16:3"], note: "to every man and woman a loaf, an eshpar (meat portion?) and a raisin cake"}
      - {motif: levite-singers-appointed, refs: ["1Chr 16:4", "1Chr 16:5", "1Chr 16:7", "1Chr 16:41"], note: "to 'remember, thank and praise'; Asaph chief"}
      - {motif: cymbals-harps-lyres-trumpets-in-cult, refs: ["1Chr 16:5", "1Chr 16:6", "1Chr 16:42"], note: "Asaph sounds the cymbals; priests blow trumpets continually; 'instruments of the song of God'"}
      - {motif: two-cult-sites-ark-and-tabernacle, refs: ["1Chr 16:37", "1Chr 16:39", "1Chr 16:40"], note: "ark in Jerusalem with singers; Mosaic tabernacle and altar at the high place of Gibeon with Zadok"}
      - {motif: daily-tamid-offering, refs: ["1Chr 16:40"]}
      - {motif: hodu-ki-tov-refrain, refs: ["1Chr 16:41"]}
      - {motif: gatekeepers-levitical, refs: ["1Chr 16:38", "1Chr 16:42"], note: "Obed-edom and Hosah as gatekeepers"}
      - {motif: chronicler-variant-of-parallel, refs: ["1Chr 16:4-7", "1Chr 16:37-42"], note: "the whole liturgical appointment is absent from 2Sam 6"}
    hints:
      - "The Levitical choirs of Asaph, Heman and Jeduthun are the eponyms of psalm superscriptions (Pss 50, 73-83, 88, 39, 62, 77)."
