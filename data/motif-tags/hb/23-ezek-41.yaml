new_motifs:
  temple-vision-guide-measures: {label: "A heavenly guide measures the visionary temple with a reed or line while the prophet watches", cluster: temple}
  side-chambers-three-stories: {label: "Temple ringed by side chambers (tsela'ot) in three stories, thirty-three rooms, widening upward", cluster: temple}
  two-faced-cherubim-and-palms: {label: "Temple walls carved with alternating palm trees and cherubim having a human face and a lion face", cluster: temple}
  wooden-altar-table-before-yhwh: {label: "A wooden altar is explained as 'the table that is before YHWH'", cluster: cult}
  priests-change-holy-garments: {label: "Priests must take off their holy garments in special chambers before going out to the people, lest the garments transmit holiness", cluster: cult}
  sacred-precinct-square-500: {label: "The sacred precinct is a perfect square of 500 by 500, walled to separate holy from profane", cluster: temple}
  glory-returns-from-east: {label: "The divine glory returns to the temple from the east through the east gate", cluster: temple}
  divine-voice-like-many-waters: {label: "God's voice (or the sound of his coming) is like the sound of many waters", cluster: theophany}
  earth-shines-with-gods-glory: {label: "The earth shines (lit up) with God's glory", cluster: theophany}
  prophet-falls-on-face-at-vision: {label: "The prophet falls on his face at the sight of the divine glory", cluster: prophecy}
  temple-place-of-throne-and-feet: {label: "The temple is called the place of God's throne and the soles of his feet, where he will dwell forever", cluster: temple}
  royal-tombs-defile-temple: {label: "Kings' corpses or memorials (pigre malkehem) beside the temple defile God's holy name", cluster: temple}
  temple-plan-to-shame-israel: {label: "The prophet is to describe the temple's plan so that Israel will be ashamed of its sins", cluster: temple}
  temple-on-mountain-top: {label: "The temple stands on the top of a (very high) mountain whose whole territory is most holy", cluster: zion}
  altar-hearth-ariel: {label: "The altar's top hearth is called har'el/ari'el ('mountain of God' or 'lion of God')", cluster: cult}
  altar-stepped-like-ziggurat: {label: "The altar rises in diminishing ledges from a 'bosom of the earth' base, with steps facing east", cluster: cult}
  seven-day-altar-consecration: {label: "The altar is purged and consecrated by sacrifices over seven days before regular worship begins on the eighth", cluster: cult}
  east-gate-shut-god-entered: {label: "The east gate stays shut forever because YHWH the God of Israel entered by it", cluster: temple}
  prince-eats-bread-in-gate: {label: "Only the prince (nasi) may sit in the shut gate to eat bread before YHWH", cluster: kingship}
  foreigners-barred-from-sanctuary: {label: "No foreigner uncircumcised in heart and flesh may enter the sanctuary", cluster: cult}
  levites-demoted-for-idolatry: {label: "Levites who went astray after idols are demoted to gatekeepers and slaughterers, barred from priestly service", cluster: cult}
  zadokite-priests-faithful: {label: "Only the sons of Zadok, who kept faith when Israel strayed, may approach God as priests", cluster: cult}
  priests-linen-no-wool-sweat: {label: "Priests serve in linen only, with no wool, and must not gird themselves with anything that causes sweat", cluster: cult}
  priests-hair-trimmed: {label: "Priests may neither shave their heads nor let their hair grow long, but must trim it", cluster: cult}
  priests-as-judges: {label: "Priests stand as judges in disputes, judging by God's ordinances", cluster: law}
  priests-no-nevelah-terefah: {label: "Priests may not eat any bird or beast that died of itself or was torn", cluster: law}
  first-dough-to-priest-blessing: {label: "The first of the dough (reshit arisot) is given to the priest so that blessing rests on the house", cluster: law}
  holy-land-allotment-terumah: {label: "A sacred strip (terumah) of the land is set aside for God, the priests, the Levites and the city", cluster: land}
  prince-not-to-oppress: {label: "The princes must not dispossess or oppress the people; they receive a fixed estate", cluster: kingship}
  measures-standardized: {label: "Weights and measures are fixed by decree (ephah, bath, homer, shekel of twenty gerahs, mina)", cluster: law}
  prince-provides-festival-offerings: {label: "The ruler (prince) provides the offerings for the feasts, new moons and sabbaths on behalf of the people", cluster: kingship}
  new-year-purification-of-temple: {label: "On the first day of the first month the sanctuary is purged with blood on the doorposts and altar", cluster: cult}
  atonement-for-inadvertent-sinner: {label: "Rite of atonement for anyone who sins inadvertently or through simplicity", cluster: cult}
  gate-open-sabbath-new-moon: {label: "The inner east gate is shut on the six working days and opened on the sabbath and the new moon", cluster: temple}
  worshippers-exit-opposite-gate: {label: "Worshippers who enter by the north gate must leave by the south gate, and vice versa, not returning the way they came", cluster: cult}
  princes-gift-returns-at-liberty-year: {label: "A prince's gift of land to a servant reverts to him in the year of liberty (deror)", cluster: law}
  temple-kitchens: {label: "Kitchens in the corners of the temple courts where the sacrifices are boiled", cluster: temple}
  river-flows-from-temple: {label: "A river flows from under the temple threshold, growing ever deeper", cluster: eschatology}
  dead-sea-healed: {label: "The temple river heals the salt waters of the Dead Sea so they teem with fish", cluster: eschatology}
  trees-monthly-fruit-healing-leaves: {label: "Trees along the river bear fruit every month and their leaves are for healing", cluster: eschatology}
  fishermen-en-gedi: {label: "Fishermen spread nets from En-gedi to En-eglaim on the healed sea", cluster: eschatology}
  marshes-left-for-salt: {label: "The swamps and marshes are left unhealed, given over to salt", cluster: eschatology}
  joseph-two-portions: {label: "Joseph receives two portions in the allotment of the land", cluster: land}
  aliens-inherit-with-israel: {label: "Resident aliens with children born in the land receive an inheritance among the tribes like citizens", cluster: law}
  tribes-in-parallel-strips: {label: "The twelve tribes receive equal parallel east-west strips of land, seven north and five south of the sacred portion", cluster: land}
  city-twelve-gates-tribal-names: {label: "The holy city has twelve gates, three on each side, named after the twelve tribes", cluster: eschatology}
  city-named-yhwh-is-there: {label: "The city's new name is 'YHWH is there' (YHWH shammah)", cluster: eschatology}
  temple-vessels-taken-to-foreign-temple: {label: "The conqueror carries the vessels of God's temple into the treasury of his own god", cluster: exile}
  noble-youths-trained-at-foreign-court: {label: "Flawless, handsome, learned youths of royal or noble blood are taken to be trained in the conqueror's court and language", cluster: court-tale}
  refusal-of-royal-food: {label: "Pious exiles refuse the king's food and wine so as not to defile themselves", cluster: court-tale}
  vegetable-diet-test-ten-days: {label: "A ten-day test on vegetables and water leaves the pious youths healthier than those who eat the king's food", cluster: court-tale}
  hero-favored-by-official: {label: "God grants the hero favor and compassion in the eyes of the foreign official in charge of him", cluster: court-tale}
  exiles-ten-times-wiser-than-magicians: {label: "The exiled youths are found ten times wiser than all the court magicians and enchanters", cluster: court-tale}
  king-demands-dream-itself-be-told: {label: "The king demands that his experts tell him the dream itself as well as its meaning, on pain of death", cluster: court-tale}
  long-live-the-king-formula: {label: "Courtiers address the ruler 'O king, live forever'", cluster: court-tale}
  dismemberment-and-house-made-dunghill: {label: "Threat that offenders will be torn limb from limb and their houses made a dunghill", cluster: court-tale}
  gods-dwell-not-with-flesh: {label: "The magicians say only the gods, whose dwelling is not with flesh, could reveal such a thing", cluster: theology}
  order-to-kill-all-wise-men: {label: "The enraged king orders all the wise men of the capital killed", cluster: court-tale}
  mystery-raz-revealed-in-night-vision: {label: "A hidden mystery (raz) is revealed to the seer in a night vision", cluster: apocalyptic}
  god-changes-times-and-kings: {label: "God changes times and seasons, deposes kings and sets up kings", cluster: theology}
  light-dwells-with-god: {label: "God knows what is in darkness and light dwells with him", cluster: theology}
  god-in-heaven-reveals-mysteries: {label: "There is a God in heaven who reveals mysteries (gale razin) and makes known what will be at the end of days", cluster: apocalyptic}
  statue-of-four-metals: {label: "Dream of a great statue with head of gold, chest of silver, belly of bronze, legs of iron and feet of iron mixed with clay", cluster: apocalyptic}
  four-world-kingdoms-succession: {label: "A sequence of four world kingdoms (or ages), each inferior or more violent than the last", cluster: apocalyptic}
  metals-decline-of-ages: {label: "Successive kingdoms or ages symbolized by declining metals (gold, silver, bronze, iron)", cluster: apocalyptic}
  stone-cut-without-hands: {label: "A stone cut out without hands strikes the statue and becomes a great mountain filling the earth", cluster: apocalyptic}
  chaff-of-summer-threshing-floor: {label: "Destroyed kingdoms become like chaff from the summer threshing floors carried away by the wind", cluster: judgment}
  everlasting-kingdom-of-god: {label: "God will set up a kingdom that will never be destroyed and will crush all other kingdoms", cluster: apocalyptic}
  iron-mixed-with-clay-intermarriage: {label: "Iron mixed with clay signifies kingdoms mingling by intermarriage ('the seed of men') yet not holding together", cluster: apocalyptic}
  king-prostrates-before-seer: {label: "The pagan king falls on his face before the Jewish seer and orders offerings and incense for him", cluster: court-tale}
  god-of-gods-lord-of-kings: {label: "A foreign king confesses Israel's God as 'God of gods and Lord of kings, revealer of mysteries'", cluster: theology}
  golden-image-sixty-cubits: {label: "The king sets up a golden image sixty cubits high and six wide on the plain of Dura", cluster: court-tale}
  officials-list-satraps-prefects: {label: "Long repeated list of imperial officials (satraps, prefects, governors, counselors, treasurers, judges, magistrates)", cluster: court-tale}
  peoples-nations-languages: {label: "Proclamation addressed to 'peoples, nations and languages' of the whole earth", cluster: court-tale}
  orchestra-signal-for-worship: {label: "A listed orchestra of instruments (horn, pipe, lyre, trigon, harp, symphonia) signals the moment to bow to the idol", cluster: court-tale}
  command-to-worship-image-or-die: {label: "All are commanded to bow to the king's image on pain of being thrown into a blazing furnace", cluster: martyrdom}
  informers-denounce-jews: {label: "Envious courtiers 'eat the pieces' (slander) of the Jews and denounce their non-compliance to the king", cluster: court-tale}
  refusal-even-if-god-does-not-save: {label: "The faithful declare that God can save them, but even if he does not, they will not serve the king's gods", cluster: martyrdom}
  furnace-heated-sevenfold: {label: "The furnace is heated seven times more than usual", cluster: martyrdom}
  executioners-killed-by-flames: {label: "The flames kill the men who throw the heroes into the furnace", cluster: martyrdom}
  fourth-figure-like-son-of-gods: {label: "A fourth figure appears walking in the fire, looking like a son of the gods (bar elahin)", cluster: angelology}
  angel-sent-to-rescue: {label: "God sends his angel to rescue his servants from death", cluster: angelology}
  no-smell-of-fire: {label: "The rescued have not a hair singed, their garments unchanged, and no smell of fire on them", cluster: martyrdom}
  king-decrees-honor-for-jewish-god: {label: "The pagan king decrees that anyone who blasphemes or fails to fear the Jewish God will be punished", cluster: court-tale}
  royal-encyclical-letter: {label: "The pagan king issues a first-person letter to all peoples praising the Most High God", cluster: court-tale}
  cosmic-tree-reaching-heaven: {label: "Dream of an immense tree whose top reaches heaven, visible to the ends of the earth, sheltering beasts and birds", cluster: cosmology}
  watcher-holy-one-descends: {label: "A 'watcher' ('ir), a holy one, descends from heaven and decrees the judgment", cluster: angelology}
  tree-stump-bound-with-iron-and-bronze: {label: "The felled tree's stump is left in the earth bound with a band of iron and bronze", cluster: apocalyptic}
  seven-times-pass-over-him: {label: "'Seven times' (periods) pass over the punished king", cluster: apocalyptic}
  decree-of-the-watchers: {label: "The sentence is 'by the decree of the watchers and the word of the holy ones'", cluster: angelology}
  most-high-gives-kingdom-to-lowliest: {label: "The Most High rules the kingdom of men, gives it to whom he wills and sets over it the lowliest of men", cluster: theology}
  seer-dismayed-by-interpretation: {label: "The seer is dismayed and terrified when he grasps the meaning of the dream", cluster: court-tale}
  atone-sins-by-almsgiving: {label: "Advice to break off sins by righteousness/almsgiving (tsidqah) and iniquities by mercy to the poor", cluster: ethics}
  king-boasts-over-his-city: {label: "The king boasts 'Is not this great Babylon which I have built by my might?'", cluster: hubris}
  voice-from-heaven-pronounces-sentence: {label: "While the words are still in his mouth a voice falls from heaven pronouncing the king's sentence", cluster: judgment}
  king-turned-beastlike-eats-grass: {label: "A king is driven from human society to live with beasts, eating grass like oxen, wet with dew, with hair like eagles' feathers and nails like birds' claws", cluster: hubris}
  king-restored-after-acknowledging-god: {label: "The king's reason returns when he lifts his eyes to heaven and he is restored to his throne after praising God", cluster: hubris}
  none-can-stay-gods-hand: {label: "No one can stay God's hand or say to him 'What are you doing?'", cluster: theology}
  belshazzars-feast: {label: "A king holds a great feast for a thousand nobles and drinks wine before them", cluster: court-tale}
  sacred-vessels-profaned-at-feast: {label: "The king and his concubines drink from the vessels taken from God's temple while praising idols", cluster: court-tale}
  gods-of-gold-silver-bronze-iron-wood-stone: {label: "Idols listed as gods of gold, silver, bronze, iron, wood and stone that neither see nor hear nor know", cluster: idolatry}
  hand-writes-on-wall: {label: "Fingers of a human hand appear and write on the plaster of the palace wall opposite the lampstand", cluster: apocalyptic}
  king-knees-knock-in-terror: {label: "The king's face blanches, his hip-joints loosen and his knees knock together in terror", cluster: court-tale}
  reward-purple-gold-chain-third-ruler: {label: "Reward offered to the interpreter: purple robe, gold chain and rule as third in the kingdom", cluster: court-tale}
  queen-recommends-forgotten-sage: {label: "The queen (mother) reminds the king of a forgotten sage who solved riddles in his father's day", cluster: court-tale}
  loosing-knots-riddle-solving: {label: "The sage is renowned for interpreting dreams, explaining riddles and 'loosing knots'", cluster: magic}
  seer-refuses-gifts: {label: "The prophet tells the king to keep his gifts for himself", cluster: prophecy}
  mene-mene-tekel-parsin: {label: "The writing 'Mene, mene, tekel, u-pharsin' is read as numbered, weighed and divided", cluster: apocalyptic}
  weighed-in-scales-found-wanting: {label: "A person is weighed in the balances and found wanting", cluster: judgment}
  king-killed-same-night: {label: "That very night the king is killed and his kingdom passes to another people", cluster: judgment}
  darius-the-mede: {label: "Darius the Mede receives the kingdom at age sixty-two", cluster: history}
  satraps-120-three-presidents: {label: "The king appoints 120 satraps over the kingdom with three presidents above them, one of them the hero", cluster: court-tale}
  rivals-find-fault-only-in-his-religion: {label: "Rivals can find no fault in the hero except in the matter of the law of his God", cluster: court-tale}
  irrevocable-law-of-medes-and-persians: {label: "A royal decree written by the law of the Medes and Persians cannot be revoked, even by the king", cluster: law}
  ban-on-prayer-except-to-king: {label: "For thirty days no one may petition any god or man except the king", cluster: martyrdom}
  prayer-toward-jerusalem: {label: "The faithful prays facing Jerusalem through open windows", cluster: liturgy}
  kneeling-in-prayer: {label: "The pious kneels on his knees to pray", cluster: liturgy}
  thrown-into-lions-den: {label: "The hero is thrown into a pit of lions", cluster: martyrdom}
  den-sealed-with-royal-signet: {label: "A stone is placed on the mouth of the pit and sealed with the king's signet and those of his nobles", cluster: martyrdom}
  king-fasts-sleepless-night: {label: "The king spends a sleepless night fasting, without entertainment, worrying over the hero", cluster: court-tale}
  angel-shuts-lions-mouths: {label: "God sends his angel and shuts the lions' mouths so they do not harm the innocent", cluster: martyrdom}
  accusers-and-families-thrown-to-lions: {label: "The accusers, with their wives and children, are thrown to the lions and crushed before they reach the bottom", cluster: judgment}
  living-god-enduring-forever: {label: "Israel's God is called 'the living God, enduring forever, whose kingdom shall never be destroyed'", cluster: theology}
  four-winds-stir-great-sea: {label: "The four winds of heaven stir up the great sea, out of which monstrous beasts arise", cluster: apocalyptic}
  four-beasts-from-sea: {label: "Four great beasts rise from the sea, each different, symbolizing successive kingdoms", cluster: apocalyptic}
  winged-lion-given-human-heart: {label: "A lion with eagle's wings has its wings plucked, is made to stand like a man and given a human heart", cluster: apocalyptic}
  bear-with-three-ribs: {label: "A bear raised on one side with three ribs in its mouth is told 'Arise, devour much flesh'", cluster: apocalyptic}
  four-headed-winged-leopard: {label: "A leopard with four wings and four heads is given dominion", cluster: apocalyptic}
  ten-horned-iron-toothed-beast: {label: "A terrifying fourth beast with iron teeth and ten horns devours and tramples the rest with its feet", cluster: apocalyptic}
  little-horn-boastful-mouth: {label: "A little horn with human eyes and a mouth speaking great things uproots three horns", cluster: apocalyptic}
  ancient-of-days-enthroned: {label: "Thrones are set and the Ancient of Days sits, his garment white as snow and his hair like pure wool", cluster: theophany}
  fiery-throne-with-wheels: {label: "God's throne is flames of fire with wheels of burning fire", cluster: theophany}
  river-of-fire-before-god: {label: "A river of fire flows out from before the divine throne", cluster: theophany}
  myriads-serve-before-throne: {label: "Thousands of thousands serve God and myriads of myriads stand before him", cluster: angelology}
  court-sits-books-opened: {label: "The heavenly court sits in judgment and the books are opened", cluster: judgment}
  beast-burned-in-fire: {label: "The arch-enemy beast is slain and its body given over to burning fire", cluster: judgment}
  son-of-man-with-clouds: {label: "One like a son of man (kevar enash) comes with the clouds of heaven to the Ancient of Days", cluster: apocalyptic}
  everlasting-dominion-given-to-figure: {label: "A heavenly figure or the holy ones are given everlasting dominion, glory and kingdom which all peoples serve", cluster: apocalyptic}
  angelic-interpreter: {label: "The seer asks one of the attendants or an angel, who explains the vision to him", cluster: apocalyptic}
  holy-ones-of-most-high-receive-kingdom: {label: "The holy ones of the Most High (qaddishe 'elyonin) receive and possess the kingdom forever", cluster: apocalyptic}
  horn-wars-against-holy-ones: {label: "The horn makes war against the holy ones and prevails until the Ancient of Days comes", cluster: apocalyptic}
  tyrant-changes-times-and-law: {label: "The tyrant plans to change the times (festivals) and the law", cluster: apocalyptic}
  time-times-half-time: {label: "Persecution lasts 'a time, times and half a time' (three and a half periods)", cluster: apocalyptic}
  seer-troubled-keeps-matter-in-heart: {label: "The seer is troubled, his face changes, and he keeps the matter in his heart", cluster: apocalyptic}
  vision-at-susa-ulai: {label: "The seer finds himself in a vision at Susa the citadel by the river Ulai", cluster: apocalyptic}
  ram-and-he-goat: {label: "A two-horned ram (Media-Persia) is trampled by a he-goat with one great horn (Greece) coming from the west without touching the ground", cluster: apocalyptic}
  great-horn-broken-four-arise: {label: "The great horn breaks at its height and four horns arise toward the four winds (the successor kingdoms)", cluster: apocalyptic}
  horn-grows-to-host-of-heaven: {label: "A small horn grows up to the host of heaven, casts down some of the stars and tramples them", cluster: apocalyptic}
  daily-offering-abolished: {label: "The daily offering (tamid) is taken away and the sanctuary overthrown", cluster: apocalyptic}
  prince-of-host-challenged: {label: "The tyrant magnifies himself against the Prince of the host / Prince of princes", cluster: apocalyptic}
  how-long-question: {label: "A heavenly being or the seer asks 'Until when (ad matai)?' the desolation will last", cluster: apocalyptic}
  evenings-mornings-2300: {label: "Desolation reckoned as 2,300 evenings and mornings before the sanctuary is restored", cluster: apocalyptic}
  angel-gabriel-named: {label: "The angel Gabriel is named and sent to explain the vision", cluster: angelology}
  seer-falls-in-trance-touched-and-raised: {label: "The seer falls into a deep sleep on his face; the angel touches him and sets him on his feet", cluster: apocalyptic}
  vision-for-time-of-end: {label: "The vision concerns the time of the end (et qets)", cluster: apocalyptic}
  bold-faced-king-understands-riddles: {label: "A king 'fierce of face' and understanding riddles arises, destroys the holy people, and is broken without human hand", cluster: apocalyptic}
  seal-up-the-vision: {label: "The seer is told to shut up and seal the vision/book until the end", cluster: apocalyptic}
  seer-sick-after-vision: {label: "The seer is exhausted and sick for days after the vision", cluster: apocalyptic}
  seventy-years-of-jeremiah: {label: "The prophesied seventy years of Jerusalem's desolation", cluster: prophecy}
  seer-studies-scripture-books: {label: "The seer studies the books (sefarim) to understand a prophecy", cluster: prophecy}
  fasting-sackcloth-ashes: {label: "Prayer accompanied by fasting, sackcloth and ashes", cluster: liturgy}
  penitential-prayer-righteousness-yours-shame-ours: {label: "Communal confession: 'To you, Lord, belongs righteousness and to us shame of face'", cluster: liturgy}
  covenant-curse-of-moses-fulfilled: {label: "The curse and oath written in the Torah of Moses has been poured out on the people", cluster: theology}
  prayer-not-on-our-merits: {label: "We present our pleas not because of our righteous deeds but because of your great mercy", cluster: liturgy}
  angel-arrives-at-evening-offering: {label: "The angel arrives in swift flight at the time of the evening offering, while the seer is still praying", cluster: angelology}
  beloved-one-hamudot: {label: "The seer is addressed as 'greatly beloved' (ish hamudot)", cluster: apocalyptic}
  seventy-weeks-of-years: {label: "Seventy 'weeks' (seventy sevens) decreed to finish transgression, atone iniquity, bring everlasting righteousness and anoint a most holy", cluster: apocalyptic}
  anointed-one-cut-off: {label: "An anointed one (mashiah) is cut off and has nothing", cluster: apocalyptic}
  abomination-of-desolation: {label: "An abomination that makes desolate (shiqquts meshomem) is set up in the sanctuary", cluster: apocalyptic}
  mourning-fast-three-weeks: {label: "The seer mourns three weeks, eating no delicacies, meat or wine and not anointing himself", cluster: liturgy}
  vision-by-tigris: {label: "The seer receives a vision standing by the great river Tigris (Hiddeqel)", cluster: apocalyptic}
  man-clothed-in-linen-radiant: {label: "A man clothed in linen with a gold belt, body like chrysolite, face like lightning, eyes like torches, limbs like burnished bronze", cluster: angelology}
  companions-flee-unseen-vision: {label: "The seer's companions do not see the vision but are seized with terror and flee", cluster: apocalyptic}
  angel-touches-lips-to-speak: {label: "A figure in human likeness touches the seer's lips so he can speak", cluster: prophecy}
  angel-delayed-by-prince-of-persia: {label: "The angel was opposed twenty-one days by the 'prince of the kingdom of Persia' until Michael came to help", cluster: angelology}
  nation-patron-angels: {label: "Nations have heavenly 'princes' (patron angels): the prince of Persia, prince of Greece, and Michael 'your prince'", cluster: angelology}
  michael-archangel: {label: "Michael, 'one of the chief princes', the great prince who stands over Israel", cluster: angelology}
  book-of-truth: {label: "What is inscribed in the 'book of truth' is revealed", cluster: apocalyptic}
  ex-eventu-history-kings-north-south: {label: "Detailed veiled prophecy of wars between the 'king of the north' and the 'king of the south'", cluster: apocalyptic}
  dynastic-marriage-fails: {label: "A king's daughter given in marriage to seal an alliance between rival kings, but the alliance fails", cluster: history}
  captured-gods-carried-to-egypt: {label: "A victorious king carries off the enemy's gods, molten images and precious vessels to Egypt", cluster: history}
  ships-of-kittim: {label: "Ships of Kittim come against the king of the north and turn him back", cluster: history}
  wise-teachers-maskilim: {label: "The wise (maskilim) instruct the many and some fall to sword, flame and captivity to refine and purify them", cluster: martyrdom}
  tyrant-exalts-self-above-every-god: {label: "The king exalts himself above every god, speaks monstrous things against the God of gods, and honors a 'god of fortresses'", cluster: hubris}
  tyrant-ignores-desire-of-women: {label: "The tyrant disregards the gods of his fathers and 'the one desired by women'", cluster: apocalyptic}
  tyrant-dies-between-seas-and-holy-mountain: {label: "The final tyrant pitches his palace tents between the seas and the holy mountain and comes to his end with none to help", cluster: apocalyptic}
  time-of-unprecedented-trouble: {label: "A time of trouble such as never was since nations existed", cluster: apocalyptic}
  resurrection-of-the-dead: {label: "Many who sleep in the dust of the earth awake, some to everlasting life and some to everlasting shame", cluster: afterlife}
  wise-shine-like-stars: {label: "The wise shine like the brightness of the firmament and those who turn many to righteousness like the stars forever", cluster: afterlife}
  many-run-to-and-fro-knowledge-increases: {label: "Many shall run to and fro and knowledge shall increase", cluster: apocalyptic}
  angels-on-two-river-banks: {label: "Two figures stand on either bank of the river, with a linen-clad figure above the waters", cluster: angelology}
  days-1290-and-1335: {label: "Secret reckonings: 1,290 days from the abolition of the daily offering, and blessed is he who waits for 1,335 days", cluster: apocalyptic}
  seer-promised-rest-and-rise-to-lot: {label: "The seer is told he will rest and rise to his allotted portion at the end of days", cluster: afterlife}
  prophet-commanded-to-marry-harlot: {label: "God commands the prophet to marry a 'woman of harlotry' as a sign of the land's unfaithfulness", cluster: prophecy}
  children-given-symbolic-names: {label: "The prophet's children receive symbolic names announcing judgment or salvation (Jezreel, Lo-ruhamah, Lo-ammi)", cluster: prophecy}
  blood-of-jezreel-avenged: {label: "God will avenge the blood of Jezreel on the house of Jehu", cluster: kingship}
  name-reversal-not-my-people: {label: "'Not my people' becomes 'my people' and 'Not pitied' becomes 'pitied'", cluster: prophecy}
  sons-of-the-living-god: {label: "Israel is called 'sons of the living God' (bene el hai)", cluster: theology}
  israel-as-unfaithful-wife: {label: "God's people portrayed as an adulterous wife who runs after lovers (the Baals)", cluster: prophecy}
  stripped-naked-as-day-of-birth: {label: "The unfaithful wife is threatened with being stripped naked as on the day she was born", cluster: prophecy}
  lovers-thought-to-give-bread-wool: {label: "The faithless wife credits her lovers (the Baals) with her bread, water, wool, flax, oil and drink, not knowing God gave them", cluster: idolatry}
  hedge-of-thorns-blocks-way: {label: "God hedges her way with thorns and a wall so she cannot find her lovers' paths", cluster: prophecy}
  return-to-first-husband: {label: "The straying wife resolves 'I will go back to my first husband, for it was better then'", cluster: prophecy}
  feasts-new-moons-sabbaths-ended: {label: "God will end the land's festivals, new moons and sabbaths", cluster: judgment}
  allure-into-wilderness-speak-to-heart: {label: "God will allure his people into the wilderness and speak to her heart, as in the days of youth", cluster: prophecy}
  valley-of-achor-door-of-hope: {label: "The Valley of Achor ('trouble') becomes a door of hope", cluster: prophecy}
  my-husband-not-my-baal: {label: "She will call God 'my husband (ishi)' and no longer 'my baal'; the names of the Baals removed from her mouth", cluster: idolatry}
  covenant-with-beasts-and-peace: {label: "God makes a covenant with the beasts, birds and creeping things and abolishes bow, sword and war from the land", cluster: eschatology}
  divine-betrothal-forever: {label: "God betroths his people to himself forever in righteousness, justice, steadfast love, mercy and faithfulness", cluster: theology}
  cosmic-chain-of-answering: {label: "Chain of responses: God answers the heavens, the heavens the earth, the earth grain-wine-oil, and they answer Jezreel", cluster: cosmology}
  wife-bought-for-silver-and-barley: {label: "The prophet buys back a woman for fifteen shekels and a homer and a half of barley", cluster: prophecy}
  raisin-cakes-of-gods: {label: "Lovers of raisin cakes (ashishe anavim), offerings associated with other gods", cluster: idolatry}
  many-days-without-king-sacrifice-pillar-ephod-teraphim: {label: "Israel will dwell many days without king, prince, sacrifice, pillar, ephod or teraphim", cluster: exile}
  return-to-david-their-king-latter-days: {label: "In the latter days Israel will return and seek YHWH and David their king", cluster: messianism}
  covenant-lawsuit-rib: {label: "YHWH brings a lawsuit (riv) against his people", cluster: prophecy}
  decalogue-violations-listed: {label: "Prophet lists violations echoing the Decalogue: swearing, lying, murder, theft, adultery", cluster: law}
  land-mourns-creatures-perish: {label: "Because of sin the land mourns and beasts, birds and even fish of the sea perish", cluster: judgment}
  priests-reject-knowledge: {label: "My people are destroyed for lack of knowledge; the priest who rejected knowledge is rejected", cluster: prophecy}
  priests-feed-on-sin-offerings: {label: "Priests feed on the people's sin and set their heart on their iniquity", cluster: cult}
  like-people-like-priest: {label: "'Like people, like priest': both punished alike", cluster: prophecy}
  divination-by-wood-and-staff: {label: "The people consult their piece of wood and their staff (rhabdomancy) gives them oracles", cluster: magic}
  spirit-of-harlotry: {label: "A 'spirit of harlotry' (ruah zenunim) leads the people astray", cluster: idolatry}
  cultic-sex-with-qedeshot: {label: "Men sacrifice with qedeshot (cult women) and go aside with harlots", cluster: idolatry}
  beth-aven-for-bethel: {label: "Bethel ('house of God') mocked as Beth-aven ('house of iniquity')", cluster: polemic}
  stubborn-heifer: {label: "Israel is like a stubborn heifer", cluster: prophecy}
  snare-at-mizpah-net-on-tabor: {label: "The leaders have been a snare at Mizpah and a net spread on Tabor", cluster: prophecy}
  alarm-trumpet-gibeah-ramah: {label: "Blow the shofar in Gibeah, the trumpet in Ramah, sound the alarm at Beth-aven", cluster: warfare}
  god-like-moth-and-rot: {label: "God is like a moth (or pus) to Ephraim and like rot to Judah", cluster: theology}
  seeking-help-from-assyria-futile: {label: "Ephraim sees its sickness and goes to the great king of Assyria, who cannot heal it", cluster: politics}
  god-as-lion-tearing-prey: {label: "God is like a lion that tears its prey and carries it off with none to rescue", cluster: theology}
  god-withdraws-until-they-seek: {label: "God returns to his place until the people acknowledge guilt and seek his face", cluster: theology}
  revived-on-third-day: {label: "'After two days he will revive us; on the third day he will raise us up'", cluster: afterlife}
  love-like-morning-dew: {label: "The people's love is like a morning cloud and the dew that vanishes early", cluster: wisdom}
  mercy-not-sacrifice: {label: "'I desire steadfast love (hesed) and not sacrifice, knowledge of God rather than burnt offerings'", cluster: cult}
  like-adam-transgressed-covenant: {label: "'Like Adam they transgressed the covenant'", cluster: theology}
  priests-murder-on-road-to-shechem: {label: "A band of priests murders on the road to Shechem", cluster: prophecy}
  conspirators-hot-as-oven: {label: "Court conspirators are like a heated oven; they devour their judges and their kings fall", cluster: kingship}
  ephraim-unturned-cake: {label: "Ephraim is a cake not turned (half-baked)", cluster: prophecy}
  grey-hairs-unnoticed: {label: "Grey hairs are sprinkled on him and he does not know it", cluster: wisdom}
  silly-dove-egypt-assyria: {label: "Ephraim is like a silly dove, calling to Egypt and going to Assyria", cluster: politics}
  god-spreads-net-on-birds: {label: "God spreads his net over the people and brings them down like birds of the sky", cluster: judgment}
  deceitful-bow: {label: "The people are like a deceitful (slack) bow", cluster: prophecy}
  kings-made-without-god: {label: "They made kings, but not by me; princes, but I did not know it", cluster: kingship}
  calf-of-samaria-broken: {label: "The calf of Samaria, made by a craftsman, is no god and will be broken to pieces", cluster: idolatry}
  sow-wind-reap-whirlwind: {label: "They sow the wind and reap the whirlwind", cluster: wisdom}
  wild-ass-alone: {label: "Ephraim like a wild ass wandering alone, hiring lovers", cluster: prophecy}
  myriad-torot-written-as-strange: {label: "Though God writes for him the many things of his Torah, they are counted as something strange", cluster: law}
  return-to-egypt-as-punishment: {label: "Punishment is a return to Egypt (reversal of the exodus)", cluster: exile}
  eating-unclean-food-in-exile: {label: "In exile (Assyria) they will eat unclean food", cluster: exile}
  harlots-hire-on-threshing-floors: {label: "Israel loves a harlot's hire on every threshing floor of grain", cluster: idolatry}
  bread-of-mourners: {label: "Their sacrifices are like the bread of mourners: all who eat it are defiled", cluster: cult}
  memphis-buries-them: {label: "Egypt gathers them and Memphis (Moph) buries them; thorns in their tents", cluster: exile}
  prophet-called-fool-madman: {label: "'The prophet is a fool, the man of the spirit is mad'", cluster: prophecy}
  prophet-as-watchman: {label: "The prophet is a watchman (tsofeh) for the people", cluster: prophecy}
  days-of-gibeah: {label: "Israel's sin recalled as 'the days of Gibeah'", cluster: history}
  israel-found-like-grapes-in-wilderness: {label: "God found Israel like grapes in the wilderness, like the first fig", cluster: history}
  baal-peor-apostasy: {label: "The apostasy at Baal-peor", cluster: history}
  dry-womb-dry-breasts: {label: "Prayer/curse: 'Give them a miscarrying womb and dry breasts'", cluster: judgment}
  luxuriant-vine-many-altars: {label: "Israel a luxuriant vine: the more fruit, the more altars and pillars", cluster: prophecy}
  priests-kemarim-mourn-idol: {label: "The idol-priests (kemarim) mourn as the calf is carried off as tribute to Assyria", cluster: idolatry}
  mountains-cover-us: {label: "They will say to the mountains 'Cover us' and to the hills 'Fall on us'", cluster: judgment}
  thorns-on-altars: {label: "Thorns and thistles grow up on their altars", cluster: judgment}
  trained-heifer-threshing: {label: "Ephraim a trained heifer that loves to thresh, now yoked to plow", cluster: prophecy}
  sow-righteousness-reap-hesed: {label: "Sow for yourselves righteousness, reap steadfast love, break up your fallow ground", cluster: ethics}
  mothers-dashed-with-children: {label: "Mothers dashed to pieces with their children (or pregnant women ripped open) in war", cluster: warfare}
  out-of-egypt-i-called-my-son: {label: "'When Israel was a child I loved him, and out of Egypt I called my son'", cluster: theology}
  god-as-parent-teaching-to-walk: {label: "God taught Ephraim to walk, took them in his arms and drew them with cords of love", cluster: theology}
  divine-compassion-overturns-anger: {label: "God's heart turns over within him: 'How can I give you up? I am God and not man'", cluster: theology}
  admah-zeboiim: {label: "Admah and Zeboiim, destroyed with Sodom, cited as the fate God refuses to inflict", cluster: history}
  god-roars-like-lion-exiles-return: {label: "God roars like a lion and his children come trembling back from the west, Egypt and Assyria like birds and doves", cluster: prophecy}
  oil-carried-to-egypt: {label: "Oil carried to Egypt as tribute while a covenant is made with Assyria", cluster: politics}
  jacob-strove-with-angel-wept: {label: "Jacob strove with the angel, prevailed, wept and sought his favor; found God at Bethel", cluster: patriarchs}
  merchant-with-false-scales: {label: "A merchant (Canaan) with false scales in his hand loves to oppress", cluster: ethics}
  dwell-in-tents-again: {label: "God will make Israel dwell in tents again, as in the days of the appointed feast", cluster: exile}
  god-speaks-through-prophets-parables: {label: "God has spoken through the prophets, multiplied visions and given parables by them", cluster: prophecy}
  moses-as-prophet-led-out: {label: "By a prophet God brought Israel up from Egypt, and by a prophet it was guarded", cluster: prophecy}
  kissing-calves: {label: "'Those who sacrifice men kiss calves'", cluster: idolatry}
  chaff-dew-smoke-transience: {label: "The wicked vanish like the morning cloud, dew, chaff whirled from the threshing floor, and smoke from a window", cluster: wisdom}
  no-god-but-me-no-savior: {label: "'You know no god but me, and besides me there is no savior'", cluster: theology}
  bereaved-bear: {label: "God attacks like a bear robbed of her cubs", cluster: theology}
  king-given-in-anger: {label: "God gives a king in his anger and takes him away in his wrath", cluster: kingship}
  sin-bound-up-stored: {label: "Ephraim's iniquity is bound up and his sin stored away", cluster: theology}
  child-refuses-to-be-born: {label: "Birth pangs come but he is an unwise son who does not present himself at the opening of the womb", cluster: prophecy}
  o-death-where-are-your-plagues: {label: "'Shall I ransom them from Sheol? O Death, where are your plagues? O Sheol, where is your sting?'", cluster: afterlife}
  east-wind-dries-spring: {label: "An east wind, the wind of YHWH, comes from the desert and dries up his spring", cluster: judgment}
  pregnant-women-ripped-open: {label: "Infants dashed to pieces and pregnant women ripped open in war", cluster: warfare}
  words-instead-of-bulls: {label: "Take words with you and return; we will pay the bulls (fruit) of our lips", cluster: liturgy}
  renounce-horses-and-idols: {label: "Penitent renounces reliance on Assyria and horses and calling handiwork 'our gods'", cluster: idolatry}
  god-as-dew: {label: "God will be like dew to Israel", cluster: theology}
  israel-blossoms-lily-cedar-olive: {label: "Restored Israel blossoms like a lily, roots like Lebanon, beauty like the olive, fragrance like Lebanon", cluster: eschatology}
  god-as-evergreen-cypress: {label: "God compares himself to an evergreen cypress from whom Israel's fruit comes", cluster: theology}
  wisdom-epilogue-ways-of-yhwh: {label: "Wisdom colophon: 'Whoever is wise, let him understand; the ways of YHWH are right'", cluster: wisdom}
units:
  - id: hb-ezek-41-temple-house
    tradition: judaism
    title: Ezekiel's visionary temple, the house and its carvings
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Ezek 41:1-26"]
    tags:
      - {motif: temple-vision-guide-measures, refs: ["Ezek 41:1-5", "Ezek 41:13"]}
      - {motif: holy-of-holies, refs: ["Ezek 41:4"], note: "20 by 20 cubits; 'zeh qodesh ha-qodashim'"}
      - {motif: side-chambers-three-stories, refs: ["Ezek 41:6-7"], note: "shalosh u-sheloshim pe'amim"}
      - {motif: two-faced-cherubim-and-palms, refs: ["Ezek 41:18-20", "Ezek 41:25"], note: "face of a man toward one palm, face of a young lion toward the other"}
      - {motif: wooden-altar-table-before-yhwh, refs: ["Ezek 41:22"]}
  - id: hb-ezek-42-priests-chambers
    tradition: judaism
    title: The priests' chambers and the outer measurement
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Ezek 42:1-20"]
    tags:
      - {motif: temple-vision-guide-measures, refs: ["Ezek 42:15-19"]}
      - {motif: priests-eat-most-holy-portions, refs: ["Ezek 42:13"]}
      - {motif: priests-change-holy-garments, refs: ["Ezek 42:14"]}
      - {motif: sacred-precinct-square-500, refs: ["Ezek 42:16-20"], note: "le-havdil bein ha-qodesh le-hol"}
  - id: hb-ezek-43-glory-returns
    tradition: judaism
    title: The glory of God returns to the temple
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Ezek 43:1-12"]
    tags:
      - {motif: glory-returns-from-east, refs: ["Ezek 43:2", "Ezek 43:4"]}
      - {motif: divine-voice-like-many-waters, refs: ["Ezek 43:2"]}
      - {motif: earth-shines-with-gods-glory, refs: ["Ezek 43:2"]}
      - {motif: prophet-falls-on-face-at-vision, refs: ["Ezek 43:3"], note: "recalls the visions at the river Chebar"}
      - {motif: spirit-may-carry-prophet-away, refs: ["Ezek 43:5"], note: "va-tissa'eni ruah, the spirit lifts him into the inner court"}
      - {motif: glory-fills-sanctuary-prophet-cannot-enter, refs: ["Ezek 43:5"]}
      - {motif: temple-place-of-throne-and-feet, refs: ["Ezek 43:7"]}
      - {motif: royal-tombs-defile-temple, refs: ["Ezek 43:7-9"], note: "threshold beside my threshold, only a wall between me and them"}
      - {motif: temple-plan-to-shame-israel, refs: ["Ezek 43:10-11"]}
      - {motif: heavenly-pattern-of-sanctuary, refs: ["Ezek 43:10-11"], note: "tokhnit, tsurat ha-bayit written before their eyes"}
      - {motif: temple-on-mountain-top, refs: ["Ezek 43:12"]}
  - id: hb-ezek-43-altar
    tradition: judaism
    title: The altar and its seven-day consecration
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Ezek 43:13-27"]
    tags:
      - {motif: altar-stepped-like-ziggurat, refs: ["Ezek 43:13-17"], note: "heq ha-arets 'bosom of the earth' base; steps face east (contrast Exod 20:26)"}
      - {motif: altar-hearth-ariel, refs: ["Ezek 43:15-16"]}
      - {motif: horned-altar, refs: ["Ezek 43:15", "Ezek 43:20"]}
      - {motif: zadokite-priests-faithful, refs: ["Ezek 43:19"]}
      - {motif: blood-on-altar-horns, refs: ["Ezek 43:20"]}
      - {motif: salt-of-the-covenant, refs: ["Ezek 43:24"], note: "priests throw salt on the burnt offerings"}
      - {motif: seven-day-altar-consecration, refs: ["Ezek 43:25-27"]}
  - id: hb-ezek-44-closed-gate-priests
