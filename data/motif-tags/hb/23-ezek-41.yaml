      - {motif: daily-tamid-offering, refs: ["Ezek 46:13-15"], note: "only a morning lamb here"}
      - {motif: princes-gift-returns-at-liberty-year, refs: ["Ezek 46:16-17"]}
      - {motif: prince-not-to-oppress, refs: ["Ezek 46:18"]}
      - {motif: temple-kitchens, refs: ["Ezek 46:19-24"]}
  - id: hb-ezek-47-temple-river
