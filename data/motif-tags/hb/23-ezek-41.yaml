    tagger: Claude (model), reading the Hebrew
    read: ["Ezek 47:13-48:35"]
    tags:
      - {motif: ideal-borders-of-land, refs: ["Ezek 47:15-20"]}
      - {motif: joseph-two-portions, refs: ["Ezek 47:13"]}
      - {motif: aliens-inherit-with-israel, refs: ["Ezek 47:22-23"]}
      - {motif: tribes-in-parallel-strips, refs: ["Ezek 48:1-7", "Ezek 48:23-28"]}
      - {motif: holy-land-allotment-terumah, refs: ["Ezek 48:8-22"]}
