    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Ezek 47:1-12"]
    tags:
      - {motif: river-flows-from-temple, refs: ["Ezek 47:1-5"], note: "ankle, knee, loin deep, then a river that cannot be crossed, measured every thousand cubits"}
      - {motif: temple-vision-guide-measures, refs: ["Ezek 47:3"]}
      - {motif: dead-sea-healed, refs: ["Ezek 47:8-9"]}
      - {motif: fishermen-en-gedi, refs: ["Ezek 47:10"]}
      - {motif: marshes-left-for-salt, refs: ["Ezek 47:11"]}
      - {motif: trees-monthly-fruit-healing-leaves, refs: ["Ezek 47:12"]}
      - {motif: four-rivers-of-paradise, refs: ["Ezek 47:1", "Ezek 47:12"], note: "paradise river echo; interpretive"}
    hints:
      - "Compare Rev 22:1-2 (river of the water of life, tree bearing twelve fruits monthly, leaves for healing), Joel 4:18, Zech 14:8."
