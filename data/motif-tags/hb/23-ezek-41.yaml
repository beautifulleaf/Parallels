      - {motif: prophet-falls-on-face-at-vision, refs: ["Ezek 44:4"]}
      - {motif: foreigners-barred-from-sanctuary, refs: ["Ezek 44:7", "Ezek 44:9"], note: "arle lev ve-arle basar"}
      - {motif: uncircumcised-heart, refs: ["Ezek 44:7", "Ezek 44:9"]}
      - {motif: levites-demoted-for-idolatry, refs: ["Ezek 44:10-14"]}
      - {motif: zadokite-priests-faithful, refs: ["Ezek 44:15-16"]}
      - {motif: priests-linen-no-wool-sweat, refs: ["Ezek 44:17-18"], note: "lo yahgeru ba-yeza"}
      - {motif: priests-change-holy-garments, refs: ["Ezek 44:19"]}
      - {motif: priests-hair-trimmed, refs: ["Ezek 44:20"]}
      - {motif: priests-forbidden-wine-in-sanctuary, refs: ["Ezek 44:21"]}
      - {motif: priest-marriage-restrictions, refs: ["Ezek 44:22"], note: "only virgins of Israel or a priest's widow"}
      - {motif: priests-distinguish-holy-profane-clean-unclean, refs: ["Ezek 44:23"]}
      - {motif: priests-as-judges, refs: ["Ezek 44:24"]}
      - {motif: priest-avoids-corpse-except-close-kin, refs: ["Ezek 44:25-26"]}
      - {motif: god-is-priests-inheritance, refs: ["Ezek 44:28"]}
      - {motif: first-dough-to-priest-blessing, refs: ["Ezek 44:30"]}
      - {motif: priests-no-nevelah-terefah, refs: ["Ezek 44:31"]}
  - id: hb-ezek-45-holy-portion-feasts
