      - {motif: measures-standardized, refs: ["Ezek 45:11-14"]}
      - {motif: prince-provides-festival-offerings, refs: ["Ezek 45:16-17", "Ezek 45:22"]}
      - {motif: new-year-purification-of-temple, refs: ["Ezek 45:18-19"]}
      - {motif: atonement-for-inadvertent-sinner, refs: ["Ezek 45:20"], note: "me-ish shogeh u-mi-peti"}
