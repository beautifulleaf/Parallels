  baal-berith: {label: "Baal-berith ('lord of the covenant') worshiped at Shechem", cluster: cult}
  appeal-to-kinship-bone-and-flesh: {label: "A claimant appeals: remember that I am your bone and your flesh", cluster: kingship}
  temple-treasury-funds-usurper: {label: "Silver from a temple treasury funds a usurper's hired men", cluster: kingship}
  fratricide-of-seventy-on-one-stone: {label: "A usurper kills his seventy brothers on one stone", cluster: kingship}
  youngest-son-escapes-massacre: {label: "The youngest son escapes the massacre by hiding", cluster: kingship}
  king-crowned-at-sacred-tree: {label: "A king is made king by a sacred oak or pillar", cluster: kingship}
  speech-from-mountaintop: {label: "A speech or curse is shouted from a mountaintop to the people below", cluster: literature}
  fable-of-trees-choosing-king: {label: "Fable: the trees seek a king; the useful trees decline and the bramble accepts", cluster: wisdom}
  wine-gladdens-gods-and-men: {label: "Wine gladdens gods and men; olive oil honors gods and men", cluster: wisdom}
  conditional-curse-of-mutual-fire: {label: "A conditional curse: may fire come out from each party and devour the other", cluster: literature}
  hero-flees-to-beer: {label: "The survivor flees to Beer and lives there", cluster: heroes}
  god-sends-evil-spirit: {label: "God sends an evil spirit between a ruler and his subjects", cluster: theology}
  blood-guilt-returns-on-head: {label: "The bloodshed returns on the heads of the killer and his accomplices", cluster: law}
  drunken-vintage-festival-insults-ruler: {label: "At a vintage festival in a temple, revelers curse the ruler", cluster: cult}
  shadows-of-mountains-mistaken-for-men: {label: "Someone is told he mistakes the shadows of the mountains for men", cluster: literature}
  navel-of-the-earth: {label: "A place called the navel of the earth (tabbur ha-arets)", cluster: cosmology}
  diviners-oak: {label: "The oak of the diviners (Elon Meonenim)", cluster: cult}
  city-sown-with-salt: {label: "A destroyed city is sown with salt", cluster: conquest}
  tower-burned-with-people-inside: {label: "A tower with people taking refuge inside is set on fire", cluster: conquest}
  do-as-i-do: {label: "The leader tells his men: what you see me do, do likewise", cluster: literature}
  woman-drops-millstone-on-attacker: {label: "A woman drops an upper millstone from a tower onto the attacker's head", cluster: heroes}
  asks-armor-bearer-to-kill-him: {label: "The dying leader asks his armor-bearer to kill him so it is not said a woman killed him", cluster: heroes}
  curse-fulfilled: {label: "A spoken curse comes upon those cursed", cluster: theology}
  minor-judge-notice: {label: "Brief notice of a judge: origin, years of judging, death and burial", cluster: literature}
  thirty-sons-on-thirty-donkeys: {label: "A judge's many sons ride on donkeys as a mark of status", cluster: kingship}
  god-grieved-by-misery: {label: "God's soul grows impatient (grieved) at Israel's misery", cluster: theology}
  leadership-offered-to-whoever-fights-first: {label: "Leadership is offered to whoever will begin the fight", cluster: kingship}
  son-of-harlot-becomes-leader: {label: "The son of a harlot becomes a mighty warrior and leader", cluster: heroes}
  half-brothers-expel-heir: {label: "Half-brothers drive out a son of another woman so he cannot inherit", cluster: heroes}
  outcast-leads-band-of-worthless-men: {label: "An outcast gathers a band of 'empty men' around him", cluster: heroes}
  rejected-one-recalled-in-crisis: {label: "Those who rejected the hero come to him for help in their distress", cluster: heroes}
  covenant-sealed-before-god-at-mizpah: {label: "The agreement with the leader is spoken before YHWH at Mizpah", cluster: law}
  diplomatic-message-with-historical-argument: {label: "The leader sends messengers to the enemy king arguing from history", cluster: literature}
  each-nation-possesses-what-its-god-gives: {label: "Each nation possesses the land its own god gives it (Chemosh, YHWH)", cluster: theology}
  three-hundred-years-claim: {label: "Israel claims to have held the land for three hundred years", cluster: literature}
  god-as-judge-between-nations: {label: "God the Judge is called to judge between two nations", cluster: theology}
  rash-vow-first-to-come-out: {label: "A father vows to sacrifice whatever first comes out of his house to meet him", cluster: law}
  daughter-greets-victor-with-timbrels: {label: "The daughter comes out with timbrels and dances to greet the returning victor", cluster: ritual}
  daughter-sacrificed-by-fathers-vow: {label: "An only daughter is sacrificed to fulfill her father's vow", cluster: ritual}
  virgin-laments-on-mountains: {label: "The doomed virgin goes with her companions to the mountains for two months to bewail her virginity", cluster: ritual}
  annual-womens-ritual-commemoration: {label: "The daughters of Israel go yearly for four days to commemorate her", cluster: ritual}
  took-life-in-hand: {label: "Idiom: 'I put my life in my hand' (took a mortal risk)", cluster: literature}
  shibboleth-pronunciation-test: {label: "Fugitives are identified by how they pronounce a word (shibboleth / sibboleth)", cluster: conquest}
  fugitives-taunt: {label: "A taunt calls the other group fugitives", cluster: literature}
  thirty-sons-thirty-daughters-exogamy: {label: "A judge sends out thirty daughters in marriage and brings in thirty brides", cluster: heroes}
  amalekite-mountain-in-ephraim: {label: "A 'hill country of the Amalekite' inside Ephraim", cluster: geography}
units:
  - id: hb-josh-4-twelve-stones
    tradition: judaism
    title: Twelve memorial stones from the Jordan; the river returns
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Josh 4:1-24"]
    tags:
      - {motif: twelve-memorial-stones, refs: ["Josh 4:3", "Josh 4:8", "Josh 4:20"], note: "one stone per tribe, carried on the shoulder (4:5)"}
      - {motif: stones-set-up-in-riverbed, refs: ["Josh 4:9"], note: "a second set of twelve stones set up inside the Jordan where the priests' feet stood, 'there to this day'"}
      - {motif: childs-question-ritual-explanation, refs: ["Josh 4:6-7", "Josh 4:21-22"], note: "'when your children ask tomorrow: what are these stones?'"}
      - {motif: river-waters-stand-in-heap, refs: ["Josh 4:7", "Josh 4:18", "Josh 4:23"], note: "waters 'cut off' before the ark; they return to their place when the priests' soles touch dry ground"}
      - {motif: crossing-recapitulates-sea-crossing, refs: ["Josh 4:23"], note: "explicit comparison with the Reed Sea (yam suf)"}
      - {motif: successor-exalted-like-predecessor, refs: ["Josh 4:14"], note: "they feared Joshua as they had feared Moses"}
      - {motif: transjordan-tribes-fight-first, refs: ["Josh 4:12-13"], note: "about 40,000 armed men"}
      - {motif: dated-crossing-tenth-of-first-month, refs: ["Josh 4:19"], note: "the day the Passover lamb is selected (Exod 12:3)"}
      - {motif: gilgal-sanctuary, refs: ["Josh 4:19-20"]}
      - {motif: miracle-so-all-peoples-know, refs: ["Josh 4:24"]}
    hints:
      - "Compare Gen 31:46 (cairn of witness), Exod 24:4 (twelve pillars), 1Kgs 18:31 (Elijah's twelve stones); 2Kgs 2:8 (Elijah and Elisha part the Jordan)."
      - "Matt 3:9 'God can raise children to Abraham from these stones' has been linked by commentators to the Gilgal stones near the baptism site."
  - id: hb-josh-5-circumcision-passover-commander
    tradition: judaism
    title: Mass circumcision at Gilgal, Passover, end of manna, the commander of YHWH's army
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Josh 5:1-15"]
    tags:
      - {motif: melting-hearts-of-canaanites, refs: ["Josh 5:1"], note: "'their heart melted and there was no more spirit in them'"}
      - {motif: flint-knives-circumcision, refs: ["Josh 5:2-3"], note: "harvot tsurim; 'circumcise a second time'"}
      - {motif: hill-of-foreskins, refs: ["Josh 5:3"], note: "Givat ha-Aralot"}
      - {motif: wilderness-generation-uncircumcised, refs: ["Josh 5:4-7"]}
      - {motif: forty-years-wandering, refs: ["Josh 5:6"]}
      - {motif: land-flowing-milk-and-honey, refs: ["Josh 5:6"]}
      - {motif: place-name-etiology, refs: ["Josh 5:9"], note: "Gilgal from galloti 'I have rolled away' the reproach of Egypt"}
      - {motif: passover-celebrated-at-turning-point, refs: ["Josh 5:10"]}
      - {motif: manna-ceases, refs: ["Josh 5:11-12"], note: "manna stops the day after they eat parched grain of the land"}
      - {motif: angel-with-drawn-sword, refs: ["Josh 5:13"]}
      - {motif: commander-of-heavenly-army, refs: ["Josh 5:14"], note: "sar tseva YHWH; answers 'No' to 'are you for us or for our enemies?'"}
      - {motif: remove-sandals-holy-ground, refs: ["Josh 5:15"], note: "verbal echo of Exod 3:5"}
    hints:
      - "Compare Exod 4:25 (Zipporah's flint), Num 22:31 and 1Chr 21:16 (angel with drawn sword); Dan 10:13 and 12:1 (Michael the prince); Quran 20:12 (Moses told to remove his sandals in the sacred valley Tuwa)."
      - "Rabbinic tradition identifies the commander as Michael; patristic reading as the pre-incarnate Logos."
      - "LXX Josh 24:31a says the flint knives were buried with Joshua at Timnath-serah."
  - id: hb-josh-6-jericho
    tradition: judaism
    title: Fall of Jericho; Rahab spared; curse on the rebuilder
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Josh 6:1-27"]
    tags:
      - {motif: city-circled-seven-days, refs: ["Josh 6:3-4", "Josh 6:14-15"], note: "once a day for six days, seven times on the seventh"}
      - {motif: seven-priests-seven-rams-horns, refs: ["Josh 6:4", "Josh 6:6", "Josh 6:8", "Josh 6:13"], note: "shofrot ha-yovelim"}
      - {motif: ark-leads-army, refs: ["Josh 6:6-9", "Josh 6:11"]}
      - {motif: imposed-silence-until-signal, refs: ["Josh 6:10"], note: "not a word may leave your mouth until I say 'shout'"}
      - {motif: walls-fall-at-shout, refs: ["Josh 6:5", "Josh 6:20"], note: "'the wall fell down in its place' (tahteyha)"}
      - {motif: herem-total-destruction, refs: ["Josh 6:17-19", "Josh 6:21"]}
      - {motif: metals-consecrated-to-treasury, refs: ["Josh 6:19", "Josh 6:24"]}
      - {motif: hospitable-harlot-spared, refs: ["Josh 6:17", "Josh 6:22-23", "Josh 6:25"], note: "Rahab and her family set 'outside the camp', then dwell 'in the midst of Israel to this day'"}
      - {motif: curse-on-rebuilder-of-city, refs: ["Josh 6:26"], note: "foundation laid at the cost of his firstborn, gates set up at the cost of his youngest"}
      - {motif: city-burned, refs: ["Josh 6:24"]}
    hints:
      - "Fulfilled in 1Kgs 16:34 (Hiel of Bethel loses Abiram and Segub): foundation-sacrifice motif."
      - "Heb 11:30-31; Jas 2:25; Matt 1:5 (Rahab in Jesus' genealogy); rabbinic tradition has Rahab marry Joshua and become ancestor of prophets (b. Meg 14b)."
      - "Compare ritual processions around a city; seven-day cycles in Ugaritic epic (Kirta's siege of Udm)."
  - id: hb-josh-7-achan
    tradition: judaism
    title: Defeat at Ai and the trespass of Achan
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Josh 7:1-26"]
    tags:
      - {motif: theft-from-devoted-things, refs: ["Josh 7:1", "Josh 7:11", "Josh 7:21"], note: "a Shinar mantle, 200 shekels of silver, a gold 'tongue' of 50 shekels, buried under his tent"}
      - {motif: spies-scout-land, refs: ["Josh 7:2-3"]}
      - {motif: defeat-because-of-hidden-sin, refs: ["Josh 7:4-5", "Josh 7:12"], note: "thirty-six men fall; 'the heart of the people melted and became water'"}
      - {motif: mourning-rites-torn-clothes-dust, refs: ["Josh 7:6"]}
      - {motif: leader-complains-to-god-wishes-had-stayed, refs: ["Josh 7:7-9"], note: "'would that we had been content to stay beyond the Jordan'; 'what will you do for your great name?'"}
      - {motif: urim-thummim-lot, refs: ["Josh 7:14-18"], note: "tribe, clan, household, man"}
      - {motif: confession-give-glory-to-god, refs: ["Josh 7:19-20"]}
      - {motif: coveted-saw-took-hid, refs: ["Josh 7:21"], note: "va-ere ... va-ehmedem va-eqqahem: saw, coveted, took (cf. Gen 3:6)"}
      - {motif: family-executed-with-sinner, refs: ["Josh 7:24-25"], note: "sons, daughters, livestock and tent taken; stoned and burned"}
      - {motif: stone-heap-over-executed, refs: ["Josh 7:26"]}
      - {motif: place-name-etiology, refs: ["Josh 7:25-26"], note: "Valley of Achor, pun on 'akhar 'trouble'"}
    hints:
      - "1Chr 2:7 names him Achar 'troubler of Israel'; Hos 2:17 'the valley of Achor a door of hope'. Compare Acts 5:1-11 (Ananias and Sapphira keep back devoted goods)."
      - "Rabbinic: Achan's confession earned him a share in the world to come (m. Sanh 6:2)."
  - id: hb-josh-8-ai-ebal
    tradition: judaism
    title: Ambush and capture of Ai; altar and Torah inscribed on Mount Ebal
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Josh 8:1-35"]
    tags:
      - {motif: feigned-retreat-ambush, refs: ["Josh 8:2", "Josh 8:4-7", "Josh 8:15-21"]}
      - {motif: outstretched-javelin-until-victory, refs: ["Josh 8:18", "Josh 8:26"], note: "Joshua does not draw back his hand with the kidon until all Ai is destroyed (cf. Moses' hands, Exod 17:11-12)"}
      - {motif: smoke-signal-from-burning-city, refs: ["Josh 8:20-21"]}
      - {motif: enemy-king-hanged-till-sunset, refs: ["Josh 8:23", "Josh 8:29"], note: "body taken down at sunset (Deut 21:22-23) and cast at the city gate under a cairn"}
      - {motif: stone-heap-over-executed, refs: ["Josh 8:29"]}
      - {motif: city-made-eternal-tell, refs: ["Josh 8:28"], note: "tel olam shemamah; ha-Ai = 'the ruin'"}
      - {motif: altar-of-unhewn-stones, refs: ["Josh 8:30-31"], note: "no iron lifted on them"}
      - {motif: plastered-stones-inscribed-with-torah, refs: ["Josh 8:32"], note: "mishneh torat Mosheh written on the stones"}
      - {motif: gerizim-blessing-ebal-curse, refs: ["Josh 8:33-34"], note: "half facing Gerizim, half facing Ebal"}
      - {motif: public-reading-of-law-to-all, refs: ["Josh 8:34-35"], note: "women, children and resident aliens included"}
      - {motif: herem-total-destruction, refs: ["Josh 8:26-27"], note: "but this time livestock and spoil are allowed"}
    hints:
      - "The Mount Ebal altar is central to Samaritan claims (Samaritan Pentateuch reads Gerizim in Deut 27:4). Compare Judg 20:29-48 (the same ambush tactic at Gibeah)."
  - id: hb-josh-9-gibeonite-ruse
    tradition: judaism
    title: The Gibeonites trick Israel into a treaty
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Josh 9:1-27"]
    tags:
      - {motif: coalition-of-canaanite-kings, refs: ["Josh 9:1-2"]}
      - {motif: disguise-as-travelers-from-afar, refs: ["Josh 9:4-6", "Josh 9:12-13"], note: "worn sacks, split and patched wineskins, patched sandals, worn clothes, bread dry and crumbled (niqqudim)"}
      - {motif: moldy-bread-as-proof, refs: ["Josh 9:5", "Josh 9:12"], note: "'this our bread was hot when we took it from our houses'"}
      - {motif: failure-to-consult-god, refs: ["Josh 9:14"], note: "they took of their provisions and did not ask the mouth of YHWH"}
      - {motif: oath-binding-though-obtained-by-deceit, refs: ["Josh 9:15", "Josh 9:18-20"], note: "princes cannot touch them 'lest wrath come upon us because of the oath'"}
      - {motif: people-murmur-against-leaders, refs: ["Josh 9:18"]}
      - {motif: hewers-of-wood-drawers-of-water, refs: ["Josh 9:21", "Josh 9:23", "Josh 9:27"], note: "perpetual temple servitude; cf. Deut 29:10"}
      - {motif: curse-of-servitude, refs: ["Josh 9:23"], note: "'you are cursed: there shall never fail to be a slave among you'"}
      - {motif: fame-of-god-reaches-foreigners, refs: ["Josh 9:9-10", "Josh 9:24"]}
      - {motif: centralized-sanctuary-chosen-place, refs: ["Josh 9:27"]}
    hints:
      - "2Sam 21:1-14: Saul's violation of the Gibeonite oath brings famine. Compare Gen 9:25 (curse of Canaan to servitude) and Greek stories of oaths kept despite deception."
      - "Rabbinic Netinim are identified with the Gibeonites (b. Yev 79a)."
  - id: hb-josh-10-sun-stands-still
    tradition: judaism
    title: Battle of Gibeon, hailstones, sun and moon stand still, five kings in the cave, southern campaign
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Josh 10:1-43"]
    tags:
      - {motif: five-king-coalition, refs: ["Josh 10:3-5"], note: "Adoni-zedek of Jerusalem with Hoham, Piram, Japhia, Debir"}
      - {motif: king-of-jerusalem-zedek-name, refs: ["Josh 10:1", "Josh 10:3"], note: "Adoni-tsedeq 'my lord is righteousness'"}
      - {motif: night-march-surprise, refs: ["Josh 10:9"]}
      - {motif: god-throws-enemy-into-panic, refs: ["Josh 10:10"], note: "vayhummem"}
      - {motif: hailstones-from-heaven-kill-enemy, refs: ["Josh 10:11"], note: "more died by hailstones than by the sword"}
      - {motif: sun-stands-still, refs: ["Josh 10:12-13"], note: "'Sun, be silent (dom) in Gibeon, and moon in the valley of Aijalon'; sun stood in mid-heaven about a whole day"}
      - {motif: citation-of-lost-book, refs: ["Josh 10:13"], note: "Sefer ha-Yashar (Book of Jashar)"}
      - {motif: god-obeys-voice-of-man, refs: ["Josh 10:14"], note: "'no day like it before or after, that YHWH heeded the voice of a man'"}
      - {motif: divine-warrior, refs: ["Josh 10:14", "Josh 10:42"]}
      - {motif: kings-hide-in-cave, refs: ["Josh 10:16-18"], note: "cave at Makkedah sealed with great stones"}
      - {motif: no-one-whets-tongue-against-israel, refs: ["Josh 10:21"], note: "'no one sharpened his tongue against Israel'"}
      - {motif: feet-on-necks-of-kings, refs: ["Josh 10:24"]}
      - {motif: enemy-king-hanged-till-sunset, refs: ["Josh 10:26-27"], note: "five kings on five trees, then thrown into the cave; stones there 'to this very day'"}
      - {motif: herem-total-destruction, refs: ["Josh 10:28-39"], note: "stereotyped formula repeated for Makkedah, Libnah, Lachish, Eglon, Hebron, Debir"}
      - {motif: conquest-summary-from-kadesh-to-gaza, refs: ["Josh 10:40-42"]}
    hints:
      - "Compare Iliad 2.412-418 (Agamemnon prays the sun not to set before victory), Iliad 18.239-242 (Hera hastens sunset); Hab 3:11; Sir 46:4. Islamic tradition (Sahih Bukhari, hadith of a prophet whose sun was held back, identified as Joshua/Yusha')."
      - "Hailstones: compare Exod 9:23-25, Rev 16:21. Book of Jashar also quoted in 2Sam 1:18; medieval pseudepigraphal Sefer ha-Yashar expands it."
      - "Feet on necks: Assyrian and Egyptian royal iconography of kings treading on enemies; Ps 110:1."
  - id: hb-josh-11-hazor-northern-campaign
    tradition: judaism
    title: Northern coalition under Jabin of Hazor; hamstrung horses; Anakim destroyed
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Josh 11:1-23"]
    tags:
      - {motif: coalition-of-canaanite-kings, refs: ["Josh 11:1-5"], note: "Jabin king of Hazor and kings of Madon, Shimron, Achshaph; at the waters of Merom"}
      - {motif: army-like-sand-of-sea, refs: ["Josh 11:4"]}
      - {motif: hamstring-horses-burn-chariots, refs: ["Josh 11:6", "Josh 11:9"]}
      - {motif: pursuit-to-sidon, refs: ["Josh 11:8"], note: "to Great Sidon and Misrephoth-maim"}
      - {motif: hazor-head-of-kingdoms, refs: ["Josh 11:10-11", "Josh 11:13"], note: "only Hazor burned; other cities 'standing on their tells' left"}
      - {motif: god-hardens-enemy-heart, refs: ["Josh 11:20"], note: "it was from YHWH to strengthen their heart for battle so they would be destroyed"}
      - {motif: giants-in-the-land, refs: ["Josh 11:21-22"], note: "Anakim remain only in Gaza, Gath and Ashdod (Goliath's Gath)"}
      - {motif: land-had-rest-from-war, refs: ["Josh 11:23"]}
      - {motif: fame-of-god-reaches-foreigners, refs: ["Josh 11:19"], note: "no city made peace except Gibeon"}
    hints:
      - "Jabin of Hazor reappears in Judg 4. Hazor is attested in Mari letters and Amarna (Abdi-Tirshi). Compare Exod 14 (hardening of Pharaoh's heart)."
  - id: hb-josh-12-list-of-kings
    tradition: judaism
    title: List of the kings defeated by Moses and Joshua (thirty-one kings)
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Josh 12:1-24"]
    tags:
      - {motif: last-of-the-giants, refs: ["Josh 12:4"], note: "Og 'of the remnant of the Rephaim' dwelling at Ashtaroth and Edrei"}
      - {motif: sihon-and-og-defeated, refs: ["Josh 12:2-6"]}
      - {motif: list-of-conquered-kings, refs: ["Josh 12:9-24"], note: "each line ends 'ehad' (one); total 31 kings"}
      - {motif: seven-nations-of-canaan, refs: ["Josh 12:8"], note: "here six named: Hittite, Amorite, Canaanite, Perizzite, Hivite, Jebusite"}
      - {motif: king-of-goiim-at-gilgal, refs: ["Josh 12:23"], note: "'king of nations (goyim)' — cf. Tidal king of Goiim, Gen 14:1"}
    hints:
      - "Compare Egyptian topographical lists of conquered towns (Thutmose III at Karnak, Shishak list), which share names such as Megiddo, Taanach, Aphek."
  - id: hb-josh-13-land-remaining-transjordan
    tradition: judaism
    title: Land still to be conquered; Transjordanian allotments; Balaam's death
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Josh 13:1-33"]
    tags:
      - {motif: aged-leader-told-much-remains, refs: ["Josh 13:1"], note: "'you are old, advanced in days, and very much land remains'"}
      - {motif: five-philistine-lords, refs: ["Josh 13:3"], note: "seranim of Gaza, Ashdod, Ashkelon, Gath, Ekron; plus the Avvim"}
      - {motif: shihor-border-of-egypt, refs: ["Josh 13:3"]}
      - {motif: land-unconquered-remains, refs: ["Josh 13:2-6", "Josh 13:13"], note: "Geshur and Maacath dwell in Israel 'to this day'"}
      - {motif: ideal-borders-of-land, refs: ["Josh 13:5"], note: "the land of the Gebalites (Byblos) and all Lebanon"}
      - {motif: levites-no-inheritance-god-is-portion, refs: ["Josh 13:14", "Josh 13:33"], note: "13:14 'the fire-offerings of YHWH are his inheritance'; 13:33 'YHWH is their inheritance'"}
