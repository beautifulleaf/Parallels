      - "The bird released over the field parallels the scapegoat (Lev 16) and Mesopotamian/Hittite elimination rites carrying impurity away on a living animal; rabbinic tradition (Arakhin 16a) links tsara'at to slander."
  - id: hb-lev-15-genital-discharges
    tradition: judaism
    title: Impurity of bodily discharges, semen and menstruation
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Lev 15:1-33"]
    tags:
      - {motif: male-discharge-impurity, refs: ["Lev 15:2", "Lev 15:3"]}
      - {motif: impurity-transmitted-by-bed-and-seat, refs: ["Lev 15:4", "Lev 15:5", "Lev 15:6", "Lev 15:9", "Lev 15:10", "Lev 15:20", "Lev 15:21", "Lev 15:22", "Lev 15:23", "Lev 15:26"], note: "Includes the saddle (מֶרְכָּב) he rides on"}
      - {motif: spittle-transmits-impurity, refs: ["Lev 15:8"]}
      - {motif: rinsing-hands-prevents-transmission, refs: ["Lev 15:11"]}
      - {motif: earthenware-vessel-broken-when-defiled, refs: ["Lev 15:12"]}
      - {motif: seven-clean-days-and-living-water, refs: ["Lev 15:13", "Lev 15:28"]}
      - {motif: poor-substitute-two-birds, refs: ["Lev 15:14", "Lev 15:29"], note: "Here the standard offering, not a concession"}
