  priestly-blessing-raised-hands: {label: "Priest lifts up his hands and blesses the people", cluster: cult}
  priests-daughter-returns-to-fathers-table: {label: "Widowed or divorced childless priest's daughter returns to eat of her father's holy food", cluster: cult}
  priests-died-childless: {label: "Priests who died for a cultic offense left no sons", cluster: narrative}
  priests-distinguish-holy-profane-clean-unclean: {label: "Priests must distinguish holy from profane and clean from unclean and teach the people", cluster: cult}
  priests-eat-most-holy-portions: {label: "Priests eat the most holy portions in a holy place", cluster: cult}
  priests-forbidden-wine-in-sanctuary: {label: "Priests may not drink wine or strong drink when entering the tent", cluster: cult}
  priests-slave-eats-but-hired-man-does-not: {label: "A priest's purchased or house-born slave eats holy food, but a hired worker or lodger does not", cluster: cult}
  proclaim-liberty-throughout-the-land: {label: "Proclaim release (deror) throughout the land to all its inhabitants", cluster: law}
  pronouncing-the-name-capital: {label: "Pronouncing or pricking 'the Name' of God in blasphemy is a capital offense", cluster: law}
  puncta-extraordinaria-dots: {label: "Masoretic extraordinary dots over a word", cluster: text}
  purging-sanctuary-of-impurities: {label: "Blood rites purge the sanctuary and altar of the people's impurities and transgressions", cluster: cult}
  purification-offering-after-childbirth: {label: "Mother brings a burnt offering and sin offering at the end of her purification", cluster: purity}
  purity-at-sunset: {label: "Impure person becomes clean when the sun sets", cluster: purity}
  putting-gods-name-on-people: {label: "Priests 'put God's name' upon the people by blessing them", cluster: cult}
  rain-in-its-season-blessing: {label: "Blessing: rain in its season and harvests so abundant that one overtakes the next", cluster: covenant}
  raw-flesh-sign-of-disease: {label: "Raw (living) flesh in a swelling is a sign of skin disease", cluster: purity}
  rebuke-neighbor-not-hate-in-heart: {label: "Do not hate your brother in your heart; rebuke your neighbor instead", cluster: ethics}
  redemption-from-alien-master: {label: "Israelite sold to a resident alien may be redeemed by kin or himself, priced by years to jubilee", cluster: law}
  redemption-of-firstborn-five-shekels: {label: "Human firstborn redeemed for five shekels", cluster: law}
  restitution-plus-one-fifth: {label: "Restitution of the principal plus one fifth", cluster: law}
  restitution-to-priest-if-no-kinsman: {label: "If the wronged party has no kinsman, restitution goes to God, to the priest", cluster: law}
  revere-mother-and-father: {label: "Each person must revere mother and father", cluster: ethics}
  rinsing-hands-prevents-transmission: {label: "Person with a discharge who has rinsed his hands does not transmit impurity by touch", cluster: purity}
  rise-before-the-aged: {label: "Rise before the gray-haired and honor the elderly", cluster: ethics}
  sabbatical-year-land-rests: {label: "Every seventh year the land rests: no sowing, pruning or harvesting", cluster: law}
  sacrifice-to-goat-demons-forbidden: {label: "People may no longer sacrifice to the goat-demons (se'irim) they whored after", cluster: cult}
  sanctification-of-gods-name: {label: "God is to be sanctified in the midst of Israel; his holy name not profaned", cluster: theology}
  scalp-or-beard-scall: {label: "Skin disease of the scalp or beard (neteq) judged by yellow or black hair", cluster: purity}
  scapegoat-bears-sins-into-wilderness: {label: "Living goat bears the people's sins away into the wilderness", cluster: cult}
  scattering-among-nations: {label: "Curse: God will scatter the people among the nations", cluster: covenant}
  secret-adultery-without-witness: {label: "Adultery done in secret with no witness and not caught in the act", cluster: law}
  seminal-emission-impurity-until-evening: {label: "Emission of semen makes a man (and his partner) unclean until evening", cluster: purity}
  seven-clean-days-and-living-water: {label: "After a discharge ends, seven clean days are counted and the person bathes in living water", cluster: purity}
  seven-day-quarantine: {label: "Priest shuts up a suspected affliction for seven days and re-examines it", cluster: purity}
  seven-days-unleavened-bread: {label: "Unleavened bread eaten for seven days", cluster: cult}
  sevenfold-sprinkling: {label: "Blood or water sprinkled seven times", cluster: cult}
  shaatnez-wool-linen: {label: "Do not wear wool and linen together (sha'atnez)", cluster: law}
  shaved-hair-burned-on-altar-fire: {label: "Nazirite's shaved hair is put on the fire under the well-being offering", cluster: cult}
  shaving-all-hair-for-purification: {label: "The person being purified shaves all hair, including beard and eyebrows", cluster: purity}
  shekel-of-twenty-gerahs: {label: "The sanctuary shekel is defined as twenty gerahs", cluster: lists}
  shofar-sounded-on-atonement-day: {label: "The shofar is sounded throughout the land on the Day of Atonement to begin the jubilee", cluster: festival}
  sibling-incest-called-hesed: {label: "Sibling incest is called 'hesed' (normally 'kindness'), here a disgrace", cluster: law}
  sin-offering-burned-outside-camp: {label: "The flesh, skin and dung of the sin offering are burned outside the camp", cluster: sacrifice}
  six-covered-wagons-twelve-oxen: {label: "Twelve leaders give six covered wagons and twelve oxen for transporting the sanctuary", cluster: cult}
  six-hundred-three-thousand-total: {label: "Total of 603,550 fighting men", cluster: lists}
  sky-as-iron-earth-as-bronze: {label: "Curse: the sky like iron and the earth like bronze", cluster: covenant}
  slaughter-only-at-sanctuary: {label: "Animals may be slaughtered only as offerings at the sanctuary entrance", cluster: cult}
  son-of-mixed-marriage-blasphemes: {label: "Son of an Israelite mother and Egyptian father blasphemes the Name in a quarrel", cluster: narrative}
  spirit-of-jealousy-seizes-husband: {label: "A 'spirit of jealousy' comes over a husband who suspects his wife", cluster: law}
  spittle-transmits-impurity: {label: "Spittle of an unclean person defiles the person it falls on", cluster: purity}
  spring-and-cistern-remain-pure: {label: "A spring or cistern collecting water remains clean even if a carcass falls in", cluster: purity}
  stoning-penalty: {label: "Offender stoned to death by the community", cluster: law}
  strange-fire-deaths: {label: "Priests die for offering 'strange fire'", cluster: cult}
  sudden-death-nearby-voids-vow: {label: "Sudden death of someone beside a Nazirite voids his vow and he must start again", cluster: cult}
  tabernacle-anointed-on-completion: {label: "The sanctuary and its vessels anointed and consecrated on its completion", cluster: cult}
  tahash-skin-coverings: {label: "Holy objects covered with tahash skins for transport", cluster: cult}
  talebearing-forbidden: {label: "Do not go about as a talebearer among your people", cluster: ethics}
  ten-women-bake-in-one-oven: {label: "Curse: ten women bake bread in one oven and it is doled out by weight", cluster: covenant}
  tent-and-levites-march-in-center: {label: "The tent and Levite camp march in the middle of the tribal columns", cluster: wilderness}
  thanksgiving-eaten-same-day: {label: "Thanksgiving offering eaten the same day with nothing left till morning", cluster: cult}
  three-levite-clans-gershon-kohath-merari: {label: "Levites divided into three clans: Gershon, Kohath and Merari", cluster: lists}
  threefold-priestly-blessing: {label: "Three-part priestly blessing: bless and keep, shine face, lift face and give peace", cluster: cult}
  tithe-of-produce-and-herd: {label: "A tenth of the land's produce and of herd and flock is holy to God", cluster: law}
  tribal-banners-and-signs: {label: "Each tribe camps by its standard with ensigns of its ancestral house", cluster: wilderness}
  tribal-census-totals: {label: "Census totals given tribe by tribe", cluster: lists}
  triple-harvest-in-sixth-year: {label: "God promises the sixth year will yield enough for three years", cluster: law}
  twelve-loaves-showbread: {label: "Twelve loaves in two rows set before God each sabbath with frankincense", cluster: cult}
  twelve-tribal-chieftains-named: {label: "Twelve tribal leaders listed by name and patronymic", cluster: lists}
  two-birds-one-killed-one-released: {label: "Two birds: one slaughtered, the other dipped in its blood and set free over the field", cluster: purity}
  two-sisters-forbidden-as-rival-wives: {label: "A man may not marry his wife's sister as a rival while the wife lives", cluster: law}
  uncircumcised-heart: {label: "The people's 'uncircumcised heart' must be humbled", cluster: theology}
  unclean-birds-list: {label: "List of unclean birds (eagle, vulture, raven, owl, stork, hoopoe, bat)", cluster: dietary}
  unclean-expelled-from-camp: {label: "People with skin disease, discharge or corpse impurity are sent out of the camp", cluster: purity}
  unclean-priest-barred-from-holy-food: {label: "Priest in a state of impurity may not eat holy food until he washes and the sun sets", cluster: cult}
  uncut-hair-consecrated: {label: "The consecrated person lets his hair grow uncut as the sign of his vow", cluster: cult}
  unredeemed-field-becomes-priests-at-jubilee: {label: "A dedicated field not redeemed becomes the priest's holding at the jubilee", cluster: law}
  voice-from-between-cherubim: {label: "God's voice speaks to Moses from above the ark cover between the two cherubim", cluster: theophany}
  vowed-person-valuation-by-age-and-sex: {label: "A person vowed to God is valued in silver by age and sex", cluster: law}
  wages-paid-same-day: {label: "Pay the poor hired worker before sunset", cluster: ethics}
  wagons-allotted-by-workload: {label: "Wagons and oxen allotted to Levite clans according to their loads", cluster: cult}
  walled-city-house-redeemable-one-year: {label: "A house in a walled city can be redeemed only within a year and does not return at the jubilee", cluster: law}
  wave-offering-breast-and-thigh: {label: "The breast and right thigh are waved before God and given to the priests", cluster: cult}
  weekly-sabbath-rest: {label: "The seventh day is a sabbath of complete rest", cluster: festival}
  white-hair-sign-of-disease: {label: "Hair turned white in the affected spot is a sign of skin disease", cluster: purity}
  wholly-white-is-clean: {label: "A person whose skin disease covers the whole body and turns white is declared clean", cluster: purity}
  wild-beasts-removed-from-land: {label: "Blessing: God removes harmful wild beasts from the land", cluster: covenant}
  wild-beasts-sent-as-punishment: {label: "Curse: God sends wild beasts to bereave the people", cluster: covenant}
  wine-permitted-after-vow-ends: {label: "After the vow's completion rite the Nazirite may drink wine", cluster: cult}
  woman-with-prolonged-bleeding: {label: "Woman with bleeding beyond her menstrual period is unclean all the days of the flow", cluster: purity}
  womans-hair-unbound-before-god: {label: "Priest unbinds the accused woman's hair before God", cluster: cult}
  written-curse-dissolved-in-water-drunk: {label: "Written curses are wiped into water that the accused then drinks", cluster: magic}
  yoke-bars-broken-walk-upright: {label: "God broke the bars of the yoke and made the people walk upright", cluster: exodus}
units:
  - id: hb-lev-9-eighth-day-inauguration
    tradition: judaism
    title: The eighth day - Aaron's first offerings and the divine fire
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Lev 9:1-24"]
    tags:
      - {motif: eighth-day-inauguration, refs: ["Lev 9:1"], note: "After the seven days of ordination"}
      - {motif: calf-sin-offering-for-high-priest, refs: ["Lev 9:2", "Lev 9:8"], note: "Aaron's own offering is an עֵגֶל, a calf"}
      - {motif: blood-on-altar-horns, refs: ["Lev 9:9"]}
      - {motif: fat-kidneys-liver-lobe-burned, refs: ["Lev 9:10", "Lev 9:19"]}
      - {motif: sin-offering-burned-outside-camp, refs: ["Lev 9:11"]}
      - {motif: fat-tail-offered, refs: ["Lev 9:19"], note: "הָאַלְיָה"}
      - {motif: wave-offering-breast-and-thigh, refs: ["Lev 9:21"]}
      - {motif: priestly-blessing-raised-hands, refs: ["Lev 9:22"]}
      - {motif: glory-of-god-appears-to-people, refs: ["Lev 9:4", "Lev 9:6", "Lev 9:23"]}
      - {motif: heavenly-fire-consumes-offering, refs: ["Lev 9:24"]}
      - {motif: people-shout-and-fall-on-faces, refs: ["Lev 9:24"]}
    hints:
      - "Compare 1Kgs 18:38 (Elijah), 2Chr 7:1 (Solomon), Judg 6:21 and 13:20; Quran 3:183 on the demand for an offering consumed by fire."
  - id: hb-lev-10-nadab-abihu
    tradition: judaism
    title: Strange fire - death of Nadab and Abihu; priestly rules
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Lev 10:1-20"]
    tags:
      - {motif: strange-fire-deaths, refs: ["Lev 10:1"], note: "אֵשׁ זָרָה אֲשֶׁר לֹא צִוָּה"}
      - {motif: fire-consumes-offerers, refs: ["Lev 10:2"]}
      - {motif: god-sanctified-through-those-near, refs: ["Lev 10:3"], note: "בִּקְרֹבַי אֶקָּדֵשׁ"}
      - {motif: father-silent-at-sons-death, refs: ["Lev 10:3"], note: "וַיִּדֹּם אַהֲרֹן"}
      - {motif: bodies-carried-out-in-tunics, refs: ["Lev 10:4", "Lev 10:5"], note: "Carried out by cousins Mishael and Elzaphan, in their tunics"}
      - {motif: priest-forbidden-mourning-rites, refs: ["Lev 10:6", "Lev 10:7"], note: "Not to dishevel hair or rend garments; anointing oil is on them"}
      - {motif: priests-forbidden-wine-in-sanctuary, refs: ["Lev 10:8", "Lev 10:9"]}
      - {motif: priests-distinguish-holy-profane-clean-unclean, refs: ["Lev 10:10", "Lev 10:11"]}
      - {motif: priests-eat-most-holy-portions, refs: ["Lev 10:12", "Lev 10:13", "Lev 10:14", "Lev 10:15"]}
      - {motif: moses-angry-goat-burned-not-eaten, refs: ["Lev 10:16", "Lev 10:17", "Lev 10:18"], note: "דָּרֹשׁ דָּרַשׁ - Masoretic midpoint of the Torah's words"}
      - {motif: aaron-mourning-excuses-not-eating, refs: ["Lev 10:19", "Lev 10:20"], note: "Moses accepts Aaron's reply"}
    hints:
      - "Rabbinic tradition links 10:9 to the brothers' drunkenness (Lev. Rab. 12). Compare Num 16:35 (Korah's 250 burned) and Greek stories of illicit fire (Prometheus)."
  - id: hb-lev-11-dietary-laws
    tradition: judaism
    title: Clean and unclean animals; carcass impurity
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Lev 11:1-47"]
    tags:
      - {motif: clean-unclean-animals-list, refs: ["Lev 11:3"]}
      - {motif: camel-forbidden, refs: ["Lev 11:4"]}
      - {motif: hyrax-and-hare-chew-cud, refs: ["Lev 11:5", "Lev 11:6"], note: "Hyrax (שָׁפָן) and hare called cud-chewers"}
      - {motif: pork-forbidden, refs: ["Lev 11:7", "Lev 11:8"]}
      - {motif: fins-and-scales-rule, refs: ["Lev 11:9", "Lev 11:10", "Lev 11:11", "Lev 11:12"]}
      - {motif: unclean-birds-list, refs: ["Lev 11:13", "Lev 11:14", "Lev 11:15", "Lev 11:16", "Lev 11:17", "Lev 11:18", "Lev 11:19"], note: "Includes eagle/vulture, raven, ostrich, owls, stork, hoopoe (דּוּכִיפַת) and bat"}
      - {motif: hoopoe-named, refs: ["Lev 11:19"]}
      - {motif: locusts-permitted, refs: ["Lev 11:21", "Lev 11:22"], note: "Four kinds of jumping locust"}
      - {motif: carcass-impurity-until-evening, refs: ["Lev 11:24", "Lev 11:25", "Lev 11:27", "Lev 11:28", "Lev 11:39", "Lev 11:40"]}
      - {motif: eight-unclean-swarming-creatures, refs: ["Lev 11:29", "Lev 11:30", "Lev 11:31"], note: "Mole/weasel, mouse, lizards, chameleon"}
      - {motif: earthenware-vessel-broken-when-defiled, refs: ["Lev 11:33", "Lev 11:35"]}
      - {motif: moisture-makes-food-susceptible, refs: ["Lev 11:34", "Lev 11:37", "Lev 11:38"]}
      - {motif: spring-and-cistern-remain-pure, refs: ["Lev 11:36"]}
      - {motif: creatures-on-belly-forbidden, refs: ["Lev 11:41", "Lev 11:42"], note: "הוֹלֵךְ עַל גָּחוֹן; the Masoretic middle letter of the Torah falls here"}
      - {motif: be-holy-for-i-am-holy, refs: ["Lev 11:44", "Lev 11:45"]}
    hints:
      - "Compare Deut 14; Quran 2:173, 5:3, 6:145 (pig, carrion); Acts 10 (Peter's vision); Zoroastrian classifications of noxious creatures (khrafstra); the hoopoe in Quran 27:20."
  - id: hb-lev-12-childbirth-impurity
    tradition: judaism
    title: Impurity after childbirth
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Lev 12:1-8"]
    tags:
      - {motif: childbirth-impurity-double-for-daughter, refs: ["Lev 12:2", "Lev 12:4", "Lev 12:5"], note: "Son: 7 + 33 days; daughter: 14 + 66 days"}
      - {motif: circumcision-eighth-day, refs: ["Lev 12:3"]}
      - {motif: mother-barred-from-sanctuary-after-birth, refs: ["Lev 12:4"]}
      - {motif: purification-offering-after-childbirth, refs: ["Lev 12:6", "Lev 12:7"]}
      - {motif: poor-substitute-two-birds, refs: ["Lev 12:8"], note: "Two turtledoves or two young pigeons"}
    hints:
      - "Luke 2:22-24 cites 12:8 for Mary's offering; compare Zoroastrian and Hindu (sutaka) postpartum impurity periods; Islamic nifas (40 days)."
  - id: hb-lev-13-skin-disease
    tradition: judaism
    title: Diagnosis of tsara'at in skin, scalp and fabric
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Lev 13:1-59"]
    tags:
      - {motif: priest-diagnoses-skin-disease, refs: ["Lev 13:2", "Lev 13:3"]}
      - {motif: white-hair-sign-of-disease, refs: ["Lev 13:3", "Lev 13:10", "Lev 13:20", "Lev 13:25"]}
      - {motif: seven-day-quarantine, refs: ["Lev 13:4", "Lev 13:5", "Lev 13:21", "Lev 13:26", "Lev 13:31", "Lev 13:33", "Lev 13:50", "Lev 13:54"]}
      - {motif: raw-flesh-sign-of-disease, refs: ["Lev 13:10", "Lev 13:14", "Lev 13:15"]}
      - {motif: wholly-white-is-clean, refs: ["Lev 13:12", "Lev 13:13"], note: "Paradox: disease covering whole body from head to foot renders him clean"}
      - {motif: boil-and-burn-scar-cases, refs: ["Lev 13:18", "Lev 13:19", "Lev 13:23", "Lev 13:24", "Lev 13:28"]}
      - {motif: scalp-or-beard-scall, refs: ["Lev 13:29", "Lev 13:30", "Lev 13:37"], note: "Thin yellow hair unclean; black hair growing means healed"}
      - {motif: baldness-is-clean, refs: ["Lev 13:40", "Lev 13:41"]}
      - {motif: leper-torn-clothes-cry-unclean, refs: ["Lev 13:45"], note: "Torn garments, loose hair, covers upper lip, cries טָמֵא טָמֵא"}
      - {motif: leper-dwells-alone-outside-camp, refs: ["Lev 13:46"]}
      - {motif: mold-in-garments, refs: ["Lev 13:47", "Lev 13:48", "Lev 13:49", "Lev 13:51", "Lev 13:52", "Lev 13:55", "Lev 13:57"], note: "Greenish or reddish; spreading ('malignant', מַמְאֶרֶת) item burned"}
    hints:
      - "Compare Num 12 (Miriam), 2Kgs 5 (Naaman), 2Chr 26:19-21 (Uzziah); Mark 1:40-44 ('show yourself to the priest'); Quran 3:49 and 5:110 (Jesus heals the leper, al-abras)."
  - id: hb-lev-14-leper-purification-house-mold
    tradition: judaism
    title: Purification of the healed leper; plague in houses
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Lev 14:1-57"]
    tags:
      - {motif: priest-goes-outside-camp-to-inspect, refs: ["Lev 14:3"]}
      - {motif: two-birds-one-killed-one-released, refs: ["Lev 14:4", "Lev 14:5", "Lev 14:6", "Lev 14:7", "Lev 14:49", "Lev 14:50", "Lev 14:51", "Lev 14:52", "Lev 14:53"], note: "Live bird dipped in blood of slain bird and sent off over the open field"}
      - {motif: cedar-hyssop-scarlet, refs: ["Lev 14:4", "Lev 14:6", "Lev 14:49", "Lev 14:51"]}
      - {motif: blood-over-living-water-in-earthen-vessel, refs: ["Lev 14:5", "Lev 14:50"], note: "מַיִם חַיִּים"}
      - {motif: sevenfold-sprinkling, refs: ["Lev 14:7", "Lev 14:16", "Lev 14:27", "Lev 14:51"]}
      - {motif: shaving-all-hair-for-purification, refs: ["Lev 14:8", "Lev 14:9"], note: "Head, beard, eyebrows, all hair"}
      - {motif: blood-on-right-ear-thumb-toe, refs: ["Lev 14:14", "Lev 14:17", "Lev 14:25", "Lev 14:28"], note: "Same as priestly ordination rite; oil placed over the blood"}
      - {motif: oil-poured-on-head, refs: ["Lev 14:18", "Lev 14:29"]}
      - {motif: poor-substitute-two-birds, refs: ["Lev 14:21", "Lev 14:22", "Lev 14:30", "Lev 14:31", "Lev 14:32"]}
      - {motif: god-sends-plague-on-houses, refs: ["Lev 14:34"], note: "וְנָתַתִּי נֶגַע צָרַעַת - God himself puts the mark in houses in Canaan"}
      - {motif: house-emptied-before-inspection, refs: ["Lev 14:36"]}
      - {motif: infected-stones-removed-to-unclean-place, refs: ["Lev 14:40", "Lev 14:41", "Lev 14:42", "Lev 14:45"]}
      - {motif: house-demolished-if-plague-returns, refs: ["Lev 14:43", "Lev 14:44", "Lev 14:45"]}
