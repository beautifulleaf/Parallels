  brothers-wife-forbidden: {label: "Marrying or lying with a brother's wife is forbidden", cluster: law}
  burning-penalty: {label: "Offender executed by burning", cluster: law}
  calf-sin-offering-for-high-priest: {label: "High priest's own sin offering is a calf", cluster: cult}
  camel-forbidden: {label: "The camel is unclean because it does not have a split hoof", cluster: dietary}
