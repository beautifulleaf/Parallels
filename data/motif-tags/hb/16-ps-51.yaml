new_motifs:
  psalm-historical-superscription: {label: "Psalm heading ties the poem to a specific episode in David's life", cluster: psalmody}
  psalm-tune-heading: {label: "Psalm heading names a tune or melody to which it is sung (e.g. 'Do not destroy', 'Dove of distant terebinths', 'Lilies')", cluster: psalmody}
  individual-lament: {label: "Individual lament: a sufferer complains of enemies or distress, petitions God and vows praise", cluster: psalmody}
  communal-lament: {label: "Communal lament over national disaster, asking why God has rejected his people", cluster: psalmody}
  penitential-confession: {label: "Speaker confesses personal sin and pleads for forgiveness and cleansing", cluster: psalmody}
  purge-with-hyssop-whiter-than-snow: {label: "Petitioner asks to be purged with hyssop and washed whiter than snow", cluster: cult}
  conceived-in-sin: {label: "Speaker says he was born in iniquity and conceived by his mother in sin", cluster: theology}
  create-a-clean-heart: {label: "Prayer that God create a pure heart and renew a steadfast spirit within", cluster: theology}
  holy-spirit-of-god: {label: "God's 'holy spirit' (ruah qodesh) is asked not to be taken away from a person", cluster: theology}
  contrite-heart-over-sacrifice: {label: "God desires a broken spirit, thanksgiving or obedience rather than animal sacrifice", cluster: cult}
  open-my-lips-prayer: {label: "Prayer 'Lord, open my lips and my mouth will declare your praise'", cluster: liturgy}
  rebuild-walls-of-jerusalem-prayer: {label: "Prayer that God rebuild the walls of Jerusalem/Zion", cluster: zion}
  tongue-as-sharp-weapon: {label: "Enemies' tongues are razors, swords or arrows; their teeth spears", cluster: wisdom}
  righteous-like-green-olive-tree: {label: "The righteous likened to a flourishing tree (olive, palm, cedar) in or by God's house", cluster: wisdom}
  wicked-uprooted-from-land-of-living: {label: "God will uproot the wicked from the land of the living", cluster: wisdom}
  fool-says-no-god: {label: "The fool says in his heart 'There is no God'", cluster: wisdom}
  god-looks-down-on-humankind: {label: "God looks down from heaven on humankind to see if any seek him, and finds none good", cluster: theology}
  universal-corruption-none-good: {label: "All have turned aside; there is none who does good, not even one", cluster: theology}
  duplicate-psalm: {label: "A psalm or section duplicates another psalm with variations (often divine-name change)", cluster: psalmody}
  wings-of-a-dove-to-flee: {label: "Wish for wings like a dove to fly away and rest in the wilderness", cluster: psalmody}
  betrayal-by-intimate-friend: {label: "Speaker betrayed not by an enemy but by an intimate companion with whom he shared counsel in God's house", cluster: psalmody}
  enemies-go-down-to-sheol-alive: {label: "Wish that the enemies go down alive into Sheol", cluster: afterlife}
  prayer-three-times-daily: {label: "Prayer at evening, morning and noon (three fixed times a day)", cluster: liturgy}
  cast-burden-on-god: {label: "Cast your burden on YHWH and he will sustain you", cluster: wisdom}
  words-smoother-than-oil: {label: "Enemy's words are smoother than butter or oil but are drawn swords", cluster: wisdom}
  bloodthirsty-not-live-half-their-days: {label: "Men of blood and deceit will not live out half their days", cluster: wisdom}
  pit-of-destruction: {label: "The wicked are brought down to the pit (be'er shahat / bor), the underworld", cluster: afterlife}
  vow-of-thanksgiving-paid: {label: "Delivered petitioner pays vows and offers thanksgiving sacrifices", cluster: cult}
  tears-in-gods-bottle: {label: "God counts the sufferer's wanderings and keeps his tears in his flask and book", cluster: theology}
  what-can-flesh-do-to-me: {label: "Refrain of trust: 'In God I trust; I will not fear; what can flesh/man do to me?'", cluster: psalmody}
  walk-in-light-of-life: {label: "Delivered from death to walk before God in the light of life (or of the living)", cluster: afterlife}
  refuge-in-shadow-of-wings: {label: "Petitioner takes refuge in the shadow of God's wings", cluster: theology}
  lying-among-lions: {label: "Speaker lies down among lions, i.e. ravenous enemies", cluster: psalmody}
  trapper-falls-into-own-pit: {label: "Those who dig a pit or spread a net for the righteous fall into it themselves", cluster: wisdom}
  awake-the-dawn: {label: "Singer rouses harp and lyre to awaken the dawn (shahar)", cluster: cosmology}
  exalted-above-the-heavens-refrain: {label: "Refrain: 'Be exalted above the heavens, O God; your glory over all the earth'", cluster: psalmody}
  gods-as-unjust-judges: {label: "Divine beings or rulers (elim/elohim) are rebuked for judging unjustly", cluster: divine-council}
  wicked-estranged-from-womb: {label: "The wicked go astray from the womb, speaking lies from birth", cluster: theology}
  deaf-adder-and-charmer: {label: "Wicked compared to a deaf adder that stops its ear against the snake-charmer's spells", cluster: magic}
  break-teeth-of-lions: {label: "Prayer that God break the teeth in the mouths of the young lions (enemies)", cluster: psalmody}
  wicked-melt-like-snail-stillborn: {label: "Curse that the wicked dissolve like a snail or be like a stillborn that never sees the sun", cluster: psalmody}
  righteous-bathe-feet-in-blood: {label: "The righteous will bathe their feet in the blood of the wicked when vengeance comes", cluster: psalmody}
  imprecation-on-enemies: {label: "Speaker calls down curses on his enemies", cluster: psalmody}
  enemies-like-howling-dogs: {label: "Enemies prowl around the city at evening howling like dogs", cluster: psalmody}
  god-laughs-at-enemies: {label: "God laughs and mocks the nations or the wicked", cluster: theology}
  cup-of-wrath: {label: "God makes his people or the wicked drink a cup of wine causing reeling (cup of wrath)", cluster: judgment}
  divine-oracle-in-psalm: {label: "A psalm quotes a first-person oracle of God", cluster: prophecy}
  sandal-cast-over-land: {label: "God casts his sandal on Edom, a gesture of taking possession; Moab is his washbasin", cluster: law}
  vain-is-help-of-man: {label: "The help of man is worthless; only God gives victory", cluster: wisdom}
  god-does-not-go-out-with-armies: {label: "Complaint that God has rejected his people and no longer goes out with their armies", cluster: warfare}
  call-from-ends-of-earth: {label: "Petitioner calls to God from the end of the earth", cluster: psalmody}
  god-as-rock-and-fortress: {label: "God called rock, fortress, refuge, stronghold or tower of strength", cluster: theology}
  dwell-in-gods-tent-forever: {label: "Wish to dwell in God's tent or house forever", cluster: cult}
  prayer-for-kings-long-life: {label: "Prayer that the king's days be prolonged for generations and he be enthroned forever before God", cluster: kingship}
  psalm-guild-heading: {label: "Heading assigns the psalm to a Levitical singer or guild (Jeduthun, Asaph, sons of Korah, Heman, Ethan)", cluster: psalmody}
  silence-before-god: {label: "The soul waits in silence (dumiyyah) for God; silence is praise", cluster: theology}
  humans-lighter-than-breath-on-scales: {label: "Humans are a breath (hevel); weighed on the scales they rise up, lighter than vapor", cluster: wisdom}
  numerical-saying-one-two: {label: "Graded numerical saying ('One thing God spoke, two things I heard'; 'three, yes four')", cluster: wisdom}
  god-repays-according-to-deeds: {label: "God repays each person according to his deeds", cluster: judgment}
  thirst-for-god-in-dry-land: {label: "The soul thirsts for God like a dry, weary land without water", cluster: psalmody}
  meditate-in-night-watches: {label: "Speaker remembers and meditates on God on his bed through the night watches", cluster: liturgy}
  lifting-hands-in-prayer: {label: "Lifting the hands (palms) in prayer or blessing", cluster: liturgy}
  enemies-to-depths-of-earth: {label: "Enemies will descend to the lowest parts of the earth (tahtiyyot ha-arets)", cluster: afterlife}
  corpses-for-jackals: {label: "Slain enemies become a portion for jackals or food for beasts and birds", cluster: warfare}
  plotters-think-none-sees: {label: "The wicked plot in secret saying 'Who will see us?'", cluster: wisdom}
  all-flesh-comes-to-god: {label: "All flesh, or all nations, come to God to pray or worship", cluster: universalism}
  god-stills-roaring-seas-and-peoples: {label: "God stills the roaring of the seas and the tumult of the peoples", cluster: cosmology}
  god-girded-with-might: {label: "God is girded or clothed with strength and majesty", cluster: theology}
  river-of-god-full-of-water: {label: "The 'channel of God' (peleg elohim) is full of water to water the earth", cluster: cosmology}
  god-gives-rain-and-harvest: {label: "God visits the earth with rain, softens it with showers, and crowns the year with harvest", cluster: fertility}
  gods-tracks-drip-fatness: {label: "God's wagon-tracks or paths drip with fatness (abundance) as he passes", cluster: fertility}
  nature-sings-and-rejoices: {label: "Hills, meadows, valleys, sea, rivers or trees rejoice, clap or sing before God", cluster: cosmology}
  all-earth-summoned-to-praise: {label: "All the earth or all peoples are summoned to shout and sing to God", cluster: universalism}
  sea-turned-to-dry-land: {label: "God turned the sea into dry land and they crossed the river on foot", cluster: exodus}
  tested-like-refined-silver: {label: "God tests his people as silver is refined in the crucible", cluster: theology}
  through-fire-and-water: {label: "The people passed through fire and water and were brought out to abundance", cluster: theology}
  iniquity-in-heart-blocks-prayer: {label: "If one cherishes iniquity in his heart, God will not hear his prayer", cluster: theology}
  come-and-see-gods-works: {label: "Invitation 'Come and see the works of God' / 'Come and hear, I will tell'", cluster: psalmody}
  nations-praise-god-refrain: {label: "Refrain calling on all peoples to praise God ('Let the peoples praise you, all of them')", cluster: universalism}
  earth-yields-its-produce: {label: "The earth has yielded its produce as a sign of God's blessing", cluster: fertility}
  wicked-melt-like-wax-before-fire: {label: "Wicked or mountains melt like wax before God / disperse like smoke", cluster: theophany}
  father-of-orphans-judge-of-widows: {label: "God is father of orphans and defender of widows, who sets the lonely in a home and frees prisoners", cluster: justice}
  women-heralds-of-victory: {label: "A great host of women heralds (mevasserot) announces the victory and women divide the spoil", cluster: warfare}
  silver-winged-dove: {label: "A dove's wings covered with silver and its pinions with yellow-green gold", cluster: imagery}
  snow-on-zalmon: {label: "When Shaddai scattered kings, it snowed on Zalmon", cluster: theophany}
  rival-mountains-envy-gods-mountain: {label: "Many-peaked mountains (Bashan) look with envy at the mountain God chose for his dwelling", cluster: cosmology}
  myriad-chariots-of-god: {label: "God's chariots are myriads, thousands upon thousands; the Lord among them as at Sinai", cluster: theophany}
  god-ascends-on-high-with-captives: {label: "God ascends on high leading captives and receiving gifts among men", cluster: theophany}
  god-crushes-head-of-enemies: {label: "God shatters the heads (hairy crowns) of his enemies", cluster: warfare}
  retrieval-from-bashan-and-sea-depths: {label: "God says he will bring back (enemies or people) from Bashan and from the depths of the sea", cluster: cosmology}
  dogs-lick-enemy-blood: {label: "Dogs lick the blood of the slain enemies (or of the wicked king)", cluster: warfare}
  festal-procession-to-sanctuary: {label: "Liturgical procession into the sanctuary with singers, musicians and maidens playing drums", cluster: cult}
  kings-bring-tribute-to-temple: {label: "Foreign kings bring gifts or tribute to God's temple in Jerusalem", cluster: universalism}
  beast-of-the-reeds-rebuked: {label: "God rebukes the beast of the reeds (Egypt as hippopotamus or crocodile) and the herd of bulls", cluster: cosmology}
  cush-stretches-hands-to-god: {label: "Envoys come from Egypt and Cush (Ethiopia) stretches out its hands to God", cluster: universalism}
  rider-of-ancient-heavens: {label: "God rides in the heaven of heavens of old and utters his mighty voice", cluster: cosmology}
  drowning-in-deep-waters: {label: "Sufferer sinks in deep mire and floodwaters up to the neck, the underworld deep", cluster: afterlife}
  hated-without-cause: {label: "Enemies hate the speaker without cause, more than the hairs of his head", cluster: psalmody}
  estranged-from-brothers: {label: "Sufferer has become a stranger to his brothers and an alien to his mother's sons", cluster: psalmody}
  zeal-for-gods-house: {label: "Zeal for God's house consumes the speaker", cluster: cult}
  mocked-in-sackcloth-and-fasting: {label: "Speaker fasts and wears sackcloth and becomes a byword and the song of drunkards", cluster: psalmody}
  well-shuts-its-mouth: {label: "Prayer that the pit (be'er) not close its mouth over the sufferer", cluster: afterlife}
  gall-and-vinegar-given: {label: "Enemies give the sufferer poison (rosh, gall) for food and vinegar to drink", cluster: passion}
  table-becomes-snare: {label: "Curse that the enemies' table become a trap and snare", cluster: psalmody}
  habitation-made-desolate: {label: "Curse that the enemy's encampment be desolate with no one dwelling in his tents", cluster: psalmody}
  cosmos-praises-god: {label: "Heaven, earth, seas and all that moves in them praise God", cluster: cosmology}
  mockers-say-aha: {label: "Mockers gloat 'Aha, aha!' (he'ah) over the sufferer", cluster: psalmody}
  make-haste-to-help: {label: "Urgent plea 'O God, hasten to help me; do not delay'", cluster: liturgy}
  trust-from-the-womb: {label: "Speaker has relied on God from the womb; God drew him from his mother's belly", cluster: theology}
  do-not-forsake-in-old-age: {label: "Prayer not to be cast off or forsaken in old age when strength fails", cluster: psalmody}
  raised-from-depths-of-earth: {label: "God will revive the speaker and bring him up again from the depths (tehomot) of the earth", cluster: afterlife}
  ideal-king-justice-for-poor: {label: "The ideal king judges the poor with righteousness, saves the needy and crushes the oppressor", cluster: kingship}
  king-endures-as-sun-and-moon: {label: "The king (or his name, dynasty, throne) will endure as long as the sun and moon", cluster: kingship}
  king-like-rain-on-mown-field: {label: "The king descends like rain on mown grass, showers watering the earth", cluster: kingship}
  dominion-sea-to-sea: {label: "The king's dominion extends from sea to sea and from the River to the ends of the earth", cluster: kingship}
  enemies-lick-dust: {label: "Enemies bow down and lick the dust before the king or God", cluster: kingship}
  kings-of-tarshish-and-sheba-bring-gifts: {label: "Kings of Tarshish, the islands, Sheba and Seba bring tribute and gold", cluster: kingship}
  name-yinnon-before-sun: {label: "The king's name will flourish (yinnon) as long as the sun; later read as a name of the Messiah", cluster: messianism}
  nations-blessed-in-the-king: {label: "All nations will bless themselves by the king and call him happy", cluster: kingship}
  book-closing-doxology: {label: "A doxology ('Blessed be YHWH ... Amen and amen') closes one of the five books of Psalms", cluster: psalmody}
  prayers-of-david-ended-colophon: {label: "Colophon: 'The prayers of David son of Jesse are ended'", cluster: psalmody}
  prosperity-of-the-wicked: {label: "Speaker is troubled by the prosperity and ease of the wicked (theodicy)", cluster: wisdom}
  wicked-die-without-pangs: {label: "The wicked have no pangs at death; their bodies are sound and fat", cluster: wisdom}
  mouth-against-heaven-tongue-on-earth: {label: "Arrogant set their mouths against heaven while their tongue struts through the earth", cluster: wisdom}
  does-god-know-question: {label: "The wicked ask 'How does God know? Is there knowledge in the Most High?'", cluster: theology}
  washing-hands-in-innocence: {label: "Speaker washes his hands in innocence as a sign of purity", cluster: cult}
  insight-gained-in-sanctuary: {label: "Speaker's perplexity is resolved only when he enters the sanctuary and perceives the end of the wicked", cluster: wisdom}
  wicked-vanish-like-a-dream: {label: "The wicked vanish like a dream on waking; God despises their image (tselem)", cluster: wisdom}
  god-takes-righteous-to-glory: {label: "God will take (laqah) the righteous afterward into glory, beyond death", cluster: afterlife}
  god-is-my-portion: {label: "God is the speaker's portion (heleq) forever, more than anything in heaven or earth", cluster: theology}
  temple-destroyed-by-enemies: {label: "Enemies roar in the sanctuary, hack its carved work with axes and burn it to the ground", cluster: zion}
  meeting-places-of-god-burned: {label: "Enemies burn all the meeting places (mo'adei El) of God in the land", cluster: cult}
  no-more-prophet: {label: "Complaint that there are no signs and no prophet anymore, none who knows how long", cluster: prophecy}
  how-long-o-god: {label: "Lament question 'How long, O God?' / 'Why have you rejected us forever?'", cluster: psalmody}
  god-king-from-of-old: {label: "God is king from of old (qedem), working salvation in the midst of the earth", cluster: kingship}
  sea-split-by-god-in-primordial-battle: {label: "God split or shattered the sea (Yam) by his might", cluster: cosmology}
  heads-of-tanninim-broken: {label: "God broke the heads of the sea dragons (tanninim) on the waters", cluster: cosmology}
  multi-headed-leviathan-crushed: {label: "God crushed the heads (plural) of Leviathan, the many-headed sea serpent", cluster: cosmology}
  leviathan-given-as-food: {label: "The slain Leviathan is given as food to the desert creatures or people", cluster: cosmology}
  springs-opened-rivers-dried: {label: "God split open springs and torrents and dried up ever-flowing rivers", cluster: cosmology}
  god-fixed-boundaries-of-earth-and-seasons: {label: "God fixed all the boundaries of the earth and formed summer and winter", cluster: creation}
  arise-o-god-plead-your-cause: {label: "Call 'Arise, O God, plead your own cause'", cluster: psalmody}
  dove-soul-to-wild-beast: {label: "Prayer not to hand the soul of God's turtledove to the wild beast", cluster: psalmody}
  god-sets-appointed-time-for-judgment: {label: "God declares 'When I seize the appointed time (mo'ed) I will judge with equity'", cluster: judgment}
  do-not-lift-up-horn: {label: "The arrogant are warned not to lift up their horn; God cuts off the horns of the wicked and exalts those of the righteous", cluster: kingship}
  god-humbles-one-exalts-another: {label: "God is judge: he puts down one and lifts up another", cluster: theology}
  zion-song: {label: "Song of Zion: God dwells in Zion/Salem and breaks the weapons of war there", cluster: zion}
  salem-as-jerusalem: {label: "Jerusalem called Salem (Shalem)", cluster: zion}
  god-breaks-weapons-of-war: {label: "God breaks bow, shield, sword and spear and ends war", cluster: warfare}
  enemy-army-falls-into-deathly-sleep: {label: "At God's rebuke the enemy warriors sleep their last sleep, horse and chariot stunned", cluster: warfare}
  sleepless-night-refusing-comfort: {label: "Sufferer lies awake at night with hands outstretched, refusing to be comforted", cluster: psalmody}
  has-god-forgotten-question: {label: "Speaker asks whether God has forgotten to be gracious or shut up his compassion forever", cluster: theology}
  waters-see-god-and-writhe: {label: "The waters saw God and writhed; the deeps trembled", cluster: cosmology}
  storm-theophany-arrows-thunder: {label: "God appears in storm: clouds pour, his arrows (lightning) fly, thunder rolls in the whirlwind", cluster: theophany}
  gods-footprints-unseen-in-sea: {label: "God's way was through the sea, his path in mighty waters, yet his footprints were not seen", cluster: exodus}
  people-led-like-flock-by-moses-aaron: {label: "God led his people like a flock by the hand of Moses and Aaron", cluster: exodus}
  remembering-deeds-of-old: {label: "Speaker recalls God's wonders of old (miqqedem) to find comfort", cluster: psalmody}
  historical-recital-psalm: {label: "Psalm retells Israel's sacred history (patriarchs, Egypt, wilderness, conquest) as instruction or praise", cluster: psalmody}
  parable-and-riddles-of-old: {label: "Speaker opens his mouth in a parable (mashal) and utters riddles (hidot) from of old", cluster: wisdom}
  tradition-handed-to-children: {label: "What the fathers told is to be passed on so that coming generations will tell their children", cluster: law}
  ephraimite-archers-turn-back: {label: "The sons of Ephraim, armed archers, turned back on the day of battle", cluster: warfare}
  field-of-zoan: {label: "The exodus wonders are located in 'the field of Zoan' (Tanis)", cluster: exodus}
  table-in-the-wilderness: {label: "The people ask 'Can God spread a table in the wilderness?'", cluster: exodus}
  doors-of-heaven-opened: {label: "God commanded the skies and opened the doors (or windows) of heaven", cluster: cosmology}
  bread-of-angels: {label: "Manna called 'bread of the mighty ones' (lehem abbirim), i.e. food of angels", cluster: exodus}
  humans-are-passing-wind: {label: "God remembers that humans are flesh, a breath that passes and does not return", cluster: wisdom}
  repentance-relapse-cycle: {label: "Cycle: God punishes, the people seek him and repent, then flatter him and sin again", cluster: history}
  band-of-destroying-angels: {label: "God sends a band (mishlahat) of 'evil angels' (mal'akhei ra'im) to execute his wrath", cluster: angelology}
  variant-plague-list: {label: "A poetic list of the Egyptian plagues differs in number and order from Exodus", cluster: exodus}
  egypt-called-ham: {label: "Egypt is called 'the tents of Ham' or 'the land of Ham'", cluster: exodus}
  shiloh-sanctuary-abandoned: {label: "God forsook his tabernacle at Shiloh, the tent where he dwelt among men", cluster: cult}
  maidens-without-wedding-song: {label: "In the catastrophe young men are consumed by fire, maidens have no wedding song, widows do not lament", cluster: lament}
  god-awakes-like-drunken-warrior: {label: "The Lord awakes as from sleep like a warrior shouting from wine", cluster: theology}
  enemies-struck-in-the-rear: {label: "God struck his enemies backward/in the rear (read by rabbis as the Philistines' hemorrhoids)", cluster: warfare}
  judah-chosen-over-ephraim: {label: "God rejected the tent of Joseph and tribe of Ephraim and chose Judah and Mount Zion", cluster: kingship}
  sanctuary-built-like-heavens: {label: "God built his sanctuary like the heights (or heavens) and like the earth founded forever", cluster: zion}
  shepherd-taken-from-sheepfolds-to-be-king: {label: "God took David from the sheepfolds, from following the nursing ewes, to shepherd his people", cluster: kingship}
  unburied-dead-of-jerusalem: {label: "Bodies of God's servants left as food for birds and beasts; blood poured like water around Jerusalem with none to bury", cluster: lament}
  pour-out-wrath-on-nations: {label: "Prayer 'Pour out your wrath on the nations that do not know you'", cluster: liturgy}
  where-is-their-god-taunt: {label: "Nations taunt 'Where is their God?'", cluster: psalmody}
  sins-of-ancestors-not-remembered: {label: "Prayer that God not remember against us the iniquities of former generations", cluster: theology}
  sheep-of-gods-pasture: {label: "Israel called the flock of God's pasture", cluster: theology}
  enthroned-on-cherubim: {label: "God is enthroned on (or above) the cherubim", cluster: cosmology}
  restore-us-refrain: {label: "Refrain 'Restore us, God of hosts; let your face shine, that we may be saved'", cluster: psalmody}
  bread-of-tears: {label: "God fed his people the bread of tears and gave them tears to drink by the measure", cluster: psalmody}
  israel-as-vine: {label: "Israel is a vine brought out of Egypt and planted, whose hedges God has broken down", cluster: imagery}
  boar-from-the-forest: {label: "The boar from the forest ravages God's vine", cluster: imagery}
  man-of-gods-right-hand: {label: "Prayer for 'the man of your right hand, the son of man you made strong'", cluster: messianism}
  shofar-at-new-and-full-moon: {label: "Blow the shofar at the new moon and at the full moon (keseh) on our feast day", cluster: cult}
  unknown-language-heard: {label: "Speaker hears 'a language I did not know' at the exodus", cluster: prophecy}
  burden-removed-from-shoulder: {label: "God removed the burden from Israel's shoulder and freed his hands from the basket", cluster: exodus}
  answered-from-secret-place-of-thunder: {label: "God answered from the hiding place of thunder", cluster: theophany}
  open-your-mouth-wide-i-will-fill: {label: "God says 'Open your mouth wide and I will fill it'", cluster: theology}
  given-over-to-stubborn-heart: {label: "God gives his disobedient people over to the stubbornness of their hearts", cluster: theology}
  if-only-my-people-would-listen: {label: "God laments 'O that my people would listen to me' and promises victory if they do", cluster: prophecy}
  honey-from-the-rock: {label: "God would feed his people the finest wheat and satisfy them with honey from the rock", cluster: fertility}
  divine-council: {label: "God stands or presides in the assembly of the gods (council of El, holy ones)", cluster: divine-council}
  gods-condemned-to-die-like-men: {label: "God sentences the gods (sons of Elyon) to die like mortals and fall like princes", cluster: divine-council}
  earth-foundations-shaken-by-injustice: {label: "Because of injustice all the foundations of the earth totter", cluster: cosmology}
  god-inherits-all-nations: {label: "God is called to arise and judge the earth, for he inherits all the nations", cluster: divine-council}
  do-not-keep-silent-o-god: {label: "Plea 'O God, do not keep silence; do not hold your peace'", cluster: psalmody}
  coalition-of-nations-against-israel: {label: "A list of named nations conspires to wipe out Israel's name", cluster: warfare}
  do-to-them-as-to-midian: {label: "Prayer that God do to the enemies as he did to Midian, Sisera and Jabin, Oreb and Zeeb, Zebah and Zalmunna", cluster: history}
  enemies-like-tumbleweed-and-chaff: {label: "Enemies made like whirling tumbleweed (galgal), chaff before the wind, forest in fire", cluster: psalmody}
  name-yhwh-alone-most-high: {label: "Nations will know that 'you alone, whose name is YHWH, are Most High over all the earth'", cluster: theology}
  longing-for-gods-courts: {label: "Soul longs and faints for the courts of YHWH, the living God", cluster: cult}
  birds-nest-at-altar: {label: "Sparrow and swallow find a nest for their young at God's altars", cluster: cult}
  valley-of-baca-made-springs: {label: "Pilgrims passing through the Valley of Baca (weeping/balsam) make it a place of springs", cluster: pilgrimage}
  pilgrimage-to-zion: {label: "Pilgrims go from strength to strength until each appears before God in Zion", cluster: pilgrimage}
  one-day-in-courts-better-than-thousand: {label: "A day in God's courts is better than a thousand elsewhere; better a doorkeeper than dwell in tents of wickedness", cluster: cult}
  god-as-sun-and-shield: {label: "YHWH God is called a sun (shemesh) and a shield", cluster: theology}
  restoration-of-fortunes: {label: "God restores the fortunes (shav shevut) of Jacob/Zion", cluster: restoration}
  virtues-meet-and-kiss: {label: "Personified virtues meet: steadfast love and truth meet, righteousness and peace kiss", cluster: personification}
  truth-sprouts-from-earth: {label: "Truth sprouts from the earth and righteousness looks down from heaven", cluster: personification}
  righteousness-goes-before-god: {label: "Righteousness walks before God as herald and prepares the way for his steps", cluster: personification}
  unite-my-heart: {label: "Prayer 'Unite my heart to fear your name'", cluster: theology}
  saved-from-lowest-sheol: {label: "God delivered the speaker's soul from the lowest Sheol (she'ol tahtiyyah)", cluster: afterlife}
  son-of-handmaid: {label: "Petitioner calls himself 'the son of your handmaid'", cluster: psalmody}
  sign-for-good-requested: {label: "Petitioner asks God for a sign of favor so his enemies may see and be ashamed", cluster: divination}
  zion-mother-of-nations: {label: "Zion is the birthplace of foreign peoples; of each nation it will be said 'this one was born there'", cluster: zion}
  rahab-as-egypt: {label: "Rahab, the primeval sea monster, used as a name for Egypt", cluster: cosmology}
  god-registers-peoples: {label: "God records the peoples in a register, noting where each was born", cluster: theology}
  zion-founded-on-holy-mountains: {label: "Zion's foundation is on the holy mountains; God loves its gates more than all Jacob's dwellings", cluster: zion}
  all-springs-in-zion: {label: "Singers and dancers declare 'All my springs are in you' (Zion as source of waters)", cluster: zion}
  near-death-lament: {label: "Speaker's life draws near Sheol; he is counted among those who go down to the pit", cluster: afterlife}
  free-among-the-dead: {label: "The dead are 'free' (hofshi) among the slain, forgotten by God and cut off from his hand", cluster: afterlife}
  dead-cannot-praise-god: {label: "The dead cannot praise God: no wonders for the dead, no hesed in the grave, no faithfulness in Abaddon", cluster: afterlife}
  rephaim-shades: {label: "The Rephaim, shades of the dead, in the underworld", cluster: afterlife}
  abaddon-place-of-destruction: {label: "Abaddon, 'destruction', as a name of the underworld", cluster: afterlife}
  land-of-forgetfulness: {label: "The underworld is darkness, the land of forgetfulness (erets neshiyyah)", cluster: afterlife}
  lament-without-resolution: {label: "Lament ends without any turn to praise or hope (darkness my only companion)", cluster: psalmody}
  friends-removed-by-god: {label: "God has removed the sufferer's friends and made him an abomination to them", cluster: psalmody}
  davidic-covenant-eternal-dynasty: {label: "God swears a covenant to David that his seed and throne will endure forever", cluster: kingship}
  assembly-of-holy-ones: {label: "God is feared in the council (sod) and assembly (qahal) of the holy ones; none among the sons of gods (bene elim) compares", cluster: divine-council}
  rahab-crushed: {label: "God crushed Rahab like a corpse and scattered his enemies", cluster: cosmology}
  zaphon-and-yamin-created: {label: "God created Zaphon (north) and Yamin (south); Tabor and Hermon sing his name", cluster: cosmology}
  justice-foundation-of-throne: {label: "Righteousness and justice are the foundation of God's throne; love and truth go before him", cluster: kingship}
  king-hand-set-on-sea-and-rivers: {label: "God sets the king's hand on the Sea and his right hand on the Rivers", cluster: kingship}
  king-calls-god-father: {label: "The king calls God 'my father' and God makes him firstborn, highest of the kings of earth", cluster: kingship}
  moon-as-faithful-witness: {label: "The dynasty will be established like the moon, a faithful witness in the sky", cluster: cosmology}
  sons-punished-with-rod-not-rejected: {label: "If the king's sons sin they will be punished with the rod, but God's love will not be withdrawn", cluster: kingship}
  rejected-anointed-lament: {label: "Lament that God has spurned his anointed, defiled his crown and cast his throne to the ground", cluster: kingship}
  none-escapes-sheol: {label: "What man can live and not see death, or deliver his soul from the hand of Sheol?", cluster: afterlife}
  brevity-of-life: {label: "Human life is short and fleeting (heled, a handbreadth, grass, a sigh)", cluster: wisdom}
  psalm-attributed-to-moses: {label: "A psalm is ascribed to Moses, 'the man of God'", cluster: psalmody}
  birth-of-mountains-and-earth: {label: "Before the mountains were born and the earth was brought forth in labor, God existed from everlasting", cluster: creation}
  god-returns-humans-to-dust: {label: "God turns mortals back to dust (dakka), saying 'Return, sons of Adam'", cluster: creation}
  thousand-years-as-one-day: {label: "A thousand years in God's sight are like yesterday when it passes, or a watch in the night", cluster: cosmology}
  humans-like-grass-withering: {label: "Humans are like grass that flourishes in the morning and withers by evening", cluster: wisdom}
  lifespan-seventy-or-eighty: {label: "The span of human life is seventy years, or eighty with strength", cluster: wisdom}
  teach-us-to-number-days: {label: "Prayer 'Teach us to number our days that we may gain a heart of wisdom'", cluster: wisdom}
  dwelling-in-shelter-of-most-high: {label: "One who dwells in the shelter of Elyon lodges in the shadow of Shaddai", cluster: theology}
  fowlers-snare: {label: "God delivers from the snare of the fowler", cluster: imagery}
  night-terror-and-noonday-demon: {label: "Protection from the terror of the night, the arrow by day, the pestilence (dever) stalking in darkness and Qeteb that ravages at noon", cluster: demonology}
  thousand-fall-at-your-side: {label: "A thousand fall at your side, ten thousand at your right, but it does not come near you", cluster: protection}
  angels-guard-and-bear-up: {label: "God commands his angels to guard the faithful and bear him on their palms lest he strike his foot on a stone", cluster: angelology}
  tread-on-lion-and-serpent: {label: "The protected one treads on lion and cobra, young lion and dragon (tannin)", cluster: protection}
  apotropaic-psalm: {label: "Psalm used as protection against demons and harm (later amulet and 'song of plagues')", cluster: magic}
  sabbath-song: {label: "Psalm designated for the Sabbath day", cluster: liturgy}
  ten-stringed-instrument: {label: "Praise on a ten-stringed instrument ('asor), harp and lyre", cluster: liturgy}
  wicked-sprout-like-grass-to-perish: {label: "The wicked sprout like grass only to be destroyed forever", cluster: wisdom}
  anointed-with-fresh-oil: {label: "Speaker anointed (or mixed) with fresh oil, horn exalted like the wild ox", cluster: kingship}
  righteous-fruitful-in-old-age: {label: "The righteous still bear fruit in old age, full of sap and green", cluster: wisdom}
  yhwh-malakh-enthronement: {label: "Enthronement acclamation 'YHWH reigns (YHWH malakh)', the world firmly established and unshakable", cluster: kingship}
  god-clothed-in-majesty: {label: "God is robed in majesty and girded with strength, or clothed in light, honor and splendor", cluster: theology}
  rivers-lift-up-their-voice: {label: "The floods (neharot) lift up their roaring, but YHWH on high is mightier than the breakers of the sea", cluster: cosmology}
  god-of-vengeance-shine-forth: {label: "Invocation 'God of vengeance, shine forth; rise up, judge of the earth'", cluster: judgment}
  oppression-of-widow-stranger-orphan: {label: "The wicked kill the widow, the stranger and the orphan", cluster: justice}
  maker-of-eye-and-ear-sees-and-hears: {label: "Argument: He who planted the ear, does he not hear? He who formed the eye, does he not see?", cluster: theology}
  blessed-is-the-chastened: {label: "Happy is the man whom God disciplines and teaches from his Torah", cluster: wisdom}
  dumah-land-of-silence: {label: "The underworld called Dumah, the land of silence", cluster: afterlife}
  great-king-above-all-gods: {label: "YHWH is a great God and great king above all gods", cluster: kingship}
  depths-and-peaks-in-gods-hand: {label: "The depths of the earth and the peaks of the mountains are in God's hand; the sea is his, for he made it", cluster: creation}
  today-if-you-hear-his-voice: {label: "Warning 'Today, if you hear his voice, do not harden your hearts as at Meribah and Massah'", cluster: exodus}
  oath-they-shall-not-enter-my-rest: {label: "God swore in anger that the wilderness generation would not enter his rest (menuhah)", cluster: exodus}
  new-song: {label: "Call to sing a new song to YHWH", cluster: liturgy}
  gods-of-nations-are-nothings: {label: "All the gods of the peoples are 'elilim' (nonentities), but YHWH made the heavens", cluster: theology}
  ascribe-glory-to-yhwh: {label: "Formula 'Ascribe (havu) to YHWH glory and strength', addressed to divine beings or the families of peoples", cluster: liturgy}
  god-comes-to-judge-earth: {label: "God comes to judge the earth with righteousness, and all creation rejoices", cluster: judgment}
  worship-in-holy-splendor: {label: "Bow down to YHWH in the splendor of holiness (hadrat qodesh)", cluster: cult}
  cloud-and-thick-darkness-around-god: {label: "Cloud and thick darkness ('arafel) surround the enthroned God; fire goes before him", cluster: theophany}
  all-gods-bow-to-yhwh: {label: "All gods bow down to YHWH; idol worshippers are put to shame", cluster: divine-council}
  light-sown-for-righteous: {label: "Light is sown for the righteous and joy for the upright in heart", cluster: theology}
  rivers-clap-hands: {label: "Rivers clap their hands and mountains sing together before YHWH", cluster: cosmology}
  shofar-and-trumpets-before-king: {label: "Trumpets and shofar sounded before the King YHWH", cluster: cult}
  holy-is-he-refrain: {label: "Threefold refrain 'Holy is he' (qadosh hu)", cluster: liturgy}
  bow-at-gods-footstool: {label: "Worship at God's footstool (hadom raglav) or holy mountain", cluster: cult}
  moses-aaron-samuel-intercessors: {label: "Moses, Aaron and Samuel named together as those who called on God and were answered", cluster: prophecy}
  god-forgiving-and-avenging: {label: "God was a forgiving God to them yet avenged their misdeeds", cluster: theology}
  enter-gates-with-thanksgiving: {label: "Enter his gates with thanksgiving and his courts with praise", cluster: cult}
  ketiv-qere-variant: {label: "A Masoretic written/read (ketiv/qere) variant changes the sense of a key phrase", cluster: textual}
  his-love-endures-forever: {label: "Refrain 'For YHWH is good; his steadfast love endures forever'", cluster: liturgy}
  kings-vow-of-integrity: {label: "The king vows to walk blamelessly, banish slanderers and the proud, and purge the wicked from God's city (mirror for princes)", cluster: kingship}
  prayer-of-the-afflicted-heading: {label: "Heading 'A prayer of the afflicted when he faints and pours out his complaint before YHWH'", cluster: psalmody}
  bones-burn-days-vanish-like-smoke: {label: "Sufferer's days vanish like smoke and his bones burn like a hearth", cluster: psalmody}
  lonely-bird-similes: {label: "Sufferer likened to a desert bird (qa'at), an owl of the ruins, a lonely bird on a roof", cluster: imagery}
  eating-ashes-as-bread: {label: "Mourner eats ashes like bread and mingles his drink with tears", cluster: lament}
  days-like-lengthening-shadow: {label: "Speaker's days are like a lengthening (evening) shadow", cluster: wisdom}
  servants-love-zions-stones: {label: "God's servants cherish Zion's stones and pity her dust; it is the appointed time to favor her", cluster: zion}
  written-for-generation-to-come: {label: "This is written for a later generation, a people yet to be created, to praise Yah", cluster: textual}
  god-looks-down-to-free-prisoners: {label: "God looks down from his holy height to hear the prisoner's groan and free those doomed to die", cluster: theology}
  heavens-wear-out-like-garment: {label: "Earth and heavens will perish and wear out like a garment, changed like clothing, but God remains the same", cluster: cosmology}
  do-not-take-me-midway: {label: "Prayer 'Do not take me away in the midst of my days'", cluster: psalmody}
  bless-yhwh-o-my-soul: {label: "Self-exhortation 'Bless YHWH, O my soul'", cluster: liturgy}
  youth-renewed-like-eagle: {label: "God renews one's youth like the eagle's", cluster: imagery}
  sins-removed-as-east-from-west: {label: "As far as east is from west, so far God removes our transgressions", cluster: theology}
  god-pities-like-father: {label: "As a father has compassion on his children, so God pities those who fear him", cluster: theology}
  god-remembers-we-are-dust: {label: "God knows our frame (yetser) and remembers that we are dust", cluster: creation}
  place-knows-him-no-more: {label: "When the wind passes over man he is gone and his place knows him no more", cluster: wisdom}
  angels-and-hosts-summoned-to-bless: {label: "God's angels, mighty ones who do his word, and all his hosts and ministers are summoned to bless him", cluster: angelology}
  creation-hymn: {label: "Hymn praising God as creator, describing the ordering of the cosmos and its creatures", cluster: creation}
  wrapped-in-light-as-garment: {label: "God wraps himself in light as in a garment", cluster: theology}
  heavens-stretched-like-tent: {label: "God stretches out the heavens like a tent curtain", cluster: creation}
  upper-chambers-on-waters: {label: "God lays the beams of his upper chambers on the (heavenly) waters and waters the mountains from them", cluster: cosmology}
  clouds-as-chariot-wings-of-wind: {label: "God makes the clouds his chariot and walks on the wings of the wind", cluster: cosmology}
  winds-as-angels-fire-as-ministers: {label: "God makes winds his messengers (angels) and flaming fire his ministers", cluster: angelology}
  waters-flee-at-gods-rebuke: {label: "At God's rebuke and thunder the primeval waters flee from the mountains to their appointed place", cluster: cosmology}
  boundary-set-for-sea: {label: "God sets a boundary the sea may not pass, so it will never again cover the earth", cluster: cosmology}
  creatures-each-given-habitat: {label: "Each creature has its God-given habitat: birds in cedars, stork in junipers, ibex in mountains, hyrax in rocks", cluster: creation}
  wine-oil-bread-gladden-man: {label: "God gives wine to gladden the heart of man, oil to make his face shine and bread to sustain him", cluster: creation}
  night-beasts-day-workers: {label: "At night the beasts of the forest prowl and lions roar for prey; at sunrise they withdraw and man goes out to work till evening", cluster: creation}
  creation-by-wisdom: {label: "God made all his works in wisdom", cluster: creation}
  leviathan-as-gods-plaything: {label: "Leviathan was formed to sport in the sea, or for God to play with", cluster: cosmology}
  ships-on-the-sea: {label: "Ships go to and fro on the great sea", cluster: creation}
  all-creatures-wait-for-food: {label: "All creatures look to God to give their food in due season; he opens his hand and they are satisfied", cluster: creation}
  breath-withdrawn-return-to-dust: {label: "When God takes away their breath creatures die and return to dust; when he sends his spirit they are created", cluster: creation}
  spirit-renews-face-of-earth: {label: "God sends forth his spirit and renews the face of the earth", cluster: creation}
  god-rejoices-in-his-works: {label: "God rejoices in his works", cluster: creation}
  god-touches-mountains-they-smoke: {label: "God looks at the earth and it trembles, touches the mountains and they smoke", cluster: theophany}
  hallelujah-formula: {label: "The cultic cry 'Hallelu-Yah' (praise Yah) closes or opens a psalm", cluster: liturgy}
  patriarchs-as-anointed-and-prophets: {label: "God calls the patriarchs his 'anointed ones' and 'prophets' and rebukes kings for their sake ('Touch not my anointed')", cluster: patriarchs}
  wandering-few-in-number: {label: "The ancestors were few in number, sojourners wandering from nation to nation", cluster: patriarchs}
  famine-summoned-staff-of-bread-broken: {label: "God summons famine on the land and breaks every staff of bread", cluster: judgment}
  joseph-sent-ahead: {label: "God sent a man ahead of them: Joseph, sold as a slave", cluster: joseph}
  joseph-feet-in-fetters: {label: "Joseph's feet were hurt in fetters and his neck (nefesh) put in iron until his word came true", cluster: joseph}
  joseph-teaches-elders-wisdom: {label: "Joseph was to bind the king's princes at will and teach his elders wisdom", cluster: joseph}
  god-turned-egyptians-hearts-to-hate: {label: "God turned the Egyptians' hearts to hate his people and deal craftily with them", cluster: exodus}
  egypt-glad-at-departure: {label: "Egypt rejoiced when Israel left, for dread of them had fallen on it", cluster: exodus}
  none-stumbled-among-tribes: {label: "At the exodus not one among the tribes stumbled (or was feeble)", cluster: exodus}
  rock-opened-river-in-desert: {label: "God opened the rock and waters gushed and ran as a river in the desert", cluster: exodus}
units:
  - id: hb-ps-51-miserere
    tradition: judaism
    title: Psalm 51, David's confession after Bathsheba (Miserere)
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Ps 51:1-21"]
    tags:
      - {motif: psalm-historical-superscription, refs: ["Ps 51:2"], note: "When Nathan the prophet came to him after he had gone in to Bathsheba"}
      - {motif: penitential-confession, refs: ["Ps 51:3-7", "Ps 51:11"]}
      - {motif: purge-with-hyssop-whiter-than-snow, refs: ["Ps 51:9"], note: "tehatte'eni be'ezov; mi-sheleg albin"}
      - {motif: conceived-in-sin, refs: ["Ps 51:7"], note: "be'avon holalti uvhet yehematni immi"}
      - {motif: create-a-clean-heart, refs: ["Ps 51:12"], note: "lev tahor bera li, with the creation verb bara"}
      - {motif: holy-spirit-of-god, refs: ["Ps 51:13"], note: "ruah qodshekha, one of only three HB occurrences (with Isa 63:10-11)"}
      - {motif: contrite-heart-over-sacrifice, refs: ["Ps 51:18-19"], note: "zivhei elohim ruah nishbarah"}
      - {motif: open-my-lips-prayer, refs: ["Ps 51:17"], note: "Adonai sefatai tiftah, later the preface of the Amidah"}
      - {motif: rebuild-walls-of-jerusalem-prayer, refs: ["Ps 51:20-21"], note: "Coda restores sacrifices once the walls are rebuilt, in tension with v.18"}
    hints:
      - "Ps 51 is the Christian Miserere; v.7 is a proof text for original sin (Augustine). Compare Mesopotamian penitential prayers (eršahunga) and the Egyptian negative confession inverted."
  - id: hb-ps-52-doeg
    tradition: judaism
    title: Psalm 52, against the mighty man of deceit (Doeg)
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Ps 52:1-11"]
    tags:
      - {motif: psalm-historical-superscription, refs: ["Ps 52:2"], note: "When Doeg the Edomite told Saul that David came to Ahimelech's house"}
      - {motif: tongue-as-sharp-weapon, refs: ["Ps 52:4"], note: "tongue like a whetted razor"}
      - {motif: wicked-uprooted-from-land-of-living, refs: ["Ps 52:7"]}
      - {motif: righteous-like-green-olive-tree, refs: ["Ps 52:10"], note: "ke-zayit ra'anan be-veit elohim"}
      - {motif: god-laughs-at-enemies, refs: ["Ps 52:8"], note: "here the righteous laugh at the fallen man"}
  - id: hb-ps-53-fool
    tradition: judaism
    title: Psalm 53, the fool says there is no God (Elohistic doublet of Ps 14)
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Ps 53:1-7"]
    tags:
      - {motif: psalm-tune-heading, refs: ["Ps 53:1"], note: "al mahalat"}
      - {motif: fool-says-no-god, refs: ["Ps 53:2"]}
      - {motif: god-looks-down-on-humankind, refs: ["Ps 53:3"]}
      - {motif: universal-corruption-none-good, refs: ["Ps 53:4"]}
      - {motif: duplicate-psalm, refs: ["Ps 53:2-7"], note: "Ps 14 with Elohim for YHWH; v.6 differs (God scatters the bones of the besieger)"}
    hints:
      - "Quoted in Romans 3:10-12. Compare Quran 45:24 on those who deny resurrection and divine agency."
  - id: hb-ps-54-ziphites
    tradition: judaism
    title: Psalm 54, when the Ziphites betrayed David
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Ps 54:1-9"]
    tags:
      - {motif: psalm-historical-superscription, refs: ["Ps 54:2"], note: "the Ziphites told Saul David was hiding among them (1Sam 23:19)"}
      - {motif: individual-lament, refs: ["Ps 54:3-7"]}
      - {motif: name-theology-dwelling, refs: ["Ps 54:3", "Ps 54:8"], note: "Save me by your name; the name as agent of salvation"}
      - {motif: vow-of-thanksgiving-paid, refs: ["Ps 54:8"], note: "freewill sacrifice (nedavah)"}
  - id: hb-ps-55-dove-wings
    tradition: judaism
    title: Psalm 55, wings of a dove and the treacherous friend
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Ps 55:1-24"]
    tags:
      - {motif: individual-lament, refs: ["Ps 55:2-6"]}
      - {motif: wings-of-a-dove-to-flee, refs: ["Ps 55:7-9"], note: "mi yitten li ever ka-yonah"}
      - {motif: betrayal-by-intimate-friend, refs: ["Ps 55:13-15", "Ps 55:21-22"], note: "enosh ke-erki, allufi u-meyudda'i"}
      - {motif: confusion-of-tongues, refs: ["Ps 55:10"], note: "balla' palag leshonam, 'confuse, divide their tongue', with peleg/Babel overtones"}
      - {motif: enemies-go-down-to-sheol-alive, refs: ["Ps 55:16"], note: "yeredu she'ol hayyim, echoing Korah"}
      - {motif: prayer-three-times-daily, refs: ["Ps 55:18"], note: "erev va-voqer ve-tsohorayim"}
      - {motif: words-smoother-than-oil, refs: ["Ps 55:22"]}
      - {motif: cast-burden-on-god, refs: ["Ps 55:23"]}
      - {motif: pit-of-destruction, refs: ["Ps 55:24"], note: "be'er shahat"}
      - {motif: bloodthirsty-not-live-half-their-days, refs: ["Ps 55:24"]}
    hints:
      - "Three daily prayer times: Dan 6:11; rabbinic shaharit/minhah/arvit; contrast the five Islamic salat. 1 Pet 5:7 echoes v.23. Judas traditions read vv.13-15 of the betrayer."
  - id: hb-ps-56-tears-in-bottle
    tradition: judaism
    title: Psalm 56, when the Philistines seized David in Gath
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Ps 56:1-14"]
    tags:
      - {motif: psalm-tune-heading, refs: ["Ps 56:1"], note: "al yonat elem rehoqim, 'the dove of distant terebinths (or: silent dove of the far-off)'"}
      - {motif: psalm-historical-superscription, refs: ["Ps 56:1"], note: "when the Philistines seized him in Gath"}
      - {motif: tears-in-gods-bottle, refs: ["Ps 56:9"], note: "simah dim'ati be-nodekha, halo be-sifratekha"}
