# Full read, chunk 1: Gen 1 - Gen 33. Read from the Westminster Leningrad Codex.
new_motifs:
  creation-from-primeval-waters: {label: "Before creation there is a dark watery deep (tehom) out of which the world is formed", cluster: creation}
  divine-wind-over-waters: {label: "A divine wind or spirit hovers or moves over the primeval waters", cluster: creation}
  creation-by-word: {label: "Deity creates by spoken command (Let there be...)", cluster: creation}
  light-before-sun: {label: "Light exists before the sun and moon are made", cluster: creation}
  creation-by-separation: {label: "Creation proceeds by dividing (light/darkness, waters above/below)", cluster: creation}
  firmament-divides-waters: {label: "A solid firmament (raqia) separates upper waters from lower waters", cluster: cosmology}
  deity-names-creations: {label: "Deity gives names to the elements it creates (day, night, heaven, earth, seas)", cluster: creation}
  creation-in-six-days: {label: "Creation is completed in six days", cluster: creation}
  luminaries-rule-day-night: {label: "Sun and moon are set to rule day and night and mark signs and seasons", cluster: cosmology}
  sea-monsters-created: {label: "Great sea monsters (tanninim) are expressly created by God", cluster: creation}
  earth-brings-forth-life: {label: "The earth itself is commanded to bring forth plants or animals", cluster: creation}
  human-in-divine-image: {label: "Humanity made in the image or likeness of the deity", cluster: creation}
  divine-plural-speech: {label: "God speaks in the plural (us, our) as if to a divine council", cluster: cosmology}
  male-and-female-created-together: {label: "Humanity created male and female in one act", cluster: creation}
  human-dominion-over-animals: {label: "Humans given rule over animals", cluster: creation}
  be-fruitful-and-multiply: {label: "Divine blessing: be fruitful, multiply, fill the earth", cluster: creation}
  primeval-vegetarianism: {label: "Humans and animals originally given only plants as food", cluster: creation}
  divine-rest-seventh-day: {label: "Deity rests on the seventh day after creating, and sanctifies it", cluster: creation}
  human-formed-from-earth: {label: "First human shaped from dust, clay or soil", cluster: creation}
  breath-of-life-into-nostrils: {label: "Deity breathes the breath of life into the first human's nostrils", cluster: creation}
  pre-creation-no-rain-no-plants: {label: "Before creation there was no rain, plant or man to till the ground (when-not-yet opening)", cluster: creation}
  mist-or-spring-waters-earth: {label: "A mist or spring rises from the earth to water the ground", cluster: creation}
  garden-of-god-in-east: {label: "God plants a garden (Eden) in the east and places the first human there", cluster: paradise}
  tree-of-life: {label: "A tree whose fruit gives eternal life", cluster: paradise}
  tree-of-knowledge-forbidden: {label: "A tree of knowledge whose fruit is forbidden", cluster: paradise}
  four-rivers-of-paradise: {label: "A river from paradise divides into four named rivers", cluster: paradise}
  paradise-gold-and-gems: {label: "Land near paradise rich in gold and precious stones", cluster: paradise}
  human-tends-garden: {label: "The first human is put in the garden to work and guard it", cluster: paradise}
  death-penalty-for-eating: {label: "Eating the forbidden fruit is threatened with death", cluster: paradise}
  adam-names-animals: {label: "The first man names the animals", cluster: paradise}
  woman-from-rib: {label: "First woman made from the man's rib or side while he sleeps", cluster: creation}
  deep-sleep-sent-by-god: {label: "God casts a deep sleep (tardemah) on a man", cluster: revelation}
  marriage-one-flesh: {label: "Man leaves father and mother and cleaves to his wife; they become one flesh", cluster: law}
  primal-nakedness-without-shame: {label: "First couple naked and not ashamed", cluster: paradise}
  serpent-tempter: {label: "A cunning serpent persuades the woman to eat the forbidden fruit", cluster: paradise}
  woman-eats-first-gives-man: {label: "The woman eats first and gives the fruit to her husband", cluster: paradise}
  eyes-opened-nakedness-known: {label: "Eating opens their eyes and they know they are naked", cluster: paradise}
  fig-leaf-coverings: {label: "Fig leaves sewn into coverings", cluster: paradise}
  god-walks-in-garden: {label: "God heard walking in the garden in the breeze of the day", cluster: paradise}
  hiding-from-god: {label: "Sinner hides from God, who calls 'Where are you?'", cluster: paradise}
  blame-shifting: {label: "Each accused shifts blame to another (man to woman, woman to serpent)", cluster: paradise}
  serpent-cursed-to-crawl: {label: "Serpent cursed to crawl on its belly and eat dust", cluster: paradise}
  enmity-serpent-and-woman-seed: {label: "Enmity between the serpent's seed and the woman's seed: head bruised, heel struck", cluster: paradise}
  pain-in-childbirth-curse: {label: "Woman punished with pain in childbirth and subordination to husband", cluster: paradise}
  ground-cursed-toil: {label: "Ground cursed; man must eat by sweat of his brow among thorns and thistles", cluster: paradise}
  dust-to-dust: {label: "Human comes from dust and returns to dust", cluster: paradise}
  eve-mother-of-all-living: {label: "First woman named as mother of all living", cluster: creation}
  garments-of-skin: {label: "God makes garments of skin for the first couple", cluster: paradise}
  humans-become-like-gods: {label: "Humans gain divine knowledge and God fears they will also gain immortality", cluster: paradise}
  expulsion-from-paradise: {label: "First humans expelled from the garden", cluster: paradise}
  cherubim-guard-paradise: {label: "Cherubim and a flaming turning sword guard the way to the tree of life", cluster: paradise}
  first-birth-naming-speech: {label: "Mother names her child with a speech explaining the name", cluster: patriarchs}
  farmer-vs-shepherd-brothers: {label: "Rivalry between a farmer brother and a shepherd brother", cluster: primeval}
  offering-accepted-rejected: {label: "God accepts one brother's offering and rejects the other's", cluster: cult}
  firstlings-and-fat-offered: {label: "Firstborn animals and their fat offered to God", cluster: cult}
  sin-crouching-at-door: {label: "Sin personified as a beast crouching at the door, desiring the man", cluster: primeval}
  first-murder-fratricide: {label: "A brother kills his brother in the first murder", cluster: primeval}
  am-i-my-brothers-keeper: {label: "Murderer evades God's question about his brother's whereabouts", cluster: primeval}
  blood-cries-from-ground: {label: "Victim's blood cries out from the ground to God", cluster: primeval}
  earth-opens-mouth-to-receive-blood: {label: "The earth opens its mouth to receive spilled blood", cluster: primeval}
  murderer-condemned-to-wander: {label: "Murderer condemned to be a restless wanderer, the ground withholding its yield", cluster: primeval}
  mark-of-cain: {label: "God puts a protective sign on a murderer so no one kills him", cluster: primeval}
  sevenfold-vengeance: {label: "Vengeance multiplied sevenfold (or seventy-sevenfold)", cluster: primeval}
  land-of-nod-east-of-eden: {label: "Exile dwells in the land of Nod east of Eden", cluster: primeval}
  first-city-named-for-son: {label: "First city built and named after the founder's son", cluster: civilization}
  culture-heroes-inventors: {label: "Named ancestors are originators of crafts (herding, music, metalwork)", cluster: civilization}
  first-polygamy: {label: "First man to take two wives", cluster: primeval}
  song-of-lamech: {label: "Boast-song of Lamech to his wives about killing a man for wounding him", cluster: primeval}
  replacement-son-for-slain: {label: "A new son given in place of one who was killed", cluster: primeval}
  beginning-of-invoking-gods-name: {label: "In a named generation people begin to call on the name of the LORD", cluster: cult}
  ten-antediluvian-generations: {label: "Ten generations of long-lived patriarchs from the first man to the flood hero", cluster: primeval}
  antediluvian-longevity: {label: "Pre-flood ancestors live many centuries", cluster: primeval}
  son-in-fathers-image: {label: "Son begotten in the father's likeness and image, as man in God's", cluster: primeval}
  seventh-patriarch-taken-by-god: {label: "Seventh ancestor walks with God and is taken without dying", cluster: primeval}
  life-span-365: {label: "A lifespan of 365 years, a solar-year number", cluster: primeval}
  longest-lived-man: {label: "One ancestor is the longest-lived human (969 years)", cluster: primeval}
  name-meaning-comfort-from-curse: {label: "Child named as one who will bring relief from the cursed ground", cluster: primeval}
  sons-of-god-marry-human-women: {label: "Divine beings take human women as wives", cluster: primeval}
  giants-offspring-of-gods: {label: "Giants or heroes (Nephilim) born from divine-human unions", cluster: primeval}
  lifespan-limited-120: {label: "God limits human lifespan to 120 years", cluster: primeval}
  god-regrets-creating: {label: "God regrets having made humankind and is grieved in his heart", cluster: primeval}
  evil-inclination-of-heart: {label: "Every inclination (yetser) of the human heart is only evil", cluster: primeval}
  vessel-multiple-decks-door-window: {label: "Vessel has several decks, a side door and a roof opening or window", cluster: flood}
  clean-animals-by-sevens: {label: "Clean animals taken aboard by sevens, unclean by pairs", cluster: flood}
  forty-days-rain: {label: "Rain or flood lasts forty days and forty nights", cluster: flood}
  seven-day-wait-before-flood: {label: "Seven days pass between the warning or boarding and the onset of the flood", cluster: flood}
  god-shuts-the-door: {label: "God himself shuts the vessel's door behind the hero", cluster: flood}
  flood-dated-precisely: {label: "Flood events given exact calendar dates (year of hero's life, month, day)", cluster: flood}
  waters-cover-highest-mountains: {label: "Waters rise above the highest mountains (fifteen cubits)", cluster: flood}
  wind-abates-waters: {label: "God sends a wind (ruah) over the earth to make the waters subside", cluster: flood}
  raven-sent-first: {label: "A raven is sent out and does not return (goes to and fro)", cluster: flood}
  olive-leaf-sign: {label: "A dove returns with an olive leaf in its beak", cluster: flood}
  seasons-guaranteed: {label: "God guarantees seedtime and harvest, cold and heat, day and night will not cease", cluster: flood}
  meat-permitted-after-flood: {label: "Eating animals permitted to humans after the flood", cluster: law}
  blood-prohibition: {label: "Prohibition on eating flesh with its lifeblood", cluster: law}
  bloodshed-requires-bloodshed: {label: "Whoever sheds human blood, by man shall his blood be shed, because humans bear God's image", cluster: law}
  animals-accountable-for-blood: {label: "God requires the life of a human even from an animal that kills", cluster: law}
  covenant-with-all-life: {label: "God makes a covenant with humans and all living creatures", cluster: covenant}
  bow-in-cloud-reminds-god: {label: "God sees the bow in the cloud and remembers his covenant (the sign reminds the deity)", cluster: flood}
  first-vineyard-drunkenness: {label: "First planter of a vineyard becomes drunk", cluster: civilization}
  son-sees-fathers-nakedness: {label: "A son sees his father's nakedness and is cursed for it", cluster: primeval}
  sons-cover-father-walking-backward: {label: "Sons cover their father's nakedness walking backward with averted faces", cluster: primeval}
  curse-on-grandson-canaan: {label: "Curse falls on Canaan, son of the offender, to be a slave of slaves", cluster: primeval}
  three-sons-repopulate-world: {label: "Three sons of the flood hero repopulate the whole earth", cluster: primeval}
  table-of-nations: {label: "All nations listed as descendants of the three sons of the flood hero", cluster: primeval}
  seventy-nations: {label: "The world's nations number about seventy", cluster: primeval}
  nations-divided-by-language: {label: "Nations distinguished by land, language and clan", cluster: primeval}
  nimrod-mighty-hunter: {label: "Nimrod, first mighty man, a mighty hunter before the LORD", cluster: kingship}
  first-kingdom-babylon: {label: "First kingdom founded in Babel and Shinar", cluster: kingship}
  founding-of-nineveh: {label: "Founding of Nineveh and the Assyrian cities", cluster: kingship}
  philistines-from-caphtor: {label: "Philistines derived from Casluhim/Caphtorim (Crete)", cluster: primeval}
  earth-divided-in-pelegs-days: {label: "In the days of Peleg the earth was divided", cluster: primeval}
  one-original-language: {label: "All humanity once spoke one language", cluster: primeval}
  tower-reaching-heaven: {label: "Humans build a tower whose top reaches heaven", cluster: primeval}
  brick-and-bitumen-building: {label: "Building with baked bricks and bitumen instead of stone and mortar", cluster: civilization}
  make-a-name-for-ourselves: {label: "Builders seek to make a name for themselves and avoid dispersal", cluster: primeval}
  god-descends-to-see: {label: "God comes down to see what humans are doing", cluster: theophany}
  confusion-of-tongues: {label: "God confuses human language", cluster: primeval}
  dispersal-of-humanity: {label: "God scatters humanity over the earth", cluster: primeval}
  babel-etymology: {label: "Babel explained from balal, to confuse", cluster: etiology}
  post-flood-declining-lifespans: {label: "Lifespans decline generation by generation after the flood", cluster: primeval}
  son-dies-before-father: {label: "A son dies in his father's lifetime and presence", cluster: patriarchs}
  barren-matriarch: {label: "The patriarch's wife is barren", cluster: patriarchs}
  migration-from-ur-to-harran: {label: "Family migrates from Ur of the Chaldeans to Harran on the way to Canaan", cluster: patriarchs}
  divine-call-to-leave-homeland: {label: "God commands the hero to leave his land, kin and father's house for a land he will be shown", cluster: patriarchs}
  promise-of-great-nation: {label: "God promises to make the patriarch a great nation", cluster: covenant}
  all-nations-blessed-through-patriarch: {label: "All families of the earth will be blessed through the patriarch", cluster: covenant}
  promise-of-the-land: {label: "God promises the land to the patriarch's descendants", cluster: covenant}
  altar-at-theophany-site: {label: "Patriarch builds an altar where God appeared to him", cluster: cult}
  sacred-tree-sanctuary: {label: "Sacred oak or terebinth marks a sanctuary site (Moreh, Mamre)", cluster: cult}
  famine-forces-descent-to-egypt: {label: "Famine forces the family to go down to Egypt", cluster: patriarchs}
  wife-passed-off-as-sister: {label: "Patriarch passes off his beautiful wife as his sister in a foreign court", cluster: patriarchs}
  matriarch-taken-into-royal-house: {label: "The matriarch is taken into a foreign king's house", cluster: patriarchs}
  plagues-on-king-for-taking-wife: {label: "God strikes the king's house with plagues or affliction for taking the patriarch's wife", cluster: patriarchs}
  king-rebukes-patriarch: {label: "The foreign king rebukes the patriarch for the deception", cluster: patriarchs}
  patriarch-enriched-by-foreign-king: {label: "Patriarch leaves enriched with flocks, slaves and silver from the foreign king", cluster: patriarchs}
  herdsmen-quarrel-separation: {label: "Quarrel between herdsmen leads kinsmen to separate", cluster: patriarchs}
  jordan-plain-like-garden-of-god: {label: "The Jordan plain before Sodom's destruction was like the garden of the LORD", cluster: paradise}
  wicked-sodom: {label: "The men of Sodom are exceedingly wicked", cluster: judgment}
  seed-as-dust-stars-sand: {label: "Descendants promised to be as countless as the dust, stars or sand", cluster: covenant}
  walk-the-land-to-claim: {label: "Patriarch told to look in all directions and walk the land he is given", cluster: covenant}
  war-of-four-kings-against-five: {label: "Four eastern kings make war against five kings of the plain", cluster: war}
  primeval-giant-peoples: {label: "Ancient giant or Rephaite peoples (Rephaim, Zuzim, Emim, Horites) defeated", cluster: primeval}
  bitumen-pits: {label: "Valley full of bitumen pits into which fleeing kings fall", cluster: war}
  patriarch-rescues-kinsman: {label: "Patriarch pursues captors with a small force and rescues his kinsman", cluster: war}
  number-318: {label: "The patriarch's trained men number 318", cluster: war}
  priest-king-melchizedek: {label: "A priest-king of Salem brings bread and wine and blesses the patriarch", cluster: cult}
  el-elyon-creator: {label: "God Most High (El Elyon), creator/possessor of heaven and earth", cluster: cosmology}
  tithe-to-priest: {label: "A tenth of everything given to a priest", cluster: cult}
  refusal-of-spoils: {label: "Hero refuses to take spoils, not even a thread or sandal strap", cluster: war}
  oath-with-raised-hand: {label: "Oath sworn by raising the hand to God", cluster: law}
  fear-not-oracle: {label: "God addresses the hero with 'Fear not' in a vision", cluster: revelation}
  childless-heir-is-servant: {label: "Childless patriarch's household servant is to be his heir", cluster: patriarchs}
  count-the-stars: {label: "God takes the patriarch outside and tells him to count the stars", cluster: covenant}
  faith-reckoned-as-righteousness: {label: "Patriarch believes God and it is counted to him as righteousness", cluster: covenant}
  covenant-between-the-pieces: {label: "Covenant ritual: animals cut in halves and a divine presence passes between them", cluster: covenant}
  birds-of-prey-driven-from-sacrifice: {label: "Birds of prey descend on the sacrifice and the hero drives them away", cluster: cult}
  dread-and-darkness-in-vision: {label: "A great dark dread falls on the visionary at sunset", cluster: revelation}
  prophecy-of-400-years-bondage: {label: "Descendants foretold to be enslaved in a foreign land 400 years and leave with great wealth", cluster: exodus}
  smoking-furnace-and-torch: {label: "A smoking oven and flaming torch represent God's presence", cluster: theophany}
  iniquity-not-yet-full: {label: "A people's guilt must reach its full measure before judgment", cluster: judgment}
  borders-river-of-egypt-to-euphrates: {label: "Promised land stretches from the river of Egypt to the Euphrates", cluster: covenant}
  surrogate-slave-wife: {label: "Barren wife gives her slave-girl to her husband to bear children for her", cluster: patriarchs}
  pregnant-slave-despises-mistress: {label: "The pregnant slave-wife looks down on her barren mistress", cluster: patriarchs}
  slave-woman-flees-to-wilderness: {label: "Mistreated slave-woman flees or is sent into the wilderness", cluster: patriarchs}
  angel-at-wilderness-spring: {label: "An angel meets the outcast woman by a spring or well in the wilderness", cluster: revelation}
  annunciation-of-son-and-name: {label: "A divine messenger announces a son's birth and gives his name", cluster: birth}
  ishmael-wild-ass-of-a-man: {label: "Ishmael foretold to be a wild ass of a man, his hand against all", cluster: patriarchs}
  god-who-sees-me: {label: "Woman names God El Roi, 'God who sees', and the well Beer-lahai-roi", cluster: revelation}
  el-shaddai-revelation: {label: "God reveals himself by the name El Shaddai", cluster: revelation}
  name-change-by-god: {label: "God changes a person's name to mark a new destiny", cluster: covenant}
  kings-will-descend-from-patriarch: {label: "Kings promised to come from the patriarch or matriarch", cluster: covenant}
  circumcision-covenant-sign: {label: "Circumcision commanded as the sign of the covenant", cluster: covenant}
  circumcision-eighth-day: {label: "Circumcision on the eighth day after birth", cluster: law}
  uncircumcised-cut-off: {label: "Uncircumcised male is cut off from his people", cluster: law}
  patriarch-laughs-at-promise: {label: "Patriarch or matriarch laughs at the promise of a child in old age", cluster: birth}
  ishmael-twelve-princes: {label: "Ishmael promised to father twelve princes and a great nation", cluster: patriarchs}
  circumcision-at-age-thirteen: {label: "Ishmael circumcised at thirteen, Abraham at ninety-nine", cluster: law}
units:
  - id: hb-gen-1-creation-six-days
    tradition: judaism
    title: Creation in six days and the seventh-day rest
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Gen 1:1-2:3"]
    tags:
      - {motif: creation-from-primeval-waters, refs: ["Gen 1:2"], note: "tohu wa-bohu; darkness on the face of tehom"}
      - {motif: divine-wind-over-waters, refs: ["Gen 1:2"], note: "ruah elohim merahefet, 'hovering' like a bird"}
      - {motif: creation-by-word, refs: ["Gen 1:3", "Gen 1:6", "Gen 1:9", "Gen 1:11", "Gen 1:14", "Gen 1:20", "Gen 1:24"]}
      - {motif: light-before-sun, refs: ["Gen 1:3", "Gen 1:16"]}
      - {motif: creation-by-separation, refs: ["Gen 1:4", "Gen 1:7", "Gen 1:18"]}
      - {motif: firmament-divides-waters, refs: ["Gen 1:6", "Gen 1:7"]}
      - {motif: deity-names-creations, refs: ["Gen 1:5", "Gen 1:8", "Gen 1:10"]}
      - {motif: creation-in-six-days, refs: ["Gen 1:31", "Gen 2:1"]}
      - {motif: luminaries-rule-day-night, refs: ["Gen 1:14", "Gen 1:16", "Gen 1:18"], note: "sun and moon unnamed: 'the great light' and 'the small light'"}
      - {motif: sea-monsters-created, refs: ["Gen 1:21"], note: "only creatures named with bara apart from humans"}
      - {motif: earth-brings-forth-life, refs: ["Gen 1:11", "Gen 1:12", "Gen 1:24"]}
      - {motif: human-in-divine-image, refs: ["Gen 1:26", "Gen 1:27"]}
      - {motif: divine-plural-speech, refs: ["Gen 1:26"], note: "na'aseh adam be-tsalmenu"}
      - {motif: male-and-female-created-together, refs: ["Gen 1:27"]}
      - {motif: human-dominion-over-animals, refs: ["Gen 1:26", "Gen 1:28"]}
      - {motif: be-fruitful-and-multiply, refs: ["Gen 1:22", "Gen 1:28"]}
      - {motif: primeval-vegetarianism, refs: ["Gen 1:29", "Gen 1:30"]}
      - {motif: divine-rest-seventh-day, refs: ["Gen 2:2", "Gen 2:3"]}
    hints:
      - "Enuma Elish: Tiamat (cf. tehom), division of the waters with a heaven-half; Quran 21:30 heavens and earth were joined and split."
      - "Quran 50:38 'no weariness touched Us' answers divine rest; Quran 7:54 six days; 2:30 khalifa."
      - "Egyptian Memphite theology: creation by Ptah's word. Rabbinic: Gen R. 8 on 'let us make' as consulting angels."
  - id: hb-gen-2-eden-adam-woman
    tradition: judaism
    title: Second creation account, Eden, and the making of woman
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Gen 2:4-25"]
    tags:
      - {motif: pre-creation-no-rain-no-plants, refs: ["Gen 2:5"]}
      - {motif: mist-or-spring-waters-earth, refs: ["Gen 2:6"], note: "'ed, cf. Akkadian edû/id"}
      - {motif: human-formed-from-earth, refs: ["Gen 2:7"], note: "adam from adamah; animals also formed from the ground, Gen 2:19"}
      - {motif: breath-of-life-into-nostrils, refs: ["Gen 2:7"]}
      - {motif: garden-of-god-in-east, refs: ["Gen 2:8"]}
      - {motif: tree-of-life, refs: ["Gen 2:9"]}
      - {motif: tree-of-knowledge-forbidden, refs: ["Gen 2:9", "Gen 2:17"]}
      - {motif: four-rivers-of-paradise, refs: ["Gen 2:10", "Gen 2:11", "Gen 2:13", "Gen 2:14"], note: "Pishon, Gihon, Hiddekel (Tigris), Perat (Euphrates)"}
      - {motif: paradise-gold-and-gems, refs: ["Gen 2:11", "Gen 2:12"], note: "Havilah: gold, bdellium, shoham stone"}
      - {motif: human-tends-garden, refs: ["Gen 2:15"]}
      - {motif: death-penalty-for-eating, refs: ["Gen 2:17"], note: "'in the day you eat of it you shall surely die'"}
      - {motif: adam-names-animals, refs: ["Gen 2:19", "Gen 2:20"]}
      - {motif: woman-from-rib, refs: ["Gen 2:21", "Gen 2:22"], note: "God 'built' (wayyiven) the rib into a woman"}
      - {motif: deep-sleep-sent-by-god, refs: ["Gen 2:21"]}
      - {motif: marriage-one-flesh, refs: ["Gen 2:24"]}
      - {motif: primal-nakedness-without-shame, refs: ["Gen 2:25"]}
    hints:
      - "Atrahasis/Enki: humans from clay mixed with a god's blood; Quran 15:26-29 clay and spirit breathed in; Quran 2:31 Adam taught the names."
      - "Sumerian Dilmun / Enki and Ninhursag: the 'lady of the rib' (Nin-ti) pun; Quran 4:1 created from a single soul and its mate."
  - id: hb-gen-3-fall-expulsion
    tradition: judaism
    title: The serpent, the eating, the curses and the expulsion
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Gen 3:1-24"]
    tags:
      - {motif: serpent-tempter, refs: ["Gen 3:1", "Gen 3:4", "Gen 3:5"], note: "arum (cunning) puns on arummim (naked), 2:25"}
      - {motif: tree-of-knowledge-forbidden, refs: ["Gen 3:3"], note: "woman adds 'nor touch it'"}
      - {motif: woman-eats-first-gives-man, refs: ["Gen 3:6"]}
      - {motif: eyes-opened-nakedness-known, refs: ["Gen 3:7"]}
      - {motif: fig-leaf-coverings, refs: ["Gen 3:7"]}
