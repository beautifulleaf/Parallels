  resident-alien-buys-grave: {label: "Patriarch, a resident alien, negotiates publicly at the city gate to buy a burial plot", cluster: patriarchs}
  cave-of-machpelah: {label: "The cave of Machpelah at Hebron as the family tomb", cluster: patriarchs}
  price-400-shekels: {label: "A field bought for 400 shekels of silver", cluster: patriarchs}
  patriarch-called-prince-of-god: {label: "Locals call the patriarch a prince of God (nesi elohim)", cluster: patriarchs}
  oath-hand-under-thigh: {label: "Oath sworn by placing the hand under the thigh of the one demanding it", cluster: law}
  bride-sought-from-kin-not-locals: {label: "Father insists his son's wife come from his own kin, not the local women", cluster: patriarchs}
  servant-sent-to-find-bride: {label: "A trusted servant is sent abroad to find a bride for the master's son", cluster: patriarchs}
  meeting-at-the-well-betrothal: {label: "Future bride or groom met at a well, leading to betrothal", cluster: patriarchs}
  sign-test-by-prayer: {label: "Hero asks God for a specific sign to identify the right person (who will offer water)", cluster: revelation}
  angel-goes-before-messenger: {label: "God sends his angel ahead to guide the journey", cluster: revelation}
  bride-gifts-nose-ring-bracelets: {label: "Bride given a gold nose-ring and bracelets", cluster: patriarchs}
  bride-consents-to-go: {label: "The bride is asked and consents to go ('I will go')", cluster: patriarchs}
  blessing-thousands-of-myriads: {label: "Departing bride blessed to become thousands of myriads", cluster: patriarchs}
  bride-veils-on-seeing-groom: {label: "Bride covers herself with a veil on seeing the groom", cluster: patriarchs}
  meditation-in-the-field: {label: "Patriarch goes out to meditate (or pray) in the field at evening", cluster: cult}
  groom-comforted-after-mothers-death: {label: "Son brings bride into his dead mother's tent and is comforted", cluster: patriarchs}
  sons-of-concubines-sent-east: {label: "Sons of concubines given gifts and sent away east so the chosen heir inherits all", cluster: patriarchs}
  death-old-and-full-of-days: {label: "Patriarch dies in good old age, full of days, and is gathered to his people", cluster: patriarchs}
  rival-sons-bury-father-together: {label: "Estranged half-brothers together bury their father", cluster: patriarchs}
  ishmaelite-tribes-arabia: {label: "Ishmael's twelve sons as Arabian tribes (Nebaioth, Kedar, Dumah, Tema...)", cluster: patriarchs}
  husband-prays-for-barren-wife: {label: "Husband prays for his barren wife and she conceives", cluster: birth}
  twins-struggle-in-womb: {label: "Twins struggle with each other in the womb", cluster: birth}
  oracle-to-pregnant-mother: {label: "Mother inquires of God and receives an oracle about her unborn children", cluster: birth}
  elder-shall-serve-younger: {label: "Oracle or blessing that the elder will serve the younger", cluster: patriarchs}
  hairy-red-firstborn: {label: "Firstborn twin born red and hairy all over", cluster: birth}
  younger-twin-grasps-heel: {label: "Second twin born grasping his brother's heel", cluster: birth}
  hunter-vs-tent-dweller-brothers: {label: "Contrast of a hunter outdoor brother and a quiet tent-dwelling brother", cluster: patriarchs}
  parents-each-favor-a-son: {label: "Father favors one son, mother another", cluster: patriarchs}
  birthright-sold-for-stew: {label: "Hungry elder brother sells his birthright for a dish of red lentil stew", cluster: patriarchs}
  edom-named-from-red: {label: "Edom etymologized from the red (adom) stew", cluster: etiology}
  god-forbids-going-to-egypt: {label: "God forbids the patriarch to go down to Egypt in a famine", cluster: patriarchs}
  abraham-kept-laws: {label: "Abraham kept God's charge, commandments, statutes and laws (torot) before Sinai", cluster: law}
  king-sees-couple-through-window: {label: "King looking through a window sees the couple embracing and learns they are married", cluster: patriarchs}
  hundredfold-harvest: {label: "Patriarch reaps a hundredfold in one year", cluster: patriarchs}
  wells-stopped-by-enemies: {label: "Enemies stop up the patriarch's wells with earth out of envy", cluster: patriarchs}
  named-wells-of-contention: {label: "Successive wells named for strife (Esek, Sitnah) and finally room (Rehoboth)", cluster: etiology}
  esau-marries-hittite-wives: {label: "Esau marries Hittite women who grieve his parents", cluster: patriarchs}
  blind-father-deathbed-blessing: {label: "Aged, blind father prepares to give his deathbed blessing to the firstborn", cluster: patriarchs}
  blessing-after-meal-of-game: {label: "Father requests a favorite dish of game before blessing", cluster: patriarchs}
  mother-schemes-for-younger-son: {label: "Mother devises a ruse so her favorite younger son gets the blessing", cluster: patriarchs}
  disguise-with-goatskins: {label: "Smooth son disguises himself with goatskins and his brother's garments to deceive a blind father", cluster: patriarchs}
  voice-of-jacob-hands-of-esau: {label: "Blind father notes the voice is one son's but the hands are the other's", cluster: patriarchs}
  irrevocable-blessing: {label: "A spoken blessing, once given, cannot be retracted", cluster: patriarchs}
  blessing-of-dew-and-fatness: {label: "Blessing of the dew of heaven, fatness of the earth, grain and wine", cluster: patriarchs}
  cheated-brother-cries-out: {label: "The cheated brother cries a great and bitter cry and weeps for a blessing", cluster: patriarchs}
  live-by-the-sword-break-yoke: {label: "Elder son told he will live by the sword, serve his brother, then break his yoke", cluster: patriarchs}
  brother-plans-murder-after-fathers-death: {label: "Wronged brother plans to kill his brother once their father has died", cluster: patriarchs}
  hero-flees-to-maternal-uncle: {label: "Hero flees to his mother's brother in a foreign land", cluster: patriarchs}
  dream-ladder-to-heaven: {label: "Dream of a ladder or stairway reaching heaven with angels ascending and descending", cluster: revelation}
  stone-pillow: {label: "Hero sleeps with a stone under his head at a holy place", cluster: cult}
  house-of-god-gate-of-heaven: {label: "A place recognized as the house of God and gate of heaven", cluster: cosmology}
  anointed-standing-stone: {label: "A standing stone (matsevah) set up and anointed with oil", cluster: cult}
  place-renamed-bethel: {label: "Luz renamed Bethel, 'house of God'", cluster: etiology}
  conditional-vow-to-god: {label: "Hero vows that if God protects and provides for him, he will worship and tithe", cluster: cult}
  divine-promise-of-protection-on-journey: {label: "God promises to be with the traveler and bring him back", cluster: covenant}
units:
  - id: hb-gen-1-creation-six-days
    tradition: judaism
    title: Creation in six days and the seventh-day rest
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Gen 1:1-2:3"]
    tags:
      - {motif: creation-from-primeval-waters, refs: ["Gen 1:2"], note: "tohu wa-bohu; darkness on the face of tehom"}
      - {motif: divine-wind-over-waters, refs: ["Gen 1:2"], note: "ruah elohim merahefet, 'hovering' like a bird"}
      - {motif: creation-by-word, refs: ["Gen 1:3", "Gen 1:6", "Gen 1:9", "Gen 1:11", "Gen 1:14", "Gen 1:20", "Gen 1:24"]}
      - {motif: light-before-sun, refs: ["Gen 1:3", "Gen 1:16"]}
      - {motif: creation-by-separation, refs: ["Gen 1:4", "Gen 1:7", "Gen 1:18"]}
      - {motif: firmament-divides-waters, refs: ["Gen 1:6", "Gen 1:7"]}
      - {motif: deity-names-creations, refs: ["Gen 1:5", "Gen 1:8", "Gen 1:10"]}
      - {motif: creation-in-six-days, refs: ["Gen 1:31", "Gen 2:1"]}
      - {motif: luminaries-rule-day-night, refs: ["Gen 1:14", "Gen 1:16", "Gen 1:18"], note: "sun and moon unnamed: 'the great light' and 'the small light'"}
      - {motif: sea-monsters-created, refs: ["Gen 1:21"], note: "only creatures named with bara apart from humans"}
      - {motif: earth-brings-forth-life, refs: ["Gen 1:11", "Gen 1:12", "Gen 1:24"]}
      - {motif: human-in-divine-image, refs: ["Gen 1:26", "Gen 1:27"]}
      - {motif: divine-plural-speech, refs: ["Gen 1:26"], note: "na'aseh adam be-tsalmenu"}
      - {motif: male-and-female-created-together, refs: ["Gen 1:27"]}
      - {motif: human-dominion-over-animals, refs: ["Gen 1:26", "Gen 1:28"]}
      - {motif: be-fruitful-and-multiply, refs: ["Gen 1:22", "Gen 1:28"]}
      - {motif: primeval-vegetarianism, refs: ["Gen 1:29", "Gen 1:30"]}
      - {motif: divine-rest-seventh-day, refs: ["Gen 2:2", "Gen 2:3"]}
    hints:
      - "Enuma Elish: Tiamat (cf. tehom), division of the waters with a heaven-half; Quran 21:30 heavens and earth were joined and split."
      - "Quran 50:38 'no weariness touched Us' answers divine rest; Quran 7:54 six days; 2:30 khalifa."
      - "Egyptian Memphite theology: creation by Ptah's word. Rabbinic: Gen R. 8 on 'let us make' as consulting angels."
  - id: hb-gen-2-eden-adam-woman
    tradition: judaism
    title: Second creation account, Eden, and the making of woman
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Gen 2:4-25"]
    tags:
      - {motif: pre-creation-no-rain-no-plants, refs: ["Gen 2:5"]}
      - {motif: mist-or-spring-waters-earth, refs: ["Gen 2:6"], note: "'ed, cf. Akkadian edû/id"}
      - {motif: human-formed-from-earth, refs: ["Gen 2:7"], note: "adam from adamah; animals also formed from the ground, Gen 2:19"}
      - {motif: breath-of-life-into-nostrils, refs: ["Gen 2:7"]}
      - {motif: garden-of-god-in-east, refs: ["Gen 2:8"]}
      - {motif: tree-of-life, refs: ["Gen 2:9"]}
      - {motif: tree-of-knowledge-forbidden, refs: ["Gen 2:9", "Gen 2:17"]}
      - {motif: four-rivers-of-paradise, refs: ["Gen 2:10", "Gen 2:11", "Gen 2:13", "Gen 2:14"], note: "Pishon, Gihon, Hiddekel (Tigris), Perat (Euphrates)"}
      - {motif: paradise-gold-and-gems, refs: ["Gen 2:11", "Gen 2:12"], note: "Havilah: gold, bdellium, shoham stone"}
      - {motif: human-tends-garden, refs: ["Gen 2:15"]}
      - {motif: death-penalty-for-eating, refs: ["Gen 2:17"], note: "'in the day you eat of it you shall surely die'"}
      - {motif: adam-names-animals, refs: ["Gen 2:19", "Gen 2:20"]}
      - {motif: woman-from-rib, refs: ["Gen 2:21", "Gen 2:22"], note: "God 'built' (wayyiven) the rib into a woman"}
      - {motif: deep-sleep-sent-by-god, refs: ["Gen 2:21"]}
      - {motif: marriage-one-flesh, refs: ["Gen 2:24"]}
      - {motif: primal-nakedness-without-shame, refs: ["Gen 2:25"]}
    hints:
      - "Atrahasis/Enki: humans from clay mixed with a god's blood; Quran 15:26-29 clay and spirit breathed in; Quran 2:31 Adam taught the names."
      - "Sumerian Dilmun / Enki and Ninhursag: the 'lady of the rib' (Nin-ti) pun; Quran 4:1 created from a single soul and its mate."
  - id: hb-gen-3-fall-expulsion
    tradition: judaism
    title: The serpent, the eating, the curses and the expulsion
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Gen 3:1-24"]
    tags:
      - {motif: serpent-tempter, refs: ["Gen 3:1", "Gen 3:4", "Gen 3:5"], note: "arum (cunning) puns on arummim (naked), 2:25"}
      - {motif: tree-of-knowledge-forbidden, refs: ["Gen 3:3"], note: "woman adds 'nor touch it'"}
      - {motif: woman-eats-first-gives-man, refs: ["Gen 3:6"]}
      - {motif: eyes-opened-nakedness-known, refs: ["Gen 3:7"]}
      - {motif: fig-leaf-coverings, refs: ["Gen 3:7"]}
      - {motif: god-walks-in-garden, refs: ["Gen 3:8"]}
      - {motif: hiding-from-god, refs: ["Gen 3:8", "Gen 3:9", "Gen 3:10"]}
      - {motif: blame-shifting, refs: ["Gen 3:12", "Gen 3:13"]}
      - {motif: serpent-cursed-to-crawl, refs: ["Gen 3:14"]}
      - {motif: enmity-serpent-and-woman-seed, refs: ["Gen 3:15"]}
      - {motif: pain-in-childbirth-curse, refs: ["Gen 3:16"]}
      - {motif: ground-cursed-toil, refs: ["Gen 3:17", "Gen 3:18", "Gen 3:19"]}
      - {motif: dust-to-dust, refs: ["Gen 3:19"]}
      - {motif: eve-mother-of-all-living, refs: ["Gen 3:20"]}
      - {motif: garments-of-skin, refs: ["Gen 3:21"]}
      - {motif: humans-become-like-gods, refs: ["Gen 3:5", "Gen 3:22"]}
      - {motif: divine-plural-speech, refs: ["Gen 3:22"], note: "'like one of us'"}
      - {motif: tree-of-life, refs: ["Gen 3:22", "Gen 3:24"]}
      - {motif: expulsion-from-paradise, refs: ["Gen 3:23", "Gen 3:24"]}
      - {motif: cherubim-guard-paradise, refs: ["Gen 3:24"]}
    hints:
      - "Gilgamesh XI: the serpent steals the plant of rejuvenation; Adapa refuses the food of life."
      - "Quran 7:19-25 and 20:120-121: Iblis whispers, 'tree of immortality', both eat, leaves of the garden as covering; no blame on the woman alone."
      - "Pandora (Hesiod) as first woman bringing evils; Christian proto-evangelium reading of 3:15."
  - id: hb-gen-4-cain-abel
    tradition: judaism
    title: Cain and Abel
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Gen 4:1-16"]
    tags:
      - {motif: first-birth-naming-speech, refs: ["Gen 4:1"], note: "qaniti ish et YHWH, 'I have gotten a man with the LORD'"}
      - {motif: farmer-vs-shepherd-brothers, refs: ["Gen 4:2"]}
      - {motif: offering-accepted-rejected, refs: ["Gen 4:3", "Gen 4:4", "Gen 4:5"]}
      - {motif: firstlings-and-fat-offered, refs: ["Gen 4:4"]}
      - {motif: sin-crouching-at-door, refs: ["Gen 4:7"], note: "rovets, cf. Akkadian rabisu demon"}
      - {motif: first-murder-fratricide, refs: ["Gen 4:8"], note: "speech of Cain to Abel missing in MT ('Cain said to Abel ...')"}
      - {motif: am-i-my-brothers-keeper, refs: ["Gen 4:9"]}
      - {motif: blood-cries-from-ground, refs: ["Gen 4:10"], note: "'bloods' plural, read by Mishnah Sanh. 4:5 as his descendants"}
      - {motif: earth-opens-mouth-to-receive-blood, refs: ["Gen 4:11"]}
      - {motif: murderer-condemned-to-wander, refs: ["Gen 4:12", "Gen 4:14"]}
      - {motif: mark-of-cain, refs: ["Gen 4:15"]}
      - {motif: sevenfold-vengeance, refs: ["Gen 4:15"]}
      - {motif: land-of-nod-east-of-eden, refs: ["Gen 4:16"]}
    hints:
      - "Quran 5:27-31: the two sons of Adam, the accepted offering, a raven teaches burial; Sumerian Dumuzi and Enkimdu (shepherd vs farmer)."
      - "Targum/Midrash supply the field dispute; Hebrews 11:4 and 1 John 3:12; Mishnah Sanhedrin 4:5."
  - id: hb-gen-4-cainites-lamech
    tradition: judaism
    title: Cain's line, the first city, culture heroes and the Song of Lamech
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Gen 4:17-24"]
    tags:
      - {motif: first-city-named-for-son, refs: ["Gen 4:17"], note: "city Enoch"}
      - {motif: culture-heroes-inventors, refs: ["Gen 4:20", "Gen 4:21", "Gen 4:22"], note: "Jabal tents and herds; Jubal lyre and pipe; Tubal-cain bronze and iron; sister Naamah"}
      - {motif: first-polygamy, refs: ["Gen 4:19"], note: "Adah and Zillah"}
      - {motif: song-of-lamech, refs: ["Gen 4:23", "Gen 4:24"]}
      - {motif: sevenfold-vengeance, refs: ["Gen 4:24"], note: "seventy-seven"}
    hints:
      - "Mesopotamian apkallu sages bring the arts; Phoenician history of Philo of Byblos lists inventor-generations; 1 Enoch 8 Azazel teaches metalwork."
      - "Matthew 18:22 seventy-seven times forgiveness answers Lamech."
  - id: hb-gen-4-seth-enosh
    tradition: judaism
    title: Birth of Seth and Enosh; calling on the name of the LORD
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Gen 4:25-26"]
    tags:
      - {motif: replacement-son-for-slain, refs: ["Gen 4:25"], note: "Shet from shat, 'appointed'"}
      - {motif: first-birth-naming-speech, refs: ["Gen 4:25"]}
      - {motif: beginning-of-invoking-gods-name, refs: ["Gen 4:26"], note: "rabbinic reading huhal = 'profaned', origin of idolatry"}
    hints:
      - "Gnostic Sethians; Life of Adam and Eve on Seth; Gen Rabbah 23:7 on Enosh's generation and idolatry."
  - id: hb-gen-5-adam-to-noah
    tradition: judaism
    title: The book of the generations of Adam, Adam to Noah
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Gen 5:1-32"]
    tags:
      - {motif: human-in-divine-image, refs: ["Gen 5:1"]}
      - {motif: male-and-female-created-together, refs: ["Gen 5:2"], note: "God names them both 'adam'"}
      - {motif: son-in-fathers-image, refs: ["Gen 5:3"]}
      - {motif: ten-antediluvian-generations, refs: ["Gen 5:3", "Gen 5:32"]}
      - {motif: antediluvian-longevity, refs: ["Gen 5:5", "Gen 5:8", "Gen 5:11", "Gen 5:14", "Gen 5:17", "Gen 5:20", "Gen 5:27", "Gen 5:31"], note: "Adam 930, Seth 912, Enosh 905, Kenan 910, Mahalalel 895, Jared 962, Methuselah 969, Lamech 777"}
      - {motif: seventh-patriarch-taken-by-god, refs: ["Gen 5:22", "Gen 5:24"], note: "Enoch, 'and he was not, for God took him'"}
      - {motif: life-span-365, refs: ["Gen 5:23"]}
      - {motif: longest-lived-man, refs: ["Gen 5:27"], note: "Methuselah 969, dies in the year of the flood by the MT numbers"}
      - {motif: name-meaning-comfort-from-curse, refs: ["Gen 5:29"], note: "Noah/yenahamenu, recalls 3:17"}
      - {motif: sevenfold-vengeance, refs: ["Gen 5:31"], note: "not vengeance: Lamech's age 777 echoes Cainite Lamech's 77; weak tag"}
    hints:
      - "Sumerian King List: ten (or eight) antediluvian kings with reigns of tens of thousands of years; seventh king Enmeduranki taken to the gods, cf. Enoch."
      - "1 Enoch, Jubilees 4, Quran 19:56-57 Idris raised to a high place; Hebrews 11:5."
  - id: hb-gen-6-sons-of-god
    tradition: judaism
    title: Sons of God, daughters of men, and the Nephilim
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Gen 6:1-4"]
    tags:
      - {motif: sons-of-god-marry-human-women, refs: ["Gen 6:2", "Gen 6:4"]}
      - {motif: giants-offspring-of-gods, refs: ["Gen 6:4"], note: "Nephilim; gibborim, 'men of name' from of old"}
      - {motif: lifespan-limited-120, refs: ["Gen 6:3"]}
    hints:
      - "1 Enoch 6-11 Watchers led by Shemihazah; Jubilees 5; Jude 6, 2 Peter 2:4; Greek demigods (Hesiod's race of heroes); Quran 2:102 Harut and Marut."
  - id: hb-gen-6-flood
    tradition: judaism
    title: The Flood (full read)
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Gen 6:5-8:22"]
    tags:
      - {motif: evil-inclination-of-heart, refs: ["Gen 6:5", "Gen 8:21"]}
      - {motif: god-regrets-creating, refs: ["Gen 6:6", "Gen 6:7"]}
      - {motif: divine-decision-to-destroy, refs: ["Gen 6:7", "Gen 6:13", "Gen 6:17"]}
      - {motif: reason-human-wickedness, refs: ["Gen 6:5", "Gen 6:11", "Gen 6:12", "Gen 6:13"], note: "hamas, violence; all flesh corrupted its way"}
      - {motif: hero-righteous, refs: ["Gen 6:8", "Gen 6:9", "Gen 7:1"], note: "tsaddiq tamim, 'walked with God' like Enoch"}
      - {motif: hero-warned-by-deity, refs: ["Gen 6:13"]}
      - {motif: build-vessel-on-instruction, refs: ["Gen 6:14", "Gen 6:22"], note: "tevah of gopher wood with qinnim (rooms/reeds)"}
      - {motif: vessel-sealed-with-pitch, refs: ["Gen 6:14"], note: "kafar ... kofer"}
