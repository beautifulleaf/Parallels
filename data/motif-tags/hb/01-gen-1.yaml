      - {motif: vessel-multiple-decks-door-window, refs: ["Gen 6:16", "Gen 8:6", "Gen 8:13"], note: "tsohar; three decks; side door; covering removed"}
      - {motif: family-saved, refs: ["Gen 6:18", "Gen 7:7", "Gen 7:13", "Gen 8:16", "Gen 8:18"], note: "eight persons"}
      - {motif: animals-in-pairs, refs: ["Gen 6:19", "Gen 6:20", "Gen 7:9", "Gen 7:15", "Gen 7:16"]}
      - {motif: clean-animals-by-sevens, refs: ["Gen 7:2", "Gen 7:3", "Gen 7:8"]}
      - {motif: seven-day-wait-before-flood, refs: ["Gen 7:4", "Gen 7:10"]}
      - {motif: forty-days-rain, refs: ["Gen 7:4", "Gen 7:12", "Gen 7:17"]}
      - {motif: flood-dated-precisely, refs: ["Gen 7:6", "Gen 7:11", "Gen 8:4", "Gen 8:5", "Gen 8:13", "Gen 8:14"], note: "600th year 2/17 to 601st year 2/27"}
      - {motif: waters-from-above-and-below, refs: ["Gen 7:11", "Gen 8:2"], note: "springs of the great deep burst; windows of heaven opened"}
      - {motif: god-shuts-the-door, refs: ["Gen 7:16"]}
      - {motif: waters-cover-highest-mountains, refs: ["Gen 7:19", "Gen 7:20"]}
      - {motif: universal-destruction, refs: ["Gen 7:21", "Gen 7:22", "Gen 7:23"]}
      - {motif: wind-abates-waters, refs: ["Gen 8:1"], note: "recalls ruah over the waters in 1:2"}
      - {motif: vessel-rests-on-mountain, refs: ["Gen 8:4"], note: "mountains of Ararat, 7th month 17th day"}
      - {motif: raven-sent-first, refs: ["Gen 8:7"]}
      - {motif: bird-release, refs: ["Gen 8:7", "Gen 8:8", "Gen 8:9", "Gen 8:10", "Gen 8:12"], note: "dove three times at seven-day intervals"}
      - {motif: olive-leaf-sign, refs: ["Gen 8:11"]}
      - {motif: sacrifice-after-flood, refs: ["Gen 8:20"]}
      - {motif: deity-smells-offering, refs: ["Gen 8:21"], note: "reah ha-nihoah, pun on Noah"}
      - {motif: promise-never-again, refs: ["Gen 8:21"]}
      - {motif: seasons-guaranteed, refs: ["Gen 8:22"]}
      - {motif: be-fruitful-and-multiply, refs: ["Gen 8:17"]}
