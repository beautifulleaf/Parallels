units:
  - id: hb-2chr-29-hezekiah-cleanses-temple
    tradition: judaism
    title: Hezekiah reopens and purifies the temple
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["2Chr 29:1-36"]
    tags:
      - {motif: queen-mother-named-in-regnal-formula, refs: ["2Chr 29:1"], note: "Abijah daughter of Zechariah"}
      - {motif: reforming-king-compared-to-david, refs: ["2Chr 29:2"]}
      - {motif: reform-in-first-month-of-reign, refs: ["2Chr 29:3", "2Chr 29:17"], note: "temple doors opened in the first year, first month"}
      - {motif: temple-doors-shut-lamps-out, refs: ["2Chr 29:7"], note: "the fathers shut the porch doors, quenched the lamps, ceased incense and burnt offerings"}
      - {motif: hissing-and-horror-curse-formula, refs: ["2Chr 29:8"], note: "le-za'avah le-shammah ve-li-shreqah"}
      - {motif: temple-filth-dumped-in-kidron, refs: ["2Chr 29:16"]}
      - {motif: eight-plus-eight-day-purification, refs: ["2Chr 29:17"], note: "eight days to the porch, eight more for the house, finished on the 16th"}
      - {motif: four-kinds-by-sevens-sin-offering, refs: ["2Chr 29:21"], note: "seven bulls, rams, lambs and he-goats for kingdom, sanctuary and Judah"}
      - {motif: laying-hands-on-victim, refs: ["2Chr 29:23"], note: "king and assembly lay hands on the goats"}
      - {motif: atonement-for-all-israel, refs: ["2Chr 29:24"]}
      - {motif: davidic-music-ordinance-via-prophets, refs: ["2Chr 29:25-27"], note: "cymbals, harps, lyres by command of David, Gad the seer and Nathan"}
      - {motif: song-begins-with-burnt-offering, refs: ["2Chr 29:27-28"]}
      - {motif: psalms-of-david-and-asaph-sung, refs: ["2Chr 29:30"], note: "praise 'with the words of David and Asaph the seer'"}
      - {motif: anointing-and-filling-the-hand, refs: ["2Chr 29:31"]}
      - {motif: levites-more-upright-than-priests, refs: ["2Chr 29:34"], note: "too few priests to flay; Levites 'more upright of heart to sanctify themselves'"}
      - {motif: sudden-divine-accomplishment, refs: ["2Chr 29:36"]}
    hints:
      - "Compare 2Kgs 18:1-4 (no temple cleansing there) and Mishnah Pesahim 4:9 on Hezekiah's acts."
