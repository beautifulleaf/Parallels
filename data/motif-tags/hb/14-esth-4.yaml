new_motifs:
  # --- Esther ---
  sackcloth-and-ashes-mourning: {label: "Mourner puts on sackcloth and ashes and cries aloud in public", cluster: mourning}
  sackcloth-barred-from-kings-gate: {label: "No one may enter the king's gate dressed in sackcloth", cluster: kingship}
  communal-fast-for-deliverance: {label: "A whole community fasts, weeps and laments in the face of a decree of destruction", cluster: cult}
  mourner-refuses-new-clothes: {label: "A mourner refuses the fresh clothes sent to replace his sackcloth", cluster: mourning}
  unsummoned-entry-to-king-is-death: {label: "Anyone who enters the king's inner court unsummoned is put to death", cluster: kingship}
  golden-scepter-extended-spares-life: {label: "The king extends his golden scepter to a petitioner, sparing her life; she touches its tip", cluster: kingship}
  deliverance-from-another-place: {label: "Relief and deliverance will arise 'from another place' if the hero stays silent (veiled reference to God)", cluster: providence}
  who-knows-if-for-such-a-time: {label: "'Who knows whether you came to royal power for such a time as this?'", cluster: providence}
  if-i-perish-i-perish: {label: "Heroine resolves to risk death for her people: 'if I perish, I perish'", cluster: heroes}
  three-day-fast-before-petition: {label: "Three days' total fast (no food or drink, night and day) before a dangerous petition", cluster: cult}
  up-to-half-the-kingdom: {label: "The king offers his petitioner whatever she asks, up to half the kingdom", cluster: kingship}
  petition-deferred-through-banquets: {label: "The heroine delays her real request, inviting king and villain to successive banquets", cluster: heroes}
  pride-before-fall-boast: {label: "The villain boasts to wife and friends of his wealth, sons and honors just before his fall", cluster: wisdom}
  villain-wife-counsels-gallows: {label: "The villain's wife and friends advise him to build a gallows for his rival", cluster: heroes}
  gallows-fifty-cubits: {label: "A stake or gallows fifty cubits high is erected for hanging the rival", cluster: punishment}
  sleepless-king-reads-chronicles: {label: "A sleepless king has the royal chronicles read to him and discovers an unrewarded benefactor", cluster: providence}
  unrewarded-savior-of-king: {label: "The man who exposed a plot against the king's life has gone unrewarded", cluster: kingship}
  villain-designs-own-rivals-honor: {label: "Asked how to honor 'the man the king delights to honor', the villain, thinking it is himself, prescribes the honor his rival receives", cluster: reversal}
  royal-robe-horse-and-crown-honor: {label: "Honoree is dressed in the king's robe and paraded through the city on the king's horse with a herald", cluster: kingship}
  villain-made-herald-of-rival: {label: "The villain himself must lead his rival's horse and proclaim his honor", cluster: reversal}
  head-covered-in-shame: {label: "A disgraced man goes home mourning with his head covered", cluster: mourning}
  wise-men-foretell-fall-before-jew: {label: "The villain's wise men and wife foretell that he cannot prevail against one 'of the seed of the Jews'", cluster: prophecy}
  sold-to-destruction-not-slavery: {label: "Queen protests that her people have been sold to destruction; had it been slavery she would have kept silent", cluster: heroes}
  queen-reveals-identity: {label: "The queen reveals her hidden ethnic identity to the king to save her people", cluster: heroes}
  king-storms-into-garden: {label: "The enraged king leaves the banquet for the palace garden and returns to a compromising scene", cluster: kingship}
  falling-on-queens-couch-misread: {label: "Villain falls on the queen's couch pleading, and the king takes it as assault", cluster: reversal}
  face-covered-condemned: {label: "The condemned man's face is covered at the king's word", cluster: punishment}
  eunuch-points-to-gallows: {label: "A eunuch informs the king that the villain's gallows stands ready", cluster: reversal}
  villain-hanged-on-own-gallows: {label: "The villain is hanged on the very gallows he prepared for the hero", cluster: reversal}
  enemy-estate-given-to-victim: {label: "The condemned enemy's household is given to the intended victim", cluster: reversal}
  signet-ring-transferred: {label: "The king takes back his signet ring from the fallen vizier and gives it to the hero", cluster: kingship}
  royal-decree-cannot-be-revoked: {label: "A decree written in the king's name and sealed with his ring cannot be revoked", cluster: law}
  counter-decree: {label: "Since the first decree cannot be revoked, a second edict permits the threatened people to defend themselves", cluster: law}
  edict-in-every-script-and-language: {label: "Royal letters sent to every province in its own script and every people in its own language", cluster: kingship}
  empire-127-provinces-india-to-cush: {label: "An empire of 127 provinces from India to Cush", cluster: kingship}
  royal-couriers-on-steeds: {label: "Mounted royal couriers on swift royal steeds carry the edict in haste", cluster: kingship}
  hero-in-royal-blue-and-white: {label: "The hero goes out in royal blue and white with a great gold crown and a purple linen mantle", cluster: kingship}
  light-and-gladness-for-jews: {label: "'The Jews had light and gladness, joy and honor'", cluster: festival}
  mass-conversion-from-fear: {label: "Many of the peoples of the land become Jews (mityahadim) because fear of the Jews fell on them", cluster: conversion}
  fear-falls-on-peoples: {label: "Dread of the protagonists 'falls upon' all peoples so none can stand against them", cluster: warfare}
  venahafokh-hu-reversal: {label: "'It was turned about' (venahafokh hu): the day meant for the Jews' destruction becomes their victory", cluster: reversal}
  ten-sons-of-villain-killed: {label: "The villain's ten named sons are killed and then hanged", cluster: punishment}
  did-not-touch-the-plunder: {label: "The victors explicitly refrain from taking plunder", cluster: warfare}
  second-day-of-fighting-in-capital: {label: "The queen requests a second day of reprisal in the capital", cluster: warfare}
  purim-festival-founded: {label: "Annual festival of Purim (14th/15th of Adar) instituted with feasting, joy, portions to friends and gifts to the poor", cluster: festival}
  purim-named-from-lot: {label: "The festival is named Purim after the 'pur', the lot cast by the villain", cluster: etiology}
  lot-cast-to-fix-day-of-destruction: {label: "The villain casts the pur (lot) to choose the date of the massacre", cluster: divination}
  walled-and-unwalled-towns-different-day: {label: "Villagers of unwalled towns keep the festival on a different day from the capital", cluster: festival}
  festival-by-letter-of-leaders: {label: "A festival is established by letters of a lay leader and a queen, not by a prophet or priest", cluster: festival}
  festival-binding-on-proselytes: {label: "The festival binds the Jews, their descendants and all who join them", cluster: conversion}
  sorrow-turned-to-joy-month: {label: "The month 'turned from sorrow to gladness and from mourning to a holiday'", cluster: festival}
  plot-returns-on-plotters-head: {label: "The evil plan devised against others returns upon the plotter's own head", cluster: reversal}
  jewish-vizier-second-to-king: {label: "A Jew becomes second to the foreign king, great among his people, seeking their good", cluster: kingship}
  tribute-on-islands-of-sea: {label: "The king imposes tribute on the land and the islands of the sea", cluster: kingship}
  chronicles-of-media-and-persia-cited: {label: "Citation of the 'book of the chronicles of the kings of Media and Persia'", cluster: sources}
  god-unnamed-in-book: {label: "Deliverance narrated without any explicit mention of God", cluster: providence}
  # --- Job 1-7 ---
  righteous-gentile-of-uz: {label: "The exemplary righteous man is a non-Israelite living in the land of Uz in the east", cluster: wisdom}
  seven-sons-three-daughters: {label: "A blessed man has seven sons and three daughters", cluster: family}
  wealth-counted-in-herds: {label: "A patriarch's wealth is listed in precise numbers of sheep, camels, oxen and asses", cluster: wisdom}
  greatest-of-the-easterners: {label: "The hero is the greatest of all the 'sons of the east' (bnei qedem)", cluster: wisdom}
  children-feast-in-rotation: {label: "Grown sons hold feasts in turn, each on his day, and invite their sisters", cluster: family}
  sacrifice-for-childrens-secret-sins: {label: "Father offers burnt offerings in case his children 'blessed' (cursed) God in their hearts", cluster: cult}
  divine-council-assembles: {label: "The sons of God present themselves before YHWH in a heavenly assembly", cluster: cosmology}
  satan-as-heavenly-accuser: {label: "The Satan (the adversary) appears in the heavenly court as an accusing member", cluster: demonology}
  roaming-the-earth-report: {label: "A heavenly being reports he has been roaming to and fro on the earth", cluster: demonology}
  god-boasts-of-his-servant: {label: "God points out his servant as unmatched on earth for piety", cluster: wisdom}
  piety-for-nothing-question: {label: "'Does he fear God for nothing?': piety suspected of being motivated by reward", cluster: wisdom}
  divine-hedge-around-righteous: {label: "God has set a protective hedge around the righteous man, his house and goods", cluster: providence}
  heavenly-wager-tests-righteous: {label: "God permits the adversary to afflict a righteous man, within set limits, to test his loyalty", cluster: wisdom}
  messengers-of-calamity-in-succession: {label: "Messenger after messenger arrives while the last is still speaking, each the sole survivor of a disaster", cluster: wisdom}
  only-i-escaped-to-tell: {label: "'I alone escaped to tell you'", cluster: wisdom}
  fire-of-god-falls-from-sky: {label: "'Fire of God' falls from heaven and consumes flocks and servants", cluster: theophany}
  desert-wind-collapses-house-on-children: {label: "A great wind from the desert strikes the four corners of the house and it falls on the feasting children", cluster: wisdom}
  shaves-head-in-mourning: {label: "Mourner shaves his head and falls to the ground", cluster: mourning}
  naked-from-womb-naked-return: {label: "'Naked I came from my mother's womb and naked I shall return there'", cluster: wisdom}
  lord-gave-lord-has-taken: {label: "'YHWH gave and YHWH has taken; blessed be the name of YHWH'", cluster: wisdom}
  skin-for-skin: {label: "Adversary's proverb 'skin for skin': a man gives all he has for his life", cluster: wisdom}
  boils-sole-to-crown: {label: "The sufferer is struck with sore boils from the sole of his foot to the crown of his head", cluster: disease}
  potsherd-scraping-in-ashes: {label: "The sufferer sits among the ashes scraping himself with a potsherd", cluster: disease}
  wife-urges-curse-god-and-die: {label: "The sufferer's wife urges him 'Curse God and die'", cluster: wisdom}
  accept-evil-as-well-as-good: {label: "'Shall we accept the good from God and not accept the evil?'", cluster: wisdom}
  bless-as-euphemism-for-curse: {label: "The verb 'bless' (barekh) used as a scribal euphemism for cursing God", cluster: language}
  three-friends-come-to-console: {label: "Three friends from distant places arrange to come together to console the sufferer", cluster: wisdom}
  sufferer-unrecognizable: {label: "Friends see the sufferer from afar and do not recognize him", cluster: disease}
  dust-thrown-toward-heaven: {label: "Mourners throw dust on their heads toward the sky", cluster: mourning}
  seven-days-silent-comforters: {label: "Comforters sit on the ground with the sufferer seven days and nights without speaking", cluster: mourning}
  curse-on-day-of-birth: {label: "The sufferer curses the day of his birth and the night of his conception", cluster: lament}
  night-announces-conception: {label: "The night personified as announcing 'a man-child is conceived'", cluster: lament}
  day-cursers-rouse-leviathan: {label: "Professional cursers of the day, who are ready to rouse Leviathan, are invoked to curse a day", cluster: magic}
  eyelids-of-dawn: {label: "The dawn imaged as having eyelids", cluster: cosmology}
  wish-for-stillbirth: {label: "Sufferer wishes he had died in the womb or been a hidden stillborn", cluster: lament}
  death-as-rest-and-equalizer: {label: "In death kings, princes, prisoners and slaves rest together, small and great alike, the slave free of his master", cluster: afterlife}
  longing-for-death-as-treasure: {label: "The bitter long for death and dig for it more than for hidden treasure", cluster: lament}
  what-i-feared-has-come: {label: "'The thing I greatly feared has come upon me'", cluster: lament}
  god-fences-man-in: {label: "God hedges a man in so his way is hidden (inverted image of the protective hedge)", cluster: lament}
  retribution-no-innocent-perished: {label: "Friend's doctrine: no innocent man ever perished; those who plow iniquity reap it", cluster: wisdom}
  lions-teeth-broken: {label: "The roaring lion's teeth are broken and its cubs scattered (image of the wicked's end)", cluster: wisdom}
  night-vision-spirit-hair-bristles: {label: "In a night vision a spirit glides past the seer's face and his hair bristles with terror", cluster: revelation}
  silence-and-a-voice: {label: "Revelation comes as 'a silence, and a voice' (demamah vaqol)", cluster: revelation}
  mortal-cannot-be-righteous-before-god: {label: "'Can a mortal be righteous before God, a man pure before his maker?'", cluster: wisdom}
  god-charges-angels-with-error: {label: "God puts no trust in his servants and charges his angels with folly", cluster: angelology}
  humans-in-houses-of-clay: {label: "Humans are dwellers in houses of clay founded in dust, crushed like a moth", cluster: anthropology}
  appeal-to-holy-ones: {label: "'To which of the holy ones will you turn?': appeal to heavenly intercessors", cluster: angelology}
  sons-of-resheph: {label: "The 'sons of Resheph' (sparks, or the plague god's brood) fly upward", cluster: mythology}
  man-born-to-trouble: {label: "'Man is born to trouble' (as sparks fly upward)", cluster: wisdom}
  god-catches-wise-in-craftiness: {label: "God catches the wise in their own craftiness", cluster: wisdom}
  happy-is-man-whom-god-reproves: {label: "Suffering as divine discipline: happy the man whom God reproves", cluster: wisdom}
  god-wounds-and-heals: {label: "God wounds and binds up, strikes and his hands heal", cluster: theology}
  numerical-saying-six-seven: {label: "Graded numerical saying: 'in six troubles... in seven'", cluster: wisdom}
  covenant-with-stones-and-beasts: {label: "The righteous will have a covenant with the stones of the field and peace with wild beasts", cluster: wisdom}
  ripe-old-age-like-sheaf: {label: "The righteous come to the grave in ripe age like a sheaf gathered in its season", cluster: wisdom}
  grief-weighed-in-scales: {label: "Sufferer wishes his anguish weighed in scales: it would outweigh the sand of the seas", cluster: lament}
  poisoned-arrows-of-shaddai: {label: "The arrows of Shaddai are in me; my spirit drinks their poison", cluster: lament}
  animal-cry-proverb: {label: "Proverb: does a wild ass bray over grass or an ox low over its fodder?", cluster: wisdom}
  wish-god-would-crush-me: {label: "Sufferer prays that God would let loose his hand and cut him off", cluster: lament}
  flesh-not-bronze: {label: "'Is my strength that of stones, or my flesh bronze?'", cluster: lament}
  treacherous-friends-as-dry-wadi: {label: "Faithless friends are like a wadi that swells with ice and snow but vanishes in heat, disappointing caravans of Tema and Sheba", cluster: friendship}
  life-as-hard-service: {label: "Human life on earth is hard service (tsava), its days like those of a hired laborer", cluster: anthropology}
  flesh-clothed-with-worms: {label: "The sufferer's flesh is clothed with worms and clods of dust; his skin cracks and festers", cluster: disease}
  days-swifter-than-shuttle: {label: "Life's days are swifter than a weaver's shuttle", cluster: transience}
  no-return-from-sheol: {label: "Like a vanishing cloud, whoever goes down to Sheol does not come up; his place knows him no more", cluster: afterlife}
  sea-and-dragon-under-guard: {label: "'Am I Sea, or the Dragon (tannin), that you set a guard over me?'", cluster: cosmology}
  terrifying-dreams-from-god: {label: "God terrifies the sufferer with dreams and visions at night", cluster: revelation}
  what-is-man-inverted: {label: "'What is man that you make so much of him?' turned into a complaint against divine scrutiny (cf. Ps 8)", cluster: anthropology}
  watcher-of-humans: {label: "God called 'watcher of humankind' (notser ha'adam) who targets the sufferer", cluster: theology}
  you-will-seek-me-and-i-am-gone: {label: "Sufferer says God will seek him in the morning and he will be no more", cluster: lament}
  # --- Job 8-11 ---
  does-god-pervert-justice: {label: "'Does God pervert justice, does Shaddai pervert right?'", cluster: wisdom}
  children-died-for-own-sins: {label: "The friend argues the sufferer's children died because of their own transgression", cluster: wisdom}
  small-beginning-great-end: {label: "'Your beginning was small, but your latter end will greatly increase'", cluster: wisdom}
  ask-the-former-generations: {label: "Appeal to the wisdom of former generations, since 'we are but of yesterday'", cluster: wisdom}
  days-as-shadow: {label: "Human days on earth are a shadow", cluster: transience}
  papyrus-without-water: {label: "The godless are like papyrus or reed that withers without marsh water", cluster: wisdom}
  trust-like-spiders-web: {label: "The trust of the godless is a spider's house that will not stand", cluster: wisdom}
  how-can-man-be-just-with-god: {label: "'How can a man be in the right with God? He could not answer one in a thousand'", cluster: wisdom}
  god-overturns-mountains-shakes-earth: {label: "God moves mountains in anger and shakes the earth so its pillars tremble", cluster: cosmology}
  god-seals-up-sun-and-stars: {label: "God commands the sun not to rise and seals up the stars", cluster: cosmology}
  god-alone-stretches-heavens: {label: "God alone stretches out the heavens", cluster: creation}
  god-treads-on-back-of-sea: {label: "God treads on the back (bamot) of Sea", cluster: cosmology}
  constellations-ash-kesil-kimah: {label: "God made the constellations Ash (Bear?), Kesil (Orion) and Kimah (Pleiades) and the chambers of the south", cluster: astronomy}
  god-passes-by-unseen: {label: "God passes by the speaker and he does not see him", cluster: theophany}
  helpers-of-rahab-bowed: {label: "The helpers of Rahab bow beneath God's wrath", cluster: cosmology}
  god-as-unanswerable-litigant: {label: "Sufferer imagines suing God but knows God's might would silence or condemn him", cluster: wisdom}
  god-destroys-blameless-and-wicked: {label: "'He destroys both the blameless and the wicked'; God mocks the calamity of the innocent", cluster: theodicy}
  earth-given-to-wicked-judges-blindfolded: {label: "The earth is given into the hand of the wicked; God covers the faces of its judges", cluster: theodicy}
  days-swifter-than-runner-reed-ships-eagle: {label: "Life's days flee faster than a runner, reed boats, or a swooping eagle", cluster: transience}
  washing-in-snow-plunged-in-pit: {label: "Even if washed in snow and lye, God would plunge him into the pit so his clothes abhor him", cluster: theodicy}
  no-arbiter-between-man-and-god: {label: "Lament that there is no umpire (mokhiach) to lay his hand on both God and man", cluster: mediator}
  god-as-hostile-craftsman-of-body: {label: "The sufferer reminds God that God's hands shaped him yet now destroy him", cluster: creation}
  embryo-curdled-like-cheese: {label: "God poured the embryo out like milk and curdled it like cheese, clothing it with skin and flesh and knitting bones and sinews", cluster: anthropology}
  god-has-eyes-of-flesh-question: {label: "'Have you eyes of flesh? Are your days like a mortal's days?'", cluster: theology}
  god-hunts-like-lion: {label: "God hunts the sufferer like a lion", cluster: lament}
  land-of-darkness-and-chaos: {label: "The underworld as a land of darkness and deep shadow, without order, where light is like darkness", cluster: afterlife}
  mystery-of-wisdom-double: {label: "Secrets of wisdom are 'double' (manifold); God's depth cannot be found", cluster: wisdom}
  higher-than-heaven-deeper-than-sheol: {label: "God's extent is higher than heaven, deeper than Sheol, longer than earth, broader than sea", cluster: cosmology}
  wild-ass-born-a-man: {label: "Proverb: a hollow man will get understanding when a wild ass's colt is born a man", cluster: wisdom}
  spread-hands-in-prayer: {label: "The petitioner spreads out his palms toward God", cluster: prayer}
  # --- Job 12-15 ---
  wisdom-will-die-with-you: {label: "Sarcasm: 'No doubt you are the people, and wisdom will die with you'", cluster: wisdom}
  righteous-a-laughingstock: {label: "The just and blameless man has become a laughingstock to his friends", cluster: lament}
  ask-the-beasts-they-will-teach: {label: "Ask the beasts, birds, earth and fish and they will teach you that God's hand made this", cluster: wisdom}
  breath-of-all-flesh-in-gods-hand: {label: "In God's hand is the life of every living thing and the breath of all humankind", cluster: theology}
  ear-tests-words-as-palate-tastes: {label: "'Does not the ear test words as the palate tastes food?'", cluster: wisdom}
  wisdom-with-the-aged: {label: "Wisdom is with the aged and understanding in length of days", cluster: wisdom}
  god-withholds-and-releases-waters: {label: "God withholds the waters and they dry up, sends them out and they overturn the earth", cluster: cosmology}
  god-humbles-counselors-kings-priests: {label: "God leads counselors, judges, kings and priests away stripped and makes fools of them", cluster: theology}
  god-reveals-deep-things-from-darkness: {label: "God uncovers deep things out of darkness and brings deep shadow to light", cluster: revelation}
  god-raises-and-destroys-nations: {label: "God makes nations great and destroys them, enlarges and disperses them", cluster: theology}
  leaders-wander-in-tohu: {label: "God takes away the reason of leaders and makes them wander in a trackless waste (tohu), groping like drunkards", cluster: theology}
  friends-as-worthless-physicians: {label: "The friends are plasterers of lies and worthless physicians", cluster: friendship}
  silence-would-be-wisdom: {label: "'If only you would keep silent; that would be your wisdom'", cluster: wisdom}
  lying-for-god-rebuked: {label: "Will you speak falsely for God and show him partiality?", cluster: theodicy}
  proverbs-of-ashes: {label: "The friends' maxims are proverbs of ashes, defenses of clay", cluster: wisdom}
  life-in-my-hand: {label: "'I take my flesh in my teeth and my life in my hand'", cluster: heroes}
  though-he-slay-me: {label: "'Though he slay me, I will hope in him' (qere) / 'I have no hope' (ketiv)", cluster: faith}
  legal-case-prepared-against-god: {label: "The sufferer has prepared his case (arakhti mishpat) and knows he will be vindicated", cluster: wisdom}
  two-conditions-for-the-trial: {label: "Sufferer asks God for two things: withdraw your hand and do not terrify me; then call and I will answer", cluster: wisdom}
  god-hides-his-face: {label: "'Why do you hide your face and count me as your enemy?'", cluster: theology}
  driven-leaf-dry-straw: {label: "Will you frighten a driven leaf and pursue dry straw?", cluster: lament}
  sins-of-youth-written-bitter: {label: "God writes bitter things against him and makes him inherit the sins of his youth", cluster: theodicy}
  feet-in-stocks: {label: "God puts the sufferer's feet in the stocks and marks the soles of his feet", cluster: lament}
  moth-eaten-garment: {label: "Man wastes away like rot, like a garment eaten by moths", cluster: transience}
  born-of-woman-few-days: {label: "'Man born of woman is of few days and full of trouble'; he comes forth like a flower and withers", cluster: transience}
  clean-from-unclean-impossible: {label: "'Who can bring a clean thing out of an unclean? Not one'", cluster: anthropology}
  fixed-span-of-life: {label: "Man's days are determined; God has set limits he cannot pass", cluster: fate}
  tree-has-hope-man-none: {label: "A felled tree sprouts again at the scent of water, but a man dies and does not rise", cluster: afterlife}
  sleep-until-heavens-are-no-more: {label: "The dead will not wake until the heavens are no more", cluster: afterlife}
  hide-me-in-sheol-until-wrath-passes: {label: "Sufferer wishes God would hide him in Sheol until his anger passes and then remember him", cluster: afterlife}
  if-a-man-dies-will-he-live-again: {label: "'If a man dies, will he live again?': hope of a release (chalifah) after hard service", cluster: afterlife}
  sins-sealed-in-a-bag: {label: "Transgressions sealed up in a bag (tseror) and iniquity plastered over", cluster: theodicy}
  erosion-destroys-hope: {label: "As waters wear away stones and mountains crumble, so God destroys human hope", cluster: transience}
  dead-unaware-of-childrens-fate: {label: "The dead man does not know whether his sons are honored or brought low", cluster: afterlife}
  belly-filled-with-east-wind: {label: "Windy knowledge: filling one's belly with the east wind", cluster: wisdom}
  first-man-born-before-hills: {label: "'Were you the first man born? Were you brought forth before the hills?' (primal man of wisdom)", cluster: mythology}
  listening-in-council-of-god: {label: "'Have you listened in the council (sod) of God, and limited wisdom to yourself?'", cluster: cosmology}
  heavens-not-clean-in-his-sight: {label: "God puts no trust in his holy ones, and the heavens are not clean in his sight", cluster: angelology}
  drinks-iniquity-like-water: {label: "Man is abominable and corrupt, drinking iniquity like water", cluster: anthropology}
  wisdom-of-uncontaminated-ancestors: {label: "Wisdom passed down from fathers to whom alone the land was given, with no stranger among them", cluster: wisdom}
  wicked-writhes-in-terror: {label: "The wicked man writhes in pain all his days, with dreadful sounds in his ears", cluster: wisdom}
  wicked-charges-god-with-shield: {label: "The wicked stretches his hand against God and charges at him with a thick-bossed shield", cluster: theomachy}
  fat-covered-face: {label: "The wicked man's face is covered with fat and his loins with blubber", cluster: wisdom}
  vine-sheds-unripe-grapes: {label: "The wicked are like a vine shedding unripe grapes and an olive casting its blossoms", cluster: wisdom}
  conceive-mischief-bring-forth-evil: {label: "They conceive trouble and bring forth iniquity; their womb prepares deceit", cluster: wisdom}
  # --- Job 16-19 ---
  miserable-comforters: {label: "'Miserable comforters (menachamei amal) are you all'", cluster: friendship}
  god-as-savage-beast-gnashing: {label: "God tears the sufferer in his wrath, gnashes his teeth and sharpens his eyes against him", cluster: lament}
  god-hands-over-to-wicked: {label: "God hands the sufferer over to the ungodly and the wicked", cluster: theodicy}
  set-up-as-gods-target: {label: "God seizes the sufferer by the neck, shatters him and sets him up as his target for archers", cluster: lament}
  horn-in-the-dust: {label: "The mourner sews sackcloth on his skin and lays his horn in the dust", cluster: mourning}
  earth-do-not-cover-my-blood: {label: "'O earth, cover not my blood; let my cry find no resting place'", cluster: blood}
  witness-in-heaven: {label: "'Even now my witness is in heaven, my advocate on high' who will argue for man with God", cluster: mediator}
  path-of-no-return: {label: "The dying man goes the way from which he will not return", cluster: afterlife}
  god-as-surety-for-sufferer: {label: "Sufferer asks God himself to stand surety (pledge) for him with God", cluster: mediator}
  byword-of-peoples-spat-on: {label: "The sufferer is made a byword (mashal) of peoples, one in whose face they spit (tofet)", cluster: lament}
  sheol-as-home-pit-as-father-worm-as-mother: {label: "Sufferer calls the Pit 'my father' and the worm 'my mother and sister', making his bed in Sheol's darkness", cluster: afterlife}
  hope-descends-to-sheol: {label: "Will hope go down to the bars of Sheol, to rest together in the dust?", cluster: afterlife}
  lamp-of-wicked-put-out: {label: "The light of the wicked is put out and the lamp in his tent goes dark", cluster: wisdom}
  wicked-caught-in-traps-and-snares: {label: "The wicked man walks into nets, gins, snares and hidden ropes", cluster: wisdom}
  firstborn-of-death: {label: "'The firstborn of Death' (bekhor mavet) devours the wicked man's limbs", cluster: mythology}
  king-of-terrors: {label: "The wicked is marched to 'the king of terrors' (melekh ballahot)", cluster: mythology}
  brimstone-scattered-on-dwelling: {label: "Brimstone is scattered over the wicked man's habitation", cluster: wisdom}
  memory-and-name-perish: {label: "The wicked man's memory perishes from the earth; he has no name, offspring or survivor", cluster: wisdom}
  ten-times-insulted: {label: "'These ten times you have reproached me'", cluster: friendship}
  god-has-wronged-me: {label: "'Know then that God has wronged me and closed his net about me'", cluster: theodicy}
  cry-violence-no-answer: {label: "'I cry out Violence! but I am not answered'", cluster: theodicy}
  crown-stripped-from-head: {label: "God has stripped the sufferer of his glory and taken the crown from his head", cluster: lament}
  gods-troops-besiege-tent: {label: "God's troops come together, cast up siegeworks and encamp around the sufferer's tent", cluster: lament}
  abandoned-by-kin-and-servants: {label: "Brothers, kin, guests, maidservants and servants all estrange themselves from the sufferer; his breath is strange to his wife", cluster: lament}
  mocked-by-children: {label: "Even young children despise the sufferer and speak against him", cluster: lament}
  escaped-by-skin-of-teeth: {label: "'I have escaped by the skin of my teeth'; bones cleave to skin", cluster: lament}
  pity-me-my-friends: {label: "'Have pity on me, have pity on me, O my friends, for the hand of God has touched me'", cluster: lament}
  words-inscribed-forever-in-rock: {label: "Wish that his words were written in a book, engraved with an iron pen and lead in the rock forever", cluster: writing}
  my-redeemer-lives: {label: "'I know that my redeemer (go'el) lives, and at the last he will stand upon the dust'", cluster: mediator}
  see-god-from-my-flesh: {label: "'After my skin is stripped off, from my flesh I shall see God' with my own eyes, not a stranger's", cluster: afterlife}
  warning-of-sword-and-judgment: {label: "The sufferer warns his accusers to fear the sword, so they may know there is a judgment", cluster: wisdom}
  # --- Job 20-23 ---
  triumph-of-wicked-is-brief: {label: "The joy of the wicked is brief since humans were placed on earth", cluster: wisdom}
  wicked-height-reaches-clouds-perishes-like-dung: {label: "Though the wicked man's height reaches heaven, he perishes forever like his own dung", cluster: wisdom}
  vanishes-like-dream: {label: "The wicked flies away like a dream and is chased off like a vision of the night", cluster: transience}
  evil-sweet-in-mouth-turns-to-venom: {label: "Evil held sweet under the tongue turns to the venom of asps in the belly", cluster: wisdom}
  swallowed-wealth-vomited-up: {label: "The wicked man swallows riches and God makes him vomit them up", cluster: wisdom}
  rivers-of-honey-and-curds: {label: "Streams and rivers flowing with honey and curds (denied to the wicked)", cluster: paradise}
  god-rains-wrath-as-food: {label: "God sends his fury into the wicked man's belly and rains it upon him as his food", cluster: wisdom}
  bronze-bow-arrow-through-gall: {label: "Fleeing an iron weapon, the wicked is pierced by a bronze bow; the glittering arrow comes out of his gall", cluster: wisdom}
  unfanned-fire-devours: {label: "A fire not blown by man consumes the wicked", cluster: wisdom}
  heaven-and-earth-testify-against-wicked: {label: "The heavens reveal the wicked man's iniquity and the earth rises against him", cluster: cosmology}
  why-do-the-wicked-prosper: {label: "'Why do the wicked live, grow old and mighty?': prosperity of the wicked with children, safe houses and fertile cattle", cluster: theodicy}
  hand-on-mouth-in-awe: {label: "'Lay your hand upon your mouth': gesture of appalled silence", cluster: gesture}
  wicked-children-dance-to-lyre-and-pipe: {label: "The wicked men's children dance to tambourine, lyre and pipe", cluster: theodicy}
  wicked-say-depart-from-us: {label: "The wicked say to God 'Depart from us; what is Shaddai that we should serve him?'", cluster: theodicy}
  wicked-like-chaff-before-wind: {label: "The wicked are like straw before the wind and chaff the storm carries off", cluster: wisdom}
  punishment-stored-for-children-rejected: {label: "Sufferer rejects the idea that God stores up the wicked man's punishment for his sons: let him feel it himself", cluster: theodicy}
  cup-of-wrath: {label: "The wicked should drink of the wrath (cup) of Shaddai", cluster: theodicy}
  death-the-great-leveler: {label: "One dies in full prosperity, another in bitterness; both lie alike in the dust covered by worms", cluster: afterlife}
  ask-the-travelers: {label: "'Have you not asked those who travel the roads?': testimony of wayfarers", cluster: wisdom}
  wicked-honored-at-burial: {label: "The wicked man is borne in honor to the grave and a watch is kept over his tomb; the clods are sweet to him", cluster: theodicy}
  human-righteousness-no-gain-to-god: {label: "'Can a man be of use to God? Is it gain to Shaddai if you are righteous?'", cluster: theology}
  catalogue-of-social-crimes: {label: "Accusation of oppressing the poor: taking pledges, stripping the naked, denying water and bread, sending widows away empty", cluster: ethics}
  god-in-height-of-heavens-behind-clouds: {label: "God is in the height of heaven above the stars; the wicked think thick clouds hide him as he walks the vault (chug) of heaven", cluster: cosmology}
  path-of-the-ancient-wicked-swept-away: {label: "The old way trodden by wicked men, snatched away before their time, their foundation poured out as a river (flood generation)", cluster: flood}
  receive-torah-from-his-mouth: {label: "'Receive instruction (torah) from his mouth and lay up his words in your heart'", cluster: wisdom}
  gold-of-ophir-in-dust: {label: "Lay your gold in the dust and Ophir gold among the stones of the wadi; Shaddai will be your gold", cluster: wisdom}
  decree-and-it-shall-be: {label: "The penitent righteous will decree a thing and it will be established for him", cluster: wisdom}
  innocent-saves-the-guilty: {label: "God delivers even the not-innocent through the cleanness of the righteous one's hands", cluster: intercession}
  if-only-i-knew-where-to-find-him: {label: "'Oh that I knew where I might find him, that I might come to his seat' and argue my case", cluster: theodicy}
  god-absent-in-all-directions: {label: "Going east, west, north and south, the seeker cannot find God", cluster: theodicy}
  tested-like-gold: {label: "'When he has tried me, I shall come out as gold'", cluster: wisdom}
  treasured-his-words: {label: "The righteous has treasured God's words more than his daily bread", cluster: piety}
  god-is-one-who-can-turn-him: {label: "'He is one (be'echad); who can turn him? What he desires, that he does'", cluster: theology}
  # --- Job 24-27 ---
  why-no-times-of-judgment-kept: {label: "'Why are times (of judgment) not stored up by Shaddai, and why do those who know him not see his days?'", cluster: theodicy}
  poor-like-wild-asses-in-desert: {label: "The dispossessed poor go out like wild asses in the desert foraging, gleaning the wicked man's vineyard", cluster: ethics}
  naked-poor-hug-the-rock: {label: "The poor sleep naked without cover in the cold and hug the rock for shelter from mountain rain", cluster: ethics}
  hungry-carry-sheaves-thirsty-tread-wine: {label: "Workers carry sheaves while hungry and tread winepresses while thirsty", cluster: ethics}
  groans-of-dying-unheeded-by-god: {label: "From the city the dying groan and the wounded cry out, yet God pays no heed to the wrong", cluster: theodicy}
  rebels-against-light: {label: "Murderer, adulterer and burglar are 'rebels against the light' who love darkness and fear dawn as deep shadow", cluster: ethics}
  adulterer-disguises-face-at-twilight: {label: "The adulterer waits for twilight and disguises his face, saying 'no eye will see me'", cluster: ethics}
  sheol-snatches-sinners-as-heat-snow: {label: "As drought and heat snatch snow-water, so Sheol snatches those who have sinned", cluster: afterlife}
  womb-forgets-the-wicked: {label: "The womb forgets him; the worm finds him sweet; wickedness is broken like a tree", cluster: afterlife}
  cut-off-like-heads-of-grain: {label: "The wicked are exalted a little, then gone, cut off like the heads of grain", cluster: transience}
  god-makes-peace-in-his-heights: {label: "Dominion and fear are with God, who makes peace in his high places (among the heavenly hosts)", cluster: cosmology}
  innumerable-heavenly-troops: {label: "'Is there any number to his troops?' (heavenly armies)", cluster: angelology}
  moon-and-stars-not-pure: {label: "Even the moon is not bright and the stars are not pure in God's sight", cluster: cosmology}
  man-a-maggot-worm: {label: "Man is a maggot, the son of man a worm", cluster: anthropology}
  rephaim-tremble-beneath-waters: {label: "The shades (Rephaim) tremble beneath the waters and their inhabitants", cluster: afterlife}
  sheol-naked-before-god-abaddon: {label: "Sheol is naked before God and Abaddon has no covering", cluster: afterlife}
  north-stretched-over-void: {label: "God stretches out Zaphon (the north) over the void (tohu)", cluster: cosmology}
  earth-hung-upon-nothing: {label: "God hangs the earth upon nothing (beli-mah)", cluster: cosmology}
  waters-bound-in-clouds: {label: "God binds up the waters in his thick clouds and the cloud does not burst under them", cluster: cosmology}
  throne-veiled-by-cloud: {label: "God veils the face of his throne, spreading his cloud over it", cluster: theophany}
  circle-on-waters-boundary-light-darkness: {label: "God has inscribed a circle on the face of the waters at the boundary between light and darkness", cluster: cosmology}
  pillars-of-heaven-tremble-at-rebuke: {label: "The pillars of heaven tremble and are astounded at God's rebuke", cluster: cosmology}
  god-stills-sea-smites-rahab: {label: "By his power God stilled (or stirred) the Sea and by his understanding smote Rahab", cluster: cosmology}
  wind-clears-heavens: {label: "By his wind (breath) the heavens are made fair", cluster: cosmology}
  hand-pierced-fleeing-serpent: {label: "God's hand pierced the fleeing serpent (nachash bariach)", cluster: cosmology}
  fringes-of-his-ways: {label: "These are but the fringes of his ways, a whisper of a word; who can understand the thunder of his power?", cluster: theology}
  oath-by-god-who-wronged-me: {label: "The sufferer swears 'As God lives, who has taken away my right'", cluster: oath}
  maintains-integrity-till-death: {label: "'Until I die I will not put away my integrity from me'; holding fast to righteousness", cluster: wisdom}
  wicked-heaps-silver-righteous-wears-it: {label: "The wicked heaps up silver like dust and clothing like clay, but the righteous will wear it and the innocent divide the silver", cluster: wisdom}
  house-like-moth-or-watchmans-booth: {label: "The wicked man builds his house like a moth's (cocoon) or a watchman's booth", cluster: transience}
  east-wind-carries-wicked-away: {label: "The east wind lifts the wicked man and sweeps him from his place; men clap their hands and hiss at him", cluster: wisdom}
  widows-do-not-weep: {label: "The wicked man's widows do not weep for him", cluster: mourning}
  # --- Job 28-30 ---
  miners-tunnel-under-earth: {label: "Miners sink shafts far from habitation, dangle on ropes, and search out ore in darkness to the farthest bound", cluster: technology}
  earth-above-bread-below-fire: {label: "From the earth comes bread, but beneath it is turned up as by fire", cluster: cosmology}
  path-unknown-to-birds-of-prey: {label: "A hidden path no falcon knows, no kite's eye has seen, no proud beast or lion has trodden", cluster: wisdom}
  where-is-wisdom-found: {label: "'But where shall wisdom be found, and where is the place of understanding?' (refrain)", cluster: wisdom}
  deep-and-sea-say-not-in-me: {label: "The Deep (tehom) says 'It is not in me' and the Sea says 'It is not with me'", cluster: cosmology}
  wisdom-beyond-price-of-gems: {label: "Wisdom cannot be bought with gold of Ophir, onyx, sapphire, glass, coral, crystal, pearls or topaz of Cush", cluster: wisdom}
  abaddon-and-death-heard-rumor: {label: "Abaddon and Death say 'We have heard a rumor of it with our ears'", cluster: afterlife}
  god-alone-knows-way-of-wisdom: {label: "Only God understands the way to wisdom; he saw and appraised it when he set weight for the wind and measure for the waters", cluster: wisdom}
  weight-of-wind-measure-of-waters: {label: "At creation God fixed the weight of the wind, the measure of the waters, a decree for the rain and a way for the thunderbolt", cluster: creation}
  fear-of-lord-is-wisdom: {label: "'The fear of the Lord, that is wisdom; and to depart from evil is understanding'", cluster: wisdom}
  longing-for-former-days: {label: "The sufferer longs for the months of old when God watched over him and his lamp shone on his head", cluster: lament}
  council-of-god-over-tent: {label: "In his prime the friendship (sod) of God was over his tent and his children were around him", cluster: piety}
  feet-washed-in-cream-rock-pours-oil: {label: "In prosperity his steps were washed in curds and the rock poured out streams of oil for him", cluster: paradise}
  elder-honored-at-city-gate: {label: "When he took his seat in the city square the young hid, the aged rose, princes fell silent with hand on mouth", cluster: wisdom}
  clothed-in-righteousness-as-robe: {label: "'I put on righteousness and it clothed me; my justice was a robe and a turban'", cluster: ethics}
  eyes-to-blind-feet-to-lame: {label: "'I was eyes to the blind and feet to the lame, a father to the poor'", cluster: ethics}
  broke-the-fangs-of-wicked: {label: "The righteous man broke the jaws of the wicked and snatched the prey from his teeth", cluster: ethics}
  die-in-my-nest-multiply-days-like-chol: {label: "'I shall die with my nest and multiply my days like the chol' (sand, or the phoenix)", cluster: mythology}
  root-spread-to-waters-dew-on-branches: {label: "The prosperous man's root spreads to the waters and dew lies all night on his branches", cluster: wisdom}
  bow-renewed-in-hand: {label: "His glory fresh and his bow ever renewed in his hand", cluster: wisdom}
  words-awaited-like-rain: {label: "Hearers waited for his words as for rain and opened their mouths as for the spring rain", cluster: wisdom}
  sat-as-chief-like-king-among-troops: {label: "He sat as chief and dwelt like a king among his troops, as one who comforts mourners", cluster: kingship}
  mocked-by-sons-of-outcasts: {label: "Now he is mocked by younger men whose fathers he would not have set with his sheepdogs", cluster: lament}
  outcast-desert-people-eat-roots: {label: "Outcasts driven from society gnaw the dry ground, eat saltwort and broom roots, live in gullies and caves and bray among the bushes", cluster: ethnography}
  sons-of-no-name: {label: "'Sons of fools, sons of no name', whipped out of the land", cluster: ethnography}
  song-and-byword-of-rabble: {label: "The sufferer has become their taunt-song and byword; they spit in his face", cluster: lament}
  terrors-turned-on-me: {label: "Terrors are turned on him; his dignity is chased away like the wind and his safety passes like a cloud", cluster: lament}
  gnawing-pains-at-night: {label: "At night his bones are pierced and his gnawing pains take no rest", cluster: disease}
  thrown-in-the-mire: {label: "God has cast him into the mire and he has become like dust and ashes", cluster: lament}
  god-turned-cruel: {label: "'You have turned cruel to me; with the might of your hand you persecute me'", cluster: theodicy}
  tossed-on-the-wind: {label: "God lifts the sufferer up on the wind, makes him ride it and dissolves him in the storm", cluster: lament}
  house-appointed-for-all-living: {label: "Death is 'the house appointed for all living'", cluster: afterlife}
  hoped-for-good-evil-came: {label: "'I hoped for good and evil came; I waited for light and darkness came'", cluster: lament}
  brother-to-jackals-companion-of-ostriches: {label: "'I am a brother to jackals and a companion to ostriches' (desert creatures of lament)", cluster: lament}
  skin-turns-black: {label: "His skin turns black and falls from him, his bones burn with heat", cluster: disease}
  lyre-turned-to-mourning: {label: "'My lyre is turned to mourning and my pipe to the voice of weepers'", cluster: mourning}
  # --- Job 31-32 ---
  oath-of-clearance-negative-confession: {label: "Protagonist clears himself with a series of conditional self-curses ('If I have done X, may Y befall me')", cluster: law}
  covenant-with-eyes: {label: "'I made a covenant with my eyes; how then could I look upon a virgin?'", cluster: ethics}
  weighed-in-just-balances: {label: "'Let God weigh me in just balances and know my integrity'", cluster: judgment}
  another-shall-eat-what-i-sow: {label: "Self-curse: may I sow and another eat, and my offspring be uprooted", cluster: law}
  wife-grinds-for-another: {label: "Self-curse for adultery: may my wife grind for another and others kneel over her", cluster: law}
  adultery-fire-consuming-to-abaddon: {label: "Adultery is a fire that consumes unto Abaddon and roots out all one's increase", cluster: ethics}
  master-and-slave-made-in-same-womb: {label: "Master respects his slaves' lawsuits because the one who made him in the womb made them too", cluster: ethics}
  did-not-eat-morsel-alone: {label: "The righteous did not eat his morsel alone without sharing with the orphan", cluster: ethics}
  clothed-poor-with-fleece: {label: "The poor were warmed with the fleece of the righteous man's sheep and blessed him", cluster: ethics}
  arm-fall-from-shoulder-curse: {label: "Self-curse: may my shoulder fall from its socket and my arm break from its bone", cluster: law}
  no-trust-in-gold: {label: "Disavowal of making gold one's hope or rejoicing in great wealth", cluster: ethics}
  sun-and-moon-worship-kissing-hand: {label: "Disavowal of secretly worshiping the shining sun and moon by kissing the hand to the mouth", cluster: idolatry}
  no-rejoicing-at-enemys-ruin: {label: "The righteous did not rejoice at his enemy's ruin nor curse his life", cluster: ethics}
  stranger-never-lodged-outside: {label: "'No stranger lodged in the street; I opened my doors to the traveler'", cluster: hospitality}
  hiding-sins-like-adam: {label: "Disavowal of concealing transgressions 'like Adam' (or like men), hiding iniquity in one's bosom", cluster: primeval}
  signature-tav-demand-for-hearing: {label: "'Here is my mark (tav); let Shaddai answer me': the litigant signs his deposition", cluster: law}
  indictment-worn-as-crown: {label: "The sufferer would wear his adversary's written indictment on his shoulder and bind it on as a crown", cluster: law}
  land-cries-out-furrows-weep: {label: "Self-curse should his land cry out against him and its furrows weep for stolen produce or murdered owners", cluster: law}
  thorns-instead-of-wheat: {label: "Self-curse: let thorns grow instead of wheat and stinkweed instead of barley", cluster: law}
  colophon-words-ended: {label: "Editorial colophon: 'The words of Job are ended'", cluster: sources}
  young-interlocutor-angry: {label: "A young bystander, angry at both the sufferer and his elders, breaks in after waiting out of deference", cluster: wisdom}
  elihu-buzite-of-ram: {label: "Elihu son of Barachel the Buzite, of the family of Ram, a fourth speaker unmentioned before", cluster: wisdom}
  spirit-in-man-not-age-gives-wisdom: {label: "Understanding comes from the spirit in man, the breath of Shaddai, not from age", cluster: wisdom}
  belly-like-bursting-wineskins: {label: "The speaker is full of words like unvented wine about to burst new wineskins", cluster: wisdom}
  no-flattery-of-any-man: {label: "The speaker vows to show no partiality and to flatter no one, lest his maker take him away", cluster: ethics}
  # --- Job 33-35 ---
  spirit-of-god-made-me: {label: "'The spirit of God has made me, and the breath of Shaddai gives me life'", cluster: creation}
  pinched-off-from-clay: {label: "The speaker too was 'pinched off from clay' (qoratsti), like a figure nipped from a lump of clay", cluster: creation}
  god-speaks-once-twice-unheeded: {label: "God speaks once, even twice, but people do not perceive it", cluster: revelation}
  warning-dreams-to-turn-from-pride: {label: "In dreams during deep sleep God opens people's ears and seals their warning, to turn them from pride and spare them from the Pit", cluster: revelation}
  sickness-as-divine-warning: {label: "God chastens a man with pain on his bed until he loathes food and his bones stick out, as warning", cluster: disease}
  near-to-the-destroyers: {label: "The sick man's soul draws near the Pit and his life to the 'destroyers' (memitim, angels of death)", cluster: angelology}
  interceding-angel-one-in-thousand: {label: "An angel, an intercessor (malakh melits), one among a thousand, declares a man's uprightness and pleads for him", cluster: angelology}
  ransom-found-from-the-pit: {label: "'Deliver him from going down to the Pit; I have found a ransom (kofer)'", cluster: redemption}
  flesh-restored-like-childs: {label: "The restored man's flesh becomes fresher than a child's and he returns to the days of his youth", cluster: healing}
  confession-before-men-after-healing: {label: "The healed man sings before men, 'I sinned and perverted what was right, and it was not requited to me'", cluster: piety}
  god-acts-twice-three-times: {label: "God does all these things two or three times with a man, to bring him back from the Pit to the light of life", cluster: providence}
  far-be-it-from-god-to-do-wrong: {label: "'Far be it from God to do wickedness, from Shaddai to do wrong'; he repays a man according to his deeds", cluster: theodicy}
  if-god-withdrew-his-breath-all-would-perish: {label: "If God gathered his spirit and breath to himself, all flesh would perish together and return to dust", cluster: creation}
  god-impartial-to-princes-and-poor: {label: "God shows no partiality to princes, nor regards the rich above the poor, for all are the work of his hands", cluster: theology}
  mighty-die-at-midnight: {label: "In a moment they die; at midnight people are shaken and pass away, the mighty removed without a hand", cluster: judgment}
  no-darkness-hides-evildoers: {label: "There is no darkness or deep shadow where evildoers can hide from God", cluster: theology}
  god-topples-mighty-without-inquiry: {label: "God shatters the mighty without inquiry and sets others in their place", cluster: theology}
  godless-king-prevented: {label: "God keeps a godless man from ruling, that he not ensnare the people", cluster: kingship}
  job-tested-to-the-end: {label: "Elihu wishes that Job be tried to the end for answering like wicked men", cluster: wisdom}
  your-sin-does-not-touch-god: {label: "'If you sin, what do you do to him? If you are righteous, what do you give him?'", cluster: theology}
  songs-in-the-night: {label: "God 'gives songs in the night'", cluster: piety}
  taught-more-than-beasts-and-birds: {label: "God teaches us more than the beasts of the earth and makes us wiser than the birds of the heavens", cluster: anthropology}
  empty-cry-unheard: {label: "The oppressed cry out but are not answered because of the pride of evil men; God does not hear an empty cry", cluster: theodicy}
  words-without-knowledge: {label: "The sufferer is accused of multiplying words without knowledge", cluster: wisdom}
units:
  - id: hb-esth-4-mordecai-sackcloth-esther-resolve
    tradition: judaism
    title: Mordecai's mourning and Esther's resolve to approach the king
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Esth 4:1-17"]
    tags:
