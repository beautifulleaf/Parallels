      - {motif: bribe-blinds-the-wise, refs: ["Isa 5:23"]}
      - {motif: outstretched-hand-refrain, refs: ["Isa 5:25"]}
      - {motif: god-whistles-for-distant-nation, refs: ["Isa 5:26"]}
      - {motif: tireless-invading-army, refs: ["Isa 5:27-30"]}
