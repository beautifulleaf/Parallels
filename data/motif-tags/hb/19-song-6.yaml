new_motifs:
  wasf-body-description: {label: "Love poem describes the beloved's body part by part with comparisons (hair like goats, teeth like ewes, neck like a tower)", cluster: love-poetry}
  lover-goes-down-to-garden: {label: "The lover goes down to his garden or nut orchard to graze, gather lilies and see if the vines have blossomed", cluster: love-poetry}
  mutual-belonging-formula: {label: "Lovers' formula of mutual belonging: 'I am my beloved's and my beloved is mine'", cluster: love-poetry}
  beloved-unique-among-queens: {label: "The beloved is unique ('one is my dove') among sixty queens, eighty concubines and countless maidens, who praise her", cluster: love-poetry}
  beloved-like-dawn-moon-sun: {label: "The beloved looks forth like the dawn, fair as the moon, bright as the sun, awesome as bannered hosts", cluster: love-poetry}
  shulammite-dance: {label: "The Shulammite is called to turn back so the onlookers may gaze at her dancing ('dance of the two camps')", cluster: love-poetry}
  beloved-as-palm-climbed: {label: "The lover will climb the palm (the beloved's stature) and grasp its fruit-clusters (her breasts)", cluster: love-poetry}
  lovers-go-out-to-fields-and-vineyards: {label: "Lovers go out to the fields and villages at dawn to see the vines blossom and there make love", cluster: love-poetry}
  wish-lover-were-brother: {label: "The woman wishes her lover were her brother so she could kiss him in public and bring him to her mother's house", cluster: love-poetry}
  adjuration-of-daughters-of-jerusalem: {label: "Refrain: 'I adjure you, daughters of Jerusalem, do not stir up love until it pleases'", cluster: love-poetry}
  love-strong-as-death: {label: "Love is strong as death, jealousy fierce as Sheol; its flames are flames of fire, 'the flame of Yah'", cluster: love-poetry}
  seal-on-heart-and-arm: {label: "Lover asks to be set as a seal (hotam) on the beloved's heart and arm", cluster: love-poetry}
  many-waters-cannot-quench-love: {label: "Many waters cannot quench love nor rivers drown it", cluster: love-poetry}
  love-cannot-be-bought: {label: "If a man offered all the wealth of his house for love he would be utterly scorned", cluster: love-poetry}
  little-sister-without-breasts: {label: "Brothers deliberate over a little sister who has no breasts yet: if she is a wall or a door they will build on or board her", cluster: love-poetry}
  solomons-vineyard-baal-hamon: {label: "Solomon's vineyard at Baal-hamon let out to keepers for a thousand silver; 'my own vineyard is before me'", cluster: love-poetry}
  flee-my-beloved-gazelle: {label: "Closing call to the beloved to flee like a gazelle or young stag on the mountains of spices", cluster: love-poetry}
  awakened-under-apple-tree-where-mother-bore: {label: "Woman awakened her lover under the apple tree where his mother conceived and bore him", cluster: love-poetry}
  who-is-this-coming-up-from-wilderness: {label: "Chorus asks 'Who is this coming up from the wilderness?' of the approaching woman", cluster: love-poetry}
  prophetic-book-superscription: {label: "Book or oracle opens with a heading naming the prophet, his father and the kings in whose days he saw the vision", cluster: prophecy}
  ox-knows-its-owner: {label: "Ox knows its owner and the ass its master's crib, but Israel does not know (animals wiser than God's people)", cluster: prophecy}
  rebellious-children-of-god: {label: "God's people as sons he reared who rebelled against him", cluster: prophecy}
  body-wounded-head-to-foot: {label: "Nation pictured as a body beaten from sole of foot to head, with untended wounds and sores", cluster: prophecy}
  zion-as-booth-in-vineyard: {label: "Daughter Zion left alone like a booth in a vineyard, a hut in a cucumber field, a besieged city", cluster: prophecy}
  leaders-addressed-as-sodom: {label: "Prophet addresses his own rulers and people as 'Sodom' and 'Gomorrah'", cluster: prophecy}
  prophetic-critique-of-sacrifice: {label: "God says he is sated with sacrifices and hates festivals and new moons offered by those whose hands are full of blood", cluster: prophecy}
  sins-scarlet-white-as-snow: {label: "Though sins be like scarlet they shall be white as snow; though red as crimson, like wool", cluster: theology}
  faithful-city-became-harlot: {label: "The faithful city has become a harlot; silver turned to dross, wine diluted with water", cluster: prophecy}
  smelting-away-dross: {label: "God will smelt away the dross of his people as in a furnace to purify them", cluster: prophecy}
  city-renamed-eschatological: {label: "City or people given a new name in the future age (e.g. 'City of Righteousness', 'Hephzibah')", cluster: eschatology}
  sacred-trees-and-gardens-condemned: {label: "Worshippers shamed by the sacred oaks (elim) and gardens they chose", cluster: cult}
  mountain-of-gods-house-highest: {label: "In the latter days the mountain of God's house will be raised above all mountains and all nations will stream to it", cluster: eschatology}
  torah-goes-forth-from-zion: {label: "'From Zion shall go forth Torah and the word of YHWH from Jerusalem'", cluster: eschatology}
  swords-into-plowshares: {label: "Nations will beat swords into plowshares and spears into pruning hooks and learn war no more", cluster: eschatology}
  day-of-yhwh: {label: "The Day of YHWH: a coming day of divine judgment, terror and darkness", cluster: eschatology}
  humbling-of-the-lofty: {label: "On God's day all that is lofty (cedars of Lebanon, oaks of Bashan, towers, ships of Tarshish) is brought low and God alone exalted", cluster: eschatology}
  idols-thrown-to-moles-and-bats: {label: "On that day people throw their silver and gold idols to the moles and bats and flee into clefts of the rocks", cluster: eschatology}
  cease-from-man-with-breath-in-nostrils: {label: "Stop trusting man, who has only breath in his nostrils", cluster: wisdom}
  removal-of-leaders-children-rule: {label: "God removes the mighty, judges, prophets, diviners and counselors and makes boys and infants rule", cluster: prophecy}
  no-one-will-be-ruler: {label: "In collapse a man begs his brother who has a cloak to become their ruler, and he refuses", cluster: prophecy}
  haughty-daughters-of-zion-stripped: {label: "Haughty daughters of Zion walking with mincing steps and jingling anklets are stripped of their finery and made bald", cluster: prophecy}
  catalogue-of-womens-finery: {label: "Long catalogue of women's jewelry and garments (anklets, crescents, amulets, nose-rings, perfume boxes, veils)", cluster: material-culture}
  amulets-and-charms: {label: "Amulets, charms or 'houses of the soul' (bottei ha-nefesh) worn as protection", cluster: magic}
  seven-women-one-man: {label: "Seven women seize one man, offering to feed and clothe themselves if only they may bear his name", cluster: prophecy}
  messianic-branch-tsemah: {label: "The 'branch' or 'sprout' (tsemah) of YHWH or of David as a future figure of glory", cluster: messianism}
  holy-remnant: {label: "A remnant that survives judgment will be called holy and restored", cluster: eschatology}
  written-for-life-in-jerusalem: {label: "Survivors are those 'written for life' in Jerusalem (a heavenly register)", cluster: eschatology}
  cloud-and-fire-canopy-over-zion: {label: "God will create over Mount Zion a cloud by day and flaming fire by night, a canopy (huppah) and booth over all", cluster: eschatology}
  song-of-the-vineyard: {label: "Parable-song of the beloved's vineyard that yielded wild grapes despite all care and is abandoned to briars", cluster: prophecy}
  wordplay-justice-bloodshed: {label: "Prophetic paronomasia: hoped for mishpat (justice) but got mishpah (bloodshed), for tsedaqah but got tse'aqah (outcry)", cluster: prophecy}
  woe-oracle-series: {label: "Series of 'woe' (hoy) oracles against classes of wrongdoers", cluster: prophecy}
  land-grabbing-condemned: {label: "Woe to those who join house to house and field to field until there is no room left", cluster: law}
  drunkards-condemned: {label: "Woe to those who rise early for strong drink and feast with lyre and harp but ignore God's work", cluster: prophecy}
  sheol-opens-its-throat: {label: "Sheol enlarges its appetite and opens its mouth without limit to swallow the people", cluster: afterlife}
  calling-evil-good: {label: "Woe to those who call evil good and good evil, darkness light and bitter sweet", cluster: wisdom}
  outstretched-hand-refrain: {label: "Refrain: 'For all this his anger is not turned back and his hand is stretched out still'", cluster: prophecy}
  god-whistles-for-distant-nation: {label: "God raises a banner and whistles for a nation from the ends of the earth to come as his instrument", cluster: prophecy}
  tireless-invading-army: {label: "The invading army never tires, sleeps or loosens belt or sandal; its horses' hooves like flint, its roar like a lion", cluster: prophecy}
  throne-vision-in-temple: {label: "Prophet sees the Lord seated on a high and lifted-up throne, his train filling the temple", cluster: theophany}
  seraphim-six-winged: {label: "Six-winged seraphim stand above God: two wings cover the face, two the feet, two for flying", cluster: angelology}
  trisagion: {label: "Heavenly beings call 'Holy, holy, holy is YHWH of hosts; the whole earth is full of his glory'", cluster: liturgy}
  temple-filled-with-smoke-thresholds-shake: {label: "At the heavenly voice the doorposts shake and the house fills with smoke", cluster: theophany}
  woe-is-me-unclean-lips: {label: "Prophet cries 'Woe is me, I am undone, a man of unclean lips' for having seen the King", cluster: prophecy}
  burning-coal-purifies-lips: {label: "A seraph touches the prophet's lips with a burning coal from the altar, removing his guilt", cluster: prophecy}
  whom-shall-i-send: {label: "God asks 'Whom shall I send, and who will go for us?' and the prophet volunteers 'Here am I, send me'", cluster: prophecy}
  commission-to-harden-hearts: {label: "Prophet commissioned to make the people's heart fat, ears heavy and eyes shut lest they understand and be healed", cluster: prophecy}
  stump-holy-seed: {label: "Even the tenth that remains will be burned, like a felled terebinth or oak whose stump is the holy seed", cluster: eschatology}
  prophet-meets-king-at-conduit: {label: "Prophet meets the king at the conduit of the upper pool on the highway of the Fuller's Field", cluster: prophecy}
  syro-ephraimite-coalition: {label: "Aram (Rezin) and Israel (Pekah) ally to attack Jerusalem and install a puppet king (son of Tabeel)", cluster: history}
  symbolic-name-of-prophets-child: {label: "Prophet's child bears a symbolic name that is itself an oracle (Shear-yashuv, Maher-shalal-hash-baz)", cluster: prophecy}
  smoldering-firebrands: {label: "Enemy kings dismissed as two smoldering stumps of firebrands", cluster: prophecy}
  faith-or-not-stand: {label: "'If you do not believe (ta'aminu) you will not be established (te'amenu)': faith as condition of survival", cluster: theology}
  king-refuses-to-ask-sign: {label: "King invited to ask any sign 'deep as Sheol or high as heaven' refuses, saying he will not test God", cluster: prophecy}
  immanuel-sign: {label: "Sign: the young woman ('almah) is pregnant and will bear a son and call his name Immanuel ('God with us')", cluster: messianism}
  curds-and-honey-diet: {label: "The child will eat curds and honey until he knows to refuse evil and choose good", cluster: messianism}
  before-child-knows-good-and-evil: {label: "Before a child knows to refuse evil and choose good (or say 'father, mother') the enemy kings' lands will be deserted", cluster: prophecy}
  fly-of-egypt-bee-of-assyria: {label: "God will whistle for the fly of Egypt and the bee of Assyria to settle in the land", cluster: prophecy}
  hired-razor-shaves: {label: "God will shave head, 'hair of the feet' and beard with a razor hired beyond the River (the king of Assyria)", cluster: prophecy}
  land-reverts-to-briers-and-thorns: {label: "Cultivated land worth a thousand silver reverts to briers and thorns (shamir va-shayit), fit only for grazing and hunting", cluster: prophecy}
  prophet-writes-on-large-tablet: {label: "Prophet commanded to write an oracle on a large tablet or scroll before witnesses", cluster: prophecy}
  prophet-and-prophetess-wife: {label: "Prophet goes in to 'the prophetess' (his wife) who bears a sign-child", cluster: prophecy}
  gentle-waters-of-shiloah-rejected: {label: "The people reject the gently flowing waters of Shiloah, so God brings the mighty River (Assyria) to flood them up to the neck", cluster: prophecy}
  invader-as-flooding-river: {label: "Invading empire likened to a river in flood that overflows its banks and sweeps over the land", cluster: prophecy}
  god-with-us-refrain: {label: "Refrain 'Immanuel / for God is with us' against plotting nations", cluster: messianism}
  stone-of-stumbling: {label: "God becomes a sanctuary and a stone of stumbling and rock of offense, a trap and snare to both houses of Israel", cluster: theology}
  testimony-bound-and-sealed-among-disciples: {label: "Bind up the testimony, seal the teaching among my disciples; the prophet waits for the God who hides his face", cluster: prophecy}
  prophet-and-children-as-signs: {label: "The prophet and the children God gave him are signs and portents in Israel", cluster: prophecy}
  chirping-muttering-ghosts: {label: "Ghosts and familiar spirits 'chirp and mutter'; 'should a people consult the dead on behalf of the living?'", cluster: afterlife}
  galilee-of-the-nations: {label: "The land of Zebulun and Naphtali, 'Galilee of the nations' by the way of the sea, first humbled and later glorified", cluster: geography}
  people-in-darkness-see-great-light: {label: "The people walking in darkness have seen a great light; on those in the land of deathly shadow light has shone", cluster: messianism}
  day-of-midian: {label: "Victory compared to 'the day of Midian' (Gideon's rout)", cluster: history}
  boots-and-bloody-garments-burned: {label: "Every trampling soldier's boot and garment rolled in blood will be burned as fuel for fire", cluster: eschatology}
  royal-child-throne-names: {label: "A child is born to us; his throne names are Wonderful Counselor, Mighty God, Everlasting Father, Prince of Peace", cluster: messianism}
  endless-peace-on-davids-throne: {label: "Of the increase of his government and peace there will be no end on David's throne, forever", cluster: messianism}
  zeal-of-yhwh-will-do-this: {label: "'The zeal of YHWH of hosts will accomplish this'", cluster: theology}
  bricks-fallen-we-will-build-with-hewn-stone: {label: "Proud boast: 'Bricks have fallen, we will build with hewn stone; sycamores cut down, we will put cedars in their place'", cluster: prophecy}
  head-and-tail-cut-off: {label: "God cuts off head and tail, palm-branch and reed: the elder is the head, the lying prophet the tail", cluster: prophecy}
  people-devour-one-another: {label: "In famine and wrath each devours the flesh of his own arm; Manasseh devours Ephraim and Ephraim Manasseh", cluster: prophecy}
  unjust-decrees-condemned: {label: "Woe to those who write iniquitous decrees to rob the poor, the widow and the orphan", cluster: law}
  assyria-rod-of-gods-anger: {label: "Assyria is the rod of God's anger and staff of his fury, sent against a godless nation", cluster: theology}
  arrogant-conqueror-boasts-conquests: {label: "Conqueror boasts of cities taken (Calno, Carchemish, Hamath, Arpad, Samaria) and that his own strength and wisdom did it", cluster: kingship}
  gathering-eggs-none-chirped: {label: "Conqueror boasts he gathered the earth like abandoned eggs and none flapped a wing or chirped", cluster: kingship}
  axe-boasts-over-wielder: {label: "Shall the axe boast over the one who hews with it, or the saw magnify itself against its wielder?", cluster: wisdom}
  light-of-israel-becomes-fire: {label: "The Light of Israel becomes a fire and his Holy One a flame that burns the forest in one day", cluster: theophany}
  remnant-will-return: {label: "'A remnant will return' (she'ar yashuv) to the Mighty God, though Israel be as the sand of the sea", cluster: eschatology}
  decreed-destruction-overflowing: {label: "A destruction is decreed (kalah ve-neheratsah), overflowing with righteousness, in the midst of the whole earth", cluster: eschatology}
  yoke-broken-from-neck: {label: "On that day the oppressor's burden departs from your shoulder and his yoke from your neck", cluster: prophecy}
  march-of-the-invader-itinerary: {label: "Poetic itinerary of the invader's advance village by village (Aiath, Migron, Michmash, Geba, Ramah, Gibeah, Anathoth, Nob) to Jerusalem", cluster: prophecy}
  forest-of-lebanon-felled: {label: "The lofty are lopped and the thickets of the forest and Lebanon felled by the Mighty One", cluster: prophecy}
  shoot-from-stump-of-jesse: {label: "A shoot (hoter) will come out from the stump of Jesse and a branch (netser) grow from his roots", cluster: messianism}
  sevenfold-spirit-on-messiah: {label: "The spirit of YHWH rests on him: spirit of wisdom and understanding, counsel and might, knowledge and fear of YHWH", cluster: messianism}
  messiah-judges-not-by-sight: {label: "The ideal king judges not by what his eyes see or ears hear, but with righteousness for the poor", cluster: messianism}
  slays-wicked-with-breath-of-lips: {label: "He strikes the earth with the rod of his mouth and slays the wicked with the breath of his lips", cluster: messianism}
  peaceable-kingdom-animals: {label: "Wolf dwells with lamb, leopard with kid, lion eats straw like the ox, and a little child leads them", cluster: eschatology}
  infant-plays-over-serpents-den: {label: "The nursing child plays over the hole of the asp and the weaned child puts his hand on the adder's den", cluster: eschatology}
  earth-full-of-knowledge-of-god: {label: "The earth will be full of the knowledge of YHWH as the waters cover the sea", cluster: eschatology}
  root-of-jesse-as-ensign: {label: "The root of Jesse stands as a banner to the peoples; the nations seek him", cluster: messianism}
  second-exodus: {label: "God will redeem his people a second time with a new exodus: drying the sea, splitting the River, a highway as in the day they came up from Egypt", cluster: eschatology}
  four-corners-of-the-earth: {label: "God gathers the dispersed from the four corners (kanfot, 'wings') of the earth", cluster: cosmology}
  reconciliation-of-ephraim-and-judah: {label: "The jealousy of Ephraim and Judah will cease", cluster: eschatology}
  river-split-into-seven-streams: {label: "God strikes the River with his scorching wind into seven streams so it can be crossed in sandals", cluster: eschatology}
  highway-for-returning-remnant: {label: "A highway (mesillah) for the remnant returning from Assyria or exile", cluster: eschatology}
  draw-water-from-wells-of-salvation: {label: "'With joy you will draw water from the wells of salvation'", cluster: liturgy}
  yah-my-strength-and-song: {label: "'Yah is my strength and my song, he has become my salvation' (quoted from the Song of the Sea)", cluster: liturgy}
  massa-oracle-heading: {label: "Oracle headed 'massa' (burden) against a named nation or place", cluster: prophecy}
  gods-consecrated-warriors-mustered: {label: "God musters his consecrated ones and mighty men; a host from the end of heaven, the weapons of his wrath", cluster: eschatology}
  destruction-from-shaddai: {label: "Wordplay: the Day comes 'like destruction (shod) from Shaddai'", cluster: eschatology}
  terror-like-woman-in-labor: {label: "Terrified people seized by pangs, writhing like a woman in labor", cluster: prophecy}
  stars-sun-and-moon-darkened: {label: "Stars and constellations (kesilim) give no light, the sun is dark at its rising and the moon does not shine", cluster: eschatology}
  heavens-shaken-earth-moved: {label: "God makes the heavens tremble and the earth shake from its place on the day of his wrath", cluster: eschatology}
  man-rarer-than-gold-of-ophir: {label: "God makes mortals rarer than fine gold, humans than the gold of Ophir", cluster: eschatology}
  medes-incorruptible-by-silver: {label: "God stirs up the Medes, who care nothing for silver or gold", cluster: history}
  babylon-overthrown-like-sodom: {label: "Babylon, glory of kingdoms, will be overthrown like Sodom and Gomorrah", cluster: prophecy}
  ruined-city-haunted-by-desert-creatures: {label: "Ruined city never reinhabited, even by Arab tents or shepherds; inhabited by desert creatures, ostriches, jackals and dancing goat-demons (se'irim)", cluster: demonology}
  foreigners-join-house-of-jacob: {label: "Strangers (gerim) will join themselves to Israel and cleave to the house of Jacob", cluster: eschatology}
  captors-become-captives: {label: "Reversal: Israel will take captive those who captured them and rule over their oppressors", cluster: eschatology}
  taunt-song-over-fallen-tyrant: {label: "Mocking dirge (mashal) over a fallen tyrant: 'How the oppressor has ceased!'", cluster: prophecy}
  trees-rejoice-at-tyrants-fall: {label: "The cypresses and cedars of Lebanon rejoice that no woodcutter comes up since the tyrant fell", cluster: prophecy}
  sheol-rouses-dead-kings-to-greet: {label: "Sheol below is stirred to meet the arriving tyrant; the shades and dead kings rise from their thrones to greet him: 'you too have become weak like us'", cluster: afterlife}
  maggots-as-bed-and-covering: {label: "In the underworld maggots are spread beneath the dead king and worms are his covering", cluster: afterlife}
  helel-ben-shahar-falls: {label: "'How you have fallen from heaven, Helel son of Shahar (Shining One, son of Dawn)!' - a star-figure cast down to earth", cluster: mythology}
  ascent-above-stars-of-el: {label: "The proud one plans to ascend to heaven, raise his throne above the stars of El and make himself like Elyon", cluster: mythology}
  mount-of-assembly-in-north: {label: "The mount of assembly (har mo'ed) in the recesses of the north (yarkete tsafon), seat of the gods", cluster: mythology}
  cast-down-to-depths-of-pit: {label: "The would-be god is brought down instead to Sheol, to the recesses of the pit (yarkete bor)", cluster: afterlife}
  tyrant-denied-burial: {label: "The fallen king is cast out of his grave like a loathed branch, unburied among the slain, while other kings lie in honor", cluster: afterlife}
  name-and-remnant-cut-off: {label: "God cuts off from the enemy 'name and remnant, offspring and posterity'", cluster: prophecy}
  swept-with-broom-of-destruction: {label: "God sweeps the city with the broom of destruction, leaving it to hedgehogs and marshes", cluster: prophecy}
  divine-oath-plan-stands: {label: "God swears that as he has planned so it shall be; his purpose for the whole earth no one can annul", cluster: theology}
  flying-seraph-from-serpent-root: {label: "From the serpent's root comes an adder, and its fruit is a flying seraph (saraf me'ofef)", cluster: mythology}
  smoke-from-the-north: {label: "Smoke (an army) comes out of the north against the doomed people", cluster: prophecy}
  zion-founded-refuge-of-poor: {label: "YHWH has founded Zion, and in her the afflicted of his people find refuge", cluster: zion}
  lament-over-moab: {label: "Prophetic lament over Moab's ruin naming its towns (Ar, Kir, Dibon, Nebo, Medeba, Heshbon, Elealeh, Zoar, Nimrim)", cluster: prophecy}
  mourning-rites-baldness-beards-sackcloth: {label: "Mourners shave heads bald, cut off beards, gird sackcloth and wail on rooftops and in squares", cluster: mourning}
  prophet-weeps-for-enemy-nation: {label: "The prophet's own heart cries out and his bowels moan like a lyre for a foreign enemy nation", cluster: prophecy}
  waters-full-of-blood: {label: "Waters of a land run full of blood as a sign of judgment", cluster: prophecy}
  refugees-sheltered-plea: {label: "Plea to shelter the outcasts and not betray the fugitive; be a hiding place from the destroyer", cluster: law}
  throne-established-in-hesed-tent-of-david: {label: "A throne established in steadfast love, with a judge in the tent of David seeking justice", cluster: messianism}
  vine-of-sibmah-mourned: {label: "The vine of Sibmah, whose shoots reached Jazer and the sea, is mourned; the harvest shout (hedad) is silenced", cluster: prophecy}
  futile-prayer-at-high-place: {label: "The nation wearies itself at its high place and comes to its sanctuary to pray but cannot prevail", cluster: cult}
  years-of-hireling: {label: "Time limit given 'in three years, like the years of a hired worker'", cluster: prophecy}
  city-becomes-heap-of-ruins: {label: "A great city (Damascus, Babylon, the 'city of chaos') ceases to be a city and becomes a heap of ruins for flocks", cluster: prophecy}
  gleaning-remnant-olive-beating: {label: "Remnant left like gleanings at the olive-beating: two or three berries at the top of the bough", cluster: eschatology}
  turning-from-altars-to-maker: {label: "On that day people look to their Maker, not to altars, Asherahs and incense-stands (hammanim) made by their fingers", cluster: cult}
  gardens-of-adonis: {label: "Plantings of 'pleasant ones' (nit'ei na'amanim) and a foreign god's slips that sprout quickly and wither in a day", cluster: cult}
  roaring-nations-like-seas-rebuked: {label: "The nations roar like many waters but God rebukes them and they flee like chaff before wind; by morning they are gone", cluster: mythology}
  land-of-whirring-wings-cush: {label: "'Land of whirring wings' beyond the rivers of Cush, sending envoys in papyrus vessels to a tall, smooth-skinned people", cluster: geography}
  god-watches-silently-from-dwelling: {label: "God says he will quietly look on from his dwelling like shimmering heat in sunshine, like a cloud of dew in harvest heat", cluster: theology}
  pruning-before-harvest-judgment: {label: "Judgment as pruning the shoots with knives before the harvest; carcasses left for birds of prey and beasts all summer and winter", cluster: prophecy}
  distant-nation-brings-gifts-to-zion: {label: "A distant people (Cush) brings tribute to YHWH at Mount Zion, the place of his name", cluster: eschatology}
  god-rides-swift-cloud: {label: "YHWH rides on a swift cloud and comes to Egypt; Egypt's idols tremble before him", cluster: theophany}
  civil-war-egyptian-against-egyptian: {label: "God stirs up Egyptian against Egyptian, city against city, kingdom against kingdom", cluster: prophecy}
  egyptian-necromancers-consulted: {label: "Egypt consults its idols, the 'ittim (mutterers), ghosts and familiar spirits", cluster: magic}
  nile-dries-up: {label: "The Nile dries up, reeds wither, fishermen mourn and flax-workers and weavers despair", cluster: prophecy}
  foolish-counselors-of-pharaoh: {label: "The wise counselors of Pharaoh in Zoan and Memphis are fools: 'I am a son of the wise, a son of ancient kings'", cluster: wisdom}
  spirit-of-confusion-like-drunkard: {label: "God mixes a spirit of distortion in Egypt so it staggers like a drunkard in his vomit", cluster: prophecy}
  five-cities-speak-language-of-canaan: {label: "Five cities in Egypt will speak the language of Canaan and swear to YHWH; one called 'City of the Sun/Destruction' (ir ha-heres)", cluster: eschatology}
  altar-to-yhwh-in-egypt: {label: "An altar to YHWH in the midst of Egypt and a standing stone (matsevah) at its border", cluster: cult}
  egypt-cries-and-god-sends-savior: {label: "When Egypt cries out because of oppressors God sends them a savior; Egypt knows YHWH and offers sacrifice", cluster: eschatology}
  egypt-assyria-israel-blessed: {label: "A highway from Egypt to Assyria; 'Blessed be Egypt my people, Assyria the work of my hands, and Israel my inheritance'", cluster: eschatology}
  prophet-walks-naked-and-barefoot: {label: "Prophet walks naked and barefoot for three years as a sign of captives to be led away", cluster: prophecy}
  sign-act-of-prophet: {label: "Prophet performs a symbolic action as a sign and portent (ot u-mofet)", cluster: prophecy}
  sargon-and-ashdod: {label: "Dated to the year the tartan, sent by Sargon king of Assyria, took Ashdod", cluster: history}
  reliance-on-egypt-condemned: {label: "Judah (or allies) put trust in Egypt and Cush for help against Assyria and are put to shame", cluster: prophecy}
  wilderness-of-the-sea-oracle: {label: "Oracle on 'the wilderness of the sea' (Babylon): whirlwinds from the Negev, Elam and Media summoned to attack", cluster: prophecy}
  prophet-convulsed-by-vision: {label: "The vision seizes the prophet with labor pains; he is bowed down, terrified and his twilight pleasure turns to trembling", cluster: prophecy}
  feast-interrupted-arm-for-war: {label: "'Set the table, spread the rugs, eat, drink - rise, princes, oil the shield!'", cluster: prophecy}
  watchman-posted-to-report: {label: "Prophet told to post a watchman who reports what he sees (riders in pairs, donkeys, camels) and stands day and night", cluster: prophecy}
  fallen-is-babylon: {label: "Cry 'Fallen, fallen is Babylon!' and all her idols shattered on the ground", cluster: prophecy}
  watchman-what-of-the-night: {label: "Oracle of Dumah: 'Watchman, what of the night?' 'Morning comes, and also the night; if you will ask, ask; come back again'", cluster: prophecy}
  arabian-caravans-and-kedar: {label: "Oracle on Arabia: caravans of Dedanites lodge in the thickets; Tema brings water and bread to fugitives; glory of Kedar ends", cluster: geography}
  valley-of-vision: {label: "Oracle on 'the valley of vision' (Jerusalem) whose people revel on rooftops while the day of tumult comes", cluster: prophecy}
  prophet-refuses-comfort: {label: "Prophet: 'Look away from me, let me weep bitterly; do not try to comfort me over the ruin of my people'", cluster: prophecy}
  siege-preparations-without-looking-to-god: {label: "City prepares for siege (armory of the House of the Forest, counting houses, tearing them down for the wall, a reservoir between walls) but does not look to its Maker", cluster: prophecy}
  eat-drink-for-tomorrow-we-die: {label: "Revelers say 'Let us eat and drink, for tomorrow we die' when called to mourning", cluster: wisdom}
  unforgivable-sin-until-death: {label: "God swears this iniquity will not be atoned for until they die", cluster: theology}
  steward-shebna-rock-tomb: {label: "The steward Shebna, 'over the house', rebuked for hewing himself a lofty tomb in the rock", cluster: history}
  hurled-like-a-ball: {label: "God will wind the official up and hurl him like a ball into a wide land, where he and his glorious chariots will die", cluster: prophecy}
  key-of-house-of-david: {label: "God places the key of the house of David on the new steward's shoulder: what he opens none shall shut, what he shuts none shall open", cluster: kingship}
  peg-in-secure-place: {label: "Official fastened like a peg in a secure place on which his family's honor hangs; the peg will later give way", cluster: kingship}
  investiture-with-robe-and-sash: {label: "Successor clothed with the predecessor's robe and sash and given his authority", cluster: kingship}
  oracle-on-tyre-and-sidon: {label: "Oracle on Tyre and Sidon: ships of Tarshish wail, the merchant city whose traders were princes is laid waste", cluster: prophecy}
  sea-speaks-childless: {label: "The Sea, stronghold of the sea, speaks: 'I have not labored nor given birth nor raised young men or virgins'", cluster: mythology}
  seventy-years-of-forgetting: {label: "A city forgotten for seventy years, 'like the days of one king', then visited again by God", cluster: prophecy}
  song-of-the-harlot: {label: "The forgotten city is told to take a lyre and go about like a forgotten harlot singing to be remembered", cluster: prophecy}
  harlots-hire-holy-to-yhwh: {label: "The city's trade and harlot's hire will be holy to YHWH, feeding and clothing those who dwell before him", cluster: cult}
units:
  - id: hb-song-6-beloved-unique
    tradition: judaism
    title: Where has your beloved gone; the beloved unique among queens
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Song 6:1-12"]
    tags:
      - {motif: lover-goes-down-to-garden, refs: ["Song 6:2", "Song 6:11"], note: "garden, beds of spices, lilies; 'nut garden' (ginnat egoz) to see if vines and pomegranates have budded"}
      - {motif: mutual-belonging-formula, refs: ["Song 6:3"]}
      - {motif: wasf-body-description, refs: ["Song 6:5-7"], note: "hair like goats down Gilead, teeth like ewes from the washing, temple like a slice of pomegranate"}
      - {motif: beloved-unique-among-queens, refs: ["Song 6:8-9"], note: "sixty queens, eighty concubines"}
      - {motif: beloved-like-dawn-moon-sun, refs: ["Song 6:10", "Song 6:4"], note: "levanah (moon), hammah (sun); 'awesome as bannered hosts' (nidgalot) twice; compared to the cities Tirzah and Jerusalem"}
    hints:
      - "Rev 12:1 (woman clothed with the sun, moon under her feet); Mariological use of Song 6:10 ('pulchra ut luna, electa ut sol')."
      - "Egyptian love songs (Chester Beatty I) describe the beloved as unique ('the One, the sister without peer') and use body-catalogue."
  - id: hb-song-7-shulammite
    tradition: judaism
    title: The Shulammite's dance and the palm tree
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Song 7:1-14"]
    tags:
      - {motif: shulammite-dance, refs: ["Song 7:1"], note: "'dance of Mahanaim'; Shulammite only named here"}
      - {motif: wasf-body-description, refs: ["Song 7:2-6"], note: "feet to head: thighs like jewels by a craftsman, navel a round bowl never lacking mixed wine, belly a heap of wheat hedged with lilies, neck an ivory tower, eyes pools of Heshbon, nose like tower of Lebanon facing Damascus, head like Carmel; 'a king is held captive in the tresses'"}
      - {motif: beloved-as-palm-climbed, refs: ["Song 7:8-9"]}
      - {motif: mutual-belonging-formula, refs: ["Song 7:11"], note: "'his desire (teshuqah) is for me' reverses Gen 3:16"}
      - {motif: lovers-go-out-to-fields-and-vineyards, refs: ["Song 7:12-13"]}
      - {motif: mandrakes-fertility, refs: ["Song 7:14"], note: "duda'im give their fragrance; fruits new and old stored up"}
    hints:
      - "Song 7:11 'his desire is for me' (teshuqato) inverts Gen 3:16; rabbinic and patristic readings of the Shulammite as Israel/Church."
  - id: hb-song-8-love-strong-as-death
    tradition: judaism
    title: Seal on the heart; love strong as death; the little sister; Solomon's vineyard
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Song 8:1-14"]
    tags:
      - {motif: wish-lover-were-brother, refs: ["Song 8:1-2"], note: "spiced wine and pomegranate juice"}
      - {motif: adjuration-of-daughters-of-jerusalem, refs: ["Song 8:4"]}
      - {motif: who-is-this-coming-up-from-wilderness, refs: ["Song 8:5"]}
      - {motif: awakened-under-apple-tree-where-mother-bore, refs: ["Song 8:5"]}
      - {motif: seal-on-heart-and-arm, refs: ["Song 8:6"]}
      - {motif: love-strong-as-death, refs: ["Song 8:6"], note: "reshafeha rishpei esh: 'its reshefs are reshefs of fire' (cf. the god Resheph); shalhevetyah, 'flame of Yah', the book's only divine name"}
      - {motif: many-waters-cannot-quench-love, refs: ["Song 8:7"], note: "mayim rabbim, the cosmic waters"}
      - {motif: love-cannot-be-bought, refs: ["Song 8:7"]}
      - {motif: little-sister-without-breasts, refs: ["Song 8:8-10"], note: "'I am a wall and my breasts like towers'; 'one who finds shalom'"}
      - {motif: solomons-vineyard-baal-hamon, refs: ["Song 8:11-12"], note: "thousand to Solomon, two hundred to the keepers"}
      - {motif: flee-my-beloved-gazelle, refs: ["Song 8:14"]}
    hints:
      - "Love vs. Death (Mot) and Sea (many waters) evoke Ugaritic Baal cycle; Resheph is a Canaanite plague/fire god."
      - "Mishnah Yadayim 3:5 (R. Akiva: Song is holy of holies); Christian bridal mysticism (Bernard of Clairvaux)."
  - id: hb-isa-1-indictment-of-judah
    tradition: judaism
    title: Hear, O heavens; the great indictment, sacrifice rejected, the faithful city
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Isa 1:1-31"]
    tags:
      - {motif: prophetic-book-superscription, refs: ["Isa 1:1"], note: "Uzziah, Jotham, Ahaz, Hezekiah"}
      - {motif: covenant-lawsuit-heaven-and-earth, refs: ["Isa 1:2"]}
      - {motif: heaven-and-earth-summoned-to-listen, refs: ["Isa 1:2"]}
      - {motif: rebellious-children-of-god, refs: ["Isa 1:2", "Isa 1:4"]}
      - {motif: ox-knows-its-owner, refs: ["Isa 1:3"]}
      - {motif: body-wounded-head-to-foot, refs: ["Isa 1:5-6"]}
      - {motif: zion-as-booth-in-vineyard, refs: ["Isa 1:8"]}
      - {motif: holy-remnant, refs: ["Isa 1:9"], note: "'had YHWH of hosts not left us a few survivors we would be like Sodom'"}
      - {motif: leaders-addressed-as-sodom, refs: ["Isa 1:9-10"]}
      - {motif: prophetic-critique-of-sacrifice, refs: ["Isa 1:11-15"], note: "who asked you to trample my courts; new moon and sabbath; 'your hands are full of blood'"}
      - {motif: god-loves-stranger-orphan-widow, refs: ["Isa 1:17", "Isa 1:23"]}
      - {motif: sins-scarlet-white-as-snow, refs: ["Isa 1:18"]}
      - {motif: faithful-city-became-harlot, refs: ["Isa 1:21-22"]}
      - {motif: bribe-blinds-the-wise, refs: ["Isa 1:23"], note: "princes love bribes and chase gifts"}
      - {motif: divine-epithets-mighty-one-of-jacob-stone-of-israel, refs: ["Isa 1:24"], note: "'Avir Yisrael', Mighty One of Israel"}
      - {motif: smelting-away-dross, refs: ["Isa 1:25"]}
      - {motif: city-renamed-eschatological, refs: ["Isa 1:26"], note: "'City of Righteousness, Faithful Town'"}
      - {motif: sacred-trees-and-gardens-condemned, refs: ["Isa 1:29-30"]}
