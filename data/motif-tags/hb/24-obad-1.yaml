new_motifs:
  day-of-yhwh: {label: "The Day of YHWH is announced as near: a day of judgment, darkness and wrath", cluster: eschatology}
  envoy-sent-among-nations-to-rouse-war: {label: "An envoy is sent among the nations to summon them to battle against a people", cluster: prophecy}
  proud-nest-among-stars-brought-down: {label: "The proud one who builds his nest high as the eagle or among the stars is brought down by God", cluster: prophecy}
  edom-dwells-in-clefts-of-rock: {label: "Edom dwells in the clefts of the rock (sela) and thinks no one can bring it down", cluster: geography}
  thieves-and-grape-gatherers-leave-gleanings: {label: "Even thieves and grape-gatherers leave something behind, but the coming destruction leaves nothing", cluster: prophecy}
  allies-betray-ally: {label: "A nation's treaty partners and table companions deceive and overpower it", cluster: prophecy}
  wisdom-of-edom-teman: {label: "Edom and Teman are famed for wise men whose wisdom God will destroy", cluster: wisdom}
  edom-violence-against-brother-jacob: {label: "Edom condemned for violence against its brother Jacob in the day of Jerusalem's fall", cluster: prophecy}
  lots-cast-over-conquered-city: {label: "Conquerors cast lots over a captured city or its nobles", cluster: warfare}
  gloating-over-brothers-calamity: {label: "Prohibition of gloating over, looting or handing over one's brother on the day of his calamity", cluster: ethics}
  fugitives-cut-off-at-crossroads: {label: "The enemy stands at the crossroads to cut off and hand over the fleeing survivors", cluster: warfare}
  as-you-have-done-it-shall-be-done-to-you: {label: "Measure for measure: as you have done, so it shall be done to you; your deed returns on your head", cluster: theology}
  jacob-fire-esau-stubble: {label: "The house of Jacob will be fire and the house of Esau stubble consumed without survivor", cluster: prophecy}
  exiles-in-sepharad-and-zarephath: {label: "Exiles of Jerusalem in Sepharad and of Israel as far as Zarephath will repossess the land", cluster: geography}
  saviors-on-mount-zion-kingdom-to-yhwh: {label: "Saviors ascend Mount Zion to judge Mount Esau, and the kingship shall be YHWH's", cluster: eschatology}
  refuge-on-mount-zion: {label: "On Mount Zion there will be escape (peletah) and holiness in the coming judgment", cluster: eschatology}
  prophet-flees-from-gods-commission: {label: "A prophet commissioned by God flees 'from the presence of YHWH' rather than deliver the message", cluster: prophecy}
  ship-from-joppa-to-tarshish: {label: "Hero goes down to Joppa, pays the fare and boards a ship bound for Tarshish", cluster: geography}
  great-city-wickedness-rises-before-god: {label: "The wickedness of a great city rises up before God, who sends a prophet to cry against it", cluster: prophecy}
  god-hurls-storm-on-sea: {label: "God hurls a great wind on the sea and the ship is about to break up", cluster: sea}
  sailors-each-cry-to-own-god: {label: "In the storm the sailors each cry out to their own god", cluster: sea}
  cargo-jettisoned-in-storm: {label: "Sailors throw the cargo overboard to lighten the ship in a storm", cluster: sea}
  sleeper-in-ship-during-storm: {label: "A man of God lies fast asleep in the hold while the storm threatens the ship, and is woken by others", cluster: sea}
  captain-urges-sleeper-to-pray: {label: "The ship's captain wakes the sleeper and urges him to call on his god that they may not perish", cluster: sea}
  lots-cast-to-find-culprit-of-storm: {label: "Sailors cast lots to learn on whose account the disaster has come, and the lot falls on the prophet", cluster: sea}
  sailors-interrogate-stranger: {label: "Strangers question the hero: your occupation, where you come from, your land and your people", cluster: narrative}
  god-of-heaven-made-sea-and-dry-land: {label: "Confession of the God of heaven who made the sea and the dry land", cluster: theology}
  man-thrown-overboard-to-calm-sea: {label: "A man is thrown into the sea at his own request so that the storm will cease, and the sea grows calm", cluster: sea}
  rowing-to-shore-in-vain: {label: "The sailors row hard to bring the ship back to land but cannot against the storm", cluster: sea}
  prayer-not-to-incur-innocent-blood: {label: "Those about to kill a man pray that God not hold his innocent blood against them", cluster: ethics}
  gentile-sailors-fear-and-sacrifice-to-yhwh: {label: "Gentile sailors, saved from the storm, fear YHWH, offer sacrifice and make vows", cluster: conversion}
  prophet-swallowed-by-great-fish: {label: "God appoints a great fish to swallow the prophet", cluster: sea}
  three-days-three-nights-in-belly: {label: "Hero stays three days and three nights in the belly of a fish or in the underworld", cluster: sea}
  prayer-from-belly-of-fish: {label: "The prophet prays to God from inside the fish", cluster: prayer}
  belly-of-sheol: {label: "The speaker cries from 'the belly of Sheol' (beten sheol)", cluster: underworld}
  cast-into-heart-of-seas: {label: "The speaker is cast into the deep, the heart of the seas, with the current around him", cluster: underworld}
  seaweed-wrapped-around-head: {label: "Reeds or seaweed (suf) are wrapped round the drowning man's head", cluster: underworld}
  bars-of-earth-roots-of-mountains: {label: "The speaker goes down to the roots (or cut-offs) of the mountains where the earth's bars close behind him forever", cluster: underworld}
  prayer-reaches-holy-temple: {label: "The dying man remembers God and his prayer reaches God's holy temple; he looks again toward the temple", cluster: prayer}
  salvation-belongs-to-yhwh: {label: "Declaration 'Salvation belongs to YHWH'", cluster: theology}
  fish-vomits-prophet-onto-land: {label: "At God's command the fish vomits the prophet onto dry land", cluster: sea}
  prophet-commissioned-second-time: {label: "The word of God comes to the prophet a second time with the same commission", cluster: prophecy}
  nineveh-three-days-walk: {label: "Nineveh is an exceedingly great city of three days' walk", cluster: geography}
  forty-days-and-city-overturned: {label: "A prophet announces: 'Forty more days and the city will be overturned'", cluster: prophecy}
  whole-city-repents-at-warning: {label: "A whole foreign city believes the prophet's warning, proclaims a fast and puts on sackcloth from greatest to least", cluster: repentance}
  king-leaves-throne-sits-in-ashes: {label: "The king rises from his throne, removes his robe, covers himself with sackcloth and sits in ashes", cluster: repentance}
  animals-fast-and-wear-sackcloth: {label: "By royal decree even the cattle and flocks fast, drink no water and are covered in sackcloth", cluster: repentance}
  repent-of-violence-in-hands: {label: "Each is to turn from his evil way and from the violence (hamas) in his hands", cluster: repentance}
  who-knows-god-may-turn: {label: "'Who knows? God may turn and relent' as a ground for repentance", cluster: repentance}
  repentance-averts-announced-doom: {label: "God sees the people's repentance and does not carry out the announced destruction", cluster: repentance}
  prophet-angry-at-divine-mercy: {label: "The prophet is bitterly angry that God has spared the sinners", cluster: prophecy}
  prophet-asks-god-to-take-his-life: {label: "Prophet asks God to take his life: 'my death is better than my life'", cluster: prophecy}
  prophet-sits-in-booth-to-watch-city: {label: "The prophet sits in a booth east of the city to see what will become of it", cluster: prophecy}
  miraculous-shade-plant: {label: "God makes a plant (qiqayon, gourd or castor) grow overnight to shade the prophet", cluster: nature}
  worm-destroys-plant-at-dawn: {label: "God appoints a worm that at dawn attacks the shade plant so it withers", cluster: nature}
  scorching-east-wind: {label: "God sends a scorching east wind (ruah qadim harishit) and the sun beats on the man's head till he faints", cluster: nature}
  lesson-of-withered-plant: {label: "God argues from the prophet's pity for a plant that grew and perished in a night to his own pity for a city", cluster: theology}
  city-of-twelve-myriads-who-know-not-right-from-left: {label: "Nineveh has more than 120,000 people who do not know their right hand from their left", cluster: theology}
  god-pities-animals-of-city: {label: "God's compassion extends to the many animals of the city", cluster: theology}
  god-appoints-agents-wayeman: {label: "God 'appoints' (wayeman) a series of natural agents: fish, plant, worm, wind", cluster: theology}
  book-ends-with-divine-question: {label: "A book ends with an unanswered question from God", cluster: literary}
  god-treads-high-places-of-earth: {label: "God comes forth from his place, descends and treads on the high places of the earth", cluster: theophany}
  idols-as-harlots-hire: {label: "A city's idols and cult objects were gathered from a harlot's hire and will return to a harlot's hire", cluster: idolatry}
  prophet-goes-naked-and-barefoot-mourning: {label: "The prophet goes stripped and barefoot, wailing like jackals and mourning like ostriches", cluster: prophecy}
  wordplay-on-town-names-in-lament: {label: "A lament puns on the names of a series of towns (dust in Beth-leaphrah, Achzib deceives)", cluster: literary}
  baldness-like-vulture-mourning: {label: "Mourners shave themselves bald like the vulture (nesher) for exiled children", cluster: mourning}
  evil-plotted-on-beds: {label: "The wicked devise evil on their beds and carry it out at morning light", cluster: ethics}
  seizing-fields-and-houses: {label: "The powerful covet and seize fields and houses, oppressing a man and his inheritance", cluster: ethics}
  people-forbid-prophets-to-preach: {label: "The people tell the prophets: 'Do not preach (drip) these things'", cluster: prophecy}
  prophet-of-wine-and-strong-drink: {label: "The people want a lying prophet who preaches of wine and strong drink", cluster: prophecy}
  the-breaker-goes-before-them: {label: "'The breaker' (ha-porets) goes up before the gathered flock, their king passes before them, YHWH at their head", cluster: messianism}
  rulers-devour-people-like-meat-in-cauldron: {label: "Rulers flay the people, break their bones and chop them like meat in a cauldron", cluster: ethics}
  prophets-cry-peace-for-food: {label: "Prophets cry 'Peace' when fed and declare holy war on whoever puts nothing in their mouths", cluster: prophecy}
  night-instead-of-vision: {label: "False seers will have night without vision; the sun sets on the prophets and there is no answer from God", cluster: prophecy}
  seers-cover-their-lip: {label: "Shamed seers cover their upper lip (mustache), a mourning or leper's gesture", cluster: mourning}
  prophet-filled-with-spirit-and-might: {label: "The true prophet is filled with power by the spirit of YHWH to declare Israel's sin", cluster: prophecy}
  city-built-with-blood: {label: "Woe to the one who builds a city (Zion) with bloodshed and injustice", cluster: ethics}
  priests-and-prophets-for-hire: {label: "Judges take bribes, priests teach for a price, prophets divine for money", cluster: ethics}
  false-security-god-among-us: {label: "The corrupt leaders say 'Is not YHWH among us? No evil will come on us'", cluster: theology}
  zion-plowed-as-field: {label: "Zion will be plowed as a field, Jerusalem a heap of ruins, the temple mount a wooded height", cluster: prophecy}
  mountain-of-yhwh-highest-of-mountains: {label: "In the latter days the mountain of YHWH's house will be raised above all mountains and the nations will stream to it", cluster: eschatology}
  torah-goes-forth-from-zion: {label: "Out of Zion goes forth Torah and the word of YHWH from Jerusalem", cluster: eschatology}
  swords-into-plowshares: {label: "Nations beat swords into plowshares and spears into pruning hooks and learn war no more", cluster: eschatology}
  each-nation-walks-in-name-of-its-god: {label: "All peoples walk each in the name of its god, but we walk in the name of YHWH", cluster: theology}
  lame-and-outcast-gathered: {label: "God gathers the lame and the outcast and makes them a strong remnant", cluster: eschatology}
  migdal-eder-tower-of-flock: {label: "Migdal Eder, 'tower of the flock', hill of daughter Zion, to which the former dominion returns", cluster: messianism}
  daughter-zion-in-labor: {label: "Daughter Zion writhes like a woman in labor", cluster: prophecy}
  redemption-from-babylon-announced: {label: "Zion will go to Babylon and there be rescued and redeemed", cluster: prophecy}
  nations-gathered-like-sheaves-to-threshing-floor: {label: "God gathers the nations like sheaves to the threshing floor without their knowing his plan", cluster: prophecy}
  zion-threshes-with-iron-horn: {label: "Daughter Zion threshes the peoples with a horn of iron and hooves of bronze, devoting their wealth to God", cluster: prophecy}
  judge-of-israel-struck-on-cheek: {label: "The judge (ruler) of Israel is struck on the cheek with a rod", cluster: prophecy}
  ruler-from-bethlehem-ephrathah: {label: "From little Bethlehem Ephrathah will come a ruler whose origins are from of old, from ancient days", cluster: messianism}
  until-she-in-labor-gives-birth: {label: "Israel is given up until she who is in labor has given birth", cluster: messianism}
  seven-shepherds-eight-princes: {label: "Seven shepherds and eight princes of men will be raised against Assyria", cluster: messianism}
  assyria-land-of-nimrod: {label: "Assyria is called the land of Nimrod", cluster: geography}
  remnant-like-dew-from-yhwh: {label: "The remnant of Jacob among the peoples is like dew from YHWH that waits for no man", cluster: prophecy}
  remnant-like-lion-among-flocks: {label: "The remnant of Jacob among the nations is like a lion among the beasts of the forest", cluster: prophecy}
  god-purges-horses-cities-and-sorcery: {label: "In that day God cuts off horses, chariots, fortresses, sorceries, soothsayers, idols, pillars and asherim from his own people", cluster: prophecy}
  my-people-what-have-i-done-to-you: {label: "God's plea: 'My people, what have I done to you? How have I wearied you? Answer me'", cluster: prophecy}
  moses-aaron-miriam-sent: {label: "God sent Moses, Aaron and Miriam before the people (Miriam named as a leader)", cluster: exodus}
  balak-and-balaam-remembered: {label: "Remember what Balak king of Moab plotted and how Balaam son of Beor answered him", cluster: exodus}
  offer-firstborn-for-sin-rejected: {label: "Shall I give my firstborn for my transgression? Thousands of rams and rivers of oil do not please God", cluster: cult}
  do-justice-love-mercy-walk-humbly: {label: "What God requires: to do justice, love hesed and walk humbly with your God", cluster: ethics}
  futility-curse-sow-not-reap: {label: "Futility curse: you will sow but not reap, tread olives but not anoint, eat but not be satisfied", cluster: curse}
  statutes-of-omri-and-ahab: {label: "The people keep the statutes of Omri and all the works of the house of Ahab", cluster: kingship}
  no-righteous-left-like-gleaned-vineyard: {label: "The godly have vanished from the land like a vineyard after gleaning with no cluster to eat", cluster: ethics}
  family-members-become-enemies: {label: "Son dishonors father, daughter rises against mother, daughter-in-law against mother-in-law; a man's enemies are his own household", cluster: eschatology}
  trust-no-friend-guard-mouth-from-wife: {label: "Trust no neighbor or friend; guard your mouth even from the wife in your bosom", cluster: wisdom}
  i-fell-i-rise-god-my-light: {label: "'Do not rejoice over me, my enemy: though I fall I shall rise; though I sit in darkness YHWH is my light'", cluster: psalmody}
  sins-cast-into-depths-of-sea: {label: "God will cast all their sins into the depths of the sea", cluster: theology}
  truth-to-jacob-hesed-to-abraham: {label: "God will show truth to Jacob and steadfast love to Abraham as he swore to the fathers", cluster: theology}
  god-avenger-lord-of-wrath: {label: "YHWH is an avenging God (noqem), 'lord of wrath' (ba'al hemah), keeping anger for his enemies", cluster: theology}
  clouds-dust-of-gods-feet: {label: "God's way is in whirlwind and storm, and the clouds are the dust of his feet", cluster: theophany}
  god-rebukes-sea-and-dries-rivers: {label: "God rebukes the sea and dries it up and makes all rivers fail; Bashan, Carmel and Lebanon wither", cluster: theophany}
  who-can-stand-before-gods-wrath: {label: "'Who can stand before his indignation?': rhetorical question on the unendurable divine wrath", cluster: theology}
  counselor-of-belial: {label: "One who plots evil against YHWH comes out of the enemy city, a counselor of Belial (beliyya'al)", cluster: prophecy}
  herald-on-mountains-proclaims-peace: {label: "The feet of a herald (mevasser) on the mountains announce peace and good news", cluster: prophecy}
  red-shields-and-flashing-chariots: {label: "Attacking warriors with red shields and scarlet clothes; chariots flash like torches and dart like lightning", cluster: warfare}
  river-gates-opened-palace-dissolves: {label: "The river gates are opened and the palace melts away", cluster: warfare}
  maidens-moan-like-doves-beating-breasts: {label: "The captive queen's maids moan like doves, beating their breasts", cluster: mourning}
  empire-as-lions-den-filled-with-prey: {label: "The empire is a lions' den where the lion tore prey for his cubs and lionesses and filled his lairs", cluster: prophecy}
  sounds-of-chariot-assault: {label: "Onomatopoeic battle scene: crack of whip, rumble of wheel, galloping horse, bounding chariot, heaps of corpses", cluster: warfare}
  city-as-harlot-and-sorceress: {label: "The enemy city is a graceful harlot and mistress of sorceries who sells nations by her harlotries", cluster: prophecy}
  skirts-lifted-to-expose-shame: {label: "God lifts the city's skirts over her face and shows the nations her nakedness", cluster: prophecy}
  fall-of-thebes-as-precedent: {label: "Are you better than No-Amon (Thebes), surrounded by water, which still went into exile?", cluster: history}
  infants-dashed-in-pieces: {label: "Infants are dashed to pieces at the head of every street", cluster: warfare}
  fortresses-like-ripe-figs: {label: "Fortresses are like first-ripe figs that fall into the eater's mouth when shaken", cluster: prophecy}
  soldiers-become-women: {label: "The enemy's troops are women; the gates of the land stand wide open", cluster: warfare}
  officials-like-locusts-fly-away: {label: "Merchants and officials are like locusts that camp in the hedges in the cold and fly off when the sun rises", cluster: prophecy}
  all-clap-hands-at-tyrants-fall: {label: "All who hear of the tyrant's downfall clap their hands, for who has not suffered his evil?", cluster: prophecy}
  wicked-surround-righteous-justice-perverted: {label: "Torah grows numb and justice goes out crooked because the wicked surround the righteous", cluster: theodicy}
  god-raises-chaldeans-as-instrument: {label: "God raises up the Chaldeans, a bitter and hasty nation, as his instrument of judgment", cluster: prophecy}
  horses-swifter-than-leopards-wolves-of-evening: {label: "The invader's horses are swifter than leopards and fiercer than evening wolves; his horsemen fly like an eagle", cluster: warfare}
  might-is-his-god: {label: "The conqueror makes his own strength his god", cluster: idolatry}
  scribal-correction-we-shall-not-die: {label: "A verse traditionally counted among the scribal corrections (tiqqunei soferim) where 'you do not die' was altered to 'we shall not die'", cluster: textual}
  god-too-pure-to-behold-evil: {label: "God's eyes are too pure to look on evil; why then does he look on the treacherous?", cluster: theodicy}
  humans-as-fish-caught-in-conquerors-net: {label: "God makes humans like fish of the sea; the conqueror hauls them up with hook, net and seine", cluster: prophecy}
  conqueror-worships-his-net: {label: "The conqueror sacrifices and burns incense to his net because it makes him rich", cluster: idolatry}
  prophet-on-watchtower-awaits-answer: {label: "The prophet stations himself on his watchpost to see what God will answer to his complaint", cluster: prophecy}
  write-vision-plainly-on-tablets: {label: "Write the vision plainly on tablets so that a runner may read it", cluster: prophecy}
  though-it-tarry-wait-for-it: {label: "The vision is for an appointed time; though it tarry, wait for it, for it will surely come", cluster: eschatology}
  righteous-shall-live-by-faith: {label: "'The righteous shall live by his faith (emunah)'", cluster: theology}
  greed-wide-as-sheol: {label: "The arrogant man's appetite is wide as Sheol and like Death never satisfied, gathering all nations", cluster: ethics}
  series-of-woes-on-tyrant: {label: "A series of 'woe' (hoy) taunt-sayings against an oppressor", cluster: prophecy}
  stone-cries-out-from-wall: {label: "The stone cries out from the wall and the beam answers from the woodwork", cluster: prophecy}
  peoples-labor-only-for-fire: {label: "Peoples toil only for fire and nations weary themselves for nothing", cluster: prophecy}
  earth-filled-with-knowledge-as-waters-cover-sea: {label: "The earth will be filled with the knowledge of YHWH (his glory) as the waters cover the sea", cluster: eschatology}
  neighbor-made-drunk-to-see-nakedness: {label: "Woe to one who makes his neighbor drunk in order to gaze on his nakedness", cluster: ethics}
  cry-awake-to-wood-and-dumb-stone: {label: "Woe to the one who says to wood 'Awake!' and to dumb stone 'Arise!'; there is no breath in it", cluster: idolatry}
  all-earth-silent-before-yhwh: {label: "'Hush (has) before YHWH, all the earth', for he is in his holy temple or has roused himself", cluster: liturgy}
  shigionoth-heading: {label: "A prayer headed 'on shigionoth', an obscure musical or genre term", cluster: psalmody}
  in-wrath-remember-mercy: {label: "Plea: 'in wrath remember mercy'", cluster: prayer}
  rays-or-horns-from-gods-hand: {label: "Brightness like light, with rays (qarnayim, horns) coming from God's hand, where his power is hidden", cluster: theophany}
  god-measures-earth-nations-startle: {label: "God stands and measures (or shakes) the earth; the eternal mountains shatter and the everlasting hills sink", cluster: theophany}
  tents-of-cushan-and-midian-tremble: {label: "The tents of Cushan and the curtains of Midian tremble at the theophany", cluster: theophany}
  god-rides-horses-and-chariots-against-sea: {label: "God rides his horses and chariots of salvation, angry at River and Sea, and treads the sea with his horses", cluster: theophany}
  god-crushes-head-of-house-of-wicked: {label: "God goes out to save his anointed and crushes the head of the house of the wicked, laying it bare from foundation to neck", cluster: theophany}
  rejoice-though-fig-does-not-blossom: {label: "Though fig and vine fail, olive and fields yield nothing and the folds are empty, yet I will rejoice in YHWH", cluster: piety}
  prophet-genealogy-to-royal-ancestor: {label: "A prophet's genealogy is traced several generations back to a king (Hezekiah)", cluster: genealogy}
  uncreation-sweeping-all-creatures: {label: "God will sweep away humans, beasts, birds of the air and fish of the sea from the face of the ground (creation reversed)", cluster: eschatology}
  swearing-by-yhwh-and-malkam: {label: "People bow and swear both by YHWH and by Malkam (their king or Milcom)", cluster: idolatry}
  day-of-yhwh-as-sacrificial-feast: {label: "The Day of YHWH is a sacrifice he has prepared, with invited guests consecrated", cluster: eschatology}
  punishment-for-wearing-foreign-garments: {label: "God will punish officials and princes who wear foreign garments", cluster: law}
  jerusalem-quarters-named: {label: "Named districts of Jerusalem (Fish Gate, Mishneh/Second Quarter, Maktesh/Mortar) wail", cluster: geography}
  god-searches-jerusalem-with-lamps: {label: "God will search Jerusalem with lamps to find the complacent", cluster: theology}
  complacent-settled-on-lees: {label: "Men thickened on their lees who say in their hearts 'YHWH will do neither good nor evil'", cluster: theology}
  dies-irae-litany: {label: "Litany of the Day: day of wrath, distress, ruin, darkness, cloud and thick darkness, shofar and alarm", cluster: eschatology}
  silver-gold-cannot-save-on-day-of-wrath: {label: "Neither their silver nor their gold can save them on the day of YHWH's wrath", cluster: eschatology}
  seek-humility-perhaps-hidden: {label: "Seek righteousness, seek humility; perhaps you will be hidden on the day of YHWH's anger", cluster: piety}
  nations-worship-yhwh-each-from-own-place: {label: "God starves the gods of the earth and all the coastlands bow to him each from its own place", cluster: eschatology}
  ruined-city-inhabited-by-wild-creatures: {label: "A ruined city becomes a lair for flocks and wild creatures; owls and hedgehogs lodge in its capitals and a voice sings in the window", cluster: prophecy}
  city-says-i-am-and-none-besides: {label: "The exultant city says in her heart 'I am, and there is none besides me'", cluster: prophecy}
  officials-lions-judges-evening-wolves: {label: "The city's officials are roaring lions and its judges evening wolves that leave nothing for morning", cluster: ethics}
  verse-containing-whole-alphabet: {label: "A verse noted by tradition as containing every letter of the Hebrew alphabet", cluster: textual}
  pure-lip-given-to-peoples: {label: "God will change the peoples to a pure speech (safah berurah) so all call on his name and serve him shoulder to shoulder", cluster: eschatology}
  worshipers-from-beyond-rivers-of-cush: {label: "From beyond the rivers of Cush God's worshipers, his dispersed daughter, bring him offerings", cluster: eschatology}
  humble-poor-remnant: {label: "God leaves in Zion a humble and poor people who do no wrong, speak no lies, and lie down with none to frighten", cluster: eschatology}
  god-rejoices-over-zion-with-singing: {label: "God in Zion's midst rejoices over her with gladness, is silent in his love, and exults over her with song", cluster: theology}
  prophecy-dated-by-persian-kings-reign: {label: "A prophecy is dated by day, month and year of the Persian king Darius", cluster: chronology}
  people-say-not-time-to-build-temple: {label: "The people say it is not yet time to rebuild YHWH's house", cluster: temple}
  paneled-houses-while-gods-house-waste: {label: "The people live in paneled houses while God's house lies in ruins", cluster: temple}
  wages-into-bag-with-holes: {label: "The wage earner puts his wages into a bag with holes", cluster: curse}
  drought-because-temple-neglected: {label: "Heaven withholds dew and earth its produce because God's house lies waste", cluster: temple}
  prophet-called-malakh-yhwh: {label: "A human prophet is called 'the messenger (malakh) of YHWH'", cluster: prophecy}
  god-stirs-spirit-of-leaders: {label: "God stirs up the spirit of the leaders and people to build", cluster: temple}
  elders-compare-new-temple-to-first: {label: "Those who saw the first temple in its glory find the new one as nothing", cluster: temple}
  god-shakes-heaven-and-earth-once-more: {label: "'Once more, in a little while, I will shake the heavens and the earth, the sea and dry land, and all nations'", cluster: eschatology}
  treasures-of-nations-fill-temple: {label: "The treasures (hemdah) of all nations will come and God will fill his house with glory; silver and gold are his", cluster: eschatology}
  latter-house-glory-greater: {label: "The glory of the latter house will be greater than the former, and in this place God will give peace", cluster: temple}
  holiness-not-transmitted-at-second-remove: {label: "Priestly ruling: holy meat in a garment's fold does not sanctify food the garment touches, but corpse impurity does defile it", cluster: law}
  blight-mildew-hail-sent: {label: "God struck their labor with blight, mildew and hail, yet they did not return to him", cluster: curse}
  blessing-from-day-of-temple-foundation: {label: "From the day the temple's foundation is laid, God promises to bless the harvest", cluster: temple}
  zerubbabel-made-gods-signet-ring: {label: "God will take Zerubbabel his servant and make him like a signet ring, for he has chosen him", cluster: messianism}
  thrones-of-kingdoms-overturned: {label: "God will overturn the thrones of kingdoms and chariots and their riders", cluster: eschatology}
  return-to-me-and-i-will-return: {label: "'Return to me and I will return to you', says God", cluster: repentance}
  former-prophets-ignored: {label: "The 'former prophets' called the fathers to repent and they did not listen", cluster: prophecy}
  fathers-and-prophets-mortal-word-endures: {label: "'Your fathers, where are they? And the prophets, do they live forever?' Yet God's words overtook them", cluster: prophecy}
  babylonian-month-names: {label: "Months are dated by their Babylonian names (Shevat, Kislev)", cluster: chronology}
  night-vision-series: {label: "A prophet sees a series of night visions, each explained by an angel", cluster: apocalyptic}
  horsemen-among-myrtles: {label: "A man on a red horse stands among the myrtles in the deep (metsulah), with horses behind him", cluster: apocalyptic}
  colored-horses-of-apocalyptic-vision: {label: "Horses of different colors (red, sorrel, white, black, dappled) are sent out by God through the earth", cluster: apocalyptic}
  interpreting-angel: {label: "'The angel who talked with me' (ha-malakh ha-dover bi) explains the visions to the prophet", cluster: apocalyptic}
  angel-intercedes-for-jerusalem: {label: "The angel of YHWH intercedes: 'How long will you not have mercy on Jerusalem?'", cluster: angelology}
  measuring-line-over-jerusalem: {label: "A measuring line will be stretched over Jerusalem for rebuilding", cluster: temple}
  four-horns-scattered-judah: {label: "Vision of four horns, the powers that scattered Judah, Israel and Jerusalem", cluster: apocalyptic}
  four-craftsmen-throw-down-horns: {label: "Four craftsmen (harashim) come to terrify and cast down the horns of the nations", cluster: apocalyptic}
  angel-measures-city: {label: "A man with a measuring line goes to measure the length and breadth of Jerusalem", cluster: apocalyptic}
  jerusalem-unwalled-god-wall-of-fire: {label: "Jerusalem will be unwalled for its multitude; God will be a wall of fire around it and glory within", cluster: eschatology}
  flee-from-land-of-north: {label: "Call to the exiles: 'Flee from the land of the north; escape, Zion, who dwells with daughter Babylon'", cluster: prophecy}
  many-nations-join-yhwh: {label: "Many nations will join themselves to YHWH in that day and become his people", cluster: eschatology}
  term-holy-land: {label: "Judah called God's portion in 'the holy land' (admat ha-qodesh)", cluster: geography}
  yhwh-rebuke-you-satan: {label: "'YHWH rebuke you, Satan!': the accuser is rebuked in the heavenly court", cluster: angelology}
  brand-plucked-from-fire: {label: "The rescued one is 'a brand plucked from the fire'", cluster: theology}
  filthy-garments-exchanged-for-festal-robes: {label: "The high priest's filthy garments are removed and replaced with festal robes and a pure turban, signifying removal of guilt", cluster: cult}
  priest-granted-access-among-angels: {label: "If faithful, the high priest is granted a place to walk among the heavenly attendants who stand there", cluster: angelology}
  messianic-branch-tsemah: {label: "God will bring his servant 'the Branch' (Tsemah) who will build the temple", cluster: messianism}
  stone-with-seven-eyes: {label: "A stone set before the high priest with seven eyes on it, which God will engrave", cluster: apocalyptic}
  prophet-woken-as-from-sleep: {label: "The angel rouses the prophet like a man woken from sleep before the vision", cluster: apocalyptic}
  lampstand-fed-by-two-olive-trees: {label: "A golden lampstand with seven lamps is flanked by two olive trees that pour golden oil through golden pipes", cluster: apocalyptic}
  not-by-might-but-by-spirit: {label: "'Not by might, nor by power, but by my spirit', says YHWH", cluster: theology}
  mountain-becomes-plain-before-builder: {label: "'Who are you, great mountain? Before Zerubbabel you become a plain'", cluster: temple}
  capstone-acclaimed-grace-grace: {label: "The headstone is brought out with shouts of 'Grace, grace to it'", cluster: temple}
  day-of-small-things: {label: "'Who has despised the day of small things?' (small beginnings of the rebuilding)", cluster: temple}
  two-anointed-sons-of-oil: {label: "Two 'sons of oil' (anointed ones) stand by the Lord of all the earth", cluster: messianism}
  flying-scroll: {label: "A huge flying scroll, twenty by ten cubits, is seen in a vision", cluster: apocalyptic}
  curse-enters-house-and-consumes-it: {label: "A curse goes out over the land, enters the house of the thief and the false swearer, lodges there and consumes its timber and stones", cluster: curse}
  woman-in-ephah-wickedness: {label: "A woman sitting inside an ephah measure is identified as Wickedness (ha-rish'ah)", cluster: apocalyptic}
  lead-lid-seals-wickedness: {label: "Wickedness is thrust back into the ephah and a lead weight is thrown over its mouth", cluster: apocalyptic}
  winged-women-with-stork-wings: {label: "Two women with wind in their wings like the wings of a stork lift the ephah between earth and heaven", cluster: apocalyptic}
  wickedness-enshrined-in-shinar: {label: "Wickedness is carried off to Shinar (Babylonia) where a house is built for it and it is set on its base", cluster: apocalyptic}
  four-chariots-from-bronze-mountains: {label: "Four chariots come out from between two mountains of bronze", cluster: apocalyptic}
  four-winds-as-chariots: {label: "The chariots are the four winds (spirits) of heaven that go out after presenting themselves before the Lord of all the earth", cluster: apocalyptic}
  gods-spirit-at-rest-in-north: {label: "The horses going to the north country have set God's spirit at rest there", cluster: apocalyptic}
  crown-placed-on-high-priest: {label: "Crowns made from the exiles' silver and gold are set on the head of the high priest", cluster: messianism}
  royal-and-priestly-figures-in-harmony: {label: "A ruler on his throne and a priest by (or on) his throne with 'counsel of peace between the two of them'", cluster: messianism}
  crowns-kept-as-memorial-in-temple: {label: "The crowns are kept in the temple as a memorial for named donors", cluster: temple}
  question-whether-to-keep-mourning-fast: {label: "A delegation asks the priests whether to keep weeping and abstaining in the fifth month now the temple is rebuilt", cluster: liturgy}
  fasting-for-god-or-self: {label: "'When you fasted and mourned these seventy years, was it for me that you fasted?'", cluster: liturgy}
  hearts-made-hard-as-shamir: {label: "The people made their hearts like shamir (adamant or flint) so as not to hear the Torah", cluster: theology}
  they-called-i-did-not-hear: {label: "As God called and they would not hear, so they will call and he will not hear", cluster: theology}
  jerusalem-city-of-truth: {label: "Jerusalem will be called 'the city of truth' and Zion 'the holy mountain'", cluster: eschatology}
  old-people-and-children-fill-streets: {label: "Old men and women with staffs sit again in Jerusalem's squares and boys and girls play in its streets", cluster: eschatology}
  four-fasts-turned-to-feasts: {label: "The fasts of the fourth, fifth, seventh and tenth months will become joy and festivals", cluster: liturgy}
  ten-gentiles-grasp-hem-of-jew: {label: "Ten men of every tongue will grasp the corner of a Jew's garment: 'Let us go with you, for we have heard God is with you'", cluster: eschatology}
units:
  - id: hb-obad-1-edom-brought-down
    tradition: judaism
    title: Obadiah's vision against Edom's pride
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Obad 1:1-9"]
    tags:
      - {motif: oracles-against-nations, refs: ["Obad 1:1"]}
      - {motif: envoy-sent-among-nations-to-rouse-war, refs: ["Obad 1:1"], note: "tsir baggoyim shullah; near-verbatim in Jer 49:14"}
      - {motif: edom-dwells-in-clefts-of-rock, refs: ["Obad 1:3"], note: "hagwei sela, punning on Sela/Petra"}
      - {motif: proud-nest-among-stars-brought-down, refs: ["Obad 1:3", "Obad 1:4"], note: "'though you set your nest among the stars, from there I will bring you down'"}
      - {motif: thieves-and-grape-gatherers-leave-gleanings, refs: ["Obad 1:5"]}
      - {motif: allies-betray-ally, refs: ["Obad 1:7"], note: "'men of your covenant... your bread (companions) set a trap'"}
      - {motif: wisdom-of-edom-teman, refs: ["Obad 1:8", "Obad 1:9"]}
    hints:
      - "Obad 1-9 is closely paralleled by Jer 49:7-22. The fall of the star-high proud one recalls Isa 14:12-15 (Helel ben Shahar)."
      - "Rabbinic tradition identifies Edom/Esau with Rome; Obadiah was said (b. Sanh. 39b) to be an Edomite proselyte."
  - id: hb-obad-1-day-of-edom
    tradition: judaism
    title: Edom's crimes against Jacob and the Day of YHWH
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Obad 1:10-21"]
    tags:
      - {motif: edom-violence-against-brother-jacob, refs: ["Obad 1:10"]}
      - {motif: lots-cast-over-conquered-city, refs: ["Obad 1:11"], note: "'on Jerusalem they cast lots'"}
      - {motif: gloating-over-brothers-calamity, refs: ["Obad 1:12", "Obad 1:13"], note: "eight prohibitions 'do not...' on 'the day of his calamity'"}
      - {motif: fugitives-cut-off-at-crossroads, refs: ["Obad 1:14"]}
      - {motif: day-of-yhwh, refs: ["Obad 1:15"]}
      - {motif: as-you-have-done-it-shall-be-done-to-you, refs: ["Obad 1:15"]}
      - {motif: cup-of-wrath, refs: ["Obad 1:16"], note: "the nations drink and 'become as though they had never been'"}
      - {motif: refuge-on-mount-zion, refs: ["Obad 1:17"]}
      - {motif: jacob-fire-esau-stubble, refs: ["Obad 1:18"]}
      - {motif: exiles-in-sepharad-and-zarephath, refs: ["Obad 1:20"], note: "Sepharad (later read as Spain) and Zarephath (later read as France)"}
      - {motif: saviors-on-mount-zion-kingdom-to-yhwh, refs: ["Obad 1:21"]}
    hints:
      - "Ps 137:7 also condemns Edom for the day of Jerusalem. Medieval Jewish naming of Spain (Sefarad) and France (Tsarfat) derives from Obad 20."
  - id: hb-jonah-1-flight-and-storm
    tradition: judaism
    title: Jonah flees to Tarshish and is thrown into the sea
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Jonah 1:1-16"]
    tags:
      - {motif: prophet-jonah-son-of-amittai, refs: ["Jonah 1:1"]}
      - {motif: great-city-wickedness-rises-before-god, refs: ["Jonah 1:2"], note: "'their evil has come up before me'; cf. outcry of Sodom"}
      - {motif: reason-human-wickedness, refs: ["Jonah 1:2"]}
      - {motif: prophet-flees-from-gods-commission, refs: ["Jonah 1:3", "Jonah 1:10"], note: "'from the presence of YHWH' twice in 1:3"}
      - {motif: ship-from-joppa-to-tarshish, refs: ["Jonah 1:3"], note: "repeated 'went down' (yarad): to Joppa, into the ship, into the hold, into sleep"}
      - {motif: god-hurls-storm-on-sea, refs: ["Jonah 1:4"], note: "'the ship thought to be broken', personified"}
      - {motif: sailors-each-cry-to-own-god, refs: ["Jonah 1:5"]}
      - {motif: cargo-jettisoned-in-storm, refs: ["Jonah 1:5"]}
      - {motif: sleeper-in-ship-during-storm, refs: ["Jonah 1:5"], note: "wayyeradam, deep sleep (cf. tardemah)"}
      - {motif: captain-urges-sleeper-to-pray, refs: ["Jonah 1:6"], note: "rav ha-hovel; 'perhaps the god will think of us'"}
      - {motif: lots-cast-to-find-culprit-of-storm, refs: ["Jonah 1:7"]}
      - {motif: urim-thummim-lot, refs: ["Jonah 1:7"], note: "lot identifies the guilty party"}
      - {motif: sailors-interrogate-stranger, refs: ["Jonah 1:8"]}
      - {motif: god-of-heaven-made-sea-and-dry-land, refs: ["Jonah 1:9"], note: "'I am a Hebrew and I fear YHWH God of heaven'"}
      - {motif: man-thrown-overboard-to-calm-sea, refs: ["Jonah 1:12", "Jonah 1:15"], note: "'pick me up and hurl me into the sea'; the sea 'stood still from its raging'"}
      - {motif: rowing-to-shore-in-vain, refs: ["Jonah 1:13"]}
      - {motif: prayer-not-to-incur-innocent-blood, refs: ["Jonah 1:14"]}
      - {motif: gentile-sailors-fear-and-sacrifice-to-yhwh, refs: ["Jonah 1:16"]}
    hints:
      - "Quran 37:139-141: Yunus 'fled (abaqa) to the laden ship', cast lots (sahama) and was among the losers. Quran 21:87: Dhu'l-Nun 'went off in anger' thinking God would not constrain him."
      - "Mark 4:35-41 (Jesus asleep in the boat in the storm; the sea stilled). Cf. Greek tales of jettisoning a guilty passenger (Arion; Antiphon on the shipwreck as evidence of guilt)."
  - id: hb-jonah-2-in-the-fish
    tradition: judaism
    title: Jonah swallowed by the great fish and his psalm
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Jonah 2:1-11"]
    tags:
      - {motif: prophet-swallowed-by-great-fish, refs: ["Jonah 2:1"], note: "dag gadol; masculine dag in 2:1, feminine daggah in 2:2"}
      - {motif: god-appoints-agents-wayeman, refs: ["Jonah 2:1"]}
      - {motif: three-days-three-nights-in-belly, refs: ["Jonah 2:1"]}
      - {motif: prayer-from-belly-of-fish, refs: ["Jonah 2:2"]}
      - {motif: belly-of-sheol, refs: ["Jonah 2:3"]}
      - {motif: cast-into-heart-of-seas, refs: ["Jonah 2:4"]}
      - {motif: deep-calls-to-deep, refs: ["Jonah 2:4"], note: "'all your breakers and waves passed over me' = Ps 42:8"}
      - {motif: prayer-reaches-holy-temple, refs: ["Jonah 2:5", "Jonah 2:8"]}
      - {motif: seaweed-wrapped-around-head, refs: ["Jonah 2:6"], note: "tehom surrounds him, suf bound to his head"}
      - {motif: bars-of-earth-roots-of-mountains, refs: ["Jonah 2:7"]}
      - {motif: raised-from-sheol-healed, refs: ["Jonah 2:7"], note: "'you brought up my life from the pit (shahat)'"}
      - {motif: idols-as-vain-breath, refs: ["Jonah 2:9"], note: "'those who keep hevlei shav forsake their hesed'"}
      - {motif: vow-of-thanksgiving-paid, refs: ["Jonah 2:10"]}
      - {motif: salvation-belongs-to-yhwh, refs: ["Jonah 2:10"]}
      - {motif: fish-vomits-prophet-onto-land, refs: ["Jonah 2:11"]}
      - {motif: individual-lament, refs: ["Jonah 2:3-10"], note: "thanksgiving psalm form: distress, cry, rescue, vow"}
    hints:
      - "Quran 21:87-88: in the darknesses he called 'There is no god but You, glory be to You; I have been among the wrongdoers', and God saved him from distress. Quran 37:142-145: the fish swallowed him while blameworthy; had he not glorified God he would have stayed in its belly until the Day of Resurrection; he was cast onto the bare shore, sick. Quran 68:48-49: 'the companion of the fish' who called out while choked with grief (makzum)."
      - "Matt 12:40 (sign of Jonah: three days and nights in the heart of the earth). Pirqe de-Rabbi Eliezer 10 (Jonah sees the sea floor and Leviathan from inside the fish). Greek: Heracles swallowed by the sea monster at Troy; Perseus-Andromeda localized at Joppa."
  - id: hb-jonah-3-nineveh-repents
    tradition: judaism
    title: Jonah preaches and Nineveh repents down to its animals
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Jonah 3:1-10"]
    tags:
      - {motif: prophet-commissioned-second-time, refs: ["Jonah 3:1", "Jonah 3:2"]}
      - {motif: nineveh-three-days-walk, refs: ["Jonah 3:3"], note: "'a great city to God (le-elohim)'"}
      - {motif: forty-days-and-city-overturned, refs: ["Jonah 3:4"], note: "nehpakhet, the Sodom verb; ambiguous 'overturned' or 'turned around'"}
      - {motif: forty-days-period, refs: ["Jonah 3:4"]}
      - {motif: cities-overturned, refs: ["Jonah 3:4"]}
      - {motif: whole-city-repents-at-warning, refs: ["Jonah 3:5"], note: "'the people of Nineveh believed in God'"}
      - {motif: king-leaves-throne-sits-in-ashes, refs: ["Jonah 3:6"]}
      - {motif: animals-fast-and-wear-sackcloth, refs: ["Jonah 3:7", "Jonah 3:8"], note: "decree 'of the king and his nobles' (ta'am, an Akkadian-style term)"}
      - {motif: repent-of-violence-in-hands, refs: ["Jonah 3:8"]}
      - {motif: who-knows-god-may-turn, refs: ["Jonah 3:9"]}
      - {motif: god-relents, refs: ["Jonah 3:10"]}
      - {motif: repentance-averts-announced-doom, refs: ["Jonah 3:10"]}
    hints:
      - "Quran 10:98: of all towns only the people of Yunus believed and their punishment of disgrace was lifted. Quran 37:147-148: sent to a hundred thousand or more, who believed. Mishnah Taanit 2:1 cites Jonah 3:10 for public fasts; Jonah is read on Yom Kippur afternoon."
      - "Herodotus 9.24 (Persians shear their horses in mourning for Masistius); Judith 4:10 (cattle in sackcloth)."
  - id: hb-jonah-4-qiqayon
    tradition: judaism
    title: Jonah's anger, the qiqayon plant and God's question
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Jonah 4:1-11"]
    tags:
      - {motif: prophet-angry-at-divine-mercy, refs: ["Jonah 4:1", "Jonah 4:4", "Jonah 4:9"], note: "'Is it good that you are angry?' asked twice"}
      - {motif: thirteen-attributes, refs: ["Jonah 4:2"], note: "gracious, merciful, slow to anger, abundant in hesed, relenting of evil; cited as the reason for flight"}
      - {motif: prophet-asks-god-to-take-his-life, refs: ["Jonah 4:3", "Jonah 4:8"], note: "echoes Elijah 1Kgs 19:4"}
      - {motif: prophet-sits-in-booth-to-watch-city, refs: ["Jonah 4:5"], note: "sukkah east of the city"}
      - {motif: miraculous-shade-plant, refs: ["Jonah 4:6"], note: "qiqayon (castor-oil plant or gourd); Jonah's 'great joy'"}
      - {motif: god-appoints-agents-wayeman, refs: ["Jonah 4:6", "Jonah 4:7", "Jonah 4:8"]}
      - {motif: worm-destroys-plant-at-dawn, refs: ["Jonah 4:7"]}
      - {motif: scorching-east-wind, refs: ["Jonah 4:8"]}
      - {motif: lesson-of-withered-plant, refs: ["Jonah 4:10", "Jonah 4:11"], note: "'son of a night it came, son of a night it perished'"}
      - {motif: city-of-twelve-myriads-who-know-not-right-from-left, refs: ["Jonah 4:11"]}
      - {motif: god-pities-animals-of-city, refs: ["Jonah 4:11"], note: "the book's last words: 'and many animals'"}
      - {motif: book-ends-with-divine-question, refs: ["Jonah 4:11"]}
    hints:
      - "Quran 37:146: 'We caused a gourd plant (shajaratan min yaqtin) to grow over him'; the Quran sets the plant after the fish, as shelter for the sick prophet, not as a lesson. Quran 21:87 'went off in anger' (mughadiban) parallels Jonah 4:1."
      - "Jerome's cucurbita/hedera dispute with Augustine over qiqayon. Matt 12:41 (men of Nineveh will rise in judgment)."
  - id: hb-mic-1-theophany-samaria
    tradition: judaism
    title: YHWH comes down against Samaria; the prophet wails naked
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Mic 1:1-9"]
    tags:
      - {motif: covenant-lawsuit-heaven-and-earth, refs: ["Mic 1:2"], note: "peoples and earth summoned; YHWH a witness from his holy temple"}
      - {motif: god-treads-high-places-of-earth, refs: ["Mic 1:3"]}
      - {motif: theophany-earth-quakes-mountains-melt, refs: ["Mic 1:4"], note: "mountains melt like wax before fire, valleys split like water down a slope"}
      - {motif: idolatry-as-harlotry, refs: ["Mic 1:7"]}
      - {motif: idols-as-harlots-hire, refs: ["Mic 1:7"]}
      - {motif: prophet-goes-naked-and-barefoot-mourning, refs: ["Mic 1:8"]}
      - {motif: brother-to-jackals-companion-of-ostriches, refs: ["Mic 1:8"], note: "wailing 'like jackals, mourning like ostriches'"}
    hints:
      - "Isa 20:2-4 (Isaiah walks naked and barefoot three years). Ps 97:5 (mountains melt like wax)."
  - id: hb-mic-1-lament-over-towns
    tradition: judaism
    title: Punning lament over the towns of the Shephelah
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Mic 1:10-16"]
    tags:
      - {motif: tell-it-not-in-gath, refs: ["Mic 1:10"], note: "quotes David's lament 2Sam 1:20"}
      - {motif: wordplay-on-town-names-in-lament, refs: ["Mic 1:10", "Mic 1:11", "Mic 1:13", "Mic 1:14", "Mic 1:15"], note: "Beth-leaphrah/afar, Lachish/rekhesh, Achzib/akhzav, Mareshah/yoresh"}
      - {motif: mourning-rites-torn-clothes-dust, refs: ["Mic 1:10"], note: "'roll yourself in dust'"}
      - {motif: baldness-like-vulture-mourning, refs: ["Mic 1:16"]}
    hints:
      - "Isa 10:28-32 is a similar town-by-town march poem. Assyrian annals of Sennacherib's 701 campaign and the Lachish reliefs."
  - id: hb-mic-2-land-grabbers
    tradition: judaism
    title: Woe to those who seize fields; the breaker goes before the flock
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Mic 2:1-13"]
    tags:
      - {motif: evil-plotted-on-beds, refs: ["Mic 2:1"]}
