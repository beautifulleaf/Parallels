  estranged-brothers-bury-father: {label: "Estranged brothers come together to bury their father", cluster: patriarchs}
  father-life-bound-to-sons: {label: "A father's life is bound up with the life of his youngest son", cluster: patriarchs}
  father-silent-sons-avenge: {label: "The father keeps silent about his daughter's violation while the sons take revenge", cluster: patriarchs}
  few-and-evil-days-lament: {label: "Patriarch tells a king his years have been few and evil, shorter than his fathers'", cluster: patriarchs}
