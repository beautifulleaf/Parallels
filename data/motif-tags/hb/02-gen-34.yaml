new_motifs:
  agricultural-calendar-note-crops: {label: "Narrator dates a plague by the growth stage of named crops (barley in ear, flax in bud, wheat late)", cluster: exodus}
  am-i-in-place-of-god: {label: "Hero refuses to judge or avenge, asking 'Am I in the place of God?'", cluster: patriarchs}
  amalek-born-of-concubine: {label: "Amalek's ancestor is born to a concubine in Esau's line", cluster: genealogy}
  angel-and-cloud-move-behind-camp: {label: "God's angel and the cloud pillar move behind the fleeing people to screen them from the pursuers", cluster: exodus}
  attack-on-third-day-of-pain: {label: "Attackers strike a town on the third day after circumcision, while the men are in pain", cluster: patriarchs}
  bargaining-over-terms-of-release: {label: "King haggles over who and what may leave (only men, no flocks, not far away)", cluster: exodus}
  bela-son-of-beor-king: {label: "First king of Edom is Bela son of Beor (name recalling Balaam son of Beor)", cluster: genealogy}
  birthstool-ovnayim: {label: "Midwives observe the newborn on the birthstool (ovnayim, 'the two stones')", cluster: exodus}
  bitter-water-sweetened-by-wood: {label: "Bitter water made drinkable by throwing in a piece of wood God shows the leader", cluster: wilderness}
  blessing-formula-may-god-make-you-like: {label: "Blessing formula 'May God make you like X and Y' coined by a patriarch", cluster: cult}
  blessings-of-heaven-deep-breasts-womb: {label: "Blessings of heaven above, of the deep crouching below, and of breasts and womb", cluster: cosmology}
  blood-on-doorposts-and-lintel: {label: "Sacrificial blood daubed on the doorposts and lintel protects the household", cluster: cult}
  boast-of-the-enemy-quoted: {label: "Victory song quotes the enemy's boastful first-person plan before his destruction", cluster: poetry}
  bowing-on-bed-head: {label: "Dying patriarch bows down on (or over) the head of his bed (or staff)", cluster: patriarchs}
  bread-rained-from-heaven: {label: "God rains bread from heaven to feed the people in the desert", cluster: wilderness}
  bricks-without-straw: {label: "Slaves must make the same quota of bricks while gathering their own straw", cluster: exodus}
  bridegroom-of-blood: {label: "Wife saves her husband from a divine attack with her son's circumcision blood, calling him 'bridegroom of blood'", cluster: exodus}
  brother-as-spokesman: {label: "An eloquent brother is appointed to speak for the hero, who is 'as God' to him", cluster: prophecy}
  brothers-confess-guilt-unknowing: {label: "Brothers confess their old crime in front of the victim without knowing he hears them", cluster: patriarchs}
  brothers-eat-while-victim-in-pit: {label: "Brothers sit down to eat bread after casting their brother into the pit", cluster: patriarchs}
  brothers-meet-at-mountain-of-god: {label: "Two brothers meet and kiss at the mountain of God", cluster: exodus}
  brothers-separate-land-cannot-bear: {label: "Brothers separate because the land cannot support both their herds", cluster: patriarchs}
  burning-as-penalty-for-unchastity: {label: "A woman accused of harlotry is sentenced to be burned", cluster: law}
  burning-bush-not-consumed: {label: "God appears in a bush that burns without being consumed", cluster: theophany}
  camp-before-baal-zephon: {label: "Israel camps by the sea opposite Baal-zephon, Migdol and Pi-hahiroth", cluster: exodus}
  chariot-wheels-removed: {label: "God removes or clogs the wheels of the pursuers' chariots", cluster: exodus}
  chiefs-alluf-lists: {label: "Lists of tribal chiefs (allufim) of Edom and the Horites", cluster: genealogy}
  children-taken-from-between-knees: {label: "Children placed on or taken from the knees of a patriarch as an adoption gesture", cluster: patriarchs}
  childs-question-ritual-explanation: {label: "A child asks the meaning of a rite and the parent recites the exodus story", cluster: cult}
  coffin-in-egypt: {label: "Embalmed hero laid in a coffin (aron) in Egypt", cluster: patriarchs}
  coitus-interruptus-sin: {label: "Man spills his seed on the ground to avoid raising offspring for his dead brother and is struck dead", cluster: law}
  contest-with-court-magicians: {label: "Prophet's wonders are imitated by the king's magicians in a contest", cluster: exodus}
  corpses-on-the-shore: {label: "The rescued people see the enemy dead on the seashore", cluster: exodus}
  courtiers-urge-king-to-yield: {label: "The king's own servants urge him to let the people go", cluster: exodus}
  covenant-formula-my-people-your-god: {label: "Formula 'I will take you as my people and I will be your God'", cluster: covenant}
  cry-rises-to-god-who-remembers-covenant: {label: "The groaning of the oppressed rises to God, who hears and remembers his covenant", cluster: exodus}
  curse-on-violent-brothers-scattered: {label: "Father curses two violent sons' anger and decrees they be scattered among the tribes", cluster: patriarchs}
  daily-portion-as-test: {label: "Food is given daily, a day's portion at a time, to test obedience", cluster: wilderness}
  daughter-goes-out-seized-by-prince: {label: "A daughter goes out to see the local women and is seized and violated by the local prince", cluster: patriarchs}
  daughter-named-in-genealogy: {label: "A lone daughter is named in a male genealogy (Dinah, Serah)", cluster: genealogy}
  dead-frogs-heaped-stink: {label: "The dead frogs are piled in heaps and the land stinks", cluster: exodus}
  death-of-firstborn: {label: "God kills every firstborn of the land, from the king's heir to the lowest servant and cattle", cluster: exodus}
  deathbed-blessing-of-sons: {label: "A dying father gathers his sons to bless them and foretell their destinies", cluster: patriarchs}
  deceitful-circumcision-condition: {label: "Brothers deceitfully demand that a whole town be circumcised as a condition of marriage", cluster: patriarchs}
  despoiling-the-egyptians: {label: "The departing slaves ask their neighbors for silver, gold and clothing and so plunder their oppressors", cluster: exodus}
  destroyer-passes-over-marked-houses: {label: "The destroyer (mashhit) passes over houses marked with blood", cluster: exodus}
  discovery-of-yemim-while-herding-asses: {label: "While herding his father's asses, a man discovers 'the yemim' in the wilderness (hot springs or mules)", cluster: genealogy}
  divination-cup: {label: "A ruler's silver cup used for divination", cluster: patriarchs}
  divine-epithets-mighty-one-of-jacob-stone-of-israel: {label: "Archaic divine titles: Mighty One of Jacob, Shepherd, Stone of Israel", cluster: poetry}
  divine-name-revealed-forever: {label: "God declares his name as his everlasting memorial for all generations", cluster: theophany}
  divine-warrior: {label: "God celebrated as a warrior ('YHWH is a man of war')", cluster: poetry}
  do-not-go-out-until-morning: {label: "No one may leave the house until morning on the night of the destroyer", cluster: cult}
  do-not-quarrel-on-the-way: {label: "Hero warns his brothers not to quarrel on the journey home", cluster: patriarchs}
  donkey-firstling-redeemed-or-neck-broken: {label: "Firstling of an ass must be redeemed with a lamb or its neck broken", cluster: law}
  double-money-returned: {label: "Brothers bring double money to return the silver found in their sacks", cluster: patriarchs}
  double-portion-on-sixth-day: {label: "A double portion of manna falls or is gathered on the sixth day", cluster: wilderness}
