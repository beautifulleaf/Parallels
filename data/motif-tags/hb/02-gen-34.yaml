  gift-of-choice-products-to-ruler: {label: "Gift of the land's choice products (balm, honey, spices, nuts) brought to a foreign ruler", cluster: patriarchs}
  gifts-of-changes-of-raiment: {label: "Hero gives his brothers changes of clothing, with a larger gift to the favorite", cluster: patriarchs}
