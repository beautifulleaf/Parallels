  dough-carried-before-it-leavened: {label: "The people carry their unleavened dough in kneading-troughs on their shoulders", cluster: exodus}
  earth-belongs-to-yhwh: {label: "Wonder done 'so that you may know that the earth belongs to YHWH'", cluster: theology}
  earth-swallows-enemies: {label: "The earth swallows the enemy at God's outstretched right hand", cluster: poetry}
  eaten-in-haste-dressed-for-journey: {label: "Sacrificial meal eaten in haste, loins girded, sandals on, staff in hand", cluster: cult}
  egyptians-dig-for-water: {label: "Egyptians dig around the Nile for drinkable water", cluster: exodus}
  egyptians-will-not-eat-with-hebrews: {label: "Egyptians will not eat with Hebrews, for it is an abomination to them", cluster: patriarchs}
  ehyeh-asher-ehyeh: {label: "God names himself 'I will be what I will be' (ehyeh asher ehyeh)", cluster: theophany}
  end-of-days-prophecy: {label: "Prophecy of what will happen 'at the end of days' (aharit ha-yamim)", cluster: prophecy}
