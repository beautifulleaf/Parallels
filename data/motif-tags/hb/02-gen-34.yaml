  people-sell-themselves-as-slaves-for-bread: {label: "Starving people sell their land and themselves as slaves to the king for food", cluster: patriarchs}
  people-swarm-like-creatures: {label: "The people 'swarm' (sharats) and fill the land like creatures in creation", cluster: exodus}
  people-too-dispirited-to-listen: {label: "The people cannot listen to the prophet because of their broken spirit and hard labor", cluster: exodus}
  people-wish-to-return-to-slavery: {label: "The people say it would be better to serve their oppressors than die in the wilderness", cluster: wilderness}
  pharaoh-confesses-sin: {label: "The king confesses he has sinned and that God is righteous", cluster: exodus}
  pharaoh-deceives-again: {label: "The king breaks his promise to release the people once a plague is lifted", cluster: exodus}
  pillar-of-cloud-and-fire: {label: "God leads the people in a pillar of cloud by day and a pillar of fire by night", cluster: wilderness}
  place-named-for-mourning: {label: "Locals name a place for the great mourning they witness (Abel-Mizraim)", cluster: patriarchs}
  plague-at-appointed-time-tomorrow: {label: "God sets a fixed time ('tomorrow') for a plague", cluster: exodus}
  plague-of-darkness: {label: "A palpable darkness covers the land for three days", cluster: exodus}
  plague-of-frogs: {label: "Frogs swarm out of the river into houses, beds, ovens and kneading-troughs", cluster: exodus}
  plague-of-lice-from-dust: {label: "The dust of the earth becomes lice on man and beast", cluster: exodus}
  plague-of-locusts: {label: "Locusts brought by an east wind devour all vegetation left after the hail", cluster: exodus}
  plague-of-swarms-arov: {label: "Swarms (arov) of insects or wild beasts fill the houses of Egypt", cluster: exodus}
  planted-on-mountain-of-inheritance: {label: "God brings and plants his people on the mountain of his inheritance, his sanctuary", cluster: poetry}
  pledge-seal-cord-staff: {label: "Seal, cord and staff left as a pledge, later used as proof of paternity", cluster: patriarchs}
  population-relocated-to-cities: {label: "The ruler moves the population into cities from one end of the land to the other", cluster: patriarchs}
  priestly-line-to-phinehas: {label: "Priestly genealogy from Aaron to Phinehas with named wives", cluster: genealogy}
  priests-land-exempt: {label: "Priests' land is exempt because they receive a royal allotment", cluster: patriarchs}
  prophet-as-god-to-king: {label: "God makes the prophet 'as God' to the king with his brother as his prophet", cluster: prophecy}
  prophet-complains-to-god: {label: "Prophet complains to God that his mission has only made things worse", cluster: prophecy}
  prophet-lets-king-set-the-time: {label: "Prophet lets the king choose when the plague should end, to prove God's power", cluster: exodus}
  prophet-meets-king-at-river-at-dawn: {label: "Prophet confronts the king at the river in the morning", cluster: exodus}
  prophet-slow-of-speech: {label: "Prophet protests he is heavy of mouth and tongue or 'uncircumcised of lips'", cluster: prophecy}
  prophetess-leads-women-with-drums-dancing: {label: "A prophetess leads the women with drums and dances in a victory song", cluster: cult}
  prophets-staff-swallows-magicians-staffs: {label: "The prophet's staff-serpent swallows the magicians' staff-serpents", cluster: exodus}
  purge-of-foreign-gods-and-garments: {label: "Household purifies itself, puts away foreign gods and changes garments before going to a holy place", cluster: cult}
  pursuers-drowned-in-sea: {label: "The returning waters drown the pursuing army; not one survives", cluster: exodus}
  qedeshah-term: {label: "A roadside harlot referred to as a qedeshah ('consecrated woman')", cluster: cult}
  quail-cover-the-camp: {label: "Quail come up in the evening and cover the camp", cluster: wilderness}
  rapist-loves-victim-seeks-marriage: {label: "After the rape the prince loves the girl and asks to marry her at any bride-price", cluster: patriarchs}
  redeeming-angel: {label: "The angel who redeemed the patriarch from all evil is invoked to bless", cluster: theology}
  redemption-of-firstborn-sons: {label: "Firstborn sons must be redeemed", cluster: law}
  reluctant-prophet-objects: {label: "The called prophet raises objections (who am I, they won't believe, I can't speak, send someone else)", cluster: prophecy}
  remove-sandals-holy-ground: {label: "Hero told to remove his sandals because the place is holy ground", cluster: theophany}
  rend-garments-grief: {label: "Men tear their garments in grief or dismay", cluster: patriarchs}
  return-after-pursuers-die: {label: "Hero may return home because those seeking his life are dead", cluster: exodus}
  right-hand-of-god: {label: "God's glorious right hand shatters the enemy", cluster: poetry}
  roadside-tomb-pillar: {label: "Wife buried by the roadside and marked with a pillar that stands 'to this day'", cluster: patriarchs}
  roast-whole-with-unleavened-bread-and-bitter-herbs: {label: "Sacrificial lamb roasted whole, head, legs and innards, eaten with unleavened bread and bitter herbs", cluster: cult}
  roundabout-route-avoiding-war: {label: "God leads the people by a roundabout route so they will not see war and turn back", cluster: exodus}
  royal-fifth-tax: {label: "A fifth of the harvest is paid to the king as a perpetual statute", cluster: patriarchs}
  royal-officials-imprisoned: {label: "King's cupbearer and baker imprisoned for offending him", cluster: patriarchs}
  royal-renaming-foreign-name: {label: "King gives the foreign hero a new native name", cluster: patriarchs}
  ruler-fears-growing-foreign-population: {label: "Ruler fears the immigrant people will grow numerous and join his enemies", cluster: exodus}
  sabbath-breakers-find-nothing: {label: "Those who go out to gather on the Sabbath find nothing", cluster: wilderness}
  sabbath-manna-does-not-spoil: {label: "Manna kept for the Sabbath does not spoil or breed worms", cluster: wilderness}
  sabbath-rest-instituted: {label: "Seventh-day rest declared holy to God, with no gathering or going out", cluster: law}
  scarlet-thread-on-hand: {label: "Midwife ties a scarlet thread on the hand of the twin who emerges first", cluster: patriarchs}
  scepter-shall-not-depart-until-shiloh: {label: "Scepter shall not depart from Judah until Shiloh comes and peoples obey him", cluster: prophecy}
  sea-monster-defeated-by-god: {label: "Sea, deep or sea monster subdued or defeated by God", cluster: cosmology}
  sea-split-by-staff-and-east-wind: {label: "Prophet stretches his staff over the sea and God splits it with a strong east wind", cluster: exodus}
  seated-by-birth-order-uncanny: {label: "Hero seats his brothers in order of birth, and they look at one another in amazement", cluster: patriarchs}
  serpent-bites-horses-heels: {label: "A tribe likened to a serpent by the road biting the horse's heels so the rider falls", cluster: poetry}
  seven-day-mourning: {label: "Seven days of mourning for the dead", cluster: patriarchs}
  seven-days-unleavened-bread: {label: "Unleavened bread eaten for seven days", cluster: cult}
  seven-years-plenty-seven-famine: {label: "Seven years of plenty followed by seven years of famine", cluster: dreams}
  seventy-descendants-total: {label: "The family that went down to Egypt numbers seventy persons", cluster: genealogy}
  shall-our-sister-be-treated-as-harlot: {label: "Avenging brothers retort 'Shall he treat our sister as a harlot?'", cluster: patriarchs}
  shaved-and-changed-clothes-before-king: {label: "Prisoner shaved and dressed in new clothes before appearing before the king", cluster: patriarchs}
  she-is-more-righteous-than-i: {label: "Man acknowledges the wronged woman: 'She is more righteous than I'", cluster: patriarchs}
  shechem-portion-taken-by-sword-and-bow: {label: "Patriarch bequeaths a portion (shekhem) he took from the Amorites with sword and bow", cluster: patriarchs}
  sheep-shearing-festival: {label: "Sheep-shearing as an occasion for travel and festivity", cluster: patriarchs}
  shepherd-called-at-mountain-of-god: {label: "A shepherd tending flocks comes to the mountain of God and is called", cluster: prophecy}
  shepherds-abomination-to-egypt: {label: "Every shepherd is an abomination to the Egyptians", cluster: patriarchs}
  sign-is-future-worship-on-mountain: {label: "The sign confirming the call is that the people will later worship on this mountain", cluster: prophecy}
  sign-on-hand-between-eyes: {label: "The rite shall be a sign on your hand and a memorial between your eyes", cluster: law}
  six-hundred-thousand-men: {label: "About 600,000 men on foot leave Egypt, besides children", cluster: exodus}
  so-egypt-shall-know-i-am-yhwh: {label: "Wonders done so that Egypt shall know 'I am YHWH'", cluster: exodus}
  son-closes-fathers-eyes: {label: "God promises the son will close his father's eyes at death", cluster: patriarchs}
  son-lies-with-fathers-concubine: {label: "A son lies with his father's concubine", cluster: patriarchs}
  son-named-for-exile: {label: "Hero names his son for being a stranger in a foreign land", cluster: exodus}
  son-of-canaanite-woman-noted: {label: "Genealogy notes one son as 'son of the Canaanite woman'", cluster: genealogy}
  sons-named-for-forgetting-and-fruitfulness: {label: "Hero names his sons for forgetting his hardship and being fruitful in affliction", cluster: patriarchs}
  sons-of-korah-line: {label: "Genealogy of Korah and his sons", cluster: genealogy}
  spirit-of-god-in-man: {label: "A foreign king recognizes 'a man in whom is the spirit of God'", cluster: patriarchs}
  spreading-hands-in-prayer: {label: "Prophet spreads out his palms to God in prayer", cluster: cult}
  staff-becomes-serpent: {label: "A staff thrown down becomes a serpent and turns back into a staff", cluster: exodus}
  stand-still-and-see-salvation: {label: "'Stand still and see the salvation of YHWH; YHWH will fight for you'", cluster: exodus}
  standing-stone-anointed-libation: {label: "A standing stone erected and anointed with oil and a libation", cluster: cult}
  statute-given-and-people-tested: {label: "At a desert stop God gives statute and ordinance and tests the people", cluster: wilderness}
  taskmasters-and-foremen: {label: "Foreign taskmasters over native foremen who are beaten for unmet quotas", cluster: exodus}
  tell-it-to-your-son: {label: "Command to tell one's son and grandson of God's deeds in Egypt", cluster: cult}
  terror-of-god-on-cities: {label: "A divine terror falls on surrounding cities so they do not pursue", cluster: patriarchs}
  three-days-custody: {label: "Brothers held in custody for three days", cluster: patriarchs}
  three-days-journey-to-sacrifice-pretext: {label: "Request for a three days' journey into the wilderness to sacrifice", cluster: exodus}
  three-days-without-water: {label: "Three days in the wilderness without finding water", cluster: wilderness}
  three-items-equal-three-days: {label: "Three items in a dream (branches, baskets) signify three days", cluster: dreams}
  town-assembly-at-gate: {label: "Leaders persuade the townsmen at the city gate", cluster: patriarchs}
  tribal-animal-emblems: {label: "Tribes characterized by animal images (lion, ass, serpent, hind, wolf)", cluster: poetry}
  twelve-sons-list: {label: "Twelve sons of the patriarch listed by their mothers", cluster: genealogy}
  twelve-springs-seventy-palms: {label: "Oasis with twelve springs and seventy palm trees", cluster: wilderness}
  twins-struggle-at-birth: {label: "Twins contend at birth over who emerges first", cluster: patriarchs}
  two-brothers-massacre-city: {label: "Two brothers slay all the males of a city with the sword and plunder it", cluster: patriarchs}
  tyrant-calls-oppressed-lazy: {label: "Tyrant accuses the oppressed of idleness for wanting to worship", cluster: exodus}
  tyrant-preserved-to-display-gods-power: {label: "God has kept the tyrant alive to show his power and make his name known in all the earth", cluster: theology}
  unprecedented-since-founding: {label: "A plague unlike any since the nation was founded, or ever again", cluster: exodus}
  veiled-woman-at-roadside-deceives: {label: "A widow veils herself, sits by the road and is taken for a harlot by her father-in-law", cluster: patriarchs}
  victory-song-after-deliverance: {label: "Leader and people sing a victory song after the enemy's destruction", cluster: poetry}
  wagons-from-egypt: {label: "Wagons sent from Egypt to carry the father and families", cluster: patriarchs}
  walk-on-dry-ground-waters-as-walls: {label: "The people walk on dry ground through the sea with the waters as a wall on either side", cluster: exodus}
  water-of-gold-name: {label: "A queen's ancestry includes a figure named 'Waters of Gold' (Me-Zahav)", cluster: genealogy}
  waters-heaped-by-divine-breath: {label: "By the blast of God's nostrils the waters pile up and the deeps congeal", cluster: poetry}
  weeping-heard-by-egypt: {label: "Hero weeps so loudly that the Egyptians and the king's house hear", cluster: patriarchs}
  weeping-on-necks: {label: "Brothers or father and son fall on each other's necks and weep", cluster: patriarchs}
  what-is-it-name-of-manna: {label: "Manna named from the people's question 'What is it?' (man hu)", cluster: wilderness}
  who-is-yhwh-defiance: {label: "King defies the prophet: 'Who is YHWH that I should obey him?'", cluster: exodus}
  who-made-you-judge-over-us: {label: "Kinsman rebuffs the hero: 'Who made you prince and judge over us?'", cluster: exodus}
  whole-world-comes-to-buy-grain: {label: "All lands come to Egypt to buy grain from the hero", cluster: patriarchs}
  why-do-you-cry-to-me: {label: "God tells the praying leader: 'Why do you cry to me? Tell the people to go forward'", cluster: exodus}
  widow-withheld-from-youngest-son: {label: "Father-in-law withholds his youngest son from the widow, fearing he too will die", cluster: law}
  wife-circumcises-son-with-flint: {label: "Wife cuts off her son's foreskin with a flint and touches it to the threatened man", cluster: exodus}
  wind-drives-locusts-into-sea: {label: "A west wind carries the locusts into the Sea of Reeds", cluster: exodus}
  wonder-working-staff: {label: "The hero carries 'the staff of God' with which he performs signs", cluster: exodus}
  wordplay-blessings-on-names: {label: "Tribal sayings pun on each son's name", cluster: poetry}
  yhwh-reigns-forever: {label: "Hymn climaxes with 'YHWH will reign forever and ever'", cluster: poetry}
  younger-preferred-over-elder: {label: "The younger son is preferred over the elder in blessing or destiny", cluster: patriarchs}
  youngest-given-fivefold-portion: {label: "The youngest brother is served five times as much as the others", cluster: patriarchs}
units:
  - id: hb-gen-34-dinah-shechem
    tradition: judaism
    title: Dinah, Shechem and the massacre by Simeon and Levi
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Gen 34:1-31"]
    tags:
      - {motif: daughter-goes-out-seized-by-prince, refs: ["Gen 34:1", "Gen 34:2"], note: "Dinah 'went out to see the daughters of the land'; Shechem the nasi takes and humbles her"}
      - {motif: rapist-loves-victim-seeks-marriage, refs: ["Gen 34:3", "Gen 34:4", "Gen 34:8", "Gen 34:12"], note: "his soul 'clung' to her; offers any mohar and gift"}
      - {motif: father-silent-sons-avenge, refs: ["Gen 34:5", "Gen 34:30"], note: "Jacob 'kept silent' until his sons came"}
      - {motif: nevalah-in-israel-formula, refs: ["Gen 34:7"], note: "'a disgrace in Israel... such a thing is not done'"}
      - {motif: intermarriage-treaty-offer, refs: ["Gen 34:9", "Gen 34:10", "Gen 34:16", "Gen 34:21"]}
      - {motif: deceitful-circumcision-condition, refs: ["Gen 34:13", "Gen 34:14", "Gen 34:15", "Gen 34:24"], note: "be-mirmah; uncircumcision a 'reproach'"}
      - {motif: circumcision-covenant-sign, refs: ["Gen 34:15", "Gen 34:22"], note: "turned into a ruse"}
      - {motif: town-assembly-at-gate, refs: ["Gen 34:20", "Gen 34:24"]}
      - {motif: attack-on-third-day-of-pain, refs: ["Gen 34:25"], note: "while the men were 'in pain' on the third day"}
      - {motif: two-brothers-massacre-city, refs: ["Gen 34:25", "Gen 34:26", "Gen 34:27", "Gen 34:28", "Gen 34:29"]}
      - {motif: shall-our-sister-be-treated-as-harlot, refs: ["Gen 34:31"], note: "the brothers have the last word"}
    hints:
      - "Jubilees 30 and Judith 9:2-4 praise Simeon's zeal; Testament of Levi 5-7 has an angel commission Levi's sword."
      - "Compare 2 Sam 13 (Amnon and Tamar) and the abduction of maidens in Greek myth (Persephone, Europa)."
  - id: hb-gen-35-bethel-rachel-death
    tradition: judaism
    title: Purge of foreign gods, Bethel, Rachel's death in childbirth, Reuben and Bilhah, Isaac's death
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Gen 35:1-29"]
    tags:
      - {motif: purge-of-foreign-gods-and-garments, refs: ["Gen 35:2", "Gen 35:4"], note: "foreign gods and earrings buried under the terebinth at Shechem"}
      - {motif: idols-buried-under-tree, refs: ["Gen 35:4"]}
      - {motif: terror-of-god-on-cities, refs: ["Gen 35:5"], note: "hittat elohim"}
      - {motif: nurse-buried-under-oak, refs: ["Gen 35:8"], note: "Deborah, Rebekah's nurse, under Allon Bakhut 'oak of weeping'"}
      - {motif: name-change-by-god, refs: ["Gen 35:10"], note: "Jacob renamed Israel a second time"}
      - {motif: el-shaddai-revelation, refs: ["Gen 35:11"]}
      - {motif: kings-will-descend-from-patriarch, refs: ["Gen 35:11"]}
      - {motif: standing-stone-anointed-libation, refs: ["Gen 35:14"], note: "drink-offering and oil poured on massebah"}
      - {motif: mother-dies-in-childbirth-names-son, refs: ["Gen 35:16", "Gen 35:17", "Gen 35:18"], note: "Ben-Oni 'son of my sorrow' renamed Binyamin by father"}
      - {motif: midwife-reassures-a-son, refs: ["Gen 35:17"]}
      - {motif: roadside-tomb-pillar, refs: ["Gen 35:19", "Gen 35:20"], note: "Rachel's tomb on the way to Ephrath/Bethlehem 'to this day'"}
      - {motif: son-lies-with-fathers-concubine, refs: ["Gen 35:22"]}
      - {motif: twelve-sons-list, refs: ["Gen 35:22", "Gen 35:23", "Gen 35:24", "Gen 35:25", "Gen 35:26"]}
      - {motif: patriarch-long-lifespan, refs: ["Gen 35:28"], note: "Isaac 180 years"}
      - {motif: estranged-brothers-bury-father, refs: ["Gen 35:29"]}
    hints:
      - "Gen 35:22 reported tersely with a masoretic gap (pisqa); cf. Reuben's punishment Gen 49:4 and Absalom with David's concubines 2 Sam 16:22."
      - "Rachel weeping for her children, Jer 31:15 / Matt 2:18."
  - id: hb-gen-36-edom-genealogy
    tradition: judaism
    title: Generations of Esau, Horite chiefs, kings of Edom
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Gen 36:1-43"]
    tags:
      - {motif: brothers-separate-land-cannot-bear, refs: ["Gen 36:6", "Gen 36:7"], note: "cf. Abram and Lot"}
      - {motif: amalek-born-of-concubine, refs: ["Gen 36:12"], note: "Timna, concubine of Eliphaz, bears Amalek"}
      - {motif: chiefs-alluf-lists, refs: ["Gen 36:15", "Gen 36:16", "Gen 36:29", "Gen 36:40", "Gen 36:43"]}
      - {motif: primeval-giant-peoples, refs: ["Gen 36:20"]}
      - {motif: discovery-of-yemim-while-herding-asses, refs: ["Gen 36:24"], note: "Anah found ha-yemim in the wilderness; meaning disputed (hot springs? mules?)"}
      - {motif: kings-before-israel-had-a-king, refs: ["Gen 36:31"], note: "anachronism formula"}
      - {motif: non-dynastic-king-list, refs: ["Gen 36:32", "Gen 36:33", "Gen 36:34", "Gen 36:35", "Gen 36:36", "Gen 36:37", "Gen 36:38", "Gen 36:39"], note: "each king from a different city"}
      - {motif: bela-son-of-beor-king, refs: ["Gen 36:32"], note: "name echoes Balaam son of Beor"}
      - {motif: water-of-gold-name, refs: ["Gen 36:39"], note: "Mehetabel daughter of Matred daughter of Me-Zahav"}
    hints:
      - "Rabbinic tradition (b. Pesachim 54a) makes Anah the inventor of mule-breeding; Targum Neofiti reads 'mules'."
      - "Eliphaz the Temanite reappears as Job's friend (Job 2:11); Uz (36:28) is Job's land."
  - id: hb-gen-37-joseph-dreams-sold
    tradition: judaism
    title: Joseph's dreams, the pit and the sale to Egypt
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Gen 37:1-36"]
    tags:
      - {motif: hero-age-17-at-start, refs: ["Gen 37:2"], note: "Joseph seventeen, shepherding with the sons of Bilhah and Zilpah"}
      - {motif: hero-reports-brothers-misdeeds, refs: ["Gen 37:2"], note: "dibbatam ra'ah"}
      - {motif: father-favors-son, refs: ["Gen 37:3", "Gen 37:4"], note: "son of his old age"}
      - {motif: special-garment-from-father, refs: ["Gen 37:3"], note: "ketonet passim"}
      - {motif: dream-sheaves-bow, refs: ["Gen 37:7"]}
      - {motif: dream-heavenly-bodies-bow, refs: ["Gen 37:9"]}
      - {motif: father-rebukes-dream, refs: ["Gen 37:10", "Gen 37:11"], note: "'his father kept the matter'"}
      - {motif: father-sends-son-to-brothers, refs: ["Gen 37:13", "Gen 37:14"]}
      - {motif: hineni-response, refs: ["Gen 37:13"]}
      - {motif: mysterious-man-gives-directions, refs: ["Gen 37:15", "Gen 37:16", "Gen 37:17"], note: "an anonymous 'man' finds Joseph wandering in the field"}
      - {motif: brothers-plot-death, refs: ["Gen 37:18", "Gen 37:19", "Gen 37:20"], note: "'this master of dreams'"}
      - {motif: wild-animal-blamed, refs: ["Gen 37:20", "Gen 37:33"]}
      - {motif: one-brother-dissuades-killing, refs: ["Gen 37:21", "Gen 37:22", "Gen 37:26", "Gen 37:27"], note: "Reuben and then Judah"}
      - {motif: cast-into-pit, refs: ["Gen 37:24"], note: "the pit was empty, no water in it"}
      - {motif: brothers-eat-while-victim-in-pit, refs: ["Gen 37:25"]}
      - {motif: rescued-by-caravan, refs: ["Gen 37:25", "Gen 37:28"], note: "Ishmaelites with gum, balm and ladanum; also Midianite traders"}
      - {motif: sold-for-paltry-price, refs: ["Gen 37:28"], note: "twenty pieces of silver"}
      - {motif: bloodied-garment-deception, refs: ["Gen 37:31", "Gen 37:32"], note: "goat's blood"}
      - {motif: haker-na-recognition-formula, refs: ["Gen 37:32", "Gen 37:33"]}
      - {motif: father-believes-and-mourns, refs: ["Gen 37:33", "Gen 37:34", "Gen 37:35"], note: "'I will go down to Sheol to my son mourning'"}
      - {motif: bought-by-egyptian-official, refs: ["Gen 37:36"], note: "Potiphar, saris of Pharaoh, chief of the guard/cooks"}
    hints:
      - "Quran 12:4-20; Testaments of Zebulun and Gad. Twenty silver later read as typological for Judas's thirty (Matt 26:15)."
      - "The Egyptian Tale of Two Brothers parallels the coming seduction episode."
  - id: hb-gen-38-judah-tamar
    tradition: judaism
    title: Judah and Tamar
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Gen 38:1-30"]
    tags:
      - {motif: god-kills-wicked-son, refs: ["Gen 38:7", "Gen 38:10"], note: "Er and Onan slain by YHWH"}
      - {motif: levirate-marriage, refs: ["Gen 38:8"], note: "yabbem; 'raise up seed for your brother'"}
      - {motif: coitus-interruptus-sin, refs: ["Gen 38:9"], note: "Onan 'spoiled it on the ground'"}
      - {motif: widow-withheld-from-youngest-son, refs: ["Gen 38:11", "Gen 38:14"]}
      - {motif: veiled-woman-at-roadside-deceives, refs: ["Gen 38:14", "Gen 38:15"], note: "sits at Petah Enayim on the road to Timnah"}
      - {motif: sheep-shearing-festival, refs: ["Gen 38:12", "Gen 38:13"]}
      - {motif: pledge-seal-cord-staff, refs: ["Gen 38:17", "Gen 38:18", "Gen 38:25"], note: "hotam, petil, matteh"}
      - {motif: kid-as-harlots-fee, refs: ["Gen 38:17", "Gen 38:20"]}
