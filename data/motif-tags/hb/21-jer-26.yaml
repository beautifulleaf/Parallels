      - {motif: two-years-restoration-promise, refs: ["Jer 28:3", "Jer 28:11"]}
      - {motif: prophet-says-amen-ironically, refs: ["Jer 28:6"]}
      - {motif: peace-prophet-proven-by-fulfillment, refs: ["Jer 28:8-9"]}
      - {motif: sign-object-broken-by-rival, refs: ["Jer 28:10-11"]}
      - {motif: wooden-yoke-replaced-by-iron, refs: ["Jer 28:13-14"]}
