  watchman-responsible-for-blood-if-silent: {label: "If the watchman fails to warn the wicked, God requires their blood from him", cluster: prophecy}
  watchmen-call-pilgrimage-to-zion: {label: "Watchmen on Mount Ephraim call 'Arise, let us go up to Zion to YHWH'", cluster: restoration}
  waters-from-north-flood: {label: "Waters rise from the north and become an overflowing torrent", cluster: prophecy}
  weak-king-yields-to-officials: {label: "The king says he can do nothing against his officials and hands the prophet over", cluster: kingship}
  weeping-in-the-night-tears-on-cheek: {label: "She weeps bitterly in the night with tears on her cheek", cluster: lament}
  wheel-rims-full-of-eyes: {label: "The rims of the wheels are full of eyes all around", cluster: merkavah}
  wheel-within-a-wheel: {label: "Wheels gleaming like beryl, constructed as a wheel within a wheel, beside each creature", cluster: merkavah}
  whether-they-hear-or-refuse: {label: "The prophet must speak 'whether they hear or refuse'", cluster: prophecy}
  who-is-like-me-challenge: {label: "God asks 'Who is like me? Who will summon me? What shepherd can stand before me?'", cluster: theology}
  whose-word-shall-stand-mine-or-theirs: {label: "Events will show whose word will stand, God's or the people's", cluster: prophecy}
  wild-beasts-given-to-world-ruler: {label: "God gives even the wild beasts of the field to serve the world conqueror", cluster: kingship}
  wine-settled-on-its-lees: {label: "A nation at ease like wine settled on its lees, never poured from vessel to vessel", cluster: oracles-nations}
  wine-test-offered-to-abstainers: {label: "The prophet sets wine before abstainers in the temple and they refuse", cluster: asceticism}
  wings-touching-and-covering-bodies: {label: "Each creature has wings touching its neighbor's and wings covering its body", cluster: merkavah}
  wisdom-of-teman: {label: "Is there no longer wisdom in Teman (Edom)?", cluster: wisdom}
  wives-of-kings-lead-astray: {label: "The wickedness of the kings of Judah and of their wives", cluster: cult}
  women-lead-household-goddess-cult-with-husbands-consent: {label: "Women burn incense to a goddess, claiming they did so with their husbands' knowledge", cluster: cult}
  wooden-yoke-replaced-by-iron: {label: "The broken wooden yoke will be replaced by a yoke of iron", cluster: prophecy}
  wordplay-on-place-names: {label: "Puns on the names of towns under judgment", cluster: poetics}
  wounded-men-will-burn-city: {label: "Even if only wounded men remained in the enemy camp they would rise and burn the city", cluster: prophecy}
  yhwh-our-righteousness-name: {label: "The name 'YHWH is our righteousness' (YHWH tsidqenu)", cluster: messianism}
  yoke-of-sins-knotted-on-neck: {label: "The yoke of the sinner's transgressions is knotted by God's hand onto her neck", cluster: lament}
  zion-plowed-as-field: {label: "Zion shall be plowed as a field and Jerusalem become heaps", cluster: prophecy}
  ephraim-like-untrained-calf: {label: "Ephraim likens himself to an untrained calf, chastised, and slaps his thigh in repentance", cluster: repentance}
units:
  - id: hb-jer-26-temple-sermon-trial
    tradition: judaism
    title: "Jeremiah tried for prophesying the temple will become like Shiloh; Uriah executed"
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Jer 26:1-24"]
    tags:
      - {motif: prophet-stands-in-temple-court-to-preach, refs: ["Jer 26:2"], note: "Do not diminish a word (al tigra davar)"}
      - {motif: no-adding-or-subtracting, refs: ["Jer 26:2"]}
      - {motif: god-may-relent-if-people-repent, refs: ["Jer 26:3", "Jer 26:13", "Jer 26:19"]}
      - {motif: temple-will-become-like-shiloh, refs: ["Jer 26:6", "Jer 26:9"]}
      - {motif: shiloh-sanctuary-abandoned, refs: ["Jer 26:6", "Jer 26:9"]}
      - {motif: prophet-put-on-trial-for-prophecy, refs: ["Jer 26:8", "Jer 26:11", "Jer 26:16"], note: "Priests and prophets demand death; officials acquit"}
      - {motif: officials-sit-at-new-gate-as-court, refs: ["Jer 26:10"]}
      - {motif: innocent-blood-on-city, refs: ["Jer 26:15"]}
      - {motif: elders-cite-earlier-prophet-as-precedent, refs: ["Jer 26:17-19"], note: "Micah of Moresheth quoted: Zion ploughed as a field (Mic 3:12)"}
      - {motif: zion-plowed-as-field, refs: ["Jer 26:18"]}
      - {motif: prophet-flees-to-egypt-extradited-killed, refs: ["Jer 26:20-23"], note: "Uriah son of Shemaiah of Kiriath-jearim, fetched by Elnathan son of Achbor"}
      - {motif: killing-of-prophets, refs: ["Jer 26:23"]}
      - {motif: body-cast-into-common-graves, refs: ["Jer 26:23"]}
      - {motif: patron-official-protects-prophet, refs: ["Jer 26:24"], note: "Ahikam son of Shaphan"}
    hints:
      - "Compare Socrates' trial; Jesus' temple saying and trial (Mark 14:58); Quran 2:61/3:21 on Israel killing prophets."
  - id: hb-jer-27-yoke-bars
