new_motifs:
  all-shall-know-god-no-teaching-needed: {label: "In the new age no one will need to teach his neighbor 'Know YHWH', for all will know him", cluster: theology}
  amon-of-thebes-punished: {label: "God punishes Amon of No (Thebes), Egypt's chief god", cluster: oracles-nations}
  anointed-king-breath-of-our-nostrils: {label: "The captured king is called 'the breath of our nostrils, YHWH's anointed, in whose shadow we would live'", cluster: kingship}
  apis-bull-has-fled: {label: "Egypt's 'mighty one' (abbir, read as the Apis bull) flees and is thrust down", cluster: oracles-nations}
  apostasy-justified-by-prosperity: {label: "Worshipers argue their goddess cult brought plenty and abandoning it brought disaster", cluster: cult}
  arabs-with-cropped-temples: {label: "Desert peoples described as those with the corners of their hair clipped", cluster: oracles-nations}
  ararat-minni-ashkenaz-summoned: {label: "The northern kingdoms Ararat, Minni and Ashkenaz are summoned against Babylon", cluster: oracles-nations}
  as-tabor-among-mountains: {label: "The conqueror comes as Tabor among the mountains and Carmel by the sea", cluster: oracles-nations}
  assassin-feigns-weeping: {label: "The murderer goes out weeping to lure his victims in", cluster: narrative}
  assyria-then-babylon-devour-israel: {label: "Israel a scattered sheep: first Assyria devoured it, last Babylon gnawed its bones", cluster: history}
  atbash-cipher-names: {label: "Names hidden by the atbash letter cipher (Sheshach for Babel, Leb-qamai for Kasdim)", cluster: scribal}
  babylon-climbs-to-heaven: {label: "Though Babylon should climb to heaven and fortify its height, destroyers will reach it", cluster: oracles-nations}
  babylonian-officers-sit-in-middle-gate: {label: "The conquering Babylonian officers, named with their titles (Rab-saris, Rab-mag), sit in the city's Middle Gate", cluster: history}
  baldness-and-gashing-in-mourning: {label: "Mourners shave their heads, clip beards and gash their bodies", cluster: mourning}
  balm-for-incurable-city: {label: "Ironic call to bring balm for a fallen city that cannot be healed", cluster: oracles-nations}
  balm-of-gilead: {label: "Go up to Gilead for balm: medicine that cannot heal the wound", cluster: prophecy}
  battle-of-carchemish: {label: "Egypt defeated by Babylon at Carchemish on the Euphrates", cluster: history}
  bel-and-marduk-shamed: {label: "Babylon's gods Bel and Merodach are put to shame and its idols dismayed", cluster: oracles-nations}
  bel-disgorges-what-he-swallowed: {label: "God punishes Bel and makes him vomit out what he swallowed", cluster: oracles-nations}
  better-slain-by-sword-than-famine: {label: "Those slain by the sword are better off than those wasting from hunger", cluster: lament}
  blessed-be-the-glory-from-his-place: {label: "Heavenly voice cries 'Blessed be the glory of YHWH from his place'", cluster: merkavah}
  blind-and-lame-return: {label: "The blind, the lame and women in labor are among the returning exiles", cluster: restoration}
  bodies-thrown-into-cistern: {label: "Victims' corpses are thrown into a cistern", cluster: narrative}
  body-cast-into-common-graves: {label: "The executed man's body is thrown into the graves of the common people", cluster: narrative}
  book-ends-on-note-of-rejection: {label: "A book closes on the fear that God has utterly rejected his people", cluster: lament}
  bound-with-cords-cannot-turn: {label: "The prophet is bound with cords so he cannot turn from side to side", cluster: prophecy}
  bow-of-elam-broken: {label: "God breaks the bow of Elam, the chief of their might", cluster: oracles-nations}
  bowels-in-turmoil-heart-overturned: {label: "The sufferer's bowels churn and heart turns over within her", cluster: lament}
  breach-vast-as-the-sea: {label: "The city's ruin is as vast as the sea; who can heal it?", cluster: lament}
  bread-baked-on-human-dung: {label: "The prophet is told to bake his bread over human excrement as a sign of unclean exile food", cluster: prophecy}
  broken-staff-of-might: {label: "Lament: how the mighty staff, the glorious rod, is broken", cluster: oracles-nations}
  broken-vessel-no-one-wants: {label: "The nation is broken like a vessel no one wants", cluster: prophecy}
  build-houses-plant-gardens-in-exile: {label: "Exiles told to build houses, plant gardens, marry and multiply in the foreign land", cluster: exile}
  burning-of-foreign-temples: {label: "The conqueror will burn the temples of a foreign land's gods", cluster: oracles-nations}
  cakes-in-image-of-goddess: {label: "Women bake cakes bearing the image of the goddess they worship", cluster: cult}
  call-to-me-and-i-will-answer-hidden-things: {label: "God invites the prophet to call so he will reveal great and hidden things", cluster: revelation}
  cast-into-pit-stone-on-top: {label: "Enemies cast the sufferer into a pit and throw stones on him; waters close over his head", cluster: lament}
  catalogue-of-moabite-towns: {label: "Long list of Moabite towns under judgment (Dibon, Nebo, Kiriathaim, Kerioth, Bozrah...)", cluster: geography}
  child-sacrifice-to-molech-in-hinnom: {label: "Sons and daughters passed through fire to Molech at the high places in the Valley of Ben-Hinnom", cluster: cult}
  children-faint-in-the-streets: {label: "Infants and sucklings faint from hunger in the city squares, asking their mothers for bread and wine", cluster: lament}
  city-as-menstruant-impure-woman: {label: "The fallen city is likened to a menstruant (niddah) whose impurity is in her skirts", cluster: lament}
  city-as-widow: {label: "The ruined city sits alone like a widow", cluster: lament}
  city-drawn-on-brick-and-besieged: {label: "The prophet draws the city on a clay brick and lays a model siege against it", cluster: prophecy}
  city-dwelling-on-many-waters: {label: "The doomed imperial city 'dwells on many waters' rich in treasures", cluster: oracles-nations}
  city-rebuilt-on-its-tell: {label: "The city will be rebuilt on its own ruin-mound and the palace stand in its place", cluster: restoration}
  city-without-gates-or-bars: {label: "A people at ease that dwells alone with neither gates nor bars", cluster: oracles-nations}
  confrontation-at-pool-of-gibeon: {label: "Rival forces meet at the great waters (pool) of Gibeon", cluster: narrative}
  conqueror-protects-prophet: {label: "The foreign conqueror orders his officers to look after the prophet and do him no harm", cluster: narrative}
  cosmic-ordinances-guarantee-covenant: {label: "God's covenant with Israel is as sure as the fixed order of sun, moon, stars and sea", cluster: theology}
  counter-letter-against-prophet: {label: "A rival prophet in exile writes letters demanding that the prophet be silenced", cluster: prophecy}
  covenant-with-day-and-night: {label: "God has a 'covenant with day and night' that fixes their order", cluster: cosmology}
  creator-gives-earth-to-whom-he-pleases: {label: "The creator of earth, humans and beasts gives dominion to whomever he sees fit", cluster: theology}
  creator-hymn-storehouses-of-wind: {label: "God made the earth by power, stretched the heavens, brings lightning for rain and wind from his storehouses", cluster: cosmology}
  creatures-move-without-turning: {label: "The heavenly creatures move straight ahead in every direction without turning", cluster: merkavah}
  creatures-with-calf-feet-and-human-hands: {label: "The heavenly creatures have straight legs with calves' hooves and human hands under their wings", cluster: merkavah}
  crown-fallen-from-head: {label: "The crown has fallen from our head; woe to us for we have sinned", cluster: lament}
  cry-heard-at-red-sea: {label: "The cry at a nation's fall is heard as far as the Red Sea", cluster: oracles-nations}
  cry-out-in-night-watches: {label: "Arise and cry out in the night at the beginning of the watches, pour out your heart like water", cluster: lament}
  crystal-firmament-over-creatures: {label: "A firmament gleaming like awesome ice/crystal is spread above the creatures' heads", cluster: merkavah}
  curse-on-who-withholds-sword: {label: "Cursed is he who does YHWH's work slackly and keeps his sword from blood", cluster: war}
  cush-put-lud-mercenaries: {label: "Egypt's army includes Cushite, Putite and Ludite mercenaries", cluster: war}
  daily-loaf-from-bakers-street: {label: "The imprisoned prophet receives a daily loaf from the bakers' street until bread runs out", cluster: narrative}
  david-never-lacks-a-man-on-throne: {label: "David shall never lack a man to sit on the throne of Israel", cluster: kingship}
  day-for-a-year: {label: "Prophetic time reckoned a day for each year", cluster: prophecy}
  day-of-the-lords-anger: {label: "The day of YHWH's anger on which none escape", cluster: eschatology}
  day-of-vengeance-of-the-lord: {label: "A day of vengeance belonging to YHWH of hosts against his foes", cluster: eschatology}
  day-unlike-any-other: {label: "A great day of distress unlike any other, 'the time of Jacob's trouble', from which he will be saved", cluster: eschatology}
  deportation-numbers: {label: "Precise numbers of deportees for each year of exile", cluster: history}
  desert-demons-inhabit-ruins: {label: "Desert creatures or demons (tsiyyim, iyyim) and ostriches inhabit the ruined city", cluster: demonology}
  destroyed-scripture-rewritten-with-additions: {label: "A destroyed sacred book is rewritten from dictation with many words added", cluster: scribal}
  destroying-mountain-made-burnt-mountain: {label: "The empire as a 'destroying mountain' to be rolled down and made a burnt mountain", cluster: oracles-nations}
  destroying-wind-stirred-by-god: {label: "God stirs up a destroying wind (or spirit) against the empire", cluster: oracles-nations}
  divine-name-no-longer-invoked: {label: "God swears his name will no longer be invoked in oaths by apostates in a foreign land", cluster: theology}
  divine-slaughter-as-sacrifice: {label: "God's battle slaughter is called his sacrifice (zevah)", cluster: war}
  diviners-dreamers-sorcerers-list: {label: "List of prophets, diviners, dreamers, soothsayers and sorcerers who give false assurance", cluster: divination}
  do-not-seek-great-things: {label: "The prophet's scribe is told not to seek great things for himself; his life will be his reward", cluster: wisdom}
  documents-stored-in-clay-jar: {label: "Deeds are put in an earthenware jar so they may last many days", cluster: scribal}
  dove-nesting-in-gorge: {label: "Refugees told to dwell in the rocks like a dove nesting in the sides of a gorge", cluster: oracles-nations}
  drunken-feast-eternal-sleep: {label: "God prepares a feast for the empire's leaders, makes them drunk, and they sleep an eternal sleep", cluster: oracles-nations}
  dwelling-in-darkness-like-the-long-dead: {label: "God makes the sufferer dwell in darkness like those long dead", cluster: lament}
  eagle-spreads-wings-over-nation: {label: "The enemy swoops like an eagle and spreads its wings over a land", cluster: oracles-nations}
  edom-in-land-of-uz-drinks-cup: {label: "Daughter Edom, dwelling in the land of Uz, will drink the cup and strip herself", cluster: oracles-nations}
  egypt-a-beautiful-heifer-stung-by-gadfly: {label: "Egypt a beautiful heifer, a gadfly from the north coming upon her", cluster: oracles-nations}
  egypt-as-false-refuge: {label: "The remnant seeks safety in Egypt, where they think they will see no war nor hunger", cluster: exile}
  egypt-hisses-like-serpent: {label: "Egypt's voice goes off like a hissing serpent", cluster: oracles-nations}
  egypt-rising-like-the-nile: {label: "Egypt rises like the Nile flood, boasting to cover the earth", cluster: oracles-nations}
  egyptian-help-is-futile: {label: "Pharaoh's relieving army will turn back home; reliance on Egypt fails", cluster: prophecy}
  eikhah-lament-opening: {label: "A lament opens with the cry 'Eikhah!' (How!)", cluster: lament}
  elders-cite-earlier-prophet-as-precedent: {label: "Elders cite an earlier prophet's unharmed oracle of doom as precedent for sparing a prophet", cluster: prophecy}
  enigmatic-thirtieth-year-date: {label: "A vision dated 'in the thirtieth year' without stated era", cluster: prophecy}
  envoy-sent-among-nations: {label: "An envoy is sent among the nations to summon them to battle", cluster: prophecy}
  everlasting-covenant: {label: "God promises an everlasting covenant (berit olam) with his people", cluster: theology}
  everlasting-love-of-god: {label: "God has loved his people with an everlasting love and drawn them with faithfulness", cluster: theology}
  exiled-king-released-and-dines-with-captor: {label: "A captive king is released after decades, changes his prison clothes and eats at the foreign king's table", cluster: kingship}
  eyes-flow-with-streams-of-water: {label: "The mourner's eyes run down with streams of water ceaselessly", cluster: lament}
  fall-of-babylon: {label: "Babylon taken and destroyed", cluster: oracles-nations}
  fall-of-jerusalem: {label: "Jerusalem is breached, captured and burned by the Babylonians", cluster: history}
  false-prophet-dies-as-foretold: {label: "A false prophet dies within the year as the true prophet foretold", cluster: prophecy}
  false-prophet-line-cut-off: {label: "A false prophet's descendants will be cut off and he will not see the coming good", cluster: prophecy}
  false-prophets-burned-by-king: {label: "Lying prophets are roasted in fire by a foreign king and become a byword in curses", cluster: prophecy}
  false-prophets-commit-adultery: {label: "Lying prophets commit adultery with their neighbors' wives", cluster: prophecy}
  false-prophets-of-peace: {label: "Prophets falsely promise peace and safety while disaster approaches", cluster: prophecy}
  fathers-abandon-children-in-panic: {label: "At the roar of chariots fathers do not turn back for their children", cluster: war}
  fathers-ate-sour-grapes: {label: "Proverb 'The fathers ate sour grapes and the children's teeth are set on edge', rejected", cluster: theology}
  fear-not-my-servant-jacob: {label: "'Fear not, Jacob my servant': God will save Israel from afar and discipline in measure", cluster: restoration}
  fed-wormwood-and-gall: {label: "God sates the sufferer with bitterness and makes him drunk with wormwood", cluster: lament}
  feet-sunk-in-mire: {label: "Someone's feet sink in the mud or mire", cluster: narrative}
  female-surrounds-man-new-creation: {label: "God creates a new thing on earth: 'a female shall encompass a man'", cluster: eschatology}
  fiery-torches-and-lightning-among-creatures: {label: "Fire like torches moves among the creatures and lightning flashes from it", cluster: merkavah}
  fire-sent-into-bones: {label: "From on high God sent fire into the sufferer's bones", cluster: lament}
  flee-from-babylon: {label: "Call to God's people to flee from Babylon and save their lives", cluster: exile}
  flocks-pass-under-hand-of-counter: {label: "Flocks will again pass under the hand of the one who counts them in the towns of Judah", cluster: restoration}
  foe-from-the-north: {label: "A destroying nation comes from the north", cluster: prophecy}
  footstool-of-god-forgotten: {label: "God did not remember his footstool (Zion or the ark) on the day of his anger", cluster: lament}
  forehead-hard-as-diamond: {label: "God makes the prophet's forehead as hard as diamond against a hard-faced people", cluster: prophecy}
  foreign-eunuch-rescues-prophet: {label: "A foreign (Cushite) eunuch at court intercedes for and rescues the prophet", cluster: narrative}
  foreign-king-called-gods-servant: {label: "God calls the foreign conqueror 'my servant'", cluster: theology}
  foreign-officer-acknowledges-israels-god: {label: "A foreign commander tells the prophet that his God brought this disaster for the people's sin", cluster: narrative}
  foreigners-would-listen-israel-will-not: {label: "Foreign peoples of strange speech would heed the prophet, but Israel will not", cluster: prophecy}
  four-faces-man-lion-ox-eagle: {label: "Each heavenly creature has four faces: human, lion, ox and eagle", cluster: merkavah}
  four-living-creatures-hayyot: {label: "Four living creatures (hayyot) of human form bear the divine throne", cluster: merkavah}
  four-winds-from-four-ends-of-heaven: {label: "God brings the four winds from the four ends of heaven to scatter a people", cluster: cosmology}
  foxes-prowl-on-ruined-zion: {label: "Foxes (jackals) prowl over desolate Mount Zion", cluster: lament}
  freed-slaves-re-enslaved: {label: "Owners free their Hebrew slaves under covenant oath, then take them back", cluster: law}
  future-davidic-king-raised: {label: "God will raise up 'David their king' for the restored people", cluster: kingship}
  gates-sunk-into-the-earth: {label: "The city's gates sink into the ground and their bars are broken", cluster: lament}
  gentiles-enter-the-sanctuary: {label: "Nations forbidden to enter the assembly invade the sanctuary", cluster: cult}
  give-wings-to-moab: {label: "'Give wings to Moab', for she must flee away", cluster: oracles-nations}
  glory-appears-in-the-valley: {label: "The glory seen by the river appears again to the prophet in a valley/plain", cluster: merkavah}
  glory-of-the-lord-kavod: {label: "The prophet sees 'the likeness of the glory of YHWH' as radiant fire enthroned", cluster: merkavah}
  god-abandons-own-sanctuary: {label: "God himself spurns his altar and destroys his own sanctuary and festivals", cluster: theology}
  god-as-advocate-and-redeemer: {label: "God pleads the sufferer's cause and redeems his life", cluster: theology}
  god-as-father-of-israel: {label: "God declares 'I am a father to Israel'", cluster: theology}
  god-as-hunter-or-archer-against-sufferer: {label: "God like a bear or lion lying in wait, bending his bow and shooting arrows into the sufferer", cluster: lament}
  god-as-portion-of-jacob: {label: "'The Portion of Jacob' is not like idols, but the former of all things", cluster: theology}
  god-becomes-enemy-of-his-people: {label: "The Lord has become like an enemy to his own people", cluster: theology}
  god-cast-down-glory-from-heaven: {label: "God cast down the splendor of Israel from heaven to earth", cluster: lament}
  god-does-not-afflict-willingly: {label: "God does not willingly afflict or grieve human beings", cluster: theology}
  god-dries-up-sea-of-babylon: {label: "God dries up Babylon's 'sea' and makes her fountain dry", cluster: oracles-nations}
  god-heals-the-city: {label: "God promises to bring healing and cure to the ruined city", cluster: restoration}
  god-is-witness: {label: "God is the one who knows and is witness against secret sins", cluster: theology}
  god-may-relent-if-people-repent: {label: "Perhaps the people will turn from evil and God will relent of the disaster he planned", cluster: theology}
  god-of-nation-goes-into-exile: {label: "A conquered nation's god goes into exile with his priests and princes", cluster: oracles-nations}
  god-opens-armory-of-wrath: {label: "God opens his armory and brings out the weapons of his indignation", cluster: war}
  god-relents-cow-dung-substitute: {label: "After the prophet protests, God allows cow dung instead of human dung for baking", cluster: prophecy}
  god-remembers-sin-no-more: {label: "God will forgive iniquity and remember sin no more", cluster: theology}
  god-repents-of-evil-done: {label: "God says he repents (nihamti) of the evil he did to his people", cluster: theology}
  god-sets-throne-in-foreign-land: {label: "God sets his own throne in a conquered foreign land", cluster: oracles-nations}
  god-spreads-net-for-feet: {label: "God spread a net for the sufferer's feet and turned him back", cluster: lament}
  god-stirs-sea-waves-roar: {label: "God who stirs up the sea so its waves roar", cluster: cosmology}
  god-swears-by-his-great-name: {label: "God swears by his great name", cluster: theology}
  god-treads-winepress-of-virgin-judah: {label: "The Lord trod the virgin daughter of Judah as in a winepress", cluster: lament}
  gods-bowels-yearn: {label: "God's innards yearn (hamu me'ai) with compassion for his wayward son", cluster: theology}
  gods-eyes-open-on-all-ways: {label: "God's eyes are open on all the ways of humanity to repay each by his deeds", cluster: theology}
  gods-throne-endures-forever: {label: "YHWH sits enthroned forever; his throne endures from generation to generation", cluster: theology}
  golden-cup-intoxicating-nations: {label: "Babylon is a golden cup in God's hand that made all the earth drunk", cluster: oracles-nations}
  good-and-evil-from-mouth-of-most-high: {label: "Both evil and good come from the mouth of the Most High", cluster: theology}
  good-to-bear-yoke-in-youth: {label: "It is good for a man to bear the yoke in his youth", cluster: wisdom}
  governor-appointed-over-remnant: {label: "The conqueror appoints a native governor over the remnant left in the land", cluster: history}
  grace-in-the-wilderness: {label: "The people who survived the sword found grace in the wilderness", cluster: restoration}
  grape-gatherers-leave-gleanings: {label: "Grape-gatherers would leave gleanings and thieves take only enough, but God strips the nation bare", cluster: oracles-nations}
  grape-treaders-shout-hedad-ceases: {label: "The joyful 'hedad' shout of grape-treaders falls silent", cluster: oracles-nations}
  hammer-of-the-whole-earth: {label: "Babylon called the 'hammer of the whole earth' is broken", cluster: oracles-nations}
  hand-of-the-lord-on-prophet: {label: "'The hand of YHWH was upon' the prophet, bringing a vision or transport", cluster: prophecy}
  hand-stretched-out-holding-scroll: {label: "A hand is stretched out to the prophet holding a scroll", cluster: revelation}
  harem-women-taunt-the-king: {label: "The king's women led out to the conquerors sing a taunt that his friends deceived him", cluster: kingship}
  hashmal-amber-gleam: {label: "The center of the fire gleams like hashmal (amber/electrum)", cluster: merkavah}
  heaven-and-earth-rejoice-over-fall: {label: "Heaven and earth and all in them sing for joy over the empire's fall", cluster: eschatology}
  heavenly-scroll-eaten-by-prophet: {label: "The prophet is made to eat a heavenly scroll", cluster: revelation}
  heavens-cannot-be-measured: {label: "If the heavens above could be measured and the earth's foundations searched out, God would reject Israel", cluster: cosmology}
  heavens-opened-vision: {label: "The heavens are opened and the prophet sees visions of God", cluster: revelation}
  hebrew-slave-freed-in-seventh-year: {label: "A Hebrew slave must be freed after six years of service", cluster: law}
  hidden-stores-buy-life: {label: "Captives buy their lives by revealing hidden stores of wheat, barley, oil and honey", cluster: narrative}
  holy-stones-scattered-in-streets: {label: "The holy stones lie scattered at the head of every street", cluster: lament}
  horn-cut-off-arm-broken: {label: "A nation's horn is cut off and its arm broken", cluster: war}
  hoy-lament-cry: {label: "Funeral cry 'Hoy, lord!' (alas, master) for a dead king", cluster: mourning}
  hunted-like-a-bird: {label: "Enemies hunted the sufferer like a bird without cause", cluster: lament}
  idol-polemic-no-breath: {label: "Every goldsmith is shamed by his idol; his images are false with no breath in them", cluster: cult}
  incense-to-baal-on-rooftops: {label: "Incense offered to Baal and libations to other gods on the roofs of houses", cluster: cult}
  incurable-wound-of-zion: {label: "Zion's wound is incurable, with no healing and no one to plead her cause", cluster: lament}
  individual-responsibility-for-sin: {label: "Each person dies for his own sin", cluster: theology}
  infant-tongue-cleaves-from-thirst: {label: "The suckling's tongue cleaves to its palate from thirst", cluster: lament}
  inheritance-turned-to-strangers: {label: "Our inheritance is turned over to strangers, our houses to foreigners", cluster: lament}
  innocent-blood-on-city: {label: "Killing the innocent prophet will bring innocent blood upon the city and its people", cluster: law}
  invaders-like-woodcutters-and-locusts: {label: "Invaders come with axes like woodcutters, more numerous than locusts", cluster: war}
  iron-griddle-as-wall: {label: "The prophet sets an iron griddle as an iron wall between himself and the city", cluster: prophecy}
  ironic-call-to-arms: {label: "Ironic summons to an army to arm itself before its rout", cluster: war}
  ironic-measure-for-measure-release: {label: "Because they revoked the slaves' release, God 'proclaims a release' for them to sword, pestilence and famine", cluster: law}
  ironic-permission-fulfill-your-vows: {label: "The prophet ironically tells idolaters to go ahead and fulfill their vows", cluster: prophecy}
  is-any-sorrow-like-my-sorrow: {label: "'Is it nothing to you, all who pass by? Look and see if there is any sorrow like my sorrow'", cluster: lament}
  israel-not-widowed: {label: "Israel and Judah are not widowed of their God", cluster: theology}
  jackals-nurse-but-ostrich-is-cruel: {label: "Even jackals nurse their young, but the people have become cruel like ostriches", cluster: lament}
  judean-diaspora-in-egypt: {label: "Judeans settled in Egyptian cities: Migdol, Tahpanhes, Memphis and Pathros", cluster: exile}
  killing-of-prophets: {label: "A king or people kills a prophet of God", cluster: prophecy}
  king-burns-scroll-column-by-column: {label: "The king cuts the prophetic scroll column by column with a scribe's knife and burns it in his brazier", cluster: scribal}
  king-captured-in-plains-of-jericho: {label: "The fleeing king is overtaken in the plains of Jericho", cluster: history}
  king-consults-prophet-secretly: {label: "The king secretly summons the imprisoned prophet to ask for a word from God", cluster: kingship}
  king-corpse-exposed-heat-and-frost: {label: "The king's corpse will be cast out to heat by day and frost by night", cluster: kingship}
  king-daughters-taken-captive: {label: "The king's daughters are taken captive", cluster: war}
