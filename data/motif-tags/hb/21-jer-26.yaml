      - {motif: message-to-envoys-of-neighbor-kings, refs: ["Jer 27:3"], note: "Edom, Moab, Ammon, Tyre and Sidon"}
      - {motif: creator-gives-earth-to-whom-he-pleases, refs: ["Jer 27:5"]}
      - {motif: foreign-king-called-gods-servant, refs: ["Jer 27:6"], note: "Nebuchadnezzar 'my servant'"}
      - {motif: wild-beasts-given-to-world-ruler, refs: ["Jer 27:6"]}
      - {motif: three-generations-of-empire, refs: ["Jer 27:7"], note: "Him, his son and his son's son, until his land's time comes"}
      - {motif: sword-famine-pestilence-triad, refs: ["Jer 27:8", "Jer 27:13"]}
      - {motif: diviners-dreamers-sorcerers-list, refs: ["Jer 27:9"]}
      - {motif: false-prophets-of-peace, refs: ["Jer 27:9-10", "Jer 27:14-16"]}
      - {motif: temple-vessels-taken-to-babylon, refs: ["Jer 27:16", "Jer 27:19-22"], note: "Pillars, the Sea, the stands; to return on the day of visitation"}
      - {motif: prophet-should-intercede-test, refs: ["Jer 27:18"]}
    hints:
      - "Compare the temple vessels' fate in Dan 5, Ezra 1:7-11 and legends of hidden vessels (2 Macc 2)."
  - id: hb-jer-28-hananiah
