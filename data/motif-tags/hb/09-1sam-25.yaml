  king-covers-face-in-grief: {label: "The king covers his face and cries aloud in grief", cluster: mourning}
  general-rebukes-grieving-king: {label: "The commander rebukes the king for grieving the enemy and shaming his loyal men", cluster: kingship}
  king-sits-in-gate: {label: "The king takes his seat in the gate to receive the people", cluster: kingship}
  tribes-debate-restoring-king: {label: "The tribes argue about bringing back the exiled king", cluster: kingship}
  rebel-general-offered-command: {label: "The king offers the rebel army's general command of his own army", cluster: kingship}
  curser-begs-pardon-pardoned: {label: "The man who cursed the king comes first to meet him and is pardoned under oath", cluster: kingship}
  mourner-neglects-feet-beard-clothes: {label: "A loyal mourner leaves his feet untended, moustache untrimmed and clothes unwashed", cluster: mourning}
  lame-man-betrayed-by-servant: {label: "A lame man explains his servant deceived him and left him behind", cluster: deception}
  estate-divided-between-claimants: {label: "The king divides a disputed estate between two claimants", cluster: law}
  aged-benefactor-declines-court-life: {label: "An aged benefactor declines life at court, saying he can no longer taste food or hear singers", cluster: wisdom}
  son-sent-to-court-in-fathers-place: {label: "An old man sends his son to court in his place", cluster: kingship}
  tribal-rivalry-over-king: {label: "Tribes quarrel over their share in the king", cluster: kingship}
  secession-cry-to-your-tents: {label: "Secession cry: 'We have no portion in David; to your tents, O Israel'", cluster: kingship}
  violated-concubines-kept-in-living-widowhood: {label: "Concubines violated by the usurper are kept shut up in 'living widowhood' until death", cluster: kingship}
  treacherous-kiss-and-stab: {label: "A man grasps his victim's beard to kiss him and stabs him", cluster: violence}
  corpse-covered-to-stop-gawkers: {label: "A corpse wallowing in blood on the road halts the army until it is covered with a garment", cluster: warfare}
  siege-ramp-against-city: {label: "Besiegers pile up a siege ramp against a city's wall", cluster: warfare}
  city-famed-for-oracular-wisdom: {label: "A city proverbially famed as the place to ask counsel, 'a mother in Israel'", cluster: wisdom}
  rebels-head-thrown-over-wall: {label: "Townspeople throw the rebel's head over the wall to end a siege", cluster: warfare}
  forced-labor-officer: {label: "An official is placed over the forced labor (mas)", cluster: kingship}
  kings-private-priest: {label: "A man serves as the king's personal priest", cluster: cult}
  famine-for-bloodguilt: {label: "A famine is caused by unexpiated bloodguilt of a former king", cluster: retribution}
  blood-not-ransomable-by-silver: {label: "The wronged party refuses silver or gold as compensation for blood", cluster: law}
  oath-protects-friends-son: {label: "The king spares his friend's son because of their sworn covenant", cluster: friendship}
  seven-descendants-handed-over: {label: "Seven descendants of the guilty king are handed over for execution", cluster: retribution}
  mother-guards-exposed-bodies: {label: "A mother guards her sons' exposed bodies from birds and beasts for months", cluster: burial}
  bones-of-king-reburied: {label: "The bones of the dead king are recovered and reburied in his father's tomb", cluster: burial}
  god-entreated-for-land: {label: "After the expiation 'God was entreated for the land'", cluster: theology}
  lamp-of-israel-king: {label: "The king called 'the lamp of Israel' that must not be quenched", cluster: kingship}
  elhanan-kills-goliath: {label: "A variant tradition attributes the killing of Goliath to another hero", cluster: heroes}
  giant-with-six-fingers-and-toes: {label: "A giant with six fingers on each hand and six toes on each foot", cluster: heroes}
  breakers-of-death-cords-of-sheol: {label: "The psalmist is engulfed by breakers of death and cords of Sheol", cluster: afterlife}
  god-hears-from-his-temple: {label: "God hears the cry from his (heavenly) temple", cluster: prayer}
  smoke-from-gods-nostrils-fire-from-mouth: {label: "Smoke rises from God's nostrils and devouring fire from his mouth", cluster: theophany}
  god-rides-cherub-on-wings-of-wind: {label: "God rides on a cherub and flies on the wings of the wind", cluster: theophany}
  drawn-out-of-many-waters: {label: "God reaches from on high and draws the sufferer out of many waters", cluster: cosmology}
  rewarded-according-to-righteousness: {label: "God rewards the speaker according to his righteousness and clean hands", cluster: theology}
  god-mirrors-human-conduct: {label: "God shows himself loyal to the loyal and crooked to the crooked", cluster: theology}
  god-is-my-lamp: {label: "God is called the speaker's lamp who lights his darkness", cluster: theology}
  leap-over-a-wall-with-god: {label: "'By my God I leap over a wall'", cluster: poetry}
  feet-like-hinds-on-heights: {label: "God makes the speaker's feet like hinds' feet and sets him on the heights", cluster: poetry}
  god-trains-hands-for-war-bow-of-bronze: {label: "God trains the king's hands for war so his arms bend a bow of bronze", cluster: warfare}
  enemies-crushed-like-dust-and-mire: {label: "Enemies beaten fine as dust and trampled like mire of the streets", cluster: warfare}
  foreigners-come-cringing: {label: "Foreigners come cringing and trembling to submit to the king", cluster: kingship}
  hesed-to-anointed-and-seed-forever: {label: "God shows steadfast love to his anointed and his seed forever", cluster: kingship}
  oracle-of-the-man-raised-high: {label: "Poem opening with 'Oracle (ne'um) of the man...' formula", cluster: prophecy}
  spirit-speaks-through-king: {label: "The spirit of God speaks through the king's tongue", cluster: prophecy}
  just-ruler-like-morning-sun: {label: "A just ruler is like the morning sun on a cloudless day", cluster: kingship}
  eternal-covenant-with-dynasty: {label: "God has made an everlasting covenant with the king's house", cluster: covenant}
  wicked-as-thorns-burned: {label: "The wicked are thorns that cannot be handled and are burned", cluster: poetry}
  hero-list-with-exploits: {label: "A list of the king's mighty warriors with their exploits", cluster: heroes}
  hero-kills-hundreds-at-once: {label: "A hero kills hundreds of enemies at one time", cluster: heroes}
  hand-cleaves-to-sword: {label: "A hero fights until his weary hand sticks to his sword", cluster: heroes}
  lone-hero-holds-field: {label: "A lone hero stands his ground in a field after the army flees", cluster: heroes}
  water-from-bethlehem-well-poured-out: {label: "Water fetched at mortal risk is poured out as a libation instead of drunk", cluster: cult}
  hero-kills-lion-in-pit-on-snowy-day: {label: "A hero goes down into a pit and kills a lion on a snowy day", cluster: heroes}
  hero-wrests-spear-from-giant-egyptian: {label: "A hero with a staff wrests a spear from a huge foe and kills him with it", cluster: heroes}
  foreigners-among-elite-warriors: {label: "Foreigners are listed among the king's elite warriors", cluster: kingship}
  general-objects-to-census: {label: "The commander objects to the king's census", cluster: kingship}
  census-route-itinerary: {label: "Itinerary of census-takers around the land's borders", cluster: geography}
  conscience-smites-king: {label: "The king's heart strikes him after a sin", cluster: repentance}
  choice-of-three-punishments: {label: "A prophet offers the king a choice among three punishments", cluster: prophecy}
  destroying-angel-stayed: {label: "God halts the destroying angel at a specific spot: 'Enough, stay your hand'", cluster: angels}
  king-offers-himself-for-people: {label: "The king asks that punishment fall on himself and his house instead of the people", cluster: kingship}
  threshing-floor-becomes-altar-site: {label: "A threshing floor where the plague stopped becomes the site of an altar", cluster: cult}
  king-insists-on-paying-full-price: {label: "The king refuses a free gift of land for an altar and pays its price", cluster: cult}
units:
  - id: hb-1sam-25-death-of-samuel
    tradition: judaism
    title: Death and burial of Samuel at Ramah
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["1Sam 25:1"]
    tags:
      - {motif: prophet-buried-in-his-house, refs: ["1Sam 25:1"], note: "'They buried him in his house at Ramah'; all Israel mourns"}
      - {motif: national-mourning-for-leader, refs: ["1Sam 25:1"]}
    hints:
      - "Burial within the house recurs for Joab (1Kgs 2:34). Compare the Islamic practice of burying the Prophet in Aisha's chamber where he died."
  - id: hb-1sam-25-nabal-abigail
    tradition: judaism
    title: Nabal the fool, Abigail the wise and David's averted vengeance
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["1Sam 25:2-44"]
    tags:
      - {motif: sheep-shearing-festival, refs: ["1Sam 25:2", "1Sam 25:4", "1Sam 25:7", "1Sam 25:11"], note: "3,000 sheep and 1,000 goats; shearing as a 'good day' (yom tov) for gifts"}
      - {motif: name-is-destiny, refs: ["1Sam 25:3", "1Sam 25:25"], note: "'As his name is, so is he: Nabal (fool) is his name and folly (nevalah) is with him'"}
      - {motif: protection-money-for-flocks, refs: ["1Sam 25:7", "1Sam 25:8", "1Sam 25:15", "1Sam 25:16", "1Sam 25:21"], note: "'They were a wall to us night and day'"}
      - {motif: churlish-host-refuses-provisions, refs: ["1Sam 25:10", "1Sam 25:11"], note: "'Who is David? Many slaves nowadays break away from their masters'"}
      - {motif: one-who-pisses-against-the-wall, refs: ["1Sam 25:22", "1Sam 25:34"], note: "mashtin be-qir, idiom for every male"}
      - {motif: wise-woman-averts-bloodshed, refs: ["1Sam 25:18", "1Sam 25:23", "1Sam 25:24", "1Sam 25:26", "1Sam 25:31", "1Sam 25:33"], note: "Gifts of bread, wine, five dressed sheep, parched grain, raisin and fig cakes"}
      - {motif: bundle-of-the-living, refs: ["1Sam 25:29"], note: "tserurah bi-tsror ha-hayyim with YHWH; enemies' souls slung from the hollow of a sling"}
      - {motif: sure-house-promised, refs: ["1Sam 25:28"], note: "Abigail anticipates the dynastic promise: bayit ne'eman"}
      - {motif: fool-dies-heart-turned-to-stone, refs: ["1Sam 25:36", "1Sam 25:37", "1Sam 25:38"], note: "Drunk at a feast 'like a king's feast'; his heart died within him and he became stone; YHWH struck him after ten days"}
      - {motif: hero-marries-widow-of-enemy, refs: ["1Sam 25:39", "1Sam 25:40", "1Sam 25:41", "1Sam 25:42"]}
      - {motif: hospitality-to-strangers, refs: ["1Sam 25:41"], note: "Abigail offers to wash the feet of David's servants"}
      - {motif: royal-wife-given-to-another, refs: ["1Sam 25:44"], note: "Saul gives Michal to Palti son of Laish"}
      - {motif: hero-takes-multiple-wives, refs: ["1Sam 25:43"], note: "Ahinoam of Jezreel"}
    hints:
      - "'Bundle of the living' (25:29) became the Jewish epitaph formula ת.נ.צ.ב.ה on tombstones. Nabal's petrified heart compares with hardening and stone-death motifs (Niobe). Rabbinic tradition counts Abigail among seven prophetesses (b. Megillah 14a)."
  - id: hb-1sam-26-spear-and-jug
    tradition: judaism
    title: David takes Saul's spear and water jug in the camp at Hachilah
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["1Sam 26:1-25"]
    tags:
      - {motif: ungrateful-townsfolk-would-betray, refs: ["1Sam 26:1"], note: "Ziphites again"}
      - {motif: spares-sleeping-or-vulnerable-enemy-king, refs: ["1Sam 26:7", "1Sam 26:8", "1Sam 26:9", "1Sam 26:11", "1Sam 26:23"], note: "'Who can put forth his hand against the LORD's anointed and be guiltless?'"}
      - {motif: deep-sleep-sent-by-god, refs: ["1Sam 26:12"], note: "tardemat YHWH fell on the whole camp"}
      - {motif: token-taken-from-sleeping-enemy, refs: ["1Sam 26:11", "1Sam 26:12", "1Sam 26:16", "1Sam 26:22"], note: "Spear stuck in the ground at his head and the water jug"}
      - {motif: guard-rebuked-for-failing-king, refs: ["1Sam 26:14", "1Sam 26:15", "1Sam 26:16"], note: "David taunts Abner across the valley: 'you deserve death'"}
      - {motif: persecutor-admits-hero-more-righteous, refs: ["1Sam 26:17", "1Sam 26:21", "1Sam 26:25"], note: "'I have played the fool'"}
      - {motif: exile-means-serving-other-gods, refs: ["1Sam 26:19"], note: "Driven from YHWH's inheritance: 'Go serve other gods'"}
      - {motif: god-incites-to-evil, refs: ["1Sam 26:19"], note: "'If YHWH has incited you against me, let him smell an offering'"}
      - {motif: dead-dog-single-flea, refs: ["1Sam 26:20"]}
      - {motif: hunted-like-partridge-or-flea, refs: ["1Sam 26:20"], note: "'a single flea... as one hunts the partridge (qore) on the mountains'"}
      - {motif: leader-death-three-ways, refs: ["1Sam 26:10"], note: "YHWH will strike him, his day will come, or he will perish in battle"}
    hints:
      - "Doublet of ch. 24. The stolen spear and cup recall Odysseus and Diomedes' night raid (Iliad 10) and the folk motif of the token taken from a sleeper to prove one could have killed him. 26:19 links land and deity, cf. Naaman's earth (2Kgs 5:17)."
  - id: hb-1sam-27-david-at-ziklag
    tradition: judaism
    title: David becomes a vassal of Achish and raids from Ziklag
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["1Sam 27:1-12"]
    tags:
      - {motif: hero-serves-enemy-king, refs: ["1Sam 27:2", "1Sam 27:3", "1Sam 27:5", "1Sam 27:12"], note: "600 men with households"}
      - {motif: town-granted-to-vassal, refs: ["1Sam 27:5", "1Sam 27:6"], note: "Ziklag 'belongs to the kings of Judah to this day'"}
      - {motif: place-name-etiology, refs: ["1Sam 27:6"]}
      - {motif: no-survivors-to-tell, refs: ["1Sam 27:9", "1Sam 27:11"], note: "He left no man or woman alive lest they report him"}
      - {motif: double-agent-deceives-overlord, refs: ["1Sam 27:10", "1Sam 27:11", "1Sam 27:12"], note: "Claims raids against Judah while raiding Geshurites, Girzites, Amalekites"}
      - {motif: odd-period-count, refs: ["1Sam 27:7"], note: "'days and four months' (a year and four months)"}
    hints:
      - "The exiled hero who serves a foreign king and deceives him: Themistocles at the Persian court, Alcibiades in Sparta, Coriolanus with the Volsci."
  - id: hb-1sam-28-medium-of-endor
    tradition: judaism
    title: Saul and the necromancer of En-dor raise Samuel
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["1Sam 28:1-25"]
    tags:
      - {motif: hero-serves-enemy-king, refs: ["1Sam 28:1", "1Sam 28:2"], note: "Achish makes David 'keeper of my head' for life"}
      - {motif: necromancy-forbidden, refs: ["1Sam 28:3", "1Sam 28:9"], note: "Saul had removed the ovot and yidde'onim"}
      - {motif: god-silent-no-dreams-urim-prophets, refs: ["1Sam 28:6", "1Sam 28:15"], note: "Neither by dreams, nor by Urim, nor by prophets"}
      - {motif: necromancer-raises-dead-prophet, refs: ["1Sam 28:7", "1Sam 28:8", "1Sam 28:11", "1Sam 28:12", "1Sam 28:13", "1Sam 28:14"], note: "ba'alat ov; 'I see elohim coming up out of the earth'; an old man wrapped in a robe (me'il)"}
      - {motif: king-disguises-himself, refs: ["1Sam 28:8"], note: "Goes by night with two men"}
      - {motif: medium-recognizes-disguised-king, refs: ["1Sam 28:12"]}
      - {motif: dead-called-elohim, refs: ["1Sam 28:13"]}
      - {motif: ghost-disturbed-from-rest, refs: ["1Sam 28:15"], note: "'Why have you disturbed me by bringing me up?'"}
      - {motif: torn-robe-sign-of-torn-kingdom, refs: ["1Sam 28:17"], note: "'YHWH has torn the kingdom from your hand' recalling 15:27-28"}
      - {motif: ghost-foretells-death-tomorrow, refs: ["1Sam 28:19"], note: "'Tomorrow you and your sons will be with me'"}
      - {motif: took-life-in-hand, refs: ["1Sam 28:21"]}
      - {motif: last-meal-before-death, refs: ["1Sam 28:20", "1Sam 28:22", "1Sam 28:23", "1Sam 28:24", "1Sam 28:25"], note: "Fatted calf and unleavened bread baked in haste; they leave that night"}
    hints:
      - "Odysseus' nekyia (Odyssey 11) and Teiresias' prophecy; the Gilgamesh XII raising of Enkidu's spirit. Sir 46:20 and 1Chr 10:13 judge the episode; church fathers debated whether Samuel really appeared (Origen vs. Eustathius). Quranic jinn/sorcery debates also cite it."
  - id: hb-1sam-29-david-dismissed-by-philistines
    tradition: judaism
    title: The Philistine lords refuse David in their ranks
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["1Sam 29:1-11"]
    tags:
      - {motif: allies-distrust-defector, refs: ["1Sam 29:3", "1Sam 29:4", "1Sam 29:5"], note: "'Lest he become a satan to us in battle' (le-satan)"}
      - {motif: satan-as-adversary-common-noun, refs: ["1Sam 29:4"]}
      - {motif: women-sing-thousands-ten-thousands, refs: ["1Sam 29:5"]}
      - {motif: good-as-angel-of-god, refs: ["1Sam 29:9"], note: "Achish: 'you are good in my eyes as an angel of God'"}
      - {motif: foreign-king-swears-by-yhwh, refs: ["1Sam 29:6"]}
    hints:
      - "The comparison of a person to an angel of God recurs in 2Sam 14:17, 20 and 19:28. Achish swearing by YHWH parallels pagan characters invoking the God of Israel (Balaam, Hiram)."
  - id: hb-1sam-30-ziklag-amalekites
    tradition: judaism
    title: Amalekites burn Ziklag; David recovers all and makes the spoil law
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["1Sam 30:1-31"]
    tags:
      - {motif: amalek-attacks-israel, refs: ["1Sam 30:1", "1Sam 30:2"], note: "Women and children carried off alive"}
      - {motif: weeping-until-no-strength, refs: ["1Sam 30:4"]}
      - {motif: people-threaten-to-stone-leader, refs: ["1Sam 30:6"]}
      - {motif: ephod-oracle-yes-no, refs: ["1Sam 30:7", "1Sam 30:8"]}
      - {motif: exhausted-left-at-brook, refs: ["1Sam 30:9", "1Sam 30:10", "1Sam 30:21"], note: "200 too exhausted to cross Wadi Besor"}
      - {motif: abandoned-sick-slave-guides-hero, refs: ["1Sam 30:11", "1Sam 30:12", "1Sam 30:13", "1Sam 30:15", "1Sam 30:16"], note: "Egyptian slave left for dead three days; revived with fig-cake and raisins; asks an oath"}
      - {motif: enemy-surprised-feasting, refs: ["1Sam 30:16", "1Sam 30:17"]}
      - {motif: four-hundred-escape-on-camels, refs: ["1Sam 30:17"]}
      - {motif: all-captives-recovered, refs: ["1Sam 30:18", "1Sam 30:19"]}
      - {motif: share-spoil-with-those-at-home, refs: ["1Sam 30:22", "1Sam 30:23", "1Sam 30:24", "1Sam 30:25"], note: "Equal share for those who stay with the baggage, made 'a statute and ordinance for Israel to this day'"}
      - {motif: spoil-sent-as-gifts-to-elders, refs: ["1Sam 30:26", "1Sam 30:27", "1Sam 30:28", "1Sam 30:29", "1Sam 30:30", "1Sam 30:31"], note: "'A blessing from the spoil of YHWH's enemies' to Bethel, Ramoth-negeb, Jattir, Aroer, Siphmoth, Eshtemoa, Racal, Hormah, Bor-ashan, Athach, Hebron"}
    hints:
      - "Num 31:27 and Josh 22:8 on dividing spoil; Islamic law of ghanima (Quran 8:41; hadith on those who stayed behind, e.g. Uthman at Badr receiving a share). The Egyptian slave guide recalls guides in Arabic maghazi literature."
  - id: hb-1sam-31-death-of-saul
    tradition: judaism
    title: Saul and his sons fall on Mount Gilboa
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["1Sam 31:1-13"]
    tags:
      - {motif: king-and-sons-die-same-day, refs: ["1Sam 31:2", "1Sam 31:6"], note: "Jonathan, Abinadab, Malchishua"}
      - {motif: king-falls-on-own-sword, refs: ["1Sam 31:3", "1Sam 31:4"], note: "Lest the uncircumcised 'make sport' (hit'allelu) of him; the armor-bearer refuses out of fear"}
      - {motif: asks-armor-bearer-to-kill-him, refs: ["1Sam 31:4"]}
      - {motif: armor-bearer-dies-with-master, refs: ["1Sam 31:5"]}
      - {motif: enemy-head-and-armor-displayed, refs: ["1Sam 31:9", "1Sam 31:10"], note: "Head cut off; armor placed in the temple of Ashtaroth; news sent to the house of their idols"}
