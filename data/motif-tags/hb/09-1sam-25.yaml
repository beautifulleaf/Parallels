  maidservant-carries-messages: {label: "A slave-girl relays secret messages to couriers outside the city", cluster: espionage}
  spies-hidden-in-well-by-woman: {label: "A woman hides fugitive messengers in a well, covers it and misdirects pursuers", cluster: espionage}
