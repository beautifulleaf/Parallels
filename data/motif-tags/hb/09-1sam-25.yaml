  king-waits-between-the-gates: {label: "The king sits between the two gates awaiting news", cluster: kingship}
  messenger-evades-bad-news: {label: "Messenger evades telling the king of his son's death", cluster: kingship}
  may-enemies-be-as-that-young-man: {label: "Messenger reports a death obliquely: 'May all your enemies be as that young man'", cluster: idiom}
  father-laments-would-i-had-died-for-you: {label: "A father mourns his dead son: 'Would that I had died instead of you'", cluster: mourning}
