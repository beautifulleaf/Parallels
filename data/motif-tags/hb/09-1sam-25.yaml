  heart-of-a-lion-melts: {label: "Even the lion-hearted will melt with fear", cluster: poetry}
  army-falls-like-dew: {label: "An army descends on the enemy as dew falls on the ground", cluster: poetry}
  city-dragged-into-valley-with-ropes: {label: "Boast that all Israel would drag a city into the valley with ropes", cluster: warfare}
