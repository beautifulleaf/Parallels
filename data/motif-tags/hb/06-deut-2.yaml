units:
- id: hb-deut-2-edom-moab-ammon
  tradition: judaism
  title: Passing Edom, Moab and Ammon; the giant aboriginal peoples
  corpus: hebrew-bible
  original: true
  tagger: Claude (model), reading the Hebrew
  read:
  - Deut 2:1-23
  tags:
  - motif: kin-nations-land-not-to-be-taken
    refs:
    - Deut 2:5
    - Deut 2:9
    - Deut 2:19
    note: not even a foot's tread (מדרך כף רגל) of Seir; Ar given to the sons of Lot
  - motif: purchase-food-water-in-transit
    refs:
    - Deut 2:6
  - motif: wilderness-provision-lacked-nothing
    refs:
    - Deut 2:7
  - motif: forty-years-wandering
    refs:
    - Deut 2:7
  - motif: primeval-giant-peoples
    refs:
    - Deut 2:10
    - Deut 2:11
    - Deut 2:20
    - Deut 2:21
    note: Emim and Zamzummim counted as Rephaim, tall as the Anakim
  - motif: ethnographic-name-gloss
    refs:
    - Deut 2:11
    - Deut 2:20
    note: Moabites call them Emim, Ammonites call them Zamzummim
  - motif: displacement-of-earlier-peoples
    refs:
    - Deut 2:12
    - Deut 2:21
    - Deut 2:22
    - Deut 2:23
    note: Caphtorim from Caphtor destroy the Avvim up to Gaza
  - motif: wilderness-generation-dies-out
    refs:
    - Deut 2:14
    - Deut 2:15
    - Deut 2:16
    note: 38 years from Kadesh-barnea to the Zered; hand of YHWH against them
  hints:
  - Caphtor is usually identified with Crete (cf. Amos 9:7); Rephaim also appear as shades of the dead in Ugaritic texts (rpum).
  - 'Giant pre-inhabitants: compare Quranic ''Ad (tall people, Q 7:69, 89:6-8) and Greek Titans/Gigantes.'
