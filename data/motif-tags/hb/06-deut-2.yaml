- id: hb-deut-3-og
  tradition: judaism
  title: Defeat of Og of Bashan and allotment of Transjordan
  corpus: hebrew-bible
  original: true
  tagger: Claude (model), reading the Hebrew
  read:
  - Deut 3:1-22
  tags:
  - motif: herem-total-destruction
    refs:
    - Deut 3:3
    - Deut 3:6
  - motif: sixty-fortified-cities
    refs:
    - Deut 3:4
    - Deut 3:5
  - motif: livestock-and-spoil-kept
    refs:
    - Deut 3:7
  - motif: mountain-two-names
    refs:
    - Deut 3:9
    note: Sidonians call Hermon Sirion, Amorites Senir
  - motif: ethnographic-name-gloss
    refs:
    - Deut 3:9
    - Deut 3:13
  - motif: last-of-the-giants
    refs:
    - Deut 3:11
    note: only Og remained of the remnant of the Rephaim
  - motif: giant-king-iron-bed
    refs:
    - Deut 3:11
    note: ערש ברזל, 9 x 4 cubits by a man's cubit, still in Rabbah of Ammon
  - motif: primeval-giant-peoples
    refs:
    - Deut 3:13
    note: Bashan called land of Rephaim
  - motif: towns-named-after-conqueror
    refs:
    - Deut 3:14
  - motif: transjordan-tribes-fight-first
    refs:
    - Deut 3:18
    - Deut 3:19
    - Deut 3:20
  - motif: commissioning-successor
    refs:
    - Deut 3:21
    - Deut 3:22
  - motif: divine-warrior
    refs:
    - Deut 3:22
    note: YHWH is the one who fights for you
  hints:
  - 'Og legends: rabbinic Og survived the Flood (b. Niddah 61a), was killed by Moses leaping ten cubits (b. Berakhot 54b); Islamic ''Uj ibn ''Anaq is a giant of immense height.'
  - The 'bed' (eres) may be a basalt dolmen/sarcophagus; compare relics of heroes' oversized bones in Greek tradition (Orestes' bones, Herodotus 1.68).
