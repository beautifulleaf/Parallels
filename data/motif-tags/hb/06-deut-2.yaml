    label: Travellers offer to pay for food and water while passing through a foreign land
    cluster: conquest
  wilderness-provision-lacked-nothing:
    label: In forty years of wandering the people lacked nothing (clothes did not wear out, feet did not swell)
    cluster: exodus
  ethnographic-name-gloss:
    label: Narrator notes what another people calls a place or people
    cluster: ethnography
  displacement-of-earlier-peoples:
    label: Other nations displaced earlier peoples just as Israel will (Horites, Avvim by Caphtorim)
    cluster: conquest
  wilderness-generation-dies-out:
    label: The rebellious generation dies out before entering the land
    cluster: exodus
  dread-of-israel-on-nations:
