  ephod-oracle-yes-no: {label: "Hero consults God through the ephod with yes/no questions about future events", cluster: divination}
  ungrateful-townsfolk-would-betray: {label: "Townspeople the hero rescued would hand him over to his pursuer", cluster: kingship}
  pursuit-broken-off-by-invasion: {label: "Pursuer forced to break off the chase at the last moment by news of an invasion", cluster: escape}
  heir-cedes-throne-to-friend: {label: "The king's heir tells his friend 'you shall be king and I shall be second to you'", cluster: friendship}
  spares-sleeping-or-vulnerable-enemy-king: {label: "Hero finds the hostile king defenseless and spares him as the LORD's anointed", cluster: kingship}
  cuts-hem-of-robe: {label: "Hero secretly cuts the corner of the king's robe as proof he could have killed him", cluster: kingship}
  king-relieves-himself-in-cave: {label: "King enters a cave 'to cover his feet' where the hero is hiding", cluster: kingship}
  dead-dog-single-flea: {label: "Self-abasement: 'after a dead dog, after a single flea'", cluster: wisdom}
  ancient-proverb-quoted: {label: "A proverb of the ancients is quoted", cluster: wisdom}
  persecutor-admits-hero-more-righteous: {label: "Persecuting king weeps and admits 'You are more righteous than I'", cluster: kingship}
  oath-not-to-cut-off-descendants: {label: "Hero swears not to cut off the king's descendants or name", cluster: kingship}
  heaven-and-earth-summoned-to-listen: {label: "Poet summons heaven and earth to listen", cluster: poetry}
  teaching-as-rain-and-dew: {label: "Teaching falls like rain and distils like dew", cluster: poetry}
  god-the-rock: {label: "God called the Rock (tsur)", cluster: theology}
  god-as-father-creator-of-people: {label: "God is the father who acquired, made and established his people", cluster: theology}
  nations-divided-by-number-of-sons-of-god: {label: "Elyon divided the nations by the number of the sons of Israel/God; Jacob is YHWH's portion", cluster: cosmology}
  apple-of-the-eye: {label: "God guards his people as the pupil (apple) of his eye", cluster: poetry}
  eagle-bearing-young-on-wings: {label: "God like an eagle stirring its nest and bearing its young on its pinions", cluster: poetry}
  honey-from-rock-oil-from-flint: {label: "God nursed Israel with honey from the rock and oil from flint", cluster: poetry}
  jeshurun-grew-fat-and-kicked: {label: "Jeshurun grew fat and kicked, forsaking the God who made him", cluster: covenant}
  sacrifice-to-shedim-demons: {label: "They sacrificed to shedim (demons), no-gods, new gods their fathers did not know", cluster: cult}
  rock-that-gave-birth: {label: "God as the Rock that bore you and the God who writhed in labor with you", cluster: theology}
  jealousy-by-a-no-people: {label: "God will provoke Israel to jealousy with a no-people, a foolish nation", cluster: prophecy}
  divine-fire-burns-to-sheol: {label: "Fire kindled in God's anger burns to the depths of Sheol and the foundations of the mountains", cluster: cosmology}
  resheph-qeteb-plague-demons: {label: "Resheph and Qeteb (plague deities/demons) sent as God's arrows", cluster: cosmology}
  divine-arrows: {label: "God shoots his arrows at the people or enemies", cluster: theophany}
  god-refrains-for-fear-of-enemy-boast: {label: "God refrains from annihilating Israel lest the enemy boast it was their own hand", cluster: theology}
  one-chases-a-thousand: {label: "One chases a thousand and two put ten thousand to flight", cluster: war}
  vine-of-sodom-poison-grapes: {label: "Their vine is from the vine of Sodom; grapes of poison, wine of serpents' venom", cluster: poetry}
  vengeance-is-mine: {label: "Vengeance and recompense are mine", cluster: theology}
  mocking-where-are-their-gods: {label: "God mocks: where are their gods who ate the fat of their sacrifices? let them rise and help", cluster: polemic}
  i-kill-and-make-alive: {label: "I kill and I make alive, I wound and I heal; there is no god beside me", cluster: theology}
  god-swears-raising-hand-i-live-forever: {label: "God raises his hand to heaven and swears: as I live forever", cluster: theology}
  god-sword-devours-flesh-drunk-arrows: {label: "God's flashing sword devours flesh and his arrows are drunk with blood", cluster: theophany}
  nations-rejoice-avenges-servants-blood: {label: "Nations called to rejoice as God avenges his servants' blood and atones for his land", cluster: eschatology}
  prophet-dies-on-mountain-gathered-to-people: {label: "Prophet told to ascend a mountain, see the land, and die there, gathered to his people", cluster: moses}
  sin-at-meribah-kadesh: {label: "Moses and Aaron's breach of faith at the waters of Meribah", cluster: moses}
  dying-leader-blesses-tribes: {label: "Dying patriarch or leader blesses each tribe in turn", cluster: patriarchs}
  god-comes-from-sinai-seir-paran: {label: "God shines forth from Sinai, Seir and Mount Paran with holy myriads", cluster: theophany}
  fiery-law-from-right-hand: {label: "A fiery law (esh dat) from God's right hand", cluster: theophany}
  urim-and-thummim: {label: "Urim and Thummim given to Levi", cluster: priesthood}
  levi-disowns-kin-for-god: {label: "Levi says to father and mother 'I do not see you' and disregards his brothers and children for God's covenant", cluster: priesthood}
  god-dwells-between-shoulders: {label: "God dwells between Benjamin's shoulders", cluster: sacred-geography}
  dweller-in-the-bush: {label: "God described as the one who dwells in the bush (seneh)", cluster: theophany}
  wild-ox-horns: {label: "Horns of a wild ox (re'em) goring the peoples", cluster: poetry}
  hidden-treasures-of-sand: {label: "Zebulun and Issachar suck the abundance of the seas and treasures hidden in the sand", cluster: blessing}
  tribe-as-lion: {label: "A tribe likened to a lion or lion's whelp", cluster: blessing}
  foot-dipped-in-oil: {label: "Asher dips his foot in oil; sandals of iron and bronze", cluster: blessing}
  rider-of-the-heavens: {label: "God rides through the heavens (rokhev shamayim) to help", cluster: theophany}
  everlasting-arms: {label: "Underneath are the everlasting arms", cluster: theology}
  happy-are-you-israel-saved-by-god: {label: "Happy are you, Israel, who is like you, a people saved by YHWH", cluster: election}
  pisgah-view-of-whole-land: {label: "From Nebo/Pisgah God shows Moses the whole land from Gilead to Dan to the western sea", cluster: moses}
  death-at-gods-mouth: {label: "Moses dies 'by the mouth of YHWH' (al pi YHWH)", cluster: moses}
  god-buries-prophet-unknown-grave: {label: "God (he) buries the prophet; no one knows his grave to this day", cluster: moses}
  eye-undimmed-vigor-unabated: {label: "At death his eye was not dim nor his vigor abated", cluster: moses}
  thirty-days-mourning: {label: "People mourn the leader thirty days", cluster: mourning}
  laying-on-of-hands-spirit-of-wisdom: {label: "Successor filled with spirit of wisdom through laying on of hands", cluster: succession}
  no-prophet-like-moses-face-to-face: {label: "No prophet arose again like Moses whom God knew face to face", cluster: moses}
  meditate-on-torah-day-and-night: {label: "Meditate on the book of the Torah day and night; it shall not depart from your mouth", cluster: scripture}
  three-days-preparation: {label: "Three days of preparation before a decisive crossing or event", cluster: ritual}
  people-pledge-obedience-to-successor: {label: "People pledge to obey the successor as they obeyed his predecessor; rebels to die", cluster: succession}
  spies-sent-to-city: {label: "Spies sent secretly to reconnoitre a city", cluster: conquest}
  harlot-shelters-spies: {label: "A prostitute (Rahab) shelters the spies in her house", cluster: conquest}
  hidden-under-flax-on-roof: {label: "Spies hidden under stalks of flax on the roof", cluster: conquest}
  lie-to-protect-guests: {label: "Host deceives pursuers to protect the hidden guests", cluster: hospitality}
  foreigner-confesses-israels-god: {label: "A foreigner confesses that Israel's God is God in heaven above and earth below", cluster: conversion}
  melting-hearts-of-canaanites: {label: "Inhabitants' hearts melt on hearing of the Red Sea and Sihon and Og", cluster: war}
  oath-to-spare-household: {label: "Spies swear to spare the helper's whole family in return for her kindness", cluster: conquest}
  let-down-by-rope-through-window: {label: "Spies let down by a rope through a window in the city wall", cluster: conquest}
  scarlet-cord-sign: {label: "Scarlet cord tied in the window as the sign of protection", cluster: conquest}
  blood-on-own-head-outside-door: {label: "Whoever goes out of the door, his blood is on his own head", cluster: conquest}
  hide-three-days-in-hills: {label: "Fugitives hide three days in the hills until pursuers give up", cluster: conquest}
  ark-leads-at-2000-cubits: {label: "People follow the ark at a distance of 2000 cubits", cluster: cult}
  sanctify-before-wonders: {label: "Sanctify yourselves, for tomorrow God will do wonders", cluster: ritual}
  successor-exalted-like-predecessor: {label: "God will magnify the successor so the people know he is with him as with Moses", cluster: succession}
  ark-lord-of-all-earth: {label: "The ark of the covenant of the Lord of all the earth", cluster: cult}
  twelve-men-one-per-tribe: {label: "Twelve men chosen, one from each tribe", cluster: tribes}
  river-waters-stand-in-heap: {label: "River waters cut off and stand in a single heap so the people cross on dry ground", cluster: miracle}
  jordan-in-flood-at-harvest: {label: "The Jordan overflows its banks all the days of harvest", cluster: land}
  priests-stand-in-midst-of-river: {label: "Priests bearing the ark stand on dry ground in the middle of the river until all have crossed", cluster: miracle}
units:
  - id: hb-deut-2-edom-moab-ammon
    tradition: judaism
    title: Passing Edom, Moab and Ammon; the giant aboriginal peoples
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Deut 2:1-23"]
    tags:
      - {motif: kin-nations-land-not-to-be-taken, refs: ["Deut 2:5", "Deut 2:9", "Deut 2:19"], note: "not even a foot's tread (מדרך כף רגל) of Seir; Ar given to the sons of Lot"}
      - {motif: purchase-food-water-in-transit, refs: ["Deut 2:6"]}
      - {motif: wilderness-provision-lacked-nothing, refs: ["Deut 2:7"]}
      - {motif: forty-years-wandering, refs: ["Deut 2:7"]}
      - {motif: giant-aboriginal-peoples, refs: ["Deut 2:10", "Deut 2:11", "Deut 2:20", "Deut 2:21"], note: "Emim and Zamzummim counted as Rephaim, tall as the Anakim"}
      - {motif: ethnographic-name-gloss, refs: ["Deut 2:11", "Deut 2:20"], note: "Moabites call them Emim, Ammonites call them Zamzummim"}
      - {motif: displacement-of-earlier-peoples, refs: ["Deut 2:12", "Deut 2:21", "Deut 2:22", "Deut 2:23"], note: "Caphtorim from Caphtor destroy the Avvim up to Gaza"}
      - {motif: wilderness-generation-dies-out, refs: ["Deut 2:14", "Deut 2:15", "Deut 2:16"], note: "38 years from Kadesh-barnea to the Zered; hand of YHWH against them"}
    hints:
      - "Caphtor is usually identified with Crete (cf. Amos 9:7); Rephaim also appear as shades of the dead in Ugaritic texts (rpum)."
      - "Giant pre-inhabitants: compare Quranic 'Ad (tall people, Q 7:69, 89:6-8) and Greek Titans/Gigantes."
  - id: hb-deut-2-sihon
    tradition: judaism
    title: Defeat of Sihon king of Heshbon
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Deut 2:24-37"]
    tags:
      - {motif: dread-of-israel-on-nations, refs: ["Deut 2:25"]}
      - {motif: peace-offer-before-war, refs: ["Deut 2:26"], note: "messengers from the wilderness of Kedemoth with words of peace"}
      - {motif: purchase-food-water-in-transit, refs: ["Deut 2:28", "Deut 2:29"]}
      - {motif: god-hardens-enemy-heart, refs: ["Deut 2:30"], note: "YHWH hardened his spirit and made his heart obstinate"}
      - {motif: herem-total-destruction, refs: ["Deut 2:34"], note: "men, women and little ones"}
      - {motif: livestock-and-spoil-kept, refs: ["Deut 2:35"]}
      - {motif: kin-nations-land-not-to-be-taken, refs: ["Deut 2:37"]}
  - id: hb-deut-3-og
    tradition: judaism
    title: Defeat of Og of Bashan and allotment of Transjordan
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Deut 3:1-22"]
    tags:
      - {motif: herem-total-destruction, refs: ["Deut 3:3", "Deut 3:6"]}
      - {motif: sixty-fortified-cities, refs: ["Deut 3:4", "Deut 3:5"]}
      - {motif: livestock-and-spoil-kept, refs: ["Deut 3:7"]}
      - {motif: mountain-two-names, refs: ["Deut 3:9"], note: "Sidonians call Hermon Sirion, Amorites Senir"}
      - {motif: ethnographic-name-gloss, refs: ["Deut 3:9", "Deut 3:13"]}
      - {motif: last-of-the-giants, refs: ["Deut 3:11"], note: "only Og remained of the remnant of the Rephaim"}
      - {motif: giant-king-iron-bed, refs: ["Deut 3:11"], note: "ערש ברזל, 9 x 4 cubits by a man's cubit, still in Rabbah of Ammon"}
      - {motif: giant-aboriginal-peoples, refs: ["Deut 3:13"], note: "Bashan called land of Rephaim"}
      - {motif: towns-named-after-conqueror, refs: ["Deut 3:14"]}
      - {motif: transjordan-tribes-fight-first, refs: ["Deut 3:18", "Deut 3:19", "Deut 3:20"]}
      - {motif: commissioning-successor, refs: ["Deut 3:21", "Deut 3:22"]}
    hints:
      - "Og legends: rabbinic Og survived the Flood (b. Niddah 61a), was killed by Moses leaping ten cubits (b. Berakhot 54b); Islamic 'Uj ibn 'Anaq is a giant of immense height."
      - "The 'bed' (eres) may be a basalt dolmen/sarcophagus; compare relics of heroes' oversized bones in Greek tradition (Orestes' bones, Herodotus 1.68)."
  - id: hb-deut-3-moses-plea
    tradition: judaism
    title: Moses pleads to cross the Jordan and is refused
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Deut 3:23-29"]
    tags:
      - {motif: prophet-barred-from-promised-land, refs: ["Deut 3:25", "Deut 3:26"], note: "רב לך — 'enough, speak no more to me of this'"}
      - {motif: god-angry-for-peoples-sake, refs: ["Deut 3:26"]}
      - {motif: view-land-from-mountaintop, refs: ["Deut 3:27"], note: "top of Pisgah, look west, north, south, east"}
      - {motif: commissioning-successor, refs: ["Deut 3:28"]}
      - {motif: unique-event-since-creation, refs: ["Deut 3:24"], note: "what god in heaven or earth can do deeds like yours"}
    hints:
      - "Midrash Petirat Moshe expands Moses' 515 prayers (gematria of ואתחנן) to be allowed to enter."
  - id: hb-deut-4-exhortation
    tradition: judaism
    title: Exhortation at Horeb's memory; no image; exile and return
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Deut 4:1-40"]
    tags:
      - {motif: no-adding-or-subtracting, refs: ["Deut 4:2"]}
      - {motif: law-as-wisdom-before-nations, refs: ["Deut 4:6", "Deut 4:8"]}
      - {motif: god-near-when-called, refs: ["Deut 4:7"]}
      - {motif: mountain-burning-to-heaven, refs: ["Deut 4:11"]}
      - {motif: voice-without-form, refs: ["Deut 4:12", "Deut 4:15", "Deut 4:33", "Deut 4:36"]}
      - {motif: two-stone-tablets, refs: ["Deut 4:13"]}
      - {motif: aniconism-no-image, refs: ["Deut 4:16", "Deut 4:17", "Deut 4:18", "Deut 4:23", "Deut 4:25"]}
      - {motif: astral-worship-forbidden, refs: ["Deut 4:19"]}
      - {motif: nations-allotted-heavenly-host, refs: ["Deut 4:19"], note: "which YHWH allotted (חלק) to all the peoples under heaven"}
      - {motif: iron-furnace-egypt, refs: ["Deut 4:20"]}
      - {motif: prophet-barred-from-promised-land, refs: ["Deut 4:21", "Deut 4:22"]}
      - {motif: god-consuming-fire, refs: ["Deut 4:24"]}
      - {motif: heaven-and-earth-as-witnesses, refs: ["Deut 4:26"]}
      - {motif: exile-and-dispersion-threatened, refs: ["Deut 4:27"]}
      - {motif: idols-cannot-see-hear-eat-smell, refs: ["Deut 4:28"]}
      - {motif: return-in-latter-days, refs: ["Deut 4:30", "Deut 4:31"], note: "באחרית הימים"}
      - {motif: unique-event-since-creation, refs: ["Deut 4:32", "Deut 4:33", "Deut 4:34"]}
      - {motif: strict-monotheism-none-besides, refs: ["Deut 4:35", "Deut 4:39"]}
    hints:
      - "Compare Abraham's rejection of star, moon and sun worship (Q 6:76-79) and Quranic idols that cannot hear or see (Q 19:42)."
      - "Rev 22:18-19 adds the no-adding/no-subtracting formula; also Codex Hammurabi epilogue curse on altering the stela."
  - id: hb-deut-4-refuge-cities-heading
    tradition: judaism
    title: Three Transjordan cities of refuge; heading of the law
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Deut 4:41-49"]
    tags:
      - {motif: cities-of-refuge, refs: ["Deut 4:41", "Deut 4:42", "Deut 4:43"], note: "Bezer, Ramoth in Gilead, Golan in Bashan"}
      - {motif: mountain-two-names, refs: ["Deut 4:48"], note: "Mount Sion, that is Hermon"}
  - id: hb-deut-5-decalogue
    tradition: judaism
    title: The Decalogue restated and the people's fear at Horeb
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Deut 5:1-33"]
    tags:
      - {motif: covenant-with-living-not-fathers, refs: ["Deut 5:3"]}
      - {motif: voice-without-form, refs: ["Deut 5:4", "Deut 5:22"], note: "face to face out of the fire"}
      - {motif: ten-commandments, refs: ["Deut 5:6", "Deut 5:7", "Deut 5:11", "Deut 5:12", "Deut 5:16", "Deut 5:17", "Deut 5:18", "Deut 5:19", "Deut 5:20", "Deut 5:21"]}
      - {motif: aniconism-no-image, refs: ["Deut 5:8"]}
      - {motif: sins-visited-to-third-fourth-generation, refs: ["Deut 5:9", "Deut 5:10"]}
      - {motif: sabbath-rest-for-slaves-and-animals, refs: ["Deut 5:14"], note: "so that your slave may rest like you"}
      - {motif: sabbath-remember-slavery, refs: ["Deut 5:15"], note: "differs from the creation rationale of Exod 20:11"}
      - {motif: honor-parents-long-life, refs: ["Deut 5:16"]}
      - {motif: covet-prohibition, refs: ["Deut 5:21"], note: "wife listed before house; 'field' added"}
      - {motif: two-stone-tablets, refs: ["Deut 5:22"]}
      - {motif: mountain-burning-to-heaven, refs: ["Deut 5:23"]}
      - {motif: people-fear-direct-revelation, refs: ["Deut 5:5", "Deut 5:24", "Deut 5:25", "Deut 5:26", "Deut 5:27"], note: "who of all flesh has heard the voice of the living God and lived"}
    hints:
      - "Quran 17:22-39 contains a commandment list often compared with the Decalogue; Q 2:55-56 the people ask to see God and are struck."
  - id: hb-deut-6-shema
    tradition: judaism
    title: The Shema and the instruction to teach
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Deut 6:1-25"]
    tags:
      - {motif: shema-god-is-one, refs: ["Deut 6:4"]}
      - {motif: love-god-with-all-heart, refs: ["Deut 6:5"]}
      - {motif: teach-children-constantly, refs: ["Deut 6:7"]}
      - {motif: words-bound-on-hand-and-forehead, refs: ["Deut 6:8"], note: "טוטפות"}
      - {motif: words-on-doorposts, refs: ["Deut 6:9"]}
      - {motif: inherit-houses-not-built, refs: ["Deut 6:10", "Deut 6:11"]}
      - {motif: warning-forget-god-in-plenty, refs: ["Deut 6:11", "Deut 6:12"]}
      - {motif: oath-by-gods-name, refs: ["Deut 6:13"]}
      - {motif: do-not-test-god, refs: ["Deut 6:16"]}
      - {motif: child-asks-meaning-of-law, refs: ["Deut 6:20", "Deut 6:21"]}
    hints:
      - "Mark 12:29-30 (Jesus quotes the Shema); Matt 4:7, 4:10 (Jesus quotes Deut 6:13, 6:16 against Satan); Quran 112:1 'Say: He is God, One'."
      - "Passover Haggadah's four sons draws on Deut 6:20."
  - id: hb-judg-17-micah-shrine
    tradition: judaism
    title: Micah's silver idol and his hired Levite
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Judg 17:1-13"]
    tags:
      - {motif: stolen-silver-and-mothers-curse, refs: ["Judg 17:2", "Judg 17:3"], note: "1100 silver, the same sum as each Philistine lord paid Delilah (16:5)"}
      - {motif: household-idol-shrine, refs: ["Judg 17:4", "Judg 17:5"], note: "pesel and massekhah, ephod and teraphim; a son installed as priest"}
      - {motif: no-king-in-israel-refrain, refs: ["Judg 17:6"]}
      - {motif: hired-levite-priest, refs: ["Judg 17:7", "Judg 17:10", "Judg 17:12", "Judg 17:13"], note: "Ten silver a year, clothing, food; 'be to me a father and a priest'"}
  - id: hb-judg-18-dan-migration
    tradition: judaism
    title: Danite migration, theft of Micah's idol and conquest of Laish
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Judg 18:1-31"]
    tags:
      - {motif: no-king-in-israel-refrain, refs: ["Judg 18:1"]}
      - {motif: spies-scout-land, refs: ["Judg 18:2", "Judg 18:7", "Judg 18:9", "Judg 18:10"], note: "Five spies"}
      - {motif: oracle-consulted-before-campaign, refs: ["Judg 18:5", "Judg 18:6"]}
      - {motif: peaceful-unsuspecting-city-destroyed, refs: ["Judg 18:7", "Judg 18:27", "Judg 18:28"], note: "Living 'after the manner of the Sidonians, quiet and secure'"}
      - {motif: place-name-etiology, refs: ["Judg 18:12"], note: "Mahaneh-Dan"}
      - {motif: idols-stolen-by-conquerors, refs: ["Judg 18:14", "Judg 18:17", "Judg 18:18", "Judg 18:20", "Judg 18:24"], note: "Micah: 'You took my gods which I made'"}
      - {motif: hired-levite-priest, refs: ["Judg 18:4", "Judg 18:19", "Judg 18:20"], note: "Better priest to a tribe than to one man's house"}
