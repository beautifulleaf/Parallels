  gentiles-taken-as-priests: {label: "God will take some of the nations as priests and Levites", cluster: eschatology}
  all-flesh-worships-on-new-moon-and-sabbath: {label: "From new moon to new moon and Sabbath to Sabbath all flesh comes to worship before God", cluster: eschatology}
  undying-worm-unquenched-fire: {label: "Corpses of the rebels whose worm does not die and fire is not quenched, an abhorrence to all flesh", cluster: eschatology}
  righteousness-sprouts-like-garden: {label: "As earth brings forth its sprouts and a garden its seeds, God makes righteousness and praise sprout", cluster: prophecy}
  brothers-cast-out-faithful: {label: "The faithful are hated and cast out by their own brothers for God's name's sake", cluster: prophecy}
  voice-from-temple-repays-enemies: {label: "A tumult from the city, a voice from the temple: the voice of YHWH repaying his enemies", cluster: theophany}
  god-as-midwife-of-birth: {label: "God as midwife who brings to the point of birth and does not shut the womb", cluster: theology}
  prophetic-book-superscription-by-reigns: {label: "A prophetic book opens with the prophet's name, lineage and the kings in whose reigns he prophesied", cluster: prophecy}
  i-am-with-you-to-deliver: {label: "God reassures the frightened prophet: 'Do not fear them, for I am with you to deliver you'", cluster: prophecy}
  god-touches-prophets-mouth: {label: "God (or a seraph) touches the prophet's mouth or lips to commission him", cluster: prophecy}
  uproot-and-tear-down-build-and-plant: {label: "Prophet appointed over nations to uproot and tear down, destroy and overthrow, build and plant", cluster: prophecy}
  vision-question-what-do-you-see: {label: "God asks the prophet 'What do you see?' and interprets the ordinary object he names", cluster: prophecy}
  almond-rod-watching-pun: {label: "Vision of an almond branch (shaqed) explained as God watching (shoqed) over his word", cluster: prophecy}
  boiling-pot-from-north: {label: "Vision of a boiling pot tilted from the north, signifying disaster poured out from the north", cluster: prophecy}
  foe-from-the-north: {label: "A terrible nameless invader comes from the north against Judah and Jerusalem", cluster: prophecy}
  prophet-made-fortified-city: {label: "God makes the prophet a fortified city, an iron pillar and bronze walls against the whole land", cluster: prophecy}
  wilderness-bridal-devotion: {label: "God remembers Israel's devotion as a bride who followed him in the wilderness, a land not sown", cluster: covenant}
  israel-firstfruits-holy-to-god: {label: "Israel was holy to YHWH, the firstfruits of his harvest; all who ate of it incurred guilt", cluster: covenant}
  covenant-lawsuit: {label: "God brings a legal case (riv) against his people, summoning witnesses and asking what wrong their fathers found in him", cluster: prophecy}
  nations-do-not-change-their-gods: {label: "No nation has exchanged its gods, though they are no gods, yet Israel exchanged its Glory", cluster: idolatry}
  heavens-appalled-at-apostasy: {label: "The heavens are called to be appalled and shudder at the people's apostasy", cluster: prophecy}
  broken-cisterns-for-living-water: {label: "The people forsook God, the fountain of living waters, and dug broken cisterns that hold no water", cluster: prophecy}
  drinking-waters-of-nile-and-euphrates: {label: "Seeking alliances with Egypt and Assyria described as going to drink the waters of the Nile and the River", cluster: prophecy}
  choice-vine-degenerates: {label: "God planted a choice vine of pure seed, but it turned into a degenerate foreign vine", cluster: prophecy}
  stain-not-washed-by-lye: {label: "Though washed with natron and much soap (borit), the people's guilt remains a stain before God", cluster: prophecy}
  she-camel-and-wild-ass-in-heat: {label: "Apostate people likened to a restless young she-camel and a wild ass in heat sniffing the wind", cluster: prophecy}
  tree-is-my-father-stone-bore-me: {label: "Idolaters say to a tree 'You are my father' and to a stone 'You gave birth to me'", cluster: idolatry}
  gods-as-many-as-cities: {label: "Judah has as many gods as cities (and altars as Jerusalem's streets)", cluster: idolatry}
  can-a-bride-forget-her-ornaments: {label: "'Can a virgin forget her ornaments or a bride her sash?' yet my people have forgotten me", cluster: prophecy}
  hands-on-head-in-shame: {label: "A shamed person goes out with hands on the head", cluster: mourning}
  harlot-waits-by-road-like-arab: {label: "The apostate people sat waiting for lovers by the roads like an Arab in the wilderness", cluster: prophecy}
  two-adulterous-sisters: {label: "Two sister nations (Israel and Judah) are both unfaithful wives; the second fails to learn from the first's divorce", cluster: prophecy}
  call-to-return-faithless-children: {label: "God calls 'Return, faithless children (shuvu banim shovavim), I will heal your faithlessness'", cluster: prophecy}
  one-from-a-city-two-from-a-family: {label: "God will take the returnees 'one from a city and two from a family' and bring them to Zion", cluster: prophecy}
  shepherds-after-gods-heart: {label: "God will give shepherds after his own heart who feed the people with knowledge", cluster: prophecy}
  ark-no-longer-remembered: {label: "In the future the ark of the covenant will no longer be spoken of, remembered, missed or made again", cluster: cult}
  jerusalem-called-throne-of-yhwh: {label: "Jerusalem will be called the throne of YHWH and all nations will gather to it", cluster: zion}
  reunion-of-judah-and-israel: {label: "The houses of Judah and Israel will walk together and come from the land of the north", cluster: prophecy}
  break-up-fallow-ground: {label: "'Break up your fallow ground and do not sow among thorns' as a call to repentance", cluster: prophecy}
  alarm-flee-to-fortified-cities: {label: "Blow the shofar, raise the signal: gather and flee into the fortified cities before the invader", cluster: war}
  destroyer-of-nations-as-lion: {label: "The invading destroyer of nations comes up like a lion from its thicket", cluster: prophecy}
  prophet-accuses-god-of-deceiving: {label: "The prophet protests that God has utterly deceived the people by promising peace", cluster: prophecy}
  chariots-like-whirlwind: {label: "The invader comes up like clouds, his chariots like a whirlwind and horses swifter than eagles", cluster: war}
  prophets-anguish-in-bowels: {label: "The prophet cries 'My bowels, my bowels! I writhe! the walls of my heart!' at the sound of war", cluster: prophecy}
  wise-for-evil-ignorant-of-good: {label: "The people are foolish children, skilled in doing evil but not knowing how to do good", cluster: wisdom}
  vision-of-uncreation: {label: "Vision of the earth returned to tohu va-vohu: no light in the heavens, mountains quaking, no humans, birds fled", cluster: cosmology}
  not-a-full-end: {label: "God will devastate the land but 'will not make a full end'", cluster: prophecy}
  earth-mourns-heavens-darken: {label: "The earth mourns and the heavens above grow dark because of God's decree", cluster: cosmology}
  city-as-painted-woman-rejected: {label: "The doomed city dresses in scarlet, gold ornaments and eye paint, but her lovers despise her and seek her life", cluster: prophecy}
  anguish-like-woman-in-labor: {label: "The people's terror is like the pangs of a woman in labor with her first child", cluster: prophecy}
  search-city-for-one-righteous: {label: "Search the streets for a single man who does justice and seeks truth, and God will pardon the city", cluster: prophecy}
  both-poor-and-great-corrupt: {label: "The prophet thinks only the poor are ignorant, but finds the great have broken the yoke too", cluster: prophecy}
  lion-wolf-leopard-attack: {label: "A lion from the forest, a wolf of the desert and a leopard watching the cities attack the sinners", cluster: prophecy}
  lusty-stallions-neighing: {label: "Adulterers like well-fed lusty stallions, each neighing after his neighbor's wife", cluster: prophecy}
  shall-i-not-punish-refrain: {label: "Refrain: 'Shall I not punish them for these things? Shall I not avenge myself on such a nation?'", cluster: prophecy}
  denial-god-will-not-act: {label: "The people deny God: 'It is not he; no evil will come on us; the prophets are wind'", cluster: prophecy}
  prophets-word-as-fire: {label: "God makes his words in the prophet's mouth a fire and the people wood it consumes", cluster: prophecy}
  eyes-that-do-not-see: {label: "A foolish people who have eyes but do not see and ears but do not hear", cluster: prophecy}
  fowlers-houses-full-of-deceit: {label: "The wicked lie in wait like fowlers setting traps; their houses are full of deceit like a cage full of birds", cluster: wisdom}
  prophets-lie-and-people-love-it: {label: "Prophets prophesy falsely, priests rule by their direction, and the people love it so", cluster: prophecy}
  sanctify-war: {label: "The attackers 'sanctify war' (qaddeshu milhamah) against the city and plan a noon or night assault", cluster: war}
  glean-remnant-like-vine: {label: "Glean the remnant of Israel thoroughly as a vine; pass your hand again over the branches like a grape-gatherer", cluster: prophecy}
  uncircumcised-ears: {label: "The people's ears are uncircumcised so that they cannot listen", cluster: prophecy}
  prophet-cannot-hold-in-gods-word: {label: "The prophet is full of God's wrath or word and is weary of holding it in", cluster: prophecy}
  peace-peace-when-no-peace: {label: "Prophets and priests heal the wound lightly, saying 'Peace, peace' when there is no peace", cluster: prophecy}
  shameless-cannot-blush: {label: "They committed abomination yet were not ashamed; they did not know how to blush", cluster: prophecy}
  ask-for-the-ancient-paths: {label: "Stand at the crossroads and ask for the ancient paths, the good way, and find rest for your souls", cluster: wisdom}
  heaven-and-earth-summoned-as-witnesses: {label: "The nations, the earth or the heavens are summoned to hear God's case against his people", cluster: prophecy}
  terror-on-every-side: {label: "'Terror on every side' (magor missaviv) as cry of panic or name", cluster: prophecy}
  mourning-as-for-only-son: {label: "Mourn with sackcloth and ashes as for an only son, a most bitter lament", cluster: mourning}
  prophet-as-assayer-refining-fails: {label: "The prophet is set as assayer of the people; the bellows blow and lead is consumed in vain: rejected silver", cluster: prophecy}
  siege-ramp-cut-trees: {label: "Besiegers cut down trees and pour out a siege ramp against the city", cluster: war}
  city-keeps-evil-fresh-like-well: {label: "As a well keeps its water fresh, so the city keeps its wickedness fresh", cluster: prophecy}
  watchmen-set-but-unheeded: {label: "God set watchmen to sound the shofar, but the people refused to listen", cluster: prophecy}
  stumbling-blocks-set-by-god: {label: "God himself lays stumbling blocks before the people, and fathers and sons stumble together", cluster: prophecy}
  prophet-preaches-at-temple-gate: {label: "The prophet is sent to stand in the gate of God's house and preach to those entering to worship", cluster: prophecy}
  temple-of-yhwh-false-trust: {label: "Do not trust deceptive words: 'The temple of YHWH, the temple of YHWH, the temple of YHWH are these'", cluster: cult}
  den-of-robbers: {label: "God's house has become 'a den of robbers' in the people's eyes", cluster: cult}
  god-sent-prophets-persistently: {label: "God sent his servants the prophets 'rising early and sending' (hashkem), but they did not listen", cluster: prophecy}
  prophet-forbidden-to-intercede: {label: "God forbids the prophet to pray or intercede for the people, for he will not hear", cluster: prophecy}
  cakes-for-queen-of-heaven: {label: "Children gather wood, fathers kindle fire and women knead dough to make cakes for the Queen of Heaven", cluster: cult}
  sacrifice-not-commanded-at-exodus: {label: "God says he did not command the fathers about burnt offerings and sacrifices when he brought them out of Egypt, but obedience", cluster: cult}
  eat-your-burnt-offerings-yourselves: {label: "God sarcastically tells the people to add their burnt offerings to their sacrifices and eat the meat", cluster: cult}
  cut-off-hair-lament-on-heights: {label: "Jerusalem told to cut off her hair (nezer) and throw it away and raise a lament on the bare heights", cluster: mourning}
  child-burning-never-commanded: {label: "God says the burning of children in the Topheth was something he never commanded nor did it enter his mind", cluster: cult}
  valley-renamed-valley-of-slaughter: {label: "The Topheth and Valley of Ben-hinnom will be renamed the Valley of Slaughter, where the dead are buried for lack of room", cluster: cult}
  unburied-corpses-food-for-birds: {label: "The people's corpses will be food for the birds of the sky and the beasts with no one to frighten them away", cluster: prophecy}
  voice-of-bride-and-groom-silenced: {label: "God will silence the sound of joy and gladness, the voice of the bridegroom and the voice of the bride", cluster: prophecy}
  bones-exhumed-before-astral-gods: {label: "The bones of kings, priests, prophets and people will be taken from their graves and spread before the sun, moon and host of heaven they loved", cluster: prophecy}
  death-preferred-to-life: {label: "The surviving remnant will choose death rather than life", cluster: prophecy}
  no-one-repents-what-have-i-done: {label: "No one repents of his evil, saying 'What have I done?'; each rushes on like a horse charging into battle", cluster: prophecy}
  migratory-birds-know-their-seasons: {label: "The stork, turtledove, swift and crane know their seasons of migration, but God's people do not know his law", cluster: wisdom}
  lying-pen-of-scribes: {label: "'How can you say We are wise, and the Torah of YHWH is with us?' The lying pen of the scribes has made it a lie", cluster: scripture}
  no-grapes-on-vine-no-figs: {label: "When God comes to gather there are no grapes on the vine and no figs on the fig tree; the leaf withers", cluster: prophecy}
  god-gives-poison-water-to-drink: {label: "God gives his people poisoned water (mei rosh) to drink and wormwood to eat", cluster: prophecy}
  harvest-past-not-saved: {label: "'The harvest is past, the summer is ended, and we are not saved'", cluster: prophecy}
  no-balm-in-gilead: {label: "'Is there no balm in Gilead, is there no physician there?' for the people's wound", cluster: prophecy}
  weeping-prophet-fountain-of-tears: {label: "The prophet wishes his head were waters and his eyes a fountain of tears to weep day and night for the slain", cluster: prophecy}
  wish-for-desert-lodging: {label: "The prophet wishes he had a wayfarers' lodge in the desert to leave his people", cluster: prophecy}
  every-brother-a-supplanter: {label: "Trust no brother, for every brother is a supplanter ('aqov ya'qov, playing on Jacob) and every friend a slanderer", cluster: prophecy}
  jerusalem-heap-haunt-of-jackals: {label: "Jerusalem and the cities of Judah will become heaps, a lair of jackals, desolate without inhabitant", cluster: prophecy}
  land-emptied-of-birds-and-beasts: {label: "The land is so desolate that both birds of the sky and beasts have fled and gone", cluster: prophecy}
  professional-wailing-women: {label: "Summon the keening women and skilled women to raise a dirge; mothers teach their daughters lament", cluster: mourning}
  death-climbs-through-windows: {label: "Death has climbed in through our windows and entered our palaces, cutting off children from the street", cluster: mourning}
  let-not-the-wise-boast: {label: "Let not the wise boast of wisdom, the mighty of might or the rich of riches, but of understanding and knowing God", cluster: wisdom}
  circumcised-in-flesh-uncircumcised-in-heart: {label: "God will punish all circumcised who are uncircumcised: Egypt, Judah, Edom, Ammon, Moab and the desert-dwellers, and Israel uncircumcised in heart", cluster: prophecy}
  is-god-not-in-zion: {label: "The exiled people cry 'Is YHWH not in Zion? Is her King not in her?'", cluster: zion}
  do-not-fear-signs-of-heavens: {label: "Do not learn the way of the nations or be dismayed by the signs of the heavens, at which the nations are dismayed", cluster: divination}
  idol-like-scarecrow-in-cucumber-field: {label: "Idols are like a scarecrow in a cucumber field: they cannot speak and must be carried because they cannot walk", cluster: idolatry}
  king-of-the-nations: {label: "God addressed as 'King of the nations' whom all must fear", cluster: theology}
  true-living-god-everlasting-king: {label: "YHWH is the true God, the living God and everlasting King at whose wrath the earth quakes", cluster: theology}
  gods-who-did-not-make-heaven-perish: {label: "Aramaic declaration: the gods who did not make heaven and earth shall perish from the earth and from under the heavens", cluster: idolatry}
  creation-by-wisdom-and-understanding: {label: "God made the earth by his power, established the world by his wisdom and stretched out the heavens by his understanding", cluster: creation}
  wind-from-gods-storehouses: {label: "At God's voice waters roar in heaven; he raises mists, makes lightning for rain and brings wind out of his storehouses", cluster: cosmology}
  idols-have-no-breath: {label: "Every goldsmith is shamed by his image, for his casting is a lie and there is no breath (ruah) in them", cluster: idolatry}
  portion-of-jacob-former-of-all: {label: "Not like these is the Portion of Jacob, for he is the former of all things", cluster: theology}
  pack-bundle-for-exile: {label: "The besieged inhabitant is told to gather up her bundle from the ground, for God will sling out the inhabitants", cluster: prophecy}
  ruined-tent-children-gone: {label: "Zion laments: my tent is destroyed, my cords snapped, my children gone, and no one to pitch my tent again", cluster: mourning}
  man-cannot-direct-own-steps: {label: "A man's way is not in himself; it is not in the one who walks to direct his steps", cluster: wisdom}
  cursed-who-does-not-obey-covenant: {label: "'Cursed is the man who does not hear the words of this covenant', answered with 'Amen'", cluster: covenant}
  green-olive-tree-set-on-fire: {label: "God named his people 'a green olive tree, fair with goodly fruit', but sets fire to it and its branches are broken", cluster: prophecy}
  unsuspecting-lamb-led-to-slaughter: {label: "The prophet was like a gentle lamb led to slaughter, not knowing they plotted 'Let us destroy the tree with its fruit'", cluster: prophecy}
  hometown-plots-against-prophet: {label: "The men of the prophet's hometown seek his life: 'Do not prophesy in YHWH's name or you will die by our hand'", cluster: prophecy}
  prophet-calls-for-vengeance: {label: "The persecuted prophet asks God to let him see vengeance on his enemies", cluster: prophecy}
  jeremiah-confession: {label: "Jeremiah's 'confessions': the prophet's personal laments and complaints to God about his mission and persecutors", cluster: prophecy}
  prophet-brings-case-against-god: {label: "The prophet acknowledges God is righteous yet would argue his case with him about justice", cluster: theodicy}
  god-near-in-mouth-far-from-heart: {label: "God is near in their mouths but far from their kidneys (hearts)", cluster: theology}
  run-with-footmen-contend-with-horses: {label: "'If you have run with footmen and they wearied you, how will you compete with horses?' and the thickets of the Jordan", cluster: wisdom}
  family-betrays-prophet: {label: "Even the prophet's brothers and father's house deal treacherously with him; do not trust their fair words", cluster: prophecy}
  god-forsakes-his-house-and-heritage: {label: "God says 'I have forsaken my house, abandoned my heritage, given the beloved of my soul into the enemy's hands'", cluster: prophecy}
  speckled-bird-of-prey: {label: "God's heritage is like a speckled bird of prey (or hyena) attacked by birds all around", cluster: prophecy}
  many-shepherds-ruin-vineyard: {label: "Many shepherds have destroyed God's vineyard and trampled his portion into a desolate wilderness", cluster: prophecy}
  sowed-wheat-reaped-thorns: {label: "They sowed wheat and reaped thorns; they toiled without profit", cluster: prophecy}
  evil-neighbors-uprooted-and-restored: {label: "God will uproot the evil neighbor nations, then have compassion and plant them among his people if they learn to swear 'as YHWH lives'", cluster: prophecy}
  prophetic-symbolic-act: {label: "God commands the prophet to perform a symbolic action (with an object, his body or his life) that enacts the message", cluster: prophecy}
  buried-loincloth-rots: {label: "The prophet buries a new linen loincloth by the Perath (Euphrates) in a cleft of the rock; dug up later it is ruined and good for nothing", cluster: prophecy}
  people-cling-to-god-like-loincloth: {label: "As a loincloth clings to a man's loins, God made Israel and Judah cling to him to be his people, name and glory", cluster: covenant}
  every-jar-filled-with-wine: {label: "'Every jar is filled with wine': God will fill all the inhabitants with drunkenness and smash them against one another", cluster: prophecy}
  give-glory-before-darkness: {label: "Give glory to God before he brings darkness and your feet stumble on the twilight mountains", cluster: prophecy}
  king-and-queen-mother-humbled: {label: "The king and the queen mother (gevirah) are told to sit low, for their crowns have fallen from their heads", cluster: kingship}
  can-ethiopian-change-skin: {label: "'Can the Cushite change his skin or the leopard its spots?' so neither can those accustomed to evil do good", cluster: wisdom}
  nobles-find-empty-cisterns: {label: "In drought nobles send servants for water who find the cisterns dry and return with empty vessels, heads covered in shame", cluster: prophecy}
  doe-abandons-newborn-in-drought: {label: "In drought the doe abandons her newborn fawn and wild asses pant for air like jackals, their eyes failing", cluster: prophecy}
  god-like-stranger-in-the-land: {label: "Lament asks why God is like a stranger in the land, a traveler stopping for a night, a stunned warrior who cannot save", cluster: theology}
  sword-famine-pestilence-triad: {label: "The triad of judgment: sword, famine and pestilence", cluster: prophecy}
  false-prophets-not-sent: {label: "God did not send the prophets who promise peace; they prophesy a lying vision, divination and the deceit of their heart", cluster: prophecy}
  idols-cannot-give-rain: {label: "Can any of the nations' vanities bring rain, or can the heavens give showers? Only YHWH", cluster: idolatry}
  fourfold-destiny-of-doomed: {label: "Those destined for death to death, for the sword to the sword, for famine to famine, for captivity to captivity", cluster: prophecy}
  four-kinds-of-destroyers: {label: "God appoints four kinds of destroyers: the sword to kill, dogs to drag, birds and beasts to devour", cluster: prophecy}
  god-weary-of-relenting: {label: "God says 'I am weary of relenting' (nil'eti hinnahem)", cluster: theology}
  mother-of-seven-languishes: {label: "She who bore seven languishes and breathes out her life; her sun goes down while it is still day", cluster: mourning}
  prophet-eats-gods-words: {label: "The prophet found God's words and ate them, and they became his joy", cluster: prophecy}
  prophet-sits-alone: {label: "The prophet did not sit in the company of merrymakers but sat alone because of God's hand", cluster: prophecy}
  god-as-deceitful-brook: {label: "The prophet accuses God of being to him like a deceitful brook, waters that fail", cluster: theodicy}
  prophet-as-gods-mouth: {label: "If the prophet returns and brings out the precious from the worthless, he will be as God's mouth", cluster: prophecy}
  prophet-forbidden-to-marry: {label: "God forbids the prophet to take a wife or have children in this place, as a sign of the doom of parents and children", cluster: prophecy}
  prophet-forbidden-to-mourn-or-feast: {label: "God forbids the prophet to enter a house of mourning or a house of feasting, as a sign that both will cease", cluster: prophecy}
  marzeah-house: {label: "The 'house of the marzeah' (beit marzeah), a house of ritual feasting associated with mourning the dead", cluster: mourning}
  bread-and-cup-of-consolation: {label: "Mourners are given bread broken for them and a 'cup of consolation' for father or mother", cluster: mourning}
  new-exodus-eclipses-old: {label: "No longer will they swear by the God who brought Israel out of Egypt, but by the God who brought them from the land of the north", cluster: exodus}
  fishers-and-hunters: {label: "God sends many fishers to fish them out and then many hunters to hunt them from every mountain and cleft of rock", cluster: prophecy}
  nations-confess-fathers-inherited-lies: {label: "Nations come from the ends of the earth confessing 'our fathers inherited nothing but lies'; can a man make gods for himself?", cluster: idolatry}
  sin-engraved-with-iron-pen: {label: "Judah's sin is written with an iron pen and a diamond point, engraved on the tablet of their heart and the horns of their altars", cluster: prophecy}
  cursed-who-trusts-in-man: {label: "Cursed is the man who trusts in man and makes flesh his arm; he is like a juniper in the desert, in a salt land", cluster: wisdom}
  heart-deceitful-above-all: {label: "The heart is deceitful ('aqov) above all things and desperately sick; who can know it?", cluster: wisdom}
  partridge-hatches-eggs-not-laid: {label: "Like a partridge that hatches eggs it did not lay is one who gets riches unjustly; he will leave them in the middle of his days", cluster: wisdom}
  glorious-throne-from-the-beginning: {label: "'A glorious throne, exalted from the beginning, is the place of our sanctuary'", cluster: cosmology}
  names-written-in-the-earth: {label: "Those who turn away from God will be written in the earth (or dust), for they forsook the fountain of living water", cluster: theology}
  scoffers-ask-where-is-the-word: {label: "Scoffers taunt the prophet: 'Where is the word of YHWH? Let it come!'", cluster: prophecy}
  heal-me-o-lord-prayer: {label: "'Heal me, YHWH, and I shall be healed; save me and I shall be saved'", cluster: liturgy}
  sabbath-burden-carrying-forbidden: {label: "Carrying burdens through the city gates or out of houses on the Sabbath is forbidden", cluster: law}
  sabbath-keeping-secures-city: {label: "If the Sabbath is kept, Davidic kings will enter the gates and the city will be inhabited forever; if not, fire will consume its gates", cluster: law}
  potter-reworks-spoiled-vessel: {label: "The prophet watches a potter at the wheel rework a spoiled vessel into another: so God can do with Israel as clay", cluster: prophecy}
  conditional-prophecy: {label: "If a nation God threatened turns from evil he relents of the evil; if a nation he promised to build does evil he relents of the good", cluster: theology}
  does-snow-leave-lebanon: {label: "Does the snow of Lebanon leave the crags, or do the cold flowing waters dry up? yet my people have forgotten me", cluster: prophecy}
  god-shows-back-not-face: {label: "God will show the people his back and not his face in the day of their calamity", cluster: theology}
  torah-from-priest-counsel-from-wise-word-from-prophet: {label: "'Torah shall not perish from the priest, nor counsel from the wise, nor the word from the prophet'", cluster: wisdom}
  enemies-dig-pit-for-righteous: {label: "Enemies dig a pit and hide snares for the righteous one who once interceded for them", cluster: prophecy}
  smashed-potters-flask: {label: "The prophet buys a potter's earthenware flask and smashes it before the elders: so God will break the city beyond mending", cluster: prophecy}
  prophet-renames-persecutor: {label: "The prophet gives his persecutor an ominous new name announcing his fate", cluster: prophecy}
  god-enticed-the-prophet: {label: "The prophet complains 'You enticed (pittitani) me, YHWH, and I was enticed; you overpowered me and prevailed'", cluster: theodicy}
  curse-on-messenger-of-birth: {label: "The sufferer curses the man who brought his father the news 'A son is born to you'", cluster: theodicy}
  besieged-king-asks-prophet-for-miracle: {label: "The besieged king sends to ask the prophet to inquire of God, hoping God will do a wonder and make the enemy withdraw", cluster: prophecy}
  god-fights-against-own-people: {label: "God himself fights against his own people with outstretched hand and mighty arm, turning their weapons back", cluster: prophecy}
  surrender-to-enemy-to-live: {label: "Whoever stays in the city will die, but whoever goes out and surrenders to the besiegers will live, his life as spoil", cluster: prophecy}
  execute-justice-in-the-morning: {label: "The royal house is told to execute justice in the morning and rescue the robbed from the oppressor", cluster: kingship}
  false-security-who-can-come-against-us: {label: "The city that sits in the valley says 'Who can come down against us, who can enter our dwellings?'", cluster: prophecy}
  city-burned-by-conqueror: {label: "The city is given into the hand of the king of Babylon who will burn it with fire", cluster: prophecy}
  royal-house-cedars-felled: {label: "The royal palace, 'Gilead to me, the summit of Lebanon', will have its choice cedars cut down and thrown on the fire", cluster: prophecy}
  weep-for-the-exile-not-the-dead: {label: "Do not weep for the dead but weep bitterly for him who goes away, for he will never return to see his native land", cluster: mourning}
  exiled-king-never-returns: {label: "A deposed king taken into exile will die there and never see his land again", cluster: kingship}
  woe-to-palace-builder-unpaid-labor: {label: "Woe to the king who builds his palace by injustice, making his neighbor work for nothing, with cedar paneling and vermilion paint", cluster: kingship}
  to-know-god-is-to-do-justice: {label: "The good king judged the cause of the poor and needy: 'Is not this to know me?' says YHWH", cluster: kingship}
  burial-of-a-donkey: {label: "The wicked king will not be lamented ('Alas my brother, alas lord') but buried with the burial of a donkey, dragged and cast outside the gates", cluster: kingship}
  signet-ring-torn-off: {label: "Even if the king were the signet ring on God's right hand, God would tear him off", cluster: kingship}
  write-him-childless: {label: "'Write this man down as childless': none of his seed will sit on David's throne", cluster: kingship}
  woe-to-shepherds-who-scatter: {label: "Woe to the shepherds who destroy and scatter the sheep of God's pasture; God will attend to their evil deeds", cluster: prophecy}
  righteous-branch-of-david: {label: "God will raise up for David a righteous Branch (tsemah) who will reign wisely and do justice", cluster: messianism}
  yhwh-our-righteousness-name: {label: "The future king's name will be 'YHWH is our righteousness' (YHWH tsidqenu)", cluster: messianism}
  prophet-drunk-before-gods-words: {label: "The prophet's heart is broken and all his bones shake; he is like a drunken man because of God's holy words", cluster: prophecy}
  prophets-like-sodom: {label: "The prophets of Jerusalem commit adultery and strengthen evildoers; they have become like Sodom and Gomorrah", cluster: prophecy}
  storm-of-yhwhs-wrath: {label: "The storm of YHWH's fury goes out and whirls on the head of the wicked; in the latter days you will understand it", cluster: prophecy}
  god-near-and-far-fills-heaven-and-earth: {label: "'Am I a God near at hand and not a God far off? Do I not fill heaven and earth?'", cluster: theology}
  false-prophets-dream-dreams: {label: "False prophets say 'I have dreamed, I have dreamed'; what has straw to do with wheat?", cluster: prophecy}
  word-like-hammer-shattering-rock: {label: "God's word is like a hammer that shatters rock", cluster: prophecy}
  prophets-steal-words-from-each-other: {label: "God is against the prophets who steal his words from one another and wag their tongues saying 'oracle'", cluster: prophecy}
  burden-of-yhwh-pun: {label: "When asked 'What is the burden (massa) of YHWH?' the prophet answers 'You are the burden, and I will cast you off'; the phrase is banned", cluster: prophecy}
  two-baskets-of-figs: {label: "Vision of two baskets of figs before the temple, very good and very bad: the exiles in Babylon are the good, those left behind the bad", cluster: prophecy}
  god-gives-heart-to-know-him: {label: "God will give the people a heart to know him, and they will return to him with their whole heart", cluster: covenant}
  synchronism-of-reigns: {label: "A prophecy dated by synchronizing an Israelite king's year with a foreign king's (fourth of Jehoiakim = first of Nebuchadrezzar)", cluster: chronology}
  foreign-conqueror-as-gods-servant: {label: "God calls the foreign conqueror (Nebuchadrezzar) 'my servant', sent to execute his judgment", cluster: prophecy}
  sound-of-millstones-and-lamp-cease: {label: "God will banish the voice of joy, the voice of bride and groom, the sound of the millstones and the light of the lamp", cluster: prophecy}
  prophecies-written-in-this-book: {label: "Reference to 'all that is written in this book which Jeremiah prophesied against all the nations'", cluster: scripture}
  catalogue-of-nations-drink-cup: {label: "The prophet makes a long list of nations and kings drink the cup of God's wrath, beginning with Jerusalem", cluster: prophecy}
  sheshach-atbash-cipher: {label: "Babylon referred to by the cipher 'Sheshach' (atbash substitution of the alphabet)", cluster: scripture}
  judgment-begins-at-gods-city: {label: "If God begins to bring evil on the city called by his name, shall the nations go unpunished?", cluster: prophecy}
  god-roars-from-on-high: {label: "YHWH roars from on high and thunders from his holy dwelling, shouting like grape-treaders against all the earth", cluster: theophany}
  shepherds-wail-in-ashes: {label: "Shepherds and lords of the flock wail and roll in ashes, for their days of slaughter have come and there is no escape", cluster: prophecy}
  god-as-lion-leaving-lair: {label: "God has left his covert like a lion; the land is a waste before the fury of the oppressor (or 'the dove')", cluster: theology}
units:
  - id: hb-isa-46-bel-nebo-carried
    tradition: judaism
    title: Bel and Nebo carried off; God who carries Israel
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Isa 46:1-13"]
    tags:
      - {motif: babylonian-gods-bow-and-stoop, refs: ["Isa 46:1", "Isa 46:2"], note: "kara' Bel, qores Nebo; images a load for animals and cattle"}
      - {motif: idols-stolen-by-conquerors, refs: ["Isa 46:2"], note: "the gods themselves 'go into captivity' (bashevi)"}
      - {motif: gods-carried-versus-god-who-carries, refs: ["Isa 46:3", "Isa 46:4", "Isa 46:7"], note: "borne from the belly, carried from the womb, to old age and gray hair"}
      - {motif: incomparability-among-the-gods, refs: ["Isa 46:5"], note: "'To whom will you liken me and make me equal?'"}
      - {motif: idol-manufacture-satire, refs: ["Isa 46:6", "Isa 46:7"], note: "they lavish gold from the purse, weigh silver, hire a goldsmith; carry it on the shoulder"}
      - {motif: idol-cannot-move-or-answer, refs: ["Isa 46:7"]}
      - {motif: no-god-beside-you-confession, refs: ["Isa 46:9"], note: "'I am El and there is no other, God and none like me'"}
      - {motif: god-declares-end-from-beginning, refs: ["Isa 46:10"]}
      - {motif: bird-of-prey-from-east, refs: ["Isa 46:11"], note: "'ayit from the east, 'the man of my counsel'"}
    hints:
      - "Bel = Marduk, Nebo = Nabu, whose statues were carried in the Babylonian Akitu procession; compare the Cyrus Cylinder on returning gods to their shrines."
  - id: hb-isa-47-fall-of-lady-babylon
    tradition: judaism
    title: Taunt over the virgin daughter Babylon
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Isa 47:1-15"]
    tags:
      - {motif: daughter-babylon-dethroned, refs: ["Isa 47:1", "Isa 47:5"], note: "no longer called 'tender and delicate' or 'mistress of kingdoms' (gevaret mamlakhot)"}
      - {motif: queen-city-grinds-at-millstones, refs: ["Isa 47:2"]}
      - {motif: shamed-by-exposed-nakedness, refs: ["Isa 47:3"]}
      - {motif: i-am-and-none-besides-me-boast, refs: ["Isa 47:8", "Isa 47:10"], note: "'ani we-afsi 'od', echoing God's own self-predication"}
      - {motif: widowhood-and-bereavement-in-one-day, refs: ["Isa 47:8", "Isa 47:9"]}
      - {motif: sorcerers-and-astrologers-cannot-save, refs: ["Isa 47:9", "Isa 47:12", "Isa 47:13"], note: "hoverei shamayim, 'dividers of the heavens', star-gazers who make known by new moons"}
      - {motif: no-one-sees-me-boast, refs: ["Isa 47:10"], note: "'No one sees me' (ein ro'ani)"}
      - {motif: wicked-burned-like-stubble, refs: ["Isa 47:14"], note: "not a coal to warm oneself, nor a fire to sit before"}
    hints:
      - "Revelation 18:7-8 reuses 'I sit as a queen, I am no widow' and 'in one day' for Babylon/Rome; Zeph 2:15 has the same boast of Nineveh."
  - id: hb-isa-48-refined-in-affliction
    tradition: judaism
    title: Obstinate Israel, former and new things, flee from Babylon
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Isa 48:1-22"]
    tags:
      - {motif: former-things-foretold-new-things-hidden, refs: ["Isa 48:3", "Isa 48:5", "Isa 48:6", "Isa 48:7"], note: "lest you say 'my idol did them, my image commanded them'"}
      - {motif: iron-neck-bronze-brow, refs: ["Isa 48:4"]}
      - {motif: refined-in-furnace-of-affliction, refs: ["Isa 48:10"], note: "'not as silver; I have chosen you in the furnace of affliction'"}
      - {motif: for-my-own-sake-my-glory-not-given, refs: ["Isa 48:9", "Isa 48:11"]}
      - {motif: god-first-and-last, refs: ["Isa 48:12"]}
      - {motif: god-alone-stretches-heavens, refs: ["Isa 48:13"], note: "my hand founded the earth, my right hand spread out the heavens; I call and they stand together"}
      - {motif: sent-by-god-and-his-spirit, refs: ["Isa 48:16"]}
      - {motif: seed-as-dust-stars-sand, refs: ["Isa 48:19"], note: "had you obeyed, your seed would be like the sand"}
      - {motif: go-out-from-babylon, refs: ["Isa 48:20"]}
      - {motif: water-from-flint-rock, refs: ["Isa 48:21"], note: "new exodus recalls the cleft rock"}
      - {motif: no-peace-for-the-wicked, refs: ["Isa 48:22"]}
    hints:
      - "Isa 48:16 was read by early Christian writers (e.g. Origen) as a triadic text: Lord God, his Spirit, and the one sent."
  - id: hb-isa-49-servant-light-to-nations
    tradition: judaism
    title: Second servant song - called from the womb, a light to the nations
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Isa 49:1-13"]
    tags:
      - {motif: called-from-the-womb, refs: ["Isa 49:1", "Isa 49:5"], note: "from my mother's belly he named my name"}
      - {motif: mouth-like-sharp-sword, refs: ["Isa 49:2"]}
      - {motif: servant-named-israel, refs: ["Isa 49:3"]}
      - {motif: servant-laments-labor-in-vain, refs: ["Isa 49:4"]}
      - {motif: light-to-the-nations, refs: ["Isa 49:6"]}
      - {motif: kings-bow-to-despised-servant, refs: ["Isa 49:7"], note: "to one deeply despised, abhorred by the nation, a slave of rulers"}
      - {motif: release-of-prisoners-from-darkness, refs: ["Isa 49:9"]}
      - {motif: highway-for-returning-exiles, refs: ["Isa 49:10", "Isa 49:11"], note: "no hunger, thirst, heat or sun; led to springs"}
      - {motif: land-of-sinim, refs: ["Isa 49:12"], note: "from the north, the sea (west) and 'erets Sinim'"}
    hints:
      - "Luke 2:32 and Acts 13:47 cite 'light to the nations'; Rev 1:16 the sharp sword from the mouth; Gal 1:15 Paul's call 'from my mother's womb'."
      - "Sinim was long read as China (Sinae); modern scholars favor Syene (Aswan), cf. 1QIsaa swnyym."
  - id: hb-isa-49-zion-not-forgotten
    tradition: judaism
    title: Zion not forgotten; her children return
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Isa 49:14-26"]
    tags:
      - {motif: zion-complains-forsaken, refs: ["Isa 49:14"]}
      - {motif: god-like-nursing-mother, refs: ["Isa 49:15"], note: "'Can a woman forget her suckling? ... yet I will not forget you'"}
      - {motif: name-engraved-on-gods-palms, refs: ["Isa 49:16"]}
      - {motif: bereaved-zion-surprised-by-children, refs: ["Isa 49:20", "Isa 49:21"], note: "'the place is too narrow for me'; 'who bore me these?'"}
      - {motif: kings-as-foster-fathers-to-zion, refs: ["Isa 49:22", "Isa 49:23"], note: "children carried in the bosom and on the shoulder; they lick the dust of your feet"}
      - {motif: spoil-taken-from-the-mighty, refs: ["Isa 49:24", "Isa 49:25"]}
      - {motif: oppressors-eat-own-flesh, refs: ["Isa 49:26"]}
      - {motif: divine-epithets-mighty-one-of-jacob-stone-of-israel, refs: ["Isa 49:26"], note: "'Avir Ya'aqov'"}
    hints:
      - "Mark 3:27 / Matt 12:29 (binding the strong man) echoes 49:24-25. The divine mother image compares with rabbinic and Sufi images of divine rahma (womb-mercy)."
  - id: hb-isa-50-servant-struck
    tradition: judaism
    title: No bill of divorce; third servant song
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Isa 50:1-11"]
    tags:
      - {motif: bill-of-divorce, refs: ["Isa 50:1"], note: "'where is your mother's bill of divorce (sefer keritut)?'"}
      - {motif: god-sold-children-to-creditor-question, refs: ["Isa 50:1"]}
      - {motif: divine-power-questioned, refs: ["Isa 50:2"], note: "'Is my hand too short to redeem?'"}
      - {motif: god-rebuke-dries-sea-fish-rot, refs: ["Isa 50:2"]}
      - {motif: heavens-clothed-in-sackcloth, refs: ["Isa 50:3"]}
      - {motif: tongue-of-disciples-wakened-each-morning, refs: ["Isa 50:4", "Isa 50:5"]}
      - {motif: servant-beaten-beard-plucked-spat-on, refs: ["Isa 50:6"]}
      - {motif: face-set-like-flint, refs: ["Isa 50:7"]}
      - {motif: vindicator-is-near-who-will-contend, refs: ["Isa 50:8", "Isa 50:9"]}
      - {motif: enemies-wear-out-like-moth-eaten-garment, refs: ["Isa 50:9"]}
      - {motif: kindlers-of-fire-lie-in-torment, refs: ["Isa 50:11"]}
    hints:
      - "Gospel passion narratives (Mark 14:65; 15:19; Luke 9:51 'set his face') echo 50:6-7; Rom 8:33-34 echoes 50:8-9."
  - id: hb-isa-51-abraham-quarry
    tradition: judaism
    title: Look to the rock you were hewn from
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Isa 51:1-8"]
    tags:
      - {motif: look-to-rock-you-were-hewn-from, refs: ["Isa 51:1", "Isa 51:2"], note: "Abraham was one when called; Sarah 'who writhed you forth'"}
      - {motif: zion-desert-made-like-eden, refs: ["Isa 51:3"]}
      - {motif: light-to-the-nations, refs: ["Isa 51:4"], note: "torah goes forth from me, my justice a light of peoples"}
      - {motif: heavens-vanish-like-smoke, refs: ["Isa 51:6"]}
      - {motif: enemies-wear-out-like-moth-eaten-garment, refs: ["Isa 51:6", "Isa 51:8"], note: "moth ('ash) and worm (sas) eat them like wool"}
    hints:
      - "Matt 3:9 'God can raise children for Abraham from these stones' plays on the quarry image; Mark 13:31 / Ps 102:26-27 on heaven passing away."
  - id: hb-isa-51-arm-of-yhwh-rahab
    tradition: judaism
    title: Awake, arm of YHWH - Rahab and the dragon
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Isa 51:9-11"]
    tags:
      - {motif: awake-o-lord, refs: ["Isa 51:9"], note: "'uri 'uri, addressed to the arm of YHWH, 'as in days of old, generations of eternity'"}
      - {motif: rahab-crushed, refs: ["Isa 51:9"], note: "'who hewed (mahtsevet) Rahab'"}
      - {motif: sea-monster-defeated-by-god, refs: ["Isa 51:9", "Isa 51:10"], note: "pierced the tannin; dried Yam, the waters of the great Tehom"}
      - {motif: combat-myth-merged-with-exodus, refs: ["Isa 51:10"], note: "made the depths of the sea a way for the redeemed to pass"}
      - {motif: creation-from-primeval-waters, refs: ["Isa 51:10"], note: "tehom rabbah"}
      - {motif: ransomed-return-to-zion-singing, refs: ["Isa 51:11"]}
    hints:
      - "Ugaritic Baal cycle (KTU 1.3 III 38-42): Anat smites Yam, the tunnanu, the twisting serpent; Enuma Elish: Marduk splits Tiamat. Ps 74:13-14 and 89:11 also fuse Rahab with the exodus."
  - id: hb-isa-51-cup-of-staggering
    tradition: judaism
    title: I am your comforter; the cup of staggering
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Isa 51:12-23"]
    tags:
      - {motif: humans-like-grass-withering, refs: ["Isa 51:12"]}
      - {motif: god-alone-stretches-heavens, refs: ["Isa 51:13", "Isa 51:16"], note: "to plant the heavens and found the earth"}
      - {motif: god-stills-sea-smites-rahab, refs: ["Isa 51:15"], note: "same phrase as Job 26:12: roga' hayam, its waves roar"}
      - {motif: prophet-like-moses, refs: ["Isa 51:16"], note: "'I put my words in your mouth and covered you in the shadow of my hand'"}
      - {motif: cup-of-wrath, refs: ["Isa 51:17", "Isa 51:22"], note: "the goblet (qubba'at) of the cup of staggering, drained to the dregs"}
      - {motif: drunk-but-not-with-wine, refs: ["Isa 51:21"]}
      - {motif: cup-of-wrath-transferred-to-enemies, refs: ["Isa 51:22", "Isa 51:23"]}
      - {motif: back-made-a-street-for-conquerors, refs: ["Isa 51:23"]}
    hints:
      - "Cup of wrath recurs in Jer 25, Rev 14:10 and 16:19; compare Gethsemane 'let this cup pass' (Mark 14:36)."
  - id: hb-isa-52-awake-zion-herald
    tradition: judaism
    title: Awake, Zion; the feet of the herald
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Isa 52:1-12"]
    tags:
      - {motif: zion-puts-on-beautiful-garments, refs: ["Isa 52:1", "Isa 52:2"], note: "loose the bonds of your neck, captive daughter Zion"}
      - {motif: sold-for-nothing-redeemed-without-money, refs: ["Isa 52:3"]}
      - {motif: gods-name-blasphemed-among-nations, refs: ["Isa 52:5"]}
      - {motif: beautiful-feet-of-herald, refs: ["Isa 52:7"], note: "mevasser, mashmia' shalom ... 'your God reigns' (malakh elohayikh)"}
      - {motif: yhwh-malakh-proclamation, refs: ["Isa 52:7"]}
      - {motif: watchmen-see-god-return-to-zion, refs: ["Isa 52:8"]}
      - {motif: god-bares-his-holy-arm, refs: ["Isa 52:10"]}
      - {motif: go-out-from-babylon, refs: ["Isa 52:11"], note: "'touch nothing unclean ... purify yourselves, bearers of YHWH's vessels'"}
      - {motif: new-exodus-not-in-haste, refs: ["Isa 52:12"], note: "contrast hippazon of Exod 12:11"}
    hints:
      - "Rom 10:15 cites 52:7 for apostolic preaching; 2 Cor 6:17 cites 52:11; 'mevasser' underlies the Greek euangelion. Rom 2:24 cites 52:5."
  - id: hb-isa-53-suffering-servant
    tradition: judaism
    title: Fourth servant song - the suffering servant
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Isa 52:13-53:12"]
    tags:
      - {motif: servant-exalted-and-lifted-high, refs: ["Isa 52:13"], note: "yarum we-nissa we-gavah me'od, same verbs as the throne in Isa 6:1"}
      - {motif: servant-disfigured-beyond-human-form, refs: ["Isa 52:14"]}
      - {motif: servant-sprinkles-many-nations, refs: ["Isa 52:15"], note: "yazzeh, a cultic sprinkling verb; LXX 'many nations will marvel'"}
      - {motif: kings-bow-to-despised-servant, refs: ["Isa 52:15"], note: "kings shut their mouths at what they had not been told"}
      - {motif: who-has-believed-our-report, refs: ["Isa 53:1"]}
      - {motif: shoot-from-dry-ground, refs: ["Isa 53:2"], note: "yoneq, 'suckling/shoot', and shoresh from arid land"}
      - {motif: servant-without-form-or-beauty, refs: ["Isa 53:2"]}
      - {motif: despised-man-of-sorrows, refs: ["Isa 53:3"], note: "ish makh'ovot, yedua' holi"}
      - {motif: vicarious-suffering-of-servant, refs: ["Isa 53:4", "Isa 53:5", "Isa 53:6", "Isa 53:8", "Isa 53:11", "Isa 53:12"], note: "'by his bruise (havurato) there is healing for us'"}
      - {motif: thought-stricken-by-god, refs: ["Isa 53:4"]}
      - {motif: all-we-like-sheep-astray, refs: ["Isa 53:6"]}
      - {motif: silent-as-lamb-to-slaughter, refs: ["Isa 53:7"]}
      - {motif: servant-cut-off-from-land-of-living, refs: ["Isa 53:8"], note: "who will consider his generation (doro)?"}
      - {motif: grave-with-wicked-and-rich, refs: ["Isa 53:9"]}
      - {motif: servant-life-as-guilt-offering, refs: ["Isa 53:10"], note: "'im tasim asham nafsho"}
      - {motif: servant-sees-offspring-after-death, refs: ["Isa 53:10", "Isa 53:11"], note: "1QIsaa and LXX add 'light' in 53:11: 'he will see light'"}
      - {motif: servant-justifies-many, refs: ["Isa 53:11"]}
