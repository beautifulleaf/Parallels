new_motifs:
  # Psalms 106-150
  moses-stands-in-the-breach: {label: "Moses 'stood in the breach' (pérets) before God to turn back his wrath from destroying the people", cluster: exodus}
  exchanged-glory-for-ox-image: {label: "The people exchanged their Glory for the image of an ox that eats grass", cluster: exodus}
  craving-answered-with-wasting: {label: "God grants the people's wilderness craving but sends wasting (razon) into their souls", cluster: exodus}
  ate-sacrifices-of-the-dead: {label: "Israel ate 'sacrifices of the dead' (zivhei metim) at Baal-peor", cluster: cult}
  moses-rash-speech-at-meribah: {label: "Provoked at Meribah, Moses spoke rashly with his lips and suffered because of the people", cluster: exodus}
  zeal-reckoned-as-righteousness: {label: "Phinehas's intervention 'was reckoned to him as righteousness for all generations'", cluster: theology}
  captors-made-to-pity: {label: "God caused the exiles to be pitied by all their captors", cluster: history}
  four-rescued-groups-thanksgiving: {label: "Thanksgiving liturgy for four groups rescued by God: desert wanderers, prisoners, the sick, seafarers", cluster: psalmody}
  thank-yhwh-for-hesed-refrain: {label: "Refrain: 'Let them thank YHWH for his steadfast love and his wonders to the sons of man'", cluster: psalmody}
  sitting-in-darkness-and-deathshadow: {label: "Prisoners sit in darkness and the shadow of death (tsalmavet), bound in affliction and iron", cluster: afterlife}
  bronze-doors-iron-bars-shattered: {label: "God shatters doors of bronze and cuts through bars of iron", cluster: theology}
  god-sends-his-word-to-heal: {label: "God 'sent his word and healed them', the word acting as an agent", cluster: theology}
  storm-at-sea-stilled: {label: "God raises a storm that lifts ships to the heavens and down to the deeps, then hushes it to a whisper and brings sailors to harbor", cluster: cosmology}
  sailors-reel-like-drunkards: {label: "Storm-tossed sailors reel and stagger like drunkards and all their skill is swallowed up", cluster: imagery}
  rivers-to-desert-desert-to-pools: {label: "God turns rivers into desert and fruitful land into salt waste, and desert into pools of water", cluster: cosmology}
  accuser-at-right-hand-in-court: {label: "Curse: let a wicked man be appointed over him and an accuser (satan) stand at his right hand in judgment", cluster: divine-council}
  his-office-taken-by-another: {label: "Curse: 'let his days be few; let another take his office (pequddah)'", cluster: psalmody}
  curse-on-enemys-children-and-widow: {label: "Curse that the enemy's children be fatherless beggars, his wife a widow and his name blotted out in the next generation", cluster: psalmody}
  mothers-sin-not-blotted-out: {label: "Curse that the iniquity of his fathers be remembered and his mother's sin not be blotted out", cluster: psalmody}
  curse-worn-as-garment: {label: "The wicked loved cursing; let it clothe him like a garment, soak into him like water and like oil into his bones", cluster: magic}
  shaken-off-like-locust: {label: "Sufferer is shaken off like a locust", cluster: psalmody}
  god-stands-at-right-hand-of-needy: {label: "God stands at the right hand of the needy to save him from those who judge him", cluster: justice}
  sit-at-my-right-hand-footstool: {label: "Oracle 'YHWH says to my lord: sit at my right hand until I make your enemies your footstool'", cluster: messianism}
  scepter-sent-from-zion: {label: "God sends forth the king's mighty scepter from Zion: 'rule in the midst of your enemies'", cluster: kingship}
  dew-of-youth-from-womb-of-dawn: {label: "The king's youth (or begetting) is like dew from the womb of the dawn (mishhar)", cluster: messianism}
  priest-forever-order-of-melchizedek: {label: "God swears irrevocably: 'You are a priest forever after the order of Melchizedek'", cluster: messianism}
  king-drinks-from-brook-on-way: {label: "The victorious king drinks from the brook by the way and therefore lifts his head", cluster: kingship}
  fear-of-yhwh-beginning-of-wisdom: {label: "'The fear of YHWH is the beginning (reshit) of wisdom/knowledge'", cluster: wisdom}
  memorial-made-for-wonders: {label: "God 'made a memorial (zekher) for his wonders' and gave food to those who fear him", cluster: cult}
  light-dawns-in-darkness-for-upright: {label: "Light rises in the darkness for the upright", cluster: wisdom}
  righteous-scatters-gifts-to-poor: {label: "The righteous man lends graciously and scatters gifts to the poor; his righteousness endures forever and his horn is exalted", cluster: wisdom}
  wicked-gnash-teeth-and-melt-away: {label: "The wicked sees the righteous exalted, gnashes his teeth and melts away", cluster: wisdom}
  praised-from-sunrise-to-sunset: {label: "God's name is praised from the rising of the sun to its setting", cluster: universalism}
  god-enthroned-high-stoops-to-see: {label: "God sits enthroned on high yet stoops down to look on heaven and earth and regards the lowly", cluster: theology}
  poor-raised-from-dunghill-to-princes: {label: "God raises the poor from the dust and the needy from the dunghill to sit with princes", cluster: theology}
  barren-woman-made-joyful-mother: {label: "God settles the barren woman in her home as a joyful mother of children", cluster: childhood}
  egypt-people-of-strange-speech: {label: "Egypt called 'a people of strange speech' (am lo'ez)", cluster: exodus}
  sea-fled-jordan-turned-back: {label: "At the exodus the sea saw and fled and the Jordan turned back; the poet taunts them 'What ails you?'", cluster: exodus}
  mountains-skip-like-rams: {label: "Mountains skip like rams and hills like lambs before God", cluster: theophany}
  earth-writhes-before-lord: {label: "The earth is commanded to tremble/writhe (huli) before the Lord, the God of Jacob", cluster: theophany}
  rock-turned-to-pool-of-water: {label: "God turned the rock into a pool of water and flint into a spring", cluster: exodus}
  not-to-us-but-to-your-name: {label: "'Not to us, YHWH, not to us, but to your name give glory'", cluster: liturgy}
  idol-makers-become-like-idols: {label: "Those who make idols and trust in them become like them", cluster: polemic}
  israel-aaron-god-fearers-triad: {label: "Liturgical triad (or tetrad) addressing Israel, the house of Aaron, (the house of Levi) and those who fear YHWH", cluster: liturgy}
  heavens-for-yhwh-earth-for-humans: {label: "'The heavens are YHWH's heavens, but the earth he has given to the sons of man'", cluster: cosmology}
  maker-of-heaven-and-earth: {label: "God called 'maker of heaven and earth' ('oseh shamayim va-arets') in blessing or confession of help", cluster: creation}
  cup-of-salvation: {label: "The delivered speaker lifts 'the cup of salvations' and calls on YHWH's name", cluster: cult}
  precious-death-of-the-faithful: {label: "'Precious (costly) in the eyes of YHWH is the death of his faithful ones'", cluster: afterlife}
  all-men-are-liars: {label: "In alarm the speaker said 'All men are liars'", cluster: wisdom}
  return-my-soul-to-rest: {label: "Speaker bids his soul return to its rest because God has dealt bountifully", cluster: psalmody}
  shortest-psalm: {label: "The shortest psalm (and shortest chapter of the Bible), two verses", cluster: psalmody}
  better-trust-god-than-princes: {label: "It is better to take refuge in YHWH than to trust in man or in princes", cluster: wisdom}
  surrounded-by-nations-cut-off-in-gods-name: {label: "All nations surround the speaker like bees, but in YHWH's name he cuts them off", cluster: warfare}
  song-of-sea-quoted: {label: "A psalm quotes the Song of the Sea: 'Yah is my strength and song and has become my salvation'", cluster: exodus}
  i-shall-not-die-but-live: {label: "'I shall not die but live and declare the works of Yah'; chastened but not given over to death", cluster: afterlife}
  gates-of-righteousness: {label: "'Open to me the gates of righteousness'; 'this is the gate of YHWH, the righteous enter through it'", cluster: cult}
  rejected-stone-becomes-cornerstone: {label: "'The stone the builders rejected has become the head of the corner'", cluster: messianism}
  this-is-the-day-yhwh-made: {label: "'This is the day YHWH has made; let us rejoice and be glad in it'", cluster: liturgy}
  hosanna-save-now: {label: "Cry 'Ana YHWH hoshi'a na' (Please, YHWH, save now = hosanna)", cluster: liturgy}
  blessed-is-he-who-comes-in-name: {label: "'Blessed is he who comes in the name of YHWH; we bless you from the house of YHWH'", cluster: liturgy}
  festal-sacrifice-bound-to-altar-horns: {label: "'Bind the festal offering with cords up to the horns of the altar'", cluster: cult}
  torah-psalm-eightfold-acrostic: {label: "Psalm in 22 stanzas of eight lines, every line of a stanza beginning with the same letter, each line naming the Torah", cluster: psalmody}
  synonyms-for-torah: {label: "Torah praised under a fixed set of synonyms (torah, edut, piqqudim, huqqim, mitsvot, mishpatim, davar, imrah)", cluster: law}
  sojourner-on-earth: {label: "Speaker calls himself a stranger (ger) on the earth", cluster: wisdom}
  open-my-eyes-to-wonders-of-torah: {label: "Prayer 'Open my eyes that I may behold wonders out of your Torah'", cluster: law}
  torah-as-delight: {label: "God's commandments or Torah are the speaker's delight (sha'ashu'im)", cluster: law}
  rise-at-midnight-to-praise: {label: "Speaker rises at midnight to give thanks to God", cluster: liturgy}
  affliction-good-for-learning: {label: "'It is good for me that I was afflicted, so that I might learn your statutes'", cluster: wisdom}
  torah-better-than-gold-and-silver: {label: "God's Torah or commandments are better than thousands of gold and silver pieces, above fine gold", cluster: law}
  heart-gross-as-fat: {label: "The arrogant have hearts gross (unfeeling) as fat", cluster: imagery}
  wineskin-in-the-smoke: {label: "Speaker has become like a wineskin in the smoke (shriveled)", cluster: imagery}
  word-fixed-in-heaven-forever: {label: "'Forever, YHWH, your word stands firm in the heavens'; all things are his servants", cluster: cosmology}
  wiser-than-teachers-and-elders: {label: "Through Torah the speaker is wiser than his enemies, all his teachers and the elders", cluster: wisdom}
  lamp-to-my-feet: {label: "'Your word is a lamp to my feet and a light to my path'", cluster: law}
  time-to-act-for-yhwh: {label: "'It is time to act for YHWH; they have made void your Torah' (later read as license for emergency measures)", cluster: law}
  rivers-of-tears-for-lawbreakers: {label: "Speaker's eyes shed streams of water because people do not keep God's Torah", cluster: psalmody}
  sevenfold-daily-praise: {label: "'Seven times a day I praise you'", cluster: liturgy}
  prayer-before-dawn: {label: "Speaker rises before dawn (neshef) and anticipates the night watches to cry out and meditate", cluster: liturgy}
  lost-sheep-sought: {label: "Speaker strays like a lost sheep and asks God to seek his servant", cluster: imagery}
  song-of-ascents-heading: {label: "Superscription 'A song of ascents' (shir ha-ma'alot), Ps 120-134", cluster: psalmody}
  broom-tree-coals: {label: "Punishment of the lying tongue: a warrior's sharp arrows with glowing coals of broom (rotem)", cluster: imagery}
  exile-among-meshech-and-kedar: {label: "Speaker laments sojourning in Meshech and dwelling among the tents of Kedar, among haters of peace", cluster: geography}
  i-am-for-peace-they-for-war: {label: "'I am for peace, but when I speak they are for war'", cluster: psalmody}
  lift-eyes-to-the-mountains: {label: "'I lift my eyes to the mountains: from where will my help come?'", cluster: psalmody}
  guardian-of-israel-never-sleeps: {label: "The guardian of Israel neither slumbers nor sleeps", cluster: theology}
  sun-and-moon-shall-not-strike: {label: "God as shade: the sun shall not strike you by day nor the moon by night", cluster: magic}
  going-out-and-coming-in-guarded: {label: "God will guard your going out and your coming in from now and forever", cluster: liturgy}
  pilgrim-joy-at-house-of-yhwh: {label: "Pilgrim rejoices: 'Let us go to the house of YHWH'; feet stand within Jerusalem's gates", cluster: zion}
  jerusalem-city-bound-together: {label: "Jerusalem built 'as a city that is joined together' (shehubberah lah yahdav)", cluster: zion}
  thrones-of-judgment-of-house-of-david: {label: "In Jerusalem stand thrones for judgment, thrones of the house of David", cluster: kingship}
  pray-for-peace-of-jerusalem: {label: "'Pray for the peace of Jerusalem: may those who love you prosper'", cluster: zion}
  eyes-of-servants-to-masters-hand: {label: "As the eyes of slaves look to their master's hand and a maid's to her mistress, so our eyes to God", cluster: imagery}
  if-not-for-yhwh-refrain: {label: "Refrain 'If it had not been YHWH who was for us, let Israel say...'", cluster: psalmody}
  swallowed-alive-by-enemies: {label: "Enemies would have swallowed us alive", cluster: afterlife}
  waters-swept-over-us: {label: "Raging (arrogant) waters and torrent would have swept over our soul", cluster: cosmology}
  soul-escaped-like-bird-from-snare: {label: "'Our soul escaped like a bird from the fowler's snare; the snare broke and we escaped'", cluster: imagery}
  trust-like-mount-zion-unshaken: {label: "Those who trust in YHWH are like Mount Zion, which cannot be moved", cluster: zion}
  mountains-round-jerusalem-god-round-people: {label: "As the mountains surround Jerusalem, so YHWH surrounds his people", cluster: zion}
  scepter-of-wicked-not-on-lot-of-righteous: {label: "The scepter of wickedness will not rest on the allotment of the righteous, lest they stretch their hands to wrong", cluster: wisdom}
  peace-upon-israel-formula: {label: "Closing benediction 'Peace upon Israel' (shalom al yisra'el)", cluster: liturgy}
  return-to-zion-like-dreamers: {label: "When YHWH restored Zion's fortunes, 'we were like dreamers', mouths filled with laughter", cluster: zion}
  streams-in-the-negev: {label: "Prayer to restore fortunes like streams (wadis) in the Negev", cluster: fertility}
  sow-in-tears-reap-in-joy: {label: "Those who sow in tears will reap with songs of joy, returning with sheaves", cluster: fertility}
  unless-yhwh-builds-the-house: {label: "'Unless YHWH builds the house, its builders labor in vain; unless YHWH guards the city, the watchman wakes in vain'", cluster: wisdom}
  god-gives-sleep-to-his-beloved: {label: "Rising early and toiling is vain; God gives (in) sleep to his beloved (yedido)", cluster: wisdom}
  sons-as-arrows-in-quiver: {label: "Sons are a heritage from YHWH, like arrows in a warrior's hand; happy the man whose quiver is full", cluster: childhood}
  speak-with-enemies-in-the-gate: {label: "Sons of one's youth will not be put to shame when they speak with enemies in the gate", cluster: law}
  wife-as-vine-children-as-olive-shoots: {label: "Your wife a fruitful vine in the recesses of your house, your children like olive shoots around your table", cluster: imagery}
  see-childrens-children: {label: "Blessing: may you see your children's children", cluster: childhood}
  plowers-plowed-upon-my-back: {label: "Israel: 'Plowers plowed upon my back; they made long their furrows'", cluster: imagery}
  god-cuts-cords-of-wicked: {label: "YHWH the righteous cuts the cords (avot) of the wicked", cluster: theology}
  grass-on-rooftops-withers: {label: "Enemies become like grass on the housetops that withers before it is pulled, filling no reaper's hand", cluster: imagery}
  harvest-blessing-greeting-withheld: {label: "Passers-by will not say 'The blessing of YHWH be upon you; we bless you in YHWH's name' (harvest greeting)", cluster: fertility}
  out-of-the-depths: {label: "'Out of the depths (ma'amaqqim) I cry to you, YHWH' (De profundis)", cluster: psalmody}
  if-you-kept-iniquities-who-could-stand: {label: "'If you, Yah, kept account of iniquities, Lord, who could stand?' Forgiveness is with God that he may be feared", cluster: theology}
  waiting-more-than-watchmen-for-morning: {label: "The soul waits for the Lord more than watchmen for the morning", cluster: imagery}
  redemption-from-all-iniquities: {label: "God will redeem Israel from all its iniquities; with him is plentiful redemption", cluster: theology}
  soul-like-weaned-child: {label: "Speaker has calmed his soul like a weaned child with its mother", cluster: imagery}
  not-meddling-with-things-too-wonderful: {label: "Humble speaker does not occupy himself with great things or wonders too high for him", cluster: wisdom}
  davids-vow-no-sleep-until-gods-place: {label: "David vowed to the Mighty One of Jacob not to enter his house or sleep until he found a place for YHWH", cluster: kingship}
  ark-found-in-fields-of-jaar: {label: "'We heard of it in Ephrathah, we found it in the fields of Ya'ar' (the ark at Kiriath-jearim)", cluster: cult}
  priests-clothed-in-righteousness: {label: "God's priests are clothed in righteousness or salvation and his faithful shout for joy", cluster: cult}
  oath-to-david-heir-on-throne: {label: "God swore to David: 'of the fruit of your body I will set on your throne', conditional on the sons keeping the covenant", cluster: kingship}
  zion-chosen-as-gods-resting-place: {label: "God chose Zion and desired it for his seat: 'This is my resting place forever'", cluster: zion}
  horn-sprouts-for-david-lamp-for-anointed: {label: "In Zion God will make a horn sprout for David and has prepared a lamp for his anointed; his crown (nezer) will blossom", cluster: messianism}
  brothers-dwell-together-in-unity: {label: "'How good and pleasant when brothers dwell together in unity'", cluster: wisdom}
  oil-running-down-aarons-beard: {label: "Unity likened to the fine oil on the head running down the beard of Aaron onto the collar of his robes", cluster: cult}
  dew-of-hermon-on-zion: {label: "Like the dew of Hermon descending on the mountains of Zion, where God commanded blessing, life forever", cluster: fertility}
  night-service-in-temple: {label: "Servants of YHWH who stand in the house of YHWH by night are called to bless him", cluster: cult}
  god-does-whatever-he-pleases: {label: "Whatever YHWH pleases he does, in heaven, on earth, in the seas and all the deeps", cluster: theology}
  wind-from-storehouses: {label: "God brings up clouds from the end of the earth, makes lightning for the rain and brings the wind out of his storehouses", cluster: cosmology}
  egyptian-firstborn-struck: {label: "God struck the firstborn of Egypt, of man and beast", cluster: exodus}
  antiphonal-refrain-every-verse: {label: "Every verse ends with the same response ('for his steadfast love is forever'), an antiphonal litany", cluster: psalmody}
  earth-spread-out-on-waters: {label: "God spread out (roqa') the earth upon the waters", cluster: creation}
  great-lights-rule-day-and-night: {label: "God made the great lights: the sun to rule the day, the moon and stars to rule the night", cluster: creation}
  red-sea-cut-into-parts: {label: "God cut the Sea of Reeds into parts (gozer ... lig'zarim) and led Israel through its midst", cluster: exodus}
  god-gives-bread-to-all-flesh: {label: "God gives bread to all flesh", cluster: theology}
  by-rivers-of-babylon-weeping: {label: "Exiles sit and weep by the rivers of Babylon remembering Zion", cluster: exile}
  harps-hung-on-willows: {label: "Exiles hang their lyres on the willows (poplars) in Babylon", cluster: exile}
  captors-demand-songs-of-zion: {label: "Captors demand 'Sing us one of the songs of Zion'; 'How can we sing YHWH's song on foreign soil?'", cluster: exile}
  oath-if-i-forget-jerusalem: {label: "Self-curse: 'If I forget you, Jerusalem, let my right hand forget; let my tongue cleave to my palate'", cluster: zion}
  edom-cried-raze-it: {label: "Edomites cried on Jerusalem's day 'Raze it, raze it, to its foundation'", cluster: history}
  infants-dashed-against-rock: {label: "Blessing on whoever seizes the enemy's (Babylon's) little ones and dashes them against the rock", cluster: warfare}
  praise-before-the-gods: {label: "Speaker sings God's praise 'before the gods' (neged elohim)", cluster: divine-council}
  bow-toward-holy-temple: {label: "Speaker bows down toward God's holy temple (direction of prayer)", cluster: liturgy}
  kings-of-earth-praise-god: {label: "All kings of the earth will praise YHWH when they hear the words of his mouth", cluster: universalism}
  god-searches-and-knows-me: {label: "'YHWH, you have searched me and known me': God knows sitting and rising, thoughts from afar, every word before it is spoken", cluster: theology}
  inescapable-presence-heaven-to-sheol: {label: "Nowhere to flee God's spirit: if I ascend to heaven you are there, if I make my bed in Sheol you are there", cluster: theology}
  wings-of-the-dawn: {label: "'If I take the wings of the dawn (shahar) and dwell at the far end of the sea, even there your hand leads me'", cluster: cosmology}
  darkness-is-as-light-to-god: {label: "Darkness is not dark to God; night shines like day, darkness and light are alike", cluster: theology}
  knit-together-in-mothers-womb: {label: "God formed the kidneys and wove (knit) the speaker in his mother's womb", cluster: creation}
  embryo-woven-in-depths-of-earth: {label: "Speaker was made in secret and embroidered (ruqqamti) in the depths of the earth", cluster: creation}
  golem-seen-days-written-in-book: {label: "God's eyes saw the speaker's unformed substance (golem); all his days were written in God's book before one of them existed", cluster: fate}
  perfect-hatred-of-gods-enemies: {label: "'Do I not hate those who hate you, YHWH? I hate them with perfect hatred'", cluster: psalmody}
  search-me-and-test-my-heart: {label: "'Search me, God, and know my heart; test me and know my thoughts; lead me in the everlasting way'", cluster: psalmody}
  tongue-like-serpent-venom-of-viper: {label: "The wicked sharpen their tongues like a serpent; viper's venom is under their lips", cluster: imagery}
  hidden-snare-net-and-traps: {label: "The proud hide a snare, spread cords as a net and set traps beside the path", cluster: imagery}
  burning-coals-fall-on-wicked: {label: "Curse: let burning coals fall on them, let them be cast into fire and into pits never to rise", cluster: judgment}
  god-covers-head-in-day-of-battle: {label: "God covered the speaker's head in the day of battle (weapons)", cluster: warfare}
  prayer-as-incense-evening-offering: {label: "'Let my prayer be set before you as incense, the lifting of my hands as the evening offering'", cluster: liturgy}
  guard-set-over-mouth: {label: "'Set a guard, YHWH, over my mouth; keep watch over the door of my lips'", cluster: wisdom}
  rebuke-of-righteous-as-oil: {label: "Let the righteous strike and rebuke me in kindness; it is oil on the head", cluster: wisdom}
  bones-scattered-at-mouth-of-sheol: {label: "'As when one plows and breaks up the earth, our bones are scattered at the mouth of Sheol'", cluster: afterlife}
  judges-thrown-from-the-cliff: {label: "Their judges are thrown down by the sides of the rock (cliff)", cluster: judgment}
  no-one-cares-for-my-soul: {label: "Speaker looks to the right and sees no one who knows him; no refuge, no one cares for his soul", cluster: psalmody}
  soul-brought-out-of-prison: {label: "Prayer 'Bring my soul out of prison (masger) that I may praise your name'", cluster: psalmody}
  no-living-being-righteous-before-god: {label: "'Enter not into judgment with your servant, for no living being is righteous before you'", cluster: theology}
  dwelling-in-darkness-like-long-dead: {label: "The enemy made the speaker dwell in darkness like those long dead (metei olam)", cluster: afterlife}
  gods-good-spirit-leads: {label: "'Your good spirit will lead me on level ground'; prayer to be taught to do God's will", cluster: theology}
  god-trains-hands-for-war: {label: "God trains the speaker's hands for battle and fingers for war", cluster: warfare}
  bow-heavens-and-come-down: {label: "'Bow your heavens, YHWH, and come down; touch the mountains that they smoke'", cluster: theophany}
  rescue-from-hand-of-foreigners: {label: "Refrain: deliver me from many waters, from the hand of foreigners whose mouth speaks falsehood and whose right hand is a right hand of lies", cluster: psalmody}
  daughters-like-carved-corner-pillars: {label: "Sons like well-grown plants, daughters like corner pillars carved for a palace (temple)", cluster: imagery}
  happy-the-people-whose-god-is-yhwh: {label: "'Happy the people for whom it is so; happy the people whose God is YHWH' after a picture of prosperity", cluster: wisdom}
  god-near-to-all-who-call: {label: "YHWH is near to all who call on him in truth", cluster: theology}
  god-upholds-falling-raises-bowed: {label: "YHWH upholds all who fall and raises up all who are bowed down", cluster: theology}
  everlasting-kingdom-of-god: {label: "'Your kingdom is a kingdom of all ages and your dominion through all generations'", cluster: kingship}
  thoughts-perish-on-day-of-death: {label: "When man's breath departs he returns to his earth; on that day his plans perish", cluster: afterlife}
  god-frees-prisoners-opens-blind-eyes: {label: "YHWH frees the prisoners, opens the eyes of the blind, raises the bowed, loves the righteous", cluster: justice}
  god-heals-brokenhearted: {label: "God heals the brokenhearted and binds up their wounds", cluster: theology}
  god-counts-and-names-stars: {label: "God counts the number of the stars and calls them all by name", cluster: cosmology}
  god-feeds-young-ravens: {label: "God gives the beasts their food and to the young ravens when they cry", cluster: theology}
  god-not-pleased-by-horse-or-legs: {label: "God takes no delight in the strength of the horse nor pleasure in the legs of a man", cluster: wisdom}
  word-runs-swiftly-snow-and-ice: {label: "God's word runs swiftly; he gives snow like wool, scatters frost like ashes, casts his ice like crumbs; his word melts them", cluster: cosmology}
  law-given-only-to-israel: {label: "God declared his statutes to Jacob; he has not done so for any other nation", cluster: law}
  angels-and-hosts-summoned-to-praise: {label: "God's angels and all his hosts are summoned to praise him from the heights", cluster: angelology}
  luminaries-summoned-to-praise: {label: "Sun, moon and shining stars are summoned to praise God", cluster: cosmology}
  waters-above-the-heavens: {label: "'The waters above the heavens' are summoned to praise", cluster: cosmology}
  created-by-command-fixed-decree: {label: "God commanded and they were created; he established them forever with a decree (hoq) that will not pass", cluster: creation}
  sea-monsters-and-deeps-praise: {label: "Sea monsters (tanninim) and all deeps are summoned to praise God from the earth", cluster: cosmology}
  weather-does-his-word: {label: "Fire and hail, snow and smoke, stormy wind fulfilling his word", cluster: cosmology}
  all-ranks-of-humanity-praise: {label: "Kings and peoples, princes and judges, young men and maidens, old and young together praise God", cluster: universalism}
  praise-with-dance-and-timbrel: {label: "God's name praised with dance (mahol), timbrel and lyre", cluster: liturgy}
  faithful-sing-on-their-beds: {label: "The faithful exult in glory and sing for joy on their beds", cluster: liturgy}
  two-edged-sword-in-hand-of-faithful: {label: "The faithful have God's praises in their throats and a two-edged sword in their hand to take vengeance on the nations", cluster: warfare}
  kings-bound-in-chains: {label: "Kings bound with chains and nobles with fetters of iron to execute 'the judgment written'", cluster: judgment}
  praise-in-firmament: {label: "God praised in his sanctuary and in the firmament (raqia) of his might", cluster: cosmology}
  orchestra-of-praise: {label: "Catalogue of instruments for praise: shofar, harp, lyre, timbrel, dance, strings, pipe (ugav), sounding and clashing cymbals", cluster: liturgy}
  everything-that-breathes-praise: {label: "'Let everything that has breath (neshamah) praise Yah'", cluster: universalism}
  # Proverbs 1-8
  proverbs-of-solomon-title: {label: "Collection titled 'Proverbs of Solomon son of David, king of Israel'", cluster: wisdom}
  wisdom-book-purpose-prologue: {label: "Prologue states a book's purpose: to give the simple shrewdness, the young knowledge, and the wise more learning, to understand proverbs and riddles", cluster: wisdom}
  fathers-instruction-mothers-torah: {label: "'Hear, my son, your father's instruction and do not forsake your mother's teaching (torah)'", cluster: wisdom}
  teaching-as-garland-and-necklace: {label: "Parental teaching or wisdom is a graceful garland for the head and necklace for the neck", cluster: wisdom}
  gang-of-robbers-entices-youth: {label: "Sinners entice the youth to ambush the innocent, share one purse and fill houses with plunder", cluster: wisdom}
  net-spread-before-bird-in-vain: {label: "'In vain is the net spread in the sight of any bird'; the ambushers lie in wait for their own blood", cluster: wisdom}
  greed-takes-life-of-its-owner: {label: "Ill-gotten gain takes away the life of its possessors", cluster: wisdom}
  wisdom-personified-as-woman: {label: "Wisdom (hokhmah) personified as a woman who speaks in the first person", cluster: wisdom}
  wisdom-cries-in-street-and-gates: {label: "Lady Wisdom cries aloud in the streets, at the head of the crossroads, at the city gates and on the heights", cluster: wisdom}
  wisdom-pours-out-her-spirit: {label: "Wisdom promises to pour out her spirit (ruhi) and make her words known to those who turn", cluster: wisdom}
  wisdom-laughs-at-calamity-of-scorners: {label: "Rejected Wisdom will laugh at the scorners' calamity and mock when terror comes like a storm", cluster: wisdom}
  too-late-they-seek-and-do-not-find: {label: "When disaster comes they will call on Wisdom and she will not answer; they will seek her and not find her", cluster: wisdom}
  eat-the-fruit-of-their-own-way: {label: "The fools eat the fruit of their own way and are sated with their own devices", cluster: wisdom}
  seek-wisdom-like-hidden-treasure: {label: "Seek wisdom like silver and search for her as for hidden treasures", cluster: wisdom}
  god-gives-wisdom-from-his-mouth: {label: "YHWH gives wisdom; from his mouth come knowledge and understanding", cluster: wisdom}
  strange-woman-warning: {label: "Warning against the 'strange woman' (ishah zarah / nokhriyyah) with smooth words", cluster: wisdom}
  strange-woman-forsakes-covenant: {label: "The strange woman forsakes the companion of her youth and forgets the covenant of her God", cluster: wisdom}
  her-house-leads-to-death-and-rephaim: {label: "The strange woman's house sinks down to death, her paths to the Rephaim; her ways go down to Sheol, to the chambers of death", cluster: afterlife}
  none-who-go-to-her-return: {label: "None who go to the strange woman return or regain the paths of life", cluster: afterlife}
  upright-inhabit-land-wicked-cut-off: {label: "The upright will inhabit the land and the wicked be cut off and uprooted from it", cluster: wisdom}
  write-on-tablet-of-heart: {label: "Bind the teachings around your neck (or fingers) and write them on the tablet of your heart", cluster: wisdom}
  trust-god-not-own-understanding: {label: "'Trust in YHWH with all your heart and do not lean on your own understanding'; do not be wise in your own eyes", cluster: wisdom}
  wisdom-brings-long-life: {label: "Keeping the teaching brings length of days, years of life and peace", cluster: wisdom}
  honor-god-with-firstfruits-barns-full: {label: "Honor YHWH with your wealth and firstfruits; your barns will be filled and vats burst with new wine", cluster: cult}
  wisdom-long-life-right-riches-left: {label: "Wisdom holds length of days in her right hand, riches and honor in her left", cluster: wisdom}
  wisdom-is-tree-of-life: {label: "Wisdom 'is a tree of life to those who grasp her'", cluster: wisdom}
  deeps-split-clouds-drip-dew-by-knowledge: {label: "By God's knowledge the deeps were split open and the clouds drip dew", cluster: creation}
  sleep-sweetly-without-fear: {label: "The one who keeps wisdom lies down without fear; his sleep is sweet; he need not fear sudden terror", cluster: wisdom}
  do-not-withhold-good-till-tomorrow: {label: "Do not withhold good from its owner or tell your neighbor 'Go and come back tomorrow' when you have it", cluster: ethics}
  god-scorns-scorners-gives-grace-to-humble: {label: "God scorns the scorners but gives grace to the humble", cluster: wisdom}
  three-generations-of-teaching: {label: "Teacher recalls being a tender only son taught by his own father, passing the teaching to his sons", cluster: wisdom}
  acquire-wisdom-above-all: {label: "'The beginning of wisdom: acquire wisdom; with all you have acquired, acquire understanding'", cluster: wisdom}
  wisdom-as-beloved-gives-crown: {label: "Love Wisdom and embrace her; she will exalt you and set on your head a garland and a crown of glory", cluster: wisdom}
  path-of-righteous-like-dawn: {label: "The path of the righteous is like the light of dawn growing brighter to full day; the way of the wicked is deep darkness", cluster: wisdom}
  bread-of-wickedness-wine-of-violence: {label: "The wicked cannot sleep unless they do evil; they eat the bread of wickedness and drink the wine of violence", cluster: wisdom}
  guard-heart-wellspring-of-life: {label: "Guard your heart above all, for from it are the issues (springs) of life", cluster: wisdom}
  lips-drip-honey-end-bitter-wormwood: {label: "The strange woman's lips drip honey and her palate is smoother than oil, but her end is bitter as wormwood, sharp as a two-edged sword", cluster: wisdom}
  drink-from-your-own-cistern: {label: "Drink water from your own cistern and running water from your own well; let your springs not be scattered abroad (marital fidelity)", cluster: wisdom}
  wife-as-loving-doe: {label: "The wife of one's youth as a loving doe and graceful mountain goat whose breasts satisfy always", cluster: wisdom}
  god-weighs-all-paths: {label: "A man's ways are before YHWH's eyes and he weighs (levels) all his paths", cluster: theology}
  wicked-caught-in-cords-of-own-sin: {label: "The wicked is caught by his own iniquities and held fast by the cords of his sin", cluster: wisdom}
  surety-for-neighbor-warning: {label: "Warning against striking hands as surety for a neighbor or stranger; free yourself without sleep like a gazelle from the hunter", cluster: wisdom}
  go-to-the-ant-sluggard: {label: "'Go to the ant, sluggard': without chief or ruler she stores food in summer and harvest", cluster: wisdom}
  poverty-comes-like-robber: {label: "'A little sleep, a little slumber, a little folding of the hands', and poverty comes like a vagabond, want like an armed man", cluster: wisdom}
  scoundrel-winks-and-signals: {label: "The worthless man (adam beliyya'al) winks with his eyes, scrapes with his feet and points with his fingers, sowing discord", cluster: magic}
  six-seven-things-god-hates: {label: "Six things YHWH hates, seven an abomination: haughty eyes, lying tongue, hands shedding innocent blood, scheming heart, feet running to evil, false witness, sower of discord", cluster: wisdom}
  teaching-guides-walking-lying-waking: {label: "When you walk it will lead you, when you lie down it will watch over you, when you wake it will talk with you", cluster: wisdom}
  commandment-lamp-torah-light: {label: "'The commandment is a lamp and the teaching (torah) is light; reproofs of discipline are the way of life'", cluster: law}
  harlot-for-a-loaf-adulteress-hunts-life: {label: "A prostitute costs a loaf of bread, but another man's wife hunts the precious life", cluster: wisdom}
  fire-in-bosom-coals-under-feet: {label: "Can a man carry fire in his bosom and his clothes not burn, or walk on coals and his feet not be scorched? So is adultery", cluster: wisdom}
  thief-repays-sevenfold: {label: "A starving thief is not despised, yet when caught he repays sevenfold, giving all the wealth of his house", cluster: law}
  jealous-husband-refuses-ransom: {label: "The jealous husband shows no mercy on the day of vengeance and will accept no ransom (kofer) or bribe for adultery", cluster: law}
  torah-as-apple-of-eye: {label: "Keep my teaching as the pupil (ishon) of your eye", cluster: wisdom}
  call-wisdom-your-sister: {label: "'Say to Wisdom: You are my sister; call Understanding your kinswoman'", cluster: wisdom}
  observer-at-window-lattice: {label: "The teacher looks out through the lattice of his window and sees a youth lacking sense", cluster: wisdom}
  seductress-lurks-at-corners-at-twilight: {label: "At twilight, in the pupil of the night, a woman in harlot's garb lurks at every corner, seizes and kisses the youth", cluster: wisdom}
  seductress-has-paid-vows: {label: "The seductress says she has offered peace offerings and paid her vows today (so has sacrificial meat)", cluster: cult}
  bed-perfumed-myrrh-aloes-cinnamon: {label: "Her bed spread with colored Egyptian linen and perfumed with myrrh, aloes and cinnamon", cluster: wisdom}
  husband-away-until-full-moon: {label: "'The man is not at home; he took a bag of silver and will come home at the full moon (keseh)'", cluster: wisdom}
  youth-like-ox-to-slaughter: {label: "The youth follows her like an ox to the slaughter, a fool to the stocks, a bird hastening into the snare, till an arrow pierces his liver", cluster: wisdom}
  her-slain-are-many: {label: "Many are the slain she has cast down; numerous all her killed", cluster: wisdom}
  wisdom-better-than-silver-gold-pearls: {label: "Wisdom's instruction is better than silver, gold and pearls; nothing desirable compares with her", cluster: wisdom}
  wisdom-dwells-with-prudence: {label: "'I, Wisdom, dwell with prudence and find knowledge and discretion; counsel and strength are mine'", cluster: wisdom}
  by-wisdom-kings-reign: {label: "'By me kings reign and rulers decree justice; by me princes rule'", cluster: kingship}
  wisdom-loves-those-who-love-her: {label: "'I love those who love me, and those who seek me diligently find me'", cluster: wisdom}
  wisdom-endows-lovers-with-wealth: {label: "Wisdom walks in paths of justice to endow those who love her with substance and fill their treasuries", cluster: wisdom}
  wisdom-acquired-first-of-gods-way: {label: "'YHWH acquired (or created, qanani) me as the beginning (reshit) of his way, the first of his works of old'", cluster: creation}
  wisdom-installed-from-eternity: {label: "Wisdom was 'installed' or 'woven' (nissakhti) from eternity, from the beginning, before the earth", cluster: creation}
  wisdom-born-before-creation: {label: "Wisdom was brought forth (holalti, 'born in travail') when there were no deeps or springs, before mountains were sunk and hills existed", cluster: creation}
  wisdom-present-at-creation: {label: "Wisdom was present when God established the heavens, drew the circle on the deep, fixed the clouds, set the sea's limit and marked earth's foundations", cluster: creation}
  wisdom-as-amon-beside-god: {label: "Wisdom was beside God as an 'amon' (master craftsman, or nursling/child)", cluster: creation}
  wisdom-plays-before-god: {label: "Wisdom was God's delight day by day, playing (mesaheqet) before him always, playing in his inhabited world", cluster: creation}
  wisdom-delights-in-humans: {label: "Wisdom's delight was with the sons of man (benei adam)", cluster: creation}
  watching-daily-at-wisdoms-doors: {label: "Happy the man who watches daily at Wisdom's doors, waiting at the posts (mezuzot) of her entrance", cluster: wisdom}
  who-finds-wisdom-finds-life: {label: "'Whoever finds me finds life and obtains favor from YHWH; all who hate me love death'", cluster: wisdom}
units:
  - id: hb-ps-106-national-confession
    tradition: judaism
    title: Psalm 106, national confession of sins from Egypt to exile
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Ps 106:1-48"]
    tags:
      - {motif: hallelujah-formula, refs: ["Ps 106:1", "Ps 106:48"]}
      - {motif: hodu-ki-tov-refrain, refs: ["Ps 106:1"]}
      - {motif: historical-recital-psalm, refs: ["Ps 106:7-46"], note: "History told as a list of sins, not of wonders"}
      - {motif: penitential-confession, refs: ["Ps 106:6"], note: "'We have sinned with our fathers'"}
      - {motif: sea-turned-to-dry-land, refs: ["Ps 106:9"], note: "God rebukes (yig'ar) the Sea of Reeds and it dries; led through the deeps as through a desert"}
      - {motif: craving-answered-with-wasting, refs: ["Ps 106:14-15"]}
      - {motif: earth-swallows-rebels, refs: ["Ps 106:17-18"], note: "Dathan and Abiram named, Korah omitted; fire burns their company"}
      - {motif: golden-calf, refs: ["Ps 106:19-20"], note: "Located at Horeb"}
      - {motif: exchanged-glory-for-ox-image, refs: ["Ps 106:20"], note: "Tiqqun soferim tradition: originally 'my/his glory'; cf. Rom 1:23"}
      - {motif: egypt-called-ham, refs: ["Ps 106:22"]}
      - {motif: moses-stands-in-the-breach, refs: ["Ps 106:23"]}
      - {motif: baal-peor, refs: ["Ps 106:28"]}
      - {motif: ate-sacrifices-of-the-dead, refs: ["Ps 106:28"]}
      - {motif: intercession-stops-plague, refs: ["Ps 106:30"], note: "Phinehas 'yefallel' (interceded / executed judgment) and the plague was stayed"}
      - {motif: zeal-reckoned-as-righteousness, refs: ["Ps 106:31"], note: "Same formula as Gen 15:6 for Abraham's faith"}
      - {motif: faith-reckoned-as-righteousness, refs: ["Ps 106:31"], note: "Formula reused for an act of zeal"}
      - {motif: waters-of-meribah, refs: ["Ps 106:32"]}
      - {motif: moses-rash-speech-at-meribah, refs: ["Ps 106:32-33"]}
      - {motif: sacrifice-to-shedim-demons, refs: ["Ps 106:37"]}
      - {motif: child-passed-to-molech, refs: ["Ps 106:37-38"], note: "Sons and daughters sacrificed to the idols of Canaan"}
      - {motif: bloodshed-pollutes-land, refs: ["Ps 106:38"]}
      - {motif: idolatry-as-harlotry, refs: ["Ps 106:39"]}
      - {motif: repentance-relapse-cycle, refs: ["Ps 106:40-46"]}
      - {motif: captors-made-to-pity, refs: ["Ps 106:46"]}
      - {motif: ingathering-of-exiles, refs: ["Ps 106:47"]}
      - {motif: book-closing-doxology, refs: ["Ps 106:48"], note: "Closes Book IV; 'and let all the people say Amen'"}
    hints:
      - "Ps 106:47-48 is quoted in 1Chr 16:35-36. Compare Acts 7 (Stephen's sin-history) and Neh 9."
      - "Rom 1:23 echoes 106:20 (glory exchanged for an image)."

  - id: hb-ps-107-four-rescues
    tradition: judaism
    title: Psalm 107, thanksgiving of the redeemed (wanderers, prisoners, sick, seafarers)
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Ps 107:1-43"]
    tags:
      - {motif: hodu-ki-tov-refrain, refs: ["Ps 107:1"]}
      - {motif: ingathering-of-exiles, refs: ["Ps 107:2-3"], note: "Gathered from east, west, north and the sea (yam)"}
      - {motif: four-rescued-groups-thanksgiving, refs: ["Ps 107:4-9", "Ps 107:10-16", "Ps 107:17-22", "Ps 107:23-32"]}
      - {motif: thank-yhwh-for-hesed-refrain, refs: ["Ps 107:8", "Ps 107:15", "Ps 107:21", "Ps 107:31"]}
      - {motif: sitting-in-darkness-and-deathshadow, refs: ["Ps 107:10", "Ps 107:14"]}
      - {motif: bronze-doors-iron-bars-shattered, refs: ["Ps 107:16"]}
      - {motif: gates-of-death, refs: ["Ps 107:18"]}
      - {motif: god-sends-his-word-to-heal, refs: ["Ps 107:20"]}
      - {motif: ships-on-the-sea, refs: ["Ps 107:23"]}
      - {motif: storm-at-sea-stilled, refs: ["Ps 107:25-30"]}
      - {motif: sailors-reel-like-drunkards, refs: ["Ps 107:27"]}
      - {motif: rivers-to-desert-desert-to-pools, refs: ["Ps 107:33-35"], note: "Fruitful land turned to salt waste for its inhabitants' evil"}
      - {motif: god-humbles-one-exalts-another, refs: ["Ps 107:40-41"], note: "Pours contempt on nobles, makes them wander in tohu; lifts the needy"}
      - {motif: vow-of-thanksgiving-paid, refs: ["Ps 107:22"]}
    hints:
      - "Inverted nun signs in 107:23-28 in the Masoretic tradition. Talmud (Ber 54b) derives from the four groups the obligation of the thanksgiving blessing (birkat ha-gomel)."
      - "Compare Jonah 1 and Mark 4:35-41 (Jesus stilling the storm); Isa 45:2 (bronze doors, iron bars); 1 Pet 3:19 / harrowing of hell imagery."

  - id: hb-ps-108-composite
    tradition: judaism
    title: Psalm 108, composite of Ps 57 and Ps 60
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Ps 108:1-14"]
    tags:
      - {motif: psalm-ascribed-to-david, refs: ["Ps 108:1"]}
      - {motif: duplicate-psalm, refs: ["Ps 108:2-6", "Ps 108:7-14"], note: "108:2-6 = 57:8-12; 108:7-14 = 60:7-14"}
      - {motif: awake-the-dawn, refs: ["Ps 108:3"]}
      - {motif: exalted-above-the-heavens-refrain, refs: ["Ps 108:6"]}
      - {motif: divine-oracle-in-psalm, refs: ["Ps 108:8-10"], note: "God 'spoke in his holiness': divides Shechem, measures the Vale of Succoth"}
      - {motif: sandal-cast-over-land, refs: ["Ps 108:10"]}
      - {motif: god-does-not-go-out-with-armies, refs: ["Ps 108:12"]}
      - {motif: vain-is-help-of-man, refs: ["Ps 108:13"]}

  - id: hb-ps-109-imprecations
    tradition: judaism
    title: Psalm 109, curses on the accuser
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Ps 109:1-31"]
    tags:
      - {motif: psalm-for-the-leader, refs: ["Ps 109:1"]}
      - {motif: do-not-keep-silent-o-god, refs: ["Ps 109:1"]}
      - {motif: hated-without-cause, refs: ["Ps 109:3-5"], note: "'In return for my love they accuse me (yistenuni), but I am prayer'"}
      - {motif: imprecation-on-enemies, refs: ["Ps 109:6-20"]}
      - {motif: accuser-at-right-hand-in-court, refs: ["Ps 109:6"], note: "satan stands at his right hand; cf. Zech 3:1"}
      - {motif: satan-as-adversary-common-noun, refs: ["Ps 109:4", "Ps 109:6", "Ps 109:20", "Ps 109:29"]}
      - {motif: his-office-taken-by-another, refs: ["Ps 109:8"]}
      - {motif: curse-on-enemys-children-and-widow, refs: ["Ps 109:9-13"]}
      - {motif: mothers-sin-not-blotted-out, refs: ["Ps 109:14"]}
      - {motif: curse-worn-as-garment, refs: ["Ps 109:17-19"]}
      - {motif: days-like-lengthening-shadow, refs: ["Ps 109:23"]}
      - {motif: shaken-off-like-locust, refs: ["Ps 109:23"]}
      - {motif: mocked-in-sackcloth-and-fasting, refs: ["Ps 109:24-25"], note: "Knees weak from fasting; onlookers shake their heads"}
      - {motif: god-stands-at-right-hand-of-needy, refs: ["Ps 109:31"], note: "Reverses 109:6: the accuser at the wicked man's right, God at the poor man's right"}
    hints:
      - "Acts 1:20 applies 109:8 ('let another take his office') to Judas. Compare curse tablets (defixiones) and Mesopotamian curse formulae binding offspring."

  - id: hb-ps-110-priest-king
    tradition: judaism
    title: Psalm 110, the lord at God's right hand, priest after Melchizedek
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Ps 110:1-7"]
    tags:
      - {motif: psalm-ascribed-to-david, refs: ["Ps 110:1"]}
      - {motif: divine-oracle-in-psalm, refs: ["Ps 110:1"], note: "ne'um YHWH la-doni"}
      - {motif: sit-at-my-right-hand-footstool, refs: ["Ps 110:1"]}
      - {motif: scepter-sent-from-zion, refs: ["Ps 110:2"]}
      - {motif: dew-of-youth-from-womb-of-dawn, refs: ["Ps 110:3"], note: "Hebrew obscure; LXX 'from the womb before the morning star I begot you'"}
      - {motif: priest-forever-order-of-melchizedek, refs: ["Ps 110:4"]}
      - {motif: priest-king-melchizedek, refs: ["Ps 110:4"]}
      - {motif: god-crushes-head-of-enemies, refs: ["Ps 110:5-6"], note: "Shatters kings on the day of his wrath, fills the nations with corpses"}
      - {motif: king-drinks-from-brook-on-way, refs: ["Ps 110:7"]}
    hints:
      - "Most-quoted psalm in the New Testament (Mark 12:36, Acts 2:34, Heb 1:13, 5-7). Qumran 11QMelchizedek makes Melchizedek a heavenly redeemer. Compare Egyptian iconography of the pharaoh enthroned at the god's right with enemies as footstool (Tutankhamun's footstool)."

  - id: hb-ps-111-acrostic-works
    tradition: judaism
    title: Psalm 111, acrostic hymn on God's works
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Ps 111:1-10"]
    tags:
      - {motif: hallelujah-formula, refs: ["Ps 111:1"]}
      - {motif: acrostic-poem, refs: ["Ps 111:1-10"], note: "One letter per half-line"}
      - {motif: memorial-made-for-wonders, refs: ["Ps 111:4-5"]}
      - {motif: thirteen-attributes, refs: ["Ps 111:4"], note: "'Gracious and compassionate is YHWH'"}
      - {motif: fear-of-yhwh-beginning-of-wisdom, refs: ["Ps 111:10"]}
    hints:
      - "Twin of Ps 112: phrases of God in 111 (his righteousness endures forever, gracious and compassionate) are transferred to the righteous man in 112."

  - id: hb-ps-112-acrostic-righteous-man
    tradition: judaism
    title: Psalm 112, acrostic on the blessed God-fearer
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Ps 112:1-10"]
    tags:
      - {motif: hallelujah-formula, refs: ["Ps 112:1"]}
