  - id: hb-prov-8-wisdom-at-creation
    tradition: judaism
    title: Proverbs 8:22-31, Wisdom before and at creation
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Prov 8:22-31"]
    tags:
      - {motif: wisdom-personified-as-woman, refs: ["Prov 8:22-31"]}
      - {motif: wisdom-acquired-first-of-gods-way, refs: ["Prov 8:22"], note: "qanani: 'acquired/possessed' (Aquila, Vulgate possedit) or 'created' (LXX ektisen); reshit darko recalls Gen 1:1 bereshit"}
      - {motif: wisdom-installed-from-eternity, refs: ["Prov 8:23"], note: "nissakhti: 'I was installed' (as a king, cf. Ps 2:6) or 'woven' (cf. Ps 139:13 tesukkeni)"}
      - {motif: wisdom-born-before-creation, refs: ["Prov 8:24-25"], note: "holalti twice, 'I was brought forth in birth pangs'"}
      - {motif: pre-creation-no-rain-no-plants, refs: ["Prov 8:24-26"], note: "Negative 'when there was not yet' (be'en ... beterem ... ad lo) cosmogony formula"}
      - {motif: creation-from-primeval-waters, refs: ["Prov 8:24", "Prov 8:27-28"], note: "Tehomot and springs heavy with water; fountains of the deep made strong"}
      - {motif: wisdom-present-at-creation, refs: ["Prov 8:27-29"], note: "'When he established the heavens, I was there (sham ani)'"}
      - {motif: circle-on-waters-boundary-light-darkness, refs: ["Prov 8:27"], note: "He inscribed a circle (hug) on the face of the deep"}
      - {motif: boundary-set-for-sea, refs: ["Prov 8:29"], note: "Sea given its decree (huqqo), the waters not to transgress his command (lit. 'his mouth')"}
      - {motif: earth-founded-like-building, refs: ["Prov 8:29"], note: "He marked out (behuqo) the foundations of the earth"}
      - {motif: creation-by-wisdom, refs: ["Prov 8:22-31"]}
      - {motif: wisdom-as-amon-beside-god, refs: ["Prov 8:30"], note: "amon: craftsman (cf. Jer 52:15 amman, Akk. ummanu sage), or amun 'nursling', or 'faithful'; Gen. Rabbah 1:1 reads 'oman' and makes Torah the blueprint God consulted"}
      - {motif: wisdom-plays-before-god, refs: ["Prov 8:30-31"]}
      - {motif: torah-as-delight, refs: ["Prov 8:30"], note: "sha'ashu'im, same word as Torah 'my delight' in Ps 119; basis for identifying Wisdom with Torah"}
      - {motif: wisdom-delights-in-humans, refs: ["Prov 8:31"]}
      - {motif: firmament-divides-waters, refs: ["Prov 8:28"], note: "He made firm the skies (shehaqim) above"}
    hints:
      - "Central text for the Arian controversy (LXX ektisen 'created me') and for Logos/Christ as pre-existent Wisdom (John 1:1-3, Col 1:15-17, Heb 1:2-3). Sir 24 identifies Wisdom with Torah; Gen. Rabbah 1:1 and m. Avot 3:14 make Torah the instrument of creation; 'reshit' links to Targum Neofiti Gen 1:1 'in wisdom God created'."
      - "Compare Egyptian Maat, daughter of Re, present with him at creation; Mesopotamian apkallu/ummanu sages; Avestan Spenta Mainyu and the Amesha Spentas; Philo's Sophia as mother of the Logos; Gnostic Sophia; Kabbalistic Hokhmah as the second sefirah; Quran 2:30-33 and the pre-existent 'preserved tablet' (85:22)."

