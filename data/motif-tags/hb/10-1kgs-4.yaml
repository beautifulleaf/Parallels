new_motifs:
  twelve-district-governors-monthly-provision: {label: "King appoints twelve district governors, each supplying the royal table for one month of the year", cluster: kingship}
  princesses-married-to-officials: {label: "King's daughters are married to his district officials", cluster: kingship}
  people-numerous-as-sand-eating-drinking: {label: "The people are as numerous as the sand by the sea, eating, drinking and rejoicing", cluster: kingship}
  empire-from-euphrates-to-egypt: {label: "King rules all kingdoms from the Euphrates to the border of Egypt, who bring him tribute", cluster: kingship}
  royal-daily-provisions-enumerated: {label: "The quantities of flour, cattle, sheep and game consumed daily at the royal table are listed", cluster: kingship}
  every-man-under-vine-and-fig: {label: "Everyone dwells safely under his own vine and fig tree", cluster: kingship}
  royal-stables-chariot-horses: {label: "King keeps tens of thousands of chariot horses and horsemen", cluster: kingship}
  king-wiser-than-east-and-egypt: {label: "King's wisdom surpasses that of the people of the East, of Egypt and of named sages", cluster: wisdom}
  wise-man-heart-broad-as-sand: {label: "God gives the king wisdom and 'breadth of heart' like the sand on the seashore", cluster: wisdom}
  king-composes-thousands-of-proverbs-songs: {label: "King speaks three thousand proverbs and a thousand and five songs", cluster: wisdom}
  wise-king-speaks-of-plants-and-animals: {label: "Wise king discourses on trees from cedar to hyssop, and on beasts, birds, creeping things and fish", cluster: wisdom}
  nations-come-to-hear-wisdom: {label: "Kings of all the earth send to hear the wise king's wisdom", cluster: wisdom}
  foreign-king-supplies-temple-timber: {label: "Foreign king (Hiram of Tyre) supplies cedar and cypress from Lebanon for the temple in exchange for food", cluster: temple}
  father-barred-from-building-temple-war: {label: "Father could not build the temple because of his wars; the son at rest builds it", cluster: temple}
  timber-rafts-by-sea: {label: "Logs are floated as rafts by sea to the building site", cluster: temple}
  corvee-labor-in-relays: {label: "Forced labor sent in monthly relays: one month abroad, two at home", cluster: kingship}
  temple-foundation-of-costly-hewn-stones: {label: "Great costly hewn stones are quarried for the temple foundation", cluster: temple}
  temple-founded-480-years-after-exodus: {label: "Temple building dated 480 years after the exodus, in the fourth year of the king, month Ziv", cluster: chronology}
  temple-dimensions-in-cubits: {label: "Exact dimensions of the temple building and its rooms are given in cubits", cluster: temple}
  temple-built-without-sound-of-iron: {label: "Temple built of stones finished at the quarry, so no hammer, axe or iron tool was heard in the house", cluster: temple}
  temple-side-chambers-stepped-ledges: {label: "Three stories of side chambers around the temple, each wider by a cubit, resting on stepped ledges", cluster: temple}
  divine-dwelling-conditional-on-obedience: {label: "God promises to dwell among Israel in the temple if the king keeps his statutes", cluster: temple}
  inner-sanctuary-cube-overlaid-gold: {label: "The inner sanctuary (devir) is a perfect cube of twenty cubits overlaid with pure gold", cluster: temple}
  giant-olivewood-cherubim-ten-cubits: {label: "Two cherubim of olive wood, ten cubits high, whose outstretched wings span the inner sanctuary wall to wall", cluster: temple}
  temple-walls-carved-cherubim-palms-flowers: {label: "Temple walls and doors are carved with cherubim, palm trees and open flowers, overlaid with gold", cluster: temple}
  temple-built-seven-years: {label: "The temple takes seven years to build, completed in the eighth month (Bul)", cluster: temple}
  old-month-names-ziv-bul-ethanim: {label: "Archaic (Canaanite/Phoenician) month names Ziv, Bul and Ethanim are used", cluster: chronology}
  palace-of-forest-of-lebanon: {label: "Royal hall called 'House of the Forest of Lebanon', built on rows of cedar pillars", cluster: kingship}
  palace-built-thirteen-years: {label: "King spends thirteen years on his own palace (contrast with seven for the temple)", cluster: kingship}
  hall-of-throne-for-judgment: {label: "King builds a throne hall where he sits to give judgment", cluster: kingship}
  house-for-pharaohs-daughter: {label: "King builds a separate house for his wife, Pharaoh's daughter", cluster: kingship}
  craftsman-son-of-widow-mixed-parentage: {label: "Master bronze-smith is son of an Israelite widow and a Tyrian father, filled with wisdom and skill", cluster: temple}
  twin-bronze-pillars-jachin-boaz: {label: "Two freestanding bronze pillars at the temple porch named Jachin and Boaz", cluster: temple}
  pillar-capitals-lilies-pomegranates: {label: "Pillar capitals with lily work, chain-network and rows of pomegranates", cluster: temple}
  bronze-sea-on-twelve-oxen: {label: "A great cast-bronze 'sea' basin rests on twelve bronze oxen facing the four directions in threes", cluster: temple}
  circumference-ratio-thirty-to-ten: {label: "A round vessel of ten cubits across has a circumference of thirty (pi as three)", cluster: temple}
  wheeled-bronze-stands-with-lions-cherubim: {label: "Ten wheeled bronze stands decorated with lions, oxen, cherubim and palms carry basins", cluster: temple}
  bronze-weight-not-counted: {label: "So much bronze was used that its weight was never measured", cluster: temple}
  casting-in-clay-ground-of-jordan: {label: "Bronze vessels cast in the clay ground of the Jordan plain between Succoth and Zarethan", cluster: temple}
  ten-golden-lampstands: {label: "Ten golden lampstands stand before the inner sanctuary, five on each side", cluster: temple}
  ark-brought-into-temple-at-feast: {label: "Ark brought in procession into the temple at the autumn feast in the seventh month", cluster: temple}
  sacrifices-beyond-counting: {label: "Sheep and cattle sacrificed so many that they could not be counted", cluster: cult}
  ark-poles-visible-to-this-day: {label: "Ends of the ark's poles visible from the holy place but not outside, 'to this day'", cluster: temple}
  god-dwells-in-thick-darkness: {label: "God has said he will dwell in thick darkness ('arafel)", cluster: theophany}
  temple-as-exalted-house-zebul: {label: "Temple called a 'house of zebul' (exalted dwelling), a place for God to dwell forever", cluster: temple}
  heaven-cannot-contain-god: {label: "Heaven and the heaven of heavens cannot contain God, much less a house built by hands", cluster: theology}
  prayer-toward-the-temple: {label: "Prayers made toward the temple (or toward the land, city and house when in exile) are heard in heaven", cluster: cult}
  oath-before-altar-ordeal: {label: "A man accused swears a curse-oath before the altar, and God judges guilty and innocent", cluster: law}
  drought-as-punishment-for-sin: {label: "Heaven is shut and no rain falls because of the people's sin; repentance brings rain", cluster: prophecy}
  foreigner-prays-at-temple: {label: "A foreigner from a far land who hears of God's name comes to pray at the temple and is heard", cluster: cult}
  no-man-who-does-not-sin: {label: "'There is no man who does not sin'", cluster: wisdom}
  repentance-in-exile-prayer: {label: "Exiles in an enemy land turn back with all their heart and pray toward their land, and God grants them mercy before captors", cluster: prophecy}
  god-alone-knows-hearts: {label: "God alone knows the hearts of all humans", cluster: theology}
  temple-dedication-fourteen-day-feast: {label: "Temple dedicated with a feast of seven plus seven days and a huge number of sacrifices", cluster: temple}
  middle-court-consecrated-altar-too-small: {label: "King consecrates the middle of the court for offerings because the bronze altar is too small", cluster: temple}
  second-divine-appearance-to-king: {label: "God appears a second time to the king, answering his prayer with promise and warning", cluster: kingship}
  temple-ruin-passersby-hiss-and-ask-why: {label: "Passersby will be appalled and hiss at the ruined temple and ask why God did this; the answer is apostasy", cluster: prophecy}
  worthless-cities-cabul: {label: "Gift of cities rejected as worthless and nicknamed 'Cabul' ('like nothing')", cluster: etiology}
  pharaoh-gives-city-as-dowry: {label: "Pharaoh conquers a city and gives it to his daughter as a dowry on her marriage", cluster: marriage}
  remnant-peoples-made-slave-labor: {label: "The remaining Canaanite peoples are made slave labor, while Israelites serve as soldiers and officers", cluster: kingship}
  ophir-gold-voyages: {label: "Fleets with Phoenician sailors sail from the Red Sea to Ophir and bring back gold", cluster: kingship}
  queen-of-sheba-tests-with-riddles: {label: "A foreign queen hears of the king's fame and comes to test him with hard riddles", cluster: wisdom}
  queen-breathless-at-splendor: {label: "Visiting queen is left breathless ('no spirit left in her') at the king's wisdom, table and servants", cluster: wisdom}
  not-half-was-told: {label: "Visitor confesses that reports did not tell even half of the king's wisdom and wealth", cluster: wisdom}
  camel-caravan-of-spices-gold: {label: "A royal caravan of camels laden with spices, gold and precious stones", cluster: kingship}
  almug-wood-for-lyres: {label: "Rare almug wood from Ophir used for temple supports and lyres for singers; never seen again", cluster: temple}
  annual-gold-666-talents: {label: "Gold coming to the king each year weighs 666 talents", cluster: kingship}
  golden-shields-in-palace: {label: "King makes hundreds of shields of beaten gold and hangs them in the palace", cluster: kingship}
  ivory-throne-six-steps-lions: {label: "Great ivory throne overlaid with gold, with six steps and twelve lions on the steps and two beside the arms", cluster: kingship}
  silver-common-as-stones: {label: "Silver as common as stones and cedar as sycamores in the king's day", cluster: kingship}
  tarshish-ships-apes-peacocks: {label: "Tarshish ships every three years bring gold, silver, ivory, apes and peacocks (or baboons)", cluster: kingship}
  horse-and-chariot-trade-egypt-kue: {label: "King's merchants import horses from Egypt and Kue and export chariots to Hittite and Aramean kings at fixed prices", cluster: kingship}
  king-with-thousand-wives: {label: "King has seven hundred royal wives and three hundred concubines", cluster: kingship}
  wise-king-led-astray-in-old-age: {label: "In his old age the wise king's foreign wives turn his heart to other gods", cluster: kingship}
  king-builds-shrines-for-foreign-gods: {label: "King builds high places for Chemosh, Molech/Milcom and Astarte on the mount facing Jerusalem", cluster: cult}
  punishment-deferred-for-sake-of-ancestor: {label: "God defers the punishment to the son's reign for the sake of the righteous father", cluster: kingship}
  one-tribe-left-as-lamp-for-david: {label: "One tribe is left to the dynasty so that David may always have a 'lamp' (nir) in Jerusalem", cluster: kingship}
  god-raises-adversary-satan: {label: "God raises up a human 'satan' (adversary) against the king", cluster: kingship}
  royal-child-refugee-raised-at-pharaohs-court: {label: "A royal boy escapes a massacre to Egypt, marries into Pharaoh's family, and his son is raised among Pharaoh's sons", cluster: kingship}
  exile-asks-pharaoh-to-let-him-go: {label: "Exile at Pharaoh's court insists 'let me go' to return to his land after his enemy's death", cluster: kingship}
  prophet-tears-new-cloak-twelve-pieces: {label: "Prophet tears a new garment into twelve pieces and gives ten to the future king as sign of the divided kingdom", cluster: prophecy}
  future-king-flees-to-egypt: {label: "The man designated to be king flees to Egypt (to Shishak) from the reigning king's attempt to kill him", cluster: kingship}
  source-book-cited: {label: "Narrator refers the reader to a lost source book (Book of the Acts of Solomon, Chronicles of the Kings)", cluster: historiography}
  old-counsel-vs-young-counsel: {label: "King rejects the counsel of the old advisers for that of the young men who grew up with him", cluster: kingship}
  little-finger-thicker-than-fathers-loins: {label: "Arrogant boast: 'my little finger is thicker than my father's loins; he chastised with whips, I with scorpions'", cluster: kingship}
  to-your-tents-o-israel: {label: "Secession cry: 'What portion have we in David? To your tents, O Israel!'", cluster: kingship}
  labor-overseer-stoned: {label: "The people stone to death the official over forced labor", cluster: kingship}
  prophet-forbids-civil-war: {label: "A prophet forbids the king to fight his brothers: 'this thing is from me'", cluster: prophecy}
  two-golden-calves-at-bethel-and-dan: {label: "King sets up two golden calves at Bethel and Dan so the people need not go to Jerusalem", cluster: cult}
  non-levite-priests-appointed: {label: "King appoints priests from all the people who are not Levites", cluster: cult}
  rival-festival-eighth-month: {label: "King invents a rival pilgrimage festival on the fifteenth of the eighth month, a month 'he devised from his own heart'", cluster: cult}
  forty-year-reign: {label: "A king reigns exactly forty years", cluster: kingship}
  dynasty-promise-conditional: {label: "God promises a lasting dynasty ('sure house') on condition of obedience", cluster: kingship}
  son-of-a-widow: {label: "A key figure is identified as the son of a widow", cluster: kingship}
  prophecy-names-future-king-centuries-ahead: {label: "A prophet names a future king (Josiah) generations before his birth and what he will do", cluster: prophecy}
  human-bones-burned-on-altar: {label: "Human bones are to be burned on an altar to defile it", cluster: cult}
  altar-splits-ashes-pour-out: {label: "As a sign the altar splits apart and its ashes pour out", cluster: prophecy}
  kings-hand-withers-and-restored: {label: "The king's hand, stretched out against the man of God, withers and is restored at the prophet's prayer", cluster: prophecy}
  prophet-forbidden-food-and-return-route: {label: "Prophet commanded not to eat bread or drink water in the place nor return by the way he came", cluster: prophecy}
  old-prophet-lies-claiming-angel: {label: "An old prophet lies, claiming an angel told him to bring the man of God home to eat", cluster: prophecy}
  lion-kills-disobedient-prophet: {label: "A lion kills a disobedient prophet but stands beside the body with the donkey, eating neither", cluster: prophecy}
  denied-burial-in-ancestral-tomb: {label: "Punishment: one's corpse will not come to the tomb of one's ancestors", cluster: death}
  prophet-asks-burial-beside-other-prophets-bones: {label: "Prophet asks to be buried beside the bones of the man of God", cluster: death}
  lament-alas-my-brother: {label: "Mourners lament 'Alas, my brother!' (hoy ahi)", cluster: death}
  sick-child-oracle-sought: {label: "Parent sends to a prophet to learn whether a sick child will recover", cluster: prophecy}
  queen-disguised-visits-blind-prophet: {label: "King's wife disguises herself to consult a blind prophet who recognizes her by her footsteps", cluster: prophecy}
  gift-of-bread-cakes-honey-to-seer: {label: "Gift of loaves, crumbled cakes and a jar of honey brought to a seer", cluster: prophecy}
  male-who-pisses-against-wall: {label: "Every male cut off, idiom 'one who pisses against the wall', 'bond and free'", cluster: kingship}
  house-burned-like-dung: {label: "The dynasty will be swept away as one burns up dung until it is gone", cluster: kingship}
  dynasty-dead-eaten-by-dogs-and-birds: {label: "Those of the dynasty who die in the city are eaten by dogs, those in the field by birds", cluster: kingship}
  child-dies-as-mother-crosses-threshold: {label: "The sick child dies the moment his mother's foot crosses the threshold", cluster: prophecy}
  israel-shaken-like-reed-scattered-beyond-river: {label: "Israel struck like a reed shaken in water and scattered beyond the River", cluster: prophecy}
  regnal-formula: {label: "Standard regnal formula: age at accession, length of reign, mother's name, evaluation, burial, successor", cluster: kingship}
  mother-of-king-named-foreign: {label: "The king's mother is named and is a foreigner (Naamah the Ammonite)", cluster: kingship}
  invader-plunders-temple-treasury: {label: "Foreign invader (Shishak, etc.) carries off the treasures of the temple and palace", cluster: warfare}
  gold-shields-replaced-with-bronze: {label: "Gold shields taken by the enemy are replaced with bronze ones carried by the guard", cluster: kingship}
  david-faultless-except-uriah: {label: "David did right all his life except in the matter of Uriah the Hittite", cluster: kingship}
  queen-mother-deposed-for-idol: {label: "King removes his (grand)mother from her rank as queen mother for making an obscene image for Asherah, burning it in the Kidron", cluster: cult}
  temple-treasure-sent-as-bribe-to-foreign-king: {label: "King sends the temple's silver and gold to a foreign king to break his treaty with a rival", cluster: kingship}
  enemy-fortress-dismantled-for-materials: {label: "The enemy's half-built fortress is dismantled and its stones and timber used to build one's own", cluster: warfare}
  king-diseased-in-feet-in-old-age: {label: "A pious king in old age is diseased in his feet", cluster: kingship}
  usurper-exterminates-predecessor-house: {label: "A usurper kills the king and wipes out his entire house, fulfilling prophecy", cluster: kingship}
  raised-from-dust-to-rule: {label: "God raised the ruler 'from the dust' to be prince over his people", cluster: kingship}
  king-assassinated-while-drunk: {label: "King is assassinated while drinking himself drunk in a steward's house", cluster: kingship}
  seven-day-king-burns-palace-on-himself: {label: "Usurper who reigned seven days burns the palace over himself and dies", cluster: kingship}
  people-split-between-two-claimants: {label: "The people split in half between two rival claimants to the throne", cluster: kingship}
  capital-hill-bought-named-after-owner: {label: "King buys a hill for two talents of silver and names the new capital after its former owner (Shemer, Samaria)", cluster: etiology}
  king-marries-sidonian-baal-priest-daughter: {label: "King marries Jezebel, daughter of Ethbaal king of the Sidonians, and serves Baal", cluster: kingship}
  temple-of-baal-in-capital: {label: "King builds a temple and altar of Baal in his capital and makes an Asherah", cluster: cult}
  prophet-shuts-heaven-no-dew-or-rain: {label: "Prophet declares there will be neither dew nor rain except at his word", cluster: prophecy}
  prophet-fed-by-ravens: {label: "Prophet hiding by a wadi is fed bread and meat morning and evening by ravens", cluster: prophecy}
  prophet-hides-by-brook: {label: "Prophet hides by a brook east of the Jordan and drinks from it until it dries up", cluster: prophecy}
  foreign-widow-feeds-prophet: {label: "God commands a foreign (Sidonian) widow to feed the prophet in famine", cluster: prophecy}
  widow-gathering-sticks-last-meal: {label: "Widow gathering two sticks to bake a last meal for herself and her son before they die", cluster: prophecy}
  inexhaustible-jar-of-flour-and-oil: {label: "Jar of flour and jug of oil do not run out until the famine ends", cluster: miracle}
  prophet-first-portion-test-of-faith: {label: "Prophet asks the starving widow to bake for him first, promising abundance", cluster: miracle}
  host-blames-prophet-for-sons-death: {label: "Bereaved mother accuses the man of God of coming to recall her sin and kill her son", cluster: miracle}
  prophet-revives-dead-child-in-upper-room: {label: "Prophet carries a dead boy to the upper room, lays him on his own bed, and revives him", cluster: miracle}
  prophet-stretches-on-child-three-times: {label: "Prophet stretches himself over the child three times, praying that his life return", cluster: miracle}
  revived-son-returned-to-mother: {label: "Prophet hands the revived child to his mother: 'See, your son lives'", cluster: miracle}
  miracle-proves-man-of-god: {label: "A witness of the miracle confesses: now I know you are a man of God and God's word in your mouth is truth", cluster: miracle}
  steward-hides-hundred-prophets-in-caves: {label: "Pious royal steward hides a hundred prophets, fifty to a cave, and feeds them bread and water", cluster: prophecy}
  persecution-of-prophets-by-queen: {label: "Queen kills the prophets of YHWH", cluster: prophecy}
  spirit-may-carry-prophet-away: {label: "Fear that the spirit of YHWH will carry the prophet off to an unknown place", cluster: prophecy}
  king-searched-every-nation-for-prophet: {label: "King searched every nation and kingdom for the prophet, making them swear he was not there", cluster: prophecy}
  troubler-of-israel: {label: "King calls the prophet 'troubler of Israel' (okher Yisra'el); prophet returns the charge", cluster: prophecy}
  limping-between-two-opinions: {label: "'How long will you hop between two branches? If YHWH is God, follow him; if Baal, follow him'", cluster: prophecy}
  lone-prophet-against-hundreds: {label: "A single prophet of YHWH stands against 450 prophets of Baal and 400 of Asherah", cluster: prophecy}
  contest-god-who-answers-by-fire: {label: "Contest of gods: the god who answers by fire on an unlit sacrifice is God", cluster: prophecy}
  prophet-mocks-sleeping-god: {label: "Prophet mocks the silent god: perhaps he is musing, relieving himself, travelling, or asleep and must be woken", cluster: prophecy}
  priests-gash-themselves-ecstatic-rite: {label: "Prophets of Baal limp-dance around the altar and gash themselves with swords and lances till blood flows", cluster: cult}
  altar-of-twelve-stones-repaired: {label: "Prophet repairs the ruined altar with twelve stones for the tribes of Jacob", cluster: cult}
  sacrifice-drenched-with-water-thrice: {label: "Sacrifice and altar drenched with four jars of water three times, filling a trench, before the miracle", cluster: miracle}
  fire-from-heaven-consumes-offering: {label: "Fire from heaven falls and consumes the offering, wood, stones, dust and water", cluster: miracle}
  yhwh-he-is-god-acclamation: {label: "The people fall on their faces crying 'YHWH, he is God! YHWH, he is God!'", cluster: prophecy}
  false-prophets-slaughtered-at-brook: {label: "The prophets of Baal are seized and slaughtered at the brook Kishon", cluster: prophecy}
  prophet-crouches-head-between-knees: {label: "Prophet on the mountaintop bows to the ground with his face between his knees praying for rain", cluster: prophecy}
  servant-looks-seven-times-small-cloud: {label: "Servant sent seven times to look toward the sea sees a cloud as small as a man's hand", cluster: miracle}
  prophet-outruns-chariot: {label: "Hand of YHWH upon him, the prophet girds his loins and runs ahead of the king's chariot", cluster: prophecy}
  queen-oath-to-kill-prophet-by-tomorrow: {label: "Queen swears by the gods to make the prophet's life like the slain prophets' by this time tomorrow", cluster: prophecy}
  prophet-sleeps-under-broom-tree: {label: "Despairing prophet sits and sleeps under a broom tree in the wilderness", cluster: prophecy}
  angel-wakes-prophet-with-cake-and-water: {label: "An angel touches the sleeping prophet twice and gives him a cake baked on hot stones and a jar of water", cluster: prophecy}
  journey-forty-days-on-one-meal: {label: "On the strength of one meal the prophet walks forty days and nights to the mountain of God", cluster: prophecy}
  prophet-in-cave-on-horeb: {label: "Prophet lodges in 'the cave' on Horeb, the mountain of God", cluster: theophany}
  what-are-you-doing-here: {label: "God twice asks the prophet 'What are you doing here?' and he twice answers the same complaint", cluster: theophany}
  zealous-for-god-alone-left: {label: "Prophet claims 'I have been very zealous for YHWH... and I alone am left'", cluster: prophecy}
  god-not-in-wind-earthquake-fire: {label: "God passes by: a mountain-splitting wind, earthquake and fire, but God is not in them", cluster: theophany}
  still-small-voice: {label: "After the fire comes 'a sound of thin silence' (qol demamah daqqah)", cluster: theophany}
  prophet-wraps-face-in-mantle: {label: "Prophet wraps his face in his mantle on hearing God", cluster: theophany}
  commission-to-anoint-three: {label: "Prophet commissioned to anoint a foreign king, a native king and his own prophetic successor", cluster: prophecy}
  triple-sword-whoever-escapes: {label: "Whoever escapes the sword of the first avenger, the second will kill, and the third", cluster: prophecy}
  seven-thousand-who-did-not-bow-to-baal: {label: "God keeps a remnant of seven thousand whose knees did not bow and lips did not kiss Baal", cluster: prophecy}
  kissing-idol: {label: "Worshipers kiss the image of the god", cluster: cult}
  mantle-cast-on-successor: {label: "Prophet calls his successor by throwing his mantle over him", cluster: prophecy}
  disciple-called-from-plowing-farewell-parents: {label: "Disciple called while plowing asks to kiss his parents goodbye first", cluster: prophecy}
  disciple-sacrifices-oxen-burns-yoke: {label: "Called disciple slaughters his oxen, boils the meat with the yoke for fuel, feeds the people, and follows", cluster: prophecy}
  twelve-yoke-of-oxen: {label: "The called man is plowing with twelve yoke of oxen, himself with the twelfth", cluster: prophecy}
  besieger-demands-wives-children-gold: {label: "Besieging king demands the besieged king's silver, gold, wives and sons", cluster: warfare}
  boast-dust-not-enough-for-handfuls: {label: "Besieger swears the dust of the city will not suffice for handfuls for all his followers", cluster: warfare}
  let-not-him-who-girds-boast: {label: "Proverb: 'Let not the one who girds on his armor boast like one who takes it off'", cluster: wisdom}
  drunk-king-in-booths-routed: {label: "Enemy king drinking drunk in booths with thirty-two allied kings is routed at noon", cluster: warfare}
  young-men-of-district-governors-win: {label: "Victory won by a small vanguard of 232 young men of the district governors", cluster: warfare}
  god-of-hills-not-valleys: {label: "Enemies claim Israel's God is a god of the hills, not the valleys; God proves them wrong", cluster: warfare}
  thirty-two-vassal-kings: {label: "A great king leads an alliance of thirty-two kings", cluster: warfare}
  wall-falls-on-enemy-survivors: {label: "City wall falls on the 27,000 survivors who fled into it", cluster: warfare}
  sackcloth-and-ropes-surrender: {label: "Defeated men come to the victor wearing sackcloth on their loins and ropes on their heads to beg for life", cluster: warfare}
  merciful-kings-of-israel: {label: "Enemies rely on the reputation that the kings of Israel are merciful kings (malkhei hesed)", cluster: kingship}
  enemy-called-my-brother-omen-seized: {label: "Victor calls the enemy king 'my brother'; envoys seize the word as an omen", cluster: divination}
  bazaars-in-enemy-capital-treaty: {label: "Treaty grants trading quarters (hutsot) in the enemy capital and returns captured cities", cluster: kingship}
  refusal-to-strike-prophet-punished-by-lion: {label: "Man who refuses a prophet's command to strike him is killed by a lion", cluster: prophecy}
  prophet-disguised-with-bandage-juridical-parable: {label: "Wounded prophet, disguised with a bandage over his eyes, tells the king a case and the king condemns himself", cluster: prophecy}
  life-for-life-of-guarded-captive: {label: "'Your life for his life': a guard who loses a prisoner forfeits his life or a talent of silver", cluster: law}
  sullen-and-angry-king: {label: "King goes home 'sullen and angry' (sar ve-za'ef) after a prophet's rebuke", cluster: kingship}
  ancestral-inheritance-refused-to-king: {label: "Commoner refuses to sell or trade his ancestral vineyard to the king: 'God forbid I give you my fathers' inheritance'", cluster: law}
  king-sulks-on-bed-refuses-food: {label: "Thwarted king lies on his bed, turns his face to the wall and refuses to eat", cluster: kingship}
  queen-forges-letters-with-kings-seal: {label: "Queen writes letters in the king's name, sealed with his seal, ordering a judicial murder", cluster: kingship}
  staged-fast-and-two-false-witnesses: {label: "A fast is proclaimed and two worthless men falsely testify that the victim 'blessed (cursed) God and king'", cluster: law}
  victim-stoned-outside-city: {label: "Innocent victim is taken outside the city and stoned to death", cluster: law}
  have-you-murdered-and-also-inherited: {label: "Prophet confronts the king: 'Have you murdered and also taken possession?'", cluster: prophecy}
  dogs-lick-blood-where-victim-died: {label: "Where dogs licked the victim's blood, dogs will lick the murderer's blood", cluster: prophecy}
  dogs-eat-queen-by-wall: {label: "Dogs will eat the wicked queen by the wall (or plot) of Jezreel", cluster: prophecy}
  found-me-o-my-enemy: {label: "King greets the prophet: 'Have you found me, O my enemy?'", cluster: prophecy}
  king-sold-himself-to-do-evil: {label: "King 'sold himself' to do evil, incited by his wife", cluster: kingship}
  royal-repentance-in-sackcloth-postpones-doom: {label: "King tears his clothes, wears sackcloth, fasts and walks softly; God postpones the doom to his son's days", cluster: kingship}
  four-hundred-court-prophets-unanimous: {label: "Four hundred court prophets unanimously promise victory", cluster: prophecy}
  prophet-hated-for-always-prophesying-evil: {label: "King hates the one true prophet because he never prophesies good for him, only evil", cluster: prophecy}
  iron-horns-sign-act: {label: "Court prophet makes iron horns: 'with these you will gore Aram'", cluster: prophecy}
  prophet-first-echoes-then-tells-truth: {label: "Prophet first sarcastically repeats the favorable oracle, then under oath tells the true one", cluster: prophecy}
  vision-of-god-enthroned-with-host-of-heaven: {label: "Prophet sees God seated on his throne with all the host of heaven standing to his right and left", cluster: theophany}
  divine-council-deliberates-deception: {label: "God asks the heavenly council 'who will entice the king?'; a spirit volunteers", cluster: theophany}
  lying-spirit-in-mouth-of-prophets: {label: "A spirit becomes a lying spirit in the mouth of all the king's prophets, with God's permission", cluster: theophany}
  prophet-slapped-on-cheek: {label: "Rival prophet slaps the true prophet on the cheek: 'Which way did the spirit of YHWH pass from me to speak to you?'", cluster: prophecy}
  prophet-imprisoned-on-bread-and-water: {label: "Prophet imprisoned on short rations of bread and water until the king returns in peace", cluster: prophecy}
  if-you-return-safely-god-has-not-spoken: {label: "Prophet stakes his authority: 'If you return in peace, YHWH has not spoken by me'", cluster: prophecy}
  king-disguises-himself-in-battle: {label: "King disguises himself for battle while his ally wears royal robes", cluster: warfare}
  random-arrow-kills-disguised-king: {label: "An arrow drawn 'at random' strikes the disguised king between the joints of his armor", cluster: warfare}
  dying-king-propped-in-chariot: {label: "Wounded king is propped up in his chariot facing the enemy until he dies at evening, blood pooling in the chariot", cluster: warfare}
  harlots-bathe-in-kings-blood: {label: "Dogs lick the dead king's blood at the pool of Samaria where harlots bathe", cluster: prophecy}
  ivory-house: {label: "King builds a 'house of ivory'", cluster: kingship}
  fleet-wrecked-at-ezion-geber: {label: "Ships built to sail to Ophir for gold are wrecked at Ezion-geber", cluster: kingship}
  king-falls-through-lattice: {label: "King falls through the lattice of his upper chamber and is injured", cluster: kingship}
  inquiring-of-foreign-god-baal-zebub: {label: "Sick king sends to inquire of Baal-zebub, god of Ekron, whether he will recover", cluster: cult}
  is-there-no-god-in-israel: {label: "Rebuke: 'Is it because there is no God in Israel that you go to inquire of a foreign god?'", cluster: prophecy}
  you-shall-not-come-down-from-bed: {label: "Doom oracle: 'From the bed you have gone up on you shall not come down, but shall surely die'", cluster: prophecy}
  hairy-man-with-leather-belt: {label: "Prophet identified by being 'a hairy man' (or wearing a hair garment) with a leather belt round his loins", cluster: prophecy}
  fire-consumes-captains-of-fifty: {label: "Fire from heaven consumes two captains of fifty and their men sent to seize the prophet; the third begs and is spared", cluster: miracle}
  prophet-tests-companion-stay-here: {label: "Prophet thrice tells his disciple 'stay here', and the disciple swears thrice not to leave him", cluster: prophecy}
  sons-of-prophets-know-master-taken-today: {label: "Guild prophets at each town tell the disciple 'today God takes your master'; he answers 'I know, be silent'", cluster: prophecy}
  mantle-parts-jordan: {label: "Prophet rolls up his mantle, strikes the Jordan, and the waters divide so they cross on dry ground", cluster: miracle}
  double-portion-of-spirit-requested: {label: "Disciple asks for a double portion (pi shnayim) of the master's spirit, granted if he sees him taken", cluster: prophecy}
  chariot-and-horses-of-fire: {label: "A chariot of fire and horses of fire separate the two prophets", cluster: theophany}
  prophet-ascends-in-whirlwind: {label: "Prophet is taken up alive to heaven in a whirlwind", cluster: theophany}
  my-father-chariot-of-israel: {label: "Cry 'My father, my father, the chariots of Israel and its horsemen!' at the prophet's departure", cluster: prophecy}
  successor-picks-up-fallen-mantle: {label: "Successor picks up the master's fallen mantle and repeats his miracle, striking the waters", cluster: prophecy}
  where-is-god-of-elijah: {label: "Successor strikes the water crying 'Where is YHWH, the God of Elijah?'", cluster: prophecy}
  search-for-taken-prophets-body: {label: "Fifty men search three days for the ascended prophet, fearing the spirit dropped him on a mountain or valley, but do not find him", cluster: prophecy}
  salt-heals-bad-water: {label: "Prophet throws salt from a new bowl into the spring and heals the deadly, miscarriage-causing water 'to this day'", cluster: miracle}
  boys-mock-bald-prophet-bears: {label: "Small boys jeer 'Go up, baldhead!'; the prophet curses them and two she-bears maul forty-two of them", cluster: prophecy}
  vassal-tribute-of-lambs-and-wool: {label: "A sheep-breeding vassal king pays tribute of a hundred thousand lambs and the wool of a hundred thousand rams", cluster: kingship}
  three-kings-campaign-waterless: {label: "Allied kings on a seven-day detour run out of water for army and beasts and despair", cluster: warfare}
  prophet-refuses-to-look-at-wicked-king: {label: "Prophet says he would not even look at the wicked king were it not for the righteous ally", cluster: prophecy}
  music-induces-prophecy: {label: "Prophet calls for a musician; as he plays, the hand of YHWH comes upon him", cluster: prophecy}
  water-without-wind-or-rain: {label: "Dry wadi fills with water though no wind or rain is seen", cluster: miracle}
  scorched-earth-campaign: {label: "Invaders fell every good tree, stop every spring and ruin every good field with stones", cluster: warfare}
  water-appears-red-as-blood: {label: "At sunrise the water looks red as blood; the enemy thinks the kings have slain each other and rushes to plunder", cluster: warfare}
  king-sacrifices-firstborn-on-wall: {label: "Besieged king offers his firstborn heir as a burnt offering on the city wall, and 'great wrath' falls on Israel, who withdraw", cluster: cult}
  creditor-to-take-children-as-slaves: {label: "Creditor comes to take a dead man's two children as slaves for the debt", cluster: law}
  widows-oil-fills-borrowed-vessels: {label: "Widow's little oil fills all the borrowed vessels behind a shut door and stops when vessels run out", cluster: miracle}
  great-woman-builds-room-for-prophet: {label: "A wealthy woman has a small roof-chamber built for the holy man with bed, table, chair and lamp", cluster: hospitality}
  hostess-declines-reward-dwells-among-people: {label: "Offered a favor with king or general, the hostess replies 'I dwell among my own people'", cluster: hospitality}
  childless-woman-old-husband-promised-son: {label: "Prophet promises a childless woman with an old husband a son 'at this season next year'", cluster: childhood}
  do-not-deceive-your-maidservant: {label: "Woman protests the promise of a son: 'Do not lie to your maidservant'", cluster: childhood}
  child-dies-of-head-pain-in-harvest: {label: "Child in the harvest field cries 'My head, my head!' and dies at noon on his mother's knees", cluster: childhood}
  mother-lays-dead-child-on-prophets-bed: {label: "Mother lays her dead son on the prophet's bed, shuts the door and rides to fetch him", cluster: miracle}
  not-new-moon-nor-sabbath: {label: "Husband asks why she visits the prophet when it is neither new moon nor sabbath", cluster: cult}
  woman-clasps-prophets-feet: {label: "Bereaved woman grasps the prophet's feet; the servant tries to push her away", cluster: miracle}
  god-hid-it-from-prophet: {label: "Prophet admits 'YHWH has hidden it from me and not told me'", cluster: prophecy}
  servant-greets-no-one-on-the-way: {label: "Servant sent in haste must greet no one and answer no greeting on the road", cluster: prophecy}
  prophets-staff-on-dead-child-fails: {label: "Servant lays the prophet's staff on the dead child's face but there is no voice or response", cluster: miracle}
  prophet-lies-mouth-to-mouth-on-child: {label: "Prophet lies on the child, mouth to mouth, eyes to eyes, hands to hands, until the body warms", cluster: miracle}
  revived-child-sneezes-seven-times: {label: "Revived child sneezes seven times and opens his eyes", cluster: miracle}
  death-in-the-pot: {label: "Wild gourds in the stew make the prophets cry 'Death in the pot!'; flour thrown in makes it harmless", cluster: miracle}
  multiplication-of-loaves-leftovers: {label: "Twenty barley loaves of first fruits feed a hundred men with food left over, as God said", cluster: miracle}
  leper-general-of-foreign-king: {label: "A great foreign general, mighty warrior and favorite of his king, is a leper", cluster: healing}
  captive-israelite-girl-recommends-prophet: {label: "A captive Israelite servant girl tells her foreign mistress that the prophet in Samaria could cure her master", cluster: healing}
  am-i-god-to-kill-and-make-alive: {label: "King tears his clothes: 'Am I God, to kill and to make alive?'", cluster: theology}
  bathe-seven-times-in-jordan: {label: "Prophet sends word to wash seven times in the Jordan; the foreigner is cured", cluster: healing}
  foreign-noble-scorns-simple-cure: {label: "Proud foreigner is angry that the prophet did not come out and wave his hand, preferring the rivers of his own land", cluster: healing}
  healed-flesh-like-little-boys: {label: "Healed flesh is restored like the flesh of a little boy", cluster: healing}
  healed-foreigner-confesses-one-god: {label: "Cured foreigner confesses 'there is no God in all the earth except in Israel'", cluster: theology}
  prophet-refuses-payment-for-healing: {label: "Prophet refuses any gift for the healing", cluster: prophecy}
  two-mule-loads-of-israelite-soil: {label: "Convert takes two mule-loads of Israel's earth to worship YHWH on in a foreign land", cluster: cult}
  convert-pardoned-for-bowing-in-pagan-temple: {label: "Convert asks pardon in advance for bowing in the temple of Rimmon when his master leans on his arm", cluster: cult}
  greedy-servant-lies-for-reward: {label: "Prophet's servant runs after the healed man and lies to obtain silver and garments", cluster: prophecy}
  my-heart-went-with-you: {label: "Prophet reveals clairvoyance: 'Did not my heart go with you when the man turned from his chariot?'", cluster: prophecy}
  leprosy-transferred-to-greedy-servant: {label: "The healed man's leprosy clings to the greedy servant and his descendants forever, white as snow", cluster: healing}
  floating-axe-head: {label: "Prophet throws a stick into the river where a borrowed iron axe-head sank, and the iron floats", cluster: miracle}
  prophet-reveals-enemy-kings-bedroom-words: {label: "The prophet tells the king even the words the enemy king speaks in his bedroom", cluster: prophecy}
  servant-eyes-opened-fiery-army: {label: "At the prophet's prayer the servant's eyes are opened to see the mountain full of horses and chariots of fire", cluster: theophany}
  more-with-us-than-with-them: {label: "'Do not fear, for those with us are more than those with them'", cluster: theophany}
  enemy-army-struck-with-blindness-led-away: {label: "Enemy army struck with a blinding confusion (sanwerim) and led by the prophet into the enemy capital", cluster: miracle}
  captives-feasted-and-released: {label: "Captured enemies are given a great feast and sent home instead of being killed", cluster: warfare}
  famine-prices-donkey-head-dove-dung: {label: "In the siege a donkey's head sells for eighty shekels and a quarter-qab of dove's dung for five", cluster: warfare}
  mothers-agree-to-eat-sons: {label: "Two mothers agree to eat their sons in turn; after the first is eaten the other hides hers", cluster: warfare}
  king-wears-hidden-sackcloth: {label: "When the king tears his clothes, the people see sackcloth underneath on his body", cluster: kingship}
  king-blames-prophet-oath-to-behead: {label: "King swears to behead the prophet, blaming him for the disaster", cluster: kingship}
  son-of-a-murderer: {label: "Prophet calls the king 'this son of a murderer'", cluster: prophecy}
  why-wait-for-god-any-longer: {label: "'This evil is from YHWH; why should I wait for YHWH any longer?'", cluster: theology}
  prophecy-of-cheap-grain-tomorrow: {label: "Prophet foretells that by this time tomorrow fine flour and barley will sell for a shekel at the city gate", cluster: prophecy}
  windows-in-heaven-skeptic: {label: "Skeptic scoffs 'even if YHWH made windows in heaven'; told he will see it but not eat of it, and is trampled", cluster: prophecy}
  lepers-at-gate-desperate-gamble: {label: "Four lepers at the gate reason that they will die anyway and go over to the enemy camp", cluster: warfare}
  divine-sound-of-army-routs-enemy: {label: "God makes the enemy hear the sound of chariots, horses and a great army, and they flee abandoning their camp", cluster: warfare}
  day-of-good-news-not-kept-silent: {label: "Finders of plunder say 'this is a day of good tidings (besorah); if we keep silent, punishment will find us'", cluster: warfare}
  king-suspects-feigned-retreat: {label: "King suspects the abandoned camp is an ambush by feigned retreat and sends scouts", cluster: warfare}
  road-strewn-with-discarded-goods: {label: "Fleeing army leaves the road to the Jordan strewn with garments and vessels thrown away in haste", cluster: warfare}
  prophet-warns-of-seven-year-famine: {label: "Prophet warns the family to emigrate because God has called a famine of seven years", cluster: prophecy}
  land-restored-by-king-after-sojourn: {label: "On returning from seven years abroad, the woman petitions the king and her house, field and its produce are restored", cluster: law}
  timely-arrival-during-telling-of-miracle: {label: "The woman arrives to petition the king at the very moment the servant is telling him her story", cluster: prophecy}
  sick-foreign-king-consults-prophet: {label: "Sick foreign king sends a lavish gift by forty camels to ask the prophet if he will recover", cluster: prophecy}
  oracle-you-will-recover-but-will-die: {label: "Prophet says 'tell him he will surely recover', though God has shown he will surely die", cluster: prophecy}
  prophet-stares-and-weeps-at-future-king: {label: "Prophet fixes his gaze until the man is ashamed, then weeps at the atrocities the future king will commit", cluster: prophecy}
  atrocities-infants-dashed-pregnant-ripped: {label: "Atrocities of war: infants dashed to pieces and pregnant women ripped open", cluster: warfare}
  what-is-your-servant-a-dog: {label: "Self-deprecation: 'What is your servant, a dog, that he should do this great thing?'", cluster: wisdom}
  king-smothered-with-wet-cloth: {label: "Usurper smothers the sick king with a wet cloth spread over his face and reigns in his place", cluster: kingship}
  dynastic-marriage-to-ahab-house: {label: "Judahite king marries a daughter of Ahab and walks in the ways of the house of Ahab", cluster: kingship}
  vassal-revolt-edom-libnah: {label: "Edom and Libnah revolt from Judah's rule 'to this day'", cluster: kingship}
  wounded-king-recovers-at-jezreel: {label: "Wounded king returns to Jezreel to be healed, visited by his royal kinsman", cluster: kingship}
  prophet-disciple-anoints-commander-and-flees: {label: "A young prophet anoints the army commander king in an inner room with a flask of oil, then opens the door and flees", cluster: kingship}
  prophet-called-madman: {label: "Officers call the visiting prophet 'this madman' (meshugga')", cluster: prophecy}
  garments-spread-under-new-king-shofar: {label: "Officers spread their garments under the new king on the steps, blow the shofar and proclaim 'Jehu is king!'", cluster: kingship}
  watchman-sees-company-approaching: {label: "Watchman on the tower reports an approaching company; messengers sent out do not return", cluster: warfare}
  furious-driving-identifies-rider: {label: "Watchman recognizes the rider by his driving: 'he drives like a madman'", cluster: warfare}
  what-peace-while-queens-harlotries: {label: "'What peace, while your mother Jezebel's harlotries and sorceries are so many?'", cluster: prophecy}
  king-shot-through-heart-in-chariot: {label: "Usurper draws his bow and shoots the fleeing king between the shoulders, through the heart", cluster: warfare}
  corpse-cast-on-victims-plot: {label: "Slain king's body is thrown on the plot of the man his father murdered, fulfilling the oracle", cluster: prophecy}
  queen-paints-eyes-looks-from-window: {label: "Queen paints her eyes with kohl, adorns her head and looks out of the window to face her killer", cluster: kingship}
  is-it-peace-zimri-murderer-of-master: {label: "Queen taunts the usurper: 'Is it peace, Zimri, murderer of his master?'", cluster: kingship}
  eunuchs-throw-queen-from-window: {label: "Eunuchs throw the queen down from the window; her blood spatters the wall and horses trample her", cluster: kingship}
  only-skull-feet-hands-remain: {label: "When they go to bury her, only her skull, feet and palms of her hands are found", cluster: death}
  corpse-like-dung-on-field: {label: "The corpse will be like dung on the field so no one can say 'this is Jezebel'", cluster: death}
  seventy-heads-in-baskets: {label: "Guardians behead the king's seventy sons and send the heads in baskets; they are piled in two heaps at the gate", cluster: kingship}
  usurper-feigns-innocence-before-people: {label: "Usurper tells the people 'you are righteous; I conspired, but who killed all these?'", cluster: kingship}
  royal-kinsmen-massacred-at-pit: {label: "Forty-two kinsmen of the Judahite king are seized alive and slaughtered at the pit of Beth-eked", cluster: kingship}
  rechabite-ally-joins-chariot: {label: "Jehonadab son of Rechab gives his hand, is taken into the chariot, and goes to see the king's zeal for YHWH", cluster: kingship}
  come-see-my-zeal: {label: "'Come with me and see my zeal for YHWH'", cluster: prophecy}
  sham-baal-festival-massacre: {label: "King feigns devotion to Baal, gathers all Baal's worshipers in vestments into the temple, and has them all killed", cluster: cult}
  baal-temple-made-latrine: {label: "The temple of Baal is torn down and made into a latrine 'to this day'", cluster: cult}
  dynasty-to-fourth-generation-reward: {label: "As reward, the king's sons to the fourth generation will sit on the throne", cluster: kingship}
  god-begins-to-cut-off-territory: {label: "God begins to 'cut off' parts of Israel, as the foreign king seizes all of Transjordan", cluster: warfare}
units:
  - id: hb-1kgs-4-officials
    tradition: judaism
    title: Solomon's officials and twelve district governors
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["1Kgs 4:1-20"]
    tags:
      - {motif: twelve-district-governors-monthly-provision, refs: ["1Kgs 4:7"]}
      - {motif: princesses-married-to-officials, refs: ["1Kgs 4:11", "1Kgs 4:15"], note: "Taphath and Basemath, daughters of Solomon"}
      - {motif: people-numerous-as-sand-eating-drinking, refs: ["1Kgs 4:20"]}
      - {motif: seed-as-dust-stars-sand, refs: ["1Kgs 4:20"]}
      - {motif: royal-family-list, refs: ["1Kgs 4:2-6"], note: "Cabinet list: priest, scribes, recorder, army, 'friend of the king', palace, forced labor (Adoniram)"}
    hints:
      - "Compare Assyrian and Egyptian provincial provisioning systems; Persian satrapies supplying the royal table (Herodotus 1.192)."
  - id: hb-1kgs-5-dominion-wisdom
    tradition: judaism
    title: Solomon's dominion, provisions and wisdom
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["1Kgs 5:1-14"]
    tags:
      - {motif: empire-from-euphrates-to-egypt, refs: ["1Kgs 5:1", "1Kgs 5:4"], note: "From Tiphsah to Gaza"}
      - {motif: royal-daily-provisions-enumerated, refs: ["1Kgs 5:2-3"], note: "Includes deer, gazelle, roebuck and fattened 'barburim' (fowl?)"}
      - {motif: every-man-under-vine-and-fig, refs: ["1Kgs 5:5"]}
      - {motif: royal-stables-chariot-horses, refs: ["1Kgs 5:6"], note: "40,000 stalls; 12,000 horsemen"}
      - {motif: king-not-multiply-horses-wives-gold, refs: ["1Kgs 5:6"], note: "Implicit tension with Deut 17:16"}
      - {motif: wise-man-heart-broad-as-sand, refs: ["1Kgs 5:9"]}
      - {motif: king-wiser-than-east-and-egypt, refs: ["1Kgs 5:10-11"], note: "Ethan the Ezrahite, Heman, Calcol, Darda sons of Mahol"}
      - {motif: king-composes-thousands-of-proverbs-songs, refs: ["1Kgs 5:12"]}
      - {motif: wise-king-speaks-of-plants-and-animals, refs: ["1Kgs 5:13"]}
      - {motif: nations-come-to-hear-wisdom, refs: ["1Kgs 5:14"]}
    hints:
      - "Quran 27:16 (Solomon taught the speech of birds) and later lore of Solomon's command over animals; Wisdom of Solomon 7:17-21 on his knowledge of nature."
      - "Mesopotamian 'wisdom of the East'; Egyptian onomastica (lists of natural kinds) as a parallel to discourse on trees and animals."
  - id: hb-1kgs-5-hiram-cedars
    tradition: judaism
    title: Treaty with Hiram of Tyre; cedars and forced labor
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["1Kgs 5:15-32"]
    tags:
      - {motif: foreign-king-supplies-temple-timber, refs: ["1Kgs 5:20", "1Kgs 5:22-25"]}
      - {motif: father-barred-from-building-temple-war, refs: ["1Kgs 5:17-19"]}
      - {motif: timber-rafts-by-sea, refs: ["1Kgs 5:23"]}
      - {motif: corvee-labor-in-relays, refs: ["1Kgs 5:27-28"], note: "30,000 men, 10,000 a month"}
      - {motif: temple-foundation-of-costly-hewn-stones, refs: ["1Kgs 5:31"]}
      - {motif: foreigner-confesses-god-greatest, refs: ["1Kgs 5:21"], note: "Hiram blesses YHWH for giving David a wise son"}
    hints:
      - "Mesopotamian kings boast of cutting cedars of Lebanon for temples (Gilgamesh and Humbaba; Nebuchadnezzar's Wadi Brisa inscription)."
      - "Gebalites (men of Byblos) as stone-dressers, 5:32."
  - id: hb-1kgs-6-temple-structure
    tradition: judaism
    title: The temple's dating, dimensions and the divine promise
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["1Kgs 6:1-13"]
    tags:
      - {motif: temple-founded-480-years-after-exodus, refs: ["1Kgs 6:1"]}
