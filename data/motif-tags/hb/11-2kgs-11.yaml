  regicide-chain: {label: "Rapid succession of kings, each murdered by the next usurper", cluster: kingship}
  child-passed-through-fire: {label: "King makes his son 'pass through the fire' after the abominations of the nations", cluster: cult}
  vassal-your-servant-and-son: {label: "Vassal declares 'I am your servant and your son' to an imperial king", cluster: kingship}
  foreign-altar-copied: {label: "King copies the design of a foreign altar and installs it in the temple", cluster: cult}
  king-offers-sacrifice-himself: {label: "The king personally approaches the altar and offers sacrifice", cluster: cult}
  bronze-altar-reserved-for-inquiry: {label: "The old bronze altar is reserved for the king 'to inquire' (divination)", cluster: divination}
  temple-bronzes-dismantled: {label: "The temple's bronze stands and the sea on bronze oxen are dismantled", cluster: cult}
  vassal-withholds-tribute-seeks-egypt: {label: "Vassal king withholds tribute and seeks help from Egypt, and is imprisoned", cluster: kingship}
  three-year-siege: {label: "A capital city is besieged for three years before it falls", cluster: warfare}
  exile-explained-as-punishment: {label: "Theological sermon explaining the fall and exile of a nation as punishment for idolatry", cluster: theology}
  prophets-warned-repeatedly: {label: "God warned the people by all his prophets and seers, 'Turn from your evil ways', but they would not listen", cluster: prophecy}
  worship-of-host-of-heaven: {label: "People bow down to all the host of heaven", cluster: cult}
  divination-practiced: {label: "Kings or people practice divination (qesem) and augury (nihush)", cluster: divination}
  population-exchange-resettlement: {label: "Empire settles foreign peoples in the cities of a deported population", cluster: exile}
