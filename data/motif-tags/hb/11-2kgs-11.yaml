new_motifs:
  queen-mother-massacres-royal-seed: {label: "A queen mother seizes power by killing all the royal offspring", cluster: kingship}
  royal-infant-hidden-in-temple: {label: "Sole surviving royal infant is stolen away with his nurse and hidden in the temple for years", cluster: kingship}
  priest-led-coup: {label: "A priest organizes the guards to overthrow a ruler and enthrone the hidden heir", cluster: kingship}
  davids-weapons-in-temple: {label: "King David's spears and shields kept in the temple are issued to the guards", cluster: cult}
  crown-and-testimony-coronation: {label: "Coronation in which the king receives the crown (nezer) and the 'testimony' (edut)", cluster: kingship}
  king-stands-by-pillar-custom: {label: "The king stands by (or on) the pillar in the temple according to custom", cluster: kingship}
  cry-of-conspiracy: {label: "Deposed ruler tears her/his garments crying 'Conspiracy, conspiracy!' or 'Treason!'", cluster: kingship}
  no-killing-in-sanctuary: {label: "A condemned person is taken out so as not to be killed inside the sanctuary", cluster: cult}
  covenant-king-people-god: {label: "A covenant is made between God, the king and the people", cluster: covenant}
  baal-temple-destroyed-priest-killed: {label: "The temple of Baal is torn down and its priest slain before the altars", cluster: cult}
  child-king: {label: "A boy becomes king at a very young age (seven, eight)", cluster: kingship}
  high-places-not-removed: {label: "Formula: a good king, yet the high places were not removed", cluster: kingship}
  temple-repair-fund: {label: "The king organizes the collection of silver for repairing the temple", cluster: cult}
  collection-chest-with-hole: {label: "A chest with a hole bored in its lid set by the altar to collect donations", cluster: cult}
  honest-workmen-no-accounting: {label: "Workmen handling sacred funds are not audited because they deal faithfully", cluster: cult}
  temple-treasure-paid-as-tribute: {label: "King strips the temple and palace treasuries to buy off an invader", cluster: kingship}
  king-assassinated-by-servants: {label: "A king is murdered by his own servants in a conspiracy", cluster: kingship}
  source-citation-annals: {label: "Narrator cites a lost source: 'the book of the chronicles of the kings of Israel/Judah'", cluster: historiography}
  sins-of-jeroboam-formula: {label: "Formula: he did not depart from the sins of Jeroboam son of Nebat who made Israel sin", cluster: kingship}
  god-sends-a-savior: {label: "In answer to prayer God gives Israel an unnamed 'savior' (moshia)", cluster: kingship}
  army-reduced-to-remnant: {label: "An army is reduced by the enemy to a tiny remnant ('like dust at threshing')", cluster: warfare}
  chariot-of-israel-and-horsemen: {label: "The prophet hailed as 'My father, my father, the chariot of Israel and its horsemen'", cluster: prophecy}
  arrow-of-victory-symbolic-act: {label: "Prophet has the king shoot an arrow out of the window as a symbolic act of victory", cluster: prophecy}
  prophet-hands-on-kings-hands: {label: "Prophet lays his hands on the king's hands on the bow", cluster: prophecy}
  limited-strikes-limited-victory: {label: "King strikes the ground only three times, so his victories are limited to three", cluster: prophecy}
  dead-revived-by-prophets-bones: {label: "A corpse thrown into a prophet's grave touches his bones and comes back to life", cluster: miracles}
  covenant-with-patriarchs-remembered: {label: "God spares Israel for the sake of his covenant with Abraham, Isaac and Jacob", cluster: covenant}
  regicides-punished-sons-spared: {label: "New king executes his father's assassins but spares their sons, citing the law of Moses", cluster: law}
  conquered-place-renamed: {label: "A conquered city or rock is given a new name 'to this day'", cluster: etiology}
  plant-fable-thistle-and-cedar: {label: "Fable: the thistle asks the cedar for its daughter and is trampled by a wild beast", cluster: wisdom}
  challenge-let-us-look-each-other-in-face: {label: "King challenges a rival king: 'Come, let us look one another in the face' (battle)", cluster: warfare}
  hostages-taken: {label: "Conqueror carries off hostages (bene ta'aruvot) along with treasure", cluster: warfare}
  city-wall-breached: {label: "A section of the city wall is broken down by the victor", cluster: warfare}
  king-flees-to-lachish-killed: {label: "Fleeing king pursued to a refuge city and killed there", cluster: kingship}
  prophet-jonah-son-of-amittai: {label: "Jonah son of Amittai of Gath-hepher appears as a prophet of national restoration", cluster: prophecy}
  god-saves-despite-sin: {label: "God saves Israel out of pity for its affliction though the king does evil", cluster: theology}
  king-struck-with-skin-disease: {label: "God strikes a king with skin disease; he lives in isolation while his son rules", cluster: kingship}
  fourth-generation-dynasty-prophecy: {label: "Prophecy that a dynasty will last to the fourth generation is fulfilled", cluster: prophecy}
  short-reign-one-month: {label: "A usurper reigns only a month (or days) before being killed", cluster: kingship}
  ripping-open-pregnant-women: {label: "Conqueror rips open the pregnant women of a city", cluster: warfare}
  tribute-levied-per-head: {label: "Tribute to an empire raised as a fixed silver levy per wealthy man", cluster: kingship}
