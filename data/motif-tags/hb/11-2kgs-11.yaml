  aramean-concubine-ancestress: {label: "A tribe descends partly through an Aramean concubine", cluster: genealogy}
  daughters-only-heir-noted: {label: "Genealogy notes that a man (Zelophehad) had only daughters", cluster: genealogy}
  woman-titled-the-queen: {label: "An ancestress is called Hammolecheth, 'the one who reigns' (the queen)", cluster: genealogy}
  patriarchs-sons-killed-raiding-cattle: {label: "A patriarch's sons are killed by natives of Gath while trying to take their cattle", cluster: patriarchs}
  patriarch-mourns-brothers-comfort: {label: "The patriarch mourns many days and his brothers come to comfort him", cluster: patriarchs}
  child-named-for-misfortune: {label: "A son born after a family tragedy is named for the evil that befell the house (Beriah, 'in evil')", cluster: naming}
  woman-founds-cities: {label: "A woman (Sheerah) builds towns (Lower and Upper Beth-horon, Uzzen-sheerah)", cluster: genealogy}
  genealogy-of-joshua: {label: "Joshua son of Nun given a ten-generation genealogy from Ephraim", cluster: genealogy}
  wives-sent-away: {label: "Man sends away his wives (divorces them) and fathers sons by another wife in Moab", cluster: marriage}
  baal-names-uncensored: {label: "Royal names with the element Baal preserved (Eshbaal, Merib-baal), elsewhere changed to -bosheth 'shame'", cluster: naming}
  saulide-line-continued: {label: "Saul's line is traced through Jonathan for many generations after his death", cluster: kingship}
  archer-warriors-many-sons: {label: "Benjamite warriors who were archers with 150 sons and grandsons", cluster: genealogy}
  tribe-missing-from-genealogy: {label: "A tribe (Dan, Zebulun) is missing or barely present in the tribal genealogies", cluster: genealogy}
  exile-for-unfaithfulness-maal: {label: "Judah was exiled to Babylon 'for their unfaithfulness' (ma'al)", cluster: exile}
  returnees-list: {label: "List of those who resettled Jerusalem after the exile by tribe and family", cluster: exile}
  nethinim-temple-servants: {label: "The netinim ('given ones'), temple servants of foreign origin, listed with priests and Levites", cluster: cult}
  temple-gatekeepers-four-directions: {label: "Levite gatekeepers guard the temple on all four sides (east, west, north, south) in weekly shifts", cluster: cult}
  gatekeepers-instituted-by-david-and-samuel: {label: "The gatekeeper offices were founded by David and Samuel the seer", cluster: cult}
  keepers-of-the-key: {label: "Levites lodge around the temple and are in charge of the key to open it each morning", cluster: cult}
  vessels-counted-in-and-out: {label: "Sacred vessels are counted when brought in and taken out", cluster: cult}
  priests-mix-spices: {label: "Only priests compound the ointment of spices", cluster: cult}
  singers-on-duty-day-and-night: {label: "The singers are exempt from other duties because they are at work day and night", cluster: cult}
  king-suicide-by-own-sword: {label: "Wounded king falls on his own sword when his armor-bearer refuses to kill him, lest the uncircumcised abuse him", cluster: kingship}
  armor-bearer-follows-in-death: {label: "The armor-bearer falls on his sword and dies with his master", cluster: kingship}
  whole-house-dies-together: {label: "The king, his three sons and his whole house die together on one day", cluster: kingship}
  enemy-head-displayed-in-temple: {label: "The slain king's head (skull) is fastened in the temple of the enemy god and his armor dedicated there", cluster: warfare}
  news-proclaimed-to-idols: {label: "Victors send messengers to announce the good news to their idols and people", cluster: warfare}
  bodies-rescued-buried-under-tree: {label: "Loyal men retrieve the dead king's body and bury the bones under a tree, fasting seven days", cluster: kingship}
  death-for-consulting-medium: {label: "The king died for his unfaithfulness and for consulting a ghost-medium (ov) instead of God", cluster: divination}
  kingship-transferred-by-god: {label: "God himself turns the kingdom over to the new dynasty", cluster: kingship}
  we-are-your-bone-and-flesh: {label: "The tribes acclaim the new king: 'We are your bone and your flesh'", cluster: kingship}
  king-as-shepherd-of-people: {label: "God tells the chosen king 'You shall shepherd my people'", cluster: kingship}
  king-anointed-by-elders-covenant: {label: "The elders make a covenant with the king and anoint him", cluster: kingship}
  capture-of-jebus-zion: {label: "David captures the Jebusite stronghold of Zion, which becomes the City of David", cluster: kingship}
  first-to-strike-becomes-chief: {label: "Whoever strikes the enemy first will be made chief; Joab goes up first", cluster: warfare}
  roster-of-mighty-men: {label: "Roster of the king's champions (the Three and the Thirty) with their feats", cluster: heroes}
  champion-kills-three-hundred-with-spear: {label: "A champion wields his spear against three hundred slain at one time", cluster: heroes}
  stand-in-barley-field: {label: "Heroes hold a barley field alone when the people flee and win a great victory", cluster: heroes}
  water-from-bethlehem-well-poured-out: {label: "Heroes break through enemy lines to fetch water the king longed for; he pours it out to God as the blood of men", cluster: heroes}
  lion-killed-in-pit-on-snowy-day: {label: "Hero goes down into a pit and kills a lion on a snowy day", cluster: heroes}
  egyptian-giant-killed-with-own-spear: {label: "Hero armed with a staff snatches a giant Egyptian's spear and kills him with it", cluster: heroes}
  foreign-warriors-in-kings-guard: {label: "Foreigners (Uriah the Hittite, Zelek the Ammonite, Ithmah the Moabite) among the king's mighty men", cluster: kingship}
  ambidextrous-archers-slingers: {label: "Warriors who can sling stones and shoot arrows with right and left hand", cluster: warfare}
  warriors-faces-of-lions-swift-as-gazelles: {label: "Warriors with faces like lions and swift as gazelles on the mountains", cluster: heroes}
  river-crossed-in-flood: {label: "Warriors cross the Jordan in the first month when it overflows all its banks", cluster: warfare}
  spirit-clothes-a-man: {label: "The spirit 'clothes itself' with a man, who then speaks inspired words", cluster: prophecy}
  peace-peace-to-you: {label: "Inspired greeting 'Peace, peace to you and peace to your helpers, for your God helps you'", cluster: prophecy}
  camp-like-camp-of-god: {label: "A great army 'like the camp of God'", cluster: warfare}
  tribal-muster-for-coronation: {label: "Each tribe sends a numbered contingent to make the new king", cluster: kingship}
  men-who-understand-the-times: {label: "Issacharites 'who had understanding of the times, to know what Israel ought to do'", cluster: wisdom}
  single-hearted-loyalty: {label: "Warriors come 'with a whole heart', 'not with a double heart', with one heart to make the king", cluster: kingship}
  coronation-feast-three-days: {label: "Three days of eating and drinking at the coronation, with provisions brought on donkeys, camels, mules and oxen", cluster: kingship}
  ark-brought-up-with-music: {label: "The ark is brought up in procession with singing, lyres, harps, drums, cymbals and trumpets", cluster: cult}
  ark-on-new-cart: {label: "The ark is carried on a new cart drawn by oxen", cluster: cult}
  touching-ark-death: {label: "A man who reaches out to steady the ark when the oxen stumble is struck dead", cluster: cult}
  outburst-place-named: {label: "A place is named for God's 'breaking out' (perets) against someone (Perez-uzza, Baal-perazim)", cluster: etiology}
  ark-blesses-host-household: {label: "The ark stays three months in a foreigner's house and God blesses his household", cluster: cult}
  foreign-king-sends-cedar-and-craftsmen: {label: "The king of Tyre sends cedar timber and masons and carpenters to build the king's house", cluster: kingship}
  oracle-go-up-and-i-will-give: {label: "King inquires of God whether to attack and is told 'Go up, I will give them into your hand'", cluster: divination}
  breakthrough-like-bursting-waters: {label: "God broke through the enemy 'like a bursting of waters'", cluster: warfare}
  captured-enemy-gods-burned: {label: "Enemies abandon their gods on the battlefield and the victor has them burned", cluster: warfare}
  sound-of-marching-in-treetops: {label: "Signal to attack: the sound of marching in the tops of the baca (balsam) trees, as God goes out ahead", cluster: warfare}
  fear-of-king-on-nations: {label: "God puts the fear of the king on all the nations and his name goes out through the lands", cluster: kingship}
  only-levites-carry-ark: {label: "Only the Levites may carry the ark, on poles on their shoulders as Moses commanded", cluster: cult}
  first-failure-due-to-improper-procedure: {label: "The earlier disaster happened because they did not seek God according to the ordinance", cluster: cult}
  levitical-musical-guilds: {label: "Levite musicians appointed by name to cymbals, harps on alamoth and lyres on the sheminith", cluster: cult}
  musical-technical-terms: {label: "Obscure musical directions (al alamot, al ha-sheminit, le-natseah) also found in psalm headings", cluster: cult}
  seven-bulls-seven-rams: {label: "Seven bulls and seven rams sacrificed when God helps the Levites carry the ark", cluster: cult}
  king-in-linen-ephod-dances: {label: "The king, wearing a linen robe and ephod, dances and leaps before the ark", cluster: kingship}
  wife-despises-dancing-king: {label: "Michal watches from the window and despises the king dancing before the ark", cluster: kingship}
units:
  - id: hb-2kgs-11-athaliah-joash
    tradition: judaism
    title: Athaliah's usurpation and the hidden prince Joash
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["2Kgs 11:1-20"]
    tags:
      - {motif: queen-mother-massacres-royal-seed, refs: ["2Kgs 11:1"]}
      - {motif: royal-infant-hidden-in-temple, refs: ["2Kgs 11:2", "2Kgs 11:3"], note: "aunt Jehosheba steals him with his wet nurse into the 'chamber of beds'; hidden six years"}
      - {motif: priest-led-coup, refs: ["2Kgs 11:4", "2Kgs 11:9"], note: "in the seventh year; Carites and runners sworn in the temple"}
      - {motif: davids-weapons-in-temple, refs: ["2Kgs 11:10"]}
      - {motif: crown-and-testimony-coronation, refs: ["2Kgs 11:12"]}
      - {motif: long-live-the-king-acclamation, refs: ["2Kgs 11:12"], note: "with clapping of hands"}
      - {motif: king-stands-by-pillar-custom, refs: ["2Kgs 11:14"], note: "ka-mishpat, 'as was the custom'"}
      - {motif: cry-of-conspiracy, refs: ["2Kgs 11:14"], note: "qesher qesher"}
      - {motif: rend-garments-grief, refs: ["2Kgs 11:14"]}
      - {motif: no-killing-in-sanctuary, refs: ["2Kgs 11:15", "2Kgs 11:16"], note: "killed at the horses' entrance to the palace"}
      - {motif: covenant-king-people-god, refs: ["2Kgs 11:17"]}
      - {motif: baal-temple-destroyed-priest-killed, refs: ["2Kgs 11:18"], note: "Mattan priest of Baal"}
    hints:
      - "Hidden-heir-raised-in-sanctuary pattern: compare Ion at Delphi (Euripides), Moses, and the Cyrus/Kai Khusrau hidden-child cycles; Athaliah as foreign queen is paired with Jezebel."
  - id: hb-2kgs-12-joash-temple-repair
    tradition: judaism
    title: Joash repairs the temple; the collection chest; assassination
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["2Kgs 12:1-22"]
    tags:
      - {motif: child-king, refs: ["2Kgs 12:1"], note: "seven years old"}
      - {motif: high-places-not-removed, refs: ["2Kgs 12:4"]}
      - {motif: temple-repair-fund, refs: ["2Kgs 12:5", "2Kgs 12:6", "2Kgs 12:13"], note: "silver of persons' valuation and freewill silver"}
      - {motif: collection-chest-with-hole, refs: ["2Kgs 12:10"], note: "ark/chest (aron) with a hole bored in its lid, right of the altar"}
      - {motif: honest-workmen-no-accounting, refs: ["2Kgs 12:16"]}
      - {motif: temple-treasure-paid-as-tribute, refs: ["2Kgs 12:18", "2Kgs 12:19"], note: "to Hazael after he takes Gath"}
      - {motif: source-citation-annals, refs: ["2Kgs 12:20"]}
      - {motif: king-assassinated-by-servants, refs: ["2Kgs 12:21", "2Kgs 12:22"], note: "at Beth-millo on the way down to Silla"}
    hints:
      - "The temple chest anticipates the shofar-shaped collection boxes of the Second Temple (m. Sheqalim 6) and church alms boxes."
  - id: hb-2kgs-13-jehoahaz-elisha-death
    tradition: judaism
    title: Jehoahaz and Jehoash; Elisha's death and the miraculous bones
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["2Kgs 13:1-25"]
    tags:
      - {motif: sins-of-jeroboam-formula, refs: ["2Kgs 13:2", "2Kgs 13:6", "2Kgs 13:11"]}
      - {motif: god-sends-a-savior, refs: ["2Kgs 13:4", "2Kgs 13:5"]}
      - {motif: army-reduced-to-remnant, refs: ["2Kgs 13:7"], note: "fifty horsemen, ten chariots, ten thousand foot"}
      - {motif: baal-and-ashtaroth-worship, refs: ["2Kgs 13:6"], note: "the Asherah remained standing in Samaria"}
      - {motif: source-citation-annals, refs: ["2Kgs 13:8", "2Kgs 13:12"]}
      - {motif: chariot-of-israel-and-horsemen, refs: ["2Kgs 13:14"], note: "said by the king weeping over the dying Elisha"}
      - {motif: arrow-of-victory-symbolic-act, refs: ["2Kgs 13:15", "2Kgs 13:17"], note: "window opened eastward; 'arrow of YHWH's victory'"}
      - {motif: prophet-hands-on-kings-hands, refs: ["2Kgs 13:16"]}
      - {motif: limited-strikes-limited-victory, refs: ["2Kgs 13:18", "2Kgs 13:19", "2Kgs 13:25"]}
      - {motif: dead-revived-by-prophets-bones, refs: ["2Kgs 13:20", "2Kgs 13:21"], note: "corpse hastily thrown in when Moabite raiders appear"}
      - {motif: covenant-with-patriarchs-remembered, refs: ["2Kgs 13:23"]}
    hints:
      - "Elisha's bones are the classic proof-text for Christian relic cults (e.g. Cyril of Jerusalem, Catech. 18.16); compare Sirach 48:13-14."
      - "Belomancy/arrow divination: compare Ezek 21:21 and pre-Islamic Arab azlam (Quran 5:3)."
  - id: hb-2kgs-14-amaziah-jeroboam
    tradition: judaism
    title: Amaziah's war with Jehoash and the fable of the thistle; Jeroboam II
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["2Kgs 14:1-29"]
    tags:
      - {motif: high-places-not-removed, refs: ["2Kgs 14:4"]}
      - {motif: regicides-punished-sons-spared, refs: ["2Kgs 14:5", "2Kgs 14:6"]}
      - {motif: individual-responsibility-no-vicarious-death, refs: ["2Kgs 14:6"], note: "explicit quotation of the book of the Torah of Moses (Deut 24:16)"}
      - {motif: conquered-place-renamed, refs: ["2Kgs 14:7"], note: "Sela renamed Joktheel"}
      - {motif: challenge-let-us-look-each-other-in-face, refs: ["2Kgs 14:8", "2Kgs 14:11"]}
      - {motif: plant-fable-thistle-and-cedar, refs: ["2Kgs 14:9", "2Kgs 14:10"]}
      - {motif: fable-of-trees-choosing-king, refs: ["2Kgs 14:9"], note: "second plant fable of the Former Prophets; here the thorn presumes to marry"}
      - {motif: city-wall-breached, refs: ["2Kgs 14:13"], note: "400 cubits from Ephraim Gate to Corner Gate"}
      - {motif: hostages-taken, refs: ["2Kgs 14:14"]}
      - {motif: king-flees-to-lachish-killed, refs: ["2Kgs 14:19", "2Kgs 14:20"], note: "body brought back on horses"}
      - {motif: prophet-jonah-son-of-amittai, refs: ["2Kgs 14:25"]}
      - {motif: god-saves-despite-sin, refs: ["2Kgs 14:26", "2Kgs 14:27"], note: "'none shut up and none left'; God had not said he would blot out Israel's name"}
      - {motif: sins-of-jeroboam-formula, refs: ["2Kgs 14:24"]}
      - {motif: source-citation-annals, refs: ["2Kgs 14:15", "2Kgs 14:18", "2Kgs 14:28"]}
    hints:
      - "The only historical anchor for the prophet of the book of Jonah (Quran's Yunus/Dhu al-Nun)."
      - "Plant-disputation fables: compare Mesopotamian Tamarisk and Palm and Aesop's oak and reed."
  - id: hb-2kgs-15-azariah-and-usurpers
    tradition: judaism
    title: Azariah the leper; the usurper kings of Israel; Tiglath-pileser
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["2Kgs 15:1-38"]
    tags:
      - {motif: high-places-not-removed, refs: ["2Kgs 15:4", "2Kgs 15:35"]}
      - {motif: king-struck-with-skin-disease, refs: ["2Kgs 15:5"], note: "dwelt in the beit ha-hofshit ('house of freedom/separation')"}
      - {motif: fourth-generation-dynasty-prophecy, refs: ["2Kgs 15:12"]}
      - {motif: regicide-chain, refs: ["2Kgs 15:10", "2Kgs 15:14", "2Kgs 15:25", "2Kgs 15:30"]}
      - {motif: king-assassinated-by-servants, refs: ["2Kgs 15:25"], note: "by his officer, with Argob and Arieh ('the lion') and fifty Gileadites"}
      - {motif: short-reign-one-month, refs: ["2Kgs 15:13"], note: "Shallum reigns a month of days; Zechariah six months (15:8)"}
      - {motif: ripping-open-pregnant-women, refs: ["2Kgs 15:16"]}
      - {motif: assyrian-king-named, refs: ["2Kgs 15:19", "2Kgs 15:29"], note: "Pul and Tiglath-pileser"}
      - {motif: tribute-levied-per-head, refs: ["2Kgs 15:19", "2Kgs 15:20"], note: "1000 talents, 50 shekels per man of wealth"}
      - {motif: deportation-to-assyria, refs: ["2Kgs 15:29"]}
      - {motif: sins-of-jeroboam-formula, refs: ["2Kgs 15:9", "2Kgs 15:18", "2Kgs 15:24", "2Kgs 15:28"]}
      - {motif: source-citation-annals, refs: ["2Kgs 15:6", "2Kgs 15:11", "2Kgs 15:15", "2Kgs 15:21", "2Kgs 15:26", "2Kgs 15:31", "2Kgs 15:36"]}
    hints:
      - "Chronicles (2Chr 26) explains the leprosy as punishment for offering incense; Josephus adds an earthquake. Compare the Quran's general theme of kings struck down for hubris."
  - id: hb-2kgs-16-ahaz-altar
    tradition: judaism
    title: Ahaz sacrifices his son, buys Assyrian help and copies the Damascus altar
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["2Kgs 16:1-20"]
    tags:
      - {motif: child-passed-through-fire, refs: ["2Kgs 16:3"]}
      - {motif: high-places-green-trees, refs: ["2Kgs 16:4"]}
      - {motif: vassal-your-servant-and-son, refs: ["2Kgs 16:7"]}
      - {motif: temple-treasure-paid-as-tribute, refs: ["2Kgs 16:8"], note: "called a shohad, 'bribe'"}
      - {motif: deportation-to-assyria, refs: ["2Kgs 16:9"], note: "Damascus deported to Kir"}
      - {motif: foreign-altar-copied, refs: ["2Kgs 16:10", "2Kgs 16:11"], note: "a 'likeness and pattern' (demut, tavnit) sent to Uriah the priest"}
      - {motif: king-offers-sacrifice-himself, refs: ["2Kgs 16:12", "2Kgs 16:13"]}
      - {motif: bronze-altar-reserved-for-inquiry, refs: ["2Kgs 16:14", "2Kgs 16:15"], note: "'shall be for me to inquire' (le-vaqqer)"}
      - {motif: temple-bronzes-dismantled, refs: ["2Kgs 16:17", "2Kgs 16:18"], note: "sea set on a stone pavement; sabbath covered way removed 'because of the king of Assyria'"}
      - {motif: source-citation-annals, refs: ["2Kgs 16:19"]}
  - id: hb-2kgs-17-fall-of-samaria
    tradition: judaism
    title: Fall of Samaria and the sermon on Israel's exile
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["2Kgs 17:1-23"]
    tags:
      - {motif: assyrian-king-named, refs: ["2Kgs 17:3"], note: "Shalmaneser; So king of Egypt (17:4)"}
      - {motif: vassal-withholds-tribute-seeks-egypt, refs: ["2Kgs 17:4"]}
      - {motif: three-year-siege, refs: ["2Kgs 17:5"]}
      - {motif: deportation-to-assyria, refs: ["2Kgs 17:6", "2Kgs 17:23"], note: "Halah, Habor river of Gozan, cities of the Medes"}
