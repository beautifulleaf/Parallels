    title: The resettled peoples, the lions and the syncretistic cult of Samaria
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["2Kgs 17:24-41"]
    tags:
      - {motif: population-exchange-resettlement, refs: ["2Kgs 17:24"], note: "from Babylon, Cuthah, Avva, Hamath, Sepharvaim"}
      - {motif: lions-sent-on-settlers, refs: ["2Kgs 17:25", "2Kgs 17:26"]}
      - {motif: god-of-the-land-law, refs: ["2Kgs 17:26", "2Kgs 17:27"]}
      - {motif: priest-repatriated-to-teach-cult, refs: ["2Kgs 17:27", "2Kgs 17:28"], note: "settles at Bethel"}
      - {motif: foreign-gods-catalogue, refs: ["2Kgs 17:30", "2Kgs 17:31"]}
      - {motif: children-burned-to-foreign-gods, refs: ["2Kgs 17:31"], note: "Sepharvites to Adrammelech and Anammelech"}
      - {motif: syncretism-fear-god-serve-idols, refs: ["2Kgs 17:32", "2Kgs 17:33", "2Kgs 17:41"]}
      - {motif: mutual-covenant-declaration, refs: ["2Kgs 17:35", "2Kgs 17:38"], note: "covenant recalled: fear no other gods"}
