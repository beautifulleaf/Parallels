      - {motif: high-places-green-trees, refs: ["2Kgs 17:9", "2Kgs 17:10"], note: "'from watchtower to fortified city'"}
      - {motif: prophets-warned-repeatedly, refs: ["2Kgs 17:13", "2Kgs 17:14"]}
      - {motif: stiff-necked-people, refs: ["2Kgs 17:14"]}
      - {motif: idols-called-elilim, refs: ["2Kgs 17:15"], note: "here hevel, 'they went after vanity and became vain'"}
      - {motif: golden-calf, refs: ["2Kgs 17:16"], note: "two molten calves"}
      - {motif: worship-of-host-of-heaven, refs: ["2Kgs 17:16"]}
      - {motif: child-passed-through-fire, refs: ["2Kgs 17:17"]}
      - {motif: divination-practiced, refs: ["2Kgs 17:17"]}
      - {motif: sins-of-jeroboam-formula, refs: ["2Kgs 17:21", "2Kgs 17:22"]}
