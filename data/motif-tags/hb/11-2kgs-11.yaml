  god-planned-it-long-ago: {label: "God says the conqueror's victories were planned by him long ago; the conqueror is only his instrument", cluster: theology}
  hook-in-nose-bridle-in-lips: {label: "God will put his hook in the enemy king's nose and his bit in his lips and lead him back", cluster: poetry}
  three-year-sign-aftergrowth: {label: "Sign: this year eat aftergrowth, next year what springs of itself, the third year sow and reap", cluster: prophecy}
  remnant-takes-root-downward: {label: "The escaped remnant shall again take root downward and bear fruit upward; a remnant goes out from Zion", cluster: prophecy}
