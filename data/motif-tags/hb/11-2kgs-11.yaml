  silence-ordered-before-enemy: {label: "The people keep silent and do not answer the enemy at the king's command", cluster: warfare}
  king-in-sackcloth-enters-temple: {label: "The king tears his clothes, puts on sackcloth and goes into the temple in crisis", cluster: cult}
  children-at-birthstool-no-strength: {label: "Proverb of crisis: children have come to the birth-stool and there is no strength to deliver", cluster: wisdom}
  mocking-the-living-god: {label: "The enemy is said to reproach (harref) 'the living God'", cluster: theology}
  rumor-sends-invader-home: {label: "God puts a spirit in the invader so that he hears a rumor and returns home", cluster: warfare}
  threatening-letter-spread-before-god: {label: "King spreads the enemy's threatening letter before God in the temple", cluster: cult}
  enthroned-on-cherubim: {label: "God addressed as enthroned (yoshev) on the cherubim", cluster: theology}
