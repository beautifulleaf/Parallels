  children-burned-to-foreign-gods: {label: "A people burns its children in fire to its gods", cluster: cult}
  bronze-serpent-destroyed: {label: "King smashes the bronze serpent made by Moses, called Nehushtan, because people burned incense to it", cluster: cult}
  incomparable-king: {label: "Formula: there was none like him among all the kings before or after", cluster: kingship}
  emissaries-dialogue-at-wall: {label: "Enemy envoy addresses the besieged at the city wall to break their morale", cluster: warfare}
  broken-reed-egypt: {label: "Egypt likened to a broken reed staff that pierces the hand of whoever leans on it", cluster: wisdom}
  enemy-claims-divine-mandate: {label: "Invader claims the defenders' own god sent him to destroy the land", cluster: warfare}
  speak-aramaic-not-judean: {label: "Officials ask the envoy to speak Aramaic, not Judean, so the people on the wall will not understand", cluster: language}
  besieged-eat-own-excrement: {label: "Threat that the besieged will eat their own dung and drink their urine", cluster: warfare}
  vine-and-fig-tree: {label: "Each man under his own vine and fig tree, drinking from his own cistern", cluster: prosperity}
  promise-of-better-land-in-exile: {label: "Invader promises deportees a land like their own, of grain, wine, oil and honey", cluster: exile}
