units:
  - id: hb-job-36-elihu-discipline
    tradition: judaism
    title: Elihu on God's justice and suffering as discipline
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Job 36:1-25"]
    tags:
      - {motif: suffering-as-divine-discipline, refs: ["Job 36:8-10", "Job 36:15"], note: "'he opens their ear to discipline'; 'he delivers the afflicted by his affliction'"}
      - {motif: god-takes-no-bribe, refs: ["Job 36:18"], note: "warning to Job not to be turned aside by a great ransom (kofer)"}
      - {motif: god-exalts-kings-and-lowly, refs: ["Job 36:6-7"], note: "God gives the poor justice and seats kings on the throne forever"}
      - {motif: who-can-say-god-did-wrong, refs: ["Job 36:23"]}
    hints:
      - "Elihu's 'pedagogy of suffering' recalls Prov 3:11-12 and Heb 12:5-11; rabbinic yissurin shel ahavah (afflictions of love), b. Ber. 5a."
  - id: hb-job-36-elihu-storm-hymn
