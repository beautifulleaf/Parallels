    tagger: Claude (model), reading the Hebrew
    read: ["Job 36:26-37:24"]
    tags:
      - {motif: god-years-unsearchable, refs: ["Job 36:26"]}
      - {motif: water-cycle-evaporation, refs: ["Job 36:27-28"], note: "yegara nitfei mayim, yazoqqu matar le'edo: he draws up drops; they distill rain from his mist"}
      - {motif: god-pavilion-of-clouds, refs: ["Job 36:29"], note: "teshuot sukkato, 'the thunderings of his booth'"}
      - {motif: thunder-as-voice-of-god, refs: ["Job 37:2-5"]}
      - {motif: god-commands-snow-and-rain, refs: ["Job 37:6"]}
      - {motif: winds-from-chambers, refs: ["Job 37:9"]}
      - {motif: ice-from-breath-of-god, refs: ["Job 37:10"], note: "minnishmat El yitten qerah"}
      - {motif: sky-as-cast-metal-mirror, refs: ["Job 37:18"], note: "tarqia (cf. raqia) the skies, strong as a molten mirror"}
      - {motif: divine-splendor-from-north, refs: ["Job 37:22"], note: "mitsafon zahav ye'eteh"}
      - {motif: god-seals-every-mans-hand, refs: ["Job 37:7"], note: "in winter God seals up the hand of every man so all may know his work"}
    hints:
      - "Cloud-gathering storm god (Baal 'rider of clouds', Zeus nephelegereta); 'gold from the north' has been linked to Zaphon, Baal's mountain."
