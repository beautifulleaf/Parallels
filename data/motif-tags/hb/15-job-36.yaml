new_motifs:
  suffering-as-divine-discipline: {label: "Affliction is God's instruction: he opens the sufferer's ear through suffering so he may turn back", cluster: wisdom}
  god-years-unsearchable: {label: "The number of God's years cannot be searched out", cluster: theology}
  water-cycle-evaporation: {label: "God draws up drops of water which distill as rain from his mist (evaporation and rainfall cycle)", cluster: cosmology}
  thunder-as-voice-of-god: {label: "Thunder is the roaring voice of God", cluster: theophany}
  god-commands-snow-and-rain: {label: "God speaks to the snow 'Fall on the earth' and commands the downpour", cluster: cosmology}
  ice-from-breath-of-god: {label: "Ice and frozen waters are produced by the breath of God", cluster: cosmology}
  winds-from-chambers: {label: "Storm-wind comes out of a chamber (heder) and cold from the scattering winds", cluster: cosmology}
  sky-as-cast-metal-mirror: {label: "God beat out the skies hard as a molten mirror of cast metal", cluster: cosmology}
  divine-splendor-from-north: {label: "Golden splendor comes out of the north as God's awesome majesty", cluster: cosmology}
  god-answers-from-whirlwind: {label: "God answers the sufferer out of the storm-wind (se'arah)", cluster: theophany}
  gird-loins-like-a-man: {label: "God challenges the human: 'Gird your loins like a man; I will question you and you inform me'", cluster: wisdom}
  where-were-you-at-creation: {label: "Rhetorical divine questions: where were you when I founded the earth? Do you know...?", cluster: wisdom}
  earth-founded-like-building: {label: "Earth built like a structure with measurements, measuring line, sunk bases and a cornerstone", cluster: creation}
  morning-stars-sing-at-creation: {label: "The morning stars sing together and the sons of God shout for joy at the founding of the earth", cluster: creation}
  sea-born-from-womb: {label: "The sea bursts out of a womb at creation and is swaddled in cloud and thick darkness", cluster: creation}
  sea-bounded-thus-far: {label: "God fixes a limit, bars and doors for the sea: 'Thus far you shall come and no farther'", cluster: creation}
  dawn-shakes-out-wicked: {label: "Dawn seizes the edges of the earth and shakes the wicked out of it", cluster: cosmology}
  springs-of-the-sea-and-depths: {label: "The springs of the sea and the recesses of the deep (tehom) as unexplored regions", cluster: cosmology}
  gates-of-death: {label: "Death or Sheol has gates (sha'arei mavet)", cluster: cosmology}
  dwelling-place-of-light-and-darkness: {label: "Light and darkness each have a dwelling place and a road to it", cluster: cosmology}
  storehouses-of-snow-and-hail: {label: "Storehouses of snow and hail reserved for the day of battle", cluster: cosmology}
  father-of-rain-womb-of-ice: {label: "Rhetorical question whether rain has a father and from whose womb ice and hoarfrost are born", cluster: cosmology}
  named-constellations: {label: "Named constellations (Kimah/Pleiades, Kesil/Orion, Ayish/Bear, Mazzarot) and their bonds", cluster: cosmology}
  laws-of-heaven: {label: "The 'statutes of the heavens' (huqqot shamayim) and their rule over the earth", cluster: cosmology}
  lightnings-answer-here-we-are: {label: "Lightnings sent by God report back 'Here we are'", cluster: cosmology}
  god-feeds-wild-animals: {label: "God provides prey for the lion and food for the raven's young that cry to him", cluster: theology}
  catalogue-of-wild-animals: {label: "Catalogue of wild animals (mountain goat, wild ass, wild ox, ostrich, horse, hawk, eagle) beyond human control", cluster: wisdom}
  wild-ass-free-of-driver: {label: "The wild ass, set free by God, laughs at the city's tumult and hears no driver's shout", cluster: wisdom}
  wild-ox-will-not-serve: {label: "The wild ox (re'em) will not serve man, plow the furrow or spend the night at his crib", cluster: wisdom}
  ostrich-abandons-eggs: {label: "The ostrich leaves her eggs in the dust, forgetting a foot may crush them, for God deprived her of wisdom", cluster: wisdom}
  warhorse-laughs-at-fear: {label: "The warhorse with thundering mane paws the valley, laughs at fear and says 'Aha!' at the trumpet", cluster: wisdom}
  eagle-young-drink-blood: {label: "The eagle nests on the crag; where the slain are, there it is, and its young drink blood", cluster: wisdom}
  hand-over-mouth-silence: {label: "The speaker lays his hand on his mouth and vows to speak no more", cluster: gesture}
  human-challenged-to-play-god: {label: "God dares the human to put on majesty, pour out wrath and humble every proud one", cluster: theology}
  behemoth: {label: "Behemoth, a colossal land beast made by God, eats grass like an ox, has bones of bronze and drinks a river", cluster: cosmology}
  behemoth-first-of-gods-works: {label: "The monster is 'the first of the ways of God'; only its maker can approach it with his sword", cluster: cosmology}
  leviathan: {label: "Leviathan, the great sea monster, named", cluster: cosmology}
  monster-cannot-be-caught-with-hook: {label: "Can you draw out Leviathan with a hook, put a cord in his nose, make him a pet or a slave forever?", cluster: cosmology}
  fire-breathing-monster: {label: "Monster's sneezes flash light, torches and sparks leap from its mouth, smoke from its nostrils", cluster: cosmology}
  eyes-like-eyelids-of-dawn: {label: "The monster's eyes are like the eyelids of dawn", cluster: cosmology}
  gods-fear-the-monster: {label: "Even the gods (elim) are afraid when the monster rises", cluster: cosmology}
  weapons-useless-against-monster: {label: "Sword, spear, dart, arrows and sling stones are like straw against the monster", cluster: cosmology}
  monster-boils-the-deep: {label: "The monster makes the deep boil like a pot and leaves a shining wake; the abyss seems white-haired", cluster: cosmology}
  monster-king-over-proud-beasts: {label: "The monster is king over all the proud beasts; none on earth is its equal", cluster: cosmology}
  hearing-then-seeing-god: {label: "I had heard of you by the hearing of the ear, but now my eye sees you", cluster: theophany}
  friends-rebuked-by-god: {label: "God declares his anger at the sufferer's friends for not speaking rightly of him as his servant did", cluster: wisdom}
  seven-bulls-seven-rams: {label: "An offering of seven bulls and seven rams", cluster: sacrifice}
  sufferer-intercedes-for-friends: {label: "The vindicated sufferer prays for the friends who wronged him and is restored as he prays", cluster: intercession}
  fortunes-restored-twofold: {label: "God restores the righteous sufferer's fortunes and gives him twice what he had", cluster: wisdom}
  kin-bring-coin-and-gold-ring: {label: "Kin and acquaintances console him and each gives a qesitah (coin) and a gold ring", cluster: wisdom}
  restored-children-same-number: {label: "The restored sufferer has again seven sons and three daughters (children not doubled)", cluster: wisdom}
  daughters-named-beautiful-heirs: {label: "Three named daughters (Jemimah, Keziah, Keren-happuch), the most beautiful in the land, inherit among their brothers", cluster: wisdom}
  sees-four-generations: {label: "The patriarch lives to see his descendants to the fourth generation", cluster: genealogy}
  god-exalts-kings-and-lowly: {label: "God gives justice to the poor and seats kings (or the lowly) on the throne", cluster: theology}
  who-can-say-god-did-wrong: {label: "Who has prescribed God's way, or who can say 'You have done wrong'?", cluster: theology}
  god-pavilion-of-clouds: {label: "God's booth or canopy (sukkah) is made of thunderclouds and darkness", cluster: theophany}
  god-seals-every-mans-hand: {label: "In the winter storm God seals up every man's hand (stops human work) so all may know him", cluster: cosmology}
  rain-on-uninhabited-desert: {label: "God sends rain on the desert where no human lives, to make grass sprout", cluster: theology}
  wisdom-given-to-ibis-and-cock: {label: "God has put wisdom in the tuhot and given understanding to the sekhvi (ibis/cock)", cluster: wisdom}
  water-skins-of-heaven: {label: "The clouds are the water-skins (bottles) of heaven which God tips over", cluster: cosmology}
  animal-gestation-known-only-to-god: {label: "Only God knows when the mountain goats and hinds give birth and counts their months", cluster: wisdom}
  hawk-migrates-south: {label: "By God's wisdom the hawk soars and spreads its wings toward the south", cluster: wisdom}
  mountains-bring-monster-food: {label: "The mountains bring the monster their produce and all wild beasts play beside it", cluster: cosmology}
  who-has-given-to-god-first: {label: "No one has given to God first that he should repay; all under heaven is his", cluster: theology}
  monster-armored-scales: {label: "The monster's back is rows of shields sealed so tight no air comes between", cluster: cosmology}
  psalm-ascribed-to-david: {label: "Psalm superscription ascribes the poem to David (le-david)", cluster: psalms}
  psalm-for-the-leader: {label: "Superscription 'for the leader/choirmaster' (lamenatseah)", cluster: psalms}
  psalm-musical-term: {label: "Superscription contains an obscure musical or liturgical term (neginot, nehilot, sheminit, gittit, alamot, shiggayon, maskil, miktam, shoshannim...)", cluster: psalms}
  psalm-historical-superscription: {label: "Superscription sets the psalm in a specific episode of David's life", cluster: psalms}
  selah: {label: "The marker selah interrupts the psalm", cluster: psalms}
  ashrei-beatitude: {label: "Beatitude formula 'Happy (ashrei) is the man who...'", cluster: psalms}
  two-ways-righteous-and-wicked: {label: "Contrast of the way of the righteous, which God knows, and the way of the wicked, which perishes", cluster: wisdom}
  righteous-as-tree-by-water: {label: "The righteous man is like a tree planted by streams of water, bearing fruit in season, leaf never withering", cluster: wisdom}
  wicked-as-chaff: {label: "The wicked are like chaff driven by the wind", cluster: wisdom}
  nations-rage-against-anointed: {label: "Nations and kings of the earth conspire against YHWH and his anointed (mashiah)", cluster: kingship}
  god-laughs-at-enemies: {label: "God in heaven laughs at and mocks those who plot against him or the righteous", cluster: theology}
  king-enthroned-on-zion: {label: "God installs his king on Zion, his holy mountain", cluster: kingship}
  king-begotten-as-gods-son: {label: "God tells the king 'You are my son; today I have begotten you'", cluster: kingship}
  rod-of-iron-potters-vessel: {label: "The king will break the nations with a rod of iron and shatter them like a potter's vessel", cluster: kingship}
  kiss-the-son: {label: "Rulers told to serve God with trembling and 'kiss the son' (nashqu bar)", cluster: kingship}
  refuge-in-god-blessed: {label: "Happy are all who take refuge (hosim) in God", cluster: psalms}
  lament-many-foes: {label: "Individual lament: the speaker's foes are many and say God will not save him", cluster: psalms}
  god-as-shield: {label: "God is called the speaker's shield (magen)", cluster: theology}
  god-lifts-the-head: {label: "God is 'the lifter of my head'", cluster: theology}
  god-answers-from-holy-mountain: {label: "God answers the petitioner from his holy mountain or sanctuary", cluster: theology}
  sleep-in-safety-under-god: {label: "The trusting speaker lies down and sleeps in peace and wakes, for God sustains him", cluster: psalms}
  arise-yhwh-call: {label: "Call to God to arise (qumah YHWH) and save or judge", cluster: psalms}
  god-breaks-teeth-of-wicked: {label: "God strikes the enemies on the cheek and breaks the teeth of the wicked", cluster: psalms}
  light-of-gods-face: {label: "Prayer that God lift up the light of his face on the petitioner", cluster: theology}
  morning-prayer: {label: "The petitioner prays and sets out his case in the morning and waits", cluster: cult}
  throat-an-open-grave: {label: "The enemies' throat is an open grave; they flatter with their tongue", cluster: psalms}
  prostration-toward-temple: {label: "The speaker bows down toward God's holy temple (heikhal)", cluster: cult}
  god-hates-evildoers: {label: "God hates all evildoers and abhors the man of blood and deceit", cluster: theology}
  no-praise-from-the-dead: {label: "In death there is no remembrance of God; in Sheol who will praise him?", cluster: death}
  bed-flooded-with-tears: {label: "The sufferer floods his bed with tears every night", cluster: psalms}
  how-long-o-lord: {label: "Lament cry 'How long, YHWH?' (ad matai / ad anah)", cluster: psalms}
  depart-evildoers-god-has-heard: {label: "The speaker turns on his enemies: 'Depart from me, all evildoers, for God has heard'", cluster: psalms}
  conditional-self-curse-of-innocence: {label: "Oath of innocence: 'If I have done this... let the enemy pursue and trample me'", cluster: psalms}
  god-tests-hearts-and-kidneys: {label: "God tests the hearts and the kidneys (inner self)", cluster: theology}
  god-sharpens-sword-strings-bow: {label: "God whets his sword and strings his bow, preparing deadly fiery arrows", cluster: theology}
  pregnant-with-mischief: {label: "The wicked conceives mischief, is pregnant with trouble and gives birth to falsehood", cluster: wisdom}
  digger-falls-into-own-pit: {label: "He who digs a pit or hides a net is caught in it himself", cluster: wisdom}
  enemy-likened-to-lion: {label: "The enemy is like a lion that tears the speaker's soul or lurks in ambush", cluster: psalms}
  name-of-god-majestic-in-all-earth: {label: "Refrain: 'How majestic is your name in all the earth!'", cluster: psalms}
  praise-from-mouths-of-babes: {label: "From the mouths of infants and sucklings God established strength against his foes", cluster: theology}
  heavens-work-of-gods-fingers: {label: "The heavens, moon and stars are the work of God's fingers", cluster: creation}
  what-is-man: {label: "'What is man that you remember him, the son of man that you visit him?'", cluster: theology}
  man-little-less-than-gods: {label: "Man made a little lower than elohim and crowned with glory and honor", cluster: theology}
  god-enthroned-as-judge: {label: "God sits enthroned forever, his throne established for judgment of the world", cluster: theology}
  name-of-wicked-blotted-out: {label: "God blots out the name of the wicked forever; their memory perishes", cluster: judgment}
  avenger-of-blood-remembers-poor: {label: "God who avenges blood remembers and does not forget the cry of the afflicted", cluster: theology}
  wicked-return-to-sheol: {label: "The wicked and all nations who forget God return to Sheol", cluster: death}
  nations-know-they-are-mortal: {label: "Let the nations know they are but men (enosh)", cluster: theology}
  acrostic-poem: {label: "The poem is an alphabetic acrostic (lines or stanzas begin with successive letters)", cluster: psalms}
  ends-of-earth-as-inheritance: {label: "God gives the king the nations as inheritance and the ends of the earth as possession", cluster: kingship}
  commune-with-heart-on-bed: {label: "Speak in your heart upon your bed and be still", cluster: psalms}
  joy-greater-than-harvest: {label: "God's gift of joy exceeds the joy of abundant grain and new wine", cluster: psalms}
  god-addressed-as-my-king: {label: "The petitioner addresses God as 'my King and my God'", cluster: theology}
  rebuke-not-in-anger: {label: "Plea: 'Do not rebuke me in your anger nor chasten me in your wrath'", cluster: psalms}
  bones-shaken-in-sickness: {label: "The sufferer's bones are terrified or wasted in sickness", cluster: psalms}
  assembly-of-peoples-around-god: {label: "The congregation of peoples surrounds God as he takes his seat on high to judge", cluster: theology}
  why-does-god-stand-far-off: {label: "Lament cry: 'Why, YHWH, do you stand far off and hide in times of trouble?'", cluster: psalms}
  wicked-says-god-does-not-see: {label: "The wicked says in his heart that God has forgotten, hidden his face and will never see or require", cluster: theology}
  fool-says-no-god: {label: "The fool (or wicked) says in his heart 'There is no God'", cluster: theology}
  god-helper-of-orphan: {label: "God is the helper of the orphan and judges for the orphan and the oppressed", cluster: theology}
  yhwh-king-forever: {label: "YHWH is king forever and ever", cluster: theology}
  flee-like-bird-to-mountain: {label: "The righteous is told to flee like a bird to the mountain", cluster: psalms}
  foundations-destroyed: {label: "If the foundations (shatot) are destroyed, what can the righteous do?", cluster: psalms}
  god-throne-in-heaven-eyelids-test: {label: "God's throne is in heaven; his eyes behold and his eyelids test humankind", cluster: theology}
  rain-of-fire-and-sulfur-cup: {label: "God rains coals, fire, sulfur and scorching wind on the wicked as the portion of their cup", cluster: judgment}
  upright-behold-gods-face: {label: "The upright shall behold God's face", cluster: theology}
  faithful-vanished-from-earth: {label: "The godly man is gone; the faithful have vanished from among humankind", cluster: psalms}
  smooth-lips-boastful-tongue: {label: "Flattering lips and a boastful tongue: 'With our tongue we prevail; who is lord over us?'", cluster: psalms}
  oracle-of-god-rising-for-poor: {label: "Embedded divine oracle: 'Because the poor are plundered, now I will arise,' says YHWH", cluster: prophecy}
  words-of-god-silver-refined-seven-times: {label: "God's words are pure, silver refined in a furnace, purified seven times", cluster: theology}
  god-looks-down-from-heaven: {label: "God looks down from heaven on humankind to see if any seek him", cluster: theology}
  none-does-good-not-one: {label: "All have turned aside; there is none that does good, not even one", cluster: theology}
  enemies-eat-my-people-like-bread: {label: "Evildoers devour God's people as they eat bread", cluster: psalms}
  restoration-from-zion-shuv-shevut: {label: "Hope that God will 'restore the fortunes' (shuv shevut) of his people from Zion", cluster: psalms}
  entrance-liturgy-who-may-dwell: {label: "Entrance liturgy: 'Who may dwell on your holy mountain?' answered by a list of ethical qualifications", cluster: cult}
  keeps-oath-to-own-hurt: {label: "The righteous keeps his oath even to his own hurt and does not change", cluster: ethics}
  yhwh-my-portion-and-cup: {label: "YHWH is my allotted portion and my cup; you hold my lot", cluster: theology}
  pleasant-boundary-lines: {label: "The measuring lines have fallen for me in pleasant places; a goodly inheritance", cluster: psalms}
  kidneys-instruct-at-night: {label: "My kidneys (inner self) instruct me in the night", cluster: psalms}
  god-always-before-me: {label: "I have set YHWH always before me; he is at my right hand", cluster: theology}
  not-abandoned-to-sheol: {label: "God will not abandon the speaker's soul to Sheol nor let his faithful one see the pit", cluster: death}
  path-of-life-pleasures-at-right-hand: {label: "God shows the path of life; fullness of joy in his presence, pleasures at his right hand forever", cluster: theology}
  refusal-of-idol-libations-of-blood: {label: "The speaker will not pour the blood libations of other gods' followers nor take their names on his lips", cluster: idolatry}
  tested-by-night-refined: {label: "God has tried the speaker's heart, visited him by night and refined him and found nothing", cluster: psalms}
  wicked-satisfied-with-children: {label: "The worldly men whose portion is in this life fill their belly and leave their surplus to their children", cluster: wisdom}
  awake-satisfied-with-gods-likeness: {label: "On waking the speaker will be satisfied with seeing God's form (temunah)", cluster: theology}
  wicked-archers-in-darkness: {label: "The wicked bend the bow and fit the arrow to shoot the upright in darkness", cluster: psalms}
  sleep-of-death: {label: "Death described as sleep: 'lest I sleep the sleep of death'", cluster: death}
  lament-turns-to-praise: {label: "The lament ends abruptly in confidence and a vow to sing praise", cluster: psalms}
  no-slander: {label: "The righteous does not slander with his tongue or take up reproach against his neighbor", cluster: ethics}
  holy-ones-in-the-land: {label: "Obscure reference to 'the holy ones who are in the land' and 'the mighty ones'", cluster: theology}
  royal-thanksgiving-for-deliverance: {label: "The king gives thanks for God's deliverance from all his enemies (song also in 2 Sam 22)", cluster: kingship}
  string-of-divine-epithets-rock-fortress: {label: "God addressed with a string of protective epithets: rock, fortress, deliverer, shield, horn of salvation, stronghold", cluster: theology}
  cords-of-death-and-torrents-of-belial: {label: "Cords of death and Sheol and torrents of Belial (destruction) engulf the speaker", cluster: death}
  storm-theophany-descent: {label: "God bows the heavens and comes down with smoke from his nostrils, fire from his mouth and darkness under his feet", cluster: theophany}
  god-rides-cherub-wings-of-wind: {label: "God rides on a cherub and flies, swooping on the wings of the wind", cluster: theophany}
  darkness-as-gods-hiding-place: {label: "God makes darkness his hiding place and dark waters and clouds his canopy", cluster: theophany}
  sea-bed-and-world-foundations-exposed: {label: "At God's rebuke the channels of the sea are seen and the foundations of the world laid bare", cluster: cosmology}
  drawn-out-of-many-waters: {label: "God reaches down from on high and draws the speaker out of many waters", cluster: psalms}
  god-reciprocates-to-each: {label: "With the loyal God is loyal, with the blameless blameless, with the crooked he is tortuous", cluster: theology}
  god-lights-my-lamp: {label: "God lights the speaker's lamp and illumines his darkness", cluster: theology}
  leap-over-wall-by-god: {label: "By my God I run through a troop and leap over a wall", cluster: psalms}
  who-is-god-but-yhwh-who-is-rock: {label: "'Who is God except YHWH, and who is a rock besides our God?'", cluster: theology}
  feet-like-hinds: {label: "God makes the speaker's feet like hinds' feet and sets him on the heights", cluster: psalms}
  god-trains-hands-for-war-bronze-bow: {label: "God trains the king's hands for war so his arms can bend a bow of bronze", cluster: kingship}
  enemies-crushed-like-dust: {label: "The king crushes his enemies like dust before the wind and empties them out like mud of the streets", cluster: kingship}
  foreigners-cringe-before-king: {label: "Foreigners cringe and come trembling out of their strongholds to serve the king", cluster: kingship}
  covenant-love-to-david-and-seed-forever: {label: "God shows steadfast love to his anointed, to David and his offspring forever", cluster: kingship}
  heavens-declare-glory-wordless: {label: "The heavens recount God's glory; day to day pours out speech without words or voice", cluster: creation}
  tent-of-the-sun: {label: "God has set a tent for the sun in the heavens", cluster: cosmology}
  sun-as-bridegroom-and-runner: {label: "The sun comes forth like a bridegroom from his chamber and rejoices like a strong man to run his course", cluster: cosmology}
  torah-praised-perfect-restores-soul: {label: "The Torah of YHWH is perfect, restoring the soul; its precepts make wise, gladden the heart, enlighten the eyes", cluster: scripture}
  torah-sweeter-than-honey: {label: "God's judgments are more desirable than gold and sweeter than honey and the honeycomb", cluster: scripture}
  hidden-faults-cleansing: {label: "Prayer to be cleansed of hidden and unwitting faults (shegi'ot, nistarot)", cluster: psalms}
  words-of-mouth-acceptable: {label: "'May the words of my mouth and the meditation of my heart be acceptable before you, my Rock and Redeemer'", cluster: psalms}
  prayer-for-king-before-battle: {label: "Congregation's prayer for the king's victory and acceptance of his offerings", cluster: kingship}
  name-of-god-of-jacob-protects: {label: "May the name of the God of Jacob set you on high", cluster: theology}
  trust-in-chariots-vs-name-of-god: {label: "Some trust in chariots and some in horses, but we in the name of YHWH", cluster: theology}
  banners-raised-in-gods-name: {label: "In the name of our God we raise our banners", cluster: war}
  king-crowned-with-fine-gold: {label: "God sets a crown of fine gold on the king's head", cluster: kingship}
  king-granted-eternal-life: {label: "The king asked for life and God gave him length of days forever and ever", cluster: kingship}
  enemies-made-like-fiery-oven: {label: "God makes the enemies like a fiery oven at the time of his presence; fire devours them", cluster: judgment}
  enemy-seed-destroyed: {label: "God destroys the enemies' offspring (fruit and seed) from the earth", cluster: judgment}
  my-god-why-forsaken: {label: "'My God, my God, why have you forsaken me?'", cluster: psalms}
  god-enthroned-on-praises: {label: "God is holy, enthroned on the praises of Israel", cluster: theology}
  fathers-trusted-and-were-saved: {label: "Appeal to the ancestors: our fathers trusted in you and you delivered them", cluster: psalms}
  i-am-a-worm-not-a-man: {label: "The sufferer calls himself a worm and not a man, scorned by people", cluster: psalms}
  mockers-wag-heads-let-god-save-him: {label: "Onlookers mock, wag their heads and say 'He trusted in YHWH; let him rescue him'", cluster: psalms}
  god-midwife-from-womb: {label: "God drew the speaker from the womb and made him trust at his mother's breasts; cast on God from birth", cluster: theology}
  bulls-of-bashan-surround: {label: "Strong bulls of Bashan encircle the sufferer", cluster: psalms}
  enemies-as-dogs: {label: "Dogs and a band of evildoers surround the sufferer", cluster: psalms}
  hands-and-feet-like-lion-or-pierced: {label: "Crux 'like a lion my hands and my feet' (ka'ari), read by others as 'they pierced my hands and feet'", cluster: psalms}
  body-poured-out-heart-like-wax: {label: "Sufferer poured out like water, bones out of joint, heart melted like wax, tongue cleaving to jaws", cluster: psalms}
  count-all-my-bones: {label: "The emaciated sufferer can count all his bones while enemies stare", cluster: psalms}
  garments-divided-by-lot: {label: "The enemies divide the sufferer's garments among them and cast lots for his clothing", cluster: psalms}
