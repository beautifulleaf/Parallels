  idolatrous-feast-and-revelry: {label: "The people eat, drink and rise up to revel before the idol", cluster: idolatry}
  stiff-necked-people: {label: "God calls Israel a stiff-necked people", cluster: covenant}
  god-offers-to-make-prophet-a-new-nation: {label: "God proposes to destroy the people and make the prophet into a great nation", cluster: intercession}
  prophet-intercedes-what-will-egyptians-say: {label: "The prophet intercedes for the people, arguing from God's reputation", cluster: intercession}
  appeal-to-oath-to-patriarchs: {label: "Intercessor reminds God of his oath to Abraham, Isaac and Jacob", cluster: intercession}
  god-relents: {label: "God relents from the evil he planned", cluster: intercession}
  tablets-written-on-both-sides: {label: "The tablets are written on both sides by God", cluster: sinai}
  sound-of-war-misheard: {label: "The noise of the idolatrous revelry is mistaken for the sound of battle", cluster: idolatry}
  tablets-broken: {label: "The prophet breaks the tablets in anger at the idolatry", cluster: sinai}
  idol-burned-ground-and-drunk: {label: "The idol is burned, ground to powder, scattered on water and the people made to drink it", cluster: idolatry}
  aaron-blames-people-calf-came-out: {label: "Aaron excuses himself: the people pressed him and the calf came out of the fire", cluster: idolatry}
  people-let-loose: {label: "The people run wild and become a derision to their enemies", cluster: idolatry}
  who-is-for-yhwh-rally: {label: "The leader calls 'Who is for YHWH? To me!' and a group rallies", cluster: idolatry}
  levites-kill-idolaters-kin: {label: "The Levites kill idolaters including their own kin and are consecrated for it", cluster: priesthood}
  prophet-offers-to-be-blotted-from-gods-book: {label: "The prophet asks to be blotted from God's book if the people are not forgiven", cluster: intercession}
  heavenly-book-of-life: {label: "God keeps a book in which names are written and from which sinners are blotted", cluster: cosmology}
  plague-for-idolatry: {label: "God strikes the people with plague for idolatry", cluster: idolatry}
  land-flowing-with-milk-and-honey: {label: "The promised land flows with milk and honey", cluster: land}
  god-refuses-to-go-in-midst-lest-he-consume: {label: "God refuses to go among the people lest he consume them on the way", cluster: covenant}
  ornaments-removed-in-mourning: {label: "The people strip off their ornaments in mourning or penitence", cluster: ritual}
  tent-of-meeting-outside-camp: {label: "A tent of meeting pitched outside the camp where all who seek God go", cluster: cult}
  people-stand-at-tent-doors-and-bow: {label: "The people stand at their tent doors and bow as the prophet goes to meet God", cluster: cult}
  pillar-of-cloud-at-tent-door: {label: "The pillar of cloud descends and stands at the tent door", cluster: theophany}
  god-speaks-face-to-face-as-to-a-friend: {label: "God speaks to the prophet face to face, as a man speaks to his friend", cluster: prophecy}
  joshua-never-leaves-tent: {label: "Joshua, the young attendant, never leaves the tent", cluster: exodus}
  known-by-name-found-favor: {label: "God tells the prophet: I know you by name and you have found favor", cluster: prophecy}
  divine-presence-panim-goes-with-them: {label: "God's own Presence (face) will go with the people", cluster: theophany}
  prophet-asks-to-see-gods-glory: {label: "The prophet asks to see God's glory", cluster: theophany}
  i-will-be-gracious-to-whom-i-will: {label: "God declares he will be gracious to whom he will be gracious", cluster: theology}
  no-man-sees-god-and-lives: {label: "No human can see God's face and live", cluster: theophany}
  prophet-in-cleft-of-rock-sees-gods-back: {label: "God hides the prophet in a cleft of the rock, covers him with his hand, and lets him see only his back", cluster: theophany}
  second-tablets-hewn-by-moses: {label: "Moses hews a second pair of tablets to replace the broken ones", cluster: sinai}
  god-proclaims-own-name-and-attributes: {label: "God passes by and proclaims his name and attributes of mercy", cluster: theology}
  intermarriage-leads-to-idolatry: {label: "Marrying foreign women will lead the sons into idolatry", cluster: law}
  donkey-firstborn-redeemed-or-neck-broken: {label: "A firstborn donkey is redeemed with a lamb or its neck is broken", cluster: law}
  sabbath-even-in-plowing-and-harvest: {label: "The Sabbath must be kept even in plowing and harvest time", cluster: law}
  land-protected-during-pilgrimage: {label: "God promises no one will covet the land while the men go up on pilgrimage", cluster: calendar}
  prophet-fasts-forty-days: {label: "The prophet neither eats nor drinks for forty days", cluster: asceticism}
  prophets-face-shines-after-encounter: {label: "The prophet's face shines (or is 'horned') after speaking with God", cluster: theophany}
  people-afraid-to-approach-prophet: {label: "The people fear to approach the prophet after his encounter with God", cluster: theophany}
  prophet-veils-face: {label: "The prophet covers his radiant face with a veil", cluster: theophany}
  no-fire-kindled-on-sabbath: {label: "No fire may be kindled in any dwelling on the Sabbath", cluster: law}
  women-donate-jewelry: {label: "Men and women donate their jewelry to the sanctuary", cluster: cult}
  skilled-women-spin-goat-hair: {label: "Skilled women spin yarn and goat hair for the sanctuary", cluster: cult}
  chieftains-bring-gemstones: {label: "The tribal chieftains bring the gemstones, spices and oil", cluster: cult}
  craftsmen-given-gift-of-teaching: {label: "God gives the master craftsmen the ability to teach others", cluster: cult}
  donations-exceed-need-people-restrained: {label: "The people bring more than enough and must be told to stop giving", cluster: cult}
  command-and-fulfillment-repetition: {label: "Execution of a divine command is narrated by repeating the command almost verbatim", cluster: style}
  laver-from-womens-mirrors: {label: "The bronze laver is made from the mirrors of the women", cluster: cult}
  women-serving-at-tent-entrance: {label: "Women who serve at the entrance of the tent of meeting", cluster: cult}
  ithamar-oversees-levites: {label: "Ithamar son of Aaron supervises the Levites' work", cluster: priesthood}
  temple-metal-inventory: {label: "An accounting of the gold, silver and bronze used for the sanctuary", cluster: cult}
  census-603550: {label: "The count of Israelite men is 603,550", cluster: numbers}
  one-talent-per-socket: {label: "One hundred silver talents make one hundred sockets, a talent each", cluster: cult}
  gold-hammered-into-threads: {label: "Gold is beaten into sheets and cut into threads for weaving", cluster: cult}
  as-yhwh-commanded-moses-refrain: {label: "The refrain 'as YHWH commanded Moses' recurs in a sevenfold pattern", cluster: style}
  work-completed-echoes-creation: {label: "Completion of the sanctuary is narrated in the language of the completion of creation", cluster: cult}
  leader-inspects-and-blesses-work: {label: "The leader sees the finished work and blesses the workers", cluster: cult}
  sanctuary-erected-on-new-year-day: {label: "The sanctuary is erected on the first day of the first month", cluster: calendar}
  perpetual-priesthood-by-anointing: {label: "Anointing confers an everlasting priesthood on the line", cluster: priesthood}
  glory-fills-sanctuary-prophet-cannot-enter: {label: "The cloud and glory fill the sanctuary so that even the leader cannot enter", cluster: theophany}
  cloud-lifts-signals-journey: {label: "When the cloud lifts from the tabernacle the people set out; otherwise they stay", cluster: exodus}
  cloud-by-day-fire-by-night: {label: "A cloud by day and fire by night over the people", cluster: exodus}
  god-calls-from-tent-of-meeting: {label: "God calls to Moses and speaks from the tent of meeting", cluster: cult}
  whole-burnt-offering: {label: "The whole burnt offering ('olah) is entirely burned on the altar", cluster: sacrifice}
  blood-dashed-around-altar: {label: "Priests dash the blood against all sides of the altar", cluster: sacrifice}
  victim-flayed-and-cut-in-pieces: {label: "The victim is flayed and cut into its pieces", cluster: sacrifice}
  entrails-and-legs-washed: {label: "The entrails and legs are washed with water before burning", cluster: sacrifice}
  slaughter-north-of-altar: {label: "Flock animals are slaughtered on the north side of the altar", cluster: sacrifice}
  poor-mans-bird-offering: {label: "Turtledoves or young pigeons may be offered (by those who cannot afford a lamb)", cluster: sacrifice}
  bird-neck-pinched-melikah: {label: "The priest pinches off the bird's head with his fingernail (melikah)", cluster: sacrifice}
  bird-crop-thrown-to-ash-heap-east: {label: "The bird's crop and feathers are thrown on the ash heap east of the altar", cluster: sacrifice}
  bird-torn-by-wings-not-divided: {label: "The bird is torn open by its wings but not divided in two", cluster: sacrifice}
  grain-offering-fine-flour-oil-frankincense: {label: "A grain offering of fine flour with oil and frankincense", cluster: sacrifice}
  handful-token-portion-azkarah: {label: "The priest burns a handful as the token or 'memorial' portion (azkarah)", cluster: sacrifice}
  remainder-most-holy-for-priests: {label: "The remainder of the offering is most holy and eaten by the priests", cluster: sacrifice}
  baked-griddle-and-pan-offerings: {label: "Grain offerings baked in an oven, on a griddle or in a pan", cluster: sacrifice}
  no-leaven-or-honey-on-altar: {label: "No leaven or honey may be burned on the altar", cluster: sacrifice}
  first-fruits-not-burned-on-altar: {label: "First-fruit offerings are brought but not burned on the altar", cluster: sacrifice}
  salt-of-the-covenant: {label: "Every offering must be salted with the salt of the covenant", cluster: sacrifice}
  roasted-first-grain-offering: {label: "First-fruits grain offering of fresh ears roasted in fire", cluster: sacrifice}
  peace-offering-shelamim: {label: "The well-being offering (shelamim), shared between altar, priest and offerer", cluster: sacrifice}
  sacrifice-as-gods-food: {label: "The sacrifice is called God's food (lehem)", cluster: sacrifice}
  all-fat-belongs-to-yhwh: {label: "All the fat belongs to YHWH", cluster: sacrifice}
  prohibition-of-eating-blood: {label: "Eating blood is forbidden", cluster: law}
  prohibition-of-eating-fat: {label: "Eating the fat (helev) of sacrificial animals is forbidden", cluster: law}
  unintentional-sin-requires-offering: {label: "An offering is required for sins committed unintentionally", cluster: sacrifice}
  graded-offering-by-rank: {label: "The required sacrifice is graded by the sinner's rank: priest, community, chieftain, commoner", cluster: sacrifice}
  anointed-priest-sin-brings-guilt-on-people: {label: "The anointed priest's sin brings guilt on the whole people", cluster: priesthood}
  blood-sprinkled-seven-times-before-veil: {label: "The priest sprinkles blood seven times before the veil", cluster: sacrifice}
  elders-lay-hands-for-congregation: {label: "The elders lay hands on the offering on behalf of the community", cluster: sacrifice}
  priest-atones-and-sin-forgiven: {label: "The priest makes atonement and the sinner is forgiven", cluster: sacrifice}
  seven-fold-ritual-action: {label: "A ritual action is performed seven times", cluster: numbers}
  witness-who-hears-adjuration-must-testify: {label: "A witness who hears a public adjuration and withholds testimony bears guilt", cluster: law}
  touching-carcass-causes-impurity: {label: "Touching an unclean carcass or human impurity makes one guilty", cluster: purity}
  rash-oath-requires-atonement: {label: "A rash oath spoken thoughtlessly requires atonement", cluster: law}
  confession-of-sin: {label: "The sinner must confess the sin he committed", cluster: repentance}
  offering-scaled-to-means: {label: "The offering is reduced for those who cannot afford it", cluster: sacrifice}
  flour-sin-offering-without-oil-or-incense: {label: "The poorest bring a flour sin offering without oil or frankincense", cluster: sacrifice}
  sacrilege-against-holy-things: {label: "Sacrilege (me'ilah) against the holy things of YHWH", cluster: cult}
  restitution-plus-one-fifth: {label: "Restitution of the principal plus one fifth", cluster: law}
  guilt-offering-ram-valued-in-silver: {label: "The guilt offering is a ram assessed in silver shekels", cluster: sacrifice}
  guilt-for-unknowing-sin: {label: "One is guilty even for a sin committed without knowing", cluster: law}
  wronging-neighbor-is-trespass-against-god: {label: "Defrauding a neighbor with a false oath is a trespass against God", cluster: law}
  restitution-before-atonement: {label: "Restitution to the wronged person precedes the atonement offering", cluster: repentance}
  torah-of-the-offering-formula: {label: "Section headed 'This is the instruction (torah) of the ... offering'", cluster: style}
  perpetual-altar-fire-never-extinguished: {label: "The altar fire must burn continually and never go out", cluster: cult}
  ash-removal-in-linen-then-change-garments: {label: "The priest removes the ashes in linen garments and changes clothes to take them out", cluster: cult}
  high-priests-daily-griddle-offering: {label: "The anointed priest offers a daily griddle-cake grain offering, half morning half evening", cluster: sacrifice}
  priests-own-grain-offering-wholly-burned: {label: "A priest's own grain offering is wholly burned and not eaten", cluster: sacrifice}
  blood-stained-garment-washed-in-holy-place: {label: "A garment spattered with sin-offering blood is washed in a holy place", cluster: purity}
  earthen-vessel-broken-bronze-scoured: {label: "An earthen vessel that held sacred meat is broken; a bronze one is scoured and rinsed", cluster: purity}
  sin-offering-blood-inside-not-eaten: {label: "A sin offering whose blood is brought inside the sanctuary is burned, not eaten", cluster: sacrifice}
  officiating-priest-gets-hide: {label: "The officiating priest receives the hide of the burnt offering", cluster: priesthood}
  thanksgiving-offering-with-leavened-bread: {label: "The thanksgiving offering is accompanied by leavened loaves", cluster: sacrifice}
  sacrifice-eaten-within-time-limit: {label: "Sacrificial meat must be eaten within a fixed time and leftovers burned", cluster: sacrifice}
  piggul-third-day-meat-abhorrent: {label: "Sacrificial meat eaten on the third day is abhorrent (piggul) and the offering is invalid", cluster: sacrifice}
  impure-person-eating-sacred-meat-cut-off: {label: "An impure person who eats sacred meat is cut off", cluster: purity}
  fat-of-carcass-usable-not-edible: {label: "Fat of a carcass or torn animal may be used for work but not eaten", cluster: law}
  offerer-brings-with-own-hands: {label: "The offerer must bring the offering with his own hands", cluster: sacrifice}
  whole-congregation-assembled-at-tent: {label: "The whole congregation is assembled at the tent entrance to witness a rite", cluster: cult}
  moses-acts-as-priest: {label: "Moses himself performs the priestly rites at the ordination", cluster: priesthood}
units:
  - id: hb-exod-17-water-from-rock
    tradition: judaism
    title: Water from the rock at Massah and Meribah
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Exod 17:1-7"]
    tags:
      - {motif: people-complain-in-wilderness, refs: ["Exod 17:2", "Exod 17:3"]}
      - {motif: people-threaten-to-stone-leader, refs: ["Exod 17:4"], note: "'a little more and they will stone me'"}
      - {motif: staff-of-wonders, refs: ["Exod 17:5"], note: "the same staff that struck the Nile"}
      - {motif: water-from-struck-rock, refs: ["Exod 17:6"]}
      - {motif: god-stands-on-rock, refs: ["Exod 17:6"], note: "'I will stand before you there on the rock at Horeb'"}
      - {motif: place-named-for-event, refs: ["Exod 17:7"], note: "Massah ('testing') and Meribah ('quarrel')"}
      - {motif: testing-god, refs: ["Exod 17:2", "Exod 17:7"], note: "'Is YHWH among us or not?'"}
  - id: hb-exod-17-amalek
    tradition: judaism
    title: Battle with Amalek; Moses' raised hands
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Exod 17:8-16"]
    tags:
      - {motif: amalek-attacks-israel, refs: ["Exod 17:8"]}
      - {motif: joshua-as-commander, refs: ["Exod 17:9", "Exod 17:13"], note: "first appearance of Joshua"}
      - {motif: raised-hands-win-battle, refs: ["Exod 17:11"], note: "Israel prevails while Moses' hand is raised, Amalek when it rests"}
      - {motif: arms-supported-by-two-men, refs: ["Exod 17:12"], note: "Aaron and Hur hold up his hands, one on each side, seated on a stone, until sunset"}
      - {motif: staff-of-wonders, refs: ["Exod 17:9"], note: "'the staff of God in my hand'"}
      - {motif: command-to-write-in-book, refs: ["Exod 17:14"], note: "first command to write in the Torah"}
      - {motif: blot-out-memory-of-amalek, refs: ["Exod 17:14"]}
      - {motif: altar-given-divine-name, refs: ["Exod 17:15"], note: "YHWH-nissi, 'YHWH is my banner'"}
      - {motif: eternal-war-with-amalek, refs: ["Exod 17:16"], note: "'hand upon the throne (kes) of Yah'; obscure form kes for kisse"}
    hints:
      - "Raised hands in prayer at battle: compare Quranic and hadith motifs of prophetic supplication at Badr; Christian typology (Barnabas 12) reads the outstretched arms as the cross."
  - id: hb-exod-18-jethro
    tradition: judaism
    title: Jethro's visit and the appointment of judges
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Exod 18:1-27"]
    tags:
      - {motif: foreign-priest-father-in-law, refs: ["Exod 18:1"], note: "Jethro, priest of Midian"}
      - {motif: wife-sent-away-and-returned, refs: ["Exod 18:2"], note: "Zipporah 'after her sending away'"}
      - {motif: sons-named-for-life-events, refs: ["Exod 18:3", "Exod 18:4"], note: "Gershom (sojourner in a foreign land), Eliezer (God my help, saved from Pharaoh's sword)"}
      - {motif: foreigner-confesses-god-greatest, refs: ["Exod 18:10", "Exod 18:11"], note: "'now I know YHWH is greater than all gods'"}
      - {motif: foreign-priest-offers-sacrifice, refs: ["Exod 18:12"], note: "Jethro offers burnt offering; Aaron and elders eat bread with him before God"}
      - {motif: mountain-of-god, refs: ["Exod 18:5"]}
      - {motif: leader-judges-alone-overburdened, refs: ["Exod 18:13", "Exod 18:14", "Exod 18:18"]}
      - {motif: hierarchy-of-judges-thousands-hundreds-fifties-tens, refs: ["Exod 18:21", "Exod 18:25"]}
      - {motif: qualities-of-judges, refs: ["Exod 18:21"], note: "capable, God-fearing, men of truth, hating bribes"}
      - {motif: hard-cases-referred-to-leader, refs: ["Exod 18:22", "Exod 18:26"]}
      - {motif: leader-takes-foreigners-advice, refs: ["Exod 18:24"]}
    hints:
      - "Quran 28:22-28 (Moses and the Midianite elder, often identified with Shu'ayb/Jethro). Deut 1:9-18 retells the judges without Jethro."
  - id: hb-exod-19-sinai-theophany
    tradition: judaism
    title: Arrival at Sinai, covenant offer and theophany
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Exod 19:1-25"]
    tags:
      - {motif: arrival-at-sinai-third-month, refs: ["Exod 19:1"]}
      - {motif: borne-on-eagles-wings, refs: ["Exod 19:4"]}
      - {motif: chosen-people-treasured-possession, refs: ["Exod 19:5"], note: "segullah 'from all peoples, for all the earth is mine'"}
      - {motif: kingdom-of-priests, refs: ["Exod 19:6"]}
      - {motif: people-accept-covenant-we-will-do, refs: ["Exod 19:8"]}
      - {motif: god-comes-in-thick-cloud, refs: ["Exod 19:9"]}
      - {motif: washing-garments-before-theophany, refs: ["Exod 19:10", "Exod 19:14"]}
      - {motif: third-day-revelation, refs: ["Exod 19:11", "Exod 19:16"]}
      - {motif: holy-mountain-bounded-touching-is-death, refs: ["Exod 19:12", "Exod 19:13", "Exod 19:23"], note: "transgressor stoned or shot, not touched by hand; beast or man"}
      - {motif: ram-horn-signals-ascent, refs: ["Exod 19:13"], note: "'when the yovel sounds long, they may go up'"}
      - {motif: sexual-abstinence-before-holy-encounter, refs: ["Exod 19:15"]}
      - {motif: theophany-thunder-lightning-trumpet, refs: ["Exod 19:16", "Exod 19:19"]}
      - {motif: mountain-smokes-like-furnace-and-quakes, refs: ["Exod 19:18"]}
      - {motif: god-answers-in-voice, refs: ["Exod 19:19"]}
      - {motif: danger-of-seeing-god, refs: ["Exod 19:21", "Exod 19:24"], note: "lest they break through to see and many fall"}
      - {motif: priests-before-priesthood, refs: ["Exod 19:22", "Exod 19:24"], note: "priests mentioned before Aaron's ordination"}
    hints:
      - "Quran 7:171 and 2:63 (the mountain raised over Israel); rabbinic 'na'aseh ve-nishma'; Acts 2 Pentecost imagery (fire, sound)."
  - id: hb-exod-20-decalogue
    tradition: judaism
    title: The Ten Words and the people's fear
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Exod 20:1-21"]
    tags:
      - {motif: ten-commandments, refs: ["Exod 20:2-17"]}
      - {motif: god-self-identifies-as-liberator, refs: ["Exod 20:2"]}
      - {motif: prohibition-of-other-gods, refs: ["Exod 20:3"]}
      - {motif: prohibition-of-images, refs: ["Exod 20:4", "Exod 20:5"], note: "heaven above, earth below, water under the earth"}
      - {motif: jealous-god, refs: ["Exod 20:5"]}
      - {motif: punishment-to-third-and-fourth-generation, refs: ["Exod 20:5", "Exod 20:6"], note: "mercy to thousands"}
      - {motif: prohibition-false-oath-by-name, refs: ["Exod 20:7"]}
      - {motif: sabbath-rest, refs: ["Exod 20:8-11"]}
      - {motif: sabbath-grounded-in-creation, refs: ["Exod 20:11"]}
      - {motif: honor-parents-long-life, refs: ["Exod 20:12"]}
      - {motif: prohibition-murder-adultery-theft-false-witness, refs: ["Exod 20:13", "Exod 20:14", "Exod 20:15", "Exod 20:16"]}
      - {motif: prohibition-of-coveting, refs: ["Exod 20:17"]}
      - {motif: people-see-the-voices, refs: ["Exod 20:18"], note: "'all the people were seeing the voices and the torches'"}
      - {motif: people-ask-mediator, refs: ["Exod 20:19"], note: "'You speak with us... lest we die'"}
      - {motif: prophet-enters-thick-darkness, refs: ["Exod 20:21"], note: "araphel where God is"}
    hints:
      - "Quran 17:22-39 and 6:151-153 as decalogue-like lists; Egyptian Book of the Dead 125 negative confession."
  - id: hb-exod-20-altar-law
    tradition: judaism
    title: Altar law
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Exod 20:22-26"]
    tags:
      - {motif: god-speaks-from-heaven, refs: ["Exod 20:22"]}
      - {motif: prohibition-of-images, refs: ["Exod 20:23"], note: "gods of silver and gold"}
      - {motif: altar-of-earth, refs: ["Exod 20:24"]}
      - {motif: god-comes-where-name-remembered, refs: ["Exod 20:24"]}
      - {motif: altar-of-unhewn-stone, refs: ["Exod 20:25"], note: "iron tool profanes it"}
      - {motif: no-steps-to-altar-nakedness, refs: ["Exod 20:26"]}
  - id: hb-exod-21-slave-laws
    tradition: judaism
    title: Covenant Code - Hebrew slaves
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Exod 21:1-11"]
    tags:
      - {motif: release-of-slaves-seventh-year, refs: ["Exod 21:2"]}
