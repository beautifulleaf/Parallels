new_motifs:
  prophet-shaves-hair-with-sword-sign: {label: "Prophet shaves head and beard with a sword as razor, weighs the hair on scales and divides it into thirds (burned, struck with sword, scattered to the wind)", cluster: prophecy}
  few-hairs-bound-in-hem: {label: "A few hairs are kept back and bound in the prophet's garment hem (remnant), yet some of these are thrown into fire", cluster: prophecy}
  jerusalem-set-in-midst-of-nations: {label: "God set Jerusalem in the center of the nations with countries all around her", cluster: cosmology}
  reciprocal-cannibalism-fathers-and-sons: {label: "Fathers will eat their sons and sons will eat their fathers in the besieged city", cluster: judgment}
  unparalleled-judgment-never-again: {label: "God will do to the city what he has never done and will never do again", cluster: judgment}
  sword-famine-pestilence-triad: {label: "Stock triad of judgment: sword, famine and pestilence (sometimes with wild beasts as fourth)", cluster: judgment}
  arrows-of-famine: {label: "God shoots 'evil arrows of famine' at the people", cluster: judgment}
  recognition-formula-know-i-am-yhwh: {label: "Formula 'and you/they shall know that I am YHWH' closing a judgment or salvation oracle", cluster: prophecy}
  prophet-sets-face-toward: {label: "Prophet commanded to 'set your face toward' a place or people and prophesy against it", cluster: prophecy}
  oracle-addressed-to-mountains: {label: "Prophet addresses the mountains, hills, ravines and valleys of the land directly", cluster: prophecy}
  corpses-before-idols-bones-around-altars: {label: "God lays the slain before their idols and scatters their bones around their altars", cluster: judgment}
  prophet-claps-and-stamps: {label: "Prophet told to clap his hands, stamp his foot and cry 'Ah!' as a gesture of doom", cluster: prophecy}
  remnant-loathes-itself-in-exile: {label: "Survivors in exile will remember God, loathe themselves for their abominations and know he did not speak in vain", cluster: theology}
  the-end-has-come: {label: "Proclamation 'An end has come, the end has come' upon the land (qets ba)", cluster: eschatology}
  four-corners-of-the-earth: {label: "The 'four corners (wings) of the earth'", cluster: cosmology}
  knees-turn-to-water: {label: "In terror all hands go slack and all knees run with water", cluster: judgment}
  silver-gold-thrown-in-streets: {label: "On the day of wrath people fling their silver into the streets; silver and gold cannot save them", cluster: judgment}
  survivors-moan-like-doves: {label: "Survivors on the mountains moan like doves of the valleys, each for his iniquity", cluster: judgment}
  vision-sought-from-prophet-torah-perishes: {label: "In disaster people seek a vision from the prophet, but instruction perishes from the priest and counsel from the elders", cluster: prophecy}
  gods-treasured-place-profaned: {label: "God's 'treasured place' (tsefuni) is profaned by robbers when he turns his face away", cluster: cult}
  divine-face-hidden-or-turned: {label: "God turns or hides his face from the people, abandoning them to harm", cluster: theology}
  elders-sit-before-prophet: {label: "Elders of the people come and sit before the prophet in his house to inquire", cluster: prophecy}
  fiery-figure-gleaming-like-amber: {label: "A human-like figure of fire from the waist down and gleaming like hashmal (amber/electrum) from the waist up", cluster: theophany}
  prophet-lifted-by-lock-of-hair: {label: "A hand seizes the prophet by a lock of his hair and the spirit carries him between earth and heaven to a distant place", cluster: prophecy}
  visionary-journey-to-jerusalem: {label: "Prophet in exile is brought 'in visions of God' to the Jerusalem temple", cluster: prophecy}
  image-of-jealousy: {label: "An idol called 'the image (semel) of jealousy that provokes jealousy' stands at the north gate of the temple", cluster: cult}
  prophet-digs-through-wall: {label: "Prophet is told to dig through a wall and enters through the opening", cluster: prophecy}
  secret-chamber-of-animal-images: {label: "Hidden temple chamber whose walls are engraved all around with creeping things, loathsome beasts and idols", cluster: cult}
  elders-offer-incense-in-dark: {label: "Seventy elders stand with censers in hand offering incense in the dark, each in his chamber of images", cluster: cult}
  god-does-not-see-us: {label: "Sinners say 'YHWH does not see us; YHWH has forsaken the land'", cluster: theology}
  women-weeping-for-tammuz: {label: "Women sit at the north gate of the temple weeping for Tammuz", cluster: cult}
  sun-worship-backs-to-temple: {label: "About twenty-five men with their backs to the temple bow eastward to the sun between the porch and the altar", cluster: cult}
  branch-to-the-nose: {label: "Idolaters 'put the branch (zemorah) to their nose', an obscure cultic gesture", cluster: cult}
  god-refuses-to-hear-loud-cry: {label: "Though they cry in God's ears with a loud voice, he will not listen", cluster: theology}
  ezekiel-dated-oracle: {label: "Oracle or vision dated by year, month and day of the exile of King Jehoiachin", cluster: prophecy}
  six-executioners-of-the-city: {label: "Six men (angelic executioners), each with a weapon of destruction, come from the north gate to slay the city", cluster: angels}
  man-in-linen-with-scribes-inkhorn: {label: "A heavenly man clothed in linen with a scribe's writing kit at his waist", cluster: angels}
  tav-mark-on-foreheads-of-mourners: {label: "A mark (tav) is put on the foreheads of those who sigh over the city's abominations so the destroyers spare them", cluster: judgment}
  judgment-begins-at-the-sanctuary: {label: "Divine slaughter is to begin at God's sanctuary, with the elders before the temple", cluster: judgment}
  prophet-cries-will-you-destroy-remnant: {label: "Prophet falls on his face crying 'Ah Lord, will you destroy the whole remnant of Israel?'", cluster: prophecy}
  angelic-agent-reports-task-done: {label: "The angelic agent returns and reports 'I have done as you commanded me'", cluster: angels}
  sapphire-throne-above-firmament: {label: "Above the firmament over the living creatures appears something like sapphire in the likeness of a throne", cluster: theophany}
  coals-from-between-cherubim-scattered: {label: "Burning coals are taken from between the cherubim / wheels and scattered over the city", cluster: theophany}
  sound-of-wings-like-voice-of-shaddai: {label: "The sound of the cherubim's wings is heard like the voice of El Shaddai when he speaks", cluster: theophany}
  wheel-within-a-wheel: {label: "Wheels (ofannim) gleaming like tarshish-stone, built as a wheel within a wheel, moving in any direction without turning", cluster: theophany}
  wheels-full-of-eyes: {label: "The bodies, backs, hands, wings and wheels of the throne-creatures are full of eyes all around", cluster: theophany}
  wheels-called-galgal: {label: "The wheels are called by the name 'galgal' ('whirl') in the prophet's hearing", cluster: theophany}
  four-faced-cherubim: {label: "Each cherub or living creature has four faces (human, lion, ox/cherub, eagle), four wings and human hands under the wings", cluster: theophany}
  spirit-of-creature-in-wheels: {label: "The spirit of the living creature is in the wheels so that they move and rise with it", cluster: theophany}
  glory-departs-temple-in-stages: {label: "The divine glory leaves the temple in stages: from the cherub to the threshold, to the east gate, to the mountain east of the city", cluster: theophany}
  cauldron-and-meat-proverb: {label: "Proverb 'the city is the cauldron and we are the meat', turned against its speakers", cluster: prophecy}
  bystander-drops-dead-at-prophecy: {label: "A man dies suddenly while the prophet is still prophesying against him", cluster: prophecy}
  god-as-small-sanctuary-in-exile: {label: "God himself becomes 'a little sanctuary' (miqdash me'at) for the exiles in the lands of dispersion", cluster: theology}
  heart-of-stone-to-heart-of-flesh: {label: "God will remove the heart of stone and give a heart of flesh and a new spirit", cluster: theology}
  ingathering-of-exiles-to-land: {label: "God will gather the dispersed from the peoples and give them back the land of Israel", cluster: restoration}
  vision-ends-prophet-returned-to-exiles: {label: "The spirit carries the prophet back to the exiles and the vision lifts from him", cluster: prophecy}
  rebellious-house-eyes-not-seeing: {label: "The people are a 'rebellious house' that have eyes but do not see and ears but do not hear", cluster: prophecy}
  exile-baggage-sign-act: {label: "Prophet packs an exile's bag by day, digs through the wall and goes out at dusk with covered face as a sign of exile", cluster: prophecy}
  prophet-as-portent: {label: "God makes the prophet himself a sign/portent (mofet) for the house of Israel", cluster: prophecy}
  god-spreads-net-over-king: {label: "God spreads his net over the king and catches him in his snare", cluster: judgment}
  eating-bread-with-trembling-sign: {label: "Prophet eats his bread with quaking and drinks water with trembling as a sign of the coming desolation", cluster: prophecy}
  proverb-vision-delayed-refuted: {label: "God abolishes the saying 'the days drag on and every vision fails': his word will no longer be delayed", cluster: prophecy}
  remnant-spared-to-tell-abominations: {label: "A few are spared from sword, famine and plague so they may recount their abominations among the nations", cluster: judgment}
  prophets-from-own-heart: {label: "False prophets prophesy 'from their own heart', following their own spirit, having seen nothing", cluster: prophecy}
  false-prophets-like-foxes-in-ruins: {label: "The prophets of Israel are like foxes (jackals) among ruins", cluster: prophecy}
  prophet-fails-to-stand-in-breach: {label: "The true prophet's task is to go up into the breaches and build a wall for the people on the day of battle; false prophets did not", cluster: prophecy}
  peace-when-there-is-no-peace: {label: "False prophets mislead the people saying 'Peace' when there is no peace", cluster: prophecy}
  whitewashed-wall-falls: {label: "False prophets daub a flimsy wall with whitewash (tafel); God's storm, flood-rain and hailstones bring it down", cluster: prophecy}
  excluded-from-register-of-israel: {label: "False prophets will not be in the council of God's people nor written in the register of the house of Israel", cluster: theology}
  women-soul-hunters-with-bands: {label: "Women prophetesses sew bands (kesatot) on wrists and make veils (mispahot) for heads to hunt souls, killing and keeping alive by magic", cluster: magic}
  magic-for-handfuls-of-barley: {label: "Diviners profane God for handfuls of barley and crumbs of bread", cluster: magic}
  souls-released-like-birds: {label: "God tears off the magic bands and lets the trapped souls go free 'like birds' (leporhot)", cluster: magic}
  idols-set-up-in-heart: {label: "Inquirers have 'set up their idols in their hearts' and put the stumbling-block of iniquity before their faces", cluster: theology}
  god-answers-idolater-himself: {label: "God himself will answer the idolater who inquires of a prophet, making him a sign and a byword and cutting him off", cluster: prophecy}
  god-deceives-the-prophet: {label: "If a prophet is enticed to speak, 'I YHWH have enticed that prophet' and will destroy him", cluster: prophecy}
  noah-daniel-job-righteous-trio: {label: "Even if Noah, Daniel (Dan'el) and Job were in the land, their righteousness would save only themselves, not sons or daughters", cluster: theology}
  four-evil-judgments: {label: "God's 'four evil judgments': sword, famine, evil beasts and pestilence", cluster: judgment}
  survivors-console-by-their-deeds: {label: "Survivors from the doomed city will come to the exiles, who will be consoled on seeing their deeds that the punishment was not without cause", cluster: theology}
  useless-vine-wood-parable: {label: "Parable of the vine-wood: useless for any work, not even for a peg, fit only for the fire; so are Jerusalem's inhabitants", cluster: prophecy}
  jerusalem-of-amorite-and-hittite-parents: {label: "Jerusalem's origin is Canaanite: 'your father was an Amorite and your mother a Hittite'", cluster: prophecy}
  exposed-newborn-girl-in-her-blood: {label: "A newborn girl is cast into the open field unwashed, unsalted and unswaddled, with her navel cord uncut, loathed on the day of her birth", cluster: childhood}
  in-your-blood-live: {label: "God passes by the infant wallowing in her blood and says twice 'In your blood, live!'", cluster: childhood}
  god-marries-city-as-bride: {label: "God spreads his garment-wing over the grown foundling, swears a covenant and takes the city as his wife, bathing, anointing, clothing and adorning her", cluster: theology}
  bridal-adornment-catalogue: {label: "Catalogue of bridal finery: embroidered cloth, tahash sandals, linen, silk, bracelets, necklace, nose-ring, earrings and a crown", cluster: prophecy}
  bride-becomes-harlot-trusting-beauty: {label: "The adorned bride trusts in her beauty and plays the harlot with every passer-by", cluster: prophecy}
  male-images-made-from-gods-gifts: {label: "The unfaithful wife makes male images (tsalmei zakhar) from the gold and silver God gave her and fornicates with them", cluster: cult}
  children-slaughtered-for-idols: {label: "Sons and daughters born to God are slaughtered and offered to idols as food", cluster: cult}
  harlot-pays-her-lovers: {label: "Unlike other harlots, the city pays fees to her lovers instead of receiving them", cluster: prophecy}
  nations-as-lovers-egypt-assyria-babylon: {label: "Political alliances with Egypt, Assyria and Chaldea pictured as harlotry with lovers ('big of flesh')", cluster: prophecy}
  adulteress-stripped-before-lovers: {label: "God gathers the adulteress's lovers, strips her naked before them and hands her over to be judged", cluster: judgment}
  adulteress-stoned-and-hacked: {label: "An assembly stones the adulteress and hacks her with swords and burns her houses before many women", cluster: judgment}
  like-mother-like-daughter: {label: "Proverb 'like mother, like daughter'", cluster: wisdom}
  samaria-and-sodom-as-sisters: {label: "Samaria (elder, on the left/north) and Sodom (younger, on the right/south) are Jerusalem's sisters, and she is worse than both", cluster: prophecy}
  sin-of-sodom-pride-plenty-neglect-of-poor: {label: "The sin of Sodom was pride, surfeit of bread and careless ease, not strengthening the hand of the poor and needy", cluster: ethics}
  restoration-of-sodom: {label: "God will restore the fortunes of Sodom and Samaria along with Jerusalem", cluster: restoration}
  everlasting-covenant-renewed: {label: "God remembers his covenant of her youth and establishes an everlasting covenant (berit olam)", cluster: restoration}
  forgiveness-leaves-shame-silent: {label: "When God atones for her she will remember, be ashamed and never again open her mouth", cluster: theology}
  great-eagle-plucks-cedar-top: {label: "A great eagle with long pinions and many-colored plumage comes to Lebanon, plucks the top of the cedar and carries it to a land of merchants", cluster: prophecy}
  eagle-allegory-vine-turns-to-second-eagle: {label: "A low spreading vine planted by one great eagle turns its roots toward a second great eagle (vassal turning from Babylon to Egypt)", cluster: prophecy}
  covenant-breaker-cannot-escape: {label: "The vassal king who despised his oath and broke his covenant will not escape but die in the overlord's land", cluster: kingship}
  messianic-cedar-shoot-on-high-mountain: {label: "God himself takes a tender shoot from the cedar's top and plants it on Israel's high mountain, where it becomes a noble cedar", cluster: messianism}
  birds-dwell-in-shade-of-great-tree: {label: "Birds of every wing nest in the branches and shade of a great tree (kingdom)", cluster: cosmology}
  god-lowers-high-tree-raises-low: {label: "God brings low the high tree and exalts the low tree, dries up the green tree and makes the dry tree flourish", cluster: theology}
  sour-grapes-proverb: {label: "Proverb 'The fathers have eaten sour grapes and the children's teeth are set on edge', abolished by God", cluster: theology}
  soul-that-sins-shall-die: {label: "'The soul that sins, it shall die': the son does not bear the father's iniquity nor the father the son's", cluster: theology}
  righteous-man-catalogue-of-virtues: {label: "Catalogue of the righteous man: no eating on the mountains, no idols, no adultery, no menstrual intercourse, no oppression, returns pledges, feeds the hungry, clothes the naked, no interest", cluster: ethics}
  three-generation-test-case: {label: "Test case of three generations: righteous father, violent son, and a grandson who sees his father's sins and does not imitate them", cluster: ethics}
  repentant-wicked-past-sins-forgotten: {label: "If the wicked turns from his sins, none of his transgressions will be remembered; if the righteous turns away, his righteousness is forgotten", cluster: theology}
  god-desires-not-death-of-wicked: {label: "God does not desire the death of the wicked but that he turn from his way and live", cluster: theology}
  way-of-lord-not-fair-complaint: {label: "People complain 'the way of the Lord is not fair'; God answers that it is their ways that are unfair", cluster: theology}
  make-yourselves-new-heart: {label: "Exhortation: cast away your transgressions and make yourselves a new heart and a new spirit; why will you die?", cluster: theology}
  lament-lioness-and-cubs: {label: "Dirge: the mother lioness among lions raises cubs who learn to devour men and are caught in pits and led away with hooks to Egypt and Babylon", cluster: kingship}
  royal-vine-uprooted-and-burned: {label: "The mother was a fruitful vine by many waters with strong rods for sceptres; plucked up in fury, dried by the east wind and burned, now planted in the desert", cluster: kingship}
  prophetic-qinah-dirge: {label: "Prophet commanded to raise a qinah (funeral dirge) over a ruler, city or nation", cluster: prophecy}
  god-refuses-to-be-inquired-of: {label: "God swears he will not be inquired of by the elders who come to consult him", cluster: prophecy}
  god-acts-for-sake-of-his-name: {label: "God refrains from destroying the people 'for the sake of my name', lest it be profaned in the sight of the nations", cluster: theology}
  idols-of-egypt-in-wilderness-generation: {label: "Israel already worshipped the idols of Egypt in Egypt and would not cast them away", cluster: cult}
  god-gave-laws-not-good: {label: "God gave the rebellious generation 'statutes that were not good and ordinances by which they could not live', defiling them through offering their firstborn", cluster: theology}
  etiology-of-bamah-name: {label: "Wordplay etiology: 'What is the high place (bamah) to which you go (ha-ba'im)?' and its name is Bamah to this day", cluster: etiology}
  be-like-the-nations-serve-wood-and-stone: {label: "The people's wish 'We will be like the nations, serving wood and stone' will never come to pass", cluster: theology}
  god-will-reign-with-poured-out-wrath: {label: "God swears 'with a mighty hand, outstretched arm and poured-out wrath I will be king over you'", cluster: theology}
  wilderness-of-the-peoples-judgment: {label: "God will bring the exiles into 'the wilderness of the peoples' and judge them face to face as he judged the fathers in Egypt's wilderness", cluster: restoration}
  pass-under-the-rod-into-covenant: {label: "God makes the people pass under the shepherd's rod and brings them into the bond (masoret) of the covenant, purging out rebels", cluster: restoration}
  restored-worship-on-gods-holy-mountain: {label: "On God's holy mountain, the height of Israel, all Israel will serve him and he will accept their offerings as a pleasing odor", cluster: restoration}
  forest-fire-green-and-dry: {label: "God kindles an unquenchable fire in the forest of the south that devours every green tree and every dry tree", cluster: judgment}
  prophet-mocked-as-maker-of-parables: {label: "People dismiss the prophet: 'Is he not just a maker of parables (memashel meshalim)?'", cluster: prophecy}
  sword-drawn-from-sheath-not-returned: {label: "God draws his sword from its sheath against righteous and wicked alike, and it will not return", cluster: judgment}
  prophet-groans-before-them: {label: "Prophet commanded to groan with breaking loins before the people; when asked why, he announces coming news", cluster: prophecy}
  song-of-the-sword: {label: "Incantatory song of the sharpened and polished sword, flashing like lightning, given to the slayer", cluster: judgment}
  king-of-babylon-divines-at-crossroads: {label: "At the fork of two roads the king of Babylon divines: he shakes arrows, consults teraphim and inspects the liver", cluster: magic}
  belomancy-arrow-divination: {label: "Divination by shaking or drawing arrows (belomancy)", cluster: magic}
  hepatoscopy-liver-divination: {label: "Divination by inspecting the liver (hepatoscopy)", cluster: magic}
  turban-removed-crown-taken: {label: "Remove the turban and take off the crown: the low exalted, the high brought low", cluster: kingship}
  ruin-ruin-ruin-until-rightful-one: {label: "'A ruin, a ruin, a ruin I will make it ... until he comes to whom judgment belongs, and I will give it to him'", cluster: messianism}
  sword-returned-to-sheath-judged-in-homeland: {label: "The sword is returned to its sheath and Ammon is judged in the land of its origin and forgotten", cluster: judgment}
  city-of-blood-indictment: {label: "Jerusalem indicted as 'the city of bloodshed' (ir ha-damim) with a catalogue of its crimes", cluster: prophecy}
  catalogue-of-jerusalem-sins: {label: "Catalogue of social, sexual and cultic sins in the city: contempt of parents, oppression of stranger, orphan and widow, slander, incest, bribery, interest", cluster: ethics}
  israel-as-dross-in-furnace: {label: "Israel has become dross: copper, tin, iron and lead in the furnace, gathered into Jerusalem to be melted by God's wrath", cluster: judgment}
  land-unwashed-by-rain: {label: "The land is not cleansed and not rained upon on the day of indignation", cluster: judgment}
  leaders-as-wolves-and-roaring-lions: {label: "Princes are wolves tearing prey and prophets a roaring lion devouring souls", cluster: prophecy}
  priests-fail-to-distinguish-holy-profane: {label: "Priests do violence to the torah and fail to distinguish holy from profane and clean from unclean, hiding their eyes from the sabbaths", cluster: cult}
  no-man-to-stand-in-breach: {label: "God seeks a man to build up the wall and stand in the breach before him for the land, and finds none", cluster: prophecy}
  oholah-and-oholibah: {label: "Two sisters, Oholah ('her tent') and Oholibah ('my tent is in her'), daughters of one mother, are Samaria and Jerusalem, wives of God who play the harlot", cluster: prophecy}
  harlotry-begun-in-egypt-youth: {label: "The sisters' harlotry began in their youth in Egypt where their breasts were pressed", cluster: prophecy}
  lusting-after-handsome-assyrian-horsemen: {label: "The harlot lusts after Assyrian governors and officers clothed in blue, all handsome young horsemen", cluster: prophecy}
  lust-from-images-on-wall: {label: "Seeing men portrayed on a wall in vermilion (images of Chaldeans with belts and turbans), the woman lusts and sends messengers to them", cluster: prophecy}
  lovers-with-flesh-of-donkeys: {label: "Egyptian paramours described with 'flesh of donkeys and issue of stallions'", cluster: prophecy}
  pekod-shoa-koa: {label: "Enemy peoples named Pekod, Shoa and Koa come with the Babylonians and Assyrians", cluster: geography}
  nose-and-ears-cut-off: {label: "The adulteress's nose and ears are cut off as punishment", cluster: judgment}
  sisters-cup-of-horror: {label: "The younger sister must drink her sister's deep and wide cup of horror and desolation, drain it, gnaw its sherds and tear her breasts", cluster: judgment}
  harlot-paints-eyes-and-adorns-couch: {label: "The harlot bathes, paints her eyes, puts on ornaments and sits on a splendid couch with a table set with God's incense and oil", cluster: prophecy}
  sabeans-from-desert: {label: "Drunkards (sove'im/Sabeans) brought from the desert put bracelets on the women's hands and crowns on their heads", cluster: prophecy}
  women-warned-by-example: {label: "All women will be warned by the punishment of the lewd sisters and not imitate them", cluster: ethics}
  child-sacrifice-and-temple-same-day: {label: "Having slaughtered their children to idols, they enter God's sanctuary the same day to profane it", cluster: cult}
  prophet-writes-down-date-of-siege: {label: "Prophet told to write down 'the name of this very day' on which the king of Babylon laid siege to Jerusalem (clairvoyant dating)", cluster: prophecy}
  boiling-pot-parable: {label: "Parable of the pot set on the fire with choice pieces of meat and bones, its rust (hel'ah) never removed", cluster: prophecy}
  blood-left-uncovered-on-bare-rock: {label: "The city put its blood on the bare rock, not pouring it on the earth to cover it with dust, so God leaves it uncovered to cry for vengeance", cluster: law}
  empty-pot-heated-to-melt-rust: {label: "The empty pot is set on the coals to glow so its impurity melts and its rust is consumed, yet the rust will not go out", cluster: prophecy}
  prophets-wife-dies-mourning-forbidden: {label: "God takes the prophet's wife, 'the delight of your eyes', at a stroke and forbids him to weep or perform mourning rites, as a sign", cluster: prophecy}
  mourning-rites-listed: {label: "Mourning customs listed: removing the turban and sandals, covering the upper lip (mustache), eating the 'bread of men' (mourners' meal)", cluster: ritual}
  temple-delight-of-eyes: {label: "The temple called 'the pride of your strength, the delight of your eyes and the desire of your soul'", cluster: cult}
  prophets-muteness-ends-with-fugitive: {label: "The prophet's dumbness will end and his mouth open on the day the fugitive arrives with news of the fall", cluster: prophecy}
  nations-gloat-he-ah: {label: "A neighboring nation says 'Aha!' (he'ah), clapping hands and stamping feet in malicious joy over the fall of the sanctuary and land", cluster: prophecy}
  given-to-sons-of-east: {label: "God gives Ammon and Moab to the 'sons of the east' who will pitch their encampments there; Rabbah becomes a pasture for camels", cluster: prophecy}
  edoms-vengeance-on-judah: {label: "Edom took vengeance on Judah; God will take vengeance on Edom by the hand of Israel", cluster: prophecy}
  philistine-eternal-enmity-cherethites-cut-off: {label: "Philistines acted with 'eternal enmity'; God will cut off the Cherethites (pun hikhratti et keretim) and the remnant of the seacoast", cluster: prophecy}
  tyre-gloats-gate-of-peoples-broken: {label: "Tyre gloats over Jerusalem: 'Aha, the gate of the peoples is broken; it has turned to me'", cluster: prophecy}
  nations-come-like-sea-waves: {label: "God brings many nations against the city as the sea brings up its waves", cluster: judgment}
  tyre-bare-rock-for-drying-nets: {label: "Tyre will be scraped to bare rock, a place for spreading fishing nets in the midst of the sea, never rebuilt", cluster: prophecy}
  nebuchadnezzar-king-of-kings-from-north: {label: "Nebuchadrezzar, 'king of kings', comes from the north with horses, chariots and siege works", cluster: kingship}
  music-of-city-silenced: {label: "The noise of the city's songs and the sound of its lyres will be heard no more", cluster: judgment}
  princes-of-sea-descend-from-thrones-mourning: {label: "Princes of the sea step down from their thrones, strip off embroidered robes, sit on the ground trembling and raise a lament", cluster: judgment}
  city-covered-by-tehom: {label: "God brings up the deep (tehom) over the city and the great waters cover it", cluster: cosmology}
  city-sent-down-to-pit-ancient-dead: {label: "God brings the city down with those who descend to the Pit, to the people of old, in the netherworld among ancient ruins", cluster: afterlife}
  sought-and-never-found-again: {label: "The destroyed one will be sought but never found again; 'I will make you terrors and you shall be no more'", cluster: judgment}
  tyre-as-splendid-ship: {label: "Tyre portrayed as a magnificent ship of perfect beauty built from Senir cypress, Lebanon cedar mast, Bashan oak oars, ivory deck, Egyptian linen sail, crewed by Sidon, Arvad and Gebal", cluster: prophecy}
  perfect-in-beauty: {label: "A city or king claims or is called 'perfect in beauty' (kelilat yofi)", cluster: prophecy}
  mercenaries-persia-lud-put: {label: "Mercenaries from Persia, Lud and Put hang shield and helmet in the city; Gammadim in the towers", cluster: warfare}
  catalogue-of-tyres-trading-partners: {label: "Long catalogue of nations trading with Tyre and their goods (Tarshish metals, Javan-Tubal-Meshech slaves and bronze, Togarmah horses, Dedan ivory and ebony, Sheba spices, Judah wheat and balm, Damascus Helbon wine)", cluster: geography}
  slave-trade-souls-of-men: {label: "Trade in 'souls of men' (slaves) among the goods of commerce", cluster: economy}
  ship-wrecked-by-east-wind-in-heart-of-seas: {label: "The laden ship is shattered by the east wind in the heart of the seas and sinks with all its crew and cargo", cluster: prophecy}
  sailors-lament-dust-ashes-baldness: {label: "Sailors come ashore, cry bitterly, throw dust on their heads, roll in ashes, shave themselves bald and gird sackcloth", cluster: ritual}
  who-was-like-tyre: {label: "Lament question 'Who was like Tyre, like one silenced in the midst of the sea?'", cluster: prophecy}
  merchants-hiss-at-ruin: {label: "Merchants among the peoples hiss at the fallen city; kings' hair stands on end", cluster: judgment}
  ruler-claims-i-am-god: {label: "A ruler's heart is proud and he says 'I am a god (El); I sit in the seat of the gods in the heart of the seas', but he is a man and not a god", cluster: kingship}
  wiser-than-daniel: {label: "The king of Tyre is 'wiser than Daniel (Dan'el); no secret is hidden from you'", cluster: wisdom}
  wealth-by-wisdom-and-trade-breeds-pride: {label: "By wisdom and trade the ruler amasses gold and silver and his heart grows proud because of his wealth", cluster: wisdom}
  death-of-the-uncircumcised: {label: "The proud ruler will 'die the death of the uncircumcised' at the hand of strangers (dishonorable death and burial)", cluster: afterlife}
  seal-of-perfection: {label: "The king of Tyre is called 'the seal of perfection (hotem toknit), full of wisdom and perfect in beauty'", cluster: kingship}
  primal-being-in-eden-covered-with-gems: {label: "A primal figure was in Eden, the garden of God, covered with every precious stone (sardius, topaz, diamond, beryl, onyx, jasper, sapphire, turquoise, emerald) and gold settings prepared on the day of his creation", cluster: creation}
  anointed-guardian-cherub: {label: "'You were an anointed guardian cherub; I placed you on the holy mountain of God'", cluster: angels}
  walking-among-stones-of-fire: {label: "The primal being walked among the 'stones of fire' on God's mountain", cluster: cosmology}
  blameless-from-creation-until-iniquity-found: {label: "The being was blameless from the day he was created until iniquity was found in him", cluster: creation}
  expulsion-from-mountain-of-god: {label: "God casts the proud being out from the mountain of God and destroys him from among the stones of fire, hurling him to earth before kings", cluster: creation}
  fire-from-within-consumes-to-ashes: {label: "God brings out a fire from within the sinner that consumes him and turns him to ashes on the ground", cluster: judgment}
  thorns-and-briers-of-neighbors-removed: {label: "There will no longer be a pricking brier or painful thorn for Israel from contemptuous neighbors", cluster: restoration}
  dwell-securely-build-houses-plant-vineyards: {label: "Restored Israel will dwell securely, build houses and plant vineyards", cluster: restoration}
  pharaoh-as-great-tannin-in-nile: {label: "Pharaoh is the great tannin (crocodile/dragon) lying in the midst of his Nile channels", cluster: cosmology}
  my-nile-i-made-myself: {label: "Pharaoh boasts 'My Nile is my own; I made it (or made myself)'", cluster: kingship}
  hooks-in-jaws-fish-stuck-to-scales: {label: "God puts hooks in the monster's jaws, makes the fish of its rivers stick to its scales and hauls it out of the water", cluster: cosmology}
  monster-cast-in-wilderness-as-carrion: {label: "The hauled-out monster is flung into the wilderness on the open field as food for beasts and birds, unburied", cluster: cosmology}
  egypt-desolate-forty-years: {label: "Egypt will be desolate forty years, uninhabited from Migdol to Syene and the border of Cush, then restored to Pathros as a lowly kingdom", cluster: prophecy}
  egypt-from-migdol-to-syene: {label: "Egypt's extent 'from Migdol to Syene (Aswan) and the border of Cush'", cluster: geography}
  egypt-given-as-wages-for-tyre-siege: {label: "Nebuchadnezzar's army labored at Tyre till every head was bald and shoulder rubbed, without reward, so God gives him Egypt as wages", cluster: prophecy}
  horn-sprouts-for-israel: {label: "On that day God will make a horn sprout for the house of Israel", cluster: messianism}
  prophet-given-opening-of-mouth: {label: "God gives the prophet 'an opening of the mouth' among the people", cluster: prophecy}
  day-of-yhwh-near: {label: "The Day of YHWH is near: a day of cloud, a time of doom for the nations", cluster: eschatology}
  messengers-in-ships-terrify-cush: {label: "On that day messengers go out from God in ships to terrify complacent Cush", cluster: prophecy}
  egyptian-cities-catalogue-doom: {label: "Catalogue of doomed Egyptian cities: Noph (Memphis), Pathros, Zoan, No (Thebes), Sin (Pelusium), Aven (On), Pi-beseth (Bubastis), Tehaphnehes", cluster: geography}
  idols-of-memphis-destroyed: {label: "God destroys the idols and puts an end to the false gods of Memphis", cluster: cult}
  day-darkens-at-tahpanhes: {label: "At Tehaphnehes the day grows dark when God breaks the yokes of Egypt; a cloud covers her", cluster: judgment}
  pharaohs-arms-broken-babylons-strengthened: {label: "God breaks Pharaoh's arm (unbandaged, unhealed) and both his arms, and strengthens the arms of the king of Babylon, putting his own sword in his hand", cluster: kingship}
  cosmic-cedar-watered-by-tehom: {label: "Assyria/Pharaoh as a towering cedar of Lebanon nourished by the deep (tehom), its top among the clouds, all birds nesting and beasts bearing young under it, all nations in its shade", cluster: cosmology}
  trees-of-eden-envy-great-tree: {label: "No tree in the garden of God, Eden, equalled the great tree's beauty; all the trees of Eden envied it", cluster: cosmology}
  great-tree-felled-for-pride: {label: "Because it grew proud of its height, foreigners cut the great tree down; its boughs fall on mountains and valleys and the peoples leave its shade", cluster: judgment}
  deep-mourns-waters-stopped: {label: "When the tree goes down to Sheol God makes the deep mourn, holds back its rivers and darkens Lebanon", cluster: cosmology}
  trees-of-eden-comforted-in-underworld: {label: "The trees of Eden already in the netherworld are comforted when the great tree descends to join them", cluster: afterlife}
  lie-among-uncircumcised-and-slain: {label: "The fallen king lies in the netherworld among the uncircumcised and those slain by the sword", cluster: afterlife}
  pharaoh-young-lion-and-sea-dragon: {label: "Pharaoh likened to a young lion of the nations yet a dragon (tannin) in the seas, thrashing in his rivers and muddying the waters with his feet", cluster: cosmology}
  monster-caught-in-gods-net-by-many-peoples: {label: "God spreads his net over the sea monster with a company of many peoples and hauls it up in his dragnet", cluster: cosmology}
  monster-carcass-fills-valleys: {label: "The slain monster's flesh is spread on the mountains, its carrion fills the valleys and its blood waters the land up to the mountains", cluster: cosmology}
  heavens-darkened-at-death-of-monster: {label: "When the monster is extinguished God covers the heavens, darkens the stars, covers the sun with cloud and the moon gives no light", cluster: cosmology}
  rivers-flow-like-oil: {label: "God makes the waters settle clear and the rivers run like oil", cluster: cosmology}
  daughters-of-nations-chant-dirge: {label: "The daughters of the nations chant the dirge for the fallen nation (professional keening women)", cluster: ritual}
  nations-in-sheol-catalogue: {label: "Tour of the netherworld: Assyria, Elam, Meshech-Tubal, Edom, the princes of the north and the Sidonians lie with their hordes around their graves in the recesses of the Pit", cluster: afterlife}
  mighty-dead-speak-from-sheol: {label: "The mightiest heroes (elei gibborim) speak to the newcomer from the midst of Sheol", cluster: afterlife}
  spread-terror-in-land-of-living: {label: "Refrain: those who spread terror in the land of the living now bear their shame with those who go down to the Pit", cluster: afterlife}
  ancient-heroes-buried-with-swords-under-heads: {label: "The fallen mighty ones of old went down to Sheol with their weapons of war, swords laid under their heads", cluster: afterlife}
  graves-in-recesses-of-pit: {label: "Graves set in the farthest recesses (yarketei) of the Pit", cluster: afterlife}
  pharaoh-consoled-seeing-the-dead: {label: "Pharaoh will see the other slain kings in Sheol and be consoled for his horde", cluster: afterlife}
  prophet-as-watchman: {label: "The prophet is appointed watchman (tsofeh) for Israel: if he warns the wicked and they ignore him he saves his own soul; if he fails to warn, their blood is required of him", cluster: prophecy}
  watchman-blows-shofar-at-sword: {label: "The watchman who sees the sword coming blows the shofar to warn the people; whoever ignores it, his blood is on his own head", cluster: warfare}
  we-rot-in-our-sins-how-live: {label: "Exiles despair: 'Our transgressions are upon us and we rot away in them; how then shall we live?'", cluster: theology}
  turn-turn-why-will-you-die: {label: "Call 'Turn back, turn back from your evil ways; why will you die, O house of Israel?'", cluster: theology}
  fugitive-reports-city-has-fallen: {label: "A fugitive arrives in exile announcing 'the city has been struck', and the prophet's mouth is opened", cluster: prophecy}
  abraham-was-one-we-are-many: {label: "Survivors in the ruins argue 'Abraham was only one and inherited the land; we are many, so the land is given to us'", cluster: patriarchs}
  prophet-as-love-song-entertainer: {label: "People come to hear the prophet as one hears a lovely singer of love songs with a fine instrument, but do not do his words", cluster: prophecy}
  they-will-know-a-prophet-was-among-them: {label: "When the word comes true, 'they shall know that a prophet has been among them'", cluster: prophecy}
  shepherds-feed-themselves-not-flock: {label: "Woe to the shepherds of Israel who feed themselves, eat the fat, wear the wool, slaughter the fatlings and do not tend the flock", cluster: kingship}
  shepherd-duties-weak-sick-injured-strayed-lost: {label: "The shepherd's neglected duties: strengthen the weak, heal the sick, bind up the injured, bring back the strayed, seek the lost", cluster: kingship}
  sheep-scattered-prey-to-beasts: {label: "Without a shepherd the flock is scattered over every mountain and hill and becomes food for wild beasts, with no one to search for them", cluster: kingship}
  god-himself-will-shepherd: {label: "God declares 'I myself will search for my sheep and seek them out' and shepherd them on the mountains of Israel", cluster: theology}
  god-judges-between-fat-and-lean-sheep: {label: "God judges between sheep and sheep, fat and lean, rams and goats who trample the pasture, foul the water and butt the weak with their horns", cluster: theology}
  one-shepherd-my-servant-david: {label: "God will raise up over them one shepherd, 'my servant David', as prince (nasi) among them", cluster: messianism}
  covenant-of-peace-wild-beasts-banished: {label: "God makes a covenant of peace, banishing evil beasts so the flock can dwell securely in the wilderness and sleep in the forests", cluster: restoration}
  showers-of-blessing: {label: "God sends down the rain in its season, 'showers of blessing', and tree and land yield their fruit", cluster: restoration}
  plantation-of-renown: {label: "God raises up for them 'a plantation of renown' (matta' leshem) so they are no longer consumed by famine", cluster: restoration}
  you-are-my-flock-you-are-men: {label: "'You are my flock, the flock of my pasture; you are men (adam), and I am your God'", cluster: theology}
  mount-seir-eternal-enmity: {label: "Mount Seir (Edom) is condemned for its 'eternal enmity', delivering Israel to the sword at the time of their calamity", cluster: prophecy}
  blood-pursues-blood: {label: "'Since you did not hate blood, blood shall pursue you'", cluster: judgment}
  edom-claims-two-nations-though-yhwh-there: {label: "Edom says 'these two nations and two lands will be mine' although YHWH was there", cluster: prophecy}
  measure-for-measure-desolation: {label: "As the nation rejoiced over Israel's desolate inheritance, so God will make it desolate (measure for measure)", cluster: judgment}
  mountains-of-israel-shall-bear-fruit: {label: "The mountains of Israel, mocked by the nations, will again put forth branches and bear fruit for God's returning people, and be tilled and sown", cluster: restoration}
  land-no-longer-devours-its-children: {label: "The land that was said to devour men and bereave its nations will devour and bereave no more", cluster: restoration}
  impurity-as-menstrual-uncleanness-of-land: {label: "Israel's conduct defiled the land 'like the uncleanness of a menstruous woman'", cluster: cult}
  exile-profanes-gods-name-among-nations: {label: "The exiles profane God's holy name among the nations, who say 'These are YHWH's people, yet they had to leave his land'", cluster: theology}
  not-for-your-sake-but-my-name: {label: "God declares 'Not for your sake do I act, O house of Israel, but for my holy name which you profaned'", cluster: theology}
  sprinkle-clean-water-to-purify: {label: "God will sprinkle clean water upon them and purify them from all their uncleanness and idols", cluster: restoration}
  god-puts-his-spirit-within: {label: "God will put his own spirit within them and cause them to walk in his statutes", cluster: theology}
  desolate-land-like-garden-of-eden: {label: "Onlookers say 'This desolate land has become like the garden of Eden'", cluster: restoration}
  increase-like-holy-flocks-at-festivals: {label: "God will multiply the people like flocks of men, like the holy flocks of Jerusalem at her appointed feasts", cluster: restoration}
  valley-of-dry-bones: {label: "The prophet is set down in a valley full of very many, very dry bones and led around among them", cluster: afterlife}
  can-these-bones-live: {label: "God asks 'Can these bones live?' and the prophet answers 'Lord God, you know'", cluster: afterlife}
  bones-reassembled-sinews-flesh-skin: {label: "At the prophet's word there is a rattling; bones come together bone to bone, then sinews, flesh and skin cover them, but there is no breath", cluster: afterlife}
  prophesy-to-the-breath-from-four-winds: {label: "The prophet summons the breath (ruah) from the four winds to breathe into the slain so they live", cluster: afterlife}
  dead-revived-as-vast-army: {label: "The revived dead stand on their feet, an exceedingly great army", cluster: afterlife}
  our-bones-are-dried-hope-lost: {label: "The exiles say 'Our bones are dried up, our hope is lost, we are cut off'", cluster: theology}
  god-opens-graves-raises-people: {label: "God will open his people's graves, bring them up from their graves and bring them to the land of Israel", cluster: afterlife}
  two-sticks-joined-into-one: {label: "Prophet writes 'For Judah' and 'For Joseph, the stick of Ephraim' on two sticks and joins them into one in his hand: the reunited kingdom", cluster: prophecy}
  one-nation-one-king-no-more-divided: {label: "Israel will be one nation with one king, never again divided into two kingdoms", cluster: messianism}
  david-prince-forever: {label: "'David my servant shall be their prince (nasi) forever'", cluster: messianism}
  sanctuary-in-their-midst-forever: {label: "God sets his sanctuary in their midst forever and his dwelling (mishkan) is over them", cluster: restoration}
  gog-of-magog-chief-prince: {label: "Gog of the land of Magog, chief prince (nesi rosh) of Meshech and Tubal, an eschatological invader", cluster: eschatology}
  hooks-in-jaws-turned-back: {label: "God turns the invader around and puts hooks in his jaws to drag him out with all his army", cluster: eschatology}
  coalition-of-distant-nations-with-gog: {label: "Gog's coalition: Persia, Cush, Put, Gomer with all its hordes, Beth-togarmah from the far north, many peoples", cluster: eschatology}
  invader-from-recesses-of-north: {label: "The final invader comes from the farthest recesses of the north (yarketei tsafon)", cluster: eschatology}
  invasion-in-latter-years: {label: "Gog is summoned 'after many days', 'in the latter years / end of days', against a land restored from the sword", cluster: eschatology}
  invader-like-storm-cloud: {label: "The invading host comes up like a storm, like a cloud covering the land", cluster: eschatology}
  attack-on-unwalled-peaceful-villages: {label: "The invader plots to attack a quiet people dwelling securely in unwalled villages without bars or gates, to seize plunder", cluster: eschatology}
  sheba-dedan-tarshish-ask-about-plunder: {label: "Sheba, Dedan and the merchants of Tarshish ask the invader 'Have you come to take plunder?'", cluster: eschatology}
  israel-at-navel-of-the-earth: {label: "Restored Israel dwells 'on the navel of the earth' (tabbur ha-arets)", cluster: cosmology}
  gog-foretold-by-earlier-prophets: {label: "God asks 'Are you the one of whom I spoke in former days through my servants the prophets?'", cluster: prophecy}
  great-earthquake-all-creatures-quake: {label: "On that day a great earthquake shakes the land; fish, birds, beasts, creeping things and all humans quake before God, mountains are thrown down and every wall falls", cluster: eschatology}
  invaders-sword-against-brother: {label: "Every man's sword is turned against his brother in the enemy host", cluster: warfare}
  plague-flood-hail-fire-sulfur-on-gog: {label: "God judges Gog with pestilence, blood, torrential rain, hailstones, fire and sulfur", cluster: eschatology}
  bow-struck-from-left-arrows-from-right: {label: "God strikes the bow from the invader's left hand and makes the arrows drop from his right hand", cluster: warfare}
  fire-on-magog-and-coastlands: {label: "God sends fire on Magog and on those who dwell securely in the coastlands", cluster: eschatology}
  weapons-burned-seven-years: {label: "Israel's townsfolk burn the enemy weapons (shields, bows, arrows, clubs, spears) as fuel for seven years, cutting no wood from the forest", cluster: eschatology}
  plunderers-plundered: {label: "Israel plunders those who plundered them and despoils those who despoiled them", cluster: warfare}
  valley-of-hamon-gog: {label: "Gog and his horde are buried in the Valley of the Travelers east of the sea, renamed Valley of Hamon-Gog; a city is named Hamonah", cluster: eschatology}
  seven-months-burial-to-cleanse-land: {label: "All Israel buries the dead for seven months to purify the land; appointed men search the land and mark every human bone with a sign (tsiyyun) for the buriers", cluster: purity}
  sacrificial-feast-for-birds-and-beasts: {label: "God invites every bird and beast to his great sacrifice on the mountains of Israel to eat the flesh of mighty men and drink the blood of princes, as of rams, lambs, goats and Bashan bulls, till drunk with blood", cluster: eschatology}
  feast-at-gods-table-on-horses-and-riders: {label: "The carrion-eaters are sated at God's table with horses, charioteers, warriors and all men of war", cluster: eschatology}
  exile-explained-to-nations: {label: "The nations will know that Israel went into exile for its own iniquity because God hid his face, not because he was weak", cluster: theology}
  god-pours-out-his-spirit: {label: "God will no longer hide his face from Israel, for he has poured out his spirit on the house of Israel", cluster: theology}
  temple-vision-dated-rosh-hashanah-tenth: {label: "The temple vision is dated 'in the twenty-fifth year of our exile, at the beginning of the year (rosh ha-shanah), on the tenth of the month, the fourteenth year after the city fell, on that very day'", cluster: calendar}
  very-high-mountain-with-city-structure: {label: "In visions of God the prophet is set on a very high mountain on which there is something like a city structure to the south", cluster: cosmology}
  angelic-measurer-like-bronze: {label: "A man whose appearance is like bronze stands in the gate with a linen cord and a measuring reed, guiding the visionary", cluster: angels}
  see-hear-and-tell-commission: {label: "Visionary told: 'look with your eyes, hear with your ears, set your heart on all I show you, and declare it all to the house of Israel'", cluster: prophecy}
  measuring-reed-six-long-cubits: {label: "The measuring reed is six cubits, each a cubit and a handbreadth (the long cubit)", cluster: architecture}
  visionary-temple-measured-gate-by-gate: {label: "The visionary temple is measured part by part: wall, three-sided gatehouses with three guard chambers each, porches, jambs, windows and palm ornaments", cluster: architecture}
  three-identical-outer-gates-east-north-south: {label: "Three identical gatehouses (east, north, south), 50 by 25 cubits, with seven steps to the outer court and eight to the inner", cluster: architecture}
  thirty-chambers-on-pavement: {label: "Thirty chambers stand on the stone pavement around the outer court", cluster: architecture}
  hundred-cubit-courts: {label: "Gate stands opposite gate at 100 cubits; the inner court is a square 100 by 100 cubits with the altar before the house", cluster: architecture}
  eight-slaughter-tables-at-gate: {label: "Eight tables at the inner gate for slaughtering burnt, sin and guilt offerings, and four hewn-stone tables for the implements, with hooks a handbreadth long", cluster: cult}
  chambers-for-singers-and-priests: {label: "Chambers in the inner court for the (singers/)priests who keep the charge of the house and those who keep the charge of the altar", cluster: cult}
  zadokites-alone-approach-altar: {label: "Only the sons of Zadok among the Levites may come near to YHWH to minister at the altar", cluster: cult}
  temple-porch-with-two-pillars: {label: "The porch of the house is reached by steps and has pillars beside its jambs, one on each side", cluster: architecture}
units:
  - id: hb-ezek-5-hair-thirds
    tradition: judaism
    title: The shaven hair divided in thirds; Jerusalem in the midst of the nations
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Ezek 5:1-17"]
    tags:
      - {motif: prophet-shaves-hair-with-sword-sign, refs: ["Ezek 5:1", "Ezek 5:2"], note: "a sharp sword used as a barber's razor; hair weighed on scales"}
      - {motif: few-hairs-bound-in-hem, refs: ["Ezek 5:3", "Ezek 5:4"], note: "bound in his 'wings' (kenafekha); a fire goes out from them to all Israel"}
      - {motif: jerusalem-set-in-midst-of-nations, refs: ["Ezek 5:5"]}
      - {motif: unparalleled-judgment-never-again, refs: ["Ezek 5:9"]}
      - {motif: reciprocal-cannibalism-fathers-and-sons, refs: ["Ezek 5:10"]}
      - {motif: cannibalism-in-siege, refs: ["Ezek 5:10"]}
      - {motif: scattering-among-nations, refs: ["Ezek 5:2", "Ezek 5:10", "Ezek 5:12"], note: "'to every wind'; God unsheathes a sword after them"}
      - {motif: divine-oath-by-own-life, refs: ["Ezek 5:11"]}
      - {motif: sword-famine-pestilence-triad, refs: ["Ezek 5:12", "Ezek 5:17"]}
      - {motif: arrows-of-famine, refs: ["Ezek 5:16"]}
      - {motif: famine-summoned-staff-of-bread-broken, refs: ["Ezek 5:16"]}
      - {motif: wild-beasts-sent-as-punishment, refs: ["Ezek 5:17"]}
      - {motif: byword-and-proverb-among-nations, refs: ["Ezek 5:14", "Ezek 5:15"]}
    hints:
      - "Hair-cutting and dividing as a symbolic act; compare Mesopotamian prophetic letters (Mari) in which a prophet's hair and garment hem are sent to the king as tokens."
      - "Jerusalem at the center of the nations underlies the rabbinic and medieval 'navel of the world' idea (Tanhuma Kedoshim 10; Jubilees 8:19; medieval mappae mundi)."
  - id: hb-ezek-6-mountains-of-israel
    tradition: judaism
    title: Oracle against the mountains of Israel and their high places
    corpus: hebrew-bible
    original: true
    tagger: Claude (model), reading the Hebrew
    read: ["Ezek 6:1-14"]
    tags:
      - {motif: prophet-sets-face-toward, refs: ["Ezek 6:2"]}
      - {motif: oracle-addressed-to-mountains, refs: ["Ezek 6:2", "Ezek 6:3"]}
      - {motif: hammanim-incense-stands, refs: ["Ezek 6:4", "Ezek 6:6"]}
      - {motif: corpses-before-idols-bones-around-altars, refs: ["Ezek 6:4", "Ezek 6:5", "Ezek 6:13"]}
      - {motif: high-places-green-trees, refs: ["Ezek 6:13"], note: "every high hill, mountaintops, every leafy tree and thick terebinth, where they offered 'pleasing odor' to idols"}
