new_motifs:
  wisdom-personified-as-woman:
    label: Wisdom personified as a woman who speaks, builds, invites and acts
    cluster: wisdom
  wisdom-builds-house-seven-pillars:
    label: Wisdom builds her house and hews out its seven pillars
    cluster: wisdom
  wisdom-banquet-bread-and-mixed-wine:
    label: Personified Wisdom slaughters meat, mixes wine, sets a table and invites guests to eat her bread and drink her wine
    cluster: wisdom
  wisdom-calls-from-heights-of-city:
    label: Wisdom (or Folly) calls out from the heights of the city to passers-by
    cluster: wisdom
  rival-women-identical-invitation:
    label: 'Wisdom and Folly issue the same invitation: ''Whoever is simple, turn in here'''
    cluster: wisdom
  do-not-rebuke-scoffer:
    label: Do not reprove a scoffer, he will hate you; reprove a wise man and he will love you
    cluster: wisdom
  wisdom-prolongs-life:
    label: Wisdom or the fear of YHWH adds days and years of life; the years of the wicked are shortened
    cluster: wisdom
  folly-personified-as-woman:
    label: Folly personified as a loud, ignorant woman who sits at her door luring passers-by
    cluster: wisdom
  stolen-waters-sweet:
    label: '''Stolen waters are sweet and bread eaten in secret is pleasant'''
    cluster: wisdom
  guests-of-folly-in-sheol:
    label: The guests of the seductive woman are already among the dead in the depths of Sheol
    cluster: wisdom
  solomonic-proverb-collection-heading:
    label: A collection of sayings is headed 'Proverbs of Solomon'
    cluster: wisdom
  wise-son-gladdens-father:
    label: A wise son gladdens his father; a foolish son grieves his mother
    cluster: wisdom
  righteousness-delivers-from-death:
    label: Treasures of wickedness do not profit, but righteousness (tsedaqah) delivers from death
    cluster: wisdom
  diligent-hand-enriches-slack-hand-poor:
    label: The diligent hand makes rich and rules; the slack hand brings poverty and forced labor
    cluster: wisdom
  gather-in-summer-sleep-in-harvest:
    label: The prudent son gathers in summer; the shameful son sleeps in harvest
    cluster: wisdom
  name-of-wicked-rots:
    label: The memory of the righteous is for blessing but the name of the wicked rots
    cluster: wisdom
  winking-eye-malice:
    label: Winking the eye and pursing the lips signal malicious scheming
    cluster: wisdom
  fountain-of-life:
    label: Wise teaching, the righteous mouth or the fear of YHWH is a 'fountain of life' (meqor hayyim)
    cluster: wisdom
  love-covers-all-offenses:
    label: Hatred stirs up strife, but love covers all offenses
    cluster: wisdom
  rod-for-back-of-fool:
    label: A rod is for the back of the fool (the senseless)
    cluster: wisdom
  wealth-as-fortified-city:
    label: The rich man's wealth is his strong city; the poverty of the poor is their ruin
    cluster: wisdom
  restraint-of-speech-wise:
    label: In many words transgression is not lacking; he who restrains his lips is wise
    cluster: wisdom
  wicked-pass-like-storm:
    label: When the storm passes the wicked is no more, but the righteous is an everlasting foundation
    cluster: wisdom
  sluggard-like-vinegar-and-smoke:
    label: Like vinegar to the teeth and smoke to the eyes is the sluggard to those who send him
    cluster: wisdom
  righteous-inherit-land-wicked-uprooted:
    label: The righteous will never be moved and will dwell in the land; the wicked will not inhabit it
    cluster: wisdom
  abomination-to-yhwh-saying:
    label: Saying of the type 'X is an abomination (to'evah) to YHWH but Y is his delight'
    cluster: wisdom
  pride-before-fall:
    label: Pride goes before destruction and a haughty spirit before stumbling
    cluster: wisdom
  wealth-useless-on-day-of-wrath:
    label: Wealth does not profit on the day of wrath
    cluster: wisdom
  wicked-ransom-for-righteous:
    label: The righteous is rescued from trouble and the wicked goes in his place (as his ransom)
    cluster: wisdom
  city-rejoices-at-fall-of-wicked:
    label: A city exults at the prosperity of the righteous and shouts for joy when the wicked perish
    cluster: wisdom
  talebearer-reveals-secrets:
    label: The talebearer (rakhil) goes about revealing secrets; the faithful conceal a matter
    cluster: wisdom
  safety-in-many-counselors:
    label: Without counsel a people falls; in a multitude of counselors there is victory
    cluster: wisdom
  warning-against-surety:
    label: Warning against standing surety (pledge) for a stranger or a neighbor's debt
    cluster: wisdom
  gold-ring-in-pigs-snout:
    label: Like a gold ring in a pig's snout is a beautiful woman without discretion
    cluster: wisdom
  generous-giver-enriched:
    label: One scatters and yet increases; the generous soul is made fat and who waters will be watered
    cluster: wisdom
  grain-hoarder-cursed:
    label: The people curse him who withholds grain, but blessing is on the head of him who sells it
    cluster: wisdom
  righteous-flourish-like-foliage:
    label: He who trusts in riches falls; the righteous sprout like green leaves
    cluster: wisdom
  inherit-the-wind:
    label: He who troubles his household will inherit the wind
    cluster: wisdom
  wise-takes-souls:
    label: The fruit of the righteous is a tree of life and the wise man 'takes souls' (wins people)
    cluster: wisdom
  righteous-repaid-on-earth:
    label: If the righteous is repaid on earth, how much more the wicked and the sinner
    cluster: wisdom
  capable-wife-crown-of-husband:
    label: A woman of valor (eshet hayil) is her husband's crown; a shameful one is rot in his bones
    cluster: wisdom
  righteous-cares-for-animals:
    label: The righteous knows the soul (needs) of his beast; the mercies of the wicked are cruel
    cluster: wisdom
  fool-right-in-own-eyes:
    label: The way of the fool is right in his own eyes, but the wise listens to counsel
    cluster: wisdom
  healing-tongue:
    label: The tongue of the wise is healing; a gentle tongue is a tree of life
    cluster: wisdom
  truth-endures-lie-momentary:
    label: Truthful lips endure forever, a lying tongue only for a moment
    cluster: wisdom
  anxiety-weighs-down-heart:
    label: Anxiety in a man's heart weighs it down, but a good word makes it glad
    cluster: wisdom
  path-of-righteousness-no-death:
    label: In the path of righteousness is life and on its way there is no death ('al-mavet)
    cluster: wisdom
  feigned-wealth-feigned-poverty:
    label: One pretends to be rich and has nothing; another pretends to be poor and has great wealth
    cluster: wisdom
  lamp-of-wicked-extinguished:
    label: The light of the righteous rejoices but the lamp of the wicked is put out
    cluster: wisdom
  hope-deferred-sickens-heart:
    label: Hope deferred makes the heart sick, but desire fulfilled is a tree of life
    cluster: wisdom
  companions-shape-character:
    label: He who walks with the wise becomes wise; the companion of fools suffers harm
    cluster: wisdom
  sinners-wealth-stored-for-righteous:
    label: The good leaves an inheritance to his grandchildren; the sinner's wealth is stored up for the righteous
    cluster: wisdom
  spare-the-rod:
    label: He who spares the rod hates his son; corporal discipline of children is commended
    cluster: wisdom
  wise-woman-builds-house:
    label: The wisest of women builds her house; folly tears it down with her own hands
    cluster: wisdom
  no-oxen-clean-crib:
    label: Where there are no oxen the crib is clean, but much produce comes by the strength of the ox
    cluster: wisdom
  true-and-false-witness:
    label: A faithful witness does not lie; a false witness breathes out lies and will not go unpunished
    cluster: wisdom
  heart-knows-own-bitterness:
    label: The heart knows its own bitterness and no stranger shares its joy
    cluster: wisdom
  way-that-seems-right-ends-in-death:
    label: There is a way that seems right to a man, but its end is the ways of death
    cluster: wisdom
  laughter-with-aching-heart:
    label: Even in laughter the heart may ache, and the end of joy is grief
    cluster: wisdom
  simple-believes-everything:
    label: The simple believes every word; the prudent considers his steps
    cluster: wisdom
  poor-friendless-rich-many-friends:
    label: The poor is hated even by his neighbor, but the rich has many friends
    cluster: wisdom
  oppressing-poor-insults-maker:
    label: He who oppresses the poor insults his Maker; he who is gracious to the needy honors him
    cluster: wisdom
  king-glory-in-multitude:
    label: A king's glory is in a multitude of people; without people a prince is ruined
    cluster: kingship
  envy-rots-bones:
    label: A tranquil heart is life to the body, but jealousy is rot in the bones
    cluster: wisdom
  slow-to-anger-better-than-warrior:
    label: The slow to anger is better than a mighty man, and he who rules his spirit than he who takes a city
    cluster: wisdom
  righteousness-exalts-nation:
    label: Righteousness exalts a nation, but sin is a reproach to peoples
    cluster: wisdom
  king-favors-wise-servant:
    label: The king's favor is toward a wise servant; his wrath toward one who shames
    cluster: kingship
  soft-answer-turns-wrath:
    label: A soft answer turns away wrath, but a harsh word stirs up anger
    cluster: wisdom
  eyes-of-yhwh-everywhere:
    label: The eyes of YHWH are in every place, watching the evil and the good
    cluster: theology
  sacrifice-of-wicked-abomination:
    label: The sacrifice of the wicked is an abomination to YHWH, but the prayer of the upright is his delight
    cluster: cult
  better-than-saying:
    label: '''Better is X than Y'' comparative saying (tov ... min)'
    cluster: wisdom
  dinner-of-herbs-with-love:
    label: Better a dinner of vegetables where love is than a fattened ox with hatred
    cluster: wisdom
  sluggard-path-hedge-of-thorns:
    label: The way of the sluggard is like a hedge of thorns; the path of the upright is a highway
    cluster: wisdom
  word-in-season:
    label: 'A word spoken in its right time: how good it is'
    cluster: wisdom
  path-of-life-upward-from-sheol:
    label: The path of life leads upward for the wise, to turn away from Sheol below
    cluster: wisdom
  god-guards-widows-boundary:
    label: YHWH tears down the house of the proud but sets fast the widow's boundary
    cluster: wisdom
  hater-of-bribes-lives:
    label: He who is greedy for gain troubles his house, but he who hates gifts (bribes) will live
    cluster: wisdom
  god-hears-prayer-of-righteous:
    label: YHWH is far from the wicked but hears the prayer of the righteous
    cluster: theology
  humility-before-honor:
    label: Before honor comes humility
    cluster: wisdom
  man-plans-god-disposes:
    label: The heart of man plans his way but YHWH directs his steps; only YHWH's counsel stands
    cluster: wisdom
  god-weighs-hearts:
    label: All a man's ways seem pure in his eyes, but YHWH weighs the spirits (hearts)
    cluster: wisdom
  roll-works-onto-yhwh:
    label: Roll (commit) your works to YHWH and your plans will be established
    cluster: wisdom
  god-made-all-for-purpose-even-wicked:
    label: YHWH has made everything for its purpose, even the wicked for the day of evil
    cluster: theology
  atonement-by-loyalty-and-truth:
    label: By loyalty and faithfulness (hesed we-emet) iniquity is atoned for
    cluster: theology
  enemies-at-peace-with-righteous:
    label: When a man's ways please YHWH he makes even his enemies to be at peace with him
    cluster: wisdom
  oracle-on-kings-lips:
    label: Divination (qesem) is on the lips of the king; his mouth does not err in judgment
    cluster: kingship
  throne-established-by-righteousness:
    label: The throne is established by righteousness (and loyalty)
    cluster: kingship
  kings-wrath-messengers-of-death:
    label: The wrath of a king is messengers of death, but a wise man will pacify it
    cluster: kingship
  kings-face-light-and-spring-rain:
    label: In the light of the king's face is life; his favor is like a cloud of the latter rain
    cluster: kingship
  wisdom-better-than-gold:
    label: Getting wisdom is better than gold, understanding than silver or jewels
    cluster: wisdom
  pleasant-words-honeycomb:
    label: Pleasant words are a honeycomb, sweet to the soul and healing to the bones
    cluster: wisdom
  hunger-drives-laborer:
    label: The worker's appetite works for him, for his mouth urges him on
    cluster: wisdom
  scoundrel-speech-scorching-fire:
    label: The worthless man (ish beliyya'al) digs up evil and on his lips is a scorching fire
    cluster: wisdom
  whisperer-separates-friends:
    label: A whisperer separates close friends
    cluster: wisdom
  grey-hair-crown-of-glory:
    label: Grey hair is a crown of glory, found in the way of righteousness
    cluster: wisdom
  lot-cast-into-lap:
    label: The lot is cast into the lap, but its every decision is from YHWH
    cluster: divination
  dry-morsel-in-peace:
    label: Better a dry morsel with quiet than a house full of feasting (zivhei riv) with strife
    cluster: wisdom
  wise-slave-inherits-with-sons:
    label: A wise slave will rule over a shameful son and share the inheritance among the brothers
    cluster: wisdom
  crucible-for-silver-yhwh-tests-hearts:
    label: The crucible is for silver and the furnace for gold, but YHWH tests hearts
    cluster: wisdom
  mocking-poor-insults-maker:
    label: He who mocks the poor insults his Maker; he who rejoices at calamity will not go unpunished
    cluster: wisdom
  grandchildren-crown-of-elders:
    label: Grandchildren are the crown of the aged and fathers the glory of their sons
    cluster: wisdom
  bribe-as-charm-stone:
    label: A bribe is a stone of charm (even hen) in the eyes of its owner; wherever he turns he prospers
    cluster: wisdom
  bribe-from-bosom-perverts-justice:
    label: The wicked takes a bribe from the bosom to pervert the ways of justice
    cluster: law
  rebuke-better-than-hundred-blows:
    label: A rebuke goes deeper into a discerning man than a hundred blows into a fool
    cluster: wisdom
  bereaved-bear-rather-than-fool:
    label: Better to meet a bear robbed of her cubs than a fool in his folly
    cluster: wisdom
  evil-for-good-never-leaves-house:
    label: Whoever returns evil for good, evil will not depart from his house
    cluster: wisdom
  strife-like-releasing-water:
    label: The beginning of strife is like letting out water; quit before the quarrel breaks out
    cluster: wisdom
  justifying-wicked-condemning-righteous:
    label: He who justifies the wicked and he who condemns the righteous are both an abomination to YHWH
    cluster: law
  money-in-fools-hand-to-buy-wisdom:
    label: Why is there a price in the hand of a fool to buy wisdom when he has no heart?
    cluster: wisdom
  friend-loves-brother-born-for-adversity:
    label: A friend loves at all times and a brother is born for adversity
    cluster: wisdom
  cheerful-heart-good-medicine:
    label: A joyful heart is good medicine, but a broken spirit dries up the bones
    cluster: wisdom
  eyes-of-fool-on-ends-of-earth:
    label: Wisdom is before the face of the discerning, but the eyes of a fool are on the ends of the earth
    cluster: wisdom
  silent-fool-thought-wise:
    label: Even a fool who keeps silent is counted wise
    cluster: wisdom
  words-as-deep-waters:
    label: The words of a man's mouth are deep waters; the fountain of wisdom a gushing stream
    cluster: wisdom
  gossip-like-delicacies-in-belly:
    label: The words of a whisperer are like delicious morsels that go down into the inner chambers of the belly
    cluster: wisdom
  name-of-yhwh-strong-tower:
    label: The name of YHWH is a strong tower; the righteous runs into it and is safe
    cluster: theology
  answer-before-hearing-folly:
    label: He who answers before he hears, it is folly and shame to him
    cluster: wisdom
  gift-opens-way-to-great:
    label: A man's gift makes room for him and brings him before the great
    cluster: wisdom
  hear-both-sides:
    label: The first to plead his case seems right until the other comes and examines him
    cluster: law
  lot-ends-disputes:
    label: The lot puts an end to quarrels and decides between the mighty
    cluster: divination
  offended-brother-harder-than-city:
    label: An offended brother is harder to win than a strong city; quarrels are like the bars of a citadel
    cluster: wisdom
  death-and-life-in-power-of-tongue:
    label: Death and life are in the hand of the tongue
    cluster: wisdom
  finding-wife-finding-good:
    label: He who finds a wife finds a good thing and obtains favor from YHWH; a prudent wife is from YHWH
    cluster: wisdom
  friend-closer-than-brother:
    label: There is a friend who sticks closer than a brother
    cluster: wisdom
  fool-rages-against-yhwh:
    label: A man's folly ruins his way and his heart rages against YHWH
    cluster: wisdom
  kings-wrath-like-lions-roar:
    label: The king's wrath is like the growling of a young lion; his favor like dew on the grass
    cluster: kingship
  quarrelsome-wife-dripping-roof:
    label: A quarrelsome wife is like a continual dripping (of a leaking roof)
    cluster: wisdom
  lending-to-yhwh-by-giving-to-poor:
    label: He who is gracious to the poor lends to YHWH, and he will repay him
    cluster: wisdom
  sluggard-hand-in-dish:
    label: The sluggard buries his hand in the dish and will not even bring it back to his mouth
    cluster: wisdom
  strike-scoffer-simple-learns:
    label: Strike a scoffer and the simple will learn prudence
    cluster: wisdom
  son-who-assaults-parents:
    label: A son who ruins his father and chases away his mother brings shame
    cluster: wisdom
  wine-a-mocker:
    label: Wine is a mocker and strong drink a brawler; whoever is led astray by it is not wise
    cluster: wisdom
  sluggard-does-not-plow-in-winter:
    label: The sluggard does not plow in autumn; he asks at harvest and has nothing
    cluster: wisdom
  counsel-deep-water-drawn-out:
    label: Counsel in a man's heart is deep water; a man of understanding draws it out
    cluster: wisdom
  faithful-man-who-can-find:
    label: Many proclaim their loyalty, but a faithful man who can find?
    cluster: wisdom
  king-winnows-evil-with-eyes:
    label: A king seated on the throne of judgment winnows all evil with his eyes
    cluster: kingship
  who-can-say-heart-is-pure:
    label: Who can say 'I have made my heart pure, I am clean from my sin'?
    cluster: theology
  god-made-ear-and-eye:
    label: The hearing ear and the seeing eye, YHWH made them both
    cluster: theology
  buyer-says-bad-bad:
    label: '''Bad, bad,'' says the buyer, then goes away and boasts'
    cluster: wisdom
  take-garment-of-surety:
    label: Take the garment of him who stands surety for a stranger; hold it in pledge for a foreign woman
    cluster: law
  bread-of-deceit-gravel-in-mouth:
    label: Bread gained by deceit is sweet, but afterwards the mouth is filled with gravel
    cluster: wisdom
  curser-of-parents-lamp-out:
    label: He who curses father or mother, his lamp is put out in the pupil of darkness
    cluster: wisdom
  do-not-repay-evil-wait-for-yhwh:
    label: Do not say 'I will repay evil'; wait for YHWH and he will save you
    cluster: wisdom
  rash-vow-snare:
    label: It is a snare to say rashly 'Holy!' and only afterwards to reflect on vows
    cluster: cult
  king-winnows-wicked-with-wheel:
    label: A wise king winnows the wicked and drives the threshing wheel over them
    cluster: kingship
  human-spirit-lamp-of-yhwh:
    label: The breath (nishmat) of man is the lamp of YHWH, searching all the inner chambers of the belly
    cluster: wisdom
  strength-of-young-grey-hair-of-old:
    label: The glory of young men is their strength, the splendor of the old their grey hair
    cluster: wisdom
  blows-cleanse-inner-parts:
    label: Bruising wounds scour away evil; blows cleanse the inner chambers
    cluster: wisdom
  kings-heart-water-channels-in-gods-hand:
    label: The king's heart is like channels of water in YHWH's hand; he turns it wherever he wishes
    cluster: kingship
  treasure-by-lies-fleeting-vapor:
    label: Treasures gained by a lying tongue are a driven vapor (hevel), a snare of death
    cluster: wisdom
  roof-corner-better-than-contentious-wife:
    label: Better to live in a corner of the roof or in the desert than with a contentious woman
    cluster: wisdom
  deaf-to-poor-unanswered:
    label: Whoever stops his ear at the cry of the poor will himself cry and not be answered
    cluster: wisdom
  secret-gift-pacifies-anger:
    label: A gift in secret averts anger and a bribe in the bosom strong wrath
    cluster: wisdom
  lover-of-pleasure-becomes-poor:
    label: He who loves pleasure, wine and oil will not grow rich
    cluster: wisdom
  wise-man-scales-city-of-mighty:
    label: A wise man scales the city of the mighty and brings down its trusted stronghold
    cluster: wisdom
  sluggard-killed-by-desire:
    label: The desire of the sluggard kills him, for his hands refuse to work
    cluster: wisdom
  victory-belongs-to-yhwh-not-horse:
    label: The horse is made ready for the day of battle, but victory belongs to YHWH; no wisdom avails against him
    cluster: theology
  good-name-better-than-riches:
    label: A good name is to be chosen rather than great riches, favor rather than silver and gold
    cluster: wisdom
  rich-and-poor-same-maker:
    label: Rich and poor meet together; YHWH is the maker of them all
    cluster: wisdom
  prudent-sees-danger-and-hides:
    label: The prudent sees evil and hides; the simple go on and suffer for it
    cluster: wisdom
  train-up-child-in-his-way:
    label: Train up a child according to his way; when he is old he will not depart from it
    cluster: wisdom
  borrower-slave-of-lender:
    label: The rich rules the poor and the borrower is slave to the lender
    cluster: wisdom
  good-eye-and-evil-eye:
    label: The 'good of eye' (generous) is blessed; the 'evil of eye' (stingy, envious) is to be shunned
    cluster: wisdom
  sluggard-lion-in-street:
    label: The sluggard says 'There is a lion outside; I shall be killed in the streets'
    cluster: wisdom
  strange-woman-deep-pit:
    label: The mouth of the strange woman (or harlot) is a deep pit, a narrow well into which the cursed falls
    cluster: wisdom
  instruction-parallel-to-amenemope:
    label: A section of sayings closely paralleling the Egyptian Instruction of Amenemope
    cluster: wisdom
  words-of-the-wise-heading:
    label: A collection introduced as 'words of (or sayings belonging to) the wise'
    cluster: wisdom
  thirty-sayings:
    label: The teacher says he has written 'thirty' (shalishim) sayings of counsel and knowledge
    cluster: wisdom
  sayings-kept-in-belly:
    label: Sayings kept in the belly (bitn) so that they are ready together on the lips
    cluster: wisdom
  do-not-rob-poor-at-gate:
    label: Do not rob the poor because he is poor nor crush the afflicted at the gate, for YHWH pleads their case
    cluster: wisdom
  do-not-befriend-hothead:
    label: Make no friendship with an angry man nor go with a hot-tempered man, lest you learn his ways
    cluster: wisdom
  surety-loses-his-bed:
    label: If you have nothing to pay, why should your bed be taken from under you?
    cluster: wisdom
  skilled-man-stands-before-kings:
    label: A man skillful in his work will stand before kings, not before obscure men
    cluster: wisdom
  eating-with-ruler-knife-to-throat:
    label: When dining with a ruler put a knife to your throat and do not crave his delicacies, deceptive food
    cluster: wisdom
  riches-fly-away-like-eagle:
    label: Riches make themselves wings and fly away like an eagle toward heaven
    cluster: wisdom
  stingy-hosts-food-vomited:
    label: Do not eat the bread of the stingy host who says 'eat and drink' while his heart is not with you; you will vomit up the morsel
    cluster: wisdom
  do-not-speak-to-fool:
    label: Do not speak in the ears of a fool, for he will despise the wisdom of your words
    cluster: wisdom
  orphans-field-strong-redeemer:
    label: Do not enter the fields of the fatherless, for their redeemer (go'el) is strong and will plead their cause
    cluster: wisdom
  rod-saves-from-sheol:
    label: Beat the child with the rod and you will save his soul from Sheol; he will not die
    cluster: wisdom
  kidneys-rejoice:
    label: The speaker's kidneys (kilyot) exult at the son's upright words
    cluster: wisdom
  do-not-envy-the-wicked:
    label: Do not envy sinners or evildoers, for there is a future (aharit) and your hope will not be cut off
    cluster: wisdom
  glutton-and-drunkard-poverty:
    label: Do not be among wine-bibbers and gluttonous eaters of meat, for drunkard and glutton come to poverty and rags
    cluster: wisdom
  buy-truth-do-not-sell:
    label: Buy truth and do not sell it, wisdom, instruction and understanding
    cluster: wisdom
  give-me-your-heart-my-son:
    label: '''My son, give me your heart and let your eyes keep my ways'''
    cluster: wisdom
  harlot-lurks-like-robber:
    label: The harlot lies in wait like a robber and multiplies the faithless among men
    cluster: wisdom
  drunkard-woes-riddle:
    label: 'Riddle-catalogue: ''Who has woe? who has sorrow? who has strife, wounds without cause, red eyes?'' Those who linger over wine'
    cluster: wisdom
  wine-bites-like-serpent:
    label: Do not look at wine when it is red and sparkles in the cup; at the last it bites like a serpent and stings like a viper
    cluster: wisdom
  drunkard-like-sleeper-on-mast:
    label: The drunkard is like one lying in the heart of the sea or on top of a mast; struck and feeling nothing, he seeks more on waking
    cluster: wisdom
  house-built-by-wisdom:
    label: By wisdom a house is built and by knowledge its rooms are filled with precious riches
    cluster: wisdom
  wisdom-too-high-for-fool:
    label: Wisdom is too high (like corals, ra'mot) for a fool; he does not open his mouth in the gate
    cluster: wisdom
  schemer-called-master-of-plots:
    label: He who plans evil will be called a master of schemes (ba'al mezimmot)
    cluster: wisdom
  rescue-those-led-to-death:
    label: Rescue those being taken to death; do not say 'we did not know', for the weigher of hearts knows
    cluster: wisdom
  wisdom-sweet-as-honey:
    label: Eat honey, my son, for it is good; so is wisdom sweet to your soul
    cluster: wisdom
  righteous-falls-seven-times-rises:
    label: The righteous falls seven times and rises again, but the wicked stumble in calamity
    cluster: wisdom
  do-not-rejoice-at-enemys-fall:
    label: Do not rejoice when your enemy falls, lest YHWH see it, be displeased and turn his anger from him
    cluster: wisdom
  fear-god-and-king:
    label: Fear YHWH and the king, and do not mix with those who seek change
    cluster: kingship
  partiality-in-judgment-condemned:
    label: Showing partiality in judgment is not good; he who tells the wicked 'you are righteous' is cursed by peoples
    cluster: law
  honest-answer-kiss-on-lips:
    label: He who gives an honest answer kisses the lips
    cluster: wisdom
  prepare-field-before-house:
    label: Prepare your work outside and get your field ready; afterwards build your house
    cluster: wisdom
  renounce-retaliation:
    label: Do not say 'I will do to him as he has done to me; I will pay the man back for his deed'
    cluster: wisdom
  sluggards-overgrown-field:
    label: The wise man passes the field of the sluggard, overgrown with thorns and nettles, its stone wall broken down, and draws a lesson
    cluster: wisdom
  little-sleep-little-slumber:
    label: '''A little sleep, a little slumber, a little folding of the hands'', and poverty comes like a robber, want like an armed man'
    cluster: wisdom
  hezekiahs-men-copy-proverbs:
    label: Proverbs of Solomon 'copied out' (he'tiqu) by the men of Hezekiah king of Judah
    cluster: wisdom
  glory-of-god-to-conceal-kings-to-search:
    label: It is the glory of God to conceal a matter and the glory of kings to search it out
    cluster: kingship
  kings-heart-unsearchable:
    label: As heaven for height and earth for depth, so the heart of kings is unsearchable
    cluster: kingship
  dross-removed-from-silver:
    label: Remove the dross from silver and a vessel comes out for the smith; remove the wicked and the throne is established
    cluster: kingship
  take-lowest-seat-before-king:
    label: Do not put yourself forward before the king; better to be told 'Come up here' than to be humbled before a noble
    cluster: wisdom
  apples-of-gold-in-silver:
    label: A word fitly spoken is like apples of gold in settings of silver
    cluster: wisdom
  faithful-messenger-cold-snow-at-harvest:
    label: Like the cold of snow in harvest time is a faithful messenger to those who send him
    cluster: wisdom
  clouds-without-rain-boaster:
    label: Clouds and wind without rain is a man who boasts of a gift he does not give
    cluster: wisdom
  soft-tongue-breaks-bone:
    label: With patience a ruler is persuaded and a soft tongue breaks a bone
    cluster: wisdom
  enough-honey-lest-you-vomit:
    label: If you find honey eat only enough, lest you be sated and vomit it
    cluster: wisdom
  seldom-visit-neighbor:
    label: Let your foot be seldom in your neighbor's house, lest he grow weary of you and hate you
    cluster: wisdom
  treacherous-trust-bad-tooth:
    label: Trust in a faithless man in time of trouble is like a broken tooth or a slipping foot
    cluster: wisdom
  songs-to-heavy-heart-vinegar-on-soda:
    label: Singing songs to a heavy heart is like taking off a garment on a cold day or vinegar on soda (neter)
    cluster: wisdom
  feed-enemy-heap-coals:
    label: If your enemy is hungry give him bread and if thirsty water, for you will heap coals of fire on his head and YHWH will reward you
    cluster: wisdom
  north-wind-brings-rain:
    label: The north wind brings forth rain, and a backbiting tongue angry looks
    cluster: wisdom
  good-news-cold-water:
    label: Like cold water to a weary soul is good news from a far country
    cluster: wisdom
  righteous-yielding-muddied-spring:
    label: A righteous man who gives way before the wicked is like a muddied spring or polluted fountain
    cluster: wisdom
  city-without-wall-no-self-control:
    label: A man without self-restraint is like a city broken into, without walls
    cluster: wisdom
  honor-unfit-for-fool:
    label: Like snow in summer or rain at harvest, honor is not fitting for a fool
    cluster: wisdom
  causeless-curse-does-not-alight:
    label: Like a fluttering sparrow or a flying swallow, a curse without cause does not alight
    cluster: magic
  answer-and-do-not-answer-fool:
    label: 'Contradictory pair: ''Do not answer a fool according to his folly'' / ''Answer a fool according to his folly'''
    cluster: wisdom
  message-by-fool-cuts-off-feet:
    label: He who sends a message by the hand of a fool cuts off his own feet and drinks violence
    cluster: wisdom
  proverb-in-mouth-of-fools:
    label: A proverb (mashal) in the mouth of fools is like lame legs or a thorn in a drunkard's hand
    cluster: wisdom
  stone-bound-in-sling:
    label: Giving honor to a fool is like binding a stone in a sling
    cluster: wisdom
  dog-returns-to-vomit:
    label: As a dog returns to its vomit, so a fool repeats his folly
    cluster: wisdom
  wise-in-own-eyes-worse-than-fool:
    label: There is more hope for a fool than for a man wise in his own eyes
    cluster: wisdom
  sluggard-turns-on-bed-like-door:
    label: As a door turns on its hinge, so does the sluggard on his bed
    cluster: wisdom
  sluggard-wiser-than-seven:
    label: The sluggard is wiser in his own eyes than seven who answer with discretion
    cluster: wisdom
  meddler-seizes-dog-by-ears:
    label: He who meddles in a quarrel not his own is like one who seizes a passing dog by the ears
    cluster: wisdom
  deceiver-says-only-joking:
    label: Like a madman shooting firebrands and deadly arrows is a man who deceives his neighbor and says 'I was only joking'
    cluster: wisdom
  no-wood-fire-goes-out:
    label: Without wood the fire goes out; without a whisperer quarreling ceases
    cluster: wisdom
  glazed-pot-hypocrite:
    label: Burning lips with an evil heart are like silver dross glazed over an earthen pot
    cluster: wisdom
  seven-abominations-in-heart:
    label: When the hater speaks graciously, do not believe him, for seven abominations are in his heart
    cluster: wisdom
  rolled-stone-returns:
    label: He who rolls a stone, it will come back upon him
    cluster: wisdom
  do-not-boast-of-tomorrow:
    label: Do not boast about tomorrow, for you do not know what a day may bring forth
    cluster: wisdom
  let-stranger-praise-you:
    label: Let another praise you and not your own mouth, a stranger and not your own lips
    cluster: wisdom
  fools-vexation-heavier-than-sand:
    label: A stone is heavy and sand weighty, but a fool's provocation is heavier than both
    cluster: wisdom
  wounds-of-friend-faithful:
    label: Open rebuke is better than hidden love; faithful are the wounds of a friend, profuse the kisses of an enemy
    cluster: wisdom
  hungry-finds-bitter-sweet:
    label: The sated soul tramples honey; to the hungry soul every bitter thing is sweet
    cluster: wisdom
  wanderer-like-bird-from-nest:
    label: Like a bird that strays from its nest is a man who strays from his place
    cluster: wisdom
  near-neighbor-better-than-far-brother:
    label: Better a neighbor who is near than a brother far away
    cluster: wisdom
  loud-morning-blessing-a-curse:
    label: He who blesses his neighbor with a loud voice early in the morning, it will be counted to him as a curse
    cluster: wisdom
  iron-sharpens-iron:
    label: Iron sharpens iron, and one man sharpens the face of his friend
    cluster: wisdom
  water-reflects-face-heart-reflects-man:
    label: As in water face answers to face, so the heart of man to man
    cluster: wisdom
  sheol-and-eyes-never-satisfied:
    label: Sheol and Abaddon are never satisfied, and the eyes of man are never satisfied
    cluster: wisdom
  praise-tests-man-like-crucible:
    label: The crucible is for silver and the furnace for gold, and a man is tested by his praise
    cluster: wisdom
  fool-in-mortar-with-pestle:
    label: Though you crush a fool in a mortar with a pestle among the grain, his folly will not leave him
    cluster: wisdom
  know-your-flocks-wealth-not-forever:
    label: Know the condition of your flocks, for riches and the crown do not last forever; lambs and goats provide clothing, field and milk
    cluster: wisdom
  wicked-flee-when-none-pursue:
    label: The wicked flee when no one pursues, but the righteous are bold as a lion
    cluster: wisdom
  many-rulers-for-sinful-land:
    label: When a land transgresses it has many rulers; with a man of understanding it endures
    cluster: kingship
  oppressing-poor-man-like-flooding-rain:
    label: A poor man who oppresses the poor is like a beating rain that leaves no food
    cluster: wisdom
  torah-keepers-fight-wicked:
    label: Those who forsake the torah praise the wicked; those who keep the torah contend with them
    cluster: wisdom
  usurers-wealth-goes-to-generous:
    label: He who increases wealth by interest and usury gathers it for one who is gracious to the poor
    cluster: wisdom
  prayer-of-torah-refuser-abomination:
    label: He who turns his ear from hearing the torah, even his prayer is an abomination
    cluster: cult
  confess-and-forsake-obtain-mercy:
    label: He who conceals his transgressions will not prosper, but he who confesses and forsakes them will obtain mercy
    cluster: theology
  wicked-ruler-roaring-lion-charging-bear:
    label: A wicked ruler over a poor people is a roaring lion and a charging bear
    cluster: kingship
  bloodguilty-flees-to-pit:
    label: A man burdened with the blood of a life will flee to the pit; let no one support him
    cluster: law
  haste-to-be-rich-not-unpunished:
    label: A faithful man has many blessings, but he who hastens to be rich will not go unpunished
    cluster: wisdom
  robbing-parents-no-sin-claim:
    label: He who robs his father or mother and says 'It is no transgression' is companion to a destroyer
    cluster: wisdom
  giver-to-poor-lacks-nothing:
    label: He who gives to the poor will not lack, but he who hides his eyes will get many curses
    cluster: wisdom
  people-hide-when-wicked-rise:
    label: When the wicked rise men hide themselves; when they perish the righteous increase
    cluster: kingship
  stiff-necked-suddenly-broken:
    label: He who is often reproved yet stiffens his neck will suddenly be broken beyond healing
    cluster: wisdom
  people-groan-under-wicked-ruler:
    label: When the righteous increase the people rejoice; when the wicked rule the people groan
    cluster: kingship
  consorting-with-harlots-wastes-wealth:
    label: He who keeps company with harlots squanders wealth
    cluster: wisdom
  flatterer-spreads-net:
    label: A man who flatters his neighbor spreads a net for his feet
    cluster: wisdom
  fool-vents-all-his-spirit:
    label: A fool gives full vent to his spirit, but the wise quietly holds it back
    cluster: wisdom
  ruler-listening-to-lies-corrupt-servants:
    label: If a ruler listens to lies, all his servants become wicked
    cluster: kingship
  yhwh-gives-light-to-eyes-of-both:
    label: The poor and the oppressor meet; YHWH gives light to the eyes of both
    cluster: theology
  without-vision-people-run-wild:
    label: Where there is no vision (hazon) the people cast off restraint, but happy is he who keeps the torah
    cluster: prophecy
  slave-not-corrected-by-words:
    label: A slave is not corrected by words; though he understands he will not respond
    cluster: wisdom
  pampered-slave-becomes-heir:
    label: He who pampers his slave from youth will in the end find him an heir or a grief (manon)
    cluster: wisdom
  accomplice-hears-curse-silent:
    label: The partner of a thief hates his own soul; he hears the adjuration (alah) and does not testify
    cluster: law
  fear-of-man-a-snare:
    label: The fear of man lays a snare, but he who trusts in YHWH is set on high
    cluster: wisdom
  mutual-abomination-righteous-wicked:
    label: The unjust man is an abomination to the righteous, and the upright an abomination to the wicked
    cluster: wisdom
  words-of-agur:
    label: Sayings attributed to Agur son of Yakeh, an oracle (massa) addressed to Ithiel and Ucal
    cluster: wisdom
  sage-confesses-brutish-ignorance:
    label: The sage declares himself more brutish than any man, without human understanding or knowledge of the Holy One
    cluster: wisdom
  who-ascended-to-heaven-and-came-down:
    label: Who has gone up to heaven and come down, gathered the wind in his fists, wrapped the waters in a garment? What is his name and his son's name?
    cluster: cosmology
  name-of-his-son-riddle:
    label: 'Riddle question about God (the creator): ''What is his name, and what is the name of his son?'''
    cluster: theology
  every-word-of-god-refined:
    label: Every word of God is refined (tested); he is a shield to those who take refuge in him
    cluster: theology
  do-not-add-to-gods-words:
    label: Do not add to his words lest he rebuke you and you be found a liar
    cluster: theology
  prayer-neither-poverty-nor-riches:
    label: 'Prayer for two things: keep falsehood far and give neither poverty nor riches, only my allotted bread, lest I deny God or steal'
    cluster: wisdom
  do-not-slander-slave-to-master:
    label: Do not slander a slave to his master lest he curse you
    cluster: wisdom
  generation-catalogue-of-vices:
    label: 'Catalogue of a corrupt ''generation'' (dor): cursing parents, self-righteous yet unwashed, haughty, with sword-teeth devouring the poor'
    cluster: wisdom
  numerical-saying-x-x-plus-one:
    label: 'Graded numerical saying: ''Three things... and four...'' (x / x+1)'
    cluster: wisdom
  leech-with-two-daughters:
    label: 'The leech (''aluqah) has two daughters: ''Give, give!'''
    cluster: wisdom
  four-things-never-satisfied:
    label: 'Four things are never satisfied: Sheol, the barren womb, earth not filled with water, and fire that never says ''Enough'''
    cluster: wisdom
  ravens-peck-eye-mocking-parent:
    label: The eye that mocks a father and scorns a mother will be pecked out by ravens of the valley and eaten by young vultures
    cluster: wisdom
  way-of-eagle-serpent-ship-man-with-maiden:
    label: 'Four wonders: the way of an eagle in the sky, a serpent on a rock, a ship in the sea, and a man with a young woman (''almah)'
    cluster: wisdom
  adulteress-eats-wipes-mouth:
    label: The adulteress eats, wipes her mouth and says 'I have done no wrong'
    cluster: wisdom
  four-things-earth-cannot-bear:
    label: 'Under four the earth trembles: a slave who becomes king, a fool sated with food, an unloved woman who marries, a maid who supplants her mistress'
    cluster: wisdom
  four-small-wise-creatures:
    label: 'Four small but wise creatures: ants storing food in summer, rock-badgers housed in rock, locusts with no king marching in ranks, the lizard in kings'' palaces'
    cluster: wisdom
  ant-stores-food-in-summer:
    label: The ant, a people without strength, prepares its food in summer
    cluster: wisdom
  locusts-without-king-in-ranks:
    label: The locusts have no king yet all go out in ranks
    cluster: wisdom
  four-stately-in-stride:
    label: 'Four stately in stride: the lion mightiest of beasts, the strutting rooster (zarzir), the he-goat, and a king with his army'
    cluster: wisdom
  hand-on-mouth-silence:
    label: If you have been foolish in exalting yourself, put your hand on your mouth
    cluster: wisdom
  churning-milk-butter-nose-blood-wrath-strife:
    label: Pressing milk produces butter, pressing the nose produces blood, pressing anger produces strife (pun on af 'nose/anger')
    cluster: wisdom
  words-of-lemuel:
    label: Sayings of King Lemuel, an oracle (massa) his mother taught him
    cluster: wisdom
  queen-mother-instructs-king:
    label: A king's mother instructs her son in royal conduct
    cluster: kingship
  son-of-my-vows:
    label: The mother addresses the king as 'son of my womb, son of my vows' (bar, Aramaic 'son')
    cluster: wisdom
  king-not-to-give-strength-to-women:
    label: The king is not to give his strength to women nor his ways to those who destroy kings
    cluster: kingship
  kings-must-not-drink-wine:
    label: It is not for kings to drink wine nor for rulers strong drink, lest they forget the law and pervert justice for the afflicted
    cluster: kingship
  strong-drink-for-the-perishing:
    label: Give strong drink to him who is perishing and wine to the bitter of soul, that he may forget his poverty
    cluster: wisdom
  open-mouth-for-the-mute:
    label: Open your mouth for the mute, for the rights of all the destitute; judge righteously for the poor
    cluster: kingship
  woman-of-valor-poem:
    label: 'Poem praising the ''woman of valor'' (eshet hayil): who can find her? Her worth is far beyond pearls'
    cluster: wisdom
  valiant-wife-works-wool-and-flax-spindle:
    label: The ideal wife works wool and flax, holds the distaff and spindle, makes and sells linen garments and belts to the merchant
    cluster: wisdom
  valiant-wife-like-merchant-ships:
    label: She is like merchant ships, bringing her food from afar
    cluster: wisdom
  valiant-wife-rises-at-night-lamp-not-out:
    label: She rises while it is still night to feed her household; her lamp does not go out at night
    cluster: wisdom
  valiant-wife-buys-field-plants-vineyard:
    label: She considers a field and buys it; from her own earnings she plants a vineyard
    cluster: wisdom
  valiant-wife-household-clad-in-scarlet:
    label: She fears no snow, for her household is clothed in scarlet; she wears fine linen and purple
    cluster: wisdom
  husband-known-in-gates-with-elders:
    label: Her husband is known in the gates when he sits among the elders of the land
    cluster: wisdom
  valiant-wife-laughs-at-future:
    label: Strength and dignity are her clothing and she laughs at the time to come
    cluster: wisdom
  torah-of-hesed-on-her-tongue:
    label: She opens her mouth in wisdom and the teaching of kindness (torat hesed) is on her tongue
    cluster: wisdom
  charm-false-beauty-vain-god-fearing-woman:
    label: Charm is deceptive and beauty is vapor (hevel); a woman who fears YHWH is to be praised
    cluster: wisdom
  children-and-husband-praise-wife:
    label: 'Her children rise up and call her blessed; her husband praises her: ''Many women have done valiantly, but you surpass them all'''
    cluster: wisdom
units:
- id: hb-prov-9-wisdom-and-folly-banquets
  tradition: judaism
  title: Lady Wisdom's house and banquet versus Woman Folly
  corpus: hebrew-bible
  original: true
  tagger: Claude (model), reading the Hebrew
  read:
  - Prov 9:1-18
  tags:
  - motif: wisdom-personified-as-woman
    refs:
    - Prov 9:1
    - Prov 9:3
    note: hokhmot, plural of majesty, with feminine verbs
  - motif: wisdom-builds-house-seven-pillars
    refs:
    - Prov 9:1
  - motif: wisdom-banquet-bread-and-mixed-wine
    refs:
    - Prov 9:2
    - Prov 9:5
    note: '''Come, eat of my bread and drink of the wine I have mixed'''
  - motif: wisdom-calls-from-heights-of-city
    refs:
    - Prov 9:3
    - Prov 9:14
    note: she sends out her young women (na'arot)
  - motif: rival-women-identical-invitation
    refs:
    - Prov 9:4
    - Prov 9:16
  - motif: do-not-rebuke-scoffer
    refs:
    - Prov 9:7
    - Prov 9:8
  - motif: fear-of-lord-is-wisdom
    refs:
    - Prov 9:10
    note: '''the beginning (tehillat) of wisdom is the fear of YHWH, knowledge of the Holy One(s) is understanding'''
  - motif: wisdom-prolongs-life
    refs:
    - Prov 9:11
  - motif: folly-personified-as-woman
    refs:
    - Prov 9:13
    - Prov 9:14
    note: eshet kesilut, sits on a seat at the door of her house
  - motif: stolen-waters-sweet
    refs:
    - Prov 9:17
  - motif: guests-of-folly-in-sheol
    refs:
    - Prov 9:18
  - motif: rephaim-shades
    refs:
    - Prov 9:18
  hints:
  - Sirach 24:19-21 and John 6:35 (bread of life) echo Wisdom's banquet; rabbinic exegesis read the seven pillars as seven days of creation or seven books of Torah (Lev. Rab. 11).
  - Compare Wisdom 'building a house' with the Quranic invitation to the 'abode of peace' (Q 10:25).
- id: hb-prov-10-solomon-sayings
  tradition: judaism
  title: First Solomonic collection begins (antithetic sayings on righteous and wicked)
  corpus: hebrew-bible
  original: true
  tagger: Claude (model), reading the Hebrew
  read:
  - Prov 10:1-32
  tags:
  - motif: solomonic-proverb-collection-heading
    refs:
    - Prov 10:1
  - motif: wise-son-gladdens-father
    refs:
    - Prov 10:1
  - motif: righteousness-delivers-from-death
    refs:
    - Prov 10:2
    note: tsedaqah later read as almsgiving (Tob 4:10; b. Shabb. 156b)
  - motif: diligent-hand-enriches-slack-hand-poor
    refs:
    - Prov 10:4
  - motif: gather-in-summer-sleep-in-harvest
    refs:
    - Prov 10:5
  - motif: name-of-wicked-rots
    refs:
    - Prov 10:7
  - motif: winking-eye-malice
    refs:
    - Prov 10:10
  - motif: fountain-of-life
    refs:
    - Prov 10:11
  - motif: love-covers-all-offenses
    refs:
    - Prov 10:12
  - motif: rod-for-back-of-fool
    refs:
    - Prov 10:13
  - motif: wealth-as-fortified-city
    refs:
    - Prov 10:15
  - motif: restraint-of-speech-wise
    refs:
    - Prov 10:19
  - motif: wicked-pass-like-storm
    refs:
    - Prov 10:25
  - motif: sluggard-like-vinegar-and-smoke
    refs:
    - Prov 10:26
  - motif: wisdom-prolongs-life
    refs:
    - Prov 10:27
  - motif: righteous-inherit-land-wicked-uprooted
    refs:
    - Prov 10:30
  hints:
  - 10:12 is quoted in James 5:20 and 1 Peter 4:8 ('love covers a multitude of sins').
  - 10:7 'zekher tsaddiq livrakhah' became the standard Jewish formula for the dead (z"l).
- id: hb-prov-11-sayings
  tradition: judaism
  title: Sayings on honest scales, generosity and the fate of the wicked
  corpus: hebrew-bible
  original: true
  tagger: Claude (model), reading the Hebrew
  read:
  - Prov 11:1-31
  tags:
  - motif: just-weights-and-measures
    refs:
    - Prov 11:1
    note: false balances are an abomination; a full stone (even shelemah) his delight
  - motif: abomination-to-yhwh-saying
    refs:
    - Prov 11:1
    - Prov 11:20
  - motif: pride-before-fall
    refs:
    - Prov 11:2
  - motif: wealth-useless-on-day-of-wrath
    refs:
    - Prov 11:4
  - motif: righteousness-delivers-from-death
    refs:
    - Prov 11:4
  - motif: wicked-ransom-for-righteous
    refs:
    - Prov 11:8
  - motif: city-rejoices-at-fall-of-wicked
    refs:
    - Prov 11:10
    - Prov 11:11
  - motif: talebearer-reveals-secrets
    refs:
    - Prov 11:13
  - motif: safety-in-many-counselors
    refs:
    - Prov 11:14
  - motif: warning-against-surety
    refs:
    - Prov 11:15
    note: he who hates striking hands (toq'im) is secure
  - motif: gold-ring-in-pigs-snout
    refs:
    - Prov 11:22
  - motif: generous-giver-enriched
    refs:
    - Prov 11:24
    - Prov 11:25
  - motif: grain-hoarder-cursed
    refs:
    - Prov 11:26
  - motif: righteous-flourish-like-foliage
    refs:
    - Prov 11:28
  - motif: inherit-the-wind
    refs:
    - Prov 11:29
  - motif: tree-of-life
    refs:
    - Prov 11:30
    note: 'metaphorical: ''the fruit of the righteous is a tree of life'''
  - motif: wise-takes-souls
    refs:
    - Prov 11:30
  - motif: righteous-repaid-on-earth
    refs:
    - Prov 11:31
  hints:
  - 11:31 is quoted from the LXX in 1 Peter 4:18; 11:24 parallels the Quranic theme that spending in charity multiplies (Q 2:261).
  - Egyptian Amenemope ch. 16 and the Babylonian Shamash hymn condemn the false balance.
