# Motif tags, flood cluster. Units with `original: true` cite verses whose
# original text is in the repo (Quran, Hebrew Bible); the tags are a reader's
# interpretation of that text. Units with `original: false` are tagged from
# secondary knowledge until their original texts are added.
units:
  - id: quran-noah
    tradition: islam
    title: Noah in the Quran
    corpus: quran
    original: true
    tagger: Claude (model), reading the Arabic
    read: ["11:25-49", "54:9-17", "23:23-30", "26:116-121", "71:25-28", "29:14-15", "71:5", "71:8", "37:81"]   # verses read in full from the original
    tags:
      - {motif: reason-rejected-messenger, refs: ["11:27", "54:9", "26:117"]}
      - {motif: hero-preaches-to-people, refs: ["11:25", "11:26", "71:5", "71:8"]}
      - {motif: hero-prays-for-judgment, refs: ["23:26", "26:118", "54:10", "71:26"]}
      - {motif: hero-warned-by-deity, refs: ["11:36", "23:27"]}
      - {motif: divine-decision-to-destroy, refs: ["11:37", "23:27"]}
      - {motif: build-vessel-on-instruction, refs: ["11:37", "23:27"]}
      - {motif: people-mock-builder, refs: ["11:38"]}
      - {motif: vessel-planks-and-nails, refs: ["54:13"]}
      - {motif: sign-to-board, refs: ["11:40", "23:27"], note: "fāra al-tannūr: the oven boiled over"}
      - {motif: boiling-waters, refs: ["11:40"], note: "Reading fāra (boiled) as describing the waters is interpretive; check it."}
      - {motif: animals-in-pairs, refs: ["11:40", "23:27"]}
      - {motif: family-saved, refs: ["11:40", "23:27"]}
      - {motif: family-member-lost, refs: ["11:42", "11:43", "11:46"]}
      - {motif: mountain-refuge-fails, refs: ["11:43"]}
      - {motif: waters-from-above-and-below, refs: ["54:11", "54:12"]}
      - {motif: universal-destruction, refs: ["26:120", "71:25"]}
      - {motif: vessel-rests-on-mountain, refs: ["11:44"], note: al-Jūdī}
      - {motif: blessing-on-descent, refs: ["11:48"]}
      - {motif: hero-age-950, refs: ["29:14"], note: "a thousand years less fifty, among his people"}
      - {motif: hero-righteous, refs: ["37:81"]}

