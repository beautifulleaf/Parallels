    tags:
      - {motif: divine-decision-to-destroy, refs: ["Gen 6:7", "Gen 6:13"]}
      - {motif: reason-human-wickedness, refs: ["Gen 6:5", "Gen 6:11"]}
      - {motif: hero-righteous, refs: ["Gen 6:9", "Gen 7:1"]}
      - {motif: hero-warned-by-deity, refs: ["Gen 6:13"]}
      - {motif: build-vessel-on-instruction, refs: ["Gen 6:14"]}
      - {motif: vessel-dimensions-given, refs: ["Gen 6:15"]}
      - {motif: vessel-sealed-with-pitch, refs: ["Gen 6:14"]}
      - {motif: animals-in-pairs, refs: ["Gen 6:19", "Gen 7:9"]}
      - {motif: family-saved, refs: ["Gen 6:18", "Gen 7:7"]}
      - {motif: waters-from-above-and-below, refs: ["Gen 7:11", "Gen 8:2"]}
      - {motif: universal-destruction, refs: ["Gen 7:21", "Gen 7:23"]}
      - {motif: vessel-rests-on-mountain, refs: ["Gen 8:4"], note: mountains of Ararat}
      - {motif: bird-release, refs: ["Gen 8:7", "Gen 8:8", "Gen 8:11"]}
      - {motif: sacrifice-after-flood, refs: ["Gen 8:20"]}
      - {motif: deity-smells-offering, refs: ["Gen 8:21"]}
      - {motif: promise-never-again, refs: ["Gen 8:21", "Gen 9:11"]}
