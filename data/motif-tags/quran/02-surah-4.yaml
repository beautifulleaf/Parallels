new_motifs:
  fear-god-and-the-wombs: {label: "Fear God, by whom you ask of one another, and the wombs (kinship ties, al-arḥām)", cluster: ethics}
  orphan-property-guardianship: {label: "Guardians must keep orphans' property intact and hand it over when they come of age", cluster: law}
  devouring-orphans-property-eats-fire: {label: "Those who devour orphans' property devour fire into their bellies", cluster: eschatology}
  polygyny-up-to-four: {label: "A man may marry two, three or four wives, or only one if he fears injustice", cluster: law}
  bride-gift-to-the-woman: {label: "The husband gives the bride her marriage gift (ṣaduqa, ajr) as her own; she may freely remit part", cluster: law}
  property-withheld-from-incompetent: {label: "Property is not handed to the feeble-minded (sufahāʾ); they are fed and clothed from it", cluster: law}
  women-share-in-inheritance: {label: "Women as well as men receive a fixed share of what parents and kin leave", cluster: law}
  poor-relatives-given-from-estate: {label: "Kin, orphans and the poor present at the division of an estate are given something from it", cluster: law}
  male-double-share-of-female: {label: "A son (or brother) inherits the share of two daughters (or sisters)", cluster: law}
  fixed-fractional-shares: {label: "Inheritance fixed in fractions (one half, a third, a quarter, a sixth, an eighth, two-thirds)", cluster: law}
  spouses-inherit-from-each-other: {label: "Husband and wife inherit fixed shares from each other", cluster: law}
  kalala-inheritance: {label: "One who dies without parent or child (kalāla): brothers and sisters inherit fixed shares", cluster: law}
  bequest-and-debt-before-shares: {label: "Shares are distributed only after a bequest (waṣiyya) and debts are paid", cluster: law}
  bounds-of-god-hudud: {label: "'These are the bounds (hudud) of God; do not approach (or transgress) them'", cluster: law}
  four-witnesses-for-indecency: {label: "Four witnesses are required to establish sexual indecency (fāḥisha)", cluster: law}
  adulteress-confined-to-house: {label: "Women guilty of indecency are confined to houses until death or until God makes a way", cluster: law}
  offenders-released-on-repentance: {label: "Offenders who repent and reform are to be left alone", cluster: law}
  deathbed-repentance-rejected: {label: "Repentance is not accepted from one who repents only when death comes", cluster: theology}
  repentance-for-sin-in-ignorance: {label: "God accepts repentance from those who do evil in ignorance and soon repent", cluster: theology}
  inheriting-women-forbidden: {label: "It is forbidden to inherit women against their will or to hold them back to recover gifts", cluster: law}
  dowry-not-taken-back: {label: "A husband exchanging one wife for another may not take back anything he gave, even a qinṭār", cluster: law}
  milk-kinship-bars-marriage: {label: "Foster mothers and foster sisters by nursing are forbidden in marriage", cluster: law}
  married-women-forbidden-except-captives: {label: "Married women are forbidden except those one's right hand possesses (captives)", cluster: law}
  marriage-to-believing-slave-women: {label: "One who cannot afford a free wife may marry a believing slave woman with her people's leave", cluster: law}
  slave-woman-half-penalty: {label: "A married slave woman who commits indecency receives half the punishment of a free woman", cluster: law}
  human-created-weak: {label: "God wishes to lighten your burden, for the human was created weak", cluster: theology}
  consuming-wealth-falsely-forbidden: {label: "Do not consume one another's wealth wrongfully (bil-bāṭil), only by trade with mutual consent", cluster: ethics}
  do-not-kill-yourselves: {label: "Command: do not kill yourselves (or one another)", cluster: law}
  major-sins-avoided-minor-expiated: {label: "If the major sins (kabāʾir) are avoided, God expiates lesser misdeeds", cluster: theology}
  sworn-allies-inherit: {label: "Those bound to you by oath-alliance receive their share", cluster: law}
  men-maintainers-of-women: {label: "Men are maintainers (qawwāmūn) of women by God's preference and their spending", cluster: law}
  rebellious-wife-admonished-separated-struck: {label: "A wife whose rebellion (nushūz) is feared is admonished, left alone in bed, then struck", cluster: law}
  family-arbiters-in-marital-discord: {label: "In marital discord an arbiter is sent from his family and one from hers", cluster: law}
  neighbor-near-and-far: {label: "Kindness to the near neighbor, the distant neighbor, the companion at one's side and the wayfarer", cluster: ethics}
  misers-conceal-gods-bounty: {label: "Misers who urge stinginess and hide what God gave them of his bounty", cluster: ethics}
  deeds-done-for-show: {label: "Good works (spending, prayer) done to be seen by people (riyāʾ)", cluster: ethics}
  satan-as-companion: {label: "Satan becomes a person's intimate companion (qarīn)", cluster: theology}
  atoms-weight-of-justice: {label: "God does not wrong anyone by an atom's weight (mithqāl dharra)", cluster: theology}
  good-deeds-multiplied: {label: "God multiplies a good deed (tenfold) while an evil deed is requited only by its like", cluster: theology}
  witness-from-every-nation: {label: "On judgment day a witness is brought from every nation, and the Prophet as witness over them", cluster: eschatology}
  wish-earth-leveled-over-them: {label: "On that day the disbelievers wish the earth were leveled over them", cluster: eschatology}
  no-prayer-while-drunk: {label: "Do not approach prayer while intoxicated, until you know what you say", cluster: purity}
  major-impurity-bath-before-prayer: {label: "One in major impurity (junub) must bathe before prayer, except a traveller passing through", cluster: purity}
  dry-ablution-with-earth: {label: "Without water, purify with clean earth (tayammum), wiping face and hands", cluster: purity}
  we-hear-and-disobey: {label: "Israel at the mountain says 'we hear and we disobey' (sami'na wa-'asayna)", cluster: polemic}
  ambiguous-address-raina: {label: "Opponents twist an ambiguous address ('rāʿinā') with their tongues to mock", cluster: polemic}
  faces-obliterated-turned-backward: {label: "Threat to obliterate faces and turn them backward", cluster: eschatology}
  sabbath-breakers-cursed-transformed: {label: "The people of the Sabbath were cursed and (some) made apes and swine", cluster: polemic}
  idolatry-unforgivable: {label: "God does not forgive associating partners with him (shirk) but forgives anything less", cluster: theology}
  self-praise-of-purity-rebuked: {label: "Those who claim to be pure are rebuked: God purifies whom he will", cluster: ethics}
  jibt-and-taghut: {label: "Some of the People of the Book believe in al-jibt and al-ṭāghūt (idols, false powers)", cluster: idolatry}
  tiny-measures-fatil-naqir: {label: "Not wronged by a date-stone's thread (fatīl) or groove (naqīr): proverbial minimal measures", cluster: theology}
  abraham-family-given-book-and-kingdom: {label: "God gave the family of Abraham the book, wisdom and a great kingdom", cluster: patriarchs}
  skins-renewed-in-fire: {label: "In hellfire, whenever the skins are burnt through, they are replaced with new skins", cluster: eschatology}
  purified-spouses-in-paradise: {label: "The blessed have purified spouses (azwaj mutahhara) in paradise", cluster: eschatology}
  deep-shade-of-paradise: {label: "The blessed enter a deep, lasting shade (ẓill ẓalīl)", cluster: eschatology}
  return-trusts-to-owners: {label: "Return trusts (amānāt) to their owners and judge between people with justice", cluster: ethics}
  obey-god-messenger-and-authority: {label: "Obey God, obey the Messenger and those in authority; refer disputes to God and the Messenger", cluster: law}
  kill-yourselves-test-command: {label: "Had they been commanded 'kill yourselves or leave your homes', few would have done it", cluster: polemic}
  four-ranks-of-the-blessed: {label: "Companions of the obedient: prophets, the truthful (ṣiddīqūn), martyrs and the righteous", cluster: eschatology}
  laggard-rejoices-at-missing-battle: {label: "The laggard thanks God he was absent when disaster struck, and wishes he had shared the spoil", cluster: warfare}
  fight-for-the-oppressed: {label: "Fight for the oppressed men, women and children who cry 'take us out of this town of wrongdoers'", cluster: warfare}
  satans-plot-is-weak: {label: "The plot of Satan is weak", cluster: theology}
  death-reaches-even-lofty-towers: {label: "Death will reach you wherever you are, even in lofty towers", cluster: wisdom}
  good-from-god-evil-from-self: {label: "All comes from God; yet good befalling you is from God and evil from yourself", cluster: theology}
  quran-without-contradiction: {label: "Were the Quran from other than God they would find much contradiction in it", cluster: prophecy}
  good-and-bad-intercession: {label: "Whoever intercedes for good shares in it; whoever intercedes for evil bears a part of it", cluster: ethics}
  return-greeting-with-better: {label: "When greeted, return a better greeting or the same", cluster: ethics}
  hypocrites-split-the-believers: {label: "Believers are split into two factions over the hypocrites, whom God has overturned", cluster: polemic}
  neutral-and-treaty-folk-not-fought: {label: "Those allied by treaty or who withdraw and offer peace may not be attacked", cluster: warfare}
  manslaughter-blood-money-and-freed-slave: {label: "Accidental killing of a believer: free a believing slave and pay blood money (diya) to the family unless they remit it", cluster: law}
  expiation-by-two-months-fast: {label: "Whoever cannot pay the expiation fasts two consecutive months", cluster: law}
  deliberate-murderer-in-hell-forever: {label: "Deliberate killing of a believer is punished by hell forever, God's wrath and curse", cluster: eschatology}
  do-not-deny-faith-of-one-who-greets: {label: "Do not tell one who greets you with peace 'you are not a believer' to seize booty", cluster: warfare}
  strivers-above-those-who-sit: {label: "Those who strive with wealth and life are ranked above those who sit at home", cluster: warfare}
  disabled-exempt-from-fighting: {label: "Those with disabilities (ulū l-ḍarar) are excepted from the duty to fight", cluster: warfare}
  angels-take-souls-at-death: {label: "Angels (God's messengers) take the souls of the dying", cluster: afterlife}
  angels-question-souls-at-death: {label: "Angels taking a soul ask 'what state were you in?'; excuses of weakness are tested", cluster: afterlife}
  gods-earth-is-wide-emigrate: {label: "Was not God's earth wide enough for you to emigrate (hijra) in it?", cluster: ethics}
  emigrant-dying-on-way-rewarded: {label: "Whoever leaves home as an emigrant to God and dies on the way has his reward with God", cluster: eschatology}
  prayer-shortened-on-journey: {label: "Prayer may be shortened when travelling in danger", cluster: liturgy}
  prayer-in-shifts-under-arms: {label: "In war the congregation prays in shifts, one group standing guard with weapons", cluster: liturgy}
  remember-god-standing-sitting-lying: {label: "Those who remember God standing, sitting and on their sides and reflect on creation", cluster: liturgy}
  prayer-at-fixed-times: {label: "Prayer is prescribed for believers at fixed times (kitāban mawqūtan)", cluster: liturgy}
  enemy-suffers-as-you-suffer: {label: "If you suffer, they suffer as you do, but you hope from God what they do not", cluster: warfare}
  guilt-cast-on-innocent: {label: "Whoever commits a sin and casts it on an innocent bears slander and manifest sin", cluster: ethics}
  prophet-must-not-plead-for-traitors: {label: "The Prophet is told not to argue on behalf of those who betray themselves", cluster: law}
  god-present-at-night-plotting: {label: "They hide from people but not from God, who is with them when they plot by night", cluster: theology}
  secret-counsel-najwa: {label: "No good in most secret counsels except enjoining charity, kindness or reconciliation", cluster: ethics}
  idolaters-invoke-females: {label: "Idolaters invoke only female beings besides God, and only a rebellious Satan", cluster: idolatry}
  satan-vows-appointed-share: {label: "Cursed Satan vows to take an appointed share (naṣīb mafrūḍ) of God's servants", cluster: theology}
  slitting-cattle-ears: {label: "Satan commands people to slit the ears of cattle (a pagan dedication rite)", cluster: idolatry}
  altering-gods-creation: {label: "Satan commands people to alter God's creation", cluster: theology}
  not-by-wishful-thinking: {label: "Salvation is not by your wishes nor those of the People of the Book: whoever does evil is requited", cluster: polemic}
  reward-for-male-or-female: {label: "Whoever does good, male or female, and believes, enters paradise", cluster: eschatology}
  religion-of-abraham-hanif: {label: "Follow the religion (milla) of Abraham the ḥanīf, who was no idolater", cluster: patriarchs}
  they-ask-you-for-a-ruling: {label: "Form: 'They ask you for a ruling (yastaftūnaka); say: God gives you a ruling'", cluster: law}
  wife-fears-husbands-aversion: {label: "A wife who fears her husband's aversion may make a settlement with him; settlement is best", cluster: law}
  impossible-justice-among-wives: {label: "You will never be able to be equally just among wives, however eager", cluster: law}
  wife-left-suspended: {label: "Do not leave a wife 'suspended' (kal-muʿallaqa), neither married nor free", cluster: law}
  god-replaces-people: {label: "If God wills he takes you away and brings another people in your place", cluster: theology}
  witness-even-against-self-and-kin: {label: "Stand firm for justice as witnesses for God even against yourselves, parents and kin, rich or poor", cluster: ethics}
  articles-of-faith: {label: "Belief in God, his angels, his books, his messengers and the last day", cluster: theology}
  repeated-apostasy: {label: "Those who believe, then disbelieve, then believe, then disbelieve and increase in disbelief", cluster: theology}
  deceivers-deceived-by-god: {label: "The hypocrites try to deceive God, but it is he who deceives them", cluster: theology}
  hypocrites-in-lowest-depth: {label: "The hypocrites are in the lowest depth (al-dark al-asfal) of the fire", cluster: eschatology}
  evil-speech-only-by-wronged: {label: "God does not love public evil speech except by one who has been wronged", cluster: ethics}
  believing-some-messengers-not-others: {label: "Those who believe in some messengers and reject others, making distinctions among them", cluster: polemic}
  book-from-heaven-demanded: {label: "Opponents demand a written book brought down from heaven", cluster: polemic}
  israel-demands-to-see-god-openly: {label: "Israel demands 'show us God openly' and is seized by the thunderbolt", cluster: exodus}
  mountain-raised-over-israel: {label: "God raises the mountain (al-Tur) over Israel while taking their covenant", cluster: covenant}
  god-seals-hearts: {label: "God has set a seal on their hearts for their disbelief", cluster: theology}
  slander-against-mary: {label: "The Jews' grave slander (buhtān) against Mary", cluster: christology}
  crucifixion-denied: {label: "They did not kill the Messiah Jesus nor crucify him", cluster: christology}
  only-a-likeness-crucified: {label: "It was only made to appear so to them (shubbiha lahum)", cluster: christology}
  jesus-raised-to-god: {label: "God raised Jesus up to himself", cluster: christology}
  all-people-of-book-believe-before-his-death: {label: "Every one of the People of the Book will believe in him before his (or their) death", cluster: christology}
  jesus-witness-on-judgment-day: {label: "Jesus will be a witness against the People of the Book on resurrection day", cluster: christology}
  good-things-forbidden-to-jews-as-punishment: {label: "Good foods once lawful were forbidden to the Jews as punishment for their wrongdoing", cluster: polemic}
  catalogue-of-prophets: {label: "Catalogue of prophets who received revelation, from Noah to Jesus", cluster: prophecy}
  psalms-given-to-david: {label: "God gave David the Psalms (zabūr)", cluster: prophecy}
  god-spoke-directly-to-moses: {label: "God spoke to Moses directly (kallama taklīman)", cluster: prophecy}
  jesus-word-and-spirit-from-god: {label: "Jesus is God's word cast to Mary and a spirit from him", cluster: christology}
  say-not-three: {label: "Do not say 'three'; God is only one god (rejection of a triad)", cluster: christology}
  god-has-no-son: {label: "Denial that God has taken a son (walad)", cluster: christology}
  messiah-not-too-proud-to-be-servant: {label: "The Messiah does not disdain to be a servant of God, nor do the angels brought near", cluster: christology}
  angels-brought-near: {label: "The angels brought near (al-muqarrabūn) to God", cluster: theology}
  do-not-exceed-bounds-in-religion: {label: "People of the Book, do not go to excess (lā taghlū) in your religion", cluster: polemic}
  fulfil-contracts: {label: "Fulfil your contracts and covenants (ʿuqūd)", cluster: law}
  hunting-forbidden-in-pilgrim-sanctity: {label: "Hunting land game is forbidden while in pilgrim sanctity (iḥrām)", cluster: cult}
  sacred-month-inviolable: {label: "The sacred month and God's rites must not be profaned", cluster: cult}
  garlanded-sacrificial-animals: {label: "Sacrificial animals (hady) marked with garlands (qalāʾid) are inviolable", cluster: cult}
  strangled-beaten-fallen-gored-forbidden: {label: "Forbidden: the strangled, the beaten to death, the fallen and the gored animal", cluster: law}
  sacrifice-on-stone-altars-forbidden: {label: "What is slaughtered on stone altars (nuṣub/anṣāb) is forbidden; the stones are abomination", cluster: idolatry}
  divining-arrows-forbidden: {label: "Seeking decisions by divining arrows (azlām) is forbidden", cluster: idolatry}
  religion-perfected-today: {label: "'Today I have perfected your religion and completed my favor'", cluster: theology}
  necessity-permits-forbidden-food: {label: "Forbidden food is permitted to one compelled by necessity, without desire or transgression", cluster: law}
  trained-hunting-animals-catch-lawful: {label: "What trained hunting animals (dogs, birds of prey) catch is lawful, with God's name pronounced", cluster: law}
  gods-name-over-slaughter: {label: "Eat only what God's name was pronounced over; what was slaughtered without it is forbidden", cluster: law}
  food-of-people-of-book-lawful: {label: "The food of the People of the Book is lawful to believers and theirs to them", cluster: law}
  marry-chaste-women-of-book: {label: "Believers may marry chaste women of the People of the Book", cluster: law}
  ablution-before-prayer: {label: "Before prayer wash the face, hands to the elbows, wipe the head and wash feet to the ankles", cluster: purity}
  hatred-must-not-pervert-justice: {label: "Let not hatred of a people move you to injustice; be just", cluster: ethics}
  god-restrains-enemies-hands: {label: "God restrained a people who meant to stretch out their hands against the believers", cluster: theology}
  twelve-chieftains-of-israel: {label: "God raised twelve chieftains (nuqabāʾ) from Israel when taking their covenant", cluster: covenant}
  forgot-part-of-reminder: {label: "They forgot a portion of what they were reminded of", cluster: polemic}
  enmity-cast-among-them-till-resurrection: {label: "God cast enmity and hatred among them until the day of resurrection", cluster: polemic}
  prophet-reveals-hidden-scripture: {label: "The Messenger makes clear much of the scripture they used to hide", cluster: polemic}
  god-is-the-messiah-rejected: {label: "Those who say 'God is the Messiah son of Mary' have disbelieved", cluster: christology}
  interval-between-messengers: {label: "A messenger comes after an interval (fatra) without messengers", cluster: prophecy}
  prophets-and-kings-among-israel: {label: "God set prophets among Israel and made them kings, giving them what he gave no other", cluster: covenant}
  holy-land-ordained: {label: "Enter the holy land (al-arḍ al-muqaddasa) which God has ordained for you", cluster: conquest}
  go-you-and-your-lord-and-fight: {label: "The people tell the leader 'go, you and your Lord, and fight; we will sit here'", cluster: wilderness}
  leader-has-only-himself-and-brother: {label: "Moses: 'I control only myself and my brother; separate us from the rebellious people'", cluster: wilderness}
  victim-refuses-to-raise-hand: {label: "The threatened brother refuses to raise his hand to kill in return, out of fear of God", cluster: primeval}
  murderer-bears-victims-sin: {label: "The victim wishes the murderer to bear both the victim's sin and his own", cluster: primeval}
  raven-teaches-burial: {label: "God sends a raven scratching the earth to show how to hide a brother's corpse", cluster: primeval}
  killing-one-as-killing-all: {label: "Whoever kills one soul is as if he killed all humanity; whoever saves one, as if he saved all", cluster: law}
  waging-war-on-god-penalty: {label: "Those who wage war on God and spread corruption: killed, crucified, hands and feet cut off on opposite sides, or exiled", cluster: law}
  repentance-before-capture-pardons: {label: "Those who repent before they are overpowered are pardoned", cluster: law}
  seek-means-of-approach: {label: "Seek a means of approach (al-wasīla) to God", cluster: theology}
  amputation-for-theft: {label: "Cut off the hands of the male and female thief as recompense", cluster: law}
  judgment-sought-despite-torah: {label: "Why do they seek the Prophet's judgment when they have the Torah with God's judgment?", cluster: polemic}
  devourers-of-illicit-gain: {label: "Eaters of illicit gain (suḥt), listeners to lies", cluster: ethics}
  torah-guidance-and-light: {label: "The Torah contains guidance and light", cluster: prophecy}
  rabbis-and-scholars-guard-the-book: {label: "The prophets, rabbis (rabbāniyyūn) and scholars (aḥbār) judged by the Torah they were entrusted to guard", cluster: polemic}
  remitting-retaliation-is-expiation: {label: "Whoever remits retaliation as charity, it is expiation for him", cluster: law}
  gospel-confirms-torah: {label: "Jesus was given the Gospel (Injīl), confirming the Torah before it", cluster: christology}
  quran-guardian-over-scriptures: {label: "The book confirms the scripture before it and is a guardian (muhaymin) over it", cluster: prophecy}
  each-community-its-own-law: {label: "For each community God made a law (shirʿa) and a way; had he willed he would have made one nation", cluster: theology}
  judgment-of-ignorance: {label: "Do they seek the judgment of the Age of Ignorance (jāhiliyya)?", cluster: polemic}
  no-alliance-with-jews-and-christians: {label: "Do not take Jews and Christians (or mockers of your religion) as allies", cluster: polemic}
  mutual-love-god-and-people: {label: "A people whom God loves and who love him", cluster: theology}
  call-to-prayer-mocked: {label: "When you call to prayer they take it as mockery and play", cluster: polemic}
  leaders-fail-to-forbid-sin: {label: "Rabbis and scholars (or the community) do not forbid one another the wrong they do", cluster: polemic}
  gods-hand-fettered-claim: {label: "Jews quoted as saying 'God's hand is fettered'; rather both his hands are outspread", cluster: polemic}
  god-extinguishes-fires-of-war: {label: "Whenever they kindle the fire of war, God extinguishes it", cluster: warfare}
  eat-from-above-and-below: {label: "Had they observed the Torah and Gospel they would have eaten from above them and beneath their feet", cluster: covenant}
  believers-jews-sabians-christians-saved: {label: "Believers, Jews, Sabians and Christians who believe in God and the last day and do good need not fear", cluster: theology}
  jesus-says-my-lord-and-your-lord: {label: "Jesus says 'worship God, my Lord and your Lord'", cluster: christology}
  jesus-and-mother-ate-food: {label: "The Messiah and his mother both ate food (proof of their humanity)", cluster: christology}
  mary-the-truthful: {label: "Mary called truthful (ṣiddīqa)", cluster: christology}
  idols-neither-harm-nor-benefit: {label: "Worshipping what can neither harm nor benefit you", cluster: idolatry}
  cursed-by-tongue-of-david-and-jesus: {label: "The unbelievers of Israel were cursed by the tongue of David and of Jesus son of Mary", cluster: polemic}
  christians-nearest-in-affection: {label: "Christians are nearest in affection to the believers because they have priests and monks and are not proud", cluster: polemic}
  converts-weep-at-revelation: {label: "Hearing the revelation, their eyes overflow with tears at the truth they recognize", cluster: prophecy}
  do-not-forbid-good-things: {label: "Do not forbid the good things God has made lawful (against self-imposed abstinence)", cluster: law}
  oath-expiation-feed-ten: {label: "Expiation for a broken oath: feed or clothe ten poor, free a slave, or fast three days", cluster: law}
  wine-and-gambling-satans-work: {label: "Wine, gambling, stone altars and divining arrows are abomination of Satan's work", cluster: law}
  game-penalty-equivalent-livestock: {label: "Killing game in iḥrām is compensated by an equivalent domestic animal judged by two just men and brought to the Kaʿba", cluster: cult}
  sea-game-lawful: {label: "Game of the sea and its food are lawful, also for travellers", cluster: law}
  kaaba-sustains-people: {label: "God made the Kaʿba, the sacred house, a support (qiyām) for people", cluster: cult}
  do-not-ask-about-things: {label: "Do not ask about things which, if made plain, would trouble you; a people before you asked and disbelieved", cluster: wisdom}
  pagan-dedicated-camels: {label: "God did not institute the baḥīra, sāʾiba, waṣīla or ḥām (camels set free by pagan dedication)", cluster: idolatry}
  deathbed-bequest-witnesses: {label: "Two just witnesses attend a bequest at death; on a journey two outsiders may serve", cluster: law}
  witnesses-detained-after-prayer-swear: {label: "Doubted witnesses are detained after prayer and swear by God they will not sell their testimony", cluster: law}
  false-witnesses-replaced-by-heirs: {label: "If the witnesses are found guilty, two of the wronged heirs swear in their place", cluster: law}
  messengers-asked-what-response: {label: "God gathers the messengers and asks what response they received; they say 'we have no knowledge'", cluster: eschatology}
  disciples-declare-submission: {label: "The disciples (ḥawāriyyūn) declare 'we believe; bear witness that we submit (muslimūn)'", cluster: christology}
  table-sent-down-from-heaven: {label: "At the disciples' request Jesus prays and God sends down a table (māʾida) from heaven", cluster: christology}
  table-as-festival: {label: "The heavenly table is to be a festival (ʿīd) for the first and last of them and a sign", cluster: christology}
  disbelief-after-sign-punished-uniquely: {label: "Whoever disbelieves after the sign will be punished as no one else in the worlds", cluster: eschatology}
  jesus-denies-claiming-divinity: {label: "At judgment Jesus denies telling people to take him and his mother as gods", cluster: christology}
  mary-taken-as-god: {label: "Polemic against taking Mary, with Jesus, as gods besides God", cluster: christology}
  jesus-commits-followers-to-god: {label: "Jesus: 'If you punish them they are your servants; if you forgive them, you are the Mighty, the Wise'", cluster: christology}
  god-made-darkness-and-light: {label: "Praise God who created heaven and earth and made the darknesses and the light", cluster: creation}
  two-appointed-terms: {label: "God decreed a term (ajal) for each person, and another term named with him", cluster: theology}
  generations-destroyed-despite-prosperity: {label: "God destroyed earlier generations though he had established them more firmly and given them rain and rivers", cluster: judgment}
  book-on-parchment-would-be-called-magic: {label: "Even a book on parchment they could touch would be called magic", cluster: polemic}
  angel-sent-would-appear-as-man: {label: "Had God sent an angel he would have made him a man", cluster: theology}
  mockers-overtaken-by-their-mockery: {label: "Earlier messengers were mocked, and what the mockers mocked surrounded them", cluster: judgment}
  god-wrote-mercy-on-himself: {label: "God has prescribed mercy for himself (kataba ʿalā nafsihi l-raḥma)", cluster: theology}
  god-feeds-and-is-not-fed: {label: "God feeds and is not fed", cluster: theology}
  first-to-submit: {label: "The Prophet is commanded to be the first of those who submit (awwal al-muslimīn)", cluster: prophecy}
  idolaters-deny-idolatry-at-judgment: {label: "The idolaters swear 'by God our Lord, we were not idolaters'", cluster: eschatology}
  damned-wish-to-return: {label: "Standing before the fire the damned wish to be sent back; were they sent back they would return to sin", cluster: eschatology}
  burdens-borne-on-backs: {label: "On the day of the Hour they carry their burdens (awzār) on their backs", cluster: eschatology}
  worldly-life-play-and-diversion: {label: "The life of this world is only play and diversion; the last abode is better", cluster: wisdom}
  denial-of-resurrection: {label: "Unbelievers say there is only this worldly life and no raising", cluster: polemic}
  earlier-messengers-denied-and-patient: {label: "The Prophet is consoled: messengers before him were denied and patient until help came", cluster: prophecy}
  no-changer-of-gods-words: {label: "None can change the words of God", cluster: theology}
  tunnel-in-earth-or-ladder-to-sky: {label: "If you could seek a tunnel into the earth or a ladder into the sky to bring them a sign...", cluster: prophecy}
  animals-are-communities-like-you: {label: "Every beast on earth and bird flying with its wings are communities (umam) like you, gathered to their Lord", cluster: creation}
  nothing-omitted-from-the-book: {label: "We have neglected nothing in the Book", cluster: theology}
  distress-prayer-then-forget: {label: "In distress they call on God alone, then forget and return to associating partners", cluster: theology}
  prosperity-before-sudden-seizure: {label: "God opened the gates of everything to them, and when they rejoiced he seized them suddenly", cluster: judgment}
  do-not-drive-away-poor-believers: {label: "Do not drive away those who call on their Lord morning and evening seeking his face", cluster: ethics}
  keys-of-the-unseen: {label: "With God are the keys of the unseen (mafātiḥ al-ghayb); none knows them but he", cluster: theology}
  no-leaf-falls-unknown: {label: "Not a leaf falls but he knows it, nor a grain in the darkness of the earth", cluster: theology}
  everything-in-a-clear-book: {label: "Nothing wet or dry but is in a clear book", cluster: theology}
  sleep-as-nightly-death: {label: "God takes your souls by night (sleep) and raises you by day until the appointed term", cluster: afterlife}
  guardian-angels-sent: {label: "God sends guardians (ḥafaẓa) over people", cluster: theology}
  punishment-from-above-or-below: {label: "God can send punishment from above you or from beneath your feet, or split you into factions", cluster: judgment}
  avoid-those-who-mock-revelation: {label: "Do not sit with those who plunge into mockery of God's signs until they change the subject", cluster: ethics}
  bewildered-man-lured-by-devils: {label: "Parable: one lured by devils, bewildered in the land, while companions call him to guidance", cluster: wisdom}
  father-named-azar: {label: "Abraham's father is named Āzar", cluster: patriarchs}
  abraham-shown-kingdom-of-heavens: {label: "God showed Abraham the kingdom (malakūt) of the heavens and the earth", cluster: patriarchs}
  setting-bodies-not-gods: {label: "Abraham: 'I do not love things that set' (lā uḥibbu l-āfilīn)", cluster: patriarchs}
  abraham-disputes-with-his-people: {label: "Abraham's people dispute with him; he fears none of their gods", cluster: patriarchs}
  which-party-deserves-security: {label: "Which of the two parties has more right to security? Those who believe without mixing in wrong", cluster: theology}
  prophet-asks-no-wage: {label: "The Prophet asks no wage for the message", cluster: prophecy}
  god-sent-nothing-to-humans-claim: {label: "Opponents say 'God has sent down nothing to any human'", cluster: polemic}
  torah-written-on-sheets-partly-hidden: {label: "They make Moses' book into sheets (qarāṭīs), showing some and hiding much", cluster: polemic}
  false-claim-of-revelation: {label: "None more wrong than one who falsely claims revelation or says he can send down the like of God's", cluster: prophecy}
  intercessors-abandon-at-judgment: {label: "The intercessors they claimed as partners are not seen with them; ties are cut", cluster: eschatology}
  splitter-of-grain-and-date-stone: {label: "God splits the grain and the date-stone", cluster: creation}
  splitter-of-dawn: {label: "God is the splitter of the dawn (fāliq al-iṣbāḥ); night for rest", cluster: creation}
  stars-for-navigation: {label: "God made the stars for guidance in the darknesses of land and sea", cluster: cosmology}
  lodging-and-repository: {label: "Humans have a lodging place and a repository (mustaqarr wa-mustawdaʿ)", cluster: creation}
  rain-brings-forth-every-plant: {label: "Rain brings forth vegetation: clustered grain, hanging date clusters, vineyards, olives and pomegranates", cluster: creation}
  jinn-made-partners: {label: "They made the jinn partners of God, though he created them", cluster: idolatry}
  vision-cannot-grasp-god: {label: "Vision does not grasp him, but he grasps all vision", cluster: theology}
  prophet-accused-of-study: {label: "Opponents say to the Prophet 'you have studied' (darasta)", cluster: polemic}
  do-not-revile-others-gods: {label: "Do not revile those they invoke besides God, lest they revile God in ignorance", cluster: ethics}
  sworn-to-believe-if-sign-comes: {label: "They swear solemnly they would believe if a sign came", cluster: polemic}
  even-dead-speaking-would-not-convince: {label: "Even if angels came down and the dead spoke to them, they would not believe", cluster: polemic}
  devils-of-men-and-jinn-inspire: {label: "Every prophet has enemies: devils of humans and jinn inspiring one another with gilded speech", cluster: theology}
  majority-follow-conjecture: {label: "Most on earth follow only conjecture (ẓann) and guess", cluster: wisdom}
  dead-man-given-light-to-walk: {label: "Parable: one who was dead whom God revived and gave a light to walk among people", cluster: wisdom}
  great-criminals-in-every-town: {label: "In every town God placed its great criminals to plot there", cluster: judgment}
  god-knows-where-to-place-message: {label: "God knows best where to place his message", cluster: prophecy}
  breast-opened-or-constricted: {label: "God opens the breast of the guided to Islam; the astray's breast is tight, as if climbing into the sky", cluster: theology}
  abode-of-peace: {label: "Paradise as the abode of peace (dār al-salām)", cluster: eschatology}
  jinn-and-humans-enjoyed-each-other: {label: "Jinn led many humans astray; their human allies say 'we profited from one another'", cluster: eschatology}
  messengers-from-jinn-and-humans: {label: "Messengers came to both jinn and humans 'from among you'", cluster: prophecy}
  portion-for-god-and-for-idols: {label: "Pagans assign a portion of crops and cattle to God and a portion to their partners", cluster: idolatry}
  taboo-crops-and-cattle: {label: "Pagans declare certain cattle and crops taboo (ḥijr), to be eaten only by whom they will", cluster: idolatry}
  cattle-with-forbidden-backs: {label: "Pagans set apart cattle whose backs may not be ridden or burdened", cluster: idolatry}
  womb-contents-reserved-for-males: {label: "Pagans reserve what is in the wombs of cattle for males, forbidden to wives unless stillborn", cluster: idolatry}
  harvest-due-on-reaping-day: {label: "Give its due on the day of harvest", cluster: law}
  no-wastefulness: {label: "Do not be wasteful; God does not love the wasteful (musrifīn)", cluster: ethics}
  eight-pairs-of-livestock: {label: "Eight in pairs: sheep, goats, camels and cattle, male and female; which did God forbid?", cluster: law}
  only-four-food-prohibitions: {label: "Nothing revealed is forbidden to eat except carrion, poured-out blood, swine and what is dedicated to other than God", cluster: law}
  jewish-prohibition-claws-and-fat: {label: "For the Jews God forbade every animal with claws/undivided hoof and the fat of cattle and sheep except on backs, entrails or bone", cluster: law}
  fatalist-excuse: {label: "Idolaters say 'had God willed we would not have associated partners nor forbidden anything'", cluster: polemic}
  commandments-recited: {label: "List of commandments introduced 'Come, I will recite what your Lord has forbidden you'", cluster: law}
  infanticide-for-poverty-forbidden: {label: "Do not kill your children for fear of poverty: God provides for you and them", cluster: law}
  straight-path-not-other-ways: {label: "This is my straight path; follow it and not other ways that scatter you", cluster: ethics}
  torah-complete-and-detailed: {label: "God gave Moses the book complete and detailing everything", cluster: prophecy}
  scripture-sent-to-two-groups: {label: "Lest you say scripture was sent only to two groups before us", cluster: polemic}
  faith-useless-when-signs-come: {label: "On the day some of the signs come, faith not believed before will not avail", cluster: eschatology}
  life-and-death-for-god: {label: "My prayer, my rites, my living and my dying are for God, Lord of the worlds", cluster: liturgy}
  vicegerents-of-the-earth: {label: "God made you successors (khalāʾif) on the earth and raised some above others in rank to test you", cluster: theology}
units:
  - id: quran-4-creation-kinship-orphans
    tradition: islam
    title: One soul, the wombs, orphans' property and the bride-gift
    corpus: quran
    original: true
    tagger: Claude (model), reading the Arabic
    read: ["4:1-10"]
    tags:
      - {motif: created-from-single-soul-and-its-mate, refs: ["4:1"]}
      - {motif: woman-from-rib, refs: ["4:1"], note: "wa-khalaqa minhā zawjahā, 'and created from it its mate'; no rib or sleep is named"}
      - {motif: fear-god-and-the-wombs, refs: ["4:1"]}
      - {motif: orphan-property-guardianship, refs: ["4:2", "4:6"], note: "test them until they reach marriage age; if mature, hand over before witnesses; the poor guardian may eat 'reasonably'"}
      - {motif: polygyny-up-to-four, refs: ["4:3"], note: "two, three or four; or one, or what your right hands possess"}
      - {motif: bride-gift-to-the-woman, refs: ["4:4"], note: "ṣaduqāt as a free gift (niḥla), paid to the woman, not the father"}
      - {motif: seducer-must-marry-or-pay-bride-price, refs: ["4:4"], note: "contrast: in Exod 22:16 the mohar goes to the father"}
      - {motif: property-withheld-from-incompetent, refs: ["4:5"]}
      - {motif: women-share-in-inheritance, refs: ["4:7"]}
      - {motif: poor-relatives-given-from-estate, refs: ["4:8"]}
      - {motif: devouring-orphans-property-eats-fire, refs: ["4:10"]}
      - {motif: god-loves-stranger-orphan-widow, refs: ["4:2", "4:9", "4:10"], note: "care for the weak offspring one leaves behind"}
    hints:
      - "4:1 'created from it its mate' is the Quran's Eve-from-Adam; compare Gen 2:21-22 and Gen Rabbah 17-18."
      - "Bride-gift to the woman herself vs. the mohar paid to the father (Exod 22:15-16; Gen 34:12) and the rabbinic ketubbah."
  - id: quran-4-inheritance-shares
    tradition: islam
    title: The fixed shares of inheritance
    corpus: quran
    original: true
    tagger: Claude (model), reading the Arabic
    read: ["4:11-14"]
    tags:
      - {motif: order-of-inheritance, refs: ["4:11", "4:12"], note: "children, parents, spouses, then siblings; contrast Num 27:8-11 where spouses and parents do not inherit"}
      - {motif: male-double-share-of-female, refs: ["4:11"]}
      - {motif: daughters-inherit, refs: ["4:11"], note: "daughters inherit even alongside sons: two-thirds for more than two, half for one"}
      - {motif: fixed-fractional-shares, refs: ["4:11", "4:12"]}
      - {motif: spouses-inherit-from-each-other, refs: ["4:12"]}
      - {motif: kalala-inheritance, refs: ["4:12"], note: "uterine siblings take a sixth each, sharing a third if more"}
      - {motif: bequest-and-debt-before-shares, refs: ["4:11", "4:12"]}
      - {motif: bounds-of-god-hudud, refs: ["4:13", "4:14"]}
      - {motif: gardens-with-rivers-beneath, refs: ["4:13"]}
    hints:
      - "Compare the daughters of Zelophehad (Num 27; 36) and Mishnah Bava Batra 8 on order of heirs; the rabbinic husband inherits his wife, the wife does not inherit (Quran gives both)."
      - "Compare Job 42:15, where Job's daughters inherit among their brothers."
  - id: quran-4-indecency-repentance
    tradition: islam
    title: Indecency, four witnesses, and the limits of repentance
    corpus: quran
    original: true
    tagger: Claude (model), reading the Arabic
    read: ["4:15-18"]
    tags:
      - {motif: four-witnesses-for-indecency, refs: ["4:15"]}
      - {motif: two-witnesses-for-capital-case, refs: ["4:15"], note: "Quran raises the number to four for fāḥisha"}
      - {motif: adulteress-confined-to-house, refs: ["4:15"], note: "until death takes them or God makes for them a way (sabīl)"}
      - {motif: offenders-released-on-repentance, refs: ["4:16"], note: "'the two of you who commit it': punish both, release if they repent"}
      - {motif: repentance-for-sin-in-ignorance, refs: ["4:17"]}
      - {motif: deathbed-repentance-rejected, refs: ["4:18"], note: "'I repent now' at death's approach is not accepted"}
    hints:
      - "Contrast m. Avot 2:10 'repent one day before your death' and m. Sanh. 6:2 confession at execution; Wisdom of Solomon and Pharaoh's last-minute faith (Quran 10:90-91)."
  - id: quran-4-marriage-forbidden-degrees
    tradition: islam
    title: Inheriting women, the dowry, and the forbidden degrees
    corpus: quran
    original: true
    tagger: Claude (model), reading the Arabic
    read: ["4:19-28"]
    tags:
      - {motif: inheriting-women-forbidden, refs: ["4:19"]}
      - {motif: levirate-marriage, refs: ["4:19"], note: "inverse: a dead man's wife may not be inherited against her will (an-tarithū l-nisāʾa karhan)"}
      - {motif: dowry-not-taken-back, refs: ["4:20", "4:21"], note: "'they took from you a firm covenant' (mīthāq ghalīẓ); even a qinṭār (heap of gold)"}
      - {motif: no-marrying-fathers-wife, refs: ["4:22"], note: "'except what is past'"}
      - {motif: incest-prohibitions-list, refs: ["4:23"], note: "mothers, daughters, sisters, paternal and maternal aunts, nieces, mothers-in-law, stepdaughters in your care, sons' wives"}
      - {motif: milk-kinship-bars-marriage, refs: ["4:23"]}
      - {motif: two-sisters-forbidden-as-rival-wives, refs: ["4:23"], note: "'that you combine two sisters, except what is past'; forbidden outright, not only as rivals"}
      - {motif: married-women-forbidden-except-captives, refs: ["4:24"]}
      - {motif: bride-gift-to-the-woman, refs: ["4:24", "4:25"], note: "ujūrahunna farīḍatan; 4:24 'what you enjoy (istamtaʿtum)' later read as mutʿa"}
      - {motif: marriage-to-believing-slave-women, refs: ["4:25"]}
      - {motif: slave-woman-half-penalty, refs: ["4:25"]}
      - {motif: betrothed-slave-woman-case, refs: ["4:25"], note: "both laws reduce the penalty because the woman is unfree (Lev 19:20)"}
      - {motif: human-created-weak, refs: ["4:28"]}
    hints:
      - "4:23 'except what is past' (illā mā qad salaf) on two sisters invites Jacob, Leah and Rachel (Gen 29); rabbinic discussion of the patriarchs before Sinai."
      - "Compare Lev 18 and 20 and the rabbinic extension to milk-kinship (absent in Judaism; present in Islam)."
  - id: quran-4-wealth-household
    tradition: islam
    title: Wealth by consent, major sins, and discord in marriage
    corpus: quran
    original: true
    tagger: Claude (model), reading the Arabic
    read: ["4:29-35"]
    tags:
      - {motif: consuming-wealth-falsely-forbidden, refs: ["4:29"]}
      - {motif: do-not-kill-yourselves, refs: ["4:29"]}
      - {motif: major-sins-avoided-minor-expiated, refs: ["4:31"]}
      - {motif: covet-prohibition, refs: ["4:32"], note: "do not covet (lā tatamannaw) what God preferred some with; ask God of his bounty"}
      - {motif: sworn-allies-inherit, refs: ["4:33"]}
      - {motif: men-maintainers-of-women, refs: ["4:34"]}
      - {motif: rebellious-wife-admonished-separated-struck, refs: ["4:34"]}
      - {motif: family-arbiters-in-marital-discord, refs: ["4:35"], note: "ḥakam from his people and ḥakam from hers"}
    hints:
      - "Rabbinic categories of grave vs. light commandments (ḥamurot / qalot) and the three cardinal sins, cf. 'kabāʾir'."
  - id: quran-4-kindness-misers-atom
    tradition: islam
    title: The circle of kindness, misers, and the atom's weight
    corpus: quran
    original: true
    tagger: Claude (model), reading the Arabic
    read: ["4:36-42"]
    tags:
      - {motif: honor-parents-long-life, refs: ["4:36"], note: "worship God alone and be good to parents"}
      - {motif: neighbor-near-and-far, refs: ["4:36"]}
      - {motif: love-neighbor-as-yourself, refs: ["4:36"], note: "the neighbor-who-is-kin and the stranger-neighbor (al-jār al-junub)"}
      - {motif: misers-conceal-gods-bounty, refs: ["4:37"]}
      - {motif: deeds-done-for-show, refs: ["4:38"], note: "spending riʾāʾa l-nās"}
      - {motif: satan-as-companion, refs: ["4:38"]}
      - {motif: atoms-weight-of-justice, refs: ["4:40"]}
      - {motif: good-deeds-multiplied, refs: ["4:40"]}
      - {motif: witness-from-every-nation, refs: ["4:41"]}
      - {motif: wish-earth-leveled-over-them, refs: ["4:42"]}
      - {motif: mountains-cover-us, refs: ["4:42"], note: "law tusawwā bihimu l-arḍ; compare Hos 10:8"}
    hints:
      - "4:38 giving to be seen: compare Matt 6:1-4."
      - "4:42 compare Hos 10:8, Luke 23:30 and Rev 6:16 (mountains, fall on us)."
  - id: quran-4-prayer-intoxication-purity
    tradition: islam
    title: Prayer not while drunk; bathing and dry ablution
    corpus: quran
    original: true
    tagger: Claude (model), reading the Arabic
    read: ["4:43"]
    tags:
      - {motif: no-prayer-while-drunk, refs: ["4:43"]}
      - {motif: priests-forbidden-wine-in-sanctuary, refs: ["4:43"], note: "the priestly rule (Lev 10:9) here applied to every worshipper's prayer"}
      - {motif: major-impurity-bath-before-prayer, refs: ["4:43"]}
      - {motif: seminal-emission-impurity-until-evening, refs: ["4:43"], note: "junub; 'or you have touched women' (lāmastum)"}
      - {motif: dry-ablution-with-earth, refs: ["4:43"]}
    hints:
      - "b. Berakhot 15a: one without water wipes his hands with earth or a pebble before prayer; and m. Berakhot on not praying drunk (b. Eruvin 64a)."
  - id: quran-4-people-of-book-distortion
    tradition: islam
    title: Shifted words, 'we hear and disobey', and the people of the Sabbath
    corpus: quran
    original: true
    tagger: Claude (model), reading the Arabic
    read: ["4:44-57"]
    tags:
      - {motif: scripture-altered-tahrif, refs: ["4:46"]}
      - {motif: we-hear-and-disobey, refs: ["4:46"]}
      - {motif: people-accept-covenant-we-will-do, refs: ["4:46"], note: "parodied: 'we hear and we disobey' instead of 'we hear and we obey'"}
      - {motif: ambiguous-address-raina, refs: ["4:46"], note: "rāʿinā vs. unẓurnā; 'hear, may you not be made to hear'"}
      - {motif: faces-obliterated-turned-backward, refs: ["4:47"]}
      - {motif: sabbath-breakers-cursed-transformed, refs: ["4:47"]}
      - {motif: idolatry-unforgivable, refs: ["4:48"]}
      - {motif: self-praise-of-purity-rebuked, refs: ["4:49"]}
      - {motif: tiny-measures-fatil-naqir, refs: ["4:49", "4:53"]}
      - {motif: jibt-and-taghut, refs: ["4:51"]}
      - {motif: abraham-family-given-book-and-kingdom, refs: ["4:54"]}
      - {motif: skins-renewed-in-fire, refs: ["4:56"]}
      - {motif: gardens-with-rivers-beneath, refs: ["4:57"]}
      - {motif: purified-spouses-in-paradise, refs: ["4:57"]}
      - {motif: deep-shade-of-paradise, refs: ["4:57"]}
    hints:
      - "Exod 24:7 na'aseh ve-nishma; b. Shabbat 88a-b and the Aramaic/Hebrew pun shamaʿnu ve-ʿaṣinu (Targum/rabbinic 'we heard and rebelled', cf. Deut 5:24)."
      - "4:56 renewed skins: compare later Jewish and Christian hell-tours (Apocalypse of Peter) on perpetual torment of the body."
  - id: quran-4-trusts-obedience
    tradition: islam
    title: Trusts, obedience to authority, and the hypocrites who seek other judges
    corpus: quran
    original: true
    tagger: Claude (model), reading the Arabic
    read: ["4:58-70"]
    tags:
      - {motif: return-trusts-to-owners, refs: ["4:58"]}
      - {motif: obey-god-messenger-and-authority, refs: ["4:59"]}
      - {motif: jibt-and-taghut, refs: ["4:60"], note: "they wish to seek judgment from al-ṭāghūt"}
      - {motif: prophet-intercedes-for-people, refs: ["4:64"], note: "had they come and the Messenger asked forgiveness for them"}
      - {motif: kill-yourselves-test-command, refs: ["4:66"]}
      - {motif: levites-kill-idolaters-kin, refs: ["4:66"], note: "uqtulū anfusakum echoes the calf episode (cf. Quran 2:54, Exod 32:27)"}
      - {motif: four-ranks-of-the-blessed, refs: ["4:69"]}
    hints:
      - "4:66 'kill yourselves' is the Quranic reading of Exod 32:26-29; compare Targum and midrash on the Levites' slaughter."
  - id: quran-4-fighting-and-death
    tradition: islam
    title: Fighting for the oppressed; death in lofty towers
    corpus: quran
    original: true
    tagger: Claude (model), reading the Arabic
