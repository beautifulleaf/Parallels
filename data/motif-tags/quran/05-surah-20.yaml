new_motifs:
  disconnected-letters-opening: {label: "A surah opens with isolated, unexplained letters (al-muqattaʿat)", cluster: quran-form}
  god-mounted-the-throne: {label: "God 'established himself' (istawā) upon the Throne after creating heaven and earth", cluster: theology}
  god-owns-what-is-beneath-the-soil: {label: "God owns what is in heaven, on earth, between them and beneath the moist soil (al-tharā)", cluster: theology}
  god-knows-secret-and-more-hidden: {label: "God knows the secret and what is even more hidden", cluster: theology}
  most-beautiful-names-of-god: {label: "God has the most beautiful names (al-asmāʾ al-ḥusnā)", cluster: theology}
  quran-not-sent-to-distress: {label: "The revelation was not sent down to make the prophet miserable but as a reminder", cluster: revelation}
  prophet-sees-fire-goes-to-fetch-brand: {label: "Traveling with his family, the prophet sees a fire and goes to bring back a brand or find guidance there", cluster: exodus}
  holy-valley-tuwa: {label: "The call comes in the holy valley named Ṭuwā", cluster: exodus}
  hour-almost-hidden: {label: "The Hour is coming; God almost keeps it hidden so each soul is repaid for its striving", cluster: eschatology}
  prophet-describes-staff-uses: {label: "Asked what is in his hand, the prophet lists his staff's uses: leaning, beating down leaves for sheep, other needs", cluster: exodus}
  prophet-asks-chest-expanded-tongue-untied: {label: "Prophet prays for his chest to be expanded and the knot of his tongue untied", cluster: prophecy}
  brother-as-vizier: {label: "The prophet asks that his brother be made his helper (wazīr) and partner in his mission", cluster: exodus}
  moses-kills-man-delivered-from-grief: {label: "Moses killed a man and God delivered him from distress, then tried him with trials", cluster: exodus}
  moses-years-in-midian: {label: "Moses stays years among the people of Midian before his call", cluster: exodus}
  speak-gently-to-tyrant: {label: "The prophets are told to speak to the tyrant with gentle words, that he may take heed or fear", cluster: exodus}
  peace-on-whoever-follows-guidance: {label: "Formula: 'Peace be on whoever follows the guidance'", cluster: quran-form}
  pharaoh-asks-about-former-generations: {label: "Pharaoh asks about the fate of former generations; the answer: their knowledge is with God in a book", cluster: exodus}
  earth-spread-as-cradle: {label: "God made the earth a cradle/bed (mahd) and threaded paths in it", cluster: creation}
  from-earth-created-returned-brought-forth: {label: "From the earth humans were created, into it they return, and from it they are brought forth again", cluster: eschatology}
  contest-on-festival-day: {label: "The contest with the magicians is set for a festival day (yawm al-zīna) at forenoon with the people assembled", cluster: exodus}
  magicians-ropes-seem-to-move: {label: "The magicians' ropes and staffs appear by sorcery to be moving like snakes", cluster: exodus}
  magicians-fall-prostrate-and-believe: {label: "The defeated magicians fall prostrate and declare faith in the Lord of Moses and Aaron", cluster: exodus}
  pharaoh-threatens-magicians-amputation-crucifixion: {label: "Pharaoh threatens the converted magicians with cutting off hands and feet on opposite sides and crucifixion (on palm trunks)", cluster: exodus}
  martyrs-defy-tyrant-only-this-life: {label: "Condemned believers tell the tyrant 'decree what you will; you can only decree for this worldly life'", cluster: martyrdom}
  hell-neither-die-nor-live: {label: "In hell the damned neither die nor live", cluster: eschatology}
  gardens-with-rivers-beneath: {label: "Paradise as gardens (of ʿAdn) beneath which rivers flow, where the righteous abide forever", cluster: eschatology}
  right-side-of-the-mount: {label: "The covenant appointment is at the right (ayman) side of the Mount (al-Ṭūr)", cluster: exodus}
  moses-hastens-ahead-of-people: {label: "God asks Moses why he hastened ahead of his people to the appointment", cluster: exodus}
  samiri-leads-people-astray: {label: "A man called al-Sāmirī leads Israel astray and makes the calf", cluster: exodus}
  calf-lows: {label: "The molten calf is a body that makes a lowing sound (khuwār)", cluster: exodus}
  aaron-opposes-calf: {label: "Aaron warns the people against the calf; they refuse to stop until Moses returns", cluster: exodus}
  moses-seizes-aarons-beard: {label: "In anger Moses seizes his brother by the beard and head; Aaron pleads 'son of my mother'", cluster: exodus}
  aaron-feared-schism: {label: "Aaron explains he feared being blamed for dividing the children of Israel", cluster: exodus}
  dust-from-messengers-track: {label: "The calf-maker took a handful (of dust) from the track of the messenger and cast it in", cluster: exodus}
  calf-maker-cursed-untouchable: {label: "The calf-maker is condemned to say all his life 'No touching!' (lā misās), an outcast", cluster: exodus}
  calf-burned-scattered-in-sea: {label: "The calf is burned and its remains scattered in the sea (yamm)", cluster: exodus}
  trumpet-blown-at-resurrection: {label: "The trumpet (ṣūr) is blown and the dead are gathered", cluster: eschatology}
  sinners-gathered-blue-eyed: {label: "The guilty are gathered on that day blue-eyed or bleary (zurq)", cluster: eschatology}
  dead-think-they-tarried-briefly: {label: "At the resurrection people think they tarried only ten days, or a day, or part of a day", cluster: eschatology}
  mountains-blown-to-dust-plain: {label: "On the last day God scatters the mountains as dust and leaves a level, featureless plain", cluster: eschatology}
  voices-hushed-to-whisper-at-judgment: {label: "On the day of judgment voices are hushed before the Merciful; only a faint murmur is heard", cluster: eschatology}
  intercession-only-by-permission: {label: "Intercession avails only for whom God permits", cluster: eschatology}
  living-self-subsisting-god: {label: "God called the Living, the Self-Subsisting (al-ḥayy al-qayyūm)", cluster: theology}
  arabic-quran: {label: "The revelation is sent down as an Arabic Quran", cluster: revelation}
  do-not-hasten-recitation: {label: "The prophet is told not to hasten with the recitation before its revelation is complete", cluster: revelation}
  adam-forgot-covenant: {label: "God made a covenant with Adam, but he forgot and lacked resolve", cluster: creation}
  angels-bow-to-adam-iblis-refuses: {label: "God commands the angels to prostrate to Adam; all do except Iblis, who refuses", cluster: creation}
  garden-without-hunger-thirst-nakedness-heat: {label: "In the garden Adam will not hunger, be naked, thirst or suffer the sun's heat", cluster: creation}
  tree-of-immortality-and-unending-kingdom: {label: "The tempter offers 'the tree of immortality and a kingdom that never decays'", cluster: creation}
  satan-whispers: {label: "Satan whispers (waswasa) temptation into the human", cluster: demonology}
  adam-repents-and-is-forgiven: {label: "After the sin God chooses Adam, accepts his repentance and guides him", cluster: creation}
  raised-blind-for-forgetting-signs: {label: "Whoever turned from God's reminder is raised blind on judgment day: as he forgot the signs, so he is forgotten", cluster: eschatology}
  walk-among-dwellings-of-destroyed: {label: "The listeners walk among the dwellings of generations God destroyed, a sign", cluster: punishment-narratives}
  respite-by-prior-word: {label: "Punishment is delayed only because of a word that went before from God and an appointed term", cluster: theology}
  praise-before-sunrise-and-sunset: {label: "Glorify God before sunrise and before sunset, in the hours of night and at the ends of the day (prayer times)", cluster: ritual}
  do-not-envy-worldly-splendor: {label: "Do not stretch your eyes toward the worldly splendor given to others to test them", cluster: ethics}
  former-scrolls: {label: "Appeal to 'the former scrolls' (al-ṣuḥuf al-ūlā) as evidence", cluster: revelation}
  unbelievers-demand-a-sign: {label: "The unbelievers demand: 'Why does he not bring us a sign from his Lord?'", cluster: polemic}
  no-punishment-without-messenger: {label: "God does not punish a people before sending a messenger, lest they plead they had none", cluster: theology}
  reckoning-near-people-heedless: {label: "The people's reckoning draws near while they turn away in heedlessness", cluster: eschatology}
  prophet-dismissed-as-poet-dreamer-forger: {label: "Opponents call the revelation jumbled dreams, a forgery, or the work of a poet", cluster: polemic}
  messengers-were-mortal-men-who-ate: {label: "Earlier messengers were only men who ate food and were not immortal", cluster: prophecy}
  ask-the-people-of-the-reminder: {label: "'Ask the people of the Reminder (ahl al-dhikr) if you do not know': appeal to earlier scripture-holders", cluster: polemic}
  doomed-town-flees-in-vain: {label: "The doomed townsfolk run from God's onslaught and are told mockingly to return to their luxuries; they become mown stubble", cluster: punishment-narratives}
  creation-not-in-jest: {label: "God did not create heaven and earth and what is between them in play", cluster: creation}
  truth-smashes-falsehood: {label: "God hurls the truth against falsehood and it shatters its skull, and falsehood vanishes", cluster: theology}
  angels-praise-unceasingly: {label: "Those with God glorify him night and day without tiring", cluster: angelology}
  many-gods-would-ruin-world: {label: "Were there gods besides God in heaven and earth, both would have been ruined", cluster: theology}
  god-not-questioned: {label: "God is not questioned about what he does, but they are questioned", cluster: theology}
  angels-honored-servants-not-children: {label: "Those called God's offspring are rather honored servants who do not speak before him", cluster: polemic}
  heaven-earth-joined-then-parted: {label: "The heavens and earth were a closed-up mass (ratq) that God split apart (fatq)", cluster: creation}
  every-living-thing-from-water: {label: "God made every living thing from water", cluster: creation}
  mountains-stabilize-earth: {label: "God set firm mountains on the earth lest it sway with people", cluster: creation}
  sky-a-guarded-roof: {label: "God made the sky a protected roof", cluster: cosmology}
  celestial-bodies-swim-in-orbit: {label: "Sun and moon each swim in an orbit (falak)", cluster: cosmology}
  every-soul-tastes-death: {label: "Every soul shall taste death; no human was granted immortality", cluster: eschatology}
  man-created-of-haste: {label: "Man was created of haste", cluster: anthropology}
  earth-diminished-at-its-edges: {label: "God comes to the land, reducing it from its outlying parts", cluster: theology}
  scales-on-judgment-day: {label: "Just scales are set up on the day of resurrection; even a mustard seed's weight is brought forth", cluster: eschatology}
  furqan-given-to-moses: {label: "God gave Moses and Aaron the Criterion (al-furqān), a light and reminder", cluster: revelation}
  fire-becomes-cool-and-peace: {label: "God commands the fire: 'Be coolness and peace upon Abraham'", cluster: patriarchs}
  abraham-and-lot-saved-to-blessed-land: {label: "Abraham and Lot are rescued to the land God blessed for all peoples", cluster: patriarchs}
  grandson-as-extra-gift: {label: "Isaac given, and Jacob in addition as an extra gift (nāfila)", cluster: patriarchs}
  sheep-graze-field-at-night-judgment: {label: "David and Solomon judge a case of sheep that strayed by night into a field; Solomon is given the right understanding", cluster: kingship}
  mountains-and-birds-praise-with-david: {label: "Mountains and birds are made to glorify God together with David", cluster: kingship}
  david-taught-to-make-mail: {label: "God taught David the craft of making coats of mail", cluster: kingship}
  wind-subject-to-solomon: {label: "The stormy wind is subjected to Solomon, blowing at his command", cluster: kingship}
  demons-work-for-solomon: {label: "Devils (shayāṭīn) and jinn labor for Solomon, diving and building", cluster: kingship}
  dhul-kifl-named: {label: "A prophet called Dhū l-Kifl is listed among the patient", cluster: prophecy}
  idris-named: {label: "A prophet named Idrīs is mentioned among the righteous", cluster: prophecy}
  jonah-cries-from-darknesses: {label: "The man of the fish (Dhū l-Nūn) cries from the darknesses 'There is no god but you; I was a wrongdoer' and is saved", cluster: prophecy}
  spirit-breathed-into-mary: {label: "God breathed of his spirit into the woman who guarded her chastity", cluster: christology}
  one-community-divided: {label: "Humanity was one community (umma) but split its affair into sects", cluster: theology}
  gog-magog-released-at-end: {label: "Gog and Magog are let loose and swarm down from every height before the end", cluster: eschatology}
  idols-fuel-of-hell: {label: "The idolaters and what they worship are fuel (ḥaṣab) for hell", cluster: eschatology}
  creation-repeated-as-at-first: {label: "As God began the first creation he will repeat it", cluster: eschatology}
  prophet-sent-as-mercy-to-worlds: {label: "The prophet was sent only as a mercy to the worlds", cluster: prophecy}
  angels-greet-righteous-at-resurrection: {label: "On the day of the great terror the angels meet the righteous: 'This is your day that you were promised'", cluster: eschatology}
  earthquake-of-the-hour: {label: "The quake of the Hour: every nursing mother forgets her suckling, every pregnant one miscarries, people seem drunk though not drunk", cluster: eschatology}
  embryo-stages-dust-drop-clot-lump: {label: "Humans created from dust, then a drop (nuṭfa), then a clinging clot (ʿalaqa), then a chewed lump (muḍgha), shaped and unshaped", cluster: anthropology}
  returned-to-feeblest-age: {label: "Some are returned to the most abject age so that after knowing they know nothing", cluster: anthropology}
  dead-earth-revived-by-rain-as-resurrection-proof: {label: "Barren earth stirs and swells when rain falls: proof that God revives the dead", cluster: eschatology}
  worship-on-the-edge: {label: "Some worship God 'on an edge': content in good fortune, turning away when tested", cluster: ethics}
  stretch-rope-to-heaven-taunt: {label: "Taunt: whoever thinks God will not help him, let him stretch a rope to the sky, then cut it, and see if his rage is removed", cluster: polemic}
  six-communities-judged: {label: "God will judge between believers, Jews, Sabians, Christians, Magians and polytheists on resurrection day", cluster: polemic}
  all-creation-prostrates-to-god: {label: "All in heaven and earth prostrate to God: sun, moon, stars, mountains, trees, beasts and many humans", cluster: theology}
  hell-garments-of-fire-boiling-water: {label: "In hell the unbelievers are cut garments of fire and boiling water is poured on their heads, melting their insides and skins", cluster: eschatology}
  iron-maces-in-hell: {label: "Hooked maces of iron (maqāmiʿ) drive back those who try to escape hell", cluster: eschatology}
  paradise-gold-bracelets-pearls-silk: {label: "In paradise the righteous are adorned with gold bracelets and pearls and wear silk", cluster: eschatology}
  sacred-mosque-equal-for-resident-and-visitor: {label: "The Sacred Mosque is appointed for all people alike, the resident and the visitor from the desert", cluster: ritual}
  abraham-founds-the-house: {label: "God settled Abraham at the site of the House and told him to purify it for those who circle, stand, bow and prostrate", cluster: ritual}
  abraham-proclaims-pilgrimage: {label: "Abraham is told to proclaim the pilgrimage; people come on foot and on lean camels from every deep ravine", cluster: ritual}
  eat-of-sacrifice-and-feed-the-poor: {label: "Eat of the sacrificial animals and feed the wretched poor and the needy", cluster: ritual}
  circumambulate-ancient-house: {label: "Pilgrims finish their grooming, fulfill vows and circle the Ancient House (al-bayt al-ʿatīq)", cluster: ritual}
  polytheist-falls-from-sky-snatched-by-birds: {label: "Simile: the polytheist is like one who falls from the sky and is snatched by birds or flung far by the wind", cluster: polemic}
  every-community-given-a-rite: {label: "God appointed for every community a rite of sacrifice (mansak)", cluster: ritual}
  sacrificial-camels-in-ranks: {label: "Sacrificial camels (budn) are slaughtered standing in ranks; when their sides fall, eat of them", cluster: ritual}
  meat-and-blood-do-not-reach-god: {label: "Neither the flesh nor the blood of sacrifices reaches God, only the piety of the offerer", cluster: ritual}
  permission-to-fight-the-wronged: {label: "Permission to fight is given to those wronged and expelled from their homes for saying 'Our Lord is God'", cluster: war}
  monasteries-churches-synagogues-mosques: {label: "Were God not to check people by others, monasteries, churches, synagogues and mosques would be destroyed", cluster: polemic}
  abandoned-well-and-lofty-palace: {label: "Destroyed towns lie fallen on their roofs, with an abandoned well and a lofty palace", cluster: punishment-narratives}
  hearts-blind-not-eyes: {label: "It is not the eyes that are blind but the hearts within the breasts", cluster: ethics}
  satan-casts-into-prophets-desire: {label: "Satan casts something into every prophet's recitation or wish; God abrogates it and confirms his verses", cluster: revelation}
  migrants-killed-provided-for: {label: "Those who emigrated for God and were killed or died will receive a fine provision", cluster: martyrdom}
  night-merged-into-day: {label: "God makes the night pass into the day and the day into the night", cluster: cosmology}
  god-holds-sky-from-falling: {label: "God holds back the sky from falling onto the earth except by his leave", cluster: cosmology}
  idols-cannot-create-a-fly: {label: "Parable: those invoked besides God could not create a fly even together, nor recover what a fly snatches from them", cluster: polemic}
  messengers-from-angels-and-men: {label: "God chooses messengers from among the angels and from among humans", cluster: prophecy}
  religion-of-father-abraham-named-muslims: {label: "The religion of 'your father Abraham', who named you Muslims before", cluster: polemic}
  chastity-except-wives-and-slaves: {label: "Believers guard their private parts except with their wives or those their right hands possess", cluster: law}
  firdaws-inherited: {label: "The righteous inherit al-Firdaws (paradise, from Persian pairidaēza) forever", cluster: eschatology}
  bones-clothed-with-flesh: {label: "In the womb God makes the lump into bones and clothes the bones with flesh, then makes it another creation", cluster: anthropology}
  best-of-creators: {label: "God called 'the best of creators' (aḥsan al-khāliqīn)", cluster: theology}
  seven-heavens: {label: "God created seven heavens (or seven paths, ṭarāʾiq) above humans", cluster: cosmology}
  olive-tree-of-mount-sinai: {label: "A tree springing from Mount Sinai (Ṭūr Saynāʾ) yields oil and a relish for eaters", cluster: creation}
  milk-from-cattle-bellies-a-lesson: {label: "Cattle are a lesson: God gives drink from what is in their bellies", cluster: creation}
  prophet-a-mere-human-why-not-angels: {label: "The prophet's people object that he is only a human like them; had God willed he would have sent angels", cluster: polemic}
  do-not-plead-for-the-wicked: {label: "God forbids the prophet to address him on behalf of those who did wrong: they will be drowned", cluster: prophecy}
  prayer-for-blessed-landing: {label: "The flood hero prays to be landed at a blessed landing place", cluster: flood}
  people-destroyed-by-the-cry: {label: "A people is seized by the Cry (al-ṣayḥa) and made like flood-scum", cluster: punishment-narratives}
  messengers-sent-in-succession: {label: "God sent his messengers one after another; each was denied and each nation became a tale", cluster: prophecy}
  mary-and-son-sheltered-on-height: {label: "God gave Mary and her son refuge on a height (rabwa) with a resting place and a flowing spring", cluster: christology}
  no-soul-burdened-beyond-capacity: {label: "God charges no soul beyond its capacity", cluster: theology}
  prophet-asks-no-wage: {label: "The prophet asks no payment from his people; his reward is from God", cluster: prophecy}
  fables-of-the-ancients: {label: "Opponents dismiss the message as 'fables of the ancients' (asāṭīr al-awwalīn)", cluster: polemic}
  pagans-admit-god-is-lord: {label: "Asked who owns the earth and is Lord of the heavens and the Throne, the idolaters will say 'God'", cluster: polemic}
  repel-evil-with-better: {label: "Repel evil with what is better", cluster: ethics}
  refuge-from-goadings-of-devils: {label: "Seek refuge in God from the goadings of the devils and from their presence", cluster: demonology}
  dying-man-asks-to-return: {label: "At death the sinner begs 'My Lord, send me back, that I may do good'; it is refused", cluster: eschatology}
  barzakh-barrier-until-resurrection: {label: "Behind the dead is a barrier (barzakh) until the day they are raised", cluster: eschatology}
  no-kinship-on-judgment-day: {label: "When the trumpet is blown there will be no ties of kinship between them, nor will they ask after one another", cluster: eschatology}
  damned-silenced-begone: {label: "God tells the damned pleading to leave hell: 'Be driven away into it and do not speak to me'", cluster: eschatology}
  damned-had-mocked-believers: {label: "The damned had taken the believers as a laughingstock; now the believers triumph", cluster: eschatology}
  fornication-hundred-lashes: {label: "The fornicating woman and man each receive a hundred lashes, witnessed by a party of believers", cluster: law}
  fornicator-marries-only-fornicator: {label: "A fornicator may marry only a fornicator or an idolater; such marriage is forbidden to believers", cluster: law}
  four-witnesses-for-unchastity-charge: {label: "Whoever accuses a chaste woman without four witnesses is flogged eighty lashes and his testimony is never accepted", cluster: law}
  mutual-cursing-oath-lian: {label: "A husband accusing his wife without witnesses swears four times by God and a fifth time invokes God's curse on himself if lying; she averts punishment by four counter-oaths and a fifth invoking God's wrath", cluster: law}
  slander-affair-ifk: {label: "A band spreads a lie (ifk) against a chaste believing woman; the community is rebuked for not dismissing it", cluster: law}
  limbs-testify-on-judgment-day: {label: "On judgment day tongues, hands and feet testify against people", cluster: eschatology}
  wicked-women-for-wicked-men: {label: "Corrupt women are for corrupt men and good women for good men", cluster: ethics}
  do-not-swear-off-charity-to-kin: {label: "The wealthy must not swear to stop giving to kin, the poor and emigrants, but pardon and overlook", cluster: ethics}
  ask-permission-before-entering-houses: {label: "Do not enter others' houses until you have asked leave and greeted the household; if told to go back, go back", cluster: law}
  lower-the-gaze: {label: "Believing men and women are told to lower their gaze and guard their private parts", cluster: law}
  women-cover-bosoms-with-headcloths: {label: "Believing women draw their head-coverings (khumur) over their bosoms and do not show adornment except to listed kin", cluster: law}
  do-not-stamp-feet-to-reveal-ornaments: {label: "Women should not strike their feet to make known their hidden ornaments (anklets)", cluster: law}
  marry-off-the-single-and-slaves: {label: "Marry off the unmarried among you and your righteous slaves; God will enrich the poor", cluster: law}
  manumission-contract-with-slaves: {label: "Grant slaves who ask a written manumission contract (kitāba) and give them of God's wealth", cluster: law}
  god-is-light-of-heavens-and-earth: {label: "God is the light of the heavens and the earth", cluster: theology}
  light-verse-niche-lamp-glass: {label: "God's light is like a niche holding a lamp in a glass like a glittering star, lit from a blessed olive tree neither of east nor west, whose oil almost glows untouched by fire: light upon light", cluster: theology}
  praise-in-houses-morning-evening: {label: "In houses God allowed to be raised, men undistracted by trade glorify him morning and evening", cluster: ritual}
  deeds-of-unbelievers-like-mirage: {label: "The deeds of unbelievers are like a mirage in a plain that the thirsty takes for water until he reaches it and finds nothing, but finds God there", cluster: parable}
  darkness-upon-darkness-in-deep-sea: {label: "Or like darkness in a deep sea, covered by wave upon wave and cloud above, darkness upon darkness, so one cannot see his own hand", cluster: parable}
  birds-in-flight-know-their-prayer: {label: "Birds with outspread wings glorify God; each knows its prayer and praise", cluster: theology}
  mountains-of-hail-in-sky: {label: "God sends down hail from mountains in the sky; the flash of his lightning nearly takes away sight", cluster: cosmology}
  animals-on-belly-two-legs-four: {label: "God created every beast from water: some go on their bellies, some on two legs, some on four", cluster: creation}
  we-hear-and-obey: {label: "The believers' answer when called to judgment: 'We hear and we obey'", cluster: covenant}
  promise-of-succession-in-the-land: {label: "God promises the believers succession (istikhlāf) in the land as he gave it to those before them, exchanging fear for security", cluster: theology}
  three-times-of-privacy: {label: "Slaves and children must ask permission at three times of undress: before dawn prayer, at noon and after the night prayer", cluster: law}
  elderly-women-may-lay-aside-garments: {label: "Elderly women past hope of marriage may lay aside their outer garments without displaying adornment", cluster: law}
  no-blame-eating-in-kin-houses: {label: "No blame on the blind, lame, sick or anyone eating in the houses of listed relatives or friends, together or apart", cluster: law}
  greet-on-entering-houses: {label: "On entering houses greet one another with a blessed greeting from God", cluster: ritual}
  do-not-call-messenger-as-each-other: {label: "Do not address the messenger as you address one another, nor slip away without his leave", cluster: law}
  revelation-dictated-by-others-charge: {label: "Opponents claim the prophet had old tales written down and dictated to him morning and evening, with others helping him", cluster: polemic}
  prophet-eats-and-walks-in-markets: {label: "Opponents object that the messenger eats food and walks in the markets, with no angel, treasure or garden", cluster: polemic}
  prophet-called-bewitched: {label: "Opponents call the prophet a man bewitched (masḥūr)", cluster: polemic}
  hell-sees-them-from-afar-raging: {label: "Hell sees the damned from afar and they hear its raging and roaring", cluster: eschatology}
  damned-chained-cry-for-destruction: {label: "Thrown chained into a narrow place of hell, the damned cry for annihilation (thubūr)", cluster: eschatology}
  false-gods-disown-worshippers: {label: "On judgment day those worshipped besides God deny having misled their worshippers", cluster: eschatology}
  demand-to-see-angels-or-god: {label: "Unbelievers demand that angels be sent down or that they see their Lord", cluster: polemic}
  deeds-made-scattered-dust: {label: "God turns the unbelievers' deeds into scattered dust (habāʾ manthūr)", cluster: eschatology}
  sky-splits-with-clouds-angels-descend: {label: "On the day the sky splits open with clouds and the angels are sent down in ranks", cluster: eschatology}
  wrongdoer-bites-his-hands: {label: "On that day the wrongdoer bites his hands, wishing he had not taken so-and-so as a friend", cluster: eschatology}
  every-prophet-has-an-enemy: {label: "God appointed for every prophet an enemy from among the guilty", cluster: prophecy}
  revelation-sent-piecemeal: {label: "Unbelievers ask why the Quran was not sent down all at once; it is sent in stages to strengthen the prophet's heart", cluster: revelation}
  dragged-on-faces-to-hell: {label: "The damned are gathered on their faces to hell", cluster: eschatology}
  people-of-the-rass: {label: "The 'People of the Rass' (aṣḥāb al-rass, the well) named among destroyed peoples", cluster: punishment-narratives}
  town-rained-with-evil-rain: {label: "The town that was rained on with an evil rain (Lot's) is passed by travelers", cluster: punishment-narratives}
  desire-taken-as-god: {label: "Whoever takes his own desire (hawā) as his god", cluster: ethics}
  people-worse-than-cattle: {label: "Most unbelievers are like cattle, or even further astray", cluster: polemic}
  god-extends-and-withdraws-shadow: {label: "God extends the shadow, makes the sun its guide, then draws it back gently", cluster: cosmology}
  night-as-garment-sleep-as-rest: {label: "God made the night a garment, sleep a rest, and the day a rising (nushūr)", cluster: cosmology}
  winds-herald-mercy-pure-water: {label: "God sends the winds as heralds before his mercy and sends down pure water from the sky", cluster: cosmology}
  two-seas-sweet-and-salt-with-barrier: {label: "God let loose the two seas, one sweet, one salt, with a barrier (barzakh) and partition between them", cluster: cosmology}
  human-from-water-kinship-and-marriage: {label: "God created humans from water and gave them kinship by blood and by marriage", cluster: creation}
  constellations-in-sky: {label: "God set constellations (burūj) in the sky, with a lamp (the sun) and a shining moon", cluster: cosmology}
  pagans-ask-what-is-al-rahman: {label: "Told to prostrate to the Merciful, the pagans ask 'What is al-Raḥmān?'", cluster: polemic}
  servants-of-merciful-walk-humbly: {label: "The servants of the Merciful walk humbly on the earth and answer the ignorant with 'Peace'", cluster: ethics}
  night-vigil-standing-prostrating: {label: "The righteous spend the night prostrating and standing before their Lord", cluster: ritual}
  moderate-spending: {label: "When they spend they are neither extravagant nor stingy, but in between", cluster: ethics}
  evil-deeds-changed-into-good: {label: "For the repentant God changes their evil deeds into good deeds", cluster: theology}
  joy-of-eyes-in-spouses-and-children: {label: "Prayer: grant us from our spouses and offspring the comfort of our eyes", cluster: ritual}
  paradise-lofty-chamber: {label: "The righteous are rewarded with the lofty chamber (al-ghurfa) and greeted with peace", cluster: eschatology}
  prophet-grieves-to-death-over-unbelief: {label: "The prophet is told he may be consuming himself with grief because they will not believe", cluster: prophecy}
  sign-and-mercy-refrain: {label: "Refrain closing each episode: 'In that is a sign, yet most of them do not believe; your Lord is the Mighty, the Merciful'", cluster: quran-form}
  pharaoh-recalls-raising-moses: {label: "Pharaoh reproaches Moses: 'Did we not raise you among us as a child, and you did your deed?'", cluster: exodus}
  moses-admits-killing-in-error: {label: "Moses admits he did the killing while he was 'of those astray' and fled out of fear", cluster: exodus}
  pharaoh-threatens-prison-for-other-god: {label: "Pharaoh threatens to imprison Moses if he takes a god other than Pharaoh", cluster: exodus}
  staff-becomes-great-serpent-thuban: {label: "Before Pharaoh the staff becomes a manifest great serpent (thuʿbān)", cluster: exodus}
  magicians-ask-pharaoh-for-reward: {label: "The magicians ask Pharaoh for a reward if they win and are promised nearness to him", cluster: exodus}
  magicians-swear-by-pharaohs-might: {label: "The magicians cast their spells swearing 'By the might of Pharaoh'", cluster: exodus}
  israel-called-small-band: {label: "Pharaoh calls the Israelites 'a small band' who enrage him", cluster: exodus}
  israel-inherits-egyptian-gardens: {label: "God expelled the Egyptians from gardens, springs, treasures and fine dwellings and made Israel inherit them", cluster: exodus}
  sea-parts-each-side-like-mountain: {label: "The sea splits and each part is like a great mountain (ṭawd)", cluster: exodus}
  abraham-creed-god-who-feeds-heals-revives: {label: "Abraham's creed: the God who created and guides me, feeds and gives drink, heals me when sick, causes me to die and revives me, and will forgive me", cluster: patriarchs}
  abraham-asks-for-good-name-among-later: {label: "Abraham prays for 'a tongue of truthfulness' (good repute) among later generations", cluster: patriarchs}
  abraham-prays-for-idolatrous-father: {label: "Abraham prays God to forgive his father, who was astray", cluster: patriarchs}
  sound-heart-alone-avails: {label: "On that day neither wealth nor sons avail, only one who comes to God with a sound heart", cluster: eschatology}
  hosts-of-iblis-in-hell: {label: "The deluded and all the hosts of Iblis are hurled headlong into hell", cluster: eschatology}
  damned-quarrel-in-hell: {label: "In hell the damned dispute with the gods they equated with God and wish for another chance", cluster: eschatology}
  messenger-is-their-brother: {label: "Formula: 'their brother' (akhūhum) Noah/Hud/Salih/Lot is a trustworthy messenger sent to his people", cluster: quran-form}
  lowly-followers-objected: {label: "The prophet's opponents object that only the lowliest follow him; he refuses to drive the believers away", cluster: prophecy}
  prophet-threatened-with-stoning: {label: "The people threaten to stone the prophet if he does not desist", cluster: prophecy}
  ark-laden: {label: "The hero is saved with those with him in the laden ark (al-fulk al-mashḥūn)", cluster: flood}
  ad-build-monuments-on-heights: {label: "The people of ʿĀd build a monument on every height and take fortresses (maṣāniʿ) hoping to live forever", cluster: punishment-narratives}
  hud-sent-to-ad: {label: "The prophet Hūd is sent to the people of ʿĀd", cluster: punishment-narratives}
  salih-sent-to-thamud: {label: "The prophet Ṣāliḥ is sent to the people of Thamūd", cluster: punishment-narratives}
  thamud-carve-houses-in-mountains: {label: "Thamūd hew houses out of the mountains, among gardens, springs and palms with tender spathes", cluster: punishment-narratives}
  prophet-called-bewitched-mere-human: {label: "The people say the prophet is one of the bewitched and a mere human like them, and demand a sign", cluster: polemic}
  she-camel-of-god: {label: "The sign given is a she-camel with her fixed share of the water on alternate days; harming her brings punishment", cluster: punishment-narratives}
  she-camel-hamstrung: {label: "The people hamstring the she-camel and wake regretful as punishment seizes them", cluster: punishment-narratives}
  lot-condemns-lust-for-males: {label: "Lot condemns his people for approaching males and leaving the wives God created for them", cluster: patriarchs}
  lot-threatened-with-expulsion: {label: "Lot's people threaten to expel him", cluster: patriarchs}
  old-woman-left-behind: {label: "Lot's family is saved except an old woman among those who stayed behind", cluster: patriarchs}
  shuayb-sent-to-people-of-the-thicket: {label: "Shuʿayb is sent to the People of the Thicket (aṣḥāb al-ayka)", cluster: punishment-narratives}
  shuayb-demands-full-measure: {label: "Shuʿayb commands full measure and weighing with the straight balance, and not defrauding people", cluster: law}
  challenge-to-drop-sky-fragments: {label: "Unbelievers challenge the prophet to make pieces of the sky fall on them", cluster: polemic}
  day-of-the-overshadowing-cloud: {label: "The People of the Thicket are destroyed by the punishment of the Day of the Canopy/Shadow (yawm al-ẓulla)", cluster: punishment-narratives}
  trustworthy-spirit-brings-revelation: {label: "The Trustworthy Spirit (al-rūḥ al-amīn) brought the revelation down upon the prophet's heart", cluster: revelation}
  quran-in-scriptures-of-ancients: {label: "The Quran is in the scriptures (zubur) of the ancients and known to the learned of the Children of Israel", cluster: polemic}
  revelation-in-clear-arabic-not-foreign: {label: "Had it been revealed to a non-Arab (aʿjamī) reciting it, they would still not believe", cluster: revelation}
  devils-barred-from-heavenly-hearing: {label: "Devils did not bring down the revelation; they are barred from overhearing heaven", cluster: demonology}
  devils-descend-on-liars: {label: "The devils descend upon every sinful liar, passing on what they overhear, mostly lies", cluster: demonology}
  warn-nearest-kin: {label: "The prophet is told to warn his nearest kinsfolk", cluster: prophecy}
  poets-followed-by-the-deluded: {label: "Poets are followed by the deluded, wander in every valley and say what they do not do, except the believing poets", cluster: polemic}
  blessed-is-who-is-in-the-fire: {label: "At the fire the voice proclaims 'Blessed is he who is in the fire and those around it'", cluster: exodus}
  staff-quivers-like-jinn-snake-moses-flees: {label: "The thrown staff quivers like a jānn (small snake) and Moses turns and flees without looking back", cluster: exodus}
  nine-signs-to-pharaoh: {label: "Moses is sent to Pharaoh with nine signs", cluster: exodus}
  solomon-inherits-david: {label: "Solomon inherits from David (knowledge and kingship)", cluster: kingship}
  solomon-taught-speech-of-birds: {label: "Solomon announces 'We have been taught the speech of birds (manṭiq al-ṭayr)'", cluster: kingship}
  solomons-army-of-jinn-men-birds: {label: "Solomon's hosts of jinn, men and birds are mustered in ordered ranks", cluster: kingship}
  valley-of-ants-warning: {label: "In the Valley of the Ants an ant warns the ants to enter their dwellings lest Solomon's army crush them unawares; Solomon smiles and laughs", cluster: kingship}
  solomon-prays-to-be-grateful: {label: "Solomon prays to be inspired to thank God for favor to him and his parents and to be admitted among the righteous", cluster: kingship}
  hoopoe-missing-from-review: {label: "Solomon reviews the birds, finds the hoopoe absent and threatens to punish or slaughter it unless it brings a clear excuse", cluster: solomon}
  hoopoe-brings-news-of-sheba: {label: "The hoopoe returns with sure news from Sabaʾ, knowledge Solomon lacked", cluster: solomon}
  woman-rules-sheba-on-great-throne: {label: "The hoopoe found a woman ruling Sheba, given everything, with a mighty throne", cluster: solomon}
  sheba-worships-sun: {label: "The queen and her people prostrate to the sun instead of God", cluster: solomon}
  hoopoe-carries-solomons-letter: {label: "Solomon sends the hoopoe to drop his letter before the queen and wait for their reply", cluster: solomon}
  letter-opens-with-basmala: {label: "Solomon's letter begins 'In the name of God, the Merciful, the Compassionate' and demands submission", cluster: solomon}
  queen-consults-her-council: {label: "The queen consults her chiefs, who defer to her; she observes that kings who enter a town ruin it and humble its nobles", cluster: solomon}
  queen-sends-gift-to-test: {label: "The queen sends a gift to see what the envoys bring back; Solomon rejects the wealth and threatens invasion", cluster: solomon}
  ifrit-offers-to-fetch-throne: {label: "An ʿifrīt of the jinn offers to bring the queen's throne before Solomon rises from his seat", cluster: solomon}
  throne-brought-in-blink-by-one-with-book-knowledge: {label: "One with knowledge of the Book brings the throne before Solomon's glance returns to him", cluster: solomon}
  queens-throne-disguised-test: {label: "Solomon has the queen's throne disguised to test whether she recognizes it; she says 'It is as though it were it'", cluster: solomon}
  glass-floor-mistaken-for-water: {label: "Entering Solomon's palace, the queen takes its floor of smooth glass for a pool and bares her legs", cluster: solomon}
  queen-submits-with-solomon: {label: "The queen confesses she wronged herself and submits with Solomon to God, Lord of the worlds", cluster: solomon}
  evil-omen-blamed-on-prophet: {label: "The people say they augur ill (iṭṭayyarnā) of the prophet; he answers that their omen (ṭāʾir) is with God", cluster: polemic}
  nine-conspirators-plot-night-attack: {label: "Nine men of the city swear by God to attack the prophet and his family by night and deny it to his avenger", cluster: punishment-narratives}
  plot-and-counterplot-of-god: {label: "They plotted a plot and God plotted a plot while they did not perceive", cluster: theology}
  lot-family-called-those-who-purify: {label: "Lot's people mock his family as 'people who keep themselves pure' and order their expulsion", cluster: patriarchs}
  is-there-a-god-with-god-litany: {label: "Litany of signs each ending 'Is there a god with God?'", cluster: quran-form}
  god-answers-the-distressed: {label: "God answers the distressed when he calls and removes the evil", cluster: theology}
  quran-settles-israel-disputes: {label: "The Quran relates to the Children of Israel most of what they differ about", cluster: polemic}
  dead-and-deaf-cannot-be-made-to-hear: {label: "The prophet cannot make the dead or deaf hear, nor guide the blind", cluster: prophecy}
  beast-of-the-earth-speaks: {label: "At the end God brings forth a beast from the earth that speaks to people", cluster: eschatology}
  mountains-pass-like-clouds: {label: "You think the mountains firm, yet they pass like clouds", cluster: eschatology}
  terror-at-trumpet-except-whom-god-wills: {label: "At the trumpet all in heaven and earth are terrified except whom God wills", cluster: eschatology}
  lord-of-this-sacred-town: {label: "The prophet worships the Lord of 'this town' which God made sacred", cluster: ritual}
  pharaoh-divides-people-into-factions: {label: "Pharaoh exalted himself and divided the land's people into factions, oppressing one group", cluster: exodus}
  kill-sons-spare-women: {label: "The oppressor slaughters the sons and lets the women live", cluster: exodus}
  oppressed-made-leaders-and-inheritors: {label: "God wills to favor the oppressed and make them leaders (aʾimma) and inheritors", cluster: exodus}
  haman-minister-of-pharaoh: {label: "Hāmān appears as Pharaoh's minister and partner", cluster: exodus}
  mothers-heart-emptied-almost-reveals: {label: "Moses' mother's heart becomes empty and she nearly discloses him, but God steadies her heart", cluster: exodus}
  moses-given-wisdom-at-maturity: {label: "When Moses reached his full strength God gave him judgment and knowledge", cluster: exodus}
  killing-called-work-of-satan: {label: "Moses calls his killing 'the work of Satan' and asks forgiveness, which is granted", cluster: exodus}
  man-from-far-end-of-city-warns: {label: "A man comes running from the far end of the city to warn the hero that the chiefs plot to kill him", cluster: exodus}
  modest-daughter-invites-hero-to-father: {label: "One of the women comes walking shyly to invite the hero to her father, who will reward him", cluster: exodus}
  strong-and-trustworthy-to-hire: {label: "The daughter advises: 'The best one to hire is the strong and trustworthy'", cluster: exodus}
  eight-or-ten-years-for-wife: {label: "The father offers one of his two daughters in marriage for eight years' service, ten if the groom wishes", cluster: exodus}
  call-from-the-tree-on-right-bank: {label: "Moses is called from the tree on the right bank of the valley, in the blessed spot", cluster: exodus}
  aaron-more-eloquent: {label: "Moses says his brother Aaron is more eloquent of tongue and asks for him as a helper to confirm him", cluster: exodus}
  pharaoh-claims-no-other-god: {label: "Pharaoh tells his chiefs: 'I know of no god for you other than me'", cluster: exodus}
  pharaoh-orders-tower-to-gods-god: {label: "Pharaoh orders Haman to fire bricks of clay and build a tower so he may look up to the god of Moses", cluster: exodus}
  pharaohs-host-leaders-to-the-fire: {label: "Pharaoh's people are made leaders who call to the Fire and are cursed in this world", cluster: exodus}
  prophet-was-not-present: {label: "The prophet was not present on the western side of the mount or among the Midianites; the knowledge is a mercy from God", cluster: revelation}
  two-sorceries-supporting-each-other: {label: "Opponents call the Torah and the Quran 'two sorceries supporting each other'", cluster: polemic}
  bring-a-better-book: {label: "Challenge: bring a book from God more guiding than these two and I will follow it", cluster: polemic}
  scripture-people-who-believe-rewarded-twice: {label: "Those given the Book before who believe in the Quran, being muslims already, receive their reward twice", cluster: polemic}
  to-us-our-deeds-to-you-yours: {label: "'To us our deeds and to you yours; peace be upon you; we do not seek the ignorant'", cluster: ethics}
  prophet-cannot-guide-whom-he-loves: {label: "The prophet cannot guide whom he loves; God guides whom he wills", cluster: theology}
  safe-sanctuary-fruits-brought: {label: "God established a safe sanctuary (ḥaram) to which fruits of every kind are brought", cluster: ritual}
  messenger-sent-to-mother-town: {label: "God does not destroy towns until he sends a messenger to their mother-town", cluster: theology}
  where-are-my-partners: {label: "On the day God calls 'Where are my partners whom you claimed?'", cluster: eschatology}
  witness-from-every-nation: {label: "God draws out a witness from every nation on the day of judgment", cluster: eschatology}
  perpetual-night-or-day-argument: {label: "If God made the night or the day perpetual until resurrection, what god could bring the other?", cluster: cosmology}
  qarun-keys-burden-strong-men: {label: "Qārūn (Korah) of Moses' people was given treasures whose keys would weigh down a band of strong men", cluster: exodus}
  qarun-claims-wealth-by-own-knowledge: {label: "Qārūn says his wealth came to him through knowledge he possesses", cluster: exodus}
  qarun-parades-in-finery: {label: "Qārūn goes out in his finery and the worldly wish for his fortune", cluster: exodus}
  everything-perishes-but-his-face: {label: "Everything perishes except God's face", cluster: theology}
  prophet-returned-to-place-of-return: {label: "God who imposed the Quran will bring the prophet back to a place of return (maʿād)", cluster: prophecy}
units:
  - id: quran-20-taha-prologue
    tradition: islam
    title: Ta Ha, the purpose of the revelation and the throne
    corpus: quran
    original: true
    tagger: Claude (model), reading the Arabic
    read: ["20:1-8"]
    tags:
      - {motif: disconnected-letters-opening, refs: ["20:1"], note: "ṭā hā"}
      - {motif: quran-not-sent-to-distress, refs: ["20:2", "20:3"]}
      - {motif: god-mounted-the-throne, refs: ["20:5"], note: "al-raḥmān ʿalā l-ʿarsh istawā"}
      - {motif: god-owns-what-is-beneath-the-soil, refs: ["20:6"]}
      - {motif: god-knows-secret-and-more-hidden, refs: ["20:7"]}
      - {motif: most-beautiful-names-of-god, refs: ["20:8"]}
  - id: quran-20-moses-call
    tradition: islam
    title: Moses at the fire in the holy valley Tuwa
    corpus: quran
    original: true
    tagger: Claude (model), reading the Arabic
    read: ["20:9-36"]
    tags:
      - {motif: prophet-sees-fire-goes-to-fetch-brand, refs: ["20:10"], note: "'Stay here, I have perceived a fire; perhaps I will bring you a brand (qabas) or find guidance at the fire'"}
      - {motif: burning-bush-not-consumed, refs: ["20:10", "20:11"], note: "only a fire; no bush is named in Ta Ha (the tree appears in 28:30)"}
      - {motif: remove-sandals-holy-ground, refs: ["20:12"]}
      - {motif: holy-valley-tuwa, refs: ["20:12"]}
      - {motif: shepherd-called-at-mountain-of-god, refs: ["20:18"]}
      - {motif: hour-almost-hidden, refs: ["20:15"]}
      - {motif: prophet-describes-staff-uses, refs: ["20:17", "20:18"]}
      - {motif: staff-becomes-serpent, refs: ["20:19", "20:20", "20:21"], note: "ḥayya tasʿā, 'a snake moving'; 'We will restore it to its first state'"}
      - {motif: hand-turned-leprous-white-as-snow, refs: ["20:22"], note: "white 'without evil' (min ghayri sūʾ): the Quran denies the leprosy"}
      - {motif: request-for-a-sign, refs: ["20:23"]}
      - {motif: prophet-asks-chest-expanded-tongue-untied, refs: ["20:25", "20:26", "20:27", "20:28"]}
      - {motif: prophet-slow-of-speech, refs: ["20:27"], note: "ʿuqda min lisānī, 'a knot from my tongue'"}
      - {motif: brother-as-vizier, refs: ["20:29", "20:30", "20:31", "20:32"]}
      - {motif: brother-as-spokesman, refs: ["20:29", "20:32"]}
    hints:
      - "The knot in the tongue: Exodus Rabbah 1:26 (the infant Moses burns his tongue on a coal); compare Exod 4:10."
  - id: quran-20-moses-favors-recalled
    tradition: islam
    title: God recalls his favors to Moses from infancy to Midian
    corpus: quran
    original: true
    tagger: Claude (model), reading the Arabic
    read: ["20:37-41"]
    tags:
      - {motif: mother-divinely-inspired, refs: ["20:38"]}
      - {motif: infant-set-adrift, refs: ["20:39"], note: "the tābūt is thrown in the yamm and the yamm casts it ashore"}
      - {motif: found-by-royal-household, refs: ["20:39"], note: "taken by 'an enemy to me and an enemy to him'"}
      - {motif: hero-beautiful, refs: ["20:39"], note: "'I cast upon you love from me' (alqaytu ʿalayka maḥabbatan minnī)"}
      - {motif: sister-offers-nurse, refs: ["20:40"]}
      - {motif: returned-to-own-mother, refs: ["20:40"]}
      - {motif: moses-kills-man-delivered-from-grief, refs: ["20:40"]}
      - {motif: hero-flees-to-foreign-land, refs: ["20:40"]}
      - {motif: moses-years-in-midian, refs: ["20:40"]}
      - {motif: called-from-the-womb, refs: ["20:39", "20:41"], note: "'that you be formed under my eye'; 'I made you for myself'"}
  - id: quran-20-moses-pharaoh-magicians
    tradition: islam
    title: Moses and Aaron before Pharaoh; the contest with the magicians
    corpus: quran
    original: true
    tagger: Claude (model), reading the Arabic
    read: ["20:42-76"]
    tags:
      - {motif: speak-gently-to-tyrant, refs: ["20:44"]}
      - {motif: fear-not-oracle, refs: ["20:46", "20:68"], note: "'I am with you both, I hear and see'"}
      - {motif: let-my-people-go-demand, refs: ["20:47"], note: "'send the children of Israel with us and do not torment them'"}
      - {motif: peace-on-whoever-follows-guidance, refs: ["20:47"]}
      - {motif: who-is-yhwh-defiance, refs: ["20:49"], note: "'Who then is the Lord of you two, Moses?'"}
      - {motif: pharaoh-asks-about-former-generations, refs: ["20:51", "20:52"]}
      - {motif: earth-spread-as-cradle, refs: ["20:53"]}
      - {motif: from-earth-created-returned-brought-forth, refs: ["20:55"]}
      - {motif: hardening-of-pharaohs-heart, refs: ["20:56"], note: "shown all the signs, he denied and refused"}
      - {motif: contest-with-court-magicians, refs: ["20:57", "20:58", "20:60", "20:64", "20:65"]}
      - {motif: contest-on-festival-day, refs: ["20:59"]}
      - {motif: magicians-ropes-seem-to-move, refs: ["20:66"]}
      - {motif: prophets-staff-swallows-magicians-staffs, refs: ["20:69"]}
      - {motif: magicians-fall-prostrate-and-believe, refs: ["20:70"]}
      - {motif: pharaoh-threatens-magicians-amputation-crucifixion, refs: ["20:71"], note: "fī judhūʿ al-nakhl, 'on the trunks of palm trees'"}
      - {motif: martyrs-defy-tyrant-only-this-life, refs: ["20:72", "20:73"], note: "they also say Pharaoh compelled them to practise sorcery"}
      - {motif: hell-neither-die-nor-live, refs: ["20:74"]}
      - {motif: gardens-with-rivers-beneath, refs: ["20:76"]}
    hints:
      - "Named magicians Jannes and Jambres (2 Tim 3:8; Targum Ps.-Jonathan Exod 7:11); their conversion is not in Exodus."
  - id: quran-20-sea-crossing-sinai
