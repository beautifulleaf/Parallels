      - {motif: human-formed-from-earth, refs: ["71:17"]}
      - {motif: dust-to-dust, refs: ["71:18"]}
      - {motif: earth-spread-out-like-carpet, refs: ["71:19", "71:20"]}
      - {motif: reason-rejected-messenger, refs: ["71:21", "71:22"]}
      - {motif: five-idols-of-noahs-people, refs: ["71:23"]}
      - {motif: drowned-then-made-to-enter-fire, refs: ["71:25"]}
      - {motif: universal-destruction, refs: ["71:25", "71:26"]}
      - {motif: hero-prays-for-judgment, refs: ["71:26", "71:27"], note: "leave not one dweller (dayyar) of the unbelievers on the earth"}
      - {motif: flood-hero-prays-for-parents-and-believers, refs: ["71:28"]}
    hints:
      - "Wadd, Suwa', Yaghuth, Ya'uq and Nasr are attested in Ibn al-Kalbi's Book of Idols as Arabian deities; Nasr ('vulture/eagle') compare Mesopotamian and South Arabian NSR."
      - "Noah's preaching is absent from Genesis but present in 2 Pet 2:5, Sib. Or. 1.125-198, b. Sanh. 108a-b and Gen. Rab. 30.7."
