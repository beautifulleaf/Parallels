      - {motif: hero-preaches-to-people, refs: ["71:2", "71:3", "71:5", "71:8", "71:9", "71:10"]}
      - {motif: preaching-day-and-night-public-and-private, refs: ["71:5", "71:6", "71:8", "71:9"]}
      - {motif: fingers-in-ears-garments-over-heads, refs: ["71:7"]}
      - {motif: repentance-brings-abundant-rain, refs: ["71:10", "71:11", "71:12"]}
      - {motif: embryo-stages-drop-clot-form, refs: ["71:14"], note: "khalaqakum atwaran, 'created you in stages'"}
      - {motif: seven-heavens-in-layers, refs: ["71:15"]}
      - {motif: sun-as-blazing-lamp, refs: ["71:16"]}
      - {motif: great-lights-rule-day-and-night, refs: ["71:16"], note: "moon a light, sun a lamp, set within the heavens"}
