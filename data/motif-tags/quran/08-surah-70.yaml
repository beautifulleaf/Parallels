new_motifs:
  # ---- form
  negated-oath-formula-la-uqsimu: {label: "Oath introduced by the negated formula 'No! I swear by...' (la uqsimu / fa-la uqsimu)", cluster: form}
  cosmic-oath-cluster: {label: "A series of oaths by natural phenomena (dawn, night, day, sun, moon, sky, earth, stars, winds) opens or punctuates a passage", cluster: form}
  what-will-make-you-know-formula: {label: "Rhetorical formula 'And what will make you know what X is?' (wa ma adraka ma) introducing an eschatological term", cluster: form}
  woe-to-deniers-refrain: {label: "Refrain 'Woe that day to the deniers' (waylun yawma'idhin lil-mukadhdhibin) repeated through a surah", cluster: form}
  refuge-formula-a-udhu: {label: "Protective formula 'Say: I seek refuge with the Lord of...' (qul a'udhu bi-rabbi) against named evils", cluster: form}
  disavowal-of-other-worship-formula: {label: "Repeated mutual disavowal: 'I do not worship what you worship, nor do you worship what I worship'; 'to you your religion and to me mine'", cluster: polemic}
  lord-of-the-easts-and-wests: {label: "God called Lord of the east and the west, or of the (many) easts and wests (sunrise and sunset points)", cluster: theology}
  # ---- cosmology and creation
  angels-and-spirit-ascend-to-god: {label: "The angels and the Spirit (al-ruh) ascend to God by stairways (ma'arij); God is 'Lord of the ascending ways'", cluster: cosmology}
  day-of-fifty-thousand-years: {label: "A day whose measure is fifty thousand years, during which angels and the Spirit ascend to God", cluster: cosmology}
  seven-heavens-in-layers: {label: "God created seven heavens in layers (sab' samawat tibaqan) or built seven strong (heavens) above humans", cluster: cosmology}
  sun-as-blazing-lamp: {label: "The sun is made a lamp (siraj), a blazing lamp, and the moon a light (nur) within the heavens", cluster: cosmology}
  earth-spread-out-like-carpet: {label: "God spread out the earth as a carpet, cradle or bed (bisat, mihad, daha, sutihat, tahaha)", cluster: cosmology}
  mountains-as-pegs: {label: "God set the mountains as pegs or firm anchors (awtad, rawasi) for the earth", cluster: cosmology}
  heaven-built-before-earth-spread: {label: "God built the sky, raised its canopy, darkened its night and brought out its forenoon; after that he spread out the earth", cluster: cosmology}
  earth-as-container-of-living-and-dead: {label: "The earth is made a receptacle (kifat) that holds the living and the dead", cluster: cosmology}
  night-as-garment-sleep-as-rest: {label: "God made sleep a rest (subat), the night a garment (libas) and the day for livelihood", cluster: cosmology}
  rain-and-crops-as-sign: {label: "God pours down rain, splits the earth and makes grain, grapes, olives, palms and pasture grow, as provision and sign", cluster: creation}
  creation-in-pairs: {label: "God created humans (and things) in pairs, male and female", cluster: creation}
  oath-by-constellations-buruj: {label: "Oath by the sky possessing the constellations or towers (dhat al-buruj)", cluster: cosmology}
  night-visitor-piercing-star: {label: "Oath by the sky and the night-comer (al-tariq), explained as the piercing star (al-najm al-thaqib)", cluster: cosmology}
  oath-by-retreating-running-stars: {label: "Oath by the stars (or planets) that withdraw, run their course and hide (al-khunnas, al-jawari al-kunnas)", cluster: cosmology}
  oath-by-time-al-asr: {label: "Oath by time or the afternoon (al-'asr): humankind is in loss", cluster: form}
  # ---- anthropology
  embryo-stages-drop-clot-form: {label: "Human created in stages: a drop of sperm (nutfa), a clinging clot ('alaq/'alaqa), then shaped and proportioned", cluster: creation}
  sperm-from-between-backbone-and-ribs: {label: "Human created from a gushing fluid that issues from between the backbone (sulb) and the ribs or breastbones (tara'ib)", cluster: creation}
  created-from-despised-water-in-secure-place: {label: "Humans created from a despised fluid placed in a secure lodging (the womb) for a known term", cluster: creation}
  human-once-nothing-worth-mentioning: {label: "There was a stretch of time when the human was not yet a thing worth mentioning", cluster: creation}
  human-created-anxious-and-grasping: {label: "Humankind was created restless (halu'): fretful when evil touches him, grudging when good comes", cluster: anthropology}
  human-created-in-best-stature-then-lowest: {label: "Humankind created in the best of forms (ahsan taqwim), then returned to the lowest of the low, except the believers", cluster: anthropology}
  humans-grown-from-earth-like-plants: {label: "God caused humans to grow from the earth like a plant, returns them to it and will bring them out again", cluster: creation}
  soul-inspired-with-wickedness-and-piety: {label: "God proportioned the soul and inspired it with (knowledge of) its wickedness and its piety; who purifies it prospers", cluster: anthropology}
  self-reproaching-soul: {label: "Oath by the self-reproaching soul (al-nafs al-lawwama)", cluster: anthropology}
  soul-at-peace-returns-to-lord: {label: "The soul at peace (al-nafs al-mutma'inna) is called to return to its Lord, well-pleased and pleasing, and enter his garden", cluster: eschatology}
  god-taught-by-the-pen: {label: "God taught humankind by the pen (qalam) what it did not know", cluster: revelation}
  human-not-left-aimless: {label: "Does man think he will be left aimless (suda), without purpose or accountability?", cluster: anthropology}
  god-can-replace-people-with-better: {label: "God is able to replace a people with others better than they, and none can outrun him", cluster: theology}
  divine-will-precedes-human-will: {label: "You will not will unless God wills", cluster: theology}
  # ---- prophetic biography
  jinn-listen-to-recitation: {label: "A band of jinn overhears the recitation of scripture, believes and reports it to their kind", cluster: jinn}
  humans-seek-refuge-with-jinn: {label: "Men used to seek refuge with male jinn, who only increased them in burden", cluster: jinn}
  spirits-eavesdrop-on-heaven-repelled-by-meteors: {label: "Jinn or devils who used to sit listening at heaven's gates now find it full of stern guards and shooting stars (shuhub) lying in wait", cluster: jinn}
  jinn-divided-into-believers-and-unjust: {label: "Among the jinn are the righteous and the unjust, believers (muslimun) and deviators (qasitun), of different ways", cluster: jinn}
  mosques-belong-to-god: {label: "The places of prostration (al-masajid) belong to God; call on no one beside him", cluster: cult}
  unseen-revealed-only-to-chosen-messenger: {label: "God alone knows the unseen and discloses it only to a messenger he approves, sending watchers before and behind him", cluster: revelation}
  hour-known-only-to-god: {label: "The prophet does not know when the Hour will come; its term rests with God alone", cluster: eschatology}
  prophet-told-not-to-hasten-recitation: {label: "The prophet is told not to move his tongue to hasten the revelation: God will collect, recite and explain it", cluster: revelation}
  prophet-made-to-recite-and-not-forget: {label: "God will make the prophet recite so that he will not forget, except what God wills", cluster: revelation}
  heavy-word-cast-on-prophet: {label: "God will cast upon the prophet a heavy word (qawlan thaqilan)", cluster: revelation}
  measured-chanting-of-scripture: {label: "Command to recite the scripture in slow measured chant (tartil)", cluster: cult}
  night-prayer-measured-by-portions: {label: "Night vigil prescribed in measured portions (half the night, less or more, two-thirds or a third), later lightened for the sick, travelers and fighters", cluster: cult}
  loan-to-god: {label: "Believers are urged to lend God a goodly loan (qard hasan); what one sends ahead is found with God", cluster: ethics}
  prophet-frowns-at-blind-man: {label: "The prophet frowns and turns away from a blind man who came seeking, while attending to a self-sufficient notable, and is rebuked", cluster: prophet}
  honored-scrolls-in-hands-of-scribes: {label: "The reminder is in honored, exalted, purified scrolls in the hands of noble, righteous scribes (safara)", cluster: revelation}
  noble-messenger-near-throne: {label: "The revelation is the word of a noble messenger, powerful, secure with the Lord of the Throne, obeyed and trustworthy", cluster: revelation}
  prophet-sees-angel-on-horizon: {label: "The prophet saw the heavenly messenger on the clear horizon", cluster: revelation}
  prophet-accused-of-madness: {label: "Opponents call the prophet mad (majnun) or possessed; scripture denies it", cluster: polemic}
  scripture-dismissed-as-sorcery-or-human-word: {label: "An opponent dismisses the revelation as inherited sorcery (sihr yu'thar) or 'only the word of a mortal'", cluster: polemic}
  scripture-dismissed-as-tales-of-ancients: {label: "Deniers dismiss the recited signs as 'tales of the ancients' (asatir al-awwalin)", cluster: polemic}
  rich-opponent-given-wealth-and-sons: {label: "God created a man alone, gave him extended wealth and sons present at his side; yet he wants more and stubbornly opposes the signs", cluster: polemic}
  opponent-forbids-servant-to-pray: {label: "A man who forbids a servant of God to pray is threatened: he will be dragged by his lying, sinful forelock", cluster: polemic}
  opponent-calls-his-council-god-calls-zabaniya: {label: "Let the opponent call his council (nadi); God will call the guards of hell (al-zabaniya)", cluster: eschatology}
  prophet-was-orphan-sheltered: {label: "God found the prophet an orphan and sheltered him, astray and guided him, needy and enriched him", cluster: prophet}
  prophets-breast-expanded-burden-removed: {label: "God expanded the prophet's breast, removed the burden that weighed down his back and raised his renown", cluster: prophet}
  with-hardship-comes-ease: {label: "Truly with hardship comes ease (repeated twice)", cluster: wisdom}
  prophet-only-a-reminder-not-warden: {label: "The prophet is only a reminder (mudhakkir), not a controller (musaytir) over people", cluster: prophet}
  prophet-given-al-kawthar: {label: "God has given the prophet al-Kawthar (abundance; in tradition a river or pool in paradise); 'pray and sacrifice'", cluster: prophet}
  enemy-of-prophet-cut-off-abtar: {label: "The one who hates the prophet is the one cut off (al-abtar, without posterity)", cluster: polemic}
  people-enter-religion-in-crowds: {label: "When God's help and the opening (al-fath) come, people enter God's religion in crowds; the prophet is to glorify and seek forgiveness", cluster: prophet}
  curse-on-abu-lahab-and-wife: {label: "Curse on Abu Lahab ('father of flame'): his hands perish, he will burn in a fire of flame, and his wife carries firewood with a rope of palm fiber (masad) on her neck", cluster: polemic}
  oath-by-this-city: {label: "Oath by 'this city' (Mecca), the secure city (al-balad al-amin)", cluster: geography}
  quraysh-winter-and-summer-caravans: {label: "Quraysh's security pact (ilaf) and caravan journeys of winter and summer; they should worship the Lord of this House who fed and secured them", cluster: geography}
  scrolls-of-abraham-and-moses: {label: "The message is in the former scrolls, the scrolls of Abraham and Moses", cluster: revelation}
  people-of-book-divided-after-clear-proof: {label: "The People of the Book split only after the clear proof (al-bayyina) came to them", cluster: polemic}
  messenger-reciting-purified-scrolls: {label: "A messenger from God recites purified scrolls (suhuf mutahhara) containing upright writings", cluster: revelation}
  pure-religion-of-hunafa: {label: "They were commanded only to serve God sincerely, as hunafa' (pure monotheists), pray and give alms: the upright religion", cluster: theology}
  night-of-decree-revelation: {label: "Scripture sent down on the Night of Decree (laylat al-qadr), better than a thousand months", cluster: revelation}
  angels-and-spirit-descend-on-holy-night: {label: "On a holy night the angels and the Spirit descend by their Lord's permission with every command; it is peace until dawn", cluster: revelation}
  heavenly-preserved-tablet: {label: "The scripture is a glorious recitation inscribed on a preserved tablet (lawh mahfuz) in heaven", cluster: revelation}
  # ---- theology
  god-takes-no-consort-or-child: {label: "God has taken neither consort (sahiba) nor child", cluster: theology}
  god-neither-begets-nor-begotten: {label: "God does not beget and was not begotten", cluster: theology}
  god-al-samad: {label: "God is al-Samad (the Eternal Refuge, the solid one who needs nothing)", cluster: theology}
  divine-epithet-cluster: {label: "Cluster of divine epithets in sequence (e.g. the Forgiving, the Loving, Lord of the Throne, the Glorious, doer of what he wills; or Lord, King, God of mankind)", cluster: theology}
  god-originates-and-repeats-creation: {label: "God originates creation and repeats it (yubdi'u wa yu'idu)", cluster: theology}
  divine-counter-plot: {label: "They plot a plot, and God plots a plot; give the deniers respite a little", cluster: theology}
  god-numbers-all-things: {label: "God has counted everything by number and recorded it in a book", cluster: theology}
  prosperity-misread-as-honor: {label: "When God tests a man with bounty he says 'my Lord honored me'; when he restricts his provision he says 'my Lord humiliated me'", cluster: wisdom}
  ease-and-hardship-eased-to-each: {label: "To the giver who fears God, God eases the way to ease; to the miser, the way to hardship", cluster: theology}
  giving-for-gods-face-not-repayment: {label: "The righteous give and feed solely for the face of God, seeking no repayment or thanks", cluster: ethics}
  # ---- ethics and law
  fixed-right-of-poor-in-wealth: {label: "In the wealth of the righteous is a known right (haqq ma'lum) for the beggar and the deprived", cluster: ethics}
  chastity-except-with-wives-and-slaves: {label: "The faithful guard their private parts except with their wives or those their right hands possess; beyond that is transgression", cluster: law}
  freeing-a-slave-as-steep-ascent: {label: "The steep ascent ('aqaba) is freeing a neck (slave), feeding an orphan relative or a needy man in the dust on a day of hunger", cluster: ethics}
  neglect-of-orphan-and-poor-condemned: {label: "The deniers do not honor the orphan, push him away, and do not urge the feeding of the poor", cluster: ethics}
  ostentatious-and-heedless-prayer-condemned: {label: "Woe to those who pray but are heedless of their prayer, make a show, and withhold small kindnesses (al-ma'un)", cluster: ethics}
  defrauders-in-measure: {label: "Woe to the defrauders (mutaffifin) who exact full measure from others but give short measure or weight", cluster: law}
  slanderer-and-hoarder-condemned: {label: "Woe to every slanderer and backbiter (humaza lumaza) who amasses and counts wealth, thinking it makes him immortal", cluster: ethics}
  rivalry-in-increase-until-graves: {label: "Rivalry in piling up (al-takathur) distracts people until they visit the graves; they will be asked about the pleasures", cluster: ethics}
  certainty-knowledge-and-sight: {label: "Knowledge of certainty ('ilm al-yaqin) and the eye of certainty ('ayn al-yaqin): you will see hell", cluster: theology}
  fear-of-standing-before-lord-restrains-desire: {label: "One who feared standing before his Lord and restrained the soul from desire (hawa) will have the garden as refuge", cluster: ethics}
  # ---- Noah
  fingers-in-ears-garments-over-heads: {label: "The people put their fingers in their ears and wrap their garments over their heads to avoid hearing the prophet", cluster: flood}
  preaching-day-and-night-public-and-private: {label: "Prophet summons his people night and day, openly and in secret, yet they only flee further", cluster: flood}
  repentance-brings-abundant-rain: {label: "Seeking forgiveness or keeping to the right way will bring abundant rain, wealth, children, gardens and rivers", cluster: theology}
  five-idols-of-noahs-people: {label: "Noah's people refuse to abandon their gods Wadd, Suwa', Yaghuth, Ya'uq and Nasr", cluster: flood}
  drowned-then-made-to-enter-fire: {label: "Because of their sins they were drowned and then made to enter a fire", cluster: flood}
  flood-hero-prays-for-parents-and-believers: {label: "The flood hero prays for forgiveness for himself, his parents, whoever enters his house believing, and all believers", cluster: flood}
  # ---- other peoples
  people-of-the-ditch: {label: "The people of the ditch (ashab al-ukhdud) sit by a fire pit, watching what they do to believers, whose only offense was faith in God", cluster: martyrdom}
  ad-and-iram-of-the-pillars: {label: "The people of 'Ad and Iram of the pillars ('imad), the like of which was never created in the lands", cluster: punished-peoples}
  thamud-hew-rock-in-valley: {label: "Thamud cut out the rock in the valley (for dwellings)", cluster: punished-peoples}
  pharaoh-of-the-stakes: {label: "Pharaoh 'possessor of the stakes' (dhu al-awtad)", cluster: exodus}
  pharaoh-claims-to-be-supreme-lord: {label: "Pharaoh gathers the people and proclaims 'I am your Lord most high'", cluster: exodus}
  holy-valley-tuwa: {label: "God calls Moses in the sacred valley of Tuwa and sends him to Pharaoh", cluster: exodus}
  punished-peoples-list: {label: "List of destroyed peoples or hosts (e.g. 'Ad, Thamud, Pharaoh) recalled as warning", cluster: punished-peoples}
  she-camel-of-god-hamstrung: {label: "Thamud's most wretched one rises; the messenger warns 'God's she-camel and her drinking'; they hamstring her and God crushes them", cluster: punished-peoples}
  companions-of-the-elephant: {label: "God's action against the companions of the elephant (ashab al-fil), whose plot he made go astray", cluster: punished-peoples}
  birds-in-flocks-pelt-army-with-clay-stones: {label: "God sends birds in flocks (tayran ababil) that pelt an army with stones of baked clay (sijjil), leaving them like devoured straw", cluster: punished-peoples}
  # ---- eschatology
  sky-like-molten-metal: {label: "On the day the sky will be like molten metal or dregs of oil (muhl)", cluster: eschatology}
  mountains-like-carded-wool: {label: "On the day the mountains will be like (carded, dyed) wool ('ihn)", cluster: eschatology}
  mountains-crumble-or-move-at-end: {label: "At the end the mountains become a heap of running sand, are blown away, set in motion or turn into a mirage", cluster: eschatology}
  sky-split-open-at-end: {label: "At the end the sky is split, cleft or opened (infatarat, inshaqqat, furijat)", cluster: eschatology}
  cosmos-hears-and-obeys-its-lord: {label: "Sky and earth 'listen to their Lord' (adhinat) and are made to obey at the end", cluster: eschatology}
  earth-casts-out-its-contents: {label: "At the end the earth is stretched out, casts out what is in it (its burdens) and empties itself", cluster: eschatology}
  earth-tells-its-news: {label: "On that day the earth will tell its news, because its Lord inspired it", cluster: eschatology}
  graves-overturned: {label: "At the end the graves are overturned and their contents scattered out (bu'thirat)", cluster: eschatology}
  seas-burst-or-set-aflame: {label: "At the end the seas are set aflame or burst forth (sujjirat, fujjirat)", cluster: eschatology}
  pregnant-camels-abandoned: {label: "At the end the ten-month pregnant she-camels ('ishar) are left untended", cluster: eschatology}
  wild-beasts-gathered: {label: "At the end the wild beasts are gathered together", cluster: eschatology}
  souls-paired-at-end: {label: "At the end the souls are paired (with bodies or their like)", cluster: eschatology}
  buried-infant-girl-questioned: {label: "At the judgment the girl buried alive (al-maw'uda) is asked for what sin she was killed", cluster: eschatology}
  each-soul-knows-what-it-brought: {label: "Then each soul will know what it has brought forward and what it left behind", cluster: eschatology}
  last-trumpet-blast: {label: "The trumpet (sur, naqur) is sounded and the dead come forth in crowds", cluster: eschatology}
  two-blasts-quaking-and-following: {label: "The first quaking blast (al-rajifa) is followed by a second (al-radifa); a single shout (zajra) and they are on the open plain (al-sahira)", cluster: eschatology}
  dead-rush-from-graves-as-to-cult-stone: {label: "The dead come out of the graves hurrying as if racing to a standing stone (nusub)", cluster: eschatology}
  angels-extract-souls: {label: "Oath by those who draw out (souls) violently, those who release gently, who glide, outstrip and direct affairs", cluster: eschatology}
  kin-forsake-each-other-on-judgment-day: {label: "On the day no friend asks after friend; a man flees his brother, mother, father, wife and sons, each wholly occupied with himself", cluster: eschatology}
  no-refuge-on-judgment-day: {label: "On that day man asks 'where to flee?' but there is no refuge; the destination is with God", cluster: eschatology}
  person-witness-against-self: {label: "Man will be evidence against himself, even if he offers his excuses", cluster: eschatology}
  radiant-and-darkened-faces: {label: "On that day some faces are radiant, laughing and joyful, others scowling, dust-covered and overcast with darkness", cluster: eschatology}
  faces-gaze-upon-their-lord: {label: "On that day radiant faces look upon their Lord (beatific vision)", cluster: eschatology}
  sinners-veiled-from-their-lord: {label: "On that day the wicked are veiled (debarred) from their Lord", cluster: eschatology}
  soul-reaches-collarbone-at-death: {label: "At death the soul reaches the collarbones, someone asks 'who is a healer (or charmer, raq)?', leg is wrapped with leg and the drive is to the Lord", cluster: death}
  day-turns-children-grey: {label: "A day so terrible it turns children grey-haired", cluster: eschatology}
  each-soul-pledged-for-its-deeds: {label: "Every soul is held in pledge (rahina) for what it has earned", cluster: eschatology}
  intercession-avails-not: {label: "The intercession of intercessors will not benefit the damned; no soul has power to help another", cluster: eschatology}
  none-speaks-without-permission: {label: "On the day the Spirit and the angels stand in ranks; none speaks except whom the Merciful permits and who says what is right", cluster: eschatology}
  spirit-and-angels-in-ranks: {label: "The Spirit and the angels, or the angels with the coming Lord, stand rank upon rank (saffan saffa) on judgment day", cluster: eschatology}
  damned-not-permitted-to-speak-or-excuse: {label: "On that day the damned do not speak and are not permitted to offer excuses", cluster: eschatology}
  unbeliever-wishes-he-were-dust: {label: "On the day the unbeliever says 'Would that I were dust!'", cluster: eschatology}
  regret-would-that-i-had-sent-ahead: {label: "On the day man remembers, too late, and says 'Would that I had sent ahead (good deeds) for my life'", cluster: eschatology}
  blessed-question-damned-across-divide: {label: "The people of paradise ask the damned what brought them to hell; they answer: we did not pray, feed the poor, and we denied the day", cluster: eschatology}
  companions-of-right-and-left: {label: "The companions of the right (ashab al-yamin, al-maymana) are saved; the companions of the left (al-mash'ama) are damned", cluster: eschatology}
  book-of-deeds-in-right-hand-or-behind-back: {label: "Whoever is given his book in his right hand has an easy reckoning; whoever is given it behind his back cries for destruction", cluster: eschatology}
  recording-angels-noble-scribes: {label: "Over humans are guardians, noble scribes (kiraman katibin), who know what they do", cluster: eschatology}
  guardian-over-every-soul: {label: "There is no soul but has a guardian (hafiz) over it", cluster: eschatology}
  registers-sijjin-and-illiyyun: {label: "The record of the wicked is in Sijjin, that of the righteous in 'Illiyyun, each an inscribed book (kitab marqum) witnessed by those brought near", cluster: eschatology}
  rust-on-hearts: {label: "What they earned has covered their hearts with rust (rana)", cluster: anthropology}
  role-reversal-of-mockers: {label: "Sinners laughed at and winked at believers; on that day the believers laugh at the unbelievers from their couches", cluster: eschatology}
  each-wants-own-unrolled-scroll: {label: "Each of the deniers wants to be given scrolls unrolled (personally revealed) to him", cluster: polemic}
  brevity-of-life-in-retrospect: {label: "When they see the Hour it will seem they lingered (in the world or the grave) only an evening or its forenoon", cluster: eschatology}
  hell-brought-into-view: {label: "On that day hell is brought forth, exposed or kindled for whoever sees, and paradise brought near", cluster: eschatology}
  hell-lies-in-wait: {label: "Hell (or the Lord) lies in wait (mirsad) as a watch-post for the transgressors", cluster: eschatology}
  sinners-abide-for-ages: {label: "Transgressors abide in hell for ages (ahqaban)", cluster: eschatology}
  neither-dies-nor-lives-in-fire: {label: "The most wretched burns in the great fire, in which he neither dies nor lives", cluster: eschatology}
  hell-drink-boiling-water-and-pus: {label: "In hell they taste no coolness nor drink except boiling water (hamim) and dark, foul fluid (ghassaq), or drink from a boiling spring", cluster: eschatology}
  hell-food-that-chokes-or-thorny-dari: {label: "Hell's food chokes (dha ghussa) or is dari' (a thorny plant) that neither nourishes nor satisfies hunger", cluster: eschatology}
  hell-chains-collars-fetters: {label: "God has prepared chains, iron collars and fetters (ankal) for the unbelievers", cluster: eschatology}
  three-branched-shadow-of-smoke: {label: "The damned are led to a shadow of three branches that gives no shade nor protects from the flame", cluster: eschatology}
  sparks-like-castles-and-yellow-camels: {label: "Hell throws sparks as huge as castles, like yellow (or black) camels", cluster: eschatology}
  named-hells-laza-saqar-hutama-hawiya: {label: "Hell given proper names: Laza (scalp-stripper), Saqar (scorcher, leaves nothing), al-Hutama (the crusher), Hawiya (the abyss)", cluster: eschatology}
  nineteen-guardians-of-hell: {label: "Over hell are nineteen; its keepers are angels whose number is made a test", cluster: eschatology}
  hell-fire-rising-over-hearts: {label: "God's kindled fire rises over the hearts and is closed over them in extended columns", cluster: eschatology}
  fire-closed-over-the-damned: {label: "A fire is closed over the damned (mu'sada)", cluster: eschatology}
  abyss-as-mother: {label: "The one whose scales are light: 'his mother is Hawiya (the abyss)', a blazing fire", cluster: eschatology}
  judgment-scales-heavy-and-light: {label: "On judgment day one whose scales (mawazin) are heavy lives in contentment; one whose scales are light falls to the abyss", cluster: eschatology}
  atoms-weight-of-deeds-seen: {label: "Whoever does an atom's weight (mithqal dharra) of good will see it, and an atom's weight of evil will see it", cluster: eschatology}
  people-like-scattered-moths: {label: "On the striking day (al-qari'a) people will be like scattered moths", cluster: eschatology}
  # ---- paradise
  paradise-drink-mixed-with-camphor-and-ginger: {label: "The righteous drink from a cup mixed with camphor (kafur) or ginger (zanjabil)", cluster: paradise}
  named-springs-of-paradise: {label: "Paradise has named springs: Salsabil, Tasnim (and a spring the servants of God make gush forth)", cluster: paradise}
  sealed-nectar-with-musk: {label: "The righteous drink sealed pure wine (rahiq makhtum) whose seal is musk", cluster: paradise}
  silver-vessels-like-glass: {label: "Vessels of silver and goblets of crystal made of silver, measured exactly, are passed round", cluster: paradise}
  immortal-youths-like-scattered-pearls: {label: "Immortal youths (wildan mukhalladun) circulate among the blessed, like scattered pearls", cluster: paradise}
  green-silk-and-silver-bracelets: {label: "The blessed wear green garments of fine silk (sundus) and brocade (istabraq) and bracelets of silver", cluster: paradise}
  paradise-couches-cushions-carpets: {label: "Paradise has raised couches (arā'ik, surur), set goblets, cushions in rows and spread carpets", cluster: paradise}
  low-shade-and-hanging-fruit: {label: "In paradise the shades are close and the fruit clusters hang low within reach", cluster: paradise}
  paradise-maidens-of-equal-age: {label: "Paradise has full-breasted companions of equal age (kawa'ib atrab)", cluster: paradise}
  no-idle-talk-in-paradise: {label: "In paradise there is no idle talk (laghw) nor lying", cluster: paradise}
  those-brought-near-al-muqarrabun: {label: "An elite of 'those brought near' (al-muqarrabun) witness the righteous register and drink from Tasnim", cluster: paradise}
  # ---- formulas of the end of the canon
  lord-king-god-of-mankind: {label: "Triple title: Lord of mankind, King of mankind, God of mankind", cluster: theology}
  slinking-whisperer: {label: "Refuge from the evil of the slinking whisperer (al-waswas al-khannas) who whispers in people's breasts, from jinn and humans", cluster: demonology}
  women-blowing-on-knots: {label: "Refuge from the evil of those (women) who blow on knots (al-naffathat fi al-'uqad), i.e. knot-tying sorcery", cluster: magic}
  envier-evil-eye: {label: "Refuge from the evil of an envier when he envies (evil eye)", cluster: magic}
  darkness-when-it-settles: {label: "Refuge from the evil of darkness (or the moon) when it settles (ghasiq idha waqab)", cluster: magic}
  deniers-like-asses-fleeing-lion: {label: "Those who turn from the reminder are like startled wild asses fleeing from a lion (qaswara)", cluster: polemic}
  gardens-of-eden-reward: {label: "The reward of the righteous is the gardens of Eden (jannat 'adn) beneath which rivers flow, forever", cluster: paradise}
  mutual-good-pleasure-god-and-saved: {label: "God is pleased with the saved and they are pleased with him", cluster: paradise}
  stage-upon-stage: {label: "'You will surely ride (pass through) stage upon stage' (tabaqan 'an tabaq)", cluster: eschatology}
  prostration-at-recitation: {label: "Those who do not prostrate when the scripture is recited to them are rebuked (a prostration verse)", cluster: cult}
  human-toils-toward-lord: {label: "O man, you are toiling laboriously toward your Lord, and you will meet him", cluster: anthropology}
  war-horses-striking-sparks-dawn-raid: {label: "Oath by charging war-horses that pant, strike sparks with their hooves, raid at dawn, raise dust and storm into the midst of a host", cluster: form}
units:
  - id: quran-70-ascending-stairways
    tradition: islam
    title: "The ascending stairways: the day of fifty thousand years and the steadfast worshippers"
    corpus: quran
    original: true
    tagger: Claude (model), reading the Arabic
    read: ["70:1-44"]
    tags:
      - {motif: angels-and-spirit-ascend-to-god, refs: ["70:3", "70:4"], note: "dhi al-ma'arij, 'Lord of the ascending stairways'"}
      - {motif: day-of-fifty-thousand-years, refs: ["70:4"]}
      - {motif: thousand-years-as-one-day, refs: ["70:4"], note: "divine time-scale; here 50,000 years (cf. 22:47 and 32:5, a thousand)"}
      - {motif: sky-like-molten-metal, refs: ["70:8"]}
      - {motif: mountains-like-carded-wool, refs: ["70:9"]}
      - {motif: kin-forsake-each-other-on-judgment-day, refs: ["70:10", "70:11"]}
      - {motif: no-ransom-for-a-brother, refs: ["70:11", "70:12", "70:13", "70:14"], note: "the sinner would ransom himself with sons, wife, brother, clan and all on earth"}
      - {motif: named-hells-laza-saqar-hutama-hawiya, refs: ["70:15", "70:16", "70:17"], note: "Laza, 'stripper of the scalp', which calls those who turned away"}
      - {motif: human-created-anxious-and-grasping, refs: ["70:19", "70:20", "70:21"]}
      - {motif: righteous-man-catalogue-of-virtues, refs: ["70:22", "70:23", "70:24", "70:26", "70:29", "70:32", "70:33", "70:34"], note: "catalogue of the worshippers: constant prayer, alms, belief in judgment, chastity, trusts, testimony"}
      - {motif: fixed-right-of-poor-in-wealth, refs: ["70:24", "70:25"]}
      - {motif: chastity-except-with-wives-and-slaves, refs: ["70:29", "70:30", "70:31"]}
      - {motif: negated-oath-formula-la-uqsimu, refs: ["70:40"]}
      - {motif: lord-of-the-easts-and-wests, refs: ["70:40"]}
      - {motif: god-can-replace-people-with-better, refs: ["70:41"]}
      - {motif: dead-rush-from-graves-as-to-cult-stone, refs: ["70:43"], note: "ila nusub yufidun: a pagan standing stone as the simile"}
    hints:
      - "Compare Jacob's ladder (Gen 28:12) and the 'ma'arij' of heavenly ascent literature (Hekhalot, Mi'raj)."
      - "Ps 90:4 / 2 Pet 3:8 (a thousand years as a day); Ps 49:8 (no ransom for a brother)."
  - id: quran-71-noah
    tradition: islam
    title: "Noah's preaching, the five idols and the flood"
    corpus: quran
    original: true
    tagger: Claude (model), reading the Arabic
    read: ["71:1-28"]
    tags:
