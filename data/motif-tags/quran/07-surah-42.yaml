new_motifs:
  disconnected-letters-opening: {label: 'A surah opens with disconnected letters (al-huruf al-muqatta''at) such as Ha-Mim, Qaf or Nun', cluster: form}
  heavens-nearly-burst-apart: {label: The heavens almost burst apart from above (at God's majesty or at a blasphemy), cluster: cosmology}
  angels-ask-forgiveness-for-earth-dwellers: {label: Angels glorify God and ask forgiveness for those on earth, cluster: angels}
  arabic-recitation-revealed: {label: The revelation is declared an Arabic recitation (qur'an 'arabi) so that its hearers may understand, cluster: revelation}
  mother-of-towns-warned: {label: 'The prophet is sent to warn ''the mother of towns'' (umm al-qura, Mecca) and those around it', cluster: revelation}
  day-of-gathering: {label: 'The Day of Gathering (yawm al-jam'') when all humanity is assembled; one party to the Garden, one to the Blaze', cluster: eschatology}
  if-god-willed-one-community: {label: Had God willed he would have made all humanity a single community, cluster: theology}
  nothing-is-like-god: {label: '''There is nothing like him'' (laysa ka-mithlihi shay''), yet he is the Hearing, the Seeing', cluster: theology}
  keys-of-heavens-and-earth: {label: God holds the keys (maqalid) of the heavens and the earth, cluster: theology}
  god-expands-and-restricts-provision: {label: God expands provision (rizq) for whom he wills and restricts it, cluster: theology}
  one-religion-of-all-prophets: {label: 'The same religion (din) was enjoined on Noah, Abraham, Moses, Jesus and the Prophet: establish it and do not divide', cluster: polemic}
  divided-after-knowledge-out-of-envy: {label: 'Earlier communities split into factions only after knowledge came to them, out of rivalry (baghy) among themselves', cluster: polemic}
  book-and-balance-sent-down: {label: God sent down the Book with the truth and the Balance (al-mizan), cluster: revelation}
  hour-perhaps-near: {label: 'Perhaps the Hour is near; unbelievers mock and ask to hasten it, believers fear it', cluster: eschatology}
  harvest-of-hereafter-or-world: {label: Whoever seeks the tillage (harth) of the hereafter has it increased; whoever seeks the tillage of this world gets some of it and no share hereafter, cluster: ethics}
  prophet-asks-no-wage: {label: The prophet asks no wage for his message, cluster: prophecy}
  love-of-kin-the-only-wage: {label: The prophet's only requested 'wage' is affection among kin (al-mawadda fi l-qurba), cluster: prophecy}
  accusation-prophet-forged-message: {label: Opponents accuse the prophet of forging lies against God, cluster: polemic}
  god-accepts-repentance-pardons-evil: {label: God accepts repentance from his servants and pardons evil deeds, cluster: theology}
  too-much-provision-breeds-insolence: {label: 'If God gave his servants unlimited provision they would transgress on earth, so he sends down in measure', cluster: theology}
  rain-after-despair: {label: God sends down rain after people have despaired and spreads out his mercy, cluster: nature}
  creatures-dispersed-in-heavens-and-earth: {label: God has dispersed living creatures (dabba) in both the heavens and the earth and can gather them, cluster: cosmology}
  misfortune-from-own-hands: {label: 'Whatever misfortune strikes people is for what their own hands have earned, though God pardons much', cluster: theology}
  ships-like-mountains-sign: {label: Ships running on the sea like landmarks/mountains are a sign; God could still the wind and leave them motionless or wreck them, cluster: nature}
  provision-of-this-world-fleeting: {label: What is given in this life is passing enjoyment (mata'); what is with God is better and more lasting, cluster: ethics}
  affairs-by-mutual-consultation: {label: The believers conduct their affairs by mutual consultation (shura), cluster: law}
  pardon-better-than-retaliation: {label: 'Retaliation in kind is permitted, but whoever pardons and makes peace has his reward with God', cluster: law}
  damned-ask-for-way-back: {label: 'The damned, seeing the punishment, ask whether there is any way of return (to the world)', cluster: eschatology}
  damned-humbled-with-furtive-glance: {label: 'The wrongdoers are presented to the Fire humbled, looking with a stealthy glance', cluster: eschatology}
  prophet-only-delivers-message: {label: The prophet is not a guardian over people; his duty is only to deliver the message (al-balagh), cluster: prophecy}
  human-exults-in-mercy-ungrateful-in-hardship: {label: When man tastes mercy he exults; when evil strikes him for his deeds he is ungrateful, cluster: wisdom}
  god-grants-sons-daughters-or-barrenness: {label: 'God grants daughters to whom he wills, sons to whom he wills, or both, and makes barren whom he wills', cluster: theology}
  three-modes-of-divine-speech: {label: 'God speaks to a human only by inspiration (wahy), from behind a veil (hijab), or by sending a messenger', cluster: revelation}
  prophet-did-not-know-scripture-before: {label: Before revelation the prophet did not know what the Book or faith was, cluster: prophecy}
  revelation-as-spirit-and-light: {label: The revelation is a spirit (ruh) from God's command and a light by which he guides, cluster: revelation}
  revelation-sent-down-from-god-formula: {label: 'Formula: the sending down of the Book (tanzil al-kitab) is from God, the Mighty, the Wise/Knowing', cluster: form}
  oath-by-the-clear-book: {label: Oath 'By the clear Book!' opening a surah, cluster: form}
  mother-of-the-book-heavenly-archetype: {label: 'The scripture exists with God in the ''Mother of the Book'' (umm al-kitab), a heavenly archetype', cluster: revelation}
  earlier-peoples-mocked-their-prophets: {label: 'Every prophet sent to earlier peoples was mocked, and mightier peoples than these were destroyed', cluster: prophecy}
  pagans-admit-god-created-heavens: {label: 'If asked who created the heavens and earth (or them), the idolaters would say ''God''', cluster: polemic}
  earth-as-cradle: {label: God made the earth a cradle (mahd) or bed and laid out paths in it, cluster: creation}
  revival-of-dead-land-proves-resurrection: {label: 'God revives a dead land with rain, and ''thus will you be brought forth'' (resurrection proof)', cluster: eschatology}
  riding-prayer-on-mounts-and-ships: {label: 'A formula of praise when mounting ship or beast: ''Glory to him who subjected this to us; we could not have done it''', cluster: ritual}
  pagan-daughters-of-god: {label: Polemic against assigning daughters to God (the angels as females) while preferring sons for themselves, cluster: polemic}
  face-darkens-at-news-of-daughter: {label: 'When one of them is told of a daughter''s birth, his face darkens and he chokes with grief', cluster: ethics}
  following-the-ways-of-the-fathers: {label: 'Opponents refuse the prophet: ''We found our fathers on a way and follow in their footsteps''', cluster: polemic}
  abraham-disowns-fathers-worship: {label: 'Abraham declares to his father and people that he is free of what they worship, except the one who created him', cluster: patriarchs}
  word-remaining-among-abrahams-descendants: {label: Abraham's confession is left as an enduring word among his descendants ('aqib), cluster: patriarchs}
  revelation-should-come-to-great-man: {label: Opponents ask why the revelation was not sent down to some great man of the two towns, cluster: polemic}
  silver-roofs-for-unbelievers: {label: 'But for fear all would become one community, God would give unbelievers houses with silver roofs, stairways, doors, couches and gold ornament', cluster: ethics}
  satan-assigned-as-companion: {label: 'Whoever turns from God''s remembrance is assigned a devil as constant companion (qarin), whom he curses at the judgment', cluster: demonology}
  distance-of-the-two-easts: {label: The damned wishes that between him and his companion lay 'the distance of the two easts', cluster: eschatology}
  prophet-cannot-make-deaf-hear: {label: The prophet cannot make the deaf hear or guide the blind, cluster: prophecy}
  pharaoh-boasts-rivers-flow-beneath-him: {label: 'Pharaoh boasts to his people: is not the kingdom of Egypt mine, and these rivers flowing beneath me?', cluster: exodus}
  pharaoh-scorns-moses-as-contemptible: {label: 'Pharaoh scorns Moses as contemptible, barely able to speak, without gold bracelets or attending angels', cluster: exodus}
  each-sign-greater-than-its-sister: {label: Each sign shown to Pharaoh's people was greater than the one before it, cluster: exodus}
  jesus-as-example-provokes-uproar: {label: 'When the son of Mary is cited as an example, the opponents clamor and ask whether their gods or he are better', cluster: christology}
  jesus-a-servant-favored: {label: Jesus is only a servant whom God favored and made an example for the Children of Israel, cluster: christology}
  jesus-sign-of-the-hour: {label: Jesus (or the revelation) is knowledge/a sign of the Hour, cluster: christology}
  jesus-clarifies-disputes: {label: 'Jesus came with wisdom to make clear some of what they disputed and called them to worship God, ''my Lord and your Lord''', cluster: christology}
  sects-dispute-over-jesus: {label: The factions (ahzab) fell into disagreement among themselves about Jesus, cluster: christology}
  hour-comes-suddenly: {label: The Hour will come upon them suddenly while they are unaware, cluster: eschatology}
  friends-become-enemies-at-judgment: {label: 'On that day intimate friends become enemies to one another, except the God-fearing', cluster: eschatology}
  no-fear-nor-grief-for-righteous: {label: 'Formula: ''no fear shall be on them, nor shall they grieve''', cluster: eschatology}
  paradise-with-spouses: {label: 'The righteous enter the Garden with their spouses, made joyful', cluster: paradise}
  gold-platters-and-cups-in-paradise: {label: 'In paradise they are served with golden platters and cups, with all that souls desire and eyes delight in', cluster: paradise}
  paradise-inherited-for-deeds: {label: The Garden is inherited because of what the righteous used to do, cluster: paradise}
  fruit-of-paradise: {label: Abundant fruit in paradise from which the blessed eat, cluster: paradise}
  eternity-in-hell: {label: The guilty remain in the punishment of Gehenna forever; it is not lightened for them and they despair (mublisun), cluster: hell}
  malik-keeper-of-hell: {label: 'The damned call on Malik, the keeper of hell, to ask God to end them, and he answers ''You will remain''', cluster: hell}
  recording-angels-write-secrets: {label: God's messengers (angels) are with people writing down their secrets and private talk, cluster: eschatology}
  if-god-had-son-i-would-worship-first: {label: '''If the Merciful had a son, I would be the first of worshippers''', cluster: christology}
  god-is-god-in-heaven-and-on-earth: {label: He it is who in heaven is God and on earth is God, cluster: theology}
  knowledge-of-hour-with-god-alone: {label: The knowledge of the Hour is with God alone, cluster: eschatology}
  no-intercession-except-witness-to-truth: {label: 'Those invoked besides God have no power of intercession, except one who bore witness to the truth', cluster: eschatology}
  turn-away-and-say-peace: {label: 'The prophet is told to turn away from the scoffers and say ''Peace'' (salam), for they will come to know', cluster: ethics}
  revelation-on-blessed-night: {label: The Book was sent down on a blessed night in which every wise matter is decreed/distinguished (cf. the Night of Decree), cluster: revelation}
  sky-brings-visible-smoke: {label: A day when the sky brings a visible smoke (dukhan) covering the people as a painful punishment, cluster: eschatology}
  prophet-called-tutored-madman: {label: 'Opponents call the prophet ''one taught (by others), a madman'' (mu''allam majnun)', cluster: polemic}
  punishment-lifted-briefly-they-relapse: {label: 'God lifts the punishment a little, but they revert; then comes ''the greatest assault'' (al-batsha al-kubra)', cluster: eschatology}
  prophet-seeks-refuge-from-stoning: {label: The prophet seeks refuge in God from being stoned by his people, cluster: prophecy}
  sea-left-parted-and-still: {label: 'Moses is told to leave the sea parted and still (rahwan), for Pharaoh''s host will be drowned', cluster: exodus}
  egyptians-leave-gardens-springs-inherited-by-others: {label: 'The drowned Egyptians left gardens, springs, crops and noble dwellings, which God gave another people to inherit', cluster: exodus}
  heaven-and-earth-did-not-weep: {label: Neither heaven nor earth wept over the destroyed people, cluster: cosmology}
  israel-chosen-knowingly-over-worlds: {label: 'God chose the Children of Israel, knowingly, above the worlds and tested them with signs', cluster: covenant}
  deniers-demand-dead-fathers-return: {label: Deniers of resurrection say there is only our first death and challenge the prophet to bring back their fathers, cluster: eschatology}
  people-of-tubba: {label: The people of Tubba' (the Himyarite kings of Yemen) as a destroyed people, cluster: geography}
  creation-not-in-play: {label: God did not create the heavens and earth and what is between them in play (la'ibin) but in truth, cluster: creation}
  day-of-sorting: {label: The Day of Sorting/Decision (yawm al-fasl) is the appointed time for all, cluster: eschatology}
  patron-cannot-avail-patron: {label: On that day no patron (mawla) can avail his client at all, cluster: eschatology}
  tree-of-zaqqum: {label: 'The tree of Zaqqum in hell, food of the sinner, boiling in bellies like molten metal (muhl)', cluster: hell}
  boiling-water-poured-on-head: {label: Angels drag the sinner into the midst of hellfire and pour boiling water (hamim) over his head, cluster: hell}
  ironic-taunt-to-damned: {label: 'The damned man is taunted: ''Taste! You are the mighty, the noble!''', cluster: hell}
  paradise-silk-and-brocade-facing-one-another: {label: 'The blessed wear fine silk (sundus) and brocade (istabraq), facing one another on couches', cluster: paradise}
  houris-wide-eyed: {label: The blessed are paired with wide-eyed maidens (hur 'in), cluster: paradise}
  no-death-in-paradise-but-first: {label: In paradise they taste no death except the first death, cluster: paradise}
  revelation-made-easy-in-prophets-tongue: {label: God has made the revelation easy in the prophet's own tongue so they may remember, cluster: revelation}
  signs-in-creation-for-those-who-reason: {label: 'Catalogue of signs: heavens and earth, creation of humans and beasts, alternation of night and day, rain reviving the earth, turning of the winds', cluster: creation}
  woe-to-sinful-liar-who-hears-and-scorns: {label: 'Woe to every sinful liar who hears God''s signs recited, persists in arrogance as if he had not heard, and takes them in mockery', cluster: polemic}
  all-in-heavens-and-earth-subjected-to-humans: {label: God has subjected (sakhkhara) to humans the sea and all that is in the heavens and on the earth, cluster: creation}
  believers-forgive-those-who-hope-not-for-days-of-god: {label: Believers are to forgive those who do not look for 'the days of God'; God himself will requite, cluster: ethics}
  each-soul-bears-own-deeds: {label: 'Whoever does good does it for his own soul; whoever does evil, it is against it', cluster: theology}
  israel-given-book-judgment-prophecy: {label: 'God gave the Children of Israel the Book, judgment (hukm) and prophethood, good provision, and preferred them over the worlds', cluster: covenant}
  prophet-set-on-a-sharia: {label: 'God set the Prophet upon a clear way (shari''a) of the command, to follow and not the desires of the ignorant', cluster: law}
  wicked-not-equal-to-righteous-in-life-and-death: {label: 'Do evildoers think God will make them equal to the righteous in life and in death?', cluster: theology}
  desire-taken-as-god: {label: One who takes his own desire (hawa) as his god, cluster: polemic}
  god-seals-hearing-heart-veils-sight: {label: God seals a person's hearing and heart and puts a covering over his sight, cluster: theology}
  only-time-destroys-us: {label: 'Deniers say there is only this life; we die and live, and only Time (al-dahr) destroys us', cluster: polemic}
  every-nation-kneeling-called-to-its-book: {label: 'On the day of the Hour every community is seen kneeling (jathiya), each called to its book of deeds', cluster: eschatology}
  book-of-deeds-speaks-truth-transcribed: {label: 'God''s book speaks against them with truth: ''We used to have transcribed (nastansikh) all that you did''', cluster: eschatology}
  god-forgets-those-who-forgot: {label: '''Today we forget you as you forgot the meeting of this day of yours''', cluster: eschatology}
  divine-grandeur-in-heavens-and-earth: {label: To God belongs the grandeur (kibriya') in the heavens and the earth, cluster: theology}
  idols-created-nothing-challenge: {label: 'Challenge to the idolaters: show what your gods created on earth, or bring a scripture or trace of knowledge for them', cluster: polemic}
  invoked-gods-disown-worshippers: {label: At the resurrection the beings invoked besides God become enemies of their worshippers and deny their worship, cluster: eschatology}
  revelation-called-sorcery: {label: Unbelievers call the recited revelation 'manifest sorcery' (sihr mubin), cluster: polemic}
  prophet-no-novelty-among-messengers: {label: '''I am no novelty among the messengers, and I do not know what will be done with me or with you''', cluster: prophecy}
  israelite-witness-confirms-revelation: {label: A witness from the Children of Israel testifies to the like of it and believes, cluster: polemic}
  book-of-moses-guide-and-mercy: {label: Before it was the Book of Moses as a guide (imam) and mercy; this Arabic book confirms it, cluster: revelation}
  kindness-to-parents-commanded: {label: God enjoins humans to be good to their parents, cluster: law}
  thirty-months-bearing-and-weaning: {label: His mother bore him with hardship and delivered him with hardship; bearing and weaning take thirty months, cluster: law}
  prayer-at-forty-years: {label: 'On reaching full strength at forty, a man prays to be grateful for favor on himself and his parents and for righteous offspring', cluster: prayer}
  son-says-uff-to-parents-denies-resurrection: {label: 'A son says ''Uff!'' to his parents who plead with him, scorning resurrection as ''tales of the ancients''', cluster: ethics}
  tales-of-the-ancients: {label: Deniers dismiss the revelation as 'tales of the ancients' (asatir al-awwalin), cluster: polemic}
  ranks-according-to-deeds: {label: For all there are degrees (darajat) according to what they did, cluster: eschatology}
  good-things-used-up-in-this-life: {label: 'The damned are told: you used up your good things in your worldly life and enjoyed them; today you are repaid with humiliation', cluster: eschatology}
  hud-brother-of-ad-at-ahqaf: {label: The brother of 'Ad (Hud) warns his people at al-Ahqaf (the wind-curved sand dunes), cluster: arabian-prophets}
  doom-cloud-mistaken-for-rain: {label: 'A destroyed people see a cloud approaching their valleys and say ''this cloud will give us rain'', but it is the wind of punishment', cluster: arabian-prophets}
  wind-destroys-all-only-dwellings-remain: {label: A destroying wind wipes out everything at its Lord's command; in the morning only their dwellings are seen, cluster: arabian-prophets}
  ruined-towns-around-mecca: {label: 'God destroyed the towns around the hearers, which serve as warning', cluster: prophecy}
  jinn-listen-to-quran: {label: A band of jinn listens to the Quran in silence and returns to warn their people, cluster: demonology}
  jinn-acknowledge-book-after-moses: {label: The jinn declare they heard a book sent down after Moses confirming what was before it, cluster: demonology}
  creator-not-wearied-by-creation: {label: God was not wearied by creating the heavens and earth (polemic against divine rest), cluster: creation}
  messengers-of-resolve: {label: The Prophet is told to be patient like 'the messengers of resolve' (ulu l-'azm), cluster: prophecy}
  earthly-life-seems-an-hour: {label: 'On the day they see what was promised, it will seem they had tarried only an hour of a day', cluster: eschatology}
  deeds-of-unbelievers-nullified: {label: God makes the deeds of the unbelievers go astray / come to nothing (ahbata a'malahum), cluster: theology}
  prophet-muhammad-named: {label: The Prophet is named Muhammad (or Ahmad) in the text, cluster: prophecy}
  strike-necks-then-bind-captives: {label: 'In battle, strike the necks of unbelievers; when they are subdued bind them, then free them as favor or for ransom until war lays down its burdens', cluster: law}
  martyrs-deeds-not-lost-led-to-garden: {label: 'Those killed in God''s way: their deeds are not lost; he guides them and admits them to a Garden he has made known to them', cluster: eschatology}
  help-god-and-he-helps-you: {label: If you help God he will help you and make your feet firm, cluster: theology}
  travel-and-see-ruins-of-predecessors: {label: 'Have they not traveled in the land and seen the end of those before them?', cluster: prophecy}
  unbelievers-eat-like-cattle: {label: Unbelievers enjoy themselves and eat as cattle eat; the Fire is their lodging, cluster: ethics}
  town-that-expelled-the-prophet: {label: Mightier towns than the one that drove the prophet out were destroyed, cluster: prophecy}
  four-rivers-of-water-milk-wine-honey: {label: 'The Garden has rivers of unstaling water, of milk unchanged in taste, of wine delightful to drinkers, and of purified honey', cluster: paradise}
  boiling-water-cuts-bowels: {label: The damned are given boiling water to drink which tears their bowels apart, cluster: hell}
  hypocrites-ask-what-did-he-say-just-now: {label: 'Some listen to the prophet and on leaving ask the learned ''What did he say just now?''; God has sealed their hearts', cluster: polemic}
  portents-of-the-hour-already-come: {label: The signs/portents (ashrat) of the Hour have already come, cluster: eschatology}
  prophet-asks-forgiveness-for-his-sin: {label: The prophet is told to ask forgiveness for his own sin and for the believing men and women, cluster: prophecy}
  sick-hearted-faint-at-call-to-fight: {label: 'When a decisive surah mentions fighting, those with sickness in their hearts look at the prophet like one fainting at death', cluster: polemic}
  cutting-ties-of-kinship: {label: 'Would you, if you turned away, cause corruption on earth and sever your ties of kinship (arham)?', cluster: ethics}
  locks-on-hearts: {label: '''Do they not ponder the Quran, or are there locks upon their hearts?''', cluster: theology}
  angels-strike-faces-and-backs-at-death: {label: 'The angels take the souls of the hypocrites, striking their faces and their backs', cluster: eschatology}
  hypocrites-known-by-mark-and-tone-of-speech: {label: The hypocrites could be recognized by their marks (sima) and by the twist of their speech (lahn al-qawl), cluster: polemic}
  god-tests-to-know-strivers: {label: God tests the community 'until we know' who strive and are patient, cluster: theology}
  do-not-sue-for-peace-when-uppermost: {label: Do not weaken and call for peace when you are uppermost; God is with you, cluster: law}
  worldly-life-play-and-diversion: {label: The life of this world is only play and diversion (la'ib wa-lahw), cluster: wisdom}
  god-rich-you-poor: {label: God is the Rich (al-ghani) and you are the poor; the miser is miserly only against himself, cluster: ethics}
  god-will-replace-people-who-turn-away: {label: 'If you turn away, God will replace you with another people who will not be like you', cluster: covenant}
  clear-victory-opening: {label: '''We have opened for you a clear opening/victory (fath mubin)'' (the Hudaybiya treaty)', cluster: history}
  prophet-sins-past-and-future-forgiven: {label: God forgives the prophet his past and future sins, cluster: prophecy}
  sakina-sent-down-on-believers: {label: 'God sends down the sakina (tranquillity, cognate of shekhinah) into the hearts of believers', cluster: theology}
  hosts-of-heavens-and-earth-belong-to-god: {label: To God belong the hosts (junud) of the heavens and the earth, cluster: theology}
  prophet-as-witness-bearer-of-tidings-warner: {label: 'The prophet is sent as witness, bearer of good tidings and warner', cluster: prophecy}
  hand-of-god-over-their-hands-pledge: {label: Those who pledge allegiance to the prophet pledge to God; 'the hand of God is over their hands', cluster: covenant}
  bedouin-laggards-excuse: {label: The bedouin who stayed behind plead that wealth and families kept them busy and ask for forgiveness insincerely, cluster: polemic}
  laggards-barred-from-spoils: {label: Those who stayed behind ask to follow when spoils are in prospect and are refused, cluster: warfare}
  blind-lame-sick-exempt-from-fighting: {label: 'No blame on the blind, the lame or the sick (for not going out to fight)', cluster: law}
  pledge-under-the-tree: {label: God was pleased with the believers when they pledged allegiance to the prophet under the tree (Bay'at al-Ridwan), cluster: history}
  sunna-of-god-unchanging: {label: The custom of God (sunnat Allah) with earlier peoples; you will find no change in it, cluster: theology}
  sacrificial-animals-held-back-from-sanctuary: {label: The unbelievers barred the believers from the Sacred Mosque and kept the sacrificial animals from reaching their place, cluster: ritual}
  hidden-believers-spare-the-city: {label: 'But for unknown believing men and women in the city, whom you might have trampled unawares, God would have punished its unbelievers', cluster: theology}
  zealotry-of-ignorance: {label: 'The unbelievers set in their hearts fierce pride, ''the zealotry of the Jahiliyya'', while God sent tranquillity on the believers', cluster: ethics}
  prophets-dream-of-entering-sanctuary-fulfilled: {label: 'God fulfilled the prophet''s vision: you will enter the Sacred Mosque in safety, heads shaved or hair cut short', cluster: ritual}
  religion-of-truth-to-prevail-over-all: {label: God sent his messenger with guidance and the religion of truth to make it prevail over all religion, cluster: polemic}
  mark-of-prostration-on-faces: {label: The believers bear on their faces the mark (sima) from the traces of prostration, cluster: ritual}
  likeness-in-torah-and-gospel-seed-parable: {label: 'Their likeness in the Torah and the Gospel: a seed that puts forth its shoot, strengthens, grows stout and stands on its stem, delighting the sowers', cluster: parable}
  do-not-raise-voice-above-prophet: {label: 'Believers must not put themselves before God and his messenger, nor raise their voices above the prophet''s or shout to him', cluster: ethics}
  calling-from-behind-the-chambers: {label: Those who call the prophet from outside his private chambers (hujurat) lack understanding; they should wait until he comes out, cluster: ethics}
  verify-report-of-wicked-man: {label: 'If a corrupt person brings you news, verify it lest you harm a people in ignorance and come to regret it', cluster: law}
  reconcile-fighting-factions-fight-aggressor: {label: 'If two groups of believers fight, make peace between them; fight the one that transgresses until it returns to God''s command', cluster: law}
  believers-are-brothers: {label: 'The believers are nothing but brothers, so make peace between your brothers', cluster: ethics}
  no-mocking-or-insulting-nicknames: {label: 'Let no people mock another, nor women other women, nor defame one another or insult with nicknames', cluster: ethics}
  backbiting-as-eating-dead-brothers-flesh: {label: 'Avoid suspicion, spying and backbiting: would one of you like to eat the flesh of his dead brother?', cluster: ethics}
  nations-and-tribes-to-know-one-another: {label: Humanity created from a male and a female and made into peoples (shu'ub) and tribes to know one another; the noblest is the most pious, cluster: creation}
  submission-not-yet-faith: {label: 'The bedouin say ''we believe''; rather say ''we have submitted (aslamna)'', for faith has not yet entered your hearts', cluster: theology}
  do-not-count-islam-a-favor: {label: They count their submission a favor to the prophet; rather God has done them a favor in guiding them, cluster: ethics}
  oath-by-the-glorious-quran: {label: Oath 'By the glorious Quran!', cluster: form}
  wonder-at-warner-from-among-them: {label: The unbelievers marvel that a warner has come to them from among themselves, cluster: polemic}
  when-we-are-dust-shall-we-return: {label: 'Deniers ask: when we have died and become dust (and bones), shall we really be raised?', cluster: eschatology}
  god-knows-what-earth-takes-of-them: {label: 'God knows what the earth diminishes of the dead bodies, and with him is a preserving record', cluster: eschatology}
  sky-without-cracks: {label: 'God built the sky and adorned it, and it has no rifts (furuj)', cluster: cosmology}
  mountains-as-anchors: {label: God spread out the earth and cast upon it firm mountains (rawasi) as anchors, cluster: cosmology}
  tall-palms-with-clustered-spathes: {label: Tall palm trees with spathes of layered dates (tal' nadid) as provision, cluster: nature}
  list-of-destroyed-peoples: {label: 'Catalogue of peoples who denied their messengers: Noah''s people, the companions of al-Rass, Thamud, ''Ad, Pharaoh, Lot''s brethren, the companions of the thicket, the people of Tubba''', cluster: prophecy}
  companions-of-al-rass: {label: 'The companions of al-Rass (the well/pit), a destroyed people', cluster: arabian-prophets}
  companions-of-the-thicket: {label: 'The companions of the thicket (ashab al-ayka), associated with Shu''ayb', cluster: arabian-prophets}
  god-nearer-than-jugular-vein: {label: 'God created man, knows what his soul whispers to him, and is nearer to him than his jugular vein', cluster: theology}
  two-recording-angels-right-and-left: {label: Two receivers sit on the right and the left recording every word a person utters, cluster: angels}
  stupor-of-death: {label: 'The stupor (sakra) of death comes with the truth: ''this is what you tried to avoid''', cluster: eschatology}
  trumpet-blown-on-day-of-threat: {label: 'The trumpet (sur) is blown: the Day of the Threat / Resurrection', cluster: eschatology}
  soul-with-driver-and-witness: {label: Every soul comes with a driver (sa'iq) and a witness (shahid), cluster: eschatology}
  veil-removed-sight-sharp: {label: At judgment the covering is removed from a person and his sight that day is sharp as iron, cluster: eschatology}
  companion-disowns-the-damned: {label: 'The damned man''s companion (qarin) disputes before God: ''Our Lord, I did not make him transgress''', cluster: demonology}
  hell-asks-for-more: {label: 'God asks Gehenna ''Are you full?'' and it answers ''Are there any more?''', cluster: hell}
  garden-brought-near: {label: 'The Garden is brought near to the God-fearing, not far off', cluster: paradise}
  enter-in-peace-day-of-eternity: {label: '''Enter it in peace'': the day of eternity; they have what they wish and more (mazid) with God', cluster: paradise}
  no-weariness-after-six-days: {label: God created the heavens and earth in six days and no weariness (lughub) touched him, cluster: creation}
  glorify-before-sunrise-and-sunset: {label: 'Glorify your Lord before the rising of the sun and before its setting, in the night and after prostrations', cluster: ritual}
  caller-calls-from-near-place: {label: 'On the day the caller calls from a place near at hand, and they hear the Cry (al-sayha): the day of coming forth', cluster: eschatology}
  earth-splits-dead-hasten-out: {label: The earth splits open from them and they hasten forth to the gathering, cluster: eschatology}
  oath-by-winds-scattering-and-bearing: {label: 'Oath cluster by the scatterers, the burden-bearers, the easy runners and the distributors of command (winds, clouds, ships or angels)', cluster: form}
  oath-by-the-sky-with-paths: {label: Oath 'By the sky with its tracks/weaves (dhat al-hubuk)', cluster: form}
  perish-the-conjecturers: {label: '''Perish the conjecturers (al-kharrasun)'' who are heedless in a flood of ignorance', cluster: polemic}
  righteous-sleep-little-and-pray-before-dawn: {label: The righteous slept little of the night and sought forgiveness in the hours before dawn (ashar), cluster: ritual}
  right-of-beggar-and-deprived-in-wealth: {label: In their wealth there is a due right (haqq) for the beggar and the deprived, cluster: law}
  signs-in-earth-and-in-yourselves: {label: 'In the earth are signs for the certain, and in yourselves; will you not see?', cluster: theology}
  provision-is-in-heaven: {label: In heaven is your provision and what you are promised, cluster: cosmology}
  oath-as-true-as-your-speaking: {label: God swears by the Lord of heaven and earth that it is as true as the fact that you speak, cluster: form}
  guests-greet-salam: {label: 'The honored guests enter saying ''Peace'' and Abraham replies ''Peace, strangers (qawm munkarun)''', cluster: patriarchs}
  fat-calf-guests-do-not-eat: {label: 'Abraham brings a fattened calf but the guests do not eat, and he becomes afraid of them', cluster: patriarchs}
  wife-strikes-her-face-old-barren: {label: 'Abraham''s wife comes forward crying out, strikes her face and says ''A barren old woman!''', cluster: patriarchs}
  knowing-son-announced: {label: The guests announce to Abraham a knowing (or wise) son ('alim), cluster: patriarchs}
  stones-of-clay-marked-for-transgressors: {label: 'The messengers will send on Lot''s people stones of baked clay, marked (musawwama) by God for the transgressors', cluster: patriarchs}
  only-one-house-of-muslims-found: {label: 'In Lot''s town only one house of submitters (muslimin) was found, and the believers were brought out', cluster: patriarchs}
  ruins-left-as-sign: {label: God left in the destroyed city a sign for those who fear the painful punishment, cluster: prophecy}
  pharaoh-turns-away-with-his-power: {label: Pharaoh turned away with his power/pillar (rukn) and called Moses 'a sorcerer or a madman', cluster: exodus}
  pharaoh-cast-into-sea-blameworthy: {label: God seized Pharaoh and his hosts and cast them into the sea while he was blameworthy, cluster: exodus}
  barren-wind-on-ad: {label: 'On ''Ad God sent the barren wind (al-rih al-''aqim), which left everything like rotten bones', cluster: arabian-prophets}
  thamud-told-enjoy-for-a-time: {label: 'Thamud were told ''Enjoy yourselves for a while'', defied the command and were seized by the thunderbolt while they looked on', cluster: arabian-prophets}
  sky-built-with-might-and-expanding: {label: God built the sky with might (bi-aydin) and is expanding it (inna la-musi'un), cluster: cosmology}
  everything-created-in-pairs: {label: Of everything God created pairs (zawjayn), cluster: creation}
  flee-to-god: {label: '''So flee to God; I am to you a clear warner from him''', cluster: prophecy}
  prophets-always-called-sorcerer-or-madman: {label: 'No messenger came to earlier peoples without being called ''a sorcerer or a madman'', as if they had bequeathed the charge to one another', cluster: polemic}
  jinn-and-humans-created-to-worship: {label: God created jinn and humans only to worship him; he wants no provision or food from them, cluster: theology}
  share-of-punishment-like-companions: {label: 'The wrongdoers have a portion (dhanub, a bucketful) of punishment like that of their fellows', cluster: eschatology}
  oath-by-the-mount-and-inscribed-book: {label: 'Oath cluster: by the Mount (al-Tur), a book inscribed on unrolled parchment (raqq manshur), the frequented House, the raised roof and the swelling/kindled sea', cluster: form}
  frequented-house-heavenly-temple: {label: 'The ''frequented House'' (al-bayt al-ma''mur), understood as a heavenly sanctuary above the Ka''ba visited by angels', cluster: cosmology}
  sea-set-aflame-or-swollen: {label: The sea 'set aflame' or 'filled to overflowing' (al-bahr al-masjur) at the end, cluster: eschatology}
  sky-heaves-mountains-move: {label: On the day the sky heaves (tamur) and the mountains move away, cluster: eschatology}
  damned-shoved-into-fire-is-this-sorcery: {label: 'The deniers are shoved into the Fire and asked ''Is this sorcery, or do you not see?''; patience or impatience is the same for them', cluster: hell}
  eat-and-drink-with-relish-in-paradise: {label: '''Eat and drink with relish for what you used to do''', cluster: paradise}
  reclining-on-ranked-couches: {label: The blessed recline on couches set in rows (or face to face), cluster: paradise}
  offspring-joined-with-parents-in-paradise: {label: 'Believers'' offspring who followed them in faith are joined with them in paradise, without loss of reward; each is pledged for what he earned', cluster: paradise}
  cup-without-idle-talk-or-sin: {label: In paradise they pass a cup to one another in which is no idle talk (laghw) or sin, cluster: paradise}
  youths-like-hidden-pearls: {label: Youths (ghilman) like hidden pearls go round serving them, cluster: paradise}
  blessed-recall-fear-in-their-families: {label: 'The blessed question each other and recall that they used to be fearful among their families, and God saved them from the scorching wind (samum)', cluster: paradise}
  prophet-not-soothsayer-or-madman-or-poet: {label: 'The prophet is no soothsayer (kahin), no madman, no poet awaiting the accident of fate', cluster: polemic}
  challenge-to-produce-a-like-discourse: {label: 'Challenge: let them produce a discourse like it, if they are truthful (tahaddi)', cluster: polemic}
  created-from-nothing-or-self-created: {label: 'Were they created from nothing, or are they the creators? Did they create the heavens and earth?', cluster: polemic}
  ladder-to-eavesdrop-on-heaven: {label: 'Do they have a ladder (sullam) by which they eavesdrop on heaven? Let their listener bring clear proof', cluster: cosmology}
  do-they-possess-the-unseen-and-write-it: {label: 'Do they possess the Unseen (al-ghayb) so they write it down?', cluster: polemic}
  falling-sky-fragment-called-heaped-cloud: {label: If they saw a fragment of the sky falling they would say 'heaped-up clouds', cluster: eschatology}
  prophet-under-gods-eyes: {label: '''Be patient for your Lord''s judgment, for you are under our eyes''', cluster: prophecy}
  glorify-at-retreat-of-stars: {label: 'Glorify God when you rise, in the night, and at the retreat of the stars (dawn)', cluster: ritual}
  oath-by-the-setting-star: {label: Oath 'By the star when it sets/falls (idha hawa)', cluster: form}
  prophet-speaks-not-from-desire: {label: Your companion has not erred; he does not speak from desire; it is only revelation revealed, cluster: prophecy}
  mighty-one-on-highest-horizon: {label: 'One mighty in power (shadid al-quwa) taught him, stood poised on the highest horizon, then drew near and descended', cluster: revelation}
  two-bow-lengths-or-nearer: {label: The heavenly figure came within two bow-lengths or nearer (qaba qawsayn aw adna) and revealed to his servant, cluster: revelation}
  heart-did-not-lie-about-vision: {label: The heart did not falsify what it saw; the gaze did not swerve nor transgress, cluster: revelation}
  second-descent-at-lote-tree-of-boundary: {label: 'He saw him at a second descent by the Lote-Tree of the Boundary (sidrat al-muntaha), near the Garden of Refuge', cluster: cosmology}
  lote-tree-covered-by-what-covers: {label: When there covered the Lote-Tree that which covered it (an ineffable phenomenon), cluster: cosmology}
  greatest-signs-of-lord-seen: {label: He saw some of the greatest signs of his Lord, cluster: revelation}
  al-lat-al-uzza-manat: {label: 'The three goddesses al-Lat, al-''Uzza and Manat, ''the third, the other'', named and rejected', cluster: polemic}
  unfair-division-sons-for-you-daughters-for-god: {label: '''Is the male for you and the female for him? That is an unfair division''', cluster: polemic}
  idols-mere-names-you-named: {label: 'The idols are only names you and your fathers have named, for which God sent down no authority', cluster: polemic}
  angelic-intercession-only-by-permission: {label: 'Many angels in the heavens: their intercession avails nothing except after God permits for whom he wills', cluster: angels}
  conjecture-avails-nothing-against-truth: {label: 'They follow only conjecture (zann), and conjecture avails nothing against the truth', cluster: theology}
  minor-faults-lamam-excused: {label: 'Those who avoid the great sins and indecencies, except minor slips (al-lamam), find God''s forgiveness wide', cluster: law}
  god-knew-you-as-embryos: {label: God knew you when he produced you from the earth and when you were embryos in your mothers' bellies; do not claim purity, cluster: theology}
  scrolls-of-abraham-and-moses: {label: What is in the scrolls (suhuf) of Moses and of Abraham who fulfilled, cluster: revelation}
  no-bearer-bears-anothers-burden: {label: No bearer of burdens bears the burden of another; man has only what he strives for, cluster: law}
  to-your-lord-is-the-final-end: {label: To your Lord is the final end (al-muntaha), cluster: eschatology}
  god-makes-laugh-and-weep: {label: 'It is God who makes to laugh and to weep, who gives death and life', cluster: theology}
  created-pairs-from-emitted-drop: {label: 'God created the pairs, male and female, from a drop of sperm (nutfa) when it is emitted', cluster: creation}
  lord-of-sirius: {label: 'God is ''the Lord of Sirius'' (al-shi''ra), a star worshipped by some Arabs', cluster: cosmology}
  first-ad: {label: God destroyed 'Ad 'the first' (implying a second 'Ad), cluster: arabian-prophets}
  overturned-city-hurled-down: {label: 'The overturned city (al-mu''tafika, Sodom) God hurled down and covered with what covered it', cluster: patriarchs}
  which-of-your-lords-bounties-refrain: {label: '''Which of your Lord''s bounties (ala'') will you dispute/deny?''', cluster: form}
  the-imminent-draws-near: {label: '''The imminent (al-azifa) has drawn near''; none but God can remove it', cluster: eschatology}
  final-prostration-command: {label: A surah ends with the command to prostrate (sajda verse), cluster: ritual}
  hour-near-moon-split: {label: '''The Hour has drawn near and the moon is split'' (inshaqqa l-qamar)', cluster: eschatology}
  signs-dismissed-as-continuous-sorcery: {label: Whenever they see a sign they turn away and say 'continuous/passing sorcery' (sihr mustamirr), cluster: polemic}
  dead-emerge-from-graves-like-scattered-locusts: {label: 'With downcast eyes they come out of the graves like scattered locusts, hastening to the caller', cluster: eschatology}
  refrain-how-were-my-punishment-and-warnings: {label: 'Refrain: ''How then were my punishment and my warnings?'' (fa-kayfa kana ''adhabi wa-nudhur)', cluster: form}
  refrain-quran-made-easy-is-there-any-who-remembers: {label: 'Refrain: ''We have made the Quran easy to remember; is there anyone who will remember?'' (fa-hal min muddakir)', cluster: form}
  noah-cries-i-am-overcome: {label: 'Noah, called a madman and driven off, prays ''I am overcome, so help me!''', cluster: flood}
  gates-of-heaven-opened-earth-burst-into-springs: {label: God opens the gates of heaven with pouring water and makes the earth burst with springs; the waters meet for a decreed matter, cluster: flood}
  ark-of-planks-and-palm-fibre: {label: 'Noah carried on a thing of planks and nails/fibres (dhat alwah wa-dusur), running under God''s eyes', cluster: flood}
  ark-left-as-sign: {label: 'God left the ark (or the event) as a sign: is there anyone who will remember?', cluster: flood}
  roaring-wind-on-day-of-ill-omen: {label: A roaring cold wind (sarsar) on a day of continuous ill omen plucks men away like trunks of uprooted palms, cluster: arabian-prophets}
  shall-we-follow-a-single-human: {label: 'Thamud say: ''Shall we follow a single human from among us? Was the reminder cast on him alone?''', cluster: arabian-prophets}
  she-camel-as-test-water-divided: {label: 'God sends the she-camel as a trial to Thamud; the water is divided between her and them, each drink by turns', cluster: arabian-prophets}
  companion-hamstrings-she-camel: {label: 'They called their companion, who took (the sword) and hamstrung the she-camel', cluster: arabian-prophets}
  single-cry-left-like-pen-builders-chaff: {label: A single Cry (sayha) is sent and they become like the dry stubble of a pen-builder, cluster: arabian-prophets}
  lot-family-saved-before-dawn: {label: Lot's family is saved at the time before dawn (bi-sahar) while a storm of stones (hasib) destroys the rest, cluster: patriarchs}
  sodomites-eyes-obliterated: {label: 'When they solicited Lot''s guests, God obliterated their eyes', cluster: patriarchs}
  immunity-in-the-scriptures-question: {label: '''Are your unbelievers better than those, or have you an immunity (bara''a) in the scriptures (zubur)?''', cluster: polemic}
  the-host-will-be-routed: {label: '''The host will be routed and turn their backs'' (applied to Badr)', cluster: history}
  dragged-on-faces-into-saqar: {label: 'The guilty are dragged on their faces into the Fire: ''Taste the touch of Saqar''', cluster: hell}
  everything-created-by-measure: {label: God created everything by measure/decree (bi-qadar), cluster: theology}
  command-like-blink-of-eye: {label: 'God''s command is but one, like a blink of the eye', cluster: theology}
  every-deed-small-and-great-recorded: {label: Everything they did is in the scriptures (zubur); every small and great thing is written down, cluster: eschatology}
  seat-of-truth-with-mighty-king: {label: 'The God-fearing are in gardens and a river, in a seat of truth with an all-powerful King', cluster: paradise}
  merciful-taught-quran-and-speech: {label: 'The Merciful (al-Rahman) taught the Quran, created man and taught him clear speech (bayan)', cluster: creation}
  sun-and-moon-by-reckoning: {label: The sun and the moon run by exact reckoning (husban), cluster: cosmology}
  stars-and-trees-prostrate: {label: 'The star (or herb, najm) and the tree prostrate themselves to God', cluster: cosmology}
  balance-set-do-not-transgress-in-weighing: {label: 'God raised the sky and set the Balance: do not transgress in the balance; weigh with justice and do not skimp', cluster: law}
  refrain-which-bounties-of-your-lord-will-you-deny: {label: 'Refrain repeated 31 times: ''Which then of the bounties of your Lord will you two (jinn and humans) deny?''', cluster: form}
  dual-address-to-jinn-and-humans: {label: 'The text addresses jinn and humans together in the dual (''you two'', al-thaqalan, ''the two weighty ones'')', cluster: form}
  human-from-potters-clay-jinn-from-smokeless-fire: {label: 'Man created from ringing clay like pottery, the jinn from a smokeless flame of fire (marij min nar)', cluster: creation}
  lord-of-two-easts-and-two-wests: {label: Lord of the two easts and the two wests (the solstitial sunrises and sunsets), cluster: cosmology}
  two-seas-with-barrier: {label: 'God let loose the two seas that meet, with a barrier (barzakh) between them they do not transgress', cluster: cosmology}
  pearls-and-coral-from-the-seas: {label: From the two seas come pearls and coral (marjan), cluster: nature}
  all-perish-but-the-face-of-god: {label: 'All on earth perish; there remains the Face of your Lord, possessor of majesty and honor', cluster: theology}
  god-every-day-in-some-work: {label: All in heaven and earth ask of him; every day he is engaged in some affair (kull yawm huwa fi sha'n), cluster: theology}
  we-shall-attend-to-you-two-weighty-ones: {label: '''We shall attend to you, O two weighty ones (al-thaqalan)''', cluster: eschatology}
  jinn-and-men-cannot-pass-beyond-heavens: {label: 'O company of jinn and men, pass beyond the regions of the heavens and earth if you can; you cannot without authority; flames and molten brass will be sent on you', cluster: cosmology}
  sky-splits-red-like-rose-or-oil: {label: When the sky is split open and becomes rose-red like (red) leather/oil dregs, cluster: eschatology}
  guilty-seized-by-forelocks-and-feet: {label: The guilty are known by their marks and seized by the forelocks and the feet, cluster: hell}
  circuit-between-hell-and-boiling-water: {label: The damned go round between Gehenna and seething boiling water, cluster: hell}
  two-gardens-for-who-fears-standing-before-god: {label: 'For whoever fears the standing before his Lord there are two gardens, with branches, two flowing springs and every fruit in pairs', cluster: paradise}
  couches-lined-with-brocade-fruit-near: {label: 'Reclining on couches lined with brocade, with the fruit of the gardens hanging near', cluster: paradise}
  maidens-of-restrained-glance-untouched: {label: 'Maidens of restrained glance whom no man or jinn has touched before them, like rubies and coral', cluster: paradise}
  reward-of-goodness-is-goodness: {label: '''Is the reward of excellence anything but excellence?''', cluster: ethics}
  two-lesser-dark-green-gardens: {label: 'Below those, two further gardens, dark green (mudhammatan), with gushing springs, fruit, palms and pomegranates', cluster: paradise}
  houris-secluded-in-pavilions: {label: Houris secluded in pavilions/tents (khiyam), cluster: paradise}
  green-cushions-and-abqari-carpets: {label: Reclining on green cushions (rafraf) and beautiful 'abqari carpets, cluster: paradise}
  blessed-be-the-name-of-your-lord: {label: 'Doxology: ''Blessed be the name of your Lord, possessor of majesty and honor''', cluster: form}
  the-event-abasing-and-exalting: {label: 'When the Event (al-waqi''a) befalls, none can deny it: it abases and exalts', cluster: eschatology}
  earth-shaken-mountains-crumbled-to-dust: {label: The earth is shaken violently and the mountains crumbled into scattered dust (haba'), cluster: eschatology}
  three-classes-at-judgment: {label: 'Humanity sorted into three classes: Companions of the Right, Companions of the Left, and the Foremost (al-sabiqun) brought near', cluster: eschatology}
  many-of-the-first-few-of-the-later: {label: The Foremost are a multitude of the earlier generations and a few of the later, cluster: eschatology}
  immortal-youths-with-goblets-ewers: {label: 'Immortal youths (wildan mukhalladun) circulate with goblets, ewers and a cup from a flowing spring', cluster: paradise}
  paradise-wine-no-headache-no-intoxication: {label: Paradise drink from which they suffer no headache nor intoxication, cluster: paradise}
  flesh-of-fowl-in-paradise: {label: In paradise they have the flesh of fowl as they desire, cluster: paradise}
  only-peace-peace-heard: {label: 'In paradise they hear no idle talk or sin, only the saying ''Peace, peace''', cluster: paradise}
  thornless-lote-and-banana-trees: {label: The Companions of the Right are among thornless lote trees (sidr makhdud) and layered talh (acacia/banana) with extended shade and poured water, cluster: paradise}
  fruit-neither-cut-off-nor-forbidden: {label: 'Abundant fruit in paradise, neither cut off (seasonless) nor forbidden', cluster: paradise}
  maidens-newly-created-virgins-of-equal-age: {label: 'God created (the companions) anew and made them virgins, loving, of equal age', cluster: paradise}
  scorching-wind-shade-of-black-smoke: {label: 'The Companions of the Left are in scorching wind (samum), boiling water and the shade of black smoke (yahmum), neither cool nor kind', cluster: hell}
  luxury-and-the-great-sin: {label: The damned had lived in luxury and persisted in the great sin (al-hinth al-'azim), cluster: ethics}
  damned-drink-like-thirst-crazed-camels: {label: The damned eat of Zaqqum to fill their bellies and drink boiling water like thirst-crazed camels (al-him), cluster: hell}
  do-you-create-your-semen: {label: 'Have you seen what you emit? Do you create it, or are we the creator?', cluster: creation}
  do-you-sow-or-do-we: {label: 'Have you seen what you sow? Do you make it grow, or are we the grower? We could make it chaff', cluster: creation}
  rain-from-clouds-could-be-made-salt: {label: 'Have you seen the water you drink? Did you send it down from the rain-clouds? We could make it bitter (ujaj)', cluster: creation}
  fire-from-green-tree: {label: 'Have you seen the fire you kindle? Did you produce its tree? God made it a reminder and provision for desert travelers', cluster: creation}
  oath-by-positions-of-stars: {label: '''I swear by the positions (setting-places) of the stars, a mighty oath if you knew''', cluster: form}
  hidden-book-touched-only-by-purified: {label: A noble Quran in a hidden Book which none touch but the purified, cluster: revelation}
  soul-at-the-throat-cannot-be-returned: {label: 'When the soul reaches the throat at death and you look on, God is nearer than you; if you are not to be judged, bring it back!', cluster: eschatology}
  rest-fragrance-and-garden-for-those-brought-near: {label: 'For those brought near: rest (rawh), fragrance (rayhan) and a garden of bliss', cluster: paradise}
  hospitality-of-boiling-water: {label: The 'hospitality' (nuzul) of the deniers is boiling water and roasting in hell, cluster: hell}
  certain-truth: {label: '''This is the certain truth'' (haqq al-yaqin)', cluster: theology}
  all-in-heavens-and-earth-glorify-god: {label: 'Opening formula: whatever is in the heavens and the earth glorifies God (sabbaha / yusabbihu lillah)', cluster: form}
  first-last-outward-inward: {label: 'God is the First and the Last, the Outward (al-zahir) and the Inward (al-batin)', cluster: theology}
  creation-in-six-days-then-throne: {label: 'God created the heavens and earth in six days, then established himself on the Throne', cluster: creation}
  god-with-you-wherever-you-are: {label: 'God knows what enters and leaves the earth and what descends from and ascends to heaven, and he is with you wherever you are', cluster: theology}
  night-merged-into-day: {label: God makes the night enter into the day and the day into the night, cluster: cosmology}
  humans-as-stewards-of-wealth: {label: Spend of that over which God has made you stewards/successors (mustakhlafin), cluster: ethics}
  covenant-taken-from-believers: {label: God has taken your covenant (mithaq), cluster: covenant}
  out-of-darkness-into-light: {label: God sends down signs to bring people out of the darknesses into the light, cluster: theology}
  earlier-spenders-higher-rank: {label: Those who spent and fought before the Victory are higher in rank than those who did so after, cluster: law}
  goodly-loan-to-god-doubled: {label: 'Who will lend God a goodly loan (qard hasan), that he may multiply it for him?', cluster: ethics}
  believers-light-runs-before-them: {label: On the day believers' light runs before them and on their right hands, cluster: eschatology}
  hypocrites-beg-to-borrow-light: {label: 'The hypocrites beg the believers ''Wait for us, that we may borrow some of your light'' and are told ''Go back and seek light''', cluster: eschatology}
  wall-with-gate-mercy-within-torment-without: {label: 'A wall with a gate is set between them: inside it mercy, outside it, facing, the punishment', cluster: eschatology}
  no-ransom-accepted-on-judgment-day: {label: On that day no ransom (fidya) is accepted from hypocrites or unbelievers, cluster: eschatology}
  hearts-hardened-over-long-time-people-of-book: {label: 'Believers must not be like those given the Book before, whose term grew long and whose hearts hardened', cluster: polemic}
  worldly-life-like-rain-grown-plants-wither: {label: 'Worldly life is play, adornment, boasting and rivalry in wealth and children, like rain whose growth pleases the sowers, then withers yellow and becomes chaff', cluster: wisdom}
  garden-wide-as-heavens-and-earth: {label: Race to forgiveness and a Garden whose breadth is as the breadth of heaven and earth, cluster: paradise}
  every-calamity-written-before-creation: {label: No calamity befalls the earth or yourselves but it is in a Book before God brings it into being, cluster: theology}
  do-not-grieve-loss-nor-exult-gain: {label: So that you do not grieve over what escapes you nor exult over what he gives you, cluster: wisdom}
  iron-sent-down: {label: 'God sent down iron, with mighty force and benefits for people', cluster: creation}
  prophecy-and-book-in-seed-of-noah-and-abraham: {label: God placed prophecy and the Book among the descendants of Noah and Abraham, cluster: prophecy}
  jesus-given-the-gospel: {label: God gave Jesus son of Mary the Gospel (al-Injil), cluster: christology}
  followers-of-jesus-compassion-and-mercy: {label: God put compassion and mercy in the hearts of those who followed Jesus, cluster: christology}
  monasticism-invented-not-prescribed: {label: 'Monasticism (rahbaniyya) they invented; God did not prescribe it, only seeking God''s pleasure, and they did not observe it rightly', cluster: christology}
  double-portion-of-mercy-for-believers: {label: Believers in the messenger receive a double portion (kiflayn) of God's mercy and a light to walk by, cluster: theology}
  bounty-not-monopoly-of-people-of-book: {label: The People of the Book should know they have no power over God's bounty; bounty is in God's hand for whom he wills, cluster: polemic}
  woman-who-disputes-with-prophet-heard: {label: 'God has heard the woman who argued with the prophet about her husband and complained to God (Khawla, ''she who disputes'')', cluster: law}
  zihar-repudiation-wife-as-mothers-back: {label: 'Zihar: a husband declaring his wife ''like my mother''s back''; she is not his mother, the saying is false and abhorrent', cluster: law}
  zihar-expiation-slave-fast-or-feeding: {label: 'Expiation for zihar before touching again: free a slave, or fast two consecutive months, or feed sixty poor', cluster: law}
  god-fourth-of-three-sixth-of-five: {label: 'There is no secret conversation of three but God is the fourth, nor of five but he is the sixth, wherever they are', cluster: theology}
  secret-counsels-of-sin-forbidden: {label: 'Secret counsels (najwa) for sin, aggression and disobedience are of Satan; confer rather in piety', cluster: ethics}
  greeting-the-prophet-with-a-false-greeting: {label: They greet the prophet with a greeting with which God did not greet him (al-sam for al-salam), cluster: polemic}
  make-room-in-assemblies: {label: 'When told to make room in assemblies, make room, and God will make room for you; rise when told to rise', cluster: ethics}
  charity-before-private-audience-with-prophet: {label: Before a private consultation with the prophet give charity (sadaqa); the rule is then relaxed, cluster: law}
  oaths-used-as-shield: {label: The hypocrites take their oaths as a shield (junna) and will swear falsely even to God at the resurrection, cluster: polemic}
  party-of-satan-and-party-of-god: {label: The party of Satan (hizb al-shaytan) are the losers; the party of God (hizb Allah) are the successful, cluster: theology}
  god-and-messengers-will-prevail: {label: 'God has written: ''I will surely prevail, I and my messengers''', cluster: theology}
  no-love-for-enemies-of-god-even-kin: {label: 'Believers do not love those who oppose God, even fathers, sons, brothers or clan; God writes faith on their hearts and supports them with a spirit', cluster: ethics}
  god-pleased-with-them-and-they-with-him: {label: God is well pleased with them and they with him (radiya llahu 'anhum wa-radu 'anhu), cluster: paradise}
  first-gathering-expulsion-of-nadir: {label: God expelled the unbelieving People of the Book (the Banu Nadir) from their homes at 'the first gathering' (li-awwal al-hashr), cluster: history}
  fortresses-cannot-protect-terror-cast-in-hearts: {label: 'They thought their fortresses would protect them from God, but God came from where they did not expect and cast terror into their hearts', cluster: warfare}
  destroying-own-houses-with-own-hands: {label: The expelled demolish their houses with their own hands and the hands of the believers, cluster: warfare}
  exile-decreed-instead-of-punishment: {label: 'Had God not decreed exile (jala'') for them, he would have punished them in this world', cluster: history}
  palm-trees-cut-by-gods-leave: {label: Whatever palm trees (lina) you cut down or left standing on their roots was by God's leave, cluster: warfare}
  fay-booty-without-fighting-for-prophet-kin-poor: {label: 'Fay'' (booty gained without cavalry or camels) goes to God, the messenger, kin, orphans, the poor and the wayfarer, so wealth does not circulate only among the rich', cluster: law}
  muhajirun-and-ansar-preference: {label: The poor emigrants and the hosts who prefer others over themselves even in need; whoever is saved from his own greed succeeds, cluster: ethics}
  prayer-against-rancor-for-earlier-believers: {label: 'Later believers pray: forgive us and our brethren who preceded us in faith, and put no rancor in our hearts', cluster: prayer}
  hypocrites-false-promises-to-allies: {label: 'Hypocrites promise their unbelieving allies to leave or fight with them, but will not', cluster: polemic}
  enemy-fights-only-from-fortified-towns-hearts-divided: {label: They fight only from fortified towns or behind walls; you think them united but their hearts are divided, cluster: warfare}
  satan-says-disbelieve-then-disowns: {label: 'Like Satan who says to man ''Disbelieve!'' and when he disbelieves says ''I am quit of you, I fear God''', cluster: demonology}
  look-to-what-you-sent-ahead-for-tomorrow: {label: Let every soul look to what it has sent ahead for tomorrow, cluster: eschatology}
  forgot-god-so-forgot-themselves: {label: 'Those who forgot God, so he made them forget themselves', cluster: theology}
  quran-on-mountain-would-crumble: {label: Had this Quran been sent down on a mountain you would see it humbled and split asunder for fear of God, cluster: revelation}
  litany-of-beautiful-names: {label: 'Litany of divine names: King, Holy, Peace, Faithful, Guardian, Mighty, Compeller, Proud, Creator, Maker, Fashioner; to him belong the most beautiful names', cluster: theology}
  do-not-befriend-enemies-of-god: {label: 'Believers must not take God''s enemies, who expelled the prophet, as allies (awliya'') or secretly show them affection', cluster: polemic}
  kinship-of-no-avail-at-judgment: {label: Neither your blood-ties nor your children will benefit you on the Day of Resurrection, cluster: eschatology}
  abraham-as-excellent-example-disowning-people: {label: 'Abraham and those with him are an excellent example: they declared themselves quit of their people and their gods, with enmity until they believe', cluster: patriarchs}
  abraham-promises-forgiveness-for-father: {label: 'Except Abraham''s saying to his father ''I will ask forgiveness for you, though I have no power for you before God''', cluster: patriarchs}
  kindness-to-non-hostile-unbelievers: {label: God does not forbid kindness and justice toward those who did not fight you over religion or expel you, cluster: law}
  test-of-emigrant-women: {label: 'Believing women who emigrate are to be examined; if believers, they are not returned to the unbelievers, whose dowries are repaid', cluster: law}
  marriage-bonds-with-unbelieving-wives-dissolved: {label: Do not hold on to marriage ties with unbelieving women; dowries are reckoned between the communities, cluster: law}
  womens-pledge-of-allegiance: {label: 'The women''s pledge (bay''at al-nisa''): not to associate anything with God, steal, commit adultery, kill their children, bring a fabricated slander, or disobey in what is right', cluster: law}
  infanticide-forbidden: {label: Prohibition of killing one's children, cluster: law}
  despair-like-unbelievers-of-the-buried: {label: They despair of the hereafter as the unbelievers despair of those in the graves, cluster: eschatology}
  why-say-what-you-do-not-do: {label: '''Why do you say what you do not do? Most hateful to God is saying what you do not do''', cluster: ethics}
  fighters-in-ranks-like-solid-building: {label: God loves those who fight in his way in ranks as though they were a solid structure (bunyan marsus), cluster: warfare}
  moses-asks-why-do-you-hurt-me: {label: 'Moses asks his people: ''Why do you hurt me when you know I am God''s messenger to you?''; when they swerved God made their hearts swerve', cluster: exodus}
  jesus-announces-messenger-named-ahmad: {label: Jesus son of Mary confirms the Torah and announces a messenger to come after him named Ahmad, cluster: christology}
  extinguish-gods-light-with-mouths: {label: 'They want to extinguish God''s light with their mouths, but God will perfect his light', cluster: polemic}
  faith-and-striving-as-saving-trade: {label: 'A trade (tijara) that saves from punishment: believe and strive in God''s way with wealth and selves', cluster: ethics}
  gardens-of-eden-dwellings: {label: Goodly dwellings in the Gardens of Eden ('Adn), cluster: paradise}
  helpers-of-god-disciples-of-jesus: {label: 'Jesus asked the disciples (hawariyyun) ''Who are my helpers toward God?'' and they said ''We are God''s helpers''; a party of Israel believed, a party disbelieved', cluster: christology}
  messenger-among-the-unlettered: {label: 'God raised among the unlettered (ummiyyun, Gentiles) a messenger from among them, reciting signs, purifying them and teaching the Book and wisdom', cluster: prophecy}
  donkey-carrying-books: {label: Those charged with the Torah who did not carry it are like a donkey carrying books (asfar), cluster: polemic}
  if-friends-of-god-wish-for-death: {label: 'Challenge to the Jews: if you claim to be God''s friends apart from others, wish for death, if you are truthful; they never will', cluster: polemic}
  death-you-flee-will-meet-you: {label: The death you flee from will surely meet you, cluster: wisdom}
  friday-prayer-leave-trade: {label: 'When the call to prayer is made on Friday (yawm al-jumu''a), hasten to God''s remembrance and leave trading; after the prayer disperse and seek God''s bounty', cluster: ritual}
  congregation-leaves-preacher-for-caravan: {label: When they saw trade or amusement they rushed to it and left the prophet standing, cluster: history}
  hypocrites-testify-falsely-to-prophethood: {label: 'The hypocrites testify ''You are God''s messenger''; God knows he is, and testifies that the hypocrites are liars', cluster: polemic}
  hypocrites-like-propped-up-timbers: {label: 'The hypocrites'' bodies impress and their speech is heard, but they are like propped-up timbers, thinking every cry is against them', cluster: polemic}
  forgiveness-asked-or-not-same-for-hypocrites: {label: It is the same whether the prophet asks forgiveness for the hypocrites or not; God will not forgive them, cluster: polemic}
  mightier-will-expel-the-meaner: {label: 'The hypocrites say ''When we return to Medina the mightier will expel the meaner from it''; but might belongs to God, his messenger and the believers', cluster: history}
  wealth-and-children-distract-from-remembrance: {label: Let not your wealth and children divert you from God's remembrance, cluster: ethics}
  dying-man-begs-for-delay-to-give-charity: {label: 'Spend before death comes and one says ''My Lord, if only you would delay me a little, I would give charity''; God delays no soul when its term comes', cluster: eschatology}
  some-created-unbelievers-some-believers: {label: 'God created you, and among you are unbelievers and believers', cluster: theology}
  god-formed-you-and-made-your-forms-beautiful: {label: God shaped you and made your forms good (sawwarakum fa-ahsana suwarakum), cluster: creation}
  shall-mere-humans-guide-us: {label: 'Unbelievers rejected their messengers saying ''Shall mere humans guide us?''', cluster: polemic}
  day-of-mutual-loss-taghabun: {label: The Day of Gathering is the Day of Mutual Dispossession / Loss and Gain (yawm al-taghabun), cluster: eschatology}
  no-calamity-but-by-gods-leave: {label: 'No calamity strikes except by God''s leave; whoever believes, God guides his heart', cluster: theology}
  enemies-among-wives-and-children: {label: 'Among your spouses and children are enemies to you, so beware of them; yet if you pardon and forgive, God is forgiving', cluster: ethics}
  wealth-and-children-are-a-trial: {label: Your wealth and your children are only a trial (fitna), cluster: ethics}
  fear-god-as-much-as-you-can: {label: Fear God as much as you are able (ma stata'tum), cluster: law}
  divorce-at-waiting-period-idda: {label: 'Divorce women at (the start of) their waiting period (''idda), count it, and do not expel them from their homes during it unless for flagrant indecency', cluster: law}
  retain-or-part-honorably-with-two-witnesses: {label: 'At the end of the term, retain or part with them honorably, and call two just witnesses', cluster: law}
  waiting-period-three-months-or-until-birth: {label: 'Waiting period of three months for women past menses or not yet menstruating; for the pregnant, until delivery', cluster: law}
  divorcee-housed-and-paid-for-nursing: {label: 'House divorced wives as you live, support them while pregnant, and pay them if they nurse your child; otherwise another woman may nurse', cluster: law}
  no-soul-burdened-beyond-capacity: {label: God burdens no soul beyond what he has given it; after hardship he will bring ease, cluster: law}
  seven-heavens-and-seven-earths: {label: 'God created seven heavens and of the earth the like of them, the command descending between them', cluster: cosmology}
  prophet-forbids-himself-what-god-allowed: {label: '''O Prophet, why do you forbid what God made lawful for you, seeking to please your wives?''; God has ordained the dissolution of oaths', cluster: law}
  wife-divulges-prophets-secret: {label: 'The prophet confided a secret to one of his wives; she divulged it, and God informed him', cluster: history}
  gabriel-as-protector-of-prophet: {label: 'If two wives back each other against him, God is his protector, and Gabriel, the righteous believers and the angels', cluster: angels}
  better-wives-threat: {label: 'If he divorced them, God might give him in exchange better wives: submitting, believing, devout, repentant, worshipping, fasting/wandering (sa''ihat), previously married and virgins', cluster: law}
  fire-fueled-by-people-and-stones-with-stern-angels: {label: 'A Fire whose fuel is people and stones, over which are harsh, stern angels who never disobey God', cluster: hell}
  sincere-repentance: {label: Turn to God in sincere repentance (tawba nasuh), cluster: theology}
  prayer-perfect-our-light: {label: 'The believers pray on the day: ''Our Lord, perfect our light for us and forgive us''', cluster: eschatology}
  wives-of-noah-and-lot-betrayed: {label: 'The wives of Noah and Lot, married to righteous servants, betrayed them and are told to enter the Fire', cluster: patriarchs}
  pharaohs-wife-prays-for-house-in-paradise: {label: 'Pharaoh''s wife prays ''My Lord, build me a house with you in the Garden and save me from Pharaoh and his deeds''', cluster: exodus}
  mary-daughter-of-imran-guarded-chastity: {label: 'Mary, daughter of ''Imran, guarded her chastity; God breathed into it of his spirit, and she believed the words of her Lord and his books', cluster: christology}
  blessed-is-he-in-whose-hand-is-dominion: {label: '''Blessed is he in whose hand is the dominion (al-mulk)''', cluster: form}
  death-and-life-created-to-test: {label: God created death and life to test which of you is best in deeds, cluster: theology}
  seven-heavens-in-layers-without-flaw: {label: 'God created seven heavens in layers (tibaqan); look again and again, you will see no flaw or rift; your sight returns dazzled and weary', cluster: cosmology}
  stars-as-lamps-and-missiles-against-devils: {label: God adorned the lowest heaven with lamps and made them missiles (rujum) against the devils, cluster: cosmology}
  hell-roars-and-nearly-bursts-with-rage: {label: 'When the damned are cast in they hear hell gasping/roaring as it boils, nearly bursting with rage', cluster: hell}
  keepers-of-hell-ask-did-no-warner-come: {label: 'As each group is thrown in, the keepers of hell ask ''Did no warner come to you?'' and they admit it did', cluster: hell}
  had-we-listened-or-reasoned: {label: 'The damned say: ''Had we listened or reasoned, we would not be among the companions of the Blaze''', cluster: hell}
  does-the-creator-not-know: {label: '''Does he who created not know?'' He is the Subtle, the Aware', cluster: theology}
  earth-made-tractable: {label: 'God made the earth tractable (dhalul) for you: walk its shoulders and eat of his provision', cluster: creation}
  he-who-is-in-heaven-could-make-earth-swallow: {label: 'Are you secure from him who is in heaven, that he will not make the earth swallow you as it quakes, or send a stone-storm?', cluster: theology}
  birds-held-aloft-by-the-merciful: {label: 'The birds above them spreading and folding their wings: none holds them up but the Merciful', cluster: nature}
  walking-prone-on-face-vs-upright: {label: 'Is one who walks prone on his face better guided than one who walks upright on a straight path?', cluster: parable}
  water-sinking-into-earth-who-will-bring-it: {label: 'If your water were to sink deep into the earth, who would bring you flowing water?', cluster: nature}
  oath-by-the-pen-and-what-they-write: {label: Oath 'Nun. By the pen and what they inscribe', cluster: form}
  prophet-of-great-character: {label: The prophet is not mad; he has an unfailing reward and is of a great moral character (khuluq 'azim), cluster: prophecy}
  opponents-want-prophet-to-compromise: {label: The deniers wish the prophet would compromise (tudhin) so they would compromise, cluster: polemic}
  vice-list-of-swearer-slanderer-ignoble-bastard: {label: 'Do not obey every contemptible swearer, backbiter going about with slander, hinderer of good, coarse and moreover ''zanim'' (base-born, ignoble)', cluster: ethics}
  branded-on-the-snout: {label: 'God threatens: ''We shall brand him on the snout (khurtum)''', cluster: eschatology}
  garden-owners-swear-to-harvest-without-exception: {label: The owners of a garden swore to harvest it in the morning without making exception ('if God wills'), cluster: parable}
  garden-blasted-overnight-while-they-slept: {label: 'A visitation from God went round the garden while they slept, and by morning it was like a harvested/blackened field', cluster: parable}
  owners-whisper-no-poor-man-shall-enter: {label: The owners set out whispering that no poor man (miskin) should enter the garden that day, cluster: parable}
  middle-brother-rebukes-and-owners-repent: {label: 'The most moderate of them (awsatuhum) said ''Did I not tell you to glorify God?''; they blame one another, repent and hope for a better garden', cluster: parable}
  shin-laid-bare-and-call-to-prostrate: {label: On the day when the shin is laid bare (yukshafu 'an saq) and they are called to prostrate but cannot, cluster: eschatology}
  god-leads-deniers-on-step-by-step: {label: 'God leads the deniers on step by step (istidraj) from where they do not know, and grants them respite; his plan is firm', cluster: theology}
  companion-of-the-fish-called-out-in-distress: {label: 'Do not be like the companion of the fish (sahib al-hut, Jonah) who cried out while choking with grief', cluster: prophecy}
  jonah-cast-on-barren-shore-but-chosen: {label: Had not grace from his Lord reached him he would have been cast onto the barren shore blameworthy; but his Lord chose him and made him righteous, cluster: prophecy}
  unbelievers-nearly-trip-him-with-their-eyes: {label: The unbelievers almost make the prophet slip with their (evil) eyes when they hear the reminder, cluster: magic}
  the-reality-what-is-the-reality: {label: 'Rhetorical opening: ''The Reality (al-haqqa)! What is the Reality? And what will make you know what the Reality is?''', cluster: form}
  thamud-destroyed-by-the-overwhelming: {label: 'Thamud were destroyed by the Overwhelming (al-tagiya, the Blast)', cluster: arabian-prophets}
  ad-wind-seven-nights-eight-days: {label: '''Ad were destroyed by a furious wind for seven nights and eight days, lying felled like hollow palm trunks', cluster: arabian-prophets}
  carried-in-the-running-ship: {label: When the water overflowed God carried 'you' in the running ship (al-jariya) as a reminder for retaining ears, cluster: flood}
  single-trumpet-blast-earth-and-mountains-crushed: {label: 'At a single blast on the trumpet, the earth and mountains are lifted and crushed with a single crushing', cluster: eschatology}
  sky-split-frail-angels-on-its-edges: {label: 'The sky splits and is frail that day, and the angels are on its borders', cluster: eschatology}
  eight-bear-the-throne: {label: That day eight (angels) bear the Throne of your Lord above them, cluster: angels}
  book-given-in-right-hand-read-my-book: {label: 'Whoever is given his book in his right hand says ''Here, read my book!'' and lives a pleasing life in a lofty garden with fruit clusters near', cluster: eschatology}
  book-given-in-left-hand-wishes-death-final: {label: Whoever is given his book in his left hand wishes he had never been given it and that death had been final; his wealth and power are gone, cluster: eschatology}
  seized-fettered-chain-of-seventy-cubits: {label: '''Seize him, fetter him, roast him in hellfire, then thread him on a chain seventy cubits long''', cluster: hell}
  did-not-urge-feeding-the-poor: {label: He did not believe in God the Great and did not urge the feeding of the poor, cluster: ethics}
  food-of-ghislin-pus: {label: The damned have no friend and no food except ghislin (foul washings/pus), cluster: hell}
  oath-by-what-you-see-and-do-not-see: {label: '''I swear by what you see and what you do not see''', cluster: form}
  word-of-noble-messenger-not-poet-or-soothsayer: {label: 'It is the word of a noble messenger, not the word of a poet or soothsayer', cluster: polemic}
  forger-would-have-aorta-cut: {label: 'Had he fabricated sayings against God, God would have seized him by the right hand and cut his aorta (watin)', cluster: prophecy}
units:
- id: quran-42-shura-revelation-one-religion
  tradition: islam
  title: 'Ha-Mim ''Ayn-Sin-Qaf: revelation, the angels'' intercession and the one religion of the prophets'
  corpus: quran
  original: true
  tagger: Claude (model), reading the Arabic
  read: ['42:1-24']
  tags:
  - {motif: disconnected-letters-opening, refs: ['42:1', '42:2'], note: 'double set: Ha-Mim / ''Ayn-Sin-Qaf, uniquely split over two verses'}
  - {motif: heavens-nearly-burst-apart, refs: ['42:5']}
  - {motif: angels-ask-forgiveness-for-earth-dwellers, refs: ['42:5']}
  - {motif: arabic-recitation-revealed, refs: ['42:7']}
  - {motif: mother-of-towns-warned, refs: ['42:7']}
  - {motif: day-of-gathering, refs: ['42:7']}
  - {motif: if-god-willed-one-community, refs: ['42:8']}
  - {motif: judgment-belongs-to-god, refs: ['42:10'], note: 'whatever you differ over, its judgment is God''s'}
  - {motif: male-and-female-created-together, refs: ['42:11'], note: mates made for humans and for cattle from themselves}
  - {motif: nothing-is-like-god, refs: ['42:11']}
  - {motif: keys-of-heavens-and-earth, refs: ['42:12']}
  - {motif: god-expands-and-restricts-provision, refs: ['42:12']}
  - {motif: one-religion-of-all-prophets, refs: ['42:13']}
  - {motif: divided-after-knowledge-out-of-envy, refs: ['42:14']}
  - {motif: book-and-balance-sent-down, refs: ['42:17']}
