# Full read of the Quran, chunk 1: surahs 1-3 (493 verses). Read from the Quranic Arabic Corpus (Uthmani).
new_motifs:
  # form and liturgy
  basmala-formula: {label: "Text or act opened with the formula 'In the name of God, the Merciful, the Compassionate'", cluster: form}
  divine-names-rahman-rahim: {label: "God called al-Rahman and al-Rahim (the Merciful, the Compassionate), paired names from the root r-h-m (womb, mercy)", cluster: theology}
  praise-to-lord-of-worlds: {label: "Praise (hamd) belongs to God, Lord of the worlds (rabb al-alamin)", cluster: liturgy}
  master-of-day-of-judgment: {label: "God is king or master of the Day of Judgment (yawm al-din)", cluster: eschatology}
  you-alone-we-worship: {label: "Communal confession 'You alone we worship, you alone we ask for help'", cluster: liturgy}
  prayer-for-straight-path: {label: "Prayer to be guided on the straight path (al-sirat al-mustaqim)", cluster: liturgy}
  path-of-blessed-not-wrath-not-astray: {label: "Three ways contrasted: those God favored, those under wrath, and those gone astray", cluster: theology}
  disconnected-letters-opening: {label: "A surah opens with isolated letters (huruf muqatta'at) of unexplained meaning, e.g. alif-lam-mim", cluster: form}
  book-without-doubt: {label: "The scripture announces itself as 'the Book' in which there is no doubt, guidance for the God-fearing", cluster: revelation}
  belief-in-the-unseen: {label: "The faithful defined as those who believe in the unseen (al-ghayb)", cluster: theology}
  god-seals-hearts-ears-eyes: {label: "God sets a seal on the unbelievers' hearts and hearing and a covering over their eyes", cluster: theology}
  hypocrites-two-faced: {label: "Hypocrites profess faith before believers and tell their own 'devils' in private they were only mocking", cluster: polemic}
  parable-of-kindled-fire-extinguished: {label: "Parable: one kindles a fire, and when it lights his surroundings God takes away the light, leaving him in darkness", cluster: parable}
  parable-of-storm-fingers-in-ears: {label: "Parable: travelers in a rainstorm of darkness, thunder and lightning put fingers in their ears for fear of death", cluster: parable}
  deaf-dumb-blind-refrain: {label: "Unbelievers called 'deaf, dumb, blind' (summun bukmun umyun)", cluster: polemic}
  challenge-to-produce-a-surah: {label: "Inimitability challenge: produce a surah like it, calling on your own witnesses (tahaddi)", cluster: revelation}
  hellfire-fueled-by-men-and-stones: {label: "Hell's fire has men and stones as its fuel", cluster: eschatology}
  paradise-gardens-rivers-flow-beneath: {label: "Paradise as gardens beneath which rivers flow", cluster: paradise}
  paradise-fruit-seems-familiar: {label: "Fruits in paradise resemble those of earth: 'this is what we were given before'", cluster: paradise}
  purified-spouses-in-paradise: {label: "The blessed have purified spouses (azwaj mutahhara) in paradise", cluster: paradise}
  gnat-parable-defended: {label: "God is not ashamed to strike a parable of a gnat or something smaller", cluster: parable}
  two-deaths-two-lives: {label: "Humans were dead, given life, will die and be given life again (two deaths, two lives)", cluster: eschatology}
  seven-heavens: {label: "God fashions seven heavens", cluster: cosmology}
  # Adam and Iblis
  human-as-vicegerent-khalifa: {label: "God announces to the angels he will place a vicegerent (khalifa) on earth", cluster: creation}
  angels-object-to-human-creation: {label: "Angels object that the new human will corrupt the earth and shed blood while they praise God", cluster: creation}
  adam-taught-the-names: {label: "God teaches Adam all the names and he recites them to the angels, who cannot", cluster: creation}
  angels-commanded-to-bow-to-adam: {label: "Angels are commanded to prostrate before Adam", cluster: creation}
  iblis-refuses-to-bow: {label: "Iblis alone refuses to bow to Adam, out of pride", cluster: creation}
  adam-receives-words-of-repentance: {label: "Adam receives words from his Lord and God turns to him in forgiveness", cluster: paradise}
  descend-enemies-to-one-another: {label: "The expelled are told 'Go down, enemies to one another' with a dwelling and provision on earth for a time", cluster: paradise}
  no-fear-nor-grief-formula: {label: "Formula 'no fear shall be upon them, nor shall they grieve'", cluster: form}
  # Israel
  remember-my-favor-refrain: {label: "Refrain to the Children of Israel: 'remember my favor which I bestowed on you'", cluster: polemic}
  no-soul-avails-another-on-judgment-day: {label: "On that day no soul will avail another, no intercession or ransom accepted, no help given", cluster: eschatology}
  slain-israelites-revived: {label: "Israelites who demanded to see God are struck by a thunderbolt and then raised after their death", cluster: exodus}
  enter-gate-prostrate-say-hitta: {label: "Israel told to enter the town's gate prostrating and say 'hitta' (remission); the wrongdoers change the word", cluster: exodus}
  mountain-raised-over-israel: {label: "God raises the mountain (al-Tur) over Israel while taking their covenant", cluster: exodus}
  sabbath-breakers-turned-to-apes: {label: "Sabbath transgressors are turned into despised apes", cluster: law}
  cow-sacrifice-haggling: {label: "Moses commands a cow be slaughtered; the people repeatedly ask its age, color and nature before complying", cluster: law}
  yellow-cow: {label: "The sacrificial cow is bright yellow, pleasing to beholders", cluster: law}
  murdered-man-struck-with-part-of-cow-revives: {label: "A slain man is struck with part of the slaughtered cow and revived to reveal his killer", cluster: law}
  hearts-harder-than-stone-but-stones-gush: {label: "Hearts harder than stones, yet some stones gush rivers, split for water or fall down in fear of God", cluster: polemic}
  scripture-altered-tahrif: {label: "Accusation that some People of the Book distort (yuharrifuna) God's word after understanding it", cluster: polemic}
  writing-scripture-with-own-hands: {label: "Woe to those who write the book with their own hands and say it is from God, for a small price", cluster: polemic}
  hell-only-numbered-days-claim: {label: "Claim that the fire will touch them only for a few numbered days, rebutted", cluster: eschatology}
  we-hear-and-disobey: {label: "Israel at the mountain says 'we hear and we disobey' (sami'na wa-'asayna)", cluster: polemic}
  calf-drunk-into-hearts: {label: "The love of the calf was made to sink (be drunk) into their hearts", cluster: exodus}
  challenge-to-wish-for-death: {label: "If the next world is yours alone, wish for death: they never will", cluster: polemic}
  wish-to-live-thousand-years: {label: "Some wish to be granted a life of a thousand years", cluster: polemic}
  gabriel-brings-revelation-to-heart: {label: "Gabriel (Jibril) brings down the revelation upon the prophet's heart", cluster: revelation}
  enmity-to-gabriel-and-michael: {label: "Enmity to Gabriel and Michael (Mikal) equated with enmity to God", cluster: polemic}
  scripture-cast-behind-backs: {label: "People of the Book cast God's book behind their backs", cluster: polemic}
  devils-teach-sorcery-in-solomons-reign: {label: "Devils (shayatin) taught sorcery in Solomon's reign; Solomon himself did not disbelieve", cluster: solomon}
  harut-and-marut: {label: "Two angels in Babylon, Harut and Marut, teach magic while warning 'we are only a trial'", cluster: angels}
  magic-separates-husband-and-wife: {label: "Magic is learned that separates a man from his wife, harming only by God's leave", cluster: magic}
  raina-wordplay-forbidden: {label: "Believers told not to say 'ra'ina' (a word twisted by opponents) but 'unzurna'", cluster: polemic}
  abrogation-of-verses: {label: "God abrogates or causes to be forgotten a verse and brings a better or similar one (naskh)", cluster: revelation}
  paradise-only-for-jews-or-christians-claim: {label: "Claim that none enters paradise unless Jew or Christian, rebutted by surrender of the face to God", cluster: polemic}
  jews-and-christians-deny-each-other: {label: "Jews say the Christians stand on nothing, Christians say the same of the Jews", cluster: polemic}
  wherever-you-turn-face-of-god: {label: "East and west belong to God; wherever you turn, there is the face of God", cluster: theology}
  god-has-no-son: {label: "Denial that God has taken a son (walad)", cluster: christology}
  kun-fa-yakun: {label: "God creates by saying to a thing 'Be' and it is (kun fa-yakun)", cluster: creation}
  # Abraham and the Kaaba
  abraham-tested-with-words-made-imam: {label: "God tests Abraham with words, he fulfills them and is made an imam for mankind; the covenant excludes the wrongdoers among his seed", cluster: abraham}
  house-as-sanctuary-and-place-of-return: {label: "The House (Kaaba) made a place of return and security for mankind", cluster: cult}
  station-of-abraham: {label: "The Station of Abraham (maqam Ibrahim) at the House taken as a place of prayer", cluster: cult}
  abraham-ishmael-raise-foundations-of-house: {label: "Abraham and Ishmael raise the foundations of the House while praying", cluster: abraham}
  abraham-prays-for-secure-city: {label: "Abraham prays that the town be made secure and its people provided with fruits", cluster: abraham}
  abraham-prays-for-messenger-from-offspring: {label: "Abraham and Ishmael pray that a messenger be raised from among their offspring", cluster: abraham}
  abraham-submits-muslim: {label: "Abraham told 'Submit' answers 'I submit to the Lord of the worlds' (aslamtu)", cluster: abraham}
  jacob-deathbed-what-will-you-worship: {label: "Dying Jacob asks his sons 'What will you worship after me?' and they confess the God of their fathers", cluster: patriarchs}
  abraham-hanif-not-jew-or-christian: {label: "Abraham was a hanif, neither Jew nor Christian nor polytheist", cluster: polemic}
  no-distinction-between-prophets: {label: "Believers make no distinction between any of the prophets (Abraham, Ishmael, Isaac, Jacob, the Tribes, Moses, Jesus)", cluster: polemic}
  dye-of-god-sibgha: {label: "The 'dye' or baptism (sibgha) of God: who has a better dye than God?", cluster: polemic}
  each-generation-own-deeds: {label: "That was a community that has passed; it has what it earned and you what you earned", cluster: theology}
  # qibla
  change-of-qibla: {label: "The direction of prayer (qibla) is changed toward the Sacred Mosque; fools ask why", cluster: cult}
  prophet-face-turning-to-heaven: {label: "God sees the prophet turning his face toward heaven and grants him a qibla he is pleased with", cluster: cult}
  middle-community-witnesses: {label: "Believers made a middle community (umma wasat), witnesses over mankind, with the messenger a witness over them", cluster: theology}
  know-him-as-own-sons: {label: "The People of the Book recognize the truth as they recognize their own sons", cluster: polemic}
  race-in-good-deeds: {label: "To each a direction he faces: so race toward good deeds", cluster: theology}
  # patience, signs
  slain-in-gods-way-are-alive: {label: "Those slain in God's way are not dead but alive, provided for with their Lord", cluster: eschatology}
  to-god-we-belong-and-return: {label: "Formula of the afflicted: 'To God we belong and to him we return'", cluster: liturgy}
  safa-and-marwa: {label: "Safa and Marwa are among God's waymarks; circuit between them permitted on pilgrimage", cluster: cult}
  concealers-cursed-by-cursers: {label: "Those who conceal the revealed signs are cursed by God and by all who curse", cluster: polemic}
  signs-in-creation-catalogue: {label: "Catalogue of signs: heavens and earth, alternation of night and day, ships, rain reviving dead earth, beasts, winds, clouds", cluster: creation}
  rain-revives-dead-earth: {label: "Rain from the sky gives life to the earth after its death, a sign of resurrection", cluster: creation}
  leaders-disown-followers-in-hell: {label: "On seeing the punishment, those followed disown their followers, who wish for a return to disown them in turn", cluster: eschatology}
  following-ancestral-religion-rebuked: {label: "Refusal of revelation in favor of what was found with the fathers is rebuked", cluster: polemic}
  parable-of-shepherd-shouting-at-cattle: {label: "Unbelievers are like beasts shouted at by a herdsman, hearing only a call and a cry", cluster: parable}
  necessity-permits-forbidden-food: {label: "Forbidden food is permitted to one compelled by necessity, without desire or transgression", cluster: law}
  food-offered-to-other-than-god: {label: "Forbidden: what has been consecrated (invoked over) to other than God", cluster: law}
  concealers-eat-fire-in-bellies: {label: "Those who conceal scripture for gain eat only fire into their bellies", cluster: eschatology}
  righteousness-not-facing-east-or-west: {label: "Piety (birr) is not turning faces east or west but faith, giving wealth to kin, orphans, poor, travelers, beggars and captives", cluster: ethics}
  freeing-slaves-as-charity: {label: "Wealth given for (freeing) necks, i.e. ransoming slaves and captives", cluster: law}
  # law
  qisas-free-for-free-slave-for-slave: {label: "Retaliation (qisas) for the slain: free for free, slave for slave, female for female", cluster: law}
  blood-money-pardon-option: {label: "Kin of the slain may pardon and accept compensation (diya) instead of retaliation, a lightening from God", cluster: law}
  life-in-retaliation: {label: "'In retaliation there is life for you'", cluster: law}
  bequest-to-parents-and-kin: {label: "Bequest (wasiyya) to parents and kin prescribed for one who leaves wealth; altering it is a sin", cluster: law}
  fast-prescribed-as-for-predecessors: {label: "Fasting prescribed for you as it was prescribed for those before you", cluster: law}
  sick-and-traveler-exempt-from-fast: {label: "The sick and the traveler may make up missed fast days later", cluster: law}
  fidya-feeding-poor-for-fast: {label: "Those able only with hardship may ransom fast days by feeding a poor person (fidya)", cluster: law}
  ramadan-month-of-revelation: {label: "Ramadan, the month in which the Quran was sent down", cluster: revelation}
  fast-white-thread-black-thread: {label: "Eat and drink until the white thread is distinguished from the black thread at dawn", cluster: law}
  marital-relations-permitted-fast-nights: {label: "Marital relations permitted on fast nights; spouses are garments for one another", cluster: law}
  itikaf-retreat-in-mosque: {label: "Spouses not approached while in retreat (i'tikaf) in the mosques", cluster: cult}
  bounds-of-god-hudud: {label: "'These are the bounds (hudud) of God; do not approach (or transgress) them'", cluster: law}
  new-moons-as-time-markers: {label: "The new moons are time markers for people and for the pilgrimage", cluster: cult}
  enter-houses-by-doors-not-backs: {label: "Piety is not entering houses from their backs but from their doors", cluster: cult}
  fight-only-those-who-fight-you: {label: "Fight in God's way those who fight you, but do not transgress", cluster: war}
  persecution-worse-than-killing: {label: "Persecution (fitna) is worse than killing", cluster: war}
  no-fighting-at-sacred-mosque-unless-attacked: {label: "Do not fight at the Sacred Mosque unless they fight you there", cluster: war}
  sacred-month-for-sacred-month: {label: "The sacred month for the sacred month; violations are subject to retaliation", cluster: war}
  hajj-and-umra: {label: "Complete the pilgrimage (hajj) and visitation (umra) for God", cluster: cult}
  sacrificial-offering-reaches-its-place: {label: "Do not shave heads until the sacrificial offering (hady) reaches its place", cluster: cult}
  head-ailment-ransom-fast-alms-sacrifice: {label: "One with an ailment of the head pays ransom by fasting, alms or sacrifice", cluster: cult}
  three-plus-seven-days-fast: {label: "Who cannot find an offering fasts three days on pilgrimage and seven on return: ten complete", cluster: cult}
  pilgrimage-no-obscenity-quarrel: {label: "No sexual talk, wickedness or quarreling during the pilgrimage", cluster: cult}
  best-provision-is-piety: {label: "Take provision, but the best provision is God-consciousness (taqwa)", cluster: ethics}
  arafat-and-sacred-monument: {label: "When you pour down from Arafat, remember God at the Sacred Monument (al-Mash'ar al-Haram)", cluster: cult}
  remember-god-as-you-remember-fathers: {label: "Remember God as you remember your fathers, or more", cluster: cult}
  good-in-this-world-and-next-prayer: {label: "Prayer 'Our Lord, give us good in this world and good in the next, and guard us from the fire'", cluster: liturgy}
  counted-days-of-mina: {label: "Remember God on the counted days; no sin whether one hastens in two days or delays", cluster: cult}
  smooth-talker-corrupts-earth: {label: "A man whose speech pleases, who calls God to witness, but goes forth to destroy tillage and offspring", cluster: ethics}
  god-comes-in-shadows-of-clouds: {label: "Will they wait until God comes to them in canopies of cloud with the angels?", cluster: eschatology}
  mankind-one-community-then-prophets: {label: "Mankind was one community; God sent prophets as bearers of good news and warners with the Book", cluster: theology}
  when-is-gods-help: {label: "Messenger and believers, shaken, cry 'When is God's help?' Truly God's help is near", cluster: theology}
  fighting-prescribed-though-hateful: {label: "Fighting is prescribed though you hate it; you may hate what is good for you", cluster: war}
  apostates-deeds-void: {label: "Who turns from his religion and dies an unbeliever, his deeds are void in this world and the next", cluster: law}
  wine-and-gambling-sin-and-benefit: {label: "Wine and gambling: in both great sin and some benefit, but the sin is greater", cluster: law}
  give-the-surplus: {label: "What to spend? 'The surplus' (al-'afw)", cluster: ethics}
  orphans-as-brothers: {label: "Mixing with orphans' affairs permitted: they are your brothers", cluster: law}
  believing-slave-better-than-polytheist: {label: "A believing slave woman (or man) is better for marriage than an attractive polytheist", cluster: law}
  wives-as-tilth: {label: "Your wives are a tilth for you; come to your tilth as you wish", cluster: law}
  oath-of-abstention-four-months: {label: "Oath of abstention from wives (ila'): a four-month waiting period", cluster: law}
  divorce-waiting-three-periods: {label: "Divorced women wait three menstrual periods (quru') and may not conceal what is in their wombs", cluster: law}
  divorce-twice-then-final: {label: "Divorce is twice; then retain honorably or release with kindness", cluster: law}
  khul-wife-ransoms-herself: {label: "No blame if the wife ransoms herself (khul') when they fear not keeping God's bounds", cluster: law}
  remarriage-after-intervening-husband: {label: "After a third divorce she may not return to the first husband until she marries another", cluster: law}
  do-not-retain-wives-to-harm: {label: "Do not retain divorced wives to harm them", cluster: law}
  do-not-prevent-divorcee-remarrying: {label: "Do not prevent divorced women from remarrying their husbands when agreed", cluster: law}
  nursing-two-full-years: {label: "Mothers nurse their children two full years; weaning by mutual consultation; wet-nursing permitted", cluster: law}
  widow-waiting-four-months-ten-days: {label: "Widows wait four months and ten days ('idda) before remarriage", cluster: law}
  no-secret-betrothal-in-waiting: {label: "Proposal may be hinted during the waiting period but no secret promise or contract until it ends", cluster: law}
  half-dower-if-divorced-before-consummation: {label: "If divorced before consummation with dower fixed, half the dower is due", cluster: law}
  middle-prayer: {label: "Guard the prayers and the middle prayer (al-salat al-wusta)", cluster: cult}
  prayer-on-foot-or-riding-in-fear: {label: "In fear, pray on foot or riding", cluster: cult}
  widow-year-provision-bequest: {label: "Bequest of a year's provision to widows without expelling them", cluster: law}
  provision-for-divorcees: {label: "Divorced women are due a provision (mut'a) according to the husband's means", cluster: law}
  thousands-fled-death-died-revived: {label: "Thousands who left their homes fearing death are told by God 'Die' and then revived", cluster: resurrection}
  loan-to-god-multiplied: {label: "Who will lend God a goodly loan that he may multiply it many times?", cluster: ethics}
  # Talut
  ark-returns-with-sakina-and-relics: {label: "The ark (tabut) returns, carried by angels, containing tranquility (sakina) and relics left by the family of Moses and Aaron", cluster: kingship}
  king-chosen-for-knowledge-and-stature: {label: "God chose the king and increased him in knowledge and stature, though he lacked wealth", cluster: kingship}
  objection-king-lacks-wealth: {label: "The people object that the chosen king has no wealth and they have more right to kingship", cluster: kingship}
  river-test-of-army: {label: "Before battle the army is tested at a river: whoever drinks is not with the leader, except a handful scooped by hand", cluster: war}
  how-many-a-small-band-overcame-large: {label: "'How many a small band has overcome a large one by God's leave'", cluster: war}
  david-kills-jalut: {label: "David kills Jalut (Goliath) and is given kingship and wisdom", cluster: kingship}
  god-checks-people-by-people: {label: "Were it not for God checking people by means of others, the earth would be corrupted", cluster: theology}
  # throne verse
  prophets-ranked-some-above-others: {label: "God ranked some messengers above others; to some God spoke", cluster: prophecy}
  jesus-supported-by-holy-spirit: {label: "Jesus son of Mary given clear signs and supported with the holy spirit (ruh al-qudus)", cluster: christology}
  no-trade-friendship-intercession-on-that-day: {label: "A day comes with no trade, no friendship and no intercession", cluster: eschatology}
  ever-living-self-subsisting: {label: "God the Ever-Living, the Self-Subsisting (al-hayy al-qayyum)", cluster: theology}
  no-slumber-nor-sleep-seizes-god: {label: "Neither slumber nor sleep overtakes God", cluster: theology}
  kursi-encompasses-heavens-and-earth: {label: "God's footstool or seat (kursi) extends over the heavens and the earth", cluster: cosmology}
  intercession-only-by-gods-leave: {label: "None intercedes with God except by his permission", cluster: eschatology}
  no-compulsion-in-religion: {label: "No compulsion in religion", cluster: theology}
  firmest-handhold: {label: "Whoever rejects false gods (taghut) and believes in God grasps the firmest handhold that never breaks", cluster: theology}
  from-darkness-to-light: {label: "God brings believers out of darknesses into light; false gods lead others from light into darkness", cluster: theology}
  # Abraham and the king, the sleeper, the birds
  abraham-disputes-with-king-life-death: {label: "Abraham disputes with a king, who claims 'I give life and death'", cluster: abraham}
  sun-from-west-challenge: {label: "Abraham challenges the king: God brings the sun from the east, so bring it from the west; the king is confounded", cluster: abraham}
  man-dies-hundred-years-and-revived: {label: "A man passing a ruined town is made to die for a hundred years, then revived, thinking he slept a day or part of a day", cluster: resurrection}
  food-unspoiled-after-century: {label: "After a century the sleeper's food and drink have not spoiled", cluster: resurrection}
  donkey-bones-clothed-with-flesh: {label: "The sleeper is shown his donkey's bones assembled and clothed with flesh", cluster: resurrection}
  four-birds-cut-and-recalled: {label: "Abraham, asking to see how God revives the dead, takes four birds, places parts on each hill, calls them and they come flying", cluster: resurrection}
  # charity and usury
  parable-grain-seven-ears-hundred-grains: {label: "Spending in God's way is like a grain sprouting seven ears with a hundred grains each", cluster: parable}
  charity-voided-by-reproach: {label: "Charity voided by reminders of generosity and injury, like dust on a rock washed bare by rain", cluster: ethics}
  parable-garden-on-hill-rain-or-dew: {label: "Spending for God's pleasure is like a garden on a height that yields double with heavy rain or even with dew", cluster: parable}
  parable-garden-burnt-by-fiery-whirlwind: {label: "An old man with weak children loses his garden of palms and vines to a fiery whirlwind", cluster: parable}
  satan-promises-poverty: {label: "Satan threatens you with poverty and commands indecency", cluster: theology}
  wisdom-given-to-whom-god-wills: {label: "God gives wisdom to whom he wills; whoever is given wisdom is given much good", cluster: wisdom}
  secret-charity-better: {label: "Giving charity openly is good, but giving it secretly to the poor is better and expiates sins", cluster: ethics}
  poor-who-do-not-beg-importunately: {label: "Deserving poor, restrained in God's way, thought rich by the ignorant for their restraint, known by their mark", cluster: ethics}
  usurers-rise-like-satan-touched: {label: "Those who consume usury rise like one driven mad by Satan's touch", cluster: law}
  trade-permitted-usury-forbidden: {label: "Trade is like usury, they say; but God permitted trade and forbade usury (riba)", cluster: law}
  god-blots-out-usury-grows-alms: {label: "God blots out usury and makes charity grow", cluster: law}
  war-from-god-on-usurers: {label: "Those who do not give up usury are warned of war from God and his messenger; they keep their principal", cluster: law}
  respite-for-debtor-in-hardship: {label: "A debtor in hardship is given respite until ease; remitting it as charity is better", cluster: law}
  debt-written-by-scribe: {label: "A debt for a fixed term must be written by a just scribe, dictated by the debtor or his guardian", cluster: law}
  two-women-witnesses-for-one-man: {label: "Two male witnesses, or one man and two women so that if one errs the other reminds her", cluster: law}
  pledge-in-hand-when-no-scribe: {label: "On a journey without a scribe a pledge in hand (rihan maqbuda) is taken", cluster: law}
  no-soul-burdened-beyond-capacity: {label: "God burdens no soul beyond its capacity", cluster: theology}
  heavy-burden-of-predecessors: {label: "Prayer not to be laid with a burden (isr) like that laid on those before us", cluster: liturgy}
  we-hear-and-obey: {label: "Believers' confession 'we hear and we obey' (sami'na wa-ata'na)", cluster: liturgy}
  # surah 3
  torah-and-gospel-sent-down: {label: "God sent down the Torah (al-Tawrat) and the Gospel (al-Injil) before as guidance", cluster: revelation}
  god-shapes-in-wombs: {label: "God shapes you in the wombs as he wills", cluster: creation}
  clear-and-ambiguous-verses: {label: "Scripture has decisive verses (muhkamat), the mother of the book, and ambiguous ones (mutashabihat) whose interpretation God knows", cluster: revelation}
  two-armies-one-sees-other-double: {label: "Sign in two hosts that met: one saw the other as twice their number", cluster: war}
  worldly-lusts-catalogue: {label: "Made attractive to men: women, sons, heaped-up gold and silver, branded horses, cattle and tillage", cluster: ethics}
  seekers-of-forgiveness-before-dawn: {label: "The righteous seek forgiveness before dawn (bil-ashar)", cluster: liturgy}
  god-angels-and-learned-witness-unity: {label: "God bears witness there is no god but he, and so do the angels and those of knowledge", cluster: theology}
  religion-with-god-is-islam: {label: "The religion with God is Islam (submission)", cluster: theology}
  killers-of-those-who-enjoin-justice: {label: "Those who kill prophets and those who enjoin justice are warned of punishment", cluster: polemic}
  owner-of-sovereignty-gives-and-takes: {label: "O God, owner of sovereignty, you give it to whom you will and take it from whom you will; you exalt and abase", cluster: kingship}
  night-into-day-living-from-dead: {label: "God makes night enter day and day night, brings the living from the dead and the dead from the living", cluster: creation}
  provision-without-reckoning: {label: "God provides for whom he wills without reckoning (bi-ghayri hisab)", cluster: theology}
  dissimulation-taqiyya: {label: "Believers may not take unbelievers as allies, unless guarding against them (tuqat)", cluster: law}
  god-warns-of-himself: {label: "God warns you of himself (yuhadhdhirukum allahu nafsahu)", cluster: theology}
  deeds-present-on-judgment-day: {label: "On the day each soul finds what good and evil it did present before it, wishing a far distance from its evil", cluster: eschatology}
  chosen-lineage-adam-noah-abraham-imran: {label: "God chose Adam, Noah, the family of Abraham and the family of Imran over the worlds", cluster: genealogy}
  newborn-girl-instead-of-hoped-son: {label: "Mother who vowed her unborn child finds she has borne a girl: 'the male is not like the female'", cluster: infancy}
  mother-names-child-and-seeks-refuge-from-satan: {label: "Mother names her daughter Mary and commits her and her offspring to God's protection from the accursed Satan", cluster: infancy}
  zechariah-guardian-of-mary: {label: "Zechariah is made Mary's guardian", cluster: infancy}
  zechariah-prays-for-offspring: {label: "Seeing Mary's provision, Zechariah prays for good offspring", cluster: infancy}
  angels-announce-john-while-praying: {label: "Angels call to Zechariah while he stands praying in the sanctuary, announcing John (Yahya)", cluster: infancy}
  john-chaste-hasur: {label: "John (Yahya) foretold as noble, chaste (hasur) and a prophet, confirming a word from God", cluster: infancy}
  three-days-silence-sign: {label: "Sign given to the doubting father: he will not speak to people for three days except by gestures", cluster: infancy}
  mary-chosen-above-women-of-worlds: {label: "Angels tell Mary that God chose and purified her above the women of the worlds", cluster: infancy}
  jesus-word-from-god: {label: "Jesus announced as a word (kalima) from God, named the Messiah, Jesus son of Mary", cluster: christology}
  jesus-speaks-in-cradle-and-maturity: {label: "Jesus will speak to people in the cradle and in maturity", cluster: christology}
  virgin-asks-how-untouched: {label: "Mary asks how she will have a child when no man has touched her", cluster: infancy}
  jesus-heals-blind-leper-raises-dead: {label: "Jesus heals the born-blind and the leper and raises the dead by God's leave", cluster: christology}
  jesus-tells-what-they-store-in-houses: {label: "Jesus tells people what they eat and store in their houses", cluster: christology}
  jesus-makes-lawful-some-forbidden: {label: "Jesus comes confirming the Torah and making lawful some of what was forbidden", cluster: christology}
  disciples-helpers-of-god: {label: "Jesus asks 'Who are my helpers to God?' and the disciples (hawariyyun) answer 'We are God's helpers'", cluster: christology}
  god-best-of-plotters: {label: "They plotted, and God plotted; God is the best of plotters", cluster: theology}
  jesus-taken-up-to-god: {label: "God says to Jesus 'I will take you (mutawaffika) and raise you to myself and purify you'", cluster: christology}
  jesus-like-adam-from-dust: {label: "The likeness of Jesus with God is as Adam, created from dust by 'Be'", cluster: christology}
  mubahala-mutual-curse: {label: "Challenge to mutual imprecation (mubahala): gather sons, women and selves and invoke God's curse on the liars", cluster: polemic}
  common-word-with-people-of-book: {label: "Call to the People of the Book to a common word: worship none but God and take none as lords besides him", cluster: polemic}
  torah-gospel-after-abraham: {label: "Argument: Torah and Gospel were revealed only after Abraham, so he cannot be Jew or Christian", cluster: polemic}
  believe-morning-disbelieve-evening: {label: "Some People of the Book plot to believe at the start of the day and disbelieve at its end", cluster: polemic}
  trustworthy-with-qintar-or-dinar: {label: "Some People of the Book return a heap of gold entrusted; others not even a dinar", cluster: polemic}
  no-obligation-toward-gentiles-claim: {label: "Claim 'there is no obligation on us concerning the unlettered (ummiyyin)'", cluster: polemic}
  twisting-tongues-with-book: {label: "Some twist their tongues with the book so you think it is from the book", cluster: polemic}
  prophet-would-not-claim-worship: {label: "No human given book and prophethood would tell people to be his servants instead of God's", cluster: christology}
  covenant-of-prophets: {label: "God took the covenant of the prophets to believe in and help a later confirming messenger", cluster: prophecy}
  all-in-heavens-submit-willingly-or-not: {label: "All in heavens and earth submit to God willingly or unwillingly", cluster: theology}
  earthful-of-gold-no-ransom: {label: "An earthful of gold would not be accepted as ransom from one who dies unbelieving", cluster: eschatology}
  spend-what-you-love: {label: "You will not attain righteousness until you spend from what you love", cluster: ethics}
  israel-forbade-himself-food: {label: "All food was lawful to the Children of Israel except what Israel (Jacob) forbade himself before the Torah", cluster: law}
  first-house-at-bakka: {label: "The first House appointed for mankind was the one at Bakka, blessed", cluster: cult}
  pilgrimage-duty-for-the-able: {label: "Pilgrimage to the House is a duty to God for whoever is able to find a way", cluster: cult}
  hold-fast-to-rope-of-god: {label: "Hold fast all together to the rope of God and do not be divided", cluster: theology}
  brink-of-pit-of-fire: {label: "You were on the brink of a pit of fire and God rescued you", cluster: eschatology}
  enjoin-good-forbid-evil: {label: "A community that enjoins the good and forbids the evil (al-amr bil-ma'ruf)", cluster: ethics}
  faces-whitened-and-blackened: {label: "On the day some faces turn white and some turn black", cluster: eschatology}
  best-community-brought-forth: {label: "'You are the best community brought forth for mankind'", cluster: theology}
  humiliation-except-by-rope-of-god-and-men: {label: "Humiliation is stamped on them wherever found except under a rope from God and a rope from men", cluster: polemic}
  people-of-book-who-pray-at-night: {label: "Among the People of the Book an upright community recites God's signs through the night and prostrates", cluster: polemic}
  parable-icy-wind-destroys-tillage: {label: "Spending of unbelievers is like an icy wind that destroys the tillage of a wrongdoing people", cluster: parable}
  enemies-bite-fingertips-in-rage: {label: "When alone they bite their fingertips at you in rage: 'Die in your rage'", cluster: polemic}
  battle-of-badr: {label: "God helped you at Badr when you were weak", cluster: war}
  angels-reinforce-battle-thousands: {label: "God reinforces the believers with three thousand, then five thousand marked angels", cluster: war}
  usury-doubled-and-redoubled: {label: "Do not consume usury doubled and redoubled", cluster: law}
  paradise-wide-as-heavens-and-earth: {label: "A garden whose breadth is the heavens and the earth", cluster: paradise}
  restrain-anger-and-pardon: {label: "Those who restrain anger and pardon people", cluster: ethics}
  travel-and-see-fate-of-deniers: {label: "Travel in the land and see the end of those who denied", cluster: theology}
  days-alternate-among-people: {label: "Such days God alternates among people", cluster: theology}
  muhammad-only-a-messenger: {label: "Muhammad is only a messenger; messengers passed before him; if he died or were killed would you turn on your heels?", cluster: prophecy}
  appointed-term-of-death-written: {label: "No soul dies except by God's leave at a term written (kitaban mu'ajjalan)", cluster: theology}
  many-prophets-fought-with-godly-men: {label: "Many a prophet fought alongside many godly men (ribbiyyun) who did not weaken", cluster: war}
  terror-cast-into-enemy-hearts: {label: "God casts terror (ru'b) into the hearts of the unbelievers", cluster: war}
  defeat-from-disobedience-at-uhud: {label: "Defeat came when the believers disputed and disobeyed after seeing what they loved (the spoils)", cluster: war}
  drowsiness-sent-as-security: {label: "After distress God sends down security, a drowsiness (nu'as) overcoming a party of the fighters", cluster: war}
  fated-would-go-out-to-death-place: {label: "Even if in your houses, those destined to be killed would have gone out to their death-beds", cluster: theology}
  consult-them-in-the-matter: {label: "The prophet told to be gentle, pardon them and consult them (shawirhum) in the matter", cluster: ethics}
  defrauder-brings-booty-on-judgment-day: {label: "Whoever defrauds (yaghlul) will bring what he took on the Day of Resurrection", cluster: eschatology}
  martyrs-rejoice-for-those-behind: {label: "The slain rejoice with their Lord and are glad for those who have not yet joined them", cluster: eschatology}
  god-suffices-best-guardian: {label: "'God is sufficient for us and the best guardian' (hasbuna allah)", cluster: liturgy}
  satan-frightens-his-allies: {label: "It is Satan who frightens you of his allies; fear me", cluster: theology}
  respite-to-increase-sin: {label: "God grants the unbelievers respite only that they may increase in sin", cluster: theology}
  god-separates-bad-from-good: {label: "God will not leave believers as they are until he separates the bad from the good", cluster: theology}
  misers-collar-of-hoard: {label: "Misers will have what they hoarded hung round their necks as a collar on the Day of Resurrection", cluster: eschatology}
  god-is-poor-we-rich-mockery: {label: "Those who said 'God is poor and we are rich' are recorded and will taste the burning", cluster: polemic}
  offering-consumed-by-fire-demanded: {label: "Some demand that a messenger bring an offering consumed by fire as his credential", cluster: polemic}
  every-soul-tastes-death: {label: "Every soul shall taste death", cluster: eschatology}
  covenant-to-make-book-clear: {label: "God took the covenant of those given the Book to make it clear to people and not conceal it", cluster: polemic}
  remember-god-standing-sitting-lying: {label: "Those who remember God standing, sitting and on their sides and reflect on creation", cluster: liturgy}
  not-created-in-vain: {label: "'Our Lord, you have not created this in vain'", cluster: creation}
  caller-to-faith-heard: {label: "'We heard a caller calling to faith: believe in your Lord'", cluster: liturgy}
  male-and-female-deeds-equal: {label: "God does not waste the work of any worker, male or female; you are of one another", cluster: ethics}
  persevere-and-stand-guard: {label: "Be patient, vie in patience, stand guard (rabitu)", cluster: ethics}
  dower-and-divorce-in-bounds: {label: "Husband may not take back what he gave the wife except in fear of transgressing God's bounds", cluster: law}

units:
  - id: quran-1-fatiha
    tradition: islam
    title: The Opening (al-Fatiha)
    corpus: quran
    original: true
    tagger: Claude (model), reading the Arabic
    read: ["1:1-7"]
    tags:
      - {motif: basmala-formula, refs: ["1:1"]}
      - {motif: divine-names-rahman-rahim, refs: ["1:1", "1:3"]}
      - {motif: praise-to-lord-of-worlds, refs: ["1:2"]}
      - {motif: master-of-day-of-judgment, refs: ["1:4"], note: "maliki / maaliki yawm al-din"}
      - {motif: you-alone-we-worship, refs: ["1:5"]}
      - {motif: prayer-for-straight-path, refs: ["1:6", "1:7"]}
      - {motif: path-of-blessed-not-wrath-not-astray, refs: ["1:7"]}
      - {motif: two-ways-righteous-and-wicked, refs: ["1:6", "1:7"], note: "here three ways"}
    hints:
      - "Compare Psalm 1 (two ways), Psalm 86:11 'teach me your way', and the Lord's Prayer (Matt 6:9-13) as communal prayer opening a corpus."

  - id: quran-2-three-groups
    tradition: islam
    title: Believers, unbelievers and hypocrites
    corpus: quran
    original: true
    tagger: Claude (model), reading the Arabic
    read: ["2:1-20"]
    tags:
      - {motif: disconnected-letters-opening, refs: ["2:1"], note: "alif-lam-mim"}
      - {motif: book-without-doubt, refs: ["2:2"]}
      - {motif: belief-in-the-unseen, refs: ["2:3"]}
      - {motif: god-seals-hearts-ears-eyes, refs: ["2:7"]}
      - {motif: commission-to-harden-hearts, refs: ["2:6", "2:7"], note: "warning makes no difference to them"}
      - {motif: hypocrites-two-faced, refs: ["2:8", "2:9", "2:14"]}
      - {motif: parable-of-kindled-fire-extinguished, refs: ["2:17"]}
      - {motif: parable-of-storm-fingers-in-ears, refs: ["2:19", "2:20"]}
      - {motif: deaf-dumb-blind-refrain, refs: ["2:18"]}
      - {motif: blind-and-deaf-servant, refs: ["2:18"]}
    hints:
      - "Compare Isa 6:9-10 (hearts fat, ears heavy, eyes shut) and Matt 13:13-15."

  - id: quran-2-call-to-worship
    tradition: islam
    title: Call to worship the Creator; the challenge; paradise and the gnat
    corpus: quran
    original: true
    tagger: Claude (model), reading the Arabic
    read: ["2:21-29"]
    tags:
      - {motif: heavenly-storehouse-of-rain, refs: ["2:22"], note: "earth a bed, sky a canopy, rain brings fruits"}
      - {motif: challenge-to-produce-a-surah, refs: ["2:23", "2:24"]}
      - {motif: hellfire-fueled-by-men-and-stones, refs: ["2:24"]}
      - {motif: paradise-gardens-rivers-flow-beneath, refs: ["2:25"]}
      - {motif: paradise-fruit-seems-familiar, refs: ["2:25"]}
      - {motif: purified-spouses-in-paradise, refs: ["2:25"]}
      - {motif: gnat-parable-defended, refs: ["2:26"]}
      - {motif: two-deaths-two-lives, refs: ["2:28"]}
      - {motif: seven-heavens, refs: ["2:29"]}
    hints:
      - "Seven heavens: compare b. Hagigah 12b, 2 Enoch, Ascension of Isaiah."

  - id: quran-2-adam-iblis
    tradition: islam
    title: Adam, the angels and Iblis
    corpus: quran
    original: true
    tagger: Claude (model), reading the Arabic
    read: ["2:30-39"]
    tags:
      - {motif: human-as-vicegerent-khalifa, refs: ["2:30"]}
      - {motif: angels-object-to-human-creation, refs: ["2:30"], note: "will you place there one who will corrupt and shed blood?"}
      - {motif: divine-plural-speech, refs: ["2:34", "2:35"], note: "God speaks as 'we' (qulna)"}
      - {motif: adam-taught-the-names, refs: ["2:31", "2:32", "2:33"]}
      - {motif: adam-names-animals, refs: ["2:31", "2:33"], note: "here all the names, displayed before the angels"}
      - {motif: angels-commanded-to-bow-to-adam, refs: ["2:34"]}
      - {motif: iblis-refuses-to-bow, refs: ["2:34"]}
      - {motif: garden-of-god-in-east, refs: ["2:35"], note: "al-janna; no location"}
      - {motif: tree-of-knowledge-forbidden, refs: ["2:35"], note: "'this tree', unnamed"}
      - {motif: serpent-tempter, refs: ["2:36"], note: "the tempter is al-shaytan, not a serpent"}
      - {motif: expulsion-from-paradise, refs: ["2:36", "2:38"]}
      - {motif: descend-enemies-to-one-another, refs: ["2:36"]}
      - {motif: adam-receives-words-of-repentance, refs: ["2:37"]}
      - {motif: no-fear-nor-grief-formula, refs: ["2:38"]}
    hints:
      - "Angels' objection: Gen. Rabbah 8:5, b. Sanhedrin 38b. Angels bowing and Satan's refusal: Life of Adam and Eve 12-16, Cave of Treasures 2-3. Adam naming beyond the angels: Gen. Rabbah 17:4."

  - id: quran-2-israel-favor
    tradition: islam
    title: Address to the Children of Israel
    corpus: quran
    original: true
    tagger: Claude (model), reading the Arabic
    read: ["2:40-48"]
    tags:
      - {motif: remember-my-favor-refrain, refs: ["2:40", "2:47"]}
      - {motif: chosen-treasured-people, refs: ["2:47"], note: "preferred over the worlds"}
      - {motif: scripture-cast-behind-backs, refs: ["2:41", "2:42"], note: "selling signs for a small price, concealing truth"}
      - {motif: no-soul-avails-another-on-judgment-day, refs: ["2:48"]}
      - {motif: no-ransom-for-a-brother, refs: ["2:48"]}
      - {motif: individual-responsibility-for-sin, refs: ["2:48"]}

  - id: quran-2-exodus-calf
    tradition: islam
    title: Exodus, the calf and the wilderness
    corpus: quran
    original: true
    tagger: Claude (model), reading the Arabic
    read: ["2:49-61"]
    tags:
      - {motif: king-kills-male-infants, refs: ["2:49"], note: "they slaughtered your sons and spared your women"}
      - {motif: sea-split-by-staff-and-east-wind, refs: ["2:50"], note: "we parted the sea for you"}
      - {motif: pursuers-drowned-in-sea, refs: ["2:50"]}
      - {motif: forty-days-and-nights, refs: ["2:51"], note: "forty nights"}
      - {motif: golden-calf, refs: ["2:51", "2:54"]}
      - {motif: levites-kill-idolaters-kin, refs: ["2:54"], note: "'kill yourselves' as repentance"}
      - {motif: no-man-sees-god-and-lives, refs: ["2:55"]}
      - {motif: slain-israelites-revived, refs: ["2:55", "2:56"]}
      - {motif: pillar-of-cloud-and-fire, refs: ["2:57"], note: "shaded with clouds"}
      - {motif: manna, refs: ["2:57"]}
      - {motif: quail-miracle, refs: ["2:57"], note: "al-salwa"}
      - {motif: enter-gate-prostrate-say-hitta, refs: ["2:58", "2:59"]}
      - {motif: water-from-struck-rock, refs: ["2:60"]}
      - {motif: twelve-springs-seventy-palms, refs: ["2:60"], note: "twelve springs, each people knew its drinking place"}
      - {motif: egyptian-foods-remembered, refs: ["2:61"], note: "herbs, cucumbers, fum (garlic or wheat), lentils, onions"}
      - {motif: murmuring-in-wilderness, refs: ["2:61"]}
      - {motif: prophets-killed-by-israel, refs: ["2:61"]}
    hints:
      - "Hitta: compare targumic/rabbinic midrash on entering the land; 'kill yourselves' corresponds to Exod 32:27-28."

  - id: quran-2-sabbath-apes
    tradition: islam
    title: Covenant at the mountain and the Sabbath-breakers
    corpus: quran
    original: true
    tagger: Claude (model), reading the Arabic
    read: ["2:62-66"]
    tags:
      - {motif: mountain-raised-over-israel, refs: ["2:63"]}
      - {motif: sabbath-breakers-turned-to-apes, refs: ["2:65", "2:66"]}
      - {motif: no-fear-nor-grief-formula, refs: ["2:62"], note: "believers, Jews, Christians and Sabians who believe"}
    hints:
      - "Mountain held over Israel like a cask: b. Shabbat 88a, b. Avodah Zarah 2b."

  - id: quran-2-the-cow
    tradition: islam
    title: The cow and the slain man
    corpus: quran
    original: true
    tagger: Claude (model), reading the Arabic
    read: ["2:67-74"]
    tags:
      - {motif: cow-sacrifice-haggling, refs: ["2:67", "2:68", "2:69", "2:70", "2:71"]}
      - {motif: red-heifer, refs: ["2:69", "2:71"], note: "unblemished (la shiyata fiha), never yoked; but yellow, not red"}
      - {motif: yellow-cow, refs: ["2:69"]}
      - {motif: unsolved-murder-heifer-ritual, refs: ["2:71", "2:72", "2:73"], note: "a heifer not worked plowing or watering, connected to an unsolved killing"}
      - {motif: cows-test-on-new-cart, refs: ["2:71"], note: "not yoked to till the earth"}
      - {motif: murdered-man-struck-with-part-of-cow-revives, refs: ["2:72", "2:73"]}
      - {motif: hearts-harder-than-stone-but-stones-gush, refs: ["2:74"]}
      - {motif: heart-of-stone-to-heart-of-flesh, refs: ["2:74"]}
    hints:
      - "Combines Num 19 (red heifer) and Deut 21:1-9 (eglah arufah). Compare b. Yoma 42 and Num. Rabbah 19 on the red heifer; a Dama ben Netinah story (b. Qiddushin 31a) about buying a red heifer."

  - id: quran-2-polemic-israel
    tradition: islam
    title: Polemic with the People of the Book
    corpus: quran
    original: true
    tagger: Claude (model), reading the Arabic
    read: ["2:75-101"]
    tags:
      - {motif: scripture-altered-tahrif, refs: ["2:75"]}
      - {motif: hypocrites-two-faced, refs: ["2:76"]}
      - {motif: writing-scripture-with-own-hands, refs: ["2:79"]}
      - {motif: hell-only-numbered-days-claim, refs: ["2:80"]}
      - {motif: honor-parents-long-life, refs: ["2:83"], note: "covenant: worship only God, be good to parents, kin, orphans, the poor"}
      - {motif: no-ransom-for-murderer, refs: ["2:85"], note: "they ransom captives yet expel their own"}
      - {motif: jesus-supported-by-holy-spirit, refs: ["2:87"]}
      - {motif: prophets-killed-by-israel, refs: ["2:87", "2:91"]}
      - {motif: uncircumcised-heart, refs: ["2:88"], note: "qulubuna ghulf, 'our hearts are uncircumcised/wrapped'"}
      - {motif: golden-calf, refs: ["2:92", "2:93"]}
      - {motif: mountain-raised-over-israel, refs: ["2:93"]}
      - {motif: we-hear-and-disobey, refs: ["2:93"]}
      - {motif: calf-drunk-into-hearts, refs: ["2:93"]}
      - {motif: idol-burned-ground-and-drunk, refs: ["2:93"], note: "ushribu fi qulubihim al-'ijl, cf. Exod 32:20"}
      - {motif: challenge-to-wish-for-death, refs: ["2:94", "2:95"]}
      - {motif: wish-to-live-thousand-years, refs: ["2:96"]}
      - {motif: gabriel-brings-revelation-to-heart, refs: ["2:97"]}
      - {motif: enmity-to-gabriel-and-michael, refs: ["2:97", "2:98"]}
      - {motif: angel-gabriel-named, refs: ["2:97", "2:98"]}
      - {motif: michael-archangel, refs: ["2:98"]}
