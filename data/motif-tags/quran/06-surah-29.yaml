new_motifs:
  faith-tested-by-trial-fitna: {label: "Those who say 'we believe' will not be left untested; God tries them as he tried those before to know the truthful from the liars", cluster: theology}
  obey-parents-except-in-idolatry: {label: "Children must treat parents well but must not obey them if they press them to associate partners with God", cluster: law}
  tempters-offer-to-bear-sins: {label: "Unbelievers offer to carry the believers' sins if they follow their way; they cannot, and will carry their own loads and others' besides", cluster: eschatology}
  ark-and-survivors-made-a-sign: {label: "God made the flood ship (or its survivors) a sign for all the worlds", cluster: flood}
  idols-cannot-provide-sustenance: {label: "The idols own no provision (rizq) for their worshippers; seek provision from God", cluster: polemic}
  idolatry-as-bond-of-worldly-affection: {label: "Idols are taken only as a bond of affection among people in this life; on the Day they will disown and curse one another", cluster: eschatology}
  lot-believes-abraham-and-emigrates: {label: "Lot believes in Abraham, who declares 'I am emigrating to my Lord'", cluster: patriarchs}
  prophecy-and-scripture-in-abrahams-line: {label: "God places prophethood and the Book among Abraham's descendants", cluster: patriarchs}
  sodomites-rob-travelers-and-sin-in-assembly: {label: "Lot's people approach men, cut off the road (highway robbery) and commit abominations in their assembly (nadi)", cluster: sodom}
  host-distressed-by-angelic-guests: {label: "The host is troubled and helpless on account of the angelic guests, fearing for them", cluster: sodom}
  shuayb-sent-to-midian: {label: "The prophet Shu'ayb is sent to his kin, the people of Midian (Madyan)", cluster: prophets}
  korah-pharaoh-haman-trio: {label: "Korah (Qarun), Pharaoh and Haman are grouped as arrogant opponents of Moses", cluster: exodus}
  catalogue-of-punishments-of-nations: {label: "List of punishment types for the nations: stone-storm, the Shout, swallowing by the earth, drowning", cluster: punishment}
  god-does-not-wrong-them: {label: "God did not wrong them; they wronged themselves (refrain)", cluster: theology}
  prayer-restrains-indecency: {label: "Prayer (salat) restrains from indecency and wrongdoing, and remembrance of God is greater", cluster: ritual}
  dispute-with-people-of-book-courteously: {label: "Argue with the People of the Book only in the best manner; say 'our God and your God is one'", cluster: polemic}
  unlettered-prophet-did-not-read-or-write: {label: "The prophet neither recited any scripture nor wrote one with his right hand before the revelation", cluster: revelation}
  demand-for-miraculous-signs: {label: "Opponents demand that signs be sent down to the prophet; he answers that signs are with God and he is only a warner", cluster: revelation}
  punishment-hastened-by-scoffers: {label: "Scoffers ask the prophet to hasten the punishment; it is held back only by an appointed term and will come suddenly", cluster: eschatology}
  hell-covers-from-above-and-below: {label: "The punishment of hell envelops the damned from above them and from beneath their feet", cluster: hell}
  pagans-admit-god-is-creator: {label: "If asked who created heaven and earth and sends rain, the idolaters themselves answer 'God'", cluster: polemic}
  worldly-life-play-and-amusement: {label: "The life of this world is only amusement and play (lahw wa-la'ib); the abode of the hereafter is the true life", cluster: wisdom}
  secure-sanctuary-of-mecca: {label: "God made a secure sanctuary (haram amin) while people around are snatched away", cluster: cult}
  romans-defeated-will-triumph: {label: "Prophecy: the Romans (al-Rum) have been defeated in the nearest land but will triumph within a few years", cluster: prophecy}
  signs-of-god-in-nature-refrain: {label: "Refrain 'among his signs (ayat) is...' listing natural phenomena as evidence of God", cluster: form}
  praise-at-set-times-of-day: {label: "Glorify God in the evening, morning, afternoon and noon (set times of praise or prayer)", cluster: ritual}
  spouses-created-from-your-own-selves: {label: "God created mates for humans from their own selves so they may find rest in them, with love and mercy between them", cluster: creation}
  diversity-of-languages-and-colors-as-sign: {label: "The diversity of human languages and colors is one of God's signs", cluster: creation}
  lightning-fear-and-hope: {label: "God shows lightning to inspire fear and hope (of rain)", cluster: cosmology}
  all-in-heaven-and-earth-obedient: {label: "Everything in the heavens and the earth is devoutly obedient (qanit) to God", cluster: theology}
  slave-partner-parable: {label: "Parable: you would not make your slaves equal partners in your wealth; how then make God's creatures his partners?", cluster: polemic}
  fitra-primordial-nature: {label: "The fitra: God's original pattern on which he created humankind, the upright (hanif) religion; no change to God's creation", cluster: theology}
  religion-split-into-sects: {label: "Those who split their religion into sects, each party exulting in what it has", cluster: polemic}
  distress-prayer-then-ingratitude: {label: "When harm touches people they turn to God; when he gives them relief a party of them associates partners again", cluster: theology}
  give-kin-poor-wayfarer-their-due: {label: "Give the relative, the needy and the wayfarer (ibn al-sabil) their due", cluster: law}
  usury-does-not-increase-with-god: {label: "Usury (riba) given to increase people's wealth does not increase with God, but alms (zakat) seeking his face are multiplied", cluster: law}
  corruption-on-land-and-sea: {label: "Corruption has appeared on land and sea because of what people's hands have earned", cluster: punishment}
  winds-heralding-rain: {label: "God sends the winds as heralds of good news, raising clouds which he spreads and breaks into fragments so rain issues from them", cluster: cosmology}
  prophet-cannot-make-dead-hear: {label: "The prophet cannot make the dead hear, nor the deaf hear the call, nor guide the blind", cluster: revelation}
  stages-weakness-strength-weakness: {label: "God created humans in weakness, then gave strength, then after strength weakness and grey hair", cluster: wisdom}
  luqman-the-wise: {label: "Luqman, a sage given wisdom by God, instructs his son", cluster: wisdom}
  idolatry-as-great-wrong: {label: "Associating partners with God (shirk) is a tremendous wrong", cluster: theology}
  mother-bore-in-weakness-weaning-two-years: {label: "The mother carried the child in weakness upon weakness and his weaning is in two years", cluster: law}
  mustard-seed-hidden-god-brings-it: {label: "Even a deed the weight of a mustard seed, hidden in a rock or in heaven or earth, God will bring it forth", cluster: eschatology}
  do-not-walk-proudly: {label: "Do not turn your cheek away from people in scorn or walk proudly on the earth; be modest in your walk", cluster: wisdom}
  lower-voice-donkey-bray: {label: "Lower your voice: the most repugnant of voices is the braying of donkeys", cluster: wisdom}
  following-ancestors-blindly: {label: "Rejecters reply 'we follow what we found our fathers upon'", cluster: polemic}
  words-of-god-inexhaustible-trees-pens-seas: {label: "If all trees were pens and the sea, replenished by seven more seas, were ink, God's words would not be exhausted", cluster: revelation}
  creation-and-resurrection-as-one-soul: {label: "Creating and resurrecting all of you is for God like a single soul", cluster: resurrection}
  sun-and-moon-run-to-appointed-term: {label: "Sun and moon are subjected, each running its course to an appointed term", cluster: cosmology}
  waves-like-canopies: {label: "Waves overwhelm the ship like canopies (zulal)", cluster: cosmology}
  no-parent-avails-child-on-judgment: {label: "On the Day no parent can avail his child, nor child his parent", cluster: eschatology}
  five-keys-of-the-unseen: {label: "God alone knows the Hour, sends rain, knows what is in wombs; no soul knows what it will earn tomorrow or in what land it will die", cluster: theology}
  heavens-without-visible-pillars: {label: "God raised the heavens without pillars that you can see", cluster: cosmology}
  show-me-what-your-gods-created: {label: "Challenge to idolaters: show me what those besides God have created", cluster: polemic}
  divine-day-of-thousand-years: {label: "A divine day whose measure is a thousand (or fifty thousand) years of human reckoning", cluster: cosmology}
  angel-of-death: {label: "The angel of death (malak al-mawt), put in charge of humans, takes their souls", cluster: angels}
  human-from-clay-then-despised-fluid: {label: "God began man's creation from clay, then made his progeny from an extract of a despised fluid, then shaped him and breathed of his spirit", cluster: creation}
  damned-beg-to-be-sent-back: {label: "The guilty, heads bowed before their Lord, beg to be returned to do good", cluster: eschatology}
  hell-filled-with-jinn-and-men: {label: "God's word: 'I will fill hell with jinn and humans all together'", cluster: hell}
  sides-forsake-beds-night-prayer: {label: "The believers' sides forsake their beds as they call on their Lord in fear and hope (night vigil)", cluster: ritual}
  hidden-delight-no-soul-knows: {label: "No soul knows what delight of the eyes is hidden in store for the righteous", cluster: paradise}
  damned-driven-back-when-they-try-to-leave-hell: {label: "Whenever the damned try to get out of the fire they are driven back into it", cluster: hell}
  lesser-punishment-before-greater: {label: "God makes people taste the nearer punishment before the greater one, that they may return", cluster: punishment}
  imams-guide-by-gods-command: {label: "God made leaders (a'imma) among the Israelites who guided by his command because they were patient", cluster: kingship}
  day-of-victory-faith-too-late: {label: "On the Day of the Opening/Victory (al-fath) the unbelievers' faith will not benefit them", cluster: eschatology}
  no-man-has-two-hearts: {label: "God has not put two hearts inside any man", cluster: wisdom}
  zihar-wife-not-mother: {label: "Repudiating a wife by declaring her like one's mother's back (zihar) does not make her one's mother", cluster: law}
  adopted-sons-not-real-sons: {label: "Adopted sons are not one's sons; call them by their fathers' names, or as brothers in religion and clients", cluster: law}
  prophets-wives-mothers-of-believers: {label: "The prophet's wives are the mothers of the believers and may not be married after him", cluster: law}
  covenant-taken-from-prophets: {label: "God took a solemn covenant (mithaq) from the prophets: Muhammad, Noah, Abraham, Moses and Jesus son of Mary", cluster: prophets}
  wind-and-unseen-hosts-rout-besiegers: {label: "God sent a wind and invisible hosts against the confederate armies besieging the believers", cluster: war}
  hearts-reach-the-throats: {label: "In terror eyes swerve and hearts reach the throats", cluster: war}
  hypocrites-desert-saying-houses-exposed: {label: "Hypocrites ask leave to quit the battle line saying 'our houses are exposed', wanting only to flee", cluster: war}
  flight-does-not-avert-death: {label: "Fleeing will not save you from death or killing; you would enjoy life only a little", cluster: wisdom}
  prophet-as-excellent-example: {label: "In the messenger of God you have an excellent example (uswa hasana)", cluster: prophets}
  men-who-fulfilled-their-vow-unto-death: {label: "Among the believers are men who fulfilled their covenant with God; some have met their end (qada nahbah) and some still wait", cluster: war}
  people-of-book-allies-brought-down-from-fortresses: {label: "Book-people who aided the enemy are brought down from their fortresses, terror cast in their hearts; some killed, some captured, their land inherited", cluster: war}
  wives-offered-choice-world-or-god: {label: "The prophet's wives are given the choice between worldly adornment (with release and gift) and God and the hereafter", cluster: law}
  prophets-wives-double-punishment-double-reward: {label: "The prophet's wives will receive double punishment for open indecency and double reward for obedience", cluster: law}
  prophets-wives-stay-in-houses: {label: "The prophet's wives are to stay in their houses, not soften their speech, and not display themselves as in the former Jahiliyya", cluster: law}
  people-of-the-house-purified: {label: "God wishes to remove impurity from you, people of the House (ahl al-bayt), and purify you thoroughly", cluster: cult}
  male-and-female-believers-equal-reward: {label: "Paired list of male and female believers (muslims, believers, devout, truthful, patient, humble, charitable, fasting, chaste, remembering) promised equal reward", cluster: law}
  zayd-and-zaynab-marriage: {label: "After Zayd ends his marriage, God marries his former wife to the prophet so believers may marry the ex-wives of adopted sons", cluster: law}
  seal-of-the-prophets: {label: "Muhammad is not the father of any of your men but the messenger of God and the seal of the prophets (khatam al-nabiyyin)", cluster: prophets}
  god-and-angels-bless-prophet: {label: "God and his angels bless (yusalluna 'ala) the prophet; believers are told to bless him and greet him with peace", cluster: ritual}
  greeting-of-peace-in-hereafter: {label: "The greeting of the righteous in the hereafter is 'Peace' (salam)", cluster: paradise}
  prophet-as-witness-herald-warner-lamp: {label: "The prophet is sent as witness, bearer of good news, warner, caller to God and a light-giving lamp", cluster: prophets}
  divorce-before-consummation-no-waiting: {label: "A wife divorced before consummation owes no waiting period ('idda); give her a gift and release her gracefully", cluster: law}
  prophets-special-marriage-rules: {label: "Special marriage rules for the prophet: lawful wives, captives, named cousins who emigrated, and a woman who gives herself; afterwards no more wives", cluster: law}
  etiquette-of-prophets-house-and-curtain: {label: "Enter the prophet's houses only when invited to a meal and leave after; ask his wives from behind a curtain (hijab)", cluster: law}
  women-draw-cloaks-to-be-recognized: {label: "Believing women are to draw their outer cloaks (jalabib) over themselves so they are recognized and not harmed", cluster: law}
  sunna-of-god-unchanging: {label: "The way (sunna) of God with those who passed before: you will find no change in God's way", cluster: theology}
  knowledge-of-hour-with-god-alone: {label: "People ask about the Hour; its knowledge is with God alone, and it may be near", cluster: eschatology}
  faces-turned-over-in-fire: {label: "In hell the faces of the damned are turned over in the fire", cluster: hell}
  followers-blame-leaders-in-hell: {label: "The damned blame their chiefs and great ones who misled them and ask God to double their punishment", cluster: hell}
  moses-cleared-of-slander: {label: "Those who hurt Moses: God cleared him of what they said", cluster: exodus}
  trust-offered-to-heavens-earth-mountains: {label: "God offered the Trust (amana) to the heavens, earth and mountains; they refused and feared it, but man bore it, unjust and ignorant", cluster: creation}
  praise-of-god-in-hereafter: {label: "Praise belongs to God in this world and the hereafter", cluster: theology}
  resurrection-after-total-disintegration: {label: "Scoffers ridicule the claim that after being torn to pieces utterly they will be created anew", cluster: resurrection}
  prophet-accused-of-forgery-or-madness: {label: "Opponents ask whether the prophet has forged a lie against God or is possessed (bihi jinna)", cluster: polemic}
  fountain-of-molten-copper-for-solomon: {label: "God made a spring of molten copper (or brass) flow for Solomon", cluster: solomon}
  solomons-death-revealed-by-worm-eating-staff: {label: "Solomon dies leaning on his staff; only a creature of the earth gnawing the staff reveals his death when he falls", cluster: solomon}
  jinn-ignorant-of-unseen: {label: "The jinn did not know the unseen, else they would not have stayed in humiliating labor", cluster: jinn}
  sheba-two-gardens: {label: "Sheba (Saba') had a sign in their dwelling: two gardens to the right and left, a good land", cluster: sheba}
  flood-of-the-dam-arim: {label: "God sends the flood of al-'Arim (the dam) and turns the two gardens into bitter fruit, tamarisk and a few lote-trees", cluster: sheba}
  sheba-trade-route-towns-safe-travel: {label: "Between Sheba and the blessed towns God set visible towns and measured stages for safe travel by night and day", cluster: sheba}
  sheba-asks-longer-journeys-scattered: {label: "Sheba asks 'Lengthen the distances between our journeys', and God makes them bygone tales and scatters them utterly", cluster: sheba}
  iblis-proves-his-opinion-true: {label: "Iblis found his opinion of humans to be true; they followed him except a party of believers", cluster: satan}
  terror-lifted-from-hearts-of-angels: {label: "When terror is lifted from their hearts they ask 'what did your Lord say?' and answer 'The truth'", cluster: angels}
  weak-and-arrogant-dispute-in-judgment: {label: "On the Day the weak (mustad'afun) and the arrogant (mustakbirun) blame one another for leading astray", cluster: eschatology}
  iron-collars-on-necks-of-damned: {label: "Iron collars (aghlal) are put on the necks of the damned", cluster: hell}
  affluent-reject-every-warner: {label: "Every town's affluent ones (mutrafun) reject the warner, boasting 'we have more wealth and children; we will not be punished'", cluster: polemic}
  wealth-and-children-do-not-bring-near: {label: "Wealth and children do not bring you near to God, only faith and good works", cluster: wisdom}
  angels-disown-worshippers-who-worshipped-jinn: {label: "On the Day God asks the angels whether people worshipped them; they disown them: 'they worshipped the jinn'", cluster: eschatology}
  stand-in-twos-or-singly-and-reflect: {label: "Stand up for God in twos or singly, then reflect: your companion is not mad", cluster: revelation}
  truth-has-come-falsehood-vanishes: {label: "Truth has come; falsehood neither originates nor restores", cluster: theology}
  faith-at-last-moment-unaccepted: {label: "Seized at the end, they say 'we believe', but how can they reach it from a far place?", cluster: eschatology}
  angels-with-two-three-four-wings: {label: "God made the angels messengers with wings in twos, threes and fours, adding to creation what he wills", cluster: angels}
  satan-is-your-enemy: {label: "Satan is an enemy to you, so take him as an enemy; he calls his party to the blaze", cluster: satan}
  good-word-ascends-to-god: {label: "To God ascends the good word, and righteous deeds raise it up", cluster: theology}
  lifespan-written-in-book: {label: "No one is granted long life or has his life shortened except it is in a Book", cluster: theology}
  false-gods-own-not-a-date-skin: {label: "The false gods do not own even the thin skin of a date-stone (qitmir); they cannot hear prayer and will disown it at the Resurrection", cluster: polemic}
  god-can-replace-humanity-with-new-creation: {label: "If God willed he could remove you and bring a new creation", cluster: theology}
  no-bearer-bears-anothers-burden: {label: "No burdened soul bears another's burden; even a relative will not carry any of it", cluster: eschatology}
  blind-and-seeing-not-equal: {label: "Antithetical series: the blind and the seeing, darkness and light, shade and heat, the living and the dead are not equal", cluster: wisdom}
  every-nation-had-a-warner: {label: "There was no community but a warner passed among it", cluster: prophets}
  colors-of-mountains-fruits-creatures: {label: "God brings forth fruits of varied colors, streaks in the mountains white, red and raven-black, and varied colors in people and beasts", cluster: creation}
  only-the-learned-fear-god: {label: "Only those of his servants who have knowledge truly fear God", cluster: wisdom}
  three-classes-of-heirs-of-book: {label: "Heirs of the Book are of three kinds: one who wrongs himself, one who is moderate, and one foremost in good deeds", cluster: theology}
  paradise-free-of-grief-and-weariness: {label: "Paradise is the abode of permanence where no toil or weariness touches the blessed and grief is removed", cluster: paradise}
  humans-made-successors-on-earth: {label: "God made humans successors (khala'if) on the earth", cluster: creation}
  god-holds-heavens-and-earth-from-falling: {label: "God holds the heavens and the earth lest they cease; if they ceased, no one else could hold them", cluster: cosmology}
  evil-plot-recoils-on-plotter: {label: "The evil plot encompasses only its own authors", cluster: wisdom}
  if-god-punished-all-no-creature-left: {label: "If God took people to task for what they earned he would not leave a creature on the earth's back, but he defers them to a set term", cluster: theology}
  oath-by-the-quran: {label: "Oath by the Quran itself ('By the wise Quran')", cluster: form}
  collars-to-chins-barrier-before-and-behind: {label: "God has put collars up to their chins so their heads are forced up, and a barrier before and behind them, covering them so they do not see", cluster: theology}
  deeds-and-traces-recorded-in-register: {label: "God records what people sent ahead and their traces (athar), and counts everything in a clear register (imam mubin)", cluster: eschatology}
  messengers-to-the-town-two-then-third: {label: "Two messengers sent to a town are rejected, so God reinforces them with a third", cluster: prophets}
  messengers-called-ill-omen-threatened-stoning: {label: "The townsfolk say 'we augur ill of you' and threaten to stone the messengers; they reply 'your omen is with you'", cluster: prophets}
  man-from-far-end-of-city-supports-messengers: {label: "A man comes running from the farthest part of the city urging his people to follow the messengers", cluster: prophets}
  martyr-enters-paradise-wishes-people-knew: {label: "The believer is told 'enter the Garden' and says 'Would that my people knew how my Lord forgave me'", cluster: paradise}
  single-shout-extinguishes-town: {label: "No host from heaven was needed: a single Shout (sayha) and they were extinguished", cluster: punishment}
  day-stripped-from-night: {label: "The night is a sign: God strips (naslakh) the day from it and they are in darkness", cluster: cosmology}
  sun-runs-to-resting-place: {label: "The sun runs to its resting place (mustaqarr)", cluster: cosmology}
  moon-mansions-like-old-palm-stalk: {label: "God measured stations (manazil) for the moon until it returns like an old dried palm-stalk", cluster: cosmology}
  laden-ark-carried-their-offspring: {label: "A sign: God carried their offspring in the laden ship, and made for them similar things to ride", cluster: flood}
  unbelievers-refuse-to-feed-poor-citing-god: {label: "Asked to spend, unbelievers retort 'shall we feed one whom God could feed if he willed?'", cluster: polemic}
  raised-from-sleeping-place: {label: "The resurrected cry 'Woe to us, who has raised us from our sleeping place (marqad)?'", cluster: resurrection}
  blessed-on-couches-with-spouses-in-shade: {label: "The people of the Garden recline with their spouses in shade on couches (ara'ik), with fruit and whatever they ask", cluster: paradise}
  peace-word-from-merciful-lord: {label: "'Peace': a word from a merciful Lord to the blessed", cluster: paradise}
  separation-of-the-guilty: {label: "'Separate yourselves today, you guilty ones!'", cluster: eschatology}
  covenant-with-children-of-adam-not-to-serve-satan: {label: "God's covenant with the children of Adam: do not serve Satan; serve me, this is a straight path", cluster: theology}
  threat-of-blinding-and-transformation: {label: "If God willed he would blot out their eyes or transform them (maskh) in their places so they could neither go on nor return", cluster: punishment}
  old-age-reverses-creation: {label: "Whomever God gives long life he reverses in creation (returns to weakness)", cluster: wisdom}
  prophet-not-a-poet: {label: "God did not teach the prophet poetry, nor is it fitting for him; it is a reminder and a clear Quran", cluster: revelation}
  livestock-made-subservient: {label: "God created livestock and subjected them to people for riding, food, benefits and drink", cluster: creation}
  who-revives-rotten-bones: {label: "The skeptic asks 'Who will give life to bones when they have rotted?'; the answer: he who produced them the first time", cluster: resurrection}
  fire-from-green-tree: {label: "God made fire for you from the green tree, from which you kindle", cluster: cosmology}
  oath-by-angelic-ranks: {label: "Opening oath by those ranged in ranks, those who drive (or rebuke), and those who recite the reminder", cluster: form}
  lord-of-the-easts: {label: "God is Lord of the heavens, the earth, what is between, and of the risings (al-masharik) of the sun", cluster: theology}
  stars-adorn-lowest-heaven-guard-against-devils: {label: "The lowest heaven is adorned with stars as a guard against every rebellious devil", cluster: cosmology}
  devils-eavesdrop-pelted-with-shooting-stars: {label: "Devils cannot listen to the Exalted Assembly (al-mala' al-a'la); any who snatch a word are pursued by a piercing flame (shihab)", cluster: cosmology}
  human-from-sticky-clay: {label: "Humans created from sticky clay (tin lazib)", cluster: creation}
  single-cry-wakes-the-dead: {label: "A single cry or rebuke (zajra) and the dead stand looking", cluster: resurrection}
  day-of-sorting-day-of-judgment: {label: "'This is the Day of Judgment (yawm al-din), the Day of Sorting (yawm al-fasl) which you denied'", cluster: eschatology}
  wrongdoers-and-their-mates-led-to-hell-path: {label: "Gather the wrongdoers, their mates and what they worshipped and lead them to the path of hell; stop them, they will be questioned", cluster: hell}
  misled-and-misleaders-dispute: {label: "In the punishment the misled and their misleaders turn on each other in recrimination and share the punishment", cluster: hell}
  prophet-called-mad-poet: {label: "Idolaters ask 'shall we abandon our gods for a mad poet?'", cluster: polemic}
  paradise-couches-facing-each-other: {label: "The blessed sit on couches facing one another", cluster: paradise}
  paradise-wine-without-headache: {label: "A cup from a flowing spring, white and delicious, without headache (ghawl) or intoxication, is passed among the blessed", cluster: paradise}
  houris-like-sheltered-eggs: {label: "Beside them are wide-eyed maidens of restrained glance, as if they were sheltered eggs", cluster: paradise}
  blessed-looks-down-sees-companion-in-hell: {label: "One of the blessed recalls a companion who denied the resurrection, looks down and sees him in the midst of hell", cluster: paradise}
  no-second-death-for-blessed: {label: "The blessed will not die except their first death and will not be punished", cluster: paradise}
  tree-of-zaqqum: {label: "The tree of Zaqqum grows from the bottom of hell; its spathes are like the heads of devils; the damned fill their bellies and drink boiling water", cluster: hell}
  peace-upon-prophet-refrain: {label: "Refrain 'We left for him among later generations: Peace upon X... thus we reward those who do good'", cluster: form}
  noahs-progeny-the-survivors: {label: "God made Noah's descendants the only survivors", cluster: flood}
  noah-cries-to-god-answered: {label: "Noah called to God and God answered, saving him and his family from the great distress", cluster: flood}
  abraham-gazes-at-stars-says-i-am-sick: {label: "Abraham glances at the stars and says 'I am sick', so his people leave him behind", cluster: patriarchs}
  abraham-mocks-idols-will-you-not-eat: {label: "Abraham asks the idols 'Will you not eat? Why do you not speak?' and strikes them with his right hand", cluster: patriarchs}
  people-build-structure-to-burn-abraham: {label: "The people build a structure (bunyan) and cast Abraham into the blaze, but God makes them the lowest", cluster: patriarchs}
  god-created-you-and-what-you-make: {label: "'Do you worship what you carve, when God created you and what you make?'", cluster: polemic}
  son-of-sacrifice-unnamed-isaac-announced-after: {label: "The son of the sacrifice is not named; Isaac's birth is announced only after the episode (read as Ishmael by many exegetes)", cluster: patriarchs}
  sacrifice-commanded-in-dream: {label: "The father sees in a dream that he is sacrificing his son", cluster: patriarchs}
  son-consents-to-be-sacrificed: {label: "The son, consulted by his father, consents: 'Father, do what you are commanded; you will find me patient'", cluster: patriarchs}
  laid-on-forehead-for-slaughter: {label: "When both had submitted he laid him on his forehead (talla-hu li-l-jabin)", cluster: patriarchs}
  great-sacrifice-ransom: {label: "God ransomed the son with a great sacrifice (dhibh 'azim)", cluster: patriarchs}
  elias-against-baal: {label: "Elias (Ilyas) rebukes his people: 'Will you call on Ba'l and forsake the best of creators?'", cluster: prophets}
  il-yasin-name-variant: {label: "The prophet's name appears in variant form ('Il Yasin') for rhyme", cluster: form}
  passing-by-ruins-of-lot-morning-and-night: {label: "The hearers pass by the ruins of Lot's people morning and night", cluster: sodom}
  jonah-runaway-to-laden-ship: {label: "Jonah ran away (abaqa, as a runaway slave) to the laden ship", cluster: jonah}
  jonah-cast-out-on-barren-shore-sick: {label: "The fish casts the prophet onto a barren shore while he is sick", cluster: jonah}
  jonah-would-stay-in-fish-till-resurrection: {label: "Had Jonah not been among those who glorify God he would have stayed in the fish's belly until the Day of Resurrection", cluster: jonah}
  jonahs-people-believe-and-are-spared: {label: "Jonah is sent to a hundred thousand or more; they believe and are granted enjoyment for a while", cluster: jonah}
  daughters-of-god-polemic: {label: "Polemic against assigning daughters to God (angels as females) while preferring sons for oneself", cluster: polemic}
  kinship-between-god-and-jinn-denied: {label: "Idolaters claim a kinship (nasab) between God and the jinn; the jinn know they will be brought to judgment", cluster: polemic}
  each-angel-has-known-station: {label: "The angels say: each of us has a known station; we are ranged in ranks; we glorify", cluster: angels}
  evil-morning-of-the-warned: {label: "When the punishment descends in their courtyard, evil will be the morning of those who were warned", cluster: punishment}
  glory-to-lord-of-might-closing: {label: "Closing doxology: glory to your Lord, Lord of might, above what they describe; peace on the messengers; praise to God, Lord of the worlds", cluster: form}
  too-late-for-escape: {label: "Destroyed generations cried out when it was no longer a time for escape (lata hina manas)", cluster: punishment}
  chiefs-amazed-gods-made-one-god: {label: "The chiefs marvel 'Has he made the gods one God?' and urge each other to stay patient with their gods", cluster: polemic}
  not-heard-in-the-latest-religion: {label: "Opponents say 'We did not hear of this in the latest religion (al-milla al-akhira); it is a fabrication'", cluster: polemic}
  let-them-ascend-by-the-cords: {label: "If they own heaven and earth, let them ascend by the cords or ways (asbab) to heaven", cluster: cosmology}
  hasten-our-share-before-reckoning: {label: "Scoffers ask 'Lord, hasten to us our share (qittana) before the Day of Reckoning'", cluster: eschatology}
  david-wisdom-and-decisive-speech: {label: "God strengthened David's kingdom and gave him wisdom and decisive judgment (fasl al-khitab)", cluster: david}
  litigants-climb-wall-of-davids-chamber: {label: "Two litigants scale the wall of David's prayer-chamber (mihrab) and frighten him", cluster: david}
  ninety-nine-ewes-and-one: {label: "A man with ninety-nine ewes demands his brother's single ewe and overpowers him in argument", cluster: david}
  david-realizes-test-repents-prostrate: {label: "David realizes he was being tested, asks forgiveness, falls down bowing and turns in repentance", cluster: david}
  david-made-khalifa-judge-justly: {label: "'O David, we made you a vicegerent (khalifa) on earth; judge between people with truth and do not follow desire'", cluster: david}
  righteous-not-like-corrupt: {label: "Shall God treat believers like those who spread corruption, the godfearing like the wicked?", cluster: theology}
  solomons-steeds-and-missed-remembrance: {label: "Fine steeds shown to Solomon in the evening distract him from remembrance of God until the sun hides; he has them brought back and strokes (or slashes) their legs and necks", cluster: solomon}
  body-placed-on-solomons-throne: {label: "God tested Solomon by placing a body (jasad) on his throne; then he repented", cluster: solomon}
  solomon-asks-unmatched-kingdom: {label: "Solomon asks for a kingdom such as no one after him should have", cluster: solomon}
  demons-chained-in-fetters-for-solomon: {label: "Devils serve Solomon as builders and divers, and others are bound together in fetters", cluster: solomon}
  job-cries-satan-touched-me: {label: "Job calls to his Lord: 'Satan has touched me with weariness and torment'", cluster: job}
  job-strikes-ground-healing-spring: {label: "Job is told to stamp with his foot: a cool spring to wash in and drink appears", cluster: job}
  job-family-restored-and-as-many-more: {label: "God gives Job back his family and as many again with them", cluster: job}
  job-strikes-with-bundle-to-keep-oath: {label: "Job is told to take a bundle of grass or twigs (dighth) in his hand and strike with it, so as not to break his oath", cluster: job}
  patriarchs-of-hands-and-vision: {label: "Abraham, Isaac and Jacob are 'possessors of hands and sight' (power and insight)", cluster: patriarchs}
  elisha-alyasa-named: {label: "Elisha (al-Yasa') is named among the excellent", cluster: prophets}
  ishmael-among-prophets: {label: "Ishmael is named among the chosen prophets", cluster: prophets}
  paradise-gates-open: {label: "The Gardens of Eden have their gates opened for the righteous", cluster: paradise}
  paradise-provision-never-ends: {label: "The provision of paradise never runs out", cluster: paradise}
  damned-groups-no-welcome: {label: "Entering hell, a crowd is greeted by those already there with 'No welcome to them!' and they retort in kind", cluster: hell}
  damned-miss-the-men-they-mocked: {label: "The damned ask 'Why do we not see men we counted among the wicked, whom we mocked?'", cluster: hell}
  dispute-in-high-assembly: {label: "The prophet had no knowledge of the Exalted Assembly when they disputed (over Adam)", cluster: angels}
  adam-made-by-gods-two-hands: {label: "God created Adam 'with my two hands'", cluster: creation}
  iblis-expelled-and-cursed-until-judgment: {label: "Iblis is expelled as accursed (rajim), under God's curse until the Day of Judgment", cluster: satan}
  iblis-vows-to-mislead-all-but-sincere: {label: "Iblis swears by God's might to lead all humans astray except God's sincere servants", cluster: satan}
  prophet-no-pretender: {label: "The prophet asks no wage and is not one of the pretenders (mutakallifin)", cluster: prophets}
  idols-worshipped-as-intermediaries: {label: "Idolaters say 'we worship them only that they may bring us near to God'", cluster: polemic}
  if-god-wanted-a-son-he-would-choose: {label: "Had God wished to take a son he would have chosen from what he creates whatever he willed; glory be to him, the One", cluster: christology}
  night-wound-around-day: {label: "God wraps (yukawwir) the night around the day and the day around the night", cluster: cosmology}
  eight-pairs-of-livestock-sent-down: {label: "God sent down for you eight pairs of livestock", cluster: creation}
  creation-in-womb-in-three-darknesses: {label: "God creates you in your mothers' bellies creation after creation in three darknesses", cluster: creation}
  canopies-of-fire-above-and-below: {label: "The damned have canopies (zulal) of fire above them and below them", cluster: hell}
  paradise-chambers-built-above-chambers: {label: "For the godfearing are lofty chambers with built chambers above them, beneath which rivers flow", cluster: paradise}
  heart-opened-to-islam: {label: "God expands a person's breast (sharh al-sadr) to Islam so he is upon a light from his Lord", cluster: theology}
  skins-shiver-at-recitation: {label: "The Book in paired repetitions (mathani) makes the skins of the godfearing shiver, then their skins and hearts soften", cluster: revelation}
  arabic-quran-without-crookedness: {label: "An Arabic Quran without any crookedness", cluster: revelation}
  parable-slave-of-quarreling-partners: {label: "Parable: a slave owned by quarreling partners versus a slave belonging wholly to one man", cluster: polemic}
  prophet-is-mortal-will-die: {label: "'You will die and they will die', said to the prophet", cluster: prophets}
  god-takes-souls-in-sleep-and-death: {label: "God takes the souls at death and of those not dead in their sleep; he keeps those decreed to die and sends back the others for a set term", cluster: theology}
  intercession-belongs-wholly-to-god: {label: "All intercession belongs to God", cluster: eschatology}
  hearts-shrink-at-gods-name-alone: {label: "When God alone is mentioned the hearts of unbelievers shrink with aversion; at mention of others they rejoice", cluster: polemic}
  wealth-gained-through-own-knowledge-claim: {label: "Given a blessing, man says 'I was given it only because of my knowledge'; it is a trial", cluster: wisdom}
  do-not-despair-god-forgives-all-sins: {label: "'O my servants who have transgressed against themselves, do not despair of God's mercy; God forgives all sins'", cluster: theology}
  regret-of-soul-too-late: {label: "Lest a soul say 'Alas for my neglect of God' or 'If only I had another chance (karra)'", cluster: eschatology}
  keys-of-heavens-and-earth: {label: "To God belong the keys (maqalid) of the heavens and the earth", cluster: theology}
  shirk-voids-all-deeds: {label: "If you associate partners with God your deeds will come to nothing", cluster: theology}
  earth-in-gods-grip-heavens-folded-in-right-hand: {label: "On the Day of Resurrection the whole earth is in God's grip and the heavens folded in his right hand", cluster: eschatology}
  two-trumpet-blasts-swoon-and-rising: {label: "At the first trumpet blast all in heaven and earth swoon (sa'iqa) except whom God wills; at the second they stand looking", cluster: resurrection}
  book-placed-prophets-and-witnesses-brought: {label: "The Book (record) is laid down, the prophets and witnesses are brought, and judgment is passed with truth", cluster: eschatology}
  driven-in-throngs-to-hell-and-garden: {label: "Unbelievers are driven to hell in throngs (zumar) and the godfearing to the Garden in throngs; the gates open and the keepers address each", cluster: eschatology}
  keepers-of-hell-question-damned: {label: "The keepers of hell ask 'Did not messengers from among you come to you?'", cluster: hell}
  keepers-of-garden-greet-with-peace: {label: "The keepers of the Garden greet the righteous 'Peace be upon you, you have been good; enter'", cluster: paradise}
  blessed-inherit-the-earth-of-paradise: {label: "The blessed praise God who gave them the land (ard) as inheritance to settle in the Garden where they will", cluster: paradise}
  angels-encircle-throne-praising: {label: "The angels are seen surrounding the Throne, glorifying the praise of their Lord", cluster: angels}
  divine-names-cluster-forgiver-accepter-of-repentance: {label: "God as Forgiver of sin, Accepter of repentance, Severe in punishment, Possessor of bounty (string of divine epithets)", cluster: theology}
  throne-bearers-ask-forgiveness-for-believers: {label: "The angels who bear the Throne and those around it glorify God and ask forgiveness for the believers, praying they and their righteous kin enter Eden", cluster: angels}
  damned-confess-two-deaths-two-lives: {label: "The damned say 'Lord, you caused us to die twice and gave us life twice; we confess our sins; is there a way out?'", cluster: eschatology}
  spirit-cast-on-whom-god-wills: {label: "God casts the Spirit (al-ruh) of his command upon whom he wills of his servants to warn of the Day of Meeting", cluster: revelation}
  whose-is-the-kingdom-today: {label: "On the Day God asks 'Whose is the kingdom today?' and answers 'God's, the One, the Overpowering'", cluster: eschatology}
  day-of-the-approaching: {label: "The Day of the Approaching (al-azifa) when hearts reach the throats, choking", cluster: eschatology}
  god-knows-treachery-of-eyes: {label: "God knows the treachery of the eyes and what the breasts conceal", cluster: theology}
  pharaoh-haman-korah-call-moses-sorcerer: {label: "Moses is sent to Pharaoh, Haman and Qarun, who call him 'a lying sorcerer'", cluster: exodus}
  pharaoh-orders-killing-sons-of-believers: {label: "After Moses comes, Pharaoh's people order: kill the sons of those who believe with him and spare their women", cluster: exodus}
  pharaoh-wishes-to-kill-moses: {label: "Pharaoh says 'Let me kill Moses and let him call on his Lord; I fear he will change your religion'", cluster: exodus}
  believer-of-pharaohs-family: {label: "A believing man of Pharaoh's family who concealed his faith defends Moses: 'Will you kill a man for saying my Lord is God?'", cluster: exodus}
  if-he-lies-it-is-on-him: {label: "Argument of caution: if he is a liar his lie is upon him; if truthful, some of what he threatens will strike you", cluster: wisdom}
  pharaoh-i-show-you-only-what-i-see: {label: "Pharaoh: 'I show you only what I see, and guide you only to the right path'", cluster: exodus}
  day-of-mutual-calling: {label: "The Day of Mutual Calling (yawm al-tanad)", cluster: eschatology}
  joseph-came-before-with-clear-signs: {label: "Joseph had come to the Egyptians with clear proofs; when he died they said God would send no messenger after him", cluster: joseph}
  pharaoh-orders-haman-to-build-tower: {label: "Pharaoh orders Haman to build him a lofty tower (sarh) to reach the ways of heaven and look at Moses' God", cluster: exodus}
  pharaohs-people-shown-the-fire-morning-and-evening: {label: "Pharaoh's people are exposed to the Fire morning and evening (before the Hour), then made to enter the severest punishment", cluster: hell}
  damned-ask-keepers-to-intercede-for-relief: {label: "The damned ask the keepers of hell to pray their Lord to lighten the punishment by a day; they are told 'then pray yourselves'", cluster: hell}
  call-on-me-i-will-answer: {label: "Your Lord said 'Call on me and I will answer you'", cluster: ritual}
  god-shaped-you-and-made-your-forms-good: {label: "God shaped you and made your forms good", cluster: creation}
  stages-dust-drop-clot-child-old-age: {label: "From dust, then a drop, then a clinging clot ('alaqa), then a child, then full strength, then old age; some die before", cluster: creation}
  damned-dragged-in-chains-through-boiling-water: {label: "With collars and chains on their necks the damned are dragged through boiling water and then set ablaze in the fire", cluster: hell}
  false-gods-vanish-from-damned: {label: "Asked where their partners are, the damned say 'they have strayed from us; we called on nothing before'", cluster: eschatology}
  some-messengers-told-some-not: {label: "Of the messengers before you, some we have related to you and some we have not", cluster: prophets}
  hearts-veiled-ears-heavy-curtain-between: {label: "Rejecters say 'our hearts are in coverings, in our ears is deafness, and between us and you is a veil (hijab)'", cluster: polemic}
  prophet-a-human-like-you: {label: "'I am only a human being like you; it is revealed to me that your God is one God'", cluster: prophets}
  earth-in-two-days-provisions-in-four-heavens-in-two: {label: "God created the earth in two days, set mountains and measured its provisions in four days, then made the seven heavens in two days", cluster: creation}
  heaven-was-smoke: {label: "God turned to the heaven while it was smoke (dukhan)", cluster: creation}
  heaven-and-earth-come-willingly: {label: "God says to heaven and earth 'Come willingly or unwillingly', and they answer 'We come willingly'", cluster: creation}
  each-heaven-given-its-command: {label: "God revealed to each heaven its command (amr) and adorned the lowest heaven with lamps and protection", cluster: cosmology}
  thunderbolt-like-ad-and-thamud: {label: "Warning of a thunderbolt (sa'iqa) like the thunderbolt of 'Ad and Thamud", cluster: punishment}
  ad-boast-who-is-mightier: {label: "'Ad grow arrogant: 'Who is mightier than us in strength?'", cluster: punishment}
  howling-wind-on-ill-omened-days: {label: "God sent upon 'Ad a howling cold wind (sarsar) on ill-omened days (ayyam nahisat)", cluster: punishment}
  thamud-preferred-blindness-to-guidance: {label: "Thamud were guided but preferred blindness to guidance, and the thunderbolt of humiliating punishment seized them", cluster: punishment}
  skins-testify-against-damned: {label: "At the fire their hearing, sight and skins testify against them; the skins answer 'God who gave speech to all things made us speak'", cluster: eschatology}
  evil-companions-assigned: {label: "God assigned to them companions (quarana') who made their deeds seem fair", cluster: satan}
  talk-noisily-over-recitation: {label: "Unbelievers say 'Do not listen to this Quran; make noise (laghw) during it so you may prevail'", cluster: polemic}
  damned-want-to-trample-misleaders: {label: "The damned ask to be shown the jinn and humans who misled them so they may put them beneath their feet", cluster: hell}
  angels-descend-on-steadfast-fear-not: {label: "Angels descend on those who say 'Our Lord is God' and stand firm: 'Fear not, grieve not, rejoice in the Garden'", cluster: angels}
  do-not-prostrate-to-sun-or-moon: {label: "Do not prostrate to the sun or the moon but to God who created them", cluster: polemic}
  falsehood-cannot-approach-the-book: {label: "Falsehood cannot approach the Book from before it or behind it", cluster: revelation}
  quran-healing-for-believers: {label: "The Quran is guidance and healing (shifa') for believers; for others deafness and blindness", cluster: revelation}
  partners-disown-on-day-we-have-no-witness: {label: "On the Day God calls 'Where are my partners?', they answer 'We declare to you none of us is a witness'", cluster: eschatology}
  fruit-from-sheaths-known-to-god: {label: "No fruit comes out of its sheath and no female conceives or gives birth but with God's knowledge", cluster: theology}
  man-presumes-reward-in-hereafter: {label: "Given relief, man says 'This is mine; I do not think the Hour will come, and if returned to my Lord I will have the best with him'", cluster: wisdom}
  signs-on-horizons-and-in-selves: {label: "'We will show them our signs on the horizons and in themselves until it is clear to them that it is the truth'", cluster: theology}
units:
  - id: quran-29-trial-of-believers
    tradition: islam
    title: "Believers tested; parents and idolatry; the false offer to carry sins"
    corpus: quran
    original: true
    tagger: Claude (model), reading the Arabic
    read: ["29:1-13"]
    tags:
      - {motif: disconnected-letters-opening, refs: ["29:1"], note: "alif-lam-mim"}
      - {motif: faith-tested-by-trial-fitna, refs: ["29:2", "29:3", "29:10", "29:11"]}
      - {motif: god-tests-patriarch, refs: ["29:3"], note: "generalized: God tests all who claim faith, as he did earlier generations"}
      - {motif: honor-parents-long-life, refs: ["29:8"], note: "'We enjoined on man goodness to his parents' without the promise of long life"}
      - {motif: obey-parents-except-in-idolatry, refs: ["29:8"]}
      - {motif: tempters-offer-to-bear-sins, refs: ["29:12", "29:13"]}
      - {motif: individual-responsibility-for-sin, refs: ["29:12"], note: "the tempters cannot bear the sins of others"}
    hints:
      - "29:8 and 31:14-15 parallel Deut 13:6-10 (do not heed kin who entice to other gods) more than the Decalogue."
      - "29:13 (carrying own loads and others') compare the rabbinic idea that one who causes many to sin bears their sins (m. Avot 5:18)."
  - id: quran-29-noah-950
    tradition: islam
    title: "Noah remains a thousand years less fifty among his people"
    corpus: quran
    original: true
    tagger: Claude (model), reading the Arabic
    read: ["29:14-15"]
    tags:
      - {motif: hero-age-950, refs: ["29:14"], note: "'a thousand years less fifty' spent among his people before the flood, not his total lifespan as in Gen 9:29"}
      - {motif: hero-preaches-to-people, refs: ["29:14"]}
      - {motif: ark-and-survivors-made-a-sign, refs: ["29:15"], note: "'the people of the ship' (ashab al-safina) saved"}
    hints:
      - "Gen 9:29 gives Noah 950 years in total; the Quran puts the 950 years into his mission, compare the 120 years of preaching in Gen. Rab. 30:7 and b. Sanh. 108b."
  - id: quran-29-abraham-preaches
    tradition: islam
    title: "Abraham preaches against idols, is saved from the fire, and Lot believes"
    corpus: quran
    original: true
    tagger: Claude (model), reading the Arabic
    read: ["29:16-27"]
    tags:
      - {motif: idols-cannot-provide-sustenance, refs: ["29:17"]}
      - {motif: god-originates-and-repeats-creation, refs: ["29:19", "29:20"]}
      - {motif: travel-and-see-fate-of-deniers, refs: ["29:20"], note: "here: travel and see how God began creation"}
      - {motif: thrown-into-fire, refs: ["29:24"], note: "his people say 'kill him or burn him'; God saves him from the fire"}
      - {motif: idolatry-as-bond-of-worldly-affection, refs: ["29:25"]}
      - {motif: lot-believes-abraham-and-emigrates, refs: ["29:26"], note: "the speaker 'I am emigrating to my Lord' may be Abraham or Lot"}
      - {motif: migration-from-ur-to-harran, refs: ["29:26"], note: "the emigration (hijra) of Abraham, place unnamed"}
      - {motif: god-of-abraham-isaac-jacob, refs: ["29:27"], note: "Isaac and Jacob 'granted' to Abraham; Jacob as gift alongside Isaac"}
      - {motif: prophecy-and-scripture-in-abrahams-line, refs: ["29:27"]}
    hints:
      - "Abraham in the furnace of Nimrod: Gen. Rab. 38:13, b. Pesah. 118a; Ur Kasdim read as 'fire of the Chaldeans'."
  - id: quran-29-lot
    tradition: islam
    title: "Lot and the destruction of his town"
    corpus: quran
    original: true
    tagger: Claude (model), reading the Arabic
    read: ["29:28-35"]
    tags:
      - {motif: wicked-sodom, refs: ["29:28", "29:29"], note: "'an abomination no one in the worlds committed before you'"}
      - {motif: sodomites-rob-travelers-and-sin-in-assembly, refs: ["29:29"]}
      - {motif: people-dare-prophet-to-bring-punishment, refs: ["29:29"]}
      - {motif: three-divine-visitors, refs: ["29:31"], note: "'our messengers came to Abraham with the good news', number unstated"}
      - {motif: bargaining-for-the-city, refs: ["29:32"], note: "Abraham objects 'Lot is in it'; reduced to a single exchange"}
      - {motif: angels-lodge-with-lot, refs: ["29:33"]}
      - {motif: host-distressed-by-angelic-guests, refs: ["29:33"]}
      - {motif: wife-turned-to-pillar-of-salt, refs: ["29:32", "29:33"], note: "only 'she is among those who stay behind' (ghabirin); no pillar of salt"}
      - {motif: fire-and-brimstone-from-heaven, refs: ["29:34"], note: "a 'rijz from the sky'"}
      - {motif: overthrow-of-sodom-and-gomorrah-as-paradigm, refs: ["29:35"], note: "a clear sign left of it for people who reason"}
    hints:
      - "The robbery of travelers by the Sodomites (29:29) matches rabbinic legends of Sodom's cruelty to wayfarers (b. Sanh. 109a-b, the Procrustean bed)."
  - id: quran-29-destroyed-nations
    tradition: islam
    title: "Midian, Ad, Thamud, Korah, Pharaoh and Haman punished"
    corpus: quran
    original: true
    tagger: Claude (model), reading the Arabic
    read: ["29:36-40"]
    tags:
      - {motif: shuayb-sent-to-midian, refs: ["29:36"]}
      - {motif: found-dead-prostrate-in-homes, refs: ["29:37"], note: "by the rajfa (quake)"}
      - {motif: punished-peoples-list, refs: ["29:38"], note: "their dwellings are visible to the hearers"}
      - {motif: korah-pharaoh-haman-trio, refs: ["29:39"]}
      - {motif: catalogue-of-punishments-of-nations, refs: ["29:40"]}
