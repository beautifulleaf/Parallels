new_motifs:
  disconnected-letters-opening: {label: "A surah opens with disconnected letters (al-muqatta'at) whose meaning is not given", cluster: quran-form}
  deeds-weighed-in-scales: {label: "Deeds are weighed on judgment day; heavy scales mean salvation, light scales loss", cluster: eschatology}
  town-destroyed-by-night-or-at-midday-rest: {label: "Divine punishment falls on a town by night or while its people take the midday rest", cluster: punishment-stories}
  messengers-and-peoples-both-questioned: {label: "On judgment day both the peoples and the messengers sent to them are interrogated", cluster: eschatology}
  doomed-confess-wrongdoing-too-late: {label: "When punishment comes the doomed can only confess 'we were wrongdoers', too late", cluster: punishment-stories}
  angels-commanded-to-prostrate-to-adam: {label: "God commands the angels to prostrate before the first man, and they do", cluster: primeval}
  devil-refuses-to-bow-to-adam: {label: "The devil (Iblis) alone refuses to bow to the first man", cluster: primeval}
  fire-superior-to-clay-argument: {label: "The devil argues he is better than man because he was made of fire and man of clay", cluster: primeval}
  devil-granted-respite-until-resurrection: {label: "The devil asks for and is granted respite until the day the dead are raised", cluster: primeval}
  devil-vows-to-mislead-humanity: {label: "The expelled devil vows to lie in wait on the straight path and mislead humanity", cluster: primeval}
  devil-attacks-from-four-sides: {label: "The devil will come at humans from before, behind, right and left", cluster: primeval}
  devil-fills-hell-with-followers: {label: "God vows to fill hell with the devil and all who follow him", cluster: primeval}
  devil-whispers-temptation: {label: "Satan whispers (waswasa) to tempt humans", cluster: primeval}
  tempter-promises-angelhood-or-immortality: {label: "The tempter claims the tree is forbidden only lest the couple become angels or immortals", cluster: primeval}
  tempter-swears-he-is-sincere: {label: "The tempter swears an oath to the first couple that he is their sincere adviser", cluster: primeval}
  both-of-first-couple-sin-together: {label: "Man and wife are addressed, tempted and eat together; the woman is not singled out", cluster: primeval}
  first-couple-repents-and-asks-forgiveness: {label: "The first couple confess 'we have wronged ourselves' and ask God's forgiveness", cluster: primeval}
  descent-to-earth-for-a-time: {label: "The first humans are sent down to earth to live and enjoy provision for a time", cluster: primeval}
  live-die-and-rise-from-earth: {label: "On the earth humans live, in it they die, and from it they will be brought out", cluster: eschatology}
  god-sends-down-clothing: {label: "God sends down clothing to cover nakedness, and the 'garment of piety' is better", cluster: primeval}
  devil-stripped-first-couple-of-garments: {label: "Satan pulled off the first couple's garments to show them their nakedness", cluster: primeval}
  devil-and-tribe-see-humans-unseen: {label: "Satan and his tribe see humans from where humans cannot see them", cluster: demonology}
  ancestral-custom-defense: {label: "Unbelievers defend their practice as what they found their fathers doing", cluster: polemic}
  adornment-at-every-place-of-prayer: {label: "Wear your adornment (clothing) at every place of prostration", cluster: ritual}
  eat-and-drink-without-excess: {label: "Eat and drink but do not be excessive", cluster: law}
  good-things-not-forbidden: {label: "God's adornments and good provisions are not forbidden to believers", cluster: law}
  list-of-what-god-forbids: {label: "Short list of what God truly forbids: indecencies open and hidden, sin, oppression, associating partners, false speech about God", cluster: law}
  nation-has-fixed-term: {label: "Every nation has a fixed term that cannot be advanced or delayed by an hour", cluster: providence}
  messengers-from-among-humans: {label: "Messengers are sent to people from among themselves", cluster: prophecy}
  damned-nations-curse-each-other: {label: "Each nation entering hell curses its sister nation", cluster: eschatology}
  followers-demand-double-punishment-for-leaders: {label: "The damned followers ask double punishment for those who misled them; all get double", cluster: eschatology}
  gates-of-heaven-closed-to-arrogant: {label: "The gates of heaven are not opened for those who arrogantly deny the signs", cluster: eschatology}
  camel-through-eye-of-needle: {label: "Impossibility proverb: entering paradise is as possible as a camel (or rope) passing through the eye of a needle", cluster: proverb}
  hell-as-bed-and-covering: {label: "Hell is the damned's bed below and covering above", cluster: eschatology}
  rancor-removed-from-hearts-in-paradise: {label: "God removes all rancor from the hearts of those in paradise", cluster: eschatology}
  rivers-flow-beneath-gardens: {label: "Rivers flow beneath (the dwellers of) the gardens of paradise", cluster: eschatology}
  paradise-inherited-for-deeds: {label: "Paradise is given to the blessed as an inheritance for what they did", cluster: eschatology}
  dialogue-between-paradise-and-hell: {label: "The people of paradise and the people of hell call out to each other across the divide", cluster: eschatology}
  herald-proclaims-curse-on-wrongdoers: {label: "A herald proclaims between paradise and hell: God's curse is on the wrongdoers", cluster: eschatology}
  barrier-between-paradise-and-hell: {label: "A partition (hijab) separates paradise from hell", cluster: eschatology}
  men-on-the-heights-araf: {label: "Men on the heights (al-A'raf) between paradise and hell recognize all by their marks, hoping to enter", cluster: eschatology}
  damned-beg-blessed-for-water: {label: "The damned beg the blessed to pour some water on them and are refused", cluster: eschatology}
  god-forgets-those-who-forgot: {label: "God forgets the damned today as they forgot the meeting of this day", cluster: eschatology}
  damned-ask-to-be-sent-back: {label: "The damned ask for intercessors or to be sent back to do differently", cluster: eschatology}
  no-intercessor-for-damned: {label: "The damned find no intercessors to plead for them", cluster: eschatology}
  god-established-on-throne: {label: "After creating the heavens and earth God established himself on the Throne (istawa 'ala l-'arsh)", cluster: cosmology}
  night-pursues-day: {label: "God makes the night cover the day, pursuing it swiftly", cluster: cosmology}
  pray-humbly-and-secretly: {label: "Call on God humbly and in secret / not aloud", cluster: ritual}
  winds-herald-mercy-rain: {label: "God sends the winds as heralds of his mercy, driving heavy clouds to dead land", cluster: cosmology}
  rain-on-dead-land-as-resurrection-proof: {label: "Rain reviving dead land is the model for how God will bring out the dead", cluster: eschatology}
  good-land-and-bad-land-parable: {label: "Parable: good land yields its plants by God's leave, bad land yields only scantily", cluster: parable}
  worship-god-no-other-god-formula: {label: "Prophet's refrain to his people: 'Worship God; you have no god other than him'", cluster: prophecy}
  chiefs-of-people-reject-prophet: {label: "The chiefs (al-mala') of the prophet's people accuse him of error or folly and reject him", cluster: prophecy}
  people-marvel-messenger-is-man-among-them: {label: "People marvel that a reminder came through a man from among them", cluster: prophecy}
  prophet-as-sincere-adviser: {label: "Prophet calls himself his people's sincere and trustworthy adviser (nasih amin)", cluster: prophecy}
  destroyed-as-blind-people: {label: "The drowned/destroyed were a blind people", cluster: punishment-stories}
  ad-successors-of-noahs-people: {label: "A later people (Ad, then Thamud) are made successors on the earth after a destroyed people", cluster: punishment-stories}
  people-of-ad-great-stature: {label: "The people of Ad are given increased stature (bastatan fi l-khalq)", cluster: punishment-stories}
  gods-are-mere-names: {label: "False gods are only names the people and their fathers invented, with no authority from God", cluster: polemic}
  wait-and-see-challenge: {label: "Prophet tells deniers 'Wait, I too am waiting'", cluster: prophecy}
  root-of-deniers-cut-off: {label: "God cuts off the last remnant (root, dabir) of a people who denied", cluster: punishment-stories}
  she-camel-of-god: {label: "A she-camel of God is given as a sign; she must be left to graze unharmed", cluster: thamud}
  she-camel-hamstrung: {label: "The people hamstring (slaughter) God's she-camel and so seal their doom", cluster: thamud}
  houses-carved-in-mountains: {label: "A people carve houses out of the mountains and build palaces on the plains", cluster: thamud}
  arrogant-elite-vs-weak-believers: {label: "The arrogant elite confront the weak (mustad'afun) who believed the prophet", cluster: prophecy}
  people-dare-prophet-to-bring-punishment: {label: "Deniers dare the prophet: 'Bring us what you threaten, if you are truthful'", cluster: prophecy}
  destroyed-by-earthquake: {label: "A people is destroyed by an earthquake/tremor (al-rajfa)", cluster: punishment-stories}
  found-dead-prostrate-in-homes: {label: "Morning finds the destroyed lying prostrate (jathimin) in their dwellings", cluster: punishment-stories}
  prophet-turns-away-from-destroyed-people: {label: "The prophet turns from his destroyed people: 'I conveyed the message and advised you'", cluster: prophecy}
  unprecedented-sin: {label: "A people commit an indecency no one in the world did before them", cluster: punishment-stories}
  sodomites-lust-for-men: {label: "Lot's people come to men with desire instead of women", cluster: lot}
  expel-them-for-being-pure: {label: "The townspeople resolve to expel the righteous family because 'they keep themselves pure'", cluster: lot}
  lots-wife-among-those-left-behind: {label: "Lot's wife is among those who stay behind and perish", cluster: lot}
  do-not-sit-on-every-road-threatening: {label: "The prophet forbids his people to lie in wait on every road, threatening and turning people from God's way", cluster: prophecy}
  return-to-our-religion-or-be-expelled: {label: "The elite threaten the prophet and believers: expulsion unless they return to the old religion", cluster: prophecy}
  as-if-they-had-never-dwelt-there: {label: "The destroyed are as if they had never lived in their land", cluster: punishment-stories}
  adversity-then-prosperity-then-sudden-seizure: {label: "God tries towns with hardship, then with ease, then seizes them suddenly", cluster: providence}
  blessings-of-heaven-and-earth-for-faith: {label: "If the towns had believed God would have opened blessings from heaven and earth", cluster: providence}
  gods-plan-outwits-schemers: {label: "God's plotting (makr / kayd) outwits the schemers; none is safe from it but the losers", cluster: providence}
  god-seals-hearts-of-unbelievers: {label: "God seals (tab') the hearts of deniers so they do not hear", cluster: providence}
  most-found-faithless-to-covenant: {label: "Most of the peoples were found without fidelity to their covenant", cluster: covenant}
  magicians-ask-for-reward: {label: "The court magicians ask the king for a reward if they win and are promised closeness", cluster: exodus}
  magicians-offer-who-throws-first: {label: "The magicians offer the prophet to throw first; he tells them to throw", cluster: exodus}
  magic-bewitches-peoples-eyes: {label: "The magicians' spell bewitches the people's eyes and terrifies them", cluster: exodus}
  magicians-converted-prostrate: {label: "The defeated court magicians fall prostrate and believe in the God of Moses and Aaron", cluster: exodus}
  tyrant-threatens-cross-amputation-and-crucifixion: {label: "The tyrant threatens to cut off hands and feet on opposite sides and crucify the converts", cluster: exodus}
  martyrs-pray-for-patience: {label: "Threatened believers say 'to our Lord we return' and pray for patience and to die as muslims", cluster: martyrdom}
  pharaohs-own-gods: {label: "Pharaoh is said to have his own gods, whom Moses would make him abandon", cluster: exodus}
  egypt-struck-with-years-of-scarcity: {label: "Pharaoh's people are struck with years of drought and lack of fruits before the plagues", cluster: exodus}
  enemies-blame-misfortune-on-prophet-as-omen: {label: "Enemies attribute their misfortune to the prophet as a bad omen (tatayyur); their omen is with God", cluster: exodus}
  plague-of-flood-tufan: {label: "One of the Egyptian plagues is a flood (tufan)", cluster: exodus}
  people-ask-for-idol-like-other-nations: {label: "After crossing the sea the people see idol-worshipers and ask the prophet for a god like theirs", cluster: exodus}
  thirty-plus-ten-nights: {label: "The appointed time on the mountain is thirty nights completed with ten more, making forty", cluster: sinai}
  mountain-crumbles-at-theophany: {label: "When God manifests himself to the mountain it is crushed to dust", cluster: sinai}
  prophet-faints-at-theophany: {label: "The prophet falls down unconscious at the theophany and repents on waking", cluster: sinai}
  you-shall-not-see-me: {label: "God answers the prophet's request to see him: 'You will not see me'", cluster: sinai}
  tablets-contain-everything: {label: "The tablets contain an exhortation and an explanation of all things", cluster: sinai}
  calf-lows: {label: "The idol calf is a body that makes a lowing sound (khuwar)", cluster: sinai}
  idol-cannot-speak-or-guide: {label: "The idol cannot speak to its worshipers or guide them", cluster: polemic}
  prophet-seizes-brothers-head: {label: "The angry prophet seizes his brother by the head (and beard), dragging him", cluster: sinai}
  aaron-pleads-son-of-my-mother: {label: "Aaron pleads 'son of my mother, the people overpowered me and almost killed me'", cluster: sinai}
  tablets-taken-up-again: {label: "When his anger subsides the prophet takes up the cast-down tablets again, their text intact", cluster: sinai}
  seventy-seized-by-quake: {label: "The seventy chosen men are seized by a tremor at the appointed meeting", cluster: sinai}
  mercy-encompasses-all-things: {label: "God's mercy encompasses all things", cluster: theology}
  unlettered-prophet: {label: "The awaited messenger is 'the unlettered prophet' (al-nabi al-ummi)", cluster: polemic}
  prophet-foretold-in-torah-and-gospel: {label: "The coming prophet is found written in the Torah and the Gospel", cluster: polemic}
  burdens-and-fetters-removed: {label: "The new prophet removes the burdens and fetters (isr, aghlal) laid on the earlier community", cluster: law}
  messenger-to-all-humanity: {label: "The messenger is sent to all humankind", cluster: prophecy}
  righteous-faction-among-israel: {label: "Among Moses' people is a community that guides by the truth and acts justly by it", cluster: polemic}
  twelve-springs-from-rock: {label: "Twelve springs gush from the struck rock, one drinking place for each tribe", cluster: wilderness}
  enter-gate-prostrating-saying-hitta: {label: "Israel is told to enter the town through the gate prostrating and saying 'hitta' (relief/forgiveness)", cluster: wilderness}
  wrongdoers-change-the-word: {label: "The wrongdoers replace the word they were told with another, and a plague falls from heaven", cluster: wilderness}
  sabbath-fish-test: {label: "Fish come openly to a seaside town on the Sabbath but not on other days, as a test", cluster: sabbath}
  three-factions-at-sabbath-town: {label: "Sabbath-breakers, those who rebuke them and those who ask why bother rebuking a doomed people", cluster: sabbath}
  transgressors-turned-into-apes: {label: "Transgressors are turned into despised apes", cluster: sabbath}
  oppressors-sent-against-israel-until-judgment: {label: "God proclaims he will send against them until resurrection those who inflict harsh punishment", cluster: polemic}
  heirs-of-book-take-worldly-gain: {label: "Later heirs of the scripture take worldly gain and say 'we will be forgiven'", cluster: polemic}
  mountain-raised-over-israel: {label: "God raises the mountain over Israel like a canopy, and they think it will fall on them, as they take the covenant", cluster: sinai}
  primordial-covenant-of-descendants: {label: "God takes all Adam's descendants from their loins and makes them testify 'Am I not your Lord?' ('Yes')", cluster: covenant}
  no-excuse-from-ancestors-sin: {label: "No one may excuse himself on judgment day because his ancestors associated partners", cluster: covenant}
  apostate-scholar-sloughs-off-signs: {label: "A man given God's signs sloughs them off, clings to the earth and follows his desire", cluster: parable}
  panting-dog-parable: {label: "Parable: like a dog that pants whether you chase it or leave it", cluster: parable}
  many-jinn-and-humans-made-for-hell: {label: "God has created many jinn and humans for hell", cluster: providence}
  worse-than-cattle: {label: "The heedless are like cattle, or even more astray", cluster: polemic}
  most-beautiful-names-of-god: {label: "To God belong the most beautiful names; call on him by them", cluster: theology}
  gradual-leading-to-ruin: {label: "God leads deniers step by step to ruin and grants them respite (istidraj)", cluster: providence}
  prophet-not-possessed: {label: "Defense of the prophet: there is no madness (jinna) in your companion; he is only a warner", cluster: polemic}
  hour-known-only-to-god: {label: "Knowledge of the Hour is with God alone; it will come suddenly", cluster: eschatology}
  prophet-does-not-know-unseen: {label: "The prophet disclaims knowledge of the unseen and power over benefit or harm", cluster: prophecy}
  created-from-single-soul-and-its-mate: {label: "Humankind is created from a single soul, from which its mate was made to dwell with it", cluster: primeval}
  couple-vow-then-associate-partners: {label: "A couple vow thanks for a sound child, then ascribe partners to God in what he gave", cluster: polemic}
  idols-have-no-limbs-or-senses: {label: "Taunt: do the idols have feet to walk, hands to grasp, eyes to see, ears to hear?", cluster: polemic}
  idols-are-servants-like-you: {label: "Those you call on besides God are servants like yourselves", cluster: polemic}
  challenge-idols-to-plot: {label: "Prophet challenges the idolaters to call their partners and plot against him without delay", cluster: polemic}
  seek-refuge-from-satans-prompting: {label: "When an evil prompting from Satan stirs you, seek refuge in God", cluster: demonology}
  listen-silently-to-recitation: {label: "When the Quran is recited, listen and be silent", cluster: ritual}
  remember-god-quietly-morning-and-evening: {label: "Remember God within yourself, humbly, without loud speech, morning and evening", cluster: ritual}
  angels-near-god-prostrate: {label: "Those near God do not disdain to worship him; they glorify him and prostrate", cluster: angelology}
  prostration-verse: {label: "A verse at which reciters customarily prostrate (sajda)", cluster: quran-form}
  spoils-belong-to-god-and-messenger: {label: "The spoils of war (anfal) belong to God and the messenger", cluster: war-law}
  believers-hearts-tremble-at-gods-name: {label: "True believers' hearts tremble when God is mentioned and their faith grows when his verses are recited", cluster: piety}
  reluctant-believers-as-if-driven-to-death: {label: "Some believers dispute the call to battle as if driven to death with their eyes open", cluster: war-law}
  angelic-reinforcement-in-battle: {label: "God reinforces the believers in battle with a thousand (or more) angels", cluster: holy-war}
  slumber-as-security-before-battle: {label: "God covers the fighters with slumber as a security from him before battle", cluster: holy-war}
  rain-purifies-and-steadies-before-battle: {label: "Rain is sent down before battle to purify the fighters, remove Satan's filth and make their feet firm", cluster: holy-war}
  strike-above-necks-and-fingertips: {label: "Angels are told to strike the enemy above the necks and on every finger-tip", cluster: holy-war}
  do-not-turn-backs-in-battle: {label: "Fleeing the battle line is forbidden except as a maneuver or to join another unit", cluster: war-law}
  god-threw-when-you-threw: {label: "'You did not throw when you threw, but God threw': the victory is God's act", cluster: holy-war}
  god-comes-between-man-and-heart: {label: "God comes between a man and his heart", cluster: theology}
  wealth-and-children-are-a-trial: {label: "Wealth and children are a trial (fitna)", cluster: piety}
  furqan-criterion: {label: "God gives the God-fearing a furqan (criterion / deliverance)", cluster: theology}
  plot-to-imprison-kill-or-expel-prophet: {label: "Unbelievers plot to confine, kill or expel the prophet, but God plots too", cluster: sira}
  ancients-fables-accusation: {label: "Unbelievers dismiss the revelation as 'tales of the ancients' (asatir al-awwalin) they could equal", cluster: polemic}
  deniers-ask-for-stones-from-heaven: {label: "Deniers pray: 'If this is the truth from you, rain stones on us from the sky'", cluster: polemic}
  no-punishment-while-prophet-among-them: {label: "God will not punish a people while the prophet is among them or while they seek forgiveness", cluster: providence}
  pagan-worship-whistling-and-clapping: {label: "The pagans' prayer at the House was only whistling and clapping", cluster: ritual}
  wicked-heaped-together-into-hell: {label: "God separates the bad from the good, heaps the bad on one another and casts them into hell", cluster: eschatology}
  past-forgiven-if-they-desist: {label: "If unbelievers desist, what is past is forgiven", cluster: law}
  fight-until-no-persecution: {label: "Fight them until there is no persecution (fitna) and religion is wholly God's", cluster: war-law}
  fifth-of-spoils-for-god: {label: "A fifth of all spoils goes to God, the messenger, kin, orphans, the poor and the wayfarer", cluster: war-law}
  battle-day-as-day-of-criterion: {label: "The day the two hosts met is the 'day of the criterion' (yawm al-furqan)", cluster: sira}
  dream-shows-enemy-few: {label: "God shows the prophet the enemy as few in a dream so the believers will not lose heart", cluster: holy-war}
  each-army-made-to-seem-few-to-other: {label: "God makes each army appear few in the other's eyes so that the battle takes place", cluster: holy-war}
  satan-promises-protection-then-deserts: {label: "Satan promises the army 'no one will defeat you, I am your protector', then turns on his heels when he sees what they cannot", cluster: demonology}
  angels-strike-faces-and-backs-at-death: {label: "Angels take the souls of unbelievers striking their faces and backs", cluster: eschatology}
  god-changes-not-until-people-change: {label: "God does not change a favor he gave a people until they change what is in themselves", cluster: providence}
  custom-of-pharaohs-people: {label: "Unbelievers follow 'the custom of Pharaoh's people' and those before them", cluster: punishment-stories}
  repudiate-treaty-openly: {label: "If a treaty partner is feared treacherous, throw the treaty back to them on equal terms", cluster: war-law}
  prepare-force-and-war-horses: {label: "Prepare against the enemy whatever force and tethered war horses you can, to deter them", cluster: war-law}
  incline-to-peace-if-they-do: {label: "If the enemy inclines to peace, incline to it and trust God", cluster: war-law}
  god-united-hearts: {label: "God united the believers' hearts, which all the wealth on earth could not have done", cluster: providence}
  few-steadfast-defeat-many-ratio: {label: "Twenty steadfast defeat two hundred, a hundred a thousand; later eased to one against two", cluster: holy-war}
  no-captives-until-enemy-subdued: {label: "A prophet should not take captives until he has thoroughly subdued the land", cluster: war-law}
  prior-decree-averted-punishment: {label: "Only a prior decree from God averted punishment for taking ransom", cluster: providence}
  captives-promised-better-than-taken: {label: "Captives with good in their hearts are promised better than what was taken from them", cluster: war-law}
  emigrants-and-helpers-mutual-protectors: {label: "Believers who emigrated and those who sheltered them are each other's allies; non-emigrants are not, unless they ask help in religion", cluster: sira}
  kin-nearer-in-book-of-god: {label: "Blood relatives are nearer to one another (in inheritance) in God's book", cluster: law}
  surah-without-basmala: {label: "A surah begins without the formula 'In the name of God, the Merciful, the Compassionate'", cluster: quran-form}
  disavowal-of-polytheists-proclaimed: {label: "God and his messenger proclaim their disavowal (bara'a) of the polytheists at the greater pilgrimage", cluster: war-law}
  four-months-grace-period: {label: "Treaty partners are given four months to move freely in the land before hostilities", cluster: war-law}
  honor-treaty-until-its-term: {label: "Treaties with those who kept them are honored until their term", cluster: war-law}
  release-those-who-pray-and-give-alms: {label: "If enemies repent, pray and give alms, let them go their way: they are brothers in religion", cluster: war-law}
  asylum-to-hear-gods-word-then-escort: {label: "A polytheist who seeks protection is given asylum to hear God's word, then escorted to safety", cluster: war-law}
  god-punishes-by-believers-hands: {label: "God punishes the enemy by the believers' hands and heals the believers' breasts", cluster: holy-war}
  only-believers-maintain-mosques: {label: "Only those who believe, pray and give alms may maintain God's places of worship", cluster: ritual}
  watering-pilgrims-not-equal-to-faith: {label: "Giving water to pilgrims and tending the Sacred Mosque are not equal to faith and striving", cluster: ritual}
  love-of-god-over-family-and-wealth: {label: "Do not take fathers or brothers as allies against faith; love of God must outweigh family, wealth, trade and homes", cluster: piety}
  pride-in-numbers-fails: {label: "The believers' pride in their great numbers avails nothing and the earth grows narrow for them (Hunayn)", cluster: holy-war}
  sakina-descends: {label: "God sends down his sakina (tranquility, cf. shekhinah) on the prophet and believers", cluster: theology}
  unseen-hosts-aid-believers: {label: "God supports the prophet with hosts (junud) the believers did not see", cluster: holy-war}
  polytheists-impure-barred-from-sanctuary: {label: "Polytheists are impure (najas) and may not approach the Sacred Mosque after this year", cluster: ritual}
  jizya-from-people-of-book: {label: "People of the Book who do not follow the true religion are fought until they pay the jizya, subdued", cluster: war-law}
  jews-called-uzayr-son-of-god: {label: "Polemic: the Jews are said to call 'Uzayr (Ezra?) son of God", cluster: polemic}
  messiah-called-son-of-god-rejected: {label: "Polemic against calling the Messiah son of God", cluster: christology}
  rabbis-and-monks-taken-as-lords: {label: "People of the Book took their rabbis (ahbar) and monks as lords besides God", cluster: polemic}
  extinguish-gods-light-with-mouths: {label: "Opponents wish to put out God's light with their mouths, but God will perfect his light", cluster: polemic}
  religion-made-manifest-over-all: {label: "God sent his messenger with the religion of truth to make it prevail over all religion", cluster: polemic}
  clergy-devour-peoples-wealth: {label: "Many rabbis and monks devour people's wealth wrongfully", cluster: polemic}
  hoarded-gold-brands-hoarders: {label: "Hoarded gold and silver are heated in hell and used to brand the hoarders' foreheads, sides and backs", cluster: eschatology}
  twelve-months-from-creation: {label: "The number of months with God is twelve, in God's book since the day he created heaven and earth", cluster: calendar}
  four-sacred-months: {label: "Four of the twelve months are sacred", cluster: calendar}
  intercalation-nasi-forbidden: {label: "Postponing a sacred month (al-nasi', intercalation) is an increase in unbelief", cluster: calendar}
  god-will-replace-you-with-another-people: {label: "If you do not go forth, God will replace you with another people", cluster: providence}
  second-of-two-in-the-cave: {label: "The prophet is 'the second of two' hiding in the cave, telling his companion 'do not grieve, God is with us'", cluster: sira}
  hypocrites-ask-leave-to-stay-behind: {label: "Hypocrites swear excuses and ask permission to stay behind from the campaign", cluster: hypocrites}
  god-pardons-prophet-for-granting-leave: {label: "God pardons the prophet, asking why he gave the shirkers leave before the truthful were clear", cluster: prophecy}
  nothing-befalls-but-what-god-wrote: {label: "Nothing will befall us except what God has written for us", cluster: providence}
  one-of-two-good-outcomes: {label: "Believers expect one of two good things, victory or martyrdom", cluster: martyrdom}
  grudging-alms-not-accepted: {label: "Alms given grudgingly by unbelievers will not be accepted", cluster: piety}
  wealth-and-children-as-punishment: {label: "God uses the unbelievers' wealth and children to punish them in this life", cluster: providence}
  eight-recipients-of-alms: {label: "Alms go to the poor, the needy, the collectors, those whose hearts are reconciled, slaves, debtors, God's cause and the wayfarer", cluster: law}
  prophet-called-all-ear: {label: "Hypocrites mock the prophet as 'all ear' (udhun), credulous", cluster: hypocrites}
  hypocrites-fear-exposing-revelation: {label: "Hypocrites fear a surah will be revealed exposing what is in their hearts", cluster: hypocrites}
  hypocrites-male-and-female-enjoin-wrong: {label: "Hypocrite men and women enjoin wrong and forbid right and close their hands", cluster: hypocrites}
  roll-of-destroyed-peoples: {label: "Roll call of destroyed peoples: Noah's, Ad, Thamud, Abraham's people, Midian and the overturned cities", cluster: punishment-stories}
  overturned-cities-mutafikat: {label: "The 'overturned cities' (al-mu'tafikat), Lot's towns", cluster: lot}
  gods-good-pleasure-greatest-reward: {label: "God's good pleasure (ridwan) is greater than the gardens of Eden", cluster: eschatology}
  vow-of-charity-if-enriched-then-broken: {label: "Men vow to give alms if God enriches them, then turn miserly, and God sets hypocrisy in their hearts", cluster: hypocrites}
  mockery-of-poor-givers: {label: "Hypocrites mock believers who give voluntarily and those who can give only their effort", cluster: hypocrites}
  seventy-times-forgiveness-useless: {label: "Even if the prophet asks forgiveness for them seventy times God will not forgive them", cluster: prophecy}
  hell-fire-hotter-than-summer-heat: {label: "Shirkers say 'do not go out in the heat'; hell's fire is hotter", cluster: eschatology}
  laugh-little-weep-much: {label: "Let them laugh a little and weep much", cluster: eschatology}
  no-funeral-prayer-for-hypocrites: {label: "The prophet must never pray over a dead hypocrite or stand at his grave", cluster: ritual}
  weeping-volunteers-without-mounts: {label: "Poor volunteers turn away weeping because the prophet has no mounts for them", cluster: holy-war}
  bedouin-harder-in-unbelief: {label: "The Bedouin (al-a'rab) are harder in unbelief and hypocrisy", cluster: hypocrites}
  first-forerunners-of-faith: {label: "The first forerunners (al-sabiqun al-awwalun) among emigrants and helpers: God is pleased with them and they with him", cluster: sira}
  hypocrites-punished-twice: {label: "Hardened hypocrites will be punished twice, then given to great punishment", cluster: eschatology}
  alms-purify-the-giver: {label: "Take alms from their wealth to purify them; the prophet's prayer is a comfort to them", cluster: piety}
  mosque-of-harm: {label: "A rival mosque built for harm, unbelief and division (masjid al-dirar)", cluster: sira}
  mosque-founded-on-piety: {label: "A mosque founded on piety from the first day, with men who love to purify themselves", cluster: ritual}
  building-on-crumbling-cliff-edge: {label: "Parable: one who builds on the brink of a crumbling bank falls with it into hell", cluster: parable}
  god-bought-believers-lives-for-paradise: {label: "God has bought from the believers their lives and wealth for paradise; a promise in Torah, Gospel and Quran", cluster: martyrdom}
  virtues-catalogue-of-believers: {label: "Catalogue of believers: repenting, worshiping, praising, wandering/fasting (sa'ihun), bowing, prostrating, enjoining right", cluster: piety}
  no-forgiveness-prayer-for-polytheist-kin: {label: "Believers may not pray for forgiveness for polytheists, even close kin", cluster: piety}
  abraham-prays-for-father-then-disowns: {label: "Abraham prayed for his father's forgiveness only by a promise, and disowned him when he proved God's enemy", cluster: abraham}
  three-left-behind-forgiven: {label: "The three who stayed behind are forgiven after the earth grew narrow for them and they found no refuge but God", cluster: sira}
  every-hardship-recorded-as-good-deed: {label: "Every thirst, fatigue, hunger, step and valley crossed in God's cause is written as a good deed", cluster: piety}
  some-stay-to-study-religion: {label: "Not all should go out; a party from each group should stay to gain understanding of religion and warn", cluster: law}
  revelation-increases-faith-or-filth: {label: "A revealed surah increases believers in faith and the sick-hearted in filth", cluster: polemic}
  lord-of-the-mighty-throne: {label: "God is 'Lord of the mighty Throne' (rabb al-'arsh al-'azim)", cluster: theology}
units:
  - id: quran-7-opening-scales
    tradition: islam
    title: Opening letters, destroyed towns and the weighing of deeds
    corpus: quran
    original: true
    tagger: Claude (model), reading the Arabic
    read: ["7:1-10"]
    tags:
      - {motif: disconnected-letters-opening, refs: ["7:1"], note: "alif-lam-mim-sad"}
      - {motif: town-destroyed-by-night-or-at-midday-rest, refs: ["7:4"], note: "bayatan aw hum qa'ilun"}
      - {motif: doomed-confess-wrongdoing-too-late, refs: ["7:5"]}
      - {motif: messengers-and-peoples-both-questioned, refs: ["7:6", "7:7"]}
      - {motif: deeds-weighed-in-scales, refs: ["7:8", "7:9"], note: "al-wazn yawma'idhin al-haqq; mawazin heavy or light"}
    hints:
      - "Compare the Egyptian weighing of the heart (Book of the Dead 125), Testament of Abraham 12-13 (A) and Dan 5:27 (tekel)."
  - id: quran-7-adam-iblis
    tradition: islam
    title: The prostration to Adam, Iblis' refusal and the fall
    corpus: quran
    original: true
    tagger: Claude (model), reading the Arabic
    read: ["7:11-25"]
    tags:
      - {motif: human-formed-from-earth, refs: ["7:11", "7:12"], note: "created then shaped (sawwarnakum); Adam from clay (tin)"}
      - {motif: angels-commanded-to-prostrate-to-adam, refs: ["7:11"]}
      - {motif: devil-refuses-to-bow-to-adam, refs: ["7:11", "7:12"]}
      - {motif: fire-superior-to-clay-argument, refs: ["7:12"]}
      - {motif: expulsion-from-mountain-of-god, refs: ["7:13", "7:18"], note: "Iblis is told to descend and leave, disgraced, for his pride (an tatakabbara fiha)"}
      - {motif: devil-granted-respite-until-resurrection, refs: ["7:14", "7:15"]}
      - {motif: devil-vows-to-mislead-humanity, refs: ["7:16"], note: "he blames God: 'because you led me astray'"}
      - {motif: devil-attacks-from-four-sides, refs: ["7:17"]}
      - {motif: devil-fills-hell-with-followers, refs: ["7:18"]}
      - {motif: garden-of-god-in-east, refs: ["7:19"], note: "dwell in the garden; no east, no name Eden here"}
      - {motif: tree-of-knowledge-forbidden, refs: ["7:19", "7:22"], note: "'this tree', unnamed; do not even approach it"}
      - {motif: both-of-first-couple-sin-together, refs: ["7:19", "7:20", "7:22"]}
      - {motif: devil-whispers-temptation, refs: ["7:20"]}
      - {motif: serpent-tempter, refs: ["7:20"], note: "the tempter is al-shaytan, no serpent"}
      - {motif: tempter-promises-angelhood-or-immortality, refs: ["7:20"], note: "cf. Gen 3:5 'you will be like gods'"}
      - {motif: tempter-swears-he-is-sincere, refs: ["7:21"]}
      - {motif: eyes-opened-nakedness-known, refs: ["7:20", "7:22"], note: "saw'at"}
      - {motif: fig-leaf-coverings, refs: ["7:22"], note: "leaves of the garden; species not named"}
      - {motif: hiding-from-god, refs: ["7:22"], note: "God calls to them, 'Did I not forbid you?'; no hiding"}
      - {motif: first-couple-repents-and-asks-forgiveness, refs: ["7:23"]}
      - {motif: expulsion-from-paradise, refs: ["7:24"], note: "ihbitu, plural"}
      - {motif: enmity-serpent-and-woman-seed, refs: ["7:24"], note: "'some of you enemies to others'"}
      - {motif: descent-to-earth-for-a-time, refs: ["7:24"]}
      - {motif: live-die-and-rise-from-earth, refs: ["7:25"]}
    hints:
      - "Compare Life of Adam and Eve (Vita) 12-16, where Satan refuses to worship the image of God; Cave of Treasures 2-3; Gospel of Bartholomew 4."
      - "The respite granted to the devil compares with Jubilees 10:8-9 (Mastema's tenth of the spirits) and Rev 20:2-3."
  - id: quran-7-children-of-adam
    tradition: islam
    title: Children of Adam - clothing, Satan's enmity, what God forbids
    corpus: quran
    original: true
    tagger: Claude (model), reading the Arabic
    read: ["7:26-34"]
    tags:
      - {motif: god-sends-down-clothing, refs: ["7:26"], note: "libas and rish (feathers / finery)"}
      - {motif: garments-of-skin, refs: ["7:26"], note: "God provides clothing, here to all Adam's children"}
      - {motif: devil-stripped-first-couple-of-garments, refs: ["7:27"], note: "implies a covering garment before the fall"}
      - {motif: devil-and-tribe-see-humans-unseen, refs: ["7:27"]}
      - {motif: ancestral-custom-defense, refs: ["7:28"], note: "also 'God commanded us to do it'"}
      - {motif: adornment-at-every-place-of-prayer, refs: ["7:29", "7:31"], note: "traditionally against naked circumambulation of the Ka'ba"}
      - {motif: eat-and-drink-without-excess, refs: ["7:31"]}
      - {motif: good-things-not-forbidden, refs: ["7:32"]}
      - {motif: list-of-what-god-forbids, refs: ["7:33"]}
      - {motif: nation-has-fixed-term, refs: ["7:34"]}
    hints:
      - "The pre-fall garment matches rabbinic/targumic traditions of garments of light or glory (Gen Rab 20:12, 'or' vs 'or)."
  - id: quran-7-paradise-hell-araf
    tradition: islam
    title: Hell's quarrels, the camel and the needle, the people of the Heights
    corpus: quran
    original: true
    tagger: Claude (model), reading the Arabic
    read: ["7:35-53"]
    tags:
      - {motif: messengers-from-among-humans, refs: ["7:35"]}
      - {motif: damned-nations-curse-each-other, refs: ["7:38"], note: "jinn and humans enter together"}
      - {motif: followers-demand-double-punishment-for-leaders, refs: ["7:38", "7:39"]}
      - {motif: gates-of-heaven-closed-to-arrogant, refs: ["7:40"]}
      - {motif: camel-through-eye-of-needle, refs: ["7:40"], note: "hatta yalija l-jamalu fi sammi l-khiyat; jamal also read jummal 'rope'"}
      - {motif: hell-as-bed-and-covering, refs: ["7:41"]}
      - {motif: rancor-removed-from-hearts-in-paradise, refs: ["7:43"]}
      - {motif: rivers-flow-beneath-gardens, refs: ["7:43"]}
      - {motif: paradise-inherited-for-deeds, refs: ["7:43"]}
      - {motif: dialogue-between-paradise-and-hell, refs: ["7:44", "7:50"]}
      - {motif: herald-proclaims-curse-on-wrongdoers, refs: ["7:44"]}
      - {motif: barrier-between-paradise-and-hell, refs: ["7:46"]}
      - {motif: men-on-the-heights-araf, refs: ["7:46", "7:47", "7:48", "7:49"]}
      - {motif: damned-beg-blessed-for-water, refs: ["7:50"]}
      - {motif: god-forgets-those-who-forgot, refs: ["7:51"]}
      - {motif: damned-ask-to-be-sent-back, refs: ["7:53"]}
      - {motif: no-intercessor-for-damned, refs: ["7:53"]}
    hints:
      - "Camel and needle: Matt 19:24 / Mark 10:25 / Luke 18:25; b. Berakhot 55b and b. Bava Metzia 38b (elephant through a needle's eye)."
      - "Water begged across the gulf: Luke 16:19-31 (rich man and Lazarus); 1 Enoch 22 (compartments of the dead); the A'raf compares with the Zoroastrian hamestagan and the Christian limbus."
  - id: quran-7-creation-signs
    tradition: islam
    title: Six days, the Throne, winds and rain as proof of resurrection
    corpus: quran
    original: true
    tagger: Claude (model), reading the Arabic
    read: ["7:54-58"]
    tags:
      - {motif: creation-in-six-days, refs: ["7:54"], note: "no seventh-day rest; followed by God's session on the throne"}
      - {motif: god-established-on-throne, refs: ["7:54"]}
      - {motif: night-pursues-day, refs: ["7:54"]}
      - {motif: luminaries-rule-day-night, refs: ["7:54"], note: "sun, moon and stars subjected (musakhkharat) by his command"}
      - {motif: pray-humbly-and-secretly, refs: ["7:55", "7:56"]}
      - {motif: winds-herald-mercy-rain, refs: ["7:57"]}
      - {motif: rain-on-dead-land-as-resurrection-proof, refs: ["7:57"]}
      - {motif: good-land-and-bad-land-parable, refs: ["7:58"]}
    hints:
      - "Good and bad land: compare the parable of the sower (Mark 4:3-20) and 4 Ezra 8:41."
      - "Rain and resurrection: b. Ta'anit 7a ('the day of rain is greater than the resurrection of the dead'), the second benediction of the Amidah (mashiv ha-ruah)."
  - id: quran-7-noah
    tradition: islam
    title: Noah warns his people
    corpus: quran
    original: true
    tagger: Claude (model), reading the Arabic
    read: ["7:59-64"]
    tags:
      - {motif: hero-preaches-to-people, refs: ["7:59", "7:61", "7:62", "7:63"]}
      - {motif: worship-god-no-other-god-formula, refs: ["7:59"]}
      - {motif: chiefs-of-people-reject-prophet, refs: ["7:60"], note: "'we see you in manifest error'"}
      - {motif: prophet-as-sincere-adviser, refs: ["7:62"]}
      - {motif: people-marvel-messenger-is-man-among-them, refs: ["7:63"]}
      - {motif: reason-rejected-messenger, refs: ["7:64"]}
      - {motif: family-saved, refs: ["7:64"], note: "'him and those with him in the ship'"}
      - {motif: destroyed-as-blind-people, refs: ["7:64"]}
  - id: quran-7-hud-ad
    tradition: islam
    title: Hud and the people of Ad
    corpus: quran
    original: true
    tagger: Claude (model), reading the Arabic
    read: ["7:65-72"]
    tags:
      - {motif: worship-god-no-other-god-formula, refs: ["7:65"]}
      - {motif: chiefs-of-people-reject-prophet, refs: ["7:66"], note: "accused of folly (safaha) and lying"}
      - {motif: prophet-as-sincere-adviser, refs: ["7:68"]}
      - {motif: people-marvel-messenger-is-man-among-them, refs: ["7:69"]}
      - {motif: ad-successors-of-noahs-people, refs: ["7:69"]}
      - {motif: people-of-ad-great-stature, refs: ["7:69"]}
      - {motif: primeval-giant-peoples, refs: ["7:69"], note: "Ad's enlarged stature; interpretation"}
      - {motif: ancestral-custom-defense, refs: ["7:70"]}
      - {motif: people-dare-prophet-to-bring-punishment, refs: ["7:70"]}
      - {motif: gods-are-mere-names, refs: ["7:71"]}
      - {motif: wait-and-see-challenge, refs: ["7:71"]}
      - {motif: root-of-deniers-cut-off, refs: ["7:72"]}
      - {motif: reason-rejected-messenger, refs: ["7:72"]}
    hints:
      - "Ad and Iram are tied by commentators to giant pre-Israelite peoples (Rephaim, Emim, Deut 2:10-11, 20-21)."
  - id: quran-7-salih-thamud
    tradition: islam
    title: Salih, Thamud and the she-camel
    corpus: quran
    original: true
    tagger: Claude (model), reading the Arabic
    read: ["7:73-79"]
    tags:
      - {motif: worship-god-no-other-god-formula, refs: ["7:73"]}
      - {motif: she-camel-of-god, refs: ["7:73"], note: "naqat Allah lakum aya"}
      - {motif: ad-successors-of-noahs-people, refs: ["7:74"], note: "Thamud successors after Ad"}
      - {motif: houses-carved-in-mountains, refs: ["7:74"]}
      - {motif: arrogant-elite-vs-weak-believers, refs: ["7:75", "7:76"]}
      - {motif: she-camel-hamstrung, refs: ["7:77"], note: "'aqaru"}
      - {motif: people-dare-prophet-to-bring-punishment, refs: ["7:77"]}
      - {motif: destroyed-by-earthquake, refs: ["7:78"]}
      - {motif: found-dead-prostrate-in-homes, refs: ["7:78"]}
      - {motif: prophet-turns-away-from-destroyed-people, refs: ["7:79"]}
      - {motif: prophet-as-sincere-adviser, refs: ["7:79"]}
    hints:
      - "Thamud are attested in Assyrian annals (Sargon II) and the Ruwafa inscription; the rock-cut tombs of Hegra (Mada'in Salih) are Nabataean."
  - id: quran-7-lot
    tradition: islam
    title: Lot and his people
    corpus: quran
    original: true
    tagger: Claude (model), reading the Arabic
    read: ["7:80-84"]
    tags:
      - {motif: wicked-sodom, refs: ["7:80", "7:81"], note: "city not named"}
      - {motif: unprecedented-sin, refs: ["7:80"]}
      - {motif: sodomites-lust-for-men, refs: ["7:81"]}
      - {motif: expel-them-for-being-pure, refs: ["7:82"]}
      - {motif: family-saved, refs: ["7:83"]}
      - {motif: lots-wife-among-those-left-behind, refs: ["7:83"], note: "no looking back, no pillar of salt"}
      - {motif: family-member-lost, refs: ["7:83"]}
      - {motif: fire-and-brimstone-from-heaven, refs: ["7:84"], note: "only 'we rained on them a rain'"}
  - id: quran-7-shuayb-midian
    tradition: islam
    title: Shu'ayb and Midian
    corpus: quran
    original: true
    tagger: Claude (model), reading the Arabic
    read: ["7:85-93"]
    tags:
      - {motif: worship-god-no-other-god-formula, refs: ["7:85"]}
      - {motif: just-weights-and-measures, refs: ["7:85"], note: "give full measure (kayl) and weight (mizan)"}
      - {motif: do-not-sit-on-every-road-threatening, refs: ["7:86"]}
      - {motif: return-to-our-religion-or-be-expelled, refs: ["7:88", "7:89"]}
      - {motif: chiefs-of-people-reject-prophet, refs: ["7:88", "7:90"]}
      - {motif: destroyed-by-earthquake, refs: ["7:91"]}
      - {motif: found-dead-prostrate-in-homes, refs: ["7:91"]}
      - {motif: as-if-they-had-never-dwelt-there, refs: ["7:92"]}
      - {motif: prophet-turns-away-from-destroyed-people, refs: ["7:93"]}
    hints:
      - "Shu'ayb of Midian is traditionally identified with Jethro/Reuel (Exod 2-3, 18)."
  - id: quran-7-towns-pattern
    tradition: islam
    title: The pattern of the destroyed towns
    corpus: quran
    original: true
    tagger: Claude (model), reading the Arabic
    read: ["7:94-102"]
    tags:
      - {motif: adversity-then-prosperity-then-sudden-seizure, refs: ["7:94", "7:95"]}
      - {motif: blessings-of-heaven-and-earth-for-faith, refs: ["7:96"]}
      - {motif: town-destroyed-by-night-or-at-midday-rest, refs: ["7:97", "7:98"], note: "asleep at night or playing in the forenoon"}
      - {motif: gods-plan-outwits-schemers, refs: ["7:99"]}
      - {motif: god-seals-hearts-of-unbelievers, refs: ["7:100", "7:101"]}
      - {motif: most-found-faithless-to-covenant, refs: ["7:102"]}
  - id: quran-7-moses-pharaoh
    tradition: islam
    title: Moses before Pharaoh, the magicians and the plagues
    corpus: quran
    original: true
    tagger: Claude (model), reading the Arabic
    read: ["7:103-137"]
    tags:
      - {motif: let-my-people-go-demand, refs: ["7:105"], note: "fa-arsil ma'iya bani isra'il"}
      - {motif: staff-becomes-serpent, refs: ["7:107"], note: "thu'ban mubin"}
      - {motif: hand-turned-leprous-white-as-snow, refs: ["7:108"], note: "hand drawn out white for beholders; no leprosy"}
      - {motif: contest-with-court-magicians, refs: ["7:109", "7:111", "7:112", "7:113"]}
      - {motif: magicians-ask-for-reward, refs: ["7:113", "7:114"]}
      - {motif: magicians-offer-who-throws-first, refs: ["7:115", "7:116"]}
      - {motif: magic-bewitches-peoples-eyes, refs: ["7:116"]}
      - {motif: prophets-staff-swallows-magicians-staffs, refs: ["7:117"], note: "talqafu ma ya'fikun"}
      - {motif: magicians-converted-prostrate, refs: ["7:120", "7:121", "7:122"]}
      - {motif: magicians-fail-finger-of-god, refs: ["7:121"], note: "the magicians go further and convert"}
