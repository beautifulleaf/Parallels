# Quran chunk 4 (surahs 12-19, 752 verses), read in full from the Arabic.
# Surah 12 re-reads the Joseph unit of data/motif-tags/joseph.yaml and reuses its ids.
new_motifs:
  # ---- revelation and scripture
  best-of-stories-revealed: {label: "God tells the prophet 'the best of stories', of which he was unaware before", cluster: revelation}
  news-of-the-unseen-revealed: {label: "A past story is called 'news of the unseen' revealed to a prophet who was not present", cluster: revelation}
  god-guards-the-revelation: {label: "God declares that he sent down the Reminder and will himself guard it", cluster: revelation}
  holy-spirit-brings-revelation: {label: "The Holy Spirit (ruh al-qudus) brings the revelation down from God", cluster: revelation}
  accusation-of-foreign-teacher: {label: "Opponents claim a foreign-tongued man teaches the prophet; answer: this is clear Arabic", cluster: polemic}
  quran-revealed-in-portions: {label: "The scripture is sent down in portions so the prophet recites it to people at intervals", cluster: revelation}
  quran-made-easy-in-prophets-tongue: {label: "God made the scripture easy in the prophet's own tongue to give good news and warn", cluster: revelation}
  book-without-crookedness: {label: "The Book is sent down without any crookedness, straight and upright", cluster: revelation}
  no-changer-of-gods-words: {label: "None can change God's words", cluster: revelation}
  scripture-as-healing: {label: "Scripture is sent down as healing and mercy for believers but only loss for wrongdoers", cluster: revelation}
  god-erases-and-confirms-mother-of-book: {label: "God erases what he wills and confirms, and with him is the Mother of the Book (umm al-kitab)", cluster: revelation}
  every-term-has-a-book: {label: "For every term there is a book (a written decree)", cluster: providence}
  every-town-has-fixed-decree: {label: "No town is destroyed without a known written decree; no nation outstrips its term", cluster: providence}
  every-town-destroyed-before-resurrection: {label: "Every town will be destroyed or severely punished before the Day of Resurrection, as inscribed in the Book", cluster: eschatology}
  people-of-book-rejoice-at-revelation: {label: "Some to whom the Book was given rejoice at the new revelation while factions deny part of it", cluster: polemic}
  scripture-holders-as-witnesses: {label: "Those with knowledge of the earlier Book are invoked as witnesses to the prophet's mission", cluster: polemic}
  those-who-split-the-scripture: {label: "Those who divide scripture into fragments, accepting parts and rejecting others, are condemned", cluster: polemic}
  seven-of-the-oft-repeated: {label: "The prophet is given 'seven of the oft-repeated' (mathani) and the great recitation", cluster: revelation}
  recitation-that-moves-mountains: {label: "Even a recitation that moved mountains, cleft the earth or made the dead speak would not convince the deniers", cluster: polemic}
  wa-dhkur-fi-l-kitab-refrain: {label: "Refrain 'And mention in the Book ...' introducing a series of prophet portraits", cluster: form}
  # ---- prophets and messengers (general)
  messengers-are-men-from-towns: {label: "God sent before only men, inspired, from the people of the towns", cluster: prophecy}
  messengers-despair-then-rescued: {label: "When the messengers despair and think they were lied to, divine help comes and the chosen are saved", cluster: prophecy}
  messengers-had-wives-and-children: {label: "Earlier messengers were given wives and offspring", cluster: prophecy}
  messenger-only-delivers: {label: "The messenger's duty is only to deliver the message; the reckoning belongs to God", cluster: prophecy}
  messenger-speaks-language-of-his-people: {label: "Every messenger is sent speaking the language of his own people to make things clear", cluster: prophecy}
  messenger-only-human: {label: "The prophet declares he is only a human messenger, a mortal like his hearers", cluster: prophecy}
  you-are-only-humans-like-us: {label: "The people reject their messengers: 'you are only humans like us'", cluster: prophecy}
  angel-messenger-only-for-angels: {label: "Were angels walking the earth, God would have sent them an angel as messenger", cluster: prophecy}
  messengers-as-bearers-of-good-news-and-warners: {label: "Messengers are sent only as bearers of good news and warners", cluster: prophecy}
  prophet-called-bewitched: {label: "Opponents say the believers follow only a bewitched man (rajul mashur)", cluster: polemic}
  prophet-nearly-compromises: {label: "Opponents nearly lure the prophet into inventing something else; God makes him firm", cluster: prophecy}
  prophet-grieves-over-unbelievers: {label: "The prophet is told not to destroy himself with grief over those who will not believe", cluster: prophecy}
  prophet-predicts-kings-doom: {label: "The prophet answers the accusing king: 'I think you are doomed'", cluster: exodus}
  prophet-shown-signs-in-vision-journey: {label: "God takes his servant on a journey to show him some of his signs", cluster: prophecy}
  praised-station-of-the-prophet: {label: "The prophet may be raised to a 'praised station' (maqam mahmud), later read as intercession", cluster: eschatology}
  proclaim-openly: {label: "The prophet is commanded to proclaim openly what he is ordered and turn from the polytheists", cluster: prophecy}
  lower-wing-to-believers: {label: "The prophet is told to lower his wing (be gentle) to the believers", cluster: ethics}
  worship-until-certainty-comes: {label: "Worship your Lord until the certainty (death) comes to you", cluster: ritual}
  respite-then-seizure-of-mockers: {label: "Messengers were mocked; God gave the deniers respite, then seized them", cluster: punishment}
  name-your-partner-gods: {label: "Challenge to the polytheists: 'Name them!' (the partners they ascribe to God)", cluster: polemic}
  # ---- Joseph
  jacob-beautiful-patience: {label: "The bereaved father answers with 'beautiful patience' (sabr jamil) and reliance on God", cluster: joseph}
  husband-at-the-door: {label: "Fleeing the seductress, the hero and the woman find her husband at the door", cluster: joseph}
  religion-of-the-fathers-abraham-isaac-jacob: {label: "The hero declares he follows the religion of his fathers Abraham, Isaac and Jacob", cluster: patriarchs}
  soul-commands-evil: {label: "'The soul is ever inciting to evil' (al-nafs al-ammara bi-l-su') except whom God shows mercy", cluster: anthropology}
  reward-of-camel-load-for-finder: {label: "A camel-load is promised to whoever brings back the missing royal cup, with a guarantor", cluster: joseph}
  kings-law-would-not-allow-seizure: {label: "The hero could not have kept his brother under the king's law, so a stratagem is needed", cluster: joseph}
  brother-accused-of-earlier-theft: {label: "Brothers claim the accused youth's absent brother (the hero) had also stolen before", cluster: joseph}
  ask-the-town-and-caravan: {label: "Brothers tell their father to ask the town and the caravan to confirm their story", cluster: joseph}
  father-grieves-for-lost-son: {label: "Father keeps lamenting his lost son for years until his sons fear he will waste away", cluster: joseph}
  father-knows-from-god: {label: "The patriarch claims to know from God what his sons do not know", cluster: joseph}
  do-not-despair-of-gods-mercy: {label: "Do not despair of God's mercy (rawh / rahma); only unbelievers or the astray despair", cluster: theology}
  brothers-beg-for-charity: {label: "Famished brothers bring poor goods and ask the disguised hero for alms", cluster: joseph}
  brothers-confess-sin: {label: "The brothers confess 'we were sinners' once the hero is revealed and ask their father to pray for them", cluster: joseph}
  father-promises-to-pray-forgiveness: {label: "Father promises his repentant sons to ask God's forgiveness for them later", cluster: joseph}
  satan-sows-discord: {label: "Satan stirs up enmity (nazagha) between brothers or among people", cluster: satan}
  # ---- creation, cosmology, signs
  heavens-raised-without-pillars: {label: "God raised the heavens without pillars that you can see", cluster: cosmology}
  sun-and-moon-run-to-appointed-term: {label: "Sun and moon are subjected, each running to an appointed term", cluster: cosmology}
  night-covers-day: {label: "God makes the night cover the day", cluster: cosmology}
  one-water-different-fruits: {label: "Neighboring plots watered with one water give different fruits: a sign", cluster: cosmology}
  thunder-glorifies-god: {label: "The thunder glorifies God with his praise, and the angels too in awe of him", cluster: cosmology}
  thunderbolts-strike-whom-god-wills: {label: "God shows lightning in fear and hope and sends thunderbolts on whom he wills", cluster: cosmology}
  all-in-heaven-and-earth-prostrate-with-shadows: {label: "All in heaven and earth prostrate to God, willingly or unwillingly, even their shadows morning and evening", cluster: cosmology}
  blind-and-seeing-not-equal: {label: "Rhetorical question: are the blind and the seeing equal, or darkness and light?", cluster: form}
  parable-of-foam-on-torrent-and-smelting: {label: "Parable: torrents and smelted metal throw up foam that vanishes, while what benefits people remains", cluster: parable}
  constellations-adorn-sky: {label: "God set constellations (buruj) in the sky and adorned it for beholders", cluster: cosmology}
  all-things-in-due-measure: {label: "God made everything grow in due weight and sends it down only in known measure", cluster: cosmology}
  divine-storehouses-of-all-things: {label: "There is nothing whose storehouses are not with God", cluster: cosmology}
  fertilizing-winds: {label: "God sends the winds as fertilizers (lawaqih), then rain to drink", cluster: cosmology}
  god-gives-life-and-death-and-inherits: {label: "God gives life and death and is the inheritor of the earth and all on it", cluster: theology}
  ships-rivers-sun-moon-subjected: {label: "God has subjected ships, rivers, sun, moon, night and day to human use", cluster: cosmology}
  sun-moon-stars-subjected: {label: "Night, day, sun, moon and stars are subjected by God's command", cluster: cosmology}
  blessings-of-god-uncountable: {label: "If you counted God's blessings you could never number them", cluster: theology}
  cattle-created-for-human-use: {label: "Cattle were created for human warmth, food, burden-bearing and the beauty of herds coming and going", cluster: cosmology}
  horses-mules-donkeys-to-ride: {label: "God made horses, mules and donkeys to ride and for adornment, and creates what you do not know", cluster: cosmology}
  sea-gives-fresh-meat-and-ornaments: {label: "The subjected sea gives fresh meat and ornaments to wear, and ships cleave it", cluster: cosmology}
  stars-for-navigation: {label: "Landmarks and stars are given for finding the way", cluster: cosmology}
  milk-from-between-dung-and-blood: {label: "Pure milk issues from cattle's bellies from between dung and blood: a sign", cluster: cosmology}
  intoxicant-and-good-provision-from-dates-and-grapes: {label: "From palms and vines people take an intoxicant (sakar) and good provision", cluster: cosmology}
  revelation-to-the-bee: {label: "God reveals (awha) to the bee to build in mountains, trees and trellises and follow his paths", cluster: cosmology}
  honey-as-healing: {label: "From the bee's belly comes a drink of many colors in which is healing for people", cluster: cosmology}
  birds-held-up-by-god: {label: "Birds are held aloft in the air of the sky by none but God", cluster: cosmology}
  tents-of-hides-and-shelters: {label: "God gave tents of hides light for travel, wool for furnishings, shade, mountain shelters and garments against heat and violence", cluster: cosmology}
  night-and-day-as-two-signs: {label: "Night and day are two signs; the sign of night is effaced and that of day made bright for reckoning years", cluster: cosmology}
  all-creation-glorifies-god: {label: "The seven heavens, the earth and everything in them glorify God, though humans do not understand their praise", cluster: cosmology}
  creation-with-truth-hour-coming: {label: "Heavens and earth were created only with truth, and the Hour is surely coming", cluster: eschatology}
  creator-can-create-their-like: {label: "The creator of heavens and earth is able to create the like of them (resurrection argument)", cluster: eschatology}
  god-could-replace-humanity: {label: "If God willed he could remove you and bring a new creation", cluster: theology}
  earth-adornment-as-test: {label: "What is on earth is made its adornment to test who is best in deeds", cluster: theology}
  earth-made-barren-dust: {label: "God will reduce all that is on earth to barren dust", cluster: eschatology}
  man-from-drop-becomes-disputant: {label: "Man was created from a drop, yet he becomes an open adversary", cluster: anthropology}
  born-knowing-nothing-given-senses: {label: "God brought you from your mothers' wombs knowing nothing and gave you hearing, sight and hearts", cluster: anthropology}
  return-to-feeblest-age: {label: "Some are returned to the feeblest age (ardhal al-'umur), knowing nothing after knowledge", cluster: anthropology}
  man-prays-for-evil-as-for-good: {label: "Man prays for evil as he prays for good; man is ever hasty", cluster: anthropology}
  man-most-contentious: {label: "Man is the most contentious of all things", cluster: anthropology}
  humans-stingy-even-with-gods-treasuries: {label: "Even owning the treasuries of God's mercy, humans would hold back for fear of spending", cluster: anthropology}
  children-of-adam-honored: {label: "God honored the children of Adam, carried them on land and sea and preferred them above much of creation", cluster: anthropology}
  god-knows-what-womb-carries: {label: "God knows what every female carries and how wombs shrink or swell", cluster: theology}
  guardian-angels-before-and-behind: {label: "Each person has angels in succession (mu'aqqibat) before and behind guarding him by God's command", cluster: angels}
  # ---- theology and polemic
  every-people-has-a-guide: {label: "To every people there is a guide", cluster: prophecy}
  idol-prayer-like-hands-to-water: {label: "Praying to idols is like stretching one's palms to water hoping it will reach one's mouth", cluster: parable}
  gratitude-brings-increase: {label: "God proclaims: if you are grateful I will give you more; if ungrateful, my punishment is severe", cluster: theology}
  god-self-sufficient-if-all-disbelieve: {label: "If you and all on earth disbelieve, God is free of need and praiseworthy", cluster: theology}
  hands-in-mouths-rejection: {label: "The rejecting peoples thrust their hands into their mouths at the messengers", cluster: prophecy}
  god-makes-firm-with-firm-word: {label: "God makes the believers firm with the firm word in this life and the hereafter", cluster: theology}
  one-god-declaration: {label: "Your God is one God (ilahukum ilahun wahid)", cluster: theology}
  do-not-take-two-gods: {label: "God says: do not take two gods; he is only one God", cluster: theology}
  idols-dead-not-living: {label: "The idols create nothing, are themselves created, and are dead, not living", cluster: polemic}
  where-are-my-partners: {label: "On judgment day God asks 'Where are my partners for whom you contended?'", cluster: eschatology}
  fatalist-excuse-of-polytheists: {label: "Polytheists excuse themselves: had God willed we would not have worshipped others nor forbidden anything", cluster: polemic}
  share-of-provision-for-idols: {label: "Idolaters assign to unknown gods a share of what God provided them", cluster: polemic}
  daughters-ascribed-to-god: {label: "The polytheists assign daughters to God while wishing sons for themselves", cluster: polemic}
  angels-as-daughters-of-god-rejected: {label: "Has God chosen sons for you and taken daughters from the angels? A monstrous saying", cluster: polemic}
  other-gods-would-seek-way-to-throne: {label: "If there were other gods they would seek a way to the Lord of the Throne", cluster: polemic}
  intercessors-themselves-seek-means-to-god: {label: "Those whom the polytheists invoke themselves seek a means (wasila) of nearness to God", cluster: polemic}
  idols-disown-worshippers: {label: "On judgment day the false gods disown their worshippers and turn against them", cluster: eschatology}
  worship-of-idols-is-worship-of-satan: {label: "Worshipping idols is worshipping Satan, who rebelled against the Merciful", cluster: polemic}
  call-on-god-in-distress-forget-after: {label: "In distress, at sea or otherwise, people call on God alone, then return to polytheism once rescued", cluster: anthropology}
  god-has-no-namesake: {label: "God has no namesake or equal (samiyy)", cluster: theology}
  call-him-allah-or-al-rahman: {label: "Call on God as Allah or as al-Rahman: to him belong the most beautiful names", cluster: theology}
  god-is-my-lord-and-your-lord: {label: "Jesus declares 'God is my Lord and your Lord, so worship him'", cluster: christology}
  jesus-servant-of-god-given-book-made-prophet: {label: "The infant Jesus declares himself God's servant, given the Book and made a prophet", cluster: christology}
  jesus-son-of-mary-word-of-truth: {label: "'That is Jesus son of Mary, the word of truth about which they dispute'", cluster: christology}
  sects-differ-about-jesus: {label: "The factions differ among themselves about Jesus", cluster: christology}
  claim-that-rahman-took-a-son: {label: "They say 'al-Rahman has taken a son'; it is not fitting for the Merciful", cluster: christology}
  heavens-nearly-split-at-blasphemy: {label: "The heavens nearly burst, the earth splits and mountains collapse at the claim that God has a son", cluster: christology}
  all-creatures-come-to-god-as-servants: {label: "Everyone in the heavens and earth comes to the Merciful only as a servant", cluster: theology}
  love-from-al-rahman-for-believers: {label: "The Merciful will appoint love (wudd) for those who believe and do good", cluster: theology}
  god-extends-rope-to-the-erring: {label: "God lengthens the term of those in error until they see what they were promised", cluster: theology}
  devils-sent-to-incite-unbelievers: {label: "God sends devils against the unbelievers to goad them on", cluster: satan}
  # ---- Satan, Iblis, jinn
  jinn-created-from-fire: {label: "The jinn were created before humans from smokeless or scorching fire", cluster: creation}
  iblis-expelled-and-cursed: {label: "God expels Iblis as accursed (rajim) with a curse until the Day of Judgment", cluster: satan}
  sincere-servants-exempt-from-satan: {label: "Satan has no authority over God's sincere servants, only over those who follow him", cluster: satan}
  iblis-incites-with-voice-cavalry-infantry: {label: "God lets Iblis incite humans with his voice, his cavalry and infantry, sharing their wealth and children", cluster: satan}
  iblis-was-of-the-jinn: {label: "Iblis was one of the jinn and transgressed his Lord's command", cluster: satan}
  iblis-has-offspring: {label: "Iblis has offspring (dhurriyya) whom people take as protectors", cluster: satan}
  satan-disowns-followers: {label: "On judgment day Satan disowns his followers: 'I only called you; blame yourselves'", cluster: satan}
  seek-refuge-from-satan-before-reciting: {label: "Before reciting scripture, seek refuge in God from the accursed Satan", cluster: ritual}
  forgetting-blamed-on-satan: {label: "A forgetting is blamed on Satan", cluster: satan}
  # ---- eschatology
  resurrection-from-dust-doubted: {label: "Deniers ask 'When we are dust (or dead), shall we be created anew?'", cluster: eschatology}
  resurrection-from-bones-and-dust-doubted: {label: "Deniers ask 'When we are bones and fragments, shall we be raised as a new creation?'", cluster: eschatology}
  be-stone-or-iron-you-will-be-raised: {label: "Answer to the deniers: even if you were stone or iron, the one who made you first will raise you", cluster: eschatology}
  oath-that-god-will-not-raise-dead: {label: "Deniers swear their strongest oaths that God will not raise the dead", cluster: eschatology}
  death-from-every-side-yet-no-death: {label: "In hell death comes from every side, yet the damned does not die", cluster: eschatology}
  deeds-like-ashes-in-wind: {label: "The deeds of unbelievers are like ashes blown by the wind on a stormy day", cluster: parable}
  weak-and-arrogant-dispute-in-judgment: {label: "On judgment day the weak followers ask the arrogant leaders to avail them; the leaders cannot", cluster: eschatology}
  god-not-heedless-delays-the-wicked: {label: "God is not heedless; he only delays the wrongdoers to a day when eyes stare", cluster: eschatology}
  eyes-stare-hearts-void: {label: "On that day eyes stare fixed, heads upraised, hearts empty as air", cluster: eschatology}
  damned-ask-for-respite: {label: "The wrongdoers beg for a short respite to answer the call and follow the messengers", cluster: eschatology}
  dwelling-in-homes-of-destroyed: {label: "They lived in the dwellings of those who wronged themselves and saw what God did to them", cluster: punishment}
  scheme-to-move-mountains: {label: "The opponents' scheme was such that mountains might be moved by it", cluster: polemic}
  earth-changed-into-another-earth: {label: "On the last day the earth is changed into another earth, and the heavens too", cluster: eschatology}
  garments-of-pitch-in-hell: {label: "The damned wear garments of pitch (qatiran), fire covering their faces", cluster: eschatology}
  god-swift-in-reckoning: {label: "God is swift in reckoning", cluster: eschatology}
  hell-has-seven-gates: {label: "Hell has seven gates, each with an assigned portion of the damned", cluster: eschatology}
  gardens-and-springs: {label: "The pious are in gardens and springs, entering in peace and security", cluster: eschatology}
  no-fatigue-no-expulsion-from-paradise: {label: "In paradise no fatigue touches them and they are never expelled from it", cluster: eschatology}
  righteous-family-reunited-in-paradise: {label: "The righteous enter paradise together with the righteous among their fathers, spouses and offspring", cluster: eschatology}
  angels-greet-blessed-at-gates-of-paradise: {label: "Angels enter upon the blessed from every gate saying 'Peace be upon you for your patience'", cluster: eschatology}
  tuba-blessedness: {label: "'Tuba' (blessedness, later a tree of paradise) for those who believe and do good", cluster: eschatology}
  angels-take-souls-at-death: {label: "Angels take the souls at death, the wrongdoers protesting and the good greeted with peace", cluster: eschatology}
  gates-of-hell-entered: {label: "The arrogant are told to enter the gates of hell to abide in it", cluster: eschatology}
  misleaders-bear-burdens-of-misled: {label: "Those who mislead bear their own full burdens and some of the burdens of those they misled", cluster: eschatology}
  hour-like-blink-of-eye: {label: "The coming of the Hour is like the blink of an eye, or nearer", cluster: eschatology}
  witness-from-every-nation: {label: "On judgment day a witness is raised from every nation, and the prophet as witness over his own", cluster: eschatology}
  fate-bird-fastened-on-neck: {label: "Every human's 'bird' (ta'ir, fate or omen) is fastened to his neck", cluster: eschatology}
  book-of-deeds-spread-open: {label: "On judgment day each receives a book of his deeds spread open, leaving nothing small or great unrecorded", cluster: eschatology}
  seekers-of-this-world-versus-hereafter: {label: "Those who want the hasty world get some of it and then hell; those who strive for the hereafter are thanked", cluster: eschatology}
  degrees-in-the-hereafter: {label: "The hereafter is greater in degrees and in preference than this world", cluster: eschatology}
  vision-as-trial-and-cursed-tree: {label: "The prophet's vision and the cursed tree in the Quran are made a trial for people", cluster: eschatology}
  each-people-called-with-its-leader: {label: "On judgment day every people is called with its leader (imam)", cluster: eschatology}
  blind-here-blind-hereafter: {label: "Whoever is blind in this world will be blind in the hereafter and further astray", cluster: eschatology}
  damned-gathered-on-faces-blind-dumb-deaf: {label: "The astray are gathered on their faces, blind, dumb and deaf", cluster: eschatology}
  fire-increased-when-it-abates: {label: "Whenever the fire of hell abates, God increases its blaze", cluster: eschatology}
  hell-pavilion-and-molten-drink: {label: "Hell's walls (suradiq) enclose the damned; they are given water like molten metal that scalds faces", cluster: eschatology}
  paradise-gold-bracelets-green-silk-couches: {label: "In paradise the blessed wear gold bracelets and green silk and brocade, reclining on couches", cluster: eschatology}
  earth-laid-bare-all-gathered: {label: "On the last day the earth is seen laid bare and all are gathered, none left out", cluster: eschatology}
  arrayed-in-rows-before-god: {label: "Humans are presented before God in rows, coming as they were first created", cluster: eschatology}
  partners-do-not-answer-gulf-between: {label: "Called on at the judgment, the false partners do not answer; a place of perdition is set between them", cluster: eschatology}
  peoples-surge-like-waves: {label: "At the end peoples surge into one another like waves", cluster: eschatology}
  hell-as-hospitality-for-unbelievers: {label: "Hell is prepared as the unbelievers' hospitality (nuzul)", cluster: eschatology}
  greatest-losers-think-they-do-good: {label: "The greatest losers are those whose efforts went astray while they thought they did good", cluster: eschatology}
  works-weightless-on-judgment-day: {label: "The deniers' works are void; no weight is assigned them on the Day of Resurrection", cluster: eschatology}
  gardens-of-firdaws: {label: "The gardens of Firdaws (paradise) are the believers' hospitality", cluster: eschatology}
  day-of-regret: {label: "The Day of Regret (yawm al-hasra) when the matter is decided", cluster: eschatology}
  provision-morning-and-evening-in-paradise: {label: "In paradise the blessed receive their provision morning and evening", cluster: eschatology}
  damned-kneel-around-hell: {label: "The deniers and the devils are gathered and brought kneeling around hell", cluster: eschatology}
  most-rebellious-of-each-faction-pulled-out: {label: "From every faction God draws out the one most insolent against the Merciful", cluster: eschatology}
  everyone-must-come-to-hell: {label: "Every one of you will come to (pass by) hell; then the pious are rescued", cluster: eschatology}
  unbelievers-boast-finer-assembly: {label: "Unbelievers boast that their side has the better station and finer assembly", cluster: polemic}
  boaster-claims-wealth-and-children-in-hereafter: {label: "A denier boasts he will surely be given wealth and children (in the hereafter)", cluster: polemic}
  each-comes-alone-on-judgment-day: {label: "Each person comes to God alone on the Day of Resurrection", cluster: eschatology}
  pious-gathered-to-rahman-as-delegation: {label: "The pious are gathered to the Merciful as an honored delegation while the guilty are driven to hell like thirsty herds", cluster: eschatology}
  not-a-whisper-remains-of-destroyed-generations: {label: "Of the destroyed generations not one can be perceived nor a whisper heard", cluster: punishment}
  # ---- punishment of peoples, places
  travel-and-see-ruins-of-destroyed: {label: "Travel in the land and see the end of those before you", cluster: punishment}
  affluent-commanded-then-town-destroyed: {label: "When God would destroy a town he commands its affluent ones; they transgress and it is destroyed", cluster: punishment}
  generations-destroyed-after-noah: {label: "How many generations God destroyed after Noah", cluster: punishment}
  building-collapses-from-foundations: {label: "God came at the plotters' building from its foundations and the roof fell on them", cluster: punishment}
  storm-of-stones-or-wind-at-sea: {label: "Threat: God could send a storm of stones on land or a shattering wind at sea", cluster: punishment}
  secure-town-given-garment-of-hunger-and-fear: {label: "Parable of a secure town supplied from everywhere which was ungrateful and was made to taste the garment of hunger and fear", cluster: parable}
  patriarch-afraid-of-guests: {label: "The patriarch tells his unknown guests 'we are afraid of you'", cluster: patriarchs}
  angels-sent-against-criminal-people: {label: "The angelic guests reveal they are sent against a criminal people", cluster: patriarchs}
  flee-by-night-leader-at-rear: {label: "The rescued family leaves by night, the leader following behind them", cluster: patriarchs}
  lot-forbidden-to-host-strangers: {label: "The townsmen remind Lot they had forbidden him to receive outsiders", cluster: patriarchs}
  oath-by-the-prophets-life: {label: "God swears by the prophet's life (la-'amruka)", cluster: form}
  destroying-shout: {label: "The doomed people are seized by the Shout (al-sayha) at dawn or sunrise", cluster: punishment}
  stones-of-baked-clay: {label: "Stones of baked clay (sijjil) rain on the overturned towns", cluster: punishment}
  ruins-on-a-standing-road: {label: "The ruins of the destroyed towns lie on a road still traveled", cluster: punishment}
  people-of-the-thicket: {label: "The people of the Thicket (ashab al-ayka) were wrongdoers and were punished", cluster: punishment}
  # ---- Moses, Israel
  remember-days-of-god: {label: "Moses is told to remind his people of 'the days of God'", cluster: exodus}
  torah-given-to-moses-as-guidance: {label: "God gave Moses the Book as guidance for the Children of Israel", cluster: exodus}
  descendants-of-those-carried-with-noah: {label: "Israel addressed as descendants of those carried with Noah, who was a grateful servant", cluster: flood}
  israel-corrupts-twice-on-earth: {label: "It is decreed in the Book that Israel will work corruption on earth twice", cluster: kingship}
  god-sends-foreign-army-as-punishment: {label: "God sends against Israel servants of his of great might who range through their homes", cluster: kingship}
  restoration-after-first-punishment: {label: "After the first punishment God restores Israel's turn with wealth and sons", cluster: kingship}
  temple-entered-and-destroyed-twice: {label: "The enemy enters the sanctuary (masjid) a second time as the first and destroys all", cluster: kingship}
  if-you-return-we-return: {label: "Divine warning 'if you return (to sin), we will return (to punishment)'", cluster: kingship}
  nine-signs-of-moses: {label: "Moses was given nine clear signs", cluster: exodus}
  israel-dwells-in-land-gathered-at-end: {label: "After Pharaoh's drowning Israel is told to dwell in the land; at the last promise they are gathered in a mixed crowd", cluster: exodus}
  moses-drawn-near-in-confidential-speech: {label: "God called Moses and drew him near in confidential converse (najiyy)", cluster: exodus}
  journey-to-meeting-of-two-seas: {label: "Moses vows to travel until he reaches the meeting of the two seas", cluster: moses-khidr}
  moses-with-young-servant: {label: "Moses travels with his young servant (fata)", cluster: moses-khidr}
  fish-revives-and-escapes-to-sea: {label: "The travelers' provision fish comes to life and slips away into the sea at the destined place", cluster: moses-khidr}
  rock-at-the-meeting-place: {label: "The travelers rest at a rock where the sign occurs", cluster: moses-khidr}
  retrace-steps-to-find-sage: {label: "Realizing the sign, the travelers retrace their footsteps", cluster: moses-khidr}
  servant-with-knowledge-from-god: {label: "A servant of God given mercy and knowledge from God's presence (ilm ladunni)", cluster: moses-khidr}
  disciple-forbidden-to-question-master: {label: "The sage lets the prophet accompany him on condition he asks nothing until told", cluster: moses-khidr}
  sage-scuttles-boat: {label: "The sage holes the boat that carries them", cluster: moses-khidr}
  sage-kills-boy: {label: "The sage kills a boy they meet", cluster: moses-khidr}
  inhospitable-town-refuses-food: {label: "The townspeople refuse the travelers food and hospitality", cluster: moses-khidr}
  sage-rebuilds-falling-wall: {label: "The sage repairs a wall about to collapse in the inhospitable town without payment", cluster: moses-khidr}
  three-strikes-then-parting: {label: "After the third objection master and disciple part", cluster: moses-khidr}
  hidden-reasons-for-sages-deeds-revealed: {label: "The sage explains the hidden reasons for his shocking acts", cluster: moses-khidr}
  tyrant-king-seizes-every-ship: {label: "A king ahead seizes every sound ship by force, so the damaged boat is spared", cluster: moses-khidr}
  child-killed-to-spare-believing-parents: {label: "A boy is killed lest he burden his believing parents with rebellion; God will give them a better child", cluster: moses-khidr}
  orphans-treasure-under-wall: {label: "A wall shelters a treasure belonging to two orphans until they come of age", cluster: moses-khidr}
  merit-of-righteous-father-protects-children: {label: "Because their father was righteous, God protects the orphans' inheritance", cluster: moses-khidr}
  # ---- law and ethics
  keep-covenant-and-join-ties: {label: "The wise keep God's covenant and join the ties he commanded to be joined", cluster: ethics}
  repel-evil-with-good: {label: "The righteous repel evil with good", cluster: ethics}
  curse-on-covenant-breakers: {label: "Those who break God's covenant and sever ties have the curse and the evil abode", cluster: ethics}
  god-enlarges-and-straitens-provision: {label: "God enlarges and restricts provision for whom he wills", cluster: theology}
  hearts-rest-in-remembrance-of-god: {label: "In the remembrance of God hearts find rest", cluster: theology}
  emigrants-for-god-rewarded: {label: "Those who emigrate for God after being wronged will be settled well in this world and rewarded more in the next", cluster: ethics}
  father-ashamed-at-birth-of-daughter: {label: "When told of a daughter's birth the father's face darkens and he hides from people in shame", cluster: law}
  female-infanticide-condemned: {label: "Burying a newborn daughter in the dust is condemned", cluster: law}
  masters-will-not-share-with-slaves: {label: "Masters will not share their provision equally with their slaves (argument against partners to God)", cluster: parable}
  spouses-from-yourselves-sons-and-grandsons: {label: "God made spouses for you from yourselves and from them sons and grandsons", cluster: anthropology}
  parable-of-slave-and-free-man: {label: "Parable: a slave owning nothing compared with a free man who spends secretly and openly", cluster: parable}
  parable-of-mute-man-and-just-man: {label: "Parable: a mute, helpless man who is a burden to his master compared with one who commands justice", cluster: parable}
  justice-kindness-and-giving-to-kin: {label: "God commands justice, kindness and giving to kin, and forbids indecency, wrong and oppression", cluster: ethics}
  keep-oaths-and-covenants: {label: "Fulfill God's covenant and do not break oaths after confirming them or use them for deceit", cluster: law}
  woman-who-unravels-her-yarn: {label: "Do not be like the woman who unravels her yarn into strands after spinning it strong", cluster: parable}
  what-is-with-god-endures: {label: "What you have runs out; what is with God remains", cluster: theology}
  reward-for-male-or-female: {label: "Whoever does good, male or female, and believes, is given a good life and reward", cluster: ethics}
  coerced-disbelief-excused: {label: "One forced to disbelieve while his heart is firm in faith is excused", cluster: law}
  hearts-sealed: {label: "God has sealed (or veiled) their hearts, hearing and sight", cluster: theology}
  four-food-prohibitions: {label: "Only four foods are forbidden: carrion, blood, swine and what is offered to other than God", cluster: law}
  foods-forbidden-to-jews-as-punishment: {label: "Certain foods were forbidden to the Jews because of their own wrongdoing", cluster: law}
  follow-religion-of-abraham: {label: "The prophet is told to follow the religion (milla) of Abraham the hanif", cluster: patriarchs}
  sabbath-imposed-on-those-who-differed: {label: "The Sabbath was imposed only on those who differed about it", cluster: law}
  argue-in-the-best-way: {label: "Call to God's way with wisdom and good counsel and argue in the best way", cluster: ethics}
  retaliation-in-kind-but-patience-better: {label: "If you retaliate, do so in kind; but patience is better", cluster: law}
  decalogue-like-code-in-quran: {label: "A Quranic code of commandments resembling the Decalogue in content", cluster: law}
  do-not-say-uff-to-aged-parents: {label: "Do not say even 'uff' to aged parents nor rebuke them; speak to them gently", cluster: law}
  lower-wing-of-humility-to-parents: {label: "Lower the wing of humility to parents and pray 'Lord, have mercy on them as they raised me when small'", cluster: law}
  give-kin-poor-and-wayfarer-their-due: {label: "Give the kinsman, the poor and the wayfarer their due", cluster: law}
  squanderers-brothers-of-devils: {label: "Squanderers are brothers of the devils", cluster: ethics}
  hand-neither-chained-to-neck-nor-fully-open: {label: "Do not keep your hand chained to your neck nor stretch it out fully: moderation in spending", cluster: ethics}
  do-not-kill-children-for-fear-of-poverty: {label: "Do not kill your children for fear of poverty; God provides for them and you", cluster: law}
  killing-forbidden-except-by-right: {label: "Do not kill the soul God has made sacred except by right", cluster: law}
  orphans-property-protected: {label: "Do not approach the orphan's property except in the best way until he comes of age", cluster: law}
  do-not-follow-what-you-do-not-know: {label: "Do not pursue what you have no knowledge of; hearing, sight and heart will be questioned", cluster: ethics}
  do-not-walk-proudly-on-earth: {label: "Do not walk the earth exultantly: you cannot split the earth nor reach the mountains in height", cluster: ethics}
  say-if-god-wills: {label: "Never say 'I will do it tomorrow' without adding 'if God wills'", cluster: ritual}
  say-what-god-wills: {label: "On entering one's garden one should say 'What God wills; there is no power except in God'", cluster: ritual}
  stay-with-those-who-call-morning-and-evening: {label: "Keep company with those who call on their Lord morning and evening seeking his face", cluster: ethics}
  # ---- prayer and ritual
  prayer-times-in-quran: {label: "Prayer is fixed from the sun's decline to the dark of night, with the dawn recitation", cluster: ritual}
  night-vigil-prayer: {label: "Keep vigil (tahajjud) with recitation in part of the night as an extra devotion", cluster: ritual}
  prayer-for-true-entrance-and-exit: {label: "Prayer: 'Lord, make my entrance and my exit true and grant me a helping authority'", cluster: ritual}
  prayer-voice-neither-loud-nor-silent: {label: "Do not be loud in prayer nor too quiet; seek a way between", cluster: ritual}
  scholars-of-earlier-scripture-prostrate-weeping: {label: "Those given knowledge before fall on their chins prostrate and weeping when the scripture is recited", cluster: polemic}
  prophets-fall-prostrate-weeping-at-recitation: {label: "When the Merciful's verses are recited the prophets fall prostrate and weeping", cluster: ritual}
  later-generation-neglects-prayer-follows-lusts: {label: "After the prophets came a generation that neglected prayer and followed lusts", cluster: ritual}
  angels-descend-with-the-spirit: {label: "God sends down the angels with the spirit of his command upon whom he wills", cluster: angels}
  angels-fear-their-lord-above: {label: "The angels are not arrogant; they fear their Lord above them and do as commanded", cluster: angels}
  angels-descend-only-by-gods-command: {label: "The angels say 'We descend only by your Lord's command'", cluster: angels}
  spirit-is-of-gods-command: {label: "Asked about the spirit, the prophet answers 'The spirit is of my Lord's command'", cluster: theology}
  # ---- Night Journey, demands
  night-journey-to-farthest-mosque: {label: "God carried his servant by night from the Sacred Mosque to the Farthest Mosque", cluster: prophecy}
  demand-for-angels-as-proof: {label: "Opponents demand that the prophet bring the angels if he is truthful", cluster: polemic}
  door-in-heaven-would-be-called-sorcery: {label: "Even if a door of heaven were opened and they ascended, they would say their eyes were bewitched", cluster: polemic}
  demand-for-spring-and-garden: {label: "Opponents demand a spring gushing from the earth or a garden of palms and vines with rivers", cluster: polemic}
  demand-sky-fall-in-pieces: {label: "Opponents demand that the sky fall on them in pieces or God and the angels appear", cluster: polemic}
  demand-house-of-gold: {label: "Opponents demand that the prophet have a house of gold ornament", cluster: polemic}
  demand-ascent-and-book-brought-down: {label: "Opponents demand the prophet ascend to heaven and bring down a book they can read", cluster: polemic}
  # ---- Abraham
  abraham-prays-sons-kept-from-idols: {label: "Abraham prays that he and his sons be kept from worshipping idols", cluster: patriarchs}
  offspring-settled-in-barren-valley-at-sacred-house: {label: "Abraham settles some of his offspring in a barren valley by God's sacred House", cluster: patriarchs}
  hearts-of-people-incline-to-sanctuary: {label: "Abraham prays that people's hearts yearn toward his offspring at the sanctuary", cluster: patriarchs}
  sons-in-old-age-ishmael-and-isaac: {label: "Abraham thanks God for giving him Ishmael and Isaac in old age", cluster: patriarchs}
  son-pleads-with-idolatrous-father: {label: "The son repeatedly and tenderly pleads with his idolatrous father ('O my father')", cluster: patriarchs}
  son-knows-more-than-father: {label: "The son tells his father that knowledge has come to him that has not come to the father", cluster: patriarchs}
  father-threatens-to-stone-son: {label: "The idolatrous father threatens to stone his son and banishes him", cluster: patriarchs}
  abraham-separates-from-his-people: {label: "Abraham withdraws from his people and their gods and is given descendants", cluster: patriarchs}
  tongue-of-truth-honor: {label: "God grants the patriarchs a lofty 'tongue of truth' (lasting renown)", cluster: patriarchs}
  ishmael-true-to-his-promise: {label: "Ishmael was true to his promise and enjoined prayer and alms on his family", cluster: patriarchs}
  idris-raised-to-high-place: {label: "God raised Idris to a high place", cluster: prophecy}
  # ---- Cave
  cave-and-the-inscription: {label: "The companions of the Cave and al-Raqim (an inscription or tablet)", cluster: sleepers}
  youths-flee-idolatrous-people-to-cave: {label: "Believing youths stand against their idolatrous people and take refuge in a cave", cluster: sleepers}
  sleepers-ears-sealed-for-years: {label: "God seals the sleepers' ears (puts them to sleep) in the cave for many years", cluster: sleepers}
  two-parties-dispute-duration: {label: "The sleepers are awakened to show which party best reckoned how long they stayed", cluster: sleepers}
  sun-turns-aside-from-cave: {label: "The sun inclines away from the sleepers' cave at rising and passes them at setting", cluster: sleepers}
  sleepers-seem-awake-turned-side-to-side: {label: "The sleepers seem awake though asleep, and God turns them from side to side", cluster: sleepers}
  dog-at-cave-threshold: {label: "The sleepers' dog lies stretching its forelegs at the cave's threshold", cluster: sleepers}
  sight-of-sleepers-strikes-terror: {label: "Whoever looked upon the sleepers would flee filled with terror", cluster: sleepers}
  sleepers-think-they-slept-a-day: {label: "Woken after centuries, the sleepers think they slept a day or part of a day", cluster: sleepers}
  sleeper-sent-to-town-with-old-coin: {label: "One sleeper is sent to town with their silver coin to buy food discreetly", cluster: sleepers}
  fear-of-stoning-or-forced-reconversion: {label: "The sleepers fear the townspeople will stone them or force them back to their religion", cluster: sleepers}
  sleepers-discovered-as-sign-of-resurrection: {label: "God lets the people discover the sleepers so they know his promise of resurrection is true", cluster: sleepers}
  shrine-built-over-sleepers: {label: "The prevailing party builds a place of worship over the sleepers", cluster: sleepers}
  number-of-sleepers-disputed: {label: "People dispute the sleepers' number (three, five or seven, plus their dog); only God knows", cluster: sleepers}
  sleep-of-309-years: {label: "The sleepers stayed in their cave three hundred years and nine more", cluster: sleepers}
  # ---- two gardens
  parable-of-proud-garden-owner: {label: "Parable of two men: one owns two rich gardens and boasts to his poorer believing companion", cluster: parable}
  rich-man-boasts-wealth-and-followers: {label: "The rich man boasts of having more wealth and a mightier following", cluster: parable}
  rich-man-thinks-wealth-eternal: {label: "The rich man thinks his garden will never perish and the Hour will never come", cluster: parable}
  garden-destroyed-overnight: {label: "The proud man's garden is destroyed and he wrings his hands over what he spent on it", cluster: parable}
  regret-of-polytheist: {label: "The ruined man says 'Would that I had associated no one with my Lord'", cluster: parable}
  wealth-and-sons-adornment-good-deeds-endure: {label: "Wealth and sons are the adornment of this life; the enduring good deeds are better with God", cluster: ethics}
  none-witnessed-creation: {label: "God did not make Satan and his offspring witnesses of the creation of the heavens and earth, nor of their own", cluster: creation}
  # ---- Dhul-Qarnayn
  two-horned-one-world-conqueror: {label: "Dhu l-Qarnayn ('the two-horned') is given power on earth and a way to everything", cluster: dhul-qarnayn}
  sun-sets-in-muddy-spring: {label: "At the place of sunset the conqueror finds the sun setting in a muddy (or hot) spring", cluster: dhul-qarnayn}
  conqueror-chooses-punish-or-treat-kindly: {label: "The conqueror is given the choice to punish the people at the sunset or treat them kindly", cluster: dhul-qarnayn}
  people-at-sunrise-without-shelter: {label: "At the sun's rising the conqueror finds a people with no shelter from it", cluster: dhul-qarnayn}
  people-between-two-barriers-barely-understand-speech: {label: "Between two mountain barriers the conqueror finds a people who scarcely understand speech", cluster: dhul-qarnayn}
  gog-and-magog-spread-corruption: {label: "A people complain that Gog and Magog spread corruption in the land", cluster: dhul-qarnayn}
  tribute-offered-for-barrier: {label: "The people offer tribute for a barrier; the conqueror declines payment and asks for their labor", cluster: dhul-qarnayn}
  iron-and-copper-wall-against-gog: {label: "A barrier of iron blocks filling the gap between two cliffs, heated with bellows and sealed with molten copper, shuts out Gog and Magog", cluster: dhul-qarnayn}
  barrier-leveled-at-appointed-time: {label: "When God's promise comes the barrier is leveled to the ground", cluster: dhul-qarnayn}
  sea-as-ink-for-gods-words: {label: "If the sea were ink for God's words it would run dry before they ran out, even with another sea", cluster: theology}
  # ---- Zechariah, John, Mary
  prayer-in-a-hidden-voice: {label: "A petitioner calls to God in a hidden, secret voice", cluster: ritual}
  bones-weak-head-aflame-with-gray: {label: "Old man's prayer: 'my bones have weakened and my head is aflame with gray'", cluster: childhood}
  priest-fears-for-succession: {label: "The childless priest fears for his kinsmen after him and asks for an heir to the family of Jacob", cluster: childhood}
  name-never-given-before: {label: "The announced son receives a name never given to anyone before", cluster: childhood}
  father-doubts-annunciation-due-to-age: {label: "The aged father asks how he can have a son when his wife is barren and he is very old", cluster: childhood}
  easy-for-god-who-created-from-nothing: {label: "God answers doubt: 'It is easy for me; I created you before when you were nothing'", cluster: childhood}
  muteness-as-sign-of-conception: {label: "As a sign of the promised son the father cannot speak to people for three days or nights", cluster: childhood}
  priest-emerges-from-sanctuary-and-signs: {label: "The mute priest comes out of the sanctuary and signals to the people to glorify God", cluster: childhood}
  child-given-wisdom-as-boy: {label: "The child is given judgment and wisdom while still a boy", cluster: childhood}
  dutiful-to-parents-not-tyrant: {label: "The prophet child is dutiful to his parent(s), not an arrogant tyrant", cluster: childhood}
  peace-on-day-of-birth-death-and-resurrection: {label: "'Peace on him the day he was born, the day he dies and the day he is raised alive'", cluster: childhood}
  mary-withdraws-to-eastern-place: {label: "Mary withdraws from her family to an eastern place behind a screen", cluster: childhood}
  divine-spirit-appears-as-perfect-man: {label: "God's spirit appears to a woman in the form of a well-proportioned man", cluster: angels}
  woman-seeks-refuge-from-visitor: {label: "The woman seeks refuge in God from the mysterious visitor", cluster: childhood}
  annunciation-to-virgin: {label: "A divine messenger announces a son to a virgin untouched by any man", cluster: childhood}
  labor-pains-drive-mother-to-palm-trunk: {label: "Labor pains drive the mother to the trunk of a palm tree", cluster: childhood}
  mother-wishes-she-had-died-and-been-forgotten: {label: "In labor the mother wishes she had died before this and been utterly forgotten", cluster: childhood}
  voice-from-beneath-consoles-mother: {label: "A voice from beneath her consoles the mother: 'do not grieve'", cluster: childhood}
  mother-accused-of-unchastity: {label: "The mother returns with the child and her people accuse her of an enormity", cluster: childhood}
  mary-called-sister-of-aaron: {label: "Mary is addressed as 'sister of Aaron'", cluster: childhood}
  signs-in-heavens-ignored: {label: "People pass by countless signs in the heavens and earth and turn away from them", cluster: theology}
  good-word-like-good-tree: {label: "Parable: a good word is like a good tree, its root firm, its branches in the sky, yielding fruit every season", cluster: parable}
  bad-word-like-uprooted-tree: {label: "Parable: a bad word is like a bad tree uprooted from the earth, with no stability", cluster: parable}
  veil-between-prophet-and-unbelievers: {label: "When the prophet recites, God places a hidden veil between him and those who deny the hereafter", cluster: polemic}
  david-given-the-psalms: {label: "God gave David the Psalms (Zabur)", cluster: kingship}
units:
  - id: quran-12-prologue
    tradition: islam
    title: Prologue to the Joseph surah (the best of stories)
    corpus: quran
    original: true
    tagger: Claude (model), reading the Arabic
    read: ["12:1-3"]
    tags:
      - {motif: disconnected-letters-opening, refs: ["12:1"], note: "alif lām rā"}
      - {motif: arabic-quran, refs: ["12:2"], note: "qurʾānan ʿarabiyyan"}
      - {motif: best-of-stories-revealed, refs: ["12:3"], note: "aḥsan al-qaṣaṣ; the Prophet was 'among the unaware' before it"}

  - id: quran-12-joseph-full
    tradition: islam
    title: Joseph and his brothers (Surah 12, full read)
    corpus: quran
    original: true
    tagger: Claude (model), reading the Arabic
    read: ["12:4-101"]
    tags:
      - {motif: dream-heavenly-bodies-bow, refs: ["12:4"], note: "eleven stars, the sun and the moon prostrating (sājidīn)"}
      - {motif: father-warns-against-telling-dream, refs: ["12:5"], note: "lest they plot; Satan is man's open enemy"}
      - {motif: interpretation-from-god, refs: ["12:6", "12:21", "12:37", "12:101"], note: "taʾwīl al-aḥādīth"}
      - {motif: father-favors-son, refs: ["12:8"], note: "Joseph and his brother are dearer to our father though we are a band (ʿuṣba)"}
      - {motif: brothers-plot-death, refs: ["12:8", "12:9"]}
      - {motif: one-brother-dissuades-killing, refs: ["12:10"], note: "an unnamed speaker (qāʾil minhum)"}
      - {motif: cast-into-pit, refs: ["12:10", "12:15"], note: "ghayābat al-jubb, the depths of the well"}
      - {motif: brothers-persuade-father-to-send, refs: ["12:11", "12:12"], note: "to graze and play"}
      - {motif: divine-reassurance-in-pit, refs: ["12:15"], note: "revelation that he will one day tell them of this deed"}
      - {motif: brothers-weep-to-father, refs: ["12:16"], note: "they come at nightfall (ʿishāʾan)"}
      - {motif: wild-animal-blamed, refs: ["12:13", "12:14", "12:17"], note: "the wolf; Jacob names it first; the brothers say they were racing"}
