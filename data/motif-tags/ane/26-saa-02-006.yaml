      - {motif: turn-neither-right-nor-left, refs: ["SAA 02 006 o:634-636"], note: "inverted: ana imitti u šumēli tallakāni, going to the right or the left means defecting from the king; compare the Deuteronomic formula"}
      - {motif: curse-no-rest-no-sleep-bones-apart, refs: ["SAA 02 006 o:637-639"], note: "as these doves moan (ikkillu ... halālu), may you, your wives, sons and daughters have no rest or sleep"}
      - {motif: curse-no-rest-no-sleep-bones-apart, refs: ["SAA 02 006 o:640"], note: "eṣmātekunu ana ahāiš lū lā iqarribā: may your bones never come near one another"}
      - {motif: curse-heart-empty-like-hole, refs: ["SAA 02 006 o:641-642"]}
      - {motif: curse-no-balm-for-wound, refs: ["SAA 02 006 o:643-645"], note: "when your enemy pierces you, may honey, oil, ginger and cedar-resin be unavailable to put on your wound"}
      - {motif: curse-kin-hunt-and-kill-each-other, refs: ["SAA 02 006 o:646-648"], note: "kī ša martu marratūni: as gall is bitter, may you, your wives, sons and daughters be bitter to one another"}
      - {motif: curse-sun-gods-net-no-escape, refs: ["SAA 02 006 o:649-651"], note: "Šamaš: may a bronze snare (huhāru ša siparri) cover you and your children; cast you into a trap from which there is no escape, not let your life out"}
      - {motif: curse-waterskin-split-die-of-thirst, refs: ["SAA 02 006 o:652-655"], note: "as this waterskin is split and its water poured out, may your waterskin break in a land of severe thirst; die of thirst"}
      - {motif: curse-crawl-on-belly, refs: ["SAA 02 006 o:656-658"], note: "as this sandal is cut, may your sandals be torn in a land of thorns (qaqqar puqutti)"}
      - {motif: curse-sceptre-broken-kingship-overthrown, refs: ["SAA 02 006 o:659"], note: "Enlil, lord of the throne, overturn your throne"}
      - {motif: curse-name-erased-from-tablet-of-fates, refs: ["SAA 02 006 o:660-661"], note: "Nabû, bearer of the tablet of fates of the gods: šumkunu lipšiṭ zērkunu ina māti luhalliq, erase your name, destroy your seed from the land"}
      - {motif: enemy-seed-destroyed, refs: ["SAA 02 006 o:661"]}
    hints:
      - "Do not turn aside to the right or to the left: Deut 5:32, 17:11,20, 28:14; Josh 1:7. Sword devours: Deut 32:42; Jer 46:10."
      - "Warriors become women: Jer 50:37, 51:30; Nah 3:13; Isa 19:16. Moaning like doves: Isa 38:14, 59:11; Ezek 7:16; Nah 2:8."
      - "Bones that do not come together (reversed in Ezek 37:7). No balm in Gilead: Jer 8:22, 46:11; Isa 1:6 (wounds not softened with oil)."
      - "Shaken like a reed in the water: 1 Kgs 14:15. Mutilation of thumbs and toes / blinding: Judg 1:6-7; 2 Kgs 25:7; Judg 16:21."
      - "Gall and wormwood: Deut 29:17 (Heb 29:17-18), 32:32-33. Blot out his name from under heaven: Deut 29:19 (Heb 29:19); Ps 9:6, 109:13."
      - "Overturning the throne of kingdoms: Hag 2:22. A snare/net of God: Ezek 12:13, 17:20; Hos 7:12."
