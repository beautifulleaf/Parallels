  enemy-graves-violated: {label: "The graves of the enemy (Elamite kings) are violated", cluster: war}
  fugitive-rebel-demanded-from-foreign-king: {label: "A fugitive rebel is demanded from or handed over by the foreign king who sheltered him", cluster: war}
  sun-god-saves-wronged-rejects-slander: {label: "The sun god revives the righteous, does not accept slander and saves the wronged", cluster: justice}
  few-made-many: {label: "The few are turned into many", cluster: hymn}
  lips-sweet-as-honey: {label: "The speaker's lips are sweet", cluster: hymn}
  luxury-produce-catalogue: {label: "A catalogue of choice products (pomegranates, ghee, aromatics, oils) from distant lands", cluster: trade}
  parody-of-incantation-genre: {label: "An invective is framed as a mock incantation (beginning with the incantation rubric)", cluster: wisdom}
  obscene-oath-in-invective: {label: "An invective quotes an obscene oath of its target", cluster: wisdom}
  king-reflects-on-hidden-will-of-gods: {label: "The king ponders daily in his heart: who can understand the works of the gods?", cluster: wisdom}
  dynastic-sin-investigated-by-divination: {label: "A king investigates by divination the sin for which his father died a bad death", cluster: divination}
  independent-diviners-agree: {label: "The diviners, divided into separate groups so they cannot confer, give the same answer 'with one mouth'", cluster: divination}
  sin-of-favoring-own-gods-over-babylons: {label: "The king's father sinned by honouring the gods of Assyria above the gods of Babylon and not keeping the treaty of the king of the gods", cluster: kingship}
  obstruction-of-making-gods-statue: {label: "Court scribes prevent the king from making the statue of a god, and his life is cut short", cluster: kingship}
  goddess-self-presentation-i-am: {label: "A goddess presents herself: 'I am (the Lady of X), the great lady'", cluster: prophecy}
  god-equips-champion-with-bow-and-arrows: {label: "The chief god draws arrows from his bow-case and has them given to a champion, telling him to set out", cluster: myth}
  procession-to-arbela: {label: "The god goes up in procession to Arbela", cluster: cult}
  which-god-can-compare-rhetorical: {label: "Rhetorical question in a divine letter: 'which god is it who ...? which king who ...?'", cluster: prophecy}
  slanderer-rebuked: {label: "A slanderer is rebuked for 'eating the bread of slander' with his lips", cluster: wisdom}
  god-who-guards-you-self-declaration: {label: "The deity declares: 'I am your god who guards you'", cluster: prophecy}
  deity-loves-list-of-cult-cities: {label: "Litany: the deity declares 'I love' each of a long list of cult cities and their gods", cluster: love}
  love-sickness-as-burning-fire: {label: "The love-sick deity says the fires of each city consume her", cluster: love}
units:
  - id: ane-saa02-006-o-seal-preamble-witnesses
    tradition: ane-akkadian
    title: "Esarhaddon's Succession Treaty: seal of Aššur, preamble and divine witnesses (SAA 2 6:i-40B)"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    version: Neo-Assyrian, Nimrud (Kalhu) copy for the Median city-lord Humbareš, 672 BC
    read: ["SAA 02 006 o:i-40B"]
    tags:
      - {motif: treaty-tablet-sealed-and-guarded-like-god, refs: ["SAA 02 006 o:i-iv"], note: "kunuk Aššur šar ilāni ... ša lā šunnê, kunuk rubê rabê abi ilāni ša lā paqāri: the seal of Aššur, king of the gods, which may not be altered; the seal of the great prince, father of the gods, which may not be contested"}
      - {motif: royal-decree-cannot-be-revoked, refs: ["SAA 02 006 o:ii", "SAA 02 006 o:iv"], note: "ša lā šunnê / ša lā paqāri"}
      - {motif: loyalty-oath-imposed-by-assyrian-king, refs: ["SAA 02 006 o:1-5"], note: "adê ša Aššur-aha-iddina ... itti Humbareš bēl āli ša Nahšimarti, with his sons and grandsons, all the Nahšimartians, his men, small and great"}
      - {motif: dominion-from-sunrise-to-sunset, refs: ["SAA 02 006 o:6-8"], note: "ištu napāh šamši adi rabā šamši: all over whom Esarhaddon exercises kingship"}
      - {motif: covenant-includes-absent-future-generations, refs: ["SAA 02 006 o:9-10"], note: "with your sons and grandsons who will be born after the treaty, ana ūmē ṣâti, for future days"}
      - {motif: people-swear-loyalty-to-crown-prince, refs: ["SAA 02 006 o:11-12"], note: "Aššur-bāni-apli mār šarri rabû ša bīt ridûti: the great crown prince of the House of Succession"}
      - {motif: treaty-gods-and-stars-as-witnesses, refs: ["SAA 02 006 o:13-15"], note: "ina pān Jupiter, Venus, Saturn, Mercury, Mars, Sirius: the treaty is made 'before' the planets and Sirius"}
      - {motif: gods-listed-as-treaty-witnesses, refs: ["SAA 02 006 o:16-24"], note: "Aššur, Anu, Enlil, Ea, Sîn, Šamaš, Adad, Marduk, Nabû, Nusku, Uraš, Nergal, Mullissu, Šerua, Bēlet-ilī, Ištar of Nineveh, Ištar of Arbela, the gods dwelling in heaven and earth"}
      - {motif: oath-sworn-by-heaven-and-earth, refs: ["SAA 02 006 o:21", "SAA 02 006 o:40A"], note: "ilāni āšibūti šamê u qaqqari; ilāni ša šamê u qaqqari kalîšunu"}
      - {motif: adjuration-litany-by-each-god, refs: ["SAA 02 006 o:25-40B"], note: "Aššur ... titammâ ('swear!'), then MIN (ditto) after each god or group of gods: of Assur, Nineveh, Kalhu, Arbela, Kilizi, Harran, Babylon, Borsippa, Nippur, all lands"}
    hints:
      - "Heaven and earth as witnesses of the covenant: compare Deut 4:26, 30:19, 31:28, 32:1; Isa 1:2."
      - "An unalterable sealed royal document: compare Esth 8:8 and Dan 6:9,13,16 (law of the Medes and Persians that cannot be altered)."
      - "Covenant binding sons and grandsons not yet born: Deut 29:13-14 (Heb 29:14-15) and Deut 5:3."
      - "From the rising of the sun to its setting: Mal 1:11; Ps 50:1, 113:3."
  - id: ane-saa02-006-o-protect-and-enthrone-crown-prince
    tradition: ane-akkadian
    title: "Esarhaddon's Succession Treaty: guard Assurbanipal, enthrone him, swear to no other king (SAA 2 6:41-72)"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    read: ["SAA 02 006 o:41-72"]
    tags:
      - {motif: people-swear-loyalty-to-crown-prince, refs: ["SAA 02 006 o:41-48"], note: "when Esarhaddon goes to his fate (ana šīmti ittalak) you shall seat Assurbanipal on the royal throne"}
      - {motif: protect-king-in-field-and-city, refs: ["SAA 02 006 o:49-51"], note: "ina eqli ina birti āli lā tanaṣṣaršūni, ina muhhišu lā tamaqqutāni lā tamuttāni: guard him in country and town, fall and die for him"}
      - {motif: speak-truth-of-heart-good-counsel-to-king, refs: ["SAA 02 006 o:51-54"], note: "ina kitti ša libbikunu ... milku damqu ša gammurti libbikunu ... hūlu damqu ina šēpēšu: speak with him in truth of heart, give him good counsel with your whole heart, set a good way at his feet"}
      - {motif: no-replacement-of-heir-by-brother, refs: ["SAA 02 006 o:55-57", "SAA 02 006 o:69-70"], note: "you shall not change him (nakāru) and seat one of his brothers, elder or younger, on the throne in his place"}
      - {motif: kings-word-not-to-be-altered, refs: ["SAA 02 006 o:57-58"], note: "šumma abutu ša Aššur-aha-iddina tenâni tušannâni: if you change or alter the word of Esarhaddon"}
      - {motif: treaty-no-other-king-or-lord, refs: ["SAA 02 006 o:71-72"], note: "šarru šanumma bēlu šanumma ina muhhikunu tašakkanāni; ana šarri šanîmma ... māmīt tatammâni: set another king, another lord over you, or swear an oath to another king or prince"}
      - {motif: love-god-with-all-heart, refs: ["SAA 02 006 o:51-53"], note: "transferred from god to crown prince: loyalty 'in the truth of your heart' (kitti ša libbikunu) and 'the totality of your heart' (gammurti libbikunu); interpretive alignment with Deut 6:5"}
    hints:
      - "No other king beside the designated lord: compare Exod 20:3 / Deut 5:7 (no other gods before me) and Deut 6:14."
      - "Serve with the whole heart: Deut 6:5, 10:12, 11:13; Josh 24:14 'in sincerity and in truth'; 1 Sam 12:24."
      - "Do not alter the king's word: Deut 4:2, 13:1 (Heb 13:1) 'do not add to it or take from it'."
      - "Younger son chosen as heir over elder brothers: 1 Kgs 1 (Solomon over Adonijah), 1 Chr 28:5."
  - id: ane-saa02-006-o-report-seditious-word
    tradition: ane-akkadian
    title: "Esarhaddon's Succession Treaty: report any evil word from kin, officials, prophets or anyone; protect Šamaš-šumu-ukin (SAA 2 6:73-122)"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    read: ["SAA 02 006 o:73-122"]
    tags:
      - {motif: treaty-report-sedition-even-from-kin, refs: ["SAA 02 006 o:73-82"], note: "an improper word (abutu lā ṭābtu lā banītu) about Assurbanipal 'from the mouth of his brothers, his uncles, his cousins, his family (qinnišu, 'nest'), the seed of his father's house', officials, eunuchs, scholars, 'all the black-headed': if you hear and conceal it (tašammâni tupazzarāni) and do not come and tell Assurbanipal"}
      - {motif: kin-enticer-to-idolatry-stoned, refs: ["SAA 02 006 o:76-77", "SAA 02 006 o:113-116"], note: "the closest Assyrian parallel to Deut 13:7: the inciter may be 'your brothers, your sons, your daughters' (ahhēkunu mārēkunu mārātēkunu, 115-116); here sedition against the crown prince, not other gods, and the duty is to report (and in 130-146 to seize and kill)"}
      - {motif: prophet-ecstatic-dreamer-word-against-king-reported, refs: ["SAA 02 006 o:116-119"], note: "lū ina pî raggimi mahhê mār šāʾili amat ili: 'from the mouth of a prophet (raggimu), an ecstatic (mahhû), or an inquirer of the divine word (mār šāʾili amat ili)': even an oracle must be reported"}
      - {motif: false-prophet-with-signs, refs: ["SAA 02 006 o:116-117"], note: "the prophet/ecstatic/dream-inquirer who speaks against the crown prince is listed among the inciters; compare Deut 13:2-6 'prophet or dreamer of dreams'"}
      - {motif: treaty-report-sedition-even-from-kin, refs: ["SAA 02 006 o:108-122"], note: "second clause adds enemy (nakru) and ally (salmu) and the vassal's own brothers, sons and daughters"}
      - {motif: brother-installed-as-king-of-babylon, refs: ["SAA 02 006 o:83-91"], note: "if Esarhaddon dies while his sons are minors, Assurbanipal takes Assyria and Šamaš-šumu-ukin, his equal brother (ahu talīmšu), is seated on the throne of Babylon with Sumer, Akkad and Karduniaš; the gifts the father gave him he shall keep"}
      - {motif: protect-brothers-of-crown-prince, refs: ["SAA 02 006 o:92-107"], note: "the brothers 'sons of his mother' (mār ummišu) are also covered by the treaty"}
    hints:
      - "Deut 13:2-6 (prophet or dreamer of dreams urging rebellion) and 13:7-12 (brother, son, daughter, wife or friend who entices secretly; do not conceal him). The ESA's sequence (kin, prophets, all people) is often taken as the model for Deut 13."
      - "Compare also Deut 18:20-22 and Jer 28-29 (prophets speaking rebellion)."
      - "Mic 7:5-6 (trust not a friend; enemies are members of one's own household)."
  - id: ane-saa02-006-o-seize-rebels-conspiracy-ritual
    tradition: ane-akkadian
    title: "Esarhaddon's Succession Treaty: do not harm the prince; seize and kill instigators; no conspiracy oath (SAA 2 6:123-161)"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    read: ["SAA 02 006 o:123-161"]
    tags:
      - {motif: treaty-no-other-king-or-lord, refs: ["SAA 02 006 o:123-129"], note: "do not seize, kill or hand him to his enemy, or swear an oath to another king or lord"}
      - {motif: treaty-seize-and-deliver-instigators, refs: ["SAA 02 006 o:130-141"], note: "ēpišānūti ša bārti ... lā taṣabbatāni lā tadukāni, šumšunu zeršunu ina māti lā tuhallaqāni: seize and kill the instigators of rebellion and destroy their name and seed from the land"}
      - {motif: purge-evil-from-midst, refs: ["SAA 02 006 o:140-141", "SAA 02 006 o:159-161"], note: "destroy their name and seed in the land; interpretive comparison"}
      - {motif: report-if-unable-to-seize, refs: ["SAA 02 006 o:142-146"], note: "if you cannot seize and kill them, 'open the ears' (uznē ... petû) of Assurbanipal and stand with him"}
      - {motif: conspiracy-oath-ritual-forbidden, refs: ["SAA 02 006 o:147-161"], note: "whether the instigators are few or many: 'those who install gods and conclude a treaty before the gods, by setting a table, drinking from a cup, kindling fire, water, oil, holding breasts (ṣibit tulê), swear to one another'"}
      - {motif: oath-with-water-oil-touching-throat, refs: ["SAA 02 006 o:154-156"], note: "riksi paššūri šatê kāsi nipih Girra mê šamnī ṣibit tulê: rites of oath-taking: table, cup, fire, water, oil and touching the breasts"}
    hints:
      - "Deut 13:9-11 (do not spare or conceal him; your hand shall be first against him) and 13:13-19 (the city that rebels is put to the sword)."
      - "Covenant meal and cup: Gen 31:46-54; Exod 24:11. Conspiracy sealed by oath: 2 Sam 15:10-12 (Absalom), Ps 2:2."
  - id: ane-saa02-006-o-coups-and-false-message
    tradition: ane-akkadian
    title: "Esarhaddon's Succession Treaty: sieges, desertion, after the king's death, the palace coup and the false message (SAA 2 6:162-211)"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    read: ["SAA 02 006 o:162-211"]
    tags:
      - {motif: treaty-fight-kings-enemy, refs: ["SAA 02 006 o:162-172"], note: "whether Assyrian, subject, courtier, eunuch, native or foreigner, 'or any living creature' (šiknat napišti) besieges Assurbanipal in field or city, stand with him and kill the rebels with your whole heart"}
      - {motif: do-not-side-with-rebel, refs: ["SAA 02 006 o:173-179"], note: "if anyone crosses over (ibbalkitūni) and you are seized by force, flee and go to Assurbanipal"}
      - {motif: treaty-no-other-king-or-lord, refs: ["SAA 02 006 o:188-197"], note: "on the day Esarhaddon dies you shall not say 'he is not our king': he who can lower the strong and raise the low (dannu ... šaplu), kill the one to be killed and keep alive the one to be kept alive; obey his mouth and seek no other king"}
      - {motif: king-who-kills-and-makes-alive, refs: ["SAA 02 006 o:192-194"], note: "ša dûki lā idukkūni ša bulluṭi lā uballaṭūni: the crown prince's power over life and death; humbling the mighty, raising the lowly"}
      - {motif: false-message-king-dying-coup, refs: ["SAA 02 006 o:198-211"], note: "if someone stages a revolt in the palace by day or night and a messenger comes untimely to the crown prince saying 'your father has lifted up your head (rēška ittiši), let my lord come': do not listen, do not let him go, strengthen his guard until one of you who loves his lord goes and sees the king's health"}
      - {motif: rebellion-in-palace-by-day-or-night, refs: ["SAA 02 006 o:198-202"], note: "lū ina kal ūme lū ina kal mūši, lū ina hūli lū ina qabsi māti"}
    hints:
      - "Kills and makes alive, brings low and exalts: 1 Sam 2:6-7; Deut 32:39; 2 Kgs 5:7."
      - "'Lift up your head' as a message of release or restoration: Gen 40:13,20; 2 Kgs 25:27."
      - "Palace intrigue at the death of a king and rival heirs: 1 Kgs 1 (Adonijah's feast); 2 Kgs 11 (Athaliah)."
  - id: ane-saa02-006-o-usurpers-minority-poison
    tradition: ane-akkadian
    title: "Esarhaddon's Succession Treaty: no assembly to make a king, usurpers from royal kin, minority of heirs, the pregnant wife, poison and sorcery (SAA 2 6:212-265)"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    read: ["SAA 02 006 o:212-265"]
    tags:
      - {motif: no-assembly-to-elect-king, refs: ["SAA 02 006 o:212-213"], note: "puhru tašakkanāni ahāiš tutammâni ana ištēn ina libbikunu šarrūtu tadanāni: hold an assembly, swear to one another and give kingship to one of you"}
      - {motif: no-replacement-of-heir-by-brother, refs: ["SAA 02 006 o:214-228"], note: "from his brothers, uncles, cousins, the seed of his father's house, those in Assyria or fled abroad, palace people near or far, great or small, nobles or poor (muškēnūti), bearded or eunuch, slave or bought man, any people"}
      - {motif: usurper-kills-heir-during-minority, refs: ["SAA 02 006 o:237-248"], note: "if Esarhaddon dies while his sons are small and a eunuch or bearded courtier kills Assurbanipal and takes the kingship: do not join him, do not become his servants; seize and kill him and seat a son of Assurbanipal on the throne"}
      - {motif: posthumous-heir-in-womb-protected, refs: ["SAA 02 006 o:249-253"], note: "ina pān arīti ša Aššur-aha-iddina u aššat Aššur-bāni-apli: wait for the pregnant wife of Esarhaddon or of Assurbanipal; when (the child) is born, raise him and seat him on the throne"}
      - {motif: blood-avenger, refs: ["SAA 02 006 o:254-259"], note: "dāmē kūm dāmē ... tabāku, gimillu ša Aššur-bāni-apli ... turru: shed blood for blood and avenge Assurbanipal"}
      - {motif: treaty-no-poisoning-or-sorcery-against-prince, refs: ["SAA 02 006 o:260-265"], note: "šammu ša mu'ātišu tušakkalāšūni tašaqqiāšūni tapaššašāšūni kišpī teppašāšūni: deadly herb to eat, drink or anoint him with, witchcraft, or making god and goddess angry with him"}
      - {motif: love-god-with-all-heart, refs: ["SAA 02 006 o:212-213"], note: "(negative) collective oath to another; see 266-268 for the love clause"}
    hints:
      - "Joash hidden and raised for the throne after the queen's murder of the royal seed: 2 Kgs 11:1-3."
      - "Blood for blood: Gen 9:6; Num 35:19-33; 2 Kgs 9:7, 26 (avenging the blood of the prophets/Naboth)."
      - "Conspiracy by servants killing the king: 2 Kgs 12:20-21, 21:23-24 (the people of the land kill the conspirators and enthrone the son)."
  - id: ane-saa02-006-o-love-as-yourselves-future-generations
    tradition: ane-akkadian
    title: "Esarhaddon's Succession Treaty: love him as yourselves; slander and royal gifts; teach this treaty to your sons (SAA 2 6:266-301)"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    read: ["SAA 02 006 o:266-301"]
    tags:
      - {motif: love-overlord-as-own-life, refs: ["SAA 02 006 o:266-268"], note: "šumma attunu ana Aššur-bāni-apli ... kī napšātekunu lā tar'amāni: if you do not love him as your own lives"}
      - {motif: love-god-with-all-heart, refs: ["SAA 02 006 o:268"], note: "covenant love (râmu) demanded of the vassal toward the overlord; cf. Deut 6:5"}
      - {motif: protect-brothers-of-crown-prince, refs: ["SAA 02 006 o:269-282"], note: "karṣīšunu takkalāni ('eat their slanders') before Assurbanipal, lay hands on their houses, take away the gifts their father gave them: fields, houses, orchards, people, equipment, horses, mules, donkeys, oxen, sheep"}
      - {motif: royal-gifts-to-sons-inalienable, refs: ["SAA 02 006 o:273-278"], note: "tidintu ša Aššur-aha-iddina ... iddinaššanūni ... qinītu ša šunu iqnûni"}
      - {motif: teach-children-constantly, refs: ["SAA 02 006 o:283-297"], note: "ana mārēkunu mārē mārēkunu ana zērikunu ana zēr zērikunu ... lā taqabbâni ṭēmu lā tašakkanšūni mā adê annûte uṣrā: if you do not speak to your sons, grandsons, seed and seed's seed and command them 'guard this treaty; do not sin against it, lest you lose your lives, give your land to destruction and your people to deportation'"}
      - {motif: treaty-binds-future-generations, refs: ["SAA 02 006 o:288-290"], note: "ša arki adê ana ūmē ṣâti ibbaššûni: those who will exist after the treaty for days to come"}
      - {motif: curse-land-destroyed-people-deported-food-clothes-oil-lost, refs: ["SAA 02 006 o:292-295"], note: "napšātekunu lā tuhallaqā, mātkunu ana hapê nišēkunu ana šalāli lā taddanā: lose your lives, land destroyed, people deported"}
      - {motif: word-accepted-by-gods-and-men, refs: ["SAA 02 006 o:295-301"], note: "mā abutu annītu ša ina pān ilāni amēlūte mahrat ... lū mahrat: 'may this word, acceptable to gods and men, be acceptable to you'; Assurbanipal be called to kingship; set no other king or lord over you"}
    hints:
      - "Deut 6:6-7 and 11:19 (teach these words diligently to your children); Deut 4:9-10; Ps 78:5-6."
      - "Love as your own soul: Deut 13:7 (Heb; 13:6 Eng) 'your friend who is as your own soul'; 1 Sam 18:1,3 and 20:17 (Jonathan loved David as his own soul); Lev 19:18."
      - "Lose your life and your land: Deut 4:26-27, 30:17-18; Deut 28:63-64."
      - "Favour with gods and men: 1 Sam 2:26; Prov 3:4; Luke 2:52."
  - id: ane-saa02-006-o-usurper-slander-brothers
    tradition: ane-akkadian
    title: "Esarhaddon's Succession Treaty: fight a usurper; resist incitement to set the prince against his father and brothers (SAA 2 6:302-372)"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    read: ["SAA 02 006 o:302-372"]
    tags:
      - {motif: treaty-fight-kings-enemy, refs: ["SAA 02 006 o:302-317"], note: "if someone revolts against Esarhaddon and sits on his throne: do not rejoice in his kingship (tahaddāni); if you cannot seize him, do not consent to his kingship or swear the oath of servitude; fight him, rouse other lands, plunder him, kill him, destroy his name and seed"}
      - {motif: treaty-seize-and-deliver-instigators, refs: ["SAA 02 006 o:315"], note: "šumšu zēršu ina māti lā tuhallaqāni"}
      - {motif: brothers-slander-chosen-heir, refs: ["SAA 02 006 o:318-335"], note: "if any relative, previous king's seed, official or foreigner incites you, saying 'slander Assurbanipal before his father, speak an evil word, cause strife between him and his father, make them hate each other'"}
      - {motif: envious-instigators-quoted-speech, refs: ["SAA 02 006 o:328-335"], note: "bēl qinʾi 'the envious ones' say: 'let it be his brothers or his servants who cursed him before his father ... where (alē) is that which Aššur, Šamaš and Adad spoke about him? ... without Aššur and Šamaš your father ... honour your brother, guard your lives'"}
      - {motif: protect-brothers-of-crown-prince, refs: ["SAA 02 006 o:336-346"], note: "'eat the slander of his brothers before him, strike between them, cut off (pursā) his brothers from him': do not do it"}
      - {motif: treaty-report-sedition-even-from-kin, refs: ["SAA 02 006 o:347-352"], note: "if you release (turammāšūni) the speaker (qābiānu) of this word and do not go and tell Assurbanipal 'your father imposed a treaty concerning you on us and made us swear'"}
      - {motif: protect-brothers-of-crown-prince, refs: ["SAA 02 006 o:353-372"], note: "partly broken (354-357); after Assurbanipal's accession do not speak evil of his brothers to him or say 'stretch out your hand against them in evil', nor change the position (mazzaztu) their father assigned them"}
    hints:
      - "Instigators who sow discord between a king and his son or brothers: 2 Sam 14-15 (Absalom), 1 Kgs 2:13-25."
      - "'Where is the word?' mocking a divine promise: Jer 17:15; 2 Pet 3:4; Ps 42:4,11."
      - "Kingship confirmed by divine word against envious rivals: 2 Sam 7:12-16; Ps 2."
  - id: ane-saa02-006-o-oath-release-magic-whole-heart-tablet
    tradition: ane-akkadian
    title: "Esarhaddon's Succession Treaty: no ritual to annul the oath; swear wholeheartedly; Aššur your god; guard the sealed tablet (SAA 2 6:373-413)"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    read: ["SAA 02 006 o:373-413"]
    tags:
      - {motif: ritual-to-annul-oath-forbidden, refs: ["SAA 02 006 o:373-380"], note: "if you anoint face, hands or throat with the tallow (sarbu) of the gods of the assembly, or bind it on your thigh, or perform a rite of 'turning back' (tūrtu turru) and 'releasing the oath' (māmīt pašāri)"}
      - {motif: oath-with-whole-heart-not-lips-only, refs: ["SAA 02 006 o:385-387"], note: "kī ina qaqqar tamīti annītu tazzazzāni, tamītu ša dababti šapti tatammâni ina gummurti libbikunu lā tatammâni: if, standing on the place of this oath, you swear with the talk of the lips and not with your whole heart"}
      - {motif: teach-children-constantly, refs: ["SAA 02 006 o:387-388"], note: "ana mārēkunu ša arki adê ibbaššûni lā tušalmadāni: do not teach (lamādu Š) it to your sons who will exist after the treaty"}
      - {motif: love-god-with-all-heart, refs: ["SAA 02 006 o:387"], note: "ina gummurti libbikunu, 'with all your heart'"}
      - {motif: fear-god-and-king, refs: ["SAA 02 006 o:389-396"], note: "ana arki ūmē ana ūmē ṣâti Aššur ilkunu, Aššur-bāni-apli ... bēlkunu, mārēkunu ... ana šâšu liplahū: for future days Aššur is your god and Assurbanipal your lord; may your sons and grandsons fear him"}
      - {motif: covenant-formula-my-people-your-god, refs: ["SAA 02 006 o:393-394"], note: "Aššur ilkunu ... bēlkunu: 'Aššur is your god, Assurbanipal your lord'"}
      - {motif: treaty-tablet-sealed-and-guarded-like-god, refs: ["SAA 02 006 o:397-409"], note: "this tablet of the treaty is sealed with the seal of Aššur, king of the gods, and set before you; guard it like your god (kī ilkunu ... naṣāru); partly broken 402-406"}
      - {motif: curse-on-who-alters-royal-monument, refs: ["SAA 02 006 o:397-399", "SAA 02 006 o:410-413"], note: "whoever changes, neglects, transgresses or erases the oath of this tablet; if you alter it, consign it to fire, throw it into water, bury it in dust, destroy it by any cunning means"}
      - {motif: curse-on-who-alters-royal-monument, refs: ["SAA 02 006 o:407-409"], note: "kī ilkunu lā tanaṣṣarāni (guard it like your god); the protective clause on the inscribed object"}
    hints:
      - "Lip service vs. whole heart: Isa 29:13; Jer 12:2; Ps 78:36-37; Deut 30:2, 10."
      - "Covenant formula 'I will be your God': Lev 26:12; Deut 26:17-18; Jer 7:23."
      - "Fear YHWH and the king: Prov 24:21; 1 Pet 2:17."
      - "Tablets kept in the ark before God: Deut 10:1-5, 31:24-26; Exod 25:16. Destroying a written scroll in fire: Jer 36:23. Do not add or take away: Deut 4:2, 13:1; Rev 22:18-19."
  - id: ane-saa02-006-o-curses-by-the-gods
    tradition: ane-akkadian
    title: "Esarhaddon's Succession Treaty: curses by the gods one by one (SAA 2 6:414-493)"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    read: ["SAA 02 006 o:414-493"]
    tags:
      - {motif: covenant-curses-catalogue, refs: ["SAA 02 006 o:414-493"], note: "each god inflicts a curse fitting his domain"}
      - {motif: curse-no-old-age, refs: ["SAA 02 006 o:414-416"], note: "Aššur, who decrees fates: an evil fate; arāk ūmī šībūti kišid littūti ay iqīškunu, may he not grant you long days, old age, extreme age"}
      - {motif: curse-disease-moaning-sleeplessness, refs: ["SAA 02 006 o:418A-418C"], note: "Anu: illness, moaning, diʾu-disease, sleeplessness, wailing rain down on all your houses"}
      - {motif: curse-skin-disease-as-garment, refs: ["SAA 02 006 o:419-421"], note: "Sîn ... ina saharšubbê lihallipkunu: clothe you with leprosy like a garment; no entry before god or king; roam the open country like the wild ass and the gazelle"}
      - {motif: boils-of-egypt-hemorrhoids, refs: ["SAA 02 006 o:419-420"], note: "skin disease (saharšubbû) as treaty curse; compare Deut 28:27,35"}
      - {motif: madness-blindness-groping-at-noon, refs: ["SAA 02 006 o:422-424"], note: "Šamaš, light of heaven and earth: may he not judge you justly; may he take away your eyesight (niṭil īnēkunu lišīma); walk about in darkness (ina ekleti ittallakā)"}
      - {motif: corpse-food-for-birds-no-one-scares, refs: ["SAA 02 006 o:425-427"], note: "Ninurta fells you with his arrow, fills the plain with your blood, feeds your flesh to the eagle (erû) and the jackal (zību)"}
      - {motif: betrothed-house-vineyard-taken-by-another, refs: ["SAA 02 006 o:428-430"], note: "Venus: before your eyes may your wives lie in the lap of your enemy (ina sūn nakrikunu lišanīl), your sons not own your house, a stranger (nakru ahû) divide your goods"}
      - {motif: curse-enemy-divides-your-possessions, refs: ["SAA 02 006 o:430"], note: "nakru ahû lizâʾiz mimmûkun"}
      - {motif: curse-birth-cut-off-no-childs-cry, refs: ["SAA 02 006 o:433-439"], note: "Marduk: heavy punishment, an oath without release (māmīt lā pašāri); Zarpanitu who gives name and seed destroy your name and seed; Bēlet-ilī cut off birth (tālittu); no cry of baby or toddler in the streets; nursemaids lacking"}
      - {motif: curse-rivers-dammed-rain-withheld, refs: ["SAA 02 006 o:440-443"], note: "Adad, canal-inspector of heaven and earth: cut off high water (mīlu), deprive the meadows, flood, locust (erbû) the diminisher of the land eat the harvest"}
      - {motif: locust-worm-cricket-devour, refs: ["SAA 02 006 o:442-443"], note: "erbû muṣahhir māti ebūrkunu lēkul"}
      - {motif: curse-no-sound-of-mill-and-oven, refs: ["SAA 02 006 o:443-444"], note: "ikkil erî u tinūri ina bītātikunu ay ibši: may the sound of the millstone and oven be absent from your houses"}
      - {motif: cannibalism-in-siege, refs: ["SAA 02 006 o:444-450"], note: "grain to grind lost: instead of grain may your sons and daughters grind your bones; the mother bar her door to her daughter; in hunger eat the flesh of your sons; man eat man's flesh, man clothe himself in man's skin"}
      - {motif: curse-mother-bars-door-against-daughter, refs: ["SAA 02 006 o:448"], note: "ummu eli mārtiša bābša lēdil"}
      - {motif: curse-unburied-corpse-eaten-by-dogs-and-pigs, refs: ["SAA 02 006 o:451"], note: "šīrēkunu kalbē šahê lēkulū"}
      - {motif: curse-ghost-deprived-of-water, refs: ["SAA 02 006 o:452", "SAA 02 006 o:476-477"], note: "eṭemmakunu pāqidu nāq mê ay irši: may your ghost have no caretaker or water-pourer; above uproot you from the living, below may your ghost thirst for water"}
      - {motif: curse-bow-broken-by-war-goddess, refs: ["SAA 02 006 o:453-454"], note: "Ištar, lady of battle: break your bow, bind your arms, make you sit under your enemy"}
      - {motif: curse-made-to-kneel-at-enemys-feet, refs: ["SAA 02 006 o:454"], note: "ina šapal nakrikunu lišēšibkunu"}
      - {motif: curse-plague-ends-people, refs: ["SAA 02 006 o:455-456"], note: "Nergal: extinguish your life with his merciless sword, slaughter and pestilence (mūtānu)"}
      - {motif: curse-no-mercy-from-god, refs: ["SAA 02 006 o:457-460"], note: "Mullissu bind a flaming sword at your side; Ištar of Arbela not show you mercy and favour (rēmu gimlu)"}
      - {motif: curse-wound-bathe-in-blood-and-pus, refs: ["SAA 02 006 o:461-463"], note: "Gula, great physician: illness and weariness in your hearts, an unhealing wound (simmu lazzu) in your body; bathe in blood and pus like water"}
      - {motif: curse-by-aramaean-and-syrian-gods, refs: ["SAA 02 006 o:466-471"], note: "Aramiš (broken); Bethel and Anath-Bethel (Baiti-ili, Anat-Baiti-ili) hand you over to a man-eating lion; Kubaba of Carchemish puts rimṭu-disease in you, your urine drip to the ground like raindrops"}
      - {motif: curse-handed-to-devouring-lion, refs: ["SAA 02 006 o:467-468"], note: "ina qāt nēši ākili limnûkunu"}
      - {motif: wicked-uprooted-from-land-of-living, refs: ["SAA 02 006 o:472-479"], note: "may all the gods named on this tablet strike you, frown on you, curse you angrily with a bitter curse; uproot you from the living above; light and shade pursue you so you find no hiding corner; bread and water forsake you"}
      - {motif: corpse-food-for-birds-no-one-scares, refs: ["SAA 02 006 o:480-484"], note: "famine, want, hunger, plague never leave you; dogs and pigs drag the teats of your girls and penises of your young men in the square of Assur before your eyes; the earth not receive your corpses; the bellies of dogs and pigs be your grave"}
      - {motif: curse-days-dark-years-of-darkness, refs: ["SAA 02 006 o:485-487"], note: "ūmēkunu lū eṭû šanātēkunu lū eklā: may your days be dim, your years dark; darkness without brightness be your fate; end your life in moaning and sleeplessness"}
      - {motif: curse-flood-from-earth, refs: ["SAA 02 006 o:488-489"], note: "bibbulu abūbu lā mahru ištu libbi erṣeti: an irresistible flood come up from the earth"}
      - {motif: curse-dust-for-food-pitch-for-oil-urine-for-drink, refs: ["SAA 02 006 o:489-492"], note: "anything good be taboo to you, anything sick your fate; tar and pitch your food, donkey's urine your drink, naphtha your ointment, river-weed your covering"}
      - {motif: curse-demons-choose-your-houses, refs: ["SAA 02 006 o:493"], note: "šēdu utukku rābiṣu lemnu bītātikunu lihīrū"}
    hints:
      - "Deut 28 curse sequence: disease and boils (28:21-22, 27, 35), blindness and groping in darkness at noon (28:28-29), carrion birds (28:26), wife lain with by another, house and vineyard taken (28:30), stranger takes your goods (28:31-33, 43), locusts (28:38), cannibalism in siege (28:53-57: the delicate woman begrudges her own children)."
      - "No sound of millstone or lamp: Jer 25:10; Rev 18:22-23. Wild-ass existence: Job 39:5-8; Dan 4:25."
      - "Dogs licking blood and eating the body in public: 1 Kgs 21:19,23-24; 2 Kgs 9:35-37 (Jezebel); Jer 22:19 (burial of an ass)."
      - "Bethel as a god: Jer 48:13 ('Moab ashamed of Chemosh as Israel was ashamed of Bethel'). Lion sent: 1 Kgs 13:24; 2 Kgs 17:25."
      - "Quran: dogs and stripped bodies, or famine and fear as punishment: Q 16:112; disbelievers' deeds as darkness upon darkness: Q 24:40."
  - id: ane-saa02-006-o-self-curse-and-further-curses
    tradition: ane-akkadian
    title: "Esarhaddon's Succession Treaty: the vassals' first-person oath and further curses by Aššur, Palil, Ea, Girra (SAA 2 6:494-525)"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    read: ["SAA 02 006 o:494-525"]
    tags:
      - {motif: self-curse-oath-first-person, refs: ["SAA 02 006 o:494-512"], note: "ilāni annûte lidgulū šumma anīnu ... nēppašūni: 'may these gods watch: if we (anīnu) make rebellion, put our mouth with his enemy, hear whispering and lies and conceal them ... as long as we, our sons and grandsons live, Assurbanipal is our king and lord; if we set another king over us, may the gods named seek out (lubaʾʾiū) our seed and our seed's seed from our hand'"}
      - {motif: treaty-report-sedition-even-from-kin, refs: ["SAA 02 006 o:500-507"], note: "mušamhiṣūtu mušadbibūtu lihšu ša amat lemutti ... dabāb surrāti: sedition, instigation, whispering of an evil word, lying talk"}
      - {motif: treaty-no-other-king-or-lord, refs: ["SAA 02 006 o:509-510"], note: "šumma šarru šanumma ... ina muhhini ... nišakkanūni"}
      - {motif: corpse-food-for-birds-no-one-scares, refs: ["SAA 02 006 o:518-520"], note: "Aššur fells you with his furious weapons; Palil gives your flesh to eagle and jackal"}
      - {motif: curse-water-of-death-dropsy, refs: ["SAA 02 006 o:521-522"], note: "Ea, king of the Apsû: mê lā balāṭi lišqīkunu agannutillâ limallīkunu, give you water of no-life to drink and fill you with dropsy"}
      - {motif: curse-water-and-oil-taboo, refs: ["SAA 02 006 o:523"], note: "mê šamnī ana ikkibikunu liškunū"}
      - {motif: curse-seed-burned-torch-quenched, refs: ["SAA 02 006 o:524-525"], note: "Girra who gives food to small and great burn your name and seed"}
    hints:
      - "The people answer 'Amen' to curses on themselves: Deut 27:15-26; Num 5:22; Neh 5:13."
      - "Water of bitterness causing the belly to swell: Num 5:22-27; compare Ps 109:18."
  - id: ane-saa02-006-o-analogical-curses-1
    tradition: ane-akkadian
    title: "Esarhaddon's Succession Treaty: analogical and simile curses I: iron earth and bronze sky to the stinking bug (SAA 2 6:526-611)"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    read: ["SAA 02 006 o:526-611"]
    tags:
      - {motif: analogical-treaty-curse, refs: ["SAA 02 006 o:530-531", "SAA 02 006 o:547-548", "SAA 02 006 o:560-561"], note: "kī ša ... kī hannê: 'just as X ... so may Y': simile curses performed with objects and animals (this ewe, these lambs, this wax figure)"}
      - {motif: sky-bronze-earth-iron, refs: ["SAA 02 006 o:526-533"], note: "ammar libitti qaqqaru lusīqūnikunu, qaqqarkunu kī parzilli lēpušū ... kī ša ištu libbi šamê ša siparri zunnu lā izannunūni: may they make your ground narrow as a brick, make your ground like iron, so nothing sprouts; as rain does not fall from a bronze sky, so may rain and dew not come on your fields; instead of rain may coals (pēnāti) rain on your land"}
      - {motif: rain-turned-to-burning-coals, refs: ["SAA 02 006 o:532-533"], note: "kūm zunni pēʾnāti ina mātikunu liznun"}
      - {motif: curse-like-tin-before-fire-cannot-stand-before-enemy, refs: ["SAA 02 006 o:534-536"], note: "as tin does not stand before fire, you shall not stand before your enemy, nor take your sons and daughters by the hand"}
      - {motif: curse-sterility-like-mule, refs: ["SAA 02 006 o:537-539"], note: "as a mule has no offspring, may your name and seed and that of your sons and daughters vanish from the land"}
      - {motif: curse-no-sprouting-like-malt, refs: ["SAA 02 006 o:540-544"], note: "as the shoot of malt in the mash does not sprout: may your seed vanish from the face of the earth (partly broken 541-542)"}
      - {motif: curse-city-ploughed-with-iron-plough, refs: ["SAA 02 006 o:545-546"], note: "Šamaš ina epinni ša parzilli ālkunu nagîkunu lušabalkit: overturn your city and district with an iron plough"}
      - {motif: cannibalism-in-siege, refs: ["SAA 02 006 o:547-550"], note: "as this ewe is cut open and the flesh of her young put in her mouth, so may they make you eat in hunger the flesh of your brothers, sons and daughters"}
      - {motif: curse-entrails-rolled-round-feet, refs: ["SAA 02 006 o:551-554"], note: "as these lambs and kids are slit and their entrails rolled round their feet"}
      - {motif: no-peace-between-spouses-like-snake-and-mongoose, refs: ["SAA 02 006 o:555A-559"], note: "as snake and mongoose do not enter one hole but plot to cut each other's throats, so you and your wives shall not enter one house or lie on one bed"}
      - {motif: curse-oath-enters-body-like-food-or-oil, refs: ["SAA 02 006 o:560-562"], note: "as bread and wine enter the intestines, so may this oath enter your intestines and those of your sons and daughters"}
      - {motif: curse-rivers-and-springs-flow-backward, refs: ["SAA 02 006 o:563-566"], note: "as one blows water out of a reed-tube, so may they blow you away; may your rivers and springs turn backwards (ana qinniš lusahhirū)"}
      - {motif: curse-bread-for-price-of-gold, refs: ["SAA 02 006 o:567"], note: "akalē ina pitti hurāṣi ina mātikunu lušālikū: make bread cost the same as gold in your land"}
      - {motif: curse-drink-own-blood-sweet-as-honey, refs: ["SAA 02 006 o:568-569"], note: "as honey is sweet, may the blood of your wives, sons and daughters be sweet in your mouth"}
      - {motif: curse-worms-eat-living-flesh, refs: ["SAA 02 006 o:570-572"], note: "as the worm eats stored supplies, may the worm eat your flesh while you are still alive (ina balṭūtekunu)"}
      - {motif: curse-bow-broken-by-war-goddess, refs: ["SAA 02 006 o:573-575"], note: "break your bow, seat you under your enemy, turn the bow in your hand, make your chariots run backwards"}
      - {motif: blood-avenger, refs: ["SAA 02 006 o:576-578", "SAA 02 006 o:582-584"], note: "as a stag is chased and killed, may the avengers of blood (bēl dāmē) chase and kill you; as a bird is caught in a trap, put you in the hands of your avengers"}
      - {motif: curse-not-return-to-wife-and-house, refs: ["SAA 02 006 o:579-581"], note: "as the caterpillar does not see and does not return to its cocoon, may you not return to your wives, sons, daughters and houses"}
      - {motif: curse-flesh-black-as-pitch, refs: ["SAA 02 006 o:585-587"], note: "kī qīri kupri napṭi luṣallimū"}
      - {motif: enemies-caught-like-animals-in-net, refs: ["SAA 02 006 o:588-590"], note: "(applied to the vassal) as a beast is caught in a snare, may you be seized by your enemy"}
      - {motif: curse-flesh-consumed-like-chameleon, refs: ["SAA 02 006 o:591-593"], note: "kī šīrē ša hurbabilli ligammurū"}
      - {motif: curse-flesh-perforated-like-honeycomb, refs: ["SAA 02 006 o:594-598"], note: "as a honeycomb is pierced with holes, may holes be pierced in your flesh while alive"}
      - {motif: locust-worm-cricket-devour, refs: ["SAA 02 006 o:599-600"], note: "erbû zēru barmu kalmutu mūnu ākilu: locust, larva, louse, caterpillar devour your cities and districts"}
      - {motif: curse-like-fly-in-enemys-hand, refs: ["SAA 02 006 o:601-602"], note: "kī zumbi ina qāt nakrikunu lēpušūkunu: make you like a fly in the hand of your enemy; may your enemy squash you"}
      - {motif: curse-breath-stinks-before-gods-and-men, refs: ["SAA 02 006 o:603-605"], note: "as this bug stinks, may your breath stink before god, king and mankind"}
      - {motif: curse-kin-hunt-and-kill-each-other, refs: ["SAA 02 006 o:606-607"], note: "ina pitilti lihnuqūkunu"}
      - {motif: curse-melt-like-wax-dissolve-like-clay-figure, refs: ["SAA 02 006 o:608-611"], note: "as a wax figure (ṣalmu ša iškūri) is burned in fire and one of clay dissolved in water, so may your form burn in Girra and sink in water"}
    hints:
      - "Deut 28:23-24: 'your heaven over your head shall be bronze, and the earth under you iron; YHWH will make the rain of your land powder and dust'. The ESA order (earth iron, sky bronze) matches Deuteronomy against Lev 26:19 (sky iron, earth bronze)."
      - "Eating children's flesh: Deut 28:53-57; Lev 26:29; Jer 19:9; Lam 2:20, 4:10; 2 Kgs 6:28-29; Ezek 5:10."
      - "Zion ploughed like a field: Mic 3:12; Jer 26:18. Cannot stand before enemies: Lev 26:37; Josh 7:12-13; Deut 28:25."
      - "Curse entering the body like water, like oil into the bones: Ps 109:18; Num 5:22. Drinking own blood like wine: Isa 49:26."
      - "Worms on the living or the corpse: Isa 14:11, 66:24; Job 7:5; Acts 12:23; Deut 28:39 (worm eats the vine)."
      - "Avenger of blood: Num 35:19-27; Deut 19:6,12. Bird in a snare: Amos 3:5; Eccl 9:12; Prov 7:23. Flesh black: Lam 4:8, 5:10."
      - "Melt like wax before fire: Ps 68:3 (Heb), 97:5; Mic 1:4. Rivers turned back: Ps 114:3,5; Isa 19:5-6."
      - "Quran: those who break the covenant after its ratification are cursed: Q 13:25, 2:27; the hypocrites' saying with their tongues what is not in their hearts: Q 48:11."
  - id: ane-saa02-006-o-analogical-curses-2
    tradition: ane-akkadian
    title: "Esarhaddon's Succession Treaty: analogical curses II: bloody chariot to the overturned throne (SAA 2 6:612A-663)"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    read: ["SAA 02 006 o:612A-663"]
    tags:
      - {motif: analogical-treaty-curse, refs: ["SAA 02 006 o:612-615", "SAA 02 006 o:626-629"], note: "kī ša mugerru annītu adi sassiša ina dāmē rahṣatūni: as this chariot is drenched in blood to its floorboard, so may your chariots be drenched in your own blood in the midst of your enemy"}
      - {motif: warriors-become-women, refs: ["SAA 02 006 o:616A-617"], note: "kī pilaqqi lušaṣbirūkunu, kī sinništi ina pān nakrikunu lēpušūkunu: make you spin like a spindle, make you like a woman before your enemy"}
      - {motif: curse-move-backward-like-crab, refs: ["SAA 02 006 o:618A-620"], note: "kī alluttu ana qinniš lušadīlūkunu"}
      - {motif: curse-surrounded-by-fire, refs: ["SAA 02 006 o:621"]}
      - {motif: curse-oath-enters-body-like-food-or-oil, refs: ["SAA 02 006 o:622-625"], note: "kī ša šamnu ina libbi šīrēkunu errabūni, kī hannê tamītu annītu ina libbi šīrēkunu ... lušēribū: as oil enters your flesh, so may this oath enter your flesh and that of your brothers, sons and daughters"}
      - {motif: curse-hands-feet-cut-eyes-blinded, refs: ["SAA 02 006 o:626-629"], note: "as the curser (arrāru) who sinned against Bēl had his hands and feet cut off and his eyes blinded, so may they finish you off"}
      - {motif: curse-shaken-like-reed-in-water, refs: ["SAA 02 006 o:630-631"], note: "kī appāri ina mê lunīšūkunu, kī qanê ina riksi nakrikunu lušallipūkunu: shake you like a reed-bed in water, pull you out like a reed from a bundle"}
