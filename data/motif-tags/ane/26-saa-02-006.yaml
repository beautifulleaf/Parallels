# Full read of the ANE corpus, chunk 26: Esarhaddon's Succession Treaty (SAA 2 6) and SAA 3 court poetry, hymns, letters from gods, cultic commentaries, the Marduk Ordeal and the Sin of Sargon.
# Read from the ORACC lemmatized transliterations (saao/saa02, saao/saa03); word glosses used as reading aids (no translation in the data).
new_motifs:
  gods-listed-as-treaty-witnesses: {label: "A long roster of the great gods and the gods of each city and land is named as present at the conclusion of the treaty", cluster: treaty}
  adjuration-litany-by-each-god: {label: "The sworn are adjured 'swear by X!' god after god, each line repeating 'ditto' (MIN)", cluster: treaty}
  protect-king-in-field-and-city: {label: "The sworn must guard the king or prince in the country and in the town, falling and dying for him if need be", cluster: treaty}
  speak-truth-of-heart-good-counsel-to-king: {label: "The sworn must speak with the prince in truth of heart, give him good counsel with their whole heart and set a good way before his feet", cluster: treaty}
  no-replacement-of-heir-by-brother: {label: "The sworn must not set one of the designated heir's brothers, elder or younger, on the throne in his place", cluster: treaty}
  kings-word-not-to-be-altered: {label: "The sworn must not change or alter the king's word (his designation of the heir)", cluster: treaty}
  prophet-ecstatic-dreamer-word-against-king-reported: {label: "A seditious word from the mouth of a prophet (raggimu), an ecstatic (mahhû) or an inquirer of the divine word must be reported to the crown prince", cluster: treaty}
  brother-installed-as-king-of-babylon: {label: "The crown prince's brother is designated to sit on the throne of Babylon while the heir rules Assyria", cluster: kingship}
  report-if-unable-to-seize: {label: "If the sworn cannot seize and kill the rebels themselves, they must inform the prince and stand with him", cluster: treaty}
  conspiracy-oath-ritual-forbidden: {label: "The sworn must not join conspirators who swear one another by setting up gods, a table, a cup, fire, water, oil and touching breasts", cluster: treaty}
  do-not-side-with-rebel: {label: "If anyone revolts and the sworn are seized by force, they must not side with him but flee to the prince", cluster: treaty}
  king-who-kills-and-makes-alive: {label: "The king (heir) is described as one who brings down the mighty and raises the lowly, kills whom he will and keeps alive whom he will", cluster: kingship}
  false-message-king-dying-coup: {label: "A messenger arrives unseasonably saying the king has summoned the prince ('your father has lifted your head'); the prince must not go until a loyal man has seen the king is well", cluster: treaty}
  rebellion-in-palace-by-day-or-night: {label: "Treaty provision for a revolt in the palace by day or night, on the road or in the land", cluster: treaty}
  no-assembly-to-elect-king: {label: "The sworn must not form an assembly, swear to one another and give the kingship to one of themselves", cluster: treaty}
  usurper-kills-heir-during-minority: {label: "If the king dies while his sons are small and a courtier kills the heir and seizes the throne, the sworn must not serve him but kill him and enthrone the heir's son", cluster: treaty}
  posthumous-heir-in-womb-protected: {label: "The sworn must wait for the king's or prince's pregnant wife, raise the child when born and set him on the throne", cluster: treaty}
  royal-gifts-to-sons-inalienable: {label: "Fields, houses, orchards, people and livestock the king gave to his sons may not be taken from them", cluster: treaty}
  word-accepted-by-gods-and-men: {label: "A word (the succession) is declared acceptable before gods and men, and the sworn are asked to accept it too", cluster: treaty}
  envious-instigators-quoted-speech: {label: "The treaty quotes the envious instigators' persuasive speech ('where is what the gods said about him? ... guard your lives') to forbid it", cluster: treaty}
  curse-no-old-age: {label: "Curse: may the high god not grant long days, old age and extreme old age", cluster: curse}
  curse-disease-moaning-sleeplessness: {label: "Curse: may the sky god rain illness, exhaustion, headache, sleeplessness and wailing on all your houses", cluster: curse}
  curse-no-mercy-from-god: {label: "Curse: may the goddess show you no mercy or favour", cluster: curse}
  curse-by-aramaean-and-syrian-gods: {label: "Treaty curses invoke western gods (Bethel, Anath-Bethel, Kubaba of Carchemish, Aramiš) alongside the Assyrian pantheon", cluster: treaty}
  curse-flood-from-earth: {label: "Curse: may an irresistible flood come up from the earth and devastate you", cluster: curse}
  self-curse-oath-first-person: {label: "The sworn speak in the first person ('if we ...') and call on the named gods to seek out their seed if they rebel", cluster: treaty}
  curse-water-of-death-dropsy: {label: "Curse: may the god of the deep give you water of death to drink and fill you with dropsy", cluster: curse}
  curse-water-and-oil-taboo: {label: "Curse: may water and oil become taboo to you", cluster: curse}
  analogical-treaty-curse: {label: "Simile curse enacted with an object or animal: 'just as this X is ..., so may you be ...'", cluster: treaty}
  rain-turned-to-burning-coals: {label: "Curse: instead of rain may burning coals rain on your land", cluster: curse}
  curse-no-sprouting-like-malt: {label: "Simile curse: as malt in the mash does not sprout, may your seed vanish from the land", cluster: curse}
  curse-entrails-rolled-round-feet: {label: "Simile curse: as these lambs are slit and their entrails rolled round their feet, so may yours and your children's be", cluster: curse}
  no-peace-between-spouses-like-snake-and-mongoose: {label: "Simile curse: as snake and mongoose do not share a hole but plot each other's death, may husband and wife not share house or bed", cluster: curse}
  curse-drink-own-blood-sweet-as-honey: {label: "Curse: as honey is sweet, may the blood of your wives and children be sweet in your mouth", cluster: curse}
  curse-flesh-consumed-like-chameleon: {label: "Simile curse: may your flesh and your family's be consumed like the flesh of a chameleon", cluster: curse}
  curse-flesh-perforated-like-honeycomb: {label: "Simile curse: as a honeycomb is pierced with holes, may holes be bored in your flesh while you live", cluster: curse}
  curse-like-fly-in-enemys-hand: {label: "Curse: may you be like a fly in the hand of your enemy, who crushes you", cluster: curse}
  curse-surrounded-by-fire: {label: "Curse: may an evil fire surround you", cluster: curse}
  curse-shaken-like-reed-in-water: {label: "Curse: may you be shaken like a reed-bed in water and pulled out like a reed from a bundle", cluster: curse}
  curse-heart-empty-like-hole: {label: "Simile curse: as the inside of a hole is empty, may your hearts be empty", cluster: curse}
  trust-in-god-confession: {label: "Confession of trust: 'let whoever trusts, trust (in his own); we trust in our god'", cluster: prayer}
  lover-shaded-under-cedar-and-cypress: {label: "The lovers' meeting place is the shade of cedar, cypress and juniper", cluster: love}
  beloved-body-praised-part-by-part: {label: "The beloved's body is praised part by part in similes (thighs a gazelle, ankles an apple, heels obsidian)", cluster: love}
  lover-eyes-see-plucking-fruit-ears-hear-birds: {label: "The lover wishes his eyes to see the plucking of her fruit and his ears to hear her birds' song (garden imagery for love)", cluster: love}
  sacred-marriage-festival-of-nabu: {label: "The divine wedding of Nabû and Tašmetu is celebrated with the goddess taken to the cella and bed", cluster: cult}
  elamite-court-intrigue-fragment: {label: "Fragmentary literary account of Elamite and Assyrian court affairs, eunuchs and magnates", cluster: history}
  eunuch-official-in-royal-intrigue: {label: "A eunuch official carries out or is caught in a royal intrigue and crawls before the king", cluster: kingship}
  satire-mocking-upstart-official: {label: "A satirical text mocks a named official as low-born, filthy, sexually degraded and boastful", cluster: wisdom}
  boaster-who-praises-himself: {label: "The fool praises himself, speaks and boasts, and becomes a byword and taunt among the people", cluster: wisdom}
  mock-stele-erected-for-enemy: {label: "A mocking monument (stele) is set up 'forever' for a despised person", cluster: wisdom}
  pazuzu-invoked-in-mockery: {label: "The demon Pazuzu son of Hanbi is named in an invective", cluster: demons}
  abundance-and-low-prices-in-good-reign: {label: "In the good king's reign the temples are full and grain, oil and wool are cheap (much for one shekel)", cluster: kingship}
  king-in-days-loved-by-god: {label: "Formula: 'in your days, which the god loves', introducing good signs and blessings", cluster: kingship}
  god-existed-before-heaven-and-earth: {label: "The deity existed before heaven and earth were created", cluster: creation}
  king-given-lions-face: {label: "The god gives the king the face (radiance) of a lion", cluster: kingship}
  i-shall-not-be-ashamed: {label: "The speaker declares 'I shall not be put to shame'", cluster: prayer}
  royal-prayer-dialogue-with-god: {label: "A king's prayer and the god's answer alternate as a dialogue", cluster: prayer}
  do-not-abandon-me-among-my-enemies: {label: "Prayer: 'do not abandon me in the assembly of those who wish me ill; do not let my life fall into their hands'", cluster: prayer}
  devoted-to-god-from-childhood: {label: "The king has lain at the god's feet since he was small", cluster: prayer}
  life-written-before-god: {label: "The petitioner's life is written before the god", cluster: prayer}
  king-suckled-by-goddess-four-teats: {label: "The goddess placed her four teats in the infant king's mouth: two he sucked, two he milked", cluster: kingship}
  lips-not-tired-of-praying: {label: "The god promises the king that his feet will not tire, his hands not tremble and his lips not weary of praying", cluster: prayer}
  daughter-given-as-diplomatic-gift: {label: "A foreign ruler offers his daughter as a greeting-gift to the overlord", cluster: kingship}
  goddess-who-created-king-makes-him-proud: {label: "The goddess who created the king grants him kingship and makes him proud over his opponents", cluster: kingship}
  rebel-who-speaks-lies: {label: "The rebel enemy is characterized as speaking lies", cluster: kingship}
  hunting-nets-for-enemies: {label: "Hunting nets are spread for the king's enemies", cluster: war}
  city-praised-as-date-palm-and-stag: {label: "The capital is hailed as a date palm and a stag of the lands", cluster: hymn}
  bearded-goddess-like-assur: {label: "The goddess (Ištar of Nineveh) wears a beard like the high god Aššur", cluster: hymn}
