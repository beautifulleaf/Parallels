# Full read of the ANE corpus, chunk 36: Amarna letters EA 289 ... EA 144 (in the order of `aneread.py texts 36`).
# Read from ORACC lemmatized transliterations (aemw/amarna), which carry word glosses only (no translation).
# One unit per letter. Many tablets are broken; notes say what survives.
new_motifs:
  prostration-on-belly-and-back: {label: "A vassal says he falls at the overlord's feet seven and seven times 'on the belly and on the back' (kabattu u ṣēru / ṣuhru)", cluster: kingship}
  vassal-groom-of-kings-horses: {label: "A vassal calls himself the groom (kartappu) of the overlord king's horses", cluster: kingship}
  vassal-footstool-of-kings-feet: {label: "A vassal calls himself the footstool of the overlord king's feet", cluster: kingship}
  overlord-sun-from-heaven: {label: "The overlord is hailed as 'the Sun (god) who is from heaven' or 'like the Sun from heaven'", cluster: kingship}
  overlord-like-storm-god-and-sun: {label: "A vassal tells the overlord 'you are like Baal (Addu, the storm god) and like the Sun'", cluster: kingship}
  land-deserts-to-habiru: {label: "The overlord's land or city 'falls away' (paṭārat) or is 'given' to the Habiru (SA.GAZ)", cluster: war}
  vassal-requests-garrison-troops: {label: "A vassal asks the overlord for a stated number of garrison men (maṣṣartu), or for horses and chariots, to guard the king's city", cluster: war}
  vassal-denounces-rival-rulers: {label: "A vassal denounces neighbouring rulers to the overlord by name as traitors who have attacked or seized the king's land", cluster: kingship}
  vassal-says-rivals-slander-him: {label: "A vassal complains that other rulers (mayors) lie about him to the overlord, and asks the king not to trust them", cluster: kingship}
  shechem-given-to-habiru: {label: "A Canaanite ruler (Labʾaya) is said to have given the land of Shechem to the Habiru", cluster: war}
  rebel-sons-continue-fathers-revolt: {label: "The sons of a dead rebel ruler (Labʾaya, ʿAbdi-Aširta) carry on their father's hostility against the overlord's loyal vassals", cluster: war}
  postscript-to-royal-scribe: {label: "A letter ends with a postscript to the overlord's scribe asking him to put the vassal's words well before the king", cluster: scribal}
  overlord-gives-life-and-death: {label: "A vassal tells the overlord 'you give me life and you cause me to die'", cluster: kingship}
  overlord-breath-of-life: {label: "A vassal calls the overlord 'the breath of my life', or awaits the breath (wind) of the king's mouth that revives him", cluster: kingship}
  vassal-head-lifted-eyes-bright-at-kings-word: {label: "On hearing the overlord's word the vassal's heart rejoices, his head is lifted and his eyes shine", cluster: kingship}
  vassal-neck-in-kings-yoke: {label: "A vassal says he has put his neck into the yoke that he carries for the overlord", cluster: kingship}
  vassal-serves-as-his-fathers-did: {label: "A vassal says he serves the overlord as his father and forefathers did from of old (ištu dārīti)", cluster: kingship}
  vassal-has-heard-kings-words-and-obeys: {label: "A vassal answers a royal letter: 'I have heard the words of the king my lord very, very well' and is carrying them out", cluster: kingship}
  vassal-sends-tribute-goods: {label: "A vassal sends the overlord goods (cattle, birds, gold cups, linen, oil, hides) as tribute or gift", cluster: kingship}
  kings-gods-and-strong-hands-guard-land: {label: "A vassal prays that the overlord's gods and his two strong hands guard the king's cities and land", cluster: kingship}
  canaanite-word-in-amarna-letter: {label: "An Akkadian letter from Canaan uses or glosses a Canaanite (West Semitic) word: šamûma 'heavens', lēla 'night', ṣuhru 'back', ḥulli 'yoke', ṣōnu 'flock', sūsîma 'horses', ʿênaya 'eyes'", cluster: scribal}
  island-city-without-water-or-wood: {label: "An island city has no water to drink or wood; its men who cross to the mainland for water and wood are killed or seized by a hostile neighbour", cluster: war}
  naval-blockade-cuts-grain-to-city: {label: "Ships of a hostile city are stationed off a coast so that no grain can be brought into a besieged city", cluster: war}
  neighbour-ruler-harbours-habiru-raiders: {label: "After each city is sacked and burned, the Habiru raiders enter a neighbouring ruler's town and he gives them bread and oil", cluster: war}
  traitor-flees-by-night-to-habiru: {label: "A ruler asked to hand over the Habiru takes them, flees by night and goes over to the Habiru, knowing his guilt", cluster: war}
  vassal-ordered-to-guard-himself-asks-how: {label: "Ordered by the overlord 'guard yourself', the vassal asks with what he can guard himself, from his enemies and from his own peasants, if the king sends no troops", cluster: war}
  vassal-sells-children-and-goods-for-grain: {label: "The besieged vassal's people have given their sons, daughters and the wood of their houses (or their horses) to another land to buy food for their lives", cluster: war}
  vassal-detained-at-overlord-court: {label: "A vassal ruler is kept at the overlord's court; his son pleads for his quick release while neighbours claim he has been sold and will not return", cluster: kingship}
  safe-conduct-oath-demanded: {label: "Before travelling to the overlord, a vassal asks that the king's officials swear by his gods and by the overlord's god that they plan no harm against him", cluster: treaty}
  female-ruler-kings-maidservant: {label: "A woman ruler writes to the overlord as 'your maidservant' (amtu) and reports the land lost", cluster: kingship}
  city-called-kings-maidservant: {label: "A vassal calls his city 'the maidservant of the king'", cluster: kingship}
  nubian-troops-requested: {label: "A vassal asks the overlord for troops of Meluhha or Kush (Nubians) to guard his city", cluster: war}
  vassal-trusts-in-overlords-troops-and-chariots: {label: "A vassal declares he trusts (taklāku) in the overlord's troops and chariots", cluster: war}
  rhetorical-who-is-the-dog: {label: "Rhetorical question: 'who is the dog that would not obey the words of the king?'", cluster: kingship}
  accused-vassal-protests-innocence: {label: "A vassal accused of treason answers that he rescued the king's city and its men, and that the officials who accuse him are lying", cluster: kingship}
  rival-empire-threatens-small-kingdom: {label: "A small kingdom between two empires is threatened by the second (Hatti) for dealing with the first (Egypt), and pleads with its overlord", cluster: war}
  ruler-curses-defecting-brother: {label: "A ruler retakes his father's city from his brother who went over to the Habiru, and curses the brother", cluster: war}
  servants-wait-for-overlord: {label: "A vassal says all the king's servants wait for (qwy) the overlord and look to his eyes", cluster: kingship}
units:
  - id: ane-ea-289-abdi-heba-shechem
    tradition: ane-akkadian
    title: "ʿAbdi-Ḫeba of Jerusalem: Milkilu, the sons of Labʾaya, Shechem given to the Habiru, send 50 men (EA 289)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    read: ["EA 289"]
    tags:
      - {motif: letter-opening-say-to-my-lord, refs: ["EA 289 o:1-2"], note: "ana šarri bēliya qibima umma IR₃-Ḫeba wardaka-ma"}
      - {motif: sevenfold-prostration, refs: ["EA 289 o:3-4"], note: "ana 2 šēpē bēliya šarri 7-tān u 7-tān amqut"}
      - {motif: vassal-denounces-rival-rulers, refs: ["EA 289 o:5-12", "EA 289 r:25-28"], note: "Milkilu (of Gezer), the sons of Labʾaya and the sons of Arzaya, Tagi; Rubbutu taken and 'now Urušalim'"}
      - {motif: shechem-given-to-habiru, refs: ["EA 289 o:21-b.e:24"], note: "enūma Labʾaya u māt Šakmi iddinu ana LU₂.MEŠ ḫabiri"}
      - {motif: habiru-sa-gaz, refs: ["EA 289 b.e:24"]}
      - {motif: rebel-sons-continue-fathers-revolt, refs: ["EA 289 o:5-9"], note: "DUMU.MEŠ Labʾaya u DUMU.MEŠ Arzaya"}
      - {motif: vassal-requests-garrison-troops, refs: ["EA 289 r:36", "EA 289 r:42-46"], note: "yānu-mi LU₂.MEŠ maṣṣartu šarri ittiya; lumaššer šarru 50 LU₂.MEŠ maṣṣarta; gabbi māt šarri paṭrat"}
      - {motif: land-deserts-to-habiru, refs: ["EA 289 r:44"], note: "the land 'falls away' (paṭrat); Jerusalem itself: lū nipṭur Urušalim (r:29)"}
      - {motif: postscript-to-royal-scribe, refs: ["EA 289 t.e:47-l.e:51"], note: "ana ṭupšar šarri bēliya ... awâta banâta idin-mi ana šarri ... ana kâta wardaka anāku"}
    hints:
      - "Compare Josh 10:1-5 (Adoni-zedek king of Jerusalem with the kings of Lachish, Eglon, Hebron, Jarmuth) and Josh 10:33 (Horam king of Gezer)."
      - "Compare Judg 9 (Abimelech and the lords of Shechem; Shechem passing outside central control) and Gen 34; Josh 24:1."
      - "Compare 1 Sam 13:3, 13:7 and 14:21 (the 'Hebrews' (ʿibrim) who go over to the Philistines) and Gen 14:13 ('Abram the Hebrew')."
      - "Places named also in the Hebrew Bible: Gaza, Beth-shean (Bit-šani), Gath-carmel, Keilah (Qiltu, 1 Sam 23:1-13), Rabbah (Rubbutu, Josh 15:60)."
  - id: ane-ea-290-abdi-heba-archers
    tradition: ane-akkadian
    title: "ʿAbdi-Ḫeba: Milkilu and Šuwardata gather Gezer, Gath and Keilah; a town of Jerusalem's land lost; send archers (EA 290)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    read: ["EA 290"]
    tags:
      - {motif: sevenfold-prostration, refs: ["EA 290 o:3-4"]}
      - {motif: vassal-denounces-rival-rulers, refs: ["EA 290 o:5-11", "EA 290 r:25-27"], note: "Milkilu u Šuwardata ... puḫḫiru ERIN₂.MEŠ Gazri, ERIN₂.MEŠ Gimti, ERIN₂.MEŠ Qilti; 'this deed is by the mouth of Milkilu and the mouth of Šuwardata'"}
      - {motif: land-deserts-to-habiru, refs: ["EA 290 o:12-13", "EA 290 r:15-17", "EA 290 r:22-24"], note: "paṭrat māt šarri ana ḫabiri; URU māt Urušalim {uru}E₂.{d}NIN.URTA šumuša ... paṭrat"}
      - {motif: habiru-sa-gaz, refs: ["EA 290 o:13", "EA 290 r:23-24"]}
      - {motif: vassal-pleads-for-archers, refs: ["EA 290 r:19-24"], note: "lumašer ERIN₂.MEŠ piṭâti u lutîra māt šarri ana šarri; šumma yānu ERIN₂.MEŠ piṭâtu paṭrat māt šarri"}
    hints:
      - "The town 'of the land of Jerusalem' written Bit-NIN.URTA is read by some as Bethlehem (Bit-Laḫmi) or Beth-horon; compare Josh 10:10-11 and Ruth 1:1."
      - "Compare Josh 10:3-5 (a coalition of southern kings) and 1 Sam 23:1-5 (Keilah attacked; David sent to save it)."
  - id: ane-ea-279-shuwardata-archers
    tradition: ane-akkadian
    title: "Šuwardata: the king's land is ruined; send archers against the enemies (EA 279)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    read: ["EA 279"]
    tags:
      - {motif: overlord-addressed-as-my-god-my-sun, refs: ["EA 279 o:1-2", "EA 279 o:6-7"]}
      - {motif: vassal-dust-under-kings-feet, refs: ["EA 279 o:5"], note: "wardaka eper ša šēpēka"}
      - {motif: sevenfold-prostration, refs: ["EA 279 o:8"]}
      - {motif: vassal-pleads-for-archers, refs: ["EA 279 o:9-r:23"], note: "gamrat māt šarri ... ana Qilti ... yuššira šarru ERIN₂.MEŠ piṭâta ... nidupur šārūta ištu māt šarri"}
    hints:
      - "Compare 1 Sam 23:1-5 (Keilah, Qiltu, under attack)."
  - id: ane-ea-211-zitri-yarah-sun-from-heaven
    tradition: ane-akkadian
    title: "Zitriyara: the king is like the Sun from heaven; we cannot neglect his word (EA 211)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    read: ["EA 211"]
    tags:
      - {motif: prostration-on-belly-and-back, refs: ["EA 211 o:4-7"], note: "7 u šibitān u {uzu}šašallu-ma u {uzu}kabattu ana šēpē šarri amqut"}
      - {motif: overlord-sun-from-heaven, refs: ["EA 211 r:15-17"], note: "šarru kīma {d}UTU ištu AN.ḪI.A ša-mu-ma"}
      - {motif: canaanite-word-in-amarna-letter, refs: ["EA 211 r:17"], note: "AN.ḪI.A 'heavens' glossed ša-mu-ma, Canaanite šamûma (Hebrew šāmayim)"}
      - {motif: vassal-has-heard-kings-words-and-obeys, refs: ["EA 211 o:10-r:14", "EA 211 r:18-l.e:25"], note: "lā nilaʾu ezēb awāt šarri"}
    hints:
      - "Compare Ps 84:12 (YHWH God is a sun and shield) and Mal 3:20 (the sun of righteousness)."
  - id: ane-ea-246-biridiya-sons-of-labaya
    tradition: ane-akkadian
    title: "Biridiya of Megiddo: the two sons of Labʾaya pay silver to the SA.GAZ and Suteans to make war on me (EA 246)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    read: ["EA 246"]
    tags:
      - {motif: sevenfold-prostration, refs: ["EA 246 o:5-7"]}
      - {motif: rebel-sons-continue-fathers-revolt, refs: ["EA 246 r:5'-10'"], note: "2 DUMU.MEŠ Labʾaya tiddinūna kaspīšunu ana LU₂.MEŠ SA.GAZ u ana LU₂.MEŠ Sute ana epēš nukurti eliya; the middle of the tablet is broken"}
      - {motif: habiru-sa-gaz, refs: ["EA 246 r:7'"], note: "Habiru hired with silver"}
    hints:
      - "Compare Judg 9:4 (Abimelech hires 'empty and reckless men' with silver from the temple of Baal-berith) and Judg 11:3."
  - id: ane-ea-295-baal-shipti-sidon
    tradition: ane-akkadian
    title: "A ruler (Baʿlu-ṯipṭi): dust under the king's sandals, servant from head to foot; Yabni-ilu of Sidon did evil (EA 295)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    read: ["EA 295"]
    tags:
      - {motif: overlord-addressed-as-my-god-my-sun, refs: ["EA 295 o:1", "EA 295 o:6"]}
      - {motif: vassal-dust-under-kings-feet, refs: ["EA 295 o:4"], note: "epru ištu šapli 2 {kuš}šēnē šarri"}
      - {motif: sevenfold-prostration, refs: ["EA 295 o:6-7"]}
      - {motif: vassal-serves-as-his-fathers-did, refs: ["EA 295 o:8-11"], note: "urrudu šarra ištu qaqqadiya adi šēpēya kīma abbūtiya ištu dāriti"}
      - {motif: vassal-denounces-rival-rulers, refs: ["EA 295 o:12-16"], note: "Yabni-ilu man of Sidon did lumnu to me; lines broken at the right"}
      - {motif: vassal-requests-garrison-troops, refs: ["EA 295 r:5'-7'"], note: "50 LU₂.MEŠ qadu 1 inspector of the guard to guard the city"}
    hints:
      - "Compare Ps 60:10 / 108:10 ('upon Edom I cast my sandal') and Isa 1:6 ('from the sole of the foot to the head')."
  - id: ane-ea-159-aziru-like-baal-and-sun
    tradition: ane-akkadian
    title: "ʿAziru: you are like Baal and like the Sun; I am the king's dog, rebuilding Ṣumur; the mayors lie (EA 159)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    read: ["EA 159"]
    tags:
      - {motif: overlord-addressed-as-my-god-my-sun, refs: ["EA 159 o:1", "EA 159 o:4-6"]}
      - {motif: overlord-like-storm-god-and-sun, refs: ["EA 159 o:7-8"], note: "bēliya attā kīma {d}IŠKUR u attā kīma {d}UTU"}
      - {motif: vassal-says-rivals-slander-him, refs: ["EA 159 o:9-10", "EA 159 r:39-42"], note: "ukazzibūni ... ḫazannūte ... LU₂.MEŠ sarrūtu, bēliya lā taqīpšunu"}
      - {motif: vassal-calls-himself-kings-dog, refs: ["EA 159 o:17"], note: "anāku kalbu ša šarri bēliya"}
      - {motif: vassal-sends-tribute-goods, refs: ["EA 159 r:33-38"], note: "oil, a mina of myrtle, hides of wild cows, sent (ušēbil) to my lord; broken"}
    hints:
      - "Compare Ps 18:8-16 and Ps 29 (God as storm god) with Ps 84:12 (sun); and 2 Sam 9:8, 2 Kgs 8:13 (the servant as dog)."
  - id: ane-ea-168-aziru-arrives-in-peace
    tradition: ane-akkadian
    title: "ʿAziru: I have arrived safely to see the king's face; my brothers and sons are the king's servants (EA 168)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    read: ["EA 168"]
    tags:
      - {motif: overlord-addressed-as-my-god-my-sun, refs: ["EA 168 o:1", "EA 168 o:3-4"]}
      - {motif: sevenfold-prostration, refs: ["EA 168 o:3"]}
      - {motif: vassal-detained-at-overlord-court, refs: ["EA 168 o:5-11", "EA 168 t.e:13-l.e:16"], note: "kašdāku ina šulmi ana amāri pāni šarri; goods arrived by ship; reverse badly broken; tuballiṭ 'you have given life' (l.e:15)"}
    hints:
      - "Compare Gen 43:3-5 and 2 Sam 14:24, 28 (seeing / not seeing the king's face)."
  - id: ane-ea-169-son-of-aziru
    tradition: ane-akkadian
    title: "A son of ʿAziru: you give life and you kill; release ʿAziru quickly, the Suteans and Nuḫašše threaten (EA 169)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    read: ["EA 169"]
    tags:
      - {motif: sevenfold-prostration, refs: ["EA 169 o:4"]}
      - {motif: overlord-gives-life-and-death, refs: ["EA 169 o:7-11"], note: "ana pāni šarri bēlini nidaggal; attā tuballaṭanni u attā tušmītanni; ana pānika-ma adaggal"}
      - {motif: vassal-detained-at-overlord-court, refs: ["EA 169 o:12-16", "EA 169 r:22-29", "EA 169 r:37-38"], note: "Aziru ina ašrānu lā tuwaḫḫiršu, arḫiš uššeraššu; the men of Nuḫašše say abūka-mi ina ḫurāṣi tapšuršu ana šarri māt Miṣri"}
      - {motif: rival-empire-threatens-small-kingdom, refs: ["EA 169 r:30-35"], note: "the Suteans break away and say 'your father lives in Egypt; we will make war with you'"}
    hints:
      - "Compare Deut 32:39 and 1 Sam 2:6 ('YHWH kills and makes alive'); and Q 2:258 (the king who says 'I give life and cause death')."
      - "Compare Gen 42-44 (a son kept in Egypt as surety) and Ps 123:2 (eyes of servants to the hand of their master)."
  - id: ane-ea-090-rib-addi-bird-in-cage
    tradition: ane-akkadian
    title: "Rib-Hadda: Byblos alone; ʿAbdi-Aširta the dog; like a bird in a trap; a field like a wife without husband (EA 090)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    read: ["EA 090"]
    tags:
      - {motif: sevenfold-prostration, refs: ["EA 090 o:4-5"]}
      - {motif: loyal-vassal-alone-among-defectors, refs: ["EA 090 o:6-8", "EA 090 o:22-23", "EA 090 o:27-28"], note: "Gubla ina ēdēniše ritḫat ... anāku ina ēdēniya; kali LU₂.MEŠ ḫazanūti šalmū ana ʿAbdi-Aširta"}
      - {motif: rival-called-dog-or-snake, refs: ["EA 090 o:21", "EA 090 o:26"], note: "ʿAbdi-Aširta: kalbu šūt"}
      - {motif: habiru-sa-gaz, refs: ["EA 090 o:24-25"], note: "yilteqûšunu LU₂ GAZ.MEŠ"}
      - {motif: vassal-sells-children-and-goods-for-grain, refs: ["EA 090 r:36-39"], note: "gamrū mārūnu mārātunu GIŠ.MEŠ bītāti ina nadāni ina māt Yarimmuta ina balāṭ napištini"}
      - {motif: besieged-king-shut-up-like-caged-bird, refs: ["EA 090 r:39-42"], note: "kīma iṣṣūri ša ina libbi ḫuḫāri šaknat kišūma anāku ina Gubla"}
      - {motif: field-like-wife-without-husband, refs: ["EA 090 r:42-44"], note: "eqliya aššatu ša lā muta mašlat aššum balī erēši"}
      - {motif: vassal-requests-garrison-troops, refs: ["EA 090 r:44-53"], note: "x ME ERIN₂.MEŠ u 30 tāpal ANŠE.KUR.RA; palḫāti napištiya"}
      - {motif: vassal-pleads-for-archers, refs: ["EA 090 t.e:60-l.e:64"], note: "urra mūša pānūya nadnū ana aṣê ERIN₂.MEŠ piṭâti"}
    hints:
      - "Compare Ps 124:7 (our soul escaped like a bird from the fowler's snare) and Lam 3:52."
      - "Compare Isa 54:1, 62:4 (the land 'married' or 'forsaken') and Neh 5:2-5 (sons and daughters given for grain)."
  - id: ane-ea-093-rib-addi-to-amanappa
    tradition: ane-akkadian
    title: "Rib-Hadda to Amanappa: ask the king for 300 men; if no archers this year, ʿAbdi-Aširta will be strong for ever (EA 093)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    read: ["EA 093"]
    tags:
      - {motif: letter-opening-say-to-my-lord, refs: ["EA 093 o:1-3"], note: "to the Egyptian official Amanappa; ana šēpēka amqut"}
      - {motif: vassal-requests-garrison-troops, refs: ["EA 093 o:10-13"], note: "3 ME LU₂.MEŠ"}
      - {motif: vassal-pleads-for-archers, refs: ["EA 093 r:16-28"], note: "šumma MU.KAM annīta yānu ERIN₂.MEŠ piṭâta u dannu adi dāriti"}
  - id: ane-ea-112-rib-addi-guard-yourself
    tradition: ane-akkadian
    title: "Rib-Hadda: 'guard yourself' - with what? from my enemies and my own peasants; a Habiru hired to carry a tablet to Ṣumur (EA 112)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    read: ["EA 112"]
    tags:
