    tradition: ane-hittite
    title: Tale of Appu - the rich childless man, the sun god's promise, and the births of Evil and Righteous (CTH 360.1 §1-16)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Hittite"
    read: ["CTH 360.1 §1:1-§16:112"]
    tags:
      - {motif: god-exalts-just-fells-wicked-like-tree, refs: ["CTH 360.1 §1:2-5"], note: "[ha]n[dand]uš LÚ.MEŠ-uš kuiš [šarl]iškezzi 'who exalts the just men'; huwappaš-kan LÚ.MEŠ-uš [GIŠ-ru m]ān lilakki 'fells the evil men like wood'; šakšakiluš walhannai 'strikes their skulls'; tuš harnikzi 'destroys them'"}
      - {motif: do-not-lift-up-horn, refs: ["CTH 360.1 §1:2-5"]}
      - {motif: rich-man-lacks-only-a-son, refs: ["CTH 360.1 §2:6-11", "CTH 360.1 §3:12", "CTH 360.1 §4:13-15"], note: "{URU}šudul in Lulluwa by the sea; {m}appu ... happinanza 'the richest'; GU4.HI.A UDU mekkiš; KÙ.BABBAR GUŠKIN NA4 ZA.GÌN ... hahhariyan 'heaped'; nu-šši-pa Ú-UL kuitki wakkari ... 1-an uttar wakkari: DUMU.NITA-ši DUMU.MUNUS-iš NU.GÁL 'he lacks nothing; one thing he lacks: he has neither son nor daughter'"}
      - {motif: childless-man-shamed-at-elders-meal, refs: ["CTH 360.1 §4:16-19"], note: "LÚ.MEŠ ŠU.GI 'the elders' sit to eat; kuišša DUMU.NITA-li NINDA-an Ì-ya pāi 'each gives his son bread and fat'; {m}appuš-ma NINDA-an Ú-UL kuitanikki pāi 'Appu gives bread to no one'"}
      - {motif: childless-man-sleeps-in-his-shoes, refs: ["CTH 360.1 §5:20-24", "CTH 360.1 §6:25-29"], note: "the table covered with linen stands before the altar (GIŠ ZAG.GAR.RA); [GIŠ].NÁ-aš šarkuwanza šeškit 'went to bed booted'; Ú-UL-wa kuššanka katta ēpta 'he never had intercourse'; the wife lies down beside him waššanza 'clothed'"}
      - {motif: husband-dismisses-wife-as-understanding-nothing, refs: ["CTH 360.1 §7:30-37"], note: "Ù-az parkuiyatat 'started up from sleep'; [MUNUS-a]nza-wa-za MUNUS-niliyaz zik nu-wa Ú-UL kuitki šakti 'you are a woman of womanly kind and know nothing'"}
      - {motif: childless-man-brings-white-lamb-to-sun-god, refs: ["CTH 360.1 §8:38-40"], note: "harkin SILA4-an dāš 'took a white lamb'; {d}UTU-i kattan iyanniš 'went to the sun god'"}
      - {motif: god-takes-form-of-young-man, refs: ["CTH 360.1 §8:41-44"], note: "{d}UTU-uš-kan nepišaza katta š[akuwayat] 'looked down from heaven'; nan-za {LÚ}GURUŠ-anza kiš[at] 'he became a young man' and went to him"}
      - {motif: god-asks-petitioner-what-is-your-grievance, refs: ["CTH 360.1 §8:45", "CTH 360.1 §9:47-52"], note: "[k]uit-wa waštultit 'what is your sin (offence)?'; nu-wa-mu aššu pier ... 1-an uttar wak[kari] ... NU.GÁL 'they have given me wealth; one thing I lack: neither son nor daughter'"}
      - {motif: god-promises-son-go-sleep-with-wife, refs: ["CTH 360.1 §9:53-59"], note: "iit-za eku nu-za ninka 'go, drink, quench your thirst'; DAM-KA aššu šaštan šeški 'sleep well (in bed) with your wife'; DINGIR.MEŠ-aš pianzi 1-an DUMU.NITA-an 'the gods will give you one son'"}
      - {motif: childless-king-prays-for-heir, refs: ["CTH 360.1 §8:38-45"]}
      - {motif: storm-god-fears-disaster-at-sun-gods-coming, refs: ["CTH 360.1 §10:62-68", "CTH 360.1 §11:69-74"], note: "the storm god sees the sun god 3 DANNA off; KUR-eantaš {LÚ}SIPA.UDU-aš 'shepherd of the lands'; KUR-e-wa nikku kuwapikki harkan 'has the land perished somewhere?'; cities laid waste? troops beaten? orders the cook and cupbearer to give him food and drink"}
      - {motif: sun-god-shepherd-of-the-land, refs: ["CTH 360.1 §10:65"]}
      - {motif: pregnancy-months-counted-to-tenth, refs: ["CTH 360.1 §15:89-92"], note: "ITU 1.KAM ... ITU 9.KAM p[ait] nu [IT]U 10.KAM tiyat 'one month ... nine months passed, the tenth month arrived'; DAM {m}appu DUMU.NITA-an hašta"}
      - {motif: birth-in-tenth-month, refs: ["CTH 360.1 §15:91", "CTH 360.1 §16:102"]}
      - {motif: child-set-on-grandfathers-knee, refs: ["CTH 360.1 §15:93-96", "CTH 360.1 §16:104-107"], note: "{MUNUS}ÙMMEDA-aš ... karapta ... {m}appu ginuwaš halaiš 'the nurse lifted the son and set him on Appu's knees'; he rejoices and rocks him (kunkiškiuwan)"}
      - {motif: son-named-evil-because-gods-chose-evil-way, refs: ["CTH 360.1 §15:97-100"], note: "šanezzi laman {LÚ}HUL-lu dāiš 'gave him the fine name Evil'; kuwapi-ši attašmiš DINGIR.MEŠ-aš NÍG.SI.SÁ-an KASKAL-an Ú-[UL ...] HUL-lu KASKAL-an harker 'since my fathers' gods did not (choose) the right road but kept the evil road'"}
      - {motif: son-named-righteous-because-gods-chose-right-way, refs: ["CTH 360.1 §16:101-112"], note: "NÍG.SI.SÁ-an ŠUM-an daiš 'gave him the name Righteous'; [atta]šmiš DINGIR.MEŠ NÍG.SI.SÁ-an KASKAL-an eppir"}
      - {motif: child-named-for-misfortune, refs: ["CTH 360.1 §15:97-100"]}
      - {motif: barren-matriarch, refs: ["CTH 360.1 §6:26-29"], note: "here the failure is the husband's; the wife is not called barren"}
    hints:
      - "Childless rich man who petitions a god and is promised a son: compare Zakariyya's prayer (Q 19:2-10, Q 21:89-90, Q 3:38-41: 'my Lord, do not leave me alone, You are the best of inheritors') and Abraham's promise (Q 11:69-73, 51:24-30; Gen 15:2-4, 18:1-15)."
      - "A god from heaven who takes the form of a young man: compare the spirit who appears to Mary 'as a well-formed man' (Q 19:17), the angels as men at Abraham's tent (Gen 18:2, Q 51:24) and Manoah's visitor (Judg 13)."
      - "'What is your sin?': childlessness treated as a fault to be explained; compare Q 42:49-50 (He makes barren whom He wills) and 1 Sam 1:5-18 (Hannah)."
      - "Child named for the father's gods' evil or right way: compare Gen 35:18 (Benoni/Benjamin), 1 Chr 7:23, and Q 3:36 (Mary named by her mother)."
      - "Birth in the tenth (lunar) month: compare Q 46:15 (bearing and weaning thirty months)."

  - id: ane-cth-360-1-appu-brothers-divide
    tradition: ane-hittite
    title: Tale of Appu - Evil and Righteous divide the estate; the lawsuit before the sun god and Ishtar (CTH 360.1 §17-30)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Hittite"
    read: ["CTH 360.1 §17:113-§30:174"]
    tags:
      - {motif: brothers-good-and-evil, refs: ["CTH 360.1 §19:121-126"], note: "{LÚ}HUL-aš ŠEŠ-aš 'brother Evil' and {LÚ}NÍG.SI.SÁ ŠEŠ 'brother Righteous'"}
      - {motif: brothers-divide-estate-and-separate, refs: ["CTH 360.1 §18:116-120", "CTH 360.1 §19:121-123", "CTH 360.1 §21:139"], note: "when grown and come to manhood (LÚ-ni mehuni arāer) they divide; [ueš]a-wa-za šarraweni nu-wa-nnaš a[rhayan e]šuwaštati 'let us divide and settle apart'"}
      - {motif: live-apart-as-gods-dwell-in-own-cities, refs: ["CTH 360.1 §19:127-130", "CTH 360.1 §20:131-138"], note: "HUR.SAG.HI.A GIM-an [arhayan aš]anzi ... ÍD.MEŠ ... aršanzi ... DINGIR.MEŠ-ya; {d}UTU-uš {URU}ZIMBIR, {d}30 {URU}kuzina, {d}10 {URU}kummiya, {d}IŠTAR {URU}nenuwa, {d}nanaya {URU}kiššina, {URU}KÁ.DINGIR.RA {d}AMAR.UTU"}
      - {motif: cheating-brother-takes-better-share, refs: ["CTH 360.1 §21:140-142", "CTH 360.1 §22:143-147"], note: "half each; GIŠ APIN-aš GU4 'a plough ox' and ÁB-aš GU4 'a cow'; Evil takes the plough ox 'the good ox', gives [GU4].ÁB ... HUL-lun 'the cow, the bad ox' to Righteous"}
      - {motif: god-blesses-the-lesser-share, refs: ["CTH 360.1 §22:148-150"], note: "{d}UTU-uš nepi[šaz ... šakuwaiy]at 'the sun god looked down from heaven'; paiddu-wa ... GU4.ÁB SIG5-ru ... hašdu 'from now on let the cow be good; let it give birth'"}
      - {motif: sun-god-judges-brothers-lawsuit, refs: ["CTH 360.1 §23:154-156"], note: "[{URU}ZIMBI]R.ME erer ... {d}UTU-i DI-ešni tier 'they stepped before the sun god for judgement'; {LÚ}NÍG.SI.SÁ-an šar[laet] 'he made Righteous prevail'"}
      - {motif: sun-god-judge-of-gods, refs: ["CTH 360.1 §23:155-156"]}
      - {motif: loser-curses-the-divine-judge, refs: ["CTH 360.1 §24:157-158"], note: "[hur]zakiuwan dāiš 'began to curse'; {d}UTU-uš hurtāuš IŠ-ME 'the sun god heard the curses'; subject restored as Evil"}
      - {motif: judge-god-refers-case-to-another-god, refs: ["CTH 360.1 §24:159-161", "CTH 360.1 §25:162-165"], note: "Ú-UL-[wa ... hanah]hi DI-eššar 'I will not judge the case for you'; {d}IŠTAR-iš {URU}ninuwaš ... hannāu 'let Ishtar of Nineveh judge it'; they reach Nineveh; then broken; colophon [DU]B 1.KAM Š[A {m}app]u NU.TIL 'first tablet of Appu, not finished'"}
      - {motif: father-fixes-inheritance-shares-before-king, refs: ["CTH 360.1 §18:119"], note: "loosely: here the sons divide Appu's goods themselves"}
    hints:
      - "Good and evil brothers and an unequal division: compare Cain and Abel (Q 5:27-31, Gen 4), Jacob and Esau (Gen 25:29-34, 27), Abraham and Lot parting (Gen 13:8-12: 'let us separate'), and the Egyptian Truth and Falsehood."
      - "God blessing the poorer share of the righteous: compare the owners of the garden (Q 68:17-33) and the two men with gardens (Q 18:32-44), where the proud one's better share is ruined."
      - "The sun god as judge of a lawsuit between brothers: compare David and Solomon judging the field (Q 21:78-79) and 2 Sam 14:5-11."
      - "Cursing the judge: compare Exod 22:27 (do not curse God or the ruler) and Q 6:108."

