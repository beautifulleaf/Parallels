      - {motif: sea-personified-guest-of-high-god, refs: ["CTH 348.I.6 §2:12", "CTH 348.I.6 §2:23-26"], note: "an rhyton (BI-IB-RU) is put in the Sea's hand; the great Sea is escorted from Kumarbi's house with lyre (arkammi), galgalturi and bronze rhyta; the Sea looks out for Kumarbi I-NA UD 7.KAM 'for seven days'"}
      - {motif: lovers-in-bed-six-days-then-god-slips-away, refs: ["CTH 348.I.6 §2:26"], note: "loosely: a seven-day term before the union"}
      - {motif: insatiable-devourer, refs: ["CTH 348.I.6 §1:3-8"], note: "arha-ma-an eter 'they ate him up'"}
