      - {motif: adopt-as-son-perhaps-useful, refs: ["CTH 363.1 §16:131-134"]}
      - {motif: saying-on-womans-wisdom-and-obedience, refs: ["CTH 363.1 §17:154-158"], note: "MUNUS-aš ZI-anza haddanza 'a woman's mind is clever'; tapariyaz-ma parā karšan harzi 'keeps away from command'; ŠA DINGIR-LIM-ya ... mitnaza 'from the god's ...'; MUNUS-aš-ma :hapazuwalanni aranza 'the woman stands in obedience'; LÚ-aš [memi]yan Ú-UL wahnuzzi 'does not twist the man's word'"}
