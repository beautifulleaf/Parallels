      - {motif: mother-interprets-dreams-of-companion, refs: ["CTH 361.I.1 §10:43", "CTH 361.I.1 §13:63-68"], note: "the stone from heaven as in Gilgamesh's dream; AMA-ŠÚ: za[šhiaš] uttar-šet apāt 'the word of the dream is this'; welku ša[lleškezzi] 'the grass grows'; arha-ma-šši-kan ÍD-aš ā[rašzi] 'a river flows out of it'"}
      - {motif: mother-interprets-sons-dreams, refs: ["CTH 361.I.1 §12:57", "CTH 361.I.1 §13:58-68"]}
      - {motif: series-of-seven-numbered-dreams, refs: ["CTH 361.I.1 §11:46", "CTH 361.I.1 §12:48-53"], note: "attaš DINGIR.MEŠ ... lapnuškiuwan 'the gods of his father kindled fire'; [GIŠ S]I.GAR UZU GÚ-ši kitta 'a neck-yoke lies on his neck'; MUNUS-aš GIŠ batalhaš 'a woman's clog'; UR.MAH 'lions'; āškaš 'to the gate'; [dammanašš]aruš uemiat 'found earth-serpents'"}
      - {motif: sun-rises-with-halo-ends-night-of-dreams, refs: ["CTH 361.I.1 §12:54-57"], note: "lukkatta 'it grew light'; {d}[UT]U-uš-kan kalmaraz uet 'the sun god came with his radiance'"}
      - {motif: hero-paralyzed-by-fear, refs: ["CTH 361.I.1 §13:58-62", "CTH 361.I.1 §13:70-71"], note: "kī mahhan i[yaweni] 'what shall we do?'; HUR.SAG-i akkueni 'shall we die in the mountains?'; karipandu 'let them devour me?'; akkueni 'we die'"}
