      - {motif: monster-drugged-asleep-like-cattle, refs: ["CTH 348.I.4 §3:13-17"], note: "waršulan KAŠ ištahta 'tasted the fragrance, the beer'; tešhaš ēpta 'a dream (sleep) seized' Hedammu; GU4-aš ANŠE-ašša iwar šuppariyanza 'asleep like oxen and asses'; recognises nothing"}
      - {motif: goddess-seduces-monster-with-nakedness, refs: ["CTH 348.I.4 §4:18-26"], note: "šarā-kan namma e[hu] 'come up again!'; [nekuman]da parā appiškezzi 'holds out her naked (limbs)'; LÚ-natar parā watkuškezzi 'his manhood leaps forth' and impregnates (armahhiškezzi)"}
      - {motif: monster-ravages-cities-heaps-heads, refs: ["CTH 348.I.4 §4:27-32"], note: "1 ME 30 URU.DIDLI.HI.A '130 cities', with his belly 70 cities; harpuš SAG.DU-aš harpiyat 'heaped heaps of heads'"}
      - {motif: harlot-tames-wild-man, refs: ["CTH 348.I.4 §4:23-26", "CTH 348.I.4 §6:41-45"], note: "the seduction that tames: Hedammu answers MUNUS KI.SIKIL ... āššiyatar ... pāi ... ehu daššauaš 'girl, if love ..., give love! come into the heavy waters'"}
