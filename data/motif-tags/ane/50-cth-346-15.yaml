      - {motif: god-asked-to-lower-kind-eyes-raise-thousand-lashes, refs: ["CTH 371.1 §4:20-24"], note: "āššu IGI.HI.A-KA lāk 'bend your good eyes'; LI-IM laplippuš karap 'lift (your) thousand eyelashes'; LUGAL-un anda āššu šakuwaya 'look kindly on the king'; ear-line §4:23 is empty in the original, the translation supplies it; āššu uttar [i]štamaš 'hear the good word'"}
      - {motif: deliver-from-evil-set-in-good-place, refs: ["CTH 371.1 §4:25-27", "CTH 371.1 §14:78"], note: "nan-kan i[dālawaz] dā 'take him from evil' (restored in §4:26, preserved in §14:78 idālauwaz dātten); āššawi pēdi tittanut 'set him in a good place'"}
      - {motif: storm-god-sends-winds-in-succession-for-harvest, refs: ["CTH 371.1 §4:28-30", "CTH 371.1 §13:72"], note: "loosely: māu šešdu 'let it grow and thrive'; A-NA DINGIR.MEŠ NINDA.GUR4.RA GEŠTIN išpanduzz[i] aršiyattaru 'let thick bread, wine and libation flourish for the gods'"}
      - {motif: underworld-court-asked-to-speak-good-of-king, refs: ["CTH 371.1 §5:31-35", "CTH 371.1 §6:38-41", "CTH 371.1 §7:42-46", "CTH 371.1 §8:47-51", "CTH 371.1 §9:54-58", "CTH 371.1 §10:61-63", "CTH 371.1 §11:64-66", "CTH 371.1 §12:67-69"], note: "duwaddu ... {d}LAMMA-ŠU, {LÚ}SUKKAL-ŠU, [AR]AD.MEŠ-ŠU 'who put her to bed and strengthen her', {d}dārawa, {d}parāya, chief eunuch, chief barber, {d}hilašši; DI-ma tuel ēštu 'the case shall be yours'; azzikki akkuški 'eat and drink'; ŠUM-MI LUGAL ... āššu taraški 'speak well of the king's name'"}
      - {motif: gods-vizier-and-consort-intercede, refs: ["CTH 371.1 §6:38-40"]}
      - {motif: god-acts-as-kings-intercessor-in-temple, refs: ["CTH 371.1 §13:70-77", "CTH 371.1 §14:80-84"], note: "mān uwatteni ... āššu šarā udatten 'when you come (up), bring good up!'; EGIR.UD-MI [DING]IR.MEŠ-nan uddār irhān ēšt[u] 'in future let the words of the gods be done in order'; the king has 'gone through' (celebrated) the Sun goddess and you"}
      - {motif: slanderer-with-forked-tongue, refs: ["CTH 371.1 §15:85-87", "CTH 371.1 §16:88"], note: "kušduwata 'slander'; kuel id[ālu] 'whose evil'; broken"}
    hints:
      - "Intercessors in the court of the underworld goddess, bribed with food to speak well of the king: the sharpest divergence from the Quran's polemic against intercessors, Q 2:255 ('who can intercede with Him except by His leave?'), Q 10:18 ('these are our intercessors with God'), Q 39:3 ('we worship them only to bring us near'), Q 74:48."
      - "Do not listen to slander even from father, mother or brother: compare Q 49:6 (verify the report of a wrongdoer), Q 31:14-15 (do not obey parents in associating partners) and Ps 27:10 ('though my father and mother forsake me')."
      - "'Look with kind eyes, incline your ear': Ps 17:6, 2 Kgs 19:16, Dan 9:18; Quranic 'He hears and sees' (Q 58:1)."
      - "'Take him from evil, set him in a good place': compare the Lord's Prayer 'deliver us from evil' and Q 23:29 ('my Lord, land me at a blessed landing place'), Q 7:23 (confession, forgiveness)."

