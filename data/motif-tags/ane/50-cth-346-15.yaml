# Full read of the ANE corpus, chunk 50: CTH 346.15-21, 347-353, 360-365, 371. Read from hethiter.net / TLHdig (Hittite).
new_motifs:
  storm-god-king-of-all-humanity: {label: "The storm god is called king of all mankind, with his heroism and valour praised", cluster: kingship}
  why-do-you-kneel-rebuke: {label: "A speaker rebukes others: why do you kneel (bow down) before him?", cluster: polemic}
  where-do-silver-and-gold-come-from: {label: "A speaker asks where silver and gold come from and whence they are, with divine statues mentioned", cluster: wisdom}
  deity-asks-which-god-came-to-me: {label: "After a purification or awakening a figure asks 'which god came to me?'", cluster: revelation}
  ancients-saying-quoted: {label: "A character quotes what 'the ancients' (karuwiliēš) say, as a proverb that guides his decision", cluster: wisdom}
  lions-bed-begets-hero: {label: "Proverb: the lion's bed begets a hero; if a father begets a heroic son he will stand against a thousand armies", cluster: wisdom}
  wise-father-warns-son-of-gods-plan: {label: "A father (Hamsha) passes on to his son (Atramhasi) the words of a god and tells him how to act to survive", cluster: flood}
  feast-invitation-as-death-trap: {label: "A son is warned that the feast to which a god invites him will mean his death: he will die like a mortal", cluster: flood}
  wooden-statue-made-as-substitute: {label: "The hero is told to make a statue of wood (ALAM IṢṢI), apparently as a substitute or decoy", cluster: magic}
  fields-given-to-another: {label: "A man's fields are given to another (dameda) in a divine plan or disaster", cluster: flood}
  ant-will-devour-crop: {label: "Warning that in this year the ant will eat (the crop), with a plant remedy (hutanu) to take", cluster: flood}
  carts-driven-away-grain-saved: {label: "The hero is told to drive away the carts and bring the grain to another place before disaster", cluster: flood}
  ditches-dug-round-about: {label: "Ditches are dug all around (a field or settlement) as a protective measure", cluster: flood}
  divine-assembly-confronts-enlil: {label: "According to an oracle the gods and Enlil stand against each other in assembly", cluster: council}
  vizier-reports-assembly-to-master: {label: "A god's vizier hears the words of the divine assembly, returns to his lord and reports that he spoke his master's word before them", cluster: council}
  wise-god-protests-destruction-of-humanity: {label: "The wise god (Ea) protests in the divine assembly against destroying humanity: why do you destroy mankind?", cluster: flood}
  without-humans-gods-get-no-offerings: {label: "If mankind is destroyed, no one will offer the gods bread, libations or burn cedar for them", cluster: cult}
  without-humans-gods-must-plough-and-grind: {label: "Without humans the great gods themselves will have to take the plough and grind at the millstone", cluster: cult}
  god-accused-of-visiting-evil-on-mankind: {label: "A god is asked why he visits mankind with evil when they offer to him gladly in his temple", cluster: theodicy}
  blood-and-tears-of-mankind: {label: "The blood and tears of mankind are invoked against a destroying god", cluster: theodicy}
  messenger-travels-unseen-by-sun-and-moon: {label: "A messenger is told to travel under the earth by river and ground so that the moon, the sun and the gods of the earth do not see him", cluster: messenger}
  sea-personified-guest-of-high-god: {label: "The great Sea, personified, comes up to the father of the gods, is given a chair, a laid table and sweet wine", cluster: myth}
  door-bolted-for-secret-council: {label: "A god orders his vizier to bolt the door and push the bars for a secret plan", cluster: council}
  monster-child-fed-thousands-of-cattle: {label: "A monstrous child is reared on thousands of oxen and horses, countless lambs and kids, and fish", cluster: monster}
  insatiable-devourer: {label: "A monster or being devours everything without being sated", cluster: monster}
  goddess-seduces-monster-with-nakedness: {label: "A goddess shows her naked limbs to a sea monster to seduce and overpower it", cluster: monster}
  monster-drugged-asleep-like-cattle: {label: "Having tasted a potion (beer, love-charm) put into the waters, the monster falls into a sweet sleep like cattle and recognises nothing", cluster: monster}
  love-charm-poured-into-waters: {label: "The goddess pours 'love' and aromatic woods into the waters to bewitch the monster", cluster: magic}
  monster-ravages-cities-heaps-heads: {label: "The monster devastates scores of cities and piles up heaps of heads", cluster: monster}
  guest-refuses-seat-food-and-cup: {label: "A guest refuses to sit on the chair offered, to touch the table or to put his lip to the cup", cluster: hospitality}
  tears-flow-like-canals: {label: "Tears flow from someone like canals", cluster: lament}
  sea-offers-giant-daughter-in-marriage: {label: "The Sea offers his daughter, a mile long and a mile broad, as wife for the father of the gods to beget a champion", cluster: myth}
  monster-asks-who-are-you-woman: {label: "The monster asks the seductive goddess 'what kind of woman are you? which god are you, that you do not fear?'", cluster: monster}
  goddess-intoxicates-with-words: {label: "The goddess kneels before the monster and makes him drunk with her words", cluster: monster}
  lovelinesses-run-after-like-puppies: {label: "After bathing and anointing, the goddess's charms run after her like little puppies", cluster: love}
  goddess-orders-musicians-to-play-at-shore: {label: "The goddess orders her attendants (Ninatta, Kulitta) to play the galgalturi and arkammi on the sea shore", cluster: music}
  monster-threatens-to-eat-goddess: {label: "The monster threatens the goddess: I will eat you up", cluster: monster}
  fate-and-mother-goddesses-do-not-celebrate: {label: "The fate goddesses and mother goddesses do not celebrate (a birth or festival) in the house", cluster: birth}
  storm-god-asks-father-where-were-you: {label: "The storm god meets the father of the gods and asks 'where were you? who is the enemy?'", cluster: myth}
  child-set-on-grandfathers-knee: {label: "A newborn son is lifted up and set on the knees of the father (or grandfather) to be named or acknowledged", cluster: birth}
  messenger-honoured-sevenfold-with-gold-crown: {label: "The messenger is honoured seven times and given a golden wreath for his news", cluster: messenger}
  sixty-youths-and-sixty-maidens: {label: "Sixty young men and sixty young women of a city are sent, the maidens with lapis wine vessels", cluster: ritual}
  land-held-by-bitumen-seven-years: {label: "The land is held fast by asphalt (bitumen) for seven years", cluster: disaster}
  windows-and-doors-sealed-against-goddess: {label: "The windows and doors facing Kumme and Nineveh are shut with cloth so that Ishtar may not hear the plan", cluster: council}
  feast-prepared-and-reported-done: {label: "The vizier prepares food and drink, fills cauldrons and heaps tables as his lord willed, and reports back", cluster: hospitality}
  god-goes-down-to-dark-earth-and-fasts: {label: "A god goes down into the dark earth and there eats nothing and drinks nothing", cluster: underworld}
  storm-god-grows-high-as-heaven: {label: "The storm god (or his opponent) grows as high as heaven, mountains on his body, in a cosmic combat", cluster: myth}
  god-puts-on-winds-as-shoes: {label: "A god rises, takes his staff and puts on the swift winds as his shoes", cluster: myth}
  dream-and-vision-pair: {label: "'Dream and vision' (teshas duntarriyashas) named as a pair of revelation", cluster: revelation}
  sea-sends-wave-against-storm-god: {label: "The Sea sends the wave (hunhuneššar) to fight the storm god; the wave later dries up", cluster: myth}
  living-sent-down-to-sea: {label: "The Sea demands that the living be sent down to the sea, and a sword be sent", cluster: myth}
  mountain-violates-sleeping-goddess: {label: "A mountain god (Pishaisha) lies with the goddess Ishtar while she sleeps; she wakes in fury asking who has shamed her", cluster: myth}
  offender-begs-do-not-kill-me: {label: "The offender throws himself at the goddess's knees, 'do not kill me!', and promises to tell her something for his life", cluster: myth}
  animal-tells-high-god-of-new-god: {label: "An animal (šuppala, the cattle) reveals to the wise god Ea that a new god is growing who will subdue heaven, earth, mountains and rivers", cluster: myth}
  god-shall-keep-alive-whom-he-will: {label: "Decree: whom he keeps alive let none take back, whom he does not keep alive let none take away; he drives (them) down to the dark earth", cluster: theology}
  heaven-earth-bound-and-held-subject: {label: "The new god shall hold the gods and all lands subject by a band (išhiman), the dark earth girded, heaven watching with favour", cluster: theology}
  wisdom-of-primeval-gods: {label: "The wisdom of the former (primeval) gods, who made heaven, is known to one figure", cluster: wisdom}
  god-conceived-of-river-or-spittle: {label: "A deity is to become pregnant with a river (the Aranzah/Tigris) or with a god (Zababa), the seed spat out", cluster: birth}
  god-purifies-one-bewitched-by-evil-words: {label: "A god releases and purifies someone afflicted by anger, sin and 'evil words' or evil sorcery", cluster: magic}
  pursued-flees-by-night-into-valley: {label: "Told 'run from me, I will not leave you in peace', a figure flees by night down into a valley, falls and trembles", cluster: myth}
  god-exalts-just-fells-wicked-like-tree: {label: "Opening praise of a god who raises up just men but fells evil men like trees and strikes their skulls", cluster: theology}
  rich-man-lacks-only-a-son: {label: "A man is the richest in the land, rich in cattle, sheep, silver, gold and lapis, and lacks only one thing: a son or daughter", cluster: birth}
  childless-man-shamed-at-elders-meal: {label: "At the elders' meal each man gives bread and drink to his son; the childless man has no one to give bread to", cluster: birth}
  childless-man-sleeps-in-his-shoes: {label: "The childless man goes to bed with his boots on and does not lie with his wife", cluster: birth}
  husband-dismisses-wife-as-understanding-nothing: {label: "The husband answers his wife's question with 'you are a woman of womanly kind and understand nothing'", cluster: family}
  childless-man-brings-white-lamb-to-sun-god: {label: "The childless man takes a white lamb and goes to the sun god to plead his case", cluster: birth}
  god-takes-form-of-young-man: {label: "A god comes down from heaven and turns himself into a young man to meet a mortal", cluster: theophany}
  god-asks-petitioner-what-is-your-grievance: {label: "The god asks the petitioner 'what is your sin (grievance)?' and he explains that he has wealth but no son", cluster: prayer}
  god-promises-son-go-sleep-with-wife: {label: "The god tells the childless man: go home, eat and drink, sleep well with your wife; the gods will give you a son", cluster: birth}
  storm-god-fears-disaster-at-sun-gods-coming: {label: "Seeing the sun god coming, the storm god asks whether the land has perished, the cities been laid waste, the troops beaten", cluster: myth}
  pregnancy-months-counted-to-tenth: {label: "The months of pregnancy are counted one to nine, and in the tenth month the child is born", cluster: birth}
  son-named-evil-because-gods-chose-evil-way: {label: "A father names his firstborn 'Evil' because his fathers' gods did not choose the right way for him but kept to the evil way", cluster: birth}
  son-named-righteous-because-gods-chose-right-way: {label: "The second son is named 'Righteous' because the fathers' gods took the right way for him", cluster: birth}
  brothers-good-and-evil: {label: "Two brothers embody good and evil (named Righteous and Evil) and their fortunes contrast", cluster: family}
  brothers-divide-estate-and-separate: {label: "Grown brothers divide their father's estate and agree to live apart", cluster: family}
  live-apart-as-gods-dwell-in-own-cities: {label: "'As mountains sit apart and rivers flow apart, as the sun god lives in Sippar, the moon god in Kuzina, the storm god in Kumme, Ishtar in Nineveh, Nanaya in Kissina, Marduk in Babylon, so let us live apart'", cluster: family}
  cheating-brother-takes-better-share: {label: "In the division the evil brother takes the better share (the plough ox) and gives the good brother the worse (the cow)", cluster: family}
  god-blesses-the-lesser-share: {label: "The god looks down from heaven and blesses the poorer share given to the good brother so that it prospers and bears", cluster: retribution}
  sun-god-judges-brothers-lawsuit: {label: "The brothers take their case before the sun god in Sippar, who gives the verdict for the righteous brother", cluster: justice}
  loser-curses-the-divine-judge: {label: "The losing party curses the god who judged against him; the god hears the curses", cluster: justice}
  judge-god-refers-case-to-another-god: {label: "The god declines to judge the case again and sends the parties to another deity (Ishtar of Nineveh)", cluster: justice}
  evil-brothers-scheme-against-good-brother: {label: "The evil brother speaks repeatedly to the good brother with proposals (ploughing, water) in a scheme against him; the sun god hears", cluster: family}
  husband-neglects-gods-for-beautiful-wife: {label: "A man so loves his beautiful wife that he listens only to her and stops giving the gods their bread and libations", cluster: piety}
  hunter-neglects-hunt-mother-complains: {label: "The hunter's mother reproaches him: only your wife is dear to you, you no longer go hunting and bring me nothing", cluster: family}
  angry-gods-hide-the-game: {label: "The gods, angry over neglected offerings, hide all the game from the hunter so that he finds nothing", cluster: retribution}
  hunter-will-not-return-empty-handed: {label: "The hunter wanders three months in the mountains, hungry and thirsty, unwilling to return empty-handed, and falls sick", cluster: retribution}
  divine-father-rebukes-devourers: {label: "The hero's divine father comes down from the mountain and asks the creatures 'why do you devour him?'", cluster: rescue}
  series-of-seven-numbered-dreams: {label: "The hero sees a series of seven numbered dreams in one night (a stone from heaven crushes men, the father's gods kindle fire, a yoke on his neck, lions, serpents at the gate)", cluster: revelation}
  dream-of-stone-falling-from-heaven: {label: "In a dream a heavy stone falls from heaven and crushes servants and a man", cluster: revelation}
  sun-rises-with-halo-ends-night-of-dreams: {label: "At daybreak the sun god comes with a radiant crown (kalmara) and the dreamer rises and tells his mother the night's dreams", cluster: revelation}
  hero-wins-archery-contest-at-feast: {label: "At a feast the hero, the king's son-in-law seated at his right, shoots with the bow; his arrow flies like a bird and he defeats sixty men and seventy nobles", cluster: heroism}
  bride-defers-union-to-another-day: {label: "On the night the hero goes up the stair to the bed, his bride sets the union for another day and bids him not (approach) yet", cluster: marriage}
  enemy-king-took-our-treasure: {label: "The king tells his sixty kings and seventy nobles: see, the king of a foreign land took our treasure (hakhari) and our woman", cluster: war}
  river-god-flies-like-eagle: {label: "The river god (Aranzah, Tigris) leaves his place like an eagle, goes to Akkad and to the mother goddess", cluster: myth}
  river-god-asks-why-do-you-weep: {label: "The river god asks the weeping hero 'why do you lament, why does a stream of tears flow from your pure eyes?'", cluster: lament}
  meal-eaten-seven-times: {label: "A guest eats and drinks once, twice, up to seven times", cluster: hospitality}
  sun-god-desires-cow-comes-down-as-young-man: {label: "The sun god looks down from heaven, desires a thriving cow, takes the form of a young man and comes down to her", cluster: myth}
  cow-bears-two-legged-child-and-would-devour-it: {label: "The cow, after ten months, bears a two-legged (human) child, cries 'why have I borne this two-footed one?' and opens her mouth like a lion to devour it", cluster: birth}
  sun-god-protects-exposed-child: {label: "The sun god sees from heaven, saves the newborn from its mother, strokes its limbs, head and eyes, and has birds of prey and the eagle guard it while snakes draw back", cluster: rescue}
  childless-fisherman-finds-child: {label: "A childless fisherman finds the divinely guarded child in the mountains and sees it as a gift of the sun god ('whom the sun god loves he gives bread')", cluster: birth}
  wife-feigns-childbirth-to-adopt-foundling: {label: "The finder tells his wife to take the child to bed and cry out as in labour so the town will say she bore a son and bring gifts of bread, beer and oil", cluster: birth}
  saying-on-womans-wisdom-and-obedience: {label: "Narrator's maxim: a woman's mind is clever, she keeps away from commanding, depends on the god's power, is obedient and does not twist her husband's word", cluster: wisdom}
  singer-announces-theme-i-sing-of: {label: "The singer opens the song by announcing its subject: 'I sing of ...' (išhamihhi), with praise of the god's wisdom, word and battle", cluster: hymn}
  primordial-time-when-thing-did-not-exist: {label: "Wise men told the singer of a time when the thing (silver) did not yet exist", cluster: creation}
  fatherless-child-asks-mother-who-is-my-father: {label: "A child mocked as fatherless confronts his mother, who answers, 'do not kill me', and names his divine father and his city", cluster: family}
  fear-only-the-one-god: {label: "'Do not fear any god; fear only the one god' (who raises the low and lowers the high)", cluster: theology}
  god-raises-low-lowers-high: {label: "A god makes those above run down and those below run up, and stirs up enemies and wild beasts in the land", cluster: theology}
  son-seeks-absent-father-who-roams-the-land: {label: "The son goes to his father's city but does not find him: the father is roaming the land and the mountains", cluster: family}
  usurper-drives-gods-in-wooden-fetter: {label: "The usurping god (Silver) becomes king and drives all the gods with a fetter of pistachio wood", cluster: myth}
  orphan-bully-rebuked-you-too-are-orphan: {label: "A bully who beats orphans is rebuked by an orphan child, 'why do you beat us? you too are an orphan like us', and goes home weeping", cluster: ethics}
  sun-and-moon-bow-to-usurper: {label: "The usurper pulls the sun and the moon down from heaven; they bow before him and plead 'do not kill us, we are the lights of heaven and earth; without us you would rule dark lands'", cluster: myth}
  primeval-gods-fix-earth-and-release-rivers: {label: "The primeval gods fixed (the earth) and let all the rivers loose, and the rivers of the lands took (water) for the Mala (Euphrates); they purified the land", cluster: creation}
  gods-make-son-of-sun-god-king-of-land: {label: "All the gods take the son of the sun god and make him king of the land", cluster: kingship}
  primeval-reign-of-162-years: {label: "A primeval period of 162 years (of strife or rule) is counted", cluster: primeval}
  plague-after-creation-of-man: {label: "When man was created, a plague (hinkan) arose in the land and lasted years", cluster: primeval}
  myth-recited-as-plague-ritual: {label: "The myth closes with the rubric of a ritual (of the Mala river) to be performed when plague arises in the land, fixed by oracle", cluster: cult}
  prayer-do-not-hear-slanderers-of-petitioner: {label: "The petitioner asks the god not to listen if his father, mother, brother, sister, in-law or friend slanders him", cluster: prayer}
  god-asked-to-lower-kind-eyes-raise-thousand-lashes: {label: "Prayer: lower your kind eyes, lift your thousand eyelashes, look kindly on the king; incline your ears and hear his good word", cluster: prayer}
  god-chosen-as-personal-deity-by-king: {label: "The king has made the deity his personal god and kneels on the ground calling on it in person", cluster: prayer}
  underworld-court-asked-to-speak-good-of-king: {label: "The underworld goddess's tutelary god, vizier, servants and courtiers are each greeted 'Mercy!', told 'the case be yours, eat and drink', and asked to speak well of the king's name before her", cluster: prayer}
  deliver-from-evil-set-in-good-place: {label: "Prayer: take him away from evil and set him in a good place", cluster: prayer}
units:
  - id: ane-cth-346-15-kumarbi-small-fragments
    tradition: ane-hittite
    title: Kumarbi myth, four small fragments (CTH 346.15, 346.17, 346.18, 346.20)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Hittite"
    read: ["CTH 346.15", "CTH 346.17", "CTH 346.18", "CTH 346.20"]
    tags:
      - {motif: messenger-repeats-message-verbatim, refs: ["CTH 346.17 §1:3"], note: "only '[ ... ]utar {d}10-ni', a word to the storm god, with Kumme and the sea (aruna) in the next lines; very broken"}
      - {motif: storm-god-asks-father-where-were-you, refs: ["CTH 346.15 §2:3-5"], note: "interpretive: someone goes to Kumarbi and is 'calm' (karussiyazzi) towards him; the meeting of a god with Kumarbi, all else broken. CTH 346.18 and 346.20 preserve only 'to Kumarbi' and 'house of Kumarbi'"}
    hints:
      - "Too broken for a parallel; the Kumarbi cycle's succession of divine kings may be set against Q 21:22 (were there gods besides God, heaven and earth would be ruined) and Q 23:91."

  - id: ane-cth-346-16-storm-god-king-of-men
    tradition: ane-hittite
    title: Kumarbi myth fragment with the storm god as king of all mankind (CTH 346.16)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Hittite"
    read: ["CTH 346.16"]
    tags:
      - {motif: why-do-you-kneel-rebuke, refs: ["CTH 346.16 §1:9"], note: "kuwat halaettén 'why did you kneel?', near 'who is in first place?' (hantezzi kuis, §1:6) and 'their stupidity' (marlatar-šamit, §1:8)"}
      - {motif: where-do-silver-and-gold-come-from, refs: ["CTH 346.16 §4:29-34"], note: "DINGIR-LIM-ni ešri.HI.A 'the statues of the deity'; KÙ.BABBAR GUŠKIN kuwapi 'where (are) silver and gold?'; kuez 'from where?'; Ú-UL šekkanta 'not known'"}
      - {motif: storm-god-king-of-all-humanity, refs: ["CTH 346.16 §5:37-42"], note: "nakkiš {d}10-aš 'the weighty storm god' hears the words; hūmandaš DUMU.NAM.LÚ.U19.LU-aš LUGAL-uš 'king of all mankind'; haštaliyatar ... tarhuilatar 'heroism ... valour'; 'of the Subarian earth and of heaven' (šupriyaš taknaš nepišaš)"}
    hints:
      - "'King of all mankind' for a storm god: compare the Quran's 'malik al-nas' (Q 114:2) and 'Lord of the heavens and the earth' (Q 13:16); divergence: there no rival divine king."
      - "Divine statues and the question where silver and gold come from: compare Q 20:88 (the calf from the people's ornaments) and Job 28:1."

  - id: ane-cth-346-19-which-god-came
    tradition: ane-hittite
    title: Kumarbi myth fragment, 'Which god came to me?' (CTH 346.19)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Hittite"
    read: ["CTH 346.19"]
    tags:
      - {motif: deity-asks-which-god-came-to-me, refs: ["CTH 346.19 §2:4-6"], note: "mān parkuwattama ... 'when he had purified himself'; kuiš-wa-mu DINGIR-LUM uet 'which god came to me?'"}
      - {motif: storm-god-king-of-all-humanity, refs: ["CTH 346.19 §2:8"], note: "URU kummiyaš šarkuš 'the mighty (king) of Kumme', i.e. the storm god; he ceases (zinnet) and goes off"}
    hints:
      - "Compare 1 Sam 3:4-10 (who called me?) and Q 20:11-12 (Moses at the fire, 'I am your Lord')."

  - id: ane-cth-346-21-kumarbi-quotes-ancients
    tradition: ane-hittite
    title: Kumarbi rises and quotes the saying of the ancients (CTH 346.21)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Hittite"
    read: ["CTH 346.21"]
    tags:
      - {motif: ancients-saying-quoted, refs: ["CTH 346.21 §2:5-6"], note: "PA-NI ZI-ŠU 'to his own soul' he says: karūiliuš-wa kuit memi[škanzi] 'what the ancients say'"}
      - {motif: lions-bed-begets-hero, refs: ["CTH 346.21 §2:7-10"], note: "mān-wa-za addaš DUMU-an UR.SAG-in ... A-NA LI-IM KARAŠ ... ešdu 'if the father (begets) a son, a hero, let him be (a match) for a thousand armies'; mān šašza UR.MAH ... UR.SAG-in hāši 'if the lion's bed ..., it begets a hero'"}
    hints:
      - "Kumarbi plans to beget a champion against his son the storm god; compare the theme of fathers plotting against sons, and Q 2:170 (following what the forefathers said) for the authority of 'the ancients'."

  - id: ane-cth-347-1-hamsha-warns-atramhasi
    tradition: ane-hittite
    title: Hittite Atramhasis - Hamsha passes Kumarbi's words to his son Atramhasi (CTH 347.1)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Hittite"
    version: Hittite adaptation of Atrahasis
    read: ["CTH 347.1"]
    tags:
      - {motif: wise-father-warns-son-of-gods-plan, refs: ["CTH 347.1 §2:6-9", "CTH 347.1 §6:32-35"], note: "GIM-an {m}hamšaš ŠA {d}kumarpi INIM.MEŠ ištamašta ... A-NA {m}atramhaši DUMU-ŠU memiškiuwan 'when Hamsha heard Kumarbi's words he began to speak to Atramhasi his son'; the flood hero is the son, not the recipient of the god's direct warning"}
      - {motif: hero-warned-by-deity, refs: ["CTH 347.1 §1:3-5"], note: "araš-wa-mu ... akti-ma-wa 'the friend ... me ... but you will die'; speaker unclear (Kumarbi?)"}
      - {motif: feast-invitation-as-death-trap, refs: ["CTH 347.1 §2:11-15"], note: "A-NA EZEN4-ma-wa-tta kuedani halziššai 'the feast to which he calls you'; āššiyanza kuit araš 'because he is a dear friend'; dandukiš-wa GIM-an akkiškittari 'he will die like a mortal'"}
      - {motif: wooden-statue-made-as-substitute, refs: ["CTH 347.1 §2:17"], note: "ALAM IṢ-ṢÍ iya 'make a statue of wood!'; purpose lost"}
      - {motif: fields-given-to-another, refs: ["CTH 347.1 §4:24-27"], note: "apel A.ŠÀ.MEŠ dameta[ni] 'his fields to another'"}
      - {motif: ant-will-devour-crop, refs: ["CTH 347.1 §5:28", "CTH 347.1 §6:33-38"], note: "MU 3.KAM-ma 'in the third year'; {d}kumarpiš kedani MU.KAM-ti 'Kumarbi in this year'; lalaweššaš garapi 'the ant will devour'; :hutanuenzi dā 'take hutanu-'; Luwian glossed plant words"}
      - {motif: carts-driven-away-grain-saved, refs: ["CTH 347.1 §6:39-41", "CTH 347.1 §7:49"], note: "GIŠ MAR.GÍD.DA.MEŠ penni 'drive the carts away'; halkin dameda[ni] 'the grain to another (place)'"}
      - {motif: ditches-dug-round-about, refs: ["CTH 347.1 §7:44"], note: "arahzanda HI-RI-TU4.HI.A 'ditches all around'"}
      - {motif: messenger-travels-unseen-by-sun-and-moon, refs: ["CTH 347.1 §5:30-31"], note: "interpretive: [...] harianza 'buried/hidden' and 'heard everything' (hūman išt[amašta]); someone hidden overhears"}
    hints:
      - "Hittite reshaping of the Atrahasis flood story inside the Kumarbi cycle: the disaster here is a crop plague (the ant), not yet a flood. Compare Q 11:36-43 (Noah warned, his son lost), Q 71:1-4, and Gen 6:13-22."
      - "Father warning son, against Q 11:42-43 where Noah calls his son who refuses; here the father warns and the son acts."
      - "Grain saved from a plague over years: compare Joseph storing grain, Q 12:47-49 and Gen 41:33-36."

