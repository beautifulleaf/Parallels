    original: true
    tagger: "Claude (model), reading the Hittite"
    read: ["CTH 361.I.1 §1:1-§7:34"]
    tags:
      - {motif: husband-neglects-gods-for-beautiful-wife, refs: ["CTH 361.I.1 §3:7-13"], note: "{m}udupšarriyaš NIN-SÚ ... DAM-anni 'Udupsarri's sister he took as wife'; {f}šintalimeni; mišriwanza 'beautiful'; parā A-NA DAM-ŠU-pat IŠ-ME 'he listened only to his wife'; DINGIR.MEŠ-uš NINDA haršit išpanduzzit Ú-UL kappuezzi 'no longer provides the gods with thick bread and libation'"}
      - {motif: hunter-neglects-hunt-mother-complains, refs: ["CTH 361.I.1 §4:14-17"], note: "DAM-KA-pat-wa-tta-kan āššiyattat 'only your wife was dear to you'; HUR.SAG.MEŠ-aš hurnuwanzi Ú-UL pāiši 'you do not go to the mountains to hunt'; Ú-UL kuitki udatti 'you bring me nothing'"}
      - {motif: angry-gods-hide-the-game, refs: ["CTH 361.I.1 §4:18-22"], note: "takes the spear (GIŠ ŠUKUR), calls the puppies, goes to Mount Natara; DINGIR.MEŠ-eš ... išpanduzzi šer kartimmiyawantes 'the gods were angry over the libation'; huitar [h]ūman peran arha munnāer 'hid all the game from him'"}
      - {motif: hunter-will-not-return-empty-handed, refs: ["CTH 361.I.1 §5:23-25"], note: "ITU 3.KAM ... HUR.SAG.MEŠ-aš anda uehatta 'roams three months in the mountains'; šannapiliš nūman 'empty-handed he will not'; kašti kaninti 'in hunger and thirst'; [id]ālawanza GIG-anza harzi 'an evil illness holds him'"}
      - {motif: divine-father-rebukes-devourers, refs: ["CTH 361.I.1 §5:26-28", "CTH 361.I.1 §6:29-33"], note: "HUR.SAG.MEŠ DUMU.MEŠ DINGIR.MEŠ 'mountains of the sons of the gods'; adanna 'to eat' Keshshi; [Š]A {m}keššima adda[š] DINGIR-LUM 'Keshshi's divine father'; [kuw]at-wa-ran ezzatteni 'why do you eat him?'"}
      - {motif: king-provides-for-gods-hunger-and-thirst, refs: ["CTH 361.I.1 §3:11"]}
    hints:
      - "A man distracted from God by wife and pleasures: compare Q 64:14-15 (among your wives and children are enemies to you), Q 63:9 (let not wealth and children divert you from remembrance of God) and Solomon's wives turning his heart (1 Kgs 11:4)."
      - "Gods withholding the hunt for neglected offerings: compare Q 68:17-33 (the garden owners who withheld the poor's share) and Hag 1:9-11."

  - id: ane-cth-361-i-1-keshshi-seven-dreams
    tradition: ane-hittite
