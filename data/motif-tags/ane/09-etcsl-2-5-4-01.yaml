# Full read of the ANE corpus, chunk 9: ETCSL 2.5.4.01 (Ishme-Dagan A) - ETCSL 2.7.1.1 (Anam). Read from the ETCSL Sumerian composite transliterations.
new_motifs:
  god-judgments-unsearchable: {label: "The god's intricate judgments cannot be fathomed or revealed by anyone", cluster: theology}
  god-king-of-kings: {label: "The high god is titled 'lord of princes, king of kings' (en nun-nun-e-ne lugal-a lugal-be2-e)", cluster: theology}
  king-named-in-the-womb: {label: "The god gives the king a good name while his seed is still being placed in the womb, and a birth goddess attends his birth", cluster: kingship}
  king-given-seven-wisdoms: {label: "A god (Enki) bestows 'seven wisdoms' (ĝeštug2 7) on the king", cluster: wisdom}
  god-acts-as-kings-intercessor-in-temple: {label: "A warrior god speaks to the high god on the king's behalf and prays for him continually in the temple", cluster: kingship}
  sun-god-puts-justice-in-kings-mouth: {label: "The sun god puts justice and reliable words in the king's mouth so that he can judge", cluster: law}
  king-unites-en-priesthood-and-kingship: {label: "The king combines the priestly office of en with kingship and dwells in the goddess's ĝipar", cluster: kingship}
  gods-say-so-be-it-to-kings-destiny: {label: "The assembled gods utter an unalterable 'So be it!' (ḫe2-am3) to the destiny decreed for the king", cluster: kingship}
  king-restores-neglected-rites: {label: "The king gathers the god's divine powers, attends to the ancient ordinances and restores the rites that had fallen out of use", cluster: cult}
  temple-festive-on-seventh-and-fifteenth: {label: "The king makes the temple festive each month on its seventh and fifteenth days", cluster: cult}
  libation-poured-like-rain-from-heaven: {label: "The king pours out beer and liquor for the god like water, like rain released from heaven", cluster: cult}
  king-serves-gods-daily-meals: {label: "The king daily decides what the god will eat and drink, as faithful steward of his table", cluster: cult}
  holy-city-exempted-from-labour-and-war: {label: "The king exempts the citizens of the holy city from corvée basket-carrying and military service and remits their tribute", cluster: law}
  tithe-imposed-for-temple: {label: "A tenth part (zag 10) of barley, oil, wool and beer is made a due for the temples", cluster: cult}
  king-hears-cry-of-orphan-widow-bondsman: {label: "The king supports the cases of bondsmen, orphans and widows who cry 'Alas, Utu! Alas, Nanna!'", cluster: law}
  king-destroys-desert-brigands: {label: "The king exterminates the brigands (lu2-sa-gaz) who roam the steppe and makes the roads safe", cluster: kingship}
  king-like-father-and-mother: {label: "The king is kind like a father and attentive like a mother to his people; foreign lands look to him as to the father who engendered them", cluster: kingship}
  king-as-great-tree-and-shade: {label: "The king is a tall tree with thick roots and broad shining branches, a canopy and pleasant shade over the land", cluster: kingship}
  king-as-lamp-of-land: {label: "The king lights the land like a lamp", cluster: kingship}
  king-as-seed-of-kingship: {label: "The king is 'the good semen of kingship, the seed of rulership', a scion of cedars", cluster: kingship}
  tribute-of-nomads-and-distant-lands: {label: "Nomads who know no house or city, and distant lands (Dilmun, the highlands), bring the king sheep, linen, dates and precious timbers", cluster: kingship}
  king-installs-thrones-for-god-and-consort: {label: "The king makes and installs splendid thrones for the god and his consort in the temple and seats them there", cluster: cult}
  king-sets-copper-statues-of-ancestors-in-temple: {label: "The king brings copper statues of himself, his father and his grandfather into the god's temple", cluster: cult}
  king-oath-before-god-with-raised-hands: {label: "A future king standing with raised hands before the god is to swear by the gods that the king's songs and stela are true", cluster: kingship}
  descendants-to-perform-kings-songs: {label: "The king prays that his descendants on the throne perform his songs to the gods daily, at the evening and morning meals", cluster: kingship}
  kings-dynasty-made-greater: {label: "The god, who made the king's reign follow another reign, is asked to make his descendants still greater", cluster: kingship}
  king-dedicates-weapon-and-cult-objects: {label: "The king makes and dedicates to the gods a chariot, a sedan chair, a fifty-headed mace and a copper throne", cluster: cult}
  temple-singers-classes-ordained: {label: "Classes of temple singers are ordained: chief singer, scholar, composer, sweet-voiced singer of the king, singer for the bedchamber, antiphonal singer", cluster: cult}
  curse-on-who-alters-royal-monument: {label: "Blessing on a successor who does not move the king's statue or erase his name, curse on the one who does", cluster: treaty}
  goddess-presents-king-with-lamb-to-high-god: {label: "A goddess brings the king, clasping a white lamb to his breast, into the chief god's temple and asks the god to decree his fate and call his name", cluster: kingship}
  fate-of-abundance-decreed-for-king: {label: "The god decrees for the king a reign of abundance: the two rivers bring carp-filled water, orchards syrup and wine, fields grain, pens and folds are enlarged", cluster: kingship}
  goddess-made-accountant-of-heaven-and-earth: {label: "Because she prostrated herself in supplication, the high god makes a goddess the accountant (saĝ-tun3) of heaven and earth", cluster: theology}
  udders-of-heaven-open: {label: "Prayer that the 'udders of heaven' open to give rain for the king's harvest", cluster: cosmology}
  enki-counsellor-of-an-and-enlil: {label: "Enki is the counsellor and adviser of An and of Enlil, whose decisions cannot be countermanded", cluster: theology}
  divine-chariot-parts-as-cosmic-images: {label: "Each part of a god's chariot is likened to a cosmic or moral image: a field of grain, a cloud, a neck-stock for the evildoer, a net spanning heaven and earth, the sun and moon", cluster: cult}
  high-god-rides-chariot-with-consort-in-procession: {label: "After his festival the high god mounts his chariot, embraces his consort, and rides out followed by his warrior son and the gods", cluster: cult}
  god-asked-to-give-goddess-as-kings-bride: {label: "A god prays to the high god to give his beloved daughter (Inana) to the king as spouse in reward for his pious work", cluster: kingship}
  churn-song-for-goddess: {label: "Refrain: 'May the churn sound!' as the goddess enters the cattle-pen and sheepfold, which rejoice and give her butter and cream", cluster: love}
  goddess-reverses-gender-roles: {label: "A goddess has the power to turn man into woman and woman into man, put spindles in men's hands and weapons in women's hands", cluster: cult}
  goddess-turns-light-to-darkness: {label: "A goddess is given power to turn light into darkness and darkness into light", cluster: theology}
  god-raises-people-from-below-to-above: {label: "A deity makes people go up from below to above and makes peoples change their place", cluster: theology}
  king-and-goddess-jointly-charged-with-temple-cult: {label: "The high gods jointly entrust the king and his divine spouse with building temples and supplying daily offerings and drink", cluster: cult}
  divine-minister-speaks-for-king-before-god: {label: "The chief god's minister (Nuska) is asked to bring good words for the king before the high god and his consort at their festival", cluster: kingship}
  holy-city-built-as-food-of-gods: {label: "The holy city was built as the life-giving food of the gods, beautified for their eating and drinking, a sheepfold for their life", cluster: temple}
  gods-look-to-high-gods-as-parents: {label: "The lesser gods gaze at the high god and his consort as at their own father and mother and heed their holy words", cluster: theology}
  god-creates-seed-of-mankind-and-teaches-practices: {label: "The wise god makes the seed of mankind come forth, decrees their good destiny and teaches them the proper practices and rites", cluster: creation}
  god-distributes-sceptres-and-crowns: {label: "A god assigns the sceptres and distributes the crowns to the gods (or kings) and proclaims their names", cluster: kingship}
  god-feeds-people-as-father-and-mother: {label: "The god is lord and father of the settled people and shepherd who seeks food for the nomads, speaking to them like a father and mother and satisfying them with food and drink", cluster: theology}
  king-handsome-in-body-praised: {label: "The king praises his own beauty: strong muscular youth, beautiful eyes and lips, fine fingers, a lapis-lazuli beard", cluster: kingship}
  king-as-farmer-shepherd-fisher-of-land: {label: "The king calls himself the farmer heaping grain, the shepherd making butter and milk abundant, the one who makes fish and birds grow, a river of plenty", cluster: kingship}
  king-as-cool-waterskin-for-soldiers: {label: "The king is life for the young men like a waterskin of cool water, and a shield and screen for the army", cluster: kingship}
  king-judges-carefully-without-haste: {label: "The king judges without haste, searching out the background of each case and weighing his words fairly; he never destroys a just man", cluster: law}
  king-human-god: {label: "The deified king calls himself 'a human god' (diĝir nam-lu2-ulu3)", cluster: kingship}
  writing-goddess-guides-kings-hand: {label: "The goddess of writing (Nisaba) guides the king's fingers on the clay, adorns him with a golden stylus and gives him the measuring rod and line", cluster: wisdom}
  king-discerns-true-and-false-in-thoughts: {label: "The just king recognises truth and falsehood even in people's thoughts when deciding cases", cluster: law}
  king-commutes-death-sentence: {label: "The king knows how to save a man by commuting his death sentence, freeing him from severe punishment", cluster: law}
  scribal-school-praises-king-forever: {label: "The king's praise is to be spoken by the tablets and scribes of the tablet-house (e2-dub-ba-a) without ceasing", cluster: wisdom}
  god-chooses-king-in-overflowing-heart-and-blesses: {label: "In the overflowing of his heart the sky god chooses the king and pronounces a direct blessing on him: radiance, rule over far lands, concord", cluster: kingship}
  mother-goddess-suckles-warrior-god: {label: "The mother goddess suckles the young warrior god at her sweet breasts with the milk of vigour and makes his limbs massive", cluster: myth}
  mother-presents-son-to-father-for-fate: {label: "The mother leads her son by the right wrist before his father in the temple and asks him to decree a great fate for 'your avenging son'", cluster: myth}
  weapon-snaps-enemies-like-reeds: {label: "The god puts into the king's hand a weapon that snaps his enemies like reeds", cluster: warfare}
  goddess-petitions-high-god-dialogue-for-king: {label: "In dialogue form, the high god tells a goddess the king will be her provider; she answers humbly and asks him to decree the king's fate; he blesses the king", cluster: kingship}
  enemies-gathered-like-swallows-spread-like-sheaves: {label: "The warrior god will collect the king's enemies like swallows and spread them out like sheaves", cluster: warfare}
  god-commissioned-to-open-rivers-and-send-rain: {label: "The high god commissions a god to open the mouths of the Tigris and Euphrates, make the clouds rain on the fields, make grain rise in the furrow and orchards grow like forests", cluster: cosmology}
  god-creates-and-keeps-mankind-alive: {label: "To create mankind and to keep them alive is in the power of the god seated on the dais of destinies", cluster: creation}
  goddess-equal-in-rank-with-an: {label: "The goddess has equal rank with the sky god An and decides destinies with him; her word is as firm as Enlil's", cluster: theology}
  god-declares-himself-sole-holder-of-powers: {label: "The sky god speaks: 'I am the only one among the gods with the great divine powers; my utterance shall never be altered'", cluster: theology}
  king-told-to-trust-in-gods-name: {label: "The god tells the king to whom he has given power to trust in the god's name", cluster: kingship}
  storm-god-sends-winds-in-succession-for-harvest: {label: "The storm god sends a first, second, third and fourth wind or cloud, and grain stands in the fields for the king", cluster: cosmology}
  god-promises-king-days-like-sun: {label: "The god promises to make the king's days as numerous as the sun god's", cluster: kingship}
  name-placed-on-tablet-of-life: {label: "The goddess of writing places the king's name on the 'tablet of life' (im nam-til3-la)", cluster: cosmology}
  king-pardons-sin-and-heals: {label: "The king knows how to undo sin and its illness and does not put transgressors to death", cluster: law}
  rival-kings-make-peace-and-bring-gifts: {label: "All rulers become allies of the king; they bring oxen, sheep, gold and gems into his palace and kiss the ground before him", cluster: kingship}
  moon-god-shines-day-and-night: {label: "The moon god comes forth on high and shines like bright sunlight at noon and in the night", cluster: cosmology}
  king-to-gather-scattered-people-and-restore-city: {label: "Prayer that the king bring back the scattered people of the land and restore the god's city to its place", cluster: kingship}
  first-fruits-brought-by-boat-to-gods: {label: "The king ships choice grain, flour and gold as new-year first-fruit offerings by boat to the moon god's quay and on to the high god", cluster: cult}
  son-god-prays-father-for-king: {label: "A god brings the king's offerings to his father, the high god, and asks him to decree an eternal destiny and long life for the king", cluster: kingship}
  god-destiny-decreed-in-womb: {label: "A god's favourable destiny was decreed while he was still in the womb; he is born amid plenty in the holy mountains", cluster: theology}
  god-with-lion-face-and-eagle-claws: {label: "A warrior god has the face of a lion, the muzzle of a dragon and the claws of an eagle grasping the wicked", cluster: theology}
  king-restores-abandoned-cities-and-canals: {label: "By the high god's command the king makes the forgotten plan of a city visible, resettles abandoned cities and dredges canals and ditches so water never fails", cluster: kingship}
  scribe-god-keeps-tablets-of-destiny: {label: "A scribal god holds the great tablets, keeps count of every assignment and covers the great tablets of destiny with writing with a holy stylus", cluster: cosmology}
  opening-of-the-mouth-for-gods: {label: "A craftsman god performs the 'opening of the mouth' (ka du8) for the gods in heaven and the underworld", cluster: cult}
  kings-years-marked-on-tablet-of-life: {label: "Prayer that the god mark the years of the king's long reign on the tablet of life, unalterable forever", cluster: cosmology}
  gate-gods-greet-king-entering-city: {label: "The protective gods of peace who guard the city's Great Gate open the doors, rejoice at the king, carry his greeting to the gods and stand at his right and left", cluster: cult}
  right-and-justice-as-helper-gods: {label: "Right (Niĝ-zid) and Justice (Niĝ-si-sa), personified as deities, are to be the king's helpers", cluster: law}
  gate-gods-named-in-litany: {label: "Named minor gods of a city gate are invoked one by one in a litany, each line beginning with the gate's name", cluster: cult}
  favourable-signs-set-before-king: {label: "Gods are asked to set favourable signs and encouraging words before the king and make his feet stand in holy places of life", cluster: cult}
  catalogue-of-offerings-drink-and-dairy: {label: "The king's offerings are listed one by one: milk and grain, liquor, wine, emmer beer, double-strength beer, mountain honey, butter, ghee, pressed oil, cream", cluster: cult}
  god-asked-to-accept-pure-food-and-water: {label: "The god is asked to accept with joyful heart the pure food to eat and pure water to drink offered by the king and grant his prayer", cluster: cult}
  kings-years-numerous-as-stars: {label: "Prayer that the king be given years as numerous as the stars of the heavens, beyond counting", cluster: kingship}
  temple-gate-eagle-seizing-stags-emblem: {label: "The temple doorway bears an emblem of a rapacious eagle seizing stags turning left and right, and gods guard the doorway", cluster: temple}
  temple-built-of-holy-reeds-in-marsh: {label: "A temple's door frame, lock, leaves and bolt are made of holy reeds, gold-yellow and silver-white, beside the sacred marsh where cattle and calves stand", cluster: temple}
  temple-gateway-like-beautiful-woman: {label: "The temple gateway is endowed with charms like a fine woman with head raised, attractive like ripe fruit, yet awesome like the mountains", cluster: temple}
  protective-gods-sweep-temple-in-rotation: {label: "The temple's protective deities take turns of office from the new moon and are seen sweeping the ground of the building as guardians of the gate", cluster: temple}
  gods-accept-words-of-heart-and-tongue: {label: "Prayer that the god accept the king's offerings together with what he says in his heart and utters with his tongue and his raised hands", cluster: cult}
  gods-save-king-from-famine: {label: "The moon god and his consort, 'who suppress famine', have saved the king from famine and filled him with abundance", cluster: kingship}
  ruler-releases-citizens-and-slaves-to-holy-city: {label: "The ruler frees the citizens of the holy city, with their slaves and slave-girls, held in his own city, and lets them return home", cluster: law}
  ruler-rebuilds-destroyed-temple-of-goddess: {label: "The ruler restores a destroyed temple to its place, rebuilds abandoned shrines and builds what had not been built since ancient days", cluster: temple}
units:
  - id: ane-etcsl-2-5-4-01-a-enlil-praise
    tradition: ane-sumerian
    title: "Ishme-Dagan A: praise of Enlil, judge of heaven and earth, who decreed Išme-Dagan's destiny"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Sumerian"
    read: ["ETCSL 2.5.4.01 A:1-42"]
    tags:
      - {motif: deity-renders-verdicts-and-judgments, refs: ["ETCSL 2.5.4.01 A:16-19"], note: "niĝ2-zid ki-bi-še3 ĝar ... eš-bar-e di-di ... di-kud an ki: re-establishing justice, judge of heaven and earth; lines 1-3 and the opening of most lines broken"}
      - {motif: god-judgments-unsearchable, refs: ["ETCSL 2.5.4.01 A:28"], note: "di galam-ma-ni na-me nu-pad3-de3: his intricate judgments no one can reveal"}
      - {motif: net-from-which-none-escapes, refs: ["ETCSL 2.5.4.01 A:30-31"], note: "a2 sa-par4 gal kur-re ... sa-al-ḫub2 ... nu-še-ga šu2-a: his strength a great battle-net, a fine-mesh net covering the disobedient"}
      - {motif: black-headed-people, refs: ["ETCSL 2.5.4.01 A:22"], note: "a-a {d}en-lil2 sipad saĝ gig2-ga: Father Enlil, shepherd of the black-headed"}
      - {motif: god-attacks-like-south-wind, refs: ["ETCSL 2.5.4.01 A:35"], note: "ub-da 4-ba u18-lu i3-dul4: a south wind covering the four quarters; here an image of all-pervading power rather than attack"}
      - {motif: god-king-of-kings, refs: ["ETCSL 2.5.4.01 A:40"], note: "{d}nu-nam-nir en nun-nun-e-ne lugal-a lugal-be2-e"}
      - {motif: god-decrees-kings-destiny, refs: ["ETCSL 2.5.4.01 A:41-42"], note: "iri kug-ga nam dug3 ḫa-ma-ni-in-tar: he decreed a good destiny for me in the holy city"}
    hints:
      - "Compare Deut 10:17 and Ps 136:2-3 (God of gods, Lord of lords) with line 40; Dan 2:47."
      - "Compare Rom 11:33 and Ps 36:7 (judgments a great deep) with line 28; Isa 40:28."
      - "Compare Ezek 12:13, 17:20 and Hos 7:12 (God spreads his net over the rebel) with lines 30-31."
  - id: ane-etcsl-2-5-4-01-a-election
    tradition: ane-sumerian
    title: "Ishme-Dagan A: the king named in the womb and endowed by the gods one after another"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Sumerian"
    read: ["ETCSL 2.5.4.01 A:43-89"]
    tags:
      - {motif: king-named-in-the-womb, refs: ["ETCSL 2.5.4.01 A:43-45"], note: "a šag4-ga ru-a-ĝa2 mu dug3 ḫa-ma-ni-in-sa4: he named me with a good name when my seed was placed in the womb; {d}nin-tur5 tud-tud-a ḫa-ma-ni-in-gub: Nintur stood by at my birth; gi-dur ku5-ra2-ĝa2 ... nam-en: when my umbilical cord was cut, the en-ship"}
      - {motif: king-named-by-high-god, refs: ["ETCSL 2.5.4.01 A:43"]}
      - {motif: king-formed-by-mother-goddess, refs: ["ETCSL 2.5.4.01 A:44"]}
      - {motif: shepherdship-of-land-given-by-god, refs: ["ETCSL 2.5.4.01 A:46-47", "ETCSL 2.5.4.01 A:56-57"], note: "nam-sipad ki-en-gi-ra; sig igi-nim-ma nam-en-bi ḫa-ma-an-šum2"}
      - {motif: king-chosen-from-numerous-people, refs: ["ETCSL 2.5.4.01 A:55"], note: "uĝ3-ĝa2 ḫu-mu-ni-in-suḫ-en kalam ḫe2-ni-in-pad3-en: he selected me from my people and announced me to the land"}
      - {motif: each-god-gives-king-a-gift, refs: ["ETCSL 2.5.4.01 A:56-89"], note: "Enlil lordship, An crook and staff, Uraš nursing, Ninlil destiny, Enki crown and wisdom, Suen throne, Nuska sceptre, Ninurta intercession"}
      - {motif: god-gives-king-crown-sceptre-crook, refs: ["ETCSL 2.5.4.01 A:60", "ETCSL 2.5.4.01 A:69", "ETCSL 2.5.4.01 A:77"], note: "šibir ešgiri2 šu-ĝu10 ḫa-ma-šum2 (An); aga3 zid maḫ (Enki); ĝidru nam-lugal-la (Nuska)"}
      - {motif: king-nursed-on-goddess-lap, refs: ["ETCSL 2.5.4.01 A:61"], note: "{d}uraš-e dub3 kug-ga-ni-a mi2 zid ḫa-ma-ni-dug4: Uraš cared for me on her holy knees"}
      - {motif: god-decrees-kings-destiny, refs: ["ETCSL 2.5.4.01 A:62-67"], note: "Ninlil decreed: a lofty dais for distant days, a good reign, daily service of the E-kur"}
      - {motif: king-given-seven-wisdoms, refs: ["ETCSL 2.5.4.01 A:71"], note: "ĝeštug2 7-a šu gal ḫa-ma-ni-du7; verb partly restored"}
      - {motif: god-acts-as-kings-intercessor-in-temple, refs: ["ETCSL 2.5.4.01 A:81-87"], note: "Ninurta {d}nu-nam-nir inim-ma ḫa-ma-ni-in-DU ... e2-kur-ra šu ḫu-mu-da-ĝal2-ĝal2 ... maškim nam-lugal-ĝa2 ḫe2-e: he prays continually for me in the E-kur and is the constable of my kingship"}
      - {motif: king-as-constable-of-god, refs: ["ETCSL 2.5.4.01 A:87"], note: "inverted: the god Ninurta is the maškim of the king's kingship"}
    hints:
      - "Compare Isa 49:1 ('YHWH called me from the womb, from my mother's body he named my name') and Jer 1:5 with line 43; Ps 22:10-11 and Ps 71:6."
      - "Compare Isa 11:2 (sevenfold spirit of wisdom on the shoot of Jesse) and Prov 9:1 (wisdom's seven pillars) with line 71."
      - "Compare Ps 110:2 (the sceptre sent forth from Zion), Ps 21:4 (crown of fine gold set on his head) and Ps 89:20-21."
      - "Compare 1 Sam 16:1-13 (the king chosen from among his brothers) and Ps 78:70-71 with line 55."
  - id: ane-etcsl-2-5-4-01-a-utu-justice
    tradition: ane-sumerian
    title: "Ishme-Dagan A: Utu puts justice in the king's mouth, for a social order of respect and protection of the weak"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Sumerian"
    read: ["ETCSL 2.5.4.01 A:90-99"]
    tags:
      - {motif: sun-god-puts-justice-in-kings-mouth, refs: ["ETCSL 2.5.4.01 A:90"], note: "{d}utu niĝ2-si-sa2 inim gen6-na ka-ĝa2 ḫa-ma-ni-in-ĝar"}
      - {motif: just-king-does-justice-and-righteousness, refs: ["ETCSL 2.5.4.01 A:91-93", "ETCSL 2.5.4.01 A:98"], note: "di ku5-ru ka-aš bar uĝ3-e si sa2-e ... niĝ2-erim2 niĝ2-a2-zig3-bi ḫa-lam-e niĝ2-si-sa2 mu2-mu2: to destroy wickedness and violence and make justice grow"}
      - {motif: king-establishes-justice-crushes-evildoers, refs: ["ETCSL 2.5.4.01 A:93"], note: "zid-du du-us2 dab5-e erim2-du ḫa-lam-me: keep the righteous on the track, destroy the wicked"}
      - {motif: ideal-age-of-social-harmony, refs: ["ETCSL 2.5.4.01 A:94-97"], note: "šeš-e šeš-ra niĝ2-gen6-na di a-a-ra šu-kin dab5-be2 / nin9 gal-ra inim gaba-na nu-di ama-ra ni2 tuku2-de3: brother to speak truth to brother, obey the father, not contradict the elder sister, revere the mother"}
      - {motif: ideal-king-justice-for-poor, refs: ["ETCSL 2.5.4.01 A:96-97"], note: "si-ig-ga kalag-ga-ra nu-ĝa2-ĝa2 ... a2-tuku niĝ2 šag4-ga-na nu-ak lu2 lu2-še3 nu-di: the weak not handed to the strong, the mighty not doing as he pleases, no man assigned to another (in bondage)"}
    hints:
