      - {motif: kings-dynasty-made-greater, refs: ["ETCSL 2.5.4.01 A:397-399"], note: "bal-ĝu10 bal-a im-mi-us2-sa / šag4-bal-bal-ĝu10 ḫe2-em-da-gal-gal: as he made my reign follow a reign, may he make my offspring greater"}
