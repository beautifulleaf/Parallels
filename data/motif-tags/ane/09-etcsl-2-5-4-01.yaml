      - {motif: god-commissions-king-to-build-temple, refs: ["ETCSL 2.5.4.09 A:2-5"], note: "here for a chariot, not a temple"}
      - {motif: king-named-by-high-god, refs: ["ETCSL 2.5.4.09 A:3-4"], note: "sipad gal-zu mu dug3 sa4-a / šag4 ama sig7 u3-tud: wise shepherd called by a good name, born of a beautiful mother's womb"}
      - {motif: divine-chariot-parts-as-cosmic-images, refs: ["ETCSL 2.5.4.09 A:9-16", "ETCSL 2.5.4.09 A:28-40"], note: "pole: a-gar3 ab-sin2 ĝal2 ... še gu-nu (furrowed field of dappled grain); su-din-zu dungu (cloud); mudguard Utu at the horizon; a2-šita4 Nanna in mid-heaven; platform warriors fighting; side-beams breeding bulls; lines 17, 22-27, 41-61 missing"}
      - {motif: god-as-neck-stock-on-wicked, refs: ["ETCSL 2.5.4.09 A:14"], note: "{ĝiš}rab3 maḫ-zu nu-e3 erim2 šu ri-ri-me-en: your yoke a huge neck-stock from which there is no escape, clamping down the evildoer"}
      - {motif: net-from-which-none-escapes, refs: ["ETCSL 2.5.4.09 A:15", "ETCSL 2.5.4.09 A:33"], note: "sa-par4 gal nu2-a an ki-ta la2-a: a great net spanning heaven and earth; {sa}šu2-uš-gal ba9-ra2 erim2-du nu-e3: open battle-net the evildoer does not escape"}
      - {motif: high-god-rides-chariot-with-consort-in-procession, refs: ["ETCSL 2.5.4.09 B:66-75"], note: "ama {d}nin-lil2 nitalam-ma-ni gu2-da mu-ni-in-la2 ... {ĝiš}gigir nim-gin7 ĝir2-ĝir2-re: the chariot flashes like lightning; donkeys harnessed; Ninurta makes the road pleasant; ki a nam tar-ra: the place where the seed is blessed; lines 76-80 missing"}
      - {motif: god-introduces-plough-and-furrow, refs: ["ETCSL 2.5.4.09 B:82-87"], note: "{ĝiš}al-e {ĝiš}apin-e ... a-da-min3: let hoe and plough contend; {d}nin-urta-ke4 {ĝiš}apin kug-ge si nam-mi-in-sa2 gana2 zid na-ur11-ru ... numun zid na-mu-ĝar"}
      - {motif: god-acts-as-kings-intercessor-in-temple, refs: ["ETCSL 2.5.4.09 B:88-91"], note: "en {d}nin-urta-ke4 {d}en-lil2-ra sizkur mu-na-ab-be2: Ninurta prays to Enlil for the king who built him the chariot"}
      - {motif: god-asked-to-give-goddess-as-kings-bride, refs: ["ETCSL 2.5.4.09 B:92-95"], note: "{d}inana dumu gal ki aĝ2-zu nitalam-še3 šum2-mu-an / ud ul-še3 gu2-da ḫa-mu-ri-in-la2"}
      - {motif: kirugu-gisgigal-song-structure, refs: ["ETCSL 2.5.4.09 A:65", "ETCSL 2.5.4.09 B:96-97"], note: "sa-gida, sa-ĝara; tigi {d}en-lil2-la2-kam"}
    hints:
      - "Compare Ezek 1:4-28 and 10:1-22 (the divine chariot-throne described part by part: wheels, rims full of eyes, firmament) and 1 Chr 28:18 (the chariot of the cherubim) with A:9-40."
      - "Compare Hab 3:8 and Ps 68:18 (God's chariots), 2 Kgs 2:11 (chariot of fire) with B:66-75; 2 Kgs 23:11 (chariots of the sun)."
      - "Compare Ps 18:11 (cloud and darkness as God's vehicle) with A:12; Ezek 12:13 (my net spread over him) with A:15."
