      - {motif: king-boasts-scribal-and-musical-skill, refs: ["ETCSL 2.5.4.01 A:359-374"], note: "šag4 dub-ba šudum niĝ2-šid ... gana2 gen6-ne2 ĝiš-as4-lum gi e3: tablets, counting, field surfaces, the measuring reed; dub ki-en-gi ki-uri-ka sar-re-bi mu-un-zu-a; instruments al-ĝar-sur9, sa-eš, sabitum, ḫarḫar, zanaru"}
