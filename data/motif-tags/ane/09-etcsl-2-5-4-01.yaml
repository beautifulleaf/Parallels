      - {motif: king-named-in-the-womb, refs: ["ETCSL 2.6.9.5 3"], note: "[X šag4] kug-ta bi2-pad3-da-zu: whom you called from the holy womb (partly restored)"}
      - {motif: god-gives-king-crown-sceptre-crook, refs: ["ETCSL 2.6.9.5 5-6", "ETCSL 2.6.9.5 60", "ETCSL 2.6.9.5 65"], note: "ešgiri2 kalam ge-en-ge-en ... šibir uĝ3 zi-ĝal2; u3-luḫ niĝ2-si-sa2"}
      - {motif: catalogue-of-offerings-drink-and-dairy, refs: ["ETCSL 2.6.9.5 8-17"], note: "ga {d}ezina2 ... kurun ĝeštin ... &kaš;ulušin3 ... kaš tab-ba ... lal3 babbar ... ḫur-saĝ-ta e3-a / i3 ab2 kug-ga i3-nun ... i3-ĝiš ... gara2"}
      - {motif: god-asked-to-accept-pure-food-and-water, refs: ["ETCSL 2.6.9.5 21-26"], note: "u2 sikil-la u2-bi gu7 a sikil-la a-bi naĝ-a / ne-saĝ dug4-ga-zu šag4 ḫul2-la-zu-ta šu te-en-ši-ib / a-ra-zu-ni še-ga-an"}
      - {motif: personal-god-of-ruler, refs: ["ETCSL 2.6.9.5 38"], note: "za-ra diĝir-bi-gin7 igi-bi ma-ra-ši-ĝal2: he looks to you as to his (personal) god"}
      - {motif: lifting-hands-in-prayer, refs: ["ETCSL 2.6.9.5 41", "ETCSL 2.6.9.5 44", "ETCSL 2.6.9.5 52"], note: "šu il2-la-ni-še3 še-ga-mu-un-ši-ib nam dug3 tar-mu-na-ab (partly restored)"}
      - {motif: god-overturns-mountains-shakes-earth, refs: ["ETCSL 2.6.9.5 36"], note: "only image: me-lem4 guru3-a-ni im dugud-da-gin7 lugal gu2 du3-a-ni ḫe2-em-dul: his radiance cover the hostile king like a heavy raincloud"}
      - {motif: king-of-the-four-quarters, refs: ["ETCSL 2.6.9.5 54"], note: "ub-da 4 ĝiri3-ni-še3 gam-mu-na"}
      - {motif: king-as-good-shepherd-sheep-multiply, refs: ["ETCSL 2.6.9.5 55-56"], note: "ma-da-na u2-sal-la nu2-a: reclining in meadows in his land"}
      - {motif: kings-years-numerous-as-stars, refs: ["ETCSL 2.6.9.5 67-69"], note: "mu šar2-a mul-an za-gin3-gin7 šid-bi nu-til-le saĝ-e-eš rig7-mu-na-ab"}
      - {motif: roads-made-safe-under-king, refs: ["ETCSL 2.6.9.5 74-76"], note: "ma-da ki-bi gi4-a ... ĝiri3 ma-da si sa2-mu-na-ab / gu3 kalam-ma teš2-a sig10-ge5-mu-na-ab: make the land speak with one voice"}
      - {motif: land-fertile-under-blessed-king, refs: ["ETCSL 2.6.9.5 78-84"], note: "id2-bi a ... a-šag4-ga še ... pu2-kiri6 lal3 ĝeštin ... ambar ku6 mušen ... {e2}tur3-e amaš ... šeĝx an-ta a-bi bad-ta ḫe2-en-na-ge-en: may heaven's rain, otherwise sporadic, be regular"}
    hints:
      - "Compare Gen 15:5 and 22:17 (descendants as the stars of heaven) and Ps 89:30, 37 (throne as the days of heaven) with lines 67-68."
      - "Compare Deut 11:13-15 and 28:4-12 (rain in its season; grain, wine, oil, flocks) and Lev 26:4 with lines 78-84."
      - "Compare Num 28:7, 14 (drink offerings of strong drink and wine) and Deut 32:14 (butter of cattle, milk of sheep, best of wheat, blood of the grape) with lines 8-17; contrast Ps 50:12-13."
      - "Compare Zeph 3:9 (to serve him with one accord) with line 76."
