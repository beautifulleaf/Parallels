      - {motif: protective-gods-sweep-temple-in-rotation, refs: ["ETCSL 2.6.9.6 32-38"], note: "šag4 ud-sakar ĝar-ra bal-bal-e-de3 / {d}udug e2 {d}lamma e2-ke4 / diĝir gub-ba dumu e2-ke4 ... dur2 ki ma-ra-sar-sar"}
      - {motif: divine-council-gathers-at-new-moon, refs: ["ETCSL 2.6.9.6 34"], note: "only the turn of office beginning at the new moon (ud-sakar)"}
      - {motif: consort-intercedes-for-king, refs: ["ETCSL 2.6.9.6 39-46"], note: "niĝ2-na de5-ga ĝiš-bi dug4-ga-zu: when you light the wood of the censers; {d}nanna {d}nin-gal-bi šu ḫe2-eb-šu-teĝ3-ĝe26-ne / inim kug-ga-ne-ne-a šu ḫa-ra-mu2-mu2-ne"}
