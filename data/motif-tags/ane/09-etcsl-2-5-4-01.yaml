      - {motif: dead-man-was-god-fearing, refs: ["ETCSL 2.7.1.1 6"], note: "of a living ruler: [X] ni2-tuku ni2 te an {d}inana-ke4: reverent one who fears An and Inana"}
      - {motif: king-unites-en-priesthood-and-kingship, refs: ["ETCSL 2.7.1.1 10"], note: "[...] saĝ zig3 en {d}inana-ke4: en priest of Inana"}
      - {motif: ruler-rebuilds-destroyed-temple-of-goddess, refs: ["ETCSL 2.7.1.1 22-24"], note: "[e2-me]-ur4-ur4 ḫa-lam-ma ki-be2-eš gi4-a / [...]-an-šub-ba du3-du3 / [X X ud] ul-ta nu-du3-a mu-un-dim2-ma; partly restored"}
      - {motif: king-statue-set-before-god, refs: ["ETCSL 2.7.1.1 29"], note: "e2-an-na e2-me-ur4-ur4 alan gi16 sug2-ga: who set up permanent statues in E-ana and E-me-urur"}
      - {motif: god-decrees-kings-destiny, refs: ["ETCSL 2.7.1.1 31-37"], note: "nin emeda-a {d}na-na-a bad3 gal ba-gub-bu / zi numun ḫi-li ĝiš-šub-zu-še3 mu-e-ĝar: Nanaya, the nurse, standing like a great wall at E-ana's door, fixed life, progeny and luxury as his lot"}
      - {motif: ruler-releases-citizens-and-slaves-to-holy-city, refs: ["ETCSL 2.7.1.1 38-41"], note: "dumu nibru{ki} saĝ geme2 arad ... šag4 unug{ki}-ga a2-dam-bi ... mu-e-du8-du8 nibru{ki}-še3 šu bar: freed the citizens of Nibru, slave-girls and slaves, from Unug and released them to Nibru"}
