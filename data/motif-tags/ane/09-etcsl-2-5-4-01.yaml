      - {motif: opening-of-the-mouth-for-gods, refs: ["ETCSL 2.6.9.2 A:19-20"], note: "{d}indagara saĝĝa7 utaḫ-ḫe2 kur-ta ka du8-u3 diĝir-re-e-ne-ke4 / šag4 dub-ba su3-ud-da zu-a"}
