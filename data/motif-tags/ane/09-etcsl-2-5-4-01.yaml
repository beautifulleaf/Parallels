      - {motif: king-oath-before-god-with-raised-hands, refs: ["ETCSL 2.5.4.01 A:378-380"], note: "{d}en-lil2-la2 šu il2-il2-la-ni mu-na-da-gub-ba / mu diĝir-re-e-ne nam-erim2 ... ḫe2-ni-kud-de3"}
