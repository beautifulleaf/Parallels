      - {motif: scribal-goddess-holds-tablets, refs: ["ETCSL 2.6.9.2 A:3", "ETCSL 2.6.9.2 A:32"], note: "e2-ĜEŠTUG2.{d}NISABA; nitalam ki aĝ2-zu ki-sikil {d}nisaba nin gal nin-e-ne"}
