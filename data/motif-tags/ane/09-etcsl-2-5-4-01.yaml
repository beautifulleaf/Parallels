      - {motif: prayer-for-kings-long-life, refs: ["ETCSL 2.6.9.1 7-9", "ETCSL 2.6.9.1 21-24"], note: "{ĝiš}gu-za nam-lugal-bi ḫe2-en-na-gen6 bal-bi ḫe2-en-na-su3-ud / ĝidru-ni sig igi-nim-ma / lugal gu2-zal-a-bi ḫe2-en-na-ab-gam-e"}
      - {motif: king-provides-temple-offerings-prayer, refs: ["ETCSL 2.6.9.1 3", "ETCSL 2.6.9.1 10-12"], note: "nidba ... tur maḫ-e nibru{ki} e2-kur; šu-si-bi-ta lal3 i3-nun-gin7 al-biz-biz-ze2-e: syrup drips like ghee from its fingers; obscure"}
      - {motif: god-of-the-city-sends-good-fate-to-king, refs: ["ETCSL 2.6.9.1 20-24"], note: "{d}en-lil2 kur gal-a-ni mu-zu-gin7 {d}ri-im-{d}suen kur gal-a-zu ḫe2-me; Ninurta, Ninnibru (arḫuš2 šag4-la2: mercy), Ninšubur declare life for the king"}
    hints:
      - "The speaker calls himself dumu lu2 'son of a man' (lines 11, 15-16), apparently a servant or official; text obscure. Compare Ps 72:1-2, 15 (prayer for the king continually)."
  - id: ane-etcsl-2-6-9-2-haia-hymn
