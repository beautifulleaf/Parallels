      - {motif: god-appoints-deities-over-domains, refs: ["ETCSL 2.5.4.05 A.A:14-15"], note: "{d}en-lil2 ban3-da dug4-ga zid-da ĝiš-ḫur: junior Enlil of reliable word, (who keeps) the plans; en nam tar-tar-re"}
