      - {motif: hymns-written-down-for-posterity, refs: ["ETCSL 2.5.4.01 A:391-393"], note: "erim3 niĝ2 da-ri2 ibila lugal-la: lasting treasure of the king's heirs"}
      - {motif: kings-dynasty-made-greater, refs: ["ETCSL 2.5.4.01 A:397-399"], note: "bal-ĝu10 bal-a im-mi-us2-sa / šag4-bal-bal-ĝu10 ḫe2-em-da-gal-gal: as he made my reign follow a reign, may he make my offspring greater"}
      - {motif: descendants-to-perform-kings-songs, refs: ["ETCSL 2.5.4.01 A:400-407"], note: "kiĝ2-nim kiĝ2-sig šir3-ĝu10 ḫe2-na-DI: perform my songs at the morning and evening meals; lines 412-419 fragmentary, c. 34 lines lost"}
