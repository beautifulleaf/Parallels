      - {motif: incomparability-among-the-gods, refs: ["ETCSL 2.6.9.2 A:31"], note: "a-ba za-a-gin7 diĝir-re-e-ne-ke4 me kug-ga-aš tum2-ma"}
      - {motif: priest-chosen-by-omen, refs: ["ETCSL 2.6.9.2 A:39"], note: "en ĝi6-par3-e mu-ni-ib-ḫuĝ-en: you appoint the en for the ĝipar"}
      - {motif: deity-hears-prayer-and-pleading, refs: ["ETCSL 2.6.9.2 A:41", "ETCSL 2.6.9.2 B:59"], note: "{d}ḫa-ia3 diĝir kalam-ma a-ra-zu uĝ3 šar2-ra ĝiš tuku-me-en; ga-til3-e ki aĝ2: who loves (the plea) 'let me live!'; a2 bad tal2-ni: extend your broad arms round the king"}
      - {motif: kings-years-marked-on-tablet-of-life, refs: ["ETCSL 2.6.9.2 A:50-53"], note: "im nam-til3-la-ke4 du-ri2-še3 nu-kur2-ru mu-bi gub-i3"}
      - {motif: heavenly-book-of-life, refs: ["ETCSL 2.6.9.2 A:52"]}
      - {motif: god-gives-king-crown-sceptre-crook, refs: ["ETCSL 2.6.9.2 A:40-42"], note: "sipad kalam-ma-ra ĝidru maḫ ud su3-ra2 šu-ni-še3 bi2-ib-dab5-e-en"}
      - {motif: god-lifts-the-head, refs: ["ETCSL 2.6.9.2 A:45"], note: "uĝ3 ... gu2-bi an-še3 ši-bi2-ib2-zi-zi: you make the people lift their necks to heaven"}
    hints:
      - "Compare Ps 139:16 ('in your book were written all the days'), Exod 32:32, Ps 69:29 and Mal 3:16 (book of remembrance) with A:5 and A:52; Q 57:22 (nothing befalls but it is in a book) and Q 6:59."
      - "Compare Ezek 9:2-4 (the man clothed in linen with a scribe's inkhorn) with A:5, A:9."
      - "Compare Deut 33:27 (underneath are the everlasting arms) with B:59; Ps 65:3 (you who hear prayer)."
  - id: ane-etcsl-2-6-9-3-an-prayer
    tradition: ane-sumerian
    title: "Rim-Sîn C: prayer to An for the king called by name in the womb: crown, throne of life, sceptre, and the breasts of heaven opened"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Sumerian"
    read: ["ETCSL 2.6.9.3 1-29"]
    tags:
      - {motif: king-named-in-the-womb, refs: ["ETCSL 2.6.9.3 1-3"], note: "sipad mu pad3-da an kug-ge nam gal an-na tar / nun šag4 zid-ta nam-lugal-la mu-un-sa2: prince who attained kingship in the true womb"}
      - {motif: god-decrees-kings-destiny, refs: ["ETCSL 2.6.9.3 7-10", "ETCSL 2.6.9.3 16-17"], note: "a-a diĝir-re-e-ne nam tar-tar-re-de3 ... dug4-ga niĝ2-nam nu-kur2-da zi su3-ra2 ḫu-mu-ra-ab-taḫ"}
      - {motif: just-king-does-justice-and-righteousness, refs: ["ETCSL 2.6.9.3 13"], note: "niĝ2-si-sa2-zu-še3 gu3 zid-de3-eš ḫu-mu-ra-ab-de"}
      - {motif: god-gives-king-crown-sceptre-crook, refs: ["ETCSL 2.6.9.3 18-22"], note: "aga kug-ge ... {ĝiš}gu-za nam-til3-la-ka ... u3-luḫ niĝ2-si-sa2 ... ešgiri2 kalam ge-en-ge-en ... šibir uĝ3 lu-a: throne of life, sceptre of justice, staff, crook"}
      - {motif: udders-of-heaven-open, refs: ["ETCSL 2.6.9.3 23"], note: "ubur an sud-aĝ2 ĝal2 ḫu-mu-ra-ab-taka4 šeĝx an-na ḫu-mu-ra-ab-šeĝ3: may he open the breasts of the brilliant heaven and make heaven's rain fall"}
      - {motif: fate-of-abundance-decreed-for-king, refs: ["ETCSL 2.6.9.3 24-26"], note: "mu ma-da ud nam-ḫe2 an-šag4-ta zag ḫu-mu-ra-ab-keše2"}
      - {motif: prayer-for-kings-long-life, refs: ["ETCSL 2.6.9.3 14-17", "ETCSL 2.6.9.3 27-28"]}
    hints:
      - "Compare Gen 49:25 (blessings of heaven above ... of breasts and womb), Deut 28:12 (YHWH will open his good treasury, the heavens, to give rain) and Mal 3:10 with line 23."
      - "Compare Isa 49:1 and Jer 1:5 with lines 1-3; Ps 45:7-8 (sceptre of equity) with line 20."
      - "Line 29 is a scribal subscript: '28 lines; a prayer to An'."
  - id: ane-etcsl-2-6-9-4-gate-prayer
    tradition: ane-sumerian
    title: "Rim-Sîn D: prayer to the gods of peace at the Great Gate of Urim as the king enters"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Sumerian"
    read: ["ETCSL 2.6.9.4 1-49"]
    tags:
      - {motif: right-and-justice-as-helper-gods, refs: ["ETCSL 2.6.9.4 3"], note: "[{d}niĝ2]-zid {d}niĝ2-si-sa2 a2-taḫ-zu ḫe2-a"}
      - {motif: gate-gods-greet-king-entering-city, refs: ["ETCSL 2.6.9.4 6-21", "ETCSL 2.6.9.4 31-47"], note: "abula maḫ abula urim5{ki}-ma ku4-ku4-da-zu-ne / [{d}udug sag9]-ga {d}lamma silim-ma-ka / i3-du8 abula maḫ-a-ke4 ... {ĝiš}ig ĝal2 ḫu-mu-ra-ab-da13-da13-aš: may they open the doors for you; zid-da gab2-bu-zu: at your right and left"}
      - {motif: protective-spirits-go-before-and-behind, refs: ["ETCSL 2.6.9.4 8", "ETCSL 2.6.9.4 42-43"]}
      - {motif: gate-gods-named-in-litany, refs: ["ETCSL 2.6.9.4 35-41"], note: "four named gate-gods at Du-barag-gal-maḫ, each line beginning with the place-name: {d}niĝ2-erim2-šu-tab-bi, {d}niĝ2-erim2-šu-ur4-ur4, {d}dug4-ga-ab-šu-gi4-gi4, {d}dug4-ga-ab-šu-tab-bi; names apparently 'Evil-is-seized', 'Evil-is-swept-away', 'Speak-and-it-is-answered' (interpretive)"}
      - {motif: consort-intercedes-for-king, refs: ["ETCSL 2.6.9.4 11-13", "ETCSL 2.6.9.4 44-45"], note: "inim sag9-ga-zu {d}nanna {d}nin-gal-ra ḫe2-ni-ib-kur9-re-eš-a / nam-til3 silim-ma ... ḫe2-ri-ib-gi4-ne: bring your greeting to Nanna and Ningal and an answer of life and peace"}
      - {motif: favourable-signs-set-before-king, refs: ["ETCSL 2.6.9.4 31-33", "ETCSL 2.6.9.4 46-47"], note: "[ĝiškim] sag9-sag9-ga inim niĝ2 šag4 dug3-ga igi-zu-še3 ḫa-ra-ab-ĝar-re-eš / ki kug ki nam-til3-la ĝiri3-zu ḫe2-ri-ib-gub-bu-ne; lines 24-30 fragmentary"}
    hints:
      - "Compare Ps 24:7-10 ('Lift up your heads, O gates, that the King of glory may come in') and Ps 118:19-20 (open to me the gates of righteousness) with lines 7-23."
      - "Compare Ps 85:11-14 and 89:15 (righteousness and justice go before God, as personified attendants) with line 3."
      - "Compare Ps 121:8 (YHWH will keep your going out and coming in) and Ps 91:11 with lines 33-43."
