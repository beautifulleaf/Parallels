      - {motif: sons-greet-returning-father-where-were-you, refs: ["CTH 331.1 §14:69-75"], note: "8 DUMU.MEŠ DINGIR.MEŠ 'eight sons of the gods' met on the road; ḫi-in-kán-ta-at 'bowed'; {d}IM-ta [a]t-ta-šu[m-mi] ku-wa-pí e-eš-ta 'Storm god, our father, where were you?'; he answers in the first person"}
      - {motif: vanishing-god-departs-in-anger, refs: ["CTH 331.1 §12:60"], note: "the going (pa-it) of the Storm god; no anger is stated in the preserved text"}
      - {motif: gods-ask-what-shall-we-do, refs: ["CTH 331.1 §15:76-83"], note: "the sons: da-a-la-wa 'let it be!'; a-mi-ya-an-te-eš-wa ú-e-eš 'we are small'; ut-ni-wa-kán ú-e-eš 'we are in the land'; nu-za ut-ne-e tar-ḫu-[er] 'they conquered the land'"}
      - {motif: roused-god-destroys-rivers-cities-men, refs: ["CTH 331.1 §16:84-87"], note: "ḫa-at-te-eš-na-aš kat-t[a] 'down into the pits'; GU4-un ta-ru-up-pé-er 'they gathered the cattle', the sheep, DUMU.LÚ.U19.LU ta-ru-up-pé-[er] 'they gathered the people': the sons' action, not the god's, so a loose fit"}
    hints:
      - "A long absence that seems short and a question 'where were you?': compare the man who slept a hundred years and is asked 'how long have you stayed?' (Q 2:259) and the sleepers of the cave (Q 18:19)."
      - "Eight years in a foreign town working and harvesting: compare Jacob's years of service for Laban (Gen 31:41) and Moses' eight or ten years in Midian (Q 28:27)."
