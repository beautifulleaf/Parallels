    tagger: "Claude (model), reading the Hittite"
    read: ["CTH 331.1 §1:1-§11:59"]
    tags:
      - {motif: ailments-of-eyes-listed-and-removed, refs: ["CTH 331.1 §1:3-§2:15"], note: "[DUM]U-li A-NA S[AG.D]U-ŠU 'to the child, on his head'; tarpi-, parninka-, [blood], ḫa-pa-an-zi, [iš-ḫa-aḫ-r]u 'the flow of tears', IGI.ḪI.A-aš '(disease) of the eyes', [š]i-pa-an 'pus', kam-ma-ra-a-an 'the clouding (lit. mist)', i-na-an 'the disease' ... da-a-ú 'let him take'"}
