# Full read, chunk 48: the Hittite vanishing-god myths (CTH 324.3 - 335.23).
# Read from the hethiter.net / TLHdig editions (transliteration by section and Kolon, German translation as a reading aid).
new_motifs:
  vanishing-god-departs-in-anger: {label: "An angered god walks out of his house and land and disappears, and with him the land's wellbeing goes", cluster: vanishing-god}
  shoes-put-on-wrong-feet: {label: "The departing god in his fury puts his right shoe on his left foot (and the left on the right) before going out", cluster: vanishing-god}
  vanished-god-takes-fertility-with-him: {label: "The departing god carries off with him grain, fertility, growth, thriving and satiety", cluster: vanishing-god}
  mist-seizes-windows-smoke-the-house: {label: "When the god departs, mist (kammara-) seizes the windows and smoke seizes the house", cluster: vanishing-god}
  hearth-altar-fold-choke: {label: "In the god's absence the logs in the hearth, the gods on the altar-stands, the sheep in the fold and the cattle in the pen 'choke' (wešuriya-)", cluster: vanishing-god}
  ewe-rejects-lamb-cow-rejects-calf: {label: "In the god's absence the ewe rejects her lamb and the cow her calf", cluster: vanishing-god}
  crops-and-wombs-fail-in-gods-absence: {label: "In the god's absence barley and emmer no longer grow, and cattle, sheep and humans no longer conceive, and the pregnant do not give birth", cluster: vanishing-god}
  mountains-trees-springs-dry-up: {label: "In the god's absence the mountains, trees, meadows and springs dry up and no shoot comes forth", cluster: vanishing-god}
  famine-in-land-gods-and-men-perish: {label: "Famine arises in the land, so that gods and humans are perishing of hunger", cluster: vanishing-god}
  gods-feast-without-satiety: {label: "The Sun god gives a feast and calls the thousand gods; they eat and drink but cannot still their hunger and thirst", cluster: vanishing-god}
  gods-search-for-vanished-god: {label: "The great and small gods set out to search for the vanished god and do not find him", cluster: vanishing-god}
  eagle-searches-for-vanished-god: {label: "The swift eagle is sent to search the high mountains, the deep valleys and the 'blue' waters, but does not find the vanished god and reports back", cluster: vanishing-god}
  storm-god-searches-and-breaks-gate: {label: "The Storm god himself goes to the vanished god's town, knocks at the gate, and breaks the bolt with his hammer, but finds no one", cluster: vanishing-god}
  mother-goddess-sends-bee: {label: "The mother goddess (Hannahanna) sends the little bee to find the vanished god when the great gods have failed", cluster: vanishing-god}
  bee-finds-sleeping-god-stings-him: {label: "The bee finds the vanished god asleep in a meadow or grove, stings his hands and feet to make him rise, and wipes his eyes and feet with wax", cluster: vanishing-god}
  bee-searches-mountains-valleys-waters: {label: "The bee searches the high mountains, the deep valleys and the waters, until its honey and wax are used up", cluster: vanishing-god}
  woken-god-angrier-why-wake-me: {label: "The woken god is angrier still and complains: why did you wake me when I was sleeping, make me speak when I was sulking?", cluster: vanishing-god}
  roused-god-destroys-rivers-cities-men: {label: "The roused god in his fury diverts the flowing rivers, tears down banks, destroys cities and houses and kills men, cattle and sheep", cluster: vanishing-god}
  gods-ask-what-shall-we-do: {label: "The gods, at a loss before the angry god, ask one another 'how shall we act, what shall we do?'", cluster: vanishing-god}
  gods-blame-each-other-for-sin: {label: "Gods argue over whose offence (waštul) caused the god's disappearance: the grandfather blames the father, who denies it", cluster: vanishing-god}
  mother-goddess-will-set-right-either-way: {label: "The mother goddess reassures: whether it is your sin or not, I will put it right", cluster: vanishing-god}
  mugawar-invocation-with-offerings: {label: "The ritualist sets food and drink before the angry god and invokes him (mugai-): eat, drink, still your hunger and thirst, come back and be at peace", cluster: vanishing-god}
  god-asked-to-turn-to-king-in-good: {label: "The returning god is asked to turn back to the king, the queen, the princes and the land of Hatti in goodwill", cluster: vanishing-god}
  path-sprinkled-with-fine-oil: {label: "The god's road is sprinkled with fine oil and he is told to walk on it back to his house", cluster: vanishing-god}
  bed-of-sahi-and-happuriya: {label: "The returning god is offered a bed of šaḫi- and ḫappuriya-wood (or leaves) and told to lie down and sleep", cluster: vanishing-god}
  analogic-spell-against-gods-anger: {label: "Analogic spell: as this substance (malt, firewood, fire, wax, fat, water in a pipe, a felled tree) is treated, so may the god's anger, wrath, sin and sullenness end", cluster: vanishing-god}
  anger-sealed-in-netherworld-cauldrons: {label: "The god's anger, wrath, sin and sullenness are sent down to the dark earth into cauldrons of bronze or iron with lids of lead; what goes in does not come up but perishes there", cluster: vanishing-god}
  netherworld-doorkeeper-opens-seven-doors: {label: "The doorkeeper opens the seven doors and draws back the seven bolts so that the god's anger may go down into the dark earth", cluster: vanishing-god}
  anger-barred-from-fields-garden-forest: {label: "The god's anger must not go into the fruitful field, the garden or the forest, but take the road of the dark earth", cluster: vanishing-god}
  house-parts-release-the-anger: {label: "Each part of the house is told to let the god's anger go: the house, the window, the hinge, the inner court, the door, the gate, the king's road", cluster: vanishing-god}
  evil-taken-from-gods-body: {label: "The healer or goddess takes from the god's body his anger, wrath, sin, sullenness, the evil tongue and the evil sole", cluster: vanishing-god}
  god-singed-with-fire-to-purge-anger: {label: "The goddess singes the god 'here' and 'there' with fire (or the eagle's wings) to burn away his anger", cluster: vanishing-god}
  god-returns-house-restored: {label: "The god returns to his house: mist leaves the windows, smoke leaves the house, the altar-stands, hearth, fold and pen are set right again", cluster: vanishing-god}
  mother-ewe-cow-accept-young-again: {label: "On the god's return the mother recognises her son again, the ewe her lamb and the cow her calf", cluster: vanishing-god}
  gods-eat-and-are-satisfied-on-return: {label: "On the god's return the gods (or people) eat and are satisfied and drink and still their thirst", cluster: vanishing-god}
  returned-god-cares-for-king: {label: "The returned god cares for the king and queen and provides them with life, vigour and long future", cluster: vanishing-god}
  eya-tree-with-hanging-fleece: {label: "Before the returned god stands an eya-tree from which a sheep's fleece is hung, holding long years, progeny, growth, satiety, obedience and the right thigh", cluster: vanishing-god}
  lamb-fleece-holds-mild-message: {label: "Before the hearth or altar a lamb's fleece is hung, holding 'the mild message of the lamb'; may the king and queen be such a mild message before the god", cluster: vanishing-god}
  queen-asks-sons-daughters-long-years: {label: "Prayer that the god give the king and queen sons, daughters, grandchildren, great-grandchildren and long years", cluster: vanishing-god}
  divine-assembly-under-hawthorn: {label: "The gods hold assembly under the hatalkešna-tree (hawthorn), where long years lie and all the gods sit", cluster: vanishing-god}
  god-carried-off-by-wind-to-sea: {label: "A vanished god is carried away into the sea (or by the wind) and must be fetched back", cluster: vanishing-god}
  vanished-god-hides-in-place-of-concealment: {label: "The vanished deity lies hidden in a named place (the moor, a pit, a grove) from which helpers must bring her or him back", cluster: vanishing-god}
  illness-passed-down-to-earth-and-sea: {label: "An illness is passed hand to hand (palms to fingers to nails) down to the dark earth, to the Sun deity and into the sea, where it is laid in copper cauldrons with lead lids", cluster: vanishing-god}
  ailments-of-eyes-listed-and-removed: {label: "The ailments of the eyes (tears, pus, clouding, whiteness, disease) are named one by one and taken away", cluster: healing}
  body-made-bright-as-before: {label: "After the healing it grows bright on the person's body, head, eyes, brows and lashes, and he is to become again as he was before", cluster: healing}
  god-sojourns-years-in-town-harvests-it: {label: "The Storm god stays eight years in a town, strikes it, harvests it, plants an orchard and fells it, and then returns", cluster: vanishing-god}
  sons-greet-returning-father-where-were-you: {label: "The returning god meets his sons on the road; they bow and ask 'Father, where were you?'", cluster: vanishing-god}
  fruit-holds-seed-wine-oil-analogy: {label: "Analogy: as the fig holds a thousand seeds within, the raisin its wine and the olive its oil, so may the god hold within the good life, strength, long years and joy of the king and queen", cluster: vanishing-god}
  god-asked-to-incline-ear-to-king: {label: "The god is asked to keep his ear inclined and listen to what the king and queen say", cluster: prayer}
  throw-away-bad-words-take-good: {label: "The god is asked to throw away the bad words like nutshells and take the good words", cluster: vanishing-god}
  slanderer-of-king-before-god-punished: {label: "Whoever speaks evil of the king and queen before the god, the god is to give him a sour apple (punish him)", cluster: vanishing-god}
  god-highest-of-the-high-foremost-of-foremost: {label: "Superlative address: 'you are the highest of the high, the foremost of the foremost'", cluster: divine-titles}
  sheep-driven-out-not-killed: {label: "At the end of the rite a sheep is driven out but not killed", cluster: vanishing-god}
  garment-and-veil-put-on-backwards: {label: "The departing goddess fastens her garment's pins at the back and turns her veil back to front", cluster: vanishing-god}
  mother-son-wife-husband-choke: {label: "In the deity's absence mother and son, wife and husband 'choke' (are estranged) as do the herds", cluster: vanishing-god}
  midwife-as-ritualist: {label: "The midwife (MUNUS ŠÀ.ZU) performs the rite and speaks the words that recount and reverse the deity's departure", cluster: vanishing-god}
  aromatic-woods-burned-to-lure-deity: {label: "Fragrant woods (olive?, šaḫi, parnulli, cedar) are burned in the ritual patron's house to draw the vanished deity back", cluster: vanishing-god}
  salt-lick-never-runs-out-analogy: {label: "Analogy: as the salt-lick of the meadow never runs out, so may the life of the ritual patron never run out but be everlasting", cluster: vanishing-god}
  hawthorn-plucks-fleece-analogy: {label: "Analogy of the hawthorn, white in spring and blood-red in summer, which plucks the forelock of the ox and the fleece of the sheep passing under it: so may it pull out the deity's anger", cluster: vanishing-god}
  pure-water-poured-cloud-rises-into-body: {label: "Pure water from the queen of the spring is poured on the hearth stones; a cloud (of steam) rises, enters the deity's body and drives the anger out", cluster: vanishing-god}
  soapwort-and-pebbles-from-untouched-place: {label: "The goddess Hapantali brings soapwort, wood from the mountain and pebbles from an untouched place and throws them into the hearth", cluster: vanishing-god}
  terrible-one-become-gracious: {label: "Invocation formula: 'we invoke you with thick bread and libation: as the terrible one become gracious, as the angry one speak, as the choked one be set right again'", cluster: vanishing-god}
  table-set-right-and-left-nine-dishes: {label: "The ritualist sets the god's laden tables right and left, cheese at his feet, nine dishes and an engraved beaker of beer, and bids him eat and drink the finest", cluster: vanishing-god}
  hot-pebbles-quenched-analogy: {label: "Analogy: as the hot pebbles are quenched with water, so may the deity's anger, wrath, sin and sullenness be quenched", cluster: vanishing-god}
  cart-held-back-analogy: {label: "Analogy: as this cart is held back, so may our words hold back the deity's anger", cluster: vanishing-god}
  storm-god-comes-raging-held-back: {label: "The Storm god comes raging and the 'man of the Storm god' holds him back", cluster: vanishing-god}
units:
  - id: ane-cth-324-3-1-bee-finds-telipinu
    tradition: ane-hittite
    title: The bee is sent, searches and wakes Telipinu (Telipinu myth, third version)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Hittite"
    version: "Third version (CTH 324.3)"
    read: ["CTH 324.3 §1:1-§3:19"]
    tags:
      - {motif: bee-finds-sleeping-god-stings-him, refs: ["CTH 324.3 §2:3-10"], note: "instructions to the bee, largely restored: [ša-an-ḫ]a ... ma-a-na-an ú-e-mi-ya-ši 'if you find him', [š]i-i-ya 'sting', nu IGI.ḪI.A-ŠU QA-TI-ŠU '[wipe] his eyes, his hands', [pár-k]u-nu-ut 'purify', na-an am-me-el kat-ta ú-wa-ti 'bring him to me'"}
      - {motif: mother-goddess-sends-bee, refs: ["CTH 324.3 §2:10"], note: "the sender speaks: 'bring him down to me' (am-me-el katta uwati); the speaker's name is lost"}
      - {motif: bee-searches-mountains-valleys-waters, refs: ["CTH 324.3 §3:11-16"], note: "NIM.LÀL-aš 'the bee'; [pár-ga-mu-u]š ḪUR.SAG.MEŠ-uš ša-a-an-aḫ-ta 'she searched the high mountains'; LÀL-it zi-in-né-et 'the honey ran out', [wax] ran out"}
      - {motif: bee-finds-sleeping-god-stings-him, refs: ["CTH 324.3 §3:17-19"], note: "found [in Liḫz]ina in a meadow in the grove ({GIŠ}TIR); [ši-e-e]t 'stung'; na-aš a-r[a-iš] 'and he rose'"}
    hints:
      - "The small creature succeeding where the great gods fail: compare the raven sent to show Cain how to bury (Q 5:31) and the hoopoe who finds what Solomon did not know (Q 27:20-22); the bee itself is honoured as a creature inspired by God (Q 16:68-69)."
      - "The god asleep and roused: contrast Q 2:255 ('neither slumber nor sleep overtakes him') and Ps 121:4; compare the call 'Awake, why do you sleep, O Lord?' (Ps 44:24)."
  - id: ane-cth-324-3-2-telipinu-rages
    tradition: ane-hittite
    title: Woken Telipinu rages and destroys; the gods take counsel and send the eagle (third version)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Hittite"
    version: "Third version (CTH 324.3)"
    read: ["CTH 324.3 §4:20-§6:49"]
    tags:
      - {motif: woken-god-angrier-why-wake-me, refs: ["CTH 324.3 §4:20-24"], note: "[ú-uk-wa-a]z ša-a-nu-un 'I was angry'; šu-me-ša-wa-mu ša-ša-an-da-an ... 'why have you (roused) me, the sleeping one'; ša-a-an-ta-an ku-wa-at me-ma-nu-ut-te-en 'why did you make me, the sulking one, speak?'"}
      - {motif: roused-god-destroys-rivers-cities-men, refs: ["CTH 324.3 §4:25-§5:33"], note: "ÍD.ḪI.A ar-šar-šu-u-ru-uš ḫu-it-ti-y[a-at] 'he drew off the flowing rivers'; URU.DIDLI.ḪI.A-uš pí-ip-pa-aš 'overturned the cities', É.ḪI.A-TIM pí-ip-pa-aš 'the houses'; DUMU.LÚ.U19.LU ḫar-ni-ik-ta 'destroyed mankind', GU4.ḪI.A UDU.ḪI.A 'cattle and sheep'"}
      - {motif: gods-ask-what-shall-we-do, refs: ["CTH 324.3 §5:35-39"], note: "{d}te-li-pí-nu-uš=wa le-e-la-ni-it-ta-at 'Telipinu has become furious'; [ma-a-a]n-wa i-ya-u-e-ni, [ku-it-wa] i-ya-u-e-ni 'how shall we act? what shall we do?'"}
      - {motif: god-singed-with-fire-to-purge-anger, refs: ["CTH 324.3 §6:40-47"], note: "very broken: 'call the man(kind)' ... {GIŠ}ḫattaran 'the (bee's) sting/awl'?; [ḫa-a]-ra-aš.MUŠEN 'the eagle shall step forward', [wa-a]r-nu-ud-du 'let him burn (him)'; ḫa-a-r[a-aš ... pár-ta-u-ni-i]t 'the eagle with his wings'; [ša-an] ki-iš-nu-er 'they extinguished (?)'; much of the reading rests on restoration (Trabazo: ar-nu-ud-du 'let him carry')"}
    hints:
      - "The awakened god who destroys rivers and cities resembles divine anger let loose on towns overturned (Q 11:82, 'we turned it upside down'; Gen 19:25 'he overthrew those cities')."
      - "The gods' helplessness 'what shall we do?' contrasts with the Quranic God who needs no counsel (Q 2:30-33 is the closest scene of a divine council)."
  - id: ane-cth-324-3-3-evil-sent-off-fertility-brought-out
    tradition: ane-hittite
    title: Anger driven out of Telipinu's limbs; grain, fertility and good rain brought out of the oven (third version)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Hittite"
    version: "Third version (CTH 324.3)"
    read: ["CTH 324.3 §7:50-§10:64"]
    tags:
      - {motif: evil-taken-from-gods-body, refs: ["CTH 324.3 §8:53-57"], note: "[tu-eg-g]a-aš-ša-aš an-dan 'in his limbs'; [ar-ḫ]a pár-aḫ-ta 'drove away'; kar-p[í-in] ... [EM]E-an i-da-a-lu-un pa-ta-a[l-ḫa-an] ... ša-a-ku-wa ar-ša-na-an-d[a] 'anger ... the evil tongue, the (evil) sole, the envious eyes'"}
      - {motif: vanished-god-takes-fertility-with-him, refs: ["CTH 324.3 §9:58-60"], note: "reversal: [UDUN-ya-a]z pa-ra-a ú-da-aš 'he brought out of the oven' ḫal-ki-in {d}im-mar-ni-in ... a-aš-ša-mu-uš ḫe-e-a-mu-uš a-aš-ša-mu-uš IM.ḪI.A-uš 'grain, fertility, the good rains, the good winds' ... ḫu-u-ma-an pa-ra-a ú-da-aš 'brought out everything'"}
      - {motif: analogic-spell-against-gods-anger, refs: ["CTH 324.3 §10:61-64"], note: "fragmentary: the apple-tree ({GIŠ}ḪAŠḪUR) and maršigga-fruit, 'his soul' (ZI-ŠU): the opening of a simile series; tarranuddu 'let it make strong'"}
    hints:
      - "Rains and winds released from a store (here an oven): compare God's storehouses of rain and wind (Q 15:21-22, 'there is nothing whose storehouses are not with us ... we send the fertilizing winds'; Job 38:22, Jer 10:13)."
      - "The 'evil tongue' and 'envious eyes' removed from the god: compare refuge from the envier (Q 113:5)."
  - id: ane-cth-324-3-4-telipinu-returns
    tradition: ane-hittite
    title: Telipinu returns; house and herds set right; the eya-tree with the fleece (third version)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Hittite"
    version: "Third version (CTH 324.3)"
    read: ["CTH 324.3 §11:65-§15:91"]
    tags:
      - {motif: god-returns-house-restored, refs: ["CTH 324.3 §11:65-68", "CTH 324.3 §11:70", "CTH 324.3 §11''':69"], note: "{d}[te-li-pí-nu-uš] an-da pa-it 'Telipinu went in'; É-er tú[ḫ-ḫu-iš] 'the smoke (left) the house'; {GIŠ}kal-mi-eš-ša-n[é-eš] 'the logs'; I-NA ŠÀ TÙR, I-NA ŠÀ É.GU4 'in the fold, in the cattle pen' (the rest restored)"}
      - {motif: mother-ewe-cow-accept-young-again, refs: ["CTH 324.3 §11:71-72"], note: "nu-za GU4.ḪI.A AMAR-[ŠU], UDU.ḪI.A-ma-za SILA4-[SÚ]: 'the cow [recognised its] calf, the ewe its lamb' (verb restored)"}
      - {motif: returned-god-cares-for-king, refs: ["CTH 324.3 §12:73-§13:75"], note: "Ù KUR {URU}ḫa-at-ti 'and the land of Hatti'; TI-an-ni in-na-ra-[u-wa-an-ni] 'with life, vigour'"}
      - {motif: eya-tree-with-hanging-fleece, refs: ["CTH 324.3 §13:76-85"], note: "{GIŠ}e-ya-a[z] ... kán-kán-za 'hung from the eya-tree'; MU.KAM.ḪI.A GÍD.DA 'long years'; DUMU.MEŠ-tar DUMU.NITA.MEŠ DUMU.MUNUS.MEŠ 'progeny, sons, daughters'; LÚ-na-tar tar-ḫu-u-i-li 'manhood and valour'; šal-ḫi-it-ti-iš 'growth'; nu-ú-uš 'assent'"}
      - {motif: returned-god-cares-for-king, refs: ["CTH 324.3 §14:86-88"], note: "na-an {d}te-li-pí-nu-u[š ...] 'Telipinu [had] it [brought to the king]'; [nu]-uš-ši ḫu-u-ma-an 'to him everything'"}
    hints:
      - "The fleece hung on the tree that holds long life and progeny: compare Gideon's fleece as a sign (Judg 6:36-40); the tree of blessing beside the god recalls the 'good tree' whose root is firm and branch in heaven (Q 14:24-25)."
      - "Return of the god and restoration of the herds: compare the return of rain and blessing after repentance (Q 71:10-12, 'he will send the sky upon you in showers and help you with wealth and sons'; Joel 2:21-26)."
  - id: ane-cth-324-4-mugawar-and-analogies
    tradition: ane-hittite
    title: Offerings and analogic spells to soothe Telipinu (Telipinu myth, fourth version)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Hittite"
    version: "Fourth version (CTH 324.4)"
    read: ["CTH 324.4"]
    tags:
      - {motif: mugawar-invocation-with-offerings, refs: ["CTH 324.4 §2:3-§4:18"], note: "te-eḫ-ḫu-un 'I placed' (cheese restored); {DUG}KA.GAG gul-ša-an-ta-an 'the engraved beaker'; tar-na-aḫ-ḫu-un 'I let ...'; iš-pa-a-i 'still (your hunger)', ni-in-g(a) 'still (your thirst)'; ḫa-an-da-aḫ-ḫu-ut 'be set right'"}
      - {motif: god-asked-to-turn-to-king-in-good, refs: ["CTH 324.4 §6:24", "CTH 324.4 §7:27"], note: "[LU]GAL MUNUS.LUGAL ... a-aš-šu-li na-a-iš-ḫu-ut 'turn in goodwill to the king, the queen ...'"}
      - {motif: analogic-spell-against-gods-anger, refs: ["CTH 324.4 §6:22", "CTH 324.4 §7:25", "CTH 324.4 §8:28-§9:34"], note: "parḫuena- and galaktar lie here; as malt is dry and is not taken to the field or made seed or bread, [ebens]o te-e-ep-ša-u-e-eš-du 'so let (Telipinu's) anger and wrath dry up'"}
      - {motif: analogic-spell-against-gods-anger, refs: ["CTH 324.4 §10:35-40"], note: "ZI-ŠU ... ú-e-šu-ri-ya-at-ta-ti 'the angry one's soul choked'; as firewood is kindled and it grows light in the four corners, so let anger [burn]: [w]a-ra-a-nu; da-an-du-ke-eš-na-aš DUMU-aš 'the child of mortality' made the words"}
      - {motif: god-singed-with-fire-to-purge-anger, refs: ["CTH 324.4 §11:41-44"], note: "[na-a]k-ki-iš DINGIR-uš 'the weighty god' kindled ([p]a-ra-a-iš) ... iš-ḫu-wa-a-iš 'poured out': fragmentary"}
    hints:
      - "Eat and drink and be satisfied: compare the formula of eating and drinking in paradise (Q 52:19, 69:24) and the meal set before divine guests (Gen 18:5-8; Q 51:26-27, where the guests do not eat)."
      - "Malt that is not sown: compare the seed that falls and does not sprout in Jesus' parable and the curse 'as malt does not sprout' in Akkadian treaties."
  - id: ane-cth-324-5-fragment
    tradition: ane-hittite
    title: Fragment with hunting and the offering formula (Telipinu myth, CTH 324.5)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Hittite"
    version: "Fragment CTH 324.5"
    read: ["CTH 324.5"]
    tags:
      - {motif: mugawar-invocation-with-offerings, refs: ["CTH 324.5 §7:21-26"], note: "nu-za e-et š[a-ne-ez-zi] 'eat the finest', nu-za ni-in-ga 'still your thirst', EGIR-pa ḫa-an-[da-aḫ-ḫu-ut] 'be set right again'"}
      - {motif: gods-ask-what-shall-we-do, refs: ["CTH 324.5 §1:4-§2:9"], note: "very broken: [cattle], sheep; pár-ḫu-wa-an da-iš 'began to chase'; a speech begins, {d}te-li-pí-nu-uš-ša 'and Telipinu'; tagged only as the gods' deliberation context, tentatively"}
