      - {motif: god-asked-to-turn-to-king-in-good, refs: ["CTH 334.4 §3:12-14"], note: "A-NA LUGAL MUNUS.LUGAL A-NA [DUMU].MEŠ LUGAL ... na-iš-ḫu-ut"}
      - {motif: analogic-spell-against-gods-anger, refs: ["CTH 334.4 §3:15-18"], note: "ka-a-ša [ga-l]a-ak-tar ki-it-ta ... ka-la-an-k[án-za e-eš-t]u 'here lies galaktar: let Hannahanna's soul and innards be soothed'; pár-ḫ[u-e-na]-aš ... [tal-l]i-ya-a[d]-du"}
      - {motif: fruit-holds-seed-wine-oil-analogy, refs: ["CTH 334.4 §4:19-31"], note: "[ka-a-š]a {GIŠ}PÈŠ ki-it-ta 'here lies a fig': as it is sweet (mi-li-id-du), so let her innards become sweet; li-i-ti 'liti-plant', [li-la]-a-re-eš-ke-ed-du 'be soothed'; [GEŠ]TIN ḪÁD.DU.A {GIŠ}SE20-ER-DUM 'raisin and olive': as (it) holds wine within, as the olive its oil, so hold the king, queen and princes in your heart and soul in good (aš-š[u-li]); {GIŠ}ša-ḫi-iš KASKAL-KA 'šaḫi (shall be) your road'"}
      - {motif: analogic-spell-against-gods-anger, refs: ["CTH 334.4 §5:32-§7:41"], note: "pa-aḫ-ḫur ... [wa-a]š-túl QA-TAM-MA ki-iš-ta-a-ru 'so let the fire quench the sin'; [TU]KU.TUKU-an tar-na 'let the wrath go!', [wa-a]š-túl tar-na 'let the sin go!'; {GIŠ}ŠEN-a[š] ... [a]r-ši-ya-zi: the water-pipe that does not flow back"}
      - {motif: hot-pebbles-quenched-analogy, refs: ["CTH 334.4 §8:42-45"], note: "[a]-a-an-du-uš {NA4}pa-aš-š[i]-lu-uš [ki-iš-ta]-nu-zi 'he quenches the hot pebbles'; ku-u-uš-kán [{NA4}pa-aš]-ši-lu-uš ki-iš-ta-nu-nu-un ... [QA-TAM-M]A ki-iš-ta-ru '(as) I have quenched these pebbles, so let (anger) be quenched'"}
      - {motif: cart-held-back-analogy, refs: ["CTH 334.4 §8:46-49"], note: "NA4 pár-na ... da-an-zi 'they take a stone to the house'; [ka]-a-aš {GIŠ}MAR.GÍD.DA-aš ... a-ra-ez-zi 'this cart ... is stopped'; [an-z]e-el ud-da-na-an-te-eš ... a-ra-an-du 'let our words stop (the anger)'"}
      - {motif: analogic-spell-against-gods-anger, refs: ["CTH 334.4 §9:50-§10:57"], note: "[l]u-uk-kán-du-uš ú-da-an-zi 'they bring burning (logs)'; [TUKU.TU]KU-an-za 'angered'; [{GIŠ}wa-a]r-ša-ma-aš ma-aḫ-ḫa-an ... [wa-ra-a-n]i; DINGIR.MAḪ-aš-ša ... ša-a-u-wa-ar ... [w]a-ra-a-nu"}
