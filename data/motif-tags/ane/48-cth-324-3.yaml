      - {motif: path-sprinkled-with-fine-oil, refs: ["CTH 324.7 §9:53-54"], note: "ŠA {d}te-li-pí-nu KASKAL-aš IŠ-TU Ì.DÙG.GA pa-ap-pár-aš-ša-an-za e-eš-du 'let Telipinu's road be sprinkled with fine oil'; nu-uš-ša-an i-ya-aḫ-ḫu-ut 'walk on it'"}
      - {motif: bed-of-sahi-and-happuriya, refs: ["CTH 324.7 §9:55-56"], note: "{GIŠ}ša-ḫi-iš {GIŠ}ḫa-ap-p[u-ri-ya-aš] ša-aš-za-ti-iš 'šaḫi and ḫappuriya are your bed'; nu-za-kán še-e-eš-ki 'sleep!'"}
      - {motif: analogic-spell-against-gods-anger, refs: ["CTH 324.7 §9:57-58"], note: "GI.DÙG.GA ma-aḫ-ḫa-an ḫa-an-da-an-za 'as the sweet reed is constant', so be loyal (ḫa-an-da-an-za e-eš) to the king, queen and land of Hatti"}
    hints:
      - "Evil sealed below so that it never comes up: compare the sealed pit of the abyss (Rev 20:1-3) and hell whose gates are closed over the damned (Q 90:20, 104:8 'it is closed in upon them'); the lead lid recalls the woman in the ephah shut with a lead cover (Zech 5:7-8)."
      - "What enters the dark earth does not come up: compare 'whoever goes down to Sheol does not come up' (Job 7:9) and Q 23:99-100 (a barrier, barzakh, until the day they are raised)."
