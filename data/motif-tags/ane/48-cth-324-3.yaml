      - {motif: anger-sealed-in-netherworld-cauldrons, refs: ["CTH 331.1 §9:36-§10:49"], note: "a-ru-ni-ma URUDU-aš pal-ḫa-eš ki-an-da-[ri] 'in the SEA lie COPPER palḫi-vessels', iš-tap-pu-ul-li-iš-mi-it A.BÁR-aš 'their lids of lead'; every ailment named again, each 'da-iš' 'she put (it in)': here it is illness, not anger, that is sealed away"}
      - {motif: mugawar-invocation-with-offerings, refs: ["CTH 331.1 §4:19-§6:30"], note: "fragmentary: ḪUR.SAG.ḪI.A KI.MIN 'the mountains likewise'; DINGIR.MEŠ-eš {GIŠ}BANŠUR.ḪI.A-aš ... da-i-e-er 'the gods set (food) on the tables'; {URUDU}ŠÚ.A 'the (copper) throne'"}
      - {motif: body-made-bright-as-before, refs: ["CTH 331.1 §11:50-59"], note: "A-NA DUMU.LÚ.U19.LU-ma tu-ek-ki-iš-ši [a]n-da-an la-lu-uk-ki-it 'on the man's body it became bright'; head, eyes, pupils, the white and dark of the eyes, forehead, brows, lashes KI.MIN; ka-ru-ú ma-a-an na-aš a-ap-pa QA-TAM-MA ki-ša-ru 'as he was before, so let him become again'"}
