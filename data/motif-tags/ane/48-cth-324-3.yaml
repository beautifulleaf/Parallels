      - {motif: analogic-spell-against-gods-anger, refs: ["CTH 325 §24:173-178"], note: "[{d}I]M-ta kar-pí-in tar-na ... ša-a-u-ar tar-[na] 'Storm god, let go the anger, ... let go the sullenness!'; {GIŠ}ŠEN-aš EGIR-pa pár-za Ú-UL ar-ši-ez-zi 'as (water) of the pipe does not flow backwards', so let anger not come back"}
