      - {motif: fruit-holds-seed-wine-oil-analogy, refs: ["CTH 332.3 §7:30-33", "CTH 332.3 §9:39-41"], note: "ka-a-ša {GIŠ}PÈŠ 'here is a fig'; le-e im-pa-na-et-t[a] 'do not be troubled any more'; {GIŠ}PÈŠ ma-aḫ-ḫa-an an-dur-za LI-IM NUMUN-an ḫar-zi 'as the fig holds a thousand seeds within', zi-ga ŠÀ-it a-aš-šu ud-da-a-na-za ḫar-ak 'so you hold the good within'; {GIŠ}GEŠTIN HÁD.DU.A 'the raisin' its wine, {GIŠ}SE20-ER-DUM 'the olive' Ì-ŠU 'its oil'; TI-tar in-na-ra-u-wa-tar MU.ḪI.A GÍD.DA tu-uš-ga-ra-at-ta-an 'life, vigour, long years, joy'"}
