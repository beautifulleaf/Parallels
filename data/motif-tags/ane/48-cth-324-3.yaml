      - {motif: table-set-right-and-left-nine-dishes, refs: ["CTH 334.2.2 §4:19-29"], note: "GÌR.ḪI.A-aš-ta kat-ta-an ŠA GA.KIN.AG ... te-eḫ-ḫu-un 'at your feet I put (a ...) of cheese'; {GIŠ}BANŠUR.ḪI.A-KA ú-nu-wa-an-du-uš ZAG-az ... GÙB-la-az 'your decked tables right and left'; 9-an e-e[t-ri] 'nine dishes'; {DUG}KA.GAG [gul-š]a-an-da-an 'an engraved beaker'; ta-wa-li-it ... GEŠTIN-it la-a-ḫu-un 'I poured with tawal, beer, wine'; e-ku-ma ša-né-ez-zi 'drink the finest'"}
      - {motif: terrible-one-become-gracious, refs: ["CTH 334.2.2 §4:28-29"]}
      - {motif: returned-god-cares-for-king, refs: ["CTH 334.2.2 §5:30-§7:41"], note: "pít-tu-[li-ya-] 'constriction'; ~13 lines lost; [DINGI]R.MAḪ-aš-za '[Hanna]hanna (cared for the king)', restored"}
      - {motif: eya-tree-with-hanging-fleece, refs: ["CTH 334.2.2 §7:42-49"], note: "[{d}ḫ]a-an-na-ḫa-an-ni-ma ... {G]IŠ?e?-[ya-] 'before Hannahanni the eya-tree'; ḫa-an-z[a-aš-ša] 'progeny'; [m]i-i-ya-[ta] 'thriving'; {GIŠ}GEŠTIN.ḪI.A-aš 'wine'; tar-ḫu-u-i-l[i-] 'valour'"}
      - {motif: lamb-fleece-holds-mild-message, refs: ["CTH 334.2.2 §8:50-55"], note: "ki-it-t[a] 'lies'; ḫa-lu-ga-aš 'message' (of the lamb, restored)"}
    hints:
      - "Tables set right and left and a beaker for the god: compare the table of showbread before YHWH (Ex 25:30) and the table sent down from heaven to Jesus' disciples (Q 5:112-115)."
      - "'Terrible one, become gracious': compare the paired divine attributes of severity and mercy (Q 15:49-50; 40:3 'severe in punishment, possessor of bounty') and Ex 34:6-7."
