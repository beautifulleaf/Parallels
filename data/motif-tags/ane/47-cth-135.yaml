      - {motif: forbidden-to-look-out-of-window, refs: ["CTH 321 §11:43-47"], note: "mā-wa gimra pāi[mi], zigga-waraš-ta GIŠluttan[za] arḫa lē autti; mā-waraš-ta arḫa-ma autti nu-wa-za DAM-KA DUMU.MEŠ-KA autti"}
      - {motif: mortal-looks-out-sees-wife-children, refs: ["CTH 321 §12:48-50"], note: "mān UD 20.KAM pait apāša GIŠlu[ttanza] arḫa šuwaiet; 'his wife and children' at §12:50 is mostly restored ([DAM]-SÚ)"}
      - {motif: mortal-lover-begs-to-go-home, refs: ["CTH 321 §13:51-53"], note: "apašša weškauwan dāiš: [a]ppa-wa-mu [ ... ] 'let me back'"}
      - {motif: forbidden-to-look-out-of-window, refs: ["CTH 321 §14:54-59"], note: "Inara's answer is broken: arḫa-wa ... ḫarannē[t?] 'with a fault(?)' and 'the meadow of the storm god'; Ḫupašiya's fate (perhaps killed) is lost"}
    hints:
      - "The look that is forbidden: Lot's wife (Gen 19:17, 26), the Quran's 'let none of you look back' (Q 11:81, 15:65); Orpheus. The single prohibition of Adam in the garden, Q 2:35, 7:19, 20:120-121, and the expulsion after it."
      - "Remembering wife and children in a divine dwelling: compare Odysseus with Calypso; in the Quran the believers are rejoined with their families in paradise, Q 13:23, 52:21."
