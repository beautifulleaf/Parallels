# Full read, chunk 47: the last Hittite treaties (CTH 135-146), the instructions for temple personnel (CTH 264),
# and the myths of Illuyanka (CTH 321), Telipinu and the daughter of the Sea (CTH 322), the vanished Sun god
# (CTH 323) and the vanishing Telipinu (CTH 324). Read from hethiter.net / TLHdig editions.
new_motifs:
  treaty-border-cities-listed: {label: "A treaty names the border towns assigned to one party or the other", cluster: treaty}
  oath-words-of-treaty-recited: {label: "The sworn parties are to speak the wording of the oath (the 'word of the oath') aloud", cluster: treaty}
  no-mercy-to-kin-in-battle: {label: "Treaty: on the battlefield the vassal must not spare an enemy even if he is his brother, son, friend or kinsman", cluster: treaty}
  hiding-captive-from-overlord-capital: {label: "A vassal who hides a captured enemy, helps him escape or lets him live instead of handing him over is to die", cluster: treaty}
  booty-belongs-to-whoever-captures: {label: "Treaty rule: cattle, sheep and goods taken by each army belong to that army", cluster: treaty}
  released-from-oath: {label: "Named classes of people are declared released (free) from the oath", cluster: treaty}
  enemy-messenger-not-admitted: {label: "The vassal must not send his messenger to the enemy nor admit the enemy's messenger into his presence or his city gate", cluster: treaty}
  greeting-gift-between-kings: {label: "A king's greeting-gift (šulmānu) is mentioned in the relations between rulers", cluster: diplomacy}
  primeval-gods-as-oath-witnesses: {label: "The 'primeval' (former) gods (Nara, Namšara, Minki, Alalu, Anu ...) are listed among the oath gods", cluster: treaty}
  vassal-must-speak-well-of-overlord: {label: "The vassal must speak good words of the overlord's land among the people and not belittle it before other lands", cluster: treaty}
  eyes-turned-to-the-mountains: {label: "Subjects or fugitives must not be allowed to 'turn their eyes to the mountains' (go over to the highland enemy)", cluster: treaty}
  sworn-party-confesses-sin: {label: "The overlord tells the sworn party that they have sinned against him before renewing the oath", cluster: treaty}
  enemy-gods-summoned-to-oath: {label: "The gods of the enemy people are summoned and set over against the overlord's gods for the oath", cluster: treaty}
  oathbreakers-gods-made-impure-eat-unclean-bread: {label: "Curse: on the day the oath is broken the oath-breakers' gods are to be impure and eat impure bread and drink impure wine and beer", cluster: treaty}
  individuals-sworn-one-by-one: {label: "An oath record lists leaders one by one, each with his men and his town, and what each swore", cluster: treaty}
  troops-counted-in-oath-list: {label: "The number of troops each sworn leader brings is recorded (e.g. 190, 215 men)", cluster: treaty}
  scribe-named-in-oath-record: {label: "A named scribe of the capital is recorded as present at or administering the oath", cluster: treaty}
  treaty-blessing-fertility-plenty: {label: "Treaty blessing: if the words are kept, eat well, let it flourish, let the flocks bear well, the gods give life", cluster: treaty}
  king-builds-temple-and-statue-of-god: {label: "The king boasts that he built a god's temple in silver and gold and made the statue of the storm god", cluster: kingship}
  king-crosses-the-sea: {label: "The king boasts that he crossed the sea (on campaign)", cluster: kingship}
  treaty-tablet-before-deity-read-yearly: {label: "Curse on whoever removes the treaty tablet from before the deity, puts it in a dark place, or fails to read it out year by year", cluster: treaty}
  elders-of-towns-summoned-and-sworn: {label: "The overlord summons the elders and heads of towns to a place and puts them under oath", cluster: treaty}
  silver-rhyton-sent-for-god: {label: "The king sends a silver rhyton to a local god, from which the god is to be given drink regularly", cluster: cult}
  obey-kings-future-words: {label: "The sworn must always listen to whatever the king will say in future", cluster: treaty}
  vassal-cedes-cities: {label: "The vassal swears to give up the overlord's towns he holds", cluster: treaty}
  oathbreaker-marries-enemys-daughter: {label: "The faithless vassal takes the enemy's daughter as his wife", cluster: treaty}
  vassal-incites-subjects-to-flee: {label: "The faithless vassal calls the overlord's subjects to flee to him", cluster: treaty}
  harbourer-denies-seeing-fugitives: {label: "Asked to return fugitives, the harbourer hides them and claims he has seen no one and no one has come", cluster: treaty}
  rebel-am-i-not-a-man: {label: "A rebel refuses to hand over towns, saying the former holder was a mere charioteer: 'Am I not also a man?'", cluster: treaty}
  rebel-invokes-fathers-name: {label: "A rebel calls out his father's name (claims his father's standing)", cluster: treaty}
  not-even-a-thread-withheld: {label: "Everything must be handed over: not even (as much as) a woollen thread may be held back", cluster: treaty}
  rebel-handed-over-with-family-and-goods: {label: "The rebel must be handed over together with his wife, sons, grandsons, servants, cattle, sheep and all property", cluster: treaty}
  vassal-breaks-oath-repeatedly: {label: "The vassal is said to have sinned again and again and to have utterly broken the sworn word", cluster: treaty}
  bathe-hands-in-blood: {label: "The loyal subjects must at once 'bathe their hands in blood' against the rebels before the king's army arrives", cluster: war}
  king-kills-laggard-first: {label: "The king threatens that whoever does not fight the rebels he will kill first, before attacking the rebel city", cluster: war}
  protect-king-queen-and-descendants: {label: "Subjects must protect the king, the queen, the king's sons, grandsons and descendants", cluster: treaty}
  report-truthfully-neither-exaggerate-nor-minimise: {label: "Reports must be truthful: do not magnify a small matter nor make light of a weighty one", cluster: treaty}
  soldiers-must-not-violate-women-or-plunder: {label: "On campaign no one may violate a man's wife or daughter or steal people, cattle, horses or metals", cluster: war}
  temple-offerings-diverted-to-households: {label: "Temple staff take the gods' offerings home and let their wives, children and servants eat them, or give them to a friend or stranger", cluster: cult}
  god-destroys-offender-with-household: {label: "The angered god seeks out the offender together with his wife, children, descendants, slaves, cattle, sheep and crops and destroys him utterly", cluster: theodicy}
  human-master-servant-analogy-for-gods: {label: "The mind of gods and men is said to be no different: the god is to his temple servants as a master to his slave", cluster: theodicy}
  servant-serves-master-washed-and-clean: {label: "The servant stands before his master washed and in clean clothes and gives him food and drink, so the master is at ease", cluster: cult}
  angered-master-mutilates-servant: {label: "A master angered by his servant kills him or mutilates his nose, eyes and ears, or punishes his wife, children and kin", cluster: law}
  offender-punished-with-whole-family: {label: "An offender does not die alone: his whole family dies with him (no one is left)", cluster: law}
  be-very-fearful-of-the-gods: {label: "Refrain: be very fearful of the word / mind of the gods", cluster: cult}
  catalogue-of-temple-festivals: {label: "A list of the regular festivals (monthly, yearly, spring, autumn, of the stag, of the rhyton, of the priests, of the old men, of the mother-goddess priestesses ...)", cluster: cult}
  offering-split-in-half-death-penalty: {label: "Whoever divides the god's offering in half (keeping part) shall die; there is no turning back for him", cluster: cult}
  curse-on-thief-of-gods-bread: {label: "Before the god the staff declare: whoever took from your bread and libation vessel, may the god pursue him and seize his house", cluster: cult}
  lean-animal-substituted-for-fattened: {label: "Temple staff or herdsmen keep the fattened ox or sheep meant for the god, substitute a lean one, eat, sell or trade the fat one", cluster: cult}
  silent-god-thought-to-do-nothing: {label: "Wrongdoers excuse themselves: because he is a god he says nothing and does nothing to us", cluster: theodicy}
  god-slow-to-seize-never-lets-go: {label: "The god's will is strong: it does not hasten to seize, but once it seizes it never lets go", cluster: theodicy}
  temple-silver-gold-belongs-to-god: {label: "The silver, gold, garments and bronze vessels in the temple are the god's; the temple servant may own none of it nor give it to his wife and children", cluster: cult}
  royal-gift-to-priest-recorded: {label: "A gift from the palace to a temple servant must be recorded: the king gave it, its weight, at which festival, and witnesses", cluster: cult}
  gift-sold-only-publicly-on-record: {label: "A temple servant may sell a royal gift only openly before the lords of Ḫatti, with the price recorded on a wooden tablet", cluster: cult}
  embezzlement-of-temple-goods-capital: {label: "Who sells the gods' goods for himself, and the one who knows and hides it, both are put to death", cluster: cult}
  festival-shifted-to-wrong-season-forbidden: {label: "Temple staff must not hold the spring festival in autumn or the autumn festival in spring", cluster: cult}
  excuse-harvest-marriage-journey-delays-gods: {label: "The festival-giver excuses himself: the harvest, a marriage (bride-price) or a journey is before me; wait until it is done", cluster: cult}
  do-gods-will-not-mans: {label: "Do not act by a man's wish against the gods' will; the gods will later seek it out against you and your family", cluster: cult}
  do-not-buy-or-sell-death: {label: "Do not 'buy death' or 'sell death' (bring capital guilt on yourselves)", cluster: cult}
  temple-staff-sleep-in-temple: {label: "All priests and temple servants must spend the night in the temple, not at home", cluster: cult}
  night-patrols-guard-temple: {label: "Night patrols go round the temple all night, the watch outside and the servants inside; none may sleep, a high priest presides", cluster: cult}
  priest-sleeping-with-wife-at-home-capital: {label: "A priest found sleeping at home with his wife instead of in the temple incurs a capital sin", cluster: cult}
  no-excuse-of-other-duty-for-watch: {label: "No one may say 'I guard the temple, I will not go to the watch there' when the city's watch is due", cluster: cult}
  humiliation-naked-water-carrying: {label: "A guilty temple servant not put to death is shamed: naked, without clothes, he carries water three times from the king's pond to his god's temple", cluster: law}
  quarrel-in-temple-offender-redoes-festival: {label: "Whoever starts a quarrel in the temple and disturbs the festival must provide the whole festival again with cattle, sheep, bread and beer", cluster: cult}
  temple-hearth-fire-guarded: {label: "The fire in the temple hearth must be carefully extinguished at night; a temple fire destroys the temple and the king's goods", cluster: cult}
  temple-kitchen-staff-bathed-hair-nails-cut: {label: "Those who prepare the gods' food must be bathed, wear clean clothes and have hair and nails cut", cluster: purity}
  pig-and-dog-barred-from-sacred-threshold: {label: "Pig and dog must not cross the threshold of the temple kitchen or bakery", cluster: purity}
  polluted-food-to-god-repaid-with-dung-urine: {label: "If a pig or dog touched the vessels and the cook still serves the food, the gods will give him dung and urine to eat and drink", cluster: purity}
  bathe-after-intercourse-before-serving-god: {label: "Whoever has slept with a woman must bathe before dawn before he comes to the gods' meal; one who comes unbathed dies", cluster: purity}
  confess-impurity-to-superior: {label: "One who has been with a woman must tell his superior; if he dares not, he tells a colleague", cluster: purity}
  first-fruits-before-humans-eat: {label: "First fruits (the first bread, the young animals) must be brought to the gods at once, before any human eats of them", cluster: cult}
  gods-fine-ox-and-ten-sheep: {label: "Gods punish the negligent with a fine of one ox and ten sheep, and treat them as the gods' lords do", cluster: cult}
  temple-field-swapped-with-own-field: {label: "The god's ploughmen claim the god's field as theirs and theirs as the god's, or sow more for themselves", cluster: cult}
  grain-confiscated-to-gods-storehouse: {label: "Defrauders' grain is all taken and poured into the gods' storehouses", cluster: cult}
  false-claim-sacred-ox-died: {label: "A ploughman who sold or ate the god's ox claims it died of leanness, broke its leg, ran off or was gored by a bull", cluster: cult}
  ordeal-before-god-pure-or-impure: {label: "In a disputed case the accused goes before the god: if pure, his protective god (is with him); if impure, it is a capital sin", cluster: law}
  ordeal-by-drinking-from-gods-rhyton: {label: "Accused staff drink from the god's rhyton of the 'soul' declaring their innocence, calling on the god to pursue them with their wives and children if they lie", cluster: law}
  neglect-of-watch-death-penalty: {label: "A temple servant at whose watch-post an offence (waštul) happens is to die, without pardon", cluster: cult}
  myth-recited-at-new-year-festival: {label: "A myth is told as the 'word' (text) of a seasonal festival (the purulli) that is celebrated so the land may grow and prosper", cluster: cult}
  storm-god-first-defeated-by-serpent: {label: "In the first combat the serpent (dragon) defeats the storm god", cluster: combat}
  defeated-god-calls-gods-for-help: {label: "The defeated god calls on all the gods to come to his aid", cluster: combat}
  goddess-prepares-feast-to-lure-monster: {label: "A goddess prepares a feast with vessels full of wine and beer and invites the monster up from its hole to eat and drink", cluster: combat}
  mortal-helper-demands-to-sleep-with-goddess: {label: "A mortal agrees to help a goddess on condition that he may sleep with her, and does", cluster: combat}
  monster-gorged-cannot-return-to-hole: {label: "The monster and its brood drink every vessel dry and, gorged, cannot go back down into their hole", cluster: combat}
  monster-bound-with-rope-then-slain: {label: "The gorged monster is tied with a rope by the mortal helper and then killed by the storm god", cluster: combat}
  storm-god-slays-serpent: {label: "The storm god kills the serpent (dragon) Illuyanka", cluster: combat}
  goddess-builds-house-on-rock-for-mortal: {label: "The goddess builds a house on a rock and settles her mortal lover in it", cluster: combat}
  forbidden-to-look-out-of-window: {label: "A mortal is forbidden to look out of the window while the goddess is away, lest he see his wife and children", cluster: taboo}
  mortal-looks-out-sees-wife-children: {label: "After twenty days the mortal looks out of the window and sees his wife and children", cluster: taboo}
  mortal-lover-begs-to-go-home: {label: "The goddess's mortal lover, having seen his family, laments and begs to be let go home", cluster: taboo}
  goddess-hands-house-to-king: {label: "The goddess gives her house and the 'river of the flood' into the king's hand (an aetiology of the king's cult)", cluster: kingship}
  rain-asked-from-mountain-god: {label: "When rain falls in Nerik the herald brings thick bread; rain is requested from the mountain god Zaliyanu", cluster: cult}
  serpent-takes-storm-gods-heart-and-eyes: {label: "The victorious serpent takes the storm god's heart and eyes", cluster: combat}
  god-marries-poor-mans-daughter: {label: "The disabled god takes the daughter of a poor man as wife and begets a son", cluster: combat}
  son-marries-monsters-daughter: {label: "The god's son marries the daughter of his father's monstrous enemy", cluster: combat}
  son-asks-in-laws-for-heart-and-eyes: {label: "The son, as bridegroom, asks his in-laws for the heart and then the eyes and brings them to his father, who is restored", cluster: combat}
  son-sides-with-in-laws-and-dies: {label: "The son, bound to the house of his in-laws, cries to his father not to spare him, and the storm god kills the serpent and his own son together", cluster: combat}
  last-gods-made-first: {label: "The first gods are made the last and the last the first (a reversal of divine rank)", cluster: cult}
  goddess-greater-than-storm-god: {label: "A local goddess (Zašḫapuna) is declared greater than the storm god", cluster: cult}
  basalt-throne-over-spring: {label: "A seat of basalt stands over a spring; the priest chosen by lot to hold the god sits on it", cluster: cult}
  king-grants-land-to-cult: {label: "The king gives back a field, garden, house, threshing floor and servants' houses to a cult, recorded on a tablet", cluster: cult}
  sea-angry-hides-sun: {label: "The angry Sea carries the sun god down and hides him, and the land turns bad and dark", cluster: myth}
  son-sent-to-bring-back-sun: {label: "The storm god sends his son Telipinu to the sea to bring back the sun god", cluster: myth}
  sea-gives-daughter-to-god: {label: "The frightened Sea gives the sun back and his own daughter to the god", cluster: myth}
  sea-demands-bride-price: {label: "The Sea sends to the storm god demanding a bride-price for the daughter his son has taken", cluster: myth}
  bride-price-a-thousand-cattle-and-sheep: {label: "The bride-price is paid 'all by the thousand': a thousand cattle and a thousand sheep", cluster: myth}
  angry-god-departs-blight-falls: {label: "A god becomes angry and departs; mist seizes the windows, smoke the house, the hearth logs and the gods on the altar are stifled", cluster: myth}
  vanished-god-hides-in-moor-under-plants: {label: "The angry god goes off and hides himself in the moor, and a plant grows over him", cluster: myth}
  fertility-ceases-in-gods-absence: {label: "With the god gone, grain does not grow, cattle, sheep and people do not conceive and the pregnant do not give birth", cluster: myth}
  animals-reject-their-young: {label: "In the god's absence the sheep rejects its lamb and the cow its calf (and on his return they accept them again)", cluster: myth}
  mountains-springs-dry-famine: {label: "Mountains, trees, pastures and springs dry up, and famine comes upon the land so that men and gods die of hunger", cluster: myth}
  gods-feast-without-satiety: {label: "The gods are called to a feast but eat and drink without being satisfied", cluster: myth}
  search-for-vanished-god-fails: {label: "The great and small gods search for the vanished god; the swift eagle searches mountains, valleys and waters and does not find him", cluster: myth}
  storm-god-cannot-open-gate-sits-wrapped: {label: "The storm god cannot open the gate of his son's city, breaks his hammer and wrapped (in his garment) sits down", cluster: myth}
  mother-goddess-sends-bee: {label: "The mother goddess sends the bee to find the vanished god; the storm god scorns it as tiny with little wings", cluster: myth}
  bee-to-sting-and-wax-to-cleanse: {label: "The bee is told to sting the sleeping god in hands and feet to make him rise, wipe him with wax, purify him and bring him back", cluster: myth}
  wakened-god-rages-destroys: {label: "The god, roused, rages: he destroys rivers' banks, towns, people, cattle and sheep", cluster: myth}
  analogic-offerings-to-soothe-god: {label: "Substances are set out one by one with 'as this is sweet / pure / holds its oil, so may your soul become sweet / pure / hold the king in good'", cluster: ritual}
  oil-sprinkled-path-for-gods-return: {label: "Fine oil is sprinkled on the god's paths: 'walk on the oiled ways'", cluster: ritual}
  beer-makes-angry-man-forget: {label: "As beer makes an angry or anxious man drunk so his anger and care vanish, may it make the god drunk and his anger vanish", cluster: ritual}
  healing-goddess-takes-away-anger: {label: "A magic goddess (Kamrušepa) halts the god's fury and takes from his body his anger, wrath, sin and sullenness", cluster: ritual}
  anger-burned-dried-quenched-by-analogy: {label: "The god's anger, wrath, sin and sullenness are to burn like brushwood, dry like malt, go out like fire, not flow back like water in a pipe", cluster: ritual}
  gods-assemble-under-hawthorn: {label: "The gods sit in assembly under the hawthorn tree", cluster: myth}
  anger-sent-down-road-of-netherworld: {label: "The god's anger is to leave house, window, gate and royal road, not go to field, garden or wood, but go the road of the sun goddess of the earth", cluster: ritual}
  anger-sealed-in-bronze-vessels-in-netherworld: {label: "In the dark earth stand bronze (or iron) vessels with lids of lead and fastenings of iron: what goes in never comes out and perishes there, and the god's anger is shut in them", cluster: underworld}
  god-returns-order-restored: {label: "The god returns to his house, the mist and smoke leave, hearth, fold and stall are freed, mother, ewe and cow accept their young", cluster: myth}
  god-gives-king-life-strength-future: {label: "The returned god cares for king and queen and provides them with life, vigour and long future", cluster: kingship}
  fleece-hung-on-tree-holds-blessings: {label: "Before the god stands an eya-tree with a sheep's fleece hung on it, in which lie fat, grain, wine, cattle, sheep, long years, progeny and plenty", cluster: ritual}
  sea-imprisons-sun-in-sealed-jar: {label: "The sun god is shut in a jar sealed with wax and capped with a copper lid", cluster: myth}
  frost-paralyses-land-and-gods: {label: "Frost (ḫaḫḫima) paralyses the whole land, dries the waters and seizes plants, cattle, sheep, dogs, pigs, and the gods sent to find the sun", cluster: myth}
  god-as-plougher-and-irrigator: {label: "The storm god praises his son as one who breaks the soil, ploughs, channels water and clears the grain of stones", cluster: myth}
  can-they-revive-the-dead: {label: "The storm god challenges: when a man or an ox is killed, do they make him live again? What wonder do your sons do?", cluster: myth}
  storm-gods-hands-stuck-to-cup: {label: "The paralysed storm god's hands stick to his cup and his feet to the ground; he begs Frost not to seize his eyes", cluster: myth}
  offering-graded-rich-nine-poor-one: {label: "The god's allotment: one to whom the god does good gives nine sheep, a poor man gives one", cluster: cult}
  bronze-models-of-jar-door-windows-in-ritual: {label: "The ritual sets out bronze models of the jar and its lid, a door, two windows, a peg, a spade and a hammer for the vanished god", cluster: ritual}
  three-day-feeding-of-returned-god: {label: "For three days the 'lord of the god' burns choice offerings, recites spells and breaks bread, pours libations and lays meat before the gods", cluster: ritual}
units:
  - id: ane-cth-135-1-preamble-hostages-cities
    tradition: ane-hittite
    title: Treaty with Lab'u and Tunip, opening (CTH 135 §1)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    read: ["CTH 135 §1"]
    tags:
      - {motif: hostages-taken, refs: ["CTH 135 §1:3"], note: "ana LÚ.MEŠ liṭūti DUMU.MEŠ: 'the sons ... for hostageship'; context broken"}
      - {motif: oath-words-of-treaty-recited, refs: ["CTH 135 §1:13", "CTH 135 §1:27"], note: "ana māmīti liqbû 'let them speak for the oath'; [a]wât māmīti 'the word of the oath'"}
      - {motif: treaty-border-cities-listed, refs: ["CTH 135 §1:14-16", "CTH 135 §1:31-32"], note: "URU.DIDLI.ḪI.A ša ZAG.ḪI.A-ya 'my border towns'; Iripa, Ḫašašar, Širina, IZ-ḫanikka"}
    hints:
      - "The tablet is Akkadian (the diplomatic language), though listed among the Hittite texts. Compare the treaty frame in Q 9:1-4 (treaties with the polytheists honoured to their term) and Q 8:56."
      - "Hostage-taking: compare 2 Kgs 14:14."
  - id: ane-cth-135-2-military-clauses
    tradition: ane-hittite
    title: Treaty with Tunip, war and booty (CTH 135 §2)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    read: ["CTH 135 §2"]
    tags:
      - {motif: no-mercy-to-kin-in-battle, refs: ["CTH 135 §2:46"], note: "[ašar] taḫazzi ŠEŠ-am DUMU-am LÚtappâ ... [ina mūti ...]-teṭerašunūtim: on the battlefield brother, son, companion, kinsman are [not] to be spared death; the negation is restored"}
      - {motif: hiding-captive-from-overlord-capital, refs: ["CTH 135 §2:47-58"], note: "šumma LÚṣabta iṣabbassuma upazzar...: if he hides a captive, or helps the enemy, 'makes him take cunning' (nēmekutta ušaḫḫazzu) and spares him from death, that man shall die"}
      - {motif: treaty-fight-kings-enemy, refs: ["CTH 135 §2:59-64"], note: "if the gods go before My Majesty, I will destroy (adâk) the land of the enemy; Lab'u is not to go out only to plunder"}
      - {motif: booty-belongs-to-whoever-captures, refs: ["CTH 135 §2:65-68", "CTH 135 §2:73-76", "CTH 135 §2:88-91"], note: "mīnummê ḫubta GUD UDU ... ikaššadu: whatever booty the troops of Ḫatti seize they take; likewise the troops of Tunip"}
      - {motif: treaty-vassal-must-aid-overlord-at-once, refs: ["CTH 135 §2:69-70", "CTH 135 §2:78-80"], note: "if a city of My Majesty, or the great men of Ḫatti, rebel, Lab'u with his ḫurādu-troops must come; the purpose clause is restored"}
      - {motif: released-from-oath, refs: ["CTH 135 §2:106-107"], note: "LÚ.MEŠ mariya[nnu] ... ḫupšu ... puš-ra-a 'released'; '[of the oa]th' is restored"}
    hints:
      - "No mercy to kin in battle: compare Q 58:22 (no love for God's enemies 'even if they were their fathers, sons, brothers or kindred') and Q 9:23-24; Deut 13:7-10."
      - "Booty: contrast Q 8:1 and 8:41 (spoils belong to God and the Messenger, a fifth set aside) with the each-army-keeps-its-own rule here."
  - id: ane-cth-135-3-messengers-fugitives-evil-word
    tradition: ane-hittite
    title: Treaty with Tunip, messengers, fugitives and evil words (CTH 135 §3)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    read: ["CTH 135 §3"]
    tags:
