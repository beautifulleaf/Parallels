      - {motif: silent-god-thought-to-do-nothing, refs: ["CTH 264 W15:Vs._II_18'-Vs._II_19'"], note: "DINGIR-LIM-waraš kuit nu-wa UL kuitki [memai nu-wa-nnaš] UL kuitki iyazi 'since he is a god, he says nothing and does nothing to us'"}
      - {motif: god-slow-to-seize-never-lets-go, refs: ["CTH 264 W15:Vs._II_20'-Vs._II_24'"], note: "'look at a man who removes his soul's portion (zuwan) from (the god's) eyes, how he fares afterwards'; DINGIR.MEŠ-aš-ma Z[I-anza daššu]š nu eppuwanzi UL nuntarnuzi, epzi-ma kuedani mēḫuni nu namma arḫa UL tarnāi"}
