  - id: ane-cth-321-2-inaras-feast-and-the-serpent
    tradition: ane-hittite
    title: "Illuyanka, first version: the storm god's defeat and Inara's trick (CTH 321 §2-10)"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Hittite"
    read: ["CTH 321 §2:8-§10:40"]
    tags:
      - {motif: storm-god-first-defeated-by-serpent, refs: ["CTH 321 §2:8-9"], note: "dIM-aš MUŠilluyankašša INA URU Kiškilušša argatiēr; MUŠilluyankaš dIM-an [tar]uḫta"}
      - {motif: defeated-god-calls-gods-for-help, refs: ["CTH 321 §3:10-11"], note: "DINGIR.MEŠ-naš ḫūman[duš] mūgaet: anda-ma-pa tiyattēn"}
      - {motif: goddess-prepares-feast-to-lure-monster, refs: ["CTH 321 §3:12-§4:15", "CTH 321 §8:28-30"], note: "Inara: DUGpalḫi of wine, marnuwant- and walḫi-beer; MUŠilluyankan ḫanteššanaz šarā kallišta: 'I am holding a feast, come to eat and drink!'"}
      - {motif: mortal-helper-demands-to-sleep-with-goddess, refs: ["CTH 321 §5:16-§7:24"], note: "mḫupašiyan LÚ.U19.LU; mā-wa kattiti šešmi nu-wa uwami kardiaš-taš iyami; naš katti-ši šešta"}
      - {motif: monster-gorged-cannot-return-to-hole, refs: ["CTH 321 §9:31-§10:35"], note: "QADU [ ... ] šarā uēr (the serpent came up with [its children], restored); DUGpalḫan ḫūmandan ek[uer]; namma ḫatteššnaš kattanda nūman paanzi"}
      - {motif: monster-bound-with-rope-then-slain, refs: ["CTH 321 §8:25-26", "CTH 321 §10:36-37"], note: "Inara hid (munnaet, restored) Ḫupašiya; MUŠilluyankan išḫimanta kalēliet"}
      - {motif: storm-god-slays-serpent, refs: ["CTH 321 §10:38-40"], note: "dIM-aš uet nu-kan MUŠillu[yankan] kuenta, DINGIR.MEŠ-ša katti-šši ešer"}
    hints:
      - "The storm god and the sea serpent: Isa 27:1 (Leviathan the fleeing, twisting serpent slain), Ps 74:13-14 (the heads of Leviathan crushed), Job 41 (Leviathan drawn out with a hook and cord, 41:1-2), Job 26:12-13, Isa 51:9. The Quran has no divine combat: the great sea creatures are simply created (Q 16:14), and the serpent is Moses' staff, Q 20:20, 7:117."
      - "Defeat by feasting and drunkenness: Jael and Sisera (Judg 4:19-21, milk then the tent-peg) and Judith 12-13. Compare the unwary feast in Q 5:90-91 (wine as Satan's tool)."
      - "A goddess who takes a mortal to bed for a task: Gilgamesh and Ištar (Gilg SB VI); the angels Hārūt and Mārūt in Q 2:102."
  - id: ane-cth-321-3-hupasiya-and-the-window
