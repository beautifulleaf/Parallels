      - {motif: just-king-does-justice-and-righteousness, refs: ["ETCSL 2.5.4.a Seg.C:4", "ETCSL 2.5.4.a Seg.C:9-10"], note: "{d}iš-me-{d}da-gan dumu {d}en-lil2-la2 ... ki-en-gi ki-uri-a mi-ni-in-ŋar"}
