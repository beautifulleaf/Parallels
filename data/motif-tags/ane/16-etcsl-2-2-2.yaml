      - {motif: sacred-marriage-king-and-goddess, refs: ["ETCSL 4.03.1 Seg.A:2", "ETCSL 4.03.1 Seg.A:4"], note: "Divine couple: e2-gi4-a {d}am-an-ki: bride of Enki; nitalam-zu en gal {d}nu-dim2-mud: your spouse the great lord Nudimmud"}
      - {motif: wise-god-as-sage-carpenter-and-purifier, refs: ["ETCSL 4.03.1 Seg.A:5-8"], note: "en igi-ŋal2-la an lugal šum2-mu ad gi4-gi4 gal-zu: the wise lord who gives An kingship(?), wise counsellor, knower of all"}
      - {motif: goddess-mother-of-great-gods, refs: ["ETCSL 4.03.1 Seg.D:5"], note: "diŋir gal-gal-e-ne u3-tud-bi he2-a diŋir-bi he2-em: may you be the one who bore the great gods, their deity"}
      - {motif: closing-praise-of-deity-za3-mi2, refs: ["ETCSL 4.03.1 Seg.D:3"], note: "saŋ il2 nam-nin-a za3-mi2-zu"}
      - {motif: royal-hymn-genres-catalogue, refs: ["ETCSL 4.03.1 Seg.D:6"], note: "šir3-šag4-hul2-la {d}dam-gal-nun-na-kam: a song of heart's joy for Damgalnuna"}
