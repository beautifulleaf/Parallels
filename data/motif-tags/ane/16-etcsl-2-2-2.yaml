      - "Note: the data has a stray line numbered 40 without a section between Seg.C and Seg.D ('{ŋiš}gigir mah', great chariot)."
  # ---------------- ETCSL 2.5.2.1: Šu-ilīšu A ----------------
  - id: ane-etcsl-2-5-2-1-nergal-adab-shu-ilishu
    tradition: ane-sumerian
    title: "Adab to Nergal: storm-warrior, dragon drinking blood, junior Enlil of the netherworld; Nergal plucks the king's enemy like a swallow (Šu-ilīšu A)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Sumerian"
    read: ["ETCSL 2.5.2.1"]
    tags:
      - {motif: divine-warrior, refs: ["ETCSL 2.5.2.1 barsud.A:1-4", "ETCSL 2.5.2.1 barsud.C:13-15"], note: "en ud huš du7-ru kur2-kur2 suh3-e: lord, raging storm that confounds the foreign lands; šul zig3-ga-ni mir a-ma-ru: his rising a wind and flood"}
      - {motif: divine-warrior-as-deluge, refs: ["ETCSL 2.5.2.1 barsud.C:15"], note: "mir a-ma-ru kur-kur un-tu11-be2"}
      - {motif: monster-described-mouth-of-dragon-face-of-lion, refs: ["ETCSL 2.5.2.1 barsud.C:16"], note: "{d}nergal ušumgal u3-mun dul4-lu uš2 zi-ŋal2-la na8-na8: dragon covered with gore, drinking the blood of living creatures"}
      - {motif: god-of-netherworld-as-junior-enlil, refs: ["ETCSL 2.5.2.1 cagbatuku.D:18-23"], note: "{d}nergal e2 da-ri2 iri11-gal {d}en-lil2 ban3-da-me-en, nam tar-re di kud ka-aš bar-re-da za-a-da ša-mu-e-da-ŋal2: Nergal, you are the junior Enlil of the eternal house, the netherworld; deciding fates and judging are yours"}
      - {motif: sun-god-judges-dead-in-underworld, refs: ["ETCSL 2.5.2.1 barsud.E:25-27"], note: "Interpretive: ki ud šu2-a {d}utu ma-ra-an-e3 ... ki ud e3: at the place of sunset Utu comes out to you; you are lord there and at the place of sunrise"}
      - {motif: warrior-son-soothes-fathers-angry-heart, refs: ["ETCSL 2.5.2.1 sa–jara.H:42", "ETCSL 2.5.2.1 sa–jara.H:55"], note: "{d}nergal šag4 mir {d}en-lil2-la2 a sed su3: Nergal sprinkles cool water on Enlil's angry heart; šag4 a-a-na mu-un-sed"}
      - {motif: god-piles-up-skulls, refs: ["ETCSL 2.5.2.1 sa–jara.H:50"], note: "šeg12-bi in-dal-gin7 an-na um-mi-gu7: you make its brickwork vanish into the sky like chaff"}
      - {motif: blood-poured-like-water, refs: ["ETCSL 2.5.2.1 sa–jara.H:52"], note: "u3-mun-bi šeŋ14-gin7 sur3-sur3-ra i-ni-in-de2: its blood poured like rain into the ditches"}
      - {motif: net-from-which-none-escapes, refs: ["ETCSL 2.5.2.1 sa–jara.H:46"], note: "{sa}šu2-uš-gal hul-du šu šu2-ur gu2-erim2-ŋal2-la: great battle-net over the evil and hostile"}
      - {motif: just-king-does-justice-and-righteousness, refs: ["ETCSL 2.5.2.1 barsud.F:30"], note: "sipad gen6-ne šul zid {d}utu-gin7 di si sa2 kud-kud: steadfast shepherd who judges straight like Utu"}
      - {motif: enemies-like-tumbleweed-and-chaff, refs: ["ETCSL 2.5.2.1 barsud.F:32", "ETCSL 2.5.2.1 sa–jara.H:60"], note: "hul-du-ni zar-re-eš sal-mu-na-ab: lay his wicked out like sheaves; sim{mušen}-gin7 za-e ur4-ur4-u4-mu-na-ab: pluck them like swallows"}
      - {motif: prayer-for-kings-long-life, refs: ["ETCSL 2.5.2.1 barsud.F:37", "ETCSL 2.5.2.1 uru.I:66"], note: "nam-til3-la-ni eš3 e2-meš3-lam-ma ul-še3 ša-mu-ra-ab-mu2-mu2: may his life flourish in Emeslam forever"}
      - {motif: royal-hymn-genres-catalogue, refs: ["ETCSL 2.5.2.1 uru.I:67-68"], note: "barsud, šagbatuku, sa-gida, sa-ĝara and uru sections; subscript a-da-ab {d}nergal-ka-am3"}
    hints:
      - "Compare Ps 139:8 (if I make my bed in Sheol, you are there) and Deut 32:41-42 (arrows drunk with blood)."
      - "Compare Ps 1:4; 83:14 (like chaff before the wind) and Ps 18:9-16."
