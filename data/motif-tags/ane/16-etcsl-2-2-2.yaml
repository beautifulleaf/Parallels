      - {motif: gods-give-rain-and-abundance-through-king, refs: ["ETCSL 2.6.6.5 10", "ETCSL 2.6.6.5 25-26"], note: "za-pa-aŋ2-bi he2-ŋal2-am3: his breath is abundance; en nam-he2 giri17-zal lu-lu-lu, zi kalam-ma šum2-mu: lord multiplying plenty, giving life to the land"}
      - {motif: king-as-protective-shade, refs: ["ETCSL 2.6.6.5 28"], note: "Here of the god: an-dul3 larsam{ki}-ma: shelter (shade) of Larsa"}
      - {motif: personal-god-holds-kings-hand, refs: ["ETCSL 2.6.6.5 29-30", "ETCSL 2.6.6.5 44"], note: "a2-tah {d}suen-i-din-na-am ki me3-ka ... erin2 zag-ga-na gub-bu: Sîn-iddinam's helper on the battlefield, standing at his army's side; {d}iškur diŋir-ra-ni: his (personal) god"}
      - {motif: wisdom-given-to-king-by-god, refs: ["ETCSL 2.6.6.5 41-42"], note: "ŋeštug2 daŋal igi-ŋal2 dirig šum2-ma {d}nu-dim2-mud-ke4: given broad wisdom by Nudimmud (Enki)"}
      - {motif: king-titulary-of-four-cities, refs: ["ETCSL 2.6.6.5 34-40"], note: "nun sun5-na ni2-tuku {d}en-lil2-la2 ... u2-a urim5{ki}-ma, lugal larsam{ki}-ma, lugal ki-en-gi ki-uri-ke4: humble prince, provisioner of Urim, king of Larsa, of Sumer and Akkad"}
      - {motif: king-restores-neglected-rites, refs: ["ETCSL 2.6.6.5 46-50"], note: "ŋiš-hur eridug{ki}-ga si sa2-sa2 ... gal-an-zu me libir ki-bi bi2-in-gi4-a: who sets right the plans of Eridug, perfects the gods' offerings, restored the ancient divine powers to their place"}
      - {motif: king-makes-throne-and-bull-statues-for-storm-god, refs: ["ETCSL 2.6.6.5 54-58", "ETCSL 2.6.6.5 68-70", "ETCSL 2.6.6.5 75-78"], note: "{ŋiš}gu-za mah ... diŋir-ra-ni-ir sig10-ga ... kug luh-ha: a great throne of refined silver for his god; ud-bi-a {d}iškur ... {ŋiš}gu-za ka silim-ma-ka-na gal-bi dur2 mi-ni-in-ŋar: Iškur sat on it; 2 am gal ki aš-te, erim2 lugal-la du7-de3, zid-da gab2-bu-bi: two great wild bulls at the throne to gore the king's enemy, right and left"}
      - {motif: monster-guardians-at-temple-gates, refs: ["ETCSL 2.6.6.5 75-77"], note: "the two bull figures flank the throne (not a gate)"}
      - {motif: prayer-for-kings-long-life, refs: ["ETCSL 2.6.6.5 43"], note: "bal dug3 til3 ud su3-ra2 he2-ŋal2 niŋ2 nu-til-e"}
      - {motif: king-statue-set-before-god, refs: ["ETCSL 2.6.6.5 83-84"], note: "fragmentary: alan-bi mi-ni-in-x, du10-ub-ba im-mi-in-x: its statue ... on the knees (kneeling?); lines 19-20, 60-63 missing"}
    hints:
      - "Compare 1 Kgs 10:18-20 (Solomon's throne flanked by lions) and 1 Kgs 7:25 (the sea on twelve oxen); Exod 25:18-22 (cherubim at the throne)."
      - "Compare Ps 29:3-9 and Ps 18:13-14 (YHWH thunders, hailstones and coals of fire) and Job 37:2-6."
