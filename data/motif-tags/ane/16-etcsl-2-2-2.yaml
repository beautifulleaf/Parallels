      - {motif: elam-shimashki-destroyers, refs: ["ETCSL 2.5.1.2 Seg.C:4-6", "ETCSL 2.5.1.2 Seg.E:7-8", "ETCSL 2.5.1.2 Seg.F:9"], note: "ba-ši-mi{ki} gaba a-ab-ba ... a-ra-wa{ki} saŋ-kul elam{ki}-ma ... ki-in-da-tu lu2 elam; an-ša4-an{ki} šimaški{ki}: Elam from the sea-coast to Marḫaši, Arawa 'the bolt of Elam'"}
      - {motif: enemy-dies-of-thirst-in-haunted-steppe, refs: ["ETCSL 2.5.1.2 Seg.E:5-6"], note: "{id2}buranun-na {id2}idigna ... zag-bi im-mi-in-gu7, edin bar-rim4 lil2 bu-bu-da enmen-e mi-ni-in-ug7: (the banks of Euphrates, Tigris, Kirsig and Kiš consumed); in the steppe and dry land where ghosts howl he killed them with thirst"}
      - {motif: king-as-faithful-farmer-of-enlil, refs: ["ETCSL 2.5.1.2 Seg.E:11-12"], note: "{d}iš-bi-er3-ra-ŋu10 engar {d}en-lil2-le ... a2 mah mu-na-an-šum2: my Išbi-Erra, farmer of Enlil, given great strength"}
      - {motif: plunder-brought-into-temple-before-god, refs: ["ETCSL 2.5.1.2 Seg.E:3"], note: "Interpretive: kug-sig17 niŋ2-gur11 gi16-sa-a-bi barag-še3 mu-un-du3: gold, property and treasure packed into sacks"}
      - {motif: kirugu-gisgigal-song-structure, refs: ["ETCSL 2.5.1.2 Seg.A:8", "ETCSL 2.5.1.2 Seg.C:14", "ETCSL 2.5.1.2 Seg.E:10", "ETCSL 2.5.1.2 Seg.E:13"]}
