      - {motif: incomparability-among-the-gods, refs: ["ETCSL 2.5.4.08 sa–gida.A:9"], note: "an ki niŋin2-na-bi dili-zu-ni mah-me-en: in all heaven and earth you alone are great"}
      - {motif: temple-interior-intricate-unknowable, refs: ["ETCSL 2.5.4.08 sa–gida.A:15-17"], note: "e2-kur-ra šag4-bi galam kad4-am3 niŋ2 lu2 nu-zu-am3; ŋarza-bi kug-kug-ga-am3 niŋ2 ka-ge dib-ba-am3: its rites holy, beyond speaking"}
      - {motif: god-chooses-king-in-heart, refs: ["ETCSL 2.5.4.08 sa–gida.A:13-14"], note: "Here the city: ki-ur3 dur-an-ki šag4-ge pad3-da-za: Kiur, Duranki chosen in your heart"}
      - {motif: king-begotten-as-gods-son, refs: ["ETCSL 2.5.4.08 sa–gida.A:20", "ETCSL 2.5.4.08 sa–jara.C:28"], note: "{d}iš-me-{d}da-gan dumu ki aŋ2-za: Išme-Dagan your beloved son; dumu {d}en-lil2-la2"}
      - {motif: prayer-for-kings-long-life, refs: ["ETCSL 2.5.4.08 sa–gida.A:20", "ETCSL 2.5.4.08 uru.D:44-45"], note: "nam-lugal-la-a-na bal-bi ha-ra-su3-ud: may the reign of his kingship be long; bal dug3 mu nam-he2"}
      - {motif: god-decrees-kings-destiny, refs: ["ETCSL 2.5.4.08 sa–jara.C:27"], note: "nam dug3 tar-mu-ni-ib"}
      - {motif: royal-hymn-genres-catalogue, refs: ["ETCSL 2.5.4.08 uru.D:46-47"], note: "a-da-ab {d}en-lil2-la2-kam; most of sa-ĝara (32-40) is broken"}
