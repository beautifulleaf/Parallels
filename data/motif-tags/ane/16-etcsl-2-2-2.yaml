  # ---------------- ETCSL 3.3.20 ----------------
  - id: ane-etcsl-3-3-20-gudea-to-his-god
    tradition: ane-sumerian
    title: "Letter from Gudea to his personal god: like a sheep without a shepherd, a donkey under the whip; you are no stranger, return your heart to me"
    corpus: ane
