      - {motif: god-decrees-kings-destiny, refs: ["ETCSL 2.5.6.1 :54-55", "ETCSL 2.5.6.1 :68-69"], note: "an gal ... sipad ŋiš tuku-ni-ir nam ul-še3 nu-kur2-ru mu-ni-in-tar: great An decreed for the attentive shepherd a fate unchangeable for distant days; the Anuna said 'so be it' (he2-am3)"}
      - {motif: king-fame-to-ends-of-heaven, refs: ["ETCSL 2.5.6.1 :57-58"], note: "lugal-ra mu-ni an-zag-še3 pa e3 im-ma-an-ak: Enlil made the king's name shine to the horizon"}
      - {motif: personal-god-holds-kings-hand, refs: ["ETCSL 2.5.6.1 :60-62"], note: "{d}nin-urta ... ki me3-ka ka-tab-zu he2-a: may Ninurta be your helper in the place of battle; Erra like a hero"}
      - {motif: king-provides-temple-offerings-prayer, refs: ["ETCSL 2.5.6.1 :64-65"], note: "šu-luh kug e2-kur-ra ... nidba-zu banšur mah unu2 gal-ŋa2 su3-ra2-še3 he2-em-mi-in-ŋal2: your offerings on the great table in my dining hall forever"}
      - {motif: sacred-marriage-king-and-goddess, refs: ["ETCSL 2.5.6.1 :72-73"], note: "{d}inana dumu gal {d}suen-na nitalam ki aŋ2-ŋa2-ni: Inana, eldest daughter of Suen, his beloved spouse, gathers every divine power into her hand"}
      - {motif: goddess-and-king-leave-high-gods-for-palace, refs: ["ETCSL 2.5.6.1 :74-75"], note: "2-na-ne-ne ki {d}en-lil2-la2-ta hul2-la nam-ta-e3, e2-gal ki-tuš lal3 niŋ2 dug3-ba dur2 ki ba-ni-in-ŋal2-le-eš"}
      - {motif: god-chooses-king-in-heart, refs: ["ETCSL 2.5.6.1 :80-81", "ETCSL 2.5.6.1 :89"], note: "Inana speaks: i-bi2 zid il2-la-za mi-ni-in-pad3-de3 mu pad3-da-ŋu10-me-en: I chose you with a faithful look, you are the one named by me; Enlil chose you for the shepherdship of the land"}
      - {motif: prayer-for-kings-long-life, refs: ["ETCSL 2.5.6.1 :82-83"], note: "ur2 kug nam-til3-la ... ud-zu sud-sud-de3"}
      - {motif: immutable-divine-word, refs: ["ETCSL 2.5.6.1 unknown.K:91"], note: "eš-bar zid dug4-ga nu-kur2-ru-ŋu10-uš: my true unchanging decision; subscript ends {d}inana-kam"}
      - {motif: kirugu-gisgigal-song-structure, refs: ["ETCSL 2.5.6.1 :56", "ETCSL 2.5.6.1 :67", "ETCSL 2.5.6.1 :77", "ETCSL 2.5.6.1 :88", "ETCSL 2.5.6.1 :90"]}
    hints:
      - "Compare Ps 2:9 and Ps 110:2-3 (rule in the midst of your enemies) and Jer 27:8-11 (the yoke of the king of Babylon)."
      - "Compare Ps 45:10-16 (the queen at the king's right; led into the palace with joy)."
