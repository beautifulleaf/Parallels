      - {motif: personal-god-of-ruler, refs: ["ETCSL 3.3.11 4", "ETCSL 3.3.11 7"], note: "{d}lamma ud til3-la-a kal-le: the protective deity who holds dear a life of days; {d}nin-imma3 diŋir-zu: Ninimma your (personal) god"}
      - {motif: silver-in-shekel-and-mina-weights, refs: ["ETCSL 3.3.11 12-14"], note: "min giŋ4 kug-babbar diš tug2 min {tug2}bar-sig9: two shekels of silver, one garment, two sashes; do not let your mother touch the share"}
      - {motif: letter-closing-may-my-lord-know, refs: ["ETCSL 3.3.11 15"], note: "a-ma-ru-kam"}
  # ---------------- ETCSL 3.3.12 ----------------
  - id: ane-etcsl-3-3-12-inim-inana-to-lugal-ibila
