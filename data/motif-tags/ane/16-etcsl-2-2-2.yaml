    title: "Letter-petition of Lugal-nesaĝe to a king radiant as the moon: like an ox without yoke, a cow without calf, a drifting boat; I eat tears in Nibru's street; restore me"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Sumerian"
    read: ["ETCSL 3.3.02"]
    tags:
      - {motif: letter-address-praises-recipient-with-epithets, refs: ["ETCSL 3.3.02 Ver.1:1-4"], note: "lugal zalag-ga-ni iti6-gin7 kur-kur-ra pa e3-a ... lugal {d}utu-gin7 di si sa2 kud-kud-de3 eš-bar {d}ištaran-gin7: king whose radiance shines like the moon over the lands, who judges straight like Utu, decides like Ištaran"}
      - {motif: letter-opening-say-to-my-lord, refs: ["ETCSL 3.3.02 Ver.1:2", "ETCSL 3.3.02 :5"], note: "u3-na-dug4 ... {m}lugal-nesaŋ-e dumu nibru{ki} arad2-zu na-ab-be2-a: say to him ... Lugal-nesaĝe, citizen of Nibru, your servant, says"}
      - {motif: petitioner-plight-in-chain-of-similes, refs: ["ETCSL 3.3.02 Ver.1:6-11"], note: "gud {ŋiš}šudul4-a nu-ub-ha-za la2-gin7 edin-na ba-ab-ŋen-ne-en; ab2 amar-bi nu-ub-da-la2-a-gin7 gu3 arhuš-a im-me; u8 sila4-bi ... dab5-ba-gin7; mušen-gin7 gud3-ŋa2 lu2 šu ba-ni-in-ti; {ŋiš}ma2 kar gen6-na li-bi2-ib-taka4-a-gin7 tum9-e ba-ab-dirig-ge"}
      - {motif: cow-bereaved-of-calf, refs: ["ETCSL 3.3.02 Ver.1:8"], note: "ab2 amar-bi nu-ub-da-la2-a-gin7 gu3 arhuš-a im-me: like a cow not with its calf, I cry out for compassion"}
      - {motif: tears-as-bread, refs: ["ETCSL 3.3.02 Ver.1:12"], note: "i-si-iš sila nibru{ki}-ka mu-gu7-e-en: I eat tears in the street of Nibru"}
      - {motif: no-one-intercedes-for-city, refs: ["ETCSL 3.3.02 Ver.1:13"], note: "Here personal: iri kur2 iri-ŋa2 mu-da-an-kur9 lu2 en3 tar-re la-ba-tuku: a hostile city has entered my city; I have no one to care for me"}
      - {motif: estranged-from-brothers, refs: ["ETCSL 3.3.02 Ver.1:16-17"], note: "gu5-li dub3-sa zu-a kal-la-ŋu10 ... igi tur mu-un-gid2-i-eš: my friends, comrades and dear acquaintances look at me with narrowed eyes"}
      - {motif: mothers-milk-snatched-from-mouth, refs: ["ETCSL 3.3.02 Ver.1:19-21"], note: "dug3-ge-eš ga-ŋu10 gu7-ŋu10 ka-ŋu10-ta ba-an-kar, a-a-ŋu10 šag4 ur2-bi-ta ... ba-an-ŋar-re-en; nin arhuš-a-ŋu10 ... igi nu-mu-un-ši-bar-re: my sweet milk was snatched from my mouth; my merciful lady does not look at me (the mother line 18 is a stray unsectioned line)"}
      - {motif: sufferer-like-fruitless-tree, refs: ["ETCSL 3.3.02 Ver.1:22-23"], note: "ŋiš hul gurun nu-il2-la-gin7 lu2 na-ma-ši-hul2-le: like a bad tree that bears no fruit, no one rejoices over me"}
      - {motif: restore-us-refrain, refs: ["ETCSL 3.3.02 Ver.1:24"], note: "lugal-ŋu10 en3-ŋu10 he2-tar-re ki-ur3-ŋu10-še3 he2-em-mi-ib-gi4-gi4-in: may my king care for me and restore me to my foundation"}
      - {motif: refrain-repeated-stanza, refs: ["ETCSL 3.3.02 Ver.2:5-17"], note: "second version repeats the similes line by line"}
    hints:
      - "Compare Ps 42:4 and 80:6 (tears my bread), Ps 38:12 and Job 19:13-19 (friends stand aloof), Ps 102:7-8 (like a lonely bird on the roof)."
      - "Compare Jer 31:18 (like an untrained calf) and Jer 50:6 (lost sheep); Lk 13:6-9 (the barren fig tree)."
  # ---------------- ETCSL 3.3.03 ----------------
  - id: ane-etcsl-3-3-03-lugal-nesage-sun-king
    tradition: ane-sumerian
    title: "Letter-petition of Lugal-nesaĝe to a king radiant as the sun: punished without knowing why, moaning like a dove in a foreign city"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Sumerian"
    read: ["ETCSL 3.3.03"]
    tags:
      - {motif: letter-address-praises-recipient-with-epithets, refs: ["ETCSL 3.3.03 Ver.1:1-6"], note: "lugal {d}utu-gin7 šag4 kalam-ma mu-un-zalag-ga: king who brightens the heart of the land like Utu; who raised the complaint from the furrow; who seized Tidnum and its staff"}
      - {motif: letter-opening-say-to-my-lord, refs: ["ETCSL 3.3.03 Ver.1:2", "ETCSL 3.3.03 :7"]}
      - {motif: amorites-as-hostile-others, refs: ["ETCSL 3.3.03 :4"], note: "ti-id-nu-um{ki}-e šu bi2-in-ŋar: who laid hands on Tidnum (the Amorites)"}
      - {motif: guilt-for-unknowing-sin, refs: ["ETCSL 3.3.03 Ver.1:8-9"], note: "šul-a-lum nu-zu-ŋu10 saŋ-ki ba-gid2: frowned upon for an offence I do not know"}
      - {motif: moaning-like-dove-chirping-like-swallow, refs: ["ETCSL 3.3.03 Ver.1:10-11"], note: "iri kur2-ra tum12{mušen}-gin7 še mi-in-ša4, šag4-ne-ša4 la-ba-an-tuku: in a foreign city I moan like a dove; I have no one to plead for me"}
      - {motif: petitioner-plight-in-chain-of-similes, refs: ["ETCSL 3.3.03 Ver.1:12-13", "ETCSL 3.3.03 :14", "ETCSL 3.3.03 Ver.1:18-19", "ETCSL 3.3.03 Ver.1:21"], note: "ur-gin7 ki gam-ma nu-zu: like a dog that knows no place to lie; mušen šu sur2-du3{mušen}-ta dal-a-gin7: like a bird escaped from the falcon's claw; {ŋiš}kiri6 a nu-dug4-ga-gin7: like an unwatered orchard; like grain ground"}
      - {motif: estranged-from-brothers, refs: ["ETCSL 3.3.03 Ver.1:22"], note: "šeš-ŋu10 lu2 kur2 nu-me-a igi tur mu-un-x: my brother, who is no stranger, looks at me askance"}
      - {motif: refrain-repeated-stanza, refs: ["ETCSL 3.3.03 Ver.2:1-9"], note: "second version of the similes; lines 23-28 lost"}
    hints:
      - "Compare Isa 38:14 (I moan like a dove) and Ps 102:7; Job 10:2 (let me know why you contend with me) and Ps 124:7 (a bird escaped from the snare)."
  # ---------------- ETCSL 3.3.04 ----------------
