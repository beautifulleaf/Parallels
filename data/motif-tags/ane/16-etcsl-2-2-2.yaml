  # ---------------- ETCSL 3.3.09 ----------------
  - id: ane-etcsl-3-3-09-lugal-nesage-to-enlil-massu
    tradition: ane-sumerian
    title: "Letter-petition of Lugal-nesaĝe to Enlil-massu: praise of the honey-mouthed scribe who reveres his parents; I am crushed, hungry and eat tears; my heart filled with blood and pus"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Sumerian"
    read: ["ETCSL 3.3.09 1-24"]
    tags:
      - {motif: letter-address-praises-recipient-with-epithets, refs: ["ETCSL 3.3.09 1-7"], note: "{d}en-lil2-mas-su dimma ad gi4 sag9 ka lal3 inim gun3-gun3: of good counsel, honey-mouthed, of colourful words; dumu diŋir-ra-ni-ir gub-ba a-a ama-ni ni2 teŋ3-ŋe26-e: who stands before his god and reveres his father and mother; me-te nam-dub-sar-ra: ornament of the scribal art"}
      - {motif: honor-parents-long-life, refs: ["ETCSL 3.3.09 2"], note: "a-a ama-ni ni2 teŋ3-ŋe26-e-ra: who reveres his father and mother (an epithet of virtue)"}
      - {motif: letter-opening-say-to-my-lord, refs: ["ETCSL 3.3.09 8-9"], note: "{m}lugal-nesaŋ-e nu-eš3 {d}en-lil2-la2 ... dumu {d}en-lil2-al-sag9 um-mi-a nibru{ki}-a ad-da-zu na-ab-be2-a: Lugal-nesaĝe, nu-eš priest of Enlil, son of Enlil-alsag the Nibru scholar, your father, says"}
      - {motif: tears-as-bread, refs: ["ETCSL 3.3.09 12"], note: "i-si-iš-zu ... ib2-sig9-ge-en: I am wasting in lament (with an Akkadian gloss ta-az-me-tu-ka)"}
      - {motif: body-poured-out-heart-like-wax, refs: ["ETCSL 3.3.09 16-18B"], note: "ŋeštug2 šag4-ŋu10-ta lul ba-ŋar; ni2 te-te-ŋu10-ta šag4-ŋu10 uš2 lugud ba-si, en3 tar-tar-re-de3 zi ba-ir: my mind became confused; from fear my heart is filled with blood and pus; my life ebbs away for want of care (variants 17A-18B)"}
      - {motif: estranged-from-brothers, refs: ["ETCSL 3.3.09 18"], note: "en3 tar-tar-re-de3: no one inquires after me"}
      - {motif: restore-us-refrain, refs: ["ETCSL 3.3.09 23-24"], note: "ki nam tar-ra-še3 ...; dug4-ga {d}en-lil2-la2-ta muš3-me-zu he2-bi2-ib2-du8: by Enlil's command may your face be favourable (lines 19-22 missing)"}
    hints:
      - "Compare Ps 38:4-11 (no soundness in my flesh, wounds fester, friends stand aloof) and Ps 22:15 (my heart like wax); Exod 20:12."
  # ---------------- ETCSL 3.3.10 ----------------
  - id: ane-etcsl-3-3-10-inanaka-to-nintinuga
    tradition: ane-sumerian
    title: "Letter-prayer of Inanaka to the healing goddess Nintinuga: twice on my sickbed, friends gone; drive out the Asag demon and I will be your slave, sweeping your courtyard and proclaiming your name"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Sumerian"
    read: ["ETCSL 3.3.10 1-26"]
    tags:
      - {motif: letter-to-a-god, refs: ["ETCSL 3.3.10 1-11"], note: "{d}nin-tin-ug5-ga aŋrig zid e2-kur-ra, a-zu kalam-ma-ra u3-na-a-dug4 ... {m}{d}inana-ka dumu-munus {d}en-lil2-a2-mah geme2-zu na-ab-be2-a: to Nintinuga, true steward of E-kur, physician of the land, say: Inanaka, daughter of Enlil-amah, your slave girl, says"}
      - {motif: healing-goddess-with-scalpel, refs: ["ETCSL 3.3.10 2-4", "ETCSL 3.3.10 8-9"], note: "a-zu kalam-ma; nin tu6 dug4-ga-ni uŋ3 šar2 til3-le: lady whose incantation keeps the multitudes alive; til3-la ug5-ga en3 tar-bi za-e-me-en: you care for living and dying; lu2-kud-lu2-kud-ba du7-du7: who makes the crippled whole"}
      - {motif: healer-raises-patient-from-sickbed, refs: ["ETCSL 3.3.10 12-13", "ETCSL 3.3.10 22"], note: "ki-nu2 šub-ba-ŋu10-da 2-kam-ma-bi: I have fallen on my sickbed a second time; u2-u8-a-u8-a ... a-ra2-bi nu-zu: I do not know how often I have cried 'woe'; ki-in-du nam-til3-la-ka ŋiri3-ŋu10 he2-bi2-ib-gub-be2: may I set my foot on the ground of life"}
      - {motif: friends-stand-aloof-from-plague, refs: ["ETCSL 3.3.10 16-16a"], note: "zu-a kal-la-ŋu10 ŋiri3 kur2 ba-an-dab5-be2-eš, lu2 en3 tar-re la-ba-an-tuku: my dear acquaintances have taken a foreign path; I have no one to care for me"}
      - {motif: named-demons-beset-mankind, refs: ["ETCSL 3.3.10 21"], note: "a2-sag3 su-ŋa2 ŋal2-la su-ŋa2 ib2-ta-an-zig3: may the Asag demon in my body rise out of it"}
      - {motif: healed-suppliant-vows-to-serve-in-temple, refs: ["ETCSL 3.3.10 23-26"], note: "ŋe26-e geme2-zu he2-me-en, e2-za-a kisal-luh-bi he2-me-en igi-zu-še3 he2-gub ... mu-zu ga-am3-mi-ib2-sa4: I will be your slave girl, the sweeper of your courtyard, I will stand before you, I will proclaim your name"}
    hints:
      - "Compare Ps 30:3-5, 10 (I cried to you and you healed me; will the dust praise you?) and Ps 116:16-19 (I am your servant ... I will pay my vows in the courts of YHWH's house); Ps 84:11 (doorkeeper in the house of my God)."
      - "Compare 1 Sam 1:11 (Hannah's vow) and Ps 38:12."
  # ---------------- ETCSL 3.3.11 ----------------
  - id: ane-etcsl-3-3-11-inim-inana-to-enlil-massu
