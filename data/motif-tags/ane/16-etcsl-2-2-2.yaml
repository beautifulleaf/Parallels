    read: ["ETCSL 3.3.20 1-10"]
    tags:
      - {motif: letter-to-a-god, refs: ["ETCSL 3.3.20 1-2"], note: "diŋir-ŋa2 u3-na-dug4 {m}gu3-de2-a arad-zu na-ab-be2-a: say to my god: Gudea your servant says"}
      - {motif: sheep-without-shepherd, refs: ["ETCSL 3.3.20 3-4"], note: "udu-gin7 sipad gen6-na nu-tuku, na-gada gen6-na nu-mu-un-tum2-tum2-mu: like a sheep I have no reliable shepherd, no reliable herdsman leads me"}
      - {motif: petitioner-plight-in-chain-of-similes, refs: ["ETCSL 3.3.20 5-6"], note: "dam-gara3 saŋ du3-du3 nu-zu: like a merchant who cannot make a profit; anše-gin7 {kuš}usan3 hul-ŋal2-la: like a donkey under an evil whip"}
      - {motif: god-hides-his-face, refs: ["ETCSL 3.3.20 7-10"], note: "Interpretive: niŋ2 ak-a-ŋu10 igi a-ra2 7-e nu-un-DU: my deeds are not looked at, even seven times; diŋir-ŋu10 lu2 kur2 di nu-me-en šag4-zu ki-bi ha-ma-ab-gi4-gi4: my god, you are not a stranger; may your heart return to its place for me"}
    hints:
      - "Compare Num 27:17; 1 Kgs 22:17; Mark 6:34 (sheep without a shepherd) and Ps 23:1; Ps 13:2 (how long will you hide your face)."
  # ---------------- ETCSL 3.3.27 ----------------
  - id: ane-etcsl-3-3-27-inim-enlila-to-king
    tradition: ane-sumerian
    title: "Letter from the scribe Inim-Enlila to a king: I do not know my sin; my clan eats tears; let my bones not be taken to a foreign city"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Sumerian"
    read: ["ETCSL 3.3.27"]
    tags:
      - {motif: letter-address-praises-recipient-with-epithets, refs: ["ETCSL 3.3.27 Seg.A:1-5"], note: "lugal inim sag9-sag9-ge diŋir-re-e-ne-er gub-ba, ninda nidba si bi2-sa2 ... alan sukud-da ... šag4-la2 sug4: king who stands with good words before the gods, who keeps the offerings in order, of lofty stature, full of mercy"}
      - {motif: letter-opening-say-to-my-lord, refs: ["ETCSL 3.3.27 Seg.A:6-7"], note: "{m}inim-{d}en-lil2-la2 dub-sar dumu {d}suen-pa-lil2 arad-zu na-ab-be2-a"}
      - {motif: guilt-for-unknowing-sin, refs: ["ETCSL 3.3.27 Seg.A:8"], note: "nam-tag-ŋu10 nu-zu nam-tag-ŋa2 ŋeštug2 la-ba-ši-ŋal2: I do not know my sin, my sin was not heard (no one listened to my case)"}
      - {motif: tears-as-bread, refs: ["ETCSL 3.3.27 Seg.A:9"], note: "nam im-ri-a hi-iš6-ši i-si-iš-bi ib2-gu7-en: the fate of my oppressed clan, I eat its lament"}
      - {motif: plea-not-to-die-in-foreign-city, refs: ["ETCSL 3.3.27 Seg.A:10"], note: "ŋiri3-pad-ra2-ŋu10 šag4 iri kur2-ra-še3 a nam-ma-an-tum3: let not water carry my bones into a foreign city"}
    hints:
      - "Compare Job 10:2; 13:23 (make me know my transgression) and Gen 47:29-30; 50:25 (do not bury me in Egypt; carry my bones)."
  # ---------------- ETCSL 3.3.39 ----------------
  - id: ane-etcsl-3-3-39-kug-nanna-to-ninshubur
    tradition: ane-sumerian
    title: "Letter-prayer of Kug-Nanna to the god Ninšubur: in fetters, facing death abroad, ignored in the street; soothe your angry heart, drive out the demon, brighten my dark days"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Sumerian"
    read: ["ETCSL 3.3.39"]
    tags:
      - {motif: letter-to-a-god, refs: ["ETCSL 3.3.39 Seg.A:2-13"], note: "address to Ninšubur, counsellor, linen-clad god of the abzu, minister who knows An's secret (lagar3 ad-hal an-na zu-a), who gives offerings to the Anuna, unrivalled: {m}kug-{d}nanna šim-mu2 ... arad-zu na-be2-a"}
      - {motif: divine-minister-of-heaven-walks-before-god, refs: ["ETCSL 3.3.39 Seg.A:7", "ETCSL 3.3.39 Seg.A:11"], note: "lagar3 ad-hal an-na zu-a diŋir na-me nu-mu-e-da-sa2; e-ne-da nu nam-en nam-lugal-la {ŋiš}ŋidru mah la-ba-an-šum2: without him no en-ship or kingship, no great sceptre is given"}
      - {motif: captive-in-foot-hand-neck-stocks, refs: ["ETCSL 3.3.39 Seg.A:14"], note: "šu-gi4 nu-silim-me-en ŋiš-šu dab5-be: I am an old man not well, held in manacles (fragmentary)"}
      - {motif: plea-not-to-die-in-foreign-city, refs: ["ETCSL 3.3.39 Seg.B:3"], note: "nam-uš2 kur2-ra igi tur-ŋu10 ba-an-du3: (facing) death in a foreign land, I am looked at askance"}
      - {motif: friends-stand-aloof-from-plague, refs: ["ETCSL 3.3.39 Seg.B:4"], note: "gu5-li-ŋu10 e-sir2-ra ka nu-mu-un-ba gu2 ki-še3 bi2-in-ŋar: my friend does not speak to me in the street but turns his neck away"}
      - {motif: divine-compassion-overturns-anger, refs: ["ETCSL 3.3.39 Seg.B:5-6"], note: "tukum-bi diŋir-ŋu10-ra an-na-kam šag4 ib2-ba-zu ga-ab-huŋ-e ur5-zu he2-bur2-e: if it please my god, let me soothe your angry heart, may your mood relax"}
      - {motif: named-demons-beset-mankind, refs: ["ETCSL 3.3.39 Seg.B:7-8"], note: "maškim hul ... su-ŋa2 he2-da-ab-dal; a2-sag3 ... he2-eb2-zi-zi: may the evil maškim demon fly from my body, the Asag rise from my limbs"}
      - {motif: astral-deity-lights-dark-place, refs: ["ETCSL 3.3.39 Seg.B:8"], note: "ud ku10-ku10-ŋu10 he2-NE-en-zalag: may my dark days become bright"}
      - {motif: plea-that-high-god-say-enough, refs: ["ETCSL 3.3.39 Seg.B:9-10"], note: "Interpretive: nir dugud-da-zu nu-mu-da-il2 ab-gul dug4-ga-ab; arad sun5-na-me nam-mu-til-e-de3: I cannot bear your heavy punishment, say 'release it' (lit. 'destroy it'); let your humble servant not perish"}
    hints:
      - "Compare Ps 88:9 (you have made my friends shun me), Ps 6:2-4 (do not rebuke me in your anger), Ps 18:29 (my God lightens my darkness) and Ps 107:10-14 (in darkness, bound in irons)."
  # ---------------- ETCSL 4.01.1: Asarluḫi A ----------------
  - id: ane-etcsl-4-01-1-asarluhi-hymn
    tradition: ane-sumerian
    title: "Hymn to Asarluḫi (Marduk), firstborn of Enki: the river ordeal refines the just like gold; the god of incantation, pure hands and pure feet; settled in Kuara"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Sumerian"
    read: ["ETCSL 4.01.1 6-41"]
    tags:
      - {motif: river-ordeal-clears-the-just, refs: ["ETCSL 4.01.1 8-11"], note: "id2-lu2-ru-gu2 a-ra2 mah ... lu2 zid kug-sig17 mu-un-dadag-ge-en, lu2-erim2-e ud za-ha-al-e ba-ab-šum2-mu-un: in the River Ordeal you make the just man shine like gold and give the evildoer to the day of vanishing"}
      - {motif: smelting-away-dross, refs: ["ETCSL 4.01.1 10"], note: "lu2 zid kug-sig17 mu-un-dadag-ge-en: the just refined like gold"}
      - {motif: god-is-firstborn-of-high-god, refs: ["ETCSL 4.01.1 14", "ETCSL 4.01.1 18"], note: "gal-zu mah dumu-saŋ {d}en-ki-ke4; nir-ŋal2 dumu abzu ... {d}marduk ŋalga tum2: firstborn of Enki; son of the abzu; Marduk"}
      - {motif: wisdom-given-to-king-by-god, refs: ["ETCSL 4.01.1 16-20"], note: "{d}asar-lu2-hi ŋeštug2 bad a-a-ni-gin7 gal-zu: of open mind, wise like his father; igi-ŋal2-tuku niŋ2-nam burudx-burudx-e: the wise one who penetrates everything"}
      - {motif: god-decrees-kings-destiny, refs: ["ETCSL 4.01.1 21"], note: "{d}asar-lu2-hi uru5 mah nam gal tar-re: great flood, decreeing great fates"}
      - {motif: secret-incantation-unknown-to-gods, refs: ["ETCSL 4.01.1 23-24"], note: "an gal an ki-še3 me ba-a mu7-mu7 mu-e-šub-eš: great An, distributing the divine powers in heaven and earth, has bestowed incantations on you"}
      - {motif: wise-god-as-sage-carpenter-and-purifier, refs: ["ETCSL 4.01.1 26", "ETCSL 4.01.1 29-32", "ETCSL 4.01.1 35-36"], note: "tibira gal-an-zu: wise sculptor; sukkal-mah eridug{ki}-ga; abgal abrig2; šu sikil ŋiri3 sikil ... šu-luh dadag-ga, nam-šita4 e2-abzu: pure hands, pure feet, bright purification rites, priesthood of the Abzu"}
      - {motif: clean-hands-pure-heart, refs: ["ETCSL 4.01.1 35"], note: "šu sikil ŋiri3 sikil niŋ2-nam kug-ku3-ug: pure hands, pure feet, all things holy"}
      - {motif: deity-renders-verdicts-and-judgments, refs: ["ETCSL 4.01.1 27"], note: "ad gal di-kud eš3 mah-a inim-ma nu-kam3-me: great counsellor, judge in the lofty shrine whose word is unalterable"}
      - {motif: i-will-sing-opening, refs: ["ETCSL 4.01.1 28"], note: "a-ra2-ni mah šir3-ra-ni ga-am3-ed3 mu-ni pa ga-am3-e3: let me extol his ways in song, let me make his name shine"}
      - {motif: god-chooses-king-in-heart, refs: ["ETCSL 4.01.1 37-38"], note: "Here a city: kuara{ki} iri ki aŋ2 šag4-ge pad3-da-zu hul2-la hu-mu-u8-da-an-tuš: Kuara, beloved city chosen in your heart, where you dwell in joy; lines 1-5 lost"}
    hints:
      - "Compare Mal 3:2-3 and Zech 13:9 (refining like silver and gold), Ps 24:3-4 (clean hands and pure heart) and Num 5:11-31 (ordeal)."
  # ---------------- ETCSL 4.03.1: Damgalnuna A ----------------
  - id: ane-etcsl-4-03-1-damgalnuna-sir-sag-hula
    tradition: ane-sumerian
    title: "Šir-šag-ḫula to Damgalnuna, bride of Enki, great cow, mother of the great gods (fragments)"
