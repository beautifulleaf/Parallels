# Full read of the ANE corpus, chunk 16: ETCSL 2.2.2 - ETCSL 4.03.1 (Lament for Urim, Ur III and Isin-Larsa royal hymns, letters, Asarluḫi and Damgalnuna hymns).
# Read from the ORACC lemmatized Sumerian composites (no translation); word glosses used as reading aids.
new_motifs:
  city-built-in-falsehood-destroyed-in-truth: {label: "Lament paradox: the city or house was built as a falsehood (lul) but its destruction is truth (zid), i.e. its building came to nothing and its ruin is real", cluster: lament}
  house-like-harvest-shelter-in-wind-and-rain: {label: "The destroyed house is like a tent or harvest-field shelter torn open and exposed to wind and rain", cluster: lament}
  goddess-pleads-with-high-gods-to-spare-city: {label: "A city goddess weeps before the high gods (An, Enlil) and begs them 'let my city not be destroyed, let its people not perish', but they do not change their word", cluster: lament}
  goddess-sleepless-in-grief: {label: "A grieving goddess finds no sleep or rest in her bedchamber by night because of the coming doom of her city", cluster: lament}
  storm-entrusted-to-storm-keeper: {label: "The high god hands the destroying storm over to a divine storm-keeper or enlists the fire god as its helper", cluster: lament}
  corpses-in-gates-and-streets: {label: "After the sack corpses lie in the city's great gate, its festival streets and its roads", cluster: lament}
  corpses-melt-like-fat-in-sun: {label: "The bodies of the slain melt away like fat left in the sun", cluster: lament}
  slain-like-trapped-gazelle-mouth-in-dust: {label: "The slain lie like a gazelle caught in a trap, their mouths biting the dust", cluster: lament}
  infants-carried-off-like-fish-by-water: {label: "Little children lying in their mothers' laps are carried off like fish by the water", cluster: lament}
  temple-valued-at-thirty-shekels: {label: "The destroyers value the holy house at a contemptible thirty shekels", cluster: lament}
  children-carried-off-in-boats: {label: "The goddess's daughters and sons are carried off as captives in boats to a foreign city", cluster: lament}
  goddess-no-longer-queen-of-her-city: {label: "A goddess laments that her city no longer exists for her and she is no longer its queen", cluster: lament}
  exiled-goddess-has-nowhere-to-sit-or-stand: {label: "The displaced goddess asks where she is to sit and stand: shall another city or house be built for her in place of her own?", cluster: lament}
  no-lament-singer-left: {label: "In the ruined land there is no lament-singer left to perform the penitential lament; he has gone to foreign lands", cluster: lament}
  ruined-house-bricks-cry-where-are-you: {label: "The bricks of the ruined temple cry out like a person to the departed deity: 'Where are you?'", cluster: lament}
  plea-deity-return-like-ox-to-pen: {label: "The departed deity is begged to return to her city like an ox to its pen, a sheep to its fold, a young child to its chamber", cluster: lament}
  plea-that-high-god-say-enough: {label: "Prayer that the high god say 'It is enough!' and end the destruction", cluster: lament}
  storm-knows-no-kin: {label: "The destroying storm knows neither mother nor father, wife nor child, sister, brother nor neighbour", cluster: lament}
  account-of-calamity-hung-on-peg: {label: "The account (tally) of the catastrophe is closed and hung on a peg in the high god's house, never to be reopened", cluster: lament}
  plea-city-gates-bolted-against-storm: {label: "Prayer that the city gates be bolted against the storm as gates are barred at night, so that it never returns", cluster: lament}
  god-releases-sin-of-supplicant: {label: "The god is asked to loosen (release) the sin of the penitent human who utters prayer, so that his heart is soothed", cluster: sin}
  personal-god-brings-greeting-gift-for-suppliant: {label: "A man's personal god brings a greeting gift (kadra) to the great god on behalf of the man who prays", cluster: cult}
  sacred-chest-no-eye-has-seen: {label: "A holy chest or box (dub-šen) of the god, kept in the heart of the city or temple, which no eye has seen", cluster: cult}
  king-as-physician: {label: "The king is praised as a physician (a-zu) who heals", cluster: kingship}
  lullaby-come-sleep: {label: "A mother sings a lullaby to her son: 'Come, sleep, come to my son; put his restless eyes to sleep'", cluster: childhood}
  lullaby-promises-wife-and-son: {label: "The lullaby promises the baby a wife and a son of his own, a nursemaid and a happy future", cluster: childhood}
  king-visits-temples-gods-rejoice: {label: "The king travels in turn to the temple cities of the great gods, and at each the god rejoices at his coming", cluster: kingship}
  enemy-dies-of-thirst-in-haunted-steppe: {label: "The enemy army is cut off and dies of thirst in the open steppe where ghosts (lil2) howl", cluster: war}
  god-of-netherworld-as-junior-enlil: {label: "The underworld god (Nergal) is the 'junior Enlil' of the eternal house, the netherworld, who decides fates and gives judgments there", cluster: underworld}
  warrior-son-soothes-fathers-angry-heart: {label: "The warrior god sprinkles cool water on (soothes) the angry heart of his father the high god", cluster: divine-family}
  king-born-for-divinity: {label: "The king is called a hero born for godhood (nam-diŋir), fit for the ornaments of kingship", cluster: kingship}
  moon-god-judges-netherworld-at-disappearance: {label: "On the day the moon lies down (disappears), the moon god as lord of the netherworld renders great judgments and decisions there", cluster: underworld}
  temple-interior-intricate-unknowable: {label: "The inside of the god's temple is intricate and tied together, a thing no one knows", cluster: cult}
  statue-of-king-as-runner: {label: "The king sets up a copper statue of himself running in the temple, celebrating his tireless speed as a runner", cluster: kingship}
  curse-fertility-gods-withdraw-abundance: {label: "Curse on whoever damages the king's inscription: the gods of rain, grain and herds withdraw abundance from heaven and earth", cluster: treaty}
  king-titulary-of-four-cities: {label: "The king is styled by his service to each great cult city in turn: provisioner of Nibru, attendant of Urim, the one who stands daily for Eridug, en of Unug, king of Isin", cluster: kingship}
  goddess-laments-own-house-swallowed: {label: "A goddess laments in the first person that the fate of her house and city has been cut off, her goods swallowed by the swamp, her mourning garment defiled", cluster: lament}
  goddess-and-king-leave-high-gods-for-palace: {label: "After the high gods have decreed the king's fate, the goddess and the king leave the chief god's presence rejoicing and settle in the palace, a dwelling sweet as honey", cluster: kingship}
  anshar-kishar-whole-heaven-whole-earth: {label: "The pair an-šar / ki-šar, 'the whole of heaven and the whole of earth', appears in a hymn (the later primordial pair Anšar and Kišar)", cluster: cosmology}
  blessing-good-dream-lying-down-good-omen-rising: {label: "Blessing on the king: when you lie down may your dream be favourable, when you rise may your chance utterance (omen) be favourable, may the place where you stand be safe", cluster: kingship}
  your-lot-be-life-blessing: {label: "Repeated blessing: 'may your lot (ŋiš-šub) be life', 'may life with a happy heart be your share'", cluster: kingship}
  king-makes-throne-and-bull-statues-for-storm-god: {label: "The king fashions a great throne for the storm god, seats him on it, and sets beside it two great bull figures to gore the king's enemies right and left", cluster: cult}
  petitioner-plight-in-chain-of-similes: {label: "A petitioner describes his plight in a chain of animal and object similes: an ox without a yoke roaming the steppe, a cow parted from its calf, a ewe whose lamb is seized, a bird whose nest is touched, a boat cut loose and drifting in the wind", cluster: lament}
  sufferer-like-fruitless-tree: {label: "The sufferer is like a bad tree bearing no fruit, in which no one rejoices", cluster: lament}
  mothers-milk-snatched-from-mouth: {label: "The sufferer says his mother's sweet milk was snatched from his mouth and his father uprooted from the foundation", cluster: lament}
  letter-sends-for-supplies-from-journey: {label: "A traveller writes home from a long journey asking family not to worry and to send small supplies (salt, condiment, a belt, fresh bread and beer)", cluster: daily-life}
  water-rights-dispute: {label: "A dispute over the share of canal water: one channel each is assigned, but a neighbour's men obstruct the flow and the writer's channel gets no water", cluster: law}
  temple-field-diverted-to-ration-holders: {label: "A large field assigned to the gods' temples is reported as partly given out as ration plots to men holding requisitions, and the king is asked to send someone to fix its boundary", cluster: law}
  healed-suppliant-vows-to-serve-in-temple: {label: "The sick petitioner vows that if healed she will be the deity's slave, sweep the temple courtyard, stand before the deity and proclaim the deity's name", cluster: cult}
  plea-not-to-die-in-foreign-city: {label: "The petitioner begs that his bones not be carried off to a foreign city, i.e. that he not die in exile", cluster: lament}
  child-must-not-leave-scribal-school: {label: "A letter urges that a boy be kept at the scribal school (e2-dub-ba-a) and that his correct Sumerian not be neglected", cluster: wisdom}
  goddess-mother-of-great-gods: {label: "A goddess is praised as the one who gave birth to the great gods", cluster: cosmology}
units:
  # ---------------- ETCSL 2.2.2: The lament for Urim ----------------
  - id: ane-etcsl-2-2-2-k1-gods-abandon-folds
    tradition: ane-sumerian
    title: "Kirugu 1: god after god abandons stall and sheepfold to the wind (Lament for Urim 1-38)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Sumerian"
    read: ["ETCSL 2.2.2 1-38"]
    tags:
      - {motif: gods-desert-their-cities, refs: ["ETCSL 2.2.2 1-34"], note: "Refrain tur3-ra-na muš3 mi-ni-in-ga amaš-a-na lil2-e: 'he has abandoned his stall, (left) his sheepfold to the wind (lil2)', said of Enlil, Ninlil, the lady of Keš, Ninisina, Inana, Nanna, Ningal, Šara, Bau, Lamma, Dumuzid-abzu and others"}
      - {motif: deity-abandons-city, refs: ["ETCSL 2.2.2 4-6", "ETCSL 2.2.2 13-16"], note: "{d}mu-ul-lil2-le eš3-e nibru{ki}-a ... {d}suen-e e2-kiš-nu-ŋal2-la: each god leaves his named temple (E-kur's Nibru, Kiur, Ekišnuĝal, Agrunkug)"}
      - {motif: lament-refrain-at-named-places, refs: ["ETCSL 2.2.2 1-34"], note: "the refrain is repeated for each city: Nibru, Keš, Isin, Unug, Urim, Uruzeb, Larag, Umma, Urukug, Lagaš, Niĝin, Kinirša, Guabba"}
      - {motif: nature-reversal-curse, refs: ["ETCSL 2.2.2 37"], note: "ab2 gu3-zu {e2}tur3-ra nu-mu-un-ŋal2: 'the cow's lowing is no longer in the stall'"}
      - {motif: kirugu-gisgigal-song-structure, refs: ["ETCSL 2.2.2 35", "ETCSL 2.2.2 38"]}
      - {motif: goddess-weeps-for-destroyed-city, refs: ["ETCSL 2.2.2 36"], note: "amaš-a-na lil2-e ba-ni-in-ŋar i-si-iš-bi mu-un-kuš2-u3: its lament wearies (her)"}
    hints:
      - "Compare Ezek 10:18-19; 11:22-23 (the glory leaves the temple) and Jer 12:7 (I have forsaken my house, abandoned my heritage)."
      - "Compare Jer 9:9-10 (lowing of cattle not heard) and Lam 1:4."
  - id: ane-etcsl-2-2-2-k2-bitter-lament-for-shrines
    tradition: ane-sumerian
    title: "Kirugu 2: 'O city, a bitter lament is set up for you' at each shrine; the city's rites changed (Lament for Urim 39-75)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Sumerian"
    read: ["ETCSL 2.2.2 39-75"]
    tags:
      - {motif: alas-for-my-city-lament, refs: ["ETCSL 2.2.2 39-44"], note: "uru2 a-še-er gig-ga a-še-er-zu ŋar-ra: 'O city, a bitter lament is set up as your lament'"}
      - {motif: lament-refrain-at-named-places, refs: ["ETCSL 2.2.2 47-61"], note: "the brickwork of Urim, Ekišnuĝal, Agrunkug, Kiur, Nibru, E-kur, Ĝaĝišua, Ubšuukkina, Urukug, Etarsirsir, Maguena, Isin, Egalmah, Unug, Uruzeb each 'has its bitter lament set up'"}
      - {motif: how-long-o-god, refs: ["ETCSL 2.2.2 45-46", "ETCSL 2.2.2 62-63", "ETCSL 2.2.2 70-71"], note: "ga-ša-an-zu mu-lu er2-re en3-še3 mu-un-kuš2-u3: 'your lady, the weeping one, how long will she be weary?' (en3-še3 'until when')"}
      - {motif: divine-powers-of-city-overturned, refs: ["ETCSL 2.2.2 68-69"], note: "uru2 ŋarza-zu im-me-de3-kur2-ra, me-zu me kur2-ra šu bal ba-ni-ib-ak: your rites have become alien, your divine powers changed into foreign ones"}
      - {motif: nature-reversal-curse, refs: ["ETCSL 2.2.2 66-67"], note: "uru2-ŋu10 u8 zid-gin7 sila4-zu ba-e-da-tar: 'my city, like a true ewe your lamb has been cut off'"}
      - {motif: city-made-eternal-tell, refs: ["ETCSL 2.2.2 64-65"], note: "uru2 mu-zu i3-ŋal2 za-e ba-e-da-gul-e: 'O city, your name exists, but you have been destroyed'; walls raised, land finished"}
      - {motif: kirugu-gisgigal-song-structure, refs: ["ETCSL 2.2.2 72-75"]}
    hints:
      - "Compare Lam 1:1-2 and Lam 2:1-9 (each part of Zion named in its ruin); Ps 74:4-8."
      - "Compare Ps 79:5 and Zech 1:12 (how long?)."
  - id: ane-etcsl-2-2-2-k3-ningal-grief
    tradition: ane-sumerian
    title: "Kirugu 3: Ningal cannot sleep; she wails day and night for the doom of her city (Lament for Urim 76-135)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Sumerian"
    read: ["ETCSL 2.2.2 76-100A", "ETCSL 2.2.2 101-135"]
    tags:
      - {motif: goddess-weeps-for-destroyed-city, refs: ["ETCSL 2.2.2 76-84"], note: "e-ne-ra nam uru2-na mu-na-te er2 gig i3-še8-še8: the fate of her city approached her and she wept bitterly"}
      - {motif: goddess-sleepless-in-grief, refs: ["ETCSL 2.2.2 80", "ETCSL 2.2.2 99-100"], note: "{d}nin-gal kalam-ma-ni-še3 u3 nu-ku-ku-de3; ki-nu2 ŋi6 u3-na-ŋa2 ... lib ba-ra-an-mar: in my night bedchamber no rest"}
      - {motif: weeping-in-the-night-tears-on-cheek, refs: ["ETCSL 2.2.2 95-97"], note: "me-e ŋi6-bi-še3 zarah he2-em-ši-ak: 'I wailed through the night'; by day too (92)"}
      - {motif: lament-offered-by-king-to-deity, refs: ["ETCSL 2.2.2 85-86"], note: "Interpretive: munus-e ad-a-ni balaŋ er2-ra ... i-lu ma sig9-ga ni2-te-na mi-ni-ib-be2: the woman herself sings the lament on the balaĝ of tears, quietly in the silent house; not by a king"}
      - {motif: dove-flies-from-window, refs: ["ETCSL 2.2.2 105-106"], note: "mušen an-na-gin7 a2 dub2 he2-em-ši-ak, me-e uru2-ŋu10-še3 he2-em-ši-dal-dal-en: 'like a bird of the sky I flapped my wings, I would have flown to my city'"}
      - {motif: storm-of-divine-wrath, refs: ["ETCSL 2.2.2 87-94", "ETCSL 2.2.2 109-111"], note: "ud ... šu ud-da an-ta ba-ŋal2-la: the hand of the storm from above; 110 gu3 hu-mu-dub2 edin-na ud gi4-a: 'I cried out to the storm, turn back!' but its breast did not rise"}
      - {motif: city-built-in-falsehood-destroyed-in-truth, refs: ["ETCSL 2.2.2 125"], note: "lul-e-eš du3-u3-ba zid-de3-eš gul-lu-ba: built as a lie, destroyed in truth"}
      - {motif: house-like-harvest-shelter-in-wind-and-rain, refs: ["ETCSL 2.2.2 127-128"], note: "za-lam-ŋar e2 ki-buru14 bur12-ra-gin7 ... tum9 šeŋ3-ŋa2 ha-ba-an-ŋar: like a tent, a harvest-place house torn open, exposed to wind and rain"}
      - {motif: temple-cult-and-festivals-cease, refs: ["ETCSL 2.2.2 116"], note: "ezen-bi-ta ib2-ba su-mu-ug-ga: its festivals turned to anger and darkness"}
      - {motif: city-flooded-into-swamp, refs: ["ETCSL 2.2.2 132"], note: "niŋ2-gur11 uru2 ŋal2-ŋal2-la-ŋu10 sug-ge hu-mu-da-ab-gu7: the swamp swallowed the property of my city"}
      - {motif: kirugu-gisgigal-song-structure, refs: ["ETCSL 2.2.2 133-135"]}
    hints:
      - "Compare Lam 1:2 (she weeps bitterly in the night) and Jer 9:17-20 (women taught to wail)."
      - "Compare Isa 1:8 (Zion like a booth in a vineyard, a hut in a cucumber field) and Ps 55:7 (O that I had wings like a dove)."
      - "Compare Ps 127:1 (unless YHWH builds the house, its builders labour in vain)."
  - id: ane-etcsl-2-2-2-k4-ningal-pleads-an-enlil
    tradition: ane-sumerian
    title: "Kirugu 4: Ningal twice pleads with An and Enlil in the assembly, but their word does not change (Lament for Urim 136-171)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Sumerian"
    read: ["ETCSL 2.2.2 136-171"]
    tags:
      - {motif: goddess-pleads-with-high-gods-to-spare-city, refs: ["ETCSL 2.2.2 143-148", "ETCSL 2.2.2 154-158"], note: "an-ra a i-bi2-ŋa2 me-e he2-em-ma-na-de2, {d}mu-ul-lil2-ra ni2-ŋu10 šag4-ne-ša4 he2-em-ma-na-ak, uru2-ŋu10 nam-ba-gul-lu: 'I poured out the water of my eyes to An, I made supplication to Enlil: Let my city not be destroyed'"}
      - {motif: divine-assembly-decree-irrevocable, refs: ["ETCSL 2.2.2 149-153", "ETCSL 2.2.2 159-160"], note: "an-ne2 e-ne-eŋ3-bi ba-ra-mu-un-gur; {d}mu-ul-lil2-le i3-sag9 he2-am3-bi šag4-ŋu10 ba-ra-bi2-in-sed4: An did not turn back his word; Enlil did not soothe my heart with 'It is good, so be it'"}
      - {motif: divine-council, refs: ["ETCSL 2.2.2 151-152"], note: "2-kam-ma-še3 pu-uh2-rum ... {d}a-nun-na: a second time in the assembly where the Anuna sat"}
      - {motif: gods-bound-by-oath-to-destroy, refs: ["ETCSL 2.2.2 152"], note: "{d}a-nun-na e-ne-eŋ3 zu2 keše2-da-bi ba-da-an-dur2-ru-ne-eš: the Anuna sat bound to their word (by oath)"}
      - {motif: city-destruction-decreed-by-gods, refs: ["ETCSL 2.2.2 138-141", "ETCSL 2.2.2 161-166"], note: "uru2-ŋu10 gul-gul-da im-me-ne-eš-a-ba ... uŋ3-bi ug5-ge-de3 na-aŋ2-bi ha-ba-an-tar-re-eš: they ordered my city destroyed, decreed that its people be killed"}
      - {motif: immutable-divine-word, refs: ["ETCSL 2.2.2 167-168"], note: "an-ne2 dug4-ga-ni hur nu-kur2-ru-dam, {d}mu-ul-lil2-le ka-ta e3-a-ni šu nu-bal-e-de3: An's command is never changed; what goes out from Enlil's mouth is not altered"}
      - {motif: storm-of-divine-wrath, refs: ["ETCSL 2.2.2 136-138"], note: "ud-ba ud ne-en ba-sag3-sag3-ga-ba ... ba-dim2-dim2-ma-ba: when this storm was created"}
      - {motif: kirugu-gisgigal-song-structure, refs: ["ETCSL 2.2.2 169-171"]}
    hints:
      - "Compare Gen 18:23-32 (Abraham pleads for Sodom) and Exod 32:11-14, Amos 7:1-6 (intercession that does or does not avert destruction); contrast Jer 15:1 (even Moses and Samuel could not turn my heart)."
      - "Compare Isa 45:23; 55:11 (the word that goes out from my mouth shall not return) and Num 23:19."
  - id: ane-etcsl-2-2-2-k5-enlil-calls-storm
    tradition: ane-sumerian
    title: "Kirugu 5: Enlil calls the storm; fire, darkness and the sunless day cover Urim like a cloak (Lament for Urim 172-206)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Sumerian"
    read: ["ETCSL 2.2.2 172-206"]
    tags:
      - {motif: storm-deluge-as-divine-weapon-on-land, refs: ["ETCSL 2.2.2 172-182", "ETCSL 2.2.2 198"], note: "{d}en-lil2-le ud-de3 gu3 ba-an-de2 uŋ3-e še am3-ša4: Enlil called the storm, the people groan (refrain); ud a-ma-ru-gin7 uru2 i3-gul-gul-e: the storm destroys the city like a flood (amaru)"}
      - {motif: storm-entrusted-to-storm-keeper, refs: ["ETCSL 2.2.2 176", "ETCSL 2.2.2 179"], note: "kin-gal-ud-da ud-da gub-ba šu-na im-ma-an-šum2: he gave the storm into the hand of Kiĝgaluda; {d}en-lil2-le {d}gibil a2-tah-a-ni mu-na-ni-in-kur9-re: Enlil brought in Gibil (fire) as his helper"}
      - {motif: divine-word-destroys-city, refs: ["ETCSL 2.2.2 202"], note: "ud hul gig dug4-ga {d}en-lil2-la2: the evil storm ordered by Enlil"}
      - {motif: day-of-the-lords-anger, refs: ["ETCSL 2.2.2 185-191"], note: "an-na ur2-ba kana6 mu-un-ni10-ni10: darkness surrounds the base of heaven; fire burns at the storm's front; the midday heat"}
      - {motif: sun-does-not-rise-in-catastrophe, refs: ["ETCSL 2.2.2 190"], note: "kalam-ma ud zalag-ga la-ba-an-e3 mul an-usan6-gin7 ba-zal: in the land the bright sun did not rise; it shone only like the evening star"}
      - {motif: hail-and-fire-from-heaven, refs: ["ETCSL 2.2.2 186-188", "ETCSL 2.2.2 192"], note: "izi mu-un-bar7-bar7-e; šika bar7-bar7-re-da: fire burning, hot potsherds (or hail) and dust"}
      - {motif: storm-covers-city-like-cloak, refs: ["ETCSL 2.2.2 203"], note: "urim2{ki}-ma tug2-gin7 ba-e-dul gada-gin7 ba-e-bur2: it covered Urim like a garment, was spread over it like linen"}
      - {motif: black-headed-people, refs: ["ETCSL 2.2.2 193"], note: "saŋ gig2-ga tum9-tum9 ba-an-dal: the black-headed people were blown away by the winds"}
      - {motif: kirugu-gisgigal-song-structure, refs: ["ETCSL 2.2.2 204-206"]}
    hints:
      - "Compare Amos 8:9 and Joel 2:2, 10 (day of darkness, sun dark at noon) and Zeph 1:15."
      - "Compare Jer 4:11-13 (a hot wind from the bare heights; chariots like the whirlwind) and Ps 18:8-15."
  - id: ane-etcsl-2-2-2-k6-sack-of-urim
    tradition: ane-sumerian
    title: "Kirugu 6: the city made ruin mounds; corpses in gates and streets; families torn apart; Elam sacks Ekišnuĝal (Lament for Urim 207-253)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Sumerian"
    read: ["ETCSL 2.2.2 207-209A", "ETCSL 2.2.2 210-253"]
    tags:
      - {motif: city-made-eternal-tell, refs: ["ETCSL 2.2.2 207-208", "ETCSL 2.2.2 245"], note: "a-a {d}nanna uru2-ni du6-du6-da ba-da-an-ŋar: father Nanna's city was turned into ruin mounds"}
