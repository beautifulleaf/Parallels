      - {motif: men-snared-like-fish-and-birds, refs: ["ETCSL 2.5.4.13 sa–jara.D:7"], note: "kur-kur ku6-gin7 ... saŋ keše2-bi ma-ra-an-šum2: he gave you the foreign lands to bind by the head like fish"}
