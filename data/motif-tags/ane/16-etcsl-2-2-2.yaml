      - {motif: king-titulary-of-four-cities, refs: ["ETCSL 2.5.4.27 22-25"], note: "{d}iš-me-{d}da-gan u2-a nibru{ki}-a, saŋ us2 urim2{ki}-ma, ud-da gub eridug{ki}-ga, en unug{ki}-ga lugal i3-si-in{ki}-na"}
