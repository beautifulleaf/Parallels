      - {motif: slain-like-trapped-gazelle-mouth-in-dust, refs: ["ETCSL 2.2.2 219"], note: "maš-da3 ŋiš-bur2-ra dab5-ba-gin7 ka sahar-ra bi2-in-us2"}
