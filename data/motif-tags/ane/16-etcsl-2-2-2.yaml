  # ---------------- ETCSL 3.3.07 ----------------
  - id: ane-etcsl-3-3-07-ugubi-to-his-mother
    tradition: ane-sumerian
    title: "Letter from Ugubi to his mother: 'Traveller, tell my mother': I sit behind the door of the chief musician's house in Urim, starving; bread and beer are not fresh"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Sumerian"
    read: ["ETCSL 3.3.07 1-11"]
    tags:
      - {motif: letter-opening-say-to-my-lord, refs: ["ETCSL 3.3.07 1-3"], note: "lu2 di lu2 di ama-ŋu10-ra du du u3-na-dug4: traveller, traveller, go to my mother and say to her: Ugubi says"}
      - {motif: letter-sends-for-supplies-from-journey, refs: ["ETCSL 3.3.07 6-10"], note: "ŋe26-e eŋer {ŋiš}ig e2 nar-gal-ka al-tuš-en ... nam-ba-da-ug7-en, ninda ba-ra-gibil-la2 kaš ba-ra-gibil-la2: I sit behind the door of the chief musician's house; I am about to die; no fresh bread, no fresh beer; do not let the traveller go empty-handed"}
      - {motif: urim-origin-of-human-seed, refs: ["ETCSL 3.3.07 4-5"], note: "Interpretive: urim2{ki} iri giri17-zal {d}nanna-kam, eridug{ki} iri he2-ŋal2 {d}en-ki-ka3-ka: Urim, Nanna's city of joy; Eridug, Enki's city of plenty (an irony on his hunger)"}
      - {motif: letter-closing-may-my-lord-know, refs: ["ETCSL 3.3.07 11"], note: "a-ma-ru-kam"}
    hints:
      - "Compare Luke 15:14-17 (the son far from home in want, recalling his father's bread)."
