      - {motif: king-named-by-high-god, refs: ["ETCSL 2.5.4.19 4"], note: "en mu dug3 sa4-a-ni kur šar2-ra pad3-da: lord named with a good name, chosen from the multitude"}
      - {motif: fleet-footed-as-gazelle, refs: ["ETCSL 2.5.4.19 9-19"], note: "šul ur-saŋ er9 dub3-ŋal2-e-ne-ke4: young hero, mightiest of runners; ŋi6 an-bar7-ba gub-bu muš3 nu-tum2-mu: unwearied night and midday; like a horse on the road, like a wild goat running (maš2-tarah-gin7 kaš4-kaš4-e), knees untiring"}
      - {motif: statue-of-king-as-runner, refs: ["ETCSL 2.5.4.19 23-25"], note: "{urud}alan mir-re-e kaš4-kaš4-e hu-luh-ha-na, e2-ni2-guru3 barag kal-kal-la-na mu-ni-in-gub: he set up a copper statue of himself running like the wind in the Eniguru"}
      - {motif: king-statue-set-before-god, refs: ["ETCSL 2.5.4.19 23-28"], note: "set before Enlil, whose word is not altered, so that he looks on the true shepherd with a faithful eye"}
      - {motif: curse-on-who-alters-royal-monument, refs: ["ETCSL 2.5.4.19 29-32"], note: "lugal a2 niŋ2-hul dim2-ma ib2-ši-aŋ2-e-a, mu-sar-ra-ba šu bi2-ib2-ra-a mu-ni bi2-ib2-sar-a ... lu2-ba {d}en-lil2 ... {d}nin-lil2 ... nam ha-ba-an-da-ku5-ru-ne: the king who plans evil, strikes the inscription, writes his own name, or gets a stranger to do it: may Enlil and Ninlil curse him"}
      - {motif: curse-fertility-gods-withdraw-abundance, refs: ["ETCSL 2.5.4.19 33-34"], note: "{d}en-ki {d}iškur {d}ezina2 {d}šakkan2 en he2-ŋal2-la-ke4-ne he2-ŋal2 an ki-a a-ba-da-an-gi4-eš"}
      - {motif: black-headed-people, refs: ["ETCSL 2.5.4.19 6"], note: "saŋ gig2 šu mu-na-šum2-ma: the black-headed handed over to him"}
    hints:
      - "Compare Deut 27:17 and Prov 22:28 (boundary-stone curses), Deut 28:23-24 (heaven bronze, no rain) and Rev 22:18-19 (curse on altering the book)."
      - "Compare 2 Sam 2:18 (Asahel swift as a gazelle) and 2 Sam 18:19-27 (runners)."
  # ---------------- ETCSL 2.5.4.21: Išme-Dagan U ----------------
  - id: ane-etcsl-2-5-4-21-dagan-adab-ishme-dagan
    tradition: ane-sumerian
    title: "Adab to Dagan for Išme-Dagan: E-kur, Egalmah, the lord with great powers of heaven and earth (Išme-Dagan U, fragments)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Sumerian"
    read: ["ETCSL 2.5.4.21"]
    tags:
      - {motif: king-begotten-as-gods-son, refs: ["ETCSL 2.5.4.21 sa–jara.A:5", "ETCSL 2.5.4.21 sa–jara.A:14"], note: "{d}iš-me-{d}da-gan dumu {d}en-lil2-la2; {d}da-gan sipad {d}iš-me-da-gan-na: Dagan's shepherd"}
      - {motif: king-as-great-tree-and-shade, refs: ["ETCSL 2.5.4.21 sa–jara.A:7"], note: "nun-ne2 {ŋiš}meš3 pa mul-la: the prince, a mes tree with shining branches (fragmentary)"}
      - {motif: prayer-for-kings-long-life, refs: ["ETCSL 2.5.4.21 sa–jara.A:3-4", "ETCSL 2.5.4.21 sa–jara.A:8"], note: "ur2 kug til3 niŋ2 dug3 dirig-zu-še3; bal dug3-bi-še3; nam-til3-la-ni dug3-ge daŋal"}
      - {motif: deity-holds-all-divine-powers, refs: ["ETCSL 2.5.4.21 uru.C:16-17"], note: "{d}da-gan en mah me an-na me ki: Dagan, great lord of the divine powers of heaven and earth"}
      - {motif: gods-look-to-high-gods-as-parents, refs: ["ETCSL 2.5.4.21 sa–jara.A:2"], note: "Interpretive: šu il2-la-zu-še3 diŋir gal-gal-e-ne: the great gods (turn) to your raised hand"}
      - {motif: royal-hymn-genres-catalogue, refs: ["ETCSL 2.5.4.21 uru.C:19-20"], note: "a-da-ab {d}da-gan-kam"}
