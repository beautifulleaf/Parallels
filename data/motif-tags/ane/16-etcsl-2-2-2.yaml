    tags:
      - {motif: deity-holds-all-divine-powers, refs: ["ETCSL 2.5.4.08 sa–gida.A:1-2", "ETCSL 2.5.4.08 sa–gida.A:12"], note: "me gal-gal-la šu du7: perfecter of the great divine powers; me-zu me-a dirig"}
      - {motif: god-awe-fills-heaven-and-earth, refs: ["ETCSL 2.5.4.08 sa–gida.A:3-4"], note: "ni2-zu an ki-a pa e3: your terror shines in heaven and earth; diŋir an-na an-na bi2-su8-ug: the gods of heaven stand (in awe) in heaven"}
      - {motif: divine-council, refs: ["ETCSL 2.5.4.08 sa–gida.A:7-8", "ETCSL 2.5.4.08 sa–gida.A:10"], note: "{d}a-nun-na diŋir gal-gal-bi igi-zu-uš si mu-sa2-e-eš ... ŋizzal im-ši-ma-an-ak-eš: the Anuna, the great gods, turn to you and listen to your holy word"}
