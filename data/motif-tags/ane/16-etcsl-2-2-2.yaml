      - {motif: temple-field-diverted-to-ration-holders, refs: ["ETCSL 3.3.05 Ver.1:3-6"], note: "a-šag4 da-ab-ta{ki} ... eš2-gar3 {d}en-lil2 u3 {d}nin-urta {d}nin-lil2 ... šukur2 lu2 niŋ2-dab5-ba-ke4-ne: the Dabta field, assigned work of Enlil, Ninurta and Ninlil, from which ration plots are taken by men with requisitions"}
      - {motif: commander-requests-workmen-and-troops, refs: ["ETCSL 3.3.05 Ver.1:8-10"], note: "tukum-bi lugal-me an-na-kam ra-gaba hu-mu-ši-in-gi4-gi4-ma: if my king agrees, may he send a rider to mark the field's boundary"}
      - {motif: letter-closing-may-my-lord-know, refs: ["ETCSL 3.3.05 Ver.1:12-15"], note: "erin2 tah-hu-um engar šag4-gud lu2 {ŋiš}apin-na nu-me-a ... al i3-ak-en-de3-en lugal-me he2-en-zu: with no ploughmen or ox-drivers we work with the hoe; may my king know"}
