# Full read of the ANE corpus, chunk 22: GulaHymn SB ... Ludlul SB (Bullussa-rabi's Hymn to Gula, Syncretistic Hymn to Gula,
# Descent of Ishtar NA and SB, Ishtar 2, Syncretistic Hymn to Ishtar, Lipit-Eshtar A (Sumerian), Ludlul bel nemeqi).
# Read from the eBL reconstructed (normalized) texts; eBL's English translations and lemma glosses used as reading aids.
new_motifs:
  # --- hymns to Gula ---
  goddess-self-praise-under-many-names: {label: "A goddess praises herself in the first person in strophes, each ending 'DN am I' with a different goddess's name (Nintinugga, Ninkarrak, Bau, Ninsun ...), so that the names are all hers", cluster: hymn}
  goddess-praises-husband-under-many-names: {label: "In each strophe the goddess praises her husband, the warrior god, under a different name (Ninurta, Ningirsu, Ninazu, Zababa, Lugalbanda ...)", cluster: hymn}
  warrior-god-as-farmer-behind-plow: {label: "The warrior god is also the divine farmer who walks behind the ox, holds the plow, heaps grain and resettles abandoned mounds", cluster: agriculture}
  goddess-of-plowing-measuring-and-accounts: {label: "A goddess is mistress of seed, plow, ox-driver, measuring cord and rod, and carries a stylus to keep the accounts", cluster: agriculture}
  goddess-chosen-as-bride-of-warrior-god: {label: "The high god's warrior son sees the goddess, falls in love with her and takes her as bride, entrusting her with his temple's management", cluster: divine-family}
  healing-goddess-revives-the-moribund: {label: "At the healing goddess's look the dying revives and at her word the feeble rises; she brings the dead back from the netherworld", cluster: healing}
  healing-goddess-with-satchel-of-incantations: {label: "The healing goddess wears at her waist a satchel of life-saving incantations, carries herbs, scalpel, clean dressing and soft bandage", cluster: healing}
  medicine-as-secret-of-gods-given-by-ea: {label: "The wise god Ea gives the healing goddess his wisdom, the tablet stylus and the physician's craft, 'a secret of the gods'", cluster: healing}
  goddess-is-physician-diviner-exorcist: {label: "The goddess combines all the expert crafts: physician, diviner, exorcist, accountant whose tablets no one need correct", cluster: healing}
  goddess-adorned-and-seductive-to-husband: {label: "The goddess describes her jewellery, headband, bracelets and allure as she is escorted to her husband's bed", cluster: love}
  warrior-god-launcher-of-deluge: {label: "The warrior god is 'launcher of the deluge' (abubu), a battle-flood and storm that overwhelms mountain and sea", cluster: theophany}
  goddess-asked-to-intercede-with-husband: {label: "The worshipper asks the goddess to intercede for him with her mighty husband, so that he grants recovery", cluster: prayer}
  mourning-garment-exchanged-for-clean: {label: "Prayer that the sufferer may strip off his mourning garment (karru) and put on ordinary clothes again", cluster: prayer}
  author-names-himself-in-hymn: {label: "The composer or petitioner names himself within the hymn (acrostic or closing petition)", cluster: hymn}
  goddess-creator-of-heaven-and-earth: {label: "A goddess is herself said to have created heaven and earth, the mountains and everything that has a name", cluster: creation}
  great-gods-each-endow-goddess: {label: "Anu, Enlil and Ea in turn endow the goddess with strength, rule over mankind, and wisdom", cluster: hymn}
  goddess-identified-with-many-goddesses: {label: "A goddess is equated in a litany with a long series of other named goddesses, each with her epithet (syncretistic hymn)", cluster: hymn}
  goddess-removes-misdeeds-and-hears-prayer: {label: "The goddess removes people's misdeeds, dispels their wrongdoings, hurries to a cry and listens to prayers, giving health", cluster: prayer}
  goddess-wise-by-leave-of-each-great-god: {label: "Litany 'by leave of DN' (itti DN): by leave of Anshar, Enlil, Ea, Marduk, Nabu, Ninurta the goddess has her wisdom, destinies and rule", cluster: hymn}
  # --- Descent of Ishtar ---
  threat-to-raise-dead-to-devour-living: {label: "A deity threatens to break the netherworld gate and raise up the dead to devour the living, so the dead outnumber the living", cluster: underworld}
  underworld-queen-laments-untimely-dead: {label: "The queen of the dead laments that she must weep for young men torn from their wives, girls torn from lovers and infants taken before their time", cluster: underworld}
  goddess-afflicted-with-sixty-diseases: {label: "The underworld queen has her vizier let loose sixty diseases against the intruding goddess, eye, side, foot, heart and head disease, against all of her", cluster: underworld}
  fertility-ceases-while-goddess-in-underworld: {label: "While the love goddess is in the netherworld, bull does not mount cow, ass does not impregnate jenny, man does not impregnate woman; each sleeps alone", cluster: underworld}
  ea-creates-envoy-to-trick-underworld-queen: {label: "The wise god creates a being (an assinnu, impersonator) and sends him to the netherworld to make its queen swear by the great gods and to ask for the waterskin of life", cluster: underworld}
  queen-of-dead-curses-envoy-with-outcast-fate: {label: "The tricked underworld queen curses the envoy: bread of the city's plowing for food, the sewer for drink, the shadow of the wall and the threshold for home, slapped by drunk and sober", cluster: underworld}
  ransom-or-return-from-underworld: {label: "The released goddess must pay a ransom (napṭiru) or be brought back to the netherworld", cluster: underworld}
  ritual-wailing-for-tammuz: {label: "Tammuz (Dumuzi) is bathed, anointed and dressed in red; wailing men and women and the lapis flute accompany his annual coming up, and the dead come up to smell the incense", cluster: cult}
  sister-grieves-for-dying-god: {label: "The dying god's sister (Belili / Geshtinanna) hears the wailing for her brother and cries 'Do not rob me of my only brother!'", cluster: underworld}
  # --- Ishtar hymns ---
  goddess-wings-are-the-winds: {label: "The goddess's spread wings are the south wind and her open legs the face of the north wind: she embodies the four winds", cluster: cosmology}
  sufferer-confesses-unknown-sins: {label: "The sufferer confesses a list of sins, including ones committed unknowingly: negligence, broken oaths, disregarded rites", cluster: sin}
  sufferer-like-tottering-wall: {label: "The sick sufferer is like a tottering wall about to fall, or his stature is toppled like a wall", cluster: lament}
  family-assembles-mourners-for-living-sick-man: {label: "The sick man's family already gathers mourners and wails over him while he still lives", cluster: lament}
  deity-asked-to-pity-like-father-and-mother: {label: "The petitioner asks the deity to have pity on him like the father who begot him and the mother who bore him", cluster: prayer}
  goddess-frees-captive-lights-prison: {label: "The goddess frees the captive, releases the man in bonds and shows light to the one in prison", cluster: prayer}
  gods-called-to-bow-to-goddess: {label: "The gods are called to bow down and prostrate themselves before the goddess, who alone is supreme", cluster: hymn}
  goddess-as-net-and-noose: {label: "The goddess is a fine-meshed net, a seine from which no bird escapes, the noose of heaven and netherworld", cluster: hymn}
  secret-knowledge-for-initiates-only: {label: "Colophon rule: the expert may show the text to an expert; one who is not an expert may not see it", cluster: scribal}
  # --- Lipit-Eshtar A ---
  king-as-cedar-sapling: {label: "The king raises his head like a cedar sapling", cluster: kingship}
  king-as-farmer-shepherd-fisher-provider: {label: "The king is the farmer who heaps grain, the shepherd who makes cream and milk plentiful, the one who fills the marsh with fish and birds and brings water to the river", cluster: kingship}
  king-as-humble-supplicant: {label: "The king presents himself as one who presses a goat to his chest as offering, puts his hand to his nose in humility and stands in supplication", cluster: kingship}
  # --- Ludlul ---
  god-furious-by-night-relenting-by-day: {label: "The god is furious in the night and pacified by day; his anger is a tempest and deluge, his breeze gentle as the morning", cluster: theology}
  heavy-hand-gentle-grasp: {label: "The heavens cannot bear the weight of the god's hand, yet his grasp is gentle to rescue the moribund", cluster: theology}
  god-turns-like-mother-or-cow-with-calf: {label: "The angry god charges like a wild bull but turns back like a mother, like a cow with its calf", cluster: theology}
  god-wounds-with-scourge-heals-with-bandage: {label: "The god's scourge is barbed and pierces the body, but his bandages are soothing and heal the doomed", cluster: theology}
  no-god-understands-high-gods-ways: {label: "None among the gods can comprehend the high god's ways or understand his mind; he alone divines the gods' thoughts", cluster: theology}
  saved-sufferer-will-teach-people: {label: "The rescued sufferer resolves to testify to the god's anger and teach the people that their salvation is near", cluster: thanksgiving}
  personal-god-and-protective-spirits-desert-sufferer: {label: "The sufferer's own god and goddess abandon him; his protective spirits (shedu, lamassu) veer off and seek someone else", cluster: lament}
  omens-and-dreams-confused-for-sufferer: {label: "The sufferer's omens are contradictory every day, diviner and dream interpreter cannot resolve his case, street talk and dreams portend evil", cluster: divination}
  king-turns-against-loyal-courtier: {label: "The king's heart hardens against his loyal official; courtiers conspire, each vowing to seize his life, post, office or household", cluster: court}
  seven-courtiers-conspire: {label: "A clique of seven courtiers, one after another, swears to destroy the official and share out his position", cluster: court}
  speech-of-sufferer-muzzled: {label: "The once eloquent sufferer is muzzled as with a snaffle; his lips fall silent, he becomes like a deaf-mute", cluster: lament}
  proud-man-humbled-to-servility: {label: "The man who walked proudly learns to slink; his proud head bends to the ground, his broad chest is pushed aside by a youth", cluster: lament}
  pointed-at-in-the-street: {label: "The sufferer is pointed at in the street, eyed askance in the palace; his own city glowers at him like an enemy", cluster: lament}
  slaves-curse-their-fallen-master: {label: "The sufferer's own slave curses him in the assembly and his slave girl slanders him before the crowd", cluster: lament}
  slanderer-prospers-sympathizer-dies: {label: "Whoever spoke well of the sufferer fell into a pit and whoever said 'Mercy on him' died quickly, while his slanderer prospered with a god's help", cluster: theodicy}
  sufferers-goods-and-office-given-to-others: {label: "The fallen man's possessions are shared out among the riffraff, his fields and canals ruined and his offices given to a stranger", cluster: lament}
  ceaseless-lament-day-night-month-year: {label: "Sighing by day, lamentation by night, misery the month, despair the year: the sufferer's grief fills every unit of time", cluster: lament}
  hope-that-sun-will-shine-again: {label: "The despairing sufferer still hopes: 'some bright day good fortune will come, a new moon will appear, my sun will shine'", cluster: lament}
  god-will-not-show-his-face-to-sufferer: {label: "The sufferer calls to his god, who does not show his face; he prays to his goddess, who does not raise her head", cluster: lament}
  pious-man-treated-as-impious: {label: "The sufferer, who was punctilious in prayer, offerings, festivals and teaching reverence, is treated like one who neglected his god and goddess", cluster: theodicy}
  catalogue-of-neglect-of-gods: {label: "A list of the impious man's faults: no libations, no invocation at meals, no prostration, skipped holy days, flour offerings withheld, oaths sworn lightly", cluster: piety}
  good-to-man-offense-to-god: {label: "What is good to oneself may be an offense to a god, and what seems abominable to one's heart may be good to one's god", cluster: theodicy}
  who-can-learn-the-mind-of-god: {label: "Who can learn the reasoning of the gods in heaven's depths or fathom their counsel? Where could humans learn the ways of a god?", cluster: theodicy}
  human-mood-and-fortune-change-in-instant: {label: "He who lived yesterday died today; in an instant people go from gloom to song, from hunger like corpses to rivalling their gods", cluster: transience}
  demons-of-disease-rise-from-netherworld: {label: "The sufferer's diseases come as demons from the ends of heaven, the breast of the netherworld, the Apsu, the mountain: evil vapour, migraine, ghost, Lamashtu, ague", cluster: disease}
  disease-described-body-part-by-part: {label: "The sufferer's illness is described limb by limb: head, eyes, neck, chest, back, bowels, lungs, limbs, knees and feet each assailed", cluster: disease}
  demon-wears-sufferers-body-as-garment: {label: "A demon has clothed himself in the sufferer's body as in a garment", cluster: disease}
  eyes-see-not-ears-hear-not-in-illness: {label: "In his illness the sufferer's eyes look but do not see, his ears are open but do not hear", cluster: disease}
  sufferer-lies-in-own-excrement: {label: "The sick man spends the night in his own dung like an ox and wallows in his excrement like a sheep", cluster: disease}
  wasted-body-bones-stick-out: {label: "From lack of food the sufferer's flesh wastes, his blood dries, his bones stick out covered only with skin, his features are unrecognisable", cluster: disease}
  home-becomes-prison-of-sickbed: {label: "The sick man's bed is his confinement, his house his jail, his own flesh his manacle and fetter", cluster: disease}
  exorcist-and-diviner-fail-sufferer: {label: "The exorcist recoils from the symptoms and cannot diagnose them; the diviner gives no time limit to the illness", cluster: divination}
  tomb-prepared-before-death: {label: "The sufferer's tomb is opened and his grave goods set out; lamentation for him is complete before he has died", cluster: death}
  enemies-rejoice-at-sufferers-plight: {label: "When the sufferer's ill-wisher hears of his plight, his face lights up; the woman who wished him ill is glad", cluster: lament}
  three-dreams-announce-healing: {label: "The sufferer sees three dreams in succession, each with an extraordinary figure (young man, purification priest, fair young woman, bearded exorcist) sent by his god to announce his healing", cluster: revelation}
  dream-messenger-sent-by-god: {label: "A radiant figure in a dream says 'Your lord has sent me' (or 'Marduk has sent me') with a message of recovery", cluster: revelation}
  dream-exorcist-sprinkles-water-and-casts-spell: {label: "In a dream a priest sent from a holy city sprinkles the sufferer with consecrated water, casts a spell of life and rubs his body with a tamarisk", cluster: ritual}
  fear-not-said-to-sufferer: {label: "A divine figure tells the sufferer 'Fear not!' (la tapallah) and announces mercy: 'he has suffered greatly'", cluster: revelation}
  god-relents-and-disregards-sin: {label: "The god's heart is quieted; he accepts the entreaties, disregards the sin, removes the punishment and lets the wind carry away the faults", cluster: sin}
  demons-sent-back-to-their-origins: {label: "The god sends each disease-demon back where it came from: the vapour to the ends of heaven, the ghost to its dwelling, Lamashtu to the mountain, ague to the sea", cluster: disease}
  healing-described-body-part-by-part: {label: "The healing is narrated limb by limb in reverse of the illness: eyes, ears, nose, lips, mouth, teeth, tongue, throat, lungs, intestines, neck, nails restored", cluster: healing}
  river-ordeal-at-esagil: {label: "The restored sufferer passes the river ordeal, the place where people's fates are decided", cluster: law}
  slave-mark-removed: {label: "The sufferer's forehead is stroked and his slave mark (abbuttu) removed: freed from bondage", cluster: law}
  warning-to-impious-learn-from-me: {label: "The restored sufferer tells those who sinned against the temple and do not revere their god to learn from his example", cluster: thanksgiving}
  god-takes-sufferer-by-hand-and-lifts-head: {label: "In adversity the god takes the sufferer's hand, slaps him awake with the right hand and raises his head with the left", cluster: thanksgiving}
  god-disarms-attackers-and-gravediggers: {label: "The god makes the attacker drop his weapon, muzzles the lion, takes the sling from the stalker, the shovel from the gravedigger, the knife from the mourner", cluster: thanksgiving}
  pulled-back-from-river-of-death: {label: "The god rescued the sufferer from the pit and pulled him back from Hubur, the river of the netherworld", cluster: underworld}
  had-it-not-been-for-the-lord: {label: "'Had it not been that the lord released me, I would have gone down to the netherworld' as a refrain of thanksgiving", cluster: thanksgiving}
  procession-through-named-temple-gates: {label: "The restored man passes through a series of named temple gates, each bestowing what its name says (prosperity, life, release from guilt, pure water ...)", cluster: cult}
  kissed-foot-of-goddess: {label: "The worshipper kisses the feet of the goddess in her temple", cluster: cult}
  thanksgiving-sacrifice-and-feast-for-city: {label: "The rescued man offers incense, fatted oxen, sheep, beer and wine, and holds a feast for the people of the city", cluster: cult}
  onlookers-praise-god-who-revives: {label: "The citizens see how the god restores to life and proclaim: 'Who would have said he would see his sun again? Who but Marduk could revive him?'", cluster: thanksgiving}
  universal-call-to-praise-god: {label: "All who live, wherever earth and sky extend, sun rises, water runs and wind blows, all humankind formed from clay, are summoned to praise the god", cluster: hymn}
  humans-pinched-from-clay-by-goddess: {label: "Humans are those whose clay the birth goddess (Aruru) pinched off to form them", cluster: creation}
  who-has-seen-suffering-be-released: {label: "Closing blessing: may whoever has seen suffering have his punishment remitted and his distress relieved", cluster: thanksgiving}
  # --- added after vocabulary check ---
  deity-merciful-to-weak-enriches-destitute: {label: "The deity has mercy on the weak, enriches the destitute, gives life to whoever reveres her and makes straight the path of whoever seeks her ways", cluster: theology}
  daily-prostration-vow: {label: "The petitioner promises to kneel or prostrate himself before the deity every day if healed", cluster: prayer}
  goddess-holds-bond-of-heaven-and-earth: {label: "The goddess holds or is the 'bond of heaven and earth' (markas šamê u erṣeti)", cluster: cosmology}
  secret-lore-of-the-apsu: {label: "The deity possesses the secret lore of the gods, the hidden knowledge of the Apsu", cluster: wisdom}
  deity-grants-protective-spirit: {label: "The deity grants a protective spirit of good fortune (šēdu, lamassu) to the worshipper", cluster: cult}
  path-made-straight-by-deity: {label: "Where the deity is reconciled, path and way are made straight for the worshipper", cluster: theology}
  deity-controls-sea-and-deep: {label: "The deity empties the ocean, makes the floods of the deep swell or brings the flood", cluster: cosmology}
  temple-name-glossed-by-deity-act: {label: "Each temple's ceremonial name is matched by what the deity does there (in the House of Life she grants life)", cluster: cult}
  disobedient-bear-punishment: {label: "The deity is fierce to the intransigent; the disobedient bear her punishment", cluster: theology}
  without-deity-nothing-opens: {label: "Without the deity (ina balīša) the work of farmer and ox-driver, or the ways, are not opened", cluster: theology}
  dust-on-door-and-bolt-of-netherworld: {label: "Dust has gathered on the door and bolt of the netherworld and deathly silence lies over its beam", cluster: underworld}
  love-goddess-and-underworld-queen-are-sisters: {label: "The goddess of love and the queen of the netherworld are sisters", cluster: underworld}
  netherworld-ruled-by-age-old-rules: {label: "The netherworld is governed by 'age-old rules' (parṣū labīrūtu) applied to every entrant, even a goddess", cluster: underworld}
  repeated-question-and-ritual-answer: {label: "At each stage the same question ('Why did you take ...?') receives the same fixed answer ('Such are the rules of ...'), repeated as a refrain", cluster: style}
  anunnaki-seated-on-golden-thrones: {label: "The netherworld gods (Anunnaki) are brought out and seated on golden thrones, the thresholds decorated with cowries, for a judgement or release", cluster: underworld}
  goddess-compared-to-each-great-god: {label: "The goddess is likened in turn to each great god: her command like Anu's, her rays like Sîn's, her ears like Šamaš's, her fighting like Ninurta's, her roar like Adad's", cluster: hymn}
  sufferer-without-father-or-mother: {label: "The sufferer has no father, no mother and no in-laws to help him", cluster: lament}
  deity-angry-yet-quick-to-reconcile: {label: "The deity shows terror but knows how to save; her anger is close to reconciliation and after punishing she opens a way of relief", cluster: theology}
  madness-sent-by-gods-evil-wind: {label: "An evil wind of a god drives the sufferer to madness; he forgets himself and does not know his own mind", cluster: disease}
  diviners-should-not-waste-offerings: {label: "Plea that the dream interpreter and diviner not use up the sick man's offerings in vain: let the deity turn to him", cluster: divination}
  sufferer-confesses-rash-speech: {label: "The sufferer confesses that his lips spoke blasphemous or improper words and insults", cluster: sin}
  penitent-bears-yoke: {label: "The penitent says he bears a punishment and pulls a yoke of his negligences", cluster: sin}
  goddess-gives-offspring-to-worshippers: {label: "Those who kneel to the goddess receive from her hand offspring and progeny", cluster: fertility}
  youngest-takes-share-of-seven-brothers: {label: "A young deity gathers to himself the shares of his seven brothers (seven cities)", cluster: divine-family}
  guilt-absolved-on-day-of-justice: {label: "The god pronounces one guilty, but on the day of his justice liability and transgression are absolved", cluster: sin}
  driven-from-own-house: {label: "The afflicted man is forced out of his house and wanders outside", cluster: lament}
  no-helper-at-side: {label: "The sufferer has no one to walk at his side and sees no champion or helper", cluster: lament}
  eyes-worn-out-from-weeping: {label: "From constant crying the sufferer's eyes are strained and his cheeks burn with tears", cluster: lament}
  prayer-in-disarray: {label: "The sufferer's supplication is chaotic like a bursting flame, his entreaty discord; honeyed words stick in his mouth", cluster: lament}
  divine-woman-appears-in-dream: {label: "A beautiful young woman, like a goddess and queen among people, enters to the dreamer, sits beside him and speaks mercy", cluster: revelation}
  attendants-flee-in-fear: {label: "When the visionary tells his attendants what he saw, they fall silent and run away", cluster: revelation}
  healing-sign-revealed-to-people: {label: "The divine messenger reveals a favourable sign to the sufferer's people and the illness ends quickly", cluster: revelation}
  outcast-with-overgrown-nails: {label: "The sufferer's nails had grown long like an outcast's and are pared when he is restored", cluster: disease}
  neck-planted-upright-like-tree: {label: "The sagging neck of the sufferer is shored up like a hillside and planted upright like a tree", cluster: healing}
  sloughs-off-like-snake: {label: "The restored man slips out (of his sickness) like a snake sloughing its skin", cluster: healing}
  darkness-turned-to-light: {label: "The god turns the sufferer's darkness into light and makes his gloom shine", cluster: healing}
  walks-free-in-redemption: {label: "The released man walks along a named street of the city in a state of redemption (pišertu)", cluster: thanksgiving}
  purification-washing-after-recovery: {label: "The restored man washes his matted hair and bathes in an ablution of renewal", cluster: ritual}
  offerings-to-temple-doors-and-bolts: {label: "Offerings and libations are made to the temple's protective spirits and to its threshold, bolt socket, bolt and doors", cluster: cult}
  king-blessed-with-long-life-and-roots: {label: "Blessing on the king: long reign, roots stretching forth and branches burgeoning in the shadow of the temple", cluster: kingship}
units:
  # ================= GulaHymn SB: Bullussa-rabi's Hymn to Gula =================
  - id: ane-gulahymn-sb-1-nintinugga-and-ninurta
    tradition: ane-akkadian
    title: "Gula's self-praise as Nintinugga; her husband Ninurta, slayer of Anzu (Gula Hymn 1-17)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    version: Standard Babylonian
    read: ["GulaHymn SB –:1-17"]
    tags:
      - {motif: divine-self-praise-i-am, refs: ["GulaHymn SB –:2-5"], note: "etellēku bēlēku šūpâku u ṣīrāku: 'I am noble, I am lordly, I am splendid and sublime'"}
      - {motif: goddess-self-praise-under-many-names, refs: ["GulaHymn SB –:8"], note: "šuʾu rabû nintinugga: 'my great name is Nintinugga'"}
      - {motif: goddess-praises-husband-under-many-names, refs: ["GulaHymn SB –:9-17"]}
      - {motif: catalogue-of-slain-monsters, refs: ["GulaHymn SB –:13-14"], note: "nāʾer anzî ... hāmim paraṣ enlilūti: he slew Anzu and took back the power of Enlilship"}
      - {motif: king-son-of-enlil, refs: ["GulaHymn SB –:9", "GulaHymn SB –:16-17"], note: "of the god Ninurta: mār enlil gašru, apil ešarra"}
    hints:
      - "Compare Ps 91:1-16 and Exod 15:26 (God as healer); the healing deity's self-predication resembles Isa 45:5-7 'I am YHWH and there is no other'."
  - id: ane-gulahymn-sb-2-ninmadiriga-bride-and-farmer
    tradition: ane-akkadian
    title: "Chosen as Ninurta's bride; the farmer-god and Gula as Nanše of the field boundary (Gula Hymn 18-43)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    version: Standard Babylonian
    read: ["GulaHymn SB –:18-43"]
    tags:
