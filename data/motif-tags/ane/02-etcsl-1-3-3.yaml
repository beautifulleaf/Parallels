# Full read of the ANE corpus, chunk 2: ETCSL 1.3.3 - 1.6.1 (Sumerian narratives about Inana, Dumuzid, Nanna-Suen and Ninurta).
# Read from the ETCSL composite transliterations; ETCSL's English prose used as a reading aid only.
new_motifs:
  deity-holds-all-divine-powers: {label: "A deity is praised as one who fully possesses all the great divine powers (me)", cluster: divine-epithets}
  deity-inspects-land-to-tell-just-from-wicked: {label: "A deity goes out (up into the mountains) to detect falsehood and justice and tell the criminal from the just", cluster: theodicy}
  narrative-refrain-what-did-one-say: {label: "A narrative refrain punctuates the story: 'What did one say to another? What further did one add?'", cluster: literary-form}
  deity-abandons-heaven-earth-and-temples: {label: "A deity abandons heaven, earth and a list of named temples to go elsewhere (into the mountains or the underworld)", cluster: underworld}
  god-instructs-bird-to-do-human-work: {label: "A god gives instructions to a bird (the raven), which then performs the work of a man", cluster: animals}
  raven-invents-date-palm-cultivation: {label: "The raven plants, climbs and pollinates the first date palm and works the shadouf, an origin of date cultivation", cluster: civilization}
  date-palm-every-part-useful: {label: "Every part of the date palm (fronds, shoots, branches, dates) is listed with its use for king and temples", cluster: civilization}
  gardener-uproots-all-plants: {label: "An incompetent gardener destroys every plant he was meant to water, pulling them out by the roots", cluster: primeval}
  mortal-glimpses-gods-at-horizons: {label: "A mortal looks east and west and sees the gods of sunrise and sunset, and a lone goddess", cluster: revelation}
  single-tree-with-unchanging-shade: {label: "A single shade tree whose broad shade does not change from morning to evening", cluster: nature}
  weary-goddess-sleeps-under-tree: {label: "A goddess wearied by travelling around heaven and earth lies down to sleep under a tree", cluster: myth}
  mortal-rapes-sleeping-goddess: {label: "A mortal has intercourse with a goddess while she sleeps, then slinks back to his plot", cluster: transgression}
  victim-wakes-and-inspects-herself: {label: "On waking at sunrise the victim examines herself and discovers what was done to her", cluster: transgression}
  plague-on-whole-land-for-one-mans-crime: {label: "A whole land is struck with a plague because of one man's hidden crime", cluster: punishment}
  goddess-searches-all-lands-for-culprit: {label: "The wronged deity searches all the lands for the man who violated her but cannot find him", cluster: punishment}
  three-escalating-plagues: {label: "Three successive plagues (blood, storm, blocked roads) are sent while the culprit stays hidden", cluster: punishment}
  culprit-hides-among-city-crowd: {label: "A father tells his guilty son to go and live among his brothers in the city so that the avenging deity will not find him", cluster: punishment}
  deity-preceded-and-followed-by-storm-attendants: {label: "Storm winds and a flood go before a deity, a dust storm and attendants follow behind", cluster: theophany}
  seven-times-seven-attendants: {label: "Seven times seven helpers attend a deity", cluster: numbers}
  highways-of-land-blocked: {label: "A deity blocks the highways of the land so the people cannot travel", cluster: punishment}
  wronged-daughter-appeals-to-father-god: {label: "A wronged goddess prostrates herself before her father god and demands that he hand over the culprit", cluster: petition}
  deity-spans-sky-like-rainbow: {label: "A deity stretches herself like a rainbow across the sky, reaching to the earth", cluster: theophany}
  culprit-condemned-but-name-lives-in-song: {label: "A condemned man is told he will die, but his name will not be forgotten: it will be sung in songs by singers and shepherds", cluster: memory}
  closing-doxology-praise-is-sweet: {label: "A composition ends with a doxology to its deity: 'praise of X is sweet / magnificent' (za3-mi2)", cluster: literary-form}
  armed-crowd-follows-upstart: {label: "Many armed men follow an upstart in the streets of the city and sit before him", cluster: rebellion}
  slaps-thigh-in-dismay: {label: "A figure slaps his or her thigh in dismay or grief on hearing bad news", cluster: gesture}
  rampage-in-holy-city-ended-by-humble-man: {label: "A rampaging warrior wrecks the temple beams and kills many in the city until a humble man (a junior fisherman) strikes him down", cluster: rebellion}
  defeated-begs-life-offering-flocks: {label: "A defeated foe begs for his life, promising to fill the god's pens and folds with cattle and sheep", cluster: rebellion}
  goddess-plots-to-capture-heaven-temple: {label: "A goddess sets her mind on seizing the great heaven (An's temple E-ana) from the sky god", cluster: hubris}
  oath-by-life-of-heaven: {label: "A god swears by the life of heaven and by the life of his own throne", cluster: oath}
  storm-raised-to-sink-boat: {label: "A storm wind and evil wind are raised against a goddess's boat; barges will sink in the marshes", cluster: sea}
  goddess-tramples-scorpion: {label: "A goddess stamps on a scorpion and cuts off its tail; it roars like a lion then falls silent", cluster: combat}
  sky-god-laments-child-greater-than-he: {label: "The sky god slaps his thigh and sighs: 'What has my child done? She has become greater than me!'", cluster: hubris}
  day-length-changed-etiology: {label: "A cosmic change in the length of day and night is fixed from that day on (day equal to night)", cluster: cosmology}
  and-it-was-so-fulfilment-formula: {label: "A decree is followed by the formula 'and so it was / it truly became so' (ur5 he2-en-na-nam)", cluster: literary-form}
  temple-captured-from-heaven-named-and-made-firm: {label: "A temple brought down from heaven is made firm as heaven, given a name, and all people bow at its feet", cluster: temple}
  deity-sets-mind-on-great-below: {label: "From the great heaven a deity sets her mind on the great below (the underworld)", cluster: underworld}
  goddess-adorns-for-journey: {label: "A goddess puts on a catalogue of ornaments (turban, wig, beads, pectoral, ring, garment, eye-paint) before a journey", cluster: adornment}
  eye-paint-named-let-a-man-come: {label: "Cosmetics and jewels carry seductive names ('Let a man come', 'Come, man, come')", cluster: adornment}
  instructions-to-servant-if-not-returned: {label: "Before a perilous journey the deity instructs a faithful minister what to do if she does not return", cluster: underworld}
  mourner-wears-single-garment-like-pauper: {label: "A mourner dresses in a single garment like a pauper and goes alone to the temple", cluster: mourning}
  lament-drum-and-rounds-of-temples: {label: "A mourner sets up a lament on the ruin mounds, beats the drum in the sanctuary and makes the rounds of the gods' houses", cluster: mourning}
  appeal-to-three-gods-in-succession: {label: "A petitioner goes to three great gods in turn (Enlil, Nanna, Enki); the first two refuse and the third helps", cluster: petition}
  precious-metal-not-in-dust-of-underworld: {label: "Plea not to let precious silver, lapis lazuli and boxwood (the goddess) be ruined in the dust of the underworld", cluster: underworld}
  plant-and-water-of-life: {label: "A life-giving plant and life-giving water that restore the dead to life", cluster: life}
  deity-demands-gatekeeper-open: {label: "Arriving at a closed house or gate, a deity calls out to the doorkeeper by name: 'Open the house, open!'", cluster: temple}
  underworld-land-of-no-return: {label: "The underworld is the land of no return, the road whose traveller never comes back", cluster: underworld}
  seven-gates-of-underworld: {label: "The underworld has seven gates, bolted and opened one at a time", cluster: underworld}
  stripped-of-garment-at-each-gate: {label: "At each underworld gate one ornament or garment is removed until the goddess arrives naked", cluster: underworld}
  usurps-sisters-throne: {label: "The arriving goddess makes her sister rise from the throne and sits on it herself", cluster: underworld}
  seven-judges-gaze-of-death: {label: "Seven underworld judges give their verdict: their look is the look of death, their word the word of anger, their shout the shout of guilt", cluster: underworld}
  corpse-hung-on-hook: {label: "The slain body is turned into a corpse and hung on a hook (peg) on the wall", cluster: death}
  beings-created-from-dirt-under-fingernail: {label: "A god creates new beings from the dirt under his fingernail", cluster: creation}
  messengers-slip-in-like-flies-and-phantoms: {label: "Created emissaries slip through the door like flies and the door pivots like phantoms", cluster: underworld}
  underworld-queen-in-labour-pains: {label: "The queen of the underworld lies in pain over her children, uncovered, with dishevelled hair", cluster: underworld}
  sympathy-wins-a-favour: {label: "Visitors echo the sufferer's groans ('Oh my heart' / 'oh your heart') and so win her oath to grant a favour", cluster: wisdom}
  refuse-offered-gifts-ask-only-the-body: {label: "Offered a river and a field of grain, the envoys refuse every gift and ask only for the corpse", cluster: underworld}
  substitute-required-to-leave-underworld: {label: "No one leaves the underworld unscathed: one who ascends must provide a substitute in her place", cluster: underworld}
  demons-know-no-food-no-love: {label: "Underworld demons eat no food or offering, know no marital love or children, snatch wife from husband, son from knee, bride from her in-laws' house", cluster: underworld}
  loyal-mourner-spared-as-substitute: {label: "Those who mourned the goddess in dust and filthy garments are refused to the demons as her substitute", cluster: underworld}
  consort-fails-to-mourn: {label: "The goddess finds her husband not mourning but enthroned in magnificent garments", cluster: underworld}
  goddess-hands-husband-to-demons: {label: "The goddess fixes her husband with the look of death and gives him to the demons as her substitute", cluster: underworld}
  victim-transformed-to-snake-to-escape: {label: "A pursued man prays to the sun god, who turns his hands and feet into a snake's so he can escape the demons", cluster: transformation}
  goddess-weeps-tears-hair-for-husband: {label: "A goddess weeps bitterly for her lost husband, tears out her hair and asks 'Where is my man?'", cluster: mourning}
  animal-informant-rewarded-with-destiny: {label: "An animal (a fly) reveals where the hidden man is and is rewarded by the deity with a decreed destiny", cluster: animals}
  alternating-half-year-in-underworld: {label: "Two siblings each spend half the year in the underworld, one released when the other is taken", cluster: underworld}
  captive-in-foot-hand-neck-stocks: {label: "A captive is put in foot-stocks, hand-stocks and a neck-stock and threatened with copper spikes", cluster: punishment}
  victim-prays-to-sun-god-as-just-judge: {label: "A pursued victim raises his hands to the sun god: 'You are a just judge, do not fail me'", cluster: petition}
  demons-without-kin-know-not-good-from-evil: {label: "Demons have no mother, father, sister, brother, wife or child, and do not know good from evil", cluster: underworld}
  sister-silent-under-torture: {label: "A sister refuses, under torture, to reveal where her brother is hiding", cluster: loyalty}
  sister-offers-to-share-brothers-fate: {label: "A sister wanders the city like a bird for her brother and offers to take his misfortune on herself", cluster: loyalty}
  lament-refrain-at-named-places: {label: "A lament refrain is uttered place by place at a list of named sites (Arali, Bad-tibira, Du-šuba, the sheepfold)", cluster: mourning}
  girl-asks-mother-leave-to-go-to-lover: {label: "A young goddess in her mother's chamber asks her mother's leave to go out to her lover's sheepfold", cluster: love}
  shepherd-god-killed-by-robbers: {label: "The shepherd god is struck down (head beaten in) by robbers and his sheep led off by a stranger", cluster: death}
  widow-composes-lament-for-husband: {label: "A goddess composes and fashions a song of lament for her slain husband", cluster: mourning}
  slayer-turned-into-object: {label: "The killer is cursed and turned into an object (a waterskin) that serves travellers", cluster: transformation}
  water-and-flour-offerings-for-the-dead: {label: "Water is libated and flour sprinkled for the dead man wandering in the desert, to make him present", cluster: death}
  goddess-avenges-husband: {label: "A goddess proves her husband's equal by avenging his death on his killer", cluster: vengeance}
  god-sets-mind-on-parents-city: {label: "A god sets his mind on travelling to the city of his father and mother", cluster: pilgrimage}
  city-older-than-another-land: {label: "Boast that a city's palms grew 'before Dilmun existed', i.e. the city is older than another land", cluster: city}
  divine-boat-built-from-many-lands: {label: "A god's boat is built from materials fetched from named distant lands (reeds, pitch from the abzu, cedar, timber from Ebla)", cluster: boat}
  cargo-list-for-father-god: {label: "A long list of cattle, sheep, goats, rodents, birds, fish, eggs and reeds is brought as a gift to the father god's house", cluster: cult}
  six-hundred-ewes-goats-cows-give-birth: {label: "Six hundred ewes, she-goats and cows give birth when the males are let loose among them", cluster: fertility}
  boat-refuses-to-stop-on-the-way: {label: "At each city a goddess welcomes the passing boat with offerings, but the boat refuses to unload: 'I am going to Nibru'", cluster: pilgrimage}
  welcome-greeting-be-well: {label: "A boat or traveller is greeted with the repeated welcome 'Be well! Be well!' (silim-ma he2-me-en)", cluster: greeting}
  father-god-feasts-visiting-son: {label: "The father god rejoices and orders bread, sweet cakes and fine beer for his visiting son", cluster: feast}
  son-asks-father-god-for-abundance: {label: "Before leaving, the son asks the father god for fish, barley, reeds, game, syrup, wine and long life, and receives each", cluster: blessing}
  divine-warrior-monster-trophies: {label: "A divine warrior's slain monsters (six-headed ram, dragon, bison, Anzud bird, seven-headed serpent ...) are listed as his trophies", cluster: combat}
  trophies-hung-on-war-chariot: {label: "The victor hangs his captured beasts and slain monsters on the parts of his chariot", cluster: combat}
  divine-warrior-as-deluge: {label: "The divine warrior sweeps on like the deluge (a-ma-ru), a storm against the rebel land", cluster: combat}
  returning-warrior-asked-not-to-frighten-father: {label: "The chief minister meets the returning warrior and begs him not to frighten his father in his dwelling", cluster: combat}
  gods-flee-like-birds-hide-like-mice: {label: "Before the warrior the gods flee to the mountains, beat their wings like small birds and hide like mice", cluster: combat}
  named-weapons-of-divine-warrior: {label: "A divine warrior lists his personified, named weapons (Mows-down-a-myriad, Crushes-a-myriad, the fifty-headed mace ...)", cluster: combat}
  victor-washed-and-chariot-enshrined: {label: "The victor asks that his arms be washed with holy water, his chariot set on a pedestal, and captive kings bow to him", cluster: combat}
  city-exalted-birds-nest-refugees-in-shade: {label: "The god's city is to raise its head to heaven, be the freshwater well of the land, with birds nesting in it and refugees cool in its shade", cluster: city}
  high-god-bows-to-victorious-son: {label: "The high god himself makes obeisance to his victorious warrior son, and the warrior demands that all prostrate at his name", cluster: combat}
  barge-chant-a-u-a: {label: "A boatmen's work chant (a-u3-a) is repeated with the god's names as his barge sets out", cluster: boat}
  consort-intercedes-for-king: {label: "A god is asked to speak a favourable word for the king to his wife in the temple", cluster: petition}
units:
  - id: ane-etcsl-1-3-3-raven-and-palm
    tradition: ane-sumerian
    title: Inana goes up into the mountains; Enki's raven plants the first date palm (Inana and Šu-kale-tuda 1-90)
    corpus: ane
    original: true
    tagger: Claude (model), reading the Sumerian
    read: ["ETCSL 1.3.3 1-90"]
    tags:
      - {motif: deity-holds-all-divine-powers, refs: ["ETCSL 1.3.3 1-2", "ETCSL 1.3.3 11-12"], note: "in-nin me gal-gal-la; me šu am3-du7-du7"}
      - {motif: deity-inspects-land-to-tell-just-from-wicked, refs: ["ETCSL 1.3.3 6-8"], note: "niĝ2-erim2 niĝ2-si-sa2 zu-zu-de3 ... lul zid pad3-de3-de3 kur-ra ba-e-a-il2"}
      - {motif: narrative-refrain-what-did-one-say, refs: ["ETCSL 1.3.3 9-10", "ETCSL 1.3.3 13-14", "ETCSL 1.3.3 57-58", "ETCSL 1.3.3 89-90"], note: "i3-ne-eš2 lu2 lu2-ra a-na na-an-dug4"}
      - {motif: deity-abandons-heaven-earth-and-temples, refs: ["ETCSL 1.3.3 15-20"], note: "an mu-un-šub ki mu-un-šub; she leaves E-ana in Unug and the giguna in Zabalam for the mountains"}
      - {motif: god-instructs-bird-to-do-human-work, refs: ["ETCSL 1.3.3 49-55", "ETCSL 1.3.3 59", "ETCSL 1.3.3 69-71"], note: "ugax-mušen inim ga-ra-ab-dug4; mušen uga-gin7 a2 lu2 kiĝ2-kiĝ2-e 'a bird like the raven doing the work of a man'. Lines 42-48 broken; the speaker is Enki only by context."}
      - {motif: raven-invents-date-palm-cultivation, refs: ["ETCSL 1.3.3 63-77", "ETCSL 1.3.3 85-87"], note: "kohl (šembi-zid) of the Eridug incantation priests planted in a leek bed grows into a 'tree growing forever' (ĝiš da-ri2 mu2-a); the raven climbs the date palm (ĝišnimbar) and works the shadouf counterweights (lag)"}
      - {motif: culture-heroes-inventors, refs: ["ETCSL 1.3.3 66-71"], note: "the raven, not a man, originates date-palm culture and shadouf irrigation; 'who had ever seen such a thing before?' (a-ba igi im-mi-in-du8-a)"}
      - {motif: date-palm-every-part-useful, refs: ["ETCSL 1.3.3 78-84"]}
      - {motif: palm-tree-provides, refs: ["ETCSL 1.3.3 83-84"], note: "its dates are fit for the temples of the great gods"}
    hints:
      - "Compare Gen 8:7 (raven sent from the ark) and 1 Kgs 17:4-6 (ravens commanded to feed Elijah): a god gives the raven a task."
      - "Compare Q 5:31: God sends a raven to teach a human a skill (burial), the animal as teacher of a human craft."
      - "Compare Gen 18:21 ('I will go down and see whether they have done according to the outcry') for a deity going out to inspect wrongdoing."
      - "Compare Gen 4:20-22 (originators of crafts) and Ps 92:13 (the righteous flourish like the palm)."

  - id: ane-etcsl-1-3-3-shukaletuda-crime
    tradition: ane-sumerian
    title: Šu-kale-tuda violates the sleeping Inana; the wells turn to blood (Inana and Šu-kale-tuda 91-138)
    corpus: ane
    original: true
    tagger: Claude (model), reading the Sumerian
    read: ["ETCSL 1.3.3 91-138"]
    tags:
      - {motif: gardener-uproots-all-plants, refs: ["ETCSL 1.3.3 93-96"], note: "restored in part from the repetition at 141-144: ur2-ba im-ta-an-bal zu2 im-ta-an-gaz"}
      - {motif: mortal-glimpses-gods-at-horizons, refs: ["ETCSL 1.3.3 97-106"], note: "dust of the mountains blown into his eyes; he sees diĝir un3-na kur ud e3-ke4-ne / kur ud šu2-ke4-ne and '{d}gidim dili' a lone ghost. Largely restored from 145-154."}
      - {motif: single-tree-with-unchanging-shade, refs: ["ETCSL 1.3.3 107-111"], note: "ĝiš-an-dul3 1-am3 ... {ĝiš}asal2 ĝissu daĝal; its shade does not change morning, noon or evening"}
      - {motif: weary-goddess-sleeps-under-tree, refs: ["ETCSL 1.3.3 112-116"], note: "after circling heaven, earth, Elam and Subir: nu-gig kuš2-a-ni-ta im-ma-te dur2-bi-še3 ba-nu2"}
      - {motif: mortal-rapes-sleeping-goddess, refs: ["ETCSL 1.3.3 117-125"], note: "he undoes the loincloth of the seven me over her genitals (gal4-la), ĝiš3 im-ma-ni-in-dug4 ne im-ma-ni-in-su-ub, and returns to his plot. Lines 118-121 partly broken."}
      - {motif: victim-wakes-and-inspects-herself, refs: ["ETCSL 1.3.3 126-128"], note: "ud im-zal {d}utu im-ta-e3-a-ra munus-e ni2-te-a-ni igi im-kar2-kar2"}
      - {motif: waters-full-of-blood, refs: ["ETCSL 1.3.3 131-135"], note: "pu2 kalam-ma-ka uš2 bi2-ib-si-si: wells and orchards yield blood; the slave fetching wood and slave-girl drawing water drink blood; 'the black-headed drank blood'"}
      - {motif: plague-on-whole-land-for-one-mans-crime, refs: ["ETCSL 1.3.3 129-135"], note: "zag-bi nu-un-zu 'no one knew its end'"}
      - {motif: goddess-searches-all-lands-for-culprit, refs: ["ETCSL 1.3.3 136-137"], note: "lu2 ĝiš3 dug4-ga-ĝu10 kur-kur-ra ga-mu-ni-pad3"}
      - {motif: narrative-refrain-what-did-one-say, refs: ["ETCSL 1.3.3 138"]}
    hints:
      - "Compare Gen 19:33-35 (intercourse with a sleeping, unknowing parent) and Gen 9:21-24 (Noah wakes and knows what was done to him)."
      - "Compare Gen 34:2 and 2 Sam 13:14 (sexual violation as the trigger of vengeance)."
      - "Compare Exod 7:19-21 (water turned to blood in all Egypt, even in vessels of wood and stone) and Ps 78:44; Rev 16:4."
      - "Compare Josh 7 and Jonah 1:7 (a whole community suffers for one hidden culprit who must be found)."
      - "Compare Jonah 4:6 (the shade plant over Jonah)."

  - id: ane-etcsl-1-3-3-hiding-and-plagues
    tradition: ane-sumerian
    title: Šu-kale-tuda hides in the city; second and third plagues (Inana and Šu-kale-tuda 139-238)
    corpus: ane
    original: true
    tagger: Claude (model), reading the Sumerian
    read: ["ETCSL 1.3.3 139-238"]
    tags:
      - {motif: culprit-hides-among-city-crowd, refs: ["ETCSL 1.3.3 177-184", "ETCSL 1.3.3 206-213", "ETCSL 1.3.3 231-238"], note: "dumu-ĝu10 iri šeš-zu-ne ḫe2-eb-us2-en, saĝ gig2 šeš-zu-ne ĝiri3 gub-ba ĝen-na: 'join your brothers the city-dwellers, the black-headed'. 206-213 entirely restored."}
      - {motif: three-escalating-plagues, refs: ["ETCSL 1.3.3 168-176", "ETCSL 1.3.3 185-193", "ETCSL 1.3.3 214-220"], note: "2(MAN)-kam-ma-še3 ... 3(EŠ5)-kam-ma-aš: a second and a third time"}
      - {motif: clouds-as-chariot-wings-of-wind, refs: ["ETCSL 1.3.3 187"], note: "dungu mu-un-u5 'she mounted a cloud'"}
      - {motif: deity-preceded-and-followed-by-storm-attendants, refs: ["ETCSL 1.3.3 188-189"], note: "{tum9}u18-lu mar-uru5 ḫuš igi-še3 ... pi-li-pi-li dal-ḫa-mun eĝer-ra-ni-še3: south wind and storm flood before her, dust storm behind"}
      - {motif: seven-times-seven-attendants, refs: ["ETCSL 1.3.3 191"], note: "7 a-ra2 7 an-edin-na"}
      - {motif: highways-of-land-blocked, refs: ["ETCSL 1.3.3 216-218"], note: "ḫe-en-du kalam-ma-ka ba-an-gi16-ib; the object she takes (umbin KA su-ug-ga) is obscure"}
      - {motif: goddess-searches-all-lands-for-culprit, refs: ["ETCSL 1.3.3 192-193", "ETCSL 1.3.3 219-220"]}
    hints:
      - "Compare Num 35:11-15 (cities of refuge where a killer hides from the avenger) and Jonah 1:3 (fleeing from the deity's presence)."
      - "Compare Hab 3:5 (plague goes before him, pestilence follows) and Ps 97:2-3; Ps 104:3 (clouds as chariot)."
      - "Compare Judg 5:6 and Isa 33:8 (the highways ceased, travellers abandoned the roads)."
      - "The three-plague escalation compares with the plague cycle of Exod 7-11 and with Q 7:133 (successive signs: flood, locusts, lice, frogs, blood)."

  - id: ane-etcsl-1-3-3-enki-and-destiny
    tradition: ane-sumerian
    title: Inana appeals to Enki, finds Šu-kale-tuda and decrees his death and lasting name (Inana and Šu-kale-tuda 239-310)
    corpus: ane
    original: true
    tagger: Claude (model), reading the Sumerian
    read: ["ETCSL 1.3.3 239-310"]
    tags:
      - {motif: victim-wakes-and-inspects-herself, refs: ["ETCSL 1.3.3 239-241"]}
      - {motif: wronged-daughter-appeals-to-father-god, refs: ["ETCSL 1.3.3 242-250"], note: "e ĝa2-a a-ba-a ma-ab-sig10-ge 'who will compensate me?'; she prostrates (ur2 im-ma-an-dun-dun) and asks Enki to hand over the man from the abzu; Enki: i3-sag9 ... ḫe2-am3 'so be it'"}
