      - {motif: gods-flee-like-birds-hide-like-mice, refs: ["ETCSL 1.6.1 121-127"], note: "buru5{mušen}-gin7 a2-ba mu-un-da-dub2-dub2 ... {d}a-nun-na-ke4-e-ne peš2-gin7 a2-ur2-bi im-dab5-be2-ne"}
      - {motif: gods-fear-the-monster, refs: ["ETCSL 1.6.1 121-124"], note: "here the gods fear the victorious god himself, not a monster"}
      - {motif: named-weapons-of-divine-warrior, refs: ["ETCSL 1.6.1 128-151"], note: "šar2-ur3 and šar2-gaz at right and left, ud zu2 50, ud-ba-nu-il2-la, aga-silig, alkad and šušgal nets, muš-maḫ ka 7, ĝiri2 an-na, mi-tum saĝ 50; each line ends mu-da-an-ĝal2-la-am3"}
      - {motif: victor-washed-and-chariot-enshrined, refs: ["ETCSL 1.6.1 152-158"], note: "a2 nam-ur-saĝ-ĝa2-ĝu10 a ḫe2-em-tu5-tu5-de3; {ĝiš}gigir an-na-ĝu10 ki-gal-la ḫe2-em-mi-in-gub-bu-de3; lugal dab5-ba-ĝu10 ... giri17 šu ḫa-ma-an-ĝal2"}
      - {motif: high-god-bows-to-victorious-son, refs: ["ETCSL 1.6.1 105-107", "ETCSL 1.6.1 159-160"], note: "kur gal {d}en-lil2-le giri17 šu am3-ĝal2; {d}aš-im2-babbar-re u3-gul mu-un-na-ĝa2-ĝa2; mu-ĝu10-še3 giri17 ki su-ub ḫa-ma-ak-ne 'let them prostrate at my name'"}
      - {motif: city-exalted-birds-nest-refugees-in-shade, refs: ["ETCSL 1.6.1 168-174"], note: "eš3 nibru{ki} an-gin7 gu2 ḫe2-eb2-us2; pu2 a dug3-ga ki-en-gi-ra; mušen dal-a-bi uru2-ĝa2 gud3 ḫe2-em-ma-an-us2 / lu2-kar-ra-bi ĝissu-ĝu10-še3 ni2 ḫe2-em-ši-ib-te-en-te-en"}
      - {motif: birds-dwell-in-shade-of-great-tree, refs: ["ETCSL 1.6.1 173-174"], note: "said of the city, with refugees (lu2-kar) in the god's shade, not of a tree"}
    hints:
      - "Compare Ezek 17:23, 31:6 and Dan 4:9 (birds nest and all find shade under the great tree) and Ps 84:4 (the sparrow's nest at the altar)."
      - "Compare 2 Kgs 23:11 (chariots of the sun kept at the temple) and Ps 110:1 (enemies a footstool)."
      - "Compare Isa 45:23 and Phil 2:10 (every knee shall bow to the name); Ps 2:7-9 (the son given the nations)."
      - "Compare 1 Sam 21:10 and 2 Sam 8:7-11 (captured weapons and spoils laid up before the LORD)."
      - "Compare Hab 3:9-11 (the god's bow, arrows and spear) and Deut 32:41-42 for the divine warrior's weapons."

