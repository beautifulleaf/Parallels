      - {motif: gods-listed-as-treaty-witnesses, refs: ["Ugarit RS 17.0365 + RS 18.0006 o:7'-11'"], note: "Baal of the field(?), Ištar of Tunip, Baal of Mount Hazzi, Hebat of Aru, Šamaš of heaven, Kušuh and Išhara bēlū māmīti 'lords of the oath'"}
