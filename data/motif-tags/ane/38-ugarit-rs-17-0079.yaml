      - {motif: letter-opening-say-to-my-lord, refs: ["Ugarit RS 17.0383 o:1-3"], note: "ana šar Ugarit bēlīya qibīma umma Taguḫli wardukama"}
      - {motif: sevenfold-prostration, refs: ["Ugarit RS 17.0383 o:4-5"], note: "ana šēpē bēlīya ištu rūqiš 2-šu 7-šu amqut: 'at my lord's feet from afar twice seven times I fall'"}
      - {motif: letter-mutual-well-being-formula, refs: ["Ugarit RS 17.0383 o:6-9"]}
      - {motif: overlord-angered-by-worthless-gift, refs: ["Ugarit RS 17.0383 o:10-r:10"], note: "'I have sent you lapis' ... libbašu ša šarri danniš imtali 'the king's heart was very full (angry)'; ul ana muḫḫīya annû ulazzan-mi 'is this not mockery of me?' a stone just lifted from the ground; 'find lapis anywhere and send it to the king'"}
      - {motif: sick-man-recovers-and-owes-god-offerings, refs: ["Ugarit RS 17.0383 r:11-20"], note: "anāku danniš amtaraṣ ubān lū lā mītāku: 'I was very ill, a finger from being dead'; ištu murṣīya abtaluṭ; dApšukka ša Irḫanda ētelâ ... erriššanni: the god came up and asked for me; offerings (nīqū) and gifts must be brought"}
      - {motif: gift-request-luxury-goods-between-officials, refs: ["Ugarit RS 17.0383 r:20-26"], note: "uqniātu 'blue wool' requested: if my lord does not send it, who else will give it?"}
    hints:
