    title: "Ehli-Tešub to Uri-Tešub, 'my brother': 30 jars of oil for the palace owed by the men of Gibaʿla; collect it with an elder and store it; silver of ʾAppu and Pedu; 111 jars on Maʿraba (RS 94.2285+)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    version: "Letter; reverse partly broken"
    read: ["Ugarit RS 94.2285 + RS 94.2286"]
    tags:
      - {motif: letter-greeting-gods-guard-you, refs: ["Ugarit RS 94.2285 + RS 94.2286 o:4-5"]}
      - {motif: oil-jars-levied-on-villages, refs: ["Ugarit RS 94.2285 + RS 94.2286 o:6-r:13"], note: "30 karpat šamni ana ēkalli eli mārī Gibaʿla ... 111 karpat šamni eli mārī Maʿraba u 81 ... karpātūšunu lū lā libbatiqū 'let their jars not be cut off (short)'"}
    hints:
      - "Oil owed to the palace by villages compare the Samaria ostraca and 1 Kgs 5:25 (oil to Hiram), 1 Chr 27:28."

