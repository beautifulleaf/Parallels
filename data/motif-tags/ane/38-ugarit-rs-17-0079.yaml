  - id: ane-ugarit-rs-17-0383-taguhli-lapis
    tradition: ane-ugaritic
    title: "Taguhli to the king of Ugarit: I fall twice seven times; the king is angry at the fake lapis; I was near death but recovered, and owe the god Apšukka offerings; send blue wool (RS 17.0383)"
    corpus: ane
