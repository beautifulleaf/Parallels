# Full read of the ANE corpus, chunk 38: Ugarit RS 17.0079 ... RS 94.2445 (in the order of `aneread.py texts 38`).
# Read from ORACC aemw/ugarit lemmatized transliterations (word glosses only, no translation).
# One unit per text: Hittite treaties and edicts for Ugarit, Carchemish verdicts, legal deeds of the Ugaritic kings,
# and letters in Akkadian and in alphabetic Ugaritic.
new_motifs:
  letter-greeting-gods-guard-you: {label: "Letter greeting: 'may the gods (the thousand gods, the gods of Ugarit) guard you in well-being' (ilānū ana šulmāni liṣṣurūka; Ugaritic ilm tġrk tšlmk)", cluster: letters}
  treaty-oathbreaker-destroyed-with-household: {label: "Treaty curse: the oath gods are to destroy the oath-breaker together with his person, wives, sons, grandsons, house, city, land and all his possessions", cluster: treaty}
  treaty-keeper-guarded-with-household: {label: "Treaty blessing: if the vassal keeps the words written on the tablet, the oath gods guard him with his person, wives, sons, grandsons, house, city and land", cluster: treaty}
  treaty-vassal-may-not-plead-ignorance: {label: "The vassal may not excuse inaction by saying 'I am bound by oath and treaty; whether the enemy kills them or they kill him, I do not know'", cluster: treaty}
  treaty-keep-kings-secret-words: {label: "Words the overlord tells the vassal in secret must be kept secret; revealing them breaks the oath", cluster: treaty}
  treaty-vassal-must-aid-overlord-at-once: {label: "When an enemy rises or a revolt breaks out against the overlord, the vassal must go at once with his troops and chariots (or send his son or brother) to help", cluster: treaty}
  treaty-overlord-promises-military-help: {label: "The overlord promises that if anyone presses the vassal, he himself, a prince or a great lord will come with troops and chariots and kill the enemy", cluster: treaty}
  thousand-gods-of-hatti: {label: "The 'thousand gods' (līm ilānī) of Hatti are summoned to assemble and hear the oath, or invoked in a greeting", cluster: theology}
  mountains-rivers-sea-winds-clouds-as-witnesses: {label: "Mountains, rivers, springs, the great sea, heaven and earth, winds and clouds are named among the witnesses of a treaty or oath", cluster: treaty}
  gods-of-ugarit-sworn-alongside-overlords-gods: {label: "The male and female gods of the vassal land (Ugarit) are named as witnesses alongside the overlord's own gods", cluster: treaty}
  overlord-restores-vassals-land-and-throne: {label: "The overlord seats the vassal on his father's throne and returns to him the land of his father, making him his servant", cluster: kingship}
  tablet-prevails-over-future-claimant: {label: "Closing clause of a deed or verdict: whoever raises the claim again, 'this tablet will prevail over him'", cluster: law}
  party-refuses-oath-forfeits-claim: {label: "In a lawsuit one party is assigned to swear but refuses the oath, and so the disputed goods remain with (or pass to) the other party", cluster: law}
  judicial-oath-decides-case: {label: "A king's verdict assigns one party an oath; by swearing (or by being released from the oath through settlement) the case is decided", cluster: law}
  merchants-murdered-blood-compensation: {label: "When a king's merchants are murdered in another land, the people of that land must pay compensation (three minas of silver per man) and restore the goods", cluster: law}
  town-swears-it-does-not-know-killers: {label: "When the killers of a man are not caught, the people of the town where he died swear an oath before his kinsmen that they do not know the killers, and pay compensation", cluster: law}
  treaty-curse-on-whoever-alters-it: {label: "The treaty tablet ends: whoever changes this treaty, may the named gods (storm god, sun god, city goddesses) be the lords of his oath (avenge it)", cluster: treaty}
  kings-call-each-other-brothers-sons-of-one-man: {label: "Two rulers or officials call each other brothers, 'sons of one man', 'men of one house', and ask why there is not good feeling between them", cluster: letters}
  vassal-king-calls-overlord-father: {label: "A lesser king addresses the king of Ugarit (or another king) as 'my father' and calls himself 'your son'", cluster: letters}
  offending-wife-sent-back-to-her-brothers: {label: "A woman who wronged her husband and slandered another is taken away and sent back to her brothers", cluster: law}
  overlord-promises-sealed-treaty-tablet: {label: "The overlord promises the vassal that, once victorious, he will give him a sealed tablet of treaty", cluster: treaty}
  vassal-keeps-booty-from-rebel-neighbours: {label: "The overlord grants the vassal that whatever troops or fugitives of the rebel neighbouring lands he captures no one may take from his hand", cluster: treaty}
  gift-request-luxury-goods-between-officials: {label: "Officials or kings exchange gifts and requests by letter: horses, mules, iron dagger, linen, gold, glass, bronze cauldrons", cluster: trade}
  overlord-tells-vassal-do-not-fear: {label: "The overlord tells the vassal 'do not fear' the hostile neighbouring kings and promises to deal with them", cluster: treaty}
  treaty-breakers-made-example: {label: "The overlord points the vassal to neighbouring kings who abandoned the treaty: 'later you will see what the great king does to them'", cluster: treaty}
  lawsuit-between-subjects-of-two-kings: {label: "Subjects of two kingdoms in dispute are sent with a letter so that their case may be heard before the other king or his officials, or settled 'on the road'", cluster: law}
  vassal-refuses-neighbours-pressure-to-rebel: {label: "Neighbouring kings press a vassal to join their revolt against the overlord ('why are you not hostile with us?'), but he refuses and stays loyal", cluster: kingship}
  vassal-tribute-schedule-to-court: {label: "A treaty fixes the vassal's tribute in gold, gold and silver cups, linen and blue-purple wool, graded for the great king, the queen, the crown prince and named court officials", cluster: kingship}
  vassal-falls-at-overlords-feet: {label: "The vassal comes in person and throws himself down beneath the feet of the overlord", cluster: kingship}
  royal-seal-with-queen: {label: "A royal document is sealed with the king's seal together with the seal of the great queen", cluster: kingship}
  umman-manda-enemy-horde: {label: "The Umman-manda, a hostile horde of uncertain origin, appear as enemies to be pacified or fought", cluster: war}
  vassal-appeals-to-overlord-save-me-from-enemy: {label: "Attacked by neighbouring kings, the vassal writes to the overlord: 'I am your servant; save me from the hand of the enemy'", cluster: kingship}
  overlord-gives-vassal-the-booty: {label: "The overlord's army drives out the invaders and he gives all the recovered captives and booty to the loyal vassal", cluster: kingship}
  overlord-fixes-vassal-borders-by-town-list: {label: "The overlord fixes and seals the vassal's borders for him and his descendants for ever, listing the frontier towns and mountains one by one", cluster: kingship}
  oath-to-clear-town-of-raid: {label: "The people of a town must swear that they did not strike, rob or harbour raiders, or else pay threefold compensation", cluster: law}
  vines-cut-down-in-border-dispute: {label: "One people accuses its neighbours of cutting down their vineyards, and the accused must swear they did not", cluster: law}
  sold-slave-repaid-like-thief: {label: "Whoever, after the tablet, is found to have sold a fugitive slave of the other kingdom must pay compensation like a thief", cluster: law}
  sealed-debt-tablet-broken: {label: "A sealed tablet recording a debt is broken to cancel the obligation, and the parties dispute which debt the broken tablet recorded", cluster: law}
  princes-given-share-and-exiled: {label: "Princes who sinned against the king receive their share of the inheritance (silver, gold, goods) from the queen mother and are sent away to a foreign island, with an oath that they and their descendants will never claim more", cluster: kingship}
  oath-before-goddess-of-steppe: {label: "An oath between royal brothers is laid down before Ištar of the steppe (Ištar-ṣēri)", cluster: law}
  divorce-of-royal-wife-daughter-of-great-lady: {label: "A king divorces (or harms) his royal wife, 'the daughter of the Great Lady' (a Hittite or Amurrite princess), and the case is decided by the great kings", cluster: kingship}
  oath-not-to-murder-allied-king: {label: "A king swears not to do murder (nērtu) against a neighbouring king, his ships or his troops; if he does, the gods are to destroy him from his father's house, land and throne", cluster: treaty}
  letter-mutual-well-being-formula: {label: "Letter formula: 'when all is well with me, with you there may all be well; whatever greetings you have, send me word back'", cluster: letters}
  overlord-angered-by-worthless-gift: {label: "A gift sent to the king turns out worthless (a common stone sent as lapis lazuli); the king is filled with anger and accuses the sender of mockery", cluster: kingship}
  sick-man-recovers-and-owes-god-offerings: {label: "A writer reports he was gravely ill, 'a finger from death', has now recovered, and owes the god who requested him offerings and many gifts", cluster: healing}
  why-angry-with-your-brother-letter: {label: "A letter asks 'why are you angry with your brother? you are not as before toward me; if I have sinned, write my sin on a tablet and send it'", cluster: letters}
  wax-writing-board: {label: "A wax-covered writing board (ṭuppu ša iškūri) is requested or sent in a letter", cluster: scribal}
  all-claims-cleared-like-the-sun: {label: "On the day the oath is sworn all past claims between two kings are 'broken'; one party is declared 'clear as the sun' (zakû kīma šamši) of all claims", cluster: law}
  ally-must-fight-habiru-raiders: {label: "A treaty partner must come with chariots and troops if Habiru raid the other's land or if there is upheaval in it", cluster: treaty}
  ransom-of-captured-troops: {label: "Silver is paid as ransom (ipṭiru) for one king's captured troops and horses", cluster: war}
  princess-of-hatti-in-ugarit: {label: "A daughter of the Hittite Great King ('daughter of the Sun') is married into or resides at the court of a vassal king (Ugarit, Amurru) as great queen", cluster: kingship}
  oath-sun-sees: {label: "The sun god is invoked to watch over or see the oath and its breaker ('may the Sun of that day see him')", cluster: treaty}
  messenger-sent-to-ask-kings-well-being: {label: "A messenger is sent to the overlord's court 'to ask after the well-being of the king our lord' and bring back news", cluster: letters}
  deed-witnessed-by-named-witnesses: {label: "A legal deed closes with a list of named witnesses (IGI ...) and the scribe", cluster: law}
  overseer-of-thousand: {label: "An official titled 'overseer of a thousand' (UGULA līm, Ugaritic rb alp) appears in a legal or administrative record", cluster: kingship}
  companion-abandoned-to-egyptians: {label: "A man's companion leaves him to (or with) Egyptians and they take his goods", cluster: law}
  husband-killed-in-town-oath-and-compensation: {label: "A woman's husband is killed in a town; the townsmen must swear that they did not kill him and do not know who did, or else pay compensation into her hand", cluster: law}
  double-letter-on-one-tablet: {label: "One tablet carries two letters, the second from a servant to his lord and lady (or from a second sender), each with its own address and greeting", cluster: letters}
  commander-guards-passes-awaiting-pharaoh: {label: "A commander stationed for months in Amurru guards the roads and passes, half his chariots by the sea and half at the flank of Mount Lebanon, waiting for the Egyptian king's army", cluster: war}
  campaign-ruined-by-winter-rain-and-cold: {label: "Winter rain fills the cisterns, the cold 'eats' the soldiers, chariots break, horses die and troops are lost", cluster: war}
  captive-interrogated-about-enemy-king: {label: "A captive taken in a night skirmish is questioned about the enemy king's plans: 'the king of Egypt is coming out'", cluster: war}
  foreign-king-sends-offerings-to-ugarit: {label: "A foreign king sends animals and spices to Ugarit for his offerings (nīqu) there and asks the king to protect his servant on the way", cluster: cult}
  border-town-seized-by-neighbour-king: {label: "A king complains to the overlord that his neighbour has taken his borders and a town ('why have you done this?')", cluster: law}
  letter-servant-falls-at-lords-feet: {label: "Letter formula of submission: 'at the feet of my lord I fall' (ana šēpē bēlīya amqut; Ugaritic lpʿn adty ... qlt), without a count of times", cluster: letters}
  letter-blessing-sated-with-old-age: {label: "Letter blessing: may the gods keep you well and sate you with (good) old age before the gods of our father's house (or before the king your lord) for ever", cluster: letters}
  gods-of-fathers-house: {label: "'The gods of our father's house' are invoked alongside the gods of the land as the family's protecting gods", cluster: theology}
  son-falls-at-mothers-feet: {label: "A son writing to his mother (often the queen mother) falls at her feet in the letter's greeting", cluster: letters}
  oath-of-clearance-in-house-of-god: {label: "Accused men (elders of a town) are to come, enter the house of the god and (by oath there) be cleared", cluster: law}
  stolen-cattle-claimed-from-town: {label: "Oxen stolen by men of a town are claimed by letter; the case must be finished and the oxen returned, or the town's elders must clear themselves", cluster: law}
  letter-reciprocal-wishes-formula: {label: "Letter formula: 'whatever wish I ask of you, give it; whatever wish you ask of me, I will give you'", cluster: letters}
  envoy-and-case-sent-with-letter: {label: "A king sends his messenger with a letter asking his 'brother' king to watch over him until he departs and to settle his cases with foreigners on the road", cluster: letters}
  gods-as-helpers-epithet: {label: "The gods are called 'my helpers' (ilānū rēṣīya) and a city 'city of trust' in a letter's blessing", cluster: theology}
  captivity-mentioned-in-letter: {label: "A letter mentions captivity (šallūtu) of people or of a king in a broken context", cluster: war}
  brotherhood-adoption-contract: {label: "Two men make a contract of brotherhood (aḫḫūtu) before the mayor and elders, with a deposit of silver; whoever 'hates' the other forfeits and leaves, and the childless one's estate passes to his adopted brother", cluster: law}
  hate-formula-for-dissolution: {label: "Legal formula: 'if X hates (zêru) Y' marks the unilateral dissolution of a marriage, adoption or brotherhood, with a fixed penalty", cluster: law}
  heirless-estate-to-adopted-brother: {label: "If a man dies without a son, all his property goes to the man he adopted as brother or son", cluster: law}
  man-seized-as-replacement-dies: {label: "A man seized by force as a replacement (rību) for another dies in custody; his brother sues, the defendant is offered the oath, and the plaintiff's refusal to swear clears him of the blood", cluster: law}
  egyptian-official-invokes-egyptian-gods-for-ugarit: {label: "An Egyptian official writing to the king of Ugarit says he speaks to Amun, Re and Seth, the gods of Egypt, that they may guard him", cluster: letters}
  city-told-to-hold-out-until-relief-army: {label: "The overlord's officer tells a city's notables that relief troops are coming quickly: 'guard the city until we arrive'", cluster: war}
  loved-like-good-oil-and-cedar-scent: {label: "A correspondent is called 'my good brother whom I love like good oil and the scent of cedar'", cluster: letters}
  guard-your-mouth-before-king: {label: "Advice in a letter: guard your mouth (your words) before the king your lord, that he may honour you", cluster: wisdom}
  widow-writes-of-dead-husbands-friendship: {label: "A widow reminds her late husband's friend that while her husband lived they were friends and he gave whatever was asked, and asks the same favour of him", cluster: letters}
  bronze-for-making-divine-image: {label: "A woman asks for bronze because she is making a divine image (godhead)", cluster: cult}
  chief-of-metalworkers: {label: "A 'king' or chief of the smiths (šar qurqurrī) appears as a guild head in a letter", cluster: crafts}
  petition-to-speak-for-writer-before-king: {label: "A writer asks a courtier to set his matter right before the king so that the king grants his wish", cluster: letters}
  letter-addressed-to-elders-of-city: {label: "A letter is addressed to named notables and to 'the great men and the elders of the city'", cluster: letters}
  divine-epithet-lord-of-the-sea: {label: "A god is called lord of the (wide) sea in an invocation or greeting", cluster: theology}
  no-claim-tomorrow-or-later: {label: "Settlement clause: 'tomorrow or the day after' (urram šēram) neither party may raise a claim against the other", cluster: law}
  heart-laughs-to-see-lord: {label: "A servant writes that his heart laughs (rejoices) greatly at seeing his lord: 'who will see my lord's good face and hear his sweet word?'", cluster: letters}
  heart-pounds-for-lack-of-news: {label: "A writer's heart 'beats greatly' (libbī inakkud) because his lord has not sent to ask after his well-being, or because of the king's illness", cluster: letters}
  storm-god-killed-troops: {label: "A king reports that the storm god (Baal/Addu) has killed some of his troops and great men, apparently at sea", cluster: theology}
  captive-wife-ransomed-if-loved: {label: "If a captured man loves his wife, he may take her back by ransom (ipṭiru)", cluster: law}
  men-held-in-prison-house-abroad: {label: "Men of one kingdom are held in a prison house (bīt kīli) in another king's land", cluster: law}
  famine-king-asks-ally-for-barley: {label: "A king writes that there is no barley in his land and asks his 'brother' king to give barley, sending sheep for offerings", cluster: famine}
  oil-jars-levied-on-villages: {label: "Jars of oil owed to the palace are levied on the men of named villages and must be collected and stored", cluster: economy}
  queen-asked-for-news-of-kings-illness: {label: "A courtier writes to the queen that his heart pounds over the king's illness and asks her to send news of it", cluster: kingship}
  search-for-seven-days: {label: "A search or inspection is to be carried out over seven days (e.g. along the sea) and word sent back", cluster: numbers}
  gods-give-wish-in-letter: {label: "A letter wishes that the gods may grant (give) something to the addressee", cluster: letters}
units:
  - id: ane-ugarit-rs-17-0079-mursili-niqmepa-treaty
    tradition: ane-akkadian
    title: "Treaty of Muršili II of Hatti with Niqmepa of Ugarit: loyalty, mutual help, fugitives, secrecy; the thousand gods as witnesses; curse and blessing (RS 17.0079+)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    version: "Hittite vassal treaty, Ugarit"
    read: ["Ugarit RS 17.0079 + RS 17.0374 + RS 17.0338"]
    tags:
      - {motif: overlord-restores-vassals-land-and-throne, refs: ["Ugarit RS 17.0079 + RS 17.0374 + RS 17.0338 o:2-4"], note: "ana kussî abika ultēšibka māt abika utterakka ... qadu mātika wardu: 'I seated you on your father's throne, returned your father's land to you'"}
      - {motif: treaty-binds-future-generations, refs: ["Ugarit RS 17.0079 + RS 17.0374 + RS 17.0338 o:4-9"], note: "ištu ūmi annî ina warki ūmi ... ša mārī šarri ša mār mārī šarri ... ana dārâti: loyalty to the king, his sons and grandsons for ever"}
      - {motif: treaty-love-king-hate-his-enemy, refs: ["Ugarit RS 17.0079 + RS 17.0374 + RS 17.0338 o:6-7", "Ugarit RS 17.0079 + RS 17.0374 + RS 17.0338 o:13"], note: "The king's person must be as precious to him as his own (aqrata); itti salmīya lū salmāta itti nakrīya lū nakrāta: 'be at peace with my friend, hostile to my enemy'"}
      - {motif: treaty-fight-kings-enemy, refs: ["Ugarit RS 17.0079 + RS 17.0374 + RS 17.0338 o:14-25"], note: "Hostile lands named: Hanigalbat, Egypt, Babylonia (Karduniaš), Alše; Mukiš, Aleppo, Nuhašše if they turn hostile; ina kalû libbika 'with all your heart'"}
      - {motif: treaty-vassal-may-not-plead-ignorance, refs: ["Ugarit RS 17.0079 + RS 17.0374 + RS 17.0338 o:25-29"], note: "anāku ša māmīti u ša riksi-mi šumma nakru lidukšunu-mi ... lū lā īde: forbidden excuse"}
      - {motif: treaty-vassal-must-aid-overlord-at-once, refs: ["Ugarit RS 17.0079 + RS 17.0374 + RS 17.0338 o:30-34"]}
      - {motif: treaty-overlord-promises-military-help, refs: ["Ugarit RS 17.0079 + RS 17.0374 + RS 17.0338 o:35-38"]}
      - {motif: treaty-return-fugitives, refs: ["Ugarit RS 17.0079 + RS 17.0374 + RS 17.0338 o:45-50", "Ugarit RS 17.0079 + RS 17.0374 + RS 17.0338 r:10-18"], note: "Deportees (NAM.RA) from Hanigalbat, Kadesh, Niya, Nuhašše, Mukiš who flee into Ugarit must be seized and returned; fugitives (munnabtu) both ways"}
      - {motif: treaty-report-sedition-even-from-kin, refs: ["Ugarit RS 17.0079 + RS 17.0374 + RS 17.0338 o:51-53"], note: "awâtē lā banâti ... lū mār Ḫatti lū mār Ugarit lū wardu: whoever speaks evil words to Niqmepa must be sent to the king"}
      - {motif: treaty-keep-kings-secret-words, refs: ["Ugarit RS 17.0079 + RS 17.0374 + RS 17.0338 o:58-60"], note: "awâtē ina puzri ... lā tanaṣṣar"}
      - {motif: treaty-no-other-king-or-lord, refs: ["Ugarit RS 17.0079 + RS 17.0374 + RS 17.0338 r:22-25"], note: "If he seeks the well-being (šulmu) of Hanigalbat or Egypt or the hand of another great king, he has transgressed the oath"}
      - {motif: thousand-gods-of-hatti, refs: ["Ugarit RS 17.0079 + RS 17.0374 + RS 17.0338 r:26"], note: "līm ilānī lipḫurū lištemû u lū šībūtu: 'let the thousand gods assemble, hear and be witnesses'"}
      - {motif: gods-listed-as-treaty-witnesses, refs: ["Ugarit RS 17.0079 + RS 17.0374 + RS 17.0338 r:27-49"], note: "Sun of heaven, Sun of Arinna, Storm-god of heaven and of Hatti, the bulls Šeri and Hurri, mountains Nanni and Hazzi (Ṣapon), storm-gods of many cities incl. Aleppo and Ugarit, Kušuh 'lord of the oath', Išhara 'queen of the oath', Hebat queen of heaven, Ištar of Nineveh, the Habiru gods, Ereškigal, the primeval gods Nara, Namšara, Minki, Ammunki, Alalu, Anu, Enlil"}
      - {motif: gods-of-ugarit-sworn-alongside-overlords-gods, refs: ["Ugarit RS 17.0079 + RS 17.0374 + RS 17.0338 r:46-47"], note: "ilānū awīlū ilānū sinnišātu gabbišunu ša māt Ugarit"}
      - {motif: mountains-rivers-sea-winds-clouds-as-witnesses, refs: ["Ugarit RS 17.0079 + RS 17.0374 + RS 17.0338 r:49-51"], note: "šadû nārātu būrātu tiāmtu rabītu šamû u erṣetu šāru u erpetu ... lū šībūtu"}
      - {motif: heaven-and-earth-as-witnesses, refs: ["Ugarit RS 17.0079 + RS 17.0374 + RS 17.0338 r:50-51"]}
      - {motif: treaty-oathbreaker-destroyed-with-household, refs: ["Ugarit RS 17.0079 + RS 17.0374 + RS 17.0338 r:52-55"], note: "nīš ilānī annûti Niqmepa qadu qaqqadišu aššātišu mārīšu mār mārīšu bītišu ālišu mātišu u mimmûšu liḫalliqūšu"}
      - {motif: treaty-keeper-guarded-with-household, refs: ["Ugarit RS 17.0079 + RS 17.0374 + RS 17.0338 r:56-59"], note: "... liṣṣurūšu"}
    hints:
      - "The blessing-and-curse close conditioned on keeping 'the words written in this tablet' compare Deut 28:1-68 and Deut 29:19-20 (the curses written in this book); Lev 26."
      - "Heaven and earth (with mountains) as witnesses compare Deut 4:26, 30:19, 31:28, 32:1; Isa 1:2; Mic 6:1-2; Ps 50:4."
      - "Mount Hazzi (Ṣapon, Jebel Aqraʿ) among the divine witnesses: compare Ps 48:3 (Zion 'the heights of Zaphon') and Isa 14:13."
      - "Friend of my friend, enemy of my enemy compare Exod 23:22 (I will be an enemy to your enemies) and Gen 12:3."
      - "Return of fugitives: contrast Deut 23:16-17 (do not hand back an escaped slave) and 1 Kgs 2:39-40 (Shimei's slaves at Gath)."
      - "Punishment extending to wife, sons and grandsons and house compare Exod 20:5, Josh 7:24-25 (Achan with his sons and daughters and all he had)."

  - id: ane-ugarit-rs-17-0083-ari-teshub-father
    tradition: ane-akkadian
    title: "Letter of Ari-Tešub king of Ušnatu to the king of Ugarit, 'my father': let the servants' case be judged on the road (RS 17.0083)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    version: "Letter, Ušnatu to Ugarit"
    read: ["Ugarit RS 17.0083"]
    tags:
      - {motif: letter-opening-say-to-my-lord, refs: ["Ugarit RS 17.0083 o:1-3"], note: "ana šar māt Ugarit abīya qibīma umma Ari-Tešub"}
      - {motif: vassal-king-calls-overlord-father, refs: ["Ugarit RS 17.0083 o:2", "Ugarit RS 17.0083 o:4", "Ugarit RS 17.0083 r:5"]}
      - {motif: letter-greeting-gods-guard-you, refs: ["Ugarit RS 17.0083 o:5-7"], note: "līm ilānī ana šulmāni liṣṣurūka: 'may the thousand gods guard you in well-being'"}
      - {motif: thousand-gods-of-hatti, refs: ["Ugarit RS 17.0083 o:6"]}
