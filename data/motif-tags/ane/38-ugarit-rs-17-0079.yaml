      - {motif: treaty-binds-future-generations, refs: ["Ugarit RS 17.0352 o:14-r:5"], note: "Neither they nor their sons and grandsons shall claim their share from the king or his sons and grandsons adi dārīti"}
      - {motif: tablet-prevails-over-future-claimant, refs: ["Ugarit RS 17.0352 r:6-8"], note: "ištu ūmi annî zēzū baṣrū: 'from this day they are divided and cut off'"}
    hints:
      - "Sons given gifts and sent away so the heir inherits alone compare Gen 25:5-6 (Abraham's sons of the concubines sent east) and Gen 21:10-14."
      - "Rebel princes and the throne compare 1 Kgs 1-2 (Adonijah) and Judg 11:2 (Jephthah driven out from his inheritance)."

