      - {motif: oath-sun-sees, refs: ["Ugarit RS 19.0068 l.e:1-3"], note: "Fragmentary: [whoever ... the] words of the oath, u dŠamšu ūmi šuāti ... lidgulū: 'and the Sun of that day ... may they see/watch'"}
