      - {motif: divorce-of-royal-wife-daughter-of-great-lady, refs: ["Ugarit RS 17.0365 + RS 18.0006 o:5'", "Ugarit RS 17.0365 + RS 18.0006 r:4-9"], note: "aššum mārat rabīti: the case about 'the daughter of the Great Lady' brought before the king of Hatti, the king of Carchemish and the great kings"}
