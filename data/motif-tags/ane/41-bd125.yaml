# Full read of the ANE corpus, chunk 41: Book of the Dead 125 (ten witnesses), Doomed Prince,
# Eloquent Peasant (versions R, B1, B2), Harper's Songs (26 witnesses). Read from the TLA
# transliteration (2018 open export), with the TLA German translation as a reading aid.
new_motifs:
  # --- Book of the Dead 125: hall, judges, confession
  hall-of-two-truths-judgment: {label: "The dead person comes to the Hall of the Two Truths (Maat) to be judged before the great god and separated from the sins he has committed", cluster: judgment-of-dead}
  forty-two-judges-of-the-dead: {label: "Forty-two divine judges sit with the god of the dead in the hall of judgment, each addressed by an epithet and a place of origin", cluster: judgment-of-dead}
  judges-of-dead-drink-blood-of-evildoers: {label: "The divine judges of the dead live on the evildoers and drink their blood on the day of reckoning", cluster: judgment-of-dead}
  day-of-reckoning-of-characters-before-god-of-dead: {label: "A fixed day on which the characters or deeds of the dead are reckoned up before the god of the dead", cluster: judgment-of-dead}
  knowing-names-protects-before-judges: {label: "The dead person claims to know the names of the god and his judges, and this knowledge protects him from their harm", cluster: judgment-of-dead}
  deceased-brings-maat-drives-out-wrong: {label: "The dead person announces to the judge: I have come to you, I have brought you Maat (truth/justice) and driven out wrong", cluster: judgment-of-dead}
  negative-confession-before-divine-judges: {label: "The dead person recites before the divine judges a long series of denials, 'I have not done X', to prove his innocence", cluster: judgment-of-dead}
  confession-each-denial-to-named-judge: {label: "Each denial of the confession is addressed to a different named judge ('O Wide-strider who came from Heliopolis, I have done no wrong')", cluster: judgment-of-dead}
  denial-not-ordered-a-killing: {label: "Denial: the speaker has not ordered anyone to be killed (beside not killing himself)", cluster: ethics}
  denial-not-caused-hunger-or-weeping: {label: "Denial: the speaker has not made anyone go hungry, made anyone weep, or caused anyone pain", cluster: ethics}
  denial-not-overworked-laborers: {label: "Denial: the speaker has not imposed on workers more work in a day than could be done", cluster: ethics}
  denial-not-impoverished-poor-man: {label: "Denial: the speaker has not robbed a poor man of his property or made him poorer", cluster: ethics}
  denial-not-maligned-servant-to-master: {label: "Denial: the speaker has not maligned a servant before his superior", cluster: ethics}
  denial-not-diminished-temple-offerings: {label: "Denial: the speaker has not reduced the food offerings in the temples nor taken the offering loaves of the gods or the cakes of the dead", cluster: cult}
  denial-not-lain-with-male: {label: "Denial: the speaker has not had sexual relations with a male (nk nkk, 'copulate with a catamite')", cluster: ethics}
  denial-not-falsified-weights-and-measures: {label: "Denial: the speaker has not shortened the grain measure or the land measure nor tampered with the weights or plummet of the balance", cluster: ethics}
  denial-not-encroached-on-fields: {label: "Denial: the speaker has not diminished (encroached on) fields or interfered with the field survey", cluster: ethics}
  denial-not-taken-milk-from-infant: {label: "Denial: the speaker has not taken milk from the mouth of a suckling child", cluster: ethics}
  denial-not-deprived-cattle-of-pasture: {label: "Denial: the speaker has not driven small cattle from their pasture or robbed them of fodder", cluster: ethics}
  denial-not-poached-birds-or-fish-of-gods: {label: "Denial: the speaker has not trapped birds or caught fish in the gods' marshes and pools", cluster: cult}
  denial-not-held-back-water-or-dammed-flow: {label: "Denial: the speaker has not held back the (irrigation) water in its season nor built a dam against flowing water", cluster: ethics}
  denial-not-quenched-fire-in-its-time: {label: "Denial: the speaker has not put out a (sacred) fire at its time", cluster: cult}
  denial-not-obstructed-god-in-procession: {label: "Denial: the speaker has not driven off the cattle of the god's estate nor blocked a god in his procession", cluster: cult}
  denial-not-blasphemed-god-king-or-town-god: {label: "Denial: the speaker has not reviled a god, the king or the god of his town", cluster: ethics}
  denial-not-reviled-father: {label: "Denial: the speaker has not reviled or complained against his father", cluster: ethics}
  denial-of-faults-of-speech: {label: "Denials of faults of speech: not lying, not chattering, not hot or loud speech, not eavesdropping, not slandering, not deaf to words of truth", cluster: ethics}
  denial-not-greedy-or-arrogant: {label: "Denial: the speaker has not been greedy, puffed up or self-exalting, and his wants were not excessive beyond his own property", cluster: ethics}
  denial-no-grain-usury: {label: "Denial: the speaker has not practised grain usury (ḥnw.yt)", cluster: ethics}
  denial-quarrel-only-over-own-property: {label: "Denial with exception: the speaker has not quarrelled, except over his own property", cluster: ethics}
  denial-did-no-wrong-though-saw-evil: {label: "Denial: the speaker did no wrong although he saw evil", cluster: ethics}
  fourfold-purity-of-the-phoenix: {label: "The dead declares 'I am pure' four times, his purity being that of the great phoenix (benu) of Herakleopolis", cluster: purity}
  deceased-witnessed-filling-of-udjat-eye: {label: "The dead claims to have seen the filling of the Udjat (Horus) eye at Heliopolis on a named day, as a credential", cluster: judgment-of-dead}
  no-witness-against-the-deceased: {label: "The dead declares himself without wrong, without sin and without any witness against him; there is no one he has harmed", cluster: judgment-of-dead}
  lives-on-maat: {label: "The just one lives on Maat and feeds on Maat; the divine judges too are said to live on Maat, with no lie in their bodies", cluster: judgment-of-dead}
  did-what-men-praise-and-gods-love: {label: "Self-praise: I did what people speak of and what the gods are pleased with; I satisfied the god with what he loves", cluster: ethics}
  bread-hungry-water-thirsty-clothes-naked: {label: "Self-praise of the just: I gave bread to the hungry, water to the thirsty, clothes to the naked (and a ferry to the boatless)", cluster: ethics}
  underworld-devourer-demon: {label: "A demon of the underworld (Babi, the Devouress) lives on the entrails of the great or devours the condemned on the day of reckoning", cluster: judgment-of-dead}
  merciless-messengers-of-judge: {label: "The judge's messengers inflict slaughter and punishment, and there is no mercy in their faces", cluster: judgment-of-dead}
  every-limb-pure-of-maat: {label: "The just one's front, back and middle are pure; no limb of his is without Maat", cluster: purity}
  purification-in-lake-before-judgment: {label: "The dead has purified himself in a sacred lake (the southern pool, the field of locusts) where the gods' crew washes", cluster: purity}
  interrogation-of-dead-at-gate: {label: "Gate-guardians interrogate the dead: who are you, what is your name, where did you pass, what did you see, what did they give you?", cluster: judgment-of-dead}
  door-parts-demand-their-secret-names: {label: "Each part of the gate (jambs, lintel, bolt, doorkeeper, floor, even the soles of the feet) refuses passage until the dead says its secret name", cluster: judgment-of-dead}
  thoth-announces-deceased-to-osiris: {label: "Thoth, the 'interpreter of the Two Lands', receives the purified dead and announces him to Osiris", cluster: judgment-of-dead}
  hall-of-osiris-fire-serpents-flood: {label: "The dwelling of Osiris has a roof of fire, walls of living uraeus serpents and a floor of flood water", cluster: judgment-of-dead}
  udjat-eye-as-bread-and-beer-of-dead: {label: "The justified dead is told: your bread is the Udjat eye, your beer is the Udjat eye, your offering on earth is the Udjat eye", cluster: judgment-of-dead}
  rubric-spell-recited-in-purity: {label: "Rubric: the spell is to be recited clean and pure, dressed in fresh linen, shod in white sandals, eyes painted and anointed with myrrh, after offering", cluster: ritual}
  ritual-image-on-ground-untrodden-by-pigs: {label: "The ritual image is drawn in ochre on clean ground on which no pig, goat (or lion, horse) has trodden", cluster: ritual}
  spell-benefits-children-and-favour-with-king: {label: "Whoever has this book made for him prospers with his children, is a confidant of the king and is turned back at no gate of the West", cluster: ritual}
  efficacy-proven-millions-of-times: {label: "Rubric formula: 'truly effective, (proven) millions of times'", cluster: ritual}
  heart-weighed-against-maat: {label: "In the judgment of the dead the heart is weighed on a balance against Maat; Anubis checks the plummet and Thoth records the result", cluster: judgment-of-dead}
  fate-and-birth-deities-at-judgment: {label: "Fate (Shai) and the birth goddesses (Renenet, Meskhenet) stand by the balance at the judgment of the dead", cluster: judgment-of-dead}
  heart-returned-to-justified: {label: "After the weighing the justified dead is given back his heart to its place", cluster: judgment-of-dead}
  osiris-enthroned-king-of-eternity: {label: "Osiris sits in his shrine as ruler of eternity, foremost of the West, before whom the dead is presented", cluster: judgment-of-dead}
  # --- Doomed Prince
  hathors-decree-fate-at-birth: {label: "Divine birth goddesses (the Hathors) come at a child's birth and pronounce his fate", cluster: fate}
  three-fates-crocodile-snake-dog: {label: "A prince is fated to die by the crocodile, the snake or the dog", cluster: fate}
  child-shut-away-from-fate: {label: "A parent tries to evade a child's foretold death by shutting him in a secluded house, which fails", cluster: fate}
  princess-in-high-window-suitor-contest: {label: "A king's only daughter is shut in a house with a window high above the ground; whoever leaps up to it wins her as wife", cluster: marriage}
  hero-conceals-royal-identity: {label: "A prince abroad passes himself off as the son of a lesser man (a chariot driver) driven out by a stepmother", cluster: hero}
  foreign-father-refuses-fugitive-son-in-law: {label: "The bride's father refuses to give his daughter to a fugitive from Egypt and sends men to kill him", cluster: marriage}
  bride-vows-to-die-with-beloved: {label: "The bride swears by the sun god that she will not eat or drink and will die within the hour if her beloved is taken or killed", cluster: marriage}
  wife-guards-sleeping-husband-kills-snake: {label: "A wife keeps watch by her sleeping husband, makes the attacking snake drunk with beer and wine, and has it hacked to pieces", cluster: hero}
  loyal-dog-refused-to-be-killed: {label: "The hero refuses to have his own dog killed although it is one of his fates, because he raised it from a pup", cluster: fate}
  fate-speaks-i-am-your-fate: {label: "The fated agent itself speaks: 'I am your fate which has come after you'", cluster: fate}
  god-gives-fate-into-hand: {label: "'Your god has given one of your fates into your hand': a danger overcome is credited to one's god", cluster: fate}
  # --- Eloquent Peasant
  powerful-man-schemes-to-rob-poor: {label: "A powerful man covets a poor man's goods and devises a trick to rob him", cluster: justice}
  path-blocked-pretext-for-seizure: {label: "A trap: a narrow path is blocked by a cloth on one side and grain on the other, so that the traveller's donkey eats a mouthful and is seized", cluster: justice}
  robbed-man-beaten-and-told-to-be-silent: {label: "The robbed man is beaten and told not to cry out because he is near the domain of the 'Lord of Silence'", cluster: justice}
  peasant-petitions-high-steward-nine-times: {label: "A robbed peasant petitions the high official again and again (nine times) for justice", cluster: justice}
  officials-side-with-powerful: {label: "The officials make light of the case: it is only a little natron and salt, let him repay it", cluster: justice}
  judge-silent-to-prolong-eloquence: {label: "The king orders the official to keep silent and not answer the eloquent petitioner, so that he will go on speaking, and to have his words written down", cluster: wisdom}
  petitioner-secretly-fed: {label: "The petitioner and his family are fed by order of the authorities without his knowing who provides for them", cluster: justice}
  official-praised-as-father-of-orphan-husband-of-widow: {label: "The judge is praised as father of the orphan, husband of the widow, brother of the divorced, loincloth of the motherless", cluster: justice}
  official-as-rudder-beam-plummet: {label: "The official is called the steering oar of heaven, the beam of the earth, the plumb-line that carries the weight; he must not swerve, tilt or waver", cluster: justice}
  justice-as-scales-tongue-plummet-heart-weight: {label: "Justice as a balance: the judge's tongue is the plummet, his heart the weight, his lips the arms of the scale; the scale must not tilt", cluster: justice}
  thoth-balance-not-lenient: {label: "Does the balance tilt, does the scale lean, is Thoth lenient? Then neither may the judge do wrong", cluster: justice}
  maat-is-breath-of-nose: {label: "Doing Maat (justice) is breath for the nose; the poor man's goods are his breath and to take them is to stop his nose", cluster: justice}
  inverted-officials-catalogue: {label: "Catalogue of officials turned into their opposites: the distributor robs, the dispeller of need causes it, the harbour is a flood, the punisher of evil does wrong", cluster: justice}
  corrupt-judge-as-predator-and-fisherman: {label: "The corrupt judge is likened to a bird of prey living on the weakest birds, a fisherman or hunter taking whatever he wants, a crocodile at the landing place", cluster: justice}
  corrupt-judge-as-ferryman-for-fare: {label: "The corrupt judge is a ferryman who carries only the one who can pay the fare", cluster: justice}
  maat-descends-with-just-to-necropolis: {label: "Maat is for eternity: it goes down with its doer into the necropolis, and his name is not effaced on earth but remembered for his goodness", cluster: justice}
  liar-has-no-heirs-reaches-no-harbour: {label: "Whoever grows rich by falsehood has no children and no heirs on earth; whoever sails with it never reaches land or harbour", cluster: justice}
  speech-bursts-like-breached-dam: {label: "The petitioner's speech bursts out of his full belly like water from a breached dyke", cluster: wisdom}
  petitioner-threatens-to-appeal-to-god-of-dead: {label: "Unheard, the petitioner says he will go and petition Anubis (the god of the dead) against the judge", cluster: justice}
  death-longed-for-like-water-by-thirsty: {label: "Death is longed for as the thirsty long for water and the infant for milk", cluster: death}
  oppressor-property-given-to-victim: {label: "In the end the oppressor's whole property is inventoried and given to his victim", cluster: justice}
  # --- Harper's Songs
  harpers-song-in-tomb: {label: "A song set in the tomb, sung by a harper before the dead owner, on death and how to live", cluster: death}
  generations-pass-others-remain: {label: "Generations pass away and others take their place, since the time of the ancestors (or of the god)", cluster: death}
  tombs-of-builders-vanished: {label: "Even the tombs of those who built great houses have crumbled and vanished, as if they had never been", cluster: death}
  sayings-of-imhotep-and-hordedef: {label: "The speaker has heard the words of the famous sages Imhotep and Hordedef, yet their own tombs have vanished", cluster: wisdom}
  no-one-returns-to-tell-of-dead: {label: "No one comes back from the beyond to tell of the dead and comfort our hearts", cluster: death}
  follow-your-heart-while-you-live: {label: "Follow your heart (desire) while you live: put myrrh on your head, dress in fine linen, do your things on earth", cluster: death}
  make-holiday-refrain: {label: "Refrain 'Make holiday (a beautiful day)! Do not weary of it!'", cluster: death}
  wealth-cannot-be-taken-along: {label: "No one can take his goods with him into death; what he owned falls to others", cluster: death}
  wailing-does-not-save-from-grave: {label: "The mourners' wailing does not save a man from the underworld; the weary-hearted dead does not hear it", cluster: death}
  death-as-landing-on-shore: {label: "The day of death is called the day of 'landing' (mnj), mooring in the land that loves silence", cluster: death}
  beloved-wife-beside-you-at-feast: {label: "At the feast of life the beloved wife sits at your side; put singer and harper before you", cluster: death}
  death-personified-sees-unseen-no-appointment: {label: "Death comes as one who sees but is not seen, keeps no appointment, destroys hearts and makes the house fall", cluster: death}
  fate-god-counts-days: {label: "The fate god (Shai) counts a man's days and hours; nothing is added to their sum", cluster: death}
  build-tomb-so-name-endures: {label: "Build yourself a house (tomb) in the necropolis so that your name endures in it", cluster: death}
  river-north-wind-south-each-to-his-hour: {label: "The Nile flows north and the north wind blows south: each man goes at his hour", cluster: death}
  song-rejecting-praise-of-earthly-life: {label: "A song rejects the old harper's songs that exalt earthly life and belittle the beyond: the land of eternity is just, without fear or enemies", cluster: death}
  life-on-earth-like-a-dream: {label: "The time spent on earth is but a dream compared with the land of eternity", cluster: death}
  all-must-reach-land-of-eternity: {label: "No one can stay in Egypt (the land of the living); everyone, even millions yet unborn, will come to the land of eternity", cluster: death}
  call-to-sun-god-answered: {label: "Blessing on the dead: you call to Re, Khepri hears and Atum answers you", cluster: death}
  sun-shines-into-tomb: {label: "The sun disk shines on the dead man's breast and lights up his tomb-cavern", cluster: death}
  dead-suckled-by-divine-cow: {label: "The dead is led to the breasts of the divine cow (Hesat) to be nourished", cluster: death}
  dead-takes-forms-at-will: {label: "The blessed dead may take whatever forms he wishes", cluster: death}
  name-not-forgotten-remembered-for-goodness: {label: "The just dead man's name will not be forgotten for ever; he is remembered for his goodness and spoken in people's mouths", cluster: death}
  sky-goddesses-mourn-at-door: {label: "The two kites (Isis and Nephthys) sit at the tomb door and lament the dead man's name", cluster: death}
  you-belong-to-tomorrow-not-yesterday: {label: "Blessing: you belong to the morning (tomorrow), not to yesterday; renew yourself like the frog, the 'repeater of life'", cluster: death}
  feed-landless-for-good-name: {label: "Give bread to him who has no field, so that you gain a good name for ever", cluster: ethics}
  # --- Doomed Prince (narrative details)
  hero-sets-out-to-wander-abroad: {label: "A young prince leaves home with chariot, servant and dog to wander abroad as his heart desires, living by hunting", cluster: hero}
  wicked-stepmother-drives-out-son: {label: "After the mother's death the father takes another wife, who comes to hate her stepson and drives him away", cluster: family}
  daily-thanks-and-offering-to-sun-god: {label: "Saved from danger, the hero offers to the sun god and praises his power every day", cluster: cult}
  crocodile-and-water-spirit-fight: {label: "A crocodile in a lake and a water-being ('the Strong One') fight each other daily for months, each keeping the other in", cluster: fate}
  # --- Eloquent Peasant (details)
  peasant-leaves-family-provisions: {label: "Before travelling to market the peasant has his wife measure out grain, leaving most for her and the children and taking a little for himself", cluster: family}
  catalogue-of-desert-produce: {label: "A long catalogue of the products of the desert oasis (natron, salt, woods, skins, plants, stones, birds) loaded on the peasant's donkeys", cluster: economy}
  weeping-from-pain-of-wrong: {label: "The robbed man weeps loudly for the pain of what was done to him", cluster: justice}
  just-official-sails-lake-of-maat: {label: "The just official is promised safe sailing on the 'lake of Maat': no squall tears his sail, no flood carries him off, fish and fowl come to him", cluster: justice}
  official-free-of-greed-destroys-falsehood: {label: "The ideal official is praised as free of greed and baseness, destroyer of falsehood and maker of Maat", cluster: justice}
  examine-me-plea: {label: "The sufferer asks the judge: drive away my need, examine me, for I am in distress", cluster: justice}
  dated-to-reign-of-named-king: {label: "The story is dated to the reign of a named king of the past (Nebkaure)", cluster: narrative}
  official-likened-to-sun-and-nile: {label: "The official is told 'you are Re, lord of the sky ... you are Hapi (the Nile flood) who makes the fields green': do not become a flood against the petitioner", cluster: justice}
  do-not-lie-to-judge: {label: "The judge is admonished: do not speak falsehood, for you are great, weighty, the balance itself", cluster: justice}
  lord-of-estate-punishes-thieves: {label: "The robbed man appeals to the reputation of the estate's lord as the one who punishes every robber in the land", cluster: justice}
  proverb-poor-mans-name-spoken-for-his-lord: {label: "Proverb thrown at the poor: 'the name of the poor man is spoken only for his master's sake'", cluster: wisdom}
  mortal-official-will-die-like-his-subjects: {label: "The great man is reminded that he will die with his dependants: will you be a man of eternity?", cluster: death}
  maat-flees-from-under-judge: {label: "Maat (justice) flees from under the judge, driven from her place", cluster: justice}
  seeing-blind-hearing-deaf-leader-misleads: {label: "The one who should see is blind, the one who should hear is deaf, the guide has become one who leads astray", cluster: justice}
  hungry-man-may-steal-sated-official-may-not: {label: "Theft is pardonable in the destitute, but not in the one who lacks nothing and is sated with bread and beer", cluster: justice}
  refuge-whose-landing-place-has-crocodiles: {label: "The judge should be a refuge, but his landing place is infested with crocodiles", cluster: justice}
  rescuer-of-the-shipwrecked: {label: "The judge is invoked as the one who brings the drowning to shore and rescues the shipwrecked", cluster: justice}
  do-not-repay-good-with-evil: {label: "Admonition: do not answer good with evil, do not put one thing in the place of another", cluster: ethics}
  truth-hidden-found-lie-thrown-down: {label: "When the hidden truth is found, falsehood is thrown on its back to the ground", cluster: justice}
  do-not-plan-for-tomorrow: {label: "Do not prepare for tomorrow before it has come: no one knows the trouble it holds", cluster: wisdom}
  petitioner-flogged-for-persistence: {label: "The official has the persistent petitioner flogged by guards with whips", cluster: justice}
  leaderless-community-similes: {label: "The negligent ruler's domain is like a town without its mayor, a body without its chief, a ship without its pilot, a troop without its leader", cluster: justice}
  goodness-destroyed-ferry-sunk: {label: "Goodness is destroyed: the ferry is sunk, so that one must wade the river in sandals; one may no longer travel by night or day or stand up for one's right", cluster: justice}
  neglected-fault-doubles: {label: "Saying: pass over a fault and it becomes two", cluster: wisdom}
  proverbs-eater-tastes-sleeper-dreams: {label: "Sayings: it is the eater who tastes, the one addressed who answers, the sleeper who sees the dream", cluster: wisdom}
  judge-titles-reversed-pleas: {label: "Pleas built on the judge's titles: steersman, let not your ship drift; life-giver, let none die; shade, do not act like sunglare; refuge, let not the crocodile seize", cluster: justice}
  judge-appointed-to-hear-and-punish-robber: {label: "The judge was appointed to hear cases, judge between two parties and punish the robber, but he supports the thief", cluster: justice}
  protector-become-flood: {label: "The one appointed as a dyke for the poor has become the flood that sweeps him away", cluster: justice}
  justice-satisfies-like-food-clothing-fire-water: {label: "The just official ends wrong as satiety ends hunger, clothing nakedness, calm the storm, fire the raw, water thirst", cluster: justice}
  share-gain-with-brother: {label: "If you gain something, give some of it to your fellow", cluster: ethics}
  none-knows-what-is-in-heart: {label: "Saying: one cannot know what is in the heart", cluster: wisdom}
  gardener-of-evil-waters-plot-with-lies: {label: "The gardener of evil waters his plot with wrongdoing, to make it grow with falsehood", cluster: justice}
  do-not-brood-over-future: {label: "Do not brood over what has not yet come nor rejoice over what has not yet happened", cluster: wisdom}
  wonder-workers-reversed-silent-made-speak: {label: "Ironic litany: there is no silent one you made speak, no sleeper you woke, no closed mouth you opened, no ignorant one you made wise", cluster: wisdom}
  officials-rejoin-severed-head: {label: "Officials are called 'masters of the good', craftsmen who create what is and rejoin a severed head", cluster: justice}
  greed-leads-to-fall: {label: "Greed makes one fall far; the greedy man lacks success and meets only failure", cluster: wisdom}
  sated-official-still-grasps: {label: "The official whose belly is full and whose grain measure overflows still grasps: is he a robber?", cluster: justice}
  do-maat-for-lord-of-maat: {label: "Exhortation: do Maat for the Lord of Maat", cluster: justice}
  speak-maat-do-maat-for-it-is-great: {label: "Speak Maat, do Maat, for it is great, mighty and enduring, and leads to honoured old age (imakh)", cluster: justice}
  speech-from-mouth-of-re: {label: "The petitioner calls his perfect speech one that comes from the mouth of Re himself", cluster: wisdom}
  writing-tools-of-thoth-addressed: {label: "The official is addressed as the reed, papyrus and palette of Thoth, and told to keep away from wrong", cluster: justice}
  no-friend-for-deaf-to-truth: {label: "Sayings: the sluggard has no yesterday, the one deaf to Maat has no friend, the greedy has no feast day", cluster: wisdom}
  petitioner-oath-of-dependence: {label: "The vindicated petitioner swears he will eat only of his protector's bread and drink only of his beer for ever", cluster: justice}
  petitions-read-from-new-roll-sent-to-king: {label: "The petitions are read out from a new papyrus roll and sent to the king, who is delighted and leaves the verdict to his official", cluster: justice}
  colophon-copied-as-found: {label: "Colophon: the text is complete from beginning to end as found in writing", cluster: scribal}
  # --- Harper's Songs (details)
  sun-rises-and-sets-life-continues: {label: "Re shows himself in the morning and Atum sets in the western mountain; husbands beget, women conceive, every nose breathes", cluster: death}
  mourners-pour-libations-sem-priest: {label: "At the burial the sem priest in a panther skin pours libations, women singers weep and the mummies are set up before Re", cluster: death}
  god-loves-maat: {label: "What the god loves is Maat (truth/justice)", cluster: ethics}
  gods-abomination-not-remembered: {label: "Do not remember evil, what the god abhors", cluster: ethics}
  righteous-quiet-man-praised: {label: "The dead is praised as upright, just, calm, patient, content, cheerful and one who speaks no evil", cluster: ethics}
  daily-drunkenness-until-death: {label: "Give your heart drunkenness every day until the day of landing (death) comes", cluster: death}
  libation-water-for-dead-from-nekropolis-gods: {label: "The gods of the necropolis are asked to give water to the dead", cluster: death}
  land-of-eternity-without-enemy: {label: "The land of eternity is just and right, without terror or strife, without an enemy; no one arms against his fellow there", cluster: death}
  dead-praised-as-living-god-in-west: {label: "The dead man is now a god living for ever, made great in the West", cluster: death}
  dead-body-whole-justified: {label: "The blessed dead is told: arise, your body lives, all your limbs are complete, you are justified before Re and Osiris", cluster: death}
  dead-rests-turning-on-either-side: {label: "Blessing: may you turn on your right side and on your left and be at ease in your place", cluster: death}
  dead-eats-as-on-earth: {label: "The blessed dead receives offerings and eats the same as on earth; his heart is glad in the necropolis", cluster: death}
  dead-given-all-in-necropolis-as-reward: {label: "All people in the necropolis are given to the dead as his reward", cluster: death}
  dwelling-in-holy-city-sweet: {label: "How sweet it is to dwell in the god's city (Thebes); the heart is in joy every day", cluster: cult}
  dead-praises-sun-every-morning: {label: "The blessed dead rises each morning to see Re and praise him", cluster: death}
  dead-soars-to-sky-like-bird: {label: "The blessed dead rises to heaven like noble vultures or calls like the divine benu bird", cluster: death}
  dead-welcomed-by-gods-of-eternity: {label: "The gods of eternity receive the dead man's ba, protect his mummy and greet him 'welcome in peace'", cluster: death}
  anubis-lays-hands-on-dead: {label: "Anubis lays his hands on the dead man as the mortuary rites are performed", cluster: death}
  osiris-rites-sokar-barque-djed: {label: "The dead official took part in the Osiris rites: dragging the Sokar barque, raising the djed pillar, hoeing the earth at Busiris", cluster: cult}
  dead-wakes-in-peace-in-tomb: {label: "Blessing: may you wake in peace in your tomb; your ba rests in the West", cluster: death}
  ba-comes-out-at-priests-voice-for-offerings: {label: "The dead man's ba comes out at the voice of the ka-priest or lector to receive the offerings", cluster: death}
  dead-hears-prayers-of-children: {label: "The dead may hear the petitions of his children at the door of his house", cluster: death}
  dead-joins-followers-of-horus: {label: "The blessed dead joins the followers of Horus and becomes one of them", cluster: death}
  dead-called-to-heaven-by-sun-god: {label: "The dead man is summoned to heaven by Re and remembered before the god who awakes unharmed", cluster: death}
  dead-abides-for-ever-in-city: {label: "The dead endures, abiding for ever in his city", cluster: death}
  god-protects-from-womb-to-old-age: {label: "The god has protected the man since he came from the womb until old age and assigns him honour and burial", cluster: death}
  union-with-firmament-after-good-life: {label: "After a life well spent the dead unites with the firmament", cluster: death}
  island-of-the-just: {label: "The blessed dead is on the 'island of the just one'", cluster: death}
units:
  # ===================== BOOK OF THE DEAD 125 =====================
  - id: ane-bd125-w1-a-introduction-first-confession
    tradition: ane-egyptian
    title: "BD 125 (pNu): arrival at the Hall of the Two Truths and the first declaration of innocence"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Egyptian"
    version: "pLondon BM EA 10477 (Nu), 18th dynasty"
    read: ["BD125 W1:1-20"]
    tags:
      - {motif: hall-of-two-truths-judgment, refs: ["BD125 W1:1"], note: "ḏd.t ḫft spr r wsḫ,t tn n.t Mꜣꜥ,tj pḫꜣ ... m ḫw,w nb jri̯.n =f: 'to be said on reaching this Hall of the Two Truths, separating NN from every sin he has done, seeing the faces of the gods'"}
      - {motif: forty-two-judges-of-the-dead, refs: ["BD125 W1:4"], note: "rn n pꜣ nṯr 42 n wnn.yw ḥnꜥ =k m wsḫ,t tn"}
      - {motif: judges-of-dead-drink-blood-of-evildoers, refs: ["BD125 W1:4"], note: "ꜥnḫ.yw m jr,j.w ḏw,t sꜥm.y m znf =sn: 'who live on those who belong to evil, who swallow their blood' (zꜣw,t emended to jr,j.w by TLA)"}
      - {motif: day-of-reckoning-of-characters-before-god-of-dead, refs: ["BD125 W1:4"], note: "hrw pwy n ḥsb qdw,w m-bꜣḥ Wnn-nfr,w: 'that day of reckoning the characters before Wennefer (Osiris)'"}
      - {motif: knowing-names-protects-before-judges, refs: ["BD125 W1:4", "BD125 W1:19/2-20"], note: "jw =j rḫ.kw ṯw rḫ.kw rn =k ... nn ḫpr bw ḏw r =j ... ḥr-n,tt {t}wj rḫ.kw rn n nn n nṯr.pl"}
      - {motif: deceased-brings-maat-drives-out-wrong, refs: ["BD125 W1:7-7/2"], note: "jni̯.n =j n =k Mꜣꜥ,t dr.n =j n =k jzf,t"}
      - {motif: negative-confession-before-divine-judges, refs: ["BD125 W1:7/3-17"], note: "the first (A) list: a run of n sḏm =f negations, n jri̯ =j ..."}
      - {motif: prohibition-murder-adultery-theft-false-witness, refs: ["BD125 W1:10/5"], note: "n smꜣ =j 'I have not killed'; theft, lying and adultery follow in the B list"}
      - {motif: denial-not-ordered-a-killing, refs: ["BD125 W1:11"], note: "n wḏ =j smꜣ"}
      - {motif: denial-not-caused-hunger-or-weeping, refs: ["BD125 W1:7/3", "BD125 W1:10/2-10/4", "BD125 W1:11/2"], note: "n smr =j, n sḥqr =j, n srm =j; n jri̯ =j mn,t ḥr-nb"}
      - {motif: denial-not-overworked-laborers, refs: ["BD125 W1:8/4"], note: "n jri̯ =j tp rꜥ,w-nb bꜣk.w m-ḥr.pl jri̯.tn =j 'I did not set, each day, work beyond what (could) be done'"}
      - {motif: denial-not-impoverished-poor-man, refs: ["BD125 W1:9/2"], note: "n nmḥ =j nmḥ,w m (j)ḫ,t =f"}
      - {motif: denial-not-maligned-servant-to-master, refs: ["BD125 W1:10"], note: "n sḏw =j ḥm n ḥr,j-tp =f"}
      - {motif: denial-not-diminished-temple-offerings, refs: ["BD125 W1:11/3-12"], note: "n ḫbi̯ =j šb,w m rʾ.pl-pr,w.pl; n ḥḏi̯ =j pꜣ.w,t nṯr.pl; n nḥm =j ḫnf,w ꜣḫ.pl"}
      - {motif: denial-not-lain-with-male, refs: ["BD125 W1:12/2"], note: "n nk =j nkk{nkk}"}
      - {motif: denial-not-falsified-weights-and-measures, refs: ["BD125 W1:12/4-13", "BD125 W1:13/3-13/4"], note: "n ḫbi̯ =j dbḥ (grain measure); n ḫbi̯ =j sṯꜣ,t (land measure); n wꜣḥ =j ḥr mw,t n.t jwsw (weights of the hand balance); n nmḥ =j m tḫ n mḫꜣ,t (plummet of the standing balance)"}
      - {motif: just-weights-and-measures, refs: ["BD125 W1:13/3-13/4"]}
      - {motif: denial-not-encroached-on-fields, refs: ["BD125 W1:13/2"], note: "n sjꜣṯ =j ꜣḥ,t.pl 'I have not diminished the fields'"}
      - {motif: denial-not-taken-milk-from-infant, refs: ["BD125 W1:14"], note: "n nḥm =j jrṯ,t m rʾ nḫn.w"}
      - {motif: denial-not-deprived-cattle-of-pasture, refs: ["BD125 W1:14/2"], note: "n kfꜣ =j ꜥw,t ḥr sm,w =sn"}
      - {motif: denial-not-poached-birds-or-fish-of-gods, refs: ["BD125 W1:14/3-15"]}
      - {motif: denial-not-held-back-water-or-dammed-flow, refs: ["BD125 W1:15/2-15/3"], note: "n ḫsf =j mw m tr =f; n dnj =j dnj,t ḥr mw ꜣs.w"}
      - {motif: denial-not-quenched-fire-in-its-time, refs: ["BD125 W1:16"], note: "n ꜥḫm =j ḫ,t m ꜣ,t =s"}
      - {motif: denial-not-obstructed-god-in-procession, refs: ["BD125 W1:16/2-17"], note: "includes not neglecting the dates of choice meat offerings (stp,t) and not driving cattle from god's property"}
      - {motif: fourfold-purity-of-the-phoenix, refs: ["BD125 W1:17/2-17/3"], note: "jw =j wꜥb.kw zp-4 ... ꜥbw bn,w pwy ꜥꜣ n,tj m Nn-nsw,t"}
      - {motif: deceased-witnessed-filling-of-udjat-eye, refs: ["BD125 W1:18-19"], note: "dated to ꜣbd 2 pr,t ꜥrq,y, last day of the second winter month; he is also 'the nose of the lord of the winds who gives life to all people'"}
    hints:
      - "The A list compares with the 'negative' self-justifications of Job 31:1-40 (esp. 31:5-7, 13, 16-21, 38-39), the entrance liturgies Ps 15:2-5 and Ps 24:3-6, Isa 33:15, the righteous man of Ezek 18:5-9, and the negative tithe declaration Deut 26:13-14."
      - "Not killing / ordering a killing: Exod 20:13; Deut 5:17; 2 Sam 12:9 (David killed Uriah by order). Quran: Q 17:33, Q 25:68, Q 6:151."
      - "Overworking labourers and making the poor poorer: Lev 19:13, Lev 25:43, Deut 24:14-15, Exod 22:20-26 (MT), Amos 2:6-7; Q 107:2-3, Q 89:17-20."
      - "False measures and balances: Lev 19:35-36, Deut 25:13-16, Prov 11:1, 16:11, 20:10, Amos 8:5, Mic 6:10-11; Q 83:1-3, Q 55:7-9, Q 17:35, Q 6:152, Q 11:84-85 (Shu'ayb)."
      - "Diminishing fields: compare moving a neighbour's boundary, Deut 19:14, 27:17, Prov 22:28, 23:10, Hos 5:10; Mic 2:2."
      - "Milk from the infant's mouth: compare Job 24:9 (they snatch the orphan from the breast)."
      - "Not quenching the fire: compare the perpetual altar fire that must not go out, Lev 6:5-6 (MT)."
      - "Sex with a male: Lev 18:22, 20:13; Q 7:80-81, Q 26:165-166."
      - "Purity: Ps 24:4 (clean hands, pure heart), Ps 51:9, 12 (MT)."
  - id: ane-bd125-w1-b-forty-two-addresses
    tradition: ane-egyptian
    title: "BD 125 (pNu): the second declaration of innocence, addressed to the 42 judges"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Egyptian"
    version: "pLondon BM EA 10477 (Nu)"
    read: ["BD125 W1:21-62"]
    tags:
      - {motif: confession-each-denial-to-named-judge, refs: ["BD125 W1:21-62"], note: "42 lines of the form j <epithet> pri̯ m <place> n jri̯ =j ...; first W1:21 j wsḫ-nmt,t pri̯ m Jwn,w n jri̯ =j jzf,t"}
      - {motif: negative-confession-before-divine-judges, refs: ["BD125 W1:21-62"]}
      - {motif: prohibition-murder-adultery-theft-false-witness, refs: ["BD125 W1:24", "BD125 W1:25", "BD125 W1:29", "BD125 W1:43"], note: "n ṯꜣw =j 'I have not stolen'; n smꜣ =j rmṯ 'I have killed no man'; n ḏd =j grg 'I have told no lie'; n nk =j ḥm,t-ṯꜣy 'I have not lain with a married woman' (to 'He who sees what he brings, from the Min temple')"}
      - {motif: adultery-prohibited, refs: ["BD125 W1:43"], note: "ḥm,t-ṯꜣy, literally 'a man's wife'"}
      - {motif: denial-not-lain-with-male, refs: ["BD125 W1:41"], note: "n nk =j nkk, to 'Whose evil is evil' of Busiris; also n dꜣdꜣ =j 'I have not fornicated' W1:42"}
      - {motif: denial-not-falsified-weights-and-measures, refs: ["BD125 W1:26"], note: "n ḥḏi̯ =j dbḥ, to Ruti from the sky"}
      - {motif: denial-not-encroached-on-fields, refs: ["BD125 W1:37"], note: "n ꜥwn =j ḥnb 'I have not robbed (in) the field survey', to the Entrail-eater of the Court of Thirty"}
      - {motif: denial-no-grain-usury, refs: ["BD125 W1:33"], note: "n jri̯ =j ḥnw,yt"}
      - {motif: denial-not-greedy-or-arrogant, refs: ["BD125 W1:23", "BD125 W1:58", "BD125 W1:60"], note: "n jri̯ =j ꜥwn-jb 'I was not greedy (covetous)'; n jri̯ =j šfw,t 'I did not puff myself up'; n wr ẖr,t =j n-js ḥr (j)ḫ,t 'my wants were not great except by my own property'"}
      - {motif: denial-of-faults-of-speech, refs: ["BD125 W1:38-39", "BD125 W1:45-48", "BD125 W1:52", "BD125 W1:56"], note: "n smtmt =j (not eavesdropped), n šmi̯ =j (not babbled), n tꜣ rʾ =j (speech not hot), n zẖi̯ =j ḥr =j ḥr md,t n.t mꜣꜥ,t (not made myself deaf to words of truth), n ṯrm =j ky (not winked at another), n šnṯ =j (not reviled), n ꜥšꜣ-ḫrw =j ḥr md,t, n qꜣi̯ ḫrw =j"}
      - {motif: denial-not-blasphemed-god-king-or-town-god, refs: ["BD125 W1:54", "BD125 W1:57", "BD125 W1:62"], note: "n jri̯ =j šnṯ r nsw,t (king); n šnṯ =j nṯr (a god); n sꜣt =j nṯr-nʾ,tj (the town god)"}
      - {motif: denial-quarrel-only-over-own-property, refs: ["BD125 W1:40"], note: "n sḫwn =j n js ḥr (j)ḫ,t =j"}
      - {motif: denial-did-no-wrong-though-saw-evil, refs: ["BD125 W1:53"], note: "n jri̯ =j jw,yt mꜣꜣ =j bjn"}
      - {motif: denial-not-obstructed-god-in-procession, refs: ["BD125 W1:28", "BD125 W1:36"], note: "n ṯꜣu̯ =j (j)ḫ,t-nṯr (not stolen god's property); n smꜣ =j jḥ nṯr,j (not slaughtered a sacred bull)"}
      - {motif: judges-of-dead-drink-blood-of-evildoers, refs: ["BD125 W1:36-37"], note: "judges named wnm znf 'Blood-eater' and wnm bsk.w 'Entrail-eater'; others 'Bone-breaker' (W1:29), 'Shadow-swallower' (W1:24)"}
    hints:
      - "The four Decalogue items appear as denials: Exod 20:13-16, Deut 5:17-20; compare Jer 7:9, Hos 4:2, and the women's pledge Q 60:12."
      - "Adultery with a neighbour's wife: Lev 18:20, 20:10, Job 31:9-11, Ezek 18:6; Q 17:32."
      - "Greed: Exod 20:17 (covet); Q 59:9 (saved from the avarice of the soul), Q 104:1-3."
      - "Speech: Ps 15:3 (no slander on his tongue), Ps 34:14 (MT), Prov 10:19, Lev 19:16 (no tale-bearing); eavesdropping/spying Q 49:12; loud voice Q 31:19; Q 25:63, 72."
      - "Reviling god and king: Exod 22:27 (MT) 'do not revile God nor curse a ruler of your people'; 1 Kgs 21:10, 13 (Naboth accused of cursing God and king); Lev 24:15-16."
      - "Grain usury: Exod 22:24 (MT), Lev 25:36-37 (food at interest), Deut 23:20, Ps 15:5, Ezek 18:8; Q 2:275-279, Q 3:130."
      - "Arrogance: Ps 131:1, Prov 16:5, 18; Q 17:37, Q 31:18."
  - id: ane-bd125-w1-c-address-to-gods-examination
    tradition: ane-egyptian
    title: "BD 125 (pNu): address to the gods of the hall, works of mercy, purity and the examination at the gate"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Egyptian"
    version: "pLondon BM EA 10477 (Nu)"
    read: ["BD125 W1:63-88/4"]
    tags:
      - {motif: knowing-names-protects-before-judges, refs: ["BD125 W1:63/3-64"], note: "jw =j rḫ.kw ṯn rḫ.kw rn.w =ṯn nn ḫr =j n šꜥ,t =ṯn"}
      - {motif: hall-of-two-truths-judgment, refs: ["BD125 W1:64/2-65/2"], note: "'you will not report my evil to this god ... my case will not come before you; may you speak Maat about me before the All-Lord'"}
      - {motif: denial-not-blasphemed-god-king-or-town-god, refs: ["BD125 W1:66-66/2"], note: "n šnṯ =j nṯr; n jwi̯ zp =j ḥr nsw,t 'my case did not come before the reigning king'"}
      - {motif: lives-on-maat, refs: ["BD125 W1:66/3", "BD125 W1:70/2-70/3"], note: "of the gods: jw,tj.w grg m ẖ,t =sn ꜥnḫ.yw m mꜣꜥ,t; of himself: ꜥnḫ =j m mꜣꜥ,t sꜥm =j m mꜣꜥ,t"}
      - {motif: underworld-devourer-demon, refs: ["BD125 W1:68"], note: "nḥm =ṯn wj m-ꜥ Bꜣby ꜥnḫ m bsk.w wr.w hrw pwy n jp,t ꜥꜣ.t 'save me from Babi who lives on the entrails of the great on that day of the great reckoning'"}
      - {motif: day-of-reckoning-of-characters-before-god-of-dead, refs: ["BD125 W1:68"], note: "hrw pwy n jp,t ꜥꜣ.t"}
      - {motif: no-witness-against-the-deceased, refs: ["BD125 W1:69-70"], note: "nn jzf,t =j nn ḫbn,t =j nn ḏw,t =j nn mtr,w =j nn jri̯.n =j (j)ḫ,t r =f"}
      - {motif: did-what-men-praise-and-gods-love, refs: ["BD125 W1:70/4-71"], note: "jri̯.n =j ḏd.t r(m)ṯ hrr!.t nṯr.pl ḥr =s; sḥtp.n =j nṯr m mrr!.t =f"}
      - {motif: bread-hungry-water-thirsty-clothes-naked, refs: ["BD125 W1:71/2"], note: "rḏi̯.n =j tʾ n ḥqr,w mw n jbi̯.w mnḫ,t n ḥꜣw mẖn,t n jwi̯,w: bread to the hungry, water to the thirsty, clothes to the naked, a ferry boat to the boatless"}
      - {motif: righteous-man-catalogue-of-virtues, refs: ["BD125 W1:71/2"], note: "interpretive: the BD 125 lists share with the catalogue no adultery, no oppression, no interest (grain usury), bread to the hungry and clothes to the naked"}
      - {motif: clean-hands-pure-heart, refs: ["BD125 W1:73/3"], note: "pure hands (and mouth) as the qualification for entering the god's presence: jnk wꜥb rʾ wꜥb ꜥ.wj 'I am pure of mouth, pure of hands', greeted 'welcome' by those who see him"}
      - {motif: merciless-messengers-of-judge, refs: ["BD125 W1:77"], note: "wpw,tj.w wdd!.yw ṯms.w sḫpr.yw jdr,yt jw,tj.w ṯꜣm,t n.t ḥr =sn"}
      - {motif: heart-weighed-against-maat, refs: ["BD125 W1:76/2"], note: "jy.n =j ꜥꜣ r smtr mꜣꜥ,t r rḏi̯.t jwsw r ꜥḥꜥ,w =f m-ẖnw jgr,t 'I have come to bear witness to Maat, to set the balance upright in the Igeret'; the weighing itself is not narrated in this witness"}
      - {motif: every-limb-pure-of-maat, refs: ["BD125 W1:79/2-80/3"], note: "nn ꜥ,t jm =j šwi̯.t m mꜣꜥ,t"}
      - {motif: purification-in-lake-before-judgment, refs: ["BD125 W1:81-81/2"]}
      - {motif: interrogation-of-dead-at-gate, refs: ["BD125 W1:82-88/4"], note: "ptr ṯw ... ptr rn =k ... swꜣ.n =k ḥr m ... ptr mꜣꜣ.tn =k jm; answers in cryptic mythological code (a leg and a thigh, a torch of fire and a faience amulet, buried, wept over, fire quenched, amulet broken and thrown in the canal)"}
    hints:
      - "'No witness against me / no one I have wronged': 1 Sam 12:3-5 (Samuel: whose ox have I taken? ... the LORD is witness), Job 31:35; Q 36:65, Q 41:20-21 (limbs and skins witness)."
      - "Bread to the hungry, water to the thirsty, clothes to the naked: Isa 58:7, Ezek 18:7, 16, Job 31:16-20, Job 22:6-7, Prov 25:21; Q 76:8-9, Q 90:11-16, Q 107:1-3, Q 69:34; also Matt 25:35-36."
      - "Pure mouth and hands: Ps 24:4, Ps 26:6, Job 17:9, Job 31:7."
      - "Babi, devourer of the guilty on the day of reckoning: Q 101:8-11 (light scales: 'his mother is Hawiya, a blazing fire'), Q 104:4-6 (al-Hutama)."
      - "Interrogation at the gate: Q 39:71-73 (keepers of hell and paradise question those arriving), Q 67:8-9."
  - id: ane-bd125-w1-d-gate-names-thoth-osiris
    tradition: ane-egyptian
    title: "BD 125 (pNu): the gate demands its names; Thoth announces the dead to Osiris"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Egyptian"
    version: "pLondon BM EA 10477 (Nu)"
    read: ["BD125 W1:89-108"]
    tags:
      - {motif: door-parts-demand-their-secret-names, refs: ["BD125 W1:89/4-97/3"], note: "nn ḏi̯! =n ꜥq =k ḥr =n j.n bnš.w n sbꜣ pn n-js ḏd.n =k rn =n; jambs, lintel, door, cross-beams, doorkeeper, then the floor, who asks the names of his feet"}
      - {motif: heart-weighed-against-maat, refs: ["BD125 W1:90/2", "BD125 W1:91/2"], note: "gate-part names: tḫ pw n b(w) mꜣꜥ 'the plummet in its right place'; ḥnk,w n fꜣi̯.t mꜣꜥ,t 'the scale-pan for weighing Maat'"}
      - {motif: god-tests-hearts-and-kidneys, refs: ["BD125 W1:98/4"], note: "the doorkeeper's name: sjꜣ jb.pl ḏꜥr ẖ,t.pl 'who perceives the hearts and searches the bodies'"}
