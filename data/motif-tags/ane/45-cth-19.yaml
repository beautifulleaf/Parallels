  # ---------------------------------------------------------------- CTH 25
  - id: ane-cth-25-zidanza-pilliya
    tradition: ane-hittite
    title: "Treaty of Zidanza II with Pilliya of Kizzuwatna (CTH 25)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Hittite"
    read: ["CTH 25 §1", "CTH 25 §2", "CTH 25 §3", "CTH 25 §4", "CTH 25 §5", "CTH 25 §6"]
    tags:
      - {motif: treaty-parity-mutual-clauses, refs: ["CTH 25 §1:1-6"], note: "'dUTU-ŠI LUGAL.GAL Zidanza ... Ù Pilliya LUGAL KUR Kizzuwatna takšul ier ... kiššan takšer' - they made peace (takšul) and agreed thus: the towns I took shall be My Majesty's alone; the towns of Pilliya that I took shall be Pilliya's alone."}
      - {motif: border-towns-not-to-be-fortified, refs: ["CTH 25 §2:7-13"], note: "Fortified towns (witantuš URU.DIDLI.ḪI.A) that I hold, Pilliya shall not fortify; '[n]ašta lingain šarratti' - (if you do) you break the oath."}
      - {motif: gods-listed-as-treaty-witnesses, refs: ["CTH 25 §6:21"], note: "Only 'dTatašš[una ...]' survives from the closing god list."}
    hints:
      - "A non-aggression pact over towns between neighbouring kings: 1 Kgs 20:34 (Ben-hadad restores the towns his father took); 1 Kgs 15:19-20."
  # ---------------------------------------------------------------- CTH 26
  - id: ane-cth-26-paddatissu-fugitives
    tradition: ane-hittite
    title: "Treaty with Paddatiššu of Kizzuwatna (CTH 26): fugitives, envoys, plotters and migrating settlements"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    read: ["CTH 26 §1", "CTH 26 §2", "CTH 26 §3", "CTH 26 §4", "CTH 26 §5", "CTH 26 §6"]
    tags:
      - {motif: treaty-return-fugitives, refs: ["CTH 26 §2:15-22"], note: "'šumma ÌR ša Paddatiššu ana SAG.DU bēlišu ippallas ana KUR Ḫatti irrub ... ibʾiranni-mi lū tēršu-mi' - if a servant plots against his lord's head and enters Hatti, and Paddatiššu writes 'he rebelled against me, give him back!', if the word is true, they return the fugitive."}
      - {motif: fugitive-returned-after-notables-swear, refs: ["CTH 26 §1:9-14", "CTH 26 §2:23-28"], note: "If the fugitive denies ('I did not rebel'), 'awatum išâr' he lies(?); the notables (LÚ.MEŠ SIG5-ūti) of the land whom the other king demands for the oath 'nīš ilāni ušazkarū' are made to swear, and the fugitive is returned."}
      - {motif: treaty-parity-mutual-clauses, refs: ["CTH 26 §1:1-14", "CTH 26 §3:29-32", "CTH 26 §4:33-40", "CTH 26 §5:41-48"]}
      - {motif: envoy-not-harmed-or-bewitched, refs: ["CTH 26 §3:29-32"], note: "Whether the great king sends his son or his servant, 'lemuttam lā ippuššu' he shall do him no harm, and vice versa."}
      - {motif: treaty-report-sedition-even-from-kin, refs: ["CTH 26 §4:33-40"], note: "If a servant of one king plots against his lord's life while staying in that land and the other king hears it, 'ana LUGAL GAL iqabbišu' he will name him to the great king."}
      - {motif: deserted-settlement-returned, refs: ["CTH 26 §5:41-48"], note: "If a town of the great king 'qadu MUNUS.NITA.MEŠ-šu dumqišu GUD.ḪI.A-šu USDUḪA.ḪI.A-šu itebbi' sets out with its people, goods, cattle and sheep and enters Kizzuwatna, Paddatiššu seizes it and returns it."}
      - {motif: fugitive-returned-after-notables-swear, refs: ["CTH 26 §6:49-66"], note: "Malicious report (ina sarrūtišu iqabbi) that a whole town migrated, when herders remained in it: a notable swears an oath and the people (MUNUS.NITA.MEŠ) are returned."}
    hints:
      - "Return of runaways between kings: 1 Kgs 2:39-40 (Shimei's slaves who fled to Achish king of Gath are brought back); contrast Deut 23:16-17 [15-16] (do not hand back a slave who has escaped to you)."
      - "Envoys mistreated as a cause of war: 2 Sam 10:1-6 (Hanun shames David's envoys)."
  - id: ane-cth-26-paddatissu-theft-homicide
    tradition: ane-hittite
    title: "Treaty with Paddatiššu (CTH 26): cattle theft by herdsmen, thieves, homicide 'a man like the man'"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    read: ["CTH 26 §7", "CTH 26 §8", "CTH 26 §9", "CTH 26 §10", "CTH 26 §11"]
    tags:
      - {motif: theft-repaid-twofold, refs: ["CTH 26 §7:67-74", "CTH 26 §8:78-85"], note: "Herdsmen who cross with cattle into the other's territory and steal: '[šu]rqu ša išarriqū 2-šu ana bēlišu umallû u 30 GÍN KÙ.BABBAR inandin' - they shall repay the stolen goods twofold to its owner and give 30 shekels of silver; if he does not pay he is a thief (LÚ.NÍ.ZU) and is seized."}
      - {motif: border-thief-killed, refs: ["CTH 26 §7:75-77", "CTH 26 §8:86-88"], note: "'lā LÚ.SIPA GUD.ḪI.A ana šarāqi illak u idakkūšu' - one who is no cowherd and goes to steal: they kill him."}
      - {motif: homicide-compensated-person-for-person, refs: ["CTH 26 §9:89-95", "CTH 26 §10:96-102"], note: "If a man of Hatti kills a man of Kizzuwatna with a bronze lance, dagger or axe, or sells him (ana šīmi inandin), or strikes him with a strong hand and he dies, 'LÚ kīma LÚ inandin' he shall give a man like the man."}
      - {motif: treaty-parity-mutual-clauses, refs: ["CTH 26 §7:67", "CTH 26 §8:78", "CTH 26 §9:89", "CTH 26 §10:96"]}
    hints:
      - "Double restitution for theft: Exod 22:3 [4] and 22:6-8 [7-9] (the thief pays double); contrast Exod 21:37 [22:1] (five oxen for an ox)."
      - "Kidnapping and selling a man: Exod 21:16; Deut 24:7 (death penalty). Compensation by a person: Exod 21:23 ('life for life'), 21:30 (ransom), Num 35:31 (no ransom for murder)."
      - "The thief who may be killed: Exod 22:1-2 [2-3] (the night burglar)."
  # ---------------------------------------------------------------- CTH 41 Šunaššura
