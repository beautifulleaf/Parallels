  - id: ane-cth-19-w3-laws
    tradition: ane-hittite
    title: "Telipinu Proclamation W3: laws on dividing the estate, on blood, and on sorcery in the family"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Hittite"
    version: "W3, KBo 19.96+"
    read: ["CTH 19 W3:{€1}_rev._IV_1'-{€1}_rev._IV_26'"]
    tags:
      - {motif: son-demanding-share-while-parents-live-expelled, refs: ["CTH 19 W3:{€1}_rev._IV_9'-{€1}_rev._IV_18'"], note: "Difficult and broken, read with the glosses and the Akkadian W7 rev. IV 19''-23'': 'when fathers and mothers die, the companions (ATḪŪ) ... a festival'; 'later they began to divide (šarriyawan dāer) in the house' and were no longer in awe, 'therefore they went mad (šiuniyaḫḫati?)'; 'kinuna kit pandalaz: mān=aš attiš ḫuišwanteš šarranaš [šer] kuwatka weriyezzi kuit=ašta šarranna KAxU-az weriyezzi našta É-erza parā peššiyandu naš=kan šarranaz=pat šamendu' - now from this time on, if while the fathers are alive one calls for division, whatever he calls for with his mouth: let them throw him out of the house and let him forfeit his share. Interpretive."}
      - {motif: blood-owner-chooses-death-or-compensation, refs: ["CTH 19 W3:{€1}_rev._IV_19'-{€1}_rev._IV_21'"], note: "'išḫanašša uttar kiššan kuiš ešḫar iēzzi nu kuit ešḫanaš=pat išḫāš tezzi takku tezzi akuwaraš naš aku takku tezzi=ma šarnikdu=wa nu šarnikdu LUGAL-i=ma=pa lē kuitki' - the law of blood: whoever sheds blood, what the lord of the blood says: if he says 'let him die', he shall die; if he says 'let him pay compensation', he shall pay; but to the king nothing."}
      - {motif: sorcery-in-family-brought-to-palace-gate, refs: ["CTH 19 W3:{€1}_rev._IV_22'-{€1}_rev._IV_26'"], note: "'Ḫattuši alwanzannaš našta uddār parkunuškatten' - in Hattusa clean up the cases of sorcery; 'kuiš=za ḫaššannan ištarna alwanzatar šakki šumeš=an ḫaššannanza epten nan ANA KÁ É.GAL uwatetten' whoever in the family knows sorcery, you of the family seize him and bring him to the palace gate; whoever does not bring him, 'apēdani UN-ši=pat idalaweszi' it will go badly for that very man."}
    hints:
      - "A son claiming his share while the father lives: Luke 15:11-13 (the prodigal); Sir 33:20-24 [19-23] (do not give your property to a son while you live; distribute it at the time of death); Deut 21:15-17."
      - "Homicide and the next of kin who decides: Num 35:19-21, 31 (no ransom for a murderer; contrast the Hittite choice of compensation); Deut 19:12 (the elders hand him to the avenger of blood); 2 Sam 14:5-11 (the woman of Tekoa pleads with the king against the blood avenger); Exod 21:30 (ransom); Q 2:178 (retaliation or compensation remitted by the victim's kin)."
      - "Sorcery and the duty of kin to hand over the offender: Exod 22:17 [18]; Deut 13:7-12 [6-11] (your brother, son, daughter or wife who entices you: your hand first against him); Deut 18:10-11; Lev 20:27; to the gate: Deut 21:19, 22:24."
