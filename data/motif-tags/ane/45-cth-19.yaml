      - "Queen of Heaven: Jer 7:18; 44:17-25."
      - "Gods of the Hapiru: compare the 'Hebrews' (ʿibrîm) in Exod 3:18 ('YHWH, the God of the Hebrews') and 1 Sam 14:21."
  - id: ane-cth-42-huqqana-curses-conditions
    tradition: ane-hittite
    title: "Ḫuqqana treaty (CTH 42) §9-26: oath gods destroy the oath-breaker, blessing for the loyal, enemy of the king, no excuse of neutrality"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Hittite"
    read: ["CTH 42 §9", "CTH 42 §10", "CTH 42 §11", "CTH 42 §12", "CTH 42 §13", "CTH 42 §14", "CTH 42 §15", "CTH 42 §16", "CTH 42 §17", "CTH 42 §18", "CTH 42 §19", "CTH 42 §20", "CTH 42 §21", "CTH 42 §22", "CTH 42 §23", "CTH 42 §24", "CTH 42 §25", "CTH 42 §26"]
    tags:
      - {motif: oath-gods-destroy-oathbreaker, refs: ["CTH 42 §10:59-68", "CTH 42 §14:100", "CTH 42 §18:134-137", "CTH 42 §22:175", "CTH 42 §26:206-207"], note: "'nu=tta kē NIŠ DINGIR.MEŠ lē daliyanzi' - these oath gods shall not let you be; 'apūn=a antuḫšan ... ḫarninkandu' and the man you side with they shall destroy; 'nu=šmaš kī uttar NIŠ DINGIR.MEŠ EGIR-an lē tarnanzi nu=šmat=ša lē āra ienzi nu=šmaš takšan ḫarninkandu' - the oath gods shall not release you, not count it as right, destroy you together."}
      - {motif: treaty-keeper-guarded-with-household, refs: ["CTH 42 §11:70-73", "CTH 42 §23:176-178"], note: "'mān zik=ma Ḫuqqanaš dUTU-ŠI=pat paḫḫašti ... nu=tta kē=ma NIŠ DINGIR.MEŠ aššuli paḫšandaru našta ANA QAT dUTU-ŠI anda āššu lūlu uški' - if you protect only My Majesty, may these oath gods protect you kindly, and in My Majesty's hand may you see good prosperity."}
      - {motif: blessing-and-curse-set-before, refs: ["CTH 42 §10:61-69", "CTH 42 §11:70-73"], note: "Curse for the disloyal (§10) followed at once by blessing for the loyal (§11): the double sanction of the oath."}
      - {motif: treaty-love-king-hate-his-enemy, refs: ["CTH 42 §13:86-92"], note: "'nu kuiš ANA dUTU-ŠI idāluš tukka apāš idāluš ēšdu; mān=aš ANA dUTU-ŠI LÚ.KÚR tukka=aš LÚ.KÚR ēšdu' - whoever is evil to My Majesty shall be evil to you, my enemy your enemy, a land's hostility to me your hostility."}
      - {motif: treaty-vassal-must-aid-overlord-at-once, refs: ["CTH 42 §14:93-100", "CTH 42 §21:157-167", "CTH 42 §22:168-175"], note: "If an enemy comes against My Majesty and I write to you, 'mān ÉRIN.MEŠ-it ANŠE.KUR.RA.ḪI.A-it lammar UL ārti' if you do not come at once (in that hour) with troops and chariots, but even favour him ... let these oath gods destroy you."}
      - {motif: treaty-vassal-may-not-plead-ignorance, refs: ["CTH 42 §15:101-111", "CTH 42 §16:112-118"], note: "If you hide a Hittite who plans evil against me and say 'ammuk=wa=za linganuwanza nu=wa UL kuitki memaḫḫi iyami=ya=wa UL kuitki aši=ma=wa maḫḫan iēzzi QATAMMA iēddu' - 'I am a sworn man; I say nothing and I do nothing; let that one do as he does' - may these oaths destroy you."}
      - {motif: treaty-report-sedition-even-from-kin, refs: ["CTH 42 §9:57-58", "CTH 42 §18:127-133", "CTH 42 §19:138-152"], note: "'na=at=mu=kan mān šannatti na=at=mu UL memātti' - if you hide it and do not tell me, hide that man and do not name him ..."}
      - {motif: love-overlord-as-own-soul, refs: ["CTH 42 §12:81-85"], note: "'nu=za=an mān ANA dUTU-ŠI šēr SAG.DU-KA=pat šēr autti' if you look upon My Majesty as on your own head, and say 'whatever happens to Ḫuqqana, for My Majesty may all be well'. §12 is written with scribal PAP PAP signs marking omitted words."}
      - {motif: treaty-no-other-king-or-lord, refs: ["CTH 42 §10:59-60", "CTH 42 §25:186-199"], note: "'apēdani imma EGIR-an tiyaši ANA dUTU-ŠI=ma awan arḫa tiyaši' - if you stand behind that one and step away from My Majesty."}
    hints:
      - "Curse on the covenant-breaker 'YHWH will not forgive him': Deut 29:18-20 [19-21] (he who says in his heart 'I shall have peace'; YHWH will not pardon him and every curse written in this book will settle on him)."
      - "Blessing and curse set side by side: Deut 11:26-28; 28:1-68; 30:15-20; Lev 26:3-39; Josh 8:34."
      - "No neutrality in loyalty: Judg 5:23 (curse Meroz, for they came not to the help of YHWH); Judg 21:8-10 (Jabesh-gilead); Matt 12:30."
      - "Enemies of my lord are my enemies: Ps 139:21-22; Exod 23:22 ('I will be an enemy to your enemies')."
      - "Duty to report treason even when one is sworn: Lev 5:1 (the one who hears the adjuration and does not tell bears guilt); Deut 13:9 [8] (do not conceal him)."
  - id: ane-cth-42-huqqana-palace
    tradition: ane-hittite
    title: "Ḫuqqana treaty (CTH 42) §27-28: the customs of the palace, keeping the king's words"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Hittite"
    read: ["CTH 42 §27", "CTH 42 §28"]
    tags:
      - {motif: treaty-keep-kings-secret-words, refs: ["CTH 42 §28:214-231"], note: "If I praise a man ('that man does well, I too will treat him well') or blame him ('that man is evil, I will treat him badly'), or praise or blame a land or town, and you repeat the word to them, 'that too shall be placed under oath for you'."}
      - {motif: treaty-report-sedition-even-from-kin, refs: ["CTH 42 §27:208-213"], note: "They will bring you up to my palace; the custom (šaklaiš) of the palace is weighty; whatever you see or hear, do not hide it from the palace."}
    hints:
      - "Talebearing of the king's words: Prov 11:13 and 20:19 (a talebearer reveals secrets); Eccl 10:20 (do not curse the king even in your thought, a bird will carry the voice); 2 Kgs 6:12."
  - id: ane-cth-42-huqqana-sexual-laws
    tradition: ane-hittite
    title: "Ḫuqqana treaty (CTH 42) §29-32: no intercourse with the wife's sisters and kinswomen; avoid palace women; the death of Mariya for a glance"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Hittite"
    read: ["CTH 42 §29", "CTH 42 §30", "CTH 42 §31", "CTH 42 §32"]
    tags:
      - {motif: incest-prohibitions-list, refs: ["CTH 42 §29:232-241"], note: "My sister whom I gave you has many sisters of her clan and seed; they are now your kin; 'ANA KUR Ḫatti=ma=kan šaklaiš du[qqā]ri ŠEŠ-aš=za NIN9-SÚ MUNUS anniyamin UL dāi UL=at āra' - in Hatti a law is weighty: a brother does not take his sister or female cousin; it is not right; whoever does it does not live in Hattusa but dies."}
      - {motif: foreign-customs-contrasted-with-own-law, refs: ["CTH 42 §29:242-245"], note: "'šumenzan KUR-e dampupi kuit anda=at za[ḫḫa]n ŠA DAM-ŠU=za NIN-ŠU MUNUS anniyamin daškanzi Ḫattuši=ma=at UL āra' - because your land is uncouth (dampupi) it is customary(?) there that one takes his wife's sister and cousin; in Hattusa it is not right."}
      - {motif: kinswoman-welcomed-with-food-not-desired, refs: ["CTH 42 §30:246-256"], note: "If your wife's sister, a brother's wife or a cousin comes to you, 'nu=šši adanna akuwanna pāi nu=za ezatten ekutten duškiškitten danna=ma=za lē ilaliyaši UL=at āra apēz=kan uddanaz arḫa akkiškanzi' - give her to eat and drink; eat, drink and rejoice; but do not desire to take her; it is not right; for this matter they die; if another urges you, do not listen."}
      - {motif: brothers-wife-forbidden, refs: ["CTH 42 §30:246"], note: "'ŠA ŠEŠ DAM-SÚ' - the brother's wife (of your wife) among those forbidden."}
      - {motif: avoid-palace-women, refs: ["CTH 42 §31:257-268"], note: "'ŠA É.GAL-LIM=ya=za MUNUS-TUM mekki uškaḫḫut' beware greatly of a palace woman, free woman or maid; do not go near her, do not speak a word to her; your servant or maid too; 'ŠA É.GAL-LIM kuwapi MUNUS autti našta KASKAL-az arḫa mekki watqaḫḫut nu=šši KASKAL-an arḫa tuwa tarna' - when you see a palace woman, jump far off the road and leave the way to her."}
      - {motif: man-executed-for-glance-at-palace-maid, refs: ["CTH 42 §32:269-278"], note: "Who was Mariya, and for what did he die? A maid passed and he looked at her; the father of My Majesty looked through the window and caught him: 'why did you look at her?' For that he died; 'for looking from afar the man perished' - so beware."}
    hints:
      - "Forbidden unions with close kinswomen and the foreign custom: Lev 18:3, 6-18, 24-30 ('you shall not do as they do in the land of Egypt and Canaan'); Lev 20:11-21; Deut 27:20-23; Q 4:23 (forbidden to you: two sisters together)."
      - "Wife's sister forbidden during the wife's life: Lev 18:18; contrast Gen 29:21-30 (Jacob marries the sisters Leah and Rachel)."
      - "Coveting a neighbour's woman; the look that kills: Exod 20:17; Deut 5:21; Job 31:1 (a covenant with my eyes); Matt 5:28; Q 24:30-31 (lower your gaze)."
      - "The king at the window sees a woman: 2 Sam 11:2 (David from the roof sees Bathsheba) - inverted: here it is the subject's look that is punished."
      - "Approaching the king's women as treason: 2 Sam 16:21-22 (Absalom and the concubines); 1 Kgs 2:13-25 (Adonijah asks for Abishag and dies); Esth 2:3, 12-14."
  - id: ane-cth-42-huqqana-wives-prisoners
    tradition: ane-hittite
    title: "Ḫuqqana treaty (CTH 42) §33-34: no brother's wives in Ḫayaša, no further Azzi wives, return the prisoners; colophon"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Hittite"
    read: ["CTH 42 §33", "CTH 42 §34"]
    tags:
      - {motif: brothers-wife-forbidden, refs: ["CTH 42 §33:279-283"], note: "When you go to Ḫayaša you shall no longer take the wives of your brother, your sisters-in-law; in Hattusa it is not right, nor when you come up to the palace."}
      - {motif: levirate-marriage, refs: ["CTH 42 §33:279-281"], note: "The Ḫayaša custom of taking a brother's wife (probably the widow) is forbidden to the vassal; interpretive: the text says only 'ŠEŠ-KA DAM.MEŠ-ŠU' the wives of your brother."}
      - {motif: overlords-kinswoman-must-be-chief-wife, refs: ["CTH 42 §33:284-288"], note: "Do not take another woman of Azzi as wife; the one you have up to now, dismiss her (from chief rank), let her rightly be your concubine; do not make her your wife."}
      - {motif: treaty-return-fugitives, refs: ["CTH 42 §33:291-293", "CTH 42 §34:294-301"], note: "Give back the prisoners of Hatti who went into Ḫayaša and the border lands; seize whoever hides them within the borders and dispute with him: 'why do you not give them back?' - 'let him be angry with you!'"}
    hints:
      - "Levirate as the foreign or ancestral custom: Deut 25:5-10; Gen 38:8; Ruth 4:5; contrast Lev 18:16, 20:21."
      - "A wife's rank guarded by her father: Gen 31:50 (Laban: 'if you take wives besides my daughters ... God is witness'); 1 Kgs 3:1 (Pharaoh's daughter); Deut 17:17 (the king shall not multiply wives)."
      - "Return of captives as a covenant term: 2 Chr 28:8-15 (the captives of Judah returned from Samaria)."
  # ---------------------------------------------------------------- CTH 44
