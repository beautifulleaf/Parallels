    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Hittite"
    version: "W2, KBo 12.7+"
    read: ["CTH 19 W2:{€3}_rev._III_1'-{€1}_rev._III_55'"]
    tags:
      - {motif: royal-storehouse-towns-listed, refs: ["CTH 19 W2:{€3}_rev._III_7'-{€1}_rev._III_44'"], note: "A long roll of towns (Tagalmuḫa, Ḫarkiya, Zelmutta, Tappašpa, Šukziya, Ašurna, Šamuḫa, Marišta, Ḫurma, Šalitta, Šamlušna, Gulpina, Pīša, Wašti(ša), Ḫurniya, Ḫurutta, Terumna, Ulašša, Parminiya, Paršuḫanta, ... the river Ḫulaya), 'ŠU.NÍGIN 1 ŠU-ŠI [...] URU.ḪI.A ŠA É.ḪI.A NA4.KIŠIB' - in total 60+ towns of the seal-houses; then 'nu=kan ḫalkiuš EGIR-an maknunun' I made the grain abundant."}
      - {motif: oppressors-drink-blood-of-land, refs: ["CTH 19 W2:{€1}_rev._III_45'-{€1}_rev._III_49'"], note: "The farmers are to plough and sow those very fields; formerly officials 'ilašni parā našu 1 gipeššar našma 2 gipeššar ḫaminkiškir našta utnē ešḫar akkuškir' added one or two cubits on to the measure and drank the blood of the land; 'kinuna lē eššanzi' now let them not do so; whoever does it, give him over to evil."}
      - {motif: curse-on-future-king-who-harms-legacy, refs: ["CTH 19 W2:{€1}_rev._III_50'-{€1}_rev._III_55'"], note: "'UR-RA-AM ŠE-RA-AM kuiš ammel [ḫalkiu]š ŠUM-aš=mit šiēški' - in future whoever seals my grain (stores) with his own name: they will leave you and say 'there is none' ... 'do not seal!' 'seal!' ... they will take it away from you. Fragmentary."}
    hints:
      - "Store-cities and royal granaries: Gen 41:34-36, 47-49 (Joseph stores grain in the cities); 1 Kgs 9:19 (Solomon's store-cities); 2 Chr 32:27-29 (Hezekiah's storehouses for grain, wine and oil); Q 12:47-49 and 12:55 ('set me over the storehouses of the land')."
      - "Falsifying measures; rulers who devour the people: Amos 8:5 (making the ephah small); Mic 3:2-3 (who eat the flesh of my people); Ezek 22:27 (officials like wolves shedding blood); Q 83:1-3 (woe to those who give short measure)."
