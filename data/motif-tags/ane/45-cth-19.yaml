      - {motif: royal-woman-murdered-with-her-sons, refs: ["CTH 19 W5:{€1}_obv._II_1-{€1}_obv._II_5"], note: "'parā duddumili uiyat' he sent secretly: 'MUNUS.LUGAL Šukziya=wa aku' - 'let the queen of Šukziya die'; when Ḫantili [heard?] he searched: 'kuiš=war=aš=kan k[uenta]' who killed her? The chief of the palace servants brought the news (ḫalugan udaš)."}
      - {motif: blood-avenger, refs: ["CTH 19 W5:{€1}_obv._II_5-{€1}_obv._II_7"], note: "The killers' family was gathered (anda taruppēr), [taken to] Tagarama, 'nu=šš=an ḫaḫḫallaš parḫer' they chased them into the thornbushes, and they died (še a[ker]); king as avenger of the queen."}
      - {motif: gods-seek-the-kings-blood, refs: ["CTH 19 W5:{€1}_obv._II_11-{€1}_obv._II_13"], note: "Zidanta killed the son of Ḫantili (Pišeni) with his sons and servants and became king; 'Pišeniyaš išḫar šanḫer' they (the gods) sought the blood of Pišeni, and 'the gods made [his son] his enemy'."}
      - {motif: regicide-chain, refs: ["CTH 19 W5:{€1}_obv._II_8-{€1}_obv._II_11"], note: "'mān Ḫantiliš=a LÚ.ŠU.GI kikkiššuwan dāiš' when Ḫantili began to grow old (and die) ..."}
    hints:
      - "A king avenges a murder in the royal family and executes the killers: 2 Sam 4:5-12 (David executes Ishbaal's murderers); 2 Kgs 14:5."
      - "Murder of a queen and her sons: 2 Kgs 11:1 (Athaliah destroys the royal seed); Judg 9:5 (Abimelech kills his seventy brothers)."
