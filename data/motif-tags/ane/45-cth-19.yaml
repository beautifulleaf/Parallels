      - {motif: enemy-lands-made-borders-of-sea, refs: ["CTH 19 W7:{€1+2}_obv._I_7'-{€1+2}_obv._I_8'"], note: "'mātātim uḫtanalliq mātātim urappiš u mātātim ana ZAG A.AB.BA ēpuš' - he destroyed the lands, enlarged the lands and made the lands the border of the sea."}
