      - {motif: land-turns-hostile-campaigns-fail, refs: ["CTH 19 W7:{€5}_obv._I_3''-{€5}_obv._I_10''"], note: "Blood of Mursili (damma ša Muršili); the Hurrians with donkeys(?) attacked the land of Hatti and roamed inside the land; 'LÚ.MEŠ ḫurri ištu mātiya ukaššidu' the Hurrians were driven from my land."}
      - {motif: royal-woman-murdered-with-her-sons, refs: ["CTH 19 W7:{€5}_obv._I_11''-{€2+4}_obv._II_10'"], note: "Ḫarapšili with her sons in Šugazziya; the queen fell ill; Ilaliuma, a palace servant; the queen was told 'limmut-mi' (let her die), they seized her with her sons; Ḫantili searched 'who killed them?'; Ilaliuma's family was seized and taken to Tagalaḫa and driven into the kazziru (thorns?)."}
      - {motif: gods-seek-the-kings-blood, refs: ["CTH 19 W7:{€4}_obv._II_11'-{€3+4}_obv._II._3'/15'"], note: "'Ḫanteli ištīb ana šīmtišu illik' Ḫantili grew old and went to his fate; Pišeni son of Ḫantili with his sons was killed; 'ītelī DINGIR.MEŠ ša Pišeni' the gods of Pišeni rose up (?) - restored."}
