      - {motif: border-land-measured-and-divided, refs: ["CTH 41.I.2 §61:271-272", "CTH 41.I.2 §62:275-276", "CTH 41.I.2 §62:280-281", "CTH 41.I.2 §62:285-286"], note: "'ina birišunu ZAG imandadū u izâzu' - between them they will measure the border and divide."}
      - {motif: border-towns-not-to-be-fortified, refs: ["CTH 41.I.2 §61:273", "CTH 41.I.2 §62:277", "CTH 41.I.2 §62:282", "CTH 41.I.2 §62:287"], note: "'URU Lamiya dUTU-ši ul ibanni' My Majesty will not fortify Lamiya; but Šaliya and Anamušta he may fortify."}
      - {motif: neither-party-crosses-border, refs: ["CTH 41.I.2 §64:296-298", "CTH 41.I.2 §65:299-302"], note: "'ÍD Šamri ZAG-šu; LUGAL.GAL ina idi KUR Adaniya ÍD Šamri ul ibbir; Šunaššura ina idi KUR Ḫatti ÍD Šamra lā ibbir' - the river Šamri is the border; neither king will cross it towards the other's land."}
    hints:
      - "A boundary that neither party will cross: Gen 31:51-52 ('I will not pass over this heap to you, and you will not pass over this heap and this pillar to me for harm'); Judg 11:13-27 (the Arnon and Jabbok as borders)."
      - "Borders listed town by town and by river: Num 34:1-12; Josh 15:1-12; Ezek 47:15-20."
      - "Do not move the ancient boundary: Deut 19:14; Prov 22:28."
