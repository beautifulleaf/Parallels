    read: ["CTH 51.I §17", "CTH 51.I §18"]
    tags:
      - {motif: gods-listed-as-treaty-witnesses, refs: ["CTH 51.I §17:226-233"], note: "Storm god lord of heaven and earth, Sîn and Šamaš, Sîn of Ḫarrān, heaven and earth, the storm god of Kaḫat, Ea-šarri lord of wisdom, Anu, Antu, Enlil, Ninlil, ... Nabarbi, Šuruḫi, Ištar, Šala, Damkina, Išḫara: 'ina libbi amāte annûti ša riksi lizzizzū liltemû u lū šībūtu'."}
      - {motif: vedic-gods-as-treaty-witnesses, refs: ["CTH 51.I §17:228"], note: "'DINGIR.MEŠ Mitraššil DINGIR.MEŠ Uruwanaššil dIndar DINGIR.MEŠ Našattiyanna' - Mitra, Varuna, Indra and the Nāsatya twins."}
      - {motif: mountains-rivers-sea-winds-clouds-as-witnesses, refs: ["CTH 51.I §17:230"], note: "'ḪUR.SAG.MEŠ u ÍD.MEŠ DINGIR.MEŠ AN DINGIR.MEŠ KI-ti'."}
      - {motif: heaven-and-earth-as-witnesses, refs: ["CTH 51.I §17:226"], note: "'AN u KI-ti' heaven and earth among the witnesses."}
      - {motif: treaty-oathbreaker-destroyed-with-household, refs: ["CTH 51.I §17:234-235"], note: "'šumma atta Šattiwazza ... amāte ša riksi annî lā tanaṣṣarā ... qadu KUR-tikunu qadu DAM.MEŠ-kunu u qadu mimmûkunu DINGIR.MEŠ bēl māmīti liḫalliqūnu' - if you do not keep the words of this treaty, the gods, lords of the oath, shall destroy you with your land, wives and property."}
      - {motif: curse-no-sprouting-like-malt, refs: ["CTH 51.I §17:236-239"], note: "'kīma buqli ištu eltešu išaddadūkunūši kīma ištu ŠÀ bubuwaḫi [Ú ul išû] ... NUMUN lā išû' - like malt from its husk may they draw you out; as no plant comes from bubuwaḫḫu, may you have no seed."}
      - {motif: curse-poverty-and-nakedness, refs: ["CTH 51.I §17:240"], note: "'muškēnūtta u errišūtta liddinkunūši' - poverty and nakedness may they give you."}
      - {motif: curse-throne-overturned, refs: ["CTH 51.I §17:241"], note: "'GIŠ.GU.ZA-ka lišbalkittū' - may they overturn your throne."}
      - {motif: curse-crushed-like-reed, refs: ["CTH 51.I §17:242"], note: "'nīš ilāni annûti qadu KUR-tika kī GI liḫaṣṣiṣṣūka' - may these oaths of the gods break you like a reed with your land."}
      - {motif: curse-oathbreakers-name-and-seed-destroyed, refs: ["CTH 51.I §17:243-244"], note: "'šumka u NUMUN-ka ša DAM-ti šaniti ... ištu KI-ti (NUMUN-ka liḫalliqū)' - your name and seed by another wife, from the earth (may they destroy)."}
      - {motif: curse-ground-slippery-like-ice, refs: ["CTH 51.I §17:246-251"], note: "'erṣetu lū šurīpu=ma teḫliṣṣā erṣetu ša KUR-tikunu lū sāḫu ... lū tašallā=ma lā tebbirā' - may the earth be ice that you slip, the soil of your land a pond that you sink and do not cross."}
      - {motif: curse-pursued-by-the-gods, refs: ["CTH 51.I §17:252-253"], note: "'ana līm ilāni lū LÚ.KÚR.MEŠ attunu likaššidkunūši' - may you be enemies to the thousand gods, may they hunt you down."}
      - {motif: treaty-keeper-guarded-with-household, refs: ["CTH 51.I §18:254-255"], note: "If you keep this treaty and oath, these gods shall guard you with your wife, the Hittite king's daughter, her sons and grandsons, and you sons of Hurri with your wives and sons."}
      - {motif: blessing-land-rich-and-lying-down-in-peace, refs: ["CTH 51.I §18:256-258"], note: "'u KUR Mittanni kī labirūti ana ašri[šu ...] [li]šri lirbiṣ' - may Mittani return to its place as of old, grow rich and lie down (in peace)."}
      - {motif: blessing-dynasty-rules-forever, refs: ["CTH 51.I §18:259-261"], note: "'ana LUGAL-ti dārātim=ma limēʾeršu ... GIŠ.GU.ZA ša [abika lubbir] KUR Mittanni lubbir' - may they rule in an eternal kingship; make the throne of your father grow old, make Mittani grow old."}
      - {motif: blessing-and-curse-set-before, refs: ["CTH 51.I §17:234", "CTH 51.I §18:254"], note: "'šumma ... lā tanaṣṣarā' / 'šumma ... tanaṣṣarā' - curses if you do not keep, blessings if you keep."}
    hints:
      - "Curses of the covenant: Deut 28:15-68 and Lev 26:14-39; poverty and nakedness: Deut 28:48 ('in hunger, thirst, nakedness and want of all things'); the throne overturned: Hag 2:22; crushed like a reed: 1 Kgs 14:15 (smite Israel as a reed is shaken), 2 Kgs 18:21, Isa 42:3; slippery ground: Ps 35:6 and 73:18, Jer 23:12; seed and name: Deut 29:19 [20], Ps 109:13."
      - "Pursued by the gods: Deut 28:22, 45 (they shall pursue you until you perish); Lev 26:36 (the sound of a driven leaf shall chase them)."
      - "Blessing of the land at rest: Lev 26:3-6 ('you shall lie down and none shall make you afraid'); Deut 28:1-14; Ezek 34:14-15, 25-28."
      - "Eternal dynasty for the loyal: 2 Sam 7:16; Ps 89:29-38 [28-37] (if his sons forsake my law ... my covenant I will not break); 1 Kgs 9:4-7."
  # ---------------------------------------------------------------- CTH 52.I Šattiwazza's oath
  - id: ane-cth-52-i-suttarna-ruins-mittani
    tradition: ane-hittite
    title: "Šattiwazza's treaty with Šuppiluliuma (CTH 52.I) §1-2: Šuttarna ruins the palace, gives the trophy door to Assyria, blinds and impales the nobles; Šattiwazza escapes"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    read: ["CTH 52.I §1", "CTH 52.I §2"]
    tags:
      - {motif: king-bows-to-former-servant, refs: ["CTH 52.I §1:4-12"], note: "Šuttarna ruined the palace of the kings to give (gifts) to Assyria and Alše; Tušratta had filled it with wealth (mašrīta umtelli); 'ana LÚ Aššurāyi ÌR abišu ša mandatta [lā inaddinu] ... maššarissu ana NÍG.BA-šu ittadin' - to the Assyrian, his fathers' servant who did not pay tribute, he (bowed) and gave his treasure as a present."}
      - {motif: trophy-door-given-to-enemy, refs: ["CTH 52.I §2:14-16"], note: "'GIŠ.IG KÙ.BABBAR u KÙ.SIG17 ša Sauššatar LUGAL abu abiya ... ultu KUR Aššur ... ilqû ina Waššukanni ana É.GAL-šu izzaqapšunu inanna Šuttarna ana qulūlišu ana KUR Aššur ittadin' - the door of silver and gold that my ancestor Sauššatar took from Assyria and set up in his palace at Waššukanni, Šuttarna to his shame has given to Assyria."}
      - {motif: captive-blinded, refs: ["CTH 52.I §2:22-23"], note: "'LÚ.MEŠ GAL-ti ana KUR Aššur u ana KUR Alše ... uttepilšunu' - the nobles he (handed over) to Assyria and Alše and they were blinded."}
      - {motif: rebels-impaled, refs: ["CTH 52.I §2:24-26"], note: "'ana URU Taite ana GIŠ.MEŠ izzaqapūšunūti' - at Taide they impaled them on stakes; he destroyed all the Hurrians."}
      - {motif: gods-lead-fugitive-on-safe-path, refs: ["CTH 52.I §2:32-38"], note: "Akit-Teššub plotted to kill me; 'ina qātišu altaḫiṭ' I escaped his hand; 'ana DINGIR.MEŠ ša dUTU-ši Šuppiluliuma ... ana gerri ša lā [ḫalāq]i irteddûninni' - (I called) to the gods of My Majesty Šuppiluliuma and they led me on a road of not-perishing; the gods of Hatti and of Mittani brought me to the great king."}
    hints:
      - "Temple and palace doors stripped as tribute to Assyria: 2 Kgs 18:15-16 (Hezekiah strips the gold from the doors of the temple for the king of Assyria); 2 Kgs 16:8 (Ahaz sends the temple treasure to Tiglath-pileser)."
      - "Nobles blinded and taken away: 2 Kgs 25:7 (Zedekiah's sons killed before his eyes, his eyes put out); Judg 16:21."
      - "God leads the fugitive on the way: Gen 24:27 (YHWH led me on the way); Gen 28:15, 20; Ps 23:3; Ps 107:7."
  - id: ane-cth-52-i-adoption-campaign
    tradition: ane-hittite
    title: "CTH 52.I §3-7: Šattiwazza at the great king's feet, adoption as son, the word that does not turn back, the campaign to Irride and Waššukanni"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    read: ["CTH 52.I §3", "CTH 52.I §4", "CTH 52.I §5", "CTH 52.I §6", "CTH 52.I §6a", "CTH 52.I §7"]
    tags:
      - {motif: suppliant-falls-at-overlords-feet, refs: ["CTH 52.I §3:39-43"], note: "'[ina] URU Maraššantiya ana GÌR dUTU-ši Šuppiluliuma ... [amqut] ... ana qātišu iṣṣabtanni=ma ina UGU-ia iḫtadu' - at Maraššantiya (I fell) at My Majesty's feet; the great king took me by his hand and rejoiced over me, and asked about all the affairs of Mittani."}
      - {motif: overlord-adopts-vassal-as-son, refs: ["CTH 52.I §3:45-49"], note: "'šumma Šuttarna u [LÚ.MEŠ K]UR Mittanni ... anāku ul anassukka ana DUMU-ūttiya eppuškâ-mi ana r[ēšika] azzaz ina GIŠ.GU.ZA ša abika ušeššibka' - I will not cast you off; I make you my son, I stand at your side, I will seat you on your father's throne."}
      - {motif: kings-word-does-not-return-void, refs: ["CTH 52.I §3:50-51"], note: "Šuppiluliuma - 'the gods know him!' - 'amātu ša ina KA×U-šu uṣṣû ana kutalli [ul ittūrū]' - the words that come out of his mouth do not turn back."}
      - {motif: overlord-takes-prince-by-hand-sets-on-fathers-throne, refs: ["CTH 52.I §3:49", "CTH 52.I §3:55-59"], note: "Šattiwazza: 'if my lord makes me live (tuballaṭanni) and the gods stand at my side' - let the great king not remove Artatama from his throne; I will stand as his crown prince (terdennūtu) and rule Mittani."}
      - {motif: exile-arrives-with-nothing, refs: ["CTH 52.I §4:62-63"], note: "When I went to the great king I had three chariots, two Hurrians, two attendants, one set of clothes on my body, and nothing else."}
      - {motif: gods-go-before-the-army, refs: ["CTH 52.I §5:79"], note: "'u DINGIR.MEŠ ša LUGAL GAL LUGAL KUR Ḫatti ittalkū a[na pānini]' - the gods of the great king of Hatti went before us."}
      - {motif: envoys-demand-submission, refs: ["CTH 52.I §4:68-75"], note: "At Karkemiš we sent a messenger to Irride; the Hurrians, won over by Tušratta's treasure, replied to Piyaššili: 'why do you come? If you come to fight, come! You shall not go (back) to the land of the great king!'"}
    hints:
      - "Adoption formula for the king: Ps 2:7 ('you are my son, today I have begotten you'); 2 Sam 7:14; Ps 89:27-28 [26-27]."
      - "Falling at the feet of the powerful protector: 1 Sam 25:23-24 (Abigail at David's feet); 2 Kgs 4:27, 37; Esth 8:3."
      - "The word that does not return void: Isa 55:11 (my word shall not return to me empty); Isa 45:23; Num 23:19."
      - "Gods (God) going before the army: Deut 1:30, 20:4, 31:8; Judg 4:14; 2 Sam 5:24; Exod 13:21."
      - "Arriving with nothing but one's staff and clothes: Gen 32:11 [10] ('with my staff I crossed this Jordan'); Job 1:21."
  - id: ane-cth-52-i-deposit-witnesses-curses
    tradition: ane-hittite
    title: "CTH 52.I §8-10: deposit and reading, tampering, the Hittite gods as witnesses, curses and blessings (duplicate of CTH 51.I §16-18)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    read: ["CTH 52.I §8", "CTH 52.I §9", "CTH 52.I §10"]
    tags:
      - {motif: treaty-duplicate-deposited-before-god, refs: ["CTH 52.I §8:128"], note: "'ina KUR [Mittanni ...]' - deposit before the storm god of Kaḫat; restored after CTH 51.I §16."}
      - {motif: covenant-read-before-people, refs: ["CTH 52.I §8:129"], note: "'[...] ana pāni LUGAL KUR [Mittanni ...]' - (read again and again) before the king; restored."}
      - {motif: treaty-curse-on-whoever-alters-it, refs: ["CTH 52.I §8:130-134"]}
      - {motif: gods-listed-as-treaty-witnesses, refs: ["CTH 52.I §8:138-151", "CTH 52.I §9:154-156"], note: "Preserved names include the storm god lord of the army, the storm god of Š[amuḫa], Hebat of Kizzuwatna, Zababa of Hatti, Ḫantidaššu, the gods of the nulaḫḫi (mountain-men) and of the SA.GAZ; 'ana aḫāmiš lū šībūtu' together may they be witnesses."}
      - {motif: primeval-and-underworld-gods-as-witnesses, refs: ["CTH 52.I §8:152"], note: "'dEREŠ.KI.GAL [DINGIR.MEŠ dā]rūti dNarra' - Ereškigal, the eternal (primeval) gods, Narra."}
      - {motif: heaven-and-earth-as-witnesses, refs: ["CTH 52.I §8:153"], note: "'[... A]N u KI IM.MEŠ u urpatu' - heaven and earth, winds and clouds."}
      - {motif: mountains-rivers-sea-winds-clouds-as-witnesses, refs: ["CTH 52.I §8:153"]}
      - {motif: treaty-oathbreaker-destroyed-with-household, refs: ["CTH 52.I §9:157-158"]}
      - {motif: curse-no-sprouting-like-malt, refs: ["CTH 52.I §9:159-163"], note: "'[kīma buql]i qadu eltišu išaddadūkunūši kīmê ištu pupuwaḫḫi Ú ul išû' ... no seed."}
      - {motif: curse-poverty-and-nakedness, refs: ["CTH 52.I §9:164"]}
      - {motif: curse-throne-overturned, refs: ["CTH 52.I §9:165"]}
      - {motif: curse-crushed-like-reed, refs: ["CTH 52.I §9:166"]}
      - {motif: curse-oathbreakers-name-and-seed-destroyed, refs: ["CTH 52.I §9:167-168"], note: "'šumka u NUMUN-ka ... ištu [KI] NUMUN-šu liḫalliq' - your name and seed ... from the earth may he destroy his seed."}
      - {motif: curse-ground-slippery-like-ice, refs: ["CTH 52.I §9:170-175"]}
      - {motif: curse-pursued-by-the-gods, refs: ["CTH 52.I §9:176-177"]}
      - {motif: treaty-keeper-guarded-with-household, refs: ["CTH 52.I §10:178-179"]}
      - {motif: blessing-land-rich-and-lying-down-in-peace, refs: ["CTH 52.I §10:180-182"], note: "'KUR Mittanni [kī] labirūti ana ašrišu litūr lišri lirbiṣ'."}
      - {motif: blessing-dynasty-rules-forever, refs: ["CTH 52.I §10:183-185"]}
    hints:
      - "As for CTH 51.I §16-18: Deut 31:9-13, 24-26 (deposit and reading); Deut 28 and Lev 26 (curses and blessings); Deut 4:2 (no change to the words)."
  - id: ane-cth-52-i-mittani-gods-self-curses
    tradition: ane-hittite
    title: "CTH 52.I §11-12: the gods of Mittani; Šattiwazza and the Hurrians curse themselves - tamarisk, water of the gutter, smoke, salt; their blessing in the lord's shade"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    read: ["CTH 52.I §11", "CTH 52.I §12"]
    tags:
      - {motif: gods-listed-as-treaty-witnesses, refs: ["CTH 52.I §11:186-189"], note: "Storm god of heaven and earth, Sîn and Šamaš, Sîn of Ḫarrān, Ea lord of wisdom, Šumuqan of Kurda, Anu, Antu, Enlil, Ninlil, the storm gods of Waššukanni and of Irride, Nabarbi, Šuruḫi, Ištar, Šala, Išḫara, Pardaḫi of Šūda."}
      - {motif: vedic-gods-as-treaty-witnesses, refs: ["CTH 52.I §11:188"], note: "'DINGIR.MEŠ Mitraššil DINGIR.MEŠ Arunaššil dIndar DINGIR.MEŠ Našattiyanna'."}
      - {motif: mountains-rivers-sea-winds-clouds-as-witnesses, refs: ["CTH 52.I §11:190"], note: "'ḪUR.SAG.MEŠ ÍD.MEŠ u PÚ.MEŠ DINGIR.MEŠ ša AN u KI' - mountains, rivers and springs, gods of heaven and earth."}
      - {motif: self-curse-oath-first-person, refs: ["CTH 52.I §11:191-207"], note: "'šumma anāku Šattiwazza ... u DUMU.MEŠ Ḫurri amāte ša riksi annî lā ninaṣṣar' - if I and we sons of Hurri do not keep ... (we curse ourselves); 'DINGIR.MEŠ bēl māmīti liḫalliqūnâši' may the gods, lords of the oath, destroy us."}
      - {motif: curse-no-shoot-like-cut-tree, refs: ["CTH 52.I §11:193-195"], note: "'kīma GIŠ.Ù.TÚK ina niksišu pirʾam lā išû' - as a tamarisk (or acacia) once cut has no shoot, so may we with our lands, wives and sons have no seed."}
      - {motif: water-spilled-on-ground-cannot-be-gathered, refs: ["CTH 52.I §11:196-197"], note: "'kīma mê GIŠ.PISAN ina ašrišu ayya itūrū u nênu kīma mê GIŠ.PISAN ana ašrini lā nitâr' - as the water of the gutter (drainpipe) does not return to its place, so may we not return to our place."}
      - {motif: curse-rise-like-smoke, refs: ["CTH 52.I §11:198-199"], note: "'qadu mimmûni kī quṭri ana AN i nilli' - with our goods may we go up like smoke to heaven."}
      - {motif: curse-barren-as-salt, refs: ["CTH 52.I §11:200-203"], note: "'kīma MUN NUMUN lā išû ... kīma MUN NUMUN [lā nīšu] akī LAG ṭābti ana ašrini lā nitūra' - as salt has no seed, so may we have none; like a lump of salt may we not return to our place."}
      - {motif: curse-throne-overturned, refs: ["CTH 52.I §11:204-205"], note: "'anāku Šattiwazza šumma DAM-ta šanīta aḫassu GIŠ.GU.ZA-ia lišbalkit' - if I marry another wife, may they overturn my throne."}
      - {motif: overlords-kinswoman-must-be-chief-wife, refs: ["CTH 52.I §11:192", "CTH 52.I §11:198", "CTH 52.I §11:204"], note: "Each self-curse includes 'qadu DAM-ti šaniti ša aḫassu' - with the other wife whom I might marry: a second wife is itself the breach."}
      - {motif: treaty-keeper-guarded-with-household, refs: ["CTH 52.I §11:208-213"], note: "'DINGIR.MEŠ ša šumšunu nizkuru littalkūnâši lirēpišūnâši liṣṣurūnâši lidammiqūnâši' - may the gods whose names we have spoken go with us, strengthen us, guard us, do us good."}
      - {motif: vassals-live-in-lords-shade, refs: ["CTH 52.I §11:214-216"], note: "'bēli Šattiwazza ana pāni lillik nênu ina ṣillišu ebūra mâda lū nīkul dumqa u nuḫta lū nīmur' - may my lord Šattiwazza go before us, may we eat a rich harvest in his shade, may we see good and rest."}
      - {motif: king-as-protective-shade, refs: ["CTH 52.I §11:215"]}
      - {motif: blessing-land-rich-and-lying-down-in-peace, refs: ["CTH 52.I §11:216-218"], note: "'dU GÚ.GAL AN u KI ana dārâti lū rēṣṣuni' - may the storm god, canal-inspector of heaven and earth, be our help for ever; joy of heart and peace of mind may we have for ever."}
      - {motif: overlord-loves-vassal-like-his-tablet, refs: ["CTH 52.I §11:219-220"], note: "'kīmê dUTU-ši Šuppiluliuma ... KUR.KUR.MEŠ-šu ÉRIN.MEŠ-šu DUMU.MEŠ-šu ... kīma ṭuppišu irammu' - as Šuppiluliuma loves his lands, troops, sons and grandsons like his tablet, so may he love me and Mittani."}
    hints:
      - "Self-curse formulas of the oath: Num 5:21-22 (the woman says 'Amen, Amen'); Deut 27:15-26 (all the people shall say Amen); Neh 10:30 [29] (they entered into a curse and an oath); Ps 7:4-6 [3-5]."
      - "A felled tree without a shoot: Job 14:7-9 (there is hope for a tree that it will sprout again) - inverted; Isa 6:13; Mal 3:19 [4:1] (leave them neither root nor branch)."
      - "Water spilled that cannot be gathered: 2 Sam 14:14; Ps 58:8 [7]."
      - "Vanishing like smoke: Ps 37:20; 68:3 [2]; 102:4 [3]; Hos 13:3."
      - "Salt and barrenness: Judg 9:45 (Abimelech sows Shechem with salt); Deut 29:22 [23] (the whole land brimstone and salt, not sown); Jer 17:6; Zeph 2:9."
      - "Living in the shadow of the anointed: Lam 4:20 ('under his shadow we shall live among the nations'); Judg 9:15 (come, take refuge in my shade); Isa 32:2."
