      - {motif: royal-storehouse-towns-listed, refs: ["CTH 19 W7:{€5}_rev._IV_7'-{€5}_rev._IV_17'"], note: "'É NA4.KIŠIB' seal-house; 'NA4.KIŠIB LÚ.MEŠ AGRIG' the seal of the stewards; '½ PA ŠE umadd[ad]' half a parīsu of grain he shall measure out; rations measured by the stewards."}
      - {motif: son-demanding-share-while-parents-live-expelled, refs: ["CTH 19 W7:{€6}_rev._IV_13''-{€2}_rev._IV_23''"], note: "'ana zuzzi mammān=ma ilabbiru ana šīmtišunu ... mārūšunu izuzzu' when someone grows old and goes to his fate, their sons shall divide; '... ana abi ummi izzuzzu ... abu ummu balṭū u zuzza ... ša zuzza iqabbi ḪA.LA-šu=ma lū šūtuq' - (if) while father and mother are alive (someone says) 'division!', he who says 'division', his share shall be forfeit."}
