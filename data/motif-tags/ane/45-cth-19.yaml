      - {motif: sorcery-in-family-brought-to-palace-gate, refs: ["CTH 19 W7:{€2}_rev._IV_27''-{€2}_rev._IV_31''"], note: "'[kašš]apūtam īde attunu ša kimtišunu lū tubbalānišu limmut' - (whoever) knows sorcery, you who are of his family must bring him; let him die."}
