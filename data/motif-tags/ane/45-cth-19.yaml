      - {motif: overlord-guarantees-vassals-chosen-heir, refs: ["CTH 44 §4:5-9"], note: "King and queen will recognize Telipinu in priesthood and service, Arnuwanda in brotherhood; we will protect him; he must desire no other (lord) in Hatti."}
      - {motif: treaty-love-king-hate-his-enemy, refs: ["CTH 44 §7:17-20", "CTH 44 §8:24-25"], note: "Whoever sins (waštai) against the king, queen or prince, the priest or his son shall not favour him; 'nan ANA LUGAL maḫḫan LÚ.KÚR-ŠU apēdani=ya=aš QATAMMA LÚ.KÚR-ŠU ēšdu' as he is the king's enemy, so let him be his; whoever is friend (āššuš) to king and queen, let him be friend to the priest."}
      - {motif: treaty-report-sedition-even-from-kin, refs: ["CTH 44 §9:30-34"], note: "Whoever speaks evil of the king and queen, or makes light (tepnuzi) of the king's administration or law (šaklain), and you hear him: 'nan lē munnāši' do not hide him, tell the palace."}
      - {motif: assembly-judges-royal-crimes, refs: ["CTH 44 §15:50-51", "CTH 44 §16:52-60"], note: "If his brothers and sisters turn evil against him, they shall have the case judged (DI-NAM ḫannandu) [before the great king]; if someone slanders the priest before a lord, or a lord before the priest, neither shall be seized or take hostile action: [the great king] shall interrogate (punušdu)."}
    hints:
      - "The king's sons as priests: 2 Sam 8:18 ('David's sons were priests'); 1 Kgs 4:5; a royal appointee as priest at a provincial sanctuary: 1 Kgs 12:31-32; Judg 17:5."
      - "Disputes among brothers referred to the king: 2 Sam 15:2-6; 1 Kgs 3:16-28; Deut 17:8-12."
  # ---------------------------------------------------------------- CTH 50
  - id: ane-cth-50-sarri-kusuh-carchemish
    tradition: ane-hittite
    title: "Šuppiluliuma's decree for his son Šarri-Kušuḫ, king of Karkemiš (CTH 50): borders, the gold tablet, the gods of Karkemiš as witnesses"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Hittite"
    read: ["CTH 50 §1"]
    tags:
      - {motif: king-installs-son-as-vassal-king, refs: ["CTH 50 §1:2"], note: "'nu LU[GAL-d3]0-an a[mmel DUMU-YA] INA KUR Kargamiš L[UGAL-iznani] titnunun' - I installed Šarri-Kušuḫ, my son, as king in Karkemiš (restored)."}
      - {motif: overlord-fixes-vassal-borders-by-town-list, refs: ["CTH 50 §1:3-22"], note: "Facing Gaduma and the land of Mukiš; Mount Ammari[ti]; Pidina; then a litany 'parā=ma=šši ḪUR.SAG ... ZAG-aš' - further, Mount X is his border, ten times; Karkuma; 'kūš ḪUR.SAG.MEŠ Š[A ...]' these mountains are the borders."}
      - {motif: curse-on-who-alters-royal-monument, refs: ["CTH 50 §1:28-29"], note: "'[n]an=kan waḫnuzi ... ANA DUMU-YA=pat a[rḫ]a dā-' - whoever overturns it and takes (these lands) away from my son ...; the curse itself is lost."}
      - {motif: treaty-duplicate-deposited-before-god, refs: ["CTH 50 §1:30"], note: "'[ ... dKar]ḫaḫa pē[r]an' - before the deity Karḫuḫa (is the tablet placed); restored."}
      - {motif: gods-listed-as-treaty-witnesses, refs: ["CTH 50 §1:31-33"], note: "'dKa[rḫuḫa] dKupapa DINGIR.MEŠ-aš=ša Š[A ...]' - Karḫuḫa, Kubaba and the gods of [Karkemiš] (are witnesses); the people were sworn to my son Šarri-Kušuḫ in Karkemiš."}
      - {motif: treaty-on-gold-tablet, refs: ["CTH 50 §1:34"], note: "'ṬUPPI GUŠKIN' - a tablet of gold."}
    hints:
      - "Tribal or vassal borders traced by mountains: Josh 15:8-11; Num 34:7-8."
      - "Kubaba, goddess of Karkemiš: Kybele of later Anatolia; compare the gods of the nations in 2 Kgs 17:29-31."
      - "Tablets of precious material for a covenant: Exod 31:18 and 32:15-16 (tablets written by the finger of God); 1 Macc 8:22 (bronze tablets of the Roman treaty)."
  # ---------------------------------------------------------------- CTH 51.I Šattiwazza
  - id: ane-cth-51-i-prologue-tusratta
    tradition: ane-hittite
    title: "Šuppiluliuma's treaty with Šattiwazza (CTH 51.I) §1-5: historical prologue, Tušratta's arrogance, the one-year campaign"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    read: ["CTH 51.I §1", "CTH 51.I §2", "CTH 51.I §3", "CTH 51.I §4", "CTH 51.I §5"]
    tags:
      - {motif: treaty-historical-prologue, refs: ["CTH 51.I §1:1-25"], note: "Historical prologue: 'enūma itti dUTU-ši Šuppiluliuma LUGAL GAL UR.SAG ... narām dU Artatama LUGAL KUR Ḫurri ina birišunu riksa irkusu' - when Artatama made a treaty with me, Tušratta of Mittani challenged me; I took the lands of this side of the Euphrat and made Mount Niblani my border."}
      - {motif: arrogant-king-provokes-war, refs: ["CTH 51.I §1:6-17", "CTH 51.I §2:27", "CTH 51.I §5:83"], note: "Tušratta 'ana pāniya ultarraḫ' boasted before me: 'why do you plunder the far bank of the Euphrat? ... I will cross, if even a lamb or a kid of my land is harmed'; 'ana gummurišu ḫašeḫ' he sought total rule; 'aššum multarriḫūtišu ša Tušratta' because of Tušratta's arrogance I crossed the Euphrat."}
      - {motif: overlord-fixes-vassal-borders-by-town-list, refs: ["CTH 51.I §1:4-5", "CTH 51.I §5:85"], note: "'ultu ḪUR.SAG Niblani ultu ullî ÍD UD.KIB.NUN.NA ana miṣriya utter' - I made Mount Niblani on this side and the Euphrat on that side my border."}
      - {motif: deportation-to-assyria, refs: ["CTH 51.I §3:47", "CTH 51.I §4:63-65", "CTH 51.I §5:69-70", "CTH 51.I §5:78-79", "CTH 51.I §5:82-84"], note: "Refrain 'ana KUR Ḫatti ulterib' I brought them into the land of Hatti - Šūda with cattle, sheep and horses; Akiya of Araḫati and Akit-Teššub with all their chariot fighters; Qatna; Šarrupše's mother, brothers and sons; Šutatarra and Aitakkama; the king of Abina; all in one year."}
      - {motif: vassal-king-installed-on-throne, refs: ["CTH 51.I §5:71"], note: "'Takip-šarri ARAD-sú ša Šarrupši ana URU Ugulzat ana LUGAL-ūtti altakanšu' - I set Takip-šarri, Šarrupše's servant, as king in Ugulzat."}
      - {motif: deported-peoples-returned-to-their-homes, refs: ["CTH 51.I §2:35-40"], note: "Išuwa: 'KUR.KUR.MEŠ ša alqû umteššeršunūti ana ašrišunu=ma ittašbū' - the lands I took I released and they settled in their own places again."}
    hints:
      - "Historical prologue grounding the covenant: Deut 1:6-3:29; Josh 24:2-13; 1 Sam 12:7-11; Judg 11:15-27 (Jephthah's history of the land as legal argument)."
      - "Boastful royal challenge and its punishment: 2 Kgs 14:8-14 (Jehoash to Amaziah, the thistle and the cedar); 2 Kgs 18:19-35; Isa 10:12-15 (the arrogant boasting of the king of Assyria); Isa 37:23-29."
      - "Borders from a mountain to the Euphrat: Deut 1:7, 11:24 (from the wilderness and Lebanon, from the River, the Euphrat, to the western sea); Gen 15:18; Josh 1:4."
      - "Campaign that takes many kings in one year: Josh 10:42 ('all these kings and their land Joshua took at one time'); Josh 12."
  - id: ane-cth-51-i-sattiwazza-installed
    tradition: ane-hittite
    title: "CTH 51.I §6-8: Tušratta killed by his son, the storm god's verdict, not a straw taken, Šattiwazza set on his father's throne and given a daughter"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    read: ["CTH 51.I §6", "CTH 51.I §7", "CTH 51.I §8"]
    tags:
      - {motif: king-murdered-by-his-son, refs: ["CTH 51.I §6:86-87"], note: "'enūma DUMU-šu itti ARAD.MEŠ-šu ussemiḫ-ma abūšu Tušratta LUGAL iduk' - his son made common cause with his servants and killed his father, king Tušratta."}
      - {motif: storm-god-decides-lawsuit-by-kings-death, refs: ["CTH 51.I §6:88-89", "CTH 51.I §6:102"], note: "'kīmê Tušratta LUGAL imtūt dU dīnšu ša Artatama iprus' - when Tušratta died, the storm god decided the case of Artatama; 'dīnšu dU iddinšu' the storm god has given him his verdict."}
      - {motif: not-a-straw-taken, refs: ["CTH 51.I §6:93-94"], note: "'ḫāma u ḫuṣṣāba ša KUR Mittanni ul ilqe' - I took not a straw nor a splinter of the land of Mittani."}
      - {motif: overlord-revives-dead-kingdom, refs: ["CTH 51.I §6:90-91", "CTH 51.I §6:105-106"], note: "Artatama's son 'gave life to the dead Artatama' while all Mittani perished (ḫalqa); the great king 'KUR Mittanni aššum DUMU.MUNUS-šu uballissu' brought Mittani to life for his daughter's sake, 'so that Mittani, a great land, should not perish'."}
      - {motif: overlord-takes-prince-by-hand-sets-on-fathers-throne, refs: ["CTH 51.I §6:98-104", "CTH 51.I §6:107"], note: "Šuttarna and his chariot fighters sought to kill prince Šattiwazza; he escaped (ilṭaḫiṭ) to me; 'kīmê Šattiwazza ... ana ŠU-ia aṣṣabat ina GIŠ.GU.ZA ša abišu ušeššibšu' - since I took Šattiwazza by my hand, I will seat him on his father's throne."}
      - {motif: overlord-gives-royal-woman-to-vassal-wife, refs: ["CTH 51.I §6:108", "CTH 51.I §7:109-110"], note: "'DUMU.MUNUS ana DAM-ūttišu attadinšu' I gave him a daughter to wife; Šattiwazza shall be king, the Hittite king's daughter queen of Mittani."}
      - {motif: overlords-kinswoman-must-be-chief-wife, refs: ["CTH 51.I §7:111-116"], note: "'akkâša Šattiwazza MUNUS.MEŠ esrētu lū muššurat u MUNUS-tu šanītu eli DUMU.MUNUS-ia rabītu yānu' - concubines are allowed you, but there is no other woman greater than my daughter; you shall not let another be her equal nor take my daughter elsewhere."}
      - {motif: treaty-binds-future-generations, refs: ["CTH 51.I §7:117-120"], note: "The sons of Šattiwazza and of my daughter, their sons and grandsons 'ina arki ūmi'; the sons of Mittani shall seek no revolt against them; Šattiwazza and his sons shall be brothers and equals to my sons and grandsons."}
      - {motif: treaty-love-king-hate-his-enemy, refs: ["CTH 51.I §8:121-130"], note: "The sons of Hatti and of Mittani shall not look at one another with an evil eye (ina īni lemutti), nor do evil; the enemy of one is enemy of the other, the friend (salmu) of the king of Hatti friend of the king of Mittani."}
    hints:
      - "A king slain by his son: 2 Kgs 19:37 (Sennacherib killed by his sons Adrammelech and Sharezer, who flee to Urartu); 2 Chr 32:21."
      - "Death of a ruler as divine judgement in a lawsuit: 1 Sam 25:39 ('blessed be YHWH who has judged the case of my reproach from the hand of Nabal'); 1 Sam 24:16 [15] (YHWH judge and plead my cause)."
      - "Not a thread nor a sandal strap: Gen 14:22-23 (Abram to the king of Sodom); Num 16:15 (not one donkey have I taken); 1 Sam 12:3-4."
      - "A dead people brought back to life: Ezek 37:1-14; Hos 6:2."
      - "Taking by the hand and seating on the throne: Isa 42:6 and 45:1 (Cyrus, whose right hand I have grasped); Ps 73:23; 1 Kgs 2:12."
      - "The overlord's daughter as chief wife: 1 Kgs 3:1, 7:8, 9:16 (Pharaoh's daughter); Gen 31:50."
  - id: ane-cth-51-i-stipulations
    tradition: ane-hittite
    title: "CTH 51.I §9-15: stipulations - the treaty, aid, fugitives returned one way only, the Euphrat border, brotherhood of Piyaššili and Šattiwazza"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    read: ["CTH 51.I §9", "CTH 51.I §10", "CTH 51.I §11", "CTH 51.I §12", "CTH 51.I §13", "CTH 51.I §14", "CTH 51.I §15"]
    tags:
      - {motif: treaty-overlord-promises-military-help, refs: ["CTH 51.I §11:145-150"], note: "Fragmentary: the enemy who has become hostile to you ... 'ša KUR Ḫatti itebbûnikk ana rēṣ[ūti ...]' (the troops) of Hatti will march to you as help; 'ina libbi māmīti lā niššakkan' we do not place it in the oath."}
      - {motif: treaty-return-fugitives, refs: ["CTH 51.I §12:151-153"], note: "A fugitive from Hatti: the sons of Mittani seize him and bring him back."}
      - {motif: escaped-slave-not-returned, refs: ["CTH 51.I §12:154-162"], note: "'šumma LÚ munnabittu ša KUR Mittanni ... LUGAL KUR Ḫatti ul iṣabbatsu ul utāršu ul parṣū ša dUTU URU Arinna' - a fugitive of Mittani who comes to Hatti the king of Hatti will not seize nor return; it would not be the rite (parṣu) of the Sun goddess of Arinna; Šattiwazza is to settle him in a town; he belongs to Hatti."}
      - {motif: overlord-fixes-vassal-borders-by-town-list, refs: ["CTH 51.I §13:163-175"], note: "The Euphrat before me and Mount Niblani behind me set as my border; Murmurik, Šipri, Mazuwati, Šurun given to my son [Piyaššili]; the towns of Aštata, Ekalte, Aḫuna, Terqa; the towns of the bank Piyaššili holds are his."}
      - {motif: overlord-revives-dead-kingdom, refs: ["CTH 51.I §14:176-177"], note: "'u anāku LUGAL.GAL ... KUR Mittanni mīta uballassu ana maškanišu utâr' - I, the great king, will make dead Mittani live and return it to its place."}
      - {motif: treaty-curse-on-whoever-alters-it, refs: ["CTH 51.I §14:178-181"], note: "Not a curse but the injunction: 'lā tasaḫḫaramma lā tašallaṭā ištu riksikunu lā tetiqāma miṣrikunu lā tubbaʾā' - do not turn back, do not tear apart, do not transgress your treaty, do not seek (to enlarge) your borders."}
      - {motif: treaty-report-sedition-even-from-kin, refs: ["CTH 51.I §14:183-187"], note: "If a town of Piyaššili sends a secret message (puzri) to Šattiwazza, he will expose the secret (pirištašu ušeṣṣi), seize the messenger and send him to Piyaššili his brother."}
      - {motif: brothers-dwell-together-in-unity, refs: ["CTH 51.I §14:188", "CTH 51.I §15:189-196"], note: "'Piyaššili u Šattiwazza ana aḫḫūtti ana aḫāmiš raksū' - Piyaššili and Šattiwazza are bound to each other in brotherhood; neither shall plot (zapurta) against the other when called to a meeting."}
      - {motif: neither-party-crosses-border, refs: ["CTH 51.I §15:197-199"], note: "The towns of Šattiwazza on the Euphrat bank he shall keep; he shall not seize another town on the bank."}
    hints:
      - "Asylum for the runaway: Deut 23:16-17 [15-16] ('you shall not hand over to his master a slave who has escaped to you'), here as a religious rule of the Sun goddess; contrast 1 Kgs 2:39-40."
      - "Do not transgress the covenant or turn aside: Deut 5:32 and 17:20 (turn not aside to the right or left); Josh 23:6; Hos 8:1."
      - "Covenant of brotherhood between rulers: Amos 1:9 (Tyre forgot the covenant of brothers); 1 Kgs 9:13 and 20:32-34 ('he is my brother')."
  - id: ane-cth-51-i-deposit-witnesses
    tradition: ane-hittite
    title: "CTH 51.I §16: deposit before the Sun goddess and the storm god of Kaḫat, repeated public reading, curse on tampering, the divine witnesses"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    read: ["CTH 51.I §16"]
    tags:
      - {motif: treaty-duplicate-deposited-before-god, refs: ["CTH 51.I §16:200-202"], note: "'meḫer ṭuppi anniti ana pāni dUTU URU Arinna šakin kīmê dUTU URU Arinna LUGAL-ūtta u MUNUS.LUGAL-ūtta umaʾʾar u ina KUR Mittanni ana pāni dU bēl kurinni ša URU Kaḫat šakin' - a duplicate of this tablet is placed before the Sun goddess of Arinna, who governs kingship and queenship, and in Mittani before the storm god, lord of the kurinnu of Kaḫat."}
      - {motif: covenant-read-before-people, refs: ["CTH 51.I §16:203"], note: "'emmūti emmūti=ma ana pāni LUGAL KUR Mittanni u ana pāni DUMU.MEŠ KUR Ḫurri liltassû' - again and again let it be read before the king of Mittani and before the sons of the land of Hurri."}
      - {motif: public-reading-of-law-to-all, refs: ["CTH 51.I §16:203"]}
      - {motif: treaty-curse-on-whoever-alters-it, refs: ["CTH 51.I §16:204-208"], note: "'u mannumê ana pāni dU ... ṭuppa annita unakkar=ma ašar puzri išakkan šumma iḫeppi šumma amāte.MEŠ ša KA ṭuppi ušašna' - whoever before the storm god removes this tablet and puts it in a hidden place, or breaks it, or changes the words of the tablet: (the gods are called)."}
      - {motif: no-adding-or-subtracting, refs: ["CTH 51.I §16:207"], note: "'amāte ša KA ṭuppi ušašna' changes the wording of the tablet."}
      - {motif: gods-listed-as-treaty-witnesses, refs: ["CTH 51.I §16:208-223"], note: "'DINGIR.MEŠ ša puzri u DINGIR.MEŠ ša bēl māmīti niltassi lizzizzū liltemû u lū šībūtu' - we have called the gods of the secret and the gods, lords of the oath: let them stand, listen and be witnesses: the Sun goddess of Arinna, the Sun god lord of heaven, the storm gods of Hatti and the cities, the LAMMA gods, Ea, Damkina, Telipinu, Ištar, Aškašipa, Nisaba, Zababa, Ḫebat, the local goddesses; 'DINGIR.MEŠ lulaḫi DINGIR.MEŠ SA.GAZ' the gods of the mountain-men and of the Hapiru; all the male and female gods of Hatti and Kizzuwatna."}
      - {motif: storm-god-of-mount-hazzi, refs: ["CTH 51.I §16:214"], note: "'dŠēri dḪurra ḪUR.SAG Nanni ḪUR.SAG Ḫazzi' - the bulls Šeri and Ḫurri and the mountains Nanni and Ḫazzi (Ṣapon) among the witnesses."}
      - {motif: primeval-and-underworld-gods-as-witnesses, refs: ["CTH 51.I §16:224"], note: "'DINGIR.MEŠ erṣeti dNāra dNamšara dMinki dAmmunki dTuḫuši dAmmizadu dAlalu dAnu dAntu dEnlil dNinlil' - the gods of the underworld and the primeval gods."}
      - {motif: mountains-rivers-sea-winds-clouds-as-witnesses, refs: ["CTH 51.I §16:225"], note: "'ḪUR.SAG.MEŠ ÍD.MEŠ A.AB.BA ÍD UD.KIB.NUN.NA šamû u erṣeti IM.MEŠ urpatu' - mountains, rivers, the sea, the Euphrat, heaven and earth, winds and clouds."}
      - {motif: heaven-and-earth-as-witnesses, refs: ["CTH 51.I §16:225"]}
    hints:
      - "Deposit of the covenant document in the sanctuary: Deut 10:1-5 and 31:24-26 (the book placed beside the ark as witness); Exod 25:16, 21 and 40:20 (the testimony placed in the ark); 1 Sam 10:25 (laid up before YHWH); Josh 24:26."
      - "Periodic public reading of the covenant: Deut 31:9-13 (every seven years at Sukkot before all Israel); Josh 8:34-35; 2 Kgs 23:1-3; Neh 8:1-8."
      - "Not to add to or take away from the words: Deut 4:2 and 13:1 [12:32]; Prov 30:6; Rev 22:18-19; tampering with the scroll: Jer 36:23 (Jehoiakim burns the scroll)."
      - "Heaven, earth, mountains, rivers as witnesses: Deut 32:1; Isa 1:2; Mic 6:1-2; Jer 2:12; Ps 50:4."
      - "Gods of the Hapiru: Exod 3:18, 5:3 ('the God of the Hebrews')."
  - id: ane-cth-51-i-mittani-gods-curses-blessings
    tradition: ane-hittite
    title: "CTH 51.I §17-18: the gods of Mittani incl. Mitra, Varuna, Indra; curses on the oath-breaker; blessings for the loyal"
