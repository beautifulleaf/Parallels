      - {motif: treaty-overlord-promises-military-help, refs: ["CTH 41.II.2 §2:19-22", "CTH 41.II.2 §3:23-27"], note: "Help is conditional: 'mān āššu nu=aš ... uizzi; mān=ši UL=ma āššu na=aš UL uizzi' - if it is good (convenient) for him he comes, if not he does not; and the same for My Majesty."}
      - {motif: treaty-report-sedition-even-from-kin, refs: ["CTH 41.II.2 §4:28-32"]}
      - {motif: treaty-return-fugitives, refs: ["CTH 41.II.2 §9:42-45", "CTH 41.II.2 §10:46-48", "CTH 41.II.2 §13:69-72"]}
      - {motif: fugitive-hider-gives-twelve-persons, refs: ["CTH 41.II.2 §11:49-55", "CTH 41.II.2 §12:56-61"], note: "'DAM-SÚ DUMU.MEŠ-ŠU šarnikzil pianzi' - (if the hider cannot pay) his wife and children are given as compensation."}
      - {motif: oath-of-yhwh-settles-dispute, refs: ["CTH 41.II.2 §12:62-67"], note: "What the hiding slave owns his master hands over; if he owns nothing, the master swears: 'mān=wa kēl ŠA ÌR-YA ēšzi kuitki ...' - 'if this servant of mine owns anything ...'; an exculpatory oath settles it."}
      - {motif: treaty-parity-mutual-clauses, refs: ["CTH 41.II.2 §9:45", "CTH 41.II.2 §12:68"]}
    hints:
      - "Wife and children handed over for a debt or penalty: 2 Kgs 4:1 (the creditor comes to take her two children as slaves); Neh 5:5; Matt 18:25."
      - "Exculpatory oath of a keeper: Exod 22:7-10 [8-11] (an oath of YHWH between them both)."
  # ---------------------------------------------------------------- CTH 42 Ḫuqqana
  - id: ane-cth-42-huqqana-preamble-loyalty
    tradition: ane-hittite
    title: "Treaty of Šuppiluliuma I with Ḫuqqana of Ḫayaša (CTH 42) §1-6: the last dog, the sister given, 'recognize only me', love as your own soul"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Hittite"
    read: ["CTH 42 §1", "CTH 42 §2", "CTH 42 §3", "CTH 42 §4", "CTH 42 §5", "CTH 42 §6"]
    tags:
      - {motif: overlord-raises-vassal-from-last-dog, refs: ["CTH 42 §1:1-4"], note: "'[U]M-MA dUTU-ŠI Šuppiluliuma ... kāša tuk Ḫuqqanān appezzin UR.GE7-an šarā dāḫḫun nu=tta SIG5-in iyanun' - Thus My Majesty: you, Ḫuqqana, I have taken up as the last dog and treated you well, and presented you in Hattusa and among the men of Ḫayaša."}
      - {motif: overlord-gives-royal-woman-to-vassal-wife, refs: ["CTH 42 §1:5"], note: "'nu=tta ammel NIN9-IA AŠŠUM DAM-UTTIM ADDIN' - I gave you my own sister as wife."}
      - {motif: treaty-no-other-king-or-lord, refs: ["CTH 42 §2:7", "CTH 42 §3:14-15", "CTH 42 §5:32-34"], note: "'nu=za zik Ḫuqqanaš dUTU-ŠI=pat AŠŠUM BELUTIM šāk' - recognize only My Majesty as lord; 'dammain BELAM ... lē kuinki šākti' recognize no other lord behind My Majesty's back; 'dUTU-ŠIn=za=pat šāk' only My Majesty recognize."}
      - {motif: overlord-guarantees-vassals-chosen-heir, refs: ["CTH 42 §2:8-11", "CTH 42 §3:12-13"], note: "The son whom I name 'kūn=wa=za ḫūmanza šākdu' - let everyone recognize this one - you too recognize him, and my sons and brothers in brotherhood."}
      - {motif: love-overlord-as-own-soul, refs: ["CTH 42 §3:19-21", "CTH 42 §4:22-26"], note: "'mān tuel maḫḫan ANA SAG.DU-KA ZI-KA Ù ANA RAMANI-KA genzu ḫarši ŠU.ḪI.A-uš=za araḫzanda ḫarši' - as you hold love (genzu) for your own head, soul and body and keep your hands around them, (if you do) not likewise hold love for My Majesty's head, soul and body ..."}
      - {motif: treaty-report-sedition-even-from-kin, refs: ["CTH 42 §4:27-31"], note: "If you hear evil concerning My Majesty and hide it, do not tell me, do not point out that man, but even conceal him (munnāši) ..."}
      - {motif: treaty-binds-future-generations, refs: ["CTH 42 §5:35-37", "CTH 42 §6:38-42"], note: "I will protect you, after you your sons; later your sons will protect my son; 'kattaya ANA DUMU.MEŠ-KA SILIM.BI iyami' I will do good to your sons after you."}
      - {motif: thousand-gods-of-hatti, refs: ["CTH 42 §6:43-44"], note: "'nu=tta kāša kē uddār ŠAPAL NIŠ DINGIR-LIM teḫḫun nu kāša kēdani uddanī LI-IM DINGIR.MEŠ tuliya ḫalziwen' - I have placed these words under oath for you, and for this word we have called the thousand gods to assembly."}
    hints:
      - "Raised from 'a dead dog': 2 Sam 9:8 (Mephibosheth: 'what is your servant that you should look on a dead dog like me?'); 1 Sam 24:15 [14]; 2 Kgs 8:13."
      - "The overlord's exclusive lordship: Exod 20:3 and Deut 5:7 (no other gods before me); Deut 6:13-14; Josh 24:14-15, 23; Q 112:1-4 and 3:64."
      - "Love as the language of loyalty: Deut 6:5 (love YHWH with all your heart, soul and might); Deut 10:12, 11:1, 13:4 [3]; 1 Sam 18:1-3; 1 Kgs 5:15 [5:1] (Hiram 'loved' David)."
      - "Covenant kept for sons after you: Deut 7:9 (keeping covenant and steadfast love to a thousand generations); 2 Sam 9:1, 7."
      - "The divine council summoned as witnesses: Ps 82:1; 1 Kgs 22:19."
  - id: ane-cth-42-huqqana-witnesses
