  - id: ane-cth-19-w3-zidanta-ammuna
    tradition: ane-hittite
    title: "Telipinu Proclamation W3: Zidanta killed by his son Ammuna; the gods seek his blood; the land does not prosper"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Hittite"
    version: "W3, KBo 19.96+"
    read: ["CTH 19 W3:{€1+2}_obv._II_1-{€1}_obv._II_31''"]
    tags:
