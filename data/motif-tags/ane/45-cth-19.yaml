# Full read of the ANE corpus, chunk 45: CTH 19 (Telipinu Proclamation, TLHdig manuscripts W1-W10),
# CTH 25, 26, 41 (Šunaššura treaty, Akkadian and Hittite versions), 42 (Ḫuqqana), 44, 50,
# 51.I and 52.I (Šattiwazza treaties). Read from hethiter.net / TLHdig transliterations.
new_motifs:
  kingdom-strong-while-royal-kin-united: {label: "While the king's sons, brothers, in-laws, kinsmen and troops stood united, the small land grew and the enemy was held subdued", cluster: kingship}
  enemy-lands-made-borders-of-sea: {label: "The king destroys the enemy lands and makes them the borders of the sea (extends his realm to the sea)", cluster: conquest}
  princes-sent-to-govern-cities: {label: "Returning from campaign, the king sends each of his sons to govern one of the great cities of the land", cluster: kingship}
  royal-servants-corrupt-and-conspire: {label: "The servants of the princes grow corrupt, devour their masters' houses, plot against them and shed their blood", cluster: kingship}
  king-sacks-aleppo-and-babylon: {label: "A Hittite king destroys Aleppo and Babylon and carries their deportees and goods to Hattusa", cluster: conquest}
  king-murdered-by-courtier-in-law: {label: "A king is murdered by a courtier who is his brother-in-law, together with the courtier's son-in-law, who seize the throne", cluster: kingship}
  gods-seek-the-kings-blood: {label: "The gods seek out (avenge) the blood of a murdered king or prince on his murderer and his line", cluster: retribution}
  regicide-remorse: {label: "The murderer of a king, now king himself, laments 'what have I done? I listened to the word of another'", cluster: retribution}
  king-murdered-by-his-son: {label: "A king is murdered by his own son, who takes the throne", cluster: kingship}
  land-turns-hostile-campaigns-fail: {label: "Under a bloodguilty king the subject lands turn hostile and wherever his troops go they do not return successful", cluster: retribution}
  royal-woman-murdered-with-her-sons: {label: "A queen (or royal woman) is murdered together with her sons in a palace intrigue, and the king searches for the killers", cluster: kingship}
  deposed-rivals-given-houses-to-eat-and-drink: {label: "A new king spares the rival claimants who plotted against him, gives them houses and says 'let them eat and drink; let no one harm them'", cluster: kingship}
  king-spares-conspirators-sends-them-to-farm: {label: "Instead of the death sentence passed by the council, the king takes the conspirators' weapons from their shoulders and makes them farmers", cluster: kingship}
  men-of-god-denounce-bloodshed: {label: "Men of the god (seers) declare that bloodshed has become widespread in the capital", cluster: prophecy}
  assembly-judges-royal-crimes: {label: "The assembly of the realm (Hittite panku, tuliya) is convened to judge crimes within the royal family and to restrain the king", cluster: kingship}
  succession-law-sons-then-daughters-husband: {label: "Succession law: a first-rank son becomes king; failing him a second-rank son; failing any son, the husband taken for the first-rank daughter", cluster: kingship}
  king-forbidden-to-kill-royal-kin: {label: "The king and his council are forbidden to kill members of the royal family ('do not say I will purge; you will only entangle yourself')", cluster: kingship}
  king-told-to-consult-written-precedent: {label: "The council must tell a king plotting against his kin to read the precedent on the tablet: bloodshed in the past and its divine punishment", cluster: kingship}
  property-of-executed-not-confiscated: {label: "The house, fields, vineyards, servants and herds of an executed prince may not be taken; taking them is not right", cluster: law}
  executed-plotters-as-warning-sign: {label: "Named conspirators are held up to the officials as a warning sign ('let them be a sign before you')", cluster: law}
  royal-storehouse-towns-listed: {label: "A list of the royal storehouse towns (seal-houses) is drawn up, the stores heaped up and entrusted to officials", cluster: administration}
  oppressors-drink-blood-of-land: {label: "Corrupt officials who stretch the measure of the fields are said to 'drink the blood of the land'", cluster: justice}
  blood-owner-chooses-death-or-compensation: {label: "In a homicide, the 'lord of the blood' decides: if he says 'let him die' the killer dies, if 'let him pay' he pays; the king has no part", cluster: law}
  sorcery-in-family-brought-to-palace-gate: {label: "Whoever in a family practises sorcery must be seized by his own kin and brought to the palace gate; whoever fails to bring him suffers himself", cluster: law}
  son-demanding-share-while-parents-live-expelled: {label: "A son who demands division of the estate while father and mother are alive is thrown out of the house and loses his share", cluster: law}
  treaty-parity-mutual-clauses: {label: "A parity treaty repeats each obligation with the roles of the two kings exchanged ('and for the other the same')", cluster: treaty}
  border-towns-not-to-be-fortified: {label: "A treaty forbids one or both kings to fortify named border towns; fortifying them breaks the oath", cluster: treaty}
  fugitive-returned-after-notables-swear: {label: "A fugitive accused of plotting against his lord is returned unless he denies it, in which case notables of the land swear an oath and he is then returned", cluster: treaty}
  envoy-not-harmed-or-bewitched: {label: "A king's son, servant or envoy sent to the other king must suffer no harm and must not be caught with magic herbs", cluster: treaty}
  deserted-settlement-returned: {label: "If the population of a settlement migrates with its people, goods and herds to the other kingdom, it is seized and returned", cluster: treaty}
  theft-repaid-twofold: {label: "A thief must restore the stolen goods twofold to their owner (and pay a further fine)", cluster: law}
  border-thief-killed: {label: "A man who is no herdsman and crosses the border to steal may be killed", cluster: law}
  homicide-compensated-person-for-person: {label: "A man who kills (or sells) a man of the other land must give a person in place of the dead ('a man like the man')", cluster: law}
  treaty-old-oath-tablet-erased-new-made: {label: "The tablet of a vassal's former oath to a rival overlord is erased, the rival's word rejected and a new tablet made", cluster: treaty}
  messenger-words-must-match-tablet: {label: "The vassal is to trust a messenger only if his spoken words agree with the words written on the tablet he brings", cluster: diplomacy}
  vassal-sees-kings-face-none-seated-above: {label: "When the vassal comes before the great king he may see the king's face and no grandee sits above him", cluster: kingship}
  own-words-turned-against-speaker: {label: "A rival is condemned by his own earlier answer ('Just so!') to the very case now turned against him", cluster: diplomacy}
  vassal-released-andurarum: {label: "The great king releases a land from a former overlord's oath, an act of 'release' (andurāru)", cluster: treaty}
  overlord-guarantees-vassals-chosen-heir: {label: "Each king will protect in the kingship the son whom the other designates as heir", cluster: treaty}
  neither-party-crosses-border: {label: "Each party swears not to cross the boundary (a river, a heap) into the other's side", cluster: treaty}
  border-land-measured-and-divided: {label: "The land between two frontier towns is measured out and divided between the two kings", cluster: treaty}
  fugitive-hider-gives-twelve-persons: {label: "Whoever hides a fugitive in his house must give twelve persons in compensation, or himself be killed; a hiding slave's master may forfeit him", cluster: law}
  overlord-raises-vassal-from-last-dog: {label: "The overlord says he took up the vassal as 'the last dog' and treated him well", cluster: kingship}
  overlord-gives-royal-woman-to-vassal-wife: {label: "The overlord gives his sister or daughter in marriage to the vassal king", cluster: kingship}
  love-overlord-as-own-soul: {label: "The vassal must love the overlord's head, soul and body as he loves his own and keep his hands around him", cluster: treaty}
  oath-gods-destroy-oathbreaker: {label: "Treaty curse: 'these oath gods shall not leave you in peace, shall not release you, shall destroy you' (and whoever you side with)", cluster: treaty}
  foreign-customs-contrasted-with-own-law: {label: "A practice permitted in a foreign, uncouth land is declared a capital crime in one's own land ('in Hattusa it is not right')", cluster: law}
  kinswoman-welcomed-with-food-not-desired: {label: "When a kinswoman of one's wife visits, give her to eat and drink and rejoice, but do not desire to take her", cluster: law}
  avoid-palace-women: {label: "Keep far from the women of the palace: do not approach or speak to one, step well off the road and let her pass", cluster: law}
  man-executed-for-glance-at-palace-maid: {label: "A man is put to death merely for having looked at a palace maid, seen by the king from a window", cluster: law}
  overlords-kinswoman-must-be-chief-wife: {label: "The vassal may keep concubines but may take no wife above or equal to the overlord's sister or daughter, who must be chief wife", cluster: kingship}
  king-installs-son-as-vassal-king: {label: "The great king installs his own son as king of a conquered city-state and fixes its borders", cluster: kingship}
  treaty-duplicate-deposited-before-god: {label: "A copy of the treaty tablet is deposited before the chief god of each party", cluster: treaty}
  treaty-on-gold-tablet: {label: "The treaty is written on a tablet of gold", cluster: treaty}
  not-a-straw-taken: {label: "A king insists he took not so much as a straw or a splinter of wood from a land or a person", cluster: kingship}
  storm-god-decides-lawsuit-by-kings-death: {label: "The death of a king is read as the god's verdict in a lawsuit between rival claimants ('the storm god decided Artatama's case')", cluster: kingship}
  overlord-revives-dead-kingdom: {label: "The great king says he will bring a dead (ruined) land back to life and restore it to its place", cluster: kingship}
  overlord-takes-prince-by-hand-sets-on-fathers-throne: {label: "The great king takes an exiled prince by the hand and seats him on his father's throne", cluster: kingship}
  overlord-adopts-vassal-as-son: {label: "The great king says to a fugitive prince: 'I take you as my son, I will stand at your side'", cluster: kingship}
  arrogant-king-provokes-war: {label: "A rival king's arrogance (multarriḫūtu) and boastful words provoke the great king's campaign", cluster: war}
  primeval-and-underworld-gods-as-witnesses: {label: "The primeval and underworld gods (Alalu, Anu, Nara, Namšara, Ereškigal) are named among the treaty witnesses", cluster: treaty}
  vedic-gods-as-treaty-witnesses: {label: "Mitra, Varuna, Indra and the Nāsatyas are invoked as witnesses of a Mittani treaty", cluster: treaty}
  curse-oathbreakers-name-and-seed-destroyed: {label: "Treaty curse: may the gods destroy the oath-breaker's name and seed from the earth", cluster: treaty}
  curse-poverty-and-nakedness: {label: "Treaty curse: may the oath gods give you poverty and nakedness", cluster: treaty}
  curse-throne-overturned: {label: "Treaty curse: may the gods overturn your throne", cluster: treaty}
  curse-crushed-like-reed: {label: "Treaty curse: may the oath crush you with your land like a reed", cluster: treaty}
  curse-ground-slippery-like-ice: {label: "Treaty curse: may the ground be ice so that you slip, and your land a pond in which you sink", cluster: treaty}
  curse-pursued-by-the-gods: {label: "Treaty curse: you shall be enemies of the thousand gods and they shall hunt you down", cluster: treaty}
  blessing-land-rich-and-lying-down-in-peace: {label: "Treaty blessing: may the land be restored as of old, grow rich and lie down (rabāṣu) in peace", cluster: treaty}
  blessing-dynasty-rules-forever: {label: "Treaty blessing: may your sons and grandsons rule as kings for ever and your father's throne grow old", cluster: treaty}
  suppliant-falls-at-overlords-feet: {label: "A fugitive prince falls at the great king's feet; the king takes him by the hand and rejoices over him", cluster: kingship}
  kings-word-does-not-return-void: {label: "The words that come out of the great king's mouth do not turn back (go unfulfilled)", cluster: kingship}
  exile-arrives-with-nothing: {label: "The fugitive prince came with three chariots, two attendants and the one garment he wore, and nothing else", cluster: kingship}
  gods-go-before-the-army: {label: "The gods of the great king go before the army on campaign", cluster: war}
  gods-lead-fugitive-on-safe-path: {label: "The fugitive calls on the gods, who lead him on a path of safety to the great king", cluster: prayer}
  trophy-door-given-to-enemy: {label: "A gold and silver door once taken as a trophy is shamefully handed over to the enemy as tribute", cluster: kingship}
  king-bows-to-former-servant: {label: "A usurper prostrates himself before a king whose ancestors were his fathers' servants and gives him his treasure", cluster: kingship}
  curse-barren-as-salt: {label: "Self-curse: as salt has no seed, so may we have no seed; like a dissolved lump of salt may we not be restored", cluster: treaty}
  curse-no-shoot-like-cut-tree: {label: "Self-curse: as a felled tree (tamarisk/acacia) puts out no shoot, so may we have no seed", cluster: treaty}
  curse-rise-like-smoke: {label: "Self-curse: may we rise like smoke to heaven", cluster: treaty}
  vassals-live-in-lords-shade: {label: "The sworn people pray to eat a rich harvest in their lord's shade (ṣillu) while he goes before them", cluster: kingship}
  treaty-historical-prologue: {label: "A treaty opens with a historical prologue recounting the past relations of the two parties and the overlord's benefits, as the ground of the obligations", cluster: treaty}
  famine-in-kings-reign: {label: "A famine strikes the lands in a king's reign and he orders ploughing, rationing and storage of grain", cluster: kingship}
  overlord-loves-vassal-like-his-tablet: {label: "The vassal asks that the great king love him and his land as he loves his own lands, sons and his own tablet", cluster: treaty}
units:
  # ---------------------------------------------------------------- CTH 19 Telipinu Proclamation
  - id: ane-cth-19-w1-fragment
    tradition: ane-hittite
    title: "Telipinu Proclamation, fragment W1 (KBo 12.6): officials to guard the towns"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Hittite"
    version: "W1, KBo 12.6"
    read: ["CTH 19 W1"]
    tags:
      - {motif: executed-plotters-as-warning-sign, refs: ["CTH 19 W1:3'-6'"], note: "Fragment of the closing exhortation (cf. W6 rev. III 6'-12'): '[seize them with your teeth] k]aripten', the great officials 'who are in charge' (šallaēš) are to take them (šuš daškandu); interpretive, only line ends survive."}
      - {motif: royal-storehouse-towns-listed, refs: ["CTH 19 W1:7'-9'"], note: "'the towns ... protected' URU.DIDLI.ḪI.A paḫḫašnuwanteš; the rest is lost."}
  - id: ane-cth-19-w2-founders
    tradition: ane-hittite
    title: "Telipinu Proclamation W2: Labarna, Ḫattusili and Mursili, united, conquer to the sea, Aleppo and Babylon"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Hittite"
    version: "W2, KBo 12.7+ (main manuscript)"
    read: ["CTH 19 W2:{€1}_obv._I_1'-{€1}_obv._I_29'"]
    tags:
      - {motif: kingdom-strong-while-royal-kin-united, refs: ["CTH 19 W2:{€1}_obv._I_1'-{€1}_obv._I_3'", "CTH 19 W2:{€1}_obv._I_12'-{€1}_obv._I_14'", "CTH 19 W2:{€1}_obv._I_23'-{€1}_obv._I_25'"], note: "Refrain for each king: 'napa apel=la DUMU.MEŠ-ŠU ŠEŠ.MEŠ-ŠU LÚ.MEŠ gaenašš(e)eš LÚ.MEŠ ḫaššannaššaš Ù ÉRIN.MEŠ-ŠU taruppanteš ešer' (his sons, brothers, in-laws, kinsmen and troops were united), then 'wherever he went on campaign he held the enemy land subdued by force (kuttanit taruḫḫan ḫarta)'."}
      - {motif: enemy-lands-made-borders-of-sea, refs: ["CTH 19 W2:{€1}_obv._I_6'-{€1}_obv._I_7'", "CTH 19 W2:{€1}_obv._I_16'-{€1}_obv._I_17'", "CTH 19 W2:{€1}_obv._I_26'"], note: "'nu utnē ḫarninkišket nu utnē arḫa tarranut nuš arunaš irḫuš iyet' - he destroyed the lands, made them powerless and made them the borders of the sea."}
      - {motif: princes-sent-to-govern-cities, refs: ["CTH 19 W2:{€1}_obv._I_7'-{€1}_obv._I_11'", "CTH 19 W2:{€1}_obv._I_17'-{€1}_obv._I_19'"], note: "When he came back from campaign each of his sons went to a land: Ḫupišna, Tuwanuwa, Nenašša, Landa, Zallara, Paršuḫanta, Lušna; 'utnē maniyaḫḫiškir' (they governed the land) and 'the great cities were settled' (tittiyanteš ešer)."}
      - {motif: royal-servants-corrupt-and-conspire, refs: ["CTH 19 W2:{€1}_obv._I_20'-{€1}_obv._I_22'"], note: "'ARAD.MEŠ DUMU.MEŠ LUGAL maršešer' - the princes' servants became corrupt, began to devour (karipuwan dāer) their houses, to plot against their lords and 'ešḫar=šummit eššuwan tier' to shed their blood."}
      - {motif: king-sacks-aleppo-and-babylon, refs: ["CTH 19 W2:{€1}_obv._I_27'-{€1}_obv._I_29'"], note: "Mursili went to Ḫalpa and destroyed it, brought its deportees and goods to Hattusa; then went to Babylon (KÁ.DINGIR.RA) and destroyed it, and also struck the Hurrian troops."}
      - {motif: dynastic-succession-from-father, refs: ["CTH 19 W2:{€1}_obv._I_12'", "CTH 19 W2:{€1}_obv._I_23'"], note: "EGIR-pa=ma Ḫattušiliš ḫaššuet ... mān Muršiliš Ḫattuši LUGAL-et - each king follows the last in an orderly line."}
    hints:
      - "A historical prologue of royal succession and good order before decline: compare Judg 2:6-19 and the cycle of Judges, and 2 Kgs 17:7-23 as retrospective history serving a present law."
      - "Unity of 'brothers' as the condition of strength: Ps 133:1; Gen 13:8."
      - "Kings of the past conquering to the sea: 1 Kgs 5:1 [4:21] (Solomon ruled from the River to the land of the Philistines); Ps 72:8 (from sea to sea)."
      - "Servants who grow fat and turn on their masters: Prov 30:21-22; 1 Kgs 16:9-10 (Zimri, servant, kills his king)."
  - id: ane-cth-19-w2-hantili-murders-mursili
    tradition: ane-hittite
    title: "Telipinu Proclamation W2: Ḫantili and Zidanta murder Mursili; the gods seek his blood"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Hittite"
    version: "W2, KBo 12.7+"
    read: ["CTH 19 W2:{€1}_obv._I_30'-{€1}_obv._I_57'"]
    tags:
      - {motif: king-murdered-by-courtier-in-law, refs: ["CTH 19 W2:{€1}_obv._I_30'-{€1}_obv._I_33'"], note: "Ḫantili was cupbearer (LÚ SAGI.A) and had Ḫarapšili, Mursili's sister, as wife; Zidanta 'went up' to Ḫantili, 'ḪUL-lu uttar iēr' they did an evil deed, 'Muršilin kuenner nu ešḫar iēr' killed Mursili and shed blood."}
      - {motif: regicide-chain, refs: ["CTH 19 W2:{€1}_obv._I_32'-{€1}_obv._I_33'", "CTH 19 W2:{€1}_obv._I_56'"]}
      - {motif: regicide-remorse, refs: ["CTH 19 W2:{€1}_obv._I_34'", "CTH 19 W2:{€1}_obv._I_38'-{€1}_obv._I_40'"], note: "'Ḫantiliš naḫšariyattati' Ḫantili was afraid; at Tagarama he began to say '[...] kī=wa iyanun kuit nu=wa Zidanta[š ...] ištamaššun' - 'what is this I have done? I listened to Zidanta'; partly restored."}
      - {motif: gods-seek-the-kings-blood, refs: ["CTH 19 W2:{€1}_obv._I_40'-{€1}_obv._I_41'"], note: "'mān LUGAL-et ... ešḫar DINGIR.MEŠ-iš šanḫer' when he became king the gods sought the blood (of Mursili)."}
      - {motif: land-turns-hostile-campaigns-fail, refs: ["CTH 19 W2:{€1}_obv._I_35'-{€1}_obv._I_37'", "CTH 19 W2:{€1}_obv._I_42'-{€1}_obv._I_45'"], note: "Fragmentary: campaign towards Aštata, Šukziya(?), Ḫurpana, Karkemiš; the Hurrian troops (ÉRIN.MEŠ ḫurluš) and 'ḫaḫḫallaš' (thornbush) appear; 'the land was turned' (utnē weḫattat). Lines I 46'-57' almost wholly broken."}
    hints:
      - "Regicide by a court officer and in-law: 2 Kgs 9-10 (Jehu), 1 Kgs 16:9-10 (Zimri, commander of chariots, kills Elah while drunk); 2 Kgs 12:21 [20] and 14:19 (servants conspire and kill the king)."
      - "Blood of the slain king sought by God: Gen 9:5-6 ('your blood I will require'); 2 Sam 4:11 ('shall I not require his blood of your hand?'); 2 Kgs 9:7, 26 (blood of Naboth requited on the house of Ahab); Hos 1:4 (blood of Jezreel visited on Jehu's house)."
      - "Remorse of the murderer 'what have I done?': 2 Sam 24:10 (David's heart smote him); Jer 8:6 ('no man says, what have I done?'); Q 5:31 (Cain becomes one of the remorseful)."
  - id: ane-cth-19-w2-ammuna-to-telipinu-accession
    tradition: ane-hittite
    title: "Telipinu Proclamation W2: Ammuna's failures, the murders of Zuru and Taruḫšu, Ḫuzziya, Telipinu spares his rivals"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Hittite"
    version: "W2, KBo 12.7+"
    read: ["CTH 19 W2:{€1}_obv._II_1-{€1}_obv._II_15"]
    tags:
      - {motif: land-turns-hostile-campaigns-fail, refs: ["CTH 19 W2:{€1}_obv._II_1-{€1+2}_obv._II_4"], note: "Ḫagga, Matila, Adaniya, Arzawa, Šallapa, Parduwata became hostile (kururet); 'laḫḫa=ma kuwatta ÉRIN.MEŠ-uš paizzi ne appa UL SIG5-in weškanta' wherever the troops went on campaign they did not come back successful."}
      - {motif: regicide-chain, refs: ["CTH 19 W2:{€1+2}_obv._II_4-{€1+2}_obv._II_9"], note: "When Ammuna 'became god' (died), Zuru chief of the bodyguard secretly (duddumili) sent his son Taḫurwaili the man of the golden spear, who killed Tittiya's family with his sons; Taruḫšu the courier killed Ḫantili with his sons; Ḫuzziya became king."}
      - {motif: deposed-rivals-given-houses-to-eat-and-drink, refs: ["CTH 19 W2:{€1}_obv._II_11-{€1}_obv._II_15"], note: "Ḫuzziya planned to kill Telipinu and Ištapariya; the matter became known and Telipinu chased them away; 'his five brothers: he built them houses (taggašta): let them go and live, let them eat and drink (azzikkandu akkuškandu), let no one harm them'; and I say: 'apē=wa=mu idālu iēr ug=a=war=uš ḪUL-lu iyami' - they did evil to me, but I will not do them evil."}
      - {motif: repay-evil-with-good, refs: ["CTH 19 W2:{€1}_obv._II_14-{€1}_obv._II_15"], note: "The negative 'ḪUL-lu ⌈iyami⌉' is not written; the context (le-e ku-iš-ki tag-gaš-ši, 'let no one harm them') shows Telipinu means he will not do evil to them; the phrasing is a deliberate contrast."}
    hints:
      - "Not repaying evil for evil to rival claimants: 1 Sam 24:18-20 [17-19] and 26:21-25 (David spares Saul); 2 Sam 19:23-24 [22-23] (David spares Shimei: 'shall any man be put to death this day?'); Prov 20:22; Q 41:34."
      - "Deposed royals given food and a place: 2 Kgs 25:27-30 (Jehoiachin eats at the king's table); 2 Sam 9:7-13 (Mephibosheth)."
      - "A sequence of court killings of kings and princes: 1 Kgs 15:27-16:22 (Baasha, Zimri, Omri) and 2 Kgs 15:10-30."
  - id: ane-cth-19-w2-telipinu-reign
    tradition: ane-hittite
    title: "Telipinu Proclamation W2: Telipinu's campaigns, the conspiracy, mercy to the conspirators, 'blood has become common'"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Hittite"
    version: "W2, KBo 12.7+"
    read: ["CTH 19 W2:{€1}_obv._II_16-{€1}_obv._II_33"]
    tags:
      - {motif: dynastic-succession-from-father, refs: ["CTH 19 W2:{€1}_obv._II_16"], note: "Accession formula: 'mān=šan Telipinuš INA GIŠ.GU.ZA ABI-IA ešḫat' - when I, Telipinu, sat on the throne of my father."}
      - {motif: assembly-judges-royal-crimes, refs: ["CTH 19 W2:{€1}_obv._II_27-{€1}_obv._II_28"], note: "Tanuwa, Taḫurwaili and Taruḫšu were brought and 'nu=uš pankuš parā ḫinkani ḫarta' - the panku delivered them to death."}
      - {motif: king-spares-conspirators-sends-them-to-farm, refs: ["CTH 19 W2:{€1}_obv._II_28-{€1}_obv._II_30"], note: "'LUGAL-uš=a memaḫḫun kuwat=wa=re akkanzi' - I the king said: why should they die? 'IGI.ḪI.A-wa munnanzi' let them hide their eyes; 'nu=uš LUGAL-uš karšauš LÚ.MEŠ APIN.LÁ iyanun GIŠ.TUKUL.ḪI.A-uš=šuš=ta ZAG.UDU-za daḫḫun' I made them real farmers and took their weapons from their shoulders."}
      - {motif: men-of-god-denounce-bloodshed, refs: ["CTH 19 W2:{€1}_obv._II_31-{€1}_obv._II_33"], note: "'nu šallaš=pat ḫaššannaš ešḫar pangariyattati' the blood of the whole royal family became widespread; queen Ištapariya died, then prince Ammuna died; 'šiunan antuḫšiš=a taršikkanzi kāša=wa Ḫattuši ešḫar pangariyattati' - and the men of the god say: behold, bloodshed has become widespread in Hattusa."}
    hints:
      - "Weapons taken away and the men made ploughmen: compare Isa 2:4 and Mic 4:3 (swords into ploughshares), here as a judicial commutation."
      - "Commuting a death sentence the people demand: 1 Sam 11:12-13 (Saul: no man shall be put to death this day); 2 Sam 19:22-23 [21-22]."
      - "Prophetic denunciation of bloodshed in the capital: Ezek 22:2-4 (city of blood); 2 Kgs 21:16 and 24:4 (Manasseh filled Jerusalem with innocent blood, which YHWH would not pardon); Mic 3:10."
      - "Deaths in the royal house as the price of bloodguilt: 2 Sam 12:10-14 (the sword shall never depart from your house); 2 Sam 21:1."
  - id: ane-cth-19-w2-succession-law
    tradition: ane-hittite
    title: "Telipinu Proclamation W2: the assembly, the law of succession and the law protecting the royal family"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Hittite"
    version: "W2, KBo 12.7+"
    read: ["CTH 19 W2:{€1}_obv._II_34-{€1}_obv._II_73"]
    tags:
      - {motif: assembly-judges-royal-crimes, refs: ["CTH 19 W2:{€1}_obv._II_34", "CTH 19 W2:{€1}_obv._II_50-{€1}_obv._II_52"], note: "'nu Telipinuš Ḫattuši tuliyan ḫalziḫḫun' I convened the assembly in Hattusa; whoever does evil among brothers and sisters 'nu tuliyan ḫalzišten' - call the assembly; 'if his case goes (against him) SAG.DU-naz šarnikdu' let him pay with his head."}
      - {motif: king-forbidden-to-kill-royal-kin, refs: ["CTH 19 W2:{€1}_obv._II_34-{€1}_obv._II_35", "CTH 19 W2:{€1}_obv._II_43-{€1}_obv._II_45"], note: "From now on 'ḫaššannaš DUMU-an idālu lē kuiški iyazi nu=šši=šan GÌR-an takkešzi' let no one do evil to a son of the family or draw a dagger on him; 'kiššan=a lē tēši arḫa=wa parkunummi parkunuši=ma=za UL kuitki ... ḫatkišnuši' - do not say 'I will purge', you will purge nothing but entangle yourself; 'ḫaššanna=šan=za=kan lē kuinki kuenti UL SIG5-in'."}
      - {motif: succession-law-sons-then-daughters-husband, refs: ["CTH 19 W2:{€1}_obv._II_36-{€1}_obv._II_39"], note: "'LUGAL-uš=šan ḫantezziyaš=pat DUMU.LUGAL DUMU-RU kikkištaru' let a first-rank prince become king; if there is none, a son of the second rank (tān pēdaš); if there is no son, 'kuiš DUMU.MUNUS ḫantezziš nu=šši=šan LÚ antiyantan appandu' let them take a husband (in-marrying son-in-law) for the first-rank daughter, and he shall be king."}
      - {motif: kingdom-strong-while-royal-kin-united, refs: ["CTH 19 W2:{€1}_obv._II_40-{€1}_obv._II_43"], note: "The opening refrain turned into a command for the future: whoever becomes king after me, let brothers, sons, in-laws, kinsmen and troops be united, and you will hold the enemy land subdued."}
      - {motif: king-told-to-consult-written-precedent, refs: ["CTH 19 W2:{€1}_obv._II_46-{€1}_obv._II_49"], note: "If a king plans evil against brother or sister, 'šumeš=a pankuš nu=šši karši tetten kī=wa ešḫanaš uttar tuppiaz au' you panku tell him plainly: 'look at this matter of blood from the tablet: formerly blood became widespread in Hattusa and the gods took it on the royal family'."}
      - {motif: individual-responsibility-for-sin, refs: ["CTH 19 W2:{€1}_obv._II_52-{€1}_obv._II_56", "CTH 19 W2:{€1}_obv._II_59-{€1}_obv._II_60"], note: "The guilty prince pays with his head, but 'É-rišši ANA DAM-ŠU DUMU.MEŠ-ŠU idālu lē takkiššanzi' let them do no evil to his house, wife and children; repeated at II 59-60 'kinuna'."}
      - {motif: sons-of-rebel-spared, refs: ["CTH 19 W2:{€1}_obv._II_54", "CTH 19 W2:{€1}_obv._II_56"]}
      - {motif: property-of-executed-not-confiscated, refs: ["CTH 19 W2:{€1}_obv._II_56-{€1}_obv._II_61"], note: "Princes perish, but not for their houses, fields, vineyards, servants, slaves, oxen and sheep; 'piyanna=ma ŠA DUMU.MEŠ.LUGAL UL āra' - giving away (the estates) of princes is not right."}
      - {motif: royal-servants-corrupt-and-conspire, refs: ["CTH 19 W2:{€1}_obv._II_61-{€1}_obv._II_65"], note: "The evil words some speak: the chief of the house, chief of the palace servants, chief of the bodyguard, chief of the wine desire to take the prince's houses and say 'would that this city were mine', and do evil to the lord of the city."}
      - {motif: executed-plotters-as-warning-sign, refs: ["CTH 19 W2:{€1}_obv._II_66-{€1}_obv._II_69"], note: "To the palace staff (guards, golden grooms, table-men, cooks, staff-bearers, stable-men): 'take this word to heart; Tanuwa, Taḫurwaili and Taruḫšu INA PANI-KUNU GISKIM-iš ešdu' - let them be a sign before you."}
      - {motif: treaty-seize-and-deliver-instigators, refs: ["CTH 19 W2:{€1}_obv._II_70-{€1}_obv._II_73"], note: "If anyone does evil, whether chief of the house, chief of the wine, chief of the bodyguard, chief of the thousand of the field, 'šumaš=a pankuš anda [epten] ... kariptten' - you panku seize him and devour him (with your teeth, as in W4)."}
    hints:
      - "Law of the king in writing, to be read and to restrain the king from turning against his brothers: Deut 17:14-20 ('that his heart be not lifted up above his brothers'); 1 Sam 10:25 (Samuel writes the manner of the kingdom in a book)."
      - "Children not to be put to death for the father: Deut 24:16; 2 Kgs 14:5-6 (Amaziah kills his father's murderers but not their sons); Ezek 18:20; Q 6:164 (no bearer bears another's burden)."
      - "Royal seizure of an executed man's estate: 1 Kgs 21:15-16 (Ahab takes Naboth's vineyard); 2 Sam 16:4 and 19:30 [29] (Mephibosheth's estate given away); Ezek 46:18 (the prince shall not take the people's inheritance)."
      - "Succession through a daughter's husband when there is no son: Num 27:1-11 and 36 (daughters of Zelophehad); 1 Chr 2:34-35 (Sheshan gives his daughter to his slave Jarha)."
      - "Assembly as judge of the royal house: 1 Kgs 12:1-16 (assembly at Shechem); 2 Sam 19:10-15; 2 Kgs 11:4-20."
      - "Example made of offenders as a warning: Deut 13:12 [11], 17:13 and 21:21 ('all Israel shall hear and fear'); Num 17:25 [17:10] (a sign to rebels)."
  - id: ane-cth-19-w2-storehouses
