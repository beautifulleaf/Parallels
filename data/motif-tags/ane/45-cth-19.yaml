      - {motif: king-murdered-by-his-son, refs: ["CTH 19 W3:{€1+2}_obv._II_2-{€1+2}_obv._II_3"], note: "'nu=šši Ammunan DUMU-aššan DINGIR.MEŠ LÚ.KÚR.MEŠ-ŠU iēr nu=kan Zidantan addaššan [kuenta]' - the gods made Ammuna, his own son, his enemy, and he killed Zidanta his father."}
      - {motif: famine-for-bloodguilt, refs: ["CTH 19 W3:{€1}_obv._II_5-{€1}_obv._II_6"], note: "'nan kiššar[išši ḫalkiuš] GEŠTIN.ḪI.A-uš GU4.ḪI.A-uš UDU.ḪI.A-uš UL [...]' - in his hand grain, vines, cattle and sheep did not [prosper]; ḫalkiuš restored from W9 I 4' (kiššarišši ḫalkiuš)."}
      - {motif: land-turns-hostile-campaigns-fail, refs: ["CTH 19 W3:{€1}_obv._II_7-{€1}_obv._II_10"], note: "The land became hostile to him: Arzawa, Šallapa ...; wherever the troops went on campaign they did not come back successful."}
      - {motif: regicide-chain, refs: ["CTH 19 W3:{€1}_obv._II_11-{€1}_obv._II_15"], note: "Zuru chief of the bodyguard, Tittiya, Taruḫšu ... with his sons: the series of murders as in W2 II 5-9; II 24''-31'' only line beginnings (Laḫḫa)."}
    hints:
      - "Famine and failure of crops and herds for royal bloodguilt: 2 Sam 21:1-14 (three years of famine for Saul's blood on the Gibeonites); Deut 28:17-18 (cursed your basket, the young of your cattle and flocks); Hag 1:10-11."
      - "Son who murders his father the king: 2 Kgs 19:37 // Isa 37:38 (Sennacherib killed by his sons); 2 Chr 32:21."
      - "The murderer's line repaid in kind: 1 Kgs 16:1-13 (the house of Baasha); 1 Kgs 21:19 ('where dogs licked the blood of Naboth')."
