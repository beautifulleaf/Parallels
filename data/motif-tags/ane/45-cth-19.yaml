      - {motif: treaty-parity-mutual-clauses, refs: ["CTH 41.II.1 §3:6", "CTH 41.II.1 §7:26", "CTH 41.II.1 §9:31"], note: "'Šunaššuraš=a apeniššan' - for Šunaššura (it is) the same."}
      - {motif: treaty-no-other-king-or-lord, refs: ["CTH 41.II.1 §4:7-12"], note: "If a land, town or troop turns to My Majesty, he writes to Šunaššura 'apāš=wa ammel nu=war=an šāk' - that one is mine, take note; 'nan=kan Šunaššuraš EGIR-anna arḫa lē naiškiši' you shall not turn it away again."}
      - {motif: treaty-return-fugitives, refs: ["CTH 41.II.1 §10:32-37"], note: "A fugitive coming from a third land who keeps calling out (ḫalziššai) [for] Hattusa: 'nan lē araizzi' he shall not stop him."}
    hints:
      - "Penalty for harbouring a fugitive: 1 Sam 22:6-19 (Ahimelech and the priests of Nob killed for helping David); Josh 2:3-6 (Rahab hides the spies); contrast Deut 23:16-17 [15-16]."
  - id: ane-cth-41-ii-2-sunassura-hittite
