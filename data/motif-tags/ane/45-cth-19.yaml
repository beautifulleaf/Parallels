      - {motif: vassal-released-andurarum, refs: ["CTH 41.I.1 §2:20-25"], note: "'[inan]na dUTU-ši KUR Kizzuwatni ana andurāri ...' and 'the Hurrians call you a servant (ÌR-dam išassûka); now My Majesty has made you truly a king'."}
      - {motif: vassal-sees-kings-face-none-seated-above, refs: ["CTH 41.I.1 §2:27-29"], note: "No lord or grandee will sit above you from the throne; you shall pay My Majesty no tribute."}
      - {motif: treaty-old-oath-tablet-erased-new-made, refs: ["CTH 41.I.1 §2:78-82"], note: "'tuppu ša nīš ilim ša ēpiš lū nipaššiṭšu awat LÚ Ḫurri lū ninassuk ... u tuppam šaniyamma nippuš' - the tablet of the oath that was made we erase, the Hurrian's word we reject, and we make another tablet."}
      - {motif: messenger-words-must-match-tablet, refs: ["CTH 41.I.1 §2:83-90"]}
      - {motif: treaty-parity-mutual-clauses, refs: ["CTH 41.I.1 §2:46-77"]}
      - {motif: gods-listed-as-treaty-witnesses, refs: ["CTH 41.I.1 §2:95-98"], note: "Sun goddess of Arinna, storm god of Hatti, LAMMA of Hatti, storm god of Aleppo, Ḫebat, the moon god, Ištar, Zababa, gods of Hatti and of Kizzuwatna."}
      - {motif: heaven-and-earth-as-witnesses, refs: ["CTH 41.I.1 §2:99"], note: "'šamû erṣetum [...] ḪUR.SAG.DIDLI.ḪI.A u ÍD.ḪI.A' - heaven, earth, [...], mountains and rivers."}
      - {motif: mountains-rivers-sea-winds-clouds-as-witnesses, refs: ["CTH 41.I.1 §2:99"]}
      - {motif: curse-oathbreakers-name-and-seed-destroyed, refs: ["CTH 41.I.1 §2:95", "CTH 41.I.1 §2:100"], note: "'[ša] awat tuppi annîm ētetiq ... NUMUN-šu šumšu liḫalliqū' - whoever transgresses the words of this tablet, may (the gods) destroy his seed and his name."}
    hints:
      - "Ox and its stall: Isa 1:3 ('the ox knows its owner and the ass its master's crib; Israel does not know'): the Hittite uses the image for a people who return to their rightful lord."
      - "Heaven, earth, mountains as witnesses of a covenant: Deut 4:26, 30:19, 31:28, 32:1; Isa 1:2; Mic 6:1-2 ('hear, you mountains, the controversy of YHWH')."
      - "Name and seed destroyed: Deut 29:19 [20] (YHWH will blot out his name from under heaven); Ps 21:11 [10]; Ps 109:13; Isa 14:22."
      - "A new tablet replacing a former covenant: Exod 34:1 (two new tablets in place of the broken ones); Jer 31:31-32."
  - id: ane-cth-41-i-2-sunassura-prologue
    tradition: ane-hittite
    title: "Šunaššura treaty, Akkadian KBo 1.5 (CTH 41.I.2) §1-10: seal, historical prologue, the cattle know their stall, release and status"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    version: "CTH 41.I.2, Akkadian KBo 1.5"
    read: ["CTH 41.I.2 §1", "CTH 41.I.2 §2", "CTH 41.I.2 §3", "CTH 41.I.2 §4", "CTH 41.I.2 §5", "CTH 41.I.2 §6", "CTH 41.I.2 §7", "CTH 41.I.2 §8", "CTH 41.I.2 §9", "CTH 41.I.2 §10"]
    tags:
      - {motif: treaty-historical-prologue, refs: ["CTH 41.I.2 §2:4-6", "CTH 41.I.2 §3:7-14", "CTH 41.I.2 §5:20-25"], note: "Historical prologue: 'pānānum ana pāni abi abiya KUR Kizzuwatni ša KUR Ḫatti ibbaši; arkānum ... iptur ana KUR Ḫurri isḫur' - formerly, in my grandfather's day, Kizzuwatna belonged to Hatti, later it broke away and turned to Hurri; then Išuwa's revolt, the flight of its villagers, the Hurrian's refusal ('ÌR.MEŠ-ya tēr-mi' give back my servants - 'lā!') and his raid."}
      - {motif: ox-knows-its-owner, refs: ["CTH 41.I.2 §4:18-19", "CTH 41.I.2 §7:33-36"], note: "First in the Hurrian's mouth: 'inanna-mi appunamma GUD.ḪI.A É GUD.ḪI.A-šunu uwaddûnim-mi' - now at last the cattle have recognized their stall (and come to my land); then turned against him: 'inanna KUR Kizzuwatni ša Ḫatti GUD.ḪI.A u É GUD.ḪI.A-šunu uwaddûnim ... ana dUTU-ši isḫurū' - now Kizzuwatna are cattle of Hatti, they recognized their stall, broke from the Hurrian and turned to My Majesty."}
      - {motif: own-words-turned-against-speaker, refs: ["CTH 41.I.2 §6:27-32"], note: "'šumma-mi ana kâšum KUR-tum ayyumma ištu ittika ipaṭṭar-mi ana KUR Ḫatti isaḫḫur-mi u kī awatum annûmmu-mi' - if a land breaks away from you and turns to Hatti, how is this matter? - the Hurrian replied 'lū qatamma-mi' 'Just so!'."}
      - {motif: treaty-breaker-punished-by-gods, refs: ["CTH 41.I.2 §6:26", "CTH 41.I.2 §7:37-38"], note: "'LÚ Ḫurri nīš ilāni ītetiq' the Hurrian transgressed the oath of the gods; he sinned (ēḫṭi) against Hatti and very greatly against Kizzuwatna. Here the breach is the legal ground, not yet a punishment."}
      - {motif: vassal-released-andurarum, refs: ["CTH 41.I.2 §8:39-41"], note: "Kizzuwatna rejoiced greatly at its release (ina piṭrīš irtīšu); 'inanna KUR Ḫatti u KUR Kizzuwatni ištu nīš ilāni lū paṭrū' now they are freed from the oath; 'ana andurāri uttaššeršunušu' My Majesty has set them in release (andurāru)."}
      - {motif: vassal-sees-kings-face-none-seated-above, refs: ["CTH 41.I.2 §9:42-48"], note: "'LÚ.MEŠ Ḫurri Šunaššura ÌR-dam išassûšu u inanna dUTU-ši kittam LUGAL-am ipussu' the Hurrians call Šunaššura a slave, but My Majesty has made him truly king; when he comes before My Majesty 'IGI.ḪI.A-šu ša dUTU-ši immar' he shall see My Majesty's face, and none of the grandees will sit above him from the throne."}
    hints:
      - "Historical prologue of a covenant recounting the overlord's benefits and the partner's past: Deut 1-3; Josh 24:2-13; Exod 20:2 ('who brought you out of the house of slaves'); 1 Sam 12:6-11."
      - "Cattle recognizing their stall: Isa 1:3; Jer 8:7 (the stork knows her seasons, but my people know not)."
      - "Judged out of his own mouth: 2 Sam 12:1-7 (Nathan: 'you are the man'); 1 Kgs 20:39-42; Luke 19:22."
      - "Release (andurāru) from a former master's claim: Lev 25:10 (proclaim liberty, dĕrôr); Jer 34:8-17; Isa 61:1."
      - "Seeing the king's face, the seat above the other kings: 2 Kgs 25:28 (Jehoiachin's throne set above the kings with him); Esth 1:14 (who saw the king's face and sat first); Gen 43:3; 2 Sam 14:24."
  - id: ane-cth-41-i-2-sunassura-mutual
    tradition: ane-hittite
    title: "Šunaššura treaty CTH 41.I.2 §11-47: mutual protection, enemies, booty, aid, reporting, envoys"
