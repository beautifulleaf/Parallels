    tags:
      - {motif: treaty-parity-mutual-clauses, refs: ["CTH 41.I.2 §11:55-60", "CTH 41.I.2 §12:61-66", "CTH 41.I.2 §19:105-107", "CTH 41.I.2 §20:108-110"], note: "Every clause is given twice with the kings' names exchanged, e.g. 'dUTU-ši LUGAL GAL Šunaššura ul ibaʾʾaršu ul inakkiršu' and 'Šunaššura LUGAL GAL ul ibaʾʾaršu ul inakkiršu'."}
      - {motif: love-overlord-as-own-soul, refs: ["CTH 41.I.2 §11:57-58", "CTH 41.I.2 §12:63-64"], note: "'kīmê dUTU-ši SAG.DU-sú KUR-sú inaṣṣaršu ša Šunaššura KUR-sú SAG.DU-sú qatamma inaṣṣar' - as My Majesty guards his own head and land, so will he guard Šunaššura's; protection, not love, but the 'as his own head' measure."}
      - {motif: overlord-guarantees-vassals-chosen-heir, refs: ["CTH 41.I.2 §11:59-60", "CTH 41.I.2 §12:65-66"], note: "'ayyumê DUMU.NITA-šu ša Šunaššura ana LUGAL-rūtim ... iqabbišu dUTU-ši šūt ana LUGAL-rūtim inaṣṣaršu' - whichever son Šunaššura names for kingship, My Majesty will protect him in the kingship."}
      - {motif: treaty-fight-kings-enemy, refs: ["CTH 41.I.2 §13:67-73", "CTH 41.I.2 §23:117-120", "CTH 41.I.2 §37:180-183", "CTH 41.I.2 §38:184-187"], note: "'kīmê ana dUTU-ši LÚ.KÚR-šu ana Šunaššura qatamma LÚ.KÚR-šu itti ḫammiš taḫazzam ippušū' - as he is My Majesty's enemy, so he is Šunaššura's; together they will fight."}
      - {motif: treaty-seize-and-deliver-instigators, refs: ["CTH 41.I.2 §14:74-78", "CTH 41.I.2 §17:93-97", "CTH 41.I.2 §39:188-189", "CTH 41.I.2 §40:190-191"], note: "Rebel against the king's head seized and killed or handed over; 'mannumê itti dUTU-ši bārtam eppuš anāku Šunaššura ubaʾʾāšu' whoever rebels against My Majesty I, Šunaššura, will call to account."}
      - {motif: treaty-report-sedition-even-from-kin, refs: ["CTH 41.I.2 §19:105-107", "CTH 41.I.2 §21:111-113", "CTH 41.I.2 §43:194-195", "CTH 41.I.2 §44:196-197"]}
      - {motif: vassal-keeps-booty-from-rebel-neighbours, refs: ["CTH 41.I.2 §24:121-123", "CTH 41.I.2 §25:124-127", "CTH 41.I.2 §31:148-152"], note: "'maršīt URU NAM.RA.ḪI.A ... ileqqe mamma ul imaḫḫaršu; URU epru ša dUTU-ši=ma' - the goods and captives each army takes it keeps, no one opposes; but the town itself is My Majesty's territory."}
      - {motif: treaty-overlord-promises-military-help, refs: ["CTH 41.I.2 §29:141-142", "CTH 41.I.2 §32:155-156", "CTH 41.I.2 §36:174-179"], note: "If Šunaššura asks My Majesty for auxiliary troops, My Majesty will give them; if he is busy, 'ana pāni ÉRIN.MEŠ ḫurādiya bēlu GAL ašappar' I will send a great lord at the head of my ḫurādu troops."}
      - {motif: treaty-vassal-must-aid-overlord-at-once, refs: ["CTH 41.I.2 §35:167-173"], note: "If a strong hostility rises against My Majesty and the enemy enters 'ina nakbatišu' in force, 'Šunaššura qadu ÉRIN.MEŠ ḫurādika ana tillutiya alkam' come to my help with your ḫurādu troops; if you have business, 'DUMU.NITA-ka šupur' send your son."}
      - {motif: envoy-not-harmed-or-bewitched, refs: ["CTH 41.I.2 §45:198-200", "CTH 41.I.2 §46:201-203"], note: "'ana šammi kišpi mimma ul ibaʾʾaršu' - he will not seize him with any herb of sorcery."}
      - {motif: brothers-dwell-together-in-unity, refs: ["CTH 41.I.2 §41:192", "CTH 41.I.2 §42:193", "CTH 41.I.2 §47:204-205"], note: "'KUR Ḫatti u KUR Kizzuwatni lū summuḫū atterūtam ina birišunu lū iteneppušū' - Hatti and Kizzuwatna are truly united (mixed), let them keep friendship between them; neither shall stir up evil revolt against the other 'ina arki ūmi' in days to come."}
      - {motif: treaty-binds-future-generations, refs: ["CTH 41.I.2 §41:192", "CTH 41.I.2 §42:193"]}
    hints:
      - "Mutual defence pact: 1 Kgs 22:4 and 2 Kgs 3:7 ('I am as you are, my people as your people, my horses as your horses'); 1 Kgs 15:19 (a covenant between me and you, as between my father and yours)."
      - "As his own head/soul: 1 Sam 18:1-3 (Jonathan loved him as his own soul and made a covenant); Deut 13:7 [6] (your friend who is as your own soul)."
      - "Guaranteeing the partner's heir: 2 Sam 7:12-16; 1 Sam 20:14-17, 42 (covenant of Jonathan and David for their descendants)."
      - "Booty divided, the land reserved: Num 31:25-47; 1 Sam 30:22-25."
  - id: ane-cth-41-i-2-sunassura-hurri
    tradition: ane-hittite
    title: "Šunaššura treaty CTH 41.I.2 §48-60: war on Hurri, refusing Hurrian gifts, a new tablet, trusting messengers"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    version: "CTH 41.I.2, Akkadian KBo 1.5"
    read: ["CTH 41.I.2 §48", "CTH 41.I.2 §49", "CTH 41.I.2 §50", "CTH 41.I.2 §51", "CTH 41.I.2 §52", "CTH 41.I.2 §53", "CTH 41.I.2 §54", "CTH 41.I.2 §55", "CTH 41.I.2 §56", "CTH 41.I.2 §57", "CTH 41.I.2 §58", "CTH 41.I.2 §59", "CTH 41.I.2 §60"]
    tags:
      - {motif: town-granted-to-vassal, refs: ["CTH 41.I.2 §49:212-213", "CTH 41.I.2 §50:214-218"], note: "'epra ša URU šâšu dUTU-ši ana Šunaššura=ma anandin dUTU-ši KUR-sú lū urappaš' - the territory of that town I will give to Šunaššura, I will surely enlarge his land; of the Hurrian towns we strike, each takes what he desires."}
      - {motif: treaty-no-peace-with-kings-enemy, refs: ["CTH 41.I.2 §50:219", "CTH 41.I.2 §51:220-224", "CTH 41.I.2 §53:229-232"], note: "Kizzuwatna will never turn to Hurri; if the Hurrian king sends gifts on Šunaššura's account, 'šulmānšu ul ammangar' I will not accept his gift, unless he releases Šunaššura 'šapal nīš ilāni' under oath, then I will exchange gifts with him."}
      - {motif: treaty-return-fugitives, refs: ["CTH 41.I.2 §55:235-240"], note: "Inverted: whatever people of Hurri, merchants or people of Urušša, have been released into Šunaššura's hand, I will never give back to the Hurrian king, even if he asks 'ina rigmi ṭābi' with kind words."}
      - {motif: treaty-old-oath-tablet-erased-new-made, refs: ["CTH 41.I.2 §59:255-261"], note: "'tuppu ša nīš ilāni ša ēpiš lū nipaššiṭšu awat LÚ Ḫurri lū ninassuk ... tuppam šanêam nippuš' - we erase the tablet of the oath, reject the Hurrian's word, make another tablet; and Šunaššura will no longer send his envoy to the Hurrian or admit the Hurrian envoy."}
      - {motif: messenger-words-must-match-tablet, refs: ["CTH 41.I.2 §60:262-269"], note: "'šumma awāti ša DUMU šipri ana awāti ša ṭuppi mitḫar DUMU šipra annêam Šunaššura qīpšu; u šumma ... ul mitḫar ... lū lā taqqīpšu' - if the messenger's words agree with the tablet's, trust him; if not, do not trust him, and do not let your heart take offence (mašiktam) because of such words."}
      - {motif: treaty-vassal-must-aid-overlord-at-once, refs: ["CTH 41.I.2 §57:244-248", "CTH 41.I.2 §58:249-254"], note: "Šunaššura's fear 'will the troops of Hatti come to my help, or will terror (pulḫutu) be set over my land?' is answered by equal quotas; for campaigns against Hurri or Arzawa he gives 100 teams of horses and 1000 foot soldiers, and My Majesty provisions them."}
    hints:
      - "Breaking with a former overlord's envoys and gifts: 2 Kgs 18:7 (Hezekiah rebels against Assyria); 2 Kgs 20:12-19 (envoys of Merodach-baladan); Isa 30:1-7 (envoys to Egypt)."
      - "Testing a messenger against the written word: Deut 18:21-22 (how shall we know the word?); Jer 29:24-32 (Shemaiah's letters); Gal 1:8."
      - "Fixed quotas of troops for the overlord: 1 Kgs 4:26-28 [5:6-8]; 2 Kgs 3:7."
  - id: ane-cth-41-i-2-sunassura-borders
