      - {motif: human-in-divine-image, refs: ["Merikare W1:12_2"], note: "snn.pl =f pw pri̯.pl m ḥꜥ.pl =f 'they are his images (snn) who came forth from his body'"}
      - {motif: creator-made-plants-and-animals-to-feed-humans, refs: ["Merikare W1:12_2/3"], note: "jri̯.n =f n =sn sm,w ꜥw,t ꜣpd.pl rm.w.pl snm st"}
      - {motif: god-kills-rebellious-children, refs: ["Merikare W1:12_3", "Merikare W1:12_7"], note: "he killed his enemies and destroyed his children for plotting rebellion; he killed the treacherous among them 'as a man beats his son for his brother's sake'"}
      - {motif: god-disciplines-as-father, refs: ["Merikare W1:12_7"]}
      - {motif: god-sails-round-to-see-them, refs: ["Merikare W1:12_4/2-12_4/3"], note: "he sails round to see them; he has built a shrine behind them (around them)"}
      - {motif: god-hears-the-weeping, refs: ["Merikare W1:12_5"], note: "[r]mi̯.w =sn jw =f ḥr sḏm 'when they weep he hears'"}
      - {motif: creator-made-rulers-to-support-weak, refs: ["Merikare W1:12_5/2"], note: "ḥqꜣ.w ... r ṯsi̯.t m psd 〈n(,j)〉 sꜣ-ꜥ"}
      - {motif: creator-gave-magic-as-weapon, refs: ["Merikare W1:12_6"], note: "ḥkꜣ,w r ꜥḥꜣ,w r ḫsf ꜥ n(,j) ḫpr.yt; dreams watched over night and day (rs.wt)"}
      - {motif: god-knows-every-name, refs: ["Merikare W1:12_8"], note: "jw nṯr rḫ.w rn nb"}
    hints:
      - "Heaven and earth made for humankind and everything given them: Ps 8:4-9 ('what is man ... you have put all things under his feet'), Gen 1:26-30, Ps 115:16; Q 2:29 (he created for you all that is on earth), Q 45:12-13, Q 14:32-34, Q 16:5-14 (cattle, sea creatures for food)."
      - "The creator provides food for all his creatures: Ps 104:14-15, 27-28 and 145:15-16; Gen 1:29-30 and 9:3; Q 80:24-32."
      - "Humans as god's images from his body: Gen 1:26-27 and 5:1-3; and as god's flock: Ps 95:7, 100:3, Ezek 34:31."
      - "Breath of life in the nostrils: Gen 2:7, Job 27:3, Isa 2:22; Q 15:29 and 32:9 (he breathed into him of his spirit)."
      - "The waters subdued before creation: Ps 104:6-9, Ps 74:13-14, Job 38:8-11, Gen 1:2, 9-10."
      - "When they weep he hears: Exod 2:23-25, 3:7, Ps 34:18, Ps 145:19; and god disciplines as a father, Deut 8:5, Prov 3:12."
      - "God knows every name: Ps 147:4 and Isa 40:26 (he calls the stars by name), Isa 43:1, Exod 33:12 and 17 ('I know you by name'), John 10:3; Q 2:31 (he taught Adam all the names)."
      - "He destroyed his children for rebellion: compare the Heavenly Cow (HeavenlyCow W1:1-15/2) and Gen 6-7, Q 11:25-49."
  - id: ane-merikare-w1-closing-and-colophon
    tradition: ane-egyptian
    title: Closing counsel - do not kill your intimate, the king's followers are gods, spread love of yourself; colophon of Khaemwaset (Instruction for Merikare)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Egyptian"
    version: "W1, pPetersburg 1116A verso"
    read: ["Merikare W1:12_8/2-13_3/2"]
    tags:
      - {motif: reach-me-without-accuser, refs: ["Merikare W1:12_8/2-12_9"], note: "keep my teaching for the king 'that you may reach me without an accuser (srḫ,y)'"}
      - {motif: do-not-execute-unjustly, refs: ["Merikare W1:12_9/2"], note: "do not kill one close to you whom you have favoured, for god knows him"}
      - {motif: kings-followers-are-gods, refs: ["Merikare W1:12_10-12_10/2"], note: "wꜥ jm =sn pw wꜣḏ tp tꜣ; nṯr.pl pw šms,w nsw,t"}
      - {motif: spread-love-of-yourself-among-all-people, refs: ["Merikare W1:12_11-12_11/2"], note: "jmi̯ mr,wt =k n tꜣ-tm,w; a good character is remembered when the years have passed"}
      - {motif: hope-for-saviour-may-he-come-today, refs: ["Merikare W1:13_1"], note: "the descendants of Khety will say of him 'destroyer of the time of suffering', imploring 'may he come today' (jwi̯.t =f mjn) - reading uncertain"}
      - {motif: scribal-colophon, refs: ["Merikare W1:13_3/2"], note: "copied 'as found in writing' by the scribe Khaemwaset for himself and his brother the scribe Mehu, 'skilled in the work of Thoth'"}
      - {motif: wise-father-instructs-son, refs: ["Merikare W1:13_2"], note: "m =k ḏd.n =j n =k bw-ꜣḫ n(,j) ẖ,t =j"}
    hints:
      - "The father's closing charge: Prov 4:1-9, 1 Kgs 2:1-4 (David to Solomon), Deut 32:46-47."
      - "Love of the people as the king's best defence: Prov 14:28, 20:28 and 29:14."
  - id: ane-merikare-w2-carlsberg
