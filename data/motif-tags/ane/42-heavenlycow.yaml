      - {motif: land-darkened-when-god-departs, refs: ["HeavenlyCow W1:34/2"], note: "ꜥḥꜥ.jn r =f tꜣ m kk(,w) as the god departs on the cow"}
      - {motif: afterlife-fields-named-by-god, refs: ["HeavenlyCow W1:39/3-40/3"], note: "ḥtp sḫ,t ꜥꜣ > sḫ,t-ḥtp; rjd =j sm,w > sḫ,t-jꜣr,w; grg =j st m (j)ḫ,t > the stars (wordplay jḫjḫ)"}
