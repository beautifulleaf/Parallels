# Full read of the ANE corpus, chunk 42: Book of the Heavenly Cow, Contendings of Horus and Seth,
# Admonitions of Ipuwer, Dispute of a Man with his Ba, Instruction for Merikare.
# Read from the TLA 2018 export (transliteration, lemmas, German translation; Ipuwer with Enmarch's English).
# Each manuscript witness (W1, W2 ...) is its own unit; later witnesses that only repeat W1 are short units noting variants.
new_motifs:
  humans-plot-against-aged-sun-god: {label: "When the sun god has grown old, humankind plots against him (kꜣi̯ md,t r ...)", cluster: flood}
  aged-god-bones-silver-flesh-gold-hair-lapis: {label: "The aged god's body is described as precious materials: bones of silver, flesh of gold, hair of lapis lazuli", cluster: theology}
  humans-came-from-gods-eye: {label: "Humankind came into being from the creator's eye (his tears)", cluster: creation}
  gods-eye-sent-as-slaughtering-goddess: {label: "The sun god sends out his Eye in the form of a goddess (Hathor/Sakhmet) to slay rebellious humankind", cluster: flood}
  destroying-goddess-wades-in-human-blood: {label: "The destroying goddess wades in the blood of the slain humans", cluster: flood}
  beer-dyed-red-to-deceive-destroyer: {label: "To stop the destroyer, the god has thousands of jars of beer dyed red like human blood and poured out over the fields", cluster: flood}
  destroyer-drunk-humanity-spared: {label: "The destroying goddess drinks the red beer, becomes drunk, no longer recognises humans, and the remnant of humankind survives", cluster: flood}
  so-it-came-about-etiology-formula: {label: "Recurring etiological formula 'so came about X' (ḫpr X pw) deriving a name, place, rite or custom from a word or act of the god", cluster: etiology}
  festival-of-intoxicating-drink-etiology: {label: "An annual festival with an intoxicating drink for a goddess is founded on the day humankind was spared", cluster: cult}
  creator-weary-of-humankind-withdraws: {label: "The creator, weary of living among humans, withdraws from earth to heaven", cluster: flood}
  god-carried-to-sky-on-celestial-cow: {label: "The sky goddess turns into a cow and carries the sun god up on her back; she becomes the sky", cluster: cosmology}
  origin-of-slaughter-among-humans: {label: "After the god's withdrawal humans take up bows and clubs against one another: the origin of slaughter among humankind", cluster: flood}
  supporters-hold-up-the-sky: {label: "Gods (Shu, the Heh-gods) are set beneath the sky (cow) to hold it up", cluster: cosmology}
  afterlife-fields-named-by-god: {label: "The god's words name and create the fields of the hereafter (Field of Offerings, Field of Reeds) and the stars", cluster: paradise}
  moon-god-appointed-deputy-of-sun: {label: "The sun god appoints the moon god (Thoth) his deputy and representative to shine in the night", cluster: cosmology}
  serpents-of-earth-put-under-guard: {label: "The high god orders the earth god to guard the serpents within the earth and hands them over to the god of the dead", cluster: cosmology}
  ritual-purity-for-reciting-sacred-text: {label: "Whoever recites the sacred text must be purified: natron in the mouth, new linen, white sandals, bathing in floodwater, a purification of nine days", cluster: cult}
  ba-of-each-god-catalogue: {label: "Catalogue identifying the ba (manifestation) of each god with another being or element (Shu's ba is the wind, Nun's ba is Re, Osiris's ba the ram of Mendes)", cluster: theology}
  deceaseds-names-eternity-and-everlastingness: {label: "Asked his names, the blessed dead answers 'Eternity and Everlastingness' (nḥḥ ḥnꜥ ḏt)", cluster: afterlife}
  deity-says-i-am-who-i-am: {label: "A divine utterance reads 'I am (who) I am' (Egyptian jw =j jm =j)", cluster: theology}
  dead-king-joins-gods-retinue: {label: "The dead king is welcomed by the gods to be one of the retinue of the sun god, living for ever", cluster: afterlife}
  learned-scribe-passes-freely-to-heaven: {label: "The scribe who knows the sacred writings and spells goes up and down to heaven unhindered and no wrongdoing is counted against him", cluster: afterlife}
  heir-claims-fathers-office-before-tribunal: {label: "The son of the dead king sues before the divine tribunal for his father's office, against his father's brother", cluster: kingship}
  divine-lawsuit-drags-on-eighty-years: {label: "The lawsuit between two gods has dragged on for eighty years without a verdict", cluster: law}
  tribunal-writes-to-oracle-goddess: {label: "The divine tribunal, unable to decide, writes a letter to a senior goddess (Neith) and promises to do what she says", cluster: law}
  goddess-threatens-sky-falls-on-earth: {label: "A goddess threatens that if injustice is done she will rage and the sky will fall on the earth", cluster: cosmology}
  loser-compensated-with-foreign-goddesses: {label: "The losing party is to be compensated with the goddesses Anat and Astarte as wives", cluster: kingship}
  high-god-insulted-sulks-alone: {label: "Insulted in the assembly, the high god lies on his back in his pavilion, sick at heart, alone for a whole day", cluster: theology}
  goddess-exposes-herself-to-cheer-god: {label: "A goddess exposes her genitals to the sulking high god, who laughs and returns to the assembly", cluster: theology}
  ferryman-bribed-with-gold-ring: {label: "Barred from the island, the goddess disguised as an old woman bribes the ferryman with a gold ring after he refuses bread", cluster: trickster}
  shapeshifting-goddess-entraps-rival: {label: "The goddess changes herself into a beautiful young woman (then a kite) to trap her adversary", cluster: trickster}
  gold-made-taboo-in-city: {label: "Punished for taking gold, a god forswears gold, which becomes an abomination in his city", cluster: etiology}
  rivals-contest-as-hippopotami: {label: "Two rival gods turn into hippopotami and stay under water; whoever surfaces before three months loses", cluster: kingship}
  mother-harpoons-wrong-combatant: {label: "The mother throws a copper harpoon into the water; it strikes her own son, then her brother, and she releases each when he cries out", cluster: kingship}
  son-beheads-his-mother: {label: "The angry son cuts off his mother's head; she becomes a headless flint statue", cluster: kingship}
  eyes-torn-out-become-lotuses: {label: "The rival tears out the young god's eyes and buries them; they grow into lotus flowers", cluster: kingship}
  eyes-healed-with-gazelle-milk: {label: "A goddess heals the blinded god by putting gazelle's milk in his eyes", cluster: healing}
  rival-attempts-homosexual-domination: {label: "At night the rival puts his semen between the young god's thighs, to claim before the court that he has 'done a man's work' on him", cluster: kingship}
  semen-on-lettuce-impregnates-rival: {label: "The mother puts her son's semen on the lettuce the rival eats; he becomes 'pregnant' and the semen answers from inside him", cluster: trickster}
  semen-called-forth-in-court: {label: "The divine scribe calls each god's semen to come out; it answers from where it is, proving the truth before the court", cluster: law}
  stone-ship-contest: {label: "Two rivals race in ships of stone; one secretly plasters a wooden ship, the other's real stone ship sinks", cluster: trickster}
  god-of-dead-made-grain-for-gods-and-men: {label: "The god of the dead claims to have created barley and emmer to keep gods and humans ('the small cattle') alive", cluster: creation}
  messengers-of-underworld-fear-no-god: {label: "The land of the dead is full of fierce-faced messengers who fear no god or goddess and fetch the heart of every evildoer", cluster: underworld}
  all-gods-and-men-go-down-to-west: {label: "The god of the dead reminds the gods that all of them, and nobles and commoners after them, go down to rest in the West where he is", cluster: underworld}
  defeated-rival-brought-in-fetters: {label: "The defeated rival is brought bound in fetters (a yoke) before the high god and concedes the throne", cluster: kingship}
  defeated-rival-becomes-thunderer-with-sun-god: {label: "The defeated rival is taken by the sun god as a son to sit with him and thunder in the sky, feared by all", cluster: kingship}
  heaven-and-land-rejoice-at-coronation: {label: "When the rightful heir is crowned the gods hold festival, heaven rejoices, the whole land jubilates and garlands are taken up", cluster: kingship}
  lament-refrain-o-yet: {label: "A lament built on a long refrain ('O, yet ...', jw ms ...) listing one sign of the land's ruin after another", cluster: lament}
  lament-refrain-look: {label: "A lament built on the refrain 'Look ...' (m =tn ...), each line setting a former state against the present", cluster: lament}
  have-nots-become-owners: {label: "Litany of inversion: he who had nothing owns riches, he who had no boat owns ships, the maidservant wears jewels, the lady is in rags", cluster: lament}
  dead-buried-in-river: {label: "The many dead are thrown into the river: 'the flood is a grave, the tomb has become a flood'", cluster: lament}
  women-barren-creator-cannot-fashion: {label: "Women are barren and the creator (Khnum) cannot fashion because of the state of the land", cluster: lament}
  pestilence-and-blood-throughout-land: {label: "Pestilence (jꜣdt) is throughout the land and blood is everywhere", cluster: lament}
  people-wish-to-die: {label: "Great and small say 'I wish I could die', or wish for the end of humankind with no conception or birth", cluster: lament}
  tomb-robbing-and-mummies-cast-out: {label: "The embalmed dead are thrown out on the high ground, the pyramid is emptied and the king buried as a falcon lies exposed", cluster: lament}
  sacred-writings-and-secrets-exposed: {label: "The temple's writings are removed, the secrets of kingship and the holy places are laid bare, and ordinary people know them", cluster: lament}
  no-voyages-to-byblos-for-coffin-wood: {label: "No one sails to Byblos any more, so there is no cedar for coffins and oil for embalming", cluster: lament}
  remember-the-rites-litany: {label: "Litany 'Remember ...' (sḫꜣ ...) calling to mind the lost temple rites, offerings and purity rules", cluster: lament}
  it-is-good-when-litany: {label: "Litany 'Indeed it is good when ...' picturing the restored order (ships sail, canals are dug, people feast)", cluster: lament}
  sage-reproaches-creator-as-negligent-shepherd: {label: "The sage reproaches the creator, called 'shepherd of all', for letting his herd perish: he should have known their nature and struck them in the first generation", cluster: theodicy}
  creator-should-have-destroyed-first-generation: {label: "Had the creator recognised humankind's character in the first generation, he would have stretched out his arm and destroyed the herd and their heirs", cluster: theodicy}
  three-go-on-road-two-arrive: {label: "Image of insecurity: if three men go on the road, only two are found", cluster: lament}
  sage-answers-lord-of-all: {label: "Dialogue frame: the sage answers the Lord of All, and the Lord of All answers him", cluster: theodicy}
  ba-drags-man-toward-death: {label: "The man complains that his own ba wants to leave him and drag him into death before his time", cluster: theodicy}
  burial-only-brings-grief: {label: "The ba argues that burial and tombs are only heartbreak: the builders of pyramids have bare altars like those who died on the riverbank", cluster: theodicy}
  follow-the-beautiful-day: {label: "Exhortation to 'follow the beautiful day and forget care' (šms hrw nfr smḫ mḥ)", cluster: wisdom}
  peasant-loses-wife-and-children-parable: {label: "Parable: a peasant's wife and children perish in the crocodile-infested water; he mourns the children who died before they lived", cluster: wisdom}
  my-name-stinks-litany: {label: "Litany 'Behold, my name stinks ...' comparing the speaker's reputation to rotting fish, birds, crocodiles and a slandered wife", cluster: lament}
  to-whom-shall-i-speak-today: {label: "Litany 'To whom shall I speak today?' (ḏd =j n m mjn): brothers are evil, friends do not love, hearts are greedy, there is no righteous man", cluster: lament}
  death-before-me-today-like: {label: "Litany 'Death is before me today like ...' comparing death to recovery from illness, myrrh, lotus, clearing sky, homecoming from captivity", cluster: lament}
  blessed-dead-as-living-god: {label: "He who is yonder will be a living god, stand in the sun-barque and petition Re as a wise man", cluster: afterlife}
  ba-promises-to-stay-with-man: {label: "The ba finally agrees to stay with the man and make a common landing place with him when he dies", cluster: theodicy}
  destroy-the-agitator-and-his-name: {label: "The king is told to remove the agitating talker, kill his children, wipe out his name and his memory and supporters", cluster: kingship}
  speech-stronger-than-weapons: {label: "Be skilful in speech: the tongue is the king's sword and speech is stronger than any fighting", cluster: wisdom}
  imitate-ancestors-whose-words-are-written: {label: "Imitate your fathers and forebears; their words are fixed in writing: unroll and read them", cluster: wisdom}
  judges-of-dead-not-lenient: {label: "The tribunal that judges the dead is not lenient on the day of judgment; they see a lifetime as an hour", cluster: afterlife}
  deeds-heaped-beside-dead-at-judgment: {label: "After death a man remains with his deeds placed beside him in a heap before the judges", cluster: afterlife}
  king-confesses-own-wrongdoing: {label: "The old king confesses that a shameful deed (destruction in Thinis) happened through what he did, and that retribution followed", cluster: kingship}
  blow-repaid-with-blow: {label: "A blow is repaid with its like: every deed is interlocked with its consequence", cluster: wisdom}
  hidden-god-knows-characters: {label: "God, who knows the characters of men, has hidden himself while the generations pass", cluster: theology}
  creator-made-world-for-humans-sake: {label: "The creator made heaven and earth, light, air and food 'for their sake' (n-jb =sn), for humankind", cluster: creation}
  humans-cattle-of-god: {label: "Humankind is called the well-tended cattle (flock) of god", cluster: theology}
  creator-drove-off-greed-of-water: {label: "Before making heaven and earth the creator drove off the greed (snk) of the water", cluster: creation}
  creator-made-rulers-to-support-weak: {label: "The creator made rulers for humankind, a support for the back of the weak", cluster: kingship}
  creator-gave-magic-as-weapon: {label: "The creator gave humans magic as a weapon to ward off the blow of events", cluster: creation}
  god-knows-every-name: {label: "God knows every name (nṯr rḫ rn nb)", cluster: theology}
  asiatic-nomad-stereotype: {label: "The Asiatic nomad is wretched: his land is short of water and wood, he never settles, fights 'since the time of Horus', neither wins nor is defeated, a crocodile on its bank", cluster: ethnography}
  do-not-destroy-anothers-monument: {label: "Do not damage another's monument or build your tomb from the ruins of older buildings; quarry your own stone", cluster: kingship}
  one-day-for-eternity: {label: "A single day of service gives something for eternity, an hour benefits the future", cluster: wisdom}
  return-to-primeval-waters-wished: {label: "The aged creator wishes to return to the primeval waters (Nun) from which he came into being", cluster: cosmology}
  land-darkened-when-god-departs: {label: "When the sun god departs on high, the land lies in darkness", cluster: cosmology}
  sun-barque-crosses-sky: {label: "The sun god stands in his barque (with steering-oar and shrine) to cross the sky", cluster: cosmology}
  stars-on-body-of-sky-goddess: {label: "The stars are set on the belly of the sky goddess", cluster: cosmology}
  written-warning-to-serpents: {label: "A written decree is sent to the serpents of every mound, warning them to keep still because the god is present", cluster: cosmology}
  magicians-who-know-spells: {label: "Warning against magicians who know their spells, for the god of magic himself is with them", cluster: magic}
  rebels-in-the-earth-quelled: {label: "Gods created by the creator who rebelled are confined in the earth and are to be quelled by his deputy", cluster: cosmology}
  vizier-of-the-god: {label: "A god is appointed vizier of the high god, and all creatures thank him", cluster: theology}
  reciter-blessed-with-long-life-and-prosperity: {label: "Whoever performs the rite in the book will have long life, sound eyes and limbs, unfailing affairs and undiminished goods", cluster: cult}
  proven-a-million-times-formula: {label: "Closing formula: 'truly excellent, (proven) a million times'", cluster: magic}
  curse-on-enemy-of-re: {label: "Spell at dusk against the enemy of Re: 'On your face! May you fall!'", cluster: magic}
  lord-of-eternity-creator-of-everlastingness: {label: "The god is hailed as Lord of eternity (nḥḥ) who created everlastingness (ḏt) and makes the years of the gods pass", cluster: theology}
  reciter-lives-in-afterlife: {label: "Whoever recites the spell will live in the necropolis and be more revered than the living on earth", cluster: afterlife}
  ritual-at-new-moon: {label: "The spell or rite is to be recited at the new-moon and half-month festivals", cluster: cult}
  king-named-osiris-justified: {label: "The dead king is named 'Osiris NN, justified' (mꜣꜥ-ḫrw)", cluster: afterlife}
  sky-goddess-protects-dead-king-as-son: {label: "The sky goddess addresses the dead king as her son and wishes him power, justification, a body unharmed and eternal life", cluster: afterlife}
  name-endures-on-earth: {label: "Wish that the dead man's corpse endure in the necropolis and his name endure on earth", cluster: afterlife}
  dead-king-receives-offerings: {label: "The gods give the dead king daily breath, cool water and offerings", cluster: afterlife}
  no-enemies-among-men-or-gods: {label: "Declaration that the speaker has no enemies among men, gods, spirits or the dead in the whole land", cluster: magic}
  rivals-contest-by-strength: {label: "One claimant proposes to settle the dispute by a trial of strength with his rival before the gods", cluster: kingship}
  high-god-mocks-young-heir: {label: "The high god mocks the young claimant as weak in body, a boy with bad breath, too small for the office", cluster: kingship}
  god-repels-chaos-serpent-from-sun-barque: {label: "A god boasts that he daily slays the enemy of the sun god (Apophis) from the prow of the sun barque", cluster: cosmology}
  should-office-go-to-brother-while-son-stands: {label: "Refrain: shall the office be given to the brother while the bodily son stands by (or to the boy while the elder brother stands by)?", cluster: kingship}
  oath-by-life-of-divine-mother: {label: "A goddess swears 'as my mother lives, as (the creator) lives'", cluster: law}
  threat-to-kill-one-god-each-day: {label: "An angry god threatens to take his sceptre and kill one of the gods every day", cluster: kingship}
  refuses-to-litigate-while-woman-present: {label: "A litigant swears he will not plead in court as long as a certain goddess is present, and the court is moved to an island", cluster: law}
  widow-and-fatherless-son-wronged: {label: "A widow tells how a stranger threatens to beat her fatherless son and seize his father's cattle", cluster: law}
  ferryman-punished-toes-cut: {label: "The ferryman who disobeyed is punished by having the front of his feet cut off", cluster: law}
  lie-to-high-god-about-victim: {label: "The attacker tells the high god he has not found his victim, though he has maimed him", cluster: kingship}
  high-god-orders-feast-for-peace: {label: "The high god orders the quarrelling rivals to eat and drink together and make peace", cluster: kingship}
  mother-cuts-off-sons-defiled-hands: {label: "The mother cuts off her son's hands defiled by the rival's semen, throws them in the water and makes him new ones", cluster: kingship}
  verdict-x-is-right-y-is-wrong: {label: "The divine court pronounces 'X is right (mꜣꜥ), Y is wrong (ꜥḏꜣ)'", cluster: law}
  verdict-repeatedly-won-but-ignored: {label: "The claimant complains that he has been declared right in hall after hall, a thousand times, yet his opponent ignores the verdict", cluster: law}
  high-god-belittles-other-gods-gift: {label: "The high god retorts that the gift a god boasts of (grain) would have existed even if that god had never been born", cluster: theology}
  justice-sunk-in-underworld: {label: "The god of the dead complains that justice (Maat) has been allowed to sink into the underworld", cluster: theology}
  father-son-hostility-in-crisis: {label: "In the time of ruin a man sees his own son as his enemy", cluster: lament}
  workers-abandon-their-crafts: {label: "In the collapse the trades (doorkeepers, washermen, bird-catchers, brewers) abandon their work or turn to plunder and arms", cluster: lament}
  ancestors-foretold-the-calamity: {label: "The present calamity is what the ancestors foretold", cluster: prophecy}
  foreigners-have-become-people-everywhere: {label: "Foreigners have become 'people' (Egyptians) everywhere and foreign bowmen have entered the land", cluster: lament}
  inundation-comes-but-none-ploughs: {label: "The Nile flood rises but no one ploughs for it", cluster: lament}
  land-turns-like-potters-wheel: {label: "The land spins round like a potter's wheel (the world turned upside down)", cluster: lament}
  crocodiles-glutted-with-the-dead: {label: "Crocodiles are glutted because men go to them of their own accord (drown themselves)", cluster: lament}
  no-one-knows-what-has-happened: {label: "Everyone says 'we do not know what has happened throughout the land'", cluster: lament}
  desert-throughout-the-land: {label: "The desert has spread throughout the land and the nomes are hacked up", cluster: lament}
  provinces-withhold-taxes: {label: "The southern provinces pay no taxes because of strife and the treasury is empty", cluster: lament}
  laughter-has-perished-mourning-in-land: {label: "Laughter has perished and is no longer made; mourning mixed with lamentation is throughout the land", cluster: lament}
  noble-indistinguishable-from-pauper: {label: "The son of a well-born man can no longer be distinguished from a have-not", cluster: lament}
  if-i-knew-where-god-is: {label: "A sufferer says: if only I could perceive and know where god is, I would act for him", cluster: theodicy}
  truth-in-name-wrong-in-deed: {label: "Maat (truth) is in the land in name only; wrongdoing is what people do while leaning on it", cluster: lament}
  cattle-mourn-for-state-of-land: {label: "The herds weep and the cattle mourn because of the state of the land", cluster: lament}
  cult-offerings-futile: {label: "Offerings and service to the gods are futile: none can reach the god and giving to him is misery", cluster: theodicy}
  travellers-robbed-and-killed-on-roads: {label: "Bandits lurk in the bushes by the roads to rob, beat and kill the night traveller", cluster: lament}
  famine-people-eat-fodder: {label: "In the famine people eat plant fodder and drink water; no flour is found and seed is taken from the pig's mouth", cluster: lament}
  speaker-regrets-not-speaking-earlier: {label: "The speaker wishes he had raised his voice at the time, to save himself from the suffering", cluster: lament}
  scribes-slain-and-registers-destroyed: {label: "Offices are broken open, scribes slain, the land registers and laws thrown out and torn up in the streets", cluster: lament}
  king-carried-off-by-rabble: {label: "Something never done before: the king is removed (carried off) by the rabble", cluster: lament}
  city-falls-in-an-hour: {label: "The royal city has fallen down in a single hour", cluster: lament}
  mothers-sell-children-for-necessities: {label: "Rich women give away their children in exchange for beds (necessities)", cluster: lament}
  nobles-flee-in-fear-of-death: {label: "Rich ladies and the chiefs of the land flee, prostrate with fear of death", cluster: lament}
  brother-slain-beside-brother: {label: "A man is slain at his brother's side and the brother flees to save himself", cluster: lament}
  day-does-not-dawn: {label: "Day does not dawn on the land (darkness persists)", cluster: lament}
  royal-estate-plundered: {label: "The king's estate and workshop are a free-for-all and without their revenues of grain, fowl, fish, linen and oil", cluster: lament}
  refrain-destroy-enemies-of-residence: {label: "Refrain 'Destroy the enemies of that august Residence!' with a varying epithet each time", cluster: lament}
  why-does-god-create-humankind: {label: "The sage asks why the god goes on creating humankind when the fearful cannot be told from the violent", cluster: theodicy}
  god-should-bring-coolness-on-heat: {label: "The god should come and bring coolness upon the heat (of strife)", cluster: theodicy}
  fire-in-the-human-heart: {label: "Fire (violent passion) belongs to the hearts of humankind", cluster: theodicy}
  creator-has-hu-sia-maat: {label: "Authoritative Utterance (Hu), Perception (Sia) and Truth (Maat) are with the creator", cluster: theology}
  statues-burned-tombs-destroyed: {label: "People enter the temples; statues are burned and tombs and the bodies of the dead destroyed, and the gods weep", cluster: lament}
  god-accused-of-speaking-falsehood: {label: "The sage tells the god he has brought this about because he spoke falsehood", cluster: theodicy}
  would-that-you-tasted-the-misery: {label: "The sage wishes the god could taste a little of the misery himself", cluster: theodicy}
  each-fights-for-own-and-protects-himself: {label: "Every man fights for his own (his sister) but only protects himself; every man slays his brother", cluster: lament}
  foreign-enemies-named-nubians-libyans-asiatics: {label: "The sage asks whether the attackers are Nubians or Libyans and laments that Asiatics have learned the governance of Egypt", cluster: ethnography}
  egypt-will-not-be-given-to-sand: {label: "Popular wisdom says Egypt will not be given over to the sand (desert), for it is strong on its borders", cluster: lament}
  god-made-people-live-yet-they-fear-tomorrow: {label: "The god has done good and made people live, yet they cover their faces in fear of the morrow", cluster: theodicy}
  old-man-dies-leaving-child-heir: {label: "An old man is carried off by death while his son is still a child without understanding, and the father weeps for him", cluster: lament}
  they-call-but-do-not-listen: {label: "If one calls to them, they do not listen", cluster: lament}
  hands-build-pyramids-dig-canals: {label: "In good times men's hands build pyramids, dig canals and plant trees for the gods", cluster: lament}
  people-drunk-and-happy-in-restored-order: {label: "It is good when people are drunk, drink and their hearts are happy, with jubilation in their mouths", cluster: lament}
  shelter-for-the-homeless: {label: "It is good when every man's need is met with a blanket in the shade and the door shut on him who slept in a bush", cluster: lament}
  ba-instructs-the-man: {label: "The ba offers to teach the man about the West", cluster: theodicy}
  speaking-to-ones-own-soul: {label: "A man argues aloud with his own soul (ba), opening his mouth to answer it", cluster: wisdom}
  make-the-west-pleasant: {label: "The man asks his ba to make the West (the realm of the dead) pleasant for him", cluster: afterlife}
  day-of-misfortune: {label: "The 'day of difficulty' (hrw qsnt), the day of misfortune or death", cluster: afterlife}
  ba-mocks-man-clinging-to-life: {label: "The ba mocks the man: 'you are no man; are you even alive? you care for life like a lord of wealth'", cluster: theodicy}
  dead-but-name-lives: {label: "When you are dead, only your name lives on", cluster: afterlife}
  west-is-a-landing-place: {label: "The West (realm of the dead) is a mooring place, a resting place for the heart", cluster: afterlife}
  man-promises-ba-good-burial: {label: "The man promises his ba a well-provided burial and shade over his corpse so that other bas will envy it", cluster: afterlife}
  warning-ba-will-find-no-rest-in-west: {label: "If the ba drives the man to death prematurely, it will find no resting place in the West", cluster: afterlife}
  heir-to-perform-funerary-offerings: {label: "The dying man asks for patience until his heir grows up to make offerings and stand at the tomb on the day of burial", cluster: afterlife}
  pyramids-of-builders-desolate: {label: "The builders of granite pyramids, who became gods, now have altars as bare as those of the unburied dead on the riverbank", cluster: afterlife}
  peasant-refused-supper-parable: {label: "Parable: a peasant asks for an early meal, is told it is for supper, goes out and comes back changed, deaf to his wife", cluster: wisdom}
  slandered-wife: {label: "A wife about whom a lie has been told to her husband", cluster: law}
  brothers-and-friends-false: {label: "Brothers are evil, friends of today do not love, the former partner has become an enemy, and one turns to strangers for honesty", cluster: lament}
  neighbours-goods-seized: {label: "Hearts are greedy and every man seizes his neighbour's goods", cluster: lament}
  no-one-to-trust: {label: "There is no intimate (confidant) and no man's heart one can lean on", cluster: lament}
  no-remembrance-of-yesterday: {label: "Yesterday is not remembered and no one acts for him who acted (no gratitude)", cluster: lament}
  wrong-roams-land-without-end: {label: "The wrong that strikes the land has no end", cluster: lament}
  death-as-homecoming-from-captivity: {label: "Death is like a man coming home from an expedition or longing to see his house after years in captivity", cluster: afterlife}
  dead-punish-the-wrongdoer: {label: "The blessed dead, as a living god, repels wrong against the one who does it", cluster: afterlife}
  asiatics-plundered-until-they-abhor-egypt: {label: "The king had the Asiatics struck, their people captured and their cattle seized until they abhorred Egypt", cluster: war}
  ba-returns-to-known-place: {label: "The ba (soul) goes to the place it knows and does not stray from its accustomed paths; no magic can hold it back", cluster: afterlife}
  be-mild-when-punishing: {label: "The ruler is told to be mild (gracious) when he punishes", cluster: kingship}
  choose-men-by-deeds-not-birth: {label: "Do not distinguish the well-born from the commoner: take a man for the work of his hands", cluster: kingship}
  conquest-like-a-cloudburst: {label: "The king took a region 'like a cloudburst' (a flood of water)", cluster: war}
  creator-made-plants-and-animals-to-feed-humans: {label: "The creator made plants, cattle, fowl and fish to feed humankind", cluster: creation}
  do-for-god-that-he-may-do-for-you: {label: "Act for the god, so that he may act likewise for you (offerings and inscriptions)", cluster: cult}
  do-maat-while-on-earth: {label: "Speak and do Maat (justice) while you remain on earth", cluster: wisdom}
  do-not-execute-unjustly: {label: "Do not kill: punish with beatings and imprisonment, not execution, except the rebel; do not kill a man whose worth you know", cluster: law}
  do-not-oppress-widow-or-dispossess-heir: {label: "Comfort the weeper, do not oppress the widow, do not drive a man from his father's property, do not demote officials", cluster: law}
  do-what-benefits-the-ba: {label: "A man should do what benefits his ba: serve as priest, wear white sandals, visit the temple, eat bread in the god's house", cluster: cult}
  even-temper-is-heaven-for-a-man: {label: "A good (even) temper is a man's heaven; the rage of the hot-hearted is grievous", cluster: wisdom}
  fortified-frontier-city-gate-of-delta: {label: "A fortified city with walls, many troops and dykes is 'the door' of the land against foreigners", cluster: war}
  furnish-tomb-by-doing-maat: {label: "Make your tomb excellent by uprightness and by doing Maat, for that is what the gods rely on", cluster: afterlife}
  god-avenges-bloodshed: {label: "God strikes down with misfortune because of blood(shed)", cluster: law}
  god-hears-the-weeping: {label: "When humans weep, the creator hears", cluster: theology}
  god-kills-rebellious-children: {label: "The creator killed his enemies and destroyed his own children because they plotted rebellion", cluster: theology}
  god-knows-the-treacherous: {label: "God knows the treacherous (crooked-hearted)", cluster: theology}
  god-knows-who-serves-him: {label: "God knows the one who acts for him", cluster: theology}
  god-punishes-temple-rebel: {label: "God attacks the one who rebels against the temple and repays him as he acts", cluster: cult}
  god-revered-in-his-image-on-processional-way: {label: "God is worshipped on his processional way in images of stone and copper, one image replacing another like a wave", cluster: cult}
  god-sails-round-to-see-them: {label: "The sun god sails round the sky to see humankind and has built a shrine around them", cluster: theology}
  increase-offerings-on-altar: {label: "Enrich the altar, increase the food offerings and the daily offering; honour god", cluster: cult}
  justify-yourself-before-god: {label: "Justify yourself (make your voice true) at the side of the god", cluster: wisdom}
  keep-peace-with-southern-rival: {label: "The king is advised to keep peace with the southern realm, renew treaties and receive its goods", cluster: kingship}
  king-builds-monument-for-god: {label: "Build a monument (temple) for the god: it keeps alive the name of him who builds it", cluster: kingship}
  king-pacifies-and-settles-frontier: {label: "The old king tells how he pacified the west and settled the eastern border with towns of choice people to repel foreigners", cluster: kingship}
  king-wise-from-the-womb: {label: "The king is wise from the moment he comes out of the womb, distinguished by god before millions", cluster: kingship}
  kingship-a-goodly-office-each-king-restores-predecessor: {label: "Kingship is a goodly office without son or brother to keep its monuments: each king must restore his predecessor's work so his own is restored after him", cluster: kingship}
  monument-is-to-be-loved: {label: "Make your monument endure through the love people bear you", cluster: wisdom}
  nile-flood-failure-not-feared: {label: "Because the revenues of the north are in the king's hand, a failure of the Nile flood will not distress him", cluster: kingship}
  no-one-without-an-enemy: {label: "There is no one who is free of an enemy", cluster: wisdom}
  no-river-can-hide-itself: {label: "No river lets itself be hidden: it breaks the dyke in which it was concealed", cluster: wisdom}
  poor-official-partial-to-bribe: {label: "The rich man is impartial in his house, but the poor man who says 'would that I had' is partial to whoever bribes him", cluster: wisdom}
  recruits-come-of-age-every-twenty-years: {label: "Every twenty years a new generation of youth comes of age to be recruited", cluster: war}
  righteous-dead-like-god-free-forever: {label: "Whoever reaches the hereafter without wrongdoing will be there like a god, striding free like the lords of eternity", cluster: afterlife}
  subdue-the-multitude: {label: "Bend the multitude and drive the heat (unrest) from it", cluster: kingship}
  the-greedy-is-a-fool: {label: "He who covets what belongs to others is a fool", cluster: wisdom}
  war-reaches-necropolis-tombs-hacked: {label: "Egypt fights even in the necropolis, hacking up the tombs", cluster: war}
  youth-against-youth-foretold-by-ancestors: {label: "Generation will attack generation, as the ancestors foretold", cluster: prophecy}
  reach-me-without-accuser: {label: "The father hopes his son will join him in the hereafter with no accuser against him", cluster: afterlife}
  kings-followers-are-gods: {label: "Whoever prospers on earth is one of them (the gods); the king's followers are gods", cluster: kingship}
  spread-love-of-yourself-among-all-people: {label: "Spread the love of yourself among all humankind; a good character is remembered after the years have passed", cluster: wisdom}
  hope-for-saviour-may-he-come-today: {label: "The ruler's descendants will call him the one who ended the time of suffering, praying 'may he come today'", cluster: kingship}
units:
  - id: ane-heavenlycow-w1-council-and-eye-sent
    tradition: ane-egyptian
    title: The aged Re, the plot of mankind, the council of the gods and the Eye sent as Hathor (Heavenly Cow, Seti I)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Egyptian"
    version: "W1, KV 17 (tomb of Seti I)"
    read: ["HeavenlyCow W1:1-15/2"]
    tags:
      - {motif: humans-plot-against-aged-sun-god, refs: ["HeavenlyCow W1:1/3", "HeavenlyCow W1:2", "HeavenlyCow W1:2/5"], note: "wn.jn r(m)ṯ.pl ḥr kꜣi̯.t md,t ... jstw r =f ḥm =f jꜣwi̯.w; the opening clause is restored in brackets"}
      - {motif: aged-god-bones-silver-flesh-gold-hair-lapis, refs: ["HeavenlyCow W1:2/2-2/4"], note: "qs.pl =f m ḥḏ, ḥꜥ,pl =f m nbw, šnj =f m ḫsbd mꜣꜥ"}
      - {motif: divine-council, refs: ["HeavenlyCow W1:3/2", "HeavenlyCow W1:6-10/2"], note: "Re summons his Eye, Shu, Tefnut, Geb, Nut, the fathers and mothers and Nun secretly, so that men may not see; they touch the ground before him and ask him to speak"}
      - {motif: humans-came-from-gods-eye, refs: ["HeavenlyCow W1:8/2"], note: "r(m)ṯ.pl ḫpr.w.pl m jr,t =j: the play rmṯ 'people' / rmj.t 'tears'"}
      - {motif: divine-decision-to-destroy, refs: ["HeavenlyCow W1:9-9/3", "HeavenlyCow W1:12/2"], note: "Re hesitates: 'I cannot kill them until I have heard what you say' (n smꜣ.n =j st r sḏm.ṱ =j); the gods advise sending the Eye"}
      - {motif: gods-eye-sent-as-slaughtering-goddess, refs: ["HeavenlyCow W1:12/2-13/2", "HeavenlyCow W1:14/2"], note: "hꜣi̯ =s m Ḥw,t-Ḥr,w; she slays the men who fled into the desert (ḫꜣs,t) and says it was sweet to her heart"}
      - {motif: destroying-goddess-wades-in-human-blood, refs: ["HeavenlyCow W1:15/2"], note: "ḫpr Sḫm,t pw ... r rhni̯.t ḥr snf =sn: etiology of Sakhmet from sḫm 'to have power over'"}
      - {motif: so-it-came-about-etiology-formula, refs: ["HeavenlyCow W1:15/2"]}
      - {motif: return-to-primeval-waters-wished, refs: ["HeavenlyCow W1:5/3"], note: "Re asks for counsel 'so that I may return to Nun, to the place where I came into being' (jwi̯ =j m Nwn r bw ḫpr.n =j jm)"}
    hints:
      - "Compare Gen 6:5-7 (God sees humankind's wickedness and decides to blot them out) and Gen 11:5-7 (the divine plural deliberation 'let us go down'); here the gods meet in council as in Gen 1:26 and 1 Kgs 22:19-22."
      - "The rebels flee into the desert: compare the mountains and the ark in Gen 7:19-23 and the son who seeks refuge on a mountain in Q 11:42-43."
      - "Compare Atrahasis and Gilgamesh XI: the gods' assembly decides on destruction, but here the means is the god's own Eye (Hathor-Sakhmet) rather than a flood."
  - id: ane-heavenlycow-w1-beer-saves-mankind
    tradition: ane-egyptian
    title: Red beer, the drunken goddess and the rescue of mankind (Heavenly Cow, Seti I)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Egyptian"
    version: "W1, KV 17 (tomb of Seti I)"
    read: ["HeavenlyCow W1:15/3-26/3"]
    tags:
      - {motif: wrath-then-mercy, refs: ["HeavenlyCow W1:20/3"], note: "having said 'do not diminish their number' (m sꜥnd.w st, W1:15), Re now says 'I shall protect men from her' (jw =j r mki̯.t r(m)ṯ.pl ḥr =s)"}
      - {motif: beer-dyed-red-to-deceive-destroyer, refs: ["HeavenlyCow W1:16-19", "HeavenlyCow W1:21/2-21/3"], note: "swift messengers fetch red ocher (ddj,t) from Elephantine; slave women grind barley for beer; 7000 jars (ḥ(n)q,t hbn,t 7000) 'like human blood'"}
      - {motif: destroyer-drunk-humanity-spared, refs: ["HeavenlyCow W1:22-23/5"], note: "the fields are flooded three palms deep; she sees her face in it, drinks, comes drunk (tḫj.tj) and 'did not recognise men' (nn sjꜣ.n =s r(m)ṯ.pl)"}
      - {motif: festival-of-intoxicating-drink-etiology, refs: ["HeavenlyCow W1:24/4-25"], note: "sḏr,t 'sleeping draught' prepared at the year's festivals by maidservants, 'from the first day'"}
      - {motif: so-it-came-about-etiology-formula, refs: ["HeavenlyCow W1:24/3", "HeavenlyCow W1:25", "HeavenlyCow W1:26/3"], note: "the 'Beautiful one of Imau' from jmꜣ,yt 'lovely'"}
    hints:
      - "Compare the end of the flood in Gen 8:21-22 (God resolves never again to destroy all living things) and Gilgamesh XI 180-196 (Ea rebukes Enlil); here the high god himself contrives to stop the destroyer he sent."
      - "The red liquid flooding the fields 'like human blood' may be compared with the water that looks like blood to Moab in 2 Kgs 3:22-23 and with Nile water turned to blood in Exod 7:17-21."
      - "Compare Q 11:44 (the earth swallows its water, the matter is decided) for the abrupt ending of a divine destruction."
  - id: ane-heavenlycow-w1-re-withdraws-to-sky
    tradition: ane-egyptian
    title: Re, weary of men, rides Nut the sky-cow; men fight; the sky, the fields of the hereafter and the stars come into being (Heavenly Cow, Seti I)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Egyptian"
    version: "W1, KV 17 (tomb of Seti I)"
    read: ["HeavenlyCow W1:27-43/2"]
    tags:
      - {motif: creator-weary-of-humankind-withdraws, refs: ["HeavenlyCow W1:27/2", "HeavenlyCow W1:28", "HeavenlyCow W1:29"], note: "jb =j wrd.w wr r wnn ḥnꜥ =sn 'my heart is too weary to be with them'; the gods beg 'do not withdraw in your weariness'"}
      - {motif: god-carried-to-sky-on-celestial-cow, refs: ["HeavenlyCow W1:30-31/3", "HeavenlyCow W1:32", "HeavenlyCow W1:38"], note: "ḫpr Nw,t [m] [jḥ,t] and ḫpr =s [p]w [m] [ḥr,t]: 'cow' and 'sky' are restorations in brackets"}
      - {motif: origin-of-slaughter-among-humans, refs: ["HeavenlyCow W1:34/2-36/2"], note: "the land is in darkness; at dawn men come out with bows and clubs; Re: 'your evil be upon you, you slaughterers'; ḫpr šꜥ,t pw m r(m)ṯ.pl"}
      - {motif: land-darkened-when-god-departs, refs: ["HeavenlyCow W1:34/2"], note: "ꜥḥꜥ.jn r =f tꜣ m kk(,w) as the god departs on the cow"}
      - {motif: afterlife-fields-named-by-god, refs: ["HeavenlyCow W1:39/3-40/3"], note: "ḥtp sḫ,t ꜥꜣ > sḫ,t-ḥtp; rjd =j sm,w > sḫ,t-jꜣr,w; grg =j st m (j)ḫ,t > the stars (wordplay jḫjḫ)"}
      - {motif: supporters-hold-up-the-sky, refs: ["HeavenlyCow W1:40/4-42/3"], note: "Nut trembles at the height; Re creates the Heh-gods to support her and sets Shu beneath her"}
      - {motif: so-it-came-about-etiology-formula, refs: ["HeavenlyCow W1:39/4", "HeavenlyCow W1:40", "HeavenlyCow W1:41/3", "HeavenlyCow W1:43-43/2"], note: "also the custom of giving a nurse to son and daughter and of a father lifting his son over his head"}
      - {motif: firmament-divides-waters, refs: ["HeavenlyCow W1:38", "HeavenlyCow W1:42/3"], note: "interpretive: Nut lifted over Shu separates sky from earth; there is no division of waters here"}
    hints:
      - "Compare Gen 6:3 and 6:6 (God's spirit will not remain with man; God is grieved in his heart) for the creator's weariness with humankind; and Gen 11:8-9 for divine withdrawal after human revolt."
      - "Origin of violence among men after the divine withdrawal: compare Gen 4:8 and Gen 6:11-13 (the earth filled with violence, ḥamas) and Q 2:30 (the angels: will you place there one who sheds blood?)."
      - "Compare Ps 104:2-3 and Isa 40:22 (the heavens spread like a tent), and Job 26:7, 11 (the pillars of heaven tremble) for the supported, trembling sky."
      - "Compare the Field of Reeds with Eden (Gen 2:8-9) and the gardens of Q 47:15."
  - id: ane-heavenlycow-w1-cow-image-captions
    tradition: ane-egyptian
    title: Instructions for drawing the sky-cow with Shu, the Heh-gods and the barques, and its captions (Heavenly Cow, Seti I)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Egyptian"
    version: "W1, KV 17 (tomb of Seti I)"
    read: ["HeavenlyCow W1:44-55/2"]
    tags:
      - {motif: supporters-hold-up-the-sky, refs: ["HeavenlyCow W1:44", "HeavenlyCow W1:45/4-46/3"], note: "the cow with Heh-gods at her breast and back; Shu beneath her belly, his arms bearing the stars, his name written beside him"}
      - {motif: sun-barque-crosses-sky, refs: ["HeavenlyCow W1:47-47/2"], note: "a barque with steering-oar and shrine, sun-disc above, Re standing in it, beside Shu's hand"}
      - {motif: deity-says-i-am-who-i-am, refs: ["HeavenlyCow W1:49-49/2"], note: "caption written in descending direction beside the cow's leg: jw =j jm =j / nn ḏi̯ =j jri̯ 'I am (who) I am; I will not let (anyone) act'; TLA's rendering of a difficult phrase"}
      - {motif: stars-on-body-of-sky-goddess, refs: ["HeavenlyCow W1:45/2"], note: "psḏ,t sbꜣ ḥr ẖ,t =st 'the star-ennead on her belly'"}
      - {motif: god-never-tires, refs: ["HeavenlyCow W1:49/5", "HeavenlyCow W1:50/3", "HeavenlyCow W1:52"], note: "captions 'you will not grow weary, my son', 'your state is like one who lives for ever'; against Re's own weariness in W1:27-29"}
    hints:
      - "The caption jw =j jm =j invites comparison with Exod 3:14 ('ehyeh asher ehyeh') and with Q 20:14 ('I am God, there is no god but me'); the Egyptian sense is uncertain."
      - "'You will not grow weary' compares with Isa 40:28 (the Creator does not faint or grow weary) and Ps 121:4 (he who keeps Israel does not sleep); Q 2:255 (neither slumber nor sleep overtakes him)."
      - "Compare Job 9:9 and 38:31-33 for the constellations set in the sky."
  - id: ane-heavenlycow-w1-geb-serpents
    tradition: ane-egyptian
    title: Re charges Geb with the serpents of the earth and hands them to Osiris (Heavenly Cow, Seti I)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Egyptian"
    version: "W1, KV 17 (tomb of Seti I)"
    read: ["HeavenlyCow W1:56-61/2"]
    tags:
      - {motif: serpents-of-earth-put-under-guard, refs: ["HeavenlyCow W1:56/7-57/4", "HeavenlyCow W1:61"], note: "Geb is to beware of 'your serpents that are in you', go to Nun and write a document to the serpents of every mound; Re hands them to 'your son Osiris'"}
      - {motif: written-warning-to-serpents, refs: ["HeavenlyCow W1:57/4-58/2"], note: "'Beware of playing with anything! They shall know that I am here'"}
      - {motif: magicians-who-know-spells, refs: ["HeavenlyCow W1:59/3-60/2"], note: "'beware of the magicians who know their spells; the god Heka himself is there'"}
    hints:
      - "Compare Gen 3:14-15 (the serpent cursed to the dust, enmity set) and Num 21:6-9; for snake-charming and spells against snakes compare Ps 58:5-6 and Jer 8:17."
  - id: ane-heavenlycow-w1-thoth-deputy
    tradition: ane-egyptian
    title: Thoth made Re's deputy; the ibis, the moon and the baboon of Thoth (Heavenly Cow, Seti I)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Egyptian"
    version: "W1, KV 17 (tomb of Seti I)"
    read: ["HeavenlyCow W1:62-74/2"]
    tags:
      - {motif: moon-god-appointed-deputy-of-sun, refs: ["HeavenlyCow W1:63", "HeavenlyCow W1:71-71/2", "HeavenlyCow W1:72/2-73", "HeavenlyCow W1:73/4"], note: "jw =k m s,t =j 〈m〉 s,tj ... Ḏḥw,tj s,tj Rꜥ; 'I will let you encircle the two heavens with your beauty': ḫpr jꜥḥ pw n Ḏḥw,tj"}
      - {motif: luminaries-rule-day-night, refs: ["HeavenlyCow W1:63", "HeavenlyCow W1:72/2-73"], note: "Re stays in the sky to bring light to the underworld while Thoth (the moon) lights the night"}
      - {motif: rebels-in-the-earth-quelled, refs: ["HeavenlyCow W1:67/2"], note: "Thoth is to subdue 'those we created who made rebellion', the earth-gods following 'Discontented-of-heart' (špt-jb)"}
      - {motif: so-it-came-about-etiology-formula, refs: ["HeavenlyCow W1:71/4", "HeavenlyCow W1:72", "HeavenlyCow W1:73", "HeavenlyCow W1:73/3"], note: "hbj-ibis from hꜣb 'send', tḫnj-ibis from dwn 'stretch out', ꜥnꜥn-baboon from ꜥnꜥn 'drive back'"}
      - {motif: vizier-of-the-god, refs: ["HeavenlyCow W1:73/4-74/2"], note: "'you who have become vizier (ṯꜣ,tj)'; all creatures thank Thoth"}
    hints:
      - "Compare Gen 1:16-18 (the lesser light to rule the night) and Ps 104:19; Q 10:5 (God made the sun a radiance and the moon a light); Q 36:39-40."
      - "A god's deputy who acts in his place: compare Exod 7:1 (Moses 'as God' to Pharaoh, Aaron his prophet)."
  - id: ane-heavenlycow-w1-purity-and-benefits
    tradition: ane-egyptian
    title: Purity rules for reciting the book and the blessings of the reciter (Heavenly Cow, Seti I)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Egyptian"
    version: "W1, KV 17 (tomb of Seti I)"
    read: ["HeavenlyCow W1:74/3-84/2"]
    tags:
      - {motif: ritual-purity-for-reciting-sacred-text, refs: ["HeavenlyCow W1:74/3-77", "HeavenlyCow W1:78/2-79"], note: "anointed with ben-oil, censer on arm, behind the ears cleaned, natron in the mouth, two new linen garments, washed in floodwater, white sandals, Maat drawn on his tongue in green ink; nine-day purification (wꜥb 9 hrw.pl), also for human servants"}
      - {motif: rubric-spell-recited-in-purity, refs: ["HeavenlyCow W1:74/3-77"]}
      - {motif: reciter-blessed-with-long-life-and-prosperity, refs: ["HeavenlyCow W1:80-83/2"], note: "his eyes and limbs serve him, his affairs do not fail, people say 'he is like Re on the day of his birth', his goods do not shrink"}
      - {motif: proven-a-million-times-formula, refs: ["HeavenlyCow W1:84"], note: "šs-mꜣꜥ ḥḥ n sp"}
    hints:
