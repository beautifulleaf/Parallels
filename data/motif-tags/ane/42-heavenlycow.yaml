      - {motif: god-punishes-temple-rebel, refs: ["Merikare W2:x+3_6-W2:x+3_7/2"]}
      - {motif: king-confesses-own-wrongdoing, refs: ["Merikare W2:x+4_3/2-W2:x+4_5/2"], note: "variant x+4_4 ḫpr.n n-js m jri̯.t.n =j 'it did not happen through what I did' - a negation where W1 has js 'indeed'"}
      - {motif: sacrifice-of-wicked-abomination, refs: ["Merikare W2:x+5_1"]}
      - {motif: creator-made-world-for-humans-sake, refs: ["Merikare W2:x+5_4-W2:x+5_5/2"]}
      - {motif: creator-drove-off-greed-of-water, refs: ["Merikare W2:x+5_4/2"], note: "variant: dr.n =f n =sn snk n(,j) mw 'he drove off for them the greed of the water'"}
