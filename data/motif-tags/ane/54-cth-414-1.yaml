# Full read, chunk 54: CTH 414.1 - Kuntillet Ajrud. Hittite rituals read from hethiter.net / TLHdig; Northwest Semitic inscriptions after the published editions.
new_motifs:
  house-plastered-with-long-years-and-awe: {label: "Building words: plaster the new house inside with long years and the good, and outside with awe and lordship", cluster: building}
  king-addresses-throne-goddess-as-companion: {label: "The king speaks to the throne (the throne-goddess Halmasuit) as his companion and asks her to hand over the mountain's timber", cluster: kingship}
  throne-brought-kingship-from-sea: {label: "The throne-goddess brought the king rulership and the chariot from the sea, and he was named Labarna", cluster: kingship}
  sun-and-storm-god-entrust-land-to-king: {label: "The Sun god and the Storm god have handed over (maniyaḫḫ-) the land and the king's house to the king", cluster: kingship}
  trees-grown-under-heaven-claimed-for-palace: {label: "Trees that grew under heaven, under which the lion and leopard slept and cattle and sheep grazed, are claimed from the storm god and felled for the palace", cluster: building}
  timbers-asked-to-reveal-hidden-evil: {label: "The felled timbers are told to reveal what is in their heart, whether grief, evil, curse or illness, and sweep it out", cluster: ritual}
  eagle-sent-to-spy-out: {label: "In a ritual a speaker sends the eagle out to spy and report who is in the green forest", cluster: ritual}
  netherworld-goddesses-spin-kings-years: {label: "Ancient netherworld goddesses (Išduštaya and Papaya) kneel with distaff and full spindles and spin the king's years", cluster: fate}
  kings-years-without-limit: {label: "The gods give the king many years, and his years have no shortness or limit", cluster: kingship}
  litany-take-away-ills-from-king: {label: "Litany 'take from him': illness, fear, headache, the evil words of men, revenge, knee and heart illness are taken from the king", cluster: ritual}
  mountains-told-to-stay-in-place: {label: "Named mountains are told to stay in their place and not drive away the great one", cluster: cosmology}
  gods-rejuvenate-king: {label: "The gods take away the king's old age and give him back youth and fighting strength", cluster: kingship}
  king-made-of-tin-and-iron-eagle-eyes-lion-teeth: {label: "The gods make the king a figure of tin with a head of iron, eagle's eyes and lion's teeth", cluster: kingship}
  kings-soul-intertwined-with-heart: {label: "Lion's and leopard's paws are braided into one so that the king's soul be intertwined with his heart", cluster: ritual}
  gods-assembled-on-mountain-rejoice-in-king: {label: "All the gods are gathered on the mountain and rejoice in the king and esteem him", cluster: kingship}
  grain-crushed-so-may-kings-foe-be-crushed: {label: "Grain is poured out and crushed: may the gods give over to evil and crush whoever plans evil against the king", cluster: ritual}
  building-works-provisioned-with-sacrifice: {label: "Each stage of building (felling timber, laying foundation stones, plastering, setting the hearth) is provisioned from the palace with bulls, sheep, wine and loaves and sacrifices to the gods", cluster: building}
  gods-set-up-hearth: {label: "The gods set up the hearth, sprinkle it with copper beads, wipe it with iron and sit on it", cluster: cult}
  hearth-says-this-is-good-for-me: {label: "As the household sits at the new hearth (king, queen, daughters, brothers), the hearth says 'This is good for me'", cluster: cult}
  vine-roots-below-shoots-above-blessing: {label: "Analogy: as the vine sends roots downward and shoots upward, so may the king and queen", cluster: ritual}
  evergreen-tree-blessing-king-flourish: {label: "Analogy: as the evergreen tree is always flourishing and does not shed its leaves, so may the king and queen flourish and their word endure", cluster: ritual}
  descendants-many-at-hearth: {label: "Wish that sons, daughters, grandchildren and great-grandchildren become numerous", cluster: blessing}
  ritual-place-fed-and-told-admit-no-other-god: {label: "The ritual place (pedan) is given food and drink and told: eat, drink, rejoice; let no other god and no evil sign enter; watch over the god you are assigned to", cluster: building}
  no-god-invoked-aloud: {label: "During the rite no deity is invoked aloud by the mouth", cluster: cult}
  foundation-filled-with-seeds-metals-stones: {label: "The foundations are filled with every seed and fruit, oil, butter, honey, salt, silver, gold, precious stones and glass", cluster: building}
  bronze-statues-and-winged-bull-at-foundation-corners: {label: "Bronze statues of the house-building goddess (NIN.É.MU.UN.DÙ) are set at each corner of the foundation and a winged bronze bull at the place of the pillars", cluster: building}
  ear-shaped-breads-put-in-statues-ears: {label: "Breads shaped like ears are put into the ears of the bronze foundation statues and the bronze bull", cluster: building}
  impure-remains-taken-by-officiant: {label: "Meat and bread that are not pure are taken by the officiant for himself", cluster: cult}
  iron-tongues-in-mouths-of-king-and-queen: {label: "Tongues of iron are put in the mouths of king and queen and the 'tongues' (slanders) of the population are taken from them", cluster: ritual}
  king-and-queen-spit-on-substitute: {label: "King and queen spit three times on a clay figurine, an ox, or a clay army that carries off their evil", cluster: ritual}
  bloody-eyed-goddesses-holding-heads: {label: "Wooden Ḫantašepa deities with blood-stained eyes and blood-red garments hold human heads and spears", cluster: ritual}
  ritual-objects-buried-and-nailed-down: {label: "The carrier figurines and cups are buried in the earth and nailed down so that the evil may not come back up", cluster: ritual}
  enemy-to-carry-away-evil: {label: "Wish that the enemy (the enemy land) carry away the evil removed from the royal couple", cluster: ritual}
  eagle-released-to-sky-as-messenger: {label: "An eagle waved over the royal couple is released to the sky and told to tell the Sun goddess and Storm god that king and queen should be eternal", cluster: ritual}
  as-gods-eternal-so-king: {label: "Analogy: as the Sun goddess and the Storm god, heaven and earth, are eternal, so may king, queen and children be eternal", cluster: kingship}
  not-i-but-the-king-released-it: {label: "The ritual expert disclaims the act: 'Not I released it; the king and queen released it'", cluster: ritual}
  coloured-threads-tied-and-cut-from-fingers: {label: "Threads of five colours are hung on a tree and tied to the fingers of king and queen, then cut with a thorn bush to remove pain and constraint", cluster: ritual}
  goat-with-breads-on-horns-driven-away: {label: "A billy-goat with breads hung on its horns is driven away after the royal couple's evil is taken", cluster: ritual}
  hidden-birds-released-startle-king: {label: "The expert secretly holds two birds and releases them toward a branch; king and queen are startled and he cries 'I have taken your pain'", cluster: ritual}
  spittle-sealed-in-cup-with-lead-lid: {label: "King and queen spit into a clay cup which is closed with a lid of lead", cluster: ritual}
  expert-goes-to-house-of-children-only-when-told: {label: "The ritual expert goes to the house of the (royal) children only when king and queen tell him; once he used to go, now he no longer does", cluster: ritual}
  omen-observed-in-blood-cup-and-hearth: {label: "At dawn the expert and the physician inspect the blood-filled cup and the hearth and report whatever sign appears to king and queen", cluster: divination}
  pain-taken-from-throne-bed-heart: {label: "Pain, woe and constraint are taken from the royal couple's throne, bed, heart and limbs and handed to the Sun of heaven and Sun of the earth", cluster: ritual}
  figurines-inscribed-with-enemys-name: {label: "Ritual experts make figurines (of cedar and of clay) and put on them the name of the king's enemy", cluster: ritual}
  gods-consulted-before-building: {label: "Before a palace is built the Sun god and the Storm god are consulted (by oracle) about it", cluster: building}
  king-pours-tin-and-iron-into-heart: {label: "The king Labarna comes and pours tin and iron into the heart of the timbers (to make them firm)", cluster: ritual}
  throne-told-to-protect-mountain: {label: "The king and throne-goddess go to the mountain together, eat zapzaki, and the throne is told to protect the mountain", cluster: kingship}
  neighbours-keep-to-own-house: {label: "Mutual avoidance formula: 'Do not come into my house, and I will not come into yours'", cluster: ritual}
  king-praises-storm-god-as-father: {label: "The king praises the Storm god as 'my father'", cluster: kingship}
  weaving-women-appease-king: {label: "Skilled weaving women and weavers receive figs and raisins and are told to appease the king, his eyes, and take his ills away", cluster: ritual}
  foundation-deposit-under-hearth: {label: "Fat, honey, cheese, white and black wool, malt, nuts, raisins, salt and sprigs are laid under the new hearth", cluster: building}
  replicas-handled-in-royal-ritual: {label: "Replicas or effigies (ḫimma-) are handled in a royal ritual and someone bows", cluster: ritual}
  women-singers-in-cult: {label: "Groups of cultic women (zintuḫi-women) sit to right and left in a festival", cluster: cult}
  lambs-presented-to-king-and-queen: {label: "Lambs are brought out of the capital and one handed to the king and one to the queen", cluster: cult}
  silver-and-gold-placed-in-pit: {label: "Silver and gold are put into the ritual pit or vessel at the site of a building", cluster: building}
  libation-poured-three-times: {label: "The officiant libates three times before pouring oil or speaking", cluster: cult}
  drinking-to-altar-throne-table-hearth: {label: "The officiant 'drinks' (toasts) the altar, the place, the throne, the offering table, the censer and the brazier", cluster: cult}
  offerings-quench-thirst-of-place: {label: "The ritual place is told it has received offerings of command and has had its thirst quenched and been anointed with oil", cluster: building}
  offering-table-for-ea-at-pillar: {label: "A wooden offering table for Ea is set before the central pillar with bread, cedar and libations", cluster: building}
  statues-smeared-with-sacrificial-blood: {label: "A sheep is sacrificed and its blood smeared on the statues (and other ritual objects)", cluster: cult}
  drinking-the-god-seated: {label: "The officiant, seated, 'drinks' named gods a set number of times, breaking a bread for each", cluster: cult}
  statues-become-gods-of-place: {label: "The deposited statues become the gods of the building (or place)", cluster: building}
  foundation-laid-on-levelled-ground: {label: "The site is levelled and the foundation stones are poured", cluster: building}
  iron-and-copper-heaven-in-basin: {label: "A basin holds a 'heaven' of iron and one of copper with nine nails", cluster: ritual}
  drink-called-blood: {label: "Clay cups filled with a liquid (tarlipa-) are carried in and called 'blood'", cluster: ritual}
  clay-army-on-bread-carries-evil: {label: "A clay army set on a bread, with a bronze dagger on it, is waved over or spat on by the royal couple and then buried", cluster: ritual}
  plea-for-mercy-to-gods-after-removal: {label: "After removing the royal couple's evil the expert sacrifices and asks the gods for mercy and protection", cluster: ritual}
  ritual-meal-after-rite: {label: "The participants eat and drink at the end of the rite", cluster: cult}
  eagle-as-substitute-for-royal-couple: {label: "An eagle is presented to the Sun goddess and Storm god (as the royal couple's substitute) while king and queen hold sickle and millstone", cluster: ritual}
  cups-for-throne-and-hearth: {label: "Cups are given to the king, the queen, the throne and the hearth", cluster: cult}
  spears-clashed-three-times: {label: "Two palace attendants clash bronze spears together three times", cluster: ritual}
  figurine-told-to-take-pain: {label: "The expert tells the clay figurine to take the pain, woe and constraint of king and queen", cluster: ritual}
  deaf-man-assists-ritual: {label: "A deaf man assists the ritual expert", cluster: ritual}
  barley-and-wheat-heads-tied-at-feet: {label: "Bound heads of barley and wheat are set in a covered basket over the royal heads and at their feet, so that no one sees", cluster: ritual}
  women-ritual-experts-named: {label: "A ritual is attributed to named women experts who speak in the first person", cluster: ritual}
  silver-sun-discs-in-ritual: {label: "Silver sun discs are used in a ritual against enemies", cluster: ritual}
  gods-reproach-oath-breakers: {label: "Speakers address those who keep breaking the oaths and announce they will go against the enemy troops", cluster: treaty}
  rite-performed-in-enemy-field: {label: "Ritual actions are performed in the enemy's cultivated field", cluster: ritual}
  substitutes-released-on-second-day: {label: "Substitutes for the royal couple are prepared on the first day and released on the second", cluster: ritual}
  animals-burnt-at-untouched-place: {label: "Piglet, sheep, donkey and puppy are burnt on wooden hearths at an untouched place, and the remnant buried there", cluster: ritual}
  royal-couple-washes-in-tent: {label: "After the treatment king and queen wash themselves in a tent", cluster: purity}
  passage-through-hawthorn-gates: {label: "King and queen pass through two gates made of hawthorn, with cloth stretched beneath, breads and burning logs on either side", cluster: ritual}
  offerings-thrown-into-pit-of-sun-goddess-of-earth: {label: "A sheep and a goat and the substitute's implements are thrown down into the pit-storehouse of the Sun goddess of the earth and the male gods", cluster: underworld}
  netherworld-queen-compensated: {label: "The netherworld queen (Ereškigal, Sun goddess of the earth) is told: 'Be compensated!'", cluster: underworld}
  ritual-expert-keeps-materials: {label: "The ritual expert (Old Woman) takes the coloured cloths and the table for herself", cluster: ritual}
  omen-from-ritual-fire: {label: "The ritual expert reads the burning-down of the fire on the hearths as a favourable or unfavourable sign", cluster: divination}
  hearth-nailed-round-with-bronze-nails: {label: "The hearth where the fire burns is fastened all round with nine bronze nails", cluster: ritual}
  arrows-turned-point-down-against-enemy: {label: "Arrows are drawn and let down point first into a jar: as they fall, may the gods throw the foreigner who plots evil against the king on his face", cluster: ritual}
  bronze-fox-in-ritual: {label: "A fox of bronze is placed in front of something in a ritual", cluster: ritual}
  names-taken-by-ritual-expert: {label: "The ritual expert takes the names (written or spoken) in the rite", cluster: ritual}
  physician-ritual-for-plague-year: {label: "A named physician's ritual for a bad year when people keep dying in the land", cluster: ritual}
  offerings-hung-on-pegs-in-gate: {label: "Offerings (kelu-) of lion-skin cap, stones and bear part, breads and wine are hung on pegs of medlar and cornel driven into the gate", cluster: ritual}
  healing-herb-buried-at-gate: {label: "A named healing herb is buried on both sides in front of the gate", cluster: ritual}
  weapons-laid-on-table-for-plague-gods: {label: "Bronze axes, a dagger, a strung bow and an arrow are laid on a table for the plague gods", cluster: ritual}
  armed-plague-demons-in-blood-red-garments: {label: "The plague god Šanta comes with the Innarawanteš demons who wear blood-red clothes and mountain-dwellers' cloaks, girt with daggers, bows strung and arrows in hand", cluster: demons}
  oath-with-demons-by-shared-raw-liver-and-one-straw: {label: "The householder swears an oath with the plague god and his demons by biting the same raw liver and drinking from one straw", cluster: treaty}
  demons-told-not-to-enter-my-door: {label: "The plague god and demons are told: 'You shall no longer step into my door'", cluster: demons}
  goat-blood-smeared-on-straw: {label: "A goat is dedicated with wine, slaughtered, and its blood smeared on the drinking straw", cluster: ritual}
  gods-as-witnesses-of-oath: {label: "The gods are called on: 'Be witnesses of this oath!'", cluster: treaty}
  boy-in-goatskin-howls-like-wolf: {label: "Eight boys who have not yet gone to a woman are brought; one dressed in a goatskin goes ahead howling like a wolf", cluster: ritual}
  luwian-incantation-in-gate: {label: "The householder steps into the gate with a staff and incants in Luwian to King Šanta and the blood-clad gods", cluster: ritual}
  demons-told-eat-cattle-not-humans: {label: "The plague demons are told: eat sheep and cattle, but do not eat a human being", cluster: demons}
  father-gods-and-ea-fed-in-houses: {label: "The great Sun god, the father-gods and Ea are invited to feed in the houses", cluster: ritual}
  door-anointed-evil-out-good-in: {label: "The door is shut and anointed with fine oil: 'May it lock the evil out and keep the good inside'", cluster: ritual}
units:
  - id: ane-cth-414-1-1-plaster-long-years
    tradition: ane-hittite
    title: Palace-building ritual opens - plaster long years inside, awe outside (CTH 414.1 §1-2)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Hittite"
    read: ["CTH 414.1 §1:1-§2:10"]
    tags:
      - {motif: house-plastered-with-long-years-and-awe, refs: ["CTH 414.1 §2:6-10"], note: "MU.KAM{ḪI.A} GÍD.DA [ḫa-a-ni-iš]; na-aḫ-ša-ra-at-ta-an ḫa-a-ni-iš; restored in part from §39-40"}
      - {motif: gods-consulted-before-building, refs: ["CTH 414.1 §1:4-5"], note: "partly restored: [ku-it É.GA]L! ú-e-da-a-ši ... {D}]IM-an-na a-a-ra-i-e-er, 'concerning the palace you build they asked the Sun god and the Storm god'"}
    hints:
      - "Building as a sacred act sanctioned by God: compare Q 2:127 (Abraham and Ishmael raise the House's foundations, praying 'accept it from us') and Q 9:108-109 (a building founded on piety versus one on a crumbling bank); HB Ps 127:1 ('unless YHWH builds the house')."

  - id: ane-cth-414-1-3-king-throne-timber
    tradition: ane-hittite
    title: The king, the throne-goddess and the mountain's trees (CTH 414.1 §3-14)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Hittite"
    read: ["CTH 414.1 §3:11-§14:65"]
    tags:
      - {motif: king-addresses-throne-goddess-as-companion, refs: ["CTH 414.1 §3:11-16", "CTH 414.1 §10:41-§11:47"], note: "{GIŠ}DAG-ti te-ez-zi; a-ra-aš-mi-iš a-ra-a-aš-mi-<iš> e-eš 'be my companion'; the throne answers kar-aš-ša-at-kán kar-aš 'fell it, fell!'"}
      - {motif: throne-brought-kingship-from-sea, refs: ["CTH 414.1 §7:27-29"], note: "{GIŠ}DAG-iz a-ru-na-za ú-da-aš ... la-ba-ar-na-an ḫal-zi-i-e-er (the line is Hattic-flavoured; the translation 'Halmasuit' interprets DAG)"}
      - {motif: sun-and-storm-god-entrust-land-to-king, refs: ["CTH 414.1 §5:21-22", "CTH 414.1 §11:47", "CTH 414.1 §12:49"], note: "{D}UTU-uš {D}IM-aš-ša ud-ne-e É-ir-mi-it-ta ma-ni-ya-aḫ-ḫi-ir"}
      - {motif: kings-years-without-limit, refs: ["CTH 414.1 §6:25-26"], note: "me-ek-ku-uš MU.KAM{ḪI.A}-uš ... ku-ut-re-eš-me-et NU.GÁL"}
      - {motif: trees-grown-under-heaven-claimed-for-palace, refs: ["CTH 414.1 §8:31-§10:40"], note: "UR.MAḪ-aš kat-ta-an še-eš-ki-it, UG.TUR ... ḫar-tág-ga-aš (bear) climbed you; the storm god 'put evil to you'"}
      - {motif: timbers-asked-to-reveal-hidden-evil, refs: ["CTH 414.1 §13:53-§14:63"], note: "ku-it-ma-aš-<ma-aš>-kán kar-di-eš-mi! an-da na-at uš-ši-it-tén; ḫur-ta-aš 'curse'; illness of the Sun god"}
      - {motif: king-pours-tin-and-iron-into-heart, refs: ["CTH 414.1 §14:64-65"], note: "kar-di-iš-mi AN.NA AN.BAR-ya; the verb is broken"}
      - {motif: throne-told-to-protect-mountain, refs: ["CTH 414.1 §4:17-20"], note: "loose: the throne is told zi-ik ḪUR.SAG-an-da-an pa-aḫ-ḫa-aš-ša-nu-ut 'protect the mountain'"}
      - {motif: neighbours-keep-to-own-house, refs: ["CTH 414.1 §5:23-24"], note: "zi-ik am-me-el É-na le-e ú-wa-ši ú-ga tu-e-el pár-na Ú-UL ú-wa-a-mi"}
      - {motif: king-praises-storm-god-as-father, refs: ["CTH 414.1 §8:30"], note: "ad-da-aš-ma-an {D}U-an wa-al-lu-uš-ki-mi"}
    hints:
      - "Kingship and land handed over by the gods: compare Q 3:26 ('You give kingship to whom You will') and Q 2:247 (God gives Saul kingship); HB 1 Kgs 3:7."
      - "Timber cut from the mountain for the royal house: compare 1 Kgs 5:6-10 (cedars of Lebanon for Solomon's temple and palace) and Q 34:12-13 (the jinn build for Solomon)."
      - "The throne as speaking companion of the king: contrast Q 27:38-42 (the queen's throne brought to Solomon) and Q 38:34 (a body cast on Solomon's throne)."

  - id: ane-cth-414-1-15-eagle-spinners-renewal
    tradition: ane-hittite
    title: The eagle sees the fate goddesses spinning the king's years; the king renewed (CTH 414.1 §15-33)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Hittite"
    read: ["CTH 414.1 §15:66-§33:155"]
    tags:
      - {motif: eagle-sent-to-spy-out, refs: ["CTH 414.1 §15:66-71", "CTH 414.1 §16:72-73", "CTH 414.1 §26:122-125"], note: "{GIŠ}DAG-iz TI₈{MUŠEN}-an ḫal-za-a-i ... ú-li-li-ya {GIŠ}TIR-na šu-ú-wa-ya 'spy into the green forest'"}
      - {motif: netherworld-goddesses-spin-kings-years, refs: ["CTH 414.1 §16:74-§18:81"], note: "{D}Iš-du-uš-ta-ya-aš {D}Pa-pa-ya-aš kat-te-er-re-eš ka-ru-ú-e-li-e-eš DINGIR{MEŠ} ... {GIŠ}ḫu-u-la-li ḫar-zi ... LUGAL-wa-aš MU.KAM{ḪI.A}-uš ma-al-ki-ya-an-zi"}
      - {motif: kings-years-without-limit, refs: ["CTH 414.1 §18:81", "CTH 414.1 §32:150"], note: "the number of the years 'is not visible' (Ú-UL du-uq-qa-a-ri); ku-ut-ri-iš Ú-UL i-e-er"}
      - {motif: litany-take-away-ills-from-king, refs: ["CTH 414.1 §20:89-§21:98", "CTH 414.1 §24:112-§25:119"], note: "an-tu-uḫ-ša-aš i-da-a-lu INIM{MEŠ}-ar da-at-tén 'take the evil words of man'"}
      - {motif: mountains-told-to-stay-in-place, refs: ["CTH 414.1 §22:99-§23:107"], note: "ti-i-ya šal-li-iš MUL-aš 'step forth, great star!'; Pentaya, Harga, Tutḫaliya, Šituwani, Piškurunuwa: pé-e-di-it-ti e-eš"}
      - {motif: gods-rejuvenate-king, refs: ["CTH 414.1 §25:119-121", "CTH 414.1 §32:148-149"], note: "mi-ḫu-un-ta-tar-še-kán da-a-aš; ma-ya-ta-tar-ma-aš-ši EGIR-pa pa-iš; na-an da-a-an ma-ya-an-da-aḫ-ḫi-ir"}
      - {motif: kings-soul-intertwined-with-heart, refs: ["CTH 414.1 §27:126-§28:131"], note: "LUGAL-wa-aš ZI-aš kar-di-iš-ši-ya ta-ru-up-ta-ru"}
      - {motif: sun-and-storm-god-entrust-land-to-king, refs: ["CTH 414.1 §29:132-136"], note: "ták-šu-li-ši-it da-an-du 'may they make a pact (takšul) with the king'; they renewed his years and awe (ne-wa-aḫ-ḫi-ir)"}
      - {motif: king-made-of-tin-and-iron-eagle-eyes-lion-teeth, refs: ["CTH 414.1 §30:137-140"], note: "ALAM-iš-ši AN.NA-aš i-e-er, SAG.DU-ZU AN.BAR-aš, ša-a-ku-wa-aš-ši TI₈{MUŠEN}-aš, ZU₉{ḪI.A} UR.MAḪ-aš"}
      - {motif: gods-assembled-on-mountain-rejoice-in-king, refs: ["CTH 414.1 §31:141-147"], note: "Telipinu brings wine '9 sevenfold'; DINGIR{MEŠ} ḫu-u-ma-an-te-eš ḪUR.SAG-i ta-ru-up-pa-an-te-eš"}
      - {motif: grain-crushed-so-may-kings-foe-be-crushed, refs: ["CTH 414.1 §33:151-155"], note: "ku-iš LUGAL-i i-da-a-lu ša-an-ḫa-az-zi ... pa-ak-ku-uš-kán-du"}
      - {motif: weaving-women-appease-king, refs: ["CTH 414.1 §20:84-89"], note: "{MUNUS.MEŠ}UŠ.BAR ... figs, raisins set before them; LUGAL-un-wa li-li-iš-ki-it-tén 'appease the king'"}
    hints:
      - "Goddesses spinning the length of a life: compare the Greek Moirai; in the Quran the term (ajal) of each life is fixed by God alone and written: Q 35:11 ('no one is given long life or has his life shortened but it is in a Book'), Q 7:34, Q 3:145."
      - "Old age removed, youth restored: contrast Q 36:68 ('whom We give long life We reverse in creation') and Q 16:70, 22:5 (returned to the most decrepit age); HB Ps 103:5 ('your youth renewed like the eagle')."
      - "Mountains told to stay in place: compare the Quranic mountains as pegs that keep the earth from shaking, Q 16:15, 21:31, 78:7."
      - "Gods assembled on the mountain rejoicing in the king: contrast the Quranic denial of a divine council, Q 21:22, 23:91."

