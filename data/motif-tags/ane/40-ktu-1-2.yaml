# Full read of the ANE corpus, chunk 40: KTU 1.14 ... AtenHymn (in the order of `aneread.py texts 40`).
# Ugaritic: Kirta (1.14-1.16), Aqhat (1.17-1.19), Shahar and Shalim (1.23), Nikkal (1.24), Horon and the snakes (1.100), read from EUPT
# consonantal text with its German translation per colon. Egyptian: Instruction of Amenemope (six witnesses) and the Great Hymn to the Aten, from TLA.
new_motifs:
  king-loses-all-wives-and-heirs: {label: "The king's house is ruined: his wives die one after another (in health, in sickness, by plague, by the sea, by the weapon) and all his heirs perish", cluster: kingship}
  seven-brothers-eight-sons-of-one-mother: {label: "A man had seven brothers, eight sons of one mother (graded number), all of whom are lost", cluster: family}
  plague-god-resheph-carries-off-family: {label: "The plague god Resheph (Rašpu) gathers in or snatches away members of a family", cluster: underworld}
  sea-takes-a-wife: {label: "The Sea (Yammu) or its lads carry off a man's wife", cluster: myth}
  tears-like-shekels-to-ground: {label: "Tears fall to the ground like shekels (or fractions of shekels), onto the bed", cluster: mourning}
  mourner-weeps-in-inner-chamber: {label: "The grieving man goes into his inner chamber to weep", cluster: mourning}
  weeper-falls-asleep-and-dreams: {label: "The weeping man falls asleep in his tears and slumber overcomes him, opening onto a divine dream", cluster: revelation}
  father-of-mankind-el: {label: "The high god El is called 'Father of Mankind' (ab adm)", cluster: theology}
  god-asks-why-petitioner-weeps: {label: "The god appearing to the grieving man asks why he weeps and what he desires", cluster: revelation}
  king-called-gracious-lad-of-el: {label: "The human king is called 'the gracious lad of El' (nʿmn ġlm il) and 'the servant of El'", cluster: kingship}
  hero-refuses-wealth-asks-for-offspring: {label: "Offered (or thinking of) silver, gold, slaves and horses, the hero wants none of them, only sons and offspring", cluster: family}
  ritual-washing-and-rouging-before-sacrifice: {label: "Before sacrificing the worshipper washes his hands to the elbow, his fingers to the shoulder, and reddens (rouges) himself", cluster: cult}
  offering-of-lamb-bird-wine-and-honey: {label: "An offering of a sacrificial lamb and a bird, wine poured in a silver cup and honey in a gold cup", cluster: cult}
  sacrifice-on-tower-roof-hands-to-heaven: {label: "The king climbs to the top of the tower or roof, lifts his hands to heaven and sacrifices to the high god", cluster: cult}
  army-numberless-like-storm-and-autumn-rain: {label: "A huge army (three million, numberless) marches by thousands like a storm, by myriads like the early rain", cluster: war}
  total-levy-widow-sick-blind-newlywed: {label: "A total levy: even the only son shuts his house, the widow hires a substitute, the sick carries his bed, the blind gropes along, the new bridegroom gives his bride to another", cluster: war}
  army-settles-on-land-like-locusts: {label: "The marching army settles on the field like locusts, like grasshoppers on the edge of the steppe", cluster: war}
  seven-day-march-formula: {label: "Journey formula counting day by day (a day, a second, a third ... at sunrise on the seventh) until arrival", cluster: narrative}
  women-flee-from-fields-and-well: {label: "At the besieger's arrival the women gathering wood and straw in the fields and drawing water at the spring flee", cluster: war}
  siege-waits-six-days-acts-on-seventh: {label: "The besieger is told to wait quietly six days, shooting no arrows at the city, and on the seventh something happens", cluster: war}
  king-cannot-sleep-for-noise-of-animals: {label: "The besieged king cannot sleep for the roaring of his bulls, the braying of his asses, the lowing of plough-oxen and barking of dogs", cluster: war}
  besieged-king-offers-peace-gifts: {label: "The besieged king sends messengers offering silver, gold, slaves, horses and chariots as peace gifts if the besieger will withdraw", cluster: war}
  city-called-gift-of-el: {label: "A city is called the gift of the high god, the present of the Father of Mankind", cluster: theology}
  hero-demands-princess-not-treasure: {label: "The besieger refuses the treasure and demands instead the enemy king's daughter as bride", cluster: marriage}
  bride-beautiful-as-anat-and-athtart: {label: "The desired bride's grace is like Anat's and her beauty like Athtart's; her eyes like lapis and alabaster", cluster: marriage}
  bride-promised-in-dream-by-god: {label: "The hero claims the bride because the god gave her to him in a dream, to bear him offspring", cluster: marriage}
  athirat-of-tyre-goddess-of-sidon: {label: "The goddess Athirat is worshipped at her shrine as 'Athirat of Tyre, goddess of Sidon'", cluster: cult}
  conditional-vow-on-the-way: {label: "On the way to his goal the hero vows a gift to a deity at her shrine if he succeeds", cluster: cult}
  besieged-king-consults-wife: {label: "The besieged king calls aloud to his wife to take counsel", cluster: kingship}
  princess-fed-hungry-and-thirsty: {label: "The princess used to take the hungry and the thirsty by the hand (her charity mourned when she leaves)", cluster: ethics}
  bride-taken-to-conquerors-camp: {label: "The princess is handed over and brought into the conqueror's camp", cluster: marriage}
  city-laments-like-cow-for-calf: {label: "A city laments its departing princess as a cow lows for its calf and children cry for their mothers", cluster: mourning}
  divine-assembly-comes-to-kings-house: {label: "The assembly of the gods, named one by one, comes to a mortal king's house", cluster: myth}
  blessing-with-cup-in-hand: {label: "The high god takes a cup in his hand, a goblet in his right, and pronounces a blessing on a mortal", cluster: cult}
  wife-will-bear-seven-sons-yea-eight: {label: "Divine blessing: the wife you have taken will bear you seven sons, yes, eight", cluster: family}
  king-exalted-among-rephaim: {label: "The king is exalted among the Rephaim of the earth, in the gathering of the assembly of Ditanu (royal ancestors)", cluster: underworld}
  litany-of-daughters-to-be-born: {label: "A blessing lists the daughters to be born one after another in a litany ('she will bear the girl ...')", cluster: family}
  youngest-made-firstborn: {label: "The youngest child is formally made the firstborn", cluster: family}
  gods-depart-to-their-tents-after-blessing: {label: "Having blessed the mortal, the gods go back to their tents, their dwellings", cluster: myth}
  promised-children-born-in-seventh-year: {label: "In the seventh year the promised sons and daughters are born as foretold", cluster: family}
  deity-remembers-unpaid-vow: {label: "A goddess remembers the vow the hero made and did not fulfil, and threatens to annul her favour", cluster: cult}
  queen-prepares-feast-for-nobles: {label: "At the king's order the queen slaughters fat beasts, opens the wine jars and calls the nobles to a feast", cluster: kingship}
  nobles-called-bulls-and-gazelles: {label: "The king's nobles are called his seventy 'bulls' and eighty 'gazelles'", cluster: kingship}
  hostess-carves-meat-for-guests: {label: "The hostess puts her hand to the dish and the knife to the meat to serve the guests", cluster: hospitality}
  weeping-for-dying-king-like-lowing-bulls: {label: "The guests are told to weep for the dying king like the bellowing of bulls", cluster: mourning}
  death-as-reaching-sunset: {label: "Dying is described as reaching the setting of the sun, joining the high god", cluster: underworld}
  nobles-anticipate-successor: {label: "While the king lies ill the nobles say that when he dies his son will reign over them", cluster: kingship}
  do-gods-die-lament: {label: "A child laments the dying father who was called son of god: 'we rejoiced in your immortality; how can you die? do gods die?'", cluster: mourning}
  perish-like-dog-in-house: {label: "Lament: we waste away like a dog in your house, like a cur at your door", cluster: mourning}
  dying-father-forbids-son-to-weep: {label: "The dying father tells his son not to weep or waste the fountain of his eyes, but to call his sister", cluster: mourning}
  daughter-summoned-to-lament-with-tambourine: {label: "A daughter is called to come with tambourine in hand to sing (lament) over her father", cluster: mourning}
  sister-at-well-learns-news: {label: "A sister out drawing water sees her brother coming and asks whether their father is ill", cluster: narrative}
  mourner-cries-out-unclothed: {label: "The mourner sobs and cries out, naked, without garment", cluster: mourning}
  earth-searched-for-baals-rain: {label: "Messengers are told to roam earth and heaven to its edge, looking for the rain of Baal on the fields", cluster: myth}
  rain-good-for-wheat-like-perfume: {label: "Baal's rain is good for the earth and the wheat, like fragrance on the ploughed field, like a garland on the furrow", cluster: myth}
  food-wine-oil-exhausted-in-drought: {label: "In drought the ploughmen look up: the bread is spent from the jars, the wine from the skins, the oil from the vessels", cluster: famine}
  kings-sickness-brings-drought: {label: "The king's mortal sickness is accompanied by failure of rain and the land's produce", cluster: kingship}
  herald-of-the-gods-and-his-wife: {label: "The high god summons his herald (Ilish) and the herald's wife, herald of the goddesses", cluster: myth}
  herald-climbs-building-to-proclaim: {label: "The herald is told to climb onto the shoulder of the building, the parapet of the tower, and cry aloud", cluster: myth}
  high-god-asks-seven-times-who-will-heal: {label: "The high god asks the assembled gods seven times who will drive out the king's sickness", cluster: myth}
  none-answers-in-divine-assembly: {label: "No one among the gods answers the high god's question", cluster: myth}
  healer-drives-death-from-city: {label: "A divine healer drives Death out of the city and the foe out of the town, striking with a staff", cluster: underworld}
  healer-washes-sweat-and-opens-throat: {label: "The healer washes the sick man's sweat and opens his throat so that he can eat again", cluster: healing}
  recovered-king-asks-for-food: {label: "On recovering, the king orders a lamb slaughtered so that he may eat", cluster: healing}
  king-returns-to-throne-after-illness: {label: "After a day or two the healed king sits again on his royal throne", cluster: kingship}
  son-demands-father-abdicate: {label: "A son, prompted by his inner voice, demands that his sick father step down from kingship so that he may reign", cluster: kingship}
  king-fails-to-judge-widow-and-poor: {label: "The king is accused of not judging the widow's case, not trying the cause of the wretched, not driving out the oppressor of the poor, not feeding the orphan", cluster: kingship}
  sickbed-as-sister-and-companion: {label: "The sickbed has become the sick king's sister, his couch of illness his companion", cluster: mourning}
  father-curses-rebellious-son: {label: "The father curses the son who sought his throne, calling on gods to break his head and skull", cluster: family}
  six-days-of-ritual-then-seventh: {label: "A ritual action is repeated day by day for six days (one, two, three ... six) and on the seventh comes the result", cluster: cult}
  duties-of-the-ideal-son: {label: "A list of a son's duties to his father: setting up the ancestral stele, making his smoke rise, silencing his slanderers, supporting him when drunk, offering for him in the temples, plastering his roof and washing his clothes", cluster: family}
  son-holds-drunken-fathers-hand: {label: "A good son takes his father by the hand when he is drunk and supports him when he is sated with wine", cluster: family}
  stele-for-ancestral-god: {label: "The son sets up the stele of his father's ancestral god, the emblem of his clan in the sanctuary", cluster: cult}
  kiss-and-embrace-bring-conception: {label: "When he kisses his wife she conceives; when he embraces her she becomes pregnant", cluster: family}
  promised-father-laughs-for-joy: {label: "Told he will have a son, the father's face shines; he laughs, rests his feet on the footstool and says his soul is at rest", cluster: family}
  kotharat-swallow-birth-goddesses: {label: "The Kotharat, daughters of Hilal (the new moon), 'the swallows', goddesses of conception and birth, are feasted or invoked", cluster: family}
  father-counts-months-of-pregnancy: {label: "The expectant father sits and counts the months of his wife's pregnancy", cluster: family}
  just-judge-at-gate-for-widow-and-orphan: {label: "The righteous man sits at the city gate among the nobles on the threshing floor and judges the cause of the widow and the orphan", cluster: law}
  lifts-eyes-and-sees-visitor-approach: {label: "Lifting his eyes he sees the divine visitor coming from far away", cluster: hospitality}
  divine-craftsman-makes-hero-bow: {label: "The craftsman god brings a bow and arrows for a mortal hero", cluster: myth}
  father-gives-bow-to-son: {label: "The father strings the bow and gives it to his son, asking for the best of his game", cluster: family}
  bow-flashes-like-lightning: {label: "The divine bow's string flashes like lightning, shooting into the deep, and curls like a serpent", cluster: myth}
  goddess-covets-heros-bow: {label: "A goddess covets the mortal hero's bow and offers silver and gold for it", cluster: myth}
  hero-tells-goddess-make-her-own-bow: {label: "The hero refuses to give his bow and tells the goddess to bring the materials (wood of Lebanon, sinews, horns) to the craftsman god for her own", cluster: myth}
  goddess-offers-hero-immortality: {label: "A goddess offers the mortal hero life, not-dying, years counted with the gods, in exchange for his weapon", cluster: immortality}
  death-of-all-men-cannot-be-escaped: {label: "The mortal answers that no one escapes death: at the last glaze is poured on his head, plaster on his crown; he will die the death of all men", cluster: immortality}
  bows-are-for-warriors-not-women: {label: "The hero taunts the goddess: bows are for warriors; do women now hunt?", cluster: gender}
  goddess-threatens-hero-on-path-of-sin: {label: "The goddess laughs but plots: if she meets him on the path of transgression and pride she will fell him under her feet", cluster: myth}
  goddess-prostrates-at-el-feet: {label: "The goddess bows at the high god's feet, falls down, prostrates herself and honours him", cluster: myth}
  goddess-slanders-hero-to-high-god: {label: "The goddess slanders the mortal hero before the high god", cluster: myth}
  high-god-yields-to-violent-daughter: {label: "The high god yields to his fierce daughter: 'I know you are implacable; go, do what is in your heart; whoever hinders you will be crushed'", cluster: myth}
  goddess-offers-to-teach-hunting: {label: "The goddess invites the hero to go hunting and offers to teach him the hunt", cluster: myth}
  abilum-city-of-moon-god: {label: "Abilum, 'the city of Prince Yarikh' (the moon god), near the site of the murder", cluster: geography}
  goddess-hires-assassin: {label: "A goddess enlists a warrior (Yatpan) to kill the mortal she hates", cluster: myth}
  murder-for-coveted-object: {label: "A man is murdered for a possession (his bow) the killer coveted", cluster: crime}
  assassin-carried-as-raptor-in-goddess-belt: {label: "The goddess carries the assassin like an eagle in her belt, like a falcon in her sheath, and releases him over the victim", cluster: myth}
  raptors-hover-over-victim: {label: "Eagles and falcons hover over the man as he sits to eat, or over his father's house, an omen of death", cluster: omen}
  blows-twice-on-skull-thrice-on-ear: {label: "The killer strikes the victim twice on the skull, three times over the ear", cluster: crime}
  blood-poured-like-a-slaughterer: {label: "The killer pours out the victim's blood like a murderer, like a slaughterer, to his knees", cluster: crime}
  life-leaves-like-wind-spittle-smoke: {label: "The victim's life goes out like a breath of wind, his soul like spittle, like smoke from his nostrils", cluster: death}
  killer-goddess-weeps-over-victim: {label: "The goddess who had the hero killed weeps over him: 'for your bow I struck you, for your arrows I did not let you live'", cluster: myth}
  coveted-object-lost-after-murder: {label: "The coveted object for which the hero was killed falls into the waters and breaks, so the killer never gets it", cluster: myth}
  harvest-withers-at-heros-death: {label: "After the hero's death the grain on the threshing floor dries up and the vines wither", cluster: famine}
  weeping-in-heart-and-liver: {label: "The mourner weeps in her heart and sheds tears in her liver (inwardly)", cluster: mourning}
  garment-torn-in-mourning: {label: "A garment or cloak is torn in grief at a death or disaster", cluster: mourning}
  hero-adjures-clouds-for-rain: {label: "The righteous man adjures the clouds in the heat of disaster to bring the early rain and the dew on the grapes", cluster: ritual}
  dew-collected-from-fleece: {label: "A woman 'who scoops the dew from the fleece' (and carries water, knows the course of the stars)", cluster: agriculture}
  daughter-saddles-donkey-for-father: {label: "The daughter harnesses the donkey with silver and gold trappings, lifts her father and sets him on its back", cluster: narrative}
  father-kisses-surviving-stalk: {label: "In the parched field the father finds a surviving shoot or ear, embraces and kisses it, and wishes that his son's hand may gather it into the granary", cluster: agriculture}
  word-not-yet-out-of-mouth-when: {label: "Formula: the word had not yet left his mouth, the speech his lips, when the event happened", cluster: narrative}
  messengers-bring-news-of-sons-death: {label: "Messengers arrive and announce to the father: your son is dead, the goddess killed him", cluster: mourning}
  mourners-bind-hair-and-weep: {label: "Mourners bind (or loose) the locks of their heads and shed tears", cluster: mourning}
  feet-shake-loins-break-at-bad-news: {label: "At bad news the hearer's feet shake, his face sweats, his loins break and his back gives way", cluster: emotion}
  eagles-sighted-in-clouds: {label: "Lifting his eyes the father sees eagles in the clouds", cluster: narrative}
  storm-god-breaks-wings-of-eagles: {label: "At a mortal's prayer the storm god breaks the wings of eagles so that they fall at his feet", cluster: myth}
  entrails-searched-for-devoured-remains: {label: "The father splits open the birds' bellies (livers) to look for the fat and bones of his devoured son", cluster: death}
  storm-god-restores-wings: {label: "When the remains are not found the storm god is asked to restore the eagle's wings and it flies away", cluster: myth}
  father-and-mother-of-eagles: {label: "Named eagles: Hirgab the father of the eagles and Ṣamal the mother of the eagles", cluster: myth}
  grave-in-pit-of-underworld-gods: {label: "The dead son is buried in the hole of the gods of the earth (the underworld)", cluster: underworld}
  father-guards-sons-grave-from-birds: {label: "The father curses any birds that fly over his son's grave and disturb him from his sleep", cluster: death}
  mourner-sets-down-staff: {label: "The mourner sets down (or takes up) the end of the staff in his hand between curses", cluster: ritual}
  mourning-ended-with-sacrifice-and-incense: {label: "Mourning is ended: the mourning women are sent away, sacrifice is offered and incense rises to the heavens and the stars", cluster: mourning}
  daughter-asks-blessing-to-avenge-brother: {label: "The sister asks her father's blessing to go and kill her brother's killer, and he blesses her", cluster: vengeance}
  woman-armed-under-womans-dress: {label: "The avenging woman puts on warrior's garb and a dagger beneath, and a woman's garment over it, and rouges herself", cluster: vengeance}
  avenger-plies-killer-with-wine: {label: "The disguised woman avenger serves the killer wine, a second cup of mixed drink, in his tent", cluster: vengeance}
  killer-boasts-in-drink: {label: "Drunk, the killer boasts that the hand that slew the hero will slay thousands of enemies", cluster: vengeance}
  hired-woman-suspected-in-tent: {label: "The killer is told that 'the one who hired us' (or a hired woman) has come to his tent", cluster: vengeance}
  scribal-rubric-return-to-recitation: {label: "A rubric at the end of a tablet tells the reciter to return to (the beginning of) the recitation", cluster: scribal}
  invited-to-eat-bread-and-drink-wine: {label: "Invitation: eat of every bread, drink of every wine", cluster: cult}
  peace-to-king-and-queen-and-those-who-enter: {label: "Liturgical greeting: peace to the king, peace to the queen, to those who enter and to the guards", cluster: cult}
  death-pruned-like-a-vine: {label: "Death (Mot-wa-Šar) sits with the staff of bereavement and widowhood, and the pruners prune him and the binders bind him like a vine", cluster: underworld}
  staff-of-bereavement-and-widowhood: {label: "Death holds in his hand the staff of childlessness and the staff of widowhood", cluster: underworld}
  sevenfold-recitation-rubric: {label: "A rubric prescribes that a text be recited seven times (over the platform, over the fire, over the basin)", cluster: cult}
  field-of-the-gods-of-athirat-and-rahmay: {label: "Refrain: the field is the field of the gods, the field of Athirat and Rahmay", cluster: cult}
  gods-suckle-at-goddess-breasts: {label: "Newborn gods suck at the nipples of the mother goddess's breast", cluster: myth}
  gracious-gods-divide-day-from-day: {label: "The gracious gods are 'those who split day from day'", cluster: cosmology}
  high-god-walks-shore-of-sea: {label: "The high god walks along the shore of the sea, the shore of the deep", cluster: myth}
  high-god-takes-two-women-as-wives: {label: "The high god sees two women at a basin, takes them into his house and, according to their cry, makes them his wives (not daughters) for ever", cluster: myth}
  high-god-shoots-and-roasts-a-bird: {label: "The high god shoots a bird from the sky, plucks it and roasts it on the coals as a sign of his potency", cluster: myth}
  birth-of-dawn-and-dusk: {label: "The high god's wives give birth to Shahar and Shalim, Dawn and Dusk", cluster: cosmology}
  offerings-to-sun-and-fixed-stars: {label: "Gifts are lifted up to the Sun, the Lady, and to the fixed stars", cluster: cult}
  insatiable-newborn-gods-lip-to-earth-lip-to-heaven: {label: "The newborn gods put one lip to the earth and one to the heavens; birds of the sky and fish of the sea enter their mouths, yet they are not sated", cluster: myth}
  sojourn-seven-years-in-holy-desert: {label: "The newborn gods are sent to dwell as strangers among stones and trees in the holy desert for seven full years, eight cycles", cluster: myth}
  wanderers-ask-guard-of-sown-land-for-bread-and-wine: {label: "The wanderers from the desert ask the watchman of the sown land to open and give them bread and wine", cluster: myth}
  moon-god-desires-maiden: {label: "The moon god burns with desire at sunset and embraces the maiden", cluster: myth}
  suitor-sends-bride-price-to-brides-father: {label: "The divine suitor sends to the bride's father offering a bride-price of a thousand silver and ten thousand gold and lapis, and to turn her field into vineyards", cluster: marriage}
  father-offers-another-bride: {label: "The bride's father suggests the suitor marry another (more prestigious) girl instead", cluster: marriage}
  suitor-insists-on-chosen-bride: {label: "The suitor refuses the alternative and insists on the bride he chose, and marries her", cluster: marriage}
  bride-price-weighed-by-brides-family: {label: "The bride's father, mother, brother and sister set up the scales and weigh the bride-price", cluster: marriage}
  moon-god-lamp-of-heaven: {label: "The moon god is called 'the lamp of heaven' (nyr šmm) and asked to shine on the worshipper", cluster: cosmology}
  catalogue-of-goddess-names-recited: {label: "The singer says the names of the goddesses are in his mouth, their count on his lips, and lists them", cluster: cult}
  mare-daughter-of-spring-stone-heaven-and-deep: {label: "The mother of stallion and mare is 'daughter of the spring, daughter of the stone, daughter of heaven and the deep'", cluster: myth}
  sun-goddess-carries-petition-to-each-god: {label: "The sun goddess is asked to carry the petitioner's cry to each god in turn at his own city", cluster: cult}
  snakebite-incantation-expels-venom: {label: "An incantation against snakebite: the charmer destroys the venom, removes the poison and casts the snake away", cluster: magic}
  gods-sit-on-thrones-and-do-nothing: {label: "Each god petitioned sets out his chair and sits down, without helping", cluster: cult}
  healer-god-sets-out-for-city-of-east: {label: "The healer god sets his face toward a distant city to fetch the cure", cluster: magic}
  tree-cast-to-neutralize-poison: {label: "The god casts the 'tree of death' among tamarisks and date-spathes to neutralise the venom", cluster: magic}
  venom-flows-away-like-a-stream: {label: "The venom grows weak and flows away like a wadi, dispersed like a channel", cluster: magic}
  bride-house-shut-until-terms-met: {label: "The house of the bride is shut against the suitor until he meets her terms", cluster: marriage}
  snakes-as-bride-price: {label: "The bride demands snakes, 'sons of the serpent', as her bride-price, and the god gives them", cluster: marriage}
  instruction-for-life-and-well-being: {label: "An instruction presents itself as the teaching for life and the guide to well-being", cluster: wisdom}
  wisdom-enables-true-answer-to-sender: {label: "The purpose of instruction: to answer one who speaks and bring back a report to the one who sent you", cluster: wisdom}
  way-of-life-path-image: {label: "Teaching steers the pupil on the way (path) of life", cluster: wisdom}
  father-instructs-youngest-son: {label: "An official writes his instruction for his son, the youngest of his children", cluster: wisdom}
  author-is-scribe-of-fields-and-boundaries: {label: "The author of the instruction is a scribe of fields who sets boundary stones and keeps the land register", cluster: wisdom}
  truly-silent-man-ideal: {label: "The ideal of the 'truly silent' (self-controlled, modest) man contrasted with the heated man", cluster: wisdom}
  incline-ear-to-words-of-wise: {label: "Opening call of instruction: give your ears, hear the words, set your heart to understand them", cluster: wisdom}
  teaching-a-storehouse-for-life: {label: "The teacher's words will be a storehouse (treasury) for life and the body will prosper on earth", cluster: wisdom}
  honour-the-aged-and-great: {label: "Do not lay hands on an old man or cut off the elder's speech; give respect to the older and greater", cluster: wisdom}
  evildoer-swept-away-by-flood-and-storm: {label: "The evildoer is abandoned by the riverbank, carried off by its mud and swept away by the storm; crocodiles await", cluster: wisdom}
  pause-before-speaking: {label: "Pause, sleep a night, before speaking", cluster: wisdom}
  anger-like-fire-in-straw: {label: "The heated man's anger flares up like fire in straw", cluster: wisdom}
  wicked-tree-withers-righteous-tree-flourishes: {label: "Two trees: the heated man is a tree that withers and ends as firewood; the silent man a tree flourishing in a garden with sweet fruit and pleasant shade", cluster: wisdom}
  do-not-embezzle-temple-share: {label: "Do not take for yourself the share (offering-portions) of the temple", cluster: wisdom}
  fortunes-reversed-when-flood-recedes: {label: "When the inundation recedes the crocodiles are exposed, hippopotami stranded, fish gasping, while jackals and birds feast: a sudden reversal of fortunes", cluster: wisdom}
  moon-god-lassoes-perjurer: {label: "The moon god catches the perjurer with his lasso", cluster: wisdom}
  land-grabbers-house-destroyed: {label: "The land-grabber's house becomes the town's enemy, his granaries are destroyed and his goods given to another", cluster: wisdom}
  little-from-god-better-than-much-by-wrong: {label: "Better a bushel God gives you than five thousand by wrong; better poverty in God's hand than riches in the storehouse", cluster: wisdom}
  beware-of-the-lord-of-all: {label: "Warning: beware of the Lord of All (God), lest his terror carry you off", cluster: wisdom}
  do-not-strive-after-riches: {label: "Do not set your heart on riches, for no one can ignore Fate and Fortune", cluster: wisdom}
  earth-swallows-ill-gotten-wealth: {label: "The ground opens its mouth and swallows ill-gotten wealth into the underworld", cluster: wisdom}
  stolen-wealth-gone-by-morning: {label: "Wealth from robbery does not spend the night with you; at daybreak it is gone", cluster: wisdom}
  greedy-mans-ship-stuck-humble-boat-sails: {label: "The great ship of the greedy is left in the mud, while the small boat of the silent man sails on", cluster: wisdom}
  prayer-to-rising-sun-for-health: {label: "When the sun rises, pray to it: give me well-being and health, and my daily needs", cluster: prayer}
  kindness-wins-universal-greeting: {label: "Put your goodness into people's bodies and everyone will greet you", cluster: wisdom}
  guard-the-tongue: {label: "Guard your tongue from harmful words", cluster: wisdom}
  secure-burial-reward-of-good-life: {label: "The virtuous will find his place in the temple, his coffin will hide him and keep him safe", cluster: wisdom}
  do-not-answer-superior-rashly: {label: "Do not answer your superior insolently or rashly; consult your equal before answering", cluster: wisdom}
  word-of-aggrieved-swifter-than-wind: {label: "The word of an aggrieved man is swifter than the wind", cluster: wisdom}
  tongue-tears-down-and-builds: {label: "The heated man tears down and builds up with his tongue", cluster: wisdom}
  potter-god-fashions-hearts: {label: "The potter god (Khnum) shapes men, including the heated man, kneading the heart", cluster: wisdom}
  sweet-lips-bitter-tongue-fire-in-belly: {label: "The hypocrite's lips are sweet, his tongue bitter, and fire burns in his belly", cluster: wisdom}
  hothead-sets-brothers-quarrelling: {label: "The heated man sets one eye against another and makes brothers quarrel", cluster: wisdom}
  no-feigned-greeting-to-enemy: {label: "Do not greet your adversary with false words of praise while fear is in your belly", cluster: wisdom}
  heart-and-tongue-must-agree: {label: "Do not separate your heart from your tongue; speech must match inner intent", cluster: wisdom}
  abomination-of-god-formula: {label: "A forbidden act is called 'the abomination of the god' (Egyptian bw.t pꜣ nṯr)", cluster: wisdom}
  do-not-covet-poor-mans-goods: {label: "Do not covet the goods of a poor dependant or hunger for his bread: it chokes the throat", cluster: wisdom}
  morsel-swallowed-and-vomited: {label: "The too-large mouthful (ill-gotten) is swallowed and then vomited up", cluster: wisdom}
  flattery-returns-as-curses: {label: "Flattery returns to you as curses, homage as beatings", cluster: wisdom}
  dishonest-messenger-not-sent-again: {label: "One who misbehaves on a mission is not sent again", cluster: wisdom}
  scribe-must-not-falsify-records: {label: "The scribe must not cheat with his pen on the scroll or falsify accounts", cluster: wisdom}
  remit-two-thirds-of-poor-mans-debt: {label: "If a poor man owes a large arrear, divide it in three, forgive two parts and let one stand", cluster: wisdom}
  do-not-seek-patrons-favour: {label: "Do not push yourself on a man to seek his favour or his gifts", cluster: wisdom}
  cheaters-son-not-registered: {label: "The son of a scribe who cheats will not be enrolled", cluster: wisdom}
  virtue-benefits-children: {label: "If you keep these teachings in your heart, your children will see the benefit", cluster: wisdom}
  god-presides-over-the-balance: {label: "The baboon (Thoth) sits by the balance, his heart the plummet; the god invented weights and measures", cluster: wisdom}
  gilded-metal-becomes-lead-at-dawn: {label: "Fraudulently gilded metal becomes lead by morning", cluster: wisdom}
  do-not-covet-fine-goods: {label: "Do not covet copper or fine linen; what use is fine clothing to one who cheats before God?", cluster: wisdom}
  measure-is-eye-of-re: {label: "The grain measure is the Eye of Re, and its abomination is the thief", cluster: wisdom}
  do-not-oppress-tax-paying-farmer: {label: "Do not exact the harvest tax and then draw up a document against the farmer to harm him", cluster: wisdom}
  tongue-is-rudder-god-is-pilot: {label: "Man's tongue is the steering oar of the boat, but the Lord of All is its pilot", cluster: wisdom}
  avoid-needless-oath: {label: "Do not seek to swear an oath by the lord; speak plainly in court", cluster: wisdom}
  council-of-thirty: {label: "The high court of 'the Thirty' in the Residence reviews testimony", cluster: law}
  no-partiality-to-rich-or-poor: {label: "In court do not favour the man in bright clothes nor despise the man in rags", cluster: law}
  truth-a-great-gift-of-god: {label: "Truth (Maat) is a great gift of God, given to whom he loves", cluster: wisdom}
  do-not-forge-oracles: {label: "Do not falsify an oracle on the scroll or invent divine power for yourself", cluster: wisdom}
  return-goods-to-owners: {label: "Return property to its owners and seek your own living", cluster: wisdom}
  trust-god-not-human-protector: {label: "Do not seek a powerful protector against your enemy; set yourself in the arms of God, and your silence will overthrow them", cluster: wisdom}
  you-know-not-gods-plans: {label: "You do not know the plans of God, so do not be ashamed of tomorrow", cluster: wisdom}
  let-the-angry-man-empty-himself: {label: "Do not provoke your adversary; let him empty his belly and keep calm", cluster: wisdom}
  great-man-like-many-wells: {label: "An official great in office is like one with many wells for drawing water", cluster: wisdom}
  heart-of-man-is-gods-gift: {label: "The heart of a man is the nose (beak) of God, or the gift of God; beware of neglecting it", cluster: wisdom}
  man-is-clay-and-straw-god-the-builder: {label: "Man is clay and straw; God is his builder", cluster: creation}
  god-tears-down-and-builds-daily: {label: "God tears down and builds up every day, making a thousand poor and a thousand overseers as he wishes", cluster: wisdom}
  happy-who-reaches-the-west-safe: {label: "How joyful is he who reaches the West (death) safe in the hand of God", cluster: underworld}
  do-not-sit-with-drinkers-of-wine: {label: "Do not sit in the beer-house or join one greater than you there", cluster: wisdom}
  pilot-who-looks-ahead: {label: "A pilot who looks far ahead does not capsize his ship", cluster: wisdom}
  do-not-curse-elder: {label: "Do not revile one older than you, for he has seen the sun before you", cluster: wisdom}
  endure-insult-silently: {label: "Let your elder beat you with your hand in your lap, revile you while you are silent", cluster: wisdom}
  dog-does-not-bark-at-master: {label: "The master's dog does not bark at him who feeds it", cluster: wisdom}
  god-loves-who-honours-poor: {label: "God loves him who honours the poor more than him who respects the noble", cluster: wisdom}
  ferry-the-poor-free: {label: "Do not stop a man from crossing the river; take the fare from the rich and let the poor cross free", cluster: wisdom}
  help-the-drowning-grasp-the-oar: {label: "When an oar is brought to you in midstream, stretch out your arms to take it", cluster: wisdom}
  thirty-sayings-of-the-wise: {label: "An instruction counts itself as 'these thirty chapters' that entertain and instruct", cluster: wisdom}
  skilled-scribe-stands-before-kings: {label: "A scribe skilled in his office will be found worthy of being a courtier", cluster: wisdom}
  teaching-makes-ignorant-wise: {label: "The teaching makes the ignorant learned and purifies him when it is read to him", cluster: wisdom}
  school-copy-with-daily-dates: {label: "A school copy of a literary text marked with day dates (a pupil's daily stint)", cluster: scribal}
  sun-god-lord-of-heaven-and-earth: {label: "The sun god is lord of all the sun disc encircles, lord of heaven and lord of earth", cluster: theology}
  royal-couple-in-hymn-to-god: {label: "The king and his queen are named with full titulary in the hymn to the god", cluster: kingship}
  king-lives-on-maat: {label: "The king is 'living on Maat' (truth, right order)", cluster: kingship}
  god-rises-and-fills-land-with-beauty: {label: "The god appears beautiful in the horizon and fills every land with his beauty", cluster: theology}
  suns-rays-embrace-all-lands: {label: "The sun's rays embrace the lands to the limit of all he has made", cluster: theology}
  god-far-yet-rays-on-earth: {label: "The god is far away, yet his rays are on earth; he is in people's faces, yet his course is unknown", cluster: theology}
  night-as-state-of-death: {label: "When the sun sets the land lies in darkness as in death: sleepers with covered heads, eye not seeing eye", cluster: cosmology}
  thief-in-the-night: {label: "At night goods are stolen from under the sleepers' heads and they do not notice", cluster: cosmology}
  arms-raised-in-praise-at-sunrise: {label: "At sunrise people and birds raise arms and wings in praise of the god", cluster: theology}
  cattle-content-with-pasture-trees-flourish: {label: "At sunrise all cattle are content with their pasture, trees and plants flourish", cluster: creation}
  fish-leap-rays-in-the-sea: {label: "The fish in the river leap before the sun, whose rays reach into the sea", cluster: creation}
  god-gives-breath-to-all-he-made: {label: "The god gives breath to keep alive all that he has made", cluster: creation}
  god-opens-newborns-mouth: {label: "When the child comes forth from the womb the god opens its mouth and supplies its needs", cluster: creation}
  chick-in-egg-given-breath: {label: "The god gives breath to the chick in the egg and sets its time to break out and walk", cluster: creation}
  how-manifold-are-your-works: {label: "Exclamation of praise: how many (how excellent) are the things you have made", cluster: creation}
  god-alone-created-earth-by-his-will: {label: "The god created the earth according to his heart when he was alone, with people, cattle and all that walks and flies", cluster: creation}
  universal-god-cares-for-foreign-lands: {label: "The god cares for the foreign lands (Syria, Kush) as for Egypt, setting each man in his place", cluster: theology}
  god-fixes-each-ones-lifetime: {label: "The god reckons (fixes) each person's lifetime", cluster: theology}
  nile-from-underworld-rain-a-nile-in-sky: {label: "The god made the Nile in the underworld for Egypt and a 'Nile in the sky' (rain) for the foreign lands", cluster: cosmology}
  suns-rays-nourish-plants-seasons-made: {label: "The sun's rays nurse the fields; the god made the seasons, winter to cool and summer heat", cluster: creation}
  one-god-makes-millions-of-forms: {label: "The one god makes millions of forms (cities, fields, roads, rivers) from himself alone", cluster: theology}
  every-eye-sees-the-god-by-day: {label: "Every eye beholds the god above them as the sun of day", cluster: theology}
  creatures-live-at-his-rising-die-at-his-setting: {label: "When the god rises creatures live, when he sets they die; he is lifetime itself", cluster: theology}
  king-sole-knower-of-god: {label: "The king says: you are in my heart; no one knows you except your son, the king, whom you have made wise", cluster: kingship}
  work-ceases-at-sunset: {label: "All work is laid down when the sun sets in the west", cluster: cosmology}
units:
  - id: ane-ktu-1-14-i-kirta-house-destroyed
    tradition: ane-ugaritic
    title: Kirta's house destroyed; his wives and heirs lost; he weeps himself to sleep (Kirta I)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Ugaritic"
    read: ["KTU 1.14 I:1-34"]
    tags:
      - {motif: king-loses-all-wives-and-heirs, refs: ["KTU 1.14 I:7-25"], note: "umt [krt] ˁrwt, bt mlk itbd: the clan is laid bare, the house destroyed; seven successive wives lost (mṯlṯt kṯrm tmt, mrbˁt zblnm ... mšbˁthn bšlḥ ttpl), wbklhn špḥ yitbd: all the offspring perished"}
      - {motif: seven-brothers-eight-sons-of-one-mother, refs: ["KTU 1.14 I:8-9"], note: "dšbˁ [a]ḫm lh ṯmnt bn um: who had seven brothers, eight sons of one mother"}
      - {motif: plague-god-resheph-carries-off-family, refs: ["KTU 1.14 I:18-19"], note: "mḫmšt yitsp ršp: the fifth Rašpu gathered in"}
      - {motif: sea-takes-a-wife, refs: ["KTU 1.14 I:19-20"], note: "mṯdṯt ġlm ym: the sixth the lads of Yammu (the Sea) took"}
      - {motif: tears-like-shekels-to-ground, refs: ["KTU 1.14 I:26-30"], note: "tntkn udmˁth km ṯqlm arṣh kmḫmšt mṭth: his tears pour like shekels to the ground, like fifth-shekels on the bed"}
      - {motif: bed-flooded-with-tears, refs: ["KTU 1.14 I:28-30"]}
      - {motif: mourner-weeps-in-inner-chamber, refs: ["KTU 1.14 I:26-27"], note: "yˁrb bḥdrh ybky: he enters his chamber and weeps"}
      - {motif: weeper-falls-asleep-and-dreams, refs: ["KTU 1.14 I:31-34"]}
    hints:
      - "Compare Job 1:13-19 and 42:13 (the righteous man stripped of all his children, then given new ones); Job 1:2 'seven sons'."
      - "Tears on the bed: Ps 6:7; 1Sam 1:7-10 (Hannah weeping, not eating, before the promise of a son); Ps 56:9."
      - "Resheph as a destroyer: Hab 3:5; Deut 32:24; Job 5:7."
  - id: ane-ktu-1-14-i-el-in-dream
    tradition: ane-ugaritic
    title: El descends in Kirta's dream and asks why he weeps (Kirta I-II)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Ugaritic"
    read: ["KTU 1.14 I:35-52", "KTU 1.14 II:1-5"]
    tags:
      - {motif: god-instructs-in-dream, refs: ["KTU 1.14 I:35-37"], note: "wbḥlmh il yrd bḏhrth ab adm: in his dream El came down, in his vision the Father of Mankind"}
      - {motif: father-of-mankind-el, refs: ["KTU 1.14 I:36-37", "KTU 1.14 I:43"], note: "ab adm"}
      - {motif: god-asks-why-petitioner-weeps, refs: ["KTU 1.14 I:37-43"], note: "mat krt kybky: what ails Kirta that he weeps? Does he desire the kingship of the Bull his father?"}
      - {motif: king-called-gracious-lad-of-el, refs: ["KTU 1.14 I:40-41"], note: "nˁmn ġlm il"}
      - {motif: hero-refuses-wealth-asks-for-offspring, refs: ["KTU 1.14 I:51-52", "KTU 1.14 II:1-5"], note: "restored [lm ank ksp wyrq] ... [x x x]ṯnm aqny, [x x x]šrm amid: why should I want silver and gold ...? let me acquire [sons], multiply [offspring]; the opening of the request is restored from III:33-37; I:44-50 are lost"}
    hints:
      - "Compare 1Kgs 3:5-13 (God appears to Solomon in a dream: 'Ask what I shall give you'; he does not ask riches); Gen 15:1-3 ('what will you give me, seeing I go childless?')."
      - "God asks the weeping: Gen 21:17 ('What troubles you, Hagar?'); 1Sam 1:8."
  - id: ane-ktu-1-14-ii-el-instructs-sacrifice-and-campaign
    tradition: ane-ugaritic
    title: El's instructions - sacrifice on the tower, muster of the whole people, seven-day march, siege of Udum, demand for Hurriya (Kirta II-III)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Ugaritic"
    read: ["KTU 1.14 II:6-III:49"]
    tags:
      - {motif: ritual-washing-and-rouging-before-sacrifice, refs: ["KTU 1.14 II:9-11"], note: "trtḥṣ wtadm, rḥṣ ydk amt, uṣbˁtk ˁd ṯkm: wash and redden yourself, wash your hands to the elbow, your fingers to the shoulder"}
      - {motif: offering-of-lamb-bird-wine-and-honey, refs: ["KTU 1.14 II:13-19"], note: "imr dbḥ, mṣrr ˁṣr dbḥ, yn bgl ḥtṯ, nbt bgl ḫrṣ: sacrificial lamb, sacrificial bird, wine in a silver cup, honey in a gold cup"}
      - {motif: sacrifice-on-tower-roof-hands-to-heaven, refs: ["KTU 1.14 II:20-26"], note: "ˁl lẓr mgdl ... ša ydk šmm dbḥ lṯr abk il: climb to the top of the tower, lift your hands to heaven, sacrifice to the Bull your father El; then come down from the roofs (gg)"}
      - {motif: army-numberless-like-storm-and-autumn-rain, refs: ["KTU 1.14 II:35-40"], note: "ṯlṯ mat rbt ... hlk lalpm ḫḏḏ wlrbt kmyr: by thousands like a storm, by myriads like the early rain"}
      - {motif: total-levy-widow-sick-blind-newlywed, refs: ["KTU 1.14 II:43-50"], note: "the only son shuts his house, the widow hires a substitute, the sick man carries his bed, the blind gropes after, the new bridegroom (trḫ ḥdṯ) must hand his wife to another, his beloved to a stranger"}
      - {motif: army-settles-on-land-like-locusts, refs: ["KTU 1.14 II:50-51", "KTU 1.14 III:1"], note: "kirby tškn šd km ḥsn pat mdbr"}
      - {motif: seven-day-march-formula, refs: ["KTU 1.14 III:2-5"], note: "a day and a second, a third, a fourth ... at sunrise on the seventh you will reach Udum"}
      - {motif: women-flee-from-fields-and-well, refs: ["KTU 1.14 III:7-9"], note: "the wood-gatherer, the straw-gatherer, the water-drawer at the spring flee"}
      - {motif: siege-waits-six-days-acts-on-seventh, refs: ["KTU 1.14 III:10-15"], note: "dm ym wṯn ...: keep still six days; do not shoot your arrows at the city; and lo, at sunset on the seventh"}
      - {motif: king-cannot-sleep-for-noise-of-animals, refs: ["KTU 1.14 III:14-19"], note: "wl yšn pbl mlk lqr ṯigt ibrh lql nhqt ḥmrh: King Pabil cannot sleep for the roar of his bulls, the braying of his asses"}
      - {motif: besieged-king-offers-peace-gifts, refs: ["KTU 1.14 III:19-32"], note: "qḥ ksp wyrq ḫrṣ ... ˁbd ˁlm ṯlṯ sswm mrkbt ... qḥ krt šlmm šlmm: take silver, gold, a perpetual slave, three horses, a chariot ... take peace-offerings, Kirta, and go away from my house"}
      - {motif: city-called-gift-of-el, refs: ["KTU 1.14 III:31-32"], note: "udm ytnt il wušn ab adm: Udum is the gift of El, the present of the Father of Mankind"}
      - {motif: message-repeated-verbatim, refs: ["KTU 1.14 III:19-49"]}
      - {motif: hero-demands-princess-not-treasure, refs: ["KTU 1.14 III:33-40"], note: "lm ank ksp ... pd in bbty ttn tn ly mṯt ḥry: why should I take silver ...? give what is lacking in my house, give me the girl Hurriya"}
      - {motif: bride-beautiful-as-anat-and-athtart, refs: ["KTU 1.14 III:40-45"], note: "dk nˁm ˁnt nˁmh km tsm ˁṯtrt tsmh, dˁqh ib iqni ˁpˁph sp ṯrml: whose grace is like Anat's, beauty like Athtart's, eyeballs lapis lazuli, eyelids alabaster bowls"}
      - {motif: bride-promised-in-dream-by-god, refs: ["KTU 1.14 III:46-49"], note: "dbḥlmy il ytn ... wld špḥ lkrt: whom El gave in my dream, to bear Kirta offspring"}
      - {motif: king-called-gracious-lad-of-el, refs: ["KTU 1.14 II:8", "KTU 1.14 III:49"], note: "nˁmn ġlm il; ˁbd il: the servant of El"}
      - {motif: bull-el-father-epithets, refs: ["KTU 1.14 II:6"], note: "ṯr abh il"}
    hints:
      - "Rooftop sacrifice and raised hands: 2Kgs 23:12; Jer 19:13; 32:29; Zeph 1:5; 1Kgs 8:22, 54."
      - "Total levy with the newlywed: contrast Deut 20:5-7 and 24:5 (the new husband is exempt for a year); Joel 2:16 ('let the bridegroom leave his chamber')."
      - "Army like locusts: Judg 6:5; 7:12; Joel 2:2-11; Nah 3:15-17. Army like a storm cloud: Ezek 38:9."
      - "Seven days of encirclement before action: Josh 6:3-4, 14-15 (Jericho); 1Kgs 20:29."
      - "Peace gifts to buy off a besieger: 2Kgs 18:14-16; 1Kgs 20:2-6 (silver, gold, wives and children demanded); 1Kgs 15:18-19."
      - "Bride's beauty and eyes: Song 4:1-9; 6:4-7; 7:5; Gen 29:17."
  - id: ane-ktu-1-14-iii-kirta-wakes-and-obeys
    tradition: ane-ugaritic
    title: Kirta wakes from the dream and carries out El's instructions; the army marches (Kirta III-IV)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Ugaritic"
    read: ["KTU 1.14 III:50-IV:31"]
    tags:
      - {motif: woke-and-it-was-a-dream, refs: ["KTU 1.14 III:50-51"], note: "krt yḫṭ wḥlm, ˁbd il whdrt: Kirta awoke - and it was a dream; the servant of El - and it was a vision"}
      - {motif: god-instructs-in-dream, refs: ["KTU 1.14 III:52-IV:31"], note: "the instructions of II:9-III:1 are carried out word for word"}
      - {motif: ritual-washing-and-rouging-before-sacrifice, refs: ["KTU 1.14 III:52-54"]}
      - {motif: offering-of-lamb-bird-wine-and-honey, refs: ["KTU 1.14 III:55-IV:2"]}
      - {motif: sacrifice-on-tower-roof-hands-to-heaven, refs: ["KTU 1.14 IV:2-8"], note: "nša ydh šmmh dbḥ lṯr abh il"}
      - {motif: army-numberless-like-storm-and-autumn-rain, refs: ["KTU 1.14 IV:15-18"]}
      - {motif: total-levy-widow-sick-blind-newlywed, refs: ["KTU 1.14 IV:21-28"]}
      - {motif: army-settles-on-land-like-locusts, refs: ["KTU 1.14 IV:29-31"]}
    hints:
      - "Waking from the dream: Gen 41:7; 1Kgs 3:15 ('Solomon awoke, and behold, it was a dream', then sacrificed and made a feast); Gen 28:16."
  - id: ane-ktu-1-14-iv-vow-to-athirat
    tradition: ane-ugaritic
    title: At the shrine of Athirat of Tyre Kirta vows silver and gold if he wins Hurriya (Kirta IV)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Ugaritic"
    read: ["KTU 1.14 IV:32-43"]
    tags:
      - {motif: seven-day-march-formula, refs: ["KTU 1.14 IV:32-34"], note: "here the formula is broken off at the third day, at sunset, when he reaches the shrine"}
      - {motif: athirat-of-tyre-goddess-of-sidon, refs: ["KTU 1.14 IV:34-39"], note: "qdš aṯrt ṣrm wilt ṣdynm"}
