      - {motif: gifts-to-underworld-gods, refs: ["ETCSL 1.8.1.3 2.I:8-28"], note: "Ereškigala, Namtar, Dimpikug, Neti, Ninĝišzida and Dumuzid, the ancestors of Enlil (Enki-Ninki ... Enmešara), Šul-pa-e, Sumugan, Ninḫursaĝa, the Anuna, dead en, lagar, lumaḫ, nindiĝir, gudug priests"}
      - {motif: incomparable-king, refs: ["ETCSL 1.8.1.3 2.I:40"], note: "lugal gaba-ri-a-bi ... nu-ub-tu-ud: no king equal to him was born"}
      - {motif: sumerian-zami-doxology, refs: ["ETCSL 1.8.1.3 2.I:42"]}
    hints:
      - "Compare Deut 34:6 (no one knows Moses' grave) and Jer 16:6 and Deut 14:1 (gashing and baldness for the dead)."
      - "Compare Ezek 32:22-30 and Isa 14:9-18 (the dead kings in the netherworld with their companies); 2 Kgs 23:25 (none like him)."
