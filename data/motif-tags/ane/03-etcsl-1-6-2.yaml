# Full read of the ANE corpus, chunk 3: ETCSL 1.6.2 (Lugal-e) to ETCSL 1.8.1.3 (Death of Gilgamesh). Read from the ETCSL Sumerian composite transliterations.
new_motifs:
  heaven-impregnates-earth: {label: "Heaven (An) copulates with or impregnates Earth (Ki), who gives birth to a being or plant", cluster: creation}
  monster-without-father-or-nurse: {label: "The monstrous enemy is a foundling who knew no father and sucked milk without a wet-nurse", cluster: combat}
  talking-divine-weapon: {label: "A god's personified weapon speaks to him, scouts, reports the enemy's plans and advises him", cluster: combat}
  monster-usurps-divine-kingship: {label: "The monster sets up a throne, is named king and judges lawsuits, challenging the god's kingship", cluster: combat}
  stones-as-monster-army: {label: "Named stones and minerals form the army of the mountain monster and raid the cities", cluster: combat}
  catalogue-of-slain-monsters: {label: "A catalogue of monsters the warrior god has already slain (dragon, six-headed ram, Anzu bird, seven-headed snake...)", cluster: combat}
  seven-headed-serpent-slain: {label: "A seven-headed serpent is among the monsters slain by the warrior god", cluster: combat}
  gods-flee-in-terror: {label: "The gods scatter, cower against the walls or hide in corners in terror at the battle", cluster: combat}
  battle-storm-ravages-birds-fish-beasts: {label: "The divine battle-storm ruins the birds of the sky, the fish of the waters and the wild animals", cluster: combat}
  father-god-laments-absent-son: {label: "The high god laments that his champion son is not with him: 'who will take me by the hand?'", cluster: combat}
  god-forbids-extinction-of-species: {label: "The high god orders that the war must not wipe out posterity or the names of the species whose destinies he decreed", cluster: combat}
  warrior-washes-blood-after-battle: {label: "The victorious god washes his weapons and wipes the blood from his garments and brow after battle", cluster: combat}
  gods-prostrate-before-victor: {label: "The gods come and prostrate themselves before the victorious warrior god and greet him", cluster: combat}
  slain-monster-made-into-cosmos: {label: "The slain monster's body is turned into part of the world (stone, mountain, underworld)", cluster: creation}
  god-decrees-name-henceforth: {label: "A god decrees 'from this day its name shall be X', founding the name of a thing or place", cluster: etiology}
  gods-bear-corvee-labor: {label: "Before the present order the gods themselves carried hoe and basket as corvee labour", cluster: creation}
  god-dams-waters-builds-irrigation: {label: "A god piles up stones as a dam, gathers the scattered waters and leads them into the river to irrigate the fields", cluster: creation}
  god-introduces-plough-and-furrow: {label: "Agriculture (irrigation, the plough, furrows, grain piles) is introduced by a god", cluster: civilization}
  mountain-yields-wood-metals-honey: {label: "The mountain is blessed to yield herbs, honey, wine, cedars, gold, silver, copper, tin and wild animals", cluster: blessing}
  curse-explains-natures-of-things: {label: "A god's curse or blessing on creatures for their past conduct explains their present nature and use", cluster: etiology}
  stones-judged-for-war-conduct: {label: "The victorious god judges each kind of stone by whether it fought for or against him, assigning it honour or degradation", cluster: etiology}
  first-fruits-offered-at-new-moon: {label: "The first fruits for the gods are placed (on a stone or altar) at the new moon", cluster: cult}
  diorite-from-magan-for-statues: {label: "Diorite brought from Magan for royal statues set up in the temple's place of libation", cluster: cult}
  divine-ordinances-inscribed-on-stone: {label: "The god's ordinances are to be inscribed in lines on a stone set up on a pedestal in his courtyard", cluster: law}
  festival-of-the-dead-spirits: {label: "A festival of the spirits of the dead (ezen gidim) held at a fixed day of the month", cluster: underworld}
  victor-god-returns-by-boat: {label: "The victorious god returns home in his sacred barge while boatmen sing his praise", cluster: combat}
  king-restores-shrine-from-dust: {label: "A pious king raises the god's shrine from the dust and performs its rites, and is commended to the god", cluster: kingship}
  scribal-goddess-holds-tablets: {label: "A goddess of writing (Nisaba) keeps the tablets, measures and accounts and is entrusted with the harvests", cluster: wisdom}
  sumerian-zami-doxology: {label: "The composition closes with a doxology 'X, be praised' (zami) or 'it is good to praise you'", cluster: cult}
  tablet-of-destinies: {label: "A tablet of destinies whose possession confers the divine powers and rule", cluster: cosmology}
  hero-plots-to-seize-world: {label: "The hero, unsatisfied with honours, secretly sets his sights on ruling the whole world", cluster: combat}
  god-fashions-creature-from-clay: {label: "A god fashions a creature from clay to serve his purpose", cluster: creation}
  trap-pit-dug-for-hero: {label: "A creature digs a pit into which the proud hero falls and cannot climb out", cluster: combat}
  gods-create-humans-and-animals: {label: "The great gods fashion the black-headed people and make the animals multiply", cluster: creation}
  kingship-descends-from-heaven: {label: "Kingship (crown and throne) descends from heaven to earth", cluster: kingship}
  antediluvian-cities-assigned-to-gods: {label: "The first cities before the flood (Eridug, Bad-tibira, Larag, Zimbir, Šuruppag) are founded and allotted to gods", cluster: flood}
  goddess-laments-destruction-of-humans: {label: "A goddess laments the destruction of the people decreed by the gods", cluster: flood}
  gods-bound-by-oath-to-destroy: {label: "The gods are made to swear an oath binding them to the decision to destroy humankind", cluster: flood}
  divine-assembly-decree-irrevocable: {label: "The verdict of the divine assembly to destroy is declared irrevocable", cluster: flood}
  flood-lasts-seven-days-and-nights: {label: "The flood storm rages for seven days and seven nights", cluster: flood}
  sun-god-enters-ark: {label: "The sun god appears after the flood and shines into the boat through an opening the hero makes", cluster: flood}
  flood-hero-granted-eternal-life: {label: "The gods grant the flood hero life like a god, eternal life", cluster: flood}
  flood-hero-settled-in-dilmun: {label: "The flood hero is settled in a far land (Dilmun) where the sun rises", cluster: flood}
  oath-by-heaven-and-earth: {label: "An oath sworn by the life of Heaven and the life of Earth", cluster: cult}
  primeval-humans-eat-grass: {label: "Before grain, humans ate grass with their mouths like sheep", cluster: civilization}
  grain-brought-down-from-heaven: {label: "Grain is brought down from heaven by the sky god", cluster: civilization}
  grain-hidden-in-mountain: {label: "The high god stores the barley inside a mountain and bars it shut", cluster: civilization}
  gods-fetch-grain-for-humans: {label: "Younger gods plan to bring the hidden grain down from the mountain to the land", cluster: civilization}
  survivors-of-the-flood-named: {label: "People or offices that 'survived the flood' are named", cluster: flood}
  raven-set-over-offender: {label: "A goddess seizes a raven and sets it over a bound offender", cluster: nature}
  goddess-proposes-marriage-to-god: {label: "A goddess comes out and proposes marriage to a god, asking him to tell his father 'let her be my spouse'", cluster: marriage}
  father-god-blesses-victorious-son: {label: "The father god fixes a blessed destiny for his victorious son: weapon, eternal rule, long life", cluster: kingship}
  god-asleep-when-appealed-to: {label: "The god the petitioners turn to for help lies sleeping a sound sleep", cluster: cult}
  god-blesses-river-and-crops: {label: "The high god addresses a watercourse and blesses the land's flax and grain", cluster: blessing}
  envoys-demand-submission: {label: "Envoys of a rival king arrive demanding the city's submission", cluster: war}
  two-assemblies-elders-and-young-men: {label: "The ruler puts the question of war first to the council of elders, then to the assembly of young men", cluster: kingship}
  temple-lowered-from-heaven: {label: "A temple or city wall was made by the gods and let down from heaven", cluster: cult}
  is-that-man-your-king: {label: "The besieger, seeing a man on the wall, asks the captive 'Is that man your king?'", cluster: war}
  captured-king-released-repaying-kindness: {label: "The victor releases the captured enemy king in repayment of an earlier kindness", cluster: war}
  former-refuge-repaid: {label: "The hero recalls that the enemy once gave him refuge as a fugitive and fed 'the fleeing bird'", cluster: war}
  i-will-sing-opening: {label: "A song opens with the singer's announcement 'I will sing the song of ...'", cluster: cult}
  hero-rebuffs-goddess: {label: "The hero rebuffs the love-goddess's attempt to keep him for herself", cluster: goddess}
  goddess-demands-bull-of-heaven: {label: "The spurned goddess demands the Bull of Heaven from her father to kill the hero", cluster: goddess}
  goddess-threatens-cosmic-scream: {label: "The goddess threatens to raise a cry reaching heaven and earth until her father yields", cluster: goddess}
  bull-of-heaven-ravages-land: {label: "The Bull of Heaven devours the pasture, drinks the river dry and breaks the palm trees", cluster: goddess}
  slain-beast-meat-to-widows-sons: {label: "The slain beast's meat is shared out in baskets to the widows' sons of the city", cluster: charity}
  horns-made-into-oil-flasks: {label: "The slain bull's horns are made into flasks for pouring oil to the goddess", cluster: cult}
  hero-hurls-haunch-at-goddess: {label: "The hero hurls a haunch of the slain bull at the goddess, who flees", cluster: goddess}
  hero-drinks-musician-retorts: {label: "The hero calls his musician to play and give him drink; the musician retorts it is no concern of his", cluster: court}
  wells-of-the-land-to-be-finished: {label: "The unfinished wells and hoisting gear of the land are the refrain argument in a council on war or submission", cluster: war}
  hero-lies-down-never-to-rise: {label: "Lament refrain: the hero has lain down and will never rise again", cluster: death}
  fate-demon-bolts-the-dying: {label: "The demon of fate (Namtar) holds the dying man fast like a door-bolt; he cannot stand, sit, eat or drink", cluster: death}
  deathbed-dream-of-divine-assembly: {label: "The dying king dreams that he stands before the assembly of the gods, which reviews his deeds and decides his lot", cluster: death}
  gods-review-heros-deeds: {label: "The gods recite the hero's deeds (journeys, cedar, Huwawa, stelae, temples, reaching the flood hero, restored rites) before deciding his fate", cluster: death}
  kingship-granted-not-eternal-life: {label: "The high god destined the hero for kingship but not for eternal life", cluster: death}
  death-is-human-lot-from-birth: {label: "Death is the lot of being human, fixed when the umbilical cord was cut: the dark day, the flood-wave, the unequal fight await", cluster: death}
  no-more-immortality-after-flood: {label: "After the flood hero was spared, the gods swore that no human would again be granted eternal life", cluster: death}
  dead-king-made-judge-of-underworld: {label: "The dead hero-king becomes governor and judge among the ghosts of the underworld", cluster: underworld}
  dead-meet-kin-in-underworld: {label: "In the underworld the dead man will be met by his father, mother, sisters, friend and the city elders", cluster: underworld}
  hero-restores-forgotten-rites: {label: "The hero brings back to the land the forgotten divine rites and the rites of hand-washing and mouth-washing", cluster: cult}
  retinue-buried-with-king: {label: "The king's wife, children, concubine, musician, cup-bearer, barber and servants are laid down with him in the tomb", cluster: death}
  gifts-to-underworld-gods: {label: "The dead king sets out audience gifts for each of the underworld gods and the dead priests", cluster: underworld}
  tomb-built-in-diverted-riverbed: {label: "The river is diverted, the tomb is built of stone in its dry bed and hidden so that no one can find it", cluster: death}
  funerary-statue-keeps-name-alive: {label: "Funerary statues set up in the temples keep the names of the dead from being forgotten", cluster: death}
  hero-visits-flood-survivor: {label: "The hero travels to the end of the world and reaches the immortal flood survivor", cluster: death}
units:
  - id: ane-etcsl-1-6-2-prologue
    tradition: ane-sumerian
    title: "Lugal-e: hymnic prologue to Ninurta and the feast at which Šar-ur speaks"
    corpus: ane
    original: true
    tagger: Claude (model), reading the Sumerian
    read: ["ETCSL 1.6.2 0-23"]
    tags:
      - {motif: divine-warrior, refs: ["ETCSL 1.6.2 1-8"], note: "lugal ud me-lem4-bi nir-ĝal2 ... ur-saĝ me3-še3 ti-na gub-bu: king, storm of majestic splendour, hero striding into battle"}
      - {motif: storm-theophany-arrows-thunder, refs: ["ETCSL 1.6.2 9"], note: "aga zid ... igi nim ĝir2 du7-du7: makes the tiara flash like lightning; the rainbow (ŠE.TIR-an-na) reading is uncertain"}
      - {motif: monster-caught-in-gods-net-by-many-peoples, refs: ["ETCSL 1.6.2 13"], note: "{sa}šu2-uš-gal lu2-erim2-ra šu2-a: great battle-net flung over the foe"}
      - {motif: talking-divine-weapon, refs: ["ETCSL 1.6.2 22-23"], note: "the mace looks towards the mountains; šar2-ur3-e ... lugal-bi-ir gu3 mu-na-de2-e"}
    hints:
      - "Compare Ps 18:8-15 and Hab 3:3-15 (the storm-god warrior); Ezek 32:3 (God's net over the dragon)."
  - id: ane-etcsl-1-6-2-asag-report
    tradition: ane-sumerian
    title: "Lugal-e: Šar-ur reports the birth and kingship of the Asag"
    corpus: ane
    original: true
    tagger: Claude (model), reading the Sumerian
    read: ["ETCSL 1.6.2 24-69"]
    tags:
      - {motif: heaven-impregnates-earth, refs: ["ETCSL 1.6.2 26-27"], note: "an-e ki sig7-ga ĝiš3 im-ma-dug4 ... a2-sag3 mu-un-ši-ib-tu-ud: Heaven copulated with the verdant Earth, she bore the Asag"}
      - {motif: monster-without-father-or-nurse, refs: ["ETCSL 1.6.2 28-30"], note: "dumu um-me ga nu-tuš-a ... buluĝ3 a-a nu-zu: a child never with a wet-nurse, a foster-child knowing no father, igi teš2 nu-ĝal2-la 'face knows no shame'"}
      - {motif: monster-usurps-divine-kingship, refs: ["ETCSL 1.6.2 35", "ETCSL 1.6.2 41-42", "ETCSL 1.6.2 53"], note: "the plants name it king (lugal-bi-še3); it sets up a dais (barag ba-ri) and decides the Land's lawsuits; plans to take Ninurta's kingship"}
      - {motif: stones-as-monster-army, refs: ["ETCSL 1.6.2 37-39"], note: "šu, saĝkal, esi, usium, kagena, nu stones are its warriors (gar3-ra-du-um) raiding the cities"}
      - {motif: gods-fear-the-monster, refs: ["ETCSL 1.6.2 40", "ETCSL 1.6.2 45-47"], note: "the city-gods bow to it; the mountains bring it offerings (nidba)"}
      - {motif: weapons-useless-against-monster, refs: ["ETCSL 1.6.2 62-63"], note: "{ĝiš}tukul-e ĝiš la-ba-ab-kiĝ2 ... šukur maḫ-e su-bi nu-dar-e: no weapon overturns it, the axe and spear cannot pierce its flesh"}
      - {motif: talking-divine-weapon, refs: ["ETCSL 1.6.2 24-69"]}
    hints:
      - "Compare Job 40:15-41:26 (Behemoth and Leviathan: weapons useless, gods afraid, 'king over all the proud beasts', Job 41:26)."
      - "Compare Gen 6:1-4 (giants born of an illicit union) for the monstrous offspring theme."
  - id: ane-etcsl-1-6-2-first-march
    tradition: ane-sumerian
    title: "Lugal-e: Ninurta's war-cry, cosmic convulsion and first march; Šar-ur scouts"
    corpus: ane
    original: true
    tagger: Claude (model), reading the Sumerian
    read: ["ETCSL 1.6.2 70-121"]
    tags:
      - {motif: theophany-earth-quakes-mountains-melt, refs: ["ETCSL 1.6.2 70-72"], note: "an ba-sag3 ki ĝiri3-ni-še3 ba-tuš: heaven trembled, earth huddled at his feet; kur ba-gul, the mountains were devastated"}
      - {motif: gods-flee-in-terror, refs: ["ETCSL 1.6.2 71-74"], note: "Enlil ba-suḫ3 e2-kur-ra ba-ta-e3; the Anuna disappear over the horizon udu-gin7 'like sheep'"}
      - {motif: god-rides-cherub-on-wings-of-wind, refs: ["ETCSL 1.6.2 77"], note: "ki-bal-še3 tum9 8 mu-un-u5: he rode on the eight winds towards the rebel lands (no cherub)"}
      - {motif: rain-of-fire-and-sulfur-cup, refs: ["ETCSL 1.6.2 86"], note: "u3-dub2 i3-šeĝ3 izi i3-sud-sud-sud izi lu2 ba-an-zal-e: it rained coals, flaming fires consumed men"}
      - {motif: storm-breaks-cedars-of-lebanon, refs: ["ETCSL 1.6.2 87"], note: "ĝiš maḫ ur2-bi-a mu-un-bal-e: overturned tall trees by their trunks, forests to heaps"}
      - {motif: battle-storm-ravages-birds-fish-beasts, refs: ["ETCSL 1.6.2 92-94"], note: "birds' wings trail on the ground; fish in the engur gasp; animals of the edin roasted like locusts"}
      - {motif: talking-divine-weapon, refs: ["ETCSL 1.6.2 109-121"], note: "the lion-headed weapon flies like a bird (mušen-gin7 i3-dal-e), circles the horizon and reports the mountains' deliberations"}
    hints:
      - "Compare Ps 18:8-16 (earth quakes, God rides a cherub on the wings of the wind, coals of fire); Ps 29:5 (cedars broken); Ps 11:6 (rain of coals)."
      - "Compare Hos 4:3 and Zeph 1:3 (beasts, birds and fish swept away)."
  - id: ane-etcsl-1-6-2-asag-attacks
    tradition: ane-sumerian
    title: "Lugal-e: Šar-ur's warning, catalogue of slain foes; the Asag attacks and the gods cower"
    corpus: ane
    original: true
    tagger: Claude (model), reading the Sumerian
    read: ["ETCSL 1.6.2 122-190"]
    tags:
      - {motif: catalogue-of-slain-monsters, refs: ["ETCSL 1.6.2 128-134"], note: "ku-li-an-na, ušum (dragon), niĝ2-babbar2 (gypsum), urud (strong copper), šeg9-saĝ-6 (six-headed wild ram), ma2-gi4-lum boat, saman-an-na, gud-alim (bison), lugal ĝišnimbar (palm king), anzud, muš-saĝ-7"}
      - {motif: seven-headed-serpent-slain, refs: ["ETCSL 1.6.2 133-134"], note: "muš-saĝ-7 ... kur-ra ḫe2-mu-e-ni-ug5"}
      - {motif: monster-caught-in-gods-net-by-many-peoples, refs: ["ETCSL 1.6.2 122", "ETCSL 1.6.2 126"], note: "{sa}šu2-uš me3; sa-par3-gin7 u3-mu-e-dub: after gathering the enemy in the battle-net"}
      - {motif: sun-moon-darkened-stars-withdraw, refs: ["ETCSL 1.6.2 166-167"], note: "{d}utu la-ba-gub {d}suen ba-an-kur9 ... ud esir-re-eš ba-an-du3: the sun did not stand, the moon went in, the day became like pitch"}
      - {motif: gods-fear-the-monster, refs: ["ETCSL 1.6.2 182-185"], note: "An crouches wringing his hands, Enlil hides in a corner (da-še3), the Anuna flatten against the walls, sighing like pigeons (tum12-gin7)"}
      - {motif: gods-flee-in-terror, refs: ["ETCSL 1.6.2 182-185"]}
      - {motif: father-god-laments-absent-son, refs: ["ETCSL 1.6.2 187-190"], note: "nitalam-ĝu10 dumu-ĝu10 nu-ba-tuš ... šu-ĝu10 a-ba ba-gid2-i-de3"}
      - {motif: storm-theophany-arrows-thunder, refs: ["ETCSL 1.6.2 168-178"], note: "the Asag uproots the sky for a club, howls like a storm, roars like a giant snake, bathes the sky in blood (an-e uš2 bi2-ib2-tu5)"}
    hints:
      - "Compare Ps 74:13-14 and Isa 27:1 (many-headed Leviathan crushed); Rev 12:3 (seven-headed dragon)."
      - "Compare Joel 2:10, 3:4 and Josh 10:12-13 (sun and moon withdraw or stand in battle)."
      - "Compare Ezek 31:3-9 (the great cedar with shade) for the 'cedar rooted in the abzu'."
  - id: ane-etcsl-1-6-2-second-battle
    tradition: ane-sumerian
    title: "Lugal-e: Enlil's instructions, the second battle and Šar-ur's warning"
    corpus: ane
    original: true
    tagger: Claude (model), reading the Sumerian
    read: ["ETCSL 1.6.2 191-280"]
    tags:
      - {motif: talking-divine-weapon, refs: ["ETCSL 1.6.2 191-196", "ETCSL 1.6.2 225-227"], note: "Šar-ur flies to Enlil in Nibru and back; lines 198-211 lost"}
      - {motif: god-forbids-extinction-of-species, refs: ["ETCSL 1.6.2 222-224"], note: "uĝ3 nam-ta-ab-la2-e ... numun na-an-ga-ma-ab-kal-le ... {d}en-lil2-me-en nam a-na-tar-ra-ĝa2 mu-bi na-ab-ḫa-lam-e: let him not diminish the people, not make seed scarce, not destroy the name of what I, Enlil, decreed; partly broken"}
      - {motif: dogs-lick-enemy-blood, refs: ["ETCSL 1.6.2 259-260"], note: "sur3 mud-e bi2-ib-tum3 ki-bal-a ga-gin7 ur-e ba-an-de2: crevasses filled with blood, dogs lapped it like milk"}
      - {motif: sun-moon-darkened-stars-withdraw, refs: ["ETCSL 1.6.2 246-247"], note: "restored: [ud] ku10-ku10-ga-še3 ba-an-[kur9]: day became dark night"}
      - {motif: weapons-useless-against-monster, refs: ["ETCSL 1.6.2 263"], note: "peš a2-sag3-a nu-ub-tuku4: the weapon did not shake the heart of the Asag"}
      - {motif: monster-cannot-be-caught-with-hook, refs: ["ETCSL 1.6.2 275"], note: "piriĝ zu2 sis mu-un-ra lu2 nu-mu-ni-in-dab5-be2: a lion with savage teeth, no man can catch it"}
      - {motif: storm-theophany-arrows-thunder, refs: ["ETCSL 1.6.2 244-258"], note: "the lance aimed at the mountains, arm stretched to the clouds, storm-wind raised to heaven"}
    hints:
      - "Compare 1 Kgs 21:19 and 22:38 (dogs lick blood); Gen 9:8-17 and Gen 6:19-20 (God preserves the species) for Enlil's order not to wipe out seed."
      - "Compare Job 41:1-10 (Leviathan cannot be captured)."
  - id: ane-etcsl-1-6-2-asag-slain
    tradition: ane-sumerian
    title: "Lugal-e: Ninurta crushes the Asag, washes, is acclaimed, and names it 'Stone'"
    corpus: ane
    original: true
    tagger: Claude (model), reading the Sumerian
    read: ["ETCSL 1.6.2 281-332"]
    tags:
      - {motif: sea-monster-defeated-by-god, refs: ["ETCSL 1.6.2 288-297"], note: "not a sea monster but a mountain one: he pounds the Asag like roasted barley (še šeĝ6-ĝa2-gin7), uproots it like esparto grass, heaps it like flour"}
      - {motif: warrior-washes-blood-after-battle, refs: ["ETCSL 1.6.2 302-303"], note: "ib2-la2 {ĝiš}tukul a mu-[X] ... tug2 uš2-a mu-un-tu5: washes belt and mace, washes the blood from his clothes, wipes his brow; sings a victory chant over the corpse (ad6-a za-pa-aĝ2)"}
      - {motif: gods-prostrate-before-victor, refs: ["ETCSL 1.6.2 305-308"], note: "diĝir kalam-ma mu-un-na-sug2-ge-eš ... like exhausted wild asses they prostrate"}
      - {motif: incomparability-among-the-gods, refs: ["ETCSL 1.6.2 310-311"], note: "ur-saĝ a-ba za-gin7 ... zag-zu ba-ra-ga-an-til: hero, who is like you? beside you there is no one"}
      - {motif: god-decrees-name-henceforth, refs: ["ETCSL 1.6.2 327-328"], note: "[ud]-da-ta a2-sag3 nam-ba-DI na4 mu-bi ḫe2-[em]: from today do not say Asag, its name shall be Stone"}
      - {motif: slain-monster-made-into-cosmos, refs: ["ETCSL 1.6.2 327-330"], note: "ur5-ra-am3 bar-bi irigal ḫe2-em: its entrails (bar) shall be the underworld (irigal); lines 319-322 and 333 lost"}
      - {motif: victory-song-after-deliverance, refs: ["ETCSL 1.6.2 303", "ETCSL 1.6.2 309-314"]}
    hints:
      - "Compare Isa 63:1-3 (the warrior's garments stained with blood) and Exod 15:11 ('who is like you among the gods')."
      - "Compare Ps 74:13-17 and Enuma elish IV for the slain enemy's body built into the cosmos."
