  - id: ane-etcsl-1-8-1-3-v3-assembly
    tradition: ane-sumerian
    title: "Death of Gilgamesh (Me-Turan version): the assembly of the gods, Enki on the flood, Gilgamesh made judge of the dead"
    corpus: ane
    original: true
    tagger: Claude (model), reading the Sumerian
    version: "Me-Turan version (segment 3.F)"
    read: ["ETCSL 1.8.1.3 3.F:1-174"]
    tags:
      - {motif: deathbed-dream-of-divine-assembly, refs: ["ETCSL 1.8.1.3 3.F:3-9", "ETCSL 1.8.1.3 3.F:100-103"], note: "pu-uḫ-rum ki saĝ-ki diĝir-re-ne-ke4; ma-mu-da-bi en nu-dim2-mu-da10 igi-bi ba-ni-ib-tu: Nudimmud made him see the dream"}
      - {motif: gods-review-heros-deeds, refs: ["ETCSL 1.8.1.3 3.F:10-18", "ETCSL 1.8.1.3 3.F:104-113"], note: "{ĝiš}erin ĝiš dili kur-bi ga-an-e-de3, {d}ḫu-wa-wa tir-bi-ta saĝ ĝiš ra-ra-za, na-du3-a ud ul-la2-še3, e2 diĝir-re-e-ne ki ĝar-ĝar-ra, zi-ud-su3-ta-aš ... saĝ im-ma-ni-ti"}
      - {motif: hero-restores-forgotten-rites, refs: ["ETCSL 1.8.1.3 3.F:16-18"], note: "me ki-en-gi-ra-ke4 ... ḫa-la-me-eš ... kalam-ma-aš im-ta-a-ni šu-luḫ ka-luḫ si mu-un-si-sa2-e: hand-washing and mouth-washing rites"}
      - {motif: no-more-immortality-after-flood, refs: ["ETCSL 1.8.1.3 3.F:27-35", "ETCSL 1.8.1.3 3.F:120-128"], note: "pu-uḫ-ru-um a-ma-ru ba-ur3-ra-ta numun nam-lu2-ulu3 ḫa-la-me-de3 ... zi-ud-su3-ra2 ... nam-til3-am3 ... zi an-na zi ki-a mu-un-pad3-da-nam ud-bi-ta nam-lu2-ulu3-ur2 nu-mu-un-til3-am3: then you made me swear by heaven and earth that no human would live (forever) again"}
      - {motif: oath-by-heaven-and-earth, refs: ["ETCSL 1.8.1.3 3.F:34", "ETCSL 1.8.1.3 3.F:127"]}
      - {motif: lifespan-limited-120, refs: ["ETCSL 1.8.1.3 3.F:35", "ETCSL 1.8.1.3 3.F:128"], note: "loose: a post-flood divine limit on human life, here eternal life excluded, not a number of years"}
      - {motif: dead-king-made-judge-of-underworld, refs: ["ETCSL 1.8.1.3 3.F:38-41", "ETCSL 1.8.1.3 3.F:82-86", "ETCSL 1.8.1.3 3.F:131-134"], note: "šagina kur-ra ḫe2-ak-e palil gidim ḫe2-nam di-da mu-un-kud-da ... inim {d}nin-ĝiš-zid-da {d}dumu-zid-da-gin7"}
      - {motif: death-is-human-lot-from-birth, refs: ["ETCSL 1.8.1.3 3.F:143-151"], note: "repeats 1.E:17-25; iri-gal šag4 zu2 keše2-da nam-ba-an-ed2-de3: do not go to the Great City with a knotted heart"}
      - {motif: dead-meet-kin-in-underworld, refs: ["ETCSL 1.8.1.3 3.F:63-81", "ETCSL 1.8.1.3 3.F:154-172"], note: "ki a-a-zu pap-bil-ga-zu ama-zu nin9-zu ... gu5-li {d}en-ki-du10 ... ab-ba iri-za-kam mu-ši-du-un"}
      - {motif: gathered-to-his-people, refs: ["ETCSL 1.8.1.3 3.F:63-81", "ETCSL 1.8.1.3 3.F:154-172"]}
      - {motif: land-of-darkness-and-chaos, refs: ["ETCSL 1.8.1.3 3.F:141-142"], note: "si-si-ig dumu {d}utu-ke4 ki-bi ku3-ku3-ga ud-še3 mi-ni-in-ĝar"}
      - {motif: hero-visits-flood-survivor, refs: ["ETCSL 1.8.1.3 3.F:15"], note: "zi-ud-su3-ta-aš ki-tuš-bi-a saĝ im-ma-ni-ti: you reached Zi-ud-sura in his dwelling"}
    hints:
      - "Compare Gen 6:3 (God limits human life after the sons of God episode) and Gen 3:22 (lest he live forever)."
      - "Compare Gen 25:8, 35:29 and 49:33 (gathered to his people) and Isa 14:9-10 (the dead kings greet the newcomer)."
      - "Compare Ps 26:6 and Exod 30:18-21 (hand-washing rites)."
  - id: ane-etcsl-1-8-1-3-v3-tomb
    tradition: ane-sumerian
    title: "Death of Gilgamesh (Me-Turan version): Enki interprets the dream; the tomb in the Euphrates; statues keep names alive"
    corpus: ane
    original: true
    tagger: Claude (model), reading the Sumerian
    version: "Me-Turan version (segments 3.G-3.K)"
    read: ["ETCSL 1.8.1.3 3.G:1-5", "ETCSL 1.8.1.3 3.H:1-41", "ETCSL 1.8.1.3 3.I:1-10", "ETCSL 1.8.1.3 3.J:1-11", "ETCSL 1.8.1.3 3.K:1-12"]
    tags:
      - {motif: interpretation-from-god, refs: ["ETCSL 1.8.1.3 3.H:7-9"], note: "diĝir-bi {d}en-ki ... ma-mu-da ki-bur2-ni igi-bi ba-ni-ib-du8 ... lu2 na-me nu-bur2-bur2: his god Enki showed where the dream's solution lay; no one else could solve it"}
      - {motif: tomb-built-in-diverted-riverbed, refs: ["ETCSL 1.8.1.3 3.H:10-32"], note: "niĝir-e kur-kur-ra si gu3 ba-ni-ra; unug{ki} zig3-ga-a-bi a-ma-ru-kam: Unug's levy was a flood; ki-maḫ-bi na4 ba-da-an-du; kiĝ2-kiĝ2 muš-bi nam-ba-ni-pad3-de3: the searchers shall not find it"}
      - {motif: god-buries-prophet-unknown-grave, refs: ["ETCSL 1.8.1.3 3.H:28-31"], note: "the tomb is covered and hidden so that those searching will not find it"}
      - {motif: retinue-buried-with-king, refs: ["ETCSL 1.8.1.3 3.H:33-41"], note: "dam ki aĝ2-a-ni dumu tur ki aĝ2-a-ni dam tam dam ban3-da; rest broken"}
      - {motif: funerary-statue-keeps-name-alive, refs: ["ETCSL 1.8.1.3 3.K:5-11"], note: "alan-bi ud ul-la-ta ba-dim2-dim2 e2 diĝir-re-e-ne zag-še3 ĝar-ĝar-ra mu-bi dug4-dug4-ga nam-ba-e-da-ḫa-la-me-eš: their names once uttered are not forgotten"}
      - {motif: eunuchs-given-monument-and-name, refs: ["ETCSL 1.8.1.3 3.K:5-11"], note: "statue in the temples as a lasting name"}
      - {motif: mourning-rites-torn-clothes-dust, refs: ["ETCSL 1.8.1.3 3.K:2"], note: "saḫar-ra ba-an-šar2-šar2-re: smeared with dust; 3.I:7 a bi-bar-bar-re"}
      - {motif: sumerian-zami-doxology, refs: ["ETCSL 1.8.1.3 3.K:12"], note: "{d}ereš-ki-gal ama {d}nin-a-zu-ke4 za3-mi2-zu dug3-ga"}
    hints:
      - "Compare Isa 56:5 (a monument and a name better than sons) and 2 Sam 18:18 (Absalom's pillar 'to keep my name in remembrance')."
      - "Compare Deut 34:6 (the unknown grave) and Gen 41:16 (interpretation from God)."
