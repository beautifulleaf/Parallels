# Full read, chunk 29: SAA 20 026, 024, 027, 008, 049, 048 (Assyrian royal rituals and the Aššur
# divine directory), Cyrus II 01 (the Cyrus Cylinder), Sennacherib 022 (Chicago/Taylor prism),
# Esarhaddon 001 (Nineveh prism A), Esarhaddon 104 and 105 (Babylon inscriptions).
# Read from ORACC lemmatized transliteration (saao/saa20, ribo/babylon8, rinap/rinap3, rinap/rinap4).
new_motifs:
  king-establishes-rite-for-god: {label: "A ritual text is headed with the claim that a named king performed and fixed this rite (parṣu) for a god", cluster: cult}
  hymn-incipit-sung-at-each-offering: {label: "A ritual prescribes, after each strewn offering and libation, a named hymn or prayer incipit to be sung", cluster: cult}
  offerings-to-gods-before-ritual-bed: {label: "Offerings are set before the Igigi and Anunnaki gods 'before the bed' (mayyālu) prepared in a rite", cluster: cult}
  seven-metals-laid-out-in-ritual: {label: "One mina each of iron, lead, gold, silver, bronze, tin and glass (with coloured wools) is laid out as ritual material", cluster: cult}
  ritual-twice-performed-seed-prospers: {label: "Ritual promise: whoever performs this rite twice before the god, his seed (offspring) will prosper", cluster: cult}
  ritual-loosens-anger-of-personal-god: {label: "A rite asks that the heart of a man's angry god and goddess be 'loosened' and his evil released; the angry protective spirit of the house is reconciled", cluster: cult}
  funerary-offering-to-netherworld-gods: {label: "A funerary offering (kispu) is made to the netherworld gods (Anunnaki) within a royal rite", cluster: cult}
  offering-to-sun-god-on-roof: {label: "Part of the rite is performed on the roof before the sun god, with oil and a censer lifted up", cluster: cult}
  divine-directory-of-city: {label: "A list assigns every god and divine symbol of a city to its temple, shrine or courtyard, with totals per temple", cluster: cult}
  deified-justice-and-truth: {label: "Justice (Mišaru) and Truth (Kittu) are worshipped as gods with places in a temple", cluster: cult}
  ceremonial-names-of-city-gates: {label: "The gates of a city each bear a sentence-name praising a god or the king (e.g. 'Aššur subdues the rebels')", cluster: cult}
  temple-names-glossed: {label: "A list gives each temple's Sumerian ceremonial name with an Akkadian rendering ('House of life', 'House of the secret of heaven and earth')", cluster: cult}
  royal-statue-housed-among-gods: {label: "A statue of a king stands among the divine images in a temple", cluster: kingship}
  impious-king-perverts-cult: {label: "An impious king makes a counterfeit of the chief temple, introduces improper rites, stops the regular offerings and ends the fear of the chief god", cluster: kingship}
  oppressor-yoke-without-rest: {label: "The tyrant ruins his own city's people under a corvée yoke without rest, daily", cluster: kingship}
  god-angered-by-peoples-complaint: {label: "The people's complaint (tazzimtu) reaches the chief god, who becomes furious at the ruler", cluster: kingship}
  god-searches-lands-for-righteous-ruler: {label: "The god surveys all the lands looking for an upright ruler after his own heart", cluster: kingship}
  god-grasps-hand-of-chosen-foreign-king: {label: "The god takes a foreign king by the hand, calls his name and names him to rule the whole world", cluster: kingship}
  god-walks-beside-king-as-friend: {label: "The god goes at the king's side like a friend and companion on his march", cluster: kingship}
  army-countless-as-river-water: {label: "The king's army is as countless as the water of a river", cluster: war}
  city-entered-without-battle: {label: "The conqueror enters the enemy capital without battle or fighting, by the god's will", cluster: war}
  subjects-kiss-feet-of-king: {label: "Subject peoples or vassal kings come and kiss the king's feet in submission", cluster: kingship}
  royal-genealogy-to-dynastic-founder: {label: "The king traces his line through father and grandfather to a dynastic founder, 'eternal seed of kingship'", cluster: kingship}
  king-lifts-yoke-from-citizens: {label: "The new king relieves the city's weariness and frees its people from an unfitting yoke", cluster: kingship}
  captured-gods-returned-to-their-sanctuaries: {label: "The king returns the deported statues of gods to their own cities and settles them in an eternal dwelling", cluster: cult}
  deported-peoples-returned-to-their-homes: {label: "The king gathers deported or scattered peoples and returns them to their settlements", cluster: kingship}
  gods-asked-to-intercede-for-king: {label: "The king asks the gods he has restored to speak daily before the chief god for his long life and good name", cluster: cult}
  kings-of-west-in-tents-bring-tribute: {label: "All the kings of the west (Amurru), from the upper to the lower sea, including those who live in tents, bring heavy tribute", cluster: kingship}
  predecessors-inscription-found-in-rebuilding: {label: "While rebuilding, the king finds an inscription of an earlier king and honours it", cluster: kingship}
  royal-epithet-chain: {label: "A royal inscription opens with a chain of titles (great king, mighty king, king of the world, king of Assyria, king of the four quarters, shepherd)", cluster: kingship}
  defeated-king-flees-alone-like-bird: {label: "A defeated king abandons his army and flees alone like a bird to save his life", cluster: war}
  enemy-palace-treasure-and-women-carried-off: {label: "The conqueror opens the enemy palace treasury and carries off gold, silver, palace women, courtiers and musicians as booty", cluster: war}
  king-climbs-mountains-on-foot: {label: "Where the chariot cannot go, the king climbs steep mountains on foot like a wild bull, resting on rocks and drinking from a waterskin", cluster: war}
  conquered-city-renamed-for-king: {label: "A conquered city is rebuilt and renamed after the conquering king (Kar-Sennacherib, Kar-Esarhaddon)", cluster: war}
  victory-stela-set-up-in-conquered-city: {label: "The king has a stela inscribed with his victory set up in the conquered city", cluster: war}
  vassal-king-installed-on-throne: {label: "The overlord sets a loyal king on the throne of a conquered city and imposes yearly tribute", cluster: kingship}
  western-kings-bring-tribute-list: {label: "A list of named kings of the Levant (Sidon, Arwad, Byblos, Ashdod, Ammon, Moab, Edom ...) who bring tribute and kiss the king's feet", cluster: kingship}
  rebel-king-deported-with-family-gods: {label: "A rebel king is deported with the gods of his father's house, his wife, sons, daughters and brothers", cluster: war}
  loyal-king-handed-over-in-iron-fetters: {label: "Rebels put their loyal, treaty-bound king in iron fetters and hand him over to a hostile neighbouring king", cluster: war}
  rebels-executed-innocent-spared: {label: "The conqueror kills the guilty officials and deports the sinners, but releases the rest who bore no guilt", cluster: war}
  besieged-king-shut-up-like-caged-bird: {label: "The besieged king is shut up in his royal city 'like a bird in a cage'", cluster: war}
  fortified-cities-of-judah-captured: {label: "The invader besieges and takes forty-six walled cities of Judah and countless villages", cluster: war}
  conquered-land-given-to-neighbour-kings: {label: "Cities taken from a rebel are cut off and given to loyal neighbouring kings, so his land is diminished", cluster: war}
  besieged-king-sends-tribute-and-daughters: {label: "The besieged king sends gold, silver, precious goods, his daughters, palace women and musicians after the conqueror to his capital", cluster: war}
  terror-of-kings-radiance-overwhelms: {label: "The fearsome radiance (pulhi melamme) of the king's lordship overwhelms the enemy", cluster: war}
  king-of-judah-named-in-foreign-record: {label: "A king of Judah (Hezekiah, Manasseh) is named in a foreign royal inscription", cluster: war}
  enemy-flees-by-sea-with-gods: {label: "A defeated king loads his gods into boats and flees across the sea to a distant city", cluster: war}
  kings-son-set-over-conquered-land: {label: "The conqueror sets his own son on the throne of the conquered land", cluster: kingship}
  cities-like-eagles-nests-on-peaks: {label: "Mountain cities are set on the peaks like the nests of the eagle, prince of birds", cluster: war}
  army-crosses-sea-in-ships: {label: "The king has his army cross the sea in ships built by western shipwrights to attack the enemy", cluster: war}
  winter-storm-forces-retreat: {label: "Bitter cold, heavy rain and snow in the winter month force the king to turn back", cluster: war}
  enemy-king-dies-before-his-time: {label: "By the god's command an enemy king dies suddenly within months, 'on a day not his fate'", cluster: war}
  enemy-armies-like-locust-swarm: {label: "The allied enemy armies advance like a great swarm of locusts in spring", cluster: war}
  king-prays-to-gods-before-battle: {label: "Before battle the king prays to his gods for victory and they hear his prayer at once", cluster: war}
  king-arms-and-roars-like-storm-god: {label: "The king puts on armour and helmet, mounts his chariot in fury and roars like the storm god", cluster: war}
  battlefield-blood-like-river: {label: "The blood of the slain flows like a river over the plain and the chariot wheels are steeped in blood and gore", cluster: war}
  enemies-soil-themselves-in-terror: {label: "Fleeing enemies in terror urinate and defecate in their chariots", cluster: war}
  palace-without-rival-built: {label: "The king builds a 'palace without rival' on a raised terrace with cedar beams, bronze-bound doors and colossal guardian figures", cluster: kingship}
  future-king-to-anoint-inscription: {label: "A future king who restores the building is to find the inscription, anoint it with oil, sacrifice and return it to its place", cluster: kingship}
  younger-son-chosen-heir-by-gods: {label: "Though the youngest of his brothers, the son is named heir by the gods and his father in the assembly of his brothers", cluster: kingship}
  people-swear-loyalty-to-crown-prince: {label: "The people and the brothers are made to swear an oath by the gods (with water and oil) to protect the designated heir", cluster: treaty}
  brothers-slander-chosen-heir: {label: "Jealous brothers spread slander and falsehood against the chosen heir and turn the father's heart against him", cluster: kingship}
  gods-hide-chosen-in-secret-place: {label: "The gods remove the threatened heir to a secret place and spread their protection over him", cluster: kingship}
  brothers-fight-for-throne: {label: "After the father's fall the brothers rebel and butt each other like young goats for the kingship", cluster: kingship}
  king-rends-garment-and-cries-woe: {label: "Hearing of the revolt, the king cries 'woe', tears his princely garment and rages like a lion", cluster: kingship}
  king-marches-in-midwinter-without-delay: {label: "The king sets out at once in the cold of winter without waiting a day or preparing his troops", cluster: war}
  goddess-breaks-enemies-bows: {label: "The war goddess stands at the king's side and breaks his enemies' bows", cluster: war}
  enemy-troops-acclaim-rival-as-king: {label: "The opposing troops declare 'this is our king' and go over to him", cluster: kingship}
  defeated-pretenders-flee-abroad: {label: "The defeated rival princes abandon their troops and flee to an unknown land", cluster: kingship}
  prophetic-messages-encourage-king: {label: "Messages of ecstatic prophets (mahhû), sent by gods and goddesses, constantly reach and encourage the king", cluster: prophecy}
  favourable-signs-in-heaven-and-earth: {label: "Favourable signs appear in heaven and on earth for the king's rule or work", cluster: prophecy}
  conspirators-and-their-seed-destroyed: {label: "The king gathers the guilty who incited the rebellion, punishes them and destroys their seed", cluster: kingship}
  oath-breaker-slain-in-exile: {label: "A rebel who broke the oath of the great gods flees abroad and is killed there by the sword", cluster: treaty}
  king-caught-like-fish-from-sea: {label: "A king who fled to the sea is caught 'like a fish' from the midst of the sea and beheaded", cluster: war}
  severed-heads-hung-on-nobles-necks: {label: "The severed heads of rebel kings are hung round the necks of their nobles, paraded through the capital with singers and lyre", cluster: war}
  captive-kept-at-gate-with-animals: {label: "A captive king (or rebel) is kept chained at the city gate with a bear, a dog and a pig, or in a kennel", cluster: war}
  gods-of-defeated-renewed-and-returned: {label: "The king renews captured gods, writes the might of his god and his own name on them, and gives them back to their people", cluster: cult}
  desert-of-thirst-snakes-and-scorpions: {label: "A far desert land of salt and thirst, where snakes and scorpions fill the ground like ants", cluster: war}
  vassal-kings-haul-cedars-of-lebanon: {label: "Twenty-two vassal kings of the west and the islands (including Judah) are made to haul cedar beams from Lebanon and Sirara for the king's building", cluster: kingship}
  palace-inauguration-feast: {label: "At the inauguration the gods are invited and given offerings, and the officials and people are feasted with wine and their heads anointed with oil", cluster: kingship}
  builders-work-with-song-and-joy: {label: "The workers carry hoe and basket in joy and song, the mortar mixed with beer and wine", cluster: kingship}
  citizens-say-yes-for-no: {label: "In the days of a former king the citizens answer one another 'yes' for 'no' and speak lies", cluster: kingship}
  people-neglect-gods-and-rites: {label: "The people neglect their gods, abandon their goddesses and their rites, and go other ways", cluster: cult}
  chief-god-plans-to-destroy-land: {label: "The chief god, enraged, plans evil to flatten the land and destroy its people", cluster: kingship}
  city-destroyed-by-river-flood-like-deluge: {label: "A raging canal flood, like the deluge (abūbu), sweeps over the city and turns it to a ruin heap", cluster: kingship}
  gods-fly-from-city-like-birds: {label: "The gods dwelling in the city fly up to heaven like birds", cluster: cult}
  citizens-scattered-and-enslaved-abroad: {label: "The city's people flee elsewhere and go into slavery in a foreign land", cluster: kingship}
  seventy-years-of-desolation-written: {label: "The god writes down seventy years as the term of a city's desolation", cluster: prophecy}
  merciful-god-shortens-term-of-punishment: {label: "The merciful god, his heart calmed, overturns the decreed term (seventy turned upside down into eleven years) and orders resettlement", cluster: prophecy}
  king-commissioned-to-restore-holy-city: {label: "The gods charge the chosen king to return the gods, rebuild the holy city and its temple and reconcile the angry gods", cluster: kingship}
  extispicy-approves-temple-rebuilding: {label: "The king kneels before the gods and the diviners' extispicy gives a firm 'yes' to rebuild the temple", cluster: cult}
  bricks-moulded-with-oil-honey-wine: {label: "The bricks or mortar of the temple are mixed with oil, honey, ghee, wine and beer", cluster: cult}
  temple-rebuilt-exactly-on-old-foundation: {label: "The temple is rebuilt on its old foundations, not deviating a cubit or half a cubit from the old plan", cluster: cult}
  temple-as-replica-of-cosmic-abode: {label: "The rebuilt temple is a replica of the Apsû, a counterpart of the heavenly Ešarra and of a constellation", cluster: cosmology}
  damaged-divine-images-renewed: {label: "The king renews the divine images damaged by water and mud and resettles them on their daises forever", cluster: cult}
  freed-citizens-clothed-and-led-home: {label: "The city's citizens who were sold into slavery are gathered, clothed and set back on the road home", cluster: kingship}
  returnees-encouraged-to-build-and-plant: {label: "The king encourages the returned citizens to build houses, plant orchards and dig canals", cluster: kingship}
  exemption-tablets-rewritten: {label: "The king rewrites the tablets of the holy city's exemptions and opens its roads to the four winds", cluster: kingship}
  kingship-pleasing-like-plant-of-life: {label: "Prayer that the king's rule be pleasing to the people like the plant of life", cluster: kingship}
  blessing-rain-flood-harvest-for-king: {label: "Blessing on the king's reign: rains, floods, good harvests and grain heaped on the threshing floors", cluster: kingship}
  curse-on-violator-of-holy-city-privilege: {label: "Curse on whoever alters the king's inscription or abolishes the holy city's privileges: may the chief god look on him in anger and decree his death", cluster: kingship}
  tent-pitched-for-rite-by-river: {label: "A tent is pitched on the river bank with its door facing the sun for a royal rite", cluster: cult}
  fire-kindled-before-god-at-evening: {label: "On a set evening fire is kindled in the temple and a ram is burnt on a brazier before the god", cluster: cult}
  bed-set-up-for-god: {label: "A bed is set up for the god in a rite", cluster: cult}
  gatekeeper-gods: {label: "Named gods serve as the divine gatekeepers of a temple", cluster: cult}
  ziggurats-of-city-listed: {label: "The ziggurats of a city are listed by their ceremonial names and gods", cluster: cult}
  nations-subdued-before-chosen-king: {label: "The god makes whole peoples bow at the feet of his chosen king", cluster: kingship}
  bird-offerings-geese-ducks-doves: {label: "Geese, ducks and turtledoves are offered daily to the gods", cluster: cult}
  cedar-doors-bound-with-bronze: {label: "The king sets up great cedar doors bound with bronze in the city or temple gates", cluster: kingship}
  aramean-tribes-listed: {label: "A list of Aramean and Arab tribes (Hagaranu, Nabatu and others) conquered together", cluster: war}
  offerings-instituted-for-gods-from-conquest: {label: "From a conquered district the king fixes a perpetual yearly offering of first-fruits (oxen, sheep, wine, dates) for his gods", cluster: cult}
  peoples-of-conquered-lands-resettled: {label: "The king settles peoples from other conquered lands in a captured city and puts it under his governor", cluster: war}
  distant-land-never-heard-of-brings-tribute: {label: "A distant people whose name the king's fathers had never heard brings tribute and submits", cluster: kingship}
  philistine-cities-taken: {label: "Coastal cities of Philistia (Joppa, Bene-berak, Azor, Beth-Dagon) are captured", cluster: war}
  siege-earthworks-around-city: {label: "The besieger throws up fortifications around the city and blocks anyone leaving its gate", cluster: war}
  elite-troops-desert-besieged-city: {label: "The troops brought in to strengthen the besieged capital desert or leave", cluster: war}
  road-no-king-before-travelled: {label: "The king goes by untrodden paths where no earlier king had gone", cluster: war}
  list-of-conquered-towns: {label: "A long list of conquered towns is given by name", cluster: war}
  smoke-of-burning-cities-covers-sky: {label: "The smoke of the burning cities covers the face of the sky like a heavy cloud", cluster: war}
  fear-falls-on-enemy-king: {label: "Fear falls on the enemy king and he abandons his capital", cluster: war}
  foolish-successor-without-sense: {label: "The enemy king's successor is a man without sense or counsel", cluster: kingship}
  rebel-leader-gathers-outlaws: {label: "A fugitive rebel gathers runaways, outlaws and murderers round him in the marshes and is made king", cluster: kingship}
  bow-of-god-given-to-king: {label: "The god's mighty bow is put into the king's hand for battle", cluster: war}
  corpses-fill-plain-like-grass: {label: "The bodies of the slain fill the plain like grass", cluster: war}
  mutilation-of-enemy-dead: {label: "The victor cuts the throats and hands of the slain and strips their gold ornaments", cluster: war}
  cedars-from-amanus-for-building: {label: "Great cedar beams grown on Mount Amanus roof the king's palace or temple", cluster: kingship}
  palace-of-hittite-style-bit-hilani: {label: "A palace of limestone and cedar is built 'in the Hittite (Syrian) style'", cluster: kingship}
  protective-colossi-at-palace-gates: {label: "Colossal bull and lion guardian figures (šēdu, lamassu) of stone or bronze stand at the palace gates", cluster: kingship}
  eponym-date-formula: {label: "A text is dated by month and the eponym official (limmu) of the year", cluster: kingship}
  army-crosses-river-as-ditch: {label: "The king has his whole army leap across a broad river as if it were a ditch", cluster: war}
  gods-give-king-weapons-and-gifts: {label: "Each great god gives the king a gift: destiny, name, fear of his kingship, fury, a strong bow and arrow", cluster: kingship}
  rebel-ignores-good-treaty-forgets-salt: {label: "A vassal who did not keep the treaty or remember the 'salt' (kindness) of his overlord rebels", cluster: treaty}
  brother-defects-to-overlord: {label: "The rebel's brother flees from his refuge to submit to the overlord and is given his brother's land", cluster: kingship}
  island-city-trusts-in-sea: {label: "An island city trusts in the sea to protect it and throws off the overlord's yoke", cluster: war}
  city-swept-away-like-deluge-into-sea: {label: "The conqueror levels the city like the deluge and throws its wall and buildings into the sea", cluster: war}
  northern-horde-gomer-cimmerians: {label: "The Cimmerians (Gimirrāya, Gomer), a horde from far away, are fought", cluster: war}
  holy-city-lands-restored-to-citizens: {label: "The king returns to the citizens of the holy city the fields a robber chieftain had seized", cluster: kingship}
  submission-in-terror-tribute-brought: {label: "Struck by terror, a chieftain brings tribute of animals to the king and kisses his feet; the king has mercy on him", cluster: kingship}
  fortress-as-door-against-enemy: {label: "A fortified city is set up 'like a door' barring the way of the enemy", cluster: war}
  arab-queens: {label: "Queens rule Arab tribes (Apkallatu, Tabūa, Iapaʾ, Baslu)", cluster: kingship}
  kings-and-queens-of-desert-killed: {label: "The kings and queens of a far desert land are killed and their corpses spread out", cluster: war}
  enemies-sway-like-reeds-in-storm: {label: "Hostile rulers sway like reeds in a storm at the king's name", cluster: war}
  island-kings-tremble: {label: "The kings of the sea, whose walls are the sea and who ride ships instead of chariots, tremble and their hearts flutter", cluster: war}
  people-of-sea-and-mountain-exchanged: {label: "The king moves the people of the sea to the mountains and of the mountains to the sea", cluster: war}
  envoys-seek-peace-and-swear: {label: "Distant kings send envoys of friendship and peace and swear by the great gods", cluster: treaty}
  royal-garden-replica-of-mountain: {label: "A royal park is planted as a replica of a far mountain with all aromatic and fruit trees", cluster: kingship}
  god-reconciled-with-city: {label: "Signs announce that the angry gods will be reconciled with their city", cluster: kingship}
  sin-and-shamash-answer-yes-monthly: {label: "Every month moon and sun at their appearance give a firm 'yes' about avenging the land", cluster: prophecy}
  wisdom-given-by-ea: {label: "The god of wisdom grants the king broad understanding to resettle the city and renew its shrines", cluster: wisdom}
  foundation-deposit-inscriptions: {label: "Inscribed stelae and clay inscriptions of precious metals and stones are placed in the foundation for the future", cluster: kingship}
  temple-vessels-made-of-gold-and-silver: {label: "The king makes the temple's utensils of gold and silver of fixed weight", cluster: cult}
  temple-personnel-reinstated: {label: "The king reinstates the temple's purification priests, lamentation priests and singers before the gods", cluster: cult}
  ziggurat-rebuilt: {label: "The temple tower is rebuilt on its old site", cluster: cult}
units:
  # ---------------- SAA 20 (rituals) ----------------
  - id: ane-saa-20-026-sin-natu-ritual
    tradition: ane-akkadian
    title: Tukulti-Ninurta I's nāṭu rite for Sîn (SAA 20 26)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    read: ["SAA 20 026 o:1-l.e:2"]
    tags:
      - {motif: king-establishes-rite-for-god, refs: ["SAA 20 026 o:1-2"], note: "epuš-ma Tukulti-Ninurta šar māt Aššur parṣī ana Sîn ... ukīn-ma iddin"}
      - {motif: seven-metals-laid-out-in-ritual, refs: ["SAA 20 026 o:18-19"]}
      - {motif: offerings-to-gods-before-ritual-bed, refs: ["SAA 20 026 o:41", "SAA 20 026 o:47-48", "SAA 20 026 o:52-r:1", "SAA 20 026 r:16-18"], note: "ina pān Igigi ina pān mayyāli"}
      - {motif: hymn-incipit-sung-at-each-offering, refs: ["SAA 20 026 o:36-51", "SAA 20 026 r:13-19"], note: "e.g. 'Anu abu ilī bānû kalāma rašubbu' (Anu, father of the gods, creator of all) tazammur; 'Nanna attā rāʾim šamê' tazammur"}
      - {motif: libations-of-beer-and-wine, refs: ["SAA 20 026 o:44-49"]}
      - {motif: ritual-twice-performed-seed-prospers, refs: ["SAA 20 026 r:42"], note: "2-šu dullu annû ina mahar Sîn ušallam-ma ēpaš zēršu išir"}
      - {motif: colophon-copied-and-collated, refs: ["SAA 20 026 r:43"]}
    hints:
      - "The repeated strew-offering, libation and song at each station recalls the psalm-singing at sacrifices in 2 Chr 29:27-28."
  - id: ane-saa-20-024-lady-of-mountain-natu
    tradition: ane-akkadian
    title: Tukulti-Ninurta I's nāṭu rite for the Lady of the Mountain, in a tent by the river (SAA 20 24)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    read: ["SAA 20 024 o:1-r:45'"]
    tags:
      - {motif: king-establishes-rite-for-god, refs: ["SAA 20 024 o:1-2"]}
