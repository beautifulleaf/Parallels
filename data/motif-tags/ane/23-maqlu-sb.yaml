# Full read of the ANE corpus, chunk 23: Maqlû (SB), Marduk's Address to the Demons, Syncretistic Hymn to Marduk, Great Prayer to Nabû, Cuthaean Legend of Narām-Sîn (MB, OB).
# Read from the eBL reconstructed Akkadian texts; eBL English translations used as reading aids.
new_motifs:
  gods-of-night-invoked-against-witch: {label: "The bewitched man calls on the gods of the night (the stars), Night personified and the night watches to hear his case against the witch", cluster: magic}
  night-as-veiled-bride: {label: "Night (mušītu) is personified as a veiled bride (kallātu kuttumtu)", cluster: cosmology}
  three-night-watches-personified: {label: "The three watches of the night (dusk, midnight, dawn) are addressed as powers who release spells or ward off evil", cluster: magic}
  bewitched-man-estranged-from-his-gods: {label: "Sorcery makes the victim's personal god and goddess turn away from him, so that god, king and noble become angry with him", cluster: magic}
  sufferer-sickening-to-all-who-see-him: {label: "The sufferer has become repulsive (sickening) in the eyes of all who see him", cluster: lament}
  sufferer-cannot-eat-or-drink: {label: "A gag or affliction keeps food and drink from the sufferer's mouth", cluster: lament}
  victim-pleads-lawsuit-against-witch-before-gods: {label: "The bewitched man brings a lawsuit against the witch before the gods: 'stand by me, hear my case, judge my case, render my verdict'", cluster: magic}
  witch-figurines-made-and-set-before-gods: {label: "The victim makes figurines of his witch and warlock and sets them before the gods (or hands them to the fire god) as the accused in his lawsuit", cluster: magic}
  may-she-die-but-i-live: {label: "Formula: 'may she (the witch) die, but I live' (šī limūt-ma anāku lubluṭ)", cluster: magic}
  purifying-trees-and-plants-invoked: {label: "Purifying plants and trees are asked to cleanse and release the speaker: tamarisk, date palm, soapwort, conifer cone", cluster: magic}
  pure-as-grass-clean-as-nard: {label: "The purified speaker declares himself pure like grass, clean and innocent like nard", cluster: magic}
  witchs-word-turned-back-into-her-mouth: {label: "The witch's word is turned back into her own mouth and her tongue constricted", cluster: magic}
  witch-mouth-tallow-tongue-salt: {label: "May the witch's mouth be tallow and her tongue salt: her evil word drips away like tallow, her witchcraft dissolves like salt", cluster: magic}
  witchcraft-loosed-bonds-broken: {label: "The witch's spells, bonds and knots are loosed and undone (pašāru, puṭṭuru) and her deeds nullified", cluster: magic}
  spell-ends-by-command-of-named-gods: {label: "An incantation closes by declaring that it acts 'by the command pronounced by' named gods (ina qibīt iqbû)", cluster: magic}
  gilgamesh-enforcer-of-netherworld-oath: {label: "Gilgameš is invoked as lord (enforcer) of the oath imposed on the netherworld powers", cluster: underworld}
  i-know-your-deeds-you-know-not-mine: {label: "The speaker tells his enemies: whatever you have done I know, whatever I do you do not know", cluster: magic}
  city-with-gate-of-sunrise-and-sunset: {label: "The speaker's (mythical) city has two gates, one toward sunrise and one toward sunset", cluster: cosmology}
  reciprocal-purification-with-gods: {label: "The speaker purifies the gods with water and asks: as I purify you, so purify me", cluster: magic}
  witchcraft-of-all-lands-enclosed: {label: "The exorcist encloses (blocks) the ford and the quay, and with them the witchcraft of all the lands", cluster: magic}
  lock-placed-on-witchs-mouth: {label: "A lock or seal is placed on the mouth of the warlock and witch to silence them", cluster: magic}
  god-not-to-answer-witch-but-me: {label: "The deity is asked not to answer or listen to the witches when they call, but to answer and listen to the speaker", cluster: prayer}
  exorcist-sent-by-god: {label: "The exorcist declares 'I have been sent, I will go; I have been commissioned, I will speak', sent by the divine lord of exorcism", cluster: magic}
  heaven-earth-river-land-summoned-to-hear: {label: "The speaker summons those of heaven and netherworld, river and dry land to pay heed and listen to his speech", cluster: magic}
  wind-and-road-stilled-for-testimony: {label: "The wind and the road are commanded to stand still while the speaker gives his testimony", cluster: magic}
  adversary-catalogue-male-and-female: {label: "Catalogue of paired male and female adversaries: warlock and witch, sorcerer and sorceress, enchanter, accuser, slanderer, persecutor, litigant, evildoer", cluster: magic}
  god-knows-enemies-i-do-not: {label: "The god knows the speaker's hidden enemies whom he himself does not know (by name, city, house)", cluster: magic}
  catalogue-of-kinds-of-witchcraft: {label: "A list of named kinds of witchcraft: love-magic and hate-magic, perversion of justice, Zikurrudû (cutting of life), muteness, pacification, madness", cluster: magic}
  bewitchment-bodily-symptoms-catalogue: {label: "The victim lists the bodily symptoms of bewitchment: mouth seized, neck trembling, chest pressed, spine bent, knees bound, potency taken, strength sapped", cluster: magic}
  witch-makes-victims-figurine: {label: "The witch makes figurines of the victim reproducing his features and works harm through them", cluster: magic}
  bewitched-food-and-drink-given: {label: "The witch feeds the victim bewitched food, gives him bewitched water, bathes him in dirty water and rubs him with harmful salves", cluster: magic}
  victim-betrothed-to-the-dead: {label: "The witch betroths or hands the victim over to a dead person and lays his life's water in a grave", cluster: magic}
  fire-god-judges-in-place-of-sun-god: {label: "The fire god (Girra or Nuska) is called upon to judge the case in place of Šamaš (and Sîn), the usual divine judges", cluster: magic}
  fire-god-burns-witch-refrain: {label: "Refrain commanding the fire god: 'burn, scorch, devour, consume, vanquish my warlock and my witch'", cluster: magic}
  divine-command-unalterable: {label: "The god's command cannot be altered and his assent cannot be changed", cluster: divine-attributes}
  reed-torch-raised-to-fire-god: {label: "The speaker raises a reed torch and kindles (sets alight) the fire god himself", cluster: magic}
  sorcery-returned-on-the-sorcerer: {label: "Talionic formula: bewitch the witch with the witchcraft with which she bewitched me", cluster: magic}
  witch-takes-spittle-hair-hem-footprint: {label: "The witch gathers the victim's spittle, hair, cut-off hem and the dust of his footprints to work magic on him", cluster: magic}
  figurines-melt-smoke-rises-to-heaven: {label: "Burning figurines are told to melt, dissolve and drip away, their smoke to rise to heaven and the sun to quench their embers", cluster: magic}
  lilu-lilitu-ardat-lili: {label: "The lilû, lilītu and ardat-lilî (Lilith-type wind demons) are named among the evil spirits to be driven off", cluster: demons}
  god-hymn-without-you-no: {label: "Hymnic praise: 'without you' no meal is set out in the temple, no god smells incense, no judgment is given", cluster: hymn}
  suppliant-introduces-himself-so-and-so-son-of: {label: "The suppliant names himself before the god by formula: 'I, your servant, so-and-so, son of so-and-so, whose god is so-and-so, whose goddess is so-and-so'", cluster: prayer}
  save-me-that-i-may-praise-you: {label: "Vow of praise: 'save me, so that I may declare your greatness and sing your praises'", cluster: prayer}
  fire-god-called-light: {label: "The fire god is invoked as 'light' who illumines the houses of the gods, all lands and the darkness", cluster: hymn}
  suppliant-seizes-hem-of-god: {label: "The suppliant seizes the hem of the god's garment (and of his personal and city gods) in supplication", cluster: prayer}
  witch-seizes-limbs-of-victim: {label: "The witch has seized the victim's head, neck, eyes, feet, knees and arms, one by one", cluster: magic}
  crossed-bronze-figurines: {label: "Two crossed (crisscrossed) bronze figurines of the warlock and witch are handed to the fire god", cluster: magic}
  disease-demon-catalogue-hand-of-god: {label: "Catalogue of evil demons and diseases: utukku, alû, ghost, gallû, Lamaštu, epilepsy, 'Hand of a god', 'Hand of a ghost', 'Hand of a curse', and anything evil that has no name", cluster: demons}
  figurines-burned-with-sulphur: {label: "The figurines are burned with pure sulphur (kibrītu) before the god", cluster: magic}
  you-alone-my-god-my-judge-my-avenger: {label: "Confession: 'You alone are my god, my lord, my judge, my helper, my avenger'", cluster: prayer}
  may-they-die-i-live-antithetic-series: {label: "Antithetic series: may they die but I live, may they be bound but I go straight, may they end but I increase, may they weaken but I grow strong", cluster: magic}
  robber-to-plunder-witchs-goods: {label: "Curse: may a strong man take the witch's furnishings, a robber carry off her goods, a plunderer lie in wait at her resting place", cluster: curse}
  fire-god-gives-justice-to-oppressed: {label: "The fire god gives right decisions to gods and rulers and justice to the oppressed man and woman", cluster: justice}
  as-the-figurines-melt-so-the-witch: {label: "Analogy formula: as these figurines dissolve, melt and drip away, so may the warlock and witch dissolve, melt and drip away", cluster: magic}
  incantation-in-foreign-gibberish: {label: "An incantation begins in unintelligible foreign-sounding words (abracadabra, Elamite-like)", cluster: magic}
  witchs-acts-turned-back-in-similes: {label: "A series of similes listing what the witch does to the victim (wraps like a reed mat, clamps like a bird trap, covers like a net, sweeps out like house sweepings) is turned back point by point onto the witch", cluster: magic}
  witch-buries-figurine-in-grave: {label: "The witch takes clay from the river for the victim's figurine and buries it in a dark house, a tomb or grave", cluster: magic}
  oven-as-divine-daughter: {label: "The kiln or oven is addressed as a pure goddess, 'great daughter of Anu', in whose belly the fire god dwells", cluster: magic}
  i-do-not-know-your-name-or-city: {label: "The victim tells the unknown witch: I do not know your city, your house, your name, your dwelling", cluster: magic}
  gods-tear-out-witchs-tongue-erase-name: {label: "Curse that named gods kill the witch, erase her name, tear out her tongue and strike her cheek", cluster: curse}
  victim-innocent-witch-guilty-relies-on-god: {label: "The victim protests: I did not bewitch her, she bewitched me; she relies on her witchcraft, I rely on the god", cluster: magic}
  gods-sent-to-collect-witchs-seed: {label: "Great gods (Sîn, Šamaš, Nergal, Ištar) are sent to collect the seed (offspring) of the witch, as much as there is", cluster: magic}
  witch-roams-streets-and-enters-houses: {label: "The witch roams the streets, prowls the alleys, spies about the squares and keeps entering houses", cluster: magic}
  witch-steals-vigour-of-youth-and-charm-of-maiden: {label: "By looking at them the witch robs the young man of his virility and vitality and the young woman of her charm", cluster: magic}
  witch-cuts-off-trade-and-traffic: {label: "The witch stops traffic in the street and cuts off the victim's trade and business", cluster: magic}
  fire-set-above-and-below-witchs-city: {label: "The speaker sets fire above the witch's city, embers beneath it and fire in the house she enters", cluster: magic}
  daughters-of-anu-descend-by-rope: {label: "Two or three heavenly Daughters of Anu come down from heaven holding a rope to seek out the sorcerers and burn their leavings at night", cluster: magic}
  witchs-leavings-gathered-and-burned: {label: "The witch's leavings and refuse are collected and burned in a brazier", cluster: magic}
  witch-titles-include-cult-women: {label: "The witch is addressed by a string of titles including female cult functionaries (qadištu, nadītu, ištarītu, kulmašītu), ecstatic, exorcist and snake charmer", cluster: magic}
  witch-defiles-heaven-and-binds-gods: {label: "The witch's power reaches the gods: she defiles heaven and netherworld, seizes the mouth of the gods and binds the knees of the goddesses", cluster: magic}
  witch-kills-young-men-spares-no-woman: {label: "The witch is killer of young men and shows no mercy to women", cluster: magic}
  witch-handed-over-to-fire-god: {label: "The great gods (Ea and Marduk) hand the witch over to the fire god Girra", cluster: magic}
  speaker-identifies-with-river-and-sun: {label: "The speaker declares himself pure River and holy Sun, pure as River in his mountain and bright as Sun in his place of judgment", cluster: magic}
  speaker-identifies-with-cosmic-and-hostile-things: {label: "Self-identification: I am heaven, I am the netherworld, I am a thorn, the sting of the scorpion, a high mountain: your witchcraft cannot touch or come near me", cluster: magic}
  enemy-as-sutean-and-elamite: {label: "The witch and denouncer are likened to foreign raiders, the Sutean who surrounds and the Elamite who pursues, whose grip is death", cluster: magic}
  wave-and-current-overwhelm-sufferer: {label: "The sufferer is covered by the wave and overwhelmed by the current", cluster: lament}
  river-water-releases-witchcraft: {label: "Pure river water is asked to smash the witch's heart and release her witchcraft", cluster: magic}
  death-stands-in-witchs-footsteps: {label: "Death stands in the witch's footsteps", cluster: magic}
  speaker-seizes-witchs-limbs-and-binds-her: {label: "The speaker seizes the witch's mouth, tongue, eyes, feet, knees and arms in turn and ties her arms behind her back", cluster: magic}
  witchs-face-to-melt-and-yellow: {label: "May the witch's face melt and turn yellow like the rim of a seal, or black like bitumen", cluster: curse}
  litany-o-you-who-have-bewitched-me: {label: "Litany addressing the witch: 'O you who have bewitched me, seized me, sealed me, bound me, tied me, defiled me'", cluster: magic}
  sorcery-estranges-kin-and-friends: {label: "The witch has estranged from the victim his god and goddess, neighbours, brother and sister, friend and companion", cluster: lament}
  slag-and-soot-poured-on-witchs-head: {label: "Kiln slag and pot soot are moistened and poured on the head of the witch's figurine", cluster: magic}
  witches-sent-out-to-sea-in-boat: {label: "Figurines of the witches are set in a model boat; its tow rope is cut, its mooring post uprooted, and the flood carries them out to sea under raging waves", cluster: magic}
  boat-overturns-so-witchcraft-turns-back: {label: "As this (model) boat turns over, so may the witch's sorcery turn back onto her own head and body", cluster: magic}
  moon-boat-carries-release: {label: "The moon god's crescent is a boat that carries release from witchcraft between its horns", cluster: magic}
  sherd-of-the-streets-addressed: {label: "A potsherd from the crossroads, representing the witch, is addressed: why do you keep sending your messages against me?", cluster: magic}
  witchs-window-covered-and-tracks-blocked: {label: "The speaker climbs the roof to cover the witch's window and blocks her tracks on the ground, setting a demon and a pursuing ghost on her path", cluster: magic}
  strong-hand-of-mankind: {label: "The 'strong hand of humankind' (the witch's hand) seizes a man like a lion, clamps like a bird trap, covers like a net; a model of her hand is cast into the fire", cluster: magic}
  rise-like-fish-from-water: {label: "The freed speaker rises up like fish from the water, a pig from mud, a reed from the marsh, grass from the canal bank", cluster: magic}
  designs-of-life-drawn-on-speaker: {label: "The speaker is marked with the 'designs of life' (uṣurāt balāṭi) by the goddess who illumines fate", cluster: magic}
  litany-you-did-may-fire-god-release: {label: "Long litany listing each act of sorcery, each line closing with the refrain 'you have done it, you have had it done: may Girra release'", cluster: magic}
  victim-handed-over-to-ghosts-and-wastelands: {label: "The witch has handed the victim over to a skull, to the ghost of a kinsman or of a stranger, to a roaming ghost with no one to care for it, to the steppe and the wasteland", cluster: magic}
  victims-figurines-hidden-in-wall-threshold-bridge: {label: "The witch hides the victim's figurines in a wall, under a threshold, in a drain, under a bridge for crowds to trample, or under water in a channel", cluster: magic}
  victims-figurines-fed-to-dogs-pigs-birds: {label: "The witch feeds the victim's figurines to dogs, pigs and birds and throws them into the river", cluster: magic}
  sorcery-before-moon-and-stars: {label: "Zikurrudû (life-cutting) magic is performed before the moon and named stars and constellations (Jupiter, Orion, Scorpio, Ursa Major, Leo)", cluster: magic}
  any-acquaintance-may-be-the-witch: {label: "The unknown sorcerer may be anyone: friend or companion, brother or colleague, acquaintance or stranger, citizen or newcomer, male or female, dead or living", cluster: magic}
  night-breaks-witches-weapon-sleeplessness: {label: "Night is asked to break the witches' weapon and impose sleeplessness on them", cluster: magic}
  witch-height-of-heaven-depth-of-netherworld: {label: "The witch's (or her power's) height is that of heaven and her depth that of the netherworld", cluster: magic}
  sun-god-genealogy-he-is-the-judge: {label: "Riddle-genealogy: who is the Sun's father, mother and sister? Sîn, Nikkal, Manzât (the rainbow) — he is the judge who destroys witchcraft", cluster: magic}
  evil-sent-away-on-the-wind: {label: "The speaker sends sorcery and the evil word away on the wind", cluster: magic}
  foreign-women-tie-knots: {label: "Foreign women (Gutean, Elamite, Hanigalbatean) and native women tie magical bindings (knots) against the speaker", cluster: magic}
  release-by-day-what-was-bound-by-night: {label: "Whatever the witches bind by night the speaker releases by day, and what they bind by day he releases at night", cluster: magic}
  witch-is-witch-i-am-releaser: {label: "Refrain: 'the witch is a witch (of whatever people or trade), but I am a releaser' (anāku pāširāk)", cluster: magic}
  seven-and-seven-witches: {label: "Figurines of 'the seven and seven witches' are gathered from the west and handed to the fire god", cluster: magic}
  witches-to-the-drain-speaker-the-flood: {label: "May the witches be for the drain, while the speaker sweeps over them like flood water", cluster: magic}
  witch-sits-in-shade-of-brick-pile: {label: "The witch sits in the shade of a pile of bricks working sorcery and forming figurines of the victim", cluster: magic}
  aromatic-plants-sent-against-witch: {label: "Aromatic plants (thyme, sesame, kukru, a cone) are sent or raised against the witch to scatter her witchcraft and break her bond", cluster: magic}
  impossibility-analogy-chaff-cannot-be-twined: {label: "Impossibility analogy: as chaff cannot be twined nor barley knotted, nor witchcraft worked against heaven, so sorcery cannot come near the speaker", cluster: magic}
  witch-brought-to-her-judge-who-roars: {label: "May the witch be brought to her judge, who roars at her like a lion, strikes her cheek and turns her word back into her mouth", cluster: magic}
  plant-name-pun-curses: {label: "Chain of curses punning on plant names: like ammi (nīnû) may her witchcraft give way (nâšu), like mustard (kasû) bind (kasû) her, like colocynth (errû) curse (arāru) her", cluster: magic}
  streets-and-gods-turn-against-witch: {label: "May street and way, cult niche and its socles, and the gods of steppe and city turn against the witch", cluster: magic}
  witch-driven-off-like-dog: {label: "May the witch be knocked away like a dog with a stick, a lizard with a clod; may passersby frown at her and dogs whirl through her headbands", cluster: curse}
  sorcery-for-three-months-ten-days: {label: "The witch has worked sorcery against the victim for a set span: three months, ten days and half a day", cluster: magic}
  love-goddesses-patrons-of-witches: {label: "The spell acts by command of Ištar, Dumuzi, Nanaya mistress of love, and Kanisurra mistress of witches", cluster: magic}
  same-demon-sent-back-on-sender: {label: "Talionic litany: the demon (utukku, ghost, Lamaštu, lilû) you caused to seize me, may it seize you; the anger and terror you inflicted on me, may it be inflicted on you", cluster: magic}
  smoke-of-witch-abomination-to-heaven: {label: "The smoke of the burning witch is 'an abomination to heaven' (ikkib šamê)", cluster: magic}
  witch-cloud-scattered-by-north-wind: {label: "The witch piles up cloud and fog like the south wind; the speaker rises like the north wind, 'shearer of the heavens', and scatters her cloud", cluster: magic}
  sinews-and-figurines-unbound-by-ea: {label: "Ea and Asalluḫi unbind the victim's bound sinews and release his twisted and fettered figurines", cluster: magic}
  water-adjured-by-seven-sages: {label: "River, Tigris, Euphrates and ocean water, drawn by the sages of the apsû and adjured by the seven sages of Eridu, is sprinkled to cool the witches' hearts and embers", cluster: magic}
  witches-barred-from-crossing-rivers-walls-gates: {label: "The witches are forbidden to cross the Tigris and Euphrates, dyke and canal, wall and battlement, or to enter by the city gate to reach the speaker", cluster: magic}
  speaker-quenches-witches-heart-confounds-plans: {label: "With spring water the speaker quenches the witches' heart, confounds their understanding and makes them abandon the plots of their heart", cluster: magic}
  who-but-ea-can-calm-you: {label: "Rhetorical question: who but Ea can calm you, who but Asalluḫi soothe you?", cluster: magic}
  my-mouth-water-your-mouth-fire: {label: "Antithesis: my mouth is water, your mouth is fire; may the spell of my mouth extinguish the spell of yours", cluster: magic}
  speaker-tramples-his-foe: {label: "The speaker tramples his foe, slaughters his opponent and annihilates his pursuer in the god's presence", cluster: magic}
  begone-from-my-body-litany: {label: "Exorcistic litany: be off, begone, depart, flee from my body; do not turn back, approach or draw near to my body", cluster: magic}
  adjured-by-life-of-gods: {label: "The evil powers are adjured 'by the life (nīš)' of named gods (Šamaš, Ea, Asalluḫi, Girra) to separate from the speaker", cluster: magic}
  body-parts-identified-with-gods: {label: "The speaker identifies each part of his body with a deity or divine emblem (Enlil is my head, Uraš my eyes, Gula's necklace my neck, the crook of Sîn my arms, tamarisk my fingers)", cluster: magic}
  guardian-gods-posted-at-door: {label: "Protective gods (Lugalirra, Meslamtaʾea, Papsukkal) are stationed at the doorway, right and left of the gate, to strike and kill the witch", cluster: magic}
  enemy-words-crumble-before-god-and-king: {label: "May the enemy's words be like (bad) apples that crumble before god and king", cluster: magic}
  witch-carries-victims-life-to-netherworld: {label: "The witch carries the victim's life off to the infernal 'princes' (malkū) of the netherworld", cluster: magic}
  kukru-plants-of-pure-mountains: {label: "The aromatic kukru, 'inhabitants of the pure holy mountains', and small vessels of the en-priestesses and cones of the qadištu are summoned to break the witch's bond", cluster: magic}
  witchcraft-crumbles-like-plaster: {label: "May the witch's sorcery blacken her like ashes and crumble like plaster from a wall; may the knot of her heart be loosened", cluster: magic}
  smoke-rising-from-witchs-house: {label: "The speaker taunts the witch: why is smoke rising from your house?", cluster: magic}
  historiola-before-the-tamarisk-was-cut: {label: "Mythic preface: before Ningirsu called the work song in the land, before the youth went up to cut the tamarisk, his mother and brothers advising him", cluster: magic}
  witch-gathers-hailstones: {label: "The witch gathers (hail)stones and storm clouds against the victim; he scatters them like the north-west wind", cluster: magic}
  witch-takes-shadow-from-wall: {label: "The witch 'took my shadow from the wall' and collected the dust of my feet", cluster: magic}
  south-wind-carries-off-witchcraft: {label: "May the south wind carry off what (sorcery) is on the witch's right and on her left", cluster: magic}
  speaker-identifies-with-sulphur: {label: "The speaker declares himself pure Sulphur, daughter of heaven, created by Anu and brought down to earth by Enlil and Ninlil, against whom no witchcraft can be performed", cluster: magic}
  head-to-heaven-feet-to-netherworld: {label: "The speaker's body spans the cosmos: as far as his head, heaven; as far as his feet, the netherworld — where could the witch touch him?", cluster: magic}
  incantation-cast-on-inner-hem: {label: "The incantation of Marduk, sage of the gods, is cast upon the speaker's inner hem", cluster: magic}
  sulphur-cannot-be-bewitched: {label: "Sulphur, daughter of River, whose witches and enemies are seven and seven, was bewitched yet not bewitched: who can work witchcraft against Sulphur?", cluster: magic}
  river-is-the-door-of-my-gate: {label: "The speaker tells River that he has eaten, drunk, anointed and clothed himself, and that River is the door of his gate", cluster: magic}
  witch-known-to-speaker: {label: "The speaker tells the witch: whoever you are, I am watching, I know your form", cluster: magic}
  salt-food-of-the-gods: {label: "Salt, created in a pure place and destined by Enlil as food of the great gods, without which no meal is set out and no incense smelled, is asked to release the bewitched", cluster: magic}
  bed-guarded-against-witch: {label: "The speaker guards himself: a watch on his roof, a protective emblem at his gate, coloured twine around his bed, asafoetida or twelve figurines at the head of his bed", cluster: magic}
  pure-mountain-piled-in-courtyard: {label: "The speaker heaps up a 'pure mountain' (of earth) in his courtyard against the witch", cluster: magic}
  speaker-shines-like-rainbow: {label: "The speaker (whose hand is the Rainbow and the Scorpion) shines forth against the witch like the rainbow in the heavens", cluster: magic}
  night-sleep-of-ford-and-quay-doors-locked: {label: "At night the ford, the quay and all the sailors are asleep, locks are set on door and bolt and sealed with an incantation so that sorcery cannot enter the house", cluster: magic}
  witch-not-escape-grasp-of-god-and-king: {label: "May god, king, noble and prince glower at the witches, and may the witch not escape their grasp", cluster: magic}
  spell-impregnates-own-body: {label: "Fertility analogy: as Šakkan impregnated his herd and the plough the earth, so the speaker casts the spell on himself to 'impregnate' his body and expel the evil", cluster: magic}
  healing-oil-of-incantation: {label: "Pure oil that purifies the body of the gods and soothes the sinews of mankind, the oil of Ea's incantation, is rubbed on the patient to expel disease", cluster: healing}
  immune-as-tin-and-iron: {label: "As sorcery cannot touch tin and iron (or the shining gods), so it cannot approach the speaker", cluster: magic}
  counter-figurine-of-witch-drawn-before-sun: {label: "Sent by Ea, the speaker draws the witch's likeness before Šamaš, copying her form and features (in flour) exactly as she copied his, and binds its limbs", cluster: magic}
  ominous-encounter-transferred: {label: "The ominous encounter (mihru) and the vengeance the witch caused are passed back to her; a female substitute or chance comer is to take it over", cluster: magic}
  substitute-figurine-bears-sin: {label: "The washing water from the speaker's body and hands carries the evil onto a substitute figurine (ṣalam nigsagilê) which bears his sin in his place; street and way undo his sins", cluster: magic}
  day-month-year-blessing: {label: "Blessing formula: may the day bring well-being, the month joy, the year its prosperity", cluster: blessing}
  witch-hunts-young-men-and-women: {label: "The witch, 'huntress of huntresses', casts her net in the streets and roams the squares seeking the young men and women of the city", cluster: magic}
  witch-mouth-filled-with-earth-tongue-gagged: {label: "May the witch's evil mouth be filled with earth and her evil tongue bound with a gag", cluster: curse}
  ritual-washing-transfers-all-evils: {label: "The speaker washes his hands and body in pure Eridu spring water, removing every evil: bad dreams, signs, portents, bad entrails, demons, illness, curses and witchcraft", cluster: magic}
  evil-dreams-and-omens-washed-away: {label: "The evil consequences of bad dreams, signs and portents and of ominous entrails seen in extispicy are washed away", cluster: divination}
  earth-receives-my-sin: {label: "'Rise up, morning, wash my hands; open up, earth, and receive my sin'", cluster: magic}
  cleansed-by-the-rising-sun: {label: "At dawn the doors open and the traveller sets out; the speaker is cleansed by the rising of the sun and the night's sorcery turns back on the witch", cluster: magic}
  bad-dream-made-favourable: {label: "Prayer at dawn: may the dream I dreamt be made favourable, may a good beginning begin for me, may I attain whatever I seek", cluster: divination}
  sufferer-awaits-the-sunrise: {label: "The sufferer waits through the night for the sun god: 'until you rose I was awaiting you, my head raised in expectation'; at dawn the god releases the witchcraft", cluster: prayer}
  witchcraft-downstream-i-upstream: {label: "May the witch's witchcraft go downstream, but may I go upstream", cluster: magic}
  daughter-of-sun-god-as-releaser: {label: "The speaker sends the plant of release to the sun god's daughter, his releaser, to unknot the hand that bound a knot", cluster: magic}
  witch-crossing-river-struck-by-ea: {label: "When the witch crossed the river and sat in the ferry, the sages of the apsû saw her, Ea darkened her face and struck her with epilepsy and trembling, and River cast her own fear upon her", cluster: magic}
  speaker-removes-witchcraft-from-witchs-insides: {label: "The speaker strikes the witch's stomach, lungs and innards and pulls her witchcraft and spittle up out of her body", cluster: magic}
  witch-denied-netherworld-corpse-to-birds-and-dogs: {label: "Curse: may Ereškigal not let the witch go down to the netherworld; may eagle and vulture prey on her corpse and dog and bitch tear her flesh", cluster: curse}
  witch-catalogue-of-assaults-on-senses: {label: "The witch seizes the forehead, makes the eyes turn, blocks hearing, shuts the ears, wrongs young men and assaults young women", cluster: magic}
  address-to-own-reflection-you-are-mine: {label: "The speaker addresses his own reflection, vigour, vitality and virility: do not accept witchcraft or murder; 'you are mine and I am yours'", cluster: magic}
  ritual-tablet-keyed-to-incantations: {label: "A ritual tablet lists the incantations of a series by their opening words, each with the ritual act or material prescribed for it", cluster: magic}
  mouth-washing-of-patient: {label: "The patient undergoes the ritual of washing the mouth (mīs pî) and treads on tamarisk before the rite", cluster: magic}
  tallow-figurine-with-salt-in-mouth-melted: {label: "A tallow figurine with salt in its mouth is set on a burning torch so that it drips away over a bowl", cluster: magic}
  magic-circle-drawn-with-flour: {label: "A protective circle (zisurrû) is drawn with flour or gypsum around the burning vessel, the bed or the gates", cluster: magic}
  knots-tied-in-wool-and-undone: {label: "Three or seven knots are tied in a band of white wool and then undone and cast into the fire", cluster: magic}
  fire-extinguished-and-remains-thrown-out-gate: {label: "The burning is quenched with water and the remains with the burning vessel are carried out through the gate and thrown away", cluster: magic}
  doorposts-and-bolt-smeared-for-protection: {label: "The patient smears the door, bolt and doorposts with a protective mixture (flour and beer) at night", cluster: magic}
  witch-figurines-in-bread-given-to-dogs: {label: "Dough figurines of the warlock and witch are put inside loaves, raised in the right and left hands and given to a male and a female dog", cluster: magic}
  patient-looks-at-reflection-in-water: {label: "The patient looks at his face reflected in a bowl of water, which is then sprinkled toward sunrise", cluster: magic}
  witch-figurine-struck-with-stick-in-washbasin: {label: "Clay figurines of the witch are set on flour drawings in a washbasin; the patient washes his hands over them and strikes them three times with a cornel stick", cluster: magic}
  exorcist-speaks-as-the-god-i-am: {label: "The exorcist speaks in the god's own person in a long litany of 'I am Asalluḫi' predications, before which the demons flee and hide", cluster: magic}
  demons-hide-at-gods-name: {label: "At the mention of the god's name the devils, Namtar-demons and Anunnaki go into hiding or vanish", cluster: magic}
  god-takes-hand-of-the-fallen: {label: "The god saves the defeated, takes the hand of the fallen, the weak and the fettered, and protects the poor", cluster: divine-attributes}
  god-releases-guilt-and-changes-evil-fate: {label: "The god transposes evil destinies, releases guilt (mupaṭṭir arni) and keeps sins and transgressions at bay", cluster: sin}
  god-purges-righteous-and-wicked-in-river: {label: "The god purges (sorts) the righteous and the wicked in the river (ordeal)", cluster: justice}
  demon-catalogue-of-animal-behaviours-at-sickbed: {label: "Catalogue of demons that stand, sit and walk by the invalid's bed, eat and drink with him, and butt like an ox, roar like a lion, slither like a snake, bleat like a kid before him", cluster: demons}
  restless-dead-catalogue: {label: "Catalogue of restless dead: those with no guardian on the steppe, killed in battle or by the dagger, impaled, those with no father, mother, kin, son or heir to pour water", cluster: underworld}
  demons-handed-to-netherworld-gatekeepers: {label: "The demons are handed to the gate of the Land of No Return, to the seven gatekeepers of Ereškigal, to Namtar and to the chief gatekeeper, who shuts the gate on them", cluster: underworld}
  exorcised-by-heaven-and-earth-and-primeval-gods: {label: "The demons are exorcised by heaven and earth and by the primeval divine pairs (Anu and Antu, Enlil and Ninlil, Duri and Dari, Laḫmu and Laḫamu) and by everyday things (incense, shadow, daylight, path, seat)", cluster: magic}
  other-gods-are-names-of-one-god: {label: "Syncretistic litany: each great god (Anšar, Dagan, Adad, Nannar, Šamaš, Erra, Ningirsu) is declared to be a name or aspect of the one supreme god: 'your name is X ... your name is indeed Marduk'", cluster: divine-attributes}
  god-sees-world-as-small-as-a-wedge: {label: "The god's sight is so far-reaching that the whole world is to him no bigger than the impression of a cuneiform wedge", cluster: divine-attributes}
  creator-without-whom-nothing-was-formed: {label: "The god is creator of everything, without whom nothing whatsoever was formed and no lord could exist", cluster: creation}
  god-holds-cosmic-rope: {label: "The supreme god alone holds the rope (ṣerretu) or bond of heaven and earth, his sceptre laid across the netherworld", cluster: cosmology}
  storm-god-voice-shakes-heaven-and-earth: {label: "At the storm god's roar from the clouds heaven and earth shake, mountains quake and the seas are stirred up", cluster: theophany}
  doubled-litany-lord-then-name: {label: "Prayer in which every couplet is sung twice, first to 'O Lord' and then to the god by name ('O Nabû')", cluster: prayer}
  gods-anger-dragon-yoke-raging-beast: {label: "The god's anger is a dragon, his yoke a raging beast, his pitilessness a conflagration, his scowl a dark cloud — yet he heaps up plenty", cluster: divine-attributes}
  only-the-god-can-absolve: {label: "Without the god's consent no forgiveness can occur; unless by him no iniquity or crime can be absolved", cluster: sin}
  sufferer-bellows-like-slaughtered-bull: {label: "The sufferer bellows like a bull slaughtered with the butcher's knife and is cast into the maw of a terrible power", cluster: lament}
  sufferers-symptoms-lice-and-exudation: {label: "The sufferer's body putrefies, his manhood fades, lice torment him, discharge covers his brow, his mind wanders and he craves death", cluster: lament}
  dream-spirit-brings-message: {label: "In the night a dream spirit (zāqīqu) appears to the sufferer with a message announcing his recovery", cluster: revelation}
  bitter-dates-later-sweet: {label: "Proverbial consolation: early dates are bitter but later sweet; grain struck by smut in budding still gives full yield at maturity", cluster: wisdom}
  leave-a-vent-to-breathe: {label: "Plea: if you discipline your servant, leave him a vent to breathe through; turn your face toward him", cluster: prayer}
  restored-sufferer-regains-fields-and-prebends: {label: "Prayer that the restored servant regain his fields, prebend shares and sanctuary, build his storehouse and chapel", cluster: prayer}
units:
  # ================= Maqlû Tablet I =================
  - id: ane-maqlu-sb-i-gods-of-night
    tradition: ane-akkadian
    title: "Maqlû I 1-36: 'I call upon you, gods of the night' — lawsuit against the witch"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    version: Standard Babylonian
    read: ["Maqlu SB I:1-36a"]
    tags:
      - {motif: gods-of-night-invoked-against-witch, refs: ["Maqlu SB I:1-3", "Maqlu SB I:29-30"], note: "alsīkunūši ilū mušīti; Twilight, Midnight and Dawn (barārītu qablītu namārītu)"}
      - {motif: night-as-veiled-bride, refs: ["Maqlu SB I:2"], note: "mušītu kallātu kuttumtu"}
      - {motif: three-night-watches-personified, refs: ["Maqlu SB I:3", "Maqlu SB I:30"], note: "šalāš maṣṣarātu ša mūši lipšurā ruhêša"}
      - {motif: bewitched-man-estranged-from-his-gods, refs: ["Maqlu SB I:6"], note: "ilī u ištarī ušessû elīya"}
      - {motif: sufferer-sickening-to-all-who-see-him, refs: ["Maqlu SB I:7"], note: "eli āmerīya amruṣu anāku"}
      - {motif: sufferer-cannot-eat-or-drink, refs: ["Maqlu SB I:9-11"]}
      - {motif: lyre-turned-to-mourning, refs: ["Maqlu SB I:12"], note: "elēlī nubû hidûtī sipdi: my song of joy is wailing, my rejoicing mourning"}
      - {motif: victim-pleads-lawsuit-against-witch-before-gods, refs: ["Maqlu SB I:13-14", "Maqlu SB I:17"]}
      - {motif: witch-figurines-made-and-set-before-gods, refs: ["Maqlu SB I:15-17"]}
      - {motif: may-she-die-but-i-live, refs: ["Maqlu SB I:19"]}
      - {motif: purifying-trees-and-plants-invoked, refs: ["Maqlu SB I:21-24"]}
      - {motif: pure-as-grass-clean-as-nard, refs: ["Maqlu SB I:25-26"]}
      - {motif: purge-with-hyssop-whiter-than-snow, refs: ["Maqlu SB I:23", "Maqlu SB I:25-26"], note: "soapwort (maštakal) cleanses, 'I have become pure ... clean (ētebib)'"}
      - {motif: witchs-word-turned-back-into-her-mouth, refs: ["Maqlu SB I:28"]}
      - {motif: witch-mouth-tallow-tongue-salt, refs: ["Maqlu SB I:31-33"]}
      - {motif: witchcraft-loosed-bonds-broken, refs: ["Maqlu SB I:20", "Maqlu SB I:34"]}
      - {motif: spell-ends-by-command-of-named-gods, refs: ["Maqlu SB I:36"]}
    hints:
      - "Compare Ps 51:9 (purge me with hyssop, wash me whiter than snow) for I:23-26."
      - "Compare Ps 88:9, Ps 31:12 and Job 19:13-19 (made loathsome to acquaintances) for I:6-7; Job 30:31 (my lyre turned to mourning) and Lam 5:15 for I:12."
      - "Compare Ps 7:7-10 and Ps 35:23-24 ('awake to my judgment ... judge me') for the lawsuit frame."
      - "Compare Q 113:3-4 (refuge from the evil of darkness when it settles and of the women who blow on knots)."
  - id: ane-maqlu-sb-i-netherworld-gilgamesh-oath
    tradition: ane-akkadian
    title: "Maqlû I 37-41: 'Netherworld, netherworld' — Gilgameš enforcer of the oath"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    version: Standard Babylonian
    read: ["Maqlu SB I:37-41a"]
    tags:
      - {motif: gilgamesh-enforcer-of-netherworld-oath, refs: ["Maqlu SB I:38"], note: "gilgāmeš bēl māmītīkunu"}
      - {motif: gilgamesh-king-and-judge-of-netherworld, refs: ["Maqlu SB I:38"]}
      - {motif: i-know-your-deeds-you-know-not-mine, refs: ["Maqlu SB I:39-40"]}
      - {motif: witchcraft-loosed-bonds-broken, refs: ["Maqlu SB I:41"], note: "inverted: the witches will find no one to undo or release (pāṭira pāšira) the oath binding them"}
    hints:
      - "Compare Ps 139:1-4 (God knows all I do) inverted: here the speaker claims superior knowledge over his enemies."
  - id: ane-maqlu-sb-i-zabban
    tradition: ane-akkadian
    title: "Maqlû I 42-49: 'My city is Zabban' — two gates, water for the gods of heaven"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    version: Standard Babylonian
    read: ["Maqlu SB I:42-49"]
    tags:
      - {motif: city-with-gate-of-sunrise-and-sunset, refs: ["Maqlu SB I:42-45"]}
      - {motif: purifying-trees-and-plants-invoked, refs: ["Maqlu SB I:46"], note: "a broken palm frond (ēra haṣba) and maštakal raised"}
      - {motif: reciprocal-purification-with-gods, refs: ["Maqlu SB I:47-49"], note: "kīma anāku ana kâšunu ullalukunūši attunu yâši ullilāʾinni"}
    hints:
      - "Compare Ezek 43:1-4 and 44:1-2 (the east gate of the temple) and Mal 1:11 (from the rising of the sun to its setting) for the gate imagery."
  - id: ane-maqlu-sb-i-ford-and-quay-enclosed
    tradition: ane-akkadian
    title: "Maqlû I 50-60: 'I have enclosed the ford' — Anu and Antu send the speaker to Bēlet-ṣēri"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    version: Standard Babylonian
    read: ["Maqlu SB I:50-60"]
    tags:
      - {motif: witchcraft-of-all-lands-enclosed, refs: ["Maqlu SB I:50-51"]}
      - {motif: whom-shall-i-send, refs: ["Maqlu SB I:52-53"], note: "mannu lušpur ana bēlet-ṣēri, 'whom shall I send to Bēlet-ṣēri?', asked by Anu and Antu, with the speaker as the one sent"}
      - {motif: exorcist-sent-by-god, refs: ["Maqlu SB I:52"]}
      - {motif: lock-placed-on-witchs-mouth, refs: ["Maqlu SB I:54-55"], note: "idî hargullī: the lock; idî šipassu: Marduk's seal/incantation"}
      - {motif: god-not-to-answer-witch-but-me, refs: ["Maqlu SB I:56-59"]}
      - {motif: spell-ends-by-command-of-named-gods, refs: ["Maqlu SB I:60"]}
    hints:
      - "Compare Isa 6:8 ('Whom shall I send, and who will go for us?') for I:53."
      - "Compare Ps 4:2 and Ps 27:7 ('when I call, answer me') against Prov 1:28 and Mic 3:4 (the wicked call and are not answered) for I:56-59."
  - id: ane-maqlu-sb-i-i-have-been-sent
    tradition: ane-akkadian
    title: "Maqlû I 61-72: 'I have been sent and I will go' — heaven, netherworld, river and land listen"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    version: Standard Babylonian
    read: ["Maqlu SB I:61-72"]
    tags:
      - {motif: exorcist-sent-by-god, refs: ["Maqlu SB I:61-62"], note: "šaprāku allak uʾʾurāku adabbub; Asalluḫi bēl āšipūti išpuranni"}
      - {motif: heaven-earth-river-land-summoned-to-hear, refs: ["Maqlu SB I:63-64"], note: "ša šamê qūlā ša erṣeti šimâ"}
      - {motif: wind-and-road-stilled-for-testimony, refs: ["Maqlu SB I:65-68"]}
      - {motif: victim-pleads-lawsuit-against-witch-before-gods, refs: ["Maqlu SB I:68-71"], note: "testimony (amātu) against testimony; may their testimony be undone, mine not"}
      - {motif: spell-ends-by-command-of-named-gods, refs: ["Maqlu SB I:72"]}
    hints:
      - "Compare Deut 32:1 and Isa 1:2 ('Hear, O heavens, give ear, O earth') for I:63-64."
      - "Compare Isa 6:8-9 and Jer 1:7 ('to whomever I send you, you shall go; whatever I command you, you shall speak') for I:61."
      - "Compare Josh 10:12-13 (sun and moon stand still) for commanding cosmic elements to stand still during a speech."
  - id: ane-maqlu-sb-i-nuska-figurines-girra-judge
    tradition: ane-akkadian
    title: "Maqlû I 73-121: 'O Nuska, these are the figurines of my sorcerer' — the indictment and Girra as judge"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    version: Standard Babylonian
    read: ["Maqlu SB I:73-121"]
    tags:
      - {motif: witch-figurines-made-and-set-before-gods, refs: ["Maqlu SB I:73-76", "Maqlu SB I:93-94"], note: "kīma šunu lā izzazzū ṣalmīšunu našâku: since they are not present I hold up their figurines"}
      - {motif: adversary-catalogue-male-and-female, refs: ["Maqlu SB I:75-86"]}
      - {motif: god-knows-enemies-i-do-not, refs: ["Maqlu SB I:87"]}
      - {motif: catalogue-of-kinds-of-witchcraft, refs: ["Maqlu SB I:88-91"]}
      - {motif: witch-makes-victims-figurine, refs: ["Maqlu SB I:96"]}
      - {motif: bewitchment-bodily-symptoms-catalogue, refs: ["Maqlu SB I:97-102"], note: "l. 101a broken in part"}
      - {motif: bewitched-food-and-drink-given, refs: ["Maqlu SB I:103-106"]}
      - {motif: victim-betrothed-to-the-dead, refs: ["Maqlu SB I:107-108"]}
      - {motif: bewitched-man-estranged-from-his-gods, refs: ["Maqlu SB I:109"]}
      - {motif: fire-god-judges-in-place-of-sun-god, refs: ["Maqlu SB I:113-114"], note: "alsīka kīma šamaš dayyāni"}
      - {motif: fire-god-burns-witch-refrain, refs: ["Maqlu SB I:110-112", "Maqlu SB I:115-117"]}
      - {motif: divine-command-unalterable, refs: ["Maqlu SB I:120-121"]}
    hints:
      - "Compare Ps 35:11-16 and Ps 109:2-5 (false witnesses and accusers repay good with evil) for the catalogue of accusers."
      - "Compare Ps 19:13 and Ps 139:23-24 (hidden faults / search me) for the god knowing what the speaker does not."
      - "Compare Num 23:19 and Esth 8:8 (a decree that cannot be revoked) for I:120-121."
  - id: ane-maqlu-sb-i-reed-torch-bewitch-him
    tradition: ane-akkadian
    title: "Maqlû I 122-134: Nuska kindled with a reed torch — 'bewitch him with the witchcraft with which he bewitched me'"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    version: Standard Babylonian
    read: ["Maqlu SB I:122-134a"]
    tags:
      - {motif: reed-torch-raised-to-fire-god, refs: ["Maqlu SB I:125"], note: "ašši gizillâ unammerka kâša"}
      - {motif: sorcery-returned-on-the-sorcerer, refs: ["Maqlu SB I:126-130"], note: "kaššāpu ikšipanni kišpī ikšipanni kišipšu"}
      - {motif: plot-returns-on-plotters-head, refs: ["Maqlu SB I:126-130"]}
      - {motif: witch-makes-victims-figurine, refs: ["Maqlu SB I:131"]}
      - {motif: witch-takes-spittle-hair-hem-footprint, refs: ["Maqlu SB I:132-133"], note: "ruʾtī ilqû šārtī imlusū sissiktī ibtuqū ... eper šēpīya išbušū"}
      - {motif: witchcraft-loosed-bonds-broken, refs: ["Maqlu SB I:134"]}
    hints:
      - "Compare Ps 7:16-17 and Ps 57:7 (he falls into the pit he dug; his mischief returns on his own head) and Esth 7:10 for I:126-130."
      - "Compare 1Sam 24:5 (David cuts the hem of Saul's robe) and 1Sam 15:27 for the hem as a token of the person."
  - id: ane-maqlu-sb-i-burning-demon-figurines
    tradition: ane-akkadian
    title: "Maqlû I 135-145: 'I raise the torch and burn their figurines' — demons melt, smoke rises; catchline"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    version: Standard Babylonian
    read: ["Maqlu SB I:135-145"]
    tags:
      - {motif: reed-torch-raised-to-fire-god, refs: ["Maqlu SB I:135"], note: "anašši dipāru ṣalmīšunu aqallu"}
      - {motif: named-demons-beset-mankind, refs: ["Maqlu SB I:136-139"], note: "utukku, šēdu, rābiṣu, eṭemmu, Lamaštu"}
      - {motif: lilu-lilitu-ardat-lili, refs: ["Maqlu SB I:138"]}
      - {motif: figurines-melt-smoke-rises-to-heaven, refs: ["Maqlu SB I:140-142"], note: "hūlā zūbā u itattukā; quturkunu lītelli šamê"}
      - {motif: wicked-melt-like-wax-before-fire, refs: ["Maqlu SB I:140"]}
      - {motif: wicked-vanish-like-smoke, refs: ["Maqlu SB I:141"]}
    hints:
      - "Compare Ps 68:3 (as smoke is driven away, as wax melts before fire, so the wicked perish) for I:140-141."
      - "Compare Isa 34:14 (lilit settles in the ruins) for lilītu, I:138."
  # ================= Maqlû Tablet II =================
  - id: ane-maqlu-sb-ii-nuska-hymn
    tradition: ane-akkadian
    title: "Maqlû II 1-18: 'O Grand Nuska, counselor of the great gods' (tallow figurine)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    version: Standard Babylonian
