      - {motif: goddess-greater-than-mountains-like-an-and-enlil, refs: ["ETCSL 2.2.5 H.M:1-5"], note: "nin nam-gal-la-ni kur-ra dirig-ga an-gin7 ... {d}en-lil2-gin7 ... {d}utu-gin7 ... ub-da 4-ba dili-ni maḫ"}
      - {motif: king-provides-temple-offerings-prayer, refs: ["ETCSL 2.2.5 H.M:9-13"], note: "gud gal-gal-e ... nidba ... kaš i3-udu i3 ... lal3 ĝeštin"}
      - {motif: temple-music-drums-and-harps, refs: ["ETCSL 2.2.5 H.M:16-18"], note: "ub3 a2-la2 ... tigi ... za-am-za-am"}
      - {motif: king-son-of-enlil, refs: ["ETCSL 2.2.5 H.M:15"], note: "{d}iš-me-{d}da-gan ... dumu {d}en-lil2-la2"}
      - {motif: lament-offered-by-king-to-deity, refs: ["ETCSL 2.2.5 H.M:21-27"], note: "lu2 sun5-na ĝiri3-zu mu-un-dab5-ba ... er2 sizkur-ra-ta ma-ra-an-de6: 'the humble man who grasped your feet brought you a lament as an offering'"}
      - {motif: humble-suppliant-grasps-deitys-feet, refs: ["ETCSL 2.2.5 H.M:22"]}
      - {motif: order-fixed-since-creation-unchangeable, refs: ["ETCSL 2.2.5 H.M:29", "ETCSL 2.2.5 H.M:30"], note: "ud an ki-in-du-a ... ud-bi nam-me-kur2-ru"}
      - {motif: god-of-the-city-sends-good-fate-to-king, refs: ["ETCSL 2.2.5 H.M:36", "ETCSL 2.2.5 H.M:37", "ETCSL 2.2.5 H.M:38"]}
      - {motif: kirugu-gisgigal-song-structure, refs: ["ETCSL 2.2.5 H.M:39"], note: "12th kirugu"}
