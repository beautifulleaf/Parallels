# Full read of the ANE corpus, chunk 7: ETCSL 2.2.5 - ETCSL 2.4.2.03 (Sumerian city laments, Bau hymns, Ur-Namma, Shulgi A-C).
# Read from the ETCSL composite transliterations; ETCSL's English prose used only as a reading aid.
new_motifs:
  humans-multiply-as-numerous-as-gods: {label: "Mortal humans multiply until they are as numerous as the gods, preceding a divine decision to destroy", cluster: primeval}
  great-gods-jointly-fashion-destroyer: {label: "Several great gods together create and give features and limbs to a monstrous destroying being", cluster: lament}
  gods-pale-before-own-creation: {label: "The great gods themselves blanch in fear at the immensity of a creature the gods have made", cluster: lament}
  lament-series-of-who-and-why-questions: {label: "A lament piles up rhetorical questions: who did this to the city, why did the god's hand seize it, why did the kind eye look away", cluster: lament}
  divine-kind-eye-turned-away: {label: "The god's benevolent eye (gaze) is turned away from the city, signalling abandonment", cluster: lament}
  sun-god-judge-of-heaven: {label: "The sun god is the judge who renders verdicts at the court of heaven", cluster: kingship}
  city-gods-and-protective-spirits-abandon-city: {label: "The city's patron god and its protective spirits (udug, lamma) leave it, flee to the open country and take foreign paths before its destruction", cluster: lament}
  shepherds-themselves-wreck-the-fold: {label: "The appointed shepherds and cowherds themselves overturn the cattlepens and sheepfolds they should keep", cluster: lament}
  city-flooded-into-swamp: {label: "Fields are drenched and the destroyed city is turned into a swamp or marsh", cluster: lament}
  deluge-monster-described-limb-by-limb: {label: "A destroying storm-monster sent by the god is described part by part: hair, face, eyes, mouth, tongue, arms, ribs, haunches, feet, each a weapon or fire", cluster: lament}
  divine-word-destroys-city: {label: "The word or pronouncement of the high gods (An, Enlil) is itself the force that destroys the city", cluster: lament}
  storm-deluge-as-divine-weapon-on-land: {label: "The god's decreed destruction is a 'deluge' (amaru, abubu) or storm that sweeps over the land, used of invading armies", cluster: lament}
  fools-rejoice-wise-mourn-at-coming-doom: {label: "When doom is announced the foolish rejoice and look forward to war, while the wise beat their breasts, weep at night and cannot sleep", cluster: wisdom}
  prayer-that-gods-word-be-turned-back: {label: "Those threatened pray that the god's decree 'be turned back' and his anger be exhausted", cluster: lament}
  barbarian-invaders-gutium-subir: {label: "A barbarian mountain people (Gutium, Subir, Martu) is the instrument of the gods' destruction of Sumer", cluster: lament}
  invader-floods-like-rising-water: {label: "An invading people pours over the land like a swelling floodwave", cluster: lament}
  sumer-alas-lament-cry: {label: "Lament cry 'Alas, Sumer! Alas its people!' (a ki-en-gi) addressing the land itself", cluster: lament}
  city-eyes-put-out-shoots-uprooted: {label: "The enemy 'puts out both eyes' of the city and uproots its young shoots (its people, its future)", cluster: lament}
  people-slaughtered-like-sacrificial-cattle: {label: "The enemy lets the people's blood flow like that of sacrificial cattle", cluster: lament}
  corpses-heaped-like-grain-piles: {label: "The slain are piled up in heaps like grain stacks or sheaves", cluster: lament}
  city-stands-alone-after-land-falls: {label: "All the surrounding settlements are scattered and the capital stands alone under siege", cluster: lament}
  siege-with-battering-rams-and-shields: {label: "Besiegers set up battering rams and shields, breach walls and buttresses and hew the city with axes", cluster: war}
  lament-offered-by-king-to-deity: {label: "A king presents a lament or penitential song to a deity as an offering, praying for the restoration of a ruined city", cluster: lament}
  king-provides-temple-offerings-prayer: {label: "Prayer that the king serve as the deity's steward and bring bulls, offerings, beer, fat, oil, syrup and wine", cluster: cult}
  temple-music-drums-and-harps: {label: "The deity is served with ub and ala drums, tigi harps and zamzam instruments", cluster: cult}
  order-fixed-since-creation-unchangeable: {label: "Prayer that what was established when heaven and earth came into being will never be changed", cluster: creation}
  god-of-the-city-sends-good-fate-to-king: {label: "A protective deity is asked to take hold of the king's head and pronounce a good fate unalterable by command of An and Enlil", cluster: kingship}
  kirugu-gisgigal-song-structure: {label: "A Sumerian song divided into numbered kirugu sections, each followed by a ĝišgiĝal antiphon", cluster: liturgy}
  horns-reach-heaven-bellowing-bull: {label: "A destroying creature like a great wild bull bellows and its gigantic horns reach up to heaven", cluster: lament}
  sun-does-not-rise-in-catastrophe: {label: "In the catastrophe the sun god sets and does not rise again", cluster: lament}
  heavy-burden-of-sin: {label: "Someone bears a heavy burden or load of sin (nam-tag dugud)", cluster: sin}
  evil-ghost-approaches-city: {label: "An evil ghost or demon approaches the doomed city while it watches", cluster: lament}
  silence-like-a-cloak-over-people: {label: "A hush of fear settles over the people like a garment", cluster: lament}
  livestock-driven-off: {label: "The enemy drives away the city's donkeys, sheep and cattle", cluster: war}
  tigris-euphrates-tremble: {label: "The Tigris and Euphrates quake and the mountains rumble before the divine onslaught", cluster: theophany}
  honest-men-turned-traitors: {label: "In the disaster honest men among loyal families turn into liars and traitors", cluster: lament}
  sacrilege-against-ekur-avenged: {label: "Prayer that those who seized Enlil's temple (the E-kur) and coveted Nibru be punished and swept away", cluster: lament}
  personal-lament-heart-filled-with-tears: {label: "The singer says 'my heart is filled with tears' in a refrain", cluster: lament}
  veteran-warriors-lose-heart: {label: "Experienced warriors drop their weapons, their minds confused, and their leaders are cut down", cluster: war}
  young-and-old-massacred: {label: "The enemy kills the population, young and old alike", cluster: war}
  primeval-city-kulaba: {label: "Kulaba (Unug) is called the primeval city, yet is turned into a place of murder", cluster: lament}
  battle-all-night-until-noon: {label: "Battle rages through the night until midday", cluster: war}
  city-as-wounded-wild-bull: {label: "The besieged city is a proud wild bull or cow pierced by arrow and spear", cluster: lament}
  goddess-greater-than-mountains-like-an-and-enlil: {label: "A goddess is praised as vaster than the mountains, lofty like An, majestic like Enlil, bright like Utu, unique in the four quarters", cluster: hymn}
  king-son-of-enlil: {label: "The king is called son of the high god Enlil (or of another god)", cluster: kingship}
  humble-suppliant-grasps-deitys-feet: {label: "A humble worshipper grasps the deity's feet in supplication", cluster: cult}
  storm-covers-city-like-cloak: {label: "The destroying storm covers the city like a cloak and is spread over it like a linen sheet", cluster: lament}
  god-stays-outside-city-as-if-foreign: {label: "The city's own god stands outside his city as if it were an alien city", cluster: lament}
  god-weeps-over-own-city: {label: "A god weeps bitter tears over the destruction of his own city", cluster: lament}
  divine-powers-of-city-overturned: {label: "The divine powers (me) and rites of the city are overturned and altered", cluster: lament}
  storm-strikes-good-and-evil-alike: {label: "The destroying storm does not distinguish good from evil and strikes indiscriminately", cluster: theodicy}
  divine-curse-on-city: {label: "The high god curses the city (decrees its fate) and frowns upon it, so it is destroyed", cluster: lament}
  city-destroyed-a-second-time: {label: "The storm or enemy destroys the city a second time", cluster: lament}
  gate-lock-and-door-torn-out: {label: "The enemy cuts the lock of the city or temple gate, tears out its doors, bolt and doorframe", cluster: lament}
  foundations-overturned-filled-with-dust: {label: "The city's or temple's foundations are overturned and filled with dust", cluster: lament}
  temple-tower-reaching-heaven: {label: "A temple tower (ziggurat) is said to reach up to heaven", cluster: cult}
  lament-cry-o-destroyed-city-and-house: {label: "Refrain cry 'O the destroyed city! O the destroyed house!'", cluster: lament}
  doorkeeper-gods-of-temple-gate: {label: "Named doorkeeper deities guard the temple gate (Ka-ḫeĝala and Igi-ḫeĝala at Eridug)", cluster: cult}
  gate-where-fates-are-determined: {label: "A temple gate (the lion-faced gate) is the place where fates are determined", cluster: cult}
  temple-cult-and-festivals-cease: {label: "In the ruined temple the offerings, festivals, songs, drums and priestly offices cease", cluster: lament}
  disembowelled-blood-spilled: {label: "A victim's blood and the fluids of his guts are spilled out", cluster: war}
  birds-of-ruined-city-mourn: {label: "Birds of the destroyed city, a bird of heart's sorrow, nest or cry among the ruins", cluster: lament}
  ruined-site-overgrown-with-thornbushes: {label: "Wild thornbushes from the mountains grow over the ruined city or shrine", cluster: lament}
  enemy-sees-forbidden-holy-vessels: {label: "Foreign destroyers look upon the holy vessels of the temple that no one may look at", cluster: lament}
  elam-shimashki-destroyers: {label: "The Elamites and Šimaškians are the destroyers of a Sumerian city", cluster: lament}
  treasures-scatter-like-birds: {label: "The temple's treasures go off like small birds shooed from their hiding places", cluster: lament}
  goddess-tears-hair-breast-eyes-in-lament: {label: "A goddess claws at her breast and eyes, tears out her hair like rushes and wails for her city", cluster: lament}
  goddess-with-dagger-and-sword-mourning: {label: "A mourning goddess holds a dagger and a sword in her two hands and clashes them together", cluster: lament}
  city-without-its-woman: {label: "The ruined city is addressed as one whose woman (lady) no longer dwells in it", cluster: lament}
  god-destroys-but-does-not-abandon: {label: "Refrain: the god destroyed his city but did not abandon it, and his name is still invoked at his table", cluster: lament}
  gods-destroy-their-own-cities-catalogue: {label: "A catalogue of deities who each destroyed their own city (Enlil Nibru, Aruru Keš, Nanna Urim, Inana Unug)", cluster: lament}
  famine-decimates-land: {label: "The god decimates the land with famine", cluster: lament}
  who-has-seen-such-destruction: {label: "Lament question 'who has ever seen a destruction like that of your city?'", cluster: lament}
  how-long-built-how-long-destroyed: {label: "Lament question: for how long was it built, for how long is it destroyed?", cluster: lament}
  no-one-goes-up-to-offering-terrace: {label: "No one goes up to the god's offering place and his name is no longer called at meals", cluster: lament}
  god-mourns-lies-down-fasting: {label: "A god in grief wails and lies down fasting", cluster: lament}
  appeal-to-god-to-return-to-city: {label: "Persuasion of an absent god: living in an alien city or house is miserable, return your heart to your city and temple", cluster: lament}
  throne-and-bed-speak-to-returning-god: {label: "Prayer that the god's throne, bed, house and dais say to him 'sit down', 'lie down', 'rest'", cluster: lament}
  citys-night-is-over-its-day-long: {label: "Consolation: the city's day is long, its night is over", cluster: lament}
  father-an-to-soothe-heart: {label: "Prayer that the god's father An soothe his heart", cluster: lament}
  waters-recede-from-temple-swamp-walkable: {label: "The waters around a water-girt shrine recede; one can walk on its wide swamp", cluster: lament}
  sacred-boat-of-god: {label: "A god's sacred boat (Wild goat of the Abzu) is named and its waters dry up", cluster: cult}
  keshs-creation-place-of-land: {label: "Keš is called the place where the Land was created (ki-ulutim2 kalam-ma)", cluster: creation}
  temple-of-seven-corners-seven-fires: {label: "Inana's E-ana is the house of seven corners and seven fires", cluster: cult}
  goddess-chosen-by-an-for-ladyship: {label: "The sky god An chooses a goddess in his holy heart and makes her worthy of ladyship of the Land", cluster: hymn}
  goddess-made-fit-for-divine-husband: {label: "Enlil looks favourably on a young goddess and makes her fit as wife for her divine husband", cluster: hymn}
  deity-decrees-fates-of-all-lands: {label: "A deity in his or her temple decides the fate of all the countries", cluster: kingship}
  deity-renders-verdicts-and-judgments: {label: "A deity renders verdicts and decrees judgments (di kud)", cluster: kingship}
  deity-word-firm-and-enduring: {label: "The deity's word is firmly grounded, trustworthy and enduring, never to be cut off", cluster: hymn}
  deity-word-clear-as-daylight-for-king: {label: "The deity's holy words and joyful face shine for the king like daylight", cluster: kingship}
  deity-gives-king-lofty-name: {label: "A deity gives the king a lofty name and speaks friendly words to him", cluster: kingship}
  deity-chooses-shepherd-king-in-assembly: {label: "A deity chooses the ruler, 'the true shepherd', in the divine assembly for his attractiveness or worth", cluster: kingship}
  deity-brings-divine-powers-from-heaven: {label: "A deity brings the divine powers (me) down from the midst of heaven, given by her father An", cluster: cosmology}
  hymn-repeats-each-stanza-with-name: {label: "Each stanza is sung twice, the second time naming the deity or king (litany-like repetition)", cluster: liturgy}
  goddess-righteous-among-gods: {label: "The goddess is called the righteous one among the gods and the wife of the warrior god", cluster: hymn}
  ruler-will-praise-deity-in-city: {label: "Promise that the chosen ruler will duly praise the deity in her city", cluster: cult}
  goddess-unknowable: {label: "No one can learn or know what the deity truly is", cluster: hymn}
  goddess-issues-from-midst-of-heaven: {label: "The goddess, clothed in terrifying awe, comes forth from the midst of heaven", cluster: hymn}
  good-shepherd-king-dies: {label: "Evil comes upon the city and makes the trustworthy shepherd-king pass away", cluster: kingship}
  gods-change-decreed-fate-deceitfully: {label: "The high gods alter their holy word and 'deceitfully' change the fate they had decreed for the king", cluster: theodicy}
  gods-react-to-kings-death: {label: "At the king's death the gods mourn: a goddess laments, Enki shuts his door and lies fasting, the moon god frowns, the sun does not rise", cluster: kingship}
  queen-mother-goddess-weeps-for-son: {label: "The divine mother of the king weeps 'Oh my heart!' for her son in the public square", cluster: lament}
  land-fails-after-kings-death: {label: "After the king's death the canals, barley and pastures fail and the land grows 'grass of mourning'", cluster: kingship}
  king-lies-sick-hands-cannot-grasp: {label: "The dying king lies sick: his hands cannot grasp, his feet cannot step, he cannot raise his neck", cluster: death}
  fallen-king-as-felled-tree: {label: "The fallen king is a felled cypress, boxwood or cedar against which axes are set", cluster: death}
  appointed-day-arrived-died-in-prime: {label: "The king's appointed day arrives and he dies in his prime", cluster: death}
  kings-offerings-rejected-by-gods: {label: "The pious king's sacrifices and gifts are no longer accepted by the gods", cluster: theodicy}
  royal-boat-sunk-in-foreign-land: {label: "The dead king is a boat sunk in a land foreign as Dilmun, stripped of oars, poles and rudder", cluster: death}
  animals-buried-with-dead-king: {label: "The king's donkeys and chariot are buried with him", cluster: death}
  road-to-netherworld-desolate: {label: "The journey to the netherworld is a desolate road on which no one goes up and down", cluster: underworld}
  gifts-to-netherworld-porters-and-gods: {label: "The dead king presents gifts to the seven chief porters and to each netherworld deity in their palaces", cluster: underworld}
  dead-kings-and-priests-in-netherworld: {label: "Famous dead kings and dead priests in the netherworld announce the newcomer's arrival and a tumult arises", cluster: underworld}
  bitter-food-brackish-water-of-netherworld: {label: "The food of the netherworld is bitter and its water brackish", cluster: underworld}
  netherworld-feast-for-the-dead: {label: "The newly dead king slaughters bulls and sheep and seats the dead at a great banquet", cluster: underworld}
  gilgamesh-king-and-judge-of-netherworld: {label: "Gilgameš is king and judge in the netherworld", cluster: underworld}
  dead-king-made-judge-in-netherworld: {label: "The dead king is seated on a dais in the netherworld and with Gilgameš renders its judgments; the slain and the guilty are given into his hands", cluster: underworld}
  dead-king-laments-unfinished-works: {label: "The dead king laments that he could not finish his city wall, enjoy his new palace, embrace his wife, dandle his sons or see his daughters grown", cluster: death}
  pious-king-complains-gods-did-not-help: {label: "A pious king complains: I served the gods day and night, built them shrines and gave them treasures, yet no god stood by me", cluster: theodicy}
  wife-of-dead-king-abandoned-by-gods: {label: "The dead king's widow weeps all day, abandoned by her protective gods, like a boat adrift in a storm or a trapped wild ass, lion or caged dog", cluster: lament}
  music-turned-to-lament: {label: "The singer's songs and instruments are turned into lamentation and propped against the wall", cluster: lament}
  grave-in-steppe-instead-of-throne-and-bed: {label: "Instead of his beautiful throne and bed the dead king lies in an earth-filled pit in the desolate steppe", cluster: death}
  goddess-protests-to-high-gods-over-death: {label: "A goddess goes to the high god's temple and rails against the gods' unchangeable decree over the death of her beloved king", cluster: theodicy}
  word-of-high-god-unchangeable: {label: "'Who can change the word that An, the king, has spoken?': the high god's decree cannot be altered", cluster: theodicy}
  dead-king-name-praised-for-canals-and-fields: {label: "The dead king is granted a fate: his name will be invoked and his canals, fields, drained reed-beds and fortresses admired", cluster: kingship}
  no-enough-from-an-days-not-completed: {label: "The high god does not say 'enough' (stop the evil), and the king's days are not filled", cluster: theodicy}
  arali-netherworld-name: {label: "The netherworld is called Arali (or kur, irigal), where the dead king is brought", cluster: underworld}
  namtar-decrees-fates: {label: "Namtar, the netherworld deity of fate, 'decrees all the fates'", cluster: underworld}
  scribe-goddess-of-netherworld: {label: "A goddess is the chief scribe of the netherworld, given stylus, measuring line and rod", cluster: underworld}
  seven-or-ten-days-pass: {label: "After seven days, ten days had passed (a stock time formula)", cluster: narrative}
  goddess-absent-on-mission-at-judgment: {label: "The king's patron goddess was absent when his fate was decided, sent away by Enlil on a mission to foreign lands", cluster: theodicy}
  goddess-in-rage-shakes-heaven-and-earth: {label: "The goddess in her fury makes heaven tremble and earth shake and destroys cattlepens and sheepfolds", cluster: theophany}
  once-bowed-down-cannot-return: {label: "Enlil tells the grieving goddess the dead cannot come back: the shepherd has left and she will not see him again", cluster: death}
  goddess-refuses-to-enter-temple-without-beloved: {label: "The goddess will not enter her temple unless her dead beloved can enter it before her", cluster: lament}
  beloved-like-greenery-in-desert: {label: "Wish that the dead beloved could grow again like greenery in the desert and be moored like a boat at a calm quay", cluster: death}
  enlil-drives-away-evil-spirits: {label: "The high god drives away the evil spirits (udug ḫul)", cluster: magic}
  closing-praise-of-deity-za3-mi2: {label: "A Sumerian composition closes with 'praise be to (deity)' (za3-mi2)", cluster: liturgy}
  god-chooses-king-from-multitude: {label: "The high god looks among the multitude of people and chooses the king to be his shepherd", cluster: kingship}
  god-commissions-king-to-build-temple: {label: "The god instructs the chosen king to build or raise high his temple", cluster: cult}
  king-prepares-brick-mould: {label: "The king himself prepares the brick mould and lays the foundation for the temple", cluster: cult}
  temple-foundation-pegs-and-incantations: {label: "Temple foundations are laid, holy foundation pegs driven in, and priests and Enki purify it with incantations", cluster: cult}
  temple-gates-named-and-silvered: {label: "The temple's named gates are listed and covered with refined silver", cluster: cult}
  gods-feast-in-new-temple-decree-fate: {label: "The gods dine in the new temple, rejoice and decree a great destiny for the king who built it", cluster: cult}
  god-speaks-my-word-immutable: {label: "The god speaks in the first person: 'I am he whose commands and decisions are immutable'", cluster: theophany}
  god-gives-king-mace-to-crush-lands: {label: "The god gives the king a mighty mace that heaps up enemy heads like dust and smashes rebel lands", cluster: kingship}
  king-destroys-cities-of-wicked: {label: "The king destroys the cities of the wicked and turns them into haunted ruins", cluster: kingship}
  king-fame-to-ends-of-heaven: {label: "Wish that the king's fame spread to the borders of heaven and the foot of the mountains", cluster: kingship}
  royal-self-praise-hymn: {label: "The king praises himself in the first person, listing what each god gave him and his deeds (Sumerian royal hymn)", cluster: kingship}
  gods-give-rain-and-abundance-through-king: {label: "Because of the king An gives rain and the gods give floods, grain and abundance", cluster: kingship}
  king-formed-by-mother-goddess: {label: "The king claims the birth goddess Nintur formed him and attended his birth", cluster: kingship}
  king-conceived-in-holy-womb-of-goddess: {label: "The king's seed was placed in a holy womb and he was born of a goddess-mother (Ninsumun)", cluster: kingship}
  king-named-and-fated-at-birth: {label: "At the king's birth the high god called him by a good name and a favourable destiny was decreed", cluster: kingship}
  king-chosen-by-extispicy: {label: "The god chooses the king by extispicy on an auspicious day", cluster: kingship}
  king-establishes-justice-crushes-evildoers: {label: "The king makes justice shine, defeats wickedness, puts his foot on the neck of thieves and catches evildoers like snakes", cluster: law}
  king-as-good-shepherd-sheep-multiply: {label: "The king is the good shepherd under whom the sheep multiply and pens and folds are enlarged", cluster: kingship}
  roads-made-safe-under-king: {label: "Under the king the roads, even in the desert, are made passable and safe", cluster: kingship}
  king-frees-poor-from-labor-and-tax: {label: "The king frees the poor from forced duties and imposes no taxes on crops", cluster: law}
  king-restores-after-gutian-oppression: {label: "The king frees the land from the hands of the Gutians, returns people to their homes and rebuilds walls", cluster: kingship}
  king-brother-of-gilgamesh: {label: "The king calls himself the brother of Gilgameš, son of the goddess Ninsumun", cluster: kingship}
  kingship-descended-from-heaven: {label: "Kingship came down from heaven (to the king or city)", cluster: kingship}
  king-sacred-marriage-bed-in-gipar: {label: "The king, clothed in linen, lies on the splendid bed in the ĝipar (sacred-marriage setting)", cluster: cult}
  king-digs-canals-trees-on-banks: {label: "The king releases water into canals and makes trees grow on their banks", cluster: kingship}
  king-asks-life-as-reward: {label: "The king asks for life as the reward for his temple-building and offerings", cluster: kingship}
units:
  - id: ane-etcsl-2-2-5-a-destroyer-created
    tradition: ane-sumerian
    title: The gods fashion the monstrous destroyer; who did this to Unug? (Lament for Unug, kirugu 1)
    corpus: ane
    original: true
    tagger: Claude (model), reading the Sumerian
    read: ["ETCSL 2.2.5 A.A:1-27", "ETCSL 2.2.5 B.A:1-8"]
    tags:
      - {motif: humans-multiply-as-numerous-as-gods, refs: ["ETCSL 2.2.5 A.A:4"], note: "lu2 til3 diĝir-re-e-[ne-gin7] a-na me bi2-ib-tab, 'living man ... doubled himself like the gods'; 'like the gods' partly restored; the lines before it are broken"}
      - {motif: humans-multiply-as-numerous-as-gods, refs: ["ETCSL 2.2.5 B.A:3"], note: "[uĝ3 saĝ gig2-ga] a-ba-a in-lu-lu-un, 'who made the black-headed numerous?'; subject restored"}
      - {motif: divine-council, refs: ["ETCSL 2.2.5 A.A:5", "ETCSL 2.2.5 A.A:7", "ETCSL 2.2.5 A.A:8"], note: "ĝalga sud-e ... sig10; Enki and Ninki 'set the counsel', Enul and Ninul 'decreed the fate' (nam bi2-in-tar)"}
      - {motif: great-gods-jointly-fashion-destroyer, refs: ["ETCSL 2.2.5 A.A:9", "ETCSL 2.2.5 A.A:10", "ETCSL 2.2.5 A.A:11"], note: "An and Enlil 'gave birth' to it (ba-an-u3-tud-uš), Ninlil gave it features (muš3-me), Aruru, Suen and Enki fashioned its limbs (me-dim2)"}
      - {motif: gods-pale-before-own-creation, refs: ["ETCSL 2.2.5 A.A:13"], note: "diĝir gal-gal-e-ne kuš3-kuš3-ta ba-an-sig7-ge-eš"}
