      - "A king brings a lament for the destroyed city: compare Lamentations as liturgy and Neh 1:4-11, Dan 9:3-19; Ps 102:14-15 (pity for Zion's stones)."
      - "Unchangeable order since creation: Jer 31:35-36, Jer 33:20-21, Ps 148:6."
  - id: ane-etcsl-2-2-6-1a-storm-over-eridug
