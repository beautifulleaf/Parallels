    title: The storm covers Eridug; Enki stands outside his city as if it were foreign (Lament for Eridug, kirugu 1)
    corpus: ane
    original: true
    tagger: Claude (model), reading the Sumerian
    read: ["ETCSL 2.2.6 1.A.A:5-27", "ETCSL 2.2.6 1.A.B:28-29"]
    tags:
      - {motif: storm-covers-city-like-cloak, refs: ["ETCSL 2.2.6 1.A.A:5", "ETCSL 2.2.6 1.A.A:6"], note: "ud te-eš dug4-[ga tug2-gin7 ba-e-dul gada-gin7 ba-e-bur2]; line 5 largely restored from line 6; lines 1-4 missing"}
      - {motif: silence-like-a-cloak-over-people, refs: ["ETCSL 2.2.6 1.A.A:9", "ETCSL 2.2.6 1.A.A:10"], note: "niĝ2-me-ĝar u18-lu-gin7 ba-e-dul"}
      - {motif: god-stays-outside-city-as-if-foreign, refs: ["ETCSL 2.2.6 1.A.A:11", "ETCSL 2.2.6 1.A.A:12"], note: "a-a {d}en-ki iri-ni iri kur2-gin7 bar-ta ba-ra-gub er2 gig mu-un-še8-še8"}
      - {motif: god-weeps-over-own-city, refs: ["ETCSL 2.2.6 1.A.A:11-13"]}
      - {motif: city-gods-and-protective-spirits-abandon-city, refs: ["ETCSL 2.2.6 1.A.A:14", "ETCSL 2.2.6 1.A.A:15"], note: "nin-bi mušen dal-a-gin7 iri-ni ba-ra-e3: 'its lady left her city like a flying bird' (Damgalnuna)"}
      - {motif: divine-powers-of-city-overturned, refs: ["ETCSL 2.2.6 1.A.A:16", "ETCSL 2.2.6 1.A.A:17"], note: "iri me kug-kug-ga me-bi šu ba-ab-bal; ĝarza ... me-bi ba-da-kur2"}
      - {motif: storm-strikes-good-and-evil-alike, refs: ["ETCSL 2.2.6 1.A.A:19", "ETCSL 2.2.6 1.A.A:20"], note: "ud sig5 ḫul nu-ĝal2-la sag9-ga nu-zu ḫul nu-zu-e: 'a storm that knows neither good nor evil'"}
      - {motif: barbarian-invaders-gutium-subir, refs: ["ETCSL 2.2.6 1.A.A:21"], note: "su-bir4{ki}-e a-gin7 im-mi-ib2-ĝar, 'Subir poured down like water/rain'"}
      - {motif: sun-sets-at-noon, refs: ["ETCSL 2.2.6 1.A.A:22", "ETCSL 2.2.6 1.A.A:23", "ETCSL 2.2.6 1.A.A:24"], note: "ud zalag-ga e3-a ud ba-da-ku10-ku10; {d}utu an-ur2-ra šu2-a-gin7 an-usan-še3 ba-du3"}
      - {motif: divine-curse-on-city, refs: ["ETCSL 2.2.6 1.A.A:25", "ETCSL 2.2.6 1.A.A:26"], note: "iri an-ne2 nam ba-an-ku5-ra2-gin7 'as if An had cursed the city'; Enlil's frown (saĝ-ki gid2-da)"}
      - {motif: lament-cry-o-destroyed-city-and-house, refs: ["ETCSL 2.2.6 1.A.B:28"], note: "a uru2 gul-la e2 gul-la-ri gig-ga-bi im-me"}
      - {motif: kirugu-gisgigal-song-structure, refs: ["ETCSL 2.2.6 1.A.A:27", "ETCSL 2.2.6 1.A.B:29"]}
    hints:
      - "God outside his own city, weeping: compare Jer 12:7 ('I have forsaken my house'), Jer 9:1, Lam 2:7; Ezek 11:23."
      - "A storm that does not tell good from evil: Ezek 21:8-9 (righteous and wicked cut off), Gen 18:23-25 (Abraham's question), Q 8:25 ('fear a trial that strikes not only the wrongdoers')."
      - "Day darkened at noon: Amos 8:9, Jer 15:9."
