    read: ["PT213 W1"]
    tags:
      - {motif: dead-king-departed-alive-not-dead, refs: ["PT213 W1:206-206/2"], note: "n šmi̯.n=k js m(w)t.tj, šmi̯.n=k ꜥnḫ.t"}
      - {motif: slain-in-gods-way-are-alive, refs: ["PT213 W1:206-206/2"], note: "only as a parallel formula: the dead declared not dead but alive"}
      - {motif: dead-king-enthroned-rules-living-and-dead, refs: ["PT213 W1:206/3"], note: "on the throne of Osiris, ꜥbꜣ-sceptre to command the living, lotus-bud sceptre to command 'those of secret places' (the dead)"}
