  - id: ane-pt273-w1-cannibal-hymn-1
    tradition: ane-egyptian
    title: "Cannibal Hymn (Unas) I: the sky quakes; the king, mightier than Atum, has the gods hunted"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Egyptian"
    version: "W1, pyramid of Unas (PT 273-274)"
    read: ["PT273-274 W1:496-511/2"]
    tags:
      - {motif: sky-and-earth-quake-at-kings-appearance, refs: ["PT273-274 W1:496"], note: "gp p,t jḥy sbꜣ.pl nmnm pḏ,t.pl sdꜣ qs.pl ꜣkr.w: the sky clouds, the stars darken, the vault shakes, the bones of the earth gods tremble"}
      - {motif: king-whose-name-mother-does-not-know, refs: ["PT273-274 W1:500"], note: "ḫm.n mʾw,t=f rn=f"}
      - {motif: king-mightier-than-his-begetter, refs: ["PT273-274 W1:501-502/2"], note: "jw msi̯.n=f sw, wsr sw r=f"}
      - {motif: king-eats-gods-to-absorb-their-power, refs: ["PT273-274 W1:496", "PT273-274 W1:505/2", "PT273-274 W1:509-511/2"], note: "ꜥnḫ m jt(j).pl=f wšb m mʾw,t.pl=f 'who lives on his fathers and feeds on his mothers'; wnm rmṯ ꜥnḫ m nṯr.pl 'who eats men and lives on gods'; the gods are lassoed, guarded, bound, stabbed, disembowelled and cooked by Shesemu"}
      - {motif: hidden-god-of-unknown-dwelling, refs: ["PT273-274 W1:508"], note: "the king judges with jmn rn=f 'He-whose-name-is-hidden' on the day of slaughtering the eldest"}
      - {motif: deity-is-bull-of-heaven, refs: ["PT273-274 W1:505/2"], note: "Wnjs pj kꜣ p,t 'Unas is the Bull of the sky'"}
    hints:
      - "Theophany shaking heaven and earth: compare Judg 5:4-5, Ps 18:8-16 and Ps 68:9."
      - "A name no one knows: compare Rev 19:12 and Judg 13:18; Gen 32:30."
      - "Gods eaten: contrast Ps 50:12-13 ('do I eat the flesh of bulls?') and the mocking of gods who eat, Bel and the Dragon; Deut 32:38."
  - id: ane-pt273-w1-cannibal-hymn-2
