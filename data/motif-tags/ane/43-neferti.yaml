      - {motif: no-accusation-on-earth-or-in-heaven, refs: ["PT302 W1:570-571"], note: "n mdw n(,j) Wnjs r tꜣ ḫr rmṯ, n ḫbn,t=f r p,t ḫr nṯr.pl"}
      - {motif: eternal-throne-not-given-to-another, refs: ["PT302 W1:567/2-568", "PT302 W1:569/2-569/3"], note: "his house in the sky will not perish, his throne on earth will not vanish; 'he will not give it to any other'"}
