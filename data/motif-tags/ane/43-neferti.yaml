      - {motif: eye-of-horus-eaten-as-food, refs: ["PT219 267-267/2"], note: "wnm.t.n=k jr(,t) ... j:fḫ n=k s(j) zꜣ=k Ḥr(,w) ꜥnḫ=k jm=s"}
