      - {motif: gods-sent-to-four-quarters-to-announce-king, refs: ["PT217 W1:223/4", "PT217 W1:226", "PT217 W1:228/4", "PT217 W1:231/3"], note: "Seth and Nephthys to the south, Osiris and Isis to the north, Thoth to the west, Horus to the east"}
      - {motif: god-kills-and-makes-alive, refs: ["PT217 W1:224/2-224/3", "PT217 W1:227/2-227/3", "PT217 W1:230-230/2", "PT217 W1:232/2-232/3"], note: "mri̯.w=f m(w)t=ṯn m(w)t=ṯn, mri̯.w=f ꜥnḫ=ṯn ꜥnḫ=ṯn: whom he wishes to die dies, whom he wishes to live lives (here said of the dead king)"}
      - {motif: god-tests-hearts-and-kidneys, refs: ["PT217 W1:229"], note: "as Anubis: jp=f jb.pl sḫm=f m ḥꜣ,t(j).pl 'that he may reckon the hearts and have power over the hearts'"}
    hints:
      - "Whom he will he kills, whom he will he keeps alive: compare Deut 32:39, 1 Sam 2:6 and Q 2:258 (Abraham and the king: 'I give life and cause death')."
      - "Received into the father's embrace: compare Ps 2:7 and Ps 73:24."
