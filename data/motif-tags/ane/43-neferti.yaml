    read: ["PT273-274 W1:512-524/2"]
    tags:
      - {motif: gods-portioned-into-three-meals, refs: ["PT273-274 W1:512/2-513/3"], note: "the great for breakfast, the middle for supper, the small for the night meal, old men and women for fuel, cauldrons heated with the thighs of their eldest"}
      - {motif: king-eats-gods-to-absorb-their-power, refs: ["PT273-274 W1:512", "PT273-274 W1:517/3-521", "PT273-274 W1:523"], note: "eats their ḥkꜣ (magic), swallows their ꜣḫ; breaks the spines, takes the hearts, eats the Red Crown/blood, swallows the Green; jw ꜥm.n=f sjꜣ n(,j) nṯr nb 'he has swallowed the knowledge (Sia) of every god'"}
      - {motif: king-ascends-to-heaven, refs: ["PT273-274 W1:514-514/2", "PT273-274 W1:517-517/2"], note: "he has circled the two skies; appears again in the sky, crowned as lord of the horizon"}
      - {motif: wills-and-does, refs: ["PT273-274 W1:520/3"], note: "Mrr≡f-jrr≡f msḏḏ≡f-n-jri̯,n≡f; his lifetime is nḥḥ, his limit ḏ,t"}
      - {motif: king-older-than-the-eldest, refs: ["PT273-274 W1:516-516/4"], note: "nṯr sms r sms,w; thousands serve him, hundreds offer to him; Orion, father of the gods, gave him power"}
      - {motif: evildoers-cannot-destroy-kings-place, refs: ["PT273-274 W1:524/2"]}
    hints:
      - "Eating to gain knowledge: compare Gen 3:5-6, 22 (the fruit that makes 'like gods, knowing')."
      - "He does whatever he pleases: compare Ps 115:3, Ps 135:6, Dan 4:32 (35) and Q 85:16 ('doer of what he wills', fa''al li-ma yurid), Q 11:107."
      - "Older than the eldest: compare Dan 7:9 ('Ancient of days') and John 8:58."
