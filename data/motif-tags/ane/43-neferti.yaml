      - {motif: failure-of-flood-brings-death, refs: ["NileHymn W5:2_5-2_6"]}
      - {motif: hidden-god-of-unknown-dwelling, refs: ["NileHymn W5:3_1/2", "NileHymn W5:4_13/2"]}
      - {motif: precious-stones-cannot-be-eaten, refs: ["NileHymn W5:4_4-4_4/2"]}
      - {motif: festival-offerings-for-flood-god, refs: ["NileHymn W5:4_10/2-4_12"]}
      - {motif: refrain-flourish-come, refs: ["NileHymn W5:5_2", "NileHymn W5:5_3", "NileHymn W5:5_4/2"], note: "variant: wꜣḏ kꜣpw.tw=f 'may he flourish, that he be censed'; the scribe marks stanzas with grḥ 'pause'"}
  - id: ane-nilehymn-w6-pturin
    tradition: ane-egyptian
    title: The Great Nile Hymn in a Turin papyrus, dedicated in the house of Ramesses IV
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Egyptian"
    version: "W6, pTurin Cat. 1968+1890+1878 recto"
    read: ["NileHymn W6"]
    tags:
      - {motif: failure-of-flood-brings-death, refs: ["NileHymn W6:x+2_1/2-x+2_1/3"]}
      - {motif: land-laughs-when-flood-comes, refs: ["NileHymn W6:x+2_3/2-x+2_4"]}
