# Full read of the ANE corpus, chunk 27: SAA 3 literary texts (Underworld Vision, Shalmaneser epic, sufferer's prayer to Nabû, Marduk Ordeal, mystical commentary ...),
# SAA 9 Assyrian prophecies (Esarhaddon and Assurbanipal oracles), SAA 20 Assyrian royal rituals.
# Read from ORACC lemmatized transliterations (word glosses only, no translation); tags rest on the Akkadian.
new_motifs:
  prince-incubates-dream-of-netherworld-queen: {label: "A prince (Kummaya) prays with incense to the netherworld queen, and she appears to him in a night dream promising to show him what he asks", cluster: underworld}
  dreamer-wakes-moaning-like-dove: {label: "The visionary wakes from the dream and moans like a dove (kīma summe idmum)", cluster: revelation}
  vision-of-hybrid-netherworld-gods: {label: "In a vision of the netherworld the seer sees a row of gods and demons with composite bodies (lion, bird, ox, serpent-dragon heads; human hands, bird feet), each named", cluster: underworld}
  black-man-with-anzu-face-in-red-garment: {label: "In the netherworld vision one young man, his body black as pitch and his face like the Anzu bird's, wears a red garment, holds a bow and sword and treads on a snake", cluster: underworld}
  netherworld-king-enthroned-lightning-flashing: {label: "The netherworld king (Nergal) sits on a royal throne with a crown, holding two fierce maces, lightning flashing from his arms, the Anunnaki kneeling right and left", cluster: underworld}
  seer-seized-by-forelock-brought-before-god: {label: "The seer is seized by the forelock (abūsātu) and dragged before the enthroned god", cluster: revelation}
  seer-kisses-feet-of-terrifying-god: {label: "Overwhelmed by the god's radiance, the seer trembles, kisses the god's feet and kneels", cluster: revelation}
  divine-counsellor-intercedes-let-young-man-live: {label: "A divine adviser (Išum) intercedes with the angry god who wants to kill the seer: 'Do not let the young man die'", cluster: underworld}
  seer-released-to-tell-what-he-saw: {label: "The god releases the visionary from the netherworld with a commission: may this word lodge like a thorn in your heart, go up and proclaim it", cluster: revelation}
  dead-king-seen-in-netherworld-vision: {label: "In the netherworld vision the seer is shown the corpse (pagru) of a great king, his own father, conqueror from sunrise to sunset", cluster: underworld}
  visionary-wakes-eating-dust-crying-woe: {label: "After the vision the seer runs into the street like a man who has shed blood, crying 'woe, my heart!' and putting dust of the street into his mouth", cluster: revelation}
  scribe-hears-vision-and-reports-to-palace: {label: "A scribe who hears the vision takes it to heart and reports it to the palace as a warning (namburbû) for himself", cluster: revelation}
  shalmaneser-campaign-against-urartu: {label: "Epic of an Assyrian king's campaign against Urartu: the enemy flees into mountains and forests, cities burned, booty taken, stelae set up on mountain and sea", cluster: war}
  enemies-flee-to-mountains-and-forests: {label: "Overwhelmed by the king's (or god's) terrifying radiance, the enemy abandons its cities and flees into mountains and forests", cluster: war}
  royal-image-set-up-on-mountain-and-sea: {label: "The conqueror sets up his image (stele) of power in the mountains and by the sea", cluster: kingship}
  sufferer-did-not-sin-yet-afflicted: {label: "The sufferer protests that he is afflicted though he did not sin or act wrongly toward his god", cluster: lament}
  sufferer-old-before-his-time: {label: "The sufferer complains that old age overtook him before his time and lifted him onto his bed", cluster: lament}
  sufferer-reduced-to-begging-from-slaves: {label: "The sufferer, made small, stretches his hands toward the poor and prays even to slave and slave-girl", cluster: lament}
  abundance-for-others-poison-for-me: {label: "Lament: on the people the god rains abundance; on me he rains poison and gall", cluster: lament}
  sufferer-at-gate-of-death: {label: "The sufferer has reached the gate of death (abul mūti) and asks the god: why have you abandoned me?", cluster: lament}
  do-not-shame-me-in-assembly-of-gloaters: {label: "The sufferer begs the god not to abandon him or shame him before the assembly of those who rejoice at his misfortune", cluster: lament}
  gods-breath-revives-dead: {label: "By the god's breath (wind) the dead lives again", cluster: life}
  litany-of-blessing-on-city-and-king: {label: "A litany-like blessing on the god's city and its king: may he enter and enter, oil poured on the head, wool beyond count, bread great and beer flourishing", cluster: blessing}
  tree-taller-than-others-cut-down: {label: "A speaker likens himself to a fine tree standing tall in the garden, which has now been cut down, so that the father who rejoiced now weeps", cluster: lament}
  god-held-captive-in-mountain: {label: "The chief god (Bēl/Marduk) is held captive in the 'mountain' or prison house, guarded, and later comes out", cluster: myth}
  goddess-searches-streets-for-captive-god: {label: "A goddess roams the streets searching for the captive god: 'where is he held?' and goes to the gate of the grave", cluster: myth}
  criminal-killed-alongside-god: {label: "A criminal (bēl hiṭṭi) is held with the captive god and killed; his head is tied to the goddess's chariot", cluster: myth}
  son-god-comes-to-ask-after-captive-father: {label: "The son god (Nabû) comes from his city to ask after the welfare of his captive father", cluster: myth}
  cultic-acts-explained-as-myth: {label: "A cultic commentary explains each ritual act or object of a festival as an episode of a myth ('the X which ... is the Y')", cluster: cult}
  assur-existed-before-heaven-and-earth: {label: "Enūma eliš is reinterpreted: before heaven and earth were created, Aššur existed", cluster: creation}
  tablet-curse-against-erasing-or-showing: {label: "Colophon curse: whoever erases or soaks this tablet, or shows it to one who is not initiated, may the gods curse him", cluster: scribal}
  curse-flesh-to-dogs-name-and-seed-destroyed: {label: "Curse: may the gods eradicate his name and seed from the land and give his flesh to the mouth of dogs", cluster: treaty}
  goddess-weeps-for-slain-brother-god: {label: "A goddess weeps and wails for her slain brother god and sees his body, its blood flowing to the earth", cluster: myth}
  flayed-god-skin-is-constellation: {label: "A defeated god is bound and flayed; his skin is put on a constellation (Orion) and his body handed to the Anunnaki", cluster: cosmology}
  victor-god-treads-neck-of-enemy: {label: "The victorious god treads on the neck of his insubmissive enemy", cluster: myth}
  dumuzi-mourned-month-of-tammuz: {label: "Rites of the month Tammuz: day of lamentation, Dumuzi is questioned and goes up, roasted grain cast on him", cluster: cult}
  body-of-god-made-of-plants: {label: "A god's body parts are equated one by one with plants, trees and substances (tamarisk his tuft, cedar his knee, myrrh his moisture ...)", cluster: cult}
  secret-of-gods-for-initiate: {label: "Colophon: the secret of the great gods; the knowing may show it to the knowing, the unknowing may not see it, taboo of the great gods", cluster: scribal}
  goddess-oracle-i-am-ishtar-of-arbela: {label: "Oracle formula of self-presentation: 'I am Ištar of Arbela' (anāku Issār ša Arbail), the goddess speaking in the first person through a prophet", cluster: prophecy}
  oracle-attributed-to-named-prophet: {label: "An oracle ends with the formula 'from the mouth of' (ša pî) a named prophet or prophetess and his or her home town", cluster: prophecy}
  enemies-roll-before-kings-feet: {label: "The deity promises: the king's enemies will roll (writhe) or be laid down before his feet", cluster: kingship}
  goddess-goes-before-and-behind-king: {label: "The goddess promises to go before the king and behind him", cluster: prophecy}
  god-recalls-former-oracles-fulfilled: {label: "The deity reminds the king that her earlier words proved reliable ('which of my words did you not rely on?') and asks him to trust the present one", cluster: prophecy}
  gods-at-kings-right-and-left: {label: "Gods stand at the king's right and left (Sîn right, Šamaš left; sixty great gods around him) and gird his loins", cluster: prophecy}
  do-not-trust-in-man-look-to-me: {label: "Divine command: do not trust in man; lift your eyes and look to me", cluster: prophecy}
  goddess-as-kings-midwife-and-wet-nurse: {label: "The goddess declares herself the king's great midwife and good wet-nurse", cluster: prophecy}
  king-son-of-goddess-mullissu: {label: "The king is called the true heir, son of the goddess Mullissu (or Ninlil), whom she loves greatly", cluster: kingship}
  god-carries-king-like-nurse-on-hip: {label: "The goddess carries the king like a nurse on her hip, puts him between her breasts, keeps watch at night and gives him milk by day", cluster: prophecy}
  god-shelters-king-under-wings: {label: "The deity hovers over the king like a bird over its young, or raises him between her wings", cluster: prophecy}
  kings-throne-firm-for-long-days: {label: "The deity promises the king long days and everlasting years and a throne established firm", cluster: kingship}
  dynasty-promise-sons-grandsons-rule: {label: "The deity promises that the king's son and grandson (and great-grandson) will exercise kingship", cluster: kingship}
  goddess-hears-lament-of-her-calf: {label: "The goddess hears the lament (ikkillu) of her calf, the king, and comes to his aid", cluster: prophecy}
  god-hears-cry-from-gate-of-heaven: {label: "The god hears the king's lament and from the gate of heaven sends fire down on the rebels", cluster: prophecy}
  god-rains-stones-on-enemies: {label: "The god rains (hail)stones of fire on the king's enemies on the mountain and fills the river with their blood", cluster: war}
  covenant-tablet-of-the-god: {label: "A covenant (adê) tablet of the god is brought into the king's presence with oil, sacrifices and incense, and read before him", cluster: covenant}
  covenant-water-drunk: {label: "The people are given water from a jar to drink, sealing a covenant ('you will drink this water and remember and keep the oath')", cluster: covenant}
  god-complains-of-neglected-offerings: {label: "The deity complains that the king has given her nothing: no banquet, no food or cup as in a temple, and demands bread and beer", cluster: cult}
  rebels-impaled: {label: "Those who rose against the king are seized and impaled on stakes", cluster: war}
  i-speak-and-act: {label: "The deity declares herself 'the speaker and the doer' (qābītu ēpištu) whose word is carried out", cluster: divine-attributes}
  god-sees-and-hears-disloyalty: {label: "The deity says: I see and I hear, I search out the disloyal and put them in the king's hand", cluster: prophecy}
  i-am-your-father-and-mother: {label: "The deity tells the king 'I am your father and your mother; I raised you between my wings'", cluster: prophecy}
  divine-sailor-holds-ship: {label: "The goddess guides the king like a good sailor who brings the ship to a good quay", cluster: prophecy}
  divine-puppy-sniffs-out-enemies: {label: "The goddess roams the king's palace like a good puppy, sniffing out his enemies", cluster: prophecy}
  enemies-lick-dust-or-brought-as-tribute: {label: "The deity promises the king's enemies brought in wooden clamps (neck-stocks) and his allies with tribute before his feet", cluster: kingship}
  king-dream-vision-golden-star: {label: "In a vision the king or prophet sees a golden star and an offering table with bread", cluster: revelation}
  god-breaks-enemys-javelin-and-snake: {label: "A god announces 'I have come' and that he cut the snake inside the enemy's javelin, broke the javelin and will crush Elam", cluster: prophecy}
  goddess-roams-steppe-for-king: {label: "The goddess, longing for the king's life, roams the steppe, crosses rivers and seas and mountains, exhausted and sleepless for him", cluster: prophecy}
  goddess-pleads-for-king-in-divine-assembly: {label: "The goddess speaks for the king's life and good in the assembly of all the gods", cluster: prophecy}
  rival-kings-of-lands-conspire: {label: "The kings of the lands say to one another: come, let us go against the king", cluster: kingship}
  substitute-throne-rite-of-temple: {label: "Ritual record: a new throne or furnishing is brought into the temple; a mistake in procedure is reported to the king", cluster: cult}
  akitu-procession-of-gods: {label: "In the New Year (akītu) procession the chief god's chariot leaves for the akītu-house, other gods walking before and behind him", cluster: cult}
  gods-seated-right-and-left-of-chief-god: {label: "Lists of the gods who sit at the chief god's right and left in the festival house", cluster: cult}
  bath-days-of-gods: {label: "A calendar of the days on which the gods' statues receive their new baths", cluster: cult}
  god-shouts-like-raging-storm: {label: "The angry god's voice roars over the seer like a raging storm", cluster: theophany}
  drunken-enemy-surprised: {label: "The enemy eats and drinks wine to drunkenness and is then attacked", cluster: war}
  king-weeps-in-chariot: {label: "The king weeps in his chariot, his eyes filled with tears", cluster: kingship}
  nomads-plunder: {label: "The king plunders nomadic raiders (Ahlamû-Aramaeans) of the steppe", cluster: war}
  lament-refrain-repeated: {label: "A lyric lament opens with a couplet repeated word for word as a refrain", cluster: lament}
  shepherd-farmer-gardener-killed: {label: "Lament list: the shepherd killed over his flock, the farmer at his plough, the gardener in his garden", cluster: lament}
  daughter-of-humbaba-cedar-forest: {label: "A speaker calls (someone) 'daughter of Humbaba', the strong one of the cedar forest", cluster: myth}
  anzu-defeated-by-warrior-god: {label: "The warrior god (Ninurta, or Nabû in commentary) defeats and kills the Anzu bird", cluster: myth}
  children-hidden-from-killer: {label: "A child or heir is hidden away (by parents or goddesses) to protect him from a killer", cluster: myth}
  zarpanitu-prays-for-life-of-captive-god: {label: "The captive god's consort stretches out her hands and prays to Sîn and Šamaš: 'let Bēl live!'", cluster: myth}
  god-garment-blood-stained: {label: "A god's (or hero's) garment is red with the blood of the blows he received", cluster: myth}
  ecstatic-weeps-going-to-goddess: {label: "An ecstatic (mahhû) goes before the goddess weeping as messenger, crying 'my brother, my brother!'", cluster: prophecy}
  god-escapes-from-tomb-or-ziggurat: {label: "The god, shut in by the gods in the temple tower (or tomb), escapes and is brought down from it", cluster: myth}
  milk-before-ishtar-of-nineveh-because-she-raised-him: {label: "Milk is drawn before Ištar of Nineveh because she raised the god and showed him mercy", cluster: cult}
  enuma-elish-recited-at-new-year: {label: "The creation epic Enūma eliš is recited (sung) before the god in the month Nisan", cluster: cult}
  captive-god-prays-asks-what-is-my-sin: {label: "The captive god prays to the sun god: 'I did good deeds for (the high god); what is my sin?' and begs to be kept alive", cluster: myth}
  chariot-without-its-lord: {label: "The god's chariot goes to the festival house without its lord, rocking empty", cluster: cult}
  wailing-woman-circles-city: {label: "A goddess as wailing woman (bākītu) goes round the city lamenting", cluster: lament}
  wind-against-king-wing-broken: {label: "The deity asks: what wind has risen against you whose wing I have not broken?", cluster: prophecy}
  goddess-groans-in-labour-for-king: {label: "The goddess shares the king's distress: 'you in pain, I in woe; I rise, I sit'", cluster: prophecy}
  enemies-delivered-for-slaughter: {label: "The deity hands over the king's enemy for slaughter", cluster: war}
  goddess-rejoices-with-king: {label: "The goddess declares she rejoices with the king and calls on his city to rejoice", cluster: prophecy}
  assur-reconciled-with-king: {label: "A goddess has reconciled the high god (Aššur) with the king, or the angry gods with the land", cluster: prophecy}
  nabu-lord-of-stylus-speaks: {label: "The scribal god Nabû, 'lord of the writing stylus', speaks in an oracle", cluster: prophecy}
  god-watches-from-golden-chamber-in-heaven: {label: "The deity keeps watch over the king from a golden chamber in mid-heaven, making a light of amber shine before him", cluster: prophecy}
  goddess-holds-king-by-hair-in-heaven: {label: "The goddess holds the king by his lock of hair in the great heavens", cluster: prophecy}
  smoke-at-right-fire-at-left: {label: "The deity promises smoke on the king's right and fire on his left", cluster: prophecy}
  divine-dagger-ends-enemies: {label: "With a furious dagger in her hand the goddess finishes off the king's enemies", cluster: war}
  weasels-and-rats-cut-off-before-king: {label: "The plotters against the king are 'weasels and rats' whom the god cuts to pieces before his feet", cluster: prophecy}
  goddess-as-shield-of-king: {label: "The deity declares 'I am your good shield'", cluster: prophecy}
  queen-mother-laments-son-roaming-steppe: {label: "The king's mother complains to the goddess that she favoured others while her own son was left roaming the steppe", cluster: prophecy}
  king-as-calf-of-goddess: {label: "The king is the goddess's calf or young animal (mūru)", cluster: kingship}
  praise-at-day-decline-with-torches: {label: "The deity asks to be praised when the day declines, with torches held before her", cluster: cult}
  goddess-fills-kings-lap: {label: "The goddess fills the king's lap with good things", cluster: blessing}
  fear-driven-from-palace: {label: "The deity drives fear out of the king's palace; he will eat proper bread and drink proper water and be secure", cluster: prophecy}
  oracle-repeated-five-or-six-times: {label: "The god repeats his oracle several times (five or six times)", cluster: prophecy}
  peace-to-heaven-earth-and-king: {label: "Oracle opening proclaiming peace (šulmu) to heaven and earth, the temple, and the king", cluster: prophecy}
  enemies-placed-under-kings-feet: {label: "The god places the king's enemy beneath his feet or tramples them with his own feet for him", cluster: kingship}
  king-without-rival-shines-like-sun: {label: "The king has no rival; he shines like the rising sun", cluster: kingship}
  proclamation-hear-o-people: {label: "A prophet or god calls the people (or east and west) to listen: 'hear, O ...!'", cluster: prophecy}
  let-them-see-and-know-i-am-god: {label: "The god acts so that people may see and praise him, recognizing that he is lord of the gods", cluster: prophecy}
  king-stands-among-traitors: {label: "Traitors surround the king and he stands in their midst before the god rescues him", cluster: kingship}
  covenant-read-before-people: {label: "The god's word or covenant is read or proclaimed aloud before the king and assembly", cluster: covenant}
  forgetting-covenant-when-eating-bread: {label: "Warning that once back in their towns eating bread they will forget the covenant", cluster: covenant}
  goddess-called-narrow-or-stingy: {label: "People say of the deity that she is 'narrow' (stingy, mean)", cluster: prophecy}
  enemies-gathered-like-butterflies: {label: "The deity collects the king's enemies like butterflies (or insects)", cluster: war}
  goddess-tramples-mountains: {label: "The deity sets out and treads the mountains under her feet", cluster: theophany}
  kings-of-lands-shown-the-way: {label: "The goddess rules the kings of the lands, shows them their borders and puts roads under their feet", cluster: kingship}
  obscure-word-explained-by-prophet: {label: "The oracle uses an obscure word and then explains it in answer to the king's question 'what is ...?'", cluster: prophecy}
  hug-in-crown-prince-palace: {label: "The deity embraced and protected the king in the crown prince's palace before his accession", cluster: prophecy}
  god-encircles-and-guards-king: {label: "The deity goes round about the king and keeps watch over him", cluster: prophecy}
  humanity-treacherous: {label: "The deity declares mankind treacherous (untrustworthy)", cluster: wisdom}
  people-complain-when-will-change-come: {label: "The people complain 'when, when will the land change?'", cluster: prophecy}
  be-still-and-let-god-act: {label: "The deity tells the king to keep silent while she acts for him", cluster: prophecy}
  who-is-the-wronged-one: {label: "The deity asks 'who is alone, who is wronged?' implying she defends the wronged", cluster: prophecy}
  goddess-girds-loins-for-battle: {label: "The goddess is told (or tells herself) to gird her loins for the king's defence", cluster: war}
units:
  - id: ane-saa03-032-o-kummaya-prologue
    tradition: ane-akkadian
    title: "Underworld Vision of an Assyrian Prince: the king's deeds and Kummaya's prayer (SAA 3 32 obv.)"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    read: ["SAA 03 032 o:1-34"]
    tags:
      - {motif: king-as-good-shepherd-sheep-multiply, refs: ["SAA 03 032 o:27"], note: "fragmentary: rēʾû nišī rabbâti 'shepherd of the numerous people'"}
      - {motif: prince-incubates-dream-of-netherworld-queen, refs: ["SAA 03 032 o:27-31"], note: "Kummaya māru ... ana Ekurri īrumma 'Kummaya entered the temple'; nignakku burāši iškun 'he set up a censer of juniper'; ana arādi arallî 'to go down to the netherworld'; Allatu Allatu bēltu qaqqari ... arallî"}
      - {motif: guilt-for-unknowing-sin, refs: ["SAA 03 032 o:29"], note: "interpretive: pî ilāni uqallil u libbi ili ušezziz 'he belittled the word of the gods and angered the god's heart' (the earlier king or the prince)"}
      - {motif: scribal-colophon, refs: ["SAA 03 032 o:17"], note: "a scribe's son (ana māri ṭupšarri) appears already in the badly broken prologue"}
    hints:
      - "The prologue (largely lost) contrasts a pious king and his negligent son; compare 2 Kgs 21 (Hezekiah and Manasseh) and Ps 78:5-8."
  - id: ane-saa03-032-o-dream-ereshkigal
    tradition: ane-akkadian
    title: "Underworld Vision: Ereškigal appears in a dream; Kummaya weeps like a dove (SAA 3 32 obv. 35-40)"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    read: ["SAA 03 032 o:35-40"]
    tags:
      - {motif: prince-incubates-dream-of-netherworld-queen, refs: ["SAA 03 032 o:35"], note: "Ereškigal ina šāt mūši ina šutti izzizamma iqbīšu ... supplīka lušme hišihtaka lukallimka 'Ereškigal stood in a night dream and said: ... let me hear your prayers, let me show you what you desire'"}
      - {motif: dreamer-wakes-moaning-like-dove, refs: ["SAA 03 032 o:37"], note: "Kummaya iggeltīma kīma summe idmumma"}
      - {motif: incubation-dream-in-temple, refs: ["SAA 03 032 o:35"]}
      - {motif: sufferer-weeps-before-his-god, refs: ["SAA 03 032 o:38"], note: "išnīma išši qātēšu usappi ana Ereškigal ... illakā dimāšu 'again he raised his hands, prayed to Ereškigal before Nergal; his tears flowed'"}
    hints:
      - "Moaning like a dove: compare Isa 38:14 (Hezekiah 'I moan like a dove') and Isa 59:11, Nah 2:7."
  - id: ane-saa03-032-r-vision-of-netherworld-gods
    tradition: ane-akkadian
    title: "Underworld Vision: the fifteen hybrid gods of the netherworld (SAA 3 32 rev. 1-10)"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    read: ["SAA 03 032 r:1-10"]
    tags:
      - {motif: vision-of-hybrid-netherworld-gods, refs: ["SAA 03 032 r:2-9"], note: "Namtar sukkal erṣeti ... Namtartu with head of a kurību, Mūtu (Death) with head of a mušhuššu dragon, evil šēdu, Alluhappu with lion's head and four hands, ghost (eṭemmu) with ox head, utukku with lion head, Mamītu with goat head ...; NIGIN 15 ilāni uzzuzzū 'in all 15 gods stood' (r:9)"}
      - {motif: death-personified-driven-to-netherworld, refs: ["SAA 03 032 r:3"], note: "Death personified: dMūtu qaqqad mušhuššī šakin 'Death has the head of a serpent-dragon'"}
      - {motif: named-demons-beset-mankind, refs: ["SAA 03 032 r:6-7"], note: "eṭemmu, utukku lemnu, Mamītu, Nedu the gatekeeper, 'mimma lemnu' (Anything Evil) with two heads"}
      - {motif: black-man-with-anzu-face-in-red-garment, refs: ["SAA 03 032 r:10"], note: "ištēn eṭlu zumuršu kīma iṭṭê ṣalim ... pānūšu mašlū nahlapti sāmti labiš ... ina šēp šumēli ṣēra ukabbis"}
    hints:
      - "Composite beings of a vision: compare Ezek 1:5-14 (four-faced creatures) and Dan 7:3-8 (beasts from the sea); the man treading a snake recalls Gen 3:15 and Ps 91:13."
  - id: ane-saa03-032-r-nergal-judgment
    tradition: ane-akkadian
    title: "Underworld Vision: before Nergal's throne; Išum intercedes; the prince is sent back (SAA 3 32 rev. 11-21)"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    read: ["SAA 03 032 r:11-21"]
    tags:
