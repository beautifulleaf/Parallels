      - {motif: sister-grieves-for-dying-god, refs: ["Q009249 o:5-6"]}
      - {motif: victor-god-treads-neck-of-enemy, refs: ["Q009249 o:10-11", "Q009249 o:41-42"], note: "Bēl kišād ayyābišu lā māgirišu kī ukabbasu"}
      - {motif: flayed-god-skin-is-constellation, refs: ["Q009249 o:18-27"], note: "Anu ikmû maškšu ... pagaršu ana Anunnaki ipqid ... maškšu kī ikūṣu Šitaddaru dāmšu kī ulabbišu ... Bēl Šitaddaru ikmīma 'Bēl bound Orion'"}
      - {motif: god-taken-captive-in-fetters, refs: ["Q009249 o:18-20"], note: "Anu bound (kamû), dragged off; ittikunūma kamî Anum"}
      - {motif: anzu-defeated-by-warrior-god, refs: ["Q009249 o:13"], note: "Nabû šū ša Anzâ inārū 'it is Nabû who killed Anzû'"}
      - {motif: dumuzi-mourned-month-of-tammuz, refs: ["Q009249 r:4-8"], note: "UD 26 ūm ikkili ... UD 28 Dumuzi iššaʾʾali iššaʾʾali ... qalītu ša ina muhhi Dumuzi innaddû"}
      - {motif: body-of-god-made-of-plants, refs: ["Q009249 r:9-17"], note: "ša Karkar: dišpu šarkašu, bīnu qimmassu, šurmēnu lānšu ... erēnu birkāšu ... murru nīlšu, šurānu dāmūšu"}
      - {motif: secret-of-gods-for-initiate, refs: ["Q009249 r:20"], note: "pirišti ilāni rabûti mūdû mūdâ likallim lā mūdû lā immar ikkib ilāni rabûti"}
      - {motif: children-hidden-from-killer, refs: ["Q009249 o:28-31"], note: "the heir taken by his father and mother and hidden between the breasts of the goddesses (ina birīt tulê ša ištarāti ušarqûšu)"}
