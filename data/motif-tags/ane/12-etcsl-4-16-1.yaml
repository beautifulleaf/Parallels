      - {motif: blessing-reaches-homes-of-poor, refs: ["ETCSL 5.3.2 54-64"], note: "e2 ukur3-ra saḫar ki us2-sa-a-ba ... ḫe2-ĝal2 mu-da-an-ĝal2-le-eš: they brought wealth into the homes of the poor who crouch in the dust; šag4 an-na šag4 {d}en-lil2-la2-ke4 ba-sag9-ge-eš"}
      - {motif: disputants-quarrel-after-drinking, refs: ["ETCSL 5.3.2 65-70"], note: "ĝeštin niĝ2 dug3 ... kaš niĝ2 dug3 u3-mu-un-dug3-ge-eš-a-ta / a-gar3-a-gar3-ra du14 mi-ni-ib-mu2-mu2-ne / ki ĝišbun-na-ka a-da-min3 mu-un-ak-ne"}
      - {motif: drunken-contest-of-gods, refs: ["ETCSL 5.3.2 65-70"]}
