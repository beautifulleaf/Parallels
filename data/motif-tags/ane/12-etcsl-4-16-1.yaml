      - {motif: temple-shines-for-him-who-claims-belonging, refs: ["ETCSL 4.80.4 C:31-C:41"], note: "bi2-in-dug4-ga-ra ... e2 ud-dam ša-mu-na-e3; lu2 kur-ra bi2-in-dug4-ga-ra; e2 {d}en-lil2-ka bi2-in-dug4-ga-ra"}
      - {motif: mountain-of-cedars-within-temple, refs: ["ETCSL 4.80.4 D:43-D:52"], note: "e2-e me gal-la saĝ mi-ni-ib2-il2 / šag4-bi-ta kur šim {ĝiš}erin-na-kam"}
      - {motif: sons-greatness-pleases-father-god, refs: ["ETCSL 4.80.4 F:56-F:68"], note: "e2 nam-dumu zid-da lugal {d}en-lil2-ra tum2-ma-am3: Ninurta, Ašimbabbar, the princely son are worthy of Enlil in the house of true sonship"}
      - {motif: man-after-gods-heart, refs: ["ETCSL 4.80.4 G:70"], note: "{d}en-lil2-la2 lu2 šag4-ga-na"}
      - {motif: refrain-repeated-stanza, refs: ["ETCSL 4.80.4 A:28", "ETCSL 4.80.4 B:30", "ETCSL 4.80.4 C:42", "ETCSL 4.80.4 D:53", "ETCSL 4.80.4 E:55", "ETCSL 4.80.4 G:71"], note: "rubrics sa-gid2-da, ĝiš-gi4-ĝal2, kirugu, sa-ĝar-ra; E:54 broken"}
