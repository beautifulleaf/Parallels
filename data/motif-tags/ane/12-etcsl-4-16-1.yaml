  - id: ane-etcsl-5-2-5-early-rulers
    tradition: ane-sumerian
    title: "Poem of early rulers: where are the kings of old who reigned 36,000 years, ascended to heaven, sought life? Enjoy the day"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Sumerian"
    read: ["ETCSL 5.2.5 6-21"]
    tags:
      - {motif: ubi-sunt-famous-ancients-gone, refs: ["ETCSL 5.2.5 7-16"], note: "lu2-be2-ne šu bal ak-a: those men were overturned; [X] lugal-e-ne dub-saĝ ud ul-le2-a-ke4-ne: the kings, leaders of former days; šu-ĝu10 sa2 bi2-in-dug4-ga: can my hand reach them?; lines 1-5 lost"}
      - {motif: primeval-king-reigns-tens-of-thousands-of-years, refs: ["ETCSL 5.2.5 8"], note: "[…] lugal-e mu 36000-am3 in-ak (Alulu in other versions)"}
      - {motif: who-ascended-to-heaven-and-came-down, refs: ["ETCSL 5.2.5 9"], note: "[…] lugal-e lu2 an-še3 bi2-in-ed2-de3: the king who went up to heaven (Etana)"}
      - {motif: flood-hero-granted-eternal-life, refs: ["ETCSL 5.2.5 10"], note: "[…] zi-ud-su3-ra2-gin7 nam-til3 i3-kiĝ2-kiĝ2: (he who) like Zi-ud-sura sought life"}
      - {motif: life-like-twinkling-of-an-eye, refs: ["ETCSL 5.2.5 17"], note: "[…] X igi niĝin2-na-kam: like the turning (blink) of an eye"}
      - {motif: one-day-of-joy-outweighs-long-life-in-silence, refs: ["ETCSL 5.2.5 18-19"], note: "[…] nu-zalag-ga ... ugu nam-uš2-a-kam a-ba-am3 bi2-in-dirig-ga: who (life) without light is above death?; ud šag4 ḫul2-la ... niĝ2-me-ĝar mu 36000-am3: a day of joy ... 36,000 years of silence"}
      - {motif: vanity-of-vanities, refs: ["ETCSL 5.2.5 17-21"]}
      - {motif: eat-drink-and-enjoy-gift-of-god, refs: ["ETCSL 5.2.5 19-21"], note: "ḫa-la lu2-u18-lu-kam: the share of mankind; til3-a e2 ĝuruš-ke4: living in the house of the young men; broken"}
    hints:
      - "Compare Eccl 1:11 and 2:16 (no remembrance of former things; the wise dies like the fool) and Eccl 9:4-10 (a living dog better than a dead lion; eat your bread with joy)."
      - "Compare Gen 5 (antediluvian lifespans of centuries) and Gen 5:24 (Enoch taken by God); Prov 30:4 (who has ascended to heaven?)."
      - "Compare Ps 90:4-10 (a thousand years like yesterday; our years end like a sigh) and Q 23:112-114, Q 20:103-104 (you stayed but a day or part of a day)."
      - "Compare Isa 22:13 and 1 Cor 15:32 (eat and drink, for tomorrow we die)."
  - id: ane-etcsl-5-3-2-sheep-grain-creation
    tradition: ane-sumerian
    title: "Sheep and Grain: the primeval state without grain, sheep or cloth; the gods create Sheep and Grain on the Holy Mound"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Sumerian"
    read: ["ETCSL 5.3.2 1-36"]
    tags:
      - {motif: in-those-days-when-heaven-and-earth-were-made, refs: ["ETCSL 5.3.2 1-2"], note: "ḫur-saĝ an ki-bi-da-ke4 / ud an-ne2 {d}a-nun-na im-tud-de3-eš-a-ba: when on the mountain of heaven and earth An begot the Anuna"}
      - {motif: not-yet-list-describes-primeval-state, refs: ["ETCSL 5.3.2 3-19"], note: "mu {d}ezina2 nu-ub-da-tud-da-aš; {d}uttu nu-ub-tu-ud; u8 nu-e3-a sila4 nu-šar2-ra; še muš5 ud 30-am3 nu-ĝal2-la-am3; {d}šakkan2 bar-rim4-ma la-ba-ra-e3-a"}
      - {motif: primeval-humans-naked-without-bread-or-cloth, refs: ["ETCSL 5.3.2 20-23"], note: "ninda gu7-u3-bi nu-mu-un-zu-uš-am3 / tug2-ga mu4-mu4-bi nu-mu-un-zu-uš-am3 / kalam ĝiš-gen6-na su-bi mu-un-ĝen"}
      - {motif: primal-nakedness-without-shame, refs: ["ETCSL 5.3.2 22-23"]}
      - {motif: primeval-humans-eat-grass, refs: ["ETCSL 5.3.2 24-25"], note: "udu-gin7 ka-ba u2 mu-ni-ib-gu7 / a mu2-sar-ra-ka i-im-na8-na8-ne"}
      - {motif: sheep-and-grain-created-on-holy-mound, refs: ["ETCSL 5.3.2 26-27"], note: "ud-ba ki-ulutim2 diĝir-re-e-ne-kam / e2-bi du6 kug-ga u8 {d}ezina2-bi mu-un-se12-eš-am3"}
      - {motif: gods-eat-but-are-not-sated-give-to-humans, refs: ["ETCSL 5.3.2 28-36"], note: "i-im-gu7-gu7-ne nu-mu-un-de3-si-si-eš; nam-lu2-ulu3 zi šag4 im-ši-in-ĝal2: they gave them to mankind as sustenance"}
    hints:
      - "Compare Gen 2:5 (no shrub, no plant, no man to till) and Gen 3:21 (garments of skin) for the primeval state without crops or clothing."
      - "Compare Gen 1:29-30 and Gen 9:3 (food given to humans: plants, then animals) and Ps 104:14-15 (bread to strengthen man's heart)."
      - "Compare Dan 4:22, 29 (Nebuchadnezzar eats grass like oxen) for humans eating grass like animals."
  - id: ane-etcsl-5-3-2-sheep-grain-sent-down
