# Full read of the ANE corpus, chunk 12: ETCSL 4.16.1-5.3.2 (hymns to Nisaba, Ninĝišzida, Ninisina, Ninkasi, Ninlil, Ninšubur, Ninurta, Nuska, Šara, Sadarnuna, Kusu; the Temple Hymns, the Keš Temple Hymn, the E-kur hymn; the Poem of early rulers; Sheep and Grain). Read from the ETCSL Sumerian composite transliterations.
new_motifs:
  goddess-coloured-like-starry-sky: {label: "A goddess is 'coloured like the stars of heaven' (mul-an-gin7 gun3-a)", cluster: hymn}
  deity-nursed-on-holy-milk: {label: "A deity (or king) is nourished from birth on holy, good milk", cluster: birth}
  goddess-cleanses-body-dons-priestly-robe: {label: "A goddess washes her body and puts on the holy priestly garment before performing the rites", cluster: cult}
  deity-institutes-offerings-where-none-were: {label: "A deity establishes bread offerings and libations where none existed before, appointing priests and festivals", cluster: cult}
  goddess-consults-star-tablet: {label: "A goddess consults a holy tablet of the heavenly stars, set on her knees", cluster: divination}
  house-of-learning-opened-by-god: {label: "A god opens the house of learning (e2-ĝeštug2, 'house of wisdom') for a goddess of writing", cluster: wisdom}
  goddess-blessed-to-be-steward-of-stores: {label: "A goddess is blessed to be the butter in the pen, the seal-keeper of the treasury and the heaper of grain in the stores", cluster: abundance}
  temple-destroyed-and-overgrown: {label: "A ruined temple is overgrown: grasses of lamentation and long grass sprout by its walls, willows everywhere", cluster: lament}
  goddess-lies-alone-weeping-in-moonlight: {label: "A bereft goddess lies down alone in the moonlight and weeps bitter tears, her man walled off from her", cluster: lament}
  gods-word-and-angry-heart-destroy: {label: "Destruction is ascribed to 'the word of An and the word of Enlil', to the angry heart of the high gods", cluster: lament}
  god-as-falcon-preying-on-gods: {label: "A warrior god is a falcon preying on the gods (or on enemies)", cluster: divine-warrior}
  gods-mouth-like-magicians-or-snakes: {label: "A god's mouth is that of a magician or of a great-tongued, poisonous snake", cluster: hymn}
  gods-word-known-only-to-the-knowing: {label: "The god's holy word is known to those who know it and unknown to those who do not; who can find out his intentions?", cluster: wisdom}
  divine-warrior-as-river-flood-wave: {label: "A warrior god falls on the river as a flood-wave and rises in the fields as a devastating flood", cluster: divine-warrior}
  kirugu-section-structure: {label: "A hymn is divided into numbered sections (kirugu), each ending with a refrain", cluster: hymn}
  god-brings-early-flood-and-grain: {label: "Through the god the early flood comes in the river and fine grain in the fields, and the gods rejoice", cluster: fertility}
  goddess-hands-medical-art-to-son: {label: "A healing goddess perfects the arts of medicine and hands them over to her son with the charge 'pay attention to everything medical'", cluster: healing}
  wound-dressed-with-bandage-and-salve: {label: "A wound is treated: bandages wiped and anointed, plaster softened, blood and pus mopped up, a warm hand laid on it", cluster: healing}
  sick-man-writhes-like-snake: {label: "The sick person writhes like a snake on scorching ground, hissing, and cries out 'My heart! My stomach!'", cluster: healing}
  illness-leaves-like-wind: {label: "Healing incantation makes illness leave the body like wind and die out like a fire of its own accord", cluster: healing}
  personal-gods-plead-healer-intercedes: {label: "The personal gods of mankind plead with the healing goddess, who intercedes for them before An and Enlil", cluster: intercession}
  named-demons-beset-mankind: {label: "Named demons (udug, lamma, Dimme, Namtar, Asag) beset mankind, entering by night and not leaving a man alone", cluster: demons}
  sick-man-seeks-dream-interpreter: {label: "A sick man calls a dream interpreter (ensi) to learn the future, then prays to the healing deity", cluster: divination}
  healer-stretches-finger-over-patient: {label: "The healing goddess stretches her finger over the sufferer, who then praises her and calls on her name", cluster: healing}
  goddess-invents-jewellery: {label: "'At that time' an ornament (šuba-stone jewellery) did not exist; a goddess invented it", cluster: culture}
  goddess-as-midwife-cuts-cord: {label: "A goddess as midwife cuts the umbilical cord, decrees the newborn's destiny and makes it cry", cluster: birth}
  goddess-conceived-by-an-and-uras: {label: "A goddess says her mother Uraš (earth) lay with An (heaven) in the holy bedchamber to engender her", cluster: theogony}
  city-older-than-dilmun-made-from-date-palm: {label: "A god's city/house was created from a date palm before the land of Dilmun existed", cluster: creation}
  temple-shines-like-moon-and-sun: {label: "The temple shines at night like moonlight and at noon like sunlight", cluster: temple}
  goddess-sent-by-father-against-rebel-land: {label: "The high god, angered, sends his daughter (goddess) against the rebel land; she destroys its shepherd and reports back", cluster: divine-warrior}
  enemy-forgotten-none-finds-him: {label: "The destroyed enemy is consigned to oblivion: no one knows him in his city, no one finds him in his pasture", cluster: war}
  heavens-fold-like-garment-before-deity: {label: "The heavens fold (bow) like a garment in the deity's presence and the earth is flooded", cluster: theophany}
  deity-hears-prayer-and-pleading: {label: "A deity is titled 'she/he who hears prayer and pleading' (šudu3 a-ra-zu ĝiš tuku)", cluster: hymn}
  wise-god-as-sage-carpenter-and-purifier: {label: "The wise god (Enki) is praised as great farmer, carpenter, sage (abgal) and master of purification rites", cluster: wisdom}
  goddess-anointed-with-fine-oils: {label: "A goddess is bathed and anointed with a catalogue of fine oils (cedar, cypress, ghee, milk), poured over each part of her body", cluster: cult}
  deity-journeys-to-visit-high-god: {label: "A deity travels (often by boat) to the temple of the high god (Enlil at Nibru, Enki at Eridug), offers sacrifices and is greeted", cluster: cult}
  healer-raises-patient-from-sickbed: {label: "The healing deity lifts up the sick man lying prostrate and brings (him or the child) out of the womb safely", cluster: healing}
  high-god-decrees-fate-for-deity: {label: "A high god (Enlil, Enki, An) determines a fate (nam tar) for a younger deity", cluster: divine-council}
  father-god-dotes-on-daughter: {label: "A father god seats his daughter on his knees and gives her whatever she fancies (jewels, garments)", cluster: family}
  goddess-is-local-goddess-in-each-city: {label: "Litany: in city after city the goddess 'is indeed' its local goddess (syncretism by enumeration)", cluster: hymn}
  goddess-lies-with-spouse-joyously: {label: "A goddess lies down with her divine spouse in her chosen city and spends time joyously with him", cluster: sexuality}
  refrain-repeated-stanza: {label: "A hymn stanza is sung twice in nearly identical words (litanic repetition)", cluster: hymn}
  brewing-process-sung-step-by-step: {label: "A hymn to the beer goddess recounts each step of brewing (beerbread baked, malt watered and soaked, mash cooled on mats, wort with honey and wine, filtering)", cluster: culture}
  beer-poured-like-tigris-and-euphrates: {label: "Beer pouring from the collector vat is like the onrush of the Tigris and Euphrates", cluster: abundance}
  city-founded-on-wax: {label: "A goddess's city is founded upon wax (or honeycomb) and its walls completed for her", cluster: city}
  goddess-decides-destinies-with-husband: {label: "The high god's consort decides destinies together with him and is the pleasure of his heart; he embraces her", cluster: divine-council}
  guardian-dogs: {label: "Noble dogs keep guard over stores or a sacred place", cluster: animals}
  divine-minister-of-heaven-walks-before-god: {label: "A deity is the minister (sukkal) of the high god, holding a lapis sceptre and walking before him", cluster: divine-council}
  deity-cares-like-ewe-for-lambs: {label: "A deity cares for the people as a fecund ewe for her lambs, a goat for her kids, a mother for her children", cluster: hymn}
  servant-deity-soothes-hearts-of-gods: {label: "A servant deity vows to soothe the hearts of the gods and appease them (intercessory role)", cluster: intercession}
  litany-of-gods-and-their-cities: {label: "A hymn lists the great gods one by one, each with his or her city or shrine", cluster: hymn}
  god-rises-like-sun-and-moon: {label: "A god comes forth over the people like the new moon, like the sun over the cypresses, like the moon over the mountains", cluster: theophany}
  warrior-god-enthroned-on-dais-of-an: {label: "The warrior son of the high god takes his seat on An's throne-dais, holding the sceptre and wearing An's true crown", cluster: kingship}
  god-keeps-watch-light-guarding: {label: "A god stands on the high mountains as a light keeping watch, never failing in his shrine month by month", cluster: hymn}
  god-journeys-to-decree-abundance-and-order: {label: "A god travels to decree a destiny of abundance: rivers full, fish in the lagoons, herds multiplying, the divine order of the land unaltered", cluster: fertility}
  road-made-festive-for-arriving-god: {label: "The way is prepared and the road made festive for a god's arrival; day spent in abundance, night in celebration", cluster: cult}
  ancient-divine-powers-restored: {label: "A god restores the ancient divine powers (me niĝ2-ul) to their places for a visiting deity", cluster: cult}
  god-brings-mountain-treasures-to-father: {label: "A warrior god brings silver, lapis and the treasures of the mountains down to his father", cluster: divine-warrior}
  fifty-divine-powers-of-house: {label: "The divine powers of a god's house (or hall) number fifty; no one can declare them all", cluster: temple}
  gods-shadow-covers-land-like-garment: {label: "A god's tall shadow hangs over the land and covers it like a garment from south to the highlands", cluster: theophany}
  sons-greatness-pleases-father-god: {label: "Refrain: the son's grandeur, commands and fates please the heart of his father, the high god", cluster: divine-council}
  god-is-right-arm-of-high-god: {label: "A warrior god is the right arm (a2 zid-da) of the high god, youth without rival", cluster: divine-warrior}
  none-escapes-the-warrior-god: {label: "The warrior god lets no enemy, bird or mountain escape him", cluster: divine-warrior}
  warrior-boasts-let-my-mother-know: {label: "A warrior god boasts of felling forests and smashing walls, with the refrain 'Let my mother know it'", cluster: divine-warrior}
  god-invoked-under-several-names-litany: {label: "Each line of a litany is repeated for one god under several names (Ninurta, Pabilsaĝ, Ninĝirsu), identifying them", cluster: hymn}
  god-is-wall-of-his-city: {label: "The god is the towering wall of his city; may his august name be invoked", cluster: city}
  temple-border-violator-cuts-off-fathers-house: {label: "Whoever diminishes the borders of the god's house cuts off his own father's house", cluster: curse}
  god-named-from-precious-materials-of-far-lands: {label: "From the gold, cornelian, lapis, silver, copper and tin of named far lands (Meluḫa, Magan, Dilmun, Marḫaši) the god is acclaimed", cluster: trade}
  if-only-enemy-knew-gods-might: {label: "Refrain: 'if only (the enemy) knew' the god's strength, awesomeness, lion-like devouring", cluster: divine-warrior}
  donkeys-placed-at-gods-feet: {label: "The god of the steppe animals (Šakkan, lord of donkeys) places donkey-foals at a god's feet", cluster: animals}
  temple-servant-god-purifies-and-tends-vessels: {label: "A god serves in the high god's temple as cup-bearer and cleaner: he makes the holy vessels shine, sprinkles the courtyard and arranges offerings", cluster: cult}
  god-entrusted-with-plans-of-heaven-and-earth: {label: "The high god entrusts a deity with the divine plans (ĝiš-ḫur) of heaven and earth and the great decisions", cluster: divine-council}
  god-judges-and-leads-just-aright: {label: "A god renders great verdicts in heaven and earth, casts his net over the enemy and leads the just aright", cluster: justice}
  gods-birth-decreed-by-high-god: {label: "The high god decreed a god's birth in his temple; other gods name him, give him wisdom and honour him", cluster: theogony}
  minister-does-not-alter-just-word: {label: "The divine minister is pre-eminent in just speech and does not alter what he has justly spoken", cluster: justice}
  son-seated-beside-mother-goddess: {label: "A goddess seats her son beside her on the holy dais and calls him by a good name", cluster: family}
  purification-materials-catalogue: {label: "A purification ritual lists its materials: cedar, cypress, juniper, boxwood, white and black wool, apples and figs on a string, butter, a goat's horn", cluster: ritual}
  fire-god-torch-from-abzu: {label: "The fire god comes out of the abzu as a great torch, purifying the oven and the offerings", cluster: ritual}
  bulls-and-sheep-put-in-great-oven: {label: "Numerous bulls, sheep and loaves are put into the great purified oven (burnt offering)", cluster: ritual}
  water-from-teats-of-heaven-purifies-all: {label: "Water received from the holy teats of heaven purifies heaven and earth, the cattle in the pen, the sheep in the fold, the sun and the moon", cluster: ritual}
  wood-of-destiny-adorns-pen: {label: "Wood and reeds 'of destiny and prosperity' adorn the holy cattle-pen in a ritual", cluster: ritual}
  temple-hymn-refrain-god-takes-seat: {label: "Refrain closing each temple hymn: '(the god) has erected a house in your precinct, O (temple), and taken his seat upon your dais'", cluster: temple}
  temple-hymn-line-count-subscript: {label: "Each temple hymn ends with a subscript giving its number of lines and naming the god's house and city", cluster: scribal}
  god-dwells-where-light-does-not-enter: {label: "The god's inner chamber is a place where daylight (or moonlight) does not enter", cluster: temple}
  temple-as-entrance-to-underworld: {label: "A temple is the libation pipe or entrance to the underworld, where mankind is gathered", cluster: underworld}
  god-pours-spittle-on-rebel-land: {label: "As long as a rebel land stays disobedient, the god (or goddess) pours spittle (venom) upon it", cluster: divine-warrior}
  birth-goddess-crowns-newborn-king: {label: "The mother goddess of creation binds the crown on the newborn king and holds the newborn lord in her hand", cluster: kingship}
  goddess-measures-heaven-and-earth: {label: "The goddess of writing applies the measuring rod to heaven and lays the measuring rope on the earth", cluster: cosmology}
  author-claims-unprecedented-creation: {label: "A named author or compiler (Enḫeduana) signs the work and claims to have made what no one made before", cluster: scribal}
  goddess-sets-gender-roles: {label: "A goddess adorns the woman and covers the man's head (fixes the marks of the sexes)", cluster: culture}
  secondary-wife-of-high-god: {label: "A goddess is named as the junior (secondary) wife of the high god", cluster: family}
  goddess-born-of-sea-plays-on-foam: {label: "A goddess is born on the shore of the sea and laughs and plays on the foam of the sea and its flood", cluster: theogony}
  gods-attend-temples-drinking-bouts: {label: "All the Anuna gods attend the great drinking-bouts held in a god's temple", cluster: divine-council}
  storm-god-teat-of-heaven-gives-rain: {label: "The storm god's house is the 'teat of heaven' that gives rain for the barley", cluster: fertility}
  city-founded-on-empty-plain-by-god: {label: "The high god founded and built a city on an empty plain", cluster: city}
  moon-god-as-shepherd: {label: "The moon god is the shepherd of a wide cattle-yard and its herds", cluster: hymn}
  refrain-who-else-brings-forth-so-great: {label: "Refrain: 'Will anyone else bring forth something as great as (the temple)? Will any mother bear one as great as its hero? Who has seen one as great as its lady?'", cluster: hymn}
  temple-floats-like-heavenly-barge: {label: "The temple floats in the heavens like a princely barge, like the boat of heaven", cluster: temple}
  temple-upper-and-lower-ends-contrasted: {label: "A temple is described by paired images for its upper and lower end (bison and stag, sun and moonlight, mountain and spring)", cluster: temple}
  temple-interior-unknowable: {label: "'It is indeed a city! Who knows its interior?': the temple's inner part is beyond knowing", cluster: temple}
  draw-near-but-do-not-draw-near: {label: "Paradoxical warning: 'Draw near, man, to the city, to the god - but do not draw near!'", cluster: holiness}
  temple-cult-personnel-rite-with-music: {label: "A temple rite is described by its personnel (king, en, priests) each at his task, with horn, drums, ala and tigi", cluster: cult}
  goddess-writes-hymn-on-tablets: {label: "The goddess of writing composes (weaves) the hymn's words and holds them written on tablets", cluster: scribal}
  temple-parts-each-great-as-mountain: {label: "Litany naming every gate, court and chamber of a temple, each 'as great as a mountain'", cluster: temple}
  temple-shines-for-him-who-claims-belonging: {label: "For whoever declares that he belongs to the god's house, the house comes forth like daylight", cluster: temple}
  mountain-of-cedars-within-temple: {label: "Within the temple there is a mountain of aromatic cedars", cluster: temple}
  ubi-sunt-famous-ancients-gone: {label: "'Where are' the famous kings of old (who reigned thousands of years, who ascended to heaven, who sought life)? They are gone and none can reach them", cluster: wisdom}
  one-day-of-joy-outweighs-long-life-in-silence: {label: "A day of happiness is worth more than tens of thousands of years of silence (death); life without cheer is no better than death", cluster: wisdom}
  life-like-twinkling-of-an-eye: {label: "Human life passes like the twinkling of an eye", cluster: wisdom}
  primeval-king-reigns-tens-of-thousands-of-years: {label: "A primeval king is said to have reigned tens of thousands of years (e.g. 36,000)", cluster: primeval}
  primeval-humans-naked-without-bread-or-cloth: {label: "Primeval humans knew neither bread nor clothing; they went about with naked limbs", cluster: primeval}
  gods-eat-but-are-not-sated-give-to-humans: {label: "The gods eat and drink of newly created food but are not sated, and give it to mankind as sustenance", cluster: creation}
  sheep-and-grain-created-on-holy-mound: {label: "Sheep and Grain (herding and farming) are created by the gods on the Holy Mound and sent down to mankind", cluster: creation}
  grain-frees-the-captive-youth: {label: "Grain boasts it frees the captive youth from fetters and shackles and settles quarrels between neighbours", cluster: wisdom}
  disputants-quarrel-after-drinking: {label: "Two companions start a quarrel after drinking sweet wine and beer at a banquet", cluster: narrative-form}
  rival-mocked-as-ending-ground-baked-eaten: {label: "In a debate one rival mocks the other's fate: crushed, ground to flour, baked, eaten, its innards sold in the market", cluster: wisdom}
  wealthy-sit-at-gate-of-grain-owner: {label: "Whoever has silver, jewels, cattle or sheep must sit at the gate of whoever has grain", cluster: wisdom}
  blessing-reaches-homes-of-poor: {label: "Divine gifts of plenty enter the homes of the poor who crouch in the dust and make them wealthy", cluster: abundance}
  grain-gives-courage-to-warrior: {label: "Grain (bread) gives the warrior strength so that in battle he knows no fear", cluster: wisdom}
  wool-clothes-king-and-priests: {label: "Wool boasts it clothes the king on his throne and the priests who dress in it for holy lustration", cluster: culture}
  shepherd-counts-flock-each-night: {label: "The shepherd counts the flock every evening and sets a tally-stick in the ground", cluster: pastoral}
  wild-animals-threaten-flock: {label: "Snakes, bandits and wild creatures of the plain threaten the flock and seek its life", cluster: pastoral}
  younger-sister-sheep-bows-to-grain: {label: "In the verdict one sister must kneel before the other and kiss her feet; both remain sisters", cluster: wisdom}
units:
  - id: ane-etcsl-4-16-1-1-nisaba-epithets
    tradition: ane-sumerian
    title: "Nisaba A: epithets of the scribal and grain goddess and her priestly role"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Sumerian"
    read: ["ETCSL 4.16.1 1:1-26"]
    tags:
      - {motif: goddess-coloured-like-starry-sky, refs: ["ETCSL 4.16.1 1:1"], note: "nin mul-an-gin7 gun3-a"}
      - {motif: scribal-goddess-holds-tablets, refs: ["ETCSL 4.16.1 1:1", "ETCSL 4.16.1 1:12"], note: "dub za-gin3 šu du8: holding a lapis-lazuli tablet; dub-sar maḫ an-na saĝ-tun3 {d}en-lil2-la2: chief scribe of An, record-keeper of Enlil"}
      - {motif: deity-nursed-on-holy-milk, refs: ["ETCSL 4.16.1 1:3"], note: "šeg9-bar naĝa kug-ga ga zid gu7-a: wild sheep fed on good milk among holy alkaline plants"}
      - {motif: deity-holds-all-divine-powers, refs: ["ETCSL 4.16.1 1:5"], note: "me gal 50-e šu du7-a: perfect in fifty great me"}
      - {motif: human-formed-from-earth, refs: ["ETCSL 4.16.1 1:8"], note: "{d}a-ru-ru kalam-ma im-ta KA-KA dug4: Nisaba called Aruru (mother goddess) of the Land, '... from the clay'; obscure, the verb unclear"}
      - {motif: goddess-of-wisdom-instructs-land, refs: ["ETCSL 4.16.1 1:11", "ETCSL 4.16.1 1:13"], note: "ĝeštug2 ĝar kur gal-e tud-da: engendered with wisdom by the Great Mountain; gal-zu igi-ĝal2 diĝir-re-e-ne: wise sage of the gods"}
      - {motif: goddess-as-grain, refs: ["ETCSL 4.16.1 1:14-18"], note: "barley and flax (še gu) grow in the furrows (ab-sin2) for Enlil's harvest festival"}
      - {motif: goddess-cleanses-body-dons-priestly-robe, refs: ["ETCSL 4.16.1 1:19-20"], note: "su nam-mi-in-su-ub ... tug2-ba13 kug šag4-ge nam-mi-in-mur10"}
      - {motif: deity-institutes-offerings-where-none-were, refs: ["ETCSL 4.16.1 1:21-26"], note: "nidba nu-ĝal2-la ĝa2-ĝa2-de3: to establish bread offerings where none existed; en gal mu-un-ḫuĝ-e ezen mu-un-ḫuĝ-e"}
    hints:
      - "Compare Exod 31:18 and Exod 32:16 (tablets written by God) and Ezek 9:2-4 (the scribe with the writing case) for a divine scribe."
      - "Compare Prov 8:22-31 (Wisdom as the first of God's works, beside him as craftsman) for a goddess of wisdom engendered by the high god."
  - id: ane-etcsl-4-16-1-1-enki-honours-nisaba
    tradition: ane-sumerian
    title: "Nisaba A: Enki opens the house of learning for Nisaba and blesses her"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Sumerian"
    read: ["ETCSL 4.16.1 1:27-57"]
    tags:
      - {motif: house-of-learning-opened-by-god, refs: ["ETCSL 4.16.1 1:29", "ETCSL 4.16.1 1:45-46"], note: "e2-ĜEŠTUG2.{d}NISABA-ke4 ĝal2 nam-mi-in-taka4; e2 ĝeštug2-ga-ke4 ĝal2 taka4-a-ni; {ĝiš}ig ĝeštug2-ga: the door of wisdom. Akkadian gloss bīt uznim"}
      - {motif: goddess-consults-star-tablet, refs: ["ETCSL 4.16.1 1:30-31"], note: "dub za-gin3 dub3-ba nam-mi-in-ĝar / dub mul-an kug-ta šag4 im-ma-da-kuš2-u3: the lapis tablet on her knees, she consults the holy tablet of the stars of heaven"}
      - {motif: goddess-reads-star-tablet, refs: ["ETCSL 4.16.1 1:31"]}
      - {motif: wise-god-as-sage-carpenter-and-purifier, refs: ["ETCSL 4.16.1 1:38-44"], note: "engar gal ... nagar eridug{ki}-ga, lugal šu-luḫ-luḫ-ḫa: Enki the great farmer, the carpenter of Eridug, master of purification rites; abgal siki bar-ra du8-a-ni: the sage with his hair hanging loose"}
      - {motif: goddess-blessed-to-be-steward-of-stores, refs: ["ETCSL 4.16.1 1:51-55"], note: "tur3-ra i3 ḫe2-me-en amaš-a gara2 ḫe2-me-en / e2 niĝ2-gur11-ra kišib-ĝal2 ḫe2-me-en / e2-gal-la aĝrig zid ḫe2-me-en / guru7-du6 ... ḫe2-me-en"}
      - {motif: closing-doxology-praise-is-sweet, refs: ["ETCSL 4.16.1 1:57"], note: "a-a {d}en-ki za3-mi2-zu dug3-ga-am3: the hymn to Nisaba closes by praising Enki"}
    hints:
      - "Compare Gen 41:34-49 and Q 12:55 (Joseph set over the storehouses of the land) for the goddess blessed as steward of grain stores and treasury."
      - "Compare 1 Kgs 5:9-14 (Solomon's wisdom) and Dan 1:17 (God gives knowledge in every kind of writing and wisdom)."
  - id: ane-etcsl-4-16-1-2-nisaba-variant
    tradition: ane-sumerian
    title: "Nisaba A, second version: the opening epithets"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Sumerian"
