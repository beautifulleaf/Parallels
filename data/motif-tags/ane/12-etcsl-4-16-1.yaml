      - {motif: temple-cult-personnel-rite-with-music, refs: ["ETCSL 4.80.2 I:106-I:119"], note: "lugal bur-ra am3-mi-gub; en ... eš2 la2; a-tu-e ešgiri2; enkum-e-ne; pa4-šeš-e-ne kuš mu-un-sag3-ge-ne; si am-ma-ke4 gum2-ga mi-ni-ib-za: the bull's horn made to growl; nar {kuš}a2-la2; tigi"}
