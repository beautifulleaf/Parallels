      - {motif: grain-frees-the-captive-youth, refs: ["ETCSL 5.3.2 83-88"], note: "nam-ušur nam-ma3-la i-im-dug3-dug3-ge / ušur du14 mu2-a i-im-bur2-bur2-re; ĝuruš dab5-ba-ra ... ĝiš-šu ĝiš-gu2 i-im-du8-du8-e"}
      - {motif: grain-gives-courage-to-warrior, refs: ["ETCSL 5.3.2 74-82"], note: "usu-ĝu10 ur-saĝ-ra u3-mu-na-te / ki me3-ka gub-ba-ni / su nu-mu-un-zu sa nu-mu-un-zu"}
      - {motif: wool-clothes-king-and-priests, refs: ["ETCSL 5.3.2 96", "ETCSL 5.3.2 107-112"], note: "gu-gu {d}uttu me-lem4 nam-lugal-la ĝa2-a-ra; zulumḫi tug2 siki babbar-ra-ĝu10 / lugal barag-ga-na im-mi-in-ḫul2-le; gudug pa4-šeš lu2 a tu5-am3 / šu-luḫ kug-ĝa2 um-ma-da-an-mur10-re: the priests dress in wool for the holy lustration"}
      - {motif: holy-anointing-oil-recipe, refs: ["ETCSL 5.3.2 105-106"], note: "i3 dug3-ga ir-sim diĝir-ra / i3 a-ra2 i3 dub2 i3 šim i3 {ĝiš}erin sa2-dug4-ga: sweet oil, the fragrance of the gods"}
      - {motif: brewing-process-sung-step-by-step, refs: ["ETCSL 5.3.2 117-119"], note: "bappir udun-na ... titab udun-na ... {d}nin-ka-si-ke4 ma-ab-šar2-šar2-re"}
      - {motif: farmer-vs-shepherd-brothers, refs: ["ETCSL 5.3.2 123-125"], note: "sipad-zu niĝ2-ĝu10-še3 an-edin-na igi-bi im-ši-ĝal2: your shepherd eyes my produce; engar-ĝu10 na-gada-zu {ĝiš}tukul-ta mu-un-sar-re: my farmer chases your herdsman with his cudgel"}
      - {motif: shepherd-counts-flock-each-night, refs: ["ETCSL 5.3.2 130-133"], note: "ud šu2-uš-e niĝ2-kas7-zu ba-ni-ak-e / ĝiš-šudum-ma-zu ki i3-tag-tag-ge: every evening you are counted, your tally-stick set in the ground"}
      - {motif: rival-mocked-as-ending-ground-baked-eaten, refs: ["ETCSL 5.3.2 146-166"], note: "threshing-floor, cudgel, mortar, flour; lu2-silaĝ-ĝa2 ... {im}šu-rin-na: kneaded, put in the oven; u3 za-e ĝe26-e-gin7 niĝ2-gu7-u3-me-en: you too like me are meant to be eaten"}
      - {motif: wild-animals-threaten-flock, refs: ["ETCSL 5.3.2 128-129"], note: "muš-ĝiri2 lu2 la-ga niĝ2 edin-na-ke4 / zi-zu an-edin-na ku-kur ba-ni-ib-be2: snakes and bandits on the plain seek your life"}
    hints:
      - "Compare Ps 104:15 (bread that sustains the heart, oil to make the face shine) and Judg 9:8-15 (Jotham's fable: olive, fig and vine dispute)."
      - "Compare Jer 33:13 (flocks pass again under the hand of the one who counts them) and Lev 27:32 (passing under the rod)."
      - "Compare Gen 31:38-40 (the shepherd's toil, beasts tearing the flock) and Amos 3:12."
  - id: ane-etcsl-5-3-2-sheep-grain-verdict
    tradition: ane-sumerian
    title: "Sheep and Grain: Grain's last retort and Enki's verdict that Grain is the greater"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Sumerian"
    read: ["ETCSL 5.3.2 169-193"]
    tags:
      - {motif: rival-mocked-as-ending-ground-baked-eaten, refs: ["ETCSL 5.3.2 169-179"], note: "za-e {d}iškur lugal-zu-um {d}šakkan2 kuš7-zu-um bar-rim4 ki-nu2-zu-um; šag4-tur3-zu ganba-ka lu2 u3-bi2-in-de6: your innards taken in the market; u8-ĝu10-še3 še ... si-ma-ab: 'fill the measure with grain for my ewe'"}
      - {motif: debate-decided-by-god-in-his-house, refs: ["ETCSL 5.3.2 180-184", "ETCSL 5.3.2 192-193"], note: "{d}en-ki-ke4 {d}en-lil2-ra gu3 mu-na-de2-e ... 2(MAN)-na-ne-ne {d}ezina2 [ḫe2-…]-gu-ul; u8 taka4-a {d}ezina2 e3-a a-a {d}en-ki za3-mi2"}
      - {motif: younger-sister-sheep-bows-to-grain, refs: ["ETCSL 5.3.2 181-186"], note: "{d}u8 {d}ezina2-bi nin9 ḫe2-me-eš: let them be sisters; {d}ezina2-ra dub3 [ki]-a ḫe2-en-de3-za-za: let Sheep kneel before Grain; ĝiri3-ni ... ḫe2-em-su-ub-bu-de3: kiss her feet"}
      - {motif: praised-from-sunrise-to-sunset, refs: ["ETCSL 5.3.2 187-188"], note: "{d}utu e3-[a]-ra {d}utu šu2-[uš]-e / mu {d}ezina2-kam ḫe2-em-pad3-pad3-de3"}
      - {motif: wealthy-sit-at-gate-of-grain-owner, refs: ["ETCSL 5.3.2 190-191"], note: "lu2 kug tuku lu2 za tuku lu2 gud tuku lu2 udu tuku / kan4 lu2 še tuku-e dur2 ḫe2-[ĝa2-ĝa2]"}
    hints:
      - "Compare Gen 41:55-57 and 42:6 (all the earth comes to Joseph for grain; the brothers bow down) and Gen 47:13-20 (money and livestock given for grain)."
      - "Compare Gen 25:23 and 27:29 (the elder shall serve the younger; let your mother's sons bow to you) and Ps 113:3, Mal 1:11 (from sunrise to sunset the name is praised)."
      - "Compare Q 12:58-59 and Q 12:88 (the brothers come to Joseph for grain)."
