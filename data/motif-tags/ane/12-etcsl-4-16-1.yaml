      - {motif: goddess-as-grain, refs: ["ETCSL 5.3.2 49-52"], note: "{d}ezina2 ab-sin2-na gub-ba-ni / ki-sikil sig7-ga ḫi-li gur3-ru-am3: Grain in her furrow, a beautiful girl"}
