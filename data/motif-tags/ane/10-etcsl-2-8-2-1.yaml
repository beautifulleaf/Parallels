      - {motif: god-like-enemy-to-own-city, refs: ["ETCSL 3.2.05 20"], note: "šul {d}utu iri-za larsam-ma lu2-kur2-gin7 bar-ta ba-da-gub"}
      - {motif: prosperity-of-the-wicked, refs: ["ETCSL 3.2.05 21-29"], note: "Elam, Subir and the Šimaškian, who know no reverence for the gods, are not weakened; erin2-a-ni u2-gin7 lu-lu-a; namtar and asag do not approach him; lu2 mu diĝir sal-la-bi ... ugnim-bi silim-ma"}
      - {motif: amorites-as-hostile-others, refs: ["ETCSL 3.2.05 26-27"], note: "of the Šimaškian: za-lam-ĝar til3-la ki diĝir-re-e-ne nu-mu-un-zu-a ... zid2 sizkur2 nu-mu-un-zu-a 'tent-dweller who does not know the places of the gods ... flour and prayers'"}
      - {motif: pious-king-complains-gods-did-not-help, refs: ["ETCSL 3.2.05 30-33"], note: "mu 7-kam-ma (var. 5) ... ur-maḫ-e lu2 gu7-e; diĝir gal-gal-e-ne sizkur2 ud šu2-uš-e al-gub-be2-en"}
      - {motif: prayer-god-say-alas-for-city, refs: ["ETCSL 3.2.05 34-37"], note: "igi zid bar-mu-un-ši-ib / a iri-zu dug4-ga-ba-ab / arḫuš sud larsam-ma šu te-ba-ab"}
      - {motif: prayer-for-kings-long-life, refs: ["ETCSL 3.2.05 45-46"], note: "ni2 teĝ3-ĝe26-ĝu10-uš nam-til3 šum2-mu-na-ab / zi su3-ud-ĝal2 niĝ2-ba-e-eš2 ba-mu-na-ab"}
