  - id: ane-etcsl-2-8-5-1-abi-eshuh-a
    tradition: ane-sumerian
    title: A praise poem of Abi-Ešuḫ (Abi-Eshuh A), addressed to Marduk
    corpus: ane
    original: true
    tagger: Claude (model), reading the Sumerian
    read: ["ETCSL 2.8.5.1"]
    tags:
      - {motif: supreme-rule-over-heaven-and-earth-given-to-marduk, refs: ["ETCSL 2.8.5.1 A:6-10"], note: "{d}en-lil2-le nam-lugal kiš an ki-bi-da-ke4 nam-še3 mu-ni-in-tar zag ša4 la-ba-an-tuku: Enlil fixes for Marduk kingship of the totality of heaven and earth, without a rival"}
      - {motif: younger-god-receives-powers-from-elder, refs: ["ETCSL 2.8.5.1 A:1", "ETCSL 2.8.5.1 A:8"], note: "lugal me an ki-bi-da-ke4 ab-ur4-ra 'who gathers the me of heaven and earth'; ĝidru lugal ĝarza diĝir-re-e-ne"}
      - {motif: god-decrees-kings-destiny, refs: ["ETCSL 2.8.5.1 A:4"], note: "of Marduk himself: en nam tar-tar 'lord who decides destinies'"}
      - {motif: god-alone-knows-hearts, refs: ["ETCSL 2.8.5.1 A:5"], note: "gal-an-zu šag4-zu maḫ 'wise, august knower of hearts' (šag4-zu)"}
      - {motif: god-gives-king-crown-sceptre-crook, refs: ["ETCSL 2.8.5.1 A:7"], note: "šibir kur-kur-ra gamx-ma šu ḫe2-em-mi-la2-am3: the crook that bends the foreign lands bound to Marduk's hand"}
      - {motif: king-rises-like-sun-over-land, refs: ["ETCSL 2.8.5.1 B:12"], note: "of Abi-Ešuḫ, 'beloved son of your heart' (dumu ki aĝ2 šag4-zu): nam-en-bi {d}utu-gin7 an ub-ta pa e3"}
      - {motif: hymn-repeats-each-stanza-with-name, refs: ["ETCSL 2.8.5.1 C:14"], note: "line repeated with the name {d}marduk inserted"}
      - {motif: kirugu-gisgigal-song-structure, refs: ["ETCSL 2.8.5.1 A:11", "ETCSL 2.8.5.1 B:13"], note: "ki-ru-gu2 1-a-kam-ma; ĝiš-gi-ĝal2-bi-im"}
