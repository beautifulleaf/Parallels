      - {motif: goddess-rides-lion, refs: ["ETCSL 4.07.2 14"], note: "nin ur-ra u5-a"}
      - {motif: gods-flee-like-birds-hide-like-mice, refs: ["ETCSL 4.07.2 34-37"], note: "{d}a-nun-na ... su-din{mušen} dal-la-gin7 du6-de3 mu-e-ši-ib-ra-aš 'fly to the ruin mounds like bats'"}
      - {motif: goddess-wrath-like-sea-flood, refs: ["ETCSL 4.07.2 38-41"], note: "šag4 ib2-ba-za a-ba ib2-te-en-te-en ... ib2-ba nu-te-en-te-en dumu gal {d}suen-na"}
      - {motif: mountain-refuses-homage-to-deity, refs: ["ETCSL 4.07.2 42-57"], note: "the city that has not said 'the land is yours': its vegetation ruined, gates burned, id2-ba uš2 ma-ra-an-de2 uĝ3-bi ma-ra-na8-na8 'blood poured into its rivers and its people drink it'; troops led captive; the wife no longer confides in her husband at night"}
      - {motif: river-turned-to-blood, refs: ["ETCSL 4.07.2 45"], note: "id2-ba uš2 ma-ra-an-de2; variant 'could not drink'"}
      - {motif: goddess-greater-than-mountains-like-an-and-enlil, refs: ["ETCSL 4.07.2 59", "ETCSL 4.07.2 61"], note: "nin an-ra dirig-ga 'lady greater than An'; ama ugu-ni-ir dirig-ga 'greater than her own mother'"}
      - {motif: hymn-words-composed-by-god, refs: ["ETCSL 4.07.2 63-65"], note: "here the singer: šir3 kug-zu ga-am3-dug4; me-zu ga-mu-ra-ab-dug4 'I will recite your holy song, enumerate your powers'; tag tentative"}
    hints:
      - "Rivers turned to blood so the people cannot drink: Exod 7:17-21, Ps 78:44, Rev 16:4; Q 7:133 (blood among the signs on Pharaoh's people). The deity whose wrath none can withstand: Nah 1:6, Ps 76:8. Fire raining on the land: Gen 19:24, Ps 11:6."
  - id: ane-etcsl-4-07-2-inana-b-enheduana-exile
    tradition: ane-sumerian
    title: The exaltation of Inana (Inana B), part 2, En-ḫedu-ana's expulsion, plea and vindication
    corpus: ane
    original: true
    tagger: Claude (model), reading the Sumerian
    read: ["ETCSL 4.07.2 66-154"]
    tags:
      - {motif: enheduana-high-priestess-named, refs: ["ETCSL 4.07.2 66-67", "ETCSL 4.07.2 81"], note: "en-me-en en-ḫe2-du7-an-na-me-en"}
      - {motif: en-priestess-in-gipar, refs: ["ETCSL 4.07.2 66-69"], note: "ĝi6-par3 kug-ĝa2 ḫu-mu-ši-in-kur9-re-en; funeral offerings brought 'as if I had never lived there' (ĝe26-e nu-mu-un-til3-le-en)"}
      - {motif: light-scorches-shade-becomes-storm, refs: ["ETCSL 4.07.2 70-73"], note: "ud-de3 ba-te ud mu-da-bil2 / ĝissu ne ba-te u18-lu-da im-mi-dul / ka lal3-ĝu10 šu uḫ3-a ba-ab-dug4 'my honeyed mouth became scum'"}
      - {motif: king-desecrates-gods-own-temple, refs: ["ETCSL 4.07.2 85-90"], note: "Lugal-Ane: šu-luḫ an kug-ga-ke4 niĝ2-nam-ma-ni in-kur2 / an-da e2-an-na ḫa-ba-da-an-kar ... e2-bi e2 ḫul-a ... kur9; ninim 'envy'"}
      - {motif: tears-accepted-as-offering, refs: ["ETCSL 4.07.2 82-83"], note: "er2-ĝa2 kaš dug3-ga-gin7 kug {d}inana-ra šu ga-mu-ni-ri-bar 'I give free vent to my tears like sweet beer'"}
      - {motif: imprecatory-prayer-against-enemies, refs: ["ETCSL 4.07.2 91-98"], note: "lu2 ḫu-mu-sar-re-en lu2 ḫe2-em-mi-dab5-be2-en; iri-bi an-ne2 ḫa-ba-ra-an-si-il-le / {d}en-lil2-le nam ḫa-ba-da-an-kud-de3 / dumu er2 pad3-da-bi ama-ni na-an-sed4-e 'may its weeping child not be soothed by its mother'"}
      - {motif: priestess-driven-from-temple-into-wilderness, refs: ["ETCSL 4.07.2 99-108"], note: "u3-ma gub-gub-ba e2-ta ba-ra-an-e3-en / sim{mušen}-gin7 ab-ta ba-ra-an-dal-en ... {ĝiš}kiši16 kur-ra-ke4 bi2-in-du-e-en / aga zid nam-en-na mu-da-an-kar / ĝiri2 ba-da-ra ma-an-šum2 a-ra-ab-du7 'dagger and sword: these suit you'"}
      - {motif: god-does-not-decide-sufferers-case, refs: ["ETCSL 4.07.2 100-103", "ETCSL 4.07.2 122"], note: "{d}nanna-ĝu10 en3-ĝu10 ba-ra-an-tar ... {d}aš-im2-babbar-e di-ĝu10 ba-ra-bi2-in-dug4: Nanna has not decided my case"}
      - {motif: petitioner-protests-innocence, refs: ["ETCSL 4.07.2 117-119"], note: "ĝiš-nu2 gi-rin-na šu nu-um-mi-la2 / inim dug4-ga {d}nin-gal lu2-ra nu-mu-na-bur2: I did not touch the flowered bed, did not reveal Ningal's words"}
      - {motif: messenger-kisses-ground-before-lord, refs: ["ETCSL 4.07.2 113", "ETCSL 4.07.2 116"], note: "{d}a-nun-na-ke4-ne nundum-nundum-bi-ta ki su-ub ma-ra-ak-ke4-ne 'the Anuna kiss the ground with their lips before you'"}
      - {motif: be-it-known-refrain, refs: ["ETCSL 4.07.2 122-134"], note: "ḫe2-zu-am3 x 11: an-gin7 maḫ-a-za ... ur-gin7 ad6 gu7-u3-za ḫe2-zu-am3 'be it known that you devour corpses like a dog'"}
      - {motif: hymn-sung-by-night-repeated-at-noon, refs: ["ETCSL 4.07.2 137-141"], note: "ne-mur mu-dub šu-luḫ si bi2-sa2 'I heaped up coals in the censer'; niĝ2 ĝi6 u3-na ma-ra-an-dug4-ga-am3 / gala-e an-bar7-ka šu ḫu-mu-ra-ab-gi4-gi4"}
      - {motif: deity-accepts-offering-and-is-appeased, refs: ["ETCSL 4.07.2 144-151"], note: "sizkur2-ra-na šu ba-an-ši-in-ti / šag4 kug {d}inana ki-bi ba-an-na-ab-gi4; iti6 e3-a-gin7 la-la ba-an-guru3; Ningal blesses her; the door posts greet her"}
      - {motif: closing-doxology-praise-is-sweet, refs: ["ETCSL 4.07.2 154"], note: "nin-ĝu10 ḫi-li gu2 e3 {d}inana za3-mi2"}
    hints:
      - "A priestly author expelled, wandering in the thorns, pleading for vindication: compare the laments of Jeremiah (Jer 20:7-18) and Ps 42-43 (driven from the temple), Ps 55:7-8 ('oh that I had wings like a dove, I would fly away'). Weeping child not comforted: Jer 31:15. Protestation of innocence: Job 31, Ps 7:4-6. Tears as offering: Ps 56:9, Ps 126:5. Imprecation on the city of the enemy: Ps 137:7-9."
  - id: ane-etcsl-4-07-3-inana-c-terror
    tradition: ane-sumerian
    title: A hymn to Inana (Inana C, in-nin šag4-gur4-ra), part 1, the terror of the goddess
    corpus: ane
    original: true
    tagger: Claude (model), reading the Sumerian
    read: ["ETCSL 4.07.3 1-114"]
    tags:
      - {motif: goddess-greater-than-mountains-like-an-and-enlil, refs: ["ETCSL 4.07.3 1-4", "ETCSL 4.07.3 96-98"], note: "an gal-da zag ša4; an-da {d}en-lil2-da mu-e-da-sa2 zag gal-bi mu-e-dur2-ru-e"}
      - {motif: goddess-indispensable-to-divine-decisions, refs: ["ETCSL 4.07.3 14", "ETCSL 4.07.3 114"], note: "{d}inana e-ne-da nu-me-a an gal ka-aš nu-um-bar {d}en-lil2 nam nu-un-tar; za-e-da nu-me-a nam-nam-ma nu-un-tar"}
      - {motif: gods-ways-inscrutable-own-counsellor, refs: ["ETCSL 4.07.3 6-7", "ETCSL 4.07.3 69-70"], note: "in-di3-bi an nu-zu-zu; niĝ2 ak-ak-da-ni ab-ši-kur2-ru ĝar-bi niĝ2 nu-zu; ĝalga suḫ3 pu-uḫ3-ru-um diĝir gal-gal-e-ne ĝar-bi niĝ2 nu-zu"}
      - {motif: gods-flee-in-terror, refs: ["ETCSL 4.07.3 11-13"], note: "{d}a-nun-na gi dili-gin7 saĝ mu-da-ab-sag3-sag3-ge-ne / dum-dam za-ni-še3 kilib3-ba-bi a2-ur2 mu-un-dab5-be2-e-ne"}
      - {motif: war-goddess-clad-in-terror, refs: ["ETCSL 4.07.3 18-29"], note: "battle is her game; dalḫamun whirlwind garment; {d}inana piriĝ gi-il-gi-il-la dur2-ru; nemur ḫur-saĝ-ĝa2; am gal"}
      - {motif: goddess-rides-lion, refs: ["ETCSL 4.07.3 23", "ETCSL 4.07.3 105"], note: "ur gal-gal 7-bi ba-e-u5 an-na ba-e-ed2-de3 'you ride seven great beasts as you come forth from heaven'"}
      - {motif: net-from-which-none-escapes, refs: ["ETCSL 4.07.3 27", "ETCSL 4.07.3 31", "ETCSL 4.07.3 65-66", "ETCSL 4.07.3 85"], note: "sa la2-a-ni engur-ra ku6 ab-dab5-dab5-be2 ... mušen-du3 kug-zu-gin7 ... mušen nu-e3; ḫu-ri2-in{mušen} lu2 šu nu-bar-re"}
      - {motif: food-and-milk-of-death, refs: ["ETCSL 4.07.3 39-43"], note: "er2 u2 ga nam-uš2-a ... lu2 gu7-bi nu-til-le / ze2 mu-un-tab2-tab2-be2; šir3 nam-uš2-a edin-na mu-un-ĝa2-ĝa2 'she sings the song of death on the plain'"}
      - {motif: warrior-washes-blood-after-battle, refs: ["ETCSL 4.07.3 45-48"], note: "inverted: {ĝiš}tukul-bi uš2 lugud mu-un-tu5-tu5 'she washes their weapons in blood and gore'; blood poured on their first offerings"}
      - {motif: goddess-turns-light-to-darkness, refs: ["ETCSL 4.07.3 49"], note: "ud zalag ku10-ku10 an-bar7 mul-sig7-še3 'darkening bright day, turning midday into (star-lit) night'"}
      - {motif: goddess-reverses-gender-roles, refs: ["ETCSL 4.07.3 80-90"], note: "{ĝiš}šukur i-ni-kud nitaḫ-gin7 šag4-ga-ni {ĝiš}tukul an-na-ab-šum2-mu; pilipili, kurĝara, saĝursaĝ cult personnel; the woman given a spear"}
      - {motif: high-god-yields-powers-to-goddess, refs: ["ETCSL 4.07.3 106-108"], note: "an gal-e muš3-za ni2 bi2-te ki-tuš-zu im-mi-ḫu-luḫ ... ĝarza2 maḫ ĝarza gal-gal šu-zu ga-mu-un-si 'Great An feared your dwelling ... I will hand over to you the august rites'"}
      - {motif: messenger-kisses-ground-before-lord, refs: ["ETCSL 4.07.3 104", "ETCSL 4.07.3 109"], note: "diĝir gal-e-ne giri17 ki-a bi2-in-su-ub-bu-uš šu-kin mu-un-dab5-be2-eš"}
      - {motif: mountain-refuses-homage-to-deity, refs: ["ETCSL 4.07.3 110-112"], note: "ebiḫ giri17 ki-še3 nu-mu-ra-an-te ... gu3-an-ne2-si-gin7 ib2-ba si-il-la-za ud-gin7 ib2-ra-ra"}
    hints:
      - "The day turned to darkness at noon: Amos 8:9, Joel 2:10, Jer 15:9. God's net that none escapes: Ezek 12:13, 17:20, Hos 7:12. A deity whose plans the gods cannot know: Isa 40:13-14, 55:8-9. The cup of poison/wrath given to drink: Jer 25:15-16, Ps 75:9; gall to eat: Jer 9:14."
  - id: ane-etcsl-4-07-3-inana-c-yours-litany
    tradition: ane-sumerian
    title: A hymn to Inana (Inana C), part 2, the 'are yours, Inana' litany and the goddess's sovereignty
    corpus: ane
    original: true
    tagger: Claude (model), reading the Sumerian
    read: ["ETCSL 4.07.3 115-218"]
    tags:
      - {motif: catalogue-of-divine-powers-me, refs: ["ETCSL 4.07.3 115-172"], note: "refrain {d}inana za-a-kam 'are yours, Inana': running, escaping, opening roads, wealth and loss, choice, offering, inspection, protective deities, cult centres, slander, terror, gathering the dispersed ... (lines 143-154 missing)"}
      - {motif: uproot-and-plant-commission, refs: ["ETCSL 4.07.3 119"], note: "gul-lu dim2-me zi-zi ĝa2-ĝa2 {d}inana za-a-kam: 'to destroy, to build, to tear out and to settle are yours'; said of the goddess, not of a prophet"}
      - {motif: goddess-reverses-gender-roles, refs: ["ETCSL 4.07.3 120"], note: "nitaḫ munus-ra munus nitaḫ-ra ku4-ku4-de3 {d}inana za-kam"}
      - {motif: god-humbles-one-exalts-another, refs: ["ETCSL 4.07.3 140-141", "ETCSL 4.07.3 155"], note: "ḫu-ru kalag-ga lu2-gam-ma lu2-sig-ga ḫi-ḫi; il2-la2 du5-la2 saĝ il2-la2 ib2-ba-lal ḫi-ḫi; tur maḫ sig daĝal"}
      - {motif: most-high-gives-kingdom-to-lowliest, refs: ["ETCSL 4.07.3 142"], note: "aga {ĝiš}gu-za {ĝiš}ĝidru nam-lugal šum2-mu {d}inana za-kam"}
      - {motif: deity-gathers-dispersed-people, refs: ["ETCSL 4.07.3 170"], note: "uĝ3 [sag2 dug4-ga] gu2 ĝar-ĝar ki-bi-še3 gi4-gi4 'to gather the scattered people and restore them to their place'; partly restored"}
      - {motif: goddess-turns-light-to-darkness, refs: ["ETCSL 4.07.3 177"], note: "igi suḫ-a-zu dadag-ga ku10-ku10 an-bar7 mul-sig7-še3"}
      - {motif: goddess-as-great-judge, refs: ["ETCSL 4.07.3 180"], note: "{d}inana e2-gal kadra nu-di-kud 'the judge who takes no bribe (gift) in the palace'"}
      - {motif: gods-say-so-be-it-to-kings-destiny, refs: ["ETCSL 4.07.3 202-208"], note: "here the goddess's own ḫe2-am3: ḫe2-am3-zu ḫe2-am3 gul-lu; eš-bar ... an ki-ta nu-kur2-ru; ki ḫe2-am3 bi2-in-dug4 gul-lu nu-DI"}
      - {motif: word-of-high-god-unchangeable, refs: ["ETCSL 4.07.3 198-206"]}
      - {motif: deity-inspects-land-to-tell-just-from-wicked, refs: ["ETCSL 4.07.3 210-212"], note: "izi-ĝar-zu ub an-na zalag-ge; nitaḫ munus-bi gu dili-a mi-ri-ed2-de3 ... {d}utu-gin7 igi-zu-še3 i3-dib-be2: men and women pass before you in a row for inspection"}
      - {motif: refrain-who-is-like-you-o-king, refs: ["ETCSL 4.07.3 217-218"], note: "of the goddess: diĝir a-ba za-gin7 ur4 an ki ur4-ur4 'which god is like you?'"}
    hints:
      - "'A time to tear down and a time to build up, to plant and to uproot': Eccl 3:2-8; Jer 1:10. 'YHWH makes poor and makes rich, brings low and lifts up': 1Sam 2:6-8, Ps 75:8, Luke 1:52; Q 3:26 ('You give kingship to whom You will ... You honour whom You will and humble whom You will'). God judges without bribe: Deut 10:17. Gathering the dispersed: Deut 30:3-4, Isa 11:12. Passing under the shepherd's inspection: Ezek 20:37, Jer 33:13. 'Who is like you among the gods?': Exod 15:11."
  - id: ane-etcsl-4-07-3-inana-c-enheduana-prayer
