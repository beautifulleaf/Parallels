# Full read of the ANE corpus, chunk 10: ETCSL 2.8.2.1 (Hammu-rabi A) - ETCSL 4.07.7 (Inana G). Read from the ETCSL Sumerian composite transliterations.
new_motifs:
  god-delights-in-kings-name-as-own: {label: "Prayer that the uttering of the king's name delight the god as much as the uttering of the god's own name", cluster: kingship}
  god-petitions-divine-assembly-for-king: {label: "The king's patron god asks the assembled great gods to fix a grand destiny for his shepherd, and they name him king", cluster: kingship}
  king-called-humble-before-gods: {label: "The chosen king is called the humble (sun5) prince acceptable to the gods", cluster: kingship}
  king-roars-like-storm-god-mouth-like-fire: {label: "The king's battle-roar is like the storm god Iškur and his mouth is the fire god", cluster: kingship}
  goddess-indispensable-to-divine-decisions: {label: "A goddess without whom the high gods (An and Enlil) cannot take a decision for the land", cluster: theology}
  no-king-without-goddess: {label: "Without the goddess no king can be made shepherd of the land", cluster: kingship}
  goddess-adorns-kings-statue: {label: "A goddess looks with joy on the king's statue, gives it beauty and charm and sets it up", cluster: cult}
  goddess-gives-protective-spirits-for-king: {label: "A goddess gives the king's people protective deities (lamma, alad) to drive back the opposing side", cluster: kingship}
  kingship-firm-as-heaven-and-earth: {label: "Prayer that the king's kingship be as stable as heaven and earth", cluster: kingship}
  king-judges-like-sun-god: {label: "The king gives just verdicts like the sun god Utu", cluster: kingship}
  king-leads-people-as-mother-and-father: {label: "The king leads his people with the shepherd's crook as if he were their mother and father; they look to him as to their parents", cluster: kingship}
  king-appears-like-moon-over-land: {label: "The king comes forth over the land like the moon god, shining like the Barge of Heaven, and the people pray to him", cluster: kingship}
  god-prays-for-king: {label: "A great god or goddess prays (šudu3) on the king's behalf, from an overflowing heart or to her husband in the bedchamber", cluster: kingship}
  enemies-delivered-into-kings-hand: {label: "Prayer that a god deliver the king's enemies, or numerous people, into his hand", cluster: warfare}
  divine-minister-ushers-king-before-god: {label: "The chief god's minister (Nuska) leads the king with his offerings into the temple and before the god's shining face", cluster: cult}
  foreign-lands-placed-under-kings-feet: {label: "The high god places the foreign lands at (under) the king's feet", cluster: kingship}
  kings-destiny-never-altered: {label: "The king is one whose fate the high god never alters", cluster: kingship}
  interlinear-akkadian-gloss: {label: "A Sumerian composition is copied with an interlinear Akkadian translation or gloss", cluster: scribal}
  supreme-rule-over-heaven-and-earth-given-to-marduk: {label: "The high gods (An, Enlil) give Marduk the supervision of heaven and earth, the sceptre, the rites of the gods and kingship over all, with no rival", cluster: theology}
  goddess-speaks-in-emesal: {label: "A goddess (or her attendants) speaks in Emesal, the register of Sumerian used for goddesses and women", cluster: language}
  king-batters-enemy-like-storm: {label: "The king batters hostile lands like a raging storm (ud ḫuš)", cluster: warfare}
  royal-awe-worn-as-garment: {label: "The king (or god) is cloaked in the awesome radiance of kingship as in a mantle", cluster: kingship}
  king-feeds-and-waters-people: {label: "The king feeds his people lavishly and gives them abundant drink, like a shepherd at pasture", cluster: kingship}
  king-of-sumer-and-akkad: {label: "The king is titled king of Sumer and Akkad, with a list of the cities he rules", cluster: kingship}
  letter-opening-say-to-my-lord: {label: "A letter opens with the formula 'Say to my lord (X): thus says Y, your servant' (or, from the king, 'thus says your lord')", cluster: letters}
  letter-closing-may-my-lord-know: {label: "A letter closes with 'May my lord know!' or 'It is urgent!'", cluster: letters}
  letter-address-praises-recipient-with-epithets: {label: "A letter's address heaps praise-epithets and images on the recipient (king or god) before 'thus says your servant'", cluster: letters}
  envoy-not-greeted-at-gate: {label: "At an official's palace gate no one asks after the king's well-being or rises and bows before the king's envoy", cluster: letters}
  official-arrogates-royal-honours: {label: "A provincial official sits on a raised throne with a golden footstool, flanked by troops, and usurps the king's own rites", cluster: kingship}
  envoy-refuses-to-sit-before-delivering-message: {label: "Offered a seat (and food), the envoy refuses to sit until he has delivered his master's instructions", cluster: letters}
  guest-honoured-with-fattened-oxen-and-sheep: {label: "A visitor's table is laid with fattened oxen and sheep", cluster: hospitality}
  king-makes-servant-equal-to-himself: {label: "The king raises a servant to rule as his equal: a throne on a dais, power to appoint and remove governors and to kill or blind, and messengers prostrate before him", cluster: kingship}
  king-rebukes-disobedient-servant: {label: "The king rebukes an official: 'This is what I ordered you; why have you not done as I said?'", cluster: letters}
  written-orders-to-be-heeded: {label: "Officials are told to heed the king's written tablet and agree among themselves", cluster: letters}
  fortresses-garrisoned-and-troops-subdued: {label: "The governor sets strong guards in the fortresses and makes the troops of the province submit", cluster: warfare}
  governor-drains-flooded-fields: {label: "An official drains flooded arable land and repairs leaking embankments", cluster: civilization}
  servant-ready-to-do-all-lord-says: {label: "The servant declares: 'Whatever my lord says, I will do'", cluster: letters}
  troops-missing-at-muster: {label: "When the levy is inspected, thousands of the troops are found to be missing", cluster: warfare}
  king-word-as-word-of-god: {label: "A subject tells the king that his word is the word of the high god, irrevocable like a god's and countless as rain", cluster: kingship}
  fortress-wall-against-nomads: {label: "A king builds a great fortress or wall across the land to keep out nomadic invaders (Martu, Tidnum)", cluster: warfare}
  king-recalls-fathers-fortress: {label: "A king refers to the fortress built by his father, the dynasty's founder", cluster: kingship}
  king-gives-gold-to-gods-for-own-life: {label: "The gold and silver the king fashions for the gods is given for his own life", cluster: cult}
  captured-fugitive-informs-on-enemy: {label: "A captured deserter gives information about the enemy's movements", cluster: warfare}
  enemy-intentions-known-from-omens: {label: "A commander knows from oracular signs that the enemy has regained strength for battle", cluster: divination}
  wall-breaches-measured-by-sector: {label: "Breaches in a defensive wall are reported sector by sector, each assigned to a named official, with their length in measures", cluster: warfare}
  commander-requests-workmen-and-troops: {label: "'If my lord agrees': a commander asks the king for thousands of workmen to carry baskets and for troops", cluster: warfare}
  enemy-plans-to-resettle-population: {label: "The enemy plans to remove and resettle the population of the land", cluster: warfare}
  wall-repaired-within-one-month: {label: "The king orders the fallen sections of a fortress rebuilt and the work completed within one month", cluster: warfare}
  building-work-night-and-day-without-sleep: {label: "The builders must work night and noonday without sleep to complete the fortification", cluster: warfare}
  nomads-roam-freely-with-tents-and-pens: {label: "A people in the open country: men and women go wherever they please, pens set up in the desert, tents and camps pitched", cluster: civilization}
  habiru-sa-gaz: {label: "Bandits or brigands called sa-gaz (Akkadian ḫabbātu, the Ḫabiru/ʿapiru)", cluster: peoples}
  merchant-goods-seized-by-official: {label: "A merchant sent abroad with the king's silver has his purchased goods seized by a foreign official", cluster: trade}
  house-born-slave-trusted: {label: "The king praises a house-born slave as uniquely capable and loyal", cluster: letters}
  king-sends-silver-and-gold-to-buy-grain: {label: "The king sends vast amounts of silver and gold to an official to purchase grain at any price", cluster: famine}
  aged-counsellor-of-king: {label: "An aged counsellor of long standing, 'a grandfather to me', advises the king", cluster: wisdom}
  king-calls-servant-his-son: {label: "The king tells a loyal servant 'You are my son who gladdens my heart'", cluster: kingship}
  builders-also-fight: {label: "A commander builds the fortification and fights the enemy at the same time, day and night", cluster: warfare}
  official-boasts-of-lineage: {label: "An official reminds the king that he comes from a great lineage", cluster: letters}
  son-king-distinguishes-his-reign-from-fathers: {label: "A son-king declares that his throne is not his father's throne, setting his rule apart from his father's", cluster: kingship}
  grain-carried-by-fleet-of-boats: {label: "Hundreds of barges are requested to carry a vast stock of grain by river to the capital", cluster: famine}
  oath-before-sun-god: {label: "A speaker affirms 'Before the sun god, I will not change my word'", cluster: oath}
  god-gives-city-to-enemy: {label: "The high god comes to hate the king and his city's god and hands the city over to the enemy", cluster: lament}
  god-will-turn-again-to-his-city: {label: "Hope that on the day the high god turns back to his city (and its god), the traitors will be exposed", cluster: lament}
  servant-profiteers-on-grain-price: {label: "A servant buys grain cheaply with the king's silver and charges the king double", cluster: famine}
  commander-lets-enemy-into-land: {label: "A frontier commander lets the enemy nomads pass into the land without a fight", cluster: warfare}
  usurper-claims-divine-mandate-to-conquer: {label: "A rival ruler claims the high god has given him shepherdship of the land and told him to seize its cities", cluster: kingship}
  oath-by-personal-god: {label: "A ruler swears by the name of the high god and of his personal god that he will take a city", cluster: oath}
  conqueror-installs-his-statues-and-priests: {label: "A conqueror plans to install his statues, emblems and his own en priests and priestesses in the shrines of the conquered cities and hold their festivals", cluster: cult}
  wall-given-a-name: {label: "A ruler rebuilds a city wall and gives it a programmatic name", cluster: kingship}
  governors-captured-or-reinstated-by-conqueror: {label: "A conqueror captures some governors and reinstates others in their posts", cluster: warfare}
  no-ally-seeks-refuge-with-king: {label: "A threatened governor says he has no ally and asks to flee to the king if attacked", cluster: letters}
  god-raises-upstart-foreigner-to-kingship: {label: "The high god turns against the land and raises a foreign upstart, not of native seed (an 'ape from the mountains'), to kingship", cluster: kingship}
  divine-assembly-dispersed: {label: "The assembly of the gods and the land are dispersed", cluster: lament}
  governors-defect-to-rival: {label: "Governors of the king's cities defect to a rising rival, as the god's word has decreed", cluster: kingship}
  scribe-boasts-of-writing-stelae: {label: "A writer declares 'I am a scribe; I write on stelae'", cluster: scribal}
  disgraced-servant-bound-in-mourning-clothes: {label: "A disgraced servant describes himself bowed in the dirt, hands bound, in mourning clothes, with dust in his eyes", cluster: lament}
  proverbs-of-the-strong-and-the-poor: {label: "A string of proverbs: dogs devour corpses, fire consumes watered reeds, yet the sun god who eats cream still touches the table of the poor", cluster: wisdom}
  son-of-widow-no-one-cares: {label: "The petitioner pleads: 'I am a widow's son, no one cares for me'", cluster: lament}
  petition-for-restoration-of-kings-favour: {label: "A disgraced servant asks when the king's heart will be restored to him", cluster: letters}
  army-of-spearmen-archers-axemen: {label: "Troops sent in equal divisions of spear-throwers, archers and axe-wielders", cluster: warfare}
  city-turns-to-rival-king: {label: "A town turns against its king and admits a rival king's troops", cluster: warfare}
  guards-check-all-who-enter-and-leave: {label: "Guards are posted to check all who enter and leave", cluster: warfare}
  letter-to-a-god: {label: "A king or individual writes a letter to a god, with the epistolary formula, setting out distress and asking for help (letter-prayer)", cluster: prayer}
  god-loves-to-keep-humans-alive: {label: "The god is one who loves to keep people alive (or revive them)", cluster: theology}
  city-lament-young-men-harvested-like-barley: {label: "The city's young men are harvested like barley and plucked like fruit, people smashed like clay figurines, children snatched from their mothers' laps", cluster: lament}
  god-like-enemy-to-own-city: {label: "The city's god stands aside from his city like an enemy", cluster: lament}
  prayer-god-say-alas-for-city: {label: "The god is asked to look favourably on his city, say 'Alas!' over it and show it compassion", cluster: lament}
  petition-to-keep-fathers-estate: {label: "A citizen petitions the king that no one take away his father's household and estate", cluster: law}
  disease-demon-in-body-expelled-by-god: {label: "A disease demon (namtar) settled in a person's body that no one knows how to expel is driven out by a healing deity", cluster: healing}
  physicians-fail-sufferer-turns-to-god: {label: "Repeated treatments by physicians fail (a bandage that does not hold) and the sufferer appeals to the healing deity", cluster: healing}
  god-who-binds-and-looses: {label: "The god is one who knows how to bind and to release", cluster: theology}
  moon-god-crown-of-heaven-and-earth: {label: "The moon god is the crown of heaven and earth, whose light spreads widely and who is entrusted with the heavens", cluster: theology}
  deity-more-beautiful-than-moon-barge: {label: "Refrain asking whether the moon's barge or Inana's emblem is as beautiful as the deity praised", cluster: hymn}
  divine-messenger-brings-tablet-of-life: {label: "A divine minister brings the tablet of life down from the midst of heaven and sends rain and abundance", cluster: cosmology}
  divine-name-sweet-in-mouth: {label: "The deity's name fills the mouth like cakes, butter and cream (or honey)", cluster: hymn}
  protective-goddess-gives-husband-in-place-of-father: {label: "A protective goddess gives a woman a husband in place of her father and a son in place of a field", cluster: family}
  holy-city-intolerant-of-evil: {label: "In the god's holy city slander, hostile speech, arrogance, violence and boasting are abominations not tolerated", cluster: temple}
  temple-interior-like-boundless-sea: {label: "The temple's interior is a wide sea without horizon, its divine powers those of the abzu that no one may look upon", cluster: temple}
  temple-priests-perfect-in-rites: {label: "The temple's classes of priests are expert in blessing, lustration and holy prayer", cluster: cult}
  king-as-farmer-of-god: {label: "The king is the god's great farmer and good shepherd, bringing rich offerings to his temple", cluster: kingship}
  no-one-can-look-on-gods-face: {label: "No god (or no one) can look upon the high god's face", cluster: theophany}
  without-god-nothing-exists-litany: {label: "Litany: without the high god no city would be built, no king raised, no rain fall, no fish spawn, no animal give birth", cluster: theology}
  gods-ways-inscrutable-own-counsellor: {label: "The god's ingenuity is like tangled threads no eye can follow; he is his own counsellor and no one comprehends his deeds", cluster: theology}
  gods-word-is-abundance-of-heaven-and-earth: {label: "The god's word, heavy as heaven, is a foundation on earth: it pours abundance from heaven and is flax, grain and the life-giving flood", cluster: theology}
  god-as-shepherd-of-all-creatures: {label: "The high god is the faithful shepherd and herdsman of the multitudes and of all living creatures", cluster: theology}
  river-turned-to-blood: {label: "Blood is poured into a land's rivers so that its people must drink it (or cannot drink)", cluster: plague}
  light-scorches-shade-becomes-storm: {label: "The sufferer approaches the light and it scorches; approaches the shade and is covered by a storm; the honeyed mouth becomes scum", cluster: lament}
  priestess-driven-from-temple-into-wilderness: {label: "A priest(ess) is driven from the temple, flies off like a swallow from the window, walks the thornbushes of the mountains and is stripped of the crown of office", cluster: lament}
  god-does-not-decide-sufferers-case: {label: "The sufferer complains that his or her god has not pronounced a verdict on the case", cluster: lament}
  petitioner-protests-innocence: {label: "The petitioner protests innocence by listing sins not committed", cluster: prayer}
  be-it-known-refrain: {label: "Litany refrain 'Be it known that you ...' (ḫe2-zu-am3) proclaiming the deity's greatness and terror", cluster: hymn}
  hymn-sung-by-night-repeated-at-noon: {label: "A song recited to the deity at dead of night is to be repeated by a singer at noon", cluster: cult}
  deity-accepts-offering-and-is-appeased: {label: "The angry deity accepts the petitioner's offering and her heart is restored; she shines like the rising moon", cluster: cult}
  food-and-milk-of-death: {label: "The goddess gives the food and milk of death; whoever eats it does not last, gall burns his mouth", cluster: warfare}
  high-god-yields-powers-to-goddess: {label: "The sky god, afraid of the goddess, seats her in his dwelling and hands over to her the royal and divine rites", cluster: theology}
  deity-gathers-dispersed-people: {label: "The deity gathers the scattered people and returns them to their homes", cluster: theology}
  penitent-feels-gods-punishment-in-body: {label: "The petitioner says the deity's great punishment has been felt in his or her body and lament keeps sleep away", cluster: lament}
units:
  - id: ane-etcsl-2-8-2-1-hammurabi-a
    tradition: ane-sumerian
    title: A praise poem of Hammu-rabi (Hammu-rabi A), fragments
    corpus: ane
    original: true
    tagger: Claude (model), reading the Sumerian
    read: ["ETCSL 2.8.2.1"]
    tags:
      - {motif: each-god-gives-king-a-gift, refs: ["ETCSL 2.8.2.1 A:14-23"], note: "after 'ḫa-am-mu-ra-bi lugal' a run of gods each with a gift: Gibil, Enlil nam-a-ni-še3, Enki nam-ur-[saĝ], Suen, Utu maš-maš 'the incantation priest', Iškur nam-ur-saĝ, Marduk nam-kalag, Inana me; the gifts are mostly broken"}
      - {motif: black-headed-people, refs: ["ETCSL 2.8.2.1 A:10", "ETCSL 2.8.2.1 F:21"], note: "saĝ gig2-ga"}
      - {motif: king-of-the-four-quarters, refs: ["ETCSL 2.8.2.1 A:11-13"], note: "interpretive: the realm marked by the Euphrates, the Tigris and the bank of the Irnina, where something is built (garaš2 bi-ib2-du3{?})"}
      - {motif: king-statue-set-before-god, refs: ["ETCSL 2.8.2.1 D:10"], note: "fragmentary 'alan-zu la-ba-da-an-kur9-re', 'your statue shall not be brought in'; context lost"}
      - {motif: gods-escort-king-on-road, refs: ["ETCSL 2.8.2.1 F:2-5"], note: "very broken: Marduk 'in the midst of the great gods' (mu-ru-ub diĝir gal-gal-e-ne), with a curse (aš2 gig-ga) and great wrath (ib2-ba gu-la); the tag is tentative"}
    hints:
      - "Gods each contributing a gift to the king compare the prologue of the Laws of Hammurabi; for a king's realm bounded by rivers compare Gen 15:18 and 1Kgs 5:1 (Euphrates boundary)."
  - id: ane-etcsl-2-8-2-2-hammurabi-b
    tradition: ane-sumerian
    title: A prayer to Marduk (?) for Hammu-rabi (Hammu-rabi B)
    corpus: ane
    original: true
    tagger: Claude (model), reading the Sumerian
    read: ["ETCSL 2.8.2.2 1-13"]
    tags:
      - {motif: god-gives-king-crown-sceptre-crook, refs: ["ETCSL 2.8.2.2 1", "ETCSL 2.8.2.2 4"], note: "restored: '[saĝ-ĝa2 ḫu-mu-ra-an-ĝal2]' for Lugal-Šubur's desert crown (men edin-na); suḫ10 nam-en-na 'priestly headdress' covered in me-lem4"}
      - {motif: god-delights-in-kings-name-as-own, refs: ["ETCSL 2.8.2.2 8"], note: "mu pad3-da-ni-gin7 mu pad3-da-zu ... {d}en-ki-ke4 ḫa-ba-ni-dug3"}
      - {motif: wisdom-given-to-king-by-god, refs: ["ETCSL 2.8.2.2 9"], note: "ĝeštug3 ĝizzal 'wisdom and attention'"}
      - {motif: prayer-for-kings-long-life, refs: ["ETCSL 2.8.2.2 7", "ETCSL 2.8.2.2 11"], note: "a-a {d}en-ki mu nam-til3-la-zu ḫa-ba-ni-sud-sud; Enki recites life-giving incantations (mu7-mu7 nam-til3-la)"}
      - {motif: king-named-by-high-god, refs: ["ETCSL 2.8.2.2 10"], note: "the royal name 'like something unchangeable forever' (niĝ2 du-ri2-še3 nu-ub-kur2-ru-gin7)"}
    hints:
      - "Compare Ps 21:4-5 (crown of fine gold, length of days for ever) and Ps 72:17 (may his name endure for ever); 1Kgs 3:12 wisdom given to the king; Q 38:20 'We strengthened his kingdom and gave him wisdom'."
  - id: ane-etcsl-2-8-2-3-hammurabi-c
    tradition: ane-sumerian
    title: A praise poem of Hammu-rabi (Hammu-rabi C)
    corpus: ane
    original: true
    tagger: Claude (model), reading the Sumerian
    read: ["ETCSL 2.8.2.3 1-14"]
    tags:
      - {motif: deity-chooses-shepherd-king-in-assembly, refs: ["ETCSL 2.8.2.3 4", "ETCSL 2.8.2.3 7"], note: "sipad šag4 še-ga 'shepherd agreeable to the heart' of Nunamnir, beloved of Ninlil; sipad zid {d}ḫa-am-mu-ra-bi"}
      - {motif: king-provides-temple-offerings-prayer, refs: ["ETCSL 2.8.2.3 5", "ETCSL 2.8.2.3 10"], note: "nidba gal-gal e2-kur-ra; daily for Nanna and Ningal"}
      - {motif: king-restores-purification-rites, refs: ["ETCSL 2.8.2.3 8", "ETCSL 2.8.2.3 11-12"], note: "šu-luḫ ĝiš-ḫur me ... ki-bi-še3 bi2-in-[gi4-gi4] 'restored to their place' in E-kiš-nu-ĝal of Urim"}
    hints:
      - "The king restoring the purification rites of the moon-god's temple compares Hezekiah's and Josiah's restorations of the cult (2Chr 29:3-36; 2Kgs 23:21-23)."
  - id: ane-etcsl-2-8-2-4-hammurabi-d
    tradition: ane-sumerian
    title: A prayer for Hammu-rabi (Hammu-rabi D)
    corpus: ane
    original: true
    tagger: Claude (model), reading the Sumerian
    read: ["ETCSL 2.8.2.4 1-37"]
    tags:
      - {motif: god-gives-king-crown-sceptre-crook, refs: ["ETCSL 2.8.2.4 4"], note: "šum2-mu-da-ab-ze2-en {ĝiš}ĝidru 'give him the sceptre!' (plural imperative to the gods)"}
      - {motif: god-petitions-divine-assembly-for-king, refs: ["ETCSL 2.8.2.4 10-13"], note: "Marduk to the great gods: sipad šag4-ga-zu ... nam-a-ni gal-le-eš tar-re-en-ze2-en ka kug-za"}
      - {motif: deity-chooses-shepherd-king-in-assembly, refs: ["ETCSL 2.8.2.4 8-10", "ETCSL 2.8.2.4 35"], note: "An, Enlil and Enki with the great gods; they magnify Hammu-rabi 'their benign shepherd'"}
      - {motif: king-of-the-four-quarters, refs: ["ETCSL 2.8.2.4 14", "ETCSL 2.8.2.4 6"], note: "lugal-ra im-mi-in-sa4-en-de3-en ub-ta 4-ba 'we name him king in the four quarters'"}
      - {motif: king-called-humble-before-gods, refs: ["ETCSL 2.8.2.4 15"], note: "nun me-te diĝir-re-e-ne sun5-na"}
      - {motif: black-headed-people, refs: ["ETCSL 2.8.2.4 16", "ETCSL 2.8.2.4 35"], note: "nam-barag saĝ gig2 'authority over the black-headed'"}
      - {motif: king-roars-like-storm-god-mouth-like-fire, refs: ["ETCSL 2.8.2.4 20-21"], note: "za-pa-aĝ2-zu {d}iškur ... ka-zu gira2 ḫuš-a; lugal gaba-ri [nu-tuku] 'king without rival'"}
      - {motif: gods-escort-king-on-road, refs: ["ETCSL 2.8.2.4 22-23"], note: "šul {d}utu a2-taḫ-zu ḫe2-a ... du-ri2-še3 zag zid-da ĝen-na-zu: Utu your helper, going always at your right side"}
      - {motif: holy-city-inviolable, refs: ["ETCSL 2.8.2.4 5", "ETCSL 2.8.2.4 29-30"], note: "interpretive: Babylon (kan4-diĝir-ra) 'city of lordship', 'pure dwelling', 'great dais'; its exaltation, not its inviolability, is explicit"}
