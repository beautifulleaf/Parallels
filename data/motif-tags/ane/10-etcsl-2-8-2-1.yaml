    read: ["ETCSL 2.8.3.3 1-40"]
    tags:
      - {motif: hymn-repeats-each-stanza-with-name, refs: ["ETCSL 2.8.3.3 1-4"], note: "en-e ... / sa-am-su-i-lu-na ... repeated with ki-tuš nam-lugal-zu ḫa-ba-gen6-ne2"}
      - {motif: god-gives-king-crown-sceptre-crook, refs: ["ETCSL 2.8.3.3 5", "ETCSL 2.8.3.3 18-19"], note: "šibir nam-en-na; aga 'headdress'; {ĝiš}ĝidru"}
      - {motif: royal-awe-worn-as-garment, refs: ["ETCSL 2.8.3.3 11", "ETCSL 2.8.3.3 13"], note: "ni2 gal nam-lugal-la-ka tug2-ba13-gin7 ḫe2-en6-mur10 'cloaked as with a mantle in the great awe of kingship'"}
      - {motif: king-rises-like-sun-over-land, refs: ["ETCSL 2.8.3.3 14", "ETCSL 2.8.3.3 18", "ETCSL 2.8.3.3 25"]}
      - {motif: king-appears-like-moon-over-land, refs: ["ETCSL 2.8.3.3 16", "ETCSL 2.8.3.3 23"], note: "{d}nanna-gin7 kalam-še3 e3-a-zu-ne; ma2-gur8 an-na-gin7 zalag-ga-zu-še3 giri17 šu ḫa-ra-ab-ĝal2-le: the people make the nose-gesture of prayer to the king"}
      - {motif: god-prays-for-king, refs: ["ETCSL 2.8.3.3 17"], note: "nun gal {d}en-ki-ke4 šag4 gu2-bi gi4-a-na šudu3 ḫu-mu-ri-ib2-ša4"}
      - {motif: king-leads-people-as-mother-and-father, refs: ["ETCSL 2.8.3.3 21", "ETCSL 2.8.3.3 26"], note: "šibir-zu ki-en-gi ki-uri ... ama a-a-bi-gin7; ama a-a ugu-bi-gin7 igi-bi"}
      - {motif: king-as-protective-shade, refs: ["ETCSL 2.8.3.3 29-30"], note: "uĝ3 saĝ gig2-ga ... ĝissu-zu-uš ni2 [...-te-en-te-en] 'cool themselves in your shade'"}
      - {motif: king-feeds-and-waters-people, refs: ["ETCSL 2.8.3.3 27-28"], note: "u2-gu7 daĝal-la-zu 'your broad pasturing'; a naĝ ḫe2-ĝal2-la-zu 'your abundant giving of drink'"}
      - {motif: king-addressed-as-god-of-his-land, refs: ["ETCSL 2.8.3.3 24"], note: "kur ni2-ba tuš-a diĝir-bi [ḫe2-me-en] 'may you be the god of the lands'; restored verb"}
    hints:
      - "Lam 4:20 'the breath of our nostrils, the anointed of YHWH, ... in his shade we shall live among the nations'; Isa 32:1-2 (a king as shade of a great rock); Ps 72:5 (fear him as long as sun and moon); Isa 9:5 'Everlasting Father'; Num 11:12 (Moses: did I conceive this people, that you say carry them like a nurse?)."
