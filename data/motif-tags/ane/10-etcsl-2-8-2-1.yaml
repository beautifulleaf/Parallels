      - {motif: penitent-feels-gods-punishment-in-body, refs: ["ETCSL 4.07.3 250-251"], note: "šer7-da gu-la-zu su-ĝu10 ba-e-zu-zu / a-nir niĝ2 gig-ga igi ma-lib 'bitter lament keeps me sleepless'"}
      - {motif: gracious-merciful-slow-to-anger-formula, refs: ["ETCSL 4.07.3 245", "ETCSL 4.07.3 252"], note: "arḫuš šag4-ne-ša4 igi bar-bar šag4 gur-ru giri17 šu ĝal2 za-a-kam 'mercy, compassion, care, relenting and homage are yours'"}
      - {motif: throne-and-bed-speak-to-returning-god, refs: ["ETCSL 4.07.3 258-262"], note: "an gal ... muš3-am3-zu ḫe2-eb-be2 'may An say: enough!'; ki-tuš ... tuš-a ḫu-mu-ra-ab-be2 / ki-nu2 kug-ga-zu ni2 dub2-bu ḫu-mu-ra-ab-be2"}
      - {motif: refrain-who-is-like-you-o-king, refs: ["ETCSL 4.07.3 256-257"], note: "za-e nam-diĝir-zu a-ba e-da-sa2"}
      - {motif: closing-doxology-praise-is-sweet, refs: ["ETCSL 4.07.3 274"], note: "ki-sikil {d}inana za3-mi2-zu dug3-ga-am3"}
