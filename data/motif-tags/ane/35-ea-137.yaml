      - {motif: egyptians-once-feared-now-scorned, refs: ["EA 109 r:44-49"], note: "pānānu dagālima awīl māt Miṣri u innabtū šarrū māt Kinaḫni ištu pānišu u annû mārū Abdi-Aširta tidaggalūna awīlī māt Miṣri kīma kalbī, 'formerly, on seeing a man of Egypt the kings of Canaan fled before him; now the sons of Abdi-Ashirta regard the men of Egypt like dogs'"}
      - {motif: better-to-die, refs: ["EA 109 r:49-55"], note: "damiq mūtu ana yâši lā išmu lumna ana bēlīya, 'death is good for me, (but) I do not listen to evil against my lord'; balāṭ napištī kali ilānu u Bēlet-ša-Gubla"}
