      - {motif: vassal-begs-grain-in-famine, refs: ["EA 085 o:8-11", "EA 085 o:16-19", "EA 085 o:33-38"], note: "3-tān izziz eliya šanāti ... yānu šeʾu ana akāli ... yuwaššira šeʾa ina libbi eleppāti u yuballiṭ wardašu, 'three years he has stood against me ... no grain to eat ... let him send grain in ships and keep his servant alive'"}
      - {motif: children-sold-into-debt-slavery, refs: ["EA 085 o:12-15"], note: "same wording as EA 081: sons, daughters, house-timbers given in Yarimmuta ina balāṭ napištinu"}
      - {motif: peasants-starve-and-desert, refs: ["EA 085 o:11-12"], note: "mīna aqabbûna ana awīlī ḫupšīya, 'what shall I say to my ḫupšu-men?'"}
      - {motif: enemy-called-slave-and-dog, refs: ["EA 085 r:63-64"], note: "miyami Abdi-Aširta ardu kalbu, 'who is Abdi-Ashirta, the slave, the dog?'"}
      - {motif: habiru-sa-gaz, refs: ["EA 085 b.e:41-43", "EA 085 r:72-73", "EA 085 r:77-78"], note: "innepšat mātāti ana GAZ.MEŠ"}
      - {motif: invader-turns-back-for-lack-of-water, refs: ["EA 085 r:51-55"], note: "šar māt Mittana aṣi adi Ṣumura ... yānu mû ana šatêšu u tāra ana mātišu, 'the king of Mittani came out to Sumur ... there was no water for him to drink and he went back to his land'"}
      - {motif: vassal-pleads-for-archers, refs: ["EA 085 o:19-22", "EA 085 r:79-t.e:83"], note: "400 men and 30 pairs of horses, as were given to Surata"}
      - {motif: city-goddess-gives-power-to-overlord, refs: ["EA 085 l.e:84-87"], note: "Ummaḫnu amat Bēlet-ša-Gubla and her husband Milkuru: a devotee ('maid') of the Lady of Byblos; liblut šarru"}
    hints:
      - "Famine, children pledged and selling of houses: compare Neh 5:2-5 and Gen 47:13-25. An army turning back for lack of water: 2 Kgs 3:9."
      - "'Who is X, the slave, the dog?': compare 1 Sam 25:10 ('who is David? ... many slaves break away') and 2 Sam 16:9 ('this dead dog')."
