  # ---------------- Catalogue of Texts and Authors ----------------
  - id: ane-catauth-na-catalogue
    tradition: ane-akkadian
    title: "Catalogue of Texts and Authors: works from the mouth of Ea, revealed to Adapa, by sages, kings and scholars (Neo-Assyrian)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    version: Neo-Assyrian
    read: ["CatAuth NA –:1-e+7"]
    tags:
      - {motif: texts-attributed-to-god-ea, refs: ["CatAuth NA –:1-4"], note: "[āšipūt]u kalûtu Enūma Anu Enlil, Alandimmû, Šumma izbu, Sakikkû, Lugal-e, An-gim: [annûtu] ša pī e[a], 'these are from the mouth of Ea'"}
      - {motif: text-revealed-to-author-who-proclaimed-it, refs: ["CatAuth NA –:5-6", "CatAuth NA –:b+1-b+2"], note: "[annûtu ša] uʾana-adapa [ušabrīšū-m]a idbubu; Erra: [annû ša kabti-ilī-marduk] ušabrīšū-ma idbubu, 'what was revealed to him and he proclaimed'"}
      - {motif: works-attributed-to-named-authors, refs: ["CatAuth NA –:b+5", "CatAuth NA –:d+5", "CatAuth NA –:d+16-d+20"], note: "king Enmerkar; the Theodicy by Esagil-kina-ubbib; iškār gilgāmeš ša pī sîn-lēqi-unnīni āšipi; iškār etana ša pī lu-nanna apkalli; Fox, Sidu, Poplar series"}
      - {motif: writing-from-before-the-flood, refs: ["CatAuth NA –:d+21-d+22"], note: "[... š]a lām abūbi ... [ad]apa ina pîšu išṭuru: 'from before the flood ... which Adapa wrote at his dictation'"}
      - {motif: text-dictated-by-animal, refs: ["CatAuth NA –:d+23", "CatAuth NA –:d+26"], note: "ana pī sisî išṭur, 'wrote at the dictation of a horse'; [ana pī arē]bi, 'of a raven' (restored)"}
