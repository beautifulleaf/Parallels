      - {motif: avoid-company-of-gossip-and-idler, refs: ["CounsWis SB –:22-26", "CounsWis SB –:31"], note: "itti ēpiš namūti ē tuštāmi ... ana rīqi lā bābil šipri ... uruhka tezzib"}
      - {motif: guard-your-speech, refs: ["CounsWis SB –:27-30"], note: "lū saniq pīka lū naṣir atmûka"}
      - {motif: avoid-other-peoples-disputes, refs: ["CounsWis SB –:32-41"], note: "ana šībūtīšunu taššakkan-ma ana lā dīnīka ubbalūka; ṣāltum-ma šuttatu šeṭītu, 'a dispute is a covered pit'"}
      - {motif: repay-evil-with-good, refs: ["CounsWis SB –:42-46"], note: "ana ēpiš lemuttīka damiqta rībšu ana raggīka mīšara killaššu ana zêrīka kabattaka limmiršu"}
      - {motif: revenge-belongs-to-ninurta, refs: ["CounsWis SB –:49-50"], note: "[a]na marušti turru ikkib ninurta: 'returning evil (for evil) is abhorrent to Ninurta'; lumna kaṣāru ikkib marduk"}
      - {motif: abomination-to-a-named-god, refs: ["CounsWis SB –:48-50"], note: "ikkib marduk ... ikkib ninurta"}
    hints:
      - "Compare Prov 1:8; 6:20 and Exod 20:12 (honour father and mother)."
      - "Compare Prov 23:20-21, 29-35 (drunkards come to poverty) and Prov 20:19 (do not associate with a gossip)."
      - "Compare Prov 26:17 (meddling in another's quarrel) and Prov 25:8."
      - "Compare Prov 25:21-22; 24:29; Exod 23:4-5 and Q 41:34, Q 23:96, Q 13:22 (repel evil with what is better)."
  - id: ane-counswis-sb-charity-and-women
    tradition: ane-akkadian
    title: "Pity the weak, feed the hungry; no slave girl over the house, no prostitute for a wife (Counsels of Wisdom A+1-A+31)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    version: Standard Babylonian
    read: ["CounsWis SB –:A+1-A+31"]
    tags:
      - {motif: pity-the-weak-feed-the-hungry, refs: ["CounsWis SB –:A+7-A+16"], note: "ana enši dunnamê rišīšu rēma ... ul ṭāb eli šamaš irâbšu lumna ... šūkil akala šiqi kurunna ... ṭāb eli šamaš irâbšu dumqa"}
      - {motif: slave-girl-must-not-rule-house, refs: ["CounsWis SB –:A+17-A+22"], note: "amta ina bīti ē tukabbit [kīm]a aššatim-ma lā ibēl uruhka ... bīta amtum-ma ibêl isappuh"}
      - {motif: do-not-marry-prostitute, refs: ["CounsWis SB –:A+23-A+31"], note: "ē tāhuz harimta ša šār mutūša ištarīta ša ana ili zakrat kulmašīta ...: 'she will not support you in your trouble ... her ears are attuned to another's footfall'"}
      - {motif: harlot-for-a-loaf-adulteress-hunts-life, refs: ["CounsWis SB –:A+26-A+31"], note: "loose fit: the prostitute-wife ruins the household and listens for other men"}
    hints:
      - "Compare Prov 30:21-23 (the earth trembles under a slave who becomes king and a maidservant who supplants her mistress)."
      - "Compare Lev 21:7, 14 (priests may not marry a harlot) and Prov 5:3-10; 7:10-27."
      - "Compare Isa 58:7, Prov 14:31; 19:17 (who is kind to the poor lends to YHWH) and Q 76:8-9, Q 90:14-16."
  - id: ane-counswis-sb-steward-and-office
    tradition: ane-akkadian
    title: "The prince's steward must not covet his treasure; conduct in office (Counsels of Wisdom A+32-A+62)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    version: Standard Babylonian
    read: ["CounsWis SB –:A+32-A+62"]
    tags:
      - {motif: steward-must-not-covet-masters-treasure, refs: ["CounsWis SB –:A+32-A+42"], note: "naṣram-ma kunukkašu lū allāta ... makkūra lā nība qerebšu tutta ana mimma šuāti īnka ē tašši ... u puzru ša tēpušu ippette"}
      - {motif: covet-prohibition, refs: ["CounsWis SB –:A+37-A+38"], note: "īnka ē tašši, 'do not lift your eye (covet)'"}
      - {motif: pride-before-fall, refs: ["CounsWis SB –:A+45"], note: "nīš pāni qalāl qaqqadi: 'lifting the face (brings) lightness of the head', i.e. reach too high, fall low"}
      - {motif: repay-evil-with-good, refs: ["CounsWis SB –:A+54-A+56"], note: "ana bēl ṣāltīka ē tulammin, even when you have power to raise or lower"}
    hints:
      - "Compare Gen 39:8-9 (Joseph, given all his master's house, refuses to take what is withheld) and Luke 16:1-12."
      - "Compare Prov 16:18 (pride before destruction) and Prov 18:16 (a man's gift makes room for him)."
  - id: ane-counswis-sb-speech-and-piety
    tradition: ane-akkadian
    title: "Read from the tablet: no backbiting, daily worship, reverence begets favour, keep your word (Counsels of Wisdom A+63-A+105)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    version: Standard Babylonian
    read: ["CounsWis SB –:A+63-A+105"]
    tags:
      - {motif: slander-as-eating, refs: ["CounsWis SB –:A+70-A+73"], note: "ē tākul karṣa, 'do not eat (someone's) pieces' = slander; the backbiter must settle accounts with Šamaš (ina ribbāti ša šamaš uqaʾʾû rēssu)"}
      - {motif: guard-your-speech, refs: ["CounsWis SB –:A+74-A+77"], note: "ē tumaṣṣi pīka uṣur šaptīka inimmê kabtatīka ēdiš ē taqbi ... surriš tātamû tarašši arkāniš"}
      - {motif: fear-of-god-begets-good-fortune, refs: ["CounsWis SB –:A+78-A+91"], note: "ūmišam-ma ilka kitrab ... palāhu damāqa ullad niqû balāṭa uttar u teslītu arna ipaṭṭar: 'reverence begets favour, sacrifice prolongs life, prayer absolves guilt'; pālih anunnakkī urrak ūmī"}
      - {motif: grain-offered-returns-a-talent, refs: ["CounsWis SB –:A+82-A+84"], note: "suppû sullû labān appi uṭṭat tanaddiššum-ma iribka bilat"}
      - {motif: wisdom-prolongs-life, refs: ["CounsWis SB –:A+87", "CounsWis SB –:A+91"]}
      - {motif: keep-your-promise, refs: ["CounsWis SB –:A+94-A+97", "CounsWis SB –:A+102-A+103"], note: "šumma taqtabī-ma idin ē tēni ... qabû enû tukkulu nadû ... lā nadānu ikkib mard[uk]"}
      - {motif: abomination-to-a-named-god, refs: ["CounsWis SB –:A+103"]}
      - {motif: wise-father-instructs-son, refs: ["CounsWis SB –:A+63", "CounsWis SB –:A+85", "CounsWis SB –:A+98", "CounsWis SB –:A+104-A+105"], note: "refrain ina ihzīkā-ma amur ina tuppi, 'from what you have learned, read in the tablet'; closing names [Išme-k]arāb son of Enlil-banda, praying for Ea's blessing"}
    hints:
      - "Compare Prov 3:9-10 (honour YHWH with your wealth and your barns will be filled) and Prov 10:27; 3:1-2 (fear of YHWH prolongs days)."
      - "Compare Num 30:3, Deut 23:22-24 and Eccl 5:3-4 (pay what you vow) and Q 17:34, Q 5:1 (fulfil covenants)."
      - "Compare Prov 13:3; 21:23 (who guards his mouth keeps his life) and Q 49:12 (backbiting as eating a brother's flesh)."
