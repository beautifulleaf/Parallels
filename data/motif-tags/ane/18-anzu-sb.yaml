# Full read of the ANE corpus, chunk 18: Anzu SB - CounsWis SB (Anzû SB; Atra-hasis OB, MB, SB; Bit meseri SB; Catalogue of Texts and Authors NA, NB; Counsels of Wisdom SB).
# Read from the eBL reconstructed Akkadian texts; eBL's English translations used as reading aids.
new_motifs:
  epic-opens-i-will-sing-the-hero: {label: "A poem opens with the singer's vow 'I will sing / praise the mighty one' followed by the hero's titles", cluster: hymn}
  warrior-god-also-irrigator: {label: "The warrior god is also the one who waters fields, gardens and towns (a fertility role beside his battle role)", cluster: divine-warrior}
  monster-born-of-earth-in-mountain: {label: "A monster is conceived by the earth itself and born among the rocks of a far mountain", cluster: combat-myth}
  monster-appointed-guardian-of-sanctuary-door: {label: "A monstrous creature is appointed by the high god to stand guard at the entrance of his innermost sanctuary", cluster: combat-myth}
  usurper-boasts-i-will-take-the-throne: {label: "A rebel resolves in his heart, in a string of first-person 'I will' boasts, to seize the throne and command all the gods", cluster: combat-myth}
  theft-of-power-while-god-bathes: {label: "The rebel seizes the token of supreme power while the high god is bathing, undressed, with his crown laid on the throne", cluster: combat-myth}
  sanctuary-loses-its-radiance: {label: "When the token of rule is stolen, deathly silence falls and the sanctuary is stripped of its divine radiance", cluster: combat-myth}
  high-god-asks-who-will-fight-the-monster: {label: "In the divine assembly the high god asks which of the gods will go and slay the monster, promising him the greatest name", cluster: combat-myth}
  champions-refuse-one-after-another: {label: "Several gods are summoned in turn to fight the monster; each repeats why it is invincible and refuses to go", cluster: combat-myth}
  champion-promised-cult-and-name: {label: "The god who will fight is promised daises, shrines in the four world regions, entry for his shrines into the chief temple and the name 'Mighty One'", cluster: combat-myth}
  wise-god-devises-plan-when-gods-despair: {label: "When the assembly has given up, the wise god of the deep devises the plan that finds the champion", cluster: combat-myth}
  gods-kiss-feet-of-deliverer: {label: "The gods run to the deity who has solved their crisis and kiss his or her feet", cluster: divine-council}
  mother-goddess-renamed-mistress-of-all-gods: {label: "The gods tell the birth goddess: 'Formerly we called you Mami; now your name shall be Mistress of All the Gods'", cluster: divine-council}
  mother-goddess-bore-all-the-gods: {label: "The mother goddess claims to have borne all the Igigi and Anunna gods and to have assigned the high gods their kingship", cluster: theogony}
  mother-commissions-son-to-fight-monster: {label: "A goddess sends her beloved son out to fight the monster and gives him detailed battle instructions", cluster: combat-myth}
  monster-feathers-carried-as-glad-tidings: {label: "The slain monster bird's feathers are borne on the wind to the high god as the sign and good news of victory", cluster: combat-myth}
  combatants-exchange-challenge-who-are-you: {label: "Before the duel the monster challenges the hero 'Who are you that you come to fight me?' and the hero answers with his name and lineage", cluster: combat-myth}
  sun-darkened-during-divine-battle: {label: "When the divine combatants clash, darkness falls on the mountain and the sun goes into gloom", cluster: combat-myth}
  magic-word-sends-arrow-back-to-origins: {label: "The monster's spell turns the arrow back, ordering each part to its source: shaft to the thicket, bow-frame to the forest, string to the sheep's sinew, feathers to the birds", cluster: magic}
  talisman-makes-holder-invulnerable: {label: "Because he holds the stolen token of power, no weapon can reach the rebel's body", cluster: combat-myth}
  cut-wings-to-break-magic: {label: "The wise god advises wearing the bird-monster out and cutting off its pinions, so that seeing its feathers breaks its spell", cluster: combat-myth}
  victor-admitted-to-secret-of-gods: {label: "The victorious god is invited to stand among his brother gods and hear the secret knowledge (pirištu) of the gods", cluster: divine-council}
  slain-monster-flayed-skin-taken: {label: "After the kill the victor squeezes out the monster's lifeblood and flays it, taking its skin", cluster: combat-myth}
  victor-withholds-recovered-talisman: {label: "The victorious god hesitates or refuses to hand back the recovered token of power to the high god", cluster: combat-myth}
  warrior-son-subdues-enemies-at-fathers-feet: {label: "The warrior son is praised for making all enemies submit at the feet of his father the high god", cluster: divine-warrior}
  divine-bureaucracy-king-counsellor-prefect: {label: "The gods are ranked as an administration: the sky god is king, the storm god counsellor, the warrior god prefect, another god bailiff", cluster: divine-council}
  gods-dig-tigris-and-euphrates: {label: "Before humans exist the gods themselves dig the riverbeds of the Tigris and Euphrates and the land's canals", cluster: creation}
  rebel-workers-burn-their-tools: {label: "The labouring gods go on strike by setting fire to their spades and work baskets and marching on the chief god's house", cluster: creation}
  junior-gods-revolt-against-chief-god: {label: "The junior gods besiege the chief god's house at night to depose him, and he wakes in fear", cluster: divine-council}
  god-slain-to-create-humankind: {label: "One god, the ringleader 'who had the plan', is slaughtered in the assembly so that humankind can be made", cluster: creation}
  human-made-from-slain-gods-flesh-and-blood: {label: "Humankind is made of clay mixed with the flesh and blood of a slaughtered god, so that god and man are mixed together", cluster: creation}
  human-ghost-derives-from-slain-god: {label: "From the slain god's flesh a ghost (eṭemmu) remains in humans, and a heartbeat (drum) is heard in them forever, so that he is not forgotten", cluster: creation}
  gods-spit-on-clay-of-humankind: {label: "The great gods spit upon the clay from which humankind is to be formed", cluster: creation}
  purification-bath-on-first-seventh-fifteenth: {label: "A purification bath is instituted on the first, seventh and fifteenth days of the month", cluster: cult}
  fourteen-pieces-of-clay-seven-and-seven: {label: "The birth goddess nips off fourteen pieces of clay, sets seven on the right and seven on the left with a brick between them", cluster: creation}
  creator-boasts-my-hands-made-it: {label: "The creator declares 'I am the one who created, my hands have made it'", cluster: creation}
  birth-in-tenth-month: {label: "The first births come when the birth goddess counts the months and the tenth month arrives", cluster: creation}
  birth-brick-nine-days: {label: "In the house where a woman gives birth the birth brick is to lie in place for nine days in honour of the birth goddess", cluster: ritual}
  nine-days-wedding-rejoicing: {label: "When husband and wife choose each other and the marriage bed is laid, there is to be rejoicing for nine days and the love goddess is honoured", cluster: marriage}
  abandon-possessions-save-life: {label: "The flood hero is told: 'Destroy your house, build a boat; spurn property, save life'", cluster: flood}
  round-boat-coracle: {label: "The flood boat is to be built on a circular plan, its length equal to its breadth, like a giant coracle", cluster: flood}
  people-feast-unaware-before-flood: {label: "While those boarding eat and drink, the flood hero alone is heavy-hearted, knowing what is coming", cluster: flood}
  high-god-swears-total-annihilation: {label: "From his throne the high god takes an oath to annihilate (humankind) totally", cluster: flood}
  door-of-ark-sealed-after-boarding: {label: "Once the hero has entered the boat its door is sealed shut", cluster: flood}
  god-instructs-in-dream: {label: "A god appears to a man in a dream and gives him practical instructions, which he carries out", cluster: revelation}
  dove-returns-having-found-no-rest: {label: "A dove released from the boat flies off and returns because she has exhausted her wings and found no place", cluster: flood}
  personal-god-at-right-goddess-at-left: {label: "Prayer: 'May my god stand at my right, my goddess at my left, a caring god be constantly at my side'", cluster: prayer}
  let-me-live-that-i-may-praise: {label: "The supplicant asks to live and be well so that he may praise the god's divinity", cluster: prayer}
  catalogue-of-demons-to-be-expelled: {label: "An exorcism lists by name every demon, ghost and disease it drives away (utukku, šēdu, rābiṣu, ghost, lilû, lilītu, Lamaštu ...)", cluster: magic}
  three-heavens: {label: "Heaven is threefold: the heaven of Anu, the heaven of Enlil and the heaven of Ea", cluster: cosmology}
  night-watches-invoked-as-gods: {label: "The watches of the night and named stars (Pleiades, Yoke, Orion) are called upon as divine helpers in a night ritual", cluster: magic}
  god-knows-what-supplicant-does-not: {label: "Prayer: 'those whom you know but I do not know, whose street and lair you know but I do not'", cluster: prayer}
  supplicant-seizes-hem-of-gods-garment: {label: "The supplicant says 'today I have seized the hem of your garment' as a gesture of appeal and attachment", cluster: prayer}
  gods-stationed-at-each-part-of-house: {label: "Gods are posted one by one at each part of the house (bedroom, courtyard, window, gate, threshold, back) to guard it", cluster: magic}
  scapegoat-carries-off-evil-from-house: {label: "A scapegoat 'whose face is evil' is carried through each room of the house to take away its evil", cluster: ritual}
  apotropaic-figurines-guard-house: {label: "Figurines and wall drawings of protective gods, twins, fighters and monsters are set at the bed, doors and gate to keep evil out of a patient's house", cluster: magic}
  exorcist-embodies-the-god: {label: "The exorcist declares: 'the incantation is the spell of Marduk, the exorcist is the image of Marduk'", cluster: magic}
  seven-antediluvian-sages-fish-men: {label: "Seven primeval sages (apkallū), carps of the sea who grew up in the river, keep the ordinances of heaven and earth in order", cluster: primeval}
  antediluvian-sage-ascended-to-heaven: {label: "One of the primeval sages 'ascended to heaven' (or another descended from heaven)", cluster: primeval}
  sage-offends-gods-and-is-punished: {label: "Post-flood sages offend the gods (bringing a goddess down from heaven, enraging the storm god, hanging a seal on a goat-fish, releasing a dragon) and suffer for it", cluster: primeval}
  sage-angers-storm-god-no-rain-three-years: {label: "A sage enrages the storm god so that there is no rain or green growth in the land for three years", cluster: primeval}
  sages-of-human-descent: {label: "After the fish-sages come sages 'of human descent' to whom the wise god gives great wisdom; one is 'two-thirds sage'", cluster: primeval}
  maker-creates-and-unmakes: {label: "Formula: 'Ea created you, Ea unmade you' (the maker undoes what he made)", cluster: magic}
  clay-figurines-declared-godlike: {label: "The ritualist makes figures of a man and a woman from the clay of Ea and tells them 'I have made you beautiful, you are like gods'", cluster: magic}
  colored-dogs-guard-house: {label: "Dogs of four colours (white, black, red, brown-green) are drawn or invoked to guard the house, each with its own power", cluster: magic}
  goat-substitute-for-patient: {label: "A goat is tied at the sick man's head, slaughtered, and its hide spread over him as a substitute", cluster: ritual}
  litany-may-it-enter-with-you: {label: "Litany to a deity entering a house: 'with you may harmony, well-being, life, abundance, peace enter'", cluster: blessing}
  demon-stalks-by-night: {label: "A night demon (Šulak) is 'the one who stalks by night, whose touch is death'", cluster: magic}
  death-personified-driven-to-netherworld: {label: "Death himself is driven away, netted and led down to the queen of the netherworld and her gatekeeper", cluster: underworld}
  banished-from-light-and-river-of-life: {label: "Curse on the banished evil: let him not see the bright light of the upper world, nor drink from the river of the living, nor walk the street of the living", cluster: underworld}
  figurine-of-death: {label: "A figurine of Death himself (made of lead) is placed at the sick man's bed with provisions for his journey", cluster: magic}
  colophon-copied-and-collated: {label: "Colophon: 'written according to its original and collated'", cluster: scribal}
  texts-attributed-to-god-ea: {label: "The core scholarly corpora (exorcism, lamentation, celestial omens, physiognomy) are said to be 'from the mouth of Ea'", cluster: scribal}
  text-revealed-to-author-who-proclaimed-it: {label: "A literary work is 'what was revealed to' a named sage or poet and what he then proclaimed", cluster: revelation}
  works-attributed-to-named-authors: {label: "A catalogue assigns literary works to named authors: gods, antediluvian sages, kings and scholars", cluster: scribal}
  text-dictated-by-animal: {label: "A composition is said to have been written down at the dictation of an animal (a horse, a raven)", cluster: scribal}
  writing-from-before-the-flood: {label: "A text is said to come 'from before the flood', written down by a primeval sage", cluster: scribal}
  parents-are-household-gods: {label: "Advice to a son: father and mother are (like) the gods of the house; honour them and they will bless you", cluster: wisdom}
  strong-drink-impoverishes: {label: "Saying: the man who loves strong drink will quickly become a pauper and lose friends, god and protective spirit", cluster: wisdom}
  avoid-company-of-gossip-and-idler: {label: "Do not converse with the gossip or consult the idler, lest you adopt their thinking and leave your own path", cluster: wisdom}
  guard-your-speech: {label: "Advice: hold your tongue, watch what you say; words spoken on the spur of the moment stay with you", cluster: wisdom}
  avoid-other-peoples-disputes: {label: "Do not stand in a crowd or press forward at a dispute: you will be made a witness in a case not your own", cluster: wisdom}
  repay-evil-with-good: {label: "Requite with good the one who does evil to you; be just and cheerful to your enemy", cluster: wisdom}
  pity-the-weak-feed-the-hungry: {label: "Take pity on the weak and helpless, give food to eat and drink to drink: god is pleased and Šamaš repays with favour", cluster: wisdom}
  slave-girl-must-not-rule-house: {label: "Do not let a slave girl become important in your house and rule it like a wife", cluster: wisdom}
  do-not-marry-prostitute: {label: "Do not marry a prostitute, a woman dedicated to a goddess, or a temple woman: she will not support you in trouble", cluster: wisdom}
  steward-must-not-covet-masters-treasure: {label: "A trusted steward given his master's seal must not covet or secretly take from the treasure; the theft will come out", cluster: wisdom}
  keep-your-promise: {label: "If you have given your word, deliver and do not revoke it; promising and not delivering is abhorrent to the god", cluster: wisdom}
  grain-offered-returns-a-talent: {label: "For every grain you offer your god, your return will be a talent", cluster: wisdom}
units:
  # ---------------- Anzû (Standard Babylonian) ----------------
  - id: ane-anzu-sb-1-prologue
    tradition: ane-akkadian
    title: "Prologue: the singer praises Ninurta, firstborn of Enlil (Anzû SB I 1-14)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    version: Standard Babylonian
    read: ["Anzu SB I:1-14"]
    tags:
      - {motif: epic-opens-i-will-sing-the-hero, refs: ["Anzu SB I:2", "Anzu SB I:4", "Anzu SB I:9"], note: "gašra luzzammur ... gašra luttaʾʾid: 'the mighty one I will sing ... I will praise'; šimâ ša gašri tanitti dannūtīšu, 'hear the praise of the mighty one's strength'"}
      - {motif: god-is-firstborn-of-high-god, refs: ["Anzu SB I:2", "Anzu SB I:4"], note: "ila bukur ellil, 'divine firstborn of Enlil'; also narām māmi, beloved of the mother goddess (I:1, I:3)"}
      - {motif: catalogue-of-slain-monsters, refs: ["Anzu SB I:10-12"], note: "iksû šad abni (fettered the mountain of stones), kāšid mupparša anzâ (conquered soaring Anzu), nāʾir kusarikki ina qereb tâmti (slew the bull-man in the midst of the sea)"}
      - {motif: warrior-god-also-irrigator, refs: ["Anzu SB I:6"], note: "mušašqû tarbaṣi ermi ūri sūqi u āli: 'who waters paddock, garden, town, street and city'"}
    hints:
      - "Compare Exod 15:1-3 ('I will sing to YHWH ... YHWH is a man of war') and Judg 5:3."
      - "Compare Ps 74:13-14 and Isa 27:1 (God has slain the sea monster / Leviathan)."
  - id: ane-anzu-sb-1-anzu-born
    tradition: ane-akkadian
    title: "Before the daises: Anzu is born on Mount Sharshar and Ea proposes him as Enlil's doorkeeper (Anzû SB I 15-a+55)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    version: Standard Babylonian
    read: ["Anzu SB I:15-a+55"]
    tags:
      - {motif: pre-creation-no-rain-no-plants, refs: ["Anzu SB I:15-20"], note: "adīna ina igīgī lā ibbanû parakkū: 'until then no daises had been built among the Igigi'; Tigris and Euphrates had been made but [their springs] did not bring their waters to the land (ana māti lā ubbalū mê[šunu]); a 'when-not-yet' opening, partly restored"}
      - {motif: monster-born-of-earth-in-mountain, refs: ["Anzu SB I:25-28", "Anzu SB I:a+51-a+52"], note: "ina šaršar šadî elî ... ittaʾlad anzâ, 'on lofty Mount Sharshar ... she bore Anzu'; Ea: īrīšū-ma erṣetu šu[ddultu] ... ina kāpī šadî, 'the wide earth conceived him, he is born in the rocks of the mountain'; also pure waters of the gods of the apsû (a+49-a+50)"}
      - {motif: divine-council, refs: ["Anzu SB I:21-24", "Anzu SB I:a+41-a+48"], note: "the Igigi assemble before Enlil; Enlil deliberates with Ea (ninšīku), 'who was it bore him?'"}
      - {motif: monster-appointed-guardian-of-sanctuary-door, refs: ["Anzu SB I:a+54-a+55"], note: "liptarrik ina atmani šubat k[iṣṣi], 'let him always block the way into the shrine, the dwelling of the sanctuary'"}
      - {motif: deity-preceded-and-followed-by-storm-attendants, refs: ["Anzu SB I:a+35-a+40"], note: "south wind, powerful wind, flood wave, whirlwinds, the four winds converge and bear aloft his dwelling; fragmentary"}
    hints:
      - "Compare Gen 2:5-6 (no rain, no man to till; a spring rising from the earth)."
      - "Compare Gen 3:24 (cherubim posted to guard the way to the tree of life) and Ezek 28:14-16 (the guardian cherub)."
  - id: ane-anzu-sb-1-theft
    tradition: ane-akkadian
    title: "Anzu covets supremacy and steals the tablet of destinies while Enlil bathes (Anzû SB I b+56-b+87)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    version: Standard Babylonian
    read: ["Anzu SB I:b+56-b+87"]
    tags:
      - {motif: tablet-of-destinies, refs: ["Anzu SB I:b+64", "Anzu SB I:b+69", "Anzu SB I:b+77"], note: "tuppi šīmāti ša qātīšu: the tablet in Enlil's hand, with his crown (agê bēlūtīšu) and divine apparel"}
      - {motif: hero-plots-to-seize-world, refs: ["Anzu SB I:b+62-b+68"], note: "ukkuš ellilūti iṣṣabat ina libbīšu, 'he resolved in his heart to make off with Enlil-ship'; repeated after his gazing (ittaṭṭal) on the father of the gods"}
      - {motif: usurper-boasts-i-will-take-the-throne, refs: ["Anzu SB I:b+69-b+72"], note: "lulqē-ma ... luhmum ... lugmur-ma kussâ lubēl parṣī lumaʾʾir kullat igīgī: 'let me take ... I will appropriate ... I will have the throne, rule the divine offices, command all the Igigi'"}
      - {motif: ascent-above-stars-of-el, refs: ["Anzu SB I:b+69-b+72"], note: "interpretive: no ascent to heaven here, but a proud being plans in his heart to take the throne and rule the gods like the supreme god; cf. b+107 'his utterance has become like that of Duranki'"}
      - {motif: theft-of-power-while-god-bathes, refs: ["Anzu SB I:b+74-b+77"], note: "enūma ellil irammuku mê ellūti šahṭū-ma ina kussê agûšu šaknu: 'when Enlil was bathing in pure water, undressed, his crown placed on the throne'; Anzu waited at the sanctuary entrance for daybreak"}
      - {motif: monster-usurps-divine-kingship, refs: ["Anzu SB I:b+78-b+79"], note: "ellilūta ilteqe nadû [parṣū], 'he took Enlil-ship, the divine offices were cast down'; then flew off to his mountain"}
      - {motif: sanctuary-loses-its-radiance, refs: ["Anzu SB I:b+80-b+82"], note: "ittatbak šahurratu šakin q[ūlu] ... kiṣṣu ištahaṭ namurrassu: 'stillness poured out, silence set in ... the sanctuary was stripped of its radiance'; Enlil speechless"}
      - {motif: high-god-asks-who-will-fight-the-monster, refs: ["Anzu SB I:b+83-b+87"], note: "Anu: ilu ayyu anzâ linār-ma ina kullat dadmī lišarbi šumšu, 'which god will slay Anzu? let him make his name greatest in all the inhabited world'"}
    hints:
      - "Compare Isa 14:12-15 ('you said in your heart: I will ascend ... I will set my throne on high ... I will be like the Most High') and Ezek 28:2, 12-17."
      - "Compare Isa 6:8 ('Whom shall I send, and who will go for us?') and 1 Kgs 22:20."
      - "Compare Q 7:12-13 and Q 38:75-76 (Iblis' pride against God's order); the guardian who turns rebel."
  - id: ane-anzu-sb-1-gods-refuse
    tradition: ane-akkadian
    title: "Adad, Girra and Shara are offered the champion's reward and refuse in turn (Anzû SB I b+88-b+153)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    version: Standard Babylonian
    read: ["Anzu SB I:b+88-b+153"]
    tags:
      - {motif: champions-refuse-one-after-another, refs: ["Anzu SB I:b+100-b+110", "Anzu SB I:b+121-b+131", "Anzu SB I:b+142-b+152"], note: "each answers ana šad lā aʾāri lihīš mannu, 'who would rush to the inaccessible mountain?', and ipsil urha lā alāka iqbi, 'he turned away, he said he would not go'; Girra's turn wholly restored from the parallels"}
      - {motif: champion-promised-cult-and-name, refs: ["Anzu SB I:b+92-b+99", "Anzu SB I:b+134-b+141"], note: "libšû-ma libbanû parakkū ... ina kibrāt erbetti šitakkana māhāzīka ... māhāzūka līrubū ana ēkur ... gašru lū šumka: daises, shrines in the four world regions, shrines entering Ekur, the name 'Mighty One'"}
      - {motif: threefold-repeated-episode, refs: ["Anzu SB I:b+88-b+152"], note: "three summonses (Adad son of Anu, Girra son of Annunitum, Shara son of Ishtar) in identical words"}
      - {motif: monster-usurps-divine-kingship, refs: ["Anzu SB I:b+107-b+108"], note: "ittabši ṣīt pîšu kī il duranki iqbi ša irraru immi ṭiṭṭiš: 'his utterance has become like that of Duranki (Enlil); whom he curses turns to clay'"}
      - {motif: gods-fear-the-monster, refs: ["Anzu SB I:b+109", "Anzu SB I:b+153"], note: "ana ṣīt pîšu ilū išahhuhū, 'at his utterance the gods despaired'; the Igigi fume in turmoil"}
    hints:
      - "Compare 1 Sam 17:11, 24-25 (Israel afraid of Goliath; the king promises riches, his daughter and freedom to the man who kills him)."
      - "Compare Rev 5:2-4 (no one found worthy) for the motif of no one able, though outside HB/Quran."
  - id: ane-anzu-sb-1-ea-chooses-ninurta
    tradition: ane-akkadian
    title: "Ea finds the champion: Mami renamed Mistress of All the Gods and asked to give her son Ninurta (Anzû SB I b+154-c+201)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    version: Standard Babylonian
    read: ["Anzu SB I:b+154-c+201"]
    tags:
      - {motif: wise-god-devises-plan-when-gods-despair, refs: ["Anzu SB I:b+155-b+162"], note: "bēl uzni āšib apsî itpēšu ... ea uzna ibtani ina libbīšu: 'the lord of wisdom who dwells in the apsû ... Ea formed a plan in his heart': 'let me find the god and appoint Anzu's conqueror in the assembly'"}
      - {motif: gods-kiss-feet-of-deliverer, refs: ["Anzu SB I:b+164"], note: "ittarrū-ma igīgū unaššaqū šēpīšu: the Igigi rally and kiss Ea's feet"}
      - {motif: mother-goddess-renamed-mistress-of-all-gods, refs: ["Anzu SB I:b+177-b+178"], note: "pānā-ma mami ... eninni bēlet kul[lat ilī lū šumki]: 'formerly Mami, now Mistress of All the Gods be your name'; partly restored"}
      - {motif: name-change-by-god, refs: ["Anzu SB I:b+177-b+178"]}
