      - {motif: loyal-vassal-alone-among-defectors, refs: ["EA 138 o:25-31"], note: "yānu hazannu šarri kīma yâši ana šarri ša yamūtu eli bēlīya, 'there is no mayor like me, who would die for my lord'; I guard the city alone (ana ēdēnīya)"}
      - {motif: vassal-expelled-by-brother-at-city-gate, refs: ["EA 138 o:44-50", "EA 138 o:56-58"], note: "the city said 'leave him, let us join Aziru'; ahūya yitmi ana āli, 'my brother swore (an oath) to the city', and the lords of the city went over to the sons of Abdi-Ashirta; when I and Api came to the city they did not let me in"}
      - {motif: city-divided-between-rival-factions, refs: ["EA 138 r:71-73"], note: "anumma ālu mišilši rāʾim ana mārī ʿAbdi-Aširti u mišilši ana bēlīya, 'half the city loves the sons of Abdi-Ashirta and half my lord'"}
      - {motif: false-report-all-sons-dead, refs: ["EA 138 o:63-b.e:67", "EA 138 r:111-113"], note: "allû-mi mīt bēlnu ... mīt Rib-Addi, 'our lord is dead, Rib-Addi is dead': the city uses the rumour to go over to Aziru"}
      - {motif: what-is-your-servant-a-dog, refs: ["EA 138 r:95-97"], note: "inanna ana Biʾruta ašbāti kī kalbi lā tušmû awātī, 'now I sit in Beirut like a dog, and you do not hear my words'"}
      - {motif: canaanite-gloss-in-akkadian-letter, refs: ["EA 138 r:118-119", "EA 138 r:126"], note: "ul aqtabi kazbūta (kzbt, 'lies', Hebrew kāzāb); yapu hamudu (yph ḥmd, 'beautiful, precious', Hebrew yāpeh, ḥemed) for the king's gifts not given"}
      - {motif: vassal-messengers-detained-unanswered, refs: ["EA 138 r:77-81"], note: "I sent my son to the palace; for four months he has not seen the king's face (ul yimur pāni šarri)"}
