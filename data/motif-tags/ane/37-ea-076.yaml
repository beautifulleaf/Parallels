# Full read of the ANE corpus, chunk 37: Amarna letters EA 076 ... EA 091, then texts from Ugarit
# (Ras Shamra-Ougarit 07 ..., RS 17.0078), in the order of `aneread.py texts 37`.
# Read from ORACC lemmatized transliterations (aemw/amarna, aemw/ugarit): lemma glosses only, no translation.
new_motifs:
  enemy-ruler-called-a-dog: {label: "A vassal abuses a rival or rebel ruler (or his sons) as 'the dog'", cluster: kingship}
  who-is-he-upstart-rhetorical: {label: "Rhetorical 'Who is he?' scorning an upstart who acts like a great king (is he the king of Mittani or of the Kassites?)", cluster: kingship}
  kings-troops-go-out-yearly: {label: "Formerly the overlord's troops (archers) went out every year to inspect and secure the vassal lands", cluster: war}
  vassal-longs-to-see-kings-face: {label: "A vassal says what he seeks is to see the good face of the overlord king, and asks leave to come before him", cluster: kingship}
  hittite-king-encamped-threatens-vassal: {label: "The king of Hatti is encamped nearby and the vassal fears he will march into the overlord's land", cluster: war}
  vassal-asks-king-not-to-heed-slanderers: {label: "A vassal begs the overlord not to listen to false men who slander him (eat his 'pieces') before the king", cluster: kingship}
  vassal-ready-to-go-before-kings-troops: {label: "Ordered to prepare for the king's archers, the vassal answers that he with his troops and chariots will go before the king's army wherever it goes", cluster: war}
  vassal-footstool-of-kings-feet: {label: "A vassal calls himself the footstool of the overlord king's feet", cluster: kingship}
  king-like-storm-god-and-sun-in-heaven: {label: "The overlord king is likened to the storm god (Baal) and the sun in heaven", cluster: kingship}
  serve-the-king-and-live: {label: "The overlord tells a vassal: serve the king your lord and you will live; plot falsehood and you will die with all your family", cluster: kingship}
  vassal-summoned-to-court-or-send-son: {label: "The overlord summons a delaying vassal to come before him this year, or else to send his son in his place", cluster: kingship}
  covenant-meal-with-kings-enemy: {label: "A vassal is charged with making peace with the king's enemy, eating bread and drinking beer with him", cluster: treaty}
  vassal-expelled-by-brother-at-city-gate: {label: "A ruler is thrown out of his own city at the gate by his brother and seeks restoration from a neighbouring power", cluster: kingship}
  wise-official-loved-by-all: {label: "An official is praised as a wise man whom all men love, and is asked for as the king's representative", cluster: kingship}
  vassal-escorts-kings-caravans: {label: "A vassal undertakes to escort and guard the overlord's caravans through his land to foreign kingdoms", cluster: kingship}
  canaanite-gloss-in-akkadian-letter: {label: "A Canaanite (West Semitic) word, often marked with a gloss wedge, stands in or beside the Akkadian of a letter, giving the local word known from Hebrew", cluster: scribal}
  vassal-guards-city-while-alive: {label: "A vassal says that while he lives he guards the king's city, but if he dies no one will", cluster: kingship}
  city-divided-between-rival-factions: {label: "A city is divided, half of it loving the rebel party and half the rightful lord", cluster: kingship}
  neighbour-kings-refuse-aid: {label: "Neighbouring kings ordered by the overlord to help a besieged vassal do not come or even send to ask after his welfare", cluster: war}
  vassal-messengers-detained-unanswered: {label: "A vassal complains that his letters and messengers go to the palace but no answer or troops come back", cluster: kingship}
  ransomed-slave-returned-to-master: {label: "A slave redeemed (released for silver) from foreigners is sent back to his master, with a plea that no bad word come between the two rulers", cluster: law}
  brotherly-greeting-gift-requested: {label: "A letter says all is well here and asks the 'brother' to send back news of his welfare and whatever greeting-gift (šulmānu) he can", cluster: diplomacy}
  no-greeting-gift-to-house-of-enemy: {label: "Gifts go between brothers and friends; a man does not send a greeting-gift into the house of his enemy ('am I your enemy?')", cluster: diplomacy}
  urgent-life-and-death-formula: {label: "A letter presses its request with the formula 'it is death and life' (mūtu napšatu): a matter of life and death", cluster: diplomacy}
  prostration-from-afar: {label: "A writer says he falls at the feet of his addressees 'from afar'", cluster: kingship}
  scribal-gods-invoked-in-greeting: {label: "A scribe's letter invokes the scribal gods (Ea the honoured lord, Nabû lord of the stylus and tablet, the gods of the tablet-house) to guard or honour the addressee", cluster: scribal}
  set-good-eyes-on-protege: {label: "A letter asks that the king's (or the addressee's) eyes look favourably on a person, and that he be helped", cluster: diplomacy}
  messenger-not-sent-empty-handed: {label: "A writer will not send his messenger back empty-handed and asks for goods to be sent with him", cluster: diplomacy}
  enemy-sends-tablets-of-war-and-peace: {label: "An enemy king's messenger carries two tablets of hostility and one of peace, showing whichever suits the situation", cluster: diplomacy}
  king-refuses-to-touch-oath-tablet-before-sun: {label: "Challenged to touch a tablet of oath before the sun god to prove his peaceful intent, a king refuses", cluster: treaty}
  hand-raised-to-sun-god-in-oath: {label: "A king lifts his hand before the sun god and calls him to know (witness) the truth of his words", cluster: treaty}
  herald-orders-camp-to-arm: {label: "A herald cries to the camp: put on your coats of mail and mount your chariots, the enemy king is drawn up and coming", cluster: war}
  allies-ask-why-brothers-are-enemies: {label: "A king asks why we, who are brothers, are enemies to one another", cluster: diplomacy}
  servant-offers-himself-as-substitute-for-lord: {label: "A servant greets his lord with the wish 'may I go as a substitute (dinānu) for my lord', taking any evil on himself", cluster: kingship}
  disputants-sent-to-be-judged-truly: {label: "A ruler sends disputing parties before his correspondent and asks him to judge their case in truth", cluster: law}
  towns-swear-oath-together: {label: "The men of two towns make an oath (māmītu) with each other", cluster: treaty}
  oath-cast-behind-back: {label: "A writer reproaches his addressee: the oath I made you swear before the gods you have thrown behind you", cluster: treaty}
  vassal-alone-in-his-loyalty-none-speaks-for-him: {label: "A vassal complains that no one speaks for his loyalty before the king; he alone is the king's true servant", cluster: kingship}
units:
  - id: ane-ea-076-rib-addi-habiru
    tradition: ane-akkadian
    title: "Rib-Addi of Byblos: Abdi-Ashirta the dog is taking the king's cities, the Habiru gathered against Shigata and Ambi; send 400 men and 30 pairs of horses (EA 076)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    read: ["EA 076"]
    tags:
      - {motif: city-goddess-gives-power-to-overlord, refs: ["EA 076 o:1-4"], note: "šar mātāti šarru rabû šar tamhāri Bēlet-ša-Gubla tiddin dunna, 'king of the lands, great king, king of battle: may the Lady of Byblos give power'"}
      - {motif: sevenfold-prostration, refs: ["EA 076 o:5-6"], note: "7-šu 7-ān amqut, 'seven times, seven times I fall'"}
      - {motif: enemy-ruler-called-a-dog, refs: ["EA 076 o:11-13"], note: "mīnu šūt ʿAbdi-Aširta kalbu, 'what is he, Abdi-Ashirta, the dog, that he seeks to take all the cities of the king?'"}
      - {motif: who-is-he-upstart-rhetorical, refs: ["EA 076 o:13-16"], note: "šar māt Mittana u šar māt Kaššê šūt, 'is he the king of Mittani or the king of the Kassites, that he seeks to take the land of the king?'"}
      - {motif: habiru-sa-gaz, refs: ["EA 076 o:17-20", "EA 076 r:37"], note: "puhhir kali LU₂.MEŠ GAZ eli Šigata u Ambi, 'he has gathered all the Habiru against Shigata and Ambi'"}
      - {motif: vassal-pleads-for-archers, refs: ["EA 076 o:24-b.e:26", "EA 076 r:37-42"], note: "4 hundred men of the garrison and 30 pairs of horses; uššira ṣāb piṭṭāti rabâ u tudappir ayyābī šarri"}
      - {motif: kings-troops-go-out-yearly, refs: ["EA 076 r:30-33"], note: "ul kīma pānānu ... šanāti tuṣṣâ ṣāb piṭṭāti ana dagāl mātāti, 'not as before, when every year the archers came out to inspect the lands'"}
      - {motif: loyal-vassal-alone-among-defectors, refs: ["EA 076 o:21-23", "EA 076 r:34-36"], note: "there is no strong place to enter; the land of the king and Ṣumur 'your garrison city' have gone over (innepšat) to the Habiru"}
    hints:
      - "'Is he the king of Mittani?' scorn: compare 1 Sam 25:10 ('Who is David? who is the son of Jesse?') and Exod 5:2 ('Who is YHWH?')."
      - "Enemy called a dog: compare 1 Sam 17:43, 2 Sam 3:8 and 2 Sam 16:9 ('this dead dog')."
      - "Troops going out yearly: compare 2 Sam 11:1 ('at the return of the year, the time when kings go out')."
  - id: ane-ea-165-aziru-to-king
    tradition: ane-akkadian
    title: "Aziru of Amurru to the king: I seek to see your good face; the king of Hatti is in Nuhashshe, I fear for Amurru (EA 165)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    read: ["EA 165"]
    tags:
      - {motif: overlord-addressed-as-my-god-my-sun, refs: ["EA 165 o:1", "EA 165 o:4"], note: "ana šarri bēlīya ilīya šamšīya"}
      - {motif: sevenfold-prostration, refs: ["EA 165 o:3"]}
      - {motif: vassal-longs-to-see-kings-face, refs: ["EA 165 o:5-8", "EA 165 o:13", "EA 165 r:32"], note: "mīnam appūnama ubaʾʾi pāni šarri ... banûta ubaʾʾi amāra adi dārīti, 'what more do I seek? to see the good face of the king, for ever'"}
      - {motif: hittite-king-encamped-threatens-vassal, refs: ["EA 165 o:18-21", "EA 165 r:33-41"], note: "šar māt Hatti ina māt Nuhašše ašib u palhāku ištu pānīšu ... assurri ina māt Amurri illakam; the king of Hatti is two days' journey away in Tunip"}
      - {motif: vassal-asks-king-not-to-heed-slanderers, refs: ["EA 165 r:42-45"], note: "ana awīlī sarrūti lā tešemme, 'do not listen to false men'"}
      - {motif: vassal-your-servant-and-son, refs: ["EA 165 r:43-45"], note: "anāku u ahhūya u mārūya wardū ša šarri adi dārīti"}
    hints:
      - "'To see the face of the king': compare 2 Sam 14:24, 28, 32 (Absalom 'did not see the king's face') and Gen 43:3."
  - id: ane-ea-167-aziru-to-tutu
    tradition: ane-akkadian
    title: "Aziru to Tutu, 'my lord, my father': I will not depart from the king's words; the king of Hatti is in Nuhashshe (EA 167)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    read: ["EA 167"]
    tags:
      - {motif: vassal-swears-perpetual-servitude, refs: ["EA 167 o:5-7"], note: "ištu awāt šarri bēlīya lā apaṭṭar ... adi dārīti, 'from the words of the king my lord I will not depart, for ever'"}
      - {motif: vassal-longs-to-see-kings-face, refs: ["EA 167 o:8-9", "EA 167 b.e:18-19", "EA 167 r:33-34"]}
      - {motif: vassal-your-servant-and-son, refs: ["EA 167 o:10"], note: "anāku wardka u mārka, written to the Egyptian official Tutu, addressed as bēlī abīya, 'my lord, my father'"}
      - {motif: hittite-king-encamped-threatens-vassal, refs: ["EA 167 o:11-12", "EA 167 r:20-27"], note: "assurri annakam ina māt Amurri ... illakam-ma"}
    hints:
      - "A courtier addressed as 'my father': compare Gen 45:8 (Joseph 'a father to Pharaoh') and 2 Kgs 5:13."
  - id: ane-ea-170-baaluya-betili
    tradition: ane-akkadian
    title: "Baaluya and Bet-ili to their lord (Aziru): Hittite troops under Lupakku took the cities of Amqu; Zitana comes with 90,000 foot soldiers (EA 170)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    read: ["EA 170"]
    tags:
      - {motif: letter-opening-say-to-my-lord, refs: ["EA 170 o:1-3"], note: "ana šarri bēlīni umma Baʿluya u umma Bet-ili ana šēpē bēlīni nimqut"}
      - {motif: hittite-troops-burn-vassal-cities, refs: ["EA 170 o:14-17"], note: "ṣābū māt Hatti Lupakku ilteqûnim ālāni māt ʿAmqi, 'the troops of Hatti (under) Lupakku have taken the cities of Amqu'"}
      - {motif: hittite-king-encamped-threatens-vassal, refs: ["EA 170 r:20-27"], note: "Zitana has come with 9 ribbatu (90,000) foot soldiers ... to Nuhashshe; 'we have not confirmed the word'"}
      - {motif: letter-closing-may-my-lord-know, refs: ["EA 170 b.e:18"], note: "u bēlni līde"}
    hints:
      - "Numbered foreign hosts: compare 2 Chr 14:9 (Zerah the Cushite with a million) and Judg 4:3."
      - "Note the Canaanite-type personal names Rabi-Ṣidqi ('ṣedeq is great') and Bin-ʿAnu, and the greeting to ʿAnatu (r:37, l.e:43); compare Melchizedek (Gen 14:18) and Adoni-zedek (Josh 10:1)."
  - id: ane-ea-204-qanu
    tradition: ane-akkadian
    title: "The man of Qanu: you wrote to prepare for the archers; I go with my troops and chariots before the king's troops (EA 204)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    read: ["EA 204"]
    tags:
      - {motif: letter-opening-say-to-my-lord, refs: ["EA 204 o:1-5"]}
      - {motif: sevenfold-prostration, refs: ["EA 204 o:5-8"]}
      - {motif: vassal-ready-to-go-before-kings-troops, refs: ["EA 204 b.e:9-t.e:20"], note: "attā šaprāta ana yâši ana šušuri ana pāni ṣāb piṭṭāti ... anāku qadu ṣābīya u qadu narkabātīya ana pāni ṣābī šarri adi ašar tillakū"}
    hints:
      - "Qanu is probably biblical Kenath (Num 32:42) in Bashan. Compare 1 Kgs 22:4 ('I am as you are, my people as your people, my horses as your horses')."
  - id: ane-ea-258-baal-meher
    tradition: ane-akkadian
    title: "Baal-meher: true servant; all the king has done for his land is very good (EA 258)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    read: ["EA 258"]
    tags:
      - {motif: sevenfold-prostration, refs: ["EA 258 o:4-5"]}
      - {motif: servant-ready-to-do-all-lord-says, refs: ["EA 258 o:6-9"], note: "interpretive: gabbi mimmi ša yītepuš šarru ana mātīšu damqa magal, 'all that the king has done for his land is very good'; wardu kitti, 'true servant' (o:3)"}
    hints:
      - "The sender's name Baʿlu-meher ('Baal is a warrior'); compare 2 Sam 19:27-28 (Mephibosheth: 'the king is like an angel of God, do what is good in your eyes')."
  - id: ane-ea-203-abdi-milki
    tradition: ane-akkadian
    title: "Abdi-Milki of Shashimi: ready with troops and chariots before the king's archers (EA 203)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    read: ["EA 203"]
    tags:
      - {motif: letter-opening-say-to-my-lord, refs: ["EA 203 o:1-5"]}
      - {motif: sevenfold-prostration, refs: ["EA 203 o:5-8"]}
      - {motif: vassal-ready-to-go-before-kings-troops, refs: ["EA 203 o:9-r:19"]}
    hints:
      - "Same form letter as EA 201, 202 and 204, from rulers of Bashan; compare the summons of the Transjordanian tribes in Josh 1:12-16."
  - id: ane-ea-202-amayashe
    tradition: ane-akkadian
    title: "Amayashe: who am I, a dog, that I should not go? I go with troops and chariots before the archers (EA 202)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    read: ["EA 202"]
    tags:
      - {motif: letter-opening-say-to-my-lord, refs: ["EA 202 o:1-4"]}
      - {motif: sevenfold-prostration, refs: ["EA 202 o:4-6"]}
      - {motif: what-is-your-servant-a-dog, refs: ["EA 202 r:12-14"], note: "mīyami anāku kalbu ištēn u lā illaku, 'who am I, a single dog, that I should not go?'"}
      - {motif: vassal-ready-to-go-before-kings-troops, refs: ["EA 202 o:7-r:11", "EA 202 r:15-t.e:19"]}
    hints:
      - "Compare 2 Kgs 8:13 ('What is your servant, the dog, that he should do this great thing?') and 2 Sam 9:8; 1 Sam 24:15."
  - id: ane-ea-302-shubandu
    tradition: ane-akkadian
    title: "Shubandu to the king, 'the Sun from heaven': I have heard the messenger's words and am preparing (EA 302)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    read: ["EA 302"]
    tags:
      - {motif: overlord-addressed-as-my-god-my-sun, refs: ["EA 302 o:1-3", "EA 302 o:7-8"], note: "ilānīya šamšīya šamaš ištu šamî, 'my gods, my Sun, the Sun from heaven'"}
      - {motif: vassal-dust-under-kings-feet, refs: ["EA 302 o:5-6"], note: "wardka eprī ša šēpēka"}
      - {motif: sevenfold-prostration, refs: ["EA 302 o:9-10"], note: "7-šu u 7-tān ištehehin (šukênu, 'I prostrated myself'), the verb of Hebrew hištaḥăwâ"}
      - {motif: servant-ready-to-do-all-lord-says, refs: ["EA 302 o:11-r:18"], note: "ištemē awātīšu magal magal ... anumma ušeširu kīma ša qabi"}
    hints:
      - "Compare Gen 33:3 (Jacob bows to the ground seven times) and the Hebrew prostration verb hištaḥăwâ (Gen 18:2)."
  - id: ane-ea-255-mut-baal-caravans
    tradition: ane-akkadian
    title: "Mut-Baal, son of Labaya: who am I not to send on the caravans to Hanigalbat and Karduniash? (EA 255)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    read: ["EA 255"]
    tags:
      - {motif: vassal-dust-under-kings-feet, refs: ["EA 255 o:4-5"], note: "eprī ša 2 šēpēka ṭīdu ša kabāšika, 'dust of your two feet, clay you tread on'"}
      - {motif: sevenfold-prostration, refs: ["EA 255 o:6-7"]}
      - {motif: what-is-your-servant-a-dog, refs: ["EA 255 o:12-13"], note: "mīyati anāku u lā uwaššeru harrānāti, 'who am I that I should not send the caravans on?' (self-abasing 'who am I', without 'dog')"}
      - {motif: vassal-escorts-kings-caravans, refs: ["EA 255 o:8-r:25"], note: "the vassal escorts the king's caravans (harrānātu) to Hanigalbat (Mittani) and Karduniash (Babylonia), 'for it is very well guarded'"}
    hints:
      - "Mut-Baal is son of Labaya of Shechem (o:15). Caravan routes through Canaan: compare Gen 37:25 (Ishmaelite caravan to Egypt) and Judg 5:6 ('the caravans ceased')."
  - id: ane-ea-239-baduzana
    tradition: ane-akkadian
    title: "Baduzana: all the king's words are carried out; let the great one come out and learn our guilt (EA 239)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    read: ["EA 239"]
    tags:
      - {motif: letter-opening-say-to-my-lord, refs: ["EA 239 o:1-3"]}
      - {motif: sevenfold-prostration, refs: ["EA 239 o:4-7"]}
      - {motif: vassal-asks-king-not-to-heed-slanderers, refs: ["EA 239 r:18-27"], note: "interpretive: līde-mi arnāni inūma lemni wardūka ina pānīka yiqbû, 'let him find out our guilt, when your servants spoke evil before you'"}
    hints:
      - "Compare 1 Sam 26:18-19 ('what have I done? what evil is in my hand?... if men have stirred you up')."
  - id: ane-ea-254-labaya
    tradition: ane-akkadian
    title: "Labaya of Shechem: I am a loyal servant, no guilt; I said in assembly the king may take my property; my son walks with the Habiru unknown to me; if the king said, I would put a bronze dagger in my heart (EA 254)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    read: ["EA 254"]
    tags:
      - {motif: overlord-addressed-as-my-god-my-sun, refs: ["EA 254 o:1", "EA 254 o:5"]}
      - {motif: vassal-dust-under-kings-feet, refs: ["EA 254 o:3"], note: "epru ša kabāšika, 'dust you tread on'"}
      - {motif: sevenfold-prostration, refs: ["EA 254 o:4-6"]}
      - {motif: petitioner-protests-innocence, refs: ["EA 254 o:10-15"], note: "anāku wardu kitti šarri u lā arnāku u lā haṭâku u lā akalli biltīya u lā akalli erišti rābiṣīya, 'I am not guilty, I have not sinned, I do not withhold my tribute or what my commissioner asks'"}
      - {motif: vassal-asks-king-not-to-heed-slanderers, refs: ["EA 254 o:16-18"], note: "anumma yikalū karṣīya habālu-ma, 'now they slander me (eat my pieces) wrongfully'"}
      - {motif: habiru-sa-gaz, refs: ["EA 254 r:31-37"], note: "my son went about with the SA.GAZ without my knowledge; I have handed him over to Addaya"}
      - {motif: servant-ready-to-do-all-lord-says, refs: ["EA 254 r:38-l.e:46"], note: "if the king wrote for my wife, would I withhold her? if he wrote to me 'put a bronze dagger in your heart and die', would I not do the king's command?"}
    hints:
      - "Labaya ruled the hill country of Shechem; compare Abimelech of Shechem (Judg 9) and Jacob's sons at Shechem (Gen 34)."
      - "'I have not sinned... why do you listen?' compare 1 Sam 24:12 and 26:18; the obedience to the death compare Gen 22 and 2 Sam 15:26 ('let him do to me what seems good to him')."
      - "Accusation 'in assembly' (puhriš, r:24) of Milkilu: compare Job 31:34-35."
  - id: ane-ea-189-etakkama
    tradition: ane-akkadian
    title: "Etakkama of Qadesh: Biryawaza slanders me; he gave the king's cities to the Habiru, and with the king's gods and Sun I restored them (EA 189)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    read: ["EA 189"]
    tags:
      - {motif: overlord-addressed-as-my-god-my-sun, refs: ["EA 189 o:3"]}
      - {motif: sevenfold-prostration, refs: ["EA 189 o:4"]}
      - {motif: vassal-asks-king-not-to-heed-slanderers, refs: ["EA 189 o:6-9"], note: "yilammunūni Biryawaza lamnum ana pānīka, 'Biryawaza slanders me before you'"}
      - {motif: hittite-troops-burn-vassal-cities, refs: ["EA 189 o:9-12"], note: "inverted: Etakkama says Biryawaza took his father's whole house in Qadesh and set his cities on fire (ana išāti)"}
