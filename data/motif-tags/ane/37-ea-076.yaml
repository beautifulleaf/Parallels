  - id: ane-ea-162-pharaoh-to-aziru
    tradition: ane-akkadian
    title: "The king to Aziru of Amurru: you received the man of Byblos whose brother cast him out at the gate; you ate and drank with the man of Qadesh; serve the king and live, or die by the king's axe with all your family; come or send your son; send these enemies of the king in copper chains (EA 162)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    read: ["EA 162"]
    tags:
      - {motif: letter-opening-say-to-my-lord, refs: ["EA 162 o:1-2"], note: "royal form: ana Aziri awīl Amurri qibī-ma umma-a-mi šarru bēlka"}
      - {motif: vassal-expelled-by-brother-at-city-gate, refs: ["EA 162 o:2-6", "EA 162 o:9-13"], note: "awīl Gubla ša ahūšu ina bābi ittasukšu, 'the man of Byblos whose brother threw him out at the gate' said 'take me, bring me into my city; there is much silver, I will give it to you'"}
      - {motif: vassal-asks-king-not-to-heed-slanderers, refs: ["EA 162 o:14-16"], note: "reversed by the king: ul tīde sarrūtta ša awīlī ... ammīni lā takul karṣīšu, 'you do not know the treachery of men ... why did you not denounce him before the king?'"}
      - {motif: covenant-meal-with-kings-enemy, refs: ["EA 162 o:22-25"], note: "šalmāta itti awīl Qidša akalē šikarē itti ahāmiš takkala, 'you are at peace with the man of Qadesh, you eat bread and drink beer together'; why at peace with the man the king fights?"}
      - {motif: thrown-into-fire, refs: ["EA 162 o:30-31"], note: "metaphor: annûtti ša ulammadūka ... ana libbi išāti ana nasāki ubaʾʾûka u qalû, 'those who instruct you seek to throw you into the fire, and (you are) roasted'"}
      - {motif: serve-the-king-and-live, refs: ["EA 162 o:33-39"], note: "šumma tašakkan awātī sarrūti ina libbika u ina haṣṣinni ša šarri tamât qadu gabbi kimtika u epuš wardūta ana šarri bēlka u balṭāta, 'by the king's axe you will die with all your family; serve the king your lord and you will live'"}
      - {motif: dominion-from-sunrise-to-sunset, refs: ["EA 162 o:40-41", "EA 162 r:78-81"], note: "the king lacks nothing in all Canaan; šalim šarru kīma šamaš ina šamê ... ina māti eliti adi māti šapliti ṣīt šamši adi ereb šamši"}
      - {motif: vassal-summoned-to-court-or-send-son, refs: ["EA 162 o:42-r:54"], note: "'let me off this year, I will come next year'; the king grants it, but: 'come yourself or send your son, and see the king by seeing whom all lands live' (ša gabbi mātāti iballuṭū ana amārišu)"}
      - {motif: fugitive-rebel-demanded-from-foreign-king, refs: ["EA 162 r:55-77"], note: "Hanni the messenger brings a tablet with the names of the king's enemies (ayyābū ša šarri); send them all, leave not one, with copper chains on their feet: Šarru with all his sons, Tuya, Leya, Piśyari, Manya's son-in-law, Dašarti, Baʿluma, Nib-maḥe 'a robber (habbātu) in Amurru'"}
      - {motif: king-well-like-sun-in-heaven, refs: ["EA 162 r:78-81"]}
      - {motif: canaanite-gloss-in-akkadian-letter, refs: ["EA 162 r:74-75"], note: "the pamahâ ša hannipa īdeʾû ... ubāra ilta[n]aṣ: West Semitic ḥnp 'impiety' (Hebrew ḥānēp, 'godless'), said of a man who 'sneers at the resident alien (ubāru)'"}
    hints:
      - "'Serve the king and live': compare Jer 27:12, 17 ('bring your necks under the yoke of the king of Babylon, serve him and live') and 2 Kgs 18:31-32."
      - "Family destroyed with the guilty: compare Josh 7:24-25 and 2 Kgs 9:7-8. The axe of the king: Isa 10:15."
      - "Eating bread together as a covenant: compare Gen 26:30, Gen 31:46-54 and Ps 41:10. The king 'by seeing whom all lands live': Prov 16:15 ('in the light of the king's face is life')."
      - "Extradition of the king's enemies by name in chains: compare 1 Kgs 2:39-40 (Shimei's slaves fetched from Gath) and Jer 26:21-23 (Uriah fetched from Egypt)."
      - "ḥnp: compare Job 8:13, 13:16 (ḥānēp) and Isa 9:16; on the resident alien compare Exod 22:20 and Deut 10:19."
