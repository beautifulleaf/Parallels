      - {motif: brotherly-greeting-gift-requested, refs: ["Ugarit Ras Shamra-Ougarit 07, 036 b.e:1-r:18", "Ugarit Ras Shamra-Ougarit 07, 036 l.e:1-4"], note: "attā maškāta ana yâši mērišta lā terišanni, 'you are bad: you do not ask me any wish'; in Hatti there is nothing; nuhurtu, blue wool and alum for the trade goods of my horses"}
    hints:
      - "Teacher and pupil as 'father' and 'son': compare Prov 1:8, 2 Kgs 2:12 and the 'sons of the prophets'."
  - id: ane-rso-07-037-beirut-to-prefect
    tradition: ane-akkadian
    title: "The king of Beirut to the prefect of Ugarit: I heard my brother set out from Ugarit; my heart is with him day and night; send me word (RSO 07, 037)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    read: ["Ugarit Ras Shamra-Ougarit 07, 037"]
    tags:
      - {motif: thousand-gods-of-hatti, refs: ["Ugarit Ras Shamra-Ougarit 07, 037 o:5"], note: "līm ilānū liṣṣurūka"}
      - {motif: canaanite-gloss-in-akkadian-letter, refs: ["Ugarit Ras Shamra-Ougarit 07, 037 o:2"], note: "LU₂.GAR.RA lemmatized skn, the West Semitic 'prefect' (sākinu), the title of Hebrew sōkēn"}
      - {motif: brotherly-greeting-gift-requested, refs: ["Ugarit Ras Shamra-Ougarit 07, 037 o:6-r:2"], note: "iltemi namāši ahīya ištu māt Ugarit u libbī ittīšu ūma u mūši, 'my heart is with him day and night'; ṭēma terranni"}
    hints:
      - "Compare Isa 22:15 (Shebna the sōkēn over the house) and 2 Kgs 10:15 ('is your heart right with my heart?')."
  - id: ane-rso-07-046-shalmaneser-nihriya
    tradition: ane-akkadian
    title: "Shalmaneser I of Assyria to Ibiranu of Ugarit: Tudhaliya of Hatti sent tablets of war and of peace, refused to return fugitives or to touch the oath-tablet before the Sun; at Nihriya I entered the Hittite army and made a great slaughter (RSO 07, 046)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    read: ["Ugarit Ras Shamra-Ougarit 07, 046"]
    tags:
      - {motif: enemy-sends-tablets-of-war-and-peace, refs: ["Ugarit Ras Shamra-Ougarit 07, 046 o:21-30"], note: "2 ṭuppāti ša nukurti u 1 ṭuppa ša šulmi našī; after three days he brings the tablet of peace forward"}
      - {motif: treaty-gods-and-stars-as-witnesses, refs: ["Ugarit Ras Shamra-Ougarit 07, 046 o:30-37"], note: "Addu u Šamaš lū īdû šumma anāku itti šar māt Aššur ahīya nakrāku ... šumma munnabtūti lā uttarrašu, 'let the Storm god and the Sun know: if I am hostile to my brother the king of Assyria'"}
      - {motif: treaty-return-fugitives, refs: ["Ugarit Ras Shamra-Ougarit 07, 046 o:33-37"], note: "the troops who fled before the king of Assyria and entered Hatti are not sent to the king of Assyria"}
      - {motif: allies-ask-why-brothers-are-enemies, refs: ["Ugarit Ras Shamra-Ougarit 07, 046 o:38-41"], note: "ammīnê ahhū nīnu itti ahāmeš nakrāni, 'why are we, brothers, enemies to each other?' followed by a broken saying: the lion ... kill, and the hostile one laughs (iṣṣenah)"}
      - {motif: hand-raised-to-sun-god-in-oath, refs: ["Ugarit Ras Shamra-Ougarit 07, 046 r:14-18"], note: "qāssu ana pāni Šamaš ittaši mā attā Šamaš lū tīdi, 'he lifted his hand before the Sun: you, Sun, know!'"}
      - {motif: king-refuses-to-touch-oath-tablet-before-sun, refs: ["Ugarit Ras Shamra-Ougarit 07, 046 r:17-20"], note: "ṭuppa ša māmīti altaṭar ... ina kittika ṭuppa annâ ana pāni Šamaš luput ul imangur, 'if you are truthful, touch this tablet before the Sun': he refused"}
      - {motif: herald-orders-camp-to-arm, refs: ["Ugarit Ras Shamra-Ougarit 07, 046 r:28-33"], note: "ana nāgiri ša karāšīya altasi mā sariyanātekunu hutallipā u narkabātekunu rukbā, 'put on your coats of mail (sariyam) and mount your chariots'"}
      - {motif: king-first-person-battle-boast, refs: ["Ugarit Ras Shamra-Ougarit 07, 046 r:33-41"], note: "anāku lītānâ narkabtī aṣṣamed ... ana libbi ṣābī ša māt Hatti īterub dīkta rabâ lū addūk, 'I the victorious harnessed my chariot, entered the Hittite army and made a great slaughter'; the palace herald fled from Nihriya"}
    hints:
      - "Lifting the hand in oath: compare Gen 14:22 ('I have lifted my hand to YHWH'), Deut 32:40 and Dan 12:7."
      - "sariyam 'coat of mail' is the word of Hebrew širyôn (1 Sam 17:5, 38; 1 Kgs 22:34)."
      - "'Why should we be enemies, being brothers?': compare Gen 13:8 ('let there be no strife between us, for we are brothers') and 2 Sam 2:26."
      - "Return of fugitives between kings: 1 Kgs 2:39-40; the Assyrian claim against Hatti over fugitives compare 2 Kgs 17:4."
  - id: ane-rso-07-047-hellu-substitute
    tradition: ane-akkadian
    title: "Hellu to his lord: may I go as your substitute; may Addu, Dagan and Itur-Mer, the great gods of Mari, guard you; my heart laughed to see you; send good horses for the king's chariot, save my life (RSO 07, 047)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    read: ["Ugarit Ras Shamra-Ougarit 07, 047"]
    tags:
      - {motif: servant-offers-himself-as-substitute-for-lord, refs: ["Ugarit Ras Shamra-Ougarit 07, 047 o:1-2"], note: "wardka Hellu ana dinānī bēlīya lullik, 'your servant Hellu: may I go as the substitute of my lord'"}
      - {motif: letter-greeting-gods-guard-you, refs: ["Ugarit Ras Shamra-Ougarit 07, 047 o:2-9"], note: "Addu Dagan u Itūr-Mēr ilānū rabûtu ša māt Mari napšāti bēlīya liṣṣurū ... ana bīt bēlīya kibsi u tallakti ša bēlīya šalāma liškunū"}
      - {motif: vassal-longs-to-see-kings-face, refs: ["Ugarit Ras Shamra-Ougarit 07, 047 o:9-13"], note: "ana amāri ša bēlīya libbī maʾda iṣṣihanni manni pāni banûti ša bēlīya līmur u dabāba ṭāba ša bēlīya lištemmi; later (r:14-t.e:3) bēlī usāta lipušamma napšātīya bēlī liṭīra, 'let my lord help and save my life': before the enemy I was broken and my house is destitute"}
    hints:
      - "'May I be your substitute': compare 2 Sam 18:33 ('would I had died instead of you, Absalom'), Exod 32:32 and Gen 44:33 (Judah offers himself in Benjamin's place)."
      - "'Who will show us good?' / seeing the lord's good face: Ps 4:7 and Gen 33:10."
  - id: ane-rih-81-04-maid-lawsuit
    tradition: ane-akkadian
    title: "To my brother: may the thousand gods, the gods of Beirut and the gods of the queen of Ugarit guard you; I send a woman, my maid, with her brother: judge them truly (RIH 81/04)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    read: ["Ugarit RIH 81/04"]
    tags:
      - {motif: thousand-gods-of-hatti, refs: ["Ugarit RIH 81/04 o:4-7"], note: "līm ilānū ilānū māt Biʾruti ilānū šarrat māt Ugarit ana šulmāni liṣṣurūka"}
      - {motif: disputants-sent-to-be-judged-truly, refs: ["Ugarit RIH 81/04 o:8-r:4"], note: "a woman, my maid (amtu), with her brother, who are fixing her status as slave (amūtu išimmū), stand before you; dīnīšunu kī kitti purussunu, 'decide their case according to truth'"}
      - {motif: brotherly-greeting-gift-requested, refs: ["Ugarit RIH 81/04 r:5-9"], note: "whatever you need, write to me, and I will do likewise"}
