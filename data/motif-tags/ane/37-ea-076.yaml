  - id: ane-rs-06-0198-belubur-ilimilku
    tradition: ane-akkadian
    title: "Belu-bur to Ilimilku, his brother: why did Numenu come without your greeting? Speak my good words before the queen (RS 06.0198)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    read: ["Ugarit RS 06.0198"]
    tags:
      - {motif: letter-greeting-gods-guard-you, refs: ["Ugarit RS 06.0198 o:4-6"], note: "ilānū ša māt Ugarita ahīya liṣṣurūka"}
      - {motif: brotherly-greeting-gift-requested, refs: ["Ugarit RS 06.0198 o:7-11", "Ugarit RS 06.0198 r:7-t.e:2"], note: "anaʾīni Nuʿmenu ... illikam-ma u šulmaka lā tašpura, 'why did Numenu come and you did not send your greeting?'"}
      - {motif: consort-intercedes-for-king, refs: ["Ugarit RS 06.0198 b.e:1-r:6"], note: "interpretive: ana pāni šarrati sīsi-ma ... awātīya damqāti ana pāni šarrati dubbu, 'cry out (read) my tablets before the queen and speak my good words before her'"}
    hints:
      - "Ilimilku is the name of the Ugaritic scribe of the Baal, Kirta and Aqhat tablets. Compare Esth 4:8 (Esther sent to plead before the king) and 1 Kgs 2:13-19 (Adonijah asks Bathsheba to speak for him)."
