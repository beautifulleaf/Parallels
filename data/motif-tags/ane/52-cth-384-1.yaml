      - {motif: blessing-on-king-who-reveres-god, refs: ["CTH 385.4 §7:19-22", "CTH 385.4 §8:23-24"], note: "TI-tar ḫaddulatar 'life and health'; kallaranni 'in misfortune'; DUMU.DUMU.MEŠ LUGAL … pankur 'the king's grandchildren … the clan'"}
