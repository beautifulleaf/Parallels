      - {motif: offering-burned-without-smoke, refs: ["CTH 396.1.1 §5:33-42"], note: "1 GUNNI 'a hearth' before the river; the fish with a cake in its mouth thrown on the hearth and burned; tuḫ[ḫuwaiš=ma] UL kuiški 'there is no smoke' (smoke restored); the place marked (gulašmi) with wine"}
      - {motif: sun-god-as-witness-to-rite, refs: ["CTH 396.1.1 §6:43-49"], note: "dWišuriyanti ḫuwappi MUNUS-ni 'Wišuriyant, the evil woman'; zik dUTU-uš kutruwaš ēš 'Sun god, be witness'; šannai kuwatqa … zik nepišaš dUTU-uš šāk 'if she hides anything, you, Sun of heaven, know it'"}
      - {motif: hand-raised-to-sun-god-in-oath, refs: ["CTH 396.1.1 §6:46"], note: "the Sun as witness (kutruwaš), without the raised hand"}
