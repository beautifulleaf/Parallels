      - {motif: purification-by-fire-and-water, refs: ["CTH 394 §7:64-67"], note: "people, not spoils, pass between fires and wash in salt water"}
      - {motif: augurs-drink-the-god-standing, refs: ["CTH 394 §7:68-73", "CTH 394 §9:96"], note: "two he-goats for the LAMMA of the ritual equipment (dLAMMA aniyattaš); he drinks him three times; the Sun of heaven, the Storm god and all gods drunk three times on day four"}
      - {motif: plague-god-asked-to-be-at-peace-with-land, refs: ["CTH 394 §8:74-86"], note: "1 MÁŠ.GAL 1 UDU.NÍTA 1 ŠAḪ 'a he-goat, a ram, a pig' for the god who made the plague; A-NA KUR URU ḫatti Ù A-NA KARAŠ … taksulanza [ēšdu] 'let it be at peace'; anda aššuli neyaru 'turn to them in kindness'"}
      - {motif: unmated-ewe-offered, refs: ["CTH 394 §9:87-93"], note: "GU4.MAḪ to the Storm god; UDU.SÍG+MUNUS … kuedani UDU.ŠIR-aš nāwi pānza 'a ewe to which a ram has not yet gone' to the Sun god; three sheep for all the gods"}
      - {motif: scribal-colophon, refs: ["CTH 394 §9:99-107"], note: "three rituals on one tablet: Zarpiya's 'if a year is bad' (the kelu ritual), Uḫḫamuwa's 'if in the land or city there is constant dying', Ašḫella's 'if a plague arises in the land or the camp'"}
    hints:
      - "Compare Num 19:2 (a red cow on which no yoke has come), Deut 21:3 (a heifer that has not drawn the yoke) and Q 2:71 ('a cow not trained to plough') with the ewe 'to which no ram has gone'."
      - "Compare Num 31:19-24 (purify yourselves outside the camp; what can stand fire through fire, the rest through water) and Lev 16:26 (he who sent the goat washes before entering the camp)."
      - "Compare Q 5:27 (from one it was accepted, from the other not) and Q 22:37 with 'eat in a god's way and leave nothing to man'; contrast Q 22:28, 36 ('eat of them and feed the needy')."
  - id: ane-cth-395-1-1-hantitassu-years-disturbed
    tradition: ane-hittite
    title: Ḫantitaššu's ritual for disturbed years, the table on the roof, 'take the gold, give me back the man' (CTH 395.1 §1-12)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Hittite"
    read: ["CTH 395.1 §1:1-§12:88"]
    tags:
      - {motif: years-of-person-disturbed-ritual, refs: ["CTH 395.1 §1:1-6", "CTH 395.1 §2:7-11", "CTH 395.1 §3:12-15", "CTH 395.1 §4:16-22"], note: "MU.KAM.ḪI.A-ŠU [ninink]anteš 'his years are disturbed' (restored); [šuḫḫi] dUTU-i IGI-anda GIŠBANŠUR 'on the roof, facing the Sun, a table'; ZÍZ-tar šeppit parḫuena ewan karaš ḫattar zinail kūtiyan 'emmer, šeppit …'; gold, silver, lapis, carnelian, 'stone of life'; a shaving of horn from a living plough-ox; bread for dGulšaš 'the fate goddess'; cedar, ghee, honey burnt in embers"}
      - {motif: sun-to-lick-incantations-like-salt, refs: ["CTH 395.1 §5:23-27"], note: "MUN GIM-an UDU.ḪI.A lilipanti … dUTU-uš QATAMMA lilipaiškiddu 'as sheep lick salt, so may the Sun lick (these incantations)'"}
      - {motif: sun-god-feast-patient-missing, refs: ["CTH 395.1 §6:28-30"], note: "dUTU-uš=za EZEN4-an DÙ-at … dapiuš DINGIR.MEŠ-uš ḫalzaiš … ḫūmandan DUMU.LÚ.U19.LU-an ḫalzaiš 'the Sun made a festival, called all the gods, called all mankind'; the patron's vanishing is preserved in CTH 395.2.2 §2:13"}
      - {motif: give-me-back-my-calf-my-son, refs: ["CTH 395.1 §8:33-37"], note: "fMaddu[ta] … dUTU-i ginuwaššaš 'on her knees before the Sun'; AMAR-un=man DUMU-la=man pāi 'give my calf, my son'"}
      - {motif: take-the-gold-give-back-the-man, refs: ["CTH 395.1 §9:38-50", "CTH 395.1 §10:51-56"], note: "dUTU-uš ḫarkiš GEŠTU-KA lakkiški 'bright Sun, incline your ear'; ḫūman NUMUN dā … GUŠKIN dā … NA4ZA.GÌN dā … EN SISKUR=ma=mu EGIR-pa pāi 'take all the seed … the gold … the lapis … but give me back the ritual patron'"}
      - {motif: tired-horse-unhitched-fresh-hitched, refs: ["CTH 395.1 §10:57-63"], note: "lā dariyantan, turiya=ma waršiyanta 'unhitch the tired, hitch the fresh'; 3-ŠÚ teši 'say it three times'"}
      - {motif: escape-from-mouth-of-agni, refs: ["CTH 395.1 §11:64-67"], note: "NA4ARA5-za=kan GIM-an kappiš išpartiyezzi … EN SISKUR=kan dAgni KAxU-za QATAMMA išpartiddu 'as kappi escapes the millstone, so may the patron escape the mouth of Agni'; IGI-zian GIM-an GIŠḫurkin EGIR-ziš anda UL wemiyazi … idāluš UD.KAM-az … lē KAR-zi 'the evil day shall not catch him'"}
      - {motif: incantation-words-are-gods-not-mine, refs: ["CTH 395.1 §11:68-69"], note: "natta ammel [uddār], dUTU-aš dKamrušipašša uddār 'not my words: the words of the Sun and of Kamrušepa'"}
      - {motif: deity-told-eat-drink-and-remove-illness, refs: ["CTH 395.1 §12:70-80"], note: "said 7 times; 7 thick breads broken, once round (irḫai-); dUTU-i zikka azzikki … na-at=mu dUTU-uš EGIR-an tarna 'Sun, eat … and let what I say come back to me'"}
      - {motif: prayer-for-long-years-months-days, refs: ["CTH 395.1 §1:2"], note: "the ritual's concern: the patient's years"}
    hints:
      - "Compare Q 3:91 and Q 5:36 (an earthful of gold offered as ransom is not accepted) and Q 37:107 (the great sacrifice as ransom) with 'take the gold, give back the man'; Ps 49:8-9 (the ransom of a life is too costly)."
      - "Compare Q 6:76-78 (Abraham and the sun: 'this is my lord … it set') and Q 41:37 with the Sun asked to lick the incantations like salt."
      - "Agni (dAgni), the Vedic fire god, appears in a Hittite-Luwian spell."
  - id: ane-cth-395-1-13-hantitassu-pit-old-gods
    tradition: ane-hittite
    title: Ḫantitaššu's ritual, the piglet in the pit for the old gods, the bolt that opens the dark earth, the sealed bundle (CTH 395.1 §13-25)
