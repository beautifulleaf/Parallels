    read: ["CTH 396.1.1 §1:1-§6:51"]
    tags:
      - {motif: demoness-washed-at-river, refs: ["CTH 396.1.1 §1:1-5", "CTH 396.1.1 §2:6-12"], note: "dWišuriyandan katta [ÍD-i] 'down to the river' (restored); GIŠZA.LAM.GAR 'a tent'; wappuwaš [IM-it] … warapmi 'I wash with [clay] of the bank'; kāša=wa=tta parkununun … šappišaraḫḫun 'see, I have purified you, washed you off'"}
