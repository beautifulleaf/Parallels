      - {motif: fish-sent-as-messenger-to-deity, refs: ["CTH 396.1.1 §3:21-26"], note: "KU6 dāḫḫi … KAxU-i anda NINDA.Ì.E.DÉ.A teḫḫi 'a fish, a cake in its mouth'; [ÍD-i EGIR]-an tarnaḫḫi 'release into the river'; ḪUR.SAG Šuppinna, ÍD Zippira; A-NA dWišuriyanti pēda 'bring (it) to Wišuriyant'"}
