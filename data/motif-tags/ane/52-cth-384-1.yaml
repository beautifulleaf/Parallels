      - {motif: king-unites-en-priesthood-and-kingship, refs: ["CTH 385.10 §11:43-45"], note: "labarnan LÚSANGA-KA 'the Labarna, your priest'; Tawannanna šiwanzannandan 'the god's mother'; mayandaḫḫeški uktūriyaḫḫeški 'make them vigorous, make them lasting'"}
      - {motif: sea-made-boundary-of-realm, refs: ["CTH 385.10 §16:62"], note: "[URU z]alpui … arunan irḫaššan iendu 'in Zalpuwa may they make the sea its boundary'"}
      - {motif: priest-prays-on-temple-roof-at-dawn, refs: ["CTH 385.10 §18:72-73", "CTH 385.10 §19:74-77", "CTH 385.10 §22:86"], note: "LÚSANGA ŠA dUTU URU arinna šuḫḫi=ššan šer ŠA É dUTU … memiškezzi 'the priest speaks on the roof of the Sun's house'; māan lukkatta 'when it grows light'; dUTU-i menaḫḫanda 'facing the Sun'"}
      - {motif: scribal-colophon, refs: ["CTH 385.10 §22:87"], note: "[QA]TI 'finished'; the edition's notes run into the line"}
    hints:
      - "Compare Q 17:78 (the dawn recitation is witnessed) and Q 5:6 (washing before prayer) with the cloudless dawn, washing and silence."
      - "The sun prayer facing the sun at dawn diverges from Q 41:37 ('do not prostrate to the sun or the moon') and Q 27:24 (Sheba bowing to the sun); compare Ezek 8:16 (men facing east bowing to the sun) and Jer 19:13 (offerings on rooftops)."
      - "Compare Q 8:17 ('you did not throw when you threw') and Ps 2:8-9 (nations given to the king) with the goddess's victorious spear."
