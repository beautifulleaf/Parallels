      - {motif: minor-deity-asked-to-forward-prayer, refs: ["CTH 384.3 §1:4-6"], note: "Zintuḫi; [u]wainut 'make (me) pitiable' before the Sun goddess of Arinna"}
  - id: ane-cth-385-1-prayer-fragment-sin
    tradition: ane-hittite
