  - id: ane-cth-385-8-enemies-covet-temples
    tradition: ane-hittite
    title: The enemies covet the gods' vessels, servants, temples and fields (CTH 385.8)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Hittite"
    read: ["CTH 385.8"]
    tags:
      - {motif: enemies-covet-temple-vessels-and-servants, refs: ["CTH 385.8 §4:14-17"], note: "KÙ.BABBAR GUŠKIN U-NU-TE.MEŠ-KU-NU … ilališkanzi 'they covet your silver and gold vessels'; LÚ.MEŠ APIN.LÁ … MUNUS.MEŠ NA4ARA5 MUNUS.MEŠ UŠ.BAR 'ploughmen … millstone women, weavers'; É.DINGIR.MEŠ-KU-NU 'your temples'; A.ŠÀ.ḪI.A GIŠKIRI6.ḪI.A … dannattaḫḫuwanzi 'to lay waste fields, gardens'"}
      - {motif: temple-treasures-plundered, refs: ["CTH 385.8 §4:14"], note: "threatened, not done"}
      - {motif: blessing-on-king-who-reveres-god, refs: ["CTH 385.8 §3:12-13"], note: "LUGAL MUNUS.LUGAL DUMU.MEŠ LUGAL … paḫšantaru 'may they protect them'"}
    hints:
      - "Compare Ps 74:3-8 and Ps 79:1 (the enemy in the sanctuary) and Q 2:114 (who is more wrong than one who bars God's places of worship and strives to ruin them?)."
  - id: ane-cth-385-9-tudhaliya-confession-festivals
    tradition: ane-hittite
    title: Tudḫaliya confesses curtailing the festivals and vows a temple (CTH 385.9)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Hittite"
    read: ["CTH 385.9"]
    tags:
      - {motif: prayer-framed-as-legal-plea, refs: ["CTH 385.9 §1:1"]}
      - {motif: king-confesses-curtailing-festivals, refs: ["CTH 385.9 §1:2-5", "CTH 385.9 §1:11-12"], note: "waštaḫḫun 'I sinned'; [z]ammuranun 'I offended'; [EZEN4-a]n arḫa appeškewan teḫḫun 'I took away the festival'; EZEN4.MEŠ karšanunun 'I cut the festivals'; wašdul is only partly preserved in §1:11"}
      - {motif: festivals-celebrated-in-wrong-season, refs: ["CTH 385.9 §1:13-15"], note: "EZEN4.MEŠ ḫamešḫandaš … [zēnand]ašša UL namma waḫnummi 'I will no longer exchange the spring and [autumn] festivals'; ḫamešḫi=pat … zēni=pat ēššaḫḫi 'only in spring … only in autumn will I celebrate'"}
      - {motif: lost-divine-image-explained, refs: ["CTH 385.9 §2:17-24"], note: "DINGIR.MEŠ-tar … GAM paīt 'the divine image went down (was lost)'; INA UD-MI mšuppilu[liuma] 'in the days of Šuppiluliuma'"}
      - {motif: vow-temple-if-victorious, refs: ["CTH 385.9 §1:8-10", "CTH 385.9 §5:40-47"], note: "māan=za LÚKÚR tar[u]ḫmi … ḪUR.SAG tagu[rq]a šer uwami … LI-IM.ḪI.A [p]eḫḫi … parā šarnikmi 'if I defeat the enemy … I will come up on Mount Tagurqa … give thousands … make compensation'; É.DINGIR-LIM DÙ-mi 'I will build a temple' in Arinna"}
      - {motif: conditional-vow-to-deity, refs: ["CTH 385.9 §1:9-10"]}
      - {motif: compensation-promised-to-god, refs: ["CTH 385.9 §5:47"]}
    hints:
      - "Compare Q 9:36-37 (the twelve months, four sacred; al-nasī' shifting the sacred month is an increase in unbelief) with the vow no longer to exchange spring and autumn festivals."
      - "Compare Q 7:23 ('our Lord, we have wronged ourselves') and 2 Sam 24:10 with the king's confession; and Num 21:2 (Israel's vow 'if you give this people into my hand')."
      - "Compare 1 Sam 4-6 (the ark lost in a former generation) with the lost divine image."
