      - {motif: deity-told-eat-drink-and-remove-illness, refs: ["CTH 390 §4:11-13", "CTH 390 §5:14-18", "CTH 390 §6:20-21", "CTH 390 §7:22-24"], note: "UZUḫuišu šuppa 'raw sacred meat'; KUŠ UDU UZUGABA ZAG 'hide, breast, shoulder' before the god; liver roasted on open flame (ḫappinit) on broken bread; zik azzikki akkuški 'eat and drink'; at dawn it is taken up and eaten"}
      - {motif: herbal-potion-poured-into-mouth-and-over-body, refs: ["CTH 390 §8:26", "CTH 390 §9:27", "CTH 390 §10:28-32", "CTH 390 §11:33-37", "CTH 390 §12:38-42"], note: "list of garden plants (white and black cumin, asafoetida, crocus, lettuce …); ḫarnammar BAPPIR 'yeast, beer-wort'; waḫešnaš wātar 'water of purification'; into his mouth (aiš), head, all limbs, anus (arraš); the child washes with soapwort (ŠE.NAGA)"}
      - {motif: bird-waved-over-patient-and-released, refs: ["CTH 390 §13:43-45"], note: "MUŠEN ḪURRI šēr arḫa waḫnuzzi 'waves a (Hurrian) goose over him'; dUTU-i EGIR-an tarnāi 'lets it go to the Sun god'"}
      - {motif: two-birds-one-killed-one-released, refs: ["CTH 390 §13:44-45"], note: "only one bird, waved and released; no slaughtered partner"}
      - {motif: purification-materials-catalogue, refs: ["CTH 390 §8:26", "CTH 390 §9:27"]}
      - {motif: wound-dressed-with-bandage-and-salve, refs: ["CTH 390 §14:46-47", "CTH 390 §15:48-52"], note: "loose: plants sieved in sheep fat; the limbs are anointed (iškaḫḫi); the child set on a pierced stool (GIŠŠÚ.A gullanti) over a NAMMANTU vessel of purification water"}
      - {motif: vessel-broken-in-rite, refs: ["CTH 390 §20:61-64"], note: "eleven(?) flat bowls; one is waved over him and smashed (duwarnai); §16-19 and §21 almost lost"}
    hints:
      - "Compare Lev 14:4-7, 49-53 (two birds: one killed, the living one set free over the field for the healed leper) with the goose waved over the child and released to the Sun."
      - "Compare Q 26:80 ('when I fall ill, He heals me'), against a sun god of illness who takes it away; and Q 16:69 (honey with healing) for the herbal potion."
