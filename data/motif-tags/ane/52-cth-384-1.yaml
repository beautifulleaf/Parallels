  - id: ane-cth-386-1-nerik-storm-god-summoned
    tradition: ane-hittite
    title: The Storm god of Nerik woken and summoned from all places (CTH 386.1)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Hittite"
    read: ["CTH 386.1"]
    tags:
      - {motif: bird-messenger-wakes-god-from-dreams, refs: ["CTH 386.1 §2:8-10"], note: "dzaḫpunaš … MUŠEN GIM-an šanezzin [ḫalu]gan ḫalzāu 'like a bird let her call a pleasant message'; šanezziyaz tešḫaz šarā arnuddu 'wake him from pleasant dreams'"}
      - {motif: god-summoned-from-all-places, refs: ["CTH 386.1 §2:11-13", "CTH 386.1 §2:19-21", "CTH 386.1 §3:22", "CTH 386.1 §4:23-35"], note: "eḫu 'come!' from nepišaz daganzipaz 'heaven and earth', ṢĒT dUTU-aš ŠÚ.A dUTU-aš 'sunrise and sunset'; mountains Ḫaḫruwa, Zaliyanu, Daḫalmuna, Tagurta, Ḫulla, Puškurunuwa; rivers Maraššanta and Zumazuwanta; Zalpa aruna 'the sea'; the spring of Nerik; Arzawa, Ḫurri, Kummanni; IM.MAR.TU IM.SI … 4 ḫalḫaltumarraš 'the four corners'"}
      - {motif: god-with-father-above-or-mother-below, refs: ["CTH 386.1 §2:14-16"], note: "dankui daganzipi A-NA dEREŠ.KI.GAL AMA-KA 'in the dark earth with Ereškigal your mother'"}
      - {motif: king-anointed-as-priest-of-god, refs: ["CTH 386.1 §2:17"], note: "mdutḫaliyan … AŠŠUM LÚSANGA-UT-TIM iškanzi 'they will anoint Tudḫaliya for the priesthood' of Ḫakmiš and Nerik"}
      - {motif: four-corners-of-the-earth, refs: ["CTH 386.1 §4:33"]}
      - {motif: mugawar-invocation-with-offerings, refs: ["CTH 386.1 §2:16-18"], note: "only the call to come to his festival 'in the morning of the day' survives here; no food is named"}
    hints:
      - "Compare Q 27:20-28 (the hoopoe carries Solomon's message) with the goddess who calls the god's message like a bird."
      - "Compare Q 2:115 ('to God belong the east and the west; wherever you turn, there is God's face') and Q 55:17 (Lord of the two easts and two wests), against a god who must be summoned from wherever he roams; also 1 Kgs 18:27 (perhaps he is asleep)."
      - "Compare Q 2:255 (neither slumber nor sleep seizes Him) and Ps 121:4 with waking the god from his dreams."
