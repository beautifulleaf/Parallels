# Full read, chunk 52: Puduḫepa's prayers and the last Hittite prayers (CTH 384-387), then the rituals CTH 390-396.1.1.
# Read from the hethiter.net / TLHdig editions (transliteration by section and Kolon, German translation as a reading aid).
new_motifs:
  one-goddess-different-names-in-lands: {label: "The petitioner says the goddess took one name in one land and another name in another land (Sun goddess of Arinna in Ḫatti, Ḫepat in the land of the cedar)", cluster: divine-names}
  worshipper-calf-of-gods-stall: {label: "The petitioner calls herself a calf of the deity's cattle-stall and a stone of the deity's foundation", cluster: prayer}
  priest-assigned-to-god-by-lot: {label: "A prince is assigned by lot to a god's service as his priest", cluster: cult}
  prayer-framed-as-legal-plea: {label: "The prayer is called a legal plea (Hittite arkuwar), a case presented to the deity as to a judge", cluster: prayer}
  hero-risks-life-to-rebuild-holy-city: {label: "A prince risks his head and life, ignoring warnings that he will die for it, to take and rebuild the god's beloved city", cluster: kingship}
  former-kings-neglected-holy-city: {label: "The petitioner reminds the god that the former kings neglected the god's city and none tried to take it back", cluster: kingship}
  god-yields-to-woman-in-labour-proverb: {label: "Proverb quoted in prayer: 'to the woman of the birth-stool the deity yields'; the petitioner claims to have given herself for the god's son like a woman in labour", cluster: prayer}
  minor-deity-asked-to-forward-prayer: {label: "A lesser deity (child or grandchild of the high gods) is asked to carry the petitioner's words on to the high god and goddess, whose ear they have", cluster: prayer}
  conditional-vow-to-deity: {label: "The petitioner promises a gift if the deity grants the request: 'if you do this, I will give you ...'", cluster: prayer}
  vow-of-life-size-silver-statue: {label: "A silver statue of the king as large as the king himself, with head, hands and feet of gold, is vowed to a goddess for his life", cluster: cult}
  prayer-for-long-years-months-days: {label: "Prayer that the god give the king (and queen) life and long years, months and days", cluster: prayer}
  harmful-words-and-gifts-before-gods-countered: {label: "The petitioner fears someone has turned the gods against the king by evil words or by giving them a gift for his harm, and asks the deity not to listen and to tread the evil words underfoot", cluster: prayer}
  gods-cities-blockaded-festivals-resumed: {label: "The gods' cities had been cut off; now their old festivals of the year and month are celebrated again", cluster: cult}
  enemies-covet-temple-vessels-and-servants: {label: "The enemies covet the gods' silver and gold vessels and their ploughmen, millers and weavers, want to burn the temples and lay waste their fields and gardens", cluster: war}
  king-confesses-curtailing-festivals: {label: "The king confesses he offended the goddess by taking away and curtailing her festivals and promises never to do so again", cluster: prayer}
  festivals-celebrated-in-wrong-season: {label: "Spring festivals and autumn festivals had been interchanged; the king vows to celebrate spring festivals only in spring and autumn festivals only in autumn", cluster: cult}
  lost-divine-image-explained: {label: "The king explains that a divine image went missing in the time of his fathers, not through his own fault", cluster: cult}
  vow-temple-if-victorious: {label: "The king vows that if he defeats the enemy and returns he will go up the god's mountain, give thousands and build the deity a temple", cluster: prayer}
  king-washes-and-robes-for-dawn-rite: {label: "On a clear, cloudless day the king goes at dawn to a pure place, washes, puts on his festive robe and orders that no one bow or speak", cluster: cult}
  water-libated-three-times-before-altar: {label: "Pure water fetched at dawn is poured out three times before the altar and the god and king wash their hands", cluster: cult}
  goddess-gives-king-victorious-spear: {label: "The goddess gives the royal couple a drawn, victorious spear: the surrounding enemy lands shall perish by the hand of the Labarna", cluster: kingship}
  land-grazes-in-hand-of-king: {label: "The land shall graze vigorously in the hand of the king and queen and spread wide", cluster: kingship}
  sun-god-radiant-rays-epithet: {label: "The sun god is hailed as one whose radiance is brilliant and whose rays are bright", cluster: divine-epithets}
  priest-prays-on-temple-roof-at-dawn: {label: "At dawn the priest goes up on the roof of the sun goddess's temple and recites the prayer facing the sun", cluster: cult}
  sea-made-boundary-of-realm: {label: "The king and queen are to make the sea their boundary", cluster: kingship}
  analogic-wish-sweet-and-numerous: {label: "Analogic prayer: as this bread or beer is sweet and this thing numerous, so may the goddess be sweet to the king and queen and their children be numerous", cluster: ritual}
  bird-messenger-wakes-god-from-dreams: {label: "A goddess is to call a pleasant message like a bird to the god and wake him from his sweet dreams", cluster: prayer}
  god-summoned-from-all-places: {label: "The god is summoned with 'come!' from heaven and earth, sunrise and sunset, a list of mountains, rivers, the sea, lands and the four corners", cluster: prayer}
  god-with-father-above-or-mother-below: {label: "The god may be with his father in heaven or with his mother in the dark earth; wherever he is, he is called to his festival", cluster: prayer}
  king-anointed-as-priest-of-god: {label: "The king or prince is anointed for the priesthood of a god's beloved cities", cluster: cult}
  storm-god-gentle-rain-not-withdrawn: {label: "The storm god, the gentle rain of all lands, is asked not to call back to himself the good of the lands, of mankind and the gentle rains", cluster: prayer}
  king-ignored-oracle-and-god-angry: {label: "The king admits he passed over the oracles and the god's word and went his own way, and the god became angry", cluster: prayer}
  gods-hungry-thirsty-wounded-weeping: {label: "The gods are described as thirsty, hungry, wounded and weeping, and the god is called away from them", cluster: prayer}
  son-pleads-innocence-before-angry-father: {label: "The prince pleads he is not to blame for the slander between himself and his royal father and asks that his father's anger toward him be put away", cluster: prayer}
  trial-left-to-god: {label: "The petitioner says he did not decide the case: 'that was the god's lawsuit'", cluster: justice}
  acted-on-anothers-word-not-own: {label: "The petitioner says he carried out a deed at another's command, taking nothing from his own mind", cluster: prayer}
  compensation-promised-to-god: {label: "The petitioner promises to make compensation (šarnink-) for any wrong", cluster: prayer}
  bread-and-message-sent-three-times: {label: "Three thick breads are set out and a message is sent three times to call the god", cluster: cult}
  chariot-left-behind-against-order: {label: "Against the king's order that no chariot be left behind, an officer leaves a chariot; the prince says he did not know and sent one on", cluster: prayer}
  ancestor-took-gods-silver-into-his-house: {label: "When silver and gold were given to all the gods, the petitioner's father gave nothing and took it into his own house", cluster: cult}
units:
  - id: ane-cth-384-1-1-puduhepa-nerik-history
    tradition: ane-hittite
    title: Puduḫepa to the Sun goddess of Arinna, the story of Nerik and Ḫattušili (CTH 384.1 §1-5)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Hittite"
    read: ["CTH 384.1 §1:1-§5:57"]
    tags:
      - {motif: one-goddess-different-names-in-lands, refs: ["CTH 384.1 §2:2-5"], note: "INA KUR URU ḫatti dUTU URUPÚ-na ŠUM-an daišta … kuit KUR-e GIŠERIN-aš iyat nu=z=kan dḫepat ŠUM-an daišta 'in Ḫatti you gave yourself the name Sun goddess of Arinna; in the land you made the land of cedar you gave yourself the name Ḫepat'"}
      - {motif: worshipper-calf-of-gods-stall, refs: ["CTH 384.1 §2:6-8"], note: "annalliš GÉME-KA; ŠA É.GU4-du=za AMAR-uš; šamanaš=ma=ddu=za NA4-aš 'your old servant, a calf of your stall, a stone of your foundation'"}
      - {motif: priest-assigned-to-god-by-lot, refs: ["CTH 384.1 §2:11"], note: "pulaz … ḫaptat 'was allotted by lot' (pulaz partly restored) to the Storm god of Nerik"}
      - {motif: former-kings-neglected-holy-city, refs: ["CTH 384.1 §2:14-19"], note: "ḫantezziuš LUGAL.MEŠ … arḫa pittalaer 'the early kings neglected it'; they had weapons and conquered enemy lands, but no one tried to take Nerik"}
      - {motif: hero-risks-life-to-rebuild-holy-city, refs: ["CTH 384.1 §3:32", "CTH 384.1 §4:39-45"], note: "SAG.DU-an … uššaniškit 'staked his head'; ḫarkan … ḫinkan UL kappuwait 'did not care about his death or ruin'; INA URU nerikka šer aggatar ēpta 'took on death for Nerik'"}
      - {motif: king-restores-neglected-rites, refs: ["CTH 384.1 §5:51-55"], note: "parkunummeni 'we purify ourselves'; išḫiul ḫazziwi 'the gods' ordinances and rites'; annalliuš EZEN4.MEŠ 'the old festivals' of the year and month are celebrated"}
      - {motif: gods-cities-blockaded-festivals-resumed, refs: ["CTH 384.1 §5:54-57"], note: "ištappanteš 'blocked'"}
    hints:
      - "Compare Q 17:110 ('call on God or call on the Merciful: whichever you call, to Him belong the best names') and Q 7:180 with one goddess taking different names in different lands."
      - "Compare Q 2:127-129 and Q 22:26 (Abraham restoring the House) and Neh 2:17-18 with the prince who rebuilds the god's neglected holy city."
      - "Compare 1 Chr 24:5, 31 and Luke 1:9 (priests assigned by lot) and Q 3:44 (lots cast for Mary's guardian)."
  - id: ane-cth-384-1-6-puduhepa-plea-lelwani
    tradition: ane-hittite
    title: Puduḫepa's plea, the woman of the birth-stool, and the vow to Lelwani (CTH 384.1 §6-9)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Hittite"
    read: ["CTH 384.1 §6:58-§9:120"]
    tags:
      - {motif: prayer-framed-as-legal-plea, refs: ["CTH 384.1 §6:58"], note: "kī uttar … arkuwar iyanun 'I made this word as a plea'"}
      - {motif: god-yields-to-woman-in-labour-proverb, refs: ["CTH 384.1 §6:61-64"], note: "ḫarnauwaš=wa MUNUS-nī DINGIR-LUM kāri tiyazi 'to the woman of the birth-stool the deity yields'; ḫarnawaš MUNUS-za … SAG.DU-az piyan ḫarmi 'I have given myself in person'"}
      - {motif: prayer-for-long-years-months-days, refs: ["CTH 384.1 §6:67-68", "CTH 384.1 §8:114-115"], note: "TI-tar pāi 'give life'; MU.ḪI.A ITU.ḪI.A UD.ḪI.A [daluga]eš 'long years, months and days'"}
      - {motif: deathbed-dream-of-divine-assembly, refs: ["CTH 384.1 §6:70-73"], note: "only a partial fit: when all the gods hold [assembly] (tuliya restored), the goddess is to ask for Ḫattušili's life there 'with a sincere mind'"}
      - {motif: harmful-words-and-gifts-before-gods-countered, refs: ["CTH 384.1 §8:102-113"], note: "maninkuwantaš=wa 'of short [life]' was said of him; IŠTU ŠU AMĒLŪTI 'by the hand of a man'; piyan … ḪUL-uanni šer A-NA DINGIR.MEŠ piyan ḫarzi 'has given a gift to the gods for evil'; GÌR.MEŠ-it išparratti 'you trample with the feet'"}
      - {motif: minor-deity-asked-to-forward-prayer, refs: ["CTH 384.1 §8:111", "CTH 384.1 §8:114"], note: "Lelwani is to speak good (parranda memaš-) to the gods; the life of Ḫattušili and Puduḫepa is to come from her mouth before the gods"}
      - {motif: conditional-vow-to-deity, refs: ["CTH 384.1 §9:116-119"]}
      - {motif: vow-of-life-size-silver-statue, refs: ["CTH 384.1 §9:119-120"], note: "ALAM KÙ.BABBAR ŠA mḫattušili … mašiwanza 'a silver statue of Ḫattušili, as large as Ḫattušili', SAG.DU-ZU ŠU.MEŠ-ŠÚ GÌR.MEŠ-ŠÚ ŠA GUŠKIN 'head, hands, feet of gold'"}
    hints:
      - "Compare Q 7:189 (the couple who pray when the pregnancy grows heavy: 'if you give us a good child we will be grateful') and Q 3:35 (Imran's wife vows her unborn) with the conditional vow and the woman in labour."
      - "Compare Q 19:23-26 (Mary in labour at the palm) and Gen 35:16-18 with the woman of the birth-stool to whom the deity yields."
      - "The petitioner's statue vow diverges from Q 7:148 and Q 21:52 (images); compare 1 Sam 6:4-5 (golden images given in place of the afflicted)."
      - "Compare Q 113:4-5 and Q 2:102 (those who work harm through others) with the man who gave the gods a gift for Ḫattušili's harm."
  - id: ane-cth-384-1-10-puduhepa-zintuhi-mezzulla-zippalanda
    tradition: ane-hittite
    title: Zintuḫi, Mezzulla and the Storm god of Zippalanda asked to carry the plea (CTH 384.1 §10-17)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Hittite"
    read: ["CTH 384.1 §10:121-§17:163"]
    tags:
      - {motif: minor-deity-asked-to-forward-prayer, refs: ["CTH 384.1 §11:127-128", "CTH 384.1 §13:132-138", "CTH 384.1 §15:143-149"], note: "parā arnut 'bring (it) further'; to the Storm god 'your grandfather' and the Sun goddess 'your grandmother'; for Mezzulla 'they hear it, they do not turn it back' (UL=at=kan waḫnuwanzi)"}
      - {motif: conditional-vow-to-deity, refs: ["CTH 384.1 §12:129-131", "CTH 384.1 §14:140-142", "CTH 384.1 §16:159-160", "CTH 384.1 §17:161"], note: "a great jewel (unuwašḫan) for Zintuḫi; deportees (NAM.RA) for Mezzulla; a gold shield of two minas (KUŠA-RI-TUM GUŠKIN ŠA 2 MA.NA) for the Storm god of Zippalanda"}
      - {motif: god-yields-to-woman-in-labour-proverb, refs: ["CTH 384.1 §15:150-151"], note: "ḫarnauwaš=za … MUNUS-za … šarninkan ḫarmi 'as a woman of the birth-stool I have made compensation'"}
      - {motif: prayer-framed-as-legal-plea, refs: ["CTH 384.1 §13:136", "CTH 384.1 §15:147", "CTH 384.1 §15:157"]}
      - {motif: hero-risks-life-to-rebuild-holy-city, refs: ["CTH 384.1 §15:153-155"], note: "uššaniškit … kuitman … URU nerikkan … EGIR-pa wetet 'until he had rebuilt Nerik'"}
      - {motif: prayer-for-long-years-months-days, refs: ["CTH 384.1 §11:127"]}
    hints:
      - "The chain of divine go-betweens diverges sharply from Q 39:3 ('we only serve them that they bring us near to God'), Q 10:18 ('these are our intercessors with God') and Q 2:255 (who intercedes except by His leave?)."
      - "Compare 1 Sam 1:11 (Hannah's conditional vow) and Gen 28:20-22 (Jacob: 'if God is with me … I will give a tenth')."
      - "The line §17:163 carries the edition's footnotes run into the text."
  - id: ane-cth-384-2-puduhepa-fragment
