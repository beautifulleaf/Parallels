      - {motif: land-fertile-under-blessed-king, refs: ["CTH 385.10 §8:34"], note: "ḫalkiyaš GEŠTIN.ḪI.A miyatar katta ḫaššaš ḫanzaššaš paiš 'she gave growth of grain and wine down to grandchildren and great-grandchildren'"}
      - {motif: goddess-gives-king-victorious-spear, refs: ["CTH 385.10 §9:35-37"], note: "parā neyantan tarḫuilin GIŠŠUKUR 'a drawn, victorious spear'; araḫzenan … KUR.KUR-TIM labarnaš kiššaraz ḫarkiyettaru 'may the surrounding enemy lands perish by the hand of the Labarna'; the goods to be brought to Ḫattuša and Arinna, šiunan URU-aš 'the cities of the gods'"}
      - {motif: land-grazes-in-hand-of-king, refs: ["CTH 385.10 §10:38-39", "CTH 385.10 §16:59-60"], note: "kiššarī tarru we[ši]ttaru 'may it graze vigorously in the hand'; pa[lḫi]škettaru 'may it spread'"}
