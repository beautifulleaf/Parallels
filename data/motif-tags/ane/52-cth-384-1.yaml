  - id: ane-cth-385-2-prayer-hatti-thrive
    tradition: ane-hittite
    title: Fragment of a prayer for Ḫatti against hostile neighbours (CTH 385.2)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Hittite"
    read: ["CTH 385.2"]
    tags:
      - {motif: land-fertile-under-blessed-king, refs: ["CTH 385.2 §2:3"], note: "KUR URU ḫatti … [ḫal]kit GEŠTIN-it maiškeddu 'may Ḫatti thrive with grain and wine'"}
      - {motif: curse-on-kings-enemies-by-net-and-flood, refs: ["CTH 385.2 §3:4-6", "CTH 385.2 §4:8-12"], note: "only a loose fit: the surrounding (araḫzenaš) lands who seek evil for Ḫatti; the curse itself is broken"}
      - {motif: gods-cities-blockaded-festivals-resumed, refs: ["CTH 385.2 §9:27-28"], note: "EZEN4.ḪI.A-KU-NU duškarat- 'joy at your festivals'; very broken"}
  - id: ane-cth-385-3-prayer-fragment-kingship
    tradition: ane-hittite
    title: Fragment of a prayer, kingship of Ḫatti by the goddess's word (CTH 385.3)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Hittite"
    read: ["CTH 385.3"]
    tags:
      - {motif: god-given-kingship-of-heaven-by-an, refs: ["CTH 385.3 §1:1-3"], note: "only a partial fit: LUGAL-UT-TA ŠA KUR URU ḫatti … tuedaza=at [memiy]anaza 'the kingship of Ḫatti … by your word'"}
  - id: ane-cth-385-4-prayer-fragment-offerings
    tradition: ane-hittite
    title: Fragment of a prayer with offerings and wishes for the royal house (CTH 385.4)
    corpus: ane
