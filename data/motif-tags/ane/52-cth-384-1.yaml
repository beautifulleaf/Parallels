      - {motif: bolt-asked-to-open-dark-earth, refs: ["CTH 395.1 §16:114-123", "CTH 395.1 §17:124-129"], note: "GIŠḫattalwaš GIŠ-rui IŠTU Ì iškizzi 'anoints the bolt-wood with fat'; EGIR-pa ḫaškiši 'you open again'; danku- 'dark' (earth); it zik EGIR-pa ḫāš 'go, open'; taknaš dUTU-un mukiškandu 'let them invoke the Sun goddess of the Earth'"}
      - {motif: conjured-object-worn-seven-days-then-sealed, refs: ["CTH 395.1 §19:137-140", "CTH 395.1 §20:141-146", "CTH 395.1 §22:152-158", "CTH 395.1 §23:162-163"], note: "ḫūganta … nāitta 'you had wrapped the conjured things round you'; all gods call 'nū' to you; INA UD.7.KAM; ŠÀ GIŠPISAN.TÚG.ḪI.A 'in the clothes chest' kuin UL ginuškanzi 'which one does not open'; INA É NA4KIŠIB 'in the seal-house'; namma UL kuiški niniqzi 'no one will stir it again'; on day 9 he washes"}
      - {motif: rite-not-performed-in-palace, refs: ["CTH 395.1 §23:159-161"], note: "tametaš parnaš anda 'in another house'; UL=an INA É.GAL-LIM ēššai 'he does not do it in the palace'; the king does not step in"}
      - {motif: choice-portions-roasted-for-god-rest-eaten, refs: ["CTH 395.1 §18:130-136", "CTH 395.1 §21:147-151"], note: "the suckling piglet's flesh cut off and laid down; wine offered once; the bull's intestines taken; soldier bread and covering bread eaten"}
      - {motif: scribal-colophon, refs: ["CTH 395.1 §24:164", "CTH 395.1 §25:165"], note: "INIM fḪantitaššu LÚ URU Ḫurma QATI; the edition's long apparatus is run into the lines"}
    hints:
      - "Compare 1 Sam 28:7-14 (the woman of Endor brings up a god from the earth; Hebrew ʾôb, cf. Hittite āpi 'pit') and Isa 29:4; Q 2:102 (what was sent down in Babylon) for traffic with the powers below."
      - "Compare Q 34:14 (Solomon's death unknown to the jinn) and Q 72:6 for seeking refuge with powers below; the 'old gods' of the dark earth diverge from Q 6:100."
