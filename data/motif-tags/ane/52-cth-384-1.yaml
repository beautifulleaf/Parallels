      - {motif: king-confesses-curtailing-festivals, refs: ["CTH 385.9 §1:2-5", "CTH 385.9 §1:11-12"], note: "waštaḫḫun 'I sinned'; [z]ammuranun 'I offended'; [EZEN4-a]n arḫa appeškewan teḫḫun 'I took away the festival'; EZEN4.MEŠ karšanunun 'I cut the festivals'; wašdul is only partly preserved in §1:11"}
      - {motif: festivals-celebrated-in-wrong-season, refs: ["CTH 385.9 §1:13-15"], note: "EZEN4.MEŠ ḫamešḫandaš … [zēnand]ašša UL namma waḫnummi 'I will no longer exchange the spring and [autumn] festivals'; ḫamešḫi=pat … zēni=pat ēššaḫḫi 'only in spring … only in autumn will I celebrate'"}
      - {motif: lost-divine-image-explained, refs: ["CTH 385.9 §2:17-24"], note: "DINGIR.MEŠ-tar … GAM paīt 'the divine image went down (was lost)'; INA UD-MI mšuppilu[liuma] 'in the days of Šuppiluliuma'"}
      - {motif: vow-temple-if-victorious, refs: ["CTH 385.9 §1:8-10", "CTH 385.9 §5:40-47"], note: "māan=za LÚKÚR tar[u]ḫmi … ḪUR.SAG tagu[rq]a šer uwami … LI-IM.ḪI.A [p]eḫḫi … parā šarnikmi 'if I defeat the enemy … I will come up on Mount Tagurqa … give thousands … make compensation'; É.DINGIR-LIM DÙ-mi 'I will build a temple' in Arinna"}
      - {motif: conditional-vow-to-deity, refs: ["CTH 385.9 §1:9-10"]}
      - {motif: compensation-promised-to-god, refs: ["CTH 385.9 §5:47"]}
    hints:
      - "Compare Q 9:36-37 (the twelve months, four sacred; al-nasī' shifting the sacred month is an increase in unbelief) with the vow no longer to exchange spring and autumn festivals."
      - "Compare Q 7:23 ('our Lord, we have wronged ourselves') and 2 Sam 24:10 with the king's confession; and Num 21:2 (Israel's vow 'if you give this people into my hand')."
      - "Compare 1 Sam 4-6 (the ark lost in a former generation) with the lost divine image."
  - id: ane-cth-385-10-labarna-sun-prayer-roof
    tradition: ane-hittite
    title: The king's dawn rite and the priest's prayer on the roof of the Sun goddess's temple (CTH 385.10)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Hittite"
    read: ["CTH 385.10"]
    tags:
      - {motif: king-washes-and-robes-for-dawn-rite, refs: ["CTH 385.10 §1:2-8", "CTH 385.10 §2:9-10"], note: "UD-ti pár[ku]i … alpaš N[U.G]ÁL 'on a clear day with no cloud'; šalimani … šuppai 'to the pure šalimani'; arraḫḫi 'I wash'; TÚGNÍG.LÁM 'festive robe'; [ar]uwanzi [l]ē kuiški … memai lē kuiški kuitki 'let no one bow, let no one say anything'"}
      - {motif: water-libated-three-times-before-altar, refs: ["CTH 385.10 §3:11-15", "CTH 385.10 §4:16-19"], note: "wātar parkui 'pure water' brought up with a KUKUBU jug at dawn; 3-ŠÚ šippanta- 'I libate three times'; DINGIR-LUM anku Q[AT]I-ŠU ārri 'the deity washes its hands'; ammuk QATIYA arḫa arraḫḫi 'I wash my hands'"}
      - {motif: land-fertile-under-blessed-king, refs: ["CTH 385.10 §8:34"], note: "ḫalkiyaš GEŠTIN.ḪI.A miyatar katta ḫaššaš ḫanzaššaš paiš 'she gave growth of grain and wine down to grandchildren and great-grandchildren'"}
      - {motif: goddess-gives-king-victorious-spear, refs: ["CTH 385.10 §9:35-37"], note: "parā neyantan tarḫuilin GIŠŠUKUR 'a drawn, victorious spear'; araḫzenan … KUR.KUR-TIM labarnaš kiššaraz ḫarkiyettaru 'may the surrounding enemy lands perish by the hand of the Labarna'; the goods to be brought to Ḫattuša and Arinna, šiunan URU-aš 'the cities of the gods'"}
      - {motif: land-grazes-in-hand-of-king, refs: ["CTH 385.10 §10:38-39", "CTH 385.10 §16:59-60"], note: "kiššarī tarru we[ši]ttaru 'may it graze vigorously in the hand'; pa[lḫi]škettaru 'may it spread'"}
      - {motif: sun-god-radiant-rays-epithet, refs: ["CTH 385.10 §11:40-42"], note: "tuwaddu nepišaš dUTU-ui 'Mercy, Sun god of heaven'; maišzaštiš … mišriwanza 'whose radiance is brilliant'; ḫapparnuwašḫeš … lalukkiuwanteš 'whose rays are bright' (Luwianising)"}
      - {motif: king-unites-en-priesthood-and-kingship, refs: ["CTH 385.10 §11:43-45"], note: "labarnan LÚSANGA-KA 'the Labarna, your priest'; Tawannanna šiwanzannandan 'the god's mother'; mayandaḫḫeški uktūriyaḫḫeški 'make them vigorous, make them lasting'"}
      - {motif: sea-made-boundary-of-realm, refs: ["CTH 385.10 §16:62"], note: "[URU z]alpui … arunan irḫaššan iendu 'in Zalpuwa may they make the sea its boundary'"}
      - {motif: priest-prays-on-temple-roof-at-dawn, refs: ["CTH 385.10 §18:72-73", "CTH 385.10 §19:74-77", "CTH 385.10 §22:86"], note: "LÚSANGA ŠA dUTU URU arinna šuḫḫi=ššan šer ŠA É dUTU … memiškezzi 'the priest speaks on the roof of the Sun's house'; māan lukkatta 'when it grows light'; dUTU-i menaḫḫanda 'facing the Sun'"}
      - {motif: scribal-colophon, refs: ["CTH 385.10 §22:87"], note: "[QA]TI 'finished'; the edition's notes run into the line"}
    hints:
      - "Compare Q 17:78 (the dawn recitation is witnessed) and Q 5:6 (washing before prayer) with the cloudless dawn, washing and silence."
      - "The sun prayer facing the sun at dawn diverges from Q 41:37 ('do not prostrate to the sun or the moon') and Q 27:24 (Sheba bowing to the sun); compare Ezek 8:16 (men facing east bowing to the sun) and Jer 19:13 (offerings on rooftops)."
      - "Compare Q 8:17 ('you did not throw when you threw') and Ps 2:8-9 (nations given to the king) with the goddess's victorious spear."
