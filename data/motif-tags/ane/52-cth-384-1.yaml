      - {motif: god-asked-to-loathe-human-flesh, refs: ["CTH 394 §4:26-30"], note: "IŠTU UZUNÍG.GIG UZUŠÀ Ù IŠTU UZUÚR mekki warkanteš 'very fat in liver, heart and member'; ŠA AMĒLŪTI UZU puktaru 'let the flesh of mankind be hateful (to the god)'"}
      - {motif: officers-bow-behind-substitutes, refs: ["CTH 394 §4:24", "CTH 394 §4:31-32"], note: "A-NA UDU.ŠIR.ḪI.A … QATI-ŠUNU parā tiyanzi 'they stretch their hands toward the rams'; EGIR-an katta ḫinkanzi 'they bow behind'"}
