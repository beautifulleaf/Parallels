      - {motif: people-rebel-against-king, refs: ["ETCSL 2.4.3.1 A:8"], note: "lugal-e uĝ3-e ba-da-an-bal: the people turned against the king"}
      - {motif: temple-left-in-ruins-year-by-year, refs: ["ETCSL 2.4.3.1 A:9-23"], note: "refrain e2-e mu 1-kam-ma ba-an-šub ki-bi-še3 nu-mu-un-gi4 ... mu 7-kam-ma: seven years in ruins; mu 8-kam-ma e2 du3-u3-de3 šu-ni mu-un-ĝar: in the eighth year he set to building; finished by the ninth (A:24-25)"}
      - {motif: temple-built-seven-years, refs: ["ETCSL 2.4.3.1 A:21-25"], note: "here seven years of non-building, then building in the eighth/ninth year"}
      - {motif: king-in-mourning-clothes, refs: ["ETCSL 2.4.3.1 A:12"], note: "lu-bu-uš-tum nam-lugal-la-ka-ni tug2-mu-dur7-ra ba-an-[X]: changed his royal garments (Akkadian lubuštum) for mourning clothes"}
