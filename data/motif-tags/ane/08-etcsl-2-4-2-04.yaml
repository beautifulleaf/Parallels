      - {motif: gods-banquet-and-decree-fates, refs: ["ETCSL 2.4.2.18 B:65-70"], note: "An and Enlil's ancestors greet Ninlil; banquet; šul-gi sipad nidba gal-gal-la-ni; nam mu-ni-in-tar-re-eš2: they decree a fate for the king who fitted out the barge"}
