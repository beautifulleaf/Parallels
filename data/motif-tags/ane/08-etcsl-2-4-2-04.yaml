      - {motif: king-seeks-divine-plan-of-temple, refs: ["ETCSL 2.4.3.1 A:16", "ETCSL 2.4.3.1 A:20", "ETCSL 2.4.3.1 A:22"], note: "abgal-e dug4-ga: advised by a sage; ĝiš-ḫur e2-e mu-un-kiĝ2-kiĝ2-e nu-mu-ni-in-pad3-de3: searched for the plan of the temple but could not find it; {d}en-ki-ke4 e2-bi-še3 ... ba-an-na-dug4: Enki spoke to him about the temple"}
      - {motif: heavenly-pattern-of-sanctuary, refs: ["ETCSL 2.4.3.1 A:20-22"]}
      - {motif: primordial-age-without-wisdom, refs: ["ETCSL 2.4.3.1 B:5-8"], note: "ud-ba nam-lu2-ulu3 šu nu-sag9-ga ... ĝizzal sud-a inim ĝeštug2 nu-dug4 ... šag4 ḫul dim2-dim2 niĝ2-erim2 ak-ak sag9-ga: then evil-doing was held good"}
      - {motif: fame-handed-down-to-distant-days, refs: ["ETCSL 2.4.3.1 seg3:4-5"], note: "lugal-e mu-ni ud su3-ra2-še3 ĝa2-ĝa2-de3: to establish his name for distant days"}
      - {motif: god-decrees-kings-destiny, refs: ["ETCSL 2.4.3.1 E:2"], note: "negated: {d}amar-{d}suen lugal nam-tar-ra-ni ... nu-mu-un-ba-ba: Amar-Suena has not been assigned a fate (from it); text very fragmentary (A:26-32, B:1-4, seg4)"}
