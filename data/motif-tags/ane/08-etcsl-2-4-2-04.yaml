      - {motif: yhwh-my-shepherd, refs: ["ETCSL 2.5.3.2 56"], note: "u2-sal-la ... nu2: lie down in (green) pastures, here of the king's rule"}
      - {motif: scribe-blessed-by-goddess-of-writing, refs: ["ETCSL 2.5.3.2 64-70"], note: "e2-dub-ba-a im-ma muš3 nam-ba-an-tum2-mu: may (wisdom) never cease on the clay in the tablet house; dub-sar-tur šu-ni ib2-ši-in-tum4 im bi2-ib2-sar-a / {d}nisaba ... ĝeštug2 ḫu-mu-un-na-šum2: may Nisaba give wisdom to the junior scribe who writes this"}
      - {motif: dynastic-succession-from-father, refs: ["ETCSL 2.5.3.2 71-72"], note: "ad-da-zu {d}šu-i3-li2-šu lugal kalam-ma-ke4 ... suḫuš-bi mu-ra-an-ge-en: your father Šu-ilīšu made the foundation firm for you"}
    hints:
      - "Compare Ps 23:2 (he makes me lie down in green pastures), Ezek 34:14-15 and Ps 72:6-17 (the ideal king's reign of abundance and justice)."
      - "Compare Lam 4:20 (the anointed, the breath of our nostrils, under whose shadow we live) and Prov 16:15 (in the light of the king's face is life)."
      - "Compare 1 Kgs 3:12 and 5:9 (God gives the king wisdom and breadth of heart)."
  - id: ane-etcsl-2-5-3-3-ningublaga-adab
    tradition: ane-sumerian
    title: "Iddin-Dagan C: adab to Ningublaga, the wild bull who devastates the rebel lands"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Sumerian"
    read: ["ETCSL 2.5.3.3"]
    tags:
      - {motif: god-piles-up-skulls, refs: ["ETCSL 2.5.3.3 A.B:6-9"], note: "ki-bal-a gu3 ra-ra saĝ ḫuš-bi bi2-tu10: roaring in the rebel lands you angrily piled up skulls; in-dal-bi an-na ba-e-ed3: scattered their chaff heavenward"}
      - {motif: enemy-protective-gods-turn-away, refs: ["ETCSL 2.5.3.3 A.B:10-13"], note: "{d}lamma-bi mu-u8-ta-gub: their protective gods alienated; ĝiri3 kur2 im-mi-dab5: made to follow another path"}
      - {motif: mountains-given-to-ghostly-winds, refs: ["ETCSL 2.5.3.3 A.B:14-17"], note: "kur-bi za-e ša-mu-u8-tab-en tum9 lil2-e bi2-tum3: you flatten those mountains and turn them over to the ghostly winds"}
      - {motif: king-animal-epithets-bull-lion-dragon, refs: ["ETCSL 2.5.3.3 A.B:8", "ETCSL 2.5.3.3 B.E:9-11"], note: "of the god: sumun2 zid: vigorous wild bull; ur-maḫ: lion"}
      - {motif: god-of-justice-gives-verdicts, refs: ["ETCSL 2.5.3.3 B.E:13-16"], note: "{d}aš-im2-babbar-gin7 di si sa2 kud-kud: like Ašimbabbar gives correct verdicts; ud-gin7: like sunlight"}
      - {motif: divine-son-intercedes-with-father-god, refs: ["ETCSL 2.5.3.3 A.D:28-31", "ETCSL 2.5.3.3 B.E:17-20"], note: "{d}i-din-{d}da-gan {d}nanna-ar X-dug4: he has spoken to Nanna on behalf of Iddin-Dagan; soothing Nanna's heart each day"}
      - {motif: king-clothed-in-royal-robe-by-god, refs: ["ETCSL 2.5.3.3 B.E:5-8"], note: "inim {d}suen-na nam-lugal-še3 šum2-ma / {d}aš-im2-babbar-re tug2 tug2-ba13 mu4-mu4: whom Ašimbabbar clothed in the royal robe"}
      - {motif: warrior-god-as-flood-and-battering-ram, refs: ["ETCSL 2.5.3.3 B.G:28-30"], note: "ku-kur dugud gaba-ri-bi-še3 nu-e3: formidable flood that no man opposes; ḫul-du-ni ĝiš-gaz-bi ḫe2-me-en: be the crusher of his enemies"}
    hints:
      - "Compare Ps 1:4 and 35:5 (the wicked like chaff the wind drives away), Isa 17:13."
      - "Compare Zech 3:4-5 and Isa 61:10 (clothed in festal garments by God)."
  - id: ane-etcsl-2-5-3-4-namerima
    tradition: ane-sumerian
    title: "Iddin-Dagan D: namerima incantation-hymn to Ninisina, An, Enlil, Ninlil and Aruru against the king's enemies"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Sumerian"
    read: ["ETCSL 2.5.3.4 1-85"]
    tags:
      - {motif: healing-goddess-with-scalpel, refs: ["ETCSL 2.5.3.4 1-2", "ETCSL 2.5.3.4 8-9"], note: "nin gal a-zu maḫ saĝ gig2-ga: great lady, majestic physician of the black-headed; ĝiri2-zal bulug-kiĝ2-gur4: scalpel and lancet, knives like lion's claws"}
      - {motif: god-the-healer, refs: ["ETCSL 2.5.3.4 1"]}
      - {motif: goddess-as-raging-storm-and-lion, refs: ["ETCSL 2.5.3.4 3-17"], note: "ud mir-a-gin7: like a raging storm; {d}gibil6-gin7 igi ḫuš: face like fire; šu piriĝ-ĝa2 ... umbin uš2 biz-biz-biz: lion's paws, claws dripping blood; ud ka-bi-ta aḫ6: storm whose mouth spews spittle and venom"}
      - {motif: god-like-lion-over-prey, refs: ["ETCSL 2.5.3.4 11", "ETCSL 2.5.3.4 17-18"], note: "piriĝ šeg12 gi4-gi4 erim2-e gu2 kud-da: roaring lion cutting the enemy's neck; es2-ad maḫ-gin7 ḫul-še3 nu2-a: like a great snare lying in wait for the evil-doer"}
      - {motif: lady-of-the-living-and-dead, refs: ["ETCSL 2.5.3.4 21", "ETCSL 2.5.3.4 26"], note: "nin til3-la ug5-ga zi kalam-ma šu du8: lady of the living and the dead, who holds the life of the land in her hand; nin til3 mud kalam-ma: life-creator of the land"}
      - {motif: god-kills-and-makes-alive, refs: ["ETCSL 2.5.3.4 21"]}
      - {motif: goddess-wrath-like-sea-flood, refs: ["ETCSL 2.5.3.4 35-38"], note: "šag4 mir-a-ni lu2 nu-te-en-te-en: her raging heart none can cool; a-ab-ba-gin7 ku-kur um-de6 lu2-erim2 ba-an-na8-na8: like the sea bringing a flood-wave she drowns the foe"}
      - {motif: city-made-eternal-tell, refs: ["ETCSL 2.5.3.4 40-43"], note: "iri ka tar-ra-zu ki-bi nu-gi4: the city you curse is not restored; du6-du6-da ma-ra-an-šid: turned into ruin-mounds; lu2 nu-mu-ni-in-dib-be2: no one moves about in the land you curse"}
      - {motif: refrain-let-not-enemy-carry-off-your-name, refs: ["ETCSL 2.5.3.4 55-56", "ETCSL 2.5.3.4 63-64", "ETCSL 2.5.3.4 71-72", "ETCSL 2.5.3.4 79-80"], note: "mu-zu lu2-erim2-e nam-ba-an-tum3 / a mu-zu ... a mu-zu: let not the enemy carry away your name, O your name! -- to Ninisina, An, Enlil, Ninlil"}
      - {motif: curse-on-kings-enemies-by-net-and-flood, refs: ["ETCSL 2.5.3.4 54", "ETCSL 2.5.3.4 62", "ETCSL 2.5.3.4 70"], note: "lu2-lul {d}i-din-{d}da-gan-na ... {sa}šu2-uš-gal-gin7 ḫu-mu-un-šu2: may the deceivers of Iddin-Dagan be overwhelmed as by a battle-net; lu2 ĝiri3 ... nu-mu-un-dab5-ba a-gin7 ḫu-mu-su-su: may those who do not clasp his feet be drowned as by water"}
      - {motif: prohibition-false-oath-by-name, refs: ["ETCSL 2.5.3.4 75-78"], note: "lugal mu-zu lul-e-eš pad3-de3-de3: the king who dares to utter your name falsely ... nam-tag dugud ... e-ne-ra il2: make him bear heavy guilt; ki šer7-da {d}id2-lu2-ru-gu2 kalam-ma: the land's river of ordeal at the place of transgression"}
      - {motif: river-ordeal-clears-the-just, refs: ["ETCSL 2.5.3.4 76"]}
      - {motif: father-of-the-gods-an, refs: ["ETCSL 2.5.3.4 57"], note: "an maḫ-di a-a diĝir-re-e-ne: sublime An, father of the gods; šag4 su3-ra2: patient-hearted"}
      - {motif: immutable-divine-word, refs: ["ETCSL 2.5.3.4 65", "ETCSL 2.5.3.4 81"], note: "{d}en-lil2 me gal-gal sag2 nu-di; {d}a-ru-ru me sag2 nu-di; text breaks off after 85"}
    hints:
      - "Compare Exod 15:26 (I am YHWH your healer) and Deut 32:39 (I kill and make alive, I wound and I heal)."
      - "Compare Exod 20:7 (you shall not take the name in vain, for YHWH will not hold guiltless) and Lev 19:12."
      - "Compare Josh 7:9 and Ps 74:10,18 (what will you do for your great name? shall the enemy revile your name forever?)."
      - "Compare Hos 13:7-8 and Lam 3:10 (God like a lion, a bear lying in wait)."
