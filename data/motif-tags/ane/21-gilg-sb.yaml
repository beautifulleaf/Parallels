# Full read of the ANE corpus, chunk 21: Gilg SB (Standard Babylonian Gilgameš, Tablets I-XII). Read from the eBL reconstructed normalized text, with eBL's English translation as a reading aid.
new_motifs:
  hero-who-saw-the-deep: {label: "The hero is introduced as the one who saw the Deep (nagbu) and knew the totality of wisdom", cluster: wisdom}
  hidden-knowledge-from-before-flood: {label: "A sage-hero uncovers secret, hidden things and brings back knowledge from the age before the flood", cluster: wisdom}
  heros-toils-written-on-stone: {label: "The hero's toils and adventures are inscribed on a stone stele for posterity", cluster: wisdom}
  story-read-from-lapis-tablet-in-cedar-box: {label: "The reader is told to open a cedar tablet-box with bronze clasps and read the hero's story aloud from a lapis lazuli tablet", cluster: wisdom}
  walk-around-city-wall-and-inspect: {label: "The audience is invited to climb the city wall, walk around it and inspect its foundations and brickwork", cluster: city}
  seven-sages-laid-foundations: {label: "The city's foundations were laid by the Seven Sages (apkallū) of the primeval age", cluster: wisdom}
  city-area-measured: {label: "The area of a city, with its gardens, clay-pits and temple, is given in exact measures", cluster: city}
  hero-two-thirds-god: {label: "The hero is two-thirds god and one-third human", cluster: heroes}
  giant-hero-dimensions: {label: "The hero's giant body is measured in cubits (height eleven cubits, chest four cubits, stride six cubits)", cluster: heroes}
  gods-shape-heros-body: {label: "Gods (the mother goddess and the wise god) design and perfect the hero's body before birth", cluster: creation}
  hero-searches-for-life: {label: "The hero roams the regions of the world searching for (eternal) life", cluster: immortality}
  hero-restores-cult-after-flood: {label: "The hero restores the cult-centres destroyed by the flood and re-establishes the rites for humankind", cluster: flood}
  people-complain-to-gods-of-king: {label: "The oppressed people's complaint about their king reaches the gods, who act on it", cluster: kingship}
  king-takes-brides-before-grooms: {label: "The tyrant king lets no girl go free to her bridegroom (claims the bride before the husband)", cluster: kingship}
  counterpart-created-to-match-hero: {label: "The gods create a rival equal to the overbearing hero, so that they contend and the city may have rest", cluster: creation}
  wild-man-lives-with-beasts: {label: "A wild man, hairy and naked, eats grass with the gazelles and drinks at the water-hole with the herds", cluster: primeval}
  wild-man-frees-trapped-animals: {label: "The wild man fills in the hunter's pits, tears up his snares and frees the animals", cluster: primeval}
  harlot-tames-wild-man: {label: "A harlot is sent to the water-hole to seduce the wild man and estrange him from the animals", cluster: primeval}
  intercourse-six-days-seven-nights: {label: "The wild man couples with the woman for six days and seven nights", cluster: sexuality}
  wild-man-loses-animal-kinship-gains-understanding: {label: "After intercourse the animals flee the wild man; he is weakened and slower but has gained reason and understanding", cluster: primeval}
  you-are-like-a-god: {label: "The woman tells the man he has become 'like a god' and leads him from the wild to the city", cluster: primeval}
  dream-of-object-fallen-from-sky: {label: "A dream of a star or rock fallen from the sky that the dreamer cannot lift, and which he loves like a wife", cluster: dreams}
  mother-interprets-sons-dreams: {label: "The hero's wise divine mother interprets his dreams for him", cluster: dreams}
  dream-foretells-coming-friend: {label: "Dreams foretell the arrival of a mighty companion who will be the hero's friend and saviour", cluster: dreams}
  love-of-friend-like-wife: {label: "The hero loves his male friend 'like a wife', caressing and embracing him", cluster: friendship}
  hero-opens-mountain-passes-and-digs-wells: {label: "The culture-hero opens passes through the mountains and digs wells on the hillsides", cluster: heroes}
  hunter-meets-wild-man-at-water-hole: {label: "A hunter or trapper encounters the wild man at the animals' water-hole and is terrified", cluster: primeval}
  arrival-on-third-day: {label: "Travellers reach their destination on the third day of the journey", cluster: travel}
  woman-leads-man-from-wild: {label: "The woman who tamed the wild man clothes and leads him from the wilderness to the city and its people", cluster: primeval}
  wild-man-challenges-king: {label: "The newly civilised wild man resolves to go to the city and challenge its overbearing king", cluster: heroes}
  city-of-daily-festival-and-harlots: {label: "The city is praised as a place of daily festival, drums and comely harlots", cluster: city}
  harlot-clothes-wild-man: {label: "The woman shares her garments with the naked wild man, clothing him", cluster: primeval}
  wild-man-taught-bread-and-beer: {label: "The wild man, who knew only milk and grass, is taught to eat bread and drink beer, the staff of human life", cluster: civilization}
  wild-man-becomes-shepherds-watchman: {label: "The civilised wild man guards the shepherds' flocks at night, driving off wolves and lions", cluster: primeval}
  hero-blocks-door-of-wedding-house: {label: "The newcomer blocks the door of the wedding house to stop the king entering before the groom, and they wrestle", cluster: heroes}
  rivals-wrestle-then-become-friends: {label: "Two equal heroes fight, then embrace and become friends", cluster: friendship}
  friend-has-no-kin: {label: "The hero's friend, born in the wild, has no father, mother, brother or kin", cluster: friendship}
  hero-proposes-perilous-expedition: {label: "The king proposes a perilous expedition to the distant cedar forest to slay its monstrous guardian", cluster: heroes}
  monster-appointed-by-high-god-to-guard-forest: {label: "The high god appointed the forest monster as guardian of the cedars, a terror to people", cluster: heroes}
  monster-voice-flood-mouth-fire-breath-death: {label: "The monster's roar is the Deluge, his mouth fire, his breath death", cluster: heroes}
  human-days-numbered-deeds-wind: {label: "Man's days are numbered and all his deeds are but wind", cluster: wisdom}
  fame-better-than-long-life: {label: "Since humans must die anyway, the hero prefers to die gloriously and leave an eternal name", cluster: heroes}
  giant-weapons-cast-for-expedition: {label: "The heroes have axes and swords of enormous weight (talents each) cast at the forge", cluster: heroes}
  elders-warn-young-king: {label: "The city's elders warn the young, rash king against his plan: 'you are young and do not know what you are talking about'", cluster: kingship}
  hero-seeks-assemblys-blessing-for-journey: {label: "The king asks the city's young men or elders to bless him before setting out, promising festivals on his safe return", cluster: kingship}
  strong-hero-weeps-in-fear: {label: "The mighty companion sits down weeping, his eyes fill with tears, his arms fall limp and terror enters his heart", cluster: heroes}
  do-not-trust-in-own-strength: {label: "Counsel to the hero: do not trust in the fullness of your own strength", cluster: wisdom}
  one-who-knows-the-road-goes-ahead: {label: "Proverb: he who goes in front saves his comrade; he who knows the road guards his friend", cluster: wisdom}
  king-entrusted-to-companion: {label: "The assembly formally entrusts the king to his companion, who must bring him back safely", cluster: kingship}
  mother-purifies-and-prays-on-roof: {label: "The hero's mother bathes, dresses, climbs to the roof, offers incense to the sun god and raises her arms in prayer", cluster: cult}
  god-gave-hero-restless-heart: {label: "A mother complains to the god that he gave her son a restless heart that drives him to danger", cluster: heroes}
  sun-god-sends-winds-against-monster: {label: "The sun god is asked to raise a list of named winds (thirteen) against the monster so that his face is darkened", cluster: heroes}
  long-days-short-nights-for-journey: {label: "Blessing on the traveller: may the days be long and the nights short, his loins girt and his stride long", cluster: travel}
  goddess-adopts-heros-friend: {label: "The hero's divine mother adopts his friend as her son, putting a token on his neck", cluster: family}
  hero-deified-like-the-gods: {label: "A hero is promised a place among the gods: sharing heaven with the sun, a sceptre with the moon, or dwelling with the netherworld gods", cluster: immortality}
  slay-the-evil-the-god-hates: {label: "The expedition aims to destroy from the land the evil thing that the god hates", cluster: heroes}
  officials-kiss-feet-of-departing-king: {label: "The officials kiss the departing king's feet and the people run after him with blessings", cluster: kingship}
  sun-god-dawn-light-on-herds: {label: "At sunrise the sun god opens the way for the herds to go out and all creatures and gods wait for his light", cluster: cult}
  foundling-raised-by-temple-women: {label: "A foundling is taken in and brought up by temple priestesses and votaries", cluster: family}
  incense-and-juniper-offered: {label: "Incense and juniper are burned as an offering before a deity", cluster: cult}
  journey-stages-formula: {label: "Refrain of the journey: at twenty leagues they broke bread, at thirty they camped, fifty leagues a day, a month and a half's march in three days", cluster: travel}
  mountain-asked-for-dream: {label: "The hero climbs a mountain, offers flour to it and asks it to bring him a dream with a favourable message from the god", cluster: dreams}
  dream-shelter-and-drawn-circle: {label: "A companion builds a shelter against the wind (house of Zaqīqu) and lays the dreamer down in a circle drawn on the ground", cluster: dreams}
  dreamer-wakes-did-god-pass-by: {label: "The dreamer wakes at night asking: did you call me? did you touch me? did a god pass by? why is my flesh numb?", cluster: dreams}
  dream-mountain-falls: {label: "In a dream a mountain collapses on the travellers", cluster: dreams}
  dream-heaven-cries-earth-rumbles-death-rains: {label: "In a dream the heavens roar, the earth rumbles, darkness falls, lightning flashes and death rains down until the fire goes out and turns to ash", cluster: dreams}
  companion-reinterprets-bad-dreams-as-good: {label: "The companion interprets each frightening dream as favourable, foretelling victory over the enemy", cluster: dreams}
  series-of-five-dreams: {label: "The hero has a series of numbered dreams (first, second, third, fourth, fifth) on successive nights of the journey", cluster: dreams}
units:
  - id: ane-gilg-sb-i-prologue
    tradition: ane-akkadian
    title: "Prologue: he who saw the Deep; the wall of Uruk and the lapis tablet (Gilgameš SB I)"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    version: Standard Babylonian
    read: ["Gilg SB I:1-28"]
    tags:
      - {motif: hero-who-saw-the-deep, refs: ["Gilg SB I:1-6"], note: "ša nagba īmuru išdī māti ... naphar nēmeqi ša kalāmi īde (incipit restored from I:3)"}
      - {motif: hidden-knowledge-from-before-flood, refs: ["Gilg SB I:7-8"], note: "niṣirta īmur-ma katimta ipte, ubla ṭēma ša lām abūbi: he saw the secret, opened the hidden, brought a report from before the Deluge"}
      - {motif: heros-toils-written-on-stone, refs: ["Gilg SB I:9-10"], note: "šakin ina narî kalu mānahti"}
      - {motif: story-read-from-lapis-tablet-in-cedar-box, refs: ["Gilg SB I:24-28"], note: "tupšenna ša erēni ... ṭuppi uqnî šitassi; lid 'of its secret' (bāba ša niṣirtīšu)"}
      - {motif: walk-around-city-wall-and-inspect, refs: ["Gilg SB I:13-21"], note: "elī-ma ina muhhi dūri ša uruk itallak, temmēna hīṭ-ma libitta ṣubbi"}
      - {motif: seven-sages-laid-foundations, refs: ["Gilg SB I:21"], note: "uššīšu lā iddû sebet muntalkū"}
      - {motif: city-area-measured, refs: ["Gilg SB I:22-23"], note: "šār city, šār date-grove, šār clay-pit, half šār temple of Ištar: 3½ šār"}
      - {motif: king-builds-palace-temple-walls, refs: ["Gilg SB I:11-12"], note: "uppiš dūra ša uruk supūri"}
    hints:
      - "Compare Ps 48:13-14 (walk about Zion, count her towers, consider her ramparts, to tell the next generation) with I:18-21."
      - "Knowledge from before the flood: compare Enoch (Gen 5:21-24) and Josephus Ant. 1.70-71 (antediluvian wisdom on two pillars); seven sages compare Prov 9:1 (wisdom's seven pillars)."
      - "The hero's story written in a book: compare Q 18:9 (al-Raqīm, the inscription) and Deut 27:2-8 (words written on plastered stones)."

  - id: ane-gilg-sb-i-gilgamesh-praised
    tradition: ane-akkadian
    title: "Hymn to Gilgameš: two-thirds god, eleven cubits tall, the far traveller (Gilgameš SB I)"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    version: Standard Babylonian
    read: ["Gilg SB I:29-60"]
    tags:
      - {motif: king-as-wild-bull-calf-of-divine-cow, refs: ["Gilg SB I:30", "Gilg SB I:35-36"], note: "rīmu muttakpu; rīmu ša lugalbanda ... ēniq arhi ṣīrti rīmat-ninsun: suckling of the exalted cow, Wild-Cow Ninsun"}
      - {motif: king-born-of-deity, refs: ["Gilg SB I:35-36", "Gilg SB I:48"]}
      - {motif: hero-two-thirds-god, refs: ["Gilg SB I:48"], note: "šittāšu ilum-ma šulultašu amēlūtu"}
      - {motif: gods-shape-heros-body, refs: ["Gilg SB I:49-50"], note: "ṣalam pagrīšu bēlet-ilī uṣṣir, ulteṣbi gattašu nudimmud"}
      - {motif: giant-hero-dimensions, refs: ["Gilg SB I:52-56"], note: "ištēššeret ina ammati (11 cubits), chest [4] cubits partly restored, foot a nikkas, leg half a rod, stride 6 cubits"}
      - {motif: giants-offspring-of-gods, refs: ["Gilg SB I:48", "Gilg SB I:52"], note: "interpretive: a giant hero born of a goddess (Ninsun) and a human king (Lugalbanda)"}
      - {motif: hero-searches-for-life, refs: ["Gilg SB I:41"], note: "hāyyiṭ kibrāti mušteʾʾû balāṭi"}
      - {motif: hero-visits-flood-survivor, refs: ["Gilg SB I:40", "Gilg SB I:42"], note: "ēbir ayyabi tâmati rapašti adi ṣīt šamsi; kāšid dannussu ana ūta-napišti rūqi"}
      - {motif: hero-restores-cult-after-flood, refs: ["Gilg SB I:43-44"], note: "mutēr māhāzī ana ašrīšunu ša uhalliqu abūbu, mukīn parṣī ana nišī apâti"}
      - {motif: incomparable-king, refs: ["Gilg SB I:45-46"], note: "mannu ša ittīšu iššannanu ana šarrūti ... anākū-ma šarru"}
      - {motif: hero-opens-mountain-passes-and-digs-wells, refs: ["Gilg SB I:38-39"], note: "pētû nērebēti ša hursānī, hērû būrī ša kišād šadî"}
      - {motif: new-exodus-not-in-haste, refs: ["Gilg SB I:31-34"], note: "interpretive: the leader who goes in front and is also the rear guard (illak ina pāni ... arka illak); illak ina pāni ašarēdu, arka illak tukulti ahhīšu; agû ezzu 'raging flood-wave'"}
    hints:
      - "Giant offspring of divine-human union: Gen 6:4 (the Nephilim, 'men of renown', gibborim); compare Og's bed of nine cubits (Deut 3:11) and Goliath six cubits (1Sam 17:4)."
      - "The leader going out and coming in before his people: Num 27:17; 1Sam 18:16."
      - "Wells dug by the hero: compare Isaac's wells, Gen 26:18-22."

  - id: ane-gilg-sb-i-oppression-and-enkidu-created
    tradition: ane-akkadian
    title: "Gilgameš oppresses Uruk; the gods hear and Aruru creates Enkidu from clay (Gilgameš SB I)"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    version: Standard Babylonian
    read: ["Gilg SB I:61-112"]
    tags:
      - {motif: king-oppresses-young-men-of-city, refs: ["Gilg SB I:63-67", "Gilg SB I:80-84"], note: "ina pukki tebû rūʾūšu: his companions kept on their feet by the ball; ul umaššar gilgāmeš māra ana abīšu"}
      - {motif: king-takes-brides-before-grooms, refs: ["Gilg SB I:70", "Gilg SB I:74", "Gilg SB I:89"], note: "ul umaššar gilgāmeš batulta ana mutīša (partly restored at I:74, preserved at I:89)"}
      - {motif: deity-chooses-shepherd-king-in-assembly, refs: ["Gilg SB I:69", "Gilg SB I:85-87"], note: "ironic: šū rēʾûm-ma ša uruk supūri, the shepherd who does not let his flock go"}
      - {motif: people-complain-to-gods-of-king, refs: ["Gilg SB I:72", "Gilg SB I:76-79", "Gilg SB I:91"], note: "tazzimtašina ištenemme ānu: Anu kept hearing their complaint"}
      - {motif: counterpart-created-to-match-hero, refs: ["Gilg SB I:92-96"], note: "ana ūm libbīšu lū mahir, lištannanū-ma uruk liš[tapših]"}
      - {motif: god-fashions-creature-from-clay, refs: ["Gilg SB I:99-101"], note: "arūru imtasi qātīša, ṭīda iktariṣ ittadi ina ṣēri: she washed her hands, nipped off clay, threw it in the wild"}
      - {motif: pinched-off-from-clay, refs: ["Gilg SB I:100"], note: "ṭīda iktariṣ, the same verb as Job 33:6 qoratsti"}
      - {motif: human-formed-from-earth, refs: ["Gilg SB I:100-101"]}
      - {motif: wild-man-lives-with-beasts, refs: ["Gilg SB I:103-110"], note: "šuʾʾur šārta kalu zumrīšu ... itti ṣabâtim-ma ikkala šammī; lā īde nišī u mātam-ma"}
      - {motif: ishmael-wild-ass-of-a-man, refs: ["Gilg SB I:106-110"], note: "loose: a man of the wild living among the animals, ignorant of people"}
      - {motif: hunter-meets-wild-man-at-water-hole, refs: ["Gilg SB I:111-112"], note: "ṣayyādu hābilu amēlu ina pūt mašqî šâšu uštamhiršu"}
    hints:
      - "Creation of a man from a pinch of clay: Gen 2:7; Job 33:6 (qoratsti, 'I too was nipped from clay'); Q 15:26-28, 38:71-72."
      - "The cry of the oppressed reaching heaven: Exod 2:23-25, 3:7; Gen 18:20-21."
      - "Enkidu among the beasts eating grass: compare Nebuchadnezzar in Dan 4:22, 4:29-30 and Ishmael 'a wild ass of a man' Gen 16:12; Esau the hairy man of the field Gen 25:25-27."
      - "The king who takes your daughters and sons: 1Sam 8:11-17."

  - id: ane-gilg-sb-i-hunter-and-shamhat
    tradition: ane-akkadian
    title: "The trapper, his father's counsel and the sending of Šamḫat (Gilgameš SB I)"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    version: Standard Babylonian
    read: ["Gilg SB I:113-175"]
    tags:
      - {motif: hunter-meets-wild-man-at-water-hole, refs: ["Gilg SB I:113-119"], note: "three days running; his face froze, uštahrirū panūšu"}
      - {motif: wild-man-frees-trapped-animals, refs: ["Gilg SB I:128-131", "Gilg SB I:155-158"], note: "umtalli būrī ... uttassih nuballīya"}
      - {motif: harlot-tames-wild-man, refs: ["Gilg SB I:138-143", "Gilg SB I:160-164"], note: "harimta šamhat; lišhuṭ lubūšīšā-ma liptâ kuzubša; inakkiršu būlšu"}
      - {motif: wise-father-instructs-son, refs: ["Gilg SB I:132-144"], note: "the trapper follows milki ša abīšu"}
      - {motif: messenger-repeats-message-verbatim, refs: ["Gilg SB I:147-158"], note: "the trapper repeats his speech to Gilgameš word for word"}
      - {motif: arrival-on-third-day, refs: ["Gilg SB I:165-167"], note: "ina šalši ūmi ina eqel adanni iktaldūni"}
      - {motif: wild-man-lives-with-beasts, refs: ["Gilg SB I:170-175"]}
    hints:
      - "A woman sent to undo a strong man: Judg 14:15-17, 16:4-21 (Delilah and Samson)."

  - id: ane-gilg-sb-i-enkidu-humanised
    tradition: ane-akkadian
    title: "Šamḫat and Enkidu: six days and seven nights, the animals flee, 'you are like a god' (Gilgameš SB I)"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    version: Standard Babylonian
    read: ["Gilg SB I:176-212"]
    tags:
      - {motif: harlot-tames-wild-man, refs: ["Gilg SB I:176-191"], note: "rummî kirimmīki, ūrki pitê-ma; she spread her clothing and he lay on her"}
      - {motif: intercourse-six-days-seven-nights, refs: ["Gilg SB I:192"], note: "šeššet urrī u sebe mušâti enkīdu tebī-ma šamhat irehhi"}
      - {motif: wild-man-loses-animal-kinship-gains-understanding, refs: ["Gilg SB I:195-200"], note: "ultahhi enkīdu ullula pagaršu ... umtaṭṭi ... u šū īši uzna rapaš hasīsa"}
      - {motif: eyes-opened-nakedness-known, refs: ["Gilg SB I:197-200"], note: "interpretive: sexual knowledge leads to loss of innocence with nature and to wisdom (uzna, hasīsa)"}
      - {motif: humans-become-like-gods, refs: ["Gilg SB I:205"], note: "damqāta enkīdu kīma ili tabašši"}
      - {motif: you-are-like-a-god, refs: ["Gilg SB I:205-210"], note: "alka luttarrūka ana libbi uruk supūri ana bīti elli mūšab ānu u ištar"}
      - {motif: woman-leads-man-from-wild, refs: ["Gilg SB I:201-212"], note: "mūdû libbašu išeʾʾâ ibra: his heart, now wise, sought a friend"}
    hints:
      - "Gen 3:5-7, 3:22 (knowing good and evil, 'like God', eyes opened, nakedness) and Gen 2:18-24 (the woman as companion); Enkidu later curses Šamḫat (VII) as Adam blames the woman (Gen 3:12)."
      - "Six days and seven nights: compare the creation week (Gen 2:2) and the seven-day feasts (Judg 14:12-17)."

  - id: ane-gilg-sb-i-invitation-and-dreams
    tradition: ane-akkadian
    title: "Šamḫat describes Uruk and tells Gilgameš's dreams of the star and the axe (Gilgameš SB I)"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    version: Standard Babylonian
    read: ["Gilg SB I:213-298"]
    tags:
      - {motif: wild-man-challenges-king, refs: ["Gilg SB I:218-221"], note: "anāku lugrīšum-ma ... anākū-mi dannu; šīmata unakkar (restored)"}
      - {motif: city-of-daily-festival-and-harlots, refs: ["Gilg SB I:224-230"], note: "ūmišam-ma šakin isinnu, urtaṣṣanū alû, ardāti šūsumā binûta"}
      - {motif: sun-god-companion-of-king-in-battle, refs: ["Gilg SB I:239-240"], note: "gilgāmeš šamaš irāmšu; anu ellil u ea urappišū uzunšu"}
      - {motif: dream-of-object-fallen-from-sky, refs: ["Gilg SB I:244-256"], note: "kakkabū šamê ... kīma kiṣri ša āni imtaqquta elu ṣērīya; unaššaqū šēpīšu"}
      - {motif: doubled-dream-certainty, refs: ["Gilg SB I:271-283"], note: "šanīta ītamar šunassu: the axe (haṣṣinnu) lying in the street of Uruk"}
      - {motif: mother-interprets-sons-dreams, refs: ["Gilg SB I:257-270", "Gilg SB I:284-291"], note: "rīmat-ninsun emqet mūdât kalāma īde"}
      - {motif: dream-interpreted-item-by-item, refs: ["Gilg SB I:286"], note: "mārī haṣinnu ša tāmuru amēlu"}
      - {motif: dream-foretells-coming-friend, refs: ["Gilg SB I:266-270", "Gilg SB I:289-295"], note: "illakakkum-ma dannu tappû mušēzib ibri; ibra mālika anāku lurši"}
      - {motif: love-of-friend-like-wife, refs: ["Gilg SB I:254", "Gilg SB I:265", "Gilg SB I:269", "Gilg SB I:287"], note: "kīma aššati elīšu ahbub"}
    hints:
      - "Dreams told to a parent and interpreted: Gen 37:5-11 (Joseph's dreams, his father's rebuke); doubled dreams Gen 41:32."
