# Full read of the ANE corpus, chunk 21: Gilg SB (Standard Babylonian Gilgameš, Tablets I-XII). Read from the eBL reconstructed normalized text, with eBL's English translation as a reading aid.
new_motifs:
  hero-who-saw-the-deep: {label: "The hero is introduced as the one who saw the Deep (nagbu) and knew the totality of wisdom", cluster: wisdom}
  hidden-knowledge-from-before-flood: {label: "A sage-hero uncovers secret, hidden things and brings back knowledge from the age before the flood", cluster: wisdom}
  heros-toils-written-on-stone: {label: "The hero's toils and adventures are inscribed on a stone stele for posterity", cluster: wisdom}
  story-read-from-lapis-tablet-in-cedar-box: {label: "The reader is told to open a cedar tablet-box with bronze clasps and read the hero's story aloud from a lapis lazuli tablet", cluster: wisdom}
  walk-around-city-wall-and-inspect: {label: "The audience is invited to climb the city wall, walk around it and inspect its foundations and brickwork", cluster: city}
  seven-sages-laid-foundations: {label: "The city's foundations were laid by the Seven Sages (apkallū) of the primeval age", cluster: wisdom}
  city-area-measured: {label: "The area of a city, with its gardens, clay-pits and temple, is given in exact measures", cluster: city}
  hero-two-thirds-god: {label: "The hero is two-thirds god and one-third human", cluster: heroes}
  giant-hero-dimensions: {label: "The hero's giant body is measured in cubits (height eleven cubits, chest four cubits, stride six cubits)", cluster: heroes}
  gods-shape-heros-body: {label: "Gods (the mother goddess and the wise god) design and perfect the hero's body before birth", cluster: creation}
  hero-searches-for-life: {label: "The hero roams the regions of the world searching for (eternal) life", cluster: immortality}
  hero-restores-cult-after-flood: {label: "The hero restores the cult-centres destroyed by the flood and re-establishes the rites for humankind", cluster: flood}
  people-complain-to-gods-of-king: {label: "The oppressed people's complaint about their king reaches the gods, who act on it", cluster: kingship}
  king-takes-brides-before-grooms: {label: "The tyrant king lets no girl go free to her bridegroom (claims the bride before the husband)", cluster: kingship}
  counterpart-created-to-match-hero: {label: "The gods create a rival equal to the overbearing hero, so that they contend and the city may have rest", cluster: creation}
  wild-man-lives-with-beasts: {label: "A wild man, hairy and naked, eats grass with the gazelles and drinks at the water-hole with the herds", cluster: primeval}
  wild-man-frees-trapped-animals: {label: "The wild man fills in the hunter's pits, tears up his snares and frees the animals", cluster: primeval}
  harlot-tames-wild-man: {label: "A harlot is sent to the water-hole to seduce the wild man and estrange him from the animals", cluster: primeval}
  intercourse-six-days-seven-nights: {label: "The wild man couples with the woman for six days and seven nights", cluster: sexuality}
  wild-man-loses-animal-kinship-gains-understanding: {label: "After intercourse the animals flee the wild man; he is weakened and slower but has gained reason and understanding", cluster: primeval}
  you-are-like-a-god: {label: "The woman tells the man he has become 'like a god' and leads him from the wild to the city", cluster: primeval}
  dream-of-object-fallen-from-sky: {label: "A dream of a star or rock fallen from the sky that the dreamer cannot lift, and which he loves like a wife", cluster: dreams}
  mother-interprets-sons-dreams: {label: "The hero's wise divine mother interprets his dreams for him", cluster: dreams}
  dream-foretells-coming-friend: {label: "Dreams foretell the arrival of a mighty companion who will be the hero's friend and saviour", cluster: dreams}
  love-of-friend-like-wife: {label: "The hero loves his male friend 'like a wife', caressing and embracing him", cluster: friendship}
  hero-opens-mountain-passes-and-digs-wells: {label: "The culture-hero opens passes through the mountains and digs wells on the hillsides", cluster: heroes}
  hunter-meets-wild-man-at-water-hole: {label: "A hunter or trapper encounters the wild man at the animals' water-hole and is terrified", cluster: primeval}
  arrival-on-third-day: {label: "Travellers reach their destination on the third day of the journey", cluster: travel}
  woman-leads-man-from-wild: {label: "The woman who tamed the wild man clothes and leads him from the wilderness to the city and its people", cluster: primeval}
  wild-man-challenges-king: {label: "The newly civilised wild man resolves to go to the city and challenge its overbearing king", cluster: heroes}
  city-of-daily-festival-and-harlots: {label: "The city is praised as a place of daily festival, drums and comely harlots", cluster: city}
  harlot-clothes-wild-man: {label: "The woman shares her garments with the naked wild man, clothing him", cluster: primeval}
  wild-man-taught-bread-and-beer: {label: "The wild man, who knew only milk and grass, is taught to eat bread and drink beer, the staff of human life", cluster: civilization}
  wild-man-becomes-shepherds-watchman: {label: "The civilised wild man guards the shepherds' flocks at night, driving off wolves and lions", cluster: primeval}
  hero-blocks-door-of-wedding-house: {label: "The newcomer blocks the door of the wedding house to stop the king entering before the groom, and they wrestle", cluster: heroes}
  rivals-wrestle-then-become-friends: {label: "Two equal heroes fight, then embrace and become friends", cluster: friendship}
  friend-has-no-kin: {label: "The hero's friend, born in the wild, has no father, mother, brother or kin", cluster: friendship}
  hero-proposes-perilous-expedition: {label: "The king proposes a perilous expedition to the distant cedar forest to slay its monstrous guardian", cluster: heroes}
  monster-appointed-by-high-god-to-guard-forest: {label: "The high god appointed the forest monster as guardian of the cedars, a terror to people", cluster: heroes}
  monster-voice-flood-mouth-fire-breath-death: {label: "The monster's roar is the Deluge, his mouth fire, his breath death", cluster: heroes}
  human-days-numbered-deeds-wind: {label: "Man's days are numbered and all his deeds are but wind", cluster: wisdom}
  fame-better-than-long-life: {label: "Since humans must die anyway, the hero prefers to die gloriously and leave an eternal name", cluster: heroes}
  giant-weapons-cast-for-expedition: {label: "The heroes have axes and swords of enormous weight (talents each) cast at the forge", cluster: heroes}
  elders-warn-young-king: {label: "The city's elders warn the young, rash king against his plan: 'you are young and do not know what you are talking about'", cluster: kingship}
  hero-seeks-assemblys-blessing-for-journey: {label: "The king asks the city's young men or elders to bless him before setting out, promising festivals on his safe return", cluster: kingship}
  strong-hero-weeps-in-fear: {label: "The mighty companion sits down weeping, his eyes fill with tears, his arms fall limp and terror enters his heart", cluster: heroes}
  do-not-trust-in-own-strength: {label: "Counsel to the hero: do not trust in the fullness of your own strength", cluster: wisdom}
  one-who-knows-the-road-goes-ahead: {label: "Proverb: he who goes in front saves his comrade; he who knows the road guards his friend", cluster: wisdom}
  king-entrusted-to-companion: {label: "The assembly formally entrusts the king to his companion, who must bring him back safely", cluster: kingship}
  mother-purifies-and-prays-on-roof: {label: "The hero's mother bathes, dresses, climbs to the roof, offers incense to the sun god and raises her arms in prayer", cluster: cult}
  god-gave-hero-restless-heart: {label: "A mother complains to the god that he gave her son a restless heart that drives him to danger", cluster: heroes}
  sun-god-sends-winds-against-monster: {label: "The sun god is asked to raise a list of named winds (thirteen) against the monster so that his face is darkened", cluster: heroes}
  long-days-short-nights-for-journey: {label: "Blessing on the traveller: may the days be long and the nights short, his loins girt and his stride long", cluster: travel}
  goddess-adopts-heros-friend: {label: "The hero's divine mother adopts his friend as her son, putting a token on his neck", cluster: family}
  hero-deified-like-the-gods: {label: "A hero is promised a place among the gods: sharing heaven with the sun, a sceptre with the moon, or dwelling with the netherworld gods", cluster: immortality}
  slay-the-evil-the-god-hates: {label: "The expedition aims to destroy from the land the evil thing that the god hates", cluster: heroes}
  officials-kiss-feet-of-departing-king: {label: "The officials kiss the departing king's feet and the people run after him with blessings", cluster: kingship}
  sun-god-dawn-light-on-herds: {label: "At sunrise the sun god opens the way for the herds to go out and all creatures and gods wait for his light", cluster: cult}
  foundling-raised-by-temple-women: {label: "A foundling is taken in and brought up by temple priestesses and votaries", cluster: family}
  incense-and-juniper-offered: {label: "Incense and juniper are burned as an offering before a deity", cluster: cult}
  journey-stages-formula: {label: "Refrain of the journey: at twenty leagues they broke bread, at thirty they camped, fifty leagues a day, a month and a half's march in three days", cluster: travel}
  mountain-asked-for-dream: {label: "The hero climbs a mountain, offers flour to it and asks it to bring him a dream with a favourable message from the god", cluster: dreams}
  dream-shelter-and-drawn-circle: {label: "A companion builds a shelter against the wind (house of Zaqīqu) and lays the dreamer down in a circle drawn on the ground", cluster: dreams}
  dreamer-wakes-did-god-pass-by: {label: "The dreamer wakes at night asking: did you call me? did you touch me? did a god pass by? why is my flesh numb?", cluster: dreams}
  dream-mountain-falls: {label: "In a dream a mountain collapses on the travellers", cluster: dreams}
  dream-heaven-cries-earth-rumbles-death-rains: {label: "In a dream the heavens roar, the earth rumbles, darkness falls, lightning flashes and death rains down until the fire goes out and turns to ash", cluster: dreams}
  companion-reinterprets-bad-dreams-as-good: {label: "The companion interprets each frightening dream as favourable, foretelling victory over the enemy", cluster: dreams}
  series-of-five-dreams: {label: "The hero has a series of numbered dreams (first, second, third, fourth, fifth) on successive nights of the journey", cluster: dreams}
  cedar-mountain-dwelling-of-gods: {label: "The cedar forest on the mountain is the dwelling of the gods and the throne-dais of the goddesses, sweet-shaded and full of delight", cluster: paradise}
  cedar-forest-full-of-birdsong: {label: "The sacred forest resounds with the song of birds, crickets, doves and monkeys like a band of musicians before its guardian", cluster: paradise}
  resin-drips-like-rain: {label: "Resin oozes from the cedars and drizzles down like rain", cluster: paradise}
  terror-seizes-hero-at-threshold: {label: "As he enters the sacred place terror falls on the hero, his arms stiffen and his legs tremble", cluster: heroes}
  forget-death-seek-life: {label: "Exhortation in danger: forget death and seek life; the one tested in battle does not fear death", cluster: heroes}
  sun-god-answers-from-heaven-fear-not: {label: "The sun god hears the hero's tearful prayer and a voice cries from heaven: 'Fear not, stand against him!'", cluster: heroes}
  monster-wears-seven-cloaks-of-radiance: {label: "The monster has seven cloaks (auras) of radiance; he is caught wearing only one, the other six shed", cluster: heroes}
  monster-taunts-hero-and-companion: {label: "The monster mocks the hero's companion as a fish's spawn without father or mother's milk, and threatens to feed the hero's flesh to the birds", cluster: heroes}
  earth-splits-heavens-darken-in-battle: {label: "In the combat the earth splits under the heroes' heels, mountains are sundered, white cloud turns black and death rains like mist", cluster: heroes}
  monster-pleads-for-life-offers-service: {label: "The defeated monster begs for his life, offering to be the hero's slave and keep his timber", cluster: heroes}
  companion-urges-killing-monster: {label: "The companion urges the hero not to listen to the monster's pleas but to kill it before the high god learns of it", cluster: heroes}
  weeping-before-sun-god: {label: "A suppliant lifts his head and weeps before the sun god, tears flowing under the sun's rays", cluster: cult}
  dying-monster-curses-hero: {label: "The doomed monster curses his captors: may they not grow old, may the companion have no one to bury him but his friend", cluster: curse}
  heroes-fell-sacred-cedars-for-temple-door: {label: "The heroes fell the tallest cedar, whose top touched heaven, and make a great door for the high god's temple, floated downriver by raft", cluster: cult}
  slain-monsters-seven-sons: {label: "The monster's seven sons, named after noises and storms, are slain with him", cluster: heroes}
  lasting-name-from-great-deed: {label: "The heroes resolve to establish an enduring fame for future days by their deed", cluster: heroes}
  voice-from-heaven: {label: "A voice cries out from heaven to answer or reassure a person", cluster: revelation}
  catch-bird-where-go-its-young: {label: "Saying: catch the (parent) bird, and where will its young go? (destroy the chief and his brood is helpless)", cluster: wisdom}
  hero-washes-and-dons-clean-garments: {label: "The returning hero washes his matted hair, casts off his dirty clothes and puts on clean garments and his crown", cluster: purity}
  goddess-proposes-marriage-to-mortal-hero: {label: "A goddess, desiring the hero's beauty, proposes that he be her husband and offers him gifts", cluster: goddess}
  goddess-offers-chariot-tribute-fertility: {label: "The goddess offers a chariot of gold and lapis, kings bowing in tribute, and fertile flocks as marriage gifts", cluster: goddess}
  hero-refuses-goddess: {label: "The hero refuses the goddess's offer, recounting her faithlessness", cluster: goddess}
  insult-litany-of-images: {label: "The goddess is reviled with a litany of images (a draughty door, pitch that stains, a shoe that bites its owner's foot)", cluster: wisdom}
  catalogue-of-goddess-lovers-and-their-fates: {label: "A catalogue of the goddess's former lovers, each ruined by her: Dumuzi wept for yearly, the bird with broken wing, the lion trapped, the horse whipped, the shepherd turned into a wolf, the gardener turned into a dwarf", cluster: goddess}
  lover-transformed-into-animal: {label: "A goddess's spurned or used lover is turned into an animal (a wolf) and hounded by his own dogs", cluster: transformation}
  gardener-refuses-goddess: {label: "The gardener refuses the goddess's sexual advances ('did my mother not bake? am I to eat bread of insult?') and is turned into a dwarf", cluster: goddess}
  goddess-complains-to-father-god: {label: "The insulted goddess goes weeping to her father and mother in heaven", cluster: goddess}
  goddess-threatens-to-raise-dead-to-eat-living: {label: "The goddess threatens to smash the gates of the netherworld and raise the dead to consume and outnumber the living", cluster: underworld}
  seven-years-of-provision-before-plague: {label: "Before sending the Bull of Heaven, the high god demands seven years of chaff and fodder be stored against the famine it will bring", cluster: famine}
  bulls-snort-opens-pits: {label: "At each snort of the Bull of Heaven a pit opens and hundreds of young men fall in", cluster: goddess}
  heroes-slay-bull-of-heaven: {label: "The heroes kill the Bull of Heaven, one holding its tail, the other thrusting a knife between horns and neck", cluster: heroes}
  victors-offer-heart-to-sun-god: {label: "The victors cut out the slain beast's heart and set it before the sun god, prostrating themselves", cluster: cult}
  hero-throws-haunch-at-goddess: {label: "The companion tears off the bull's haunch and hurls it at the goddess, threatening her with the same", cluster: goddess}
  goddess-institutes-mourning-with-harlots: {label: "The goddess assembles the courtesans and harlots and institutes mourning over the bull's haunch", cluster: cult}
  victory-song-who-is-finest: {label: "Women of the palace answer in song: 'Who is finest among men? Gilgameš is finest!'", cluster: kingship}
  refusal-of-seduction: {label: "A man refuses the sexual advances of a powerful woman and suffers her revenge", cluster: sexuality}
  father-god-rebukes-goddess: {label: "The father god rebukes his complaining daughter: 'was it not you who provoked him?'", cluster: goddess}
  goddess-curses-from-city-wall: {label: "The goddess climbs the city wall, stamps and wails a curse on the hero who killed her beast", cluster: goddess}
  gods-council-decrees-death-of-hero: {label: "The gods take counsel and decree that one of the two heroes must die for killing the guardian and the Bull of Heaven", cluster: death}
  dying-man-addresses-door: {label: "The dying hero speaks to the temple door he made, regretting his gift and threatening to tear it down", cluster: death}
  grief-left-to-the-survivor: {label: "Saying: the dead leave grief and sorrow to the one who survives", cluster: death}
  mourner-promises-golden-statue: {label: "The mourner promises to make a statue of his dead friend in gold without limit", cluster: death}
  dying-man-curses-those-who-brought-him-to-civilisation: {label: "On his deathbed the hero curses the hunter and the harlot who drew him out of the wild", cluster: death}
  curse-on-harlot-catalogue: {label: "A detailed curse: no household, the road-junction her seat, ruins her bed, drunkards strike her cheek, thorns flay her feet", cluster: curse}
  god-rebukes-ingratitude-recalls-benefits: {label: "The god rebukes the curser by recalling the benefits he received (bread fit for a god, beer, clothing, a friend)", cluster: revelation}
  promise-of-honoured-burial-and-mourning: {label: "The god promises the dying man an honoured bed, a seat at the left, princes kissing his feet and a city weeping for him", cluster: death}
  mourner-wears-lion-skin-roams-wild: {label: "The bereaved friend lets his hair grow matted, dons a lion's skin and roams the wild", cluster: death}
  curse-retracted-and-turned-to-blessing: {label: "The curser's mouth that cursed returns to bless: noblemen will love her and give her gold, a wife of seven will be deserted for her", cluster: curse}
  dream-of-death-demon-with-bird-face: {label: "In a dream a grim man with the face of the Anzû bird, lion paws and eagle talons seizes the dreamer", cluster: underworld}
  dead-turned-into-bird-led-below: {label: "The dying man is struck and turned into a bird (dove), his arms bound like wings, and led to the netherworld", cluster: underworld}
  dead-eat-dust-and-clay-in-darkness: {label: "In the House of Dust the dead eat dust and clay, are clothed in feathers like birds and see no light", cluster: underworld}
  crowns-stowed-in-netherworld: {label: "In the netherworld the crowns of former kings lie heaped away while the kings sit as servants", cluster: underworld}
  netherworld-scribe-reads-tablet: {label: "Before the queen of the netherworld her scribe crouches, reading a tablet aloud; she asks who brought the new arrival", cluster: underworld}
  hero-sick-twelve-days: {label: "The dying hero lies sick day after day, counted from the first to the twelfth", cluster: death}
  lament-dying-not-in-battle: {label: "The dying hero laments that he dies on a sickbed, not gloriously in battle where one makes a name", cluster: death}
  death-before-ones-time: {label: "People go to their fate before their time (die prematurely)", cluster: death}
  house-god-leaves-by-window: {label: "Curse: may the god of the house he enters leave by the window", cluster: curse}
  dead-friend-born-of-gazelle-and-wild-ass: {label: "The mourner recalls that his friend was born of a gazelle and a wild ass and reared on the milk of wild asses", cluster: death}
  all-creation-summoned-to-mourn: {label: "Litany calling on paths, mountains, trees, wild animals, rivers, elders, ploughman, shepherd, brewer and harlot to weep for the dead hero", cluster: death}
  hero-mourns-like-wailing-woman: {label: "The hero declares he will lament his friend bitterly like a professional mourning woman", cluster: death}
  dead-friend-as-lost-weapons-and-festal-garment: {label: "The mourner calls his dead friend the axe at his side, the sword of his belt, his shield and festal garment, stolen by an evil wind", cluster: death}
  mourner-feels-heart-no-longer-beating: {label: "The mourner touches his friend's heart and finds it no longer beating; he would not lift his head", cluster: death}
  corpse-veiled-like-bride: {label: "The mourner covers his dead friend's face like a bride's", cluster: death}
  mourner-like-lioness-robbed-of-cubs: {label: "The mourner paces back and forth like a lioness deprived of her cubs", cluster: death}
  statue-of-dead-friend-in-gold-and-lapis: {label: "Craftsmen are summoned to make a statue of the dead friend with lapis eyebrows and a golden chest", cluster: death}
  grave-goods-for-netherworld-gods: {label: "Treasures from the king's treasury are displayed to the sun god as gifts for each netherworld deity, that they welcome the dead friend and walk at his side", cluster: underworld}
  funeral-sacrifice-of-oxen-and-sheep: {label: "Fat oxen and sheep are slaughtered and heaped up for the dead, their meat carried to the princes of the netherworld", cluster: death}
  scapegoat-of-netherworld: {label: "A netherworld deity is titled 'the scapegoat' (mašhaltappû), the substitute who carries evil away", cluster: underworld}
  honey-and-ghee-offering: {label: "Honey (syrup) and ghee are set out in precious bowls as an offering to a god", cluster: cult}
  friends-death-brings-fear-of-own-death: {label: "Seeing his friend dead, the hero realises 'I too shall die' and, afraid of death, roams the wild", cluster: death}
  hero-seeks-immortal-ancestor-for-secret-of-life: {label: "The hero sets out to find his immortal ancestor, who stood in the gods' assembly and found life, to learn the secret of death and life", cluster: immortality}
  night-prayer-to-moon-god-for-safety: {label: "In danger at night the traveller lifts his head and prays to the moon god to keep him safe", cluster: cult}
  twin-mountains-of-sunrise: {label: "Twin cosmic mountains (Māšu) guard the sun's rising and setting, their peaks touching heaven and their roots reaching the netherworld", cluster: cosmology}
  scorpion-people-guard-gate-of-sun: {label: "A scorpion-man and his wife, whose glance is death, guard the gate of the mountain of the sun", cluster: cosmology}
  journey-through-darkness-twelve-hours: {label: "The hero travels the sun's path inside the mountain for twelve double-hours of total darkness, unable to see behind him, emerging before the sun", cluster: cosmology}
  garden-of-jewel-trees: {label: "Beyond the darkness lies a garden of the gods whose trees bear fruit and foliage of carnelian, lapis lazuli and other gems", cluster: paradise}
  travellers-ford-perilous-rivers: {label: "The far traveller is asked how he crossed the many rivers whose crossing is perilous", cluster: travel}
  weathered-face-of-wanderer: {label: "The wanderer's face is burnt by frost and sun, his cheeks hollow, his heart sorrowful from the long road", cluster: death}
  tree-pleasant-to-sight: {label: "A tree in the divine garden is lovely to look at and bears fruit", cluster: paradise}
  ale-wife-at-edge-of-world: {label: "A veiled ale-wife (tavern-keeper) lives in an inn by the shore of the ocean at the edge of the world", cluster: immortality}
  woman-bars-gate-against-stranger: {label: "Seeing the wild-looking stranger, the woman bars her gate and climbs to the roof; he threatens to break the door", cluster: travel}
  repeated-question-why-are-your-cheeks-hollow: {label: "Each person the wanderer meets asks why his cheeks are hollow and his face burnt, and he answers with the same lament in the same words", cluster: death}
  corpse-kept-until-maggot-falls: {label: "The mourner refused to give his friend up for burial until a maggot fell from his nostril", cluster: death}
  friend-turned-to-clay: {label: "The beloved friend has turned to clay; shall I not lie down like him never to rise again?", cluster: death}
  only-the-sun-crosses-the-ocean: {label: "No one but the sun god has ever crossed the ocean at the end of the world", cluster: cosmology}
  waters-of-death: {label: "The Waters of Death lie across the ocean between the living world and the immortal's home; touching them is fatal", cluster: cosmology}
  ferryman-to-the-immortal: {label: "A boatman with mysterious Stone Ones ferries travellers across the Waters of Death to the immortal flood hero", cluster: immortality}
  hero-smashes-what-he-needs: {label: "In his rage the hero smashes the Stone Ones that alone could carry him, and must cut punting-poles instead", cluster: heroes}
  punting-poles-across-waters-of-death: {label: "The hero crosses the Waters of Death using poles one by one so his hand never touches the water, then a garment as sail", cluster: immortality}
  immortal-watches-stranger-approach: {label: "The immortal, watching from the far shore, wonders aloud who the stranger in the boat is", cluster: immortality}
  seal-gate-of-sorrow-with-bitumen: {label: "Wish that the gate of sorrow be barred and sealed with pitch and bitumen", cluster: death}
  sleepless-toil-brings-nothing: {label: "The hero's sleepless toil and wandering only fills his sinews with pain and brings his end nearer: what has he achieved?", cluster: wisdom}
  fool-gets-dregs-not-throne: {label: "Saying: no one builds a palace or sets a throne in the council for a fool; he gets dregs instead of ghee, bran instead of flour, rags instead of garments", cluster: wisdom}
  man-snapped-like-reed: {label: "Man's name (progeny) is snapped off like a reed in the canebrake; death abducts the comely youth and maiden", cluster: death}
  no-one-sees-face-of-death: {label: "No one sees death, sees its face or hears its voice, yet savage death cuts man down", cluster: death}
  mayfly-on-the-river: {label: "Image of human life: the mayfly floating on the flood gazes at the sun and is suddenly gone", cluster: death}
  at-some-time-litany: {label: "Litany 'at some time we build a house, at some time we start a family, at some time brothers divide, at some time the river floods' on the transience of all things", cluster: wisdom}
  gods-fix-death-and-life-hide-the-day: {label: "The great gods and the mother of destinies established death and life, but did not reveal the day of death", cluster: death}
units:
  - id: ane-gilg-sb-i-prologue
    tradition: ane-akkadian
    title: "Prologue: he who saw the Deep; the wall of Uruk and the lapis tablet (Gilgameš SB I)"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    version: Standard Babylonian
    read: ["Gilg SB I:1-28"]
    tags:
      - {motif: hero-who-saw-the-deep, refs: ["Gilg SB I:1-6"], note: "ša nagba īmuru išdī māti ... naphar nēmeqi ša kalāmi īde (incipit restored from I:3)"}
