# Full read of the ANE corpus, chunk 5: ETCSL 1.8.2.3 - ETCSL 2.1.6. Read from the ETCSL composite transliterations (Sumerian).
new_motifs:
  primeval-when-not-yet-city: {label: "A text opens in primeval days, 'before' other lands, trade or crafts existed, to assert a city's or temple's primacy", cluster: primeval}
  foreign-land-ordered-to-supply-temple-materials: {label: "A king demands that a foreign land send gold, silver, precious stones and mountain stone to build his god's temple", cluster: temple}
  age-without-predators-or-fear: {label: "In a primeval or ideal age there is no snake, scorpion, lion or wolf, and so no fear; man has no rival", cluster: primeval}
  messenger-crosses-seven-mountains: {label: "Journey formula: the messenger crosses five, six, seven mountains and lifts his eyes as he nears the city", cluster: epic}
  message-repeated-verbatim: {label: "A message is dictated to a messenger and repeated word for word on delivery, framed by fixed dialogue formulas", cluster: epic}
  rival-kings-exchange-impossible-tasks: {label: "Two rival kings contend through messengers by setting each other impossible tasks or riddles to decide who is supreme", cluster: wisdom}
  famine-relieved-by-rival-grain: {label: "A foreign or rival ruler relieves a famine-stricken land with his grain and so wins its submission", cluster: kingship}
  sceptre-of-no-known-material: {label: "A riddle demands a sceptre made of no known wood, metal or stone", cluster: wisdom}
  etiology-of-writing: {label: "A narrative notes that writing (or a writing practice such as clay envelopes) did not yet exist and tells how it began", cluster: civilization}
  rain-makes-grain-grow-of-itself: {label: "A storm god's rain makes wheat and pulses grow of their own accord on barren land", cluster: nature}
  king-born-of-deity: {label: "The king is called a god's son, born of a divine cow, or suckled at a goddess's breast", cluster: kingship}
  water-of-life-sprinkled: {label: "A deity sprinkles the water of life on chosen people", cluster: life}
  after-the-flood-era-marker: {label: "Time is reckoned from 'after the flood had swept over', the flood dividing primeval from later history", cluster: flood}
  aged-woman-appears-as-maiden: {label: "An old woman comes forth adorned like a maiden in her prime (kohl, white garment, crown)", cluster: epic}
  king-shares-bed-with-goddess: {label: "A king boasts that he lies with the goddess on her bed (sacred marriage)", cluster: cult}
  king-consults-assembly-in-crisis: {label: "A king in crisis summons priests and the assembly for counsel, and they tell him he brought it on himself", cluster: kingship}
  foreign-sorcerer-hired-against-enemy: {label: "A foreign sorcerer is engaged with gold, silver and rich provisions to overpower an enemy land by magic", cluster: magic}
  animal-made-to-speak-like-human: {label: "An animal is made to speak and converse like a human being", cluster: magic}
  sorcery-dries-up-milk: {label: "Sorcery makes the milk of cows and goats dry up so that the young starve and the byre falls silent", cluster: magic}
  victims-appeal-to-sun-god: {label: "Wronged herdsmen sit in the dust at the gate facing sunrise and appeal to the sun god for help", cluster: justice}
  magic-contest-creature-devours-creature: {label: "In a contest of magicians, each creature conjured by one is seized by a stronger creature conjured by the other", cluster: magic}
  wise-woman-defeats-sorcerer: {label: "A wise woman defeats a foreign sorcerer in a contest of magic", cluster: magic}
  defeated-magician-pleads-and-is-executed: {label: "The defeated magician confesses, begs to be let go home and promises to praise his victor, but is put to death", cluster: magic}
  rival-king-concedes-supremacy: {label: "A rival king concedes: 'You are the older brother; I cannot match you'", cluster: kingship}
  doxology-closes-composition: {label: "A composition closes with a praise formula to a deity ('X be praised')", cluster: liturgy}
  kingship-descends-from-heaven: {label: "Kingship descends from heaven to an earthly city", cluster: kingship}
  king-ascends-to-heaven: {label: "A mortal king ascends to heaven", cluster: primeval}
  king-vanishes-into-sea: {label: "A king enters the sea and goes up into the mountains, disappearing", cluster: primeval}
  hero-of-phantom-father: {label: "A hero's father is a phantom or spirit, not a known man", cluster: birth}
  kingship-passes-city-to-city: {label: "Kingship is carried from city to city as each in turn is defeated in battle", cluster: kingship}
  king-of-lowly-trade-origin: {label: "A king rises from a lowly trade (fuller, boatman, leatherworker, gardener's son, tavern-keeper)", cluster: kingship}
  woman-rules-as-king: {label: "A woman rules as king in her own right", cluster: kingship}
  anarchy-no-king: {label: "An interval of anarchy: 'Who was king? Who was not king?', or a people ruling itself without a king", cluster: kingship}
  cupbearer-becomes-king: {label: "A royal cupbearer rises to become king", cluster: kingship}
  regnal-totals-summary: {label: "A king list closes with summary totals of kings, years and cities", cluster: kingship}
  seed-of-mankind-preserved-after-flood: {label: "After the flood the seed of mankind is preserved and humanity rises again", cluster: flood}
  god-gives-agricultural-tools: {label: "A god gives humans the pickaxe, spade, basket and plough, which mean life for the land", cluster: civilization}
  before-irrigation-famine: {label: "Before canals were dug people relied on rain, fields bore nothing and there was famine", cluster: civilization}
  ruler-digs-canal: {label: "A ruler is remembered for digging named canals", cluster: kingship}
  personal-god-of-ruler: {label: "Each ruler is listed with his personal god", cluster: cult}
  ruler-without-parentage: {label: "A ruler is 'not the son of his mother nor the son of his father'", cluster: birth}
  temple-repeatedly-ruined-and-restored: {label: "A shrine falls into ruin again and again and is restored each time by a new king and his son", cluster: temple}
  priest-chosen-by-omen: {label: "A high priest (or priestess) is chosen by extispicy or omen", cluster: cult}
  deity-stands-by-favourite: {label: "A deity does not leave the hero's side and protects him against the king", cluster: providence}
  king-keeps-ominous-dream-secret: {label: "A king understands an ominous dream but does not put it into words or discuss it with anyone", cluster: dream}
  king-loosed-in-terror: {label: "A king's bowels or loins give way in terror at an omen", cluster: dream}
  dream-of-giant-woman: {label: "In a dream a woman as high as heaven and as broad as earth appears", cluster: dream}
  king-plots-death-of-rising-servant: {label: "A king, fearing a favoured servant, plots his death through others", cluster: kingship}
  bloodstained-barred-from-sanctuary: {label: "One polluted with blood may not enter the holy house", cluster: cult}
  golden-age-of-city-abundance: {label: "Under divine favour a capital overflows: stores of gold, exotic animals, foreigners and tribute from all lands", cluster: kingship}
  deity-abandons-city: {label: "The city's patron deity abandons her sanctuary and leaves the city", cluster: temple}
  gods-withdraw-gifts-from-city: {label: "The gods one by one take away a city's crown, throne, wisdom, eloquence and weapons", cluster: temple}
  king-mourns-seven-years: {label: "A king in mourning clothes gives up his regalia and persists for seven years", cluster: kingship}
  omen-gives-no-answer: {label: "The king seeks an omen twice and receives no answer", cluster: divination}
  king-defies-divine-decree: {label: "A king tries to change a god's pronouncement and acts against it", cluster: kingship}
  king-desecrates-gods-own-temple: {label: "A king demolishes and plunders the chief temple of his own gods", cluster: temple}
  sacred-interior-exposed: {label: "Ordinary people look into the sanctuary's hidden chamber and the gods' holy chest", cluster: temple}
  god-summons-barbarian-invaders: {label: "In anger the deity brings a savage foreign people out of the mountains to punish the land", cluster: war}
  barbarians-subhuman-description: {label: "Invaders described as subhuman: human intelligence but dog's instincts and monkey's features, knowing no restraint", cluster: war}
  famine-inflated-market-prices: {label: "Famine is shown by the ruinous market prices of oil, grain, wool and fish", cluster: calamity}
  dogs-devour-people-in-streets: {label: "Packs of dogs in the silent streets devour passers-by", cluster: calamity}
  alas-for-my-city-lament: {label: "Survivors cry 'Alas for my city! Alas for its people! Alas for the temple!'", cluster: lament}
  curse-of-reversion-to-origin: {label: "Curse that a city's clay, grain and timber return to their origins, cursed by their gods", cluster: curse}
  curse-brackish-water: {label: "Curse that a city's sweet water flow brackish", cluster: curse}
  grass-grows-on-highways: {label: "Grass grows high on the roads and towpaths when traffic ceases", cluster: calamity}
  city-never-resettled-curse: {label: "Curse: whoever says 'I will dwell in this city' shall find no pleasant dwelling there", cluster: curse}
  curse-fulfilled-as-spoken: {label: "A curse is repeated word for word as fulfilled ('and so it was')", cluster: curse}
  oppressor-seizes-wives-and-children: {label: "The oppressor takes wives from husbands and children from parents", cluster: war}
  king-prays-before-battle: {label: "Before battle the king goes to several gods and prays 'be my help'", cluster: war}
  campaign-dated-by-days: {label: "A campaign is narrated stage by stage, by numbered days and named camps", cluster: war}
  fleeing-king-handed-over-by-refuge-city: {label: "A defeated king flees alone to a city, whose people refuse to shelter him and hand him over", cluster: war}
  grieving-animals: {label: "When the herds fail, the hungry young animals weep and their mothers cry out bitterly", cluster: calamity}
  holy-city-inviolable: {label: "A city whose destiny the high gods decreed may not be assailed by sorcery or violence", cluster: temple}
  scribal-colophon: {label: "A text ends with a note on its source or on where it was written", cluster: scribal}
  gifts-to-each-age-group: {label: "The deity endows each age group with its gift: old women counsel, old men eloquence, young women charm, young men might, children joy", cluster: blessing}
  cosmic-consequence-of-sacrilege: {label: "Damage to parts of the temple has cosmic effects: rain returns to heaven, grain and well-being leave the land", cluster: temple}
  brother-will-not-know-brother: {label: "Curse: brother will not recognise brother and no one will find his acquaintance; heads fill the wells", cluster: curse}
  curse-on-women-of-city: {label: "Curse that a city's prostitute hang herself at her door and its women lose their children", cluster: curse}
  curse-kin-slain-by-own-hand: {label: "Curse that the cattle-slaughterer slaughter his wife and the butcher his child", cluster: curse}
  curse-precious-metals-devalued: {label: "Curse that a city's gold sell at the price of silver, its silver at the price of pyrite and its copper at the price of lead", cluster: curse}
  dead-lie-unburied: {label: "In the calamity the dead lie unburied on roofs and in houses", cluster: calamity}
  divine-statues-thrown-into-fire: {label: "Guardian divine statues of a temple are thrown into the fire", cluster: temple}
  contest-of-champions-decides-dispute: {label: "Two rulers propose that their champions fight and the stronger decide the dispute", cluster: war}
  dream-reported-to-king: {label: "The king asks a servant about his night dream and the servant tells it", cluster: dream}
  captive-handcuffed-and-blindfolded: {label: "A captured enemy leader is put in handcuffs and a cloth over his eyes", cluster: war}
units:
  - id: ane-etcsl-1-8-2-3-prologue
    tradition: ane-sumerian
    title: "Enmerkar and the lord of Aratta: primeval Unug and Aratta's failure"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Sumerian"
    read: ["ETCSL 1.8.2.3 1-32"]
    tags:
      - {motif: primeval-when-not-yet-city, refs: ["ETCSL 1.8.2.3 12", "ETCSL 1.8.2.3 13", "ETCSL 1.8.2.3 16", "ETCSL 1.8.2.3 17", "ETCSL 1.8.2.3 18", "ETCSL 1.8.2.3 19"], note: "kur dilmun X in-nu ... e2-an-na ki us2-sa-a; nam-ga-raš nu-ak-e 'commerce not yet practised'; gold, silver, copper, tin, lapis not yet brought down from the mountains. Line 12 partly broken."}
      - {motif: king-shares-bed-with-goddess, refs: ["ETCSL 1.8.2.3 28", "ETCSL 1.8.2.3 29", "ETCSL 1.8.2.3 30"], note: "the lord of Aratta puts on the golden crown for Inana but en kul-aba4-a-gin7 nu-mu-na-sag9 'did not please her like the lord of Kulaba'"}
    hints:
      - "The 'before ... existed' opening resembles Gen 2:4-5 and Prov 8:24-26 (before the mountains were settled)."
      - "A rival king who pleases the deity less than the chosen one: compare 1 Sam 15:28 and 16:1."
  - id: ane-etcsl-1-8-2-3-plea-and-counsel
    tradition: ane-sumerian
    title: "Enmerkar asks his sister Inana for Aratta's wealth; Inana counsels him to send a messenger"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Sumerian"
    read: ["ETCSL 1.8.2.3 33-107"]
    tags:
      - {motif: man-after-gods-heart, refs: ["ETCSL 1.8.2.3 33", "ETCSL 1.8.2.3 34"], note: "en šag4-ge pad3-da {d}inana-ke4 'the lord chosen by Inana in her heart'"}
      - {motif: king-born-of-deity, refs: ["ETCSL 1.8.2.3 35", "ETCSL 1.8.2.3 36", "ETCSL 1.8.2.3 104"], note: "en-me-er-kar2 dumu {d}utu, and Inana is his nin9 'sister'"}
      - {motif: foreign-land-ordered-to-supply-temple-materials, refs: ["ETCSL 1.8.2.3 38", "ETCSL 1.8.2.3 39", "ETCSL 1.8.2.3 40", "ETCSL 1.8.2.3 44", "ETCSL 1.8.2.3 49", "ETCSL 1.8.2.3 50", "ETCSL 1.8.2.3 51", "ETCSL 1.8.2.3 81", "ETCSL 1.8.2.3 82"], note: "aratta ... kug-sig17 kug-babbar ḫa-ma-an-galam-e; na4 ḫur-saĝ-ĝa2 kur-bi ḫa-ma-ab-ed3; eš3 gal ḫa-ma-du3-e"}
      - {motif: peace-offer-before-war, refs: ["ETCSL 1.8.2.3 48", "ETCSL 1.8.2.3 79"], note: "aratta unug-še3 gu2 ĝiš ḫa-ma-ĝa2-ĝa2 'let Aratta submit beneath the yoke for Unug'"}
      - {motif: enemies-lick-dust, refs: ["ETCSL 1.8.2.3 75", "ETCSL 1.8.2.3 76", "ETCSL 1.8.2.3 77", "ETCSL 1.8.2.3 78"], note: "Susa and Anšan salute Inana peš2 tur-gin7 'like tiny mice'; the multitudes saḫar-ra ḫu-mu-na-da-gur4-gur4-e 'grovel in the dust'"}
      - {motif: message-repeated-verbatim, refs: ["ETCSL 1.8.2.3 69", "ETCSL 1.8.2.3 70", "ETCSL 1.8.2.3 71", "ETCSL 1.8.2.3 105", "ETCSL 1.8.2.3 106", "ETCSL 1.8.2.3 107"], note: "Inana's counsel (na ga-e-de5 ... inim ga-ra-ab-dug4) repeats Enmerkar's plea almost verbatim (lines 49-64 = 80-95); messenger chosen inim zu zag-še tuku 'eloquent and enduring'"}
      - {motif: king-wishes-to-build-temple, refs: ["ETCSL 1.8.2.3 43", "ETCSL 1.8.2.3 44", "ETCSL 1.8.2.3 54", "ETCSL 1.8.2.3 55", "ETCSL 1.8.2.3 56"], note: "e2 an-ta ed3-da 'a temple brought down from heaven'; the abzu to grow like a holy mountain, Eridug to gleam"}
    hints:
      - "Temple materials from a foreign land: compare 1 Kgs 5:6-10 (Hiram's cedars) and Isa 60:5-13 (wealth of nations brought for the temple)."
      - "'Let them lick the dust': Ps 72:9 and Isa 49:23; submission under a yoke: Jer 27:8-11."
      - "A king chosen in the deity's heart: 1 Sam 13:14; king as son of the deity: Ps 2:7, 2 Sam 7:14."
  - id: ane-etcsl-1-8-2-3-first-message-nudimmud-spell
    tradition: ane-sumerian
    title: "The first message: the ultimatum and the spell of Nudimmud on one language"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Sumerian"
    read: ["ETCSL 1.8.2.3 108-159"]
    tags:
      - {motif: peace-offer-before-war, refs: ["ETCSL 1.8.2.3 114", "ETCSL 1.8.2.3 115", "ETCSL 1.8.2.3 116", "ETCSL 1.8.2.3 118", "ETCSL 1.8.2.3 119", "ETCSL 1.8.2.3 120", "ETCSL 1.8.2.3 124", "ETCSL 1.8.2.3 127"], note: "threat: iri-bi ir7-saĝ{mušen}-gin7 ĝiš-bi-ta na-an-na-ra-ab-dal-en 'lest I make the people fly off like a wild dove from its tree'; unless Aratta loads gold on donkeys of the mountains"}
      - {motif: age-without-predators-or-fear, refs: ["ETCSL 1.8.2.3 136", "ETCSL 1.8.2.3 137", "ETCSL 1.8.2.3 138", "ETCSL 1.8.2.3 139", "ETCSL 1.8.2.3 140"], note: "ud-ba muš nu-ĝal2-am3 ĝiri2 nu-ĝal2-am3 kir4 ... ur-maḫ ... ur-gir15 ur-bar-ra nu-ĝal2-am3; ni2 teĝ3-ĝe26 su zi-zi-i nu-ĝal2-am3; lu2-u18-lu gaba-šu-ĝar nu-tuku"}
      - {motif: one-original-language, refs: ["ETCSL 1.8.2.3 141", "ETCSL 1.8.2.3 142", "ETCSL 1.8.2.3 143", "ETCSL 1.8.2.3 144", "ETCSL 1.8.2.3 145", "ETCSL 1.8.2.3 146"], note: "Šubur, Ḫamazi eme ḫa-mun 'of contrasting tongues', Sumer, Akkad, Martu: {d}en-lil2-ra eme 1-am3 ḫe2-en-na-da-ab-dug4 'may they address Enlil in one tongue'. The modal ḫe2- makes it wish or prophecy, not necessarily a past state."}
      - {motif: confusion-of-tongues, refs: ["ETCSL 1.8.2.3 147", "ETCSL 1.8.2.3 148", "ETCSL 1.8.2.3 150", "ETCSL 1.8.2.3 153", "ETCSL 1.8.2.3 154", "ETCSL 1.8.2.3 155"], note: "interpretive: {d}en-ki ... ka-ba eme i3-kur2 en-na mi-ni-in-ĝar-ra / eme nam-lu2-ulu3 1 i3-me-a. ETCSL: Enki 'shall change the speech in their mouths ... and so the speech of mankind is truly one'; others read it as Enki once confusing a single speech, out of rivalry with ambitious lords (a-da en a-da nun a-da lugal-la)."}
      - {motif: messenger-crosses-seven-mountains, refs: ["ETCSL 1.8.2.3 158", "ETCSL 1.8.2.3 159"], note: "ĝi6 ... im 1-gin7 šeĝ3-ĝa2 'by night drive on like the south wind', an-bar7 ... im-du8-gin7 zig3-ga 'by day be up like the dew'"}
    hints:
      - "Babel: Gen 11:1-9 (one language, then confusion by God); Zeph 3:9 (God will give the peoples a pure lip to call on his name together) is the closer match if line 146 is a wish for one speech addressing Enlil."
      - "Diversity of tongues as God's sign: Q 30:22; one community then divided: Q 10:19."
      - "No snake, lion, wolf, no fear: compare Isa 11:6-9 and 65:25, Hos 2:18 (covenant with the beasts), Ezek 34:25."
  - id: ane-etcsl-1-8-2-3-first-exchange
    tradition: ane-sumerian
    title: "The messenger reaches Aratta; the lord of Aratta refuses, citing Inana"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Sumerian"
    read: ["ETCSL 1.8.2.3 160-235"]
    tags:
      - {motif: messenger-crosses-seven-mountains, refs: ["ETCSL 1.8.2.3 161", "ETCSL 1.8.2.3 162", "ETCSL 1.8.2.3 170", "ETCSL 1.8.2.3 171", "ETCSL 1.8.2.3 172"], note: "ḫur-saĝ 5 ḫur-saĝ 6 ḫur-saĝ 7-e im-me-re-bal-bal; travels mul-am3 'by starlight' and with Utu by day"}
      - {motif: message-repeated-verbatim, refs: ["ETCSL 1.8.2.3 176", "ETCSL 1.8.2.3 177", "ETCSL 1.8.2.3 178", "ETCSL 1.8.2.3 179", "ETCSL 1.8.2.3 186", "ETCSL 1.8.2.3 207"], note: "a-a-zu lugal-ĝu10 mu-e-ši-in-gi4-in-nam / lugal-za dug4-ga-ni nam-ĝu10 'what is it to me what your master said?'; lines 187-207 repeat 115-135"}
      - {motif: king-born-of-deity, refs: ["ETCSL 1.8.2.3 180", "ETCSL 1.8.2.3 184", "ETCSL 1.8.2.3 185", "ETCSL 1.8.2.3 210", "ETCSL 1.8.2.3 212"], note: "ab2 zid-da kur-šag4-ga tud-da 'whom the good cow bore in the heart of the mountains'; ubur ab2 zid-da ga gu7-a 'suckled at the udder of the good cow'"}
      - {motif: peace-offer-before-war, refs: ["ETCSL 1.8.2.3 187", "ETCSL 1.8.2.3 191", "ETCSL 1.8.2.3 192"]}
      - {motif: refusal-to-bow-to-man, refs: ["ETCSL 1.8.2.3 220", "ETCSL 1.8.2.3 223", "ETCSL 1.8.2.3 224", "ETCSL 1.8.2.3 225", "ETCSL 1.8.2.3 226"], note: "aratta unug-še3 gu2 ĝa2-ĝa2 nu-ĝal2 'Aratta's submission to Unug is out of the question': Inana has made him bar the mountains kur-ra {ĝiš}ig gal-gin7 'as with a great door'"}
    hints:
      - "Diplomatic messenger dialogue with fixed formulas: compare 2 Kgs 18:19-35 (the Rabshakeh's message) and Judg 11:12-28 (Jephthah's messengers)."
  - id: ane-etcsl-1-8-2-3-grain-challenge
    tradition: ane-sumerian
    title: "The lord of Aratta sets the first task: grain carried in nets"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Sumerian"
    read: ["ETCSL 1.8.2.3 236-307"]
    tags:
      - {motif: rival-kings-exchange-impossible-tasks, refs: ["ETCSL 1.8.2.3 281", "ETCSL 1.8.2.3 282", "ETCSL 1.8.2.3 284", "ETCSL 1.8.2.3 290", "ETCSL 1.8.2.3 291"], note: "še {sa}al-kad5-e u3-mu-ni-in-si-si 'if he pours barley into carrying-nets' and heaps it in Aratta's courtyard, and Inana casts Aratta off ur ad6 sar-gin7 'like a dog chasing carrion', then ša-ba-na-gam-e-de3-en 'I will submit'"}
      - {motif: famine-relieved-by-rival-grain, refs: ["ETCSL 1.8.2.3 278", "ETCSL 1.8.2.3 279", "ETCSL 1.8.2.3 281", "ETCSL 1.8.2.3 284"]}
      - {motif: message-repeated-verbatim, refs: ["ETCSL 1.8.2.3 295", "ETCSL 1.8.2.3 296", "ETCSL 1.8.2.3 302", "ETCSL 1.8.2.3 303"], note: "ka-ni-gin7 inim ka-na ba-an-sig10 'he made the message as in his own mouth'; Enmerkar listens gud ri-ri-gin7 'like an ox driver'"}
      - {motif: messenger-crosses-seven-mountains, refs: ["ETCSL 1.8.2.3 297", "ETCSL 1.8.2.3 298", "ETCSL 1.8.2.3 299"], note: "sumun2-gin7 'like a wild cow', nim-saḫar-ra-gin7 'like a sand fly'"}
    hints:
      - "The rival king's despair and search for an answer (236-239) recalls Ahab and the king of Aram's demand in 1 Kgs 20:1-11; a dog chasing carrion: Exod 22:31, 1 Kgs 21:23."
      - "Contest by riddles between kings: 1 Kgs 10:1-3 (Queen of Sheba), and Josephus Ant. 8.143-149 on Hiram and Solomon exchanging riddles."
  - id: ane-etcsl-1-8-2-3-grain-sent-sceptre-riddle
    tradition: ane-sumerian
    title: "Nisaba's wisdom: Enmerkar sends grain in nets; Aratta's famine is relieved; the sceptre demand"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Sumerian"
    read: ["ETCSL 1.8.2.3 308-388"]
    tags:
      - {motif: god-grants-wisdom-to-king, refs: ["ETCSL 1.8.2.3 317", "ETCSL 1.8.2.3 320", "ETCSL 1.8.2.3 321", "ETCSL 1.8.2.3 322"], note: "{d}nisaba nin ĝeštug2 daĝal-la-ke4 / e2-ĜEŠTUG2.{d}NISABA kug-ga-ni ĝal2 mu-na-an-taka4 'opened for him her holy house of wisdom'"}
