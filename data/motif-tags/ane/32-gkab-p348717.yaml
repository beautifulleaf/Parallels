# Full read of the ANE corpus, chunk 32: ORACC CAMS/GKAB tablets from Uruk and Nimrud (SpTU 4-5, BagM Beih. 2, BRM 4, CTN 4, TCL 6, KAR 132):
# SB Gilgameš II and an underworld fragment, rituals against ghosts, potency incantations, namburbi, house-protection rituals,
# kettledrum rituals, Šurpu VII, Muššuʾu V, Lipšur litanies, šuʾilas, Enūma eliš II, Ludlul I, Uruk temple rituals, Anzu I.
# Read from ORACC lemmatized transliterations (word glosses only, no translation); tags rest on the Akkadian (and Sumerian).
new_motifs:
  ritual-against-seeing-dead-in-dreams: {label: "A ritual and amulet are prescribed for a man who keeps seeing dead people (ghosts) in his dreams, to cut them off from him", cluster: underworld}
  leather-amulet-bag-on-neck: {label: "Stones, plants, metals (even human bone) are wrapped in a leather bag and hung on the patient's neck as an amulet", cluster: magic}
  potency-incantation-divine-precedent: {label: "Potency (ša-zi-ga) incantation: as Ištar did for Dumuzi, Nanaya for her husband, Išhara for Almanu, so I do for so-and-so; may his flesh be aroused", cluster: magic}
  snake-in-house-portent-namburbi: {label: "A namburbi ritual undoes the evil portended by a snake seen in a man's house", cluster: omen}
  supplicant-afraid-terrified-before-portent: {label: "The supplicant tells the god he is afraid, frightened and constantly terrified because of the ominous sign", cluster: omen}
  evil-may-not-approach-litany: {label: "Its evil may not come near, not approach, not reach me: a litany of negated verbs of approach", cluster: magic}
  kuppuru-wiping-patient-clean: {label: "The patient is ritually 'wiped' (kuppuru) with dough, flour, clay lumps or a sheep's heart, and the materials carry off the evil", cluster: magic}
  oath-by-life-of-anunnaki: {label: "Exorcistic adjuration 'be sworn by the life of the Anunnaki, the great gods' (zi Anunnakene ... ḫe-pà)", cluster: magic}
  sun-god-opens-bolts-of-heaven: {label: "The sun god opens (or passes through) the bolted locks of heaven", cluster: cosmology}
  justice-at-left-wellbeing-behind: {label: "Prayer that personified Justice (Mīšaru) stand at the supplicant's side and well-being (šulmu) follow behind him", cluster: prayer}
  amulet-stones-bring-favour-and-success: {label: "A set of stones strung on coloured threads makes the wearer reconciled with his god, his prayer heard, favoured by people, his wishes attained, and keeps terror and evil away", cluster: magic}
  ritual-before-venus-star: {label: "A ritual is performed at night before the planet Venus (Delebat), with incense and libation", cluster: cult}
  ritual-turning-back-chest-of-enemy: {label: "Ritual 'to turn back the breast of the evil one and the enemy' from a man's house", cluster: magic}
  evil-eye-mouth-tongue-go-out: {label: "Sumerian litany: the evil eye, the evil mouth, the evil tongue, anything evil, may it go out (ḫe-em-ta-è)", cluster: magic}
  litany-be-favourable-to-me: {label: "Litany asking sun god, judge, personal god, the gods, man and humanity in turn: be favourable to me (še-ga-me-en)", cluster: prayer}
  cut-off-foot-of-evil-from-house: {label: "The aim of a house ritual is to 'cut off the foot of evil' (šēp lemutti parāsu) so that it cannot enter the house", cluster: magic}
  protective-figurines-buried-at-threshold: {label: "Clay figurines of protective spirits, armed with weapons, are buried upright under the threshold or at the gate, addressed and sworn by Šamaš to bar evil from the house", cluster: magic}
  figurines-of-clay-from-garden-ditch: {label: "The clay for the protective figurines is taken from a garden ditch and mixed with water 'of bowing down'", cluster: magic}
  house-sprinkled-with-blood-and-milk: {label: "The house is sprinkled with the blood of a kid mixed with temple-well water and milk", cluster: cult}
  house-swept-sweepings-thrown-in-river: {label: "The house is swept with a palm spadix and its sweepings thrown into the river", cluster: cult}
  bronze-dagger-buried-under-threshold: {label: "A bronze dagger is buried under the threshold of the outer gate, hilt downward and point upward, against epidemic", cluster: magic}
  evil-addressed-hu-hu-lion-wolf: {label: "An incantation addresses the evil prowling round the house: I have gone round, seen and sought you; since you are like a lion without mercy, like a wolf, I have flattened you with my weapons and shut you in", cluster: magic}
  apotropaic-monster-figurines-at-four-sides: {label: "Pairs of figurines of monsters (laḫmu, uridimmu, bašmu, mušḫuššu) are buried right and left at the north, east, west and south of the house", cluster: magic}
  figurine-addressed-pusher-of-evil: {label: "The protective figurine is addressed: you are the image that pushes back the evil one and the enemy; guard my right and left and do not slacken", cluster: magic}
  evil-banished-to-cross-river-and-mountain: {label: "May the evil cross the river, cross the mountain and be 3,600 leagues away from my body", cluster: magic}
  demons-drawn-on-doorposts-addressed: {label: "Figures are drawn on the right and left doorposts and on the door, and an incantation is spoken to each, naming the fierce demons it bars", cluster: magic}
  bed-surrounded-with-flour-circle: {label: "A boundary of flour is drawn round the patient's bed in a ritual", cluster: magic}
  river-hubur-crossing-underworld: {label: "The crossing (nēberu) of the netherworld river Ḫubur is passed by the dead", cluster: underworld}
  genitals-anointed-for-potency: {label: "In a potency rite the man's penis and the woman's vulva are anointed with oil into which an incantation has been recited", cluster: magic}
  adversary-at-law-silenced: {label: "A ritual or amulet is used against 'the lord of my lawsuit' (bēl dabābi), the speaker's adversary at law", cluster: magic}
  may-my-signs-be-favourable: {label: "Prayer that the supplicant's omens and signs (ittātu) become good and his speech find favour", cluster: prayer}
  amulet-wards-off-named-evils: {label: "An amulet is said to keep away a list of named evils: hatred, injustice, 'cutting-off of life', 'seizing of the mouth', terror, and every evil deed", cluster: magic}
  amulet-stones-on-coloured-cords: {label: "Amulet stones are strung on cords of linen, red wool and blue wool", cluster: magic}
  seeds-buried-at-gate-against-disease: {label: "Seeds of seven plants mixed with honey are buried at the right of the outer gate so that illness and epidemic do not come near the house", cluster: magic}
  holy-water-vessel-with-plants-stones-metals: {label: "A holy-water vessel (agubbû) is filled with temple-well water and a catalogue of plants, metals and precious stones for the house's protective spirit", cluster: cult}
  honey-milk-wine-oil-poured-into-pit: {label: "A pit is opened at the gate and honey, milk, wine and oil are offered into it", cluster: cult}
  palm-thorns-buried-at-gate: {label: "Date-palm thorns are buried at the right and left of the gate like a whip against demons", cluster: magic}
  incantation-whispered-into-bulls-ear: {label: "Before the sacrifice an incantation is whispered through a reed into the bull's right ear and another into its left ear", cluster: cult}
  bull-is-offspring-of-anzu: {label: "The sacrificial bull is addressed: 'Bull, you are the offspring of Anzû'", cluster: cult}
  kettledrum-covered-with-hide-of-sacrificed-bull: {label: "The temple kettledrum (lilissu) is re-covered with the hide of a specially chosen, sacrificed black bull", cluster: cult}
  sacrificed-bull-buried-in-cloth-facing-sunset: {label: "The body of the sacrificed bull is wrapped in a red cloth, anointed and buried facing the setting sun", cluster: cult}
  twelve-gods-seated-on-bricks: {label: "Twelve bricks are laid and the twelve gods are seated on them for a rite", cluster: cult}
  auspicious-month-and-day-for-rite: {label: "A rite is to be performed in a favourable month on a propitious day", cluster: cult}
  gods-as-creators-of-all-living: {label: "The great gods are hailed as creators of all that has the breath of life", cluster: creation}
  bull-born-in-moon-gods-fold: {label: "The sacrificial bull was born in the moon god's pure sheepfold and suckled true milk, fit for divinity", cluster: cult}
  kettledrum-deified-as-god: {label: "The consecrated kettledrum is called 'this god', to renew its brilliance like the moon and dwell in an eternal seat", cluster: cult}
  pure-offering-and-incense-before-gods: {label: "The priest declares he has set out pure offerings, poured pure libations and burned pure incense before the gods", cluster: cult}
  lament-sung-when-temple-is-renovated: {label: "When a temple is to be renovated, the lamentation priest sings eršemma laments at dawn on its roof to calm the gods", cluster: cult}
  brushwood-pile-kindled-for-gods: {label: "A pile of brushwood is set alight for Ea and Asalluḫi in the course of a ritual", cluster: cult}
  three-altars-for-ea-shamash-asalluhi: {label: "Three portable altars are set up for Ea, Šamaš and Asalluḫi with linen, cakes, honey, ghee, dates and libations", cluster: cult}
  purification-of-site-with-holy-water: {label: "The ground of a ritual is swept and sprinkled with pure water", cluster: cult}
  goddess-ashratu-in-cult-list: {label: "A list of goddesses honoured in a festival includes Ašratu (Asherah) beside the Queen of Heaven", cluster: cult}
  sceptre-of-kingship-set-up: {label: "The sceptre of kingship is set up in a ritual", cluster: kingship}
  eclipse-ritual-lament-until-moon-clears: {label: "During a lunar eclipse a brazier is lit at the temple gates and the lamentation priest performs laments until the moon becomes bright again", cluster: cult}
  lamenting-god-without-food-or-water: {label: "In a lament the god (or his mourner) says: I am the one who roams and does not sleep, who ate no food and drank no water in his weariness", cluster: lament}
  sunken-ship-of-dilmun-lament: {label: "Lament: I am the Dilmunite whose ship sank in the reed thicket", cluster: lament}
  evil-portent-kept-from-city: {label: "Prayer refrain: may confinement, murder, rebellion and (the evil of) the eclipse not come near the city and its temples", cluster: omen}
  mourners-smeared-with-river-mud: {label: "Mourners smear their faces, hands and feet with river mud and hang a dagger at the collarbone", cluster: lament}
  ritual-remains-thrown-into-river: {label: "After the rite the remains (brazier and ashes, magic circle, twine, purification materials) are thrown into the river", cluster: cult}
  exorcists-at-right-and-left-of-house: {label: "One exorcist stands at the right of the house and another at its left, reciting incantations together", cluster: magic}
  drums-beaten-during-eclipse: {label: "Bronze drums (ḫalḫallatu, manzû, lilissu) are brought out and set by the dais when an eclipse begins", cluster: cult}
  lament-chosen-by-phase-of-eclipse: {label: "A different lament is sung according to how much of the moon the eclipse covers", cluster: cult}
  seven-pure-garments-for-priest: {label: "Incantation of the seven pure garments: the priest is clothed in pure garments so that he is clean and the evil tongue stands aside", cluster: cult}
  goddess-uttu-weaver-of-garment: {label: "The weaving goddess Uttu, daughter of Enlil and beloved of Ea, takes white wool of good sheep and makes the sacred garment", cluster: cult}
  garment-entrusted-to-fuller-washed-pure: {label: "The sacred garment is entrusted to the fuller of the land and washed in pure water", cluster: cult}
  magician-receives-spell-from-asalluhi: {label: "The exorcist's spell is given him by Asalluḫi (Marduk)", cluster: magic}
  curse-descends-from-heaven-like-demon: {label: "The oath-curse (māmītu) is a demon that came down from heaven (like a sparrow from the apsû), wrapped in radiance to the four winds", cluster: magic}
  curse-sickens-people-of-city-and-land: {label: "The curse sickens the people of the settlements; city and land, small and great, young man and girl lament, as it rains down like fog on heaven and earth", cluster: magic}
  god-distant-from-afflicted-man: {label: "The demon or curse meets the man whose god has withdrawn from him and covers him like a garment", cluster: lament}
  spell-of-life-loosens-bond: {label: "By his pure incantation of life the god looses the sufferer's bond (eʾiltu)", cluster: magic}
  damu-great-exorcist-of-gods: {label: "The healing god Damu is the great exorcist whose utterance makes things good", cluster: magic}
  mother-goddess-of-living-creatures: {label: "A goddess is 'mother of all living creatures' (ummi šiknat napišti)", cluster: creation}
  word-of-ea-shines-forth: {label: "Closing formula of an incantation: may the word of Ea shine forth, may Damkina make it go right, Marduk eldest son of the apsû", cluster: magic}
  illness-torn-out-by-hand-of-goddess: {label: "May the goddess's great and gentle hands tear out the illness", cluster: magic}
  adjuration-by-litany-of-gods-and-temples: {label: "The demon is adjured by a long litany of gods and of their temples, one per line ('by Enlil, by Ea, by Sîn ... by Esagil, by Ekur')", cluster: magic}
  four-winds-blow-to-heal: {label: "The four winds (east, west, north, south) are made to blow upon the patient", cluster: magic}
  asalluhi-cuts-off-namtar: {label: "May Asalluḫi cut off your Namtar (fate-demon), cast him from you, and spare you", cluster: magic}
  arise-and-live-healing-command: {label: "The healing incantation ends with the command to the patient: 'Arise and live, you belong to Marduk!' (tibī-ma bulluṭ ša marduk attā)", cluster: magic}
  curse-contracted-by-contact-with-cursed-person: {label: "The curse was contracted by contact: he ate the bread of a cursed man, drank his water, kissed his lips, lay in his bed, sat on his chair, ate at his table, drank from his cup", cluster: magic}
  oaths-sworn-in-many-places-catalogue: {label: "Catalogue of places and occasions where an oath was sworn: at the lighting of the gods, crossing a river, in a boat, at sunrise and sunset, in street and square, in the assembly, by brazier and torch, by bow and bellows", cluster: magic}
  months-each-assigned-to-a-god: {label: "Each month of the year is assigned to a god in a litany (Nisannu of Anu and Enlil, Ayyaru of Ea ...)", cluster: calendar}
  days-of-month-each-assigned-to-a-god: {label: "Each of the thirty days of the month is assigned to a god or a named feast in a litany", cluster: calendar}
  seventh-day-evening-rest-of-god: {label: "The seventh day of the month (also the 3rd and 16th) is the 'evening rest' (nubattu) of a god", cluster: calendar}
  day-of-wrath-in-calendar: {label: "A fixed day of the month (the 19th) is a 'day of wrath' (ibbû) of a deity", cluster: calendar}
  false-writing-with-reed-stylus: {label: "Among his offences the sufferer used the scribe's reed in a quarrel or wrote untruth", cluster: magic}
  river-addressed-as-creator-of-all: {label: "Hymn: You, River, creator of all; when the great gods dug you they set goodness on your banks, Ea made his dwelling in you and named you 'irresistible flood'", cluster: cosmology}
  river-carries-away-evil: {label: "The supplicant asks the River to receive his evil, spare him and take the evil down into its depths", cluster: magic}
  gods-draw-the-design-of-life: {label: "The gods decree fates and draw the designs (plans) of life; from their mouth comes life", cluster: creation}
  evil-of-building-a-grave-averted: {label: "A namburbi averts the evil that building (opening) a grave may bring on the builder and his house", cluster: underworld}
  patient-identified-with-gods: {label: "A litany identifies the patient (or his body) successively with gods and goddesses: 'he is Aya, he is Zarpanītu, he is Gula ...'", cluster: magic}
  ransom-silver-for-grave-weighed-before-shamash: {label: "The builder of a grave weighs out ransom silver (ipṭiru) before Šamaš, saying 'Šamaš, this is his ransom', the exorcist holding up the scales", cluster: underworld}
  prayer-to-anunnaki-dwelling-in-duku: {label: "The worshipper offers funerary food to the Igigi and Anunnaki who dwell in Duku and the wide netherworld, whose seat is terrifying", cluster: underworld}
  grave-foundation-opened-to-netherworld-by-enki: {label: "Spell of the grave: its foundation reaches the netherworld, opened by Enki king of the Apsû; may it be a house of the netherworld, a house of silence", cluster: underworld}
  wise-god-creator-of-discernment: {label: "The god Ea is king of wisdom, creator of discernment, sage of the gods", cluster: wisdom}
  god-bringer-of-flood-and-abundance: {label: "The god brings the river flood and abundance, makes plenty sprout in seas and reed-beds, and creates grain, the life of the people", cluster: fertility}
  my-speech-pleasing-to-god-and-king: {label: "Prayer: may my speech please god and king; may god and king do what I say; may my mouth and tongue counsel me well", cluster: prayer}
  bonds-of-sorcerer-loosened: {label: "Prayer that the god loosen the evil bonds tied by sorcerer and sorceress", cluster: magic}
  goddess-creator-of-gods-kings-and-mankind: {label: "The goddess is hailed as creator of god, king and humankind", cluster: creation}
  goddess-sent-to-reconcile-angry-god: {label: "The supplicant sends the goddess, 'reconciler of the angry god and angry goddess', to make peace for him", cluster: prayer}
  sins-loosed-and-forgotten: {label: "Prayer that the supplicant's guilt be loosed, his sins forgotten, his bond undone and his constraint slackened", cluster: prayer}
  vow-to-proclaim-gods-praise: {label: "The supplicant vows that, if helped, he will proclaim the deity's praise (dalīlī ludlul)", cluster: prayer}
  goddess-of-grain-and-abundance: {label: "The grain goddess (Nisaba) is goddess of abundance who doubles plenty for Enlil", cluster: fertility}
  without-deity-no-life-created: {label: "Without the goddess no people are begotten and no living being created; all the black-headed people and everything that exists are hers", cluster: creation}
  goddess-judges-and-decides: {label: "The goddess judges cases and makes decisions, establishes god and king and exercises kingship", cluster: kingship}
  earth-mother-heaven-raiser: {label: "Of a goddess: the earth gave birth to you, the heavens raised you", cluster: creation}
  prostration-with-nose-to-ground: {label: "Prayer posture: prostration with the nose stroked to the ground (labān appi)", cluster: prayer}
  incense-offered-to-personal-god: {label: "Rubric: incense is lit in a censer and strewn to the supplicant's personal god", cluster: cult}
  who-is-your-rival-incomparability: {label: "Hymnic question of incomparability: who is your rival? your greatness surpasses all the gods", cluster: hymn}
  goddess-fate-decreed-by-anu-name-exalted: {label: "Anu her father decreed her fate, in the assembly of the gods her name was exalted, Enlil gave her kingship of heaven and earth", cluster: hymn}
  king-kneels-before-goddess: {label: "The king squats (kneels) before the goddess and waits attentively on her", cluster: kingship}
  grasping-the-hem-in-supplication: {label: "The supplicant seizes the hem (sissiktu) of the deity's garment in supplication", cluster: prayer}
  goddess-of-love-lady-of-lovers: {label: "The goddess is goddess of allure and love, lady of lovers", cluster: love}
  distant-lands-bow-to-goddesss-word: {label: "Anu, Enlil and Marduk granted the goddess hearing and peace; she makes the insubmissive and distant lands bow to her word", cluster: hymn}
  illness-and-sorcery-banished-litany: {label: "Litany: may the illness of my body go far, the groaning of my flesh be driven off, the asakku of my veins be carried away, sorcery be loosed, the curse go far", cluster: magic}
  goddess-who-hears-prayer-soothes-anger: {label: "The goddess is lady of hearing, who makes the settlements heard and soothes the anger of god and king", cluster: prayer}
  goddess-shaper-of-all-creation-midwife: {label: "The goddess is shaper of all creation who brings living beings safely to birth", cluster: creation}
  catalogue-of-prayers-by-incipit: {label: "A catalogue lists prayers (šuʾilas) by incipit and the god each is addressed to", cluster: scribal}
  god-soothes-monster-with-incantation: {label: "A god is sent to calm the raging monster with his incantation, but turns back", cluster: myth}
  god-angry-by-night-gentle-by-day: {label: "Hymn: the god is furious by night but relents by day; his rage is a storm and a flood, his breath a gentle morning breeze; his heart turns back", cluster: hymn}
  gods-hand-heaven-cannot-bear-soft-hand-saves: {label: "The weight of the god's hand the heavens cannot bear, yet his soft palm rescues the dying", cluster: hymn}
  god-turns-like-cow-to-calf: {label: "The god relents quickly like a mother and keeps turning back like a cow to its calf", cluster: hymn}
  sufferer-vows-to-teach-people-gods-mercy: {label: "The rescued sufferer resolves to proclaim the god's anger and his quick mercy and to teach it to the people", cluster: prayer}
  sufferers-property-divided-by-rabble: {label: "The sufferer's property is shared out among the riffraff, his canal silted up, the harvest song silenced, his city made silent like an enemy's", cluster: lament}
  sufferers-office-given-to-another: {label: "The sufferer's office is given to another and a stranger installed in his cultic duties", cluster: lament}
  prayer-blazes-like-fire-lips-stiff: {label: "The sufferer's heart burns like fire as he prays, his prayers are a squabble, his lips stiff as in gloom", cluster: lament}
  hope-each-dawn-for-good-year-passes: {label: "Each morning the sufferer hopes for good; a month passes, the sun shines; a whole year passes to its term", cluster: lament}
  water-for-hands-offered-to-gods: {label: "Water for washing the hands is presented to the gods (mê qātī našû), and the king and the people touch it", cluster: cult}
  king-with-golden-libation-vessel-in-procession: {label: "The king walks in the gods' procession carrying a golden libation vessel (maqqû)", cluster: kingship}
  gods-stand-before-enthroned-high-god: {label: "When the high god or goddess is enthroned, all the other gods and goddesses take their stations facing him and stand before him", cluster: cosmology}
  heart-of-ox-and-head-of-sheep-offered: {label: "The heart of the ox and the head of the sheep are set before the god, the heart covered with a golden bowl of flour", cluster: cult}
  great-torch-lit-with-sulphur-on-ziggurat: {label: "At nightfall on the temple tower a purification priest lights a great aromatic torch with sulphur fire and recites the hymn 'Star of Anu, lord of heaven'", cluster: cult}
  sacred-fire-carried-to-all-temples-and-houses: {label: "Fire from the temple's great torch is carried down and kindled in every temple of the city, and the people light brushwood fires in their houses", cluster: cult}
  city-gates-open-and-fires-lit-till-dawn: {label: "On the festival night the city watch lights fires in the streets and squares and the city gates stay open until dawn", cluster: cult}
  night-vigil-of-gods-until-dawn: {label: "On the festival night the gods sit in the temple court in a vigil (bayyātu) until dawn; the gate is not shut", cluster: cult}
  torch-quenched-in-holy-water-milk-wine: {label: "The ritual torch is extinguished in holy water mixed with beer, milk, wine and oil", cluster: cult}
  haru-vessel-broken-before-god: {label: "A large ḫarû jar is broken before the god during the festival rite", cluster: cult}
  king-installs-en-priest-in-pure-garment: {label: "In the festival the king performs the elevation to en-ship and clothes himself in pure garments", cluster: kingship}
  adapa-in-uruk-cult: {label: "The sage Adapa appears as a cult figure in an Uruk temple procession", cluster: cult}
  broken-chariot-portent-namburbi: {label: "A namburbi averts the evil portended when the yoke, pole, lance or any part of a prince's chariot breaks on a journey", cluster: omen}
  fall-from-chariot-portent: {label: "The evil of a king or prince falling from his chariot is undone by a namburbi", cluster: omen}
  god-of-steppe-and-nergal-appeased: {label: "Offerings to the great gods, Nergal and the god of the steppe, so that they show mercy and are reconciled with the traveller", cluster: omen}
  sun-god-lights-darkness: {label: "Šamaš is the one who illuminates darkness", cluster: hymn}
  confession-of-unknown-sins: {label: "The supplicant confesses the guilt and sins he has committed, sought out and transgressed, and waits for the god's word", cluster: prayer}
  high-god-flanked-right-and-left-by-gods: {label: "The high god is enthroned with one great god on his right and another on his left, the others in fixed places beside them", cluster: cosmology}
  king-prostrates-before-goddess: {label: "The king goes to the goddess's cella and prostrates himself", cluster: kingship}
units:
  - id: ane-gkab-p348717-r-ii-enkidu-warns
    tradition: ane-akkadian
    title: "Enkidu's warning about Ḫumbaba and Gilgameš's reply: mankind's days are numbered (SpTU 4, 123 = Gilgameš SB II, Uruk MS)"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    version: Standard Babylonian (Late Babylonian Uruk manuscript)
    read: ["GKAB P348717 r.ii:1'-28'"]
    tags:
