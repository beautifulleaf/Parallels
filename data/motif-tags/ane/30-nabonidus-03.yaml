    original: true
    tagger: "Claude (model), reading the Akkadian"
    version: "Standard Babylonian, Sultantepe manuscript"
    read: ["GKAB P338345 o.ii", "GKAB P338345 o.iii"]
    tags:
      - {motif: god-fails-to-rise-for-underworld-envoy, refs: ["GKAB P338345 o.ii:17-21"], note: "ina pānišu ammīni lā takammis ... qaqqaramma inaṭṭal ēnāka: why did you not kneel before him? ... your eyes look at the ground"}
      - {motif: ea-gives-throne-to-take-down, refs: ["GKAB P338345 o.ii:34-46"], note: "Ea to Nergal: descend to the forest of mēsu trees, cut mēsu, white cedar and juniper ... he made a chair (kussû) of copies in lapis and gold"}
      - {motif: god-warned-not-to-sit-eat-drink-wash-or-desire-in-underworld, refs: ["GKAB P338345 o.ii:47-58"], note: "kussâ našûnikka ē tāmirma ē tušib ina muhhi; nuhatimmu akalī našika ē tāmirma ... ul takkal; ṭābihu šīra ... šikara ... mesīt šēpē ... šī ana narmaki īrumma lubbuši illabiš zumurša uštabarrakka attā zikar u sinniš ē ta[...]: they bring you a chair, do not sit; the baker brings bread, do not eat; the butcher meat, the brewer beer, foot-water, do not; when she goes to bathe and shows you her body, do not [desire] as man and woman"}
      - {motif: dead-eat-dust-and-clay-in-darkness, refs: ["GKAB P338345 o.iii:1-7"], note: "ša lā tayyārat ... zummû nūra ... bubūssina akalšina ṭiṭṭi ... iṣṣūri ṣubāt agappu ... eṭûti ašbā ... kīma summe: [house] of no return ... deprived of light ... clay their bread ... clothed like birds in wings ... they dwell in darkness ... [moaning] like doves"}
