      - {motif: tablet-opens-with-blessing-of-gods-word, refs: ["GKAB P296523 t.e:1"], note: "ina amat Anu u Antu lišlim: by the word of Anu and Antu may it go well"}
    hints:
      - "Processions of the ark into the sanctuary with song: 2 Sam 6:12-15; Ps 24:7-10; 68:24-27; 132:8."
      - "All creation and all times called to bless God: Ps 103:20-22; 148; Dan 3:57-90 (LXX, Song of the Three)."
  # ---------------- GKAB: Enūma eliš ----------------
  - id: ane-gkab-p338317-ee-1-apsu-plot-and-marduk-birth
    tradition: ane-akkadian
    title: "Enūma eliš I (STT 1, 1-2): Apsû plots against the gods; Ea kills him; Marduk born; Tiāmat roused"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    version: "Standard Babylonian, Sultantepe manuscript"
    read: ["GKAB P338317", "GKAB P338318"]
    tags:
      - {motif: primeval-father-plots-to-destroy-noisy-children, refs: ["GKAB P338317 o:5'-16'"], note: "mīnâ nīnu ša nibnû nušhallaq ... urriš lū šupšuhat mūšiš lū ṣallat: why should we destroy what we made? (Tiāmat) ... by day let there be rest, by night sleep (Mummu's counsel); Apsû's face brightened at the evil plan"}
      - {motif: wise-god-spellbinds-and-kills-primeval-father, refs: ["GKAB P338317 o:19'-31'"], note: "Ea hasis mimma išeʾʾa šibqīšun ... ušaṣlilma Apsâ ... ipṭurma riksīšu išhaṭ melammīšu ... ikmišuma Apsâ: Ea perceived their scheme, made a spell, put Apsû to sleep, loosened his band, took his radiance, bound and [killed] him"}
      - {motif: victor-builds-dwelling-on-slain-foe, refs: ["GKAB P338317 o:31'-35'"], note: "eli Apsî šubassu ... kummišu šupšuhiš: his dwelling upon the Apsû ... his cella in rest"}
      - {motif: newborn-god-with-doubled-eyes-and-ears, refs: ["GKAB P338317 r:1'-18'"], note: "īmuršuma Anu bānû ... irtibû 4-ta.am u īnā kīma šuāti ... Māri-utu māri Šamši ... labiš melammī ešret ilī šaqîš itpur pulhātu hamšatšina: four [ears] grew and eyes likewise ... 'my son the sun' ... clothed in the radiance of ten gods, fifty terrors heaped on him"}
      - {motif: four-winds-created, refs: ["GKAB P338317 r:19'-22'"], note: "ibnima šāra erbetta umallid Anu qātuššu umalla māri limmelli ... ušabši agâmma udallah Tiāmat: Anu made the four winds and gave them to his son to play; he made a wave and stirred Tiāmat"}
      - {motif: gods-incite-mother-to-avenge-father, refs: ["GKAB P338317 r:23'-34'"], note: "inūma Apsâ harmaki inārūma idušu lā tallikima qâliš tušbi: when they killed Apsû your husband you did not go to his side but sat silent; we cannot sleep"}
    hints:
      - "God gives no rest/noise of humans motif inverted: Gen 6:1-7 (and Atrahasis). Divine conflict over primordial waters: Ps 74:13-14; 89:10-11; Job 26:12; Isa 51:9."
      - "Four winds of heaven stirring the great sea: Dan 7:2."
  - id: ane-gkab-p338321-ee-4-battle-with-tiamat
