      - {motif: protective-spirits-go-before-and-behind, refs: ["Nabonidus 2001 ii:37-38"], note: "šēdu dumqi lamassu dumqi ša ittiya tapqiduma: the good šēdu and lamassu you entrusted to me, who brought me to old age"}
      - {motif: loyal-servant-of-successive-kings, refs: ["Nabonidus 2001 ii:40-51"], note: "in the 21 years of Nabopolassar, 43 of Nebuchadnezzar, 4 of Neriglissar, 68 years, I revered them with all my heart and kept watch for them; I presented Nabonidus before Nebuchadnezzar and Neriglissar; he served day and night ... they raised my head like a daughter of their own"}
      - {motif: funerary-offerings-for-dead-kings, refs: ["Nabonidus 2001 ii:51-59", "Nabonidus 2001 iii:1-4"], note: "arkāniš šīmti ubilšunūti ... qutrinnu ... alpī immerī marûti akalī šikari karāni šamni dišpi u inbi kirî kalāma kispī akassipšunūtima: after fate carried them off, since none of their sons or people did it, I monthly offered them incense, fattened oxen and sheep, bread, beer, wine, oil, honey and every garden fruit as kispu"}
    hints:
      - "Long life with undimmed eyes and vigour: Deut 34:7 (Moses at 120); Josh 14:10-11 (Caleb at 85); Gen 50:23 (Joseph sees the third generation, children born on his knees); Job 42:16; Ps 128:6."
      - "A pious woman serving at court through several reigns: 2 Kgs 8:1-6; a mother asking the god to pardon her son: Job 1:5."
      - "Offerings to the dead: Deut 26:14; Sir 30:18; Tob 4:17."
  - id: ane-nabonidus-2001-iii-death-and-mourning
    tradition: ane-akkadian
    title: "Adad-guppi stele: her death in Nabonidus' 9th year, burial and seven days of mourning (Nabonidus 2001 iii 5-55)"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    read: ["Nabonidus 2001 iii:5-56"]
    tags:
      - {motif: death-old-and-full-of-days, refs: ["Nabonidus 2001 iii:5-7"], note: "ina šatti 9 Nabû-naʾid ... šīmtu ramānišu ubilšuma: in the 9th year of Nabonidus her own fate carried her off (the narrative passes from first to third person here)"}
      - {motif: queen-mother-buried-with-royal-honours, refs: ["Nabonidus 2001 iii:8-23"], note: "šalamtaša ukammisma lubūšī damqūti kitû nawri ... hurāṣu ... abnī nisiqti ... šamni ṭābi šalamtaša upaššišma iškunū ina niṣirti: he wrapped her corpse in fine garments of bright linen, gold, choice stones, anointed it with sweet oil and laid it in a hidden place; oxen and sheep were slaughtered; people of Babylon, Borsippa, distant princes and governors from Egypt to the Lower Sea were gathered"}
      - {motif: seven-day-mourning, refs: ["Nabonidus 2001 iii:24-29"], note: "sipittu u bikīti ṣarpiš iškunūma iddû rigimšun 7 urrī u 7 mušâti malīti uhtallilū lubūšīšunu eperu sahpū: they made bitter mourning and weeping, raised their cry seven days and seven nights, played the lament-pipes, their clothes covered with dust"}
      - {motif: national-mourning-hair-shorn, refs: ["Nabonidus 2001 iii:29-31"], note: "ina 7-i ūmi ... nišī māti kalāma pērēti ugallibūma: on the seventh day the people of the whole land shaved their hair"}
      - {motif: mourning-in-dust, refs: ["Nabonidus 2001 iii:28-29"]}
      - {motif: mourners-sent-home-with-oil-and-food, refs: ["Nabonidus 2001 iii:34-43"], note: "šamnu ṭābu ana rēšišunu ušappik libbašunu ušaliṣma unammir zīmīšun urhu mātišunu ušaṣbissunūtima: he poured sweet oil on their heads, gladdened their hearts, brightened their faces and set them on the road to their lands"}
      - {motif: future-king-to-invoke-predecessors-name, refs: ["Nabonidus 2001 iii:43-55"], note: "mannu attā lū šarru lū rubû ... Sîn ... pilahma ... suppišunūti: whoever you are, king or prince, revere Sîn ... pray to them (the end is broken; zērka 'your seed' survives in iii:55')"}
    hints:
      - "Seven days of mourning: Gen 50:10; 1 Sam 31:13; Job 2:13; Sir 22:12. Shaving the head in mourning: Jer 16:6; 41:5; Amos 8:10."
      - "Anointing and refreshing mourners at the end of mourning: 2 Sam 12:20; Isa 61:3 ('oil of gladness instead of mourning')."
      - "Embalmed and mourned by an assembly from abroad: Gen 50:2-14 (Jacob mourned by Egyptians)."
  # ---------------- GKAB: Gilgameš ----------------
