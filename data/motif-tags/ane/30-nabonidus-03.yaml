# Full read, chunk 30: Nabonidus 03, 28, 47, 2001 (ORACC RIBo babylon7) and the Akkadian
# literary and ritual tablets of GKAB (Sultantepe STT, Uruk SpTU/BRM, Nimrud CTN): Gilgameš,
# Enūma eliš, Erra, Anzû, Ludlul, Nergal and Ereškigal, the Uruk New Year ritual.
# Read from the ORACC lemmatized transliteration with word glosses (no translation).
new_motifs:
  god-image-carried-off-to-enemy-capital: {label: "A conqueror carries the city god's image off to his own capital, where it dwells for a counted number of years", cluster: cult}
  divine-anger-ends-when-appointed-days-are-full: {label: "The god's anger rests when the days are full and the fixed date (adannu) is reached, after a counted term of years", cluster: prophecy}
  avenging-foreign-ally-floods-enemy-land: {label: "The god gives the wronged king a foreign ally (the Medes, Umman-manda) who sweeps the oppressor's land like a flood and takes revenge for him", cluster: kingship}
  pious-king-refuses-to-touch-enemy-gods: {label: "The victorious king does not lay a hand on the cult of the defeated land's gods, though his ally ravages their shrines", cluster: cult}
  king-sleeps-on-ground-in-penitence: {label: "The king lets his hair grow matted and lies on the bare ground as a sign of grief or penitence before the gods", cluster: cult}
  wrong-cult-image-replaced-by-proper: {label: "An improper image is set in the god's shrine; a later king removes it and restores the god's rightful image and emblems", cluster: cult}
  goddess-departs-in-anger-from-shrine: {label: "A goddess, stripped of her proper rites and emblems, leaves her temple in anger and dwells in a place not her own", cluster: cult}
  ignorant-child-king-on-throne-against-gods-will: {label: "A young king's son, without understanding, sits on the throne against the will of the gods and is removed", cluster: kingship}
  king-raised-to-throne-not-seeking-kingship: {label: "The king protests that kingship was not in his heart, yet the god called him to it and filled his hands with rule", cluster: kingship}
  conjunction-of-great-star-and-moon-reassuring-dream: {label: "The king dreams of the conjunction of a great star and the moon; a figure at his side tells him it portends no evil", cluster: revelation}
  dead-king-appears-in-dream-and-asks-its-meaning: {label: "A former king appears to the reigning king in a dream and asks him what good thing he has seen", cluster: revelation}
  healing-goddess-turns-face-to-king: {label: "The healing goddess who 'revives the dead' turns her face to the praying king and gives him long life", cluster: cult}
  temple-doors-of-cedar-clad-in-silver: {label: "The king makes new temple doors of cedar and clads them with silver or bronze so they shine like daylight", cluster: cult}
  war-captives-given-to-gods-as-temple-labourers: {label: "The king gives thousands of war captives to the gods to carry the hod (tupšikku) in their temples", cluster: cult}
  temple-desolate-fixed-years-until-god-returns: {label: "A temple lies desolate for a fixed number of years (54) after the enemy destroys it, until the god's appointed time of reconciliation comes and he returns", cluster: prophecy}
  ancient-royal-seal-with-god-image-restored: {label: "A precious seal of an ancient king bearing the god's image and praise is recovered and hung again on the god's statue", cluster: cult}
  extispicy-report-on-sheep-liver: {label: "An extispicy report lists the marks of the sheep's liver and lungs one by one with their favourable outcomes", cluster: divination}
  king-destined-in-mothers-womb-for-kingship: {label: "Gods fix the king's destiny for kingship while he is still in his mother's womb", cluster: kingship}
  god-in-dream-orders-temple-rebuilt: {label: "Two gods stand before the king in a dream and command him to rebuild a god's ruined temple", cluster: revelation}
  king-objects-that-enemy-surrounds-temple: {label: "Commanded to rebuild, the king objects that an enemy power surrounds the site; the god answers that the enemy will soon cease to exist", cluster: revelation}
  young-servant-king-overthrows-great-enemy: {label: "The god raises a young 'servant' king (Cyrus of Anšan) who with a small army scatters a vast foe and carries its king captive", cluster: kingship}
  king-trembles-at-gods-unchangeable-word: {label: "Hearing the god's unchangeable command the king becomes afraid, worried and pale-faced, but does not slacken", cluster: kingship}
  workforce-mustered-from-gaza-to-gulf: {label: "The king musters labour from the border of Egypt (Gaza) and the Upper Sea to the Lower Sea to build the temple", cluster: kingship}
  king-digs-to-ancient-foundation-deposit: {label: "Rebuilding a temple, the king digs down until he finds the foundation deposit of an ancient king and builds exactly on it", cluster: cult}
  inscription-of-predecessor-anointed-and-replaced: {label: "The king reads an earlier ruler's inscription, does not alter it, anoints it with oil, offers sacrifice and puts it back with his own", cluster: cult}
  foundation-mortar-mixed-with-beer-wine-oil-honey: {label: "Temple mudbricks and mortar are mixed with beer, wine, oil and honey at the founding", cluster: cult}
  king-afraid-at-collapsing-temple-wall: {label: "The king is afraid and pale when the walls of the god's house collapse, and moves the god to another house while he rebuilds", cluster: cult}
  time-span-back-to-ancient-king-counted: {label: "The text counts the years back to an ancient king (3,200 years to Naram-Sin; 800 years to Šagarakti-Šuriaš) whose foundation was found", cluster: kingship}
  people-sin-forget-rites-and-speak-lies: {label: "The people of the cities sin against the god, forget his rites and speak lies and untruth", cluster: prophecy}
  people-devour-one-another-like-dogs: {label: "Sinful people devour one another like dogs, and the god sends disease and famine among them", cluster: prophecy}
  king-withdraws-to-arabian-oases-ten-years: {label: "The king leaves his capital and for ten years wanders among the Arabian oases (Tema, Dedan, Fadak, Khaybar, Yadiʿ, Yathrib), not entering his city", cluster: kingship}
  arabs-raid-and-are-subdued: {label: "The Arabs who stood to plunder are broken by the god's word and bow at the king's feet", cluster: kingship}
  moon-god-hymn-weapon-touches-heaven: {label: "Hymn to the moon god: his weapon touches heaven and smashes earth; he holds the rites of Anu, Enlil and Ea, and the gods quake before him like reeds", cluster: cult}
  god-says-his-word-not-twice: {label: "The high god's command is never turned back and his word is not spoken twice", cluster: cult}
  return-at-appointed-time-after-dream: {label: "When the year is full and the god's appointed time has come the exile returns home, as a frightening night dream had foretold", cluster: prophecy}
  near-and-far-kings-come-kiss-feet: {label: "Kings near and far hear of the god's might, fear, come up with gifts and kiss the king's feet", cluster: kingship}
  queen-mother-devotee-of-moon-god-from-childhood: {label: "A king's mother has sought the moon god and his consorts from her childhood and reveres them all her life", cluster: cult}
  pious-woman-gives-up-fine-clothes-wears-sackcloth: {label: "A devout woman renounces fine wool, silver, gold, new clothes, perfume and oil and wears a torn garment and sackcloth while she prays", cluster: cult}
  lifespan-dated-by-reigns-of-kings: {label: "A long life is measured out by the regnal years of a series of named kings", cluster: kingship}
  prayer-of-mother-for-sons-kingship: {label: "A mother lifts her hands to the god and prays that her son, whom the god named for kingship, be protected and restore the god's rites", cluster: cult}
  centenarian-with-sound-senses: {label: "A woman of over 100 years keeps clear eyesight, keen hearing, sound hands and feet, choice words and good health", cluster: wisdom}
  mother-entrusts-son-to-god-asks-forgiveness: {label: "A dying mother entrusts her son to her god and asks that the god pardon him if he sins", cluster: cult}
  funerary-offerings-for-dead-kings: {label: "The devotee makes monthly kispu offerings (incense, oxen, sheep, bread, beer, wine, oil, honey, fruit) for the dead kings she served", cluster: underworld}
  queen-mother-buried-with-royal-honours: {label: "The king buries his mother's corpse wrapped in fine linen and gold, anointed with oil, with sacrifices and a gathering of princes", cluster: underworld}
  national-mourning-hair-shorn: {label: "The whole land mourns a royal death: loud weeping, garments and dust, seven days and nights of lament, and the people shave their hair", cluster: underworld}
  mourning-of-animals-and-places-for-dead-friend: {label: "The mourner calls on animals, rivers, trees, elders, young men, ploughman, shepherd, brewer and harlot to weep for his dead friend", cluster: underworld}
  speech-to-door-made-for-temple: {label: "The dying hero addresses the door he made for a god's temple, regretting it, wishing he had cut it down and given it elsewhere", cluster: underworld}
  hero-restores-shrines-destroyed-by-flood: {label: "The hero returns to their places the shrines destroyed by the flood and re-establishes the rites for the people", cluster: kingship}
  gods-wind-catalogue-against-monster: {label: "The sun god raises thirteen named winds (south, north, east, west, blast, gale, ...) to darken the monster's face and stop him", cluster: cosmology}
  hero-is-not-a-god-yet-shares-gods-roles: {label: "The mother pleads that her son, though not a god, shares heaven, the sceptre, the Apsu's wisdom and rule of the black-headed with the gods", cluster: kingship}
  new-year-procession-of-anu-with-incantations: {label: "In the New Year ritual the god's image goes in procession from his cella to the akītu house while priests recite incantations at each station and pray seven times", cluster: cult}
  litany-of-gods-blessing-the-god: {label: "A litany of all the gods of heaven, earth, Apsu, and day, month and year is asked to bless (karābu) the processing god", cluster: cult}
  primeval-father-plots-to-destroy-noisy-children: {label: "The primeval father and his vizier plot to destroy the noisy younger gods so that he may rest by day and sleep at night", cluster: creation}
  newborn-god-with-doubled-eyes-and-ears: {label: "The newborn champion god has four eyes and four ears, doubled divinity, and is clothed in the radiance of ten gods", cluster: creation}
  gods-swear-oath-in-water-and-oil-touching-throat: {label: "The gods swear an oath with water and oil and touch their throats, binding themselves to the new king of the gods", cluster: treaty}
  divine-bow-set-in-sky-as-constellation: {label: "The victorious god's bow is kissed by the high god, given names and set in the sky as a constellation", cluster: cosmology}
  gods-build-babylon-and-esagil: {label: "The grateful gods mould bricks for a year and build Babylon and the temple Esagil with its ziggurat for their king", cluster: cult}
  temple-on-earth-made-like-its-heavenly-image: {label: "What the god does in heaven is to be done likewise on earth: the earthly cult is the image (tamšīlu) of the heavenly", cluster: cult}
  monster-slayer-as-farmer-and-provider: {label: "The divine warrior's names make him the giver of grain, pasture and furrow, the irrigation lord of the gods", cluster: creation}
  craftsmen-endowed-and-images-refurbished: {label: "The god gives the craftsmen wisdom and skill so that the god's statue and its adornment are refurbished brighter than before", cluster: cult}
  monster-taunts-arrow-to-return: {label: "The monster's spell sends the arrow back: reed to the reed-bed, bow to the forest, string to the sheep, feathers to the birds", cluster: kingship}
  dead-gods-of-tiamat-counted: {label: "The victorious god counts the defeated leader among the dead gods (Uggû) and takes from him the tablet of destinies that was not his", cluster: creation}
  underworld-queen-invited-by-gods-sends-envoy: {label: "Because the underworld queen cannot go up to the gods' banquet, the gods send a messenger to her, and she sends her vizier up to receive her portion", cluster: underworld}
  stairway-between-heaven-and-underworld: {label: "A long stairway of heaven (simmiltu šamāmī) joins heaven and the underworld; messengers go up and down it", cluster: underworld}
  god-fails-to-rise-for-underworld-envoy: {label: "Only one god in the assembly does not stand up before the underworld queen's envoy, causing offence", cluster: underworld}
  queen-demands-lover-or-threatens-dead-rise: {label: "The underworld queen demands that the god who slept with her be sent back as her husband, or she will raise the dead to eat the living", cluster: underworld}
  god-seizes-underworld-queen-by-hair-and-marries: {label: "The god forces his way through the gates, seizes the underworld queen by her hair, and they embrace and become husband and wife", cluster: underworld}
  days-fulfilled-road-of-fate: {label: "When a man's days are full he 'takes the road of fate', i.e. dies", cluster: underworld}
  dynastic-claim-as-heir-of-great-predecessors: {label: "A usurping king presents himself as the strong envoy and true heir of the great kings before him, unlike their own sons", cluster: kingship}
  heavenly-body-calls-dreamer-by-name: {label: "In a dream the great star or god in heaven calls the dreamer by his name", cluster: revelation}
  young-man-at-dreamers-side-explains-sign: {label: "A young man (eṭlu) stands at the dreamer's side and explains that the sign he fears portends no evil", cluster: revelation}
  offerings-to-stars-for-long-life: {label: "The king sets out offerings to the planets and stars of heaven and prays to them for long life and a firm throne", cluster: cult}
  gods-dressed-in-ceremonial-garments: {label: "The king provides the gods' statues with new ceremonial garments (tēdīqu) befitting their divinity", cluster: cult}
  king-visits-ancient-cult-cities-with-offerings: {label: "The king travels to the ancient cult cities (Uruk, Larsa, Ur, Keš) and brings silver, gold, stones and fattened bulls before their gods", cluster: cult}
  king-of-the-four-quarters: {label: "The king bears the titles great king, mighty king, king of the universe, king of the four quarters", cluster: kingship}
  god-shows-king-ancient-foundation: {label: "The god himself shows the king the long-lost ancient foundation of his temple on an auspicious day", cluster: revelation}
  warrior-goddess-with-bow-and-quiver: {label: "The goddess of battle carries bow and quiver, flattens the enemy, destroys the wicked and marches before the gods", cluster: cult}
  unprecedented-divine-deed-never-written: {label: "A wonder of the god is proclaimed that no one had known since distant days, that had never come to the land nor been written on a tablet", cluster: revelation}
  god-comes-down-from-heaven: {label: "The god himself comes down from heaven to the land before the king", cluster: revelation}
  gods-guard-wandering-king: {label: "The gods entrust a guard of well-being and life to the king while he wanders far from his city", cluster: kingship}
  god-uproots-land-whose-heart-forsakes-him: {label: "The land the god chooses stands firm for ever; the land he decides to break, he removes his fear from it and casts it down", cluster: prophecy}
  no-light-without-gods-word: {label: "Without the god's command no land is founded and no light exists in the land", cluster: creation}
  gods-return-to-favour-after-withdrawing: {label: "The gods and goddesses who had turned away and gone far return and speak favour for the king", cluster: cult}
  prayer-for-gods-return-to-city: {label: "The devotee prays day and night that the angry god return to his city so that the people may revere him", cluster: cult}
  dream-fulfilled-exactly: {label: "The dreamer heeds the god's word spoken in a dream and lives to see it fulfilled", cluster: revelation}
  god-lifts-head-and-gives-good-name: {label: "The god lifts up the devotee's head and gives her a good name in the land with long days", cluster: cult}
  loyal-servant-of-successive-kings: {label: "A courtier faithfully serves a series of kings for decades, keeping watch over them day and night and is honoured like their own daughter", cluster: kingship}
  mourners-sent-home-with-oil-and-food: {label: "At the end of mourning the mourners are fed, anointed with sweet oil on their heads, their faces brightened and sent home", cluster: underworld}
  rite-repeated-seven-times: {label: "A prayer or incantation is recited seven times at each station of a rite", cluster: cult}
  tablet-opens-with-blessing-of-gods-word: {label: "A tablet is headed with the wish 'by the word of god X may it go well'", cluster: cult}
  four-winds-created: {label: "The high god creates the four winds and gives them to his young son to play with", cluster: creation}
  gods-incite-mother-to-avenge-father: {label: "Restless gods rebuke the primeval mother for sitting silent when her husband was killed and urge her to take revenge", cluster: creation}
  constellation-made-to-vanish-and-reappear: {label: "To test the new champion's word, a constellation is destroyed and recreated at his command", cluster: creation}
  primeval-mother-in-ecstatic-frenzy: {label: "Hearing the challenge, the primeval sea-mother becomes like an ecstatic (mahhû) and shrieks", cluster: creation}
  rain-and-clouds-from-monsters-body: {label: "From the slain monster's spittle and body the god makes rain, clouds and fog", cluster: creation}
  images-of-defeated-monsters-set-as-reminder: {label: "The victor makes images of the defeated monsters and sets them at the temple gate as a sign never to be forgotten", cluster: cult}
  fates-fixed-by-seven-gods: {label: "Seven gods of destinies are appointed in the assembly to decide fates", cluster: cosmology}
  sun-son-of-the-gods-in-whose-light-they-walk: {label: "The god is the shining 'son, the sun of the gods', in whose bright light the gods walk for ever", cluster: cult}
  who-incited-the-battle-question: {label: "The high god asks the assembly who instigated the strife and made the battle", cluster: creation}
  deity-rides-the-sea-as-vehicle: {label: "The vanquished sea is the god's vehicle and he its sailor", cluster: creation}
  god-enthroned-in-house-of-prayer-receives-gifts: {label: "The god sits high in the 'house of prayer' and the gods bring their gifts before him", cluster: cult}
  warrior-god-stands-guard-day-and-night: {label: "The warrior god is set to stand guard before the god's image night and day without ceasing", cluster: cult}
  families-scattered-in-catastrophe: {label: "In the catastrophe people are driven from city to city, fathers and sons separated, mothers mock daughters, wild beasts roam", cluster: prophecy}
  blood-rains-death-clouds: {label: "In the divine battle armour is bathed in blood, clouds of death rain down and arrows flash like lightning", cluster: kingship}
  hero-sends-report-to-wise-god-for-advice: {label: "The hero sends his messenger back to the wise god to report his failure and ask for new instructions", cluster: kingship}
  theophany-envelops-land-in-radiance: {label: "The warrior god's fierce radiance and awe-inspiring glow cover the land and envelop all countries", cluster: kingship}
  underworld-gods-tremble-at-warriors-shout: {label: "At the warrior's battle-cry the gods of the underworld quake and the dwelling of Arallu darkens", cluster: underworld}
  warrior-god-praised-as-incomparable: {label: "The victorious warrior god's fame is boundless; there is none like him", cluster: kingship}
  namtar-recognises-the-god-who-did-not-rise: {label: "The underworld vizier sees the arriving god in the shadow of the door and turns pale, recognising the one who did not rise for him", cluster: underworld}
  god-keeps-underworld-taboos-at-first: {label: "The visiting god refuses the underworld chair, bread, meat, beer and foot-water until the queen shows him her body", cluster: underworld}
  purification-water-sprinkled-on-house: {label: "Pure water is sprinkled through a house to purify it", cluster: cult}
  underworld-queen-grants-rule-to-husband: {label: "The underworld queen offers her divine husband to share the throne and the rites of the great Underworld", cluster: underworld}
units:
  # ---------------- Nabonidus 03 (Babylon stele) ----------------
  - id: ane-nabonidus-03-i-assyria-wrath-on-babylon
    tradition: ane-akkadian
    title: "Babylon stele: the Assyrian king's evil against Babylon and Marduk's 21 years in Assur (Nabonidus 3 col. i)"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    read: ["Nabonidus 03 i"]
    tags:
      - {motif: god-image-carried-off-to-enemy-capital, refs: ["Nabonidus 03 i:14'-17'"], note: "qāti rubê Marduk iṣbatma ušērib qereb Baltil: he took the hand of prince Marduk and brought him into Assur (Sennacherib, 689 BCE)"}
      - {motif: divine-anger-ends-when-appointed-days-are-full, refs: ["Nabonidus 03 i:23'-29'"], note: "21 MU.MEŠ qereb Baltil irtame šubassu; imlû ūmū ikšuda adannu inūhma uzzašu: for 21 years he dwelt in Assur; the days were full, the fixed date arrived, his anger rested"}
      - {motif: seventy-years-of-desolation-written, refs: ["Nabonidus 03 i:23'"], note: "the term here is 21 years; compare Esarhaddon's 'seventy turned into eleven'"}
      - {motif: deity-abandons-city, refs: ["Nabonidus 03 i:18'-25'"], note: "presented as the god's own anger: kīma uzzi ilīma ... ul ipšur kimiltašu"}
      - {motif: king-killed-by-sons-in-temple, refs: ["Nabonidus 03 i:35'-41'"], note: "māru ṣīt libbišu ina kakki urassibšu: the son of his own body struck him with the weapon (Sennacherib); the temple setting is not stated here"}
      - {motif: god-returns-to-his-temple, refs: ["Nabonidus 03 i:30'-34'"], note: "Esagil u Babili ihsus šubat bēlūtišu: he remembered Esagil and Babylon, the seat of his lordship"}
    hints:
      - "Compare 2 Kgs 19:37 and Isa 37:38 (Sennacherib killed by his sons) and 2 Chr 32:21."
      - "The term of divine anger fulfilled: Jer 25:11-12; 29:10; Dan 9:2; 2 Chr 36:21; Isa 40:2."
      - "God's image taken captive: 1 Sam 4-5 (the ark at Ashdod); Jer 48:7; 49:3 (Chemosh and Milcom go into exile)."
  - id: ane-nabonidus-03-ii-medes-avenge-babylon
    tradition: ane-akkadian
    title: "Babylon stele: Marduk gives Nabopolassar the Medes as ally; Assyria's shrines destroyed (Nabonidus 3 col. ii)"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    read: ["Nabonidus 03 ii"]
    tags:
      - {motif: avenging-foreign-ally-floods-enemy-land, refs: ["Nabonidus 03 ii:1'-13'"], note: "rēṣu iddinšum tappâ ušaršiš šar Umman-manda ša māhiri lā išû ... abūbāniš ispun utēr gimillu Babili: he gave him a helper, the king of the Umman-manda who has no rival ... he flattened like the flood and took revenge for Babylon"}
      - {motif: god-summons-barbarian-invaders, refs: ["Nabonidus 03 ii:14'-31'"], note: "the 'king of the Umman-manda who has no awe' (lā ādiru) destroys all the shrines of the gods of Subartu and the cities of the border of Akkad"}
      - {motif: pious-king-refuses-to-touch-enemy-gods, refs: ["Nabonidus 03 ii:32'-38'"], note: "šar Babili ... ša šillati ikkibšu lā ubil qāssu ana pelludê ilī kalāma: the king of Babylon, to whom sacrilege is taboo, did not lay his hand on the rites of all the gods"}
      - {motif: king-sleeps-on-ground-in-penitence, refs: ["Nabonidus 03 ii:39'-41'"], note: "išši malâ mayyāl qaqqar inâl: he let his hair grow matted and lay on a bed on the ground"}
    hints:
      - "The Medes as God's instrument against an empire: Isa 13:17; Jer 51:11, 28."
      - "King sleeping on the ground: 2 Sam 12:16 (David lies on the ground); 2 Sam 13:31. The flood-like enemy: Isa 8:7-8; Dan 9:26; 11:10."
  - id: ane-nabonidus-03-iii-ishtar-of-uruk-restored
    tradition: ane-akkadian
    title: "Babylon stele: Ištar of Uruk departs in anger and her image is restored (Nabonidus 3 col. iii)"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    read: ["Nabonidus 03 iii"]
    tags:
      - {motif: goddess-departs-in-anger-from-shrine, refs: ["Nabonidus 03 iii:16'-26'"], note: "in Eriba-Marduk's reign the Urukeans changed her rites, ... ina uzzi ištu qereb Eanna tūṣûma tūšibu lā šubassu: in anger she left Eanna and dwelt in a seat not her own"}
      - {motif: wrong-cult-image-replaced-by-proper, refs: ["Nabonidus 03 iii:27'-38'"], note: "lamassu lā simat Eanna ušēšibu ... ištaru lā simātu ištu qereb Eanna ušēṣima Innina utēr ana Eanna: an improper protective goddess was seated; [the king] removed the unfitting goddess and returned Innina to Eanna"}
      - {motif: deity-abandons-city, refs: ["Nabonidus 03 iii:23'-26'"]}
      - {motif: hero-restores-forgotten-rites, refs: ["Nabonidus 03 iii:1'-10'"], note: "[the king] completer of their purification rites (mušaklil šuluhhišun), who resettled the deserted gods (ilī harbūtu) and the ruined chapels"}
    hints:
      - "Improper image in the sanctuary removed: 2 Kgs 21:7; 23:6 (the Asherah taken out of the temple); Ezek 8:3-5 (the image of jealousy)."
      - "The seven lions of Ištar's throne: 1 Kgs 10:19-20 (lions on Solomon's throne)."
  - id: ane-nabonidus-03-iv-anunitu-and-labashi-marduk
    tradition: ane-akkadian
    title: "Babylon stele: Anunītu restored by Neriglissar; the child-king Lābāši-Marduk (Nabonidus 3 col. iv)"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    read: ["Nabonidus 03 iv"]
    tags:
