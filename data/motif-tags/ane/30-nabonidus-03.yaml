      - {motif: namtar-recognises-the-god-who-did-not-rise, refs: ["GKAB P338345 o.iii:22-29"], note: "Namtar illikma ina ṣilli dalti ippalaššu Erra ... kīma nikis bīni irqū pānūš kīma šapti kunninni iṣlima šaptašu: Namtar saw Erra in the shade of the door; his face went pale like a cut tamarisk, his lips dark like the rim of a kunninu-vessel"}
      - {motif: seven-gates-of-underworld, refs: ["GKAB P338345 o.iii:42-49"], note: "named gates of Bidu, Enkišar, Endukuga, Ennugigi"}
      - {motif: messenger-kisses-ground-before-lord, refs: ["GKAB P338345 o.iii:50-52"]}
      - {motif: god-keeps-underworld-taboos-at-first, refs: ["GKAB P338345 o.iii:53-65"], note: "tišab kussâ annî ... ē tāmirma ... akalī ul īkul ... šīrušu ul īkul ... šikarušu ul išti ... narmaki īrumma ... sinniš ... libbišu: [offered] the chair, bread, meat, beer, foot-water, he refused; she went to bathe ... [and he gave in to] his heart"}
    hints:
      - "Food of the underworld forbidden: compare Prov 9:17-18 (Folly's stolen bread whose guests are in Sheol); the man of God forbidden to eat or drink at Bethel: 1 Kgs 13:8-9, 16-22."
      - "The dead in darkness and dust: Job 10:21-22; Ps 88:7, 13; Isa 14:9-11; 29:4 (voice like a ghost from the dust)."
  - id: ane-gkab-p338345-ne-r-i-ii-lovers-and-namtars-mission
    tradition: ane-akkadian
    title: "Nergal and Ereškigal (STT 1, 28) rev. i-ii: six days in bed; Nergal escapes; Ereškigal's demand and Namtar's search"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    version: "Standard Babylonian, Sultantepe manuscript"
    read: ["GKAB P338345 r.i", "GKAB P338345 r.ii"]
