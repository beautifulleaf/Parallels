      - {motif: lovers-in-bed-six-days-then-god-slips-away, refs: ["GKAB P338345 r.i:12-23"], note: "innadrūma ina mayyāli šitmuriš ištēn ūmu šanû ūmu ṣallū ... 6 ūmu ... Nergal ina lā bašî ... muššerinnima ahāti ... lullikma ana Erṣet lā tāri: they embraced, went passionately to bed; one day, two days they lay ... [on the seventh] Nergal [rose]: let me go, my sister ... (lie) I will go to the land of no return [and return]"}
      - {motif: stairway-between-heaven-and-underworld, refs: ["GKAB P338345 r.ii:16", "GKAB P338345 r.ii:47"], note: "elâ Namtar arkat simmilat šamāmī: Namtar went up the long stairway of heaven"}
      - {motif: god-disguised-so-envoy-cannot-find-him, refs: ["GKAB P338345 r.i:34-36", "GKAB P338345 r.ii:41-46"], note: "Ea abūšu mê kuppi sulluhšuma qubbuhu ṣundur pussul: Ea his father sprinkled him with spring water, so he was bald, squinting, lame, sitting in the assembly of all the gods"}
      - {motif: jilted-goddess-weeps-for-departed-lover, refs: ["GKAB P338345 r.ii:5-7", "GKAB P338345 r.ii:21-23"], note: "ultu ṣehrākuma mārtuku ul ide mēlulu ša ardāti ul ide dakāka ša ṣehrāti: since I was little, a daughter, I have not known the play of maidens, nor the romp of little girls"}
      - {motif: queen-demands-lover-or-threatens-dead-rise, refs: ["GKAB P338345 r.ii:8-15", "GKAB P338345 r.ii:24-30"], note: "ilu šâšu ša tašpurānašu urtahhanni lītatil ittiya šuppurānaššuma lū hāmeri libīt ittiya ... musukkākuma ul ebbek ... šumma ilu šâšu lā taltaprāšu ... ušellâma mītūti ikkalū balṭūti eli balṭūti umaʾʾad mītūti: send me that god who lay with me, let him be my husband and spend the night with me; I am unclean, not pure, I cannot judge the great gods ... if you do not send him I will raise the dead to eat the living, the dead will outnumber the living"}
      - {motif: threat-to-raise-dead-to-devour-living, refs: ["GKAB P338345 r.ii:14-15", "GKAB P338345 r.ii:29-30"]}
      - {motif: jilted-goddess-weeps-for-departed-lover, refs: ["GKAB P338345 r.i:1'-7'"], note: "dimātu izannun eli dūr appiša illaka dimāsa Erra hāmer lalêya ul ašbâ lalāšu ittatalkanni: tears rained down her cheeks: Erra, the husband of my delight, I had not had my fill of his charms and he has left me"}
      - {motif: message-repeated-verbatim, refs: ["GKAB P338345 r.ii:20-30"], note: "Namtar repeats Ereškigal's speech word for word before Anu, Enlil and Ea"}
      - {motif: god-disguised-so-envoy-cannot-find-him, refs: ["GKAB P338345 r.ii:32-38", "GKAB P338345 r.ii:52-56"], note: "ištēn ... ēmur ilu šâšu ... šalšu išīramma ul ēmur ilu šâšu: [he looked at] the first ... the third and did not see that god"}
      - {motif: purification-water-sprinkled-on-house, refs: ["GKAB P338345 r.i:44-47"], note: "mê ... sulluh bīta mê elli sulluh bīta: sprinkle the house with water, with pure water (the underworld palace prepared)"}
    hints:
      - "The dead rising: Isa 26:19; Ezek 37; Dan 12:2. 'Many waters cannot quench love': Song 8:6-7 ('love is strong as death, jealousy cruel as Sheol')."
      - "Messengers ascending and descending a ladder between realms: Gen 28:12; John 1:51."
  - id: ane-gkab-p338345-ne-r-iii-nergal-returns
