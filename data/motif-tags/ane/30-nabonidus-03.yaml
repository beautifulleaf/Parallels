      - {motif: monster-split-into-heaven-and-earth, refs: ["GKAB P338323 r:2'-3'", "GKAB P338324 r:15'-19'"], note: "mašku maṣṣara ... lā šuṣâ: he stretched a skin, posted guards, ordered them not to let her waters out; P338324: inūhma bēlu šalamtaš ibarri ... ana šinišu ... uṣṣallil"}
      - {motif: dead-gods-of-tiamat-counted, refs: ["GKAB P338324 r:1'-2'"]}
      - {motif: tablet-of-destinies, refs: ["GKAB P338324 r:1'-2'"]}
      - {motif: god-crushes-head-of-enemies, refs: ["GKAB P338324 r:9'-11'"], note: "ikbusma bēlu ša Tiāmat išissa ina miṭṭišu lā padî ulatti muhha uparriʾma ušlāt dāmiša: the lord trod on Tiāmat's lower part, with his merciless mace he split her skull and cut her veins"}
    hints:
      - "Crushing the heads of the dragon: Ps 74:13-14; 68:22; Gen 3:15. Waters shut in with bars and doors: Job 38:8-11; Jer 5:22; Ps 104:9."
