      - {motif: god-who-raises-and-lowers, refs: ["GKAB P338340 r:2-5", "GKAB P338342 r:3-5"], note: "elēnûte ana šaplûtima aškun ... ušaqqi rēšišunu: the upper ones I set low, the lower I raised high"}
      - {motif: warrior-god-praised-as-incomparable, refs: ["GKAB P338340 r:26-32"], note: "kīma Ninurta zikrašu lā malit ... kī šâšu lā bašî ... ṣiāt ūme lilbir: like Ninurta, whose fame is unbounded, there is none like him ... may it last to distant days"}
    hints:
