      - {motif: monster-taunts-arrow-to-return, refs: ["GKAB P338336 o:17'-19'"]}
      - {motif: tablet-of-destinies, refs: ["GKAB P338336 r:13"]}
      - {motif: hero-sends-report-to-wise-god-for-advice, refs: ["GKAB P338336 r:17-21"], note: "ilqe tērta ... itbala ana Ea Niššiku idbubū ana Ea ušanni: [the messenger] took the instructions to Ea and repeated to Ea"}
      - {motif: seven-winds-storm, refs: ["GKAB P338339 o:5'-7'"], note: "qarrādu uštēṣbita 7 imhullī ... idkû anantu nanduruta tuqumtu: the hero harnessed seven evil winds, roused battle"}
      - {motif: mother-commissions-son-to-fight-monster, refs: ["GKAB P338339 o:2'-4'"], note: "zikra ummišu išmē iqrur irtaub šadussu: he heard his mother's word, writhed, his mountain shook"}
      - {motif: guardian-monster-radiates-terror, refs: ["GKAB P338339 o:8'-11'"], note: "īmuršuma Anzâ irūbaššu ikṣuṣ kīma ūmi melammašu uttaʾar kīma labbi: Anzû saw him and shook with rage, ground his teeth like a storm, his radiance [covered the mountain], he roared like a lion"}
    hints:
