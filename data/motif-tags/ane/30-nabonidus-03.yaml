      - "Humanity made to labour: Gen 2:15; 3:17-19. The bow set in the clouds: Gen 9:13-16. 'On earth as it is in heaven': Matt 6:10."
      - "God who kills and makes alive, wounds and heals: Deut 32:39; 1 Sam 2:6-7. Walking in God's light: Isa 2:5; 60:3; Ps 89:16. God's beautiful names: Q 7:180; 17:110; 59:22-24."
      - "Gods bound by oath and touching the throat as self-curse: compare 2 Kgs 6:31 ('may God do so to me')."
