      - {motif: messenger-kisses-ground-before-lord, refs: ["GKAB P338345 o.i:43'-45'"], note: "īrumma ana palkî kisalliša ikmis iššiq qaqqaru mahriša: he entered her wide courtyard, knelt and kissed the ground before her"}
