      - {motif: mourner-feels-heart-no-longer-beating, refs: ["GKAB P273162 r:12-14"], note: "mīnû šittu iṣbatkama ... u šū lā inašša rēšišu alappat libbašuma: what sleep has seized you? he does not lift his head; I touch his heart ... he covered my friend like a bride"}
      - {motif: mourner-like-lioness-robbed-of-cubs, refs: ["GKAB P273162 r:15"], note: "kīma nēši ša ina šuttati mīrānūša: like a lioness whose cubs are in a pit"}
      - {motif: tearing-garment-and-plucking-hair-beard, refs: ["GKAB P273162 r:16-17"], note: "pērtu inassah inaddâ damqāti asakkiš: he tears out his hair, throws off his finery as taboo"}
      - {motif: statue-of-dead-friend-in-gold-and-lapis, refs: ["GKAB P273162 r:18-21"], note: "smith, metal-worker, goldsmith, stone-carver: epuš ibrī ... ibnâ ṣalam ibrišu ... īnī ša uqnî irtaka ša hurāṣi: make my friend; he made a statue of his friend, eyes of lapis, chest of gold"}
