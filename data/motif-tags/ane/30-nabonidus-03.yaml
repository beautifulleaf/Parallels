      - {motif: gods-build-babylon-and-esagil, refs: ["GKAB P338325 o:14'-31'"], note: "Anunnakū itrukū alla šatta ištēt libittašu iltebnū; šanītu šatta ina kašādi ša Esagil mihret Apsî ullû rēšišu ... ziqqurrat Apsî elīta: the Anunnaki wielded the hoe; one year they moulded its bricks; by the second year they had raised the top of Esagil, replica of the Apsû ... the upper ziggurat"}
      - {motif: dinner-of-gods-at-temple-inauguration, refs: ["GKAB P338325 o:31'-36'"], note: "ilī abbēšu qerītašu uštēšib annâ Bābili šubat narmīkun ... zarbaba iškunū ina qerēti ušbu: he seated his fathers at his banquet: this is Babylon, your beloved dwelling ... they set out the beer vessels and sat at the feast"}
      - {motif: fates-fixed-by-seven-gods, refs: ["GKAB P338325 o:39'-40'"], note: "ilū rabûtu hamšatsunu ... ilū šīmāti sebettišunu ana purussê uktinnū: the fifty great gods sat; the seven gods of destinies were set for decision"}
      - {motif: divine-bow-set-in-sky-as-constellation, refs: ["GKAB P338325 o:41'-46'", "GKAB P338325 r:1-5"], note: "qašta ittišiq šī lū mārtī ... iṣu arik ... šalšu šumšu Qaštu ina šamê ušāpi ukīnma gisgalla: Anu kissed the bow: let it be my daughter; Long-Wood, ..., its third name Bow-star he made appear in heaven and fixed its station"}
      - {motif: gods-swear-oath-in-water-and-oil-touching-throat, refs: ["GKAB P338325 r:8-12"], note: "ana ramānišunu arārra ina mê u šamni itmû ulappitū napšāti iddinūšumma šarrūt ilī: they cursed themselves, swore by water and oil, touched their throats and gave him kingship over the gods"}
      - {motif: fifty-names-of-god, refs: ["GKAB P338325 r:13-47"], note: "inimbima hamšā šumēšu: let us proclaim his fifty names; Marduk, Marutukku, Asalluhi named"}
      - {motif: temple-on-earth-made-like-its-heavenly-image, refs: ["GKAB P338325 r:24"], note: "tamšīl ina šamê ītepušu ina erṣeti lītepuš: what he did in heaven let him do likewise on earth"}
      - {motif: black-headed-people, refs: ["GKAB P338325 r:19", "GKAB P338325 r:25", "GKAB P338325 r:30"], note: "rēʾût ṣalmāt qaqqadi: shepherdship of the black-headed; ṣalmāt qaqqadi divided among gods"}
      - {motif: maker-creates-and-unmakes, refs: ["GKAB P338325 r:42"], note: "bānû abātu napšura enēna: creator, destroyer, releaser (forgiver) and punisher"}
      - {motif: sun-son-of-the-gods-in-whose-light-they-walk, refs: ["GKAB P338325 r:38-39"], note: "lū māru Šamši ša ilī nebû šūma ina nūrišu namri littallakū šunu kayyān: let him be the shining son, the sun of the gods; in his bright light may they walk for ever"}
