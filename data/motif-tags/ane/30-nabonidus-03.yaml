      - {motif: craftsmen-endowed-and-images-refurbished, refs: ["GKAB P338334 o:3'-10'"], note: "Ea šarru ... ṣalmīšunu ša ina nišī abnû ... ana ummânī šunūti libba rapša iddinšunūti uzni išrukšunūtima qātīšunu ullili šukutta šuāša ušanbiṭūma šumsuqat eli ša mahri: Ea the king ... gave those craftsmen a broad heart and wisdom, enriched their hands; they made the adornment shine brighter than before"}
      - {motif: warrior-god-stands-guard-day-and-night, refs: ["GKAB P338334 o:11'"], note: "qurādu Erra mūša u urra lā naparkâ uzuzz pānišu: warrior Erra, stand before him night and day without ceasing"}
      - {motif: families-scattered-in-catastrophe, refs: ["GKAB P338334 r:2'-8'"], note: "ištu āli ana āli ... māru ša abu zārû ... ummu ša mārti ina ṣīhāti ... umāmī nasīkāti ... ālu innammaru: from city to city; the son of the father who begot him ... the mother laughs at the daughter; wild beasts of far lands; the city is seen [deserted]"}
    hints:
      - "Bezalel filled with wisdom and skill by God to make the sanctuary: Exod 31:1-6; 35:30-35."
      - "Family turned against itself in the day of wrath: Mic 7:6; Matt 10:21."
  # ---------------- GKAB: Anzû ----------------
