      - {motif: rivers-from-monsters-eyes, refs: ["GKAB P338328 o:5'-8'"], note: "qaqqadsa ina muhhišu šadâ išpuk ... iptema ina īnīša Purattu Idiglat ... išpuk ina ṣirtiša šadê bērūti: he heaped a mountain on her head, opened the Euphrates and Tigris from her eyes, heaped distant mountains on her breasts"}
      - {motif: monster-split-into-heaven-and-earth, refs: ["GKAB P338328 o:9'-12'"], note: "zibbatsa durmāhiš urakkisma ... Apsû šapal šēpušu hallaša retât šamāmī uṣṣallila erṣeti uktinna: he tied her tail as the great bond, the Apsû under his feet, her thigh fixed the heavens, he roofed and established the earth"}
      - {motif: tablet-of-destinies, refs: ["GKAB P338328 o:17'-18'"], note: "ṭuppi šīmāti ša Qingu īkimu ubillamma ... ana Anu iqtiša: the tablet of destinies he took from Qingu he brought and gave to Anu"}
      - {motif: images-of-defeated-monsters-set-as-reminder, refs: ["GKAB P338328 o:21'-23'"], note: "ibnima ṣalmīšunu ... Apsî ušaṣbit ahrâtaš lā immaša šī lū ittu: he made images of them and set them at the gate of the Apsû: let it be a sign never to be forgotten"}
      - {motif: gods-kiss-feet-of-deity, refs: ["GKAB P338328 o:31'-34'"], note: "pahrūma Igigū kališunu uškennuš Anunnakū mala bašû unaššaqū šēpīšu ... labāniš appi ... annāma šarru: all the Igigi prostrated, the Anunnaki kissed his feet ... 'this is the king'"}
      - {motif: high-god-bows-to-victorious-son, refs: ["GKAB P338328 o:24'-27'"], note: "Lahmu and Lahamu, Anšar embraced him; Anu, Enlil and Ea gave him gifts; Damkina his mother sang with joy"}
      - {motif: gods-build-babylon-and-esagil, refs: ["GKAB P338328 r:13'-22'"], note: "elēna Apsî šubat tarmāni mihrit Ešarra ša abnû ... lupušma bīta lū šubat lalêya ... lubbima šumšu [Bābili] ... nīnu qerbuššu nippuš isinnāti: above the Apsû, opposite Ešarra, I will build a house, my luxurious dwelling ... I shall name it [Babylon]; we will hold festivals in it"}
      - {motif: babylon-house-of-the-great-gods, refs: ["GKAB P338328 r:19'-20'"], note: "inūma ultu Apsî tellâ ... inūma ultu šamāmī turrada ana puhri ... lū nubattakun: when you come up from the Apsû or down from heaven to the assembly, there will be your resting place"}
