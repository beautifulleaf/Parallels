      - {motif: net-from-which-none-escapes, refs: ["GKAB P338321 o:19'-22'"], note: "sapara ... lawû qerbiš Tiāmat ... šārī uštēṣbita lā aṣê mimmiša: he made a net to enclose Tiāmat, set the winds so nothing of her could escape"}
      - {motif: storm-god-arms-for-combat, refs: ["GKAB P338321 o:17'-18'"], note: "berqa ina pānišu ... muštahmiṭa zumuršu umtalli: lightning before him, his body filled with blazing flame"}
      - {motif: seven-winds-storm, refs: ["GKAB P338321 o:23'-26'"], note: "imhullu šāru lemnu mehû ašamšūtu šāru 7-bi imsuhhu ... ušēṣâmma šārī ša ibnû sebettišunu"}
      - {motif: monster-split-into-heaven-and-earth, refs: ["GKAB P338321 r:1'-6'", "GKAB P338321 r:37'-45'"], note: "ihtepa karassu ušalliṭ libba napšatuš uballi ... šalamtaš ibarri ibanna niklāti ... mašṭê ana šinišu ... šamāmī uṣṣallil: he split her belly, slit her heart, extinguished her life ... he looked at her corpse, devised marvels, [split her] in two like a dried fish, roofed the heavens"}
      - {motif: chaos-mother-bears-monster-army, refs: ["GKAB P338321 r:17'-20'"], note: "ištēnšeret nabnītsa šūt pulhāti zaʾinū: her eleven creatures laden with terror, led by nose-ropes, trampled under him"}
      - {motif: dead-gods-of-tiamat-counted, refs: ["GKAB P338321 r:22'-24'"], note: "itti Uggê šuāta imnišu ... ṭuppi šīmāti lā simatišu ... iknukamma irtuš itmuh: he counted him (Qingu) with the dead gods, took the tablet of destinies, not his by right, sealed it and fastened it to his breast"}
      - {motif: tablet-of-destinies, refs: ["GKAB P338321 r:23'-24'"]}
      - {motif: monster-feathers-carried-as-glad-tidings, refs: ["GKAB P338321 r:31'-36'"], note: "Tiāmat's severed veins of blood carried by the north wind as good news (bussurāti) to his fathers, who rejoiced and sent gifts"}
    hints:
      - "God rides the storm, lightning his arrows: Ps 18:8-16; 29; 104:3; Hab 3:8-11. Cutting Rahab in pieces and piercing the dragon: Isa 51:9; Ps 74:13-14; 89:11; Job 26:12-13."
      - "God stretches out the heavens and divides the waters: Gen 1:6-8; Ps 104:2-3. Heaven and earth once joined and then split apart: Q 21:30."
  - id: ane-gkab-ee-4-duplicates
