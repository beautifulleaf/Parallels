      - {motif: anzu-defeated-by-warrior-god, refs: ["GKAB P338340 o:13'", "GKAB P338340 o:24'", "GKAB P338342 o:10'", "GKAB P338342 o:24'"], note: "abūba Ninurta Anzâ ina kašādi ... Anzâ idluhma napšassu ittikis: Ninurta the flood reaching Anzû ... he cut [his throat]"}
