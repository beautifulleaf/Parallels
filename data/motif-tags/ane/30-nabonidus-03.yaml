      - {motif: monster-feathers-carried-as-glad-tidings, refs: ["GKAB P338340 r:6-9", "GKAB P338342 r:6-9"], note: "ištānu ... bussurte Anzî: the north wind carried [his feathers] as the good news of Anzû"}
