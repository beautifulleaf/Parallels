# Full read of the ANE corpus, chunk 34: Amarna letters EA 176 ... EA 070 (in the order of `aneread.py texts 34`).
# Read from ORACC aemw/amarna lemmatized transliterations; ORACC gives lemma glosses only, no translation.
# One unit per letter. Canaanite (West Semitic) glosses are flagged where ORACC lemmatizes a word as a WS root.
new_motifs:
  prostration-on-belly-and-back: {label: "Prostration formula: the vassal falls 'on the belly and on the back' (kabattumma u ṣērumma) before the king", cluster: kingship}
  vassal-groom-of-kings-horses: {label: "A vassal calls himself the groom (kartappu, kuzi) of the king's horses", cluster: kingship}
  who-is-dog-that-would-not-obey-king: {label: "Rhetorical question: 'Who is the dog that would not listen to (or guard) the words of the king?'", cluster: kingship}
  rebel-called-slave-and-dog: {label: "A rival ruler is denounced to the overlord as a mere slave and dog who seizes the king's land", cluster: kingship}
  brick-may-shift-but-vassal-will-not: {label: "A brick may slip from under its neighbour, but the vassal will not move from under the king's feet", cluster: kingship}
  looked-here-and-there-only-king-gives-light: {label: "The vassal looked this way and that and there was no light; he looked to the king and it was bright", cluster: kingship}
  land-like-pledged-copper-pot: {label: "The vassal or his city has become 'like a copper cauldron taken in pledge' at the hands of raiders", cluster: war}
  younger-brother-defects-to-enemy: {label: "The ruler's younger brother turns hostile, enters a town and 'gives his hands' to the enemy", cluster: war}
  kings-word-gladdens-vassal: {label: "On hearing the king's word or 'sweet breath' the vassal rejoices and his heart is at rest", cluster: kingship}
  ant-struck-bites-back: {label: "Proverb: an ant that is struck does not curl up but bites the hand of the man who strikes it", cluster: wisdom}
  vassal-slandered-before-overlord: {label: "A vassal complains that he has been slandered (maligned) before the king", cluster: kingship}
  myrrh-for-healing-requested: {label: "A ruler asks the overlord to send myrrh for healing", cluster: healing}
  ruler-asks-overlord-for-physician: {label: "A ruler asks the overlord to send a physician, 'for there is no physician here'", cluster: healing}
  city-consumed-by-pestilence: {label: "A ruler fears his city will be finished off by pestilence (mūtānu, Canaanite dabru)", cluster: war}
  captured-rebel-released-for-ransom: {label: "A captured rebel, who was to be sent to the overlord, is released by his captor for a ransom in silver", cluster: war}
  humbled-while-younger-brothers-honoured: {label: "The speaker complains he is made light (qll) while his younger brothers are made heavy, honoured (kbd)", cluster: kingship}
  servants-await-word-from-lords-mouth: {label: "As one waits for the sun to come forth from heaven, so servants wait for the words that go out of their lord's mouth", cluster: kingship}
  vassal-throne-and-footstool-of-king: {label: "A vassal calls himself the ground the king treads, the throne he sits on and the footstool of his feet", cluster: kingship}
  city-gods-never-left-city: {label: "From eternity the gods have never gone out of the city; now the enemy sends troops to seize it and its gods", cluster: cult}
  gods-seat-king-on-fathers-throne: {label: "The gods (the Sun, the city goddess) have given the king the throne of his father's house", cluster: kingship}
  upstarts-act-like-great-kings: {label: "Rebel upstarts behave as if they were the great kings (of Mitanni, Babylon, Hatti) and take the king's land", cluster: kingship}
  vassal-carries-kings-yoke-on-neck: {label: "The vassal has set the king's yoke on his neck and carries it", cluster: kingship}
  vassal-raised-at-egyptian-court: {label: "As a youth the vassal was brought into Egypt, served the king and stood at the king's gate", cluster: kingship}
  vassal-guards-day-and-night: {label: "The vassal guards the king's city, place or word day and night", cluster: kingship}
  ruler-attacked-with-dagger: {label: "A man stands over the ruler with a bronze dagger and strikes him", cluster: war}
  vassal-threatens-to-abandon-city: {label: "Unless archers come within a set time, the ruler will abandon his city", cluster: war}
  townsmen-kill-their-ruler: {label: "The men of a city kill their own lord (ruler)", cluster: war}
  land-of-canaan-named: {label: "The land of Canaan (Kinaḫna) is named as a land", cluster: geography}
  island-city-begs-for-water-and-wood: {label: "The island city's ruler begs the overlord for a mainland town to supply drinking water, wood, straw and clay", cluster: kingship}
  vassal-longs-to-see-kings-face: {label: "The vassal asks to enter and see the face of the king", cluster: kingship}
  overlord-gives-face-to-servant: {label: "Plea that the king 'give his face' (turn his favour) to his servant", cluster: kingship}
  caravan-plundered-on-road: {label: "Merchants or caravans are robbed on the road, and the ruler cannot send his caravans", cluster: war}
  ruler-accused-of-hiding-fugitive: {label: "A ruler denies having hidden a fugitive king and names witnesses to be asked", cluster: kingship}
  towns-of-region-captured-list: {label: "A list of named towns of a region taken by the enemy", cluster: war}
  official-extorts-silver-threatens-family: {label: "An official demands silver from a ruler: 'give your wife and your sons, or I will strike'", cluster: war}
  vassal-asks-to-be-fetched-to-court: {label: "The vassal begs the king to send chariots and fetch him to the king, lest he perish", cluster: kingship}
  sons-continue-fathers-rebellion: {label: "After the rebel father's fall his sons carry on his hostility and seek to destroy the land", cluster: war}
  new-rebel-like-the-dead-one: {label: "A dead rebel is succeeded by 'another' like him who takes the cities", cluster: war}
  siege-prevents-harvest-and-going-out: {label: "Because of the enemy the people cannot harvest or go out of the city gate", cluster: war}
  vassal-begs-save-me-from-enemy-hand: {label: "Plea to the overlord: 'Save me from the hand of my mighty enemies'", cluster: war}
  none-to-rescue-from-their-hand: {label: "Lament: there is no man to rescue the speaker from the enemies' hand", cluster: war}
  overlord-addressed-as-storm-god: {label: "A vassal addresses the Egyptian king as 'my storm god (Addu)'", cluster: kingship}
  client-calls-official-father-my-house-your-house: {label: "A client calls the official 'my father and lord', himself 'your son', and says 'my lands are your lands, my house is your house'", cluster: kingship}
  gods-look-favourably-on-vassal: {label: "The vassal says the gods have looked upon him (with favour) since the king's word came", cluster: kingship}
  vassal-sends-raw-glass-tribute: {label: "A vassal sends raw glass (eḫlipakku, mekku) to the king at his request", cluster: kingship}
  god-of-my-father-invoked: {label: "A speaker invokes 'the god of my father'", cluster: cult}
  canaanite-gloss-in-akkadian-letter: {label: "An Akkadian letter uses or glosses a word with its Canaanite (West Semitic) equivalent", cluster: scribal}
units:
  - id: ane-ea-176-amqu-cities-burned
    tradition: ane-akkadian
    title: "EA 176: a ruler in Amqu reports Etakkama and Hittite troops burning the king's cities"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    read: ["EA 176"]
    tags:
      - {motif: overlord-addressed-as-my-god-my-sun, refs: ["EA 176 o:1", "EA 176 r:18"], note: "ana šarri bēliya ilīya šamšīya"}
      - {motif: vassal-dust-under-kings-feet, refs: ["EA 176 o:4-5"], note: "ana šupāli upri šēpī šarri: 'beneath the dust of the feet of the king'"}
      - {motif: sevenfold-prostration, refs: ["EA 176 o:6"], note: "7 u 7 amqut"}
      - {motif: hittite-troops-burn-vassal-cities, refs: ["EA 176 o:9-13"], note: "Etakkama of Qidšu (Qadesh) went before the troops of Hatti and set the king's cities on fire (ana išāti)"}
      - {motif: vassal-pleads-for-archers, refs: ["EA 176 r:15-17"], note: "let the king give archer troops (ṣāb piṭṭāti) and we will (re)make the cities"}
    hints:
      - "Compare cities set on fire in conquest, Josh 11:11-13 and Judg 1:8; Qadesh on the Orontes, 2 Sam 24:6 (LXX)."
  - id: ane-ea-227-hazor-king-rejoices
    tradition: ane-akkadian
    title: "EA 227: the king of Hazor guards the cities and rejoices at the king's word"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    read: ["EA 227"]
    tags:
      - {motif: overlord-orders-vassal-to-guard-and-provision, refs: ["EA 227 o:5-7"], note: "anāku naṣrāti ālāni šarri ... adi kašādi bēliya: guarding the king's cities until the lord arrives"}
      - {motif: kings-word-gladdens-vassal, refs: ["EA 227 o:8-11", "EA 227 o:17-18"], note: "on hearing these words and that the Sun's life went out to him, he rejoiced (aḫdi), his joy (illatiya) went forth; the heart rejoiced greatly"}
      - {motif: gods-look-favourably-on-vassal, refs: ["EA 227 o:12-13"], note: "u ilānu ippalsū ana yâšim"}
      - {motif: overlord-addressed-as-my-god-my-sun, refs: ["EA 227 o:9"], note: "balāṭ Šamaš bēliya: the 'life of the Sun, my lord'"}
    hints:
      - "Compare the king of Hazor as head of the northern coalition, Josh 11:1-10; Jabin king of Hazor, Judg 4:2."
      - "Rejoicing at a king's word: Prov 16:15 (light of the king's face is life)."
  - id: ane-ea-228-abdi-tirshi-hazor
    tradition: ane-akkadian
    title: "EA 228: Abdi-Tirši of Hazor, loyal servant, asks the king to remember Hazor"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    read: ["EA 228"]
    tags:
      - {motif: sevenfold-prostration, refs: ["EA 228 o:5-9"]}
      - {motif: overlord-orders-vassal-to-guard-and-provision, refs: ["EA 228 o:13-17"], note: "inaṣṣarum Ḫaṣura qadu ālānīši ana šarri: guarding Hazor with its towns for the king"}
      - {motif: canaanite-gloss-in-akkadian-letter, refs: ["EA 228 b.e:19"], note: "yazkur-mi (WS ḏkr 'remember') beside lihšuš: 'may the king take note, may he remember what is done against Hazor'"}
    hints:
      - "Compare the plea 'remember' addressed to God, Neh 5:19, 13:14; Ps 132:1; Hazor in Josh 11:10."
  - id: ane-ea-299-yapahu-gezer-habiru
    tradition: ane-akkadian
    title: "EA 299: Yapaḫu of Gezer, the Sun from heaven, and the strong Habiru"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    read: ["EA 299"]
    tags:
      - {motif: overlord-addressed-as-my-god-my-sun, refs: ["EA 299 o:1-3", "EA 299 o:8-9", "EA 299 o:16"], note: "ilānīya šamšīya šamšu ša ištu šamê: 'my gods, my Sun, the Sun from heaven'"}
      - {motif: vassal-dust-under-kings-feet, refs: ["EA 299 o:5"]}
      - {motif: vassal-groom-of-kings-horses, refs: ["EA 299 o:6"], note: "kuzi sisêka (Canaanite/Hurrian word for groom)"}
      - {motif: sevenfold-prostration, refs: ["EA 299 o:9-10"]}
      - {motif: prostration-on-belly-and-back, refs: ["EA 299 o:11"]}
      - {motif: habiru-sa-gaz, refs: ["EA 299 o:18-r:26"], note: "dannū SA.GAZ.MEŠ elīnu: 'the Habiru are strong against us'; 'lead me out from the hand of the Habiru, lest they finish us off'"}
      - {motif: vassal-begs-save-me-from-enemy-hand, refs: ["EA 299 b.e:20-r:25"]}
    hints:
      - "Compare Gezer in Josh 10:33, 16:10 and 1 Kgs 9:16; the 'Hebrews' (ʿivrim) as an outsider class, 1 Sam 13:3-7 and 14:21."
      - "Compare 'deliver me from the hand of my enemies', Ps 31:16 and Ps 144:7."
  - id: ane-ea-298-yapahu-brother-defects
    tradition: ane-akkadian
    title: "EA 298: Yapaḫu's younger brother goes over to the Habiru at Muḫḫazu"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    read: ["EA 298"]
    tags:
      - {motif: overlord-addressed-as-my-god-my-sun, refs: ["EA 298 o:1-3", "EA 298 o:10"]}
      - {motif: vassal-dust-under-kings-feet, refs: ["EA 298 o:6-7", "EA 298 r:19"]}
      - {motif: vassal-groom-of-kings-horses, refs: ["EA 298 o:7-8"], note: "kartappi ša sisêka"}
      - {motif: sevenfold-prostration, refs: ["EA 298 o:11-12"], note: "7-šu u 7-ta-a-an lū ištaḫaḫin"}
      - {motif: prostration-on-belly-and-back, refs: ["EA 298 o:13-14"]}
      - {motif: younger-brother-defects-to-enemy, refs: ["EA 298 r:22-27"], note: "aḫiya ṣeḫru nakar ištu yâši ... irub ana Muḫḫazi u nadan 2 qātīšu ana SA.GAZ: 'my younger brother has become hostile to me, entered Muḫḫazu and given his two hands to the Habiru'"}
      - {motif: habiru-sa-gaz, refs: ["EA 298 r:27"]}
    hints:
      - "Compare the fratricidal Abimelech who hires 'empty men', Judg 9:1-5, and Absalom's revolt, 2 Sam 15."
  - id: ane-ea-297-yapahu-copper-pot
    tradition: ane-akkadian
    title: "EA 297: Yapaḫu, 'like a copper pot in pledge' to the Suteans, revived by the king's sweet breath"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    read: ["EA 297"]
    tags:
      - {motif: overlord-addressed-as-my-god-my-sun, refs: ["EA 297 o:1-2"]}
      - {motif: vassal-dust-under-kings-feet, refs: ["EA 297 o:4"]}
      - {motif: sevenfold-prostration, refs: ["EA 297 o:6-7"]}
      - {motif: land-like-pledged-copper-pot, refs: ["EA 297 o:11-r:16"], note: "inneppšāti kīma ruqqi URUDU sīri ḫubulli ištu qāt Sutê: 'I have become like a copper cauldron in pledge from the hand of the Suteans'"}
      - {motif: kings-word-gladdens-vassal, refs: ["EA 297 r:17-21"], note: "ištemē šāri ša šarri ṭābta ... pašiḫ libbiya magal: 'I heard the sweet breath of the king and my heart is much at rest'"}
    hints:
      - "Compare the king's favour as breath and life, Lam 4:20 ('the breath of our nostrils') and Prov 16:15."
  - id: ane-ea-325-yidya-provisions
    tradition: ane-akkadian
    title: "EA 325: Yidya of Ashkelon prepares bread, beer, oxen, goats, grain and straw"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    read: ["EA 325"]
    tags:
      - {motif: overlord-addressed-as-my-god-my-sun, refs: ["EA 325 o:1-2", "EA 325 o:14", "EA 325 r:22"]}
      - {motif: vassal-dust-under-kings-feet, refs: ["EA 325 o:4"]}
      - {motif: vassal-groom-of-kings-horses, refs: ["EA 325 o:5"]}
      - {motif: sevenfold-prostration, refs: ["EA 325 o:6-8"]}
      - {motif: prostration-on-belly-and-back, refs: ["EA 325 o:9"]}
      - {motif: who-is-dog-that-would-not-obey-king, refs: ["EA 325 o:12-14"], note: "mīyami kalbu u lā yištemu awāt šarri: 'who is the dog that would not hear the words of the king?'"}
      - {motif: overlord-orders-vassal-to-guard-and-provision, refs: ["EA 325 o:10-11", "EA 325 o:15-b.e:19"], note: "bread, beer, oxen, goats, barley, straw, everything the king said, is prepared"}
    hints:
      - "Compare provisions brought to a king's host, 2 Sam 17:27-29 and 1 Kgs 4:27-28."
      - "Compare 'what is your servant, a dog?', 2 Kgs 8:13 and 2 Sam 9:8."
  - id: ane-ea-323-yidya-glass
    tradition: ane-akkadian
    title: "EA 323: Yidya sends thirty pieces of glass to the son of the Sun whom the Sun loves"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    read: ["EA 323"]
    tags:
      - {motif: sevenfold-prostration, refs: ["EA 323 o:6-8"]}
      - {motif: prostration-on-belly-and-back, refs: ["EA 323 o:8-9"]}
      - {motif: vassal-sends-raw-glass-tribute, refs: ["EA 323 o:13-16"], note: "30 eḫlipakku"}
      - {motif: who-is-dog-that-would-not-obey-king, refs: ["EA 323 r:17-21"]}
      - {motif: king-son-of-sun-god, refs: ["EA 323 r:22-23"], note: "mār Šamaš ša tirām Šamaš: 'son of the Sun whom the Sun loves' (rendering a pharaonic epithet)"}
    hints:
      - "Compare the king as God's son, Ps 2:7 and 2 Sam 7:14; 'beloved of God', 2 Sam 12:25 (Jedidiah)."
  - id: ane-ea-324-yidya-provisions-troops
    tradition: ane-akkadian
    title: "EA 324: Yidya has bread, beer, oil, grain and cattle ready for the king's troops"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    read: ["EA 324"]
    tags:
      - {motif: overlord-addressed-as-my-god-my-sun, refs: ["EA 324 o:1-3"]}
      - {motif: sevenfold-prostration, refs: ["EA 324 o:7-8"]}
      - {motif: prostration-on-belly-and-back, refs: ["EA 324 o:9"]}
      - {motif: overlord-orders-vassal-to-guard-and-provision, refs: ["EA 324 o:10-15"]}
      - {motif: who-is-dog-that-would-not-obey-king, refs: ["EA 324 o:16-r:18"]}
      - {motif: king-son-of-sun-god, refs: ["EA 324 o:11", "EA 324 r:19"]}
  - id: ane-ea-316-pu-baal-postscript
    tradition: ane-akkadian
    title: "EA 316: Pu-Baʿlu of Yurza, with a postscript to the Egyptian scribe"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    read: ["EA 316"]
    tags:
      - {motif: vassal-dust-under-kings-feet, refs: ["EA 316 o:4"]}
      - {motif: vassal-groom-of-kings-horses, refs: ["EA 316 o:5"]}
      - {motif: sevenfold-prostration, refs: ["EA 316 o:8"]}
      - {motif: who-is-dog-that-would-not-obey-king, refs: ["EA 316 o:11-13"], note: "mīyami kalbu ša yimtaku egerrê šarri: 'who is the dog that would neglect the king's word?'"}
      - {motif: caravan-plundered-on-road, refs: ["EA 316 r:18-25"], note: "postscript to the Egyptian scribe (šaḫšiḫašiḫa = Eg. 'letter writer'): nothing in my house; I did not send a caravan; now a good caravan is prepared for you"}
    hints:
      - "Compare the scribe (sofer) as royal official, 2 Sam 8:17; letters with greetings to officials, Ezra 4:8-11."
  - id: ane-ea-315-pu-baal-strong-like-sun
    tradition: ane-akkadian
    title: "EA 315: Pu-Baʿlu guards day and night the word of the king, strong like the Sun in heaven"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    read: ["EA 315"]
    tags:
      - {motif: sevenfold-prostration, refs: ["EA 315 o:5-7"]}
      - {motif: prostration-on-belly-and-back, refs: ["EA 315 o:7"]}
      - {motif: vassal-guards-day-and-night, refs: ["EA 315 o:11-12"], note: "inaṣṣaru ūma u mūša awāt šarri"}
      - {motif: overlord-addressed-as-my-god-my-sun, refs: ["EA 315 o:9", "EA 315 o:14-15"], note: "the commissioner Reʿanapa is 'strong like the Sun in heaven' (dannu kīma Šamaš ina šamê)"}
      - {motif: who-is-dog-that-would-not-obey-king, refs: ["EA 315 o:16-18"], note: "who is the dog that would not guard (lā yinaṣṣaru) the words of the king"}
    hints:
      - "Compare 'those who love him are like the sun rising in its might', Judg 5:31; keeping a lord's word day and night, Josh 1:8 and Ps 1:2."
  - id: ane-ea-296-yahtiru-brick-and-yoke
    tradition: ane-akkadian
    title: "EA 296: Yaḫtiru, raised in Egypt, will not move from under the king's feet; he carries the king's yoke"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    read: ["EA 296"]
    tags:
      - {motif: overlord-addressed-as-my-god-my-sun, refs: ["EA 296 o:2", "EA 296 o:7"]}
      - {motif: sevenfold-prostration, refs: ["EA 296 o:7-8"]}
      - {motif: looked-here-and-there-only-king-gives-light, refs: ["EA 296 o:11-16"], note: "daglāti kīam u daglāti kīam u lā namir u daglāti ana muḫḫi šarri u namir"}
      - {motif: brick-may-shift-but-vassal-will-not, refs: ["EA 296 o:17-r:22"], note: "tinamušu libittu ištu šupal tappātiši u anāku lā inamušu ištu šupal šēpē šarri"}
      - {motif: vassal-raised-at-egyptian-court, refs: ["EA 296 r:25-29"], note: "inūma ṣeḫru anāku šūribanni ana māt Miṣri u urraddi šarra ... izzizti ina abulli šarri"}
      - {motif: vassal-pleads-for-archers, refs: ["EA 296 r:31-35"], note: "he guards the gates of Gaza and Joppa and goes with the king's archers wherever they go"}
      - {motif: vassal-carries-kings-yoke-on-neck, refs: ["EA 296 t.e:37-l.e:39"], note: "šaknāti pān nīri (Canaanite ḫullu 'yoke') šarri ana kišādiya u ubbalušu"}
    hints:
      - "Compare 'I lift my eyes to the hills... my help comes from YHWH', Ps 121:1-2, and Ps 123:1-2."
      - "Compare a foreign youth raised at Pharaoh's court, Exod 2:10 and 1 Kgs 11:19-20; standing at the king's gate, Esth 2:19-21."
      - "Compare bringing one's neck under the king's yoke, Jer 27:11-12 and 1 Kgs 12:4; Gaza and Joppa, Josh 15:47 and 19:46."
  - id: ane-ea-248-yashdata-taanach
    tradition: ane-akkadian
    title: "EA 248: Yašdata driven out by the men of Taanach"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    read: ["EA 248"]
    tags:
      - {motif: sevenfold-prostration, refs: ["EA 248 o:6-8"]}
      - {motif: vassal-dust-under-kings-feet, refs: ["EA 248 o:5"]}
      - {motif: overlord-addressed-as-my-god-my-sun, refs: ["EA 248 o:2", "EA 248 o:7"]}
      - {motif: caravan-plundered-on-road, refs: ["EA 248 b.e:13-r:17"], note: "the men of Taanach (Taʿannaku) killed (naksū) my oxen and drove me away; he is now with Biridiya"}
    hints:
      - "Compare Taanach by the waters of Megiddo, Judg 5:19; Josh 12:21 and 17:11."
  - id: ane-ea-215-bayawa-habiru
    tradition: ane-akkadian
    title: "EA 215: Bayawa warns that without Yanḫamu all lands are lost to the Habiru"
