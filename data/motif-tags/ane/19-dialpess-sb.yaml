# Full read of the ANE corpus, chunk 19: Dialogue of Pessimism, Enuma elish, Elevation of Babylon,
# Erra I, Etana (MA, OB, SB). Read from the eBL reconstructed Akkadian texts with eBL's translations as aids.
new_motifs:
  master-servant-dialogue-every-plan-refuted: {label: "A master announces one plan after another and his servant eagerly argues for each, then just as eagerly against it when the master changes his mind", cluster: wisdom}
  eating-well-makes-man-his-own-god: {label: "Saying: the man who eats well is his own god; the god goes with the one whose hands are washed", cluster: wisdom}
  wanderer-fed-and-wanderer-ruined: {label: "The roaming man, dog, bird and wild ass are first praised as well fed, then pitied as homeless and broken", cluster: wisdom}
  houseless-man-a-fool-and-beggar: {label: "The man without a house is a fawner and two-thirds a fool who must beg and face his creditor", cluster: wisdom}
  crime-punished-by-death-flaying-blinding-prison: {label: "The criminal is executed, flayed, blinded, arrested or jailed", cluster: law}
  love-makes-man-forget-sorrow: {label: "The man who loves a woman forgets sorrow and care", cluster: wisdom}
  woman-as-pit-and-dagger: {label: "A woman is called a pitfall, a hole, a ditch and a sharp iron dagger that cuts a man's throat", cluster: wisdom}
  sacrifice-trains-god-like-dog: {label: "Regular sacrifice trains one's god to follow like a dog, always demanding more rites and figurines", cluster: cult}
  sacrifice-as-loan-to-god: {label: "Sacrifice to one's god is a sound transaction, 'loan upon loan' credited by the god", cluster: cult}
  lending-sweet-as-love-recovery-painful-as-birth: {label: "Lending is as sweet as falling in love, getting the loan back as painful as giving birth", cluster: wisdom}
  good-deed-stored-with-god: {label: "A good deed done for one's land is laid up in the god's basket (credited by the god)", cluster: wisdom}
  skulls-on-ruins-good-and-evil-indistinguishable: {label: "Walk over the ancient ruin mounds and look at the skulls of low and great: who was the evildoer, who the benefactor?", cluster: wisdom}
  death-is-the-only-good: {label: "Asked what then is good, the answer is death: to have one's neck broken and be thrown into the river", cluster: wisdom}
  master-will-not-outlive-servant: {label: "The master threatens to kill his servant; the servant retorts that the master will not outlive him by three days", cluster: wisdom}
  primeval-sweet-and-salt-waters-mingle: {label: "Before anything was named, the primeval fresh-water (Apsu) and salt sea (Tiamat) mingle their waters as the parents of all", cluster: creation}
  existence-as-being-named: {label: "Things do not yet exist because they have not yet been named; coming into being is being called by name", cluster: creation}
  successive-generations-of-gods: {label: "Pairs of gods are born generation after generation, each surpassing its parents (theogony)", cluster: creation}
  young-gods-noise-robs-elder-of-sleep: {label: "The clamor of the younger gods robs the primeval parent of rest by day and sleep by night, and he plots to destroy them", cluster: creation}
  wise-god-spellbinds-and-kills-primeval-father: {label: "The wise god puts the primeval father to sleep with a spell, strips his crown and radiance and kills him", cluster: combat}
  victor-builds-dwelling-on-slain-foe: {label: "The victorious god founds his dwelling on top of the slain enemy (the Apsu)", cluster: combat}
  marvellous-birth-of-divine-hero: {label: "The hero god is born in a holy chamber, suckled by goddesses, a hero from birth, surpassing all in form", cluster: combat}
  god-with-fourfold-eyes-and-ears: {label: "The god has four eyes and four ears, sees in every direction, and fire breaks out when his lips move", cluster: combat}
  chaos-mother-bears-monster-army: {label: "The primeval sea-mother gives birth to an army of eleven monsters (serpents, dragons, lion-men, scorpion-men, fish-men, bull-men) with venom for blood", cluster: combat}
  elder-gods-fail-before-chaos-monster: {label: "Older gods sent one after another against the chaos monster turn back in fear, and the assembly sits silent", cluster: combat}
  woman-force-cannot-match-mans: {label: "Saying: a woman's strength may be great but cannot match a man's", cluster: wisdom}
  champion-demands-supremacy-as-price: {label: "The young champion will fight only if the divine assembly makes his decree supreme and unalterable", cluster: kingship}
  gods-feast-drunk-then-decree-destiny: {label: "The gods feast, drink beer until carefree, and then decree the champion's destiny", cluster: kingship}
  word-test-destroy-and-recreate: {label: "To prove the power of his word the god by command destroys a thing and by command makes it whole again", cluster: kingship}
  gods-acclaim-x-is-king: {label: "The assembled gods acclaim the victorious god: 'X is king!' and give him sceptre, throne and staff", cluster: kingship}
  storm-god-arms-for-combat: {label: "The divine warrior arms himself with bow, mace, lightning, a net and the winds, clothed in terror", cluster: combat}
  god-rides-storm-chariot: {label: "The god mounts the storm as his chariot, drawn by a named team of terrible steeds", cluster: combat}
  flood-as-gods-great-weapon: {label: "The deluge (abubu) is the warrior god's great weapon", cluster: combat}
  winds-driven-into-monsters-mouth: {label: "When the monster opens her mouth to swallow him, the god drives the winds into it and bloats her, then shoots her through the heart", cluster: combat}
  god-stands-on-slain-monster: {label: "The god throws down the monster's carcass, stands on it and crushes her skull", cluster: combat}
  monster-split-into-heaven-and-earth: {label: "The god splits the slain sea-monster in two like a fish for drying: one half becomes the sky, the other the earth", cluster: creation}
  guards-hold-back-upper-waters: {label: "Guards are posted on the sky-hide so that the monster's (upper) waters do not escape", cluster: cosmology}
  earthly-temple-counterpart-of-cosmic: {label: "A temple is built as the counterpart (mehret, tamšīl) of a cosmic dwelling (Apsu, heaven, Esharra)", cluster: cult}
  moon-phases-prescribed-by-creator: {label: "The creator instructs the moon how to wax, be half on the seventh day, full at mid-month and vanish at month's end", cluster: cosmology}
  rivers-from-monsters-eyes: {label: "Tigris and Euphrates flow out from the eyes of the slain monster; mountains are heaped on her head and breasts", cluster: creation}
  images-of-defeated-as-reminder: {label: "Images of the defeated monsters are set up at the gate as a sign 'lest they be forgotten'", cluster: combat}
  victor-washes-anoints-robes-enthroned: {label: "Still covered with the dust of battle, the victor is anointed, robed and enthroned with mace and crown", cluster: kingship}
  babylon-house-of-the-great-gods: {label: "Babylon is named 'House (Gate) of the great gods', the stopping place of the gods on earth", cluster: cult}
  humans-from-slain-gods-blood: {label: "Humankind is made from the blood of a slain rebel god", cluster: creation}
  guilty-god-handed-over-for-execution: {label: "The assembly is asked who started the rebellion; the guilty god is handed over, bound and executed", cluster: combat}
  gods-build-temple-for-supreme-god: {label: "The gods themselves mould bricks for a year and build the supreme god's temple and ziggurat as thanks for release from toil", cluster: cult}
  gods-allotted-heaven-and-netherworld: {label: "The supreme god divides the gods into upper and lower, posting 300 in heaven and 300 below", cluster: cosmology}
  warrior-bow-set-in-sky: {label: "The warrior god's bow is laid before the gods, kissed, named, and set in heaven as the 'Bow Star'", cluster: cosmology}
  oath-with-water-oil-touching-throat: {label: "The gods swear allegiance with water and oil, touching their throats and invoking a curse on themselves", cluster: treaty}
  on-earth-as-in-heaven: {label: "The god shall do on earth the same as what he did in heaven", cluster: kingship}
  whatever-name-he-is-our-god: {label: "Though peoples are divided as to their gods, whatever name is invoked, he (the one god) is our god", cluster: theology}
  god-who-revives-the-dead: {label: "The god is 'reviver of the dead' (muballiṭ mīti) who restores the moribund by his spell", cluster: theology}
  god-herds-gods-like-sheep: {label: "The supreme god herds all the gods like sheep", cluster: kingship}
  sacred-text-taught-father-to-son: {label: "The sacred names are to be pondered by the wise, repeated by father to son, and heeded by the shepherd-ruler", cluster: wisdom}
  god-before-whom-sin-is-judged: {label: "Crime and sin must appear before the god for judgment; his word is truth and his command unalterable", cluster: theology}
  heaven-and-earth-bless-god: {label: "Divine couples and heaven and earth in turn bless the supreme god (litany)", cluster: theology}
  god-absolves-sin-reconciles-personal-god: {label: "The god absolves sin and reconciles the sufferer with his angry personal god", cluster: theology}
  god-gives-sustenance-to-all-creatures: {label: "All living things await their portion from the god, who gives sustenance to every creature", cluster: theology}
  elements-water-fire-air-mixed: {label: "The god's waters are mixed with fire and air (elements of the cosmos)", cluster: cosmology}
  babylon-identified-with-eridu: {label: "Babylon is identified with Eridu, the primeval sacred city of Ea, gate of the Apsu", cluster: cult}
  holy-city-like-sea-and-garden: {label: "The holy city is praised as a sea bringing in its yield, a fruit garden, a rolling wave of bounty", cluster: cult}
  holy-city-gemstones-catalogue: {label: "The holy city is a carnelian bolt, a treasure chest of obsidian, lapis, agate and jasper", cluster: cult}
  citizens-of-holy-city-privileged-freedom: {label: "The consecrated citizens of the holy city enjoy a freedom (exemption) that each king must establish", cluster: kingship}
  seven-destroyer-gods-born-of-sky-and-earth: {label: "The sky god begets on Earth seven warrior gods (the Seven) and gives each a destructive commission", cluster: combat}
  idle-warrior-god-urged-to-war: {label: "A warrior god lies idle in bed with his wife and is goaded by his weapons and companions to go out to war", cluster: combat}
  field-life-better-than-city-life: {label: "The open field is praised over city life: city bread cannot compare with a cake baked in embers, the palace with a shepherd's hut", cluster: wisdom}
  weapons-rust-from-disuse: {label: "Neglected weapons: cobwebs on the war gear, the bow too stiff, the arrowhead dull, the sword rusted for lack of slaughter", cluster: combat}
  god-self-praise-i-am-litany: {label: "A god praises himself in a litany: in heaven I am a wild bull, on earth a lion, among the gods a fury", cluster: theology}
  god-leaves-throne-cosmos-disordered: {label: "When the supreme god rises from his throne the seams of heaven and earth come apart: a flood follows, stars leave their places", cluster: flood}
  cult-image-tarnished-and-renewed: {label: "The god's image is tarnished and must be cleansed by the fire god before the god returns to his seat", cluster: cult}
  antediluvian-sages-sent-down-to-apsu: {label: "After the flood the seven sages (apkallu) and master craftsmen were sent down to the Apsu and never brought up again", cluster: flood}
  substitute-ruler-while-god-absent: {label: "While the supreme god is away a rival god takes over the government of heaven and earth", cluster: kingship}
  eagle-serpent-friendship-oath: {label: "An eagle and a serpent swear friendship by the sun god, with curses on whoever transgresses", cluster: fable}
  eagle-devours-serpents-young: {label: "When its own young are grown, the eagle betrays the oath and eats the serpent's young", cluster: fable}
  wise-youngest-warns-father: {label: "The littlest, wisest fledgling warns its father not to break the oath; the father does not listen", cluster: fable}
  ambush-inside-carcass: {label: "On the sun god's advice, the wronged serpent hides inside the carcass of a wild ox to catch the greedy eagle", cluster: fable}
  wings-clipped-cast-into-pit: {label: "The traitor's wings are cut, he is plucked and thrown into a pit to die of hunger and thirst", cluster: fable}
  childless-king-prays-for-heir: {label: "A childless king beseeches the god daily for an heir, citing his sacrifices and piety", cluster: patriarchs}
  plant-of-birth: {label: "A plant of birth (šammu ša alādi) can grant a son to the childless", cluster: patriarchs}
  childlessness-a-disgrace-removed: {label: "Prayer to remove the disgrace (piltu) of childlessness by giving an heir (šumu, a 'name')", cluster: patriarchs}
  rescued-animal-becomes-helper: {label: "A man rescues an animal from a pit and it swears friendship and offers whatever he asks", cluster: fable}
  ascent-on-eagle-earth-shrinks: {label: "Carried up on the eagle, the rider sees the land shrink to a garden plot and the sea to a ditch, then vanish", cluster: ascent}
  rider-falls-from-heavenly-flight: {label: "Losing heart on the way to heaven, the rider asks to be set down and plunges toward the earth", cluster: ascent}
  dream-goddess-enthroned-with-lions: {label: "In a dream the visitor opens a sealed house in heaven and finds the goddess enthroned with lions beneath her throne", cluster: ascent}
  passing-gates-of-gods-in-heaven: {label: "The heaven-traveller passes through the gates of Anu, Enlil and Ea, then of Sin, Shamash, Adad and Ishtar, prostrating at each", cluster: ascent}
  goddess-searches-for-king: {label: "A goddess comes down to search the land for a shepherd and king", cluster: kingship}
  gods-plan-first-city: {label: "The gods plan the first city, lay its foundations and build its brickwork", cluster: civilization}
units:
  # ---------------- Dialogue of Pessimism ----------------
  - id: ane-dialpess-sb-palace-dine-hunt-house
    tradition: ane-akkadian
    title: "Master and servant: palace, dining, hunting, house-building (Dialogue of Pessimism 1-38)"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    version: Standard Babylonian
    read: ["DialPess SB –:1-38"]
    tags:
      - {motif: master-servant-dialogue-every-plan-refuted, refs: ["DialPess SB –:1-9", "DialPess SB –:10-16"], note: "refrain arad mitanguranni / annû bēlī annû 'Servant, obey me! Yes, master, yes'; each plan answered first with lā tamaššar/putun, then reversed"}
      - {motif: eating-well-makes-man-his-own-god, refs: ["DialPess SB –:12-13"], note: "šēbi patni ilšu ... itti qātī mesâti illak šamaš"}
      - {motif: unwashed-hands-to-mouth-disgusting, refs: ["DialPess SB –:11", "DialPess SB –:13"], note: "washing hands before eating; Shamash goes with washed hands"}
      - {motif: wanderer-fed-and-wanderer-ruined, refs: ["DialPess SB –:19-22", "DialPess SB –:25-28"], note: "same four creatures (muttapraššidu man, kalbu dayyālu, hahhūru, akkannu) first praised, then pitied"}
      - {motif: houseless-man-a-fool-and-beggar, refs: ["DialPess SB –:30-36"], note: "qayyalu šinipât lilli 'a fawner, two-thirds a fool'; text fragmentary"}
      - {motif: vanity-of-vanities, refs: ["DialPess SB –:37-38"], note: "building a house leads to breaking up one's father's house: every course of action cancels itself"}
    hints:
      - "Compare Eccl 1:2-3; 2:4-11 (houses built, all is hevel) and Eccl 6:7-9 on appetite; Eccl 3:1-8 (a time for each thing and its opposite)."
      - "Washing hands before eating: compare Mark 7:3 and the ablution of Q 5:6."
  - id: ane-dialpess-sb-silence-crime-love
    tradition: ane-akkadian
    title: "Silence before an adversary, doing something dishonest, loving a woman (Dialogue of Pessimism)"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    version: Standard Babylonian
    read: ["DialPess SB –:a+1-52"]
    tags:
      - {motif: master-servant-dialogue-every-plan-refuted, refs: ["DialPess SB –:a+1-a+7", "DialPess SB –:39-45", "DialPess SB –:46-52"]}
      - {motif: crime-punished-by-death-flaying-blinding-prison, refs: ["DialPess SB –:44-45"], note: "šumma dīk šumma kīṣ šumma nuppul šumma ṣabit šumma ina bīt killi nadi"}
      - {motif: love-makes-man-forget-sorrow, refs: ["DialPess SB –:47-48"], note: "qūla u nissata imêš"}
      - {motif: woman-as-pit-and-dagger, refs: ["DialPess SB –:51-52"], note: "sinništu būrtu būrtu šuttatu hirītu / patar parzilli šēlu ša ikkisu kišād eṭli"}
      - {motif: strange-woman-deep-pit, refs: ["DialPess SB –:51"], note: "būrtu, šuttatu, hirītu: pit, hole, ditch"}
    hints:
      - "Woman as pit and sword: compare Prov 22:14; 23:27 (a deep pit, a narrow well), Prov 5:4 (sharp as a two-edged sword), Eccl 7:26 (more bitter than death, a snare)."
      - "Crime without dishonest gain leaves one naked and hungry: compare Prov 1:11-19 and Job 24."
      - "Silence before adversaries: compare Eccl 3:7 (a time to keep silence) and Prov 17:28."
  - id: ane-dialpess-sb-sacrifice-loans-good-deed
    tradition: ane-akkadian
    title: "Sacrifice to one's god, lending, a good deed for the country (Dialogue of Pessimism 53-78)"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    version: Standard Babylonian
    read: ["DialPess SB –:53-78"]
    tags:
      - {motif: master-servant-dialogue-every-plan-refuted, refs: ["DialPess SB –:53-61", "DialPess SB –:62-69", "DialPess SB –:70-78"]}
      - {motif: sacrifice-as-loan-to-god, refs: ["DialPess SB –:56-57"], note: "qīpta eli qīpti ippuš 'he makes loan upon loan'"}
      - {motif: giving-as-loan-to-god, refs: ["DialPess SB –:56-57"]}
      - {motif: sacrifice-trains-god-like-dog, refs: ["DialPess SB –:60-61"], note: "ila tulammassū-ma kī kalbi arkīka ittanallak; šumma parṣī šumma lātarāk"}
      - {motif: lending-sweet-as-love-recovery-painful-as-birth, refs: ["DialPess SB –:67"], note: "nadānu kīma râmi ṭāb u turru kīma alādi maruṣ (ṭāb partly restored)"}
      - {motif: good-deed-stored-with-god, refs: ["DialPess SB –:72-73"], note: "šaknā usātūšu ina qappati ša marūtuk"}
      - {motif: skulls-on-ruins-good-and-evil-indistinguishable, refs: ["DialPess SB –:76-78"], note: "elī-ma ina muhhi tīlānī labīrūti ... amur gulgullī ša arkûti u pānûti / ayyu bēl lemuttim-ma ayyu bēl usāti"}
      - {motif: one-fate-befalls-all, refs: ["DialPess SB –:77-78"]}
      - {motif: wise-and-fool-die-alike-leave-wealth, refs: ["DialPess SB –:76-78"], note: "here doer of evil and doer of good, low and great"}
    hints:
      - "Loan to God: compare Prov 19:17 (he who is kind to the poor lends to YHWH) and Q 2:245; 57:11 (a goodly loan)."
      - "Skulls on the ruin mounds: compare Eccl 2:14-16; 9:2-3 (one fate for righteous and wicked), Ps 49:11-13, and Q 30:9 / 40:21 (walk the earth and see the end of those before)."
      - "Interest and lending: compare Exod 22:24, Lev 25:36-37, Deut 23:20-21, and Q 2:275-280 on riba."
  - id: ane-dialpess-sb-what-is-good
    tradition: ane-akkadian
    title: "What then is good? Death (Dialogue of Pessimism 79-86)"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    version: Standard Babylonian
    read: ["DialPess SB –:79-86"]
    tags:
      - {motif: death-is-the-only-good, refs: ["DialPess SB –:80-82"], note: "enenna mīnû ṭāb / tikkī tikkaka šebēru ana nāri našāku ṭāb"}
      - {motif: no-one-tall-enough-to-reach-heaven, refs: ["DialPess SB –:83-84"], note: "ayyu arku ša ana šamê elû / ayyu rapšu ša erṣeta ugammeru"}
      - {motif: master-will-not-outlive-servant, refs: ["DialPess SB –:85-86"], note: "u bēlī lū šalāš ūmī kī arkīya iballuṭ"}
      - {motif: vanity-of-vanities, refs: ["DialPess SB –:79-84"]}
    hints:
      - "Compare Eccl 2:17; 4:2-3 (the dead more fortunate than the living), Job 3:20-22, and the question 'who has gone up to heaven?' in Prov 30:4 and Deut 30:12; Q 17:37 (you cannot reach the mountains in height)."
  # ---------------- Enuma elish I ----------------
  - id: ane-ee-sb-1-theogony
    tradition: ane-akkadian
    title: "When on high: Apsu and Tiamat and the generations of the gods (Enuma elish I 1-20)"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    version: Standard Babylonian
    read: ["Ee SB I:1-20"]
    tags:
      - {motif: not-yet-list-describes-primeval-state, refs: ["Ee SB I:1-2", "Ee SB I:6-8"], note: "enūma eliš lā nabû šamāmū / šapliš ammatu šuma lā zakrat; gipāra lā kiṣṣurū ṣuṣâ lā šēʾū"}
      - {motif: existence-as-being-named, refs: ["Ee SB I:1-2", "Ee SB I:8", "Ee SB I:10"], note: "šuma lā zakrat ... šuma lā zukkurū ... šuma izzakrū"}
      - {motif: primeval-sweet-and-salt-waters-mingle, refs: ["Ee SB I:3-5"], note: "mûšunu ištēniš ihiqqū-ma"}
      - {motif: creation-from-primeval-waters, refs: ["Ee SB I:3-9"], note: "tiāmtu is cognate with Hebrew tehom"}
      - {motif: successive-generations-of-gods, refs: ["Ee SB I:9-17"], note: "Lahmu-Lahamu, Anshar-Kishar, Anu, Nudimmud (Ea)"}
      - {motif: in-those-days-primordial-opening, refs: ["Ee SB I:1", "Ee SB I:7"]}
      - {motif: son-in-fathers-image, refs: ["Ee SB I:14-16"], note: "ānu tamšīlašu ulid nudimmud 'Anu begot his likeness, Nudimmud'"}
    hints:
      - "Compare Gen 1:1-2 (tehom, before heaven and earth are named) and Gen 2:4b-5 (when no shrub was yet); Ps 104:6; Prov 8:24-26 (when there were no depths)."
      - "Gen 5:3 (Adam begot a son in his likeness, after his image) echoes I:16 tamšīlašu."
      - "Q 21:30 (heavens and earth were a joined mass which We split), Q 11:7 (his throne was upon the water)."
  - id: ane-ee-sb-1-apsu-slain
    tradition: ane-akkadian
    title: "The young gods' noise; Apsu plots and is slain by Ea (Enuma elish I 21-78)"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    version: Standard Babylonian
    read: ["Ee SB I:21-78"]
    tags:
      - {motif: young-gods-noise-robs-elder-of-sleep, refs: ["Ee SB I:21-28", "Ee SB I:37-40"], note: "urriš lā šupšuhāku mūšiš lā ṣallāku ... qūlu liššakin-ma i niṣlal nīnu"}
      - {motif: reason-human-noise, refs: ["Ee SB I:22-25", "Ee SB I:37-39"], note: "here the noise is that of the young gods, not humans"}
      - {motif: divine-council-deliberates-deception, refs: ["Ee SB I:29-34"], note: "Apsu and his vizier Mummu take counsel before Tiamat to destroy the gods (interpretive fit)"}
      - {motif: messenger-kisses-ground-before-lord, refs: ["Ee SB I:51-54"], note: "Apsu embraces and kisses Mummu; reversed hierarchy - interpretive"}
      - {motif: wise-god-spellbinds-and-kills-primeval-father, refs: ["Ee SB I:59-70"], note: "tâšu ella ... šitta irtehīšu ... ipṭur riksīšu ištahaṭ agâšu melammīšu itbala ... ikmīšū-ma apsâ ināraššu"}
      - {motif: deep-sleep-sent-by-god, refs: ["Ee SB I:64-65"], note: "šitta irtehīšu ṣalil ṭūbātiš"}
      - {motif: victor-builds-dwelling-on-slain-foe, refs: ["Ee SB I:71-78"], note: "ukīn-ma eli apsî šubassu; names it Apsu; Ea and Damkina dwell there"}
      - {motif: deity-names-creations, refs: ["Ee SB I:76"], note: "imbīšum-ma apsû"}
      - {motif: divine-rest-seventh-day, refs: ["Ee SB I:75"], note: "after victory Ea 'rested in profound quiet' (šupšuhiš inūh-ma); rest after the work, not seventh day"}
    hints:
