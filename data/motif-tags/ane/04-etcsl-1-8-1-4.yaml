    corpus: ane
    original: true
    tagger: "Claude (model), reading the Sumerian"
    read: ["ETCSL 1.8.2.2 290-344"]
    tags:
      - {motif: king-reproaches-goddess, refs: ["ETCSL 1.8.2.2 290-293"], note: "eme sig {d}inana ba-ni-in-gu7 'he slandered (lit. ate the back of) Inana'"}
      - {motif: city-founded-on-drained-marsh, refs: ["ETCSL 1.8.2.2 294-302"], note: "Unug was marsh, poplars, reeds; Enki tore out the old reeds, drained the water; mu 50-uš ḫu-mu-du3 'for fifty years I built'"}
      - {motif: amorites-as-hostile-others, refs: ["ETCSL 1.8.2.2 303-304"], note: "mar-tu lu2 še nu-zu ḫu-mu-zig3 'the Martu, who know no grain, rose up'"}
      - {motif: wall-like-bird-net-over-desert, refs: ["ETCSL 1.8.2.2 305"]}
      - {motif: deity-abandons-king, refs: ["ETCSL 1.8.2.2 306-318"], note: "like a son who hates his mother leaving the city, Inana has run off to Kulaba; if she loves the city and hates me ...; abandons me like an Anzud chick"}
      - {motif: cow-bound-to-calf-simile, refs: ["ETCSL 1.8.2.2 307"], note: "ab2-šilam amar-bi la2-a-gin7 erin2-ĝu10 mu-da-la2"}
      - {motif: spear-laid-aside-shield-shattered, refs: ["ETCSL 1.8.2.2 319-320"], note: "ĝiš-gid2-da-ĝu10 ud ne ba-an-de6 / {kuš}gur21-ĝu10 ... ba-an-zur-zur-re"}
      - {motif: hero-scorned-like-foreign-dog, refs: ["ETCSL 1.8.2.2 322-325"], note: "they bark at him like a strange dog joining a pack; he steps proudly like a strange wild ass"}
      - {motif: protective-spirits-go-before-and-behind, refs: ["ETCSL 1.8.2.2 330-331"], note: "{d}udug sag9-ga-me nam-ba-e-de3-gub-ba / {d}lamma sag9-ga-me nam-ba-e-de3-ĝen-na"}
      - {motif: land-of-no-return-mountains, refs: ["ETCSL 1.8.2.2 335-336"]}
      - {motif: seven-mountain-ranges-crossed, refs: ["ETCSL 1.8.2.2 342-344"], note: "from the edge of Anšan to its top: ḫur-saĝ 5 ḫur-saĝ 6 ḫur-saĝ 7 im-me-re-bal-bal"}
    hints:
      - "God as the one who drained the waters and made the land: compare Ps 104:5-9; Gen 1:9."
      - "The deity leaving the king: compare 1 Sam 16:14; 1 Sam 28:15 and Ezek 10:18-19 (glory leaves the temple)."
      - "Amorite/Bedouin who knows no grain: compare Jer 35:7 (Rechabites sow no seed)."
