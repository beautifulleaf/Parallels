    title: Lugalbanda asks for and receives tireless speed; Anzud's command of secrecy
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Sumerian"
    read: ["ETCSL 1.8.2.2 167-219"]
    tags:
      - {motif: gift-of-tireless-running, refs: ["ETCSL 1.8.2.2 167-177", "ETCSL 1.8.2.2 184-194"], note: "zag-še-ĝa2 kaš4 ḫe2-ĝal2 nam-ba-kuš2-u3-de3-en: running power in the thighs, never tiring; like the sun, Inana, the seven storms of Iškur, a flame, lightning"}
      - {motif: mount-up-with-wings-like-eagles, refs: ["ETCSL 1.8.2.2 168-170", "ETCSL 1.8.2.2 185-187"], note: "loose fit: the bird grants tireless strength to the runner"}
      - {motif: curser-shall-not-rejoice, refs: ["ETCSL 1.8.2.2 179-180", "ETCSL 1.8.2.2 196-197"], note: "lu2 aš2 dug4-ga-ĝu10 nam-ba-e-ši-ḫul2-e-en"}
      - {motif: vow-of-statue-for-patron, refs: ["ETCSL 1.8.2.2 181-183", "ETCSL 1.8.2.2 198-200"], note: "alan-zu ĝiš-dim2-ba um-mi-dim2: woodcarvers will make your statue; your name made famous in Sumer"}
      - {motif: blessing-repeats-request-word-for-word, refs: ["ETCSL 1.8.2.2 184-200"]}
      - {motif: bird-above-hero-below-spy-the-army, refs: ["ETCSL 1.8.2.2 205-208"], note: "anzud an-ta i3-ĝen / lugal-ban3-da ki-ta i3-ĝen; the bird sees the troops, the man sees their dust"}
      - {motif: divine-gift-must-be-kept-secret, refs: ["ETCSL 1.8.2.2 211-217"], note: "gu5-li-zu-ne-er nam-mu-ni-ib-be2-en / šeš-zu-ne-er pa nam-bi2-ib-ed2-en; sag9-ga ḫul šag4-ga ĝal2-la ur5 ḫe2-na-nam-ma 'good fortune can hide evil'"}
    hints:
      - "Running and not growing weary: Isa 40:31 (mount up with wings like eagles, run and not weary)."
      - "Swift as a gazelle: 2 Sam 2:18; 1 Kgs 18:46 (Elijah outruns Ahab's chariot)."
      - "Tell no one: compare Gen 37:5-11 (Joseph's dream told to his brothers) and Q 12:5 ('do not tell your dream to your brothers')."
