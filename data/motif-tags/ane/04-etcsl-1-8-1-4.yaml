  fate-decreed-cannot-be-altered: {label: "'If I fix a fate, who can alter it? If I speak, who can change it?'", cluster: fate}
  if-god-or-man-conditional-reward: {label: "'If you are a god I will befriend you; if a man I will fix your fate'", cluster: fate}
  praise-of-monster-bird-body: {label: "Flattering praise of the bird's body: wings a net across the sky, talons a trap, back a palm garden", cluster: speech}
  grandfather-set-heaven-in-hand-earth-at-feet: {label: "A god put heaven in the creature's hand and earth at its feet", cluster: kingship}
  adoption-formula-you-are-my-father: {label: "Adoption formula: 'your wife shall be my mother, you my father, your little ones my brothers'", cluster: family}
  refuge-under-protection-of-wings: {label: "The fugitive entrusts his life to the protection of a great bird", cluster: guardianship}
  hero-refuses-offered-gifts: {label: "The hero refuses each offered gift (wealth, weapons, plenty) in turn", cluster: heroes}
  wilful-ox-and-balking-ass-proverb: {label: "Proverb: the wilful ox must be put back in the furrow, the balking ass on the straight path", cluster: wisdom}
  wish-granted-by-supernatural-patron: {label: "A supernatural patron promises to fix a destiny according to the hero's wish", cluster: fate}
  gift-of-tireless-running: {label: "The hero is granted tireless running power, moving like sunlight, storm and lightning", cluster: heroes}
  curser-shall-not-rejoice: {label: "Blessing: whoever curses you shall have no joy of it, whoever challenges you shall not prevail", cluster: blessing}
  vow-of-statue-for-patron: {label: "The hero vows to have woodcarvers make statues of his patron to make its name famous", cluster: cult}
  blessing-repeats-request-word-for-word: {label: "The patron grants the request by repeating it word for word as a blessing", cluster: blessing}
  bird-above-hero-below-spy-the-army: {label: "The bird flies above and the hero walks below; each spies the army from his level", cluster: travel}
  divine-gift-must-be-kept-secret: {label: "The hero is told not to reveal his gift or destiny to comrades or brothers", cluster: revelation}
  return-of-one-presumed-dead: {label: "A comrade given up for dead returns to his astonished companions", cluster: heroes}
  land-of-no-return-mountains: {label: "The great mountains where no one goes alone and from which no one returns to mankind", cluster: underworld}
  concealing-truth-with-cover-story: {label: "The hero hides the true source of his survival behind a fanciful account", cluster: deception}
  sick-man-fed-and-healed-by-kin: {label: "His brothers feed him like a chick in the nest and drive away his sickness", cluster: healing}
  army-winds-like-snake: {label: "The army winds through the hills like a snake over a grain pile", cluster: war}
  missiles-rain-from-walls: {label: "Javelins and slingstones rain from the walls like a year's rain", cluster: war}
  siege-lasts-full-year: {label: "A siege drags on until the year comes full circle and the harvest yellows", cluster: war}
  hemmed-in-by-thorns-and-dragons: {label: "The army is hemmed in by mountain thornbushes thronged with dragons", cluster: war}
  king-afraid-and-troubled: {label: "The king is afraid and troubled in the midst of his army", cluster: kingship}
  oath-sworn-by-heaven-and-earth: {label: "An oath sworn by heaven and earth", cluster: oaths}
  king-reproaches-goddess: {label: "The king reproaches his patron goddess for abandoning him", cluster: prayer}
  city-founded-on-drained-marsh: {label: "The city was built where marsh and reeds were, after a god drained the water", cluster: civilization}
  wall-like-bird-net-over-desert: {label: "The city wall stretches over the desert like a bird net", cluster: war}
  deity-abandons-king: {label: "The patron deity has left the king and gone home like a son who hates his mother", cluster: gods}
  cow-bound-to-calf-simile: {label: "Troops bound to their king as a cow to its calf", cluster: kingship}
  spear-laid-aside-shield-shattered: {label: "'On that day my spear shall be laid aside, my shield may be shattered'", cluster: war}
  hero-scorned-like-foreign-dog: {label: "His comrades bark at the hero like a pack at a strange dog", cluster: heroes}
  journey-of-weeks-done-in-one-day: {label: "A miraculously swift journey: the hero arrives by midnight of the same day", cluster: travel}
  prostration-before-deity: {label: "The hero bows and prostrates himself on the ground before a deity", cluster: cult}
  goddess-looks-on-hero-as-on-her-son: {label: "The goddess looks on the hero as on her beloved son or shepherd-consort", cluster: gods}
  river-as-goddesss-waterskin: {label: "A clear river is called the goddess's lapis waterskin", cluster: gods}
  oracle-with-riddling-instructions: {label: "A deity answers with a riddling oracle prescribing ritual acts for victory", cluster: prophecy}
  lone-tamarisk-cut-for-bucket: {label: "A single tamarisk standing alone must be cut and made into a bucket", cluster: magic}
  fish-caught-cooked-offered-to-weapon: {label: "A divine fish is caught, cooked and offered to the goddess's battle-weapon", cluster: magic}
  enemy-life-force-in-subterranean-waters: {label: "The enemy city's life-force lies in the subterranean waters and can be ended", cluster: magic}
  smiths-and-craftsmen-carried-off: {label: "The conqueror carries off the city's metalworkers and stone-workers", cluster: war}
  city-of-lapis-and-red-brick: {label: "A distant city with battlements of lapis and walls of bright red brick", cluster: geography}
units:
  - id: ane-etcsl-1-8-1-4-1-prologue-huluppu
    tradition: ane-sumerian
    title: Prologue of the first days and the ḫalub tree planted in Inana's garden (Gilgameš, Enkidu and the nether world)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Sumerian"
    read: ["ETCSL 1.8.1.4 1:1-46"]
    tags:
      - {motif: in-those-days-primordial-opening, refs: ["ETCSL 1.8.1.4 1:1-5"], note: "ud re-a ud su3-ra2 re-a / ĝi6 re-a / mu re-a: days, nights, years of old, the triple formula"}
      - {motif: first-bread-and-ovens-of-the-land, refs: ["ETCSL 1.8.1.4 1:6-7"], note: "eš3 kalam-ma-ka ninda šu2-a-ba; {im}šu-rin-na ... niĝ2-tab ak-a-ba: civilization's first bread and ovens dated to the primeval age"}
      - {motif: heaven-separated-from-earth-primeval, refs: ["ETCSL 1.8.1.4 1:8-9"], note: "an ki-ta ba-da-ba9-ra2-a-ba / ki an-ta ba-da-sur-ra-a-ba"}
      - {motif: cosmos-divided-among-three-gods, refs: ["ETCSL 1.8.1.4 1:11-13"], note: "An takes heaven, Enlil the earth, the nether world (kur) given to Ereškigala as a gift (saĝ rig7)"}
      - {motif: god-sails-to-netherworld-storm, refs: ["ETCSL 1.8.1.4 1:14-26"], note: "Enki's little boat (ĝiš-ma2 tur) assailed by small and large hailstones; waves devour like wolves (ur-bar-ra-gin7) and lion (ur-maḫ-gin7)"}
      - {motif: uprooted-tree-carried-by-river, refs: ["ETCSL 1.8.1.4 1:27-31"], note: "a single ḫalub tree on the bank of the pure Euphrates, uprooted by the south wind (u18-lu)"}
      - {motif: tree-planted-in-goddess-garden, refs: ["ETCSL 1.8.1.4 1:32-37"], note: "{ĝiš}kiri6 gi-rin {d}inana; planted and watered 'with her feet, not her hands'"}
      - {motif: furniture-from-sacred-tree-desired, refs: ["ETCSL 1.8.1.4 1:38-39"], note: "me-na-am3 {ĝiš}gu-za ... ĝiš-nu2: when will it be a chair, a bed for me?"}
      - {motif: serpent-at-root-bird-in-crown-demon-in-trunk, refs: ["ETCSL 1.8.1.4 1:42-44"], note: "muš tu6 nu-zu (snake that knows no incantation) at the roots, Anzud bird with young in the branches, ki-sikil lil2-la2 (the 'phantom maid', Akk. ardat lilî, the Lilith figure) in the trunk"}
      - {motif: charm-resistant-serpent, refs: ["ETCSL 1.8.1.4 1:42"], note: "muš tu6 nu-zu-e: 'snake that does not know an incantation'"}
      - {motif: lilith-dwells-in-tree, refs: ["ETCSL 1.8.1.4 1:44-45"], note: "ki-sikil lil2-la2-ke4 e2 im-ma-ni-ib-du3; ki-sikil zu2 li9-li9 šag4 ḫul2-ḫul2 'the maid who laughs (flashes teeth) with joyful heart'"}
      - {motif: goddess-weeps, refs: ["ETCSL 1.8.1.4 1:46"], note: "kug {d}inana-ke4 er2 e-ne ba-še8-še8"}
    hints:
      - "Heaven parted from earth: compare Gen 1:6-8 and Q 21:30 (ratq/fatq)."
      - "Ki-sikil-lil-la, the 'Lilith' of later tradition: compare Isa 34:14 (lilit settles among the ruins)."
      - "Snake at the root, bird in the branches of a sacred tree in a divine garden: compare Gen 2:9; 3:1 (serpent in Eden), Ezek 31:3-9 and Dan 4:9 (birds in the great tree)."
      - "Snake deaf to charm: compare Ps 58:5-6 (deaf adder) and Jer 8:17 (snakes that cannot be charmed)."
      - "Division of heaven, earth and underworld among three gods: compare Atrahasis I 11-16 and Deut 32:8-9 (nations allotted)."
  - id: ane-etcsl-1-8-1-4-1-inana-appeals
    tradition: ane-sumerian
    title: Inana tells her tale to Utu, who refuses, then to Gilgameš, who stands by her
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Sumerian"
    read: ["ETCSL 1.8.1.4 1:47-135"]
    tags:
      - {motif: dawn-formula-sun-leaves-bedchamber, refs: ["ETCSL 1.8.1.4 1:47-49", "ETCSL 1.8.1.4 1:91-93"], note: "{d}utu agrun-ta e3-a-ni: Utu comes out of his bedchamber at dawn while little birds clamour"}
      - {motif: verbatim-repetition-of-narrative-in-speech, refs: ["ETCSL 1.8.1.4 1:52-89", "ETCSL 1.8.1.4 1:96-133"], note: "Inana retells prologue and tree story word for word, partly in Emesal (ga-ša-an, mu-ul-lil2, am-an-ki, mu for ĝiš)"}
      - {motif: brother-refuses-sisters-plea, refs: ["ETCSL 1.8.1.4 1:90"], note: "šeš-a-ni ur-saĝ šul {d}utu inim-bi nu-mu-de3-gub: Utu does not stand by her"}
      - {motif: hero-champions-goddess-as-brother, refs: ["ETCSL 1.8.1.4 1:94-95", "ETCSL 1.8.1.4 1:134-135"], note: "she addresses Gilgameš as šeš-ĝu10 'my brother'; he stands by her (inim-bi ba-de3-gub)"}
      - {motif: triple-petition-pattern, refs: ["ETCSL 1.8.1.4 1:90", "ETCSL 1.8.1.4 1:135"], note: "the plea fails with one, succeeds with the next; the same pattern recurs with Enlil and Enki at 1:229, 1:237"}
    hints:
      - "Repeated tale in a speech: compare the servant's retelling in Gen 24:34-48."
  - id: ane-etcsl-1-8-1-4-1-tree-cleared
    tradition: ane-sumerian
    title: Gilgameš kills the snake, drives off Anzud and the phantom maid, and makes throne, bed, ball and mallet
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Sumerian"
    read: ["ETCSL 1.8.1.4 1:136-150"]
    tags:
      - {motif: heros-colossal-weapons-weighed, refs: ["ETCSL 1.8.1.4 1:136-139"], note: "belt of 50 minas felt as 30 shekels; bronze axe of 7 talents 7 minas"}
      - {motif: hero-kills-serpent-in-tree, refs: ["ETCSL 1.8.1.4 1:140"], note: "muš tu6 nu-zu-e saĝ ĝiš ba-an-ra"}
      - {motif: demon-flees-to-wilderness, refs: ["ETCSL 1.8.1.4 1:142-143"], note: "the ki-sikil lil2-la2 abandons her house and flees to e2-ri-e2-ri 'desolate places'"}
      - {motif: bird-flees-to-mountains-with-young, refs: ["ETCSL 1.8.1.4 1:141"]}
      - {motif: furniture-from-sacred-tree-desired, refs: ["ETCSL 1.8.1.4 1:147-148"], note: "the wood given to Inana for her chair ({ĝiš}gu-za) and bed (ĝiš-nu2)"}
      - {motif: ball-and-mallet-from-sacred-wood, refs: ["ETCSL 1.8.1.4 1:149-150"], note: "{ĝiš}ellag (ball/hoop?) from the roots, {ĝiš}e-ke4-ma (stick/mallet?) from the branches; meanings uncertain"}
    hints:
      - "The Lilith figure driven into desolate places: compare Isa 34:14 (lilit in the waste) and Isa 13:21-22."
      - "Throne and bed of precious wood: compare 1 Kgs 10:18 (Solomon's throne) and Song 3:9-10 (palanquin of Lebanon wood)."
  - id: ane-etcsl-1-8-1-4-1-ball-lost
    tradition: ane-sumerian
    title: The ball game oppresses the young men; the widows' outcry sends ball and mallet to the nether world
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Sumerian"
    read: ["ETCSL 1.8.1.4 1:151-175"]
    tags:
      - {motif: king-oppresses-young-men-of-city, refs: ["ETCSL 1.8.1.4 1:151-154"], note: "he plays without stopping and praises himself (ni2 silim dug4-dug4-ge); the team cry 'a gu2-ĝu10 a ib2-ba-ĝu10' (O my neck, O my hips)"}
      - {motif: self-praise-of-king, refs: ["ETCSL 1.8.1.4 1:152"]}
      - {motif: mothers-and-sisters-bring-bread-and-water, refs: ["ETCSL 1.8.1.4 1:155-156"], note: "ama tuku dumu-ni-ir ninda mu-na-ab-de6 / nin9 tuku šeš-a-ni-ir a mu-na-de2-e"}
      - {motif: god-hears-cry-of-widow-and-orphan, refs: ["ETCSL 1.8.1.4 1:160-163"], note: "i-{d}utu ki-sikil tur-ra-ta: the outcry (i-Utu) of the young girls and the accusation (šu du3-du3-a) of the widows (nu-mu-un-su) cause ball and mallet to fall to the bottom of the nether world (dur2 kur-ra); interpretive: no god is named as hearer"}
      - {motif: precious-object-falls-into-netherworld, refs: ["ETCSL 1.8.1.4 1:163-165"], note: "he cannot reach them with hand or foot"}
      - {motif: gate-of-netherworld-ganzer, refs: ["ETCSL 1.8.1.4 1:166"], note: "abula ganzer igi kur-ra-ka: the gate of Ganzer before the nether world"}
      - {motif: hero-laments-lost-object, refs: ["ETCSL 1.8.1.4 1:167-175"], note: "a {ĝiš}ellag-ĝu10 a {ĝiš}e-ke4-ma-ĝu10; vow to treat the carpenter's wife as mother and child as little sister if only the ball were still at the carpenter's"}
      - {motif: who-will-bring-up-from-netherworld, refs: ["ETCSL 1.8.1.4 1:174-175"], note: "a-ba-a ma-ra-ab-ed3-de3: 'who will bring it up for me?'"}
    hints:
      - "Outcry of widows and orphans that brings down punishment: compare Exod 22:21-23 and Q 4:75."
      - "Who will go down / bring up: compare Deut 30:12-13 and Rom 10:6-7."
  - id: ane-etcsl-1-8-1-4-1-enkidu-descends
    tradition: ane-sumerian
    title: Enkidu offers to descend; Gilgameš's taboos for the nether world; Enkidu breaks them all and is seized
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Sumerian"
    read: ["ETCSL 1.8.1.4 1:176-220"]
    tags:
      - {motif: servant-volunteers-for-perilous-descent, refs: ["ETCSL 1.8.1.4 1:176-179"], note: "arad-da-ni en-ki-du10: Enkidu is his 'servant' (arad) here"}
      - {motif: netherworld-taboos-instructed, refs: ["ETCSL 1.8.1.4 1:184-198"], note: "no clean garments (else marked as stranger), no fine oil, no throw-stick, no cornel staff, no sandals, no shouting, no kissing or striking wife or son"}
      - {motif: dead-recognize-living-stranger, refs: ["ETCSL 1.8.1.4 1:184-191"], note: "gir5-gin7 ĝiškim ... 'they would mark you as a stranger'; the gidim (spirits) surround him at the scent of oil"}
      - {motif: outcry-detains-in-netherworld, refs: ["ETCSL 1.8.1.4 1:198", "ETCSL 1.8.1.4 1:220"], note: "i-{d}utu kur-ra ba-e-dab5-be2: the outcry (i-Utu) seizes you in the nether world"}
      - {motif: naked-mother-goddess-of-underworld-lies, refs: ["ETCSL 1.8.1.4 1:199-204"], note: "ama {d}nin-a-zu i3-nu2-a: Ninazu's mother (Ereškigala) lies with shoulders uncovered, breast bare, fingers like a pickaxe, plucking her hair like leeks"}
      - {motif: warning-disregarded-point-by-point, refs: ["ETCSL 1.8.1.4 1:205-220"], note: "inim lugal-la-na-aš šu nu-um-ma-gid2: every prohibition is repeated as a transgression"}
      - {motif: dead-seize-the-living, refs: ["ETCSL 1.8.1.4 1:220"], note: "kur-ra im-ma-an-dab5"}
    hints:
      - "Taboos for entering the realm of the dead/holy (remove sandals, no anointing): compare Exod 3:5, 2 Sam 12:20 and the mourning rules of Ezek 24:17."
      - "Inana's Descent (ETCSL 1.4.1) for garments stripped at underworld gates; compare Job 1:21 and Eccl 5:15 (naked one goes)."
  - id: ane-etcsl-1-8-1-4-1-gods-petitioned
    tradition: ane-sumerian
    title: Gilgameš petitions Enlil (refused) and Enki (helps); Utu opens a hole and brings Enkidu's spirit up
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Sumerian"
    read: ["ETCSL 1.8.1.4 1:221-242"]
    tags:
      - {motif: hero-weeps-before-god-in-temple, refs: ["ETCSL 1.8.1.4 1:222-224", "ETCSL 1.8.1.4 1:230-232"], note: "to E-kur alone (ĝiri3-ni dili mu-un-gub), then to Enki in Eridug"}
      - {motif: death-not-by-demon-or-battle-but-netherworld, refs: ["ETCSL 1.8.1.4 1:225-228", "ETCSL 1.8.1.4 1:233-236"], note: "nam-tar nu-un-dab5 a2-sag3 nu-un-dab5 ... ki nam-nitaḫ-a-ke4 me3-a nu-un-šub kur-re im-ma-an-dab5: not Namtar, Asag, Nergal's udug, nor battle"}
      - {motif: triple-petition-pattern, refs: ["ETCSL 1.8.1.4 1:229", "ETCSL 1.8.1.4 1:237"], note: "Enlil does not stand by him; Enki does"}
      - {motif: wise-god-helps-where-chief-god-refuses, refs: ["ETCSL 1.8.1.4 1:237-240"]}
      - {motif: hole-opened-to-netherworld, refs: ["ETCSL 1.8.1.4 1:239-242"], note: "ab-lal3 kur-ra ... taka4: a vent/hole in the nether world; Utu brings Enkidu up si-si-ig-ni-ta 'with his breeze (?)'; šubur 'servant' or ghost"}
      - {motif: necromancer-raises-dead-prophet, refs: ["ETCSL 1.8.1.4 1:240-242"], note: "loose fit: the sun god brings a dead man's spirit up from the earth to speak with the living"}
    hints:
      - "Raising a ghost from the earth: compare 1 Sam 28:11-15 (Samuel brought up) and Isa 29:4 (voice from the dust)."
      - "Gilgameš SB XII is the Akkadian translation of this half (lines 1:172-303)."
  - id: ane-etcsl-1-8-1-4-1-underworld-report
    tradition: ane-sumerian
    title: Enkidu's report on the fate of the dead (main recension)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Sumerian"
    read: ["ETCSL 1.8.1.4 1:243-303"]
    tags:
      - {motif: companions-weary-each-other-with-questions, refs: ["ETCSL 1.8.1.4 1:243-246"], note: "gu2-ni gu2-da mu-ni-in-la2 ne mu-un-su-ub-be2; en3 tar-re im-mi-in-kuš2-u3-ne 'they wearied each other with questions'"}
      - {motif: weeping-on-necks, refs: ["ETCSL 1.8.1.4 1:243"], note: "gu2-ni gu2-da mu-ni-in-la2 ne mu-un-su-ub-be2: neck bound to neck, they kiss; weeping follows at 1:248"}
      - {motif: order-of-the-netherworld-revealed, refs: ["ETCSL 1.8.1.4 1:245-248"], note: "a2 aĝ2-ĝa2 kur-ra igi bi2-du8 'did you see the order of the nether world?'; 'sit down and weep'"}
      - {motif: body-eaten-by-worms-in-grave, refs: ["ETCSL 1.8.1.4 1:249-252"], note: "[tug2 sumun]-a-gin7 uḫ bi2-in-tag: vermin infest (the body) like an old garment, full of dust; partly restored"}
      - {motif: sitting-in-dust-in-grief, refs: ["ETCSL 1.8.1.4 1:253"], note: "saḫar-ra ba-da-an-tuš"}
      - {motif: fate-of-dead-graded-by-number-of-sons, refs: ["ETCSL 1.8.1.4 1:254-267"], note: "one son: weeps at a peg in his wall; two: sits on two bricks eating bread; three: drinks from a waterskin; four: like a man with four asses; five: like a good scribe enters palace; six: cheerful as a ploughman; seven: as companion of the gods sits on a throne and hears judgments"}
      - {motif: many-sons-as-divine-blessing, refs: ["ETCSL 1.8.1.4 1:266-267"], note: "interpretive: seven sons yield the best afterlife (dub-us2 diĝir-re-e-ne-ke4 {ĝiš}gu-za ib2-tuš)"}
      - {motif: eunuch-childless-and-unmarried-dead-wretched, refs: ["ETCSL 1.8.1.4 1:268-277"], note: "tiru palace eunuch propped in a corner like a useless stick; woman who never gave birth (munus nu-u3-tud) thrown away like a pot; youth and girl who never undressed their spouse weep over rope and reed mat; man without heir (ibila nu-tuku)"}
      - {motif: leper-dwells-alone-outside-camp, refs: ["ETCSL 1.8.1.4 1:287-289"], note: "lu2-saḫar-šub-ba (leper): food and water set apart (u2-ni al-bar a-ni al-bar); twitches like an ox as worms eat him; 'lives outside the city' only in 2:7"}
      - {motif: fallen-in-battle-head-unheld, refs: ["ETCSL 1.8.1.4 1:290-291"], note: "ad ama-ni saĝ-du nu-mu-un-dab5 dam-a-ni er2 i3-še8-še8"}
      - {motif: ghost-without-funerary-offerings-eats-scraps, refs: ["ETCSL 1.8.1.4 1:292-293"], note: "gidim lu2 ninda sig10-ge5 nu-tuku ... sila šub-ba i3-gu7-e: eats crumbs tossed in the street"}
      - {motif: stillborn-children-play-in-afterlife, refs: ["ETCSL 1.8.1.4 1:298-299"], note: "niĝin3-ĝar tur-tur-ĝu10 ni2-ba nu-zu: 'my little stillborn who never knew themselves' play at a table of gold and silver with honey and ghee"}
      - {motif: burned-man-has-no-ghost, refs: ["ETCSL 1.8.1.4 1:302-303"], note: "lu2 izi la2 ... gidim-a-ni nu-ĝal2 i-bi2-ni an-na ba-e-ed3: no spirit, his smoke went up to the sky"}
      - {motif: death-by-lion-or-fall-in-afterlife, refs: ["ETCSL 1.8.1.4 1:287A-287D", "ETCSL 1.8.1.4 1:294-297"], note: "one ms.: eaten by lion cries 'O my hands, O my legs'; fallen from roof; hit by a ship's board cries 'alas my mother'"}
