    tags:
      - {motif: scapegoat-bears-sins-into-wilderness, refs: ["GKAB P348617 r.i:3-5"], note: "gisandassû šiptu ... mašhulduppû šiptu immeru ... udutilû immeru ellu: incantations over the reed figure, the scapegoat (mašhulduppû) and the live sheep, a pure sheep"}
      - {motif: torch-and-censer-carried-through-house, refs: ["GKAB P348617 r.i:6-7"], note: "arki takpirti ebbetu šarru ... nignakka gizillâ šarra tušbaʾʾšu: after the bright purification, censer and torch are passed around the king"}
      - {motif: seven-fold-ritual-action, refs: ["GKAB P348617 r.i:12-14"], note: "mê 7-šu ana imittišu 7-šu ana šumēlišu ana arkišu tanaddī-ma ... Ea ēpuš Ea ipšur (7 times): water thrown seven times to his right, seven to his left and behind him"}
