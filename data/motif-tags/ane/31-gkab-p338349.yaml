      - "The king prostrate in the temple: 1 Kgs 8:54, 2 Chr 7:3; evil sent off to the enemy land: Ps 79:6, Jer 10:25."
  - id: ane-gkab-p348617-r-bit-rimki-scapegoat-and-birds
