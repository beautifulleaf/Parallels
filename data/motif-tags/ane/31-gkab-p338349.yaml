      - {motif: mother-seeks-son-where-are-your-feet, refs: ["GKAB P338675 o:24-27"], note: "ayyakama ina šēpīki ēdu utterū ... mārī ina šēpīya ēdu utterūka: where (did they turn) on your feet alone; my son, alone they turned you back on my feet"}
      - {motif: tree-taller-than-others-cut-down, refs: ["GKAB P338675 r:14-21"], note: "anāku ina kirîni kī iṣi damqi elâku / elâku kī lammê elâku kī ašūhi ... ēmurānī ihaddî abūa ... ūma ittaksūni ... ēmurānī ibakkî abūa: I stood high in our garden like a fine tree, like a lammu, like a pine; my father saw me and rejoiced; today they have cut me down; my father sees me and weeps"}
      - {motif: daughter-of-humbaba-cedar-forest, refs: ["GKAB P338675 r:24"], note: "mārat Humbaba kittî dannat qišti erēni"}
      - {motif: bird-nest-in-city-lament, refs: ["GKAB P338675 r:5-8"], note: "iṣṣurtu ša ... iṣṣūrāte ša itti-šina ušabbitni / ammate ina birti ālīki qinnī iqṭunāni: the birds that fled with her; they made their nest in your city"}
      - {motif: father-killed-house-broken, refs: ["GKAB P338675 r:25-28"], note: "bītsa ihpû ... hāwiru ša lalêya ... abūa dīk: her house broken, the husband of my delight ... my father killed"}
