      - {motif: fire-god-burns-witch-refrain, refs: ["GKAB P348617 r.i:32", "GKAB P348617 r.i:39-41"], note: "Nusku šurbû ilitti Anu ... šurpa tašakkan-ma ... paṭrā ilū rabûtu ... māmīt kalāma ... kīma šūmi annî: the Nusku incantation; a burning; 'released are the great gods', 'like this onion' (Šurpu incipits)"}
      - {motif: personal-god-and-goddess-reconciled, refs: ["GKAB P348617 r.e:1-2"], note: "mīnû arnī ... ana pān riksi ša il awīli u ištar awīli izzaz ... ilī lā īdû ... ilī bēlī: 'what is my sin?', recited before the offering arrangement of the man's god and goddess; 'my god whom I do not know'"}
      - {motif: bound-sheep-released-as-guilt-released, refs: ["GKAB P348617 r.e..i:45"], note: "šarru immera kasâ ipaṭṭar"}
    hints:
      - "Scapegoat and goat for Azazel: Lev 16:8-10, 16:20-22; two birds, one released over the field: Lev 14:4-7; sevenfold sprinkling: Lev 14:7, Lev 16:14,19, Num 19:18-19."
      - "'What is my sin?' and the unknown god: 1 Sam 20:1, Job 7:20-21, Job 13:23; Acts 17:23 (to an unknown god)."
  - id: ane-gkab-p348618-oi-shurpu-2-catalogue-of-sins
    tradition: ane-akkadian
    title: "Šurpu II (SpTU 2 13 obv.): the catalogue of sins - good for evil, bribed judges, the widow wronged, father set against son, captives kept in darkness, false measures"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    version: Standard Babylonian
    read: ["GKAB P348618 o.i", "GKAB P348618 o.ii"]
