      - {motif: calling-good-evil-and-evil-good, refs: ["GKAB P348618 o.i:2'-3'"], note: "ana banīti lemutta / ana lemutti banīta: (he said) evil for good, good for evil"}
      - {motif: judge-bribed-to-pervert-justice, refs: ["GKAB P348618 o.i:4'-5'"], note: "ṣalipta ušadbibū dayyāna ušāhizū: made one speak falsehood, made the judge take (a bribe)"}
      - {motif: lying-knew-but-did-not-say, refs: ["GKAB P348618 o.i:7'-8'", "GKAB P348618 o.i:33'"], note: "īdû lā iqbû / iqbû uttaru ... ana yānu ibašši iqtabi: knew but did not speak; spoke but exaggerated; said 'there is' for 'there is not'"}
      - {motif: oppression-of-widow-stranger-orphan, refs: ["GKAB P348618 o.i:9'-10'"], note: "enša hablu eništa idâṣu / almatta ina dīni ālišu usahhiru: oppressed the weak man and the wronged weak woman, turned the widow away in his city's court"}
      - {motif: separated-father-from-son-sin, refs: ["GKAB P348618 o.i:11'-19'"], note: "itti abi māra iprus / itti māri aba iprus / itti ummi mārta ... itti mārti umma ... itti emēti kallata ... itti kallati emēta ... itti ahi ahāšu ... itti ibri ibiršu ... itti rūʾa rūʾašu iprusu: separated son from father, father from son, daughter from mother, mother from daughter, daughter-in-law from mother-in-law and back, brother from brother, friend from friend"}
      - {motif: captive-kept-in-darkness-not-released, refs: ["GKAB P348618 o.i:19'-23'"], note: "ṣabta lā umaššiū kasâ lā urammû ša bīt ṣibitti lā ukallimū nūra / ana ṣabti ṣabassū-ma ana kasî kusīšu iqbû: did not release the captive, did not loosen the bound man, did not show light to the prisoner; said of the captive 'hold him!'"}
      - {motif: sufferer-confesses-unknown-sins, refs: ["GKAB P348618 o.i:24'-27'"], note: "ul īdi šērti ili ul īdi ennet ištar / ilī idâṣ ištar imtaši / ana ilīšu arnišu ana ištarīšu gillassu: he does not know the god's punishment, the goddess's sin; he slighted god, disregarded goddess"}
      - {motif: despised-father-and-mother-as-sin, refs: ["GKAB P348618 o.i:28'-31'"], note: "ana bīni dāṣāti ana ahi rabî zērāti / aba u umma imteš ana ahāti rabīti ugdallil: treachery to the son, hostility to the elder brother; he despised father and mother, sinned against the elder sister"}
      - {motif: just-weights-and-measures, refs: ["GKAB P348618 o.i:32'"], note: "ina ṣehherti ittadin ina rabīti imtahar: he gave with the small (measure), received with the large"}
    hints:
      - "Woe to those who call evil good and good evil: Isa 5:20; bribed judges: Exod 23:8, Deut 16:19, Isa 1:23, Mic 3:11; the widow's case: Exod 22:21-23, Isa 1:17,23, Deut 27:19."
      - "Son against father, daughter against mother, daughter-in-law against mother-in-law: Mic 7:6 (Matt 10:35-36); prisoners in darkness: Isa 42:7, Isa 61:1, Ps 107:10-14."
      - "Unequal measures: Deut 25:13-16, Lev 19:35-36, Amos 8:5, Prov 11:1, Q 83:1-3 (woe to those who give short measure); dishonoring parents: Exod 21:17, Deut 27:16; a catalogue of self-examination: Job 31, Ezek 18:5-18."
