units:
  - id: ane-gkab-p338349-o-ludlul-god-abandons
    tradition: ane-akkadian
    title: "Ludlul bēl nēmeqi I, Uruk copy (STT 1 32 obv.): the gods desert the sufferer, omens fail, the king's courtiers plot"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    version: "Standard Babylonian, Sultantepe copy (STT 1 32)"
    read: ["GKAB P338349 o"]
    tags:
      - {motif: personal-god-and-protective-spirits-desert-sufferer, refs: ["GKAB P338349 o:4'-9'"], note: "ištu ūma bēlu ... išbusu ... iddanni ilī ... ipparku ištarī ibēš ... isliṭ šēdu dumqi ... iprud lamassī-ma šanamma išeʾʾe: from the day the lord (Bēl/Marduk) grew angry my god threw me off, my goddess went away, my good šēdu split off, my lamassu took fright and seeks another"}
      - {motif: crown-stripped-from-head, refs: ["GKAB P338349 o:10'-11'"], note: "inneṭir baltī dūtī uttammil simtī ipparis tarāna išhiṭ: my dignity was taken, my virility veiled, my emblem cut off, my (protecting) roof torn away"}
      - {motif: omens-and-dreams-confused-for-sufferer, refs: ["GKAB P338349 o:12'-17'"], note: "iššaknānim-ma idāt pirittī ... dalhā têrētūa ... itti bārî u šāʾili alaktī ul parsat / ina pî sūqi lemun egirrûa / attīl-ma ina šāt mūši šuttī pardat: signs of terror, confused omens, the diviner and dream-asker cannot decide my way, the street's chance utterance is bad, my night dream frightening"}
      - {motif: king-turns-against-loyal-courtier, refs: ["GKAB P338349 o:18'-21'"], note: "šarru šīr ilī šamšu ša nišīšu libbuš ikkaṣir-ma: the king, flesh of the gods, sun of his people, his heart was knotted (against me); courtiers spread slander and gather in malice"}
      - {motif: seven-courtiers-conspire, refs: ["GKAB P338349 o:22'-28'"], note: "šumma ištēn-ma napištašu ušatbak ... šanû ... šalšu ... rebû ... hamšu ... šeššu u sebû ... ikṣurūnim-ma riksa sebet: the first, second ... seventh plotter each vows his share"}
      - {motif: speech-of-sufferer-muzzled, refs: ["GKAB P338349 o:29'-35'"], note: "ūmiš lā pādû utukkiš mašlu ... appatiš iteššûʾ ... hašikkiš ēme ... šaqummiš ipparšid: they are like a storm and an utukku-demon; my mouth is muzzled as with a bridle, I became like a deaf man and fled silently"}
    hints:
      - "God's anger and abandonment: Job 19:6-13, Job 30:20-21, Ps 22:2, Ps 88:15-19; omens and prophets fall silent: 1 Sam 28:6, Ezek 7:26, Lam 2:9."
      - "Seven plotters and the king turned against his servant: Ps 31:14, Ps 41:8-10, Ps 55:4-15, Dan 6:5-8 (courtiers plot against Daniel), Esth 3."
      - "Stripped of glory, crown taken: Job 19:9; struck dumb: Ps 38:14-15, Ps 39:3."
  - id: ane-gkab-p338349-r-ludlul-social-death
    tradition: ane-akkadian
    title: "Ludlul bēl nēmeqi I, Uruk copy (STT 1 32 rev.): the proud man brought low, shunned by kin, cursed by slaves, his goods shared out"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    version: "Standard Babylonian, Sultantepe copy (STT 1 32)"
    read: ["GKAB P338349 r"]
    tags:
      - {motif: proud-man-humbled-to-servility, refs: ["GKAB P338349 r:1-6"], note: "šaqâtu rēšāya iknuš qaqqariš ... ša etelliš attallaku halāla almad / šarrahākū-ma atūr ana rēši: my lofty head bowed to the ground; I who walked like a lord learned to slink; proud, I became a slave"}
      - {motif: alone-no-one-to-be-seen, refs: ["GKAB P338349 r:7"], note: "ana rapši kimāti ēteme ēdāniš: to a wide family I became a loner"}
      - {motif: pointed-at-in-the-street, refs: ["GKAB P338349 r:8-11"], note: "sūqa abâʾ-ma turruṣā ubānāti / irrub ēkalliš iṣṣapparā īnāti / ālī kī ayyābi nekelmânni"}
      - {motif: estranged-from-brothers, refs: ["GKAB P338349 r:12", "GKAB P338349 r:20"], note: "ana ahî ahi itūra ... ana lā šīrīšu iškunanni kimtī: my brother became a stranger; my family treated me as no flesh of theirs"}
      - {motif: friend-turns-false-to-sufferer, refs: ["GKAB P338349 r:13-16"], note: "ana lemni u gallê itūra ibrī ... tappê unaggaranni ... kinātī ... kakkē uwarrašū ... rūʾa ṭābi ukarraṣa napištī: my friend became an evil one and a gallû-demon, companion denounces me, colleague stains his weapons, good friend cuts short my life"}
      - {motif: slaves-curse-their-fallen-master, refs: ["GKAB P338349 r:17-18"], note: "šūpîš ina puhri īrurani ardī / amtīya ana pān ummāni ṭapilti iqbi"}
      - {motif: slanderer-prospers-sympathizer-dies, refs: ["GKAB P338349 r:21-25"], note: "ana qābi damiqtīya petâssu hašti / mutammû ṭapiltīya šakin ana rēši / dābib nulliātīya ilu rēṣūšu: for the one who spoke well of me a pit is opened; my slanderer is promoted, the god is his helper; the one who said 'enough!' death hastens"}
      - {motif: no-helper-at-side, refs: ["GKAB P338349 r:26"], note: "ul aršī ālik idī gāmila ul āmur"}
      - {motif: sufferers-goods-and-office-given-to-others, refs: ["GKAB P338349 r:27-32"], note: "ana ṣindi u birti uzzuʾuzū mimmûa / pî nārātīya umanṭiṭū sakīka ... parṣīya ušalqû šanâmma ... ahâ ušzizū: goods divided among the riffraff, canals silted, offices given to another, a stranger set up"}
      - {motif: house-of-sufferer-deathly-silent-family-scattered, refs: ["GKAB P338349 r:29-30"], note: "ina qerbetīya ušessû alāla / kī āl nakiri ušqammemu ālī: the work-song ceased in my fields, my town fell silent like an enemy town"}
    hints:
      - "Kin and friends estranged, servants despise him: Job 19:13-19 (my servant does not answer, I am a stranger to my brothers), Ps 31:12, Ps 38:12, Ps 41:10, Ps 55:13-15, Ps 88:9,19; Mic 7:5-6."
      - "Pointed at and mocked in the streets: Job 30:1-10, Ps 22:7-8, Ps 44:15, Lam 3:14; the proud brought low: Job 29-30 (former glory vs present), Isa 2:11-17."
      - "Goods given to strangers: Job 20:18, Ps 109:8-11 (let another take his office), Lam 5:2."
  - id: ane-gkab-p338356-poor-man-of-nippur
    tradition: ane-akkadian
    title: "The Poor Man of Nippur, Uruk fragment (STT 1 39+)"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    read: ["GKAB P338356"]
    tags:
      - {motif: ruler-asks-petitioner-his-wish, refs: ["GKAB P338356 o:6-8"], note: "izzimtu lukšud ... mana rušši hurāṣi ... izzimtaka mīnumma: 'let me attain my desire' ... a mina of red gold ... 'what is your desire?'"}
    hints:
      - "A ruler asking a poor petitioner 'what is your wish?': compare Esth 5:3,6 and 1 Kgs 3:5 (God to Solomon: ask what I shall give you); the poor man's revenge on the mayor: Eccl 9:14-16 (the poor wise man who saved the city)."
  - id: ane-gkab-p338358-gilgamesh-letter
    tradition: ane-akkadian
    title: "The Gilgameš Letter (STT 1 41): Gilgameš demands fabulous tribute for Enkidu's memorial and threatens the recipient's cities"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    version: "Neo-Assyrian school composition (Sultantepe)"
    read: ["GKAB P338358"]
    tags:
      - {motif: legendary-king-letter-demands-fabulous-tribute, refs: ["GKAB P338358 o:2'-17'"], note: "Enkidu ibrīya ... ašpurakkam-ma yānu ... ūmu ṭuppī šuāti tāmuru ... il-lat sisê šupur-ma: thousands of white horses with black girths, black horses with white girths, 100,000 she-asses, calves, mules, beer, butter, wine, tables of ebony, donkeys laden with juniper, iron, tin for Marduk's storehouse"}
      - {motif: statue-of-dead-friend-in-gold-and-lapis, refs: ["GKAB P338358 o:15'"], note: "1 šibirti hurāṣi huššî 30 mana lū šuqultašu ana irat Enkidu ibrīya lukīn ... yašpû uqnû ... takṣīrī ina muhhi lubanni: a block of red gold of 30 minas for the breast of Enkidu my friend, with jasper and lapis inlays"}
      - {motif: precious-boats-on-euphrates-to-babylon, refs: ["GKAB P338358 r:5-6"], note: "makkūrē eššūti kaspa hurāṣa mullâm-ma ... ana Purattu ... ana kār Bābili tabal-ma ilūya līmurū-ma libbī lihmū: fill new processional boats with silver and gold, bring them down the Euphrates to the quay of Babylon, that my gods may see and be stunned"}
      - {motif: oath-by-personal-god, refs: ["GKAB P338358 r:7-10"], note: "šumma ina Tašrīti ūmi 15 ina abulli ālīya Ur lā atmarūka / atma ilī rabûti ... atma ilūa Lugalbanda Sîn Šamaš Palil Lugalirra Meslamtaea Zababa u ilu bēl rēšīya: an oath by the great gods and by 'my god Lugalbanda' if the recipient fails to appear at the gate of Ur on 15 Tašrīt"}
      - {motif: letter-threatens-plunder-of-cities-and-gardens, refs: ["GKAB P338358 r:11-13"], note: "ašapparakkam-ma ālānīka imarraq ēkallātīka imaššaʾ kirâtīka ... ina pî nārātīka murdê urattâ ... Gilgameš ina libbi ušab: I will send and he will crush your cities, plunder your palaces, (cut) your gardens, drive gratings into the mouths of your rivers; Gilgameš will dwell inside"}
    hints:
      - "A boastful ultimatum letter demanding horses, silver and gold and threatening cities: compare 1 Kgs 20:2-6 (Ben-hadad's demand 'your silver and gold are mine'), 2 Kgs 18:19-35 / Isa 36 (Rabshakeh), 2 Kgs 19:10-14 (threatening letter)."
      - "Huge numbers of animals as tribute: 2 Kgs 3:4 (Mesha's 100,000 lambs), 1 Kgs 8:63, Ezra 2:66-67."
  - id: ane-gkab-p338359-gilgamesh-letter-duplicate
    tradition: ane-akkadian
    title: "The Gilgameš Letter, second copy (STT 1 42): Gilgameš 'creation of Anu' to a king of the lands"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    version: "Neo-Assyrian school composition (Sultantepe)"
    read: ["GKAB P338359"]
    tags:
      - {motif: legendary-king-letter-demands-fabulous-tribute, refs: ["GKAB P338359 o:1-24"], note: "the opening survives: ana [...] umma Gilgameš binût Anu ... šarrāni ... parakkī unaššaqū: 'to X, thus says Gilgameš, creation of Anu', before whose dais kings kiss (the ground); six hundred choice men sent; then the same list of horses, she-asses, calves, mules, butter and wine"}
      - {motif: king-of-the-four-quarters, refs: ["GKAB P338359 o:6"], note: "šarru ša ultu [ṣīt šamši adi] ereb šamši mātāti naphar-šina: a king (ruling) from sunrise to sunset over all the lands; partly restored"}
      - {motif: precious-boats-on-euphrates-to-babylon, refs: ["GKAB P338359 r:6-7"], note: "kaspim-ma hurāṣu ana Purattu neqelpâ ... lihmû"}
      - {motif: statue-of-dead-friend-in-gold-and-lapis, refs: ["GKAB P338359 o:23"], note: "Enkidu ibrīya lukīn ... ina muhhi lubanni"}
    hints:
      - "Letter formula 'to X, thus says Y': Ezra 4:11-17, Ezra 7:12; kings kiss the ground before the overlord: Ps 72:9-11, Isa 49:23."
  - id: ane-gkab-p338373-shuila-colophon
    tradition: ane-akkadian
    title: "Šuʾilas to Marduk and Nabû, Sultantepe copy (STT 1 55): only a colophon line survives"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    read: ["GKAB P338373"]
    tags:
      - {motif: scribal-colophon, refs: ["GKAB P338373 r:26"], note: "šamallû ṣehru: 'junior apprentice', the copyist's title in the colophon"}
  - id: ane-gkab-p338378-shuila-shamash
    tradition: ane-akkadian
    title: "Šuʾila to Šamaš 1, Sultantepe copy (STT 1 60+): 'O supreme, perfect one, heir of Namraṣit'"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    version: Standard Babylonian
    read: ["GKAB P338378"]
    tags:
      - {motif: sun-god-judge-of-gods, refs: ["GKAB P338378 o:3", "GKAB P338378 o:16"], note: "Šamaš muštēšir mīti u balṭi bārû kal mimma šumšu ... dayyān ilī bēl Igigi"}
      - {motif: deity-as-torch-of-heaven-and-earth, refs: ["GKAB P338378 o:2", "GKAB P338378 o:4"], note: "nūru eddēšû pētû pān nišī mukallim nūri ... nūr ilī šarūr mātāti: the ever self-renewing light"}
      - {motif: black-headed-people, refs: ["GKAB P338378 o:9"], note: "ilu u šarru nišū ṣalmat qaqqadi idallalā qurdīka"}
      - {motif: god-gives-lonely-friend-impotent-heir-blind-light, refs: ["GKAB P338378 o:10-13"], note: "eṭla ēda tappâ tušarši / ana lā išari tanamdin apla / edlūti sikkūr šamê tupatti / ana lā nāṭili tašakkan nūra"}
      - {motif: sun-god-reads-sealed-tablet-writes-omen-in-sheep, refs: ["GKAB P338378 o:14-15"], note: "ṭuppi armu lā petâ tašassi / ina libbi immeri tašaṭṭar šīrī"}
      - {motif: bad-dream-made-favourable, refs: ["GKAB P338378 r:3-9"], note: "šīmtī šīm alaktī dummiq / līširā ittātūa / lidmiqā šunātūa / šutta anaṭṭalu ana damiqti terri"}
      - {motif: justice-at-right-hand-favour-at-left, refs: ["GKAB P338378 r:14-15"], note: "Kittu lizziz ina imittīya Mīšaru izziz ina šumēlīya / littallak ilu mušallimu ina idīya: Truth at my right, Justice at my left, a safe-keeping god at my side"}
      - {motif: gods-vizier-and-consort-intercede, refs: ["GKAB P338378 r:16"], note: "litammûka Bunene sukkallu awat damiqti: only Bunene the vizier is named here"}
      - {motif: heaven-and-deep-rejoice-over-deity, refs: ["GKAB P338378 r:19-20"], note: "šamû lihdûka erṣetu lirīška ... Anu Ellil Ea lišarbû"}
      - {motif: lifted-hand-prayer-with-ritual-rubric, refs: ["GKAB P338378 r:21"], note: "KA.INIM.MA ŠU.IL₂.LA₂ {d}UTU-KAM"}
    hints:
      - "God sets the lonely in a home, gives children to the barren, opens eyes of the blind, frees captives: Ps 68:7, Ps 113:9, Ps 146:7-8, Isa 42:7; opening the bolts/windows of heaven: Gen 7:11, Mal 3:10."
      - "Sun of righteousness / God who sees all: Mal 3:20, Ps 19:5-7, Ps 33:13-15; righteousness and justice personified at God's side: Ps 85:11-14, Ps 89:15."
  - id: ane-gkab-p338379-shuila-shamash-aplutu
    tradition: ane-akkadian
    title: "Šuʾila to Šamaš 1, second Sultantepe copy (STT 1 61) with the user Aplūtu and an insertion against evil portents"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    version: Standard Babylonian
    read: ["GKAB P338379"]
    tags:
      - {motif: god-gives-lonely-friend-impotent-heir-blind-light, refs: ["GKAB P338379 o:10-13"]}
      - {motif: sun-god-reads-sealed-tablet-writes-omen-in-sheep, refs: ["GKAB P338379 o:14-15"], note: "adds ta-ša₂-kan di-na: 'you give the verdict'"}
      - {motif: suppliant-introduces-himself-so-and-so-son-of, refs: ["GKAB P338379 o:19-20"], note: "[anāku] Aplūtu mār ilīšu ... Sîn ... ištarīšu Ningal: the petitioner names himself and his personal deities"}
      - {motif: evil-portent-turned-to-good, refs: ["GKAB P338379 o:22-28"], note: "ina lumun mimma huṣāb narkabtīya ša iššebru / ina lumun kulbābī sāmūti ša ina bītīya innamru ... palhāku adrāku ... šīmtu šīm ... līšera: the evil of a broken chariot peg and of red ants seen in my house"}
      - {motif: bad-dream-made-favourable, refs: ["GKAB P338379 r:1-4"]}
      - {motif: justice-at-right-hand-favour-at-left, refs: ["GKAB P338379 r:9-11"]}
    hints:
      - "Ominous insects or vermin in the house: compare Exod 8 (frogs, lice in houses) and Lev 14:34-45 (affliction in a house); fear of portents: Jer 10:2."
  - id: ane-gkab-p338385-shuila-ea
    tradition: ane-akkadian
    title: "Šuʾila to Ea (STT 1 67): 'King of wisdom, creator of understanding', prayer of Banītu-ēreš against evil portents"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    version: Standard Babylonian
    read: ["GKAB P338385"]
    tags:
      - {motif: divine-epithet-cluster, refs: ["GKAB P338385 o:1-5"], note: "šar nēmeqi bānû tašīmti massû ṣīru ... Ellilbanda itpēšu karūbu uršān Eridu apkal Igigi bēl bīt Engurra"}
      - {motif: god-brings-flood-and-abundance-to-rivers, refs: ["GKAB P338385 o:6-8"], note: "bābil mīli hegalli murīš nārāti / ina tâmti u ṣuṣê tudeššī nuhša / ina qerbeti tušabši napišti nišī: bearer of the flood and of plenty, who makes abundance sprout in sea and reed-thicket and life for the people in the fields"}
      - {motif: god-gives-counsel-to-great-gods, refs: ["GKAB P338385 o:9-12"], note: "Anu Ellil hadîš rīšūka ... ana ilī rabûti tadin milka"}
      - {motif: incantation-of-life-keeps-dead-from-dying, refs: ["GKAB P338385 o:13"], note: "Ea ina têka ša balāṭi lā imât mītu: by your incantation of life the dead man does not die"}
      - {motif: suppliant-introduces-himself-so-and-so-son-of, refs: ["GKAB P338385 o:14-15"], note: "anāku Banītu-ēreš mār ilīšu"}
      - {motif: evil-portent-turned-to-good, refs: ["GKAB P338385 o:16-21"], note: "ina lumun idāti ittāti lemnēti lā ṭābāti ša ina bītīya ibbašâ palhākū-ma adrāku šutadurāku"}
      - {motif: god-takes-sufferer-by-hand-and-lifts-head, refs: ["GKAB P338385 o:19"], note: "ullî rēšīya ibi šumī: lift my head, call my name"}
      - {motif: heaven-and-deep-rejoice-over-deity, refs: ["GKAB P338385 r:10-12"], note: "šamû lihdûka apsû lirīška"}
    hints:
      - "God who gives wisdom and understanding: Prov 2:6, Dan 2:20-21, Job 12:13; lifter of my head: Ps 3:4, Ps 27:6; called by name: Isa 43:1."
      - "God who makes rivers and the deep yield plenty: Ps 65:10-14, Ps 104:10-16, Gen 49:25 (blessings of the deep)."
  - id: ane-gkab-p338401-shurpu-4-colophon
    tradition: ane-akkadian
    title: "Šurpu IV, Sultantepe copy (STT 1 84): a royal titulary line of the colophon"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    read: ["GKAB P338401"]
    tags:
      - {motif: scribal-colophon, refs: ["GKAB P338401 r:44"], note: "šarru rabû šarru dannu šar kiššati šar [...]: 'great king, mighty king, king of the world', the titulary of the royal owner in a library colophon"}
  - id: ane-gkab-p338429-dream-ritual-lump-of-earth
    tradition: ane-akkadian
    title: "Dream rituals (STT 1 107+): prayer to Ea against a frightening dream, told to a lump of earth dissolved in water"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    read: ["GKAB P338429"]
    tags:
      - {motif: divine-epithet-cluster, refs: ["GKAB P338429 o:4'-5'"], note: "Ea ... šamê u erṣeti bānû muṣṣiru usāti pāris purussê ša ilī: creator of heaven and earth, decider of the gods' decisions"}
      - {motif: god-dispels-evil-dreams-and-portents, refs: ["GKAB P338429 o:6'-7'", "GKAB P338429 r:4-6"], note: "šutta āmuru palhāku adrākū-ma šutadurāku ... MAŠ₂.GE₆ HUL BUR₂: a ritual 'to release an evil dream'"}
      - {motif: dream-transferred-to-clod-dissolved-in-water, refs: ["GKAB P338429 r:1-3"], note: "ina pānīka ana mê addû ina mê lippasis u lihharmiṭ ... kirbanni bal[ti] leqe šipta ... ana muhhi tamannu ina mê tanaddi: tell the dream to a clod (kirbānu) from the rubbish tip, throw it in water, 'may it be erased and dissolve'"}
    hints:
      - "Troubling dreams and their resolution: Gen 41:8, Dan 2:1-3, Job 7:14; evil cast into the waters: Mic 7:19 ('cast all their sins into the depths of the sea'), Exod 15:5."
  - id: ane-gkab-p338442-shuila-shamash-fragment
    tradition: ane-akkadian
    title: "Šuʾila to Šamaš 1, small copy (STT 2 122)"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    version: Standard Babylonian
    read: ["GKAB P338442"]
    tags:
      - {motif: deity-as-torch-of-heaven-and-earth, refs: ["GKAB P338442 o:2'", "GKAB P338442 o:5'"], note: "nūru eddeššû ... Šamaš nūr šamê u erṣeti"}
      - {motif: sun-god-judge-of-gods, refs: ["GKAB P338442 o:3'-4'"], note: "Šamaš muštēšir [mīti] u [balṭi] bār kal mimma"}
  - id: ane-gkab-p338452-shuila-marduk
    tradition: ane-akkadian
    title: "Šuʾila to Marduk (STT 2 132): fragment with Zarpānītu's intercession and the libation rubric"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    read: ["GKAB P338452"]
    tags:
      - {motif: gods-vizier-and-consort-intercede, refs: ["GKAB P338452 b.e:2"], note: "Zarpānītu ina qātīya: the god's consort is asked to take the petitioner's hand"}
