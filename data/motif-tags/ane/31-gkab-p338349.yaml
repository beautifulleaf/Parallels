      - {motif: tablet-of-guilt-broken, refs: ["GKAB P348617 o.ii:10-12"], note: "rubû ... uštahhat-ma kīam iqabbi: lū hepû ṭuppi arnīya lū puṭṭurū lumnūa / lū parsā lū purrusā lū purrurā gillātūa: the prince washes and says: may the tablet of my guilt be broken, my evils released, my sins cut off, kept away, scattered"}
      - {motif: ritual-washing-transfers-all-evils, refs: ["GKAB P348617 o.ii:10", "GKAB P348617 o.ii:18-19", "GKAB P348617 o.ii:30", "GKAB P348617 o.ii:44"], note: "uštahhat ... lū šahṭū lū šuhhuṭū lemnētūa ... lū ellēkū-ma: may my evils be stripped off ... may I be pure before Šamaš; he washes them off onto the enemy land (ana māt nukurti ezēbu)"}
