      - {motif: bound-sheep-released-as-guilt-released, refs: ["GKAB P348617 o.ii:31-33"], note: "Šamaš apaṭṭar immera kasâ mahrīka kīma anāku immera annâ apaṭṭaru arnu šērtu gillatu u hiṭītu lemuttu ša ina zumrīya ina pān ilūtika lippaṭrā: as I untie this bound sheep before you, may guilt, sin and evil in my body be released"}
      - {motif: substitute-figurine-bears-sin, refs: ["GKAB P348617 o.ii:37-38"], note: "ina bīt rimki ṣalam nigsagilê ša qēmi ... tuṣṣar-ma šarru ina muhhi šukbusi izzaz: in the bath-house a substitute figure of flour is drawn; the king stands on the ramp"}
