      - {motif: living-puppy-waved-carries-evil-away, refs: ["CTH 398 §21:153-154"], note: "the puppy waved over king and queen and then cut up (restored [arḫa kuranzi])"}
      - {motif: patients-pass-through-ritual-gates, refs: ["CTH 398 §23:166-172", "CTH 398 §25:179-184"], note: "3 KÁ.GAL-TIM, one of hawthorn (GIŠḫattalkiššana-), fire kindled (restored); EGIR-pa=ma=z=kan UL uwanzi 'they do not come back'; the Old Woman runs last"}
      - {motif: tallow-dog-guards-door-at-night, refs: ["CTH 398 §24:174-177"]}
