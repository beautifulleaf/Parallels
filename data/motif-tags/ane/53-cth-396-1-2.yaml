# Full read, chunk 53: Hittite rituals CTH 396-413, read from hethiter.net / TLHdig editions.
new_motifs:
  offering-set-before-the-deity: {label: "The ritual practitioner sets bread, meat or drink 'before the deity' (PANI DINGIR-LIM tehhi) and the participants eat and drink", cluster: cult}
  drinking-the-god-seated-or-standing: {label: "The participants 'drink' a deity a set number of times, standing or sitting, as a ritual act of communion", cluster: cult}
  ritual-remains-thrown-into-river: {label: "The ritual materials that carry the evil are thrown into a river to be carried away", cluster: purification}
  practitioner-introduces-self-um-ma: {label: "A ritual opens 'Thus (says) N., the Old Woman / augur / man of town X', naming the practitioner who speaks the rite in the first person", cluster: cult}
  bewitched-person-released-loosed: {label: "The practitioner 'releases' or 'loosens back' (EGIR-pa la-) a bewitched person from sorcery", cluster: magic}
  dough-figures-set-on-shoulders: {label: "Figures made of barley dough mixed with dog dung, herbs and plants are placed on the patient's right and left shoulders and the dough is pressed against him", cluster: magic}
  dog-dung-in-healing-dough: {label: "Dog excrement is kneaded into the dough used to treat a bewitched person, and the dog's smell is then driven from him", cluster: magic}
  fire-in-head-quenched-and-sent-to-sorcerer: {label: "The practitioner quenches the fire in the patient's head and makes it burn in the head of the sorcerer instead", cluster: magic}
  sorcery-thrown-back-on-sorcerer: {label: "The practitioner takes the sorcery off the patient and throws or gives it back to the sorcerer or its 'owner', who is to carry it", cluster: magic}
  analogic-spell-evil-vanish-like-substance: {label: "Analogic spell: as this substance (seed, water, soap, clay, wool, dough) is treated or acts, so may the evil, impurity or sorcery be treated", cluster: magic}
  bird-omen-evil-quenched-in-roasted-seeds: {label: "Clay models of ominous birds are sealed in oil bowls and seeds are roasted and quenched with water, so that the evil birds and evil words 'go out' like the seeds", cluster: divination}
  heralds-of-the-gods-expel-evil: {label: "The gods send their heralds (staff-bearers, LÚ.MEŠ GIŠ.GIDRU) from heaven to thrust the evil matter out of the palace, if need be with a copper spear", cluster: purification}
  tallow-dog-guards-door-at-night: {label: "A puppy of tallow is set on the door bolt and told, as the royal table-dog, not to let the evil matter into the palace by night", cluster: magic}
  red-and-white-cord-tied-and-cut: {label: "A cord or red wool is tied to the patients' hands, feet, waist and neck and to the corners, threshold and bolt of the house, and then cut off and laid in a basket", cluster: magic}
  soap-cleans-as-it-whitens-linen: {label: "Analogic spell: as soapwort cleans dirty linen and makes it white, so may it clean the bodies of the king, queen and princes and the palace", cluster: purification}
  river-clay-returns-evil-to-riverbank: {label: "A ball of riverbank clay that has 'overcome' the evil is to carry it back to the riverbank and the dark earth is to overcome it", cluster: purification}
  living-puppy-waved-carries-evil-away: {label: "A living puppy is waved over the patients and through the house and told to carry the evil away, 'as a donkey, the carrier', to the place the gods appointed", cluster: purification}
  evil-goes-where-gods-appointed: {label: "The evil is to go to the place the gods have determined for it (kuwapi DINGIR.MEŠ lamniyan harkanzi)", cluster: purification}
  ritual-materials-waved-over-patient: {label: "Ritual materials (seeds, breads, cords, an animal) are waved (wahnu-) over the patient and through the house to absorb the evil", cluster: purification}
  evil-given-to-horses-and-dogs-as-fodder: {label: "The evil, carried in ritual materials, is given to horses as fodder and to dogs as a morsel", cluster: magic}
  patients-pass-through-ritual-gates: {label: "Gates of hawthorn or wood are set up with fire beside them and the patients pass through them without turning back, leaving the evil behind", cluster: purification}
  augury-bird-signals-success-of-rite: {label: "The augur watches the flight of birds from the favourable side to know whether the rite has succeeded and asks for favourable birds", cluster: divination}
  defilement-of-house-by-bloodshed: {label: "A ritual is prescribed when bloodshed or some impurity occurs inside a person's house; one and the same rite serves for every impurity", cluster: purification}
  materials-list-of-ritual: {label: "A ritual begins with a long inventory of the materials needed: garments, coloured wools, vessels, metal pegs, animals, breads, honey, oil", cluster: cult}
  coloured-hides-before-hearth-and-throne: {label: "A white ox-hide is laid before the hearth and a red one before the throne in a purification of the house", cluster: purification}
  city-purified-of-blood-oath-and-tongue: {label: "A whole city is ritually treated for bloodshed (eshar), perjury (lingai-) and 'the tongue of the multitude' (pangawaš EME, public curse)", cluster: purification}
  ritualist-asks-why-have-i-come: {label: "The ritualist asks the riverbank, the springs or the mountains 'Why have I come? Why did I toil?' and explains that a human being has been thrown behind the fence like an ox", cluster: purification}
  human-thrown-behind-fence-like-ox: {label: "A human child has been thrown behind the fence of the pen like an ox (image of one caught by guilt or curse)", cluster: purification}
  waters-and-mountains-answer-fear-not-we-help: {label: "The springs, the sea or the mountains answer the ritualist: 'Do not fear, we will stand by you'", cluster: purification}
  frog-swallows-impurity-to-sea: {label: "A frog takes the impurity in its mouth and swallows it, takes it from the valleys to the river, and the river carries it to the sea", cluster: purification}
  primeval-gods-receive-impurity: {label: "The ancient (primeval) gods are given the bloodshed, perjury and curse and are to take it down into the dark earth and judge the case", cluster: underworld}
  goat-burned-bird-buried-evil-descends: {label: "A goat is burned and a bird (šurašura) buried, so that as they went down into the dark earth the disease, blood, perjury and curse go down likewise", cluster: purification}
  eagle-and-falcon-set-free-carry-evil: {label: "An eagle and a falcon are waved and then released, the eagle to carry the evil up to heaven and the falcon to the pure mountains", cluster: purification}
  water-poured-from-channel-perishes: {label: "Water poured into and out of a channel is said to perish and not return to its spring, so may bloodshed, oath and the tongue of the multitude perish", cluster: purification}
  carriers-led-to-execution-gate: {label: "The ritual animals are led through the city out of the gates by which people are taken down to be killed, to the place where people died", cluster: purification}
  cry-of-the-wronged-reaches-gods: {label: "If a mountain man or steppe dweller (a victim) cried out in pain to the gods of heaven, the gods of heaven and earth are to hand the case over to the dark earth", cluster: justice}
  clay-tongue-made-for-slander-rite: {label: "A tongue (EME) is made of clay or wax as the object of a rite against the evil tongue or slander", cluster: magic}
  practitioner-colours-red-white-black: {label: "The practitioner says 'I make (it) blood-red again and again, white again and again, black again and again'", cluster: magic}
  bewitched-in-tents-burned: {label: "Seven kippa-tents are let down over a man and woman with torches at their heads and are burned; the bewitched man is called by his name", cluster: purification}
  stones-thrown-after-departing-evil: {label: "Stones are thrown and weapons and shields brandished after those who carried out the evil, with the cry 'Go, you bewitched people!'", cluster: purification}
  sorcerer-figurines-with-tongues: {label: "Clay figurines of the sorcerers, male and female, are made with tongues inside them, a clay basket full of tongues and a clay donkey to carry it", cluster: magic}
  sorcerer-to-wear-sorcery-as-clothing: {label: "May the sorcery be the sorceress's headdress, her belt and her shoes: may she put them on and take back what she did", cluster: magic}
  sun-of-the-hand-sees-sorcerers: {label: "The 'Sun god of the hand' (kiššeraš UTU) is called to see the sorcerers and to recognise whether a man or a woman did the bewitching", cluster: magic}
  coloured-threads-take-off-colours-of-sickness: {label: "Threads of black, red, yellow-green, blue and white wool take off the patient the blackness, redness, yellowness, 'blue day' and binding of sorcery and are wound round the figurines", cluster: magic}
  white-wool-pacifies-and-purifies: {label: "Analogic spell: as white wool appeases fierce hostility, so may it purify the sorcery and impurity and make the person pure before all", cluster: purification}
  evil-buried-in-pit-pegged-down: {label: "The ritual remains carrying the evil are buried in a pit, covered, levelled and pinned down with pegs, and the dark earth is to hold them so that they never come up again", cluster: purification}
  gods-of-roads-hold-evil: {label: "Bread is broken at the right and left of the road and at the crossroads for the gods of the roads, who are to take the evil and not let it come back", cluster: purification}
  hunter-carries-away-sorcery: {label: "A hunter figure with bow, arrows and four dogs is to put on, take up and carry away the sorcery, raking and shovelling it up", cluster: magic}
  patient-bathed-tongue-removed: {label: "The patient is bathed (in grain, then in water) in an ablution house and the practitioner says she has removed the evil tongue, defeat and sorcery", cluster: purification}
  sacral-meal-after-purification: {label: "After the purification an animal is sacrificed to the sun god or river deities, its organs cooked and eaten by the participants", cluster: cult}
  offerings-to-river-deities-at-night: {label: "The practitioner goes down to the river, spends the night there and breaks bread and sacrifices a sheep to the mother goddess of the riverbank and the river spirits", cluster: cult}
  feast-with-cheese-and-fig-bread: {label: "Thick breads of flour, cheese and figs are offered and shared in the rite", cluster: cult}
  sacrificial-meat-carried-to-deity: {label: "The trimmed meat of the victim is brought up and carried to the deity", cluster: cult}
  practitioner-addresses-demon-here-is-yours: {label: "The practitioner addresses a deity or demon by name: 'See, (this is) for you'", cluster: magic}
  ritual-communal-eating: {label: "The participants say 'we eat, we drink' as part of the rite", cluster: cult}
  demons-driven-from-head: {label: "Named evil powers are removed and driven out of the patient's head", cluster: magic}
  night-rite-repeated-eight-times: {label: "An act of the rite is done at night eight times", cluster: cult}
  counter-spell-against-evil-speech: {label: "When an evil person has 'spoken against' (bewitched by speech) someone, the practitioner 'speaks him back' with a counter-incantation", cluster: magic}
  tallow-donkey-sealed-in-oil-bowl: {label: "A donkey of tallow is laid in an oil bowl and the bowl is closed over it", cluster: magic}
  old-woman-practitioner: {label: "The 'Old Woman' (MUNUS ŠU.GI), a female ritual expert, performs and speaks the rite", cluster: magic}
  breads-placed-under-royal-bed: {label: "Breads or ritual objects are put in a basket under the patients' (king and queen's) bed overnight", cluster: magic}
  four-corners-of-house-treated: {label: "The four corners of the house, the threshold and the door bolt are treated one by one in the purification", cluster: purification}
  evil-seen-by-gods-in-house: {label: "The gods see an unlucky matter lurking in the house which neither the house nor the human can overcome", cluster: purification}
  grain-keeps-alive-analogy: {label: "Analogic spell: as grain keeps mankind, cattle, sheep and every beast alive, so may it keep the patients alive apart from the evil", cluster: magic}
  ritual-remains-dumped-in-open-country: {label: "The ritual remains that have absorbed the evil are carried out of the house and poured away in the open country", cluster: purification}
  seven-gods-step-from-path: {label: "The Seven gods (Sebettu) are asked to step aside from the deity's road", cluster: magic}
  clay-head-buried-in-earth: {label: "The earth is dug up and a head of clay is placed in it", cluster: magic}
  evil-nailed-down-with-pegs: {label: "The evil (or its carrier) is to be nailed down with pegs, foot and head", cluster: magic}
  offering-on-foliage-right-and-left: {label: "Breads and cups are laid out on foliage to the right and to the left for the deity", cluster: cult}
  goat-cut-up-for-the-deity: {label: "A he-goat is placed on foliage and cut up, its parts set over the fire for the deity", cluster: cult}
  gods-have-released-me: {label: "The patient declares 'Now the gods have set me free' and asks them not to let the evil loose on him again", cluster: purification}
  ritual-washing-in-river: {label: "The patients wash in the river and the practitioner washes his hands at the end of the rite", cluster: purification}
  prayer-to-sun-god-at-rite-end: {label: "At the end of the rite bread is offered to the Sun god on a stone and he is told that the evil has been removed", cluster: cult}
  puppies-among-ritual-victims: {label: "Puppies are listed among the animals required for a purification", cluster: purification}
  ritual-cry-he-he: {label: "The participants repeatedly shout a ritual cry ('ui ui', 'he he')", cluster: cult}
  hoe-and-spade-of-bronze-dig-clay: {label: "A bronze hoe and spade are prepared to dig clay at the riverbank where the potters take it", cluster: purification}
  clay-offered-to-underground-watercourses: {label: "Clay dug from the riverbank is addressed and given to the underground watercourses", cluster: purification}
  clay-smeared-with-oil-and-honey: {label: "The ritual clay is smeared with oil and honey and a libation is poured", cluster: cult}
  lawsuit-of-blood-before-gods: {label: "Bloodshed, perjury and curse are treated as a lawsuit (hanneššar) that the gods are asked to judge", cluster: justice}
  evil-sat-on-roof-of-palace-and-temple: {label: "The evil (disease, blood, oath) is told that it has sat on the roof of the palace or of the temple and must now purify them", cluster: purification}
  bird-sent-off-with-disease-and-blood: {label: "A bird (šurašura) is told to go wherever the disease, blood and gods' oath go", cluster: purification}
  friend-hides-gods-from-companion: {label: "A friend throws a garment over his companion and hides the gods from him (cuts him off from divine favour)", cluster: magic}
  tongue-of-the-land: {label: "The 'tongue of the land' or 'of the multitude' (public slander or curse) is named as the evil to be removed", cluster: magic}
  evil-strikes-itself-tree-and-buck: {label: "Obscure mountains' saying: the tree's own crown splits it, its own miya- binds it, the buck is struck by its own; the evil destroys itself", cluster: magic}
  patient-called-by-name: {label: "The practitioner calls the patient (ritual patron) by his name during the rite", cluster: magic}
  roads-addressed-to-carry-off-evil: {label: "The roads are addressed and asked to drive away the gods' oath, the tongue, blood and tears", cluster: purification}
  king-purified-of-oath-tongue-tears: {label: "The king is purified of oath, the tongue of the multitude and tears", cluster: purification}
  causes-of-impurity-fat-or-bloody-mouth: {label: "Possible causes of impurity are named: a man ate fat or his mouth was bloodied", cluster: purification}
  bird-carried-back-to-mountains: {label: "A bird used in the rite is carried back to the mountains", cluster: purification}
  offerings-of-every-seed-and-fruit: {label: "A little of every fruit, seed, malt, wax, fat and porridge is poured out before the gods", cluster: cult}
  bird-sacrificed-to-ancient-gods: {label: "A bird is offered to the ancient (primeval) gods", cluster: cult}
  plague-removed-from-city-by-rite: {label: "A rite asks that disease and plague (death) leave a city and become well", cluster: purification}
  king-named-in-plague-rite: {label: "A named king (Muršili) and the princes of Hatti appear in a rite against plague", cluster: kingship}
  deity-asked-for-mildness: {label: "The deity is asked to show mildness (genzu)", cluster: prayer}
  woodpiles-and-pegs-at-city-gate: {label: "At the great city gate woodpiles and pegs are set up on either side and objects buried under the threshold", cluster: purification}
  other-city-treated-as-enemy: {label: "Another city is treated as an enemy so that the evil may be sent there", cluster: purification}
  nine-breads-offered: {label: "Nine thick breads are presented in the rite", cluster: cult}
  patient-seated-facing-sun-god: {label: "The bewitched person is seated facing the Sun god while the practitioner works", cluster: magic}
  figurines-speak-humans-weary: {label: "Dialogue in the rite: the mortal says 'we are tired, we dare no more, take it back' and the figurines answer 'bring it, we will carry it off'", cluster: magic}
  wool-binds-sorcery-off-limbs: {label: "Whoever 'bound' the patient by sorcery, the practitioner takes it from all his limbs", cluster: magic}
  drunkenness-of-sorcery-removed: {label: "The drunkenness caused by sorcery is taken off the patient and the sorcerer made drunk through the figurines", cluster: magic}
  harm-done-before-gods-or-men: {label: "Whether someone harmed the patient before the gods or before mortals, the harm is to be removed", cluster: magic}
  bad-dreams-buried-with-sorcery: {label: "Bad dreams are fixed in the earth together with the sorcery", cluster: magic}
  bread-broken-for-dark-earth-and-sun: {label: "Flat breads are broken beside the pit for the dark earth, the Sun and other deities, who are to keep the evil fixed", cluster: cult}
  gate-gods-asked-to-speak-good: {label: "The gods of the city gate are asked to speak good things", cluster: cult}
  jug-broken-at-end-of-rite: {label: "A jug is broken at the end of a stage of the rite", cluster: magic}
  evil-removed-from-head-and-bed: {label: "The evils are to be lifted off the patient, off his head and off his bed", cluster: magic}
  dust-and-dough-cleanse-and-heal-analogy: {label: "Analogic spell: as this dust cleans and this dough heals, so may they clean and heal the person, his house, altar, hearth, spouse and children", cluster: purification}
  five-cups-of-liquids: {label: "Five clay cups are filled with five different liquids for the patient's purification", cluster: purification}
  gods-asked-not-to-let-evil-back-in: {label: "The gods are asked to protect the purified person and not let the evil back into him", cluster: purification}
  blessing-surrounded-by-descendants: {label: "Blessing: may the gods keep the person alive, surrounded by children, grandchildren and descendants", cluster: blessing}
  as-ewe-recognises-lamb-god-recognise-king: {label: "Analogic prayer: as the ewe recognises her lamb, the cow her calf and father and mother their sons, so may the god recognise (keep favour with) the king, queen and princes", cluster: prayer}
  black-sheep-burned-whole-with-honey-and-oil: {label: "The black substitute sheep, after the patients have spat into its mouth, is slaughtered, dismembered and burned whole on a hearth with honey and olive oil poured over it", cluster: purification}
  brick-and-clay-objects-in-inner-room: {label: "A mud brick is laid in the inner room and clay objects and vessels of fat and salt with clay lids are set on it to invoke an angry goddess", cluster: cult}
  cheese-pleasant-so-may-king-be: {label: "Analogic spell: as this cheese (food and drink) is pleasant, so may it be pleasant for the king and queen", cluster: magic}
  clay-cumin-dough-never-return-analogy: {label: "Analogic spell: as this clay will not return to the riverbank, black cumin will not turn white nor become another seed, and this dough will not go into the gods' bread, so may the evil tongue not go into the patients' bodies", cluster: magic}
  clay-tongues-nailed-down-by-sun: {label: "Seven tongues of clay are fixed into the ground and the practitioner declares that father Sun has nailed down the tongues of the day of quarrel (on Mount Amanakkipalu)", cluster: magic}
  curses-turned-to-the-left-by-sun: {label: "Wax tongues, salt, fat and coriander are waved over the patients and turned with the left hand: may the Sun turn the curses and tongues to the left", cluster: magic}
  deity-anger-caused-by-human-deed: {label: "The deity is said to be angry because of something a human did against her", cluster: prayer}
  deity-asked-to-turn-to-king-and-queen: {label: "The deity is asked to turn (her face) towards the king and queen", cluster: prayer}
  deity-drinks-to-satiety: {label: "The deity is said to drink her fill (niku-) at the offering", cluster: cult}
  evil-thrown-into-hearth-fire: {label: "Each object that has absorbed the curses (cut wool, fish, wool in fat, wax and clay tongues, dough) is thrown into the hearth fire", cluster: purification}
  fish-separated-from-sea-analogy: {label: "A fish, 'the bull of the sea', is waved over the quarrelling pair: as it was cut off from the sea, so may the tongues and curses be cut off", cluster: magic}
  god-image-turned-toward-king: {label: "The god's image is turned with its eyes toward the king, queen and princes", cluster: cult}
  goddess-vessel-releases-and-hides-evil: {label: "A clay vessel of Šaušga with oil, wool and barley is held under the patients' garment: may it release them to wellbeing and life and hide the evil away in an evil thing", cluster: magic}
  gods-offered-to-in-turn: {label: "The gods are given offerings one after another in turn (irḫa-)", cluster: cult}
  hands-and-tongues-of-dough: {label: "Hands and tongues of dough are set on the heads of the quarrelling parties and then broken and waved over them", cluster: magic}
  huwasi-stones-fall-so-evil-words-fall: {label: "Seven standing stones (huwaši) are set between two fires and kicked over: as these stones fall, so may the words of mouth and tongue that came on the patients fall", cluster: magic}
  lord-of-the-god-takes-offerings: {label: "At the end of the rite the 'lord of the deity' or the officiant takes what lies before the deity and returns it to the temple", cluster: cult}
  mother-goddess-withdraws-to-riverbank: {label: "The angry mother goddess (Ḫannaḫanna) has gone back to the riverbank taking the fertility of her womb with her, and is asked why", cluster: myth}
  nakkussi-carrier-sheep-not-killed: {label: "A sheep is declared the patients' nakkušši (carrier of evil) with mouth and tongue, presented to the Sun, but not killed: the Old Woman takes it for herself", cluster: purification}
  patient-wiped-with-sun-plant: {label: "The patients' bodies are wiped with a 'plant of the Sun' named tiwariya, wiping off the evil words of mouth and tongue", cluster: purification}
  patients-cast-off-fine-garments: {label: "After passing through the fire the patients throw off their fine garments and the Old Woman takes them", cluster: purification}
  patients-lay-hand-on-offering: {label: "The patients place their hand on the bread, cheese and wine before the Old Woman breaks and offers it", cluster: cult}
  patients-pass-between-fires: {label: "Fires are lit to right and left and the patients pass through the middle of the fire", cluster: purification}
  patients-spit-curses-into-victims-mouth: {label: "The patients spit into the mouth of the substitute animal: 'you have spat out the evil curses'", cluster: purification}
  piglet-will-not-see-sky-so-curses-not-see-patients: {label: "A piglet fattened on grass and grain is waved, killed and buried: as it will not see the sky or the other piglets again, so may the evil curses not see the patients again", cluster: magic}
  ritual-for-quarrelling-kin: {label: "A ritual is prescribed when father and son, husband and wife, or brother and sister quarrel, treating them together", cluster: purification}
  salamander-carries-off-evil-tongue: {label: "A salamander wrapped in blue and red wool is waved over the patients: may its swift foot carry off the evil tongue on its back and with its teeth", cluster: magic}
  seven-copper-nails-fix-evil-in-ground: {label: "Seven copper (or bronze) nails are driven into the ground: may the evil be nailed down with its mouth and tongue, with the Sun's help", cluster: magic}
  seven-vessels-emptied-into-fire-and-broken: {label: "Seven vessels filled with wine, oil, honey, fruit, sinew, salt and fat are emptied one by one into the hearth and broken: may it break with mouth and tongue", cluster: magic}
  substitute-animal-tarpalli: {label: "An animal (sheep, black sheep, puppy) is held over the patients and declared their substitute (tarpalli-) for their heads and whole persons", cluster: purification}
  substitute-slaughtered-into-pit: {label: "The substitute animal is slaughtered down into a dug pit, laid in it with sweet bread and wine, and covered with earth", cluster: purification}
  sun-god-stands-behind-mouth-and-tongue: {label: "The exalted Sun god is declared to stand behind (guarantee the treatment of) mouth and tongue", cluster: magic}
  sun-god-witnesses-treatment-of-tongues: {label: "The Sun god is told that the quarrelling tongues are set before him and treated today with his help", cluster: magic}
  sun-let-in-through-window: {label: "The Sun god is let into the house through the window", cluster: cult}
  three-pairs-of-eyes-of-sun-god: {label: "The Sun god has three pairs of eyes: of watching, of appeasement and of governing and judgment", cluster: theology}
  tissatwa-wool-in-fat: {label: "White and black wool wrapped in fat, called tiššatwa, is held over the patients to take away what they said with mouth and tongue", cluster: magic}
  tongues-of-that-day-cut-with-knife: {label: "Red wool is cut with a knife over the quarrelling pair: the god Andaliya has cut off the tongues of the day of quarrel with a knife", cluster: magic}
  torches-lit-as-sun-departs: {label: "Torches are lit as the Sun deity goes down", cluster: cult}
  vessel-substitute-broken-underfoot: {label: "A pot waved over the patients is called the substitute for their heads and broken; they smash another vessel with their feet, breaking all the evil words and curses", cluster: magic}
  washing-with-natron-water: {label: "The patients pour water with natron over their heads and wash their hands and eyes", cluster: purification}
  water-and-dough-sprinkled-to-purify: {label: "The Old Woman sprinkles the patients with water and waves dough over them: 'be pure again of mouth and tongue'", cluster: purification}
  water-sealed-in-horn-until-ancient-kings-return: {label: "Water is poured into an ox horn and sealed by the patients: only when the ancient kings return and examine the land and its customs may the seal be broken", cluster: magic}
units:
  - id: ane-cth-396-1-2-wishuriyant-offerings
    tradition: ane-hittite
    title: Ritual naming Wišuriyant, offerings set before the deity (CTH 396.1.2)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Hittite"
    read: ["CTH 396.1.2 §1:1-§5:37"]
    tags:
      - {motif: offering-set-before-the-deity, refs: ["CTH 396.1.2 §1:1", "CTH 396.1.2 §2:17"], note: "PA-NI DINGIR-LIM teḫḫi 'I set before the deity'; §1:1 partly restored"}
