      - {motif: evil-buried-in-pit-pegged-down, refs: ["CTH 404.1.I §25:131-136"], note: "the piglet killed and buried in a pit with bread and wine; no pegs here"}
    hints:
      - "Compare Q 37:107 (We ransomed him with a great sacrifice) and Q 2:67-73 (the cow slaughtered), Q 22:37 (neither flesh nor blood reaches God)."
      - "Substitution diverges from Q 6:164, 35:18 (no soul bears another's burden); compare Lev 16:21-22 and Lev 5:5-6."
  - id: ane-cth-404-1-1-mashtigga-vessels-salamander-carrier
    tradition: ane-hittite
    title: Maštigga ritual, clay and cumin, the salamander and puppy, Šaušga's vessel, the carrier sheep and the seven nails (CTH 404.1.I §26-38)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Hittite"
    version: "Manuscript group I"
    read: ["CTH 404.1.I §26:137-§38:210"]
    tags:
      - {motif: clay-cumin-dough-never-return-analogy, refs: ["CTH 404.1.I §26:137-139", "CTH 404.1.I §27:140-146"], note: "[IM-aš] wappui EGIR-pa UL [paizzi] … kappaniya ḫarkiēzzi UL … tamai NUMUN-an UL kišari … DINGIR.MEŠ-aš NINDAḫarši UL paizzi … idāluš lālaš … lē paizzi"}
      - {motif: salamander-carries-off-evil-tongue, refs: ["CTH 404.1.I §28:147-150", "CTH 404.1.I §29:151-153"], note: "ḫarziyallan … SÍG ZA.GÌN SÍG SA5 … pittalliš GÌR-aš idālun EME-an karapdu … iškišaz … ZU9 'its swift foot carry off the evil tongue, on its back, with its teeth'"}
      - {motif: substitute-animal-tarpalli, refs: ["CTH 404.1.I §30:154-157"], note: "the puppy: tarpalliš=wa [tuekkaš ḫūma]ndaš"}
      - {motif: patients-spit-curses-into-victims-mouth, refs: ["CTH 404.1.I §30:158-160"]}
      - {motif: substitute-slaughtered-into-pit, refs: ["CTH 404.1.I §30:161-162"], note: "UR.TUR kunanzi … ḫariyanzi"}
      - {motif: water-and-dough-sprinkled-to-purify, refs: ["CTH 404.1.I §31:163-165"]}
      - {motif: goddess-vessel-releases-and-hides-evil, refs: ["CTH 404.1.I §32:166-171", "CTH 404.1.I §33:172-174"], note: "IM-aš išnūrin with oil, red wool, barley, held under their šeknu-garment: ŠA dIŠTAR išnūriš … aššui TI-anni parā tarnan ḫardu … idālawi … uddanī … munnāiddu"}
      - {motif: seven-vessels-emptied-into-fire-and-broken, refs: ["CTH 404.1.I §34:175-179", "CTH 404.1.I §35:180-184"], note: "7 DUGḫupuwai with wine, oil, honey, figs, raisins, tendon, salt, fat emptied into the hearth and broken: duwarnattaru=wa=at … KA×U-it EME-it 'let it break with mouth and tongue'; seven flat breads thrown in"}
      - {motif: nakkussi-carrier-sheep-not-killed, refs: ["CTH 404.1.I §36:185-195"], note: "UDU … nakkuššin ḫalzišša 'she calls it the nakkušši (carrier)'; presented to the Sun: kāša=wa=šmaš nakkuššiš; UDU-ma=kan UL kunanzi 'they do not kill the sheep'; the Old Woman takes it"}
      - {motif: scapegoat-bears-sins-into-wilderness, refs: ["CTH 404.1.I §36:186-194"], note: "the nakkušši animal is left alive like the Azazel goat, but it is kept by the Old Woman, not sent away"}
      - {motif: seven-copper-nails-fix-evil-in-ground, refs: ["CTH 404.1.I §37:196-203"], note: "[7 GAG].ḪI.A URUDU … tēkan [tarmai]zzi: [tarm]ān=wa=rat ēštu [KA×]U-it EME-it 'let it be nailed down with mouth and tongue'"}
      - {motif: patients-lay-hand-on-offering, refs: ["CTH 404.1.I §38:204-206"]}
      - {motif: sun-god-stands-behind-mouth-and-tongue, refs: ["CTH 404.1.I §38:207-210"], note: "šarlānza=wa dUTU-uš KA×U EME-i EGIR-ŠU 'the exalted Sun is behind mouth and tongue'"}
    hints:
      - "Compare Lev 16:8-10, 21-22 (the live goat bears the iniquities) and Lev 14:7; the sheep kept by the practitioner is a divergence."
      - "Compare Q 37:107, 22:37 and 2:67-73; the substitute and the carrier vs Q 53:38-39 (no bearer bears another's burden; man has only what he strove for)."
      - "Breaking vessels: compare Jer 19:10-11 (the flask broken before witnesses) and Ps 2:9."
  - id: ane-cth-404-1-1-mashtigga-fire-vessels-seal
    tradition: ane-hittite
    title: Maštigga ritual, through the fire past the fallen huwaši-stones, the vessels broken by foot, washing and the sealed horn (CTH 404.1.I §39-46)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Hittite"
    version: "Manuscript group I"
    read: ["CTH 404.1.I §39:211-§46:256"]
    tags:
      - {motif: patients-pass-between-fires, refs: ["CTH 404.1.I §39:211-212", "CTH 404.1.I §41:222-223"], note: "paḫḫur ZAG-az GÙB-lazziya warnuwanzi; 7 NA4ḫuwaši in the middle; paḫḫur ištarna arḫa paizzi 'he goes through the middle of the fire'"}
      - {motif: huwasi-stones-fall-so-evil-words-fall, refs: ["CTH 404.1.I §40:218-221", "CTH 404.1.I §41:222"], note: "whole of §40:218-220 restored from duplicates: [kuiš=wa=rat … NA4ḫuwāši … lagāri] 'they are falling'; patients kick them with their feet"}
      - {motif: patients-cast-off-fine-garments, refs: ["CTH 404.1.I §41:224-226"], note: "TÚG[NÍG.LÀM.MEŠ] restored … arḫa pešš[iyanzi] … MUNUSŠU.GI dāi"}
      - {motif: vessel-substitute-broken-underfoot, refs: ["CTH 404.1.I §42:227-236"], note: "DUGÚTUL SAG.DU-KUNU tarpalliš 'the pot is substitute for your heads'; the DÍLIM.GAL broken by their feet: duwarnattaru=wa=rat ḫūmanda uddār ḫurtāušša"}
      - {motif: patient-wiped-with-sun-plant, refs: ["CTH 404.1.I §43:237-241"], note: "dUTU-aš uelku … tiwariya … waršan ēštu idālu uddār KA×U-aš EME-aš"}
      - {motif: washing-with-natron-water, refs: ["CTH 404.1.I §44:242-245"], note: "NA4nitri anda šuḫḫan … SAG.DU-ŠUNU šarā lāḫuwanzi; ŠU.ḪI.A IGI.ḪI.A arranzi 'hands and eyes'"}
      - {motif: water-sealed-in-horn-until-ancient-kings-return, refs: ["CTH 404.1.I §45:246-251"], note: "ANA SI.GU4 … šiyanzi; kuwapi karuileš LUGAL.MEŠ EGIR-pa uwanzi … KUR-e šaklinna EGIR-an kappuwanzi … NA4KIŠIB … niniktaru 'when the ancient kings return and examine the land and the customs, then let this seal be broken'"}
      - {motif: scribal-colophon, refs: ["CTH 404.1.I §46:252-256"], note: "DUB.1.KAM QATI AWAT fMaštigga MUNUS URUKizzuwatni"}
    hints:
      - "Passing through fire: compare Q 21:68-69 (fire made cool and safe for Abraham) as a contrast; and Num 31:23, Isa 43:2."
      - "The seal until the ancient kings return: compare Q 18:9-26 (the sleepers raised in a later age) only loosely; Dan 12:4 (seal the book until the time of the end) and Isa 8:16."
      - "Compare Q 5:6 (wash faces and hands) for washing hands and eyes."
