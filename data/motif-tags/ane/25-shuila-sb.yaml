# Full read, chunk 25: Šuʾilas to Ištar, Ninlil, Šamaš; Spider; Theodicy; Wren; SAA 2 treaties. Read in the Akkadian.
new_motifs:
  lifted-hand-prayer-with-ritual-rubric: {label: "A prayer is labelled a lifted-hand prayer (šuʾila) and followed by its ritual: roof swept, pure water sprinkled, portable altar, censer of juniper, libation, recitation three times, prostration", cluster: cult}
  prayer-recited-three-times: {label: "The prayer or incantation is to be recited three times", cluster: cult}
  goddess-twin-of-sun-god: {label: "The love-and-war goddess is the twin sister of the sun god and shares his office of judging the world", cluster: theogony}
  deity-as-torch-of-heaven-and-earth: {label: "The deity is hailed as the torch, light or luminary of heaven and earth", cluster: hymn}
  justice-at-right-hand-favour-at-left: {label: "Personified Justice stands at the deity's right hand and Favour at the left, protective spirits going before and behind", cluster: hymn}
  how-near-is-your-hearing: {label: "Hymnic confidence: how sweet it is to pray to the god, how near is the god's hearing", cluster: prayer}
  deity-changes-fates-raises-lowly: {label: "The deity reverses fortunes: makes the weak strong, the unfortunate fortunate, raises the fallen", cluster: hymn}
  ahulap-litany-have-mercy: {label: "Litany of 'aḫulap' ('enough!, have mercy'): mercy asked in turn for the sufferer's body, heart, omens, household and feelings", cluster: prayer}
  sufferer-tossed-like-wave-heart-flies-like-bird: {label: "The sufferer tosses like a wave whipped by an evil wind; his heart flutters and flies like a bird of heaven", cluster: prayer}
  what-have-i-done-to-my-god: {label: "The sufferer asks what he has done to his god and goddess: he is treated like one who does not fear his god", cluster: prayer}
  dark-days-gloomy-months-years-of-grief: {label: "The sufferer has seen dark days, gloomy months and years of grief", cluster: prayer}
  house-of-sufferer-deathly-silent-family-scattered: {label: "The sufferer's house, gate and fields are deathly silent; his family is dispersed and his fold scattered", cluster: prayer}
  sin-loosed-like-bond: {label: "Sin is a bond or fetter: the petitioner asks that his sin be loosed, his bonds released and he be set free", cluster: prayer}
  brazier-relit-torch-rekindled-family-gathered: {label: "Petition for restoration: the dark smoky brazier brightened, the extinguished torch rekindled, the scattered family gathered, the fold enlarged", cluster: prayer}
  personal-god-and-goddess-reconciled: {label: "Petition that the angry personal god and personal goddess turn back and be reconciled with the sufferer", cluster: prayer}
  divine-anger-calm-like-river-water: {label: "Prayer that the deity's mood become calm like the clear water of a river", cluster: prayer}
  restored-sufferer-proclaims-gods-praise-in-street: {label: "Those who see the restored sufferer in the street will magnify the deity's name, and he will proclaim the deity's greatness to all people", cluster: prayer}
  deity-heart-returns-like-father-and-mother: {label: "Prayer that the deity's heart return to the sufferer like that of a father and a mother", cluster: prayer}
  goddess-quickly-appeased-after-cursing: {label: "Where the goddess has cursed, she is quickly appeased; she is relenting, merciful and forgiving", cluster: prayer}
  word-from-mouth-life-from-lips: {label: "Prayer that life come forth from the deity's mouth and peace be set on the deity's lips", cluster: prayer}
  favourable-finger-pointed-behind-me: {label: "Prayer that god, king, noble and prince esteem the petitioner and a favourable finger be stretched out behind him", cluster: prayer}
  slanderers-mouths-silenced: {label: "Prayer that the slanderer not defame the petitioner and that the deity master the mouths that slander him", cluster: prayer}
  sufferer-eats-no-food-embittered-like-gall: {label: "The sufferer finds no taste in food and is bitter as gall; terrors and frightening dreams on his bed at night", cluster: prayer}
  coated-with-tears-polluted-with-dust: {label: "The sufferer is drenched in tears and soiled with dust", cluster: prayer}
  wall-fell-on-me: {label: "Image of affliction: a wall has fallen on the sufferer and overwhelmed him", cluster: prayer}
  deity-holds-nose-rope-of-peoples: {label: "The deity holds the nose-rope (leading rope) of the peoples or of kings", cluster: kingship}
  gods-exalt-goddess-in-assembly: {label: "The high gods (Anu, Enlil, Ea) exalt the goddess in the divine assembly, fix her fate and give her kingship of heaven and earth", cluster: theogony}
  heaven-earth-shake-at-gods-name: {label: "At the mention of the deity's name heaven and earth quake and the gods tremble", cluster: hymn}
  gods-kiss-feet-of-deity: {label: "The gods of heaven and the deep bow down and kiss the feet of the supreme deity", cluster: hymn}
  rubric-ritual-against-slander-and-disfavour: {label: "Ritual prescribed for a man beset by slander and sorcery who has lost the favour of god, king and palace", cluster: cult}
  woman-prays-goddess-for-child: {label: "A woman prays the goddess for a child ('a name and a seed') and a sound womb", cluster: prayer}
  offering-meal-set-before-goddess-eat-and-drink: {label: "The petitioner sets food and drink before the deity: 'eat the pleasing food, drink the sweet drink, let your heart be at ease'", cluster: cult}
  goddess-opens-veils-of-young-women: {label: "The love goddess opens the veils of young women (sexuality under her patronage)", cluster: sexuality}
  goddess-sets-brothers-at-strife: {label: "The war goddess makes brothers at peace fight each other", cluster: war}
  god-gives-lonely-friend-impotent-heir-blind-light: {label: "The god gives the lonely man a companion, the impotent man an heir, light to the blind, and opens the locked bolts of heaven", cluster: hymn}
  sun-god-reads-sealed-tablet-writes-omen-in-sheep: {label: "The sun god can read an unopened, sealed tablet and writes the omen inside the sacrificial sheep", cluster: divination}
  seize-hem-of-gods-garment: {label: "The petitioner seizes the hem of the god's garment in supplication", cluster: prayer}
  evil-portent-turned-to-good: {label: "The god turns evil signs and portents (eclipse, broken chariot part, ants in the house, bad dreams) to good: may their evil not draw near the petitioner or his house", cluster: divination}
  gods-vizier-and-consort-intercede: {label: "The god's vizier and wife are asked to speak a good word for the petitioner before the god", cluster: prayer}
  gods-yes-is-yes-no-is-no: {label: "The god's 'yes' is yes and his 'no' is no: his affirmation cannot be altered", cluster: hymn}
  make-me-pure-as-daylight: {label: "The petitioner asks the god to make him pure as the god's bright day", cluster: prayer}
  curse-from-known-or-unknown-person: {label: "Evil or a curse (māmītu) laid on the sufferer by a friend, brother, sister, slave or kin, someone known or unknown, by hand or mouth, is to be released", cluster: prayer}
  strife-at-home-contention-in-street: {label: "Wherever the sufferer goes is disagreeable: strife at home, contention in the street, worry pursuing him night and day", cluster: prayer}
  without-god-no-judgment-given: {label: "Without the god no judgment is pronounced and the case of the wronged man and woman is not decided", cluster: law}
  gods-create-world-then-distribute-sanctuaries: {label: "After the gods in assembly created heaven, netherworld and all creatures, they distributed sanctuaries and dwellings to every creature", cluster: creation}
  creator-god-makes-and-names-two-creatures: {label: "A creator god makes two small creatures and gives them names that define their nature", cluster: creation}
  boastful-creatures-quarrel-before-assembly: {label: "Small creatures boast of their strength and revile one another before the assembly of all animals, and another creature rebukes them for upsetting the order of the gods", cluster: fable}
  lord-of-flies: {label: "A creature or demon is called 'master/lord of flies' (bēl zumbī)", cluster: demons}
  theodicy-dialogue-sufferer-and-friend: {label: "A suffering man and his learned friend debate in alternating speeches why the pious suffer while the impious prosper", cluster: wisdom}
  fathers-go-the-way-of-death: {label: "The friend consoles: our fathers all went the way of death and crossed the river of the dead, as ordained of old", cluster: wisdom}
  who-reveres-god-has-protector-and-wealth: {label: "Retribution doctrine: whoever looks to his god has a protector, whoever reveres his goddess gathers wealth", cluster: wisdom}
  beasts-and-rich-prosper-without-offerings: {label: "The sufferer points out that the wild ass, the lion and the rich man prosper without ever bringing offerings to the gods, while he who offered faithfully suffers", cluster: wisdom}
  violent-beast-and-hoarder-come-to-ruin: {label: "The friend answers that the swaggering wild ass will be shot, the ravaging lion falls into a pit, and the hoarding rich man is burned by the king before his time", cluster: wisdom}
  sufferer-resolves-to-abandon-god-and-roam: {label: "The despairing sufferer resolves to forsake home and possessions, trample the god's rites and roam the streets like a vagrant", cluster: wisdom}
  social-inversion-rich-and-poor-change-places: {label: "Social world turned upside down: the king's son in rags, the son of the destitute in fine clothes, the rich man's son eating carob", cluster: wisdom}
  wealth-and-poverty-ordained-of-old: {label: "Long life is the god's to grant; wealth and poverty were fixed by the gods since days of old", cluster: wisdom}
  god-does-not-block-the-demon: {label: "The sufferer observes that the god does not bar the way of a demon: evil is left free to roam", cluster: wisdom}
  idle-firstborn-and-working-younger-son: {label: "The father hauls the boat while his firstborn lies in bed; the heir idles in the street while the younger son feeds the poor", cluster: wisdom}
  firstborn-inferior-second-born-superior: {label: "Saying: the cow's first calf is inferior, the next twice as big; the first child is a weakling, the second a warrior", cluster: wisdom}
  society-honours-murderer-crushes-innocent: {label: "Society extols the powerful murderer and oppresses the powerless innocent: they call the wicked truthful, drive off the truthful, fill the oppressor's treasury and empty the poor man's larder", cluster: wisdom}
  gods-gave-humans-lying-speech: {label: "The creator gods themselves gave humankind twisted speech, lies and falsehood forever", cluster: creation}
  humble-walk-eyes-on-ground: {label: "The sufferer protests his humility: he walked unobtrusively, did not raise his voice, did not hold his head high but looked at the ground", cluster: wisdom}
  small-bird-appeals-to-sun-god-against-eagle: {label: "A small weak bird (the wren) appeals to the sun god as just judge against the predatory eagle, and the god binds the eagle", cluster: fable}
  lofty-humbled-lowly-raised-by-god: {label: "Moral: let the lofty no longer boast of their height nor the lowly lament their lowliness, for whoever has the god with him builds his nest and raises his young", cluster: wisdom}
  wise-friend-heart-deep-as-ocean: {label: "The wise man's heart is a deep wellspring, the swell of the ocean that never diminishes", cluster: wisdom}
  loyalty-oath-imposed-by-assyrian-king: {label: "A loyalty oath (adê) is imposed by the Assyrian king (or queen mother) on vassals or subjects, binding them to him and his heir 'from this day as long as we live'", cluster: treaty}
  treaty-report-sedition-even-from-kin: {label: "The sworn party must report any seditious or evil word heard against the king, whether from a brother, the king's own seed, an official, a friend or anyone, and must not conceal it", cluster: treaty}
  treaty-seize-and-deliver-instigators: {label: "Those who incite rebellion must be seized, put in fetters and delivered to the king, or killed", cluster: treaty}
  treaty-love-king-hate-his-enemy: {label: "The vassal must love the king and his friends and hate his enemy", cluster: treaty}
  treaty-no-other-king-or-lord: {label: "The vassal must not set another king or another lord over himself", cluster: treaty}
  treaty-forward-enemy-messages-to-king: {label: "Any letter or messenger arriving from the enemy or a foreign land must be seized and sent on to the king", cluster: treaty}
  treaty-fight-kings-enemy: {label: "The vassal must take up the bow, stand with the king and fight his enemy wholeheartedly", cluster: treaty}
  treaty-return-fugitives: {label: "Fugitives who flee from one realm to the other must be handed back", cluster: treaty}
  treaty-gods-and-stars-as-witnesses: {label: "The treaty is sworn before a list of gods (including the vassal's own gods) or before the planets and stars, who guarantee it", cluster: treaty}
  treaty-ritual-animal-identified-with-vassal: {label: "Treaty enactment: an animal brought not for sacrifice but for the oath is dismembered with the words 'this head is not the lamb's head, it is the head of X'; as it is cut, so may the oath-breaker be", cluster: treaty}
  curse-ghost-deprived-of-water: {label: "Curse: may the god uproot the oath-breaker above among the living and deprive his ghost of water below in the earth", cluster: treaty}
  curse-made-to-kneel-at-enemys-feet: {label: "Curse: may the war goddess make the oath-breaker kneel or sit bound at the feet of his enemy", cluster: treaty}
  curse-skin-disease-as-garment: {label: "Curse: may the moon god clothe the oath-breaker in skin disease (saharšubbû) like a garment, so that he roams the open country", cluster: treaty}
  curse-dust-for-food-pitch-for-oil-urine-for-drink: {label: "Curse: may dust be their food, pitch their ointment, donkey's urine their drink, papyrus their clothing, a hole their bed", cluster: treaty}
  curse-soldiers-become-women-and-prostitutes: {label: "Curse: may the oath-breaker's soldiers become women and take payment like prostitutes in the city square; may the war goddess take away their bow", cluster: treaty}
  curse-sterility-like-mule: {label: "Curse: may the oath-breaker's life be like a mule's (sterile) and his wife reach extreme old age (childless)", cluster: treaty}
  curse-city-of-thousand-houses-left-one: {label: "Curse: may a city of a thousand houses be reduced to one house, a thousand tents to one, one man left in the city", cluster: treaty}
  curse-livestock-cease-no-dung: {label: "Curse: may the dung of oxen, donkeys, sheep and horses not be found in the land (livestock wiped out)", cluster: treaty}
  curse-reign-of-sighing-few-days: {label: "Curse: may the high god decree for the oath-breaker a reign of sighing, few days and years of want", cluster: treaty}
  curse-sceptre-broken-kingship-overthrown: {label: "Curse: may the gods break the oath-breaker's sceptre and overthrow his kingship", cluster: treaty}
  curse-rivers-dammed-rain-withheld: {label: "Curse: may the storm god withhold rain from heaven and flood from the deep, and the wise god dam the rivers at their source", cluster: treaty}
  curse-seed-burned-torch-quenched: {label: "Curse: may the oath-breakers' seed and images be burned in fire and their torch extinguished in water", cluster: treaty}
  curse-bow-broken-by-war-goddess: {label: "Curse: may the war goddess break the oath-breaker's bow in fierce battle", cluster: treaty}
  curse-life-poured-out-like-water: {label: "Curse: may the god pour out the oath-breaker's life like water", cluster: treaty}
  curse-land-to-flood-ruin-mound: {label: "Curse: may the god turn the oath-breaker's land into a flood-ruin mound and his cities into tells", cluster: treaty}
  queen-mother-imposes-loyalty-oath: {label: "The queen mother herself imposes a loyalty oath on the royal family and the whole land in favour of her grandson the king", cluster: treaty}
  conspiracy-to-kill-king-must-be-reported: {label: "If the sworn party hears of a plot to kill the king, or of men inciting revolt among courtiers, kin or the people, he must report it and seize and kill the plotters", cluster: treaty}
  curse-plague-ends-people: {label: "Curse: may the plague god finish off the oath-breaker's people with blows and pestilence", cluster: treaty}
  treaty-royal-deputy-oversees-vassal: {label: "An Assyrian royal deputy (qēpu) is set over the vassal: the vassal must heed him and may not open the king's letters without him", cluster: treaty}
  treaty-shipwreck-salvage-rule: {label: "If a vassal's ship is wrecked on the overlord's coast, its cargo belongs to the overlord but the people aboard are not harmed and are sent home", cluster: treaty}
  treaty-ports-and-routes-entrusted-to-vassal: {label: "The overlord entrusts named ports and trade routes along the coast (Akko, Dor, Philistia, Byblos, Lebanon) to the vassal", cluster: treaty}
  curse-wound-bathe-in-blood-and-pus: {label: "Curse: may the healing goddess put unhealing illness and a lasting wound in the oath-breaker's body; may he bathe in blood and pus as in water", cluster: treaty}
  curse-handed-to-devouring-lion: {label: "Curse: may the gods (Bethel and Anat-Bethel) hand the oath-breaker over to a man-eating lion", cluster: treaty}
  curse-storm-wind-wrecks-ships: {label: "Curse: may the storm gods (the Baals) raise an evil wind against the oath-breaker's ships, loosen their moorings, tear out their masts and sink them in the sea", cluster: treaty}
  curse-land-destroyed-people-deported-food-clothes-oil-lost: {label: "Curse: may the gods hand the land to destruction and the people to deportation, and take away food from the mouth, clothing from the body and oil for anointing", cluster: treaty}
  curse-enemy-divides-your-possessions: {label: "Curse: may a foreign enemy divide the oath-breaker's possessions", cluster: treaty}
  overlord-anoints-vassal-with-oil: {label: "The overlord 'put oil on' (anointed) the vassal as a sign of favour and covenant", cluster: treaty}
  secret-message-by-bird-or-fish-forbidden: {label: "The sworn party must not send messages secretly, 'whether by the hand of a fish of the sea or a bird of the sky'", cluster: treaty}
  treaty-no-peace-with-kings-enemy: {label: "The vassal must not make peace or come to terms ('put his mouth') with the overlord's enemy", cluster: treaty}
  succession-oath-for-two-princes: {label: "The king makes all the lands swear by the great gods to accept his two sons, one as crown prince of Assyria and one of Babylon, and protect their thrones", cluster: kingship}
  planets-bound-by-royal-oath: {label: "The seven planets (bibbu) of heaven are themselves bound by, or cursed for, the king's oath", cluster: treaty}
  treaty-fear-and-serve-overlord: {label: "The vassal is bound to fear the overlord and do what is good for him", cluster: treaty}
  treaty-binds-future-generations: {label: "The oath binds not only those present but their sons and grandsons and all who will exist in days to come", cluster: treaty}
  treaty-tablet-sealed-and-guarded-like-god: {label: "The treaty tablet, sealed with the god's own seal, is set before the sworn, who must guard it like their god and not alter, erase, burn, drown or bury it", cluster: treaty}
  oath-with-whole-heart-not-lips-only: {label: "The sworn must take the oath with their whole heart, not with the lips only, and teach it to their sons who come after", cluster: treaty}
  love-overlord-as-own-life: {label: "The sworn must love the crown prince or overlord as their own lives", cluster: treaty}
  treaty-no-poisoning-or-sorcery-against-prince: {label: "The sworn must not give the crown prince a deadly plant to eat or drink, anoint him with it, work sorcery on him or make the gods angry with him", cluster: treaty}
  ritual-to-annul-oath-forbidden: {label: "The sworn must not perform a rite to undo the oath (anointing with tallow from the gods, binding something on the thigh, 'turning back' or 'releasing' the oath)", cluster: treaty}
  protect-brothers-of-crown-prince: {label: "The sworn must protect the crown prince's brothers, not slander them before him, nor change the positions their father assigned them", cluster: treaty}
  your-god-and-your-lord-forever: {label: "Formula: in future days the national god is 'your god' and the crown prince 'your lord'; your sons and grandsons shall fear him", cluster: treaty}
  simile-curse-just-as-so-may: {label: "Simile curse: 'just as this (object, animal, wax figure, ewe, water-skin) is treated, so may it be done to you'", cluster: treaty}
  curse-birth-cut-off-no-childs-cry: {label: "Curse: may the birth goddess cut off birth in the land, and the nurse be deprived of the cry of a baby in the street", cluster: treaty}
  curse-no-sound-of-mill-and-oven: {label: "Curse: may there be no sound of the grindstone or the oven in your houses", cluster: treaty}
  curse-mother-bars-door-against-daughter: {label: "Curse: in famine the mother bars her door against her own daughter; you eat the flesh of your sons, grind their bones instead of grain; man eats man and wears his skin", cluster: treaty}
  curse-unburied-corpse-eaten-by-dogs-and-pigs: {label: "Curse: may your corpses find no burial; may dogs and pigs (or eagle and jackal) eat your flesh, their bellies your grave", cluster: treaty}
  curse-days-dark-years-of-darkness: {label: "Curse: may your days be dark and your years years of darkness that never brightens", cluster: treaty}
  curse-like-tin-before-fire-cannot-stand-before-enemy: {label: "Simile curse: as tin cannot stand before fire, so may you not stand before your enemy", cluster: treaty}
  curse-city-ploughed-with-iron-plough: {label: "Curse: may the sun god overturn your city, land and district with an iron plough", cluster: treaty}
  curse-oath-enters-body-like-food-or-oil: {label: "Simile curse: as bread and wine enter the intestines, or oil penetrates flesh, so may this oath enter your body and your children's", cluster: treaty}
  curse-rivers-and-springs-flow-backward: {label: "Curse: may your rivers and springs make their water flow backward", cluster: treaty}
  curse-bread-for-price-of-gold: {label: "Curse: may bread be bought for its weight in gold in your land", cluster: treaty}
  curse-worms-eat-living-flesh: {label: "Curse: as the worm eats stored food, may worms eat your flesh while you are alive; may a goddess make a worm come out of your belly", cluster: treaty}
  curse-not-return-to-wife-and-house: {label: "Simile curse: as the caterpillar does not return to its cocoon, so may you not return to your wives and houses", cluster: treaty}
  curse-kin-hunt-and-kill-each-other: {label: "Curse: may your brothers and sons chase and kill you like a stag; may you be bitter to each other like gall; may they strangle you", cluster: treaty}
  curse-flesh-black-as-pitch: {label: "Curse: may your flesh and your family's be blackened like pitch, bitumen and naphtha", cluster: treaty}
  curse-breath-stinks-before-gods-and-men: {label: "Simile curse: as this bug stinks, may your breath stink before god, king and mankind", cluster: treaty}
  curse-melt-like-wax-dissolve-like-clay-figure: {label: "Simile curse: as a wax figure burns in fire and a clay figure dissolves in water, so may your form be burned and sink", cluster: treaty}
  curse-move-backward-like-crab: {label: "Curse: may your chariots and your sons move backward like a crab", cluster: treaty}
  curse-turn-right-or-left-sword-devours: {label: "Curse: whoever abandons the king and goes to the right or to the left, may the sword devour him", cluster: treaty}
  curse-no-rest-no-sleep-bones-apart: {label: "Simile curse: as the dove moans, may you, your wives and children find no rest and no sleep, and your bones not come together", cluster: treaty}
  curse-no-balm-for-wound: {label: "Curse: when the enemy pierces you, may honey, oil, ginger and cedar resin to dress the wound be lacking", cluster: treaty}
  curse-sun-gods-net-no-escape: {label: "Curse: may the sun god cast his bronze bird-snare and inescapable net over you and not let you out", cluster: treaty}
  curse-waterskin-split-die-of-thirst: {label: "Simile curse: as this water-skin is split and its water spilled, may your water-skin break in a thirsty land and you die of thirst", cluster: treaty}
  curse-crawl-on-belly: {label: "Simile curse: as this sandal is cut, may your sandals be torn in thorny ground and you crawl on your belly", cluster: treaty}
  curse-name-erased-from-tablet-of-fates: {label: "Curse: may the scribe god who bears the tablet of fates erase your name and destroy your seed from the land", cluster: treaty}
  curse-demons-choose-your-houses: {label: "Curse: may evil demons (šēdu, utukku, rābiṣu) choose your houses as their dwelling", cluster: treaty}
  curse-hands-feet-cut-eyes-blinded: {label: "Curse: as the curser who sinned against Bēl had hands and feet cut off and eyes blinded, so may you be finished off", cluster: treaty}
  treaty-dated-by-eponym: {label: "The treaty is dated by month, day and the eponym of the year", cluster: treaty}
units:
  - id: ane-shuila-istar-1-valiant-ishtar
    tradition: ane-akkadian
    title: "Šuʾila to Ištar 1: 'O valiant Ištar, cherished among the goddesses'"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    version: Standard Babylonian
    read: ["Shuila Ištar SB 1"]
    tags:
      - {motif: deity-as-torch-of-heaven-and-earth, refs: ["Shuila Ištar SB 1:2"], note: "dipār šamê u erṣeti šarūr kibrāti"}
      - {motif: goddess-twin-of-sun-god, refs: ["Shuila Ištar SB 1:3-4"], note: "bukrat sîn ... tūamti ṭarri šūpê qurādi šamši: firstborn of Sin, twin of the bearded Šamaš"}
      - {motif: incomparability-among-the-gods, refs: ["Shuila Ištar SB 1:11-12"], note: "šumma ina igigî ayyu māhirki / šumma ina anunnakī ali šāninki"}
      - {motif: deity-changes-fates-raises-lowly, refs: ["Shuila Ištar SB 1:13-14"], note: "tuštepellī šīmātam-ma idammiq lemnu; already 'in the human womb' (ina šassūr nišī) poverty and profit are fixed"}
      - {motif: justice-at-right-hand-favour-at-left, refs: ["Shuila Ištar SB 1:17-18", "Shuila Ištar SB 1:32-35"], note: "pānukki šēdu arkatuk lamassu / imnuk mīšaru šumēlukki dumqu"}
      - {motif: how-near-is-your-hearing, refs: ["Shuila Ištar SB 1:21"], note: "kī ṭābu suppûki kī qerub našmûki"}
