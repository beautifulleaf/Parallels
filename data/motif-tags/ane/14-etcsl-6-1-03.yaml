      - {motif: liar-false-witness-abomination, refs: ["ETCSL 6.1.03 A.3.118"], note: "niĝ2 nu-zu-am3 lu2-ki-inim-ma ab-ta-e3 / niĝ2-gig {d}suen-na-kam"}
      - {motif: abomination-to-a-named-god, refs: ["ETCSL 6.1.03 A.3.118"]}
      - {motif: six-seven-things-god-hates, refs: ["ETCSL 6.1.03 A.3.118"], note: "the false witness as something the god abhors"}
      - {motif: flies-enter-open-mouth, refs: ["ETCSL 6.1.03 A.3.119"], note: "ka ĝal2 taka4-a nim ba-an-ku4-ku4"}
      - {motif: offerings-create-life, refs: ["ETCSL 6.1.03 A.3.120"], note: "sizkur2-re nam-til3 i3-u3-tud"}
      - {motif: braggart-punished-with-disease, refs: ["ETCSL 6.1.03 A.3.121"]}
      - {motif: kid-in-right-hand-bribe-in-left, refs: ["ETCSL 6.1.03 A.3.123"], note: "a2 zid-da-zu maš2 ḫe2-da-ĝal2 / gab2-bu-zu kadra ḫe2-da-ĝal2"}
      - {motif: cobblers-children-unshod, refs: ["ETCSL 6.1.03 A.3.124"]}
      - {motif: aching-heart-no-one-finds, refs: ["ETCSL 6.1.03 A.3.127", "ETCSL 6.1.03 A.3.128"], note: "šag4 gig-ga-ĝu10 a-ba-a ḫu-mu-un-pad3-de3; {d}inana-ke4 šag4 gig-ga-ĝu10 i3 ḫe2-eb-de2"}
      - {motif: heart-knows-own-bitterness, refs: ["ETCSL 6.1.03 A.3.127"]}
      - {motif: grind-while-there-is-light, refs: ["ETCSL 6.1.03 A.3.132"], note: "izi nu-ub-da-an-ten-a-aš li-gi4-in-zu sar-ra-ab 'before the fire goes out, write your exercise tablet'"}
      - {motif: personal-god-shepherd-finds-pasture, refs: ["ETCSL 6.1.03 A.3.134"], note: "diĝir lu2-ulu3 sipad u2 kiĝ2-ĝa2 lu2-ulu3-kam / udu-gin7 u2 gu7-a ḫe2-en-tum2-tum2-mu"}
      - {motif: yhwh-my-shepherd, refs: ["ETCSL 6.1.03 A.3.134"]}
      - {motif: heavens-destroyed-people-still-stand, refs: ["ETCSL 6.1.03 A.3.136"], note: "an ba-gul-gul ki ba-sag3-sag3 ... lu2 ni2-bi-a ba-an-gub"}
      - {motif: elam-place-of-no-return, refs: ["ETCSL 6.1.03 A.3.138", "ETCSL 6.1.03 A.3.139"]}
      - {motif: nomad-does-not-know-grain, refs: ["ETCSL 6.1.03 A.3.140"], note: "mar-tu i3-gu7-a niĝ2 šag4-bi nu-un-zu"}
