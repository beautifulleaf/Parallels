      - "The aching heart no one finds: compare Prov 14:10, 18:14 and Ps 69:21."
      - "The false witness an abomination: compare Prov 6:19, 19:5, Exod 20:16, Deut 19:16-19; Q 25:72."
      - "The runaway tongue: compare Jas 3:5-8 and Prov 13:3."
      - "Kid in the right hand, bribe in the left: compare Prov 21:14, 17:23 and Isa 1:11-17."
      - "Offerings give life: contrast 1Sam 15:22 and Ps 50:8-15; Q 22:37."
      - "Heavens destroyed, people still standing: compare Isa 51:6 and Ps 102:26-28."
  - id: ane-etcsl-6-1-03-f-trades-taboos-and-fate
    tradition: ane-sumerian
    title: "Proverbs collection 3, nos. 148-190: priests and craftsmen, drought, abominations to Suen, Inana and Ninurta, Fate, the leader in the fire, righteousness cut off"
    corpus: ane
    original: true
    tagger: Claude (model), reading the Sumerian
    read: ["ETCSL 6.1.03 A.3.148:267-A.3.190:328"]
    tags:
      - {motif: trades-characterised-by-their-sayings, refs: ["ETCSL 6.1.03 A.3.148"], note: "ḫa-ma-gub-be2-en gudug-e-ne ... zi {d}en-ki i3-pad3 tug2-zu e2-a ud ba-ra-zal-e {lu2}azlag2-e-ne: the fuller swears by Enki's life"}
      - {motif: drought-cloudy-day-no-rain, refs: ["ETCSL 6.1.03 A.3.149"], note: "ud al-šu2-šu2-ru im nu-šeĝ3-šeĝ3 / im al-šeĝ3 {kuš}e-sir2 nu-du8"}
      - {motif: monkey-in-eridu-longing, refs: ["ETCSL 6.1.03 A.3.150"]}
      - {motif: solitary-man-treacherous, refs: ["ETCSL 6.1.03 A.3.152"]}
      - {motif: goat-speaks-like-wise-woman-acts-unclean, refs: ["ETCSL 6.1.03 A.3.153"], note: "nam-um-ma ba-dug4 nam-u2-zug4 ib2-ak"}
      - {motif: good-word-friend-of-many, refs: ["ETCSL 6.1.03 A.3.159", "ETCSL 6.1.03 A.3.160"], note: "inim dug3 gu5-li lu2 šar2-ra-ka; inim gul-la gud 4 la2-a"}
      - {motif: unwashed-hands-to-mouth-disgusting, refs: ["ETCSL 6.1.03 A.3.161"], note: "šu nu-luḫ-ḫa ka-e tum3-da niĝ2-gig-ga-am3"}
      - {motif: holds-up-sky-earth-dangles, refs: ["ETCSL 6.1.03 A.3.167"]}
      - {motif: abomination-to-a-named-god, refs: ["ETCSL 6.1.03 A.3.168", "ETCSL 6.1.03 A.3.169", "ETCSL 6.1.03 A.3.170", "ETCSL 6.1.03 A.3.171", "ETCSL 6.1.03 A.3.175"], note: "niĝ2-gig of the necromancer (lu2-gidim-ma) is muš barley; wheat flour niĝ2-gig of his god; touching a woman's genitals over her clothes niĝ2-gig {d}suen; carrying bread to the oven while singing niĝ2-gig {d}inana; coveting niĝ2-gig {d}nin-urta"}
      - {motif: covetousness-abomination-to-ninurta, refs: ["ETCSL 6.1.03 A.3.175"], note: "igi-tum3 la2 gid2-i-da (var. igi du8) niĝ2-gig {d}nin-urta-ke4"}
      - {motif: covet-prohibition, refs: ["ETCSL 6.1.03 A.3.175"]}
      - {motif: fate-indifferent-to-just-and-wicked, refs: ["ETCSL 6.1.03 A.3.176"], note: "nam-tar-re gaba-ri-me-en / zid-du dug4-ga-ab erim2-du dug4-ga-ab"}
      - {motif: spoken-word-out-of-hand, refs: ["ETCSL 6.1.03 A.3.177"], note: "ka-ta ḫe2-ĝal2 šu-a nu-ĝal2"}
      - {motif: woe-and-boat-sinks, refs: ["ETCSL 6.1.03 A.3.179"]}
      - {motif: lost-loincloth-becomes-fine-garment, refs: ["ETCSL 6.1.03 A.3.187"]}
      - {motif: free-worker-worth-several-slaves, refs: ["ETCSL 6.1.03 A.3.183"]}
      - {motif: leader-burning-followers-indifferent, refs: ["ETCSL 6.1.03 A.3.188"]}
      - {motif: righteousness-cut-off-injustice-grows, refs: ["ETCSL 6.1.03 A.3.190"], note: "si sa2 un-tar-e niĝ2-erim2 ib2-il2-e"}
      - {motif: necromancy, refs: ["ETCSL 6.1.03 A.3.168"], note: "only the lu2-gidim-ma 'necromancer' is named, as one for whom muš barley is taboo"}
    hints:
      - "Fate indifferent to just and wicked: compare Eccl 9:2-3 and Job 9:22."
      - "A word cannot be taken back: compare Prov 18:21, Eccl 5:1-5, Num 30:3."
      - "Coveting an abomination to Ninurta: compare Exod 20:17 and Deut 5:21."
      - "Righteousness cut off, injustice grows: compare Isa 59:14-15 and Hab 1:4; Q 30:41."
      - "A good word a friend to many: compare Prov 15:1, 16:24 and Q 14:24-26 (a good word like a good tree)."
      - "The drought (clouds without rain): compare Prov 25:14 and Jude 12."
