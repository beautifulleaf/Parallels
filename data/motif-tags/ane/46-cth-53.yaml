      - {motif: treaty-tribute-weighed-by-overlords-weights, refs: ["CTH 62 §2:13-16"], note: "3 ME GUŠKIN bašla maḫra mandattu, year by year; 'never did he withhold it, never did he make him tremble with anger'"}
      - {motif: loyal-servant-of-successive-kings, refs: ["CTH 62 §2:17-20", "CTH 62 §3:23-24"], note: "he 'guarded the hand' (qātu iṣṣurū) of the father and then of the son"}
      - {motif: vassal-will-die-with-king, refs: ["CTH 62 §3:26-29"], note: "Aziru in old age (LÚŠU.GI) could no longer march, and his son fought in his place"}
      - {motif: dynastic-succession-from-father, refs: ["CTH 62 §2:17-18"], note: "abūja ... ana šimtišu illiku ... ana GIŠ.GU.ZA abija attašab: 'when my father went to his fate I sat on my father's throne'"}
    hints:
      - "A vassal 'faithful' (tarṣu) to father and son: compare Q 33:23 (men true to their covenant with God) and Q 23:8 (who keep their trusts and covenants); HB secondary: 2 Sam 9 and 1 Kgs 2:7 (kindness kept to a father's friend's house)."
      - "'§5'' (lines 39-46) is a fragmentary manuscript placed by the edition between §2 and §3; nothing taggable survives."
