# Full read, chunk 46: Hittite state treaties and decrees (CTH 53 - CTH 134), read from the hethiter.net / TLHdig editions (Hittite and Akkadian versions), by section and clause.
new_motifs:
  treaty-historical-prologue-rescue-of-vassal: {label: "A treaty's historical prologue recounts how the great king rescued, restored or spared the vassal (or his ancestor), making that past benefit the ground of the vassal's obligation", cluster: treaty}
  vassal-cries-i-am-your-servant-save-me: {label: "A threatened king sends his messenger to the great king: 'I am a servant of the king; save me!', and troops are sent to rescue him", cluster: treaty}
  treaty-tribute-weighed-by-overlords-weights: {label: "The vassal's yearly tribute in refined first-class gold is fixed and is to be weighed by the weights of the overlord's merchants", cluster: treaty}
  vassal-yearly-audience-with-overlord: {label: "The vassal must go up every year to the overlord's land to appear before his lord", cluster: treaty}
  treaty-warning-the-enemy-breaks-oath: {label: "If the vassal writes to the enemy 'the troops of Hatti are coming to attack you; be on your guard', he has broken the oath", cluster: treaty}
  treaty-vassal-feeds-overlords-troops: {label: "When the overlord's troops march into the vassal's towns he must give them food and drink", cluster: treaty}
  treaty-vassal-takes-only-what-king-gives: {label: "Whatever the vassal desires (people, captives, booty) he must ask of the great king; what the king gives he may take, what he does not give he may not take", cluster: treaty}
  treaty-refugees-set-on-road-to-overlord: {label: "A people or fugitive passing through the vassal's land must be set safely on the road to the overlord's land with good words, not turned toward the mountains or to another land", cluster: treaty}
  vassal-says-overlord-revived-a-dead-man: {label: "The restored vassal is described, or describes himself, as a dead man whom the great king brought back to life", cluster: treaty}
  moon-god-lord-of-oath-ishhara-queen-of-oath: {label: "Among the treaty witnesses the moon god is called 'lord of the oath' and Išḫara 'queen of the oath'", cluster: treaty}
  primeval-gods-invoked-as-treaty-witnesses: {label: "The primeval 'gods of eternity' (Nara, Namšara, Minki, Ammunki, Alalu, Anu, Antu, Enlil, Ninlil) are invoked as treaty witnesses", cluster: treaty}
  gods-of-habiru-and-mountain-folk-as-witnesses: {label: "The gods of the lulaḫḫi mountain-folk and the gods of the Habiru (ḫapiri) are named among the treaty witnesses", cluster: treaty}
  great-kings-word-not-to-be-cast-aside-or-broken: {label: "Formula: 'the word of the Tabarna, the Great King, is not to be cast aside and not to be broken'", cluster: treaty}
  heir-installed-at-dying-fathers-request: {label: "The overlord installs a vassal's son in his father's place because the father named him before the king while still alive, even though the son is sick", cluster: treaty}
  overlord-guarantees-vassals-future-son: {label: "The overlord promises that the son the vassal will beget shall be king after him and shall be protected as his father is", cluster: treaty}
  treaty-no-secret-envoy-to-rival-power: {label: "The vassal must not secretly send his messenger to a rival great king (Egypt) nor push away the overlord's hand and become that king's vassal", cluster: treaty}
  treaty-tribute-diverted-from-rival-power: {label: "The vassal's fathers paid tribute to Egypt; he must pay it to Hatti instead and 'not turn his eyes to another'", cluster: treaty}
  treaty-vassal-may-refuse-impossible-order: {label: "If the king secretly orders something that cannot be done, the vassal must protest on the spot 'I cannot do this and I will not do it'; failing to do a feasible order breaks the oath", cluster: treaty}
  witness-gods-see-and-hear-oath: {label: "The gods summoned to the oath are to stand as witnesses, to see it and to hear it", cluster: treaty}
  curse-oath-gods-pursue-oathbreaker: {label: "Curse formula: 'the oath gods shall hunt (pursue) you' (NĪŠ DINGIR.MEŠ parḫeškandu)", cluster: treaty}
  curse-seed-destroyed-from-dark-earth: {label: "Curse: the oath gods shall utterly destroy the oath-breaker and his seed from the dark earth", cluster: treaty}
  treaty-blessing-prosper-and-grow-old-in-kings-hand: {label: "Treaty blessing: the loyal vassal shall see good prosperity and grow old in the hand of the great king", cluster: treaty}
  rebel-vassal-begs-let-me-live-take-me-as-servant: {label: "A rebel vassal falls at the great king's feet and writes 'My lord, let me live, do not destroy me, take me as your servant, protect my person', and is pardoned", cluster: treaty}
  fellow-vassals-one-oath-one-mind: {label: "Fellow vassals bound by one oath must be of one mind: not harm, kill or seize one another, not shelter one another's runaways, and fight a common enemy together", cluster: treaty}
  fellow-vassals-disputes-to-overlord: {label: "A dispute between fellow vassals is not to be pursued by rash hostility but brought before the great king, who judges it and sets them back on the road", cluster: treaty}
  mankind-unreliable-rumour-against-king: {label: "'Because mankind is unreliable, rumours go round': if someone whispers that the king plans evil against the vassal, he must write to the king and wait, not act rashly", cluster: treaty}
  treaty-fugitive-free-man-kept-artisan-returned: {label: "A free fugitive from the vassal's land who reaches Hatti is not returned ('it is not right'), but a farmer or craftsman who fled without doing his work is seized and sent back", cluster: treaty}
  treaty-garrison-troops-to-be-cared-for: {label: "The vassal must look after the overlord's garrison troops as after his own person and house, support them and do them no harm", cluster: treaty}
  vassal-says-let-that-evil-happen: {label: "The oath is broken if the vassal hears of sedition and overlooks it, saying 'let that evil happen'", cluster: treaty}
  treaty-read-aloud-three-times-yearly: {label: "The treaty tablet is to be read aloud before the vassal three times every year", cluster: treaty}
  treaty-terms-not-reciprocal: {label: "The overlord declares that the treaty's words are not mutual (from one side and the other) but come from Hatti", cluster: treaty}
  vassal-must-not-take-bird-oracle-before-aid: {label: "When summoned to help the king, the vassal must not first take a bird oracle", cluster: treaty}
  great-kings-of-equal-rank-listed: {label: "The great king lists the kings of equal rank to himself: the kings of Egypt, Babylonia, Hanigalbat or Assyria (and Ahhiyawa)", cluster: kingship}
  god-appaliuna-of-wilusa: {label: "A god [A]ppaliuna (possibly Apollo) is named among the gods of Wiluša (perhaps Troy) invoked as treaty witnesses", cluster: treaty}
  underground-watercourses-as-witnesses: {label: "The underground watercourses (KASKAL.KUR, sinkholes) of a land are invoked among the treaty witnesses", cluster: treaty}
  stolen-treaty-tablet-reissued-under-seal: {label: "A treaty tablet that was stolen is replaced: the great king writes a second tablet, seals it with his own seal and gives it again", cluster: treaty}
  allied-royal-houses-be-one: {label: "Two royal houses bound by treaty are to be helpers to each other and to each other's sons: 'we and our house shall be one'", cluster: treaty}
  deserted-city-resettled-former-inhabitants-returned: {label: "A frontier city deserted for generations is rebuilt and resettled with prisoners of war, and later its former inhabitants are brought back to it", cluster: treaty}
  enemy-tribesmen-barred-from-city: {label: "Armed men and charioteers of a hostile neighbouring people may not go up into the frontier city: they dismount at the gate and go back, and lawsuits are heard outside the city", cluster: treaty}
  enemy-tribesman-in-city-jailed-plotter-killed: {label: "An enemy tribesman who marries a woman of the city will betray it; one found sleeping in the city is jailed and fined in cattle and sheep, and one who plots or speaks evil dies", cluster: treaty}
  enemy-slaves-kept-outside-city: {label: "A slave bought from the hostile people must not be brought into the city but kept outside or in the cattle stall; whose slave passes the gate is seized for the offence", cluster: treaty}
  joiner-of-enemy-forfeits-house-and-family: {label: "A townsman who joins the hostile people forfeits house, field, wives and children to the city, and such a man must be hunted down", cluster: treaty}
  dynastic-double-marriage-with-vassal: {label: "Two royal houses intermarry: the great king's daughter becomes queen in the vassal land and the prince takes the vassal's daughter; the daughter's offspring shall rule there", cluster: treaty}
  treaty-renewed-after-ancestors-tablet: {label: "A treaty is rewritten after the wording of the tablet the great king's grandfather gave to the vassal's ancestor, which the intervening kings had held to", cluster: treaty}
  curse-oath-gods-kill-and-burn: {label: "Curse: the oath gods shall kill the oath-breaker and burn him", cluster: treaty}
  overlord-takes-vassal-by-hand-as-brother-in-law: {label: "The great king takes the vassal by the hand, gives him his sister in marriage, makes him his brother-in-law and king of his land", cluster: treaty}
  vassals-defect-we-served-of-our-own-will: {label: "Vassals renounce allegiance: 'of our own free will we were your vassals; now we are your vassals no more', and go over to Egypt", cluster: treaty}
  traitor-asks-shall-i-protect-a-bastard: {label: "A vassal betrays his benefactor's son, asking 'shall I protect a bastard?', and is held up in a later treaty as a warning", cluster: treaty}
  treaty-merchant-embargo-against-enemy: {label: "The vassal's merchants may not go to the enemy land (Assyria), nor may its merchants enter or cross the vassal's land; one who comes is to be seized and sent to the king", cluster: treaty}
  ahhiyawa-king-erased-from-great-kings: {label: "The king of Ahhiyawa is written among the great kings of equal rank and then erased from the tablet", cluster: kingship}
  death-shall-be-your-limit: {label: "Loyalty formula: when things go hard for the king, the sworn man must die for him; 'death shall be your limit'", cluster: treaty}
  bite-the-dark-earth-for-king: {label: "In the king's time of need the sworn man must 'bite the dark earth and hold it' (stand his ground to the death)", cluster: treaty}
  no-excuse-they-forced-me: {label: "The sworn may not excuse joining rebels or traitors by saying 'they brought me by force' or 'they compelled me'", cluster: treaty}
  no-renouncing-oath-for-lack-of-reward: {label: "The sworn may not say 'the king has not rewarded me; I will withdraw from these oaths'", cluster: treaty}
  king-reproaches-absent-servant-escaped-alone: {label: "The king reproaches the sworn man: when things were hard he was not with him; did the king not escape alone from Niḫriya, stay behind alone at Alatarma?", cluster: treaty}
  oath-word-engraved: {label: "The oath is declared to be an engraved word ('this word shall be an engraved limma for you')", cluster: treaty}
  guardians-of-kings-life-not-of-evil: {label: "The sworn man with his wife, children and subjects must be watchmen and guardians of the king's life, never guardians or onlookers of evil", cluster: treaty}
  gods-watch-the-traitor: {label: "The gods are to keep watch on the deed of treason", cluster: treaty}
  graded-collective-punishment-city-house-man: {label: "If a city within the land sins it is killed with its men; if a house within a city sins that house dies with its people; if one man sins, he alone", cluster: law}
  hatti-egypt-mutual-alliance: {label: "Hatti and Egypt are to be allies to each other, protect each other and not go to one another with evil words", cluster: treaty}
units:
  # ---------------- CTH 53 ----------------
  - id: ane-cth-53-1-prologue
    tradition: ane-hittite
    title: Šuppiluliuma rescues Šarrupša of Nuḫašše (CTH 53 §§1-4, historical prologue)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    version: Akkadian version of the Tette treaty
    read: ["CTH 53 §1:1-§4:27"]
    tags:
      - {motif: treaty-historical-prologue-rescue-of-vassal, refs: ["CTH 53 §1:2-9", "CTH 53 §2:10-17"], note: "The great king 'did not keep silent' (ul askut) but came to Šarrupša's help"}
      - {motif: vassal-cries-i-am-your-servant-save-me, refs: ["CTH 53 §1:5-8"], note: "ardu ša šar māt Ḫatti anākū-mi ... šūzibanni-mi"}
      - {motif: kings-titles-and-epithets, refs: ["CTH 53 §1:1"], note: "umma dUTU-ši Šuppiluliuma LUGAL GAL LUGAL KUR Ḫatti UR.SAG: 'My Sun', great king, hero"}
    hints:
      - "The great king as rescuer of the servant who cries for help: compare Q 8:9 (they called on their Lord for help and He answered) and Q 3:123-125; the claim 'I am your servant, save me' echoes the prayers of Q 21:87-88 (Jonah). HB secondary: 2 Kgs 16:7 (Ahaz to Tiglath-pileser: 'I am your servant and your son; come up and save me')."
      - "The prologue that grounds obligation in past favour: compare Q 2:40 and 2:47 ('remember My favour which I bestowed on you, and fulfil My covenant') and Q 106:3-4; Deut 1-4 and Exod 20:2 are the classic HB analogues."
  - id: ane-cth-53-5-stipulations-military
    tradition: ane-hittite
    title: Tribute, audience, friend and enemy, wholehearted war (CTH 53 §§5-7)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    version: Akkadian version of the Tette treaty
    read: ["CTH 53 §5:28-§7:70"]
    tags:
      - {motif: treaty-tribute-weighed-by-overlords-weights, refs: ["CTH 53 §5:28-29"], note: "amount restored; ina NA4.ḪI.A LÚ.MEŠ DAM.GÀR ša KUR Ḫatti lišaqqilū"}
      - {motif: vassal-yearly-audience-with-overlord, refs: ["CTH 53 §5:30"]}
      - {motif: treaty-love-king-hate-his-enemy, refs: ["CTH 53 §6:31-32"], note: "itti salmiya lū salim, itti nakriya lū nakir"}
      - {motif: great-kings-of-equal-rank-listed, refs: ["CTH 53 §6:33-37"], note: "here only the places the king may be campaigning: Ḫurri, Egypt, Babylon (Karanduniaš), Aštata, Alše"}
      - {motif: treaty-fight-kings-enemy, refs: ["CTH 53 §6:44-50"], note: "ina kul libbišu: 'with his whole heart'"}
      - {motif: treaty-vassal-may-not-plead-ignorance, refs: ["CTH 53 §6:51-56"], note: "anāku ša māmīti u ša riksi-mi ... anāku lū lā idi-mi"}
      - {motif: treaty-warning-the-enemy-breaks-oath, refs: ["CTH 53 §6:57-60"], note: "lū dunnunāta-mi (emended): 'make yourself ready!' ... ištu māmīti ītetiq"}
      - {motif: single-hearted-loyalty, refs: ["CTH 53 §6:46", "CTH 53 §6:49"]}
      - {motif: treaty-breaker-punished-by-gods, refs: ["CTH 53 §7:70"], note: "only the formula 'he has broken the oath' survives; §7 list of lands largely restored"}
    hints:
      - "Friend of my friend, enemy of my enemy as covenant loyalty: compare Q 60:1, 58:22 and 5:51-56 (alliance and disavowal, walāʾ and barāʾ). Tribute: compare Q 9:29 (jizya 'from the hand, humbled')."
      - "The excuse 'I am under oath, but whether the enemy kills them or they kill him I do not care' is the treaty's picture of the half-hearted ally: compare Q 4:72-73, 9:42-49 and 33:18-20 (those who hang back from the fight); Deut 20:8."
      - "Leaking the campaign to the enemy: compare Q 60:1 (secretly sending affection, i.e. information, to the enemy; Ḥāṭib's letter) and Q 4:83."
  - id: ane-cth-53-8-mutual-aid
    tradition: ane-hittite
    title: Help against enemies and the feeding of Hittite troops (CTH 53 §§8-9)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    version: Akkadian version of the Tette treaty
    read: ["CTH 53 §8:71-§9:95"]
    tags:
      - {motif: treaty-vassal-must-aid-overlord-at-once, refs: ["CTH 53 §8:71-77"], note: "if Tette cannot go, his son, brother or marijannu-man must go 'quickly' (ḫamutta)"}
      - {motif: treaty-overlord-promises-military-help, refs: ["CTH 53 §9:78-85"], note: "Tette's plea '[co]me (to my help)' and the prince or great lord (DUMU.LUGAL ù bēlu GAL) sent; largely restored"}
      - {motif: treaty-vassal-feeds-overlords-troops, refs: ["CTH 53 §9:87-90"], note: "food and drink are restored after the Duppi-Teššup parallel"}
      - {motif: treaty-breaker-punished-by-gods, refs: ["CTH 53 §9:93-95"], note: "a Hittite who seeks evil against Tette breaks the oath: restored"}
    hints:
      - "Mutual aid within an alliance: compare Q 8:72 (help those who ask help in religion, except against a people with whom you have a treaty) and Q 9:4 (those who did not aid anyone against you). HB secondary: 1 Kgs 22:4 'I am as you are, my people as your people'."
  - id: ane-cth-53-10-fugitives-and-requests
    tradition: ane-hittite
    title: Captives, instigators, Nuḫašše folk in Hatti, refugees and requests (CTH 53 §§10-14)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    version: Akkadian version of the Tette treaty
    read: ["CTH 53 §10:96-§14:138"]
    tags:
      - {motif: treaty-return-fugitives, refs: ["CTH 53 §10:96-105", "CTH 53 §13:128-132"], note: "captives (NAM.RA) of Ḫurri, Nija etc. who flee into Tette's land: Tette shall seize them and send them back; heavily restored"}
      - {motif: treaty-vassal-may-not-plead-ignorance, refs: ["CTH 53 §10:100-103"], note: "restored: 'I am a man of treaty and oath, but I want to know nothing; let them live in my land'"}
      - {motif: treaty-seize-and-deliver-instigators, refs: ["CTH 53 §11:106-110"], note: "anyone who incites Tette to [ev]il (ḪUL-nāti) must be seized and sent to the king"}
      - {motif: treaty-vassal-takes-only-what-king-gives, refs: ["CTH 53 §12:111-120", "CTH 53 §14:133-138"], note: "§14: minumê NUN ... lilqe ... lū lā ileqqe: what the prince gives he may take, what he does not give he must not take; taking a refused person by stealth (išarriq) breaks the oath"}
      - {motif: treaty-refugees-set-on-road-to-overlord, refs: ["CTH 53 §13:121-127"], note: "almost entirely restored after the Duppi-Teššup parallel (CTH 62 §17)"}
    hints:
      - "The return of fugitives was the most bitter clause of the Ḥudaybiya treaty; compare Q 60:10 (believing women who emigrate are not to be returned to the disbelievers) and Q 4:97-100; HB secondary: Deut 23:16-17 (do not hand back an escaped slave)."
      - "Taking only what the lord grants: compare Q 59:6-7 (the fayʾ is distributed by God and the Messenger: 'take what the Messenger gives you and refrain from what he forbids you')."
  - id: ane-cth-53-15-dead-man-revived
    tradition: ane-hittite
    title: "As I revived a dead man (CTH 53 §15)"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    version: Akkadian version of the Tette treaty
    read: ["CTH 53 §15:139-141"]
    tags:
      - {motif: vassal-says-overlord-revived-a-dead-man, refs: ["CTH 53 §15:140"], note: "mīta [...]-sú: 'a (politically) dead man [I brought to life]'; the verb is restored. §16 is lost"}
      - {motif: vassal-king-installed-on-throne, refs: ["CTH 53 §15:139-141"], note: "ana KUR-šu ummaššeršu: 'I sent him off to his land'"}
    hints:
      - "Compare Q 6:122 ('is he who was dead and We gave him life ... like one in darkness?') and Q 2:28; Ezek 37 as HB secondary. CTH 92 §6 uses the same image in the vassal's own mouth."
  - id: ane-cth-53-17-divine-witnesses
    tradition: ane-hittite
    title: The gods of Hatti, Kizzuwatna and Nuḫašše as witnesses (CTH 53 §§17-20)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    version: Akkadian version of the Tette treaty
    read: ["CTH 53 §17:142-§20:154"]
    tags:
      - {motif: gods-listed-as-treaty-witnesses, refs: ["CTH 53 §17:143", "CTH 53 §18:144-145", "CTH 53 §20:148", "CTH 53 §20:151-153"], note: "the storm god's many local forms; the Sun of heaven and Sun goddess of Arinna (§17:142) are restored"}
      - {motif: storm-god-of-mount-hazzi, refs: ["CTH 53 §17:143"], note: "ḪUR.SAG Ḫa]zzi, partly restored"}
      - {motif: moon-god-lord-of-oath-ishhara-queen-of-oath, refs: ["CTH 53 §19:146"], note: "[30] EN māmīti, Išḫara šarrat māmīti; Ḫepat 'queen of heaven'"}
      - {motif: mountain-deified, refs: ["CTH 53 §20:149"], note: "ḪUR.SAG Lablani, Šarijana, Pišaiša"}
      - {motif: gods-of-habiru-and-mountain-folk-as-witnesses, refs: ["CTH 53 §20:150"], note: "DINGIR.MEŠ lulaḫḫi DINGIR.MEŠ ḫapiri"}
      - {motif: gods-of-ugarit-sworn-alongside-overlords-gods, refs: ["CTH 53 §20:153"], note: "all male and female gods of Nuḫašše, the vassal land"}
      - {motif: primeval-gods-invoked-as-treaty-witnesses, refs: ["CTH 53 §20:154"], note: "ilānū ša dārātim: 'gods of eternity': Nara, Namšara, Minki, Tuḫuši, Ammuki, Ammizzadu, Alalu, Antu, Anu, Apantu, Enlil, Ninlil"}
      - {motif: thousand-gods-of-hatti, refs: ["CTH 53 §20:151"], note: "the 'all the gods of Hatti' formula; the phrase 'thousand gods' itself is not preserved here"}
    hints:
      - "Treaty gods as witnesses vs. the Quran's single witness: 'God is witness over what we say' (Q 12:66, 28:28), 'you have made God your surety' (Q 16:91), 'sufficient is God as witness' (Q 4:79, 13:43). Oaths by the moon: Q 74:32, 84:18, 91:2."
      - "The roll-call of local storm gods and city goddesses is the kind of plurality the Quran polemicises against (Q 12:39-40 'many lords or God the One?', 53:19-23, 71:23)."
  - id: ane-cth-53-21-witnesses-curses-blessings
    tradition: ane-hittite
    title: Mountains, rivers, heaven and earth as witnesses; curse and blessing (CTH 53 §§21-22)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Akkadian"
    version: Akkadian version of the Tette treaty
    read: ["CTH 53 §21:155-§22:164"]
    tags:
      - {motif: mountains-rivers-sea-winds-clouds-as-witnesses, refs: ["CTH 53 §21:155-156"], note: "ḪUR.SAG.MEŠ ÍD.MEŠ PÚ.MEŠ A.AB.BA GAL AN u KI IM.MEŠ urpī ... ana anni riksi u ana māmīti lū šībūtum"}
      - {motif: oath-sworn-by-heaven-and-earth, refs: ["CTH 53 §21:155"]}
      - {motif: treaty-oathbreaker-destroyed-with-household, refs: ["CTH 53 §21:157-160"], note: "'all the words of treaty and oath written on this tablet' (ina libbi ṭuppi anniti šaṭrat); wives, sons, grandsons, house, city, land and all his goods"}
      - {motif: treaty-keeper-guarded-with-household, refs: ["CTH 53 §21:161-162"], note: "the verb 'guard' is restored"}
      - {motif: scribal-colophon, refs: ["CTH 53 §22:163-164"], note: "§22:164 is printed with the edition's collated footnotes run together; its German is only '[Beendet]'"}
    hints:
      - "Heaven, earth and mountains as parties to covenant: compare Q 33:72 (the trust offered to the heavens, the earth and the mountains, which refused it), Q 41:11 (heaven and earth: 'we come willingly'), Q 44:29 (heaven and earth did not weep for them) and the mountain raised over Israel when the covenant was taken (Q 2:63, 2:93, 7:171). HB secondary: Deut 4:26, 30:19, 32:1 and Isa 1:2 (heaven and earth called as witnesses)."
      - "Curse on the whole household vs. Quranic individual responsibility: compare Q 6:164, 17:15, 35:18 ('no bearer bears another's burden') and Deut 24:16 / Ezek 18; blessing and curse set side by side as in Deut 28 and Q 14:7 ('if you are grateful I will increase you')."
      - "Keeping 'all the words written on this tablet': compare Q 5:1 ('fulfil the contracts'), 17:34 ('fulfil the covenant; the covenant will be asked about') and Deut 27:26."
  # ---------------- CTH 57 ----------------
  - id: ane-cth-57-1-pijassili-decree
    tradition: ane-hittite
    title: Muršili's tablet for Pijaššili of Kargamiš and his descendants (CTH 57)
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Hittite"
    read: ["CTH 57 §1:1-§3:15"]
    tags:
      - {motif: treaty-binds-future-generations, refs: ["CTH 57 §2:2-4"], note: "zilatija ... išḫiul: for all the future, for his sons and grandsons, whichever descendant takes the 'great place' in Kargamiš"}
      - {motif: no-replacement-of-heir-by-brother, refs: ["CTH 57 §2:5-6"], note: "the tuḫkanti (crown prince) of His Majesty alone is to rank above the king of Kargamiš; partly restored"}
      - {motif: great-kings-word-not-to-be-cast-aside-or-broken, refs: ["CTH 57 §3:11-12"], note: "AWĀT tabarna LUGAL.GAL ŠA LĀ NADĀYAM ŠA LĀ ŠEBĒRI"}
      - {motif: treaty-curse-on-whoever-alters-it, refs: ["CTH 57 §3:13-14"], note: "kuiš=man=kan waḫnuzi ... LÚDI-ŠU ešdu: whoever alters it shall have the storm god, the Sun goddess of Arinna and all the gods as his legal adversary"}
      - {motif: scribal-colophon, refs: ["CTH 57 §3:15"], note: "Tattija LÚDUB.SAR IŠṬUR"}
    hints:
      - "The great king's word that may not be cast aside or broken: compare Q 6:34 and 6:115 ('none can change His words'), 10:64, 18:27; and the sin of altering a bequest, Q 2:181. HB secondary: Esth 8:8, Dan 6:9 (the law of the Medes and Persians cannot be revoked)."
      - "Whoever alters it has the gods as his legal adversary: compare Q 4:105-107 and the prophet as plaintiff against his people, Q 25:30."
  # ---------------- CTH 62 ----------------
  - id: ane-cth-62-1-aziru-prologue
