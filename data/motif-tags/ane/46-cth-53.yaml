      - {motif: treaty-binds-future-generations, refs: ["CTH 62 §7:59", "CTH 62 §7:67"], note: "sworn to the king, Hatti, my sons and grandsons; zilatiwa 'in future'"}
      - {motif: overlord-guarantees-vassals-future-son, refs: ["CTH 62 §7:62-66"]}
      - {motif: treaty-tribute-weighed-by-overlords-weights, refs: ["CTH 62 §7:68-70"], note: "300 shekels refined gold IŠTU NA4.ḪI.A"}
      - {motif: treaty-tribute-diverted-from-rival-power, refs: ["CTH 62 §7:71-73"], note: "tamēdani IGI.ḪI.A-wa lē neyattati: 'do not turn your eyes to another'; tuel addus ark[amm]an INA KUR Mizri piddaer"}
