      - {motif: boaster-flees-at-dogs-barking, refs: ["ETCSL 6.1.02 A.2.69:119-126"], note: "the fox boasts to his wife: let us crush Unug like a leek, strap Kulaba on like sandals; 600 uš from the city the dogs howl and he runs home"}
      - {motif: tell-lie-tell-truth, refs: ["ETCSL 6.1.02 A.2.71:128"], note: "lul dug4-ga-ab zid dug4-ga-ab lul ba-e-sig10-ge5 'tell a lie, then tell the truth: it will be counted a lie'"}
      - {motif: liar-is-messenger-from-far-away, refs: ["ETCSL 6.1.02 A.2.72:129"], note: "lul dug4-dug4 ra-gaba ki ba9-ra2"}
      - {motif: donkey-born-to-bray-not-run, refs: ["ETCSL 6.1.02 A.2.75:133-134"], note: "anše-ĝu10 kaš4 kar-re-de3 nu-mu-un-tum2 eme ak-da mu-un-tum2"}
    hints:
      - "Compare 1 Kgs 20:11 ('let not him who girds on his armour boast like him who takes it off') and Isa 37:24-29 (the boaster turned back) for the fox's boast."
      - "Compare Ezek 16:44 ('like mother, like daughter') and Prov 12:19 (the lying tongue lasts but a moment)."
      - "Compare Num 22:28-30 (the ass) and Isa 1:3 (the ox knows its owner, the ass its master's crib)."
  - id: ane-etcsl-6-1-02-a-ox-gala-dog
