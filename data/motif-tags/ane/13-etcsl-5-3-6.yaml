      - {motif: fish-taboo-not-offered-in-shrines, refs: ["ETCSL 5.9.1 A:94", "ETCSL 5.9.1 A:106"], note: "niĝ2-gig eš3 iri sa2-dug4 nu-ĝa2-ĝa2 'taboo, not placed as offering in the city's shrines' (sting-ray); ku6 dug3-ga i3-ĝal2 niĝ2-gig-ga 'tasty yet an abomination'"}
      - {motif: abomination-nig-gig-to-god-or-king, refs: ["ETCSL 5.9.1 A:94", "ETCSL 5.9.1 A:106"]}
      - {motif: gods-delight-in-the-catch, refs: ["ETCSL 5.9.1 A:45-52", "ETCSL 5.9.1 C:16-17"], note: "Suen, Dumuzid ḫe2-en-da-ḫul2-ḫul2; {d}nanše ... ga-ša-an {lu2}šu-KU6-da 'Nanše, lady of the fishermen'"}
      - {motif: predators-of-the-fish-listed, refs: ["ETCSL 5.9.1 C:1-12"], note: "akane, ubure, egret (kiši6-bar), kib birds and the kuda crocodile: šu-še3 ba-e-la2-e 'you would dangle from its claws'"}
      - {motif: no-escape-face-towards-me-refrain, refs: ["ETCSL 5.9.1 C:13-15"], note: "ud zal-zal-la za-e ugu-ĝu10-uš ĝa2-nu 'time is passing, come to me'"}
