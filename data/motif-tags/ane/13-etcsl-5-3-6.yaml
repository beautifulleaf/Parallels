  - id: ane-etcsl-5-6-1-shuruppag-first-instructions
    tradition: ane-sumerian
    title: Instructions of Shuruppag, first series of precepts
    corpus: ane
    original: true
    tagger: Claude (model), reading the Sumerian
    read: ["ETCSL 5.6.1 14-75"]
    tags:
      - {motif: warning-against-surety, refs: ["ETCSL 5.6.1 19-20"], note: "šu du8-a nu-e-tum3 lu2-bi ša-ba-e-dab5-be2 'do not stand guarantee: that man will have a hold on you'"}
      - {motif: field-not-placed-by-road-or-public-square, refs: ["ETCSL 5.6.1 15-18"], note: "no field on a road, no well in your field ('people will damage it'), no house by the public square"}
      - {motif: meddler-seizes-dog-by-ears, refs: ["ETCSL 5.6.1 22-27", "ETCSL 5.6.1 35"], note: "keep away from another's quarrel; du14-de3 lu2-ki-inim-ma nam-ba-e-ku4-ku4 'do not let the quarrel make you a witness'"}
      - {motif: prohibition-murder-adultery-theft-false-witness, refs: ["ETCSL 5.6.1 28-31", "ETCSL 5.6.1 33-34", "ETCSL 5.6.1 40"], note: "niĝ2 nam-mu-zuḫ-zuḫ 'do not steal'; e2 na-a-an-ni-buru3-e-en 'do not break into a house'; ki-sikil dam tuku-da 'married young woman'; šu-zu uš2-am3 'your hand in blood'"}
      - {motif: thief-is-a-lion-until-caught, refs: ["ETCSL 5.6.1 30"], note: "ni2-zu piriĝ na-nam ul-dab5 saĝ na-nam 'the thief is a lion, caught he is a slave'"}
      - {motif: do-not-sit-alone-with-married-woman, refs: ["ETCSL 5.6.1 33-34"], note: "dumu-ĝu10 dagan-na lu2 dam tuku-da dur2 nam-bi2-e-ĝa2-ĝa2; inim sig-ga maḫ-am3 'slander is serious'"}
      - {motif: let-stranger-praise-you, refs: ["ETCSL 5.6.1 37", "ETCSL 5.6.1 67"], note: "ka nam-tar-tar-re-e-en inim-zu ĝar-ra-am3; in the beer hall like a liar"}
      - {motif: eat-no-stolen-food, refs: ["ETCSL 5.6.1 39"], note: "lu2-zuḫ-a ninda zuḫ-a nam-mu-da-gu7-e"}
      - {motif: fivefold-fourfold-restitution-for-stolen-livestock, refs: ["ETCSL 5.6.1 41"], note: "only 'you will be made to restore the ox, restore the sheep' (gud ša-ba-ri-ib-su-su udu ...); no multiple stated"}
      - {motif: careless-words-become-a-trap, refs: ["ETCSL 5.6.1 42-43"], note: "eĝer-bi-še3 ĝiš-par3-gin7 ši-me-ši-ib2-la2-e 'later it will lay a trap for you'"}
      - {motif: do-not-travel-by-night, refs: ["ETCSL 5.6.1 47"], note: "kaskal ĝi6 na-an-du šag4-bi sag9 ḫul-a 'night hides good and evil'"}
      - {motif: sex-with-slave-girl-forbidden, refs: ["ETCSL 5.6.1 49"]}
      - {motif: causeless-curse-does-not-alight, refs: ["ETCSL 5.6.1 50"], note: "here the opposite image: a strong curse rebounds on the curser; aš2 a2 zig3 na-ab-bal-e šu-uš im-ši-ni10-ni10 'do not curse violently: it returns to you'"}
      - {motif: debtor-not-driven-away, refs: ["ETCSL 5.6.1 53"], note: "ur5 tuku na-an-bad-e 'do not drive away a debtor'"}
      - {motif: arrogant-housemate-makes-life-slavery, refs: ["ETCSL 5.6.1 54-57"], note: "neighbours shout ši-du-un ši-du-un 'there you go!'"}
      - {motif: rape-of-daughter-forbidden-courtyard-knows, refs: ["ETCSL 5.6.1 62"], note: "dumu lu2-ra ĝiš3 a2 zig3 na-an-ne-en kisal-e bi2-zu-zu"}
      - {motif: slanderers-shifty-eyes, refs: ["ETCSL 5.6.1 65-66"], note: "lu2 inim sig-ga-ke4 igi {ĝiš}bal-gin7 'the slanderer's eye moves like a spindle'"}
      - {motif: sun-god-alone-equals-many, refs: ["ETCSL 5.6.1 68-72"], note: "{d}utu dili na-nam dili-ni lu2 šar2-ra-am3 'Utu is one; alone he is the equal of many'; side with the warrior and with Utu"}
    hints:
      - "Compare Prov 6:1-5, 11:15, 17:18, 22:26 (do not stand surety) and Prov 26:17 (meddling in another's quarrel)."
      - "Compare Exod 20:13-16 and Deut 5:17-20 (do not murder, commit adultery, steal); Exod 21:37 / 22:3 (restitution for ox and sheep)."
      - "Compare Prov 6:30-31 (the thief caught must repay sevenfold), Prov 5:3-14 and 7:6-27 (keep from the married woman), Prov 27:2 (let another praise you)."
      - "Compare Prov 26:2 (a causeless curse does not alight) and Ps 109:17-18 (he loved cursing, let it come on him); Deut 15:7-11, Exod 22:24 (the debtor)."
      - "Compare Deut 22:28-29 and Exod 22:15 (rape or seduction of a girl); Lev 19:20 (sex with a slave woman)."
      - "Compare Deut 6:4 / Zech 14:9 (the LORD is one) and Ps 118:6 / Rom 8:31 (on the side of God against many) for 'Utu is one, alone the equal of many'."
  - id: ane-etcsl-5-6-1-shuruppag-second-instructions
