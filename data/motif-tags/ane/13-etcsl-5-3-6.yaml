      - {motif: heaven-far-earth-precious, refs: ["ETCSL 5.6.1 128-130"], note: "an su3-ud-dam ki kal-kal-la-am3"}
      - {motif: gather-like-slave-eat-like-queen-at-harvest, refs: ["ETCSL 5.6.1 131-133"], note: "geme2-gin7 de5-ga-ab egir2-gin7 gu7-a"}
      - {motif: eat-modestly-greed-kills, refs: ["ETCSL 5.6.1 134-135"], note: "aš2 dug4-dug4-ge bar ši-in-dar igi-tum3 la2 saĝ ĝiš im-ra-ra 'cursing only cuts the skin, greedy eyes kill'"}
      - {motif: prayer-is-cool-water-for-the-heart, refs: ["ETCSL 5.6.1 140-141"], note: "inim šudu3-de3-ĝu10 ḫe2-ĝal2-la-am3 a-ra-zu a sedx-da šag4-ge im-sedx-e 'prayer is cool water that cools the heart'"}
      - {motif: arrogant-speech-sickens-like-herb, refs: ["ETCSL 5.6.1 138"], note: "inim dirig ... u2 lipiš gig-ga-am3"}
