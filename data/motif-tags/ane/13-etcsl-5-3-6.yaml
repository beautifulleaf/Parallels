      - {motif: fulfilment-repeats-command-verbatim, refs: ["ETCSL 5.6.5 18-30"], note: "the king repeats the plaintiffs' speech word for word"}
      - {motif: wise-verdict-dissatisfies-all-parties, refs: ["ETCSL 5.6.5 89-92"], note: "lu2 dam-a-ni ḫul an-gig-ga-am3 dam-a-ni-ta ba-an-da-ĝen 'the man who hated his wife left his wife'"}
