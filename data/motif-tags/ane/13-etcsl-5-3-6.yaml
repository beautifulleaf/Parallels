      - {motif: wise-father-instructs-son, refs: ["ETCSL 5.6.1 4-9"], note: "šuruppag{ki} ĝeštug2 tuku inim galam inim zu-a ... dumu-ni-ra na na-mu-un-de5-de5"}
      - {motif: flood-hero-as-son-receiving-wisdom, refs: ["ETCSL 5.6.1 7-8"], note: "zi-ud-su3-ra2, son of Šuruppag son of ubara-tu-tu: the flood hero of the Sumerian flood story"}
      - {motif: fathers-instruction-mothers-torah, refs: ["ETCSL 5.6.1 9-13"], note: "dumu-ĝu10 na ga-de5 ... ĝizzal ḫe2-em-ši-ak 'my son, let me instruct you, pay attention'; na de5 ab-ba niĝ2 kal-la-am3 'an old man's instruction is precious'"}
