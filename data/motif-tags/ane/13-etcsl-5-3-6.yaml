      - {motif: house-of-rest-without-quarrel, refs: ["ETCSL 5.9.1 A:32-33"], note: "lu2 nu2-a ba-ra-ab-zi-zi lu2 tuš-a du14 ba-ra-mu2-mu2 'none who sleeps there is disturbed, none who sits there quarrels'"}
