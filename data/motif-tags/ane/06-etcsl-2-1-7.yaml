      - {motif: king-humbles-himself-and-is-spared, refs: ["ETCSL 2.2.4 T:310-313"], note: "sun5-na šita-ba ki la2-a-ne2-eš2 ... giri17 ki su-bu-da-ne2-eš2: because the humble one prostrated himself"}
