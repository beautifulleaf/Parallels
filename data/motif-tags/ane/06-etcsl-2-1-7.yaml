      - {motif: valleys-raised-mountains-leveled, refs: ["ETCSL 2.2.4 S:285", "ETCSL 2.2.4 S:289"], note: "Interpretive: tur-re maḫ dugud-da 'the small to be as weighty as the great'; kaskal suḫ3-a ĝiri3 ĝa2-ĝa2 'to travel the disordered roads'"}
      - {motif: darkness-lifted-from-land, refs: ["ETCSL 2.2.4 S:292-293"], note: "ud kalam-ma niĝ2-gig-ga e3-a šag4-ba ud ĝa2-ĝa2, ud niĝ2 ku10-ku10 kalam-ma zi-zi niĝ2-zi-ĝal2 ḫul2-le"}
