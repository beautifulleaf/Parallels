      - {motif: be-fruitful-and-multiply, refs: ["ETCSL 2.2.4 Q:255-258"], note: "u8-e sila4-a im-mi-ib-tu-ud-da tur3-e bi2-ib-si-a ... amaš daĝal bi2-ib-tag-ga: ewes and goats bear, pens widened"}
      - {motif: lament-turns-to-praise, refs: ["ETCSL 2.2.4 R:263-266"], note: "šag4 ba-ši-ḫuĝ-ĝa2-am3 bar ba-ši-im-sed4-da-am3 ... a2 kuš2-a igi bi2-in-du8-uš-am3 ib2-ta-an-ed3-de3-eš-am3: they lifted up those sunk in exhaustion"}
      - {motif: restoration-of-fortunes, refs: ["ETCSL 2.2.4 R:267-274"], note: "iri du6-du6-da ba-ĝar-ra-za ki-bi-še3 in-ĝar-re-eš-am3: your city razed to ruin-mounds restored"}
      - {motif: king-commissioned-to-rebuild-temple, refs: ["ETCSL 2.2.4 R:275-282", "ETCSL 2.2.4 Q:261"], note: "{d}iš-me-{d}da-gan ... u2-bi kug-ge a-bi sikil-e: to purify its food and water, set right the scattered rites; Išme-Dagan brought in for establishing justice"}
      - {motif: daily-offering-restored, refs: ["ETCSL 2.2.4 R:281-282"], note: "šukur2-ud šub-ba eša zid2 dub-dub-bu ... {ĝiš}banšur ninda lu ninda šar2-re-da: daily rations, fine flour, loaves on the table"}
    hints:
      - "Compare Jer 33:12-13 and Ezek 36:37-38 (flocks fill the ruined cities) and Ps 118:24 (this is the day YHWH has made)."
      - "Compare Ezra 6:16-22 and Neh 12:30 (the cult purified and resumed after rebuilding) and Exod 25:30 (bread on the table)."
  - id: ane-etcsl-2-2-4-s-era-of-harmony
