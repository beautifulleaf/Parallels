# Full read of the ANE corpus, chunk 6: ETCSL 2.1.7 (Gudea cylinders A and B),
# ETCSL 2.2.3 (Lament for Sumer and Urim), ETCSL 2.2.4 (Lament for Nibru).
# Read line by line in the ETCSL Sumerian composite transliteration.
new_motifs:
  god-orders-temple-in-dream: {label: "A god appears to a ruler in a night dream and tells him to build the god's house", cluster: temple}
  dreamer-cannot-understand-dream: {label: "The dreamer cannot grasp the meaning of a divine dream and goes to an interpreter", cluster: revelation}
  dream-interpreted-item-by-item: {label: "Each figure and object of a symbolic dream is identified in turn by the interpreter (the man is X, the woman is Y)", cluster: revelation}
  giant-composite-divine-figure: {label: "A god appears as a figure as huge as heaven and earth, with a god's head, bird wings and a flood-storm for lower body, lions lying at his sides", cluster: theophany}
  goddess-reads-star-tablet: {label: "A goddess with a silver stylus consults a tablet of propitious stars to announce the time for building", cluster: divination}
  god-draws-temple-plan-on-tablet: {label: "A god draws the ground plan of a temple on a lapis lazuli tablet", cluster: temple}
  fated-brick-moulded-by-king: {label: "The king himself makes the first, 'fated' brick of the temple in a holy brick mould, amid music and ritual", cluster: temple}
  king-carries-builders-basket: {label: "The king carries the builder's earth basket on his head like a holy crown", cluster: temple}
  god-stands-at-sleepers-head: {label: "The god comes and stands at the head of the sleeper, touches him and speaks", cluster: revelation}
  divine-fire-touch-as-sign: {label: "The god promises to touch the dreamer's arm with fire as a sign confirming his commission", cluster: revelation}
  woke-and-it-was-a-dream: {label: "The dreamer wakes, trembling, and realizes it was a dream", cluster: revelation}
  extispicy-confirms-word: {label: "A divine message is confirmed by inspecting the entrails of a kid (extispicy), which proves favourable", cluster: divination}
  god-self-praise-aretalogy: {label: "A god recites his own titles, deeds, weapons and shrines in the first person ('I am ...')", cluster: theophany}
  god-promises-abundance-for-temple: {label: "The god promises rain, full canals and rich harvests once the king builds his temple", cluster: temple}
  social-peace-while-temple-built: {label: "While the temple is built quarrels cease: no mother scolds her child, no master strikes his slave, legal complaints are set aside", cluster: temple}
  city-purified-before-building: {label: "Before building, the ruler purifies the city with fire and expels the ritually unclean", cluster: cult}
  labour-levy-for-temple: {label: "The ruler imposes a labour levy on his whole land, the clans marching under their gods' standards, to build the temple", cluster: temple}
  nations-supply-temple-materials: {label: "Distant peoples come with timber, stone and metals from their mountains to build a god's temple", cluster: temple}
  cedar-felled-in-forbidden-mountain: {label: "The ruler enters the mountain of cedars where no one goes and fells its cedars", cluster: temple}
  temple-foundations-reach-abzu: {label: "The temple's foundation pegs are driven down to the subterranean fresh waters (abzu)", cluster: temple}
  temple-built-by-gods-together: {label: "Several gods each perform a part of the temple's founding (foundation pegs, bricks, oil, oracles)", cluster: temple}
  temple-likened-to-cosmic-mountain: {label: "The temple is said to rise like a great mountain filling the space between heaven and earth", cluster: temple}
  named-stelae-at-temple: {label: "Stelae set up around the temple are each given a sentence-name praising the god's favour to the king", cluster: temple}
  monster-guardians-at-temple-gates: {label: "Figures of dragons, lions, wild bulls and other monsters guard the temple doors and gates", cluster: temple}
  slain-monsters-as-temple-trophies: {label: "Monsters slain by the warrior god (seven-headed serpent, six-headed ram, bison, fish-man) are set up in the temple as trophies", cluster: combat}
  temple-terror-covers-lands: {label: "The fearsome radiance of the temple covers all lands like a garment", cluster: temple}
  temple-provisions-lavish: {label: "The temple's kitchens, brewery, cow-pen and storehouses pour out butter, cakes and beer as abundant as the Tigris", cluster: temple}
  god-arrives-at-new-temple: {label: "The god enters his newly built house in procession and takes possession of it", cluster: temple}
  consort-goddess-enters-bedchamber: {label: "The god's consort enters her bedchamber in the new temple and rests with him on the bed", cluster: cult}
  divine-temple-staff-installed: {label: "Lesser gods are presented to the temple's lord one by one as its officials, each with his listed duties (doorkeeper, butler, general, musician, farmer)", cluster: temple}
  slave-equal-to-master-seven-days: {label: "For seven days of festival the slave woman is equal to her mistress and the slave walks beside his master", cluster: law}
  king-remits-debts: {label: "The king remits debts and cleanses (releases) all hands", cluster: law}
  temple-fate-decreed: {label: "A god decrees a good fate for the new temple and its brickwork", cluster: temple}
  goddess-as-mother-and-father-of-king: {label: "The king tells a goddess: 'I have no mother, you are my mother; I have no father, you are my father'", cluster: kingship}
  personal-god-holds-kings-hand: {label: "The king's personal god goes with him and holds him by the hand", cluster: kingship}
  dinner-of-gods-at-temple-inauguration: {label: "At the temple's inauguration the high gods are seated in order of honour at a banquet", cluster: cult}
  city-destruction-decreed-by-gods: {label: "The great gods in council decree the destruction of a city and its land", cluster: lament}
  gods-desert-their-cities: {label: "City after city its god 'takes an unfamiliar path' away from his beloved dwelling and abandons it", cluster: lament}
  goddess-weeps-for-destroyed-city: {label: "The city's goddess weeps bitterly: 'Alas, the destroyed city, my destroyed house'", cluster: lament}
  god-brings-enemy-from-mountains: {label: "The chief god himself brings down a foreign people (Gutians, Elamites) from the mountains to destroy his land", cluster: lament}
  family-bonds-dissolve-in-catastrophe: {label: "In the catastrophe the father disowns his wife and the mother her child ('This is not my child')", cluster: lament}
  nature-reversal-curse: {label: "Destruction undoes fertility: brackish water in rivers, weeds in fields, no lambs in the fold, no churning song", cluster: lament}
  en-priest-dragged-to-enemy-land: {label: "The en-priest(ess) is snatched from the Ĝipar shrine and carried off to enemy territory", cluster: lament}
  kingship-not-eternal: {label: "A city is granted kingship but not an eternal reign: every dynasty's turn must end", cluster: kingship}
  divine-son-intercedes-with-father: {label: "A city's god weeps before his father, the chief god, asking him to restore his destroyed city", cluster: lament}
  storm-sent-back-against-enemies: {label: "Plea that the destroying storm retreat to its home and blow instead on the foreign lands", cluster: lament}
  may-not-change-refrain: {label: "Refrain: may the gods not change (nam-kur2-re) the good order restored to the land", cluster: lament}
  dove-flies-from-window: {label: "A goddess flees her temple like a pigeon flying from the window", cluster: lament}
  no-one-intercedes-for-city: {label: "No one touches the god's arm, no one intercedes for the ruined city", cluster: lament}
  king-commissioned-to-rebuild-temple: {label: "After the catastrophe the chief god commands a named king, his beloved shepherd, to rebuild the ruined temple", cluster: temple}
  ideal-age-of-social-harmony: {label: "The god ordains a time when no one speaks hostile words, son respects father, younger brother respects elder, weak and strong are not enslaved", cluster: kingship}
  mourners-taught-what-to-say: {label: "The lament instructs the mourner what words to speak to the god ('Say to him: My lord, how long?')", cluster: lament}
  offering-before-prayer: {label: "Before praying the ruler offers bread and pours cold water, then goes to the god to pray", cluster: cult}
  prayer-heard-formula: {label: "Formula: his call was heard, and the god accepted his prayer and supplication", cluster: cult}
  gift-of-chariot-to-god: {label: "A ruler builds and presents a decorated chariot with its draught animal to his god", cluster: cult}
  name-written-on-standard: {label: "The king makes the god's beloved standard and writes his own name on it", cluster: cult}
  drum-named-instrument-of-god: {label: "A named balaĝ drum is the god's beloved instrument, brought before him and installed among his servants", cluster: cult}
  god-loves-gifts: {label: "The god is called 'the warrior who loves gifts' and is approached with presents", cluster: cult}
  fifty-names-of-god: {label: "A god is endowed with fifty powers or names by the high gods", cluster: theophany}
  built-as-commanded: {label: "The builder declares he built the god's house exactly as he was commanded", cluster: temple}
  new-moon-image-of-temple: {label: "The temple is likened to the new moon (crescent) shining in the sky", cluster: temple}
  temple-mooring-post-of-land: {label: "The temple is called the 'great mooring post' (dim gal) of the land, binding heaven and earth", cluster: temple}
  seven-squares-laid-out: {label: "The builder marks out the temple plan in seven successive squares, each named with an image", cluster: temple}
  seven-day-completion-of-work: {label: "A building task is completed on the seventh day", cluster: temple}
  throne-established-by-god: {label: "The god makes the king's throne firm so that no one can remove it", cluster: kingship}
  rainbow-over-gate: {label: "The curved posts over the temple gate are called a rainbow stretched across the sky", cluster: temple}
  seven-stones-around-house: {label: "Seven stones set around the temple take counsel with its divine owner", cluster: temple}
  hymn-subscript-doxology: {label: "A section or composition ends with the formula 'X be praised' (za3-mi2)", cluster: hymn}
  food-of-gods-uncooked: {label: "The gods' food is syrup, ghee, wine, milk, figs and dates, 'things untouched by fire'", cluster: cult}
  god-woken-by-temple-servants: {label: "Temple servants wake the god from sleep each day with food, drink and noise", cluster: cult}
  weapons-dedicated-in-temple: {label: "Weapons (maces, bow, arrows, quiver, standards) are presented to the god and kept in his temple", cluster: cult}
  foot-on-neck-of-enemies: {label: "The ruler sets his foot on the neck of evildoers or enemies", cluster: kingship}
  decree-of-god-unchangeable: {label: "The decree of the high gods cannot be changed or overturned: 'Who can oppose it?'", cluster: lament}
  king-weeps-in-palace: {label: "The besieged king sits paralysed and weeps bitterly in his own palace", cluster: lament}
  corpses-floating-in-river: {label: "Corpses float in the river after the slaughter", cluster: lament}
  unprecedented-calamity: {label: "A catastrophe falls such as no one had ever known or seen, without a name", cluster: lament}
  like-milk-poured-to-dogs: {label: "A city or land is poured out 'like milk to the dogs'", cluster: lament}
  god-taken-captive-in-fetters: {label: "A god leaves his city like a prisoner of war, his hands fettered", cluster: lament}
  justice-ceases-in-ruined-city: {label: "In the ruined city the seat of judgment stands empty and no decisions or justice are given", cluster: lament}
  priests-carried-off-cult-ends: {label: "Temple personnel (cook, dream-interpreter, seal-keeper, linen-clad priests) are carried off and the rites forsaken", cluster: lament}
  mourning-garment-put-on: {label: "A mourner, even a god, puts on a garment of mourning", cluster: lament}
  god-returns-to-his-temple: {label: "After the decree of restoration the god re-enters his city and temple with head held high", cluster: lament}
  blood-poured-like-water: {label: "The blood of the slain is splashed on the ground like a rainstorm", cluster: lament}
  enemies-not-knowing-good-and-evil: {label: "The invading enemy is said not to know good from evil", cluster: lament}
  cow-bereaved-of-calf: {label: "The mourning temple groans like a cow whose calf has been cut off", cluster: lament}
  what-did-people-do-to-deserve: {label: "Lament asks what the people, who walked the true path, did to deserve the god's anger", cluster: lament}
  consort-intercedes-for-city: {label: "The chief god's consort entreats him in prayer to restore the city", cluster: lament}
  daily-offering-restored: {label: "The daily rations, fine flour and loaves on the god's table are restored after the catastrophe", cluster: cult}
  enemy-expelled-from-temple: {label: "The enemy occupying a temple is driven out of it", cluster: temple}
  darkness-lifted-from-land: {label: "A time is decreed when darkness is lifted from the land and light established so living things rejoice", cluster: kingship}
  travel-without-fear: {label: "A time when anyone may travel where he will, even to a foreign city, without fear on the plain", cluster: kingship}
units:
  # ---------------- ETCSL 2.1.7: Gudea cylinders A and B ----------------
  - id: ane-etcsl-2-1-7-a1-enlil-decides-dream
    tradition: ane-sumerian
    title: Enlil's decision and Ninĝirsu's command in a night vision (Gudea Cyl. A 1.1-1.23)
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Sumerian"
    version: Gudea Cylinder A
    read: ["ETCSL 2.1.7 1-23"]
    tags:
      - {motif: god-orders-temple-in-dream, refs: ["ETCSL 2.1.7 17-21"], note: "ud ne maš-ĝi6-ka ... e2-a-ni du3-ba mu-na-dug4: 'in a nocturnal vision ... he spoke to him of building his house'"}
      - {motif: dreamer-cannot-understand-dream, refs: ["ETCSL 2.1.7 22-23"], note: "gu3-de2-a šag4-ga-ni su3-ra2-am3 inim-e mi-ni-kuš2-u3"}
      - {motif: king-wishes-to-build-temple, refs: ["ETCSL 2.1.7 10-16"], note: "e2-e lugal-bi gu3 ba-de2 'the house, its lord called for it'; the god chooses the builder, the 'fated brick' (šeg12 nam tar-ra) waits for him"}
      - {motif: king-as-shepherd-of-people, refs: ["ETCSL 2.1.7 12"], note: "ensi2 lu2 ĝeštug3 daĝal: the ruler of broad wisdom; Gudea is later called sipad 'shepherd' throughout"}
      - {motif: gods-chosen-sacred-city, refs: ["ETCSL 2.1.7 1-4"], note: "On the day fates were decided, Lagaš raised its head and Enlil looked on Ninĝirsu with favour (igi zid)"}
    hints:
      - "Compare 2 Sam 7:1-13 and 1 Chr 17 (the king and the house for God) and 1 Kgs 3:5 (dream at night)."
      - "Compare Exod 25:8-9 (make me a sanctuary according to the pattern)."
  - id: ane-etcsl-2-1-7-a1-journey-to-nanse
    tradition: ane-sumerian
    title: Gudea sails to Nanše, praying at Bagara and to Ĝatumdug (Cyl. A 1.24-4.13)
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Sumerian"
    version: Gudea Cylinder A
    read: ["ETCSL 2.1.7 24-100"]
    tags:
      - {motif: dreamer-cannot-understand-dream, refs: ["ETCSL 2.1.7 27-32"], note: "niĝ2 maš-ĝi6-ke4 ma-ab-de6-a-ĝa2 šag4-bi nu-zu: 'what the night vision brought me, its heart I do not know'"}
      - {motif: goddess-as-mother-and-father-of-king, refs: ["ETCSL 2.1.7 64-66"], note: "ama nu-tuku-me ama-ĝu10 ze2-me, a nu-tuku-me a-ĝu10 ze2-me; a-ĝu10 šag4-ga šu ba-ni-dug4 unu6-a i3-tud-e 'you implanted my seed in the womb, gave birth to me in the sanctuary'"}
      - {motif: king-begotten-as-gods-son, refs: ["ETCSL 2.1.7 66"], note: "Gudea born of Ĝatumdug in the sanctuary"}
      - {motif: prayer-for-kings-long-life, refs: ["ETCSL 2.1.7 62-63"], note: "šul zid lu2 igi mu-bar-ra-zu nam-til3 mu-na-sud: the youth you look upon has long life"}
      - {motif: personal-god-holds-kings-hand, refs: ["ETCSL 2.1.7 76-79"], note: "u2-dug4 sag9-ga-zu igi-še3 ḫa-ma-ĝen, {d}lamma sag9-ga-zu ĝiri3-a ḫa-mu-da-ĝen: 'may your good udug go before me and your good lamma walk with me'"}
      - {motif: dwelling-in-shelter-of-most-high, refs: ["ETCSL 2.1.7 72-73"], note: "an-dul3 daĝal-me ĝissu-zu-še3 ni2 ga-ma-ši-ib2-te: 'you are a broad sunshade; let me cool off in your shade'"}
      - {motif: interpretation-from-god, refs: ["ETCSL 2.1.7 30-32", "ETCSL 2.1.7 99"], note: "Nanše is ensi diĝir-re-ne 'dream interpreter among the gods'"}
      - {motif: offering-before-prayer, refs: ["ETCSL 2.1.7 37-38", "ETCSL 2.1.7 54-56", "ETCSL 2.1.7 93-94"], note: "Refrain ninda ĝiš bi2-tag a sed6 i3-de2: he offered bread, poured cold water, then went to pray"}
      - {motif: prayer-heard-formula, refs: ["ETCSL 2.1.7 49-51", "ETCSL 2.1.7 87-89"], note: "gu3 de2-a-ni ĝiš ba-tuku-am3 ... sizkur2 ra2-zu-ni ... šu ba-ši-ti: his call was heard, the god accepted his prayer"}
    hints:
      - "Compare Ps 27:10 (father and mother forsake me, YHWH takes me in) and Ps 22:10-11 (from my mother's womb you are my God)."
      - "Compare Ps 91:1 and Ps 121:5 (shade at the right hand); Gen 48:16 and Exod 23:20 (angel going before)."
  - id: ane-etcsl-2-1-7-a4-dream-interpreted
    tradition: ane-sumerian
    title: Gudea tells his dream and Nanše interprets it (Cyl. A 4.14-6.13)
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Sumerian"
    version: Gudea Cylinder A
    read: ["ETCSL 2.1.7 101-151"]
    tags:
      - {motif: giant-composite-divine-figure, refs: ["ETCSL 2.1.7 101-106"], note: "lu2 1-am3 an-gin7 ri-ba-ni ki-gin7 ri-ba-ni, saĝ diĝir, a2 anzud2, sig-ba a-ma-ru, zid-da gabu2-na piriĝ i3-nu2-nu2"}
      - {motif: dream-interpreted-item-by-item, refs: ["ETCSL 2.1.7 124-151"], note: "Each figure explained with ga-nam me-am3 'was in fact': Ninĝirsu, Ninĝišzida (the daylight), Nisaba, Nindub, the brick, the tree, the donkey"}
      - {motif: interpretation-from-god, refs: ["ETCSL 2.1.7 124-125"], note: "sipad-ĝu10 ma-mu-zu ĝe26 ga-mu-ra-bur2-bur2: 'my shepherd, I will explain your dream'"}
      - {motif: goddess-reads-star-tablet, refs: ["ETCSL 2.1.7 110-114", "ETCSL 2.1.7 134-140"], note: "gi-dub-ba kug NE ... dub mul-an dug3-ga: stylus of silver on a tablet of good stars; Nisaba announces the holy stars for building"}
      - {motif: god-draws-temple-plan-on-tablet, refs: ["ETCSL 2.1.7 115-117", "ETCSL 2.1.7 141-143"], note: "le-um za-gin3 šu im-mi-du8, e2-a ĝiš-ḫur-bi im-ĝa2-ĝa2: Nindub draws the house's design (ĝiš-ḫur) on a lapis lazuli tablet"}
      - {motif: heavenly-pattern-of-sanctuary, refs: ["ETCSL 2.1.7 117", "ETCSL 2.1.7 143"]}
      - {motif: fated-brick-moulded-by-king, refs: ["ETCSL 2.1.7 118-120", "ETCSL 2.1.7 144-146"], note: "dusu kug, {ĝiš}u3-šub kug, šeg12 nam tar-ra: holy basket, holy mould, fated brick"}
      - {motif: davids-vow-no-sleep-until-gods-place, refs: ["ETCSL 2.1.7 147-149"], note: "e2 du3-de3 igi-zu u3 dug3-ga nu-ši-ku4-ku4: 'building the house will not let sweet sleep come into your eyes'"}
      - {motif: sun-of-righteousness-healing-in-wings, refs: ["ETCSL 2.1.7 109", "ETCSL 2.1.7 132-133"], note: "ud ki-šar2-ra ma-ta-e3: daylight rising on the horizon = the personal god Ninĝišzida"}
    hints:
      - "Compare Gen 40-41 and Dan 2; 4; 7 (dreams explained element by element) and Ezek 1:4-10 (composite figure with wings, lions)."
      - "Compare Ps 132:3-5 (no sleep to my eyes until I find a place for YHWH) and 1 Chr 28:11-19 (the plan, tavnit, in writing from YHWH's hand)."
      - "Compare Q 12:43-49 (the king's dream of cows interpreted) and Q 12:4 (stars bowing in a dream)."
  - id: ane-etcsl-2-1-7-a6-nanse-advice-chariot
    tradition: ane-sumerian
    title: Nanše's advice; Gudea brings Ninĝirsu a chariot, standard and drum (Cyl. A 6.14-8.1)
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Sumerian"
    version: Gudea Cylinder A
    read: ["ETCSL 2.1.7 152-195"]
    tags:
      - {motif: gift-of-chariot-to-god, refs: ["ETCSL 2.1.7 155-159", "ETCSL 2.1.7 179-185"], note: "{ĝiš}gigir ... {anše}dur9 ... kug NE za-gin3: a chariot with silver and lapis lazuli and a donkey stallion Piriĝ-kaše-pada; arrows ti mar-uru5-a ud-gin7 i3-e3 'fly from the quiver like sunbeams'"}
      - {motif: name-written-on-standard, refs: ["ETCSL 2.1.7 160-161", "ETCSL 2.1.7 186-187"], note: "šu-nir ki aĝ2-ni u3-mu-na-dim2, mu-zu u3-mi-sar: fashion his beloved standard and write your name on it"}
      - {motif: drum-named-instrument-of-god, refs: ["ETCSL 2.1.7 162-163", "ETCSL 2.1.7 188-189"], note: "balaĝ ki aĝ2-ni ušumgal kalam-ma: the beloved drum named 'Dragon of the Land'"}
      - {motif: god-loves-gifts, refs: ["ETCSL 2.1.7 164", "ETCSL 2.1.7 190"], note: "ur-saĝ niĝ2-ba-e ki aĝ2: the warrior who loves gifts"}
      - {motif: gods-thoughts-higher-than-human, refs: ["ETCSL 2.1.7 168-169"], note: "en-na šag4 an-gin7 su3-ra2-ni: the lord's heart, remote as the heavens"}
      - {motif: prophets-face-shines-after-encounter, refs: ["ETCSL 2.1.7 195"], note: "gu3-de2-a eš3 e2-ninnu-ta zalag-ga nam-ta-e3: Gudea came out of the shrine shining (zalag)"}
    hints:
      - "Compare Exod 34:29-35 (Moses' face shines after speaking with God)."
      - "Compare Isa 55:8-9 (my thoughts higher than yours as heaven than earth) and 2 Kgs 23:11 (chariots of the sun)."
  - id: ane-etcsl-2-1-7-a8-incubation-ningirsu-speech
    tradition: ane-sumerian
    title: Gudea's incubation and Ninĝirsu's self-revelation (Cyl. A 8.2-12.11)
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Sumerian"
    version: Gudea Cylinder A
    read: ["ETCSL 2.1.7 196-314"]
    tags:
      - {motif: incubation-dream-at-sanctuary, refs: ["ETCSL 2.1.7 200-208", "ETCSL 2.1.7 226-227"], note: "After sacrificing sheep and kid on the hide of a virgin kid and burning juniper and cedar resin, Gudea prays and sleeps; Ninĝirsu comes to the sleeper (nu2-a-ra)"}
      - {motif: pleasing-odor-to-god, refs: ["ETCSL 2.1.7 204-206"], note: "li{ĝiš} u2 sikil kur-ra ... šim erin ir-sim diĝir-ra-kam: juniper and cedar resin, 'the scent of gods'"}
      - {motif: god-stands-at-sleepers-head, refs: ["ETCSL 2.1.7 226-227"], note: "saĝ-ĝa2 mu-na-gub ul4 mu-tag-tag-e: he stood at his head, touching him quickly"}
      - {motif: divine-warrior, refs: ["ETCSL 2.1.7 209-211", "ETCSL 2.1.7 241-247"], note: "en a ḫuš gi4-a 'lord who turned back the fierce waters'; tukul-ĝu10 šar2-ur3 kur šu-še3 ĝar-ĝar"}
      - {motif: god-rebukes-sea-and-dries-rivers, refs: ["ETCSL 2.1.7 209", "ETCSL 2.1.7 241"], note: "a ḫuš gi4-a: 'who turned back the fierce waters' (interpretive match to divine control of hostile waters)"}
      - {motif: gods-thoughts-higher-than-human, refs: ["ETCSL 2.1.7 217-225"], note: "šag4 ab-gin7 zi-zi ... a-ma-ru12-gin7 ... šag4 an-gin7 su3-ra2-zu: your heart rising like the sea, like a flood, remote as heaven"}
