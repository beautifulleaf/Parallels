      - {motif: bronze-laver-for-washing-hands-and-feet, refs: ["ETCSL 2.1.7 957-958"], note: "Interpretive: Šul-šaga 'to let hands always be washed (šu4-luḫ), to serve water to the lord with holy hands'"}
      - {motif: divine-warrior, refs: ["ETCSL 2.1.7 971-989"], note: "seven-headed mace, mitum, 'flood-storm' weapon; to inundate (a-gin7 ĝa2-ĝa2) Enlil's enemy land"}
