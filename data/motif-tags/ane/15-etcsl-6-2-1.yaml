      - {motif: what-god-destroyed-none-can-take, refs: ["ETCSL 6.2.5 7:6-7"], note: "niĝ2 ḫa-lam-ma diĝir-ra-kam / šu tu-tu nu-ub-zu"}
      - {motif: snake-charmer-pulls-tooth, refs: ["ETCSL 6.2.5 11:3-4"], note: "muš-laḫ5-e muš an-da-ĝal2 / zu2 mu-ra-ze2-X"}
      - {motif: touching-woman-improperly-abomination, refs: ["ETCSL 6.2.5 10.A:1-3"], note: "[gal4]-la tug2-ga šu tag-ga / niĝ2-gig {d}suen-na-kam"}
