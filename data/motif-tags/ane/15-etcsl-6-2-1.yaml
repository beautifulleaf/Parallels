      - {motif: captive-pleads-kinship-with-sun-god, refs: ["ETCSL 1.4.3 164-169", "ETCSL 1.4.3 191-196"], note: "ŋuruš-e {d}utu-ra an-še3 šu-ni ba-ni-in-zig3 / {d}utu murum5-ŋu10-me-en ŋe26-e mussa-zu-me-en / e2-an-na-še3 u2 gur3-ru-me-en / unug{ki}-še3 niŋ2-mussa ak-a-me-en / nundum kug-ge ne su-ub-ba-me-en / dub3 kug-ga dub3 {d}inana-ka e-ne di dug4-ga-me-en"}
      - {motif: victim-transformed-to-snake-to-escape, refs: ["ETCSL 1.4.3 170-179", "ETCSL 1.4.3 199-204a"], note: "šu-ŋu10 šu maš-da3 u3-mu-e-ni-sig10 / ŋiri3-ŋu10 ŋiri3 maš-da3 ... (gazelle); later šu maš-da3 ... muš-a (snake); {d}utu er2-na šu ba-ši-in-ti kadra-gin7 / lu2 arhuš-a-gin7 arhuš ba-ni-in-ak"}
      - {motif: tears-accepted-as-offering, refs: ["ETCSL 1.4.3 175", "ETCSL 1.4.3 200a"], note: "{d}utu er2-na šu ba-ši-in-ti kadra-gin7: Utu accepted his tears as a gift"}
      - {motif: hunted-god-hides-in-grass-and-ditches, refs: ["ETCSL 1.4.3 173", "ETCSL 1.4.3 179-182"], note: "flight to Kubirešdildareš (KU-{ŋiš}bir5-re-eš-dil-da-re-eš zi-ŋu10 ga-ba-ši-de6); the demons search, find him there"}
      - {motif: captive-bound-like-wild-bull, refs: ["ETCSL 1.4.3 183-190"], note: "same binding formula repeated: net, cords, beating, manacles"}
      - {motif: threefold-repeated-episode, refs: ["ETCSL 1.4.3 183-190"], note: "the binding formula of 156-163 recurs here and at 218-225; capture, prayer to Utu and transformation recur three times with changed refuges"}
    hints:
      - "The pursued man's hands and feet made like a gazelle's: compare 2 Sam 22:34 and Ps 18:34 (he makes my feet like the feet of deer) and Hab 3:19."
      - "Tears accepted as a gift: compare Ps 56:9 (put my tears in your bottle) and 2 Kgs 20:5 (I have seen your tears)."
      - "Appeal to divine kinship: compare Ps 89:27 (you are my father) and Isa 63:16."
  - id: ane-etcsl-1-4-3-f-old-woman-belili-sisters-fold
