      - {motif: scribal-competence-proverbs, refs: ["ETCSL 6.2.3 17:1-2", "ETCSL 6.2.3 18:1-2", "ETCSL 6.2.3 20:3", "ETCSL 6.2.3 21:1-2"], note: "dub-sar-me-en mu ni2-za nu-zu; dub-sar-re mu 1-am3 ḫe2-en-zu šu-ni ḫe2-sag9; dub-sar eme-gir15 nu-un-zu-a inim bal-e me-da ḫe2-im-tum3 (translation, inim bal)"}
      - {motif: disgraced-professional-changes-trade, refs: ["ETCSL 6.2.3 17:5-7"], note: "dub-sar pe-el-la2 lu2-mu7-mu7-še3 / nar pe-el-la2 lu2-gi-di-da-še3 / dam-gara3 pe-el-la2 da-bi-ri-ri-še3"}
      - {motif: fox-boasts-to-make-flood, refs: ["ETCSL 6.2.3 22:1-2"], note: "ka5-a idigna-še3 kaš3 i3-sur-sur-ra / a-eštub{ku6} ba-zig3-ge-en-e-še"}
      - {motif: neck-stock-before-catching-fox, refs: ["ETCSL 6.2.3 23:1"], note: "ka5-a nu-un-dab5 {ĝiš}az-bal al-ak-e"}
      - {motif: talking-animal, refs: ["ETCSL 6.2.3 22:1-2"], note: "the fox speaks: 'I am causing the spring flood to rise'"}
    hints:
      - "The fox who urinates into the Tigris and claims the flood: compare the boasting bramble of Judg 9:15 and 2 Kgs 14:9 (the thistle and the cedar); also Isa 10:15 (the axe boasting over the hewer)."
      - "Scribe who cannot translate (inim bal): compare Neh 8:8 (reading with interpretation) and Ezra 4:7 (a letter translated into Aramaic)."
      - "A finger pointed at the liar: compare Isa 58:9 ('the pointing of the finger') and Prov 6:13."
      - "Moving about defeats poverty: compare Prov 10:4 and Prov 6:6-11."
      - "'My fate is a disgrace, it makes the mouth bitter' (15:1-2): compare Ruth 1:20 (call me Mara) and Job 7:11."
