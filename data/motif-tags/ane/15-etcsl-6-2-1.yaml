    corpus: ane
    original: true
    tagger: "Claude (model), reading the Sumerian"
    read: ["ETCSL 1.4.3 71-109"]
    tags:
      - {motif: lookout-climbs-mound-sees-pursuers, refs: ["ETCSL 1.4.3 71-89"], note: "nin9 du6-da ed3-bi2 ... du6-da igi il2-la-ab ... {d}ŋeštin-an-na-ke4 du6-da ba-an-ed3 igi ba-an-il2 ... šeš-ŋu10 gal5-la2-zu im-ši-re7-eš saŋ u2-a šub-u3; her neighbour Ĝeštindudu points out the gu2 keše2-da gal-gal ('the big men who bind the neck'); 80-82 obscure (a barge, wood in the hand/neck)"}
      - {motif: hunted-god-hides-in-grass-and-ditches, refs: ["ETCSL 1.4.3 91-94", "ETCSL 1.4.3 103-106"], note: "saŋ u2-a ga-an-šub ki-ŋu10 na-ab-pad3-de3 / saŋ u2 di4-di4-la2 ... saŋ u2 gal-gal-la ... eg2 a-ra-li-ka ga-an-šub"}
      - {motif: fugitive-curses-any-who-reveal-him, refs: ["ETCSL 1.4.3 95-97", "ETCSL 1.4.3 107-109"], note: "ud ki-zu ab-pad3-de3-en-na-a ur-zu hu-mu-gu7-e / ur gig2 ur nam-sipad-da-zu / ur gir15 ur nam-en-na-zu: 'if you reveal my place, may your dog devour you, the black dog of your shepherdship, the noble dog of your lordship'"}
