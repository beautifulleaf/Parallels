      - {motif: abomination-to-a-named-god, refs: ["ETCSL 6.2.3 74:3"], note: "[niĝ2-gig] {d}utu-kam"}
      - {motif: cities-do-not-greet-people-do, refs: ["ETCSL 6.2.3 75:1-2"], note: "iri{ki} iri{ki} silim nu-tag-ga / lu2-ulu3 lu2-ulu3 silim bi2-tag-ga"}
      - {motif: creature-voice-is-glory-of-its-habitat, refs: ["ETCSL 6.2.3 76:4-6"]}
      - {motif: greed-of-the-wealthy-abomination, refs: ["ETCSL 6.2.3 77.B:3"], note: "niĝ2-tuku niĝ2 al di niĝ2-gig diĝir-ra-kam (duplicate)"}
      - {motif: slanderer-punished-sun-god-loves-justice, refs: ["ETCSL 6.2.3 78:1-10"], note: "eme sig9 dug4-dug4 lu2-lul-la-ra / {d}nin-e2-gal-la saĝ-a-ni bi2-in-gul ... šu-si eĝer-a-ni mu-un-da-ĝal2 / {d}utu en niĝ2-gen6-na ki aĝ2 / niĝ2-erim2 ba-an-da-bur12 niĝ2-gen6-na gid2-da"}
      - {motif: fire-god-devours-land-in-war, refs: ["ETCSL 6.2.3 79:4-8"], note: "me3 šen im-ma-te ... ĝiš-ḫur diĝir-re-e-ne-ke4 ... ba-an-ḫul / {d}gibil kalam-ma ba-gu7-e-en; 79:9 the writer prays 'may my god know my hand is suited to the stylus'"}
      - {motif: fortune-dispersed-none-knows-future, refs: ["ETCSL 6.2.3 80:5-9"], note: "lu2 niĝ2-tuku-e mu-un-da-ak-ak ... a-ga-bi-še3 ĝeštug2-ga nu-ub-de5 / am3-kur2-ra a-ra2-bi nu-zu (Akk. a-la-ak-ta-šu)"}
      - {motif: no-child-born-without-sin, refs: ["ETCSL 6.2.3 81:2-5"], note: "ud na-me dumu nam-tag-ga nu-tuku / ama-ni nu-um-tu-ud / inim la-ba-sig10 (Akk. la i-du-u2) erin2 nam-tag-ga nu-tuku / ul-ta nu-ĝal2-la-am3"}
      - {motif: conceived-in-sin, refs: ["ETCSL 6.2.3 81:2-3"], note: "not the speaker's own conception in sin, but the universal claim that no mother ever bore a sinless child"}
    hints:
      - "No child without sin was ever born: compare 1 Kgs 8:46, Eccl 7:20, Job 14:4, Job 15:14, Ps 51:7 and Ps 143:2."
      - "The swift and the strong fail, the talker succeeds: compare Eccl 9:11."
      - "Strength cannot match intelligence: compare Eccl 9:16, Prov 21:22 and Prov 24:5."
      - "A judge who despises justice is an abomination to Utu: compare Deut 25:16, Prov 17:15 and Prov 11:1; chasing a son from his father's house: compare Gen 21:10 and Judg 11:2."
      - "Utu who loves justice uproots wickedness and prolongs righteousness: compare Ps 11:7, Ps 37:9-11 and Ps 45:8."
      - "The slanderer whose head the goddess crushes: compare Ps 101:5 and Ps 140:12."
      - "Fortune dispersed, no one knows what will come: compare Eccl 5:13-14, Eccl 8:7 and Prov 27:1."
      - "'For him who walks the day lasts ...' (81:6-9): compare Ps 104:23 and Eccl 11:7."
  - id: ane-etcsl-6-2-3-82-urim-personal-god-elders
    tradition: ane-sumerian
    title: "Proverbs from Urim 82-107: the man without a god, honouring elders, the mouse and mongoose, barley and silver, the unburied despiser of god"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Sumerian"
    read: ["ETCSL 6.2.3 82:1-107:3"]
    tags:
      - {motif: man-without-personal-god-fails, refs: ["ETCSL 6.2.3 82:1-8", "ETCSL 6.2.3 83:1-8"], note: "lu2-ulu3 diĝir-da nu-me-a / nu la-ba-gu-le-en nu la-ba-tur-re-en / id2-da ed3-de3-bi ku6 nu-dab5-be2 / a-šag4-ga ed3-de3-bi maš-da3 nu-dab5-be2 ... tukum-bi diĝir-ra-a-ni an-na-dug3 / niĝ2 mu sa4-a an-na-ĝar-ĝar"}
      - {motif: honour-elders-mother-older-brother, refs: ["ETCSL 6.2.3 84:1-4", "ETCSL 6.2.3 84:7-8"], note: "inim ab-ba-še3 ĝizzal ak-de3 (Akk. ši-bi-im tu-te-qi2-a-am) / dumu ama-ni-ir sun5-na teĝ3-ĝe26-dam / nam-ab-ba šid-de3 / šeš-gal šeš-ban3-da dugud-de-dam; cf. Instructions of Šuruppak 32-34"}
      - {motif: fool-succeeds-where-wise-strain, refs: ["ETCSL 6.2.3 84:5-6"], note: "en-na kug-zu kug ban3-da-na / na-ĝa2-aḫ a2-aš2 sa2 e3-de3-en; meaning uncertain"}
      - {motif: mouse-defies-mongoose, refs: ["ETCSL 6.2.3 89:1-5"]}
      - {motif: do-not-overturn-the-cult-proverb, refs: ["ETCSL 6.2.3 91:1-5"], note: "ĝiš-ḫur-bi ba-da-bal / me-bi mu-un-la2-e / šeš-a šeš-bi igi nu-bar-e: plans overturned, cult diminished, brothers do not see brothers"}
      - {motif: poor-man-afflicts-rich, refs: ["ETCSL 6.2.3 93:1-5"], note: "lu2 niĝ2-tuku lu2 niĝ2 nu-tuku gig-še3 im-ĝar; su-gu7 niĝ2 ud da-ri2-ka 'skin disease of eternal days' (Akk. ri-ši-tum ša da-ri-a-ti)"}
      - {motif: wealthy-wait-at-gate-of-barley-owner, refs: ["ETCSL 6.2.3 94:1-4"], note: "[kug] in-[tuku] {na4}za-gin3 in-tuku / gud in-tuku [udu] in-tuku / kan4 lu2 še in-tuku / [ud] mi-ni-ib-zal-zal-e"}
      - {motif: speech-cannot-be-hidden, refs: ["ETCSL 6.2.3 95:1-4"], note: "ka nam-lu2-ulu3-ka iz-zi-gin7 dul-bi gig-ga ... eme sig nam-ba-an-gu7-gu7-e"}
      - {motif: mother-warns-hidden-mouse, refs: ["ETCSL 6.2.3 96:1-4"]}
      - {motif: speaking-brings-no-gain, refs: ["ETCSL 6.2.3 97:1-4"], note: "ga-am3-dug4 a-na-am3 šu ba-ni-in-ti (Akk. lu-u2 aq-bi mi-nam el-qe2)"}
      - {motif: human-intelligence-from-god, refs: ["ETCSL 6.2.3 104:1-3"], note: "umuš lu2-ulu3 ki diĝir-ra-kam"}
      - {motif: just-words-bring-favourable-fate, refs: ["ETCSL 6.2.3 106:1-3"], note: "bi2-in-dug4-ga lu2 diĝir in-tuku-am3: 'he who can say ... is a man who has a god'"}
      - {motif: despiser-of-god-unburied-ghost-unwatered, refs: ["ETCSL 6.2.3 107:1-3"], note: "lu2 diĝir-ra-a-ni nu-mu-un-kal-la / edin-na mu-un-šub ad3-bi nu-ĝa2-ĝa2 / ibila-a-ni alal-am3 gidim-ma-a-ni a nu-naĝ"}
      - {motif: ghost-without-funerary-offerings-eats-scraps, refs: ["ETCSL 6.2.3 107:3"], note: "the ghost (gidim) drinks no water from the libation pipe (alal)"}
    hints:
      - "A man without a god catches no fish, no gazelle, fails in everything: compare Ps 127:1-2 (unless YHWH builds the house) and Deut 28:15-19, 38-40."
      - "Silver-holders wait at the gate of the barley-owner: compare Gen 41:56-57 and Gen 47:13-20 (all lands come to Egypt to buy grain) and Prov 11:26."
      - "Respect for the old man's word, the mother, the elder brother: compare Lev 19:32, Exod 20:12 and Prov 23:22."
      - "The man who despises his god is cast unburied into the desert: compare Jer 22:19 (buried with the burial of a donkey), Isa 14:19-20 and 1 Kgs 14:11; water for the dead through the pipe: compare Deut 26:14."
      - "Speech as hard to hide as a wall: compare Eccl 10:20 (a bird of the air will carry the voice)."
      - "'Although I spoke, what did I gain?': compare Job 16:6 and Prov 28:13 (he who covers his sins will not prosper)."
      - "Man's intelligence comes from god: compare Prov 2:6 and Job 32:8."
  - id: ane-etcsl-6-2-3-108-urim-crafts-justice-inheritance
