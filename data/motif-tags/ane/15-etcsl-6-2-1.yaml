      - {motif: driving-son-from-fathers-house-abomination, refs: ["ETCSL 6.2.5 17:1-3"], note: "di-kud niĝ2-gen6-na ḫul-a aš2 a2 zid-da bal-e / dumu-nitaḫ tur-ra e2 ad-da-na-ka ib2-ta-an-sar-re / niĝ2-gig {d}nin-urta-ke4"}
      - {motif: animal-relieved-of-burden-speaks, refs: ["ETCSL 6.2.5 15:1-3"], note: "gud šu-gi4 ... usu niĝ2 ud-bi-da-ĝu10 ni2-me-en gur-e-še: the old bull boasts of his former strength"}
      - {motif: just-words-bring-favourable-fate, refs: ["ETCSL 6.2.5 18:1-3"], note: "lu2 inim gen6-na bal-bal / inim diĝir-ra-ni-ta nam-tar sag9-ga-am3 / ud šu2-uš mu-da-ĝal2"}
      - {motif: river-ordeal-clears-the-just, refs: ["ETCSL 6.2.5 23:1-2"], note: "inim-inim niĝ2-si-sa2 tum2-ma / {d}id2-lu2-<ru>-gu2 šag4-bi u6 di-e"}
      - {motif: man-without-personal-god-fails, refs: ["ETCSL 6.2.5 24:1-2"]}
      - {motif: leader-burning-none-asks-for-him, refs: ["ETCSL 6.2.5 25:1-2"], note: "lu2 igištu-ke4 izi al-gu7-e / lu2 eĝer na-ab-be2 me-am3 lu2 du11-saĝ"}
      - {motif: where-no-dogs-fox-is-boss, refs: ["ETCSL 6.2.5 35:1"], note: "iri ad4-lu2-u3-ka ba-za lu2-kaš4-e-kam"}
      - {motif: creature-voice-is-glory-of-its-habitat, refs: ["ETCSL 6.2.5 38:1", "ETCSL 6.2.5 39:1"]}
      - {motif: king-as-scribe-and-dam, refs: ["ETCSL 6.2.5 41:1"], note: "lugal dub-sar lugal dur maḫ id2-da gib-ba"}
      - {motif: millstone-floats-for-righteous, refs: ["ETCSL 6.2.5 42:1"], note: "lu2 si sa2-ra {na4}kinkin id2-da mu-na-dirig-dirig"}
      - {motif: repay-favour-to-favour-giver, refs: ["ETCSL 6.2.5 32:1"], note: "{d}lum-ma lu2 niĝ2 sag9-ga-ra sag9-ga-aš ḫe2-na-ĝal2: may Luma be good to him who does good"}
    hints:
      - "The river ordeal admires those who carry true words: compare Num 5:11-31 (the water of bitterness) and Isa 43:2."
      - "A millstone floats for the righteous man: compare 2 Kgs 6:5-7 (the iron axe-head floats) and contrast Exod 15:5, 10 and Neh 9:11 (the enemy sinks like a stone)."
      - "Despising a just decision, loving a wicked one, is an abomination: compare Prov 17:15 and Deut 25:16."
      - "In the city of the lame the halt are couriers: compare 2 Sam 5:6-8 (the lame and blind of Jebus) and Isa 35:6."
      - "The king built a house in the barren marshes (19:1-2): compare Isa 35:1 and Isa 41:18-19."
      - "If the roof does not stand upright for its owner, the gutter lets no water (20:1-2): compare Eccl 10:18."
      - "The leader burning while those behind do not ask for him: compare Zech 13:7 (strike the shepherd and the sheep scatter)."
      - "'May Luma be good to him who does good': compare Ps 18:26 and Ps 125:4."
