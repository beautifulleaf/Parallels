      - {motif: warrior-equal-to-many, refs: ["ETCSL 6.2.5 1.A:9"], note: "[ur-saĝ dili na-nam dili]-na lu2 šar2-ra-am3; mostly restored"}
      - {motif: ship-sinks-without-wind, refs: ["ETCSL 6.2.5 2.A:1"], note: "{ĝiš}ma2 dilmun-na tum9 nu-mir ba-an-da-su"}
      - {motif: lion-says-plants-have-no-names, refs: ["ETCSL 6.2.5 2.B:2-5"], note: "ḫi-iz-ur-bar-ra{sar} ĝeštin-ka5-a{sar} {u2}ug {u2}piriĝ-GI {u2}eme-ur-gir15-ra {u2}niĝ2-u2-rum {u2}gu3-i3-ra / ur-maḫ gu3 de2-de2 / mu li-bi2-in-tuku-e-še"}
      - {motif: fools-lot-created-by-sun-god, refs: ["ETCSL 6.2.5 2.B:6"], note: "ĝiš-šub lu2-dim3-ma {d}utu al-dim2-e"}
