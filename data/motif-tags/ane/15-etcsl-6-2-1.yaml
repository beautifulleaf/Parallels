      - {motif: abomination-to-a-named-god, refs: ["ETCSL 6.2.3 5:1"], note: "niĝ2-gig diĝir-ra-kam: 'an abomination of the god' (unnamed)"}
      - {motif: where-no-dogs-fox-is-boss, refs: ["ETCSL 6.2.3 6:1"], note: "iri ur-gir15 nu-me-a ka5-a nu-banda3"}
      - {motif: sun-god-seeks-harbour-for-trustworthy-boat, refs: ["ETCSL 6.2.3 7:1-2"], note: "{ĝiš}ma2 niĝ2-gen6-na ... {d}utu kar-ra gen6-na mu-un-na-ši-kiĝ2-kiĝ2"}
      - {motif: no-escape-raven-mongoose-lion, refs: ["ETCSL 6.2.3 9:1-4"], note: "[an] uga{mušen}-am3 / [ki] {d}nin-kilim-am3 / [edin]-na ur-maḫ-e / [mu-ud-na]-ĝu10 me-še3 ga-ĝen"}
    hints:
      - "The rich man cannot sleep: compare Eccl 5:11 (the sleep of the labourer is sweet, but the surfeit of the rich will not let him sleep)."
      - "A stranger eats one's surplus: compare Eccl 6:2 and Deut 28:33."
      - "Raven above, mongoose below, lion in the desert, 'where shall I go?': compare Amos 5:19 (fleeing a lion and meeting a bear) and Ps 139:7-10 ('where shall I flee?')."
      - "Who can compare with justice, it creates life: compare Prov 12:28 and Prov 11:19 (righteousness leads to life)."
      - "Utu will not be idle against wickedness: compare Ps 121:4 and Ps 94:1-2."
      - "Greed of the rich an abomination: compare Prov 11:24-26 and Eccl 5:9."
  - id: ane-etcsl-6-2-3-14-urim-cult-fate-scribes
    tradition: ane-sumerian
    title: "Proverbs from Urim 14-23: the cult not to be changed, a bitter fate, liars at the gate, scribes and singers, the fox"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Sumerian"
    read: ["ETCSL 6.2.3 14:1-23:1"]
