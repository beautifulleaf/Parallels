    corpus: ane
    original: true
    tagger: "Claude (model), reading the Sumerian"
    read: ["ETCSL 1.4.3 205-239a"]
    tags:
      - {motif: refuge-in-house-of-old-woman, refs: ["ETCSL 1.4.3 205-216"], note: "e2 um-ma {d}be-li-li-še3 ba-an-na-te / um-ma lu2 nu-me-en dam diŋir-ra-me-en / a ub-ta-an-bal-bal a tukum-bi ga-naŋ / zid2 ub-ta-an-dub-dub zid2 tukum-bi ga-gu7 ... um-ma e2-ta ba-ra-e3 ... gal5-la2-e-ne igi ba-ni-in-du8-uš-am3"}
      - {motif: captive-bound-like-wild-bull, refs: ["ETCSL 1.4.3 217-225"]}
      - {motif: captive-pleads-kinship-with-sun-god, refs: ["ETCSL 1.4.3 226-231"]}
      - {motif: victim-transformed-to-snake-to-escape, refs: ["ETCSL 1.4.3 232-239a"], note: "šu-ni šu maš-da3 ... muš-a; amaš kug amaš nin9-ŋa2-še3 zi-ŋu10 ga-ba-ši-in-de6 / amaš kug amaš nin9-na-še3 ba-an-na-te"}
