      - {motif: sister-interprets-brothers-dream, refs: ["ETCSL 1.4.3 41-70"], note: "šeš-ŋu10 ma-mu2-zu nu-sag9-sag9 nam-ma-an-bur2-e: 'my brother, do not tell me your dream, it is not good'; she then interprets it"}
      - {motif: dream-interpreted-item-by-item, refs: ["ETCSL 1.4.3 44-70"], note: "each image is given its meaning: the rushes = robbers rising (sa-gaz šubtum6-ta), the lone reed bowing = your mother, the reeds = you and I, the tall tree = the evil man seizing you in the walls, water on the ashes = the fold become a house of silence, the churn = the evil man's hands, the falcon = the evil man striking your cheek, the goat's beard in the dust = my hair whirling like a storm"}
      - {motif: shepherd-god-killed-by-robbers, refs: ["ETCSL 1.4.3 45", "ETCSL 1.4.3 61", "ETCSL 1.4.3 63-65"], note: "sa-gaz šubtum6-ta ma-ra-an-zig3-ga; lu2 hul-ŋal2-e te-zu ma-ra-an-sag3-ge; gal5-la2 gal-e ŋa2 udu-ta ... šu-zu šu-du3-a ba-e-dab5 a2-zu a2-la2-e ba-e-la2"}
      - {motif: sister-laments-scratching-face, refs: ["ETCSL 1.4.3 67", "ETCSL 1.4.3 69"], note: "siki-ŋu10 mar-uru5-gin7 an-na ma-ra-ni10-ni10-e; šu-si-ŋu10 {ŋiš}bulug taškarin-gin7 te ma-ra-ab-hur-hur-re: the sister foresees her own mourning: hair whirling like a storm, fingernails scratching her cheeks"}
      - {motif: birds-of-prey-seize-lamb-and-sparrow, refs: ["ETCSL 1.4.3 35-36", "ETCSL 1.4.3 60", "ETCSL 1.4.3 62"], note: "{d}nin-ninna2{mušen}-ta-e ŋa2 udu-ka sila4 šu ba-ni-ib-ti / sur2-du3{mušen}-e gi dub-ba-na-ka buru5{mušen} šu ba-ni-ib-ti"}
    hints:
      - "A dream interpreted figure by figure as foretelling death: compare Gen 40:16-19 (the baker's dream: three baskets are three days) and Dan 4:16-24."
      - "The interpreter shrinks from telling a bad dream: compare Dan 4:16 (my lord, may the dream be for your enemies)."
      - "The fold left to the wind, the churn overturned, no milk: compare Hab 3:17 (the flock cut off from the fold) and Jer 25:36-37."
  - id: ane-etcsl-1-4-3-c-demons-approach-hiding
