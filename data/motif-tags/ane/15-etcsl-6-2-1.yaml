  - id: ane-etcsl-6-2-3-1-urim-justice-wealth
    tradition: ane-sumerian
    title: "Proverbs from Urim 1-13: justice creates life, Utu not idle, wealth and sleeplessness, bread for the stranger, nowhere to flee"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Sumerian"
    read: ["ETCSL 6.2.3 1:1-13:3"]
    tags:
      - {motif: justice-creates-life, refs: ["ETCSL 6.2.3 1:1-2"], note: "niĝ2-gen6-na-ta a-ba in-da-[sa2] / nam-til3 ia-u3-tud"}
      - {motif: sun-god-never-idle-against-wickedness, refs: ["ETCSL 6.2.3 1:3"], note: "niĝ2-erim2-me-e a2-bi ḫe2-eb-kuš2-še {d}utu nu-še-ba"}
      - {motif: wealth-brings-sleeplessness, refs: ["ETCSL 6.2.3 2:2-3"], note: "kug tuku an-ḫul2 še tuku an-sag9 / niĝ2-ur2-limmu2 tuku-e u3 nu-um-ši-ku-ku"}
      - {motif: leftover-bread-eaten-by-stranger, refs: ["ETCSL 6.2.3 3:1-2", "ETCSL 6.2.3 4:1-2"], note: "ninda ḫe2-ĝal2-la {d}nin-kilim i3-ib2-gu7 / ninda ḫa-ma-ĝal2-la lu2-kur2-ra ib2-gu7"}
