      - {motif: sun-god-seeks-harbour-for-trustworthy-boat, refs: ["ETCSL 6.2.5 6:4-5"]}
      - {motif: dispute-at-mill-reveals-theft, refs: ["ETCSL 6.2.5 6:7"], note: "e2-kinkin-na du8 ḫe2-ĝal2 geme2 ḫa-ba-ra-be2-[e-še]"}
