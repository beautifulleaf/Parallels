      - {motif: just-mans-son-lies-hungry, refs: ["ETCSL 6.2.1 21:4"], note: "dumu lu2 niĝ2-si-sa2 u2-šim-e ba-nu2: 'the son of the just man lies down in hunger (lit. on the grazing grass)'"}
      - {motif: widow-cannot-become-principal-wife, refs: ["ETCSL 6.2.1 26:1-3"], note: "nu-mu-un-su dam-eĝer-ra-ni na-ab-be2-a / a-na nu-mu-un-su-a-me-eš / dam nitalam in-nu"}
      - {motif: pity-the-weak-not-the-strong, refs: ["ETCSL 6.2.1 28:1-2"], note: "sig9-ga-ar nam-ba-an-na-kur2 / kalag-ga-ar nam-ba-an-še8-še8"}
      - {motif: worshipper-without-standing-before-goddess, refs: ["ETCSL 6.2.1 31:1-2"], note: "mu {d}gu-la nin-ĝa2-še3 šub-ba / ĝe26-e igi-ĝa2 ki-gub-ba nu-tuku-a"}
      - {motif: son-before-he-existed, refs: ["ETCSL 6.2.1 33:1-2"], note: "ĝen za-e dumu-me-e-ke4 / za-e nu-me-en-na-ta"}
      - {motif: endless-talk-human-preoccupation, refs: ["ETCSL 6.2.1 39:1"], note: "dug4-ga-dug4-ga šag4 lu2-ulu3-kam ĝal2-la"}
      - {motif: talking-animal, refs: ["ETCSL 6.2.1 35:1-2"], note: "ka5-a zu2 bi2-in-sud2-sud2 / saĝ nam-mi-bul-bul: the fox gnashes its teeth and shakes its head"}
    hints:
      - "The just man's son lies hungry: a direct counter-voice to Ps 37:25 ('I have not seen the righteous forsaken nor his seed begging bread')."
      - "'You are our son even from when you did not exist': compare Jer 1:5 and Ps 139:16 (known before formed in the womb)."
      - "Endless talk: compare Prov 10:19, Eccl 5:2-3 and Eccl 10:14."
      - "The widow's lower status: compare Lev 21:14 (the high priest may not marry a widow) and Ruth 1:11-13."
      - "Do not weep for the strong, do not oppress the weak: compare Exod 23:3 and Lev 19:15 (neither favour the poor nor defer to the great)."
      - "The ox lying broken in its yoke (29:1-2): compare Isa 1:3 and Hos 10:11."
      - "Wiping one's bread on a pig (41:1): compare Prov 11:22 and Lev 11:7."
