      - {motif: sins-absolved-life-renewed, refs: ["ETCSL 6.2.3 111:1-3"], note: "[nam]-sag9-ga in-tu-ud / nam-tag al-du8-e / nam-til3-la in-tu-ud"}
      - {motif: mule-knows-not-its-parents, refs: ["ETCSL 6.2.3 117:1-2"], note: "{anše}kunga2 ninda2-zu i3-zu-de3-en / u3 ama-zu i3-zu-de3-en"}
      - {motif: each-creature-to-its-hole, refs: ["ETCSL 6.2.3 118:1-2"], note: "muš-e ki-ur3-bi ĝiri2 ki-in-dar-bi / kir4-e ki-e3-bi ḫe2-ni-in-kiĝ2-kiĝ2-e"}
      - {motif: just-man-lives-long, refs: ["ETCSL 6.2.3 123:1-2", "ETCSL 6.2.3 124:1-2"], note: "lu2 niĝ2-gen6-na zi-bi ḫe2-u3-tud / nam-til3 ḫe2-su3-ud-de3; [lu2 niĝ2]-gen6-na [zi]-ni al-su3-ud / [nam]-til3 saĝ rig7-bi"}
      - {motif: wealthy-wait-at-gate-of-barley-owner, refs: ["ETCSL 6.2.3 125:1-2"]}
      - {motif: brotherhood-from-quarrel-friendship-in-court, refs: ["ETCSL 6.2.3 128:1-2"], note: "inim du14-da-ka nam-šeš-e mu-un-dim2-dim2 / ki inim-ma-ka nam-gu5-li ba-an-zu-zu"}
      - {motif: friend-loves-brother-born-for-adversity, refs: ["ETCSL 6.2.3 128:1-2"], note: "brotherhood and friendship are proved in quarrel and at the place of testimony; interpretive"}
      - {motif: learn-craft-by-following, refs: ["ETCSL 6.2.3 135:1-2"], note: "galam-da us2-a galam-a mu-ni-in-zu / kug-zu-ta us2-a kug-zu mu-ni-in-zu"}
      - {motif: fool-succeeds-where-wise-strain, refs: ["ETCSL 6.2.3 134:1-2"]}
      - {motif: earth-greater-than-heaven, refs: ["ETCSL 6.2.3 136:1"], note: "ki an ab-dirig a-ba-a šu gul-la"}
      - {motif: man-without-personal-god-fails, refs: ["ETCSL 6.2.3 148:1"], note: "lu2-ulu3 diĝir-da nu-[me-a] a2-tuku i-bi2-za la-ba-ši-ĝal2: the counter-saying, for the strong man it is no loss"}
      - {motif: inheritance-share-added-abomination, refs: ["ETCSL 6.2.3 150:1"], note: "ḫa-la ḫa-la-še3 ĝa2-ĝa2 niĝ2-gig {d}utu-kam"}
      - {motif: abomination-to-a-named-god, refs: ["ETCSL 6.2.3 150:1"]}
    hints:
      - "The just man's life is long, life is its reward: compare Prov 3:1-2, Prov 10:27 and Deut 5:33; contrast Eccl 7:15."
      - "Sins absolved, life renewed: compare Ps 32:1-2 and Ps 103:3-5 (forgives all your iniquity ... your youth is renewed like the eagle's)."
      - "Let the snake find its hole, the scorpion its crevice: compare Isa 11:8 and Ps 104:22 (the beasts withdraw to their dens)."
      - "The mule that knows not its sire: compare Lev 19:19 (no crossbreeding) and Ps 32:9."
      - "Brotherhood founded in quarrel: compare Prov 17:17 (a brother is born for adversity) and Prov 27:6."
      - "Following wisdom one becomes wise: compare Prov 13:20 (walk with the wise and become wise)."
      - "Adding inheritance share to share an abomination: compare Deut 21:15-17 and Num 27:7-11; Isa 5:8 (joining house to house)."
      - "Earth is greater than heaven, who can destroy it?: compare Eccl 1:4 (the earth remains for ever)."
      - "The raven watching its own shadow and eyeing the malt (122, 147): compare Job 38:41 and Ps 147:9."
  - id: ane-etcsl-6-2-4-unug-proverbs
    tradition: ane-sumerian
    title: "Proverbs from Unug: Enlil holds up the sky, hunger his greatest punishment, the winds"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Sumerian"
    read: ["ETCSL 6.2.4 1.A:1-4:4"]
    tags:
      - {motif: enlil-holds-sky-earth-dangles, refs: ["ETCSL 6.2.4 1.B:2"], note: "[an an-guru3 ki] šu-ni-še3 an-[la2]; mostly restored from 6.1.03.167"}
      - {motif: earth-hung-upon-nothing, refs: ["ETCSL 6.2.4 1.B:2"], note: "the earth hangs (la2) from the god's hands; the image is suspension, not 'upon nothing'; restored"}
      - {motif: hunger-greatest-divine-punishment, refs: ["ETCSL 6.2.4 1.B:3"], note: "[{d}en-lil2-le] šer7-da gu-la-[ni] šag4-[ĝar]-ra-am3; Enlil restored"}
      - {motif: winds-characterised, refs: ["ETCSL 6.2.4 1.B:10-13"], note: "[{tum9}sa12-ti]-um tum9 šeĝ14-ĝa2-kam / [{tum9}mar-tu] lu2 <til3>-ba dirig-ga / [{tum9}sa12-ti-um] tum9 ḫe2-ĝal2-la / [gu5-li] {d}na-ra-am-{d}suen"}
    hints:
      - "Enlil holds the sky, the earth dangling from his hands: compare Job 26:7 (he hangs the earth upon nothing), Isa 40:22 and Ps 75:4 (I keep its pillars steady)."
      - "Hunger as the god's greatest punishment: compare Amos 4:6, Amos 8:11, Ezek 5:16-17 and Deut 28:48."
      - "The rain-bearing east wind: contrast the Hebrew Bible's scorching east wind (Gen 41:6, Hos 13:15) and compare 1 Kgs 18:44 and Prov 25:23 (the north wind brings rain)."
      - "2-4 broken; a young girl 'like a nindiĝir priestess' (2:6) is the only legible image."
  - id: ane-etcsl-6-2-5-1-unprov-wealth-warrior-slaves
    tradition: ane-sumerian
    title: "Proverbs of unknown provenance 1-3: wealth and sleep, the unique warrior, the slave girls, the Dilmun ship, the lion and the nameless plants"
