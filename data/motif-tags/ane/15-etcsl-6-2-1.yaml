      - "'I am not a man, I am the spouse of a god': compare Gen 12:13 and Gen 20:2 (concealed identity to save one's life)."
  - id: ane-etcsl-1-4-3-g-sheepfold-death
    tradition: ane-sumerian
    title: "Dumuzid's dream: the sister's lament, the demons enter the sheepfold seven times, the dream fulfilled and Dumuzid dead"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Sumerian"
    read: ["ETCSL 1.4.3 240-261"]
    tags:
      - {motif: sister-laments-scratching-face, refs: ["ETCSL 1.4.3 240-245"], note: "{d}ŋeštin-an-na-ke4 gu3 an-še3 ba-te gu3 ki-še3 ba-te / gu3 šu niŋin2-bi an-ur2-ra tug2-gin7 i-im-dul ... / igi mu-un-na-hur giri17 mu-un-na-hur / ŋeštug2 ... haš4-gal mu-un-na-hur"}
      - {motif: cry-reaches-heaven-and-abzu, refs: ["ETCSL 1.4.3 240-241"], note: "her cry reaches heaven and earth and covers the horizon like a cloth; no gods hide here"}
      - {motif: demons-raid-fold-seven-times, refs: ["ETCSL 1.4.3 249-260"], note: "gal5-la2 1 amaš tur3-še3 kur9-ra-ni / {ŋiš}gag-ga-ra izi ba-ni-in-ra / 2-kam-ma ... {ŋiš}ma-nu izi ba-ni-ra / 3-kam-ma ... {dug}šakir3 ... TUN3-bi ba-ra-ba9-re6 ... 7-kam-ma amaš tur3-še3 kur9-ra-ni (F)"}
      - {motif: ominous-dream-of-ruined-fold, refs: ["ETCSL 1.4.3 259", "ETCSL 1.4.3 260"], note: "dream fulfilled verbatim: {dug}šakir3 i3-dur2-dur2 ga nu-un-de2 / an-za-am i3-dur2-dur2 {d}dumu-zid nu-un-til3 amaš lil2-la2 al-du3"}
    hints:
      - "A dream fulfilled word for word: compare Gen 41:13 (as he interpreted to us, so it was) and Gen 37:5-11 with Gen 42:6."
      - "The sister's mourning by scratching her face: contrast Lev 19:28 and Deut 14:1 (do not gash yourselves for the dead); compare Jer 16:6 and Jer 48:37."
      - "The dying shepherd god and the mourning for him: compare Ezek 8:14 (women weeping for Tammuz) and Zech 12:11 (mourning for Hadad-rimmon)."
