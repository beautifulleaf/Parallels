# Full read of the ANE corpus, chunk 15: ETCSL 6.2.1-6.2.5 (proverb collections from Nibru, Susa, Urim, Unug and of unknown provenance), the Ur III and Old Babylonian literary catalogues (ETCSL 0.1.1-0.2.13), Dumuzid's dream (1.4.3), the Marriage of Martu (1.7.1) and Ninĝišzida's journey to the nether world (1.7.3). Proverbs read from the ETCSL Sumerian composites; catalogues and the three narratives read from the ORACC lemmatized composites with word glosses.
new_motifs:
  let-his-bread-be-foul-curse: {label: "Imprecation-saying: let his bread be foul food that no man will eat", cluster: wisdom}
  exotic-animals-of-distant-lands-devour-trees: {label: "Exotic animals of distant lands (the donkey of Anšan, the bear of Marḫaši, the cat of Meluḫa, the elephant of the east) bite off great trees as if they were leeks", cluster: wisdom}
  courtesan-in-the-streets-proverb: {label: "A proverb about a courtesan (harimtu, kar-kid) who stands in the streets and does not help a fallen man", cluster: wisdom}
  conqueror-without-lasting-work-goes-down-despondent: {label: "A ruler who captured a city but did not destroy its walls and built a temple only to abandon it never saw mighty kingship and went down despondent to the nether world", cluster: wisdom}
  do-not-overturn-the-cult-proverb: {label: "Saying: the rites and divine powers (me, ĝarza) of a place must not be changed or destroyed; when they are, its cult is annihilated", cluster: cult}
  destiny-seen-drifting-on-water: {label: "Saying: 'I looked into the water and my destiny was drifting past'", cluster: wisdom}
  ruined-by-own-wealth-lament: {label: "Saying: 'Because of my silver, my gold, my money chest ... I am finished': one's wealth is one's ruin", cluster: wisdom}
  dispute-at-mill-reveals-theft: {label: "Saying: if there is a dispute at the mill, the slave girl reveals what she has stolen (quarrels expose hidden wrongs)", cluster: wisdom}
  mocker-mocked-weeps: {label: "A jester who made fun of the city is mocked in turn and weeps", cluster: wisdom}
  great-men-start-quarrels-small-men-fight: {label: "Saying: great men stir up the conflict and lesser men fight it out", cluster: wisdom}
  mother-can-change-ones-fate: {label: "Saying: 'my fate is her voice': one's mother can change one's destiny", cluster: wisdom}
  prayer-gives-birth-to-life: {label: "Saying: prayer (sizkur) has given birth to a man's life", cluster: piety}
  just-mans-son-lies-hungry: {label: "Complaint-saying: the son of the just man lies hungry", cluster: theodicy}
  widow-cannot-become-principal-wife: {label: "A widow or junior wife laments that widows can never become principal wives", cluster: family}
  pity-the-weak-not-the-strong: {label: "Saying: do not be hostile to the weak and do not weep for the strong", cluster: wisdom}
  worshipper-without-standing-before-goddess: {label: "A worshipper prostrates himself before his goddess yet feels he has no place to stand", cluster: piety}
  son-before-he-existed: {label: "Saying: 'Come, you are our son, even from when you did not exist'", cluster: family}
  endless-talk-human-preoccupation: {label: "Saying: talking endlessly is what humankind has most on its mind", cluster: wisdom}
  creature-voice-is-glory-of-its-habitat: {label: "Saying: the voice (or head) of a bird or frog is the glory (me-te) of its garden, marsh or field", cluster: wisdom}
  what-is-in-mouth-not-in-hand: {label: "Saying: what is in one's mouth (promised) is not in one's hand (delivered)", cluster: wisdom}
  fettered-dog-quarrelsome: {label: "Saying: a dog that is restrained becomes quarrelsome, and one should not start a fight with a dog", cluster: wisdom}
  thief-of-storehouse-punished-by-god: {label: "Saying: he who steals from the stores is punished by his god", cluster: wisdom}
  divorcing-husband-keeps-his-dignity: {label: "Saying: a husband divorcing his wife claims at least to be taking away his dignity", cluster: family}
  libation-water-drunk: {label: "Saying: the water provided for libations was drunk instead", cluster: wisdom}
  justice-creates-life: {label: "Saying: who can compare with justice (niĝ2-gen6-na)? it creates life", cluster: justice}
  sun-god-never-idle-against-wickedness: {label: "Saying: whenever wickedness causes trouble, the sun god (Utu) will not be idle", cluster: justice}
  wealth-brings-sleeplessness: {label: "Saying: he who has silver is happy, he who has grain comfortable, but he who has livestock cannot sleep", cluster: wisdom}
  leftover-bread-eaten-by-stranger: {label: "Saying: if bread is left over the mongoose eats it; if I have bread left over a stranger consumes it", cluster: wisdom}
  greed-of-the-wealthy-abomination: {label: "Saying: to be wealthy and demand more is an abomination to a god", cluster: wisdom}
  where-no-dogs-fox-is-boss: {label: "Saying: in the city with no dogs the fox is boss (in the city of the lame the halt are couriers)", cluster: wisdom}
  sun-god-seeks-harbour-for-trustworthy-boat: {label: "Saying: when a trustworthy boat is sailing the sun god seeks out a trustworthy harbour for it", cluster: justice}
  no-escape-raven-mongoose-lion: {label: "Saying: in the sky the raven, on the ground the mongoose, in the desert the lion: 'where shall I go?'", cluster: wisdom}
  liar-pointed-at-front-and-back: {label: "Saying: when liars enter the city gate there is a finger pointing at them in front and behind", cluster: wisdom}
  scribal-competence-proverbs: {label: "Proverbs about the scribe: one who does not know his own name, or Sumerian, is a disgrace; one who knows a single line but writes a good hand is a true scribe", cluster: scribal}
  disgraced-professional-changes-trade: {label: "Saying: a disgraced scribe becomes an incantation priest, a disgraced singer a flute-player, a disgraced merchant a con-man", cluster: wisdom}
  fox-boasts-to-make-flood: {label: "Fable-saying: a fox urinates into the Tigris and boasts that he is making the spring flood rise", cluster: fable}
  neck-stock-before-catching-fox: {label: "Saying: he has not caught the fox yet but is already making a neck-stock for it", cluster: wisdom}
  strangers-ox-eats-mine-hungry: {label: "Saying: a stranger's ox eats grass while my own lies hungry", cluster: wisdom}
  good-and-evil-are-in-the-hands: {label: "Saying: good is in the hands and evil is also in the hands (a man's deeds are his own)", cluster: wisdom}
  palace-forest-king-lion: {label: "Saying: the palace is a forest and the king a lion who covers men with a great battle-net", cluster: kingship}
  freeborn-cannot-avoid-corvee: {label: "Saying: as the palace cannot avoid waste land and the barge straw, the freeborn man cannot avoid corvée work", cluster: wisdom}
  storm-god-splits-heavens-not-waterskin: {label: "Saying: the storm god splits the heavens yet does not split the waterskin", cluster: wisdom}
  unruly-mouth-and-tongue: {label: "Self-address to one's mouth and tongue: the tongue like a runaway donkey does not turn back; the mouth devours everything", cluster: wisdom}
  personal-god-is-mans-shepherd: {label: "Saying: a man's god is a man's shepherd who does not desert him and gives him food and water", cluster: piety}
  animal-relieved-of-burden-speaks: {label: "Fable-saying: a horse or donkey, having thrown off its load, comments on its burden", cluster: fable}
  dog-feigns-grief-at-drowning-donkey: {label: "Fable: a dog on the bank promises tears for a donkey floating in the river, calling him 'my own dear father'", cluster: fable}
  captured-goat-tricks-lion: {label: "Fable: a lion catches a goat, which promises a ewe in exchange and tricks the lion about its name", cluster: fable}
  lion-deafened-by-boar: {label: "Fable: a lion catches a boar: 'your flesh has not filled my mouth but your squeals have deafened my ears'", cluster: fable}
  dog-proverbs-cluster: {label: "Proverbs about the dog: it understands 'take it' but not 'put it down', it collects bones, a pampered dog becomes a puppy, a rabid dog is flayed", cluster: fable}
  god-grants-sleep-or-creature-expires: {label: "Saying (of a hibernating bear): were the high god not to bestow sleep, creatures would expire", cluster: wisdom}
  fox-fables-cluster: {label: "Fables of the fox: it boasts, plots treachery, hides under a thorn bush from a dog, frets over its mother", cluster: fable}
  intelligence-beats-strength: {label: "Saying: strength cannot keep pace with intelligence", cluster: wisdom}
  god-helps-the-lame-man: {label: "Saying: do not give the lame man a club for his arm; Enlil will be his help", cluster: piety}
  slave-girl-pulls-husbands-hair: {label: "Saying: the slave girl with no authority over her mistress pulls her husband's hair instead", cluster: wisdom}
  cities-do-not-greet-people-do: {label: "Saying: one city does not greet another, but one person greets another", cluster: wisdom}
  slanderer-punished-sun-god-loves-justice: {label: "The slanderer and liar is pointed at from behind; a goddess crushes his head and the sun god, lover of justice, extirpates wickedness and prolongs righteousness", cluster: justice}
  fire-god-devours-land-in-war: {label: "When battle and war arise the plans of the gods are destroyed and the fire god devours the land", cluster: war}
  fortune-dispersed-none-knows-future: {label: "A wealthy man's fortune is dispersed and he cannot work out why: things change, no one knows what will happen", cluster: wisdom}
  no-child-born-without-sin: {label: "Saying: a child without sin was never born by his mother; there never was anyone who was not a sinner", cluster: theodicy}
  man-without-personal-god-fails: {label: "Saying: a man without a personal god gets no food, catches no fish or gazelle, succeeds in nothing; if his god favours him, all is provided", cluster: piety}
  honour-elders-mother-older-brother: {label: "Instructions: pay attention to an old man's words, be modest toward your mother, honour your older brother", cluster: wisdom}
  fool-succeeds-where-wise-strain: {label: "Saying: no matter how wisdom exerts itself, the fool achieves what he needs", cluster: wisdom}
  mouse-defies-mongoose: {label: "Fable: a mouse fallen from the roof beams tells the solicitous mongoose to keep away", cluster: fable}
  poor-man-afflicts-rich: {label: "Saying: the poor man causes all kinds of trouble (illness) for the rich man", cluster: wisdom}
  wealthy-wait-at-gate-of-barley-owner: {label: "Saying: he who has silver, lapis, oxen and sheep waits at the gate of the man who has barley", cluster: wisdom}
  speech-cannot-be-hidden: {label: "Saying: what is in mankind's mouth is as hard to hide as a wall; do not slander the boy of your town", cluster: wisdom}
  mother-warns-hidden-mouse: {label: "Fable: a little mouse says no one saw it go out; its mother answers that whoever saw it will carry it off", cluster: fable}
  speaking-brings-no-gain: {label: "Saying: 'Although I spoke, what did I gain? I covered up for myself, but what success did it bring me?'", cluster: wisdom}
  human-intelligence-from-god: {label: "Saying: man's intelligence (umuš) comes from god", cluster: wisdom}
  despiser-of-god-unburied-ghost-unwatered: {label: "A man who does not value his god is thrown out in the desert unburied, and his heir pours no water for his ghost through the libation pipe", cluster: underworld}
  each-tool-to-its-craftsman: {label: "Saying: the axe belongs to the carpenter, the stone to the smith, the good malt to the brewer", cluster: wisdom}
  sins-absolved-life-renewed: {label: "Saying: pleasure is created, sins are absolved (nam-tag du8), life is rejuvenated", cluster: piety}
  mule-knows-not-its-parents: {label: "Saying: 'O mule, do you know your sire, do you know your mother?'", cluster: wisdom}
  each-creature-to-its-hole: {label: "Wish: let the snake find its deep hole, the scorpion its crevice and the hyena its exit", cluster: wisdom}
  just-man-lives-long: {label: "Saying: the just man's life is long; life is the gift awarded for justice", cluster: justice}
  brotherhood-from-quarrel-friendship-in-court: {label: "Saying: brotherhood is founded on the words of a quarrel; at the witness box friendship becomes known", cluster: wisdom}
  learn-craft-by-following: {label: "Saying: by following craftiness one learns to be crafty, by following wisdom one learns to be wise", cluster: wisdom}
  earth-greater-than-heaven: {label: "Saying: earth is greater than heaven; who can destroy it?", cluster: cosmology}
  inheritance-share-added-abomination: {label: "Saying: adding an inheritance share to an inheritance share is an abomination to Utu", cluster: justice}
  driving-son-from-fathers-house-abomination: {label: "Saying: a judge who despises justice, cursing with the right hand, and chasing a younger son from his father's house are abominations to a god", cluster: justice}
  enlil-holds-sky-earth-dangles: {label: "Saying: he (Enlil) holds up the sky and lets the earth dangle from his hands", cluster: cosmology}
  hunger-greatest-divine-punishment: {label: "Saying: Enlil's greatest punishment is hunger", cluster: theodicy}
  winds-characterised: {label: "Sayings on the winds: the east wind brings rain and prosperity, the west wind is greater than those who live there", cluster: nature}
  warrior-equal-to-many: {label: "Saying: the warrior is unique; he alone is the equal of many", cluster: war}
  ship-sinks-without-wind: {label: "Saying: a Dilmun ship sank although there was no wind (disaster without visible cause)", cluster: wisdom}
  lion-says-plants-have-no-names: {label: "Fable-saying: to a list of named plants the lion roars 'these have no names'", cluster: fable}
  fools-lot-created-by-sun-god: {label: "Saying: the fool's lot was created by Utu", cluster: wisdom}
  workers-lift-eyes-to-god-of-cursed-city: {label: "Farmer, herdsman, potter and gardener each lift their gaze to Enlil: 'may Enlil look upon the city that he cursed'", cluster: lament}
  repay-favour-to-favour-giver: {label: "Saying: let the favour be repaid to him who repays a favour", cluster: wisdom}
  palace-falls-of-its-own-accord: {label: "Saying: a palace will fall of its own accord", cluster: wisdom}
  what-god-destroyed-none-can-take: {label: "Saying: what has been destroyed belongs to a god; no one can take it away", cluster: theodicy}
  snake-charmer-pulls-tooth: {label: "A snake charmer has a snake and pulls out its tooth", cluster: wisdom}
  touching-woman-improperly-abomination: {label: "Saying: touching a woman's genitals over her clothes is an abomination to the moon god", cluster: sexuality}
  just-words-bring-favourable-fate: {label: "Saying: thanks to his personal god's word, the man who speaks just words has a favourable fate and the god is with him all day", cluster: piety}
  leader-burning-none-asks-for-him: {label: "Saying: if the leader is consumed by fire, those behind him do not ask 'where is the leader?'", cluster: wisdom}
  millstone-floats-for-righteous: {label: "Saying: for a righteous man a millstone will float in the river", cluster: justice}
  king-as-scribe-and-dam: {label: "Saying: the king is a scribe; the king is a mighty bond blocking the river", cluster: kingship}
  literary-catalogue-of-incipits: {label: "A tablet lists literary compositions by their first lines (incipits), sometimes grouped and totalled", cluster: scribal}
  ominous-dream-of-ruined-fold: {label: "A shepherd god dreams of his own death: rushes rising, reeds bowing, his churn and cup lying empty, his fold given to the wind", cluster: dream}
  sister-interprets-brothers-dream: {label: "A sister, skilled in dreams, interprets her brother's dream item by item as foretelling his capture and death", cluster: dream}
  hunted-god-hides-in-grass-and-ditches: {label: "The hunted god hides among the grasses, small and large, and in the ditches of Arali, but is found", cluster: underworld}
  demons-from-the-cities-come-in-pairs: {label: "Demons come for the victim in pairs from each city in turn (Adab, Akšak, Unug, Urim, Nibru)", cluster: underworld}
  sister-refuses-bribe-to-betray-brother: {label: "Demons offer the sister a river full of water and a field full of grain to reveal her brother's hiding place; she refuses", cluster: underworld}
  friend-takes-bribe-betrays-hiding-place: {label: "The victim's friend accepts the demons' gift of water and grain and reveals where he hides", cluster: underworld}
  captive-pleads-kinship-with-sun-god: {label: "The bound captive raises his hands to the sun god, reminding him that he is his brother-in-law, husband of his sister Inana", cluster: prayer}
  refuge-in-house-of-old-woman: {label: "The fugitive takes refuge in the house of an old woman (Old Woman Belili), pretending to be a god's spouse and asking for water and flour", cluster: underworld}
  demons-raid-fold-seven-times: {label: "The demons enter the sheepfold one after another (seven times), striking the door, the wood, the churn and the cup, until the god is dead", cluster: underworld}
  sister-laments-scratching-face: {label: "The sister's lament reaches heaven and earth and she scratches her eyes, nose, ears and thighs in mourning", cluster: lament}
  bachelor-asks-mother-for-wife: {label: "A young god sees that married men get double food portions and asks his mother to let him take a wife", cluster: marriage}
  rations-double-for-married-triple-for-fathers: {label: "At the distribution of food portions the married man gets two, the man with a child three, the bachelor one", cluster: society}
  wrestling-contest-at-festival: {label: "At a city festival the hero wrestles (ĝešba) in the great courtyard and fells all comers", cluster: athletics}
  victor-chooses-daughter-over-silver: {label: "The victor refuses silver and precious stones and asks instead for the god's daughter in marriage", cluster: marriage}
  bridegroom-offers-herds-as-bride-price: {label: "The suitor offers cattle, sheep and goats as marriage gifts and gold and silver to the bride's family and city", cluster: marriage}
  nomad-uncivilized-stereotype: {label: "The nomad is described as uncivilized: lives in tents in wind and rain, offers no prayer, digs truffles, does not bend the knee, eats raw meat, has no house in life and no burial at death", cluster: ethnography}
  bride-accepts-uncivilized-groom: {label: "A friend warns the girl against marrying an uncouth outsider, but she replies 'I will marry Martu'", cluster: marriage}
  god-boards-barge-to-underworld: {label: "A god boards a barge for his journey to the nether world while his sisters sing at prow and stern", cluster: underworld}
  underworld-provides-no-water-food-wool: {label: "In the nether world the river gives no water to drink, the field no flour, the sheep no wool", cluster: underworld}
  sister-offers-jewels-to-demon-for-brother: {label: "A sister offers the chief demon her lapis jewels and asks that her brother on his way to the nether world be given bread and water", cluster: underworld}
  underworld-god-weeps-no-more-enjoys-throne: {label: "The god in the nether world is honoured on his throne, eats and drinks and is pleased by the lyre of Ereškigal", cluster: underworld}
  lament-for-city-left-by-its-en: {label: "The lament calls on the city and its shrine 'your house, ah!' as its en priest leaves the ĝipar", cluster: lament}
  nature-called-to-lament-for-doomed-shepherd: {label: "A doomed shepherd god calls on the steppe, the reed-beds, the crabs and frogs of the river and his mother to raise a lament for him", cluster: lament}
  king-head-in-dust-feet-in-mire: {label: "In mourning the king's head is rolled in the dust and his feet trodden in the mire of the street", cluster: lament}
  birds-of-prey-seize-lamb-and-sparrow: {label: "In an ominous dream a bird of prey seizes a lamb from the sheep-house and a falcon catches a sparrow in the reed fence", cluster: dream}
  lookout-climbs-mound-sees-pursuers: {label: "A woman climbs a mound to look out and sees the pursuers coming for her brother", cluster: underworld}
  fugitive-curses-any-who-reveal-him: {label: "The fugitive binds his helpers by a curse: if you reveal my hiding place, may your own dog devour you", cluster: oath}
  curse-on-betrayers-children: {label: "The betrayed man blesses the loyal helper's child and curses the betrayer's child: one shall be kissed in the street, the other not", cluster: oath}
  mother-will-not-know-day-of-death: {label: "The doomed man tells his mother she will not know the day he dies and asks her to weep for him", cluster: lament}
units:
  - id: ane-etcsl-6-2-1-1a-nibru-proverbs-fragments-1-3
    tradition: ane-sumerian
    title: "Proverbs from Nibru, segments 1-3: fragments, the exotic animals of distant lands, the courtesan in the street"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Sumerian"
    read: ["ETCSL 6.2.1 1.A:1-3.B:13"]
    tags:
      - {motif: exotic-animals-of-distant-lands-devour-trees, refs: ["ETCSL 6.2.1 3.A:4-8"], note: "di-bi-da an-ša4-an{ki}-na, dim3-šaḫ2 mar-ḫa-ši{ki}, gul-lum me-luḫ-ḫa{ki}, til-lu-ug sa12-ti-um{ki} ... {ĝiš}asal2 ... ga-raš{sar}-gin7 šab-šab-e; bilingual, Akkadian glosses (pi-i-ir ša-ad-di-im 'elephant of the mountains'); 1.A-2.B almost wholly broken (lion, wife, dragon, merchant, 'because of my silver ... I am finished' 2.A:9-13)"}
      - {motif: ruined-by-own-wealth-lament, refs: ["ETCSL 6.2.1 2.A:9-13"], note: "[kug-ĝa2]-ke4-eš [kug-sig17]-ĝa2-ke4-eš [dub-šen]-ĝa2-ke4-eš ... [ĝe26-e] ba-til-de3-en-e-še; largely restored from duplicates"}
      - {motif: courtesan-in-the-streets-proverb, refs: ["ETCSL 6.2.1 3.B:6-7"], note: "[{f}kar]-ke4 ... sila šub / lu2 šub-ba na-an-ĝar; Akkadian ḫa-ri-im-tum ša i-na su2-qi3-im; the kar-ke4 is restored, the Akkadian gloss confirms harimtu"}
      - {motif: where-no-dogs-fox-is-boss, refs: ["ETCSL 6.2.1 3.A:9"], note: "a pickaxe in the clay is 'a mongoose in its city' ({d}nin-kilim-ma iri-na): the small creature is master at home; interpretive"}
    hints:
      - "The kar-kid / harimtu in the street: compare Prov 7:10-12 (the woman in the streets and squares) and Prov 23:27-28."
      - "Distant lands and their animals (elephant, monkey) as exotica: compare 1 Kgs 10:22 (ivory, apes and peacocks from Tarshish)."
  - id: ane-etcsl-6-2-1-4a-nibru-proverbs-4-8
    tradition: ane-sumerian
    title: "Proverbs from Nibru, segments 4-8: Nanni who went down despondent, the cult not to be changed, the destiny in the water, the mill"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Sumerian"
    read: ["ETCSL 6.2.1 4.A:1-8.B:7"]
    tags:
      - {motif: conqueror-without-lasting-work-goes-down-despondent, refs: ["ETCSL 6.2.1 4.A:9-12"], note: "si-mu-ur-ru-um i3-dab5 bad3-bi nu-un-gul / e2-an-na i3-du3 u3-mu-un-šub / nam-lugal kalag-ga igi nu-mu-ni-du8 / ur5 na-an-na šag4 sig-ga kur-ra ba-ra-an-de6; mostly restored from duplicates"}
      - {motif: do-not-overturn-the-cult-proverb, refs: ["ETCSL 6.2.1 7.A:1-2"], note: "[me-bi na-ab-ta-ab-ḫa-lam]-me-en-ze2-en / [gud-de3] ki-gub-bi na-ab-[ta-ab-kur2-ru]-de3-en-ze2-en: 'do not destroy their me, do not move the oxen from their places'"}
      - {motif: destiny-seen-drifting-on-water, refs: ["ETCSL 6.2.1 7.A:4"], note: "[a-a] igi i-ni-bar nam-tar-ĝu10 ba-[dib-ba]"}
      - {motif: ruined-by-own-wealth-lament, refs: ["ETCSL 6.2.1 7.B:3-5"], note: "…-ke4-eš …-ke4-eš [ĝe26-e] ba-am3-til3-la: second copy of the 'because of ... I am finished' saying"}
      - {motif: dispute-at-mill-reveals-theft, refs: ["ETCSL 6.2.1 7.C:1-3"], note: "e2-[{na4}kinkin-na du14 ḫe2-en-ĝal2] geme2 [niĝ2 zuḫ-a] ḫe2-[em-ma-ab-ed3-de3]; restored from 6.2.5 6:7"}
      - {motif: let-his-bread-be-foul-curse, refs: ["ETCSL 6.2.1 4.A:1-4"], note: "[ninda-ni niĝ2]-ussu ... [lu2 nu-mu-un-šu2]-šu2: 'let his bread be foul food, no man should eat it'; restored"}
    hints:
      - "A king who built and abandoned, then went down to the underworld unfulfilled: compare Eccl 2:18-21 and Isa 14:9-11 (the king going down to Sheol)."
      - "'Because of my silver ... I am finished': compare Eccl 5:12-13 (riches kept to the owner's hurt) and Jas 5:1-3."
      - "A quarrel reveals hidden theft: compare Prov 26:26 (hatred covered by guile, its wickedness revealed before the assembly)."
  - id: ane-etcsl-6-2-1-9-nibru-proverbs-9-19
    tradition: ane-sumerian
    title: "Proverbs from Nibru, segments 9-19: the clown, the vixen, abominations to the god, great and little men"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Sumerian"
    read: ["ETCSL 6.2.1 9:1-19:6"]
    tags:
      - {motif: mocker-mocked-weeps, refs: ["ETCSL 6.2.1 9:8-10"], note: "ud-da-tuš-a ugu iri-ke4 a-tar i3-ak-e / ugu-ni a-tar mu-ni-ib-ak-e-eš / er2 i3-še8-še8"}
      - {motif: talking-animal, refs: ["ETCSL 6.2.1 10.A:2-5"], note: "vixen/fox (ka5-a) sayings: 'the vixen quenched her thirst but her teats were dry'; each fox more ... than its mother"}
      - {motif: abomination-to-a-named-god, refs: ["ETCSL 6.2.1 12:2-5"], note: "aḫ uš7 saḫar nu-[gi4-a] / eme ak an-bar7 [an-dul3 nu-ĝa2-ĝa2] ... niĝ2-gig {d}[…]: spitting without covering it with dust and kissing with the tongue at midday without shade are an abomination to the god; the god's name is broken"}
      - {motif: mother-can-change-ones-fate, refs: ["ETCSL 6.2.1 13.A:4"], note: "[nam-tar-ĝu10 gu3-nam] ama-ĝu10 mu-da-[kur2]; partly restored"}
      - {motif: great-men-start-quarrels-small-men-fight, refs: ["ETCSL 6.2.1 17:2-3"], note: "lu2-tur-re ga-ba-al mu-ni-in-du3-uš-a / lu2 gu-la du14 ḫa-ra-ni-ib-mu2-mu2"}
      - {motif: honour-elders-mother-older-brother, refs: ["ETCSL 6.2.1 17:4-5"], note: "lu2-tur-re ama-ni ki an-aĝ2 / šeš-gal šeš-gal ...: 'the little one loves his mother, an older brother ...'"}
    hints:
      - "Spitting must be covered with dust: compare Deut 23:13-14 (covering excrement because God walks in the camp); the niĝ2-gig saying recalls the to'evah sayings of Prov 6:16-19."
      - "The mocker mocked: compare Prov 9:7-8, Prov 19:29 and 2 Kgs 2:23-24."
      - "Great men stir up strife for the small to fight: compare 2 Sam 2:14-16 (Abner: 'let the young men arise and play before us')."
  - id: ane-etcsl-6-2-1-20-nibru-proverbs-20-44
    tradition: ane-sumerian
    title: "Proverbs from Nibru, segments 20-44: prayer and life, the just man's hungry son, the widow, Gula, the son before he existed"
