      - {motif: demons-from-the-cities-come-in-pairs, refs: ["ETCSL 1.4.3 119-129"], note: "lugal-ra dumu adab{ki}-a 2-am3 ... dumu akšak{ki} 2-am3 ... dumu unug{ki}-ga 2-am3 ... dumu urim2{ki}-ma 2-am3 ... dumu nibru{ki} 2-am3; Adab's pair: {ŋiš}kiši16 a šu-ru-ug-ga ... šu-ni {ŋiš}banšur-ra eme-ni e2-gal-la"}
      - {motif: sister-refuses-bribe-to-betray-brother, refs: ["ETCSL 1.4.3 130-139"], note: "{d}ŋeštin-an-na-ke4 amaš tur3-še3 mu-ni-in-dab5-be2-ne / id2 a-ba mu-un-na-ba-e-ne šu nu-um-ma-gid2-de3 / a-šag4 še-ba ... šu nu-um-ma-gid2-de3; the demons: nin9 ki šeš am3-mu-un-pad3-de3-a ud ul-la2-ta a-ba-a igi mi-ni-in-du8-a 'since days of old who has seen a sister reveal her brother's place?'"}
      - {motif: friend-takes-bribe-betrays-hiding-place, refs: ["ETCSL 1.4.3 140-150"], note: "gu5-li-ni-ir ... id2 a-ba mu-un-na-ba-e-ne šu am3-ma-gid2-de3 / a-šag4 še-ba ... šu am3-ma-gid2-de3 / gu5-li-ŋu10 saŋ u2-a he2-en-šub ki-ni ba-ra-zu"}
      - {motif: betrayal-by-intimate-friend, refs: ["ETCSL 1.4.3 140-144A", "ETCSL 1.4.3 153"], note: "iri-a nin9-ŋu10 mu-un-til3-le-en gu5-li-ŋu10 mu-un-ug5-ge-en: 'in the city my sister saves my life, my friend kills me'"}
      - {motif: hunted-god-hides-in-grass-and-ditches, refs: ["ETCSL 1.4.3 145-151"], note: "searched in the grasses small and large without success, he is caught in the ditches of Arali (eg2 a-ra-li-ka mu-ni-in-dab5-be2-ne)"}
      - {motif: curse-on-betrayers-children, refs: ["ETCSL 1.4.3 154-155"], note: "dumu nin9-e sila-a he2-en-gub lu2 ne he2-su-ub-be2 / dumu gu5-li sila-a he2-en-gub lu2 ne na-an-su-ub-be2: may the sister's child be kissed in the street, the friend's child not"}
      - {motif: captive-bound-like-wild-bull, refs: ["ETCSL 1.4.3 156-163"], note: "lu2 ba-an-niŋin2-niŋin2-ne-eš ... gu mu-un-na-sur-ru-ne sa mu-un-na-keše2-da-ne ... šu-ni šu-du3-a ba-e-dab5-be2 / a2-ni a2-la2-a ba-e-la2-e: surrounded, netted, beaten, hands in manacles, arms bound"}
    hints:
      - "The sister refuses the bribe, the friend accepts it: compare Judg 16:5 (Delilah bribed by the lords of the Philistines), Ps 41:10 and Ps 55:13-15 (betrayed by the familiar friend)."
      - "'Who has ever seen a sister reveal her brother's place?': compare Prov 17:17 (a brother is born for adversity) and Prov 18:24."
      - "Demons who eat no bread, drink no water, take no gifts, know no wife's embrace: compare Deut 10:17 (God takes no bribe) inverted, and Job 1:7."
      - "The captive surrounded, netted and bound: compare Ps 18:5-6 (cords of Sheol, snares of death) and Judg 16:21."
