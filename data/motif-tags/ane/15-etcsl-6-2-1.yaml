      - {motif: eyes-of-servants-to-masters-hand, refs: ["ETCSL 6.2.5 4.A:7-14"], note: "farmer, herdsman, potter and gardener 'lift their eyes' to Enlil, asking him to lift his eyes to the city he cursed; interpretive match"}
      - {motif: repay-favour-to-favour-giver, refs: ["ETCSL 6.2.5 4.B:1"], note: "šu [gi4-gi4-ra šu ḫe2-en-na-gi4]; restored"}
      - {motif: palace-falls-of-its-own-accord, refs: ["ETCSL 6.2.5 4.B:2"], note: "e2-gal [ni2-bi]-še3 gam-[e-dam]"}
      - {motif: driving-son-from-fathers-house-abomination, refs: ["ETCSL 6.2.5 4.B:3-5"], note: "dumu-nitaḫ e2 ad-[da]-na-ka sa-ra / niĝ2-gig {d}nin-urta-kam"}
      - {motif: vengeance-is-mine, refs: ["ETCSL 6.2.5 4.B:6"], note: "šu gi4-[gi4 niĝ2]-gig {d}nin-urta-kam: lit. 'retaliation is the niĝ2-gig (reserved thing, taboo) of Ninurta'; ETCSL renders 'the prerogative of Ninurta'"}
      - {motif: abomination-to-a-named-god, refs: ["ETCSL 6.2.5 4.B:5", "ETCSL 6.2.5 4.B:6", "ETCSL 6.2.5 4.B:7"], note: "three niĝ2-gig {d}nin-urta-kam sayings in a row"}
      - {motif: poor-man-afflicts-rich, refs: ["ETCSL 6.2.5 5.B:4"], note: "lu2 niĝ2-tuku lu2 niĝ2 nu-tuku gig-še3 in-[ĝar]"}
    hints:
      - "Each worker lifts his eyes to the god: compare Ps 123:1-2 (as the eyes of servants to their master's hand) and Ps 121:1; 'may Enlil look on the city he cursed': compare Lam 5:1 and Lam 1:11."
      - "Retaliation belongs to Ninurta: compare Deut 32:35 (vengeance is mine), Lev 19:18 and Prov 20:22 (do not say, I will repay evil; wait for YHWH)."
      - "Repay favour with favour: compare Prov 17:13 and 2 Sam 10:2."
      - "A palace falls of its own accord: compare Ps 127:1 and Prov 14:1."
  - id: ane-etcsl-6-2-5-6-unprov-righteousness-pig-enlil
