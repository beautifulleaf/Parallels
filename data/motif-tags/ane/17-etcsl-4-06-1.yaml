# Full read of the ANE corpus, chunk 17: ETCSL 4.06.1 - Anzû (Old Babylonian).
# Sumerian hymns, love songs, debates and instructions read from the ORACC lemmatized composites
# (no translation in the data; read with the word glosses); Adapa, Advice to a Prince, Angim and Anzû
# read from the eBL Akkadian text, eBL's English used as a reading aid only.
new_motifs:
  god-powers-great-none-can-rival-refrain: {label: "Refrain addressed to a god: 'your divine powers (me) are great, no one can rival them'", cluster: divine-epithets}
  god-as-night-watchman-of-streets: {label: "A god keeps the night watch over the city: he patrols the broad streets and rooftops, and opens the gates at sunrise", cluster: divine-epithets}
  temple-estate-safe-from-officials: {label: "On the god's estate no inspector seizes the fish, no farmer takes dues, no herdsman counts the sheep for himself: his property is untouchable", cluster: justice}
  god-escorts-dead-to-netherworld: {label: "A god is the great constable who leads the dead to the netherworld", cluster: underworld}
  invoking-gods-name-protects-at-night: {label: "A man who takes the god's name (swears or calls on it) is kept safe on the silent street at night", cluster: petition}
  seven-creatures-numbered-one-to-seven: {label: "Seven ominous creatures are listed by number (the first is a fox, the second a dog, the third a raven ...), each with its gesture or cry", cluster: demons}
  seven-demons-neither-male-nor-female: {label: "A band of seven (demons or divine agents) is 'neither female nor male'", cluster: demons}
  seven-demons-strike-men-and-women: {label: "The seven strike the man and bind the woman's arm, laying a weapon at her side", cluster: demons}
  gods-stand-beside-god-litany: {label: "Litany: at each holy place a named deity 'stands beside you' (ša-ra-da-gub) to serve the god", cluster: cult}
  enki-fathers-seven-sons: {label: "Enki begets seven sons, who become a band of seven brothers in a god's service", cluster: theogony}
  seven-brothers-each-bring-offering-litany: {label: "Litany of seven brothers: the first, second, third ... each stands beside the god and brings his due (beer, water, fish, bread, barley, syrup and wine)", cluster: cult}
  storm-sinks-boat-of-godless: {label: "The storm-wind sinks the boat in the reed-bed and at sea for the man whom no god protects", cluster: petition}
  sun-god-stands-at-the-scales: {label: "The sun god takes his stand at the place of the scales (ki ĝiš-erin2), the seat of fair dealing and judgment", cluster: justice}
  god-decides-fate-of-purchase: {label: "Whenever a man buys an ox, a sheep or a slave, the sun god asks the patron god and decrees the fate of the purchase", cluster: justice}
  god-blesses-marriage-wife-children-house: {label: "With the god's consent a man takes a wife, begets children and builds a house; the husband speaks kindly to his wife and she sits amid plenty", cluster: family}
  herald-blows-horn-to-assemble: {label: "A (divine) herald blows the horn and raises his voice to muster the army or the people", cluster: kingship}
  goddess-receives-insignia-of-an: {label: "A goddess wears An's holy crown and garment and holds An's sceptre, sitting in the assembly to decide the great case", cluster: divine-epithets}
  blessing-litany-may-you-be: {label: "A blessing litany of wishes 'may you be ...' (he2-me-en): good barley in the furrow, a man rich in silver and barley, a son of your god, the support of your city", cluster: love}
  girl-praised-as-speckled-grain-heap: {label: "The girl (Inana) is praised as a speckled grain heap fit for the king and as fragrant oil", cluster: love}
  sheepfold-without-milk-and-ghee: {label: "The herdsman finds no place in the pen, the ghee and milk are no longer brought: the fold is desolate", cluster: love}
  goddess-finds-jewels-and-puts-them-on-body-parts: {label: "The goddess finds jewel after jewel and places each on a part of her body (hips, head, nape, hair, ears, eyes, nose, mouth, navel, thighs, vulva, feet)", cluster: love}
  lover-body-crafted-by-artisans: {label: "The beloved's body is praised as the work of craftsmen: beard of lapis, limbs of gold, made by a skilled carpenter and a skilled metal-worker", cluster: love}
  personal-god-walks-road-with-traveller: {label: "Blessing that the person's god go with him by night and by day and smooth his road", cluster: petition}
  churn-sings-for-goddess: {label: "The churn of the sheepfold sings for the goddess and her shepherd-husband; she rejoices in the pen", cluster: love}
  god-destroys-evil-establishes-truth: {label: "A god destroys evil and violence and establishes truth (niĝ2-gen6-na) as a just judge", cluster: justice}
  amorite-god-given-mountain-as-gift: {label: "The god of the Amorites (Martu) is given the pure lapis-lazuli mountain, the land of Martu, as his gift", cluster: geography}
  god-born-of-an-and-uras-in-duranki: {label: "The moon god is born of An and Uraš in Duranki and wears the holy tiara of Urim", cluster: theogony}
  warrior-god-comes-from-mountains-among-sagaz: {label: "The warrior god (Nergal) is the lord who comes out of the mountains, from the place of the sa-gaz brigands", cluster: geography}
  god-suckled-pure-milk-of-mother: {label: "The god sucked the true milk at the holy breast of his loving mother", cluster: theogony}
  god-shepherd-counts-black-headed-seeks-ewes: {label: "The god is the shepherd who knows the number of the black-headed people and goes to seek the ewes and lambs", cluster: divine-epithets}
  deity-holds-tablet-of-life: {label: "A deity holds the 'tablet of life' (im nam-til3-la) in hand and by it sets the righteous man on his feet", cluster: divine-epithets}
  goddess-holds-measuring-line-and-rod: {label: "A goddess holds the lapis measuring line and the measuring rod", cluster: divine-epithets}
  birth-goddess-bears-en-lagar-and-king: {label: "The mother goddess gives birth to the en priest, the lagar priest and the king on his holy dais", cluster: kingship}
  mother-goddess-lows-like-cow-for-calf: {label: "The mother goddess calls out like a cow for its calf, seeking with a lament", cluster: lament}
  fertility-litany-every-creature-bears: {label: "Litany: for the god's sake the ewe bears the lamb, the goat the kid, the cow the calf, the donkey its foal, mankind children", cluster: fertility}
  prison-temple-described-part-by-part: {label: "The goddess's prison-house is described part by part: gate of evening, stair a dragon with open jaws, jambs daggers, foundations scorpions, bolts lions and snakes, arch like a rainbow", cluster: temple}
  door-opens-for-righteous-not-wicked: {label: "The great door does not open for the evildoer but opens for the righteous man", cluster: judgment}
  prisoners-brought-blindfolded-friends-estranged: {label: "The prisoner is led in with his eyes covered; acquaintances do not speak to him, brother neglects brother and friends no longer recognise one another", cluster: judgment}
  prison-bricks-crush-wicked-give-birth-to-just: {label: "The bricks of the prison crush the wicked and give birth to the righteous man", cluster: judgment}
  goddess-mother-of-compassion-relieves-sin: {label: "The goddess calls herself a compassionate mother who lifts the heavy sin from a man's hand and cools the angry heart", cluster: petition}
  prisoner-purified-like-silver-restored-to-god: {label: "The prisoner, cleansed like good silver and rubbed clean of dust, is returned into the kindly hand of his personal god, who praises the goddess", cluster: petition}
  people-pray-like-trembling-birds: {label: "Mankind prays to the god like a frightened bird", cluster: petition}
  fate-demon-without-hands-or-feet-walks-by-night: {label: "Namtar, the fate demon, has neither hands nor feet and carries men off by night", cluster: demons}
  sufferer-purified-like-gold-and-bronze: {label: "The restored sufferer is made to shine like gold and polished like bronze, and returned to his god's kindly hand", cluster: petition}
  god-as-table-setter-of-high-god: {label: "A god is the en of Enlil's table (banquet steward) whose laid portions no one may diminish", cluster: cult}
  sun-god-as-great-physician: {label: "The sun god is called the great physician (a-zu gal) and father of the black-headed", cluster: divine-epithets}
  seasons-begotten-by-enlil-on-mountains: {label: "Enlil couples with the great mountains and begets Summer and Winter, then fixes each one's destiny", cluster: creation}
  seasons-assigned-distinct-tasks: {label: "Each season is assigned its work: Summer founds houses, cities and harvest; Winter brings the flood, lambs, calves, fish-spawn and fruit", cluster: creation}
  rivals-bring-gifts-to-gods-temple: {label: "Two rivals each bring their gifts to the high god's temple, and envy of the other's gift starts the quarrel", cluster: wisdom}
  rival-envies-brothers-offering: {label: "One brother is filled with envy (ninim) at the other's offering and picks a quarrel with him", cluster: wisdom}
  disputing-brothers-reconciled-with-feast-and-gifts: {label: "After the verdict the losing brother kneels to the winner; they feast with beer and exchange gold, silver and lapis, and brotherhood is restored", cluster: wisdom}
  drinking-beer-makes-heart-glad: {label: "Drinking beer makes the heart happy and the liver joyful", cluster: wisdom}
  seed-sown-two-fingers-deep: {label: "Precise farming rule: the seed must go two fingers deep, one shekel of barley per rod of furrow", cluster: agriculture}
  prayer-to-ninkilim-against-pests: {label: "When the seedlings break through, the farmer prays to Ninkilim (lord of field rodents) and drives off the birds", cluster: agriculture}
  ninurta-farmer-of-enlil: {label: "Ninurta is praised as Enlil's true farmer, the source of the farmer's instructions", cluster: agriculture}
  harvest-prayers-at-each-stage: {label: "A prayer (sizkur2) is said at each stage of the harvest: over the grain-heap, before winnowing, at evening and night", cluster: agriculture}
  man-should-praise-his-god: {label: "Opening exhortation: let a man constantly praise his god and declare his greatness", cluster: petition}
  sufferer-wise-yet-afflicted: {label: "The sufferer protests that he is wise and his words were true, yet he is bound with the ignorant and his truth is turned into a lie", cluster: theodicy}
  friend-turns-false-to-sufferer: {label: "In his affliction the sufferer's friend speaks lies to him and his companion repays his truthful words with falsehood", cluster: theodicy}
  sufferer-share-is-toil: {label: "Others have their share of food; the sufferer's share is toil and hardship", cluster: theodicy}
  family-asked-to-lament-before-god: {label: "The sufferer asks his mother, sister and wife to weep and lament his fate before his god", cluster: theodicy}
  day-bright-for-land-dark-for-me: {label: "For the land the god's day is bright; for the sufferer the day is dark", cluster: theodicy}
  my-god-you-are-my-father: {label: "Address to the personal god: 'You are my father who begot me; lift up my face'", cluster: petition}
  how-long-will-you-neglect-me: {label: "The sufferer asks his god 'How long will you neglect me and leave me unprotected?'", cluster: theodicy}
  sufferer-confesses-unknown-sins: {label: "The sufferer asks his god to show him his sins so that he may confess them openly at the city gate", cluster: petition}
  god-hears-and-restores-sufferer: {label: "The god hears the tears and pure words of the sufferer, removes his sickness, turns his suffering to joy and sets good spirits to guard him", cluster: theodicy}
  old-man-marries-young-girl: {label: "An old man marries a young girl, and her complaint is brought before the king", cluster: family}
  old-age-allegory-body-failing: {label: "An old man describes his failing body in images: his youth fled like a runaway donkey, his black mountain grew white gypsum, his teeth no longer grind, his urine no longer flows", cluster: wisdom}
  king-grants-amargi-release: {label: "The king establishes an amar-gi (release, freedom) and lets the woman go free", cluster: justice}
  public-proclamation-of-lost-seal: {label: "A herald announces in the streets that a man's seal is lost, so that no claim may be made against him with it; witnesses are named", cluster: law}
  hero-breaks-wing-of-south-wind: {label: "Capsized at sea, the hero curses the south wind and breaks its wing, so that it does not blow for seven days", cluster: primeval}
  mortal-summoned-to-heaven-to-answer: {label: "A mortal is summoned to heaven to answer before the high god for what he did on earth", cluster: primeval}
  god-warns-of-food-and-water-of-death: {label: "The hero's patron god tells him that he will be offered bread and water of death in heaven and must not eat or drink, but must accept garment and oil", cluster: primeval}
  vanished-gods-as-gatekeepers-of-heaven: {label: "The two vanished gods Tammuz and Gizzida stand at the door of heaven and plead for the visitor", cluster: primeval}
  food-and-water-of-life-refused: {label: "Offered the bread and water of life by the high god, the mortal refuses them on his patron's advice and so loses immortality", cluster: primeval}
  human-given-wisdom-not-immortality: {label: "A god gives a man wisdom but does not give him eternal life", cluster: primeval}
  sage-priest-pure-hands-serves-table: {label: "The sage is pure, of clean hands and anointed, baking bread and setting the god's table daily with his own hands", cluster: cult}
  illness-etiology-healing-goddess-relieves: {label: "The disease brought by a wind on mankind is to be relieved by the bandages of the healing goddess", cluster: medicine}
  king-who-ignores-justice-punished-by-gods: {label: "Conditional warning to the king: if he does not heed justice, his people fall into chaos, his land is devastated and the gods change his fate", cluster: kingship}
  god-raises-foreign-enemy-against-unjust-king: {label: "Because the king perverted justice the god raises a foreign enemy against him, who cuts down his army and takes his property", cluster: kingship}
  privileged-cities-protected-from-royal-exactions: {label: "The citizens of the holy cities (Sippar, Nippur, Babylon) may not be fined, imprisoned, conscripted, taxed or have their fields and oxen seized", cluster: law}
  corrupt-official-remains-carried-by-wind: {label: "The corrupt official dies by the weapon, his place becomes waste, the wind carries away his remains and his works are counted as a puff of air", cluster: judgment}
  warrior-god-deploys-four-winds: {label: "The warrior god deploys the south, north, east and west winds as his battle line against the enemy", cluster: warfare}
  warrior-god-brings-darkness-on-foe: {label: "The warrior god takes the light from the enemy's eyes: darkness falls, the sun does not shine for him", cluster: warfare}
  monster-corpse-displayed-on-temple: {label: "The winds carry the slain monster's body (or feathers) to the high god's temple as glad tidings and it is hung up there", cluster: warfare}
  gods-refuse-to-face-monster: {label: "Champion after champion is offered the greatest name if he will fight the monster, and each refuses", cluster: warfare}
  monster-steals-supremacy-from-chief-god: {label: "A monster bird seizes the supreme power (Enlil-ship) and the tablet of destinies; the gods' order collapses and they are struck dumb", cluster: warfare}
  mother-goddess-commissions-her-son: {label: "The mother goddess, who bore all the gods, offers her son as champion and instructs him for battle", cluster: warfare}
  arrow-turned-back-by-spell: {label: "The monster cries out to the arrow 'go back!' and the shaft returns without touching him", cluster: warfare}
  cut-off-wings-of-monster-bird: {label: "The champion is told to cut off the monster bird's pinions, so that it cries 'wing to wing' and falls", cluster: warfare}
  chariot-harnessed-to-seven-winds: {label: "The warrior god rides a chariot harnessed to seven battles, seven whirlwinds or seven ill winds", cluster: warfare}
  primeval-sage-apkallu-of-eridu: {label: "Adapa, the sage (apkallu) of Eridu, was created by Ea in primeval days as a model among men, a sage whose word none could set aside", cluster: primeval}
  aura-melammu-covers-land: {label: "The warrior god's terrifying aura (melammu) covers the land and the mountains", cluster: warfare}
  boat-sails-without-oar-or-pole: {label: "The sage's boat sails on the wide sea without steering oar or punting pole", cluster: primeval}
  catalogue-of-brewing-vessels: {label: "A song lists the brewing vessels one by one (vats, jars, troughs, baskets, pot-stands)", cluster: cult}
  catalogue-of-trades: {label: "A catalogue of craftsmen and labourers (reed-cutter, builder, potter, weaver, brewer, cook) each named with his work", cluster: civilization}
  creation-in-primordial-time-formula: {label: "Opening of a creation account: An raises his head, a good day comes forth, Enlil sets his foot on the earth and plans abundance", cluster: creation}
  deity-awe-inspiring-radiance: {label: "The god or his house is clothed in awe-inspiring radiance (ni2 su zig3, me-lem4)", cluster: divine-epithets}
  deity-knows-everything: {label: "A deity is 'wide of ear' and knows everything", cluster: divine-epithets}
  deity-knows-true-and-false: {label: "The deity knows the false and the true (lul zid-bi mu-zu) when judging", cluster: judgment}
  diligent-farmer-not-idle: {label: "The farmer is told not to be idle at his work, so that no one has to tell him to work his field", cluster: wisdom}
  drought-and-starvation-as-punishment: {label: "The storm god (Adad) withholds water and the king's herds die of starvation as punishment", cluster: judgment}
  dumuzid-sheltered-by-poplar: {label: "The allure of Dumuzid is like a poplar (ildag) standing tall", cluster: love}
  forced-labor-imposed-by-king: {label: "The king imposes forced labour (tupšikku, ilku) on people who are exempt, at the recruiter's cry", cluster: kingship}
  genre-subscript-ershahunga: {label: "Subscript naming the composition an eršaĝ-ḫuĝa, a lament 'to soothe the heart' of a god", cluster: literary-form}
  god-as-great-serpent-with-dragon: {label: "The god is a great snake (muš-mah) yoked with a dragon (ušumgal)", cluster: divine-epithets}
  god-as-herdsman-of-city: {label: "The god is the cowherd or herdsman of a city teeming like cows and sheep", cluster: divine-epithets}
  god-chosen-by-name: {label: "The god or king is 'named' (mu pad3) by Enlil: true water, true seed", cluster: kingship}
  god-decrees-fate-with-high-god: {label: "A god surpasses others and decrees fates together with the high god", cluster: divine-epithets}
  god-dwelling-in-pure-netherworld-city: {label: "The god's city and house are set in the 'pure place' of the netherworld (Enegir), his mother is lady of the Kiur", cluster: underworld}
  god-full-of-pity: {label: "The god (or king) is 'full of pity' (šag4-la2 sug4) for the lands", cluster: divine-epithets}
  god-gives-victory-to-king: {label: "The god destroys for the king the land that does not obey him and is the king's helper in battle", cluster: kingship}
  god-laughs-at-mortal: {label: "The high god stares at the mortal and bursts out laughing at what has happened", cluster: primeval}
  god-lord-of-wild-animals-of-steppe: {label: "The god is king of the orchards and gardens and of the four-legged creatures of the broad steppe, given into his hand by An", cluster: divine-epithets}
  god-receives-sceptre-of-en-ship: {label: "The god receives the staff of en-ship, the sceptre and a golden crown from the moon god or An", cluster: kingship}
  god-soars-like-eagle-over-mountains: {label: "The god is like an eagle over the colourful mountains, his eye on the land", cluster: divine-epithets}
  god-knows-hearts-of-gods: {label: "Ea, wide of understanding, knows and examines the hearts of the great gods", cluster: divine-epithets}
  god-without-rival: {label: "The champion god is one 'who has no rival' (ša gabarê lā iršû)", cluster: divine-epithets}
  goddess-heart-restored: {label: "The goddess's heart is restored (šag4 ki-bi ba-ab-gi4) by the drinking and celebration", cluster: cult}
  goddess-judges-from-throne: {label: "The goddess sits on her great throne to judge cases, knowing true and false, and spreads her net over the land", cluster: judgment}
  goddess-titled-daughter-of-an-bride-of-enlil: {label: "The goddess proclaims herself daughter of An, bride (daughter-in-law) of Enlil and heir of Ereškigal, with a dais in the netherworld", cluster: divine-epithets}
  goddess-wife-prays-for-husband-god: {label: "The god's wife stands before him in prayer for his house and city", cluster: petition}
  house-tracks-down-sinner: {label: "The house of judgment searches out the sinner (lu2 nam-tag-ga kiŋ2-kiŋ2) and separates the just from the evil", cluster: judgment}
  husband-of-mother-goddess: {label: "The god is the beloved husband of the mother goddess Ninḫursaĝa", cluster: theogony}
  irrigate-field-but-not-too-high: {label: "Farming rule: watch the dykes and canals; when flooding the field, do not let the water rise too high", cluster: agriculture}
  king-hears-case-of-woman: {label: "A wronged woman brings her case to the king, who consults a wise woman and hears both parties before judging", cluster: justice}
  king-named-in-debate-ibbi-suen: {label: "A named king of Ur (Ibbi-Suen) is praised within a debate poem as recipient of the season's goods", cluster: kingship}
  kingship-and-en-ship-belong-to-enlil: {label: "En-ship and kingship are placed in Enlil's hand", cluster: kingship}
  monster-challenges-champion: {label: "The monster roars at the champion, boasts of the powers it holds and demands that he declare himself", cluster: warfare}
  mortal-sent-back-to-earth: {label: "The high god orders the mortal visitor to be taken back down to his earth", cluster: primeval}
  mother-goddess-of-kes: {label: "The mother goddess (Nintur, Aruru) of Keš, born on the pure mountain, mother of the lands", cluster: theogony}
  ninkasi-brews-beer-for-season: {label: "The beer goddess Ninkasi is a season's helper and makes the beer sweet", cluster: cult}
  omen-style-conditional-wisdom: {label: "Wisdom or warnings cast in the protasis-apodosis form of omens: 'if the king does X, then Y will happen'", cluster: literary-form}
  patron-god-gives-secret-counsel: {label: "The hero's patron god secretly instructs him how to behave before the high god and insists he hold fast to the advice", cluster: primeval}
  personal-god-heart-appeased: {label: "Wish or report that the heart of a person's god is appeased (šag4 diŋir-ra-na ... huŋ)", cluster: petition}
  ploughing-quota-per-plough: {label: "The farmer is given quotas: one plough works 180 iku, you work 144; 18 iku need 3 gur of seed", cluster: agriculture}
  prosperous-man-forgets-gods-name: {label: "The man who had his grass and water in plenty ate and drank but did not invoke his god's name", cluster: petition}
  reap-in-due-time: {label: "Reap at the right time, before the grain bends under its own weight", cluster: agriculture}
  scribe-god-nabu-annuls-contracts: {label: "Nabu, the scribe of the gods, annuls the contracts of the land of a king who broke his people's contracts", cluster: judgment}
  season-of-hardship-people-huddle-by-oven: {label: "In winter people sit by the oven and the fire; the scribe and the musician do not leave it", cluster: wisdom}
  storm-god-harnesses-storms-as-chariot: {label: "The warrior god harnesses the great storms and goes out to battle", cluster: warfare}
  straight-and-slanting-furrows: {label: "Farming rule: where straight furrows were sown sow slanting ones next, and the reverse; change the share if the seed does not go in", cluster: agriculture}
  sufferer-weeps-before-his-god: {label: "The afflicted young man weeps bitter tears before his god and prostrates himself", cluster: petition}
  temples-founded-in-four-regions: {label: "The victorious god is promised daises and shrines founded throughout the four world regions", cluster: temple}
  threshing-with-sledge-and-oxen: {label: "Threshing with a sledge whose teeth are fastened with leather and bitumen, drawn by oxen", cluster: agriculture}
  tools-made-ready-before-work: {label: "Before the work the farmer makes ready his tools: hoes of fixed weight, yoke, whip on its peg, basket", cluster: agriculture}
  victory-news-brings-joy-to-gods: {label: "The news of the champion's victory reaches the gods' temple and the high god and his wife rejoice", cluster: warfare}
  walking-along-the-river-bank: {label: "The lover walks along the bank of the river (Euphrates)", cluster: love}
  warrior-god-son-of-enlil: {label: "Ninurta is hailed as son of Enlil, created like An", cluster: theogony}
  watering-at-each-stage-of-growth: {label: "The barley is watered at fixed stages of growth; watering at the wrong time brings blight", cluster: agriculture}
  weeping-in-prison-all-day: {label: "In the prison-house hearts are full of tears and laments all day long", cluster: judgment}
  winnowing-by-two-men: {label: "Two men lift the grain to winnow it; the winnowed grain is laid down like a sceptre", cluster: agriculture}
  wise-god-proposes-plan-in-assembly: {label: "The wise god of the Apsu proposes a plan in the gods' assembly, and the gods kiss his feet", cluster: cosmology}
units:
  - id: ane-etcsl-4-06-1-a-night-watchman
    tradition: ane-sumerian
    title: "A hymn to Ḫendursaĝa, segment A 4-41: the night watchman of the streets"
    corpus: ane
    original: true
    tagger: "Claude (model), reading the Sumerian"
    read: ["ETCSL 4.06.1 Seg.A:4-41"]
    tags:
      - {motif: god-powers-great-none-can-rival-refrain, refs: ["ETCSL 4.06.1 Seg.A:7", "ETCSL 4.06.1 Seg.A:14", "ETCSL 4.06.1 Seg.A:41"], note: "{d}hendur-saŋ-ŋa2 me-zu mah-am3 lu2 al nu-um-me"}
      - {motif: god-as-night-watchman-of-streets, refs: ["ETCSL 4.06.1 Seg.A:8-13"], note: "ŋi6-a en-nu-uŋ3 ... sila daŋal peš-peš-e 'keeping watch at night ... broad streets'; kan4 ud e3-ba ŋal2 da13-da13 'opens the gate at sunrise'; ur3-bad3-da 'on the rooftops'. Lines 4-6 broken."}
