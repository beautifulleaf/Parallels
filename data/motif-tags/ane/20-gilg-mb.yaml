# Full read, chunk 20: Gilgameš, Middle Babylonian, Neo-Assyrian and Old Babylonian versions (eBL reconstructed texts).
# Read in the normalized Akkadian with eBL's English translation as a reading aid.
new_motifs:
  gods-create-equal-for-tyrant: {label: "The gods have the mother goddess create a man equal in strength to an oppressive king, so that he may rival him and the city have rest", cluster: kingship}
  tyrant-king-oppresses-young-men: {label: "The king harasses the city's young men with endless contests and keeps the brides from their husbands, and the people's complaint reaches the gods", cluster: kingship}
  royal-right-of-first-night: {label: "The king has first claim on every bride and lies with her before the bridegroom", cluster: kingship}
  dying-man-curses-those-who-changed-his-life: {label: "Facing death, a man curses the people (the trapper, the prostitute) who brought him out of his former life", cluster: death}
  prostitutes-lot-fixed-by-curse: {label: "A curse fixes the prostitute's lot: no household, sitting at the crossroads and in the wall's shadow, struck by drunkards", cluster: society}
  sun-god-answers-complaint-from-heaven: {label: "The sun god calls from heaven to answer a complainer, reminding him of the good he has received", cluster: theodicy}
  dream-of-death-messenger: {label: "A man dreams that a grim figure with a monstrous bird's face, lion's paws and eagle's talons seizes him, foreboding his death", cluster: death}
  wild-man-civilized-by-woman: {label: "A wild man who lived among the animals is made human by a woman: lovemaking, then bread and beer, washing, oil and clothing", cluster: civilization}
  wild-man-suckled-by-beasts: {label: "The wild man was born in the uplands and sucked the milk of wild animals", cluster: civilization}
  first-bread-and-beer: {label: "The wild man, who does not know how to eat bread or drink beer, is given them for the first time and eats and drinks until merry", cluster: civilization}
  woman-shares-her-garment: {label: "A woman divides her garment, clothing the naked man with one part and herself with the other", cluster: civilization}
  shepherds-bow-to-stranger-as-god: {label: "Shepherds prostrate themselves before a newcomer as before a god", cluster: cult}
  crowd-compares-newcomer-to-king: {label: "The crowd gathers round a newcomer and remarks that in build he is the equal of their king", cluster: kingship}
  wild-man-guards-shepherds-from-lions: {label: "The newly civilized wild man keeps watch at night for the shepherds and drives off wolves and lions", cluster: civilization}
  elders-warn-young-king: {label: "The city's elders or advisers warn the young king that his heart carries him away and his venture is folly", cluster: wisdom}
  journey-dreams-interpreted-favourably: {label: "On the march the hero has a series of frightening night dreams, and each is interpreted by his companion as favourable", cluster: dreams}
  mountain-falls-on-dreamer: {label: "In a dream a mountain collapses on the dreamer and a radiant man pulls him out from under it and gives him water", cluster: dreams}
  goddess-proposes-marriage-to-hero: {label: "A goddess proposes marriage to a mortal hero, promising him tribute, wealth and fertile flocks", cluster: love}
  catalogue-of-goddess-lovers-fates: {label: "The hero lists the goddess's former lovers and the fate each suffered (Dumuzi's yearly wailing, a bird with broken wing, a shepherd turned into a wolf)", cluster: love}
  string-of-insulting-similes: {label: "A string of insulting similes: a door that keeps out no draught, a waterskin that cuts its carrier, a shoe that bites its wearer's foot", cluster: wisdom}
  friend-sick-days-counted: {label: "The friend lies sick in bed, his illness worsening day by day (a first, second, third, fourth day)", cluster: death}
  moaning-like-a-dove: {label: "A grieving or sick person moans like a dove", cluster: lament}
  mother-interprets-dreams-of-companion: {label: "The hero's wise mother interprets his dreams (a fallen sky-rock, an axe) as foretelling a mighty companion whom he will love like a wife", cluster: dreams}
  meteor-dream-too-heavy-to-lift: {label: "In a dream a lump of sky-rock falls from among the stars and is too heavy to lift; the people gather round it", cluster: dreams}
  epic-prologue-hero-saw-the-deep: {label: "The epic opens by praising its hero as one who saw the Deep, knew all wisdom and brought back knowledge from before the flood", cluster: wisdom}
  story-on-tablet-in-cedar-box: {label: "The reader is told to open a cedar box and read the hero's labours from a lapis-lazuli tablet kept in it", cluster: scribal}
  city-wall-founded-by-seven-sages: {label: "The city wall's foundations were laid by the seven sages, and the city's area is measured out", cluster: civilization}
  hero-of-giant-stature-measured: {label: "The hero's huge stature is given in cubits (eleven cubits tall, four cubits across the chest)", cluster: kingship}
  battle-splits-mountains: {label: "At the battle or the guardian's cry the earth splits and the mountains of Sirion and Lebanon are rent asunder", cluster: theophany}
  defeated-guardian-offers-service-and-timber: {label: "The defeated forest guardian pleads for his life, offering to serve the hero and keep cedar and other timber for his palace", cluster: combat}
  companion-urges-killing-pleading-captive: {label: "The hero's companion urges him not to listen to the captive's pleas but to kill him at once", cluster: combat}
  only-gods-live-forever-mans-days-numbered: {label: "Only the gods dwell forever with the sun; man's days are numbered", cluster: death}
  hero-mocks-companions-fear: {label: "The hero rebukes his companion for speaking like a weakling and offers to go in front himself", cluster: combat}
  prayer-for-safe-return-with-vow: {label: "Before a dangerous journey the hero prays to his god for a safe return and vows to build him a house", cluster: cult}
  elders-bless-and-advise-traveller: {label: "The elders bless the departing hero and give advice for the road: rely not on strength, let the companion go first, dig a well, pour water to the god", cluster: wisdom}
  storm-theophany-in-dream: {label: "In a dream the storm god thunders, the day darkens, lightning and fire break out and death rains down; then the fire dies to embers and a god shines forth", cluster: theophany}
  terror-turns-face-pale: {label: "At the sight of the enemy or its splendour a man's face turns pale and terror enters his heart", cluster: combat}
  cedar-forest-in-the-west: {label: "The Cedar Forest lies in the west: Lebanon and Sirion, near Ebla and the mountain of the Amorite", cluster: geography}
  monster-voice-flood-speech-fire: {label: "The guardian's voice is the Deluge, his speech fire, his breath death", cluster: combat}
  catch-the-bird-and-the-chicks-scatter: {label: "Saying: catch the (mother) bird and where will its chicks go? Deal first with the main foe", cluster: wisdom}
  secret-abode-of-gods-in-cedar-mountain: {label: "Beyond the slain guardian the heroes uncover the secret dwelling of the gods in the cedar mountain", cluster: cosmology}
  cedar-door-for-high-gods-temple: {label: "The hero has a huge door made from the tallest cedar and floats it down the Euphrates to the high god's temple", cluster: cult}
  grieving-hero-roams-wild-in-skins: {label: "Grieving for his friend, the hero roams the wild clothed in animal skins, eating their flesh", cluster: death}
  you-will-not-find-the-life-you-seek: {label: "A god or a sage tells the wanderer that he will not find the (eternal) life he seeks", cluster: death}
  gods-allotted-death-to-mankind: {label: "When the gods created mankind they allotted death to them and kept life in their own hands", cluster: death}
  friend-unburied-until-maggot-falls: {label: "The mourner will not give up his dead friend for burial, hoping he will rise at his cry, until a maggot falls from his nose", cluster: death}
  desire-to-see-sunlight-before-death: {label: "Before lying in the darkness of death the hero wants his eyes to be sated with the light of the sun", cluster: death}
  ferryman-and-waters-of-death: {label: "The flood hero's ferryman crosses the Waters of Death, which must not be touched, with the help of the 'Stone Ones' or punting poles", cluster: underworld}
  seven-days-and-seven-nights: {label: "An act lasts a formulaic seven days and seven nights", cluster: numbers}
  rivals-wrestle-at-doorway: {label: "Two equals wrestle at a doorway like bulls, shattering the door jamb and shaking the wall, until one yields", cluster: combat}
  rivals-become-friends: {label: "Former rivals kiss and form a friendship", cluster: friendship}
  kingship-decreed-as-heros-lot: {label: "The high god fixed kingship over the people as the hero's lot", cluster: kingship}
  companion-weeps-strength-ebbs: {label: "The companion's eyes fill with tears, sobs knot his neck and his strength ebbs away at the thought of the venture", cluster: friendship}
  dream-sought-on-mountain-top: {label: "The hero climbs a hill, rests and asks the night for a dream, which comes in the middle watch", cluster: dreams}
  hero-and-companion-fell-cedars: {label: "One hero fells the cedars while the other chooses the best timber", cluster: combat}
  slain-guardian-blood-fills-ravines: {label: "The slain guardian's blood is carried away by the ravines", cluster: combat}
  purity-lost-through-woman: {label: "The wild man complains that the woman made him weak who had been pure in the wild", cluster: civilization}
  heavens-thunder-earth-answers: {label: "In a vision the heavens cry out and the earth answers, with the dreamer standing between them", cluster: dreams}
  object-loved-like-wife: {label: "In a dream the hero loves and embraces an object (an axe) like a wife; it stands for a beloved companion", cluster: dreams}
  face-pales-at-injustice: {label: "On hearing of an injustice a man's face turns pale with anger", cluster: society}
  king-convenes-assembly: {label: "The king shuts the city gates, convenes the assembly and addresses the elders from his throne in the street", cluster: kingship}
  cool-water-libation-to-sun-god: {label: "The traveller must dig a well at each camp and pour cool water in libation to the sun god", cluster: cult}
  name-exchange-at-meeting: {label: "At a meeting at the edge of the world one asks 'What is your name?' and the other answers with his name, city and journey", cluster: narrative}
units:
  # ================= Gilgameš, Middle Babylonian =================
  - id: ane-gilg-mb-nippur-rival-created
    tradition: ane-akkadian
    title: "The gods call on Aruru to create a match for Gilgameš (MB Nippur fragment)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    version: Middle Babylonian (Nippur)
    read: ["Gilg MB Nippur:a+1-e+3"]
    tags:
      - {motif: gods-create-equal-for-tyrant, refs: ["Gilg MB Nippur:a+1-a+7"], note: "restored at the beginning: [arūru l]issû ... [libni māhir]šu lū dān emūqa [ittīšu li]štannan-ma uruk lištapših 'let her create his equal ... let him vie with him and so let Uruk be rested'"}
      - {motif: human-formed-from-earth, refs: ["Gilg MB Nippur:a+2", "Gilg MB Nippur:a+7"], note: "loose fit: only the statement that Aruru created mankind ([attī-ma] arūru tabnî awīlam); the clay itself is not preserved here"}
      - {motif: tyrant-king-oppresses-young-men, refs: ["Gilg MB Nippur:d+3", "Gilg MB Nippur:e+3"], note: "fragmentary: ilū dalhū 'the gods were perturbed'; rigm[a] 'noise'"}
      - {motif: king-as-shepherd-of-people, refs: ["Gilg MB Nippur:e+1-e+2"], note: "šū rīmum-ma uruk [supūri] / gilgāmeš nāqissinā-ma: wild bull of Uruk and herdsman (nāqidu) of its people"}
    hints:
      - "The creation of a counterpart compare Gen 2:18-20 ('a helper corresponding to him', kenegdo). The people's cry reaching heaven compare Exod 2:23-24, Exod 3:7 and Gen 18:20-21. Parallels Gilg SB I:79-98."
  - id: ane-gilg-mb-ur-enkidu-curses
    tradition: ane-akkadian
    title: "Enkidu, sick, curses the trapper and Šamḫat before Šamaš (MB Ur)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    version: Middle Babylonian (Ur)
    read: ["Gilg MB Ur:1-40"]
    tags:
      - {motif: hero-weeps-before-god-in-temple, refs: ["Gilg MB Ur:1-3"], note: "loose fit (not in a temple): at dawn išši rēšīšu enkīdu ana pān šamaš ibakki, his tears flowing before the sun's rays (šarūrī ša šamaš)"}
      - {motif: dying-man-curses-those-who-changed-his-life, refs: ["Gilg MB Ur:4-13"], note: "against the ṣayyādu hābilu amēlu 'hunter, trapper-man' and the harimtu; luzzurki izzira rabâ 'I will curse you with a great curse'"}
      - {motif: prostitutes-lot-fixed-by-curse, refs: ["Gilg MB Ur:14-33"], note: "no household, the ground soils her garment, the drunkard smears her gown; išpallurtī pahārim 'the potter's crossroads' her seat, hurbātu 'ruins' her bed, ṣilli dūri 'the wall's shadow' her station; šakru u ṣamû limhaṣū lētki"}
      - {motif: curse-explains-natures-of-things, refs: ["Gilg MB Ur:11-12", "Gilg MB Ur:14-29"], note: "šīmata lušīmki 'I will decree you a destiny': the curse is an aetiology of the prostitute's present condition"}
      - {motif: purity-lost-through-woman, refs: ["Gilg MB Ur:39-40"], note: "[aššum yâ]ši ella tušemṭinni ... ina ṣērīya: 'because you made me weak, me who was pure, in the wild'"}
    hints:
      - "Parallels Gilg SB VII:90-131. Cursing and later blessing the woman who led him out of the wild compare Gen 3:14-19 (curses that fix the present lot) and Gen 3:7 (knowledge that brings weakness)."
      - "The curse on the prostitute's lot (wall, crossroads) compare Prov 7:12 and Jer 3:2 (she sits by the roads)."
  - id: ane-gilg-mb-ur-shamash-rebukes
    tradition: ane-akkadian
    title: "Šamaš answers from heaven; Enkidu turns his curse into a blessing on Šamḫat (MB Ur)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    version: Middle Babylonian (Ur)
    read: ["Gilg MB Ur:41-58"]
    tags:
      - {motif: sun-god-answers-complaint-from-heaven, refs: ["Gilg MB Ur:41-47"], note: "[šamaš išme] zikir pîšu ... [tuk]ku ultu šamê išassašum-ma: a voice cries to him from heaven; the rebuke itself is broken (contrast SB VII:132-147)"}
      - {motif: curse-turned-to-blessing, refs: ["Gilg MB Ur:48-49"], note: "pīya ša izzurūki litūr likrubki: 'my mouth that cursed you shall turn and bless you'"}
      - {motif: prostitutes-lot-fixed-by-curse, refs: ["Gilg MB Ur:50-58"], note: "the counter-blessing: governors and nobles love her, the soldier undoes his belt, gold earrings, a rich man's house, and aššumīka linnezib ummi sebetti hīrtu 'for your sake may the first wife, mother of seven, be abandoned'"}
      - {motif: seven-sons-three-daughters, refs: ["Gilg MB Ur:58"], note: "loose fit: ummi sebetti 'mother of seven' as the ideal wife who is forsaken"}
    hints:
      - "Curse turned to blessing compare Num 23-24 (Balaam), Deut 23:6 and Neh 13:2. A voice from heaven answering a complaint compare Job 38:1. Parallels Gilg SB VII:132-161."
      - "Mother of seven as the blessed wife compare 1 Sam 2:5 and Jer 15:9 ('she who bore seven languishes')."
  - id: ane-gilg-mb-ur-enkidu-death-dream
    tradition: ane-akkadian
    title: "Enkidu's dream of the Anzû-faced man who seizes him (MB Ur)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    version: Middle Babylonian (Ur)
    read: ["Gilg MB Ur:59-69"]
    tags:
      - {motif: dream-reported-to-king, refs: ["Gilg MB Ur:59-62"], note: "loose fit: Enkidu tells his night dream to Gilgameš, who sits before him (gilgāmeš ašib maharšu)"}
      - {motif: heavens-thunder-earth-answers, refs: ["Gilg MB Ur:63-64"], note: "ilsû-ma šamû qaqqaru īpul: 'the heavens cried out, the earth answered', with him standing between them"}
      - {motif: dream-of-death-messenger, refs: ["Gilg MB Ur:65-69"], note: "ištēn eṭlu ukkulū pānūšu ana ša anzî nāʾer pānūšu mašlū; ritti nēši rittāšu, ṣupur erî ṣuprāšu; iṣbat qimmatī 'he seized me by the hair'"}
    hints:
      - "Parallels Gilg SB VII:165-192 (the figure takes Enkidu to the house of dust). Compare the angel of death, Q 32:11, and the figure in Dan 7:4 (lion with eagle's wings); seized by the hair compare Ezek 8:3."
  - id: ane-gilg-mb-bog1-harlot-leads-enkidu
    tradition: ane-akkadian
    title: "The harlot clothes Enkidu and leads him to the shepherds; bread and beer (MB Boğazköy 1)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    version: Middle Babylonian (Boğazköy)
    read: ["Gilg MB Boğ1:a+1a-a+16b"]
    tags:
      - {motif: wild-man-civilized-by-woman, refs: ["Gilg MB Boğ1:a+1c–a+2a", "Gilg MB Boğ1:a+2b–a+3a", "Gilg MB Boğ1:a+5c–a+6a"], note: "damqātā-ma enkīdu [kīma ili tabašši]: 'you are handsome, Enkidu, like a god'; why range with the beasts?"}
      - {motif: humans-become-like-gods, refs: ["Gilg MB Boğ1:a+3b", "Gilg MB Boğ1:a+7b–a+8a"], note: "loose fit: kīma ili tabašši 'you are like a god'; she walks before him kīma ilim"}
      - {motif: woman-shares-her-garment, refs: ["Gilg MB Boğ1:a+6c", "Gilg MB Boğ1:a+7a"], note: "ištēnšu išhuṭ-ma šū ittalbaš; the other half restored"}
      - {motif: crowd-compares-newcomer-to-king, refs: ["Gilg MB Boğ1:a+9a", "Gilg MB Boğ1:a+10a", "Gilg MB Boğ1:a+10b–a+11a"], note: "lānam šapil eṣemtam [pukkul]: shorter of stature, sturdier of bone; mostly restored"}
      - {motif: wild-man-suckled-by-beasts, refs: ["Gilg MB Boğ1:a+11c–a+12a"], note: "šizba ša nammaštê [ītenniq]"}
      - {motif: first-bread-and-beer, refs: ["Gilg MB Boğ1:a+12c", "Gilg MB Boğ1:a+14c–a+15a", "Gilg MB Boğ1:a+15b", "Gilg MB Boğ1:a+16b"], note: "ippallis aklam ūtaddir 'peering at the bread he was perturbed'; akul aklam enkīdu [simat ilūti], beer simat šarrūtim 'fit for a king'; seven jugs"}
    hints:
      - "Parallels Gilg OB II:51-109 and SB I-II. Enkidu's humanisation compare Gen 2-3 (nakedness, clothing, knowledge) and Gen 3:21."
  - id: ane-gilg-mb-bog1-fragments-meeting
    tradition: ane-akkadian
    title: "Fragments: Gilgameš and Enkidu take hands; Enkidu's praise of Gilgameš's birth (MB Boğazköy 1)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    version: Middle Babylonian (Boğazköy)
    read: ["Gilg MB Boğ1:b+1'-c+8'"]
    tags:
      - {motif: rivals-become-friends, refs: ["Gilg MB Boğ1:b+2'"], note: "iṣṣabtū 'they took hold of each other'; fragmentary, perhaps after the wrestling"}
      - {motif: hero-hailed-by-epithets, refs: ["Gilg MB Boğ1:b+5'"], note: "gilgāmeš umm[aka ulidka]: restored after OB II:234 kīma ištēn-ma ummaka ulidka"}
    hints:
      - "Parallels Gilg OB II:231-240 and SB II."
  - id: ane-gilg-mb-bog1-forest-resolve
    tradition: ane-akkadian
    title: "Gilgameš resolves to fight Ḫuwawa for an eternal name; the elders object (MB Boğazköy 1)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    version: Middle Babylonian (Boğazköy)
    read: ["Gilg MB Boğ1:d+1'-e+9'"]
    tags:
      - {motif: make-a-name-for-ourselves, refs: ["Gilg MB Boğ1:d+4'b"], note: "[šuma š]a darê anāku [luštakna]: 'a name of eternity I will establish'; largely restored from OB III:188"}
      - {motif: hero-fells-sacred-cedars, refs: ["Gilg MB Boğ1:d+3'c–d+4'a"], note: "restored: [luksuma erēna]"}
      - {motif: elders-warn-young-king, refs: ["Gilg MB Boğ1:d+5'a", "Gilg MB Boğ1:d+5'b–d+6'a", "Gilg MB Boğ1:d+6'b"], note: "ana mīnim ta[hših] 'why do you desire (this)?'; [qabal lā mahā]r šubat huw[āwa] 'an unwinnable battle'"}
      - {motif: forest-guardian-seven-terrors, refs: ["Gilg MB Boğ1:d+6'b", "Gilg MB Boğ1:d+7'b"], note: "šubat huwāwa; sixty leagues of wilderness (bēr preserved)"}
    hints:
      - "Parallels Gilg OB III:180-200 and SB II:270-299. A name for eternity compare Gen 11:4, 2 Sam 7:9 and Isa 56:5."
  - id: ane-gilg-mb-bog1-fragments-judgement
    tradition: ane-akkadian
    title: "Fragments: advice against marriage; Enkidu's case judged after Ḫuwawa's death (MB Boğazköy 1)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    version: Middle Babylonian (Boğazköy)
    read: ["Gilg MB Boğ1:a+1'-f+17'"]
    tags:
      - {motif: hero-rebuffs-goddess, refs: ["Gilg MB Boğ1:a+3'", "Gilg MB Boğ1:a+4'"], note: "uncertain: [ē tāhu]z aššata u lalêša 'may you not marry a wife nor have your fill of her charms'"}
      - {motif: deathbed-dream-of-divine-assembly, refs: ["Gilg MB Boğ1:f+5'", "Gilg MB Boğ1:f+9'"], note: "[kīm]a huwāwa in[ērū]; u dīn enkīdu ip[arrasū] 'they were judging the case of Enkidu': the gods' verdict on Enkidu after the slaying (cf. SB VII:1-26)"}
      - {motif: dying-man-curses-those-who-changed-his-life, refs: ["Gilg MB Boğ1:f+13'", "Gilg MB Boğ1:f+14'"], note: "fragmentary: nagimmê ay [...] 'may he not [acquire] descendants'; libkâ 'let them mourn'"}
    hints:
      - "Parallels Gilg SB VI-VII. The gods judging who must die for the killing compare 1 Kgs 22:19-22 (the heavenly council) and Job 1:6-12."
  - id: ane-gilg-mb-bog2-mountain-dream
    tradition: ane-akkadian
    title: "Gilgameš's second dream on the road: the mountain and the radiant man (MB Boğazköy 2)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    version: Middle Babylonian (Boğazköy)
    read: ["Gilg MB Boğ2:1'-31'"]
    tags:
      - {motif: journey-dreams-interpreted-favourably, refs: ["Gilg MB Boğ2:2'", "Gilg MB Boğ2:3'", "Gilg MB Boğ2:12'", "Gilg MB Boğ2:30'"], note: "eli išteat šuttīya šanītu [etqet] 'my second dream surpasses the first'"}
      - {motif: hero-overcome-by-supernatural-sleep, refs: ["Gilg MB Boğ2:6'", "Gilg MB Boğ2:7'a"], note: "šittu rāhīt mūši 'sleep that pours over (people) at night'; in the middle of the night his sleep left him"}
      - {motif: mountain-falls-on-dreamer, refs: ["Gilg MB Boğ2:13'", "Gilg MB Boğ2:14'a", "Gilg MB Boğ2:14'b–15'a", "Gilg MB Boğ2:15'b", "Gilg MB Boğ2:16'", "Gilg MB Boğ2:17'", "Gilg MB Boğ2:18'a"], note: "šaplān huršāni ištalpannī-ma; mê išqânnī-ma libbī ipšah: he pulled me from under the mountain and gave me water to drink"}
      - {motif: dream-interpreted-item-by-item, refs: ["Gilg MB Boğ2:21'b", "Gilg MB Boğ2:21'c–22'a", "Gilg MB Boğ2:22'b", "Gilg MB Boğ2:23'a", "Gilg MB Boğ2:26'"], note: "Ḫuwawa ul huršān? 'is he not the mountain?'; u eṭlu ša [tāmuru]"}
      - {motif: do-not-fear-formula, refs: ["Gilg MB Boğ2:23'b–24'"], note: "alka muʾʾi puluhta[ka] 'come, cast aside your fear'"}
    hints:
      - "Parallels Gilg OB Schøyen2:1-24 and SB IV. Rescue from under the mountain and water to drink compare Ps 18:17 and Ps 23:2; dreams on a journey compare Gen 28:10-17."
  - id: ane-gilg-mb-bog2-ishtar-bull
    tradition: ane-akkadian
