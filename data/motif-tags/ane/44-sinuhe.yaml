      - {motif: returnee-groomed-and-dressed-in-fine-linen, refs: ["Sinuhe W1:290/2-294"], note: "rdi̯ swꜣ rnp,t.pl ḥr ḥꜥ.w =j 'the years were made to pass from my body'; ṯꜣi̯.kw ꜥꜥb šnw =j 'I was groomed, my hair cleaned' (often rendered 'I was shaved'); zb,t given to the desert, ḥbs.w to the sand-farers; sd.kw m pꜣq,t gs.kw m tp,t sḏr.kw ḥr ḥnk,yt 'clad in fine linen, anointed with fine oil, I slept on a bed'; di̯.n =j šꜥy n nmj.w =f 'I gave the sand to those who live in it'"}
      - {motif: shaved-and-changed-clothes-before-king, refs: ["Sinuhe W1:291-292"], note: "The grooming follows the audience rather than preceding it; the TLA renders ṯꜣi̯.kw as 'I was clothed'"}
      - {motif: hero-washes-and-dons-clean-garments, refs: ["Sinuhe W1:286/2-293"]}
      - {motif: king-builds-and-endows-tomb-for-courtier, refs: ["Sinuhe W1:300-309"], note: "jw ḫwzi̯.w n =j mr m jnr m-qꜣb mr.w 'a pyramid of stone was built for me among the pyramids'; funerary priests, a funerary domain, fields, twt =j sẖr m nbw 'my statue overlaid with gold'; nn šwꜣ,w jri̯.y n =f mj,tt 'there is no poor man for whom the like was done'"}
      - {motif: colophon-copied-and-collated, refs: ["Sinuhe W1:311"], note: "jwi̯ =f pw ḥꜣ,t =f r pḥ,wj =f mj gmi̯.t m zẖꜣ 'it has come from beginning to end as found in writing'"}
    hints:
      - "Change of clothes and new status at the foreign court: compare Joseph shaved, changed and later clothed in fine linen by Pharaoh (Gen 41:14, 42), Jehoiachin's prison clothes changed (2 Kgs 25:29) and Q 12:54-56."
      - "A tomb prepared by royal favour: compare Joseph's burial (Gen 50:26) and the burial privileges of Jehoiada among the kings (2 Chr 24:16)."
