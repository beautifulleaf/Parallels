      - {motif: fugitive-sayings-contrast-need-and-wealth, refs: ["Sinuhe W1:149/2-156"], note: "wꜥr wꜥr n hꜣw =f ... rww z tꜣ =f n ḥꜣ,yt jnk ḥḏ,t pꜣq,t 'a fugitive flees from his surroundings ... a man leaves his land for nakedness: I have bright clothes and fine linen'"}
      - {motif: exile-prays-to-return-home-before-death, refs: ["Sinuhe W1:156/2-165"], note: "ptr wr.t r ꜥb,t-ẖꜣ,t =j m tꜣ msi̯.kw jm =f 'what is greater than that my corpse be buried in the land where I was born?'"}
      - {motif: father-burial-in-homeland, refs: ["Sinuhe W1:159"], note: "Here the exile himself, not a dying father, longs to be buried in his birthplace"}
      - {motif: wish-to-greet-queen-and-serve-her-children, refs: ["Sinuhe W1:165", "Sinuhe W1:172"]}
      - {motif: old-age-described-limb-by-limb, refs: ["Sinuhe W1:167-170/3"], note: "jr,t.du =j dns ꜥ,wj =j nw rd.du =j fḫ.n =sn šms jb wrd tkn wj n wḏꜣ 'my eyes are heavy, my arms weak, my legs have ceased to follow, the heart is weary, I am near to departing'"}
      - {motif: god-hears-prayer-of-righteous, refs: ["Sinuhe W1:162"], note: "jn mjn rf n,tt =f ḥtp sḏm =f spr,t wꜣ 'is it today that he is gracious and hears the prayer of the one far away?'"}
    hints:
      - "God's hidden guidance of an exile: compare Joseph's 'it was not you who sent me here but God' (Gen 45:5-8; 50:20) and Q 12:100."
      - "Longing for burial in the homeland: compare Jacob (Gen 47:29-30; 49:29-32), Joseph's bones (Gen 50:24-25; Exod 13:19), Barzillai (2 Sam 19:37) and Nehemiah's 'the city of my fathers' graves' (Neh 2:3-5)."
      - "Old age limb by limb: compare Eccl 12:1-7 and Barzillai's complaint (2 Sam 19:35); Q 19:4 Zechariah's 'my bones have weakened and my head is aflame with grey'."
  - id: ane-sinuhe-w1-royal-letter
    tradition: ane-egyptian
    title: "Sinuhe (B): Senwosret's decree recalling Sinuhe and promising burial in Egypt; Sinuhe's joy"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Egyptian"
    version: "W1, pBerlin P 3022 (B)"
    read: ["Sinuhe W1:173-203"]
    tags:
      - {motif: king-writes-to-recall-exile, refs: ["Sinuhe W1:173-188"], note: "mj,t(j) n wḏ,w jni̯.y n bꜣk-jm 'copy of the decree brought to this servant about bringing him to Egypt'; ptr jri̯.t.n =k jri̯ =t(w) r =k 'what have you done that one should act against you?'; sḫr =k pn jni̯.n =f jb =k n ntf m jb =j r =k 'this plan of yours carried off your heart; it was not in my heart against you'"}
      - {motif: wish-to-greet-queen-and-serve-her-children, refs: ["Sinuhe W1:185/3-187/2"], note: "p,t =k tn n,t.t m ꜥḥ 'this heaven of yours who is in the palace' (the queen) endures; her children are in the audience hall"}
      - {motif: old-age-described-limb-by-limb, refs: ["Sinuhe W1:189-190"], note: "šꜣꜥ.n =k tnj fḫ.n =k bꜣꜣ,wt 'you have begun to grow old, you have lost your virility'"}
      - {motif: promise-of-burial-in-egypt-not-in-ramskin, refs: ["Sinuhe W1:190/2-199"], note: "wj m nbw tp m ḫsbd 'a mummy case of gold, a mask of lapis'; oxen draw the sledge, singers, the dance of the mww; nn m(w)t =k ḥr ḫꜣs,t nn bsi̯ tw ꜥꜣm.w nn di̯.t(w) =k m jnm n zr 'you shall not die abroad, the Asiatics shall not bury you, you shall not be put in a ram's skin'; mḥi̯ ḥr ḫꜣ,t =k jwi̯ 'care for your corpse and come!'"}
      - {motif: embalming, refs: ["Sinuhe W1:191"], note: "sfṯ 'embalming oil' and wrappings from the hands of Tait for the night (of mummification)"}
      - {motif: asiatic-nomad-stereotype, refs: ["Sinuhe W1:197/2-198"]}
      - {motif: letter-received-with-prostration-and-dust, refs: ["Sinuhe W1:199/2-201"], note: "šdi̯.n.tw =f n =j di̯.n =j wj ḥr ẖ,t =j dmj.n =j zꜣṯ,w di̯.n =j sw ḥr šnb,t =j 'when it was read to me I put myself on my belly, I touched the soil and spread it on my chest'"}
      - {motif: messenger-kisses-ground-before-lord, refs: ["Sinuhe W1:200-200/2"], note: "Prostration before the king's letter as before the king himself"}
    hints:
      - "Royal recall of an exile: compare David recalling Absalom (2 Sam 14:21-24, 33) and Pharaoh's letting Hadad go home (1 Kgs 11:21-22); Jacob told by God to return to the land of his birth (Gen 31:3, 13)."
      - "Burial abroad versus burial at home and Egyptian embalming: compare Joseph's embalming and coffin in Egypt (Gen 50:2-3, 26) and Jacob's wish not to be buried in Egypt (Gen 47:29-30)."
      - "Prostration and earth on the body at a royal message: compare the bowing to the ground of Gen 33:3 and 2 Sam 14:4, 22, 33."
