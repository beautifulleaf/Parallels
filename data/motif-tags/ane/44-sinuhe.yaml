    title: "Westcar: the beaten maidservant sets out to betray the royal birth to Khufu and is taken by a crocodile (breaks off)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Egyptian"
    version: "pWestcar; the papyrus breaks off here"
    read: ["Westcar 12:8/2-12:25/3"]
    tags:
      - {motif: servant-betrays-royal-birth-seized-by-crocodile, refs: ["Westcar 12:8/2-12:19", "Westcar 12:25/2-12:25/3"], note: "Punished with a beating, the maid says jw msi̯.n =s nsw.yw 3 jw =j r šm.t r ḏd st n ḥm n(,j) nswt-bj,tj Ḫwfw 'she has borne three kings: I will go and tell the majesty of Khufu'; ꜥḥꜥ.n jṯi̯.n sj msḥ 'then a crocodile seized her'"}
      - {motif: secret-or-irregular-birth, refs: ["Westcar 12:11-12:12"]}
