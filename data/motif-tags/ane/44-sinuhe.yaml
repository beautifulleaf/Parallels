    read: ["TwoBrothers 8_8/3-10_3/2"]
    tags:
      - {motif: wronged-hero-lives-alone-in-valley-of-cedar, refs: ["TwoBrothers 8_8/3-8_9/2"], note: "Alone (nn wn wꜥ m-ḏi̯ =f), he spends his days hunting desert game, sleeps under the cedar that bears his heart, and builds himself a castle (bḫn,w) full of good things, 'wishing to found a household'"}
      - {motif: god-fashions-wife-so-man-not-alone, refs: ["TwoBrothers 9_6-9_7"], note: "Re-Harakhti to Khnum: jḫ qd =k wꜥ-n s,t-ḥm,t n Bꜣtꜣ tm =f ḥmsi̯ wꜥi̯ 'fashion (qd, the potter's verb) a woman for Bata, that he not dwell alone'; she is more beautiful in body than any woman, jw nṯr nb jm =st 'every god in her'"}
      - {motif: seven-hathors-decree-fate, refs: ["TwoBrothers 9_8-9_9"], note: "tꜣ 7 Ḥ,t-ḥr,t ... ḏd m rʾ wꜥ j:jri̯ =st mt m dm,t 'the Seven Hathors said with one mouth: she will die by the knife'"}
      - {motif: hero-reveals-secret-of-his-life-to-wife, refs: ["TwoBrothers 10_1-10_3/2"], note: "He warns her: m-jri̯ pri̯ r-bnr tm pꜣ y~mꜥ jṯꜣ =t 'do not go out, lest the Sea (pꜣ Ym, Semitic Yam) seize you'; I cannot save you, tw≡j m s,t-ḥm,t mj-qd =t 'for I am a woman like you' (after his castration); ḥꜣ,tj =j wꜣḥ ḥr ḏꜣḏꜣ n tꜣ ḥ~rw~rw n pꜣ ꜥš ... wn.jn =f ḥr wpw.t n =sst ḥꜣ,tj =f m-qꜣj =f nb 'my heart lies on the top of the cedar's blossom ... and he opened his heart to her completely'"}
    hints:
      - "'That he not dwell alone': Gen 2:18 ('it is not good that the man should be alone; I will make him a helper') and Gen 2:22 (God builds the woman); the potter god Khnum compares with Gen 2:7 and Isa 64:8."
      - "Fates decreed at birth by goddesses: compare the Hathors with the decreeing of a destiny (Ps 139:16) and Q 57:22."
      - "The hero opening his whole heart to a woman who will betray him: Samson and Delilah, 'he told her all his heart' (Judg 16:17-18, wayyagged-lāh ʾet-kol-libbo)."
      - "Yam, the Sea, as a hostile power: Ps 74:13; 89:9-10; Job 7:12; 38:8-11."
  - id: ane-twobrothers-lock-of-hair-and-death
