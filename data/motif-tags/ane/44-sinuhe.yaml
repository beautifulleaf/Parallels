      - {motif: finder-rewarded-with-gold-and-silver, refs: ["TwoBrothers 14_7"], note: "jw =tw r fꜣi̯.ṱ =k m ḥḏ nbw 'they will weigh you out with silver and gold' for bringing me, jw =j r ḫpr m bjꜣ,t ꜥꜣ.t 'for I shall become a great wonder'"}
