      - {motif: loyal-brother-made-successor, refs: ["TwoBrothers 19_6-19_7/2"], note: "He makes Anubis crown prince (ꜥr,j-pꜥ,t) of the whole land, rules 30 years as king of Egypt, dies, and his elder brother takes his place on the day of mooring (death)"}
      - {motif: hero-forgives-brothers, refs: ["TwoBrothers 19_6-19_6/2"], note: "Approximate: the once murderous elder brother is raised to crown prince by the younger, now king"}
