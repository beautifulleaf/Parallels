    original: true
    tagger: "Claude Opus 5.5, reading the Egyptian"
    version: "pD'Orbiney"
    read: ["TwoBrothers 5_4-6_3/3"]
    tags:
      - {motif: enraged-like-leopard, refs: ["TwoBrothers 5_4"], note: "wn.jn pꜣy =f sn ꜥꜣ ḥr ḫpr mj ꜣbw-šmꜥ 'his elder brother became like a leopard'; the same simile used of Bata's anger at 3_8"}
      - {motif: husband-lies-in-wait-to-kill-hero, refs: ["TwoBrothers 5_5-5_5/3"], note: "He has his spear sharpened and stands behind the stable door r ẖdb pꜣy =f sn šrj 'to kill his younger brother'"}
      - {motif: speaking-cow-warns-of-ambush, refs: ["TwoBrothers 5_8-6_1"], note: "m =kw pꜣy =k sn ꜥꜣ ꜥḥꜥ r-ḥꜣ,t.ṱ =k ẖr,j pꜣy =f njw,y r ẖdb =k rwj =k tw r-ḥꜣ,t =f 'see, your elder brother stands before you with his spear to kill you: flee from him!'; the second cow says the same"}
      - {motif: speaking-animal-ox, refs: ["TwoBrothers 5_8/2"]}
      - {motif: hero-flees-brother-who-seeks-to-kill-him, refs: ["TwoBrothers 6_3-6_3/3"], note: "He throws down his load and runs away; his elder brother pursues with the spear"}
      - {motif: brothers-plot-death, refs: ["TwoBrothers 5_5/3"], note: "Not envy but a husband's revenge: the elder brother (not brothers) plans to kill the younger"}
    hints:
      - "The master's anger at the accusation (Gen 39:19, 'his anger burned') leads here to an attempted killing instead of prison (Gen 39:20; Q 12:35)."
      - "Flight from a brother's murderous anger: Jacob from Esau (Gen 27:41-45); David from Saul's spear (1 Sam 19:9-10)."
      - "An animal sees the danger first and warns its master: Balaam's ass (Num 22:22-33)."
  - id: ane-twobrothers-gods-intervention
    tradition: ane-egyptian
    title: "Two Brothers: Bata prays to Re-Harakhti, who puts a crocodile-filled water between the brothers; the dialogue at dawn"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Egyptian"
    version: "pD'Orbiney"
    read: ["TwoBrothers 6_4-7_6/3"]
    tags:
      - {motif: sun-god-separates-wrongdoer-from-righteous, refs: ["TwoBrothers 6_4-6_5/2"], note: "pꜣy =j nb nfr mntk pꜣ n,tj ḥr wpw.t pꜣ ꜥḏꜣ,w r pꜣ mꜣꜥ,tj 'my good lord, you are the one who separates the wrongdoer from the righteous'; ꜥḥꜥ.n Pꜣ-Rꜥ ḥr sḏm spr,w =f nb 'Pre heard all his pleas'"}
      - {motif: god-hears-prayer-of-righteous, refs: ["TwoBrothers 6_5/2"]}
      - {motif: god-sets-crocodile-water-between-pursuer-and-pursued, refs: ["TwoBrothers 6_6-6_7"], note: "jw Pꜣ-Rꜥ ḥr ḏi̯.t ḫpr wꜥ-n mw ꜥꜣ r-jwd =f r-jwd pꜣy =f sn ꜥꜣ jw =f mḥ m msḥ.w 'Pre made a great water appear between him and his elder brother, full of crocodiles'; one on one side, the other on the other"}
      - {motif: case-to-be-judged-at-sunrise, refs: ["TwoBrothers 6_8-6_9/2", "TwoBrothers 7_2/3"], note: "ꜥḥꜥ dj r ḥḏ-tꜣ wnn pꜣ Jtn ḥr wbn jw =j ḥr wpw.t ḥnꜥ =k m-bꜣḥ =f mtw =f ḏi̯.t pꜣ ꜥḏꜣ,w n pꜣ mꜣꜥ,tj 'stay there till dawn; when the Disk rises I will be judged with you before him, and he will hand the wrongdoer over to the righteous'"}
      - {motif: accused-hero-gives-his-own-account, refs: ["TwoBrothers 7_3/2-7_6/3"], note: "jḫ pꜣy =k jy.t m-sꜣ =j r ẖdb =j m-grg jw nn sḏm =k rʾ =j ḥr md.t 'why do you pursue me to kill me wrongfully without hearing my mouth speak?'; repeats her words 'come, let us lie together' and ptrj pnꜥ =st sw n =k m ktḫ 'she has turned it round for you into something else'"}
      - {motif: adoption-formula-you-are-my-father, refs: ["TwoBrothers 7_4/3-7_5"], note: "tw≡k m-ḏi̯ =j m sḫr,w n jt ḫr tꜣy =k ḥm,t m-ḏi̯ =j m sḫr,w n mw,t 'you are to me like a father, your wife like a mother'"}
      - {motif: wronged-hero-lives-alone-in-valley-of-cedar, refs: ["TwoBrothers 7_2-7_2/2"], note: "jw =j r šmi̯.t r tꜣ jn,t n pꜣ ꜥš 'I will go to the Valley of the Cedar (ꜥš, conifer of Lebanon/Syria)'"}
    hints:
      - "Prayer to the judge who separates the guilty from the innocent: Gen 18:25, Ps 7:9-12, 1 Kgs 8:31-32; Joseph's 'my Lord knows' (Q 12:50) and Q 12:33-34 (Joseph prays and his Lord answers him)."
      - "A divinely placed barrier between pursuer and pursued: the pillar of cloud between Egypt and Israel (Exod 14:19-20), the waters of the sea (Exod 14:21-29); Laban stopped by God's warning in a dream (Gen 31:24, 29)."
      - "Case brought before the rising sun: compare Zeph 3:5 ('morning by morning he brings his justice to light') and Ps 37:6."
  - id: ane-twobrothers-oath-mutilation-heart
    tradition: ane-egyptian
    title: "Two Brothers: Bata's oath and self-castration; his heart to be placed on the cedar; Anubis kills his wife"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Egyptian"
    version: "pD'Orbiney"
    read: ["TwoBrothers 7_7-8_8/2"]
    tags:
      - {motif: gods-invoked-as-witness-of-innocence, refs: ["TwoBrothers 7_7-7_7/2"], note: "wn.jn =f ḥr ꜥrq =f n pꜣ Rꜥ-Ḥr,w-ꜣḫ,ty 'he swore by Re-Harakhti': you came to kill me wrongfully (m-grg) with your spear for the sake of a filthy whore (kꜣ,t)"}
      - {motif: self-castration-as-proof-of-innocence, refs: ["TwoBrothers 7_8-7_9/3"], note: "jw =f ḥr jni̯ wꜥ-n sfd-gš jw =f ḥr šꜥd ḥnw =f jw =f ḥr ḫꜣꜥ =f r pꜣ mw jw pꜣ nꜥr ḥr ꜥmꜣm =f 'he took a reed knife, cut off his phallus and threw it into the water; the catfish swallowed it'"}
      - {motif: elder-brother-weeps-for-wronged-brother, refs: ["TwoBrothers 8_1/2-8_1/4"], note: "jw =f ḥr rmy.t n =f qꜣi̯ 'he wept loudly for him', unable to cross because of the crocodiles"}
      - {motif: master-recognizes-wifes-guilt, refs: ["TwoBrothers 8_1/2", "TwoBrothers 8_7/2"], note: "After Bata's account (7_6/3) and oath, Anubis' heart grieves and he goes home and kills his wife"}
      - {motif: remember-good-not-only-evil, refs: ["TwoBrothers 8_2/2"], note: "jr sḫꜣy =k wꜥ-n bjn jstw bw jri̯ =k sḫꜣy wꜥ-n nfr 'if you remember something bad, can you not remember something good?'"}
      - {motif: heart-placed-in-tree-external-soul, refs: ["TwoBrothers 8_3/2-8_4"], note: "pꜣy =j šdi̯ ḥꜣ,tj =j mtw =j wꜣḥ =f ḥr ḏꜣḏꜣ n tꜣ ḥw~rw~rw n pꜣ ꜥš 'I will take out my heart and put it on top of the blossom of the cedar'"}
      - {motif: heart-revived-in-bowl-of-water, refs: ["TwoBrothers 8_4/2-8_5"], note: "If the cedar is felled, search for it, 'even if you spend seven years (7 rnp,t) searching, let your heart not weary'; put it in a bowl of cool water and I will live again"}
      - {motif: beer-foams-sign-of-disaster, refs: ["TwoBrothers 8_6-8_6/2"], note: "When a jug of beer is put in your hand and it foams over (jri̯ stf), you will know something has happened to me"}
      - {motif: mourner-hand-on-dust-smeared-head, refs: ["TwoBrothers 8_6/3"], note: "jw ḏr,t =f wꜣḥ ḥr ḏꜣḏꜣ =f jw =f wrḥ.w n jwdn 'his hand on his head, smeared with dust'"}
      - {motif: husband-kills-lying-wife-throws-to-dogs, refs: ["TwoBrothers 8_7/2-8_8"], note: "jw =f ḥr ẖdb tꜣy =f ḥm,t jw =f ḥr ḫꜣꜥ =st n nꜣ-n jw 'he killed his wife and threw her to the dogs'"}
      - {motif: weeping-fasting-mourning-for-days, refs: ["TwoBrothers 8_8/2"], note: "jw =f ḥmsi̯ m gꜣ~sꜣ 'he sat in mourning for his younger brother'"}
    hints:
      - "Oath of innocence and self-mutilation: compare the eunuchs who 'made themselves eunuchs' (Matt 19:12) and the eunuch's exclusion and promise (Deut 23:1; Isa 56:3-5); the phallus swallowed by a fish recalls Plutarch's Osiris (De Iside 18)."
      - "The husband convinced of the wife's guilt: Potiphar (Q 12:28-29, 'it is of your women's guile; Joseph, turn from this; and you, seek forgiveness'); in Gen 39 the master never recognises it."
      - "Life held in a separate object and a sign that reveals the hero's death: compare Samson's strength in his hair (Judg 16:17) and Jacob's recognition by a garment (Gen 37:33)."
      - "Earth on the head as mourning: Josh 7:6, 1 Sam 4:12, 2 Sam 1:2, 13:19 (Tamar's hand on her head). A wicked wife thrown to the dogs: Jezebel (1 Kgs 21:23; 2 Kgs 9:33-37)."
