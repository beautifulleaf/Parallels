      - {motif: king-kisses-ground-before-god, refs: ["Sinuhe W1:249"], note: "dhn.n =j tꜣ jmj-t(w) šzp,w 'I touched the ground with my forehead between the sphinxes'"}
      - {motif: returning-exile-swoons-before-king, refs: ["Sinuhe W1:252/2-255/4"], note: "dwn.kw ḥr ẖ,t =j ḫmi̯.n =j wj m-bꜣḥ =f ... bꜣ =j zbi̯.w ḥꜥ.w =j ꜣd.w ḥꜣ,tj =j n ntf m ẖ,t =j n rḫ =j ꜥnḫ r mt 'stretched on my belly I did not know myself before him ... my ba was gone, my limbs trembled, my heart was not in my body, I did not know life from death'"}
      - {motif: prostration-before-deity, refs: ["Sinuhe W1:252/2"], note: "The king is called nṯr pn 'this god' (W1:253)"}
      - {motif: subject-yields-life-to-kings-will, refs: ["Sinuhe W1:263-263/3"], note: "mk wj m-bꜣḥ =k ntk ꜥnḫ jrr ḥm =k m mrw,t =f 'here I am before you; life is yours; let your majesty do as he wills'"}
