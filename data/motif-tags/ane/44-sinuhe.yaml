  # ===================== Sinuhe W2 (pBerlin 10499, R) =====================
  - id: ane-sinuhe-w2-titles-and-kings-death
    tradition: ane-egyptian
    title: "Sinuhe (R): Sinuhe's titles; year 30: King Amenemhat ascends to his horizon; the crown prince hears and flies home"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Egyptian"
    version: "W2, pBerlin P 10499 (R), the best witness for the opening"
    read: ["Sinuhe W2:1-22"]
    tags:
      - {motif: tomb-autobiography-titles-opening, refs: ["Sinuhe W2:1-2/3"], note: "(j)r,(j)-pꜥ,t ḥꜣ,tj-ꜥ ... šms,w Zꜣ-nh,t ḏd =f jnk šms,w šms nb =f 'the noble and count ... the follower Sinuhe says: I was a follower who followed his lord', servant of the royal harem of the queen"}
      - {motif: king-ascends-to-heaven, refs: ["Sinuhe W2:6-7"], note: "ꜥr nṯr r ꜣḫ,t =f ... sḥri̯ r p,t ẖnm m jtn ḥꜥ nṯr ꜣbḫ m jri̯ sw 'the god ascended to his horizon ... flew to heaven, united with the sun disk, the god's body merged with him who made him'"}
      - {motif: palace-in-mourning-at-kings-death, refs: ["Sinuhe W2:8-10/2"], note: "jw ẖnw m sgr jb.pl m gm,w rw,tj-wr,tj ḫtm šny,t m tp-ḥr-mꜣs,t 'the residence was in silence, hearts in grief, the great double gate sealed, the court head on knee'"}
      - {motif: crown-prince-on-campaign-returns-to-claim-throne, refs: ["Sinuhe W2:11-21"], note: "Senwosret is leading the army against the Tjemehu Libyans; messengers reach him at night; n-zp sjni̯ =f rssy bjk ꜥḫi̯ =f ḥnꜥ šms,w =f 'he did not wait a moment; the falcon flew off with his followers' without telling his army"}
      - {motif: courtier-flees-on-kings-death, refs: ["Sinuhe W2:22"], note: "Messengers were also sent to the king's sons in the army (setting up the secret message Sinuhe overhears)"}
    hints:
      - "A succession crisis at the king's death with a prince hurrying back while a rival party is informed: compare 1 Kgs 1 (Adonijah and Solomon) and 2 Kgs 11:1-3."
      - "The court in silence and the gates sealed at the king's death: compare 2 Sam 19:1-4 and the mourning for Jacob in Egypt (Gen 50:3)."
