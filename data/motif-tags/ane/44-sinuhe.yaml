      - {motif: blood-on-doorposts-and-lintel, refs: ["TwoBrothers 16_8/2"], note: "Approximate: blood of the slain sacred bull falls at the two doorposts of the royal gate and becomes a new life-form, not a protective daub"}
      - {motif: tree-speaks-to-betrayer, refs: ["TwoBrothers 17_3/2-17_8/2"], note: "Pharaoh sits under one tree, his lady under the other; Bata speaks: hꜣ tꜣ grg,t jnk Bꜣtꜣ tw≡j ꜥnḫ.kwj ḫbꜣ,tw r =t 'Ha, you liar! I am Bata, I am alive in spite of you'"}
