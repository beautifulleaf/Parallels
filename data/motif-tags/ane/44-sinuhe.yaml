  # ===================== Tale of the Two Brothers (pD'Orbiney) =====================
  - id: ane-twobrothers-brothers-and-herds
    tradition: ane-egyptian
    title: "Two Brothers: Anubis and Bata; the younger brother as son and servant of the household; the talking cattle; ploughing"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Egyptian"
    version: "pD'Orbiney (BM EA 10183), Late Egyptian, 19th Dynasty (scribe Inena)"
    read: ["TwoBrothers 1_1-2_6"]
    tags:
      - {motif: two-brothers-of-one-father-and-mother, refs: ["TwoBrothers 1_1"], note: "sn 2 n wꜥ mw,t n wꜥ jt Jnp,w rn n pꜣ ꜥꜣ jw Bꜣtꜣ rn n pꜣ šrjw 'two brothers of one mother and one father: Anubis the name of the elder, Bata the name of the younger'"}
      - {motif: younger-brother-raised-as-son, refs: ["TwoBrothers 1_1/2-1_3"], note: "pꜣy =f sn šrjw m-ḏi̯ =f mj-sḫr,w-n šrjw jw mntwf j:jri̯ n =f ḥbs.w 'his younger brother was with him like a son; it was he who made his clothes', went behind his cattle, ploughed, harvested and did all the field work"}
      - {motif: hero-beautiful, refs: ["TwoBrothers 1_3/2-1_4"], note: "pꜣy =f sn šrjw m ꜥḥꜣ,wtj nfr nn-wn mj-qd =f m pꜣ tꜣ r-ḏr =f 'his younger brother was a fine (nfr: good / handsome) young man; there was none like him in the whole land'"}
      - {motif: divine-favor-in-servitude, refs: ["TwoBrothers 1_4/2", "TwoBrothers 2_1-2_1/2"], note: "js wn pḥ,tj n nṯr jm =f 'the strength of a god was in him'; the cattle in his charge became very fine and multiplied their calves. Bata is a younger brother serving the household, not a slave: interpretive"}
      - {motif: herd-multiplies-under-heros-care, refs: ["TwoBrothers 2_1-2_1/2"]}
      - {motif: cattle-tell-herdsman-where-pasture-good, refs: ["TwoBrothers 1_10"], note: "jw =sn ḥr ḏd n =f nfr pꜣ stjmw n s,t ḥmn.t mtw =f sḏm pꜣ ḏd =sn nb 'they would say to him: the grass of such a place is good, and he heard all they said'"}
      - {motif: speaking-animal-ox, refs: ["TwoBrothers 1_10"]}
    hints:
      - "Two sons of one father and mother, one a herdsman: compare Cain and Abel (Gen 4:1-2) and Jacob and Esau (Gen 25:24-27)."
      - "'The strength of a god was in him' and the herds thriving under him: compare Gen 39:2-6 (YHWH with Joseph, the blessing on Potiphar's house and field) and Gen 41:38 ('a man in whom is the spirit of God'); Jacob's herding for Laban (Gen 30:29-30, 43; 31:38-40)."
      - "Joseph as handsome (Gen 39:6, yefeh-toʾar) and the beauty of Joseph in Q 12:31."
      - "Talking animals: Balaam's ass (Num 22:28-30) and Solomon understanding the ant (Q 27:18-19)."
  - id: ane-twobrothers-seduction-attempt
    tradition: ane-egyptian
    title: "Two Brothers: sent home for seed, Bata is propositioned by his elder brother's wife and refuses"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Egyptian"
    version: "pD'Orbiney"
    read: ["TwoBrothers 2_7-4_2/4"]
    tags:
      - {motif: masters-wife-seduces, refs: ["TwoBrothers 3_5-3_7/5"], note: "wn pḥ,tj ꜥꜣ jm =k ... jw jb =st r rḫ =f m rḫ n ꜥḥꜣ,wtj 'there is great strength in you, I see your strength every day' -- she wished 'to know him as one knows a man'; jw =st ḥr mḥ jm =f 'she seized him'; mꜥ~j jry =n n =n wnw,t sḏr =n 'come, let us spend an hour lying together'. The woman is the wife of his elder brother, who is 'like a father' to him"}
      - {motif: hero-beautiful, refs: ["TwoBrothers 3_5"], note: "The woman is drawn by his strength (pḥ,tj ꜥꜣ), seen daily as he carries five sacks of grain on his shoulder (3_4/5)"}
      - {motif: seducer-offers-fine-clothes, refs: ["TwoBrothers 3_7/4-3_7/5"], note: "ꜣḫ n =k pꜣj kꜣ jry =j n =k ḥbs.w nfr.w 'it will be good for you: I will make you fine clothes'"}
      - {motif: alone-in-house, refs: ["TwoBrothers 2_9/2-3_2"], note: "Anubis is in the field; Bata finds her at home having her hair done (jw =tw ḥmsi̯ ḥr nbd =st), and she sends him alone to the storeroom; the proposition comes when he returns laden"}
      - {motif: refusal-of-seduction, refs: ["TwoBrothers 3_8-4_1/3"]}
      - {motif: enraged-like-leopard, refs: ["TwoBrothers 3_8"], note: "wn.jn pꜣ ꜥḏd,w ḥr ḫpr mj ꜣb,w-šmꜥ m qnd,t ḥr pꜣ smy bjn 'the youth became like a leopard in fury at the wicked speech', and she was very afraid"}
      - {motif: hero-likens-seducer-to-mother, refs: ["TwoBrothers 3_9/2-3_10/3"], note: "tw≡t m-ḏi̯ =j m sḫr,w n mw,t ḫr pꜣy =t hꜣy m-ḏi̯ =j m sḫr,w n jt ḫr pꜣ ꜥꜣ r =j mntwf sḫpr wj jḫ pꜣj btꜣ,w ꜥꜣ j:ḏd =t n =j 'you are like a mother to me, your husband like a father; he who is older than I raised me. What is this great crime (btꜣ,w ꜥꜣ) you have said to me?'"}
      - {motif: hero-refuses-citing-master-and-god, refs: ["TwoBrothers 3_10-3_10/2"], note: "Partial: Bata cites his loyalty to his elder brother who raised him, but no god; the 'great crime' (btꜣ,w ꜥꜣ) matches Gen 39:9 'this great evil' (hā-rāʿāh ha-gdolah) though without 'sin against God'"}
      - {motif: hero-promises-silence-about-seduction, refs: ["TwoBrothers 4_1-4_1/3"], note: "m-jri̯ ḏd.ṱ =f n =j ꜥn ḫr nn jw =j r ḏd.ṱ =f n wꜥ 'do not say it to me again, and I will not tell it to anyone'"}
    hints:
      - "The seduction of Joseph by his master's wife (Gen 39:7-12): 'lie with me' (39:7, 12; Bata's sḏr =n), seized (39:12, wa-titpeśehu; 3_7 mḥ jm =f), the refusal citing the master's trust (39:8-9) and 'this great wickedness' (39:9; btꜣ,w ꜥꜣ), the day-to-day contact of the household (39:10-11)."
      - "Q 12:23: she sought to seduce him, closed the doors and said 'come' (hayta laka; compare mꜥ~j 'come!'); he said 'God forbid: he is my lord who made my lodging good'. Q 12:24: she desired him and he would have desired her but for the proof of his Lord."
      - "Unlike Gen 39:12 and Q 12:25, no garment is torn or left behind; instead the woman promises to make him garments (3_7/5). Compare also Prov 7:10-23 (the seductress)."
  - id: ane-twobrothers-false-accusation
    tradition: ane-egyptian
    title: "Two Brothers: the wife fakes a beating and accuses Bata to her husband"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Egyptian"
    version: "pD'Orbiney"
    read: ["TwoBrothers 4_3-5_3/4"]
    tags:
      - {motif: false-accusation-by-wife, refs: ["TwoBrothers 4_6/2-4_7", "TwoBrothers 4_10/4-5_3/2"], note: "m pꜣy =k sn šrj j:jri̯ qnqn 'it was your younger brother who beat me'; bw-pw wꜥ md.t m-ḏi̯ =j ḥr,w pꜣy =k sn šrj 'no one quarrelled with me but your younger brother'"}
      - {motif: accuser-feigns-beating, refs: ["TwoBrothers 4_5-4_6/2", "TwoBrothers 4_8/2-4_8/3"], note: "jni̯ ꜥd,w pd~jrʾ 'she took fat and a bandage' and made herself like one beaten (qnqn.tj n ꜥḏꜣ,w); she lies 'falsely sick' (mḥr.tj n ꜥḏꜣ,w), pours no water on his hands, has lit no lamp, the house is in darkness, she is vomiting"}
      - {motif: accuser-puts-her-words-in-heros-mouth, refs: ["TwoBrothers 5_1-5_2/4"], note: "mꜥ~j jry =n wnw,t sḏr =n wnḫ =t pꜣy =t nbd 'come, let us spend an hour lying together; loosen your braids'; and her own feigned refusal: js bn jnk tꜣy =k mw,t ḫr pꜣy =k sn ꜥꜣ m-ḏi̯ =k m sḫr,w n jt 'am I not your mother, is not your elder brother like a father to you?'"}
      - {motif: alone-in-house, refs: ["TwoBrothers 5_1"], note: "In her lie: jw =f ḥr gmi̯ =j ḥmsi̯.kwj wꜥi̯ =j 'he found me sitting alone'"}
      - {motif: accuser-threatens-suicide-unless-hero-killed, refs: ["TwoBrothers 5_3/3"], note: "jr ḏi̯ =k ꜥnḫ =f jw =j r mt n =j 'if you let him live, I will kill myself'"}
    hints:
      - "Potiphar's wife's accusation (Gen 39:13-18): she reverses roles, calls the household and her husband and claims 'he came to lie with me' (39:14, 17); here too the woman quotes her own proposition as his."
      - "Q 12:25: at the door she says to her husband 'what is the recompense of one who intended evil for your wife but prison or a painful punishment?'; Q 12:26-28 the witness and the torn shirt test, which the Egyptian tale lacks (the husband believes her)."
      - "Feigned sickness as a ruse: compare Amnon (2 Sam 13:5-6) and Rachel on the camel saddle (Gen 31:35)."
  - id: ane-twobrothers-rage-and-flight
    tradition: ane-egyptian
