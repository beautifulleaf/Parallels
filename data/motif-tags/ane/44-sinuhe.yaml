      - {motif: princesses-sing-for-pardon-of-exile, refs: ["Sinuhe W1:268-279"], note: "With menits and sistra they sing to the king (Hathor, the Lady of the Stars, the crowns, the uraeus) and ask: nft ꜥb =k sfḫ šsr =k jmi̯ ṯꜣw n n,tj m jtḥ 'slacken your bow, lay down your arrow, give breath to him who is stifled'; mtn n m zꜣ mḥ,yt pḏ,tj msi̯.w m Tꜣ-mrj 'reward us with this son of the North wind, the bowman born in Egypt'"}
      - {motif: royal-women-intercede-with-king, refs: ["Sinuhe W1:275-277/2"], note: "jri̯.n =f wꜥr,t n snḏ =k 'he made the flight out of fear of you'"}
      - {motif: overlord-tells-vassal-do-not-fear, refs: ["Sinuhe W1:279/2-280"], note: "nn snḏ =f nn ꜥꜥj =f r ḥr,yt 'he shall not fear, he shall not be in dread'"}
