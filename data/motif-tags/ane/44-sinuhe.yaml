      - {motif: flight-like-a-dream-ordained-by-god, refs: ["Sinuhe W1:224/2-224/3", "Sinuhe W1:229/2"]}
      - {motif: overlord-breath-of-life, refs: ["Sinuhe W1:233-234", "Sinuhe W1:236/3"], note: "wbn jtn n mrw,t =k mw m jtr,w swr.t(w) =f mr =k ṯꜣw m p,t ḫnm.t(w) =f ḏd =k 'the sun rises for love of you, the water in the river is drunk when you wish, the air in the sky is breathed when you say'; ꜥnḫ =tw m ṯꜣw n dd =k 'one lives on the breath you give'"}
      - {motif: departing-hero-wills-goods-to-eldest-son, refs: ["Sinuhe W1:234/2"], note: "jw bꜣk-jm r swḏ.t jwꜥ,t n sꜣ =f ... 'this servant will hand over the inheritance to his fledglings whom he begot in this place'"}
      - {motif: fear-of-king-on-nations, refs: ["Sinuhe W1:231-232"], note: "di̯.n Rꜥ snḏ =k ḫt tꜣ ḥr,yt =k m ḫꜣs,t nb.t 'Re has set fear of you throughout the land, dread of you in every foreign land'"}
    hints:
