      - {motif: fugitive-sayings-contrast-need-and-wealth, refs: ["Sinuhe W1:149/2-156"], note: "wꜥr wꜥr n hꜣw =f ... rww z tꜣ =f n ḥꜣ,yt jnk ḥḏ,t pꜣq,t 'a fugitive flees from his surroundings ... a man leaves his land for nakedness: I have bright clothes and fine linen'"}
      - {motif: exile-prays-to-return-home-before-death, refs: ["Sinuhe W1:156/2-165"], note: "ptr wr.t r ꜥb,t-ẖꜣ,t =j m tꜣ msi̯.kw jm =f 'what is greater than that my corpse be buried in the land where I was born?'"}
      - {motif: father-burial-in-homeland, refs: ["Sinuhe W1:159"], note: "Here the exile himself, not a dying father, longs to be buried in his birthplace"}
      - {motif: wish-to-greet-queen-and-serve-her-children, refs: ["Sinuhe W1:165", "Sinuhe W1:172"]}
      - {motif: old-age-described-limb-by-limb, refs: ["Sinuhe W1:167-170/3"], note: "jr,t.du =j dns ꜥ,wj =j nw rd.du =j fḫ.n =sn šms jb wrd tkn wj n wḏꜣ 'my eyes are heavy, my arms weak, my legs have ceased to follow, the heart is weary, I am near to departing'"}
      - {motif: god-hears-prayer-of-righteous, refs: ["Sinuhe W1:162"], note: "jn mjn rf n,tt =f ḥtp sḏm =f spr,t wꜣ 'is it today that he is gracious and hears the prayer of the one far away?'"}
    hints:
      - "God's hidden guidance of an exile: compare Joseph's 'it was not you who sent me here but God' (Gen 45:5-8; 50:20) and Q 12:100."
      - "Longing for burial in the homeland: compare Jacob (Gen 47:29-30; 49:29-32), Joseph's bones (Gen 50:24-25; Exod 13:19), Barzillai (2 Sam 19:37) and Nehemiah's 'the city of my fathers' graves' (Neh 2:3-5)."
      - "Old age limb by limb: compare Eccl 12:1-7 and Barzillai's complaint (2 Sam 19:35); Q 19:4 Zechariah's 'my bones have weakened and my head is aflame with grey'."
  - id: ane-sinuhe-w1-royal-letter
