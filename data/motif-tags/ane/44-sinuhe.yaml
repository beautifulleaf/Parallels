      - {motif: lawsuit-before-divine-tribunal, refs: ["TruthFalsehood 10_1-10_5/4"], note: "The Ennead: ꜥḏꜣ,y bw-pwy =n ptrj jḥ mj ꜥꜣ n pꜣ ḏd =k 'false! we have never seen an ox the size you describe'; the youth: jstw wn ḥmt mj ꜥꜣ n pꜣ j:ḏd =tn 'is there a dagger the size you described?'; wpw Mꜣꜥ,t(j) ḥnꜥ Grg(,j) jnk pꜣy =f šrjw 'judge between Truth and Falsehood: I am his son'"}
      - {motif: tall-tale-of-cosmic-bull, refs: ["TruthFalsehood 10_2-10_3"], note: "The bull is set against the earlier impossible dagger (1_8): one lie unmasks the other"}
      - {motif: dagger-of-cosmic-size, refs: ["TruthFalsehood 10_3"]}
      - {motif: liar-swears-his-own-punishment, refs: ["TruthFalsehood 10_6-11_3/2"], note: "jri̯.t ꜥnḫ n nb ꜥnḫ (w)ḏꜣ snb wꜣḥ Jmn wꜣḥ pꜣ ḥqꜣ mtw =tw gmi̯ Mꜣꜥ,t(j) ꜥnḫ mtw =tw kꜣmn =j 'oath by the Lord: as Amun endures, as the Ruler endures, if Truth is found alive, let me be blinded in both eyes and made doorkeeper in Truth's house'; Truth is found alive; Falsehood receives 100 blows and 5 open wounds, is blinded and made doorkeeper (partly restored)"}
      - {motif: deceiver-deceived, refs: ["TruthFalsehood 11_2-11_3/2"]}
      - {motif: oath-as-god-and-ruler-endure, refs: ["TruthFalsehood 10_6-10_6/2"], note: "wꜣḥ Jmn wꜣḥ pꜣ ḥqꜣ 'as Amun endures, as the Ruler endures'"}
      - {motif: scribal-colophon, refs: ["TruthFalsehood 11_5-11_5/2"], note: "Fragmentary end formula [jwi̯ =s pw nfr] and a scribe's name"}
    hints:
      - "The wicked caught in their own trap and given the punishment they devised: Haman (Esth 7:9-10), Daniel's accusers (Dan 6:24), Ps 7:15-16; the lex talionis 'eye for eye' (Exod 21:24; Q 5:45)."
      - "An oath 'as the LORD lives' (1 Sam 14:39; 2 Sam 12:5, where David condemns himself unknowing) and 'as the king lives' (1 Sam 17:55; 2 Sam 15:21)."
      - "Truth (Maat) and Falsehood as personified brothers: compare personified Wisdom and Folly (Prov 8-9) and 'truth has stumbled in the street' (Isa 59:14-15)."
  # ===================== pWestcar (Khufu and the Magicians) =====================
  - id: ane-westcar-1-djoser-tale-end
    tradition: ane-egyptian
    title: "Westcar: end of the first tale: Khufu orders offerings for Djoser and his lector priest"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Egyptian"
