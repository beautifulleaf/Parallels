      - {motif: envoys-sent-to-fetch-beauty, refs: ["TwoBrothers 11_5/2-12_1"]}
      - {motif: only-i-escaped-to-tell, refs: ["TwoBrothers 11_7/4"], note: "Bata kills the men sent to the Valley of the Cedar, leaving one to report to His Majesty"}
      - {motif: matriarch-taken-into-royal-house, refs: ["TwoBrothers 12_1-12_3"], note: "The hero's wife is brought to Egypt, acclaimed in the whole land, loved by His Majesty and made šps,j(t)-ꜥꜣ.t 'great lady (favourite)'"}
      - {motif: wife-betrays-husbands-life-secret, refs: ["TwoBrothers 12_3/2-12_4/2"], note: "Asked about her husband's nature, she says jmm šꜥd.tw pꜣ ꜥš mtw =tw sksk =f 'have the cedar felled and chopped up'"}
      - {motif: heart-placed-in-tree-external-soul, refs: ["TwoBrothers 12_6-12_7"], note: "They cut the blossom on which Bata's heart was, jw =f ḥr hꜣy.t mt m tꜣ wnw,t šr.t 'and he fell dead at that moment'"}
    hints:
      - "A beautiful woman taken into Pharaoh's house after his officials praise her: Sarah (Gen 12:14-15) and the 'wife-sister' stories (Gen 20; 26); a king who sends for a woman he has heard of: David and Bathsheba (2 Sam 11:2-4), Ahasuerus' search for maidens (Esth 2:2-4, 8)."
      - "Court scholars consulted on a mystery: Pharaoh's magicians and wise men (Gen 41:8; Exod 7:11) and the 'scribes and wise men' of Dan 2:2."
      - "The wife who reveals her husband's secret to his enemies: Delilah (Judg 16:4-21); 'I alone escaped to tell you' (Job 1:15-19); successive companies sent to take a man who destroys them: 2 Kgs 1:9-14."
  - id: ane-twobrothers-anubis-revives-bata
