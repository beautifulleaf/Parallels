    tags:
      - {motif: dagger-of-cosmic-size, refs: ["TruthFalsehood 1_8"], note: "Largely restored from the later quotation at 10_3: pꜣ ḏww n J:jrʾ ... ḥmt ... the god's tomb as sheath, the herds of Kar as strap; Falsehood claims a dagger (lent to Truth?) of impossible size"}
      - {motif: younger-brother-blinds-elder, refs: ["TruthFalsehood 2_1-2_3"], note: "Grg(,j) 'Falsehood' to the Ennead: jmm jni̯ =tw Mꜣꜥ,t(j) mtw =tw kꜣmn =f m jr,t.du =f mtw =tw ḏi̯.t =f r jr,j-ꜥꜣ n pꜣy =j pr 'have Truth brought, blind him in both eyes and make him doorkeeper of my house'; the Ennead does all he says"}
      - {motif: lawsuit-before-divine-tribunal, refs: ["TruthFalsehood 2_1-2_3"]}
      - {motif: younger-brother-envies-elders-goodness, refs: ["TruthFalsehood 2_3/2-2_4"], note: "Falsehood looks about and sees bj(ꜣ),t n Mꜣꜥ,t(j) pꜣy =f sn ꜥꜣ 'the excellent character of Truth, his elder brother'"}
      - {motif: servants-ordered-to-throw-master-to-lions, refs: ["TruthFalsehood 2_5-3_3"], note: "jṯꜣy =tn pꜣy =tn nb mtw =tn ḫꜣꜥ =f n wꜥ mꜣj ḏw ... 'seize your master and throw him to a fierce lion and many lionesses'; Truth begs them not to and asks for bread; they report: the lion came out and devoured him"}
      - {motif: wild-animal-blamed, refs: ["TruthFalsehood 3_2-3_3"], note: "The servants falsely report that the lion devoured him (restored in part: [ḫꜣꜥ] =[n] =[f] ... ⸮wšꜥ? =f)"}
    hints:
      - "Brother against brother out of envy at his goodness: Cain and Abel (Gen 4:3-8; Q 5:27-31) and Joseph's brothers (Gen 37:4, 11, 18-20)."
      - "Servants spare the victim and report that a beast devoured him: compare Joseph's brothers and the 'evil beast' (Gen 37:20, 31-33; Q 12:13-17 'the wolf ate him')."
      - "Thrown to lions: Daniel (Dan 6:16-23)."
