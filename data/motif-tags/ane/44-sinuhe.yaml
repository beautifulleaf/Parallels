      - {motif: lady-desires-blind-stranger-conceives, refs: ["TruthFalsehood 3_6/2-4_5"], note: "jw =st ḥr ꜣbwy.ṱ =f r-jqr zp-2 'she desired him very much'; jw =f (ḥr) rḫ =st m rḫ n ꜥḥꜣ,wtj 'he knew her as a man knows (a woman)'; jw =st ḥr ꜥḥꜥ jwr.tj m pꜣj grḥ m wꜥ ꜥḏd šrj 'she conceived that night a little boy'"}
      - {motif: king-educated-in-scribal-school, refs: ["TruthFalsehood 4_7-5_1/3"], note: "Approximate (the label is royal): he is sent to school, learns writing excellently, practises all arts of war and surpasses his older schoolmates"}
      - {motif: boy-mocked-as-fatherless, refs: ["TruthFalsehood 5_3-5_8"], note: "His mother shows him the blind man by the door: pꜣy =k jt pꜣj 'he is your father'; mntk šrjw nj~mꜥ ... yꜣ mꜥ~nj m-ḏi̯ =k jt 'whose son are you? ... you have no father!'; he asks his mother nj~mꜥ rn n pꜣy =j jt 'what is my father's name?'"}
