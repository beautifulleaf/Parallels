      - {motif: son-avenges-wronged-father, refs: ["TruthFalsehood 6_5-6_7/2"], note: "nj~mꜥ j:kꜣmn tw ꜥn =j n =k wšb,t 'who blinded you? I will seek redress for you'; m pꜣy =j sn šrjw j:kꜣmn =j 'it was my younger brother who blinded me'"}
      - {motif: ox-entrusted-to-herdsman-taken-by-villain, refs: ["TruthFalsehood 7_2-8_4/2"], note: "He leaves a beautifully coloured ox with Falsehood's herdsman; Falsehood sees it, says jmm.tw n =j pꜣj jḥ wnm =j sw 'give me this ox to eat' and has the herdsman give the owner one of his own instead"}
      - {motif: tall-tale-of-cosmic-bull, refs: ["TruthFalsehood 8_5-9_5/2"], note: "jr wnn =f ꜥḥꜥ m Pꜣ-jw-n-Jmn tꜣ bꜣjr n sd =f ḥr tꜣ mḥ,t jw ꜥb =f wꜥ ḥr pꜣ ḏw jmn,tj ... 'when he stands on the Isle of Amun, the tuft of his tail lies on the papyrus marshes, one horn on the western mountain, the other on the eastern, the great river his resting place, 60 calves born to him daily'"}
      - {motif: lawsuit-before-divine-tribunal, refs: ["TruthFalsehood 9_5/3-9_6/2"], note: "He seizes the herdsman and drags Falsehood to the court (qnb,t) before the Ennead"}
    hints:
