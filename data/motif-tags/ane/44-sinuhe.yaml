      - {motif: heart-revived-in-bowl-of-water, refs: ["TwoBrothers 13_3/2-14_3/3"], note: "jw =f jri̯ 3 rnp,t n wḫꜣḫ =f nn gmi̯ =f 'he spent three years searching without finding it'; in the fourth year, about to go home, he finds a grape (jꜣjr): js ḥꜣ,tj n pꜣy =f sn šrj pꜣj 'that was the heart of his younger brother'. Placed in a bowl of cool water, at nightfall the heart absorbs the water, Bata trembles in all his body, drinks it and becomes as he was (ḫpr mj wnn =f)"}
      - {motif: brothers-reconciled-embrace, refs: ["TwoBrothers 14_3/4-14_4"], note: "wn.jn wꜥ qnjw wꜥ jm =sn 'then they embraced one another' and spoke"}
