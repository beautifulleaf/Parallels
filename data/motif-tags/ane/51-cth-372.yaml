      - {motif: confession-it-is-so-we-did-it, refs: ["CTH 378.2 §11:121-124", "CTH 378.2 §12:149-151"], note: "ēšzi=at iyawen=at; ašān=at iyanun=at 'it is true, I did it'"}
      - {motif: plague-kills-gods-servants-offerings-cease, refs: ["CTH 378.2 §11:128-129", "CTH 378.2 §13:166-167"]}
      - {motif: bird-takes-refuge-in-nest-simile, refs: ["CTH 378.2 §12:134-135"], note: "MUŠEN-iš=za=kan GIŠ.taptappan EGIR-pa ēpzi nan GIŠ.taptappaš ḫuišnuzi"}
      - {motif: servant-confesses-master-relents, refs: ["CTH 378.2 §12:136-148"]}
      - {motif: plague-already-repaid-many-times, refs: ["CTH 378.2 §12:152-158"], note: "20-anki … kišari 'has it not already happened twentyfold?'"}
      - {motif: priests-incubate-dreams-for-cause, refs: ["CTH 378.2 §12:159-161", "CTH 378.2 §14:169-177"], note: "šuppaya šeškiškanzi 'they lie down (to sleep) in purity'"}
      - {motif: plague-cause-sought-from-ecstatic-diviners-or-dream, refs: ["CTH 378.2 §14:168-171"]}
      - {motif: land-hangs-from-needle-point, refs: ["CTH 378.2 §14:180"]}
      - {motif: scribal-colophon, refs: ["CTH 378.2 §15:183-184"]}
    hints:
      - "Compare Q 35:18 and Q 6:164 (no bearer bears another's burden), Q 2:134 and 2:141 ('that was a nation that has passed; theirs is what they earned'), against 'the father's sin comes to the son'; and Ezek 18:2-4, Jer 31:29-30, Deut 24:16, Exod 20:5."
      - "Compare Ps 84:4 (the sparrow finds a home, the swallow a nest, at your altars) and Ps 91:4."
      - "Compare 2 Sam 12:13 and 2 Sam 24:10,17 (David: 'I have sinned … these sheep, what have they done?') and Q 38:24 (David seeks forgiveness)."
      - "Compare Q 10:98 (the people of Jonah believed and the punishment was lifted)."
