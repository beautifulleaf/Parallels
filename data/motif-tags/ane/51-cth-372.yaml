      - {motif: guilt-of-predecessor-not-forgiven, refs: ["CTH 378.1 §8:87"]}
      - {motif: bloodguilt-ritual-neglected-by-land, refs: ["CTH 378.1 §7:79-84"], note: "išḫanaš SÍSKUR partly restored"}
      - {motif: restitution-and-reconciliation-offering, refs: ["CTH 378.1 §8:91-93", "CTH 378.1 §9:99-100", "CTH 378.1 §9:112-114"]}
      - {motif: innocent-son-atones-for-fathers-sin, refs: ["CTH 378.1 §9:106-111"], note: "idālu UL kuitki … ammuk iyanun … wašter kuieš … karū=wat arḫa eker; ammuk=ma=kan ŠA A-BI-YA memiaš ār 'I did no evil; those who sinned are already dead; but my father's affair has reached me'"}
      - {motif: plague-kills-gods-servants-offerings-cease, refs: ["CTH 378.1 §9:117-127", "CTH 378.1 §10:133-136"], note: "if the bread- and libation-offerers all perish, no one will give you bread and libation any more"}
      - {motif: plague-diverted-to-enemy-lands, refs: ["CTH 378.1 §10:137-141"]}
      - {motif: anguish-from-heart-fear-from-body, refs: ["CTH 378.1 §4:55-56", "CTH 378.1 §10:145-146"]}
    hints:
      - "Compare 2 Sam 21:1-14: a three-year famine traced by inquiry of YHWH to Saul's breach of the sworn treaty with the Gibeonites; expiation by the king."
      - "Compare Q 6:164, Q 17:15, Q 35:18, Q 53:38 (no bearer of burdens bears another's burden) and Ezek 18:2-20 (sour grapes) against the son paying for the father's oath-breaking."
      - "Compare Q 16:91-94 (do not break oaths after confirming them, with God as surety) and Q 2:27."
      - "The argument that the gods will lose their offerers compares with Ps 6:6, Ps 88:11-13, Ps 115:17, Isa 38:18 (the dead do not praise) and with Moses' plea in Num 14:13-19."
      - "Delayed punishment after prosperity: compare Q 6:44 and Q 7:94-95, Q 22:48 (God gives respite, then seizes)."
