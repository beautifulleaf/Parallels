# Full read, chunk 28: SAA 20 (Assyrian royal rituals, tākultu texts, temple rosters). Read from ORACC (saao/saa20), lemmatized transliteration with glosses.
new_motifs:
  gods-bidden-drink-by-name: {label: "In the divine banquet (tākultu) the gods of the pantheon are called one by one by name and each is bidden 'drink!'", cluster: cult}
  banquet-litany-invokes-temple-and-cosmos: {label: "A cultic litany calls on temple parts, gates, walls, rivers, mountains, seas, winds, stars, days, months and years together with the gods to receive the offering and hear", cluster: cult}
  cult-objects-invoked-as-gods: {label: "Temple doors, daises, braziers, city gates, the god's weapons and crown are written with the divine determinative and invoked or fed as gods", cluster: cult}
  gods-asked-to-bless-king-who-gave-meal: {label: "The gods who have eaten are asked to give the king who provided their meal long days, lasting years, a strong weapon, a long reign and pre-eminence over kings", cluster: kingship}
  blessing-on-sharers-of-sacred-meal: {label: "Those who share the sacred meal are blessed: may they have barley, silver, oil, wool and salt to eat and a wick for their light", cluster: cult}
  salt-strewn-before-god: {label: "Salt is strewn on the offering table or on the offered meat before the god", cluster: cult}
  ritual-act-with-prescribed-formula: {label: "Each act of the rite is paired with a fixed spoken formula: 'when you do X, you say Y'", cluster: cult}
  life-accept-hear-formula: {label: "At the offering the officiant addresses the god: 'life! accept! hear!' (balāṭ, muhur, šime)", cluster: cult}
  king-officiates-sacrifice-in-temple: {label: "The king himself performs the temple rite: he sets the table, strews salt, slaughters the sheep and completes the libation", cluster: kingship}
  hand-water-for-king-before-offering: {label: "The priest brings the king water for his hands before he offers", cluster: purity}
  purifier-passed-over-table-and-censers: {label: "A purifying device (ša-tēlissi, torch) is passed over the offering table, the middle of the house and the censers to cleanse them", cluster: purity}
  hand-released-house-seized-declarations: {label: "Purifying the shrine, the officiant declares 'the hand is released', 'the middle of the house is released', 'the house is seized', 'may the fire-god be pure'", cluster: purity}
  aromatics-thrown-on-censer-repeatedly: {label: "Aromatic wood (emdu) is thrown on the censer a fixed number of times (twice, three times) before the god", cluster: cult}
  kispu-for-dead-in-temple-rite: {label: "Within a temple rite the king or priest makes a kispu, the food offering for the dead", cluster: death}
  king-kisses-ground-before-god: {label: "The king (or official) kisses the ground before the god or the king", cluster: cult}
  priest-circumambulates-temple: {label: "The priest goes round the whole temple and its shrines during the rite", cluster: cult}
  lament-priests-seated-and-raised: {label: "The lamentation priests (kalû) are made to sit and then to rise to perform laments during the royal rite", cluster: cult}
  king-gives-gifts-to-temple-staff: {label: "At the end of the rite the king gives gifts to the priest and temple staff", cluster: cult}
  god-seated-on-dais-of-destinies: {label: "The god's image is made to rise and is seated on the Dais of Destinies", cluster: cult}
  gods-travel-with-high-god-in-procession: {label: "Named gods, divine chariots and divine weapons travel with the chief god from his temple to another shrine", cluster: cult}
  mouth-washing-of-cult-image: {label: "A mouth-washing (mīs pî) ritual is performed in the temple", cluster: cult}
  gods-face-polished-to-shine: {label: "The god's image is attended so that its face shines (zīmu šunmuru)", cluster: cult}
  censer-and-torch-brought-near-god: {label: "Censer and torch are brought near the god", cluster: cult}
  king-goes-to-akitu-house: {label: "The king (and the god) go out to the akītu-house for the festival and return", cluster: cult}
  blood-and-offerings-into-spring: {label: "Sacrificial blood is offered into a spring, fish and crab are placed in it, and oil, honey and wine poured in", cluster: cult}
  cult-performer-shouts-before-goddess: {label: "A cultic performer (assinnu) lifts weapons and shouts before the goddess", cluster: cult}
  gods-asked-to-bless-each-other: {label: "The officiant asks one god to bless another (Aššur to bless Mullissu, Mullissu to bless Aššur)", cluster: cult}
  gods-named-at-morning-and-evening-offering: {label: "The gods are called by name at the morning and evening offerings", cluster: cult}
  heaven-and-apsu-bless-worshipper: {label: "When the god's feet are kissed the formula is: 'may heaven and the Apsû bless you'", cluster: cult}
  royal-message-received-before-god: {label: "A royal message or seal arriving from the road is carried in a cart, seated before the god and honoured with a sacrifice", cluster: kingship}
  priestly-lineage-in-colophon: {label: "A colophon lists the copyist and his priestly or scribal ancestors over several generations", cluster: scribal}
  king-puts-dust-on-head: {label: "The king puts earth on his own head during a rite", cluster: mourning}
  loaves-made-to-dance-before-god: {label: "Kamānu-cakes are made to 'dance' (raised and moved) on the table before the deity", cluster: cult}
  roasted-kid-before-gods: {label: "A female kid is roasted before the gods", cluster: cult}
  hair-tuft-cut-and-burned: {label: "A tuft of hair is cut from a participant's head and thrown into the fire", cluster: cult}
  banquet-hosts-pray-for-name-and-seed: {label: "The hosts of the cult banquet pray that the goddess give well-being, life, name and seed", cluster: cult}
  temple-staff-duty-roster: {label: "A roster assigns each temple official his responsibility (firewood, incense, doors, cleaning, bread, beer, records, gates)", cluster: cult}
  regular-bread-and-beer-offering: {label: "Regular (kayyamānu) bread and beer are provided for the temple's gods", cluster: cult}
  temple-swept-from-dais-to-foundation: {label: "The temple is fanned and cleaned from the foot of the dais to the foundation and from the gate to the threshold", cluster: cult}
  calendar-of-laments-after-sacrifice: {label: "A calendar assigns a named lament to be sung to the god after the sacrifices on each day", cluster: cult}
  king-recites-penitential-psalm-to-drum: {label: "The king is made to recite a penitential psalm (eršahunga) to the bronze kettle-drum", cluster: cult}
  laments-performed-to-remove-enemy: {label: "Laments and penitential psalms are performed before the gods so that the enemy may be removed", cluster: cult}
  dead-displayed-on-bed: {label: "The dead person's bed is set up and the body displayed; the feet are washed and mourners go round the bed three times", cluster: death}
  funerary-tables-for-netherworld-figures: {label: "At a burial tables are set before Antu, Gilgameš and the boatmen of the netherworld journey", cluster: death}
  palace-women-mourn-with-bloodied-noses: {label: "The palace women cry 'come!' to the dead woman and the mourners seal themselves with blood from their noses", cluster: mourning}
  flour-boat-broken-for-dead: {label: "A boat of flour is broken with a dagger and oil and honey poured into it at a burial", cluster: death}
  effigy-of-dead-given-ram-heart: {label: "A ram's heart in flour is placed in the middle of the effigy of the dead", cluster: death}
  ritual-tent-on-riverbank: {label: "A ritual tent is pitched on the riverbank with its door facing the sun god", cluster: cult}
  set-of-metals-one-mina-each: {label: "One mina each of iron, lead, gold, silver, bronze, tin and glass is laid out in a ritual", cluster: cult}
  hymn-incipits-sung-at-each-offering: {label: "At each offering the officiant sings a named hymn to the deity concerned", cluster: cult}
  strewn-flour-offering-to-each-deity: {label: "A strewn offering (serqu) of flour is scattered before each deity in turn", cluster: cult}
  evil-released-seed-secured: {label: "The ritual promises that the client's evil will be released and his seed secured", cluster: cult}
  offering-graded-by-social-rank: {label: "The offering depends on the offerer's rank: a prince burns a turtledove, a commoner roasts a sheep's heart", cluster: cult}
  client-seated-bound-with-red-wool: {label: "The sacrificer is seated on fleeces laid fourfold beneath, at head and feet, his hands bound with red wool, and released after the rite", cluster: cult}
  singer-officiates-rite: {label: "A singer (nāru) leads the rite, singing named hymns, washing hands and offering water to the sun god", cluster: cult}
  palace-banquet-protocol: {label: "The protocol of the royal banquet: officials enter in order, kiss the ground, report, tend braziers, towels, hand-water, torches and cups", cluster: kingship}
  torches-lit-at-sunset-in-palace: {label: "At sunset torches are lit and brought into the palace hall", cluster: kingship}
  arrow-rite-for-victory: {label: "In a war ritual the king bends the bow before the sun god, takes and kisses an arrow, arrows are shot into the enemy figure, and the king 'conquers his enemy'", cluster: war}
  impersonators-of-gods-face-enemy: {label: "Performers representing gods (sarrānātu) set their faces against the enemy, murmur and dance", cluster: war}
  cult-performers-mock-battle: {label: "Kurgarrû and assinnu performers sing the 'play of battle' and laments and go round in the rite", cluster: cult}
  drum-hung-after-victory: {label: "After the ritual victory the king hangs the great drum on his shoulder and goes before the gods", cluster: war}
  performer-led-seven-times-before-goddess: {label: "A performer is brought before the goddess, given beer on a lion's head, and the chief singers walk before him seven times", cluster: cult}
  king-stroke-nose-gesture: {label: "The king 'strokes his nose' (labān appi), the gesture of humble prayer", cluster: cult}
  goddess-image-taken-to-bath: {label: "The goddess's image is brought into a bath-house, a ritual bath (rinku) is set up and she comes out of it", cluster: cult}
  king-sacrifices-before-stars: {label: "The king sacrifices before the stars and planets, named one by one", cluster: cult}
  divine-images-placed-on-kings-neck: {label: "Images of the gods (amulets) are placed on the king's neck as he enters the temple", cluster: kingship}
  offering-portions-given-to-officials: {label: "The goddess's offering portions are given to officials, palace women or the crown prince", cluster: cult}
  penitential-psalm-list-by-incipit: {label: "A list of penitential psalms and laments by their opening words, each assigned to a deity", cluster: cult}
  temple-officials-roll-call: {label: "A list of the temple's officials and priests of each god, in order of rank", cluster: cult}
  igigi-and-anunnaki-invoked-together: {label: "The Igigi, gods of heaven, and the Anunnaki, gods of the earth, are invoked together to accept the offering", cluster: cult}
  deified-truth-and-justice: {label: "Truth (Kittu) and Justice (Mīšaru) are invoked as gods", cluster: cult}
  statues-of-kings-among-gods-at-meal: {label: "Statues of former kings and princes (and of commoners) and deified or deposed kings are invoked among the gods at the divine meal", cluster: cult}
  king-blessed-with-priesthood-and-kingship: {label: "The king is blessed to exercise priesthood and kingship together", cluster: kingship}
  exorcists-recite-incantations-in-royal-rite: {label: "The exorcists recite named Sumerian incantations as the king and the god pass in procession", cluster: cult}
  daily-dated-ritual-calendar: {label: "A ritual is laid out day by day with dated entries (the 17th, 18th, 19th ...), including days on which the king does not go to the temple", cluster: cult}
  king-rises-early-for-dawn-rite: {label: "The king rises early and goes to the temple at dawn, and again at evening", cluster: cult}
  hands-and-feet-anointed-in-rite: {label: "The participant's hands and feet are anointed with fine oil in the rite", cluster: cult}
  person-designated-as-substitute: {label: "A person is declared to be 'of the exchange' (pūhu), a substitute in the rite", cluster: cult}
  cult-garments-and-jewels-of-gods: {label: "The garments and ornaments of all the gods are inspected and kept by a temple official", cluster: cult}
  votive-gifts-received-and-recorded: {label: "The temple scribe inspects and receives the votive gifts brought to all the gods", cluster: cult}
  royal-order-on-temple-practice: {label: "A king's order on temple personnel and practice is quoted", cluster: kingship}
  dumuzi-receives-offerings-in-state-cult: {label: "Dumuzi (Tammuz) is listed among the gods who receive offerings in the state cult", cluster: cult}
  divine-names-as-sentences: {label: "Minor gods bear sentence-names such as 'He-hears-prayer' or 'Hear-the-offering'", cluster: cult}
  foreign-gods-in-assyrian-pantheon-list: {label: "Gods of foreign peoples (Hurrian, Urartian, Egyptian, Elamite) are listed among the gods fed in the Assyrian cult", cluster: cult}
  hand-lifting-prayer-assigned-to-god: {label: "A 'hand-lifting' prayer (šuilla) is assigned by its incipit to a deity in the ritual programme", cluster: cult}
  name-of-dead-called-at-burial: {label: "At the burial the name of the dead is called out", cluster: death}
  dead-declared-released-before-sun-god: {label: "Kneeling before the sun god, mourners declare the dead woman 'girded and released' and ask blessing for the king and his seed", cluster: death}
  gods-named-at-sun-and-moon-sacrifices: {label: "Particular gods are named when sacrifices are made before the sun god, the moon god or at the stables", cluster: cult}
  king-establishes-rite-for-deity: {label: "A named king establishes and gives a rite to his deity", cluster: kingship}
  fat-and-roast-portions-offered: {label: "Fatty tissue (himṣu) and roast portions are presented before each deity", cluster: cult}
  sun-god-opener-of-darkness: {label: "A hymn to the sun god as 'opener of darkness' who treads down the wicked is sung", cluster: cult}
  brazier-tended-in-winter-month: {label: "In the cold month palace servants watch the brazier, put back fallen embers and add or remove fire and wood", cluster: kingship}
  dishes-of-the-royal-table: {label: "The dishes of the royal meal are listed: meats, fowl, turtledoves, jerboas", cluster: kingship}
  king-feasts-after-ritual-victory: {label: "After the ritual conquest the king enters his camp, a meal is set and the king rejoices", cluster: war}
  king-carried-in-sedan-chair: {label: "The king is carried in a sedan chair (ša-šadādi) during the rite", cluster: kingship}
units:
  - id: ane-saa20-042-o-gods-bidden-drink
    tradition: ane-akkadian
    title: Tākultu of Aššur-etel-ilani, obverse - the gods, temple and its parts bidden to drink
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    read: ["SAA 20 042 o.i", "SAA 20 042 o.ii"]
    tags:
      - {motif: gods-bidden-drink-by-name, refs: ["SAA 20 042 o.i:1-6"], note: "aššur šiti enlil šiti anu šiti ... ištar šitî ilāni rabûti: imperative 'drink!' after each god"}
      - {motif: cult-objects-invoked-as-gods, refs: ["SAA 20 042 o.i:21-22", "SAA 20 042 o.i:24", "SAA 20 042 o.i:35-37", "SAA 20 042 o.ii:39-41"], note: "{d}daltu naklu (the 'skilful door', deified), gold, silver, bronze doors; Maṣṣar-kussê; the four gates; city gates and braziers (abullu/kinūnu of Aššur, Šamaš, Ištar)"}
      - {motif: banquet-litany-invokes-temple-and-cosmos, refs: ["SAA 20 042 o.i:31-37", "SAA 20 042 o.ii:38-44"], note: "Papahu, treasure house, courtyards of the Apsû, of Mullissu, of the leopard 'and everything named'; city wall and outer wall of Assur, gates of people and flocks"}
      - {motif: igigi-and-anunnaki-invoked-together, refs: ["SAA 20 042 o.i:7-8"], note: "Igigi, Anunnaki, Ereškigal and the gods of the earth"}
      - {motif: monster-guardians-at-temple-gates, refs: ["SAA 20 042 o.i:24", "SAA 20 042 o.i:28-29"], note: "Anzû, Kusarikku (bison-man), Lahmu of the sunrise gate, invoked among the gods"}
      - {motif: deified-truth-and-justice, refs: ["SAA 20 042 o.i:25"], note: "{d}kittu {d}mešaru"}
      - {motif: statues-of-kings-among-gods-at-meal, refs: ["SAA 20 042 o.i:19-20", "SAA 20 042 o.i:23"], note: "ṣalmāni ša malkī u rubê, ṣalmāni ša hupšê: statues of kings and princes and of commoners; Il-pada and the 'deposed gods' (ilāni darsūte)"}
    hints:
      - "Compare Deut 32:37-38 (gods 'who ate the fat of their sacrifices and drank the wine of their libations') and Ps 50:12-13 (God does not eat bull's flesh or drink goats' blood)."
      - "The summons of heaven, earth, gates and creation compares with Ps 148 and Ps 24:7-9 (gates addressed)."
  - id: ane-saa20-042-r-blessings-for-king
    tradition: ane-akkadian
    title: Tākultu of Aššur-etel-ilani, reverse - land, rivers, cosmos invoked; blessings for the king who gave the meal
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    read: ["SAA 20 042 r.iii", "SAA 20 042 r.iv"]
    tags:
      - {motif: banquet-litany-invokes-temple-and-cosmos, refs: ["SAA 20 042 r.iii:3'-5'", "SAA 20 042 r.iii:11'-33'"], note: "Mount Ebih, Tigris, Upper and Lower Zab, villages, borders, the land's walls, daises, forts, ruin mounds, mountains and springs, the upper and lower sea, the wide earth, the paths of Anu, Enlil and Ea, stars, the four winds, day and night watches, day, month and year, gods and goddesses of land and city, heaven and earth"}
      - {motif: cult-objects-invoked-as-gods, refs: ["SAA 20 042 r.iii:14'-15'"], note: "{d}pû-lišānu, {d}nēmedu, {d}parakku: mouth-and-tongue, the 'support', the dais, deified"}
      - {motif: gods-asked-to-bless-king-who-gave-meal, refs: ["SAA 20 042 r.iii:48'-r.iv:11'"], note: "ūmē arkūti šanāti dārâti kakku dannu palû arku ... ana Aššur-etel-ilani dinānišu ša tākulta šiāti ēpušu"}
      - {motif: king-blessed-with-long-life-and-roots, refs: ["SAA 20 042 r.iv:1'-3'", "SAA 20 042 r.iv:12'-15'"], note: "palû arku, šanāt ṭuhdi, perʾu zēru: long reign, years of plenty, offshoot and seed; 'may he live, be well, exercise priesthood and kingship, reach old age'"}
      - {motif: blessing-on-sharers-of-sacred-meal, refs: ["SAA 20 042 r.iv:16'-22'"], note: "ana multāmi annûti šeʾu kaspu šamnu šīpātu ṭābtu ša Bariki ana akālišunu u qirīru ana nūrišunu libši"}
      - {motif: king-blessed-with-priesthood-and-kingship, refs: ["SAA 20 042 r.iv:13'"], note: "šangûta šarrūta kiššūta lēpuš: priesthood listed before kingship"}
    hints:
      - "Compare Ps 21:5 and 61:7-8 (length of days for the king), Ps 72:15-17 (prayer and blessing for the king, abundance), 1 Kgs 3:14."
      - "The blessing on all who share the meal compares with 1 Kgs 8:62-66 (Solomon's feast; the people go home joyful) and Deut 12:7, 14:26."
  - id: ane-saa20-015-o-akitu-and-spring
    tradition: ane-akkadian
    title: Royal ritual - entry to the akītu-house, blood offered into the spring, offerings before the gods of heaven and earth
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    read: ["SAA 20 015 o.i", "SAA 20 015 o.ii"]
    tags:
      - {motif: king-goes-to-akitu-house, refs: ["SAA 20 015 o.i:1'-2'", "SAA 20 015 o.i:14'-15'"], note: "ana bīt akīte errubu ... šarru ištu libbi īni ana bīt akīte erab"}
      - {motif: divine-images-placed-on-kings-neck, refs: ["SAA 20 015 o.i:3'"], note: "ilāni ša kišād šarri: the gods of the king's neck"}
      - {motif: cult-performer-shouts-before-goddess, refs: ["SAA 20 015 o.i:6'-7'"], note: "assinnu kakkī inašši ina pūt Ištar ebirna ebirna išassi; the cry 'ebirna' is of unknown meaning"}
      - {motif: blood-and-offerings-into-spring, refs: ["SAA 20 015 o.i:8'-12'"], note: "nīqu inassah dāmē ina libbi īni ušamhar; nūnu alluttu ina libbi īni ikarrar; šamnu dišpu karānu ... itabbak"}
      - {motif: purifier-passed-over-table-and-censers, refs: ["SAA 20 015 o.i:13'", "SAA 20 015 o.ii:15'"], note: "ša-tēlissi ušetaq"}
      - {motif: kissing-idol, refs: ["SAA 20 015 o.i:16'", "SAA 20 015 o.i:50'"], note: "šēpē inaššiq"}
      - {motif: salt-strewn-before-god, refs: ["SAA 20 015 o.i:17'"]}
      - {motif: king-officiates-sacrifice-in-temple, refs: ["SAA 20 015 o.i:16'-21'", "SAA 20 015 o.i:44'"], note: "the king sets the table, strews salt, slaughters sheep before the gods of heaven and of earth, presents boiled meat"}
      - {motif: roasted-kid-before-gods, refs: ["SAA 20 015 o.i:46'", "SAA 20 015 o.ii:2'", "SAA 20 015 o.ii:9'", "SAA 20 015 o.ii:44'"]}
      - {motif: libations-of-beer-and-wine, refs: ["SAA 20 015 o.ii:12'-14'"], note: "kukkubu of water, mihhu-beer, beer, wine, milk and blood poured 'on the heads'"}
      - {motif: hand-water-for-king-before-offering, refs: ["SAA 20 015 o.i:43'"], note: "qātēšu imassi"}
      - {motif: king-officiates-sacrifice-in-temple, refs: ["SAA 20 015 o.i:48'-53'"], note: "the king descends from the chariot to the storehouse, takes the gods' hands, brings them in and seats them, slaughters before the king's statue and in the Adad temple"}
      - {motif: hymn-incipits-sung-at-each-offering, refs: ["SAA 20 015 o.ii:51'"], note: "nāru ana Amurrīte izammur"}
    hints:
      - "The festival in Nisan with the king officiating compares with Num 28:16-25 and 2 Chr 30, 35 (king-led Passover); the akītu procession with Ps 24 and Ps 68:25-28."
      - "Blood offered into a spring: contrast Lev 17:13 and Deut 12:16 (blood poured on the ground); compare 1 Kgs 1:9, 38-39 (ritual at the spring Gihon and En-rogel)."
  - id: ane-saa20-015-r-recitations
    tradition: ane-akkadian
    title: Royal ritual - what the officiant says at each libation, salt-offering and kiss in the gods' cities
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    read: ["SAA 20 015 r.i", "SAA 20 015 r.ii"]
    tags:
      - {motif: ritual-act-with-prescribed-formula, refs: ["SAA 20 015 r.i:1'-6'", "SAA 20 015 r.ii:12-14"], note: "kī karāna ina šēhti ana šaqikkani ... taqabbi: 'when you give wine to drink in the censer ... you say'"}
      - {motif: life-accept-hear-formula, refs: ["SAA 20 015 r.i:2'-4'", "SAA 20 015 r.i:7'-9'"], note: "Nusku sukkal ilāni balāṭ ana Bēl; Bēl balāṭ muhur; Igigi ... Anunnaki ... limhurū lišmû"}
      - {motif: gods-named-at-morning-and-evening-offering, refs: ["SAA 20 015 r.i:15'-18'"], note: "mimma annû ša apal bēt-ili ša Ninua ina šērti nubatti šumēšunu tazakkar"}
      - {motif: gods-asked-to-bless-each-other, refs: ["SAA 20 015 r.ii:1-6"], note: "Aššur Mullissu kurub; Mullissu Aššur likrubki; Sin Nikkal kurbu"}
      - {motif: salt-strewn-before-god, refs: ["SAA 20 015 r.ii:12-34", "SAA 20 015 r.ii:42-43"]}
      - {motif: litany-of-gods-and-their-cities, refs: ["SAA 20 015 r.ii:12-34"], note: "Kilizi-Adad, Arbela-Ištar, Kalhu-Ninurta, Tarbiṣu-Nergal, Kurbail, Tuʾe, Urakka, Harran-Sin"}
      - {motif: heaven-and-apsu-bless-worshipper, refs: ["SAA 20 015 r.ii:39-40"], note: "kī šēpē ša ili ana našāqikani šamû apsû likrubūka"}
      - {motif: kissing-idol, refs: ["SAA 20 015 r.ii:39"]}
      - {motif: igigi-and-anunnaki-invoked-together, refs: ["SAA 20 015 r.ii:44-46"]}
