  - id: ane-ktu-1-1-iv-el-names-yamm
    tradition: ane-ugaritic
    title: "Baal Cycle 1.1 IV: El proclaims the name of his son Yamm, 'beloved of El', promises a house of silver and orders him to drive Baal from his throne; El's feast"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Ugaritic"
    version: "KTU 1.1 (Baal Cycle tablet 1), fragmentary"
    read: ["KTU 1.1 IV"]
    tags:
      - {motif: divine-council, refs: ["KTU 1.1 IV:2-6"], note: "Fragmentary: El calls to the distant gods (lrḥqm) and takes his seat; ṣpn at IV:1 uncertain"}
      - {motif: high-god-names-favoured-son, refs: ["KTU 1.1 IV:14-20"], note: "šm bny yw ilt ... wpʿr šm ym[m]; ʿl ydm pʿrt šmk mdd i[l]: 'the name of my son is Yw ... he proclaimed the name of Yamm ... I have proclaimed your name, beloved of El'"}
      - {motif: high-god-orders-rival-driven-from-throne, refs: ["KTU 1.1 IV:21-27"], note: "btkspy ... bd aliyn b[ʿl] kd ynaṣn gršnn lk[si mlkh] ... ymḫṣk: 'drive him from the throne of his kingship ... or he will strike you'"}
      - {motif: gods-feast-slaughtered-cattle-sheep-fatlings, refs: ["KTU 1.1 IV:28-32"], note: "il dbḥ ... ṭbḫ alp[m] ... ṯrm ... imr: El slaughters a feast"}
