  - id: ane-ktu-1-2-i-yamm-embassy
    tradition: ane-ugaritic
    title: "Baal Cycle 1.2 I: Baal curses Yamm; Yamm's envoys come to the assembly on Mount Ll; the gods bow their heads; 'Give up Baal!'; El makes Baal Yamm's slave; Anat and Athtart restrain Baal"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Ugaritic"
    version: "KTU 1.2 (Baal Cycle tablet 2)"
    read: ["KTU 1.2 I"]
    tags:
      - {motif: curse-sceptre-broken-kingship-overthrown, refs: ["KTU 1.2 I:5-9"], note: "drktk mšl ... yṯbr ḥrn ym yṯbr ḥrn rišk ʿṯtrt šm bʿl qdqdk ... tqln bgbl šntk: 'may Horon break, O Yamm, may Horon break your head, Athtart-name-of-Baal your skull; may you fall in the prime of your years' (partly restored)"}
      - {motif: divine-council, refs: ["KTU 1.2 I:14-17", "KTU 1.2 I:20-21"], note: "pḫr mʿd tk ġr ll: 'the full assembly on Mount Ll'; ilm ... bn qdš 'the sons of the Holy One' sit to eat"}
      - {motif: assembly-of-holy-ones, refs: ["KTU 1.2 I:21", "KTU 1.2 I:38"], note: "bn qdš 'sons of the Holy One (Qudšu)' as the assembled gods"}
      - {motif: sea-demands-storm-god-be-surrendered, refs: ["KTU 1.2 I:11", "KTU 1.2 I:17-19", "KTU 1.2 I:33-35"], note: "tḥm ym bʿlkm adnkm ṯpṭ nhr tn ilm dtqh ... tn bʿl wʿnnh bn dgn arṯm pḏh: 'Give up the god whom you protect, give up Baal and his lackeys, the son of Dagan, I will possess his gold'"}
      - {motif: gods-lower-heads-in-fear, refs: ["KTU 1.2 I:22-29"], note: "ġltm ilm rišt km lẓr brktkm ... šu ilm raštkm: 'why, gods, have you lowered your heads to your knees? lift up your heads!'"}
      - {motif: fiery-messengers-tongue-like-sword, refs: ["KTU 1.2 I:32-33"], note: "išt ištm yitmr ḥrb lṭšt [lš]nhm: 'a fire, two fires they appear, a sharpened sword their tongue'"}
      - {motif: winds-as-angels-fire-as-ministers, refs: ["KTU 1.2 I:32-33"], note: "The envoys appear as fire; the image of fiery divine messengers"}
      - {motif: high-god-surrenders-son-as-slave, refs: ["KTU 1.2 I:36-38"], note: "ʿbdk bʿl yymm ʿbdk bʿl [nhr]m bn dgn asrkm hw ybl argmnk kilm: 'Baal is your slave, O Yamm, ... your prisoner; he shall bring your tribute like the gods'"}
      - {motif: goddesses-restrain-angry-god, refs: ["KTU 1.2 I:38-41"], note: "anš zbl bʿl yuḫd byd mšḫṭ ... [ymnh ʿ]nt tuḫd šmalh tuḫd ʿṯtrt: Anat seizes his right, Athtart his left"}
      - {motif: messenger-not-to-be-harmed, refs: ["KTU 1.2 I:40-42"], note: "ik mḫ[ṣt mlak ym t]ʿdt ṯpṭ nhr: 'how could you strike the envoys of Yamm?' -- inviolability of messengers"}
      - {motif: prostration-before-deity, refs: ["KTU 1.2 I:14-15", "KTU 1.2 I:30-31"], note: "Inverted: the envoys are told al tpl al tštḥwy pḫr mʿd 'do not fall down, do not bow before the assembly', and they do not"}
    hints:
      - "The sea's arrogant demand and its 'rivers' compare Ps 93:3-4 (the rivers have lifted up their voice) and Ps 89:10."
      - "Gods with heads bowed in a council compare 1 Kgs 22:19 and Ps 82:1, Ps 89:6-8 (the council of the holy ones)."
      - "Messengers as flaming fire compare Ps 104:4; a tongue like a sharp sword compare Ps 57:5, Ps 64:4, Isa 49:2."
      - "Inviolability of envoys compare 2 Sam 10:1-5 (Hanun's insult to David's envoys)."

