# Full read of the ANE corpus, chunk 39: Ugarit RS 94.2478 ... SMEA 42 (ORACC aemw/ugarit, lemmatized, word glosses only),
# then the Baal Cycle and related mythological texts from EUPT (KTU 1.1-1.13: consonantal text, German translation per colon).
# One unit per letter; the poetic tablets are divided by column and episode.
new_motifs:
  # --- letters ---
  letter-wish-good-old-age-forever: {label: "Letter greeting: may the gods sate the addressee with good old age from now to eternity (šībūta damiqta lišbûka ištu inanna adi dārīti)", cluster: letters}
  omen-for-ship-captain-not-good: {label: "Extispicy is performed for a ship's captain before a voyage and the omen is 'not good'", cluster: divination}
  overlord-threatens-combat-of-the-sun: {label: "The Hittite overlord's letter warns the vassal: 'know that the combat of the Sun (the Great King) will reach you'", cluster: treaty}
  messengers-denied-bread-and-beer: {label: "A king protests that his messengers were not given bread and beer in the other king's land, though he never withheld them from the other's messengers", cluster: letters}
  heart-very-dark-at-friends-neglect: {label: "A letter writer complains that the addressee sent him back empty and 'my heart is very dark' (ina libbiya ekil danniš): 'you are not good'", cluster: letters}
  land-kept-alive-by-neighbours-provisions: {label: "A letter asks for provisions 'and keep me alive', recalling that the land was formerly kept alive by a neighbour's supplies and promising plenty after the next harvest", cluster: trade}
  ships-from-canaan-bring-provisions: {label: "Ships coming down from Canaan (Kinani) are to bring provisions (mānaḫtu) to Ugarit", cluster: trade}
  thief-fled-abroad-extradition-requested: {label: "A man who stole from an official's house fled through the addressee's land on to another country; the king asks his 'brother' to seize the man and hand him over", cluster: law}
  unpaid-price-claimed-by-letter: {label: "A king writes that a merchant took goods (great doors, wine, garments) from a named house and has not paid; let him pay the price", cluster: trade}
  servant-sent-with-witnesses-for-judgement: {label: "A king sends a servant together with his witnesses to another king so that he may judge their case", cluster: law}
  ruler-called-eternal-king: {label: "A king (the pharaoh) is called 'eternal king' (Ugaritic mlk ʿlm), or the sun deity 'Šapšu of eternity'", cluster: kingship}
  gods-of-cyprus-invoked-in-letter: {label: "A letter invokes Baal of Ṣapan, the eternal Sun, ʿAṯtart, ʿAnat and 'all the gods of Alašiya (Cyprus)' for the addressee", cluster: letters}
  garments-issued-to-temple-singers: {label: "A palace list issues garments, wool and linen to named persons, including the singers (šr) of the goddess ʿAṯtart", cluster: cult}
  captives-returned-half-and-half-by-oath: {label: "Men seized by Sutean raiders are returned under oath, half to one king and half to the other, and their fault is said to be another's", cluster: treaty}
  # --- Baal cycle and related ---
  hasten-to-me-summons: {label: "Divine summons: 'hasten, hurry, rush! let your feet run to me, your legs hasten to me', for a word the speaker will reveal", cluster: myth}
  bull-el-father-epithets: {label: "The high god El is 'the Bull, your father', 'the Kindly, the Compassionate (lṭpn il dpid)', 'Creator of creatures', 'father of years'", cluster: theology}
  put-war-from-earth-pour-peace: {label: "Command to a war goddess: 'remove war from the earth, set love in the dust, pour peace into the heart of the earth'", cluster: myth}
  word-of-tree-whisper-of-stone: {label: "A god's secret: 'the word of the tree and the whisper of the stone, the sighing of heaven to earth, of the deeps to the stars', a word humans do not understand", cluster: cosmology}
  craftsman-god-from-caphtor-and-memphis: {label: "The craftsman god (Kothar-and-Hasis) has his throne in Caphtor (Crete) and his inheritance in Memphis (Ḥikuptah)", cluster: myth}
  el-dwells-at-source-of-two-rivers: {label: "The high god's tent stands at the source of the two rivers, in the midst of the springs of the two deeps (mbk nhrm qrb apq thmtm)", cluster: cosmology}
  thousand-fields-ten-thousand-furlongs: {label: "Travel formula: a god crosses a thousand fields, ten thousand furlongs (alp šd rbt kmn) to reach another god", cluster: myth}
  high-god-names-favoured-son: {label: "The high god proclaims a name for his favoured son and declares him king or 'beloved of El'", cluster: kingship}
  high-god-orders-rival-driven-from-throne: {label: "The high god orders one son to drive his rival from the throne of his kingship, warning that otherwise the rival will strike him down", cluster: kingship}
  gods-feast-slaughtered-cattle-sheep-fatlings: {label: "A divine feast: oxen and sheep, bulls, fatlings, yearling calves and lambs are slaughtered and the gods eat and drink wine from gold cups ('blood of trees')", cluster: cult}
  sea-demands-storm-god-be-surrendered: {label: "The Sea (Yamm, Judge River) sends messengers to the divine assembly demanding that the storm god be handed over as his slave", cluster: myth}
  gods-lower-heads-in-fear: {label: "At the approach of the enemy's envoys the assembled gods lower their heads to their knees; the storm god rebukes them: 'lift up your heads!'", cluster: myth}
  fiery-messengers-tongue-like-sword: {label: "Divine messengers appear as a blazing fire, their tongue a sharpened sword", cluster: myth}
  high-god-surrenders-son-as-slave: {label: "The high god yields to the threat and declares the storm god the enemy's slave and tribute-bearer", cluster: myth}
  goddesses-restrain-angry-god: {label: "Two goddesses seize the angry god's right and left hands to stop him striking the envoys", cluster: myth}
  palace-built-for-sea: {label: "The craftsman god is ordered to build a house and palace for Prince Sea, Judge River", cluster: myth}
  god-has-no-house-like-the-gods: {label: "Lament: 'the storm god (or Athtar) has no house like the gods, no court like the sons of Athirat'", cluster: temple}
  throne-pillars-uprooted-sceptre-broken: {label: "Warning: El will tear up the pillars of your throne, overturn the seat of your kingship and break the sceptre of your rule", cluster: kingship}
  craftsman-names-twin-clubs: {label: "The craftsman god makes two clubs and names them ('Driver', 'Expeller'); each leaps from the storm god's hand like an eagle to strike Sea", cluster: myth}
  storm-god-defeats-sea: {label: "The storm god strikes Sea (Yamm, Judge River) on the skull between the eyes; Sea collapses to the earth and is destroyed", cluster: myth}
  take-eternal-kingship: {label: "After victory over the enemy the god is told: 'take your eternal kingship, your everlasting dominion'", cluster: kingship}
  sea-is-dead-baal-shall-reign: {label: "Acclamation after the combat: 'Sea is dead! Baal shall be king!'", cluster: kingship}
  cup-women-may-not-see: {label: "A holy cup of the god that no woman may see, a goblet even the queen-goddess may not look on", cluster: cult}
  divine-singer-sings-on-mountain: {label: "A sweet-voiced youth with cymbals sings of the storm god on the heights of his mountain", cluster: cult}
  storm-gods-daughters-dew-light-earth: {label: "The storm god's daughters (or brides) are Pidray daughter of light, Tallay daughter of showers (dew), Arṣay daughter of the wide earth", cluster: myth}
  goddess-massacres-in-valley: {label: "The warrior goddess slaughters armies in the valley between two cities, the people of the seashore and of the sunrise", cluster: myth}
  heads-and-hands-as-goddess-ornaments: {label: "Severed heads fly under the goddess like balls and hands over her like locusts; she ties heads to her back and hands to her belt", cluster: myth}
  goddess-wades-knee-deep-in-blood: {label: "The goddess plunges her knees in the blood of soldiers, her thighs in the gore of warriors", cluster: myth}
  goddess-rejoices-in-slaughter: {label: "The goddess's liver swells with laughter, her heart fills with joy at the slaughter", cluster: myth}
  goddess-battles-tables-and-chairs: {label: "Not yet sated, the goddess sets chairs and tables as warriors in her house and fights among them", cluster: myth}
  goddess-washes-hands-of-blood: {label: "After battle the goddess washes the blood of warriors from her hands and fingers", cluster: myth}
  god-boasts-monsters-slain: {label: "A deity boasts of the monsters already destroyed: Sea beloved of El, River the great god, the dragon (tnn) muzzled, the twisting serpent, Šalyaṭ of seven heads, Arš, the calf ʿAtik, the bitch Fire, Ḏabib", cluster: myth}
  dragon-tunnanu-muzzled: {label: "The dragon (Tunnanu, Hebrew tannin) is muzzled (ištbm) and destroyed", cluster: myth}
  goddess-trembles-at-messengers-approach: {label: "On seeing messengers arrive the goddess's feet shake, her loins break, her face sweats: 'what enemy has risen against Baal?'", cluster: myth}
  holy-mountain-of-my-inheritance: {label: "The storm god's mountain Ṣapān is 'my holy place, the mountain of my inheritance, the pleasant place, the hill of victory'", cluster: temple}
  goddess-threatens-el-grey-beard-blood: {label: "The goddess threatens the high god that she will make his grey hair and the grey hair of his beard run with blood unless he grants her demand", cluster: myth}
  el-answers-from-seven-chambers: {label: "The high god answers from within his seven chambers, his eight enclosures", cluster: myth}
  el-wise-forever: {label: "Praise of the high god: 'your word is wise, your wisdom is for eternity; a life of fortune is your word'", cluster: wisdom}
  our-king-none-above-him: {label: "Acclamation: 'our king is Baal, our judge, there is none above him; let us all bring his chalice, his cup'", cluster: kingship}
  sun-glows-heavens-weak-in-deaths-hand: {label: "Refrain: the Lamp of the gods, the Sun, glows hot; the heavens are weak in the hand of Mot (Death)", cluster: underworld}
  sea-and-mountains-wrapped-in-darkness: {label: "The storm god's servants see the sea wrapped in gloom and the highest mountains in darkness", cluster: cosmology}
  craftsman-casts-gifts-silver-gold: {label: "The craftsman god works the bellows and casts silver by thousands and gold by ten-thousands into divine furniture: canopy, couch, throne, footstool, table, bowl", cluster: temple}
  divine-table-of-all-animals: {label: "A divine table filled with all the animals of the foundations of the earth, and a bowl with wild bulls by the ten-thousand", cluster: temple}
  mother-goddess-spinning-by-sea: {label: "The mother goddess sits by the sea with her spindle, washing her garment in the sea and setting a pot on the fire", cluster: myth}
  goddess-won-by-gleam-of-gifts: {label: "The goddess, fearful at the visitors' coming, rejoices when she sees the gleam of silver and gold", cluster: myth}
  god-insulted-in-assembly: {label: "A god complains that one stood up and mocked him, spat on him in the assembly of the sons of El, and set filth on his table", cluster: myth}
  god-hates-feasts-of-shame-and-lewdness: {label: "Baal hates two feasts, three the Rider of the Clouds: the feast of shame, the feast of strife (or harlotry) and the feast where handmaids act lewdly", cluster: cult}
  gift-to-goddess-before-request: {label: "Petitioners bring gifts to the queen-goddess so she will intercede with the high god", cluster: myth}
  goddess-rides-saddled-donkey: {label: "A servant harnesses a donkey with silver and gold trappings and sets the goddess on its back; one leads, another goes ahead like a star", cluster: myth}
  el-laughs-feet-on-footstool: {label: "Seeing the visitor, the high god unfurrows his brow and laughs, puts his feet on the footstool and twiddles his fingers", cluster: myth}
  el-offers-food-and-love: {label: "The high god asks the arriving goddess if she is hungry or thirsty, offers bread and wine, or asks if 'the hand of El the king' (his love) stirs her", cluster: myth}
  am-i-a-slave-to-mould-bricks: {label: "The high god retorts: 'am I a slave, is Athirat a handmaid, to mould bricks? Let him build the house himself'", cluster: temple}
  grey-beard-instructs-high-god: {label: "The goddess praises the high god: 'you are great, you are wise; the grey hair of your beard instructs you'", cluster: wisdom}
  storm-gods-season-of-rain-and-thunder: {label: "With a house the storm god will give the season of his rain, of snow, his voice in the clouds and his lightning flashes to the earth", cluster: myth}
  caravan-brings-silver-gold-lapis: {label: "A caravan brings silver from the mountains, gold from the hills and gems to build a house of silver, gold and pure lapis lazuli", cluster: temple}
  good-news-a-house-is-given: {label: "A goddess brings good news (bšr): 'rejoice, a house is given you like your brothers'", cluster: myth}
  craftsman-seated-at-right-hand: {label: "The craftsman guest is given a throne at the right hand of the storm god and the gods eat and drink", cluster: myth}
  window-in-the-palace-dispute: {label: "The craftsman asks twice whether to put a window in the palace; the god refuses ('lest Yamm...'), then later orders it opened", cluster: temple}
  cedars-of-lebanon-and-sirion-for-palace: {label: "The builders go to Lebanon and its trees, to Sirion and its choice cedars, for the god's palace", cluster: temple}
  fire-burns-in-palace-seven-days: {label: "Fire burns in the house for six days; on the seventh it dies down and the silver has turned to plates and the gold to bricks", cluster: temple}
  palace-feast-for-seventy-sons: {label: "The god celebrates his finished house with a feast for his brothers, the seventy sons of Athirat: rams, ewes, oxen, thrones and jars of wine for gods and goddesses", cluster: temple}
  storm-god-captures-cities: {label: "The storm god goes from city to city and seizes sixty-six cities, seventy-seven towns", cluster: myth}
  window-opened-rift-in-clouds: {label: "The palace window is opened as a rift in the clouds, through which the god gives his holy voice", cluster: cosmology}
  enemies-flee-to-forests: {label: "At the storm god's voice his enemies grasp the forests, his foes the flanks of the mountain", cluster: myth}
  god-sole-ruler-who-fattens-gods-and-men: {label: "The god declares: 'I alone rule over the gods, I fatten gods and men, I satisfy the multitudes of the earth'", cluster: kingship}
  king-or-no-king-over-earth: {label: "The god challenges: 'shall any king or non-king establish dominion over the earth?'", cluster: kingship}
  messengers-to-death-lift-mountains: {label: "Messengers to the underworld must go to the two mountains at earth's edge, lift the mountain on their hands, and go down into the 'house of freedom'", cluster: underworld}
  death-city-pit-throne-mire-land: {label: "Mot's city is Hamray (Miry); a pit is his throne, filth (ḫḫ) the land of his inheritance", cluster: underworld}
  death-puts-victims-in-mouth-like-lamb: {label: "Warning: do not come near Mot lest he put you in his mouth like a lamb, crush you like a kid in his jaws", cluster: underworld}
  scribe-colophon-names-author: {label: "A colophon names the scribe (Ilimilku of Šubbanu), his teacher the chief priest and diviner, and the reigning king (Niqmaddu of Ugarit)", cluster: scribal}
  mot-appetite-like-lion-and-sea-monster: {label: "Death's appetite is that of the lion of the steppe and the whale in the sea, a pool that wild bulls seek; his cup is mixed with a whole river", cluster: underworld}
  death-not-invited-to-feast: {label: "Death complains that the storm god did not invite him to eat bread and drink wine with his brothers", cluster: underworld}
  death-lip-to-earth-lip-to-heaven: {label: "Death opens his jaws, one lip to the earth, one to the heavens, his tongue to the stars", cluster: underworld}
  storm-god-fears-death: {label: "The mighty storm god is afraid of Mot and sends word: 'I am your slave for ever'", cluster: underworld}
  storm-god-descends-with-clouds-and-rain: {label: "The storm god is told to take his clouds, wind, rain, his seven lads and eight boars and his daughters, and go down into the earth", cluster: underworld}
  counted-among-those-who-descend: {label: "Instruction: 'be counted among those who go down into the earth', so that the gods will know he is dead", cluster: underworld}
  storm-god-mates-heifer-before-descent: {label: "The storm god loves a heifer in the field at 'the shore of death', lies with her seventy-seven, eighty-eight times, and she bears a son", cluster: myth}
  baal-is-dead-what-of-the-peoples: {label: "Lament: 'Baal is dead! What of the peoples? The son of Dagan! What of the multitudes? After Baal I will go down into the earth'", cluster: underworld}
  high-god-mourns-on-ground: {label: "The high god comes down from his throne to the footstool and from the footstool to the ground, pours ashes and dust on his head", cluster: underworld}
  mourner-ploughs-chest-like-garden: {label: "The mourner gashes cheeks and chin, scores his arms, ploughs his chest like a garden and his back like a valley", cluster: underworld}
  goddess-drinks-tears-like-wine: {label: "The mourning goddess weeps until sated, drinks her tears like wine", cluster: underworld}
  sun-goddess-helps-carry-dead-god: {label: "The Sun goddess lifts the dead god onto the goddess's shoulders, who carries him up to his mountain, weeps and buries him", cluster: underworld}
  seventy-of-each-animal-funeral-sacrifice: {label: "At the god's burial seventy wild bulls, seventy oxen, seventy sheep, seventy deer, seventy ibex and seventy roebucks are slaughtered", cluster: cult}
  substitute-king-too-small-for-throne: {label: "A god set on the dead king's throne cannot reach the footstool with his feet nor the top with his head, and steps down", cluster: kingship}
  goddess-seeks-god-like-cow-for-calf: {label: "As the heart of a cow for her calf, the heart of a ewe for her lamb, so is the goddess's heart for the missing god", cluster: myth}
  goddess-seizes-death-by-garment: {label: "The goddess seizes Death by the hem of his garment and demands: 'give me my brother!'", cluster: underworld}
  death-split-winnowed-burned-ground-sown: {label: "The goddess splits Death with a blade, winnows him with a sieve, burns him with fire, grinds him with millstones and sows him in the field; the birds eat his flesh", cluster: myth}
  dream-heavens-rain-oil-wadis-honey: {label: "In the high god's dream the heavens rain oil and the wadis run with honey, a sign that the storm god lives", cluster: myth}
  furrows-of-fields-parched: {label: "The furrows of the fields are parched; 'where is mighty Baal, where is the prince, lord of the earth?'", cluster: myth}
  god-returns-in-seventh-year: {label: "After days, months and years, in the seventh year the defeated adversary returns", cluster: myth}
  death-gods-litany-of-suffering: {label: "Death recites what he suffered for Baal's sake: shame, winnowing, burning, grinding, sifting, scorching in the fields, sowing in the sea", cluster: myth}
  gods-fight-like-wild-bulls-and-serpents: {label: "Two gods butt like wild bulls, bite like serpents, kick like stallions; both fall, 'Mot is strong, Baal is strong'", cluster: myth}
  sun-rules-the-rephaim: {label: "Hymn: the Sun rules over the Rephaim, over the divine dead; the dead gods are with her", cluster: underworld}
  monsters-in-sea-driven-off: {label: "In the sea are Arš and the dragon (tnn); let the craftsman god drive them away", cluster: myth}
  assembly-of-the-stars: {label: "The gods are called 'the assembly of the stars' (pḫr kkbm)", cluster: cosmology}
  storm-god-hunts-with-bow: {label: "The storm god takes his bow in his hand and arrows in his right and goes to the marsh full of wild bulls", cluster: myth}
  winged-goddess-flies: {label: "The goddess lifts her wings and soars in flight", cluster: myth}
  god-bows-to-goddess-wishes-long-life: {label: "The storm god kneels before his sister and greets her: 'may your life be long'", cluster: myth}
  goddess-horns-anointed: {label: "Baal will anoint the horns of the goddess's strength in flight", cluster: myth}
  cow-bears-wild-bull-to-storm-god: {label: "A cow gives birth to a bull and a wild ox for the storm god; the goddess brings the good news to his mountain", cluster: myth}
  newborn-calf-covered-with-udder: {label: "The cow embraces her newborn and covers him with her udder", cluster: myth}
  god-and-goddess-sexual-union: {label: "Storm god and goddess grow hot and seize each other's genitals; she conceives and bears", cluster: myth}
  handmaids-bear-devourers: {label: "The high god sends handmaids into the wilderness to crouch and bear 'the Devourers' and 'the Renders', horned like bulls with Baal's face", cluster: myth}
  el-laughs-in-his-heart: {label: "The high god laughs in his heart, convulses in his liver", cluster: myth}
  storm-god-fallen-like-bull: {label: "The storm god falls like a bull, sinks like an ox in the marsh, clothed in the blood of his brothers", cluster: myth}
  seven-years-eight-cycles-of-drought: {label: "Seven years El fills, eight cycles of time, while the produce of the fields is scorched", cluster: myth}
  city-life-stops-at-gods-fall: {label: "At the god's fall the king ceases to judge, the women drawing water leave the spring, the noise in El's house and the clatter of the craftsman's house cease", cluster: myth}
  goddess-promised-seat-on-high-heavens: {label: "Incantation-hymn: the goddess is promised a seat on the roof of the high heavens, where the stars fall like bricks", cluster: myth}
units:
  - id: ane-ugarit-rs-94-2478-beirut-servant-judged
    tradition: ane-akkadian
    title: "The king of Beirut to the king of Ugarit, his brother: silver of Yadlunu; he sends his servant with his witnesses for judgement (RS 94.2478)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    version: "Letter between kings, Ugarit"
    read: ["Ugarit RS 94.2478"]
    tags:
      - {motif: letter-opening-say-to-my-lord, refs: ["Ugarit RS 94.2478 o:1-3"], note: "umma šar māt Biʾrūti ana šar māt Ugarit aḫīya qibīma: king to king as 'my brother'"}
      - {motif: letter-greeting-gods-guard-you, refs: ["Ugarit RS 94.2478 o:4-6"]}
      - {motif: kings-call-each-other-brothers-sons-of-one-man, refs: ["Ugarit RS 94.2478 o:3", "Ugarit RS 94.2478 o:7-8"], note: "anumma ittiya šulmu ašrānu itti aḫīya: the brother formula without 'sons of one man'"}
      - {motif: servant-sent-with-witnesses-for-judgement, refs: ["Ugarit RS 94.2478 r:6-13", "Ugarit RS 94.2478 l.e:1-2"], note: "wardī annâ qadu šībīšu ana muḫḫika aṭrussunu u attā ... dīnšunu: 'I have sent this servant with his witnesses (šību, glossed 'old one') to you; you (give) their judgement ... settle it well'. 50 shekels of silver, 7 given by Yadlunu"}
    hints:
      - "A dispute referred with witnesses to another's judgement compare Deut 17:8-9 and Deut 19:15 (two or three witnesses)."

  - id: ane-ugarit-rs-94-2483-ship-to-tyre-omen
    tradition: ane-akkadian
    title: "The king of Ugarit to the king of Sidon: guard my ship going to Tyre; the extispicy for the ship's captain was not good; the ship entrusted to Yabni-ilu (RS 94.2483)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    version: "Letter between kings, Ugarit"
    read: ["Ugarit RS 94.2483"]
    tags:
      - {motif: letter-opening-say-to-my-lord, refs: ["Ugarit RS 94.2483 o:1-3"]}
      - {motif: letter-greeting-gods-guard-you, refs: ["Ugarit RS 94.2483 o:4-5"]}
      - {motif: omen-for-ship-captain-not-good, refs: ["Ugarit RS 94.2483 o:13-b.e:1"], note: "bārûtta ana ʾIli-malku bēl eleppīya ītepuš u bārûssu ul banû: 'he performed extispicy for Ili-malku, my ship's captain, and his omen was not good'; so the ship passes to another captain"}
      - {motif: gift-request-luxury-goods-between-officials, refs: ["Ugarit RS 94.2483 r:7-12"], note: "mīnummê ḫašḫtu ša aḫīya ... šupurma anāku ušēbilakku: 'whatever my brother needs, write and I will send it'"}
    hints:
      - "Consulting omens before a sea voyage compare Jonah 1:7 (lots cast on the ship) and Prov 16:33."
      - "Ships of Tyre and Sidon compare Isa 23:1-2 and Ezek 27:8-9."

  - id: ane-ugarit-rs-94-2485-oil-for-wool-egypt
    tradition: ane-akkadian
    title: "Ahi-malku to Uri-Teššub his brother: may the gods of Ugarit and Tyre sate you with good old age; the oil for the wool, my ship to Egypt (RS 94.2485)"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Akkadian"
    version: "Letter between officials, Ugarit"
    read: ["Ugarit RS 94.2485"]
    tags:
      - {motif: letter-opening-say-to-my-lord, refs: ["Ugarit RS 94.2485 o:1-3"]}
      - {motif: letter-greeting-gods-guard-you, refs: ["Ugarit RS 94.2485 o:5-7"], note: "ilānū ša māt Ugarit u ilānū ša māt Ṣurri: the gods of both cities named"}
      - {motif: letter-wish-good-old-age-forever, refs: ["Ugarit RS 94.2485 o:8-9"], note: "šībūta damiqta lišbûka ultu inanna adi dārītim"}
      - {motif: kings-call-each-other-brothers-sons-of-one-man, refs: ["Ugarit RS 94.2485 o:10-13", "Ugarit RS 94.2485 r:15-l.e:1"], note: "akanna aḫḫū ... išapparūnu ina birišunu: 'thus brothers write to one another'"}
