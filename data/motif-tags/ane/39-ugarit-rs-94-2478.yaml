  - id: ane-ktu-1-2-iv-baal-defeats-yamm
    tradition: ane-ugaritic
    title: "Baal Cycle 1.2 IV: Kothar promises Baal eternal kingship and makes the clubs Yagrush and Ayyamur; they strike Yamm's shoulder, then his skull; Yamm falls; 'Yamm is dead, Baal shall be king'"
    corpus: ane
    original: true
    tagger: "Claude Opus 5.5, reading the Ugaritic"
    version: "KTU 1.2 (Baal Cycle tablet 2)"
    read: ["KTU 1.2 IV"]
    tags:
      - {motif: rider-of-the-heavens, refs: ["KTU 1.2 IV:8", "KTU 1.2 IV:29"], note: "rkb ʿrpt 'Rider of the Clouds' as Baal's epithet"}
      - {motif: take-eternal-kingship, refs: ["KTU 1.2 IV:8-10"], note: "ht ibk bʿlm ht ibk tmḫṣ ht tṣmt ṣrtk tqḥ mlk ʿlmk drkt dt drdrk: 'now your enemy, Baal, now strike your enemy, now destroy your foe; take your eternal kingship, your everlasting dominion'"}
      - {motif: named-weapons-of-divine-warrior, refs: ["KTU 1.2 IV:11-12", "KTU 1.2 IV:18-19"], note: "ypʿr šmthm šmk at ygrš ... aymr: 'Driver' and 'Expeller'"}
      - {motif: craftsman-names-twin-clubs, refs: ["KTU 1.2 IV:11-26"], note: "trtqṣ bd bʿl km nšr buṣbʿth: 'leap from Baal's hand like an eagle from his fingers'; first club to the shoulder, second to the skull between the eyes"}
      - {motif: storm-god-defeats-sea, refs: ["KTU 1.2 IV:15-27"], note: "ʿz ym lymk ... ylm qdqd zbl ym bn ʿnm ṯpṭ nhr yprsḥ ym yql larṣ ... yqṯ bʿl wyšt ym ykly ṯpṭ nhr"}
      - {motif: sea-is-dead-baal-shall-reign, refs: ["KTU 1.2 IV:32", "KTU 1.2 IV:34"], note: "ym lmt bʿlm yml[k]"}
      - {motif: gods-acclaim-x-is-king, refs: ["KTU 1.2 IV:32"]}
      - {motif: god-rebukes-sea-and-dries-rivers, refs: ["KTU 1.2 IV:28-30"], note: "bšm tgʿrm ʿṯtrt: Athtart 'rebukes' (gʿr) by the name -- the verb of Ps 106:9, Nah 1:4; 'our captive is Prince Yamm'"}
      - {motif: god-stills-sea-smites-rahab, refs: ["KTU 1.2 IV:22-27"]}
      - {motif: fall-to-earth-strong-into-dust, refs: ["KTU 1.2 IV:5"], note: "ypl ulny wl ʿpr ʿẓmny: 'may the mighty fall to the earth, the strong into the dust'"}
    hints:
      - "'Your enemies, O YHWH, now your enemies shall perish' compare Ps 92:10 (hinneh oyvekha) with ht ibk bʿlm ht ibk tmḫṣ; eternal kingship compare Ps 145:13 and Exod 15:18."
      - "YHWH's rebuke of the sea compare Ps 104:7, Ps 106:9, Nah 1:4, Isa 50:2; Sea and River in parallel compare Hab 3:8 and Ps 93:3."
      - "'YHWH is king' after the combat compare Ps 93:1, Ps 29:10 (YHWH sits enthroned over the flood), Exod 15:18; the god's victory over the sea compare Job 26:12 and Ps 74:13."
      - "Compare Q 44:24 (leave the sea at rest) for a late echo of the parted, subdued sea."
