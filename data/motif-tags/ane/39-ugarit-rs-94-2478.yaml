      - {motif: canaanite-gloss-in-akkadian-letter, refs: ["Ugarit SMEA 42, p.5-17 o:9", "Ugarit SMEA 42, p.5-17 o:11", "Ugarit SMEA 42, p.5-17 o:13"], note: "yi-iš-ta-ri-iq, yi-na-ab-di, yi-te-li: Canaanite prefix yi- on Akkadian verbs"}
    hints:
      - "Ashkelon named in the Hebrew Bible compare Judg 1:18 and 1 Sam 6:17; extradition of a fugitive slave or thief compare 1 Kgs 2:39-40 (Shimei's slaves fled to Achish of Gath) and contrast Deut 23:16-17."

