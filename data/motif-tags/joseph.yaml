    original: true
    tagger: "Claude (model), reading the Late Egyptian; assembled from the full-read units ane-twobrothers-brothers-and-herds, ane-twobrothers-seduction-attempt, ane-twobrothers-false-accusation, ane-twobrothers-rage-and-flight (data/motif-tags/ane/)"
    read: ["TwoBrothers 1_1-2_6", "TwoBrothers 2_7-4_2/4", "TwoBrothers 4_3-5_3/4", "TwoBrothers 5_4-6_3/3"]
    note: "The pilot tag master-entrusts-household is not carried over: in the text Bata is the younger brother raised as a son (younger-brother-raised-as-son), not a servant entrusted with a master's house."
    tags:
      - {motif: two-brothers-of-one-father-and-mother, refs: ["TwoBrothers 1_1"]}
      - {motif: younger-brother-raised-as-son, refs: ["TwoBrothers 1_1/2-1_3"]}
