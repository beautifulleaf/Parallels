      - {motif: seducer-offers-fine-clothes, refs: ["TwoBrothers 3_7/4-3_7/5"]}
      - {motif: alone-in-house, refs: ["TwoBrothers 2_9/2-3_2", "TwoBrothers 5_1"]}
      - {motif: refusal-of-seduction, refs: ["TwoBrothers 3_8-4_1/3"]}
