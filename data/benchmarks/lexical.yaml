# Known findings the lexical track must recover. `lead` names the benchmark
# lead that covers it (the pipeline will not create a duplicate lead).
# `expect: false` records a known limitation instead of a target.
expectations:
  - description: "Quran: al-yamm is concentrated in the Moses narrative"
    corpus: quran
    kind: concentration
    lemma: يَمّ
    narrative: moses
    lead: yamm-sea
  - description: "Quran al-yamm ↔ Hebrew yam (H3220)"
    corpus: quran
    kind: cognate
    lemma: يَمّ
    hebrew: H3220
    lead: yamm-sea
  - description: "Quran tannūr ↔ Hebrew tannûr (H8574)"
    corpus: quran
    kind: cognate
    lemma: تَنُّور
    hebrew: H8574
    lead: tannur-loan-chain
  - description: "Hebrew tēbâ (H8392) links Noah's ark and Moses' basket"
    corpus: hebrew-bible
    kind: bridge
    lemma: H8392
    narratives: [moses, noah]
  - description: "Quran kursī ↔ Biblical Aramaic korsêʾ (H3764), the -rs- form the Arabic shows"
    corpus: quran
    kind: cognate
    lemma: كُرْسِيّ
    hebrew: H3764
    lead: kursi-loan-chain
  - description: "Quran kursī ↔ Hebrew kissēʾ (H3678), through the loan chain (Akkadian kussû, geminate dissimilated to -rs-)"
    corpus: quran
    kind: cognate
    lemma: كُرْسِيّ
    hebrew: H3678
    lead: kursi-loan-chain
# Loan chains (tools/anelex.py): one chain must link every form listed. Sumerian forms by their
# normalized reading, Akkadian by eBL citation form, the others as he:/arc: Strong's or ar: Quran lemma.
  - description: "Loan chain: Sumerian guza → Akkadian kussû → Aramaic korsêʾ (H3764) → Arabic kursī; and Hebrew kissēʾ (H3678)"
    kind: chain
    forms: [guza, kussû, "arc:H3764", "he:H3678", "ar:كُرْسِيّ"]
    lead: kursi-loan-chain
  - description: "Loan chain: Sumerian é-gal → Akkadian ekallu → Hebrew hêkhāl (H1964). Arabic haykal is not in the Quran, so the chain's Arabic end is outside the corpus"
    kind: chain
    forms: [egal, ekallu, "he:H1964"]
    lead: haykal-loan-chain
  - description: "Akkadian tinūru → Hebrew tannûr (H8574) and Arabic tannūr"
    kind: chain
    forms: [tinūru, "he:H8574", "ar:تَنُّور"]
    lead: tannur-loan-chain
# ANE traces (anelex.ane_traces): a concentrated Quran word followed to an ANE cognate occurring in `text`.
  - description: "Trace: al-yamm (concentrated in the Moses narrative) → Ugaritic ym, the sea god Yammu, in the Baal Cycle (KTU 1.2)"
    kind: trace
    lemma: يَمّ
    lang: uga
    text: KTU 1.2
    lead: yamm-sea
