# Observation records for hadith chunk 9 (al-Jāmiʿ al-Kāmil books 58 and 60, pp. 6638-6819).
records:
  # ---- book 58: dreams
  - {id: h-6638.1-daybreak, ref: "Jāmiʿ 58:6638.1", unit: hadith-58-dreams-and-prophecy, agent: the prophet, action: sees true dreams at the start of revelation, outcome: each comes true like daybreak, quoted: "mithla falaq al-subh"}
  - {id: h-6638.2-mubashshirat, ref: "Jāmiʿ 58:6638.2", unit: hadith-58-dreams-and-prophecy, object: prophecy, action: is cut off except the glad tidings, name: al-mubashshirat, quoted: "lam yabqa min al-nubuwwa illa al-mubashshirat ... al-ru'ya al-saliha"}
  - {id: h-6638.3-fortysix, ref: "Jāmiʿ 58:6638.3", unit: hadith-58-dreams-and-prophecy, object: the believer's dream, action: is a fraction of prophecy, number: 46, quoted: "juz' min sitta wa-arba'in juz'an min al-nubuwwa"}
  - {id: h-6640.2-seventy, ref: "Jāmiʿ 58:6640.2", unit: hadith-58-dreams-and-prophecy, object: the good dream, action: is a fraction of prophecy, number: 70, quoted: "juz' min sab'in juz'an min al-nubuwwa"}
  - {id: h-6639.3-form, ref: "Jāmiʿ 58:6639.3", unit: hadith-58-dreams-and-prophecy, agent: Satan, action: cannot take the prophet's likeness in a dream, quoted: "fa-inna al-shaytan la yatamaththalu bi"}
  - {id: h-6641.1-bushra, ref: "Jāmiʿ 58:6641.1", unit: hadith-58-dreams-and-prophecy, agent: the prophet, action: explains the glad tidings of this life as the good dream, object: Q 10:64, quoted: "hiya al-ru'ya al-saliha yaraha al-mu'min aw turā lahu"}
  - {id: h-6642.1-three, ref: "Jāmiʿ 58:6642.1", unit: hadith-58-three-kinds-of-dream, object: dreams, action: are divided into three kinds, number: 3, quoted: "ahawil min al-shaytan ... ma yahummu bihi al-rajul fi yaqzatihi ... juz' min sitta wa-arba'in"}
  - {id: h-6642.2-fetter, ref: "Jāmiʿ 58:6642.2", unit: hadith-58-three-kinds-of-dream, object: [fetter (qayd), shackle (ghull)], action: fetter liked and shackle disliked in dreams, outcome: fetter read as firmness in religion, quoted: "al-qayd thabat fi l-din"}
  - {id: h-6644.1-spit, ref: "Jāmiʿ 58:6644.1", unit: hadith-58-disliked-dream-remedy, agent: the dreamer, action: blows to the left on waking from a disliked dream, number: 3, outcome: the dream will not harm, quoted: ["fa-l-yanfuth 'an yasarihi thalath marrat", "wa-l-yatahawwal 'an janbihi"]}
  - {id: h-6644.3-spit, ref: "Jāmiʿ 58:6644.3", unit: hadith-58-disliked-dream-remedy, agent: the dreamer, action: spits to the left and seeks refuge from Satan, number: 3, quoted: "fa-l-yabsuq 'an yasarihi thalathan"}
  - {id: h-6643.1-tell, ref: "Jāmiʿ 58:6643.1", unit: hadith-58-disliked-dream-remedy, agent: the dreamer, action: tells a liked dream only to one who loves him, quoted: "fa-la yuhaddith biha illa man yuhibb"}
  - {id: h-6645.2-head, ref: "Jāmiʿ 58:6645.2", unit: hadith-58-satan-toying-in-sleep, agent: a bedouin, action: dreams his head is struck off and rolls and he runs after it, recipient: the prophet, outcome: told not to tell Satan's toying, quoted: "la tuhaddith al-nas bi-tala'ub al-shaytan bika fi manamika"}
  - {id: h-6646.1-barley, ref: "Jāmiʿ 58:6646.1", unit: hadith-58-lying-about-dreams, agent: one who claims an unseen dream, action: is charged to tie a knot between two barley grains, number: 2, outcome: cannot, quoted: "kullifa an ya'qida bayna sha'iratayn wa-lan yaf'al"}
  - {id: h-6646.1-lead, ref: "Jāmiʿ 58:6646.1", unit: hadith-58-lying-about-dreams, agent: the eavesdropper, action: has molten lead poured into his ears, time: Day of Resurrection, instrument: molten lead (anuk), quoted: "subba fi udhunayhi al-anuk"}
  - {id: h-6646.1-image, ref: "Jāmiʿ 58:6646.1", unit: hadith-58-lying-about-dreams, agent: the image-maker, action: is charged to breathe spirit into his image, outcome: cannot, quoted: "kullifa an yanfukha fiha wa-laysa bi-nafikh"}
  - {id: h-6647.1-qadr, ref: "Jāmiʿ 58:6647.1", unit: hadith-58-concurring-dreams-and-day-dreams, agent: several companions, action: dream the Night of Decree, time: last seven nights, number: 7, quoted: "ara ru'yakum qad tawata'at fi l-sab' al-awakhir"}
  - {id: h-6647.2-sea, ref: "Jāmiʿ 58:6647.2", unit: hadith-58-concurring-dreams-and-day-dreams, agent: the prophet, action: naps at midday and wakes laughing, place: house of Umm Haram at Quba', object: raiders riding the sea, quoted: "yarkabuna thabaj hadha l-bahr muluka 'ala l-asirra", number: 2}
  - {id: h-6647.2-umm-haram, ref: "Jāmiʿ 58:6647.2", unit: hadith-58-concurring-dreams-and-day-dreams, agent: Umm Haram, action: asks to be among the raiders, time: Mu'awiya's time, outcome: thrown from her mount after leaving the sea and dies, quoted: "anti min al-awwalin"}
  - {id: h-6649.2-foot, ref: "Jāmiʿ 58:6649.2", unit: hadith-58-telling-and-interpreting, object: the dream, action: falls as it is interpreted, instrument: simile of a man with lifted foot, quoted: "inna l-ru'ya taqa'u 'ala ma tu'abbar"}
  - {id: h-6650.1-pillar, ref: "Jāmiʿ 58:6650.1", unit: hadith-58-telling-and-interpreting, agent: a merchant's wife, action: dreams her house pillar breaks and she bears a one-eyed boy, recipient: the prophet; Aisha, outcome: read for good the husband returns; read for ill by Aisha the husband dies and the son is wicked, quoted: ["anna sariyat bayti inkasarat wa-anni waladtu ghulaman a'war", "fa-'buruha 'ala l-khayr"]}
  - {id: h-6651.1-palms, ref: "Jāmiʿ 58:6651.1", unit: hadith-58-prophets-dreams-hijra-uhud, agent: the prophet, action: dreams of emigrating to a land of palms, place: [al-Yamama, Hajar, Medina Yathrib], outcome: it is Medina, quoted: "fa-dhahaba wahli ila annaha l-yamama aw hajar"}
  - {id: h-6651.1-sword, ref: "Jāmiʿ 58:6651.1", unit: hadith-58-prophets-dreams-hijra-uhud, agent: the prophet, action: shakes a sword twice, object: sword, outcome: "front breaks (Uhud's losses), then restored (the victory)", quoted: "hazaztu sayfan fa-nqata'a sadruhu"}
  - {id: h-6651.1-cows, ref: "Jāmiʿ 58:6651.1", unit: hadith-58-prophets-dreams-hijra-uhud, object: cows, action: seen in a dream and read as slain believers, place: Uhud, quoted: "baqaran wa-llahu khayr"}
  - {id: h-6651.2-armour, ref: "Jāmiʿ 58:6651.2", unit: hadith-58-prophets-dreams-hijra-uhud, object: a strong coat of mail, action: read as Medina, quoted: "dir' hasina"}
  - {id: h-6651.3-siwak, ref: "Jāmiʿ 58:6651.3", unit: hadith-58-prophets-dreams-hijra-uhud, agent: the prophet, action: hands the tooth-stick to the younger of two men, object: tooth-stick (siwak), outcome: told 'the elder' and gives it to him, number: 2, quoted: "kabbir"}
  - {id: h-6652.1-bracelets, ref: "Jāmiʿ 58:6652.1", unit: hadith-58-two-gold-bracelets, agent: the prophet, action: blows on two gold bracelets at a revealed command, object: two gold bracelets, outcome: they fly away; read as two liars, name: [al-'Ansi of San'a, Musaylima of al-Yamama, Thabit b. Qays], number: 2, quoted: "an unfukhhuma fa-tara"}
  - {id: h-6653.1-visitors, ref: "Jāmiʿ 58:6653.1", unit: hadith-58-samura-dream-tour, agent: two visitors, action: lead the prophet by night from scene to scene, number: 2, quoted: "atani l-layla atiyan ... intaliq intaliq", outcome: explain all at the end}
  - {id: h-6653.1-rock, ref: "Jāmiʿ 58:6653.1", unit: hadith-58-samura-dream-tour, agent: a man, action: smashes a lying man's head with a rock repeatedly, instrument: rock, outcome: head heals and is smashed again, quoted: "yakhudhu l-qur'an fa-yarfuduhu wa-yanamu 'an al-salat al-maktuba"}
  - {id: h-6653.1-hook, ref: "Jāmiʿ 58:6653.1", unit: hadith-58-samura-dream-tour, agent: a man, action: "tears mouth-corner, nostril and eye to the nape, side after side", instrument: iron hook (kallub), outcome: the liar whose lie reaches the horizons, quoted: "fa-yusharshiru shidqahu ila qafahu"}
  - {id: h-6653.1-oven, ref: "Jāmiʿ 58:6653.1", unit: hadith-58-samura-dream-tour, object: naked men and women, place: an oven-like pit, action: cry out as flame rises from below, outcome: the adulterers, quoted: "mithl al-tannur ... al-zunat wa-l-zawani"}
  - {id: h-6653.1-river, ref: "Jāmiʿ 58:6653.1", unit: hadith-58-samura-dream-tour, agent: a man on the bank, action: feeds a stone to a swimmer each time he returns, place: a river red as blood, outcome: the usurer, quoted: "nahar ahmar mithl al-dam ... akil al-riba"}
  - {id: h-6653.1-malik, ref: "Jāmiʿ 58:6653.1", unit: hadith-58-samura-dream-tour, agent: an ugly man, action: stokes a fire and runs round it, name: Malik keeper of Jahannam, quoted: "malik khazin jahannam"}
  - {id: h-6653.1-abraham, ref: "Jāmiʿ 58:6653.1", unit: hadith-58-samura-dream-tour, agent: Abraham, place: a flowering meadow, object: children who died on the fitra, recipient: children of the polytheists too, quoted: ["la akadu ara ra'sahu tulan fi l-sama'", "wa-awlad al-mushrikin"]}
  - {id: h-6653.1-city, ref: "Jāmiʿ 58:6653.1", unit: hadith-58-samura-dream-tour, place: city of bricks of gold and silver, action: gate opened on request, object: men half fair half ugly, outcome: washed in a milk-white river they become fair, quoted: "madina mabniyya bi-labin dhahab wa-labin fidda"}
  - {id: h-6653.1-palace, ref: "Jāmiʿ 58:6653.1", unit: hadith-58-samura-dream-tour, place: Garden of Eden ('adn), object: palace like a white cloud, action: shown as the prophet's dwelling, outcome: not to enter yet, quoted: "amma l-ana fa-la wa-anta dakhiluhu"}
  - {id: h-6655.1-epidemic, ref: "Jāmiʿ 58:6655.1", unit: hadith-58-prophets-dreams-figures, agent: a black woman with dishevelled hair, action: leaves Medina and stands at Mahya'a, place: [Medina, Mahya'a, al-Juhfa], outcome: epidemic moved, quoted: "imra'a sawda' tha'irat al-ra's"}
  - {id: h-6655.2-jesus, ref: "Jāmiʿ 58:6655.2", unit: hadith-58-prophets-dreams-figures, agent: the Messiah son of Mary, action: circles the Kaaba leaning on two men, place: the Kaaba, quoted: "lahu limma ... fa-hiya taqturu ma'an", number: 2}
  - {id: h-6655.2-dajjal, ref: "Jāmiʿ 58:6655.2", unit: hadith-58-prophets-dreams-figures, agent: the Messiah Dajjal, action: seen curly-haired and blind in the right eye, name: Ibn Qatan, quoted: "a'war al-'ayn al-yumna ka-annaha 'inaba tafiya"}
  - {id: h-6655.4-silk, ref: "Jāmiʿ 58:6655.4", unit: hadith-58-prophets-dreams-figures, agent: the angel, action: brings the future wife wrapped in silk, recipient: the prophet, instrument: piece of silk (saraqa min harir), number: [2, 3], quoted: "in yakun hadha min 'ind allah yumdihi"}
  - {id: h-6656.2-milk, ref: "Jāmiʿ 58:6656.2", unit: hadith-58-prophets-dreams-figures, agent: the prophet, action: drinks milk and gives the rest to Umar, object: cup of milk, outcome: read as knowledge, quoted: "la-ara l-riyy yakhruju min atrafi"}
  - {id: h-6656.4-well, ref: "Jāmiʿ 58:6656.4", unit: hadith-58-prophets-dreams-figures, agent: [Abu Bakr, Umar], action: draw water at a well after the prophet, number: 2, outcome: Abu Bakr weakly two buckets; Umar's bucket grows huge and waters all, quoted: ["fa-naza'a dhanubayn wa-fi naz'ihi da'f", "fa-stahalat gharban"]}
  - {id: h-6657.3-dates, ref: "Jāmiʿ 58:6657.3", unit: hadith-58-prophets-dreams-figures, object: fresh dates of Ibn Tab, place: house of 'Uqba b. Rafi', action: read by name as good fortune, quoted: "wa-anna dinana qad tab"}
  - {id: h-6658.1-sheep, ref: "Jāmiʿ 58:6658.1", unit: hadith-58-prophets-dreams-figures, object: [black sheep, white sheep], action: white enter the black flock, outcome: non-Arabs share religion and lineage, quoted: "law kana l-iman mu'allaqan fi l-thurayya la-nalahu rijal min al-'ajam"}
  - {id: h-6658.2-well-fire, ref: "Jāmiʿ 58:6658.2", unit: hadith-58-ibn-umar-and-ibn-salam-dreams, agent: two angels, action: take Ibn Umar to the fire, place: "the fire, cased like a well", number: 2, quoted: ["lan tura'", "matwiyya ka-tayy al-bi'r"], outcome: told he would be good if he prayed more at night}
  - {id: h-6659.2-pillar, ref: "Jāmiʿ 58:6659.2", unit: hadith-58-ibn-umar-and-ibn-salam-dreams, agent: Abd Allah b. Salam, action: is lifted up an iron pillar and grips the handhold, instrument: iron pillar from earth to sky, object: handhold ('urwa), place: a meadow, outcome: read as Islam until death, quoted: "wa-tilka l-'urwa 'urwat al-wuthqa"}
  - {id: h-6660.2-spring, ref: "Jāmiʿ 58:6660.2", unit: hadith-58-spring-and-canopy-dreams, agent: Umm al-'Ala', action: sees a flowing spring for the dead Uthman b. Maz'un, outcome: read as his deeds still flowing, quoted: "dhaka 'amaluhu yajri lahu"}
  - {id: h-6661.1-canopy, ref: "Jāmiʿ 58:6661.1", unit: hadith-58-spring-and-canopy-dreams, agent: Abu Bakr, action: interprets a dream of a canopy dripping ghee and honey and a rope from heaven, object: [canopy, ghee, honey, rope], outcome: "right in part, wrong in part; the prophet refuses to say which", quoted: ["zulla tantifu al-samn wa-l-'asal", "asabta ba'dan wa-akhta'ta ba'dan", "la tuqsim"]}
  - {id: h-6661.2-twelve, ref: "Jāmiʿ 58:6661.2", unit: hadith-58-other-companions-dreams, agent: a woman, action: dreams twelve slain men brought into paradise and dipped in a river, number: 12, place: river al-Baydhakh, object: "golden chairs, unripe dates", outcome: the raid's messenger confirms the twelve, quoted: "wujuhuhum ka-l-qamar laylat al-badr"}
  - {id: h-6662.1-books, ref: "Jāmiʿ 58:6662.1", unit: hadith-58-other-companions-dreams, agent: Abd Allah b. Amr, action: licks ghee from one finger and honey from another, object: [ghee, honey], outcome: reads the two books, name: [al-Tawrat, al-Furqan], number: 2, quoted: "taqra' al-kitabayn al-tawrat wa-l-furqan"}
  - {id: h-6662.2-tufayl, ref: "Jāmiʿ 58:6662.2", unit: hadith-58-other-companions-dreams, agent: Tufayl b. Sakhbara, action: dreams Jews and Christians rebuke Muslims, name: ["'Uzayr son of God", the Messiah son of God], outcome: the prophet forbids 'what God wills and Muhammad wills', quoted: "la taqulu ma sha'a llah wa-ma sha'a muhammad"}
  - {id: h-6663.1-limb, ref: "Jāmiʿ 58:6663.1", unit: hadith-58-other-companions-dreams, agent: Umm al-Fadl, action: dreams a limb of the prophet in her house, outcome: "Fatima bears al-Hasan, whom she nurses with Qutham's milk", quoted: "innama yughsalu bawl al-jariya wa-yusabbu 'ala bawl al-ghulam"}
  - {id: h-6663.3-scale, ref: "Jāmiʿ 58:6663.3", unit: hadith-58-other-companions-dreams, instrument: a scale from the sky, action: weighs the prophet and three successors in turn, name: [Abu Bakr, Umar, Uthman], outcome: the scale is lifted; displeasure on the prophet's face, quoted: "kanna mizanan nazala min al-sama'"}
  # ---- book 60: al-Fatiha
  - {id: h-6731.2-call, ref: "Jāmiʿ 60:6731.2", unit: hadith-60-fatiha-names-and-merits, agent: the prophet, action: calls a companion at prayer who does not answer, recipient: Abu Sa'id b. al-Mu'alla, object: Q 8:24, outcome: taught the greatest sura before leaving the mosque, quoted: "hiya al-sab' al-mathani wa-l-qur'an al-'azim"}
  - {id: h-6732.1-books, ref: "Jāmiʿ 60:6732.1", unit: hadith-60-fatiha-names-and-merits, object: al-Fatiha, action: declared without equal in the earlier scriptures, name: [al-Tawrat, al-Injil, al-Zabur, al-Furqan], quoted: "lam yunzal fi l-tawrat wa-la fi l-injil wa-la fi l-zabur wa-la fi l-furqan mithluha"}
  - {id: h-6733.1-ruqya, ref: "Jāmiʿ 60:6733.1", unit: hadith-60-fatiha-names-and-merits, agent: a companion, action: recites al-Fatiha over a stung chief, outcome: chief recovers; paid sheep; the prophet takes a share, number: 30, quoted: "wa-ma kana yudrihi annaha ruqya"}
  - {id: h-6733.3-greeting, ref: "Jāmiʿ 60:6733.3", unit: hadith-60-fatiha-names-and-merits, agent: the prophet, action: "does not return a greeting until purified, then returns it", number: 3, recipient: Abd Allah b. Jabir, quoted: "'alayka l-salam wa-rahmat allah"}
  - {id: h-6734.1-door, ref: "Jāmiʿ 60:6734.1", unit: hadith-60-fatiha-names-and-merits, agent: an angel, action: descends through a door of heaven opened for the first time, object: two lights, name: [Fatihat al-kitab, khawatim surat al-baqara], number: 2, quoted: "abshir bi-nurayn"}
  - {id: h-6734.2-divided, ref: "Jāmiʿ 60:6734.2", unit: hadith-60-fatiha-prayer-divided, agent: God, action: answers each verse of al-Fatiha, object: the prayer divided in two halves, quoted: ["qasamtu l-salat bayni wa-bayna 'abdi nisfayn", "hamidani 'abdi", "athna 'alayya 'abdi", "majjadani 'abdi"]}
  - {id: h-6734.2-khidaj, ref: "Jāmiʿ 60:6734.2", unit: hadith-60-fatiha-prayer-divided, object: prayer without al-Fatiha, action: is declared defective, number: 3, quoted: "fa-hiya khidaj, hiya khidaj, hiya khidaj"}
  - {id: h-6735.2-amin, ref: "Jāmiʿ 60:6735.2", unit: hadith-60-amin-and-the-two-groups, agent: the worshippers, action: say amin after the imam, outcome: forgiveness if it coincides with the angels', quoted: "fa-man wafaqa qawluhu qawl al-mala'ika ghufira lahu"}
  - {id: h-6735.3-wrath, ref: "Jāmiʿ 60:6735.3", unit: hadith-60-amin-and-the-two-groups, agent: the prophet, action: points to the Jews and the Christians, place: Wadi l-Qura, object: Q 1:7, quoted: ["al-maghdub 'alayhim", "al-dallun"]}
  # ---- al-Baqara merits
  - {id: h-6738.1-lamps, ref: "Jāmiʿ 60:6738.1", unit: hadith-60-baqara-angels-at-recitation, agent: Usayd b. Hudayr, action: recites at night, place: his date-drying yard, object: a canopy with lamps, number: 3, outcome: angels listening; would have been seen at dawn, quoted: "fiha amthal al-suruj 'arajat fi l-jaww"}
  - {id: h-6739.2-book, ref: "Jāmiʿ 60:6739.2", unit: hadith-60-baqara-drives-out-satan, agent: God, action: writes a book before creation and sends down two verses, time: two thousand years before heaven and earth, number: [2000, 2, 3], outcome: no devil near a house where they are read three nights, quoted: "kataba kitaban qabla an yakhluqa l-samawat wa-l-ard bi-alfay 'am"}
  - {id: h-6742.1-sidra, ref: "Jāmiʿ 60:6742.1", unit: hadith-60-baqara-closing-verses, agent: God, action: gives three gifts, place: Lote-Tree of the Boundary, recipient: the prophet, object: [five prayers, closing verses of al-Baqara, forgiveness of grave sins], number: 3, quoted: "sidrat al-muntaha ... al-muqhimat"}
  - {id: h-6742.2-treasure, ref: "Jāmiʿ 60:6742.2", unit: hadith-60-baqara-closing-verses, object: closing verses of al-Baqara, action: given from a treasure-house, place: beneath the Throne, quoted: "min bayt kanz min taht al-'arsh"}
  - {id: h-6742.4-devil, ref: "Jāmiʿ 60:6742.4", unit: hadith-60-throne-verse, agent: a captive devil, action: teaches the Throne Verse for bedtime, recipient: Abu Hurayra, time: three nights, number: 3, outcome: a guardian until morning, quoted: "sadaqaka wa-huwa kadhub"}
  - {id: h-6743.1-greatest, ref: "Jāmiʿ 60:6743.1", unit: hadith-60-throne-verse, agent: the prophet, action: strikes Ubayy's chest, recipient: Ubayy b. Ka'b (Abu l-Mundhir), quoted: "li-yahnika l-'ilm aba l-mundhir"}
  - {id: h-6744.1-clouds, ref: "Jāmiʿ 60:6744.1", unit: hadith-60-the-two-bright-suras, agent: [al-Baqara, Al Imran], action: come pleading for their companion, time: Day of Resurrection, number: 3, quoted: "ka-annahuma ghamamatan aw zullatan sawdawan baynahuma sharq aw hizqan min tayr sawaff"}
  - {id: h-6745.1-pale, ref: "Jāmiʿ 60:6745.1", unit: hadith-60-the-two-bright-suras, agent: the Quran, action: meets its reader as a pale man, place: the split grave, recipient: the reader, outcome: crown of dignity; parents clothed; climbs steps of paradise, quoted: "ana sahibuka l-qur'an alladhi azma'tuka fi l-hawajir"}
  - {id: h-6746.2-tablets, ref: "Jāmiʿ 60:6746.2", unit: hadith-60-seven-long-suras, agent: Moses, action: throws down the tablets, object: six long suras, number: [7, 6, 2, 4], outcome: "two lifted, four remain", quoted: "fa-lamma alqa l-alwah rufi'at thintan wa-baqiya arba'"}
  - {id: h-6746.3-books, ref: "Jāmiʿ 60:6746.3", unit: hadith-60-seven-long-suras, object: sura groups, action: given in place of earlier scriptures, name: [al-Tawrat, al-Zabur, al-Injil, al-mufassal], quoted: "u'tiitu makan al-tawrat al-sab'"}
  # ---- al-Baqara tafsir
  - {id: h-6748.1-ran, ref: "Jāmiʿ 60:6748.1", unit: hadith-60-heart-stain-and-trials, agent: the sinning believer, object: black spot on the heart, action: is polished by repentance or spreads with sin, name: al-ran, quoted: "nukta sawda' fi qalbihi"}
  - {id: h-6751.1-sins, ref: "Jāmiʿ 60:6751.1", unit: hadith-60-rain-and-rivals, agent: the prophet, action: ranks the greatest sins, object: [setting up a rival to God, killing one's child for fear of food, adultery with the neighbour's wife], number: 3, quoted: "an tuzaniya halilat jarik"}
  - {id: h-6751.3-wills, ref: "Jāmiʿ 60:6751.3", unit: hadith-60-rain-and-rivals, agent: a Jew, action: objects to Muslim oaths, recipient: the prophet, outcome: "'by the Lord of the Kaaba' and 'what God wills then you will'", quoted: "ma sha'a llah thumma shi't"}
