# Observation records for hadith chunk 34 (al-Jāmiʿ al-Kāmil book 9, prayer: night prayer, witr, qunut, travel, fear and forenoon prayers, pp. 1703-1822).
records:
  - {"id": "h-1703.1-prostration", "ref": "Jāmiʿ 9:1703.1", "unit": "hadith-9-night-prostration-fifty-verses", "agent": "the prophet", "action": "prostrates in the night prayer", "number": [11, 50], "time": "at night", "outcome": "each prostration as long as reciting fifty verses", "quoted": "yasjud al-sajda min dhalika qadra ma yaqra'u ahadukum khamsin aya"}
