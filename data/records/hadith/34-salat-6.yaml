  - {"id": "h-1715.1-crosslegged", "ref": "Jāmiʿ 9:1715.1", "unit": "hadith-9-voluntary-sitting", "agent": "the prophet", "action": "prays cross-legged", "quoted": "yusalli mutarabbi'an"}
