  - {"id": "h-1706.1-thirteen", "ref": "Jāmiʿ 9:1706.1", "unit": "hadith-9-count-of-night-rakas", "agent": "the prophet", "action": "prays the night prayer", "number": 13, "quoted": "thalath 'ashra rak'a"}
  - {"id": "h-1706.2-thirteen", "ref": "Jāmiʿ 9:1706.2", "unit": "hadith-9-count-of-night-rakas", "agent": "the prophet", "action": "prays ten at night, a witr of one, the two of dawn", "number": [10, 1, 2, 13], "quoted": "yutir bi-sajda"}
  - {"id": "h-1706.3-eyes", "ref": "Jāmiʿ 9:1706.3", "unit": "hadith-9-count-of-night-rakas", "agent": "the prophet", "action": "prays four, four, then three", "number": [11, 4, 3], "time": "in Ramadan and outside it", "quoted": ["fa-la tas'al 'an husnihinna wa-tulihinna", "ya 'A'isha inna 'aynayya tanaman wa-la yanamu qalbi"]}
  - {"id": "h-1706.4-seated", "ref": "Jāmiʿ 9:1706.4", "unit": "hadith-9-count-of-night-rakas", "agent": "the prophet", "action": "prays eight, the witr, then two sitting", "number": [13, 8, 2], "quoted": "thumma yusalli rak'atayn wa-huwa jalis"}
