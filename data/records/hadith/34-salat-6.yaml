  - {"id": "h-1709.3-pairs", "ref": "Jāmiʿ 9:1709.3", "unit": "hadith-9-night-two-by-two", "agent": "the prophet", "action": "answers a man about the night prayer", "number": [2, 1], "quoted": "salat al-layl mathna mathna fa-idha khashiya ahadukum al-subh salla rak'a wahida"}
  - {"id": "h-1710.1-dense", "ref": "Jāmiʿ 9:1710.1", "unit": "hadith-9-night-two-by-two", "agent": "Ibn Umar", "action": "rebukes the questioner who interrupts", "recipient": "Anas b. Sirin", "quoted": ["innaka la-dakhm", "bah bah", "ka'anna l-adhan bi-udhunayh"]}
  - {"id": "h-1711.1-prostration", "ref": "Jāmiʿ 9:1711.1", "unit": "hadith-9-night-two-by-two", "agent": "the prophet", "action": "answers a man calling out in the mosque", "number": 2, "quoted": "sajada sajda fa-awtarat lahu ma salla"}
  - {"id": "h-1711.2-year", "ref": "Jāmiʿ 9:1711.2", "unit": "hadith-9-voluntary-sitting", "agent": "Hafsa", "action": "first sees him pray voluntary prayer sitting", "time": "a year before his death", "quoted": ["qabla wafatihi bi-'am", "yurattiluha hatta takuna atwala min atwal minha"]}
  - {"id": "h-1712.1-seated", "ref": "Jāmiʿ 9:1712.1", "unit": "hadith-9-voluntary-sitting", "agent": "the prophet", "action": "prays sitting before his death", "quoted": "lam yamut hatta salla qa'idan"}
