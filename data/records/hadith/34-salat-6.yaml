  - {"id": "h-1712.4-most", "ref": "Jāmiʿ 9:1712.4", "unit": "hadith-9-voluntary-sitting", "agent": "the prophet", "action": "prays most of his prayer sitting except the obligatory", "quoted": "illa l-maktuba"}
