  - {"id": "h-1720.1-rain", "ref": "Jāmiʿ 9:1720.1", "unit": "hadith-9-constancy-in-deeds", "agent": "Aisha", "action": "describes his work", "recipient": "'Alqama", "quoted": "kana 'amaluhu dima"}
