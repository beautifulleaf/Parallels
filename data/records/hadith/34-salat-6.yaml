  - {"id": "h-1707.3-two", "ref": "Jāmiʿ 9:1707.3", "unit": "hadith-9-count-of-night-rakas", "agent": "the prophet", "action": "prays eight, two sitting, two between the calls", "number": [8, 2, 2], "time": "after the night prayer ('isha')", "quoted": "wa-lam yakun yada'uhuma abadan"}
  - {"id": "h-1708.2-five", "ref": "Jāmiʿ 9:1708.2", "unit": "hadith-9-witr-of-five-and-nine", "agent": "the prophet", "action": "prays witr of five sitting only at the last", "number": [13, 5], "quoted": "la yajlis fi shay' illa fi akhiriha"}
  - {"id": "h-1708.3-one", "ref": "Jāmiʿ 9:1708.3", "unit": "hadith-9-witr-of-five-and-nine", "agent": "the prophet", "action": "prays eleven, witr with one, lies on his right side", "number": [11, 1], "quoted": "yutir minha bi-wahida"}
  - {"id": "h-1708.4-nine", "ref": "Jāmiʿ 9:1708.4", "unit": "hadith-9-witr-of-five-and-nine", "agent": "the prophet", "action": "prays nine sitting only at the eighth, rising without salam", "number": [9, 8, 2, 11, 7], "outcome": "aged and fleshy, he prays seven", "quoted": ["la yajlis fiha illa fi l-thamina", "fa-lamma asanna ... wa-akhadhahu l-lahm awtara bi-sab'"]}
  - {"id": "h-1709.1-seven", "ref": "Jāmiʿ 9:1709.1", "unit": "hadith-9-witr-of-five-and-nine", "agent": "the prophet", "action": "prays nine at night, seven when aged", "number": [9, 7], "quoted": "fa-lamma asanna wa-thaqula salla sab'an"}
