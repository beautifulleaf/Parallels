# Observation records, hadith chunk 31 (al-Jāmiʿ al-Kāmil book 9, kitāb al-ṣalāt, pp. 1343-1462).
records:
- id: h-1343.1-limbs
  ref: Jāmiʿ 9:1343.1
  unit: hadith-9-seven-limbs
  agent: the servant
  action: prostrates
  object:
  - face
  - two palms
  - two knees
  - two feet
  number: 7
  quoted: 'sajada maʿahu sabʿatu aṭrāf: wajhuhu wa-kaffāhu wa-rukbatāhu wa-qadamāhu'
- id: h-1343.2-mud
  ref: Jāmiʿ 9:1343.2
  unit: hadith-9-forehead-and-nose
  agent: the prophet
  action: is seen after leading prayer
  object: trace of mud on forehead and nose-tip
  quoted: ʿalā jabhatihi wa-ʿalā arnabatihi athar ṭīn
- id: h-1343.3-nose
  ref: Jāmiʿ 9:1343.3
  unit: hadith-9-forehead-and-nose
  agent: the prophet
  action: sets nose and forehead firmly on the ground
  time: in prostration
  quoted: amkana anfahu wa-jabhatahu min al-arḍ
- id: h-1345.1-bones
  ref: Jāmiʿ 9:1345.1
  unit: hadith-9-forehead-and-nose
  agent: the prophet
  action: is ordered to prostrate on seven bones
  object:
  - forehead (pointing to the nose)
  - hands
  - knees
  - feet
  number: 7
  quoted: umirtu an asjuda ʿalā sabʿati aʿẓum
- id: h-1345.2-hands
  ref: Jāmiʿ 9:1345.2
  unit: hadith-9-forehead-and-nose
  agent: the hands
  action: prostrate as the face prostrates
  quoted: inna l-yadayni tasjudāni kamā yasjudu l-wajh
- id: h-1346.1-soles
  ref: Jāmiʿ 9:1346.1
  unit: hadith-9-feet-upright-refuge
  agent: Aisha
  action: feels for him in the dark
  object: the soles of his upright feet
  place: the place of prostration
  time: at night
  quoted: fa-waqaʿat yadī ʿalā baṭni qadamayhi ... wa-humā manṣūbatān
- id: h-1346.1-refuge
  ref: Jāmiʿ 9:1346.1
  unit: hadith-9-feet-upright-refuge
  agent: the prophet
  action: seeks refuge
  object:
  - in your pleasure from your anger
  - in your pardon from your punishment
  - in you from you
  quoted: aʿūdhu bika minka, lā uḥṣī thanāʾan ʿalayka
- id: h-1346.2-devil
  ref: Jāmiʿ 9:1346.2
  unit: hadith-9-feet-upright-refuge
  agent: the prophet
  action: prayed against his devil
  object: his devil (shayṭān)
  outcome: the devil submitted
  quoted: mā min ādamī illā lahu shayṭān ... daʿawtu llāha ʿalayhi fa-aslama
- id: h-1346.2-heels
  ref: Jāmiʿ 9:1346.2
  unit: hadith-9-feet-upright-refuge
  agent: the prophet
  action: prostrates with heels pressed together
  object: toes toward the qibla
  quoted: rāṣṣan ʿaqibayhi mustaqbilan bi-aṭrāfi aṣābiʿihi l-qibla
- id: h-1346.3-ears
  ref: Jāmiʿ 9:1346.3
  unit: hadith-9-hands-in-prostration
  agent: the prophet
  action: places the hands
  place: near the ears
  time: in prostration
  quoted: yadayhi qarīban min udhunayhi
- id: h-1347.1-palms
  ref: Jāmiʿ 9:1347.1
  unit: hadith-9-hands-in-prostration
  agent: the prophet
  action: prostrates on the heels of the palms
  quoted: yasjudu ʿalā alyatay al-kaff
- id: h-1347.2-fingers
  ref: Jāmiʿ 9:1347.2
  unit: hadith-9-hands-in-prostration
  agent: the prophet
  action: turns fingers toward the qibla and spreads the limbs
  time: in prostration
  quoted: wajjaha aṣābiʿahu qibala l-qibla fa-tafājja
- id: h-1347.3-fingers
  ref: Jāmiʿ 9:1347.3
  unit: hadith-9-hands-in-prostration
  agent: the prophet
  action: spreads fingers in bowing, joins them in prostration
  quoted: idhā rakaʿa farraja aṣābiʿahu wa-idhā sajada ḍamma aṣābiʿahu
- id: h-1348.1-sitting
  ref: Jāmiʿ 9:1348.1
  unit: hadith-9-resting-sitting
  agent: the prophet
  action: sits upright before rising
  time: in an odd rak'a
  quoted: lam yanhaḍ ḥattā yastawiya qāʿidan
- id: h-1348.2-bones
  ref: Jāmiʿ 9:1348.2
  unit: hadith-9-resting-sitting
  agent: the prophet
  action: sits on his folded foot
  outcome: every bone returns to its place
  quoted: yaqirru kullu ʿaẓmin mawḍiʿahu
- id: h-1349.1-iqaa
  ref: Jāmiʿ 9:1349.1
  unit: hadith-9-iqaa
  agent: Ibn Abbas
  action: calls squatting on the heels the sunna
  object: iqʿāʾ ʿalā l-qadamayn
  recipient: Tawus and companions
  quoted: hiya l-sunna ... jafāʾan bi-l-rajul ... bal hiya sunnatu nabiyyika
- id: h-1351.1-heel
  ref: Jāmiʿ 9:1351.1
  unit: hadith-9-iqaa
  agent: the prophet
  action: forbids
  object: the devil's heel-sitting
  quoted: ʿuqbat al-shayṭān
- id: h-1351.2-jews
  ref: Jāmiʿ 9:1351.2
  unit: hadith-9-iqaa
  agent: the prophet
  action: forbids a man to sit leaning on his left hand
  time: in prayer
  name: the Jews
  quoted: innahā ṣalātu l-yahūd
- id: h-1352.1-rise
  ref: Jāmiʿ 9:1352.1
  unit: hadith-9-rising-on-hands
  agent: Malik b. al-Huwayrith (and Amr b. Salima)
  action: leans on the ground with the hands and rises
  time: after the second prostration
  quoted: jalasa wa-iʿtamada ʿalā l-arḍ thumma qāma
- id: h-1352.2-rise
  ref: Jāmiʿ 9:1352.2
  unit: hadith-9-rising-on-hands
  agent: Ibn Umar
  action: leans on the ground with his hand on rising
  time: from the two rak'as
  quoted: iʿtamada ʿalā l-arḍi bi-yadihi ... laʿallahu yafʿalu hādhā min al-kibar
- id: h-1354.1-dream
  ref: Jāmiʿ 9:1354.1
  unit: hadith-9-no-quran-in-sujud
  agent: the prophet
  action: lifts the curtain and speaks
  place: behind Abu Bakr's rows
  object: the good dream
  outcome: nothing else of the heralds of prophecy remains
  quoted: lam yabqa min mubashshirāti l-nubuwwa illā l-ruʾyā l-ṣāliḥa
- id: h-1354.1-quran
  ref: Jāmiʿ 9:1354.1
  unit: hadith-9-no-quran-in-sujud
  agent: the prophet
  action: is forbidden to recite the Quran
  time: bowing or prostrating
  quoted: nuhītu an aqraʾa l-qurʾāna rākiʿan aw sājidan
- id: h-1354.2-quran
  ref: Jāmiʿ 9:1354.2
  unit: hadith-9-no-quran-in-sujud
  agent: the prophet
  action: forbids Ali to recite
  time: bowing and prostrating
  recipient: Ali
  quoted: nahānī ... an aqraʾa rākiʿan wa-sājidan
- id: h-1355.1-marks
  ref: Jāmiʿ 9:1355.1
  unit: hadith-9-no-quran-in-sujud
  agent: the fire
  action: eats the son of Adam
  object: all but the marks of prostration
  outcome: the angels recognise them and bring them out; water of life poured on them; they sprout like seed in the flood-silt
  quoted: taʾkulu l-nāru bna ādama illā athara l-sujūd ... māʾ al-ḥayāt ... ka-mā tanbutu l-ḥibba fī ḥamīl al-sayl
- id: h-1355.3-nearest
  ref: Jāmiʿ 9:1355.3
  unit: hadith-9-no-quran-in-sujud
  agent: the servant
  action: is nearest his Lord
  time: while prostrating
  quoted: aqrabu mā yakūnu l-ʿabdu min rabbihi wa-huwa sājid
- id: h-1356.1-degree
  ref: Jāmiʿ 9:1356.1
  unit: hadith-9-much-prostration
  agent: God
  action: raises a degree and removes a sin
  object: for each prostration
  recipient: the one who prostrates
  number: 1
  quoted: rafaʿaka llāhu bihā darajatan wa-ḥaṭṭa ʿanka bihā khaṭīʾatan
- id: h-1356.1-asked
  ref: Jāmiʿ 9:1356.1
  unit: hadith-9-much-prostration
  agent: Madan b. Abi Talha
  action: asks Thawban three times
  outcome: answered on the third asking; Abu al-Darda says the same
  number: 3
  quoted: fa-sakata ... thumma saʾaltuhu l-thālitha
- id: h-1356.2-paradise
  ref: Jāmiʿ 9:1356.2
  unit: hadith-9-much-prostration
  agent: Rabia b. Kab
  action: asks to be the prophet's companion in paradise
  recipient: the prophet
  outcome: '''help me with yourself by much prostration'''
  quoted: asʾaluka murāfaqataka fī l-janna ... fa-aʿinnī ʿalā nafsika bi-kathrati l-sujūd
- id: h-1357.1-intercession
  ref: Jāmiʿ 9:1357.1
  unit: hadith-9-much-prostration
  agent: a servant of the prophet
  action: asks intercession on the day of resurrection
  recipient: the prophet
  name: my Lord (as the one who directed him)
  quoted: 'man dallaka ʿalā hādhā? qāla: rabbī ... immā lā fa-aʿinnī bi-kathrati l-sujūd'
- id: h-1358.1-jerusalem
  ref: Jāmiʿ 9:1358.1
  unit: hadith-9-much-prostration
  agent: Abu Dharr
  action: prostrates much and weeps three times
  place: Jerusalem (bayt al-maqdis)
  recipient: al-Ahnaf b. Qays
  number: 3
  quoted: in aku lā adrī fa-inna llāha yadrī ... akhbaranī ḥibbī abū l-qāsim
- id: h-1358.2-nasr
  ref: Jāmiʿ 9:1358.2
  unit: hadith-9-bowing-prostration-formulas-1
  agent: the prophet
  action: says in bowing and prostration
  quoted: subḥānaka llāhumma rabbanā wa-bi-ḥamdika llāhumma ghfir lī - yataʾawwalu l-qurʾān
- id: h-1359.1-night
  ref: Jāmiʿ 9:1359.1
  unit: hadith-9-bowing-prostration-formulas-1
  agent: Aisha
  action: searches for him at night thinking he went to another wife
  outcome: finds him bowing or prostrating
  time: night
  quoted: innī la-fī shaʾn wa-innaka la-fī ākhar
- id: h-1359.3-subbuh
  ref: Jāmiʿ 9:1359.3
  unit: hadith-9-bowing-prostration-formulas-1
  agent: the prophet
  action: says in bowing and prostration
  name: Lord of the angels and the spirit
  quoted: subbūḥun quddūsun rabbu l-malāʾikati wa-l-rūḥ
- id: h-1360.1-verses
  ref: Jāmiʿ 9:1360.1
  unit: hadith-9-bowing-prostration-formulas-1
  agent: the prophet
  action: stops at verses of mercy to ask and of punishment to seek refuge
  quoted: subḥāna rabbiya l-ʿaẓīm ... subḥāna rabbiya l-aʿlā
- id: h-1360.2-sins
  ref: Jāmiʿ 9:1360.2
  unit: hadith-9-bowing-prostration-formulas-1
  agent: the prophet
  action: asks forgiveness in prostration
  object:
  - small and great
  - first and last
  - open and secret
  quoted: diqqahu wa-jillahu wa-awwalahu wa-ākhirahu
- id: h-1360.3-face
  ref: Jāmiʿ 9:1360.3
  unit: hadith-9-bowing-prostration-formulas-2
  agent: the prophet
  action: says in prostration
  object: my face
  name: best of creators
  quoted: sajada wajhī lilladhī khalaqahu wa-ṣawwarahu wa-shaqqa samʿahu wa-baṣarahu, tabāraka llāhu aḥsanu l-khāliqīn
- id: h-1360.3-bowing
  ref: Jāmiʿ 9:1360.3
  unit: hadith-9-bowing-prostration-formulas-2
  agent: the prophet
  action: says in bowing
  object:
  - hearing
  - sight
  - marrow
  - bone
  - sinew
  quoted: khashaʿa laka samʿī wa-baṣarī wa-mukhkhī wa-ʿaẓmī wa-ʿaṣabī
- id: h-1360.4-night
  ref: Jāmiʿ 9:1360.4
  unit: hadith-9-bowing-prostration-formulas-2
  agent: the prophet
  action: recites al-Baqara, bows and prostrates as long as he stood, then recites Al Imran
  time: at night
  quoted: subḥāna dhī l-jabarūti wa-l-malakūti wa-l-kibriyāʾi wa-l-ʿaẓama
- id: h-1361.2-bowing
  ref: Jāmiʿ 9:1361.2
  unit: hadith-9-bowing-prostration-formulas-2
  agent: the prophet
  action: says in bowing
  object:
  - hearing
  - sight
  - blood
  - flesh
  - bone
  - sinew
  quoted: damī wa-laḥmī wa-ʿaẓmī wa-ʿaṣabī li-llāhi rabbi l-ʿālamīn
- id: h-1361.5-three
  ref: Jāmiʿ 9:1361.5
  unit: hadith-9-bowing-prostration-formulas-2
  agent: the prophet
  action: glorifies
  object: '''glory to my Lord the Great'' / ''the Most High'''
  number: 3
  quoted: thalātha marrāt
- id: h-1363.1-light
  ref: Jāmiʿ 9:1363.1
  unit: hadith-9-light-prayer
  agent: the prophet
  action: asks for light
  object:
  - heart
  - hearing
  - sight
  - beneath
  - above
  - right
  - left
  - before
  - behind
  time: in prostration at night
  place: Maymuna's house
  quoted: ijʿal fī qalbī nūran ... wa-aʿẓim lī nūran
- id: h-1363.1-bilal
  ref: Jāmiʿ 9:1363.1
  unit: hadith-9-light-prayer
  agent: Bilal
  action: wakes him for prayer
  time: after he slept till he breathed heavily
  quoted: thumma nāma ḥattā nafakha
- id: h-1364.1-linger
  ref: Jāmiʿ 9:1364.1
  unit: hadith-9-between-prostrations
  agent: the prophet (and Anas)
  action: stands after bowing and sits between prostrations a long time
  outcome: one would say he has forgotten
  quoted: 'ḥattā yaqūla l-qāʾil: qad nasiya'
- id: h-1364.2-forgive
  ref: Jāmiʿ 9:1364.2
  unit: hadith-9-between-prostrations
  agent: the prophet
  action: says between the prostrations
  number: 2
  quoted: rabbi ghfir lī rabbi ghfir lī
- id: h-1365.1-five
  ref: Jāmiʿ 9:1365.1
  unit: hadith-9-between-prostrations
  agent: the prophet
  action: asks between the prostrations
  object:
  - forgive
  - mercy
  - wellbeing
  - guidance
  - provision
  number: 5
  quoted: ighfir lī wa-rḥamnī wa-ʿāfinī wa-hdinī wa-rzuqnī
- id: h-1366.1-equal
  ref: Jāmiʿ 9:1366.1
  unit: hadith-9-between-prostrations
  agent: the prophet
  action: makes the pillars nearly equal
  object:
  - bowing
  - prostration
  - rising from bowing
  - sitting between prostrations
  quoted: qarīban min al-sawāʾ
- id: h-1367.1-53
  ref: Jāmiʿ 9:1367.1
  unit: hadith-9-tashahhud-sitting
  agent: the prophet
  action: makes the count sign fifty-three and points the index finger
  time: seated in the tashahhud
  number: 53
  quoted: ʿaqada thalāthatan wa-khamsīn wa-ashāra bi-l-sabbāba
- id: h-1367.2-foot
  ref: Jāmiʿ 9:1367.2
  unit: hadith-9-tashahhud-sitting
  agent: the prophet
  action: puts the left foot between thigh and shin, thumb on middle finger
  object: left palm 'feeds' the knee
  quoted: yulqimu kaffahu l-yusrā rukbatahu
- id: h-1368.1-pebbles
