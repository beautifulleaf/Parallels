  ref: Jāmiʿ 9:1378.1
  unit: hadith-9-tashahhud-forms
  agent: the greeting 'peace on us and God's righteous servants'
  action: reaches
  recipient: every righteous servant in heaven and earth
  quoted: aṣābat kulla ʿabdin li-llāhi ṣāliḥin fī l-samāʾi wa-l-arḍ
- id: h-1379.1-sura
  ref: Jāmiʿ 9:1379.1
  unit: hadith-9-tashahhud-forms
  agent: the prophet
  action: teaches the tashahhud as a sura of the Quran
  quoted: al-taḥiyyātu l-mubārakātu l-ṣalawātu l-ṭayyibātu li-llāh
- id: h-1381.1-added
  ref: Jāmiʿ 9:1381.1
  unit: hadith-9-tashahhud-forms
  agent: Ibn Umar
  action: adds words to the tashahhud
  object:
  - wa-barakātuh
  - waḥdahu lā sharīka lah
  quoted: zidtu fīhā
- id: h-1382.1-pulpit
  ref: Jāmiʿ 9:1382.1
  unit: hadith-9-tashahhud-forms
  agent: Umar b. al-Khattab
  action: teaches the tashahhud
  place: the pulpit
  quoted: al-taḥiyyātu li-llāh, al-zākiyātu li-llāh, al-ṭayyibātu li-llāh, al-ṣalawātu li-llāh
- id: h-1382.2-aisha
  ref: Jāmiʿ 9:1382.2
  unit: hadith-9-tashahhud-forms
  agent: Aisha
  action: says the tashahhud, ending with 'peace be upon you'
  quoted: al-salāmu ʿalaykum
- id: h-1382.3-abraham
  ref: Jāmiʿ 9:1382.3
  unit: hadith-9-blessing-on-prophet
  agent: the Companions
  action: ask how to bless him
  outcome: '''as you blessed the family of Abraham'''
  name:
  - Muhammad
  - Abraham
  object:
  - his wives
  - his offspring
  quoted: kamā ṣallayta ʿalā āli ibrāhīm ... innaka ḥamīdun majīd
- id: h-1383.1-silent
  ref: Jāmiʿ 9:1383.1
  unit: hadith-9-blessing-on-prophet
  agent: Bashir b. Sad
  action: asks how to bless him
  place: the gathering of Sad b. Ubada
  outcome: the prophet is silent until they wish he had not asked
  quoted: amaranā llāhu an nuṣalliya ʿalayka ... fī l-ʿālamīn
- id: h-1383.2-gift
  ref: Jāmiʿ 9:1383.2
  unit: hadith-9-blessing-on-prophet
  agent: Kab b. Ujra
  action: gives as a gift the formula of blessing
  recipient: Abd al-Rahman b. Abi Layla
  quoted: a-lā uhdī laka hadiyyatan
