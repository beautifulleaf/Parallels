  action: forbids playing with pebbles and shows the hand
  recipient: Ali b. Abd al-Rahman al-Muawi
  object: all fingers closed, the one next to the thumb pointing
  quoted: aʿbathu bi-l-ḥaṣbāʾ
- id: h-1368.2-legs
  ref: Jāmiʿ 9:1368.2
  unit: hadith-9-tashahhud-sitting
  agent: Ibn Umar
  action: sits cross-legged and forbids his son
  outcome: his legs do not carry him
  quoted: inna rijlayya lā taḥmilānī
- id: h-1369.1-burnus
  ref: Jāmiʿ 9:1369.1
  unit: hadith-9-tashahhud-sitting
  agent: Wail b. Hujr
  action: returns the next year
  outcome: sees them raising hands inside their cloaks
  object: barānis
  time: the following year
  quoted: yarfaʿūna aydiyahum min al-barānis
- id: h-1369.2-tawarruk
  ref: Jāmiʿ 9:1369.2
  unit: hadith-9-tashahhud-sitting
  agent: the prophet
  action: puts the left foot forward and sits on his seat
  time: the last rak'a
  quoted: qaʿada ʿalā maqʿadatihi
- id: h-1372.1-forgot
  ref: Jāmiʿ 9:1372.1
  unit: hadith-9-first-tashahhud
  agent: the prophet
  action: stands up after two rak'as without sitting
  outcome: two prostrations before the salam
  number: 2
  time: the noon prayer
  quoted: fa-sajada sajdatayni qabla an yusallima
- id: h-1373.4-iron
  ref: Jāmiʿ 9:1373.4
  unit: hadith-9-index-finger
  agent: Ibn Umar
  action: points the finger and follows it with his eyes
  object: the index finger
  recipient: Satan
  quoted: la-hiya ashaddu ʿalā l-shayṭāni min al-ḥadīd
- id: h-1375.1-ring
  ref: Jāmiʿ 9:1375.1
  unit: hadith-9-index-finger
  agent: the prophet
  action: closes two fingers, rings thumb and middle, points the index
  quoted: qabaḍa thnatayni wa-ḥallaqa ḥalqatan
- id: h-1376.1-gaze
  ref: Jāmiʿ 9:1376.1
  unit: hadith-9-index-finger
  agent: the prophet
  action: points the index finger, gaze not passing it
  quoted: lā yujāwizu baṣaruhu ishāratahu
- id: h-1376.2-one
  ref: Jāmiʿ 9:1376.2
  unit: hadith-9-index-finger
  agent: the prophet
  action: tells a man supplicating with two fingers to use one
  recipient: Sad b. Abi Waqqas
  number: 1
  quoted: aḥḥid aḥḥid
- id: h-1377.2-silent
  ref: Jāmiʿ 9:1377.2
  unit: hadith-9-index-finger
  action: the tashahhud is said silently
  quoted: min al-sunna an yukhfī l-tashahhud
- id: h-1378.1-peace
  ref: Jāmiʿ 9:1378.1
  unit: hadith-9-tashahhud-forms
  agent: the Companions
  action: say 'peace on Gabriel and Michael'
  name:
  - Gabriel
  - Michael
  - al-Salām
  outcome: 'told: God is Peace; say ''the greetings are God''s'''
  quoted: al-salāmu ʿalā jibrīla wa-mīkāʾīl ... inna llāha huwa l-salām
