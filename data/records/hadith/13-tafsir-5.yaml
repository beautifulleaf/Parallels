  - {id: "h-7216.1-build", ref: "Jāmiʿ 60:7216.1", unit: "hadith-60-hagar-ishmael-and-the-house", agent: ["Abraham", "Ishmael"], action: "raise the foundations of the House", instrument: "the stone Abraham stands on", place: "a raised hillock near Zamzam", quoted: "rabbana taqabbal minna"}
  - {id: "h-7219.1-forty", ref: "Jāmiʿ 60:7219.1", unit: "hadith-60-first-mosques-forty-years", object: ["the Sacred Mosque", "the Aqsa Mosque"], number: "40 years between them", quoted: "arba'una sana"}
