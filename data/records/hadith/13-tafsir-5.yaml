  - {id: "h-7275.2-sins", ref: "Jāmiʿ 60:7275.2", unit: "hadith-60-greatest-sins-and-repentance", agent: "the prophet", action: "names the greatest sins", number: "3", object: ["a rival to God", "killing one's child for fear of its eating", "zina with a neighbour's wife"], outcome: "Q 25:68 revealed in confirmation", quoted: "an tazaniya bi-halilat jarik"}
  - {id: "h-7276.3-last", ref: "Jāmiʿ 60:7276.3", unit: "hadith-60-greatest-sins-and-repentance", agent: "the last man out of the fire", action: "is shown his small sins only", outcome: "each made a good deed; he asks after the great ones; the prophet laughs", quoted: "fa-inna laka makan kull sayyi'a hasana"}
  - {id: "h-7277.1-abu-tawil", ref: "Jāmiʿ 60:7277.1", unit: "hadith-60-greatest-sins-and-repentance", agent: "Abu Tawil Shatb al-Mamdud", action: "asks if one who did every sin may repent", outcome: "told his sins become good; leaves crying 'God is greatest'", quoted: "wa-ghadarati wa-fajarati"}
  - {id: "h-7278.1-miqdad", ref: "Jāmiʿ 60:7278.1", unit: "hadith-60-coolness-of-eyes-in-family", agent: "al-Miqdad b. al-Aswad", action: "rebukes a man for wishing he had seen the prophet", outcome: "a believer with kin in the fire has no coolness of eye", quoted: "fa-la taqarru 'aynuhu"}
  - {id: "h-7279.1-five", ref: "Jāmiʿ 60:7279.1", unit: "hadith-60-five-signs-passed", agent: "Ibn Mas'ud", object: ["the smoke", "the moon", "the Romans", "the great seizure", "al-lizam"], number: "5", outcome: "already passed", quoted: "khams qad madayna"}
  # ---- al-Shuara
  - {id: "h-7281.1-ashura", ref: "Jāmiʿ 60:7281.1", unit: "hadith-60-ashura-thanks-for-deliverance", agent: "Moses", action: "fasts in thanks", time: "Ashura", outcome: "Pharaoh's people drowned; the prophet fasts and orders it", quoted: "fa-sama Musa shukran li-llah"}
  - {id: "h-7282.1-azar", ref: "Jāmiʿ 60:7282.1", unit: "hadith-60-abraham-and-azar-at-resurrection", agent: "Abraham", action: "reminds God of his promise not to disgrace him", recipient: "God", object: "his father Azar", outcome: "Azar becomes a besmeared hyena and is thrown in the fire by its legs", name: "Azar", quoted: "fa-idha huwa bi-dhikh multatikh"}
  - {id: "h-7282.2-dip", ref: "Jāmiʿ 60:7282.2", unit: "hadith-60-dipped-once-in-fire-or-garden", agent: "God", action: "dips the most comfortable damned once in the fire and the most wretched blessed once in paradise", number: "1 dip", outcome: "neither remembers good or hardship", quoted: "fa-yusbaghu fi l-nar sabgha"}
  - {id: "h-7282.3-nakhla", ref: "Jāmiʿ 60:7282.3", unit: "hadith-60-devils-barred-from-heaven", agent: "jinn sent toward Tihama", action: "hear the prophet reciting", place: "Nakhla on the way to Ukaz", time: "dawn prayer", outcome: "know the cause of the meteors", quoted: "hadha wallahi alladhi hala baynakum wa-bayna khabar al-sama'"}
  - {id: "h-7283.1-nine", ref: "Jāmiʿ 60:7283.1", unit: "hadith-60-devils-barred-from-heaven", agent: "jinn", action: "add nine to each heard word", number: "9", outcome: "barred by meteors; Iblis sends troops and finds the prophet praying between two mountains at Mecca", quoted: "zadu fiha tis'an"}
  - {id: "h-7283.2-safa", ref: "Jāmiʿ 60:7283.2", unit: "hadith-60-warn-your-nearest-kin", agent: "the prophet", action: "calls the clans from Safa", place: "Safa", outcome: "Abu Lahab says 'perish you'; sura 111 revealed", quoted: "tabban laka sa'ir al-yawm a-li-hadha jama'tana"}
  - {id: "h-7284.4-scout", ref: "Jāmiʿ 60:7284.4", unit: "hadith-60-warn-your-nearest-kin", agent: "the prophet", action: "climbs a rock-heap and cries as a scout", recipient: "Banu Abd Manaf", instrument: "parable of a man who sees the enemy", quoted: "ya sabahah"}
  - {id: "h-7285.1-hen", ref: "Jāmiʿ 60:7285.1", unit: "hadith-60-soothsayers-stolen-word", agent: "a jinni", action: "snatches a true word and cackles it into his friend's ear", instrument: "like a hen's clucking", outcome: "mixed with over a hundred lies", number: "100", quoted: "ka-qarqarat al-dajaja"}
  - {id: "h-7285.2-clouds", ref: "Jāmiʿ 60:7285.2", unit: "hadith-60-soothsayers-stolen-word", agent: "angels", action: "speak of decrees in the clouds", place: "al-'anan (the clouds)", outcome: "devils steal it and pass it to soothsayers", quoted: "inna al-mala'ika tanzilu fi l-'anan"}
  - {id: "h-7286.1-pus", ref: "Jāmiʿ 60:7286.1", unit: "hadith-60-poets-and-poetry", agent: "the prophet", action: "orders a reciting poet seized", place: "al-Arj", outcome: "belly full of pus better than of poetry", quoted: "khudhu al-shaytan"}
  - {id: "h-7287.2-gabriel", ref: "Jāmiʿ 60:7287.2", unit: "hadith-60-poets-and-poetry", agent: "the prophet", action: "tells Hassan to satirise them", recipient: "Hassan", outcome: "Gabriel with him", quoted: "uhjuhum wa-Jibril ma'aka"}
  # ---- al-Naml
  - {id: "h-7288.1-inheritance", ref: "Jāmiʿ 60:7288.1", unit: "hadith-60-prophets-leave-no-inheritance", agent: "the prophet's wives", action: "would send Uthman to ask their inheritance", recipient: "Abu Bakr", outcome: "Aisha cites 'we leave no heirs'", quoted: "la nurathu ma tarakna fa-huwa sadaqa"}
  - {id: "h-7288.2-needle", ref: "Jāmiʿ 60:7288.2", unit: "hadith-60-o-my-servants", agent: "God", action: "says all requests granted would lessen his store", instrument: "a needle dipped in the sea", quoted: "kama yanqusu al-mikhyat idha udkhila al-bahr"}
  - {id: "h-7289.1-distress", ref: "Jāmiʿ 60:7289.1", unit: "hadith-60-who-answers-the-distressed", agent: "the prophet", action: "describes God who answers", recipient: "a man of Bal-Hujaym", object: ["harm", "lost in a waste", "drought"], quoted: "idha dalalta bi-ard qafr da'awtahu radda 'alayka"}
  - {id: "h-7289.2-gabriel", ref: "Jāmiʿ 60:7289.2", unit: "hadith-60-gabriel-asks-and-the-hour-unknown", agent: "Gabriel", action: "questions the prophet on faith, islam, ihsan and the Hour", outcome: "vanishes when sought", number: "5 things God alone knows", quoted: "hadha Jibril ja'a li-yu'allima al-nas dinahum"}
  - {id: "h-7290.1-ten", ref: "Jāmiʿ 60:7290.1", unit: "hadith-60-the-beast-and-ten-signs", object: "signs before the Hour", number: "10", name: ["the smoke", "the Dajjal", "the beast", "sun from the west", "Jesus son of Mary", "Gog and Magog", "three swallowings", "fire from Yemen"], quoted: "lan taquma hatta taraw qablaha 'ashr ayat"}
  - {id: "h-7291.1-horn", ref: "Jāmiʿ 60:7291.1", unit: "hadith-60-trumpet-horn-and-exempted", agent: "a bedouin", action: "asks what the trumpet is", object: "al-sur", outcome: "'a horn that is blown'", quoted: "qarn yunfakhu fihi"}
  - {id: "h-7291.2-martyrs", ref: "Jāmiʿ 60:7291.2", unit: "hadith-60-trumpet-horn-and-exempted", agent: "Gabriel", action: "names those exempted from the swoon", object: "martyrs girt with swords", place: "around the Throne", instrument: "ruby camels", outcome: "God laughs to them; no reckoning", quoted: "hum al-shuhada' al-mutaqalliduna asyafahum hawla 'arsh al-Rahman"}
  - {id: "h-7292.1-moses", ref: "Jāmiʿ 60:7292.1", unit: "hadith-60-trumpet-horn-and-exempted", agent: "Moses", action: "holds a leg of the Throne when the prophet first wakes", outcome: "perhaps recompensed for his swoon at the mount", quoted: "am juziya bi-sa'qat al-Tur"}
  - {id: "h-7292.3-sacred", ref: "Jāmiʿ 60:7292.3", unit: "hadith-60-sanctity-of-mecca", agent: "God", action: "made Mecca sacred", time: "the day he created heavens and earth", outcome: "lawful to the prophet one hour of a day; idhkhir excepted", object: ["thorns", "game", "lost property", "fresh grass"], quoted: "illa al-idhkhir"}
  # ---- al-Qasas
  - {id: "h-7294.1-term", ref: "Jāmiʿ 60:7294.1", unit: "hadith-60-moses-fulfilled-the-longer-term", agent: "a Jew of al-Hira", action: "asks which term Moses fulfilled", recipient: "Sa'id b. Jubayr", outcome: "Ibn Abbas says the longer and better", number: ["8", "10 years"], quoted: "qada aktharahuma wa-atyabahuma"}
  - {id: "h-7295.2-destroyed", ref: "Jāmiʿ 60:7295.2", unit: "hadith-60-no-people-destroyed-after-moses", agent: "God", action: "destroyed peoples by punishment from sky or earth", time: "only before Moses", quoted: "illa qabla Musa"}
  - {id: "h-7296.2-two-rewards", ref: "Jāmiʿ 60:7296.2", unit: "hadith-60-scripture-folk-rewarded-twice", object: "three with two rewards", number: "3", name: ["a scripture man believing in his prophet and Muhammad", "a slave dutiful to God and master", "a man who educates, frees and marries his slave-girl"], quoted: "thalatha lahum ajran"}
  - {id: "h-7297.2-abu-talib", ref: "Jāmiʿ 60:7297.2", unit: "hadith-60-abu-talib-dies-unbelieving", agent: "Abu Talib", action: "refuses the shahada at death", recipient: "the prophet", name: ["Abu Jahl", "Abd Allah b. Abi Umayya"], outcome: "dies 'on the religion of Abd al-Muttalib'; Q 9:113 and 28:56 revealed", quoted: "'ala millat 'Abd al-Muttalib"}
  - {id: "h-7298.2-finger", ref: "Jāmiʿ 60:7298.2", unit: "hadith-60-world-a-finger-in-the-sea", object: "the world beside the hereafter", instrument: "a finger dipped in the sea", quoted: "fa-l-yanzur bi-ma yarji'"}
  - {id: "h-7299.1-salman", ref: "Jāmiʿ 60:7299.1", unit: "hadith-60-give-each-his-due-salman", agent: "Salman", action: "makes his fasting host eat and stops his night prayer until its last part", recipient: "Abu l-Darda'", outcome: "the prophet says 'Salman spoke truly'", quoted: "inna li-rabbika 'alayka haqqan"}
  - {id: "h-7299.2-swallowed", ref: "Jāmiʿ 60:7299.2", unit: "hadith-60-strutting-man-swallowed-by-earth", agent: "God", action: "makes the earth swallow a strutting man", object: "man in a fine robe with combed hair", time: "sinking until resurrection", quoted: "fa-huwa yatajaljalu ila yawm al-qiyama"}
