  - {id: "h-7199.1-hasbuna", ref: "Jāmiʿ 60:7199.1", unit: "hadith-60-abraham-in-the-fire-gecko-frog", agent: "Abraham", action: "says 'God suffices us'", time: "when thrown into the fire", quoted: "hasbuna Allah wa-ni'ma al-wakil"}
  - {id: "h-7199.2-gecko", ref: "Jāmiʿ 60:7199.2", unit: "hadith-60-abraham-in-the-fire-gecko-frog", agent: "the gecko", action: "blew on Abraham's fire", outcome: "ordered to be killed", quoted: "kana yanfukhu 'ala Ibrahim"}
