  - {id: "h-7207.2-curse", ref: "Jāmiʿ 60:7207.2", unit: "hadith-60-sent-as-mercy-not-curser", agent: "the prophet", action: "asks that curses spoken in anger become blessing", quoted: "fa-j'alha 'alayhim salatan yawm al-qiyama"}
