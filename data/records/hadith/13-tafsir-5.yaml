# Observation records for hadith chunk 13 (al-Jāmiʿ al-Kāmil book 60, tafsir, pp. 7180-7299: Q 20:41 to 28:81).
records:
  # ---- Taha
  - {id: "h-7187.1-adam-moses", ref: "Jāmiʿ 60:7187.1", unit: "hadith-60-adam-moses-chosen-for-himself", agent: ["Adam", "Moses"], action: "argue over the expulsion from the garden", outcome: "Adam wins the argument", name: "Moses chosen 'for himself'", quoted: "fa-hajja Adamu Musa"}
  - {id: "h-7191.1-forty", ref: "Jāmiʿ 60:7191.1", unit: "hadith-60-adam-moses-forty-years", agent: "Adam", action: "asks Moses how long before his creation the Torah was written", object: "the Torah", number: "40 years", outcome: "Moses finds 'Adam disobeyed his Lord' in it", quoted: "bi-arba'in 'aman"}
  - {id: "h-7191.1-tablets", ref: "Jāmiʿ 60:7191.1", unit: "hadith-60-adam-moses-forty-years", agent: "God", action: "gives Moses the tablets", object: "tablets with the explanation of everything", recipient: "Moses", quoted: "a'taka al-alwah fiha tibyan kull shay' wa-qarrabaka najiyyan"}
  - {id: "h-7188.1-letter", ref: "Jāmiʿ 60:7188.1", unit: "hadith-60-peace-on-who-follows-guidance-letter", agent: "the prophet", action: "sends a letter opening with peace on followers of guidance", recipient: "Heraclius", instrument: "Dihya via the governor of Busra", quoted: "salam 'ala man ittaba'a al-huda ... aslim taslam"}
  - {id: "h-7188.2-charcoal", ref: "Jāmiʿ 60:7188.2", unit: "hadith-60-sinners-charred-then-revived", agent: "God", action: "makes believing sinners die in the fire", object: "sinners", outcome: "brought out as charcoal and sprout on paradise's rivers like seed in flood-silt", quoted: "hatta idha kanu fahman ... fa-yanbutuna nabat al-habba"}
  - {id: "h-7188.3-chambers", ref: "Jāmiʿ 60:7188.3", unit: "hadith-60-upper-chambers-and-hundred-degrees", agent: "people of paradise", action: "look up at the dwellers of the upper chambers", instrument: "simile of a brilliant star setting on the horizon", quoted: "al-kawkab al-durri al-ghabir fi l-ufuq"}
  - {id: "h-7189.1-degrees", ref: "Jāmiʿ 60:7189.1", unit: "hadith-60-upper-chambers-and-hundred-degrees", object: "degrees of paradise", number: "100", place: "Firdaws the highest", outcome: "four rivers gush from it, the Throne above", quoted: "mi'at daraja ... wa-minha tufajjaru anhar al-janna al-arba'a"}
  - {id: "h-7189.2-ashura", ref: "Jāmiʿ 60:7189.2", unit: "hadith-60-ashura-moses-victory", agent: "the Jews of Medina", action: "fast Ashura", time: "day Moses prevailed over Pharaoh", outcome: "the prophet orders it fasted", name: "Ashura", quoted: "nahnu awla bi-Musa minhum fa-sumuhu"}
  - {id: "h-7189.3-intercession", ref: "Jāmiʿ 60:7189.3", unit: "hadith-60-intercession-chain", agent: "the believers", action: "ask prophet after prophet to intercede", name: ["Adam", "Noah", "Abraham", "Moses", "Jesus", "Muhammad"], outcome: "Muhammad prostrates and intercedes", number: "4 returns", quoted: "lastu hunakum ... ummu al-rabi'a"}
  - {id: "h-7189.3-faults", ref: "Jāmiʿ 60:7189.3", unit: "hadith-60-intercession-chain", agent: "prophets", action: "decline citing a fault", object: ["Adam's sin", "Noah's asking without knowledge", "Moses' killing"], quoted: "wa-yadhkuru qatl al-nafs bi-ghayr nafs"}
  - {id: "h-7190.3-bankrupt", ref: "Jāmiʿ 60:7190.3", unit: "hadith-60-injustice-darkness-and-bankrupt", agent: "the bankrupt of the community", action: "comes with prayer, fast and alms but having wronged others", outcome: "his good deeds paid out, their sins put on him, thrown in the fire", quoted: "inna al-muflis min ummati"}
  - {id: "h-7191.2-dragons", ref: "Jāmiʿ 60:7191.2", unit: "hadith-60-straitened-life-is-grave-torment", object: "the unbeliever", place: "the grave", agent: "dragons", number: ["99 dragons", "70 snakes", "70 heads"], action: "bite and scratch", time: "until resurrection", quoted: "tis'a wa-tis'una tinninan"}
  - {id: "h-7191.2-garden", ref: "Jāmiʿ 60:7191.2", unit: "hadith-60-straitened-life-is-grave-torment", object: "the believer's grave", action: "is widened and lit", number: "70 cubits", outcome: "a green garden lit like the full moon", quoted: "rawda khadra' ... sab'una dhira'an"}
  - {id: "h-7192.2-moon", ref: "Jāmiʿ 60:7192.2", unit: "hadith-60-seeing-the-lord-and-dawn-afternoon-prayers", agent: "the prophet", action: "looks at the full moon and promises sight of God", time: "night of the full moon", quoted: "sa-tarawna rabbakum kama tarawna hadha l-qamar"}
  - {id: "h-7193.1-mat", ref: "Jāmiʿ 60:7193.1", unit: "hadith-60-do-not-crave-the-worlds-flower", agent: "Umar", action: "weeps at the mark of the mat on the prophet's side", place: "the upper room (mashraba)", object: ["mat", "leather pillow stuffed with fibre", "tanning leaves", "hanging hides"], name: ["Chosroes", "Caesar"], quoted: "ama tarda an takuna lahum al-dunya wa-lana al-akhira"}
  - {id: "h-7193.2-grazer", ref: "Jāmiʿ 60:7193.2", unit: "hadith-60-do-not-crave-the-worlds-flower", agent: "a grazing beast", action: "eats green fodder, turns to the sun, chews the cud, voids, returns", outcome: "survives where spring growth kills by bloating", quoted: "illa akilat al-khadir"}
  - {id: "h-7194.1-water", ref: "Jāmiʿ 60:7194.1", unit: "hadith-60-waking-spouse-for-night-prayer", agent: "husband or wife", action: "sprinkles water in the spouse's face", time: "night", outcome: "God's mercy on them", quoted: "nadaha fi wajhiha al-ma'"}
  - {id: "h-7194.3-dates", ref: "Jāmiʿ 60:7194.3", unit: "hadith-60-waking-spouse-for-night-prayer", agent: "the prophet", action: "dreams of being brought fresh dates", place: "house of Uqba b. Rafi'", name: "Ibn Tab dates", outcome: "read as height, good end and a sound religion", quoted: "wa-anna dinana qad taba"}
  # ---- al-Anbiya
  - {id: "h-7196.1-suras", ref: "Jāmiʿ 60:7196.1", unit: "hadith-60-ancient-suras-of-ibn-masud", agent: "Ibn Mas'ud", object: ["Banu Israil", "al-Kahf", "Maryam", "Taha", "al-Anbiya"], number: "5", quoted: "min al-'itaq al-uwal wa-hunna min tiladi"}
  - {id: "h-7196.2-creak", ref: "Jāmiʿ 60:7196.2", unit: "hadith-60-heaven-creaks-angels-in-every-span", agent: "the prophet", action: "hears the heaven creak", object: "angels prostrating or standing", number: "one per handspan", quoted: "atit al-sama' ... wa-ma fiha mawdi' shibr illa wa-'alayhi malak"}
  - {id: "h-7197.1-water", ref: "Jāmiʿ 60:7197.1", unit: "hadith-60-everything-from-water", agent: "the prophet", action: "answers what everything was made of", object: "water", quoted: "kull shay' khuliqa min ma'"}
  - {id: "h-7198.2-card", ref: "Jāmiʿ 60:7198.2", unit: "hadith-60-scales-two-words-and-the-card", agent: "God", action: "weighs a man's scrolls against a card", number: "99 scrolls", instrument: "two pans of the balance", object: "card with the two testimonies", outcome: "the scrolls fly up, the card is heavier", quoted: "fa-tashat al-sijillat wa-thaqulat al-bitaqa"}
  - {id: "h-7198.3-lies", ref: "Jāmiʿ 60:7198.3", unit: "hadith-60-abrahams-three-lies-sarah", agent: "Abraham", action: "told three lies", number: "3", object: ["I am sick", "their biggest did it", "Sarah as his sister"], quoted: "thalath kadhabat: thintayn fi dhat Allah"}
  - {id: "h-7198.3-sister", ref: "Jāmiʿ 60:7198.3", unit: "hadith-60-abrahams-three-lies-sarah", agent: "Abraham", action: "tells Sarah to say she is his sister", recipient: "a tyrant king", place: "the tyrant's land", quoted: "fa-innaki ukhti fi l-islam"}
