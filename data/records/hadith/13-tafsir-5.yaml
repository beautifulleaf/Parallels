  - {id: "h-7219.4-ten", ref: "Jāmiʿ 60:7219.4", unit: "hadith-60-ten-days-of-dhu-l-hijja", object: "deeds", time: "first ten days of Dhu l-Hijja", number: "10", outcome: "better than jihad except one who returns with nothing", quoted: "illa rajul kharaja yukhatiru bi-nafsihi wa-malihi"}
