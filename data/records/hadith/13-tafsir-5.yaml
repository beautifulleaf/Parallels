  - {id: "h-7201.1-knife", ref: "Jāmiʿ 60:7201.1", unit: "hadith-60-solomons-judgment-of-two-women", agent: "Solomon", action: "calls for a knife to split the child", instrument: "knife (sikkin)", recipient: "two women", outcome: "gives the child to the younger, who refused", quoted: "i'tuni bi-l-sikkin ashuqquhu baynakuma"}
