# Observation records for hadith chunk 12 (al-Jāmiʿ al-Kāmil book 60, tafsir of Q 9:81 - 20:40, pp. 7060-7179).
records:
  # ---- al-Tawba
  - {id: h-7061.1-fire, ref: "Jāmiʿ 60:7061.1", unit: hadith-60-q9-worldly-fire-one-seventieth, object: the fire people kindle, action: is a fraction of hell's fire, number: [70, 69], quoted: "juz' min sab'in juz'an min nar jahannam ... fuddilat 'alayha bi-tis'a wa-sittin juz'an"}
  - {id: h-7061.2-molars, ref: "Jāmiʿ 60:7061.2", unit: hadith-60-q9-irbad-farewell-admonition, agent: the prophet, action: gives an admonition after the dawn prayer, recipient: companions, outcome: eyes shed tears; taken as a farewell, quoted: ["ka-anna hadhihi maw'izat muwaddi'", "wa-in kana 'abdan habashiyyan", "'addu 'alayha bi-l-nawajidh"]}
  - {id: h-7062.2-city, ref: "Jāmiʿ 60:7062.2", unit: hadith-60-q9-mixed-deeds-city-of-gold-bricks, agent: two visitors, action: lead the prophet to a city, place: city of bricks of gold and silver, object: men half fair half ugly, outcome: fall into a river and come out fair, name: Jannat 'Adn, quoted: "khalatu 'amalan salihan wa-akhara sayyi'an tajawaza allahu 'anhum"}
  - {id: h-7063.1-pillars, ref: "Jāmiʿ 60:7063.1", unit: hadith-60-q9-men-tied-to-pillars, agent: laggards of Tabuk, action: bind themselves to the mosque pillars, place: the mosque, number: [10, 7], name: Abu Lubaba, outcome: released after the verse; bring their wealth as alms, quoted: "awthaqa sab'a minhum anfusahum bi-sawari al-masjid"}
  - {id: h-7063.2-six, ref: "Jāmiʿ 60:7063.2", unit: hadith-60-q9-men-tied-to-pillars, agent: three laggards, action: bind themselves to the pillars and bring their wealth, number: [6, 3], name: [Abu Lubaba, Aws b. Khidham, Tha'laba b. Wadi'a, Ka'b b. Malik, Murara b. al-Rabi', Hilal b. Umayya], quoted: "la uhilluhum hatta yakuna qital"}
  - {id: h-7064.1-bless, ref: "Jāmiʿ 60:7064.1", unit: hadith-60-q9-blessing-on-alms-givers, agent: the prophet, action: blesses the family of the alms-bringer, recipient: family of Abu Awfa, quoted: "allahumma salli 'ala ali abi awfa"}
  - {id: h-7064.2-hand, ref: "Jāmiʿ 60:7064.2", unit: hadith-60-q9-god-accepts-repentance-and-alms, agent: God, action: stretches out his hand for repentance, time: [by night for the day's sinner, by day for the night's sinner, until the sun rises from the west], quoted: "yabsutu yadahu bi-l-layl li-yatuba musi' al-nahar"}
  - {id: h-7064.3-foal, ref: "Jāmiʿ 60:7064.3", unit: hadith-60-q9-god-accepts-repentance-and-alms, agent: God (al-Rahman), action: receives a lawful charity in his hand and rears it, instrument: his hand, object: charity, quoted: "fa-yurabbiha kama yurabbi ahadukum falwahu wa-wasifahu aw fasilahu"}
  - {id: h-7065.1-caesar, ref: "Jāmiʿ 60:7065.1", unit: hadith-60-q9-mosque-of-harm-and-of-piety, agent: Abu Amir, action: urges the builders to arm while he goes for a Roman army, recipient: Ansari builders of a mosque, name: Qaysar malik al-Rum, quoted: "fa-inni dhahib ila qaysar malik al-rum fa-ati bi-jund"}
  - {id: h-7066.2-pebbles, ref: "Jāmiʿ 60:7066.2", unit: hadith-60-q9-mosque-of-harm-and-of-piety, agent: the prophet, action: strikes the ground with a handful of pebbles, instrument: handful of pebbles, place: Medina, outcome: names the Medina mosque as founded on piety, quoted: "fa-akhadha kaffan min hasba' fa-daraba bihi al-ard ... huwa masjidukum hadha"}
  - {id: h-7066.1-quba, ref: "Jāmiʿ 60:7066.1", unit: hadith-60-q9-mosque-of-harm-and-of-piety, agent: the prophet, action: founds the mosque on piety, place: Banu Amr b. Awf (Quba'), time: some ten nights after arrival, outcome: his camel kneels at the site of the Medina mosque, quoted: "wa-assasa al-masjid alladhi ussisa 'ala al-taqwa"}
  - {id: h-7068.1-siyaha, ref: "Jāmiʿ 60:7068.1", unit: hadith-60-q9-wandering-is-jihad, agent: a man, action: asks leave for wandering devotion, outcome: told it is jihad, quoted: "inna siyahat ummati al-jihad fi sabil allah"}
  - {id: h-7068.2-uncle, ref: "Jāmiʿ 60:7068.2", unit: hadith-60-q9-forgiveness-for-polytheist-kin, agent: Abu Talib, action: refuses to say there is no god but God at death, recipient: the prophet, name: [Abu Jahl, Abd Allah b. Abi Umayya, Abd al-Muttalib], outcome: Q 9:113 and Q 28:56 revealed, quoted: "huwa 'ala millat 'abd al-muttalib"}
  - {id: h-7069.1-shame, ref: "Jāmiʿ 60:7069.1", unit: hadith-60-q9-forgiveness-for-polytheist-kin, agent: Abu Talib, action: declines the testimony for fear of Quraysh's reproach, quoted: "law la an tu'ayyirani quraysh ... innama hamalahu 'ala dhalika al-jaza'"}
  - {id: h-7069.2-mother, ref: "Jāmiʿ 60:7069.2", unit: hadith-60-q9-forgiveness-for-polytheist-kin, agent: the prophet, action: asks leave to seek forgiveness for his mother, outcome: refused; allowed to visit her grave, quoted: "fa-lam ya'dhan li ... fa-adhina li"}
  - {id: h-7069.4-abraham, ref: "Jāmiʿ 60:7069.4", unit: hadith-60-q9-forgiveness-for-polytheist-kin, agent: a man, action: prays for forgiveness for his polytheist parents citing Abraham, recipient: Ali, outcome: Q 9:114 revealed, quoted: "awa lam yastaghfir ibrahim li-abihi"}
  - {id: h-7070.1-hyena, ref: "Jāmiʿ 60:7070.1", unit: hadith-60-q9-azar-hyena, agent: Abraham, action: pleads for his father at resurrection, recipient: God, name: Azar, object: father, outcome: father turned into a filth-smeared hyena and thrown into the fire by its legs, quoted: ["fa-ayyu khizyin akhza min abi al-ab'ad", "fa-idha huwa bi-dhikhin multatikh"]}
  - {id: h-7070.2-cloud, ref: "Jāmiʿ 60:7070.2", unit: hadith-60-q9-hour-of-hardship, agent: the prophet, action: raises his hands for rain, place: road to Tabuk, time: fierce heat, outcome: a cloud pours and goes no further than the camp, quoted: ["yanharu ba'irahu fa-ya'siru farthahu fa-yashrabuhu", "fa-lam najidha jawazat al-'askar"]}
  - {id: h-7071.1-boycott, ref: "Jāmiʿ 60:7071.1", unit: hadith-60-q9-three-left-behind, agent: the prophet, action: forbids the Muslims to speak to the three, recipient: [Ka'b b. Malik, Murara b. al-Rabi', Hilal b. Umayya], number: [3, 50, "eighty-odd"], time: fifty nights, quoted: "fa-labithna 'ala dhalika khamsina layla"}
  - {id: h-7071.1-letter, ref: "Jāmiʿ 60:7071.1", unit: hadith-60-q9-three-left-behind, agent: Ka'b b. Malik, action: burns a letter in the oven, object: letter from the king of Ghassan, instrument: oven (tannur), quoted: "fa-tayammamtu biha al-tannur fa-sajartuhu biha"}
  - {id: h-7071.1-wife, ref: "Jāmiʿ 60:7071.1", unit: hadith-60-q9-three-left-behind, agent: the prophet's messenger, action: orders the three to keep away from their wives, time: after forty of the fifty nights, outcome: not divorce; Ka'b sends his wife to her family, quoted: "an ta'tazila imra'ataka ... la bal i'tazilha"}
  - {id: h-7071.1-herald, ref: "Jāmiʿ 60:7071.1", unit: hadith-60-q9-three-left-behind, agent: a crier, action: calls the good news from a hilltop, place: Mount Sal', time: dawn of the fiftieth night, outcome: Ka'b falls prostrate and gives the herald his two garments, quoted: "ya ka'b b. malik abshir ... wa-kana al-sawt asra' min al-faras"}
  # ---- Yunus
  - {id: h-7077.1-camel, ref: "Jāmiʿ 60:7077.1", unit: hadith-60-q10-do-not-curse-camel, agent: an Ansari man, action: curses his slow camel, place: raid of Batn Buwat, outcome: told to dismount, quoted: ["sha' la'anaka allah", "la tashabna bi-mal'un"]}
  - {id: h-7078.1-angels, ref: "Jāmiʿ 60:7078.1", unit: hadith-60-q10-two-angels-and-the-banquet, agent: two angels, action: call out at sunrise and at sunset, place: the sun's two flanks, number: 2, recipient: all creatures except men and jinn, quoted: ["halummu ila rabbikum", "allahumma a'ti munfiqan khalafan wa-a'ti mumsikan talafan"]}
  - {id: h-7079.1-banquet, ref: "Jāmiʿ 60:7079.1", unit: hadith-60-q10-two-angels-and-the-banquet, agent: angels, action: give a parable over the sleeping prophet, object: a house with a banquet and a caller, outcome: house is paradise, caller is Muhammad, quoted: ["inna al-'ayn na'ima wa-l-qalb yaqzan", "bana daran wa-ja'ala fiha ma'duba wa-ba'atha da'iyan"]}
  - {id: h-7079.2-veil, ref: "Jāmiʿ 60:7079.2", unit: hadith-60-q10-the-increase-is-seeing-god, agent: God, action: lifts the veil, recipient: people of paradise, outcome: they see their Lord, quoted: "fa-yakshifu al-hijab"}
  - {id: h-7080.1-needle, ref: "Jāmiʿ 60:7080.1", unit: hadith-60-q10-god-forbade-injustice, agent: God, action: forbids injustice to himself, instrument: needle dipped in the sea, quoted: "illa kama yanqusu al-mikhyat idha udkhila al-bahr"}
  - {id: h-7081.1-ears, ref: "Jāmiʿ 60:7081.1", unit: hadith-60-q10-ear-slit-cattle, agent: pagan herdsmen, action: cut the ears of newborn camels and forbid them, instrument: razor (musa), name: [bahr, sarm], quoted: "fa-ta'midu ila musa fa-taqta'u adhanaha fa-taqulu hadhihi bahr"}
  - {id: h-7083.3-rows, ref: "Jāmiʿ 60:7083.3", unit: hadith-60-q10-friends-of-god, agent: Abu Malik al-Ash'ari, action: teaches the prophet's prayer, object: rows of men, boys, women, number: 6, quoted: ["fa-saffa al-rijal ... wa-saffa al-wildan khalfahum wa-saffa al-nisa' khalfa al-wildan", "fa-kana takbiruhu fi awwal rak'a sitt takbirat"]}
  - {id: h-7083.3-pulpits, ref: "Jāmiʿ 60:7083.3", unit: hadith-60-q10-friends-of-god, agent: God, action: sets pulpits of light for those who loved in God, time: resurrection day, outcome: faces and clothes of light; they do not fear, quoted: "yada'u allah lahum yawm al-qiyama manabir min nur"}
  - {id: h-7086.2-mud, ref: "Jāmiʿ 60:7086.2", unit: hadith-60-q10-pharaohs-late-faith, agent: Gabriel, action: stuffs mud into Pharaoh's mouth, object: mud (tin), recipient: Pharaoh, outcome: Pharaoh cannot say no god but God, quoted: "inna jibril kana yadussu fi fam fir'awn al-tin"}
  # ---- Hud
  - {id: h-7088.1-sky, ref: "Jāmiʿ 60:7088.1", unit: hadith-60-q11-folding-breasts, agent: some people, action: avoid relieving themselves and intercourse exposed to the sky, outcome: Q 11:5 revealed, quoted: "an yatakhallaw fa-yufdu ila al-sama'"}
  - {id: h-7088.3-camel, ref: "Jāmiʿ 60:7088.3", unit: hadith-60-q11-throne-on-water, agent: Imran b. Husayn, action: leaves his tethered camel to hear the account of creation, outcome: the camel strays into the mirage, quoted: ["kana allah wa-lam yakun shay' ghayruhu wa-kana 'arshuhu 'ala al-ma'", "fa-wallahi la-wadidtu anni kuntu taraktuha"]}
  - {id: h-7089.1-decrees, ref: "Jāmiʿ 60:7089.1", unit: hadith-60-q11-throne-on-water, agent: God, action: writes the measures of creatures, time: fifty thousand years before heavens and earth, number: 50000, quoted: "bi-khamsina alf sana"}
  - {id: h-7090.2-cover, ref: "Jāmiʿ 60:7090.2", unit: hadith-60-q11-the-private-reckoning, agent: God, action: puts his cover over the believer and makes him confess, outcome: sins forgiven; the disbelievers cried out before the witnesses, quoted: "hatta yada'a 'alayhi kanafahu"}
  - {id: h-7092.2-sallim, ref: "Jāmiʿ 60:7092.2", unit: hadith-60-q11-day-none-speaks, agent: the messengers, action: alone speak on that day, quoted: "allahumma sallim sallim"}
  - {id: h-7092.3-scorch, ref: "Jāmiʿ 60:7092.3", unit: hadith-60-q11-day-none-speaks, agent: people of paradise, action: name those brought out of the fire, name: al-jahannamiyyun, quoted: "ba'da ma massahum minha saf'"}
  - {id: h-7093.3-dates, ref: "Jāmiʿ 60:7093.3", unit: hadith-60-q11-good-deeds-remove-bad, agent: Abu al-Yasar, action: kisses a woman buying dates in his house, recipient: wife of a man away at war, outcome: Q 11:114 revealed; for all people, quoted: ["inna fi al-bayt tamran atyab minhu", "akhalafta ghaziyan fi ahlihi bi-mithl hadha"]}
  # ---- Yusuf
  - {id: h-7096.1-stories, ref: "Jāmiʿ 60:7096.1", unit: hadith-60-q12-best-of-stories, agent: companions, action: ask for stories then for speech, outcome: Q 12:1-3 then Q 39:23 revealed, quoted: ["law qasasta 'alayna", "law haddathtana"]}
  - {id: h-7097.1-noble, ref: "Jāmiʿ 60:7097.1", unit: hadith-60-q12-noble-son-of-noble, name: [Yusuf, Ya'qub, Ishaq, Ibrahim], number: 4, quoted: "al-karim ibn al-karim ibn al-karim ibn al-karim"}
  - {id: h-7098.2-jacob, ref: "Jāmiʿ 60:7098.2", unit: hadith-60-q12-fair-patience, agent: Aisha, action: likens herself to Jacob among his sons, time: during her fever in the slander, quoted: "mathali wa-mathalukum ka-ya'qub wa-banihi"}
  - {id: h-7100.2-prison, ref: "Jāmiʿ 60:7100.2", unit: hadith-60-q12-joseph-in-prison, agent: the prophet, action: says he would have answered the king's summoner, recipient: Joseph (comparison), place: prison, quoted: "law labithtu fi al-sijn ma labitha yusuf la-ajabtu al-da'i"}
  - {id: h-7102.1-prostrate, ref: "Jāmiʿ 60:7102.1", unit: hadith-60-q12-prostration-to-husband, agent: the wife, action: would be commanded to prostrate, recipient: her husband, quoted: "la-amartu al-mar'a an tasjuda li-zawjiha"}
  # ---- al-Ra'd
  - {id: h-7104.1-dates, ref: "Jāmiʿ 60:7104.1", unit: hadith-60-q13-dates-differ, object: [daqal, farisi, sweet, sour], quoted: "al-daqal wa-l-farisi wa-l-hulw wa-l-hamid"}
  - {id: h-7105.1-keys, ref: "Jāmiʿ 60:7105.1", unit: hadith-60-q13-five-keys-of-unseen, number: 5, object: [tomorrow, what wombs shrink, rain, place of death, the Hour], quoted: "mafatih al-ghayb khams"}
  - {id: h-7105.2-bolt, ref: "Jāmiʿ 60:7105.2", unit: hadith-60-q13-thunderbolt, agent: God, action: sends a thunderbolt, recipient: a pagan chief, number: 3, object: [copper, iron, silver, gold], outcome: burned, quoted: "min nuhas huwa min hadid huwa min fidda huwa min dhahab huwa"}
  - {id: h-7106.2-gates, ref: "Jāmiʿ 60:7106.2", unit: hadith-60-q13-angels-enter-from-every-gate, agent: angels, action: enter on the poor emigrants from every gate, recipient: poor emigrants, quoted: ["nahnu sukkan sama'ik", "salamun 'alaykum bi-ma sabartum"]}
  - {id: h-7107.2-kid, ref: "Jāmiʿ 60:7107.2", unit: hadith-60-q13-world-and-hereafter, agent: the prophet, action: lifts a dead kid by its ear and offers it for a dirham, place: the market, object: dead small-eared kid, outcome: the world is cheaper to God, quoted: "bi-jadyin asakka mayyit"}
  - {id: h-7108.1-heading, ref: "Jāmiʿ 60:7108.1", unit: hadith-60-q13-rahman-refused, agent: Suhayl b. Amr, action: refuses the heading with al-Rahman, place: al-Hudaybiya, outcome: written bismika allahumma, quoted: "amma al-rahman fa-wallahi ma adri ma huwa"}
  - {id: h-7108.3-grapes, ref: "Jāmiʿ 60:7108.3", unit: hadith-60-q13-unfailing-fruit-and-shade, agent: the prophet, action: reaches for a cluster of grapes of paradise, time: eclipse prayer, outcome: draws back, quoted: "fa-tanawaltu minha 'unqudan"}
  - {id: h-7109.1-tree, ref: "Jāmiʿ 60:7109.1", unit: hadith-60-q13-unfailing-fruit-and-shade, object: a tree in paradise, number: 100, time: a hundred years, quoted: "yasiru al-rakib fi zilliha mi'at 'am la yaqta'uha"}
  # ---- Ibrahim
  - {id: h-7110.1-five, ref: "Jāmiʿ 60:7110.1", unit: hadith-60-q14-sent-to-all-people, agent: God, action: gives the prophet five things, number: [5, "a month"], quoted: "nusirtu bi-l-ru'b masirat shahr wa-ju'ilat li al-ard masjidan wa-tahuran"}
  - {id: h-7112.1-palm, ref: "Jāmiʿ 60:7112.1", unit: hadith-60-q14-palm-tree, agent: the prophet, action: asks a riddle of a tree like the Muslim, object: the palm, outcome: Ibn Umar knew but kept silent, quoted: "la yatahattu waraquha ... hiya al-nakhla"}
  - {id: h-7113.1-grave, ref: "Jāmiʿ 60:7113.1", unit: hadith-60-q14-firm-word-in-grave, agent: the dead believer, action: answers the question in the grave, place: the grave, quoted: "man rabbuka fa-yaqulu rabbi allah wa-nabiyyi muhammad"}
  - {id: h-7115.1-weeps, ref: "Jāmiʿ 60:7115.1", unit: hadith-60-q14-my-community, agent: the prophet, action: raises his hands and weeps for his community, recipient: God; Gabriel sent, outcome: promise to please him, quoted: ["allahumma ummati ummati", "inna sa-nurdika fi ummatika"]}
  - {id: h-7116.1-loaf, ref: "Jāmiʿ 60:7116.1", unit: hadith-60-q14-earth-changed, object: the resurrection earth, action: is white and flat like a pure loaf, quoted: "ard bayda' 'afra' ka-qursat al-naqi"}
  - {id: h-7116.2-bread, ref: "Jāmiʿ 60:7116.2", unit: hadith-60-q14-earth-changed, agent: the Compeller (al-Jabbar), action: turns the earth in his hand like bread, object: the earth as one loaf, recipient: people of paradise, quoted: "khubza wahida yatakaffa'uha al-jabbar bi-yadihi"}
  - {id: h-7116.3-feast, ref: "Jāmiʿ 60:7116.3", unit: hadith-60-q14-earth-changed, agent: a Jewish rabbi, action: asks questions, recipient: the prophet, object: [fish liver lobe, ox of paradise, spring Salsabil], place: darkness before the bridge, quoted: ["ziyadat kabid al-nun", "yunharu lahum thawr al-janna", "'ayn tusamma salsabil"]}
  - {id: h-7116.3-child, ref: "Jāmiʿ 60:7116.3", unit: hadith-60-q14-earth-changed, object: [man's water white, woman's water yellow], action: whichever prevails decides the child's sex, quoted: "fa-'ala maniyy al-rajul maniyy al-mar'a adhkara bi-idhn allah"}
  - {id: h-7117.2-tar, ref: "Jāmiʿ 60:7117.2", unit: hadith-60-q14-wailer-in-tar, agent: the unrepentant wailing woman, action: is raised on resurrection day, instrument: [shirt of tar, coat of scab], number: 4, quoted: "sirbal min qatiran wa-dir' min jarab"}
  # ---- al-Hijr
  - {id: h-7118.1-chain, ref: "Jāmiʿ 60:7118.1", unit: hadith-60-q15-intercession-and-the-wish, agent: people at the resurrection, action: seek an intercessor, recipient: [Adam, Noah, Abraham, Moses, Jesus, Muhammad], outcome: each declines until Muhammad prostrates and intercedes, quoted: "lastu hunakum"}
  - {id: h-7118.2-river, ref: "Jāmiʿ 60:7118.2", unit: hadith-60-q15-intercession-and-the-wish, agent: those taken out of the fire, action: bathe in a river of paradise, name: al-jahannamiyyun, outcome: the black in their faces goes, quoted: "fa-yaghtasilun fi nahr al-janna"}
  - {id: h-7121.1-stack, ref: "Jāmiʿ 60:7121.1", unit: hadith-60-q15-eavesdroppers, agent: stealers of hearing, action: stand one above another and pass a heard word down, instrument: meteor (shihab), outcome: the soothsayer adds a hundred lies, number: 100, quoted: ["ka-annahu silsila 'ala safwan", "ba'duhu fawqa ba'd"]}
  - {id: h-7121.2-hen, ref: "Jāmiʿ 60:7121.2", unit: hadith-60-q15-eavesdroppers, agent: a jinni, action: clucks the stolen word into his ally's ear, recipient: the soothsayer, number: 100, quoted: "qarra al-dajaja"}
  - {id: h-7123.2-depth, ref: "Jāmiʿ 60:7123.2", unit: hadith-60-q15-seven-gates-depths, agent: the fire, action: takes the damned to different depths, object: [ankles, knees, waist, collarbone], number: 4, quoted: "ila ka'bayhi ... ila rukbatayhi ... ila hujzatihi ... ila tarquwatihi"}
  - {id: h-7123.3-bridge, ref: "Jāmiʿ 60:7123.3", unit: hadith-60-q15-rancour-removed-on-bridge, agent: believers saved from the fire, action: are held on a bridge for retaliation, place: bridge between paradise and fire, outcome: cleansed and admitted, quoted: "fa-yuhbasun 'ala qantara bayna al-janna wa-l-nar"}
  - {id: h-7124.1-khadija, ref: "Jāmiʿ 60:7124.1", unit: hadith-60-q15-khadija-house-of-reed, agent: Gabriel, action: sends greeting and glad tidings, recipient: Khadija, object: house of qasab in paradise, quoted: "bi-bayt fi al-janna min qasab la sakhab fihi wa-la nasab"}
  - {id: h-7124.2-mercy, ref: "Jāmiʿ 60:7124.2", unit: hadith-60-q15-hundred-mercies, agent: God, action: keeps ninety-nine mercies and sends one, number: [100, 99, 1], quoted: "fa-amsaka 'indahu tis'an wa-tis'in rahma"}
  - {id: h-7126.2-weep, ref: "Jāmiʿ 60:7126.2", unit: hadith-60-q15-thamud-ruins, agent: the prophet, action: forbids entering the dwellings except weeping and hurries past, place: al-Hijr, quoted: "illa an takunu bakin ... thumma zajara fa-asra'a hatta khallafaha"}
  - {id: h-7126.3-wells, ref: "Jāmiʿ 60:7126.3", unit: hadith-60-q15-thamud-ruins, agent: the prophet, action: orders the water poured out and the dough fed to camels, place: wells of Thamud, outcome: water drawn only from the she-camel's well, quoted: "an yaʿlifu al-ibil al-ʿajin"}
