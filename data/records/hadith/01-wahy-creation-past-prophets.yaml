records:
  - {id: h-107.1-dreams, ref: "Jāmiʿ 1:107.1", unit: hadith-1-first-revelation-hira, agent: the prophet, action: sees true dreams before revelation, outcome: each comes true like daybreak, quoted: "mithla falaq al-subh"}
  - {id: h-107.1-hira, ref: "Jāmiʿ 1:107.1", unit: hadith-1-first-revelation-hira, agent: the prophet, action: secludes himself for devotion, place: cave of Hira, time: nights of number, quoted: "yatahannath fihi - wa-huwa al-ta'abbud - al-layali dhawat al-ʿadad", object: provisions taken from Khadija}
  - {id: h-107.1-squeeze, ref: "Jāmiʿ 1:107.1", unit: hadith-1-first-revelation-hira, agent: the angel, action: seizes and presses the prophet, recipient: the prophet, number: 3, quoted: ["iqra'", "ma ana bi-qari'", "fa-ghattani hatta balagha minni al-jahd"], outcome: recites Q 96:1-5}
  - {id: h-107.1-wrap, ref: "Jāmiʿ 1:107.1", unit: hadith-1-first-revelation-hira, agent: the prophet, action: asks to be wrapped, recipient: Khadija, quoted: "zammiluni zammiluni", outcome: fear leaves him}
  - {id: h-107.1-khadija, ref: "Jāmiʿ 1:107.1", unit: hadith-1-first-revelation-hira, agent: Khadija, action: reassures by listing his virtues, object: [kinship ties, carrying the weak, earning for the destitute, hosting guests, aiding in calamities], quoted: "kalla wa-llahi ma yukhzika llahu abadan"}
  - {id: h-107.1-waraqa, ref: "Jāmiʿ 1:107.1", unit: hadith-1-first-revelation-hira, agent: Waraqa b. Nawfal, name: [Waraqa b. Nawfal, al-namus], action: identifies the visitor, object: the namus sent down on Moses, quoted: ["hadha al-namus alladhi nazzala llahu ʿala musa", "yaktubu min al-injil bi-l-ʿibraniyya"], outcome: predicts the prophet's expulsion; dies soon after}
  - {id: h-108.2-bell, ref: "Jāmiʿ 1:108.2", unit: hadith-1-manner-and-weight-of-revelation, agent: revelation, action: comes like the ringing of a bell, instrument: bell, quoted: "mithla salsalat al-jaras wa-huwa ashadduhu ʿalayy"}
  - {id: h-108.2-man, ref: "Jāmiʿ 1:108.2", unit: hadith-1-manner-and-weight-of-revelation, agent: the angel, action: takes the form of a man and speaks, quoted: "yatamaththalu li al-malak rajulan"}
  - {id: h-108.2-sweat, ref: "Jāmiʿ 1:108.2", unit: hadith-1-manner-and-weight-of-revelation, agent: the prophet, action: sweats under revelation, time: a very cold day, quoted: "wa-inna jabinahu la-yatafassadu ʿaraqan"}
  - {id: h-108.3-snore, ref: "Jāmiʿ 1:108.3", unit: hadith-1-manner-and-weight-of-revelation, agent: the prophet, action: snores under revelation like a young camel, place: al-Ji'rana, instrument: a covering cloth lifted by ʿUmar, quoted: "lahu ghatitun ka-ghatit al-bakr"}
  - {id: h-108.3-umra, ref: "Jāmiʿ 1:108.3", unit: hadith-1-manner-and-weight-of-revelation, agent: the prophet, action: orders a pilgrim to wash off saffron and remove his robe, recipient: a man in umra, object: [saffron trace (khaluq), jubba], quoted: "isna' fi ʿumratika ma anta sani' fi hajjika"}
  - {id: h-109.3-thigh, ref: "Jāmiʿ 1:109.3", unit: hadith-1-manner-and-weight-of-revelation, agent: revelation, action: weighs on a scribe's thigh, recipient: Zayd b. Thabit, object: the words "ghayr uli l-darar", quoted: "hatta khiftu an tarudda fakhidhi", name: Ibn Umm Maktum}
  - {id: h-110.2-camel, ref: "Jāmiʿ 1:110.2", unit: hadith-1-manner-and-weight-of-revelation, agent: the prophet's camel, action: strikes the ground with its neck under revelation, quoted: "fa-tadribu bi-jiraniha"}
  - {id: h-111.1-kursi, ref: "Jāmiʿ 1:111.1", unit: hadith-1-pause-and-the-muddaththir, agent: the angel of Hira, action: sits on a chair between heaven and earth, place: between heaven and earth, quoted: "jalisan ʿala kursiyyin bayna al-sama' wa-l-ard", outcome: the prophet asks to be wrapped; Q 74:1-5 revealed}
  - {id: h-112.1-call, ref: "Jāmiʿ 1:112.1", unit: hadith-1-pause-and-the-muddaththir, agent: a voice, action: calls the prophet, place: valley bottom below Hira, time: after a month's retreat, number: 3, quoted: "fa-nazartu amami wa-khalfi wa-ʿan yamini wa-ʿan shimali", outcome: sees him on a throne in the air; cold water poured on him}
  - {id: h-113.1-lips, ref: "Jāmiʿ 1:113.1", unit: hadith-1-hastening-the-tongue, agent: the prophet, action: moves his lips to hold the revelation, quoted: "fa-ana uharrikuhuma lakum kama kana rasul allah yuharrikuhuma", outcome: told to listen and recite after Gabriel leaves}
  - {id: h-113.2-jinn, ref: "Jāmiʿ 1:113.2", unit: hadith-1-jinn-hear-the-quran, agent: devils, action: search east and west for the cause of their exclusion, place: Nakhla on the way to ʿUkaz, time: dawn prayer, instrument: shooting stars (shuhub), outcome: they hear the Quran and believe, quoted: "inna sami'na qur'anan ʿajaban"}
  - {id: h-115.1-wings, ref: "Jāmiʿ 1:115.1", unit: hadith-1-heaven-at-the-word, agent: the angels, action: beat their wings in submission, time: when God decrees in heaven, quoted: "ka-l-silsila ʿala safwan", outcome: they ask what their Lord said and answer al-haqq}
  - {id: h-115.1-eavesdrop, ref: "Jāmiʿ 1:115.1", unit: hadith-1-heaven-at-the-word, agent: stealers of hearing, action: pass a heard word down one above another, instrument: shooting star (shihab), recipient: sorcerer, number: 100, quoted: "fa-yakdhibu ma'aha mi'ata kadhba", outcome: the sorcerer is believed for the one true word}
  - {id: h-115.2-swoon, ref: "Jāmiʿ 1:115.2", unit: hadith-1-heaven-at-the-word, agent: people of heaven, action: fall stunned at God's speaking the revelation, name: Gabriel, quoted: ["ka-jarr al-silsila ʿala al-safa", "fa-yaqulun: al-haqq al-haqq"]}
  - {id: h-117.1-scribe, ref: "Jāmiʿ 1:117.1", unit: hadith-1-verse-sent-in-two-parts, agent: the prophet, action: has a verse written, recipient: Zayd, instrument: [tablet, inkwell, shoulder-blade], name: ʿAmr Ibn Umm Maktum, outcome: the exemption "ghayr uli l-darar" sent down in its place}
  - {id: h-118.1-weep, ref: "Jāmiʿ 1:118.1", unit: hadith-1-revelation-dense-then-cut, agent: Umm Ayman, action: weeps, recipient: Abu Bakr and ʿUmar, time: after the prophet's death, quoted: "abki anna al-wahy qad inqata'a min al-sama'", outcome: both weep with her}
  - {id: h-4856.2-insult, ref: "Jāmiʿ 45:4856.2", unit: hadith-45-sermon-on-the-beginning, agent: son of Adam, action: belies and insults God, quoted: ["lan yu'idani kama bada'ani", "ittakhadha llahu waladan"]}
  - {id: h-4857.2-water, ref: "Jāmiʿ 45:4857.2", unit: hadith-45-everything-from-water, agent: God, action: creates everything, instrument: water, quoted: "kullu shay'in khuliqa min ma'"}
  - {id: h-4858.3-sermon, ref: "Jāmiʿ 45:4858.3", unit: hadith-45-sermon-to-the-hour, agent: the prophet, action: preaches on all that was and will be, time: from the dawn prayer to sunset, place: the pulpit, quoted: "fa-akhbarana bima kana wa-bima huwa ka'in"}
  - {id: h-4859.1-throne, ref: "Jāmiʿ 45:4859.1", unit: hadith-45-first-creation-and-the-pen, agent: God, action: creates heaven and earth after placing the throne on the water, object: [throne, water, heavens, earth, the Record], quoted: ["kana llahu wa-lam yakun shay'un qablahu", "wa-kana ʿarshuhu ʿala al-ma'", "wa-kataba fi al-dhikr kulla shay'"]}
  - {id: h-4860.1-pen, ref: "Jāmiʿ 45:4860.1", unit: hadith-45-first-creation-and-the-pen, agent: God, action: creates the pen first and commands it to write, object: the pen, recipient: the pen, quoted: ["inna awwala ma khalaqa llahu al-qalam", "uktub maqadir kulli shay'in hatta taqum al-sa'a"]}
  - {id: h-4861.2-pen-hand, ref: "Jāmiʿ 45:4861.2", unit: hadith-45-first-creation-and-the-pen, agent: God, action: takes the pen in his right hand and writes the world, instrument: the pen, object: [deeds pious or wicked, moist and dry], quoted: "wa-kilta yadayhi yamin"}
  - {id: h-4861.3-cloud, ref: "Jāmiʿ 45:4861.3", unit: hadith-45-cloud-before-creation, agent: God, place: in a cloud, time: before creation, quoted: "kana fi ʿama' ma tahtahu hawa' wa-ma fawqahu hawa'", outcome: creates his throne on the water}
  - {id: h-4862.1-house, ref: "Jāmiʿ 45:4862.1", unit: hadith-45-frequented-house, agent: seventy thousand angels, action: pray in the frequented House daily and never return, place: seventh heaven, number: 70000, name: [al-bayt al-ma'mur, Abraham], quoted: "idha kharaju lam ya'udu ilayhi akhira ma ʿalayhim"}
  - {id: h-4863.1-durah, ref: "Jāmiʿ 45:4863.1", unit: hadith-45-frequented-house, agent: seventy thousand angels, action: enter the heavenly house daily, place: above the Ka'ba, number: 70000, name: al-durah, quoted: "law saqata la-saqata ʿalayhi"}
  - {id: h-4864.1-collar, ref: "Jāmiʿ 45:4864.1", unit: hadith-45-seven-earths-and-stolen-land, agent: God, action: hangs stolen land round the thief's neck, object: a handspan of land, number: 7, quoted: "man zalama qida shibrin tuwwiqahu min sab' aradin"}
  - {id: h-4865.2-months, ref: "Jāmiʿ 45:4865.2", unit: hadith-45-time-come-round, agent: the prophet, action: declares the year of twelve months, number: [12, 4, 3], name: [Dhu l-Qa'da, Dhu l-Hijja, al-Muharram, Rajab of Mudar], quoted: "al-zaman qad istadara ka-hay'atihi yawma khalaqa llahu al-samawat wa-l-ard", place: the sacred town, time: day of sacrifice}
  - {id: h-4865.3-decrees, ref: "Jāmiʿ 45:4865.3", unit: hadith-45-decrees-and-the-full-hand, agent: God, action: writes the measures of creatures, time: fifty thousand years before heaven and earth, number: 50000, quoted: "wa-ʿarshuhu ʿala al-ma'"}
  - {id: h-4866.1-prayer, ref: "Jāmiʿ 45:4866.1", unit: hadith-45-decrees-and-the-full-hand, agent: the prophet, action: opens the night prayer, name: [Jibra'il, Mika'il, Israfil], quoted: "allahumma rabba jibra'il wa-mika'il wa-israfil fatir al-samawat wa-l-ard", time: night}
  - {id: h-4867.1-bedouin, ref: "Jāmiʿ 45:4867.1", unit: hadith-45-bedouin-swears-the-prophet, agent: a bedouin, action: adjures the prophet by the maker of sky and earth and mountains, object: [five prayers, zakat, fast of Ramadan, pilgrimage], number: 5, outcome: will enter paradise if truthful, quoted: "la azidu ʿalayhinna wa-la anqusu minhunna"}
  - {id: h-4868.1-sun, ref: "Jāmiʿ 45:4868.1", unit: hadith-45-sun-prostrates-under-throne, agent: the sun, action: prostrates under the Throne each night and asks to return, place: under the Throne (its mustaqarr), outcome: one day told to rise from the west, quoted: ["fa-takhirru sajida", "irtafi'i asbihi tali'atan min maghribiki"]}
  - {id: h-4869.1-rolled, ref: "Jāmiʿ 45:4869.1", unit: hadith-45-sun-prostrates-under-throne, agent: God, object: [sun, moon], action: rolls them up, time: day of resurrection, quoted: "mukawwaran yawm al-qiyama"}
  - {id: h-4869.3-eclipse, ref: "Jāmiʿ 45:4869.3", unit: hadith-45-eclipse-not-for-a-death, agent: the prophet, action: denies the eclipse is for a death, time: the day Ibrahim died, name: Ibrahim, quoted: "la yankasifan li-mawt ahad wa-la li-hayatihi", outcome: commands prayer and supplication}
  - {id: h-4870.1-winds, ref: "Jāmiʿ 45:4870.1", unit: hadith-45-winds, agent: God, action: helps the prophet by one wind and destroys ʿAd by another, instrument: [east wind (saba), west wind (dabur)], name: ʿAd, quoted: "nusirtu bi-l-saba wa-uhlikat ʿad bi-l-dabur"}
  - {id: h-4870.3-cloud, ref: "Jāmiʿ 45:4870.3", unit: hadith-45-winds, agent: the prophet, action: paces in and out at a rain-cloud, object: a cloud (makhila), quoted: "hadha ʿaridun mumtiruna", outcome: relieved when rain falls}
  - {id: h-4871.1-matter, ref: "Jāmiʿ 45:4871.1", unit: hadith-45-angels-jinn-adam-matter, agent: God, action: creates three kinds of being, object: [angels, jinn, Adam], instrument: [light, smokeless flame of fire, what was described], quoted: "khuliqat al-mala'ika min nur wa-khuliqa al-jann min marijin min nar"}
  - {id: h-4872.1-jinn, ref: "Jāmiʿ 45:4872.1", unit: hadith-45-three-kinds-of-jinn, object: kinds of jinn, number: 3, quoted: "sinfun lahum ajniha yatiruna fi al-hawa' wa-sinfun hayyat wa-sinfun yahilluna wa-yaz'anun"}
  - {id: h-4873.1-night, ref: "Jāmiʿ 45:4873.1", unit: hadith-45-night-of-the-jinn, agent: the summoner of the jinn, action: takes the prophet away by night, place: from the direction of Hira, outcome: shows traces and fires; jinn given bones and dung as food, quoted: ["ata-ni da'i al-jinn", "fa-la tastanju bihima fa-innahuma ta'am ikhwanikum"]}
  - {id: h-4875.1-nine, ref: "Jāmiʿ 45:4875.1", unit: hadith-45-night-of-the-jinn, agent: jinn, action: listen to the Quran, place: Batn Nakhla, number: 9, name: Zawba'a, quoted: "sah"}
  - {id: h-4875.2-nisibin, ref: "Jāmiʿ 45:4875.2", unit: hadith-45-night-of-the-jinn, agent: delegation of the jinn, place: Nisibin, action: ask for provision, object: [bone, dung], outcome: the prophet prays they find food on every bone and dung, quoted: "wafdu jinni nasibin - wa-ni'ma al-jinn"}
  - {id: h-4876.1-supper, ref: "Jāmiʿ 45:4876.1", unit: hadith-45-where-devils-lodge, agent: the devil, action: finds lodging and supper where God is not named, place: the house, quoted: "la mabita lakum wa-la ʿasha'"}
  - {id: h-4876.4-hen, ref: "Jāmiʿ 45:4876.4", unit: hadith-45-soothsayers-word, agent: the jinni, action: cackles a snatched word into the soothsayer's ear, recipient: his ally (waliyy), number: 100, quoted: "ka-qarqarat al-dajaja"}
  - {id: h-4877.1-snake, ref: "Jāmiʿ 45:4877.1", unit: hadith-45-house-snakes, agent: a newly married youth, action: spears a snake coiled on his bed, place: Medina, time: during the Trench, outcome: he and the snake die together, instrument: spear, quoted: "fa-ma yudra ayyuhuma kana asra'a mawtan"}
  - {id: h-4877.1-warning, ref: "Jāmiʿ 45:4877.1", unit: hadith-45-house-snakes, agent: the prophet, action: orders house snakes warned before killing, time: three days, number: 3, quoted: "inna bi-l-madina jinnan qad aslamu fa-adhinuhu thalathat ayyam"}
  - {id: h-4878.2-dog, ref: "Jāmiʿ 45:4878.2", unit: hadith-45-devils-in-animal-form, agent: the prophet, action: allows killing only the jet-black dog with two spots, object: dog, quoted: "al-aswad al-bahim dhi l-nuqtatayn fa-innahu shaytan"}
  - {id: h-4879.2-thief, ref: "Jāmiʿ 45:4879.2", unit: hadith-45-thief-of-the-alms-store, agent: a devil in human form, action: steals from the alms store, recipient: Abu Hurayra, number: 3, time: three nights, quoted: ["iqra' ayat al-kursi", "sadaqaka wa-huwa kadhub", "dhaka shaytan"], outcome: released after teaching the Throne Verse}
  - {id: h-4880.1-dog-hand, ref: "Jāmiʿ 45:4880.1", unit: hadith-45-thief-of-the-alms-store, agent: a jinni like an adolescent, action: steals dates, recipient: Ubayy b. Ka'b, object: dog's hand and hair, quoted: "hakadha khalq al-jinn", outcome: teaches the Throne Verse morning and evening}
  - {id: h-4881.2-elephant, ref: "Jāmiʿ 45:4881.2", unit: hadith-45-thief-of-the-alms-store, agent: the devil, action: enters through the crack of a locked door as an elephant, recipient: Mu'adh b. Jabal, place: room of alms dates, name: jinn of Nisibin, outcome: teaches the end of the Cow, quoted: "fa-tahawwala fi surat fil"}
  - {id: h-4882.1-ghoul, ref: "Jāmiʿ 45:4882.1", unit: hadith-45-thief-of-the-alms-store, agent: a ghoul (female), action: steals food and swears not to return, recipient: Burayda, number: 3, quoted: "sadaqat wa-hiya kadhub", outcome: teaches the Throne Verse}
  - {id: h-4884.1-iblis, ref: "Jāmiʿ 45:4884.1", unit: hadith-45-iblis-throne-on-the-sea, agent: Iblis, action: sets his throne on the water and sends troops, place: on the water, outcome: brings nearest the one who separated a man from his wife, quoted: ["yada'u ʿarshahu ʿala al-ma'", "ni'ma anta"]}
  - {id: h-4885.1-door, ref: "Jāmiʿ 45:4885.1", unit: hadith-45-devils-seat-door-sandal, agent: householders, action: close doors and cover vessels naming God, object: [children, doors, waterskins, vessels, lamps], time: nightfall, quoted: "fa-inna al-shaytan la yaftahu baban mughlaqan"}
  - {id: h-4885.2-sandal, ref: "Jāmiʿ 45:4885.2", unit: hadith-45-devils-seat-door-sandal, agent: the devil, action: walks in one sandal, quoted: "inna al-shaytan yamshi bi-l-na'l al-wahida"}
  - {id: h-4886.1-ringed, ref: "Jāmiʿ 45:4886.1", unit: hadith-45-paradise-and-hell-surrounded, agent: God, action: surrounds paradise and hell, recipient: Gabriel as inspector, object: [hardships (makarih), desires (shahawat)], quoted: ["huffat bi-l-makarih", "huffat bi-l-shahawat"]}
  - {id: h-4887.1-joints, ref: "Jāmiʿ 45:4887.1", unit: hadith-45-joints-and-tailbone, object: joints of the body, number: 360, quoted: "ʿala sittina wa-thalathi-mi'at mafsil", outcome: equal number of good acts removes one from the fire}
  - {id: h-4887.2-tailbone, ref: "Jāmiʿ 45:4887.2", unit: hadith-45-joints-and-tailbone, agent: God, action: rebuilds the dead from one bone after rain, object: tailbone (ʿajb al-dhanab), number: 40, time: between the two blasts, quoted: ["fa-yanbutuna kama yanbutu al-baql", "illa ʿazman wahidan wa-huwa ʿajb al-dhanab"]}
  - {id: h-4887.4-embryo, ref: "Jāmiʿ 45:4887.4", unit: hadith-45-embryo-and-the-angel, agent: an angel, action: writes four things for the embryo, object: [deeds, provision, term, wretched or blessed], number: [40, 4], time: after three forty-day stages, quoted: "fa-yu'maru bi-arba' kalimat"}
  - {id: h-4888.1-fitra, ref: "Jāmiʿ 45:4888.1", unit: hadith-45-born-on-the-fitra, agent: parents, action: make the child a Jew or Christian, object: child born on the fitra, instrument: simile of cropping a newborn beast's ears, quoted: "fa-abawahu yuhawwidanihi wa-yunassiranihi"}
  - {id: h-4889.1-rib, ref: "Jāmiʿ 45:4889.1", unit: hadith-45-woman-from-a-rib, agent: God, action: creates woman, instrument: a rib (dil'), quoted: "wa-inna a'waja shay'in fi al-dil' a'lahu"}
  - {id: h-4889.3-mercy, ref: "Jāmiʿ 45:4889.3", unit: hadith-45-hundred-parts-of-mercy, agent: God, action: divides mercy and sends one part to earth, number: [100, 99, 1], quoted: "hatta tarfa'a al-faras hafiraha ʿan waladiha"}
  - {id: h-4891.1-zayd, ref: "Jāmiʿ 45:4891.1", unit: hadith-45-zayd-refuses-idol-sacrifices, agent: Zayd b. ʿAmr b. Nufayl, action: refuses meat sacrificed on cult stones, place: lower Baldah, time: before revelation, quoted: "la akulu mimma tadhbahuna ʿala ansabikum"}
  - {id: h-4892.1-cow, ref: "Jāmiʿ 45:4892.1", unit: hadith-45-cow-and-wolf-speak, agent: a cow, action: protests being ridden, recipient: its rider, quoted: "inna lam nukhlaq li-hadha innama khuliqna li-l-harth"}
  - {id: h-4892.1-wolf, ref: "Jāmiʿ 45:4892.1", unit: hadith-45-cow-and-wolf-speak, agent: a wolf, action: claims the rescued sheep, recipient: the shepherd, time: day of the beast, quoted: "fa-man laha yawm al-sab' yawma la ra'iya laha ghayri"}
  - {id: h-4892.2-camel, ref: "Jāmiʿ 45:4892.2", unit: hadith-45-camels-and-devils, agent: the prophet, action: requires ablution after camel meat, object: [camel meat, mutton, camel pens, sheepfolds], quoted: "la tusallu fi mabarik al-ibil fa-innaha min al-shayatin"}
  - {id: h-4893.2-gharqad, ref: "Jāmiʿ 45:4893.2", unit: hadith-45-stones-and-trees-speak-but-the-gharqad, agent: Jesus, action: kills the Dajjal, place: eastern gate of Lydda, object: [stone, tree, wall, beast], name: gharqad, quoted: "illa al-gharqada fa-innaha min shajarihim la tantiq"}
  - {id: h-4894.2-maskh, ref: "Jāmiʿ 45:4894.2", unit: hadith-45-transformed-have-no-offspring, agent: God, object: transformed people, action: gives them no offspring, name: [apes, pigs], quoted: "lam yaj'al li-maskhin naslan wa-la ʿaqiban"}
  - {id: h-4895.1-mice, ref: "Jāmiʿ 45:4895.1", unit: hadith-45-lost-israelites-as-mice, agent: a lost nation of Israel, outcome: thought to be the mice, object: [camels' milk refused, sheep's milk drunk], name: Ka'b, quoted: ["wa-la araha illa al-fa'r", "a-fa-aqra'u al-tawrat?"]}
  - {id: h-4896.1-israel, ref: "Jāmiʿ 46:4896.1", unit: hadith-46-narrate-from-israel, agent: the prophet, action: permits narrating from the Children of Israel, quoted: ["ballighu ʿanni wa-law aya", "haddithu ʿan bani isra'il wa-la haraj"]}
  - {id: h-4896.4-eve, ref: "Jāmiʿ 46:4896.4", unit: hadith-46-eve-and-the-spoiling-meat, agent: [Children of Israel, Eve], outcome: [food spoils and meat rots, women betray husbands], name: Hawwa', quoted: "law-la hawwa' lam takhun untha zawjaha al-dahr"}
  - {id: h-4897.2-gold, ref: "Jāmiʿ 46:4897.2", unit: hadith-46-gold-in-the-bought-land, agent: buyer and seller, action: each refuse a jar of gold found in sold land, object: jar of gold, recipient: an arbiter, outcome: the arbiter marries the buyer's son to the seller's daughter (or the reverse) with the gold, quoted: "ankihu al-ghulam al-jariya wa-anfiqu ʿala anfusikuma minhu wa-tasaddaqa"}
