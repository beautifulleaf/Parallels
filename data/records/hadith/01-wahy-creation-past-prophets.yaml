  - {id: h-4956.1-hagar, ref: "Jāmiʿ 47:4956.1", unit: hadith-47-hagar-ismail-and-the-house, agent: Abraham, action: leaves Hagar and the nursing Ishmael by the House, object: [bag of dates, skin of water], place: by a great tree above Zamzam, quoted: ["a-llahu amaraka bi-hadha?", "idhan la yudayyiʿuna"]}
