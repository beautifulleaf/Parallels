records:
- id: h-5326.1-faint
  ref: Jāmiʿ 48:5326.1
  unit: hadith-48-ifk-umm-ruman-and-hassan
  agent: Aisha
  action: falls fainting on hearing the rumour
  outcome: wakes with shivering fever
  quoted: fa-kharrat maghshiyyan ʿalayha ... humma bi-nafid
- id: h-5326.1-jacob
  ref: Jāmiʿ 48:5326.1
  unit: hadith-48-ifk-umm-ruman-and-hassan
  agent: Aisha
  action: likens herself and her hearers to Jacob and his sons
  name: Yaʿqub
  quoted: fa-sabrun jamil wa-llahu l-mustaʿan ʿala ma tasifun
- id: h-5326.1-praise
  ref: Jāmiʿ 48:5326.1
  unit: hadith-48-ifk-umm-ruman-and-hassan
  agent: Aisha
  action: praises God alone for her acquittal
  recipient: God
  quoted: bi-hamdi llah la bi-hamdi ahad wa-la bi-hamdik
- id: h-5326.2-blind
  ref: Jāmiʿ 48:5326.2
  unit: hadith-48-ifk-umm-ruman-and-hassan
  agent: Aisha
  action: names blindness the great punishment of the slanderer
  object: Hassan b. Thabit
  quoted: wa-ayyu ʿadhabin ashaddu min al-ʿama
- id: h-5327.1-hair
  ref: Jāmiʿ 48:5327.1
  unit: hadith-48-ifk-umm-ruman-and-hassan
  agent: Hassan b. Thabit
  action: promises to draw the prophet out of the shared lineage
  instrument: a hair drawn from dough
  quoted: la-asullannaka minhum kama tusallu al-shaʿra min al-ʿajin
- id: h-5327.2-juwayriya
  ref: Jāmiʿ 48:5327.2
  unit: hadith-48-juwayriya-marriage
  agent: the prophet
  action: pays her contract and marries her
  recipient: Juwayriya bint al-Harith
  outcome: the people free the captives of Banu l-Mustaliq
  number: 100
  quoted: ashar rasul allah
- id: h-5328.2-hadd
  ref: Jāmiʿ 48:5328.2
  unit: hadith-48-ifk-aftermath
  agent: the prophet
  action: orders the fixed penalty on the slanderers
  object:
  - two men
  - a woman
  time: after the acquittal is recited from the pulpit
  quoted: amara bi-l-rajulayn wa-l-mar'a fa-duribu haddahum
- id: h-5330.1-age
  ref: Jāmiʿ 48:5330.1
  unit: hadith-48-khandaq-age-fifteen
  agent: the prophet
  action: refuses then admits a boy for battle
  recipient: Ibn Umar
  number:
  - 14
  - 15
  place:
  - Uhud
  - the Trench
- id: h-5330.3-hubwa
  ref: Jāmiʿ 48:5330.3
  unit: hadith-48-ibn-umar-holds-his-word
  agent: Ibn Umar
  action: unties his garment to reply and holds back
  recipient: Muʿawiya
  outcome: recalls what God prepared in the gardens
  quoted: fa-hallaltu hubwati
- id: h-5332.2-hudhayfa
  ref: Jāmiʿ 48:5332.2
  unit: hadith-48-hudhayfa-night-mission
  agent: the prophet
  action: asks who will bring news of the enemy
  number: 3
  time: night of the confederates, wind and cold
  outcome: names Hudhayfa
  quoted: ala rajulun ya'tini bi-khabar al-qawm
- id: h-5332.2-bath
  ref: Jāmiʿ 48:5332.2
  unit: hadith-48-hudhayfa-night-mission
  agent: Hudhayfa
  action: walks to the enemy camp and back feeling no cold
  quoted: ka-annama amshi fi hammam
- id: h-5332.2-arrow
  ref: Jāmiʿ 48:5332.2
  unit: hadith-48-hudhayfa-night-mission
  agent: Hudhayfa
  action: sets an arrow to shoot the enemy chief and refrains
  object: Abu Sufyan warming his back at a fire
  quoted: wa-la tadhʿarhum ʿalayy
- id: h-5332.2-nauman
  ref: Jāmiʿ 48:5332.2
  unit: hadith-48-hudhayfa-night-mission
  agent: the prophet
  action: covers him with the surplus of his prayer cloak
  recipient: Hudhayfa
  time: until morning
  quoted: qum ya nauman
- id: h-5334.1-towers
  ref: Jāmiʿ 48:5334.1
  unit: hadith-48-women-in-the-towers
  agent: the boys
  action: are kept with the women
  place: the tower (utum) of Hassan
  time: the day of the Trench
- id: h-5335.1-dates
  ref: Jāmiʿ 48:5335.1
  unit: hadith-48-ghatafan-asks-half-dates
  agent: al-Harith al-Ghatafani
  action: demands half of Medina's dates
  recipient: the prophet
  outcome: the two Saʿds refuse
  quoted: nasifna tamr al-madina
- id: h-5335.1-sea
  ref: Jāmiʿ 48:5335.1
  unit: hadith-48-ghatafan-asks-half-dates
  agent: al-Harith
  action: begs the prophet to restrain Hassan's tongue
  instrument: the sea's water
  quoted: law muzija bihi ma' al-bahr la-mazajahu
- id: h-5337.2-dig
  ref: Jāmiʿ 48:5337.2
  unit: hadith-48-digging-the-trench
  agent:
  - the Emigrants
  - the Helpers
  action: dig the trench and carry earth on their backs
  time: a cold morning
  place: around Medina
  quoted: lam yakun lahum ʿabidun
- id: h-5337.1-chant
  ref: Jāmiʿ 48:5337.1
  unit: hadith-48-digging-the-trench
  agent: the prophet
  action: chants for the diggers
  quoted: allahumma la ʿaysha illa ʿaysh al-akhira fa-ghfir li-l-ansar wa-l-muhajira
- id: h-5337.3-ihala
  ref: Jāmiʿ 48:5337.3
  unit: hadith-48-digging-the-trench
  agent: the diggers
  action: are fed barley cooked in rancid fat
  object: a double handful of barley
  quoted: bi-ihalatin sanikha ... bashiʿa fi l-halq
- id: h-5338.3-ammar
  ref: Jāmiʿ 48:5338.3
  unit: hadith-48-digging-the-trench
  agent: the prophet
  action: foretells Ammar's death
  recipient: Ammar b. Yasir
  quoted: taqtuluhu al-fi'a al-baghiya
- id: h-5339.1-rajaz
  ref: Jāmiʿ 48:5339.1
  unit: hadith-48-digging-the-trench
  agent: the prophet
  action: carries earth and chants Ibn Rawaha's rajaz
  outcome: dust covers his chest hair
  name: ʿAbd Allah b. Rawaha
  quoted: allahumma law la anta ma htadayna
- id: h-5339.2-feast
  ref: Jāmiʿ 48:5339.2
  unit: hadith-48-jabirs-feast-at-the-trench
  agent: the prophet
  action: feeds the army from a small meal
  object:
  - a saʿ of barley
  - a young goat
  number: 1000
  outcome: the pot still boils and the dough is still baked
  quoted: inna burmatana la-taghittu kama hiya
- id: h-5339.2-spit
  ref: Jāmiʿ 48:5339.2
  unit: hadith-48-jabirs-feast-at-the-trench
  agent: the prophet
  action: spits into the dough and the pot and blesses them
  object:
  - dough
  - cooking pot
  quoted: fa-basaqa fihi wa-baraka
- id: h-5340.1-stone
  ref: Jāmiʿ 48:5340.1
  unit: hadith-48-jabirs-feast-at-the-trench
  agent: the prophet
  action: stands with a stone bound on his belly
  time: three days without food
  quoted: wa-batnuhu maʿsubun bi-hajar
- id: h-5340.1-kudya
  ref: Jāmiʿ 48:5340.1
  unit: hadith-48-jabirs-feast-at-the-trench
  agent: the prophet
  action: strikes a hard rock with a pickaxe
  outcome: it becomes flowing sand
  quoted: fa-ʿada kathiban ahyal
- id: h-5341.1-strikes
  ref: Jāmiʿ 48:5341.1
  unit: hadith-48-rock-of-three-strikes
  agent: the prophet
  action: strikes the rock three times reciting Q 6:115
  number: 3
  outcome: a third breaks off with each flash
  object:
  - cities of Kisra
  - cities of Caesar
  - cities of Abyssinia
  name: Salman al-Farisi
- id: h-5341.1-turks
  ref: Jāmiʿ 48:5341.1
  unit: hadith-48-rock-of-three-strikes
  agent: the prophet
  action: orders the Abyssinians and Turks left alone
  quoted: daʿu l-habasha ma wadaʿukum wa-truku l-turk ma tarakukum
- id: h-5344.1-guard
  ref: Jāmiʿ 48:5344.1
  unit: hadith-48-saad-guards-the-prophet
  agent: Saʿd b. Abi Waqqas
  action: comes armed to guard the prophet by night
  outcome: the prophet sleeps and snores
  quoted: layta rajulun salihun min ashabi yahrusuni
- id: h-5345.1-hawari
  ref: Jāmiʿ 48:5345.1
  unit: hadith-48-zubayr-the-hawari
  agent: al-Zubayr
  action: volunteers for news of the enemy
  number: 3
  quoted: inna li-kulli nabiyyin hawariyyan wa-hawariyya al-zubayr
- id: h-5345.2-routing
  ref: Jāmiʿ 48:5345.2
  unit: hadith-48-ahzab-prayers-and-the-lost-afternoon
  agent: the prophet
  action: prays against the confederates
  name:
  - munzil al-kitab
  - sariʿ al-hisab
  quoted: ihzim al-ahzab ... wa-zalzilhum
- id: h-5345.3-graves
  ref: Jāmiʿ 48:5345.3
  unit: hadith-48-ahzab-prayers-and-the-lost-afternoon
  agent: the prophet
  action: curses the besiegers
  object:
  - their houses
  - their graves
  instrument: fire
  quoted: shaghaluna ʿan al-salat al-wusta hatta ghabat al-shams
- id: h-5345.4-asr
  ref: Jāmiʿ 48:5345.4
  unit: hadith-48-ahzab-prayers-and-the-lost-afternoon
  agent: the prophet
  action: prays the afternoon prayer after sunset, then the sunset prayer
  place: Buthan
  quoted: wa-llahi ma sallaytuha
- id: h-5346.1-awrat
  ref: Jāmiʿ 48:5346.1
  unit: hadith-48-ahzab-prayers-and-the-lost-afternoon
  agent: the companions
  action: are taught a prayer in extremity
  outcome: God routs the enemy with the wind
  quoted: allahumma stur ʿawratina wa-amin rawʿatina
- id: h-5348.1-wahdahu
  ref: Jāmiʿ 48:5348.1
  unit: hadith-48-ahzab-routed-by-god-alone
  agent: the prophet
  action: praises God who routed the confederates
  quoted: wa-ghalaba al-ahzab wahdahu fa-la shay'a baʿdahu
- id: h-5348.2-return
  ref: Jāmiʿ 48:5348.2
  unit: hadith-48-ahzab-routed-by-god-alone
  agent: the prophet
  action: says takbir and a formula on returning from war, hajj or umra
  number: 3
  quoted: ayibuna ʿabiduna sajiduna li-rabbina hamidun
- id: h-5348.3-saba
  ref: Jāmiʿ 48:5348.3
  unit: hadith-48-ahzab-routed-by-god-alone
  agent: God
  action: helps the prophet with one wind and destroys 'Ad with another
  instrument:
  - east wind (saba)
  - west wind (dabur)
  name: ʿAd
  quoted: nusirtu bi-l-saba wa-uhlikat ʿad bi-l-dabur
- id: h-5349.1-raid
  ref: Jāmiʿ 48:5349.1
  unit: hadith-48-now-we-raid-them
  agent: the prophet
  action: announces the end of defensive war
  time: when the confederates withdraw
  quoted: al-ana naghzuhum wa-la yaghzunana
- id: h-5351.1-gabriel
  ref: Jāmiʿ 48:5351.1
  unit: hadith-48-gabriel-sends-to-qurayza
  agent: Gabriel
  action: tells the prophet the angels have not laid down arms
  time: after the prophet laid down arms and bathed
  outcome: points to Qurayza
  quoted: qad wadaʿta al-silah wa-llahi ma wadaʿnah
- id: h-5351.2-mawkib
  ref: Jāmiʿ 48:5351.2
  unit: hadith-48-gabriel-sends-to-qurayza
  agent: Gabriel
  action: rides with the army to Qurayza
  place: lane of Banu Ghanm
  object: rising dust
  quoted: mawkib jibril
- id: h-5352.1-asr-road
  ref: Jāmiʿ 48:5352.1
  unit: hadith-48-gabriel-sends-to-qurayza
  agent: the prophet
  action: forbids the afternoon prayer except at Qurayza
  outcome: neither group blamed
  quoted: la yusalliyanna ahadun al-ʿasr illa fi bani qurayza
- id: h-5352.2-hija
  ref: Jāmiʿ 48:5352.2
  unit: hadith-48-hassan-and-gabriel
  agent: the prophet
  action: tells the poet to satirize the enemy
  recipient: Hassan b. Thabit
  name: Jibril
  quoted: uhjuhum wa-jibrilu maʿak
- id: h-5353.1-judgment
  ref: Jāmiʿ 48:5353.1
  unit: hadith-48-saad-judgment-on-qurayza
  agent: Saʿd b. Muʿadh
  action: judges the besieged
  object:
  - fighters killed
  - children and women captive
  - property divided
  recipient: Banu Qurayza
  quoted:
  - qumu ila sayyidikum
  - qadayta bi-hukm allah ... bi-hukm al-malik
- id: h-5353.2-burst
  ref: Jāmiʿ 48:5353.2
  unit: hadith-48-saad-judgment-on-qurayza
  agent: Saʿd b. Muʿadh
  action: prays that his wound burst if war is over
  outcome: blood flows to the Ghifar tent and he dies
  place: a tent in the mosque
  quoted: fa-nfajarat min labbatihi
- id: h-5354.1-dihya
  ref: Jāmiʿ 48:5354.1
  unit: hadith-48-saad-judgment-on-qurayza
  agent: Gabriel
  action: passes by and is taken for Dihya al-Kalbi
  place: Banu Ghanm
  name: Dihya al-Kalbi
  quoted: tushbihu lihyatuhu wa-sunnatu wajhihi jibril
- id: h-5354.1-dhabh
  ref: Jāmiʿ 48:5354.1
  unit: hadith-48-saad-judgment-on-qurayza
  agent: Abu Lubaba
  action: gestures to the besieged that it is slaughter
  time: after twenty-five nights' siege
  number: 25
  quoted: fa-ashara ilayhim annahu al-dhabh
- id: h-5354.1-beard
  ref: Jāmiʿ 48:5354.1
  unit: hadith-48-saad-judgment-on-qurayza
  agent: the prophet
  action: grips his beard in grief instead of weeping
  quoted: kanat ʿaynuhu la tadmaʿu ʿala ahad ... akhidhun bi-lihyatihi
- id: h-5356.2-cautery
  ref: Jāmiʿ 48:5356.2
  unit: hadith-48-saad-judgment-on-qurayza
  agent: the prophet
  action: cauterizes Saʿd's vein
  instrument: fire (mishqas)
  number: 2
  outcome: it holds until the judgment, then bursts
  quoted: la tukhrij nafsi hatta taqarra ʿayni min bani qurayza
- id: h-5356.2-four-hundred
  ref: Jāmiʿ 48:5356.2
  unit: hadith-48-saad-judgment-on-qurayza
  agent: the Muslims
  action: kill the men of Qurayza
  number: 400
  quoted: wa-kanu arbaʿami'a
- id: h-5357.1-anbata
  ref: Jāmiʿ 48:5357.1
  unit: hadith-48-qurayza-captives
  agent: the Muslims
  action: inspect captives for pubic hair
  outcome: those with hair killed, those without spared
  name: ʿAtiyya al-Qurazi
  quoted: fa-man anbata al-shaʿr qutil
- id: h-5357.2-laugh
  ref: Jāmiʿ 48:5357.2
  unit: hadith-48-qurayza-captives
  agent: a Qurayza woman
  action: laughs until her name is called and is executed
  number: 1
  quoted: tadhaku zahran wa-batnan wa-qad ʿalimat annaha tuqtal
- id: h-5358.1-ijla
  ref: Jāmiʿ 48:5358.1
  unit: hadith-48-jews-of-medina-and-the-palms
  agent: the prophet
  action: expels the Jews of Medina
  object:
  - Banu l-Nadir
  - Banu Qaynuqaʿ
  - Jews of Banu Haritha
  outcome: Qurayza killed after they fought
- id: h-5359.1-umm-ayman
  ref: Jāmiʿ 48:5359.1
  unit: hadith-48-jews-of-medina-and-the-palms
  agent: Umm Ayman
  action: refuses to give back the palms
  outcome: given ten times as much
  number: 10
- id: h-5360.1-thumama
  ref: Jāmiʿ 48:5360.1
  unit: hadith-48-thumama-ibn-uthal
  agent: the prophet
  action: has a captive tied to a mosque pillar and questions him each day
  recipient: Thumama b. Uthal
  number: 3
  outcome: releases him; he bathes and testifies
  quoted: ma ʿindaka ya thumama
- id: h-5360.1-wheat
  ref: Jāmiʿ 48:5360.1
  unit: hadith-48-thumama-ibn-uthal
  agent: Thumama
  action: cuts off wheat from Yamama to Mecca
  place: Mecca
  quoted: la ya'tikum min al-yamama habbatu hinta
- id: h-5361.1-khawf
  ref: Jāmiʿ 48:5361.1
  unit: hadith-48-fear-prayer-at-usfan
  agent: the prophet
  action: leads the fear prayer in two rows, one guarding while the other prostrates
  place:
  - Usfan
  - land of Banu Sulaym
  name: Khalid b. al-Walid
  time: between noon and afternoon prayers
  number: 2
- id: h-5362.1-rakaa
  ref: Jāmiʿ 48:5362.1
  unit: hadith-48-fear-prayer-at-usfan
  agent: Gabriel
  action: orders the army split in two halves
  outcome: each group one rakʿa, the prophet two
  place: between Dajnan and Usfan
  quoted: rakʿatan rakʿatan ... wa-li-rasul allah rakʿatan
- id: h-5364.1-date
  ref: Jāmiʿ 48:5364.1
  unit: hadith-48-the-ambar-on-the-shore
  agent: Abu ʿUbayda
  action: rations the pooled provisions
  object: one date a day
  number: 300
  quoted: tamratan tamratan
- id: h-5365.1-anbar
  ref: Jāmiʿ 48:5365.1
  unit: hadith-48-the-ambar-on-the-shore
  agent: the sea
  action: casts up a great beast
  object: al-ʿanbar
  time:
  - eighteen nights
  - a month
  - half a month
  number: 300
  outcome: the army eats and grows fat
- id: h-5365.1-mayta
  ref: Jāmiʿ 48:5365.1
  unit: hadith-48-the-ambar-on-the-shore
  agent: Abu ʿUbayda
  action: permits the carcass in necessity
  quoted: mayta ... la bal nahnu rusulu rasul allah ... wa-qad udturirtum fa-kulu
- id: h-5364.1-rib
  ref: Jāmiʿ 48:5364.1
  unit: hadith-48-the-ambar-on-the-shore
  agent: Abu ʿUbayda
  action: sets up two ribs and has a mounted camel pass beneath
  object: ribs of the beast
  outcome: the rider does not touch them
- id: h-5365.1-eye
  ref: Jāmiʿ 48:5365.1
  unit: hadith-48-the-ambar-on-the-shore
  agent: Abu ʿUbayda
  action: seats men in the beast's eye socket
  number: 13
  place: eye socket
- id: h-5365.1-rizq
  ref: Jāmiʿ 48:5365.1
  unit: hadith-48-the-ambar-on-the-shore
  agent: the prophet
  action: calls it provision God brought out and eats of it
  quoted: huwa rizqun akhrajahu llahu lakum
- id: h-5365.2-jazur
  ref: Jāmiʿ 48:5365.2
  unit: hadith-48-the-ambar-on-the-shore
  agent: Qays b. Saʿd
  action: slaughters camels for the hungry army
  number:
  - 3
  - 3
  - 3
  outcome: forbidden by Abu ʿUbayda
- id: h-5366.1-turban
  ref: Jāmiʿ 48:5366.1
  unit: hadith-48-turban-and-rules-of-raid
  agent: the prophet
  action: rewinds a black turban for the commander and leaves a tail behind
  recipient: ʿAbd al-Rahman b. ʿAwf
  number: four fingers
  quoted: fa-innahu aʿrafu wa-ahsan
- id: h-5366.1-rules
  ref: Jāmiʿ 48:5366.1
  unit: hadith-48-turban-and-rules-of-raid
  agent: the prophet
  action: lays down the rules of the raid
  object:
  - no stealing from spoils
  - no treachery
  - no mutilation
  - no killing a child
  quoted: la taghullu wa-la taghdiru wa-la tumaththilu wa-la taqtulu walidan
- id: h-5368.1-urayna
  ref: Jāmiʿ 48:5368.1
  unit: hadith-48-the-uraniyyin
  agent: men of ʿUkl and ʿUrayna
  action: drink camel milk and urine, then kill the herdsman and drive off the camels
  place: edge of the harra
  outcome: eyes branded, hands cut, left to die
  quoted: fa-samaru aʿyunahum
- id: h-5370.1-umras
  ref: Jāmiʿ 48:5370.1
  unit: hadith-48-umras-and-ihram-at-hudaybiya
  agent: the prophet
  action: performs umras
  number: 4
  time: Dhu l-Qaʿda
  place:
  - al-Hudaybiya
  - Mecca the next year
  - al-Jiʿrana
  - with the hajj
- id: h-5370.2-ishar
  ref: Jāmiʿ 48:5370.2
  unit: hadith-48-umras-and-ihram-at-hudaybiya
  agent: the prophet
  action: garlands and marks the sacrificial animals and enters ihram
  place: Dhu l-Hulayfa
  quoted:
  - fi bidʿa ʿashrata wa-mi'a min ashabihi (as printed)
  - qallada al-hadya wa-ashʿara
- id: h-5371.2-blocked
  ref: Jāmiʿ 48:5371.2
  unit: hadith-48-umras-and-ihram-at-hudaybiya
  agent: the prophet
  action: slaughters his offerings and shaves when barred
  outcome: companions shave or cut short
  quoted: fa-nahara ... hadayahu wa-halaqa
- id: h-5371.3-murar
  ref: Jāmiʿ 48:5371.3
  unit: hadith-48-pass-of-al-murar
  agent: the prophet
  action: promises forgiveness to whoever climbs the pass
  place: pass of al-Murar
  name: Banu Isra'il
  outcome: the cavalry of al-Khazraj climbs first
  quoted: yuhattu ʿanhu ma hutta ʿan bani isra'il
- id: h-5372.2-bab
  ref: Jāmiʿ 48:5372.2
  unit: hadith-48-pass-of-al-murar
  agent: the prophet
  action: likens a pass to the gate the Israelites entered
  place: pass of al-Hanzal
  time: night
  name: Qatada b. al-Nuʿman
  quoted: ma mathalu hadhihi al-thaniyya illa mathal al-bab
