# Observation records for hadith chunk 19 (al-Jāmiʿ al-Kāmil book 66, the Resurrection, pp. 8526-8578;
# book 67, paradise and hell and their people, pp. 8579-8645).
records:
  # ---- book 66: the Hour, the blasts, the raising
  - {id: h-8527.1-morsel, ref: "Jāmiʿ 66:8527.1", unit: hadith-66-hour-strikes-mid-task, action: the Hour strikes before tasks are completed, object: [cloth spread for sale, milk of a milch-camel, trough being plastered, morsel raised to the mouth], number: 4, quoted: "wa-qad rafa'a ahadukum uklatahu ila fihi fa-la yat'amuha"}
  - {id: h-8527.2-friday, ref: "Jāmiʿ 66:8527.2", unit: hadith-66-hour-on-friday, time: Friday, action: the Hour comes, object: [Adam created, Adam entered paradise, Adam expelled], quoted: "wa-la taqumu al-sa'a illa fi yawm al-jum'a"}
  - {id: h-8528.1-beasts, ref: "Jāmiʿ 66:8528.1", unit: hadith-66-hour-on-friday, agent: every beast except jinn and men, action: listens anxiously for the Hour, time: Friday from dawn to sunrise, place: al-Tur, name: "Ka'b al-Ahbar", quoted: "ma min dabba illa wa-hiya musikha yawm al-jum'a"}
  - {id: h-8528.2-bodies, ref: "Jāmiʿ 66:8528.2", unit: hadith-66-hour-on-friday, agent: God, action: forbids the earth to consume, object: bodies of the prophets, time: Friday, outcome: blessings on the prophet shown to him, quoted: "inna allaha harrama 'ala al-ard ajsad al-anbiya'"}
  - {id: h-8528.3-belied, ref: "Jāmiʿ 66:8528.3", unit: hadith-66-repeating-creation-not-harder, agent: son of Adam, action: belies and reviles God, quoted: ["lan yu'idani kama bada'ani", "ittakhadha allahu waladan"]}
  - {id: h-8529.1-trumpeter, ref: "Jāmiʿ 66:8529.1", unit: hadith-66-the-trumpet, agent: holder of the trumpet, action: holds the horn in his mouth and bends his brow awaiting the order, quoted: ["sahib al-sur qad iltaqama wa-hana jabhatahu", "hasbuna allahu wa-ni'ma al-wakil"]}
  - {id: h-8529.2-horn, ref: "Jāmiʿ 66:8529.2", unit: hadith-66-the-trumpet, agent: a bedouin, action: asks what the sur is, object: trumpet, outcome: a horn blown into, quoted: "qarnun yunfakhu fihi"}
  - {id: h-8529.3-sequence, ref: "Jāmiʿ 66:8529.3", unit: hadith-66-from-dajjal-to-second-blast, agent: God, action: sends Jesus to kill the Dajjal then a cold wind, name: [Isa b. Maryam, Urwa b. Mas'ud], place: from Syria, time: [forty (days, months or years), seven years], quoted: ["ka-annahu 'Urwa b. Mas'ud", "rihan baridatan min qibal al-sham"]}
  - {id: h-8529.3-worst, ref: "Jāmiʿ 66:8529.3", unit: hadith-66-from-dajjal-to-second-blast, agent: Satan, action: appears to the worst people and bids them worship idols, recipient: the worst left, quoted: "fi khiffat al-tayr wa-ahlam al-siba'"}
  - {id: h-8529.3-trough, ref: "Jāmiʿ 66:8529.3", unit: hadith-66-from-dajjal-to-second-blast, agent: first hearer of the trumpet, action: "plasters his camels' trough", outcome: swoons and the people swoon, quoted: "rajulun yalutu hawda ibilihi"}
  - {id: h-8529.3-dew, ref: "Jāmiʿ 66:8529.3", unit: hadith-66-from-dajjal-to-second-blast, agent: God, action: sends rain like dew between the blasts, outcome: "people's bodies grow from it", quoted: "matran ka-annahu al-tall ... fa-tanbutu minhu ajsad al-nas"}
  - {id: h-8529.3-999, ref: "Jāmiʿ 66:8529.3", unit: hadith-66-from-dajjal-to-second-blast, action: brings out the contingent of the fire, number: "999 of every 1000", quoted: "min kulli alfin tis'a-mi'a wa-tis'a wa-tis'in"}
  - {id: h-8531.1-tailbone, ref: "Jāmiʿ 66:8531.1", unit: hadith-66-tailbone-and-the-forty, agent: the earth, action: eats every son of Adam, object: all but the tailbone, outcome: man is reassembled from it, quoted: "illa 'ajb al-dhanab minhu khuliqa wa-fihi yurakkab"}
  - {id: h-8531.3-drizzle, ref: "Jāmiʿ 66:8531.3", unit: hadith-66-tailbone-and-the-forty, action: people are raised, time: while the sky drizzles, quoted: "wa-l-sama' tatishshu 'alayhim"}
  - {id: h-8531.4-forty, ref: "Jāmiʿ 66:8531.4", unit: hadith-66-tailbone-and-the-forty, agent: Abu Hurayra, action: refuses to specify the forty, time: between the two blasts, number: 40, outcome: God sends water and they grow like herbs, quoted: ["ma bayna al-nafkhatayn arba'un ... abaytu", "ka-ma yanbutu al-baql"]}
  - {id: h-8532.2-throne, ref: "Jāmiʿ 66:8532.2", unit: hadith-66-moses-holding-the-throne, agent: the prophet, action: is first raised and finds Moses holding the Throne, name: Musa, outcome: does not know if Moses was spared for his swoon at al-Tur, quoted: "fa-la adri a-husiba bi-sa'qatihi yawm al-tur am bu'itha qabli"}
  - {id: h-8532.2-slap, ref: "Jāmiʿ 66:8532.2", unit: hadith-66-moses-holding-the-throne, agent: an Ansari, action: slaps a Jew, recipient: a Jew selling goods, outcome: the prophet forbids preferring among prophets, quoted: "la wa-lladhi stafa musa 'ala al-bashar"}
  - {id: h-8533.2-bayda, ref: "Jāmiʿ 66:8533.2", unit: hadith-66-raised-on-what-he-died, agent: an army, action: marches on a Qurayshi who sought refuge at the House, place: "al-Bayda'", outcome: swallowed by the earth; raised on their intentions, quoted: ["hatta idha kanu bi-l-bayda' khusifa bihim", "yab'athuhum allahu 'ala niyyatihim"]}
  - {id: h-8533.3-talbiya, ref: "Jāmiʿ 66:8533.3", unit: hadith-66-pilgrim-raised-in-talbiya, agent: the prophet, action: orders the burial of a pilgrim thrown by his mount, place: Arafa, instrument: [water and lote leaves, two cloths], number: 2, outcome: "no perfume, head uncovered; raised saying the talbiya", quoted: "wa-la tukhammiru ra'sahu fa-inna allaha yab'athuhu yawm al-qiyama mulabbiyan"}
  - {id: h-8533.4-musk, ref: "Jāmiʿ 66:8533.4", unit: hadith-66-martyr-wound-scent-of-musk, agent: "one wounded in God's path", action: comes on resurrection day with wound gushing, outcome: "colour of blood, scent of musk", quoted: "al-lawn lawn dam wa-l-rih rih al-misk"}
  - {id: h-8534.4-buhm, ref: "Jāmiʿ 66:8534.4", unit: hadith-66-gathered-naked-uncircumcised, agent: God, action: calls in a voice heard far as near, name: [al-Malik, al-Dayyan], outcome: "rights settled by good and bad deeds, even a slap", quoted: ["'uratan ghurlan buhman", "ana al-malik ana al-dayyan", "hatta al-latma"]}
  - {id: h-8534.4-journey, ref: "Jāmiʿ 66:8534.4", unit: hadith-66-gathered-naked-uncircumcised, agent: Jabir b. Abd Allah, action: travels to Abd Allah b. Unays to hear the hadith}
  - {id: h-8535.1-sawda, ref: "Jāmiʿ 66:8535.1", unit: hadith-66-gathered-naked-uncircumcised, agent: Sawda, action: asks whether people will look at one another, outcome: "people too occupied; recites Q 80:34-37", quoted: ["wa-sawatah", "shughila al-nas 'an dhalik"]}
  - {id: h-8535.2-clothes, ref: "Jāmiʿ 66:8535.2", unit: hadith-66-raised-in-death-clothes, agent: "Abu Sa'id al-Khudri", action: calls for new clothes and wears them, time: at his death, outcome: the dead raised in the clothes he dies in, quoted: "inna al-mayyit yub'athu fi thiyabihi allati yamutu fiha"}
  - {id: h-8536.1-clothed, ref: "Jāmiʿ 66:8536.1", unit: hadith-66-abraham-first-clothed, agent: God, action: clothes first, recipient: Abraham, outcome: "men of the prophet's community taken to the left", quoted: ["awwal man yuksa yawm al-qiyama ibrahim", "la tadri ma ahdathu ba'dak"]}
  - {id: h-8537.1-bulas, ref: "Jāmiʿ 66:8537.1", unit: hadith-66-arrogant-as-ants, agent: the arrogant, action: gathered like ants in human form, place: a prison in hell, name: Bulas, object: [fire of fires, tinat al-khabal], quoted: ["amthal al-dharr fi suwar al-nas", "sijnan fi jahannam yuqalu lahu bulas"]}
  - {id: h-8537.2-loaf, ref: "Jāmiʿ 66:8537.2", unit: hadith-66-white-earth-of-gathering, action: people gathered, place: a white reddish earth like a loaf of fine flour, outcome: no landmark of anyone, quoted: "ka-qursat al-naqiyy laysa fiha 'alamun li-ahad"}
  - {id: h-8538.1-seventy, ref: "Jāmiʿ 66:8538.1", unit: hadith-66-sweat-by-deeds, agent: people, action: sweat, number: 70 cubits, outcome: sweat sinks into the earth and reaches their ears, quoted: "hatta yadhhaba 'araquhum fi al-ard sab'ina dhira'an"}
  - {id: h-8538.3-mile, ref: "Jāmiʿ 66:8538.3", unit: hadith-66-sweat-by-deeds, agent: the sun, action: is brought within a mile of creatures, object: sweat by deeds, outcome: [ankles, knees, waist, bridled], quoted: "a-masafat al-ard am al-mil alladhi taktahilu bihi al-'ayn"}
  - {id: h-8538.4-skulls, ref: "Jāmiʿ 66:8538.4", unit: hadith-66-sweat-by-deeds, agent: the sun, action: boils the skulls, instrument: heat, outcome: sweat by sins, quoted: "yaghli minha al-ham kama taghli al-qudur"}
  - {id: h-8538.5-levels, ref: "Jāmiʿ 66:8538.5", unit: hadith-66-sweat-by-deeds, action: sweat rises by degrees, object: [ankles, half the shin, knees, buttocks, flank, neck, mid-mouth, covered], number: 8}
  - {id: h-8539.2-relief, ref: "Jāmiʿ 66:8539.2", unit: hadith-66-sweat-by-deeds, agent: the unbeliever, action: begs relief, outcome: even into the fire, quoted: "arihni wa-law ila al-nar"}
  - {id: h-8539.3-seven, ref: "Jāmiʿ 66:8539.3", unit: hadith-66-shaded-on-day-without-shade, agent: God, action: shades, recipient: [just ruler, youth raised in worship, man attached to the mosque, two who love in God, man weeping alone, man refusing a noble beautiful woman, secret giver], number: 7, quoted: "hatta la ta'lama shimaluhu ma tunfiqu yaminuhu"}
  - {id: h-8541.1-surahs, ref: "Jāmiʿ 66:8541.1", unit: hadith-66-three-surahs-show-the-day, action: recites to see the Day, object: [al-Takwir, al-Infitar, al-Inshiqaq], number: 3, quoted: "ka-annahu ra'y 'ayn"}
  - {id: h-8541.2-gold, ref: "Jāmiʿ 66:8541.2", unit: hadith-66-earthful-of-gold, agent: God, action: asks if the unbeliever would ransom himself, object: earthful of gold, outcome: less was asked of him, quoted: "qad kunta su'ilta ma huwa aysaru min dhalik"}
  - {id: h-8542.2-hands, ref: "Jāmiʿ 66:8542.2", unit: hadith-66-god-folds-heavens-and-earth, agent: God, action: rolls up the heavens and the earths, instrument: [right hand, left hand], quoted: "ana al-malik ayna al-jabbarun ayna al-mutakabbirun"}
  - {id: h-8542.3-pulpit, ref: "Jāmiʿ 66:8542.3", unit: hadith-66-god-folds-heavens-and-earth, agent: the prophet, action: "closes and opens his fingers miming God's grasp", place: the pulpit, outcome: the pulpit shakes as if to fall, quoted: "hatta nazartu ila al-minbar yataharraku"}
  - {id: h-8542.4-fingers, ref: "Jāmiʿ 66:8542.4", unit: hadith-66-god-folds-heavens-and-earth, agent: a rabbi (habr), action: says God holds creation on fingers, object: [heavens, earths, mountains and trees, water and soil, rest of creation], number: 5, outcome: "the prophet laughs in assent and recites Q 39:67", quoted: "fa-dahika rasul allah ta'ajjuban mimma qala al-habr tasdiqan lahu"}
  - {id: h-8543.2-forty, ref: "Jāmiʿ 66:8543.2", unit: hadith-66-forty-years-gazing-up, agent: first and last, action: stand gazing at the sky awaiting judgment, time: forty years, outcome: God descends in shadows of cloud from Throne to Footstool, quoted: "fi zulalin min al-ghamam min al-'arsh ila al-kursi"}
  - {id: h-8543.3-half-day, ref: "Jāmiʿ 66:8543.3", unit: hadith-66-forty-years-gazing-up, action: people stand for the Lord, time: half a day of fifty thousand years, number: 50000, outcome: for believers like the sun setting}
  # ---- intercession
  - {id: h-8544.1-ring, ref: "Jāmiʿ 66:8544.1", unit: hadith-66-great-intercession, agent: the prophet, action: walks and takes the ring of the door, name: [Adam, Musa, Muhammad], outcome: raised to the praised station, quoted: "fa-yamshi hatta ya'khudha bi-halqat al-bab"}
  - {id: h-8545.1-chain, ref: "Jāmiʿ 66:8545.1", unit: hadith-66-great-intercession, agent: people, action: seek intercession from prophet after prophet, recipient: [Adam, Nuh, Ibrahim, Musa, Isa, Muhammad], number: 6, outcome: "each says 'nafsi nafsi' and cites a fault; Jesus cites none", quoted: ["nahani 'an al-shajara fa-'asaytuhu", "kanat li da'watun da'awtu biha 'ala qawmi", "wa-dhakara kadhabatihi", "qataltu nafsan lam u'mar bi-qatliha", "wa-lam yadhkur lahu dhanban"]}
  - {id: h-8545.1-foreleg, ref: "Jāmiʿ 66:8545.1", unit: hadith-66-great-intercession, agent: the prophet, action: bites the foreleg, object: meat, outcome: tells the intercession hadith, quoted: "fa-nahasa minha nahsa"}
  - {id: h-8545.1-gate, ref: "Jāmiʿ 66:8545.1", unit: hadith-66-great-intercession, agent: God, action: admits those without reckoning, place: right-hand gate of paradise, number: "door leaves apart as Mecca to Hajar or Busra", quoted: "min al-bab al-ayman min abwab al-janna"}
  - {id: h-8546.1-one-man, ref: "Jāmiʿ 66:8546.1", unit: hadith-66-great-intercession, agent: a prophet, action: is believed, number: 1, outcome: only one man of his community believed him, quoted: "ma yusaddiquhu min ummatihi illa rajulun wahid"}
  - {id: h-8546.2-uncle, ref: "Jāmiʿ 66:8546.2", unit: hadith-66-uncle-in-shallow-fire, agent: "the prophet's intercession", recipient: his uncle, place: a shallow of fire, number: to the ankles, outcome: his brain boils, quoted: "fi dahdah min al-nar yablughu ka'bayhi yaghli minhu dimaghuhu"}
  - {id: h-8547.3-cucumbers, ref: "Jāmiʿ 66:8547.3", unit: hadith-66-intercession-for-grave-sinners, action: people brought out of the fire by intercession, outcome: like small cucumbers, quoted: "ka-annahum al-tha'arir ... al-daghabis"}
  - {id: h-8548.1-dinar, ref: "Jāmiʿ 66:8548.1", unit: hadith-66-believers-plead-for-brothers, agent: believers, action: retrieve brothers from the fire, object: those with good in their hearts, number: [dinar, half dinar, atom], instrument: river of life, outcome: God takes a handful of those who never did good; they sprout like seed in flood-silt, quoted: ["mithqal dinar ... mithqal nisf dinar ... mithqal dharra", "nahr al-hayat"]}
  - {id: h-8548.2-rounds, ref: "Jāmiʿ 66:8548.2", unit: hadith-66-believers-plead-for-brothers, agent: [angels, prophets, martyrs], action: intercede and bring out, number: "3 or 4 rounds", place: the bridge, quoted: "taqadu' al-farash fi al-nar"}
  - {id: h-8549.1-date, ref: "Jāmiʿ 66:8549.1", unit: hadith-66-no-interpreter, agent: God, action: speaks to each without interpreter, outcome: "right and left only his deeds, ahead the fire; guard with half a date or a good word", quoted: "laysa baynahu wa-baynahu tarjuman"}
  - {id: h-8549.3-scrutiny, ref: "Jāmiʿ 66:8549.3", unit: hadith-66-scrutinized-reckoning, agent: "A'isha", action: "objects with Q 84:7-8", outcome: easy reckoning is the display; scrutiny is punishment, quoted: "innama dhalika al-'ard"}
  # ---- reckoning
  - {id: h-8550.2-three, ref: "Jāmiʿ 66:8550.2", unit: hadith-66-three-first-into-fire, agent: God, action: judges first, recipient: [martyr, scholar and reciter, rich giver], number: 3, outcome: dragged on their faces into the fire, quoted: ["li-an yuqala jari'", "li-yuqala 'alim", "li-yuqala huwa jawad"]}
  - {id: h-8550.3-faint, ref: "Jāmiʿ 66:8550.3", unit: hadith-66-three-first-into-fire, agent: Abu Hurayra, action: faints before telling, recipient: Shufayy al-Asbahi, number: 4, place: Medina, outcome: "Mu'awiya weeps on hearing it", quoted: "thumma nashagha abu hurayra nashghatan"}
  - {id: h-8552.1-prayer, ref: "Jāmiʿ 66:8552.1", unit: hadith-66-firsts-of-the-reckoning, agent: God, action: has the angels complete obligatory prayer from voluntary, object: prayer, outcome: other deeds reckoned likewise, quoted: "unzuru hal tajiduna li-'abdi min tatawwu'"}
  - {id: h-8552.2-blood, ref: "Jāmiʿ 66:8552.2", unit: hadith-66-firsts-of-the-reckoning, action: judged first between people, object: blood, quoted: "awwal ma yuqda bayna al-nas yawm al-qiyama fi al-dima'"}
  - {id: h-8552.3-neighbours, ref: "Jāmiʿ 66:8552.3", unit: hadith-66-firsts-of-the-reckoning, agent: two neighbours, action: are the first disputants, quoted: "awwal khasmayn yawm al-qiyama jaran"}
  - {id: h-8553.1-water, ref: "Jāmiʿ 66:8553.1", unit: hadith-66-asked-about-bliss, agent: God, action: asks first of bliss, object: [healthy body, cool water], quoted: "a-lam nusihha laka jismaka wa-nurwika min al-ma' al-barid"}
  - {id: h-8553.2-feast, ref: "Jāmiʿ 66:8553.2", unit: hadith-66-asked-about-bliss, agent: an Ansari, action: "feeds the hungry prophet, Abu Bakr and Umar", object: [cluster of dates, a ewe], outcome: told not to slaughter the milch-ewe; they will be asked about this bliss, quoted: ["iyyaka wa-l-halub", "la-tus'alunna 'an hadha al-na'im"]}
  - {id: h-8554.1-four, ref: "Jāmiʿ 66:8554.1", unit: hadith-66-asked-about-bliss, action: a servant is asked before his feet move, object: [life, knowledge, wealth, body], number: 4, quoted: "la tazulu qadama 'abdin"}
  - {id: h-8554.2-noah, ref: "Jāmiʿ 66:8554.2", unit: hadith-66-community-witness-for-noah, agent: Muhammad and his community, action: testify that Noah conveyed, recipient: "Noah's people", name: Nuh, quoted: "ma atana min nadhir ... muhammad wa-ummatuhu"}
  - {id: h-8555.1-laka, ref: "Jāmiʿ 66:8555.1", unit: hadith-66-medina-hardship, agent: Abd Allah b. Umar, action: tells his freedwoman to stay in Medina, recipient: a freedwoman, time: the civil strife, quoted: "uq'udi laka'"}
  - {id: h-8555.2-harra, ref: "Jāmiʿ 66:8555.2", unit: hadith-66-medina-hardship, agent: "Abu Sa'id al-Khudri", action: refuses to advise leaving Medina, recipient: "Abu Sa'id mawla al-Mahri", time: the nights of al-Harra, quoted: "la amuruka bi-dhalika"}
  - {id: h-8555.3-thigh, ref: "Jāmiʿ 66:8555.3", unit: hadith-66-limbs-testify, action: seals the mouth and bids the limbs speak, object: [thigh, flesh, bones], recipient: the hypocrite, quoted: "fa-yukhtamu 'ala fihi wa-yuqalu li-fakhidhihi wa-lahmihi wa-'izamihi intiqi"}
  - {id: h-8556.1-limbs, ref: "Jāmiʿ 66:8556.1", unit: hadith-66-limbs-testify, agent: a servant, action: demands a witness from himself, outcome: his limbs speak; he curses them, quoted: "bu'dan lakunna wa-suhqan fa-'ankunna kuntu unadilu"}
  - {id: h-8556.2-gag, ref: "Jāmiʿ 66:8556.2", unit: hadith-66-limbs-testify, action: mouths gagged, object: [thigh, palm], outcome: thigh and palm speak first, quoted: "mufaddamatan afwahukum bi-l-fidam"}
  - {id: h-8557.1-adhan, ref: "Jāmiʿ 66:8557.1", unit: hadith-66-witnesses-muezzin-black-stone, agent: "Abu Sa'id al-Khudri", action: tells a herdsman to raise his voice in the call to prayer, place: among sheep and desert, recipient: [jinn, men, everything], outcome: all within reach testify for him}
  - {id: h-8557.2-twenty-five, ref: "Jāmiʿ 66:8557.2", unit: hadith-66-witnesses-muezzin-black-stone, agent: the muezzin, action: is forgiven the reach of his voice, number: 25, outcome: every wet and dry thing testifies; attendant written 25 prayers}
  - {id: h-8557.3-stone, ref: "Jāmiʿ 66:8557.3", unit: hadith-66-witnesses-muezzin-black-stone, agent: God, action: raises the Black Stone, object: [two eyes, a tongue], outcome: witnesses for whoever touched it rightly, quoted: "lahu 'aynani yubsiru bihima wa-lisanun yantiqu bihi"}
  - {id: h-8558.1-kanaf, ref: "Jāmiʿ 66:8558.1", unit: hadith-66-believer-screened-and-forgiven, agent: God, action: "draws the believer near, puts his side over him and makes him confess", outcome: forgiven; given the scroll of his good deeds, quoted: "hatta yada'a 'alayhi kanafahu ... satartuha 'alayka fi al-dunya"}
  - {id: h-8559.1-forget, ref: "Jāmiʿ 66:8559.1", unit: hadith-66-forgotten-as-he-forgot, agent: God, action: asks the servant if he thought he would meet him, object: [honour, mastery, wife, horses and camels], outcome: I forget you as you forgot me, quoted: "fa-inni ansaka kama nasitani"}
  - {id: h-8560.1-tihama, ref: "Jāmiʿ 66:8560.1", unit: hadith-66-mountains-of-deeds-to-dust, agent: God, action: makes scattered dust, object: good deeds like the mountains of Tihama, recipient: those who violate limits in private, quoted: "amthal jibal tihama bidan"}
  - {id: h-8560.2-bridge, ref: "Jāmiʿ 66:8560.2", unit: hadith-66-retaliation-of-wrongs, agent: believers, action: are held for retaliation, place: a bridge between paradise and fire, outcome: "purified, they know their homes in paradise better than in the world", quoted: "qantara bayna al-janna wa-l-nar"}
  - {id: h-8561.1-bankrupt, ref: "Jāmiʿ 66:8561.1", unit: hadith-66-retaliation-of-wrongs, agent: the bankrupt, action: pays his victims from his good deeds, object: [prayer, fasting, alms], outcome: takes their sins and is thrown into the fire, quoted: "inna al-muflis min ummati"}
  - {id: h-8563.1-ewes, ref: "Jāmiʿ 66:8563.1", unit: hadith-66-retaliation-of-wrongs, agent: a goat, action: butts another and makes it miscarry, outcome: the prophet laughs; it will be avenged on resurrection day, quoted: "la-yuqadanna laha yawm al-qiyama"}
  - {id: h-8562.1-hornless, ref: "Jāmiʿ 66:8562.1", unit: hadith-66-retaliation-of-wrongs, action: avenged, object: hornless ewe, recipient: horned ewe, quoted: "li-l-shat al-jalha' min al-shat al-qarna'"}
  # ---- scale, pool, bridge
  - {id: h-8564.1-horse, ref: "Jāmiʿ 66:8564.1", unit: hadith-66-the-scale, agent: "owner of a horse kept for God's path", action: has weighed in his scale, object: [its fill, its drink, its dung, its urine]}
