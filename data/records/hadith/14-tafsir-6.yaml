  - {"id": "h-7321.1-gabriel", "ref": "Jāmiʿ 60:7321.1", "unit": "hadith-60-q31-five-keys-of-unseen", "agent": "a man (Gabriel)", "action": "asks what faith, islam, ihsan are and when the Hour is", "recipient": "the prophet", "outcome": "vanishes; 'this was Gabriel come to teach people their religion'", "name": "Jibril", "number": 5, "quoted": "hadha jibril ja'a li-yu'allima al-nas dinahum"}
