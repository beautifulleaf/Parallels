  - {"id": "h-7321.2-keys", "ref": "Jāmiʿ 60:7321.2", "unit": "hadith-60-q31-five-keys-of-unseen", "object": "keys of the unseen", "number": 5, "action": "known only to God", "quoted": "mafatih al-ghayb khams"}
  - {"id": "h-7322.1-enter", "ref": "Jāmiʿ 60:7322.1", "unit": "hadith-60-q31-five-keys-of-unseen", "agent": "a man of Banu Amir", "action": "asks 'may I come in?' (a-alij)", "outcome": "taught to say 'peace be upon you, may I enter?'", "quoted": "al-salam 'alaykum a-adkhul"}
