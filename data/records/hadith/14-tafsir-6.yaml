  - {"id": "h-7313.1-famine", "ref": "Jāmiʿ 60:7313.1", "unit": "hadith-60-q30-smoke-and-five-past", "agent": "the prophet", "action": "prays against Quraysh", "number": 7, "name": "Joseph", "outcome": "famine; they eat carrion and bones and see a smoke between sky and earth", "quoted": "bi-sab' ka-sab' yusuf"}
  - {"id": "h-7313.2-five", "ref": "Jāmiʿ 60:7313.2", "unit": "hadith-60-q30-smoke-and-five-past", "agent": "Ibn Masud", "object": ["the smoke", "al-lizam", "the Romans", "the seizure", "the moon"], "action": "counts as already past", "number": 5, "quoted": "khams qad madayna"}
  - {"id": "h-7314.1-foam", "ref": "Jāmiʿ 60:7314.1", "unit": "hadith-60-q30-glorification-and-restoration", "action": "says 'glory to God and his praise'", "number": 100, "time": "in a day", "outcome": "sins erased though like the foam of the sea", "quoted": "subhan allah wa-bi-hamdihi ... mi'at marra ... mithla zabad al-bahr"}
  - {"id": "h-7314.4-fitra", "ref": "Jāmiʿ 60:7314.4", "unit": "hadith-60-q30-fitra", "object": "every newborn", "action": "born on the fitra", "agent": "its parents", "outcome": "make it Jew, Christian or Magian", "instrument": "simile of a beast born whole, none born with ears cut", "quoted": "yuhawwidanihi aw yunassiranihi aw yumajjisanihi; bahima jam'a' ... min jad'a'"}
  - {"id": "h-7315.1-hanif", "ref": "Jāmiʿ 60:7315.1", "unit": "hadith-60-q30-fitra", "agent": "devils", "action": "lead God's servants away from their religion", "object": "servants created hanif", "outcome": "forbid what God allowed and bid association", "quoted": "khalaqtu 'ibadi hunafa' kullahum ... fa-jtalathum"}
  - {"id": "h-7316.1-foal", "ref": "Jāmiʿ 60:7316.1", "unit": "hadith-60-q30-believer-and-alms", "agent": "God", "action": "takes alms in his right hand and raises it", "object": "a date's worth of lawful alms", "outcome": "grows like a mountain", "instrument": "simile of raising a foal", "quoted": "kama yurabbi ahadukum fuluwwahu"}
  - {"id": "h-7318.1-luqman", "ref": "Jāmiʿ 60:7318.1", "unit": "hadith-60-q31-luqman-and-wrong", "agent": "Luqman the sage", "action": "says what God is entrusted with he guards", "name": "Luqman", "quoted": "inna allaha idha ustudi'a shay'an hafizahu"}
  - {"id": "h-7318.2-sins", "ref": "Jāmiʿ 60:7318.2", "unit": "hadith-60-q31-luqman-and-wrong", "object": ["setting up a rival to God", "killing one's child for fear it eats with you", "adultery with the neighbour's wife"], "action": "ranked as greatest sins", "number": 3, "quoted": "an tuzaniya halilata jarika"}
  - {"id": "h-7318.3-zulm", "ref": "Jāmiʿ 60:7318.3", "unit": "hadith-60-q31-luqman-and-wrong", "agent": "the prophet", "action": "glosses 'wrong' in 6:82 as association", "name": "Luqman", "quoted": "innama huwa kama qala luqman li-bnihi"}
  - {"id": "h-7319.1-nose", "ref": "Jāmiʿ 60:7319.1", "unit": "hadith-60-q31-parents-trial-pride", "action": "curses with 'may his nose be in the dust'", "number": 3, "object": "one who reached his parents' old age and did not enter paradise", "quoted": "raghima anf thumma raghima anf"}
