records:
  - {"id": "h-7300.1-faith", "ref": "Jāmiʿ 60:7300.1", "unit": "hadith-60-q28-faith-only-to-loved-and-humility", "agent": "God", "action": "gives the world to those he loves and does not love; faith only to those he loves", "quoted": "yu'ti al-dunya man yuhibbu wa-man la yuhibbu wa-la yu'ti al-iman illa man yuhibbu"}
  - {"id": "h-7300.3-pride", "ref": "Jāmiʿ 60:7300.3", "unit": "hadith-60-q28-faith-only-to-loved-and-humility", "object": "an atom's weight of pride", "outcome": "bars entry to paradise", "quoted": ["mithqal dharra min kibr", "inna allaha jamil yuhibbu al-jamal"]}
  - {"id": "h-7301.1-maad", "ref": "Jāmiʿ 60:7301.1", "unit": "hadith-60-q28-faith-only-to-loved-and-humility", "agent": "Ibn Abbas", "action": "glosses the place of return (ma'ad)", "name": "Mecca", "quoted": "ila makka"}
  - {"id": "h-7302.1-mother", "ref": "Jāmiʿ 60:7302.1", "unit": "hadith-60-q29-saad-mother-and-verses", "agent": "Sa'd's mother", "action": "swears not to speak, eat or drink until her son leaves his religion", "time": "three days", "number": 3, "outcome": "faints; a son named Umara gives her drink; 29:8 and 31:15 come down", "name": ["Hamna bint Abi Sufyan", "Umara"], "quoted": "makathat thalathan hatta ghushiya 'alayha min al-jahd"}
  - {"id": "h-7302.1-sword", "ref": "Jāmiʿ 60:7302.1", "unit": "hadith-60-q29-saad-mother-and-verses", "agent": "Sa'd", "action": "asks for a sword from the spoils", "recipient": "the prophet", "number": 2, "outcome": "told twice to return it; 8:1 comes down", "quoted": "ruddahu min haythu akhadhtahu"}
  - {"id": "h-7302.1-third", "ref": "Jāmiʿ 60:7302.1", "unit": "hadith-60-q29-saad-mother-and-verses", "agent": "Sa'd", "action": "asks to bequeath all, then half, then a third", "outcome": "refused, refused, silence; a third became permitted", "number": 3, "quoted": "fa-l-thuluth qala fa-sakata"}
  - {"id": "h-7302.1-jaw", "ref": "Jāmiʿ 60:7302.1", "unit": "hadith-60-q29-saad-mother-and-verses", "agent": "an Ansari", "action": "strikes Sa'd with the jawbone of a roast camel's head", "place": "a walled garden (hashsh)", "time": "before wine was forbidden", "outcome": "Sa'd's nose split; 5:90 comes down", "instrument": "camel jawbone", "quoted": "fa-akhadha rajul ahad lahyay al-ra's fa-darabani bihi"}
  - {"id": "h-7304.2-cain", "ref": "Jāmiʿ 60:7304.2", "unit": "hadith-60-q29-burdens-of-those-misled", "agent": "the first son of Adam", "object": "every soul killed unjustly", "action": "bears a share of its blood", "quoted": "kana awwal man sanna al-qatl"}
  - {"id": "h-7305.1-bankrupt", "ref": "Jāmiʿ 60:7305.1", "unit": "hadith-60-q29-burdens-of-those-misled", "agent": "the bankrupt", "action": "comes with prayer, fasting and alms but has reviled, slandered, taken property, shed blood and struck", "outcome": "his good deeds paid out, victims' sins thrown on him, cast into the fire", "time": "Day of Resurrection", "quoted": "al-muflis min ummati"}
  - {"id": "h-7305.2-mountains", "ref": "Jāmiʿ 60:7305.2", "unit": "hadith-60-q29-burdens-of-those-misled", "agent": "God", "action": "has the wronged paid from a man's good deeds then loads their sins on him", "object": "good deeds like mountains", "quoted": "wa-'izzati la yajuzuni al-yawm zulm"}
  - {"id": "h-7306.1-uhud", "ref": "Jāmiʿ 60:7306.1", "unit": "hadith-60-q29-decree-and-prayer", "agent": "Ibn al-Daylami", "action": "consults Ubayy, Ibn Masud, Hudhayfa and Zayd b. Thabit on the decree", "object": "gold like Uhud spent", "outcome": "not accepted without belief in the decree", "number": 4, "quoted": "law anfaqta mithla uhud dhahaban"}
  - {"id": "h-7308.2-hebrew", "ref": "Jāmiʿ 60:7308.2", "unit": "hadith-60-q29-people-of-the-book", "agent": "the People of the Book", "action": "read the Torah in Hebrew and explain it in Arabic", "recipient": "the Muslims", "outcome": "neither believe nor deny them", "quoted": "yaqra'una al-tawrat bi-l-'ibraniyya wa-yufassirunaha bi-l-'arabiyya"}
  - {"id": "h-7309.1-bier", "ref": "Jāmiʿ 60:7309.1", "unit": "hadith-60-q29-people-of-the-book", "agent": "a Jew", "action": "asks whether a passing bier speaks", "recipient": "the prophet", "outcome": "prophet: God knows; Jew: it speaks", "quoted": "hal tatakallamu hadhihi al-janaza"}
  - {"id": "h-7309.2-water", "ref": "Jāmiʿ 60:7309.2", "unit": "hadith-60-q29-book-and-signs", "agent": "God", "object": "a book", "action": "sent down", "outcome": "water does not wash it away; recited asleep and awake", "quoted": "kitaban la yaghsiluhu al-ma' taqra'uhu na'iman wa-yaqzan"}
  - {"id": "h-7310.2-chamber", "ref": "Jāmiʿ 60:7310.2", "unit": "hadith-60-q29-book-and-signs", "place": "paradise", "object": "a chamber seen through from inside and out", "recipient": "one who feeds, speaks gently, fasts in succession, prays while people sleep", "number": 4, "quoted": "ghurfa yura zahiruha min batiniha"}
  - {"id": "h-7311.1-wager", "ref": "Jāmiʿ 60:7311.1", "unit": "hadith-60-q30-romans-and-persians-wager", "agent": "Abu Bakr", "action": "fixes a term with the Meccans on Rome defeating Persia", "number": 5, "outcome": "term passes; prophet - why not under ten?", "quoted": "fa-ju'ila ajal khams sinin; wa-l-bid' ma duna al-'ashr"}
