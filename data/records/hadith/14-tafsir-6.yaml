  - {"id": "h-7334.2-nadr", "ref": "Jāmiʿ 60:7334.2", "unit": "hadith-60-q33-men-true-to-their-covenant", "agent": "Anas b. al-Nadr", "action": "finds the scent of paradise beyond Uhud", "place": "Uhud", "number": 80, "outcome": "found with eighty-odd wounds, mutilated, known only by his sister from his fingertips", "quoted": ["inni ajidu rihaha min duni uhud", "illa ukhtuhu bi-bananihi"]}
  - {"id": "h-7335.2-talha", "ref": "Jāmiʿ 60:7335.2", "unit": "hadith-60-q33-men-true-to-their-covenant", "agent": "a bedouin", "action": "asks three times who 'fulfilled his vow'", "number": 3, "outcome": "the prophet points to Talha entering in green", "quoted": "hadha mimman qada nahbahu"}
  - {"id": "h-7336.2-four", "ref": "Jāmiʿ 60:7336.2", "unit": "hadith-60-q33-confederates-routed", "object": "noon, afternoon, sunset and night prayers", "action": "missed then prayed each with its own iqama", "agent": "Bilal", "number": 4, "time": "day of the Trench, before the fear-prayer verse", "quoted": "hubisna yawm al-khandaq 'an al-zuhr wa-l-'asr wa-l-maghrib wa-l-'isha'"}
  - {"id": "h-7337.1-gabriel", "ref": "Jāmiʿ 60:7337.1", "unit": "hadith-60-q33-qurayza", "agent": "Gabriel", "action": "comes shaking dust from his head, says he has not laid down arms", "outcome": "points to Qurayza", "quoted": "wada'ta al-silah wa-llahi ma wada'tuhu"}
  - {"id": "h-7337.1-judgment", "ref": "Jāmiʿ 60:7337.1", "unit": "hadith-60-q33-qurayza", "agent": "Sa'd", "action": "judges Qurayza", "outcome": "fighters killed, women and children captive, property divided", "name": "Hibban b. al-Araqa", "quoted": "an tuqtala al-muqatila wa-an tusba al-nisa' wa-l-dhurriyya"}
  - {"id": "h-7338.1-aisha", "ref": "Jāmiʿ 60:7338.1", "unit": "hadith-60-q33-wives-given-the-choice", "agent": "the prophet", "action": "offers the choice", "recipient": "Aisha first", "outcome": "she chooses God, his messenger and the last abode without consulting parents", "quoted": "fa-fi ayyi hadha asta'miru abawayya"}
  - {"id": "h-7338.2-mat", "ref": "Jāmiʿ 60:7338.2", "unit": "hadith-60-q33-wives-given-the-choice", "agent": "Umar", "action": "asks leave three times through a black servant", "number": 3, "place": "the upper room (mashraba)", "outcome": "finds the prophet on a palm-rope mat marking his side, three hides in the house", "quoted": "qad aththara al-rimal bi-janbihi ... ghayr ahaba thalatha"}
  - {"id": "h-7338.2-month", "ref": "Jāmiʿ 60:7338.2", "unit": "hadith-60-q33-wives-given-the-choice", "agent": "the prophet", "action": "withdraws from his wives", "number": 29, "time": "having sworn a month", "outcome": "the month is twenty-nine nights", "quoted": "al-shahr tis' wa-'ishrun layla"}
  - {"id": "h-7340.1-jab", "ref": "Jāmiʿ 60:7340.1", "unit": "hadith-60-q33-wives-given-the-choice", "agent": ["Abu Bakr", "Umar"], "action": "jab the necks of their daughters", "recipient": ["Aisha", "Hafsa"], "outcome": "the wives swear never to ask what he lacks", "quoted": "yaja'u 'unuqaha"}
  - {"id": "h-7341.3-cloak", "ref": "Jāmiʿ 60:7341.3", "unit": "hadith-60-q33-people-of-the-house", "agent": "the prophet", "action": "takes Hasan, Husayn, Fatima and Ali under his cloak and recites 33:33", "instrument": "a patterned cloak of black hair (mirt murahhal)", "number": 4, "quoted": "wa-'alayhi mirt murahhal min sha'r aswad"}
  - {"id": "h-7342.1-umm-salama", "ref": "Jāmiʿ 60:7342.1", "unit": "hadith-60-q33-people-of-the-house", "agent": "Umm Salama", "action": "asks to be included under the cloak", "place": "Umm Salama's house", "outcome": "you are in your place, you are on good", "quoted": "anti 'ala makaniki wa-anti ila khayr"}
  - {"id": "h-7343.1-women", "ref": "Jāmiʿ 60:7343.1", "unit": "hadith-60-q33-women-named-in-the-verse", "agent": "Umm Salama", "action": "asks why women are not mentioned as men are", "outcome": "hears 33:35 from the pulpit at the palm-frond wall while combing her hair", "quoted": "fa-ja'altu sam'i 'inda al-jarid"}
  - {"id": "h-7345.1-julaybib", "ref": "Jāmiʿ 60:7345.1", "unit": "hadith-60-q33-julaybib", "agent": "Julaybib", "action": "found killed beside seven he killed", "number": 7, "outcome": "laid in grave on the prophet's forearms, unwashed", "quoted": ["qatala sab'a wa-qataluhu hadha minni wa-ana minhu", "ma lahu sarir illa sa'ida rasul allah"]}
  - {"id": "h-7344.3-girl", "ref": "Jāmiʿ 60:7344.3", "unit": "hadith-60-q33-julaybib", "agent": "an Ansari girl", "action": "overrules her mother's refusal of Julaybib", "outcome": "married; became the most generous widow in Medina", "quoted": "a-turidduna 'ala rasul allah amrahu"}
  - {"id": "h-7347.1-zaynab", "ref": "Jāmiʿ 60:7347.1", "unit": "hadith-60-q33-zayd-and-zaynab", "agent": "Zaynab", "action": "boasts to the other wives", "outcome": "God married her from above seven heavens", "number": 7, "quoted": "zawwajani allah ta'ala min fawqi sab' samawat"}
  - {"id": "h-7348.1-brick", "ref": "Jāmiʿ 60:7348.1", "unit": "hadith-60-q33-truth-and-the-seal", "agent": "a man", "action": "builds a fine house but for one brick at a corner", "outcome": "the prophet is the brick, the seal of the prophets", "object": "the missing brick (labina)", "quoted": "illa mawdi' labina min zawiya ... wa-ana al-labina"}
  - {"id": "h-7348.3-six", "ref": "Jāmiʿ 60:7348.3", "unit": "hadith-60-q33-truth-and-the-seal", "object": ["concise speech", "victory by terror", "spoils lawful", "earth a mosque and purifier", "sent to all creation", "prophets sealed by him"], "number": 6, "quoted": "fuddiltu 'ala al-anbiya' bi-sitt"}
  - {"id": "h-7348.4-jumdan", "ref": "Jāmiʿ 60:7348.4", "unit": "hadith-60-q33-remembrance-and-mercy", "agent": "the prophet", "place": "Mount Jumdan on the Mecca road", "action": "says the mufarridun have gone ahead", "name": "Jumdan", "quoted": "sabaqa al-mufarridun"}
  - {"id": "h-7349.2-mother", "ref": "Jāmiʿ 60:7349.2", "unit": "hadith-60-q33-remembrance-and-mercy", "agent": "a captive woman", "action": "presses a found child to her belly and suckles it", "outcome": "God more merciful to his servants than she to her child", "quoted": "allahu arham bi-'ibadihi min hadhihi bi-waladiha"}
  - {"id": "h-7350.1-torah", "ref": "Jāmiʿ 60:7350.1", "unit": "hadith-60-q33-described-in-the-torah", "agent": "Abdallah b. Amr", "action": "recites the prophet's description in the Torah", "name": "al-Mutawakkil", "quoted": ["sammaytuka al-mutawakkil", "wa-la sakhkhab fi l-aswaq", "a'yunan 'umyan wa-adhanan samman wa-quluban ghulfan"]}
  - {"id": "h-7351.1-jawniyya", "ref": "Jāmiʿ 60:7351.1", "unit": "hadith-60-q33-marriages-of-the-prophet", "agent": "al-Jawniyya", "action": "seeks refuge with God from the prophet", "place": "palm garden al-Shawt, house of Umayma bint al-Nu'man", "outcome": "sent to her family with two white linen garments", "number": 2, "quoted": ["wa-hal tahabu al-malika nafsaha li-l-suqa", "qad 'udhti bi-ma'adh"]}
  - {"id": "h-7352.1-quran", "ref": "Jāmiʿ 60:7352.1", "unit": "hadith-60-q33-marriages-of-the-prophet", "agent": "a poor man", "action": "married to a woman who offered herself to the prophet", "instrument": "suras he knows by heart", "object": "not even an iron ring; half a waist-wrap refused", "quoted": "amlaknakaha bima ma'aka min al-qur'an"}
  - {"id": "h-7353.1-hastens", "ref": "Jāmiʿ 60:7353.1", "unit": "hadith-60-q33-defer-whom-you-will", "agent": "Aisha", "action": "remarks on 33:51", "quoted": "ma ara rabbaka illa yusari'u fi hawaka"}
  - {"id": "h-7354.2-sawda", "ref": "Jāmiʿ 60:7354.2", "unit": "hadith-60-q33-hijab", "agent": "Umar", "action": "recognises Sawda going out for her needs", "time": "night", "outcome": "revelation; wives allowed to go out for needs", "instrument": "a meat-bone still in the prophet's hand", "quoted": "wa-inna al-'arq fi yadihi ma wada'ahu"}
  - {"id": "h-7355.3-three", "ref": "Jāmiʿ 60:7355.3", "unit": "hadith-60-q33-hijab", "agent": "Umar", "action": "agreed with his Lord", "object": ["station of Abraham", "the hijab", "the captives of Badr"], "number": 3, "quoted": "wafaqtu rabbi fi thalath"}
  - {"id": "h-7355.4-dough", "ref": "Jāmiʿ 60:7355.4", "unit": "hadith-60-q33-hijab", "agent": "Zayd", "action": "brings the prophet's proposal to Zaynab with his back turned", "outcome": "she goes to her prayer place until her Lord decides; Quran descends; prophet enters without leave", "quoted": "wa-hiya tukhammiru 'ajinaha"}
  - {"id": "h-7356.2-hays", "ref": "Jāmiʿ 60:7356.2", "unit": "hadith-60-q33-hijab", "agent": "Umm Sulaym", "action": "sends hays in a stone pot (tawr)", "number": [300, 10], "outcome": "all eat in circles of ten; uncertain whether more before or after", "quoted": "zuha' thalathi mi'a ... li-yatahallaq 'ashara 'ashara"}
  - {"id": "h-7357.1-finger", "ref": "Jāmiʿ 60:7357.1", "unit": "hadith-60-q33-hijab", "agent": "Umar", "action": "his finger touches Aisha's while eating hays", "outcome": "'were I obeyed no eye would see you'; hijab comes down", "quoted": "law uta'u fikunna ma ra'atkunna 'ayn"}
  - {"id": "h-7358.3-aflah", "ref": "Jāmiʿ 60:7358.3", "unit": "hadith-60-q33-invitations-and-milk-kin", "agent": "Aflah brother of Abu al-Qu'ays", "action": "asks to enter to Aisha after the hijab", "outcome": "admitted as milk uncle", "name": ["Aflah", "Abu al-Qu'ays"], "quoted": "i'dhani lahu fa-innahu 'ammuki taribat yaminuki"}
  - {"id": "h-7359.1-blessing", "ref": "Jāmiʿ 60:7359.1", "unit": "hadith-60-q33-blessing-on-the-prophet", "agent": "the prophet", "action": "teaches the form of blessing", "name": ["Muhammad", "Abraham"], "quoted": "kama sallayta 'ala al i'brahim innaka hamid majid"}
  - {"id": "h-7360.3-ten", "ref": "Jāmiʿ 60:7360.3", "unit": "hadith-60-q33-blessing-on-the-prophet", "agent": "Gabriel", "action": "tells the prophet the reward of one blessing", "number": 10, "outcome": "ten good deeds written, ten sins erased, ten degrees raised", "quoted": "kataba allah lahu biha 'ashr hasanat"}
  - {"id": "h-7361.2-moses", "ref": "Jāmiʿ 60:7361.2", "unit": "hadith-60-q33-backbiting-and-moses", "agent": "a man", "action": "calls the Hunayn division unjust", "number": 100, "name": ["al-Aqra' b. Habis", "Uyayna"], "outcome": "may God have mercy on Moses, he was harmed with more than this and was patient", "quoted": "yarhamu allah musa qad udhiya bi-akthar min hadha fa-sabar"}
  - {"id": "h-7361.3-stone", "ref": "Jāmiʿ 60:7361.3", "unit": "hadith-60-q33-backbiting-and-moses", "agent": "Moses", "action": "lays his clothes on a stone to bathe alone", "object": "stone", "outcome": "stone runs off; he chases naked, seen unblemished, beats the stone", "number": [6, 7], "quoted": ["thawbi ya hajar", "innahu la-nadabun bi-l-hajar sitta aw sab'a"]}
  - {"id": "h-7362.1-staff", "ref": "Jāmiʿ 60:7362.1", "unit": "hadith-60-q33-backbiting-and-moses", "agent": "Moses", "action": "beats the stone with his staff", "instrument": "staff ('asa)", "number": [3, 4, 5], "object": "stone", "outcome": "marks remain", "quoted": "wa-tafiqa bi-l-hajar darban bi-'asahu"}
  - {"id": "h-7369.1-saba", "ref": "Jāmiʿ 60:7369.1", "unit": "hadith-60-q34-saba-the-man", "object": "Saba'", "action": "identified as a man who begot ten", "number": [10, 6, 4], "place": ["Yemen", "Syria"], "name": ["Madhhij", "Kinda", "al-Azd", "al-Ash'ariyyun", "Anmar", "Himyar", "Lakhm", "Judham", "Amila", "Ghassan"], "quoted": "bal huwa rajul walada 'ashara"}
  - {"id": "h-7370.1-anmar", "ref": "Jāmiʿ 60:7370.1", "unit": "hadith-60-q34-saba-the-man", "object": "Anmar", "action": "identified", "name": ["Khath'am", "Bajila"], "quoted": "alladhina minhum khath'am wa-bajila"}
  - {"id": "h-7372.1-chain", "ref": "Jāmiʿ 60:7372.1", "unit": "hadith-60-q34-believer-and-decree-in-heaven", "agent": "the angels", "action": "beat their wings at God's decree", "instrument": "sound like a chain on smooth rock", "outcome": "eavesdroppers pass a word down to a sorcerer or soothsayer, who adds a hundred lies", "number": 100, "quoted": "ka-annahu silsila 'ala safwan"}
  - {"id": "h-7372.2-star", "ref": "Jāmiʿ 60:7372.2", "unit": "hadith-60-q34-believer-and-decree-in-heaven", "object": "a shooting star", "action": "said in the Jahiliyya to mark a great man's birth or death", "outcome": "the prophet denies it; stars hit jinn snatching heaven's news", "quoted": "la yurma biha li-mawt ahad wa-la li-hayatihi"}
  - {"id": "h-7374.1-scale", "ref": "Jāmiʿ 60:7374.1", "unit": "hadith-60-q34-spending-and-the-warner", "agent": "God", "action": "says 'spend and I will spend on you'", "object": ["hand full", "throne on the water", "the scale"], "quoted": "wa-kana 'arshuhu 'ala al-ma' wa-bi-yadihi al-mizan"}
  - {"id": "h-7374.2-angels", "ref": "Jāmiʿ 60:7374.2", "unit": "hadith-60-q34-spending-and-the-warner", "agent": "two angels", "action": "pray for the spender and against the withholder", "time": "every morning", "number": 2, "quoted": "a'ti munfiqan khalafan ... a'ti mumsikan talafan"}
  - {"id": "h-7374.4-warner", "ref": "Jāmiʿ 60:7374.4", "unit": "hadith-60-q34-spending-and-the-warner", "agent": "a lookout", "action": "waves his garment crying 'you are attacked'", "number": 3, "quoted": "fa-ahwa bi-thawbihi ayyuha al-nas utitum"}
  - {"id": "h-7375.1-idols", "ref": "Jāmiʿ 60:7375.1", "unit": "hadith-60-q34-spending-and-the-warner", "agent": "the prophet", "action": "jabs the idols with a stick reciting 17:81 and 34:49", "number": 360, "place": "round the House in Mecca", "quoted": "sittun wa-thalath mi'at nusub"}
  - {"id": "h-7377.1-gabriel", "ref": "Jāmiʿ 60:7377.1", "unit": "hadith-60-q35-wings-and-gifts", "agent": "the prophet", "action": "sees Gabriel", "number": 600, "object": "wings", "quoted": "lahu sittu mi'at janah"}
  - {"id": "h-7378.1-light", "ref": "Jāmiʿ 60:7378.1", "unit": "hadith-60-q35-light-and-good-word", "agent": "God", "action": "creates creation in darkness and casts his light on it", "outcome": "whom it struck is guided, whom it missed strays", "quoted": "khalaqa khalqahu fi zulma fa-alqa 'alayhim min nurihi"}
  - {"id": "h-7378.2-bees", "ref": "Jāmiʿ 60:7378.2", "object": ["glorification", "tahlil", "praise"], "action": "circle the throne", "instrument": "a hum like bees", "unit": "hadith-60-q35-light-and-good-word", "quoted": "lahunna dawiyy ka-dawiyy al-nahl"}
  - {"id": "h-7378.3-ten-angels", "ref": "Jāmiʿ 60:7378.3", "unit": "hadith-60-q35-light-and-good-word", "agent": "ten angels", "action": "race to write a man's new praise", "number": 10, "outcome": "God says write it as my servant said", "name": "Dhu al-'Izza", "quoted": "ibtadaraha 'asharat amlak"}
  - {"id": "h-7379.1-beetle", "ref": "Jāmiʿ 60:7379.1", "unit": "hadith-60-q35-dust-wombs-life-span", "object": "those who boast of dead fathers", "action": "compared to the dung beetle rolling dung with its nose", "instrument": "charcoal of hell", "quoted": "min al-ju'al alladhi yudahdihu al-khur' bi-anfihi"}
  - {"id": "h-7380.2-armpit", "ref": "Jāmiʿ 60:7380.2", "unit": "hadith-60-q35-paradise-ornament-and-silk", "agent": "Abu Hurayra", "action": "washes his arms to the armpits in ablution", "outcome": "the ornament reaches where ablution reaches", "name": "Banu Farrukh", "quoted": "tablughu al-hilya min al-mu'min haythu yablughu al-wudu'"}
  - {"id": "h-7381.1-cup", "ref": "Jāmiʿ 60:7381.1", "unit": "hadith-60-q35-paradise-ornament-and-silk", "agent": "Hudhayfa", "action": "throws a cup at a Magian who brought him water", "object": "vessel of gold or silver", "outcome": "silk and gold vessels are theirs here and ours hereafter", "quoted": "fa-innaha lahum fi l-dunya wa-lana fi l-akhira"}
  - {"id": "h-7382.1-charcoal", "ref": "Jāmiʿ 60:7382.1", "unit": "hadith-60-q35-fire-and-lifespans", "object": "sinners in the fire", "action": "die until charcoal, brought in batches and spread on paradise's rivers", "outcome": "sprout like a seed in flood silt", "quoted": ["hatta idha kanu fahman", "nabat al-habba takunu fi hamil al-sayl"]}
  - {"id": "h-7382.2-sixty", "ref": "Jāmiʿ 60:7382.2", "unit": "hadith-60-q35-fire-and-lifespans", "agent": "God", "action": "leaves no excuse", "number": 60, "object": "a man whose term is delayed", "quoted": "a'dhara allah ila imri' akhkhara ajalahu hatta ballaghahu sittin sana"}
  - {"id": "h-7384.2-salima", "ref": "Jāmiʿ 60:7384.2", "unit": "hadith-60-q36-traces-written", "agent": "Banu Salima", "action": "want to move near the mosque", "outcome": "told 'your homes; your traces are written'", "quoted": "diyarakum tuktab atharukum"}
  - {"id": "h-7384.3-mudar", "ref": "Jāmiʿ 60:7384.3", "unit": "hadith-60-q36-traces-written", "agent": "a people of Mudar", "action": "arrive barefoot, naked, wearing striped wool", "outcome": "alms heaped in two piles; the prophet's face shines like gilt", "number": 2, "quoted": "man sanna fi l-islam sunna hasana"}
  - {"id": "h-7385.2-sun", "ref": "Jāmiʿ 60:7385.2", "unit": "hadith-60-q36-sun-under-throne", "agent": "the sun", "action": "goes to its resting place under the throne and falls prostrate", "outcome": "one day told to rise from its setting place", "place": "under the throne", "quoted": "fa-takhirru sajida ... irtafi'i asbihi tali'a min maghribiki"}
  - {"id": "h-7386.2-thigh", "ref": "Jāmiʿ 60:7386.2", "unit": "hadith-60-q36-mouths-sealed", "agent": "the hypocrite's thigh, flesh and bones", "action": "speak his deeds", "outcome": "mouth sealed", "time": "Day of Resurrection", "quoted": "fa-yukhtamu 'ala fihi wa-yuqalu li-fakhidhihi ... intiqi"}
  - {"id": "h-7387.1-limbs", "ref": "Jāmiʿ 60:7387.1", "unit": "hadith-60-q36-mouths-sealed", "agent": "a servant", "action": "refuses any witness but from himself", "outcome": "limbs speak; he curses them", "quoted": "bu'dan lakunna wa-suhqan fa-'ankunna kuntu unadil"}
  - {"id": "h-7388.1-hunayn", "ref": "Jāmiʿ 60:7388.1", "unit": "hadith-60-q36-poetry", "agent": "the prophet", "action": "declaims a line", "place": "Hunayn", "instrument": "white mule", "name": "Abu Sufyan b. al-Harith holding its bridle", "quoted": "ana al-nabiyy la kadhib ana ibn 'abd al-muttalib"}
  - {"id": "h-7388.3-trench", "ref": "Jāmiʿ 60:7388.3", "unit": "hadith-60-q36-poetry", "agent": "the prophet", "action": "carries earth reciting Ibn Rawaha's rajaz", "place": "the Trench", "name": "Abdallah b. Rawaha", "quoted": "allahumma law la anta ma htadayna"}
  - {"id": "h-7389.1-bone", "ref": "Jāmiʿ 60:7389.1", "unit": "hadith-60-q36-who-revives-bones", "agent": "al-As b. Wa'il", "action": "crumbles a bone from al-Batha'", "outcome": "'God will make you die, revive you and put you in Jahannam'; the end of Ya Sin comes down", "quoted": "a-yuhyi allah hadha ba'da ma ara"}
  - {"id": "h-7389.2-spittle", "ref": "Jāmiʿ 60:7389.2", "unit": "hadith-60-q36-who-revives-bones", "agent": "the prophet", "action": "spits in his palm and lays his finger on it", "quoted": ["anna tu'jizuni wa-qad khalaqtuka min mithli hadhihi", "hatta idha balaghat al-taraqi"]}
  - {"id": "h-7390.1-ashes", "ref": "Jāmiʿ 60:7390.1", "unit": "hadith-60-q36-who-revives-bones", "agent": "a man of those before you", "action": "orders his family to scatter him in the sea on a hot day", "outcome": "God gathers him and forgives him for his fear", "quoted": "fa-dharruni fi l-bahr fi yawm sa'if"}
  - {"id": "h-7391.1-rows", "ref": "Jāmiʿ 60:7391.1", "unit": "hadith-60-q37-rows-and-stars", "agent": "angels", "action": "complete the front rows and close gaps", "place": "before their Lord", "quoted": "yutimmuna al-sufuf al-uwal wa-yataraṣṣuna"}
  - {"id": "h-7391.3-nine", "ref": "Jāmiʿ 60:7391.3", "unit": "hadith-60-q37-rows-and-stars", "agent": "the jinn", "action": "add nine to each word heard", "number": 9, "outcome": "barred after the prophet's call; Iblis' troops find him praying between two mountains in Mecca", "name": "Iblis", "quoted": "zadu fiha tis'an"}
  - {"id": "h-7392.2-zaqqum", "ref": "Jāmiʿ 60:7392.2", "unit": "hadith-60-q37-proud-and-zaqqum", "agent": "Ibn Abbas", "place": "by the Kaaba during circumambulation", "instrument": "a hooked staff (mihjan)", "object": "a drop of zaqqum", "outcome": "would embitter the life of earth's people", "quoted": "law anna qatra min al-zaqqum qutirat"}
  - {"id": "h-7393.1-sarah", "ref": "Jāmiʿ 60:7393.1", "unit": "hadith-60-q37-abraham-three-lies", "agent": "a tyrant king", "action": "reaches for Sarah", "number": 3, "outcome": "hand seized thrice; gives her Hagar", "name": ["Sarah", "Hajar"], "quoted": ["fa-qubidat yaduhu qabda shadida", "innama ataytani bi-shaytan"]}
  - {"id": "h-7393.1-lies", "ref": "Jāmiʿ 60:7393.1", "unit": "hadith-60-q37-abraham-three-lies", "agent": "Abraham", "action": "tells lies", "number": 3, "object": ["I am sick", "the biggest did it", "she is my sister"], "quoted": "fa-innaki ukhti fi l-islam"}
  - {"id": "h-7397.1-dream", "ref": "Jāmiʿ 60:7397.1", "unit": "hadith-60-q37-the-sacrifice", "agent": "Ubayd b. Umayr", "action": "says prophets' dreams are revelation", "object": "Q 37:102", "quoted": "ru'ya al-anbiya' wahy"}
  - {"id": "h-7398.1-shirt", "ref": "Jāmiʿ 60:7398.1", "unit": "hadith-60-q37-the-sacrifice", "agent": "Ishmael", "action": "asks his father to take off his white shirt to shroud him", "outcome": "a call from behind; a white horned wide-eyed ram", "name": ["Ishmael", "Gabriel"], "quoted": "kabsh abyad aqran a'yan"}
  - {"id": "h-7398.1-pebbles", "ref": "Jāmiʿ 60:7398.1", "unit": "hadith-60-q37-the-sacrifice", "agent": "Abraham", "action": "stones Satan", "number": 7, "place": ["al-Mas'a", "Jamrat al-Aqaba", "the middle pillar", "the far pillar", "Mina"], "instrument": "seven pebbles", "quoted": "fa-ramahu bi-sab' hasayat"}
  - {"id": "h-7398.2-horns", "ref": "Jāmiʿ 60:7398.2", "unit": "hadith-60-q37-the-sacrifice", "object": "the ram's two horns", "place": "inside the Kaaba", "action": "covered on the prophet's order", "outcome": "burned with the House", "name": "Uthman b. Talha", "number": 2, "quoted": "lam tazal qarna al-kabsh fi l-bayt hatta ihtaraqa al-bayt"}
  - {"id": "h-7399.1-moses", "ref": "Jāmiʿ 60:7399.1", "unit": "hadith-60-q37-jonah", "agent": "Moses", "action": "holds the throne at the second blast", "outcome": "unknown whether spared by his swoon at al-Tur or raised first", "name": "al-Tur", "quoted": "fa-idha musa akhidh bi-l-'arsh"}
  - {"id": "h-7401.2-khaybar", "ref": "Jāmiʿ 60:7401.2", "unit": "hadith-60-q37-glorifiers-and-khaybar", "agent": "the Jews of Khaybar", "action": "come out with spades and baskets", "time": "morning", "outcome": "Khaybar is ruined", "quoted": "muhammad wa-l-khamis ... kharibat khaybar"}
  - {"id": "h-7403.3-sad", "ref": "Jāmiʿ 60:7403.3", "unit": "hadith-60-q38-revelation-and-prostration", "agent": ["David", "the prophet"], "action": "prostrate at Sad", "outcome": "David in repentance, we in thanks", "quoted": "sajadaha dawud tawbatan wa-nasjuduha shukran"}
  - {"id": "h-7404.1-pulpit", "ref": "Jāmiʿ 60:7404.1", "unit": "hadith-60-q38-revelation-and-prostration", "agent": "the prophet", "action": "descends the pulpit to prostrate at Sad", "number": 2, "outcome": "second time only because the people were ready", "quoted": "innama hiya tawbat nabiyy"}
  - {"id": "h-7404.2-horse", "ref": "Jāmiʿ 60:7404.2", "unit": "hadith-60-q38-solomon", "agent": "Aisha", "object": "a toy horse with two cloth wings", "action": "cites Solomon's winged horses", "outcome": "the prophet laughs to his molars", "name": "Solomon", "place": "Aisha's alcove", "time": "return from Tabuk or Khaybar", "number": 2, "quoted": "a-ma sami'ta anna li-sulayman khaylan laha ajniha"}
  - {"id": "h-7405.1-three", "ref": "Jāmiʿ 60:7405.1", "unit": "hadith-60-q38-solomon", "agent": "Solomon", "action": "asks three things", "time": "on building Bayt al-Maqdis", "number": 3, "outcome": "judgment that hits the mark, a kingdom none after may have, forgiveness for whoever comes only to pray", "quoted": "ka-yawm waladat-hu ummuhu"}
