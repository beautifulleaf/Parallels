  - {"id": "h-7324.1-friday", "ref": "Jāmiʿ 60:7324.1", "unit": "hadith-60-q32-sajda-reading", "agent": "the prophet", "action": "recites al-Sajda and al-Mulk", "time": "Friday dawn prayer", "quoted": "alif lam mim tanzil al-sajda wa-tabaraka"}
