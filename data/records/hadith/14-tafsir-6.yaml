  - {"id": "h-7330.2-four", "ref": "Jāmiʿ 60:7330.2", "unit": "hadith-60-q33-adopted-sons-and-lineage", "object": ["boasting of lineage", "attacking lineage", "seeking rain from the stars", "wailing"], "number": 4, "action": "kept from the Jahiliyya", "quoted": "arba' fi ummati min amr al-jahiliyya"}
  - {"id": "h-7331.1-debt", "ref": "Jāmiʿ 60:7331.1", "unit": "hadith-60-q33-prophet-nearer-than-selves", "agent": "the prophet", "action": "declines to pray over a dead debtor, then after the conquests takes on believers' debts", "outcome": "property to heirs, debts to him", "quoted": "fa-'alayya qada'uhu"}
  - {"id": "h-7332.4-zubayr", "ref": "Jāmiʿ 60:7332.4", "unit": "hadith-60-q33-prophet-nearer-than-selves", "agent": "al-Zubayr", "action": "brothered with Ka'b b. Malik and would inherit from him", "place": "Uhud", "outcome": "33:6 returns inheritance to kin", "name": ["Kharija b. Zayd", "Ka'b b. Malik"], "quoted": "wa-wakhaytu ana ka'b ibn malik"}
  - {"id": "h-7333.3-winds", "ref": "Jāmiʿ 60:7333.3", "unit": "hadith-60-q33-trench", "object": ["east wind (saba)", "west wind (dabur)"], "action": "helped the prophet; destroyed Ad", "name": "Ad", "quoted": "nusirtu bi-l-saba wa-uhlikat 'ad bi-l-dabur"}
