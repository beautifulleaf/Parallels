  - {id: h-5238.2-counsel, ref: "Jāmiʿ 48:5238.2", unit: hadith-48-badr-captives-consultation, agent: [Abu Bakr, "'Umar"], action: counsel release and killing of the captives, outcome: Q 8:67 revealed, quoted: "kada an yusibana fi khilafika bala'"}
