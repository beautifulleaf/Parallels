  - {id: h-5229.1-spear, ref: "Jāmiʿ 48:5229.1", unit: hadith-48-badr-abu-dhat-al-karish, agent: al-Zubayr, action: spears an armoured enemy in the eye, name: Abu Dhat al-Karish, instrument: spear ('anaza), outcome: "the spear passes from the prophet to Abu Bakr, 'Umar, 'Uthman and 'Abd Allah b. al-Zubayr"}
  - {id: h-5230.1-rahman, ref: "Jāmiʿ 48:5230.1", unit: hadith-48-badr-umayya, agent: Umayya b. Khalaf, action: refuses the name al-Rahman in a letter, name: ["'Abd 'Amr", al-Rahman], quoted: "la a'rifu l-rahman"}
