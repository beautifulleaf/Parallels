  - {id: h-5221.1-red-camel, ref: "Jāmiʿ 48:5221.1", unit: hadith-48-badr-prayer-and-angels, agent: "'Utba b. Rabi'a", action: urges Quraysh to turn back, instrument: red camel, quoted: ["i'sibuha l-yawma bi-ra'si", "ya musaffira stihi"]}
