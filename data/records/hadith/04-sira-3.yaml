  - {id: h-5222.2-gabriel, ref: "Jāmiʿ 48:5222.2", unit: hadith-48-badr-prayer-and-angels, agent: Gabriel, action: holds his horse's head, instrument: war gear, quoted: "hadha jibrilu akhidhun bi-ra'si farasihi 'alayhi adatu l-harb"}
  - {id: h-5223.1-archangels, ref: "Jāmiʿ 48:5223.1", unit: hadith-48-badr-prayer-and-angels, agent: [Gabriel, Michael, Israfil], action: attend the battle with 'Ali and Abu Bakr, name: [Jibril, Mika'il, Israfil]}
  - {id: h-5223.2-turban, ref: "Jāmiʿ 48:5223.2", unit: hadith-48-badr-prayer-and-angels, agent: Gabriel, action: leads his horse by the reins, place: the booth ('arish), quoted: "mu'tajirun bi-'imamatihi ... 'ala thanayahu al-naq'"}
  - {id: h-5224.1-dust, ref: "Jāmiʿ 48:5224.1", unit: hadith-48-badr-thrown-pebbles, agent: the prophet, action: throws a handful of dust at the enemy, instrument: handful of dust, recipient: the polytheists, outcome: "dust in every eye, nostril and mouth; they flee", quoted: "khudh qabdatan mina l-turab"}
