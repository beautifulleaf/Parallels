# Observation records, hadith chunk 4 (al-Jāmiʿ al-Kāmil, book 48, pp. 5203-5322): Badr, the events
# between Badr and Uhud, Uhud, al-Raji', Bi'r Ma'una, al-Nadir, al-Muraysi' and the ifk.
records:
  - {id: h-5203.1-sea, ref: "Jāmiʿ 48:5203.1", unit: hadith-48-badr-consultation, agent: Sa'd b. 'Ubada, action: pledges to follow into the sea, recipient: the prophet, place: [the sea, Bark al-Ghimad], quoted: "law amartana an nukhidaha al-bahra la-akhadnaha"}
  - {id: h-5203.1-captive, ref: "Jāmiʿ 48:5203.1", unit: hadith-48-badr-consultation, agent: the companions, action: beat a captive water-carrier when he tells the truth, object: a black slave of Banu l-Hajjaj, outcome: the prophet ends his prayer and rebukes them, quoted: "la-tadribunahu idha sadaqakum wa-tatrukunahu idha kadhabakum"}
  - {id: h-5203.1-marks, ref: "Jāmiʿ 48:5203.1", unit: hadith-48-badr-consultation, agent: the prophet, action: marks each enemy's death-place with his hand, place: Badr, time: before the battle, outcome: none falls away from the spot, quoted: ["hadha masra'u fulan", "fa-ma mata ahaduhum 'an mawdi'i yadi rasuli llah"]}
  - {id: h-5204.1-moses, ref: "Jāmiʿ 48:5204.1", unit: hadith-48-badr-consultation, agent: the helpers, action: refuse to answer as Israel answered Moses, name: [Moses, Banu Isra'il], quoted: "fa-dhhab anta wa-rabbuka fa-qatila inna hahuna qa'idun"}
  - {id: h-5204.2-four-sides, ref: "Jāmiʿ 48:5204.2", unit: hadith-48-badr-consultation, agent: al-Miqdad b. al-Aswad, action: vows to fight on every side of the prophet, object: [right, left, before, behind], outcome: the prophet's face shines, quoted: "nuqatilu 'an yaminika wa-'an shimalika wa-bayna yadayka wa-khalfak"}
  - {id: h-5205.1-scout, ref: "Jāmiʿ 48:5205.1", unit: hadith-48-badr-scout-and-dates, agent: the prophet, action: sends a scout ('ayn) to watch the caravan, name: Busaysa, object: Abu Sufyan's caravan}
  - {id: h-5205.1-dates, ref: "Jāmiʿ 48:5205.1", unit: hadith-48-badr-scout-and-dates, agent: "'Umayr b. al-Humam", action: throws away his dates and fights until killed, instrument: dates from his quiver, quoted: ["jannatun 'arduha al-samawatu wa-l-ard", "bakhin bakhin", "innaha la-hayatun tawila"]}
  - {id: h-5206.1-bells, ref: "Jāmiʿ 48:5206.1", unit: hadith-48-badr-camel-bells, agent: the prophet, action: orders bells cut from the camels' necks, object: bells (ajras), time: day of Badr}
  - {id: h-5208.1-rain, ref: "Jāmiʿ 48:5208.1", unit: hadith-48-badr-booth-and-rain, agent: rain, action: falls in the night before battle, place: under trees and leather shields, quoted: "tashshun min matar"}
  - {id: h-5208.1-prayer, ref: "Jāmiʿ 48:5208.1", unit: hadith-48-badr-booth-and-rain, agent: the prophet, action: prays all night, quoted: "allahumma innaka in tuhlik hadhihi l-fi'a la tu'bad"}
  - {id: h-5208.2-talut, ref: "Jāmiʿ 48:5208.2", unit: hadith-48-badr-numbers, agent: the men of Badr, action: equal in number those who crossed the river with Talut, name: Talut, number: "310-odd", quoted: ["bid'ata 'ashara wa-thalatha mi'a", "ma jawaza ma'ahu al-nahra illa mu'min"]}
  - {id: h-5209.2-numbers, ref: "Jāmiʿ 48:5209.2", unit: hadith-48-badr-numbers, agent: the prophet, action: looks at the enemy, number: [1000, 319], quoted: "wa-hum alf wa-ashabuhu thalath mi'a wa-tis'ata 'ashar"}
  - {id: h-5209.3-prayer, ref: "Jāmiʿ 48:5209.3", unit: hadith-48-badr-numbers, agent: the prophet, action: "prays for his barefoot, naked, hungry army", number: 315, outcome: "each returns with one or two camels, clothed and fed", quoted: "innahum hufatun fa-hmilhum ... 'uratun fa-ksuhum ... jiya'un fa-ashbi'hum"}
  - {id: h-5209.4-talut, ref: "Jāmiʿ 48:5209.4", unit: hadith-48-badr-numbers, agent: the men of Badr, action: number as Talut's companions on the day of Jalut, name: [Talut, Jalut], number: 317}
  - {id: h-5212.1-camel, ref: "Jāmiʿ 48:5212.1", unit: hadith-48-badr-camels-and-horses, agent: the prophet, action: refuses to ride while his companions walk, number: 3, recipient: [Abu Lubaba, "'Ali"], quoted: "ma antuma bi-aqwa minni wa-la ana bi-aghna 'ani l-ajri minkuma"}
  - {id: h-5213.1-weeping, ref: "Jāmiʿ 48:5213.1", unit: hadith-48-badr-camels-and-horses, agent: the prophet, action: prays and weeps all night, place: under a tree, time: the night before Badr, quoted: "yusalli wa-yabki hatta asbah"}
  - {id: h-5213.2-horses, ref: "Jāmiʿ 48:5213.2", unit: hadith-48-badr-camels-and-horses, object: horses, number: 2, name: [al-Zubayr, al-Miqdad]}
  - {id: h-5214.2-umayr, ref: "Jāmiʿ 48:5214.2", unit: hadith-48-badr-too-young-and-kept-oath, agent: the prophet, action: judges a boy too young then allows him, recipient: "'Umayr b. Abi Waqqas", outcome: killed at Badr, quoted: "fa-stasgharahu ... thumma ajazah"}
  - {id: h-5214.3-oath, ref: "Jāmiʿ 48:5214.3", unit: hadith-48-badr-too-young-and-kept-oath, agent: Quraysh, action: take an oath not to fight from two Muslims, recipient: [Hudhayfa, Husayl al-Yaman], outcome: the prophet sends them back to keep it, quoted: "nafi lahum bi-'ahdihim wa-nasta'inu llaha 'alayhim"}
  - {id: h-5215.1-camels, ref: "Jāmiʿ 48:5215.1", unit: hadith-48-badr-enemy-count, agent: the prophet, action: reckons the enemy by camels slaughtered, number: [10, 1000], quoted: "al-qawmu alf kullu jazurin li-mi'a"}
  - {id: h-5216.1-zubayr, ref: "Jāmiʿ 48:5216.1", unit: hadith-48-badr-courage, agent: al-Zubayr, action: charges through the enemy ranks alone, place: al-Yarmuk, number: 3, outcome: two blows on his shoulder around a Badr wound, quoted: "kuntu udkhilu asabi'i fi tilka l-darabat al'abu"}
