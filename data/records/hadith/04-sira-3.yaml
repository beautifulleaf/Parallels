  - {id: h-5231.2-uqba, ref: "Jāmiʿ 48:5231.2", unit: hadith-48-badr-uqba-executed, agent: "'Ali", action: executes 'Uqba b. Abi Mu'ayt bound (sabran), time: before the ransoming, quoted: "man li-l-sibya ... al-nar"}
