  - {id: h-5217.2-duel, ref: "Jāmiʿ 48:5217.2", unit: hadith-48-badr-duel, agent: [Hamza, "'Ali", "'Ubayda b. al-Harith"], action: duel three Qurashi kinsmen, recipient: ["'Utba", Shayba, al-Walid b. 'Utba], quoted: "hadhani khasmani ikhtasamu fi rabbihim"}
