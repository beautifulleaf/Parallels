  - {id: h-5218.1-arrows, ref: "Jāmiʿ 48:5218.1", unit: hadith-48-badr-arrows-and-ranks, agent: the prophet, action: orders archers to shoot only at close range, instrument: arrows, quoted: "idha akthabukum fa-rmuhum wa-stabqu nablakum"}
  - {id: h-5219.1-booth, ref: "Jāmiʿ 48:5219.1", unit: hadith-48-badr-prayer-and-angels, agent: the prophet, action: adjures God in his tent, place: tent (qubba), instrument: coat of mail, outcome: goes out reciting Q 54:45, quoted: "anshuduka 'ahdaka wa-wa'dak"}
  - {id: h-5219.2-cloak, ref: "Jāmiʿ 48:5219.2", unit: hadith-48-badr-prayer-and-angels, agent: the prophet, action: stretches his hands facing the qibla crying to his Lord, outcome: his cloak falls; Abu Bakr replaces it and holds him from behind, quoted: "kafaka munashadatuka rabbak"}
  - {id: h-5219.2-hayzum, ref: "Jāmiʿ 48:5219.2", unit: hadith-48-badr-prayer-and-angels, agent: an unseen horseman, action: strikes an enemy with a whip, name: Hayzum, outcome: "nose slit, face split, mark turns green", quoted: ["aqdim hayzum", "dhalika min madadi l-sama'i l-thalitha"]}
