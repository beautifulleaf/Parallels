  - {id: h-5252.1-birds, ref: "Jāmiʿ 48:5252.1", unit: hadith-48-badr-virtue, agent: God, action: asks the martyrs what they desire, number: [18, 4], place: paradise, instrument: green birds, outcome: they ask to be returned and killed again, quoted: "turaddu arwahuna fi ajsadina fa-nuqtalu kama qutilna"}
  - {id: h-5253.1-poison, ref: "Jāmiʿ 48:5253.1", unit: hadith-48-umayr-wahb, agent: "'Umayr b. Wahb", action: comes to kill the prophet, instrument: polished poisoned sword, place: [the hijr, Medina], name: Safwan b. Umayya, outcome: "told of the secret pact, he converts", quoted: "fa-madha sharatta li-safwan fi l-hijr"}
  - {id: h-5253.1-greeting, ref: "Jāmiʿ 48:5253.1", unit: hadith-48-umayr-wahb, agent: the prophet, action: rejects the Jahiliyya greeting, quoted: ["an'im sabahan", "tahiyyatu ahli l-janna wa-hiya l-salam"]}
  - {id: h-5256.1-qaynuqa, ref: "Jāmiʿ 48:5256.1", unit: hadith-48-qaynuqa, agent: the prophet, action: summons the Jews to Islam, place: the market of Banu Qaynuqa', outcome: Q 3:12-13 revealed, quoted: "kanu aghmaran la ya'rifuna l-qital"}
  - {id: h-5258.1-mount, ref: "Jāmiʿ 48:5258.1", unit: hadith-48-dhu-amarr, agent: the prophet, action: prays voluntary prayer on his mount, place: campaign of Anmar, quoted: "mutawajjihan qibala l-mashriq"}
