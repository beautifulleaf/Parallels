  - {id: h-5248.2-herald, ref: "Jāmiʿ 48:5248.2", unit: hadith-48-badr-return, agent: Zayd b. Haritha, action: announces the slain of Quraysh, place: Medina, time: as earth is levelled over Ruqayya, name: ["'Utba", Shayba, Abu Jahl, Nubayh, Munabbih, Umayya]}
  - {id: h-5249.1-adba, ref: "Jāmiʿ 48:5249.1", unit: hadith-48-badr-return, agent: Zayd b. Haritha, action: brings the good news riding the prophet's camel, instrument: al-'Adba', outcome: "'Uthman given his share"}
  - {id: h-5250.1-bread, ref: "Jāmiʿ 48:5250.1", unit: hadith-48-badr-captives-bread, agent: the helpers, action: give their captive bread and eat dates themselves, recipient: Abu 'Aziz b. 'Umayr, quoted: "istawsu bi-l-asara khayran"}
  - {id: h-5251.2-haritha, ref: "Jāmiʿ 48:5251.2", unit: hadith-48-badr-virtue, agent: the prophet, action: tells a mother her slain son is in the Firdaws, recipient: Haritha's mother, quoted: "a-wa-jannatun wahidatun hiya innaha jinanun kathira"}
