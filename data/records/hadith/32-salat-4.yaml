  action: has the caller say 'prayer in the dwellings' in place of 'come to prayer'
  time: a muddy (radgh) day
  quoted: faʿala hādhā man huwa khayrun minhu wa-innahā ʿazma
  outcome: people stare; 'one better than him did it; it is binding (ʿazma)'
- id: h-1495.2-thaqif
  ref: Jāmiʿ 9:1495.2
  unit: hadith-9-rain-pray-in-dwellings
  agent: the prophet's caller
  action: adds 'pray in your dwellings' after the two ḥayya
  time: a rainy night on a journey
  quoted: ṣallū fī riḥālikum
- id: h-1496.1-sandals
  ref: Jāmiʿ 9:1496.1
  unit: hadith-9-rain-pray-in-dwellings
  agent: the prophet's caller
  action: calls 'pray in your dwellings'
  instrument: rain too light to wet the sandal soles
  place: al-Hudaybiya
  quoted: lam tabulla asāfila niʿālinā
- id: h-1494.2-itban
  ref: Jāmiʿ 9:1494.2
  unit: hadith-9-rain-pray-in-dwellings
