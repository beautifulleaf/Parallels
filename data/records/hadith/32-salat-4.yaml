  action: asks the prophet to pray in his house to take it as a prayer place
  place: his house, cut off when the valley floods
  number: 2
  quoted: sāla l-wādī lladhī baynī wa-baynahum
  outcome: the prophet with Abu Bakr prays two rak'as there
- id: h-1495.1-rahl
  ref: Jāmiʿ 9:1495.1
  unit: hadith-9-rain-pray-in-dwellings
  agent: the prophet
  action: lets whoever wishes pray in his tent
  time: rain on a journey
  quoted: li-yuṣalli man shāʾa minkum fī raḥlih
- id: h-1497.1-samura
  ref: Jāmiʿ 9:1497.1
  unit: hadith-9-rain-pray-in-dwellings
  agent: the prophet
  action: calls 'prayer in the dwellings'
  instrument: rain (al-samāʾ)
  quoted: al-ṣalātu fī l-riḥāl
- id: h-1499.1-khutt
  ref: Jāmiʿ 9:1499.1
  unit: hadith-9-itban-house-prayer-place
  agent: a blind man of the Ansar
  action: asks the prophet to mark out a mosque in his house
  quoted: taʿāla fa-khuṭṭa lī masjidan fī dārī
  outcome: he comes and does it
- id: h-1499.3-supper
  ref: Jāmiʿ 9:1499.3
  unit: hadith-9-supper-and-relief-before-prayer
  action: begins with supper
  time: when supper is set and the prayer is called
  quoted: fa-bdaʾū bi-l-ʿashāʾ
  outcome: does not hurry until finished
- id: h-1499.3-imam
  ref: Jāmiʿ 9:1499.3
  unit: hadith-9-supper-and-relief-before-prayer
  agent: Ibn Umar
  action: keeps eating
  time: while hearing the imam recite
  quoted: wa-innahu la-yasmaʿu qirāʾata l-imām
- id: h-1500.2-akhbathan
