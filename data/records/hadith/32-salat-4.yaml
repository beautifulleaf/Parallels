# Observation records, hadith chunk 32 (al-Jāmiʿ al-Kāmil book 9, kitāb al-ṣalāt, pp. 1463-1582): rows, congregation,
# voluntary prayers, forgetfulness and the forbidden times.
records:
- id: h-1463.1-rows
  ref: Jāmiʿ 9:1463.1
  unit: hadith-9-rows-straightening
  agent: Anas b. Malik
  action: finds fault with the people of Medina
  object: rows not straightened
  quoted: mā ankartu shayʾan illā annakum lā tuqīmūna l-ṣufūf
- id: h-1463.2-behind
  ref: Jāmiʿ 9:1463.2
  unit: hadith-9-rows-straightening
  agent: the prophet
  action: orders the rows straight, saying it three times
  number: 3
  quoted: innī la-arākum min khalfī kamā arākum min bayna yadayya
- id: h-1463.3-hadhaf
  ref: Jāmiʿ 9:1463.3
  unit: hadith-9-rows-straightening
  agent: Satan
  action: enters through the gaps of the row
  instrument: in the form of small black sheep
  place: gaps in the prayer row
  quoted: ka-annahā l-ḥadhaf
- id: h-1463.4-front
  ref: Jāmiʿ 9:1463.4
  unit: hadith-9-rows-straightening
  action: complete the rows in order
  object: front row first
  quoted: fa-mā kāna min naqṣ fa-l-yakun fī l-ṣaff al-muʾakhkhar
  outcome: any gap left in the last row
- id: h-1464.2-faces
  ref: Jāmiʿ 9:1464.2
  unit: hadith-9-rows-straightening
  agent: God
  action: sets faces at variance
  recipient: those who do not straighten the rows
  quoted: la-yukhālifanna llāhu bayna wujūhikum
- id: h-1464.3-ahlam
  ref: Jāmiʿ 9:1464.3
  unit: hadith-9-rows-straightening
  agent: the prophet
  action: orders who stands nearest him
  object: those of understanding (ulū l-aḥlām wa-l-nuhā)
  number: 3
  quoted: li-yalinī minkum ulū l-aḥlām wa-l-nuhā
- id: h-1464.3-today
  ref: Jāmiʿ 9:1464.3
  unit: hadith-9-rows-straightening
  agent: Abu Masʿud
  action: comments on his own generation
  quoted: fa-antum al-yawma ashaddu khtilāfan
  outcome: '''you today differ more'''
- id: h-1465.1-tails
  ref: Jāmiʿ 9:1465.1
  unit: hadith-9-rows-straightening
  agent: the prophet
  action: rebukes raised hands in prayer
  instrument: likened to tails of restive horses
  quoted: ka-annahā adhnābu khaylin shumus
- id: h-1465.1-angels
  ref: Jāmiʿ 9:1465.1
  unit: hadith-9-rows-straightening
  agent: the angels
  action: stand in rows before their Lord
  quoted: yutimmūna l-ṣufūfa l-uwal wa-yatarāṣṣūna fī l-ṣaff
  outcome: complete the first rows and press close
- id: h-1465.1-izin
  ref: Jāmiʿ 9:1465.1
  unit: hadith-9-rows-straightening
  agent: the prophet
  action: rebukes the companions sitting in separate circles
  quoted: mā lī arākum ʿizīn
- id: h-1465.2-joins
  ref: Jāmiʿ 9:1465.2
  unit: hadith-9-rows-straightening
  action: joins or cuts a row
  quoted: man waṣala ṣaffan waṣalahu llāh wa-man qaṭaʿa ṣaffan qaṭaʿahu llāh
  outcome: God joins or cuts him
- id: h-1466.1-bless
  ref: Jāmiʿ 9:1466.1
  unit: hadith-9-rows-straightening
  agent: God and his angels
  action: bless (yuṣallūna ʿalā)
  recipient: those who join the rows
  quoted: yuṣallūna ʿalā lladhīna yaṣilūna l-ṣufūf
- id: h-1464.1-husn
  ref: Jāmiʿ 9:1464.1
  unit: hadith-9-rows-straightening
  object: straightening the row
  outcome: part of the excellence of prayer
  quoted: fa-inna iqāmata l-ṣaffi min ḥusni l-ṣalāh
- id: h-1467.1-tamam
  ref: Jāmiʿ 9:1467.1
  unit: hadith-9-rows-straightening
  object: straightening the row
  outcome: part of the completeness of prayer
  quoted: inna min tamāmi l-ṣalāti iqāmata l-ṣaff
- id: h-1467.2-bilal
  ref: Jāmiʿ 9:1467.2
  unit: hadith-9-rows-straightening
  agent: the prophet
  action: levels the worshippers' shoulders
  object: shoulders (manākib)
  quoted: yusawwī manākibanā fī l-ṣalāh
- id: h-1467.3-pillars
  ref: Jāmiʿ 9:1467.3
  unit: hadith-9-pillars-and-lone-man-behind-row
  agent: Anas
  action: avoids standing in a row between pillars
  place: between the pillars (al-sawārī)
  time: Friday
  quoted: kunnā nattaqī hādhā
- id: h-1468.1-repeat
  ref: Jāmiʿ 9:1468.1
  unit: hadith-9-pillars-and-lone-man-behind-row
  agent: a man
  action: prays alone behind the row
  quoted: an yuʿīda l-ṣalāh
  outcome: ordered to repeat the prayer
- id: h-1470.1-noprayer
  ref: Jāmiʿ 9:1470.1
  unit: hadith-9-pillars-and-lone-man-behind-row
  agent: the prophet
  action: stands over the man after finishing
  recipient: a man praying alone behind the row
  quoted: istaqbil ṣalātaka wa-lā ṣalāta lilladhī khalfa l-ṣaff
- id: h-1470.2-zeal
  ref: Jāmiʿ 9:1470.2
  unit: hadith-9-pillars-and-lone-man-behind-row
  agent: Abu Bakra
  action: bows before reaching the row
  quoted: zādaka llāhu ḥirṣan wa-lā taʿud
  outcome: prophet prays for his zeal and forbids repeating
- id: h-1472.1-wall
  ref: Jāmiʿ 9:1472.1
  unit: hadith-9-night-prayer-over-low-wall
  agent: people
  action: pray following the prophet
  place: outside his room with a low wall
  time: two or three nights
  number: 2 or 3
  quoted: wa-jidāru l-ḥujrati qaṣīr
- id: h-1472.1-feared
  ref: Jāmiʿ 9:1472.1
  unit: hadith-9-night-prayer-over-low-wall
  agent: the prophet
  action: stops coming out to lead the night prayer
  quoted: khashītu an tuktaba ʿalaykum ṣalātu l-layl
  outcome: fear it be made obligatory
- id: h-1472.2-shahida
  ref: Jāmiʿ 9:1472.2
  unit: hadith-9-umm-waraqa
  agent: Umm Waraqa
  action: asks to join the raid to nurse the sick
  place: Badr
  quoted: qirrī fī baytiki fa-inna llāha yarzuquki l-shahāda
  outcome: told to stay home; named al-shahīda
- id: h-1472.2-muezzin
  ref: Jāmiʿ 9:1472.2
  unit: hadith-9-umm-waraqa
  agent: the prophet
  action: gives her a muezzin and orders her to lead her household
  recipient: Umm Waraqa
  quoted: wa-amarahā an taʾumma ahla dārihā
- id: h-1472.2-old
  ref: Jāmiʿ 9:1472.2
  unit: hadith-9-umm-waraqa
  agent: ʿAbd al-Rahman
  action: saw her muezzin
  quoted: raʾaytu muʾadhdhinahā shaykhan kabīran
  outcome: a very old man
- id: h-1472.2-smother
  ref: Jāmiʿ 9:1472.2
  unit: hadith-9-umm-waraqa
  agent: her slave boy and slave girl (made mudabbar)
  action: smother her by night
  instrument: her velvet cloth (qaṭīfa)
  quoted: fa-kānā awwala maṣlūbin bi-l-madīna
  outcome: crucified on Umar's order, first crucified in Medina
- id: h-1473.1-izar
  ref: Jāmiʿ 9:1473.1
  unit: hadith-9-women-raise-heads-after-men
  agent: men
  action: pray with waist-wrappers knotted at the neck
  instrument: izār
  quoted: ʿāqidī uzurihim ʿalā aʿnāqihim ka-hayʾati l-ṣibyān
- id: h-1474.1-heads
  ref: Jāmiʿ 9:1474.1
  unit: hadith-9-women-raise-heads-after-men
  agent: women who believe in God and the last day
  action: must not raise their heads
  time: until the men raise theirs
  quoted: fa-lā tarfaʿ raʾsahā ḥattā yarfaʿa l-rijālu ruʾūsahum
- id: h-1475.1-27
  ref: Jāmiʿ 9:1475.1
  unit: hadith-9-congregation-degrees
  agent: Ibn Umar's report
  action: ranks congregational over lone prayer
  number: 27
  quoted: bi-sabʿin wa-ʿishrīna daraja
- id: h-1475.2-25
  ref: Jāmiʿ 9:1475.2
  unit: hadith-9-congregation-degrees
  agent: Abu Hurayra's report
  action: ranks congregational over lone prayer
  number: 25
  quoted: bi-khamsin wa-ʿishrīna juzʾan
- id: h-1475.3-steps
  ref: Jāmiʿ 9:1475.3
  unit: hadith-9-congregation-degrees
  action: walks to the mosque for prayer
  quoted: lam yakhṭu khuṭwatan illā rufiʿat lahu bihā daraja
  outcome: each step a degree raised and a sin removed
- id: h-1475.3-angelsprayer
  ref: Jāmiʿ 9:1475.3
  unit: hadith-9-congregation-degrees
  agent: the angels
  action: pray for the worshipper while he stays in his place
  quoted: allāhumma ṣalli ʿalayhi allāhumma rḥamhu
- id: h-1477.1-crawl
  ref: Jāmiʿ 9:1477.1
  unit: hadith-9-congregation-degrees
  agent: the prophet
  action: asks after absent men by name
  time: after the dawn prayer
  quoted: la-ataytumūhā wa-law ḥabwan ʿalā l-rukab
- id: h-1477.1-more
  ref: Jāmiʿ 9:1477.1
  unit: hadith-9-congregation-degrees
  action: prays with one, then two men
  number:
  - 1
  - 2
  quoted: wa-mā kathura fa-huwa aḥabbu ilā llāh
  outcome: each purer; the more the dearer to God
- id: h-1476.1-said
  ref: Jāmiʿ 9:1476.1
  unit: hadith-9-congregation-degrees
  action: ranks congregational over lone prayer
  number: 25
  quoted: bi-khamsin wa-ʿishrīna daraja
- id: h-1477.1-angelsrow
  ref: Jāmiʿ 9:1477.1
  unit: hadith-9-congregation-degrees
  object: the first row
  outcome: like the row of the angels
  quoted: ʿalā mithli ṣaffi l-malāʾika
- id: h-1479.1-burn
  ref: Jāmiʿ 9:1479.1
  unit: hadith-9-burning-houses-and-duty-of-congregation
  agent: the prophet
  action: resolves (hamamtu) to burn houses
  recipient: men who stay away from congregation
  instrument: gathered firewood
  quoted: fa-uḥarriqa ʿalayhim buyūtahum
- id: h-1480.2-jumua
  ref: Jāmiʿ 9:1480.2
  unit: hadith-9-burning-houses-and-duty-of-congregation
  agent: the prophet
  action: resolves to burn houses
  recipient: men who stay away from Friday prayer
  quoted: yatakhallafūna ʿan al-jumuʿa
- id: h-1479.1-bone
  ref: Jāmiʿ 9:1479.1
  unit: hadith-9-burning-houses-and-duty-of-congregation
  action: would attend the night prayer
  instrument: for a fat bone or two mirmāt
  quoted: ʿaẓman samīnan aw mirmātayni ḥasanatayn
- id: h-1480.1-angry
  ref: Jāmiʿ 9:1480.1
  unit: hadith-9-burning-houses-and-duty-of-congregation
  agent: Abu l-Darda
  action: enters angry before Umm al-Darda
  quoted: mā aʿrifu min ummati muḥammadin shayʾan illā annahum yuṣallūna jamīʿan
- id: h-1480.3-carried
  ref: Jāmiʿ 9:1480.3
  unit: hadith-9-burning-houses-and-duty-of-congregation
  agent: Ibn Masʿud
  action: recalls a man brought supported between two men
  place: the row
  quoted: yuʾtā bihi yuhādā bayna l-rajulayni ḥattā yuqāma fī l-ṣaff
- id: h-1480.3-sunan
  ref: Jāmiʿ 9:1480.3
  unit: hadith-9-burning-houses-and-duty-of-congregation
  agent: Ibn Masʿud
  action: calls the five prayers in the mosque 'paths of guidance'
  quoted: wa-innahunna min sunani l-hudā
  outcome: praying at home like the laggard would abandon the prophet's sunna and lead astray
- id: h-1481.1-wolf
  ref: Jāmiʿ 9:1481.1
  unit: hadith-9-burning-houses-and-duty-of-congregation
  agent: the wolf
  action: eats the straggling sheep
  number: 3
  quoted: fa-innamā yaʾkulu l-dhiʾbu l-qāṣiya
- id: h-1481.2-answer
  ref: Jāmiʿ 9:1481.2
  unit: hadith-9-blind-man-and-the-call
  agent: the prophet
  action: withdraws the leave he had given
  recipient: a blind man without a guide
  quoted: hal tasmaʿu l-nidāʾ ... fa-ajib
- id: h-1481.3-ibnummmaktum
  ref: Jāmiʿ 9:1481.3
  unit: hadith-9-blind-man-and-the-call
  agent: Ibn Umm Maktum
  action: pleads blindness, a distant house and an unsuitable guide
  quoted: lā ajidu laka rukhṣa
  outcome: '''I find no leave for you'''
- id: h-1481.3-guide
  ref: Jāmiʿ 9:1481.3
  unit: hadith-9-blind-man-and-the-call
  agent: Ibn Umm Maktum
  action: describes his plight
  object:
  - blind
  - far house
  - unsuitable guide
  quoted: ḍarīru l-baṣar shāsiʿu l-dār
- id: h-1483.1-seven
  ref: Jāmiʿ 9:1483.1
  unit: hadith-9-children-and-prayer
  agent: parents
  action: order children to pray, then beat them for it, and separate their beds
  recipient: children
  number:
  - 7
  - 10
  quoted: murū awlādakum bi-l-ṣalāti wa-hum abnāʾu sabʿi sinīn wa-ḍribūhum ʿalayhā wa-hum abnāʾu ʿashr
- id: h-1484.2-trembling
  ref: Jāmiʿ 9:1484.2
  unit: hadith-9-praying-twice
  agent: two men
  action: sat apart without praying, having prayed in their tents
  place: Masjid al-Khayf
  time: dawn prayer of the prophet's pilgrimage
  quoted: turʿadu farāʾiṣuhumā
  outcome: brought trembling; told to pray again as voluntary
- id: h-1485.1-mihjan
  ref: Jāmiʿ 9:1485.1
  unit: hadith-9-praying-twice
  agent: Mihjan
  action: stays sitting in the assembly while the prophet prays
  quoted: a-lasta bi-rajulin muslim
  outcome: '''are you not a Muslim man?''; pray with the people even if you have prayed'
- id: h-1485.2-twice
  ref: Jāmiʿ 9:1485.2
  unit: hadith-9-praying-twice
  agent: Ibn Umar
  action: declines to pray again
  place: al-Balāṭ
  quoted: lā tuṣallū ṣalātan fī yawmin marratayn
- id: h-1486.1-asbagha
  ref: Jāmiʿ 9:1486.1
  unit: hadith-9-praying-twice
  action: completes the ablution, walks to the prescribed prayer and prays it with the people
  outcome: God forgives his sins
  quoted: ghafara llāhu lahu dhunūbah
- id: h-1486.2-tajir
  ref: Jāmiʿ 9:1486.2
  unit: hadith-9-second-congregation-charity
  agent: the prophet
  action: asks who will pray with the latecomer
  recipient: a man who came after the prayer
  name: Abu Bakr
  quoted: ayyukum yattajiru ʿalā hādhā; man yataṣaddaqu ʿalā hādhā
  outcome: Abu Bakr prays with him
- id: h-1488.1-anas
  ref: Jāmiʿ 9:1488.1
  unit: hadith-9-second-congregation-charity
  agent: the prophet
  action: asks who will trade with the latecomer and pray with him
  quoted: man yattajiru ʿalā hādhā fa-l-yuṣalli maʿah
- id: h-1489.1-hypocrites
  ref: Jāmiʿ 9:1489.1
  unit: hadith-9-isha-fajr-congregation
  agent: hypocrites
  action: find heaviest
  object:
  - the dawn prayer
  - the night prayer
  quoted: wa-law ḥabwan
- id: h-1489.1-torches
  ref: Jāmiʿ 9:1489.1
  unit: hadith-9-isha-fajr-congregation
  agent: the prophet
  action: resolves to burn
  recipient: those who do not come out to prayer
  instrument: flaming brands (shuʿal min nār)
  quoted: ākhudhu shuʿalan min nār
- id: h-1490.1-halfnight
  ref: Jāmiʿ 9:1490.1
  unit: hadith-9-isha-fajr-congregation
  agent: Uthman
  action: tells his nephew the merit of night and dawn prayer in congregation
  time: after the sunset prayer, sitting alone in the mosque
  quoted: fa-ka-annamā qāma niṣfa l-layl
- id: h-1490.2-dhimma
  ref: Jāmiʿ 9:1490.2
  unit: hadith-9-isha-fajr-congregation
  agent: God
  action: takes the dawn worshipper under protection
  quoted: fa-huwa fī dhimmati llāh
  outcome: whoever violates it is thrown on his face in hell
- id: h-1490.3-khafar
  ref: Jāmiʿ 9:1490.3
  unit: hadith-9-isha-fajr-congregation
  agent: whoever
  action: must not violate God's protection
  recipient: the one who prayed the morning prayer
  quoted: fa-lā tukhfirū llāha fī dhimmatih
- id: h-1492.1-ascend
  ref: Jāmiʿ 9:1492.1
  unit: hadith-9-dawn-and-afternoon-prayers
  agent: the angels who spent the night
  action: ascend and are asked how they left God's servants
  recipient: God, who knows best
  time: at the afternoon and dawn prayers
  quoted: taraknāhum wa-hum yuṣallūna wa-ataynāhum wa-hum yuṣallūn
- id: h-1492.2-moon
  ref: Jāmiʿ 9:1492.2
  unit: hadith-9-dawn-and-afternoon-prayers
  agent: believers
  action: will see their Lord
  instrument: as they see the full moon
  quoted: lā tuḍāmmūna fī ruʾyatih
  outcome: so do not miss the prayers before sunrise and sunset
- id: h-1492.3-bardayn
  ref: Jāmiʿ 9:1492.3
  unit: hadith-9-dawn-and-afternoon-prayers
  action: prays the two cool prayers (al-bardayn)
  quoted: man ṣallā l-bardayni dakhala l-janna
  outcome: enters paradise
- id: h-1493.1-ears
  ref: Jāmiʿ 9:1493.1
  unit: hadith-9-dawn-and-afternoon-prayers
  agent: a man of Basra
  action: confirms he heard the same
  quoted: samiʿathu udhunāya wa-waʿāhu qalbī
- id: h-1493.2-asrayn
  ref: Jāmiʿ 9:1493.2
  unit: hadith-9-dawn-and-afternoon-prayers
  agent: Fadala
  action: asks for a single comprehensive command
  quoted: ḥāfiẓ ʿalā l-ʿaṣrayn
  outcome: told to keep the two ʿaṣrs
- id: h-1493.3-rihal
  ref: Jāmiʿ 9:1493.3
  unit: hadith-9-rain-pray-in-dwellings
  agent: Ibn Umar
  action: calls the prayer and adds 'pray in the dwellings'
  time: a cold windy night
  quoted: alā ṣallū fī l-riḥāl
- id: h-1494.1-azma
  ref: Jāmiʿ 9:1494.1
  unit: hadith-9-rain-pray-in-dwellings
