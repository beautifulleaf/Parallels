# Observation records, hadith chunk 33 (al-Jāmiʿ al-Kāmil book 9, kitāb al-ṣalāt, pp. 1583-1702): the prayer screen,
# what one prays in, what is forbidden and allowed in prayer, and the night prayer.
records:
- id: h-1584.1-mount
  ref: Jāmiʿ 9:1584.1
  unit: hadith-9-sutra-mount-spear-saddle
  agent: the prophet
  action: sets his riding camel crosswise and prays toward it
  object: riding camel (rāḥila)
  outcome: when the mounts are restless he prays toward the saddle's back-post
  quoted: yuʿarriḍu rāḥilatahu fa-yuṣallī ilayhā; yuṣallī ilā ākhiratihi
- id: h-1584.2-spear
