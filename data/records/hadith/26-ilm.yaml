  - {id: h-809.1-absent, ref: "Jāmiʿ 3:809.1", unit: hadith-3-conveying-nadara, agent: the prophet, time: day of sacrifice, action: preaches, quoted: "li-yuballigh al-shahid al-gha'ib"}
  - {id: h-809.4-noon, ref: "Jāmiʿ 3:809.4", unit: hadith-3-conveying-nadara, agent: Zayd b. Thabit, action: is summoned by Marwan, time: midday, quoted: "naddara llahu mra'an sami'a minna hadithan fa-hafizahu"}
  - {id: h-810.1-khayf, ref: "Jāmiʿ 3:810.1", unit: hadith-3-conveying-nadara, place: mosque of al-Khayf, agent: the prophet, action: preaches, object: [sincerity of deed for God, counsel to rulers, keeping to the community], number: 3, quoted: "thalathun la yughillu 'alayhinna qalbu mri'in muslim"}
  - {id: h-812.2-turns, ref: "Jāmiʿ 3:812.2", unit: hadith-3-umar-and-neighbour-take-turns, agent: [Umar, an Ansari neighbour], action: take turns going down to the prophet, place: Banu Umayya b. Zayd in the 'Awali of Medina, outcome: neighbour knocks hard; Hafsa weeping; prophet has not divorced, quoted: "a-tallaqta nisa'ak? qala la. fa-qultu allahu akbar"}
  - {id: h-813.1-thrice, ref: "Jāmiʿ 3:813.1", unit: hadith-3-repeating-thrice, agent: the prophet, action: repeats a word and greets, number: 3, quoted: "idha takallama bi-kalima a'adaha thalathan"}
  - {id: h-813.2-sard, ref: "Jāmiʿ 3:813.2", unit: hadith-3-repeating-thrice, agent: Aisha, action: objects to Abu Hurayra's rapid narration beside her room, time: while she prays her supererogatory prayer, quoted: "lam yakun yasrudu l-hadith ka-sardikum"}
  - {id: h-813.4-women, ref: "Jāmiʿ 3:813.4", unit: hadith-3-womens-day, agent: a woman, action: asks a day for the women, recipient: the prophet, outcome: three children a screen from the fire; and two, number: [3, 2], quoted: ["dhahaba l-rijal bi-hadithik", "wa-thnayn wa-thnayn wa-thnayn"]}
  - {id: h-814.1-erase, ref: "Jāmiʿ 3:814.1", unit: hadith-3-writing-forbidden, agent: the prophet, action: forbids writing other than the Quran, outcome: written hadith to be erased, quoted: "man kataba 'anni ghayr al-qur'an fa-l-yamhuh"}
