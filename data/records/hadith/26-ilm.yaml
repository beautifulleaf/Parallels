# Observation records for hadith chunk 26 (al-Jāmiʿ al-Kāmil book 3, kitāb al-ʿilm, pp. 785-881).
records:
  # ---- targhīb series
  - {id: h-785.1-spirit, ref: "Jāmiʿ 3:785.1", unit: hadith-3-jews-ask-about-the-spirit, agent: a group of Jews, action: ask about the spirit, recipient: the prophet, place: ruins (kharib) of Medina, instrument: palm stalk he leans on, outcome: silent under revelation then recites Q 17:85, name: Abu l-Qasim, quoted: "ya aba l-qasim ma l-ruh? fa-sakat"}
  - {id: h-786.1-anger, ref: "Jāmiʿ 3:786.1", unit: hadith-3-most-knowing-of-god, agent: companions, action: excuse themselves from hard deeds, recipient: the prophet, outcome: he grows angry, quoted: "inna atqakum wa-a'lamakum billah ana"}
  - {id: h-786.2-envy, ref: "Jāmiʿ 3:786.2", unit: hadith-3-envy-only-in-two, object: [wealth spent in the right, wisdom judged by and taught], number: 2, quoted: "la hasad illa fi thnatayn"}
  - {id: h-786.3-night, ref: "Jāmiʿ 3:786.3", unit: hadith-3-envy-only-in-two, object: [the Quran recited, wealth spent], time: hours of night and day, number: 2, quoted: "ana' al-layl wa-ana' al-nahar"}
  - {id: h-786.4-neighbour, ref: "Jāmiʿ 3:786.4", unit: hadith-3-envy-only-in-two, agent: a neighbour, action: hears the reciter and wishes the same, quoted: "laytani utitu mithla ma utiya fulan fa-'amiltu mithla ma ya'mal"}
  - {id: h-787.1-path, ref: "Jāmiʿ 3:787.1", unit: hadith-3-path-of-knowledge-angels-wings, agent: God, action: makes easy a path to paradise, recipient: one who walks a path seeking knowledge, quoted: "sahhala llahu lahu bihi tariqan ila l-janna"}
  - {id: h-787.2-wings, ref: "Jāmiʿ 3:787.2", unit: hadith-3-path-of-knowledge-angels-wings, agent: the angels, action: lower their wings, recipient: one who leaves his house seeking knowledge, name: Safwan b. 'Assal, quoted: ["unbitu l-'ilm", "wada'at lahu l-mala'ika ajnihataha ridan bima yasna'"]}
  - {id: h-788.1-banners, ref: "Jāmiʿ 3:788.1", unit: hadith-3-two-banners-at-the-door, object: two banners, agent: [an angel, a devil], place: the door of every man going out, number: 2, outcome: he walks under one banner until he returns home, quoted: "illa bi-babihi rayatan rayatun bi-yad malak wa-rayatun bi-yad shaytan"}
  - {id: h-788.2-damascus, ref: "Jāmiʿ 3:788.2", unit: hadith-3-heirs-of-the-prophets-damascus, agent: a man from Medina, action: travels for one hadith, recipient: Abu l-Darda', place: mosque of Damascus, quoted: "ama ji'ta li-haja ama ji'ta li-tijara ama ji'ta illa li-hadha l-hadith"}
  - {id: h-788.2-heirs, ref: "Jāmiʿ 3:788.2", unit: hadith-3-heirs-of-the-prophets-damascus, agent: the prophets, action: leave knowledge as inheritance, object: [no dinar, no dirham], recipient: the scholars, quoted: "inna l-'ulama' warathat al-anbiya'"}
  - {id: h-788.2-moon, ref: "Jāmiʿ 3:788.2", unit: hadith-3-heirs-of-the-prophets-damascus, object: [the knower, the worshipper], instrument: the moon on the night of the full moon over the other stars, quoted: "ka-fadl al-qamar laylat al-badr 'ala sa'ir al-kawakib"}
  - {id: h-788.2-fish, ref: "Jāmiʿ 3:788.2", unit: hadith-3-heirs-of-the-prophets-damascus, agent: [those in the heavens, those on earth, the fish in the water], action: ask forgiveness, recipient: the knower, quoted: "wa-l-hitan fi l-ma'"}
  - {id: h-790.2-hajj, ref: "Jāmiʿ 3:790.2", unit: hadith-3-going-out-for-knowledge-as-jihad-and-hajj, agent: one who goes to the mosque only to learn or teach, time: morning, outcome: reward of a pilgrim with a complete hajj, quoted: "ka-ajri hajjin tamman hijjatuhu"}
  - {id: h-790.3-mosque, ref: "Jāmiʿ 3:790.3", unit: hadith-3-going-out-for-knowledge-as-jihad-and-hajj, place: the prophet's mosque, agent: one who enters to learn or teach good, outcome: like the fighter in God's way, quoted: "ka-l-mujahid fi sabil allah ... ka-manzilat alladhi yara l-shay' yu'jibuhu wa-huwa li-ghayrih"}
  - {id: h-792.1-gathered, ref: "Jāmiʿ 3:792.1", unit: hadith-3-gathered-naked-and-retaliation, agent: God, action: gathers and calls them, recipient: mankind, quoted: ["'uratan ghurlan buhman", "ana l-malik ana l-dayyan"]}
  - {id: h-792.1-slap, ref: "Jāmiʿ 3:792.1", unit: hadith-3-gathered-naked-and-retaliation, agent: God, action: settles every claim before entry to paradise or fire, object: a slap, instrument: good and bad deeds, quoted: ["hatta uqissahu minhu hatta l-latma", "bi-l-hasanat wa-l-sayyi'at"]}
  - {id: h-794.1-khidr, ref: "Jāmiʿ 3:794.1", unit: hadith-3-moses-seeks-khidr-fish-sign, agent: Moses, action: says no one knows more than he, recipient: a man among the Israelites, outcome: God names his servant Khidr, name: [Musa, Khadir, Ubayy b. Ka'b, al-Hurr b. Qays], quoted: "bala 'abduna khadir"}
  - {id: h-794.1-fish, ref: "Jāmiʿ 3:794.1", unit: hadith-3-moses-seeks-khidr-fish-sign, object: the fish, action: made a sign of the meeting place, agent: God, place: the rock, outcome: Moses' young man forgets the fish; they retrace their tracks, quoted: ["idha faqadta l-hut fa-rji'", "fa-rtadda 'ala atharihima qasasan"]}
  - {id: h-795.2-bequest, ref: "Jāmiʿ 3:795.2", unit: hadith-3-welcome-young-seekers-make-easy, agent: Abu Sa'id al-Khudri, action: welcomes young students, quoted: "marhaban bi-wasiyyat rasul allah"}
  - {id: h-796.1-yemen, ref: "Jāmiʿ 3:796.1", unit: hadith-3-welcome-young-seekers-make-easy, agent: the prophet, action: sends two governors, recipient: [Abu Musa, Mu'adh], place: Yemen, number: 2, quoted: "yassira wa-la tu'assira bashshira wa-la tunaffira wa-tatawa'a wa-la takhtalifa"}
  - {id: h-797.1-brothers, ref: "Jāmiʿ 3:797.1", unit: hadith-3-brother-who-attends-and-teacher-of-good, agent: two brothers, action: "one attends the prophet, one works a trade", outcome: the worker is told he may be provided for through his brother, number: 2, quoted: "la'allaka turzaqu bih"}
  - {id: h-797.2-fish, ref: "Jāmiʿ 3:797.2", unit: hadith-3-brother-who-attends-and-teacher-of-good, agent: everything, action: asks forgiveness, recipient: the teacher of good, object: the fish in the seas, quoted: "hatta l-hitan fi l-bihar"}
  - {id: h-797.3-muadh, ref: "Jāmiʿ 3:797.3", unit: hadith-3-muadh-sent-to-people-of-book, agent: Mu'adh, recipient: a people of the Book, place: Yemen, object: [worship of God, five prayers in a day and night, alms returned to their poor], number: 5, quoted: "wa-tawaqqa kara'ima amwalihim"}
  - {id: h-798.2-mudar, ref: "Jāmiʿ 3:798.2", unit: hadith-3-good-and-bad-practice, agent: people of Mudar, action: come barefoot and naked in striped woollen wraps with swords, recipient: the prophet, time: early in the day, outcome: "alms heaped in two piles; his face shines", quoted: ["mujtabi l-nimar", "fa-tama''ara wajhu rasul allah", "ka-annahu mudhhaba"]}
  - {id: h-798.2-sunna, ref: "Jāmiʿ 3:798.2", unit: hadith-3-good-and-bad-practice, agent: one who institutes a practice, outcome: reward or burden of all who act on it after him, quoted: "man sanna fi l-islam sunna hasana"}
  - {id: h-799.1-mount, ref: "Jāmiʿ 3:799.1", unit: hadith-3-good-and-bad-practice, agent: a man whose mount has perished, action: asks to be carried, outcome: another points him to a giver; the pointer earns the doer's reward, quoted: ["innahu ubdi'a bi", "man dalla 'ala khayr fa-lahu mithlu ajri fa'ilih"]}
  - {id: h-799.3-murabit, ref: "Jāmiʿ 3:799.3", unit: hadith-3-good-and-bad-practice, agent: one who dies on frontier guard, outcome: reward runs until he is raised, quoted: "man mata murabitan ... jara lahu ajr al-murabit hatta yub'ath"}
  - {id: h-801.1-camels, ref: "Jāmiʿ 3:801.1", unit: hadith-3-better-than-red-camels, object: red camels, quoted: "khayrun laka min an yakuna laka humru l-na'am"}
  - {id: h-801.2-qasim, ref: "Jāmiʿ 3:801.2", unit: hadith-3-understanding-of-religion, agent: Mu'awiya, place: the pulpit, quoted: ["innama ana qasim wa-llahu yu'ti", "allahumma la mani'a lima a'tayta"]}
  - {id: h-803.1-ant, ref: "Jāmiʿ 3:803.1", unit: hadith-3-scholar-over-worshipper, agent: [God, his angels, people of heavens and earths, the ant in its hole, the fish], action: bless, recipient: the teacher of good, quoted: "hatta l-namla fi juhriha wa-hatta l-hut la-yusalluna 'ala mu'allim al-nas al-khayr"}
  - {id: h-805.1-hour, ref: "Jāmiʿ 3:805.1", unit: hadith-3-bedouin-asks-the-hour-mid-talk, agent: a bedouin, action: asks when the Hour is, recipient: the prophet mid-talk, outcome: answered after the talk, quoted: "idha wussida l-amr ila ghayr ahlihi fa-ntazir al-sa'a"}
