  - {id: h-806.2-three, ref: "Jāmiʿ 3:806.2", unit: hadith-3-three-men-at-the-circle, agent: three men, place: the prophet's circle in the mosque, number: 3, outcome: [God shelters the one who sat in a gap, is ashamed before the one who sat behind, turns from the one who left], quoted: "awa ila llah fa-awahu llah"}
  - {id: h-807.1-thursday, ref: "Jāmiʿ 3:807.1", unit: hadith-3-spacing-admonition, agent: Ibn Mas'ud, action: reminds people, time: every Thursday, quoted: "yatakhawwaluna bi-l-maw'iza fi l-ayyam karahat al-sa'ama 'alayna"}
  - {id: h-808.1-majja, ref: "Jāmiʿ 3:808.1", unit: hadith-3-boy-of-five-remembers, agent: the prophet, action: spurts a mouthful of water into a boy's face, instrument: a bucket, recipient: Mahmud b. al-Rabi', number: 5, time: at five years old, quoted: "'aqaltu mina l-nabi majjatan majjaha fi wajhi"}
  - {id: h-808.2-rain, ref: "Jāmiʿ 3:808.2", unit: hadith-3-rain-on-three-grounds, object: rain (ghayth), recipient: [good soil, hard ground (ajadib), bare flats (qi'an)], number: 3, outcome: [herbage grows, water held for people, nothing held or grown], quoted: "innama hiya qi'an la tumsiku ma'an wa-la tunbitu kala'"}
