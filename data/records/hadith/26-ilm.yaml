  - {id: h-820.1-vessels, ref: "Jāmiʿ 3:820.1", unit: hadith-3-abu-hurayra-memory, agent: Abu Hurayra, object: two vessels (wi'a'an) of knowledge, number: 2, outcome: one spread; the other would cut his gullet, quoted: "qutti'a hadha l-bul'um"}
  - {id: h-820.3-muadh, ref: "Jāmiʿ 3:820.3", unit: hadith-3-muadh-lest-they-rely, agent: the prophet, recipient: Mu'adh riding behind him, number: 3, outcome: Mu'adh tells it at his death for fear of sin, quoted: ["idhan yattakilu", "fa-akhbara biha mu'adh 'inda mawtihi ta'aththuman"]}
  - {id: h-821.1-ghusl, ref: "Jāmiʿ 3:821.1", unit: hadith-3-shyness-in-knowledge, agent: Umm Sulaym, action: asks whether a woman bathes after a wet dream, outcome: if she sees the fluid; Umm Salama covers her face, quoted: "idha ra'at al-ma' ... fa-fima yushbihuha waladuha"}
  - {id: h-821.3-hebrew, ref: "Jāmiʿ 3:821.3", unit: hadith-3-neither-believe-nor-deny, agent: People of the Book, action: read the Torah in Hebrew and explain it in Arabic, recipient: the Muslims, outcome: neither believe nor deny them; say Q 2:136, quoted: "yaqra'una l-tawrat bi-l-'ibraniyya wa-yufassirunaha bi-l-'arabiyya"}
  - {id: h-821.4-bier, ref: "Jāmiʿ 3:821.4", unit: hadith-3-neither-believe-nor-deny, agent: a Jew, action: says a passing bier speaks, recipient: the prophet, name: Abu Namla al-Ansari, quoted: "hal tatakallamu hadhihi l-janaza? ... allahu a'lam"}
  - {id: h-822.2-dawn, ref: "Jāmiʿ 3:822.2", unit: hadith-3-narrate-from-israelites, agent: the prophet, action: tells of the Children of Israel, time: through the night until morning, quoted: "ma yaqumu illa ila 'uzm al-salat"}
  - {id: h-822.5-script, ref: "Jāmiʿ 3:822.5", unit: hadith-3-zayd-learns-jewish-script, agent: Zayd b. Thabit, action: learns the writing of the Jews, time: half a month, outcome: writes and reads the prophet's letters, quoted: ["inni wa-llahi ma amanu yahud 'ala kitabi", "fa-lam yamurra illa nisfu shahr hatta hadhaqtuh"]}
  - {id: h-823.2-refuge, ref: "Jāmiʿ 3:823.2", unit: hadith-3-useful-knowledge-prayers, agent: the prophet, action: seeks refuge, object: [incapacity, laziness, cowardice, miserliness, decrepitude, punishment of the grave, knowledge that does not benefit, heart not humble, soul not sated, prayer not answered], quoted: "allahumma ati nafsi taqwaha wa-zakkiha anta khayru man zakkaha"}
  - {id: h-825.1-three, ref: "Jāmiʿ 3:825.1", unit: hadith-3-what-continues-after-death, object: [ongoing charity, knowledge benefited from, righteous child who prays for him], number: 3, quoted: "inqata'a 'amaluhu illa min thalath"}
  - {id: h-825.2-seven, ref: "Jāmiʿ 3:825.2", unit: hadith-3-what-continues-after-death, object: [knowledge taught and spread, righteous child, Quran copy bequeathed, mosque built, house for the wayfarer, river made to flow, charity in health], number: 7, quoted: "aw nahran ajrahu"}
  - {id: h-827.1-sakina, ref: "Jāmiʿ 3:827.1", unit: hadith-3-studying-together, agent: a people, action: recite and study God's Book together, place: a house of God, outcome: [sakina descends, mercy covers, angels surround, God mentions them], quoted: "nazalat 'alayhim al-sakina wa-ghashiyathum al-rahma wa-haffathum al-mala'ika"}
