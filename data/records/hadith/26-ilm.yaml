  - {id: h-815.2-mecca, ref: "Jāmiʿ 3:815.2", unit: hadith-3-writing-allowed, agent: the prophet, action: preaches from his mount after Khuza'a kill a man of Layth, time: year of the conquest, place: Mecca, object: [no thorn cut, no tree felled, lost property only for one who announces it], outcome: a Yemeni asks for it in writing; idhkhir excepted, name: [Khuza'a, Banu Layth, Abu Fulan], quoted: ["hallat li sa'atan min nahar", "uktubu li-abi fulan", "illa l-idhkhir"]}
