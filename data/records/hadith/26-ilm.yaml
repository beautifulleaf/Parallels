  - {id: h-816.3-sheet, ref: "Jāmiʿ 3:816.3", unit: hadith-3-writing-allowed, agent: Ali, object: the sheet (sahifa), quoted: "al-'aql wa-fakak al-asir wa-la yuqtalu muslimun bi-kafir"}
  - {id: h-816.4-mouth, ref: "Jāmiʿ 3:816.4", unit: hadith-3-writing-allowed, agent: the prophet, action: points to his mouth, recipient: Abd Allah b. Amr, outcome: told to write, quoted: "uktub fa-wa-lladhi nafsi bi-yadihi ma yakhruju minhu illa haqq"}
  - {id: h-819.1-century, ref: "Jāmiʿ 3:819.1", unit: hadith-3-none-alive-after-a-century, agent: the prophet, time: after the night prayer late in his life, number: 100, quoted: "'ala ra's mi'at sana minha la yabqa mimman huwa 'ala zahr al-ard ahad"}
