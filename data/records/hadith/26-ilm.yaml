  - {id: h-828.1-kab, ref: "Jāmiʿ 3:828.1", unit: hadith-3-who-may-preach, agent: ʿAwf b. Malik, action: rebukes a crowd round Ka'b telling stories, place: mosque of Hims, name: Ka'b, quoted: "la yaqussu illa amirun aw ma'murun aw mukhtal"}
  - {id: h-829.1-fitna, ref: "Jāmiʿ 3:829.1", unit: hadith-3-who-may-preach, agent: Ibn Umar, action: dates storytelling, time: the time of the fitna, name: [Abu Bakr, Umar, Uthman], quoted: "innama kana l-qasas fi zaman al-fitna"}
  - {id: h-829.2-skin, ref: "Jāmiʿ 3:829.2", unit: hadith-3-hadith-felt-in-skin, object: a hadith heard, instrument: [hearts, hair, skin], outcome: [nearest to me, farthest from me], quoted: "wa-talinu lahu ash'arukum wa-absharukum"}
  - {id: h-829.3-book, ref: "Jāmiʿ 3:829.3", unit: hadith-3-israelites-wrote-a-book, agent: the Children of Israel, action: write a book and follow it, object: the Torah, outcome: leave the Torah, quoted: "kataba kitaban fa-ttaba'uhu wa-tarakuu l-tawrat"}
  - {id: h-830.2-joseph, ref: "Jāmiʿ 3:830.2", unit: hadith-3-people-are-mines, agent: the prophet, action: "answers 'who is noblest?'", outcome: [most God-fearing, Joseph, best of the Arabs], name: Yusuf, quoted: "fa-yusuf nabiyyu llah ibn nabiyyi llah ibn khalil allah"}
  - {id: h-831.1-tablets, ref: "Jāmiʿ 3:831.1", unit: hadith-3-report-not-like-seeing, agent: Moses, action: throws the tablets, object: the tablets, time: only when he sees the calf, outcome: they break, name: Musa, quoted: "laysa l-khabar ka-l-mu'ayana ... alqa l-alwah fa-nkasarat"}
  - {id: h-831.3-camels, ref: "Jāmiʿ 3:831.3", unit: hadith-3-companions-relay-and-abu-dharr, agent: al-Bara' b. 'Azib, action: hears some hadith from companions, outcome: busy herding camels, quoted: "wa-kanat tashghaluna ri'yat al-ibil"}
  - {id: h-831.4-abudharr, ref: "Jāmiʿ 3:831.4", unit: hadith-3-companions-relay-and-abu-dharr, agent: Abu Dharr, action: holds to a severe ruling, outcome: misses the later relaxation, quoted: "fa-yata'allaqu abu dharr bi-l-amr al-shadid"}
