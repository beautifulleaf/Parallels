records:
  - {id: h-5444.1-arrow, ref: "Jāmiʿ 48:5444.1", unit: hadith-48-raid-on-fazara, agent: Salama b. al-Akwa', action: shoots an arrow between fugitives and the mountain, object: women and children of Fazara, instrument: arrow, outcome: they stop and are driven to Abu Bakr, quoted: "fa-ramaytu bi-sahmin baynahum wa-bayna l-jabal"}
  - {id: h-5444.1-girl, ref: "Jāmiʿ 48:5444.1", unit: hadith-48-raid-on-fazara, agent: the prophet, action: asks twice for a captive girl, recipient: Salama, place: the market of Medina, number: 2, outcome: she is sent to Mecca to ransom Muslim prisoners, quoted: "ya salama hab li l-mar'a"}
  - {id: h-5445.1-watchword, ref: "Jāmiʿ 48:5445.1", unit: hadith-48-raid-on-fazara, agent: Abu Bakr's raiders, action: raid by night with a watchword, time: night, number: 7, quoted: "amit amit", outcome: Salama kills seven households}
  - {id: h-5445.2-usama, ref: "Jāmiʿ 48:5445.2", unit: hadith-48-killing-after-the-shahada, agent: Usama b. Zayd, action: kills a man after he says the shahada, instrument: spear, place: al-Huraqa, quoted: ["a-qataltahu ba'da ma qala la ilaha illa llah", "kana muta'awwidhan"], outcome: Usama wishes he had not yet become Muslim}
  - {id: h-5446.1-judgment, ref: "Jāmiʿ 48:5446.1", unit: hadith-48-killing-after-the-shahada, agent: the prophet, action: repeats a single question to the killer, recipient: the killer, quoted: "kayfa tasna'u bi-la ilaha illa llah idha ja'at yawm al-qiyama", outcome: refuses to add anything else}
  - {id: h-5447.1-verse, ref: "Jāmiʿ 48:5447.1", unit: hadith-48-obedience-and-the-fire, agent: God, action: reveals the verse on obeying those in authority, name: Abdallah b. Hudhafa al-Sahmi, quoted: "ati'u llaha wa-ati'u l-rasula wa-uli l-amri minkum"}
  - {id: h-5447.2-fire, ref: "Jāmiʿ 48:5447.2", unit: hadith-48-obedience-and-the-fire, agent: an angry Ansari commander, action: orders his men into a fire, object: fire of gathered wood, recipient: his troops, quoted: ["udkhuluha", "farrarna ila l-nabiyy min al-nar", "al-ta'a fi l-ma'ruf"], outcome: the fire dies down; had they entered they would never have come out}
  - {id: h-5447.3-jest, ref: "Jāmiʿ 48:5447.3", unit: hadith-48-obedience-and-the-fire, agent: Abdallah b. Hudhafa, action: bids his men leap into a fire in jest, name: Alqama b. Mujazziz, quoted: ["innama kuntu amzahu ma'akum", "man amarakum bi-ma'siyat allah fa-la tuti'uhu"]}
  - {id: h-5450.1-rags, ref: "Jāmiʿ 48:5450.1", unit: hadith-48-dhat-al-riqa, agent: six raiders, action: wrap torn feet in rags, number: [6, 1], object: one camel shared in turns, name: Dhat al-Riqa', quoted: "fa-summiyat ghazwata dhati l-riqa'"}
  - {id: h-5450.2-sword, ref: "Jāmiʿ 48:5450.2", unit: hadith-48-sword-under-the-tree, agent: a bedouin, action: draws the sleeping prophet's sword, instrument: sword hung on an acacia (samura), quoted: ["man yamna'uka minni", "allah"], outcome: he is not punished}
  - {id: h-5451.1-fear, ref: "Jāmiʿ 48:5451.1", unit: hadith-48-sword-under-the-tree, agent: the prophet, action: prays two rak'as with each of two groups, number: [4, 2], quoted: "fa-kanat li-rasul allah arba' raka'at wa-li-l-qawm rak'atan"}
  - {id: h-5451.2-fear, ref: "Jāmiʿ 48:5451.2", unit: hadith-48-forms-of-the-fear-prayer, agent: the imam, action: prays one rak'a with each group and waits for them to complete, place: Dhat al-Riqa', number: 1, quoted: ["thabata qa'iman", "thabata jalisan", "thumma sallama bihim"]}
  - {id: h-5451.3-rows, ref: "Jāmiʿ 48:5451.3", unit: hadith-48-forms-of-the-fear-prayer, agent: the prophet, action: arranges the fear prayer in two rows that change places, number: 2, quoted: "fa-saffahum khalfahu saffayn"}
  - {id: h-5452.1-najd, ref: "Jāmiʿ 48:5452.1", unit: hadith-48-forms-of-the-fear-prayer, agent: the prophet, action: prays one rak'a with each group facing the enemy, place: Najd, quoted: "fa-qama kull wahid minhum fa-raka'a li-nafsihi rak'a"}
  - {id: h-5453.1-screen, ref: "Jāmiʿ 48:5453.1", unit: hadith-48-umra-of-fulfilment, agent: the companions, action: screen the prophet during the umra rites, recipient: the prophet, object: [tawaf, prayer, sa'y between Safa and Marwa], quoted: "fa-kunna nasturuhu min ahl makka"}
  - {id: h-5453.2-terms, ref: "Jāmiʿ 48:5453.2", unit: hadith-48-umra-of-fulfilment, agent: the prophet, action: performs the deferred umra on treaty terms, place: al-Hudaybiya, time: the following year, number: 3, instrument: swords only, quoted: "wa-la yahmila silahan 'alayhim illa suyufan"}
  - {id: h-5453.3-rajab, ref: "Jāmiʿ 48:5453.3", unit: hadith-48-umra-of-fulfilment, agent: Aisha, action: denies an umra in Rajab, recipient: Ibn Umar, place: by Aisha's chamber in the mosque, quoted: "wa-ma 'tamara fi rajab qatt"}
  - {id: h-5454.1-raml, ref: "Jāmiʿ 48:5454.1", unit: hadith-48-umra-of-fulfilment, agent: the pilgrims, action: trot the first circuits and walk between the two corners, number: 3, recipient: Meccans sitting by the Hijr, quoted: "an yarmulu thalathata ashwat", outcome: the Meccans call them stronger than they thought}
  - {id: h-5454.2-umras, ref: "Jāmiʿ 48:5454.2", unit: hadith-48-umra-of-fulfilment, agent: the prophet, action: makes four umras, time: Dhu l-Qa'da, number: 4, place: [al-Hudaybiya, Mecca, al-Ji'rana], quoted: "arba' 'umar kulluhunna fi dhi l-qa'da"}
  - {id: h-5548.1-umras, ref: "Jāmiʿ 48:5548.1", unit: hadith-48-umra-of-fulfilment, agent: the prophet, action: makes four umras, time: Dhu l-Qa'da, number: 4, place: al-Ji'rana, quoted: "wa-'umra min ji'rana haythu qasama ghana'im hunayn"}
  - {id: h-5454.4-maymuna, ref: "Jāmiʿ 48:5454.4", unit: hadith-48-marriage-of-maymuna, agent: the prophet, action: marries Maymuna, place: Sarif, quoted: "wa-nahnu halalan bi-sarif"}
  - {id: h-5455.2-maymuna, ref: "Jāmiʿ 48:5455.2", unit: hadith-48-marriage-of-maymuna, agent: the prophet, action: marries Maymuna in ihram and consummates outside it, place: Sarif, quoted: "tazawwaja maymuna wa-huwa muhrim wa-bana biha wa-huwa halal", outcome: she dies at Sarif}
  - {id: h-5456.1-erase, ref: "Jāmiʿ 48:5456.1", unit: hadith-48-treaty-text-and-hamzas-daughter, agent: the prophet, action: writes the treaty title himself, object: the words 'messenger of God', recipient: Ali, quoted: ["imhu rasul allah", "la amhuka abadan", "wa-laysa yuhsinu yaktubu"], name: Muhammad b. Abdallah}
  - {id: h-5456.1-custody, ref: "Jāmiʿ 48:5456.1", unit: hadith-48-treaty-text-and-hamzas-daughter, agent: the prophet, action: awards custody of an orphan girl, object: Hamza's daughter, recipient: her maternal aunt (Ja'far's wife), number: 3, quoted: "al-khala bi-manzilat al-umm", name: [Ali, Ja'far, Zayd]}
  - {id: h-5460.1-commanders, ref: "Jāmiʿ 48:5460.1", unit: hadith-48-mutah-commanders-and-jafar, agent: the prophet, action: names three commanders in succession, place: Mu'ta, name: [Zayd b. Haritha, Ja'far, Abdallah b. Rawaha], number: 3, quoted: "in qutila zaydun fa-ja'far"}
  - {id: h-5462.1-wounds, ref: "Jāmiʿ 48:5462.1", unit: hadith-48-mutah-commanders-and-jafar, agent: Ibn Umar, action: counts the wounds on Ja'far's body, number: [50, 90], quoted: "laysa minha shay'un fi duburihi"}
  - {id: h-5462.3-wings, ref: "Jāmiʿ 48:5462.3", unit: hadith-48-mutah-commanders-and-jafar, agent: Ibn Umar, action: greets Ja'far's son, name: ibn dhi l-janahayn, quoted: "al-salamu 'alayka ya bna dhi l-janahayn"}
  - {id: h-5462.4-horse, ref: "Jāmiʿ 48:5462.4", unit: hadith-48-mutah-commanders-and-jafar, agent: Ja'far, action: hamstrings his own horse and fights, object: his sorrel mare, quoted: "iqtahama 'an farasin lahu shaqra' fa-'aqaraha", outcome: killed}
  - {id: h-5463.1-poem, ref: "Jāmiʿ 48:5463.1", unit: hadith-48-mutah-commanders-and-jafar, agent: Abdallah b. Rawaha, action: urges his soul in verse and throws away meat, object: a bone of meat, quoted: ["aqsamtu ya nafsu la-tanzilinnah", "ya nafsu illa tuqtali tamuti", "wa-anti fi l-dunya"], outcome: fights until killed}
  - {id: h-5464.1-mourning, ref: "Jāmiʿ 48:5464.1", unit: hadith-48-mutah-commanders-and-jafar, agent: Amra (Ibn Rawaha's sister), action: wails listing his praises, recipient: Abdallah b. Rawaha in a faint, quoted: ["wa-jabalah", "a-anta kadhalika"]}
  - {id: h-5461.1-hide, ref: "Jāmiʿ 48:5461.1", unit: hadith-48-mutah-spoils-of-the-roman, agent: a Yemeni auxiliary, action: hamstrings a Roman horseman's horse and kills him, instrument: camel-hide shield, object: gilded saddle and weapons, place: behind a rock, outcome: Khalid takes the spoils}
  - {id: h-5461.1-commanders, ref: "Jāmiʿ 48:5461.1", unit: hadith-48-mutah-spoils-of-the-roman, agent: the prophet, action: orders the spoils returned then forbids it, recipient: Khalid b. al-Walid, quoted: "hal antum tariku li umara'i lakum safwatu amrihim wa-'alayhim kadaruhu"}
  - {id: h-5464.2-news, ref: "Jāmiʿ 48:5464.2", unit: hadith-48-mutah-news-and-the-sword, agent: the prophet, action: announces the commanders' deaths before the news arrives, name: sayf min suyuf allah, quoted: "wa-'aynahu tadhrifan"}
  - {id: h-5464.4-jafar, ref: "Jāmiʿ 48:5464.4", unit: hadith-48-mutah-news-and-the-sword, agent: Ja'far, action: protests Zayd's command over him, recipient: the prophet, quoted: ["ma kuntu arhabu an tasta'mila 'alayya zaydan", "amdu fa-innaka la tadri ayyu dhalika khayr"]}
  - {id: h-5465.2-swords, ref: "Jāmiʿ 48:5465.2", unit: hadith-48-mutah-news-and-the-sword, agent: Khalid b. al-Walid, action: breaks swords in battle, number: 9, place: Mu'ta, quoted: "fa-ma baqiya fi yadi illa safiha yamaniyya"}
  - {id: h-5465.3-dust, ref: "Jāmiʿ 48:5465.3", unit: hadith-48-mutah-grief-and-wailing, agent: the prophet, action: orders dust thrown into wailers' mouths, recipient: the women of Ja'far, quoted: "fa-hthu fi afwahihinna min al-turab", outcome: Aisha rebukes the messenger}
  - {id: h-5467.1-wealth, ref: "Jāmiʿ 48:5467.1", unit: hadith-48-dhat-al-salasil, agent: the prophet, action: offers Amr command and wealth, recipient: Amr b. al-As, quoted: "ni'imma bi-l-mal al-salih li-l-rajul al-salih"}
  - {id: h-5468.2-fires, ref: "Jāmiʿ 48:5468.2", unit: hadith-48-dhat-al-salasil, agent: Amr b. al-As, action: forbids lighting fires and pursuit, place: Dhat al-Salasil, quoted: "la yuqidu ahadun minhum naran illa qadhaftuhu fiha", outcome: the prophet approves}
  - {id: h-5468.3-tayammum, ref: "Jāmiʿ 48:5468.3", unit: hadith-48-dhat-al-salasil, agent: Amr b. al-As, action: performs tayammum and leads the dawn prayer, time: a cold night, quoted: "wa-la taqtulu anfusakum", outcome: the prophet laughs and says nothing}
  - {id: h-5469.1-shares, ref: "Jāmiʿ 48:5469.1", unit: hadith-48-najd-raid-shares, agent: a raid to Najd, action: divides captured camels, number: [12, 11, 1], quoted: "wa-nuffilu ba'iran ba'iran"}
  - {id: h-5470.1-greeting, ref: "Jāmiʿ 48:5470.1", unit: hadith-48-idam-greeting-killed, agent: Muhallim b. Jaththama, action: kills a man who greeted them with peace, recipient: Amir al-Ashja'i, place: Batn Idam, object: [camel, goods, milk-skin], outcome: Q 4:94 revealed}
  - {id: h-5472.1-appeal, ref: "Jāmiʿ 48:5472.1", unit: hadith-48-khuzaas-appeal, agent: Amr b. Salim, action: recites an appeal poem, recipient: the prophet, place: al-Watir, quoted: ["allahumma inni nashidun muhammadan", "fa-qataluna rukka'an wa-sujjadan", "nusirta ya 'amra bna salim"]}
  - {id: h-5472.1-cloud, ref: "Jāmiʿ 48:5472.1", unit: hadith-48-khuzaas-appeal, agent: the prophet, action: reads a passing cloud as victory, object: a cloud ('anana), quoted: "inna hadhihi l-sahaba la-tastahillu bi-nasri bani ka'b"}
  - {id: h-5474.1-cup, ref: "Jāmiʿ 48:5474.1", unit: hadith-48-march-and-the-fast, agent: the prophet, action: drinks from a raised cup to break the fast, place: Kura' al-Ghamim, time: Ramadan, instrument: cup, quoted: ["ula'ika l-'usat", "ista'inu bi-l-nasl"]}
  - {id: h-5481.1-march, ref: "Jāmiʿ 48:5481.1", unit: hadith-48-march-and-the-fast, agent: the prophet, action: marches with ten thousand and breaks fast, place: al-Kadid, time: Ramadan, number: [10000, 13], quoted: "fa-sabbaha rasul allah makka li-thalath 'ashrata layla"}
  - {id: h-5478.1-letter, ref: "Jāmiʿ 48:5478.1", unit: hadith-48-secrecy-and-hatibs-letter, agent: [Ali, al-Zubayr, al-Miqdad], action: seize a hidden letter from a woman courier, place: Rawdat Khakh, object: Hatib's letter, quoted: ["la-tukhrijinna l-kitab aw la-nulqiyanna l-thiyab", "fa-akhrajathu min 'iqasiha"], number: 3}
  - {id: h-5478.1-badr, ref: "Jāmiʿ 48:5478.1", unit: hadith-48-secrecy-and-hatibs-letter, agent: the prophet, action: refuses Umar leave to kill Hatib, recipient: Umar, quoted: "i'malu ma shi'tum fa-qad ghafartu lakum", outcome: Q 60:1 revealed}
  - {id: h-5481.2-mule, ref: "Jāmiʿ 48:5481.2", unit: hadith-48-abu-sufyan-at-marr-al-zahran, agent: al-Abbas, action: rides out at night to find someone to warn Quraysh, instrument: the prophet's white mule, place: Marr al-Zahran, quoted: "wa-asabaha quraysh", outcome: meets Abu Sufyan and brings him in}
  - {id: h-5481.2-fires, ref: "Jāmiʿ 48:5481.2", unit: hadith-48-abu-sufyan-at-marr-al-zahran, agent: Abu Sufyan, action: sees the camp fires at night, quoted: "ma ra'aytu ka-l-layla niranan qatt", name: [Budayl b. Warqa', Hakim b. Hizam]}
  - {id: h-5481.2-defile, ref: "Jāmiʿ 48:5481.2", unit: hadith-48-abu-sufyan-at-marr-al-zahran, agent: al-Abbas, action: holds Abu Sufyan at the narrow of the valley to watch the army pass, place: khatm al-jabal, quoted: ["ma li wa-li-sulaym", "al-katiba al-khadra'", "la yura minhum illa l-hadaq", "innaha l-nubuwwa"]}
  - {id: h-5481.2-amnesty, ref: "Jāmiʿ 48:5481.2", unit: hadith-48-abu-sufyan-at-marr-al-zahran, agent: the prophet, action: grants amnesty by place, object: [Abu Sufyan's house, a closed door, the mosque], quoted: "man dakhala dara abi sufyan fa-huwa amin"}
  - {id: h-5481.2-hind, ref: "Jāmiʿ 48:5481.2", unit: hadith-48-abu-sufyan-at-marr-al-zahran, agent: Hind bint Utba, action: seizes her husband's moustache, recipient: Abu Sufyan, quoted: "uqtulu l-dasima l-ahmash"}
  - {id: h-5485.2-sad, ref: "Jāmiʿ 48:5485.2", unit: hadith-48-abu-sufyan-at-marr-al-zahran, agent: the prophet, action: corrects Sa'd's boast, recipient: Sa'd b. Ubada, object: the Ka'ba, quoted: ["al-yawmu yawmu l-malhama", "yawmun yu'azzimu llahu fihi l-ka'ba wa-yawmun tuksa fihi l-ka'ba"]}
  - {id: h-5486.1-idol, ref: "Jāmiʿ 48:5486.1", unit: hadith-48-ansar-at-the-conquest, agent: the prophet, action: strikes an idol in the eye during the circuit, instrument: the end of a bow (siyat al-qaws), place: beside the House, quoted: "ja'a l-haqqu wa-zahaqa l-batil"}
  - {id: h-5486.1-ansar, ref: "Jāmiʿ 48:5486.1", unit: hadith-48-ansar-at-the-conquest, agent: the prophet, action: answers the Ansar's fear that he will stay in Mecca, recipient: the Ansar, quoted: ["al-mahya mahyakum wa-l-mamat mamatukum", "fa-ma smi idhan"], outcome: they weep}
  - {id: h-5487.1-mow, ref: "Jāmiʿ 48:5487.1", unit: hadith-48-ansar-at-the-conquest, agent: the prophet, action: orders the Ansar to mow down Quraysh's rabble, place: al-Safa, quoted: "an tahsuduhum hasdan"}
  - {id: h-5489.1-drove, ref: "Jāmiʿ 48:5489.1", unit: hadith-48-abu-sufyan-ibn-al-harith, agent: the prophet, action: strikes the poet's chest, recipient: Abu Sufyan b. al-Harith, place: Niq al-Uqab, quoted: "anta taradtani kulla mutarrad"}
  - {id: h-5490.1-satire, ref: "Jāmiʿ 48:5490.1", unit: hadith-48-hassan-satirizes-quraysh, agent: Hassan b. Thabit, action: satirizes Quraysh, name: [ruh al-qudus, Jibril], quoted: ["al-asad al-darib bi-dhanabih", "ka-ma tusallu l-sha'ra min al-'ajin", "inna ruha l-qudus la yazalu yu'ayyiduka"], number: 3}
  - {id: h-5491.2-aqil, ref: "Jāmiʿ 48:5491.2", unit: hadith-48-al-khayf-and-aqils-house, agent: the prophet, action: declares no inheritance across religions, name: [Aqil, Talib, Abu Talib], quoted: "la yarithu l-mu'minu l-kafir"}
  - {id: h-5492.2-khatal, ref: "Jāmiʿ 48:5492.2", unit: hadith-48-entry-into-mecca, agent: the prophet, action: orders a man clinging to the Ka'ba curtains killed, recipient: Ibn Khatal, instrument: helmet (mighfar), quoted: "uqtuluhu"}
  - {id: h-5492.3-turban, ref: "Jāmiʿ 48:5492.3", unit: hadith-48-entry-into-mecca, agent: the prophet, action: enters Mecca without ihram, object: black turban, quoted: "wa-'alayhi 'imama sawda' bi-ghayri ihram"}
  - {id: h-5493.1-tarji, ref: "Jāmiʿ 48:5493.1", unit: hadith-48-entry-into-mecca, agent: the prophet, action: recites Surat al-Fath with trilling, place: on his camel, number: 3, quoted: "a a a"}
  - {id: h-5493.3-qays, ref: "Jāmiʿ 48:5493.3", unit: hadith-48-entry-into-mecca, agent: the prophet, action: removes Qays b. Sa'd from the vanguard, recipient: Qays b. Sa'd, quoted: "makhafata an yuqdima 'ala shay'"}
  - {id: h-5494.2-dove, ref: "Jāmiʿ 48:5494.2", unit: hadith-48-circuit-and-the-key, agent: the prophet, action: breaks a wooden dove inside the Ka'ba, object: dove of sticks (hamama min 'idan), instrument: his hand, number: 7, name: Uthman b. Talha, quoted: "fa-kasaraha bi-yadihi thumma tarahaha"}
  - {id: h-5494.3-idols, ref: "Jāmiʿ 48:5494.3", unit: hadith-48-idols-and-images-of-the-house, agent: the prophet, action: jabs the idols round the Ka'ba, instrument: a stick ('ud), number: 360, quoted: "wa-qul ja'a l-haqqu wa-zahaqa l-batil"}
  - {id: h-5495.1-abraham, ref: "Jāmiʿ 48:5495.1", unit: hadith-48-idols-and-images-of-the-house, agent: the prophet, action: has the images removed before entering the House, object: images of Abraham and Ishmael holding divining arrows, quoted: "laqad 'alimu ma staqsama biha qatt", outcome: he says takbir in its corners and does not pray}
  - {id: h-5495.2-mary, ref: "Jāmiʿ 48:5495.2", unit: hadith-48-idols-and-images-of-the-house, agent: the prophet, action: rebukes the images in the House, object: images of Abraham and Mary, quoted: "anna l-mala'ikata la tadkhulu baytan fihi sura"}
  - {id: h-5495.3-saffron, ref: "Jāmiʿ 48:5495.3", unit: hadith-48-idols-and-images-of-the-house, agent: the prophet, action: smears statues with saffron, object: [statue of Abraham, statue of Ishmael, statue of Isaac], instrument: saffron, number: [360, 2], quoted: "ma kana ibrahimu yastaqsimu bi-l-azlam", outcome: the idols are thrown on their faces}
  - {id: h-5496.2-tulaqa, ref: "Jāmiʿ 48:5496.2", unit: hadith-48-the-freed-ones, agent: the prophet, action: names the classes of allies, name: [al-tulaqa', al-'utaqa'], quoted: "wa-l-tulaqa'u min quraysh wa-l-'utaqa'u min thaqif"}
  - {id: h-5497.1-sabr, ref: "Jāmiʿ 48:5497.1", unit: hadith-48-no-qurashi-killed-bound, agent: the prophet, action: forbids killing a Qurashi bound, time: day of the conquest, name: [al-'Asi, Muti'], quoted: "la yuqtalu qurashiyyun sabran ba'da hadha l-yawm"}
  - {id: h-5498.3-blood, ref: "Jāmiʿ 48:5498.3", unit: hadith-48-conquest-sermon, agent: the prophet, action: preaches rulings with his back to the Ka'ba, number: [10, 5], place: the Ka'ba, quoted: ["al-waladu li-l-firash wa-li-l-'ahiri l-athlab", "fi l-asabi' 'ashrun 'ashr"], object: Khuza'a permitted to fight until the afternoon prayer}
  - {id: h-5499.1-diya, ref: "Jāmiʿ 48:5499.1", unit: hadith-48-conquest-sermon, agent: the prophet, action: sets the heavy blood-money, number: [100, 40], instrument: [whip, stick, stone], quoted: ["arba'una fi butuniha awladuha", "tahta qadamayya hatayn"], object: custody of the House and watering of pilgrims excepted}
  - {id: h-5500.1-hour, ref: "Jāmiʿ 48:5500.1", unit: hadith-48-sanctity-of-mecca, agent: the prophet, action: declares Mecca's sanctity restored, time: the day after the conquest, quoted: ["harramaha llahu wa-lam yuharrimha l-nas", "sa'atan min nahar"]}
  - {id: h-5500.2-idhkhir, ref: "Jāmiʿ 48:5500.2", unit: hadith-48-sanctity-of-mecca, agent: al-Abbas, action: asks an exception for a grass, object: idhkhir, recipient: the prophet, quoted: "illa l-idhkhir"}
  - {id: h-5501.1-elephant, ref: "Jāmiʿ 48:5501.1", unit: hadith-48-sanctity-of-mecca, agent: God, action: held back the Elephant from Mecca, quoted: ["habasa 'an makka l-fil", "uktubu li-abi shah"], name: Abu Shah}
