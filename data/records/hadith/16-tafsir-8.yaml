  - {id: "h-7588.2-zanim", ref: "Jāmiʿ 60:7588.2", unit: "hadith-60-zanim-and-the-coarse", object: "a man of Quraysh", action: "known by a tag like a sheep's dewlap", quoted: "lahu zanama mithl zanamat al-shat"}
  - {id: "h-7589.2-shin", ref: "Jāmiʿ 60:7589.2", unit: "hadith-60-shin-uncovered", agent: "our Lord", action: "uncovers his shin", outcome: "the show-prostrator's back becomes a single plate", quoted: "fa-ya'udu zahruhu tabaqan wahidan"}
  - {id: "h-7591.1-winds", ref: "Jāmiʿ 60:7591.1", unit: "hadith-60-ad-destroyed-by-west-wind", object: ["east wind (saba)", "west wind (dabur)"], action: "helps the prophet; destroys 'Ad", name: "'Ad"}
  - {id: "h-7592.1-degrees", ref: "Jāmiʿ 60:7592.1", unit: "hadith-60-paradise-by-grace-and-degrees", object: "degrees of paradise", number: 100, place: "al-Firdaws under the Throne", outcome: "rivers of paradise flow from it"}
