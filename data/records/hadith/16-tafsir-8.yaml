  - {id: "h-7618.1-qasr", ref: "Jāmiʿ 60:7618.1", unit: "hadith-60-sparks-like-palaces", agent: "Ibn Abbas", action: "glosses the sparks", object: ["logs three cubits (qasr)", "ships' ropes (jimalat)"], number: 3, quoted: "habal al-sufun tujma'u hatta takuna ka-awsat al-rijal"}
