  - {id: "h-7634.3-seventy", ref: "Jāmiʿ 60:7634.3", unit: "hadith-60-standing-in-sweat", object: "sweat", action: "sinks into the earth", number: 70, quoted: "sab'ina dhira'an"}
  - {id: "h-7635.4-ten", ref: "Jāmiʿ 60:7635.4", unit: "hadith-60-standing-in-sweat", agent: "the prophet", action: "opens night prayer with ten of each formula", number: 10, object: ["takbir", "hamd", "tasbih", "tahlil", "istighfar"]}
