  - {id: "h-7598.3-tree", ref: "Jāmiʿ 60:7598.3", unit: "hadith-60-jinn-hear-the-quran-surat-al-jinn", agent: "a tree", action: "announces the jinn to the prophet", quoted: "adhanat bihim shajara"}
  - {id: "h-7600.2-gabriel", ref: "Jāmiʿ 60:7600.2", unit: "hadith-60-hour-unknown-gabriel-asks", agent: "Gabriel as a man", action: "asks about faith, islam, ihsan and the Hour", outcome: "sought, he is not seen", quoted: "hadha jibril ja'a yu'allimu l-nas dinahum"}
