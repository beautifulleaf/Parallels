  - {id: "h-7643.2-rider", ref: "Jāmiʿ 60:7643.2", unit: "hadith-60-the-lasting-over-the-passing", agent: "the prophet", action: "likens himself to a rider shading under a tree", instrument: "mat (hasir)", quoted: "ka-rakibin istazalla tahta shajara"}
