  - {id: "h-7583.2-lines", ref: "Jāmiʿ 60:7583.2", unit: "hadith-60-perfect-women", agent: "the prophet", action: "draws four lines in the earth", number: 4, name: ["Khadija", "Fatima", "Asiya", "Mary"]}
