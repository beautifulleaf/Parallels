  - {id: "h-7610.1-lips", ref: "Jāmiʿ 60:7610.1", unit: "hadith-60-do-not-move-your-tongue", agent: "the prophet", action: "moves his lips to hold revelation", outcome: "told to listen; recites after Gabriel leaves", quoted: "kana idha atahu jibril atraqa"}
