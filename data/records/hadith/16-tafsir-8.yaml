  - {id: "h-7645.3-camel", ref: "Jāmiʿ 60:7645.3", unit: "hadith-60-only-a-reminder", agent: "the one who bolts", action: "bolts from God", instrument: "simile of a camel bolting from its family", quoted: "shirad al-ba'ir 'ala ahlihi"}
  - {id: "h-7646.1-ten", ref: "Jāmiʿ 60:7646.1", unit: "hadith-60-the-ten-nights", object: ["ten of al-Adha", "day of Arafa", "day of sacrifice"], name: ["al-witr", "al-shaf'"], number: 10}
  - {id: "h-7647.3-prostrate", ref: "Jāmiʿ 60:7647.3", unit: "hadith-60-orphan-hell-and-regret", agent: "a man", action: "falls on his face from birth to death", outcome: "thinks it little on Resurrection day", quoted: "la-haqarahu yawm al-qiyama"}
  - {id: "h-7648.1-limb", ref: "Jāmiʿ 60:7648.1", unit: "hadith-60-the-steep-path", agent: "Ali b. Husayn", action: "frees a slave valued at ten thousand dirhams", number: 10000, outcome: "limb for limb saved from fire", name: "Abd Allah b. Ja'far"}
  - {id: "h-7649.3-kashih", ref: "Jāmiʿ 60:7649.3", unit: "hadith-60-the-steep-path", object: "alms to a hostile kinsman", action: "ranked best", quoted: "dhi l-rahim al-kashih"}
  - {id: "h-7651.2-beast", ref: "Jāmiʿ 60:7651.2", unit: "hadith-60-soul-and-its-inspiration", object: "newborn beast", action: "born whole", outcome: "parents make the child Jew, Christian or Magian", quoted: "jam'a' ... min jad'a'"}
  - {id: "h-7652.3-abu-zama", ref: "Jāmiʿ 60:7652.3", unit: "hadith-60-the-wretched-one", agent: "a mighty man of his clan", action: "hamstrings the she-camel", name: "Abu Zam'a", quoted: "'aziz 'arim mani' fi rahtihi"}
  - {id: "h-7653.1-reading", ref: "Jāmiʿ 60:7653.1", unit: "hadith-60-the-male-and-the-female", agent: ["Alqama", "Abu l-Darda'"], action: "read 'and the male and the female'", place: "Syria", quoted: "wa-l-dhakari wa-l-untha"}
