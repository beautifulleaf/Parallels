  - {id: "h-7607.2-sides", ref: "Jāmiʿ 60:7607.2", unit: "hadith-60-cover-me", agent: "the prophet", action: "looks right, left, front and back, then up", number: 4, place: "Hira", outcome: "asks to be covered and have cold water poured on him", quoted: "dathiruni wa-subbu 'alayya ma'an baridan"}
  - {id: "h-7608.1-horn", ref: "Jāmiʿ 60:7608.1", unit: "hadith-60-the-trumpeter", agent: "the holder of the horn (sur)", action: "has the horn in his mouth, brow bent, awaiting the order", quoted: "hasbuna llahu wa-ni'ma l-wakil"}
