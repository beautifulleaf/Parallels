  - {id: "h-7593.1-brand", ref: "Jāmiʿ 60:7593.1", unit: "hadith-60-day-of-fifty-thousand-years", agent: "angels of punishment (implied)", action: "brand and trample the withholder of zakat", object: ["gold and silver as fire plates", "camels", "cattle", "sheep"], time: "a day of fifty thousand years", number: 50000, quoted: "kullama baradat u'idat lahu"}
  - {id: "h-7594.2-noah", ref: "Jāmiʿ 60:7594.2", unit: "hadith-60-noahs-witnesses", agent: "Muhammad and his community", action: "testify that Noah delivered the message", recipient: "God", name: "Noah", quoted: "fa-nashhadu annahu qad ballagha"}
  - {id: "h-7595.1-embryo", ref: "Jāmiʿ 60:7595.1", unit: "hadith-60-created-in-stages", agent: "an angel", action: "writes four things", object: ["deeds", "provision", "term", "wretched or blessed"], time: "after three forties", number: [40, 4]}
  - {id: "h-7595.2-idols", ref: "Jāmiʿ 60:7595.2", unit: "hadith-60-idols-of-noahs-people", agent: "Satan", action: "inspires the people to set up stones in the sitting places of righteous men", name: ["Wadd", "Suwa'", "Yaghuth", "Ya'uq", "Nasr"], place: ["Dumat al-Jandal", "al-Jurf near Saba'"], outcome: "worshipped once knowledge was forgotten", number: 5}
  - {id: "h-7597.1-ukaz", ref: "Jāmiʿ 60:7597.1", unit: "hadith-60-jinn-hear-the-quran-surat-al-jinn", agent: "the devils", action: "search east and west for the cause of the meteors", place: ["Nakhla", "road to the market of 'Ukaz", "Tihama"], time: "the dawn prayer", outcome: "hear the Quran and return to their people"}
  - {id: "h-7598.1-bones", ref: "Jāmiʿ 60:7598.1", unit: "hadith-60-jinn-hear-the-quran-surat-al-jinn", agent: "the prophet", action: "grants the jinn provision", object: ["bones with God's name said over them", "dung"], outcome: "bones refleshed, dung fodder; not to be used for cleansing", quoted: "awfara ma yakunu lahman"}
