  - {id: "h-7638.1-trench", ref: "Jāmiʿ 60:7638.1", unit: "hadith-60-the-boy-and-the-king", agent: "the king", action: "has trenches dug at the mouths of the roads and fires lit", object: "believers", outcome: "an infant tells his mother 'be patient, you are on the truth'", quoted: "ya ummah isbiri fa-innaki 'ala l-haqq"}
  - {id: "h-7641.1-arrival", ref: "Jāmiʿ 60:7641.1", unit: "hadith-60-sabbih-and-its-uses", agent: "al-Bara'", action: "learns al-A'la before the prophet arrives", name: ["Mus'ab b. Umayr", "Ibn Umm Maktum", "Ammar", "Bilal", "Sa'd", "Umar"], number: 20}
  - {id: "h-7642.2-witr", ref: "Jāmiʿ 60:7642.2", unit: "hadith-60-sabbih-and-its-uses", agent: "the prophet", action: "prays witr of three", number: 3, object: ["al-A'la", "al-Kafirun", "al-Ikhlas"]}
