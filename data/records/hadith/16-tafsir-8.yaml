  - {id: "h-7581.1-slave", ref: "Jāmiʿ 60:7581.1", unit: "hadith-60-slave-woman-forbidden", agent: "the prophet", action: "forbids his slave woman to himself", recipient: "Aisha and Hafsa (pressing)", name: "Umm Ibrahim", outcome: "Q 66:1-2 releases the oath", quoted: "umm ibrahim 'alayya haram"}
