  - {id: "h-7585.1-seven", ref: "Jāmiʿ 60:7585.1", unit: "hadith-60-fear-unseen-and-trust", agent: "God", action: "shades", number: 7, object: ["just ruler", "youth", "weeper alone", "heart in mosque", "two who love", "man refusing a woman", "secret giver"], quoted: "dhat mansib wa-jamal ... inni akhafu llah"}
  - {id: "h-7586.1-birds", ref: "Jāmiʿ 60:7586.1", unit: "hadith-60-fear-unseen-and-trust", object: "birds", action: "go out hungry and return full", quoted: "taghdu khimasan wa-taruhu bitanan"}
