  - {id: "h-7601.1-year", ref: "Jāmiʿ 60:7601.1", unit: "hadith-60-night-prayer-of-the-prophet", agent: "God", action: "holds back the end of al-Muzzammil in heaven", time: "twelve months", number: 12, outcome: "night prayer becomes voluntary", quoted: "amsaka llahu khatimataha thnay 'ashara shahran fi l-sama'"}
  - {id: "h-7601.1-twelve", ref: "Jāmiʿ 60:7601.1", unit: "hadith-60-night-prayer-of-the-prophet", agent: "the prophet", action: "makes up missed night prayer by day", number: 12}
  - {id: "h-7603.1-poetry", ref: "Jāmiʿ 60:7603.1", unit: "hadith-60-measured-recitation", agent: "Ibn Mas'ud", action: "rebukes reading the Mufassal in one rak'a", number: [20, 2], quoted: "hadhdhan ka-hadhdh al-shi'r"}
  - {id: "h-7603.2-ascend", ref: "Jāmiʿ 60:7603.2", unit: "hadith-60-measured-recitation", agent: "the companion of the Quran", action: "recites and ascends", outcome: "station at the last verse recited", quoted: "iqra' wa-rqa"}
