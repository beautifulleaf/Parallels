# Observation records for hadith chunk 15 (al-Jāmiʿ al-Kāmil book 60, tafsir, pp. 7420-7539: Q 40:27 to 58:8).
records:
  # ---- Ghafir (40)
  - {id: "h-7420.1-throats", ref: "Jāmiʿ 60:7420.1", unit: "hadith-60-prayer-setting-god-at-enemies-throats", agent: "the prophet", action: "prays when fearing a people", object: "God set at their throats", quoted: "allahumma inna naj'aluka fi nuhurihim"}
  - {id: "h-7420.2-throttle", ref: "Jāmiʿ 60:7420.2", unit: "hadith-60-abu-bakr-will-you-kill-a-man", agent: "Uqba b. Abi Mu'ayt", action: "twists the prophet's garment round his neck and throttles him", place: "courtyard of the Kaaba", recipient: "the prophet", outcome: "Abu Bakr pushes him off quoting Q 40:28", quoted: "a-taqtuluna rajulan an yaqula rabbiya llah"}
  - {id: "h-7420.3-slaughter", ref: "Jāmiʿ 60:7420.3", unit: "hadith-60-abu-bakr-will-you-kill-a-man", agent: "the prophet", action: "tells Quraysh he was sent to them with slaughter", instrument: "gesture to his throat", place: "shade of the Kaaba", name: "Abu Jahl", quoted: "ma ursiltu ilaykum illa bi-l-dhabh"}
  - {id: "h-7421.1-faint", ref: "Jāmiʿ 60:7421.1", unit: "hadith-60-abu-bakr-will-you-kill-a-man", agent: "Quraysh", action: "beat the prophet until he faints", outcome: "Abu Bakr called a madman", name: "Ibn Abi Quhafa al-majnun"}
  - {id: "h-7422.1-flock", ref: "Jāmiʿ 60:7422.1", unit: "hadith-60-shepherd-without-counsel", agent: "a ruler given a flock (ra'iyya)", action: "fails to surround it with counsel", outcome: "does not smell the scent of paradise", name: [Ma'qil b. Yasar, Ubayd Allah b. Ziyad], quoted: "lam yahutha bi-nasiha illa lam yajid ra'ihat al-janna"}
  - {id: "h-7422.2-seat", ref: "Jāmiʿ 60:7422.2", unit: "hadith-60-seat-shown-morning-and-evening", object: "the dead man's seat in paradise or the fire", action: "is shown to him", time: "morning and evening", outcome: "until God raises him", quoted: "'urida 'alayhi maq'aduhu bi-l-ghadat wa-l-'ashiyy"}
  - {id: "h-7422.3-war", ref: "Jāmiʿ 60:7422.3", unit: "hadith-60-war-on-gods-friend", agent: "God", action: "declares war on whoever harms his friend", object: "hearing, sight, hand, foot of the loved servant", quoted: "kuntu sam'ahu lladhi yasma'u bihi"}
  - {id: "h-7423.1-dua", ref: "Jāmiʿ 60:7423.1", unit: "hadith-60-supplication-is-worship", agent: "the prophet", action: "defines supplication as worship and recites Q 40:60", quoted: "al-du'a' huwa l-'ibada"}
  # ---- Fussilat (41)
  - {id: "h-7425.1-jar", ref: "Jāmiʿ 60:7425.1", unit: "hadith-60-old-womans-broken-jar", agent: "a youth", action: "pushes an old woman between the shoulders", object: "water jar on her head", place: "Abyssinia", outcome: "she falls on her knees and the jar breaks; she warns him of judgment", time: "when God sets the kursi", quoted: ["sawfa ta'lamu ya ghudar", "kayfa yuqaddisu llahu ummatan"]}
  - {id: "h-7426.1-three", ref: "Jāmiʿ 60:7426.1", unit: "hadith-60-does-god-hear-our-whisper", agent: "three men (Qurashis and Thaqafis)", action: "debate whether God hears what is said and what is hidden", place: "by the House", number: 3, quoted: "yasma'u in jaharna wa-la yasma'u in akhfayna"}
  - {id: "h-7426.2-upright", ref: "Jāmiʿ 60:7426.2", unit: "hadith-60-be-upright-and-love-of-meeting", agent: "Sufyan b. Abd Allah al-Thaqafi", action: "asks a saying needing no further asking", recipient: "the prophet", outcome: "say I believe in God, then be upright", quoted: "qul amantu bi-llah fa-staqim"}
  - {id: "h-7427.2-gabriel", ref: "Jāmiʿ 60:7427.2", unit: "hadith-60-gabriel-teaches-religion", agent: "Gabriel as a man", action: "questions the prophet before the people", object: [faith, islam, ihsan, the Hour], outcome: "sought after leaving he is not found", number: 5, quoted: "hadha jibril ja'a yu'allimu l-nas dinahum"}
  # ---- al-Shura (42)
  - {id: "h-7428.1-bell", ref: "Jāmiʿ 60:7428.1", unit: "hadith-60-how-revelation-comes", agent: "revelation", action: "comes like the ringing of a bell or as an angel in a man's form", recipient: "the prophet", outcome: "brow streams with sweat on a very cold day", name: "al-Harith b. Hisham asks", quoted: "mithla salsalat al-jaras"}
  - {id: "h-7428.2-hazwara", ref: "Jāmiʿ 60:7428.2", unit: "hadith-60-mecca-and-the-five-gifts", agent: "the prophet", action: "addresses Mecca as the best of God's land", place: "al-Hazwara in Mecca's market", quoted: "law la anni ukhrijtu minki ma kharajtu"}
  - {id: "h-7429.1-five", ref: "Jāmiʿ 60:7429.1", unit: "hadith-60-mecca-and-the-five-gifts", agent: "God", action: "gives the prophet five things given to none before", object: [sent to red and black, spoils lawful, earth pure and a mosque, terror a month's journey, intercession], number: [5, one month]}
  - {id: "h-7429.2-love", ref: "Jāmiʿ 60:7429.2", unit: "hadith-60-with-whom-you-love", agent: "a bedouin", action: "asks when the Hour is", outcome: "you are with whom you love", quoted: "ma a'dadta laha"}
  - {id: "h-7431.1-camel", ref: "Jāmiʿ 60:7431.1", unit: "hadith-60-joy-at-repentance", agent: "a traveller", action: "loses his camel with his food and drink and finds it standing by him", place: "a waterless desert", outcome: "misspeaks in joy", quoted: "allahumma anta 'abdi wa-ana rabbuka"}
  # ---- al-Zukhruf (43)
  - {id: "h-7433.1-mount", ref: "Jāmiʿ 60:7433.1", unit: "hadith-60-travel-prayer", agent: "the prophet", action: "says takbir and the verse of subjection on mounting his camel", number: 3, time: "setting out on a journey", quoted: ["subhana lladhi sakhkhara lana hadha", "anta l-sahib fi l-safar wa-l-khalifa fi l-ahl", "ayibuna ta'ibuna 'abiduna"]}
  - {id: "h-7434.1-mat", ref: "Jāmiʿ 60:7434.1", unit: "hadith-60-world-for-them", agent: "Umar", action: "weeps at the mat's marks on the prophet's side", place: "the upper room (mashraba) of the oath of separation", object: [mat, leather pillow stuffed with palm fibre, tanning leaves, hanging hides], name: [Kisra, Caesar], quoted: "a-ma tarda an takuna lahum al-dunya wa-lana l-akhira"}
  - {id: "h-7434.2-vessel", ref: "Jāmiʿ 60:7434.2", unit: "hadith-60-world-for-them", agent: "Hudhayfa", action: "throws a silver drinking vessel at a dihqan", place: "al-Mada'in", object: "silver vessel", quoted: "la tashrabu fi ina' al-dhahab wa-l-fidda"}
  - {id: "h-7434.3-sheep", ref: "Jāmiʿ 60:7434.3", unit: "hadith-60-world-for-them", agent: "the prophet", action: "points to a dead sheep with its leg in the air", place: "Dhu l-Hulayfa", object: "a gnat's wing", outcome: "the world meaner to God than the carcass to its owner", quoted: "janah ba'uda"}
  - {id: "h-7436.1-jesus", ref: "Jāmiʿ 60:7436.1", unit: "hadith-60-son-of-mary-as-example", agent: "Quraysh", action: "object that Christians worship Jesus whom the prophet calls a righteous servant", outcome: "verse 43:57 revealed; 43:61 glossed as Jesus' coming before resurrection", name: "Jesus son of Mary", quoted: "huwa khuruj 'isa bn maryam qabla yawm al-qiyama"}
  - {id: "h-7437.1-inherit", ref: "Jāmiʿ 60:7437.1", unit: "hadith-60-paradise-inherited", object: "two dwellings for every person", action: "the people of paradise inherit the damned man's dwelling", number: 2, quoted: "manzil fi l-janna wa-manzil fi l-nar"}
  - {id: "h-7437.2-malik", ref: "Jāmiʿ 60:7437.2", unit: "hadith-60-ya-malik-from-the-pulpit", agent: "the prophet", action: "recites Q 43:77 on the pulpit", name: "Malik", quoted: "wa-nadaw ya malik"}
  # ---- al-Dukhan (44)
  - {id: "h-7439.2-smoke", ref: "Jāmiʿ 60:7439.2", unit: "hadith-60-the-smoke", agent: "the prophet", action: "prays against Quraysh for years of famine", recipient: "Quraysh (Mudar)", outcome: "they eat bones and see the sky as smoke; rain comes at his prayer; the great assault is Badr", name: "years of Joseph", quoted: "bi-sinina ka-sini yusuf"}
  - {id: "h-7440.1-five", ref: "Jāmiʿ 60:7440.1", unit: "hadith-60-the-smoke", object: [al-lizam, al-Rum, the assault, the moon, the smoke], action: "have already passed", number: 5, name: "Ibn Mas'ud"}
  - {id: "h-7440.2-ten", ref: "Jāmiʿ 60:7440.2", unit: "hadith-60-the-smoke", object: [smoke, Dajjal, beast, sun from the west, descent of Jesus, Gog and Magog, three sinkings, fire from Yemen], action: "precede the Hour", number: 10, outcome: "fire drives people to their gathering"}
  - {id: "h-7441.1-death", ref: "Jāmiʿ 60:7441.1", unit: "hadith-60-death-slaughtered", agent: "a herald", action: "death is brought and slaughtered", object: "death", place: "between paradise and the fire", outcome: "joy and grief increased", quoted: "ya ahl al-janna la mawt"}
  - {id: "h-7441.2-four", ref: "Jāmiʿ 60:7441.2", unit: "hadith-60-death-slaughtered", agent: "a herald", action: "proclaims to the people of paradise", object: [health, life, youth, bliss], number: 4, quoted: "fa-la tasqamu abadan"}
  # ---- al-Jathiya (45)
  - {id: "h-7442.1-stone", ref: "Jāmiʿ 60:7442.1", unit: "hadith-60-stone-swapped-for-better", agent: "an Arab", action: "worships a stone and takes a better one when found", object: "stone", quoted: "fa-idha wajada ahsana minhu akhadhahu"}
  - {id: "h-7443.1-dahr", ref: "Jāmiʿ 60:7443.1", unit: "hadith-60-i-am-time", agent: "God", action: "declares himself Time and turns night and day", quoted: ["ana l-dahr", "ya khaybat al-dahr"]}
  - {id: "h-7444.2-forget", ref: "Jāmiʿ 60:7444.2", unit: "hadith-60-i-forget-you-as-you-forgot-me", agent: "God", action: "asks the servant whether he thought he would meet him", object: [honour, lordship, wife, horses and camels], outcome: "I forget you as you forgot me", quoted: "fa-inni ansaka kama nasitani"}
  - {id: "h-7444.3-izar", ref: "Jāmiʿ 60:7444.3", unit: "hadith-60-grandeur-gods-cloak", agent: "God", object: [loincloth (izar), cloak (rida')], name: [might, grandeur], outcome: "whoever contends is punished", quoted: "al-'izz izaruhu wa-l-kibriya' rida'uhu"}
  # ---- al-Ahqaf (46)
  - {id: "h-7445.2-mazun", ref: "Jāmiʿ 60:7445.2", unit: "hadith-60-uthman-b-mazun", agent: "Umm al-'Ala'", action: "vouches that God honoured the dead Uthman b. Maz'un", recipient: "the prophet", outcome: "corrected; she never vouches for anyone again", instrument: "lot that assigned him to her household", quoted: "wa-ma yudrika anna llaha akramahu"}
  - {id: "h-7446.1-synagogue", ref: "Jāmiʿ 60:7446.1", unit: "hadith-60-witness-from-israel", agent: "the prophet", action: "asks the Jews for twelve witnesses", place: "synagogue (kanisa) of the Jews in Medina", time: "their feast day", number: [12, 3], outcome: "none answers; Abd Allah b. Salam bears witness and is reviled", name: [al-Hashir, al-'Aqib, al-Muqaffi], quoted: "yuhbitu llahu 'an kull yahudi taht adim al-sama' al-ghadab"}
  - {id: "h-7448.1-uff", ref: "Jāmiʿ 60:7448.1", unit: "hadith-60-son-who-said-uff", agent: "Marwan", action: "applies Q 46:17 to Abd al-Rahman b. Abi Bakr", place: "Hijaz; Aisha's house", outcome: "Aisha denies it from behind the curtain", name: "Yazid b. Mu'awiya", quoted: "illa anna llaha anzala 'udhri"}
  - {id: "h-7449.1-wind", ref: "Jāmiʿ 60:7449.1", unit: "hadith-60-cloud-of-ad", agent: "the prophet", action: "changes colour, comes and goes at clouds", outcome: "relieved when rain falls", name: "'Ad", quoted: "hadha 'arid mumtiruna"}
  - {id: "h-7449.2-envoy", ref: "Jāmiʿ 60:7449.2", unit: "hadith-60-cloud-of-ad", agent: "the envoy (qayl) of 'Ad", action: "drinks a month with Bakr, then prays for rain on the mountains of Mahra", recipient: "'Ad", instrument: "two singing girls called the two locusts", time: "a month", outcome: "black clouds bring ash; wind only as through a ring", number: 2, quoted: ["khudha ramadan rimdidan", "la takun ka-wafid 'ad"]}
  - {id: "h-7450.1-jinn", ref: "Jāmiʿ 60:7450.1", unit: "hadith-60-jinn-hear-the-quran", agent: "jinn", action: "listen to the prophet's recitation", place: "Batn Nakhla", number: 9, name: "Zawba'a", quoted: "sah"}
  - {id: "h-7450.2-search", ref: "Jāmiʿ 60:7450.2", unit: "hadith-60-jinn-hear-the-quran", agent: "devils", action: "search east and west for what barred them from heaven", place: [Nakhla, road to Suq 'Ukaz], time: "dawn prayer", outcome: "hear the Quran and return to warn"}
  - {id: "h-7451.1-night", ref: "Jāmiʿ 60:7451.1", unit: "hadith-60-jinn-hear-the-quran", agent: "the prophet", action: "goes with the jinn's summoner and recites to them", place: "from the direction of Hira'", time: "one night", outcome: "shows their traces and fires; grants bones and dung as food", quoted: "ata-ni da'i l-jinn"}
  - {id: "h-7451.2-nisibin", ref: "Jāmiʿ 60:7451.2", unit: "hadith-60-jinn-hear-the-quran", agent: "Abu Hurayra", action: "brings stones for cleansing, not bone or dung", name: "jinn of Nisibin", outcome: "bones and dung found with food for the jinn"}
  - {id: "h-7452.1-calf", ref: "Jāmiʿ 60:7452.1", unit: "hadith-60-jinn-hear-the-quran", agent: "a voice", action: "cries from a slaughtered calf at the idols", object: "calf", name: "Jalih", outcome: "soon a prophet is announced", quoted: "ya jalih amr najih rajul fasih"}
  # ---- Muhammad (47)
  - {id: "h-7453.1-martyr", ref: "Jāmiʿ 60:7453.1", unit: "hadith-60-martyrs-gifts", agent: "God", action: "grants the martyr gifts at the first spurt of blood", recipient: "the martyr", number: [6, 70], quoted: "yushaffa'u fi sab'in insanan min aqaribihi"}
  - {id: "h-7454.2-debt", ref: "Jāmiʿ 60:7454.2", unit: "hadith-60-martyrs-gifts", recipient: "the martyr", action: "is forgiven every sin", outcome: "except debt", quoted: "illa l-dayn"}
  - {id: "h-7454.3-bridge", ref: "Jāmiʿ 60:7454.3", unit: "hadith-60-bridge-before-paradise", agent: "believers saved from the fire", action: "are held to settle wrongs", place: "a bridge (qantara) between paradise and the fire", outcome: "enter purified"}
  - {id: "h-7455.1-hubal", ref: "Jāmiʿ 60:7455.1", unit: "hadith-60-god-our-protector-at-uhud", agent: "Abu Sufyan", action: "calls three questions and shouts for Hubal", place: "Uhud", number: 70, name: [Hubal, al-'Uzza], outcome: "God is our protector and you have none", quoted: "u'lu hubal"}
  - {id: "h-7456.1-goats", ref: "Jāmiʿ 60:7456.1", unit: "hadith-60-seven-intestines", agent: "an unbelieving guest", action: "drinks the milk of seven goats", outcome: "after accepting Islam cannot finish a second", number: 7, quoted: "al-kafir yashrabu fi sab'at am'a'"}
  - {id: "h-7456.5-poor", ref: "Jāmiʿ 60:7456.5", unit: "hadith-60-seven-intestines", agent: "Ibn Umar", action: "eats only with a poor man brought to him", outcome: "sends away a heavy eater", name: "Nafi'"}
  - {id: "h-7457.2-seas", ref: "Jāmiʿ 60:7457.2", unit: "hadith-60-seas-and-rivers-of-paradise", object: [sea of milk, sea of water, sea of honey, sea of wine], place: "paradise", number: 4, outcome: "rivers split off from them"}
  - {id: "h-7457.3-firdaws", ref: "Jāmiʿ 60:7457.3", unit: "hadith-60-seas-and-rivers-of-paradise", object: "degrees of paradise", number: 100, place: "al-Firdaws under the throne", outcome: "rivers burst from it", quoted: "wa-fawqahu 'arsh al-rahman"}
  - {id: "h-7458.2-seal", ref: "Jāmiʿ 60:7458.2", unit: "hadith-60-asking-forgiveness", agent: "Abd Allah b. Sarjis", action: "goes behind the prophet and sees the seal of prophethood", place: "between his shoulders", quoted: "khatam al-nubuwwa bayna katifayhi"}
  - {id: "h-7459.1-seventy", ref: "Jāmiʿ 60:7459.1", unit: "hadith-60-asking-forgiveness", agent: "the prophet", action: "asks forgiveness and repents", number: "more than 70", time: "each day"}
  - {id: "h-7459.3-womb", ref: "Jāmiʿ 60:7459.3", unit: "hadith-60-womb-and-kinship", agent: "the womb (al-rahim)", action: "stands and seeks refuge from severance", recipient: "God", time: "when creation was finished", outcome: "promised that God joins who joins it and cuts who cuts it", quoted: "hadha maqam al-'a'idh min al-qati'a"}
  - {id: "h-7461.3-salman", ref: "Jāmiʿ 60:7461.3", unit: "hadith-60-salman-and-his-people", agent: "the prophet", action: "strikes Salman's thigh", outcome: "men of Persia would reach religion even at the Pleiades", name: [Salman, al-Thurayya]}
  # ---- al-Fath (48)
  - {id: "h-7462.1-thrice", ref: "Jāmiʿ 60:7462.1", unit: "hadith-60-surah-of-the-conquest-revealed", agent: "Umar", action: "asks three times and gets no answer", time: "a night march", number: 3, outcome: "the surah dearer than all the sun rises on", quoted: "nazarta rasul allah thalath marrat"}
  - {id: "h-7463.2-tarji", ref: "Jāmiʿ 60:7463.2", unit: "hadith-60-surah-of-the-conquest-revealed", agent: "the prophet", action: "recites al-Fath with trills", place: "on his she-camel", time: "day of the conquest", number: 3, quoted: "a-a-a"}
  - {id: "h-7463.3-daniyya", ref: "Jāmiʿ 60:7463.3", unit: "hadith-60-is-it-a-conquest", agent: "Umar", action: "asks the prophet and then Abu Bakr the same questions", place: "Hudaybiya", outcome: "identical answers; on hearing the surah, content", quoted: "a-wa-fathun huwa? qala na'am"}
  - {id: "h-7464.1-bilal", ref: "Jāmiʿ 60:7464.1", unit: "hadith-60-is-it-a-conquest", agent: "Bilal", action: "undertakes to keep watch and falls asleep", place: "sand ground (dahas) at Hudaybiya", time: "until sunrise", outcome: "rule for one who sleeps or forgets"}
  - {id: "h-7464.2-well", ref: "Jāmiʿ 60:7464.2", unit: "hadith-60-is-it-a-conquest", agent: "the prophet", action: "rinses his mouth and pours the water into the drained well", place: "well of al-Hudaybiya", number: 1400, outcome: "the well waters them and their mounts"}
  - {id: "h-7465.1-feet", ref: "Jāmiʿ 60:7465.1", unit: "hadith-60-feet-swollen-in-prayer", agent: "the prophet", action: "prays at night until his feet swell", outcome: "shall I not be a grateful servant", quoted: "a-fa-la akunu 'abdan shakuran"}
  - {id: "h-7465.3-sakina", ref: "Jāmiʿ 60:7465.3", unit: "hadith-60-sakina-at-recitation", agent: "a man reciting al-Kahf", action: "sees his mount shy and a cloud cover him", name: "al-sakina", quoted: "fa-innaha l-sakina nazalat li-l-qur'an"}
  - {id: "h-7466.1-lamps", ref: "Jāmiʿ 60:7466.1", unit: "hadith-60-sakina-at-recitation", agent: "Usayd b. Hudayr", action: "recites at night in his date-store", object: "canopy with lamps rising into the sky", number: 3, name: "his son Yahya", outcome: "angels who would have been visible at dawn"}
  - {id: "h-7466.2-torah", ref: "Jāmiʿ 60:7466.2", unit: "hadith-60-prophet-in-the-torah", agent: "Abd Allah b. Amr", action: "quotes the prophet's description in the Torah", name: "al-Mutawakkil", object: [blind eyes, deaf ears, uncircumcised hearts], quoted: "wa-qulub ghulf"}
  - {id: "h-7467.1-pledge", ref: "Jāmiʿ 60:7467.1", unit: "hadith-60-pledge-under-the-tree", agent: "the companions", action: "pledge under the tree", place: "Hudaybiya, under a samura tree", number: 1400, quoted: "'ala an la nafirra wa-lam nubayi'hu 'ala l-mawt"}
  - {id: "h-7467.2-death", ref: "Jāmiʿ 60:7467.2", unit: "hadith-60-pledge-under-the-tree", agent: "the companions", action: "pledge", name: "Salama b. al-Akwa'", quoted: "'ala l-mawt"}
  - {id: "h-7467.3-hand", ref: "Jāmiʿ 60:7467.3", unit: "hadith-60-pledge-under-the-tree", agent: "the prophet", action: "strikes his right hand on his other hand for the absent Uthman", place: "Hudaybiya", name: "Uthman", quoted: "hadhihi yadu 'uthman"}
  - {id: "h-7468.3-forgot", ref: "Jāmiʿ 60:7468.3", unit: "hadith-60-pledge-under-the-tree", agent: "the pledgers", action: "cannot find the tree the next year", object: "the tree", name: "al-Musayyab", outcome: "Sa'id b. al-Musayyab mocks the later claim to know it"}
  - {id: "h-7468.4-felled", ref: "Jāmiʿ 60:7468.4", unit: "hadith-60-pledge-under-the-tree", agent: "Umar", action: "threatens those praying at the tree and has it cut down", object: "shajarat al-ridwan"}
  - {id: "h-7469.1-wariduha", ref: "Jāmiʿ 60:7469.1", unit: "hadith-60-pledge-under-the-tree", agent: "Hafsa", action: "objects with Q 19:71", recipient: "the prophet", outcome: "answered with Q 19:72", name: "Umm Mubashshir"}
  - {id: "h-7469.3-eighty", ref: "Jāmiʿ 60:7469.3", unit: "hadith-60-hands-restrained-at-mecca", agent: "eighty armed Meccans", action: "come down to take the camp unawares", place: "Mount al-Tan'im", number: 80, outcome: "captured and spared"}
  - {id: "h-7469.4-blind", ref: "Jāmiʿ 60:7469.4", unit: "hadith-60-hands-restrained-at-mecca", agent: "thirty armed youths", action: "rush the camp", instrument: "the prophet's prayer", number: 30, outcome: "God seizes their sight; captured and released", quoted: "fa-akhadha llahu bi-absarihim"}
  - {id: "h-7469.4-treaty", ref: "Jāmiʿ 60:7469.4", unit: "hadith-60-hands-restrained-at-mecca", agent: "Suhayl b. Amr", action: "holds the writer's hand twice", recipient: "Ali", outcome: "bi-smika llahumma and Muhammad son of Abd Allah written", place: "foot of the tree at Hudaybiya"}
