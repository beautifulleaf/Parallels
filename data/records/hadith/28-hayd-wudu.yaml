# Observation records, hadith chunk 28 (al-Jāmiʿ al-Kāmil book 6, kitāb al-ḥayḍ, and book 7, kitāb al-wuḍūʾ; pp. 985-1102).
records:
- id: h-985.1-makeup
  ref: Jāmiʿ 6:985.1
  unit: hadith-6-make-up-fast-not-prayer
  agent: menstruating women
  action: make up the fast but not the prayer
  recipient: Muʿadha (asker)
  name: Ḥarūriyya
  quoted: fa-nuʾmaru bi-qaḍāʾ al-ṣawm wa-lā nuʾmaru bi-qaḍāʾ al-ṣalāh; a-ḥarūriyyatun anti
- id: h-985.2-forty
  ref: Jāmiʿ 6:985.2
  unit: hadith-6-postpartum-forty-days
  agent: women after childbirth
  action: sit (abstain from prayer)
  time: forty days
  number: 40
  instrument: wars (yellow dye) on the face
  quoted: kānat al-nufasāʾ tajlisu ... arbaʿīna yawman; naṭlī wujūhanā bi-l-wars min al-kalaf
- id: h-986.1-pinch
  ref: Jāmiʿ 6:986.1
  unit: hadith-6-menstrual-blood-on-garment
  agent: woman
  action: pinches off menstrual blood, sprinkles with water, prays in the garment
  object: garment with menstrual blood
  instrument: water
  quoted: li-taqruṣhu thumma li-tanḍaḥhu bi-māʾ thumma li-tuṣallī fīhi
- id: h-987.1-saliva
  ref: Jāmiʿ 6:987.1
  unit: hadith-6-menstrual-blood-on-garment
  agent: Aisha and the wives
  action: moisten a bloodstain with saliva and scrape it with a fingernail
  object: the single garment worn in menstruation
  number: 1
  instrument:
  - saliva
  - fingernail
  quoted: mā kāna li-iḥdānā illā thawbun wāḥid ... qālat bi-rīqihā fa-qaṣaʿathu bi-ẓufrihā
- id: h-987.2-rib
  ref: Jāmiʿ 6:987.2
  unit: hadith-6-menstrual-blood-on-garment
  agent: woman
  action: scrapes menstrual blood and washes it
  object: garment
  instrument:
  - rib-bone (ḍilaʿ)
  - water and lote (sidr)
  quoted: ḥukkīhi bi-ḍilaʿ wa-ghsilīhi bi-māʾ wa-sidr
- id: h-988.1-prostration
  ref: Jāmiʿ 6:988.1
  unit: hadith-6-prayer-beside-the-menstruant
  agent: the Prophet
  action: prays on his mat; his garment touches his menstruating wife when he prostrates
  recipient: Maymuna
  place: beside his prayer place
  quoted: idhā sajada aṣābanī baʿḍu thawbihi
- id: h-988.2-wrap
  ref: Jāmiʿ 6:988.2
  unit: hadith-6-prayer-beside-the-menstruant
  agent: the Prophet
  action: prays at night beside his menstruating wife under one wrap
  object: mirṭ (wrap)
  recipient: Aisha
  time: night
  quoted: wa-ʿalayya mirṭun wa-ʿalayhi baʿḍuhu
- id: h-988.3-garment
  ref: Jāmiʿ 6:988.3
  unit: hadith-6-garment-of-intercourse-and-coverlets
  agent: the Prophet
  action: prays in the garment he lay with his wife in
  object: garment of intercourse
  outcome: allowed unless he sees a stain
  quoted: naʿam idhā lam yara fīhi adhan
- id: h-989.1-coverlets
  ref: Jāmiʿ 6:989.1
  unit: hadith-6-garment-of-intercourse-and-coverlets
  agent: the Prophet
  action: does not pray in the wives' undergarments or coverlets
  object:
  - shuʿur
  - luḥuf
  quoted: lā yuṣallī fī shuʿurinā aw fī luḥufinā
- id: h-989.2-mouth
  ref: Jāmiʿ 6:989.2
  unit: hadith-6-drinking-and-eating-with-the-menstruant
  agent: the Prophet
  action: drinks and bites where his menstruating wife put her mouth
  object:
  - drinking vessel
  - meat bone
  recipient: Aisha
  quoted: fa-yaḍaʿu fāhu ʿalā mawḍiʿi fiyya
- id: h-990.1-eat
  ref: Jāmiʿ 6:990.1
  unit: hadith-6-drinking-and-eating-with-the-menstruant
  agent: the Prophet
  action: permits eating with the menstruant
  recipient: Abdallah b. Saʿd
  quoted: wākilhā
- id: h-990.2-cover
  ref: Jāmiʿ 6:990.2
  unit: hadith-6-lying-with-the-menstruant
  agent: Umm Salama
  action: gets her period under the cloak, slips away, is called back under the coverlet
  object:
  - khamīṣa (black cloak)
  - khamīla (fringed coverlet)
  quoted: a-nufisti? ... fa-daʿānī fa-ḍṭajaʿtu maʿahu fī l-khamīla
- id: h-990.3-cloth
  ref: Jāmiʿ 6:990.3
  unit: hadith-6-lying-with-the-menstruant
  agent: the Prophet
  action: lies with his menstruating wife
  instrument: a garment between them
  recipient: Maymuna
  quoted: wa-baynī wa-baynahu thawb
- id: h-991.1-spot
  ref: Jāmiʿ 6:991.1
  unit: hadith-6-lying-with-the-menstruant
  agent: the Prophet
  action: sleeps in one cloth with menstruating wife; washes only the place her blood touched and prays in it
  object: shiʿār (undergarment)
  quoted: ghasala makānahu wa-lam yaʿduhu thumma ṣallā fīhi
- id: h-991.3-wrap
  ref: Jāmiʿ 6:991.3
  unit: hadith-6-fondling-above-the-wrap
  agent: the Prophet
  action: has the menstruating wife put on a waist-wrap, then touches her
  time: at the height of her flow
  object: izār
  quoted: an tattazira fī fawri ḥayḍatihā thumma yubāshiruhā; wa-ayyukum yamliku irbahu
- id: h-992.1-jews
  ref: Jāmiʿ 6:992.1
  unit: hadith-6-fondling-above-the-wrap
  agent: the Jews of Medina
  action: do not eat with or share the house with menstruating women
  recipient: menstruating women
  outcome: 'Prophet: ''do everything except intercourse''; Jews protest; two Companions offer intercourse, his face changes,
    he sends them milk'
  name:
  - Usayd b. Ḥuḍayr
  - ʿAbbād b. Bishr
  quoted: iṣnaʿū kulla shayʾin illā l-nikāḥ; mā yurīdu hādhā l-rajulu an yadaʿa min amrinā shayʾan illā khālafanā fīhi
- id: h-992.2-cloth
  ref: Jāmiʿ 6:992.2
  unit: hadith-6-fondling-above-the-wrap
  agent: the Prophet
  action: lays a cloth over the menstruant's private part
  object: cloth
  quoted: alqā ʿalā farjihā thawban
- id: h-993.1-combing
  ref: Jāmiʿ 6:993.1
  unit: hadith-6-combing-in-retreat
  agent: Aisha (menstruating)
  action: combs the Prophet's hair
  recipient: the Prophet in retreat in the mosque
  place:
  - her room
  - the mosque
  quoted: yudnī lahā raʾsahu wa-hiya fī ḥujratihā fa-turajjiluhu wa-hiya ḥāʾiḍ
- id: h-993.2-hand
  ref: Jāmiʿ 6:993.2
  unit: hadith-6-menstruation-not-in-the-hand
  agent: the Prophet
  action: asks the menstruant to hand him the mat from the mosque
  object: khumra (prayer mat)
  recipient: Aisha
  quoted: inna ḥayḍataki laysat fī yadiki
- id: h-995.1-disbelief
  ref: Jāmiʿ 6:995.1
  unit: hadith-6-menstruant-anus-soothsayer
  agent: whoever goes to
  object:
  - a menstruating woman
  - a woman in her anus
  - a soothsayer (kāhin)
  outcome: has disbelieved in what was revealed to Muhammad
  number: 3
  quoted: fa-qad kafara bi-mā unzila ʿalā Muḥammad
- id: h-996.1-yellow
  ref: Jāmiʿ 6:996.1
  unit: hadith-6-yellow-and-turbid
  agent: women (Umm ʿAṭiyya)
  action: do not count turbid and yellowish discharge
  object:
  - kudra
  - ṣufra
  quoted: kunnā lā naʿuddu l-kudrata wa-l-ṣufrata shayʾan
- id: h-997.1-vein
  ref: Jāmiʿ 6:997.1
  unit: hadith-6-prolonged-bleeding-a-vein
  agent: the Prophet
  action: rules prolonged bleeding a vein, not menstruation
  recipient: Fāṭima bt. Abī Ḥubaysh
  outcome: leave prayer in the period, wash the blood and pray after
  quoted: innamā dhālika ʿirqun wa-laysat bi-l-ḥayḍa
- id: h-997.2-count
  ref: Jāmiʿ 6:997.2
  unit: hadith-6-prolonged-bleeding-a-vein
  agent: the Prophet
  action: has the bleeding woman count her former days and leave prayer that long
  recipient: a woman pouring blood (via Umm Salama)
  instrument: a cloth bound on (istithfār)
  quoted: li-tanẓur ilā ʿadadi l-layālī wa-l-ayyām ... thumma li-tastathfir bi-thawb
- id: h-998.1-tub
  ref: Jāmiʿ 6:998.1
  unit: hadith-6-prolonged-bleeding-a-vein
  agent: Umm Ḥabība bt. Jaḥsh
  action: bathes for every prayer in a tub
  place: room of her sister Zaynab bt. Jaḥsh
  time: seven years of bleeding
  number: 7
  instrument: mirkan (tub)
  outcome: the red of the blood rises over the water
  name: Hind
  quoted: ḥattā taʿlū ḥumratu l-dami l-māʾa; la-tabkī li-annahā kānat lā tuṣallī
- id: h-999.1-days
  ref: Jāmiʿ 6:999.1
  unit: hadith-6-prolonged-bleeding-a-vein
  agent: the Prophet
  action: orders the bleeding woman to sit the days she used to sit, then bathe
  recipient: Fāṭima bt. Abī Ḥubaysh via Asmāʾ
  quoted: an taqʿuda l-ayyāma llatī kānat taqʿudu thumma taghtasil
- id: h-1000.1-bathe
  ref: Jāmiʿ 6:1000.1
  unit: hadith-6-bleeding-woman-bathing
  agent: the Prophet
  action: orders the bleeding woman to bathe at every prayer
  recipient: wife of Abd al-Rahman b. Awf
  quoted: an taghtasila ʿinda kulli ṣalāh
- id: h-1001.1-satan
  ref: Jāmiʿ 6:1001.1
  unit: hadith-6-bleeding-woman-bathing
  agent: the Prophet
  action: calls the bleeding from Satan and prescribes three baths a day
  instrument: mirkan (tub)
  number: 3
  outcome: bathe when yellow appears over the water; ablution in between
  name: Fāṭima bt. Abī Ḥubaysh
  quoted: subḥāna llāh inna hādhā mina l-shayṭān
- id: h-1001.2-kick
  ref: Jāmiʿ 6:1001.2
  unit: hadith-6-bleeding-woman-bathing
  agent: the Prophet
  action: calls the bleeding a kick of Satan; fixes six or seven days of menstruation
  recipient: Ḥamna bt. Jaḥsh
  number:
  - 6
  - 7
  - 23
  - 24
  instrument:
  - cotton (kursuf)
  - cloth
  place: house of Zaynab bt. Jaḥsh
  quoted: innamā hādhihi rakḍatun min rakaḍāt al-shayṭān; fa-taḥayyaḍī sittata ayyāmin aw sabʿatan fī ʿilmi llāh; innamā athujju
    thajjan
- id: h-1003.1-ablution
  ref: Jāmiʿ 6:1003.1
  unit: hadith-6-black-blood-and-ablution
  agent: the Prophet
  action: orders ablution for every prayer to the bleeding woman
  recipient: Fāṭima bt. Abī Ḥubaysh
  quoted: thumma tawaḍḍaʾī li-kulli ṣalāh
- id: h-1004.1-black
  ref: Jāmiʿ 6:1004.1
  unit: hadith-6-black-blood-and-ablution
  agent: the Prophet
  action: distinguishes menstrual blood by colour
  object: black blood
  recipient: Fāṭima bt. Abī Ḥubaysh
  quoted: fa-innahu damun aswadu yuʿraf
- id: h-1006.1-intention
  ref: Jāmiʿ 7:1006.1
  unit: hadith-7-deeds-by-intentions
  agent: the Prophet
  action: declares deeds by intentions
  object: emigration for God, the world or a woman
  quoted: innamā l-aʿmālu bi-l-niyyāt
- id: h-1006.2-fingers
  ref: Jāmiʿ 7:1006.2
  unit: hadith-7-ablution-in-gods-name
  agent: the Prophet
  action: puts his hand in the water and says 'in the name of God'
  outcome: water flows from between his fingers; about seventy make ablution
  number: 70
  quoted: tawaḍḍaʾū bi-smi llāh
- id: h-1008.1-hadath
  ref: Jāmiʿ 7:1008.1
  unit: hadith-7-no-prayer-without-purity
  agent: God
  action: does not accept the prayer of one who broke purity until ablution
  name: a man of Ḥaḍramawt
  quoted: lā tuqbalu ṣalātu aḥadikum idhā aḥdatha ḥattā yatawaḍḍaʾa
- id: h-1008.2-ghulul
  ref: Jāmiʿ 7:1008.2
  unit: hadith-7-no-prayer-without-purity
  agent: God
  action: accepts no prayer without purity, no alms from embezzlement
  name:
  - Ibn ʿĀmir
  - al-Baṣra
  quoted: lā yaqbalu llāhu ṣalātan bi-ghayri ṭuhūr wa-lā ṣadaqatan min ghulūl
- id: h-1008.3-food
  ref: Jāmiʿ 7:1008.3
  unit: hadith-7-no-prayer-without-purity
  agent: the Prophet
  action: eats after the privy without ablution
  place: after the khalāʾ
  quoted: lima? a-uṣallī fa-atawaḍḍaʾ?
- id: h-1010.2-key
  ref: Jāmiʿ 7:1010.2
  unit: hadith-7-key-of-prayer
  agent: the Prophet
  action: names the key, consecration and release of prayer
  object:
  - ṭuhūr
  - takbīr
  - taslīm
  quoted: miftāḥu l-ṣalāti l-ṭuhūr wa-taḥrīmuhā l-takbīr wa-taḥlīluhā l-taslīm
- id: h-1011.1-drops
  ref: Jāmiʿ 7:1011.1
  unit: hadith-7-sins-leave-with-the-water
  agent: the Muslim servant
  action: washes face, hands, feet
  outcome: the sins of eyes, hands and feet leave with the water or the last drop
  object:
  - face
  - hands
  - feet
  quoted: maʿa l-māʾ aw maʿa ākhiri qaṭri l-māʾ
- id: h-1011.2-nails
  ref: Jāmiʿ 7:1011.2
  unit: hadith-7-sins-leave-with-the-water
  agent: who perfects ablution
  outcome: sins leave until they come out from under the nails
  quoted: ḥattā takhruja min taḥti aẓfārihi
- id: h-1012.1-major
  ref: Jāmiʿ 7:1012.1
  unit: hadith-7-uthmans-ablution-and-forgiveness
  agent: the Muslim
  action: prays an obligatory prayer with good ablution, humility, bowing
  outcome: expiation of sins before it unless a major sin, for all time
  quoted: mā lam yuʾti kabīratan wa-dhālika l-dahra kullahu
- id: h-1012.2-silent
  ref: Jāmiʿ 7:1012.2
  unit: hadith-7-uthmans-ablution-and-forgiveness
  agent: the Prophet
  action: hesitates whether to speak, then tells of the five prayers as expiation
  time: after the afternoon prayer
  number: 5
  name:
  - Ḥumrān
  - Misʿar
  quoted: lā adrī a-uḥaddithukum bi-shayʾin aw askut
- id: h-1012.4-half
  ref: Jāmiʿ 7:1012.4
  unit: hadith-7-purity-half-of-faith
  agent: the Prophet
  action: names purity half of faith
  object:
  - praise fills the scale
  - prayer light
  - alms proof
  - patience radiance
  quoted: al-ṭuhūru shaṭru l-īmān; kullu l-nāsi yaghdū fa-bāyiʿun nafsahu fa-muʿtiquhā aw mūbiquhā
- id: h-1014.1-horns
  ref: Jāmiʿ 7:1014.1
  unit: hadith-7-amr-ibn-abasa
  agent: the Prophet
  action: teaches Amr b. Abasa the forbidden times of prayer and the sins leaving the limbs
  time:
  - sunrise
  - noon
  - sunset
  name:
  - ʿAmr b. ʿAbasa
  - Abū Bakr
  - Bilāl
  number: 7
  outcome: leaves his sin as on the day his mother bore him
  quoted: taṭluʿu bayna qarnay shayṭān wa-ḥīnaʾidhin yasjudu lahā l-kuffār; tusjaru jahannam
- id: h-1015.1-pilgrim
  ref: Jāmiʿ 7:1015.1
  unit: hadith-7-walking-out-purified
  agent: who goes out purified to an obligatory prayer
  outcome: reward of the pilgrim in iḥrām; forenoon prayer like ʿumra; written in ʿIlliyyūn
  quoted: ka-ajri l-ḥājji l-muḥrim ... kitābun fī ʿilliyyīn
- id: h-1015.2-five
  ref: Jāmiʿ 7:1015.2
  unit: hadith-7-ablution-expiates
  agent: Abu Umama
  action: affirms hearing it not once, twice, three, four, five times
  number: 5
  quoted: al-wuḍūʾu yukaffiru mā qablahu thumma taṣīru l-ṣalātu nāfilatan
- id: h-1016.1-knots
  ref: Jāmiʿ 7:1016.1
  unit: hadith-7-knots-of-the-night
  agent: a man rising at night
  action: makes ablution; a knot is untied with each limb
  number: 4
  recipient: those behind the veil
  quoted: wa-ʿalayhi ʿuqad ... fa-yaqūlu llāhu li-lladhīna warāʾa l-ḥijāb unẓurū ilā ʿabdī
- id: h-1018.1-sandals
  ref: Jāmiʿ 7:1018.1
  unit: hadith-7-bilals-sandals
  agent: Bilal
  action: prays after every purification
  outcome: the Prophet hears the beat of his sandals before him in paradise
  time: at the dawn prayer
  quoted: samiʿtu daffa naʿlayka bayna yadayya fī l-janna
- id: h-1018.2-verse
  ref: Jāmiʿ 7:1018.2
  unit: hadith-7-uthman-and-the-verse
  agent: Uthman
  action: makes ablution and tells the hadith only because of a verse
  place: al-Maqāʿid
  time: afternoon prayer
  outcome: forgiveness between one prayer and the next
  quoted: law-lā annahu fī kitābi llāh mā ḥaddathtukumūhu
- id: h-1018.3-river
  ref: Jāmiʿ 7:1018.3
  unit: hadith-7-river-at-the-door
  agent: the Prophet
  action: likens the five prayers to bathing in a river at the door
  number: 5
  place: at the door
  outcome: no dirt remains
  quoted: law anna naharan bi-bābi aḥadikum yaghtasilu fīhi kulla yawmin khamsan
- id: h-1019.3-brothers
  ref: Jāmiʿ 7:1019.3
  unit: hadith-7-river-at-the-door
  agent: two brothers
  action: the better dies first; the other lives forty more nights
  number: 40
  outcome: '''do you know what his prayer brought him to?'''
  quoted: mā yudrīkum mādhā balaghat bihi ṣalātuhu
- id: h-1021.1-sin
  ref: Jāmiʿ 7:1021.1
  unit: hadith-7-sin-then-two-rakas
  agent: a man who sins
  action: makes ablution, prays two rakʿas, asks forgiveness
  number: 2
  outcome: God forgives him
  name:
  - Abū Bakr
  - ʿAlī
  quoted: idhā ḥaddathanī ʿanhu ghayrī staḥlaftuhu
- id: h-1022.1-twothoughts
  ref: Jāmiʿ 7:1022.1
  unit: hadith-7-sin-then-two-rakas
  agent: who makes ablution well
  action: prays two rakʿas without drifting
  number: 2
  outcome: past sins forgiven
  quoted: lā yashū fīhimā
- id: h-1023.1-blaze
  ref: Jāmiʿ 7:1023.1
  unit: hadith-7-white-blazes
  agent: the Prophet's community
  action: is called on the day of resurrection
  outcome: blazed and white-footed from ablution
  place: on the roof of the mosque (Abū Hurayra)
  quoted: ghurran muḥajjalīna min āthāri l-wuḍūʾ; fa-man istaṭāʿa an yuṭīla ghurratahu fa-l-yafʿal
- id: h-1024.1-armpit
  ref: Jāmiʿ 7:1024.1
  unit: hadith-7-white-blazes
  agent: Abu Hurayra
  action: washes his arm up to the armpit
  name: Banū Farrūkh
  quoted: tablughu l-ḥilyatu mina l-muʾmin ḥaythu yablughu l-wuḍūʾ
- id: h-1025.1-cemetery
  ref: Jāmiʿ 7:1025.1
  unit: hadith-7-white-blazes
  agent: the Prophet
  action: greets the dead and longs for his brothers yet to come
  place:
  - the cemetery
  - the basin (ḥawḍ)
  outcome: 'men driven from the basin like a stray camel: ''they changed after you'''
  quoted: as-salāmu ʿalaykum dāra qawmin muʾminīn; fa-suḥqan fa-suḥqan fa-suḥqan
- id: h-1025.2-basin
  ref: Jāmiʿ 7:1025.2
  unit: hadith-7-white-blazes
  agent: the Prophet
  action: drives men from his basin as strange camels from a trough
  place:
  - Ayla
  - Aden
  quoted: inna ḥawḍī la-abʿadu min Ayla min ʿAdan
- id: h-1025.3-prostration
  ref: Jāmiʿ 7:1025.3
  unit: hadith-7-white-blazes
  agent: the Prophet's community
  outcome: white-faced from prostration, white-limbed from ablution
  time: day of resurrection
  quoted: ghurrun mina l-sujūd muḥajjalūna mina l-wuḍūʾ
- id: h-1026.1-piebald
  ref: Jāmiʿ 7:1026.1
  unit: hadith-7-white-blazes
  agent: the Prophet
  action: knows those he never saw
  quoted: ghurrun muḥajjalūna bulqun min āthāri l-wuḍūʾ
- id: h-1027.1-right
  ref: Jāmiʿ 7:1027.1
  unit: hadith-7-beginning-with-the-right
  agent: the Prophet
  action: begins with the right
  object:
  - sandals
  - combing
  - purification
  quoted: yuʿjibuhu l-tayammunu fī tanaʿʿulihi wa-tarajjulihi wa-ṭuhūrihi
- id: h-1027.3-head
  ref: Jāmiʿ 7:1027.3
  unit: hadith-7-abdallah-b-zayd-ablution
  agent: Abdallah b. Zayd
  action: shows the Prophet's ablution
  number:
  - 2
  - 3
  outcome: head wiped from the forehead to the nape and back
