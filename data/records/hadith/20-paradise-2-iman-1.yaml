# Observation records for hadith chunk 20 (al-Jāmiʿ al-Kāmil book 67, paradise and hell, pp. 8646-8686; book 2, faith, babs 1-53, pp. 119-197).
records:
  # ---- Book 67: paradise
  - {"id": "h-8646.1-sleep", "ref": "Jāmiʿ 67:8646.1", "unit": "hadith-67-no-sleep-in-paradise", "recipient": "people of paradise", "action": "do not sleep", "quoted": "al-nawm akhu l-mawt"}
  - {"id": "h-8646.2-wives", "ref": "Jāmiʿ 67:8646.2", "unit": "hadith-67-women-of-paradise", "agent": "first group to enter paradise", "object": "two wives each", "number": 2, "quoted": ["'ala surat al-qamar laylat al-badr", "yura mukhkh suqihima min wara' al-lahm", "wa-ma fi l-janna a'zab"]}
  - {"id": "h-8647.1-robes", "ref": "Jāmiʿ 67:8647.1", "unit": "hadith-67-women-of-paradise", "object": "two wives of the houris", "number": [2, 70], "quoted": "'ala kull wahida sab'un hulla yura mukhkh saqiha min wara' al-thiyab"}
  - {"id": "h-8647.2-headcloth", "ref": "Jāmiʿ 67:8647.2", "unit": "hadith-67-women-of-paradise", "agent": "a woman of paradise", "action": "looks down on the earth", "outcome": "lights and scents all between", "object": "her headcloth", "quoted": ["la-ada'at ma baynahuma wa-la-mala'at ma baynahuma rihan", "wa-la-nasifuha -ya'ni l-khimar- khayr min al-dunya wa-ma fiha"]}
  - {"id": "h-8647.3-glass", "ref": "Jāmiʿ 67:8647.3", "unit": "hadith-67-women-of-paradise", "object": "marrow of the wives' shins", "instrument": "seventy robes", "number": 70, "quoted": "kama tara l-sharab al-ahmar fi l-zujaja al-bayda'"}
  - {"id": "h-8648.1-stipend", "ref": "Jāmiʿ 67:8648.1", "unit": "hadith-67-women-of-paradise", "agent": "Sa'id b. 'Amir b. Hidhyam", "action": "gives away a stipend in purses", "recipient": "the needy", "number": 10000, "name": "'Umar", "outcome": "tells his wife he prefers the houris", "quoted": ["law anna huran attala'at isba'an min asabi'iha la-wajada rihaha kull dhi ruh", "la-antunna ahaqq an ada'akunna lahunna"]}
  - {"id": "h-8648.2-sun", "ref": "Jāmiʿ 67:8648.2", "unit": "hadith-67-women-of-paradise", "agent": "a woman of paradise", "action": "looks down on the people of the earth", "outcome": "fills the earth with musk, takes away the light of sun and moon", "quoted": "wa-la-adhhabat daw' al-shams wa-l-qamar"}
  - {"id": "h-8649.1-jew", "ref": "Jāmiʿ 67:8649.1", "unit": "hadith-67-intercourse-in-paradise", "agent": "a Jew", "action": "challenges the prophet on eating in paradise", "recipient": "the prophet", "number": 100, "outcome": "need leaves as musk-scented sweat", "quoted": ["in aqarra li bi-hadhihi khasamtuhu", "'araq yafidu min juludihim mithl rih al-misk fa-idha l-batn qad damur"]}
  - {"id": "h-8649.3-virgin", "ref": "Jāmiʿ 67:8649.3", "unit": "hadith-67-intercourse-in-paradise", "agent": "man of paradise", "action": "has intercourse", "outcome": "wife returns purified and virgin", "quoted": "dahman dahman fa-idha qama 'anha raja'at mutahhara bikran"}
  - {"id": "h-8650.1-hundred", "ref": "Jāmiʿ 67:8650.1", "unit": "hadith-67-intercourse-in-paradise", "agent": "man of paradise", "action": "goes in to virgins", "time": "in one day", "number": 100, "quoted": "la-yufdi fi l-yawm al-wahid ila mi'at 'adhra'"}
  - {"id": "h-8650.2-child", "ref": "Jāmiʿ 67:8650.2", "unit": "hadith-67-child-in-paradise", "agent": "believer in paradise", "action": "desires a child", "time": "one hour", "outcome": "carrying, birth and growth in an hour", "quoted": "kana hamluhu wa-wad'uhu wa-sinnuhu fi sa'a kama yashtahi"}
  - {"id": "h-8651.1-sowing", "ref": "Jāmiʿ 67:8651.1", "unit": "hadith-67-farming-in-paradise", "agent": "a man of paradise", "action": "asks God's leave to sow", "object": "seed", "outcome": "sprouts, ripens, reaped, heaped like mountains in a glance", "quoted": ["fa-tabadara l-tarf nabatuhu wa-stiwa'uhu wa-stihsaduhu wa-takwiruhu amthal al-jibal", "dunaka ya ibn adam fa-innahu la yushbi'uka shay'"]}
  - {"id": "h-8651.2-breath", "ref": "Jāmiʿ 67:8651.2", "unit": "hadith-67-praise-as-breath", "agent": "people of paradise", "action": "eat and drink without excreting", "outcome": "belch and musk-like sweat; praise inspired", "quoted": "yulhamuna l-tasbih wa-l-tahmid kama tulhamuna l-nafas"}
  - {"id": "h-8651.3-pleasure", "ref": "Jāmiʿ 67:8651.3", "unit": "hadith-67-praise-as-breath", "agent": "God", "action": "asks 'are you content?' and grants his pleasure", "recipient": "people of paradise", "quoted": "uhillu 'alaykum ridwani fa-la askhatu 'alaykum ba'dahu abadan"}
  # ---- Book 67: hell
  - {"id": "h-8653.1-interpreter", "ref": "Jāmiʿ 67:8653.1", "unit": "hadith-67-no-interpreter-half-a-date", "agent": "God", "action": "speaks to each without an interpreter", "outcome": "he sees only his deeds right and left and the fire before him", "instrument": "half a date", "quoted": ["laysa baynahu wa-baynahu turjuman", "fa-ttaqu l-nar wa-law bi-shiqq tamra"]}
