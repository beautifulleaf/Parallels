  - {"id": "h-8654.5-dregs", "ref": "Jāmiʿ 67:8654.5", "unit": "hadith-67-depth-of-hell", "agent": "'Utba b. Ghazwan", "action": "preaches the end of the world", "object": "stone dropped from hell's lip", "number": 70, "quoted": ["lam yabqa minha illa subaba ka-subabat al-ina'", "fa-yahwi fiha sab'ina 'aman la yudrik laha qa'ran"]}
