records:
- id: h-4963.1-heavens
  ref: Jāmiʿ 47:4963.1
  unit: hadith-47-prophets-in-the-heavens-sharik
  agent: the prophet
  action: meets prophets in the heavens
  place: [second heaven, fourth heaven, fifth heaven, sixth heaven, seventh heaven]
  name: [Idris, Harun, Ibrahim, Musa]
  quoted: wa-musa fi l-sabi'a bi-tafdil kalam allah
  outcome: the prophet of the fifth heaven is not remembered
- id: h-4963.2-purities
  ref: Jāmiʿ 47:4963.2
  unit: hadith-47-abraham-tested-with-purities
  agent: God
  action: tests Abraham with purity practices
  recipient: Abraham
  number: [5, 5]
  object: [toothstick, nose-rinsing, mouth-rinsing, trimming the moustache, parting the hair, paring nails, shaving pubic hair, circumcision, washing after stool and urine, plucking the armpit]
  quoted: 'ibtalahu llahu bi-l-tahara: khams fi l-ra''s wa-khams fi l-jasad'
- {id: h-4963.3-gathered, ref: 'Jāmiʿ 47:4963.3', unit: hadith-47-first-clothed-at-resurrection, agent: all people, action: are gathered at the resurrection, time: resurrection day, quoted: hufatan ʿuratan
    ghurlan, outcome: Abraham is the first clothed}
- id: h-4963.3-left
  ref: Jāmiʿ 47:4963.3
  unit: hadith-47-first-clothed-at-resurrection
  agent: the angels
  action: take men of the prophet's companions to the left
  recipient: the prophet
  quoted: [ashabi, lam yazalu murtaddin ʿala aʿqabihim mundhu faraqtahum]
  outcome: the prophet answers with Jesus' words (Q 5:117-118)
- id: h-4964.1-picture
  ref: Jāmiʿ 47:4964.1
  unit: hadith-47-abraham-pictured-in-kaba
  agent: the prophet
  action: finds pictures inside the Ka'ba
  place: the Ka'ba
  object: [picture of Abraham, picture of Mary]
  quoted: [al-mala'ika la tadkhulu baytan fihi sura, fa-ma lahu yastaqsim]
- id: h-4964.2-refuge
  ref: Jāmiʿ 47:4964.2
  unit: hadith-47-abrahams-protective-formula
  agent: Abraham
  action: recites a protective formula over his sons
  recipient: [Ishmael, Isaac]
  quoted: aʿudhu bi-kalimat allah al-tamma min kulli shaytan wa-hamma wa-min kulli ʿayn lamma
  outcome: the prophet uses it for Hasan and Husayn
- id: h-4965.1-meadow
  ref: Jāmiʿ 47:4965.1
  unit: hadith-47-tall-abraham-in-the-meadow
  agent: two visitors in a dream
  action: show the prophet a tall man in a meadow among children
  place: a dark-green meadow with every spring colour
  name: Ibrahim
  quoted: [rajul tawil la akadu ara ra'sahu, kull mawlud mata ʿala l-fitra]
  outcome: the children of polytheists are included
- {id: h-4965.2-palace, ref: 'Jāmiʿ 47:4965.2', unit: hadith-47-abrahams-palace, agent: God, action: prepares a palace in paradise, recipient: Abraham, object: palace of pearl without crack or weakness,
  quoted: aʿaddahu llahu li-khalilihi ibrahim nuzulan}
- {id: h-4967.1-girdle, ref: 'Jāmiʿ 47:4967.1', unit: hadith-47-hagar-ishmael-and-the-house, agent: Ishmael's mother, action: wears a girdle to hide her tracks, recipient: Sarah, object: girdle (mintaq),
  quoted: li-tuʿaffi atharaha ʿala sara}
- id: h-4967.1-left
  ref: Jāmiʿ 47:4967.1
  unit: hadith-47-hagar-ishmael-and-the-house
  agent: Abraham
  action: leaves mother and nursing child by the House
  place: [by a great tree above Zamzam, 'Mecca, with no people and no water']
  object: [bag of dates, skin of water]
  quoted: [a-llahu amaraka bi-hadha, idhan la yudayyiʿuna]
- {id: h-4967.1-prayer, ref: 'Jāmiʿ 47:4967.1', unit: hadith-47-hagar-ishmael-and-the-house, agent: Abraham, action: 'faces the House, raises his hands and prays', place: the pass (al-thaniyya) where they
    cannot see him, quoted: rabbana inni askantu min dhurriyyati bi-wadin ghayri dhi zarʿ}
- id: h-4967.1-run
  ref: Jāmiʿ 47:4967.1
  unit: hadith-47-hagar-ishmael-and-the-house
  agent: Ishmael's mother
  action: runs between two hills looking for anyone
  place: [al-Safa, al-Marwa]
  number: 7
  quoted: fa-dhalika saʿyu l-nas baynahuma
- id: h-4967.1-zamzam
  ref: Jāmiʿ 47:4967.1
  unit: hadith-47-hagar-ishmael-and-the-house
  agent: the angel
  action: digs with his heel (or wing) until water appears
  place: site of Zamzam
  quoted: [sah, qad asmaʿta in kana ʿindaka ghawath, law tarakat zamzam la-kanat ʿaynan maʿinan]
  outcome: she scoops it into her skin; it would have been a flowing spring
- {id: h-4967.1-angel, ref: 'Jāmiʿ 47:4967.1', unit: hadith-47-hagar-ishmael-and-the-house, agent: the angel, action: foretells the House, recipient: Ishmael's mother, quoted: ha huna bayt allah yabni hadha
    l-ghulam wa-abuhu}
- id: h-4967.1-bird
  ref: Jāmiʿ 47:4967.1
  unit: hadith-47-hagar-ishmael-and-the-house
  agent: a company of Jurhum
  action: see a circling bird and infer water
  place: [road of Kada', lower Mecca]
  instrument: a circling bird (ta'ir ʿa'if)
  outcome: they settle with no right in the water
  name: Jurhum
- {id: h-4967.1-threshold1, ref: 'Jāmiʿ 47:4967.1', unit: hadith-47-hagar-ishmael-and-the-house, agent: Abraham, action: tells Ishmael's complaining wife to have him change his threshold, recipient: Ishmael's
    first wife, quoted: yughayyir ʿatabat babihi, outcome: Ishmael divorces her}
- id: h-4967.1-threshold2
  ref: Jāmiʿ 47:4967.1
  unit: hadith-47-hagar-ishmael-and-the-house
  agent: Abraham
  action: blesses meat and water and tells the content wife to have him keep his threshold
  recipient: Ishmael's second wife
  object: [meat, water]
  quoted: [allahumma barik lahum fi l-lahm wa-l-ma', dhaka abi wa-anti l-ʿataba]
  outcome: no grain then, or he would have blessed it
- id: h-4967.1-build
  ref: Jāmiʿ 47:4967.1
  unit: hadith-47-hagar-ishmael-and-the-house
  agent: [Abraham, Ishmael]
  action: build the House on a raised mound
  instrument: this stone, on which Abraham stands
  quoted: rabbana taqabbal minna innaka anta l-samiʿ al-ʿalim
  place: near Zamzam, under a great tree
- {id: h-4969.1-arabic, ref: 'Jāmiʿ 47:4969.1', unit: hadith-47-ishmael-first-arabic, agent: God, action: opens Ishmael's tongue, recipient: Ishmael, quoted: awwalu man fataqa llahu lisanahu bi-l-ʿarabiyya
    al-mubina}
- {id: h-4971.1-archers, ref: 'Jāmiʿ 47:4971.1', unit: hadith-47-ishmael-the-archer, agent: the prophet, action: urges archers to shoot and joins both sides, recipient: men of Aslam, name: banu isma'il,
  quoted: irmu bani ismaʿil fa-inna abakum kana raamiyan}
- {id: h-4971.2-adra, ref: 'Jāmiʿ 47:4971.2', unit: hadith-47-ishmael-the-archer, agent: the prophet, action: 'joins one side, then all', recipient: Aslam, name: Ibn al-Adra', quoted: man kunta maʿahu ghalaba}
- id: h-4971.3-satan
  ref: Jāmiʿ 47:4971.3
  unit: hadith-47-the-sacrifice-and-the-pillars
  agent: Satan
  action: bars Abraham's way at the rites
  recipient: Abraham
  place: [the course (al-mas'a), Jamrat al-'Aqaba, middle pillar, farthest pillar, Mina]
  number: 7
  instrument: seven pebbles
  name: Jibril
  outcome: Abraham outruns and pelts him until he goes
- {id: h-4971.3-shirt, ref: 'Jāmiʿ 47:4971.3', unit: hadith-47-the-sacrifice-and-the-pillars, agent: Ishmael, action: asks his father to take off his white shirt to shroud him, recipient: Abraham, object: white
    shirt, quoted: laysa li thawb tukaffinuni fihi ghayruhu}
- id: h-4971.3-ram
  ref: Jāmiʿ 47:4971.3
  unit: hadith-47-the-sacrifice-and-the-pillars
  agent: Abraham
  action: is called from behind, turns and finds a ram
  object: white, horned, wide-eyed ram
  quoted: [fa-nudiya min khalfihi, kabsh abyad aqran aʿyan]
  outcome: 'Ibn Abbas: we used to sell this kind of ram'
- id: h-4973.1-noble
  ref: Jāmiʿ 47:4973.1
  unit: hadith-47-noblest-joseph
  agent: the prophet
  action: names Joseph by four generations
  name: [Yusuf, Ya'qub, Ishaq, Ibrahim]
  number: 4
  quoted: al-karim ibn al-karim ibn al-karim ibn al-karim
- id: h-4974.1-noblest
  ref: Jāmiʿ 47:4974.1
  unit: hadith-47-noblest-joseph
  agent: the prophet
  action: answers who is noblest
  quoted: [atqahum li-llah, yusuf nabiyy allah ibn nabiyy allah ibn nabiyy allah ibn khalil allah, al-nas maʿadin]
- id: h-4975.1-doubt
  ref: Jāmiʿ 47:4975.1
  unit: hadith-47-doubt-lot-and-joseph
  agent: the prophet
  action: compares himself with Abraham, Lot and Joseph
  name: [Ibrahim, Lut, Yusuf]
  quoted: [nahnu ahaqqu bi-l-shakk min ibrahim, ya'wi ila ruknin shadid, la-ajabtu l-daʿi]
- {id: h-4976.3-jacob, ref: 'Jāmiʿ 47:4976.3', unit: hadith-47-aisha-and-jacobs-patience, agent: Aisha, action: likens herself to Joseph's father, name: Abu Yusuf, quoted: fa-sabrun jamil, outcome: 'Q 24:11-20
    revealed'}
- id: h-4977.2-women
  ref: Jāmiʿ 47:4977.2
  unit: hadith-47-women-of-joseph-and-years-of-joseph
  agent: the dying prophet
  action: insists Abu Bakr lead the prayer
  recipient: [Aisha, his wives]
  name: Abu Bakr
  number: 3
  quoted: [innahu rajul raqiq, innakunna sawahib yusuf]
  outcome: Abu Bakr leads the prayer
- id: h-4978.3-years
  ref: Jāmiʿ 47:4978.3
  unit: hadith-47-women-of-joseph-and-years-of-joseph
  agent: the prophet
  action: prays for captive Muslims and against Mudar
  name: ['''Ayyash b. Abi Rabi''a', Salama b. Hisham, al-Walid b. al-Walid, Mudar]
  quoted: ijʿalha sinina ka-sini yusuf
- id: h-4978.4-third
  ref: Jāmiʿ 47:4978.4
  unit: hadith-47-joseph-in-third-heaven
  agent: the prophet
  action: meets Joseph
  place: third heaven
  name: [Jibril, Yusuf]
  quoted: marhaban bika min akhin wa-nabiyy
- {id: h-4979.1-beauty, ref: 'Jāmiʿ 47:4979.1', unit: hadith-47-joseph-in-third-heaven, agent: the prophet, action: sees Joseph on the night journey, name: Yusuf, quoted: qad uʿtiya shatr al-husn}
- id: h-4979.2-locusts
  ref: Jāmiʿ 47:4979.2
  unit: hadith-47-job-and-the-golden-locusts
  agent: God
  action: lets golden locusts fall on bathing Job
  recipient: Job
  object: locusts of gold
  quoted: [yaghtasilu ʿuryanan, la ghina li ʿan barakatika]
  outcome: Job scoops them into his garment
- id: h-4980.1-locusts
  ref: Jāmiʿ 47:4980.1
  unit: hadith-47-job-and-the-golden-locusts
  agent: God
  action: rains golden locusts on healed Job
  recipient: Job
  time: after his healing
  quoted: [a-ma tashbaʿ, wa-man yashbaʿu min rahmatika]
- {id: h-4981.2-jonah, ref: 'Jāmiʿ 47:4981.2', unit: hadith-47-not-better-than-jonah, agent: the prophet, action: forbids preferring oneself to Jonah, name: Yunus b. Matta, quoted: la yanbaghi li-ʿabd an
    yaqul ana khayrun min yunus ibn matta}
- id: h-4982.5-jonah
  ref: Jāmiʿ 47:4982.5
  unit: hadith-47-prophets-passing-in-pilgrimage
  agent: Jonah
  action: passes calling the talbiya
  place: [Wadi al-Azraq, pass of Harsha (or Lift)]
  instrument: [red she-camel, woollen jubba, halter of palm fibre]
  name: Yunus b. Matta
  quoted: ka'anni anzuru ila yunus ibn matta
- {id: h-4986.1-moses, ref: 'Jāmiʿ 47:4986.1', unit: hadith-47-prophets-passing-in-pilgrimage, agent: Moses, action: 'descends the pass calling the talbiya, fingers in his ears', place: Wadi al-Azraq, quoted: lahu
    ju'ar ila llah bi-l-talbiya}
- {id: h-4985.1-moses, ref: 'Jāmiʿ 47:4985.1', unit: hadith-47-prophets-passing-in-pilgrimage, agent: Moses, action: descends into the valley calling the talbiya, instrument: red camel with a palm-fibre
    halter, quoted: rajul adam jaʿd}
- {id: h-4984.1-moses, ref: 'Jāmiʿ 47:4984.1', unit: hadith-47-appearance-of-moses, agent: the prophet, action: describes Moses, name: Shanu'a, quoted: ka'annahu min rijal shanu'a}
- id: h-4985.2-zutt
  ref: Jāmiʿ 47:4985.2
  unit: hadith-47-appearance-of-moses
  agent: the prophet
  action: describes Jesus and Moses
  name: ['''Isa', Musa, al-Zutt]
  quoted: [fa-amma ʿisa fa-ahmar jaʿd ʿarid al-sadr, wa-amma musa fa-adam jasim sabt ka'annahu min rijal al-zutt]
- id: h-4986.3-stone
  ref: Jāmiʿ 47:4986.3
  unit: hadith-47-moses-stone-and-garment
  agent: a stone
  action: runs off with Moses' garment
  recipient: Moses
  object: garment
  quoted: [thawbi hajar, innahu adar]
  outcome: Israel sees him unblemished; he beats the stone
- id: h-4986.3-marks
  ref: Jāmiʿ 47:4986.3
  unit: hadith-47-moses-stone-and-garment
  agent: Moses
  action: beats the stone
  object: the stone
  number: [6, 7]
  quoted: innahu bi-l-hajar nadab sitta aw sabʿa
- id: h-4987.1-staff
  ref: Jāmiʿ 47:4987.1
  unit: hadith-47-moses-stone-and-garment
  agent: Moses
  action: chases the stone and beats it with his staff
  instrument: staff
  number: [3, 4, 5]
  quoted: [imma baras wa-imma udra wa-imma afa, ahsan ma khalaqa llah]
  outcome: Q 33:69
- {id: h-4989.1-term, ref: 'Jāmiʿ 47:4989.1', unit: hadith-47-moses-served-longer-term, agent: a Jew of al-Hira, action: asks which term Moses served, recipient: 'Sa''id b. Jubayr, then Ibn Abbas', name: hibr
    al-'arab, quoted: qada aktharahuma wa-atyabahuma}
- id: h-4990.2-ashura
  ref: Jāmiʿ 47:4990.2
  unit: hadith-47-ashura
  agent: the Jews of Medina
  action: fast a day
  time: '''Ashura'
  object: the day God saved Moses and drowned Pharaoh's people
  quoted: [fa-sama musa shukran li-llah, ana awla bi-musa minhum]
  outcome: the prophet fasts and commands it
- {id: h-4991.1-throne, ref: 'Jāmiʿ 47:4991.1', unit: hadith-47-moses-and-the-swoon, agent: Moses, action: holds a leg of the Throne, time: 'resurrection day, after the swoon', instrument: a leg (qa'ima)
    of the Throne, quoted: am juziya bi-saʿqat al-tur}
- id: h-4991.3-mountain
  ref: Jāmiʿ 47:4991.3
  unit: hadith-47-moses-and-the-swoon
  agent: the prophet
  action: shows with his thumb on a fingertip how much was manifested
  object: the mountain
  quoted: [fa-sakha l-jabal, wa-kharra musa saʿiqan]
- id: h-4991.4-hunayn
  ref: Jāmiʿ 47:4991.4
  unit: hadith-47-moses-hurt-and-patient
  agent: the prophet
  action: favours chiefs in dividing the booty
  time: day of Hunayn
  number: 100
  name: [al-Aqra' b. Habis, '''Uyayna']
  quoted: yarhamu llahu musa qad udhiya bi-akthara min hadha fa-sabar
- id: h-4992.1-lowest
  ref: Jāmiʿ 47:4992.1
  unit: hadith-47-what-moses-asked-his-lord
  agent: Moses
  action: asks the lowest and highest rank in paradise
  recipient: God
  number: [5, 10]
  quoted: [mithla mulki malikin min muluk al-dunya, gharastu karamatahum bi-yadi wa-khatamtu ʿalayha]
- id: h-4992.2-seven
  ref: Jāmiʿ 47:4992.2
  unit: hadith-47-what-moses-asked-his-lord
  agent: Moses
  action: asks God about his servants
  recipient: God
  number: 7
  quoted: [alladhi yadhkuru wa-la yansa, alladhi idha qadara ghafara, sahib manqus]
- {id: h-4994.1-slap, ref: 'Jāmiʿ 47:4994.1', unit: hadith-47-death-of-moses, agent: Moses, action: strikes the angel of death, recipient: the angel of death, quoted: arsaltani ila ʿabdin la yuridu l-mawt,
  outcome: 'offered a year per hair under his hand on an ox, he chooses death now'}
- id: h-4994.2-eye
  ref: Jāmiʿ 47:4994.2
  unit: hadith-47-death-of-moses
  agent: Moses
  action: slaps out the angel's eye
  recipient: the angel of death
  instrument: his hand
  quoted: [fa-faqa'aha, fa-radda llahu ilayhi ʿaynahu, ammitni min al-ard al-muqaddasa ramyatan bi-hajar]
  place: beside the road at the red sandhill
  outcome: God restores the eye
- {id: h-4995.1-grave, ref: 'Jāmiʿ 47:4995.1', unit: hadith-47-moses-praying-in-grave, agent: Moses, action: stands praying in his grave, place: the red sandhill, time: the night journey, quoted: wa-huwa
    qa'im yusalli fi qabrihi}
- {id: h-4995.2-weeps, ref: 'Jāmiʿ 47:4995.2', unit: hadith-47-moses-in-sixth-heaven, agent: Moses, action: weeps after the prophet passes, place: sixth heaven, quoted: hadha l-ghulam alladhi buʿitha baʿdi}
- id: h-4996.2-nations
  ref: Jāmiʿ 47:4996.2
  unit: hadith-47-the-communities-shown
  agent: God
  action: shows the prophet the communities
  recipient: the prophet
  number: 70000
  name: [Musa, '''Ukkasha b. Mihsan']
  quoted: [hadha musa wa-qawmuh, la yarquna wa-la yastarquna wa-la yatatayyarun, sabaqaka biha ʿukkasha]
- id: h-4998.1-fast
  ref: Jāmiʿ 47:4998.1
  unit: hadith-47-davids-fast
  agent: the prophet
  action: limits 'Abd Allah b. 'Amr's fasting
  recipient: '''Abd Allah b. ''Amr'
  number: [3, 5, 7, 9, 11]
  instrument: leather cushion stuffed with palm fibre
  quoted: la sawma fawqa sawm dawud shatr al-dahr sum yawman wa-aftir yawman
- {id: h-4999.1-saddle, ref: 'Jāmiʿ 47:4999.1', unit: hadith-47-davids-recitation-and-handiwork, agent: David, action: recites the scripture while his mounts are saddled, object: his mounts, quoted: fa-yaqra'u
    l-qur'an qabla an tusraja dawabbuhu}
- {id: h-5000.1-sad, ref: 'Jāmiʿ 47:5000.1', unit: hadith-47-prostration-of-sad, agent: David, action: prostrates, outcome: the prophet prostrates at Sura Sad, quoted: fa-bi-hudahumu qtadih}
- {id: h-5000.2-hand, ref: 'Jāmiʿ 47:5000.2', unit: hadith-47-davids-recitation-and-handiwork, agent: David, action: eats from his own work, quoted: kana ya'kulu min ʿamal yadihi}
- id: h-5001.1-torah
  ref: Jāmiʿ 47:5001.1
  unit: hadith-47-davids-plea-in-the-torah
  agent: Ka'b
  action: swears he finds David's plea in the Torah
  name: [Ka'b, Suhayb, Dawud]
  quoted: [bi-llah alladhi falaqa l-bahr li-musa, aʿudhu bika minka]
  time: on leaving prayer
- {id: h-5001.2-flute, ref: 'Jāmiʿ 47:5001.2', unit: hadith-47-flute-of-david, agent: the prophet, action: praises a reciter's voice, recipient: Abu Musa al-Ash'ari, instrument: flute (mizmar), quoted: mizmaran
    min mazamir al dawud}
- id: h-5001.3-years
  ref: Jāmiʿ 47:5001.3
  unit: hadith-47-adam-gives-david-forty-years
  agent: Adam
  action: gives forty years of his life to David
  recipient: David
  number: [60, 40]
  quoted: [wabisan min nur, zidhu min ʿumri arbaʿina sana, fa-jahada adam fa-jahadat dhurriyyatuhu]
  outcome: Adam denies it when the angel of death comes
- {id: h-5003.1-ifrit, ref: 'Jāmiʿ 47:5003.1', unit: hadith-47-solomons-prayer-binds-the-jinn, agent: the prophet, action: seizes a demon and refrains from tying it to a pillar, recipient: an 'ifrit of
    the jinn, instrument: a pillar of the mosque, quoted: fa-dhaʿattuhu, outcome: remembering Solomon's prayer he lets it go}
- id: h-5003.2-iblis
  ref: Jāmiʿ 47:5003.2
  unit: hadith-47-solomons-prayer-binds-the-jinn
  agent: Iblis
  action: comes with a firebrand to put in the prophet's face
  instrument: a firebrand (shihab) of fire
  number: 3
  quoted: [aʿudhu bi-llah minka, alʿanuka bi-laʿnat allah al-tamma, la-asbaha muwthaqan yalʿabu bihi wildan ahl al-madina]
- {id: h-5004.1-wives, ref: 'Jāmiʿ 47:5004.1', unit: hadith-47-solomons-oath-and-wives, agent: Solomon, action: swears to go round his wives in one night, number: 90, object: a horseman from each woman,
  quoted: fa-lam yaqul in sha'a llah, outcome: one bears half a man}
- {id: h-5004.2-wives, ref: 'Jāmiʿ 47:5004.2', unit: hadith-47-solomons-oath-and-wives, agent: Solomon, action: swears to go round his wives in one night, number: 70, outcome: one bears a child missing
    one side}
- {id: h-5004.3-wives, ref: 'Jāmiʿ 47:5004.3', unit: hadith-47-solomons-oath-and-wives, agent: Solomon, action: swears to go round his wives in one night, number: 100, object: a man who strikes with the
    sword from each, outcome: one bears half a child}
- id: h-5005.1-angel
  ref: Jāmiʿ 47:5005.1
  unit: hadith-47-solomons-oath-and-wives
  agent: the angel
  action: tells Solomon to say 'if God wills'
