  unit: hadith-48-the-first-muslims
  agent: '''Amr b. ''Abasa'
  action: comes to the hidden prophet at Mecca
  quoted: [arsalani bi-silat al-arham wa-kasr al-awthan, hurrun wa-ʿabd]
  name: [Abu Bakr, Bilal]
  outcome: told to return home until he hears the prophet has prevailed
- id: h-5079.1-sun
  ref: Jāmiʿ 48:5079.1
  unit: hadith-48-the-sun-in-my-hand
  agent: the prophet
  action: refuses to stop, pointing to the sun
  recipient: [Quraysh, Abu Talib]
  name: '''Aqil'
  quoted: an tastashʿilu li minha shuʿla
- {id: h-5080.2-moon, ref: 'Jāmiʿ 48:5080.2', unit: hadith-48-signs-demanded, agent: the moon, action: splits in two, time: with the prophet (at Mina), number: 2, quoted: ishhadu ishhadu}
- id: h-5081.1-safa
  ref: Jāmiʿ 48:5081.1
  unit: hadith-48-signs-demanded
  agent: people of Mecca
  action: ask that al-Safa become gold and the mountains be moved
  object: [al-Safa, the mountains]
  quoted: la bal asta'ni bihim
  outcome: Q 17:59
- id: h-5082.1-sala
  ref: Jāmiʿ 48:5082.1
  unit: hadith-48-placenta-and-the-curse
  agent: the most wretched of them
  action: lays a camel's afterbirth on the prophet's back as he prostrates
  place: by the House
  name: [Abu Jahl, '''Utba b. Rabi''a', Shayba b. Rabi'a, al-Walid b. 'Utba, Umayya b. Khalaf, '''Uqba b. Abi Mu''ayt']
  number: [3, 7]
  quoted: allahumma ʿalayka bi-quraysh
  outcome: those named lie dead in the well of Badr
