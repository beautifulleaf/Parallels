records:
  - {id: h-5563.1-best, ref: 'Jāmiʿ 48:5563.1', unit: hadith-48-tabuk-sermon, agent: the prophet, action: names the best of people, object: [horseman in God's path, herdsman who hosts guests], place: Tabuk, number: 3, quoted: 'aqalaha? qalaha'}
  - {id: h-5563.2-feint, ref: 'Jāmiʿ 48:5563.2', unit: hadith-48-kab-and-the-three-left-behind, agent: the prophet, action: 'announces the raid''s true destination, unlike other raids', time: 'in great heat, when fruit and shade were ripe', quoted: la yuridu ghazwatan illa warra bi-ghayriha}
  - {id: h-5563.2-mounts, ref: 'Jāmiʿ 48:5563.2', unit: hadith-48-kab-and-the-three-left-behind, agent: Ka'b b. Malik, action: stays behind though richer than ever, object: two riding camels, number: 2, quoted: ma jtama'at 'indi qablahu rahilatani qattu}
  - {id: h-5563.2-excuses, ref: 'Jāmiʿ 48:5563.2', unit: hadith-48-kab-and-the-three-left-behind, agent: the men who stayed behind, action: swear excuses and are accepted, recipient: the prophet, number: eighty-odd, outcome: he accepts their outward word and leaves their secrets to God, quoted: bid'atan wa-thamanina rajulan}
  - {id: h-5563.2-truth, ref: 'Jāmiʿ 48:5563.2', unit: hadith-48-kab-and-the-three-left-behind, agent: Ka'b b. Malik, action: tells the truth that he had no excuse, recipient: the prophet, outcome: told to wait for God's decision, quoted: [tabassama tabassuma al-mughdab, amma hadha fa-qad sadaq]}
  - {id: h-5563.2-boycott, ref: 'Jāmiʿ 48:5563.2', unit: hadith-48-kab-and-the-three-left-behind, agent: the prophet, action: forbids the Muslims to speak to the three, object: [Ka'b b. Malik, Murara b. al-Rabi', Hilal b. Umayya], number: [3, 50], time: fifty nights, quoted: hatta tanakkarat fi nafsi al-ard}
  - {id: h-5563.2-wall, ref: 'Jāmiʿ 48:5563.2', unit: hadith-48-kab-and-the-three-left-behind, agent: Ka'b b. Malik, action: climbs the garden wall and greets his cousin three times, recipient: Abu Qatada, outcome: no greeting returned; 'God and his messenger know best', quoted: tasawwartu jidara ha'iti abi qatada}
  - {id: h-5563.2-oven, ref: 'Jāmiʿ 48:5563.2', unit: hadith-48-kab-and-the-three-left-behind, agent: a Nabataean grain trader, action: delivers a letter inviting him over, object: letter of the king of Ghassan, recipient: Ka'b b. Malik, outcome: burned in the oven, quoted: [fa-l-haq bina nuwasika, fa-tayammamtu biha al-tannur fa-sajartuhu biha]}
  - {id: h-5563.2-wife, ref: 'Jāmiʿ 48:5563.2', unit: hadith-48-kab-and-the-three-left-behind, agent: the prophet, action: orders the three to keep from their wives, time: the fortieth of the fifty nights, number: [40, 50], name: wife of Hilal b. Umayya, outcome: Hilal's wife may serve him but not be approached, quoted: i'tazilha wa-la taqrabha}
  - {id: h-5563.2-crier, ref: 'Jāmiʿ 48:5563.2', unit: hadith-48-kab-and-the-three-left-behind, agent: a crier, action: shouts the good news of forgiveness, place: Mount Sal', time: after the dawn prayer of the fiftieth night, recipient: Ka'b b. Malik, outcome: Ka'b falls prostrate, quoted: [ya ka'b ibn malik abshir, kana al-sawtu asra'a min al-faras]}
  - {id: h-5563.2-garments, ref: 'Jāmiʿ 48:5563.2', unit: hadith-48-kab-and-the-three-left-behind, agent: Ka'b b. Malik, action: gives his two garments to the bearer of good news, object: two garments, number: 2, outcome: borrows two to wear, quoted: naza'tu lahu thawbayya}
  - {id: h-5563.2-moon, ref: 'Jāmiʿ 48:5563.2', unit: hadith-48-kab-and-the-three-left-behind, agent: the prophet, action: face shines with joy, quoted: ka-annahu qit'atu qamar}
  - {id: h-5563.2-wealth, ref: 'Jāmiʿ 48:5563.2', unit: hadith-48-kab-and-the-three-left-behind, agent: Ka'b b. Malik, action: offers all his property as alms, outcome: keeps his share at Khaybar, place: Khaybar, quoted: amsik 'alayka ba'da malik}
  - {id: h-5567.1-twenty, ref: 'Jāmiʿ 48:5567.1', unit: hadith-48-return-from-tabuk, agent: the prophet, action: shortens the prayer, place: Tabuk, time: twenty days, number: 20}
  - {id: h-5568.1-uhud, ref: 'Jāmiʿ 48:5568.1', unit: hadith-48-return-from-tabuk, agent: the prophet, action: names the city and the mountain on return, object: [Taba, Uhud], quoted: hadha uhudun jabalun yuhibbuna wa-nuhibbuhu}
  - {id: h-5568.2-excused, ref: 'Jāmiʿ 48:5568.2', unit: hadith-48-return-from-tabuk, agent: the prophet, action: counts the excused as present on the march, recipient: men held back in Medina, quoted: habasahum al-'udhr}
  - {id: h-5568.3-boys, ref: 'Jāmiʿ 48:5568.3', unit: hadith-48-return-from-tabuk, agent: the boys of Medina, action: go out to meet the returning prophet, place: Thaniyyat al-Wada', name: al-Sa'ib b. Yazid}
  - {id: h-5569.1-napkins, ref: 'Jāmiʿ 48:5569.1', unit: hadith-48-ukaydir-gifts, agent: the prophet, action: compares a gift of silk with paradise, object: silk robe, name: Sa'd b. Mu'adh, quoted: la-manadilu sa'd ibn mu'adh fi l-janna khayrun minha}
  - {id: h-5570.1-coat, ref: 'Jāmiʿ 48:5570.1', unit: hadith-48-ukaydir-gifts, agent: Ukaydir of Dumat al-Jandal, action: offers a gold-woven coat, object: qaba' woven with gold of the kind Chosroes gave, recipient: the prophet, outcome: 'refused, then sent to Umar to sell', quoted: laysa ahadun yalbasu hadha fi l-dunya illa hurimahu fi l-akhira}
  - {id: h-5570.1-laugh, ref: 'Jāmiʿ 48:5570.1', unit: hadith-48-ukaydir-gifts, agent: the prophet, action: laughs with his hand over his mouth, recipient: Umar, quoted: ma ba'athtu ilayka li-talbasahu}
  - {id: h-5571.1-proclaim, ref: 'Jāmiʿ 48:5571.1', unit: hadith-48-abu-bakr-pilgrimage-proclamation, agent: Abu Hurayra and the heralds, action: proclaim at Mina, time: 'day of sacrifice, the year before the farewell pilgrimage', object: [no polytheist pilgrim, no naked circumambulation], name: Abu Bakr, quoted: la yahujju ba'da l-'ami mushrik wa-la yatufu bi-l-bayti 'uryan}
  - {id: h-5574.1-judge, ref: 'Jāmiʿ 48:5574.1', unit: hadith-48-ali-in-yemen, agent: the prophet, action: sends a young judge, recipient: Ali, place: Yemen, quoted: sa-yuthabbitu lisanaka wa-yahdi qalbaka}
  - {id: h-5575.1-slavegirl, ref: 'Jāmiʿ 48:5575.1', unit: hadith-48-ali-in-yemen, agent: Ali, action: takes a slave-girl from the fifth, object: wasifa, outcome: comes out with head dripping from the bath, quoted: [fa-sarat fi l-khumus, ra'suhu yaqtur]}
  - {id: h-5576.1-nugget, ref: 'Jāmiʿ 48:5576.1', unit: hadith-48-gold-nugget-and-the-objector, agent: the prophet, action: divides a gold nugget in its ore, object: dhuhayba fi turbatiha, recipient: [al-Aqra' b. Habis, '''Uyayna b. Badr', '''Alqama b. ''Ulatha', Zayd al-Khayr], number: 4, outcome: Quraysh angered}
  - {id: h-5576.1-objector, ref: 'Jāmiʿ 48:5576.1', unit: hadith-48-gold-nugget-and-the-objector, agent: a man with shaven head, action: tells the prophet to fear God, quoted: [ittaqi llaha ya muhammad, yamruquna min al-islam kama yamruqu al-sahmu min al-ramiyya, la-aqtulannahum qatla 'ad], outcome: his stock will recite Quran not passing their throats}
  - {id: h-5577.1-aqqaba, ref: 'Jāmiʿ 48:5577.1', unit: hadith-48-khalid-and-ali-yemen-troops, agent: Ali, action: lets Khalid's men stay or go home, place: Yemen, name: al-Bara', outcome: al-Bara' stays and gains many ounces, quoted: man sha'a an yu'aqqiba ma'aka}
  - {id: h-5577.2-easy, ref: 'Jāmiʿ 48:5577.2', unit: hadith-48-abu-musa-and-muadh-in-yemen, agent: the prophet, action: instructs two governors, recipient: [Abu Musa, Mu'adh], place: Yemen, quoted: yassira wa-la tu'assira wa-bashshira wa-la tunaffira wa-tatawa'a}
  - {id: h-5578.3-mizr, ref: 'Jāmiʿ 48:5578.3', unit: hadith-48-abu-musa-and-muadh-in-yemen, agent: Abu Musa, action: asks about local drinks, object: [mizr from barley, bit' from honey], outcome: every intoxicant forbidden, quoted: kullu muskirin haram}
  - {id: h-5578.1-apostate, ref: 'Jāmiʿ 48:5578.1', unit: hadith-48-abu-musa-and-muadh-in-yemen, agent: Mu'adh, action: refuses to dismount until an apostate is killed, object: a Jew who accepted Islam and apostatized, place: Yemen, quoted: la anzilu hatta yuqtal}
  - {id: h-5578.1-sleep, ref: 'Jāmiʿ 48:5578.1', unit: hadith-48-abu-musa-and-muadh-in-yemen, agent: Mu'adh, action: counts his sleep as worship, quoted: ahtasibu nawmati kama ahtasibu qawmati}
  - {id: h-5579.1-steps, ref: 'Jāmiʿ 48:5579.1', unit: hadith-48-muadh-sent-to-people-of-book, agent: the prophet, action: orders the mission in steps, recipient: Mu'adh, object: [two testimonies, five daily prayers, alms from the rich to the poor], number: 5, quoted: [iyyaka wa-kara'ima amwalihim, laysa baynahu wa-bayna llahi hijab]}
  - {id: h-5579.2-walks, ref: 'Jāmiʿ 48:5579.2', unit: hadith-48-muadh-sent-to-people-of-book, agent: the prophet, action: walks beneath the departing envoy's mount, recipient: Mu'adh, outcome: Mu'adh weeps; 'weeping is from Satan', quoted: la'allaka an tamurra bi-masjidi hadha wa-qabri}
  - {id: h-5579.3-khalasa, ref: 'Jāmiʿ 48:5579.3', unit: hadith-48-dhul-khalasa-destroyed, agent: Jarir b. 'Abd Allah, action: burns and breaks an idol-house, object: 'Dhu l-Khalasa, called the Ka''ba', place: Yemen, number: 150, name: [Khath'am, Bajila, Ahmas], quoted: [al-ka'ba al-yamaniyya, ka-annaha jamalun ajrab]}
  - {id: h-5579.3-chest, ref: 'Jāmiʿ 48:5579.3', unit: hadith-48-dhul-khalasa-destroyed, agent: the prophet, action: strikes his hand on a rider's chest, recipient: Jarir, outcome: never falls from a horse again, quoted: hatta ra'aytu athara yadihi fi sadri}
  - {id: h-5579.3-azlam, ref: 'Jāmiʿ 48:5579.3', unit: hadith-48-dhul-khalasa-destroyed, agent: Jarir, action: makes a diviner break his arrows, object: divining arrows (azlam), outcome: the man breaks them and testifies}
  - {id: h-5579.3-five, ref: 'Jāmiʿ 48:5579.3', unit: hadith-48-dhul-khalasa-destroyed, agent: the prophet, action: blesses horses and men, recipient: Ahmas, number: 5}
  - {id: h-5581.2-feast, ref: 'Jāmiʿ 48:5581.2', unit: hadith-48-farewell-pilgrimage, agent: Jews, action: say they would make the day of the verse a feast, object: 'Q 5:3', recipient: Umar, place: Arafa, outcome: Umar names the place of revelation, quoted: la-ttakhadhna dhalika al-yawma 'idan}
  - {id: h-5581.3-raids, ref: 'Jāmiʿ 48:5581.3', unit: hadith-48-farewell-pilgrimage, agent: the prophet, action: raids and makes pilgrimage, number: [19, 1], quoted: hajja ba'da ma hajara hajjatan wahida}
  - {id: h-5582.1-mats, ref: 'Jāmiʿ 48:5582.1', unit: hadith-48-farewell-pilgrimage, agent: the prophet, action: tells his wives to stay home after this pilgrimage, recipient: his wives, quoted: innama hadhihi l-hajja thumma zuhur al-husr}
  - {id: h-5582.2-arafa, ref: 'Jāmiʿ 48:5582.2', unit: hadith-48-arafa-and-sacrifice-day-sermons, agent: the prophet, action: preaches from his camel's place in the valley, place: [Namira, Batn al-Wadi, Arafa], name: al-Qaswa', object: [Jahiliyya blood-claims, usury of 'Abbas], quoted: [tahta qadamayya mawdu', darban ghayra mubarrih]}
  - {id: h-5582.2-finger, ref: 'Jāmiʿ 48:5582.2', unit: hadith-48-arafa-and-sacrifice-day-sermons, agent: the prophet, action: raises his forefinger to the sky and points it at the people, instrument: forefinger, number: 3, quoted: allahumma shhad}
  - {id: h-5583.1-months, ref: 'Jāmiʿ 48:5583.1', unit: hadith-48-arafa-and-sacrifice-day-sermons, agent: the prophet, action: declares the year of twelve months, number: [12, 4, 3], name: [Dhu l-Qa'da, Dhu l-Hijja, al-Muharram, Rajab of Mudar], time: day of sacrifice, quoted: al-zaman qad istadara ka-hay'atihi}
  - {id: h-5583.2-kaaba, ref: 'Jāmiʿ 48:5583.2', unit: hadith-48-stay-in-mecca, agent: the prophet, action: does not approach the Ka'ba after arrival until Arafa, place: Mecca}
  - {id: h-5583.3-ten, ref: 'Jāmiʿ 48:5583.3', unit: hadith-48-stay-in-mecca, agent: the prophet, action: prays two units two units, place: Mecca, time: ten days, number: 10}
  - {id: h-5584.1-khumm, ref: 'Jāmiʿ 48:5584.1', unit: hadith-48-khumm-sermon, agent: the prophet, action: leaves two weighty things, place: pool of Khumm between Mecca and Medina, object: [God's book, his household], number: [2, 3], quoted: [thaqalayn, udhakkirukum allaha fi ahli bayti]}
  - {id: h-5584.1-household, ref: 'Jāmiʿ 48:5584.1', unit: hadith-48-khumm-sermon, agent: Zayd b. Arqam, action: defines the household, object: [family of Ali, family of 'Aqil, family of Ja'far, family of 'Abbas], quoted: man hurima al-sadaqa ba'dahu}
  - {id: h-5585.1-usama, ref: 'Jāmiʿ 48:5585.1', unit: hadith-48-usama-command, agent: the prophet, action: defends a young commander, recipient: Usama b. Zayd, quoted: fa-qad ta'antum fi imarati abihi}
  - {id: h-5586.2-tomorrow, ref: 'Jāmiʿ 48:5586.2', unit: hadith-48-last-illness-in-aishas-house, agent: the prophet, action: asks where he will be tomorrow, outcome: nursed and dies in Aisha's house, quoted: ayna ana ghadan}
  - {id: h-5586.2-siwak, ref: 'Jāmiʿ 48:5586.2', unit: hadith-48-last-illness-in-aishas-house, agent: Aisha, action: chews and softens a toothstick for him, object: siwak of 'Abd al-Rahman b. Abi Bakr, recipient: the prophet, outcome: their saliva mixes, quoted: bayna nahri wa-sahri}
  - {id: h-5586.3-skins, ref: 'Jāmiʿ 48:5586.3', unit: hadith-48-last-illness-in-aishas-house, agent: the wives, action: pour water over him, object: seven waterskins with untied mouths, instrument: Hafsa's tub (mikhdab), number: 7, quoted: lam tuhlal awkiyatuhunna}
  - {id: h-5587.1-ladd, ref: 'Jāmiʿ 48:5587.1', unit: hadith-48-forced-medicine, agent: the women of the house, action: dose him by force, recipient: the prophet, outcome: all present dosed except al-'Abbas, quoted: la yabqa ahadun minkum illa ludda}
  - {id: h-5587.2-pleurisy, ref: 'Jāmiʿ 48:5587.2', unit: hadith-48-forced-medicine, agent: the prophet, action: denies he has pleurisy, object: dhat al-janb, place: house of Maymuna, outcome: Maymuna dosed though fasting, quoted: ma kana llahu li-yaqdhifani bihi}
  - {id: h-5587.3-stick, ref: 'Jāmiʿ 48:5587.3', unit: hadith-48-abbas-and-ali-at-the-end, agent: al-'Abbas, action: foresees the prophet's death and urges asking who will rule, recipient: Ali, number: 3, outcome: Ali refuses, quoted: anta wa-llahi ba'da thalathin 'abdu l-'asa}
  - {id: h-5588.1-thursday, ref: 'Jāmiʿ 48:5588.1', unit: hadith-48-thursday-writing, agent: the prophet, action: asks for writing material, time: Thursday, outcome: 'they dispute; three bequests, the third forgotten', number: 3, quoted: [ahajara, akhriju al-mushrikina min jazirati al-'arab]}
  - {id: h-5588.2-hasbuna, ref: 'Jāmiʿ 48:5588.2', unit: hadith-48-thursday-writing, agent: Umar, action: says God's book suffices, outcome: the prophet dismisses them, quoted: [hasbuna kitabu llah, qumu, al-raziyya kullu al-raziyya]}
  - {id: h-5589.1-leaves, ref: 'Jāmiʿ 48:5589.1', unit: hadith-48-fever-and-protective-suras, agent: God, action: sheds a sufferer's sins, recipient: a Muslim struck by harm, instrument: illness, quoted: kama tuhattu waraqu al-shajar, number: 2}
  - {id: h-5589.3-nafth, ref: 'Jāmiʿ 48:5589.3', unit: hadith-48-fever-and-protective-suras, agent: Aisha, action: breathes the protective suras over him, instrument: his own hand, name: al-mu'awwidhat}
  - {id: h-5590.1-mursalat, ref: 'Jāmiʿ 48:5590.1', unit: hadith-48-last-prayers-and-abu-bakr, agent: the prophet, action: recites al-Mursalat, time: sunset prayer, outcome: never led them in prayer again}
  - {id: h-5590.2-tub, ref: 'Jāmiʿ 48:5590.2', unit: hadith-48-last-prayers-and-abu-bakr, agent: the prophet, action: washes in a tub and faints, number: 3, time: night prayer, outcome: sends Abu Bakr to lead; later sits beside him, quoted: a-salla al-nas}
  - {id: h-5591.1-joseph, ref: 'Jāmiʿ 48:5591.1', unit: hadith-48-last-prayers-and-abu-bakr, agent: the prophet, action: rebukes the wives, recipient: [Aisha, Hafsa], name: Yusuf, quoted: innakunna la-antunna sawahibu yusuf}
  - {id: h-5592.2-curtain, ref: 'Jāmiʿ 48:5592.2', unit: hadith-48-monday-curtain, agent: the prophet, action: lifts the curtain and smiles at the praying rows, time: Monday, outcome: dies that day, quoted: ka-anna wajhahu waraqatu mushaf}
  - {id: h-5593.1-graves, ref: 'Jāmiʿ 48:5593.1', unit: hadith-48-last-bequests, agent: the prophet, action: last words, object: [Jews of the Hijaz, people of Najran], quoted: shirar al-nas alladhina ttakhadhu qubura anbiya'ihim masajid, name: Abu 'Ubayda}
  - {id: h-5593.2-grave, ref: 'Jāmiʿ 48:5593.2', unit: hadith-48-last-bequests, agent: the prophet, action: curses Jews and Christians, outcome: his grave not left in the open, quoted: fa-lawla dhaka la-ubriza qabruhu}
  - {id: h-5594.1-ansar, ref: 'Jāmiʿ 48:5594.1', unit: hadith-48-last-bequests, agent: the prophet, action: climbs the pulpit for the last time with head bound, recipient: the Ansar, instrument: edge of a cloak, quoted: karishi wa-'aybati}
  - {id: h-5594.2-dreams, ref: 'Jāmiʿ 48:5594.2', unit: hadith-48-last-bequests, agent: the prophet, action: 'lifts the curtain, head bound', number: 3, quoted: lam yabqa min mubashshirat al-nubuwwa illa al-ru'ya}
  - {id: h-5595.1-lastwords, ref: 'Jāmiʿ 48:5595.1', unit: hadith-48-last-words-prayer, agent: the prophet, action: last words, quoted: al-salata al-salata ittaqu llaha fima malakat aymanukum}
  - {id: h-5596.1-basin, ref: 'Jāmiʿ 48:5596.1', unit: hadith-48-no-bequest, agent: the prophet, action: calls for a basin and slumps in Aisha's lap, object: tast, recipient: Aisha, quoted: la-qad inkhanatha fi hijri}
  - {id: h-5596.3-hoarse, ref: 'Jāmiʿ 48:5596.3', unit: hadith-48-choice-and-highest-companion, agent: the prophet, action: 'recites Q 4:69 hoarsely', quoted: wa-akhadhathu bahha, outcome: Aisha understands he was given the choice}
  - {id: h-5597.1-ceiling, ref: 'Jāmiʿ 48:5597.1', unit: hadith-48-choice-and-highest-companion, agent: the prophet, action: fixes his gaze on the ceiling, place: Aisha's thigh, quoted: allahumma al-rafiq al-a'la, outcome: last word}
  - {id: h-5597.2-khawkha, ref: 'Jāmiʿ 48:5597.2', unit: hadith-48-choice-and-highest-companion, agent: the prophet, action: orders every small door closed but one, object: Abu Bakr's door, place: the mosque, quoted: la yabqayanna fi l-masjidi khawkha}
  - {id: h-5597.3-hawd, ref: 'Jāmiʿ 48:5597.3', unit: hadith-48-choice-and-highest-companion, agent: the prophet, action: sees the Basin from the pulpit, place: the pulpit, instrument: cloth bound on head, quoted: inni la-anzuru ila l-hawd}
  - {id: h-5598.2-sakarat, ref: 'Jāmiʿ 48:5598.2', unit: hadith-48-choice-and-highest-companion, agent: the prophet, action: wipes his face with water, instrument: a water vessel (rakwa), quoted: [inna li-l-mawti sakarat, fi l-rafiq al-a'la], outcome: his hand falls}
  - {id: h-5600.1-nasr, ref: 'Jāmiʿ 48:5600.1', unit: hadith-48-nasr-and-fatima, agent: Ibn 'Abbas, action: reads Surat al-Nasr as the prophet's term, recipient: [Umar, the elders of Badr], quoted: huwa ajalu rasuli llah}
  - {id: h-5600.3-whisper, ref: 'Jāmiʿ 48:5600.3', unit: hadith-48-nasr-and-fatima, agent: the prophet, action: whispers to his daughter twice, recipient: Fatima, outcome: 'she weeps, then laughs', quoted: awwalu ahlihi yatba'uhu}
  - {id: h-5601.2-darkness, ref: 'Jāmiʿ 48:5601.2', unit: hadith-48-after-the-death, agent: Medina, action: shines on his arrival and darkens on his death, place: Medina, quoted: [ada'a minha kullu shay', azlama minha kullu shay']}
  - {id: h-5601.3-yemeni, ref: 'Jāmiʿ 48:5601.3', unit: hadith-48-after-the-death, agent: Dhu 'Amr, action: tells the envoy the prophet died three days ago, recipient: Jarir, place: Yemen, number: 3, quoted: fa-idha kanat bi-l-sayfi kanu mulukan}
  - {id: h-5602.1-qadr, ref: 'Jāmiʿ 48:5602.1', unit: hadith-48-after-the-death, agent: al-Sunabihi, action: arrives as emigrant five days after the burial, place: al-Juhfa, number: [5, 7, 10], name: Bilal, quoted: fi l-sab' fi l-'ashr al-awakhir}
  - {id: h-5602.4-age, ref: 'Jāmiʿ 48:5602.4', unit: hadith-48-place-and-age-at-death, agent: the prophet, action: dies, number: 63, quoted: ibnu thalathin wa-sittin}
