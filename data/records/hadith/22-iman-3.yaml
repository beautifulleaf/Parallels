# Observation records, hadith chunk 22 (al-Jāmiʿ al-Kāmil book 2, kitāb al-īmān: God's attributes, the vision, the throne, the angels; pp. 318-437).
records:
- id: h-318.1-laughing
  ref: Jāmiʿ 2:318.1
  unit: hadith-2-lord-laughs-at-the-gathering
  agent: the Lord
  action: comes to the waiting community and discloses himself
  time: day of resurrection
  quoted: fa-yatajallā lahum yaḍḥaku
  outcome: discloses himself laughing
- id: h-318.2-clouds
  ref: Jāmiʿ 2:318.2
  unit: hadith-2-clouds-speak-and-laugh
  agent: God
  action: brings forth clouds
  object: clouds
  outcome: they speak the finest speech and laugh the finest laughter
  quoted: yunshiʾu l-saḥāba fa-yanṭiqu aḥsana l-manṭiqi wa-yaḍḥaku aḥsana l-ḍaḥiki
- id: h-319.1-martyrs
  ref: Jāmiʿ 2:319.1
  unit: hadith-2-lord-laughs-to-martyrs
  agent: the Lord
  action: laughs to the martyrs
  recipient: martyrs who do not turn their faces in the rank
  place: the upper rooms of paradise (al-ghuraf al-ʿulā)
  quoted: idhā ḍaḥika rabbuka ilā ʿabdin fī l-dunyā fa-lā ḥisāba ʿalayhi
  outcome: no reckoning
- id: h-320.1-despair
  ref: Jāmiʿ 2:320.1
  unit: hadith-2-lord-laughs-at-despair
  agent: our Lord
  action: laughs
  object: his servants' despair and the nearness of change
  name: Abū Razīn
  quoted: ḍaḥika rabbunā min qunūṭi ʿibādihi wa-qurbi ghiyarihi; lan naʿdama min rabbin yaḍḥaku khayran
- id: h-320.2-pillion
  ref: Jāmiʿ 2:320.2
  unit: hadith-2-laughter-down-the-chain
  agent: the Prophet (then Ali)
  action: takes a companion pillion, recites, asks forgiveness and laughs
  place:
  - the harra of Medina
  - outskirts of Kufa
  quoted: lā ilāha illā anta subḥānaka innī kuntu mina l-ẓālimīna fa-ghfir lī
  outcome: the Lord laughs and marvels that his servant knows none but he forgives sins
- id: h-322.2-lamp
  ref: Jāmiʿ 2:322.2
  unit: hadith-2-god-marvels
  agent: an Ansari and his wife
  action: put the children to sleep and put out the lamp
  recipient: the Prophet's guest
  object: the children's food
  quoted: nawwimīhim wa-taʿālay fa-aṭfiʾī l-sirāj
  outcome: God marvels or laughs; Q 59:9 sent down
- id: h-322.3-shepherd
  ref: Jāmiʿ 2:322.3
  unit: hadith-2-god-marvels
  agent: a shepherd
  action: gives the call to prayer and prays
  place: a crag of a mountain (raʾs shaẓiyya)
  quoted: unẓurū ilā ʿabdī hādhā yuʾadhdhinu wa-yuqīmu
  outcome: forgiven and brought into paradise
- id: h-323.1-returns
  ref: Jāmiʿ 2:323.1
  unit: hadith-2-god-marvels
  agent: a fighter
  action: flees then returns to battle
  quoted: rajaʿa raghbatan fīmā ʿindī wa-shafaqatan mimmā ʿindī
  outcome: his blood is shed; God shows him to the angels
- id: h-324.1-mountain
  ref: Jāmiʿ 2:324.1
  unit: hadith-2-god-rejoices-at-repentance
  agent: the believer
  action: sees his sins
  instrument: as a mountain about to fall on him
  quoted: ka-annahu qāʿidun taḥta jabalin; ka-dhubābin marra ʿalā anfihi
- id: h-324.1-sleep
  ref: Jāmiʿ 2:324.1
  unit: hadith-2-god-rejoices-at-repentance
  agent: a traveller
  action: sleeps at a deadly halt, wakes to find his mount gone, goes back to his place to sleep
  object: mount with food and drink
  outcome: wakes again and the mount is beside him
- id: h-325.2-misspeaks
  ref: Jāmiʿ 2:325.2
  unit: hadith-2-god-rejoices-at-repentance
  agent: a man in the desert
  action: finds his mount and takes its halter
  place: shade of a tree
  quoted: allāhumma anta ʿabdī wa-anā rabbuka
  outcome: misspeaks from joy
- id: h-325.4-east
  ref: Jāmiʿ 2:325.4
  unit: hadith-2-god-rejoices-at-repentance
  agent: a traveller
  action: runs east looking for his camel
  number: 3
  quoted: saʿā sharqan thālithan
  outcome: the camel comes and puts its halter in his hand
  name: al-Nuʿmān b. Bashīr (preaching)
- id: h-326.1-stump
  ref: Jāmiʿ 2:326.1
  unit: hadith-2-god-rejoices-at-repentance
  agent: a man
  action: searches for his runaway mount
  place: a barren land (arḍ qafr)
  outcome: its halter caught on a tree stump
  quoted: marrat bi-jidhli shajaratin fa-taʿallaqa zimāmuhā
- id: h-326.2-three
  ref: Jāmiʿ 2:326.2
  unit: hadith-2-god-is-shy
  agent: three men
  action: come to the Prophet's circle in the mosque
  number: 3
  outcome: one sits in a gap, one behind, one leaves
  quoted: awā ilā llāhi fa-āwāhu llāh; istaḥyā fa-staḥyā llāhu minhu; aʿraḍa fa-aʿraḍa llāhu ʿanhu
- id: h-326.3-hands
  ref: Jāmiʿ 2:326.3
  unit: hadith-2-god-is-shy
  agent: God
  action: is ashamed to return empty
  object: the servant's raised hands
  quoted: ḥayiyyun karīm yastaḥyī ... an yaruddahumā ṣifran
- id: h-329.5-sword
  ref: Jāmiʿ 2:329.5
  unit: hadith-2-god-is-jealous
  agent: Saʿd b. ʿUbāda
  action: would strike a man found with his wife
  instrument: the sword's edge, not its flat
  quoted: la-ḍarabtuhu bi-l-sayfi ghayra muṣfaḥ
  outcome: '''God is more jealous than I'''
- id: h-330.1-zina
  ref: Jāmiʿ 2:330.1
  unit: hadith-2-god-is-jealous
  agent: God
  action: is jealous
  object: his male or female slave committing zina
  quoted: yā ummata Muḥammad ... la-ḍaḥiktum qalīlan wa-la-bakaytum kathīran
  time: eclipse sermon
- id: h-330.2-voice
  ref: Jāmiʿ 2:330.2
  unit: hadith-2-adam-called-with-a-voice
  agent: God
  action: calls Adam with a voice
  recipient: Adam
  quoted: yā Ādam - labbayka wa-saʿdayka - fa-yunādā bi-ṣawtin
  object: a contingent (baʿth) of his offspring for the fire
- id: h-331.1-chain
  ref: Jāmiʿ 2:331.1
  unit: hadith-2-angels-at-gods-decree
  agent: the angels
  action: beat their wings in submission
  time: when God decrees a matter in heaven
  instrument: their wings
  quoted: ka-annahu silsilatun ʿalā ṣafwān
- id: h-332.1-swoon
  ref: Jāmiʿ 2:332.1
  unit: hadith-2-angels-at-gods-decree
  agent: the people of heaven
  action: hear a clanging and swoon
  time: when God speaks revelation
  quoted: ṣalṣalatan ka-jarri l-silsilati ʿalā l-ṣafā
  outcome: Gabriel comes; 'what did your Lord say?' - 'the truth'
  name: Jibrīl
- id: h-331.2-lights
  ref: Jāmiʿ 2:331.2
  unit: hadith-2-door-of-heaven-two-lights
  agent: an angel that never came down before
  action: brings good news of two lights
  recipient: the Prophet
  object:
  - Fātiḥat al-kitāb
  - the end of sūrat al-Baqara
  number: 2
  quoted: sumiʿa naqīḍan min fawqihi; bi-nūrayni
  outcome: every letter recited from them is granted
- id: h-331.3-letters
  ref: Jāmiʿ 2:331.3
  unit: hadith-2-letters-of-the-book
  agent: one who recites
  action: recites a letter of God's book
  number:
  - 10
  - 3
  quoted: alif ḥarf wa-lām ḥarf wa-mīm ḥarf
  outcome: each letter a good deed, multiplied tenfold
- id: h-332.2-forget
  ref: Jāmiʿ 2:332.2
  unit: hadith-2-god-speaks-at-the-judgment
  agent: God
  action: questions the servant then forsakes him
  recipient: the servant who did not expect the meeting
  object:
  - hearing
  - sight
  - wealth
  - children
  - cattle
  - tilth
  quoted: al-yawma ansāka kamā nasītanī
- id: h-333.1-dayyan
  ref: Jāmiʿ 2:333.1
  unit: hadith-2-god-speaks-at-the-judgment
  agent: God
  action: calls with a voice heard far as near
  recipient: people gathered naked, uncircumcised, with nothing (buhman)
  quoted: anā l-malik anā l-dayyān
  outcome: no one enters paradise or hell till rights are repaid, even a slap, by good and bad deeds
- id: h-334.3-thigh
  ref: Jāmiʿ 2:334.3
  unit: hadith-2-god-speaks-at-the-judgment
  agent: God
  action: seals the hypocrite's mouth and makes his thigh, flesh and bones speak
  recipient: the third man, a hypocrite
  number: 3
  quoted: ay ful; fa-yukhtamu ʿalā fīhi wa-yuqālu li-fakhidhihi ... inṭiqī
- id: h-335.1-water
  ref: Jāmiʿ 2:335.1
  unit: hadith-2-three-god-will-not-speak-to
  agent: God
  action: does not look at or purify
  object:
  - man who withholds surplus water from the traveller
  - man who pledges allegiance only for worldly gain
  - man who swears falsely over goods after ʿaṣr
  number: 3
  time: after the afternoon prayer (for the oath)
  quoted: faḍlu māʾin bi-l-ṭarīq; aqāma silʿatahu baʿda l-ʿaṣr
- id: h-335.2-old
  ref: Jāmiʿ 2:335.2
  unit: hadith-2-three-god-will-not-speak-to
  agent: God
  action: does not speak to or purify
  object:
  - an old adulterer
  - a lying king
  - a proud pauper
  number: 3
  quoted: shaykhun zānin wa-malikun kadhdhābun wa-ʿāʾilun mustakbir
- id: h-336.1-musbil
  ref: Jāmiʿ 2:336.1
  unit: hadith-2-three-god-will-not-speak-to
  agent: God
  action: does not speak to, look at or purify
  object:
  - one who trails his garment
  - one who reminds of his gifts
  - one who sells by false oath
  number: 3
  quoted: al-musbil wa-l-mannān wa-l-munaffiq silʿatahu bi-l-ḥalif al-kādhib
- id: h-337.1-kifah
  ref: Jāmiʿ 2:337.1
  unit: hadith-2-face-to-face-with-jabirs-father
  agent: God
  action: spoke face to face
  recipient: Jabir's father ʿAbd Allāh b. ʿAmr
  time: after he was killed at Uḥud
  quoted: kallama abāka kifāḥan
- id: h-338.1-rum
  ref: Jāmiʿ 2:338.1
  unit: hadith-2-quran-gods-speech
  agent: the Prophet
  action: goes out reciting with the basmala
  object: Q 30:1-3
  recipient: the chiefs of the Meccan idolaters
  quoted: lā wa-llāhi wa-lākinnahu kalāmu llāhi wa-qawluh
  name: Ibn Abī Quḥāfa
- id: h-338.2-spirit
  ref: Jāmiʿ 2:338.2
  unit: hadith-2-jews-ask-about-the-spirit
  agent: a group of Jews
  action: ask about the spirit
  recipient: the Prophet
  place: the ruins (kharib) of Medina
  instrument: a palm stick he leans on
  quoted: yā Abā l-Qāsim mā l-rūḥ; wa-mā (ūtū) mina l-ʿilmi illā qalīlan
  outcome: he falls silent until revelation lifts
- id: h-339.1-five
  ref: Jāmiʿ 2:339.1
  unit: hadith-2-keys-of-the-unseen
  agent: God alone
  action: knows
  object:
  - what will be tomorrow
  - what is in the wombs
  - what a soul will earn tomorrow
  - in what land it will die
  - when rain comes
  number: 5
  quoted: miftāḥu l-ghaybi khamsun
- id: h-346.1-gabriel
  ref: Jāmiʿ 2:346.1
  unit: hadith-2-aisha-no-one-saw-his-lord
  agent: the Prophet
  action: saw Gabriel in his created form
  number: 2
  quoted: innamā huwa Jibrīl; sāddan ʿiẓamu khalqihi mā bayna l-samāʾi ilā l-arḍ
  name: Jibrīl
- id: h-347.1-horizon
  ref: Jāmiʿ 2:347.1
  unit: hadith-2-aisha-no-one-saw-his-lord
  agent: Gabriel
  action: comes in his own form instead of a man's
  outcome: blocks the horizon
  quoted: fa-sadda l-ufuq
- id: h-340.1-kanaf
  ref: Jāmiʿ 2:340.1
  unit: hadith-2-najwa-god-screens-the-believer
  agent: God
  action: draws the believer near, covers him and makes him confess his sins
  recipient: the believer
  instrument: his side (kanaf)
  quoted: satartuhā ʿalayka fī l-dunyā wa-anā aghfiruhā laka l-yawm
  outcome: given the book of his good deeds; unbelievers proclaimed by the witnesses (al-ashhād)
  place: the gathering, in private (al-najwā)
- id: h-342.1-insult
  ref: Jāmiʿ 2:342.1
  unit: hadith-2-no-likeness-to-god
  agent: the son of Adam
  action: insults and belies God
  quoted: ammā shatmuhu fa-qawluhu inna lī waladan; laysa yuʿīdunī kamā badaʾanī; wa-laysa awwalu l-khalqi bi-ahwana ʿalayya
    min iʿādatih
- id: h-342.3-lineage
  ref: Jāmiʿ 2:342.3
  unit: hadith-2-no-likeness-to-god
  agent: the polytheists
  action: ask the Prophet to give his Lord's lineage
  outcome: al-Ikhlas sent down
  quoted: unsub lanā rabbaka; laysa shayʾun yūladu illā sa-yamūtu wa-laysa shayʾun yamūtu illā sa-yūrathu
- id: h-345.1-dahr
  ref: Jāmiʿ 2:345.1
  unit: hadith-2-god-is-time
  agent: the son of Adam
  action: curses time
  recipient: God
  quoted: yasubbu l-dahra wa-anā l-dahr, bi-yadī l-amr uqallibu l-layla wa-l-nahār
- id: h-345.2-patient
  ref: Jāmiʿ 2:345.2
  unit: hadith-2-none-more-patient-than-god
  agent: God
  action: bears the insult
  object: the claim that he has a son
  outcome: keeps them well and provides for them
  quoted: yaddaʿūna lahu l-walad thumma yuʿāfīhim wa-yarzuquhum
- id: h-345.3-kafir
  ref: Jāmiʿ 2:345.3
  unit: hadith-2-none-sees-god-before-death
  agent: every believer
  action: reads
  object: '''kāfir'' written between the Dajjal''s eyes'
  quoted: maktūbun bayna ʿaynayhi kāfir yaqraʾuhu man kariha ʿamalahu
- id: h-345.4-dajjal
  ref: Jāmiʿ 2:345.4
  unit: hadith-2-none-sees-god-before-death
  agent: the Messiah Dajjal
  name: al-Masīḥ al-Dajjāl
  action: is described
  object:
  - short
  - bandy-legged (afḥaj)
  - curly-haired
  - one eye wiped out
  quoted: aʿwaru maṭmūsu l-ʿayn laysa bi-nātiʾatin wa-lā ḥajrāʾ
  outcome: your Lord is not one-eyed; none sees him until death
- id: h-347.3-wings
  ref: Jāmiʿ 2:347.3
  unit: hadith-2-gabriel-six-hundred-wings
  agent: the Prophet
  action: saw Gabriel
  number: 600
  quoted: lahu sittu miʾati janāḥ
  name: Jibrīl
- id: h-348.1-rafraf
  ref: Jāmiʿ 2:348.1
  unit: hadith-2-gabriel-six-hundred-wings
  agent: the Prophet
  action: saw a green rafraf
  outcome: it blocked the horizon of heaven
  quoted: rafrafan akhḍara sadda ufuqa l-samāʾ
- id: h-348.2-hulla
  ref: Jāmiʿ 2:348.2
  unit: hadith-2-gabriel-six-hundred-wings
  agent: Gabriel
  action: appears in a robe of rafraf
  outcome: fills what is between heaven and earth
  quoted: fī ḥullatin min rafraf
- id: h-350.1-nur
  ref: Jāmiʿ 2:350.1
  unit: hadith-2-light-how-could-i-see-him
  agent: the Prophet
  action: answers Abu Dharr's question whether he saw his Lord
  quoted: nūrun annā arāhu
  name: Abū Dharr
- id: h-351.1-twice
  ref: Jāmiʿ 2:351.1
  unit: hadith-2-seen-with-the-heart
  agent: the Prophet
  action: saw his Lord with his heart
  number: 2
  quoted: raʾāhu bi-fuʾādihi marratayn
  name: Ibn ʿAbbās
- id: h-351.3-khulla
  ref: Jāmiʿ 2:351.3
  unit: hadith-2-seen-with-the-heart
  agent: God
  action: grants each prophet one gift
  object:
  - friendship (khulla) to Abraham
  - speech (kalām) to Moses
  - vision (ruʾya) to Muhammad
  number: 3
  quoted: al-khullatu li-Ibrāhīm wa-l-kalāmu li-Mūsā wa-l-ruʾyatu li-Muḥammad
- id: h-354.1-dream
  ref: Jāmiʿ 2:354.1
  unit: hadith-2-lord-in-the-best-form
  agent: the Prophet
  action: sees his Lord in the best form while dozing in night prayer
  time: the night before a delayed dawn prayer
  quoted: fī aḥsani ṣūra; fīma yakhtaṣimu l-malaʾu l-aʿlā; qālahā thalāthan
  outcome: taught the expiations, degrees and a prayer; 'study them and learn them'
  number: 3
- id: h-354.1-palm
  ref: Jāmiʿ 2:354.1
  unit: hadith-2-lord-in-the-best-form
  agent: the Lord
  action: puts his palm between the Prophet's shoulders
  instrument: palm (kaff)
  quoted: ḥattā wajadtu barda anāmilihi bayna thadyayya fa-tajallā lī kullu shayʾ
- id: h-357.1-lists
  ref: Jāmiʿ 2:357.1
  unit: hadith-2-lord-in-the-best-form
  agent: the highest assembly
  action: disputes
  object:
  - walking to congregations
  - full ablution in hardship
  - waiting for prayer after prayer
  - feeding
  - giving greeting
  - night prayer
  quoted: al-kaffārāt wa-l-darajāt
- id: h-360.1-veil
  ref: Jāmiʿ 2:360.1
  unit: hadith-2-veil-of-light
  agent: God
  action: is veiled
  instrument: a veil of light
  number: 5
  quoted: ḥijābuhu l-nūr law kashafahu la-aḥraqat subuḥātu wajhihi
  outcome: his face's glories would burn all his sight reaches
- id: h-363.1-moon
  ref: Jāmiʿ 2:363.1
  unit: hadith-2-seeing-the-lord
  agent: the believers
  action: will see their Lord
  instrument: as the full moon is seen
  time: the night of the full moon (layat al-badr)
  quoted: lā tuḍāmmūna fī ruʾyatihi
  outcome: so keep the prayers before sunrise and before sunset
- id: h-364.3-gardens
  ref: Jāmiʿ 2:364.3
  unit: hadith-2-seeing-the-lord
  object:
  - two gardens of silver
  - two gardens of gold
  number: 4
  place: the garden of Eden (jannat ʿAdn)
  quoted: illā ridāʾu l-kibriyāʾi ʿalā wajhihi
- id: h-365.1-veil
  ref: Jāmiʿ 2:365.1
  unit: hadith-2-seeing-the-lord
  agent: God
  action: lifts the veil
  recipient: the people of paradise
  quoted: fa-yakshifu l-ḥijāb
  outcome: nothing dearer to them than looking at their Lord
- id: h-367.1-forty
  ref: Jāmiʿ 2:367.1
  unit: hadith-2-the-long-report-of-ibn-masud
  agent: the first and the last
  action: stand gazing at the sky awaiting judgment
  number: 40
  time: forty years
  quoted: shākhiṣatan abṣāruhum ilā l-samāʾ
- id: h-367.1-devils
  ref: Jāmiʿ 2:367.1
  unit: hadith-2-the-long-report-of-ibn-masud
  agent: God
  action: makes likenesses appear to each worshipper
  object:
  - sun
  - moon
  - stone idols
  - the devil of Jesus
  - the devil of ʿUzayr
  name:
  - ʿĪsā
  - ʿUzayr
  quoted: yumaththalu li-man kāna yaʿbudu ʿĪsā shayṭānu ʿĪsā
- id: h-367.1-toe
  ref: Jāmiʿ 2:367.1
  unit: hadith-2-the-long-report-of-ibn-masud
  agent: God
  action: gives light by deeds
  object:
  - light like a great mountain
  - like a palm tree
  - on the big toe
  quoted: nūrahu ʿalā ibhāmi qadamihi yuḍīʾu marratan wa-yuṭfiʾu marratan
- id: h-367.1-crossing
  ref: Jāmiʿ 2:367.1
  unit: hadith-2-the-long-report-of-ibn-masud
  agent: the believers
  action: cross the fire by their light
  object:
  - blink of an eye
  - lightning
  - cloud
  - falling star
  - wind
  - running horse
  - running man
  - crawling
  number: 7
- id: h-367.1-mock
  ref: Jāmiʿ 2:367.1
  unit: hadith-2-the-long-report-of-ibn-masud
  agent: the last man saved
  action: asks mansion after mansion
  number:
  - 3
  - 10
  quoted: a-tastahziʾu bī wa-anta rabbu l-ʿizza
  outcome: the Lord laughs; given the world's like and ten times more
- id: h-367.1-steward
  ref: Jāmiʿ 2:367.1
  unit: hadith-2-the-long-report-of-ibn-masud
  agent: the man
  action: prostrates to a pearl palace and makes to prostrate to a steward
  number: 1000
  quoted: innamā anā khāzinun min khuzzānika ʿabdun min ʿabīdika taḥta yadī alfu qahramān
- id: h-367.1-houri
  ref: Jāmiʿ 2:367.1
  unit: hadith-2-the-long-report-of-ibn-masud
  object: the least of his maidens
  number:
  - 70
  - 70
  quoted: ʿalayhā sabʿūna ḥulla yurā mukhkhu sāqihā; kabiduhā mirʾātuhu
  outcome: each grows seventyfold in the other's eyes
  place: a hollow pearl palace
