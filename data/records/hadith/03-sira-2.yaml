records:
  - {id: h-5083.1-throttle, ref: "Jāmiʿ 48:5083.1", unit: hadith-48-persecution-at-the-kaba, agent: ʿUqba b. Abi Mu'ayt, action: twists garment round the prophet's neck and throttles him, recipient: the prophet, place: courtyard of the Ka'ba, time: while praying, outcome: Abu Bakr pushes him off quoting Q 40:28, quoted: "lawa thawbahu fi ʿunuqihi fa-khanaqahu"}
  - {id: h-5083.2-slaughter, ref: "Jāmiʿ 48:5083.2", unit: hadith-48-persecution-at-the-kaba, agent: the prophet, action: warns Quraysh after being taunted at each circuit, recipient: Quraysh nobles in the Hijr, number: 3, quoted: ["la-qad ji'tukum bi-l-dhabh", "ka-annama ʿala ra'sihi ta'irun waqi'"], outcome: next day they surround him and seize his cloak; Abu Bakr weeps and intervenes}
  - {id: h-5084.1-armpit, ref: "Jāmiʿ 48:5084.1", unit: hadith-48-persecution-at-the-kaba, agent: the prophet and Bilal, action: go without food, time: three days and nights, number: 3, quoted: "illa ma yuwari ibtu Bilal"}
  - {id: h-5084.2-beaten, ref: "Jāmiʿ 48:5084.2", unit: hadith-48-persecution-at-the-kaba, agent: Quraysh, action: beat the prophet until he faints, outcome: Abu Bakr cries Q 40:28 and is called mad, quoted: "Ibn Abi Quhafa al-majnun"}
  - {id: h-5084.3-combs, ref: "Jāmiʿ 48:5084.3", unit: hadith-48-combed-with-iron, agent: persecutors of earlier believers, action: comb flesh from bones and saw the head in two, instrument: [iron combs, saw], place: from the parting of the head, outcome: the believer does not leave his religion, quoted: ["yumshatu bi-amshat al-hadid", "yuwda'u al-minshar ʿala mafriqi ra'sihi fa-yushaqqu bi-thnayn"]}
  - {id: h-5084.3-rider, ref: "Jāmiʿ 48:5084.3", unit: hadith-48-combed-with-iron, agent: a lone rider, action: travels without fear, place: San'a to Hadramawt, quoted: "la yakhafu illa llah wa-l-dhi'ba ʿala ghanamihi"}
  - {id: h-5085.1-mountains, ref: "Jāmiʿ 48:5085.1", unit: hadith-48-taif-and-the-angel-of-mountains, agent: the angel of the mountains, action: offers to bring the two mountains together on the town, recipient: the prophet, place: Qarn al-Tha'alib, time: day of al-'Aqaba, name: [Ibn ʿAbd Yalil b. ʿAbd Kulal, Gabriel, al-akhshabayn], instrument: a cloud shading him, outcome: the prophet declines hoping for their descendants, quoted: "in shi'ta an utbiqa ʿalayhim al-akhshabayn"}
  - {id: h-5113.1-taif-prayer, ref: "Jāmiʿ 48:5113.1", unit: hadith-48-taif-and-the-angel-of-mountains, agent: the prophet, action: prays two rak'as and complains to God, place: shade of a tree near Ta'if, time: after Abu Talib's death, number: 2, quoted: ["ilayka ashku da'fa quwwati", "ila man takiluni", "laka al-'utba hatta tarda"]}
  - {id: h-5085.2-dust, ref: "Jāmiʿ 48:5085.2", unit: hadith-48-ibn-ubayy-and-the-dust, agent: ʿAbd Allah b. Ubayy, action: covers his nose with his cloak and tells the prophet to preach in his own house, place: mixed assembly in Medina, time: before Badr, instrument: the donkey's dust, quoted: "la tughabbiru ʿalayna", outcome: Muslims; idolaters and Jews nearly fight; the prophet calms them}
  - {id: h-5085.2-crown, ref: "Jāmiʿ 48:5085.2", unit: hadith-48-ibn-ubayy-and-the-dust, agent: people of the town (al-buhayra), action: had agreed to crown their chief, object: [crown, turban], name: Abu Hubab, quoted: "an yutawwijuhu fa-yu'assibunahu bi-l-'isaba", outcome: he chokes with envy (shariqa)}
  - {id: h-5086.1-stoning, ref: "Jāmiʿ 48:5086.1", unit: hadith-48-fair-of-dhul-majaz, agent: Abu Lahab, action: follows the preaching prophet throwing stones, place: market of Dhu l-Majaz, recipient: the prophet in a red robe, outcome: his heels and ankles bleed, quoted: ["qulu la ilaha illa llah tuflihu", "innahu kadhdhab"]}
  - {id: h-5086.1-camel, ref: "Jāmiʿ 48:5086.1", unit: hadith-48-fair-of-dhul-majaz, agent: the prophet, action: buys a camel on credit from strangers, place: near Medina, object: camel, outcome: his messenger brings dates to eat and measure in full, quoted: "ma ra'aytu shay'an ashbaha bi-l-qamari laylata al-badri min wajhihi"}
  - {id: h-5086.1-vengeance, ref: "Jāmiʿ 48:5086.1", unit: hadith-48-fair-of-dhul-majaz, agent: the prophet, action: refuses blood-vengeance on a tribe for a pre-Islamic killing, place: pulpit in Medina, quoted: "ala la tajni ummun ʿala walad"}
  - {id: h-5137.2-abulahab, ref: "Jāmiʿ 48:5137.2", unit: hadith-48-fair-of-dhul-majaz, agent: Abu Lahab, action: follows the prophet calling him a liar, place: Dhu l-Majaz, quoted: "innahu sabi'un kadhib", name: [Abu Lahab, Rabi'a b. ʿAbbad]}
  - {id: h-5138.1-jinn, ref: "Jāmiʿ 48:5138.1", unit: hadith-48-fair-of-dhul-majaz, agent: Abu Lahab, action: warns the tribe the prophet would strip their gods and jinn allies, place: Mina, object: [al-Lat, al-'Uzza, allies among the jinn of Banu Malik b. Uqays], quoted: "an taslakhu al-lata wa-l-'uzza min a'naqikum"}
  - {id: h-5088.1-mudhammam, ref: "Jāmiʿ 48:5088.1", unit: hadith-48-mudhammam, agent: Quraysh, action: curse ʿMudhammam', name: [Mudhammam, Muhammad], quoted: "yashtumuna mudhammaman ... wa-ana muhammad"}
  - {id: h-5089.1-teacher, ref: "Jāmiʿ 48:5089.1", unit: hadith-48-foreign-teacher, agent: Quraysh, action: claim a slave teaches the prophet, name: "'abd b. al-Hadrami", quoted: "innama yu'allimu muhammadan ʿabdu bni al-hadrami"}
  - {id: h-5089.2-mockers, ref: "Jāmiʿ 48:5089.2", unit: hadith-48-the-mockers-struck, agent: Gabriel, action: points at a body part of each mocker, recipient: [al-Walid b. al-Mughira, al-Aswad b. al-Muttalib, al-Aswad b. ʿAbd Yaghuth, al-Harith b. ʿAntala, al-'As b. Wa'il], number: 5, object: [vein (abjal), eyes, head, belly, sole], outcome: [arrow cuts his vein, blindness by thorns, sores on the head, dropsy, thorn in the sole], quoted: "ma sana'ta? qala: kafaytuhu"}
  - {id: h-5090.1-six, ref: "Jāmiʿ 48:5090.1", unit: hadith-48-poor-companions-not-dismissed, agent: the idolaters, action: ask the prophet to drive away his poor companions, number: 6, name: [Sa'd, Ibn Mas'ud, a Hudhali, Bilal], outcome: Q 6:52 revealed, quoted: "utrud ha'ula'i la yajtari'una ʿalayna"}
  - {id: h-5092.1-seven, ref: "Jāmiʿ 48:5092.1", unit: hadith-48-seven-years-and-the-smoke, agent: the prophet, action: prays for seven famine years on Quraysh, number: 7, name: Joseph, outcome: they eat hides and carrion and see the sky as smoke; Abu Sufyan asks him to pray for rain, quoted: "allahumma sab'un ka-sab'i yusuf"}
  - {id: h-5092.2-five, ref: "Jāmiʿ 48:5092.2", unit: hadith-48-seven-years-and-the-smoke, agent: Ibn Mas'ud, action: counts signs already past, number: 5, object: [al-lizam, al-Rum, al-batsha, the moon, the smoke], quoted: "khamsun qad madayna"}
  - {id: h-5098.1-najm, ref: "Jāmiʿ 48:5098.1", unit: hadith-48-prostration-at-al-najm, agent: [the prophet, Muslims, idolaters, jinn, humans], action: prostrate together, time: at Q 53:62, quoted: "sajada al-nabiyyu bi-l-najm wa-sajada ma'ahu al-muslimuna wa-l-mushrikuna wa-l-jinnu wa-l-ins"}
  - {id: h-5098.2-gifts, ref: "Jāmiʿ 48:5098.2", unit: hadith-48-negus-umm-salama, agent: Quraysh envoys, action: give gifts to each patriarch then to the king, object: leather goods (adam), name: [ʿAbd Allah b. Abi Rabi'a, ʿAmr b. al-'As], recipient: the Negus and his patriarchs, outcome: gifts returned, quoted: "lam yatrukū min bataariqatihi bitriqan illa ahdaw lahu"}
  - {id: h-5098.2-maryam, ref: "Jāmiʿ 48:5098.2", unit: hadith-48-negus-umm-salama, agent: Ja'far b. Abi Talib, action: recites the opening of Surat Maryam, recipient: the Negus and his bishops, outcome: the king weeps till his beard is wet and the bishops' books are wet, quoted: ["kaf ha ya ʿayn sad", "la-yakhruju min mishkatin wahida"]}
  - {id: h-5098.2-stick, ref: "Jāmiʿ 48:5098.2", unit: hadith-48-negus-umm-salama, agent: the Negus, action: picks a stick from the ground, object: stick (ʿud), quoted: ["'abdu llahi wa-rasuluhu wa-ruhuhu wa-kalimatuhu alqaha ila maryam al-'adhra' al-batul", "ma ʿada ʿisa bnu maryama ma qulta hadha al-'ud"], outcome: the refugees declared safe (suyum)}
  - {id: h-5098.2-bribe, ref: "Jāmiʿ 48:5098.2", unit: hadith-48-negus-umm-salama, agent: the Negus, action: returns the gifts, quoted: "ma akhadha llahu minni al-rishwata hina radda ʿalayya mulki", object: gifts, name: dabr (Abyssinian for mountain)}
  - {id: h-5098.2-nile, ref: "Jāmiʿ 48:5098.2", unit: hadith-48-negus-umm-salama, agent: al-Zubayr b. al-'Awwam, action: swims across on an inflated waterskin to watch the battle, place: the Nile, instrument: inflated waterskin, outcome: the Negus wins, quoted: "fa-nafakhu lahu qirbatan fa-ja'alaha fi sadrihi"}
  - {id: h-5103.1-prostrate, ref: "Jāmiʿ 48:5103.1", unit: hadith-48-negus-ibn-masud, agent: Ja'far, action: greets the king without prostrating, recipient: the Negus, number: 80, quoted: "inna la nasjudu illa lillah", outcome: envoys who prostrated are sent back with their gifts}
  - {id: h-5103.1-sandals, ref: "Jāmiʿ 48:5103.1", unit: hadith-48-negus-ibn-masud, agent: the Negus, action: says he would carry the prophet's sandals and water for ablution, object: sandals, quoted: ["innahu alladhi najidu fi al-injil", "hatta akuna ana ahmilu na'layhi"]}
  - {id: h-5104.1-ship, ref: "Jāmiʿ 48:5104.1", unit: hadith-48-ship-people, agent: Abu Musa and his kin, action: sail to join the prophet and are cast ashore with the Negus, place: Abyssinia, number: [52, 53], outcome: given a share at Khaybar though absent, quoted: "fa-alqatna safinatuna ila al-najashi"}
  - {id: h-5105.1-dughunna, ref: "Jāmiʿ 48:5105.1", unit: hadith-48-ibn-dughunna-and-the-departure, agent: Ibn al-Dughunna, action: grants Abu Bakr protection, recipient: Abu Bakr, place: Bark al-Ghimad, name: chief of the Qara, quoted: "inna mithlaka ... la yakhruju wa-la yukhraju", outcome: Abu Bakr later returns the protection}
  - {id: h-5105.1-mosque, ref: "Jāmiʿ 48:5105.1", unit: hadith-48-ibn-dughunna-and-the-departure, agent: Abu Bakr, action: builds a place of prayer in his courtyard and recites weeping, place: courtyard of his house, recipient: watching women and children of the idolaters, quoted: "kana abu bakrin rajulan bakka'an la yamliku ʿaynayhi"}
  - {id: h-5105.1-thawr, ref: "Jāmiʿ 48:5105.1", unit: hadith-48-ibn-dughunna-and-the-departure, agent: [the prophet, Abu Bakr], action: hide in a cave, place: cave of Mount Thawr, time: three nights, number: 3, name: [ʿAbd Allah b. Abi Bakr, ʿAmir b. Fuhayra, a guide of Banu l-Dil], quoted: "fa-kamana fihi thalatha layal", outcome: take the coastal road}
  - {id: h-5105.1-nitaq, ref: "Jāmiʿ 48:5105.1", unit: hadith-48-ibn-dughunna-and-the-departure, agent: Asma' bint Abi Bakr, action: cuts her waistband to tie the provision bag, object: waistband (nitaq), name: dhat al-nitaq, quoted: "qata'at qit'atan min nitaqiha"}
  - {id: h-5105.1-price, ref: "Jāmiʿ 48:5105.1", unit: hadith-48-ibn-dughunna-and-the-departure, agent: the prophet, action: accepts the camel only for payment, object: riding camel, quoted: "bi-l-thaman", time: noon heat, number: 4}
  - {id: h-5107.1-khayf, ref: "Jāmiʿ 48:5107.1", unit: hadith-48-the-boycott, agent: Quraysh and Kinana, action: swear a boycott, recipient: Banu Hashim and Banu l-Muttalib, place: Khayf of Bani Kinana (al-Muhassab), object: [marriage, trade], quoted: "haythu taqasamu ʿala al-kufr"}
  - {id: h-5110.1-death, ref: "Jāmiʿ 48:5110.1", unit: hadith-48-death-of-abu-talib, agent: Abu Talib, action: refuses the formula on his deathbed, name: [Abu Jahl, ʿAbd Allah b. Abi Umayya, ʿAbd al-Muttalib], quoted: "huwa ʿala millati ʿabd al-muttalib", outcome: Q 9:113 and Q 28:56 revealed}
  - {id: h-5110.4-sandals, ref: "Jāmiʿ 48:5110.4", unit: hadith-48-death-of-abu-talib, agent: Abu Talib, action: is punished least of the people of the fire, object: two sandals of fire, outcome: his brain boils, quoted: "muntaʿilun bi-naʿlayn yaghli minhuma dimaghuhu"}
  - {id: h-5109.1-shallows, ref: "Jāmiʿ 48:5109.1", unit: hadith-48-death-of-abu-talib, agent: the prophet, action: says his uncle is in shallow fire through him, place: dahdah of fire, quoted: "wa-lawla ana la-kana fi al-darak al-asfal min al-nar"}
  - {id: h-5114.1-roof, ref: "Jāmiʿ 48:5114.1", unit: hadith-48-ascent-abu-dharr, agent: Gabriel, action: opens the roof; splits and washes the breast; fills it from a gold basin, place: the prophet's house in Mecca, instrument: [Zamzam water, gold basin of wisdom and faith], quoted: "furija saqfu bayti wa-ana bi-makka"}
  - {id: h-5114.1-adam, ref: "Jāmiʿ 48:5114.1", unit: hadith-48-ascent-abu-dharr, agent: Adam, action: laughs looking right and weeps looking left, place: lowest heaven, object: shadowy souls of his offspring (aswida), quoted: "hadhihi al-aswidatu ... nasamu banihi"}
  - {id: h-5114.1-pens, ref: "Jāmiʿ 48:5114.1", unit: hadith-48-ascent-abu-dharr, agent: the prophet, action: hears the pens, place: a level above the heavens, quoted: "asma'u fihi sarifa al-aqlam"}
  - {id: h-5114.1-fifty, ref: "Jāmiʿ 48:5114.1", unit: hadith-48-ascent-abu-dharr, agent: Moses, action: sends the prophet back to ask reduction, object: prayers, number: [50, 5], outcome: half removed; then five that are fifty, quoted: ["hiya khamsun wa-hiya khamsun", "la yubaddalu al-qawlu ladayya", "qad istahyaytu min rabbi"]}
  - {id: h-5114.1-paradise, ref: "Jāmiʿ 48:5114.1", unit: hadith-48-ascent-abu-dharr, agent: the prophet, action: enters paradise, object: [domes of pearl, soil of musk], quoted: "janabidhu al-lu'lu' wa-turabuha al-misk"}
  - {id: h-5115.1-buraq, ref: "Jāmiʿ 48:5115.1", unit: hadith-48-ascent-malik-b-sasaa, agent: al-Buraq, action: carries the prophet, name: al-Buraq, quoted: "fawqa al-himar wa-duna al-baghl yaqa'u khatwuhu ʿinda aqsa tarfihi"}
  - {id: h-5115.1-moses-weeps, ref: "Jāmiʿ 48:5115.1", unit: hadith-48-ascent-malik-b-sasaa, agent: Moses, action: weeps as the prophet passes, place: sixth heaven, quoted: "hadha ghulamun ba'athtahu ba'di yadkhulu min ummatihi al-janna akthar"}
  - {id: h-5115.1-rivers, ref: "Jāmiʿ 48:5115.1", unit: hadith-48-ascent-malik-b-sasaa, agent: the prophet, action: sees rivers issue from one root, number: 4, name: [the Nile, the Euphrates], quoted: "nahrani zahirani wa-nahrani batinan ... fa-l-nil wa-l-furat"}
  - {id: h-5115.1-house, ref: "Jāmiʿ 48:5115.1", unit: hadith-48-ascent-malik-b-sasaa, agent: seventy thousand angels, action: enter the frequented House daily and do not return, number: 70000, name: al-bayt al-ma'mur, quoted: "lam ya'udu fihi akhira ma ʿalayhim"}
  - {id: h-5115.1-milk, ref: "Jāmiʿ 48:5115.1", unit: hadith-48-ascent-malik-b-sasaa, agent: the prophet, action: chooses between two vessels, object: [wine, milk], outcome: chooses milk, quoted: "asabta asaba llahu bika ummataka ʿala al-fitra"}
  - {id: h-5116.1-ring, ref: "Jāmiʿ 48:5116.1", unit: hadith-48-ascent-thabit, agent: the prophet, action: ties al-Buraq and prays, place: Bayt al-Maqdis, instrument: the ring of the prophets, number: 2, quoted: "bi-l-halqa allati yarbitu bihi al-anbiya'"}
  - {id: h-5116.1-joseph, ref: "Jāmiʿ 48:5116.1", unit: hadith-48-ascent-thabit, agent: Joseph, place: third heaven, quoted: "qad u'tiya shatra al-husn"}
  - {id: h-5116.1-fives, ref: "Jāmiʿ 48:5116.1", unit: hadith-48-ascent-thabit, agent: the prophet, action: returns repeatedly between God and Moses, object: prayers, number: [50, 5, 10], quoted: ["fa-hatta ʿanni khamsan", "li-kulli salatin ʿashr"], outcome: five prayers counting as fifty}
  - {id: h-5116.1-intention, ref: "Jāmiʿ 48:5116.1", unit: hadith-48-ascent-thabit, agent: God, action: records intended and done deeds, number: [1, 10], quoted: "man hamma bi-sayyi'atin fa-lam ya'malha lam tuktab shay'an"}
  - {id: h-5118.1-three, ref: "Jāmiʿ 48:5118.1", unit: hadith-48-ascent-sharik, agent: three persons, action: come to the sleeping prophet and choose him, place: the Sacred Mosque, number: 3, time: before revelation, quoted: "awsatuhum huwa khayruhum"}
  - {id: h-5118.1-kawthar, ref: "Jāmiʿ 48:5118.1", unit: hadith-48-ascent-sharik, agent: the prophet, action: strikes his hand into a heavenly river, object: [palace of pearl and chrysolite, musk], name: al-Kawthar, quoted: "fa-idha huwa miskun adhfar"}
  - {id: h-5118.1-nile, ref: "Jāmiʿ 48:5118.1", unit: hadith-48-ascent-sharik, agent: the prophet, action: sees two rivers flowing, place: lowest heaven, name: [the Nile, the Euphrates], quoted: "hadha al-nil wa-l-furat ʿunsuruhuma"}
  - {id: h-5118.1-draws-near, ref: "Jāmiʿ 48:5118.1", unit: hadith-48-ascent-sharik, agent: al-Jabbar, action: draws near and comes down, place: Lote-Tree of the Boundary, number: 2, quoted: "wa-dana al-jabbaru rabbu al-'izza fa-tadalla hatta kana minhu qaba qawsayni aw adna"}
  - {id: h-5118.1-reduction, ref: "Jāmiʿ 48:5118.1", unit: hadith-48-ascent-sharik, agent: Moses, action: detains the prophet and sends him back, object: prayers, number: [50, 10, 5], quoted: "la-qad rawadtu bani isra'ila qawmi ʿala adna min hadha fa-da'ufu", outcome: he wakes in the Sacred Mosque}
  - {id: h-5120.1-nails, ref: "Jāmiʿ 48:5120.1", unit: hadith-48-punishments-seen-on-the-ascent, agent: backbiters, action: scratch their faces and chests, instrument: nails, quoted: "alladhina ya'kuluna luhum al-nas"}
  - {id: h-5120.2-scissors, ref: "Jāmiʿ 48:5120.2", unit: hadith-48-punishments-seen-on-the-ascent, agent: preachers who forget themselves, action: have their lips cut, instrument: scissors of fire, quoted: "tuqradu shifahuhum bi-maqarida min nar"}
  - {id: h-5121.1-balk, ref: "Jāmiʿ 48:5121.1", unit: hadith-48-buraq-and-jerusalem, agent: al-Buraq, action: balks at being mounted, outcome: pours sweat when rebuked by Gabriel, quoted: "fa-rfadda ʿaraqan"}
  - {id: h-5127.1-rock, ref: "Jāmiʿ 48:5127.1", unit: hadith-48-buraq-and-jerusalem, agent: Gabriel, action: bores a hole in the rock and tethers al-Buraq, instrument: his finger, place: Bayt al-Maqdis, quoted: "fa-kharaqa jibrilu al-sakhrata bi-isba'ihi"}
  - {id: h-5126.2-noprayer, ref: "Jāmiʿ 48:5126.2", unit: hadith-48-buraq-and-jerusalem, agent: Hudhayfa, action: denies the prophet prayed in Jerusalem that night, recipient: Zirr b. Hubaysh, quoted: "law salla fihi la-kutiba ʿalaykum salatun fihi"}
  - {id: h-5121.2-portraits, ref: "Jāmiʿ 48:5121.2", unit: hadith-48-prophets-seen-on-the-night-journey, agent: the prophet, action: describes Moses; Jesus and Abraham, name: [Shanu'a, dimas], quoted: ["ka-annahu min rijal shanu'a", "ka-annama kharaja min dimas", "ana ashbahu waladihi bihi"]}
  - {id: h-5122.2-talbiya, ref: "Jāmiʿ 48:5122.2", unit: hadith-48-prophets-seen-on-the-night-journey, agent: [Moses, Jonah], action: recite the talbiya, place: [Wadi al-Azraq, Thaniyyat Harsha], instrument: [red camel, palm-fibre halter, wool cloak], quoted: "lahu ju'arun ila llahi bi-l-talbiya"}
  - {id: h-5126.1-dihya, ref: "Jāmiʿ 48:5126.1", unit: hadith-48-prophets-seen-on-the-night-journey, agent: the prophet, action: names who each prophet resembles, name: [ʿUrwa b. Mas'ud, Dihya b. Khalifa], quoted: "aqrabu man ra'aytu bihi shabahan dihya"}
  - {id: h-5134.1-imam, ref: "Jāmiʿ 48:5134.1", unit: hadith-48-prophets-seen-on-the-night-journey, agent: the prophet, action: leads the prophets in prayer, recipient: [Moses, Jesus, Abraham], outcome: Malik keeper of the fire greets him first, quoted: "fa-hanati al-salatu fa-amamtuhum"}
  - {id: h-5123.1-described, ref: "Jāmiʿ 48:5123.1", unit: hadith-48-quraysh-and-the-night-journey, agent: Abu Jahl, action: gathers Banu Ka'b b. Lu'ayy to hear the prophet, outcome: the mosque is brought before him and he describes it, place: near the house of ʿIqal, quoted: "fa-jī'a bi-l-masjidi wa-ana anzuru"}
  - {id: h-5129.1-siddiq, ref: "Jāmiʿ 48:5129.1", unit: hadith-48-quraysh-and-the-night-journey, agent: Abu Bakr, action: affirms the night journey, name: al-Siddiq, quoted: "usaddiquhu bi-khabari al-sama' fi ghadwatin aw rawha", outcome: some believers apostatize}
  - {id: h-5123.2-comb, ref: "Jāmiʿ 48:5123.2", unit: hadith-48-hairdresser-of-pharaohs-daughter, agent: the hairdresser of Pharaoh's daughter, action: drops the comb and says bismillah, recipient: Pharaoh's daughter, instrument: comb (midra), quoted: "rabbi wa-rabbu abiki allah"}
