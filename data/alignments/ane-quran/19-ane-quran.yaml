- unit: ane-ea-286-abdi-heba-slander
  checked: [quran-68-qalam-the-pen-and-the-slanderer, quran-43-zukhruf-pharaoh-claims, quran-7-moses-pharaoh, quran-49-hujurat-etiquette-and-brotherhood]
  matches:
  - with: quran-49-hujurat-etiquette-and-brotherhood
    motif: slander-as-eating-the-victim
    refs: ["EA 286 o:5-8"]
    with_refs: ["49:12"]
    relation: echo
    record:
      agent: ["the slanderers", "one who backbites"]
      action: ["eat the victim (slander)", "eats the flesh of his dead brother (backbites)"]
      object: ["Abdi-Heba's pieces", "his brother's flesh"]
      quoted: ["ikkalū karṣīya ušāru ina pāni šarri", "wa-lā yaghtab baʿḍukum baʿḍan a-yuḥibbu aḥadukum an yaʾkula laḥma akhīhi maytan"]
    note: "Abdi-Heba: 'what have I done to the king my lord? they eat my pieces (i-ka-lu ka-ar-ṣi-ya), I am slandered before the king' (EA 286 o:5-7). Q 49:12 forbids backbiting (lā yaghtab) and pictures it as eating 'the flesh of his dead brother' (laḥma akhīhi maytan). The Akkadian idiom akālu karṣī ('eat the pieces' = slander, Aramaic ʾăkal qarṣîn) is made into an explicit image of eating a corpse."
- unit: ane-ea-288-abdi-heba-name
  checked: [quran-43-zukhruf-pharaoh-claims, quran-7-moses-pharaoh, quran-2-talut-jalut, quran-26-moses-and-pharaoh, quran-3-abraham-people-of-book]
  matches:
  - with: quran-26-moses-and-pharaoh
    motif: who-holds-sunrise-and-sunset
    refs: ["EA 288 o:5-7"]
    with_refs: ["26:28"]
    relation: divergence
    record:
      agent: ["the king of Egypt", "the Lord of Mūsā"]
      action: ["has placed his name at the sunrise and the sunset", "is named Lord of the east and the west to Pharaoh"]
      place: ["the rising and the setting of the sun", "the east and the west and what is between"]
      quoted: ["šakan šumšu ana mūṣi šamši u erbi šamši", "rabbu l-mashriqi wa-l-maghribi wa-mā baynahumā"]
    note: "Abdi-Heba to Pharaoh: 'the king my lord has placed his name at the rising of the sun and the setting of the sun' (EA 288 o:5-7). Before Pharaoh in 26:28 Mūsā answers 'what is the Lord of the worlds?' with 'the Lord of the east and the west and what is between them'. The sunrise-sunset dominion that the vassal ascribes to Pharaoh is claimed for Mūsā's Lord to Pharaoh's face."
  - with: quran-3-abraham-people-of-book
    motif: root-hnp-word
    refs: ["EA 288 o:7-8"]
    with_refs: ["3:67"]
    relation: divergence
    record:
      object: ["the deed done against Abdi-Heba", "Ibrāhīm"]
      name: ["ḫanpa (Canaanite)", "ḥanīf"]
      quoted: ["ḫa-an-pa ša iḫ-nu-pu a-na muḫ-ḫi-ia", "wa-lākin kāna ḥanīfan musliman"]
      outcome: ["condemned as impious", "praised as upright"]
    note: "EA 288 o:7-8: ḫanpa ša iḫnupū ana muḫḫiya, 'the impious deed (ḥanpa) that they did (ḥanapū) against me', a Canaanite word (cf. Hebrew ḥānēp 'godless') in Abdi-Heba's Akkadian. Q 3:67: 'Ibrāhīm was neither Jew nor Christian but a ḥanīf, a muslim, not of the mushrikūn'. Same root, opposite value: the Canaanite noun names impiety, the Quranic adjective the pure worship of one God."
