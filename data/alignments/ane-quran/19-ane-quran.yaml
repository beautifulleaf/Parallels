    motif: egyptian-king-as-god-of-his-subjects
    refs: ["EA 281 o:1-3"]
    with_refs: ["28:38"]
    relation: echo
    record:
      agent: ["Šuwardata, a vassal", "Pharaoh"]
      action: ["addresses the king of Egypt as his gods", "says he knows no god for his nobles but himself"]
      name: ["ilāniya u Šamšiya u šāriya", "ilāhin ghayrī"]
      quoted: ["ana šarri bēliya ilāniya u Šamšiya u šāriya", "mā ʿalimtu lakum min ilāhin ghayrī"]
    note: "Šuwardata writes 'to the king my lord, my gods (DINGIR.MEŠ-nu-ia), my Sun(s) and my breath' (EA 281 o:1-3). In 28:38 Pharaoh tells his council 'I know of no god (ilāh) for you other than me'. The divinity of the Egyptian king, offered by the subject in EA, is claimed by Pharaoh himself in the Quran."
  - with: quran-79-pharaoh-and-cosmos
    motif: egyptian-king-as-god-of-his-subjects
    refs: ["EA 281 o:1-3"]
    with_refs: ["79:24"]
    relation: echo
    record:
      agent: ["Šuwardata, a vassal", "Pharaoh"]
      action: ["addresses the king of Egypt as lord and gods", "proclaims himself their lord most high"]
      name: ["bēliya ilāniya", "rabbukumu l-aʿlā"]
      quoted: ["ana šarri bēliya ilāniya u Šamšiya", "anā rabbukumu l-aʿlā"]
    note: "EA 281 o:1-3 'to the king my lord (bēliya), my gods (ilāniya), my Sun'; 79:24 Pharaoh gathers the people and proclaims 'I am your lord most high' (anā rabbukumu l-aʿlā). Lord and god of his subjects: said to him in EA, said by him in Q, and punished in 79:25."
- unit: ane-ea-238-bayadi-life-and-death
  checked: [quran-2-abraham-king, quran-53-najm-goddesses-and-scrolls, quran-5-holy-land-refusal, quran-8-ratio-captives]
  matches:
  - with: quran-2-abraham-king
    motif: who-gives-life-and-death
    refs: ["EA 238 r:31-33"]
    with_refs: ["2:258"]
    relation: divergence
    record:
      agent: ["a vassal", "the king who disputed with Ibrāhīm"]
      action: ["says 'you give life and you cause death'", "says 'I give life and cause death'"]
      recipient: ["the Egyptian magnate(s)", "Ibrāhīm"]
      quoted: ["attunu tušabliṭūnanu u attunu timitūnanu", "anā uḥyī wa-umītu"]
      outcome: ["the vassal pleads for help", "the king is confounded (fa-buhita)"]
    note: "The same two-verb formula, life then death (Akkadian balāṭu Š / mâtu Š; Arabic aḥyā / amāta). In EA the vassal ascribes it to his overlord ('attunu tušabliṭūnanu u attunu timitūnanu'); in 2:258 the king claims it for himself ('anā uḥyī wa-umītu') against Ibrāhīm's 'my Lord is he who gives life and causes death' (rabbiya lladhī yuḥyī wa-yumītu), and is silenced by the sun challenge. Who holds life and death, and who says so, is what changes."
