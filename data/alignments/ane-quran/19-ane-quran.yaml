- unit: ane-ea-169-son-of-aziru
  checked: [quran-2-abraham-king, quran-48-fath-clear-victory-and-pledge, quran-28-qarun, quran-8-fifth-and-badr-vision]
  matches:
  - with: quran-2-abraham-king
    motif: who-gives-life-and-death
    refs: ["EA 169 o:7-11"]
    with_refs: ["2:258"]
    relation: divergence
    record:
      agent: ["a vassal", "the king who disputed with Ibrāhīm"]
      action: ["says 'you give life and you cause death'", "says 'I give life and cause death'"]
      recipient: ["the king of Egypt", "Ibrāhīm"]
      quoted: ["attā tuballaṭanni u attā tušmītanni", "anā uḥyī wa-umītu"]
      outcome: ["the vassal pleads for help", "the king is confounded (fa-buhita)"]
    note: "The same two-verb formula, life then death (Akkadian balāṭu Š / mâtu Š; Arabic aḥyā / amāta). In EA the vassal ascribes it to his overlord ('attā tuballaṭanni u attā tušmītanni'); in 2:258 the king claims it for himself ('anā uḥyī wa-umītu') against Ibrāhīm's 'my Lord is he who gives life and causes death' (rabbiya lladhī yuḥyī wa-yumītu), and is silenced by the sun challenge. Who holds life and death, and who says so, is what changes."
