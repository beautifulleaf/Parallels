- unit: ane-cth-342-1-1-ashertu-seduction
  checked: [quran-12-joseph-full, quran-66-tahrim-wives-and-the-four-women, quran-16-parables-and-justice, quran-39-pure-religion]
  matches:
  - with: quran-12-joseph-full
    motif: masters-wife-seduces
    refs: ['CTH 342.1.1 §2:15', 'CTH 342.1.1 §2:16', 'CTH 342.1.1 §2:17', 'CTH 342.1.1 §2:18']
    with_refs: ['12:23']
    relation: parallel
    record:
      agent: ['Ašertu, Elkunirša''s wife', 'the wife of al-ʿAzīz, in whose house he is']
      action: [invites the young man to lie with her, invites the young man to lie with her]
      recipient: ['the storm god, a guest in her husband''s house', 'Yūsuf, living in her house']
      quoted: [eḫu-wa-mu-za katta šēš ... UL memmaḫḫun, wa-rāwadathu ... wa-qālat hayta laka qāla maʿādha llāh]
      outcome: [he refuses, he refuses]
    note: 'In the husband''s house the wife asks the young man to sleep with her: ''eḫu-wa-mu-za katta šēš'' (come, sleep with me), and he says no (UL memmaḫḫun). In 12:23 she in whose house he is ''rāwadathu ... hayta laka'' (come here), and he answers ''maʿādha llāh''. In the Hittite she sends her daughters with the message (§2:16); in the Quran she locks the doors herself (ghallaqati l-abwāb).'
  - with: quran-12-joseph-full
    motif: rejected-seductress-threatens
    refs: ['CTH 342.1.1 §2:19', 'CTH 342.1.1 §2:21', 'CTH 342.1.1 §2:22', 'CTH 342.1.1 §2:23', 'CTH 342.1.1 §2:24']
    with_refs: ['12:32']
    relation: parallel
    record:
      agent: [the refused wife, the refused wife]
      action: [threatens the young man, threatens the young man]
      instrument: [her words and her spindle, prison]
      quoted: ['ammitaz [memiyanaz] katta tamašmi', la-in lam yafʿal mā āmuruhu la-yusjananna wa-la-yakūnan mina ṣ-ṣāghirīn]
      outcome: [he goes to the husband, 'he prefers prison (12:33)']
    note: 'Refused, the wife grows angry and threatens: ''be behind me ... with my words I press you down (katta tamašmi), with my spindle I pierce you''. In 12:32 she says before the women: ''if he does not do what I order him, he shall be imprisoned and be among the humbled (ṣ-ṣāghirīn)''. Both threats are to bring him low.'
  - with: quran-12-joseph-full
    motif: husband-response-to-wifes-advances
    refs: ['CTH 342.1.1 §2:15', 'CTH 342.1.1 §2:28', 'CTH 342.1.1 §2:32', 'CTH 342.1.1 §2:33', 'CTH 342.1.1 §2:34']
    with_refs: ['12:25', '12:26', '12:28', '12:29']
    relation: divergence
    record:
      agent: ['Elkunirša, the husband', the husband (sayyidahā)]
      action: [tells the young man to humiliate his wife, tells the young man to let it be and the wife to ask forgiveness]
      quoted: [īt-war-an ... DAM-YA ... lūriyaḫ, yūsufu aʿriḍ ʿan hādhā wa-staghfirī li-dhanbiki]
      outcome: [the young god humiliates her (her 77 and 88 children killed), the matter is set aside; she is told she was at fault]
    note: 'The husband hears of his wife''s advances. In the Hittite the young god goes to him himself (ūk-wa-tta ūkila) and Elkunirša answers ''go ... my wife, humiliate her! (lūriyaḫ)''. In 12:25-29 the husband finds them at the door, she accuses Yūsuf first, the torn shirt decides, and he says ''Yūsuf, turn away from this, and you, ask forgiveness for your sin''. The husband''s verdict is the changed detail: revenge on the wife against hushing it up.'
- unit: ane-cth-342-1-2-ishtar-eavesdrops
  checked: [quran-28-moses-kills-and-flees, quran-39-pure-religion, quran-16-daughters-and-the-bee, quran-28-destroyed-towns-and-judgment]
  matches:
  - with: quran-28-moses-kills-and-flees
    motif: warner-overhears-plot-and-warns-target
    refs: ['CTH 342.1.2 §1:7', 'CTH 342.1.2 §1:8', 'CTH 342.1.2 §1:9', 'CTH 342.1.2 §2:10', 'CTH 342.1.2 §2:14', 'CTH 342.1.2 §2:15', 'CTH 342.1.2 §2:18', 'CTH 342.1.2 §2:19', 'CTH 342.1.2 §2:21']
    with_refs: ['28:20']
    relation: parallel
    record:
      agent: [Ištar, a man from the far end of the city]
      action: [hears the plot against the hero and hurries to warn him, hears the plot against the hero and hurries to warn him]
      recipient: ['the storm god, in the steppe', Mūsā]
      quoted: ['MUŠEN-iš iwar ... {d}10 ŠA {d}ašerti-wa', jāʾa rajulun min aqṣā l-madīnati yasʿā ... inna l-malaʾa yaʾtamirūna bika]
    note: 'Elkunirša hands the storm god to his wife: ''as your heart wishes, so treat him''. Ištar overhears what husband and wife say to each other, flies like a bird (MUŠEN-iš iwar) over the steppe, finds the storm god and warns him (''Storm god, ... of Ašertu ... do not drink wine''). In 28:20 a man comes running (yasʿā) from the far end of the city: ''the chiefs are conspiring against you (yaʾtamirūna bika) to kill you, so leave''. The warning text in the Hittite is broken.'
