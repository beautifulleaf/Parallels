- unit: ane-cth-345-2-c-ishtar-sings
  checked: [quran-7-single-soul-idols, quran-19-abraham-and-his-father, quran-2-three-groups, quran-12-joseph-full]
  matches:
  - with: quran-7-single-soul-idols
    motif: eyes-and-ears-that-do-not-perceive
    refs: ['CTH 345.I.2 §9:95', 'CTH 345.I.2 §9:97', 'CTH 345.I.2 §9:98', 'CTH 345.I.2 §9:99', 'CTH 345.I.2 §9:100']
    with_refs: ['7:193', '7:195', '7:198']
    relation: echo
    record:
      agent: [Ištar, those who call on idols]
      action: [addresses a stone that cannot hear or see, call on beings that cannot hear or see]
      object: [the diorite Ullikummi, the idols called on besides God]
      quoted: [LÚ-iš-wa duddudmiyanza nu-wa UL ištamašzi IGI.ḪI.A-wa-ma-wa-raš dašuwanza nu-wa UL aušzi, in tadʿūhum ilā l-hudā lā yasmaʿū wa-tarāhum yanẓurūna ilayka wa-hum lā yubṣirūn]
      outcome: [the singing is useless; she throws her instruments away, 'it is the same whether you call them or keep silent (7:193)']
    note: 'The wave asks Ištar ''before whom do you sing?'' and says of the stone ''the man is deaf and does not hear (UL ištamašzi), he is blind in the eyes and does not see (UL aušzi)''. 7:198: ''if you call them to guidance they do not hear (lā yasmaʿū); you see them looking at you but they do not see (lā yubṣirūn)''; 7:193 ''it is the same for you whether you call them or are silent''. A song or call addressed to a stone that neither hears nor sees.'
  - with: quran-19-abraham-and-his-father
    motif: eyes-and-ears-that-do-not-perceive
    refs: ['CTH 345.I.2 §9:97', 'CTH 345.I.2 §9:98', 'CTH 345.I.2 §9:99', 'CTH 345.I.2 §9:100']
    with_refs: ['19:42']
    relation: echo
    record:
      action: [addresses a stone that cannot hear or see, worships what cannot hear or see]
      quoted: [UL ištamašzi ... UL aušzi, mā lā yasmaʿu wa-lā yubṣiru]
    note: '''He does not hear (UL ištamašzi) ... he does not see (UL aušzi)'', said of the stone Ištar sings to; Abraham to his father: ''why do you worship what does not hear and does not see (mā lā yasmaʿu wa-lā yubṣiru)?''. The same pair of negated verbs for a stone addressed in vain.'
