  checked: [quran-21-cosmic-signs-and-scales, quran-2-throne-verse, quran-35-heirs-of-book, quran-22-signs-and-rites]
  matches:
  - with: quran-21-cosmic-signs-and-scales
    motif: heaven-earth-joined-then-parted
    refs: ['CTH 345.I.3.1 §22:217', 'CTH 345.I.3.1 §22:219', 'CTH 345.I.3.1 §24:233', 'CTH 345.I.3.1 §24:234']
    with_refs: ['21:30']
    relation: parallel
    record:
      agent: ['''they'' (the ancient gods, unnamed)', God (We)]
      action: [cut heaven and earth apart, split heaven and earth apart]
      object: [heaven and earth, the heavens and the earth]
      instrument: ['a copper cutting tool, the ancient saw (URUDU ardala)', null]
      quoted: [nepiš tekann-a kuēz arḫa kuerer, kānatā ratqan fa-fataqnāhumā]
    note: 'Upelluri: ''when heaven and earth were built on me ... when they cut heaven and earth apart with the cutting tool (URUDU kuruzzit arḫa kuerer)''; Ea has ''the ancient saw with which they cut heaven and earth apart (nepiš tekann-a kuēz arḫa kuerer)'' brought out. 21:30: ''the heavens and the earth were one closed mass (ratqan) and We split them apart (fa-fataqnāhumā)''. Same act on the same pair; the Hittite gives a tool and an unnamed ''they'', the Quran no tool and a first-person God.'
