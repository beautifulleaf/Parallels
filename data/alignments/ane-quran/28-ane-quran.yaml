- unit: ane-cth-345-1-e-sun-sees-refuses-food
  checked: [quran-11-abraham-guests, quran-51-dhariyat-abrahams-guests-and-the-peoples, quran-2-throne-verse, quran-21-against-other-gods]
  matches:
  - with: quran-51-dhariyat-abrahams-guests-and-the-peoples
    motif: divine-guests-do-not-eat
    refs: ['CTH 345.I.1 §22:235', 'CTH 345.I.1 §22:236', 'CTH 345.I.1 §22:237', 'CTH 345.I.1 §22:238', 'CTH 345.I.1 §22:239', 'CTH 345.I.1 §22:240', 'CTH 345.I.1 §22:241', 'CTH 345.I.1 §23:248']
    with_refs: ['51:25', '51:26', '51:27', '51:28']
    relation: parallel
    record:
      agent: [the Sun god of heaven, Abraham's honoured guests]
      action: [comes into the house and does not touch the food set before him, come into the house and do not touch the food set before them]
      recipient: [the storm god, Ibrāhīm]
      quoted: ['UL eszi ... UL eškit ... "nu-za UL ezatta?"', fa-qarrabahu ilayhim qāla a-lā taʾkulūn]
      outcome: [the guest brings word of a threat (Ullikummi), the guests bring word of a son and of the destruction of a people]
    note: 'A chair is set for the Sun god and he does not sit (UL ešat), a table is laid and he does not come near (UL šalikta), a cup is given and he does not put his lip to it; the storm god asks whether the chamberlain, table servant or cupbearer was at fault ''so that you did not eat (UL ezatta)?''. 51:26-28: Abraham brings a fat calf, sets it near them, ''will you not eat? (a-lā taʾkulūn)'', and fears them. Both guests then state their errand: the Sun god the monster in the sea, the envoys a son and a doomed people (51:28-32).'
  - with: quran-11-abraham-guests
    motif: divine-guests-do-not-eat
    refs: ['CTH 345.I.1 §22:238', 'CTH 345.I.1 §22:239', 'CTH 345.I.1 §22:240', 'CTH 345.I.1 §22:241']
    with_refs: ['11:69', '11:70']
    relation: parallel
    record:
      agent: [the Sun god of heaven, 'Abraham''s guests, God''s messengers']
      action: [does not touch the food set before him, do not reach for the food set before them]
      quoted: [nu-kan parā UL šalikta, raʾā aydiyahum lā taṣilu ilayhi]
    note: The table laid for the Sun god 'he did not come near (parā UL šalikta)'; in 11:70 Abraham sees that the guests' hands do not reach the roasted calf (aydiyahum lā taṣilu ilayhi) and is afraid. In both the refusal is the sign that the visit is about grave news.
- unit: ane-cth-345-2-a-sun-eats
  checked: [quran-11-abraham-guests, quran-51-dhariyat-abrahams-guests-and-the-peoples, quran-2-throne-verse, quran-7-closing-recitation]
  matches:
  - with: quran-11-abraham-guests
    motif: whether-the-heavenly-guests-eat
    refs: ['CTH 345.I.2 §4:15', 'CTH 345.I.2 §4:24', 'CTH 345.I.2 §4:26', 'CTH 345.I.2 §4:28', 'CTH 345.I.2 §4:30']
    with_refs: ['11:70']
    relation: divergence
    record:
      agent: [the Sun god of heaven, Abraham's guests]
      action: [eats and drinks once his errand is told, never eat]
      quoted: [nu-za ezzatta ... nu ekutta ... nepiši šarā pait, aydiyahum lā taṣilu ilayhi]
      outcome: [he goes back up to heaven after the meal, they say they are sent to the people of Lot]
    note: Once the storm god has heard him and said 'eat! (ezza) ... drink!', the Sun god rejoices, eats (ezzatta) and drinks (ekutta), and goes back up to heaven. In 11:70 the guests' hands never reach the calf, and no meal follows. The heavenly guest who first refuses food eats in the end in the Hittite; in the Quran he does not.
