- unit: ane-cth-336-3-inara-promised-land-and-man
  checked: [quran-12-joseph-full, quran-16-daughters-and-the-bee, quran-3-imran-mary-zechariah, quran-19-mary-and-jesus]
  matches:
  - with: quran-16-daughters-and-the-bee
    motif: deity-commands-the-bee
    refs: ['CTH 336.3 §5:20', 'CTH 336.3 §5:21', 'CTH 336.3 §5:22']
    with_refs: ['16:68', '16:69']
    relation: divergence
    record:
      agent: [the storm god, your Lord]
      action: [sends the bee with an order, reveals an order to the bee]
      recipient: [the bee, the bee]
      quoted: ['NIM.LÀL-an piyēt: īt-war-an zik šanḫa', wa-awḥā rabbuka ilā n-naḥli ani ttakhidhī ... thumma kulī ... fa-slukī]
      outcome: [the bee goes to search for the missing Inara, 'the bee builds, eats of all fruits and follows the ways']
    note: 'Anxious for Inara, the storm god sends the bee (NIM.LÀL-an piyēt): ''go, and you search for her! (īt-war-an zik šanḫa)'', and the bee goes (NIM.LÀL-aš pait). 16:68: ''your Lord revealed to the bee (awḥā ... ilā n-naḥl): take homes ... eat ... go along the ways''. A god gives the bee imperatives; the errand changes, from finding a lost goddess to the bee''s own life.'
