- unit: ane-cth-345-1-c-ullikummi-born-named
  checked: [quran-40-believer-of-pharaohs-family, quran-28-pharaoh-oppression-infant-moses, quran-3-imran-mary-zechariah, quran-19-zechariah-and-john]
  matches:
  - with: quran-28-pharaoh-oppression-infant-moses
    motif: infant-hidden-from-ruler-who-would-kill-it
    refs: ['CTH 345.I.1 §8:109', 'CTH 345.I.1 §8:111', 'CTH 345.I.1 §9:119', 'CTH 345.I.1 §9:121', 'CTH 345.I.1 §9:123', 'CTH 345.I.1 §9:125', 'CTH 345.I.1 §9:126']
    with_refs: ['28:4', '28:7', '28:8', '28:9']
    relation: divergence
    record:
      agent: ['Kumarbi, the father', 'Mūsā''s mother, inspired by God']
      action: [hides the newborn so the ruler may not see and kill him, casts the newborn on the water when she fears for him]
      place: ['the dark earth, then the sea on Upelluri''s shoulder', the river (al-yamm)]
      quoted: ['lē-ma-war-an aušzi {d}10-aš ... nu-war-an-kan lē kuenzi', fa-alqīhi fi l-yamm ... lā taqtulūhu]
      outcome: ['he grows hidden in the sea, unseen by the gods', 'Pharaoh''s household picks him up and raises him, ''to be an enemy and a grief to them''']
    note: 'The child is named and destined to strike the storm god, king of heaven (§8:109-111); Kumarbi asks ''to whom shall I give him? who will take him and treat him as a gift (uppiyaššar) ... and bring him into the dark earth? Let the storm god not see him; let him not kill him (lē kuenzi)''. 28:4-9: Pharaoh kills the sons; the mother is told to cast him into the yamm; Pharaoh''s household picks him up ''to be an enemy and a grief to them (ʿaduwwan wa-ḥazanan)'', and Pharaoh''s wife says ''do not kill him (lā taqtulūhu)''. The changed detail: the Hittite child is kept from the ruler''s sight, the Quranic one is raised in the ruler''s own house.'
