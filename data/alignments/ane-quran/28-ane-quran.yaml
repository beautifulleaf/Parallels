- unit: ane-cth-337-1-pirwa-eagle
  checked: [quran-12-joseph-full, quran-16-deniers-and-angels-of-death, quran-28-destroyed-towns-and-judgment, quran-6-prophet-consoled-signs, quran-27-solomon-ants-hoopoe-sheba]
  matches:
  - with: quran-27-solomon-ants-hoopoe-sheba
    motif: who-will-bring-it-here
    refs: ['CTH 337.1 §3:4', 'CTH 337.1 §4:5', 'CTH 337.1 §8:13', 'CTH 337.1 §9:15']
    with_refs: ['27:38', '27:39', '27:40']
    relation: parallel
    record:
      agent: [the Queen of the gods, Sulaymān]
      action: [asks her court who will bring the object here from far away, asks his court who will bring the object here from far away]
      recipient: [Pirwa's great ones (māyaš), the chiefs (al-malaʾ)]
      object: ['Pirwa''s eagle, from Ḫaššuwa', the queen of Sheba's throne]
      quoted: ['kuiš-war-an ḫaran {d}pirwaš URUḫaššuwaz uwatezzi ... ūk-war-an uwatemi', ayyukum yaʾtīnī bi-ʿarshihā ... anā ātīka bihi]
      outcome: ['volunteers answer: I bring him here', 'volunteers answer: I will bring it to you']
    note: 'The Queen of the gods speaks to Pirwa''s great ones (māyaš): ''who brings him, Pirwa''s eagle, here from Ḫaššuwa? (kuiš-war-an ... uwatezzi)'', and voices answer, each praised: ''I bring him here (ūk-war-an uwatemi)''. 27:38-40: Sulaymān to the chiefs (al-malaʾ): ''which of you will bring me her throne? (ayyukum yaʾtīnī bi-ʿarshihā)'', and an ʿifrīt and then one with knowledge of the Book answer ''I will bring it to you (anā ātīka bihi)''. Same question to the court, same first-person answers, repeated.'
  - with: quran-12-joseph-full
    motif: reward-for-bringing-the-lost-object
    refs: ['CTH 337.1 §4:5', 'CTH 337.1 §5:6', 'CTH 337.1 §5:7']
    with_refs: ['12:72']
    relation: echo
    record:
      agent: [the Queen of the gods, the king's men]
      action: [promises a reward to whoever brings back the lost object, promise a reward to whoever brings back the lost object]
      object: [Pirwa's eagle, the king's cup (ṣuwāʿ al-malik)]
      quoted: [kuiš ... uwatezzi ašši mekki aššu piyaweni, wa-li-man jāʾa bihi ḥimlu baʿīrin wa-anā bihi zaʿīm]
    note: '''Who brings him back ...? To him we will give much good (ašši mekki aššu piyaweni)''; in 12:72 ''we miss the king''s cup; for whoever brings it, a camel-load, and I guarantee it (wa-li-man jāʾa bihi ḥimlu baʿīrin)''. In the Quran the cup was planted (12:70), so the offer is a ruse.'
