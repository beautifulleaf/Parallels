# ANE x Quran side-by-side pass, chunk 28 (Hittite: CTH 334-346 vanished-god rituals, Inara, Pirwa, Elkunirsa, LAMMA, Kumarbi cycle). Judged blind, from the originals.
new_motifs:
  deity-commands-the-bee:
    label: 'A deity gives the bee an order: where to go and what to do'
    cluster: animals
  honey-within-the-roaming-bee:
    label: The bee goes through the mountains and all places, holding honey inside its body
    cluster: animals
  mothers-abandon-their-young-in-catastrophe:
    label: In the catastrophe mothers, cows or she-camels no longer care for their young
    cluster: judgment
  warner-overhears-plot-and-warns-target:
    label: Someone learns of a plot against the hero and hurries to warn him
    cluster: narrative
  who-will-bring-it-here:
    label: A ruler asks his court 'who will bring it (from far away)?' and a volunteer answers 'I will bring it'
    cluster: kingship
  reward-for-bringing-the-lost-object:
    label: A reward is promised to whoever brings back a lost or wanted object
    cluster: narrative
  kin-question-unexpected-labour:
    label: Her kin come to a woman in childbirth who was not expected to bear and ask her how this happened, naming her mother
    cluster: family
  cause-of-unexpected-pregnancy:
    label: What caused the pregnancy of one who was not expected to bear
    cluster: family
  infant-hidden-from-ruler-who-would-kill-it:
    label: A newborn destined to bring down a ruler is hidden so that the ruler does not see and kill it
    cluster: narrative
  husband-response-to-wifes-advances:
    label: How the husband answers when told of his wife's advances to the young man
    cluster: narrative
