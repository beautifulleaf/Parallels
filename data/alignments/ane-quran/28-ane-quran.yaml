- unit: ane-cth-346-5-mt-washitta-labour
  checked: [quran-19-mary-and-jesus, quran-11-abraham-guests, quran-33-hour-and-trust, quran-16-daughters-and-the-bee]
  matches:
  - with: quran-19-mary-and-jesus
    motif: kin-question-unexpected-labour
    refs: ['CTH 346.5 §2:19', 'CTH 346.5 §2:20', 'CTH 346.5 §2:21', 'CTH 346.5 §2:22', 'CTH 346.5 §2:23', 'CTH 346.5 §2:25']
    with_refs: ['19:27', '19:28']
    relation: parallel
    record:
      agent: [all the mountains, her people]
      action: [come to her and ask about the birth, meet her with the child and question her]
      recipient: [Mount Wašitta, Maryam]
      name: [null, sister of Hārūn]
      quoted: [kuwat tuḫḫaet ... UL-ma-an-takkan AMA-aš šer ḫašta, la-qad jiʾti shayʾan fariyyā ... wa-mā kānat ummuki baghiyyā]
    note: 'Wašitta goes into labour; all the mountains come to look and say: ''why are you in labour (kuwat tuḫḫaet)? From youth you have not known labour; the fate goddesses did not write it for you, your mother did not create it for you (AMA-aš šer ḫašta)''. 19:27-28: her people see Maryam with the child: ''you have brought a monstrous thing (shayʾan fariyyā) ... your father was not a bad man, your mother was not unchaste (mā kānat ummuki baghiyyā)''. Kin come to a woman not expected to bear and appeal to her mother.'
  - with: quran-19-mary-and-jesus
    motif: cause-of-unexpected-pregnancy
    refs: ['CTH 346.5 §2:27', 'CTH 346.5 §3:30', 'CTH 346.5 §3:31', 'CTH 346.5 §3:32']
    with_refs: ['19:17', '19:20']
    relation: divergence
    record:
      agent: [a stranger (LÚ UBARUM) who came into the mountains, 'the spirit, appearing as a well-formed man']
      action: [lay with her, announced a son; no man touched her]
      recipient: [Mount Wašitta, Maryam]
      quoted: [LÚ UBARUM mān ... nu-mu-za kattišši šašnut, lam yamsasnī basharun wa-lam aku baghiyyā]
    note: 'Wašitta answers: ''... came among the mountains like a stranger (LÚ UBARUM mān) and made me sleep with him; from then I began to be in labour''. Maryam: ''how shall I have a boy when no man has touched me (lam yamsasnī basharun) and I have not been unchaste?'' (19:20); the visitor was the spirit ''in the form of a well-formed man (basharan sawiyyan)'' (19:17). A visitor from outside comes before the unexpected birth; the Hittite has him lie with her, the Quran denies any man touched her.'
