  - quran-8-badr-help
  matches:
  - with: quran-8-badr-help
    motif: deed-disclaimed-and-ascribed-to-another
    refs:
    - CTH 413.1 §7:30
    - CTH 413.1 §7:31
    with_refs:
    - '8:17'
    relation: echo
    record:
      agent:
      - the builders
      - the believers; the Prophet
      action:
      - deny having built the temple
      - are told they did not kill, he did not throw
      name:
      - all the gods
      - God
      quoted:
      - UL anzāš uetummen, DINGIR.MEŠ=wa=rat ḫūmanteš ueter
      - fa-lam taqtulūhum wa-lākinna llāha qatalahum wa-mā ramayta idh ramayta wa-lākinna llāha ramā
    note: '§7:30-31 nu-wa-ra-at Ú-UL an-za-a-aš ú-e-tum-me-en / DINGIR{MEŠ}-wa-ra-at ḫu-u-ma-an-te-eš ú-e-te-er, ''not we built it; all the gods built it''; 8:17 fa-lam taqtulūhum wa-lākinna llāha qatalahum wa-mā ramayta idh ramayta wa-lākinna llāha ramā, ''you did not kill them, God killed them; you did not throw when you threw, God threw''. The same two-part formula: the human doers deny the deed they plainly did and ascribe it to the divine. The deed differs: building a temple, killing and throwing at Badr; and the gods (plural) against God.'
  - with: quran-57-hadid-iron-and-monasticism
    motif: iron-brought-down-from-heaven
    refs:
    - CTH 413.1 §9:44
    with_refs:
    - '57:25'
    relation: echo
    record:
      object:
      - black iron
      - iron
      action:
      - is brought from heaven
      - is sent down
      quoted:
      - AN.BAR GE₆ nepišaš nepišaz uter
      - wa-anzalnā l-ḥadīda fīhi baʾsun shadīdun
    note: §9:44 AN.BAR GE₆ ne-pí-ša-aš ne-pí-ša-az ú-te-er, 'black iron of heaven they brought from heaven' (meteoric iron) among the temple's materials, each from its land; 57:25 wa-anzalnā l-ḥadīda fīhi baʾsun shadīdun wa-manāfiʿu li-n-nās, 'and we sent down iron, in which is great might and uses for people'. Of all the metals only iron is said to come down from above, in both.
