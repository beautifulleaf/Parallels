- unit: ane-cth-414-1-15-eagle-spinners-renewal
  checked:
  - quran-35-originator
  - quran-7-children-of-adam
  - quran-3-badr-uhud
  - quran-36-trumpet-and-judgment
  - quran-27-solomon-ants-hoopoe-sheba
  matches:
  - with: quran-27-solomon-ants-hoopoe-sheba
    motif: bird-sent-out-returns-with-report
    refs:
    - CTH 414.1 §15:67
    - CTH 414.1 §15:70
    - CTH 414.1 §16:73
    - CTH 414.1 §16:74
    - CTH 414.1 §17:76
    - CTH 414.1 §17:78
    with_refs:
    - '27:20'
    - '27:22'
    - '27:23'
    - '27:24'
    relation: parallel
    record:
      agent:
      - the eagle
      - the hoopoe
      recipient:
      - the throne (Ḫalmašuitt)
      - Solomon
      action:
      - goes out to spy and reports what it saw
      - comes back and reports what it saw
      object:
      - the ancient goddesses kneeling and spinning
      - a woman ruling, with a mighty throne, worshipping the sun
      quoted:
      - šuwayaun=wa ... ašanzi
      - aḥaṭtu bi-mā lam tuḥiṭ bihi ... innī wajadtu mraʾatan tamlikuhum
    note: '§15:67-71 the throne calls the eagle: ''come, I send you to the sea; spy into the green forest (šu-ú-wa-ya) who is there''; §16:73-74 the eagle answers šu-wa-ya-u-un-wa, ''I watched: Išduštaya and Papaya, the ancient goddesses, kneel there'', and asked ''what are they doing?'' (§17:76) reports ''she holds a distaff, they hold full spindles''. 27:20-24: Solomon misses the hoopoe; it returns: aḥaṭtu bi-mā lam tuḥiṭ bihi wa-jiʾtuka min sabaʾin bi-nabaʾin yaqīn ... innī wajadtu mraʾatan tamlikuhum ... wa-lahā ʿarshun ʿaẓīm, ''I found a woman ruling them... she has a mighty throne''. A bird in the service of a throne goes far, looks, and reports female figures (goddesses spinning; a queen) to its master, with a throne on each side (the speaking throne; the queen''s ʿarsh). In the Hittite the bird is sent, in the Quran it goes unbidden and is missed.'
- unit: ane-cth-414-1-34-foundation-hearth-analogies
  checked:
  - quran-14-parables-and-satans-speech
  - quran-56-waqia-three-classes-and-the-garden
  - quran-80-frowned
