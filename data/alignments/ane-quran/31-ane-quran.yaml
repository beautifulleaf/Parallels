    motif: tree-rooted-below-branching-above-likened-to-words
    refs:
    - CTH 414.1 §50:209
    - CTH 414.1 §50:210
    - CTH 414.1 §51:213
    - CTH 414.1 §51:214
    - CTH 414.1 §51:215
    - CTH 414.1 §51:216
    with_refs:
    - '14:24'
    - '14:25'
    relation: echo
    record:
      object:
      - the vine; the evergreen eya-tree
      - a good tree
      action:
      - sends roots down and shoots up; never sheds its leaves
      - root firm, branch in the sky; gives its fruit every season
      recipient:
      - the king and queen and their words
      - a good word
      quoted:
      - katta šurkuš šarā=ma=wa maḫluš ... uddār ... uktūri ēšdu
      - aṣluhā thābitun wa-farʿuhā fī s-samāʾi tuʾtī ukulahā kulla ḥīnin
    note: '§50:209 ''as the vine sends roots downward (katta šurkuš) and shoots upward (šarā ... maḫluš)'', so the king and queen; §51:213-216 ''as the eya-tree is ever growing and does not shed its leaves, so may they flourish and may their words (uddār) be ever-lasting (uktūri)''. 14:24-25 kalimatan ṭayyibatan ka-shajaratin ṭayyibatin aṣluhā thābitun wa-farʿuhā fī s-samāʾi tuʾtī ukulahā kulla ḥīnin, ''a good word is like a good tree: its root firm, its branch in the sky, it gives its fruit at every season''. The same likeness: roots below and growth above, never failing, applied to words. In the Hittite it is a building blessing on the royal couple; in the Quran a parable of the good word.'
