# ANE x Quran side-by-side pass, chunk 31 (Hittite: CTH 404-418 and 757 rituals; Northwest Semitic inscriptions: Arad, Elephantine, KAI Phoenician, Moabite, Aramaic and Hebrew, Ketef Hinnom, Khirbet el-Qom, Kuntillet Ajrud). Judged blind, from the originals.
new_motifs:
  deed-disclaimed-and-ascribed-to-another:
    label: 'A speaker denies having done the deed himself and ascribes it to a higher agent: ''not I (we) did it, but X did it'''
    cluster: deity
  iron-brought-down-from-heaven:
    label: Iron is said to have been brought or sent down from heaven
    cluster: creation
  bird-sent-out-returns-with-report:
    label: A bird at a ruler's command goes out to a far place, looks, and comes back to report what it saw there
    cluster: animals
  tree-rooted-below-branching-above-likened-to-words:
    label: A tree with roots below and shoots or branches above, ever bearing, is the likeness for words (or persons) that endure
    cluster: nature
  sacred-place-admits-no-other-god:
    label: 'A sanctuary or place of worship belongs to one deity: no other god is to be admitted or invoked there'
    cluster: cult
  locusts-and-lice-sent-as-punishment:
    label: Locusts and lice (ʾrbh, qml / jarād, qummal) are sent on a land as punishment
    cluster: judgment
  dwelling-turned-upside-down:
    label: A dwelling or town is overturned so that its top and bottom are exchanged
    cluster: judgment
  mountains-crushed-when-god-appears:
    label: When God shines forth or appears, the mountains are crushed (d-k-k)
    cluster: deity
  orphan-and-who-cares-for-him:
    label: A speaker or addressee is an orphan; who (if anyone) cares for him [shared matter]
    cluster: family
  god-sends-foreign-oppressor-on-own-people-then-restores:
    label: Because of his people's offence their own god lets a foreign power oppress them for a time, and later gives the land (or the upper hand) back
    cluster: history
  divine-command-to-go-and-take-a-land:
    label: God commands a leader or people to go and take a city or land [shared matter]
    cluster: history
  marrying-a-slave-woman-with-her-owners-consent:
    label: A man marries a slave woman by leave of her owner and with a payment
    cluster: law
  payment-when-a-marriage-is-dissolved:
    label: What is paid, kept or given back when a marriage is dissolved, and by whom [shared matter]
    cluster: law
  night-evil-set-against-daybreak:
    label: Protection against beings or evil of the night, invoked with the coming of dawn
    cluster: magic
  harmful-eye:
    label: The eye (gaze) as a harmful force against a person
    cluster: magic
  fear-not-i-am-with-you:
    label: God tells the threatened one 'do not fear, I am with you' (and will deliver you)
    cluster: deity
  besieged-appeal-to-god-and-are-answered:
    label: Hard pressed by a superior enemy, a leader or army calls on God and God answers
    cluster: deity
  whatever-was-asked-was-given:
    label: '''Whatever I (you) asked, God (the gods) gave'''
    cluster: deity
  stretching-out-the-hand-to-kill-a-kinsman:
    label: Stretching out the hand to kill a kinsman or brother
    cluster: family
  lowly-substance-of-mortal-man:
    label: Man described by the lowly bodily substance he is made of [shared matter]
    cluster: creation
