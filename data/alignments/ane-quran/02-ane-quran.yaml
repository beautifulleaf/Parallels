  - unit: ane-etcsl-1-8-2-1-a-hymn-to-utu
    checked: [quran-58-mujadila-zihar-and-secret-counsel, quran-9-cave-and-call, quran-13-signs-of-creation, quran-41-steadfast-and-repel-evil]
    matches:
      - with: quran-58-mujadila-zihar-and-secret-counsel
        motif: deity-as-one-more-of-a-company
        refs: ["ETCSL 1.8.2.1 A:245", "ETCSL 1.8.2.1 A:246"]
        with_refs: ["58:7"]
        relation: parallel
        record:
          agent: ["Utu", "God"]
          number: ["the third of two", "the fourth of three, the sixth of five"]
          recipient: ["him who walks alone; those who travel in pairs", "those who confer in secret, fewer or more"]
          quoted: ["{d}utu lu2 2 du 3-kam-ma-bi za-e-me-en", "mā yakūnu min najwā thalāthatin illā huwa rābiʿuhum"]
        note: "The deity counted as one more of a human company: 'to him who walks alone you are his brother; Utu, you are the third of those who go in pairs' (3-kam-ma-bi); 58:7 'there is no secret talk of three but He is their fourth (rābiʿuhum), nor of five but He is their sixth, nor fewer nor more but He is with them'. Utu accompanies travellers; in 58:7 God knows and will report what they said."
      - with: quran-9-cave-and-call
        motif: deity-as-one-more-of-a-company
        refs: ["ETCSL 1.8.2.1 A:246"]
        with_refs: ["9:40"]
        relation: echo
        record:
          agent: ["Utu", "God"]
          number: ["the third of two travellers", "with the second of two"]
          quoted: ["{d}utu lu2 2 du 3-kam-ma-bi za-e-me-en", "thāniya thnayni idh humā fī l-ghāri ... inna llāha maʿanā"]
