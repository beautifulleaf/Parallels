    checked: [quran-71-noah, quran-35-heirs-of-book, quran-23-death-barzakh-judgment, quran-21-cosmic-signs-and-scales]
    matches:
      - with: quran-21-cosmic-signs-and-scales
        motif: flood-hero-and-immortality
        refs: ["ETCSL 1.8.1.3 3.F:30", "ETCSL 1.8.1.3 3.F:33", "ETCSL 1.8.1.3 3.F:34", "ETCSL 1.8.1.3 3.F:35", "ETCSL 1.8.1.3 3.F:37"]
        with_refs: ["21:34", "21:35"]
        relation: divergence
        record:
          agent: ["the gods, by an oath sworn by heaven and earth", "God"]
          action: ["rule that no human will live forever any more", "has granted no human before the Prophet everlasting life"]
          name: ["Zi-ud-sura", null]
          quoted: ["ud-bi-ta nam-lu2-ulu3-ur2 nu-mu-til3-am3", "wa-mā jaʿalnā li-basharin min qablika l-khuld"]
          outcome: ["one human, Zi-ud-sura, did live on; the gods ask whether Gilgameš may escape through his mother", "no exception: a-fa-in mitta fa-humu l-khālidūn, every soul tastes death"]
        note: "Same ruling on human immortality, with the exception changed. Enki recalls that after the flood only Zi-ud-sura 'although a human' (nam-lu2-ulu3) stayed alive, and then the gods swore that no human would live (nu-mu-til3) again; they then ask whether Gilgameš, son of a goddess, might escape. 21:34-35: 'We have not given any human (bashar) before you everlasting life (al-khuld): if you die, will they be everlasting?' and 'every soul tastes death'. Sumerian names one exception and debates a second; the Quran admits none."
