        refs: ["ETCSL 1.8.1.5 50", "ETCSL 1.8.1.5 52", "ETCSL 1.8.1.5 53"]
        with_refs: ["48:11"]
        relation: contrast
        record:
          agent: ["Gilgameš", "the bedouin who stayed behind"]
          action: ["sends home every man who has a household or a mother", "plead that their goods and families kept them"]
          quoted: ["e2 tuku e2-a-ni-še3 ama tuku ama-a-ni-še3", "shaghalatnā amwālunā wa-ahlūnā"]
          outcome: ["only fifty bachelors go with him", "the excuse is rejected: they say with their tongues what is not in their hearts"]
        note: "The household as a reason not to march: Gilgameš proclaims by horn 'whoever has a household, to his household; whoever has a mother, to his mother' and takes only unattached men (nitaḫ saĝ-dili). The bedouin left behind (al-mukhallafūn) say 'our goods and our families (ahlūnā) kept us busy, ask forgiveness for us', and 48:11 calls this a lie."
