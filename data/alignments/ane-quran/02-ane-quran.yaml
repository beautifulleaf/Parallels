          outcome: ["I am second to you, from conception I was not your equal", "we were in the wrong"]
        note: "The loser's formal concession names the deity's choice of the winner: 'Inana has truly chosen you for her holy lap ... you are the older brother (šeš-gal), I cannot match you ever'; Joseph's brothers, 'by God, God has preferred you (āthaka) over us, and we were sinners'. The winner is styled the elder brother in Sumerian; in Surah 12 he is the younger brother the elders wronged."
