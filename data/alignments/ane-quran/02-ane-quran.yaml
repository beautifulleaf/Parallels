        motif: orphan-raised-by-the-deity
        refs: ["ETCSL 1.8.1.5 155", "ETCSL 1.8.1.5 156"]
        with_refs: ["93:6"]
        relation: echo
        record:
          agent: ["Utu", "God"]
          recipient: ["Ḫuwawa", "the Prophet"]
          action: ["brought him up", "gave him shelter"]
          quoted: ["ama tud-da-ĝu10 nu-um-zu a-a buluĝ3-ĝa2-ĝu10 nu-um-zu ... za-e mu-un-buluĝ3-e", "a-lam yajidka yatīman fa-āwā"]
        note: "One without parents raised by the god, said to that god: Ḫuwawa, 'Utu, I never knew a mother who bore me nor a father who brought me up; I was born in the mountains, you brought me up'; 93:6 'did He not find you an orphan and shelter you?'. A plea for life in Sumerian, a consolation in the Quran."
      - with: quran-47-muhammad-battle-and-rivers
        motif: release-of-a-bound-captive
        refs: ["ETCSL 1.8.1.5 152aa", "ETCSL 1.8.1.5 152bb", "ETCSL 1.8.1.5 161", "ETCSL 1.8.1.5 162", "ETCSL 1.8.1.5 179"]
        with_refs: ["47:4"]
        relation: contrast
        record:
          agent: ["Gilgameš would free him, Enkidu kills him", "the believers"]
          action: ["bind the captive, then free him or cut his throat", "strike the necks, then bind fast, then free by grace or ransom"]
          quoted: ["am dab5-ba-gin7 saman bi2-in-šub ... mušen dab5-ba ki-bi-še3 ḫa-ba-du ... gu2-ni im-ma-an-kud", "fa-ḍarba r-riqāb ... fa-shuddū l-wathāqa fa-immā mannan baʿdu wa-immā fidāʾan"]
          outcome: ["release refused and the captive's throat cut", "release by grace or ransom allowed once the enemy is subdued"]
        note: "The bound captive, release or the neck: Ḫuwawa is haltered like a wild bull and his arms tied; Gilgameš pities him, 'let the captured bird go home, the captured man return to his mother's lap', but Enkidu warns against it and cuts his neck (gu2-ni im-ma-an-kud). 47:4: 'strike the necks (ḍarb al-riqāb) until you have subdued them, then bind fast the bonds (al-wathāq), then either grace (mann) afterwards or ransom'."
