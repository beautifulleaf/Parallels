        refs: ["ETCSL 1.8.1.5.1 12", "ETCSL 1.8.1.5.1 13"]
        with_refs: ["17:37"]
        relation: echo
        record:
          agent: ["no man", "you (the hearer)"]
          action: ["no tall one blocks off the kur, no broad one covers the kur", "cannot pierce the earth, cannot reach the mountains in height"]
          quoted: ["sud-da kur-ra la-ba-an-gib-be2-a / daĝal-la kur-ra la-ba-an-šu2-šu2-a", "lan takhriqa l-arḍa wa-lan tablugha l-jibāla ṭūlā"]
