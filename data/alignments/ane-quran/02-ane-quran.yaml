          quoted: ["MUŠ3.KA.UL e2-kurun2 ... ma-mu2 id2 mud-še3 mu-un-gir5-gir5", "innī arānī aʿṣiru khamran ... fa-yasqī rabbahu khamran"]
          outcome: ["the king's fall and the cupbearer's rise", "he will pour wine for his lord again"]
        note: "The dream of a royal wine-servant: Sargon, 'the cupbearer of Ezina's wine-house (e2-kurun2)', lies down to dream and sees Inana drown Ur-Zababa in a river of blood; the king asks him 'cupbearer, was a dream revealed to you in the night?'. In 12:36-41 one of the two youths dreams 'I press wine' and Joseph reads that he will again give his lord wine to drink, while the other will be crucified. The king also dreams in both (2.1.4 B:2-3; 12:43)."
