# ANE x Quran side-by-side pass, chunk 2 (ETCSL 1.8.1.3 - 2.1.7). Judged blind, from the originals.
new_motifs:
  heaven-and-earth-separated-at-the-beginning: {label: "At the beginning heaven and earth, once together, were separated", cluster: creation}
  whether-sons-avail-the-dead: {label: "Whether a man's sons (and wealth) help him after death", cluster: afterlife}
  human-height-against-heaven-and-mountains: {label: "No man is tall enough to reach heaven or the mountains, or broad enough to cover the earth", cluster: mortality}
  household-as-ground-to-stay-from-campaign: {label: "Household, wife or family as a ground for staying behind from a campaign", cluster: war}
  seven-and-their-eighth: {label: "A group of seven with one more counted as 'their eighth'", cluster: number}
  deity-as-one-more-of-a-company: {label: "The deity is the one more of a company: third of two, fourth of three", cluster: deity}
  sacrifice-commanded-in-a-dream: {label: "A sacrifice is commanded in a dream and carried out on waking", cluster: ritual}
  who-consumes-the-sacrifice: {label: "Whether the deity eats the offered flesh, or the offerers and the poor do", cluster: ritual}
  heaven-and-earth-held-in-a-hand: {label: "Heaven and earth held in a hand or under the feet", cluster: deity}
  favoured-destiny-hidden-from-brothers: {label: "A youth is told not to reveal his favoured destiny or dream to his brothers", cluster: family}
  night-journey-to-a-distant-sanctuary: {label: "A swift journey by night ends at a distant sanctuary", cluster: journey}
  diversity-of-human-languages: {label: "The many languages of mankind and the deity's part in them", cluster: creation}
  messenger-s-heavy-tongue: {label: "A messenger's heavy or knotted tongue and its remedy", cluster: prophets}
  conjured-creature-devours-rival-s: {label: "In a contest of magic each side throws, and one side's creature seizes or swallows the other's", cluster: magic}
  fate-of-the-defeated-magician: {label: "What the defeated magician says and what is done to him", cluster: magic}
  reward-promised-to-the-court-magician: {label: "The ruler pays or promises a reward to the magician who will defeat his rival", cluster: magic}
  how-a-deity-speaks-with-a-human: {label: "The modes in which a deity speaks with a human: dream, waking speech, revelation, veil, messenger", cluster: revelation}
  rival-concedes-divine-preference: {label: "The defeated rival concedes that the deity has preferred the other over him", cluster: kingship}
  years-counted-before-the-flood: {label: "A span of years counted up to the flood, then 'the flood swept over / took them'", cluster: flood}
  a-mortal-ascends-to-heaven: {label: "A mortal ascends into heaven", cluster: kingship}
  destroyed-city-left-uninhabited: {label: "The destroyed city stays unsettled: no one dwells there after", cluster: judgment}
  savage-people-let-loose-from-the-heights: {label: "A savage people is let loose and pours down from the mountains or heights", cluster: judgment}
  time-when-the-fates-are-decided: {label: "A set day or night on which the fates or every matter are decided", cluster: time}
  sign-on-the-arm-of-the-commissioned: {label: "The deity gives the one he commissions a sign on his arm or hand", cluster: prophets}
  orphan-raised-by-the-deity: {label: "One without mother or father is raised or sheltered by the deity", cluster: family}
  release-of-a-bound-captive: {label: "Whether a bound captive is released or killed", cluster: war}
  dream-of-a-royal-cupbearer: {label: "A royal cupbearer has a dream that foretells his own and others' fates", cluster: dreams}
