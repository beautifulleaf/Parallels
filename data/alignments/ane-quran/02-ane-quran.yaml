        note: "The primeval separation of heaven from earth: Sumerian 'when heaven had been separated (ba9-ra2) from earth, when earth had been delimited (sur) from heaven', a passive time-clause in the prologue; 21:30 'the heavens and the earth were sewn together (ratq) and We split them (fataqnā)', an argument addressed to the unbelievers. The Quran adds the prior joined state and names the agent."
