        refs: ["ETCSL 1.8.1.4 1:8", "ETCSL 1.8.1.4 1:9"]
        with_refs: ["21:30"]
        relation: parallel
        record:
          agent: [null, "God"]
          action: ["heaven separated from earth", "heavens and earth split apart"]
          object: ["heaven and earth", "the heavens and the earth"]
          quoted: ["an ki-ta ba-da-ba9-ra2-a-ba / ki an-ta ba-da-sur-ra-a-ba", "kānatā ratqan fa-fataqnāhumā"]
