  - unit: ane-etcsl-1-8-1-5-resolve-and-plea-to-utu
    checked: [quran-21-cosmic-signs-and-scales, quran-26-hud-ad, quran-11-noah, quran-71-noah, quran-17-commandments]
    matches:
      - with: quran-17-commandments
        motif: human-height-against-heaven-and-mountains
        refs: ["ETCSL 1.8.1.5 28", "ETCSL 1.8.1.5 29"]
        with_refs: ["17:37"]
        relation: echo
        record:
          agent: ["no man", "you (the hearer)"]
          action: ["cannot reach heaven by his height, cannot stretch over the mountains by his breadth", "cannot pierce the earth, cannot reach the mountains in height"]
          quoted: ["lu2 sukux-ra2 an-še3 nu-mu-un-da-la2 / lu2 daĝal-la kur-ra la-ba-an-šu2-šu2", "innaka lan takhriqa l-arḍa wa-lan tablugha l-jibāla ṭūlā"]
          outcome: ["so Gilgameš resolves to set up his name in the mountains", "so do not walk the earth exultantly (maraḥan)"]
        note: "The same two-part saying on human size, height and breadth set against heaven, mountains and earth: sukux-ra2 'tall' ... an-še3 'to heaven', daĝal-la 'broad' ... kur-ra 'the mountains'; ṭūlan 'in height' ... al-jibāl, and al-arḍ. In Gilgameš it moves a mortal to win renown; in 17:37 it forbids arrogance."
  - unit: ane-etcsl-1-8-1-5-seven-warriors-muster
