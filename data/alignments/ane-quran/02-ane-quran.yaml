        with_refs: ["26:88", "26:89"]
        relation: divergence
        record:
          object: ["his sons, counted one to seven", "wealth and sons"]
          place: ["the netherworld", "the day they are raised"]
          quoted: ["lu2 dumu-ni 7-am3 ... dub-us2 diĝir-re-e-ne-ke4 {ĝiš}gu-za ib2-tuš", "yawma lā yanfaʿu mālun wa-lā banūn"]
          outcome: ["the more sons the better his lot: the father of one weeps, the father of seven sits on a throne among the gods", "sons do not help: only one who comes with a sound heart (qalb salīm)"]
        note: "Enkidu's report grades the dead by number of sons: one son, he weeps at the peg in his wall; seven sons, he sits on a throne as companion of the gods and hears judgments. Abraham's prayer in 26:88-89 names the day 'on which neither wealth nor sons (banūn) avail, except him who comes to God with a sound heart'. Same measure (sons) for the dead man's lot, opposite valuation."
