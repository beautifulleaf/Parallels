    note: 'Ḫuwarlu the augur: ''if there are terrible birds (ḫatugaēš MUŠEN.ḪI.A)'', clay birds are made and sealed in oil bowls, seeds roasted and quenched, and ''quench the terrible birds! as these seeds are quenched, so may the evil words and the terrible birds be quenched''. 27:47: Thamūd say ''iṭṭayyarnā bika'', we take you for an ill omen (literally: we take bird-omen of you), and Ṣāliḥ answers ''ṭāʾirukum ʿinda llāh'', your bird (omen) is with God. Bird as omen on both sides; the rite disposes of it, the prophet places it with God.'
