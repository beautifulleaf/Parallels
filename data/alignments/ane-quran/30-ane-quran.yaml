    motif: deity-and-sleep
    refs: ['CTH 386.1 §2:9', 'CTH 386.1 §2:10']
    with_refs: ['2:255']
    relation: response
    record:
      agent: [the Storm god of Nerik, God]
      action: [is woken from pleasant dreams, is not seized by slumber or sleep]
      instrument: [a pleasant message called like a bird, null]
      quoted: [šanezziyaz tešḫaz šarā arnuddu (let her wake him from pleasant dreams), lā taʾkhudhuhu sinatun wa-lā nawm]
    note: '§2:9-10: Zaḫpuna is to call a pleasant message to the Storm god of Nerik ''like a bird'' (MUŠEN GIM-an) ''and wake the Storm god of Nerik from pleasant dreams (šanezziyaz tešḫaz šarā arnuddu)''. 2:255: ''al-ḥayyu l-qayyūmu lā taʾkhudhuhu sinatun wa-lā nawm'', neither slumber nor sleep seizes him.'
  - with: quran-2-abrogation-polemic
    motif: where-the-god-is-sunrise-or-sunset
    refs: ['CTH 386.1 §2:11', 'CTH 386.1 §2:12', 'CTH 386.1 §2:13', 'CTH 386.1 §2:14', 'CTH 386.1 §2:15']
    with_refs: ['2:115']
    relation: divergence
    record:
      agent: [the Storm god of Nerik, God]
      place: ['sunrise and sunset, heaven, the dark earth, the mountains', the east and the west]
      action: [must be called to come from wherever he is, is there wherever you turn]
      quoted: ['eḫu=wa … ṢĒT dUTU-aš ŠÚ.A dUTU-aš (come … from sunrise, from sunset)', wa-lillāhi l-mashriqu wa-l-maghribu fa-aynamā tuwallū fa-thamma wajhu llāh]
    note: 'The god''s whereabouts given as sunrise and sunset. Nerik prayer: ''come, Storm god of Nerik, (from) sunrise (and from) sunset (ṢĒT dUTU-aš ŠÚ.A dUTU-aš)! come from heaven!'', ''if you are with the Storm god your father, or if you are down in the dark earth with Ereškigal your mother, come in the morning to your festival''. 2:115: ''to God belong the east and the west; wherever you turn, there is the face of God''. The Hittite god is far off and has to be fetched; God is already facing the worshipper wherever he turns.'
