- unit: ane-cth-384-1-10-puduhepa-zintuhi-mezzulla-zippalanda
  checked: [quran-39-pure-religion, quran-10-ingratitude-sea, quran-2-throne-verse, quran-63-munafiqun-propped-timbers]
  matches:
  - with: quran-39-pure-religion
    motif: intercession-by-the-deity-s-court
    refs: ['CTH 384.1 §11:127', 'CTH 384.1 §13:133', 'CTH 384.1 §13:137', 'CTH 384.1 §13:138']
    with_refs: ['39:3']
    relation: response
    record:
      agent: ['Zintuḫi, Mezzulla, the Storm god of Zippalanda', the protectors taken besides God]
      action: [carry the petition on to the high gods, bring the worshippers near to God]
      recipient: [the Storm god and the Sun goddess of Arinna, God]
      quoted: [parā arnut (bring it further), mā naʿbuduhum illā li-yuqarribūnā ilā llāhi zulfā]
      outcome: [the plea reaches the high gods, God will judge between them; he does not guide the liar]
    note: 'Puduḫepa asks the lesser deities, children and grandchildren of the high pair, to take her plea further: to Zintuḫi ''to the Storm god, your grandfather, and the Sun goddess of Arinna, your grandmother, bring (it) further (parā arnut)''; to Mezzulla ''transmit them for me and bring them further to the Storm god your father and the Sun goddess your mother''. 39:3 quotes those who take protectors besides God: ''mā naʿbuduhum illā li-yuqarribūnā ilā llāhi zulfā'', we worship them only so that they bring us near to God, and rejects it.'
  - with: quran-10-ingratitude-sea
    motif: intercession-by-the-deity-s-court
    refs: ['CTH 384.1 §13:133', 'CTH 384.1 §13:134', 'CTH 384.1 §13:135', 'CTH 384.1 §13:138']
    with_refs: ['10:18']
    relation: response
    record:
      agent: [Mezzulla, the beings worshipped besides God]
      action: [speaks for the petitioner to her father and mother, are called intercessors with God]
      quoted: [Ú-UL-at-kán waḫnuwanzi (they do not turn it back), hāʾulāʾi shufaʿāʾunā ʿinda llāh]
      outcome: [the high gods hear and do not refuse, they neither harm nor benefit]
    note: '''What you, Mezzulla, say to the Storm god your father and the Sun goddess your mother, they hear it; they do not turn it back (Ú-UL-at-kán waḫnuwanzi)''. 10:18: they worship what neither harms nor benefits them ''wa-yaqūlūna hāʾulāʾi shufaʿāʾunā ʿinda llāh'', and say these are our intercessors with God; ''do you inform God of what he does not know?'''
  - with: quran-2-throne-verse
    motif: intercession-by-the-deity-s-court
    refs: ['CTH 384.1 §13:134', 'CTH 384.1 §13:135', 'CTH 384.1 §15:144', 'CTH 384.1 §15:145']
    with_refs: ['2:255']
    relation: divergence
    record:
      agent: ['Mezzulla, the Storm god of Zippalanda', whoever would intercede]
      action: [speaks for the petitioner before the high gods, intercedes with God]
      quoted: [Ú-UL-at-kán waḫnuwanzi (they do not turn it back), man dhā lladhī yashfaʿu ʿindahu illā bi-idhnihi]
      outcome: [the word of the beloved child is never refused, no one intercedes except by his leave]
    note: 'The intercessor''s standing before the high god. Puduḫepa: what Mezzulla, and the Storm god of Zippalanda, the ''beloved son'', say to their father and mother ''they hear it, they do not turn it back'' (§13:134-135, §15:144-145). 2:255: ''man dhā lladhī yashfaʿu ʿindahu illā bi-idhnihi'', who is it that intercedes with him except by his leave? The intercessor''s word cannot fail on one side; on the other it can be spoken only if he permits.'
