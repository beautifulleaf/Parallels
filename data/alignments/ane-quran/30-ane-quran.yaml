    note: 'Ḫantitaššu''s litany to the Sun god: ''take all the seeds'', ''take the gold (GUŠKIN dā), but give the ritual patron back to me (EN SISKUR=ma=mu EGIR-pa pāi)'', and the same for lapis, carnelian and other stones. 3:91: of those who die as unbelievers ''lan yuqbala min aḥadihim milʾu l-arḍi dhahaban wa-lawi ftadā bihi'', an earthful of gold would not be accepted from any of them even if he offered it as ransom. Gold is offered to the deity for a man''s life on both sides; the Hittite rite expects the god to take it, the verse says it will not be accepted.'
