      quoted: [ḫatugaēš MUŠEN.ḪI.A, wa-kulla insānin alzamnāhu ṭāʾirahu fī ʿunuqihi]
      outcome: [removed by the rite, brought out as a book on the Day of Resurrection]
    note: 'The ''terrible birds'' of ill omen are quenched and thrust out of the palace by the gods'' heralds (§3:16-22). 17:13: ''wa-kulla insānin alzamnāhu ṭāʾirahu fī ʿunuqihi'', every man''s bird we have fastened on his neck, and on the Day of Resurrection it is brought out as a book spread open. The bird-omen that a rite can remove is, in the verse, bound to the person and becomes his record.'
