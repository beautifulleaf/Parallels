    refs: ['CTH 386.8 §2:5']
    with_refs: ['6:14']
    relation: response
    record:
      agent: [the gods, God]
      action: [are thirsty and hungry, feeds and is not fed]
      quoted: ['kanirwandaš kištuwandaš ḫurdandaš išḫaḫruwandaš (thirsty, hungry, wounded, weeping)', wa-huwa yuṭʿimu wa-lā yuṭʿam]
    note: '§2:5: ''come, Storm god of Nerik, my lord, away from the thirsty, hungry, wounded, weeping gods (kanirwandaš kištuwandaš ḫurdandaš išḫaḫruwandaš)''. 6:14: ''shall I take a protector other than God, originator of the heavens and the earth, wa-huwa yuṭʿimu wa-lā yuṭʿam'', who feeds and is not fed. Fragmentary: whether the adjectives in §2:5 describe the gods is the editor''s reading.'
