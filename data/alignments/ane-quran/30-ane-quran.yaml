- unit: ane-cth-384-1-1-puduhepa-nerik-history
  checked: [quran-17-moses-nine-signs-and-close, quran-7-names-and-hour, quran-2-abraham-kaaba, quran-22-abraham-house-pilgrimage, quran-3-imran-mary-zechariah]
  matches:
  - with: quran-17-moses-nine-signs-and-close
    motif: the-names-of-the-god-and-who-gives-them
    refs: ['CTH 384.1 §2:3', 'CTH 384.1 §2:4', 'CTH 384.1 §2:5']
    with_refs: ['17:110']
    relation: divergence
    record:
      agent: [the Sun goddess of Arinna, God]
      action: [takes one name in Ḫatti and another in the cedar land, may be called by either name]
      name: [Sun goddess of Arinna; Ḫepat, Allāh; al-Raḥmān]
      quoted: [ŠUM-an daišta (you gave yourself the name), ayyan mā tadʿū fa-lahu l-asmāʾu l-ḥusnā]
      outcome: [the name changes with the land, all the names are his]
    note: 'One deity, two names. Puduḫepa: in Ḫatti ''you gave yourself the name (ŠUM-an daišta) Sun goddess of Arinna'', and in the land you made the land of cedar ''you gave yourself the name Ḫepat''. 17:110: ''qul idʿū llāha awi dʿū r-raḥmāna ayyan mā tadʿū fa-lahu l-asmāʾu l-ḥusnā'', call on Allāh or call on al-Raḥmān, whichever you call, his are the most beautiful names. The two names go with two lands in the prayer; in the Quran they are both for the same caller to use.'
  - with: quran-3-imran-mary-zechariah
    motif: sacred-office-assigned-by-lot
    refs: ['CTH 384.1 §2:11']
    with_refs: ['3:44']
    relation: divergence
    record:
      action: [is allotted by lot to the god's service, lots cast over who will take charge of Mary]
      object: [the prince Ḫattušili as priest, Mary dedicated to God]
      instrument: [the lot, their pens]
      quoted: [pulaz … ḫaptat (was allotted by lot), yulqūna aqlāmahum ayyuhum yakfulu maryam]
    note: '§2:11: ''that one too (Ḫattušili) was allotted by lot (pu-la-a[z?] … ḫaptat) to the Storm god of Nerik, your beloved son'' as his priest. 3:44: ''idh yulqūna aqlāmahum ayyuhum yakfulu maryam'', when they cast their pens (lots) over which of them would take charge of Mary, who was vowed to God (3:35). On one side the lot picks who serves the god; on the other it picks the guardian of the one dedicated. The Hittite ''by lot'' is partly restored (pu-la-a[z?]).'
