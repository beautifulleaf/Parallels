- unit: ane-cth-385-9-tudhaliya-confession-festivals
  checked: [quran-9-months-nasi, quran-7-adam-iblis, quran-63-munafiqun-propped-timbers, quran-5-jesus-miracles-table]
  matches:
  - with: quran-9-months-nasi
    motif: sacred-time-shifted-forbidden
    refs: ['CTH 385.9 §1:5', 'CTH 385.9 §1:13', 'CTH 385.9 §1:14', 'CTH 385.9 §1:15']
    with_refs: ['9:36', '9:37']
    relation: parallel
    record:
      agent: [the king Tudḫaliya, those who disbelieve]
      action: [interchanged the spring and autumn festivals, postpone a sacred month]
      object: [the festivals of the Sun goddess, the sacred months]
      time: [spring and autumn, one year and another year]
      quoted: [ḫamešḫandaš … zēnandašša UL namma waḫnummi, innamā n-nasīʾu ziyādatun fī l-kufr … yuḥillūnahu ʿāman wa-yuḥarrimūnahu ʿāman]
      outcome: [vows to hold each festival only in its own season, the shift is condemned as more unbelief]
    note: 'Tudḫaliya confesses he took away and cut (karšanunun) the goddess''s festivals and vows: ''the spring festivals and [the autumn festivals] I will no longer exchange (UL namma waḫnummi); the spring festivals only in spring (ḫamešḫi=pat), the autumn festivals only in autumn (zēni=pat) I will celebrate''. 9:36-37: twelve months, four of them sacred, ''innamā n-nasīʾu ziyādatun fī l-kufr'', postponement is an increase in unbelief, ''yuḥillūnahu ʿāman wa-yuḥarrimūnahu ʿāman'', they make it lawful one year and forbidden another. Both treat moving a sacred time out of its season as an offence. ''Autumn festivals'' in §1:13 is restored; §1:15 keeps zé-e-ni-pát.'
- unit: ane-cth-385-10-labarna-sun-prayer-roof
  checked: [quran-17-prayer-spirit-and-challenge, quran-5-ablution-covenant-justice, quran-41-steadfast-and-repel-evil, quran-27-solomon-ants-hoopoe-sheba]
