# ANE x Quran side-by-side pass, chunk 30 (Hittite: CTH 384-404 prayers of Puduhepa and others, Nerik prayers, Mursili III, and the rituals of Ayatarsa, Ambazzi, Anniwiyani, Ashella, Hantitassu, Hatiya, Hepattarakki, Huwarlu, Jarri, Iriya, Banippi, Alli, Mallidunna, Mashtigga). Judged blind, from the originals.
