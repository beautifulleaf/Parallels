    note: 'Ašḫella, day two: six rams and six he-goats are driven to the open field and ''slaughtered to the ground (tagān ḫattanzi)'', cooked, and set out with bread and beer: ''O deity, eat and drink in a god''s way (DINGIR-LIM-nili ezza eku) and leave nothing to man (antuḫši=ma … lē pešti)''. 22:36: when the camels ''fall on their sides (wajabat junūbuhā) fa-kulū minhā wa-aṭʿimū l-qāniʿa wa-l-muʿtarr'', eat of them and feed the needy (also 22:28); 22:37: ''lan yanāla llāha luḥūmuhā wa-lā dimāʾuhā'', neither their flesh nor their blood reaches God. The god eats all and man gets nothing, against men and the poor eat and God receives none of the flesh.'
