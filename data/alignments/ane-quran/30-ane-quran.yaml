- unit: ane-cth-386-1-nerik-storm-god-summoned
  checked: [quran-27-solomon-ants-hoopoe-sheba, quran-2-abrogation-polemic, quran-55-rahman-creation-and-the-two-seas, quran-2-throne-verse]
  matches:
