    with_refs: ['41:37']
    relation: response
    record:
      agent: [the priest of the Sun goddess, the hearers]
      action: [goes up on the roof at dawn and speaks facing the Sun, are told not to prostrate to the sun]
      recipient: [the Sun deity of heaven, the sun and the moon]
      time: [when it grows light, null]
      quoted: [dUTU-i menaḫḫanda memai; tuwaddu nepišaš dUTU-ui, lā tasjudū li-sh-shamsi wa-lā li-l-qamar wa-sjudū lillāhi lladhī khalaqahunna]
    note: '§19:74-76: ''when it grows light (māan lukkatta) the priest goes up onto the house of the Sun goddess of Arinna and speaks facing the Sun (dUTU-i menaḫḫanda)''; the prayer opens ''tuwaddu nepišaš dUTU-ui'', mercy, Sun god of heaven (§11:40). 41:37: the night, the day, the sun and the moon are among his signs: ''lā tasjudū li-sh-shamsi wa-lā li-l-qamar'', do not prostrate to the sun or the moon, prostrate to God who created them.'
