- unit: ane-etcsl-5-2-5-early-rulers
  checked: [quran-23-death-barzakh-judgment, quran-20-judgment-day, quran-29-emigrate-and-trust, quran-17-prayer-spirit-and-challenge]
  matches:
  - with: quran-23-death-barzakh-judgment
    motif: life-span-reckoned-against-one-day
    refs: [ETCSL 5.2.5 8, ETCSL 5.2.5 19]
    with_refs: ['23:112', '23:113', '23:114']
    relation: divergence
    record:
      agent: [the poet, God asking the dead]
      number: [36000 years, a number of years]
      time: [one day of happiness, a day or part of a day]
      action: [sets one day of joy against 36000 years of silence, has the dead reckon their whole life on earth as a day or part of a day]
      quoted: [lugal-e mu 36000-am3 in-ak / ud šag4 ḫul2-la X niĝ2-me-ĝar mu 36000-am3 in-ak, kam labithtum fī l-arḍi ʿadada sinīn / labithnā yawman aw baʿḍa yawm]
      outcome: [enjoy the day, you tarried but a little]
    note: 'The primeval king reigned mu 36000 ''thirty-six thousand years'', and 36000 years of silence weigh less than ud šag4 ḫul2-la, one day of a happy heart; 23:112-114: ''How many years (ʿadada sinīn)
      did you stay on earth?'' ''A day or part of a day.'' A great count of years set against one day in both; in the Sumerian poem the day of joy outweighs the years, in the Quran the years themselves
      shrink to a day (fragmentary lines 17-21).'
- unit: ane-etcsl-5-3-2-sheep-grain-creation
  checked: [quran-23-creation-of-man-and-gifts, quran-16-blessings-of-creation, quran-6-pagan-offerings-cattle, quran-7-children-of-adam]
  matches:
  - with: quran-7-children-of-adam
    motif: primeval-humans-without-clothing
    refs: [ETCSL 5.3.2 20-23]
    with_refs: ['7:26', '7:27']
    relation: divergence
    record:
      agent: [the people of those days, the first parents]
      object: [clothing, clothing]
      action: [did not know about wearing clothes and went with naked limbs, wore garments that Satan pulled off them]
      outcome: [the gods create Sheep and Uttu's weaving, God sends down clothing to cover their nakedness]
      quoted: [tug2-ga mu4-mu4-bi nu-mu-un-zu-uš-am3 / kalam ĝiš-gen6-na su-bi mu-un-ĝen, yanziʿu ʿanhumā libāsahumā li-yuriyahumā sawʾātihimā / qad anzalnā ʿalaykum libāsan yuwārī sawʾātikum]
    note: 'In Sheep and Grain the first humans had never worn clothes: they went naked like sheep and ate grass, until the gods made Sheep and the weaving goddess. 7:26-27: the first parents were clothed
      and Satan stripped them (yanziʿu ... libāsahumā), and God sends down (anzalnā) libās to cover sawʾāt. Nakedness as the original state against nakedness as the result of a fall; clothing a divine gift
      in both.'
