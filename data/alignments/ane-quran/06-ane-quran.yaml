    refs: [ETCSL 5.6.1 14]
    with_refs: ['31:19']
    relation: echo
    record:
      agent: [Šuruppag to his son, Luqman to his son]
      object: [a donkey that brays, the voice of donkeys]
      action: [do not buy a donkey which brays, lower your voice]
      quoted: ['dur3{ur3} gu3 di na-ab-sa10-sa10', wa-ghḍuḍ min ṣawtika inna ankara l-aṣwāti la-ṣawtu l-ḥamīr]
    note: 'The first precept of Šuruppag after the prologue: do not buy a dur3 (male donkey) that gu3 di ''makes noise, brays''. The last precept of Luqman: lower your voice, the most hateful of voices
      is the voice of donkeys (ṣawt al-ḥamīr). The braying donkey in a sage father''s instructions to his son, at the opening of one and the close of the other; in Sumerian a practical warning about livestock,
      in Arabic a figure for loud speech.'
