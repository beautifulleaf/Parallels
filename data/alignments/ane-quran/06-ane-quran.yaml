    refs: [ETCSL 4.22.1 102-104]
    with_refs: ['47:15']
    relation: echo
    record:
      place: [the goddess's house Isin, the Garden promised to the God-fearing]
      object: [the Kir-sig watercourse with rising water, rivers of water]
      action: [its banks grow syrup and wine, there are rivers of wine and of purified honey]
      quoted: ['id2-ĝu10 {id2}kir11-sig / šag4-ba a zal-le ma-ra-il2-il2 / gu2-gu2-bi lal3 ĝeštin ba-an-mu2', anhārun min māʾin ghayri āsin ... wa-anhārun min khamrin ... wa-anhārun min ʿasalin muṣaffā]
    note: 'Ninisina''s house, where the Anuna eat with her, has a watercourse whose flowing water (a zal-le) rises and whose banks grow lal3 (date syrup, ''honey'') and ĝeštin (wine). 47:15: rivers of water
      not stale, of milk, of wine and of purified honey (ʿasal). The same trio of water, wine and honey; in Sumerian they grow on the banks of a real canal, in the Quran the rivers themselves are wine and
      honey.'
- unit: ane-etcsl-4-22-1-ninisina-against-rebel-land
  checked: [quran-39-mercy-and-last-day, quran-21-end-and-inheritance, quran-2-fasting, quran-79-pharaoh-and-cosmos]
  matches:
  - with: quran-21-end-and-inheritance
    motif: heavens-folded-before-the-deity
    refs: [ETCSL 4.22.1 131]
    with_refs: ['21:104']
    relation: echo
    record:
      object: [the heavens, the heaven]
      action: [fold themselves like a garment in the goddess's presence, are folded by God like a scroll for writings]
      instrument: [like a mourning garment, like the folding of a scroll]
      time: [whenever the goddess is present, on the day of the end]
      quoted: [an mu-dur7-ra-gin7 mu-da-gam-e-en, yawma naṭwī s-samāʾa ka-ṭayyi s-sijilli li-l-kutub]
    note: Sumerian gam 'bend, fold' with a cloth simile (mu-dur7, a garment) against ṭawā 'fold, roll up' with a scroll simile (sijill). In the goddess's self-praise the heavens bend before her now, and
      the earth goes under as if flooded (132); in 21:104 God folds the heaven at the last day and brings creation back as he began it.
  - with: quran-39-mercy-and-last-day
    motif: heavens-folded-before-the-deity
    refs: [ETCSL 4.22.1 131-132]
    with_refs: ['39:67']
    relation: echo
    record:
      object: [heaven and earth, the heavens and the whole earth]
      action: [heaven folds like a garment and the earth is submerged before the goddess, the heavens are folded in God's right hand and the earth is his handful]
      time: [whenever the goddess is present, on the day of resurrection]
      quoted: [an mu-dur7-ra-gin7 mu-da-gam-e-en / ki-a a-ĝi6-gin7 mu-da-šub-šub, wa-l-arḍu jamīʿan qabḍatuhu ... wa-s-samāwātu maṭwiyyātun bi-yamīnihi]
    note: 'Heaven and earth paired, each undone before the deity: the heaven folds (gam) and the earth sinks as under a flood (a-ĝi6) in Ninisina''s presence; in 39:67 the earth is God''s grip (qabḍa) and
      the heavens are folded (maṭwiyyāt) in his right hand.'
