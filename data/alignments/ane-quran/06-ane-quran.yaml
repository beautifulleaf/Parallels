# ANE x Quran side-by-side pass, chunk 6 (ETCSL 4.16.2 - 6.1.03). Judged blind, from the originals.
new_motifs:
  watercourse-of-wine-and-honey: {label: A watercourse of flowing water in a divine abode yields wine and honey (syrup), cluster: afterlife}
  heavens-folded-before-the-deity: {label: The heavens are folded like cloth or a scroll before or by the deity, cluster: nature}
  if-only-they-knew-the-gods-strength: {label: '''If only (the enemy / the wrongdoers) knew or saw'' the god''s strength (formula)', cluster: deity}
  what-governs-human-sleep-and-rising: {label: What sets the daily sleeping and rising of people, cluster: time}
  whether-the-deity-sleeps: {label: Whether the god sleeps, cluster: deity}
  life-span-reckoned-against-one-day: {label: A span of many years is set against a single day, cluster: death}
  primeval-humans-without-clothing: {label: 'Whether the first humans went naked, and how clothing came to them', cluster: creation}
  livestock-sent-down-by-the-deity: {label: The deity sends sheep or livestock down to humankind, cluster: creation}
  braying-donkey-in-fathers-advice: {label: A father's advice to his son names the braying donkey, cluster: wisdom}
  do-not-speak-harshly-to-a-parent: {label: Do not speak harshly or arrogantly to your parent, cluster: wisdom}
  obedience-to-parents-and-to-god: {label: How the parents' word stands to the word of God, cluster: wisdom}
  buried-in-the-earth-and-brought-out-again: {label: People are put into the earth and brought out of it again, cluster: death}
