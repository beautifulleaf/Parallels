    note: A named ancient sage, introduced as wise (ĝeštug2 tuku; ātaynā luqmāna l-ḥikma), addresses a sequence of precepts to his own son with the vocative 'my son' (dumu-ĝu10, repeated through the text;
      yā bunayya, 31:13, 16, 17). Šuruppag's son is the flood hero; Luqman's son is unnamed.
- unit: ane-etcsl-5-6-1-shuruppag-first-instructions
