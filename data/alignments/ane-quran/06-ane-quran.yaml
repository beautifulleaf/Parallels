- unit: ane-etcsl-4-80-1-gudua-urum-zimbir-hiza
  checked: [quran-25-signs-shadow-seas, quran-2-throne-verse, quran-79-pharaoh-and-cosmos]
  matches:
  - with: quran-25-signs-shadow-seas
    motif: what-governs-human-sleep-and-rising
    refs: [ETCSL 4.80.1 482-483]
    with_refs: ['25:47']
    relation: divergence
    record:
      agent: [Utu the sun god, God]
      recipient: [the people, you]
      action: [sleeps and rises and the people sleep and rise with him, makes the night a garment and sleep a rest and the day a rising]
      quoted: [en nu2-a-ni uĝ3 nu2-de3 / zi-zi-da-ni uĝ3 zi-zi-de3, jaʿala lakumu l-layla libāsan wa-n-nawma subātan wa-jaʿala n-nahāra nushūran]
    note: Both tie people's sleep and rising to the daily cycle. In the Zimbir hymn the people sleep because the lord (Utu) sleeps and rise when he rises (nu2 / zi-zi); in 25:47 God appoints night as covering,
      sleep (nawm) as rest and day as nushūr, 'rising' (also the word of resurrection). The sleeper who sets the rhythm is the god in one, the people alone in the other.
  - with: quran-2-throne-verse
    motif: whether-the-deity-sleeps
    refs: [ETCSL 4.80.1 482]
    with_refs: ['2:255']
    relation: divergence
    record:
      agent: [Utu the lord of Zimbir, God the Living the Self-subsisting]
      action: [sleeps, is overtaken by neither slumber nor sleep]
      quoted: [en nu2-a-ni, lā taʾkhudhuhu sinatun wa-lā nawm]
    note: en nu2-a-ni 'when the lord lies down (sleeps)' is said of Utu as the sun setting; 2:255 denies sleep (nawm) and slumber (sina) of God, al-ḥayy al-qayyūm. The same attribute affirmed of the god
      in a temple hymn and denied in the Throne Verse.
