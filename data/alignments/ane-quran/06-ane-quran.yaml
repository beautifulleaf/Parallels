    with_refs: ['17:23']
    relation: parallel
    record:
      recipient: [your mother, your parents]
      action: [do not speak arrogantly, do not say 'uff' nor rebuke]
      quoted: [ama-zu-ur2 inim dirig nam-ba-na-ab-be2-en, fa-lā taqul lahumā uffin wa-lā tanharhumā wa-qul lahumā qawlan karīmā]
      outcome: [that causes hatred for you, speak to them a noble word]
    note: 'A prohibition of a kind of speech to a parent: inim dirig ''excessive, arrogant word'' to the mother; uff and nahr to the parents in old age. Šuruppag gives the reason (it causes hatred, ḫul
      ... gig), 17:23 the positive counterpart (qawl karīm).'
  - with: quran-31-luqman
    motif: obedience-to-parents-and-to-god
    refs: [ETCSL 5.6.1 256-260]
    with_refs: ['31:14', '31:15']
    relation: divergence
    record:
      object: [the words of your mother and of your god, the parents' demand]
      action: [do not question them; the father's word is reliable like a god's and must be obeyed, thank God and your parents but do not obey them if they press you to associate]
      quoted: [inim ama-za inim diĝir-za ka-še3 nam-bi2-ib-dib2-be2-en / ab-ba diĝir-am3 inim-ma-ni zid-da, ani shkur lī wa-li-wālidayka ... wa-in jāhadāka ʿalā an tushrika bī ... fa-lā tuṭiʿhumā]
    note: 'Both join the parents to the deity in one precept: Šuruppag sets the mother''s word beside the personal god''s word, and says the mother is like Utu who gives birth and the father like a god
      whose word is true. 31:14-15 joins thanks to God and to the parents (with the mother''s bearing, ḥamalathu ummuhu), then limits obedience: if they strive to make you associate, do not obey them. Equal
      standing of parent and god against a parent''s word subordinated to God''s.'
