      - faʿʿālun li-mā yurīd
    note: ii:18' anāku šī qābītu ēpištu 'I am she, the speaker and the doer'; Q 85:16 faʿʿālun li-mā yurīd. A divine self-designation by the participle 'doer'; the goddess pairs it with speaking, the Quran with willing.
- unit: ane-saa09-002-4-urkittu-sharrat
  checked:
  - quran-20-moses-pharaoh-magicians
  - quran-51-dhariyat-abrahams-guests-and-the-peoples
  - quran-41-steadfast-and-repel-evil
  - quran-28-pharaoh-oppression-infant-moses
  matches:
  - with: quran-20-moses-pharaoh-magicians
    motif: deity-says-i-see-and-i-hear
    refs:
    - SAA 09 002 ii:31'
    - SAA 09 002 iii:17'
    with_refs:
    - '20:46'
    relation: echo
    record:
      agent:
      - Ištar of Arbela, Mullissu
      - God
      recipient:
      - Esarhaddon
      - Moses and Aaron
      quoted:
      - adagal assanamme ... lā tapallah
      - lā takhāfā innanī maʿakumā asmaʿu wa-arā
    note: 'ii:30''-31'' abat Issār ša Arbail abat šarrati Mullissu: adagal assanamme ''I see and I hear'' (and search out the disloyal), iii:17'' lā tapallah; Q 20:46 qāla lā takhāfā innanī maʿakumā asmaʿu wa-arā. ''Fear not'' with the deity''s ''I see, I hear'' as the ground of safety against an enemy king''s court; the order of the two verbs is reversed.'
