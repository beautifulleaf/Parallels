  - with: quran-85-constellations
    motif: deity-the-doer
    refs:
    - SAA 09 002 ii:18'
    with_refs:
    - '85:16'
    relation: echo
    record:
      agent:
      - Ištar of Arbela
      - God
      name:
      - qābītu ēpištu (speaker and doer)
      - faʿʿāl li-mā yurīd (doer of what he wills)
