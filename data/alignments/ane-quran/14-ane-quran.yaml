- unit: ane-saa20-052-gates-stars-are-gods
  checked:
  - quran-22-abraham-house-pilgrimage
  - quran-2-patience-signs
  - quran-23-lordship-arguments
  - quran-6-abraham-heavenly-bodies
  matches:
  - with: quran-6-abraham-heavenly-bodies
    motif: heavenly-body-identified-as-the-lord
    refs:
    - SAA 20 052 r.iii:55'-60'
    with_refs:
    - 6:76
    - 6:77
    - 6:78
    relation: divergence
    record:
      object:
      - Jupiter; the moon (Sîn); Saturn, star of Šamaš (the sun)
      - a star; the moon; the sun
      action:
      - identified with the high god
      - '''this is my lord'', then rejected when it sets'
      name:
      - Aššur
      - rabbī
      quoted:
      - Sagmegar kakkab Sîn šū u Sîn Aššur šū
      - hādhā rabbī ... lā uḥibbu l-āfilīn
    note: 'r.iii:55''-60'' Sagmegar kakkab Sîn šū u Sîn Aššur šū; Lalu Aššur, Nīru Aššur ... Kayyamānu kakkab Šamaš ''Jupiter is the star of Sîn (the moon), and Sîn is Aššur; the Plough star is Aššur ... Saturn is the star of Šamaš (the sun)''; Q 6:76-78 raʾā kawkaban qāla hādhā rabbī fa-lammā afala qāla lā uḥibbu l-āfilīn ... al-qamara ... ash-shamsa ... innī barīʾun mimmā tushrikūn. Star, moon and sun each equated with the lord: affirmed in the ritual compendium, tried and dropped by Abraham.'
