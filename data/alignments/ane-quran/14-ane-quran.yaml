- unit: ane-saa03-039-tiamat-cut-and-secret-lore
  checked:
  - quran-36-cosmic-signs
  - quran-17-polemic-and-resurrection
  - quran-53-najm-goddesses-and-scrolls
  - quran-79-pharaoh-and-cosmos
