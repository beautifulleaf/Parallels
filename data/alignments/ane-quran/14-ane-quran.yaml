      - ḥallāf mahīn hammāz ... ʿutull baʿda dhālika zanīm
    note: o:1-4 Bēl-ēṭir hibtu nīku ... mār Ibâ ... qinnu šapiltu, ardu ša ili mīti 'robbery, (sexually) known ... son of Ibâ ... low nest (base family), slave of a dead god'; Q 68:10-13 ḥallāfin mahīnin hammāzin mashshāʾin bi-namīmin mannāʿin li-l-khayri muʿtadin athīmin ʿutullin baʿda dhālika zanīm. A chain of epithets against one opponent that turns to his low or doubtful birth (qinnu šapiltu ~ zanīm). The Assyrian text is a parody incantation, the Quran's a warning not to obey him.
