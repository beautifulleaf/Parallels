- unit: ane-saa09-009-dunnasha-amur
  checked:
  - quran-3-sovereignty
  - quran-7-moses-pharaoh
  - quran-20-moses-pharaoh-magicians
  - quran-2-throne-verse
  matches:
  - with: quran-2-throne-verse
    motif: whether-the-guarding-deity-tires-or-sleeps
    refs:
    - SAA 09 009 o:8-15
    - SAA 09 009 o:18
    with_refs:
    - 2:255
    relation: divergence
    record:
      agent:
      - Mullissu / the Lady of Arbela
      - God
      action:
      - guards and seeks his life
      - guards heaven and earth
      outcome:
      - she is tired and sleepless
      - no slumber or sleep; guarding does not weary him
      quoted:
      - anhāku-ma šudlupāku
      - lā taʾkhudhuhu sinatun wa-lā nawm ... wa-lā yaʾūduhu ḥifẓuhumā
    note: o:8-15 balāṭaka eršāku-ma arappuda ṣēru ... anhāku-ma šudlupāku 'longing for your life I roam the steppe, cross rivers and seas ... I am tired and sleepless', o:18 nagalabāya hurrudā 'my shoulders are alert'; Q 2:255 lā taʾkhudhuhu sinatun wa-lā nawm ... wa-lā yaʾūduhu ḥifẓuhumā. The guarding deity worn out and sleepless vs God whom neither sleep nor guarding wearies.
- unit: ane-saa20-055-sargon-sacrificial-table
  checked:
  - quran-22-abraham-house-pilgrimage
  - quran-2-the-cow
  - quran-5-contracts-food-laws
  matches:
  - with: quran-22-abraham-house-pilgrimage
    motif: who-eats-the-sacrifice
    refs:
    - SAA 20 055 r:12'-14'
    with_refs:
    - '22:28'
    - '22:36'
    relation: divergence
    record:
      agent:
      - royal scribe, city scribe, cook
      - the offerers
      action:
      - eat the cuts of the sacrifice
      - eat of it and feed the poor
      recipient:
      - null
      - the wretched poor; the content and the beggar
      quoted:
      - ṭupšar šarri ekkal ... ṭupšar āli ekkal ... nuhatimmu ekkal
      - fa-kulū minhā wa-aṭʿimū l-bāʾisa l-faqīr
    note: r:12'-14' ša pān Šamaš adi silqišu ṭupšar šarri ekkal ... ṭupšar āli ekkal ... unūt libbi nuhatimmu ekkal 'what is before Šamaš with its boiled meat the royal scribe eats; ... the city scribe eats; the innards the cook eats'; Q 22:28 fa-kulū minhā wa-aṭʿimū l-bāʾisa l-faqīr, 22:36 fa-idhā wajabat junūbuhā fa-kulū minhā wa-aṭʿimū l-qāniʿa wa-l-muʿtarr. The flesh of the sacrifice eaten by named temple officials vs by the offerers and the poor.
