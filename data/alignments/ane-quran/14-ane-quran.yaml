    motif: one-mass-split-into-heaven-and-earth
    refs:
    - SAA 03 039 r:1-2
    with_refs:
    - '21:30'
    relation: divergence
    record:
      agent:
      - Bēl
      - God
      object:
      - Tiamat
      - the heavens and the earth, closed up (ratq)
      action:
      - splits in two
      - split apart
      quoted:
      - ihpīši-ma kīma nūnī mašṭê ana šinīšu
      - kānatā ratqan fa-fataqnāhumā
    note: 'r:1-2 Tiamat bēlu ikmīši iṣbatsi išīmši ihpīši-ma kīma nūnī mešṭê ana šinīšu ''the lord bound Tiamat, seized her, fixed her fate and split her in two like a fish for drying'' (to make heaven and earth); Q 21:30 anna s-samāwāti wa-l-arḍa kānatā ratqan fa-fataqnāhumā. One mass parted into heaven and earth: a slain monster''s body vs a closed-up mass with no foe.'
  - with: quran-10-moses-pharaoh
    motif: defeated-foe-kept-as-a-sign-for-later-times
    refs:
    - SAA 03 039 r:15-16
    with_refs:
    - 10:92
    relation: parallel
    record:
      agent:
      - Bēl
      - God
      object:
      - the bound Tiamat
      - Pharaoh's body
      action:
      - shows her
      - saves the body
      outcome:
      - so that the people do not forget
      - a sign for those after you
      quoted:
      - aššu lā mašê nišī ukallim
      - li-takūna li-man khalfaka āyatan
    note: 'r:15-16 bēlu ikmušī-ma aššu lā mašê nišī ukallim ''the lord bound her and, so that the people would not forget, showed (her)''; Q 10:92 fa-l-yawma nunajjīka bi-badanika li-takūna li-man khalfaka āyatan. The beaten enemy is kept and shown as a reminder to later people: the sea-monster vs the drowned Pharaoh.'
