# ANE x Quran side-by-side pass, chunk 14 (SAA 3 court poetry and mystical commentaries, SAA 9 prophecies, SAA 20 Assur rituals). Judged blind, from the originals.
new_motifs:
  tongue-kept-from-faltering-by-the-deity:
    label: The deity keeps (or makes) the speaker's tongue free of impediment
    cluster: prophecy
  cry-of-a-woman-in-labour:
    label: 'A woman in labour cries out in her pains: who answers her, and how it ends'
    cluster: family
  invective-chain-ending-in-slur-on-birth:
    label: A string of abusive epithets against an opponent, including a slur on his birth
    cluster: wisdom
  seized-by-the-forelock-before-the-judge:
    label: A man is seized by the forelock and brought before the judging deity
    cluster: eschatology
  return-from-the-netherworld-to-the-living:
    label: Whether one who has stood before the judge of the dead is sent back to the living
    cluster: eschatology
  stars-set-on-the-lowest-heaven:
    label: The stars are set on (drawn on, adorn) the lowest of the heavens
    cluster: creation
  deity-abandons-his-servant:
    label: Whether the deity has abandoned (forsaken) his servant
    cluster: deity
  guard-before-and-behind:
    label: A protector goes (stands) before and behind a man to guard him
    cluster: deity
  held-by-the-forelock:
    label: The deity holds a person (or every creature) by the lock of hair on the forehead
    cluster: deity
  deity-the-doer:
    label: The deity calls himself or herself the doer (of what he says, of what he wills)
    cluster: deity
  deity-says-i-see-and-i-hear:
    label: '''Fear not'': the deity reassures with ''I see and I hear'' (I hear and I see)'
    cluster: prophecy
  stones-rained-on-enemies:
    label: 'The deity rains stones from heaven on those he destroys: what kind of stones'
    cluster: judgment
  drink-taken-at-the-covenant:
    label: What is drunk at the making of a covenant, and what the drinking does
    cluster: law
  impalement-of-those-who-rose-against-the-king:
    label: Those who rose against the king are impaled (crucified) on stakes or palm trunks
    cluster: kingship
  food-offered-to-the-deity:
    label: Whether the deity eats (receives) the food and drink of the offerings
    cluster: cult
  whether-the-guarding-deity-tires-or-sleeps:
    label: Whether the deity who guards grows tired or sleepless
    cluster: deity
  heavenly-body-identified-as-the-lord:
    label: A star, the moon or the sun is identified as the (high) god
    cluster: deity
  who-eats-the-sacrifice:
    label: Who eats the flesh of the sacrifice
    cluster: cult
  sacred-city-receives-the-produce-of-all-lands:
    label: The produce (tribute, fruits) of all lands is brought into a sacred city
    cluster: cult
