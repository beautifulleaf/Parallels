  - quran-16-daughters-and-the-bee
  - quran-3-imran-mary-zechariah
  matches:
  - with: quran-19-mary-and-jesus
    motif: cry-of-a-woman-in-labour
    refs:
    - SAA 03 015 o:7-12
    with_refs:
    - '19:23'
    - '19:24'
    - '19:25'
    relation: divergence
    record:
      agent:
      - a mother
      - Mary
      time:
      - day of labour pains
      - labour pains (al-makhāḍ)
      action:
      - prays to Bēlet-ilī
      - wishes she had died
      recipient:
      - Bēlet-ilī
      - null
      outcome:
      - the goddess veils her face; the mother dies
      - 'called from below: do not grieve; water and dates'
      quoted:
      - ina ūm hīlīya ... ummu ālidāti atti eṭrī napultī ... tuktallila pānīša
      - fa-ajāʾahā l-makhāḍu ... yā laytanī mittu qabla hādhā ... allā taḥzanī
    note: 'o:7-12 ina ūm hīlīya ētarpū pānūya ... ana Bēlet-ilī uṣalla: ummu ālidāti atti eṭrī napultī; Bēlet-ilī kī tašmûni tuktallila pānīša ''on the day of my pains my face was clouded ... I prayed: you are the mother of those who give birth, save my life! When Bēlet-ilī heard she veiled her face''; Q 19:23-25 fa-ajāʾahā l-makhāḍu ilā jidhʿi n-nakhla qālat yā laytanī mittu qabla hādhā ... fa-nādāhā min taḥtihā allā taḥzanī. The cry in labour is refused and ends in death; Mary''s wish for death is answered with comfort, water and dates.'
