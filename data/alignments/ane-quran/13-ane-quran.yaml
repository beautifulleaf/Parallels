    note: –:276-280 Enlil 'who created teeming humankind', Ea 'who pinched off their clay', Mami 'who fashioned them' šarkū ana amēlūti etgura dabāba / sarrāti u lā kināti išrukūši santakku, 'gave perverse speech to humankind, endowed them forever with lies and untruth'; Q 91:7-10 wa-nafsin wa-mā sawwāhā fa-alhamahā fujūrahā wa-taqwāhā qad aflaḥa man zakkāhā wa-qad khāba man dassāhā. The shapers put the bent into humans at their making; the Babylonian gods give only falsehood, the Quranic shaper both wickedness and god-fearing, and the choice decides.
