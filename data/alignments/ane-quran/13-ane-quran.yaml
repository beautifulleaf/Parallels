# ANE x Quran side-by-side pass, chunk 13 (Poor Man of Nippur, Poplar, Queen of Nippur, Sagba, Great Hymn to Shamash, shuila prayers, Spider, Babylonian Theodicy, Wren, SAA 2 treaties and loyalty oaths, SAA 3 14/20/25/26/29). Judged blind, from the originals.
new_motifs:
  nearness-of-the-hearing-god:
    label: The deity is near to the one who prays and hears (answers) him
    cluster: deity
  do-not-look-behind-on-leaving:
    label: 'Command: on leaving, do not look behind you (ana arkīka lā tappallas / lā yaltafit minkum aḥad)'
    cluster: ritual
  witch-s-knot:
    label: Witchcraft worked by a (female) witch through knots or bonds, from which release or refuge is sought
    cluster: magic
  sun-s-resting-place-at-the-end-of-its-course:
    label: The sun ends its daily course at a resting place (the bedchamber where it is told 'Rest!', or its mustaqarr)
    cluster: nature
  god-lengthens-night-and-shortens-day:
    label: The god changes the length of day and night (shortens days, lengthens nights; makes night enter into day)
    cluster: nature
  divine-object-measured-against-heaven-and-earth:
    label: 'A divine object is measured against heaven and earth: the heavens too small for the god''s cup, or his seat (kursī) spanning the heavens and the earth'
    cluster: deity
  seafarers-surrounded-by-waves-saved:
    label: Those surrounded by the waves at sea are saved by the god they call on; what follows the rescue
    cluster: nature
  loss-of-the-principal-in-usury:
    label: What becomes of the usurer's profit and his principal (kīsu / ruʾūs amwālikum)
    cluster: law
  two-measures-taking-full-giving-short:
    label: 'Fraud with two standards: taking by the full measure and giving by the short one'
    cluster: law
  orphaned-speaker-without-a-carer:
    label: 'The speaker was orphaned of father (and mother): left with no one to rear him, or found an orphan and sheltered'
    cluster: family
  makers-put-falsehood-or-wickedness-into-humans:
    label: The makers of humankind themselves gave it lying speech, or the shaper of the soul inspired it with its wickedness and its piety
    cluster: creation
  modest-walk-and-lowered-voice:
    label: 'Humility in public: walking modestly, keeping the voice low, not holding the head (cheek) high'
    cluster: wisdom
  strength-of-the-spider:
    label: 'The spider and its strength: it boasts it is the strongest, or its house is the weakest of houses'
    cluster: animals
  let-the-trusters-trust:
    label: 'Formula on trust: let whoever trusts, trust; we trust in our god / on God let the trusters trust'
    cluster: deity
  pray-to-no-other-god:
    label: Command not to pray to (call on) any other deity besides the one worshipped
    cluster: deity
  praise-in-the-mouths-of-later-people:
    label: Petition that the petitioner's good name (praise, 'a tongue of truth') be set in the mouths of people, or of later generations
    cluster: wisdom
  lightning-and-hail-strike-at-gods-will:
    label: Lightning, thunderbolts or hail sent from heaven at the god's command strike what he wills
    cluster: nature
  light-of-heaven-and-earth:
    label: The god titled 'light of heaven(s) and earth' (nūr šamāmī u qaqqari / nūru l-samāwāti wa-l-arḍ), and those deprived of light walk in darkness
    cluster: deity
  affliction-worn-as-a-garment:
    label: A punishment (skin disease; hunger and fear) put on the guilty like a garment
    cluster: judgment
  pitch-on-the-bodies-of-the-damned:
    label: Pitch, bitumen or naphtha as the bodily covering (ointment, garment) of the cursed or damned, with a foul drink
    cluster: judgment
  blood-and-pus-of-the-punished:
    label: 'Blood and pus as the water of the punished: bathed in, or drunk'
    cluster: judgment
  woe-we-have-sinned-cry-of-the-punished:
    label: The punished cry 'woe (ahula / yā waylanā), we have sinned (been wrongdoers)'
    cluster: judgment
  secret-messages-to-the-enemy:
    label: 'Forbidden: sending secret messages to the overlord''s (God''s) enemy'
    cluster: kingship
  ruler-kills-and-keeps-alive:
    label: A ruler holds the power to kill and to keep alive, and to bring down the strong and raise the low
    cluster: kingship
  limit-of-blood-vengeance:
    label: 'Blood vengeance for a murdered person: blood for blood, or the heir''s authority not to exceed in killing'
    cluster: law
  kin-not-exempt-from-loyalty:
    label: 'Loyalty to the sovereign overrides kin: brothers, fathers, sons, clan are named and not exempted'
    cluster: kingship
  oath-with-lips-not-heart:
    label: An oath or profession spoken with the lips (tongues) only, not with the whole heart
    cluster: law
  hands-and-feet-cut-for-sinning-against-god:
    label: Cutting off hands and feet as the punishment of those who sin against (wage war on) the god
    cluster: law
  love-ruler-as-own-self:
    label: The ruler (crown prince, prophet) is to be loved as, or to be closer than, one's own self
    cluster: kingship
  oath-binding-the-unborn-generations:
    label: An oath or covenant that binds descendants not yet born
    cluster: law
  refer-what-you-hear-to-the-ruler:
    label: Whatever word or news one hears is to be referred to the ruler (and those in authority), not concealed or spread
    cluster: kingship
