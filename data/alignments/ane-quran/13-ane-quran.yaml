      - in the earth
      quoted:
      - rigmu ul iššapu iššapil atmûʾa / rēšīya ul ulli qaqqara anaṭṭal
      - wa-qṣid fī mashyika wa-ghḍuḍ min ṣawtika ... wa-lā tuṣaʿʿir khaddaka li-l-nās
    note: '–:291-293 rebīt ālīya abâʾ nēhiš / rigmu ul iššapu iššapil atmûʾa / rēšīya ul ulli qaqqara anaṭṭal, ''I passed quietly through my city''s square, my voice was not raised, my speech was low, I did not hold my head high, I looked at the ground''; Q 31:18-19 wa-lā tuṣaʿʿir khaddaka li-l-nāsi wa-lā tamshi fī l-arḍi maraḥan ... wa-qṣid fī mashyika wa-ghḍuḍ min ṣawtika. The same three marks of humility: the gait, the lowered voice, the head (cheek) not lifted.'
