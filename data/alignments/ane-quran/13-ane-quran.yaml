    - '10:23'
    relation: divergence
    record:
      agent:
      - Šamaš
      - God
      action:
      - saves those surrounded by the mighty wave
      - saves those the waves surround
      recipient:
      - those surrounded by waves
      - those in the ship
      outcome:
      - they pour libations and praise his name forever
      - once saved they transgress in the earth
      quoted:
