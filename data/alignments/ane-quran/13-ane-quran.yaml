    note: '–:200 [u ay]a kallātu rabītu ina bīt mayyāli maštakīša nūh liqbīka, ''may Aya, the great bride, say to you in the bedchamber: Rest!''; Q 36:38 wa-l-shamsu tajrī li-mustaqarrin lahā dhālika taqdīru l-ʿazīzi l-ʿalīm, ''the sun runs to a resting place of its own; that is the decree of the Mighty, the Knowing''. Both end the sun''s daily run at a place of rest; the consort who bids the sun god rest becomes a fixed course decreed for a created sun.'
