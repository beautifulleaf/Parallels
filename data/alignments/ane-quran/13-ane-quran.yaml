- unit: ane-shamashhymn-sb-3-justice-ethics
  checked:
  - quran-2-usury
  - quran-83-defrauders
  - quran-4-israel-indictment-crucifixion
  - quran-26-shuayb-ayka
  matches:
  - with: quran-2-usury
    motif: loss-of-the-principal-in-usury
    refs:
    - ShamashHymn SB –:103-104
    with_refs:
    - 2:276
    - 2:279
    relation: divergence
    record:
      agent:
      - the exploitative lender
      - the one who takes usury
      action:
      - lends silver at interest
      - takes usury
      outcome:
      - loses profit and principal
      - God blots out usury; on repentance he keeps his principal
      quoted:
      - uštakaṣṣab ana nēmelim-ma uhallaq kīsa
      - yamḥaqu llāhu l-ribā ... fa-lakum ruʾūsu amwālikum
    note: –:103-104 nādin kaspi ana ṣibti hābilu mīnâ uttar / uštakaṣṣab ana nēmelim-ma uhallaq kīsa, 'what does the exploitative lender gain? he cuts his profit and loses the principal'; Q 2:276 yamḥaqu llāhu l-ribā wa-yurbī l-ṣadaqāt and 2:279 wa-in tubtum fa-lakum ruʾūsu amwālikum lā taẓlimūna wa-lā tuẓlamūn. The same reckoning of the usurer's gain; the Babylonian lender forfeits even the capital, the Quranic one who repents keeps it.
  - with: quran-83-defrauders
    motif: two-measures-taking-full-giving-short
    refs:
    - ShamashHymn SB –:107-115
    with_refs:
    - '83:1'
    - '83:2'
    - '83:3'
    relation: parallel
    record:
      agent:
      - the cheat with scales and dry measure
      - the defrauders (muṭaffifūn)
      action:
      - lends by the medium standard, takes repayment by the extra standard
      - take full measure from people, give them short
      instrument:
      - scales, weights and dry measure
      - measure and weight
      outcome:
      - the people's curse overtakes him before his time
      - woe (wayl) to them
      quoted:
      - nādin šīqāti ana birīyi mušaddin atri
      - idhā ktālū ʿalā l-nāsi yastawfūn wa-idhā kālūhum aw wazanūhum yukhsirūn
    note: –:107-108 ṣābit zibānīti ēpiš ṣilipti / muštēnû aban kīsi ušaqqa u ušappal, 'who cheats holding the scales, switching weights'; 112-113 ṣābit sūti ... nādin šīqāti ana birīyi mušaddin atri, 'who lends by the medium standard and collects by the extra standard', 114 arrat nišī ikaššassu; Q 83:1-3 waylun li-l-muṭaffifīn alladhīna idhā ktālū ʿalā l-nāsi yastawfūn wa-idhā kālūhum aw wazanūhum yukhsirūn. The double standard, full when taking and short when giving, is the named fraud on both sides.
