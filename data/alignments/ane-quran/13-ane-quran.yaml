      - wa-jāʾahumu l-mawju min kulli makānin wa-ẓannū annahum uḥīṭa bihim
    note: –:159 ša lamûšināti dannu agû tušēzib attā, 'you save the one whom the mighty wave surrounds', then 160-166 they bring libations and 'praise your greatness forever'; Q 10:22-23 jāʾahumu l-mawju min kulli makānin wa-ẓannū annahum uḥīṭa bihim daʿawu llāha mukhliṣīn ... fa-lammā anjāhum idhā hum yabghūna fī l-arḍ, 'the waves come at them from every side and they think they are surrounded; they call on God ... and when he has saved them, they transgress'. Same rescue of the wave-surrounded; the ending turns from lasting praise to broken vows.
  - with: quran-2-throne-verse
    motif: divine-object-measured-against-heaven-and-earth
    refs:
    - ShamashHymn SB –:154-155
    with_refs:
    - 2:255
    relation: divergence
    record:
      object:
      - the god's divining cup and seer's bowl
      - God's seat (kursī)
      action:
      - the heavens and all lands are too small to be it
      - it spans the heavens and the earth
      quoted:
      - mala kappi niṭil īnīka ul imṣû šamāmū
      - wasiʿa kursiyyuhu l-samāwāti wa-l-arḍ
    note: –:154-155 mala kappi niṭil īnīka ul imṣû šamāmū / mala mākalti bārûti ul imṣâ gimiršina mātātu, 'the heavens are too small to be the cup of your gaze, all the lands too small to be your seer's bowl'; Q 2:255 wasiʿa kursiyyuhu l-samāwāti wa-l-arḍa wa-lā yaʾūduhu ḥifẓuhumā, 'his seat encompasses the heavens and the earth'. One divine implement measured against heaven and earth; the diviner's cup becomes the throne-seat.
