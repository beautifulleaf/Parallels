    note: –:180 mukarrû ūmī murrik mušâti, 'who shortens days, who lengthens nights'; Q 3:27 tūliju l-layla fī l-nahāri wa-tūliju l-nahāra fī l-layl, 'you make the night pass into the day and the day into the night'. The seasonal change in the length of day and night as the god's act, in a hymn of praise on both sides.
