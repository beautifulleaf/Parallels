  matches:
  - with: quran-4-homicide-law
    motif: compensation-for-a-man-killed-from-a-treaty-people
    refs: ['Ugarit RS 17.0146 o:4-14', 'Ugarit RS 17.0146 r:1-8']
    with_refs: ['4:92']
    relation: parallel
    record:
      object: [a merchant of the treaty-partner king killed in the land, a man killed from a people with whom you have a covenant]
      action: [pay blood compensation, pay blood compensation]
      recipient: [the merchants' brothers, his family (ahlihi)]
      number: [3 minas of silver per man, null]
      quoted: [mullâ ša dāmī ... 3 MA.NA kaspa ... ušallamūni, wa-in kāna min qawmin baynakum wa-baynahum mīthāqun fa-diyatun musallamatun ilā ahlihi]
    note: 'A ruling for a man killed who belongs to the other party of a treaty (rikiltu / mīthāq): compensation ''for the blood'' (mullâ ša dāmī) is paid in full (ušallamūni, D of šalāmu) to the dead man''s brothers, and ''blood money handed over in full (musallama, also from s-l-m) to his family''. The Quran adds the freeing of a believing slave and limits the case to accidental killing; the treaty sets the sum at 3 minas a man and adds the restoring of his goods.'
  - with: quran-2-the-cow
    motif: killing-by-unknown-hand
    refs: ['Ugarit RS 17.0146 o:19-27', 'Ugarit RS 17.0146 r:9-17']
    with_refs: ['2:72', '2:73']
    relation: divergence
    record:
      agent: [the men of the town where he died, you (the Israelites)]
      action: [swear that they do not know the killers, disputed over it (pushing it off on one another)]
      outcome: [they pay 3 minas a man all the same, the slain is struck with part of the cow and God brings out what was hidden]
      quoted: [šumma dāʾikūtišunu nīde-mi, wa-idh qataltum nafsan fa-ddāraʾtum fīhā wa-llāhu mukhrijun mā kuntum taktumūn]
    note: 'A man killed, the killers not found: the treaty has the townsmen swear before the dead men''s brothers ''we do not know their killers'' and pay the compensation anyway; in 2:72-73 the community ''disputed over it'' (iddāraʾtum, each repelling it), and God orders the dead man struck with a piece of the cow so that the hidden thing comes out. The oath of ignorance settles the Ugarit case; the Quran case is settled by revealing the killer.'
