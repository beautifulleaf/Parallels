      quoted: [Niqmepa liṣbassu u ana šar māt Ḫatti litēršu, fa-lā tarjiʿūhunna ilā l-kuffār]
      outcome: [keeping one is a breach of the oath, the husbands are paid what they spent]
    note: 'Opposite rulings on the same clause of a pact between two sides: the treaty orders ''let Niqmepa seize him and return him (litēršu) to the king of Hatti'', and keeping a fugitive ''transgresses the oath'' (ištu māmīti ītetiq); 60:10 orders, for women who come over as believers after examination, ''do not return them (lā tarjiʿūhunna) to the unbelievers'', with what the husbands spent paid back instead.'
