- unit: ane-ea-162-pharaoh-to-aziru
  checked: [quran-85-constellations, quran-37-abraham-idols-fire, quran-29-abraham-preaches, quran-43-zukhruf-pharaoh-claims, quran-49-hujurat-etiquette-and-brotherhood, quran-27-solomon-ants-hoopoe-sheba, quran-26-moses-and-pharaoh]
  matches:
  - with: quran-49-hujurat-etiquette-and-brotherhood
    motif: slander-as-eating
    refs: ['EA 162 o:14-16']
    with_refs: ['49:12']
    relation: contrast
    record:
      agent: [the king of Egypt, God]
      action: [reproaches Aziru for not 'eating the pieces' of a man before the king, forbids eating the flesh of a dead brother]
      recipient: [Aziru, the believers]
      quoted: [ammīni lā takul karṣīšu ana pāni šarri bēlika, wa-lā yaghtab baʿḍukum baʿḍan a-yuḥibbu aḥadukum an yaʾkula laḥma akhīhi maytan]
    note: 'The same idiom with opposite rulings. Pharaoh''s letter demands the denunciation: ''if you are a true servant of the king, why did you not eat his pieces (lā takul karṣīšu) before the king your lord?'', i.e. why did you not inform on the man of Byblos. Q 49:12 forbids it as eating a dead brother''s flesh (an yaʾkula laḥma akhīhi maytan), next to the ban on spying (wa-lā tajassasū).'
  - with: quran-27-solomon-ants-hoopoe-sheba
    motif: royal-letter-summons-ruler-to-come-in-submission
    refs: ['EA 162 o:1-2', 'EA 162 o:33-39', 'EA 162 r:46-54']
    with_refs: ['27:28', '27:29', '27:30', '27:31', '27:37']
    relation: parallel
    record:
      agent: [the king (of Egypt), Sulaymān]
      action: [writes to a ruler ordering him to come to the king, writes to a ruler ordering her to come to him]
      recipient: [Aziru of Amurru, the queen (of Sabaʾ) and her people]
      instrument: [a tablet, a letter (kitāb)]
      quoted: [umma šarru bēlka ... alka attā šumma mārka šupur u tāmar šarra, innahu min Sulaymāna ... allā taʿlū ʿalayya waʾtūnī muslimīn]
      outcome: [refusal means death by the king's axe with all your family, refusal means armies they cannot face and expulsion in humiliation]
    note: 'A royal letter, opening with the sender''s name (''thus says the king your lord'' / ''it is from Sulaymān''), orders a ruler to come: ''come yourself, or send your son, and see the king'' (alka attā šumma mārka šupur) against ''do not exalt yourselves against me and come to me in submission'' (waʾtūnī muslimīn). Both letters frame obedience as the way to survive: ''serve the king and live ... or die by the king''s axe (haṣṣinni ša šarri tamât) with all your family''; Sulaymān''s answer to the gift is ''we will come on them with armies they cannot face and drive them out humbled'' (27:37).'
  - with: quran-26-moses-and-pharaoh
    motif: rule-from-sunrise-to-sunset
    refs: ['EA 162 r:78-81']
    with_refs: ['26:28']
    relation: divergence
    record:
      agent: [the king of Egypt (of himself), Moses (to Pharaoh)]
      name: ['the king, well like the sun in heaven', rabbu l-mashriqi wa-l-maghribi]
      place: [from sunrise to sunset, the east and the west and what is between]
      quoted: [šalim šarru kīma Šamši ina šamê ... ṣīt šamši adi ereb šamši, rabbu l-mashriqi wa-l-maghribi wa-mā baynahumā]
    note: The span from the rising to the setting of the sun belongs, in the Egyptian king's own letter, to the king, who is 'well like the sun in heaven' with his troops 'from sunrise to sunset' (ṣīt šamši adi ereb šamši). In 26:28 Moses answers Pharaoh's 'what is the Lord of the worlds?' with 'the Lord of the east and the west and what is between them'. The same title is taken from the king of Egypt and given to his challenger's Lord, and Pharaoh replies with a threat (26:29).
- unit: ane-ea-119-rib-addi-guard-yourself
  checked: [quran-12-joseph-full, quran-48-fath-clear-victory-and-pledge, quran-28-qarun, quran-7-moses-pharaoh, quran-68-qalam-the-pen-and-the-slanderer]
  matches:
  - with: quran-12-joseph-full
    motif: falling-down-before-the-ruler-of-egypt
    refs: ['EA 119 o:5-7']
    with_refs: ['12:100']
    relation: echo
    record:
      agent: [Rib-Addi of Byblos, Joseph's parents and brothers]
      action: [fall down before the ruler of Egypt, fall down before the ruler of Egypt]
      recipient: [the king of Egypt, Joseph]
      number: [seven and seven times, null]
      quoted: [ana šēpē bēlīya Šamšīya 7-šu 7-tān amqut, wa-kharrū lahu sujjadā]
    note: 'Akkadian maqātu ''to fall'' and Arabic kharra ''to fall down'' for the same gesture before Egypt''s ruler: the Canaanite vassal ''fell at the feet of my lord, my Sun, seven times and seven times'', and Joseph''s family, arrived from the desert, ''fell down before him prostrate'' (12:100). The Amarna formula counts the falls; the Quran gives no number, and Joseph names the scene as the fulfilment of his dream.'
  - with: quran-68-qalam-the-pen-and-the-slanderer
    motif: ruler-told-not-to-heed-slanderer
    refs: ['EA 119 o:24-29']
    with_refs: ['68:10', '68:11']
    relation: echo
    record:
      recipient: [the king, the prophet]
      action: [is asked not to listen to the slander, is told not to obey the slanderer]
      quoted: [ul yišme šarru karṣī ward kittīšu, wa-lā tuṭiʿ kulla ḥallāfin mahīnin hammāzin mashshāʾin bi-namīm]
    note: Rib-Addi asks that 'the king not hear slander (karṣī) of his true servant' spoken by hostile men (šārūtu); 68:10-11 tells the prophet 'do not obey any contemptible swearer, backbiter (hammāz) who goes about with slander (namīm)'. Both put the ruler under a prohibition on heeding the slanderer.
