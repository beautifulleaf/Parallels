- unit: ane-ea-254-labaya
  checked: [quran-89-dawn, quran-68-qalam-the-pen-and-the-slanderer, quran-17-iblis-and-adam, quran-49-hujurat-etiquette-and-brotherhood]
  matches:
  - with: quran-49-hujurat-etiquette-and-brotherhood
    motif: slander-as-eating
    refs: ['EA 254 o:16-18']
    with_refs: ['49:12']
    relation: echo
    record:
      agent: [hostile men, one of you]
      action: [eat a man's 'pieces' (slander him), eat the flesh of his dead brother (backbite him)]
      object: [Labaya's 'pieces', a brother's flesh]
      quoted: [anumma yikalū karṣīya habālu-ma, wa-lā yaghtab baʿḍukum baʿḍan a-yuḥibbu aḥadukum an yaʾkula laḥma akhīhi maytan]
      outcome: [the king does not examine my guilt, fa-kariḥtumūhu (you would loathe it)]
    note: 'Akkadian akālu karṣī ''to eat (someone''s) pieces'' is the ordinary idiom for slander: Labaya complains ''now they eat my pieces wrongfully'' (yikalū karṣīya habālu-ma). Q 49:12 builds its ban on backbiting (ghība) on the same image, made literal and repellent: ''would one of you like to eat the flesh of his dead brother (an yaʾkula laḥma akhīhi maytan)?'' In both slander of an absent man is eating his body.'
