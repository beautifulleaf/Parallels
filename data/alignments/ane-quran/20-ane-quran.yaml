    note: The treaty formula in the sovereign's first person, 'with my friend be friendly, with my enemy (nakrīya) be hostile', against God's first person in 60:1, 'do not take my enemy and your enemy (ʿaduwwī wa-ʿaduwwakum) as friends (awliyāʾ)'. In both the superior party names his enemy as the partner's enemy; 60:1 adds the secret passing of affection to them (tusirrūna ilayhim bi-l-mawadda).
