      quoted: [kīam lā taqabbi anāku ša riksi u ša māmīti-mi mimma lū lā īde-mi, an taqūlū yawma l-qiyāmati innā kunnā ʿan hādhā ghāfilīn]
    note: 'Both covenants name in advance the excuse they rule out, in direct speech after ''do not say'' / ''lest you say'': the vassal may not plead ''I am bound by treaty and oath, I know nothing (lū lā īde)'' while fugitives sit in his land; the descendants of Adam are made to witness ''Am I not your Lord?'' ''lest you say on the day of resurrection: we were unaware of this (ghāfilīn)''.'
