- unit: ane-ea-138-rib-addi-in-beirut
  checked: [quran-28-qarun, quran-8-fifth-and-badr-vision, quran-43-zukhruf-pharaoh-claims, quran-3-badr-uhud]
  matches:
  - with: quran-3-badr-uhud
    motif: report-of-the-leader-s-death-and-defection
    refs: ['EA 138 o:63-b.e:67', 'EA 138 r:111-113']
    with_refs: ['3:144']
    relation: echo
    record:
      agent: [the city of Byblos, the believers]
      action: [says 'our lord is dead' and goes over to Aziru, would turn back on their heels if he died or were killed]
      name: [Rib-Addi, Muḥammad]
      quoted: [allû-mi mīt bēlnu ... mīt Rib-Addi kikānu ištu qātīšu, a-fa-in māta aw qutila nqalabtum ʿalā aʿqābikum]
      outcome: [the city is handed to Aziru, whoever turns back harms God not at all]
    note: 'Byblos uses the report ''our lord is dead, Rib-Addi is dead: so (we are free) from his hand'' to go over to Aziru while its ruler is away. 3:144 (Uhud, where the prophet was reported killed) asks the believers: ''if he dies or is killed, will you turn back on your heels?'' The leader''s death, real or reported, as the moment of defection; in the Quran the defection is forestalled because Muḥammad ''is only a messenger, messengers have passed before him''.'
