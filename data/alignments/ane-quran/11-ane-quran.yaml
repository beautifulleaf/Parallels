      quoted: [ina rūqi ina pî nārāti uštēšibūʾinni, lā abraḥu ḥattā ablugha majmaʿa l-baḥrayni]
      outcome: [given life like the gods, given mercy and knowledge from us]
    note: The immortal flood hero is settled 'far away, at the mouth of the rivers' (ina pî nārāti), where Gilgameš seeks him; Moses vows to go on 'until I reach the meeting place of the two seas, or travel for ages', and there finds 'a servant whom we gave mercy and taught knowledge from us' (18:65).
- unit: ane-gilg-sb-xi-sleep-test
  checked: [quran-4-fighting-and-death, quran-2-sleeper-hundred-years, quran-18-companions-of-the-cave, quran-39-death-and-sleep]
  matches:
  - with: quran-2-sleeper-hundred-years
    motif: food-marks-the-length-of-a-sleep
    refs: ['Gilg SB XI:221-230']
    with_refs: ['2:259']
    relation: divergence
    record:
      agent: [Ūta-napišti's wife, God]
      object: [a loaf baked for each day, his food and drink]
      action: [shows the time slept, is shown to the sleeper]
      number: [7 loaves for 7 days, 100 years]
      quoted: [ištât šābulat kurummassu šanītu muššukat ... hamuštu šīpa ittadi, fa-nẓur ilā ṭaʿāmika wa-sharābika lam yatasannah]
      outcome: [the loaves have dried and gone mouldy in turn, the food has not gone stale]
    note: 'A loaf a day is set by Gilgameš''s head; the first is dried up, the second leathery, the fifth mouldy, the seventh on the coals: decay counts the seven days. In 2:259 the man dead a hundred years is told ''look at your food and drink: it has not changed (lam yatasannah)'', while the donkey''s bones show the time.'
  - with: quran-2-sleeper-hundred-years
    motif: sleeper-thinks-he-slept-a-moment
    refs: ['Gilg SB XI:232-233']
    with_refs: ['2:259']
    relation: parallel
    record:
      agent: [Gilgameš, the man who passed the town]
      action: [thinks he slept only a moment, thinks he stayed a day or part of a day]
      time: [seven days, a hundred years]
      quoted: [annimiš šittu irhû elīya hanṭiš taltaptannī-ma taddakânni attā, labithtu yawman aw baʿḍa yawmin]
    note: Woken, Gilgameš says 'no sooner had sleep spilled over me than you touched me and roused me'; the man raised after a hundred years answers 'I stayed a day or part of a day' (2:259). The other side then proves the true length by food (XI:225-230; 2:259 the food and the donkey).
  - with: quran-18-companions-of-the-cave
    motif: sleeper-thinks-he-slept-a-moment
    refs: ['Gilg SB XI:232-233']
    with_refs: ['18:19', '18:25']
    relation: parallel
    record:
      agent: [Gilgameš, the Companions of the Cave]
      action: [thinks he slept only a moment, think they stayed a day or part of a day]
      time: [seven days, three hundred years and nine]
      quoted: [annimiš šittu irhû elīya, labithnā yawman aw baʿḍa yawmin]
    note: The same misjudgement of a long sleep; in 18:19 the sleepers then send one of them with their coins to fetch food (ṭaʿām), and 18:25 gives three hundred and nine years.
