- unit: ane-gilg-sb-x-uta-napishti-on-death
  checked: [quran-31-signs-and-unseen, quran-57-hadid-iron-and-monasticism, quran-10-rain-parable-idols-disown, quran-71-noah, quran-67-mulk-heavens-lamps-and-hell]
  matches:
  - with: quran-67-mulk-heavens-lamps-and-hell
    motif: gods-fix-death-and-life
    refs: ['Gilg SB X:321']
    with_refs: ['67:2']
    relation: echo
    record:
      agent: [the Anunnaki and Mammītu, God]
      action: [established death and life, created death and life]
      object: [death and life, death and life]
      quoted: [ištaknū mūta u balāṭa, alladhī khalaqa l-mawta wa-l-ḥayāta]
    note: 'The pair in the same unusual order, death before life: mūta u balāṭa ''death and life they established'' (X:321); al-mawta wa-l-ḥayāta ''who created death and life'' (67:2). Gilgameš: decreed in the gods'' assembly; 67:2: ''to test which of you is best in deed'' (li-yabluwakum).'
  - with: quran-31-signs-and-unseen
    motif: hidden-time-or-place-of-death
    refs: ['Gilg SB X:322']
    with_refs: ['31:34']
    relation: echo
    record:
      agent: [the gods, God]
      object: [the day of death, the land where one dies; the Hour]
      outcome: [not revealed to men, no soul knows]
      quoted: [ša mūti ul uddû ūmīšu, wa-mā tadrī nafsun bi-ayyi arḍin tamūt]
    note: '''The day of death they did not reveal'' (ša mūti ul uddû ūmīšu); 31:34 ''no soul knows in which land it will die'', and God alone has knowledge of the Hour (ʿindahu ʿilmu s-sāʿa). The hidden detail differs: the day in Gilgameš, the place (and tomorrow''s earnings) in 31:34.'
- unit: ane-gilg-sb-xi-how-did-you-find-life
  checked: [quran-19-prophets-remembered, quran-23-noah, quran-12-joseph-full, quran-26-noah]
  matches:
  - with: quran-23-noah
    motif: flood-hero-found-to-be-an-ordinary-man
    refs: ['Gilg SB XI:2-4']
    with_refs: ['23:24']
    relation: divergence
    record:
      agent: [Gilgameš, the chiefs of Noah's people]
      recipient: ['Ūta-napišti, the flood hero', 'Noah, the flood hero']
      action: [says he is just like me, says he is only a man like you]
      quoted: [minâtūka ul šanâ kī yâtī-ma attā, mā hādhā illā basharun mithlukum]
      outcome: ['wonder: how did you find life?', 'scorn: he wants superiority over you']
    note: The flood hero is told he is an ordinary man. Gilgameš, expecting a god, says in wonder 'your form is not different, you are just like me' and asks how he found life; Noah's people say in scorn 'he is only a man like you; had God willed he would have sent angels' (23:24; cf. 11:27 mā narāka illā basharan mithlanā).
- unit: ane-gilg-sb-xi-flood-decision-and-warning
  checked: [quran-11-noah, quran-71-noah, quran-23-noah]
  matches:
  - with: quran-71-noah
    motif: flood-hero-promises-his-city-rain-of-plenty
    refs: ['Gilg SB XI:43-47']
    with_refs: ['71:10-12']
    relation: divergence
    record:
      agent: [Ūta-napišti, Noah]
      recipient: [the city of Šuruppak, his people]
      action: [promises that heaven will rain plenty on them, promises that heaven will rain plenty on them]
      quoted: [ana kâšunu ušaznanakkunūši nuhšam; ina šēr kukkī ina līlâti ušaznanakkunūši šamût kibāti, yursili s-samāʾa ʿalaykum midrāran; wa-yumdidkum bi-amwālin wa-banīna]
      outcome: ['a cover story: the rain is the flood', 'a true promise on condition of repentance; refused, they drown']
    note: 'On Ea''s orders Ūta-napišti tells the city ''he will rain down on you plenty (nuhšu) ... in the morning bread-cakes, in the evening a torrent of wheat'': deceit that hides the coming deluge. Noah tells his people ''ask forgiveness: he will send the sky on you in torrents (midrāran) and give you wealth and sons'' (71:10-12), meant truly; they refuse and are drowned (71:25 ughriqū).'
  - with: quran-11-noah
    motif: build-vessel-on-instruction
    refs: ['Gilg SB XI:24', 'Gilg SB XI:28-31']
    with_refs: ['11:37']
    relation: parallel
    record:
      agent: [Ea, God]
      recipient: [Ūta-napišti, Noah]
      action: [orders him to build a boat, orders him to build the ship]
      instrument: [words spoken to a reed wall, under our eyes and our revelation]
      quoted: [uqur bīta bini eleppa, wa-ṣnaʿi l-fulka bi-aʿyuninā wa-waḥyinā]
    note: '''Demolish the house, build a boat'' (uqur bīta bini eleppa), with dimensions (breadth equal to length, roofed like the Apsû); 11:37 ''build the ship under our eyes and our revelation'', no dimensions. Ea speaks through the reed wall to keep the gods'' oath; God speaks to Noah directly and forbids him to plead for the wrongdoers (wa-lā tukhāṭibnī fī lladhīna ẓalamū).'
- unit: ane-gilg-sb-xi-boat-built-and-loaded
  checked: [quran-11-noah, quran-54-qamar-moon-split-and-noah, quran-23-noah]
  matches:
  - with: quran-11-noah
    motif: townspeople-at-the-building-of-the-vessel
    refs: ['Gilg SB XI:48-56']
    with_refs: ['11:38']
    relation: divergence
    record:
      agent: [the population (mātu), chiefs of his people (malaʾun min qawmihi)]
      action: [gather at his gate and help build, pass by and mock him]
      quoted: [ina bāb atar-hasīs ipahhur mātu, kullamā marra ʿalayhi malaʾun min qawmihi sakhirū minhu]
      outcome: ['carpenter, reed-worker, old men, rich and poor bring tools and materials', 'Noah: we will mock you as you mock']
    note: 'While the boat is built the townspeople come: in XI the whole land assembles at Atra-hasīs''s gate and works on it (axes, palm-fibre rope, bitumen); in 11:38 each group of his people that passes laughs at him (sakhirū minhu).'
  - with: quran-54-qamar-moon-split-and-noah
    motif: ark-of-planks-and-palm-fibre
    refs: ['Gilg SB XI:54']
    with_refs: ['54:13']
    relation: echo
    record:
      object: [rope of palm-fibre, planks and dusur]
      action: [carried for the boat, the ark is made of]
      quoted: [šībūtu izabbilū pitilta, dhāti alwāḥin wa-dusurin]
      outcome: [null, Noah carried on it]
    note: The old men bring palm-fibre rope (pitiltu) for the boat; 54:13 calls the ark 'a thing of planks and dusur', a rare word glossed by the exegetes as nails or as palm-fibre cords. The only material named on the Quran side besides planks; the echo holds only on the palm-fibre gloss.
  - with: quran-11-noah
    motif: what-is-loaded-into-the-vessel
    refs: ['Gilg SB XI:84-86']
    with_refs: ['11:40']
    relation: divergence
    record:
      agent: [Ūta-napišti, Noah]
      action: [loads the boat, is told to load the ship]
      object: [seed of all living things; wild animals; all kith and kin; craftsmen of every skill; silver and gold, 'of every kind a pair, two; your family except the one condemned; whoever has believed']
      quoted: [zēr napšāti kalāma; kala kimtīya u sallatīya; mārī ummânī kalīšunu, min kullin zawjayni thnayni wa-ahlaka illā man sabaqa ʿalayhi l-qawlu wa-man āmana]
    note: XI loads 'whatever seed of living things' without pairing, all his kin, 'persons of every skill and craft' and his silver and gold; 11:40 'of every kind two, a pair', his family 'except the one against whom the word has gone forth' (the son, 11:42-43) and the believers, 'and only a few believed'. The craftsmen and treasure become the believers; the whole family becomes the family minus one.
  - with: quran-11-noah
    motif: sign-to-board-the-vessel
    refs: ['Gilg SB XI:87-91']
    with_refs: ['11:40']
    relation: divergence
    record:
      agent: [Šamaš, God]
      action: [sets the sign for boarding, sets the sign for loading the ship]
      time: [when he rains bread-cakes in the morning and wheat in the evening, when our command comes and the oven boils]
      quoted: [adanna šamaš iškunam-ma ina šēr kukkī ina lilâti ušaznanu šamût kibāti erub-ma ana libbi eleppim-ma pihe bābka, ḥattā idhā jāʾa amrunā wa-fāra t-tannūru qulnā ḥmil fīhā]
    note: 'Both signs come from the bakery: Šamaš''s deadline is the ''rain of bread-cakes (kukkū) and wheat'', then ''go into the boat and seal your hatch''; in 11:40 (and 23:27) it is that ''the oven (al-tannūr) boils'', then ''load it''. tannūr is the Akkadian tinūru (bread oven), though Gilgameš does not use the word here.'
  - with: quran-11-noah
    motif: who-pilots-the-vessel
    refs: ['Gilg SB XI:94-96']
    with_refs: ['11:41']
    relation: divergence
    record:
      agent: [Ūta-napišti, Noah]
      action: [entrusts the boat on boarding, entrusts the ship on boarding]
      recipient: [Puzur-Enlil the boatman, God's name]
      quoted: [ana puzur-ellil malāhi ēkalla attadin, irkabū fīhā bi-smi llāhi majrāhā wa-mursāhā]
    note: Having sealed the hatch, Ūta-napišti hands the 'palace' (the boat) and its goods to the boatman Puzur-Enlil; Noah says 'embark, in the name of God its course and its mooring' (11:41), and the ship runs 'under our eyes' (54:14). A named human pilot against the divine name.
- unit: ane-gilg-sb-xi-the-deluge
  checked: [quran-54-qamar-moon-split-and-noah, quran-11-noah, quran-71-noah, quran-26-noah, quran-69-haqqa-destroyed-peoples-and-the-throne]
  matches:
  - with: quran-69-haqqa-destroyed-peoples-and-the-throne
    motif: days-and-nights-of-the-destroying-wind
    refs: ['Gilg SB XI:128-129']
    with_refs: ['69:7']
    relation: divergence
    record:
      agent: ['wind, deluge and gale (šāru abūbu mehû)', a roaring violent wind (rīḥ ṣarṣar ʿātiya)]
      action: [blows and flattens the land, is set against ʿĀd]
      time: [six days and seven nights, seven nights and eight days]
      number: ['6 days, 7 nights', '7 nights, 8 days']
      quoted: [šeššet urrī u sebe mušâti illak šāru abūbu mehû, sabʿa layālin wa-thamāniyata ayyāmin ḥusūman]
    note: 'A destroying wind counted in unequal days and nights: Gilgameš six days and seven nights (nights one more), 69:7 seven nights and eight days (days one more), against ʿĀd, not Noah''s people. In XI:128 ''seven'' is a supplied word in some witnesses. The flood itself has no count in the Quran.'
  - with: quran-11-noah
    motif: how-the-flood-ends
    refs: ['Gilg SB XI:130-133b']
    with_refs: ['11:44']
    relation: divergence
    record:
      agent: [the sea and the tempest, God (by a command)]
      action: [grow calm by themselves on the seventh day, earth and sky are commanded]
      quoted: [inūh tâmtu ušharrir imhullu abūbu ikla, yā arḍu blaʿī māʾaki wa-yā samāʾu aqliʿī wa-ghīḍa l-māʾu]
    note: In XI the sea 'grew calm' (inūh), the tempest 'grew still' and the Deluge 'stopped' (ikla) on the seventh day; in 11:44 the earth is told 'swallow your water' and the sky 'cease', and the water sank.
- unit: ane-gilg-sb-xi-landing-birds-sacrifice
  checked: [quran-11-noah, quran-54-qamar-moon-split-and-noah, quran-23-noah]
  matches:
  - with: quran-11-noah
    motif: vessel-rests-on-mountain
    refs: ['Gilg SB XI:142-146']
    with_refs: ['11:44']
    relation: parallel
    record:
      object: [the boat, the ship]
      action: [comes to rest on a mountain, comes to rest on a mountain]
      name: [Mount Nimuš, al-Jūdī]
      quoted: [ana šadî nimuš ītemid eleppu, wa-stawat ʿalā l-jūdiyyi]
    note: ana šadî nimuš ītemid eleppu 'on Mount Nimuš the boat ran aground', held fast six days; wa-stawat ʿalā l-jūdiyyi 'and it settled on al-Jūdī'. Different names (and Genesis has 'the mountains of Ararat').
  - with: quran-11-noah
    motif: what-the-flood-hero-does-on-landing
    refs: ['Gilg SB XI:157-160']
    with_refs: ['11:48']
    relation: divergence
    record:
      agent: [Ūta-napišti, God to Noah]
      action: [brings out an offering and sacrifices on the peak, is told to go down with peace]
      place: [the peak of the mountain, null]
      quoted: [ušēṣī-ma ana erbet šārī attaqi niqâ; aškun surqinna ina muhhi ziqqurrat šadî, yā nūḥu hbiṭ bi-salāmin minnā wa-barakātin ʿalayka]
    note: 'On leaving the boat Ūta-napišti sacrifices to the four winds and strews incense on the mountain top, and the gods gather like flies; 11:48 has no birds and no sacrifice: Noah is told ''go down with peace from us and blessings''.'
- unit: ane-gilg-sb-xi-necklace-enlil-ea-immortality
  checked: [quran-6-final-reckoning, quran-11-noah, quran-53-najm-goddesses-and-scrolls, quran-4-false-accusation, quran-54-qamar-moon-split-and-noah, quran-18-moses-and-the-servant, quran-71-noah]
  matches:
  - with: quran-6-final-reckoning
    motif: individual-responsibility-for-sin
    refs: ['Gilg SB XI:185-186']
    with_refs: ['6:164']
    relation: echo
    record:
      agent: [Ea to Enlil, God (qul)]
      action: [lay on the sinner his sin, each soul bears its own]
      quoted: [bēl arni emid hīṭāšu bēl gillati emid gillassu, wa-lā taksibu kullu nafsin illā ʿalayhā wa-lā taziru wāziratun wizra ukhrā]
    note: 'Ea''s rebuke after the flood: ''on him who commits a sin, inflict his crime; on him who does wrong, his wrong-doing'', against a flood that killed all; 6:164 ''every soul earns only against itself, and no bearer of burdens bears another''s burden''.'
  - with: quran-53-najm-goddesses-and-scrolls
    motif: individual-responsibility-for-sin
    refs: ['Gilg SB XI:185-186']
    with_refs: ['53:38-39']
    relation: echo
    record:
      agent: [Ea to Enlil, the scrolls of Moses and Abraham]
      action: [lay on the sinner his sin, no bearer bears another's burden]
      quoted: [bēl arni emid hīṭāšu, allā taziru wāziratun wizra ukhrā wa-an laysa li-l-insāni illā mā saʿā]
    note: The same principle; in 53:36-38 it is quoted as the content of 'the scrolls of Moses and of Abraham who fulfilled'.
  - with: quran-4-false-accusation
    motif: individual-responsibility-for-sin
    refs: ['Gilg SB XI:185']
    with_refs: ['4:111-112']
    relation: echo
    record:
      object: [his sin (hīṭu), 'a sin (khaṭīʾa, ithm)']
      action: [is laid on the one who did it, is earned only against oneself]
      quoted: [bēl arni emid hīṭāšu, wa-man yaksib ithman fa-innamā yaksibuhu ʿalā nafsihi wa-man yaksib khaṭīʾatan aw ithman thumma yarmi bihi barīʾan]
    note: 'Akkadian hīṭu and Arabic khaṭīʾa are the same root (h-ṭ-ʾ). 4:111-112: the sin is earned against oneself, and casting it on an innocent (barīʾ) is calumny; Ea objects that the flood struck the innocent with the guilty.'
  - with: quran-71-noah
    motif: no-one-to-survive-the-destruction
    refs: ['Gilg SB XI:175-176']
    with_refs: ['71:26-27']
    relation: divergence
    record:
      agent: [Enlil, Noah]
      action: [demands that no man survive, asks that no unbeliever be left]
      object: [every man, the unbelievers]
      quoted: [ayyānum-ma uṣi napištu ay ibluṭ mamman ina karāši, rabbi lā tadhar ʿalā l-arḍi mina l-kāfirīna dayyāran]
      outcome: [Ea rebukes him; the hero is made immortal, the prayer stands; they are drowned]
    note: The wish that the destruction leave no one alive is the angry flood god's in XI, said on seeing the boat; in 71:26-27 it is the flood hero's own prayer, limited to the unbelievers 'for they would beget only the wicked'.
  - with: quran-11-noah
    motif: blessing-of-the-flood-hero-after-the-flood
    refs: ['Gilg SB XI:199-204']
    with_refs: ['11:48']
    relation: divergence
    record:
      agent: [Enlil, God]
      recipient: [Ūta-napišti and his wife, Noah and nations from those with him]
      action: [blesses him after the flood, blesses him after the flood]
      quoted: [ilput pūtnī-ma ... ikarrabannâši; lū emû kīma ilī nâšim-ma, ihbiṭ bi-salāmin minnā wa-barakātin ʿalayka wa-ʿalā umamin mimman maʿaka]
      outcome: ['made like the gods, immortal', peace and blessings; other nations will be given enjoyment then punished]
    note: 'Enlil takes him out of the boat, touches their foreheads and blesses them (ikarrabannâši): ''now Ūta-napišti and his woman shall be like us gods''; 11:48 ''go down with peace from us and blessings (barakāt) on you and on nations from those with you'', and ''nations we will let enjoy, then a painful punishment will touch them''. Immortality for one couple against blessing on a mortal line.'
