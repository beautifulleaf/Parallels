    motif: token-of-remembrance-after-the-flood
    refs: ['Gilg SB XI:165-167']
    with_refs: ['54:15']
    relation: divergence
    record:
      agent: [Bēlet-ilī, God]
      object: [her lapis necklace of flies, the ark]
      action: [keeps a token so the flood is remembered, leaves a sign so the flood is remembered]
      quoted: [ilū annûtu lū uqnî kišādīya ūmī annûti luhsusam-ma ana dāriš ay amši, wa-laqad taraknāhā āyatan fa-hal min muddakirin]
      outcome: [the goddess will remember forever, 'is there anyone who will remember?']
    note: 'Bēlet-ilī lifts the great flies of lapis: ''let these be lapis beads round my neck, that I remember these days and never forget them''; 54:15 ''we left it (the ark) as a sign: is there anyone who will remember (muddakir)?'' (cf. 69:12 tadhkira). The one who must remember is the goddess in XI, mankind in Q 54.'
