- unit: ane-gilg-sb-ix-scorpion-people
  checked: [quran-18-dhul-qarnayn, quran-53-najm-vision-and-lote-tree, quran-25-signs-shadow-seas, quran-50-qaf-two-recorders-and-hell-asks-more]
  matches:
  - with: quran-18-dhul-qarnayn
    motif: traveller-reaches-sunrise-and-sunset-places
    refs: ['Gilg SB IX:39', 'Gilg SB IX:45']
    with_refs: ['18:86', '18:90']
    relation: parallel
    record:
      agent: [Gilgameš, Dhū l-Qarnayn]
      action: [reaches the places of the sun, reaches the places of the sun]
      place: [the rising and the setting of the sun, the setting and the rising of the sun]
      quoted: [ana aṣê šamši u ereb šamši; aṣê šamši, maghriba sh-shams; maṭliʿa sh-shams]
    note: 'The Māšu mountains guard ''the rising of the sun'' (aṣê šamši) and ''at sunrise and sunset'' (ana aṣê šamši u ereb šamši) the sun; Dhū l-Qarnayn follows a way (fa-atbaʿa sababan) to maghrib ash-shams (18:86) and maṭliʿ ash-shams (18:90). Gilgameš then takes ''the road of the sun'' (harrān šamaš, IX:138). The order differs: rising first in IX:39, setting first in 18:86-90.'
  - with: quran-18-dhul-qarnayn
    motif: twin-mountains-at-the-ends-of-the-earth
    refs: ['Gilg SB IX:38']
    with_refs: ['18:93', '18:96']
    relation: echo
    record:
      agent: [Gilgameš, Dhū l-Qarnayn]
      action: [comes to twin mountains, comes between two mountain barriers]
      place: [šad māši (twin mountains), bayna s-saddayn; bayna ṣ-ṣadafayn]
      outcome: [scorpion-people guard the gate, he walls the gap against Yaʾjūj and Maʾjūj]
    note: ana šad māši ina kašādīšu 'when he came to the twin mountains of Māšu' (dual); 18:93 ḥattā idhā balagha bayna s-saddayni, 18:96 sāwā bayna ṣ-ṣadafayni. Both a pair of mountains reached at the far end of the sun's course; in IX guarded by scorpion-people at a gate, in 18 closed with iron and copper.
