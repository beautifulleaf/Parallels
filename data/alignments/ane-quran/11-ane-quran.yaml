# ANE x Quran side-by-side pass, chunk 11 (Gilgameš SB IX-XII, Gula hymns, Ishtar's Descent, Ishtar hymns, Lipit-Eštar A, Ludlul bēl nēmeqi, Maqlû I-IV). Judged blind, from the originals.
