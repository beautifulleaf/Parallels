    motif: fire-kindled-to-make-bricks-for-a-lofty-house
    refs:
    - KTU 1.4 VI:22-35
    with_refs:
    - '28:38'
    relation: divergence
    record:
      action:
      - fire is set in the house
      - fire is kindled on the clay
      instrument:
      - fire
      - fire
      object:
      - silver and gold become plates and bricks
      - clay (for baked brick)
      recipient:
      - Baal's palace
      - Pharaoh's lofty tower (ṣarḥ)
      quoted:
      - tšt išt bbhtm ... ḫrṣ nsb llbnt
      - fa-awqid lī yā hāmānu ʿalā ṭ-ṭīni fa-jʿal lī ṣarḥan
      outcome:
      - Baal's house is finished and he is acclaimed king
      - Pharaoh hopes to look up to the god of Moses and is drowned
    note: 'Fire is the means by which the bricks of a lofty dwelling are made: tšt išt bbhtm nblat bhklm ... ḫrṣ nsb llbnt ''fire was set in the house, flames in the palace ... the gold turned into bricks (lbnt)''; Pharaoh, who knows no god but himself: fa-awqid lī yā hāmānu ʿalā ṭ-ṭīn ''kindle (fire) for me, Haman, upon the clay, and make me a tower''. The god''s palace of fired precious brick against the would-be god''s tower of fired clay.'
  - with: quran-50-qaf-two-recorders-and-hell-asks-more
    motif: six-days-of-building-work
    refs:
    - KTU 1.4 VI:24-35
    with_refs:
    - '50:38'
    relation: divergence
    record:
