      - Baal's palace
      - the heavens and the earth and what is between them
      time:
      - six days of burning; done on the seventh
      - six days
      number:
      - 6
      - 6
      quoted:
      - ḫmš ṯdṯ ym tikl išt ... mk bšbʿ ymm td išt
      - fī sittati ayyāmin wa-mā massanā min lughūb
      outcome:
      - Baal rejoices and holds a feast
      - no weariness touched God
    note: 'A great work counted out in six days: the fire eats in the house hn ym wṯn ... ṯlṯ kbʿ ym ... ḫmš ṯdṯ ym, and mk bšbʿ ymm ''then on the seventh day'' it dies down and the house is complete, followed by Baal''s feast; 50:38 khalaqnā s-samāwāti wa-l-arḍa ... fī sittati ayyāmin wa-mā massanā min lughūb, with no seventh-day sequel. The object (a palace vs. the cosmos) differs; the six-day count and its close do the work.'
