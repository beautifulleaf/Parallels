    motif: metal-supplied-to-make-a-god
    refs:
    - Ugarit RS 25.0131 b.e:1-r:3
    with_refs:
    - 20:87
    - 20:88
    relation: divergence
    record:
      agent:
      - Lady Aruš-Heba
      - the Sāmirī and the people
      action:
      - asks for bronze because she is making a godhead
      - throw in the people's ornaments and bring out a calf
      object:
