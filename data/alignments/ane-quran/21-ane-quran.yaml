    note: 'A dwelling built of silver and gold: sb ksp lrqm ḫrṣ nsb llbnt ... bhty bnt dt ksp hkly dtm ḫrṣ ''my house I have built of silver, my palace of gold'' is the god''s glory and the climax of the cycle; 43:33-35 suqufan min fiḍḍatin wa-maʿārija ... wa-abwāban wa-sururan ... wa-zukhrufan would be granted to unbelievers but for fear that all would become one community, and is mere matāʿ.'
