      - the calf is hailed as god and destroyed (20:97)
    note: 'Metal is collected to make a god: siparra idin inūma ilūta eppaš ... yānu siparru ''give bronze, since I am making a godhead (ilūtu); there is no bronze in my hand''; 20:87-88 ḥummilnā awzāran min zīnati l-qawmi fa-qadhafnāhā ... fa-akhraja lahum ʿijlan jasadan lahu khuwārun fa-qālū hādhā ilāhukum. A routine request in a widow''s letter against the archetypal sin of Q; the reading ilūta ''godhead'' is the editors''.'
- unit: ane-ugarit-rs-25-0134-rapanu-abimalku-brotherhood
  checked:
  - quran-4-kalala-ruling
  - quran-4-creation-kinship-orphans
  - quran-4-inheritance-shares
  - quran-4-wealth-household
  matches:
  - with: quran-4-kalala-ruling
    motif: estate-of-a-man-without-a-son
    refs:
    - Ugarit RS 25.0134 r:10-12
    with_refs:
    - 4:176
    relation: divergence
    record:
      agent:
      - Rapʾanu
      - a man (imruʾ)
      action:
      - dies without a son
      - perishes without a child
      recipient:
      - ʾAbi-malku his contracted brother
      - his sister (half) or brothers and sisters
      quoted:
      - šumma Rapʾanu imūt u māra lā išû ana ʾAbi-malku mimmûšu
      - ini mruʾun halaka laysa lahu waladun wa-lahu ukhtun fa-lahā niṣfu mā taraka wa-huwa yarithuhā in lam yakun lahā walad
      outcome:
      - all his goods go to the brother by contract
      - fixed shares to siblings by kinship
    note: 'The estate of a man who dies with no son: šumma Rapʾanu imūt u DUMU NU TUKU ana ʾAbi-malku mimmûšu ''if Rapʾanu dies and has no son, all his goods to ʾAbi-malku'', a brother made by deed (ana aḫḫūtišu īpuššu); 4:176 ini mruʾun halaka laysa lahu walad ... fa-lahā niṣfu mā tarak wa-huwa yarithuhā in lam yakun lahā walad. Contract gives the whole estate to an adopted brother; Q gives fixed shares to blood siblings.'
  - with: quran-4-wealth-household
    motif: contracted-brother-inherits
    refs:
    - Ugarit RS 25.0134 o:1-b.e:1
    - Ugarit RS 25.0134 r:10-12
    with_refs:
    - '4:33'
    relation: parallel
    record:
      agent:
      - Rapʾanu and ʾAbi-malku
      - those with whom your right hands have contracted
      action:
      - make a contract of brotherhood before the mayor and elders
      - are bound by a pact
      outcome:
      - the partner inherits
      - give them their share
      quoted:
      - ana aḫḫūtišu īpuššu
      - wa-lladhīna ʿaqadat aymānukum fa-ātūhum naṣībahum
    note: 'Inheritance through a contracted bond outside blood kinship: Rapʾanu ʾAbi-malku ana aḫḫūtišu īpuššu with 100 shekels and the childless one''s goods pass to the other; 4:33 wa-li-kullin jaʿalnā mawāliya mimmā taraka l-wālidāni wa-l-aqrabūn, wa-lladhīna ʿaqadat aymānukum fa-ātūhum naṣībahum.'
