  - unit: ane-gkab-p363269-kettledrum-bull
    checked: [quran-2-the-cow, quran-22-abraham-house-pilgrimage, quran-6-mercy-judgment]
    matches:
      - with: quran-2-the-cow
        motif: sacrificial-bovine-of-one-colour-without-spot
        refs: ["GKAB P363269 o:2-6"]
        with_refs: ["2:69", "2:71"]
        relation: divergence
        record:
          object: [a bull, a cow]
          action: [is inspected for colour and soundness, is specified by colour and soundness]
          name: [black (ṣalmu), "yellow, bright in colour (ṣafrāʾ fāqiʿ)"]
          quoted: ["alpu šuklulu ṣalmu ... šumma 7 šārtu peṣûtu kīma kakkabi takip ... ul ilaqqe", "ṣafrāʾu fāqiʿun lawnuhā ... musallamatun lā shiyata fīhā"]
          outcome: [one with seven white hairs like a star is rejected, one without any spot is slaughtered]
        note: "The same specification of the animal: one colour over the whole body, sound, and no spot of another colour. Akkadian GU₄ ŠU.DU₇ GE₆ 'a complete black bull' whose horns and hooves are intact, inspected by the expert from head to tail; if it is 'flecked with seven white hairs like a star' it is not taken. Arabic baqaratun ṣafrāʾu fāqiʿun lawnuhā ... musallamatun lā shiyata fīhā 'sound, with no blemish/patch on it'. The colour changes: black in Uruk, bright yellow in 2:69."
      - with: quran-2-the-cow
        motif: bovine-for-a-rite-never-worked
        refs: ["GKAB P363269 o:5-6"]
        with_refs: ["2:71"]
        relation: parallel
        record:
          object: [a bull, a cow]
          action: [has never been worked, has never been worked]
          instrument: [stick and whip, plough and irrigation]
          quoted: ["ina ḫaṭṭi maḫiṣ ina qinnāzi lapit ... ul ilaqqe", "lā dhalūlun tuthīru l-arḍa wa-lā tasqī l-ḥarth"]
        note: "The animal must never have been used as a working beast: Akkadian ina {giš}NIG₂.GIDRU ma-hi-iṣ ina qin-na-zu la-pit ... ul TI 'if it has been struck with a stick or touched with a whip, it is not taken'; Arabic lā dhalūlun tuthīru l-arḍa wa-lā tasqī l-ḥarth 'not broken in to till the ground or water the field'."
