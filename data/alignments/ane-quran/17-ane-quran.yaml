          quoted: ["imnaka u šumēlka uṣur lā teggi", "min bayni yadayhi wa-min khalfihi yaḥfaẓūnahu"]
          outcome: [the evil one is pushed back (sākip lemni), "they guard him by God's command; none turns back God's decree"]
        note: "A guardian set on two sides of a person: 15-ka u 2.30-ka u₂-ṣur la te-eg-gi 'guard your right and your left, do not slacken', said to the clay image 'that pushes back the evil one'; 13:11 lahu muʿaqqibātun min bayni yadayhi wa-min khalfihi yaḥfaẓūnahu min amri llāh. Right/left in the ritual, before/behind in Q; a made image against angels sent by God."
