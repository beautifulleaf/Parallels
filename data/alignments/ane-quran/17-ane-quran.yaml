    matches:
      - with: quran-75-resurrection
        motif: lunar-eclipse-as-portent
        refs: ["GKAB P363407 o:14'", "GKAB P363407 o:21'-22'"]
        with_refs: ["75:8", "75:10", "75:11"]
        relation: divergence
        record:
          object: [the moon (Sîn) eclipsed, the moon eclipsed]
          action: [people cover their heads and lament until the moon is bright again, man asks where to flee]
          quoted: ["ana sîn ina antalî ... adi antalû unammaru", "wa-khasafa l-qamar ... ayna l-mafarr ... kallā lā wazar"]
          outcome: ["prayer that the eclipse's evil not come near Uruk (ai iṭḫû)", no refuge]
        note: "The eclipse of the moon as a portent of disaster before which people seek protection. Akkadian an-na-a ša a-na {d}30 ina AN.GE₆ iz-za-mi-ir, with laments and the brazier 'until the eclipse clears' (a-di AN.GE₆ u-nam-mar), mourners with covered heads, and the refrain that confinement, murder, rebellion and the eclipse not come near Uruk. Arabic wa-khasafa l-qamar among the signs of the Day; man says ayna l-mafarr, answered kallā lā wazar. A recurring, ritually averted omen in Uruk; a single final sign with no averting in 75:8-11."
