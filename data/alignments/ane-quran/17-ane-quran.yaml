# ANE x Quran side-by-side pass, chunk 17 (GKAB Uruk/Nimrud/Sultantepe rituals and literary texts; Amarna letters). Judged blind, from the originals.
new_motifs:
  evil-spirit-wished-far-away: {label: "An evil spirit attached to a person is wished away to a vast, measured distance", cluster: demons}
  sacrificial-bovine-of-one-colour-without-spot: {label: "A bovine for a rite must be of one colour with no spot of another colour, sound in body", cluster: ritual}
  bovine-for-a-rite-never-worked: {label: "A bovine chosen for a rite has never been put to work (never struck with stick or whip, never yoked to plough or water)", cluster: ritual}
  lunar-eclipse-as-portent: {label: "An eclipse of the moon as a portent of disaster before which people seek escape or protection", cluster: cosmos}
  deity-holds-every-creature-by-the-head: {label: "The deity holds all living beings by a hold on the head (nose-rope, forelock), as a herder leads animals", cluster: deity}
  personal-god-forsakes-the-sufferer: {label: "Whether the speaker's own god has forsaken him", cluster: deity}
  heavenly-tablet-kept-or-stolen: {label: "A single heavenly tablet holding supreme decrees, and whether it is guarded or can be stolen", cluster: revelation}
  heavy-charge-offered-in-turn-and-refused: {label: "A heavy charge is offered to three who refuse it in fear, and a fourth takes it on", cluster: deity}
  wind-brings-good-tidings: {label: "The wind carries good tidings (Akkadian busrātu, Arabic bushrā)", cluster: nature}
  pharaoh-as-god: {label: "The king of Egypt is called, or calls himself, god or lord", cluster: kingship}
  speechless-with-fear-before-pharaoh: {label: "A man brought before Pharaoh is afraid and cannot speak", cluster: kingship}
  woman-likened-to-a-ploughed-field: {label: "A woman (wife) is likened to a field that is ploughed", cluster: marriage}
  slander-as-eating-a-person-s-flesh: {label: "Slander or backbiting is pictured as eating the slandered person's flesh", cluster: ethics}
  place-weeps-over-the-afflicted: {label: "A city, or heaven and earth, weeps (or does not weep) over a people in disaster", cluster: judgment}
