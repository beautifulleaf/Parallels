          object: [all evil (ghost, epilepsy, anything evil), "his qarīn, a shayṭān"]
          number: ["3,600 leagues (šār bēr)", "the distance of the two easts"]
          quoted: ["lībir nāra libbalkit šadâ lissi šār bēr ina zumrīya", "yā layta baynī wa-baynaka buʿda l-mashriqayn"]
          outcome: [the foot of evil is cut off (šēp lemutti parsat), the wish is vain on the day he comes to God]
        note: "Both wish an evil spirit that clings to a person removed to a vast, quantified distance: Akkadian li-is-se ŠAR₂ DANNA ina SU-ia₅ 'may it be 3,600 double-hours distant from my body', after crossing river and mountain; Arabic yā layta baynī wa-baynaka buʿda l-mashriqayn fa-biʾsa l-qarīn. In the ritual the incantation, recited seven times, achieves it; in 43:38 it is a regret spoken too late at judgment."
