        motif: defeated-foe-kept-as-a-sign-for-posterity
        refs: ["GKAB P338328 o:22'", "GKAB P338328 o:23'"]
        with_refs: ["10:92"]
        relation: divergence
        record:
          agent: [Marduk, God]
          object: [images of Tiāmat's eleven creatures, Pharaoh's body]
          action: [sets them at the gate of the Apsû as a sign, preserves it as a sign]
          recipient: [the gods who see it, those who come after]
          quoted: ["ibnima ṣalmīšunu ... ahrâtaš lā immaša šī lū ittu", "nunajjīka bi-badanika li-takūna li-man khalfaka āyatan"]
        note: "Enūma eliš V: Marduk makes images (ṣalmū) of the defeated monsters at the gate of the Apsû: ahrâtaš lā immaša šī lū ittu (let it be a sign never to be forgotten); 10:92: fa-l-yawma nunajjīka bi-badanika li-takūna li-man khalfaka āyatan. Akk. ittu and Ar. āya are cognate words for 'sign'. A made image of the enemy against the enemy's own body."
      - with: quran-21-cosmic-signs-and-scales
