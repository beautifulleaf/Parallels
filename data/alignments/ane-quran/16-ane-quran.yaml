# ANE x Quran side-by-side pass, chunk 16 (GKAB Sultantepe and Uruk tablets; Nabonidus 2001). Judged blind, from the originals.
new_motifs:
  mother-commits-child-to-god-s-keeping: {label: "A mother commits her child to her god's keeping, against sin or against the evil one", cluster: family}
  defeated-foe-kept-as-a-sign-for-posterity: {label: "The defeated enemy's form (image or body) is kept as a sign (Akk. ittu, Ar. āya) for those who come after", cluster: judgment}
  wind-carries-good-tidings: {label: "The wind carries good news (Akk. bussurtu, Ar. bushr, mubashshirāt)", cluster: nature}
  king-s-letter-demands-submission: {label: "A king's letter to another ruler, opening with the sender's name, demands submission and threatens to march on his cities", cluster: kingship}
  god-gives-an-heir-to-the-childless: {label: "The deity gives an heir (son) to a man who has none", cluster: family}
  short-measure-given-full-measure-taken: {label: "Giving with the small measure and taking with the large: short weight to others, full weight for oneself", cluster: law}
  withholding-known-testimony: {label: "Knowing the matter and not speaking: withholding testimony as a sin", cluster: law}
  bribing-the-judge: {label: "Making the judge take a bribe to win a case", cluster: law}
  hands-washed-before-prayer: {label: "Hands must be washed before they are raised in prayer or before prayer", cluster: ritual}
  evil-plot-recoils-on-its-author: {label: "The evil plot or sorcery turns back upon its own author", cluster: wisdom}
  adversary-becomes-a-friend: {label: "The adversary is reconciled and becomes a friend; who spoke evil speaks good", cluster: wisdom}
  liability-for-another-s-guilt: {label: "Whether one person's guilt (a parent's, another's) comes upon someone else", cluster: theology}
  power-by-which-the-dead-are-revived: {label: "By whose power a healer revives the dead and heals the sick", cluster: deity}
  the-dead-and-clay-or-dust: {label: "The dead man and his turning into clay or dust", cluster: death}
  bird-omen-attached-to-a-person: {label: "Augury: a bird's flight or alighting is an omen bound to a person", cluster: magic}
  do-not-look-back-when-leaving: {label: "Not looking back when leaving behind the doomed place or the banished evil", cluster: ritual}
  hostile-being-ordered-out: {label: "A hostile spirit is commanded 'go out' of the dwelling", cluster: magic}
  stairway-between-the-realms: {label: "A stairway or ascending ways join the realms; divine messengers go up by them", cluster: cosmos}
  relenting-and-merciful-epithet-pair: {label: "The paired divine epithet 'relenting (who turns back) and merciful' (Akk. tayyāru u rēmēnû, Ar. al-tawwāb al-raḥīm)", cluster: deity}
  good-name-asked-of-the-deity: {label: "The petitioner asks the deity to set truth on his tongue so that he is well spoken of", cluster: wisdom}
  declaration-of-belonging-to-god: {label: "In affliction the person declares 'I belong to (the god)'", cluster: ritual}
  wiping-away-evil-kuppuru-kaffara: {label: "Evil or sin is 'wiped away' (Akk. kuppuru, Ar. kaffara ʿan)", cluster: ritual}
  reconciling-estranged-spouses: {label: "How a man and woman who have become estranged are brought together again", cluster: family}
