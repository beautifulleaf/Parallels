  - unit: ane-nabonidus-2001-ii-iii-104-years-and-kispu
    checked: [quran-3-imran-mary-zechariah, quran-19-mary-and-jesus, quran-66-tahrim-wives-and-the-four-women, quran-13-signs-of-creation]
    matches:
      - with: quran-3-imran-mary-zechariah
        motif: mother-commits-child-to-god-s-keeping
        refs: ["Nabonidus 2001 ii:36", "Nabonidus 2001 ii:37", "Nabonidus 2001 ii:39", "Nabonidus 2001 ii:40"]
        with_refs: ["3:35", "3:36"]
        relation: echo
        record:
          agent: [the mother (Adad-guppi), the mother (wife of ʿImrān)]
          action: [commits her child to her god's keeping, commits her child to God's keeping]
          object: [her son Nabonidus, her daughter Mary and her offspring]
          recipient: [Sîn, God]
          quoted: ["mārī ana Sîn bēliya apqid ... ina qāti hīṭi ... eṭiršu", "innī uʿīdhuhā bika wa-dhurriyyatahā mina sh-shayṭāni r-rajīm"]
          outcome: [kept from sin against the god, kept from the accursed Satan]
        note: "Adad-guppi: mārī ana Sîn bēliya apqid adi balṭu lā ihaṭṭakka ... ina qāti hīṭi ša ilūtika rabīti eṭiršu (I entrusted my son to Sîn my lord; while he lives may he not sin against you; save him from guilt); ʿImrān's wife: nadhartu laka mā fī baṭnī muḥarraran ... innī uʿīdhuhā bika wa-dhurriyyatahā. The same act by a mother; the danger named differs: sin against the god vs. the accursed Satan."
      - with: quran-13-signs-of-creation
        motif: guardian-beings-flank-a-person
        refs: ["Nabonidus 2001 ii:37", "Nabonidus 2001 ii:38"]
        with_refs: ["13:11"]
        relation: echo
        record:
          agent: [the god, God]
          action: [assigns protective spirits to a person, assigns guardians to a person]
          object: [the good šēdu and lamassu, muʿaqqibāt]
          quoted: ["šēdu dumqi lamassu dumqi ša ittiya tapqiduma", "lahu muʿaqqibātun min bayni yadayhi wa-min khalfihi yaḥfaẓūnahu min amri llāh"]
          outcome: [they bring her to old age, they guard him by God's command]
        note: "Adad-guppi: the good šēdu and lamassu 'you entrusted (paqādu) to me' brought her to old age, and she asks Sîn to entrust them to her son; 13:11: each has followers before and behind who guard him min amri llāh. The ANE spirits are named lesser deities; the Quranic guardians act by God's command."
