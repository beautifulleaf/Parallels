  - unit: ane-gkab-p338321-ee-4-battle-with-tiamat
    checked: [quran-21-cosmic-signs-and-scales, quran-35-originator, quran-25-signs-shadow-seas, quran-13-signs-of-creation, quran-57-hadid-iron-and-monasticism]
    matches:
      - with: quran-21-cosmic-signs-and-scales
        motif: heaven-and-earth-separated-at-the-beginning
        refs: ["GKAB P338321 r:37'", "GKAB P338321 r:38'", "GKAB P338321 r:39'", "GKAB P338321 r:40'"]
        with_refs: ["21:30"]
        relation: divergence
        record:
          agent: [Marduk, God]
          action: [splits in two to make the heavens, splits apart]
          object: [the corpse of Tiāmat, heaven and earth that were one mass (ratq)]
          quoted: ["šalamtaš ibarri ... mašṭê ana šinišu ... šamāmī uṣṣallil", "kānatā ratqan fa-fataqnāhumā"]
        note: "Enūma eliš IV: Marduk looks at her corpse (šalamtaš ibarri), splits her in two like a fish for drying (mešṭû ana šinišu) and roofs the heavens with one half; 21:30: anna s-samāwāti wa-l-arḍa kānatā ratqan fa-fataqnāhumā. The same act, splitting one mass into sky and earth; what is split is a slain enemy in EE, an undivided closed mass (ratq) in the Quran."
      - with: quran-25-signs-shadow-seas
        motif: wind-carries-good-tidings
        refs: ["GKAB P338321 r:34'", "GKAB P338321 r:35'"]
        with_refs: ["25:48"]
        relation: divergence
        record:
          agent: [the wind, God]
          action: [carries good news, sends the winds as good news]
          object: [Tiāmat's blood, rain (God's mercy)]
          quoted: ["ana bussurāti uštabil", "arsala r-riyāḥa bushran bayna yaday raḥmatihi"]
          outcome: [the fathers rejoice at the victory, pure water comes down]
        note: "Enūma eliš IV: (the north wind) ana bussurāti uštabil, carried her blood as good news, and the fathers rejoiced (ihdû irīšu); 25:48: arsala r-riyāḥa bushran bayna yaday raḥmatihi. bussurtu and bushr are the same Semitic root b-s/š-r, both borne by the wind; the tidings are of a slain enemy in EE, of coming rain in the Quran."
      - with: quran-57-hadid-iron-and-monasticism
        motif: destinies-written-in-advance
        refs: ["GKAB P338321 r:23'", "GKAB P338321 r:24'"]
        with_refs: ["57:22"]
        relation: divergence
        record:
          object: [the tablet of destinies, a book (kitāb)]
          action: [seized from Qingu and sealed to Marduk's breast, holds every calamity before creation]
          quoted: ["ṭuppi šīmāti lā simatišu ... iknukamma irtuš itmuh", "illā fī kitābin min qabli an nabraʾahā"]
          outcome: [the fates pass to whoever holds the tablet, nothing befalls that is not written beforehand]
        note: "Enūma eliš IV: Marduk takes from Qingu ṭuppi šīmāti lā simatišu (the tablet of destinies, not his by right), seals it and fastens it to his breast; 57:22: mā aṣāba min muṣībatin ... illā fī kitābin min qabli an nabraʾahā. A written record of fates in both; in EE it is an object that can be stolen and recaptured, in 57:22 a book fixed before creation."
