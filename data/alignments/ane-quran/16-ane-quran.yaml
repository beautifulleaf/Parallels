  - unit: ane-gkab-p338328-ee-5-cosmos-and-babylon
    checked: [quran-23-lordship-arguments, quran-27-is-there-a-god-with-god, quran-25-signs-shadow-seas, quran-10-moses-pharaoh, quran-21-cosmic-signs-and-scales]
