  - unit: ane-gkab-p273200-gilg-1-prologue
    checked: [quran-23-noah, quran-11-noah, quran-12-joseph-full, quran-18-dhul-qarnayn, quran-18-moses-and-the-servant]
    matches:
      - with: quran-18-dhul-qarnayn
        motif: traveller-reaches-sunrise-and-sunset-places
        refs: ["GKAB P273200 o.i:22'"]
        with_refs: ["18:90"]
        relation: echo
        record:
          agent: [Gilgameš, Dhū l-Qarnayn]
          action: [travels to the sun's rising, reaches the sun's rising]
          place: [beyond the wide sea at the sunrise, the rising-place of the sun]
          quoted: ["ēbir ayabba tâmati rapašti adi ṣīt šamši", "ḥattā idhā balagha maṭliʿa sh-shamsi"]
        note: "Gilg I: ēbir ayabba tâmati rapašti adi ṣīt šamši (who crossed the wide sea as far as the sun's rising); 18:90: ḥattā idhā balagha maṭliʿa sh-shamsi wajadahā taṭluʿu ʿalā qawmin. ṣīt šamši and maṭliʿ al-shams both name the place where the sun comes out. Gilgameš goes there seeking life; Dhū l-Qarnayn finds a people without shelter from the sun."
      - with: quran-18-dhul-qarnayn
        motif: barrier-between-two-mountains-against-invaders
        refs: ["GKAB P273200 o.i:20'", "GKAB P273200 o.i:21'"]
        with_refs: ["18:93", "18:95", "18:96"]
        relation: divergence
        record:
          agent: [Gilgameš, Dhū l-Qarnayn]
          place: [the mountains, between the two mountain walls]
          action: [opens the passes of the mountains, closes the gap between the mountains]
          quoted: ["pētû nērebēti ša huršāni", "ajʿal baynakum wa-baynahum radmā ... sāwā bayna ṣ-ṣadafayn"]
        note: "The far-travelling king at the mountains: Gilgameš is pētû nērebēti ša huršāni, hērû būri ša kišād šadî (opener of the mountain passes, digger of wells on the mountain slope); Dhū l-Qarnayn reaches bayna s-saddayn and fills the gap with iron and molten copper (radm, sāwā bayna ṣ-ṣadafayn). One opens the mountain ways, the other seals them."
      - with: quran-18-moses-and-the-servant
        motif: sage-dwells-where-the-waters-meet
        refs: ["GKAB P273200 o.i:22'", "GKAB P273200 o.i:23'", "GKAB P273200 o.i:24'"]
        with_refs: ["18:60"]
        relation: echo
        record:
          agent: [Gilgameš, Moses]
          action: [journeys to a distant sage, journeys to a distant servant of God]
          place: [across the wide sea, the meeting place of the two seas]
          name: [Uta-napišti the distant, "ʿabd min ʿibādinā (18:65)"]
          quoted: ["mušteʾʾû balāṭi ... ana Uta-napišti rūqi", "lā abraḥu ḥattā ablugha majmaʿa l-baḥrayni aw amḍiya ḥuqubā"]
        note: "Gilg I: ēbir ayabba ... mušteʾʾû balāṭi kāšid dannūssu ana Uta-napišti rūqi (crossed the sea, seeking life, reached by his strength Uta-napišti the distant); 18:60: Moses will not stop until he reaches majmaʿ al-baḥrayn or travels for ages. The quest across the sea to a far sage is shared; Gilgameš seeks life, Moses seeks knowledge (18:66)."
