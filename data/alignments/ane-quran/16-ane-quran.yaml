        note: "Enūma eliš V: hallaša retât šamāmī uṣṣallila erṣeti uktinna (her thigh fixed the heavens, he roofed and established the earth): heaven and earth made from the two parts of one body; 21:30 heaven and earth split from one closed mass."
  - unit: ane-gkab-p338325-ee-6-humanity-and-esagil
