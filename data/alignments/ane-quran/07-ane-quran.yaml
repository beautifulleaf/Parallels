  - unit: ane-etcsl-6-1-14-bc-palace-and-household
    checked: [quran-42-shura-judgment-and-divine-speech, quran-4-wealth-household, quran-51-dhariyat-abrahams-guests-and-the-peoples, quran-4-creation-kinship-orphans, quran-64-taghabun-day-of-loss-and-household-enemies]
