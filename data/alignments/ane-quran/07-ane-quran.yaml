          quoted: ["id2-kur-ra-ke4 a nu-de2 a-bi nu-mu-un-na-na8-na8", "anhārun min māʾin ghayri āsin ... wa suqū māʾan ḥamīman"]
          outcome: ["gives no water to drink", "flows for the pious while the damned are given boiling water"]
        note: "One river of the dead that pours no water, against the Garden's rivers of unspoiled water, unchanging milk, wine and pure honey, with the fire's people made to drink scalding water that cuts their bowels."
