  - unit: ane-etcsl-6-1-03-e-mouth-tongue-and-heart
    checked: [quran-25-servants-of-the-merciful, quran-22-abraham-house-pilgrimage, quran-69-haqqa-books-in-right-and-left-hands, quran-75-resurrection, quran-12-joseph-full, quran-31-luqman]
    matches:
      - with: quran-12-joseph-full
        motif: testimony-and-knowledge
        refs: ["ETCSL 6.1.03 A.3.118"]
        with_refs: ["12:81"]
        relation: echo
        record:
          agent: ["a witness", "Joseph's brothers"]
          action: ["testifies to what he does not know", "testify only to what they know"]
          quoted: ["niĝ2 nu-zu-am3 lu2-ki-inim-ma ab-ta-e3 / niĝ2-gig {d}suen-na-kam", "wa mā shahidnā illā bi-mā ʿalimnā"]
          outcome: ["an abomination to Suen", "they disclaim knowledge of the unseen"]
        note: "The witness who says 'let me tell you what I know' but does not know is niĝ2-gig to Suen; the brothers frame their report 'we testify only to what we know, and we were not guardians of the unseen'."
      - with: quran-31-luqman
        motif: speech-likened-to-a-donkey
        refs: ["ETCSL 6.1.03 A.3.114"]
        with_refs: ["31:19"]
        relation: divergence
        record:
          object: ["my tongue", "the voice"]
          instrument: ["a runaway donkey", "the donkey's bray"]
          quoted: ["eme-ĝu10 anše kar-ra-gin7 eĝer-bi-še3 nu-gi4-gi4", "inna ankara l-aṣwāti la-ṣawtu l-ḥamīr"]
          outcome: ["it will not turn back", "so lower your voice"]
        note: "Unruly speech and the donkey: the tongue runs off like a runaway donkey and will not come back; Luqmān's son is to lower his voice, for 'the most hateful of voices is the voice of donkeys'. Running away against braying."
