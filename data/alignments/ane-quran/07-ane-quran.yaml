  - unit: ane-etcsl-6-1-07-c-fate-and-the-reed
    checked: [quran-10-ingratitude-sea, quran-3-annunciation-jesus, quran-90-city, quran-69-haqqa-books-in-right-and-left-hands]
    matches:
      - with: quran-10-ingratitude-sea
        motif: calling-on-god-in-peril-at-sea
        refs: ["ETCSL 6.1.07 C.7.77"]
        with_refs: ["10:22", "10:23"]
        relation: divergence
        record:
          agent: ["the young man", "those in the ship"]
          action: ["says 'Ah god!'", "call on God sincerely"]
          instrument: ["a boat", "the ship (al-fulk)"]
          quoted: ["ĝuruš-e u8-a diĝir-ra-am3 di {ĝiš}ma2 ki-bi ba-te", "daʿawu llāha mukhliṣīna lahu d-dīn la-in anjaytanā ..."]
          outcome: ["the boat reached its destination", "they are saved and then rebel on the earth"]
        note: "Three on a boat: one says 'Woe!' and sinks, one 'Alas!' and the rudder breaks, the young man says 'Ah god!' and reaches port. In 10:22-23 those overtaken by the storm call on God alone and are saved, but once delivered 'they transgress on the earth'. The proverb ends at the safe arrival; the Quran continues to the ingratitude."
      - with: quran-3-annunciation-jesus
        motif: born-without-father-or-mother
        refs: ["ETCSL 6.1.07 C.7.93"]
        with_refs: ["3:47", "3:59"]
        relation: divergence
        record:
          object: ["the reed", "Adam (and Jesus)"]
          action: ["conceived by no father or mother", "created from dust"]
          quoted: ["[ad]-da a ḫur nu-ri / [ama-a] a ḫur nu-ri / [{gi}en3-bar] gaba ud-da [e3]-a", "inna mathala ʿīsā ʿinda llāhi ka-mathali ādama khalaqahu min turāb"]
          outcome: ["it came out of the breast of the storm", "he said to him 'Be' and he was"]
        note: "A riddle: 'conceived by no father, conceived by no mother, the reed came out of the breast of the storm'. The Quran argues from the being with neither, Adam, to the one with no father, Jesus (lam yamsasnī basharun, 3:47). The fatherless and motherless birth is a riddle about a plant in one text and an argument about a prophet in the other."
