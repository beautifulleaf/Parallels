          quoted: ["uŋ3 zar-re-eš ba-an-du8", "jaʿalnāhum ḥaṣīdan khāmidīn"]
        note: "The slain of a destroyed city as cut grain: Sumerian zar (sheaves) on the threshing places, Arabic ḥaṣīd (reaped crop), 'extinct' (khāmidīn)."
  - unit: ane-etcsl-2-2-2-k7-ningal-lament
    checked: [quran-59-hashr-banu-nadir-and-fay, quran-7-towns-pattern, quran-11-salih, quran-44-dukhan-pharaoh-drowned]
    matches:
      - with: quran-59-hashr-banu-nadir-and-fay
        motif: goods-of-the-dispossessed-pass-to-others
        refs: ["ETCSL 2.2.2 278-281"]
        with_refs: ["59:7", "59:8"]
        relation: divergence
        record:
          object: ["my silver and my gems", "what God gave from the people of the towns (fayʾ)"]
          recipient: ["those who never knew silver", "the poor emigrants (al-fuqarāʾ al-muhājirūn)"]
          quoted: ["kug-ŋu10 lu2 kug nu-zu-u3-ne šu-bi ha-ba-da-ab-si", "kay lā yakūna dūlatan bayna l-aghniyāʾi minkum ... li-l-fuqarāʾi l-muhājirīn"]
          outcome: ["lamented as plunder by strangers", "ordained so that wealth does not circulate among the rich"]
        note: "Ningal: 'those who never knew silver have filled their hands with my silver, those who never knew gems have filled their necks with my gems'. The goods of the expelled Banu Nadir go 'to the poor emigrants', expressly so they do not circulate only among the rich. The same transfer to the have-nots is a curse in one text and a rule in the other."
      - with: quran-44-dukhan-pharaoh-drowned
        motif: inheritance-turned-to-strangers
        refs: ["ETCSL 2.2.2 278-281"]
        with_refs: ["44:25", "44:26", "44:27", "44:28"]
        relation: echo
        record:
          object: ["silver, gems and stores", "gardens, springs, fields and a noble place"]
          recipient: ["those who never knew silver", "another people (qawman ākharīn)"]
          quoted: ["kug-ŋu10 lu2 kug nu-zu-u3-ne šu-bi ha-ba-da-ab-si", "wa awrathnāhā qawman ākharīn"]
        note: "The ruined city's goods are scattered and seized by others; Pharaoh's people leave their gardens and springs and 'We made another people inherit them'. Spoken by the dispossessed goddess against spoken by God."
