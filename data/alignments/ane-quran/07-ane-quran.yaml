  - unit: ane-etcsl-2-2-2-k4-ningal-pleads-an-enlil
    checked: [quran-53-najm-goddesses-and-scrolls, quran-17-polemic-and-resurrection, quran-2-patience-signs, quran-11-abraham-guests, quran-50-qaf-two-recorders-and-hell-asks-more]
    matches:
      - with: quran-11-abraham-guests
        motif: plea-to-spare-a-doomed-city
        refs: ["ETCSL 2.2.2 144-150", "ETCSL 2.2.2 154-160"]
        with_refs: ["11:74", "11:75", "11:76"]
        relation: divergence
        record:
          agent: ["Ningal", "Abraham"]
          recipient: ["An and Enlil", "God (through his messengers)"]
          object: ["her city Urim and its people", "the people of Lot"]
          action: ["pleads that the city not be destroyed", "disputes for the people of Lot"]
          number: ["twice", null]
          quoted: ["uru2-ŋu10 nam-ba-gul-lu he2-em-me-ne-dug4 ... an-ne2 e-ne-eŋ3-bi ba-ra-mu-un-gur", "yujādilunā fī qawmi lūṭ ... ātīhim ʿadhābun ghayru mardūd"]
          outcome: ["An does not turn back his word", "a punishment that cannot be turned back"]
        note: "Ningal weeps before An and begs Enlil 'let my city not be destroyed, let its people not perish', twice, in the assembly; 'An did not turn back (gur) his word, Enlil did not soothe my heart'. Abraham 'disputes with us about the people of Lot' and is told 'turn from this; your Lord's command has come; there comes upon them a punishment ghayru mardūd' (not to be turned back). The goddess pleads for her own city and is overruled by her superiors; the prophet pleads for another's people and is praised as ḥalīm awwāh munīb."
      - with: quran-50-qaf-two-recorders-and-hell-asks-more
        motif: immutable-divine-word
        refs: ["ETCSL 2.2.2 167-168"]
        with_refs: ["50:29"]
        relation: echo
        record:
          agent: ["An and Enlil", "God"]
          object: ["the command that went out from the mouth", "the word"]
          quoted: ["an-ne2 dug4-ga-ni hur nu-kur2-ru-dam / {d}mu-ul-lil2-le ka-ta e3-a-ni šu nu-bal-e-de3", "mā yubaddalu l-qawlu ladayya"]
          outcome: ["it is never changed", "it is not changed"]
        note: "'An's command is never changed (kur2); what goes out of Enlil's mouth is not overturned (šu bal)', said of the decree to destroy Urim. 50:29: 'the word is not changed (yubaddalu) with me', said at the judgment of the damned."
  - unit: ane-etcsl-2-2-2-k5-enlil-calls-storm
    checked: [quran-24-light-verse, quran-71-noah, quran-79-pharaoh-and-cosmos, quran-46-ahqaf-hud-and-the-jinn, quran-54-qamar-ad-thamud-lot-pharaoh]
    matches:
      - with: quran-46-ahqaf-hud-and-the-jinn
        motif: storm-destroys-at-the-god-s-command
        refs: ["ETCSL 2.2.2 172", "ETCSL 2.2.2 202"]
        with_refs: ["46:24", "46:25"]
        relation: parallel
        record:
          agent: ["the storm", "the wind"]
          action: ["destroys the land at its god's command", "destroys everything at its Lord's command"]
          name: ["Enlil", "rabbihā (its Lord)"]
          quoted: ["ud hul gig dug4-ga {d}en-lil2-la2 ud kalam-ta be4-be4", "tudammiru kulla shayʾin bi-amri rabbihā"]
          outcome: ["Urim is covered like a garment", "nothing is seen but their dwellings"]
        note: "Enlil 'called the storm' and it is 'the evil storm commanded (dug4-ga) by Enlil'; the wind that came on ʿĀd 'destroys everything by the command (amr) of its Lord'. In both the destroying wind is the god's spoken order, not a weather event."
      - with: quran-54-qamar-ad-thamud-lot-pharaoh
        motif: people-blown-away-by-the-storm
        refs: ["ETCSL 2.2.2 193"]
        with_refs: ["54:19", "54:20"]
        relation: echo
        record:
          agent: ["the winds", "a roaring wind (rīḥ ṣarṣar)"]
          object: ["the black-headed people", "the people"]
          action: ["blows the people away", "plucks the people out"]
          quoted: ["saŋ gig2-ga tum9-tum9 ba-an-dal", "tanziʿu n-nāsa ka-annahum aʿjāzu nakhlin munqaʿir"]
        note: "'The black-headed people were blown away by the winds'; 'it plucked the people out as if they were trunks of uprooted palms'. The Quran adds the simile; the Sumerian line is bare."
  - unit: ane-etcsl-2-2-2-k6-sack-of-urim
    checked: [quran-2-sleeper-hundred-years, quran-17-night-journey-and-israel, quran-29-destroyed-nations, quran-11-salih, quran-22-quake-and-resurrection-proofs, quran-21-heedless-and-doomed-towns]
