  - unit: ane-etcsl-6-1-05-d-wolf-and-fox
    checked: [quran-10-ingratitude-sea, quran-2-the-cow, quran-6-pagan-offerings-cattle, quran-2-four-birds, quran-38-david-ewe-parable]
    matches:
      - with: quran-38-david-ewe-parable
        motif: unequal-division-of-sheep
        refs: ["ETCSL 6.1.05 D.5.x5"]
        with_refs: ["38:23", "38:24"]
        relation: divergence
        record:
          agent: ["the fox", "my brother"]
          action: ["takes nine sheep and leaves one to the nine wolves", "has ninety-nine ewes and demands the one"]
          number: ["10 sheep: 9 to the fox, 1 to nine wolves", "99 ewes against 1"]
          quoted: ["9 za-e-en-ze2-en 1-am3 šu te-ba-ab-ze2-en / ĝe26-e dili-ĝu10-ne 9 šu ga-ba-ab-ti", "lahu tisʿun wa tisʿūna naʿjatan wa liya naʿjatun wāḥida"]
          outcome: ["told as a clever fox's trick", "judged as wrongdoing (la-qad ẓalamaka)"]
        note: "Both turn on 9 (99) against 1 in a share of sheep: the fox says 'you nine take one sheep; I alone shall take nine, this is my share'; the disputant before David says 'this my brother has ninety-nine ewes and I one ewe, and he said: entrust her to me'. A joke about a greedy partner, against a case that David judges and that turns out to be his own trial."
  - unit: ane-etcsl-6-1-05-d-dog-1
    checked: [quran-7-dog-parable, quran-2-four-birds, quran-100-chargers, quran-2-the-cow]
    matches:
      - with: quran-7-dog-parable
        motif: parable-of-the-incorrigible-dog
        refs: ["ETCSL 6.1.05 D.5.102"]
        with_refs: ["7:176"]
        relation: divergence
        record:
          agent: ["the dog", "the dog"]
          action: ["is struck and driven out and returns for the same again", "pants whether driven off or left alone"]
          quoted: ["ur-gir15-re e2 ganba-še3 ...", "in taḥmil ʿalayhi yalhath aw tatruk-hu yalhath"]
          outcome: ["its leg is broken a second time", "it is the likeness of those who deny the signs"]
        note: "The dog beaten with the door-bolt goes back 'again tonight' and has its leg broken again; the man who sloughed off God's signs is 'like the dog: if you drive at it, it pants, and if you leave it, it pants'. In both, the dog's behaviour does not change whatever is done to it."
