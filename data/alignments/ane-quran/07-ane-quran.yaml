          agent: ["Numušda", "the women's father"]
          recipient: ["Martu", "Moses"]
          action: ["offers silver and stones as reward", "calls him to be rewarded for watering"]
          quoted: ["kug mu-un-na-ba-e šu nu-um-ma-gid2-i-de3 ... dumu-zu ga-ba-ab-tuku", "li-yajziyaka ajra mā saqayta lanā ... innī urīdu an unkiḥaka iḥdā bnatayya"]
          outcome: ["Martu refuses the silver and himself asks for the daughter", "the father offers a daughter for eight years' hire"]
        note: "Martu fells all comers in the courtyard; the glad Numušda offers silver and stones three times, and Martu says 'what is your silver for? I want to marry your daughter'. Moses waters the flock; the daughter calls him to his reward (ajr), praises him as al-qawiyy al-amīn, and the father himself proposes the marriage against thamāniya ḥijaj of service."
  - unit: ane-etcsl-1-7-1-c-gifts-warning-nomad
    checked: [quran-4-creation-kinship-orphans, quran-6-pagan-offerings-cattle, quran-56-waqia-three-classes-and-the-garden, quran-9-stayers-exempt]
