  - unit: ane-etcsl-1-4-3-a-dumuzid-laments-and-dreams
    checked: [quran-19-mary-and-jesus, quran-19-zechariah-and-john, quran-3-imran-mary-zechariah, quran-12-joseph-full]
    matches:
      - with: quran-12-joseph-full
        motif: dreamer-seeks-dream-interpreter
        refs: ["ETCSL 1.4.3 19-24"]
        with_refs: ["12:43", "12:44"]
        relation: divergence
        record:
          agent: ["Dumuzid", "the king"]
          action: ["calls for those who know dreams", "calls on the council to interpret his dream"]
          recipient: ["his sister, the tablet-wise scribe, the singer, the old woman who knows the heart of dreams", "the council (al-malaʾ)"]
          quoted: ["um-ma šag4 ma-mu2-da zu-ŋu10 tum2-mu-un-ze2-en", "aftūnī fī ruʾyāya in kuntum li-r-ruʾyā taʿburūn"]
          outcome: ["his sister Ĝeštinana interprets it", "the council say they do not know the interpretation of dreams"]
        note: "Dumuzid wakes from the dream and calls 'bring, bring' his sister, 'my tablet-knowing scribe, my song-knowing singer, my old woman who knows the heart of dreams'. Pharaoh's king calls 'aftūnī fī ruʾyāya', but the council answer 'aḍghāthu aḥlām wa mā naḥnu bi-taʾwīli l-aḥlāmi bi-ʿālimīn' (12:44), and the reading is left to Joseph."
  - unit: ane-etcsl-1-4-3-b-dream-told-and-interpreted
    checked: [quran-5-two-sons-of-adam, quran-40-throne-bearers, quran-54-qamar-ad-thamud-lot-pharaoh, quran-12-joseph-full]
    matches:
      - with: quran-12-joseph-full
        motif: telling-the-dream-forbidden
        refs: ["ETCSL 1.4.3 42-43"]
        with_refs: ["12:4", "12:5"]
        relation: divergence
        record:
          agent: ["his sister Ĝeštinana", "his father"]
          recipient: ["Dumuzid", "Joseph"]
          action: ["tells him not to tell his dream", "tells him not to tell his dream"]
          quoted: ["šeš-ŋu10 ma-mu2-zu nu-sag9-sag9 nam-ma-an-bur2-e", "yā bunayya lā taqṣuṣ ruʾyāka ʿalā ikhwatika"]
          outcome: ["because the dream is not favourable", "because his brothers would plot against him"]
        note: "Ĝeštinana: 'my brother, your dream is not favourable, do not reveal it (bur2) to me', then reads it as his death. Jacob: 'my son, do not tell your dream to your brothers, lest they plot a plot against you' (fa-yakīdū laka kaydā); the dream is good and the danger is the brothers."
      - with: quran-12-joseph-full
        motif: bird-in-dream-foretells-death
        refs: ["ETCSL 1.4.3 35-36", "ETCSL 1.4.3 60-62"]
        with_refs: ["12:36", "12:41"]
        relation: divergence
        record:
          agent: ["a bird of prey and a falcon", "birds"]
          action: ["seizes a lamb from the sheep-house and a sparrow from the reed fence", "eat bread from the dreamer's head"]
          quoted: ["{d}nin-ninna2{mušen}-ta-e ŋa2 udu-ka sila4 šu ba-ni-ib-ti", "taʾkulu ṭ-ṭayru minhu"]
          outcome: ["read as the evil man who strikes Dumuzid and his death", "read as the dreamer's crucifixion (fa-yuṣlabu fa-taʾkulu ṭ-ṭayru min raʾsihi)"]
        note: "In both a bird taking food or prey in a dream is decoded as death: the bird and falcon of Dumuzid's dream are repeated by Ĝeštinana and set beside 'the evil man strikes your cheek'; Joseph reads the birds eating bread from the prisoner's head as his crucifixion."
