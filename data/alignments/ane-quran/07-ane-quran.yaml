          place: ["the nether world (kur)", "the blazing fire"]
          object: ["water and flour", "water and food"]
          quoted: ["id2-kur-ra-ke4 a nu-de2 ... a-šag4 kur-ra-ke4 še nu-de2 zid2 nu-mu-un-na-ab-gu7", "tusqā min ʿaynin āniya / laysa lahum ṭaʿāmun illā min ḍarīʿ"]
          outcome: ["none to drink or eat", "a boiling spring and thorn-food that does not nourish"]
        note: "The nether world's river yields no water, its field no grain to eat, its sheep no wool, for everyone who goes down, a god included. In 88:5-7 the damned drink from a boiling spring, and their only food is ḍarīʿ, 'which neither fattens nor avails against hunger'. In the nether world drink and food are lacking; in the fire they are given, and they torment."
      - with: quran-47-muhammad-battle-and-rivers
