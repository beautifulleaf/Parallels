        motif: children-are-the-gift-of-god
        refs: ["ETCSL 6.1.14 B.14.39"]
        with_refs: ["42:49", "42:50"]
        relation: parallel
        record:
          object: ["children", "daughters and sons"]
          agent: ["the gods", "God"]
          quoted: ["dam tuku-tuku lu2-ulu3-kam / dumu tuku-tuku diĝir-ra-kam", "yahabu li-man yashāʾu ināthan wa yahabu li-man yashāʾu dh-dhukūr ... wa yajʿalu man yashāʾu ʿaqīmā"]
        note: "'Having wives is human; having children is from the gods'; God 'grants daughters to whom he wills and sons to whom he wills ... and makes barren whom he wills'. The Sumerian sets marriage against children; the Quran speaks only of the gift and its withholding."
      - with: quran-64-taghabun-day-of-loss-and-household-enemies
        motif: wife-and-child-as-affliction
        refs: ["ETCSL 6.1.14 B.14.40", "ETCSL 6.1.14 B.14.44"]
        with_refs: ["64:14"]
        relation: echo
        record:
          object: ["a malicious wife and a malicious son", "some of your wives and children"]
          quoted: ["dam nu-ĝar-ra e2-a til3-la a2-sag3-a2-sag3-a dirig-ga", "inna min azwājikum wa awlādikum ʿaduwwan lakum fa-ḥdharūhum"]
          outcome: ["the worst of all afflictions", "beware of them, but pardon"]
        note: "'A malicious wife living in the house is the worst of all afflictions', with 'when I married a malicious husband, when I bore a malicious son'; 'among your wives and your children is an enemy to you, so beware of them; and if you pardon ... God is forgiving'. The Quran adds the call to pardon."
