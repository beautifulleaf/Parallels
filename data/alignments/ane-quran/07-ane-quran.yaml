        motif: family-bonds-dissolve-in-catastrophe
        refs: ["ETCSL 2.2.2 232-234"]
        with_refs: ["22:2"]
        relation: parallel
        record:
          agent: ["the mother", "every nursing mother"]
          object: ["her child", "the child she nursed"]
          action: ["abandons her child", "forgets the child she nursed"]
          quoted: ["ama dumu-ni igi-ni ba-ra-e3", "tadhhalu kullu murḍiʿatin ʿammā arḍaʿat"]
          time: ["the sack of Urim", "the quake of the Hour"]
        note: "In the sack, 'the mother left her child before her eyes, the father turned from his son, wife and child were abandoned'. In the quake of the Hour 'every nursing mother will forget what she nursed, and every pregnant one drop her burden'. The same sign of utter catastrophe, a historical sack against the last day."
