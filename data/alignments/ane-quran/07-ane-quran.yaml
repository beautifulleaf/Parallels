# ANE x Quran side-by-side pass, chunk 7 (ETCSL catalogues, Dumuzid's dream, Martu, Ninĝišzida, the Lament for Urim, Ur III royal hymns, the Sumerian proverb collections). Judged blind, from the originals.
new_motifs:
  dreamer-seeks-dream-interpreter: {label: "A dreamer who cannot read a dream calls for those who know dreams to interpret it", cluster: dreams}
  telling-the-dream-forbidden: {label: "The dreamer is told not to tell his dream", cluster: dreams}
  bird-in-dream-foretells-death: {label: "A bird seizing or eating something in a dream is read as the dreamer's death", cluster: dreams}
  envoys-who-do-not-eat: {label: "Supernatural envoys who come to seize or destroy do not eat the food offered them", cluster: angels}
  reward-and-daughter-for-the-strong-stranger: {label: "A strong stranger is offered a reward by the girl's father and marries the daughter", cluster: marriage}
  nomad-ignorant-of-divine-rites: {label: "The desert nomad does not know the gods' place or God's limits, and does not pray", cluster: society}
  food-and-drink-in-the-realm-of-the-dead: {label: "What the dead are given to eat and drink in the other world", cluster: afterlife}
  river-of-the-other-world: {label: "The river or rivers of the other world, and whether they give water", cluster: afterlife}
  plea-to-spare-a-doomed-city: {label: "An intercessor pleads with the divine to spare a city whose destruction is decreed; the decree is not turned back", cluster: judgment}
  storm-destroys-at-the-god-s-command: {label: "The destroying storm-wind wrecks the land by its god's command", cluster: judgment}
  people-blown-away-by-the-storm: {label: "The destroying wind carries the people away", cluster: judgment}
  goods-of-the-dispossessed-pass-to-others: {label: "The wealth of a ruined or expelled people passes to others who did not have it", cluster: judgment}
  kin-in-the-day-of-catastrophe: {label: "The day of catastrophe is described by the list of kin it overrides: mother, father, wife, child, brother", cluster: judgment}
  god-given-strength-and-wisdom-of-the-king: {label: "The divine gives the chosen king bodily strength and great wisdom", cluster: kingship}
  holy-chest-of-the-god: {label: "A holy chest belonging to the god, kept or brought as a sacred object", cluster: cult}
  testimony-and-knowledge: {label: "A witness may testify only to what he knows", cluster: law}
  speech-likened-to-a-donkey: {label: "Unruly or loud speech is likened to a donkey", cluster: wisdom}
  god-holds-up-the-sky: {label: "He holds up the sky (so that it does not fall on the earth)", cluster: creation}
  sky-and-earth-in-the-god-s-hands: {label: "The sky and the earth are held in the god's hands", cluster: creation}
  speech-likened-to-a-fruit-bearing-tree: {label: "A spoken word or testimony is like a tree that yields its fruit", cluster: wisdom}
  unequal-division-of-sheep: {label: "Sheep are divided so that one party takes nine (ninety-nine) and the other one", cluster: animals}
  parable-of-the-incorrigible-dog: {label: "A dog that is driven off and behaves the same again, as a parable of the incorrigible", cluster: animals}
  calling-on-god-in-peril-at-sea: {label: "In peril on a boat, the one who calls on god is brought safely to land", cluster: sea}
  born-without-father-or-mother: {label: "A being conceived without father or mother", cluster: creation}
  white-hair-of-old-age-image: {label: "An old man's whitened hair described in an image (white gypsum on a black mountain; the head kindled with grey)", cluster: body}
  favour-repaid-with-favour: {label: "Favour is repaid with favour (goodness with goodness)", cluster: wisdom}
  children-are-the-gift-of-god: {label: "Children come from the divine, as a gift", cluster: family}
  wife-and-child-as-affliction: {label: "One's wife or child can be one's worst affliction or enemy", cluster: family}
  no-one-reaches-the-heights: {label: "No one is tall enough to reach the heights (heaven, the mountains) or to span the earth", cluster: wisdom}
  heights-and-hollows-levelled: {label: "The heights and the hollows will be levelled", cluster: eschatology}
  adulterer-excluded-from-the-righteous: {label: "The adulterer is excluded from the company of the just", cluster: law}
  answering-evil-with-evil: {label: "Whether to answer an evil word or deed with its like", cluster: wisdom}
  the-mocker-mocked-in-turn: {label: "Those who mocked others are mocked in turn", cluster: wisdom}
  before-you-existed: {label: "Formula: 'from when you did not exist' / 'when you were nothing'", cluster: creation}
  god-not-idle-toward-the-wicked: {label: "The god is not idle (heedless) toward what the wicked do", cluster: justice}
  no-one-sinless-from-the-womb: {label: "No one is sinless (pure) from the mother's womb", cluster: sin}
  hunger-as-divine-punishment: {label: "The god punishes with hunger", cluster: judgment}
