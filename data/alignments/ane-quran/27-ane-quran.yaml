- unit: ane-cth-264-i-quarrel-and-fire
  checked:
  - quran-22-abraham-house-pilgrimage
  - quran-11-pharaoh-leads
  - quran-43-zukhruf-abraham-and-silver-roofs
  - quran-5-oaths-wine-game
  - quran-2-war-pilgrimage
  - quran-6-final-reckoning
  matches:
  - with: quran-5-oaths-wine-game
    motif: drink-causes-quarrel-at-worship
    refs:
    - CTH 264 W15:Rs._III_35-Rs._III_43
    with_refs:
    - 5:90
    - 5:91
    relation: parallel
    record:
      action:
      - gets drunk and makes a quarrel
      - wine and gambling sow enmity
      place:
      - in the temple
      - null
      quoted:
      - kuiški nikzi naš-kan mān ŠÀ É DINGIR-LIM nininktari nu ḫalluwain iyazi naš-ta EZEN4 zaḫzi
      - yūqiʿa baynakumu l-ʿadāwata wa-l-baghḍāʾa fi l-khamri wa-l-maysiri wa-yaṣuddakum ʿan dhikri llāhi wa-ʿani ṣ-ṣalāh
      outcome:
      - he disrupts the festival and must redo it with cattle, sheep, bread and beer
      - 'it turns you from remembrance of God and from prayer: will you desist?'
    note: 'Drink leading to a quarrel that breaks off worship: CTH 264 one who gets drunk (nink-) in the temple and starts a quarrel ''disturbs the festival'' (EZEN4 zaḫzi) and must provide it again; Q 5:91 Satan would cast enmity among you ''through wine'' and hinder you ''from the remembrance of God and from prayer''. The Hittite fines the offender; the Quran bans the wine.'
  - with: quran-2-war-pilgrimage
    motif: quarrel-forbidden-at-festival
    refs:
    - CTH 264 W15:Rs._III_35-Rs._III_43
    with_refs:
    - 2:197
    relation: echo
    record:
      action:
      - quarrels during the festival
      - quarrelling
      time:
      - the god's festival
      - the months of the pilgrimage
      quoted:
      - ḫalluwain iyazi ... ḫalluwaya-za mekki naḫḫanteš ēštēn
      - fa-lā rafatha wa-lā fusūqa wa-lā jidāla fi l-ḥajj
    note: 'No quarrel at the feast: CTH 264 a quarrel (ḫalluwai-) in the temple spoils the festival, ''be very fearful of quarrels''; Q 2:197 ''no intercourse, no wickedness, no quarrelling (jidāl) in the pilgrimage''.'
  - with: quran-6-final-reckoning
    motif: punishment-of-offenders-kin
    refs:
    - CTH 264 W15:Rs._III_51-Rs._III_53
    with_refs:
    - 6:164
    relation: contrast
    record:
      agent:
      - the offender
      - every soul
      recipient:
      - he and his seed
      - itself only
      quoted:
      - waštul kuiš iyazi naš QADU NUMUN-ŠU ḫarakzi-pat
      - wa-lā taziru wāziratun wizra ukhrā
      outcome:
      - his whole family perishes with him
      - no bearer bears another's burden
    note: 'Opposite rulings on the offender''s kin: CTH 264 ''who commits the offence perishes together with his seed (QADU NUMUN-ŠU)'', not one spared; Q 6:164 ''no burdened soul bears another''s burden''.'
- unit: ane-cth-264-j-kitchen-purity
  checked:
  - quran-4-prayer-intoxication-purity
  - quran-6-pagan-offerings-cattle
  - quran-16-abrogation-food-abraham-sabbath
  - quran-41-steadfast-and-repel-evil
  - quran-69-haqqa-books-in-right-and-left-hands
  matches:
  - with: quran-4-prayer-intoxication-purity
    motif: washing-after-intercourse-before-worship
    refs:
    - CTH 264 W15:Rs._III_68-Rs._III_73
    with_refs:
    - '4:43'
    relation: parallel
    record:
      agent:
      - one who has slept with a woman
      - one in a state of janāba, or who has touched women
      action:
      - bathes before coming to the gods' meal
      - washes before approaching prayer
      time:
      - before the sun rises
      - null
      quoted:
      - MUNUS-i kuiš GAM-an šešzi ... kuitman dUTU-uš šarā ... ḫūdāk warapdu
      - wa-lā junuban ... ḥattā taghtasilū ... aw lāmastumu n-nisāʾa fa-lam tajidū māʾan fa-tayammamū
      outcome:
      - one who comes unbathed incurs death
      - without water, wipe with clean earth
    note: 'Washing after intercourse before approaching the deity. CTH 264: who has lain with a woman must bathe quickly before sunrise and come to the gods'' meal; one who comes unbathed incurs death. Q 4:43: do not approach prayer junub ''until you have washed'', and if you have touched women and find no water, use clean earth. The rule is the same; the sanction for lacking a bath changes from death to a substitute rite.'
  - with: quran-16-abrogation-food-abraham-sabbath
    motif: pig-as-impure
    refs:
    - CTH 264 W15:Rs._III_59-Rs._III_67
    with_refs:
    - 16:115
    relation: divergence
    record:
      object:
      - pig and dog
      - the flesh of swine
      action:
      - must not cross the kitchen threshold or touch the vessels
      - forbidden as food
      quoted:
      - ŠAḪ-aš UR.GI7-aš GIŠkattaluzzi lē šarreškitta
      - innamā ḥarrama ʿalaykumu l-maytata wa-d-dama wa-laḥma l-khinzīr
    note: 'The pig as impure: CTH 264 ''pig and dog must not cross the threshold'' of the gods'' kitchen, and food they touch is impure; Q 16:115 God has forbidden ''the flesh of swine''. In the Hittite the pig pollutes the god''s food by contact; in the Quran its flesh is forbidden to the believer.'
  - with: quran-69-haqqa-books-in-right-and-left-hands
    motif: foul-food-as-retribution-for-food-offence
    refs:
    - CTH 264 W15:Rs._III_64-Rs._III_68
    with_refs:
    - '69:34'
    - '69:35'
    - '69:36'
    relation: divergence
    record:
      agent:
      - the gods
      - null
      action:
      - give him dung and urine to eat and drink
      - he has no food but ghislīn
      recipient:
      - the cook who served polluted food to the gods
      - one who did not urge feeding the poor
      quoted:
      - apēdani-ma DINGIR.MEŠ-eš zakkar dūr adanna akuwanna pianzi
      - wa-lā yaḥuḍḍu ʿalā ṭaʿāmi l-miskīn ... wa-lā ṭaʿāmun illā min ghislīn
    note: 'An offence over food repaid in food: CTH 264 the cook who gives the gods polluted food is given by the gods ''dung and urine to eat and drink'' (zakkar dūr); Q 69:34-36 he who ''did not urge the feeding of the poor'' has ''no food except ghislīn''. The food offence changes from serving the gods impure food to neglecting the poor.'
