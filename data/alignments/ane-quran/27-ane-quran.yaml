# ANE x Quran side-by-side pass, chunk 27 (Hittite: CTH 264 instructions for temple personnel, Illuyanka CTH 321, the vanished-god myths CTH 322-334). Judged blind, from the originals.
new_motifs:
  god-portion-of-offering-diverted:
    label: The portion of crops or livestock set aside for the deity is split off and diverted to others
    cluster: ritual
  clergy-consume-sacred-goods:
    label: Religious personnel eat up goods that are not theirs (the god's offerings, people's wealth)
    cluster: ritual
  punishment-deferred-misread-as-inaction:
    label: Wrongdoers take the deity's delay to mean he does nothing; he defers, then seizes
    cluster: judgment
  divine-seizing-severe-once-it-falls:
    label: The deity's seizing (of the guilty) is slow to come but severe and final once it falls
    cluster: judgment
  transfer-recorded-with-witnesses:
    label: A transfer of goods (gift, sale, debt) is to be written down and witnessed
    cluster: law
  misappropriation-of-entrusted-goods:
    label: Embezzlement of goods held in trust (the god's goods, war spoils)
    cluster: law
  sacred-time-shifted-forbidden:
    label: Moving a sacred festival or month out of its fixed time is forbidden
    cluster: ritual
  excuse-to-leave-city-defence:
    label: An excuse of guarding one's own place to avoid the city's defence when an enemy threatens
    cluster: law
  drink-causes-quarrel-at-worship:
    label: Drunkenness produces quarrels that disrupt worship
    cluster: ritual
  quarrel-forbidden-at-festival:
    label: Quarrelling is forbidden during the sacred festival
    cluster: ritual
  punishment-of-offenders-kin:
    label: Whether an offender's family is punished with him
    cluster: law
  washing-after-intercourse-before-worship:
    label: One who has had intercourse must wash before approaching the deity's service or prayer
    cluster: ritual
  pig-as-impure:
    label: The pig as impure in matters of food
    cluster: ritual
  foul-food-as-retribution-for-food-offence:
    label: An offence concerning food is repaid with foul food and drink
    cluster: judgment
  due-of-harvest-given-at-once:
    label: The due from crops and young animals is given at once, at harvest time
    cluster: ritual
  self-curse-on-liars-with-wives-and-children:
    label: Parties to a dispute call down divine punishment on the liar, with their wives and children
    cluster: law
  inferior-substituted-for-the-due:
    label: An inferior thing is given in place of the good one owed to God or the god
    cluster: ritual
  prohibition-on-looking:
    label: A protected person is forbidden to look out or turn round, and one does
    cluster: narrative
  son-sides-with-enemy-and-perishes:
    label: A son sides with his father's enemies and perishes with them
    cluster: narrative
  sacred-office-assigned-by-lot:
    label: A sacred charge is assigned by casting lots
    cluster: ritual
  offering-graded-by-means:
    label: 'What one gives is graded by one''s means: the rich much, the poor little'
    cluster: ritual
  mothers-abandon-their-young:
    label: In catastrophe mothers abandon their young and pregnancy fails
    cluster: judgment
  smoke-envelops-as-calamity:
    label: Smoke envelops house or people as a calamity
    cluster: judgment
  eating-that-does-not-still-hunger:
    label: Food that is eaten but does not still hunger
    cluster: afterlife
  seven-gates-of-the-underworld:
    label: The underworld or hell has seven doors or gates
    cluster: afterlife
  no-coming-out-of-the-underworld:
    label: What goes into the place below cannot come out again
    cluster: afterlife
  sealed-over-in-the-underworld:
    label: The evil is shut in below under a closed cover
    cluster: afterlife
  bee-sent-through-mountains:
    label: The bee, sent or inspired by the deity, goes through the mountains
    cluster: animals
  deity-and-sleep:
    label: Whether the deity sleeps
    cluster: deity
  keepers-open-the-gates-below:
    label: A gatekeeper opens the gates of the place below
    cluster: afterlife
  fig-and-olive-paired:
    label: The fig and the olive named together
    cluster: ritual
  good-word-bad-word:
    label: Good words and bad words set against each other, with plant imagery
    cluster: wisdom
reviewed:
- unit: ane-cth-264-c-festivals-and-offerings
  checked:
  - quran-9-uzayr-clergy
  - quran-6-pagan-offerings-cattle
  - quran-22-abraham-house-pilgrimage
  - quran-9-mosques-and-kin
  matches:
  - with: quran-6-pagan-offerings-cattle
    motif: god-portion-of-offering-diverted
    refs:
    - CTH 264 W15:Vs._I_46'-Vs._I_59'
    with_refs:
    - 6:136
    relation: divergence
    record:
      agent:
      - temple staff
      - the idolaters
      action:
      - split the god's offering and keep part
      - split a portion between God and the partners
      object:
      - the god's cattle, sheep, bread, beer and wine
      - a portion of crops and cattle
      recipient:
      - their wives, children, servants, kin or a stranger
      - the partners
      quoted:
      - takšan šarraš takšan šarran pešteni ... kuiš-at-kan šarrai-ma naš aku
      - hādhā li-llāhi bi-zaʿmihim wa-hādhā li-shurakāʾinā ... fa-huwa yaṣilu ilā shurakāʾihim
      outcome:
      - the one who divides it dies, no turning back
      - sāʾa mā yaḥkumūn
    note: 'The god''s share is halved and partly diverted. CTH 264: staff who ''divide it in half'' (takšan šarra-) and give it to wives, children, a kinsman or a stranger shall die. Q 6:136: the idolaters set apart a portion of tilth and cattle, ''this is for God, by their claim, and this for our partners'', and what is God''s reaches the partners. Who takes the diverted half changes: the priest''s household against the false gods.'
  - with: quran-9-uzayr-clergy
    motif: clergy-consume-sacred-goods
    refs:
    - CTH 264 W15:Vs._I_46'-Vs._I_55'
    with_refs:
    - '9:34'
    relation: divergence
    record:
      agent:
      - the temple staff
      - many of the rabbis and monks
      action:
      - eat up
      - eat up
      object:
      - the gods' offerings
      - people's wealth
      quoted:
      - ar-ḫa e-ez-za-a-i (they eat it up)
      - la-yaʾkulūna amwāla n-nāsi bi-l-bāṭil
    note: 'Religious personnel ''eat up'' what is not theirs: CTH 264 the temple men take the gods'' offerings home where wives, children and servants eat them up (arḫa ezzai); Q 9:34 rabbis and monks ''eat up people''s wealth in vanity'' (yaʾkulūna amwāla n-nās). The goods eaten change from the god''s offerings to the people''s property.'
- unit: ane-cth-264-d-silent-god-strong-will
  checked:
  - quran-11-pharaoh-leads
  - quran-85-constellations
  - quran-35-heirs-of-book
  - quran-3-misers-mockers
  - quran-14-day-of-reckoning
  matches:
  - with: quran-14-day-of-reckoning
    motif: punishment-deferred-misread-as-inaction
    refs:
    - CTH 264 W15:Vs._II_18'-Vs._II_24'
    with_refs:
    - '14:42'
    relation: parallel
    record:
      agent:
      - wrongdoers
      - the wrongdoers
      action:
      - think the god does nothing to them
      - think God unaware of what they do
      quoted:
      - DINGIR-LIM-waraš kuit nu-wa UL kuitki memai nu-wa-nnaš UL kuitki iyazi ... eppuwanzi UL nuntarnuzi
      - wa-lā taḥsabanna llāha ghāfilan ʿammā yaʿmalu ẓ-ẓālimūna innamā yuʾakhkhiruhum
      outcome:
      - the god does not hasten to seize, but seizes at his time
      - he only defers them to a day when eyes stare
    note: 'The same reasoning refuted: CTH 264 the offenders say ''because he is a god he says nothing and does nothing to us'', but the gods'' will ''does not hasten to seize'' (eppuwanzi UL nuntarnuzi); Q 14:42 ''do not think God unaware of what the wrongdoers do, he only defers them (yuʾakhkhiruhum)''.'
  - with: quran-11-pharaoh-leads
    motif: divine-seizing-severe-once-it-falls
    refs:
    - CTH 264 W15:Vs._II_22'-Vs._II_24'
    with_refs:
    - 11:102
    relation: echo
    record:
      agent:
      - the gods' will
      - your Lord
      action:
      - seizes and does not let go
      - seizes the towns
      quoted:
      - eppzi-ma kuedani mēḫuni nu namma arḫa UL tarnai
      - wa-kadhālika akhdhu rabbika idhā akhadha l-qurā ... inna akhdhahū alīmun shadīd
    note: 'The divine ''seizing'': CTH 264 ''when it seizes (ep-), it does not let go again''; Q 11:102 ''such is the seizing (akhdh) of your Lord when he seizes the towns ... his seizing is painful, severe''. Same verb image, applied to the town rather than the individual.'
- unit: ane-cth-264-e-temple-valuables
  checked:
  - quran-3-badr-uhud
  - quran-9-bargain-abraham
  - quran-26-abraham
  - quran-3-misers-mockers
  - quran-2-debt-contract
  matches:
  - with: quran-2-debt-contract
    motif: transfer-recorded-with-witnesses
    refs:
    - CTH 264 W15:Vs._II_32'-Vs._II_44'
    with_refs:
    - 2:282
    relation: parallel
    record:
      action:
      - records the gift or sale
      - write the debt down
      instrument:
      - a wooden tablet (GIŠ.ḪUR)
      - a scribe writing
      quoted:
      - lamniyan ēšdu ... kutruš-ša EGIR-an iyanteš ašandu ... GIŠ.ḪUR iyandu
      - fa-ktubūhu ... wa-stashhidū shahīdayni ... wa-ashhidū idhā tabāyaʿtum
      number:
      - null
      - 2 witnesses
      outcome:
      - sale only in public before the lords of Hatti
      - fairer for testimony and less cause to doubt
    note: 'A transfer must be written and witnessed. CTH 264: a palace gift is ''named'' with its weight and festival, ''and witnesses (kutruš) shall be present''; it may be sold only openly before the lords of Hatti, who ''make a wooden tablet'' of the price. Q 2:282: write the debt (fa-ktubūhu), call two witnesses, ''and take witnesses when you sell (tabāyaʿtum)''.'
  - with: quran-3-badr-uhud
    motif: misappropriation-of-entrusted-goods
    refs:
    - CTH 264 W15:Vs._II_45'-Vs._II_51'
    with_refs:
    - 3:161
    relation: divergence
    record:
      action:
      - sells the god's goods for himself
      - embezzles (ghulūl)
      object:
      - silver, gold, garments, bronze vessels of the god
      - what he embezzled
      quoted:
      - ZI-azza-ma ḫappirāezzi nat-ši SAG.DU-aš ÚŠ-tar ... 2-aš-pat ... akkandu
      - wa-man yaghlul yaʾti bi-mā ghalla yawma l-qiyāma
      outcome:
      - he and the one who hid him are both put to death
      - he brings what he embezzled on the day of resurrection
    note: 'Misappropriating goods held in trust. CTH 264: who sells the god''s goods for himself, and who catches him but hides him, ''both shall die''. Q 3:161: ''whoever embezzles will bring what he embezzled on the day of resurrection''. The penalty moves from immediate execution to the last day, and the object from temple valuables to spoils.'
- unit: ane-cth-264-f-festivals-on-time
  checked:
  - quran-9-months-nasi
  - quran-2-war-pilgrimage
  - quran-24-light-verse
  - quran-62-jumua-unlettered-donkey-and-friday
  matches:
  - with: quran-9-months-nasi
    motif: sacred-time-shifted-forbidden
    refs:
    - CTH 264 W15:Vs._II_52'-Vs._II_63'
    with_refs:
    - '9:36'
    - '9:37'
    relation: parallel
    record:
      agent:
      - temple staff at the festival-giver's request
      - the unbelievers
      action:
      - shift the festival out of its season
      - postpone the sacred month
      object:
      - spring and autumn festivals
      - the sacred months
      quoted:
      - EZEN4 ḫamešḫandaš INA zēni iyatteni EZEN4 zenandaš-ma ḫamešḫi eššatteni
      - innamā n-nasīʾu ziyādatun fi l-kufri yuḥillūnahū ʿāman wa-yuḥarrimūnahū ʿāman
      outcome:
      - 'forbidden: do the gods'' will, not man''s'
      - 'forbidden: an increase in unbelief'
    note: 'Both forbid moving sacred time. CTH 264: you hold the spring festival in autumn and the autumn festival in spring because the giver pleads harvest, marriage or a journey; do not act by a man''s wish. Q 9:37: the nasīʾ, ''they make it lawful one year and forbidden another'', is ''an increase in unbelief''. Both have a fixed sacred calendar shifted for human convenience.'
