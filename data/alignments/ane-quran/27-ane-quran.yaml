      - a party of them
      action:
      - excuses himself from the city watch
      - ask leave to quit the defence
      quoted:
      - ammuk-wa-za É DINGIR-LIM-ya paḫḫašḫi apiya-ma-wa UL paimi
      - inna buyūtanā ʿawratun wa-mā hiya bi-ʿawratin in yurīdūna illā firāran
