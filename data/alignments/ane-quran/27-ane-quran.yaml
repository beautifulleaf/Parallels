- unit: ane-cth-332-3-2-fig-olive-analogies
  checked:
  - quran-95-fig
  - quran-24-light-verse
  - quran-2-fasting
  - quran-14-parables-and-satans-speech
  matches:
  - with: quran-95-fig
    motif: fig-and-olive-paired
    refs:
    - CTH 332.3 §7:30-33
    - CTH 332.3 §9:40-41
    with_refs:
    - '95:1'
    relation: echo
    record:
      object:
      - fig; olive
      - fig; olive
      action:
      - 'set out as analogies: the fig holds a thousand seeds, the olive holds its oil'
      - sworn by
      quoted:
      - GIŠPÈŠ ... LI-IM NUMUN-an ḫarzi ... GIŠSE20-ERDUM ... Ì-ŠU ŠÀ-it ḫarzi
      - wa-t-tīni wa-z-zaytūn
    note: 'Fig and olive together: in the Storm god mugawar the fig ''holds a thousand seeds inside'' and the olive ''holds its oil inside'', so may the god hold good within; Q 95:1 ''by the fig and the olive''. Analogies to soothe a god against an oath.'
  - with: quran-14-parables-and-satans-speech
    motif: good-word-bad-word
    refs:
    - CTH 332.3 §7:32-33
    - CTH 332.3 §8:37-38
    with_refs:
    - '14:24'
    - '14:25'
    - '14:26'
    relation: echo
    record:
      action:
      - throw away the bad words, take the good words
      - a good word likened to a good tree, a bad word to a bad tree
      instrument:
      - the fig that holds a thousand seeds
      - a tree with firm roots that gives fruit at every season
      quoted:
      - idālu uddār arḫa peššiya nu-za aššu uddār dā
      - kalimatan ṭayyibatan ka-shajaratin ṭayyibatin ... kalimatin khabīthatin ka-shajaratin khabīthatin
    note: 'Good and bad words with plant imagery: ''as the fig holds a thousand seeds inside, so hold the good inside through the words ... throw away the bad words, Storm god, and take the good words''; Q 14:24-26 a good word is like a good tree whose fruit comes at every season, a bad word like a bad tree uprooted. The Hittite asks a god to choose words; the Quran compares words to trees.'
