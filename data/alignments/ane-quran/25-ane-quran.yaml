- unit: ane-sinuhe-w1-duel-with-champion
  checked: [quran-26-noah, quran-12-joseph-full, quran-10-noah, quran-2-talut-jalut]
  matches:
  - with: quran-2-talut-jalut
    motif: dreaded-champion-killed-by-one-man
    refs: ["Sinuhe W1:110", "Sinuhe W1:132", "Sinuhe W1:137", "Sinuhe W1:139"]
    with_refs: ["2:249", "2:251"]
    relation: parallel
    record:
      agent: [Sinuhe, Dāwūd]
      action: ["kills the champion", "kills the champion"]
      object: ["the unequalled strongman of Retenu", Jālūt]
      quoted: ["pr,y pw nn sn,nw =f ... jn-jw wn ky nḫt ꜥḥꜣ r =f ... sti̯.n =j sw ꜥḥꜣ,w =j mn m nḥb,t =f", "lā ṭāqata lanā l-yawma bi-Jālūta wa-junūdihi ... wa-qatala Dāwūdu Jālūt"]
      outcome: ["the victor takes the foe's herds and grows great", "God gives the victor kingship and wisdom"]
    note: "The strongman of Retenu is 'a champion without a second' (pr,y pw nn sn,nw =f, W1:110); the onlookers grieve, 'is there another warrior who can fight him?' (W1:132); Sinuhe's arrow sticks in his neck, he falls on his nose, and Sinuhe kills him with his own axe (W1:137-139). Q 2:249: 'we have no strength today against Jālūt and his troops'; 2:251: 'and Dāwūd killed Jālūt'. The champion everyone fears, killed by one unlikely man; the Quran gives no weapons and turns the reward into kingship (al-mulk) from God, where Sinuhe takes the loser's goods."
- unit: ane-sinuhe-w1-reflection-and-prayer
  checked: [quran-12-joseph-full, quran-19-zechariah-and-john, quran-43-zukhruf-abraham-and-silver-roofs, quran-93-94-forenoon-and-expansion]
  matches:
  - with: quran-19-zechariah-and-john
    motif: old-mans-lament-lost-vigour
    refs: ["Sinuhe W1:156/2", "Sinuhe W1:167", "Sinuhe W1:168", "Sinuhe W1:169", "Sinuhe W1:169/2", "Sinuhe W1:170", "Sinuhe W1:170/3"]
    with_refs: ["19:3", "19:4", "19:5", "19:6"]
    relation: parallel
    record:
      agent: [Sinuhe, Zakariyyā]
      action: ["prays, listing the failures of his aged body", "prays, listing the failures of his aged body"]
      recipient: ["the god who ordained the flight, and the king", "his Lord"]
      quoted: ["jꜣw hꜣi̯.w wgg ꜣs.n =f wj jr,t.du =j dns ꜥ,wj =j nw", "wahana l-ʿaẓmu minnī wa-shtaʿala r-raʾsu shayban"]
      outcome: ["asks to return and be buried in the land of his birth", "asks for an heir (waliyyan yarithunī)"]
    note: "Sinuhe's prayer: 'old age has come down, weakness has overtaken me; my eyes are heavy, my arms weak, my legs have stopped following, the heart is weary; I am near to departing' (W1:167-170/3), framed by 'O god who ordained this flight, be gracious, bring me to the Residence' and 'what is more important than my burial in the land where I was born?' (W1:156/2-159). Zakariyyā's private call: 'my Lord, the bone has grown feeble in me and the head is aflame with grey' (19:4), then 'grant me an heir' (19:5-6). The aged suppliant's catalogue of his failing body as the ground of his request; the requests differ: a grave at home against a son."
