    motif: submitting-rulers-throne-and-gift-brought-to-the-king
    refs: ["CTH 1 W2:rev._74", "CTH 1 W2:rev._75", "CTH 1 W2:rev._76", "CTH 1 W2:rev._77", "CTH 1 W2:rev._78", "CTH 1 W2:rev._79"]
    with_refs: ["27:35", "27:36", "27:38", "27:42", "27:44"]
    relation: divergence
    record:
      agent: ["the man of Purušhanda", "the queen of Sabaʾ"]
      action: ["brings the king a throne and a sceptre of iron as a gift, and submits", "sends the king a gift; her throne is brought to him; she submits"]
      recipient: [Anitta, Sulaymān]
      object: ["a throne of iron, a sceptre of iron", "a gift (hadiyya); her throne (ʿarsh)"]
      quoted: ["1 GIŠ ŠÚ.A AN.BAR 1 PA.GAM AN.BAR", "wa-innī mursilatun ilayhim bi-hadiyyatin ... a-tumiddūnani bi-mālin ... ayyukum yaʾtīnī bi-ʿarshihā"]
      outcome: ["the gift is accepted; the ruler is brought to Neša and seated at the king's right", "the gift is refused; the throne is fetched by one with knowledge of the Book, and she submits with Sulaymān to God"]
    note: "When Anitta comes against him, 'the man of Purušhanda brought me one throne of iron and one sceptre of iron' (W2:rev._74-75), and is brought to Neša and seated before the king in the inner chamber (rev._76-79). The queen of Sabaʾ sends Sulaymān a gift (27:35), which he scorns ('would you help me with wealth?', 27:36); her throne is brought to him instead (27:38-42), and she comes and submits (27:44). A ruler's throne and gift reach a greater king in token of submission; in Anitta the throne is the gift and is accepted, in the Quran the gift is refused and the throne is taken by a sign."
