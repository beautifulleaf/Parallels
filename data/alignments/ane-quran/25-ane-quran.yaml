    with_refs: ["12:26"]
    relation: parallel
    record:
      agent: [Bata, Yūsuf]
      action: ["answers the charge: it was she who solicited him", "answers the charge: it was she who solicited him"]
      recipient: [Anubis, "her husband"]
      quoted: ["tꜣy =k ḥm,t ḥr ḏd n =j mꜥ~j jry =n wnw,t sḏr =n ... pnꜥ =st sw n =k m ktḫ", "hiya rāwadatnī ʿan nafsī"]
    note: "Bata across the water at sunrise: 'your wife said to me: come, let us spend an hour lying together; see, she has turned it round (pnꜥ) for you into something else' (7_5/3-7_6/2). Yūsuf at the door: 'it was she who solicited me' (hiya rāwadatnī ʿan nafsī, 12:26). The youth's one-line counter-charge, turning the accusation back on the wife."
  - with: quran-12-joseph-full
    motif: prayer-of-the-falsely-accused-youth
    refs: ["TwoBrothers 6_4", "TwoBrothers 6_5", "TwoBrothers 6_5/2", "TwoBrothers 6_6"]
    with_refs: ["12:33", "12:34"]
    relation: divergence
    record:
      agent: [Bata, Yūsuf]
      recipient: [Re-Harakhti, "his Lord"]
      action: ["prays for rescue from the pursuer", "prays to be kept from the women's guile, prison being dearer"]
      quoted: ["pꜣy =j nb nfr mntk pꜣ n,tj ḥr wpw.t pꜣ ꜥḏꜣ,w r pꜣ mꜣꜥ,tj; ꜥḥꜥ.n Pꜣ-Rꜥ ḥr sḏm spr,w =f nb", "rabbi s-sijnu aḥabbu ilayya ... fa-stajāba lahu rabbuhu fa-ṣarafa ʿanhu kaydahunna"]
      outcome: ["a crocodile-filled water is put between the brothers", "God turns the women's guile away from him"]
    note: "Bata: 'my good lord, you are the one who separates the wrongdoer from the righteous', and 'Pre heard all his pleas' (6_5-6_5/2) and set a crocodile water between them. Yūsuf: 'my Lord, prison is dearer to me than what they call me to', and 'his Lord answered him (fa-stajāba) and turned their guile from him' (12:33-34). The same answered prayer of the slandered youth; in Egypt it saves him from the husband, in the Quran from the women."
- unit: ane-twobrothers-oath-mutilation-heart
  checked: [quran-12-joseph-full, quran-5-two-sons-of-adam, quran-26-noah]
  matches:
  - with: quran-12-joseph-full
    motif: husbands-judgment-on-the-lying-wife
    refs: ["TwoBrothers 8_7/2", "TwoBrothers 8_8"]
    with_refs: ["12:28", "12:29"]
    relation: divergence
    record:
      agent: [Anubis, "the husband (al-ʿazīz)"]
      action: ["kills his wife and throws her to the dogs", "tells his wife to ask forgiveness for her sin"]
      quoted: ["jw =f ḥr ẖdb tꜣy =f ḥm,t; jw =f ḥr ḫꜣꜥ =st n nꜣ jw.w", "innahu min kaydikunna ... wa-stghfirī li-dhanbiki innaki kunti mina l-khāṭiʾīn"]
      outcome: ["death", "rebuke only"]
    note: "Convinced of Bata's innocence, Anubis goes home, 'killed his wife and cast her to the dogs' (8_7/2-8_8). The husband in Q 12:28-29, convinced by the shirt, says 'this is of your guile (kaydikunna)... ask forgiveness for your sin, you were among the sinners', and she stays in the house (12:30-32, 12:51). The same husband's verdict on the false accuser, death against a rebuke."
- unit: ane-twobrothers-valley-of-cedar-and-new-wife
  checked: [quran-57-hadid-iron-and-monasticism, quran-16-daughters-and-the-bee, quran-12-joseph-full, quran-4-creation-kinship-orphans, quran-7-single-soul-idols]
  matches:
  - with: quran-7-single-soul-idols
    motif: origin-and-purpose-of-the-human-mate
    refs: ["TwoBrothers 9_6", "TwoBrothers 9_6/2", "TwoBrothers 9_7"]
    with_refs: ["7:189"]
    relation: divergence
    record:
      agent: ["Khnum, at Re-Harakhti's word", God]
      action: ["fashions a wife for the man, that he not dwell alone", "makes from the one soul its mate, that he may dwell with her"]
      recipient: [Bata, "the single soul"]
      quoted: ["jḫ qd =k wꜥ-n s,t-ḥm,t n Bꜣ~tʾ tm =f ḥmsi̯ wꜥi̯", "wa-jaʿala minhā zawjahā li-yaskuna ilayhā"]
      outcome: ["she betrays him", "the couple ascribe partners to God (7:190)"]
    note: "Re-Harakhti to Khnum: 'fashion a woman for Bata so that he does not dwell (ḥmsi̯) alone' (9_6/2); Khnum makes her more beautiful than any woman. Q 7:189: God 'made from it its mate that he might dwell (li-yaskuna) with her'. A god makes a wife for a lone man for the purpose of companionship. Here she is made from nothing named, for one hero; in the Quran from the first soul itself, for all humankind. Both couples then go wrong: the wife betrays Bata's heart, and the couple of 7:190 'ascribe partners'."
