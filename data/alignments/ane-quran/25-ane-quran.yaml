- unit: ane-twobrothers-seduction-attempt
  checked: [quran-12-joseph-full, quran-20-moses-favors-recalled, quran-4-marriage-forbidden-degrees, quran-7-lot]
  matches:
  - with: quran-12-joseph-full
    motif: masters-wife-seduces
    refs: ["TwoBrothers 3_5", "TwoBrothers 3_7", "TwoBrothers 3_7/3"]
    with_refs: ["12:23"]
    relation: parallel
    record:
      agent: ["the wife of the master of the house", "the wife of the master of the house"]
      action: ["solicits the young man of the house", "solicits the young man of the house"]
      recipient: [Bata, Yūsuf]
      place: ["the house, he alone with her", "her house, the doors locked"]
      quoted: ["mꜥ~j jry =n n =n wnw,t sḏr =n", "wa-rāwadathu llatī huwa fī baytihā ʿan nafsihi wa-ghallaqati l-abwāba wa-qālat hayta lak"]
    note: "The wife of Anubis, in whose household Bata lives as son and servant, seizes him (jw =st ḥr mḥ jm =f) and says 'come, let us spend an hour lying together' (3_7/3), promising him fine clothes. Q 12:23: 'she in whose house he was solicited him (rāwadathu) ... locked the doors and said: come (hayta lak)'. Same act by the same figure, the mistress of the house to the young man living in it."
  - with: quran-12-joseph-full
    motif: grounds-for-refusing-the-masters-wife
    refs: ["TwoBrothers 3_9/2", "TwoBrothers 3_10", "TwoBrothers 3_10/2", "TwoBrothers 3_10/3"]
    with_refs: ["12:23"]
    relation: divergence
    record:
      agent: [Bata, Yūsuf]
      action: ["refuses, citing the husband's kindness to him", "refuses, citing God and his master's kindness to him"]
      name: [null, Allāh]
      quoted: ["ḫr pꜣ ꜥꜣ r =j mntwf sḫpr wj; jḫ pꜣj btꜣ,w ꜥꜣ", "maʿādha llāhi innahu rabbī aḥsana mathwāya innahu lā yufliḥu ẓ-ẓālimūn"]
    note: "Bata: 'you are like a mother to me, your husband like a father; he who is older than I raised me (sḫpr wj). What is this great crime (btꜣ,w ꜥꜣ)?' (3_9/2-3_10/3). Yūsuf: 'God's refuge! He is my lord (rabbī), he made my lodging good (aḥsana mathwāya); wrongdoers do not prosper' (12:23). Both refusals rest on the husband's past kindness to the youth; the Quran adds the refuge in God, the Egyptian adds the mother-and-father kinship and names no god."
  - with: quran-12-joseph-full
    motif: silence-imposed-on-the-seduction
    refs: ["TwoBrothers 4_1", "TwoBrothers 4_1/2", "TwoBrothers 4_1/3"]
    with_refs: ["12:29"]
    relation: divergence
    record:
      agent: [Bata, "the husband (al-ʿazīz)"]
      action: ["promises to tell no one", "tells Yūsuf to let the matter pass"]
      time: ["at once, before any accusation", "after the shirt has shown her guilt"]
      quoted: ["m-jri̯ ḏd.ṱ =f n =j ꜥn ḫr nn jw =j r ḏd.ṱ =f n wꜥ", "Yūsufu aʿriḍ ʿan hādhā"]
    note: "Bata to the wife: 'do not say it to me again, and I will not tell it to anyone' (4_1-4_1/3). In Q 12:29 it is the husband, once the shirt has convicted her, who says 'Yūsuf, turn away from this' and tells her to ask forgiveness. The same hushing of the affair, moved from the youth (before the lie) to the master (after the proof)."
- unit: ane-twobrothers-false-accusation
  checked: [quran-12-joseph-full, quran-24-penalties-and-lian, quran-24-ifk-slander, quran-4-marriage-forbidden-degrees]
  matches:
  - with: quran-12-joseph-full
    motif: false-accusation-by-wife
    refs: ["TwoBrothers 4_7", "TwoBrothers 4_10/4", "TwoBrothers 5_1", "TwoBrothers 5_1/3", "TwoBrothers 5_3/4"]
    with_refs: ["12:25"]
    relation: parallel
    record:
      agent: ["the wife", "the wife"]
      action: ["accuses the youth to her husband of seeking to lie with her", "accuses the youth to her husband of intending evil to his wife"]
      recipient: [Anubis, "her master (sayyidahā)"]
      quoted: ["m pꜣy =k sn šrj ... mꜥ~j jry =n wnw,t sḏr =n", "mā jazāʾu man arāda bi-ahlika sūʾan"]
    note: "Anubis's wife puts her own proposal in Bata's mouth ('he said to me: come, let us spend an hour lying together', 5_1/3) and her own refusal in hers; Q 12:25 she turns at once to her husband: 'what is the recompense of one who intended evil to your household?'. The same reversal of the proposition by the wife before the husband."
  - with: quran-12-joseph-full
    motif: penalty-demanded-by-the-accusing-wife
    refs: ["TwoBrothers 5_3/3"]
    with_refs: ["12:25"]
    relation: divergence
    record:
      agent: ["the wife", "the wife"]
      action: ["demands the youth's death", "demands prison or a painful punishment"]
      quoted: ["ḫr jr ḏi̯ =k ꜥnḫ =f jw =j r mt n =j", "illā an yusjana aw ʿadhābun alīm"]
      outcome: ["the husband goes to kill him", "the husband examines the shirt"]
    note: "'If you let him live, I will kill myself' (5_3/3): Anubis sharpens his spear. In 12:25 the wife names the sentence herself, 'only that he be imprisoned or a painful punishment', and it is prison that he later gets (12:35). Same demand, death against prison."
  - with: quran-12-joseph-full
    motif: evidence-in-the-seduction-charge
    refs: ["TwoBrothers 4_6", "TwoBrothers 4_6/2", "TwoBrothers 4_8/2"]
    with_refs: ["12:25", "12:26", "12:27", "12:28"]
    relation: divergence
    record:
      agent: ["the wife", "a witness of her household"]
      object: ["fat and a bandage: a feigned beating", "the shirt torn from behind"]
      outcome: ["the husband believes her", "the shirt convicts her"]
      quoted: ["wn.jn =sst ḥr jni̯ [ꜥ]d,w pd~jrʾ; jw =st ḥr ḫpr mj n,tj qnqn.tj n ꜥḏꜣ,w", "in kāna qamīṣuhu qudda min qubulin fa-ṣadaqat ... wa-in kāna qamīṣuhu qudda min duburin fa-kadhabat"]
    note: "The wife fakes the evidence: she takes fat (ꜥḏ) and a bandage and makes herself 'like one wrongly beaten' (4_6-4_6/2), lying in the dark when Anubis comes home. In Q 12:25-28 the physical evidence is real and decides against her: the shirt torn from behind (qudda min duburin), read by a witness of her own household. One forged bodily sign that convinces; one true garment sign that acquits."
