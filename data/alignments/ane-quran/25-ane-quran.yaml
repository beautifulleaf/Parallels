  matches:
  - with: quran-28-moses-kills-and-flees
    motif: cause-of-the-flight-from-egypt
    refs: ["Sinuhe W2:24", "Sinuhe W2:25", "Sinuhe W2:26", "Sinuhe W2:26/2", "Sinuhe W2:31", "Sinuhe W2:64"]
    with_refs: ["28:15", "28:20", "28:21"]
    relation: divergence
    record:
      agent: [Sinuhe, Mūsā]
      action: ["flees Egypt in fear", "flees Egypt in fear"]
      instrument: ["overhears the secret message himself", "a man comes running from the far end of the city to warn him"]
      quoted: ["sḏm.n =j ḫrw =f jw =f mdwi̯ =f ... pzḫ jb =j zš ꜥ.wj =j sdꜣ ḫr m ꜥ,t =j nb.t", "inna l-malaʾa yaʾtamirūna bika li-yaqtulūka fa-khruj ... fa-kharaja minhā khāʾifan yataraqqab"]
      outcome: ["no deed behind it: 'I was not spat upon, I was not reproached'", "behind it, the man he killed"]
    note: "Sinuhe hears the messenger speaking of the king's death, 'my heart was distraught, my arms spread, trembling fell on all my limbs', and runs, 'I did not expect to live after this' (W2:24-31); to his host he insists 'I was not spat upon, I was not reproached' (W2:64). Mūsā, after the killing of 28:15, is warned by a running man: 'the chiefs are conspiring to kill you, so leave'; 'he left it fearful, watchful (khāʾifan yataraqqab)' (28:20-21). The panicked flight from Egypt of a man of the court in fear for his life; the cause differs: no crime at all, against a killing."
  - with: quran-28-moses-in-midian
    motif: water-and-the-old-chief-at-the-fugitives-arrival
    refs: ["Sinuhe W2:46/2", "Sinuhe W2:47", "Sinuhe W2:48", "Sinuhe W2:49", "Sinuhe W2:51", "Sinuhe W2:51/2"]
    with_refs: ["28:23", "28:24", "28:25"]
    relation: divergence
    record:
      agent: ["a nomad chief who had been in Egypt", "the women's father, an old chief (shaykhun kabīr)"]
      action: ["gives the fugitive water and boiled milk", "is given water for his flock by the fugitive, then rewards him"]
      place: ["in the desert, among the herds (lowing of cattle)", "at the water of Madyan, among the herdsmen"]
      quoted: ["sjꜣ.n wj mꜥtn jm pꜣu̯ wnn ḥr Km,t ꜥḥꜥ.n rdi̯.n =f n =j mw psi̯.n =f n =j jrt,t", "wa-abūnā shaykhun kabīr ... fa-saqā lahumā ... inna abī yadʿūka li-yajziyaka ajra mā saqayta lanā"]
      outcome: ["he goes with him to his tribe, who treat him well", "he goes to him, tells his story and is told 'do not fear'"]
    note: "Parched in the desert, Sinuhe hears the lowing of cattle; 'the chief among them, who had been in Egypt, recognised me; he gave me water and boiled milk for me', and Sinuhe goes with him to his tribe (W2:46/2-51/2). Mūsā reaches 'the water of Madyan' among the herdsmen, waters the flock of two women whose 'father is a very old man (shaykhun kabīr)', and is summoned by him 'to reward you for watering for us' (28:23-25). The fugitive from Egypt is received at the water by an elder of the herding people; the giving of water is reversed, to the fugitive in Sinuhe, by the fugitive in the Quran."
  - with: quran-28-moses-in-midian
    motif: foreign-ruler-welcomes-fugitive
    refs: ["Sinuhe W2:54", "Sinuhe W2:55", "Sinuhe W2:58", "Sinuhe W2:59", "Sinuhe W2:61", "Sinuhe W2:63"]
    with_refs: ["28:25"]
    relation: parallel
    record:
      agent: ["Ammunenshi, ruler of Upper Retenu", "the old chief of Madyan"]
      action: ["hears why the fugitive came and assures him of safety with him", "hears why the fugitive came and assures him of safety with him"]
      quoted: ["nfr tw ḥnꜥ =j ... pḥ.n =k nn ḥr-zj-jšst jn-jw wn ḫpr,t m ẖnw", "fa-lammā jāʾahu wa-qaṣṣa ʿalayhi l-qaṣaṣa qāla lā takhaf najawta mina l-qawmi ẓ-ẓālimīn"]
      outcome: ["the account is evasive ('as if', m jwms)", "the account is the whole story (al-qaṣaṣ)"]
    note: "Ammunenshi: 'you will be well with me (nfr tw ḥnꜥ =j), you will hear the speech of Egypt'; 'why have you come here? has something happened at the Residence?'; Sinuhe answers with a half-truth, said 'as if' (m jwms) (W2:54-63). In 28:25 Mūsā 'told him the story', and the chief answers 'do not fear, you have escaped from the wrongdoing people'. The host's question, the fugitive's account and the assurance of safety; the honesty of the account differs."
  - with: quran-3-misers-mockers
    motif: every-soul-tastes-death
    refs: ["Sinuhe W2:47"]
    with_refs: ["3:185"]
    relation: echo
    record:
      agent: ["Sinuhe, dying of thirst", "every soul"]
      object: ["the taste of death", "death, tasted"]
      quoted: ["ḏd.n =j dp,t mwt nn", "kullu nafsin dhāʾiqatu l-mawt"]
    note: "'I was parched, my throat was dusty; I said: this is the taste of death (dp,t mwt)' (W2:47). Q 3:185 (also 21:35, 29:57): 'every soul will taste death (dhāʾiqatu l-mawt)'. The image of death as something tasted, in Egyptian of one man near death, in the Quran of all mortals."
