- unit: ane-sinuhe-w1-reply-letter
  checked: [quran-79-pharaoh-and-cosmos, quran-3-sovereignty, quran-17-iblis-and-adam, quran-2-abraham-king, quran-43-zukhruf-pharaoh-claims]
  matches:
  - with: quran-2-abraham-king
    motif: king-and-the-rising-sun
    refs: ["Sinuhe W1:232", "Sinuhe W1:233"]
    with_refs: ["2:258"]
    relation: divergence
    record:
      agent: ["Sinuhe, to the king", "Ibrāhīm, to the king"]
      object: ["the sunrise", "the sunrise"]
      action: ["says the sun rises for the king's sake", "says God brings the sun from the east and dares the king to bring it from the west"]
      quoted: ["wbn jtn n mrw,t =k", "fa-inna llāha yaʾtī bi-sh-shamsi mina l-mashriqi fa-ʾti bihā mina l-maghrib"]
      outcome: ["praise of the king", "the king is confounded (fa-buhita)"]
    note: "Sinuhe's letter to Senwosret: 'you are he who covers this horizon; the sun disk rises for love of you (wbn jtn n mrw,t =k)' (W1:232-233). Ibrāhīm to the king who argued with him: 'God brings the sun from the east, so bring it from the west', and the unbeliever was dumbfounded (2:258). The rising of the sun tied to a king to his face: as flattery in Egypt, as the test that silences the king in the Quran."
  - with: quran-2-abraham-king
    motif: who-gives-life-and-death
    refs: ["Sinuhe W1:234", "Sinuhe W1:236/3"]
    with_refs: ["2:258"]
    relation: divergence
    record:
      agent: ["the king, in Sinuhe's words", "the king, in his own words"]
      action: ["gives the breath by which men live", "claims to give life and cause death"]
      quoted: ["ṯꜣw m p,t ḫnm.tw =f ḏd =k ... ꜥnḫ =tw m ṯꜣw n dd =k", "qāla ana uḥyī wa-umīt"]
      outcome: ["accepted as homage", "answered by Ibrāhīm and refuted"]
    note: "'The air in the sky is breathed when you say so ... one lives on the breath you give' (W1:234, 236/3), Sinuhe to his king. In 2:258 Ibrāhīm says 'my Lord is he who gives life and causes death' and the king answers 'I give life and cause death (ana uḥyī wa-umīt)'. The power of life ascribed to the king: offered by a subject in Egypt, claimed by the king in the Quran and refuted."
  - with: quran-43-zukhruf-pharaoh-claims
    motif: river-water-at-the-kings-command
    refs: ["Sinuhe W1:233/2"]
    with_refs: ["43:51"]
    relation: divergence
    record:
      agent: ["Sinuhe, of the king of Egypt", "Pharaoh, of himself"]
      object: ["the water in the river", "these rivers"]
      quoted: ["mw m jtr,w swrj.tw =f mri̯ =k", "wa-hādhihi l-anhāru tajrī min taḥtī"]
      outcome: ["praise of the king", "the boast of a people led astray (fa-stakhaffa qawmahu)"]
    note: "Sinuhe to the king of Egypt: 'the water in the river (jtr,w), it is drunk when you wish' (W1:233/2). Pharaoh to his people: 'is not the kingdom of Egypt mine, and these rivers (al-anhār) flowing beneath me?' (43:51). The river of Egypt at the disposal of its king: a courtier's homage in one, Pharaoh's own boast, condemned, in the other."
