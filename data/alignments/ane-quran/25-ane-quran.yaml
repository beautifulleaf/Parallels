    with_refs: ["12:89", "12:90"]
    relation: divergence
    record:
      agent: [Bata, Yūsuf]
      action: ["reveals himself to the one who wronged him, naming the wrong", "reveals himself to those who wronged him, naming the wrong"]
      recipient: ["his wife", "his brothers"]
      quoted: ["ptrj tw≡j ꜥnḫ.kwj m-rʾ-ꜥ ... jnk Bꜣ~tʾ", "a-innaka la-anta Yūsufu qāla ana Yūsufu"]
      outcome: ["she is afraid and plots his death again", "he forgives them (12:92)"]
    note: "Bata as a bull to his wife: 'See, I am still alive.' 'Who are you?' 'I am Bata. I know that when you had the cedar felled it was to keep me from living' (15_8/2-15_10). Yūsuf to his brothers: 'do you know what you did to Yūsuf?' 'Are you indeed Yūsuf?' 'I am Yūsuf' (12:89-90). The question 'who are you / are you he?', the answer 'I am N.' and the naming of the past wrong are shared; the outcome is opposite: renewed plotting against forgiveness."
