      quoted:
      - epšētēkunu turrānikkunūši
      - wa-lā yaḥīqu l-makru s-sayyiʾu illā bi-ahlihi
    note: V:75 epšētēkunu turrānikkunūši, 'your deeds are turned back to you', after V:68 ina nīši u māmīti tuqattâʾinni ... pagarkunu liqti; Q 35:43 wa-lā yaḥīqu l-makru s-sayyiʾu illā bi-ahlihi, 'the evil plot encompasses none but its own people'. Maqlû makes it happen by spell; the Quran states it as God's sunna.
