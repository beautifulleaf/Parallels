# ANE x Quran side-by-side pass, chunk 12 (Maqlu IV-VIII and Ritual Tablet, Marduk's Address to the Demons, Syncretistic Hymn to Marduk, Great Prayer to Nabu, Cuthaean Legend of Naram-Sin, Nergal and Ereshkigal, Ninurta hymns, Ox and Horse, Palm and Vine). Judged blind, from the originals.
new_motifs:
  sorcery-that-sows-hatred:
    label: A named kind of sorcery whose effect is hatred or estrangement between people (hate-magic; what separates a man from his wife)
    cluster: magic
  covered-over-by-mountain-or-earth:
    label: 'Being covered over by a mountain or by the earth: cursed on others or wished for oneself [shared matter]'
    cluster: eschatology
  ploughing-as-insemination:
    label: Ploughing and sowing a field stand for insemination (the plough impregnates the earth; women are a tilth)
    cluster: nature
  earth-bidden-to-take-in:
    label: The earth is addressed in the vocative and bidden to open, receive or swallow something [shared matter]
    cluster: nature
  oath-by-the-life-of:
    label: An oath 'by the life of' someone (nīš X / la-ʿamru-ka) [shared matter]
    cluster: deity
  flash-of-a-falling-star:
    label: The flash of a star falling from heaven and its relation to demons [shared matter]
    cluster: cosmos
  reviver-of-the-dead-epithet:
    label: The deity bears the epithet 'reviver of the dead' (muballiṭ mīti / muḥyī l-mawtā)
    cluster: deity
  number-of-the-underworld-s-wardens:
    label: How many wardens or demons are set over the underworld or hell [shared matter]
    cluster: eschatology
  messenger-climbs-the-stairway-of-heaven:
    label: Messengers go up and down between realms by a stairway or ladder of heaven (simmiltu / sullam / maʿārij)
    cluster: cosmos
  god-raises-a-mighty-foe-against-his-own-land:
    label: The god himself rouses a mighty foreign enemy against his own land or people
    cluster: kingship
  who-killed-the-enemy:
    label: Whether the human side or the deity is credited with killing the enemy [shared matter]
    cluster: kingship
  destroying-horde-kept-for-a-later-day:
    label: A destroying people is not wiped out now but kept for a later divine appointment [shared matter]
    cluster: eschatology
  kin-against-kin-in-the-coming-calamity:
    label: Under the coming calamity the bonds of father, son, brother and friend give way [shared matter]
    cluster: eschatology
  thunder-and-the-god:
    label: 'How thunder in the clouds relates to the god: his own roar or a creature praising him [shared matter]'
    cluster: nature
  god-holds-heaven:
    label: 'The god (alone) holds the heavens (and earth) in place: the bond or rope of heaven, holding back the sky'
    cluster: cosmos
  none-forgives-sin-but-the-god:
    label: Only this god can absolve or forgive sin
    cluster: deity
  heavenly-beings-plead-for-the-human:
    label: The heavenly host speak for a human before the high god and ask his forgiveness
    cluster: deity
  beasts-for-riding-and-beasts-for-burden:
    label: The horse is for riding and display and is not eaten; cattle carry loads (and are eaten)
    cluster: nature
  palm-and-vine-yield-drink:
    label: Date palm and vine paired as sources of fruit and intoxicating drink
    cluster: nature
  drink-that-heals:
    label: 'A drink said to contain healing for the sick: wine or honey [shared matter]'
    cluster: nature
