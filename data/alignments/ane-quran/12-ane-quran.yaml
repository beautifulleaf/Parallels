- unit: ane-maqlu-sb-iv-six-bindings-seven-undoings
  checked:
  - quran-112-114-unity-and-refuge
  - quran-37-ranks-and-guarded-heaven
  - quran-83-defrauders
  - quran-52-tur-garden-and-challenge
  matches:
  - with: quran-112-114-unity-and-refuge
    motif: women-who-bind-knots-in-sorcery
    refs:
    - Maqlu SB IV:116-117
    with_refs:
    - '113:4'
    relation: parallel
    record:
      agent:
      - women (Gutean, Elamite, Hanigalbatean and native)
      - women (feminine plural)
      action:
      - work sorcery with knots
      - work sorcery with knots
      object:
      - knots
      - knots
      quoted:
      - mārāt māti irakkasāni riksī
      - al-naffāthāti fī l-ʿuqad
    note: IV:116-117 gutêti elamâtu habigalbatâtu / mārāt māti irakkasāni riksī, 'the Gutean, Elamite, Hanigalbatean women, the daughters of the land are tying knots (riksī) against me'; Q 113:4 wa-min sharri n-naffāthāti fī l-ʿuqad, 'from the evil of the women who blow on knots'. Both name the knot-sorcerers as a feminine plural. The Akkadian verb is tying (rakāsu), the Arabic blowing (nafatha); Maqlû elsewhere pairs the knot with spittle (ruhû), e.g. VIII:25-27.
