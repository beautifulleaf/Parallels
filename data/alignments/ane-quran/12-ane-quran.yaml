    note: 'A+5''-6'' ela yâti ... šarru šakkanakku ēnu u rubû ul ibaʾʾū padāna, ''without me king, governor, lord and prince do not go on the road''; B+11-12 attā u agālu tazabbilā tupšikka, ''you and the donkey carry the panniers''; C+16 [ul inn]akkal šīrī, ''my flesh is not eaten'' (partly restored); Q 16:5-8 wa-l-anʿāma khalaqahā lakum ... wa-minhā taʾkulūna ... wa-taḥmilu athqālakum ... wa-l-khayla wa-l-bighāla wa-l-ḥamīra li-tarkabūhā wa-zīnatan. The same division: the horse is for riding and prestige and is not eaten; the cattle carry loads (and are eaten). One detail differs: the donkey goes with the ox under the panniers in the debate, with the horse among the mounts in the Quran.'
