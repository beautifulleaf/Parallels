    note: V:57 zīru ša tēpušāni tušēpišāni ana muhhīkunu ēpuša, 'the hate(-magic) you performed against me I perform against you' (paired with love-magic, râmu, in VII:75); Q 2:102 fa-yataʿallamūna minhumā mā yufarriqūna bihi bayna l-marʾi wa-zawjihi, 'they learn from the two what separates a man from his wife'. A named kind of sorcery whose effect is estrangement. Maqlû does not say between spouses; the Quran does not name it hate.
  - with: quran-35-heirs-of-book
