  - unit: ane-cth-378-2-second-plague-prayer-confession
    checked: [quran-35-not-equal, quran-6-final-reckoning, quran-2-abraham-kaaba, quran-38-david-ewe-parable]
    matches:
      - with: quran-6-final-reckoning
        motif: liability-for-another-s-guilt
        refs: ["CTH 378.2 §11:115", "CTH 378.2 §11:117", "CTH 378.2 §11:118", "CTH 378.2 §11:119", "CTH 378.2 §11:120"]
        with_refs: ["6:164"]
        relation: contrast
        record:
          object: ["the father's sin", "another's burden"]
          recipient: ["the son", "another soul"]
          quoted: ["ŠA A-BU-ŠU-kan waštul A-NA DUMU-ŠU ari", "wa-lā taziru wāziratun wizra ukhrā"]
          outcome: ["the father's sin has reached Muršili, who did no wrong", "no bearer bears another's load"]
        note: "Muršili: 'I did no wrong, but it happens so: the father's sin comes to his son, so my father's sin has come to me' (§11:117-120); 6:164 lā taziru wāziratun wizra ukhrā."
      - with: quran-35-not-equal
        motif: liability-for-another-s-guilt
        refs: ["CTH 378.2 §11:118", "CTH 378.2 §11:119", "CTH 378.2 §11:120"]
        with_refs: ["35:18"]
        relation: contrast
        record:
          object: ["the father's sin", "another's burden"]
          recipient: ["the son", "a near kinsman"]
          quoted: ["ŠA A-BU-ŠU-kan waštul A-NA DUMU-ŠU ari", "lā yuḥmal minhu shayʾun wa-law kāna dhā qurbā"]
        note: "The father's sin passes to the son (§11:119) against 35:18, where none of the load is carried 'even by a near kinsman' (wa-law kāna dhā qurbā): the kinship that transmits guilt in the Hittite is named in Q only to deny it."
