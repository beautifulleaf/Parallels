        record:
          agent: ["the deity (Lelwani)", "the offerers and the poor"]
          object: ["fat and blood of the victims", "flesh and blood of the camels"]
          action: ["eats the fat and drinks the blood", "eat of it and feed the needy"]
          quoted: ["UZU.Ì et nu-za išpāi ešḫar [...] ninik", "lan yanāla llāha luḥūmuhā wa-lā dimāʾuhā wa-lākin yanāluhu t-taqwā minkum"]
        note: "'Eat, deity, the fat of that cow and sheep, eat your fill; drink the blood and quench your thirst' (§1:8-11); 22:36-37 the offerers eat and feed the poor, and neither the flesh nor the blood reaches God."
      - with: quran-37-sacrifice-of-son
        motif: substitute-for-a-human-life
        refs: ["CTH 380.1 §2:12", "CTH 380.1 §2:13", "CTH 380.1 §2:14", "CTH 380.1 §2:15"]
        with_refs: ["37:107"]
        relation: divergence
        record:
          agent: ["the queen Gaššuliyawiya", "God"]
          object: ["an adorned substitute", "a great sacrifice"]
          recipient: ["the angry deity", "Abraham's son"]
          quoted: ["tarpaššan unuwandan uppaḫḫun ... ammuk kattan SIG5-anza", "wa-fadaynāhu bi-dhibḥin ʿaẓīm"]
          outcome: ["sent so the deity takes it instead of her", "the son is ransomed"]
        note: "The sick queen sends the deity an adorned substitute, 'better than I, pure, shining, white' (§2:13-17), to be taken in her place; in 37:107 God himself ransoms the son with a great sacrifice. Who provides the substitute, and to whom, is reversed."
