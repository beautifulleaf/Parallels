        with_refs: ["2:134", "2:141"]
        relation: echo
        record:
          agent: ["Ḫattušili", "God"]
          object: ["the old offence of his father's time", "what past generations did"]
          quoted: ["ammel UD.ḪI.A-aš EGIR-pa lē ḫuittiyattari ... UL ārān ... karū apāšpat šarnikta", "lahā mā kasabat wa-lakum mā kasabtum wa-lā tusʾalūna ʿammā kānū yaʿmalūn"]
