  - unit: ane-etcsl-2-4-1-1-1-netherworld-gifts
    checked: [quran-23-death-barzakh-judgment, quran-2-talut-jalut, quran-3-sovereignty, quran-7-moses-pharaoh, quran-56-waqia-left-hand-and-proofs]
    matches:
      - with: quran-56-waqia-left-hand-and-proofs
        motif: food-and-drink-of-the-netherworld
        refs: ["ETCSL 2.4.1.1 1:82", "ETCSL 2.4.1.1 1:83"]
        with_refs: ["56:52", "56:54", "56:56"]
        relation: divergence
        record:
          agent: [Ur-Namma and the dead, those who went astray]
          action: [sit at a banquet in the netherworld, eat and drink as their welcome-meal]
          object: ["bitter food, brackish water", "the tree of zaqqum, boiling water"]
          quoted: ["u2 kur-ra sis-am3 a kur-ra mun4-na-am3", "la-ākilūna min shajarin min zaqqūm ... fa-shāribūna ʿalayhi mina l-ḥamīm ... hādhā nuzuluhum"]
          outcome: [the food of all the dead, the hospitality (nuzul) of the deniers only]
        note: "The arrival in the netherworld is a meal: Ur-Namma seats the dead at a huge banquet, and 'the food of the netherworld is bitter (sis), the water of the netherworld is brackish (mun4)' (1:82-83). In 56:52-56 the deniers eat from the zaqqum tree and drink boiling water on top of it: 'this is their welcome-meal (nuzuluhum) on the Day of Judgment'. Same pairing of food and drink; in the Sumerian it is the lot of every dead person, in the Quran only of those who denied."
  - unit: ane-etcsl-2-4-1-1-1-ur-namma-lament
    checked: [quran-79-pharaoh-and-cosmos, quran-46-ahqaf-hud-and-the-jinn, quran-89-dawn, quran-23-death-barzakh-judgment]
    matches:
      - with: quran-89-dawn
        motif: dead-man-regrets-what-he-left-undone
        refs: ["ETCSL 2.4.1.1 1:148-153"]
        with_refs: ["89:23", "89:24"]
        relation: divergence
        record:
          agent: [Ur-Namma, man]
          action: [laments after death what he did not do, cries out after the fact what he did not do]
          object: ["his wall, palace, wife, sons and daughters", "deeds sent ahead for his life"]
          quoted: ["bad3 urim2-ma nu-mu-un-til-la-ni ... dam-a-ni ur2-ra-na a-la nu-mu-un-gi4-a-ni", "yā laytanī qaddamtu li-ḥayātī"]
        note: "The dead man's regret, in the first person: Ur-Namma weeps that he could not finish the wall of Urim, enjoy his new palace, embrace his wife or raise his sons on his knees (1:148-153). In 89:23-24, on the day hell is brought near, man remembers 'and he says: would that I had sent ahead (qaddamtu) for my life'. The Sumerian king regrets the life he did not get to enjoy; the Quranic man regrets the good he did not send ahead."
      - with: quran-23-death-barzakh-judgment
        motif: the-dead-cannot-return
        refs: ["ETCSL 2.4.1.1 1:164-165"]
        with_refs: ["23:99", "23:100"]
        relation: divergence
        record:
          agent: [Ur-Namma, the dying man]
          action: [cannot turn back to Urim, asks to be sent back]
          instrument: [like rain from heaven that cannot turn back, a barrier (barzakh)]
          quoted: ["just as the rain pouring down from heaven cannot turn back, nor can I turn back to brick-built Urim", "rabbi rjiʿūni laʿallī aʿmalu ṣāliḥan fīmā taraktu kallā ... wa-min warāʾihim barzakhun"]
          outcome: [no return, no return until the day they are raised]
        note: "Ur-Namma, with no god to help him, says 'just as the rain pouring down from heaven cannot turn back, alas, nor can I turn back to brick-built Urim' (1:164-165). The dying man of 23:99-100 asks 'my Lord, send me back, that I may do right in what I left', and is refused: 'no! ... and behind them is a barrier (barzakh) until the day they are raised'. Ur-Namma wants to go back to his city; the Quranic man wants to go back to do good. Both are refused; in the Quran the refusal lasts only until the resurrection."
