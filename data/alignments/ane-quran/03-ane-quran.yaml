        motif: mortal-cannot-ascend-to-heaven
        refs: ["ETCSL 2.4.2.02 281", "ETCSL 2.4.2.02 282"]
        with_refs: ["17:93"]
        relation: echo
        record:
          agent: [a mortal, the Prophet]
          action: [has ever reached heaven, ascend into heaven]
          quoted: ["a-ba nam-til3 an-na ba-e-e3", "aw tarqā fī s-samāʾi ... hal kuntu illā basharan rasūlā"]
          outcome: [no mortal has, he answers that he is only a mortal]
        note: "Going up to heaven as the thing a mortal cannot do: 'Whatever is acquired is destined to be lost. What mortal (nam-til3, a living being) has ever reached the heavens?' (281-282). The Prophet's opponents demand 'or that you ascend (tarqā) into heaven', and he is told to answer: 'Glory to my Lord, am I anything but a mortal (bashar), a messenger?' (17:93)."
  - unit: ane-etcsl-2-4-2-02-curse-academies
    checked: [quran-20-moses-pharaoh-magicians, quran-7-moses-pharaoh, quran-43-zukhruf-pharaoh-claims, quran-38-solomon-horses-throne]
