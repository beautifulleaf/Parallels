  family-members-turn-away-from-one-another: {label: "In the catastrophe a man turns away from wife, parents and children", cluster: judgment}
  god-sends-foreign-army-against-his-own-people: {label: "The god himself sends a fierce foreign people against his own city or people", cluster: judgment}
  kingship-given-and-taken-back: {label: "The high god gives kingship to a city or man and takes it away again: no reign lasts", cluster: kingship}
  enemy-enters-the-sanctuary: {label: "The enemy sent against the city enters its sanctuary and wrecks what it finds", cluster: judgment}
  why-the-god-gives-his-city-to-the-enemy: {label: "The reason given for the god's handing his own city over to destruction", cluster: judgment}
  city-destroyed-a-second-time: {label: "The city is destroyed a second time", cluster: judgment}
  scattered-people-restored-after-destruction: {label: "After the divinely sent destruction the people are brought back and restored", cluster: judgment}
  whether-a-righteous-city-is-destroyed: {label: "Whether the god destroys a city whose people do right", cluster: judgment}
  travel-in-safety-by-night-and-day: {label: "Road stages are measured out so that travellers go safely by night and by day", cluster: kingship}
  fear-covers-a-town-like-a-garment: {label: "Fear (and hunger) covers a town's people like a garment", cluster: judgment}
  calamity-that-strikes-not-only-the-wrongdoers: {label: "A destroying calamity does not single out the wrongdoers but strikes all", cluster: judgment}
  no-one-knows-what-the-deity-is: {label: "No one encompasses or knows what the deity is", cluster: deity}
  whether-a-decreed-fate-can-be-altered: {label: "Whether a decreed term or fate can be altered after it is fixed", cluster: death}
  food-and-drink-of-the-netherworld: {label: "The food and the drink of the netherworld (hell): bitter food, foul water", cluster: afterlife}
  dead-man-regrets-what-he-left-undone: {label: "The dead man laments what he did not do or enjoy in life", cluster: death}
  the-dead-cannot-return: {label: "The dead cannot go back to the life they left", cluster: death}
  brick-tower-rising-to-heaven: {label: "A ruler has bricks made for a lofty building that reaches up to heaven", cluster: kingship}
  stature-of-the-chosen-king: {label: "The king chosen by the god is taller than the others", cluster: kingship}
  king-covers-a-vast-distance-between-morning-and-evening: {label: "A king covers a journey of many stages in a single day", cluster: kingship}
  rain-from-heaven-meets-water-from-the-earth: {label: "In the storm the water from heaven meets the water from the earth", cluster: nature}
  mortal-cannot-ascend-to-heaven: {label: "No mortal goes up to heaven", cluster: death}
  king-who-understands-foreign-speech: {label: "A king boasts that he understands speech other than his own", cluster: kingship}
  no-later-king-to-equal-this-one: {label: "No king after the speaker will equal (or be given) what he has", cluster: kingship}
  enemy-trees-cut-down: {label: "The trees and orchards of the enemy are cut down or left standing", cluster: war}
  gardens-turned-to-wild-growth: {label: "Fine gardens of fruit are turned into a growth of weeds or bitter shrubs", cluster: judgment}
  spoil-of-the-enemy-assigned-to-the-god: {label: "What becomes of the spoil taken from the enemy: brought to the god or assigned to God", cluster: war}
  vessel-of-planks-and-fastenings: {label: "A holy vessel is described by its planks and their fastenings", cluster: flood}
