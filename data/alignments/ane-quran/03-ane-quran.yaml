  - unit: ane-etcsl-2-2-3-g-enlil-answer-siege-sack
    checked: [quran-3-sovereignty, quran-17-night-journey-and-israel, quran-59-hashr-banu-nadir-and-fay, quran-7-towns-pattern, quran-50-qaf-two-recorders-and-hell-asks-more]
    matches:
      - with: quran-3-sovereignty
        motif: kingship-given-and-taken-back
        refs: ["ETCSL 2.2.3 G:366-369"]
        with_refs: ["3:26"]
        relation: parallel
        record:
          agent: [An and Enlil, God]
          action: [gives kingship but not an eternal reign, gives kingship and takes it away]
          object: [kingship, kingship]
          recipient: [Urim, whom he wills]
          quoted: ["urim5-ma nam-lugal ḫa-ba-šum2 bal da-ri2 la-ba-an-šum2", "tuʾtī l-mulka man tashāʾu wa-tanziʿu l-mulka mimman tashāʾ"]
        note: "Enlil's answer to Nanna: 'Urim was indeed given kingship (nam-lugal) but it was not given an eternal reign (bal da-ri2); who has ever seen a reign of kingship that would take precedence for ever?' (G:366-369). 3:26: 'O God, owner of kingship (mālik al-mulk), you give kingship (al-mulk) to whom you will and take kingship from whom you will.' Both name the thing given and withdrawn as kingship; the Sumerian adds that every reign's turn (bal) must run out."
      - with: quran-50-qaf-two-recorders-and-hell-asks-more
        motif: no-one-changes-the-spoken-word
        refs: ["ETCSL 2.2.3 G:364-365"]
        with_refs: ["50:28", "50:29"]
        relation: parallel
        record:
          agent: [Enlil, God]
          action: [refuses a plea because the word cannot be changed, refuses a dispute because the word is not changed]
          recipient: [his son Nanna pleading for Urim, the disputing sinner and his companion]
          quoted: ["di-til-la inim pu-uḫ2-ru-um-ma-ka šu gi4-gi4 nu-ĝal2, inim dug4-ga an den-lil2-la2-ka šu bal-e nu-zu", "lā takhtaṣimū ladayya ... mā yubaddalu l-qawlu ladayya"]
          outcome: [Urim is not spared, the sentence stands]
        note: "The same refusal formula in the same setting, a plea before the highest judge: 'the judgment of the assembly cannot be turned back, the word spoken by An and Enlil knows no overturning (šu bal-e nu-zu)' (G:364-365); 'do not dispute before me ... the word is not changed before me (mā yubaddalu l-qawlu ladayya), and I am not unjust to the servants' (50:28-29). The Sumerian word is the council's; the Quranic one is the warning already sent (qaddamtu ilaykum bi-l-waʿīd)."
      - with: quran-17-night-journey-and-israel
        motif: enemy-enters-the-sanctuary
        refs: ["ETCSL 2.2.3 G:407B", "ETCSL 2.2.3 G:420-434", "ETCSL 2.2.3 G:442"]
        with_refs: ["17:7"]
        relation: parallel
        record:
          agent: [the enemy, the servants sent by God]
          action: [enters the shrine and destroys it, enters the masjid and destroys]
          place: [E-kiš-nu-ĝal of Nanna, al-masjid]
          quoted: ["e2-kiš-nu-ĝal2 dnanna-ka lu2-erim2-e ba-e-dab5", "wa-li-yadkhulū l-masjida ka-mā dakhalūhu awwala marratin wa-li-yutabbirū mā ʿalaw tatbīrā"]
          outcome: [the house's great door-frames fall and the wall is breached, they utterly destroy what they overrun]
        note: "The army the god sends does not stop at the city but takes the sanctuary: 'the E-kiš-nu-ĝal of Nanna was seized by the enemy', and the sacred box no one had looked at was seen by the enemy (G:407B, 442); in 17:7 the second army is sent 'to enter the masjid as they entered it the first time, and to destroy utterly whatever they overran (li-yutabbirū)'."
      - with: quran-17-night-journey-and-israel
        motif: why-the-god-gives-his-city-to-the-enemy
        refs: ["ETCSL 2.2.3 G:366-369"]
        with_refs: ["17:4", "17:5"]
        relation: divergence
        record:
          agent: [Enlil, God]
          action: [gives his city over to destruction, sends an army against his people]
          quoted: ["bal nam-lugal-la saĝ-bi-še3 e3-a a-ba-a igi im-mi-in-du8-a", "la-tufsidunna fī l-arḍi marratayn"]
          outcome: [because its turn of kingship was over, because they would make mischief in the land twice]
        note: "The motive differs. Enlil gives no sin as the reason for Urim's fall: its reign 'had been long indeed but had to exhaust itself' (G:366-369), and other laments of this group ask what the people did to deserve it. In 17:4-5 the destruction was decreed in the Book because 'you will make mischief in the land twice (la-tufsidunna ... marratayn)', and 17:7-8 ties each army to their own wrongdoing ('if you do evil, it is against yourselves')."
