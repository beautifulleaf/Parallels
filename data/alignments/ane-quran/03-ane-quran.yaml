  - unit: ane-etcsl-2-4-1-1-1-ur-namma-dies
    checked: [quran-3-badr-uhud, quran-3-sovereignty, quran-79-pharaoh-and-cosmos, quran-11-pharaoh-leads, quran-13-messengers-and-mother-of-book]
    matches:
      - with: quran-13-messengers-and-mother-of-book
        motif: whether-a-decreed-fate-can-be-altered
        refs: ["ETCSL 2.4.1.1 1:8", "ETCSL 2.4.1.1 1:9"]
        with_refs: ["13:38", "13:39"]
        relation: divergence
        record:
          agent: [An and Enlil, God]
          action: [alter the fate they had decreed, effaces what he wills and confirms]
          object: [the king's decreed fate, what is written for each term]
          quoted: ["an-ne2 inim kug-ga du3-a mu-un-kur2; den-lil2-le nam tar-ra du3-a šu lul mi-ni-ib-bal", "li-kulli ajalin kitāb; yamḥū llāhu mā yashāʾu wa-yuthbitu wa-ʿindahu ummu l-kitāb"]
          outcome: [the change is a deceit and the gods mourn, the change is God's prerogative and the Mother of the Book is with him]
        note: "Both texts allow that a fixed fate can be changed by the god who fixed it. In the Death of Ur-Namma An 'altered his holy word' and Enlil 'deceitfully (šu lul) changed the fate he had decreed', so the king dies early and the gods lament (1:8-14). In 13:38-39 'every term has a writing (li-kulli ajalin kitāb); God effaces what he wills and confirms, and with him is the Mother of the Book': the same power, stated as sovereign right, not as betrayal."
