  - unit: ane-etcsl-2-4-2-04-revenge-sumer
    checked: [quran-59-hashr-banu-nadir-and-fay, quran-3-badr-uhud, quran-105-elephant, quran-34-sheba]
    matches:
      - with: quran-59-hashr-banu-nadir-and-fay
        motif: enemy-trees-cut-down
        refs: ["ETCSL 2.4.2.04 222-227"]
        with_refs: ["59:5"]
        relation: divergence
        record:
          agent: [Šulgi, the believers]
          action: [uproots and fells the enemy's trees, cut down palms or leave them standing]
          object: ["small, thick and tall trees; gardens of honey and figs", palm trees (līna)]
          instrument: [the axe, null]
          quoted: ["ĝiš tur-tur-bi ur2-ba ga-mu-bu3-bu3; ĝiš daĝal gal-be2-e tun3 gul ga-am3-dug4", "mā qaṭaʿtum min līnatin aw taraktumūhā qāʾimatan ʿalā uṣūlihā fa-bi-idhni llāh"]
          outcome: [revenge for what was destroyed in Sumer, by God's permission and to disgrace the transgressors]
        note: "Cutting the enemy's trees in war: Šulgi vows 'I shall uproot their small trees, with the axe I shall destroy their thick and tall trees ... in their gardens where honey and fig trees grew I shall make weeds grow' (222-227), as revenge measure for measure. 59:5, on the siege of the Banu Nadir: 'whatever palm trees you cut down or left standing on their roots, it was by God's permission, and to disgrace the transgressors'. The Sumerian is the king's revenge; the Quran answers an objection to the cutting by referring it to God's permission, and allows leaving them standing."
      - with: quran-34-sheba
        motif: gardens-turned-to-wild-growth
        refs: ["ETCSL 2.4.2.04 226-227"]
        with_refs: ["34:16"]
        relation: divergence
        record:
          agent: [Šulgi, God]
          action: [makes weeds grow in the irrigated gardens, replaces their two gardens with gardens of bitter fruit]
          object: [gardens of honey and figs, two gardens]
          quoted: ["pu2-ĝiš-kiri6 lal3 ĝiš-peš3 mu2-a-bi a-ri2-na gi4-bi2-i3-mu2 (partly restored)", "wa-baddalnāhum bi-jannatayhim jannatayni dhawātay ukulin khamṭin wa-athlin wa-shayʾin min sidrin qalīl"]
          outcome: [revenge on the foreign land, recompense for ingratitude]
        note: "Fruit gardens turned to wild growth: in the irrigated gardens where honey and fig trees (ĝiš-peš3) used to grow Šulgi will 'make weeds grow, so that plants and herbs break through the soil' (226-227). After the flood of al-ʿArim, God 'replaced their two gardens with two gardens of bitter fruit (khamṭ), tamarisk and a few lote trees' (34:16). A conqueror's revenge against God's recompense for Saba's turning away (34:17)."
