        motif: king-who-understands-foreign-speech
        refs: ["ETCSL 2.4.2.02 206-220"]
        with_refs: ["27:16", "27:19"]
        relation: divergence
        record:
          agent: [Šulgi, Solomon]
          action: [boasts he understands five languages, announces he was taught the speech of birds]
          object: ["Elamite, the mountain tongue, Martu, Subir", the speech of birds]
          number: [5, null]
          quoted: ["5-bi eme-bi ba-ni-ib-gi4-gi4-in", "ʿullimnā manṭiqa ṭ-ṭayri wa-ūtīnā min kulli shayʾ"]
        note: "A king proclaims to his people the speech he understands: Šulgi can answer in all five languages (eme) when he judges (206-220); Solomon: 'O people, we have been taught the speech of birds (manṭiq al-ṭayr) and given of everything' (27:16), and he understands the ant (27:18-19). Šulgi's are the human languages of his neighbours, learned and his own boast; Solomon's is the speech of birds, taught (ʿullimnā), and he thanks God for it (27:19)."
  - unit: ane-etcsl-2-4-2-02-old-hymns-future-king
    checked: [quran-17-prayer-spirit-and-challenge, quran-2-talut-jalut, quran-43-zukhruf-pharaoh-claims, quran-20-moses-pharaoh-magicians]
    matches:
