        motif: no-later-king-to-equal-this-one
        refs: ["ETCSL 2.4.2.02 332-336"]
        with_refs: ["38:35"]
        relation: divergence
        record:
          agent: [Šulgi, Solomon]
          action: [declares no king will ever equal his deeds, asks for a kingdom none after him should have]
          recipient: [future kings, anyone after him]
          quoted: ["numun ba-i-i-ta zag uĝ3 lu-a-še3 lugal niĝ2-ĝa2 niĝ2 bi2-in-sig10-ga-am3", "wa-hab lī mulkan lā yanbaghī li-aḥadin min baʿdī"]
        note: "A king says no one after him will have what he has: Šulgi, at the end of his hymn, claims that from the time the seed of mankind came forth to its full flourishing no king will equal what he achieved (332-336). Solomon, after asking forgiveness, prays 'grant me a kingdom that will befit no one after me (li-aḥadin min baʿdī); you are the Giver' (38:35). One is a boast about his own deeds, the other a request for a gift."
