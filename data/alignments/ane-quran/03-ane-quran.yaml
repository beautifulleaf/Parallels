    checked: [quran-17-night-journey-and-israel, quran-3-badr-uhud, quran-16-deniers-and-angels-of-death]
    matches:
      - with: quran-17-night-journey-and-israel
        motif: scattered-people-restored-after-destruction
        refs: ["ETCSL 2.2.4 O:214-215", "ETCSL 2.2.4 O:230-231"]
        with_refs: ["17:6"]
        relation: parallel
        record:
          agent: [the gods, God]
          action: [return the scattered people and drive the enemy from the temple, give back the turn against the enemy]
          recipient: [Sumer and Akkad, the Children of Israel]
          quoted: ["uĝ3 bir-a-bi gud3-bi-še3 gur-ru-dam", "thumma radadnā lakumu l-karrata ʿalayhim wa-amdadnākum bi-amwālin wa-banīn"]
        note: "After the destruction the gods sent, the same gods reverse it: the scattered people are 'returned to their nests' (gur-ru-dam) and the enemy is removed from the temple (O:214-215, 230-231); 'then we gave you back the turn (radadnā lakumu l-karrata) against them and aided you with wealth and sons' (17:6). Sumerian gur and Arabic radda both 'turn back'."
