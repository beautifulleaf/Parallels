  - unit: ane-etcsl-2-4-2-02-judge-languages
    checked: [quran-30-signs, quran-20-moses-pharaoh-magicians, quran-2-talut-jalut, quran-43-zukhruf-pharaoh-claims, quran-27-solomon-ants-hoopoe-sheba]
