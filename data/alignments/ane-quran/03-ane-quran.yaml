  - unit: ane-etcsl-2-4-2-18-boat-described
    checked: [quran-54-qamar-moon-split-and-noah, quran-16-blessings-of-creation, quran-25-signs-shadow-seas]
    matches:
      - with: quran-54-qamar-moon-split-and-noah
        motif: vessel-of-planks-and-fastenings
        refs: ["ETCSL 2.4.2.18 A:15", "ETCSL 2.4.2.18 A:16"]
        with_refs: ["54:13"]
        relation: echo
        record:
          object: [Ninlil's barge, Noah's ark]
          instrument: [floor-planks and side-planks fastened with wooden rings, planks (alwāḥ) and fastenings (dusur)]
          quoted: ["giš-eme-sig-zu-u3 ... giš-u3 giš-ḫar-ra keše2-keše2-ra2-zu-u3", "wa-ḥamalnāhu ʿalā dhāti alwāḥin wa-dusur"]
          outcome: [the boat carries Enlil and Ninlil to Tummal, the ark runs under God's eyes]
        note: "A holy vessel described by what it is made of: Šulgi R addresses Ninlil's barge part by part, 'your floor-planks (ĝiš-eme-sig) are flood-currents ... your side-planks, fastened (keše2) into their places with wooden rings' (A:15-16). Noah is carried 'on a thing of planks and fastenings (dhāti alwāḥin wa-dusur)' that 'runs under our eyes' (54:13-14). Both vessels were ordered by the deity (Ninlil commanded the barge, A:1-5); the Quran names the ark only by its planks and fastenings, while the hymn turns each part into an image."
