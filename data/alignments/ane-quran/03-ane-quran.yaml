    checked: [quran-59-hashr-banu-nadir-and-fay, quran-105-elephant, quran-7-moses-pharaoh]
    matches:
      - with: quran-59-hashr-banu-nadir-and-fay
        motif: spoil-of-the-enemy-assigned-to-the-god
        refs: ["ETCSL 2.4.2.04 348-350", "ETCSL 2.4.2.04 375-381"]
        with_refs: ["59:6", "59:7"]
        relation: divergence
        record:
          agent: [Šulgi, God]
          action: [brings the plunder of the foreign lands before Enlil, assigns the fayʾ to God and the messenger]
          object: [silver and lapis lazuli of the foreign lands, what God gave back from the towns' people]
          recipient: [Enlil in Nibru, "God, the messenger, kin, orphans, the poor, the wayfarer"]
          quoted: ["kug za-gin3 kur-ra ... niĝ2-gur11 kur-ra-ke4 gu2 1 im-mi-ra ... den-lil2-ra mu-na-da-an-ku4-ku4 (381 restored)", "fa-li-llāhi wa-li-r-rasūli wa-li-dhī l-qurbā wa-l-yatāmā wa-l-masākīni wa-bni s-sabīl"]
          outcome: [the treasure enters the god's temple, it is distributed so it does not circulate among the rich only]
        note: "The spoil of the enemy belongs to the god: Šulgi moors at Nibru and enters before Enlil with the silver and lapis lazuli of the foreign lands (348-350, 375-381). 59:6-7 assigns 'what God gave back (afāʾa) to his messenger from the people of the towns' to 'God and the messenger', and through them to kin, orphans, the poor and the wayfarer, 'so that it does not circulate among the rich of you'; it was won without horse or camel (59:6). The god's share stays in the temple in Nibru; God's share in 59:7 is given out."
