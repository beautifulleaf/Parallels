  - unit: ane-etcsl-2-2-3-a-storm-gutium
    checked: [quran-80-frowned, quran-24-light-verse, quran-79-pharaoh-and-cosmos, quran-59-hashr-banu-nadir-and-fay]
    matches:
      - with: quran-80-frowned
        motif: family-members-turn-away-from-one-another
        refs: ["ETCSL 2.2.3 A:95-98"]
        with_refs: ["80:34", "80:35", "80:36"]
        relation: parallel
        record:
          agent: [the father; the mother, a man]
          action: [turns away from his own kin, flees from his own kin]
          object: ["wife, child, estate", "brother, mother, father, wife, sons"]
          time: [the day the storm destroys Urim, the day of the Blast]
          quoted: ["ad-da dam-a-ni-ta ba-da-gur dam-ĝu10 nu im-me; ama dumu-ni-ta ba-da-gur dumu-ĝu10 nu im-me", "yawma yafirru l-marʾu min akhīhi wa-ummihi wa-abīhi wa-ṣāḥibatihi wa-banīh"]
        note: "The same picture of catastrophe dissolving the family, kin named one by one: 'the father turned away from his wife saying: not my wife; the mother turned away from her child saying: not my child' (A:95-98) against 'the day a man flees from his brother, his mother and his father, his wife and his sons' (80:34-36). The Sumerian day is the historical fall of Urim; the Quranic one is the Day of Judgment, 'each of them that day has business enough' (80:37)."
  - unit: ane-etcsl-2-2-3-c-city-by-city
    checked: [quran-17-night-journey-and-israel, quran-59-hashr-banu-nadir-and-fay, quran-105-elephant, quran-11-salih]
    matches:
      - with: quran-17-night-journey-and-israel
        motif: god-sends-foreign-army-against-his-own-people
        refs: ["ETCSL 2.2.3 C:165-166"]
        with_refs: ["17:5"]
        relation: parallel
        record:
          agent: [Enlil, God]
          action: [brings a foreign people down against his land, sends fierce servants against his people]
          object: ["Elam, the enemy", "ʿibād of great might"]
          recipient: [Sumer and Urim, the Children of Israel]
          quoted: ["elam lu2-kur2-ra kur-ta im-ta-an-e3", "baʿathnā ʿalaykum ʿibādan lanā ulī baʾsin shadīd"]
          outcome: [the cities are sacked, they ravage through the dwellings]
        note: "In both the destroying army is the god's own instrument against his people: Enlil 'brought Elam, the enemy, down from the highlands' (C:165-166); 'we sent against you servants of ours of great might, and they went through the dwellings (fa-jāsū khilāla d-diyār)' (17:5). Neither names the foreign people beyond that."
