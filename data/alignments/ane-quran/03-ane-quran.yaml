  - unit: ane-etcsl-2-4-2-01-roads-and-run
    checked: [quran-2-talut-jalut, quran-79-pharaoh-and-cosmos, quran-38-solomon-horses-throne, quran-34-sheba, quran-34-david-solomon]
    matches:
      - with: quran-34-sheba
        motif: travel-in-safety-by-night-and-day
        refs: ["ETCSL 2.4.2.01 28-35"]
        with_refs: ["34:18"]
        relation: divergence
        record:
          agent: [Šulgi, God]
          action: [marks out the road stages and builds lodging houses, measures the journey and sets visible towns along it]
          instrument: [double-hour stations with gardens, towns in plain sight (qurā ẓāhira)]
          time: [travellers who arrive at night, by night and by day]
          quoted: ["danna ḫu-mu-gen6 e2 gal-la ḫe2-bi2-du3", "wa-qaddarnā fīhā s-sayra sīrū fīhā layāliya wa-ayyāman āminīn"]
          outcome: [wayfarers find haven at night as in a well-built city, they travel secure]
        note: "The same infrastructure of a safe road: Šulgi 'marked out the double-hour distances (danna), built lodging houses there', planted gardens, so that 'travellers and wayfarers who arrive at night can seek haven there' (28-35). In 34:18 God 'measured the journey (qaddarnā s-sayr)' with towns in sight of one another: 'travel in them by night and day, secure'. The king builds it to his own name; in the Quran it is God's gift, withdrawn when Saba asked for longer stages (34:19)."
      - with: quran-34-david-solomon
        motif: king-covers-a-vast-distance-between-morning-and-evening
        refs: ["ETCSL 2.4.2.01 39-41"]
        with_refs: ["34:12"]
        relation: divergence
        record:
          agent: [Šulgi, the wind subjected to Solomon]
          action: [runs Nibru to Urim and back in one day, travels a month's journey in a morning and a month's in an evening]
          instrument: [his own legs, the wind]
          time: [one day, morning and evening]
          quoted: ["nibru-ta šeg12 urim2-ma-še3 danna 1-gin7 šu ni10-ni10-da", "wa-li-sulaymāna r-rīḥa ghuduwwuhā shahrun wa-rawāḥuhā shahr"]
        note: "A king's prodigious day of travel: Šulgi, 'to prove my speed', runs from Nibru to brick-built Urim and back 'as if it were only a double-hour (danna 1-gin7)' (39-41), so that his name is never forgotten. Solomon has the wind, 'its morning course a month and its evening course a month' (34:12). The Sumerian king does it by his own strength for his fame; the Quranic king by a wind God subjected to him."
  - unit: ane-etcsl-2-4-2-01-urim-storm-return
    checked: [quran-25-signs-shadow-seas, quran-79-pharaoh-and-cosmos, quran-24-light-verse, quran-54-qamar-moon-split-and-noah]
    matches:
      - with: quran-54-qamar-moon-split-and-noah
        motif: rain-from-heaven-meets-water-from-the-earth
        refs: ["ETCSL 2.4.2.01 67"]
        with_refs: ["54:11", "54:12"]
        relation: echo
        record:
          object: [rain of heaven and water of the earth, water from heaven and springs of the earth]
          action: [mingle, meet]
          quoted: ["im an-na-ke4 a ki-ta gu2 ḫe2-em-ma-da-ab-la2", "fa-ltaqā l-māʾu ʿalā amrin qad qudir"]
          outcome: [Šulgi runs on through it unafraid, the flood drowns Noah's people]
        note: "The same image of the two waters joining: in Šulgi's storm 'the rains of heaven mingled (gu2 ... la2) with the waters of the earth' (67; one manuscript: 'competed with'); in Noah's flood God opened the gates of heaven with pouring water and made the earth gush springs, 'and the water met (fa-ltaqā l-māʾ) for a matter already decreed' (54:11-12). One is a storm on the king's road, the other the flood."
