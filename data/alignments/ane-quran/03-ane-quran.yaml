  - unit: ane-etcsl-2-1-7-b16-temple-glory-justice
    checked: [quran-4-inheritance-shares, quran-59-hashr-banu-nadir-and-fay, quran-4-creation-kinship-orphans, quran-34-david-solomon]
    matches:
      - with: quran-4-inheritance-shares
        motif: daughter-inherits-when-there-is-no-son
        refs: ["ETCSL 2.1.7 1228-1229"]
        with_refs: ["4:11"]
        relation: divergence
        record:
          agent: [Gudea, God]
          action: [makes the daughter heir in a house without a son, fixes the share of a single daughter]
          recipient: [daughter, daughter]
          number: [null, "1/2"]
          quoted: ["e2 ibila nu-tuku dumu-munus-bi i3-bi-lu-ba mi-ni-kur9", "wa-in kānat wāḥidatan fa-lahā n-niṣf"]
          outcome: [the daughter takes the estate as heir, the lone daughter takes half]
        note: "Gudea's justice: in a house with no son (ibila, heir) the daughter becomes heir (Cyl. B 17.12-13, largely restored). 4:11 also rules for the house where daughters alone survive, but gives a lone daughter a fixed half (fa-lahā n-niṣf) and two or more two-thirds, with the parents' shares beside them. A royal measure that makes her sole heir against a divine ordinance that fixes her fraction."
