    checked: [quran-79-pharaoh-and-cosmos, quran-20-moses-pharaoh-magicians, quran-15-prologue-and-heavens, quran-28-pharaohs-tower-and-end]
    matches:
      - with: quran-28-pharaohs-tower-and-end
        motif: brick-tower-rising-to-heaven
        refs: ["ETCSL 2.4.1.2 A:13", "ETCSL 2.4.1.2 A:20"]
        with_refs: ["28:38"]
        relation: divergence
        record:
          agent: [Ur-Namma, Haman at Pharaoh's order]
          action: [prepares the brick mould and makes the E-kur rise to heaven, fires clay to build a tower]
          object: [the E-kur, a ṣarḥ]
          quoted: ["giš-u3-šub-ba si am3-mi-in-sa2 ... e2-kur maḫ dur-an-ki-a-ka an-še3 mi-ni-in-mu2", "fa-awqid lī yā hāmānu ʿalā ṭ-ṭīni fa-jʿal lī ṣarḥan laʿallī aṭṭaliʿu ilā ilāhi mūsā"]
          outcome: [the god's house made to rise heavenward at the god's command, a tower to look up at Moses' God out of defiance]
        note: "A king's brickwork reaching for heaven: Ur-Namma 'prepared the brick mould' (giš-u3-šub, A:13) and 'made the lofty E-kur grow towards heaven (an-še3) in Dur-an-ki' (A:20) because Enlil told him to. Pharaoh orders 'kindle a fire for me on the clay, Haman, and make me a tower, so that I may look up to the God of Moses' (28:38): fired brick, a tower to heaven, built in defiance of God. Same building technique and aim, opposite relation to the god."
