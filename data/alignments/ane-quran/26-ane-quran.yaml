    relation: echo
    record:
      quoted:
      - ARAD-ŠU kuwapi A-NA EN-ŠU peran šarā artari
      - fa-mā lladhīna fuḍḍilū bi-rāddī rizqihim ʿalā mā malakat aymānuhum
    note: 'Q 16:71: the favoured do not hand their provision to their slaves to be equal with them - argument from the master-slave relation, as in KUB 13.4 i 21''-27''.'
  - with: quran-6-final-reckoning
    motif: kin-share-offenders-punishment
    refs:
    - CTH 264 W15:Vs._I_30'-Vs._I_38'
    with_refs:
