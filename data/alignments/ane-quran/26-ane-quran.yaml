# ANE x Quran side-by-side pass, chunk 26 (Hittite treaties, oaths and the temple instructions CTH 264). Judged blind, from the originals.
new_motifs:
  what-the-lord-gives-take:
    label: Of captives or spoil, what the lord gives you, take; what he does not give (or forbids), leave
    cluster: kingship
  fugitive-not-returned-by-divine-rule:
    label: A fugitive who comes over is not handed back, because returning him is not right under the divine rule
    cluster: law
  rumour-checked-before-acting:
    label: 'A rumour or report must be checked before anyone acts on it: referred to the ruler, or verified'
    cluster: law
  excuse-of-coercion-for-defection:
    label: The excuse that one was forced or powerless is put forward for going over to the other side
    cluster: law
  leader-recalls-escaping-without-his-men:
    label: Reproaching followers who hang back, the leader recalls how he escaped a crisis without them
    cluster: kingship
  leader-deserted-by-his-men-in-crisis:
    label: In the decisive crisis the leader's own men run off and leave him
    cluster: war
  loyalty-conditional-on-reward:
    label: A follower's loyalty depends on being rewarded; unrewarded, he turns away
    cluster: kingship
  loyalty-overrides-kin-list:
    label: 'Loyalty to the lord overrides a listed series of kin: father, mother, son, brother, kinsman'
    cluster: family
  kin-share-offenders-punishment:
    label: Whether an offender's household and kin share his punishment
    cluster: law
  who-owns-battle-booty:
    label: Who owns the booty taken in battle
    cluster: war
  human-master-and-slave-as-analogy-for-god:
    label: An argument drawn from a human master and his slaves is applied to the god
    cluster: wisdom
  divine-respite-misread:
    label: Wrongdoers take the deity's delay for indifference; the delay is not a release
    cluster: judgment
  imprecation-staking-wives-and-children:
    label: To prove the truth, the parties call down destruction or curse on the liar together with wives and children
    cluster: law
  one-who-was-dead-given-life:
    label: A living man is called a dead man whom his benefactor has brought back to life
    cluster: kingship
  reviving-a-dead-land:
    label: A dead (ruined) land or town is brought back to life
    cluster: kingship
  royal-adoption-of-endangered-youth:
    label: A royal house takes a foreign youth whose life is threatened as its son
    cluster: kingship
  sovereigns-word-cannot-be-changed:
    label: The sovereign's word cannot be turned back, cast aside, broken or changed
    cluster: kingship
  penalty-on-whoever-alters-the-text:
    label: Whoever alters the wording of a fixed text (tablet, bequest) after it is set bears the penalty
    cluster: law
  impaling-or-crucifying-opponents:
    label: Opponents of the ruler are impaled or crucified on wood
    cluster: war
  brothers-seek-to-kill-young-heir:
    label: While still a child, the favoured son is threatened with death by his brothers and ends up in a foreign land
    cluster: family
  knowledge-of-the-distant-past:
    label: Whether the events of the distant past can be known, and by whom
    cluster: wisdom
  bird-augury:
    label: Taking or reading an omen from birds is set aside
    cluster: ritual
  not-even-a-thread:
    label: 'A thread as the smallest measure: not even a thread is withheld, or wronged'
    cluster: law
  marriage-with-hostile-outsider:
    label: Marriage with a man or woman of the hostile outside group is barred or dangerous, because the spouse will lead to betrayal or ruin
    cluster: family
  rulers-secret-divulged:
    label: A secret word confided by the ruler must be kept; divulging it is a breach
    cluster: kingship
