    with_refs:
    - '58:22'
    relation: parallel
    record:
      object:
      - father, mother, brother, sister, son, in-law
      - fathers, sons, brothers, clan
      quoted:
      - A-BU-ŠU AMA-ŠU ŠEŠ-ŠU NIN-ŠU ... DUMU-ŠU LÚgaenaš
      - wa-law kānū ābāʾahum aw abnāʾahum aw ikhwānahum aw ʿashīratahum
      action:
      - seize and denounce him who speaks an evil word
      - do not love him who opposes God and his messenger
    note: 'Whoever speaks the evil word must be seized and revealed even if he is ''A-BU-ŠU AMA-ŠU ŠEŠ-ŠU NIN-ŠU ... DUMU-ŠU LÚgaenaš''. Q 58:22: no believers love ''man ḥādda llāha wa-rasūlahū wa-law kānū ābāʾahum aw abnāʾahum aw ikhwānahum aw ʿashīratahum''. Data note: the German glosses in this section are shifted by several lines against the transliteration.'
  - with: quran-6-final-reckoning
    motif: kin-share-offenders-punishment
    refs:
    - CTH 133 §10:75
    - CTH 133 §10:80-81
    - CTH 133 §11:83
    with_refs:
    - 6:164
    relation: contrast
    record:
      agent:
      - a city; a house; one man
      - every soul
      action:
      - sins
      - earns
      quoted:
      - 1 É-TUM w[ašda-] ... apāt É-ir LÚ.MEŠ-it aku; 1-EN LÚ-ma wašdāi
      - wa-lā taziru wāziratun wizra ukhrā
      outcome:
      - the house dies with its people
      - no bearer bears another's burden
    note: 'Graded collective guilt: if a city sins it is killed with its men; if one house in a city sins ''apāt É-ir LÚ.MEŠ-it aku'' (that house shall die with its people); if one man sins (1-EN LÚ-ma wašdāi), [he alone] - the last apodosis is restored. Q 6:164 ''wa-lā taksibu kullu nafsin illā ʿalayhā wa-lā taziru wāziratun wizra ukhrā''.'
