      - wa-lā taziru wāziratun wizra ukhrā
      outcome:
      - he does not die alone; wife, sons, seed, slaves, cattle destroyed with him
      - no bearer bears another's burden
    note: '''naš UL 1-aš aki MÁŠ-ŠU-ma-šši tettianpat'' (he does not die alone; his family is joined to him), and the god''s anger destroys him with wife, sons, seed, slaves, cattle, crops. Q 6:164 ''wa-lā taziru wāziratun wizra ukhrā''.'
