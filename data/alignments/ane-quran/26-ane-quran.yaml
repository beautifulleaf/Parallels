    motif: rumour-checked-before-acting
    refs:
    - CTH 67 §6:60-72
    with_refs:
    - 4:83
    relation: echo
    record:
      action:
      - writes the rumour to the king and waits
      - refer the news to the messenger and those in authority
      object:
      - a whispered rumour
      - news of security or fear
      quoted:
      - A-WA-TE.MEŠ katta piddanzi ... apūn memiyan A-NA dUTU-ŠI ... ḫatrāi ... lē nuntarnuši
      - adhāʿū bihī wa-law raddūhu ilā r-rasūli wa-ilā ulī l-amri minhum
      outcome:
      - acting rashly breaks the oath
      - they would have known it
    note: '''Because mankind is unreliable, rumours go round (A-WA-TE.MEŠ katta piddanzi)'': write that rumour to My Majesty and do not act rashly (lē nuntarnuši). Q 4:83: when news of security or fear comes ''adhāʿū bihī'', ''wa-law raddūhu ilā r-rasūli wa-ilā ulī l-amri minhum la-ʿalimahu lladhīna yastanbiṭūnahū''. Divergence: in the treaty the rumour is about the king himself.'
  - with: quran-49-hujurat-etiquette-and-brotherhood
    motif: rumour-checked-before-acting
    refs:
    - CTH 67 §6:60-72
    with_refs:
    - '49:6'
    relation: echo
    record:
      action:
      - waits for the king's answer, does not act rashly
      - verify the report
      object:
      - a whispered rumour
      - news brought by a fāsiq
      quoted:
      - lē nuntarnuši ... mān nuntarnuši=ma nu ... idālu iyaši
      - fa-tabayyanū an tuṣībū qawman bi-jahālatin
      outcome:
      - rash action is evil against the king and breaks the oath
      - you would regret what you did
    note: 'The same clause read against Q 49:6 ''in jāʾakum fāsiqun bi-nabaʾin fa-tabayyanū an tuṣībū qawman bi-jahālatin fa-tuṣbiḥū ʿalā mā faʿaltum nādimīn'': act on no report before checking; ''lē nuntarnuši'' (do not be hasty) vs ''fa-tabayyanū''.'
