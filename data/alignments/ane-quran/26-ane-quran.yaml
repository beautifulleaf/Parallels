  - with: quran-3-badr-uhud
    motif: leader-deserted-by-his-men-in-crisis
    refs:
    - CTH 123 §28:226-231
    with_refs:
    - 3:153
    relation: echo
    record:
      agent:
      - the charioteer; the chamberlain
      - the believers at Uhud
      action:
      - leap from the chariot, flee the inner chamber
      - run up the hill, turning to no one
      recipient:
      - the king
      - the messenger
      quoted:
      - LÚKARTAPPU-man=kan GIŠGIGIR-za GAM pittaizzi ... É.ŠÀ-za parā pittaizzi
      - idh tuṣʿidūna wa-lā talwūna ʿalā aḥadin wal-rasūlu yadʿūkum fī ukhrākum
    note: 'The king''s direst hour: the charioteer leaps down from the chariot, someone flees the inner chamber, not even a gate-dog left, no arrow to shoot. Q 3:153: ''idh tuṣʿidūna wa-lā talwūna ʿalā aḥadin wal-rasūlu yadʿūkum fī ukhrākum''. Hittite is a hypothetical the sworn man must prevent; Q recalls it as having happened.'
  - with: quran-9-shirkers-excuses
    motif: loyalty-conditional-on-reward
    refs:
    - CTH 123 §21:167-177
    with_refs:
    - '9:58'
    relation: echo
    record:
      agent:
      - the sworn man
      - some of the hypocrites
      quoted:
      - LUGAL-uš=wa=mu=za UL ŠID-it nu=wa kēdaš A-NA MAMIT GAM-an arḫa arḫaḫaru
      - fa-in uʿṭū minhā raḍū wa-in lam yuʿṭaw minhā idhā hum yaskhaṭūn
      outcome:
      - withdraws from the oaths
      - they are angry
    note: '''The king did not reward me (UL ŠID-it); I will withdraw from these oaths'' - forbidden. Q 9:58 on the alms: ''fa-in uʿṭū minhā raḍū wa-in lam yuʿṭaw minhā idhā hum yaskhaṭūn''.'
