  matches:
  - with: quran-60-mumtahana-abrahams-example-and-the-womens-pledge
    motif: fugitive-not-returned-by-divine-rule
    refs:
    - CTH 51.I §12:151-158
    with_refs:
    - '60:10'
    relation: parallel
    record:
      agent:
      - the king of Hatti
      - the believers
      action:
      - does not return the fugitive
      - do not return the emigrant women
      recipient:
      - Mittani
      - the unbelievers
      quoted:
      - ul iṣabbatsu ul utāršu ul parṣū ša dUTU URU Arinna
      - fa-lā tarjiʿūhunna ilā l-kuffār lā hunna ḥillun lahum ... dhālikum ḥukmu llāh
      outcome:
      - he settles in Šattiwazza's town, belonging to Hatti
      - dowries repaid; they may be married
    note: 'A one-way fugitive clause grounded in divine law: a Hittite fugitive is returned, but a Mittani fugitive in Hatti ''ul iṣabbatsu ul utāršu'' because returning is ''ul parṣū ša dUTU URU Arinna'' (not the rule of the Sun goddess). Q 60:10 ''fa-lā tarjiʿūhunna ilā l-kuffār lā hunna ḥillun lahum ... dhālikum ḥukmu llāh''. Divergence: Q repays what the other side spent (''wa-ātūhum mā anfaqū'').'
  - with: quran-2-sleeper-hundred-years
    motif: reviving-a-dead-land
    refs:
    - CTH 51.I §14:176-177
    with_refs:
    - 2:259
    relation: divergence
    record:
      agent:
      - the great king
      - God
      action:
      - will bring a dead land to life
      - brings to life after its death
      object:
      - the dead land Mittani
      - this ruined town
      quoted:
      - KUR Mittanni mīta uballassu ana maškanišu utâr
      - annā yuḥyī hādhihi llāhu baʿda mawtihā
    note: '''u anāku LUGAL.GAL ... KUR Mittanni mīta uballassu ana maškanišu utâr'' (I will make the dead land live and return it to its place). Q 2:259, before a town ''khāwiyatun ʿalā ʿurūshihā'': ''annā yuḥyī hādhihi llāhu baʿda mawtihā''. The reviver changes from the king to God, and the claim becomes a doubting question.'
