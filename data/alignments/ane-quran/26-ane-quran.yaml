  matches:
  - with: quran-16-abrogation-food-abraham-sabbath
    motif: excuse-of-coercion-for-defection
    refs:
    - CTH 123 §15:127-131
    - CTH 123 §19:154-160
    with_refs:
    - 16:106
    relation: contrast
    record:
      agent:
      - the sworn man
      - one who disbelieves after believing
      action:
      - joins the defectors
      - disbelieves
      quoted:
      - apūš=wa=mu GÉŠPU-za peḫuter; GEŠPÚ-aḫḫir=wa=mu ... nat lē DÙ-ši
      - illā man ukriha wa-qalbuhū muṭmaʾinnun bil-īmān
      outcome:
      - the excuse is not accepted; it is put under oath
      - the coerced man whose heart is firm is excepted
    note: 'Opposite rulings on the coercion excuse. Hittite: ''do not say: they brought me by force (GÉŠPU-za peḫuter) / they compelled me (GEŠPÚ-aḫḫir)'' - no excuse. Q 16:106 ''man kafara billāhi min baʿdi īmānihī illā man ukriha wa-qalbuhū muṭmaʾinnun bil-īmān'' - the coerced is exempt if his heart holds.'
  - with: quran-4-strivers-emigration
    motif: excuse-of-coercion-for-defection
    refs:
    - CTH 123 §19:154-160
    with_refs:
    - 4:97
    relation: parallel
    record:
      agent:
      - the sworn man
      - those who wronged themselves
      quoted:
      - GEŠPÚ-aḫḫir=wa=mu
      - kunnā mustaḍʿafīna fī l-arḍ
      outcome:
      - the excuse is rejected
      - 'the excuse is rejected: alam takun arḍu llāhi wāsiʿatan'
    note: 'Here the rulings agree: the excuse ''they compelled me (GEŠPÚ-aḫḫir=wa=mu)'' for siding with defectors is refused (''nat lē DÙ-ši''); in Q 4:97 the angels refuse ''kunnā mustaḍʿafīna fī l-arḍ'' with ''a-lam takun arḍu llāhi wāsiʿatan fa-tuhājirū fīhā''.'
  - with: quran-9-cave-and-call
    motif: leader-recalls-escaping-without-his-men
    refs:
    - CTH 123 §10:71-76
    with_refs:
    - '9:38'
    - '9:40'
    relation: parallel
    record:
      agent:
      - the king
      - God
      action:
      - reproaches the absent follower
      - reproaches those who will not go forth
      quoted:
      - UL=mu=za GAM-an ešta; URU Niḫirija=za=kan UL 1-aš arḫa unnaḫḫun?
      - illā tanṣurūhu fa-qad naṣarahu llāhu ... thāniya thnayni idh humā fī l-ghār
      number:
      - 1
      - 2
      outcome:
      - he escaped alone
      - God helped him, second of two in the cave
    note: 'The king to the sworn man: when things became critical ''UL=mu=za GAM-an ešta'' (you were not with me) - ''did I not escape alone (1-aš) from Niḫriya, stay behind alone at Alatarma?'' Q 9:38-40, rebuking those who sink to the ground: ''illā tanṣurūhu fa-qad naṣarahu llāhu idh akhrajahu lladhīna kafarū thāniya thnayni''. One escaped alone; the other with one companion, helped by God.'
- unit: ane-cth-123-21-guardians-of-king
  checked:
  - quran-9-shirkers-excuses
