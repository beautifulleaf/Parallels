    with_refs:
    - '60:10'
    relation: parallel
    record:
      agent:
      - the king of Hatti
      - the believers
      action:
      - does not give the fugitive back
      - do not return the emigrant women
      quoted:
      - EGIR-pa UL piḫḫi ... MUNABTU EGIR-pa piyanna UL āra
      - fa-lā tarjiʿūhunna ilā l-kuffār lā hunna ḥillun lahum
      outcome:
