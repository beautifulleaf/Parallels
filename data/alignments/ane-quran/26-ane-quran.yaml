  matches:
  - with: quran-30-fitra
    motif: human-master-and-slave-as-analogy-for-god
    refs:
    - CTH 264 W15:Vs._I_21'-Vs._I_32'
    with_refs:
    - '30:28'
    relation: echo
    record:
      agent:
      - the speaker of the instruction
      - God
      action:
      - reasons from master and slave to the gods
      - strikes a parable from yourselves
      quoted:
      - UN-aš DINGIR.MEŠ-ašša ZI-anza tamaiš kuiški UL ... ARAD-ŠU ... A-NA EN-ŠU
      - ḍaraba lakum mathalan min anfusikum hal lakum min mā malakat aymānukum min shurakāʾ
      outcome:
      - the god punishes as an angry master does
      - God has no partners among his servants
    note: '''Is the mind of man and of the gods any different? (UN-aš DINGIR.MEŠ-ašša ZI-anza tamaiš kuiški UL)'' - a servant stands washed before his master; an angered master kills or maims him. Q 30:28 ''ḍaraba lakum mathalan min anfusikum hal lakum min mā malakat aymānukum min shurakāʾa fī mā razaqnākum''. Both argue from human mastership to the divine; the conclusions differ (fear the god''s anger / no partners).'
  - with: quran-16-parables-and-justice
    motif: human-master-and-slave-as-analogy-for-god
    refs:
    - CTH 264 W15:Vs._I_21'-Vs._I_27'
    with_refs:
