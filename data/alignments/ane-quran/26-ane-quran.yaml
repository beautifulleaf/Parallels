      - what they spent is repaid
    note: '''EGIR-pa UL piḫḫi; IŠTU KUR Ḫatti LÚMUNABTU EGIR-pa piyanna UL āra'' - to give back a fugitive is not right (āra, the divinely sanctioned norm); but a farmer or craftsman who fled without working is seized and returned. Q 60:10: believing emigrant women ''lā tarjiʿūhunna'', ''lā hunna ḥillun lahum''; the exception is financial (repay the dowry), not a class of persons returned.'
