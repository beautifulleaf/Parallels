- unit: ane-ipuwer-12-reproach-of-creator
  checked:
  - quran-2-throne-verse
  - quran-21-cosmic-signs-and-scales
  - quran-71-noah
  - quran-25-destroyed-peoples
  matches:
  - with: quran-2-throne-verse
    motif: whether-the-deity-sleeps
    refs:
    - Ipuwer 12:5/2
    - Ipuwer 12:5/3
    - Ipuwer 12:5/4
    - Ipuwer 12:6
    with_refs:
    - 2:255
    relation: divergence
    record:
      agent:
      - the creator, shepherd of all
      - God, al-ḥayy al-qayyūm
      action:
      - is perhaps asleep
      - is not seized by slumber or sleep
      quoted:
      - jn jw=f trj sḏr; n(n) jꜥš-n-ḥꜣ.t m wnw.t=sn
      - lā taʾkhudhuhu sinatun wa-lā nawm
      outcome:
      - the sage cannot find him
      - he knows what is before and behind them
    note: 'Ipuwer reproaches the creator: ''there is no pilot on duty; where is he today? is he perhaps asleep (jn jw=f trj sḏr)? ... I cannot find you'' (12:5/2-12:6). Q 2:255 al-ḥayyu l-qayyūm lā taʾkhudhuhu sinatun wa-lā nawm. The same question about the high god, answered in opposite ways: the sage suspects he sleeps, the Throne Verse denies even slumber.'
  - with: quran-21-cosmic-signs-and-scales
    motif: creation-by-separation
    refs:
    - Ipuwer 12:11
    with_refs:
    - '21:30'
    relation: parallel
    record:
      agent:
      - the Lord of Everything
      - God (we)
      action:
      - separated sky from earth
      - split heaven and earth apart
      object:
      - sky and earth
      - the heavens and the earth
      quoted:
      - nb-tm jri̯.n=f jwd p.t r zꜣtw
      - kānatā ratqan fa-fataqnāhumā
    note: nb-tm jri̯.n=f jwd p.t r zꜣtw 'the Lord of Everything made the separation of the sky from the earth' (12:11); Q 21:30 anna s-samāwāti wa-l-arḍa kānatā ratqan fa-fataqnāhumā. Creation as the parting of sky from earth, by the 'Lord of Everything' / God.
  - with: quran-71-noah
    motif: creator-destroys-people-and-their-offspring
    refs:
    - Ipuwer 12:2/2
    - Ipuwer 12:2/3
    with_refs:
    - '71:26'
    - '71:27'
    relation: divergence
    record:
      agent:
      - the creator (wished by the sage)
      - God (asked by Noah)
      action:
      - would have destroyed the herd and their heirs
      - leave not one of the unbelievers on earth
      object:
      - the first generation and their heirs
      - the unbelievers and their offspring
      quoted:
      - ḥꜣ ꜥd=f bjꜣ.t=sn m ẖ.t tp.t ... ski̯=f ꜥw.t jr.j jwꜥ.w=sn
      - lā tadhar ʿalā l-arḍi mina l-kāfirīna dayyārā ... wa-lā yalidū illā fājiran kaffārā
      outcome:
      - 'not done: the herd perishes in strife'
      - the flood
    note: 'Ipuwer: ''if only he had recognised their character (bjꜣ.t) in the first generation, he would have stretched out his arm and destroyed the herd and their heirs'' (12:2/2-3). Noah 71:26-27: ''leave not one dwelling on the earth ... if you leave them they will beget only the wicked and ungrateful''. The same reasoning from character to the destruction of a people with its offspring; in Ipuwer a reproach that the creator failed to do it, in the Quran a prophet''s prayer that is granted.'
