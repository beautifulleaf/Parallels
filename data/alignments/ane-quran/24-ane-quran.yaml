    note: sgrj rm.w 'quiet the weeper', m ꜣjr ḫꜣr.t 'do not oppress the widow' (5_1-5_1/2); Q 93:9-10 fa-ammā l-yatīma fa-lā taqhar wa-ammā s-sāʾila fa-lā tanhar. Paired prohibitions on oppressing the weak, addressed to the one in power; the widow and weeper become the orphan and the beggar.
