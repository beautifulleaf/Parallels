      quoted:
      - smꜣmw.tw z r-gs sn=f; jw=f ḥr hꜣi̯ bhꜣ ... mki̯.t ḥꜥ.w=f
      - yawma yafirru l-marʾu min akhīhi; li-kulli mriʾin minhum yawmaʾidhin shaʾnun yughnīh
      outcome:
      - he protects only himself
      - each has concern enough of his own
    note: 'Ipuwer: ''a man is slain at his brother''s side; he flees ... to protect himself'' (9:3/2-4); Q 80:34-37 yawma yafirru l-marʾu min akhīh ... li-kulli mriʾin minhum yawmaʾidhin shaʾnun yughnīh. The same image of flight from one''s own brother in self-concern; Ipuwer sets it in civil chaos, the Quran on the Day of Judgment, and adds mother, father, wife and sons.'
