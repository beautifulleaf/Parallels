      - kam min fiʾatin qalīlatin ghalabat fiʾatan kathīratan bi-idhni llāh
    note: 'ušatbûniššumma Kuraš šar Anzan wardušu ṣehru ina ummānīšu īṣūti Umman-manda rapšāti usappih ''they (the gods) raised against him Cyrus king of Anšan, his young servant; with his few troops he scattered the vast Umman-manda'' ~ kam min fiʾatin qalīlatin ghalabat fiʾatan kathīratan bi-idhni llāh (2:249), fa-hazamūhum bi-idhni llāhi wa-qatala dāwūdu jālūt (2:251). On both sides a few (īṣūti / qalīla) beat a great host (rapšāti / kathīra) by divine will, and a young man wins: Cyrus is the god''s ''young servant'' who takes the enemy king captive, while David kills Goliath and receives kingship.'
