    note: 'libbi abiya ša lā ilāni uzennû ittiya šaplānu libbašu rēma rašīšuma ''they turned my father''s heart against me, against the gods'' will, but deep down his heart had pity on me'' ~ uqtulū yūsufa ... yakhlu lakum wajhu abīkum ''so that your father''s face will be yours alone'' (12:9). The brothers aim at the father''s favour on both sides; in Assur they manage to estrange him, though he still pities the son in secret, while in the Quran they plan to win it for themselves by getting rid of Joseph. Hiding also changes hands: the gods set Esarhaddon ''in a secret place'' (ašar niṣirti, i:39) to protect him, while the brothers throw Joseph fī ghayābati l-jubb (12:15).'
