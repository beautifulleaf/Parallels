- unit: ane-nabonidus-28-ii-iii-ebabbar-of-sippar
  checked:
  - quran-79-pharaoh-and-cosmos
  - quran-2-talut-jalut
  - quran-43-zukhruf-pharaoh-claims
  - quran-22-abraham-house-pilgrimage
  matches:
  - with: quran-22-abraham-house-pilgrimage
    motif: god-shows-the-builder-the-site-of-his-house
    refs:
    - Nabonidus 28 ii:56-61
    with_refs:
    - '22:26'
    - '22:29'
    relation: parallel
    record:
      agent:
      - Šamaš
      - God
      action:
      - shows the builder the site of his house
      - assigns the builder the site of his house
      recipient:
      - Nabonidus
      - Abraham
      object:
      - the ancient foundation of Ebabbar, unseen for 3,200 years
      - the place of the House, later the Ancient House (al-bayt al-ʿatīq)
      quoted:
      - Šamaš ... Ebabbar bīt šubat ṭūb libbišu ukallimanni yâši
      - wa-idh bawwaʾnā li-ibrāhīma makāna l-bayt
    note: temmēnšu labīri ubaʾʾīma ... ša 3,200 šanāti manāma šarru ālik mahriya lā īmuru Šamaš ... Ebabbar ... ukallimanni yâši 'I sought its old foundation ... which in 3,200 years no king before me had seen; Šamaš showed it to me' ~ wa-idh bawwaʾnā li-ibrāhīma makāna l-bayti an lā tushrik bī shayʾan wa-ṭahhir baytiya (22:26), the house called al-bayt al-ʿatīq (22:29). The deity shows or assigns to the builder the site of his own house. bawwaʾa means to settle someone in a place or assign it to him, not literally 'show', and the site in Nabonidus is a buried foundation; the note keeps that difference.
