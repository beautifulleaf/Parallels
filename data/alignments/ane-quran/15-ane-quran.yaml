# ANE x Quran side-by-side pass, chunk 15 (SAA 20 Assyrian rituals and god-lists, Cyrus Cylinder, Sennacherib 22, Esarhaddon 1, 104, 105, Nabonidus 3, 28, 47, 2001). Judged blind, from the originals.
new_motifs:
  circuit-round-the-god-s-house:
    label: The god's house is gone round (circumambulated) as a rite
    cluster: ritual
  name-pronounced-over-the-sacrifice:
    label: When the sacrifice is made, the name of the deity it is offered to is pronounced (šuma zakāru / dhikr ism)
    cluster: ritual
  names-invoked-morning-and-evening:
    label: The divine name(s) are to be pronounced at morning and at evening
    cluster: liturgy
  place-name-yathrib:
    label: The Arabian oasis Yathrib (Akkadian Iatribu) is named
    cluster: geography
  woman-rules-an-arabian-people:
    label: A woman rules an Arabian people as queen
    cluster: kingship
  dream-of-star-and-moon:
    label: 'A future ruler dreams of a star (stars) and the moon in the sky, turned toward him, and tells the dream to an elder: what is seen and who is told [neutral]'
    cluster: kingship
  jealous-brothers-plot-against-the-favoured-son:
    label: The elder brothers, jealous of the son their father favours, plot evil against him
    cluster: patriarchs
  brothers-and-the-father-s-heart:
    label: What the jealous brothers do, or plan, with their father's favour toward the chosen son [neutral]
    cluster: patriarchs
  reach-from-sunrise-to-sunset:
    label: A god-empowered king goes, or rules, from the place of the sun's rising to the place of its setting
    cluster: kingship
  few-troops-defeat-a-vast-army:
    label: By the deity's will a small force defeats a vast army
    cluster: war
  multitude-rising-like-locusts:
    label: A multitude rising or pouring out is likened to a swarm of locusts
    cluster: parable
  death-and-its-fixed-day:
    label: Whether a man can die on a day other than his fixed one, and by whose command [neutral]
    cluster: theology
  divine-command-not-said-twice:
    label: 'The high god''s command is spoken once only: not twice, not turned back'
    cluster: theology
  god-shows-the-builder-the-site-of-his-house:
    label: The deity shows or assigns to the builder the site (old foundation) of the deity's house
    cluster: cult
  god-raises-the-devotee-s-name:
    label: The deity raises up the devotee and gives him or her a lasting good name
    cluster: theology
