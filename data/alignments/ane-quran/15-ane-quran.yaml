    motif: name-pronounced-over-the-sacrifice
    refs:
    - SAA 20 040 o.v:14-16
    - SAA 20 040 o.v:21-23
    with_refs:
    - '22:34'
    - '22:36'
    - '22:28'
    relation: echo
    record:
      agent:
      - the officiant
      - every community
      action:
      - pronounces the name over the sacrifice
      - pronounces the name over the sacrifice
      object:
      - sacrifices before Šamaš and before Sîn
      - livestock (bahīmat al-anʿām); the budn camels
      name:
      - the gods listed (Šamaš, Ea, Bunene ...; Sîn, Nikkal ...)
      - Allāh
      quoted:
      - kī nīqī ina pān Šamaš naqûni šumēšunu tazakkar
      - li-yadhkurū sma llāhi ʿalā mā razaqahum min bahīmati l-anʿām; fa-dhkurū sma llāhi ʿalayhā ṣawāffa
    note: 'kī nīqī ina pān Šamaš (Sîn) ... šumēšunu tazakkar ''when sacrifices are made before Šamaš (Sîn), you pronounce their names'' ~ li-yadhkurū sma llāhi ʿalā mā razaqahum (22:34), fa-dhkurū sma llāhi ʿalayhā (22:36). The phrase is the same on both sides: šuma zakāru and dhakara sma, ''to pronounce the name'', said over the offered animals. The names differ: a list of gods, against the one name of God (22:34 fa-ilāhukum ilāhun wāḥid).'
