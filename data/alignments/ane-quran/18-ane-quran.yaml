      says ''my Lord has honoured me (akramani)'', and when He restricts his provision ''my Lord has abased me (ahānani)'', answered by kallā. The servant reading honour and abasement as his lord''s verdict
      on him, in the paired terms heavy/light, honour/humiliation.'
