  - quran-7-moses-pharaoh
  - quran-49-hujurat-etiquette-and-brotherhood
  matches:
  - with: quran-49-hujurat-etiquette-and-brotherhood
    motif: slander-as-eating-the-victim
    refs:
    - EA 160 r:30-32
    with_refs:
    - '49:12'
    relation: echo
    record:
      agent:
      - false men
      - one of you
      action:
      - eat the pieces of the writer
      - eat the flesh of his dead brother
      object:
      - karṣīya (my pieces)
      - laḥma akhīhi maytan
      quoted:
      - awīlū sarrūti ša ikkalūni karṣīya ana pāni bēlīya lā tešemme
      - wa-lā yaghtab baʿḍukum baʿḍan a-yuḥibbu aḥadukum an yaʾkula laḥma akhīhi maytan
      outcome:
      - do not listen to them
      - you would loathe it
    note: 'Aziru: ''do not listen to the false men who eat my pieces (ikkalū karṣīya) before my lord'', akālu karṣī being the Akkadian idiom for slander. 49:12: ''do not backbite one another: would any
      of you like to eat the flesh of his dead brother?''. The same image of slander as eating the absent victim.'
