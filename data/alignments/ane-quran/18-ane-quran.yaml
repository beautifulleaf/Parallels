# ANE x Quran side-by-side pass, chunk 18 (Amarna letters). Judged blind, from the originals.
new_motifs:
  ant-struck-or-crushed-by-the-powerful:
    label: Ants (namlu / naml) struck or crushed by a stronger man or army, and how they respond
    cluster: animals
  no-escape-by-heaven-or-earth:
    label: Going up to heaven or down into the earth does not take one out of the sovereign's power
    cluster: kingship
  raised-as-a-child-at-pharaohs-court:
    label: As a child he was brought up in Egypt at Pharaoh's court and stayed there
    cluster: kingship
  slander-as-eating-the-victim:
    label: Slandering or backbiting someone is called eating him (his pieces, his flesh)
    cluster: wisdom
  egyptian-king-as-god-of-his-subjects:
    label: The king of Egypt is (called) the god or lord of those under him
    cluster: kingship
  lord-honours-or-abases-his-servant:
    label: A servant says his lord has honoured him or made him light (abased him)
    cluster: kingship
  woman-and-ploughed-field-likened:
    label: A woman and a ploughed field are likened to each other
    cluster: family
  oath-by-a-persons-life:
    label: An oath sworn by the life of a person ('as X lives', 'by your life')
    cluster: law
  king-as-giver-of-life:
    label: A king is asked to give life, or claims to give life
    cluster: kingship
  who-holds-sunrise-and-sunset:
    label: Who rules or commands the rising and the setting of the sun, in speech about a king
    cluster: kingship
