  - quran-10-moses-pharaoh
  - quran-26-moses-and-pharaoh
  matches:
  - with: quran-26-moses-and-pharaoh
    motif: raised-as-a-child-at-pharaohs-court
    refs:
    - EA 296 r:25-29
    with_refs:
    - '26:18'
    relation: parallel
    record:
      agent:
      - Yaḫtiru
      - Mūsā
      action:
      - was brought into Egypt as a child and served the king
      - was raised among Pharaoh's people as a child and stayed years
      place:
      - Egypt; the king's gate
      - among us (Pharaoh's house)
      time:
      - when I was small
      - as a child; years of your life
      quoted:
      - inūma ṣeḫru anāku šūribanni ana māt Miṣri u urradti šarra ... izzizti ina abulli šarri
      - a-lam nurabbika fīnā walīdan wa-labithta fīnā min ʿumurika sinīna
      outcome:
      - he pleads it as proof of loyalty
      - Pharaoh throws it at Moses as a favour owed
    note: 'A Canaanite ruler reminds Pharaoh: ''when I was small he brought me into Egypt, and I served the king my lord and stood at the king''s gate''. In 26:18 Pharaoh reminds Moses: ''did we not raise
      you among us as a child, and you stayed among us years of your life?''. The same upbringing at Pharaoh''s court, cited from opposite sides: by the ward as a claim on the king, by the king as a claim
      on the ward (26:22 tilka niʿmatun tamunnuhā ʿalayya).'
