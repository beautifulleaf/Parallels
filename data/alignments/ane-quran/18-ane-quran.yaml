- unit: ane-ea-369-pharaoh-to-milkilu
  checked:
  - quran-3-sovereignty
  - quran-2-talut-jalut
  - quran-27-solomon-ants-hoopoe-sheba
  - quran-2-abraham-king
  - quran-26-moses-and-pharaoh
  matches:
  - with: quran-2-abraham-king
    motif: who-holds-sunrise-and-sunset
    refs:
    - EA 369 r:28-32
    with_refs:
    - 2:258
    relation: divergence
    record:
      agent:
      - Amun
      - Allāh
      action:
      - has given the king the sunrise and the sunset
      - brings the sun from the east
      recipient:
      - the king
      - null
      place:
      - the rising and the setting of the sun
      - the east and the west
      quoted:
      - yittadin Amānu māta elīta māta šaplīta ṣīt šamši erēb šamši ina šupāl 2 šēpī šarri
      - fa-inna llāha yaʾtī bi-sh-shamsi mina l-mashriqi fa-ʾti bihā mina l-maghribi
      outcome:
      - sunrise and sunset lie under the king's feet
      - the king is confounded (fa-buhita)
    note: 'The king of Egypt writes that ''Amun has put the upper land and the lower land, the rising of the sun and the setting of the sun, under the two feet of the king''. In 2:258 Ibrāhīm silences a
      king whom God had given kingship: ''God brings the sun from the east; so bring it from the west'', and the king is confounded. In EA the god gives the sun''s rising and setting to the king; in the
      Quran the king is challenged to command them and cannot.'
  - with: quran-26-moses-and-pharaoh
    motif: who-holds-sunrise-and-sunset
    refs:
    - EA 369 r:28-32
    with_refs:
    - '26:28'
    relation: divergence
    record:
      agent:
      - Amun
      - Mūsā
      action:
      - has given Pharaoh the sunrise and the sunset
      - names the Lord of the east and the west to Pharaoh
      recipient:
      - Pharaoh
      - Pharaoh
      place:
      - the rising and the setting of the sun
      - the east and the west
      quoted:
      - ṣīt šamši erēb šamši ina šupāl 2 šēpī šarri
      - rabbu l-mashriqi wa-l-maghribi wa-mā baynahumā
      outcome:
      - under the king's feet
      - Pharaoh calls Moses mad and threatens prison
    note: 'Pharaoh''s own letter: Amun has placed ''the rising of the sun and the setting of the sun under the two feet of the king''. Before Pharaoh, Moses names his God ''Lord of the east and the west
      and what is between them'' (26:28), and Pharaoh answers with 26:29 ''if you take a god other than me''. The sunrise and sunset that Pharaoh''s god gives him are claimed for the Lord of the worlds
      in his face.'
