    with_refs:
    - '55:33'
    - '55:41'
    relation: echo
    record:
      agent:
      - we (Tagi and his people)
      - jinn and humans
      action:
      - go up to heaven or go down into the earth
      - pass out through the regions of the heavens and the earth
      place:
      - heaven and earth
      - the heavens and the earth
      quoted:
      - šumma nitelli ana šamê šumma nurad ina erṣeti u qaqqadunu ina qātēka
      - in istaṭaʿtum an tanfudhū min aqṭāri s-samāwāti wa-l-arḍi fa-nfudhū lā tanfudhūna illā bi-sulṭān; yuʾkhadhu bi-n-nawāṣī
      outcome:
      - our head is in your hand
      - you cannot pass except by authority; seized by the forelocks
    note: 'EA 264: ''if we go up to heaven (šamê, glossed šmym), if we go down into the earth, our head (glossed rušunu) is in your hand'', said to Pharaoh. 55:33: ''if you can pass through the regions
      of the heavens and the earth, then pass: you will not pass except with authority (sulṭān)'', and 55:41 the guilty ''are seized by the forelocks and the feet''. Heaven and earth as the two ways out,
      both closed, and the head held by the ruler.'
