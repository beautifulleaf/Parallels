- unit: ane-ea-180-fetch-me-chariots
  checked:
  - quran-43-zukhruf-pharaoh-claims
  - quran-10-moses-pharaoh
  - quran-26-moses-and-pharaoh
  matches:
  - with: quran-26-moses-and-pharaoh
    motif: egyptian-king-as-god-of-his-subjects
    refs:
    - EA 180 o:2'
    - EA 180 o:5'
    - EA 180 o:7'
    with_refs:
    - '26:29'
    relation: echo
    record:
      agent:
      - a vassal
      - Firʿawn
      action:
      - calls the king 'my god'
      - forbids Moses to take a god other than himself
      recipient:
      - the king of Egypt
      - Mūsā
      name:
      - šarru bēlīya ilīya šamšīya
      - ilāhan ghayrī
      quoted:
      - šarru bēlīya ilīya šamšīya
      - la-ini ttakhadhta ilāhan ghayrī la-ajʿalannaka mina l-masjūnīn
      outcome:
      - the vassal asks for chariots
      - Moses is threatened with prison
    note: 'In EA 180 nearly every line repeats ''the king my lord, my god (DINGIR-ia), my Sun''. In 26:29 Pharaoh tells Moses ''if you take a god other than me (ilāhan ghayrī), I will make you one of the
      imprisoned''. The king of Egypt as his subject''s god: an epithet the vassal offers in EA, a claim the Quran''s Pharaoh enforces.'
