- unit: ane-ea-252-labaya-ant
  checked:
  - quran-27-solomon-ants-hoopoe-sheba
  - quran-68-qalam-the-pen-and-the-slanderer
  - quran-69-haqqa-books-in-right-and-left-hands
  - quran-3-sovereignty
  matches:
  - with: quran-27-solomon-ants-hoopoe-sheba
    motif: ant-struck-or-crushed-by-the-powerful
    refs:
    - EA 252 b.e:16-r:19
    with_refs:
    - '27:18'
    relation: divergence
    record:
      agent:
      - ants
      - an ant
      action:
      - bite the hand of the man who strikes them
      - tells the ants to enter their dwellings
      object:
      - namlu (ants)
      - an-naml (the ants)
      recipient:
      - the man who strikes them
      - Sulaymān and his armies
      quoted:
      - kī namlu tumḫaṣu lā tikapilu u tanšuku qāti awīli ša yimaḫḫaššu
      - udkhulū masākinakum lā yaḥṭimannakum Sulaymānu wa-junūduhu
      outcome:
      - the ant fights back
      - the ants withdraw so as not to be crushed
    note: 'The same Semitic ant word on both sides: Labʾaya''s proverb uses namlu (WS nml) and the Quran an-naml / namla. In EA 252 struck ants ''do not curl up but bite the hand of the man who strikes
      them'' (said to Pharaoh, to excuse resistance); in 27:18 an ant warns the ants to go into their dwellings ''lest Sulaymān and his armies crush you (lā yaḥṭimannakum) unawares''. Ants threatened by
      a king''s power: resistance against withdrawal.'
