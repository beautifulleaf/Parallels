- unit: ane-gilg-mb-priv1-dreams-recounted
  checked: [quran-7-single-soul-idols, quran-71-noah, quran-39-pure-religion, quran-12-joseph-full]
  matches:
  - with: quran-12-joseph-full
    motif: dream-heavenly-bodies-bow
    refs: ['Gilg MB Priv1:6', 'Gilg MB Priv1:7', 'Gilg MB Priv1:8', 'Gilg MB Priv1:9', 'Gilg MB Priv1:16', 'Gilg MB Priv1:22', 'Gilg MB Priv1:23']
    with_refs: ['12:4', '12:5', '12:6']
    relation: parallel
    record:
      agent: [Gilgameš, Joseph]
      recipient: [his mother, his father]
      action: [tells a night dream to his parent, tells a dream to his parent]
      object: [the stars of the sky and a sky-rock fallen from them, 'eleven stars, the sun and the moon']
      number: [null, 11]
      quoted: [ītammâ ana ummīšu ibbīšū-ma kakkabū šamāʾī kiṣru ša āni imquta ana ṣērīya ... eṭlūtu unaššaqū šâtu, yā abati innī raʾaytu aḥada ʿashara kawkaban wa-sh-shamsa wa-l-qamara raʾaytuhum lī sājidīn]
      outcome: [the mother reads it as a mighty companion who will come, the father foretells that God will choose him and warns him of his brothers]
    note: 'A son reports to his parent a night dream of the stars of heaven (kakkabū šamāʾī; kawkab), with homage in it, and the parent interprets: Ninsun ''who knows everything'' (mūdât kalāma) and Jacob, who sees in it God''s choosing (yajtabīka rabbuka) and the teaching of interpretation. Changed: the homage. In Gilgameš the young men of the land kiss the feet of the fallen star-rock (eṭlūtum unaššaqū šēpīšu), which stands for the coming friend; in 12:4 the stars, sun and moon prostrate to the dreamer himself (lī sājidīn), fulfilled when his family falls down before him (12:100). The meaning: a companion to be loved like a wife, against a destiny to be kept from jealous brothers.'
