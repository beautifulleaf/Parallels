# ANE x Quran side-by-side pass, chunk 10 (Etana SB II-III, Gilgames MB, NA, OB and SB I-IX). Judged blind, from the originals.
new_motifs:
  childless-man-prays-for-heir:
    label: A childless man prays to his god for an heir, recalling his past devotion
    cluster: family
  word-from-god-in-the-pit:
    label: One cast into a pit receives a word from God there, and a man sent by chance or by God draws him out
    cluster: joseph
  foundling-adopted-as-son:
    label: A foundling not born of her is taken in and adopted as a son by a royal or divine woman
    cluster: infancy
  hidden-knowledge-of-the-flood-age:
    label: Knowledge of the flood age, hidden from people, is brought to them
    cluster: flood
  hero-reaches-the-sunrise:
    label: A far-travelling hero reaches the place where the sun rises
    cluster: kingship
  city-whose-like-was-never-made:
    label: An ancient city or its wall is one whose like was never made
    cluster: kingship
  death-and-its-appointed-term:
    label: Whether people can die before their fixed, written term
    cluster: death
  deeds-blown-away-as-wind:
    label: Human deeds are nothing but wind, or are blown away by the wind
    cluster: wisdom
  mortal-climbs-through-gate-of-heaven:
    label: A mortal climbs into the sky through a gate of heaven
    cluster: creation
reviewed:
- unit: ane-etana-sb-2-serpent-revenge
  checked: [quran-12-joseph-full, quran-71-noah, quran-11-noah, quran-17-iblis-and-adam]
  matches:
  - with: quran-12-joseph-full
    motif: word-from-god-in-the-pit
    refs: ['Etana SB II:120', 'Etana SB II:123-132']
    with_refs: ['12:15', '12:19']
    relation: divergence
    record:
      agent: [the serpent, Joseph's brothers]
      object: [the eagle, Joseph]
      action: [casts him into a pit, cast him into the depths of the well]
      quoted: [iddīšu ana šuttati ... alik amēlu ša ašapparakku qātka liṣbat, wa-ajmaʿū an yajʿalūhu fī ghayābati l-jubbi wa-awḥaynā ilayhi la-tunabbiʾannahum bi-amrihim hādhā]
      outcome: [a man Šamaš will send takes his hand, a caravan's water-drawer lets down his bucket and draws him out]
    note: 'The one cast into the pit (šuttatu; ghayābat al-jubb) is spoken to by God there, and a passer-by is the means of rescue: Šamaš ''a man I will send you will take your hand'' (alik amēlu ša ašapparakku qātka liṣbat), and Etana is sent to the pit (II:144-152); 12:15 awḥaynā ilayhi, then 12:19 a caravan''s wārid lets down his bucket. Changed: the eagle is guilty and the god''s word is a rebuke (''you are wicked ... were you not under oath? I will not come near you'', lemnētā-ma ... tamâtā-ma lā asanniqakka), while Joseph is innocent and the word is a promise that he will tell his brothers of their deed.'
- unit: ane-etana-sb-2-etana-prays
  checked: [quran-3-imran-mary-zechariah, quran-21-prophets-answered, quran-19-zechariah-and-john, quran-51-dhariyat-abrahams-guests-and-the-peoples]
  matches:
  - with: quran-19-zechariah-and-john
    motif: childless-man-prays-for-heir
    refs: ['Etana SB II:133-142']
    with_refs: ['19:3', '19:4', '19:5', '19:6']
    relation: parallel
    record:
      agent: [Etana, Zechariah]
      recipient: [Šamaš, his Lord]
      action: [prays for an heir, prays for an heir]
      object: [the plant of birth and an heir (šumu), an heir (walī)]
      quoted: [ilī ukabbit eṭemmī aplah ... idnam-ma šamma ša alādi ... piltī usuh-ma šuma šuknanni, wa-lam akun bi-duʿāʾika rabbi shaqiyyan ... fa-hab lī min ladunka waliyyan yarithunī]
    note: 'A childless man asks his god for an heir and grounds the plea in his past relation to the god: Etana in his sacrifices (''you have dined on my fattest sheep ... I have honoured the gods''), Zechariah in having never been disappointed in prayer (lam akun bi-duʿāʾika rabbi shaqiyyan). The request: ''give me'' (idnam; hab lī). Etana''s ''remove my disgrace, grant me a name'' (šumu, heir) against Zechariah''s fear for his kinsmen (mawālī) after him. Etana asks for a magic plant; Zechariah for the child directly, and his wife''s barrenness is stated (ʿāqir), where Etana''s wife is not mentioned here.'
- unit: ane-etana-sb-3-first-ascent
  checked: [quran-27-solomon-ants-hoopoe-sheba, quran-67-mulk-earth-birds-and-water, quran-13-signs-of-creation, quran-35-originator]
  matches:
  - with: quran-27-solomon-ants-hoopoe-sheba
    motif: solomon-taught-speech-of-birds
    refs: ['Etana SB III:3-8']
    with_refs: ['27:16', '27:22']
    relation: parallel
    record:
      agent: [Šamaš, God]
      recipient: [Etana, Solomon]
      action: [grants a man the speech of birds, teaches a man the speech of birds]
      quoted: [atmī iṣṣūrī ... ina pī šamaš, ʿullimnā manṭiqa ṭ-ṭayr]
      outcome: [the man and the eagle converse, the king and the hoopoe converse]
    note: A man is given the 'speech of birds' (atmī iṣṣūrī, III:3 and III:8; manṭiq al-ṭayr) by divine gift, 'at the command of Šamaš' / ʿullimnā 'we have been taught', and then holds a conversation with one bird (the eagle; the hoopoe, 27:20-28). III:3-6 is broken; the phrase atmī iṣṣūrī itself is preserved twice. Etana is a petitioner who needs the bird's help; Solomon is a king inspecting his birds.
