- unit: ane-gilg-mb-ug1-prologue
  checked: [quran-26-noah, quran-23-noah, quran-11-noah, quran-18-dhul-qarnayn]
  matches:
  - with: quran-11-noah
    motif: hidden-knowledge-of-the-flood-age
    refs: ['Gilg MB Ug1:7', 'Gilg MB Ug1:9']
    with_refs: ['11:49']
    relation: divergence
    record:
      agent: [Gilgameš, God]
      action: [brings back a report from before the Deluge, reveals the tidings of the flood]
      instrument: [his own far journey to the flood hero, revelation (waḥy)]
      recipient: ['the land, on a stele of his labours', the Prophet and his people]
      quoted: [ālik harrān uttur-napušti rūqti ... ubla ṭēma ša lām abūbi, tilka min anbāʾi l-ghaybi nūḥīhā ilayka mā kunta taʿlamuhā anta wa-lā qawmuka min qabli hādhā]
    note: 'The flood story is framed as hidden knowledge brought to people who did not have it: the hero ''saw the secret and uncovered the hidden, brought back a report (ṭēmu) from before the Deluge''; 11:49, closing Noah''s story, ''these are tidings of the unseen (anbāʾ al-ghayb) that we reveal to you; you did not know them, nor your people, before this''. Changed: who brings it and how. Gilgameš fetches it by travelling to Ūta-napišti and sets it on a stele; the Prophet receives it by revelation.'
  - with: quran-18-dhul-qarnayn
    motif: hero-reaches-the-sunrise
    refs: ['Gilg MB Ug1:7', 'Gilg MB Ug1:8']
    with_refs: ['18:90']
    relation: parallel
    record:
      agent: [Gilgameš, Dhū l-Qarnayn]
      action: [travels to where the sun rises, travels to where the sun rises]
      place: [as far as the sunrise (ṣīt šamši), the rising-place of the sun (maṭliʿ al-shams)]
      quoted: [ēbir ayyaba tâmata rapašta adi ṣīt šamsi, ḥattā idhā balagha maṭliʿa sh-shamsi]
      outcome: [reaches Ūta-napišti the Far-Away, finds a people with no shelter from the sun]
    note: A far-travelling king reaches 'the going-out of the sun' (ṣīt šamši) / 'the rising-place of the sun' (maṭliʿ al-shams), the edge of the world. Gilgameš crosses the wide sea to get there and finds the flood hero; Dhū l-Qarnayn also reaches the sunset (18:86), and at the sunrise finds a people 'for whom we made no cover against it'.
