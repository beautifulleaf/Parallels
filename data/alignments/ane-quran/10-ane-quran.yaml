  checked: [quran-17-night-journey-and-israel, quran-13-signs-of-creation, quran-40-throne-bearers, quran-25-signs-shadow-seas, quran-15-prologue-and-heavens]
  matches:
  - with: quran-15-prologue-and-heavens
    motif: mortal-climbs-through-gate-of-heaven
    refs: ['Etana SB III:b+39', 'Etana SB III:b+40', 'Etana SB III:b+42']
    with_refs: ['15:14', '15:15']
    relation: echo
    record:
      agent: [Etana and the eagle, the deniers]
      action: [ascend and pass through the gates of heaven, would keep ascending through a gate of heaven]
      place: ['the gates of Anu, Enlil and Ea', a gate of the sky]
      quoted: [ištu elû ana šamê ša āni ina bāb āni enlil u ea ibāʾū, wa-law fataḥnā ʿalayhim bāban mina s-samāʾi fa-ẓallū fīhi yaʿrujūn]
      outcome: [they prostrate at each gate, 'they would say: our eyes are dazzled, we are bewitched']
    note: A mortal going up through a gate (bābu; bāb) of heaven. In Etana it happens, gate after gate, with prostration (uškēnū); in 15:14-15 it is a counterfactual ('even if we opened to them a gate of the sky and they kept ascending'), and the climbers would call it sorcery (sukkirat abṣārunā). Recorded as a shared image only.
