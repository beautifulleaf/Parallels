    with_refs: ['12:31']
    relation: echo
    record:
      agent: [the harlot Šamḫat, the women of the city]
      recipient: [Enkidu, Joseph]
      action: [declares the handsome man more than human, declare the handsome man more than human]
      quoted: [anaṭṭalka enkīdu kīma ilim tabašši, fa-lammā raʾaynahu akbarnahu ... wa-qulna ḥāsha li-llāhi mā hādhā basharan in hādhā illā malakun karīm]
