# ANE x Quran side-by-side pass, chunk 5 (ETCSL 3.1.15 - 4.16.1.2). Judged blind, from the originals.
new_motifs:
  barrier-between-two-mountains-against-invaders: {label: "A ruler builds a barrier across the gap between two mountains to cut off invading peoples", cluster: kingship}
  payment-and-labour-for-the-barrier: {label: "Who pays and who supplies the labour for a barrier against invaders", cluster: kingship}
  grain-reserve-counted-in-years: {label: "A stock of grain is laid up and reckoned in years of need it will cover", cluster: kingship}
  servant-asks-to-be-given-charge: {label: "A servant asks his king to put him in charge of guarding (grain, cities, storehouses)", cluster: kingship}
  deity-gives-kingship-and-raises-and-lowers: {label: "The deity gives the crown and kingship and raises one and lowers another (litany addressed to the deity)", cluster: deity}
  deity-turns-day-into-night: {label: "The deity turns day into night (darkness into light)", cluster: time}
  humility-toward-parent: {label: "A child is humble toward a parent (Sumerian sun5, Arabic dhull)", cluster: law}
  insolent-speech-to-a-parent: {label: "Speaking insolently or harshly to a parent is a fault the deity judges", cluster: law}
  sheep-grazing-in-a-farmer-s-field: {label: "A herdsman's sheep graze in a cultivator's field", cluster: animals}
  women-and-the-produce-of-sacred-cattle: {label: "Women barred from eating or drinking the produce of certain cattle", cluster: ritual}
  register-of-the-faithful-and-unfaithful: {label: "A written register in which servants are entered as faithful or unfaithful", cluster: judgment}
  birds-mustered-at-a-command: {label: "All the birds are assembled at a command and stand in service", cluster: animals}
  moon-floats-across-the-sky: {label: "The moon travels across the sky as a vessel floats or swims", cluster: time}
  maiden-s-breasts-have-risen: {label: "Maidens whose breasts have risen (ready for the embrace)", cluster: love}
  heaven-and-earth-on-the-deity-s-body: {label: "Heaven and earth placed on, or held in, the deity's head, hand or feet", cluster: deity}
  rule-from-sunrise-to-sunset: {label: "Lordship that reaches from the rising to the setting of the sun", cluster: kingship}
  recitation-at-night-and-by-day: {label: "Sacred words recited at dead of night, and what is done by day", cluster: ritual}
reviewed:
  - unit: ane-etcsl-3-1-15-sharrum-bani-martu
    checked: [quran-18-dhul-qarnayn, quran-2-talut-jalut, quran-8-fifth-and-badr-vision, quran-79-pharaoh-and-cosmos]
    matches:
      - with: quran-18-dhul-qarnayn
        motif: barrier-between-two-mountains-against-invaders
        refs: ["ETCSL 3.1.15 3-8", "ETCSL 3.1.15 12-13"]
        with_refs: ["18:93", "18:94", "18:95"]
        relation: parallel
        record:
          agent: ["Šarrum-bāni", "Dhū l-Qarnayn"]
          action: ["builds a barrier to cut off the invaders' route", "builds a barrier between the people and the invaders"]
          object: ["the fortification Murīq-Tidnim", "a barrier (sadd / radm)"]
          place: ["between the two mountain ranges", "between the two mountain barriers"]
          recipient: ["against the Martu", "against Yaʾjūj and Maʾjūj"]
          quoted: ["bad3 du3-u3-de3 ĝiri3-bi ku5-ru-de3 ... dal-ba-na ḫur-saĝ 2(MIN)-a-bi-ka", "ḥattā idhā balagha bayna s-saddayni ... an tajʿala baynanā wa-baynahum saddā"]
        note: "Sumerian dal-ba-na ḫur-saĝ 2-a-bi 'between the two mountain ranges' against Arabic bayna s-saddayn 'between the two barriers'. In both a ruler raises a wall in the gap between two mountains against an invading people: the Martu who 'have fallen on the land' (mar-tu ma-da-aš mu-un-šub-šub-bu-uš), Gog and Magog who 'work corruption in the land' (mufsidūna fī l-arḍ). The Sumerian wall is 26 danna long and has a name, 'Repeller of the Tidnum'."
      - with: quran-18-dhul-qarnayn
        motif: payment-and-labour-for-the-barrier
        refs: ["ETCSL 3.1.15 19-20", "ETCSL 3.1.15 27-31"]
        with_refs: ["18:94", "18:95", "18:96"]
        relation: divergence
        record:
          agent: ["Šarrum-bāni", "Dhū l-Qarnayn"]
          action: ["asks the king for more workmen and for wages", "refuses the tribute and asks the people for labour"]
          object: ["workmen and wages", "tribute (kharj)"]
          number: ["7200 workers", null]
          quoted: ["lu2 kiĝ2 ak-ne ḫa-ma-ab-taḫ-e a2 ḫa-ma-ĝa2-ĝa2", "fa-hal najʿalu laka kharjan ... mā makkannī fīhi rabbī khayrun fa-aʿīnūnī bi-quwwatin"]
          outcome: ["basket-men are plenty but fighters few", "the wall of iron and molten copper cannot be climbed or pierced"]
        note: "The same practical matter of building the barrier: workers and pay. The Sumerian commander asks his lord to 'add workmen and set the wages' (a2 'wages') and is sent 7200 men; in 18:94-95 the people offer the builder tribute (kharj), and he declines it ('what my Lord has established me in is better') and asks only for their strength (quwwa), i.e. their labour."
