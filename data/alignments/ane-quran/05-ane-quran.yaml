  - unit: ane-etcsl-4-07-3-inana-c-yours-litany
    checked: [quran-3-sovereignty, quran-56-waqia-three-classes-and-the-garden, quran-17-polemic-and-resurrection, quran-53-najm-goddesses-and-scrolls]
    matches:
      - with: quran-3-sovereignty
        motif: deity-gives-kingship-and-raises-and-lowers
        refs: ["ETCSL 4.07.3 140", "ETCSL 4.07.3 141", "ETCSL 4.07.3 142"]
        with_refs: ["3:26"]
        relation: parallel
        record:
          agent: ["Inana", "God"]
          action: ["gives the crown and kingship and raises and lowers", "gives kingship and takes it and exalts and abases"]
          object: ["crown", "throne and sceptre of kingship"]
          quoted: ["aga {ĝiš}gu-za {ĝiš}ĝidru nam-lugal šum2-mu {d}inana za-kam; il2-la2 du5-la2", "tuʾtī l-mulka man tashāʾu wa-tanziʿu l-mulka ... wa-tuʿizzu man tashāʾu wa-tudhillu man tashāʾ ... bi-yadika l-khayr"]
        note: "A litany addressed to the deity in the second person lists what is in its power: 'to give the crown, the throne and the royal sceptre is yours, Inana' (142), 'raising up and bowing down' (141), 'to interchange the strong and the weak' (140). Q 3:26 is addressed the same way to God (allāhumma): you give kingship, take it away, exalt and abase; 'in your hand is the good'."
      - with: quran-3-sovereignty
        motif: deity-turns-day-into-night
        refs: ["ETCSL 4.07.3 177"]
        with_refs: ["3:27"]
        relation: divergence
        record:
          agent: ["Inana", "God"]
          action: ["darkens the bright day into star-lit night", "makes night enter day and day enter night"]
          quoted: ["igi suḫ-a-zu dadag-ga ku10-ku10 an-bar7 mul-sig7-še3 mu-un-ĝa2-ĝa2", "tūliju l-layla fī n-nahāri wa-tūliju n-nahāra fī l-layl"]
          outcome: ["a sign of her anger", "the ordinary alternation as a sign of power"]
        note: "The same litany of the deity's powers moves on to day and night. Inana's angry glance turns midday (an-bar7) into night; in 3:27, just after the kingship verse, God makes the night pass into the day and the day into the night, the regular order and not an act of wrath."
