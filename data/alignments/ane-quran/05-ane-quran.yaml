  - unit: ane-etcsl-4-14-1-f-mother-and-child-lawsuit
    checked: [quran-17-commandments, quran-46-ahqaf-parents-and-the-scornful-son, quran-4-creation-kinship-orphans, quran-3-imran-mary-zechariah]
    matches:
      - with: quran-46-ahqaf-parents-and-the-scornful-son
        motif: son-who-rejects-his-parents
        refs: ["ETCSL 4.14.1 212-221"]
        with_refs: ["46:15", "46:17", "46:18"]
        relation: divergence
        record:
          agent: ["the child", "the son"]
          action: ["speaks in anger to the mother who bore him", "says uff to his parents"]
          recipient: ["the mother who bore him", "his parents"]
          quoted: ["ama iri gu-la mu-un-tud-da-ni-ir igi ša-ra gu2 šub-bi-a inim ba-na-ni-in-dug4", "wa-lladhī qāla li-wālidayhi uffin lakumā"]
          outcome: ["rejected like grain on acid soil", "the word is due against them and they are losers"]
        note: "The mother 'who bore him' (mu-un-tud-da) is the ground in both: 46:15 ḥamalathu ummuhu kurhan wa-waḍaʿathu kurhā. The changed detail: Ḫendursaĝa's verdict is conditional. If the mother did not feed and nurse him, the blame falls on her (209-211: nam-tag-bi ugu ama ... 'the blame on the mother'); only if she did is the angry child rejected (še-gin7 saḫar sis). The Quran has no case in which the parent bears the blame."
      - with: quran-17-commandments
        motif: reason-and-reward-for-honoring-parents
        refs: ["ETCSL 4.14.1 194-204"]
        with_refs: ["17:24"]
        relation: divergence
        record:
          agent: ["the mother", "the parents"]
          action: ["gave the child food", "drink and her milk-filled breast"]
          quoted: ["in-tuku mu-da-an-gu7 in-tuku mu-da-an-naĝ ... ubur ga ĝal2-la-ni a ba-da-an-naĝ", "rabbi rḥamhumā kamā rabbayānī ṣaghīrā"]
          outcome: ["the child's duty holds only if she did so", "the child prays for mercy on them"]
        note: "The child's duty is grounded in the parent's nurture in both: the mother who fed him and gave him suck; 'as they raised me when small'. In the Sumerian lawsuit it is a condition tested by the judge; in 17:24 it is the reason for a prayer."
