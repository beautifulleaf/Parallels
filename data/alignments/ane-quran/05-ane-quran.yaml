  - unit: ane-etcsl-3-1-17-ishbi-erra-grain
    checked: [quran-12-joseph-full, quran-89-dawn, quran-59-hashr-banu-nadir-and-fay, quran-3-sovereignty]
    matches:
      - with: quran-12-joseph-full
        motif: grain-reserve-counted-in-years
        refs: ["ETCSL 3.1.17 7-8", "ETCSL 3.1.17 29-30"]
        with_refs: ["12:47", "12:48"]
        relation: divergence
        record:
          agent: ["Išbi-Erra", "Joseph"]
          action: ["stores the grain for the king's palace and cities", "has the harvest stored in the ear for the hard years"]
          object: ["72000 gur of grain in Isin", "the harvest of seven years"]
          number: ["15 years", "7 hard years"]
          quoted: ["še mu 15-ta-am3 šag4-gal e2-gal-zu", "fa-mā ḥaṣadtum fa-dharūhu fī sunbulihi ... yaʾkulna mā qaddamtum lahunna"]
        note: "Grain laid up and reckoned against a span of years. Išbi-Erra has 72,000 gur inside Isin, 'grain of 15 years for the provisions of your palace' (še mu 15-ta-am3); Joseph has seven years' harvest kept in the ear to be eaten by the seven hard years (sabʿun shidād). The cause differs: Amorite invasion against a famine foretold in a dream."
      - with: quran-12-joseph-full
        motif: servant-asks-to-be-given-charge
        refs: ["ETCSL 3.1.17 31-33"]
        with_refs: ["12:55"]
        relation: echo
        record:
          agent: ["Išbi-Erra", "Joseph"]
          action: ["asks the king to give him charge of guarding", "asks the king to set him over the storehouses"]
          recipient: ["Ibbi-Suen", "the king"]
          object: ["Isin and Nibru", "the storehouses of the land"]
          quoted: ["i3-si-in{ki} nibru{ki}-a en-nu-uĝ3 ḫa-ra-ab-ak-e ugu-ĝa2 ḫe2-tuku", "ijʿalnī ʿalā khazāʾini l-arḍi innī ḥafīẓun ʿalīm"]
        note: "Right after reporting the grain, the official asks his king to make him responsible for guarding (en-nu-uĝ3 ak, 'keep watch') Isin and Nibru; Joseph asks to be put over the storehouses, calling himself a guardian (ḥafīẓ). Išbi-Erra later became king of Isin; Joseph is 'established in the land' (12:56 makkannā li-yūsufa fī l-arḍ)."
