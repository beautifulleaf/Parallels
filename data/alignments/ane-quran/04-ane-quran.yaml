          quoted: ["im nam-til3-la-ke4 du-ri2-še3 nu-kur2-ru", "li-kulli ajalin kitāb; yamḥū llāhu mā yashāʾu wa-yuthbitu wa-ʿindahu ummu l-kitāb"]
