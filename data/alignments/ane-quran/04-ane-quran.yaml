    checked: [quran-9-months-nasi, quran-7-creation-signs, quran-6-signs-in-nature, quran-3-sovereignty, quran-24-light-verse]
    matches:
      - with: quran-24-light-verse
        motif: light-of-heaven-and-earth-title
        refs: ["ETCSL 2.4.4.6 B:9", "ETCSL 2.4.4.6 G:45"]
        with_refs: ["24:35"]
        relation: divergence
        record:
          agent: [the moon god Suen, God]
          name: [light of heaven and earth, light of the heavens and the earth]
          quoted: ["šul {d}suen u18-ru ud an ki; ud ĝiš-ḫe2-a ud uraš-a", "allāhu nūru s-samāwāti wa-l-arḍ"]
          outcome: [the title names a luminary (the moon born each month), the title is followed by a parable (mathal nūrihi) of a lamp]
        note: "The same title: Suen is 'ud an ki', light of heaven and earth (and 'light of the firmament, light of the earth'), as the moon 'born each month' (en itid-da u3-tud). 24:35 gives the title to God and at once turns it into a likeness: mathalu nūrihi ka-mishkātin fīhā miṣbāḥ, a lamp in a niche, not a heavenly body."
      - with: quran-6-signs-in-nature
        motif: luminaries-rule-day-night
        refs: ["ETCSL 2.4.4.6 D:20"]
        with_refs: ["6:96"]
        relation: parallel
        record:
          agent: [Nanna the moon, God]
          object: [the night and the year, the night and sun and moon]
          action: [makes the night pleasant and binds the year, makes the night a rest and sun and moon a reckoning]
          quoted: ["ud ĝi6 dug3-dug3 mu zu2 keše2-de3", "wa-jaʿala l-layla sakanan wa-sh-shamsa wa-l-qamara ḥusbānā"]
        note: "One line pairs the two jobs of the night light: it 'sweetens the night and structures the year' (ĝi6 dug3-dug3, mu zu2 keše2); 6:96 likewise sets the night as rest (sakan) beside sun and moon for reckoning (ḥusbān). In the hymn the moon is the god doing it; in 6:96 God appoints (jaʿala) the moon to it."
