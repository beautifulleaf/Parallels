    checked: [quran-3-sovereignty, quran-17-polemic-and-resurrection, quran-79-pharaoh-and-cosmos]
    matches:
      - with: quran-3-sovereignty
        motif: deity-s-powers-of-reversal
        refs: ["ETCSL 2.5.4.11 13", "ETCSL 2.5.4.11 14", "ETCSL 2.5.4.11 15"]
        with_refs: ["3:26", "3:27"]
        relation: divergence
        record:
          agent: [Enlil and Ninlil give the powers to Inana, God holds them himself]
          action: [raise people from below to above and change their place, exalt and abase whom he wills]
          object: [light and darkness turned into each other, night made to enter day and day night]
          quoted: ["uĝ3 ki-ta an-na-še3 ed3-de3 ... zalag ku10-ku10-še3 du3 ku10-ku10 zalag-še3 dib-be2", "tuʿizzu man tashāʾu wa-tudhillu man tashāʾ ... tūliju l-layla fī n-nahāri wa-tūliju n-nahāra fī l-layl"]
        note: "A list of paired reversals in the same order, people raised up and moved, then light and dark exchanged: 'to make the people ascend from below to above ... to turn light to darkness and darkness to light' against 'you exalt whom you will and abase whom you will ... you make the night enter the day and the day the night'. In Išme-Dagan K the high gods hand these powers to Inana (mu-na-an-šum2-mu-uš); in 3:26 they are God's own, bi-yadika l-khayr."
