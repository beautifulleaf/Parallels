        note: "The same three acts in the same order: the god who made humans (numun i, khalaqanī) instructs them (us2 dab5-bi pad3-pad3, 'who teaches them the proper practices'; yahdīn) and satisfies them with food and drink (gu7 naĝ; yuṭʿimunī wa-yasqīn). Abraham says it in the first person of his Lord, against the idols."
