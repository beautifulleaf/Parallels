        with_refs: ["11:69", "11:70"]
        relation: divergence
        record:
          agent: [Apillaša's household, Abraham]
          recipient: [Aradĝu the king's envoy, God's messengers (rusulunā)]
          object: [fattened oxen and fattened sheep, a roasted calf]
          action: [refuses to sit and the table is overturned, do not stretch their hands to it]
          quoted: ["i3-gub-be2-en nu-tuš-u3-de3-en ... 2 gud niga 20 udu niga {ĝiš}banšur-ĝu10 ... ni2 ba-da-te su ba-da-zig3", "jāʾa bi-ʿijlin ḥanīdh ... lā taṣilu ilayhi ... wa-awjasa minhum khīfa"]
          outcome: [the messenger is afraid, the host is afraid]
        note: "Meat brought before an arriving messenger who does not take the meal, then fear: Aradĝu, offered a seat, says 'I am here to present the instructions of my king, I will not sit', is served fattened oxen and sheep, his table is overturned and 'fear came over me, my flesh crept'; Abraham's guests, God's messengers, are served a roasted calf, their hands do not reach it, and Abraham conceives a fear of them. The envoy fears in the letter, the host in 11:70."
