# ANE x Quran side-by-side pass, chunk 4 (ETCSL 2.4.2.23 - 3.1.13.2: Ur III and Isin-Larsa royal hymns, Old Babylonian royal praise poems, the Šulgi letters). Judged blind, from the originals.
new_motifs:
  light-of-heaven-and-earth-title: {label: "The title 'light of heaven and earth' given to the divine", cluster: deity}
  deity-s-powers-of-reversal: {label: "A deity holds paired powers of reversal: raising some and lowering others, turning light and darkness into each other", cluster: deity}
  creator-guides-feeds-and-waters: {label: "The god who made humans also teaches or guides them and gives them food and drink", cluster: creation}
  foreign-ruler-s-gifts-to-a-king: {label: "Foreign rulers send gifts to a king, and how he receives them", cluster: kingship}
  destinies-written-in-advance: {label: "What befalls creatures is written beforehand on a heavenly tablet or in a book", cluster: deity}
  every-matter-counted-in-a-record: {label: "Every single thing or assignment is counted and kept in a written record", cluster: deity}
  whether-the-written-term-can-be-altered: {label: "Whether the term written in the heavenly record can be altered", cluster: deity}
  heaven-opened-for-water: {label: "Heaven is opened (its udders or its gates) to release water", cluster: nature}
  guardian-beings-flank-a-person: {label: "Divine beings stand on two sides of a person (right and left, or before and behind) to guard or record", cluster: angels}
  everything-in-the-god-s-grasp: {label: "Kingship over heaven and earth and everything is in the god's hand or grasp", cluster: deity}
  whatever-my-lord-commands: {label: "Courtiers defer to the ruler: 'whatever you command / the matter is yours'", cluster: kingship}
  muster-inspection-finds-absentees: {label: "A ruler or commander inspects his host and finds some missing", cluster: kingship}
  defensive-wall-holds-or-is-breached: {label: "Whether a king's barrier against invaders holds or is breached", cluster: war}
  labour-levied-to-build-the-wall: {label: "A king's wall against invaders is built with labour levied from the people", cluster: war}
  servant-on-throne-receives-prostration: {label: "A servant raised by the king sits on a throne and others prostrate before him", cluster: kingship}
  grain-bought-with-silver-in-shortage: {label: "In a shortage grain is bought with silver from a trusted official", cluster: kingship}
  meal-of-meat-set-before-a-messenger: {label: "A host sets meat before an arriving messenger, who does not take the meal, and fear follows", cluster: kingship}
  king-called-god-of-his-people: {label: "A king is called, or calls himself, the god of his people", cluster: kingship}
