- unit: ane-ktu-1-12-i-devourers-born
  checked: [quran-7-moses-pharaoh, quran-10-opening-creation, quran-10-moses-pharaoh, quran-26-salih-thamud, quran-19-mary-and-jesus]
  matches:
  - with: quran-19-mary-and-jesus
    motif: woman-gives-birth-alone-by-a-tree-in-the-wilderness
    refs: ["KTU 1.12 I:19'", "KTU 1.12 I:25'", "KTU 1.12 I:26'"]
    with_refs: ["19:22", "19:23"]
    relation: echo
    record:
      agent: [El's handmaid, Maryam]
      action: [goes out to give birth, withdraws to give birth]
      place: [the oak(s) of Tkm in the wilderness, a remote place; the palm trunk]
      quoted: ["ḥtlk wẓi baln tkm ... ḫl ld", "fa-ntabadhat bihi makānan qaṣiyyā fa-ajāʾahā l-makhāḍu ilā jidhʿi l-nakhla"]
    note: "El sends the handmaid: 'go out to the oak(s) of Tkm (in the midst of the wilderness) ... writhe, give birth' (ḫl ld); Maryam 'withdrew to a remote place, and the pangs drove her to the trunk of the palm'. A woman giving birth alone at a tree away from the settlement; sent by El vs. withdrawing herself, oak vs. palm. The Ugaritic 'to / away from the oak' is uncertain."
- unit: ane-ktu-1-12-ii-baal-falls-seven-years
  checked: [quran-79-pharaoh-and-cosmos, quran-7-creation-signs, quran-71-noah, quran-12-joseph-full]
  matches:
  - with: quran-12-joseph-full
    motif: seven-years-of-drought
    refs: ["KTU 1.12 II:44'"]
    with_refs: ["12:47", "12:48"]
    relation: echo
    record:
      number: ["7 years (and 8 cycles)", "7 years"]
      object: [the produce of the fields, the stored harvest]
      quoted: ["šbʿ šnt il mla wṯmn nqpnt ʿd", "sabʿun shidādun yaʾkulna mā qaddamtum lahunna"]
    note: "'Seven years El filled, eight cycles of time' while the fields are scorched; Joseph: 'then seven hard years (sabʿun shidād) will come which eat what you stored'. Seven years of dearth; the Ugaritic adds the 7/8 parallelism, the Quran pairs them with seven fat years."
