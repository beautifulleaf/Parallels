  checked: [quran-27-is-there-a-god-with-god, quran-3-sovereignty, quran-16-blessings-of-creation, quran-19-zechariah-and-john]
  matches:
  - with: quran-19-zechariah-and-john
    motif: good-news-of-a-son-bsr
    refs: ["KTU 1.10 III:33'", "KTU 1.10 III:34'", "KTU 1.10 III:35'"]
    with_refs: ["19:7"]
    relation: echo
    record:
      agent: [Anat, God]
      action: [brings good news of a son, brings good news of a son]
      recipient: [Baal, Zechariah]
      quoted: ["bšrt il bšr bʿl ... k ibr lbʿl yld", "innā nubashshiruka bi-ghulāmin ismuhu yaḥyā"]
