# ANE x Quran side-by-side pass, chunk 22 (Baal Cycle KTU 1.5 VI-1.6 VI, KTU 1.7-1.13, Kirta 1.14-1.16, Aqhat 1.17-1.19, KTU 1.23, 1.24, 1.100; Instruction of Amenemope W1-W6; Great Hymn to the Aten; Book of the Dead 125). Judged blind, from the originals.
new_motifs:
  burned-then-scattered-on-the-yamm:
    label: 'An enemy god or idol is burned with fire and its remains winnowed / scattered on the sea (Ug. bym, Ar. fī l-yamm)'
    cluster: polemic
  bodily-stature-and-fitness-for-kingship:
    label: A candidate for kingship is judged by his bodily size or strength (too small for the throne; given increase of body)
    cluster: kingship
  wadis-or-rivers-of-honey:
    label: Wadis or rivers that run with honey (nḫlm tlk nbtm / anhār min ʿasal)
    cluster: nature
  good-news-of-a-son-bsr:
    label: 'Good news (root bšr) of a son born or to be born, brought to the father'
    cluster: family
  woman-gives-birth-alone-by-a-tree-in-the-wilderness:
    label: A woman goes out (or is sent) to a remote place and gives birth there by a tree
    cluster: family
  seven-years-of-drought:
    label: Seven years of drought or hardship in which the land yields nothing
    cluster: nature
  multitude-like-locusts:
    label: A great multitude spread over the land is likened to locusts (irby / jarād)
    cluster: nature
  levy-of-the-blind-and-sick:
    label: Whether the blind and the sick go out with the army (all must march / no blame on them)
    cluster: war
  conditional-vow-to-deity:
    label: 'A man makes a conditional vow: if the deity grants him X, he will give silver, gold or alms'
    cluster: ritual
  broken-vow-punished:
    label: The vow made to the deity is not kept, the deity takes note of the breach and the vower is punished
    cluster: ritual
  besieged-ruler-sends-gift-refused:
    label: 'A threatened ruler sends envoys with a gift of wealth; the king refuses it: why would I want your silver?'
    cluster: kingship
  no-other-god-can-remove-the-sickness:
    label: 'Rhetorical question: who besides (among the gods) can remove the sickness / the harm? None can'
    cluster: deity
  king-neglects-feeding-the-orphan:
    label: 'Second-person accusation: you do not feed (honour) the orphan and the poor'
    cluster: ethics
  childless-man-pleads-for-a-son-like-his-kin:
    label: A childless man pleads with the deity for a son to inherit from him and stand in his house, and is granted one
    cluster: family
  promised-son-dutiful-to-his-father:
    label: The promised son is described by his duty to his father (holds his hand, serves him; barr bi-wālidayhi)
    cluster: family
  host-household-prepares-animal-for-divine-guest:
    label: 'The host, seeing the divine visitor, has his household prepare an animal from the herd (lamb, calf) for the guest'
    cluster: hospitality
  divine-guest-eats-the-meal:
    label: Whether the divine guest eats the meal prepared by the host
    cluster: hospitality
  offer-of-immortality-to-a-mortal:
    label: A divine being offers a mortal deathlessness (blmt / khuld); the mortal sees through it or is deceived
    cluster: death
  killer-weeps-after-the-murder:
    label: The killer weeps or laments after the murder
    cluster: death
  bird-and-burial-of-murdered-man:
    label: A bird stands at the burial of a murdered man's remains (eagles that ate him are opened; a raven shows how to bury him)
    cluster: death
  bride-price-paid-to-whom:
    label: To whom the bride-price is paid and in what (silver and gold to her father; service to her father; the gift to the woman herself)
    cluster: law
  return-good-for-evil-to-the-enemy:
    label: The adversary is met with good (raise him, feed him), so that he is shamed or turned into a friend
    cluster: ethics
  good-tree-and-bad-tree-parable:
    label: 'Parable of two trees: one uprooted / burned, the other firm and fruitful (sweet fruit, fruit in every season)'
    cluster: wisdom
  earth-swallows-the-wrongful-rich:
    label: The earth opens and swallows ill-gotten riches or the wrongful rich man with his house
    cluster: judgment
  little-honestly-better-than-much-wrongly:
    label: A little honestly gained is better than much by wrong, even if the abundance of the bad impresses
    cluster: wisdom
  sweet-speech-quarrelsome-heart:
    label: A man whose speech is sweet (pleasing) but who is a quarreller and sows strife
    cluster: ethics
  slanderer-going-about-making-strife:
    label: The man who goes about (comes and goes) with words, setting brothers / people against each other
    cluster: ethics
  heart-and-tongue-at-odds:
    label: Saying with the tongue (mouth) what is not in the heart
    cluster: ethics
  remitting-a-poor-debtors-debt:
    label: A creditor facing a debtor in hardship remits all or part of the debt
    cluster: law
  scribe-writes-with-justice:
    label: The scribe who writes a debt or account must not cheat with his pen; he writes with justice
    cluster: law
  false-testimony-forbidden:
    label: Do not bear false witness (mtr n mdw n ʿḏꜣ / shahādat al-zūr)
    cluster: law
  no-one-knows-tomorrow:
    label: Man does not know what tomorrow will be / what he will earn tomorrow
    cluster: wisdom
  human-plan-for-tomorrow-and-gods-will:
    label: What man says he will do is one thing, what God does another; do not say 'I will do it tomorrow' without God's will
    cluster: wisdom
  do-not-claim-to-be-sinless:
    label: 'Do not say "I am without sin" / do not claim purity for yourselves; God knows'
    cluster: ethics
  bribe-to-the-judge:
    label: A gift (bribe) from or to the powerful in court, to deprive another of his right
    cluster: law
  return-property-to-its-owners:
    label: Command to hand over possessions / trusts to their owners, in a context of just judgment
    cluster: ethics
  confidence-divulged:
    label: A word heard in confidence in a man's house is repeated outside / disclosed to another
    cluster: ethics
  god-raises-and-lowers-as-he-wills:
    label: 'God tears down and builds up: makes men poor or overseers, gives and takes kingship, exalts and abases as he wills'
    cluster: deity
  human-is-clay-shaped-by-god:
    label: Man is clay (and straw) shaped by God, said where a human is scorned
    cluster: creation
  god-prefers-the-poor-over-the-noble:
    label: Attending to the noble (self-sufficient) over the poor man is rebuked; God loves him who honours the poor
    cluster: ethics
  god-set-up-the-balance-do-not-diminish-it:
    label: The deity made or presides over the balance; do not tamper with it or make it short
    cluster: law
  father-instructs-his-son:
    label: 'An instruction framed as a named father speaking to his son ("for his son" / "Luqmān said to his son")'
    cluster: wisdom
  birds-praise-with-their-wings:
    label: Birds in flight, wings spread, praise the deity
    cluster: nature
  night-a-covering-sleep-like-death-day-a-rising:
    label: 'Night covers the sleepers as a garment, the land as in death; the day is a rising (waking)'
    cluster: nature
  human-made-from-fluid-in-the-womb:
    label: God makes the fluid (seed) in women into a human and forms the child in its mother's belly
    cluster: creation
  diversity-of-tongues-and-skins:
    label: God made human tongues different in speech and their skins (colours) distinct
    cluster: creation
  god-provides-each-creature-and-knows-its-place:
    label: God sets each creature in its place, supplies its sustenance and knows (reckons) its term or abode
    cluster: creation
  measure-and-balance-not-diminished:
    label: 'Not diminishing the measure and not tampering with the weights of the balance, tied to a day of reckoning'
    cluster: law
  sworn-list-of-renounced-sins:
    label: 'A list of renounced sins in fixed form: not stealing, not killing, not lying / slandering, not committing adultery'
    cluster: law
  no-eavesdropping-or-spying:
    label: Denial / prohibition of eavesdropping or spying on others
    cluster: ethics
  bread-to-the-hungry-as-righteous-deed:
    label: Giving food to the hungry (water, clothing, a ferry) as the deed that justifies before the judge
    cluster: ethics
  witness-against-the-dead-at-judgment:
    label: Who witnesses against the dead at the judgment (no witness against me / their own limbs and skins)
    cluster: judgment
  balance-set-up-at-the-judgment:
    label: A balance set upright / just balances set up for the judgment
    cluster: judgment
