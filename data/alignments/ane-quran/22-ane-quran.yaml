- unit: ane-ktu-1-14-ii-el-instructs-sacrifice-and-campaign
  checked: [quran-7-moses-pharaoh, quran-20-moses-favors-recalled, quran-20-sea-crossing-sinai, quran-19-zechariah-and-john, quran-48-fath-clear-victory-and-pledge, quran-54-qamar-moon-split-and-noah]
  matches:
  - with: quran-48-fath-clear-victory-and-pledge
    motif: levy-of-the-blind-and-sick
    refs: ["KTU 1.14 II:45", "KTU 1.14 II:46", "KTU 1.14 II:47"]
    with_refs: ["48:17"]
    relation: divergence
    record:
      agent: [El (instructing Kirta), God]
      action: [orders a total levy, exempts from the campaign]
      object: [the sick and the blind, "the blind, the lame and the sick"]
      quoted: ["zbl ʿršm yšu ʿwr mzl ymzl", "laysa ʿalā l-aʿmā ḥarajun wa-lā ʿalā l-aʿraji ḥarajun wa-lā ʿalā l-marīḍi ḥaraj"]
      outcome: [the sick carries his bed and the blind gropes behind, no blame on them for staying]
    note: "Kirta's levy: 'the sick (zbl) carries his bed, the blind (ʿwr) gropes along', even the newlywed goes; Q 48:17 'no blame on the blind (aʿmā), the lame, the sick (marīḍ)' for not going out. The same named classes of the unfit before a campaign: all must march vs. all are exempted."
  - with: quran-54-qamar-moon-split-and-noah
    motif: multitude-like-locusts
    refs: ["KTU 1.14 II:50", "KTU 1.14 II:51"]
    with_refs: ["54:7"]
    relation: echo
    record:
      agent: [Kirta's army, the dead raised]
      action: [settle on the land, come out of the graves]
      quoted: ["kirby tškn šd", "ka-annahum jarādun muntashir"]
    note: "The army 'settles on the field like locusts (kirby)'; the raised dead 'come out of the graves as if they were scattered locusts (jarādun muntashir)'. The same simile for a vast multitude covering the ground."
