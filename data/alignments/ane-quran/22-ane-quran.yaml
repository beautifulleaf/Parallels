- unit: ane-ktu-1-6-i-athtar-on-throne
  checked: [quran-2-talut-jalut, quran-23-noah, quran-79-pharaoh-and-cosmos, quran-17-polemic-and-resurrection]
  matches:
  - with: quran-2-talut-jalut
    motif: bodily-stature-and-fitness-for-kingship
    refs: ["KTU 1.6 I:45", "KTU 1.6 I:50", "KTU 1.6 I:59", "KTU 1.6 I:60", "KTU 1.6 I:62"]
    with_refs: ["2:246", "2:247"]
    relation: divergence
    record:
      agent: [El and Athirat, the prophet (God)]
      action: [choose a king, choose a king]
      object: [Athtar, Ṭālūt]
      quoted: ["tn aḥd b bnk amlkn ... pʿnh ltmġyn hdm rišh lymġy apsh ... lamlk", "ibʿath lanā malikan ... wa-zādahu basṭatan fī l-ʿilmi wa-l-jism"]
      outcome: [too small for the throne; steps down, increased in body; made king]
    note: "Ug. 'give one of your sons, I will make him king' (tn aḥd b bnk amlkn); the first candidate is rejected as a weakling (dq anm), Athtar's feet do not reach the footstool nor his head the top: 'I cannot be king' (lamlk). Q: 'raise for us a king' (ibʿath lanā malikan); Ṭālūt is objected to (no wealth) but God 'increased him in knowledge and body' (basṭatan fī l-ʿilmi wa-l-jism). Body size decides fitness for the throne in both; in one the candidate fails, in the other God enlarges him."
- unit: ane-ktu-1-6-ii-anat-destroys-mot
  checked: [quran-7-moses-pharaoh, quran-20-moses-favors-recalled, quran-20-sea-crossing-sinai, quran-20-samiri-calf]
  matches:
  - with: quran-20-samiri-calf
    motif: burned-then-scattered-on-the-yamm
    refs: ["KTU 1.6 II:32", "KTU 1.6 II:33", "KTU 1.6 II:34", "KTU 1.6 II:35"]
    with_refs: ["20:97"]
    relation: echo
    record:
      agent: [Anat, Moses]
      action: [burns and winnows, burns and scatters]
      object: [Mot (Death), the calf (ilāh)]
      instrument: [fire; winnowing fork; millstones, fire]
      place: [the field, the yamm]
      quoted: ["bḫṯr tdrynn bišt tšrpnn brḥm tṭḥnn bšd tdrʿnn", "la-nuḥarriqannahu thumma la-nansifannahu fī l-yammi nasfā"]
    note: "Anat winnows Mot (tdrynn), burns him with fire (bišt tšrpnn), grinds him and sows him in the field; Moses: 'we will burn it (nuḥarriqannahu), then scatter it (nansifannahu, the winnowing verb) in the yamm'. Same sequence on a false or enemy god, with the place changed: the field here, the sea in 1.6 V:19 (drʿ bym)."
- unit: ane-ktu-1-6-iii-iv-el-dream-baal-lives
  checked: [quran-7-lot, quran-8-meccan-plots, quran-11-lot, quran-4-prayer-of-fear, quran-47-muhammad-battle-and-rivers]
  matches:
  - with: quran-47-muhammad-battle-and-rivers
    motif: wadis-or-rivers-of-honey
    refs: ["KTU 1.6 III:7", "KTU 1.6 III:13"]
    with_refs: ["47:15"]
    relation: echo
    record:
      object: [wadis, rivers]
      quoted: ["šmm šmn tmṭrn nḫlm tlk nbtm", "anhārun min ʿasalin muṣaffā"]
      outcome: [sign that Baal lives, a feature of the promised garden]
    note: "'The heavens rain oil, the wadis run with honey' (nḫlm tlk nbtm) in El's dream; Q 47:15 the garden has 'rivers of purified honey' (anhārun min ʿasal) beside rivers of water, milk and wine. A sign of the god's return to life vs. a feature of paradise."
- unit: ane-ktu-1-6-v-mot-returns-seventh-year
  checked: [quran-7-moses-pharaoh, quran-20-moses-favors-recalled, quran-20-sea-crossing-sinai, quran-4-creation-kinship-orphans, quran-20-samiri-calf]
  matches:
  - with: quran-20-samiri-calf
    motif: burned-then-scattered-on-the-yamm
    refs: ["KTU 1.6 V:12", "KTU 1.6 V:13", "KTU 1.6 V:14", "KTU 1.6 V:19"]
    with_refs: ["20:97"]
    relation: echo
    record:
      agent: [Anat (Mot recalls it), Moses]
      action: [winnows and burns and sows, burns and scatters]
      object: [Mot, the calf]
      place: [the sea (ym), the yamm]
      quoted: ["pht dry bḥrb ... pht šrp bišt ... drʿ bym", "la-nuḥarriqannahu thumma la-nansifannahu fī l-yammi nasfā"]
    note: "Mot's litany: 'I suffered winnowing (dry), burning with fire (šrp bišt) ... sowing in the sea (drʿ bym)'; Moses on the calf: burn it, then scatter it in the yamm. Burn, winnow/scatter, sea: all three elements, with the same Semitic sea word ym / yamm."
