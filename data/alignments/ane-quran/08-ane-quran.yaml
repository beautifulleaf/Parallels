          outcome: [do not eat, eat]
        note: 'Ea calls the food Adapa will be offered ''food of death'' (akala ša mūti) and says lā takkal ''do not eat''; Satan calls the forbidden tree shajarat al-khuld, ''the tree of immortality'', and urges eating. Mirror image: in Adapa the life-giving food is misnamed as death by the friendly god; in 20:120 the forbidden tree is misnamed as immortality by the enemy.'
      - with: quran-7-adam-iblis
        motif: counsel-about-the-food-of-immortality
        refs: ['Adapa MB –:33''', 'Adapa MB –:34''', 'Adapa MB –:37''', 'Adapa MB –:38''']
        with_refs: ['7:20', '7:21']
        relation: divergence
        record:
          agent: [Ea, al-shayṭān]
          action: [advises the human about the food, advises the human about the food]
          recipient: [Adapa, Ādam and his wife]
          name: [food of death, the tree that makes one immortal]
          quoted: [ṭēma ša aškunūka lā temekki; akala ša mūti ... lā takkal, illā an takūnā malakayni aw takūnā mina l-khālidīn; innī lakumā la-mina n-nāṣiḥīn]
          outcome: [do not eat, eat]
        note: 'Both advisers present themselves as the trustworthy counsellor. Ea: ṭēma ša aškunūka lā temekki ''do not neglect the instruction I give you'', ''food of death, do not eat''. Satan swears innī lakumā la-mina n-nāṣiḥīn ''I am a sincere adviser to you'' and says the tree was forbidden only lest they become angels or among al-khālidīn. The advice runs in opposite directions.'
