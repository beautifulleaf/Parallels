        with_refs: ["55:7", "55:8", "55:9"]
        relation: echo
        record:
          agent: ["Utu", "God"]
          object: ["the scales (ŋiš-erin2)", "the balance (al-mīzān)"]
          action: ["stands at the scales and makes firm their arm", "set up the balance"]
          quoted: ["{d}utu ki ŋiš-erin2-na-ka mu-un-gub ... {d}utu a2 ŋiš-erin2-na-ka mu-un-na-gen6-ne2", "wa-s-samāʾa rafaʿahā wa-waḍaʿa l-mīzān / allā taṭghaw fī l-mīzān / wa-aqīmū l-wazna bi-l-qisṭi wa-lā tukhsirū l-mīzān"]
          outcome: ["purchases of oxen, sheep and slaves are decided fairly", "people are to weigh with justice"]
        note: "The scales of commerce are a divine institution: when the day has passed Utu 'stands at the place of the scales' and 'makes firm the arm of the scales' for each purchase of an ox, a sheep or a slave; God 'raised the sky and set up the balance', so 'establish weight with justice and do not skimp the balance'. Utu is the sun himself; in 55:7 the balance is set alongside the raised sky."
