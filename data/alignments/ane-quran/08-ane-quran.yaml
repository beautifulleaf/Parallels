          outcome: [loses eternal life, their nakedness appears and Adam disobeys]
        note: 'Adapa is brought akal balāṭi ''food of life'' and mê balāṭi ''water of life'' and does not eat or drink, because ''Ea my lord told me: you must not eat'' (lā takkal). Adam and his wife eat (fa-akalā minhā) from what Satan called shajarat al-khuld, against God''s command. The life-food is refused out of obedience to the adviser; the ''immortality'' tree is eaten out of obedience to the adviser.'
