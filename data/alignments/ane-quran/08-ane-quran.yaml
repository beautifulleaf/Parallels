# ANE x Quran side-by-side pass, chunk 8 (ETCSL 2.5.1.2 - 5.7.a, Adapa, Advice to a Prince, Angim, Anzu). Judged blind, from the originals.
new_motifs:
  door-that-opens-for-the-righteous-not-the-wicked: {label: A door or gate of the place of judgment does not open for the wicked and opens for the righteous, cluster: judgment}
  the-accused-brought-in-blind: {label: The accused is led to judgment with eyes covered, or gathered blind, cluster: judgment}
  friends-and-brothers-ignore-each-other-at-judgment: {label: At the judgment friends no longer speak to or recognise each other and brother neglects brother, cluster: judgment}
  the-poor-at-the-harvest: {label: At the reaping, the poor and the gleaners are provided for or shut out, cluster: law}
  prayer-at-the-harvest: {label: A prayer or glorification of God is due at the harvest, said or omitted, cluster: cult}
  works-carried-off-by-the-wind: {label: The wrongdoer's works are carried off by the wind and reckoned as nothing (a breath, ashes, dust), cluster: judgment}
  payment-to-the-judge: {label: Money or a gift passes to the judge of a case to pervert the verdict, cluster: law}
  brothers-offerings-and-the-envy-that-follows: {label: Two brothers each bring an offering to the god, and envy of one against the other follows, cluster: family}
  counsel-about-the-food-of-immortality: {label: Before the offer of a food that gives (or is said to give) eternal life, an adviser tells the human whether to eat it, and names the food, cluster: afterlife}
  human-holds-fast-to-or-forgets-the-instruction: {label: A human is given an instruction about what not to eat and either holds fast to it or forgets it, cluster: creation}
  human-sent-down-from-heaven-to-earth: {label: After the episode of the forbidden or refused food, the human is ordered back down to earth, cluster: creation}
  garment-given-or-stripped-in-the-divine-realm: {label: In the divine realm the human is given a garment to put on, or has his covering stripped, cluster: creation}
  knowledge-of-heaven-and-earth-given-to-a-human: {label: A god gives a human knowledge of 'heaven and earth' and a higher divine voice remarks on it, cluster: creation}
  wisdom-without-eternal-life: {label: A god gives the first human (or the human sage) knowledge, while eternal life is withheld or only promised by a tempter, cluster: death}
