          object: ["the tablet of life", "each man's book"]
          action: ["holds the record in her own hand and knows the deeds", "fastens it to each man's neck and brings it out for him to read"]
          quoted: ["im nam-til3-la šu-ŋa2 mu-un-ŋal2 lu2 zid bi2-in-gub-be2-en / erim2-du a2-ŋa2 la-ba-ra-e3 niŋ2 ak-bi mu-zu", "wa-kulla insānin alzamnāhu ṭāʾirahu fī ʿunuqihi wa-nukhriju lahu yawma l-qiyāmati kitāban yalqāhu manshūrā / iqraʾ kitābaka"]
          outcome: ["the just man is set on his feet and the evildoer does not escape", "each man is his own reckoner"]
        note: "A written record decides the judged: 'I hold the tablet of life (im nam-til3-la) in my hand, I set the just man upright; the evildoer does not escape my arm, I know what he has done (niŋ2 ak-bi mu-zu)'. In 17:13-14 the record is the person's own: fastened to his neck, unrolled on the day of resurrection, and he reads it himself (kafā bi-nafsika l-yawma ʿalayka ḥasībā)."
      - with: quran-93-94-forenoon-and-expansion
        motif: deity-lifts-the-heavy-burden-of-sin
        refs: ["ETCSL 4.28.1 80"]
        with_refs: ["94:2", "94:3"]
        relation: echo
        record:
          agent: ["Nungal", "God"]
          action: ["lightens the heavy sin", "removes the burden"]
          object: ["heavy sin (nam-tag dugud)", "wizr"]
          recipient: ["a man", "the Prophet"]
          quoted: ["nam-tag dugud šu-ta im-sig-ge-en ama arhuš-a-me-en", "wa-waḍaʿnā ʿanka wizraka lladhī anqaḍa ẓahrak"]
        note: "Sin as a weight the deity takes off: 'I lessen the heavy (dugud) sin from the hand, I am a compassionate mother'; 'we removed from you your burden (wizr) that weighed down your back'. The Sumerian is a general claim of the goddess, 94:2-3 God's word to one person."
