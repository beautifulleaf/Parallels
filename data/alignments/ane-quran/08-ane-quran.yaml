    checked: [quran-96-clot, quran-22-signs-and-rites, quran-23-lordship-arguments, quran-50-qaf-two-recorders-and-hell-asks-more, quran-41-steadfast-and-repel-evil]
    matches:
      - with: quran-41-steadfast-and-repel-evil
        motif: in-plenty-forgets-god-in-trouble-prays
        refs: ["ETCSL 4.31.1 Ver.1:41", "ETCSL 4.31.1 Ver.1:42", "ETCSL 4.31.1 Ver.1:43", "ETCSL 4.31.1 Ver.1:56", "ETCSL 4.31.1 Ver.1:58", "ETCSL 4.31.1 Ver.1:59"]
        with_refs: ["41:51"]
        relation: parallel
        record:
          agent: ["a man", "al-insān"]
          action: ["in plenty does not invoke his god and in affliction makes supplication", "in plenty turns away and in affliction prays at length"]
          quoted: ["u2 tuku u2-na ba-ni-in-gu7 / a tuku a-na ba-ni-in-naŋ / mu diŋir-ra-na li-bi-in-pad3-de3 ... saŋ ŋa2-ŋa2 a-ra-zu ma-ra-ab-be2", "wa-idhā anʿamnā ʿalā l-insāni aʿraḍa wa-naʾā bi-jānibihi wa-idhā massahu sh-sharru fa-dhū duʿāʾin ʿarīḍ"]
          outcome: ["restored to his god's kindly hand", null]
        note: "The same two-step: 'who had grass ate his grass, who had water drank his water, he did not call on his god's name', then something heavy 'covered him like a garment' and he offers prayer (a-ra-zu) and supplication (šag4-ne-ša4); 41:51 'when we bless man he turns away and keeps aloof, and when evil touches him he is full of long prayer'. Lines 45-57 are broken. The Sumerian story ends in restoration (64 šu sag9-ga diŋir-ra-na-še3 im-ši-in-gi4-gi4); 41:51 states the pattern as a reproach."
      - with: quran-96-clot
        motif: in-plenty-forgets-god-in-trouble-prays
        refs: ["ETCSL 4.31.1 Ver.1:41", "ETCSL 4.31.1 Ver.1:42", "ETCSL 4.31.1 Ver.1:43"]
        with_refs: ["96:6", "96:7"]
        relation: echo
        record:
          agent: ["a man", "al-insān"]
          action: ["eats and drinks his own and does not invoke his god", "transgresses because he sees himself self-sufficient"]
          quoted: ["u2 tuku u2-na ba-ni-in-gu7 ... mu diŋir-ra-na li-bi-in-pad3-de3", "inna l-insāna la-yaṭghā an raʾāhu staghnā"]
        note: "Having enough of one's own is the cause of forgetting the god: the man with his own grass and water does not name his god; 'man transgresses when he sees himself self-sufficient (istaghnā)'."
