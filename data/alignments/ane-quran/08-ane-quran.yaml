  - unit: ane-etcsl-4-28-1-a-prison-house
    checked: [quran-39-mercy-and-last-day, quran-7-paradise-hell-araf, quran-15-iblis, quran-112-114-unity-and-refuge]
    matches:
      - with: quran-7-paradise-hell-araf
        motif: door-that-opens-for-the-righteous-not-the-wicked
        refs: ["ETCSL 4.28.1 20", "ETCSL 4.28.1 21"]
        with_refs: ["7:40"]
        relation: divergence
        record:
          object: ["the great door of the house of judgment", "the gates of heaven"]
          action: ["does not open for the evildoer", "are not opened for those who deny"]
          recipient: ["lu2-erim2 (the evildoer)", "alladhīna kadhdhabū bi-āyātinā"]
          quoted: ["{ŋiš}ig-bi hur-saŋ gal lu2-erim2-ra ŋal2 nu-un-ta-da13-da13 / lu2 zid ... ŋal2 mu-un-ta-da13-da13", "lā tufattaḥu lahum abwābu s-samāʾi wa-lā yadkhulūna l-jannata"]
          outcome: ["it opens for the just man", "they do not enter the garden"]
        note: "The same selective door: Nungal's door, 'a great mountain', 'is not opened for the evildoer' (ŋal2 nu-un-ta-da13) but 'is opened' (ŋal2 mu-un-ta-da13) for the just man; 'the gates of heaven are not opened for them'. Direction differs: the prison door opens to let the just out; heaven's gates open to let the righteous in."
      - with: quran-39-mercy-and-last-day
        motif: door-that-opens-for-the-righteous-not-the-wicked
        refs: ["ETCSL 4.28.1 20", "ETCSL 4.28.1 21"]
        with_refs: ["39:71", "39:73"]
        relation: divergence
        record:
          object: ["the door of the house of judgment", "the gates of hell and of the garden"]
          action: ["opens for the just man only", "are opened for each company as it arrives"]
          quoted: ["lu2-erim2-ra ŋal2 nu-un-ta-da13-da13 / lu2 zid ... ŋal2 mu-un-ta-da13-da13", "ḥattā idhā jāʾūhā futiḥat abwābuhā ... ḥattā idhā jāʾūhā wa-futiḥat abwābuhā"]
          outcome: ["the just man goes free", "the righteous enter the garden forever"]
        note: "Nungal's single door divides the evildoer from the just by not opening or opening; in 39:71-73 two sets of gates both open (futiḥat), hell's for the disbelievers and the garden's for the God-fearing, with keepers (khazanatuhā) speaking to each."
  - unit: ane-etcsl-4-28-1-b-nungal-judges
    checked: [quran-36-trumpet-and-judgment, quran-12-joseph-full, quran-15-abraham-guests-lot, quran-26-lot, quran-17-prayer-spirit-and-challenge, quran-70-ascending-stairways, quran-80-frowned]
    matches:
      - with: quran-17-prayer-spirit-and-challenge
        motif: the-accused-brought-in-blind
        refs: ["ETCSL 4.28.1 44", "ETCSL 4.28.1 45"]
        with_refs: ["17:97"]
        relation: echo
        record:
          agent: ["Nungal", "God"]
          action: ["leads the accused in with his eyes covered", "gathers the misguided blind"]
          place: ["into the house of lamentation", "on the day of resurrection"]
          quoted: ["ŋiri3 mu-un-dab5 e2 a-nir-ra-še3 / tug2 igi-na mu-un-si", "wa-naḥshuruhum yawma l-qiyāmati ʿalā wujūhihim ʿumyan wa-bukman wa-ṣummā"]
        note: "The accused is led to judgment unable to see: the goddess 'takes his foot to the house of lamentation, covers his eyes with a cloth' (tug2 igi-na mu-un-si); God 'gathers them on the day of resurrection on their faces, blind, dumb and deaf' (ʿumyan). A prison ordeal in this life against the last gathering."
      - with: quran-70-ascending-stairways
        motif: friends-and-brothers-ignore-each-other-at-judgment
        refs: ["ETCSL 4.28.1 47", "ETCSL 4.28.1 52", "ETCSL 4.28.1 53", "ETCSL 4.28.1 54"]
        with_refs: ["70:10", "70:11"]
        relation: echo
        record:
          agent: ["the accused's acquaintances", "close friends"]
          action: ["do not speak to him and do not recognise him", "do not ask after each other though they are shown each other"]
          quoted: ["lu2 zu-a-ni gu3 nu-mu-un-da-ab-be2 ... šul-e šul-zu-ne nu-mu-un-zu-zu", "wa-lā yasʾalu ḥamīmun ḥamīman yubaṣṣarūnahum"]
        note: "Those brought to judgment are cut off from those who know them: 'his acquaintance does not speak to him, stands aside'; 'the youth does not recognise his fellows'; 'man does not acknowledge man'. In 70:10-11 'no close friend will ask after a close friend, though they are made to see them'."
      - with: quran-80-frowned
        motif: friends-and-brothers-ignore-each-other-at-judgment
        refs: ["ETCSL 4.28.1 52"]
        with_refs: ["80:34", "80:35", "80:36"]
        relation: echo
        record:
          agent: ["brother", "a man"]
          action: ["neglects his brother", "flees from his brother"]
          recipient: ["his brother", "his brother, mother, father, wife and sons"]
          quoted: ["šeš šeš-ra ud ha-lam mu-un-da-aŋ2-e", "yawma yafirru l-marʾu min akhīhi wa-ummihi wa-abīhi wa-ṣāḥibatihi wa-banīh"]
        note: "šeš šeš-ra 'brother to brother' gives a day of forgetting (ud ha-lam) in the house of judgment; 80:34 'the day a man flees from his brother'. The Quran extends it to mother, father, wife and sons."
  - unit: ane-etcsl-4-28-1-c-nungal-self-praise
    checked: [quran-17-book-of-deeds, quran-40-throne-bearers, quran-17-polemic-and-resurrection, quran-50-qaf-two-recorders-and-hell-asks-more, quran-93-94-forenoon-and-expansion]
