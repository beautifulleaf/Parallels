  - unit: ane-etcsl-4-06-1-a-night-watchman
    checked: [quran-3-sovereignty, quran-2-throne-verse, quran-11-opening-throne-on-water, quran-50-qaf-two-recorders-and-hell-asks-more]
    matches:
      - with: quran-50-qaf-two-recorders-and-hell-asks-more
        motif: god-escorts-dead-to-netherworld
        refs: ["ETCSL 4.06.1 Seg.A:40"]
        with_refs: ["50:21"]
        relation: divergence
        record:
          agent: ["Ḫendursaĝa", "a driver (sāʾiq)"]
          action: ["drives the dead to the netherworld", "comes driving each soul"]
          recipient: ["the dead", "every soul"]
          quoted: ["saŋ ug5-ga kur-ra |DU.DU|-e-da gal5-la2 gal-bi-me-en", "wa-jāʾat kullu nafsin maʿahā sāʾiqun wa-shahīd"]
          place: ["kur (the netherworld)", "to judgment"]
        note: "An officer who drives the dead: 'you are the great constable (gal5-la2 gal) for leading the dead (saŋ ug5-ga) to the netherworld'; 'every soul will come with a driver (sāʾiq) and a witness'. In Sumerian one god, the night watchman of the streets, does it for all; in 50:21 each soul has its own driver, and the destination is the judgment, not the kur."
  - unit: ane-etcsl-4-06-1-a-seven-creatures
    checked: [quran-37-daughters-and-ranks, quran-43-zukhruf-book-and-daughters, quran-112-114-unity-and-refuge, quran-72-jinn]
    matches:
      - with: quran-37-daughters-and-ranks
        motif: sex-of-the-divine-attendants
        refs: ["ETCSL 4.06.1 Seg.A:49", "ETCSL 4.06.1 Seg.A:85"]
        with_refs: ["37:150"]
        relation: divergence
        record:
          agent: ["the seven heralds of Ḫendursaĝa", "the angels"]
          name: ["diŋir (gods)", "al-malāʾika"]
          quoted: ["7-be2-ne diŋir munus nu-me-eš u3 nitah nu-me-eš", "am khalaqnā l-malāʾikata ināthan wa-hum shāhidūn"]
          outcome: ["they are neither female nor male", "the claim that they are female is refused"]
        note: "The sex of a god's attendant beings is the explicit question in both. Ḫendursaĝa's band of seven: 'these seven are gods, they are not female and they are not male'; 37:150 'did we create the angels female while they were witnesses?' (also 43:19). The Sumerian asserts neither sex; the Quran denies the pagan claim of female sex."
      - with: quran-112-114-unity-and-refuge
        motif: divine-name-or-refuge-protects-at-night
        refs: ["ETCSL 4.06.1 Seg.A:44", "ETCSL 4.06.1 Seg.A:45"]
        with_refs: ["113:1", "113:3"]
        relation: echo
        record:
          agent: ["a man", "the believer"]
          action: ["takes the god's name", "seeks refuge with the Lord of the daybreak"]
          time: ["in the silent street at night", "when darkness settles"]
          quoted: ["mu {d}hendur-saŋ-ŋa2-ka um-mi-in-pad3 / sila sig9-ga ŋi6 u3-na-ka si sa2-bi mi-ni-dab5-be2", "qul aʿūdhu bi-rabbi l-falaq ... wa-min sharri ghāsiqin idhā waqab"]
          outcome: ["he is kept on the right way", null]
        note: "Night protection by calling on a divine name: 'when a man has invoked the name of Ḫendursaĝa, in the silent street at night he keeps him on the right course'; 'say: I seek refuge in the Lord of the daybreak ... from the evil of the dark when it settles'."
