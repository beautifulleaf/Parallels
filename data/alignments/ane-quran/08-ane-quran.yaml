          object: ["mountains and hills", "the mountain"]
          quoted: ["rašubbat melammēšu usahhip šadê huršāni ... irubbū ilū erṣeti", "fa-lammā tajallā rabbuhu li-l-jabali jaʿalahu dakkan wa-kharra mūsā ṣaʿiqā"]
          outcome: ["the gods of the earth tremble", "the mountain is levelled and Moses falls senseless"]
        note: "The divine radiance falls on the mountains: Ninurta's melammu 'covered (usahhip) mountains and hills' and the gods of the earth trembled (irubbū); God 'manifested himself (tajallā) to the mountain, made it level (dakk), and Moses fell senseless'. In Anzû it is a battle against the monster; in 7:143 the answer to Moses' request to see God."
