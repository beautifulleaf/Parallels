        relation: echo
        record:
          object: ["the moon", "the moon"]
          action: ["completes the month and is born again as the crescent", "is measured out in stations until it returns like an old palm stalk"]
          quoted: ["ud nu2-a itid šu du7-a-zu ... a-a ud-sakar u3-tud", "wa-l-qamara qaddarnāhu manāzila ḥattā ʿāda ka-l-ʿurjūni l-qadīm"]
        note: "The monthly cycle to the thin crescent: 'on the day of lying down, when you complete the month' and 'father, born as the crescent'; 'the moon, we measured it in stations until it returns (ʿāda) like an old date-stalk'."
