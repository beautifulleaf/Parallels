          quoted: [lubāra ilqûniššum-ma ittalbaš; šamna ilqûniššum-ma ittapšiš, li-yubdiya lahumā mā wūriya ʿanhumā min sawʾātihimā; wa-ṭafiqā yakhṣifāni ʿalayhimā min waraqi l-janna]
          outcome: [clothed and anointed, naked and sewing leaves]
        note: 'In the same scene as the food, Adapa accepts a garment (lubāru, ittalbaš) and oil from heaven. In 7:20-22 the eating strips the pair: their sawʾāt appear and they sew leaves of the garden over themselves.'
      - with: quran-20-adam-iblis
