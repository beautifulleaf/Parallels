        note: "The crescent (ud-sakar; Arabic hilāl, pl. ahilla) as the fixer of the calendar: Nanna 'making firm the month and the crescent, setting the year in its place'; 'they ask you about the crescents: say, they are fixed times for people and for the pilgrimage'. In Sumerian the crescent is the god; in 2:189 it is a sign whose purpose is stated."
