    note: Among the faults of speech, nn smtj =j 'I have not spied / eavesdropped' (with lying and chattering nearby, W7:22_1, W7:33_1); 49:12 wa-lā tajassasū wa-lā yaghtab baʿḍukum baʿḍā, among suspicion and backbiting.
