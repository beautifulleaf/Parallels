reviewed:
- unit: ane-bd125-w1-d-gate-names-thoth-osiris
  checked:
  - quran-39-mercy-and-last-day
  - quran-7-paradise-hell-araf
  - quran-3-sovereignty
  - quran-67-mulk-heavens-lamps-and-hell
  matches:
  - with: quran-39-mercy-and-last-day
    motif: keepers-admit-or-question-arrivals-at-gate-of-hereafter
    refs:
    - BD125 W1:89/4
    - BD125 W1:96/2
    - BD125 W1:98
    with_refs:
    - 39:71
    - 39:73
    relation: divergence
    record:
      agent:
      - the gate-parts and doorkeeper of the Hall of the Two Maat
      - the keepers of the gates (khazanatuhā)
      action:
      - refuse entry and question the dead
      - question or greet the throngs at the opened gates
      quoted:
      - jw =j wꜥb.kw ... ꜥq jr =k ḥr =n
      - salāmun ʿalaykum ṭibtum fa-dkhulūhā khālidīn
      outcome:
      - the dead who says he is pure and knows the names may enter
      - those who were good (ṭibtum) enter for ever; the others are asked 'a-lam yaʾtikum rusulun'
    note: 'Keepers of the gate of the hereafter stop and question the arriving dead, then admit him. Egyptian: each gate-part says nn ḏi̯ =n ꜥq =k ... n-js ḏd.n =k rn =n ''we will not let you enter unless you say our name''; the dead answers jw =j wꜥb.kw ''I am pure'', and is told ꜥq jr =k ḥr =n ''enter then''. Arabic: khazanatuhā ask the damned a-lam yaʾtikum rusulun minkum (39:71) and tell the God-fearing salāmun ʿalaykum ṭibtum fa-dkhulūhā (39:73). The test changes: secret names and a claim of purity, against whether the messengers were heeded; ''pure'' is claimed by the dead in BD and pronounced by the keepers in Q.'
- unit: ane-bd125-w1-e-rubric
  checked:
  - quran-2-food-piety
  - quran-5-contracts-food-laws
  - quran-69-haqqa-books-in-right-and-left-hands
  - quran-100-chargers
  matches:
  - with: quran-69-haqqa-books-in-right-and-left-hands
    motif: written-book-carried-by-dead-at-judgment
    refs:
    - BD125 W1:112
    - BD125 W1:114
    with_refs:
    - '69:19'
    - '69:20'
    relation: divergence
    record:
      object:
      - this book-roll (mḏꜣ,t tn) made for the dead
      - his book (kitābiyah) given into his right hand
      action:
      - is made for the dead man
      - is given to the dead man
      quoted:
      - jr jrr mḏꜣ,t tn ḥr =f ... n šnꜥ.tw =f ḥr sbꜣ nb n jmn,t
      - fa-ammā man ūtiya kitābahu bi-yamīnihi fa-yaqūlu hāʾumu qraʾū kitābiyah
      outcome:
      - he is turned back at no gate of the West
      - he says 'take, read my book' and enters a pleasing life
    note: 'A written book in the dead man''s possession decides his passage. BD 125 rubric: jr jrr mḏꜣ,t tn ḥr =f ''whoever has this book-roll made for him'' ... n šnꜥ.tw =f ḥr sbꜣ nb n jmn,t ''he will be turned back at no gate of the West''. 69:19 fa-ammā man ūtiya kitābahu bi-yamīnihi fa-yaqūlu hāʾumu qraʾū kitābiyah. In Egypt it is a spell-roll that is commissioned and works by itself; in the Quran it is the record of the man''s own deeds, handed to him by God.'
- unit: ane-bd125-w2-a-introduction-first-confession
  checked:
  - quran-83-defrauders
  - quran-17-commandments
  - quran-23-death-barzakh-judgment
  - quran-36-trumpet-and-judgment
  matches:
  - with: quran-83-defrauders
    motif: tampering-with-measure-and-balance
    refs:
    - BD125 W2:698/4
    - BD125 W2:699
    - BD125 W2:699/2
    with_refs:
    - '83:1'
    - '83:2'
    - '83:3'
    relation: parallel
    record:
      action:
      - gives short in measure and weight
      - gives short in measure and weight
      object:
      - the grain measure and the balance (jws,w, mḫꜣ,t)
      - the measure (kayl) and the weight (wazn)
      quoted:
      - n ḫbi̯ =j dbḥ ... n snmḥ =j m tḫ n mḫꜣ,t
      - idhā kālūhum aw wazanūhum yukhsirūn
      outcome:
      - denied by the dead before the judges of the dead
      - woe (wayl) to the defrauders, who will be raised on a great day
    note: 'The same two offences, measure and balance, judged in the hereafter. BD 125: n ḫbi̯ =j dbḥ ''I have not diminished the measure'', n ski̯ =j ḥr mw,t n.t jwsw / n wꜣḥ =j ḥr mw,t n.t jws,w ''I have not taken from / added to the weight of the hand-balance'', n snmḥ =j m tḫ n mḫꜣ,t ''I have not tampered with the plummet of the balance''. 83:1-3 waylun li-l-muṭaffifīn ... idhā kālūhum aw wazanūhum yukhsirūn, followed by a-lā yaẓunnu ulāʾika annahum mabʿūthūn (83:4). In BD the dead denies the fraud; in Q the fraud is denounced.'
- unit: ane-bd125-w2-b-forty-two-addresses
  checked:
  - quran-60-mumtahana-abrahams-example-and-the-womens-pledge
  - quran-6-commandments
  - quran-4-wealth-household
  - quran-24-ifk-slander
  matches:
  - with: quran-60-mumtahana-abrahams-example-and-the-womens-pledge
    motif: series-of-negative-vows-theft-adultery-killing-lying
    refs:
    - BD125 W2:712
    - BD125 W2:713
    - BD125 W2:717
    - BD125 W2:740
    with_refs:
    - '60:12'
    relation: divergence
    record:
      agent:
      - the dead man
      - the believing women
      action:
      - declares he has not stolen, killed, lied or lain with a married woman
      - pledge not to steal, fornicate, kill their children or bring a forged slander
      recipient:
      - the 42 judges, one named judge per clause
      - the Prophet
      time:
      - after death, of past conduct
      - at the pledge, of future conduct
      quoted:
      - n ṯꜣy =j ... n smꜣ =j r(m)ṯ ... n ḏd =j grg ... n nk =j ḥm,t-ṯꜣy
      - lā yasriqna wa-lā yaznīna wa-lā yaqtulna awlādahunna wa-lā yaʾtīna bi-buhtānin
    note: 'A chain of negated clauses covering the same four matters: theft, sexual wrong, killing and lying. BD 125: n ṯꜣy =j ''I have not stolen'', n smꜣ =j r(m)ṯ ''I have not killed a man'', n ḏd =j grg ''I have not told lies'', n nk =j ḥm,t-ṯꜣy ''I have not lain with a married woman''. 60:12 yubāyiʿnaka ʿalā an lā yushrikna ... wa-lā yasriqna wa-lā yaznīna wa-lā yaqtulna awlādahunna wa-lā yaʾtīna bi-buhtānin yaftarīnahu. Past innocence declared to the judges of the dead, against a pledge for the future made to the Prophet; killing ''a man'' against killing ''their children''.'
- unit: ane-bd125-w2-c-address-gate-rubric
  checked:
  - quran-2-closing
  - quran-40-throne-bearers
  - quran-74-cloaked
  - quran-11-opening-throne-on-water
  matches:
  - with: quran-74-cloaked
    motif: feeding-the-poor-declared-at-judgment
    refs:
    - BD125 W2:759/2
    with_refs:
    - '74:43'
    - '74:44'
    relation: divergence
    record:
      agent:
      - the dead man ('I gave')
      - the damned in Saqar
      action:
      - declares he gave bread to the hungry
      - confess they did not feed the poor
      recipient:
      - the hungry, the thirsty, the naked
      - the poor (miskīn)
      quoted:
      - rḏi̯.n =j tʾ n ḥqr mw n jbi̯ ḥbs n ḥꜣw
      - wa-lam naku nuṭʿimu l-miskīn
      outcome:
      - he is justified and passes the gate
      - they are in Saqar
    note: 'At the judgment the dead state whether they fed the hungry. BD 125: rḏi̯.n =j tʾ n ḥqr mw n jbi̯ ḥbs n ḥꜣw ''I gave bread to the hungry, water to the thirsty, clothes to the naked'', as a claim that justifies. 74:42-44 mā salakakum fī saqar, qālū lam naku mina l-muṣallīn wa-lam naku nuṭʿimu l-miskīn: the same item as the confession of the damned.'
  - with: quran-11-opening-throne-on-water
    motif: seat-of-the-highest-over-the-waters
    refs:
    - BD125 W2:795/3
    with_refs:
    - '11:7'
    relation: echo
    record:
      object:
      - the dwelling of Osiris
      - God's throne ('arsh)
      place:
      - its floor is primeval flood-water (nwy)
      - on the water
      quoted:
      - zꜣt,w =f m nwy
      - wa-kāna ʿarshuhu ʿalā l-māʾ
    note: 'The seat of the highest rests on water. BD 125: the one to be announced to is he ''whose roof is fire, whose walls are living uraei, zꜣt,w =f m nwy, whose floor is the flood-water'': Osiris. 11:7 wa-huwa lladhī khalaqa s-samāwāti wa-l-arḍa fī sittati ayyāmin wa-kāna ʿarshuhu ʿalā l-māʾ. A hall of the judge of the dead against the throne of the creator before creation.'
