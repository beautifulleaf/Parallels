    note: 'Added in this late witness after the denial about the king: nn šnṯ =j ḥr jti̯ =j ''I have not complained against (reviled) my father''. 17:23 immā yablughanna ʿindaka l-kibara aḥaduhumā aw kilāhumā fa-lā taqul lahumā uffin wa-lā tanharhumā. The father alone against both parents in old age.'
  - with: quran-49-hujurat-etiquette-and-brotherhood
    motif: spying-forbidden
