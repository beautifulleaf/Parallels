    note: 'Blood as a calamity on Egypt. Ipuwer: jw ms jtr,w m snf swrj =tw jm =f ''yet the river is blood, and one drinks of it; one pushes people aside, thirsting for water'' (likely the corpses in the river, cf. 2:6/4). 7:133 fa-arsalnā ʿalayhimu ṭ-ṭūfāna wa-l-jarāda wa-l-qummala wa-ḍ-ḍafādiʿa wa-d-dama āyātin mufaṣṣalāt. A lament with no sender, against a sign sent by God; Q names no river.'
