    - '38:24'
    relation: divergence
    record:
      agent:
      - Nemtinakht, a steward's man of property
      - the brother with 99 ewes
      object:
      - the peasant's donkeys and goods
      - his brother's single ewe
      action:
      - schemes to steal them by a trick
      - demands it and overpowers him in speech
      quoted:
