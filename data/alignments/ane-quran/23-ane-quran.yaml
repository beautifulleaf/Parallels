# ANE x Quran side-by-side pass, chunk 23 (Book of the Dead 125 in ten witnesses; Doomed Prince; Eloquent Peasant; Harper's Songs; Book of the Heavenly Cow; Contendings of Horus and Seth; Admonitions of Ipuwer). Judged blind, from the Egyptian and the Arabic.
new_motifs:
