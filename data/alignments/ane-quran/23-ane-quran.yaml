    relation: divergence
    record:
      agent:
      - Osiris's fierce-faced messengers
      - the angels
      recipient:
      - every evildoer
      - those who disbelieved
      action:
      - fetch the heart of every evildoer
      - take them, striking their faces and backs
      quoted:
      - wpw,tj.pl ḥsꜣ ḥr.pl jw bn st snd n nṯr nb ... jni̯ ḥꜣ,tj n pꜣ n,tj nb ḥr jri̯.t sp.w.pl bjn.pl
      - yatawaffā lladhīna kafarū l-malāʾikatu yaḍribūna wujūhahum wa-adbārahum
    note: 'Fierce messengers sent to fetch the wicked at death. Osiris: his land ''is full of fierce-faced messengers who fear no god or goddess'', he will send them out ''and they will fetch the heart of everyone who does evil deeds''. 8:50 wa-law tarā idh yatawaffā lladhīna kafarū l-malāʾikatu yaḍribūna wujūhahum wa-adbārahum. The messengers serve the god of the dead as a threat to the gods; in Q they take the disbelievers'' souls.'
  - with: quran-80-frowned
    motif: who-made-grain-to-feed-whom
    refs:
    - HorusSeth 14_11
    - HorusSeth 15_2/3
    with_refs:
    - '80:24'
    - '80:27'
    - '80:32'
    relation: divergence
    record:
      agent:
      - Osiris (Re denies it)
      - God
      object:
      - barley and emmer
      - grain (ḥabb) and pasture
      recipient:
      - the gods and the 'small cattle' (humans) after them
      - you and your cattle
      quoted:
      - jnk jri̯ jt bd,tj r sꜥnḫ nṯr.pl mjnꜣ jꜣw,t.pl ḥr-sꜣ nṯr.pl
      - fa-anbatnā fīhā ḥabban ... matāʿan lakum wa-li-anʿāmikum
    note: 'Who made the grain grow, and to feed whom. Osiris: jnk jri̯ jt bd,tj r sꜥnḫ nṯr.pl mjnꜣ jꜣw,t.pl ḥr-sꜣ nṯr.pl ''it is I who made barley and emmer to keep the gods alive, and the cattle after the gods''; Re replies ''if you had never been born, barley and emmer would exist anyway''. 80:24-32 fa-l-yanẓuri l-insānu ilā ṭaʿāmihi, annā ṣababnā l-māʾa ṣabbā ... fa-anbatnā fīhā ḥabbā ... matāʿan lakum wa-li-anʿāmikum. Gods and humans-as-cattle, against humans and their cattle.'
