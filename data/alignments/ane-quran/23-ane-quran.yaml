    record:
      agent:
      - the dead man
      - the believing women
      action:
      - declares he has not stolen, killed, lied or lain with a married woman
      - pledge not to steal, fornicate, kill their children or bring a forged slander
      recipient:
      - the 42 judges, one named judge per clause
      - the Prophet
      time:
      - after death, of past conduct
      - at the pledge, of future conduct
      quoted:
      - n ṯꜣy =j ... n smꜣ =j r(m)ṯ ... n ḏd =j grg ... n nk =j ḥm,t-ṯꜣy
      - lā yasriqna wa-lā yaznīna wa-lā yaqtulna awlādahunna wa-lā yaʾtīna bi-buhtānin
    note: 'A chain of negated clauses covering the same four matters: theft, sexual wrong, killing and lying. BD 125: n ṯꜣy =j ''I have not stolen'', n smꜣ =j r(m)ṯ ''I have not killed a man'', n ḏd =j grg ''I have not told lies'', n nk =j ḥm,t-ṯꜣy ''I have not lain with a married woman''. 60:12 yubāyiʿnaka ʿalā an lā yushrikna ... wa-lā yasriqna wa-lā yaznīna wa-lā yaqtulna awlādahunna wa-lā yaʾtīna bi-buhtānin yaftarīnahu. Past innocence declared to the judges of the dead, against a pledge for the future made to the Prophet; killing ''a man'' against killing ''their children''.'
  - with: quran-17-commandments
    motif: killing-forbidden-except-by-right
    refs:
    - BD125 W7:18_1
    with_refs:
    - '17:33'
    relation: parallel
    record:
      action:
      - kills men
      - kills the soul
      quoted:
      - nn smꜣ =j r(m)ṯ.pl m-grg
      - wa-lā taqtulū n-nafsa llatī ḥarrama llāhu illā bi-l-ḥaqq
      outcome:
      - only unjust killing is denied
      - only killing by right is allowed
    note: 'The late witness qualifies the denial of killing exactly as the Quran qualifies the ban: nn smꜣ =j r(m)ṯ.pl m-grg ''I have not killed men unjustly (falsely)'', where the older pYuya has only n smꜣ =j r(m)ṯ; 17:33 wa-lā taqtulū n-nafsa llatī ḥarrama llāhu illā bi-l-ḥaqq.'
  - with: quran-17-commandments
