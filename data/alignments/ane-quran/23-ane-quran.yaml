    note: A man of means covets a poorer man's animals and the wrong goes before a judge. Nemtinakht sees the donkeys 'pleasing to his heart' and says ḥꜣ n =j šzp nb ꜥwꜣi̯ =j ḥn,w.pl n sḫ,tj pn jm =f 'would that I had some image by which I could steal this peasant's goods'. 38:23 inna hādhā akhī lahu tisʿun wa-tisʿūna naʿjatan wa-liya naʿjatun wāḥidatun fa-qāla akfilnīhā wa-ʿazzanī fī l-khiṭāb. Donkeys taken by a trap, a ewe by demand; a verdict delayed through nine petitions, a verdict at once (which turns out to be a test of David).
