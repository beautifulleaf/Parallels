    motif: fortified-dwelling-against-death
    refs:
    - DoomedPrince 4_5/2
    with_refs:
    - 4:78
    relation: divergence
    record:
      agent:
      - the king, for his son
      - those addressed
      instrument:
      - a stone house (pr n jnr) in the desert
      - lofty towers (burūj mushayyada)
      quoted:
      - pr n jnr ḥr ḫꜣs,t ... jw nn pri̯ pꜣ ẖrd,w r-bw-n-rʾ
      - aynamā takūnū yudrikkumu l-mawtu wa-law kuntum fī burūjin mushayyada
      outcome:
      - the prince grows up, goes out and his fates follow him
      - death overtakes them wherever they are
    note: A strong building cannot keep out a fated death. The king, told his son will die by crocodile, snake or dog, has a pr n jnr 'house of stone' built in the desert so that the boy need not go out. 4:78 aynamā takūnū yudrikkumu l-mawtu wa-law kuntum fī burūjin mushayyada. In the tale it is a father's attempt that the story then defeats; in Q it is stated as a rule.
  - with: quran-3-badr-uhud
    motif: fated-death-draws-a-man-out-of-his-house
    refs:
    - DoomedPrince 4_12/2
    - DoomedPrince 4_12/3
    with_refs:
    - 3:154
    relation: divergence
    record:
      agent:
      - the prince
      - those for whom death was written
      action:
      - asks to leave the house, being assigned to his fate
      - would have gone out to their places of death
      quoted:
      - tw≡j wḏ.kwj n pꜣ šꜣ,y ... j:jri̯.tw pꜣ nṯr jri̯.t pꜣ n,tj m jb =f
      - law kuntum fī buyūtikum la-baraza lladhīna kutiba ʿalayhimu l-qatlu ilā maḍājiʿihim
    note: 'Staying at home does not keep back a decreed death. The prince: ''what comes of my sitting here? tw≡j wḏ.kwj n pꜣ šꜣ,y I am assigned to the fate; let me act as I wish until the god does what is in his heart'', and goes out. 3:154 law kuntum fī buyūtikum la-baraza lladhīna kutiba ʿalayhimu l-qatlu ilā maḍājiʿihim. The fate (šꜣ,y) against killing ''written'' (kutiba) by God.'
