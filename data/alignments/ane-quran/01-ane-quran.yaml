  - unit: ane-etcsl-1-3-2-ebih-destroyed
    checked: [quran-7-sinai-theophany, quran-59-hashr-hypocrites-and-the-names, quran-13-signs-of-creation, quran-71-noah]
    matches:
      - with: quran-59-hashr-hypocrites-and-the-names
        motif: mountain-humbled-before-the-divine
        refs: ["ETCSL 1.3.2 152-159", "ETCSL 1.3.2 170"]
        with_refs: ["59:21"]
        relation: divergence
        record:
          agent: [Inana, God]
          object: [the mountain Ebih, a mountain]
          action: [tears the mountain apart, sends down the Quran on a mountain]
          quoted: ["giri17 ki-še3 nu-te-a-zu-še3 / nundum saḫar-ra nu-ur3-ra-zu-še3 / mu-ug5-ge-en ... mir-ĝu10 ... in-si-il-si-il-e", "la-raʾaytahu khāshiʿan mutaṣaddiʿan min khashyati llāh"]
          outcome: [killed and brought low because it did not bow, would be humbled and split apart for fear of God]
        note: "The mountain's posture before the divine and its splitting. Ebih is killed 'because you did not put your nose to the ground, did not rub your lips in the dust' and Inana's anger 'has torn the mountain apart'; in 59:21 a mountain would itself be humbled (khāshiʿ) and split (mutaṣaddiʿ) from fear of God. The refusal of homage is reversed."
  - unit: ane-etcsl-1-3-3-raven-and-palm
    checked: [quran-5-two-sons-of-adam, quran-19-mary-and-jesus, quran-16-blessings-of-creation, quran-16-daughters-and-the-bee]
    matches:
      - with: quran-5-two-sons-of-adam
        motif: raven-sent-to-do-human-work
        refs: ["ETCSL 1.3.3 49-55", "ETCSL 1.3.3 59-71"]
        with_refs: ["5:31"]
        relation: divergence
        record:
          agent: [Enki instructs a raven, God sends a raven]
          object: [raven, raven]
          action: [the raven plants in a trench in the ground, the raven scratches in the earth]
          quoted: ["mušen uga-gin7 a2 lu2 kiĝ2-kiĝ2-e ... a-ba-a igi im-mi-in-du8-a", "fa-baʿatha llāhu ghurāban yabḥathu fī l-arḍi li-yuriyahu kayfa yuwārī sawʾata akhīh"]
          outcome: [the first date palm and the shadouf, a man learns to bury his brother]
        note: "uga(mušen) / ghurāb. A raven works the ground at a god's command and does what men do: in the Sumerian it plants and pollinates the first date palm and works the shadouf ('a bird like the raven doing the work of man - who had ever seen such a thing?'); in 5:31 it shows Adam's son how to cover his brother's body, and he says yā waylatā a-ʿajaztu an akūna mithla hādhā l-ghurāb."
  - unit: ane-etcsl-1-3-3-shukaletuda-crime
    checked: [quran-16-daughters-and-the-bee, quran-71-noah, quran-7-creation-signs, quran-7-moses-pharaoh]
    matches:
      - with: quran-7-moses-pharaoh
        motif: land-s-water-turned-to-blood
        refs: ["ETCSL 1.3.3 131-135"]
        with_refs: ["7:133"]
        relation: divergence
        record:
          agent: [Inana, God]
          object: [blood, blood]
          recipient: [the black-headed people of the Land, Pharaoh's people]
          action: [fills the wells of the land with blood, sends blood among the signs]
          quoted: ["pu2 kalam-ma-ka uš2 bi2-ib-si-si ... saĝ gig2 uš2-am3 i3-na8-na8", "fa-arsalnā ʿalayhimu ... wa-d-dam"]
          outcome: [the culprit is not found, they grow arrogant (fa-stakbarū)]
        note: "uš2 (blood) / dam. Blood is sent on a whole people for the wrong of one: in Inana and Šu-kale-tuda it is the first plague, filling wells and orchards so that slave and slave-girl drink blood, while the culprit hides; in 7:133 it is the last of five signs on Pharaoh's people and the Quran does not say it was in the water."
  - unit: ane-etcsl-1-3-3-hiding-and-plagues
    checked: [quran-7-moses-pharaoh, quran-71-noah, quran-27-is-there-a-god-with-god, quran-72-jinn]
    matches:
      - with: quran-7-moses-pharaoh
        motif: series-of-plagues-on-a-land
        refs: ["ETCSL 1.3.3 168-176", "ETCSL 1.3.3 185-193", "ETCSL 1.3.3 214-220"]
        with_refs: ["7:133", "7:134", "7:135"]
        relation: divergence
        record:
          agent: [Inana, God]
          recipient: [the black-headed people of the Land, Pharaoh's people]
          number: [3, 5]
          object: [blood; storm and flood; blocked highways, flood; locusts; lice; frogs; blood]
          quoted: ["2(MAN)-kam-ma-še3 ... 3(EŠ5)-kam-ma-aš munus-e ... a-na im-gu-ul-u8-a-bi", "al-ṭūfāna wa-l-jarāda wa-l-qummala wa-ḍ-ḍafādiʿa wa-d-dama āyātin mufaṣṣalātin"]
          outcome: [the culprit hides among the people each time and is not found, the people promise each time to believe and break their word]
        note: "Plague after plague on a whole people for one party's wrong. Sumerian: 'a second time', 'a third time' Inana considers what to destroy; after each, Šu-kale-tuda's father sends him to hide among the city-dwellers. 7:133-135: five 'distinct signs' (āyāt mufaṣṣalāt); after each, Pharaoh's people ask Moses to pray (laʾin kashafta ʿannā r-rijz) and then break faith (idhā hum yankuthūn)."
