        refs: ["ETCSL 1.1.2 72-74"]
        with_refs: ["42:50"]
        relation: divergence
        record:
          agent: [Ninmah, God]
          action: [fashions a woman who cannot give birth, makes barren whom he wills]
          quoted: ["munus nu-u3-tud am3-ma-ni-in-dim2", "wa-yajʿalu man yashāʾu ʿaqīman"]
          outcome: [Enki decrees her a place in the queen's household, he knows and is able (ʿalīmun qadīr)]
        note: "Barrenness as the deliberate act of a creating deity. In Enki and Ninmah it is one of six flawed creatures made in a drunken contest and given a social role; in 42:49-50 it is set beside God's gift of daughters, sons or both as his free choice."
  - unit: ane-etcsl-1-1-2-umul
    checked: [quran-20-moses-pharaoh-magicians, quran-87-most-high, quran-4-creation-kinship-orphans, quran-23-death-barzakh-judgment]
    matches:
      - with: quran-87-most-high
        motif: neither-alive-nor-dead
        refs: ["ETCSL 1.1.2 101"]
        with_refs: ["87:13"]
        relation: echo
        record:
          agent: [Ninmah, God]
          object: [Umul, the most wretched one (al-ashqā)]
          action: [says he is neither alive nor dead, says he will neither die nor live]
          place: [null, the greatest fire]
          quoted: ["lu2 til3-la in-nu lu2 ug5-ga in-nu", "thumma lā yamūtu fīhā wa-lā yaḥyā"]
        note: "The same paired negation of living and dying (til3 / ug5; yaḥyā / yamūtu). It describes Umul, the helpless being Enki makes, who cannot speak, eat or stand; in 87:13 the damned in the fire. The Quran puts death first."
      - with: quran-20-moses-pharaoh-magicians
        motif: neither-alive-nor-dead
        refs: ["ETCSL 1.1.2 101"]
        with_refs: ["20:74"]
        relation: echo
        record:
          agent: [Ninmah, Pharaoh's magicians]
          object: [Umul, whoever comes to his Lord guilty]
          action: [says he is neither alive nor dead, says he will neither die nor live]
          place: [null, Gehenna]
          quoted: ["lu2 til3-la in-nu lu2 ug5-ga in-nu", "fa-inna lahu jahannama lā yamūtu fīhā wa-lā yaḥyā"]
        note: "The formula of 87:13 again, here spoken by Pharaoh's converted magicians of whoever comes to his Lord a criminal (mujrim)."
