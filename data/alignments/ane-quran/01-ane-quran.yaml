  - unit: ane-etcsl-1-1-4-eridug-temple
    checked: [quran-13-signs-of-creation, quran-16-blessings-of-creation, quran-79-pharaoh-and-cosmos, quran-71-noah, quran-18-companions-of-the-cave]
    matches:
      - with: quran-71-noah
        motif: humans-sprout-from-the-earth-like-plants
        refs: ["ETCSL 1.1.4 3"]
        with_refs: ["71:17"]
        relation: echo
        record:
          agent: [null, God]
          action: [people break through the earth like plants, God makes people grow from the earth as plants]
          object: [people, you]
          quoted: ["uĝ3-e u2-šim-gin7 ki in-dar-ra-ba", "wa-llāhu anbatakum mina l-arḍi nabātā"]
        note: "The same simile of human origin as sprouting: uĝ3 (people) like u2-šim (green plants) splitting the ground (ki dar); anbatakum ... nabātā. In Sumerian a time-clause of the primeval days; in 71:17-18 Noah's argument, followed by the return into the earth and the bringing forth again."
      - with: quran-18-companions-of-the-cave
        motif: no-one-changes-the-spoken-word
        refs: ["ETCSL 1.1.4 68"]
        with_refs: ["18:27"]
        relation: echo
        record:
          agent: [Isimud of Enki, God of himself]
          object: [what Enki says, his words]
          action: [declares the god's word unalterable, declares the god's words unalterable]
          quoted: ["dug4-ga {d}en-ki-ke4 šu nu-bal-e-de3", "lā mubaddila li-kalimātihi"]
        note: "šu bal, 'to alter, overturn', negated, against mubaddil, 'one who changes'. Said by Isimud to the temple's brickwork, in praise of its lord; in 18:27 of the Book revealed to the Prophet."
