  - unit: ane-etcsl-1-1-2-gods-toil
    checked: [quran-51-dhariyat-flee-to-god, quran-21-against-other-gods, quran-39-pure-religion, quran-16-blessings-of-creation, quran-50-qaf-two-recorders-and-hell-asks-more]
    matches:
      - with: quran-50-qaf-two-recorders-and-hell-asks-more
        motif: creation-toil-and-weariness
        refs: ["ETCSL 1.1.2 1-3", "ETCSL 1.1.2 9-11"]
        with_refs: ["50:38"]
        relation: divergence
        record:
          time: [the days when heaven and earth were created, six days of creating heaven and earth]
          agent: [the minor gods, God]
          action: [toil at the work and complain, create heaven and earth]
          quoted: ["diĝir tur-tur du2-lum im-il2-il2-e-ne ... zi-bi inim am3-ma-ĝar-re-ne", "wa-mā massanā min lughūb"]
          outcome: [the gods are worn out by the labour, no weariness touches him]
        note: "Same setting, the time heaven and earth were made: 'ud an ki-bi-ta ba-an-dim2-ma-ba ... the minor gods bore the toil (du2-lum), crushing clay they complained of this life'; 50:38 khalaqnā s-samāwāti wa-l-arḍa ... fī sittati ayyām wa-mā massanā min lughūb."
  - unit: ane-etcsl-1-1-2-namma-wakes-enki
    checked: [quran-2-adam-iblis, quran-15-iblis, quran-6-creation-rejecters, quran-23-creation-of-man-and-gifts, quran-2-throne-verse, quran-51-dhariyat-flee-to-god]
    matches:
      - with: quran-2-throne-verse
        motif: creator-asleep
        refs: ["ETCSL 1.1.2 12-16", "ETCSL 1.1.2 22"]
        with_refs: ["2:255"]
        relation: divergence
        record:
          agent: [Enki the creator, God]
          action: [lies asleep and does not wake, is not taken by slumber or sleep]
          quoted: ["ki-nu2-ni i3-nu2 u3 ku nu-um-zi-zi ... du5-mu-ĝu10 ki-nu2-zu zig3-ga", "lā taʾkhudhuhu sinatun wa-lā nawm"]
          outcome: [his creatures weep until his mother wakes him, he sustains all things (al-ḥayy al-qayyūm)]
        note: "Enki 'lay on his bed, not rising from his sleep' while the gods wept; Namma: 'my son, rise from your bed'. 2:255 al-ḥayyu l-qayyūm lā taʾkhudhuhu sinatun wa-lā nawm."
      - with: quran-51-dhariyat-flee-to-god
        motif: why-humans-were-created
        refs: ["ETCSL 1.1.2 23", "ETCSL 1.1.2 30", "ETCSL 1.1.2 37"]
        with_refs: ["51:56", "51:57"]
        relation: divergence
        record:
          agent: [Enki, God]
          action: [creates humankind, creates jinn and humans]
          recipient: [the gods, God]
          quoted: ["kiĝ2-sig10 dim3-me2-er-e-ne-ke4 ... du2-lum-bi ḫa-ba-tu-lu-ne; zub-sig3 diĝir-re-e-ne keše2", "wa-mā khalaqtu l-jinna wa-l-insa illā li-yaʿbudūn; mā urīdu minhum min rizqin wa-mā urīdu an yuṭʿimūn"]
          outcome: [humans carry the gods' basket so the gods are freed from toil, God wants no provision and no food from them]
        note: "The purpose clause of human creation: a substitute (kiĝ2-sig10) to bear the gods' toil and carry their basket (zub-sig3, the labour that brings the gods their food) against li-yaʿbudūn, with an explicit denial of the service ANE humans render: no rizq, not to feed me (an yuṭʿimūn)."
      - with: quran-2-adam-iblis
        motif: heavenly-beings-and-the-making-of-man
        refs: ["ETCSL 1.1.2 15-23", "ETCSL 1.1.2 30"]
        with_refs: ["2:30"]
        relation: divergence
        record:
          agent: [the weeping gods through Namma, the angels]
          action: [ask that a human be made, object to the making of a human]
          recipient: [Enki, God]
          quoted: ["kiĝ2-sig10 dim3-me2-er-e-ne-ke4 u3-mu-e-dim2", "a-tajʿalu fīhā man yufsidu fīhā ... wa-naḥnu nusabbiḥu bi-ḥamdik"]
          outcome: ["Enki agrees: the creature you planned will come into existence", "God overrules them: I know what you do not know"]
        note: "A scene of the divine world before humans: in Enki and Ninmah the gods want humans to take over their labour; in 2:30 the angels, who already glorify God, question his plan for a khalīfa on earth."
      - with: quran-15-iblis
        motif: human-formed-from-earth
        refs: ["ETCSL 1.1.2 31-32"]
        with_refs: ["15:26", "15:28"]
        relation: parallel
        record:
          action: [shapes the first humans from clay, shapes the first human from clay]
          object: [clay from above the abzu, ringing clay of altered black mud]
          quoted: ["šag4 im ugu abzu-ka u3-mu-e-ni-in-šar2", "ṣalṣālin min ḥamaʾin masnūn"]
        note: "Wet clay in both: 'knead the heart of the clay from above the abzu' (the subterranean fresh water); ḥamaʾ is dark wet mud. The birth-goddesses nip off pieces of clay; 15:28 innī khāliqun basharan min ṣalṣāl."
