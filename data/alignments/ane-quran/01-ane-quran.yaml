  - unit: ane-etcsl-1-8-1-3-v1-dream
    checked: [quran-3-misers-mockers, quran-29-emigrate-and-trust, quran-21-cosmic-signs-and-scales, quran-23-death-barzakh-judgment]
    matches:
      - with: quran-21-cosmic-signs-and-scales
        motif: flood-hero-and-immortality
        refs: ["ETCSL 1.8.1.3 1.E:14", "ETCSL 1.8.1.3 1.E:17-18"]
        with_refs: ["21:34", "21:35"]
        relation: parallel
        record:
          agent: [Enlil, God]
          recipient: [Gilgamesh, any human before the Prophet]
          action: [destines him for kingship but not for eternal life, gave no human everlasting life]
          quoted: ["nam-zu nam-lugal-še3 mu-de6 til3 da-ri2-še3 nu-mu-un-de6 ... niĝ2-gig ak nam-lu2-u18-lu-ke4", "wa-mā jaʿalnā li-basharin min qablika l-khuld ... kullu nafsin dhāʾiqatu l-mawt"]
          outcome: [death is the bane of being human since the cord was cut, every soul tastes death]
        note: "til3 da-ri2 ('lasting life') denied to the greatest king, as khuld is denied to every bashar; both then state death as the human lot. The same Sumerian phrase zi/til3 da-ri2 is what the flood hero alone receives (ETCSL 1.7.4 E:8), where the Quran admits no exception."
