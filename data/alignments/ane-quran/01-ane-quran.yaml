        motif: eating-like-livestock
        refs: ["ETCSL 1.7.6 1-2"]
        with_refs: ["47:12"]
        relation: echo
        record:
          agent: [men before grain, those who disbelieve]
          action: [eat like sheep, eat as cattle eat]
          quoted: ["uĝ3-e udu-gin7 u2 ka-ba mu-ni-ib-gu7", "wa-yaʾkulūna kamā taʾkulu l-anʿām"]
          outcome: [An brings grain down from heaven, the fire is their abode]
        note: "The same simile, with a different point: in the Sumerian it describes the primeval human state before barley and flax came down from heaven; in 47:12 it describes the unbelievers' enjoyment of this world."
  - unit: ane-etcsl-1-7-7-shumunda
