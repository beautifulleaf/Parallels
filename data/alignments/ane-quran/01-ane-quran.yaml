        refs: ["ETCSL 1.4.1 119-120", "ETCSL 1.4.1 125-126"]
        with_refs: ["15:44"]
        relation: parallel
        record:
          place: [the underworld (kur), Gehenna]
          number: [7, 7]
          object: [gates, gates]
          quoted: ["abula kur-ra 7-bi {ĝiš}si-ĝar-bi ḫe2-eb-us2", "lahā sabʿatu abwābin li-kulli bābin minhum juzʾun maqsūm"]
          outcome: [at each gate the goddess is stripped of one garment or ornament, to each gate a set portion of Iblis's followers is allotted]
        note: "'The seven gates of the underworld' (abula kur-ra 7-bi), bolted and opened one at a time, against Gehenna's seven gates (sabʿatu abwāb). What happens at each gate differs: Inana is stripped of one garment or ornament at each; the damned are divided among the gates."
      - with: quran-39-mercy-and-last-day
        motif: gatekeeper-questions-arrivals-at-netherworld
        refs: ["ETCSL 1.4.1 73-84"]
        with_refs: ["39:71"]
        relation: divergence
        record:
          agent: [Neti the chief doorman, the keepers of Gehenna]
          recipient: [Inana, the unbelievers driven in throngs]
          action: [asks who she is and why she has come, ask whether messengers did not come to them]
          quoted: ["a-na-am3 ba-du-un kur nu-gi4-še3", "a-lam yaʾtikum rusulun minkum"]
          outcome: [she is let in gate by gate, the gates are opened and they enter for ever]
        note: "The gatekeeper (i3-du8 gal kur-ra, Neti) questions the arrival at the gate: 'why have you come to the land of no return (kur nu-gi4)?'; in 39:71 the keepers (khazanatuhā) open the gates and question the damned. In the Sumerian the visitor herself demands entry ('open up, doorman')."
