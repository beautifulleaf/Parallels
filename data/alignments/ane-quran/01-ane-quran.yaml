  - unit: ane-etcsl-1-7-4-c-warning
    checked: [quran-11-noah, quran-71-noah, quran-38-job, quran-3-badr-uhud]
    matches:
      - with: quran-11-noah
        motif: how-the-flood-hero-is-warned
        refs: ["ETCSL 1.7.4 C:15-23"]
        with_refs: ["11:36", "11:37"]
        relation: divergence
        record:
          agent: [a god speaking to a wall, God]
          recipient: [Zi-ud-sura overhears, Nuh]
          action: [warns of the flood indirectly, reveals the end of his people and orders the ark]
          quoted: ["iz-zi-da inim ga-ra-ab-dug4 ... numun nam-lu2-ulu3 ḫa-lam-e-de3", "wa-ūḥiya ilā nūḥin ... wa-ṣnaʿi l-fulka bi-aʿyuninā wa-waḥyinā wa-lā tukhāṭibnī fī lladhīna ẓalamū innahum mughraqūn"]
          outcome: [the assembly's sworn decision is kept secret and passed on by indirection, Nuh is told directly and forbidden to plead for the wrongdoers]
        note: "In the Sumerian the gods have sworn an oath (mu an den-lil2 ... pad3) and the warning reaches the pious king only as speech to a side-wall (iz-zi-da) he overhears, in 'something that was not a dream'. In 11:36-37 God reveals the decision to Nuh (ūḥiya), gives the order to build, and closes the door to intercession."
      - with: quran-71-noah
        motif: stance-on-the-decreed-destruction
        refs: ["ETCSL 1.7.4 C:7", "ETCSL 1.7.4 C:23"]
        with_refs: ["71:26", "71:27"]
        relation: divergence
        record:
          agent: [holy Inana, Nuh]
          action: [laments for the people, asks God to leave no unbeliever on the earth]
          object: [the seed of mankind, the unbelievers and their offspring]
          quoted: ["kug {d}inana-ke4 uĝ3-bi-še3 a-nir mu-un-ĝa2-ĝa2 ... numun nam-lu2-ulu3 ḫa-lam-e-de3", "rabbi lā tadhar ʿalā l-arḍi mina l-kāfirīna dayyārā ... wa-lā yalidū illā fājiran kaffārā"]
        note: "The destruction concerns offspring on both sides: the gods decide that 'the seed of mankind' (numun nam-lu2-ulu3) is to be destroyed and Inana laments (a-nir) for the people; Nuh himself asks that none be left, since they would beget only the wicked."
  - unit: ane-etcsl-1-7-4-d-flood
    checked: [quran-71-noah, quran-26-noah, quran-25-destroyed-peoples, quran-11-noah, quran-69-haqqa-destroyed-peoples-and-the-throne]
    matches:
      - with: quran-69-haqqa-destroyed-peoples-and-the-throne
        motif: destroying-storm-of-seven-days-and-nights
        refs: ["ETCSL 1.7.4 D:1-5"]
        with_refs: ["69:6", "69:7"]
        relation: divergence
        record:
          agent: [all the windstorms and the flood, a raging cold wind]
          time: [seven days and seven nights, seven nights and eight days]
          number: [7 and 7, 7 and 8]
          recipient: [the Land, ʿAd]
          quoted: ["im-ḫul-im-ḫul tum9 si-si-ig du3-a-bi ... ud 7-am3 ĝi6 7-am3", "bi-rīḥin ṣarṣarin ʿātiyatin sakhkharahā ʿalayhim sabʿa layālin wa-thamāniyata ayyāmin ḥusūman"]
          outcome: [the huge boat survives and the sun god enters it, the people lie felled like hollow palm trunks]
        note: "The Sumerian flood is a windstorm (im-ḫul, 'evil wind', and gales) lasting ud 7 ĝi6 7. The Quran's seven-and-eight storm is the wind sent on ʿAd, not the flood; the Quran's flood itself has no duration."
  - unit: ane-etcsl-1-7-4-e-immortality
    checked: [quran-3-annunciation-jesus, quran-11-noah, quran-23-noah, quran-29-emigrate-and-trust, quran-21-cosmic-signs-and-scales]
    matches:
      - with: quran-21-cosmic-signs-and-scales
        motif: flood-hero-and-immortality
        refs: ["ETCSL 1.7.4 E:7-8"]
        with_refs: ["21:34"]
        relation: divergence
        record:
          agent: [An and Enlil, God]
          recipient: [Zi-ud-sura, any human before the Prophet]
          action: [give eternal life like a god, did not give everlasting life]
          quoted: ["til3 diĝir-gin7 mu-un-na-šum2-mu / zi da-ri2 diĝir-gin7 mu-un-na-ab-ed3-de3", "wa-mā jaʿalnā li-basharin min qablika l-khuld"]
          outcome: [he lives on in Dilmun where the sun rises, every soul tastes death (21:35)]
        note: "The flood hero is the one man made deathless (zi da-ri2, 'lasting life'); 21:34-35 says no human before Muhammad was given khuld and kullu nafsin dhāʾiqatu l-mawt. The Quran's flood hero lives 950 years among his people (29:14) and is not made immortal."
      - with: quran-11-noah
        motif: blessing-of-the-flood-hero-on-landing
        refs: ["ETCSL 1.7.4 E:3-11"]
        with_refs: ["11:48"]
        relation: divergence
        record:
          agent: [An and Enlil, God]
          recipient: [Zi-ud-sura, Nuh and the nations with him]
          action: [treat him kindly as he prostrates after the animals disembark, tell him to descend]
          quoted: ["niĝ2-gilim-ma ki-ta ed3-de3 ... til3 diĝir-gin7 mu-un-na-šum2-mu", "ihbiṭ bi-salāmin minnā wa-barakātin ʿalayka wa-ʿalā umamin mimman maʿak"]
          outcome: [he alone is removed to Dilmun for preserving the animals and the seed of mankind, peace and blessings on him and nations from those with him; other nations will be punished]
        note: "The scene at the descent from the vessel (ed3, 'go up/out'; ihbiṭ, 'go down'). The Sumerian reward is personal and divine life; the Quranic one is salām and barakāt extended to the peoples descended from those aboard, with a warning about later peoples (wa-umamun sa-numattiʿuhum)."
  - unit: ane-etcsl-1-7-6-grain
    checked: [quran-78-the-tiding, quran-73-enwrapped, quran-6-signs-in-nature, quran-47-muhammad-battle-and-rivers]
    matches:
