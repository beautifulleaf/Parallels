# ANE x Quran side-by-side pass, chunk 1 (ETCSL 1.1.1 - 1.8.1.3). Judged blind, from the originals.
new_motifs:
  fresh-and-salt-water-by-divine-act: {label: "A god's act sets fresh (sweet) water against salt (bitter) water", cluster: nature}
  names-recited-at-a-superior-s-question: {label: "A superior asks 'what are these?' and a subordinate tells their names one by one", cluster: creation}
  creator-asleep: {label: "Whether the creator god sleeps", cluster: deity}
  why-humans-were-created: {label: "What humans were created for: to labour for and feed the gods, or to worship", cluster: creation}
  creation-toil-and-weariness: {label: "Whether the work of creation brings toil and weariness on the divine", cluster: creation}
  neither-alive-nor-dead: {label: "A being is 'neither living nor dead' (formula)", cluster: death}
  deity-makes-a-woman-barren: {label: "A deity deliberately makes a human barren", cluster: creation}
  no-one-changes-the-spoken-word: {label: "'Who can change the word that has gone out?' / 'none can change his words'", cluster: deity}
  heavenly-beings-and-the-making-of-man: {label: "The divine beings ask for, or object to, the making of humans", cluster: creation}
  months-in-their-houses: {label: "Months (or the moon) are set in their houses or stations so that the years can be counted", cluster: time}
  humans-sprout-from-the-earth-like-plants: {label: "People sprouted from the earth like plants", cluster: creation}
  raven-sent-to-do-human-work: {label: "A god sends or instructs a raven, which works the ground as a man would", cluster: animals}
  land-s-water-turned-to-blood: {label: "A deity fills a land with blood as a plague", cluster: judgment}
  series-of-plagues-on-a-land: {label: "A deity sends plague after plague on a land while the guilty hold out", cluster: judgment}
  mountain-humbled-before-the-divine: {label: "A mountain bows, or fails to bow, before the divine, and is broken", cluster: nature}
  seven-gates-of-the-netherworld: {label: "The netherworld (hell) has seven gates", cluster: afterlife}
  gatekeeper-questions-arrivals-at-netherworld: {label: "At the gate of the netherworld the gatekeepers question those who arrive", cluster: afterlife}
  animal-informant-brings-hidden-knowledge: {label: "A small creature brings the ruler knowledge he or she lacks, and its fate depends on it", cluster: animals}
  how-the-flood-hero-is-warned: {label: "How the flood hero learns of the coming destruction", cluster: flood}
  stance-on-the-decreed-destruction: {label: "A figure's response to the decision to destroy the people: lament or prayer for it", cluster: flood}
  destroying-storm-of-seven-days-and-nights: {label: "A destroying storm rages for seven days and seven (or eight) nights", cluster: flood}
  flood-hero-and-immortality: {label: "Whether a human, such as the flood hero, is granted eternal life", cluster: death}
  blessing-of-the-flood-hero-on-landing: {label: "What the flood hero receives when he leaves the vessel", cluster: flood}
  eating-like-livestock: {label: "People eat as sheep or cattle eat", cluster: animals}
  rain-of-burnt-clay: {label: "Burnt clay (potsherds, stones of clay) rains from the sky", cluster: judgment}
reviewed:
  - unit: ane-etcsl-1-1-1-dilmun-pristine
    checked: [quran-15-iblis, quran-35-heirs-of-book, quran-89-dawn, quran-11-opening-throne-on-water]
    matches: []
  - unit: ane-etcsl-1-1-1-dilmun-water
    checked: [quran-25-signs-shadow-seas, quran-35-originator, quran-29-emigrate-and-trust, quran-2-call-to-worship]
    matches:
      - with: quran-25-signs-shadow-seas
        motif: fresh-and-salt-water-by-divine-act
        refs: ["ETCSL 1.1.1 47", "ETCSL 1.1.1 58"]
        with_refs: ["25:53"]
        relation: divergence
        record:
          agent: [Enki, God]
          object: [salt pools and fresh water, salt sea and fresh sea]
          action: [turns salt water into fresh water, lets the fresh and salt seas flow side by side]
          quoted: ["pu2 a sis-a-zu pu2 a dug3-ga ḫe2-em", "hādhā ʿadhbun furātun wa-hādhā milḥun ujāj"]
          outcome: [the salt water is gone, both remain with a barrier (barzakh) between]
        note: "Sumerian a sis (bitter/salt water) against a dug3 (sweet water); Arabic milḥ ujāj against ʿadhb furāt. In Dilmun the god abolishes the salt water; in 25:53 God keeps both and sets a barzakh and ḥijr maḥjūr between them."
      - with: quran-35-originator
        motif: fresh-and-salt-water-by-divine-act
        refs: ["ETCSL 1.1.1 47", "ETCSL 1.1.1 49A-49P"]
        with_refs: ["35:12"]
        relation: divergence
        record:
          object: [salt pools and fresh water, salt sea and fresh sea]
          action: [turns salt water into fresh water, keeps the fresh and the salt sea unequal]
          quoted: ["pu2 a sis-a-zu pu2 a dug3-ga ḫe2-em", "hādhā ʿadhbun furātun sāʾighun sharābuhu wa-hādhā milḥun ujāj"]
          instrument: [large ships bring the goods of the lands, ships cleave the sea to seek his bounty]
        note: "The same pair, sweet against bitter water, with ships of wealth in both: Enki makes Dilmun's salt pools sweet and has ships (ma2 gal-gal) bring gold, cornelian and wood; 35:12 keeps the two seas apart (mā yastawī l-baḥrān), with fresh meat and ornaments (ḥilya) from both and ships (al-fulk mawākhir) seeking God's bounty."
