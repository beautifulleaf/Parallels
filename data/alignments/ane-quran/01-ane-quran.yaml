  - unit: ane-etcsl-1-1-1-plants-eaten
    checked: [quran-2-adam-iblis, quran-20-adam-iblis, quran-7-adam-iblis]
    matches:
      - with: quran-2-adam-iblis
        motif: names-recited-at-a-superior-s-question
        refs: ["ETCSL 1.1.1 200-201", "ETCSL 1.1.1 202-219"]
        with_refs: ["2:31", "2:32", "2:33"]
        relation: divergence
        record:
          agent: [Enki asks, God asks]
          recipient: [his minister Isimud, the angels and then Adam]
          action: [asks the names of the things before him, asks the names of the things before them]
          quoted: ["a-na-am3 ne-e ... lugal-ĝu10 u2-ĝiš", "anbiʾūnī bi-asmāʾi hāʾulāʾi ... anbiʾhum bi-asmāʾihim"]
          outcome: [Isimud names each plant and Enki eats it, the angels cannot and Adam names them]
        note: "The asker does not know: Enki says 'I have not determined the destiny of these plants, what is this one?' and Isimud answers 'my master, the tree plant' for each. In 2:31-33 the asker knows (innī aʿlamu ghayba s-samāwāt): God tests the angels, who say lā ʿilma lanā, and Adam, whom God taught the names, tells them."
