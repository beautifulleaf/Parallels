  matches:
  - with: quran-50-qaf-two-recorders-and-hell-asks-more
    motif: creation-toil-and-weariness
    refs: ['Atr OB I:1-4']
    with_refs: ['50:38']
    relation: response
    record:
      agent: [the gods, God]
      action: [bear the labour of making the world, created heavens and earth in six days]
      outcome: [the labour is heavy and the misery too much, no weariness touched him]
      quoted: [dullum kabit mād šapšāqum, wa-mā massanā min lughūbin]
    note: I:1-4 inūma ilū awīlum ublū dullam izbilū šupšikkam ... dullum kabit mād šapšāqum ('when the gods were man they bore the labour ... the labour was heavy, the misery too much'), then forty years of digging the rivers (I:37); Q 50:38 created the heavens and the earth in six days wa-mā massanā min lughūbin, 'and no weariness touched us'.
- unit: ane-atr-ob-1-strike
  checked: [quran-2-throne-verse, quran-17-polemic-and-resurrection, quran-21-against-other-gods]
  matches:
  - with: quran-2-throne-verse
    motif: creator-asleep
    refs: ['Atr OB I:70-79']
    with_refs: ['2:255']
    relation: response
    record:
      agent: [Enlil, God]
      action: [sleeps in bed and does not know, is seized by neither slumber nor sleep]
      outcome: [woken by his vizier when his house is surrounded, knows what is before and behind them]
      quoted: [ēkur lawi ellil ul īde ... nusku iddeki bēlšu ina mayyāli ušetbīšu, lā taʾkhudhuhu sinatun wa-lā nawmun ... yaʿlamu mā bayna aydīhim wa-mā khalfahum]
    note: 'I:70-79: at midnight Ekur is surrounded wa-ellil ul īde, ''and Enlil did not know''; Kalkal wakes Nusku, Nusku wakes his lord and gets him out of bed (ina mayyāli ušetbīšu). Q 2:255 lā taʾkhudhuhu sinatun wa-lā nawmun ... yaʿlamu mā bayna aydīhim wa-mā khalfahum: the high god who sleeps and does not know against the God whom no sleep takes and who knows.'
