    refs: ['Ee SB V:3-4']
    with_refs: ['9:36']
    relation: parallel
    record:
      agent: [Marduk, God]
      action: [fixes the months of the year at creation, fixed the number of months on the day he created heavens and earth]
      number: [12, 12]
      quoted: [uʾaddi šatta ... šinšeret arhī, inna ʿiddata sh-shuhūri ʿinda llāhi thnā ʿashara shahran ... yawma khalaqa s-samāwāti wa-l-arḍa]
    note: 'V:3-4 uʾaddi šatta miṣrāti umaṣṣir / šinšeret arhī kakkabī šulušā ušziz, ''he marked the year ... set up twelve months of three stars each'', part of ordering the sky after the battle; Q 9:36 inna ʿiddata sh-shuhūri ʿinda llāhi thnā ʿashara shahran fī kitābi llāhi yawma khalaqa s-samāwāti wa-l-arḍa. Divergence in the use: the Quran ties it to the four sacred months and the ban on intercalation (9:37).'
  - with: quran-10-opening-creation
    motif: months-in-their-houses
    refs: ['Ee SB V:12-13', 'Ee SB V:15-22']
    with_refs: ['10:5']
    relation: parallel
    record:
      agent: [Marduk, God]
      action: [assigns the moon its phases, measured out stations for the moon]
      object: [the moon, the moon]
      outcome: [to mark the days of the month, to know the number of years and the reckoning]
      quoted: [nannāra uštēpâ ... ana uddû ūmī, wa-l-qamara nūran wa-qaddarahu manāzila li-taʿlamū ʿadada s-sinīna wa-l-ḥisāba]
    note: V:12-13 nannāra uštēpâ ... uʾaddīšum-ma šuknat mūši ana uddû ūmī, 'he made the moon appear ... assigned it to mark the days', then horns at the start, half-crown on the 7th, full at mid-month, waning to the 30th (V:15-22); Q 10:5 wa-l-qamara nūran wa-qaddarahu manāzila li-taʿlamū ʿadada s-sinīna wa-l-ḥisāba.
