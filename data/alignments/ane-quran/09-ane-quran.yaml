# ANE x Quran side-by-side pass, chunk 9 (Anzu, Atra-hasis, Bit meseri, Catalogue of Texts and Authors, Counsels of Wisdom, Dialogue of Pessimism, Enuma elish, Elevation of Babylon, Erra I, Etana). Judged blind, from the originals.
new_motifs:
  burden-borne-by-humankind:
    label: A burden that higher beings refuse or throw off is laid on, or taken up by, humankind
    cluster: creation
  divine-element-in-the-first-human:
    label: 'What divine element is put into the clay of the first human: a slain god''s flesh, blood and spirit, or God''s breath'
    cluster: creation
  obeisance-at-the-making-of-man:
    label: 'Heavenly beings do obeisance when the first human has been made: to the maker or to the man'
    cluster: creation
  number-of-the-first-humans:
    label: 'How many first humans are made: seven pairs, or one soul and its mate'
    cluster: creation
  the-two-waters-meet:
    label: Two waters, the sweet and the salt sea, meet or mingle
    cluster: nature
  one-mass-split-into-heaven-and-earth:
    label: Heaven (and earth) made by splitting one primeval mass or body in two
    cluster: creation
  guards-posted-in-the-sky:
    label: 'Watchmen or guards are posted in the sky at its making: what they keep in or out'
    cluster: creation
  defeated-foe-kept-as-a-sign-for-later-times:
    label: The defeated foe (its image or its body) is kept as a sign (ittu / aya) for those who come after
    cluster: kingship
  whatever-name-is-called-the-one-god-answers:
    label: 'Whatever name is pronounced, it belongs to the one god: ''he is our god'' / ''his are the beautiful names'''
    cluster: deity
  human-made-from-congealed-blood-and-bones:
    label: Man is made from compacted (clotted) blood and then bones
    cluster: creation
  rebel-s-string-of-i-will-vows:
    label: A rebel against the high god vows, in a string of first-person 'I will' clauses, to take and to command
    cluster: deity
  ancient-sage-raised-to-heaven:
    label: One of a list of ancient sages or prophets ascends, or is raised, to heaven or a high place
    cluster: prophecy
  divine-beings-at-a-man-s-right-and-left:
    label: Divine beings are stationed at a man's right and at his left
    cluster: deity
  number-of-the-heavens:
    label: How many heavens there are
    cluster: creation
  looking-at-ancient-ruins:
    label: 'Go up on (travel through) the ruins of the ancients and look: what the sight teaches'
    cluster: wisdom
  one-grain-given-returns-manifold:
    label: A single grain given (to the god, in God's way) returns many times over
    cluster: wisdom
  sky-split-and-stars-displaced:
    label: The seams of heaven come apart, the stars leave their places and the waters break out
    cluster: eschatology
  tree-rooted-below-reaching-heaven:
    label: A tree whose root reaches deep down and whose top reaches heaven
    cluster: nature
