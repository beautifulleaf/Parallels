- unit: ane-atr-ob-1-creation-of-man
  checked: [quran-15-iblis, quran-51-dhariyat-flee-to-god, quran-71-noah, quran-7-adam-iblis, quran-33-hour-and-trust, quran-2-adam-iblis]
  matches:
  - with: quran-51-dhariyat-flee-to-god
    motif: why-humans-were-created
    refs: ['Atr OB I:190-193', 'Atr OB I:236-237']
    with_refs: ['51:56', '51:57']
    relation: divergence
    record:
      agent: [the birth goddess, God]
      action: [creates man, created jinn and humans]
      outcome: [man bears the gods' yoke and drudgery, they worship; God wants no provision nor to be fed]
      quoted: [abšānam libil šipir ellil šupšik ilim awīlum lišši, illā li-yaʿbudūni mā urīdu minhum min rizqin wa-mā urīdu an yuṭʿimūni]
    note: 'I:190-193 binî-ma lullâ libil abšānam ... šupšik ilim awīlum lišši (''create a human, let him bear the yoke ... let man carry the drudgery of god''); I:237 šupšikkakunu awīlam ēmid. Q 51:56-57 wa-mā khalaqtu l-jinna wa-l-insa illā li-yaʿbudūni / mā urīdu minhum min rizqin wa-mā urīdu an yuṭʿimūni: service is kept (ʿ-b-d) but the work of supplying and feeding the deity is expressly denied.'
  - with: quran-15-iblis
    motif: divine-element-in-the-first-human
    refs: ['Atr OB I:206-213']
    with_refs: ['15:28', '15:29']
    relation: divergence
    record:
      agent: [Nintu, God]
      action: [mixes clay, shapes man from clay]
      object: [clay, clay of black mud]
      instrument: [the flesh and blood of a slain god, God's own spirit breathed in]
      quoted: [ina šīrīšu u dāmīšu nintu liballil ṭiṭṭam ... ina šīr ilim eṭemmum libši, ṣalṣālin min ḥamaʾin masnūnin ... wa-nafakhtu fīhi min rūḥī]
    note: 'I:206-211: with the flesh and blood of the slaughtered god Nintu mixes the clay, god and man are mixed in it, and ''from the flesh of the god let a spirit (eṭemmu) remain''; Q 15:28-29 man from ṣalṣālin min ḥamaʾin masnūnin, then fa-idhā sawwaytuhu wa-nafakhtu fīhi min rūḥī: clay plus something divine in both, but a slain god''s flesh against God''s breath.'
  - with: quran-33-hour-and-trust
    motif: burden-borne-by-humankind
    refs: ['Atr OB I:190-193', 'Atr OB I:236-237']
    with_refs: ['33:72']
    relation: divergence
    record:
      agent: [the gods, 'the heavens, the earth and the mountains']
      action: [throw off their labour, refuse to bear the trust]
      object: [the yoke and drudgery, the trust]
      recipient: [man, man]
      quoted: [abšānam libil ... awīlum lišši, fa-abayna an yaḥmilnahā ... wa-ḥamalahā l-insānu]
    note: 'In Atra-hasis the Igigi refuse their labour (I:39-69) and man is made to bear it: libil abšānam ... awīlum lišši, ''let him bear the yoke ... let man carry'' (I:190-193), ''I have imposed your drudgery on man'' (I:237). Q 33:72 the trust is offered to heavens, earth and mountains, fa-abayna an yaḥmilnahā wa-ashfaqna minhā wa-ḥamalahā l-insānu: refused by the higher beings, carried (ḥ-m-l / wabālu, našû) by man; here man takes it up, there it is imposed.'
  - with: quran-2-adam-iblis
    motif: heavenly-beings-and-the-making-of-man
    refs: ['Atr OB I:189-193', 'Atr OB I:214', 'Atr OB I:215–216']
    with_refs: ['2:30']
    relation: divergence
    record:
      agent: [the gods in assembly, God]
      action: [propose the making of man, announces a vicegerent on earth]
      recipient: [the birth goddess, the angels]
      outcome: [the Anunna answer 'yes', the angels object]
      quoted: [binî-ma lullâ ... ina puhri īpulū annam, innī jāʿilun fī l-arḍi khalīfatan qālū a-tajʿalu fīhā man yufsidu fīhā]
    note: 'I:189-193 the gods ask the birth goddess ''create a human, let him bear the yoke''; I:214-216 the great Anunna answer annam, ''yes'', in the assembly. Q 2:30 God announces innī jāʿilun fī l-arḍi khalīfatan and the angels object a-tajʿalu fīhā man yufsidu fīhā wa-yasfiku d-dimāʾ: in both the making of man is put before the heavenly assembly; assent against objection, and a substitute labourer against a khalīfa.'
- unit: ane-atr-ob-1-birth-and-marriage
  checked: [quran-23-creation-of-man-and-gifts, quran-49-hujurat-etiquette-and-brotherhood, quran-42-shura-revelation-one-religion, quran-39-pure-religion, quran-38-adam-iblis, quran-15-iblis]
  matches:
  - with: quran-38-adam-iblis
    motif: creator-boasts-my-hands-made-it
    refs: ['Atr OB I:289']
    with_refs: ['38:75']
    relation: echo
    record:
      agent: [the birth goddess, God]
      action: [made man with her hands, created man with his two hands]
      quoted: [anākū-mi abni īpušā qātāya, li-mā khalaqtu bi-yadayya]
    note: I:289 anākū-mi abni īpušā qātāya, 'I am the one who created, my hands have made it' (the birth goddess over the first birth); Q 38:75 mā manaʿaka an tasjuda li-mā khalaqtu bi-yadayya, 'what I created with my two hands' (of Adam). The maker's hands are named in the making of man on both sides.
  - with: quran-15-iblis
    motif: obeisance-at-the-making-of-man
    refs: ['Atr OB I:240-241']
    with_refs: ['15:29', '15:30']
    relation: divergence
    record:
      agent: [the gods, the angels]
      action: [run and kiss her feet, fall prostrate]
      recipient: [the birth goddess who made man, the man made]
      quoted: [iddarrū-ma unaššiqū šēpīša, fa-qaʿū lahu sājidīna ... fa-sajada l-malāʾikatu kulluhum]
    note: 'Once Mami reports the man made (I:233-239) the gods iddarrū-ma unaššiqū šēpīša, ''ran and kissed her feet'' (I:241); Q 15:29-30 when God has shaped man and breathed his spirit in, the angels are told fa-qaʿū lahu sājidīna and fa-sajada l-malāʾikatu kulluhum: the obeisance at the making of man goes to the maker in one text and to the man in the other.'
