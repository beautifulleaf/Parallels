      object: [the moon, the moon]
      action: [prescribes waxing and waning by set stages, measured out its stations]
      outcome: [wanes in reverse and joins the sun at month's end, returns like an old palm stalk]
      quoted: [qarnī nabâta ... ina sebūti agâ mašla ... šutakṣibam-ma bini arkāniš, qaddarnāhu manāzila ḥattā ʿāda ka-l-ʿurjūni l-qadīmi]
    note: 'V:15-22 the moon is told its course month by month: ''shine with two horns ... on the 7th day a half crown ... on the 15th in opposition ... wane in reverse''; Q 36:39 wa-l-qamara qaddarnāhu manāzila ḥattā ʿāda ka-l-ʿurjūni l-qadīmi: the moon''s shape is decreed stage by stage, ending as the thin crescent.'
