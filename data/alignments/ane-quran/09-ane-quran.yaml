- unit: ane-atr-mb-priv-boat
  checked: [quran-11-noah, quran-23-noah, quran-54-qamar-moon-split-and-noah, quran-71-noah]
  matches:
  - with: quran-11-noah
    motif: animals-in-pairs
    refs: ['Atr MB Priv:51-52']
    with_refs: ['11:40']
    relation: parallel
    record:
      agent: [Atra-hasis, Nuh]
      action: [takes animals into the boat two by two, takes animals into the ship two by two]
      object: [wild animals of the steppe, of every kind]
      number: [2, 2]
      quoted: [nammaštûm ina ṣērim šanâ eleppam, min kullin zawjayni thnayni]
    note: Priv:51-52 u nammaštûm ina ṣērim šanâ eleppam ('wild animals of the steppe, two by two, into the boat'); Q 11:40 iḥmil fīhā min kullin zawjayni thnayni ('load in it two of every kind, a pair'). The Atra-hasis text has the pairs, which the Gilgamesh flood tablet does not.
  - with: quran-11-noah
    motif: family-saved
    refs: ['Atr MB Priv:35-37']
    with_refs: ['11:40']
    relation: parallel
    record:
      agent: [Atra-hasis, Nuh]
      action: [brings his family into the boat, takes his family into the ship]
      object: ['kith and kin, in-laws, pregnant women', 'his family, except the one decreed']
      quoted: [ana eleppim īrubū ... emūtim, wa-ahlaka illā man sabaqa ʿalayhi l-qawl]
    note: 'Priv:35-37 kith and kin, in-laws (emūtim) and the pregnant enter the boat; Q 11:40 wa-ahlaka illā man sabaqa ʿalayhi l-qawlu: the Quran excepts one of the family (the son of 11:42-43) and adds ''whoever believed''.'
  - with: quran-54-qamar-moon-split-and-noah
    motif: vessel-of-planks-and-fastenings
    refs: ['Atr MB Priv:6–7', 'Atr MB Priv:8-9', 'Atr MB Priv:13-20']
    with_refs: ['54:13']
    relation: divergence
    record:
      object: [the boat, the ship]
      instrument: ['thirty ribs, 3,600 pillars, bitumen', planks and fastenings]
      number: ['30 ribs, 3,600 pillars, 60 kor of bitumen', null]
      quoted: [eṣerti kippātim ... šalāšā ṣēlī ... ištēn šūši iṭṭâm, dhāti alwāḥin wa-dusurin]
    note: 'Atra-hasis is told to draw the boat on a circular plan (eṣerti kippātim, length equal to breadth), sets 30 ribs and 3,600 pillars and caulks it with 60 kor of bitumen inside and out (Priv:6-20); Q 54:13 names the ark only as dhāti alwāḥin wa-dusurin, ''the one of planks and fastenings (fibres/nails)'': no plan, no dimensions, no pitch.'
  - with: quran-71-noah
    motif: stance-on-the-decreed-destruction
    refs: ['Atr MB Priv:49-50']
    with_refs: ['71:26']
    relation: divergence
    record:
      agent: [Enlil, Nuh]
      action: [swears total annihilation, prays that none be left]
      object: [the people, the unbelievers on earth]
      place: [from his throne, null]
      quoted: ['ellil ina kussî [ittam]e gamartam u armūtam', rabbi lā tadhar ʿalā l-arḍi mina l-kāfirīna dayyāran]
    note: 'Priv:49-50 Enlil on his throne takes an oath of ''annihilation and desolation'' (gamartam u armūtam; verb restored); Q 71:26 it is the flood hero himself who asks: rabbi lā tadhar ʿalā l-arḍi mina l-kāfirīna dayyāran, ''leave not one of the unbelievers on the earth'': the total destruction is sought by the hero, not sworn by the god, and limited to the unbelievers.'
