        note: "Q: luʿina lladhīna kafarū min banī Isrāʾīla ʿalā lisāni Dāwūda wa-ʿĪsā bni Maryama. Ps (lə-Dāwid): yəhî-šulḥānām lifnêhem lə-fāḥ ... tənāh-ʿāwōn ʿal-ʿăwōnām ... yimmāḥû mis-sēfer ḥayyîm. The Davidic curse in the Psalm targets the speaker's persecutors; Q applies it to the unbelievers of Israel."
