  - unit: quran-5-oaths-wine-game
    checked: [hb-lev-5-graduated-and-guilt-offerings, hb-num-6-nazirite, hb-hos-4-lawsuit-priests, hb-exod-34-thirteen-attributes-covenant-renewal, hb-deut-5-decalogue, hb-lev-11-dietary-laws]
    matches:
      - with: hb-lev-5-graduated-and-guilt-offerings
        motif: rash-oath-requires-atonement
        refs: ["5:89"]
        with_refs: ["Lev 5:4", "Lev 5:6", "Lev 5:7", "Lev 5:11"]
        relation: divergence
        note: "Both have graded expiation for an oath. Lev: nefeš kî tiššāvaʿ ləvaṭṭēʾ vi-śfātayim, a lamb or goat, if one cannot afford it two birds, and if not that, a tenth of an ephah of flour (wə-ʾim-lōʾ taggîaʿ yādô ... wə-ʾim-lōʾ taśśîg yādô). Q: lā yuʾākhidhukumu llāhu bi-l-laghwi fī aymānikum, and for binding oaths ʾiṭʿāmu ʿasharati masākīna ... aw kiswatuhum aw taḥrīru raqabatin fa-man lam yajid fa-ṣiyāmu thalāthati ayyām. The steps are kept ('whoever cannot find'), but the sacrifice becomes feeding and clothing the poor, freeing a slave, and fasting. Q exempts the idle oath, which Lev 5:4 covers."
      - with: hb-num-6-nazirite
        motif: nazirite-abstains-from-all-grape-products
        refs: ["5:87", "5:90"]
        with_refs: ["Num 6:3", "Num 6:11"]
        relation: divergence
        note: "Abstention from wine. Num: by vow, as a mark of holiness (mi-yyayin wə-šēkhār yazzîr), and the Nazirite brings a ḥaṭṭāʾt, wə-khipper ʿālāyw mēʾăšer ḥāṭāʾ ʿal-ha-nnāfeš. Q forbids self-imposed abstinence (lā tuḥarrimū ṭayyibāti mā aḥalla llāhu lakum, 5:87), yet makes wine itself rijsun min ʿamali l-shayṭāni for all (5:90). cf. (not a match) b. Taʿanit 11a, which reads Num 6:11 as the sin of self-denial."
      - with: hb-hos-4-lawsuit-priests
        motif: divination-by-wood-and-staff
        refs: ["5:90", "5:91"]
        with_refs: ["Hos 4:11", "Hos 4:12"]
        relation: echo
        note: "Wine paired with divination by wood. Q: innamā l-khamru wa-l-maysiru wa-l-anṣābu wa-l-azlāmu rijsun ... wa-yaṣuddakum ʿan dhikri llāhi. Hos: zənût wə-yayin wə-tîrôš yiqqaḥ-lēv; ʿammî bə-ʿēṣô yišʾāl û-maqlô yaggîd lô. Wine 'takes the heart' and the people consult their stick, as Q pairs wine with divining arrows."
      - with: hb-lev-11-dietary-laws
        motif: fins-and-scales-rule
        refs: ["5:96"]
        with_refs: ["Lev 11:9", "Lev 11:10"]
        relation: contrast
        note: "Opposite rulings on sea creatures. Lev: ʾet-zeh tōʾkhəlû ... kōl ʾăšer-lô sənappîr wə-qaśqeśet; anything without them is šeqeṣ. Q: uḥilla lakum ṣaydu l-baḥri wa-ṭaʿāmuhu, all sea game is lawful, even in iḥrām."
  - unit: quran-5-questions-pagan-camels
    checked: [hb-isa-65-rebels-and-servants, hb-deut-18-levites-prophet, hb-isa-63-communal-lament, hb-deut-29-covenant-moab, hb-deut-15-release-year, hb-jer-44-queen-of-heaven]
    matches:
