  - unit: quran-5-hand-fettered
    checked: [hb-isa-50-servant-struck, hb-lam-2-god-as-enemy, hb-num-11-taberah-quail, hb-lev-26-blessings, hb-deut-28-blessings-curses, hb-mal-3-tithes, hb-jer-5-sea-boundary]
    matches:
      - with: hb-num-11-taberah-quail
        motif: divine-power-questioned
        refs: ["5:64"]
        with_refs: ["Num 11:21", "Num 11:22", "Num 11:23"]
        relation: divergence
        note: "God's hand as the measure of his power to provide. Num: Moses doubts (ha-ṣōʾn û-vāqār yiššāḥēṭ lāhem), and God answers ha-yad YHWH tiqṣār. Q puts the doubt in the mouth of al-yahūd, yadu llāhi maghlūlatun, and answers ghullat aydīhim ... bal yadāhu mabsūṭatāni yunfiqu kayfa yashāʾu. The doubter changes from Moses to 'the Jews', and the doubt is cursed (wa-luʿinū bi-mā qālū)."
      - with: hb-isa-50-servant-struck
        motif: divine-power-questioned
        refs: ["5:64"]
        with_refs: ["Isa 50:2"]
        relation: echo
        note: "Isa: ha-qāṣôr qāṣərāh yādî mip-pədût wə-ʾim-ʾên-bî khōaḥ ləhaṣṣîl. God rejects the idea that his hand is shortened. Q: bal yadāhu mabsūṭatāni against the claim yadu llāhi maghlūla."
      - with: hb-lam-2-god-as-enemy
        motif: gods-hand-fettered-claim
        refs: ["5:64"]
        with_refs: ["Lam 2:3"]
        relation: echo
        note: "Lam, Israel's own lament: hēšîv ʾāḥôr yəmînô mip-pənê ʾôyēv, God has drawn back his right hand. Q 5:64 cites as a Jewish saying yadu llāhi maghlūlatun and rejects it. The lament motif of the withdrawn divine hand becomes a quoted claim that is refuted."
      - with: hb-lev-26-blessings
        motif: eat-from-above-and-below
        refs: ["5:66"]
        with_refs: ["Lev 26:3", "Lev 26:4", "Lev 26:5"]
        relation: parallel
        note: "Abundance on condition of keeping the law. Q: wa-law annahum aqāmū l-tawrāta wa-l-injīla ... la-akalū min fawqihim wa-min taḥti arjulihim. Lev: ʾim-bə-ḥuqqōtay tēlēkhû ... wə-nātattî gišmêkhem bə-ʿittām wə-nātənāh hā-ʾāreṣ yəvûlāh ... wa-ʾăkhaltem laḥməkhem lā-śōvaʿ. Rain from above, crops from below."
      - with: hb-deut-28-blessings-curses
        motif: eat-from-above-and-below
        refs: ["5:66"]
        with_refs: ["Deut 28:12"]
        relation: parallel
        note: "Deut: yiftaḥ YHWH ləkhā ʾet-ʾôṣārô haṭ-ṭôv ʾet-haš-šāmayim lātēt məṭar-ʾarṣəkhā bə-ʿittô. Q: la-akalū min fawqihim wa-min taḥti arjulihim, conditional on aqāmū l-tawrāta."
      - with: hb-mal-3-tithes
        motif: test-god-with-tithes-windows-of-heaven
        refs: ["5:66"]
        with_refs: ["Mal 3:10"]
        relation: echo
        note: "Mal: ʾim-lōʾ ʾeftaḥ lākhem ʾēt ʾărubbôt haš-šāmayim wa-hărîqōtî lākhem bərākhāh, abundance from above for obedience. Q: min fawqihim."
      - with: hb-jer-5-sea-boundary
        motif: eyes-that-do-not-see
        refs: ["5:71"]
        with_refs: ["Jer 5:21"]
        relation: echo
        note: "Q: fa-ʿamū wa-ṣammū thumma tāba llāhu ʿalayhim thumma ʿamū wa-ṣammū. Jer: ʿam sākhāl wə-ʾên lēv ʿênayim lāhem wə-lōʾ yirʾû ʾoznayim lāhem wə-lōʾ yišmāʿû. Q adds the cycle: blind and deaf, forgiven, blind and deaf again."
  - unit: quran-5-christology-monks
    checked: [hb-ps-69-deep-waters, hb-exod-20-decalogue, hb-exod-34-thirteen-attributes-covenant-renewal, hb-deut-5-decalogue, hb-jer-10-idols-scarecrows, hb-neh-8-ezra-reads-torah, hb-ps-50-divine-lawsuit]
