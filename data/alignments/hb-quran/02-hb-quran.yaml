reviewed:
- unit: quran-4-people-of-book-distortion
  checked: [hb-exod-24-covenant-ratification, hb-deut-5-decalogue, hb-exod-19-sinai-theophany, hb-amos-5-lament-day-of-yhwh, hb-zeph-1-day-of-wrath, hb-deut-33-blessing-of-moses, hb-exod-31-bezalel-sabbath-tablets, hb-prov-20-sayings, hb-josh-24-shechem-covenant, hb-gen-17-covenant-of-circumcision]
  matches:
  - with: hb-deut-5-decalogue
    motif: people-accept-covenant-we-will-do
    refs:
    - "4:46"
    with_refs:
    - "Deut 5:27"
    relation: response
    note: "Q samiʿnā wa-ʿaṣaynā ('we hear and we disobey') against the people's pledge at Horeb wə-šāmaʿnû wə-ʿāśînû ('we will hear and do'); Arabic ʿaṣaynā sounds like Hebrew ʿāśînû. Q also gives the correct form, samiʿnā wa-aṭaʿnā. cf. (not a match) b. Shabbat 88a and the Targum tradition of the pun."
  - with: hb-exod-24-covenant-ratification
    motif: people-accept-covenant-we-will-do
    refs:
    - "4:46"
    with_refs:
    - "Exod 24:7"
    - "Exod 24:3"
    relation: divergence
    note: "Exod 24:7 kōl ʾăšer-dibber YHWH naʿăśeh wə-nišmāʿ, the people's assent, comes back in Q 4:46 as the opposite, samiʿnā wa-ʿaṣaynā, put in the mouth of 'those who are Jews' (alladhīna hādū). Hearing is kept and doing becomes disobeying."
  - with: hb-exod-19-sinai-theophany
    motif: people-accept-covenant-we-will-do
    refs:
    - "4:46"
    with_refs:
    - "Exod 19:8"
    relation: echo
    note: "Exod 19:8 wayyaʿănû kol-hāʿām yaḥdāw ... naʿăśeh; Q 4:46 has the people's answer as samiʿnā wa-ʿaṣaynā, with samiʿnā wa-aṭaʿnā as what they should have said."
  - with: hb-exod-31-bezalel-sabbath-tablets
    motif: sabbath-violation-punished
    refs:
    - "4:47"
    with_refs:
    - "Exod 31:14"
    relation: divergence
    note: "HB: məḥalləlêhā môt yûmāt ... wə-nikhrətāh ha-nefeš (execution by the community and being 'cut off'). Q: aw nalʿanahum kamā laʿannā aṣḥāba l-sabt, a curse by God (and transformation into apes, 2:65 and 5:60). No HB story tells of a transformation."
  - with: hb-prov-20-sayings
    motif: self-praise-of-purity-rebuked
    refs:
    - "4:49"
    with_refs:
    - "Prov 20:9"
    relation: echo
    note: "Both use the same root z-k-y/z-k-h for self-purification. Q: alladhīna yuzakkūna anfusahum bali llāhu yuzakkī man yashāʾ. Prov: mî yōʾmar zikkîtî libbî ṭāhartî mē-ḥaṭṭāʾtî ('who can say: I have made my heart pure')."
  - with: hb-josh-24-shechem-covenant
    motif: idolatry-unforgivable
    refs:
    - "4:48"
    with_refs:
    - "Josh 24:19"
    - "Josh 24:20"
    relation: echo
    note: "Q: inna llāha lā yaghfiru an yushraka bihi. Josh: lōʾ yiśśāʾ lə-pišʿăkem ... kî taʿazbû ʾet-YHWH wa-ʿăbadtem ʾĕlōhê nēkār, where the jealous God will not forgive serving foreign gods. Q limits the unforgivable to shirk and forgives 'what is less than that'."
  - with: hb-gen-17-covenant-of-circumcision
    motif: kings-will-descend-from-patriarch
    refs:
    - "4:54"
    with_refs:
    - "Gen 17:6"
    relation: echo
    note: "Q: fa-qad ātaynā āla Ibrāhīma l-kitāba wa-l-ḥikmata wa-ātaynāhum mulkan ʿaẓīman. Gen: û-məlākhîm mimməkā yēṣēʾû. Kingship promised to Abraham's line; Q adds book and wisdom."
- unit: quran-4-trusts-obedience
  checked: [hb-exod-32-tablets-broken-levites, hb-deut-9-golden-calf-recalled, hb-jer-24-two-baskets-figs, hb-isa-1-indictment-of-judah, hb-jer-27-yoke-bars, hb-deut-17-courts-king, hb-lev-5-graduated-and-guilt-offerings]
  matches:
  - with: hb-exod-32-tablets-broken-levites
    motif: levites-kill-idolaters-kin
    refs:
    - "4:66"
    with_refs:
    - "Exod 32:27"
    - "Exod 32:28"
    - "Exod 32:29"
    relation: divergence
    note: "HB command, carried out: hirgû ʾîš ʾet-ʾāḥîw ... wayyaʿăśû bənê-lēwî, about 3,000 die and the Levites are ordained by it. Q makes it hypothetical: law annā katabnā ʿalayhim ani qtulū anfusakum aw ukhrujū min diyārikum mā faʿalūhu illā qalīlun minhum, and the point becomes how few would obey. cf. Q 2:54, where the command is given."
  - with: hb-deut-9-golden-calf-recalled
    motif: prophet-intercedes-for-people
    refs:
    - "4:64"
    with_refs:
    - "Deut 9:18"
    - "Deut 9:19"
    - "Deut 9:26"
    relation: parallel
    note: "Q: wa-staghfara lahumu l-rasūlu la-wajadū llāha tawwāban raḥīman (the Messenger's prayer for forgiveness after they wronged themselves). Deut: wāʾetnappal lifnê YHWH ... wayyišmaʿ YHWH ʾēlay gam bappaʿam hahiwʾ (Moses' intercession after the calf)."
  - with: hb-deut-17-courts-king
    motif: supreme-court-at-sanctuary
    refs:
    - "4:59"
    - "4:65"
    with_refs:
    - "Deut 17:8"
    - "Deut 17:9"
    - "Deut 17:10"
    - "Deut 17:11"
    - "Deut 17:12"
    relation: parallel
    note: "Disputes are referred upward and the verdict is accepted. Q: fa-in tanāzaʿtum fī shayʾin fa-ruddūhu ilā llāhi wa-l-rasūl; ḥattā yuḥakkimūka fīmā shajara baynahum thumma lā yajidū ... ḥarajan mimmā qaḍayta. Deut: kî yippālēʾ mimməkā dābār lammišpāṭ ... dibrê rîbōt ... ʿal-pî ha-tôrāh ... lōʾ tāsûr. The authority differs: the Levitical priests and judge at the chosen place against God, the Messenger and ulū l-amr (4:59; cf. 4:83 in the next unit)."
  - with: hb-lev-5-graduated-and-guilt-offerings
    motif: return-trusts-to-owners
    refs:
    - "4:58"
    with_refs:
    - "Lev 5:21"
    - "Lev 5:23"
    relation: parallel
    note: "Q: an tuʾaddū l-amānāti ilā ahlihā. Lev: wə-kiḥēš ba-ʿămîtô bə-fiqqādôn ... wə-hēšîb ... ʾet-ha-piqqādôn ʾăšer hopqad ʾittô. In both, the deposit is returned to its owner. Lev treats the denial as a trespass against YHWH (maʿal)."
- unit: quran-4-fighting-and-death
  checked: [hb-amos-9-altar-and-booth-of-david, hb-isa-45-cyrus-the-anointed, hb-prov-24-words-of-wise, hb-prov-15-sayings, hb-deut-28-blessings-curses, hb-obad-1-edom-brought-down, hb-num-14-rebellion-verdict, hb-judg-5-song-of-deborah]
  matches:
  - with: hb-amos-9-altar-and-booth-of-david
    motif: no-escape-from-god-sheol-heaven-sea
    refs:
    - "4:78"
    with_refs:
    - "Amos 9:2"
    - "Amos 9:3"
    relation: echo
    note: "Q: aynamā takūnū yudrikkumu l-mawtu wa-law kuntum fī burūjin mushayyadatin. Amos: ʾim-yaḥtərû bišʾôl miššām yādî tiqqāḥēm wəʾim-yaʿălû haššāmayim miššām ʾôrîdēm. No height or hiding place escapes; in Q it is death that reaches them, in Amos God's hand."
  - with: hb-obad-1-edom-brought-down
    motif: proud-nest-among-stars-brought-down
    refs:
    - "4:78"
    with_refs:
    - "Obad 1:4"
    relation: echo
    note: "Q: wa-law kuntum fī burūjin mushayyadatin. Obad: ʾim-tagbîah kannešer wəʾim-bên kôkhābîm śîm qinnekā miššām ʾôrîdəkā. A high, fortified dwelling is no protection."
  - with: hb-isa-45-cyrus-the-anointed
    motif: god-creates-light-and-darkness-peace-and-evil
    refs:
    - "4:78"
    - "4:79"
    with_refs:
    - "Isa 45:7"
    relation: divergence
    note: "Q 4:78 qul kullun min ʿindi llāh = Isa yôṣēr ʾôr û-bôrēʾ ḥōšekh ʿōśeh šālôm û-bôrēʾ rāʿ ... ʿōśeh khol-ʾēlleh. But Q 4:79 adds at once mā aṣābaka min ḥasanatin fa-mina llāhi wa-mā aṣābaka min sayyiʾatin fa-min nafsika, assigning evil to the self. Isa says God 'creates evil'."
  - with: hb-num-14-rebellion-verdict
    motif: people-balk-at-fighting
    refs:
    - "4:77"
    with_refs:
    - "Num 14:2"
    - "Num 14:3"
    relation: parallel
    note: "Q: qālū rabbanā lima katabta ʿalaynā l-qitāla law-lā akhkhartanā ilā ajalin qarīb. Num: wə-lāmāh YHWH mēbîʾ ʾōtānû ʾel-hāʾāreṣ hazzōʾt linpōl baḥereb. Both put to God a 'why' about being sent to fight; Q adds that they fear people 'as they fear God or more'."
  - with: hb-judg-5-song-of-deborah
    motif: laggard-rejoices-at-missing-battle
    refs:
    - "4:72"
    - "4:73"
    with_refs:
    - "Judg 5:16"
    - "Judg 5:17"
    - "Judg 5:23"
    relation: echo
    note: "Both rebuke those who stay away from the battle. Judg: lāmmāh yāšabtā bên ha-mišpətayim; ʾôrû mērôz ... kî lōʾ-bāʾû lə-ʿezrat YHWH (Meroz is cursed). Q: the laggard (la-man la-yubaṭṭiʾanna) says qad anʿama llāhu ʿalayya idh lam akun maʿahum shahīdan, then wishes for the spoil."
- unit: quran-4-hypocrites-two-factions
  checked: [hb-deut-20-rules-of-war, hb-deut-2-sihon, hb-2sam-10-ammonite-insult, hb-obad-1-edom-brought-down, hb-josh-9-gibeonite-ruse]
  matches:
  - with: hb-deut-20-rules-of-war
    motif: peace-offer-before-war
    refs:
    - "4:90"
    - "4:91"
    with_refs:
    - "Deut 20:10"
    - "Deut 20:11"
    relation: divergence
    note: "The roles are reversed. Deut: Israel makes the offer (wə-qārāʾtā ʾēlêhā lə-šālôm), and a city that answers šālôm becomes forced labour (yihyû ləkā lāmas waʿăbādûkā). Q: the other side offers (wa-alqaw ilaykumu l-salama) and withdraws, and then fa-mā jaʿala llāhu lakum ʿalayhim sabīlan: no claim on them, no tribute."
  - with: hb-deut-2-sihon
    motif: peace-offer-before-war
    refs:
    - "4:90"
    with_refs:
    - "Deut 2:26"
    relation: echo
    note: "Deut: dibrê šālôm sent to Sihon, who refuses and is destroyed. Q: those who 'cast you the peace' (alqaw ilaykumu l-salam) are left alone."
  - with: hb-josh-9-gibeonite-ruse
    motif: neutral-and-treaty-folk-not-fought
    refs:
    - "4:90"
    with_refs:
    - "Josh 9:15"
    - "Josh 9:19"
    - "Josh 9:20"
    relation: parallel
    note: "Q: illā lladhīna yaṣilūna ilā qawmin baynakum wa-baynahum mīthāqun, a treaty that protects even those otherwise to be fought. Josh: wayyikhrōt lāhem bərît lə-ḥayyôtām ... lōʾ nûkhal lingōaʿ bāhem ... wə-lōʾ-yihyeh ʿālênû qeṣef ʿal-ha-šəbûʿāh. The sworn treaty binds even after the ruse."
- unit: quran-4-homicide-law
  checked: [hb-num-35-levitical-cities-refuge, hb-deut-19-refuge-witnesses, hb-exod-21-bodily-injury, hb-lev-20-penalties, hb-lev-5-graduated-and-guilt-offerings]
  matches:
  - with: hb-num-35-levitical-cities-refuge
    motif: city-of-refuge-accidental-killer
    refs:
    - "4:92"
    with_refs:
    - "Num 35:11"
    relation: divergence
    note: "The same legal category: Q khaṭaʾan = Num bi-šəgāgāh (unintentional killing). The remedy differs. Num: asylum in a city of refuge (wə-nās šāmmāh rōṣēaḥ makkēh-nefeš bi-šəgāgāh). Q: taḥrīru raqabatin muʾminatin wa-diyatun musallamatun ilā ahlihi (free a slave, pay blood money), and if one cannot, fast two months."
  - with: hb-num-35-levitical-cities-refuge
    motif: payment-for-a-life
    refs:
    - "4:92"
    with_refs:
    - "Num 35:31"
    - "Num 35:32"
    relation: contrast
    note: "Opposite rulings on payment for a life. Num 35:32 wə-lōʾ-tiqḥû khōfer lā-nûs ʾel-ʿîr miqlāṭô: no ransom even for the accidental killer. Q 4:92 requires a payment, diyatun musallamatun ilā ahlihi, which the family may remit (illā an yaṣṣaddaqū)."
  - with: hb-num-35-levitical-cities-refuge
    motif: murder-vs-manslaughter-by-weapon
    refs:
    - "4:92"
    - "4:93"
    with_refs:
    - "Num 35:16"
    - "Num 35:20"
    - "Num 35:22"
    - "Num 35:23"
    relation: parallel
    note: "Both turn on intent. Q: khaṭaʾan against mutaʿammidan. Num: bə-śinʾāh ... bi-ṣədiyyāh (in hatred, lying in wait) against bə-feṯaʿ bə-lōʾ-ʾêvāh (suddenly, without enmity). Num also judges by the weapon (iron, stone, wood); Q does not."
  - with: hb-exod-21-bodily-injury
    motif: penalty-for-deliberate-murder
    refs:
    - "4:93"
    with_refs:
    - "Exod 21:12"
    - "Exod 21:14"
    relation: divergence
    note: "HB punishes deliberate murder on earth: makkēh ʾîš wā-mēt môt yûmāt; even from the altar, kî-yāzid ʾîš ... bə-ʿormāh mēʿim mizbəḥî tiqqāḥennû lāmût. Q 4:93 sets no human penalty here: fa-jazāʾuhu jahannamu khālidan fīhā wa-ghaḍiba llāhu ʿalayhi wa-laʿanahu."
  - with: hb-exod-21-bodily-injury
    motif: city-of-refuge-accidental-killer
    refs:
    - "4:92"
    with_refs:
    - "Exod 21:13"
    relation: divergence
    note: "Exod: waʾăšer lōʾ ṣādāh wə-hāʾĕlōhîm ʾinnāh lə-yādô wə-śamtî ləkā māqôm ʾăšer yānûs šāmmāh. Unintentional killing is ascribed to God, and asylum is the remedy. Q: wa-mā kāna li-muʾminin an yaqtula muʾminan illā khaṭaʾan, with expiation (kaffāra, diya) and a fast as tawbatan mina llāh."
  - with: hb-deut-19-refuge-witnesses
    motif: city-of-refuge-accidental-killer
    refs:
    - "4:92"
    with_refs:
    - "Deut 19:4"
    - "Deut 19:5"
    relation: divergence
    note: "Deut: ʾăšer yakkeh ʾet-rēʿēhû bi-vlî-daʿat wə-hûʾ lōʾ-śōnēʾ lô (the axe-head case) ... yānûs ... wā-ḥāy. Q: the same category khaṭaʾan, but the remedy is payment to the family and freeing a slave, with no refuge or avenger (gōʾēl ha-dām)."
- unit: quran-4-strivers-emigration
  checked: [hb-num-32-transjordan-tribes, hb-deut-20-rules-of-war, hb-job-1-prologue-first-test, hb-isa-63-communal-lament, hb-jer-49-ammon-edom-damascus-kedar-elam]
  matches:
  - with: hb-num-32-transjordan-tribes
    motif: strivers-above-those-who-sit
    refs:
    - "4:95"
    with_refs:
    - "Num 32:6"
    relation: parallel
    note: "Both turn on 'sitting' while others go to war, from the same image. Q: lā yastawī l-qāʿidūna mina l-muʾminīna ... wa-l-mujāhidūna. Num: ha-ʾaḥêkhem yābōʾû lammilḥāmāh wəʾattem tēšəbû pōh."
  - with: hb-deut-20-rules-of-war
    motif: military-exemptions-house-vineyard-bride
    refs:
    - "4:95"
    with_refs:
    - "Deut 20:5"
    - "Deut 20:6"
    - "Deut 20:7"
    - "Deut 20:8"
    relation: divergence
    note: "Deut sends home the man with a new house, an unused vineyard, a betrothed bride, and ha-yārēʾ wə-rakh ha-lēvāv (the fearful and fainthearted). Q exempts only ghayru ulī l-ḍarar, the disabled. Those who sit for other reasons are not sent home; they are ranked lower (faḍḍala llāhu l-mujāhidīna ... ʿalā l-qāʿidīna darajatan)."
- unit: quran-4-prayer-of-fear
  checked: [hb-neh-4-builders-armed, hb-deut-6-shema, hb-ps-63-thirst, hb-ps-102-afflicted, hb-ps-103-bless-my-soul]
  matches:
  - with: hb-neh-4-builders-armed
    motif: prayer-in-shifts-under-arms
    refs:
    - "4:102"
    with_refs:
    - "Neh 4:10"
    - "Neh 4:11"
    - "Neh 4:15"
    - "Neh 4:16"
    relation: parallel
    note: "Half the company does the sacred work while half holds weapons. Q (prayer): fa-l-taqum ṭāʾifatun minhum maʿaka wa-l-yaʾkhudhū asliḥatahum ... wa-l-taʾti ṭāʾifatun ukhrā lam yuṣallū. Neh (building): ḥăṣî nəʿāray ʿōśîm bammlāʾkhāh wə-ḥeṣyām maḥăzîqîm wə-hā-rəmāḥîm ... bə-ʾaḥat yādô ʿōśeh vamlāʾkhāh wə-ʾaḥat maḥăzeqet ha-šālaḥ. In both, the enemy waits for a lapse (Neh 4:5; Q wadda lladhīna kafarū law taghfulūna ʿan asliḥatikum)."
  - with: hb-deut-6-shema
    motif: remember-god-standing-sitting-lying
    refs:
    - "4:103"
    with_refs:
    - "Deut 6:7"
    relation: echo
    note: "God is to be remembered in every posture. Q: fa-dhkurū llāha qiyāman wa-quʿūdan wa-ʿalā junūbikum. Deut: bə-šivtəkhā bə-vêtekhā û-və-lekhtəkhā vaddérekh û-və-šokhbəkhā û-və-qûmekhā."
  - with: hb-ps-63-thirst
    motif: remember-god-standing-sitting-lying
    refs:
    - "4:103"
    with_refs:
    - "Ps 63:7"
    relation: echo
    note: "Q: fa-dhkurū llāha ... ʿalā junūbikum. Ps: ʾim-zəkhartîkhā ʿal-yəṣûʿāy bə-ʾašmūrôt ʾehgeh-bākh. Both use the root dh-k-r / z-k-r for remembering God lying down."
- unit: quran-4-false-accusation
  checked: [hb-jer-31-consolation-new-covenant, hb-ezek-3-watchman-and-muteness, hb-deut-19-refuge-witnesses, hb-ezek-33-watchman-and-fall-news, hb-deut-18-levites-prophet, hb-ezek-22-city-of-blood, hb-jer-7-queen-of-heaven, hb-isa-29-ariel-and-sealed-book, hb-exod-23-justice-sabbatical-festivals]
  matches:
  - with: hb-jer-31-consolation-new-covenant
    motif: individual-responsibility-for-sin
    refs:
    - "4:111"
    with_refs:
    - "Jer 31:29"
    - "Jer 31:30"
    relation: parallel
    note: "Q: wa-man yaksib ithman fa-innamā yaksibuhu ʿalā nafsihi. Jer: kî ʾim-ʾîš baʿăwōnô yāmût, replacing the proverb ʾāvôt ʾākhlû vōser."
  - with: hb-ezek-3-watchman-and-muteness
    motif: individual-responsibility-for-sin
    refs:
    - "4:111"
    with_refs:
    - "Ezek 3:18"
    - "Ezek 3:19"
    relation: echo
    note: "Ezek: hûʾ rāšāʿ baʿăwōnô yāmût, and the warned watchman has saved his own life (ʾet-nafšəkhā hiṣṣaltā). Q 4:111 ʿalā nafsihi; the Prophet is also told not to take on the traitors' cause (4:105, 4:109)."
  - with: hb-deut-19-refuge-witnesses
    motif: false-witness-suffers-intended-penalty
    refs:
    - "4:112"
    with_refs:
    - "Deut 19:16"
    - "Deut 19:18"
    - "Deut 19:19"
    relation: divergence
    note: "Both deal with charging an innocent person. Deut: the court punishes the false witness: wa-ʿăśîtem lô kaʾăšer zāmam laʿăśôt lə-ʾāḥîw. Q: thumma yarmi bihi barīʾan fa-qadi ḥtamala buhtānan wa-ithman mubīnan. The accuser 'carries' the slander as sin before God, and no court penalty is named."
  - with: hb-exod-23-justice-sabbatical-festivals
    motif: guilt-cast-on-innocent
    refs:
    - "4:105"
    - "4:112"
    with_refs:
    - "Exod 23:1"
    - "Exod 23:7"
    relation: parallel
    note: "Do not side with the guilty party, and do not condemn the innocent. Q: wa-lā takun li-l-khāʾinīna khaṣīman; yarmi bihi barīʾan. Exod: ʾal-tāšet yādəkhā ʿim-rāšāʿ lihyōt ʿēd ḥāmās; wə-nāqî wə-ṣaddîq ʾal-tahărōg. Q barīʾ corresponds to Exod nāqî."
  - with: hb-jer-7-queen-of-heaven
    motif: prophet-forbidden-to-intercede
    refs:
    - "4:107"
    - "4:109"
    with_refs:
    - "Jer 7:16"
    relation: parallel
    note: "God forbids his prophet to plead for the guilty. Q: wa-lā tujādil ʿani lladhīna yakhtānūna anfusahum; fa-man yujādilu llāha ʿanhum yawma l-qiyāmati. Jer: wəʾattāh ʾal-titpallēl bəʿad hāʿām hazzeh ... wəʾal-tifgaʿ-bî kî-ʾênennî šōmēaʿ ʾōtākh. In Q the pleading is in a court case for named traitors; in Jer it is prayer for the whole people."
  - with: hb-isa-29-ariel-and-sealed-book
    motif: god-present-at-night-plotting
    refs:
    - "4:108"
    with_refs:
    - "Isa 29:15"
    relation: echo
    note: "Plotters hide from people but not from God. Q: yastakhfūna mina l-nāsi wa-lā yastakhfūna mina llāhi wa-huwa maʿahum idh yubayyitūna (plotting by night). Isa: hôy ha-maʿămîqîm mē-YHWH lastir ʿēṣāh wə-hāyāh və-maḥšākh maʿăśêhem wayyōʾmərû mî rōʾēnû."
- unit: quran-4-satan-vows-share
  checked: [hb-jer-44-queen-of-heaven, hb-isa-41-trial-of-the-gods, hb-2chr-20-battle-won-by-singing, hb-hos-2-unfaithful-wife, hb-isa-65-rebels-and-servants]
  matches:
  - with: hb-isa-41-trial-of-the-gods
    motif: abraham-friend-of-god
    refs:
    - "4:125"
    with_refs:
    - "Isa 41:8"
    relation: parallel
    note: "Q: wa-ttakhadha llāhu Ibrāhīma khalīlan. Isa: zeraʿ ʾAvrāhām ʾōhăvî ('Abraham my friend/lover'). The same epithet with different roots: khalīl against ʾōhēv."
  - with: hb-2chr-20-battle-won-by-singing
    motif: abraham-friend-of-god
    refs:
    - "4:125"
    with_refs:
    - "2Chr 20:7"
    relation: parallel
    note: "2Chr: lə-zeraʿ ʾAvrāhām ʾōhavkhā lə-ʿôlām; Q 4:125 khalīlan. In HB the epithet comes in an appeal about the land given to Abraham's seed; in Q it is attached to the milla of Abraham ḥanīfan."
  - with: hb-jer-44-queen-of-heaven
    motif: queen-of-heaven-cult
    refs:
    - "4:117"
    with_refs:
    - "Jer 44:17"
    - "Jer 44:18"
    - "Jer 44:19"
    relation: echo
    note: "Both polemicize against the worship of female deities. Q: in yadʿūna min dūnihi illā ināthan wa-in yadʿūna illā shayṭānan marīdan. Jer: ləqaṭṭēr li-mlekhet ha-šāmayim wə-hassēkh lāh nəsākhîm. In Jer the women defend the cult by its results (wa-nnisbaʿ leḥem); Q reduces the female beings to Satan."
  - with: hb-hos-2-unfaithful-wife
    motif: lovers-thought-to-give-bread-wool
    refs:
    - "4:119"
    - "4:120"
    with_refs:
    - "Hos 2:7"
    - "Hos 2:10"
    relation: echo
    note: "False gods are credited with gifts they do not give. Q: yaʿiduhum wa-yumannīhim wa-mā yaʿiduhumu l-shayṭānu illā ghurūran (Satan's empty promises). Hos: ʾēlkhāh ʾaḥărê məʾahăvay nōtənê laḥmî û-mêmay ... wə-hîʾ lōʾ yādəʿāh kî ʾānōkhî nātattî lāh."
- unit: quran-4-women-orphans-justice
  checked: [hb-ruth-1-naomi-ruth-return, hb-lev-19-holiness-code-a, hb-mal-2-faithless-marriage, hb-prov-22-solomon-sayings-end, hb-exod-23-justice-sabbatical-festivals, hb-num-36-heiresses]
  matches:
  - with: hb-ruth-1-naomi-ruth-return
    motif: wife-left-suspended
    refs:
    - "4:129"
    with_refs:
    - "Ruth 1:13"
    relation: echo
    note: "Q: fa-tadharūhā ka-l-muʿallaqa, left 'hanging', neither married nor free. Ruth: ha-lāhēn tēʿāgēnāh lə-viltî hĕyôt lə-ʾîš, 'would you be anchored (ʿ-g-n), not belonging to a man?'. The root of the later rabbinic ʿagunah. cf. (not a match) m. Gittin, ʿagunah law."
  - with: hb-lev-19-holiness-code-a
    motif: impartial-judgment-neither-poor-nor-great
    refs:
    - "4:135"
    with_refs:
    - "Lev 19:15"
    relation: parallel
    note: "Q: kūnū qawwāmīna bi-l-qisṭi ... in yakun ghaniyyan aw faqīran fa-llāhu awlā bihimā fa-lā tattabiʿū l-hawā. Lev: lōʾ-tiśśāʾ fənê-dāl wə-lōʾ tehdar pənê gādôl bə-ṣedeq tišpōṭ ʿămîtekhā. Q's pair rich/poor matches Lev's dāl/gādôl."
  - with: hb-exod-23-justice-sabbatical-festivals
    motif: impartial-judgment-neither-poor-nor-great
    refs:
    - "4:135"
    with_refs:
    - "Exod 23:3"
    relation: echo
    note: "Exod: wə-dāl lōʾ tehdar bə-rîvô, do not favour even the poor man in his suit. Q 4:135 aw faqīran: justice must not lean toward the poor either."
  - with: hb-mal-2-faithless-marriage
    motif: divorce-permitted-or-hated
    refs:
    - "4:128"
    - "4:130"
    with_refs:
    - "Mal 2:14"
    - "Mal 2:16"
    relation: contrast
    note: "Opposite views of separation. Mal: kî-śānēʾ šallaḥ ʾāmar YHWH ... wə-lōʾ tivgōdû (MT difficult: 'he hates sending away' or 'one who hates and sends away'); God is witness to the ʾēšet nəʿûrêkhā. Q: if a wife fears nushūz from her husband, wa-l-ṣulḥu khayrun (reconciliation is best), but wa-in yatafarraqā yughni llāhu kullan min saʿatihi: separation is allowed and God provides for both."
  - with: hb-num-36-heiresses
    motif: marriage-of-orphan-heiresses
    refs:
    - "4:127"
    with_refs:
    - "Num 36:6"
    - "Num 36:8"
    relation: divergence
    note: "In both, a female orphan's inheritance is tied to her marriage. Num makes marriage within the father's clan a duty, so the naḥălāh does not pass to another tribe: ʾakh lə-mišpaḥat maṭṭēh ʾăvîhem tihyênāh lə-nāšîm. Q censures guardians who wish to marry orphan girls while withholding what is written for them: allātī lā tuʾtūnahunna mā kutiba lahunna wa-targhabūna an tankiḥūhunna."
- unit: quran-4-hypocrites-wavering
  checked: [hb-1kgs-18-carmel, hb-exod-20-decalogue, hb-jer-12-why-wicked-prosper, hb-deut-13-enticers, hb-isa-29-ariel-and-sealed-book]
  matches:
  - with: hb-1kgs-18-carmel
    motif: limping-between-two-opinions
    refs:
    - "4:143"
    with_refs:
    - "1Kgs 18:21"
    relation: parallel
    note: "Q: mudhabdhabīna bayna dhālika lā ilā hāʾulāʾi wa-lā ilā hāʾulāʾi (dangling between). 1Kgs: ʿad-mātay ʾattem pōsəḥîm ʿal-štê ha-səʿippîm. Elijah demands a choice (ʾim-YHWH hā-ʾĕlōhîm ləkhû ʾaḥărāyw wə-ʾim-ha-baʿal ləkhû ʾaḥărāyw); Q describes hypocrites who belong to neither camp."
  - with: hb-isa-29-ariel-and-sealed-book
    motif: lip-service-heart-far
    refs:
    - "4:142"
    with_refs:
    - "Isa 29:13"
    relation: echo
    note: "Worship performed without the heart. Q: wa-idhā qāmū ilā l-ṣalāti qāmū kusālā yurāʾūna l-nāsa wa-lā yadhkurūna llāha illā qalīlan. Isa: bə-fîw û-vi-śfātāyw kibbədûnî wə-libbô riḥaq mimmennî wa-ttəhî yirʾātām ʾōtî miṣwat ʾănāšîm mə-lummādāh."
  - with: hb-jer-12-why-wicked-prosper
    motif: god-near-in-mouth-far-from-heart
    refs:
    - "4:142"
    with_refs:
    - "Jer 12:2"
    relation: echo
    note: "Jer: qārôv ʾattāh bə-fîhem wə-rāḥôq mi-kilyôtêhem. Q: the hypocrites' outward prayer and little remembrance of God (wa-lā yadhkurūna llāha illā qalīlan)."
- unit: quran-4-israel-indictment-crucifixion
  checked: [hb-neh-9-levites-confession, hb-ps-15-entrance-liturgy, hb-ps-106-national-confession, hb-ezek-20-history-of-rebellion, hb-isa-1-indictment-of-judah, hb-exod-33-tent-and-glory, hb-exod-19-sinai-theophany, hb-lev-26-curses, hb-exod-22-apodictic-and-social-laws, hb-2kgs-2-ascension-of-elijah]
  matches:
  - with: hb-neh-9-levites-confession
    motif: prophets-killed-by-israel
    refs:
    - "4:155"
    with_refs:
    - "Neh 9:26"
    relation: parallel
    note: "Q: wa-qatlihimu l-anbiyāʾa bi-ghayri ḥaqqin, in a list of covenant breaches (naqḍihim mīthāqahum). Neh: wa-yyamrû wa-yyimrədû bākh ... wə-ʾet-nəvîʾêkhā hārāgû ʾăšer hēʿîdû vām. Both put the charge in a historical indictment."
  - with: hb-neh-9-levites-confession
    motif: golden-calf
    refs:
    - "4:153"
    with_refs:
    - "Neh 9:18"
    - "Neh 9:19"
    relation: parallel
    note: "Q: thumma ttakhadhū l-ʿijla min baʿdi mā jāʾathumu l-bayyinātu fa-ʿafawnā ʿan dhālika. Neh: ʾaf kî-ʿāśû lāhem ʿēgel massēkhāh ... wə-ʾattāh bə-raḥămêkhā hā-rabbîm lōʾ ʿăzavtām. In both, the calf follows the signs and is forgiven."
  - with: hb-ps-106-national-confession
    motif: golden-calf
    refs:
    - "4:153"
    with_refs:
    - "Ps 106:19"
    - "Ps 106:20"
    relation: echo
    note: "Ps: yaʿăśû-ʿēgel bə-Ḥōrēv ... wa-yyāmîrû ʾet-kəvôdām bə-tavnît šôr. Q: ittakhadhū l-ʿijla after the clear signs. Both recite the calf in a list of Israel's sins."
  - with: hb-exod-33-tent-and-glory
    motif: request-to-see-god
    refs:
    - "4:153"
    with_refs:
    - "Exod 33:18"
    - "Exod 33:20"
    relation: divergence
    note: "The same causative of r-ʾ-y. Exod: Moses asks harʾēnî nāʾ ʾet-kəvōdekhā, and God answers lōʾ tûkhal lirʾōt ʾet-pānāy kî lōʾ-yirʾanî hā-ʾādām wā-ḥāy, then shows his back. Q: the people ask Moses arinā llāha jahratan, and fa-akhadhathumu l-ṣāʿiqatu bi-ẓulmihim. The asker shifts from the prophet to the people, and the request is punished as wrongdoing."
  - with: hb-exod-19-sinai-theophany
    motif: mountain-raised-over-israel
    refs:
    - "4:154"
    with_refs:
    - "Exod 19:17"
    relation: divergence
    note: "Exod: wa-yyityaṣṣəvû bə-taḥtît hā-hār, 'they stood at the foot (lit. underneath) of the mountain'. Q: wa-rafaʿnā fawqahumu l-ṭūra bi-mīthāqihim. The mountain is lifted over them as the covenant is taken. cf. (not a match) b. Shabbat 88a, which reads Exod 19:17 as God holding the mountain over them like a vat."
  - with: hb-ezek-20-history-of-rebellion
    motif: god-gave-laws-not-good
    refs:
    - "4:160"
    with_refs:
    - "Ezek 20:25"
    relation: parallel
    note: "Law given as punishment. Ezek: wə-gam-ʾănî nātattî lāhem ḥuqqîm lōʾ ṭôvîm û-mišpāṭîm lōʾ yiḥyû bāhem. Q: fa-bi-ẓulmin mina lladhīna hādū ḥarramnā ʿalayhim ṭayyibātin uḥillat lahum. Ezek has bad laws given; Q has good things forbidden."
  - with: hb-lev-26-curses
    motif: uncircumcised-heart
    refs:
    - "4:155"
    with_refs:
    - "Lev 26:41"
    relation: divergence
    note: "Lev: ʾô-ʾāz yikkānaʿ ləvāvām he-ʿārēl, where God calls the heart uncircumcised and expects it to be humbled. Q: the people say it of themselves as an excuse, qulūbunā ghulfun ('our hearts are uncircumcised/wrapped'), and God answers bal ṭabaʿa llāhu ʿalayhā bi-kufrihim."
  - with: hb-exod-22-apodictic-and-social-laws
    motif: prohibition-of-interest
    refs:
    - "4:161"
    with_refs:
    - "Exod 22:24"
    relation: response
    note: "Q points to the Torah ban as already given: wa-akhdhihimu l-ribā wa-qad nuhū ʿanhu wa-aklihim amwāla l-nāsi bi-l-bāṭil. Exod: ʾim-kesef talweh ʾet-ʿammî ʾet-heʿānî ʿimmākh ... lōʾ-təśîmûn ʿālāyw nešekh. The HB ban protects 'my people, the poor with you'; Q extends the charge to 'the people's wealth'."
  - with: hb-2kgs-2-ascension-of-elijah
    motif: prophet-ascends-in-whirlwind
    refs:
    - "4:158"
    with_refs:
    - "2Kgs 2:11"
    relation: echo
    note: "Taken up alive instead of dying. Q: bal rafaʿahu llāhu ilayhi, after wa-mā qatalūhu wa-mā ṣalabūhu. 2Kgs: wa-yyaʿal ʾĒliyyāhû bas-səʿārāh haš-šāmāyim. Q gives no chariot or whirlwind; the agent is God, 'to himself'."
- unit: quran-4-prophets-and-trinity
  checked: [hb-exod-33-tent-and-glory, hb-deut-34-death-of-moses, hb-exod-3-burning-bush, hb-jer-15-confession-words-eaten, hb-ps-44-national-lament, hb-deut-6-shema, hb-ps-2-anointed-son, hb-isa-42-servant-and-new-song, hb-2sam-23-last-words-of-david]
  matches:
  - with: hb-exod-33-tent-and-glory
    motif: god-speaks-face-to-face-as-to-a-friend
    refs:
    - "4:164"
    with_refs:
    - "Exod 33:11"
    relation: parallel
    note: "Q: wa-kallama llāhu Mūsā taklīman, singling out Moses among the prophets as the one God addressed directly. Exod: wə-dibber YHWH ʾel-Mōšeh pānîm ʾel-pānîm kaʾăšer yədabbēr ʾîš ʾel-rēʿēhû. Q omits 'face to face'."
  - with: hb-deut-34-death-of-moses
    motif: god-speaks-face-to-face-as-to-a-friend
    refs:
    - "4:164"
    with_refs:
    - "Deut 34:10"
    relation: parallel
    note: "Deut: wə-lōʾ-qām nāvîʾ ʿôd bə-Yiśrāʾēl kə-Mōšeh ʾăšer yədāʿô YHWH pānîm ʾel-pānîm. Q 4:163-164 sets Moses in a catalogue of messengers and distinguishes him by taklīman. Deut makes him unequalled; Q puts Muhammad's revelation in the same series (innā awḥaynā ilayka ka-mā awḥaynā ilā Nūḥin)."
  - with: hb-deut-6-shema
    motif: shema-god-is-one
    refs:
    - "4:171"
    with_refs:
    - "Deut 6:4"
    relation: parallel
    note: "Q: wa-lā taqūlū thalāthatun ... innamā llāhu ilāhun wāḥidun. Deut: šəmaʿ Yiśrāʾēl YHWH ʾĕlōhênû YHWH ʾeḥād. Q turns the oneness formula against the Christians' 'three'."
  - with: hb-ps-2-anointed-son
    motif: divine-sonship
    refs:
    - "4:171"
    with_refs:
    - "Ps 2:7"
    relation: contrast
    note: "Ps: YHWH ʾāmar ʾēlay bənî ʾattāh ʾănî hay-yôm yəlidtîkhā (to the anointed king, məšîḥô 2:2). Q, of the Messiah (al-masīḥ): subḥānahu an yakūna lahu waladun. HB has God declare sonship and 'begetting' of his anointed; Q flatly denies that God has a son."
  - with: hb-isa-42-servant-and-new-song
    motif: servant-song-gentle-servant
    refs:
    - "4:171"
    - "4:172"
    with_refs:
    - "Isa 42:1"
    relation: echo
    note: "Isa: hēn ʿavdî ʾetmākh-bô ... nātattî rûḥî ʿālāyw (servant and spirit). Q: lan yastankifa l-masīḥu an yakūna ʿabdan li-llāhi, and Jesus as rūḥun minhu. Q calls the Messiah God's servant ('abd) who has a spirit from God, against deification."
  - with: hb-2sam-23-last-words-of-david
    motif: david-given-the-psalms
    refs:
    - "4:163"
    with_refs:
    - "2Sam 23:1"
    - "2Sam 23:2"
    relation: echo
    note: "David as an inspired psalmist. Q: wa-ātaynā Dāwūda zabūran. 2Sam: nəʿîm zəmirôt Yiśrāʾēl; rûaḥ YHWH dibber-bî û-millātô ʿal-ləšônî. zabūr is often linked to Hebrew zəmīrāh/mizmôr (etymology disputed)."
- unit: quran-4-kalala-ruling
  checked: [hb-num-27-zelophehad-joshua, hb-num-36-heiresses, hb-gen-25-jacob-esau-birth]
  matches:
  - with: hb-num-27-zelophehad-joshua
    motif: order-of-inheritance
    refs:
    - "4:176"
    with_refs:
    - "Num 27:8"
    - "Num 27:9"
    - "Num 27:10"
    - "Num 27:11"
    relation: divergence
    note: "Inheritance of a man with no child. Num: ʾîš kî-yāmût û-vēn ʾên lô ... lə-vittô; wə-ʾim-ʾên lô bat ... lə-ʾeḥāyw, then the father's brothers and the nearest kin. Sisters are never named. Q: in imruʾun halaka laysa lahu waladun wa-lahu ukhtun fa-lahā niṣfu mā taraka: a sister takes half, two sisters two thirds, and mixed siblings share li-l-dhakari mithlu ḥaẓẓi l-unthayayn. Q gives fixed fractions; Num gives only an order of heirs."
  - with: hb-num-27-zelophehad-joshua
    motif: leader-awaits-oracle-on-case
    refs:
    - "4:176"
    with_refs:
    - "Num 27:5"
    - "Num 27:8"
    relation: parallel
    note: "An inheritance question is put to the prophet and the answer comes from God. Num: wa-yyaqrēv Mōšeh ʾet-mišpāṭān lifnê YHWH, and God legislates (wə-ʾel-bənê Yiśrāʾēl tədabbēr). Q: yastaftūnaka quli llāhu yuftīkum fī l-kalāla."
- unit: quran-5-contracts-food-laws
  checked: [hb-exod-22-apodictic-and-social-laws, hb-neh-10-sealed-covenant, hb-lev-7-guilt-peace-portions, hb-lev-3-peace-offering, hb-lev-17-blood-and-slaughter, hb-exod-34-thirteen-attributes-covenant-renewal, hb-lev-11-dietary-laws, hb-ezek-21-sword-oracles, hb-deut-16-festivals-judges, hb-1sam-21-nob-and-gath, hb-exod-23-justice-sabbatical-festivals]
  matches:
  - with: hb-exod-22-apodictic-and-social-laws
    motif: flesh-torn-by-beasts-forbidden
    refs:
    - "5:3"
    - "5:4"
    with_refs:
    - "Exod 22:30"
    relation: divergence
    note: "Both forbid flesh torn by a beast: Q wa-mā akala l-sabuʿu illā mā dhakkaytum; Exod bāśār baś-śādeh ṭərēfāh lōʾ tōʾkhēlû. But the dog's role is reversed. Exod: lak-keleb tašlikhûn ʾōtô, the torn meat is thrown to the dogs. Q 5:4: what trained hunting animals (mukallibīna, 'training them as dogs') catch for you is lawful: fa-kulū mimmā amsakna ʿalaykum."
  - with: hb-lev-17-blood-and-slaughter
    motif: rite-over-hunted-game
    refs:
    - "5:4"
    with_refs:
    - "Lev 17:13"
    relation: divergence
    note: "Game may be eaten if a rite is performed over it, but the rites differ. Lev: ʾăšer yāṣûd ṣêd ḥayyāh ʾô-ʿôf ... wə-šāfakh ʾet-dāmô wə-khissāhû beʿāfār (pour out and cover the blood). Q: fa-kulū mimmā amsakna ʿalaykum wa-dhkurū sma llāhi ʿalayhi (pronounce God's name)."
  - with: hb-lev-17-blood-and-slaughter
    motif: carrion-forbidden-or-defiling
    refs:
    - "5:3"
    with_refs:
    - "Lev 17:15"
    relation: divergence
    note: "Lev: wə-khol-nefeš ʾăšer tōʾkhal nəvēlāh û-ṭərēfāh ... wə-khibbes bəgādāyw wə-rāḥaṣ bam-mayim wə-ṭāmēʾ ʿad-hāʿerev. Eating carrion or torn meat makes one impure and requires washing. Q forbids both outright (al-maytatu ... wa-mā akala l-sabuʿu) and lets the forbidden be eaten only under compulsion (fa-mani ḍṭurra fī makhmaṣatin)."
  - with: hb-lev-7-guilt-peace-portions
    motif: prohibition-of-eating-blood
    refs:
    - "5:3"
    with_refs:
    - "Lev 7:24"
    - "Lev 7:26"
    - "Lev 7:27"
    relation: parallel
    note: "Q: ḥurrimat ʿalaykumu l-maytatu wa-l-damu. Lev: wə-khol-dām lōʾ tōʾkhəlû ... lā-ʿôf wə-lab-bəhēmāh; ḥēlev nəvēlāh wə-ḥēlev ṭərēfāh ... wə-ʾākhōl lōʾ tōʾkhəluhû. Lev forbids only the fat of carrion and torn animals; Q forbids the whole animal."
  - with: hb-lev-3-peace-offering
    motif: prohibition-of-eating-blood
    refs:
    - "5:3"
    with_refs:
    - "Lev 3:17"
    relation: parallel
    note: "Lev: ḥuqqat ʿôlām ... kol-ḥēlev wə-khol-dām lōʾ tōʾkhēlû. Q 5:3 al-damu forbidden; Q keeps blood but has no ban on fat (contrast Q 6:146, where fat is forbidden to the Jews)."
  - with: hb-lev-11-dietary-laws
    motif: pork-forbidden
    refs:
    - "5:3"
    with_refs:
    - "Lev 11:7"
    relation: parallel
    note: "Q: wa-laḥmu l-khinzīri. Lev: wə-ʾet-ha-ḥăzîr ... ṭāmēʾ hûʾ lākhem. Q gives no reason; Lev reasons from hoof and cud (mafrîs parsāh ... gērāh lōʾ-yiggār)."
  - with: hb-ezek-21-sword-oracles
    motif: belomancy-arrow-divination
    refs:
    - "5:3"
    with_refs:
    - "Ezek 21:26"
    relation: echo
    note: "The same root q-s-m and the same technique. Q: wa-an tastaqsimū bi-l-azlāmi dhālikum fisqun (seeking a decision by divining arrows). Ezek: liqsom-qāsem qilqal ba-ḥiṣṣîm šāʾal bat-tərāfîm rāʾāh bak-kāvēd, the king of Babylon at the crossroads. Both condemn it."
  - with: hb-deut-16-festivals-judges
    motif: sacrifice-on-stone-altars-forbidden
    refs:
    - "5:3"
    with_refs:
    - "Deut 16:22"
    relation: echo
    note: "The cognate root n-ṣ-b for cultic standing stones. Q: wa-mā dhubiḥa ʿalā l-nuṣubi (what is slaughtered on the standing stones). Deut: wə-lōʾ-tāqîm ləkhā maṣṣēvāh ʾăšer śānēʾ YHWH."
  - with: hb-1sam-21-nob-and-gath
    motif: necessity-permits-forbidden-food
    refs:
    - "5:3"
    with_refs:
    - "1Sam 21:5"
    - "1Sam 21:7"
    relation: echo
    note: "Need overrides a food prohibition. Q: fa-mani ḍṭurra fī makhmaṣatin ghayra mutajānifin li-ithmin fa-inna llāha ghafūrun raḥīmun. 1Sam: ʾên leḥem ḥōl ... kî ʾim-leḥem qōdeš; the priest gives the hungry fugitive the leḥem hap-pānîm. Q makes it a general rule (hunger, makhmaṣa); 1Sam is one case, with a purity condition (ʾakh mē-ʾiššāh)."
  - with: hb-exod-34-thirteen-attributes-covenant-renewal
    motif: no-intermarriage-with-nations
    refs:
    - "5:5"
    with_refs:
    - "Exod 34:15"
    - "Exod 34:16"
    relation: contrast
    note: "Opposite rulings on eating with and marrying outsiders. Exod: pen-tikhrōt bərît ... wə-qārāʾ ləkhā wə-ʾākhaltā mi-zzivḥô; wə-lāqaḥtā mib-bənōtāyw lə-vānêkhā wə-zānû ... ʾaḥărê ʾĕlōhêhen. Q: wa-ṭaʿāmu lladhīna ūtū l-kitāba ḥillun lakum ... wa-l-muḥṣanātu mina lladhīna ūtū l-kitāba, so their food is lawful and their chaste women may be married. The HB ban concerns the Canaanites; Q's permission concerns the People of the Book."
  - with: hb-neh-10-sealed-covenant
    motif: no-intermarriage-with-nations
    refs:
    - "5:5"
    with_refs:
    - "Neh 10:31"
    relation: contrast
    note: "Neh: wa-ʾăšer lōʾ-nittēn bənōtênû lə-ʿammê hā-ʾāreṣ wə-ʾet-bənōtêhem lōʾ niqqaḥ lə-vānênû, a sworn pledge (bāʾîm bə-ʾālāh û-vi-šəvûʿāh, 10:30). Q 5:5 opens marriage to chaste women of 'those given the Book before you'."
  - with: hb-exod-23-justice-sabbatical-festivals
    motif: hatred-must-not-pervert-justice
    refs:
    - "5:2"
    with_refs:
    - "Exod 23:4"
    - "Exod 23:5"
    relation: echo
    note: "The cognate root ś-n-ʾ / sh-n-ʾ for enmity. Q: wa-lā yajrimannakum shanaʾānu qawmin an ṣaddūkum ʿani l-masjidi l-ḥarāmi an taʿtadū. Exod: kî-tirʾeh ḥămôr śōnaʾăkhā rōvēṣ ... ʿāzōv taʿăzōv ʿimmô; a duty toward the one who hates you."
- unit: quran-5-ablution-covenant-justice
  checked: [hb-exod-30-incense-altar-census-laver, hb-exod-40-tabernacle-erected-glory-fills, hb-exod-24-covenant-ratification, hb-ps-141-prayer-as-incense, hb-deut-28-blessings-curses, hb-isa-25-banquet-and-death-swallowed, hb-lev-15-genital-discharges, hb-exod-23-justice-sabbatical-festivals]
  matches:
  - with: hb-exod-30-incense-altar-census-laver
    motif: bronze-laver-for-washing-hands-and-feet
    refs:
    - "5:6"
    with_refs:
    - "Exod 30:19"
    - "Exod 30:20"
    - "Exod 30:21"
    relation: divergence
    note: "Washing hands and feet before approaching God. Exod: wə-rāḥăṣû ʾAhărōn û-vānāyw mimmennû ʾet-yədêhem wə-ʾet-raglêhem ... wə-lōʾ yāmutû, for priests entering the tent, on pain of death. Q: idhā qumtum ilā l-ṣalāti fa-ghsilū wujūhakum wa-aydiyakum ilā l-marāfiqi ... wa-arjulakum ilā l-kaʿbayn, for every believer before each prayer. Q adds the face and wiping the head, and gives the reason as relief (mā yurīdu llāhu li-yajʿala ʿalaykum min ḥarajin), not the threat of death."
  - with: hb-exod-40-tabernacle-erected-glory-fills
    motif: bronze-laver-for-washing-hands-and-feet
    refs:
    - "5:6"
    with_refs:
    - "Exod 40:31"
    - "Exod 40:32"
    relation: echo
    note: "Exod: wə-rāḥăṣû mimmennû Mōšeh wə-ʾAhărōn û-vānāyw ʾet-yədêhem wə-ʾet-raglêhem bə-vōʾām ʾel-ʾōhel môʿēd. Q 5:6 washing face, hands and feet idhā qumtum ilā l-ṣalāti."
  - with: hb-lev-15-genital-discharges
    motif: bathing-after-sexual-impurity
    refs:
    - "5:6"
    with_refs:
    - "Lev 15:16"
    - "Lev 15:18"
    relation: parallel
    note: "Sexual impurity requires a full wash. Q: wa-in kuntum junuban fa-ṭṭahharū ... aw lāmastumu l-nisāʾa. Lev: wə-rāḥaṣ bam-mayim ʾet-kol-bəśārô; wə-ʾiššāh ʾăšer yiškav ʾîš ʾōtāh ... wə-rāḥăṣû vam-mayim. Q adds the waterless substitute (fa-tayammamū ṣaʿīdan ṭayyiban) and drops 'unclean until evening'."
  - with: hb-exod-24-covenant-ratification
    motif: people-accept-covenant-we-will-do
    refs:
    - "5:7"
    with_refs:
    - "Exod 24:7"
    relation: parallel
    note: "Covenant assent formula. Q: wa-mīthāqahu lladhī wāthaqakum bihi idh qultum samiʿnā wa-aṭaʿnā (addressed to the believers). Exod: kōl ʾăšer-dibber YHWH naʿăśeh wə-nišmāʿ. The pledge passes from Israel at Sinai to the new community. Contrast Q 4:46 samiʿnā wa-ʿaṣaynā."
  - with: hb-exod-23-justice-sabbatical-festivals
    motif: hatred-must-not-pervert-justice
    refs:
    - "5:8"
    with_refs:
    - "Exod 23:5"
    - "Exod 23:6"
    - "Exod 23:7"
    relation: echo
    note: "Q: wa-lā yajrimannakum shanaʾānu qawmin ʿalā allā taʿdilū iʿdilū. Exod: ḥămôr śōnaʾăkhā ... lōʾ taṭṭeh mišpaṭ ʾevyōnəkhā bə-rîvô. Both have justice and help owed to one who hates you; the root is cognate (ś-n-ʾ / sh-n-ʾ)."
- unit: quran-5-covenant-twelve-chiefs
  checked: [hb-prov-19-sayings, hb-num-32-transjordan-tribes, hb-num-21-sihon-og, hb-ezek-20-history-of-rebellion, hb-ps-44-national-lament, hb-jer-33-branch-and-cosmic-covenant, hb-num-13-spies, hb-deut-14-diet-tithe, hb-ezek-2-3-commission-eaten-scroll, hb-deut-4-exhortation]
  matches:
  - with: hb-prov-19-sayings
    motif: lending-to-yhwh-by-giving-to-poor
    refs:
    - "5:12"
    with_refs:
    - "Prov 19:17"
    relation: parallel
    note: "Q: wa-aqraḍtumu llāha qarḍan ḥasanan la-ukaffiranna ʿankum sayyiʾātikum (a loan to God repaid with forgiveness and paradise). Prov: malwēh YHWH ḥônēn dāl û-gəmulô yəšallem-lô. Prov repays the loan to the poor; Q lists the loan among covenant terms with prayer and zakāt."
  - with: hb-num-13-spies
    motif: twelve-chieftains-of-israel
    refs:
    - "5:12"
    with_refs:
    - "Num 13:2"
    - "Num 13:3"
    relation: parallel
    note: "Q: wa-baʿathnā minhumu thnay ʿashara naqīban (twelve chiefs 'sent/raised'). Num: šəlaḥ-ləkhā ʾănāšîm ... ʾîš ʾeḥād ʾîš ʾeḥād lə-maṭṭēh ʾăvōtāyw ... kōl nāśîʾ vāhem. One chief per tribe. In Q they are tied to taking the covenant, not to scouting."
  - with: hb-deut-14-diet-tithe
    motif: children-of-god-israel
    refs:
    - "5:18"
    with_refs:
    - "Deut 14:1"
    relation: response
    note: "Deut: bānîm ʾattem la-YHWH ʾĕlōhêkhem. Q quotes the claim and rejects it: wa-qālati l-yahūdu wa-l-naṣārā naḥnu abnāʾu llāhi wa-aḥibbāʾuhu qul fa-lima yuʿadhdhibukum bi-dhunūbikum bal antum basharun mimman khalaqa."
  - with: hb-ezek-2-3-commission-eaten-scroll
    motif: hearts-made-hard
    refs:
    - "5:13"
    with_refs:
    - "Ezek 3:7"
    relation: echo
    note: "The cognate root q-s-w / q-š-h for a hard heart. Q: wa-jaʿalnā qulūbahum qāsiyatan. Ezek: kî kol-bêt Yiśrāʾēl ḥizqê-mēṣaḥ û-qəšê-lēv hēmmāh. In Q God makes the hearts hard as a penalty for breaking the covenant (fa-bi-mā naqḍihim mīthāqahum)."
  - with: hb-deut-4-exhortation
    motif: forgot-part-of-reminder
    refs:
    - "5:13"
    - "5:14"
    with_refs:
    - "Deut 4:9"
    - "Deut 4:23"
    relation: echo
    note: "Deut warns pen-tiškaḥ ʾet-had-dəvārîm; pen-tiškəḥû ʾet-bərît YHWH. Q reports it as done: wa-nasū ḥaẓẓan mimmā dhukkirū bihi, of Jews and then Christians (alladhīna qālū innā naṣārā)."
- unit: quran-5-holy-land-refusal
  checked: [hb-num-13-spies, hb-num-14-rebellion-verdict, hb-deut-1-spies-retold, hb-josh-5-circumcision-passover-commander, hb-ezek-20-history-of-rebellion, hb-ezek-37-two-sticks, hb-exod-19-sinai-theophany]
  matches:
  - with: hb-num-13-spies
    motif: giants-in-the-land
    refs:
    - "5:22"
    with_refs:
    - "Num 13:28"
    - "Num 13:33"
    relation: parallel
    note: "Q: inna fīhā qawman jabbārīna wa-innā lan nadkhulahā ḥattā yakhrujū minhā. Num: ʿaz hā-ʿām ... wə-gam yəlidê hā-ʿănāq rāʾînû šām; ha-nnəfîlîm bənê ʿănāq. Q drops the spies' report and the names: the people state the fear directly."
  - with: hb-num-14-rebellion-verdict
    motif: minority-faithful-report
    refs:
    - "5:23"
    with_refs:
    - "Num 14:6"
    - "Num 14:7"
    - "Num 14:8"
    - "Num 14:9"
    relation: divergence
    note: "Num names Yəhôšuaʿ bin-Nûn wə-Khālēv ben-Yəfunneh, who tear their garments and say YHWH ʾittānû ʾal-tîrāʾum. Q has only rajulāni mina lladhīna yakhāfūna (unnamed). Their advice is tactical, udkhulū ʿalayhimu l-bāba fa-idhā dakhaltumūhu fa-innakum ghālibūna, and ends wa-ʿalā llāhi fa-tawakkalū."
  - with: hb-num-13-spies
    motif: minority-faithful-report
    refs:
    - "5:23"
    with_refs:
    - "Num 13:30"
    relation: parallel
    note: "Num: ʿālōh naʿăleh wə-yāraš-nû ʾōtāh kî-yākhôl nûkhal lāh. Q: fa-idhā dakhaltumūhu fa-innakum ghālibūna. The confident 'we shall prevail' in both."
  - with: hb-deut-1-spies-retold
    motif: go-you-and-your-lord-and-fight
    refs:
    - "5:24"
    with_refs:
    - "Deut 1:26"
    - "Deut 1:30"
    relation: divergence
    note: "Deut: Moses' assurance YHWH ʾĕlōhêkhem ha-hōlēkh lifnêkhem hûʾ yillāḥēm lākhem, against the people's refusal wə-lōʾ ʾăvîtem laʿălōt. In Q the people turn the assurance into mockery: fa-dhhab anta wa-rabbuka fa-qātilā innā hāhunā qāʿidūna. 'God will fight for you' becomes 'you and your Lord go and fight'."
  - with: hb-num-14-rebellion-verdict
    motif: prophet-response-to-rebellious-people
    refs:
    - "5:25"
    with_refs:
    - "Num 14:5"
    - "Num 14:12"
    - "Num 14:13"
    - "Num 14:19"
    relation: divergence
    note: "A reversal. In Num God offers to destroy the people (ʾakkennû vad-dever ... wə-ʾeʿĕśeh ʾōtəkhā lə-gôy gādôl), and Moses intercedes (səlaḥ-nāʾ la-ʿăwōn hā-ʿām ha-zzeh). In Q Moses himself asks for separation: rabbi innī lā amliku illā nafsī wa-akhī fa-fruq baynanā wa-bayna l-qawmi l-fāsiqīna. There is no intercession; Aaron appears only as 'my brother'."
  - with: hb-num-14-rebellion-verdict
    motif: forty-years-wandering
    refs:
    - "5:26"
    with_refs:
    - "Num 14:33"
    - "Num 14:34"
    relation: divergence
    note: "Num: arbāʿîm šānāh, a year for each day of scouting (yôm laš-šānāh), until the corpses fall (ʿad-tōm pigrêkhem bam-midbār). Q: fa-innahā muḥarramatun ʿalayhim arbaʿīna sanatan yatīhūna fī l-arḍ. Q drops the day-for-a-year reckoning and the deaths of the generation, and God tells Moses fa-lā taʾsa ʿalā l-qawmi l-fāsiqīna."
  - with: hb-exod-19-sinai-theophany
    motif: kingdom-of-priests
    refs:
    - "5:20"
    with_refs:
    - "Exod 19:5"
    - "Exod 19:6"
    relation: divergence
    note: "Exod: wə-ʾattem tihyû-lî mamlekhet kōhănîm wə-gôy qādôš ... səgullāh mik-kol-hā-ʿammîm. Q: idh jaʿala fīkum anbiyāʾa wa-jaʿalakum mulūkan wa-ātākum mā lam yuʾti aḥadan mina l-ʿālamīna. 'Kingdom of priests' becomes 'prophets among you, and made you kings'. Priests drop out; the election is kept (mā lam yuʾti aḥadan)."
- unit: quran-5-two-sons-of-adam
  checked: [hb-gen-4-cain-abel, hb-jer-8-stork-and-lying-pen, hb-gen-9-noahide-covenant, hb-isa-59-sins-separate-divine-warrior, hb-exod-4-signs-aaron-bridegroom-of-blood]
  matches:
  - with: hb-gen-4-cain-abel
    motif: offering-accepted-rejected
    refs:
    - "5:27"
    with_refs:
    - "Gen 4:3"
    - "Gen 4:4"
    - "Gen 4:5"
    relation: divergence
    note: "Gen names Qayin and Hevel, specifies the gifts (pərî hā-ʾădāmāh against bəkhōrôt ṣōʾnô û-mē-ḥelvēhen), and gives no reason for God's choice (wa-yyišaʿ ... lōʾ šāʿāh). Q: the brothers are unnamed (ibnay Ādama), the gifts unspecified (qarrabā qurbānan), and the reason is spoken by the victim: innamā yataqabbalu llāhu mina l-muttaqīna."
  - with: hb-gen-4-cain-abel
    motif: warning-before-the-first-murder
    refs:
    - "5:28"
    - "5:29"
    - "5:30"
    with_refs:
    - "Gen 4:6"
    - "Gen 4:7"
    relation: divergence
    note: "A change of speaker. In Gen, God warns Cain before the murder: lāmmāh ḥārāh lākh ... lap-petaḥ ḥaṭṭāʾt rōvēṣ wə-ʾēlêkhā təšûqātô wə-ʾattāh timšol-bô. In Q God is silent and the victim gives the warning: laʾin basaṭta ilayya yadaka ... mā ana bi-bāsiṭin yadiya ilayka ... innī akhāfu llāha rabba l-ʿālamīna. The crouching desire comes back as fa-ṭawwaʿat lahu nafsuhu qatla akhīhi."
  - with: hb-gen-4-cain-abel
    motif: first-murder-fratricide
    refs:
    - "5:27"
    - "5:30"
    with_refs:
    - "Gen 4:8"
    relation: divergence
    note: "MT: wa-yyōʾmer Qayin ʾel-Hevel ʾāḥîw, with the speech missing, then wa-yyāqom ... wa-yyahargēhû. Q supplies the dialogue: qāla la-aqtulannaka, and Abel's reply. Then fa-qatalahu fa-aṣbaḥa mina l-khāsirīna. cf. (not a match) Targum Neofiti and Pseudo-Jonathan Gen 4:8, which also supply a dispute in the field."
  - with: hb-gen-4-cain-abel
    motif: earth-and-the-slain-brother
    refs:
    - "5:31"
    with_refs:
    - "Gen 4:10"
    - "Gen 4:11"
    relation: divergence
    note: "What the earth does differs. Gen: the ground opens its mouth to take the blood, and the blood cries out (qôl dəmê ʾāḥîkhā ṣōʿăqîm ʾēlay min-hā-ʾădāmāh ... ʾăšer pāṣətāh ʾet-pîhā), so the crime is exposed. Q: God sends a raven digging in the earth (ghurāban yabḥathu fī l-arḍi) to show how to hide (yuwārī) the brother's corpse (sawʾata akhīhi). Gen has no burial; Q has no interrogation ('ê Hevel), curse, wandering or mark. cf. (not a match) Pirqe de-Rabbi Eliezer 21 (raven and burial)."
  - with: hb-gen-4-cain-abel
    motif: murderers-lament
    refs:
    - "5:31"
    with_refs:
    - "Gen 4:13"
    - "Gen 4:14"
    relation: divergence
    note: "The murderer's lament. Gen: gādôl ʿăwōnî minnəśōʾ ... nāʿ wā-nād, a complaint about the punishment. Q: yā waylatā aʿajaztu an akūna mithla hādhā l-ghurābi fa-uwāriya sawʾata akhī fa-aṣbaḥa mina l-nādimīna, shame at being outdone by a raven, and remorse. Q has no punishment on earth; it ends in remorse."
  - with: hb-gen-9-noahide-covenant
    motif: bloodshed-requires-bloodshed
    refs:
    - "5:32"
    with_refs:
    - "Gen 9:5"
    - "Gen 9:6"
    relation: divergence
    note: "Both state the worth of a single human life. Gen: šōfēkh dam hā-ʾādām bā-ʾādām dāmô yiššāfēkh kî bə-ṣelem ʾĕlōhîm ʿāśāh ʾet-hā-ʾādām; one life for one, grounded in the image of God. Q: man qatala nafsan bi-ghayri nafsin aw fasādin fī l-arḍi fa-ka-annamā qatala l-nāsa jamīʿan wa-man aḥyāhā fa-ka-annamā aḥyā l-nāsa jamīʿan, and it is 'written for the Children of Israel'. cf. (not a match) m. Sanhedrin 4:5, derived from dəmê (plural) in Gen 4:10."
  - with: hb-jer-8-stork-and-lying-pen
    motif: no-one-repents-what-have-i-done
    refs:
    - "5:31"
    with_refs:
    - "Jer 8:6"
    relation: contrast
    note: "Jer: ʾên ʾîš niḥām ʿal-rāʿātô lēʾmōr meh ʿāśîtî kullōh šāv bi-mrûṣātām kə-sûs šôṭēf. Q: the first murderer does lament, yā waylatā ... fa-aṣbaḥa mina l-nādimīn. Jer's 'no one repents' is the reverse of the Quranic Cain, who regrets (niḥām / nadima)."
- unit: quran-5-war-on-god-theft
  checked: [hb-exod-21-bodily-injury, hb-exod-22-property-laws, hb-ps-49-no-ransom, hb-2sam-4-ishbosheth-murdered, hb-isa-59-sins-separate-divine-warrior, hb-job-34-elihu-defends-gods-justice, hb-zeph-1-day-of-wrath]
  matches:
  - with: hb-exod-22-property-laws
    motif: penalty-for-theft
    refs:
    - "5:38"
    with_refs:
    - "Exod 22:2"
    - "Exod 22:3"
    relation: contrast
    note: "Opposite penalties for theft. Exod: šallēm yəšallēm ʾim-ʾên lô wə-nimkar bi-gnēvātô; ... ḥayyîm šənayim yəšallēm: the thief pays double and is sold if he cannot pay. Q: wa-l-sāriqu wa-l-sāriqatu fa-qṭaʿū aydiyahumā jazāʾan bi-mā kasabā nakālan mina llāhi: hand amputation for male and female thief, with repentance after (5:39)."
  - with: hb-exod-21-bodily-injury
    motif: penalty-for-theft
    refs:
    - "5:38"
    with_refs:
    - "Exod 21:37"
    relation: contrast
    note: "Exod: ḥămiššāh vāqār yəšallēm taḥat haš-šôr wə-ʾarbaʿ-ṣōʾn taḥat haś-śeh, restitution scaled to the theft. Q 5:38: fa-qṭaʿū aydiyahumā, corporal punishment in place of compensation."
  - with: hb-2sam-4-ishbosheth-murdered
    motif: hands-and-feet-cut-off-hung
    refs:
    - "5:33"
    with_refs:
    - "2Sam 4:12"
    relation: parallel
    note: "Q: an yuqattalū aw yuṣallabū aw tuqaṭṭaʿa aydīhim wa-arjuluhum min khilāfin. 2Sam: wa-yyahargûm wa-yqaṣṣəṣû ʾet-yədêhem wə-ʾet-raglêhem wa-yyitlû ʿal-hab-bərēkhāh. Hands and feet cut off and the body exposed. In 2Sam it is the king's one-off sentence on assassins; in Q a standing law for those who wage war on God and his Messenger, with 'opposite sides' and an alternative of exile (yunfaw)."
  - with: hb-ps-49-no-ransom
    motif: no-ransom-for-a-brother
    refs:
    - "5:36"
    with_refs:
    - "Ps 49:8"
    - "Ps 49:9"
    relation: parallel
    note: "The cognate root f-d-y / p-d-h. Q: law anna lahum mā fī l-arḍi jamīʿan wa-mithlahu maʿahu li-yaftadū bihi min ʿadhābi yawmi l-qiyāmati mā tuqubbila minhum. Ps: ʾāḥ lōʾ-fādōh yifdeh ʾîš lōʾ-yittēn lē-ʾlōhîm kofrô wə-yēqar pidyôn nafšām. In Ps the ransom cannot be paid for death; in Q not for the punishment of the day of resurrection."
  - with: hb-zeph-1-day-of-wrath
    motif: silver-gold-cannot-save-on-day-of-wrath
    refs:
    - "5:36"
    with_refs:
    - "Zeph 1:18"
    relation: echo
    note: "Zeph: gam-kaspām gam-zəhāvām lōʾ-yûkhal ləhaṣṣîlām bə-yôm ʿebrat YHWH. Q: mā fī l-arḍi jamīʿan wa-mithlahu maʿahu ... mā tuqubbila minhum. Wealth cannot buy rescue on the day of wrath or of resurrection."
- unit: quran-5-torah-gospel-judgment
  checked: [hb-exod-21-bodily-injury, hb-lev-24-lamp-bread-blasphemer, hb-deut-19-refuge-witnesses, hb-deut-31-joshua-torah-song, hb-isa-8-maher-shalal-and-stone-of-stumbling, hb-isa-1-indictment-of-judah, hb-prov-6-adultery-fire]
  matches:
  - with: hb-exod-21-bodily-injury
    motif: eye-for-eye
    refs:
    - "5:45"
    with_refs:
    - "Exod 21:23"
    - "Exod 21:24"
    - "Exod 21:25"
    relation: divergence
    note: "Q quotes the talion as written in the Torah (wa-katabnā ʿalayhim fīhā) but changes the list. Q: al-nafsa bi-l-nafsi wa-l-ʿayna bi-l-ʿayni wa-l-anfa bi-l-anfi wa-l-udhuna bi-l-udhuni wa-l-sinna bi-l-sinni wa-l-jurūḥa qiṣāṣun. Exod: nefeš taḥat nāfeš ʿayin taḥat ʿayin šēn taḥat šēn yād ... regel ... kəviyyāh ... peṣaʿ taḥat pāṣaʿ ḥabbûrāh. Q adds nose and ear, drops hand, foot, burn and bruise, and sums up the rest as jurūḥ (= peṣaʿ). Exod's taḥat ('in place of') becomes Q's bi-."
  - with: hb-deut-19-refuge-witnesses
    motif: eye-for-eye
    refs:
    - "5:45"
    with_refs:
    - "Deut 19:21"
    relation: contrast
    note: "Opposite instructions on mercy. Deut: wə-lōʾ tāḥôs ʿênekhā nefeš bə-nefeš ʿayin bə-ʿayin, 'your eye shall not pity' (same preposition bə- as Q's bi-). Q: fa-man taṣaddaqa bihi fa-huwa kaffāratun lahu, waiving retaliation is charity and expiation for the one who waives."
  - with: hb-lev-24-lamp-bread-blasphemer
    motif: eye-for-eye
    refs:
    - "5:45"
    with_refs:
    - "Lev 24:17"
    - "Lev 24:20"
    relation: echo
    note: "Lev: šever taḥat šever ʿayin taḥat ʿayin šēn taḥat šēn kaʾăšer yittēn mûm bā-ʾādām kēn yinnāten bô, a shorter list. Q 5:45 shares only nafs (Lev 24:17), ʿayn and sinn."
  - with: hb-deut-31-joshua-torah-song
    motif: custodians-of-the-written-torah
    refs:
    - "5:44"
    with_refs:
    - "Deut 31:9"
    - "Deut 31:26"
    relation: parallel
    note: "Guardians of the written Torah act as its witnesses. Q: wa-l-rabbāniyyūna wa-l-aḥbāru bi-mā stuḥfiẓū min kitābi llāhi wa-kānū ʿalayhi shuhadāʾa. Deut: Moses gives the Torah to ha-kkōhănîm bənê Lēwî; lāqōaḥ ʾēt sēfer hat-tôrāh ... wə-hāyāh šām bəkhā lə-ʿēd. In Deut the book itself is the witness (ʿēd); in Q the custodians are (shuhadāʾ)."
  - with: hb-prov-6-adultery-fire
    motif: torah-guidance-and-light
    refs:
    - "5:44"
    with_refs:
    - "Prov 6:23"
    relation: echo
    note: "Q: innā anzalnā l-tawrāta fīhā hudan wa-nūrun. Prov: kî nēr miṣwāh wə-tôrāh ʾôr. In Prov, tôrāh is a parent's teaching (6:20); Q means the revealed Torah."
  - with: hb-isa-1-indictment-of-judah
    motif: devourers-of-illicit-gain
    refs:
    - "5:42"
    with_refs:
    - "Isa 1:23"
    relation: echo
    note: "Judges and leaders who live on illicit gain. Q: sammāʿūna li-l-kadhibi akkālūna li-l-suḥti (suḥt, classically bribes). Isa: śārayikh sôrərîm wə-ḥavrê gannāvîm kullô ʾōhēv šōḥad wə-rōdēf šalmōnîm."
- unit: quran-5-allies-mockery
  checked: [hb-exod-20-decalogue, hb-hos-4-lawsuit-priests, hb-isa-65-rebels-and-servants, hb-1sam-3-call-of-samuel]
  matches:
  - with: hb-isa-65-rebels-and-servants
    motif: god-replaces-people
    refs:
    - "5:54"
    with_refs:
    - "Isa 65:1"
    - "Isa 65:15"
    relation: echo
    note: "God turns from a rebellious people to another. Q: man yartadda minkum ʿan dīnihi fa-sawfa yaʾtī llāhu bi-qawmin yuḥibbuhum wa-yuḥibbūnahu. Isa: nimṣēʾtî lə-lōʾ viqšunî ... ʾel-gôy lōʾ-qōrāʾ vi-šmî; wə-la-ʿăvādāyw yiqrāʾ šēm ʾaḥēr."
  - with: hb-hos-4-lawsuit-priests
    motif: priests-feed-on-sin-offerings
    refs:
    - "5:62"
    - "5:63"
    with_refs:
    - "Hos 4:6"
    - "Hos 4:8"
    - "Hos 4:9"
    relation: echo
    note: "Religious leaders profit from sin instead of stopping it. Q: law-lā yanhāhumu l-rabbāniyyūna wa-l-aḥbāru ʿan qawlihimu l-ithma wa-aklihimu l-suḥta. Hos: ḥaṭṭaʾt ʿammî yōʾkhēlû wə-ʾel-ʿăwōnām yiśʾû nafšô ... wə-hāyāh khā-ʿām kak-kōhēn. Both use the verb 'eat' (akl / ʾ-k-l)."
  - with: hb-1sam-3-call-of-samuel
    motif: leaders-fail-to-forbid-sin
    refs:
    - "5:63"
    with_refs:
    - "1Sam 3:13"
    relation: parallel
    note: "Guilt for failing to restrain. 1Sam: ba-ʿăwōn ʾăšer-yādaʿ kî-məqalləlîm lāhem bānāyw wə-lōʾ khihāh bām: Eli did not rebuke his sons, and his house is judged. Q: law-lā yanhāhumu l-rabbāniyyūna wa-l-aḥbāru ... la-biʾsa mā kānū yaṣnaʿūna: the rabbis are blamed for not forbidding."
- unit: quran-5-hand-fettered
  checked: [hb-isa-50-servant-struck, hb-lam-2-god-as-enemy, hb-num-11-taberah-quail, hb-lev-26-blessings, hb-deut-28-blessings-curses, hb-mal-3-tithes, hb-jer-5-sea-boundary]
  matches:
  - with: hb-num-11-taberah-quail
    motif: divine-power-questioned
    refs:
    - "5:64"
    with_refs:
    - "Num 11:21"
    - "Num 11:22"
    - "Num 11:23"
    relation: divergence
    note: "God's hand as the measure of his power to provide. Num: Moses doubts (ha-ṣōʾn û-vāqār yiššāḥēṭ lāhem), and God answers ha-yad YHWH tiqṣār. Q puts the doubt in the mouth of al-yahūd, yadu llāhi maghlūlatun, and answers ghullat aydīhim ... bal yadāhu mabsūṭatāni yunfiqu kayfa yashāʾu. The doubter changes from Moses to 'the Jews', and the doubt is cursed (wa-luʿinū bi-mā qālū)."
  - with: hb-isa-50-servant-struck
    motif: divine-power-questioned
    refs:
    - "5:64"
    with_refs:
    - "Isa 50:2"
    relation: echo
    note: "Isa: ha-qāṣôr qāṣərāh yādî mip-pədût wə-ʾim-ʾên-bî khōaḥ ləhaṣṣîl. God rejects the idea that his hand is shortened. Q: bal yadāhu mabsūṭatāni against the claim yadu llāhi maghlūla."
  - with: hb-lam-2-god-as-enemy
    motif: gods-hand-fettered-claim
    refs:
    - "5:64"
    with_refs:
    - "Lam 2:3"
    relation: echo
    note: "Lam, Israel's own lament: hēšîv ʾāḥôr yəmînô mip-pənê ʾôyēv, God has drawn back his right hand. Q 5:64 cites as a Jewish saying yadu llāhi maghlūlatun and rejects it. The lament motif of the withdrawn divine hand becomes a quoted claim that is refuted."
  - with: hb-lev-26-blessings
    motif: eat-from-above-and-below
    refs:
    - "5:66"
    with_refs:
    - "Lev 26:3"
    - "Lev 26:4"
    - "Lev 26:5"
    relation: parallel
    note: "Abundance on condition of keeping the law. Q: wa-law annahum aqāmū l-tawrāta wa-l-injīla ... la-akalū min fawqihim wa-min taḥti arjulihim. Lev: ʾim-bə-ḥuqqōtay tēlēkhû ... wə-nātattî gišmêkhem bə-ʿittām wə-nātənāh hā-ʾāreṣ yəvûlāh ... wa-ʾăkhaltem laḥməkhem lā-śōvaʿ. Rain from above, crops from below."
  - with: hb-deut-28-blessings-curses
    motif: eat-from-above-and-below
    refs:
    - "5:66"
    with_refs:
    - "Deut 28:12"
    relation: parallel
    note: "Deut: yiftaḥ YHWH ləkhā ʾet-ʾôṣārô haṭ-ṭôv ʾet-haš-šāmayim lātēt məṭar-ʾarṣəkhā bə-ʿittô. Q: la-akalū min fawqihim wa-min taḥti arjulihim, conditional on aqāmū l-tawrāta."
  - with: hb-mal-3-tithes
    motif: eat-from-above-and-below
    refs:
    - "5:66"
    with_refs:
    - "Mal 3:10"
    relation: echo
    note: "Mal: ʾim-lōʾ ʾeftaḥ lākhem ʾēt ʾărubbôt haš-šāmayim wa-hărîqōtî lākhem bərākhāh, abundance from above for obedience. Q: min fawqihim."
  - with: hb-jer-5-sea-boundary
    motif: eyes-that-do-not-see
    refs:
    - "5:71"
    with_refs:
    - "Jer 5:21"
    relation: echo
    note: "Q: fa-ʿamū wa-ṣammū thumma tāba llāhu ʿalayhim thumma ʿamū wa-ṣammū. Jer: ʿam sākhāl wə-ʾên lēv ʿênayim lāhem wə-lōʾ yirʾû ʾoznayim lāhem wə-lōʾ yišmāʿû. Q adds the cycle: blind and deaf, forgiven, blind and deaf again."
- unit: quran-5-christology-monks
  checked: [hb-ps-69-deep-waters, hb-exod-20-decalogue, hb-exod-34-thirteen-attributes-covenant-renewal, hb-deut-5-decalogue, hb-jer-10-idols-scarecrows, hb-neh-8-ezra-reads-torah, hb-ps-50-divine-lawsuit]
  matches:
  - with: hb-ps-69-deep-waters
    motif: imprecation-on-enemies
    refs:
    - "5:78"
    with_refs:
    - "Ps 69:23"
    - "Ps 69:28"
    - "Ps 69:29"
    relation: echo
    note: "Q: luʿina lladhīna kafarū min banī Isrāʾīla ʿalā lisāni Dāwūda wa-ʿĪsā bni Maryama. Ps (lə-Dāwid): yəhî-šulḥānām lifnêhem lə-fāḥ ... tənāh-ʿāwōn ʿal-ʿăwōnām ... yimmāḥû mis-sēfer ḥayyîm. The Davidic curse in the Psalm targets the speaker's persecutors; Q applies it to the unbelievers of Israel."
  - with: hb-jer-10-idols-scarecrows
    motif: idols-neither-harm-nor-benefit
    refs:
    - "5:76"
    with_refs:
    - "Jer 10:5"
    relation: parallel
    note: "Q: a-taʿbudūna min dūni llāhi mā lā yamliku lakum ḍarran wa-lā nafʿan. Jer: ʾal-tîrʾû mēhem kî-lōʾ yārēʿû wə-gam-hêṭêv ʾên ʾôtām. The same pair, harm and good. Q turns it against worship of the Messiah and his mother."
  - with: hb-ps-50-divine-lawsuit
    motif: god-does-not-eat-flesh-of-bulls
    refs:
    - "5:75"
    with_refs:
    - "Ps 50:12"
    - "Ps 50:13"
    relation: echo
    note: "Both assume God does not eat. Ps: ʾim-ʾerʿav lōʾ-ʾōmar lākh ... ha-ʾôkhal bəśar ʾabbîrîm. Q: kānā yaʾkulāni l-ṭaʿāma, so the Messiah and his mother ate food and are therefore not divine. Q argues from that premise."
  - with: hb-neh-8-ezra-reads-torah
    motif: weeping-at-hearing-the-law
    refs:
    - "5:83"
    with_refs:
    - "Neh 8:9"
    relation: parallel
    note: "Q: wa-idhā samiʿū mā unzila ilā l-rasūli tarā aʿyunahum tafīḍu mina l-damʿi mimmā ʿarafū mina l-ḥaqq (Christians hearing the Quran). Neh: kî vôkhîm kol-hā-ʿām kə-šomʿām ʾet-divrê hat-tôrāh. Both weep on hearing scripture read. Neh's leaders forbid the weeping (ʾal-tivkû); Q praises it."
  - with: hb-deut-5-decalogue
    motif: prohibition-of-other-gods
    refs:
    - "5:72"
    - "5:73"
    with_refs:
    - "Deut 5:7"
    relation: echo
    note: "Q: wa-mā min ilāhin illā ilāhun wāḥidun; man yushrik bi-llāhi fa-qad ḥarrama llāhu ʿalayhi l-janna. Deut: lōʾ yihyeh-ləkhā ʾĕlōhîm ʾăḥērîm ʿal-pānāy. Q has Jesus himself proclaim it (uʿbudū llāha rabbī wa-rabbakum)."
- unit: quran-5-oaths-wine-game
  checked: [hb-lev-5-graduated-and-guilt-offerings, hb-num-6-nazirite, hb-hos-4-lawsuit-priests, hb-exod-34-thirteen-attributes-covenant-renewal, hb-deut-5-decalogue, hb-lev-11-dietary-laws]
  matches:
  - with: hb-lev-5-graduated-and-guilt-offerings
    motif: rash-oath-requires-atonement
    refs:
    - "5:89"
    with_refs:
    - "Lev 5:4"
    - "Lev 5:6"
    - "Lev 5:7"
    - "Lev 5:11"
    relation: divergence
    note: "Both have graded expiation for an oath. Lev: nefeš kî tiššāvaʿ ləvaṭṭēʾ vi-śfātayim, a lamb or goat, if one cannot afford it two birds, and if not that, a tenth of an ephah of flour (wə-ʾim-lōʾ taggîaʿ yādô ... wə-ʾim-lōʾ taśśîg yādô). Q: lā yuʾākhidhukumu llāhu bi-l-laghwi fī aymānikum, and for binding oaths ʾiṭʿāmu ʿasharati masākīna ... aw kiswatuhum aw taḥrīru raqabatin fa-man lam yajid fa-ṣiyāmu thalāthati ayyām. The steps are kept ('whoever cannot find'), but the sacrifice becomes feeding and clothing the poor, freeing a slave, and fasting. Q exempts the idle oath, which Lev 5:4 covers."
  - with: hb-num-6-nazirite
    motif: abstinence-from-wine
    refs:
    - "5:87"
    - "5:90"
    with_refs:
    - "Num 6:3"
    - "Num 6:11"
    relation: divergence
    note: "Abstention from wine. Num: by vow, as a mark of holiness (mi-yyayin wə-šēkhār yazzîr), and the Nazirite brings a ḥaṭṭāʾt, wə-khipper ʿālāyw mēʾăšer ḥāṭāʾ ʿal-ha-nnāfeš. Q forbids self-imposed abstinence (lā tuḥarrimū ṭayyibāti mā aḥalla llāhu lakum, 5:87), yet makes wine itself rijsun min ʿamali l-shayṭāni for all (5:90). cf. (not a match) b. Taʿanit 11a, which reads Num 6:11 as the sin of self-denial."
  - with: hb-hos-4-lawsuit-priests
    motif: divination-by-wood-and-staff
    refs:
    - "5:90"
    - "5:91"
    with_refs:
    - "Hos 4:11"
    - "Hos 4:12"
    relation: echo
    note: "Wine paired with divination by wood. Q: innamā l-khamru wa-l-maysiru wa-l-anṣābu wa-l-azlāmu rijsun ... wa-yaṣuddakum ʿan dhikri llāhi. Hos: zənût wə-yayin wə-tîrôš yiqqaḥ-lēv; ʿammî bə-ʿēṣô yišʾāl û-maqlô yaggîd lô. Wine 'takes the heart' and the people consult their stick, as Q pairs wine with divining arrows."
  - with: hb-lev-11-dietary-laws
    motif: fins-and-scales-rule
    refs:
    - "5:96"
    with_refs:
    - "Lev 11:9"
    - "Lev 11:10"
    relation: contrast
    note: "Opposite rulings on sea creatures. Lev: ʾet-zeh tōʾkhəlû ... kōl ʾăšer-lô sənappîr wə-qaśqeśet; anything without them is šeqeṣ. Q: uḥilla lakum ṣaydu l-baḥri wa-ṭaʿāmuhu, all sea game is lawful, even in iḥrām."
- unit: quran-5-questions-pagan-camels
  checked: [hb-isa-65-rebels-and-servants, hb-deut-18-levites-prophet, hb-isa-63-communal-lament, hb-deut-29-covenant-moab, hb-deut-15-release-year, hb-jer-44-queen-of-heaven]
  matches:
  - with: hb-deut-29-covenant-moab
    motif: secret-things-belong-to-god
    refs:
    - "5:101"
    with_refs:
    - "Deut 29:28"
    relation: echo
    note: "Hidden matters are left with God. Q: lā tasʾalū ʿan ashyāʾa in tubda lakum tasuʾkum ... ʿafā llāhu ʿanhā. Deut: ha-nnistārōt la-YHWH ʾĕlōhênû wə-ha-nniglōt lānû û-lə-vānênû ʿad-ʿôlām laʿăśôt."
  - with: hb-deut-15-release-year
    motif: firstling-consecrated
    refs:
    - "5:103"
    with_refs:
    - "Deut 15:19"
    relation: contrast
    note: "Animals dedicated by birth order and freed from work. Deut, by God's command: kol-hab-bəkhôr ... taqdîš la-YHWH ... lōʾ taʿăvōd bi-vkhōr šôrekhā wə-lōʾ tāgōz bəkhôr ṣōʾnekhā. Q: mā jaʿala llāhu min baḥīratin wa-lā sāʾibatin wa-lā waṣīlatin wa-lā ḥāmin. God denies instituting the pagan dedications, which also turn on birth order and release from use (sāʾiba, ḥām)."
  - with: hb-jer-44-queen-of-heaven
    motif: ancestral-custom-defense
    refs:
    - "5:104"
    with_refs:
    - "Jer 44:17"
    relation: parallel
    note: "Idolaters defend cult by the precedent of their fathers. Q: ḥasbunā mā wajadnā ʿalayhi ābāʾanā. Jer: kaʾăšer ʿāśînû ʾănaḥnû wa-ʾăvōtênû malkhênû wə-śārênû bə-ʿārê Yəhûdāh. Q answers a-wa-law kāna ābāʾuhum lā yaʿlamūna shayʾan."
- unit: quran-5-bequest-witnesses
  checked: [hb-lev-5-graduated-and-guilt-offerings, hb-num-5-sotah-ordeal, hb-ezra-10-dismissal-of-foreign-wives, hb-deut-19-refuge-witnesses]
  matches:
  - with: hb-lev-5-graduated-and-guilt-offerings
    motif: witness-who-hears-adjuration-must-testify
    refs:
    - "5:106"
    with_refs:
    - "Lev 5:1"
    relation: parallel
    note: "Withholding testimony under oath is sin. Q: fa-yuqsimāni bi-llāhi ... wa-lā naktumu shahādata llāhi innā idhan la-mina l-āthimīna. Lev: wə-šāmʿāh qôl ʾālāh wə-hûʾ ʿēd ... ʾim-lôʾ yaggîd wə-nāśāʾ ʿăwōnô. Both name the guilt (āthimīn / ʿăwōnô) of the witness who conceals."
  - with: hb-num-5-sotah-ordeal
    motif: oath-imposed-on-suspicion
    refs:
    - "5:106"
    - "5:107"
    with_refs:
    - "Num 5:19"
    relation: echo
    note: "An oath before God settles a suspicion that cannot be proven. Q: taḥbisūnahumā min baʿdi l-ṣalāti fa-yuqsimāni bi-llāhi ini rtabtum. Num: wə-hišbîaʿ ʾōtāh hak-kōhēn, with the curse-water ordeal. In Q, if the oath is found false, two heirs swear a counter-oath; there is no ordeal."
  - with: hb-deut-19-refuge-witnesses
    motif: two-witnesses-for-capital-case
    refs:
    - "5:106"
    - "5:107"
    with_refs:
    - "Deut 19:15"
    - "Deut 19:18"
    relation: echo
    note: "Two witnesses are required, and false testimony is uncovered. Q: ithnāni dhawā ʿadlin minkum aw ākharāni min ghayrikum; fa-in ʿuthira ʿalā annahumā staḥaqqā ithman fa-ākharāni yaqūmāni maqāmahumā. Deut: ʿal-pî šənê ʿēdîm ...; wə-dārəšû haš-šōfəṭîm hêṭēv wə-hinnēh ʿēd-šeqer. In Q the remedy is a counter-oath by the heirs, not the court."
- unit: quran-5-jesus-miracles-table
  checked: [hb-ps-78-history, hb-ps-51-miserere, hb-isa-63-communal-lament, hb-exod-34-thirteen-attributes-covenant-renewal, hb-exod-3-burning-bush, hb-ezek-20-history-of-rebellion, hb-gen-2-eden-adam-woman, hb-2kgs-5-naaman, hb-exod-32-tablets-broken-levites]
  matches:
  - with: hb-ps-78-history
    motif: table-in-the-wilderness
    refs:
    - "5:112"
    - "5:113"
    - "5:114"
    - "5:115"
    with_refs:
    - "Ps 78:18"
    - "Ps 78:19"
    - "Ps 78:21"
    - "Ps 78:24"
    relation: divergence
    note: "The same question about a table. Ps: wa-ynassû-ʾēl bi-lvāvām ... ha-yûkhal ʾēl laʿărōkh šulḥān bam-midbār, the rebels' test, answered by wrath (wa-yyitʿabbār) and then manna rained down (wa-yyamṭēr ʿălêhem mān ... dəgan-šāmayim). Q: hal yastaṭīʿu rabbuka an yunazzila ʿalaynā māʾidatan mina l-samāʾi, asked by the disciples (al-ḥawāriyyūn), not rebels. Jesus warns (ittaqū llāh), then prays; God grants it, and the threat comes afterwards: fa-man yakfur baʿdu ... ʿadhāban lā uʿadhdhibuhu aḥadan. The table becomes an ʿīd. In Ps the punishment is for asking; in Q for disbelief after the sign."
  - with: hb-ps-51-miserere
    motif: holy-spirit-of-god
    refs:
    - "5:110"
    with_refs:
    - "Ps 51:13"
    relation: echo
    note: "The same construct, rūḥ al-qudus = rûaḥ qodšəkhā. Q: idh ayyadtuka bi-rūḥi l-qudusi, a holy spirit that strengthens Jesus. Ps: wə-rûaḥ qodšəkhā ʾal-tiqqaḥ mimmennî, prayed for so that it is not taken away."
  - with: hb-isa-63-communal-lament
    motif: holy-spirit-of-god
    refs:
    - "5:110"
    with_refs:
    - "Isa 63:10"
    - "Isa 63:11"
    relation: echo
    note: "Isa: ha-śśām bə-qirbô ʾet-rûaḥ qodšô, the holy spirit set among Moses' people, whom they grieved (wə-ʿiṣṣəvû ʾet-rûaḥ qodšô). Q: Jesus supported by rūḥ al-qudus while bani Isrāʾīl reject his signs as siḥrun mubīn."
  - with: hb-gen-2-eden-adam-woman
    motif: breath-of-life-into-nostrils
    refs:
    - "5:110"
    with_refs:
    - "Gen 2:7"
    relation: echo
    note: "Shaping from earth, then blowing to bring life. Q: wa-idh takhluqu mina l-ṭīni ka-hayʾati l-ṭayri bi-idhnī fa-tanfukhu fīhā fa-takūnu ṭayran bi-idhnī. Gen: wa-yyîṣer YHWH ʾĕlōhîm ʾet-hā-ʾādām ʿāfār min-hā-ʾădāmāh wa-yyippaḥ bə-ʾappāyw nišmat ḥayyîm. Jesus repeats God's creative act, but only 'by my leave' (bi-idhnī). cf. (not a match) Infancy Gospel of Thomas 2."
  - with: hb-2kgs-5-naaman
    motif: am-i-god-to-kill-and-make-alive
    refs:
    - "5:110"
    with_refs:
    - "2Kgs 5:7"
    relation: echo
    note: "Curing leprosy and raising the dead are God's prerogatives. 2Kgs: ha-ʾĕlōhîm ʾānî ləhāmît û-ləhaḥăyôt kî-zeh šōlēaḥ ʾēlay leʾĕsōf ʾîš miṣ-ṣāraʿtô. Q: wa-tubriʾu l-akmaha wa-l-abraṣa bi-idhnī wa-idh tukhriju l-mawtā bi-idhnī. Jesus does both, and the repeated bi-idhnī keeps them God's acts."
  - with: hb-exod-32-tablets-broken-levites
    motif: intercessor-leaves-fate-to-god
    refs:
    - "5:118"
    with_refs:
    - "Exod 32:32"
    relation: echo
    note: "An intercessor leaves the people's fate to God in a conditional. Exod: wə-ʿattāh ʾim-tiśśāʾ ḥaṭṭāʾtām wə-ʾim-ʾayin məḥēnî nāʾ mi-sifrəkhā. Q: in tuʿadhdhibhum fa-innahum ʿibāduka wa-in taghfir lahum fa-innaka anta l-ʿazīzu l-ḥakīmu. Moses stakes himself on the outcome; Jesus does not."
- unit: quran-6-creation-rejecters
  checked: [hb-isa-45-cyrus-the-anointed, hb-job-33-elihu-dreams-and-angel, hb-job-10-why-did-you-make-me, hb-neh-9-levites-confession, hb-ps-78-history, hb-deut-32-song-of-moses, hb-gen-1-creation-six-days, hb-gen-18-visitors-at-mamre]
  matches:
  - with: hb-isa-45-cyrus-the-anointed
    motif: god-creates-light-and-darkness-peace-and-evil
    refs:
    - "6:1"
    with_refs:
    - "Isa 45:7"
    relation: echo
    note: "Q: al-ḥamdu li-llāhi lladhī khalaqa l-samāwāti wa-l-arḍa wa-jaʿala l-ẓulumāti wa-l-nūra. Isa: yôṣēr ʾôr û-vôrēʾ ḥōšekh. Both make God the maker of darkness as well as light. Q has the pair light/darkness only, without Isa's šālôm / rāʿ."
  - with: hb-gen-1-creation-six-days
    motif: origin-of-darkness
    refs:
    - "6:1"
    with_refs:
    - "Gen 1:2"
    - "Gen 1:3"
    - "Gen 1:4"
    relation: divergence
    note: "Gen: wə-ḥōšekh ʿal-pənê təhôm already exists, God says yəhî ʾôr and then separates (wa-yyavdēl ... bên hā-ʾôr û-vên ha-ḥōšekh). Only light is created. Q 6:1: jaʿala l-ẓulumāti wa-l-nūra, God made the darknesses too (plural ẓulumāt, singular nūr). Darkness is put under creation, as in Isa 45:7, not left before it."
  - with: hb-job-10-why-did-you-make-me
    motif: human-formed-from-earth
    refs:
    - "6:2"
    with_refs:
    - "Job 10:9"
    relation: parallel
    note: "From clay to the appointed end. Q: huwa lladhī khalaqakum min ṭīnin thumma qaḍā ajalan wa-ajalun musamman ʿindahu. Job: zəkhor-nāʾ kî-kha-ḥōmer ʿăśîtānî wə-ʾel-ʿāfār təšîvēnî. Job pleads from it; Q uses it against doubt (thumma antum tamtarūn)."
  - with: hb-job-33-elihu-dreams-and-angel
    motif: pinched-off-from-clay
    refs:
    - "6:2"
    with_refs:
    - "Job 33:6"
    relation: echo
    note: "Job: mē-ḥōmer qōraṣtî gam-ʾānî. Q: khalaqakum min ṭīnin. Human origin in clay (ḥōmer = ṭīn)."
  - with: hb-gen-18-visitors-at-mamre
    motif: three-divine-visitors
    refs:
    - "6:8"
    - "6:9"
    with_refs:
    - "Gen 18:2"
    relation: echo
    note: "Heavenly messengers appear as men. Gen: wə-hinnēh šəlōšāh ʾănāšîm niṣṣāvîm ʿālāyw. Q: wa-law jaʿalnāhu malakan la-jaʿalnāhu rajulan wa-la-labasnā ʿalayhim mā yalbisūna. An angel sent would come as a man, and the confusion would remain. Q uses the HB idea against the demand for an angel."
- unit: quran-6-mercy-judgment
  checked: [hb-ps-50-divine-lawsuit, hb-judg-10-tola-jair-ammon, hb-isa-6-throne-vision, hb-exod-34-thirteen-attributes-covenant-renewal, hb-jer-7-obedience-not-sacrifice, hb-ezek-14-idols-in-heart-noah-daniel-job, hb-deut-32-song-of-moses]
  matches:
  - with: hb-ps-50-divine-lawsuit
    motif: god-does-not-eat-flesh-of-bulls
    refs:
    - "6:14"
    with_refs:
    - "Ps 50:12"
    - "Ps 50:13"
    relation: parallel
    note: "God needs no food. Q: wa-huwa yuṭʿimu wa-lā yuṭʿamu. Ps: ʾim-ʾerʿav lōʾ-ʾōmar lākh kî-lî tēvēl û-məlōʾāh; ha-ʾôkhal bəśar ʾabbîrîm. Ps rejects the idea that sacrifice feeds God; Q makes it a divine attribute (he feeds, he is not fed)."
  - with: hb-deut-32-song-of-moses
    motif: mocking-where-are-their-gods
    refs:
    - "6:22"
    - "6:24"
    with_refs:
    - "Deut 32:37"
    - "Deut 32:38"
    relation: parallel
    note: "God asks where the false gods are. Q: ayna shurakāʾukumu lladhīna kuntum tazʿumūna ... wa-ḍalla ʿanhum mā kānū yaftarūn. Deut: ʾê ʾĕlōhêmô ṣûr ḥāsāyû vô ʾăšer ḥēlev zəvāḥêmô yōʾkhēlû ... yāqûmû wə-yaʿzərukhem. Deut sets it in history; Q on the day of gathering (yawma naḥshuruhum)."
  - with: hb-judg-10-tola-jair-ammon
    motif: mocking-where-are-their-gods
    refs:
    - "6:22"
    with_refs:
    - "Judg 10:14"
    relation: echo
    note: "Judg: ləkhû wə-zaʿăqû ʾel-hā-ʾĕlōhîm ʾăšer bəḥartem bām hēmmāh yôšîʿû lākhem bə-ʿēt ṣāratkhem. Q: ayna shurakāʾukum. The gods they chose fail them; in Judg God then relents (10:16), in Q the idolaters deny they ever had partners (wa-llāhi rabbinā mā kunnā mushrikīn)."
  - with: hb-isa-6-throne-vision
    motif: commission-to-harden-hearts
    refs:
    - "6:25"
    with_refs:
    - "Isa 6:10"
    relation: divergence
    note: "The same dullness of heart and ears. Isa: hašmēn lēv-hā-ʿām haz-zeh wə-ʾoznāyw hakhbēd wə-ʿênāyw hāšaʿ, and the prophet is told to cause it. Q: wa-jaʿalnā ʿalā qulūbihim akinnatan an yafqahūhu wa-fī ādhānihim waqran, and God does it. 'Heavy ears' (k-b-d) = waqr, heaviness."
  - with: hb-exod-34-thirteen-attributes-covenant-renewal
    motif: god-wrote-mercy-on-himself
    refs:
    - "6:12"
    with_refs:
    - "Exod 34:6"
    relation: echo
    note: "God declares his own mercy about himself. Q: kataba ʿalā nafsihi l-raḥmata, mercy prescribed by God for himself. Exod: wa-yyiqrāʾ YHWH YHWH ʾēl raḥûm wə-ḥannûn, God proclaiming his merciful name. Both use the root r-ḥ-m (raḥma / raḥûm)."
- unit: quran-6-prophet-consoled-signs
  checked: [hb-amos-9-altar-and-booth-of-david, hb-ps-139-searched-and-known, hb-gen-28-jacobs-ladder, hb-jonah-4-qiqayon, hb-ps-104-creation-hymn, hb-isa-63-communal-lament, hb-ps-78-history]
  matches:
  - with: hb-gen-28-jacobs-ladder
    motif: ladder-to-heaven-sullam
    refs:
    - "6:35"
    with_refs:
    - "Gen 28:12"
    relation: echo
    note: "The same word for a ladder to heaven: Q sullam = Heb sullām (hapax in HB). Gen: sullām muṣṣāv ʾarṣāh wə-rōʾšô maggîaʿ haš-šāmāymāh. Q: fa-ini staṭaʿta an tabtaghiya nafaqan fī l-arḍi aw sullaman fī l-samāʾi fa-taʾtiyahum bi-āyatin. The ladder is a hypothetical, impossible way to fetch a sign; in Gen angels go up and down it."
  - with: hb-amos-9-altar-and-booth-of-david
    motif: earth-and-sky-extremes
    refs:
    - "6:35"
    with_refs:
    - "Amos 9:2"
    relation: echo
    note: "The paired extremes 'into the earth / up to the sky'. Amos: ʾim-yaḥtərû vi-šʾôl ... wə-ʾim-yaʿălû haš-šāmayim. Q: nafaqan fī l-arḍi aw sullaman fī l-samāʾ. In Amos, flight from God; in Q, the Prophet's impossible search for a sign."
  - with: hb-ps-139-searched-and-known
    motif: earth-and-sky-extremes
    refs:
    - "6:35"
    with_refs:
    - "Ps 139:8"
    relation: echo
    note: "Ps: ʾim-ʾessaq šāmayim šām ʾāttāh wə-ʾaṣṣîʿāh šəʾôl hinnekkā. Q: nafaqan fī l-arḍi aw sullaman fī l-samāʾ. The same heaven/underworld merism."
  - with: hb-jonah-4-qiqayon
    motif: animals-under-gods-care
    refs:
    - "6:38"
    with_refs:
    - "Jonah 4:11"
    relation: echo
    note: "Animals count before God. Jonah ends û-vəhēmāh rabbāh. Q: wa-mā min dābbatin fī l-arḍi wa-lā ṭāʾirin yaṭīru bi-janāḥayhi illā umamun amthālukum ... thumma ilā rabbihim yuḥsharūna. Q goes further: animals are communities like you, gathered to their Lord."
  - with: hb-ps-104-creation-hymn
    motif: animals-under-gods-care
    refs:
    - "6:38"
    with_refs:
    - "Ps 104:27"
    - "Ps 104:29"
    relation: echo
    note: "Ps: kullām ʾēlêkhā yəśabbērûn ... tōsēf rûḥām yigwāʿûn wə-ʾel-ʿăfārām yəšûvûn. Q 6:38: every beast and bird is an umma 'like you', ilā rabbihim yuḥsharūna. Ps has them return to dust; Q has them gathered to God."
  - with: hb-ps-78-history
    motif: distress-prayer-then-ingratitude
    refs:
    - "6:40"
    - "6:41"
    - "6:43"
    with_refs:
    - "Ps 78:34"
    - "Ps 78:36"
    - "Ps 78:37"
    relation: parallel
    note: "Turning to God under blows, then relapsing. Ps: ʾim-hărāgām û-dərāšûhû wə-šāvû wə-šiḥărû-ʾēl ... wa-yfattûhû bə-fîhem ... wə-libbām lōʾ-nākhôn ʿimmô. Q: bal iyyāhu tadʿūna fa-yakshifu mā tadʿūna ilayhi ... wa-tansawna mā tushrikūna; 6:43 wa-lākin qasat qulūbuhum."
- unit: quran-6-poor-keys-of-unseen
  checked: [hb-ps-104-creation-hymn, hb-job-9-job-cannot-sue-god, hb-isa-45-cyrus-the-anointed, hb-ps-139-searched-and-known]
  matches:
  - with: hb-ps-139-searched-and-known
    motif: everything-in-a-clear-book
    refs:
    - "6:59"
    with_refs:
    - "Ps 139:15"
    - "Ps 139:16"
    relation: echo
    note: "Hidden things in the depths of the earth are known and written. Q: wa-lā ḥabbatin fī ẓulumāti l-arḍi wa-lā raṭbin wa-lā yābisin illā fī kitābin mubīnin. Ps: ruqqamtî bə-taḥtiyyôt ʾāreṣ ... wə-ʿal-sifrəkhā kullām yikkātēvû. Ps has a single life; Q extends it to every grain and leaf."
  - with: hb-isa-45-cyrus-the-anointed
    motif: keys-of-the-unseen
    refs:
    - "6:59"
    with_refs:
    - "Isa 45:3"
    relation: echo
    note: "Isa: wə-nātattî ləkhā ʾôṣərôt ḥōšekh û-maṭmūnê mistārîm, God gives Cyrus the hidden treasures. Q: wa-ʿindahu mafātiḥu l-ghaybi lā yaʿlamuhā illā huwa (mafātiḥ, keys or storehouses). Isa gives the hidden stores away; Q keeps them with God alone."
- unit: quran-6-deliverance-trumpet
  checked: [hb-ps-107-four-rescues, hb-ps-1-two-ways, hb-jonah-1-flight-and-storm, hb-ps-33-creation-by-word, hb-gen-1-creation-six-days, hb-ezek-14-idols-in-heart-noah-daniel-job, hb-isa-27-leviathan-and-great-shofar]
  matches:
  - with: hb-ps-107-four-rescues
    motif: sea-peril-sincere-prayer-then-ingratitude
    refs:
    - "6:63"
    - "6:64"
    with_refs:
    - "Ps 107:26"
    - "Ps 107:28"
    - "Ps 107:29"
    - "Ps 107:31"
    relation: divergence
    note: "Rescue at sea after crying out. Ps: wa-yyiṣʿăqû ʾel-YHWH baṣ-ṣar lāhem ... yāqēm səʿārāh li-dmāmāh, and the psalm ends in thanks (yôdû la-YHWH ḥasdô). Q: man yunajjīkum min ẓulumāti l-barri wa-l-baḥri tadʿūnahu taḍarruʿan wa-khufyatan la-in anjānā ... la-nakūnanna mina l-shākirīn, then thumma antum tushrikūna. The vow of thanks is made and then broken."
  - with: hb-jonah-1-flight-and-storm
    motif: sea-peril-sincere-prayer-then-ingratitude
    refs:
    - "6:63"
    - "6:64"
    with_refs:
    - "Jonah 1:14"
    - "Jonah 1:16"
    relation: divergence
    note: "Jonah: wa-yyiqrəʾû ʾel-YHWH ... wa-yyîrʾû hā-ʾănāšîm yirʾāh gədôlāh ʾet-YHWH wa-yyizbəḥû-zevaḥ ... wa-yyiddərû nədārîm. The rescued sailors keep their vows. Q 6:64: the rescued 'associate partners'."
  - with: hb-ps-1-two-ways
    motif: avoid-those-who-mock-revelation
    refs:
    - "6:68"
    with_refs:
    - "Ps 1:1"
    relation: parallel
    note: "Do not sit with scoffers. Q: wa-idhā raʾayta lladhīna yakhūḍūna fī āyātinā fa-aʿriḍ ʿanhum ... fa-lā taqʿud baʿda l-dhikrā maʿa l-qawmi l-ẓālimīna. Ps: û-və-môšav lēṣîm lōʾ yāšāv (qaʿada = yāšav)."
  - with: hb-ps-33-creation-by-word
    motif: he-spoke-and-it-was
    refs:
    - "6:73"
    with_refs:
    - "Ps 33:9"
    relation: parallel
    note: "Q: wa-yawma yaqūlu kun fa-yakūnu qawluhu l-ḥaqq. Ps: kî hûʾ ʾāmar wa-yyehî hûʾ-ṣiwwāh wa-yyaʿămōd. In Q the creative word also makes the Day."
  - with: hb-gen-1-creation-six-days
    motif: creation-by-word
    refs:
    - "6:73"
    with_refs:
    - "Gen 1:3"
    relation: parallel
    note: "Gen: wa-yyōʾmer ʾĕlōhîm yəhî ʾôr wa-yəhî-ʾôr. Q: kun fa-yakūnu. The jussive of 'be' followed by its fulfilment (kun/yakūn = yəhî/wa-yəhî)."
  - with: hb-isa-27-leviathan-and-great-shofar
    motif: trumpet-blown-at-resurrection
    refs:
    - "6:73"
    with_refs:
    - "Isa 27:13"
    relation: echo
    note: "A horn blast at the end time. Isa: yittāqaʿ bə-šôfār gādôl û-vāʾû hā-ʾōvədîm, gathering the exiles to the holy mountain. Q: yawma yunfakhu fī l-ṣūri, at the resurrection and judgement (ʿālimu l-ghaybi wa-l-shahāda). Isa's national ingathering becomes the universal resurrection."
- unit: quran-6-abraham-heavenly-bodies
  checked: [hb-judg-6-jerubbaal-fleece, hb-josh-24-shechem-covenant, hb-gen-15-covenant-between-pieces, hb-neh-9-levites-confession, hb-exod-3-burning-bush, hb-deut-4-exhortation]
  matches:
  - with: hb-josh-24-shechem-covenant
    motif: father-serves-idols
    refs:
    - "6:74"
    with_refs:
    - "Josh 24:2"
    - "Josh 24:3"
    relation: divergence
    note: "Abraham's father served other gods. The name and the agent differ. Josh: Teraḥ ʾăvî ʾAvrāhām ... wa-yyaʿavdû ʾĕlōhîm ʾăḥērîm, and God acts: wā-ʾeqqaḥ ʾet-ʾăvîkhem ʾet-ʾAvrāhām mē-ʿēver han-nāhār. Q: wa-idh qāla Ibrāhīmu li-abīhi Āzara a-tattakhidhu aṣnāman ālihatan. The father is named Āzar and confronted, and Abraham reasons his own way out (6:76-79)."
  - with: hb-gen-15-covenant-between-pieces
    motif: count-the-stars
    refs:
    - "6:75"
    - "6:76"
    with_refs:
    - "Gen 15:5"
    relation: divergence
    note: "God shows Abraham the heavens, for a different purpose. Gen: habbeṭ-nāʾ haš-šāmaymāh û-sfōr hak-kôkhāvîm ... kōh yihyeh zarʿekhā, the stars as a promise of offspring. Q: wa-kadhālika nurī Ibrāhīma malakūta l-samāwāti wa-l-arḍi ... raʾā kawkaban qāla hādhā rabbī fa-lammā afala qāla lā uḥibbu l-āfilīna, a star that sets and so cannot be his Lord."
  - with: hb-gen-15-covenant-between-pieces
    motif: faith-reckoned-as-righteousness
    refs:
    - "6:82"
    with_refs:
    - "Gen 15:6"
    relation: echo
    note: "Gen: wə-heʾĕmin ba-YHWH wa-yyaḥšəvehā llô ṣədāqāh. Q: alladhīna āmanū wa-lam yalbisū īmānahum bi-ẓulmin ulāʾika lahumu l-amnu wa-hum muhtadūna. Abraham's belief is followed by its reward; Q makes it security (amn) for believers in general."
  - with: hb-deut-4-exhortation
    motif: astral-worship-forbidden
    refs:
    - "6:76"
    - "6:77"
    - "6:78"
    with_refs:
    - "Deut 4:19"
    relation: divergence
    note: "The same triad, looked at and rejected. Deut: pen-tiśśāʾ ʿênêkhā haš-šāmaymāh wə-rāʾîtā ʾet-haš-šemeš wə-ʾet-hay-yārēaḥ wə-ʾet-hak-kôkhāvîm ... wə-hištaḥăwîtā lāhem. Q: raʾā kawkaban ... raʾā l-qamara bāzighan ... raʾā l-shamsa bāzighatan, and each is rejected. But Deut adds ʾăšer ḥālaq YHWH ... ʾōtām lə-khōl hā-ʿammîm, as if the bodies were allotted to the nations; Q's Abraham rejects them for everyone (innī bariʾun mimmā tushrikūn)."
  - with: hb-judg-6-jerubbaal-fleece
    motif: let-the-god-defend-himself
    refs:
    - "6:80"
    - "6:81"
    with_refs:
    - "Judg 6:30"
    - "Judg 6:31"
    relation: divergence
    note: "A son against his father's gods and the townsmen. Judg: the townsmen demand hôṣēʾ ʾet-binkhā wə-yāmōt; the father Joash defends him, ʾim-ʾĕlōhîm hûʾ yāreb lô. Q: wa-ḥājjahu qawmuhu ... wa-lā akhāfu mā tushrikūna bihi: Abraham, not his father, mocks the impotence of the gods, and the father stays an idolater."
- unit: quran-6-prophets-lineage-torah-sheets
  checked: [hb-job-1-prologue-first-test, hb-zech-13-fountain-and-shepherd, hb-eccl-5-wealth-and-oppression, hb-deut-18-levites-prophet, hb-ezek-13-false-prophets-and-prophetesses, hb-jer-15-confession-words-eaten, hb-jer-8-stork-and-lying-pen]
  matches:
  - with: hb-job-1-prologue-first-test
    motif: naked-from-womb-naked-return
    refs:
    - "6:94"
    with_refs:
    - "Job 1:21"
    relation: parallel
    note: "Q: wa-laqad jiʾtumūnā furādā ka-mā khalaqnākum awwala marratin wa-taraktum mā khawwalnākum warāʾa ẓuhūrikum. Job: ʿārōm yāṣāʾtî mi-beṭen ʾimmî wə-ʿārōm ʾāšûv šāmmāh. Job's 'naked' is Q's 'alone' (furādā), coming to God as at the first creation."
  - with: hb-eccl-5-wealth-and-oppression
    motif: naked-from-womb-naked-return
    refs:
    - "6:94"
    with_refs:
    - "Eccl 5:14"
    relation: parallel
    note: "Eccl: ʿārôm yāšûv lāleket kə-šebbāʾ û-məʾûmāh lōʾ-yiśśāʾ va-ʿămālô šeyyōlēkh bə-yādô. Q: wa-taraktum mā khawwalnākum warāʾa ẓuhūrikum. Possessions are left behind; Q adds the absent intercessors (wa-mā narā maʿakum shufaʿāʾakum)."
  - with: hb-ezek-13-false-prophets-and-prophetesses
    motif: false-claim-of-revelation
    refs:
    - "6:93"
    with_refs:
    - "Ezek 13:6"
    - "Ezek 13:7"
    relation: parallel
    note: "Claiming revelation God did not give. Q: aw qāla ūḥiya ilayya wa-lam yūḥa ilayhi shayʾun. Ezek: hā-ʾōmərîm nəʾum-YHWH wa-YHWH lōʾ šəlāḥām; wə-ʾōmərîm nəʾum-YHWH wa-ʾănî lōʾ dibbartî. The same structure: claim + negation."
  - with: hb-deut-18-levites-prophet
    motif: false-prophet-death
    refs:
    - "6:93"
    with_refs:
    - "Deut 18:20"
    relation: divergence
    note: "Deut: ʾăšer yāzîd lə-dabbēr dāvār bi-šmî ʾēt ʾăšer lōʾ-ṣiwwîtîw ... û-mēt han-nāvîʾ ha-hûʾ, a death sentence. Q: wa-man aẓlamu mimmani ftarā ʿalā llāhi kadhiban ... wa-law tarā idhi l-ẓālimūna fī ghamarāti l-mawti wa-l-malāʾikatu bāsiṭū aydīhim. The false claimant is punished by angels at death and after it, not executed."
  - with: hb-zech-13-fountain-and-shepherd
    motif: false-prophet-death
    refs:
    - "6:93"
    with_refs:
    - "Zech 13:3"
    relation: echo
    note: "Zech: lōʾ tiḥyeh kî šeqer dibbartā bə-šēm YHWH; his parents pierce him. Q: iftarā ʿalā llāhi kadhiban; the punishment is the throes of death and the angels."
  - with: hb-jer-8-stork-and-lying-pen
    motif: lying-pen-of-scribes
    refs:
    - "6:91"
    with_refs:
    - "Jer 8:8"
    relation: echo
    note: "The custodians of the written Torah are accused of handling it falsely. Jer: ʾêkhāh tōʾmərû ḥăkhāmîm ʾănaḥnû wə-tôrat YHWH ʾittānû ʾākhēn hinnēh laš-šeqer ʿāśāh ʿēṭ šeqer sōfərîm. Q: qul man anzala l-kitāba lladhī jāʾa bihi Mūsā nūran wa-hudan li-l-nāsi tajʿalūnahu qarāṭīsa tubdūnahā wa-tukhfūna kathīran. In Jer the scribes falsify by writing; in Q they reveal some sheets and hide many."
- unit: quran-6-signs-in-nature
  checked: [hb-exod-22-apodictic-and-social-laws, hb-exod-33-tent-and-glory, hb-ps-74-leviathan, hb-ps-104-creation-hymn, hb-gen-1-creation-six-days, hb-exod-34-thirteen-attributes-covenant-renewal, hb-deut-32-song-of-moses]
  matches:
  - with: hb-exod-22-apodictic-and-social-laws
    motif: do-not-curse-god-or-ruler
    refs:
    - "6:108"
    with_refs:
    - "Exod 22:27"
    relation: echo
    note: "A ban on reviling. Exod: ʾĕlōhîm lōʾ təqallēl wə-nāśîʾ bə-ʿamməkhā lōʾ tāʾōr, ambiguous between 'God', 'gods' and 'judges'. Q: wa-lā tasubbū lladhīna yadʿūna min dūni llāhi fa-yasubbū llāha ʿadwan bi-ghayri ʿilmin. Do not revile others' gods, lest they revile God. cf. (not a match) LXX Exod 22:27 'you shall not revile gods', Philo Spec. Leg. 1.53 and Josephus Ant. 4.207, who read the verse the same way."
  - with: hb-exod-33-tent-and-glory
    motif: no-man-sees-god-and-lives
    refs:
    - "6:103"
    with_refs:
    - "Exod 33:20"
    relation: parallel
    note: "Q: lā tudrikuhu l-abṣāru wa-huwa yudriku l-abṣāra. Exod: lōʾ tûkhal lirʾōt ʾet-pānāy kî lōʾ-yirʾanî hā-ʾādām wā-ḥāy. In Exod one cannot see God and live; Q makes it a statement about what sight can grasp, with God grasping all sight."
  - with: hb-gen-1-creation-six-days
    motif: luminaries-rule-day-night
    refs:
    - "6:96"
    with_refs:
    - "Gen 1:14"
    relation: parallel
    note: "Q: fāliqu l-iṣbāḥi wa-jaʿala l-layla sakanan wa-l-shamsa wa-l-qamara ḥusbānan. Gen: yəhî məʾōrōt ... wə-hāyû lə-ʾōtōt û-lə-môʿădîm û-lə-yāmîm wə-šānîm. Luminaries for reckoning time. Gen leaves sun and moon unnamed; Q names them."
  - with: hb-ps-104-creation-hymn
    motif: luminaries-rule-day-night
    refs:
    - "6:96"
    with_refs:
    - "Ps 104:19"
    - "Ps 104:20"
    - "Ps 104:23"
    relation: echo
    note: "Ps: ʿāśāh yārēaḥ lə-môʿădîm šemeš yādaʿ məvôʾô; tāšet-ḥōšekh wî-hî lāylāh ... yēṣēʾ ʾādām lə-fāʿŏlô. Q: jaʿala l-layla sakanan wa-l-shamsa wa-l-qamara ḥusbānan. For Ps, night is when the beasts prowl; for Q, a time of rest (sakan)."
  - with: hb-ps-74-leviathan
    motif: luminaries-rule-day-night
    refs:
    - "6:96"
    with_refs:
    - "Ps 74:16"
    relation: echo
    note: "Ps: ləkhā yôm ʾaf-ləkhā lāylāh ʾattāh hăkhînôtā māʾôr wā-šāmeš. Q: day, night, sun and moon set by God (taqdīru l-ʿazīzi l-ʿalīm)."
  - with: hb-deut-32-song-of-moses
    motif: i-kill-and-make-alive
    refs:
    - "6:95"
    with_refs:
    - "Deut 32:39"
    relation: echo
    note: "Q: yukhriju l-ḥayya mina l-mayyiti wa-mukhriju l-mayyiti mina l-ḥayy. Deut: ʾănî ʾāmît wa-ʾăḥayyeh. Death and life are both God's work; Q shows it in the seed and the date stone."
- unit: quran-6-signs-would-not-convince
  checked: [hb-isa-6-throne-vision, hb-deut-18-levites-prophet, hb-ezek-13-false-prophets-and-prophetesses, hb-jer-23-dreams-and-hammer, hb-exod-23-justice-sabbatical-festivals, hb-isa-40-comfort-my-people]
  matches:
  - with: hb-isa-6-throne-vision
    motif: commission-to-harden-hearts
    refs:
    - "6:110"
    with_refs:
    - "Isa 6:10"
    relation: divergence
    note: "Isa: hašmēn lēv ... wə-ʿênāyw hāšaʿ pen-yirʾeh və-ʿênāyw, the prophet is to dull heart and eyes. Q: wa-nuqallibu afʾidatahum wa-abṣārahum ka-mā lam yuʾminū bihi awwala marratin. God turns hearts and eyes as a consequence of the first unbelief. The agent is God, not the prophet, and it is a response to prior rejection, not the purpose of the mission."
  - with: hb-deut-18-levites-prophet
    motif: the-dead-as-source-of-knowledge
    refs:
    - "6:111"
    with_refs:
    - "Deut 18:11"
    relation: contrast
    note: "The speaking dead. Deut forbids seeking them: wə-šōʾēl ʾôv wə-yiddəʿōnî wə-dōrēš ʾel-ham-mētîm. Q: wa-law annanā nazzalnā ilayhimu l-malāʾikata wa-kallamahumu l-mawtā ... mā kānū li-yuʾminū. Even if the dead spoke unbidden, they would not convince. Deut shuts the dead out as a source; Q denies they would persuade."
  - with: hb-exod-23-justice-sabbatical-festivals
    motif: no-false-report-or-following-majority
    refs:
    - "6:116"
    with_refs:
    - "Exod 23:2"
    relation: parallel
    note: "Do not follow the majority. Q: wa-in tuṭiʿ akthara man fī l-arḍi yuḍillūka ʿan sabīli llāhi in yattabiʿūna illā l-ẓanna. Exod: lōʾ-tihyeh ʾaḥărê-rabbîm lə-rāʿōt wə-lōʾ-taʿăneh ʿal-riv linṭōt ʾaḥărê rabbîm. Exod is a courtroom rule; Q is about the path to God."
  - with: hb-isa-40-comfort-my-people
    motif: no-changer-of-gods-words
    refs:
    - "6:115"
    with_refs:
    - "Isa 40:8"
    relation: echo
    note: "Q: wa-tammat kalimatu rabbika ṣidqan wa-ʿadlan lā mubaddila li-kalimātihi. Isa: yāvēš ḥāṣîr nāvēl ṣîṣ û-dəvar-ʾĕlōhênû yāqûm lə-ʿôlām. God's word stands and cannot be changed."
- unit: quran-6-slaughter-chest-jinn
  checked: [hb-isa-65-rebels-and-servants, hb-deut-4-exhortation, hb-ps-44-national-lament, hb-ps-119-alef-he, hb-isa-9-child-born-and-outstretched-hand, hb-amos-3-lion-has-roared, hb-deut-9-golden-calf-recalled]
  matches:
  - with: hb-ps-119-alef-he
    motif: breast-opened-or-constricted
    refs:
    - "6:125"
    with_refs:
    - "Ps 119:32"
    relation: echo
    note: "Guidance as a widening of the heart. Q: fa-man yuridi llāhu an yahdiyahu yashraḥ ṣadrahu li-l-islāmi wa-man yurid an yuḍillahu yajʿal ṣadrahu ḍayyiqan ḥarajan. Ps: derekh-miṣwōtêkhā ʾārûṣ kî tarḥîv libbî. Q adds the opposite: the narrowed breast, 'as if climbing into the sky'."
  - with: hb-isa-9-child-born-and-outstretched-hand
    motif: people-in-darkness-see-great-light
    refs:
    - "6:122"
    with_refs:
    - "Isa 9:1"
    relation: echo
    note: "From darkness and death to light. Q: a-wa-man kāna maytan fa-aḥyaynāhu wa-jaʿalnā lahu nūran yamshī bihi fī l-nāsi ka-man mathaluhu fī l-ẓulumāti. Isa: hā-ʿām ha-hōləkhîm ba-ḥōšekh rāʾû ʾôr gādôl yōšəvê bə-ʾereṣ ṣalmāwet. Isa speaks of a people; Q of a single believer."
  - with: hb-amos-3-lion-has-roared
    motif: no-punishment-without-messenger
    refs:
    - "6:130"
    - "6:131"
    with_refs:
    - "Amos 3:7"
    relation: echo
    note: "No judgement without prior warning through messengers. Amos: kî lōʾ yaʿăśeh ʾădōnāy YHWH dāvār kî ʾim-gālāh sôdô ʾel-ʿăvādāyw han-nəvîʾîm. Q: a-lam yaʾtikum rusulun minkum ... dhālika an lam yakun rabbuka muhlika l-qurā bi-ẓulmin wa-ahluhā ghāfilūna."
  - with: hb-deut-9-golden-calf-recalled
    motif: god-replaces-people
    refs:
    - "6:133"
    with_refs:
    - "Deut 9:14"
    relation: echo
    note: "God can remove a people and raise another. Deut: hereph mimmennî wə-ʾašmîdēm ... wə-ʾeʿĕśeh ʾôtəkhā lə-gôy ʿāṣûm wā-rāv mimmennû. Q: in yashaʾ yudhhibkum wa-yastakhlif min baʿdikum mā yashāʾu ka-mā anshaʾakum min dhurriyyati qawmin ākharīn. In Deut a threat averted by intercession; in Q a standing possibility."
- unit: quran-6-pagan-offerings-cattle
  checked: [hb-lev-11-dietary-laws, hb-deut-15-release-year, hb-deut-14-diet-tithe, hb-lev-7-guilt-peace-portions, hb-lev-22-holy-food-and-unblemished-victims, hb-deut-12-one-sanctuary, hb-2kgs-17-samaritan-settlers, hb-lev-3-peace-offering, hb-deut-24-divorce-pledges-poor]
  matches:
  - with: hb-lev-11-dietary-laws
    motif: camel-forbidden
    refs:
    - "6:144"
    - "6:145"
    with_refs:
    - "Lev 11:4"
    relation: contrast
    note: "Opposite rulings on the camel. Lev: ʾet-hag-gāmāl kî-maʿălēh gērāh hûʾ û-farsāh ʾênennû mafrîs ṭāmēʾ hûʾ lākhem. Q lists wa-mina l-ibili thnayni among the eight lawful pairs and asks which God forbade (āl-dhakarayni ḥarrama ami l-unthayayni). Then 6:145: only carrion, poured-out blood, pork and what is offered to other than God are forbidden."
  - with: hb-deut-14-diet-tithe
    motif: clean-unclean-animals-list
    refs:
    - "6:143"
    - "6:144"
    - "6:146"
    with_refs:
    - "Deut 14:4"
    - "Deut 14:7"
    relation: response
    note: "Deut: zōʾt hab-bəhēmāh ʾăšer tōʾkhēlû šôr śēh khəśāvîm wə-śēh ʿizzîm, but ʾet-hag-gāmāl ... ṭəmēʾîm hēm lākhem. Q: eight pairs (sheep, goats, camels, cattle) are lawful, and the narrower Jewish list is a later penalty: wa-ʿalā lladhīna hādū ḥarramnā kulla dhī ẓufurin ... dhālika jazaynāhum bi-baghyihim. Q explains the HB restriction as punishment."
  - with: hb-lev-7-guilt-peace-portions
    motif: prohibition-of-eating-fat
    refs:
    - "6:146"
    with_refs:
    - "Lev 7:23"
    - "Lev 7:25"
    relation: response
    note: "Lev: kol-ḥēlev šôr wə-khesev wā-ʿēz lōʾ tōʾkhēlû, with kārēt. Q: wa-mina l-baqari wa-l-ghanami ḥarramnā ʿalayhim shuḥūmahumā illā mā ḥamalat ẓuhūruhumā awi l-ḥawāyā aw mā khtalaṭa bi-ʿaẓmin. Q recognises the ban but gives it as a punishment for the Jews (jazaynāhum bi-baghyihim) and adds exceptions."
  - with: hb-lev-3-peace-offering
    motif: fat-tail-offering
    refs:
    - "6:146"
    with_refs:
    - "Lev 3:3"
    - "Lev 3:9"
    relation: divergence
    note: "What fat is exempt. Lev puts on the altar ha-ḥēlev ha-məkhasseh ʾet-haq-qerev wə-ʾēt kol-ha-ḥēlev ʾăšer ʿal-haq-qerev (the fat on the entrails) and ha-ʾalyāh təmîmāh lə-ʿummat he-ʿāṣeh (the fat tail by the backbone). Q exempts mā ḥamalat ẓuhūruhumā awi l-ḥawāyā (what the backs carry, or the entrails) from the ban. cf. (not a match) the rabbinic ḥelev / shuman distinction (b. Ḥullin 49b)."
  - with: hb-deut-12-one-sanctuary
    motif: blood-is-life-pour-on-ground
    refs:
    - "6:145"
    with_refs:
    - "Deut 12:16"
    relation: parallel
    note: "Blood that is poured out. Deut: raq ha-dām lōʾ tōʾkhēlû ʿal-hā-ʾāreṣ tišpəkhennû kam-māyim. Q: aw daman masfūḥan, only 'poured-out blood' is forbidden, the same image of shed blood (s-f-ḥ / š-f-k)."
  - with: hb-deut-12-one-sanctuary
    motif: child-sacrifice-by-fire-condemned
    refs:
    - "6:137"
    - "6:140"
    with_refs:
    - "Deut 12:31"
    relation: parallel
    note: "Deut: kî gam ʾet-bənêhem wə-ʾet-bənōtêhem yiśrəfû vā-ʾēš lē-ʾlōhêhem. Q: zayyana li-kathīrin mina l-mushrikīna qatla awlādihim shurakāʾuhum; qad khasira lladhīna qatalū awlādahum safahan bi-ghayri ʿilmin. Both blame the false gods. Q does not mention fire (cf. Arabian infanticide)."
  - with: hb-2kgs-17-samaritan-settlers
    motif: syncretism-fear-god-serve-idols
    refs:
    - "6:136"
    with_refs:
    - "2Kgs 17:33"
    relation: parallel
    note: "Dividing worship between God and other gods. 2Kgs: ʾet-YHWH hāyû yərēʾîm wə-ʾet-ʾĕlōhêhem hāyû ʿōvədîm. Q: wa-jaʿalū li-llāhi mimmā dharaʾa mina l-ḥarthi wa-l-anʿāmi naṣīban fa-qālū hādhā li-llāhi ... wa-hādhā li-shurakāʾinā. Q adds that God's share ends up going to the partners."
  - with: hb-deut-15-release-year
    motif: firstling-consecrated
    refs:
    - "6:138"
    with_refs:
    - "Deut 15:19"
    relation: contrast
    note: "Animals set apart from use. Deut, by God's command: lōʾ taʿăvōd bi-vkhōr šôrekhā wə-lōʾ tāgōz bəkhôr ṣōʾnekhā. Q condemns the pagans' own version: wa-anʿāmun ḥurrimat ẓuhūruhā ... iftirāʾan ʿalayhi. The HB sets aside animals at God's command; Q calls the pagan setting-aside a lie against God."
  - with: hb-deut-24-divorce-pledges-poor
    motif: gleanings-for-poor
    refs:
    - "6:141"
    with_refs:
    - "Deut 24:19"
    relation: parallel
    note: "The harvest carries a due to others. Q: kulū min thamarihi idhā athmara wa-ātū ḥaqqahu yawma ḥaṣādihi wa-lā tusrifū. Deut: kî tiqṣōr qəṣîrəkhā ... wə-šākhaḥtā ʿōmer ... lag-gēr lay-yātôm wə-lā-ʾalmānāh yihyeh. Deut names the forgotten sheaf and its recipients; Q a general 'due'."
- unit: quran-6-commandments
  checked: [hb-deut-30-return-choose-life, hb-exod-20-decalogue, hb-deut-5-decalogue, hb-zech-5-flying-scroll, hb-ezek-18-sour-grapes, hb-lev-19-holiness-code-b]
  matches:
  - with: hb-exod-20-decalogue
    motif: ten-commandments
    refs:
    - "6:151"
    - "6:152"
    - "6:153"
    with_refs:
    - "Exod 20:2"
    - "Exod 20:3"
    - "Exod 20:8"
    - "Exod 20:13"
    - "Exod 20:14"
    - "Exod 20:16"
    relation: divergence
    note: "A recited list of commandments compared item by item. Kept: no other gods (allā tushrikū bihi shayʾan = lōʾ yihyeh-ləkhā ʾĕlōhîm ʾăḥērîm), parents, killing, sexual sin, false speech. Omitted: the Sabbath (zākhôr ʾet-yôm haš-šabbāt) and coveting; the image ban is folded into 'associate nothing'. Added: allā taqtulū awlādakum min imlāqin, the orphan's property, full measure and weight, keeping God's covenant. The prologue ʾānōkhî YHWH ʾĕlōhêkhā ʾăšer hôṣēʾtîkhā mē-ʾereṣ miṣrayim becomes qul taʿālaw atlu mā ḥarrama rabbukum, without the Exodus."
  - with: hb-deut-5-decalogue
    motif: honor-parents-long-life
    refs:
    - "6:151"
    with_refs:
    - "Deut 5:16"
    relation: divergence
    note: "Deut: kabbēd ʾet-ʾāvîkhā wə-ʾet-ʾimmekhā ... ləmaʿan yaʾărîkhūn yāmêkhā û-ləmaʿan yîṭav lākh ʿal-hā-ʾădāmāh. Q: wa-bi-l-wālidayni iḥsānan. 'Honour' becomes 'kindness', and the promise of long life in the land is dropped."
  - with: hb-deut-5-decalogue
    motif: prohibition-murder-adultery-theft-false-witness
    refs:
    - "6:151"
    - "6:152"
    with_refs:
    - "Deut 5:17"
    - "Deut 5:18"
    - "Deut 5:20"
    relation: divergence
    note: "Deut: lōʾ tirṣāḥ; wə-lōʾ tinʾāf; wə-lōʾ-taʿăneh və-rēʿăkhā ʿēd šāwʾ, absolute. Q qualifies and widens: wa-lā taqtulū l-nafsa llatī ḥarrama llāhu illā bi-l-ḥaqqi (with an exception); wa-lā taqrabū l-fawāḥisha mā ẓahara minhā wa-mā baṭana (all indecency, not only adultery); wa-idhā qultum fa-ʿdilū wa-law kāna dhā qurbā (just speech even against kin). Theft is absent."
  - with: hb-deut-5-decalogue
    motif: turn-neither-right-nor-left
    refs:
    - "6:153"
    with_refs:
    - "Deut 5:32"
    - "Deut 5:33"
    relation: parallel
    note: "Deut, right after the Decalogue: lōʾ tāsurû yāmîn û-śəmōʾl bə-khol-ha-dderekh ... tēlēkhû. Q, right after its list: wa-anna hādhā ṣirāṭī mustaqīman fa-ttabiʿūhu wa-lā tattabiʿū l-subula fa-tafarraqa bikum. The single road versus side paths, placed at the same point."
  - with: hb-deut-30-return-choose-life
    motif: choose-life
    refs:
    - "6:153"
    with_refs:
    - "Deut 30:15"
    - "Deut 30:16"
    relation: echo
    note: "Deut: rəʾēh nātattî ləfānêkhā ... ʾet-ha-ḥayyîm wə-ʾet-haṭ-ṭôv ... lāleket bi-drākhāyw. Q: ṣirāṭī mustaqīman fa-ttabiʿūhu ... ʿan sabīlihi. A way set before the people, with God's 'ways' against 'the paths'."
  - with: hb-lev-19-holiness-code-b
    motif: just-weights-and-measures
    refs:
    - "6:152"
    with_refs:
    - "Lev 19:35"
    - "Lev 19:36"
    relation: parallel
    note: "Q: wa-awfū l-kayla wa-l-mīzāna bi-l-qisṭi. Lev: lōʾ-taʿăśû ʿāwel bam-mišpāṭ bam-middāh bam-mišqāl ... mōʾznê ṣedeq ʾavnê-ṣedeq. Q puts just measure into its commandment list; Lev attaches it to the Exodus formula."
- unit: quran-6-final-reckoning
  checked: [hb-ezek-18-sour-grapes, hb-exod-20-decalogue, hb-deut-24-divorce-pledges-poor, hb-jer-31-consolation-new-covenant, hb-ezek-3-watchman-and-muteness, hb-ezra-9-ezras-confession]
  matches:
  - with: hb-ezek-18-sour-grapes
    motif: soul-that-sins-shall-die
    refs:
    - "6:164"
    with_refs:
    - "Ezek 18:20"
    relation: parallel
    note: "Q: wa-lā taksibu kullu nafsin illā ʿalayhā wa-lā taziru wāziratun wizra ukhrā. Ezek: han-nefeš ha-ḥōṭēʾt hîʾ tāmût bēn lōʾ-yiśśāʾ ba-ʿăwōn hā-ʾāv. Both use a verb of carrying (wazara / nāśāʾ) for guilt."
  - with: hb-exod-20-decalogue
    motif: inherited-guilt-across-generations
    refs:
    - "6:160"
    - "6:164"
    with_refs:
    - "Exod 20:5"
    - "Exod 20:6"
    relation: contrast
    note: "Two points. (1) Exod: pōqēd ʿăwōn ʾāvōt ʿal-bānîm ʿal-šillēšîm wə-ʿal-ribbēʿîm, guilt carried across generations; Q 6:164 lā taziru wāziratun wizra ukhrā, no one bears another's burden. (2) Both make reward larger than punishment: Exod ʿōśeh ḥesed lā-ʾălāfîm against three or four generations; Q man jāʾa bi-l-ḥasanati fa-lahu ʿashru amthālihā wa-man jāʾa bi-l-sayyiʾati fa-lā yujzā illā mithlahā."
  - with: hb-deut-24-divorce-pledges-poor
    motif: individual-responsibility-no-vicarious-death
    refs:
    - "6:164"
    with_refs:
    - "Deut 24:16"
    relation: parallel
    note: "Deut: lōʾ-yûmətû ʾāvôt ʿal-bānîm û-vānîm lōʾ-yûmətû ʿal-ʾāvôt ʾîš bə-ḥeṭʾô yûmātû, a court rule. Q applies it to the final reckoning: lā taziru wāziratun wizra ukhrā thumma ilā rabbikum marjiʿukum."
  - with: hb-jer-31-consolation-new-covenant
    motif: individual-responsibility-for-sin
    refs:
    - "6:164"
    with_refs:
    - "Jer 31:30"
    relation: echo
    note: "Jer: kî ʾim-ʾîš baʿăwōnô yāmût. Q: wa-lā taksibu kullu nafsin illā ʿalayhā."
- unit: quran-7-opening-scales
  checked: [hb-dan-5-writing-on-wall, hb-ezek-7-the-end, hb-dan-12-resurrection-end, hb-josh-7-achan]
  matches:
  - with: hb-dan-5-writing-on-wall
    motif: weighed-in-scales-found-wanting
    refs:
    - "7:8"
    - "7:9"
    with_refs:
    - "Dan 5:27"
    relation: parallel
    note: "Judgement by weighing. Dan (Aramaic): təqēl təqîltāh və-mōʾzanyāʾ wə-hištəkhaḥat ḥassîr. Q: wa-l-waznu yawmaʾidhini l-ḥaqqu fa-man thaqulat mawāzīnuhu ... wa-man khaffat mawāzīnuhu. Dan weighs one king and finds him light; Q weighs everyone, and light scales mean loss (khasirū anfusahum)."
- unit: quran-7-adam-iblis
  checked: [hb-gen-3-fall-expulsion, hb-gen-2-eden-adam-woman, hb-ezek-28-cherub-in-eden, hb-isa-59-sins-separate-divine-warrior, hb-job-1-prologue-first-test]
  matches:
  - with: hb-gen-3-fall-expulsion
    motif: serpent-tempter
    refs:
    - "7:20"
    - "7:21"
    with_refs:
    - "Gen 3:1"
    - "Gen 3:4"
    - "Gen 3:5"
    relation: divergence
    note: "A different tempter. Gen: wə-han-nāḥāš hāyāh ʿārûm mik-kōl ḥayyat haś-śādeh, an animal speaking to the woman. Q: fa-waswasa lahumā l-shayṭānu, the devil already expelled in 7:13, whispering to both, and he swears an oath (wa-qāsamahumā innī lakumā la-mina l-nāṣiḥīna). There is no serpent and no curse to crawl on the belly (Gen 3:14)."
  - with: hb-gen-3-fall-expulsion
    motif: tempter-promises-angelhood-or-immortality
    refs:
    - "7:20"
    with_refs:
    - "Gen 3:5"
    - "Gen 3:22"
    relation: divergence
    note: "What the tempter promises. Gen: wi-hyîtem kē-ʾlōhîm yōdəʿê ṭôv wā-rāʿ, and God himself confirms the danger: hēn hā-ʾādām hāyāh kə-ʾaḥad mimmennû ... wā-ḥay lə-ʿōlām. Q: mā nahākumā rabbukumā ʿan hādhihi l-shajarati illā an takūnā malakayni aw takūnā mina l-khālidīna. 'Like gods knowing good and evil' becomes 'angels or immortals', a lie (bi-ghurūrin). Q has no divine admission that the humans have become 'like one of us'."
  - with: hb-gen-3-fall-expulsion
    motif: who-is-tempted-first
    refs:
    - "7:19"
    - "7:20"
    - "7:22"
    with_refs:
    - "Gen 3:2"
    - "Gen 3:6"
    relation: divergence
    note: "Who is tempted and eats first. Gen: the serpent talks to the woman (wa-yyōʾmer ʾel-hā-ʾiššāh), she eats first and gives to her husband (wat-tittēn gam-lə-ʾîšāh ʿimmāh wa-yyōʾkhal). Q uses the dual throughout: wa-zawjuka ... fa-kulā ... wa-lā taqrabā ... waswasa lahumā ... fa-lammā dhāqā l-shajarata. The couple acts together and the woman is not singled out."
  - with: hb-gen-3-fall-expulsion
    motif: tree-of-knowledge-forbidden
    refs:
    - "7:19"
    with_refs:
    - "Gen 3:3"
    relation: echo
    note: "Gen 3:3, the woman's paraphrase: wə-lōʾ tiggəʿû bô, 'nor touch it', a fence God had not said. Q, God's own command: wa-lā taqrabā hādhihi l-shajarata, 'do not come near'. The tree is unnamed in Q (no 'knowledge of good and evil')."
  - with: hb-gen-2-eden-adam-woman
    motif: tree-of-knowledge-forbidden
    refs:
    - "7:19"
    with_refs:
    - "Gen 2:16"
    - "Gen 2:17"
    relation: divergence
    note: "Gen: mik-kōl ʿēṣ-hag-gān ʾākhōl tōʾkhēl û-mēʿēṣ ha-ddaʿat ṭôv wā-rāʿ lōʾ tōʾkhal mimmennû kî bə-yôm ʾăkhālkhā mimmennû môt tāmût. Q: fa-kulā min ḥaythu shiʾtumā wa-lā taqrabā hādhihi l-shajarata fa-takūnā mina l-ẓālimīna. The open permission is kept; the threat of death becomes 'you will be among the wrongdoers', and the tree is nameless."
  - with: hb-gen-3-fall-expulsion
    motif: fig-leaf-coverings
    refs:
    - "7:22"
    with_refs:
    - "Gen 3:7"
    relation: parallel
    note: "Gen: wat-tippāqaḥnāh ʿênê šənêhem wa-yyēdəʿû kî ʿêrummim hēm wa-yyitpərû ʿălēh təʾēnāh. Q: badat lahumā sawʾātuhumā wa-ṭafiqā yakhṣifāni ʿalayhimā min waraqi l-jannati. Both sew leaves, but in Q they are 'leaves of the garden' (no fig), and Q says the nakedness 'appeared' rather than 'their eyes were opened'."
  - with: hb-gen-3-fall-expulsion
    motif: hiding-from-god
    refs:
    - "7:22"
    with_refs:
    - "Gen 3:8"
    - "Gen 3:9"
    - "Gen 3:11"
    relation: divergence
    note: "God's question. Gen: the couple hide (wa-yyitḥabbēʾ hā-ʾādām wə-ʾištô), God walks in the garden and calls ʾayyekkāh, then ha-min-hā-ʿēṣ ... ʾākhāltā. Q: wa-nādāhumā rabbuhumā a-lam anhakumā ʿan tilkumā l-shajarati wa-aqul lakumā inna l-shayṭāna lakumā ʿaduwwun mubīnun. No hiding and no walking God; the question is a reminder of a warning given."
  - with: hb-gen-3-fall-expulsion
    motif: first-couple-response-to-god
    refs:
    - "7:23"
    with_refs:
    - "Gen 3:12"
    - "Gen 3:13"
    relation: divergence
    note: "The decisive reversal. Gen: hā-ʾiššāh ʾăšer nātattāh ʿimmādî hiwʾ nātənāh-llî; han-nāḥāš hiššîʾanî, the man blames the woman (and God), the woman the serpent. Q: qālā rabbanā ẓalamnā anfusanā wa-in lam taghfir lanā wa-tarḥamnā la-nakūnanna mina l-khāsirīna. Both confess together and ask forgiveness. Blame-shifting gives way to joint repentance, and the blame-shifter in Q is Iblis (fa-bi-mā aghwaytanī, 7:16)."
  - with: hb-gen-3-fall-expulsion
    motif: enmity-serpent-and-woman-seed
    refs:
    - "7:24"
    with_refs:
    - "Gen 3:15"
    relation: divergence
    note: "Gen: wə-ʾêvāh ʾāšît bênkhā û-vên hā-ʾiššāh û-vên zarʿăkhā û-vên zarʿāh, enmity set by God between serpent and woman and their seed. Q: qāla hbiṭū baʿḍukum li-baʿḍin ʿaduwwun, plural, a mutual enmity of those sent down (humans and Satan, 7:22 inna l-shayṭāna lakumā ʿaduww). There are no curses on the woman (childbirth, 3:16) or the ground (3:17-19)."
  - with: hb-gen-3-fall-expulsion
    motif: return-to-the-earth
    refs:
    - "7:25"
    with_refs:
    - "Gen 3:19"
    relation: divergence
    note: "Gen: ʿad šûvəkhā ʾel-hā-ʾădāmāh kî mimmennāh luqqāḥtā kî-ʿāfār ʾattāh wə-ʾel-ʿāfār tāšûv, from dust and back to dust, as a curse. Q: fīhā taḥyawna wa-fīhā tamūtūna wa-minhā tukhrajūna. Q adds the third step, resurrection from the earth."
  - with: hb-gen-3-fall-expulsion
    motif: expulsion-from-paradise
    refs:
    - "7:24"
    with_refs:
    - "Gen 3:23"
    - "Gen 3:24"
    relation: divergence
    note: "Gen: wa-yšalləḥēhû ... wa-ygāreš ʾet-hā-ʾādām, with cherubim and the flaming sword guarding the tree of life, lest he eat and live forever. Q: ihbiṭū ... wa-lakum fī l-arḍi mustaqarrun wa-matāʿun ilā ḥīnin. A descent to a temporary home, with no guard, no tree of life and no fear of human immortality."
  - with: hb-ezek-28-cherub-in-eden
    motif: expulsion-from-mountain-of-god
    refs:
    - "7:12"
    - "7:13"
    - "7:18"
    with_refs:
    - "Ezek 28:14"
    - "Ezek 28:16"
    - "Ezek 28:17"
    relation: parallel
    note: "A being in God's garden is cast down for pride. Ezek: ʾatt-kərûv ... bə-har qōdeš ʾĕlōhîm hāyîtā bə-tôkh ʾavnê-ʾēš hithallākhtā ... gāvah libbəkhā ... ʿal-ʾereṣ hišlakhtîkhā. Q: anā khayrun minhu khalaqtanī min nārin ... fa-hbiṭ minhā fa-mā yakūnu laka an tatakabbara fīhā fa-khruj innaka mina l-ṣāghirīna. Both have fire (ʾavnê-ʾēš / min nār), pride (gāvah libbəkhā / tatakabbara) and being thrown down. In Ezek it is a lament over the king of Tyre; Q tells it as the fall of Iblis."
  - with: hb-job-1-prologue-first-test
    motif: god-grants-the-adversary-leave
    refs:
    - "7:14"
    - "7:15"
    - "7:16"
    - "7:17"
    with_refs:
    - "Job 1:7"
    - "Job 1:11"
    - "Job 1:12"
    relation: echo
    note: "God gives the adversary leave to work on humans. Job: miš-šûṭ bā-ʾāreṣ ... hinnēh khol-ʾăšer-lô bə-yādekhā raq ʾēlāyw ʾal-tišlaḥ yādekhā, a limited permission over one man. Q: anẓirnī ilā yawmi yubʿathūna, qāla innaka mina l-munẓarīna, and the devil vows la-aqʿudanna lahum ṣirāṭaka l-mustaqīma ... la-ātiyannahum min bayni aydīhim wa-min khalfihim. A respite until resurrection, against all of humankind."
- unit: quran-7-children-of-adam
  checked: [hb-gen-3-fall-expulsion, hb-exod-20-decalogue, hb-exod-34-thirteen-attributes-covenant-renewal, hb-amos-2-oracle-against-israel, hb-gen-2-eden-adam-woman, hb-exod-20-altar-law]
  matches:
  - with: hb-gen-3-fall-expulsion
    motif: garments-of-skin
    refs:
    - "7:26"
    with_refs:
    - "Gen 3:21"
    relation: divergence
    note: "God provides clothing. Gen: wa-yyaʿaś YHWH ʾĕlōhîm lə-ʾādām û-lə-ʾištô kotnôt ʿôr wa-yyalbišēm, for the couple after the sin. Q: yā banī Ādama qad anzalnā ʿalaykum libāsan yuwārī sawʾātikum wa-rīshan wa-libāsu l-taqwā dhālika khayrun, 'sent down' to all of Adam's children, with a moral 'garment of piety' added."
  - with: hb-gen-2-eden-adam-woman
    motif: first-couple-clothed-or-naked-before-fall
    refs:
    - "7:27"
    with_refs:
    - "Gen 2:25"
    relation: contrast
    note: "Opposite pictures of the first couple before the fall. Gen: wa-yyihyû šənêhem ʿărûmmîm hā-ʾādām wə-ʾištô wə-lōʾ yitbōšāšû, naked and unashamed. Q: ka-mā akhraja abawaykum mina l-jannati yanziʿu ʿanhumā libāsahumā li-yuriyahumā sawʾātihimā, they wore a garment that Satan stripped off. cf. (not a match) rabbinic garments of light (ʾôr / ʿôr), Gen. Rab. 20:12."
  - with: hb-exod-20-altar-law
    motif: nakedness-covered-at-worship
    refs:
    - "7:26"
    - "7:31"
    with_refs:
    - "Exod 20:26"
    relation: parallel
    note: "Nakedness must be covered at the place of worship. Exod: wə-lōʾ-taʿăleh və-maʿălōt ʿal-mizbəḥî ʾăšer lōʾ-tiggāleh ʿerwātəkhā ʿālāyw. Q: libāsan yuwārī sawʾātikum ... khudhū zīnatakum ʿinda kulli masjidin. sawʾa and ʿerwāh are both the private parts."
  - with: hb-amos-2-oracle-against-israel
    motif: garments-at-every-place-of-worship
    refs:
    - "7:31"
    with_refs:
    - "Amos 2:8"
    relation: echo
    note: "Garments at every place of worship. Amos: wə-ʿal-bəgādîm ḥăvulîm yaṭṭû ʾēṣel kol-mizbēaḥ, condemning the use of pledged clothes. Q: khudhū zīnatakum ʿinda kulli masjidin wa-kulū wa-shrabū wa-lā tusrifū, commanding proper dress. 'Beside every altar' matches 'at every place of prostration', with opposite force."
- unit: quran-7-paradise-hell-araf
  checked: [hb-1kgs-8-dedication-prayer, hb-deut-30-return-choose-life, hb-amos-5-lament-day-of-yhwh, hb-hos-4-lawsuit-priests]
  matches:
  - with: hb-hos-4-lawsuit-priests
    motif: god-forgets-those-who-forgot
    refs:
    - "7:51"
    with_refs:
    - "Hos 4:6"
    relation: parallel
    note: "Forgetting answered with forgetting, the same verb used twice. Q: fa-l-yawma nansāhum ka-mā nasū liqāʾa yawmihim hādhā. Hos: wat-tiškaḥ tôrat ʾĕlōhêkhā ʾeškaḥ bānêkhā gam-ʾānî. Hos speaks of priests who forget the Torah; Q of the damned who forgot the meeting with God."
- unit: quran-7-creation-signs
  checked: [hb-gen-1-creation-six-days, hb-ps-74-leviathan, hb-ps-104-creation-hymn, hb-job-38-whirlwind-creation, hb-job-14-tree-has-hope, hb-hos-5-6-third-day]
  matches:
  - with: hb-gen-1-creation-six-days
    motif: divine-rest-seventh-day
    refs:
    - "7:54"
    with_refs:
    - "Gen 2:1"
    - "Gen 2:2"
    - "Gen 2:3"
    relation: divergence
    note: "What follows the six days. Gen: wa-ykhullû haš-šāmayim wə-hā-ʾāreṣ ... wa-yyišbōt bay-yôm haš-šəvîʿî, God rests and blesses the seventh day. Q: khalaqa l-samāwāti wa-l-arḍa fī sittati ayyāmin thumma stawā ʿalā l-ʿarshi yughshī l-layla l-nahāra. The six days are kept, but in place of the rest God sits on the throne and goes on governing. There is no seventh day. cf. Q 50:38, where no weariness touches him."
  - with: hb-job-14-tree-has-hope
    motif: tree-has-hope-man-none
    refs:
    - "7:57"
    with_refs:
    - "Job 14:7"
    - "Job 14:9"
    - "Job 14:12"
    relation: contrast
    note: "The same analogy used for opposite conclusions. Job: kî yēš lā-ʿēṣ tiqwāh ... mē-rêaḥ mayim yafriaḥ, but wə-ʾîš šākhav wə-lōʾ-yāqûm: water revives a tree, not a man. Q: suqnāhu li-baladin mayyitin fa-anzalnā bihi l-māʾa fa-akhrajnā bihi min kulli l-thamarāti kadhālika nukhriju l-mawtā. Rain on dead land is the proof that the dead will rise."
  - with: hb-hos-5-6-third-day
    motif: rain-revives-dead-earth
    refs:
    - "7:57"
    with_refs:
    - "Hos 6:2"
    - "Hos 6:3"
    relation: echo
    note: "Revival and rain together. Hos: yəḥayyēnû mi-yyōmāyim bay-yôm haš-šəlîšî yəqimēnû ... wə-yāvôʾ khag-gešem lānû kə-malqôš yôreh ʾāreṣ. Q 7:57: rain on dead land, kadhālika nukhriju l-mawtā. Hos uses rain for God's coming and the people's restoration; Q for bodily resurrection."
  - with: hb-job-38-whirlwind-creation
    motif: rain-on-uninhabited-desert
    refs:
    - "7:57"
    with_refs:
    - "Job 38:26"
    - "Job 38:27"
    relation: echo
    note: "Job: ləhamṭîr ʿal-ʾereṣ lōʾ-ʾîš ... ləhaśbîaʿ šōʾāh û-məšōʾāh û-ləhaṣmîaḥ mōṣāʾ dešeʾ. Q: suqnāhu li-baladin mayyitin. God drives the clouds to desolate land and makes it sprout."
  - with: hb-ps-104-creation-hymn
    motif: winds-herald-mercy-pure-water
    refs:
    - "7:57"
    with_refs:
    - "Ps 104:3"
    - "Ps 104:4"
    - "Ps 104:13"
    relation: parallel
    note: "God's winds go before the rain. Ps: ha-mmhallēkh ʿal-kanfê-rûaḥ ʿōśeh malʾākhāyw rûḥôt ... mašqeh hārîm mē-ʿăliyyôtāyw (winds made his messengers; water from his upper chambers). Q: wa-huwa lladhī yursilu l-riyāḥa bushran bayna yaday raḥmatihi ḥattā idhā aqallat saḥāban thiqālan ... fa-anzalnā bihi l-māʾa. The winds are heralds. Q adds that this is a sign of resurrection (kadhālika nukhriju l-mawtā)."
- unit: quran-7-noah
  checked: [hb-gen-6-flood, hb-gen-19-sodom-destroyed, hb-jer-24-two-baskets-figs, hb-num-12-miriam-aaron, hb-ezek-3-watchman-and-muteness]
  matches:
  - with: hb-gen-6-flood
    motif: hero-preaches-to-people
    refs:
    - "7:59"
    - "7:61"
    - "7:62"
    - "7:63"
    with_refs:
    - "Gen 6:9"
    - "Gen 6:13"
    - "Gen 7:1"
    relation: divergence
    note: "Noah's role. Gen: Noah never speaks before the flood. He is ʾîš ṣaddîq tāmîm ... ʾet-hā-ʾĕlōhîm hithallekh-Nōaḥ, God speaks to him alone, and he obeys in silence. Q: Noah is a messenger who preaches, yā qawmi ʿbudū llāha mā lakum min ilāhin ghayruhu, innī rasūlun min rabbi l-ʿālamīna, ublighukum risālāti rabbī wa-anṣaḥu lakum. A silent righteous man becomes a warning prophet, the model of Muhammad."
  - with: hb-gen-6-flood
    motif: reason-rejected-messenger
    refs:
    - "7:64"
    with_refs:
    - "Gen 6:11"
    - "Gen 6:12"
    - "Gen 6:13"
    relation: divergence
    note: "Why the flood comes. Gen: wat-timmālēʾ hā-ʾāreṣ ḥāmās ... kî-hišḥît kol-bāśār ʾet-darkô, universal violence and corruption. Q: fa-kadhdhabūhu fa-anjaynāhu ... wa-aghraqnā lladhīna kadhdhabū bi-āyātinā, the rejection of the messenger. The moral cause becomes a cause about revelation, and the drowned are 'a blind people' (qawman ʿamīna)."
  - with: hb-gen-6-flood
    motif: family-saved
    refs:
    - "7:64"
    with_refs:
    - "Gen 7:1"
    - "Gen 7:7"
    relation: divergence
    note: "Who is saved. Gen: bōʾ-ʾattāh wə-khol-bêtəkhā ʾel-hat-tēvāh; Nōaḥ û-vānāyw wə-ʾištô û-nəšê-vānāyw, his household. Q: fa-anjaynāhu wa-lladhīna maʿahu fī l-fulki, 'those with him', a community of believers rather than a family (cf. Q 11:46, where a son drowns)."
  - with: hb-gen-19-sodom-destroyed
    motif: warning-mocked-by-kin
    refs:
    - "7:60"
    - "7:63"
    with_refs:
    - "Gen 19:14"
    relation: echo
    note: "A warner not taken seriously. Gen: qûmû ṣəʾû min-ham-māqôm haz-zeh kî-mašḥît YHWH ʾet-hā-ʿîr wa-yhî khi-mṣaḥēq bə-ʿênê ḥătānāyw. Q: qāla l-malaʾu min qawmihi innā la-narāka fī ḍalālin mubīnin; a-wa-ʿajibtum an jāʾakum dhikrun ... ʿalā rajulin minkum."
- unit: quran-7-hud-ad
  checked: [hb-deut-2-edom-moab-ammon, hb-job-26-hymn-to-cosmic-power, hb-gen-36-edom-genealogy, hb-gen-14-war-of-kings-melchizedek, hb-deut-13-enticers, hb-jer-24-two-baskets-figs, hb-amos-2-oracle-against-israel]
  matches:
  - with: hb-amos-2-oracle-against-israel
    motif: tall-people-destroyed-root-and-all
    refs:
    - "7:69"
    - "7:72"
    with_refs:
    - "Amos 2:9"
    relation: parallel
    note: "A people of great stature destroyed root and all. Amos: wə-ʾānōkhî hišmadtî ʾet-hā-ʾĕmōrî ... ʾăšer kə-gōvah ʾărāzîm govhô ... wā-ʾašmîd piryô mi-mmaʿal wə-šārāšāyw mit-tāḥat. Q: wa-zādakum fī l-khalqi basṭatan; wa-qaṭaʿnā dābira lladhīna kadhdhabū bi-āyātinā. Both have the stature and the cutting off of the root (dābir / šārāšāyw). In Amos it is God's favour to Israel; in Q a warning to the Meccans."
  - with: hb-deut-2-edom-moab-ammon
    motif: displacement-of-earlier-peoples
    refs:
    - "7:69"
    with_refs:
    - "Deut 2:10"
    - "Deut 2:21"
    - "Deut 2:22"
    relation: echo
    note: "Peoples of giant size and successive replacement. Deut: ʿam gādôl wə-rav wā-rām kā-ʿănāqîm wa-yyašmîdēm YHWH ... wa-yyîrāšum wa-yyēšvû taḥtām. Q: idh jaʿalakum khulafāʾa min baʿdi qawmi Nūḥin wa-zādakum fī l-khalqi basṭatan (Ad after Noah's people; cf. 7:74 for Thamud after Ad). Deut has nations displacing giants; Q has peoples succeeding destroyed peoples (khulafāʾ)."
  - with: hb-gen-14-war-of-kings-melchizedek
    motif: primeval-giant-peoples
    refs:
    - "7:69"
    with_refs:
    - "Gen 14:5"
    relation: echo
    note: "Gen: wa-yyakkû ʾet-rəfāʾîm ... wə-ʾet-haz-zûzîm ... wə-ʾēt hā-ʾêmîm, giant peoples of old. Q: Ad, given basṭatan fī l-khalq. Commentators identify Ad with such peoples; Q gives no name of a giant people."
- unit: quran-7-salih-thamud
  checked: [hb-jer-42-43-flight-to-egypt, hb-jer-24-two-baskets-figs, hb-jer-27-yoke-bars, hb-obad-1-edom-brought-down, hb-num-16-korah]
  matches:
  - with: hb-obad-1-edom-brought-down
    motif: houses-carved-in-mountains
    refs:
    - "7:74"
    with_refs:
    - "Obad 1:3"
    relation: echo
    note: "A rock-dwelling people proud of its mountain homes. Obad: šōkhnî və-ḥagwê-selaʿ mərôm šivtô ʾōmēr bə-libbô mî yôridēnî ʾāreṣ. Q: wa-tanḥitūna l-jibāla buyūtan ... wa-lā taʿthaw fī l-arḍi mufsidīna. Thamud, like Edom, is brought down. cf. (not a match) the Nabataean rock tombs of Hegra and Petra."
  - with: hb-num-16-korah
    motif: destroyed-by-earthquake
    refs:
    - "7:78"
    with_refs:
    - "Num 16:31"
    - "Num 16:32"
    relation: echo
    note: "The ground punishes those who defy God's messenger. Num: wat-tibbāqaʿ hā-ʾădāmāh ... wat-tiftaḥ hā-ʾāreṣ ʾet-pîhā wat-tivlaʿ ʾōtām wə-ʾet-bāttêhem. Q: fa-akhadhathumu l-rajfatu fa-aṣbaḥū fī dārihim jāthimīna. In Num the earth opens and swallows; in Q a tremor leaves them dead in their houses."
  - with: hb-jer-42-43-flight-to-egypt
    motif: prophet-reminds-people-he-delivered-message
    refs:
    - "7:79"
    with_refs:
    - "Jer 42:19"
    - "Jer 42:21"
    relation: echo
    note: "The prophet's closing words to a people who refused. Jer: wā-ʾaggid lākhem hay-yôm wə-lōʾ šəmaʿtem bə-qôl YHWH. Q: yā qawmi laqad ablaghtukum risālata rabbī wa-naṣaḥtu lakum wa-lākin lā tuḥibbūna l-nāṣiḥīna. Jer speaks before the disaster, Q's Salih after it."
- unit: quran-7-lot
  checked: [hb-gen-19-sodom-destroyed, hb-ps-11-flee-like-bird, hb-gen-6-flood, hb-job-1-prologue-first-test, hb-lam-5-prayer-remember]
  matches:
  - with: hb-gen-19-sodom-destroyed
    motif: fire-and-brimstone-from-heaven
    refs:
    - "7:84"
    with_refs:
    - "Gen 19:24"
    relation: divergence
    note: "The same verb, m-ṭ-r 'to rain'. Gen: wa-YHWH himṭîr ʿal-Sədōm wə-ʿal-ʿĂmōrāh gofrît wā-ʾēš mēʾēt YHWH min-haš-šāmāyim. Q: wa-amṭarnā ʿalayhim maṭaran. Q names neither the cities nor the sulfur and fire; only a 'rain'."
  - with: hb-gen-19-sodom-destroyed
    motif: wife-turned-to-pillar-of-salt
    refs:
    - "7:83"
    with_refs:
    - "Gen 19:26"
    relation: divergence
    note: "Gen: wat-tabbēṭ ʾištô mēʾaḥărāyw wat-təhî nəṣîv melaḥ, she looks back and becomes salt. Q: fa-anjaynāhu wa-ahlahu illā mraʾatahu kānat mina l-ghābirīna, she 'stayed behind' with the doomed. Q has no looking back and no salt."
  - with: hb-gen-19-sodom-destroyed
    motif: family-saved
    refs:
    - "7:83"
    with_refs:
    - "Gen 19:16"
    - "Gen 19:29"
    relation: divergence
    note: "Why Lot is saved. Gen: bə-ḥemlat YHWH ʿālāyw, and wa-yyizkōr ʾĕlōhîm ʾet-ʾAvrāhām wa-yšallaḥ ʾet-Lôṭ, rescued for Abraham's sake, dragged out while he lingers (wa-yyitmahmāh). Q: fa-anjaynāhu wa-ahlahu, as a messenger who preached (7:80), with no mention of Abraham and no hesitation."
  - with: hb-gen-19-sodom-destroyed
    motif: sodomites-lust-for-men
    refs:
    - "7:80"
    - "7:81"
    - "7:82"
    with_refs:
    - "Gen 19:5"
    - "Gen 19:9"
    relation: divergence
    note: "The sin and the conflict. Gen: one night's assault, hôṣîʾēm ʾēlênû wə-nēdəʿāh ʾōtām, on the guests, and the mob's charge against Lot as an outsider, hā-ʾeḥād bāʾ-lāgûr wa-yyišpōṭ šāfôṭ. Q: Lot preaches against a habitual practice, a-taʾtūna l-fāḥishata mā sabaqakum bihā min aḥadin ... innakum la-taʾtūna l-rijāla shahwatan min dūni l-nisāʾ, and the people answer akhrijūhum min qaryatikum innahum unāsun yataṭahharūna. Q 7 has no guests, no offer of the daughters (Gen 19:8) and no blinding."
  - with: hb-ps-11-flee-like-bird
    motif: fire-and-brimstone-from-heaven
    refs:
    - "7:84"
    with_refs:
    - "Ps 11:6"
    relation: echo
    note: "Ps: yamṭēr ʿal-rəšāʿîm paḥîm ʾēš wə-gofrît. Q: wa-amṭarnā ʿalayhim maṭaran fa-nẓur kayfa kāna ʿāqibatu l-mujrimīna. A rain on the wicked (m-ṭ-r)."
- unit: quran-7-shuayb-midian
  checked: [hb-exod-2-moses-birth-flight-midian, hb-exod-3-burning-bush, hb-prov-20-sayings, hb-prov-16-sayings, hb-prov-11-sayings, hb-jer-42-43-flight-to-egypt, hb-amos-8-summer-fruit]
  matches:
  - with: hb-amos-8-summer-fruit
    motif: just-weights-and-measures
    refs:
    - "7:85"
    with_refs:
    - "Amos 8:5"
    relation: parallel
    note: "A prophet indicts his people for false measures. Amos: ləhaqṭîn ʾêfāh û-ləhagdîl šeqel û-lə-ʿawwēt mōʾznê mirmāh. Q (Shuʿayb to Midian): fa-awfū l-kayla wa-l-mīzāna wa-lā tabkhasū l-nāsa ashyāʾahum. Amos's cheaters are Israelites impatient for the Sabbath to end; Q's are Midianites, a people outside Israel."
  - with: hb-prov-11-sayings
    motif: just-weights-and-measures
    refs:
    - "7:85"
    with_refs:
    - "Prov 11:1"
    relation: parallel
    note: "Prov: mōʾznê mirmāh tôʿăvat YHWH wə-ʾeven šəlēmāh rəṣônô. Q: awfū l-kayla wa-l-mīzāna. Prov's full stone (ʾeven šəlēmāh) matches Q's command to give full (awfū)."
  - with: hb-prov-20-sayings
    motif: just-weights-and-measures
    refs:
    - "7:85"
    with_refs:
    - "Prov 20:10"
    relation: echo
    note: "Prov: ʾeven wā-ʾeven ʾêfāh wə-ʾêfāh tôʿăvat YHWH. Q: wa-lā tabkhasū l-nāsa ashyāʾahum."
- unit: quran-7-towns-pattern
  checked: [hb-ps-44-national-lament, hb-1kgs-8-dedication-prayer, hb-zeph-3-jerusalem-and-restoration, hb-amos-4-cows-of-bashan, hb-jer-6-siege-of-zion]
  matches:
  - with: hb-amos-4-cows-of-bashan
    motif: plagues-yet-you-did-not-return
    refs:
    - "7:94"
    - "7:95"
    with_refs:
    - "Amos 4:6"
    - "Amos 4:7"
    - "Amos 4:10"
    - "Amos 4:11"
    relation: parallel
    note: "Hardships sent so that the people turn back, which they do not. Amos: niqyôn šinnayim ... māniʿtî mikkem ʾet-hag-gešem ... with the refrain wə-lōʾ-šavtem ʿāday, ending in a Sodom-like overthrow (kə-mahpēkhat ʾĕlōhîm ʾet-Sədōm). Q: akhadhnā ahlahā bi-l-baʾsāʾi wa-l-ḍarrāʾi laʿallahum yaḍḍarraʿūna, then good times, then fa-akhadhnāhum baghtatan. Q adds the deceptive prosperity before the end."
  - with: hb-1kgs-8-dedication-prayer
    motif: drought-as-punishment-for-sin
    refs:
    - "7:96"
    with_refs:
    - "1Kgs 8:35"
    - "1Kgs 8:36"
    relation: echo
    note: "Rain and blessing depend on turning to God. 1Kgs: bə-hēʿāṣēr šāmayim wə-lōʾ-yihyeh māṭār kî yeḥeṭʾû-lākh ... wə-nātattāh māṭār ʿal-ʾarṣəkhā. Q: wa-law anna ahla l-qurā āmanū wa-ttaqaw la-fataḥnā ʿalayhim barakātin mina l-samāʾi wa-l-arḍi."
  - with: hb-jer-6-siege-of-zion
    motif: town-destroyed-by-night-or-at-midday-rest
    refs:
    - "7:97"
    - "7:98"
    with_refs:
    - "Jer 6:4"
    - "Jer 6:5"
    relation: echo
    note: "Disaster at noon or by night. Jer: qûmû wə-naʿăleh vaṣ-ṣohŏrāyim ... qûmû wə-naʿăleh val-laylāh. Q: a-fa-amina ahlu l-qurā an yaʾtiyahum baʾsunā bayātan wa-hum nāʾimūna ... ḍuḥan wa-hum yalʿabūna. Jer's enemy plans a noon or night assault; Q's punishment comes by night or in daylight."
- unit: quran-7-moses-pharaoh
  checked: [hb-ps-78-history, hb-gen-40-prisoners-dreams, hb-exod-7-staff-swallows-staffs, hb-exod-7-plagues-blood-frogs-lice, hb-ps-105-history, hb-exod-8-plagues-flies-murrain-boils, hb-exod-5-bricks-without-straw, hb-exod-4-signs-aaron-bridegroom-of-blood, hb-exod-1-oppression-midwives, hb-exod-14-crossing-of-the-sea, hb-ps-37-meek-inherit, hb-exod-10-locusts-darkness]
  matches:
  - with: hb-exod-5-bricks-without-straw
    motif: let-my-people-go-demand
    refs:
    - "7:104"
    - "7:105"
    with_refs:
    - "Exod 5:1"
    - "Exod 5:3"
    relation: divergence
