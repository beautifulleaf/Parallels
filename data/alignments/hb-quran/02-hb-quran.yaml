        relation: echo
        note: "Hidden matters are left with God. Q: lā tasʾalū ʿan ashyāʾa in tubda lakum tasuʾkum ... ʿafā llāhu ʿanhā. Deut: ha-nnistārōt la-YHWH ʾĕlōhênû wə-ha-nniglōt lānû û-lə-vānênû ʿad-ʿôlām laʿăśôt."
      - with: hb-deut-15-release-year
