        refs: ["5:103"]
        with_refs: ["Deut 15:19"]
        relation: contrast
        note: "Animals dedicated by birth order and freed from work. Deut, by God's command: kol-hab-bəkhôr ... taqdîš la-YHWH ... lōʾ taʿăvōd bi-vkhōr šôrekhā wə-lōʾ tāgōz bəkhôr ṣōʾnekhā. Q: mā jaʿala llāhu min baḥīratin wa-lā sāʾibatin wa-lā waṣīlatin wa-lā ḥāmin. God denies instituting the pagan dedications, which also turn on birth order and release from use (sāʾiba, ḥām)."
      - with: hb-jer-44-queen-of-heaven
