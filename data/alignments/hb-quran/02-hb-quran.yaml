        motif: limping-between-two-opinions
        refs: ["4:143"]
        with_refs: ["1Kgs 18:21"]
        relation: parallel
        note: "Q: mudhabdhabīna bayna dhālika lā ilā hāʾulāʾi wa-lā ilā hāʾulāʾi (dangling between). 1Kgs: ʿad-mātay ʾattem pōsəḥîm ʿal-štê ha-səʿippîm. Elijah demands a choice (ʾim-YHWH hā-ʾĕlōhîm ləkhû ʾaḥărāyw wə-ʾim-ha-baʿal ləkhû ʾaḥărāyw); Q describes hypocrites who belong to neither camp."
      - with: hb-isa-29-ariel-and-sealed-book
