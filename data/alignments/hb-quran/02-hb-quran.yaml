  - unit: quran-5-bequest-witnesses
    checked: [hb-lev-5-graduated-and-guilt-offerings, hb-num-5-sotah-ordeal, hb-ezra-10-dismissal-of-foreign-wives, hb-deut-19-refuge-witnesses]
    matches:
      - with: hb-lev-5-graduated-and-guilt-offerings
        motif: witness-who-hears-adjuration-must-testify
        refs: ["5:106"]
        with_refs: ["Lev 5:1"]
        relation: parallel
        note: "Withholding testimony under oath is sin. Q: fa-yuqsimāni bi-llāhi ... wa-lā naktumu shahādata llāhi innā idhan la-mina l-āthimīna. Lev: wə-šāmʿāh qôl ʾālāh wə-hûʾ ʿēd ... ʾim-lôʾ yaggîd wə-nāśāʾ ʿăwōnô. Both name the guilt (āthimīn / ʿăwōnô) of the witness who conceals."
      - with: hb-num-5-sotah-ordeal
        motif: bitter-water-ordeal-for-adultery
        refs: ["5:106", "5:107"]
        with_refs: ["Num 5:19"]
        relation: echo
        note: "An oath before God settles a suspicion that cannot be proven. Q: taḥbisūnahumā min baʿdi l-ṣalāti fa-yuqsimāni bi-llāhi ini rtabtum. Num: wə-hišbîaʿ ʾōtāh hak-kōhēn, with the curse-water ordeal. In Q, if the oath is found false, two heirs swear a counter-oath; there is no ordeal."
      - with: hb-deut-19-refuge-witnesses
        motif: two-witnesses-for-capital-case
        refs: ["5:106", "5:107"]
        with_refs: ["Deut 19:15", "Deut 19:18"]
        relation: echo
        note: "Two witnesses are required, and false testimony is uncovered. Q: ithnāni dhawā ʿadlin minkum aw ākharāni min ghayrikum; fa-in ʿuthira ʿalā annahumā staḥaqqā ithman fa-ākharāni yaqūmāni maqāmahumā. Deut: ʿal-pî šənê ʿēdîm ...; wə-dārəšû haš-šōfəṭîm hêṭēv wə-hinnēh ʿēd-šeqer. In Q the remedy is a counter-oath by the heirs, not the court."
  - unit: quran-5-jesus-miracles-table
    checked: [hb-ps-78-history, hb-ps-51-miserere, hb-isa-63-communal-lament, hb-exod-34-thirteen-attributes-covenant-renewal, hb-exod-3-burning-bush, hb-ezek-20-history-of-rebellion, hb-gen-2-eden-adam-woman, hb-2kgs-5-naaman, hb-exod-32-tablets-broken-levites]
