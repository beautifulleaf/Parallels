      - with: hb-ps-78-history
        motif: table-in-the-wilderness
        refs: ["5:112", "5:113", "5:114", "5:115"]
        with_refs: ["Ps 78:18", "Ps 78:19", "Ps 78:21", "Ps 78:24"]
        relation: divergence
        note: "The same question about a table. Ps: wa-ynassû-ʾēl bi-lvāvām ... ha-yûkhal ʾēl laʿărōkh šulḥān bam-midbār, the rebels' test, answered by wrath (wa-yyitʿabbār) and then manna rained down (wa-yyamṭēr ʿălêhem mān ... dəgan-šāmayim). Q: hal yastaṭīʿu rabbuka an yunazzila ʿalaynā māʾidatan mina l-samāʾi, asked by the disciples (al-ḥawāriyyūn), not rebels. Jesus warns (ittaqū llāh), then prays; God grants it, and the threat comes afterwards: fa-man yakfur baʿdu ... ʿadhāban lā uʿadhdhibuhu aḥadan. The table becomes an ʿīd. In Ps the punishment is for asking; in Q for disbelief after the sign."
      - with: hb-ps-51-miserere
        motif: holy-spirit-of-god
        refs: ["5:110"]
        with_refs: ["Ps 51:13"]
        relation: echo
        note: "The same construct, rūḥ al-qudus = rûaḥ qodšəkhā. Q: idh ayyadtuka bi-rūḥi l-qudusi, a holy spirit that strengthens Jesus. Ps: wə-rûaḥ qodšəkhā ʾal-tiqqaḥ mimmennî, prayed for so that it is not taken away."
      - with: hb-isa-63-communal-lament
        motif: holy-spirit-of-god
        refs: ["5:110"]
        with_refs: ["Isa 63:10", "Isa 63:11"]
        relation: echo
        note: "Isa: ha-śśām bə-qirbô ʾet-rûaḥ qodšô, the holy spirit set among Moses' people, whom they grieved (wə-ʿiṣṣəvû ʾet-rûaḥ qodšô). Q: Jesus supported by rūḥ al-qudus while bani Isrāʾīl reject his signs as siḥrun mubīn."
      - with: hb-gen-2-eden-adam-woman
        motif: breath-of-life-into-nostrils
        refs: ["5:110"]
        with_refs: ["Gen 2:7"]
        relation: echo
        note: "Shaping from earth, then blowing to bring life. Q: wa-idh takhluqu mina l-ṭīni ka-hayʾati l-ṭayri bi-idhnī fa-tanfukhu fīhā fa-takūnu ṭayran bi-idhnī. Gen: wa-yyîṣer YHWH ʾĕlōhîm ʾet-hā-ʾādām ʿāfār min-hā-ʾădāmāh wa-yyippaḥ bə-ʾappāyw nišmat ḥayyîm. Jesus repeats God's creative act, but only 'by my leave' (bi-idhnī). cf. (not a match) Infancy Gospel of Thomas 2."
      - with: hb-2kgs-5-naaman
        motif: am-i-god-to-kill-and-make-alive
        refs: ["5:110"]
        with_refs: ["2Kgs 5:7"]
        relation: echo
        note: "Curing leprosy and raising the dead are God's prerogatives. 2Kgs: ha-ʾĕlōhîm ʾānî ləhāmît û-ləhaḥăyôt kî-zeh šōlēaḥ ʾēlay leʾĕsōf ʾîš miṣ-ṣāraʿtô. Q: wa-tubriʾu l-akmaha wa-l-abraṣa bi-idhnī wa-idh tukhriju l-mawtā bi-idhnī. Jesus does both, and the repeated bi-idhnī keeps them God's acts."
      - with: hb-exod-32-tablets-broken-levites
        motif: prophet-offers-to-be-blotted-from-gods-book
        refs: ["5:118"]
        with_refs: ["Exod 32:32"]
        relation: echo
        note: "An intercessor leaves the people's fate to God in a conditional. Exod: wə-ʿattāh ʾim-tiśśāʾ ḥaṭṭāʾtām wə-ʾim-ʾayin məḥēnî nāʾ mi-sifrəkhā. Q: in tuʿadhdhibhum fa-innahum ʿibāduka wa-in taghfir lahum fa-innaka anta l-ʿazīzu l-ḥakīmu. Moses stakes himself on the outcome; Jesus does not."
  - unit: quran-6-creation-rejecters
    checked: [hb-isa-45-cyrus-the-anointed, hb-job-33-elihu-dreams-and-angel, hb-job-10-why-did-you-make-me, hb-neh-9-levites-confession, hb-ps-78-history, hb-deut-32-song-of-moses, hb-gen-1-creation-six-days, hb-gen-18-visitors-at-mamre]
    matches:
      - with: hb-isa-45-cyrus-the-anointed
        motif: god-creates-light-and-darkness-peace-and-evil
        refs: ["6:1"]
        with_refs: ["Isa 45:7"]
        relation: echo
        note: "Q: al-ḥamdu li-llāhi lladhī khalaqa l-samāwāti wa-l-arḍa wa-jaʿala l-ẓulumāti wa-l-nūra. Isa: yôṣēr ʾôr û-vôrēʾ ḥōšekh. Both make God the maker of darkness as well as light. Q has the pair light/darkness only, without Isa's šālôm / rāʿ."
      - with: hb-gen-1-creation-six-days
        motif: creation-by-separation
        refs: ["6:1"]
        with_refs: ["Gen 1:2", "Gen 1:3", "Gen 1:4"]
        relation: divergence
        note: "Gen: wə-ḥōšekh ʿal-pənê təhôm already exists, God says yəhî ʾôr and then separates (wa-yyavdēl ... bên hā-ʾôr û-vên ha-ḥōšekh). Only light is created. Q 6:1: jaʿala l-ẓulumāti wa-l-nūra, God made the darknesses too (plural ẓulumāt, singular nūr). Darkness is put under creation, as in Isa 45:7, not left before it."
      - with: hb-job-10-why-did-you-make-me
        motif: human-formed-from-earth
        refs: ["6:2"]
        with_refs: ["Job 10:9"]
        relation: parallel
        note: "From clay to the appointed end. Q: huwa lladhī khalaqakum min ṭīnin thumma qaḍā ajalan wa-ajalun musamman ʿindahu. Job: zəkhor-nāʾ kî-kha-ḥōmer ʿăśîtānî wə-ʾel-ʿāfār təšîvēnî. Job pleads from it; Q uses it against doubt (thumma antum tamtarūn)."
      - with: hb-job-33-elihu-dreams-and-angel
        motif: pinched-off-from-clay
        refs: ["6:2"]
        with_refs: ["Job 33:6"]
        relation: echo
        note: "Job: mē-ḥōmer qōraṣtî gam-ʾānî. Q: khalaqakum min ṭīnin. Human origin in clay (ḥōmer = ṭīn)."
      - with: hb-gen-18-visitors-at-mamre
        motif: three-divine-visitors
        refs: ["6:8", "6:9"]
        with_refs: ["Gen 18:2"]
        relation: echo
        note: "Heavenly messengers appear as men. Gen: wə-hinnēh šəlōšāh ʾănāšîm niṣṣāvîm ʿālāyw. Q: wa-law jaʿalnāhu malakan la-jaʿalnāhu rajulan wa-la-labasnā ʿalayhim mā yalbisūna. An angel sent would come as a man, and the confusion would remain. Q uses the HB idea against the demand for an angel."
  - unit: quran-6-mercy-judgment
    checked: [hb-ps-50-divine-lawsuit, hb-judg-10-tola-jair-ammon, hb-isa-6-throne-vision, hb-exod-34-thirteen-attributes-covenant-renewal, hb-jer-7-obedience-not-sacrifice, hb-ezek-14-idols-in-heart-noah-daniel-job, hb-deut-32-song-of-moses]
    matches:
      - with: hb-ps-50-divine-lawsuit
        motif: god-does-not-eat-flesh-of-bulls
        refs: ["6:14"]
        with_refs: ["Ps 50:12", "Ps 50:13"]
        relation: parallel
        note: "God needs no food. Q: wa-huwa yuṭʿimu wa-lā yuṭʿamu. Ps: ʾim-ʾerʿav lōʾ-ʾōmar lākh kî-lî tēvēl û-məlōʾāh; ha-ʾôkhal bəśar ʾabbîrîm. Ps rejects the idea that sacrifice feeds God; Q makes it a divine attribute (he feeds, he is not fed)."
      - with: hb-deut-32-song-of-moses
        motif: mocking-where-are-their-gods
        refs: ["6:22", "6:24"]
        with_refs: ["Deut 32:37", "Deut 32:38"]
        relation: parallel
        note: "God asks where the false gods are. Q: ayna shurakāʾukumu lladhīna kuntum tazʿumūna ... wa-ḍalla ʿanhum mā kānū yaftarūn. Deut: ʾê ʾĕlōhêmô ṣûr ḥāsāyû vô ʾăšer ḥēlev zəvāḥêmô yōʾkhēlû ... yāqûmû wə-yaʿzərukhem. Deut sets it in history; Q on the day of gathering (yawma naḥshuruhum)."
      - with: hb-judg-10-tola-jair-ammon
        motif: mocking-where-are-their-gods
        refs: ["6:22"]
        with_refs: ["Judg 10:14"]
        relation: echo
        note: "Judg: ləkhû wə-zaʿăqû ʾel-hā-ʾĕlōhîm ʾăšer bəḥartem bām hēmmāh yôšîʿû lākhem bə-ʿēt ṣāratkhem. Q: ayna shurakāʾukum. The gods they chose fail them; in Judg God then relents (10:16), in Q the idolaters deny they ever had partners (wa-llāhi rabbinā mā kunnā mushrikīn)."
      - with: hb-isa-6-throne-vision
        motif: commission-to-harden-hearts
        refs: ["6:25"]
        with_refs: ["Isa 6:10"]
        relation: divergence
        note: "The same dullness of heart and ears. Isa: hašmēn lēv-hā-ʿām haz-zeh wə-ʾoznāyw hakhbēd wə-ʿênāyw hāšaʿ, and the prophet is told to cause it. Q: wa-jaʿalnā ʿalā qulūbihim akinnatan an yafqahūhu wa-fī ādhānihim waqran, and God does it. 'Heavy ears' (k-b-d) = waqr, heaviness."
      - with: hb-exod-34-thirteen-attributes-covenant-renewal
        motif: god-proclaims-own-name-and-attributes
        refs: ["6:12"]
        with_refs: ["Exod 34:6"]
        relation: echo
        note: "God declares his own mercy about himself. Q: kataba ʿalā nafsihi l-raḥmata, mercy prescribed by God for himself. Exod: wa-yyiqrāʾ YHWH YHWH ʾēl raḥûm wə-ḥannûn, God proclaiming his merciful name. Both use the root r-ḥ-m (raḥma / raḥûm)."
  - unit: quran-6-prophet-consoled-signs
    checked: [hb-amos-9-altar-and-booth-of-david, hb-ps-139-searched-and-known, hb-gen-28-jacobs-ladder, hb-jonah-4-qiqayon, hb-ps-104-creation-hymn, hb-isa-63-communal-lament, hb-ps-78-history]
    matches:
      - with: hb-gen-28-jacobs-ladder
        motif: dream-ladder-to-heaven
        refs: ["6:35"]
        with_refs: ["Gen 28:12"]
        relation: echo
        note: "The same word for a ladder to heaven: Q sullam = Heb sullām (hapax in HB). Gen: sullām muṣṣāv ʾarṣāh wə-rōʾšô maggîaʿ haš-šāmāymāh. Q: fa-ini staṭaʿta an tabtaghiya nafaqan fī l-arḍi aw sullaman fī l-samāʾi fa-taʾtiyahum bi-āyatin. The ladder is a hypothetical, impossible way to fetch a sign; in Gen angels go up and down it."
      - with: hb-amos-9-altar-and-booth-of-david
        motif: no-escape-from-god-sheol-heaven-sea
        refs: ["6:35"]
        with_refs: ["Amos 9:2"]
        relation: echo
        note: "The paired extremes 'into the earth / up to the sky'. Amos: ʾim-yaḥtərû vi-šʾôl ... wə-ʾim-yaʿălû haš-šāmayim. Q: nafaqan fī l-arḍi aw sullaman fī l-samāʾ. In Amos, flight from God; in Q, the Prophet's impossible search for a sign."
      - with: hb-ps-139-searched-and-known
        motif: no-escape-from-god-sheol-heaven-sea
        refs: ["6:35"]
        with_refs: ["Ps 139:8"]
        relation: echo
        note: "Ps: ʾim-ʾessaq šāmayim šām ʾāttāh wə-ʾaṣṣîʿāh šəʾôl hinnekkā. Q: nafaqan fī l-arḍi aw sullaman fī l-samāʾ. The same heaven/underworld merism."
      - with: hb-jonah-4-qiqayon
        motif: god-pities-animals-of-city
        refs: ["6:38"]
        with_refs: ["Jonah 4:11"]
        relation: echo
        note: "Animals count before God. Jonah ends û-vəhēmāh rabbāh. Q: wa-mā min dābbatin fī l-arḍi wa-lā ṭāʾirin yaṭīru bi-janāḥayhi illā umamun amthālukum ... thumma ilā rabbihim yuḥsharūna. Q goes further: animals are communities like you, gathered to their Lord."
      - with: hb-ps-104-creation-hymn
        motif: all-creatures-wait-for-food
        refs: ["6:38"]
        with_refs: ["Ps 104:27", "Ps 104:29"]
        relation: echo
        note: "Ps: kullām ʾēlêkhā yəśabbērûn ... tōsēf rûḥām yigwāʿûn wə-ʾel-ʿăfārām yəšûvûn. Q 6:38: every beast and bird is an umma 'like you', ilā rabbihim yuḥsharūna. Ps has them return to dust; Q has them gathered to God."
      - with: hb-ps-78-history
        motif: distress-prayer-then-ingratitude
        refs: ["6:40", "6:41", "6:43"]
        with_refs: ["Ps 78:34", "Ps 78:36", "Ps 78:37"]
        relation: parallel
        note: "Turning to God under blows, then relapsing. Ps: ʾim-hărāgām û-dərāšûhû wə-šāvû wə-šiḥărû-ʾēl ... wa-yfattûhû bə-fîhem ... wə-libbām lōʾ-nākhôn ʿimmô. Q: bal iyyāhu tadʿūna fa-yakshifu mā tadʿūna ilayhi ... wa-tansawna mā tushrikūna; 6:43 wa-lākin qasat qulūbuhum."
  - unit: quran-6-poor-keys-of-unseen
    checked: [hb-ps-104-creation-hymn, hb-job-9-job-cannot-sue-god, hb-isa-45-cyrus-the-anointed, hb-ps-139-searched-and-known]
    matches:
      - with: hb-ps-139-searched-and-known
        motif: everything-in-a-clear-book
        refs: ["6:59"]
        with_refs: ["Ps 139:15", "Ps 139:16"]
        relation: echo
        note: "Hidden things in the depths of the earth are known and written. Q: wa-lā ḥabbatin fī ẓulumāti l-arḍi wa-lā raṭbin wa-lā yābisin illā fī kitābin mubīnin. Ps: ruqqamtî bə-taḥtiyyôt ʾāreṣ ... wə-ʿal-sifrəkhā kullām yikkātēvû. Ps has a single life; Q extends it to every grain and leaf."
      - with: hb-isa-45-cyrus-the-anointed
        motif: keys-of-the-unseen
        refs: ["6:59"]
        with_refs: ["Isa 45:3"]
        relation: echo
        note: "Isa: wə-nātattî ləkhā ʾôṣərôt ḥōšekh û-maṭmūnê mistārîm, God gives Cyrus the hidden treasures. Q: wa-ʿindahu mafātiḥu l-ghaybi lā yaʿlamuhā illā huwa (mafātiḥ, keys or storehouses). Isa gives the hidden stores away; Q keeps them with God alone."
  - unit: quran-6-deliverance-trumpet
    checked: [hb-ps-107-four-rescues, hb-ps-1-two-ways, hb-jonah-1-flight-and-storm, hb-ps-33-creation-by-word, hb-gen-1-creation-six-days, hb-ezek-14-idols-in-heart-noah-daniel-job, hb-isa-27-leviathan-and-great-shofar]
    matches:
      - with: hb-ps-107-four-rescues
        motif: sea-peril-sincere-prayer-then-ingratitude
        refs: ["6:63", "6:64"]
        with_refs: ["Ps 107:26", "Ps 107:28", "Ps 107:29", "Ps 107:31"]
        relation: divergence
        note: "Rescue at sea after crying out. Ps: wa-yyiṣʿăqû ʾel-YHWH baṣ-ṣar lāhem ... yāqēm səʿārāh li-dmāmāh, and the psalm ends in thanks (yôdû la-YHWH ḥasdô). Q: man yunajjīkum min ẓulumāti l-barri wa-l-baḥri tadʿūnahu taḍarruʿan wa-khufyatan la-in anjānā ... la-nakūnanna mina l-shākirīn, then thumma antum tushrikūna. The vow of thanks is made and then broken."
      - with: hb-jonah-1-flight-and-storm
        motif: sea-peril-sincere-prayer-then-ingratitude
        refs: ["6:63", "6:64"]
        with_refs: ["Jonah 1:14", "Jonah 1:16"]
        relation: divergence
        note: "Jonah: wa-yyiqrəʾû ʾel-YHWH ... wa-yyîrʾû hā-ʾănāšîm yirʾāh gədôlāh ʾet-YHWH wa-yyizbəḥû-zevaḥ ... wa-yyiddərû nədārîm. The rescued sailors keep their vows. Q 6:64: the rescued 'associate partners'."
      - with: hb-ps-1-two-ways
        motif: avoid-those-who-mock-revelation
        refs: ["6:68"]
        with_refs: ["Ps 1:1"]
        relation: parallel
        note: "Do not sit with scoffers. Q: wa-idhā raʾayta lladhīna yakhūḍūna fī āyātinā fa-aʿriḍ ʿanhum ... fa-lā taqʿud baʿda l-dhikrā maʿa l-qawmi l-ẓālimīna. Ps: û-və-môšav lēṣîm lōʾ yāšāv (qaʿada = yāšav)."
      - with: hb-ps-33-creation-by-word
        motif: he-spoke-and-it-was
        refs: ["6:73"]
        with_refs: ["Ps 33:9"]
        relation: parallel
        note: "Q: wa-yawma yaqūlu kun fa-yakūnu qawluhu l-ḥaqq. Ps: kî hûʾ ʾāmar wa-yyehî hûʾ-ṣiwwāh wa-yyaʿămōd. In Q the creative word also makes the Day."
      - with: hb-gen-1-creation-six-days
        motif: creation-by-word
        refs: ["6:73"]
        with_refs: ["Gen 1:3"]
        relation: parallel
        note: "Gen: wa-yyōʾmer ʾĕlōhîm yəhî ʾôr wa-yəhî-ʾôr. Q: kun fa-yakūnu. The jussive of 'be' followed by its fulfilment (kun/yakūn = yəhî/wa-yəhî)."
      - with: hb-isa-27-leviathan-and-great-shofar
        motif: great-shofar-gathers-exiles
        refs: ["6:73"]
        with_refs: ["Isa 27:13"]
        relation: echo
        note: "A horn blast at the end time. Isa: yittāqaʿ bə-šôfār gādôl û-vāʾû hā-ʾōvədîm, gathering the exiles to the holy mountain. Q: yawma yunfakhu fī l-ṣūri, at the resurrection and judgement (ʿālimu l-ghaybi wa-l-shahāda). Isa's national ingathering becomes the universal resurrection."
  - unit: quran-6-abraham-heavenly-bodies
    checked: [hb-judg-6-jerubbaal-fleece, hb-josh-24-shechem-covenant, hb-gen-15-covenant-between-pieces, hb-neh-9-levites-confession, hb-exod-3-burning-bush, hb-deut-4-exhortation]
    matches:
      - with: hb-josh-24-shechem-covenant
        motif: father-serves-idols
        refs: ["6:74"]
        with_refs: ["Josh 24:2", "Josh 24:3"]
        relation: divergence
        note: "Abraham's father served other gods. The name and the agent differ. Josh: Teraḥ ʾăvî ʾAvrāhām ... wa-yyaʿavdû ʾĕlōhîm ʾăḥērîm, and God acts: wā-ʾeqqaḥ ʾet-ʾăvîkhem ʾet-ʾAvrāhām mē-ʿēver han-nāhār. Q: wa-idh qāla Ibrāhīmu li-abīhi Āzara a-tattakhidhu aṣnāman ālihatan. The father is named Āzar and confronted, and Abraham reasons his own way out (6:76-79)."
      - with: hb-gen-15-covenant-between-pieces
        motif: count-the-stars
        refs: ["6:75", "6:76"]
        with_refs: ["Gen 15:5"]
        relation: divergence
        note: "God shows Abraham the heavens, for a different purpose. Gen: habbeṭ-nāʾ haš-šāmaymāh û-sfōr hak-kôkhāvîm ... kōh yihyeh zarʿekhā, the stars as a promise of offspring. Q: wa-kadhālika nurī Ibrāhīma malakūta l-samāwāti wa-l-arḍi ... raʾā kawkaban qāla hādhā rabbī fa-lammā afala qāla lā uḥibbu l-āfilīna, a star that sets and so cannot be his Lord."
      - with: hb-gen-15-covenant-between-pieces
        motif: faith-reckoned-as-righteousness
        refs: ["6:82"]
        with_refs: ["Gen 15:6"]
        relation: echo
        note: "Gen: wə-heʾĕmin ba-YHWH wa-yyaḥšəvehā llô ṣədāqāh. Q: alladhīna āmanū wa-lam yalbisū īmānahum bi-ẓulmin ulāʾika lahumu l-amnu wa-hum muhtadūna. Abraham's belief is followed by its reward; Q makes it security (amn) for believers in general."
      - with: hb-deut-4-exhortation
        motif: astral-worship-forbidden
        refs: ["6:76", "6:77", "6:78"]
        with_refs: ["Deut 4:19"]
        relation: divergence
        note: "The same triad, looked at and rejected. Deut: pen-tiśśāʾ ʿênêkhā haš-šāmaymāh wə-rāʾîtā ʾet-haš-šemeš wə-ʾet-hay-yārēaḥ wə-ʾet-hak-kôkhāvîm ... wə-hištaḥăwîtā lāhem. Q: raʾā kawkaban ... raʾā l-qamara bāzighan ... raʾā l-shamsa bāzighatan, and each is rejected. But Deut adds ʾăšer ḥālaq YHWH ... ʾōtām lə-khōl hā-ʿammîm, as if the bodies were allotted to the nations; Q's Abraham rejects them for everyone (innī bariʾun mimmā tushrikūn)."
      - with: hb-judg-6-jerubbaal-fleece
        motif: let-the-god-defend-himself
        refs: ["6:80", "6:81"]
        with_refs: ["Judg 6:30", "Judg 6:31"]
        relation: divergence
        note: "A son against his father's gods and the townsmen. Judg: the townsmen demand hôṣēʾ ʾet-binkhā wə-yāmōt; the father Joash defends him, ʾim-ʾĕlōhîm hûʾ yāreb lô. Q: wa-ḥājjahu qawmuhu ... wa-lā akhāfu mā tushrikūna bihi: Abraham, not his father, mocks the impotence of the gods, and the father stays an idolater."
  - unit: quran-6-prophets-lineage-torah-sheets
    checked: [hb-job-1-prologue-first-test, hb-zech-13-fountain-and-shepherd, hb-eccl-5-wealth-and-oppression, hb-deut-18-levites-prophet, hb-ezek-13-false-prophets-and-prophetesses, hb-jer-15-confession-words-eaten, hb-jer-8-stork-and-lying-pen]
    matches:
      - with: hb-job-1-prologue-first-test
        motif: naked-from-womb-naked-return
        refs: ["6:94"]
        with_refs: ["Job 1:21"]
        relation: parallel
        note: "Q: wa-laqad jiʾtumūnā furādā ka-mā khalaqnākum awwala marratin wa-taraktum mā khawwalnākum warāʾa ẓuhūrikum. Job: ʿārōm yāṣāʾtî mi-beṭen ʾimmî wə-ʿārōm ʾāšûv šāmmāh. Job's 'naked' is Q's 'alone' (furādā), coming to God as at the first creation."
      - with: hb-eccl-5-wealth-and-oppression
        motif: naked-from-womb-naked-return
        refs: ["6:94"]
        with_refs: ["Eccl 5:14"]
        relation: parallel
        note: "Eccl: ʿārôm yāšûv lāleket kə-šebbāʾ û-məʾûmāh lōʾ-yiśśāʾ va-ʿămālô šeyyōlēkh bə-yādô. Q: wa-taraktum mā khawwalnākum warāʾa ẓuhūrikum. Possessions are left behind; Q adds the absent intercessors (wa-mā narā maʿakum shufaʿāʾakum)."
      - with: hb-ezek-13-false-prophets-and-prophetesses
        motif: false-claim-of-revelation
        refs: ["6:93"]
        with_refs: ["Ezek 13:6", "Ezek 13:7"]
        relation: parallel
        note: "Claiming revelation God did not give. Q: aw qāla ūḥiya ilayya wa-lam yūḥa ilayhi shayʾun. Ezek: hā-ʾōmərîm nəʾum-YHWH wa-YHWH lōʾ šəlāḥām; wə-ʾōmərîm nəʾum-YHWH wa-ʾănî lōʾ dibbartî. The same structure: claim + negation."
      - with: hb-deut-18-levites-prophet
        motif: false-prophet-death
        refs: ["6:93"]
        with_refs: ["Deut 18:20"]
        relation: divergence
        note: "Deut: ʾăšer yāzîd lə-dabbēr dāvār bi-šmî ʾēt ʾăšer lōʾ-ṣiwwîtîw ... û-mēt han-nāvîʾ ha-hûʾ, a death sentence. Q: wa-man aẓlamu mimmani ftarā ʿalā llāhi kadhiban ... wa-law tarā idhi l-ẓālimūna fī ghamarāti l-mawti wa-l-malāʾikatu bāsiṭū aydīhim. The false claimant is punished by angels at death and after it, not executed."
      - with: hb-zech-13-fountain-and-shepherd
        motif: false-prophet-death
        refs: ["6:93"]
        with_refs: ["Zech 13:3"]
        relation: echo
        note: "Zech: lōʾ tiḥyeh kî šeqer dibbartā bə-šēm YHWH; his parents pierce him. Q: iftarā ʿalā llāhi kadhiban; the punishment is the throes of death and the angels."
      - with: hb-jer-8-stork-and-lying-pen
        motif: lying-pen-of-scribes
        refs: ["6:91"]
        with_refs: ["Jer 8:8"]
        relation: echo
        note: "The custodians of the written Torah are accused of handling it falsely. Jer: ʾêkhāh tōʾmərû ḥăkhāmîm ʾănaḥnû wə-tôrat YHWH ʾittānû ʾākhēn hinnēh laš-šeqer ʿāśāh ʿēṭ šeqer sōfərîm. Q: qul man anzala l-kitāba lladhī jāʾa bihi Mūsā nūran wa-hudan li-l-nāsi tajʿalūnahu qarāṭīsa tubdūnahā wa-tukhfūna kathīran. In Jer the scribes falsify by writing; in Q they reveal some sheets and hide many."
  - unit: quran-6-signs-in-nature
    checked: [hb-exod-22-apodictic-and-social-laws, hb-exod-33-tent-and-glory, hb-ps-74-leviathan, hb-ps-104-creation-hymn, hb-gen-1-creation-six-days, hb-exod-34-thirteen-attributes-covenant-renewal, hb-deut-32-song-of-moses]
    matches:
      - with: hb-exod-22-apodictic-and-social-laws
        motif: do-not-curse-god-or-ruler
        refs: ["6:108"]
        with_refs: ["Exod 22:27"]
        relation: echo
        note: "A ban on reviling. Exod: ʾĕlōhîm lōʾ təqallēl wə-nāśîʾ bə-ʿamməkhā lōʾ tāʾōr, ambiguous between 'God', 'gods' and 'judges'. Q: wa-lā tasubbū lladhīna yadʿūna min dūni llāhi fa-yasubbū llāha ʿadwan bi-ghayri ʿilmin. Do not revile others' gods, lest they revile God. cf. (not a match) LXX Exod 22:27 'you shall not revile gods', Philo Spec. Leg. 1.53 and Josephus Ant. 4.207, who read the verse the same way."
      - with: hb-exod-33-tent-and-glory
        motif: no-man-sees-god-and-lives
        refs: ["6:103"]
        with_refs: ["Exod 33:20"]
        relation: parallel
        note: "Q: lā tudrikuhu l-abṣāru wa-huwa yudriku l-abṣāra. Exod: lōʾ tûkhal lirʾōt ʾet-pānāy kî lōʾ-yirʾanî hā-ʾādām wā-ḥāy. In Exod one cannot see God and live; Q makes it a statement about what sight can grasp, with God grasping all sight."
      - with: hb-gen-1-creation-six-days
        motif: luminaries-rule-day-night
        refs: ["6:96"]
        with_refs: ["Gen 1:14"]
        relation: parallel
        note: "Q: fāliqu l-iṣbāḥi wa-jaʿala l-layla sakanan wa-l-shamsa wa-l-qamara ḥusbānan. Gen: yəhî məʾōrōt ... wə-hāyû lə-ʾōtōt û-lə-môʿădîm û-lə-yāmîm wə-šānîm. Luminaries for reckoning time. Gen leaves sun and moon unnamed; Q names them."
      - with: hb-ps-104-creation-hymn
        motif: night-beasts-day-workers
        refs: ["6:96"]
        with_refs: ["Ps 104:19", "Ps 104:20", "Ps 104:23"]
        relation: echo
        note: "Ps: ʿāśāh yārēaḥ lə-môʿădîm šemeš yādaʿ məvôʾô; tāšet-ḥōšekh wî-hî lāylāh ... yēṣēʾ ʾādām lə-fāʿŏlô. Q: jaʿala l-layla sakanan wa-l-shamsa wa-l-qamara ḥusbānan. For Ps, night is when the beasts prowl; for Q, a time of rest (sakan)."
      - with: hb-ps-74-leviathan
        motif: luminaries-rule-day-night
        refs: ["6:96"]
        with_refs: ["Ps 74:16"]
        relation: echo
        note: "Ps: ləkhā yôm ʾaf-ləkhā lāylāh ʾattāh hăkhînôtā māʾôr wā-šāmeš. Q: day, night, sun and moon set by God (taqdīru l-ʿazīzi l-ʿalīm)."
      - with: hb-deut-32-song-of-moses
        motif: i-kill-and-make-alive
        refs: ["6:95"]
        with_refs: ["Deut 32:39"]
        relation: echo
        note: "Q: yukhriju l-ḥayya mina l-mayyiti wa-mukhriju l-mayyiti mina l-ḥayy. Deut: ʾănî ʾāmît wa-ʾăḥayyeh. Death and life are both God's work; Q shows it in the seed and the date stone."
  - unit: quran-6-signs-would-not-convince
    checked: [hb-isa-6-throne-vision, hb-deut-18-levites-prophet, hb-ezek-13-false-prophets-and-prophetesses, hb-jer-23-dreams-and-hammer, hb-exod-23-justice-sabbatical-festivals, hb-isa-40-comfort-my-people]
    matches:
      - with: hb-isa-6-throne-vision
        motif: commission-to-harden-hearts
        refs: ["6:110"]
        with_refs: ["Isa 6:10"]
        relation: divergence
        note: "Isa: hašmēn lēv ... wə-ʿênāyw hāšaʿ pen-yirʾeh və-ʿênāyw, the prophet is to dull heart and eyes. Q: wa-nuqallibu afʾidatahum wa-abṣārahum ka-mā lam yuʾminū bihi awwala marratin. God turns hearts and eyes as a consequence of the first unbelief. The agent is God, not the prophet, and it is a response to prior rejection, not the purpose of the mission."
      - with: hb-deut-18-levites-prophet
        motif: necromancy-forbidden
        refs: ["6:111"]
        with_refs: ["Deut 18:11"]
        relation: contrast
        note: "The speaking dead. Deut forbids seeking them: wə-šōʾēl ʾôv wə-yiddəʿōnî wə-dōrēš ʾel-ham-mētîm. Q: wa-law annanā nazzalnā ilayhimu l-malāʾikata wa-kallamahumu l-mawtā ... mā kānū li-yuʾminū. Even if the dead spoke unbidden, they would not convince. Deut shuts the dead out as a source; Q denies they would persuade."
      - with: hb-exod-23-justice-sabbatical-festivals
        motif: no-false-report-or-following-majority
        refs: ["6:116"]
        with_refs: ["Exod 23:2"]
        relation: parallel
        note: "Do not follow the majority. Q: wa-in tuṭiʿ akthara man fī l-arḍi yuḍillūka ʿan sabīli llāhi in yattabiʿūna illā l-ẓanna. Exod: lōʾ-tihyeh ʾaḥărê-rabbîm lə-rāʿōt wə-lōʾ-taʿăneh ʿal-riv linṭōt ʾaḥărê rabbîm. Exod is a courtroom rule; Q is about the path to God."
      - with: hb-isa-40-comfort-my-people
        motif: no-changer-of-gods-words
        refs: ["6:115"]
        with_refs: ["Isa 40:8"]
        relation: echo
        note: "Q: wa-tammat kalimatu rabbika ṣidqan wa-ʿadlan lā mubaddila li-kalimātihi. Isa: yāvēš ḥāṣîr nāvēl ṣîṣ û-dəvar-ʾĕlōhênû yāqûm lə-ʿôlām. God's word stands and cannot be changed."
  - unit: quran-6-slaughter-chest-jinn
    checked: [hb-isa-65-rebels-and-servants, hb-deut-4-exhortation, hb-ps-44-national-lament, hb-ps-119-alef-he, hb-isa-9-child-born-and-outstretched-hand, hb-amos-3-lion-has-roared, hb-deut-9-golden-calf-recalled]
    matches:
      - with: hb-ps-119-alef-he
        motif: breast-opened-or-constricted
        refs: ["6:125"]
        with_refs: ["Ps 119:32"]
        relation: echo
        note: "Guidance as a widening of the heart. Q: fa-man yuridi llāhu an yahdiyahu yashraḥ ṣadrahu li-l-islāmi wa-man yurid an yuḍillahu yajʿal ṣadrahu ḍayyiqan ḥarajan. Ps: derekh-miṣwōtêkhā ʾārûṣ kî tarḥîv libbî. Q adds the opposite: the narrowed breast, 'as if climbing into the sky'."
      - with: hb-isa-9-child-born-and-outstretched-hand
        motif: people-in-darkness-see-great-light
        refs: ["6:122"]
        with_refs: ["Isa 9:1"]
        relation: echo
        note: "From darkness and death to light. Q: a-wa-man kāna maytan fa-aḥyaynāhu wa-jaʿalnā lahu nūran yamshī bihi fī l-nāsi ka-man mathaluhu fī l-ẓulumāti. Isa: hā-ʿām ha-hōləkhîm ba-ḥōšekh rāʾû ʾôr gādôl yōšəvê bə-ʾereṣ ṣalmāwet. Isa speaks of a people; Q of a single believer."
      - with: hb-amos-3-lion-has-roared
        motif: no-punishment-without-messenger
        refs: ["6:130", "6:131"]
        with_refs: ["Amos 3:7"]
        relation: echo
        note: "No judgement without prior warning through messengers. Amos: kî lōʾ yaʿăśeh ʾădōnāy YHWH dāvār kî ʾim-gālāh sôdô ʾel-ʿăvādāyw han-nəvîʾîm. Q: a-lam yaʾtikum rusulun minkum ... dhālika an lam yakun rabbuka muhlika l-qurā bi-ẓulmin wa-ahluhā ghāfilūna."
      - with: hb-deut-9-golden-calf-recalled
        motif: god-offers-new-nation-from-hero
        refs: ["6:133"]
        with_refs: ["Deut 9:14"]
        relation: echo
        note: "God can remove a people and raise another. Deut: hereph mimmennî wə-ʾašmîdēm ... wə-ʾeʿĕśeh ʾôtəkhā lə-gôy ʿāṣûm wā-rāv mimmennû. Q: in yashaʾ yudhhibkum wa-yastakhlif min baʿdikum mā yashāʾu ka-mā anshaʾakum min dhurriyyati qawmin ākharīn. In Deut a threat averted by intercession; in Q a standing possibility."
  - unit: quran-6-pagan-offerings-cattle
    checked: [hb-lev-11-dietary-laws, hb-deut-15-release-year, hb-deut-14-diet-tithe, hb-lev-7-guilt-peace-portions, hb-lev-22-holy-food-and-unblemished-victims, hb-deut-12-one-sanctuary, hb-2kgs-17-samaritan-settlers, hb-lev-3-peace-offering, hb-deut-24-divorce-pledges-poor]
    matches:
      - with: hb-lev-11-dietary-laws
        motif: camel-forbidden
        refs: ["6:144", "6:145"]
        with_refs: ["Lev 11:4"]
        relation: contrast
        note: "Opposite rulings on the camel. Lev: ʾet-hag-gāmāl kî-maʿălēh gērāh hûʾ û-farsāh ʾênennû mafrîs ṭāmēʾ hûʾ lākhem. Q lists wa-mina l-ibili thnayni among the eight lawful pairs and asks which God forbade (āl-dhakarayni ḥarrama ami l-unthayayni). Then 6:145: only carrion, poured-out blood, pork and what is offered to other than God are forbidden."
      - with: hb-deut-14-diet-tithe
        motif: clean-unclean-animals-list
        refs: ["6:143", "6:144", "6:146"]
        with_refs: ["Deut 14:4", "Deut 14:7"]
        relation: response
        note: "Deut: zōʾt hab-bəhēmāh ʾăšer tōʾkhēlû šôr śēh khəśāvîm wə-śēh ʿizzîm, but ʾet-hag-gāmāl ... ṭəmēʾîm hēm lākhem. Q: eight pairs (sheep, goats, camels, cattle) are lawful, and the narrower Jewish list is a later penalty: wa-ʿalā lladhīna hādū ḥarramnā kulla dhī ẓufurin ... dhālika jazaynāhum bi-baghyihim. Q explains the HB restriction as punishment."
      - with: hb-lev-7-guilt-peace-portions
        motif: prohibition-of-eating-fat
        refs: ["6:146"]
        with_refs: ["Lev 7:23", "Lev 7:25"]
        relation: response
        note: "Lev: kol-ḥēlev šôr wə-khesev wā-ʿēz lōʾ tōʾkhēlû, with kārēt. Q: wa-mina l-baqari wa-l-ghanami ḥarramnā ʿalayhim shuḥūmahumā illā mā ḥamalat ẓuhūruhumā awi l-ḥawāyā aw mā khtalaṭa bi-ʿaẓmin. Q recognises the ban but gives it as a punishment for the Jews (jazaynāhum bi-baghyihim) and adds exceptions."
      - with: hb-lev-3-peace-offering
        motif: fat-tail-offering
        refs: ["6:146"]
        with_refs: ["Lev 3:3", "Lev 3:9"]
        relation: divergence
        note: "What fat is exempt. Lev puts on the altar ha-ḥēlev ha-məkhasseh ʾet-haq-qerev wə-ʾēt kol-ha-ḥēlev ʾăšer ʿal-haq-qerev (the fat on the entrails) and ha-ʾalyāh təmîmāh lə-ʿummat he-ʿāṣeh (the fat tail by the backbone). Q exempts mā ḥamalat ẓuhūruhumā awi l-ḥawāyā (what the backs carry, or the entrails) from the ban. cf. (not a match) the rabbinic ḥelev / shuman distinction (b. Ḥullin 49b)."
      - with: hb-deut-12-one-sanctuary
        motif: blood-is-life-pour-on-ground
        refs: ["6:145"]
        with_refs: ["Deut 12:16"]
        relation: parallel
        note: "Blood that is poured out. Deut: raq ha-dām lōʾ tōʾkhēlû ʿal-hā-ʾāreṣ tišpəkhennû kam-māyim. Q: aw daman masfūḥan, only 'poured-out blood' is forbidden, the same image of shed blood (s-f-ḥ / š-f-k)."
      - with: hb-deut-12-one-sanctuary
        motif: child-sacrifice-by-fire-condemned
        refs: ["6:137", "6:140"]
        with_refs: ["Deut 12:31"]
        relation: parallel
        note: "Deut: kî gam ʾet-bənêhem wə-ʾet-bənōtêhem yiśrəfû vā-ʾēš lē-ʾlōhêhem. Q: zayyana li-kathīrin mina l-mushrikīna qatla awlādihim shurakāʾuhum; qad khasira lladhīna qatalū awlādahum safahan bi-ghayri ʿilmin. Both blame the false gods. Q does not mention fire (cf. Arabian infanticide)."
      - with: hb-2kgs-17-samaritan-settlers
        motif: syncretism-fear-god-serve-idols
        refs: ["6:136"]
        with_refs: ["2Kgs 17:33"]
        relation: parallel
        note: "Dividing worship between God and other gods. 2Kgs: ʾet-YHWH hāyû yərēʾîm wə-ʾet-ʾĕlōhêhem hāyû ʿōvədîm. Q: wa-jaʿalū li-llāhi mimmā dharaʾa mina l-ḥarthi wa-l-anʿāmi naṣīban fa-qālū hādhā li-llāhi ... wa-hādhā li-shurakāʾinā. Q adds that God's share ends up going to the partners."
      - with: hb-deut-15-release-year
        motif: firstling-consecrated
        refs: ["6:138"]
        with_refs: ["Deut 15:19"]
        relation: contrast
        note: "Animals set apart from use. Deut, by God's command: lōʾ taʿăvōd bi-vkhōr šôrekhā wə-lōʾ tāgōz bəkhôr ṣōʾnekhā. Q condemns the pagans' own version: wa-anʿāmun ḥurrimat ẓuhūruhā ... iftirāʾan ʿalayhi. The HB sets aside animals at God's command; Q calls the pagan setting-aside a lie against God."
      - with: hb-deut-24-divorce-pledges-poor
        motif: gleanings-for-poor
        refs: ["6:141"]
        with_refs: ["Deut 24:19"]
        relation: parallel
        note: "The harvest carries a due to others. Q: kulū min thamarihi idhā athmara wa-ātū ḥaqqahu yawma ḥaṣādihi wa-lā tusrifū. Deut: kî tiqṣōr qəṣîrəkhā ... wə-šākhaḥtā ʿōmer ... lag-gēr lay-yātôm wə-lā-ʾalmānāh yihyeh. Deut names the forgotten sheaf and its recipients; Q a general 'due'."
  - unit: quran-6-commandments
    checked: [hb-deut-30-return-choose-life, hb-exod-20-decalogue, hb-deut-5-decalogue, hb-zech-5-flying-scroll, hb-ezek-18-sour-grapes, hb-lev-19-holiness-code-b]
    matches:
      - with: hb-exod-20-decalogue
        motif: ten-commandments
        refs: ["6:151", "6:152", "6:153"]
        with_refs: ["Exod 20:2", "Exod 20:3", "Exod 20:8", "Exod 20:13", "Exod 20:14", "Exod 20:16"]
        relation: divergence
        note: "A recited list of commandments compared item by item. Kept: no other gods (allā tushrikū bihi shayʾan = lōʾ yihyeh-ləkhā ʾĕlōhîm ʾăḥērîm), parents, killing, sexual sin, false speech. Omitted: the Sabbath (zākhôr ʾet-yôm haš-šabbāt) and coveting; the image ban is folded into 'associate nothing'. Added: allā taqtulū awlādakum min imlāqin, the orphan's property, full measure and weight, keeping God's covenant. The prologue ʾānōkhî YHWH ʾĕlōhêkhā ʾăšer hôṣēʾtîkhā mē-ʾereṣ miṣrayim becomes qul taʿālaw atlu mā ḥarrama rabbukum, without the Exodus."
      - with: hb-deut-5-decalogue
        motif: honor-parents-long-life
        refs: ["6:151"]
        with_refs: ["Deut 5:16"]
        relation: divergence
        note: "Deut: kabbēd ʾet-ʾāvîkhā wə-ʾet-ʾimmekhā ... ləmaʿan yaʾărîkhūn yāmêkhā û-ləmaʿan yîṭav lākh ʿal-hā-ʾădāmāh. Q: wa-bi-l-wālidayni iḥsānan. 'Honour' becomes 'kindness', and the promise of long life in the land is dropped."
      - with: hb-deut-5-decalogue
        motif: prohibition-murder-adultery-theft-false-witness
        refs: ["6:151", "6:152"]
        with_refs: ["Deut 5:17", "Deut 5:18", "Deut 5:20"]
        relation: divergence
        note: "Deut: lōʾ tirṣāḥ; wə-lōʾ tinʾāf; wə-lōʾ-taʿăneh və-rēʿăkhā ʿēd šāwʾ, absolute. Q qualifies and widens: wa-lā taqtulū l-nafsa llatī ḥarrama llāhu illā bi-l-ḥaqqi (with an exception); wa-lā taqrabū l-fawāḥisha mā ẓahara minhā wa-mā baṭana (all indecency, not only adultery); wa-idhā qultum fa-ʿdilū wa-law kāna dhā qurbā (just speech even against kin). Theft is absent."
      - with: hb-deut-5-decalogue
        motif: turn-neither-right-nor-left
        refs: ["6:153"]
        with_refs: ["Deut 5:32", "Deut 5:33"]
        relation: parallel
        note: "Deut, right after the Decalogue: lōʾ tāsurû yāmîn û-śəmōʾl bə-khol-ha-dderekh ... tēlēkhû. Q, right after its list: wa-anna hādhā ṣirāṭī mustaqīman fa-ttabiʿūhu wa-lā tattabiʿū l-subula fa-tafarraqa bikum. The single road versus side paths, placed at the same point."
      - with: hb-deut-30-return-choose-life
        motif: choose-life
        refs: ["6:153"]
        with_refs: ["Deut 30:15", "Deut 30:16"]
        relation: echo
        note: "Deut: rəʾēh nātattî ləfānêkhā ... ʾet-ha-ḥayyîm wə-ʾet-haṭ-ṭôv ... lāleket bi-drākhāyw. Q: ṣirāṭī mustaqīman fa-ttabiʿūhu ... ʿan sabīlihi. A way set before the people, with God's 'ways' against 'the paths'."
      - with: hb-lev-19-holiness-code-b
        motif: just-weights-and-measures
        refs: ["6:152"]
        with_refs: ["Lev 19:35", "Lev 19:36"]
        relation: parallel
        note: "Q: wa-awfū l-kayla wa-l-mīzāna bi-l-qisṭi. Lev: lōʾ-taʿăśû ʿāwel bam-mišpāṭ bam-middāh bam-mišqāl ... mōʾznê ṣedeq ʾavnê-ṣedeq. Q puts just measure into its commandment list; Lev attaches it to the Exodus formula."
  - unit: quran-6-final-reckoning
    checked: [hb-ezek-18-sour-grapes, hb-exod-20-decalogue, hb-deut-24-divorce-pledges-poor, hb-jer-31-consolation-new-covenant, hb-ezek-3-watchman-and-muteness, hb-ezra-9-ezras-confession]
    matches:
      - with: hb-ezek-18-sour-grapes
        motif: soul-that-sins-shall-die
        refs: ["6:164"]
        with_refs: ["Ezek 18:20"]
        relation: parallel
        note: "Q: wa-lā taksibu kullu nafsin illā ʿalayhā wa-lā taziru wāziratun wizra ukhrā. Ezek: han-nefeš ha-ḥōṭēʾt hîʾ tāmût bēn lōʾ-yiśśāʾ ba-ʿăwōn hā-ʾāv. Both use a verb of carrying (wazara / nāśāʾ) for guilt."
      - with: hb-exod-20-decalogue
        motif: sins-visited-to-third-fourth-generation
        refs: ["6:160", "6:164"]
        with_refs: ["Exod 20:5", "Exod 20:6"]
        relation: contrast
        note: "Two points. (1) Exod: pōqēd ʿăwōn ʾāvōt ʿal-bānîm ʿal-šillēšîm wə-ʿal-ribbēʿîm, guilt carried across generations; Q 6:164 lā taziru wāziratun wizra ukhrā, no one bears another's burden. (2) Both make reward larger than punishment: Exod ʿōśeh ḥesed lā-ʾălāfîm against three or four generations; Q man jāʾa bi-l-ḥasanati fa-lahu ʿashru amthālihā wa-man jāʾa bi-l-sayyiʾati fa-lā yujzā illā mithlahā."
      - with: hb-deut-24-divorce-pledges-poor
        motif: individual-responsibility-no-vicarious-death
        refs: ["6:164"]
        with_refs: ["Deut 24:16"]
        relation: parallel
        note: "Deut: lōʾ-yûmətû ʾāvôt ʿal-bānîm û-vānîm lōʾ-yûmətû ʿal-ʾāvôt ʾîš bə-ḥeṭʾô yûmātû, a court rule. Q applies it to the final reckoning: lā taziru wāziratun wizra ukhrā thumma ilā rabbikum marjiʿukum."
      - with: hb-jer-31-consolation-new-covenant
        motif: individual-responsibility-for-sin
        refs: ["6:164"]
        with_refs: ["Jer 31:30"]
        relation: echo
        note: "Jer: kî ʾim-ʾîš baʿăwōnô yāmût. Q: wa-lā taksibu kullu nafsin illā ʿalayhā."
