  - unit: quran-4-women-orphans-justice
    checked: [hb-ruth-1-naomi-ruth-return, hb-lev-19-holiness-code-a, hb-mal-2-faithless-marriage, hb-prov-22-solomon-sayings-end, hb-exod-23-justice-sabbatical-festivals, hb-num-36-heiresses]
    matches:
      - with: hb-ruth-1-naomi-ruth-return
        motif: wife-left-suspended
        refs: ["4:129"]
        with_refs: ["Ruth 1:13"]
        relation: echo
        note: "Q: fa-tadharūhā ka-l-muʿallaqa, left 'hanging', neither married nor free. Ruth: ha-lāhēn tēʿāgēnāh lə-viltî hĕyôt lə-ʾîš, 'would you be anchored (ʿ-g-n), not belonging to a man?'. The root of the later rabbinic ʿagunah. cf. (not a match) m. Gittin, ʿagunah law."
      - with: hb-lev-19-holiness-code-a
        motif: impartial-judgment-neither-poor-nor-great
        refs: ["4:135"]
        with_refs: ["Lev 19:15"]
        relation: parallel
        note: "Q: kūnū qawwāmīna bi-l-qisṭi ... in yakun ghaniyyan aw faqīran fa-llāhu awlā bihimā fa-lā tattabiʿū l-hawā. Lev: lōʾ-tiśśāʾ fənê-dāl wə-lōʾ tehdar pənê gādôl bə-ṣedeq tišpōṭ ʿămîtekhā. Q's pair rich/poor matches Lev's dāl/gādôl."
      - with: hb-exod-23-justice-sabbatical-festivals
        motif: impartial-judgment-neither-poor-nor-great
        refs: ["4:135"]
        with_refs: ["Exod 23:3"]
        relation: echo
        note: "Exod: wə-dāl lōʾ tehdar bə-rîvô, do not favour even the poor man in his suit. Q 4:135 aw faqīran: justice must not lean toward the poor either."
      - with: hb-mal-2-faithless-marriage
        motif: god-hates-divorce
        refs: ["4:128", "4:130"]
        with_refs: ["Mal 2:14", "Mal 2:16"]
        relation: contrast
        note: "Opposite views of separation. Mal: kî-śānēʾ šallaḥ ʾāmar YHWH ... wə-lōʾ tivgōdû (MT difficult: 'he hates sending away' or 'one who hates and sends away'); God is witness to the ʾēšet nəʿûrêkhā. Q: if a wife fears nushūz from her husband, wa-l-ṣulḥu khayrun (reconciliation is best), but wa-in yatafarraqā yughni llāhu kullan min saʿatihi: separation is allowed and God provides for both."
      - with: hb-num-36-heiresses
        motif: heiress-must-marry-within-tribe
        refs: ["4:127"]
        with_refs: ["Num 36:6", "Num 36:8"]
        relation: divergence
        note: "In both, a female orphan's inheritance is tied to her marriage. Num makes marriage within the father's clan a duty, so the naḥălāh does not pass to another tribe: ʾakh lə-mišpaḥat maṭṭēh ʾăvîhem tihyênāh lə-nāšîm. Q censures guardians who wish to marry orphan girls while withholding what is written for them: allātī lā tuʾtūnahunna mā kutiba lahunna wa-targhabūna an tankiḥūhunna."
  - unit: quran-4-hypocrites-wavering
    checked: [hb-1kgs-18-carmel, hb-exod-20-decalogue, hb-jer-12-why-wicked-prosper, hb-deut-13-enticers, hb-isa-29-ariel-and-sealed-book]
    matches:
