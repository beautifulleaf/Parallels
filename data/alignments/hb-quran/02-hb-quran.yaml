        refs: ["4:142"]
        with_refs: ["Isa 29:13"]
        relation: echo
        note: "Worship performed without the heart. Q: wa-idhā qāmū ilā l-ṣalāti qāmū kusālā yurāʾūna l-nāsa wa-lā yadhkurūna llāha illā qalīlan. Isa: bə-fîw û-vi-śfātāyw kibbədûnî wə-libbô riḥaq mimmennî wa-ttəhî yirʾātām ʾōtî miṣwat ʾănāšîm mə-lummādāh."
      - with: hb-jer-12-why-wicked-prosper
        motif: god-near-in-mouth-far-from-heart
        refs: ["4:142"]
        with_refs: ["Jer 12:2"]
        relation: echo
        note: "Jer: qārôv ʾattāh bə-fîhem wə-rāḥôq mi-kilyôtêhem. Q: the hypocrites' outward prayer and little remembrance of God (wa-lā yadhkurūna llāha illā qalīlan)."
  - unit: quran-4-israel-indictment-crucifixion
    checked: [hb-neh-9-levites-confession, hb-ps-15-entrance-liturgy, hb-ps-106-national-confession, hb-ezek-20-history-of-rebellion, hb-isa-1-indictment-of-judah, hb-exod-33-tent-and-glory, hb-exod-19-sinai-theophany, hb-lev-26-curses, hb-exod-22-apodictic-and-social-laws, hb-2kgs-2-ascension-of-elijah]
    matches:
      - with: hb-neh-9-levites-confession
        motif: prophets-killed-by-israel
        refs: ["4:155"]
        with_refs: ["Neh 9:26"]
        relation: parallel
        note: "Q: wa-qatlihimu l-anbiyāʾa bi-ghayri ḥaqqin, in a list of covenant breaches (naqḍihim mīthāqahum). Neh: wa-yyamrû wa-yyimrədû bākh ... wə-ʾet-nəvîʾêkhā hārāgû ʾăšer hēʿîdû vām. Both put the charge in a historical indictment."
      - with: hb-neh-9-levites-confession
        motif: golden-calf
        refs: ["4:153"]
        with_refs: ["Neh 9:18", "Neh 9:19"]
        relation: parallel
        note: "Q: thumma ttakhadhū l-ʿijla min baʿdi mā jāʾathumu l-bayyinātu fa-ʿafawnā ʿan dhālika. Neh: ʾaf kî-ʿāśû lāhem ʿēgel massēkhāh ... wə-ʾattāh bə-raḥămêkhā hā-rabbîm lōʾ ʿăzavtām. In both, the calf follows the signs and is forgiven."
      - with: hb-ps-106-national-confession
        motif: golden-calf
        refs: ["4:153"]
        with_refs: ["Ps 106:19", "Ps 106:20"]
        relation: echo
        note: "Ps: yaʿăśû-ʿēgel bə-Ḥōrēv ... wa-yyāmîrû ʾet-kəvôdām bə-tavnît šôr. Q: ittakhadhū l-ʿijla after the clear signs. Both recite the calf in a list of Israel's sins."
      - with: hb-exod-33-tent-and-glory
        motif: prophet-asks-to-see-gods-glory
        refs: ["4:153"]
        with_refs: ["Exod 33:18", "Exod 33:20"]
        relation: divergence
        note: "The same causative of r-ʾ-y. Exod: Moses asks harʾēnî nāʾ ʾet-kəvōdekhā, and God answers lōʾ tûkhal lirʾōt ʾet-pānāy kî lōʾ-yirʾanî hā-ʾādām wā-ḥāy, then shows his back. Q: the people ask Moses arinā llāha jahratan, and fa-akhadhathumu l-ṣāʿiqatu bi-ẓulmihim. The asker shifts from the prophet to the people, and the request is punished as wrongdoing."
      - with: hb-exod-19-sinai-theophany
        motif: mountain-raised-over-israel
        refs: ["4:154"]
        with_refs: ["Exod 19:17"]
        relation: divergence
        note: "Exod: wa-yyityaṣṣəvû bə-taḥtît hā-hār, 'they stood at the foot (lit. underneath) of the mountain'. Q: wa-rafaʿnā fawqahumu l-ṭūra bi-mīthāqihim. The mountain is lifted over them as the covenant is taken. cf. (not a match) b. Shabbat 88a, which reads Exod 19:17 as God holding the mountain over them like a vat."
      - with: hb-ezek-20-history-of-rebellion
        motif: god-gave-laws-not-good
        refs: ["4:160"]
        with_refs: ["Ezek 20:25"]
        relation: parallel
        note: "Law given as punishment. Ezek: wə-gam-ʾănî nātattî lāhem ḥuqqîm lōʾ ṭôvîm û-mišpāṭîm lōʾ yiḥyû bāhem. Q: fa-bi-ẓulmin mina lladhīna hādū ḥarramnā ʿalayhim ṭayyibātin uḥillat lahum. Ezek has bad laws given; Q has good things forbidden."
      - with: hb-lev-26-curses
        motif: uncircumcised-heart
        refs: ["4:155"]
        with_refs: ["Lev 26:41"]
        relation: divergence
        note: "Lev: ʾô-ʾāz yikkānaʿ ləvāvām he-ʿārēl, where God calls the heart uncircumcised and expects it to be humbled. Q: the people say it of themselves as an excuse, qulūbunā ghulfun ('our hearts are uncircumcised/wrapped'), and God answers bal ṭabaʿa llāhu ʿalayhā bi-kufrihim."
      - with: hb-exod-22-apodictic-and-social-laws
        motif: prohibition-of-interest
        refs: ["4:161"]
        with_refs: ["Exod 22:24"]
        relation: response
        note: "Q points to the Torah ban as already given: wa-akhdhihimu l-ribā wa-qad nuhū ʿanhu wa-aklihim amwāla l-nāsi bi-l-bāṭil. Exod: ʾim-kesef talweh ʾet-ʿammî ʾet-heʿānî ʿimmākh ... lōʾ-təśîmûn ʿālāyw nešekh. The HB ban protects 'my people, the poor with you'; Q extends the charge to 'the people's wealth'."
      - with: hb-2kgs-2-ascension-of-elijah
        motif: prophet-ascends-in-whirlwind
        refs: ["4:158"]
        with_refs: ["2Kgs 2:11"]
        relation: echo
        note: "Taken up alive instead of dying. Q: bal rafaʿahu llāhu ilayhi, after wa-mā qatalūhu wa-mā ṣalabūhu. 2Kgs: wa-yyaʿal ʾĒliyyāhû bas-səʿārāh haš-šāmāyim. Q gives no chariot or whirlwind; the agent is God, 'to himself'."
  - unit: quran-4-prophets-and-trinity
    checked: [hb-exod-33-tent-and-glory, hb-deut-34-death-of-moses, hb-exod-3-burning-bush, hb-jer-15-confession-words-eaten, hb-ps-44-national-lament, hb-deut-6-shema, hb-ps-2-anointed-son, hb-isa-42-servant-and-new-song, hb-2sam-23-last-words-of-david]
    matches:
      - with: hb-exod-33-tent-and-glory
        motif: god-speaks-face-to-face-as-to-a-friend
        refs: ["4:164"]
        with_refs: ["Exod 33:11"]
        relation: parallel
        note: "Q: wa-kallama llāhu Mūsā taklīman, singling out Moses among the prophets as the one God addressed directly. Exod: wə-dibber YHWH ʾel-Mōšeh pānîm ʾel-pānîm kaʾăšer yədabbēr ʾîš ʾel-rēʿēhû. Q omits 'face to face'."
      - with: hb-deut-34-death-of-moses
        motif: god-speaks-face-to-face-as-to-a-friend
        refs: ["4:164"]
        with_refs: ["Deut 34:10"]
        relation: parallel
        note: "Deut: wə-lōʾ-qām nāvîʾ ʿôd bə-Yiśrāʾēl kə-Mōšeh ʾăšer yədāʿô YHWH pānîm ʾel-pānîm. Q 4:163-164 sets Moses in a catalogue of messengers and distinguishes him by taklīman. Deut makes him unequalled; Q puts Muhammad's revelation in the same series (innā awḥaynā ilayka ka-mā awḥaynā ilā Nūḥin)."
      - with: hb-deut-6-shema
        motif: shema-god-is-one
        refs: ["4:171"]
        with_refs: ["Deut 6:4"]
        relation: parallel
        note: "Q: wa-lā taqūlū thalāthatun ... innamā llāhu ilāhun wāḥidun. Deut: šəmaʿ Yiśrāʾēl YHWH ʾĕlōhênû YHWH ʾeḥād. Q turns the oneness formula against the Christians' 'three'."
      - with: hb-ps-2-anointed-son
        motif: king-begotten-as-gods-son
        refs: ["4:171"]
        with_refs: ["Ps 2:7"]
        relation: contrast
        note: "Ps: YHWH ʾāmar ʾēlay bənî ʾattāh ʾănî hay-yôm yəlidtîkhā (to the anointed king, məšîḥô 2:2). Q, of the Messiah (al-masīḥ): subḥānahu an yakūna lahu waladun. HB has God declare sonship and 'begetting' of his anointed; Q flatly denies that God has a son."
      - with: hb-isa-42-servant-and-new-song
        motif: servant-song-gentle-servant
        refs: ["4:171", "4:172"]
        with_refs: ["Isa 42:1"]
        relation: echo
        note: "Isa: hēn ʿavdî ʾetmākh-bô ... nātattî rûḥî ʿālāyw (servant and spirit). Q: lan yastankifa l-masīḥu an yakūna ʿabdan li-llāhi, and Jesus as rūḥun minhu. Q calls the Messiah God's servant ('abd) who has a spirit from God, against deification."
      - with: hb-2sam-23-last-words-of-david
        motif: david-given-the-psalms
        refs: ["4:163"]
        with_refs: ["2Sam 23:1", "2Sam 23:2"]
        relation: echo
        note: "David as an inspired psalmist. Q: wa-ātaynā Dāwūda zabūran. 2Sam: nəʿîm zəmirôt Yiśrāʾēl; rûaḥ YHWH dibber-bî û-millātô ʿal-ləšônî. zabūr is often linked to Hebrew zəmīrāh/mizmôr (etymology disputed)."
  - unit: quran-4-kalala-ruling
    checked: [hb-num-27-zelophehad-joshua, hb-num-36-heiresses, hb-gen-25-jacob-esau-birth]
    matches:
      - with: hb-num-27-zelophehad-joshua
        motif: order-of-inheritance
        refs: ["4:176"]
        with_refs: ["Num 27:8", "Num 27:9", "Num 27:10", "Num 27:11"]
        relation: divergence
        note: "Inheritance of a man with no child. Num: ʾîš kî-yāmût û-vēn ʾên lô ... lə-vittô; wə-ʾim-ʾên lô bat ... lə-ʾeḥāyw, then the father's brothers and the nearest kin. Sisters are never named. Q: in imruʾun halaka laysa lahu waladun wa-lahu ukhtun fa-lahā niṣfu mā taraka: a sister takes half, two sisters two thirds, and mixed siblings share li-l-dhakari mithlu ḥaẓẓi l-unthayayn. Q gives fixed fractions; Num gives only an order of heirs."
      - with: hb-num-27-zelophehad-joshua
        motif: leader-awaits-oracle-on-case
        refs: ["4:176"]
        with_refs: ["Num 27:5", "Num 27:8"]
        relation: parallel
        note: "An inheritance question is put to the prophet and the answer comes from God. Num: wa-yyaqrēv Mōšeh ʾet-mišpāṭān lifnê YHWH, and God legislates (wə-ʾel-bənê Yiśrāʾēl tədabbēr). Q: yastaftūnaka quli llāhu yuftīkum fī l-kalāla."
  - unit: quran-5-contracts-food-laws
    checked: [hb-exod-22-apodictic-and-social-laws, hb-neh-10-sealed-covenant, hb-lev-7-guilt-peace-portions, hb-lev-3-peace-offering, hb-lev-17-blood-and-slaughter, hb-exod-34-thirteen-attributes-covenant-renewal, hb-lev-11-dietary-laws, hb-ezek-21-sword-oracles, hb-deut-16-festivals-judges, hb-1sam-21-nob-and-gath, hb-exod-23-justice-sabbatical-festivals]
    matches:
      - with: hb-exod-22-apodictic-and-social-laws
        motif: torn-meat-thrown-to-dogs
        refs: ["5:3", "5:4"]
        with_refs: ["Exod 22:30"]
        relation: divergence
        note: "Both forbid flesh torn by a beast: Q wa-mā akala l-sabuʿu illā mā dhakkaytum; Exod bāśār baś-śādeh ṭərēfāh lōʾ tōʾkhēlû. But the dog's role is reversed. Exod: lak-keleb tašlikhûn ʾōtô, the torn meat is thrown to the dogs. Q 5:4: what trained hunting animals (mukallibīna, 'training them as dogs') catch for you is lawful: fa-kulū mimmā amsakna ʿalaykum."
      - with: hb-lev-17-blood-and-slaughter
        motif: hunted-animal-blood-covered-with-earth
        refs: ["5:4"]
        with_refs: ["Lev 17:13"]
        relation: divergence
        note: "Game may be eaten if a rite is performed over it, but the rites differ. Lev: ʾăšer yāṣûd ṣêd ḥayyāh ʾô-ʿôf ... wə-šāfakh ʾet-dāmô wə-khissāhû beʿāfār (pour out and cover the blood). Q: fa-kulū mimmā amsakna ʿalaykum wa-dhkurū sma llāhi ʿalayhi (pronounce God's name)."
      - with: hb-lev-17-blood-and-slaughter
        motif: eating-carrion-requires-washing
        refs: ["5:3"]
        with_refs: ["Lev 17:15"]
        relation: divergence
        note: "Lev: wə-khol-nefeš ʾăšer tōʾkhal nəvēlāh û-ṭərēfāh ... wə-khibbes bəgādāyw wə-rāḥaṣ bam-mayim wə-ṭāmēʾ ʿad-hāʿerev. Eating carrion or torn meat makes one impure and requires washing. Q forbids both outright (al-maytatu ... wa-mā akala l-sabuʿu) and lets the forbidden be eaten only under compulsion (fa-mani ḍṭurra fī makhmaṣatin)."
      - with: hb-lev-7-guilt-peace-portions
        motif: prohibition-of-eating-blood
        refs: ["5:3"]
        with_refs: ["Lev 7:24", "Lev 7:26", "Lev 7:27"]
        relation: parallel
        note: "Q: ḥurrimat ʿalaykumu l-maytatu wa-l-damu. Lev: wə-khol-dām lōʾ tōʾkhəlû ... lā-ʿôf wə-lab-bəhēmāh; ḥēlev nəvēlāh wə-ḥēlev ṭərēfāh ... wə-ʾākhōl lōʾ tōʾkhəluhû. Lev forbids only the fat of carrion and torn animals; Q forbids the whole animal."
      - with: hb-lev-3-peace-offering
        motif: prohibition-of-eating-blood
        refs: ["5:3"]
        with_refs: ["Lev 3:17"]
        relation: parallel
        note: "Lev: ḥuqqat ʿôlām ... kol-ḥēlev wə-khol-dām lōʾ tōʾkhēlû. Q 5:3 al-damu forbidden; Q keeps blood but has no ban on fat (contrast Q 6:146, where fat is forbidden to the Jews)."
      - with: hb-lev-11-dietary-laws
        motif: pork-forbidden
        refs: ["5:3"]
        with_refs: ["Lev 11:7"]
        relation: parallel
        note: "Q: wa-laḥmu l-khinzīri. Lev: wə-ʾet-ha-ḥăzîr ... ṭāmēʾ hûʾ lākhem. Q gives no reason; Lev reasons from hoof and cud (mafrîs parsāh ... gērāh lōʾ-yiggār)."
      - with: hb-ezek-21-sword-oracles
        motif: belomancy-arrow-divination
        refs: ["5:3"]
        with_refs: ["Ezek 21:26"]
        relation: echo
        note: "The same root q-s-m and the same technique. Q: wa-an tastaqsimū bi-l-azlāmi dhālikum fisqun (seeking a decision by divining arrows). Ezek: liqsom-qāsem qilqal ba-ḥiṣṣîm šāʾal bat-tərāfîm rāʾāh bak-kāvēd, the king of Babylon at the crossroads. Both condemn it."
      - with: hb-deut-16-festivals-judges
        motif: no-asherah-or-pillar-by-altar
        refs: ["5:3"]
        with_refs: ["Deut 16:22"]
        relation: echo
        note: "The cognate root n-ṣ-b for cultic standing stones. Q: wa-mā dhubiḥa ʿalā l-nuṣubi (what is slaughtered on the standing stones). Deut: wə-lōʾ-tāqîm ləkhā maṣṣēvāh ʾăšer śānēʾ YHWH."
      - with: hb-1sam-21-nob-and-gath
        motif: holy-bread-given-to-fugitive
        refs: ["5:3"]
        with_refs: ["1Sam 21:5", "1Sam 21:7"]
        relation: echo
        note: "Need overrides a food prohibition. Q: fa-mani ḍṭurra fī makhmaṣatin ghayra mutajānifin li-ithmin fa-inna llāha ghafūrun raḥīmun. 1Sam: ʾên leḥem ḥōl ... kî ʾim-leḥem qōdeš; the priest gives the hungry fugitive the leḥem hap-pānîm. Q makes it a general rule (hunger, makhmaṣa); 1Sam is one case, with a purity condition (ʾakh mē-ʾiššāh)."
      - with: hb-exod-34-thirteen-attributes-covenant-renewal
        motif: no-intermarriage-with-nations
        refs: ["5:5"]
        with_refs: ["Exod 34:15", "Exod 34:16"]
        relation: contrast
        note: "Opposite rulings on eating with and marrying outsiders. Exod: pen-tikhrōt bərît ... wə-qārāʾ ləkhā wə-ʾākhaltā mi-zzivḥô; wə-lāqaḥtā mib-bənōtāyw lə-vānêkhā wə-zānû ... ʾaḥărê ʾĕlōhêhen. Q: wa-ṭaʿāmu lladhīna ūtū l-kitāba ḥillun lakum ... wa-l-muḥṣanātu mina lladhīna ūtū l-kitāba, so their food is lawful and their chaste women may be married. The HB ban concerns the Canaanites; Q's permission concerns the People of the Book."
      - with: hb-neh-10-sealed-covenant
        motif: no-intermarriage-with-nations
        refs: ["5:5"]
        with_refs: ["Neh 10:31"]
        relation: contrast
        note: "Neh: wa-ʾăšer lōʾ-nittēn bənōtênû lə-ʿammê hā-ʾāreṣ wə-ʾet-bənōtêhem lōʾ niqqaḥ lə-vānênû, a sworn pledge (bāʾîm bə-ʾālāh û-vi-šəvûʿāh, 10:30). Q 5:5 opens marriage to chaste women of 'those given the Book before you'."
      - with: hb-exod-23-justice-sabbatical-festivals
        motif: hatred-must-not-pervert-justice
        refs: ["5:2"]
        with_refs: ["Exod 23:4", "Exod 23:5"]
        relation: echo
        note: "The cognate root ś-n-ʾ / sh-n-ʾ for enmity. Q: wa-lā yajrimannakum shanaʾānu qawmin an ṣaddūkum ʿani l-masjidi l-ḥarāmi an taʿtadū. Exod: kî-tirʾeh ḥămôr śōnaʾăkhā rōvēṣ ... ʿāzōv taʿăzōv ʿimmô; a duty toward the one who hates you."
  - unit: quran-5-ablution-covenant-justice
    checked: [hb-exod-30-incense-altar-census-laver, hb-exod-40-tabernacle-erected-glory-fills, hb-exod-24-covenant-ratification, hb-ps-141-prayer-as-incense, hb-deut-28-blessings-curses, hb-isa-25-banquet-and-death-swallowed, hb-lev-15-genital-discharges, hb-exod-23-justice-sabbatical-festivals]
    matches:
      - with: hb-exod-30-incense-altar-census-laver
        motif: bronze-laver-for-washing-hands-and-feet
        refs: ["5:6"]
        with_refs: ["Exod 30:19", "Exod 30:20", "Exod 30:21"]
        relation: divergence
        note: "Washing hands and feet before approaching God. Exod: wə-rāḥăṣû ʾAhărōn û-vānāyw mimmennû ʾet-yədêhem wə-ʾet-raglêhem ... wə-lōʾ yāmutû, for priests entering the tent, on pain of death. Q: idhā qumtum ilā l-ṣalāti fa-ghsilū wujūhakum wa-aydiyakum ilā l-marāfiqi ... wa-arjulakum ilā l-kaʿbayn, for every believer before each prayer. Q adds the face and wiping the head, and gives the reason as relief (mā yurīdu llāhu li-yajʿala ʿalaykum min ḥarajin), not the threat of death."
      - with: hb-exod-40-tabernacle-erected-glory-fills
        motif: bronze-laver-for-washing-hands-and-feet
        refs: ["5:6"]
        with_refs: ["Exod 40:31", "Exod 40:32"]
        relation: echo
        note: "Exod: wə-rāḥăṣû mimmennû Mōšeh wə-ʾAhărōn û-vānāyw ʾet-yədêhem wə-ʾet-raglêhem bə-vōʾām ʾel-ʾōhel môʿēd. Q 5:6 washing face, hands and feet idhā qumtum ilā l-ṣalāti."
      - with: hb-lev-15-genital-discharges
        motif: seminal-emission-impurity-until-evening
        refs: ["5:6"]
        with_refs: ["Lev 15:16", "Lev 15:18"]
        relation: parallel
        note: "Sexual impurity requires a full wash. Q: wa-in kuntum junuban fa-ṭṭahharū ... aw lāmastumu l-nisāʾa. Lev: wə-rāḥaṣ bam-mayim ʾet-kol-bəśārô; wə-ʾiššāh ʾăšer yiškav ʾîš ʾōtāh ... wə-rāḥăṣû vam-mayim. Q adds the waterless substitute (fa-tayammamū ṣaʿīdan ṭayyiban) and drops 'unclean until evening'."
      - with: hb-exod-24-covenant-ratification
        motif: people-accept-covenant-we-will-do
        refs: ["5:7"]
        with_refs: ["Exod 24:7"]
        relation: parallel
        note: "Covenant assent formula. Q: wa-mīthāqahu lladhī wāthaqakum bihi idh qultum samiʿnā wa-aṭaʿnā (addressed to the believers). Exod: kōl ʾăšer-dibber YHWH naʿăśeh wə-nišmāʿ. The pledge passes from Israel at Sinai to the new community. Contrast Q 4:46 samiʿnā wa-ʿaṣaynā."
      - with: hb-exod-23-justice-sabbatical-festivals
        motif: hatred-must-not-pervert-justice
        refs: ["5:8"]
        with_refs: ["Exod 23:5", "Exod 23:6", "Exod 23:7"]
        relation: echo
        note: "Q: wa-lā yajrimannakum shanaʾānu qawmin ʿalā allā taʿdilū iʿdilū. Exod: ḥămôr śōnaʾăkhā ... lōʾ taṭṭeh mišpaṭ ʾevyōnəkhā bə-rîvô. Both have justice and help owed to one who hates you; the root is cognate (ś-n-ʾ / sh-n-ʾ)."
  - unit: quran-5-covenant-twelve-chiefs
    checked: [hb-prov-19-sayings, hb-num-32-transjordan-tribes, hb-num-21-sihon-og, hb-ezek-20-history-of-rebellion, hb-ps-44-national-lament, hb-jer-33-branch-and-cosmic-covenant, hb-num-13-spies, hb-deut-14-diet-tithe, hb-ezek-2-3-commission-eaten-scroll, hb-deut-4-exhortation]
    matches:
      - with: hb-prov-19-sayings
        motif: lending-to-yhwh-by-giving-to-poor
        refs: ["5:12"]
        with_refs: ["Prov 19:17"]
        relation: parallel
        note: "Q: wa-aqraḍtumu llāha qarḍan ḥasanan la-ukaffiranna ʿankum sayyiʾātikum (a loan to God repaid with forgiveness and paradise). Prov: malwēh YHWH ḥônēn dāl û-gəmulô yəšallem-lô. Prov repays the loan to the poor; Q lists the loan among covenant terms with prayer and zakāt."
      - with: hb-num-13-spies
        motif: twelve-chieftains-of-israel
        refs: ["5:12"]
        with_refs: ["Num 13:2", "Num 13:3"]
        relation: parallel
        note: "Q: wa-baʿathnā minhumu thnay ʿashara naqīban (twelve chiefs 'sent/raised'). Num: šəlaḥ-ləkhā ʾănāšîm ... ʾîš ʾeḥād ʾîš ʾeḥād lə-maṭṭēh ʾăvōtāyw ... kōl nāśîʾ vāhem. One chief per tribe. In Q they are tied to taking the covenant, not to scouting."
      - with: hb-deut-14-diet-tithe
        motif: children-of-god-israel
        refs: ["5:18"]
        with_refs: ["Deut 14:1"]
        relation: response
        note: "Deut: bānîm ʾattem la-YHWH ʾĕlōhêkhem. Q quotes the claim and rejects it: wa-qālati l-yahūdu wa-l-naṣārā naḥnu abnāʾu llāhi wa-aḥibbāʾuhu qul fa-lima yuʿadhdhibukum bi-dhunūbikum bal antum basharun mimman khalaqa."
      - with: hb-ezek-2-3-commission-eaten-scroll
        motif: hearts-made-hard
        refs: ["5:13"]
        with_refs: ["Ezek 3:7"]
        relation: echo
        note: "The cognate root q-s-w / q-š-h for a hard heart. Q: wa-jaʿalnā qulūbahum qāsiyatan. Ezek: kî kol-bêt Yiśrāʾēl ḥizqê-mēṣaḥ û-qəšê-lēv hēmmāh. In Q God makes the hearts hard as a penalty for breaking the covenant (fa-bi-mā naqḍihim mīthāqahum)."
      - with: hb-deut-4-exhortation
        motif: forgot-part-of-reminder
        refs: ["5:13", "5:14"]
        with_refs: ["Deut 4:9", "Deut 4:23"]
        relation: echo
        note: "Deut warns pen-tiškaḥ ʾet-had-dəvārîm; pen-tiškəḥû ʾet-bərît YHWH. Q reports it as done: wa-nasū ḥaẓẓan mimmā dhukkirū bihi, of Jews and then Christians (alladhīna qālū innā naṣārā)."
  - unit: quran-5-holy-land-refusal
    checked: [hb-num-13-spies, hb-num-14-rebellion-verdict, hb-deut-1-spies-retold, hb-josh-5-circumcision-passover-commander, hb-ezek-20-history-of-rebellion, hb-ezek-37-two-sticks, hb-exod-19-sinai-theophany]
    matches:
      - with: hb-num-13-spies
        motif: giants-in-the-land
        refs: ["5:22"]
        with_refs: ["Num 13:28", "Num 13:33"]
        relation: parallel
        note: "Q: inna fīhā qawman jabbārīna wa-innā lan nadkhulahā ḥattā yakhrujū minhā. Num: ʿaz hā-ʿām ... wə-gam yəlidê hā-ʿănāq rāʾînû šām; ha-nnəfîlîm bənê ʿănāq. Q drops the spies' report and the names: the people state the fear directly."
      - with: hb-num-14-rebellion-verdict
        motif: minority-faithful-report
        refs: ["5:23"]
        with_refs: ["Num 14:6", "Num 14:7", "Num 14:8", "Num 14:9"]
        relation: divergence
        note: "Num names Yəhôšuaʿ bin-Nûn wə-Khālēv ben-Yəfunneh, who tear their garments and say YHWH ʾittānû ʾal-tîrāʾum. Q has only rajulāni mina lladhīna yakhāfūna (unnamed). Their advice is tactical, udkhulū ʿalayhimu l-bāba fa-idhā dakhaltumūhu fa-innakum ghālibūna, and ends wa-ʿalā llāhi fa-tawakkalū."
      - with: hb-num-13-spies
        motif: minority-faithful-report
        refs: ["5:23"]
        with_refs: ["Num 13:30"]
        relation: parallel
        note: "Num: ʿālōh naʿăleh wə-yāraš-nû ʾōtāh kî-yākhôl nûkhal lāh. Q: fa-idhā dakhaltumūhu fa-innakum ghālibūna. The confident 'we shall prevail' in both."
      - with: hb-deut-1-spies-retold
        motif: go-you-and-your-lord-and-fight
        refs: ["5:24"]
        with_refs: ["Deut 1:26", "Deut 1:30"]
        relation: divergence
        note: "Deut: Moses' assurance YHWH ʾĕlōhêkhem ha-hōlēkh lifnêkhem hûʾ yillāḥēm lākhem, against the people's refusal wə-lōʾ ʾăvîtem laʿălōt. In Q the people turn the assurance into mockery: fa-dhhab anta wa-rabbuka fa-qātilā innā hāhunā qāʿidūna. 'God will fight for you' becomes 'you and your Lord go and fight'."
      - with: hb-num-14-rebellion-verdict
        motif: prophet-intercedes-for-people
        refs: ["5:25"]
        with_refs: ["Num 14:5", "Num 14:12", "Num 14:13", "Num 14:19"]
        relation: divergence
        note: "A reversal. In Num God offers to destroy the people (ʾakkennû vad-dever ... wə-ʾeʿĕśeh ʾōtəkhā lə-gôy gādôl), and Moses intercedes (səlaḥ-nāʾ la-ʿăwōn hā-ʿām ha-zzeh). In Q Moses himself asks for separation: rabbi innī lā amliku illā nafsī wa-akhī fa-fruq baynanā wa-bayna l-qawmi l-fāsiqīna. There is no intercession; Aaron appears only as 'my brother'."
      - with: hb-num-14-rebellion-verdict
        motif: forty-years-wandering
        refs: ["5:26"]
        with_refs: ["Num 14:33", "Num 14:34"]
        relation: divergence
        note: "Num: arbāʿîm šānāh, a year for each day of scouting (yôm laš-šānāh), until the corpses fall (ʿad-tōm pigrêkhem bam-midbār). Q: fa-innahā muḥarramatun ʿalayhim arbaʿīna sanatan yatīhūna fī l-arḍ. Q drops the day-for-a-year reckoning and the deaths of the generation, and God tells Moses fa-lā taʾsa ʿalā l-qawmi l-fāsiqīna."
      - with: hb-exod-19-sinai-theophany
        motif: kingdom-of-priests
        refs: ["5:20"]
        with_refs: ["Exod 19:5", "Exod 19:6"]
        relation: divergence
        note: "Exod: wə-ʾattem tihyû-lî mamlekhet kōhănîm wə-gôy qādôš ... səgullāh mik-kol-hā-ʿammîm. Q: idh jaʿala fīkum anbiyāʾa wa-jaʿalakum mulūkan wa-ātākum mā lam yuʾti aḥadan mina l-ʿālamīna. 'Kingdom of priests' becomes 'prophets among you, and made you kings'. Priests drop out; the election is kept (mā lam yuʾti aḥadan)."
  - unit: quran-5-two-sons-of-adam
    checked: [hb-gen-4-cain-abel, hb-jer-8-stork-and-lying-pen, hb-gen-9-noahide-covenant, hb-isa-59-sins-separate-divine-warrior, hb-exod-4-signs-aaron-bridegroom-of-blood]
    matches:
      - with: hb-gen-4-cain-abel
        motif: offering-accepted-rejected
        refs: ["5:27"]
        with_refs: ["Gen 4:3", "Gen 4:4", "Gen 4:5"]
        relation: divergence
        note: "Gen names Qayin and Hevel, specifies the gifts (pərî hā-ʾădāmāh against bəkhōrôt ṣōʾnô û-mē-ḥelvēhen), and gives no reason for God's choice (wa-yyišaʿ ... lōʾ šāʿāh). Q: the brothers are unnamed (ibnay Ādama), the gifts unspecified (qarrabā qurbānan), and the reason is spoken by the victim: innamā yataqabbalu llāhu mina l-muttaqīna."
      - with: hb-gen-4-cain-abel
        motif: sin-crouching-at-door
        refs: ["5:28", "5:29", "5:30"]
        with_refs: ["Gen 4:6", "Gen 4:7"]
        relation: divergence
        note: "A change of speaker. In Gen, God warns Cain before the murder: lāmmāh ḥārāh lākh ... lap-petaḥ ḥaṭṭāʾt rōvēṣ wə-ʾēlêkhā təšûqātô wə-ʾattāh timšol-bô. In Q God is silent and the victim gives the warning: laʾin basaṭta ilayya yadaka ... mā ana bi-bāsiṭin yadiya ilayka ... innī akhāfu llāha rabba l-ʿālamīna. The crouching desire comes back as fa-ṭawwaʿat lahu nafsuhu qatla akhīhi."
      - with: hb-gen-4-cain-abel
        motif: first-murder-fratricide
        refs: ["5:27", "5:30"]
        with_refs: ["Gen 4:8"]
        relation: divergence
        note: "MT: wa-yyōʾmer Qayin ʾel-Hevel ʾāḥîw, with the speech missing, then wa-yyāqom ... wa-yyahargēhû. Q supplies the dialogue: qāla la-aqtulannaka, and Abel's reply. Then fa-qatalahu fa-aṣbaḥa mina l-khāsirīna. cf. (not a match) Targum Neofiti and Pseudo-Jonathan Gen 4:8, which also supply a dispute in the field."
      - with: hb-gen-4-cain-abel
        motif: earth-opens-mouth-to-receive-blood
        refs: ["5:31"]
        with_refs: ["Gen 4:10", "Gen 4:11"]
        relation: divergence
        note: "What the earth does differs. Gen: the ground opens its mouth to take the blood, and the blood cries out (qôl dəmê ʾāḥîkhā ṣōʿăqîm ʾēlay min-hā-ʾădāmāh ... ʾăšer pāṣətāh ʾet-pîhā), so the crime is exposed. Q: God sends a raven digging in the earth (ghurāban yabḥathu fī l-arḍi) to show how to hide (yuwārī) the brother's corpse (sawʾata akhīhi). Gen has no burial; Q has no interrogation ('ê Hevel), curse, wandering or mark. cf. (not a match) Pirqe de-Rabbi Eliezer 21 (raven and burial)."
      - with: hb-gen-4-cain-abel
        motif: murderer-condemned-to-wander
        refs: ["5:31"]
        with_refs: ["Gen 4:13", "Gen 4:14"]
        relation: divergence
        note: "The murderer's lament. Gen: gādôl ʿăwōnî minnəśōʾ ... nāʿ wā-nād, a complaint about the punishment. Q: yā waylatā aʿajaztu an akūna mithla hādhā l-ghurābi fa-uwāriya sawʾata akhī fa-aṣbaḥa mina l-nādimīna, shame at being outdone by a raven, and remorse. Q has no punishment on earth; it ends in remorse."
      - with: hb-gen-9-noahide-covenant
        motif: bloodshed-requires-bloodshed
        refs: ["5:32"]
        with_refs: ["Gen 9:5", "Gen 9:6"]
        relation: divergence
        note: "Both state the worth of a single human life. Gen: šōfēkh dam hā-ʾādām bā-ʾādām dāmô yiššāfēkh kî bə-ṣelem ʾĕlōhîm ʿāśāh ʾet-hā-ʾādām; one life for one, grounded in the image of God. Q: man qatala nafsan bi-ghayri nafsin aw fasādin fī l-arḍi fa-ka-annamā qatala l-nāsa jamīʿan wa-man aḥyāhā fa-ka-annamā aḥyā l-nāsa jamīʿan, and it is 'written for the Children of Israel'. cf. (not a match) m. Sanhedrin 4:5, derived from dəmê (plural) in Gen 4:10."
      - with: hb-jer-8-stork-and-lying-pen
        motif: no-one-repents-what-have-i-done
        refs: ["5:31"]
        with_refs: ["Jer 8:6"]
        relation: contrast
        note: "Jer: ʾên ʾîš niḥām ʿal-rāʿātô lēʾmōr meh ʿāśîtî kullōh šāv bi-mrûṣātām kə-sûs šôṭēf. Q: the first murderer does lament, yā waylatā ... fa-aṣbaḥa mina l-nādimīn. Jer's 'no one repents' is the reverse of the Quranic Cain, who regrets (niḥām / nadima)."
  - unit: quran-5-war-on-god-theft
    checked: [hb-exod-21-bodily-injury, hb-exod-22-property-laws, hb-ps-49-no-ransom, hb-2sam-4-ishbosheth-murdered, hb-isa-59-sins-separate-divine-warrior, hb-job-34-elihu-defends-gods-justice, hb-zeph-1-day-of-wrath]
    matches:
      - with: hb-exod-22-property-laws
        motif: double-restitution
        refs: ["5:38"]
        with_refs: ["Exod 22:2", "Exod 22:3"]
        relation: contrast
        note: "Opposite penalties for theft. Exod: šallēm yəšallēm ʾim-ʾên lô wə-nimkar bi-gnēvātô; ... ḥayyîm šənayim yəšallēm: the thief pays double and is sold if he cannot pay. Q: wa-l-sāriqu wa-l-sāriqatu fa-qṭaʿū aydiyahumā jazāʾan bi-mā kasabā nakālan mina llāhi: hand amputation for male and female thief, with repentance after (5:39)."
      - with: hb-exod-21-bodily-injury
        motif: fivefold-fourfold-restitution-for-stolen-livestock
        refs: ["5:38"]
        with_refs: ["Exod 21:37"]
        relation: contrast
        note: "Exod: ḥămiššāh vāqār yəšallēm taḥat haš-šôr wə-ʾarbaʿ-ṣōʾn taḥat haś-śeh, restitution scaled to the theft. Q 5:38: fa-qṭaʿū aydiyahumā, corporal punishment in place of compensation."
      - with: hb-2sam-4-ishbosheth-murdered
        motif: hands-and-feet-cut-off-hung
        refs: ["5:33"]
        with_refs: ["2Sam 4:12"]
        relation: parallel
        note: "Q: an yuqattalū aw yuṣallabū aw tuqaṭṭaʿa aydīhim wa-arjuluhum min khilāfin. 2Sam: wa-yyahargûm wa-yqaṣṣəṣû ʾet-yədêhem wə-ʾet-raglêhem wa-yyitlû ʿal-hab-bərēkhāh. Hands and feet cut off and the body exposed. In 2Sam it is the king's one-off sentence on assassins; in Q a standing law for those who wage war on God and his Messenger, with 'opposite sides' and an alternative of exile (yunfaw)."
      - with: hb-ps-49-no-ransom
        motif: no-ransom-for-a-brother
        refs: ["5:36"]
        with_refs: ["Ps 49:8", "Ps 49:9"]
        relation: parallel
        note: "The cognate root f-d-y / p-d-h. Q: law anna lahum mā fī l-arḍi jamīʿan wa-mithlahu maʿahu li-yaftadū bihi min ʿadhābi yawmi l-qiyāmati mā tuqubbila minhum. Ps: ʾāḥ lōʾ-fādōh yifdeh ʾîš lōʾ-yittēn lē-ʾlōhîm kofrô wə-yēqar pidyôn nafšām. In Ps the ransom cannot be paid for death; in Q not for the punishment of the day of resurrection."
      - with: hb-zeph-1-day-of-wrath
        motif: silver-gold-cannot-save-on-day-of-wrath
        refs: ["5:36"]
        with_refs: ["Zeph 1:18"]
        relation: echo
        note: "Zeph: gam-kaspām gam-zəhāvām lōʾ-yûkhal ləhaṣṣîlām bə-yôm ʿebrat YHWH. Q: mā fī l-arḍi jamīʿan wa-mithlahu maʿahu ... mā tuqubbila minhum. Wealth cannot buy rescue on the day of wrath or of resurrection."
  - unit: quran-5-torah-gospel-judgment
    checked: [hb-exod-21-bodily-injury, hb-lev-24-lamp-bread-blasphemer, hb-deut-19-refuge-witnesses, hb-deut-31-joshua-torah-song, hb-isa-8-maher-shalal-and-stone-of-stumbling, hb-isa-1-indictment-of-judah, hb-prov-6-adultery-fire]
    matches:
      - with: hb-exod-21-bodily-injury
        motif: eye-for-eye
        refs: ["5:45"]
        with_refs: ["Exod 21:23", "Exod 21:24", "Exod 21:25"]
        relation: divergence
        note: "Q quotes the talion as written in the Torah (wa-katabnā ʿalayhim fīhā) but changes the list. Q: al-nafsa bi-l-nafsi wa-l-ʿayna bi-l-ʿayni wa-l-anfa bi-l-anfi wa-l-udhuna bi-l-udhuni wa-l-sinna bi-l-sinni wa-l-jurūḥa qiṣāṣun. Exod: nefeš taḥat nāfeš ʿayin taḥat ʿayin šēn taḥat šēn yād ... regel ... kəviyyāh ... peṣaʿ taḥat pāṣaʿ ḥabbûrāh. Q adds nose and ear, drops hand, foot, burn and bruise, and sums up the rest as jurūḥ (= peṣaʿ). Exod's taḥat ('in place of') becomes Q's bi-."
      - with: hb-deut-19-refuge-witnesses
        motif: eye-for-eye
        refs: ["5:45"]
        with_refs: ["Deut 19:21"]
        relation: contrast
        note: "Opposite instructions on mercy. Deut: wə-lōʾ tāḥôs ʿênekhā nefeš bə-nefeš ʿayin bə-ʿayin, 'your eye shall not pity' (same preposition bə- as Q's bi-). Q: fa-man taṣaddaqa bihi fa-huwa kaffāratun lahu, waiving retaliation is charity and expiation for the one who waives."
      - with: hb-lev-24-lamp-bread-blasphemer
        motif: eye-for-eye
        refs: ["5:45"]
        with_refs: ["Lev 24:17", "Lev 24:20"]
        relation: echo
        note: "Lev: šever taḥat šever ʿayin taḥat ʿayin šēn taḥat šēn kaʾăšer yittēn mûm bā-ʾādām kēn yinnāten bô, a shorter list. Q 5:45 shares only nafs (Lev 24:17), ʿayn and sinn."
      - with: hb-deut-31-joshua-torah-song
        motif: book-placed-beside-ark
        refs: ["5:44"]
        with_refs: ["Deut 31:9", "Deut 31:26"]
        relation: parallel
        note: "Guardians of the written Torah act as its witnesses. Q: wa-l-rabbāniyyūna wa-l-aḥbāru bi-mā stuḥfiẓū min kitābi llāhi wa-kānū ʿalayhi shuhadāʾa. Deut: Moses gives the Torah to ha-kkōhănîm bənê Lēwî; lāqōaḥ ʾēt sēfer hat-tôrāh ... wə-hāyāh šām bəkhā lə-ʿēd. In Deut the book itself is the witness (ʿēd); in Q the custodians are (shuhadāʾ)."
      - with: hb-prov-6-adultery-fire
        motif: commandment-lamp-torah-light
        refs: ["5:44"]
        with_refs: ["Prov 6:23"]
        relation: echo
        note: "Q: innā anzalnā l-tawrāta fīhā hudan wa-nūrun. Prov: kî nēr miṣwāh wə-tôrāh ʾôr. In Prov, tôrāh is a parent's teaching (6:20); Q means the revealed Torah."
      - with: hb-isa-1-indictment-of-judah
        motif: bribe-blinds-the-wise
        refs: ["5:42"]
        with_refs: ["Isa 1:23"]
        relation: echo
        note: "Judges and leaders who live on illicit gain. Q: sammāʿūna li-l-kadhibi akkālūna li-l-suḥti (suḥt, classically bribes). Isa: śārayikh sôrərîm wə-ḥavrê gannāvîm kullô ʾōhēv šōḥad wə-rōdēf šalmōnîm."
  - unit: quran-5-allies-mockery
    checked: [hb-exod-20-decalogue, hb-hos-4-lawsuit-priests, hb-isa-65-rebels-and-servants, hb-1sam-3-call-of-samuel]
