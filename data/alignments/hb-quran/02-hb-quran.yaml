# Side-by-side comparison, HB x Quran, chunk 2 (Q 4:44 - 7:141).
new_motifs:
  sabbath-violation-punished: {label: "Those who violate the Sabbath are punished (executed, cut off, cursed or transformed)", cluster: law}
  people-balk-at-fighting: {label: "People ordered to fight complain to God and wish to be spared the battle", cluster: warfare}
  hearts-made-hard: {label: "The people's hearts are called hard (Arabic q-s-w, Hebrew q-sh-h), or God makes them so", cluster: theology}
reviewed:
  - unit: quran-4-people-of-book-distortion
    checked: [hb-exod-24-covenant-ratification, hb-deut-5-decalogue, hb-exod-19-sinai-theophany, hb-amos-5-lament-day-of-yhwh, hb-zeph-1-day-of-wrath, hb-deut-33-blessing-of-moses, hb-exod-31-bezalel-sabbath-tablets, hb-prov-20-sayings, hb-josh-24-shechem-covenant, hb-gen-17-covenant-of-circumcision]
    matches:
      - with: hb-deut-5-decalogue
        motif: we-hear-and-disobey
        refs: ["4:46"]
        with_refs: ["Deut 5:27"]
        relation: response
        note: "Q samiʿnā wa-ʿaṣaynā ('we hear and we disobey') against the people's pledge at Horeb wə-šāmaʿnû wə-ʿāśînû ('we will hear and do'); Arabic ʿaṣaynā sounds like Hebrew ʿāśînû. Q also gives the correct form, samiʿnā wa-aṭaʿnā. cf. (not a match) b. Shabbat 88a and the Targum tradition of the pun."
      - with: hb-exod-24-covenant-ratification
        motif: people-accept-covenant-we-will-do
        refs: ["4:46"]
        with_refs: ["Exod 24:7", "Exod 24:3"]
        relation: divergence
        note: "Exod 24:7 kōl ʾăšer-dibber YHWH naʿăśeh wə-nišmāʿ, the people's assent, comes back in Q 4:46 as the opposite, samiʿnā wa-ʿaṣaynā, put in the mouth of 'those who are Jews' (alladhīna hādū). Hearing is kept and doing becomes disobeying."
      - with: hb-exod-19-sinai-theophany
        motif: people-accept-covenant-we-will-do
        refs: ["4:46"]
        with_refs: ["Exod 19:8"]
        relation: echo
        note: "Exod 19:8 wayyaʿănû kol-hāʿām yaḥdāw ... naʿăśeh; Q 4:46 has the people's answer as samiʿnā wa-ʿaṣaynā, with samiʿnā wa-aṭaʿnā as what they should have said."
      - with: hb-exod-31-bezalel-sabbath-tablets
        motif: sabbath-violation-punished
        refs: ["4:47"]
        with_refs: ["Exod 31:14"]
        relation: divergence
        note: "HB: məḥalləlêhā môt yûmāt ... wə-nikhrətāh ha-nefeš (execution by the community and being 'cut off'). Q: aw nalʿanahum kamā laʿannā aṣḥāba l-sabt, a curse by God (and transformation into apes, 2:65 and 5:60). No HB story tells of a transformation."
      - with: hb-prov-20-sayings
        motif: self-praise-of-purity-rebuked
        refs: ["4:49"]
        with_refs: ["Prov 20:9"]
        relation: echo
        note: "Both use the same root z-k-y/z-k-h for self-purification. Q: alladhīna yuzakkūna anfusahum bali llāhu yuzakkī man yashāʾ. Prov: mî yōʾmar zikkîtî libbî ṭāhartî mē-ḥaṭṭāʾtî ('who can say: I have made my heart pure')."
      - with: hb-josh-24-shechem-covenant
        motif: idolatry-unforgivable
        refs: ["4:48"]
        with_refs: ["Josh 24:19", "Josh 24:20"]
        relation: echo
        note: "Q: inna llāha lā yaghfiru an yushraka bihi. Josh: lōʾ yiśśāʾ lə-pišʿăkem ... kî taʿazbû ʾet-YHWH wa-ʿăbadtem ʾĕlōhê nēkār, where the jealous God will not forgive serving foreign gods. Q limits the unforgivable to shirk and forgives 'what is less than that'."
      - with: hb-gen-17-covenant-of-circumcision
        motif: kings-will-descend-from-patriarch
        refs: ["4:54"]
        with_refs: ["Gen 17:6"]
        relation: echo
        note: "Q: fa-qad ātaynā āla Ibrāhīma l-kitāba wa-l-ḥikmata wa-ātaynāhum mulkan ʿaẓīman. Gen: û-məlākhîm mimməkā yēṣēʾû. Kingship promised to Abraham's line; Q adds book and wisdom."
  - unit: quran-4-trusts-obedience
    checked: [hb-exod-32-tablets-broken-levites, hb-deut-9-golden-calf-recalled, hb-jer-24-two-baskets-figs, hb-isa-1-indictment-of-judah, hb-jer-27-yoke-bars, hb-deut-17-courts-king, hb-lev-5-graduated-and-guilt-offerings]
    matches:
      - with: hb-exod-32-tablets-broken-levites
        motif: levites-kill-idolaters-kin
        refs: ["4:66"]
        with_refs: ["Exod 32:27", "Exod 32:28", "Exod 32:29"]
        relation: divergence
        note: "HB command, carried out: hirgû ʾîš ʾet-ʾāḥîw ... wayyaʿăśû bənê-lēwî, about 3,000 die and the Levites are ordained by it. Q makes it hypothetical: law annā katabnā ʿalayhim ani qtulū anfusakum aw ukhrujū min diyārikum mā faʿalūhu illā qalīlun minhum, and the point becomes how few would obey. cf. Q 2:54, where the command is given."
      - with: hb-deut-9-golden-calf-recalled
        motif: prophet-intercedes-for-people
        refs: ["4:64"]
        with_refs: ["Deut 9:18", "Deut 9:19", "Deut 9:26"]
        relation: parallel
        note: "Q: wa-staghfara lahumu l-rasūlu la-wajadū llāha tawwāban raḥīman (the Messenger's prayer for forgiveness after they wronged themselves). Deut: wāʾetnappal lifnê YHWH ... wayyišmaʿ YHWH ʾēlay gam bappaʿam hahiwʾ (Moses' intercession after the calf)."
      - with: hb-deut-17-courts-king
        motif: supreme-court-at-sanctuary
        refs: ["4:59", "4:65"]
        with_refs: ["Deut 17:8", "Deut 17:9", "Deut 17:10", "Deut 17:11", "Deut 17:12"]
        relation: parallel
        note: "Disputes are referred upward and the verdict is accepted. Q: fa-in tanāzaʿtum fī shayʾin fa-ruddūhu ilā llāhi wa-l-rasūl; ḥattā yuḥakkimūka fīmā shajara baynahum thumma lā yajidū ... ḥarajan mimmā qaḍayta. Deut: kî yippālēʾ mimməkā dābār lammišpāṭ ... dibrê rîbōt ... ʿal-pî ha-tôrāh ... lōʾ tāsûr. The authority differs: the Levitical priests and judge at the chosen place against God, the Messenger and ulū l-amr (4:59; cf. 4:83 in the next unit)."
      - with: hb-lev-5-graduated-and-guilt-offerings
        motif: return-trusts-to-owners
        refs: ["4:58"]
        with_refs: ["Lev 5:21", "Lev 5:23"]
        relation: parallel
        note: "Q: an tuʾaddū l-amānāti ilā ahlihā. Lev: wə-kiḥēš ba-ʿămîtô bə-fiqqādôn ... wə-hēšîb ... ʾet-ha-piqqādôn ʾăšer hopqad ʾittô. In both, the deposit is returned to its owner. Lev treats the denial as a trespass against YHWH (maʿal)."
  - unit: quran-4-fighting-and-death
    checked: [hb-amos-9-altar-and-booth-of-david, hb-isa-45-cyrus-the-anointed, hb-prov-24-words-of-wise, hb-prov-15-sayings, hb-deut-28-blessings-curses, hb-obad-1-edom-brought-down, hb-num-14-rebellion-verdict, hb-judg-5-song-of-deborah]
    matches:
      - with: hb-amos-9-altar-and-booth-of-david
        motif: no-escape-from-god-sheol-heaven-sea
        refs: ["4:78"]
        with_refs: ["Amos 9:2", "Amos 9:3"]
        relation: echo
        note: "Q: aynamā takūnū yudrikkumu l-mawtu wa-law kuntum fī burūjin mushayyadatin. Amos: ʾim-yaḥtərû bišʾôl miššām yādî tiqqāḥēm wəʾim-yaʿălû haššāmayim miššām ʾôrîdēm. No height or hiding place escapes; in Q it is death that reaches them, in Amos God's hand."
      - with: hb-obad-1-edom-brought-down
        motif: proud-nest-among-stars-brought-down
        refs: ["4:78"]
        with_refs: ["Obad 1:4"]
        relation: echo
        note: "Q: wa-law kuntum fī burūjin mushayyadatin. Obad: ʾim-tagbîah kannešer wəʾim-bên kôkhābîm śîm qinnekā miššām ʾôrîdəkā. A high, fortified dwelling is no protection."
      - with: hb-isa-45-cyrus-the-anointed
        motif: god-creates-light-and-darkness-peace-and-evil
        refs: ["4:78", "4:79"]
        with_refs: ["Isa 45:7"]
        relation: divergence
        note: "Q 4:78 qul kullun min ʿindi llāh = Isa yôṣēr ʾôr û-bôrēʾ ḥōšekh ʿōśeh šālôm û-bôrēʾ rāʿ ... ʿōśeh khol-ʾēlleh. But Q 4:79 adds at once mā aṣābaka min ḥasanatin fa-mina llāhi wa-mā aṣābaka min sayyiʾatin fa-min nafsika, assigning evil to the self. Isa says God 'creates evil'."
      - with: hb-num-14-rebellion-verdict
        motif: people-balk-at-fighting
        refs: ["4:77"]
        with_refs: ["Num 14:2", "Num 14:3"]
        relation: parallel
        note: "Q: qālū rabbanā lima katabta ʿalaynā l-qitāla law-lā akhkhartanā ilā ajalin qarīb. Num: wə-lāmāh YHWH mēbîʾ ʾōtānû ʾel-hāʾāreṣ hazzōʾt linpōl baḥereb. Both put to God a 'why' about being sent to fight; Q adds that they fear people 'as they fear God or more'."
      - with: hb-judg-5-song-of-deborah
        motif: laggard-rejoices-at-missing-battle
        refs: ["4:72", "4:73"]
        with_refs: ["Judg 5:16", "Judg 5:17", "Judg 5:23"]
        relation: echo
        note: "Both rebuke those who stay away from the battle. Judg: lāmmāh yāšabtā bên ha-mišpətayim; ʾôrû mērôz ... kî lōʾ-bāʾû lə-ʿezrat YHWH (Meroz is cursed). Q: the laggard (la-man la-yubaṭṭiʾanna) says qad anʿama llāhu ʿalayya idh lam akun maʿahum shahīdan, then wishes for the spoil."
  - unit: quran-4-hypocrites-two-factions
    checked: [hb-deut-20-rules-of-war, hb-deut-2-sihon, hb-2sam-10-ammonite-insult, hb-obad-1-edom-brought-down, hb-josh-9-gibeonite-ruse]
    matches:
      - with: hb-deut-20-rules-of-war
        motif: peace-offer-before-war
        refs: ["4:90", "4:91"]
        with_refs: ["Deut 20:10", "Deut 20:11"]
        relation: divergence
        note: "The roles are reversed. Deut: Israel makes the offer (wə-qārāʾtā ʾēlêhā lə-šālôm), and a city that answers šālôm becomes forced labour (yihyû ləkā lāmas waʿăbādûkā). Q: the other side offers (wa-alqaw ilaykumu l-salama) and withdraws, and then fa-mā jaʿala llāhu lakum ʿalayhim sabīlan: no claim on them, no tribute."
      - with: hb-deut-2-sihon
        motif: peace-offer-before-war
        refs: ["4:90"]
        with_refs: ["Deut 2:26"]
        relation: echo
        note: "Deut: dibrê šālôm sent to Sihon, who refuses and is destroyed. Q: those who 'cast you the peace' (alqaw ilaykumu l-salam) are left alone."
      - with: hb-josh-9-gibeonite-ruse
        motif: neutral-and-treaty-folk-not-fought
        refs: ["4:90"]
        with_refs: ["Josh 9:15", "Josh 9:19", "Josh 9:20"]
        relation: parallel
        note: "Q: illā lladhīna yaṣilūna ilā qawmin baynakum wa-baynahum mīthāqun, a treaty that protects even those otherwise to be fought. Josh: wayyikhrōt lāhem bərît lə-ḥayyôtām ... lōʾ nûkhal lingōaʿ bāhem ... wə-lōʾ-yihyeh ʿālênû qeṣef ʿal-ha-šəbûʿāh. The sworn treaty binds even after the ruse."
  - unit: quran-4-homicide-law
    checked: [hb-num-35-levitical-cities-refuge, hb-deut-19-refuge-witnesses, hb-exod-21-bodily-injury, hb-lev-20-penalties, hb-lev-5-graduated-and-guilt-offerings]
    matches:
      - with: hb-num-35-levitical-cities-refuge
        motif: city-of-refuge-accidental-killer
        refs: ["4:92"]
        with_refs: ["Num 35:11"]
        relation: divergence
        note: "The same legal category: Q khaṭaʾan = Num bi-šəgāgāh (unintentional killing). The remedy differs. Num: asylum in a city of refuge (wə-nās šāmmāh rōṣēaḥ makkēh-nefeš bi-šəgāgāh). Q: taḥrīru raqabatin muʾminatin wa-diyatun musallamatun ilā ahlihi (free a slave, pay blood money), and if one cannot, fast two months."
      - with: hb-num-35-levitical-cities-refuge
        motif: no-ransom-for-murderer
        refs: ["4:92"]
        with_refs: ["Num 35:31", "Num 35:32"]
        relation: contrast
        note: "Opposite rulings on payment for a life. Num 35:32 wə-lōʾ-tiqḥû khōfer lā-nûs ʾel-ʿîr miqlāṭô: no ransom even for the accidental killer. Q 4:92 requires a payment, diyatun musallamatun ilā ahlihi, which the family may remit (illā an yaṣṣaddaqū)."
      - with: hb-num-35-levitical-cities-refuge
        motif: murder-vs-manslaughter-by-weapon
        refs: ["4:92", "4:93"]
        with_refs: ["Num 35:16", "Num 35:20", "Num 35:22", "Num 35:23"]
        relation: parallel
        note: "Both turn on intent. Q: khaṭaʾan against mutaʿammidan. Num: bə-śinʾāh ... bi-ṣədiyyāh (in hatred, lying in wait) against bə-feṯaʿ bə-lōʾ-ʾêvāh (suddenly, without enmity). Num also judges by the weapon (iron, stone, wood); Q does not."
      - with: hb-exod-21-bodily-injury
        motif: death-penalty-for-murder
        refs: ["4:93"]
        with_refs: ["Exod 21:12", "Exod 21:14"]
        relation: divergence
        note: "HB punishes deliberate murder on earth: makkēh ʾîš wā-mēt môt yûmāt; even from the altar, kî-yāzid ʾîš ... bə-ʿormāh mēʿim mizbəḥî tiqqāḥennû lāmût. Q 4:93 sets no human penalty here: fa-jazāʾuhu jahannamu khālidan fīhā wa-ghaḍiba llāhu ʿalayhi wa-laʿanahu."
      - with: hb-exod-21-bodily-injury
        motif: city-of-refuge-accidental-killer
        refs: ["4:92"]
        with_refs: ["Exod 21:13"]
        relation: divergence
        note: "Exod: waʾăšer lōʾ ṣādāh wə-hāʾĕlōhîm ʾinnāh lə-yādô wə-śamtî ləkā māqôm ʾăšer yānûs šāmmāh. Unintentional killing is ascribed to God, and asylum is the remedy. Q: wa-mā kāna li-muʾminin an yaqtula muʾminan illā khaṭaʾan, with expiation (kaffāra, diya) and a fast as tawbatan mina llāh."
      - with: hb-deut-19-refuge-witnesses
        motif: city-of-refuge-accidental-killer
        refs: ["4:92"]
        with_refs: ["Deut 19:4", "Deut 19:5"]
        relation: divergence
        note: "Deut: ʾăšer yakkeh ʾet-rēʿēhû bi-vlî-daʿat wə-hûʾ lōʾ-śōnēʾ lô (the axe-head case) ... yānûs ... wā-ḥāy. Q: the same category khaṭaʾan, but the remedy is payment to the family and freeing a slave, with no refuge or avenger (gōʾēl ha-dām)."
  - unit: quran-4-strivers-emigration
    checked: [hb-num-32-transjordan-tribes, hb-deut-20-rules-of-war, hb-job-1-prologue-first-test, hb-isa-63-communal-lament, hb-jer-49-ammon-edom-damascus-kedar-elam]
    matches:
      - with: hb-num-32-transjordan-tribes
        motif: strivers-above-those-who-sit
        refs: ["4:95"]
        with_refs: ["Num 32:6"]
        relation: parallel
        note: "Both turn on 'sitting' while others go to war, from the same image. Q: lā yastawī l-qāʿidūna mina l-muʾminīna ... wa-l-mujāhidūna. Num: ha-ʾaḥêkhem yābōʾû lammilḥāmāh wəʾattem tēšəbû pōh."
      - with: hb-deut-20-rules-of-war
        motif: military-exemptions-house-vineyard-bride
        refs: ["4:95"]
        with_refs: ["Deut 20:5", "Deut 20:6", "Deut 20:7", "Deut 20:8"]
        relation: divergence
        note: "Deut sends home the man with a new house, an unused vineyard, a betrothed bride, and ha-yārēʾ wə-rakh ha-lēvāv (the fearful and fainthearted). Q exempts only ghayru ulī l-ḍarar, the disabled. Those who sit for other reasons are not sent home; they are ranked lower (faḍḍala llāhu l-mujāhidīna ... ʿalā l-qāʿidīna darajatan)."
  - unit: quran-4-prayer-of-fear
    checked: [hb-neh-4-builders-armed, hb-deut-6-shema, hb-ps-63-thirst, hb-ps-102-afflicted, hb-ps-103-bless-my-soul]
    matches:
      - with: hb-neh-4-builders-armed
        motif: prayer-in-shifts-under-arms
        refs: ["4:102"]
        with_refs: ["Neh 4:10", "Neh 4:11", "Neh 4:15", "Neh 4:16"]
        relation: parallel
        note: "Half the company does the sacred work while half holds weapons. Q (prayer): fa-l-taqum ṭāʾifatun minhum maʿaka wa-l-yaʾkhudhū asliḥatahum ... wa-l-taʾti ṭāʾifatun ukhrā lam yuṣallū. Neh (building): ḥăṣî nəʿāray ʿōśîm bammlāʾkhāh wə-ḥeṣyām maḥăzîqîm wə-hā-rəmāḥîm ... bə-ʾaḥat yādô ʿōśeh vamlāʾkhāh wə-ʾaḥat maḥăzeqet ha-šālaḥ. In both, the enemy waits for a lapse (Neh 4:5; Q wadda lladhīna kafarū law taghfulūna ʿan asliḥatikum)."
      - with: hb-deut-6-shema
        motif: teach-children-constantly
        refs: ["4:103"]
        with_refs: ["Deut 6:7"]
        relation: echo
        note: "God is to be remembered in every posture. Q: fa-dhkurū llāha qiyāman wa-quʿūdan wa-ʿalā junūbikum. Deut: bə-šivtəkhā bə-vêtekhā û-və-lekhtəkhā vaddérekh û-və-šokhbəkhā û-və-qûmekhā."
      - with: hb-ps-63-thirst
        motif: remember-god-standing-sitting-lying
        refs: ["4:103"]
        with_refs: ["Ps 63:7"]
        relation: echo
        note: "Q: fa-dhkurū llāha ... ʿalā junūbikum. Ps: ʾim-zəkhartîkhā ʿal-yəṣûʿāy bə-ʾašmūrôt ʾehgeh-bākh. Both use the root dh-k-r / z-k-r for remembering God lying down."
  - unit: quran-4-false-accusation
    checked: [hb-jer-31-consolation-new-covenant, hb-ezek-3-watchman-and-muteness, hb-deut-19-refuge-witnesses, hb-ezek-33-watchman-and-fall-news, hb-deut-18-levites-prophet, hb-ezek-22-city-of-blood, hb-jer-7-queen-of-heaven, hb-isa-29-ariel-and-sealed-book, hb-exod-23-justice-sabbatical-festivals]
    matches:
      - with: hb-jer-31-consolation-new-covenant
        motif: individual-responsibility-for-sin
        refs: ["4:111"]
        with_refs: ["Jer 31:29", "Jer 31:30"]
        relation: parallel
        note: "Q: wa-man yaksib ithman fa-innamā yaksibuhu ʿalā nafsihi. Jer: kî ʾim-ʾîš baʿăwōnô yāmût, replacing the proverb ʾāvôt ʾākhlû vōser."
      - with: hb-ezek-3-watchman-and-muteness
        motif: individual-responsibility-for-sin
        refs: ["4:111"]
        with_refs: ["Ezek 3:18", "Ezek 3:19"]
        relation: echo
        note: "Ezek: hûʾ rāšāʿ baʿăwōnô yāmût, and the warned watchman has saved his own life (ʾet-nafšəkhā hiṣṣaltā). Q 4:111 ʿalā nafsihi; the Prophet is also told not to take on the traitors' cause (4:105, 4:109)."
      - with: hb-deut-19-refuge-witnesses
        motif: false-witness-suffers-intended-penalty
        refs: ["4:112"]
        with_refs: ["Deut 19:16", "Deut 19:18", "Deut 19:19"]
        relation: divergence
        note: "Both deal with charging an innocent person. Deut: the court punishes the false witness: wa-ʿăśîtem lô kaʾăšer zāmam laʿăśôt lə-ʾāḥîw. Q: thumma yarmi bihi barīʾan fa-qadi ḥtamala buhtānan wa-ithman mubīnan. The accuser 'carries' the slander as sin before God, and no court penalty is named."
      - with: hb-exod-23-justice-sabbatical-festivals
        motif: guilt-cast-on-innocent
        refs: ["4:105", "4:112"]
        with_refs: ["Exod 23:1", "Exod 23:7"]
        relation: parallel
        note: "Do not side with the guilty party, and do not condemn the innocent. Q: wa-lā takun li-l-khāʾinīna khaṣīman; yarmi bihi barīʾan. Exod: ʾal-tāšet yādəkhā ʿim-rāšāʿ lihyōt ʿēd ḥāmās; wə-nāqî wə-ṣaddîq ʾal-tahărōg. Q barīʾ corresponds to Exod nāqî."
      - with: hb-jer-7-queen-of-heaven
        motif: prophet-forbidden-to-intercede
        refs: ["4:107", "4:109"]
        with_refs: ["Jer 7:16"]
        relation: parallel
        note: "God forbids his prophet to plead for the guilty. Q: wa-lā tujādil ʿani lladhīna yakhtānūna anfusahum; fa-man yujādilu llāha ʿanhum yawma l-qiyāmati. Jer: wəʾattāh ʾal-titpallēl bəʿad hāʿām hazzeh ... wəʾal-tifgaʿ-bî kî-ʾênennî šōmēaʿ ʾōtākh. In Q the pleading is in a court case for named traitors; in Jer it is prayer for the whole people."
      - with: hb-isa-29-ariel-and-sealed-book
        motif: god-present-at-night-plotting
        refs: ["4:108"]
        with_refs: ["Isa 29:15"]
        relation: echo
        note: "Plotters hide from people but not from God. Q: yastakhfūna mina l-nāsi wa-lā yastakhfūna mina llāhi wa-huwa maʿahum idh yubayyitūna (plotting by night). Isa: hôy ha-maʿămîqîm mē-YHWH lastir ʿēṣāh wə-hāyāh və-maḥšākh maʿăśêhem wayyōʾmərû mî rōʾēnû."
  - unit: quran-4-satan-vows-share
    checked: [hb-jer-44-queen-of-heaven, hb-isa-41-trial-of-the-gods, hb-2chr-20-battle-won-by-singing, hb-hos-2-unfaithful-wife, hb-isa-65-rebels-and-servants]
