        note: "an yaqūlū samiʿnā wa-aṭaʿnā ~ kōl ʾăšer dibber YHWH naʿăśeh wə-nišmāʿ: the formula of acceptance with the same 'hear' (samiʿa / šāmaʿ). The order differs: Exodus puts doing before hearing, the Quran hearing before obeying. Exodus has it once, at the covenant meal; the Quran makes it what believers always say when called to judgment by God and his messenger. cf. Q 2:93 samiʿnā wa-ʿaṣaynā, the Quran's own reversal."
