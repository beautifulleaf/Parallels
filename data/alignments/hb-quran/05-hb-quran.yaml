        note: "yudhabbiḥu abnāʾahum wa-yastaḥyī nisāʾahum ~ ʾim bēn hûʾ wa-hămitten ʾōtô wə-ʾim bat hîʾ wā-ḥāyâ ... wə-khol hab-bat təḥayyûn: kill the sons, let the females live, with the same root for 'let live' (istaḥyā / ḥiyyâ). The Quran says 'their women' (nisāʾ), Exodus 'daughters'; the Quran leaves out the midwives Shiphrah and Puah and their defiance (Exod 1:15-21)."
      - with: hb-exod-1-oppression-midwives
        motif: ruler-fears-growing-foreign-population
        refs: ["28:4", "28:5", "28:6"]
        with_refs: ["Exod 1:9", "Exod 1:10"]
