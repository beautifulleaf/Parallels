      - with: hb-exod-2-moses-birth-flight-midian
        motif: infant-set-adrift
        refs: ["28:7"]
        with_refs: ["Exod 2:3"]
        relation: divergence
        note: "fa-alqīhi fī l-yammi ~ wat-tāśem bas-sûf ʿal śəfat hay-yəʾōr: Exodus places him carefully among the reeds at the edge of the Nile (yəʾōr), in a basket (tēvat gōmeʾ) with bitumen and pitch; the Quran says 'cast him into the yamm', with no vessel in this passage, using the word that elsewhere names the sea where Pharaoh drowns."
      - with: hb-exod-2-moses-birth-flight-midian
        motif: adopted-by-royal-woman
        refs: ["28:8", "28:9"]
        with_refs: ["Exod 2:5", "Exod 2:6", "Exod 2:10"]
        relation: divergence
        note: "Who finds and adopts him: Pharaoh's daughter (bat Parʿōh), bathing, sees the basket, has pity on the crying child, recognizes him as Hebrew (mī-yaldê hā-ʿIvrîm zeh) and later names him. In the Quran Pharaoh's household picks him up (iltaqaṭahu ālu Firʿawn), and Pharaoh's wife (imraʾat Firʿawn) pleads with Pharaoh: qurratu ʿaynin lī wa-laka lā taqtulūhu ʿasā an yanfaʿanā aw nattakhidhahu waladan. Daughter becomes wife, pity becomes intercession, and the Quran adds the divine irony 'so that he would be an enemy and a grief to them' (28:8)."
      - with: hb-exod-2-moses-birth-flight-midian
        motif: sister-watches
        refs: ["28:11"]
        with_refs: ["Exod 2:4"]
        relation: parallel
        note: "qālat li-ukhtihi quṣṣīhi fa-baṣurat bihi ʿan junubin wa-hum lā yashʿurūna ~ wat-tētaṣṣav ʾăḥōtô mē-rāḥōq lə-dēʿâ mah yyēʿāśeh lô: the sister watches from a distance. In the Quran the mother sends her."
      - with: hb-exod-2-moses-birth-flight-midian
        motif: sister-offers-nurse
        refs: ["28:12"]
        with_refs: ["Exod 2:7"]
        relation: divergence
        note: "The sister's offer: Exodus has hăʾēlēkh wə-qārāʾtî lākh ʾiššâ mêneqet min hā-ʿIvriyyōt on her own initiative; the Quran first has God forbid the other wet-nurses to him (wa-ḥarramnā ʿalayhi l-marāḍiʿa min qablu), then the sister offers a household that will rear him. cf. b. Sotah 12b (Moses refuses Egyptian breasts), outside the HB."
      - with: hb-exod-2-moses-birth-flight-midian
        motif: returned-to-own-mother
        refs: ["28:13"]
        with_refs: ["Exod 2:9"]
        relation: divergence
        note: "Why the child goes back to his mother: Exodus has a paid arrangement with the princess, hêlîkhî ʾet hay-yeled haz-zeh wə-hênîqihû lî wa-ʾănî ʾettēn ʾet śəkhārēkh; the Quran has God keeping his promise, fa-radadnāhu ilā ummihi kay taqarra ʿaynuhā wa-lā taḥzana wa-li-taʿlama anna waʿda llāhi ḥaqqun. The Quran omits the naming and its etymology (Exod 2:10)."
      - with: hb-gen-21-isaac-born-hagar-expelled
        motif: fear-not-oracle
        refs: ["28:7"]
        with_refs: ["Gen 21:15", "Gen 21:17", "Gen 21:18"]
        relation: echo
        note: "A mother forced to give up her child is told not to fear and given a promise about his future: wat-tašlēkh ʾet hay-yeled ... ʾal tîrʾî ... kî lə-gôy gādôl ʾăśîmennû ~ fa-alqīhi fī l-yammi wa-lā takhāfī wa-lā taḥzanī innā rāddūhu ilayki wa-jāʿilūhu mina l-mursalīna. The same verb 'cast' (hišlîkh / alqā)."
  - unit: quran-28-moses-kills-and-flees
    checked: [hb-exod-2-moses-birth-flight-midian, hb-1kgs-11-adversaries, hb-1sam-26-spear-and-jug, hb-exod-14-crossing-of-the-sea, hb-2sam-1-amalekite-messenger]
    matches:
      - with: hb-exod-2-moses-birth-flight-midian
        motif: hero-kills-oppressor-and-hides-body
        refs: ["28:15"]
        with_refs: ["Exod 2:11", "Exod 2:12"]
        relation: divergence
        note: "The killing: Exodus has Moses see an Egyptian beating a Hebrew 'of his brothers', look this way and that and see no one (wa-yyifen kōh wā-khōh wa-yyarʾ kî ʾên ʾîš), strike him and hide him in the sand. The Quran has him find two men fighting, one of his party (shīʿa) and one of his enemy; at his kinsman's cry for help he strikes one blow and the man dies (fa-wakazahu Mūsā fa-qaḍā ʿalayhi). There is no looking around and no hiding of the body; the act is unpremeditated."
      - with: hb-exod-2-moses-birth-flight-midian
        motif: killing-called-work-of-satan
        refs: ["28:15", "28:16", "28:17"]
        with_refs: ["Exod 2:12", "Exod 2:14"]
        relation: divergence
        note: "Moral verdict on the killing: Exodus passes none; Moses only fears exposure (wa-yyîrāʾ Mōše wa-yyōʾmar ʾākhēn nôdaʿ had-dāvār). The Quran has Moses judge it at once, hādhā min ʿamali sh-shayṭān ... rabbi innī ẓalamtu nafsī fa-ghfir lī, and God forgives him (fa-ghafara lahu), so Moses is a repentant penitent before he is a prophet."
      - with: hb-exod-2-moses-birth-flight-midian
        motif: who-made-you-judge-over-us
        refs: ["28:18", "28:19"]
        with_refs: ["Exod 2:13", "Exod 2:14"]
        relation: divergence
        note: "The second day: in Exodus two Hebrews (šənê ʾănāšîm ʿIvrîm) fight, Moses rebukes the guilty one, and that Hebrew retorts mî śāməkhā lə-ʾîš śar wə-šōfēṭ ʿālênû ha-lə-hārəgēnî ʾattâ ʾōmēr ka-ʾăšer hāragtā ʾet ham-Miṣrî. In the Quran the same kinsman again calls for help against an enemy, Moses calls the kinsman 'clearly misguided' (la-ghawiyyun mubīn), and as he moves to strike the enemy he hears a-turīdu an taqtulanī kamā qatalta nafsan bi-l-amsi in turīdu illā an takūna jabbāran fī l-arḍ. 'Prince and judge' becomes 'tyrant' (jabbār)."
      - with: hb-exod-2-moses-birth-flight-midian
        motif: man-from-far-end-of-city-warns
        refs: ["28:20"]
        with_refs: ["Exod 2:15"]
        relation: divergence
        note: "How the danger reaches Moses: Exodus has wa-yyišmaʿ Parʿōh ʾet had-dāvār haz-zeh wa-yvaqqēš lahărōg ʾet Mōše, Pharaoh himself; the Quran has the chiefs plotting (al-malaʾa yaʾtamirūna bika li-yaqtulūka) and an unnamed sympathizer running from the far end of the city to warn him (wa-jāʾa rajulun min aqṣā l-madīnati yasʿā)."
      - with: hb-exod-2-moses-birth-flight-midian
        motif: hero-flees-to-foreign-land
        refs: ["28:21", "28:22"]
        with_refs: ["Exod 2:15"]
        relation: parallel
        note: "fa-kharaja minhā khāʾifan yataraqqabu ... wa-lammā tawajjaha tilqāʾa Madyana ~ wa-yyivraḥ Mōše mip-pənê Farʿōh wa-yyēšev bə-ʾereṣ Midyān: flight to Midian (Madyan / Midyān). The Quran adds two prayers (rabbi najjinī ... ʿasā rabbī an yahdiyanī sawāʾa s-sabīl)."
      - with: hb-1kgs-11-adversaries
        motif: hero-flees-to-foreign-land
        refs: ["28:21", "28:22"]
        with_refs: ["1Kgs 11:17", "1Kgs 11:18"]
        relation: echo
        note: "fa-kharaja minhā khāʾifan ... tilqāʾa Madyana ~ wa-yyivraḥ ʾĂdad ... wa-yyāqumû mim-Midyān wa-yyāvōʾû Pāʾrān ... Miṣrayim ʾel Parʿōh: a hunted young man flees by way of Midian. Hadad's route goes the opposite way, from Edom through Midian into Pharaoh's court, while Moses flees from Pharaoh's court to Midian."
  - unit: quran-28-moses-in-midian
    checked: [hb-exod-2-moses-birth-flight-midian, hb-gen-29-jacob-rachel-leah, hb-hos-12-jacob, hb-gen-24-bride-for-isaac, hb-2kgs-4-shunammite]
    matches:
      - with: hb-exod-2-moses-birth-flight-midian
        motif: hero-waters-flock-for-women
        refs: ["28:23", "28:24"]
        with_refs: ["Exod 2:16", "Exod 2:17"]
        relation: divergence
        note: "At the water of Midian: Exodus has seven daughters of the priest of Midian (šebaʿ bānôt) who draw water, shepherds who drive them off (wa-ygārəšûm), and Moses who rescues them (wa-yyôšiʿān) and waters their flock. The Quran has two women holding back their flock (imraʾatayni tadhūdāni) until the shepherds finish, explaining abūnā shaykhun kabīrun; Moses waters for them unasked, then withdraws to the shade and prays (rabbi innī limā anzalta ilayya min khayrin faqīr). There is no fight with the shepherds."
      - with: hb-exod-2-moses-birth-flight-midian
        motif: foreign-priest-father-in-law
        refs: ["28:23", "28:25"]
        with_refs: ["Exod 2:16", "Exod 2:18", "Exod 2:20"]
        relation: divergence
        note: "The father: Exodus has a named priest, kōhēn Midyān and Rəʿûʾēl, who scolds his daughters for leaving the stranger and invites him to eat (qirʾen lô wə-yōʾkhal leḥem); the Quran has an unnamed 'very old man' (shaykhun kabīr), no priest, who sends a daughter to pay Moses his wage (li-yajziyaka ajra mā saqayta lanā) and reassures him: lā takhaf najawta mina l-qawmi ẓ-ẓālimīn."
      - with: hb-exod-2-moses-birth-flight-midian
        motif: modest-daughter-invites-hero-to-father
        refs: ["28:25", "28:26"]
        with_refs: ["Exod 2:19", "Exod 2:20"]
        relation: divergence
        note: "The daughters' role: in Exodus they report together to their father, ʾîš Miṣrî hiṣṣîlānû mi-yyad hā-rōʿîm, 'an Egyptian man saved us' (Moses taken for an Egyptian); in the Quran one daughter walks shyly (tamshī ʿalā stiḥyāʾ) to invite him and then advises her father, istaʾjirhu inna khayra mani staʾjarta l-qawiyyu l-amīnu, 'hire him, the best one to hire is the strong and trustworthy'."
      - with: hb-exod-2-moses-birth-flight-midian
        motif: meeting-future-wife-at-well
        refs: ["28:27", "28:28"]
        with_refs: ["Exod 2:21"]
        relation: divergence
        note: "The marriage: Exodus has wa-yyôʾel Mōše lāševet ʾet hā-ʾîš wa-yyittēn ʾet Ṣippōrâ vittô lə-Mōše, a named bride and no terms; the Quran has an unnamed daughter given under a contract of service, ʿalā an taʾjuranī thamāniya ḥijajin fa-in atmamta ʿashran fa-min ʿindika, eight years or ten if he wishes, sworn before God (wa-llāhu ʿalā mā naqūlu wakīl)."
      - with: hb-gen-29-jacob-rachel-leah
        motif: serving-seven-years-for-bride
        refs: ["28:27", "28:28"]
        with_refs: ["Gen 29:18", "Gen 29:20", "Gen 29:25", "Gen 29:27"]
        relation: divergence
        note: "Service for a wife: Jacob offers ʾeʿĕvodkā šebaʿ šānîm bə-Rāḥēl, is deceived (lāmmâ rimmîtānî), and must serve seven more; Moses is offered eight years with an optional tenth by a father who says wa-mā urīdu an ashuqqa ʿalayka, and he agrees with 'whichever term I complete, no wrong to me' (fa-lā ʿudwāna ʿalayya). The Quran's Midian story borrows Jacob's labor contract and removes the deception."
      - with: hb-gen-29-jacob-rachel-leah
        motif: meeting-at-the-well-betrothal
