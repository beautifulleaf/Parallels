  - unit: quran-26-moses-and-pharaoh
    checked: [hb-exod-15-song-of-the-sea, hb-exod-7-staff-swallows-staffs, hb-exod-4-signs-aaron-bridegroom-of-blood, hb-exod-14-crossing-of-the-sea, hb-1kgs-18-carmel, hb-jer-42-43-flight-to-egypt, hb-exod-2-moses-birth-flight-midian, hb-exod-3-burning-bush, hb-exod-5-bricks-without-straw, hb-exod-1-oppression-midwives, hb-exod-12-passover-firstborn-exodus, hb-exod-7-plagues-blood-frogs-lice, hb-exod-10-locusts-darkness, hb-deut-6-shema]
