  - unit: quran-26-noah
    checked: [hb-gen-6-flood, hb-gen-19-sodom-destroyed, hb-exod-4-signs-aaron-bridegroom-of-blood, hb-ezek-14-idols-in-heart-noah-daniel-job, hb-ezek-33-watchman-and-fall-news, hb-num-14-rebellion-verdict]
