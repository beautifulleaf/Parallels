        refs: ["28:38"]
        with_refs: ["Gen 11:3"]
        relation: parallel
        note: "fa-awqid lī yā Hāmānu ʿalā ṭ-ṭīni ~ nilbənâ ləvēnîm wə-niśrəpâ li-śrēfâ: building material made by firing clay (awqid ʿalā ṭ-ṭīn / śārap li-śrēfâ)."
      - with: hb-gen-11-babel
        motif: tower-reaching-heaven
        refs: ["28:38", "28:39", "28:40"]
        with_refs: ["Gen 11:4", "Gen 11:5", "Gen 11:8"]
        relation: divergence
        note: "A tower toward heaven: Babel's builders, all humankind (hāvâ nivneh llānû ʿîr û-migdāl wə-rōʾšô vaš-šāmayim), want to make a name and not be scattered; God comes down to see, and scatters them. In the Quran one king orders it of his minister (fa-jʿal lī ṣarḥan laʿallī aṭṭaliʿu ilā ilāhi Mūsā wa-innī la-aẓunnuhu mina l-kādhibīna): the aim is to climb up and look at Moses' God, mockingly. The ending is drowning (fa-nabadhnāhum fī l-yamm), not dispersal. God's descent to inspect the tower (wa-yyēred YHWH lirʾōt) is reversed into Pharaoh's wish to ascend and inspect God."
      - with: hb-esth-3-haman-decree
