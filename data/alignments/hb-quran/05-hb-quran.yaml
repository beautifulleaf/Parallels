        note: "jiʾtuka min Sabaʾin bi-nabaʾin yaqīnin innī wajadtu mraʾatan tamlikuhum ~ û-malkat Šəvāʾ šāməʿâ ʾet šēmaʿ Šəlōmōh wat-tāvôʾ: a woman ruling Sheba (Sabaʾ / Šəvāʾ), a report (nabaʾ / šēmaʿ), and her coming to Solomon. The direction of the report is reversed: in Chronicles she hears of Solomon, in the Quran Solomon hears of her through the hoopoe."
