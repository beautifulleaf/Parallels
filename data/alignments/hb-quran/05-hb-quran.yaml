  - unit: quran-27-israel-beast-trumpet
    checked: [hb-dan-7-four-beasts-son-of-man, hb-exod-19-sinai-theophany, hb-jer-19-broken-flask, hb-exod-24-covenant-ratification, hb-isa-6-throne-vision, hb-ps-132-davids-oath-ark]
