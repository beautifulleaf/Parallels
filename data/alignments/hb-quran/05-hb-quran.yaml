        note: "yā Hāmānu ~ giddal ham-melekh ʾĂḥašwērôš ʾet Hāmān ... wa-yyāśem ʾet kisʾô mēʿal kol haś-śārîm ... wa-yvaqqēš Hāmān ləhašmîd ʾet kol hay-yəhûdîm: the name Hāmān for the foreign king's chief minister in a story of persecution of Israel. In the HB he serves the Persian Ahasuerus, in the Quran Pharaoh."
      - with: hb-ezek-29-pharaoh-the-dragon
