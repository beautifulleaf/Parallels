        note: "God's answer to Moses' reluctance: wa-yyiḥar ʾap YHWH bə-Mōše ... hălōʾ ʾAhărōn ʾāḥîkā ... wə-ʾattâ tihyeh lô lēʾlōhîm (anger; Aaron as mouth, Moses as God to him) ~ qāla kallā fa-dhhabā bi-āyātinā innā maʿakum mustamiʿūna: no anger and no 'as God'; both are sent as equals (fa-dhhabā, dual)."
      - with: hb-exod-4-signs-aaron-bridegroom-of-blood
        motif: moses-kills-man-delivered-from-grief
        refs: ["26:14", "26:15"]
        with_refs: ["Exod 4:19"]
