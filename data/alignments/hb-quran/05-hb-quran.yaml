        refs: ["26:16", "26:23", "26:24", "26:28"]
        with_refs: ["Exod 3:18"]
        relation: divergence
        note: "The divine title before Pharaoh: YHWH ʾĕlōhê hā-ʿivriyyîm niqrâ ʿālênû (Exod 3:18, also 5:3) ~ innā rasūlu rabbi l-ʿālamīna, and when Pharaoh asks 'and what is the Lord of the worlds?', Moses answers rabbu s-samāwāti wa-l-arḍi wa-mā baynahumā ... rabbu l-mashriqi wa-l-maghribi. The god of one people becomes the Lord of the cosmos."
      - with: hb-exod-3-burning-bush
