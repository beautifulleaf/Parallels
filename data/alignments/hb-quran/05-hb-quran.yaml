        note: "Why Pharaoh oppresses: Exodus gives his fear that the people will grow and side with enemies (pen yirbeh ... wə-nôsaf gam hûʾ ʿal śōnʾênû); the Quran gives his arrogance (ʿalā fī l-arḍ) and division of the people into factions. The Quran adds God's counter-purpose: to make the oppressed leaders and heirs and to show Pharaoh, Hāmān and their hosts 'what they feared' (mā kānū yaḥdharūn), so the fear of Exod 1:10 is the very thing God brings about."
      - with: hb-exod-2-moses-birth-flight-midian
