  - unit: quran-27-prologue-moses-fire
    checked: [hb-exod-7-staff-swallows-staffs, hb-exod-3-burning-bush, hb-exod-7-plagues-blood-frogs-lice, hb-ps-78-history, hb-exod-4-signs-aaron-bridegroom-of-blood, hb-ps-105-history]
    matches:
      - with: hb-exod-3-burning-bush
        motif: burning-bush-not-consumed
        refs: ["27:7", "27:8"]
        with_refs: ["Exod 3:2", "Exod 3:3", "Exod 3:4"]
        relation: parallel
        note: "innī ānastu nāran ... fa-lammā jāʾahā nūdiya an būrika man fī n-nāri wa-man ḥawlahā ~ wa-yyērāʾ malʾakh YHWH ʾēlāyw bə-labbat ʾēš mit-tôkh has-səneh ... wa-yyiqrāʾ ʾēlāyw ʾĕlōhîm mit-tôkh has-səneh: Moses approaches a fire and is called from within it. The Quran does not mention the bush (only 'who is in the fire and around it'), nor the bush not being consumed."
      - with: hb-exod-3-burning-bush
        motif: prophet-sees-fire-goes-to-fetch-brand
        refs: ["27:7"]
        with_refs: ["Exod 3:1", "Exod 3:3"]
        relation: divergence
        note: "Why Moses goes to the fire: Exodus has him alone with Jethro's flock at Horeb, turning aside to see the great sight (ʾāsurâ nāʾ wə-ʾerʾeh ʾet ham-marʾeh hag-gādōl haz-zeh); the Quran has him traveling with his family (qāla Mūsā li-ahlihi), going to bring back news or a burning brand 'that you may warm yourselves'. The Quran names neither flock, mountain nor Jethro."
      - with: hb-exod-3-burning-bush
        motif: god-of-abraham-isaac-jacob
        refs: ["27:8", "27:9"]
        with_refs: ["Exod 3:6", "Exod 3:14"]
        relation: divergence
        note: "God's self-identification from the fire: Exodus has ʾānōkhî ʾĕlōhê ʾāvîkā ʾĕlōhê ʾAvrāhām ʾĕlōhê Yiṣḥāq wē-ʾlōhê Yaʿăqōv, then ʾehyeh ʾăšer ʾehyeh; the Quran has yā Mūsā innahu ana llāhu l-ʿazīzu l-ḥakīmu, preceded by subḥāna llāhi rabbi l-ʿālamīna. The God of the fathers becomes the Lord of the worlds, and the name-riddle becomes 'Allāh'. The Quran also leaves out the sandals and Moses hiding his face (Exod 3:5-6)."
      - with: hb-exod-4-signs-aaron-bridegroom-of-blood
        motif: staff-quivers-like-jinn-snake-moses-flees
        refs: ["27:10"]
        with_refs: ["Exod 4:3", "Exod 4:4"]
        relation: divergence
        note: "fa-lammā raʾāhā tahtazzu ka-annahā jānnun wallā mudbiran wa-lam yuʿaqqib ~ wa-yhî lə-nāḥāš wa-yyānās Mōše mippānāyw: Moses flees from his transformed staff in both. Exodus then has God order him to grasp the snake by the tail (šəlaḥ yādəkā wə-ʾĕḥōz bi-znāvô); the Quran has God reassure him: yā Mūsā lā takhaf innī lā yakhāfu ladayya l-mursalūna."
      - with: hb-exod-4-signs-aaron-bridegroom-of-blood
        motif: hand-turned-leprous-white-as-snow
        refs: ["27:12"]
        with_refs: ["Exod 4:6", "Exod 4:7"]
        relation: divergence
        note: "wa-adkhil yadaka fī jaybika takhruj bayḍāʾa min ghayri sūʾin ~ hāvēʾ nāʾ yādəkā bə-ḥêqekā ... wə-hinnēh yādô məṣōraʿat ka-ššāleg: hand into the bosom (jayb / ḥêq) and out white. The Quran's 'without evil' (min ghayri sūʾ) excludes exactly what Exodus says, that the hand was leprous (məṣōraʿat), and needs no second step of restoring it (4:7)."
      - with: hb-ps-105-history
        motif: variant-plague-list
        refs: ["27:12"]
        with_refs: ["Ps 105:28", "Ps 105:36"]
        relation: divergence
        note: "fī tisʿi āyātin ilā Firʿawna wa-qawmihi: the Quran counts nine signs to Pharaoh; Exodus has ten plagues, Ps 105:28-36 eight (starting with darkness, šālaḥ ḥōšekh) and Ps 78 seven. The number of the Egyptian wonders already varies within the HB."
      - with: hb-ps-78-history
        motif: variant-plague-list
        refs: ["27:12"]
        with_refs: ["Ps 78:43", "Ps 78:44"]
        relation: echo
        note: "tisʿi āyātin ~ ʾăšer śām bə-Miṣrayim ʾōtôtāyw û-môftāyw bi-śdēh Ṣōʿan: the wonders in Egypt as 'signs' (āyāt / ʾōtôt), counted differently in each list."
      - with: hb-exod-7-staff-swallows-staffs
        motif: contest-with-court-magicians
        refs: ["27:13"]
        with_refs: ["Exod 7:11"]
        relation: echo
        note: "fa-lammā jāʾathum āyātunā mubṣiratan qālū hādhā siḥrun mubīnun ~ wa-yyiqrāʾ gam Parʿōh la-ḥăkhāmîm wə-la-mkhaššəfîm wa-yyaʿăśû gam hēm ... bə-lahăṭêhem kēn: Pharaoh's side treats the signs as magic; Exodus shows it by having the magicians copy them, the Quran by having Pharaoh's people call them 'clear sorcery'."
      - with: hb-exod-7-plagues-blood-frogs-lice
        motif: hardening-of-pharaohs-heart
        refs: ["27:14"]
        with_refs: ["Exod 8:15"]
        relation: divergence
        note: "Why Egypt refuses: Exod 8:15 the magicians admit ʾeṣbaʿ ʾĕlōhîm hîʾ, yet wa-yyeḥĕzaq lēv Parʿōh ... ka-ʾăšer dibber YHWH, the heart is hardened as God foretold; Q 27:14 wa-jaḥadū bihā wa-staiqanathā anfusuhum ẓulman wa-ʿuluwwan, they rejected the signs though inwardly convinced, out of wrongdoing and arrogance. Refusal by God's design becomes knowing, self-chosen denial."
  - unit: quran-27-solomon-ants-hoopoe-sheba
