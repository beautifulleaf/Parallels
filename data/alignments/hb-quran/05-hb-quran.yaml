  - unit: quran-25-furqan-and-objections
    checked: [hb-jer-10-idols-scarecrows, hb-isa-46-bel-nebo-carried, hb-ezek-13-false-prophets-and-prophetesses, hb-isa-8-maher-shalal-and-stone-of-stumbling, hb-ps-78-history, hb-jer-36-burned-scroll]
