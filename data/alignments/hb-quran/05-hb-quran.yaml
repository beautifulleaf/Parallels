        note: "Who is saved with Noah: Genesis, his household for his own righteousness, bōʾ ʾattâ wə-khol bêtəkā ... kî ʾōtəkā rāʾîtî ṣaddîq (Noah, his sons, his wife, his sons' wives); Quran, najjinī wa-man maʿiya mina l-muʾminīna ... fa-anjaynāhu wa-man maʿahu fī l-fulki l-mashḥūn, the believers who followed him, the 'lowliest' (al-ardhalūn, 26:111). The saved group is defined by faith, not by kinship."
