  - unit: quran-24-obedience-and-succession
    checked: [hb-isa-29-ariel-and-sealed-book, hb-exod-24-covenant-ratification, hb-exod-19-sinai-theophany, hb-1chr-16-davids-psalm, hb-jer-33-branch-and-cosmic-covenant, hb-isa-43-you-are-my-witnesses, hb-lev-26-blessings]
