  - unit: quran-28-call-at-the-tree
    checked: [hb-exod-4-signs-aaron-bridegroom-of-blood, hb-exod-7-staff-swallows-staffs, hb-exod-3-burning-bush, hb-amos-7-visions-and-amaziah, hb-1kgs-19-elijah-horeb]
    matches:
      - with: hb-exod-3-burning-bush
        motif: shepherd-called-at-mountain-of-god
        refs: ["28:29", "28:30"]
        with_refs: ["Exod 3:1", "Exod 3:5"]
        relation: divergence
        note: "Place and occasion of the call: Exodus has Moses shepherding Jethro's flock 'behind the wilderness' to Horeb, the mountain of God, a place of holy ground (ʾadmat qōdeš hûʾ), where he must take off his sandals. The Quran has Moses, after completing his term (qaḍā Mūsā l-ajala), traveling with his family, seeing fire on the side of the Mount (jānib aṭ-Ṭūr), and called from the right bank of the valley in 'the blessed spot' (al-buqʿa al-mubāraka). There are no flock and no sandals; the holy ground becomes a blessed spot."
      - with: hb-exod-3-burning-bush
        motif: burning-bush-not-consumed
        refs: ["28:30"]
        with_refs: ["Exod 3:2", "Exod 3:4"]
        relation: divergence
        note: "nūdiya ... mina sh-shajarati an yā Mūsā innī ana llāhu rabbu l-ʿālamīna ~ wa-yyiqrāʾ ʾēlāyw ʾĕlōhîm mit-tôkh has-səneh wa-yyōʾmer Mōše Mōše ... ʾānōkhî ʾĕlōhê ʾāvîkā: the call from a plant. The bush (səneh) becomes 'the tree' (ash-shajara), the angel in the flame drops out, and 'the God of your father' becomes 'Allāh, Lord of the worlds'."
      - with: hb-exod-4-signs-aaron-bridegroom-of-blood
        motif: staff-quivers-like-jinn-snake-moses-flees
        refs: ["28:31"]
        with_refs: ["Exod 4:3", "Exod 4:4"]
        relation: divergence
        note: "As at Q 27:10: wa-yyānās Mōše mip-pānāyw ~ wallā mudbiran wa-lam yuʿaqqib; Exodus' command to seize the snake's tail (wə-ʾĕḥōz bi-znāvô) becomes yā Mūsā aqbil wa-lā takhaf innaka mina l-āminīn, 'come forward and do not fear, you are safe'."
      - with: hb-exod-4-signs-aaron-bridegroom-of-blood
        motif: hand-turned-leprous-white-as-snow
        refs: ["28:32"]
        with_refs: ["Exod 4:6", "Exod 4:8", "Exod 4:9"]
        relation: divergence
        note: "Two signs, not three, and no leprosy: Exodus gives staff, leprous hand (məṣōraʿat ka-ššāleg), and a third sign held in reserve, Nile water turned to blood (wə-hāyû lə-dām bay-yabbāšet), meant for doubting Israelites; the Quran has fa-dhānika burhānāni min rabbika ilā Firʿawna wa-malaʾihi, two proofs aimed at Pharaoh, the hand white 'without evil' (min ghayri sūʾ), and adds 'draw your arm to your side against fear'."
      - with: hb-exod-4-signs-aaron-bridegroom-of-blood
        motif: aaron-more-eloquent
        refs: ["28:34", "28:35"]
        with_refs: ["Exod 4:10", "Exod 4:14", "Exod 4:15"]
        relation: divergence
        note: "Aaron's eloquence: in Exodus Moses says he is heavy of mouth, and God, angry, proposes Aaron himself: wa-yyiḥar ʾap YHWH bə-Mōše ... yādaʿtî kî dabbēr yədabbēr hûʾ ... wə-śamtā ʾet had-dəvārîm bə-fîw. In the Quran Moses proposes him, wa-akhī Hārūnu huwa afṣaḥu minnī lisānan fa-arsilhu maʿiya ridʾan yuṣaddiqunī, and God agrees without anger: sa-nashuddu ʿaḍudaka bi-akhīka. Aaron is a supporting witness (ridʾ, yuṣaddiqunī), not a mouth for Moses as God."
      - with: hb-exod-4-signs-aaron-bridegroom-of-blood
        motif: moses-kills-man-delivered-from-grief
        refs: ["28:33"]
        with_refs: ["Exod 4:19"]
        relation: divergence
        note: "rabbi innī qataltu minhum nafsan fa-akhāfu an yaqtulūni ~ kî mētû kol hā-ʾănāšîm ham-məvaqšîm ʾet nafšekā: the old killing as an obstacle to going back. In Exodus God removes it unasked, in the Quran Moses raises it at the call."
      - with: hb-1kgs-19-elijah-horeb
        motif: prophet-in-cave-on-horeb
        refs: ["28:29", "28:30", "28:33"]
        with_refs: ["1Kgs 19:8", "1Kgs 19:10", "1Kgs 19:12"]
        relation: echo
        note: "A prophet fleeing those who seek his life is addressed by God at the holy mountain: ʿad har hā-ʾĕlōhîm Ḥōrēv ... wa-yvaqšû ʾet nafšî ləqaḥtāh ... qôl dəmāmâ daqqâ ~ ānasa min jānibi ṭ-Ṭūri nāran ... fa-akhāfu an yaqtulūni. In 1 Kgs God is not in the fire (lōʾ vāʾēš YHWH); in the Quran the call comes from the fire and tree."
  - unit: quran-28-pharaohs-tower-and-end
    checked: [hb-gen-11-babel, hb-ps-78-history, hb-exod-7-staff-swallows-staffs, hb-isa-19-oracle-on-egypt, hb-1kgs-18-carmel, hb-esth-3-haman-decree, hb-ezek-29-pharaoh-the-dragon, hb-exod-5-bricks-without-straw]
