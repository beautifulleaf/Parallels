        note: "yā ayyuhā l-malaʾu mā ʿalimtu lakum min ilāhin ghayrī ... wa-stakbara huwa wa-junūduhu ~ ʾăšer ʾāmar lî yəʾōrî wa-ʾănî ʿăśîtinî: Pharaoh claims divinity in his own words, the prophet quoting his boast. In Ezekiel he is the maker of the Nile or of himself; in the Quran he is the only god his court knows. Both end with Pharaoh flung out (Ezek 29:5 nəṭaštîkā ham-midbārâ, Q 28:40 fa-nabadhnāhum fī l-yamm)."
      - with: hb-exod-5-bricks-without-straw
        motif: who-is-yhwh-defiance
        refs: ["28:38"]
        with_refs: ["Exod 5:2"]
        relation: divergence
        note: "Pharaoh's knowledge of the god: lōʾ yādaʿtî ʾet YHWH, 'I do not know YHWH' (ignorance of a foreign god) ~ mā ʿalimtu lakum min ilāhin ghayrī, 'I know of no god for you other than me' (Pharaoh's self-deification)."
      - with: hb-ps-78-history
        motif: pursuers-drowned-in-sea
        refs: ["28:40"]
        with_refs: ["Ps 78:53"]
        relation: echo
        note: "fa-akhadhnāhu wa-junūdahu fa-nabadhnāhum fī l-yammi ~ wə-ʾet ʾôyəvêhem kissâ hay-yām: the enemy army covered by or thrown into the sea (yamm / yām)."
      - with: hb-isa-19-oracle-on-egypt
        motif: foolish-counselors-of-pharaoh
        refs: ["28:38"]
        with_refs: ["Isa 19:11"]
        relation: echo
        note: "yā ayyuhā l-malaʾu ... fa-awqid lī yā Hāmānu ~ ʾak ʾĕwilîm śārê Ṣōʿan ḥakhmê yōʿăṣê Farʿōh ʿēṣâ nivʿārâ: Pharaoh's court and advisers as part of his folly."
      - with: hb-exod-7-staff-swallows-staffs
        motif: contest-with-court-magicians
        refs: ["28:36"]
        with_refs: ["Exod 7:11"]
        relation: echo
        note: "qālū mā hādhā illā siḥrun muftaran ~ wa-yyaʿăśû gam hēm ḥarṭummê Miṣrayim bə-lahăṭêhem kēn: the signs set on a level with sorcery; Exodus by imitation, the Quran by the charge 'forged magic'."
