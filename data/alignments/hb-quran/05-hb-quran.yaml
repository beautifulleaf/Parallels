        note: "fa-kāna kullu firqin ka-ṭ-ṭawdi l-ʿaẓīmi ~ ne-ʿermû mayim niṣṣəvû khəmô nēd nōzəlîm: the parted waters stand up like a heap or mountain. In the Song the waters pile up by the blast of God's nostrils (û-və-rûaḥ ʾappêkā)."
      - with: hb-exod-14-crossing-of-the-sea
