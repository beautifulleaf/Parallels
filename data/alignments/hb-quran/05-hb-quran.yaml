        relation: parallel
        note: "thumma aghraqnā l-ākharīna ~ wa-yyāšuvû ham-mayim wa-yəkhassû ʾet hā-rekhev ... lōʾ nišʾar bāhem ʿad ʾeḥād: the waters return over the pursuers and none survives."
      - with: hb-exod-14-crossing-of-the-sea
        motif: people-believe-in-god-and-his-servant
        refs: ["26:67"]
        with_refs: ["Exod 14:31"]
        relation: divergence
        note: "Ending of the sea story: Exod 14:31 wa-yyîrəʾû hā-ʿām ʾet YHWH wa-yyaʾămînû ba-YHWH û-və-Mōše ʿavdô, the people believe, and the Song follows (15:1). The Quran's refrain: inna fī dhālika la-āyatan wa-mā kāna aktharuhum muʾminīna, a sign, yet most of them did not believe. Faith at the sea becomes unbelief despite the sign, aimed at the Quran's own audience."
      - with: hb-exod-12-passover-firstborn-exodus
        motif: despoiling-the-egyptians
        refs: ["26:57", "26:58", "26:59"]
        with_refs: ["Exod 12:35", "Exod 12:36"]
