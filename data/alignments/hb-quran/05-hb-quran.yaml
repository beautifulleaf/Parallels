        note: "a-lam nurabbika fīnā walīdan wa-labithta fīnā min ʿumurika sinīna ~ wat-təviʾēhû lə-vat Parʿōh wa-yhî lāh lə-vēn: Moses grew up in Pharaoh's house. Exodus credits Pharaoh's daughter and never has Pharaoh mention it; in the Quran Pharaoh himself throws the upbringing at Moses as a favor he is owed."
      - with: hb-exod-2-moses-birth-flight-midian
        motif: moses-admits-killing-in-error
        refs: ["26:19", "26:20"]
        with_refs: ["Exod 2:11", "Exod 2:12"]
