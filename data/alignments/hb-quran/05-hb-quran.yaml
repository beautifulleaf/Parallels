        note: "What Israel takes from Egypt: Exodus has portable wealth asked of the neighbors, kəlê kesef û-khəlê zāhāv û-śəmālōt ... wa-ynaṣṣəlû ʾet Miṣrāyim; the Quran says God expelled the Egyptians from gardens, springs, treasures and noble dwellings (min jannātin wa-ʿuyūnin wa-kunūzin wa-maqāmin karīm) and 'made the Children of Israel inherit them' (wa-awrathnāhā banī Isrāʾīl). Plunder carried out becomes an inheritance of Egypt's land, which has no counterpart in the HB."
      - with: hb-deut-6-shema
        motif: inherit-houses-not-built
        refs: ["26:57", "26:58", "26:59"]
        with_refs: ["Deut 6:10", "Deut 6:11"]
