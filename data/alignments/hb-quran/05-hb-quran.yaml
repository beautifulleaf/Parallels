        note: "qāla aṣḥābu Mūsā innā la-mudrakūna qāla kallā inna maʿiya rabbī sa-yahdīni ~ wə-hinnēh Miṣrayim nōsēaʿ ʾaḥărêhem wa-yyîrəʾû məʾōd ... ʾal tîrāʾû hityaṣṣəvû û-rəʾû ʾet yəšûʿat YHWH: the people see the pursuers and panic, and Moses calms them. In Exodus they complain bitterly (14:11-12); in the Quran they only state 'we are overtaken'."
      - with: hb-exod-14-crossing-of-the-sea
        motif: sea-split-by-staff-and-east-wind
        refs: ["26:63"]
        with_refs: ["Exod 14:16", "Exod 14:21"]
