  - unit: quran-28-pharaoh-oppression-infant-moses
    checked: [hb-exod-2-moses-birth-flight-midian, hb-exod-1-oppression-midwives, hb-gen-21-isaac-born-hagar-expelled, hb-gen-25-jacob-esau-birth]
    matches:
