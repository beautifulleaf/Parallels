      - with: hb-2chr-9-queen-of-sheba-and-solomons-glory
        motif: caravan-of-spices-gold-gems
        refs: ["27:35", "27:36", "27:37"]
        with_refs: ["2Chr 9:1", "2Chr 9:9", "2Chr 9:12"]
        relation: divergence
        note: "The gifts: Chronicles has the queen bring 120 talents of gold, spices and gems, which Solomon accepts, and he gives her all she desires (nātan ... ʾet kol ḥefṣāh). In the Quran she sends a gift (hadiyya) to test him, and Solomon refuses it, a-tumiddūnani bi-mālin fa-mā ātāniya llāhu khayrun mimmā ātākum, and threatens to invade with armies they cannot resist."
      - with: hb-2chr-9-queen-of-sheba-and-solomons-glory
        motif: breathless-at-royal-splendor
        refs: ["27:44"]
        with_refs: ["2Chr 9:3", "2Chr 9:4"]
        relation: divergence
        note: "The queen overwhelmed by Solomon's building: Chronicles has her see the house he built (wə-hab-bayit ʾăšer bānâ) until wə-lōʾ hāyâ ʿôd bāh rûaḥ; the Quran has the palace of smooth glass (ṣarḥun mumarradun min qawārīr) that she takes for deep water (ḥasibathu lujjatan) and uncovers her legs. Awe becomes a test she fails and then learns from. cf. Targum Sheni Esther 1:2 (glass floor), outside the HB."
      - with: hb-2chr-9-queen-of-sheba-and-solomons-glory
        motif: foreign-ruler-blesses-israels-god
        refs: ["27:44"]
        with_refs: ["2Chr 9:8"]
        relation: divergence
        note: "The queen's last word: Chronicles has a blessing of Solomon's God, yəhî YHWH ʾĕlōhêkā bārûkh ʾăšer ḥāfēṣ bəkhā lə-tittəkhā ʿal kisʾô, 'your God', praised for Israel's king. The Quran has a conversion: rabbi innī ẓalamtu nafsī wa-aslamtu maʿa Sulaymāna lillāhi rabbi l-ʿālamīn, after the hoopoe reported that she and her people worshipped the sun (27:24). Chronicles never calls her an idolater."
      - with: hb-2chr-9-queen-of-sheba-and-solomons-glory
        motif: ivory-throne-six-steps-lions
        refs: ["27:23", "27:38", "27:40"]
        with_refs: ["2Chr 9:17"]
        relation: divergence
        note: "The great throne: Chronicles praises Solomon's own (wa-yyaʿaś ham-melekh kissēʾ šēn gādôl wa-yṣappēhû zāhāv ṭāhôr); in the Quran the great throne is the queen's (wa-lahā ʿarshun ʿaẓīmun), and Solomon has it carried to him in the blink of an eye by one with knowledge of the Book."
      - with: hb-1kgs-10-queen-of-sheba
        motif: foreigner-confesses-god-greatest
        refs: ["27:44"]
        with_refs: ["1Kgs 10:9"]
        relation: divergence
        note: "As in 2Chr 9:8: the Kings queen blesses 'YHWH your God' for loving Israel and setting Solomon on the throne of Israel; the Quran's queen submits with Solomon to the Lord of the worlds. A foreigner's praise of Israel's God becomes a conversion to the universal Lord."
      - with: hb-1kgs-5-dominion-wisdom
        motif: wise-king-speaks-of-plants-and-animals
        refs: ["27:16", "27:19"]
        with_refs: ["1Kgs 5:13"]
        relation: divergence
        note: "Solomon and the animals: 1Kgs wa-ydabbēr ʿal hab-bəhēmâ wə-ʿal hā-ʿôf wə-ʿal hā-remeś wə-ʿal had-dāgîm, he spoke about beasts and birds (wisdom about them); the Quran has ʿullimnā manṭiqa ṭ-ṭayri, he was taught the speech of birds, and he understands an ant and talks with a hoopoe. Knowledge about animals becomes conversation with them."
      - with: hb-prov-30-numerical-sayings
        motif: ant-stores-food-in-summer
        refs: ["27:18"]
        with_refs: ["Prov 30:25"]
        relation: echo
        note: "qālat namlatun yā ayyuhā n-namlu dkhulū masākinakum ~ han-nəmālîm ʿam lōʾ ʿāz wa-yyākhînû vaq-qayiṣ laḥmām: the ants as a 'people' (ʿam / namlu addressed as a community) who are small but wise; Proverbs praises their foresight, the Quran's ant protects her people from Solomon's army."
      - with: hb-prov-6-surety-ant-scoundrel
        motif: go-to-the-ant-sluggard
        refs: ["27:18", "27:19"]
        with_refs: ["Prov 6:6"]
        relation: echo
        note: "lēkh ʾel nəmālâ ʿāṣēl rəʾēh dərākhêhā wa-ḥăkhām ~ fa-tabassama ḍāḥikan min qawlihā: the wise ant, a model to learn from; in Proverbs the attributed author is Solomon, in the Quran it is Solomon who listens to an ant."
      - with: hb-lev-11-dietary-laws
        motif: hoopoe-named
        refs: ["27:20"]
        with_refs: ["Lev 11:19"]
        relation: contrast
        note: "al-hudhud ~ wə-ʾet had-dûkhîfat: the hoopoe appears in the HB only as an unclean bird not to be eaten; in the Quran it is Solomon's scout and envoy who knows what Solomon does not (aḥaṭtu bimā lam tuḥiṭ bihi)."
      - with: hb-josh-2-rahab
        motif: foreigner-confesses-israels-god
        refs: ["27:44"]
        with_refs: ["Josh 2:11"]
        relation: echo
        note: "aslamtu maʿa Sulaymāna lillāhi rabbi l-ʿālamīna ~ kî YHWH ʾĕlōhêkem hûʾ ʾĕlōhîm ba-ššāmayim mimmaʿal wə-ʿal hā-ʾāreṣ mittāḥat: a foreign woman confesses the God of heaven and earth after hearing of his power. Rahab says 'your God', the queen 'with Solomon, to the Lord of the worlds'."
      - with: hb-2kgs-20-hezekiah-illness-babylon
        motif: babylonian-embassy-shown-treasures
        refs: ["27:35", "27:36"]
        with_refs: ["2Kgs 20:12", "2Kgs 20:13"]
        relation: contrast
        note: "A foreign ruler's envoys with a gift: Merodach-baladan sends səfārîm û-minḥâ and Hezekiah welcomes them and proudly shows all his treasures (wa-yyarʾēm ʾet kol bêt nəkhōtōh), which brings the prophecy of their loss; the queen sends a hadiyya and Solomon scorns the wealth, mā ātāniya llāhu khayrun mimmā ātākum."
      - with: hb-esth-1-vashti-deposed
        motif: queen-consults-her-council
        refs: ["27:32", "27:33"]
        with_refs: ["Esth 1:13", "Esth 1:14"]
        relation: echo
        note: "yā ayyuhā l-malaʾu aftūnī fī amrī mā kuntu qāṭiʿatan amran ḥattā tashhadūni ~ wa-yyōʾmer ham-melekh la-ḥăkhāmîm yōdʿê hā-ʿittîm: a ruler consults the council before deciding on a crisis involving a queen; in Esther the king about the defiant Vashti, in the Quran the queen herself about Solomon's letter."
  - unit: quran-27-salih-nine-plotters
