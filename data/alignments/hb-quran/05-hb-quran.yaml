      - with: hb-1kgs-18-carmel
        motif: contest-with-court-magicians
        refs: ["26:46", "26:49", "26:50"]
        with_refs: ["1Kgs 18:39", "1Kgs 18:40"]
        relation: contrast
        note: "Ending of a public contest between God's prophet and the king's religious specialists. Carmel: the people fall on their faces (wa-yyippəlû ʿal pənêhem) crying YHWH hûʾ hā-ʾĕlōhîm, and the defeated prophets of Baal are slaughtered by the prophet (wa-yyišḥāṭēm šām). Q 26: the defeated specialists themselves fall prostrate and believe, and the tyrant threatens to kill them (la-uqaṭṭiʿanna ... wa-la-uṣallibannakum ajmaʿīn); they answer lā ḍayra innā ilā rabbinā munqalibūn."
      - with: hb-exod-14-crossing-of-the-sea
        motif: king-regrets-release-and-pursues
        refs: ["26:52", "26:53", "26:60"]
        with_refs: ["Exod 14:4", "Exod 14:5", "Exod 14:8"]
        relation: divergence
        note: "Motive for the pursuit: Exodus gives Pharaoh's regret (mah zōʾt ʿāśînû kî šillaḥnû ʾet Yiśrāʾēl mēʿovdēnû) and God hardening his heart so he will pursue and God be glorified (wə-ḥizzaqtî ʾet lēv Parʿōh wə-rādaf ʾaḥărêhem wə-ʾikkāvədâ bə-Farʿōh); Q 26:52 says only that God warned Moses 'innakum muttabaʿūn', and 26:54-55 gives Pharaoh's contempt (la-shirdhimatun qalīlūna ... la-ghāʾiẓūn). There is no regret over losing slaves and no hardening."
      - with: hb-exod-14-crossing-of-the-sea
        motif: enemy-army-gathered-from-cities
        refs: ["26:53", "26:56"]
        with_refs: ["Exod 14:6", "Exod 14:7"]
