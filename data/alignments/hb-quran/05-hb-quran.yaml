  - unit: quran-25-hell-and-the-day-of-angels
    checked: [hb-jer-23-against-prophets, hb-isa-63-communal-lament, hb-job-1-prologue-first-test, hb-exod-33-tent-and-glory, hb-ps-1-two-ways]
