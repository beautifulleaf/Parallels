      - with: hb-hos-12-jacob
        motif: serving-seven-years-for-bride
        refs: ["28:27"]
        with_refs: ["Hos 12:13"]
        relation: echo
        note: "ʿalā an taʾjuranī thamāniya ḥijajin ~ wa-yyivraḥ Yaʿăqōv śədēh ʾĂrām wa-yyaʿăvōd Yiśrāʾēl bə-ʾiššâ û-və-ʾiššâ šāmār: flight to a foreign land and herding service for a wife. Hosea's line fits Moses as well as Jacob."
      - with: hb-gen-24-bride-for-isaac
        motif: meeting-future-wife-at-well
        refs: ["28:23", "28:25"]
        with_refs: ["Gen 24:11", "Gen 24:13", "Gen 24:14"]
