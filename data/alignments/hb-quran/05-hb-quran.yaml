        refs: ["24:41"]
        with_refs: ["Ps 148:10"]
        relation: parallel
        note: "yusabbiḥu lahu man fī s-samāwāti wa-l-arḍi wa-ṭ-ṭayru ṣāffātin kullun qad ʿalima ṣalātahu wa-tasbīḥahu ~ ha-ḥayyâ wə-khol bəhēmâ remeś wə-ṣippôr kānāf ... yəhaləlû ʾet šēm YHWH: birds join the praise of all creation. The Psalm calls them to praise; the Quran says each already knows its own prayer."
