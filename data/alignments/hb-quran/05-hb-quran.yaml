      - with: hb-isa-43-you-are-my-witnesses
        motif: israel-as-gods-witnesses
        refs: ["24:55"]
        with_refs: ["Isa 43:10", "Isa 43:12"]
        relation: echo
        note: "yaʿbudūnanī lā yushrikūna bī shayʾan ~ wə-ʾên bākem zār wə-ʾattem ʿēday nəʾum YHWH wa-ʾănî ʾēl: a chosen people defined by having no other god among them."
  - unit: quran-24-household-etiquette
