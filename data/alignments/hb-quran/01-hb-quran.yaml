        refs: ["2:213"]
        with_refs: ["Gen 11:1", "Gen 11:8"]
        relation: divergence
        note: "Gen 11:1, 8 wa-yhî kol hā-ʾāreṣ śāpâ ʾeḥāt ... wa-yyāpeṣ YHWH ʾōtām: mankind of one speech, scattered by God; Q 2:213 kāna n-nāsu ummatan wāḥidatan fa-baʿatha llāhu n-nabiyyīna ... wa-mā khtalafa fīhi illā lladhīna ūtūhu ... baghyan baynahum: mankind one community, then prophets and the Book sent, and division caused by those who received it, out of mutual envy. Original unity in both; its end is God's act in Genesis and human rivalry over scripture in the Quran."
  - unit: quran-2-wine-marriage
    checked: [hb-neh-10-sealed-covenant, hb-lev-20-penalties, hb-lev-18-forbidden-unions, hb-mal-2-faithless-marriage, hb-ezek-16-foundling-bride, hb-deut-7-chosen-people, hb-prov-20-sayings, hb-prov-23-drunkard, hb-ps-104-creation-hymn]
    matches:
      - with: hb-deut-7-chosen-people
        motif: marriage-ban-with-outsiders
        refs: ["2:221"]
        with_refs: ["Deut 7:3", "Deut 7:4"]
