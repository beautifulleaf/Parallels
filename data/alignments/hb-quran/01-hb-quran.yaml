  - unit: quran-2-war-pilgrimage
    checked: [hb-num-6-nazirite, hb-ps-74-leviathan, hb-ps-122-peace-of-jerusalem, hb-ps-104-creation-hymn, hb-exod-34-thirteen-attributes-covenant-renewal, hb-exod-20-decalogue, hb-gen-1-creation-six-days, hb-exod-23-justice-sabbatical-festivals, hb-deut-20-rules-of-war]
