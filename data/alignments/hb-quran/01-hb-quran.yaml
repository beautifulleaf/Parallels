      - with: hb-exod-22-apodictic-and-social-laws
        motif: god-hears-cry-of-widow-and-orphan
        refs: ["4:9", "4:10"]
        with_refs: ["Exod 22:21", "Exod 22:22", "Exod 22:23"]
