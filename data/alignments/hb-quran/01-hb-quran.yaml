        note: "Exod 22:21-23 kol ʾalmānâ wĕ-yātôm lōʾ tĕʿannûn ... wĕ-hāyû nĕšêkem ʾalmānôt û-bĕnêkem yĕtōmîm: oppress no widow or orphan, or your own wives and sons will become widows and orphans; Q 4:9 wa-l-yakhsha lladhīna law tarakū min khalfihim dhurriyyatan ḍiʿāfan khāfū ʿalayhim: let them fear as they would for the weak children they would leave behind. Both make the oppressor imagine his own children orphaned."
