  - unit: quran-2-fasting
    checked: [hb-ps-145-ashrei, hb-prov-17-sayings, hb-exod-23-justice-sabbatical-festivals, hb-ps-55-dove-wings, hb-joel-2-army-and-repentance, hb-lev-23-festival-calendar, hb-lev-16-day-of-atonement, hb-deut-4-exhortation]
