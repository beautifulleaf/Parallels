  - unit: quran-3-misers-mockers
    checked: [hb-lev-9-eighth-day-inauguration, hb-prov-19-sayings, hb-neh-9-levites-confession, hb-jer-2-harlot-vine-camel, hb-1kgs-18-carmel, hb-jer-7-obedience-not-sacrifice, hb-1kgs-19-elijah-horeb, hb-ps-50-divine-lawsuit, hb-ps-89-ethan-davidic-covenant, hb-mal-3-book-of-remembrance]
    matches:
      - with: hb-1kgs-18-carmel
        motif: fire-consumed-offering-as-proof
        refs: ["3:183"]
        with_refs: ["1Kgs 18:24", "1Kgs 18:38"]
        relation: response
        note: "1Kgs 18:24, 38 wĕ-hāyâ hā-ʾĕlōhîm ʾăšer yaʿăneh bā-ʾēš hûʾ hā-ʾĕlōhîm ... wa-ttippōl ʾēš YHWH wa-ttōʾkal ʾet hā-ʿōlâ: the god who answers by fire is God, and the fire eats the offering; Q 3:183 qālū inna llāha ʿahida ilaynā allā nuʾmina li-rasūlin ḥattā yaʾtiyanā bi-qurbānin taʾkuluhu n-nāru qul qad jāʾakum rusulun min qablī bi-l-bayyināti wa-bi-lladhī qultum fa-li-ma qataltumūhum: they claim God made them promise to believe no messenger without an offering 'the fire eats' (ʾākal / akala); answer: messengers did bring it, so why did you kill them? The Carmel test is turned into the opponents' demand, and the demand is refuted from their own history."
      - with: hb-1kgs-19-elijah-horeb
        motif: prophets-killed-by-israel
        refs: ["3:183"]
        with_refs: ["1Kgs 19:10"]
        relation: echo
        note: "1Kgs 19:10 ʿāzĕbû bĕrîtĕkā bĕnê yiśrāʾēl ... wĕ-ʾet nĕbîʾêkā hārĕgû be-ḥāreb ... wa-yĕbaqšû ʾet napšî: right after the fire on Carmel, Elijah complains that Israel killed the prophets and seek his life; Q 3:183 qad jāʾakum rusulun ... wa-bi-lladhī qultum fa-li-ma qataltumūhum: prophets came with the fire sign and you killed them. Kings gives the narrative sequence the Quran's retort assumes."
      - with: hb-lev-9-eighth-day-inauguration
        motif: heavenly-fire-consumes-offering
        refs: ["3:183"]
        with_refs: ["Lev 9:24"]
        relation: echo
        note: "Lev 9:24 wa-tteṣēʾ ʾēš mi-lipnê YHWH wa-ttōʾkal ʿal ha-mmizbēaḥ ʾet hā-ʿōlâ: fire from God eats the offering at the inauguration of the cult; Q 3:183 bi-qurbānin taʾkuluhu n-nāru: an offering the fire eats, as the claimed covenant sign."
      - with: hb-ps-50-divine-lawsuit
        motif: divine-need-and-human-wealth
        refs: ["3:181"]
        with_refs: ["Ps 50:12"]
        relation: contrast
        note: "Ps 50:12 ʾim ʾerʿab lōʾ ʾōmar lāk kî lî tēbēl û-mĕlōʾāh: 'if I were hungry I would not tell you, for the world is mine'; Q 3:181 la-qad samiʿa llāhu qawla lladhīna qālū inna llāha faqīrun wa-naḥnu aghniyāʾ: God heard those who said 'God is poor and we are rich'. God's self-sufficiency asserted by God in the psalm; mocked by men in the Quran, and answered at 3:180 wa-li-llāhi mīrāthu s-samāwāti wa-l-arḍ."
      - with: hb-prov-19-sayings
        motif: lending-to-yhwh-by-giving-to-poor
        refs: ["3:181"]
        with_refs: ["Prov 19:17"]
        relation: echo
        note: "Prov 19:17 malwēh YHWH ḥônēn dāl: giving to the poor is lending to God; Q 3:181 inna llāha faqīrun wa-naḥnu aghniyāʾ: the mockers turn the idea of lending to God (cf. Q 2:245) into 'God is poor'. Lead from the unit's hint; the link is a reading, not a quotation."
      - with: hb-neh-9-levites-confession
        motif: scripture-cast-behind-backs
        refs: ["3:187"]
        with_refs: ["Neh 9:26"]
        relation: parallel
        note: "Neh 9:26 wa-yyašlikû ʾet tôrātĕkā ʾaḥărê gawwām; Q 3:187 wa-idh akhadha llāhu mīthāqa lladhīna ūtū l-kitāba la-tubayyinunnahu li-n-nāsi wa-lā taktumūnahu fa-nabadhūhu warāʾa ẓuhūrihim: they cast it behind their backs. The same picture in the same words (ʾaḥărê gawwām / warāʾa ẓuhūrihim); the Quran adds a covenant to make the Book clear."
      - with: hb-neh-9-levites-confession
        motif: prophets-killed-by-israel
        refs: ["3:181", "3:183"]
        with_refs: ["Neh 9:26"]
        relation: parallel
        note: "Neh 9:26 wĕ-ʾet nĕbîʾêkā hārāgû; Q 3:181 wa-qatlahumu l-anbiyāʾa bi-ghayri ḥaqqin, 3:183 fa-li-ma qataltumūhum."
      - with: hb-jer-2-harlot-vine-camel
        motif: prophets-killed-by-israel
        refs: ["3:183"]
        with_refs: ["Jer 2:30"]
        relation: parallel
        note: "Jer 2:30 ʾākĕlâ ḥarbĕkem nĕbîʾêkem; Q 3:183 fa-li-ma qataltumūhum."
      - with: hb-jer-7-obedience-not-sacrifice
        motif: god-sent-prophets-persistently
        refs: ["3:184"]
        with_refs: ["Jer 7:25", "Jer 7:26"]
        relation: echo
        note: "Jer 7:25-26 wā-ʾešlaḥ ʾălêkem ʾet kol ʿăbāday ha-nnĕbîʾîm ... wĕ-lôʾ šāmĕʿû ʾēlay: God sent all his prophets and they did not listen; Q 3:184 fa-in kadhdhabūka fa-qad kudhdhiba rusulun min qablika jāʾū bi-l-bayyināti wa-z-zuburi: messengers before you were denied too. A history of rejected messengers, used in Jeremiah to indict, in the Quran to console the prophet."
      - with: hb-ps-89-ethan-davidic-covenant
        motif: none-escapes-sheol
        refs: ["3:185"]
        with_refs: ["Ps 89:49"]
        relation: echo
        note: "Ps 89:49 mî geber yiḥyeh wĕ-lōʾ yirʾeh māwet yĕmallēṭ napšô mi-yyad šĕʾôl; Q 3:185 kullu nafsin dhāʾiqatu l-mawti wa-innamā tuwaffawna ujūrakum yawma l-qiyāma: every soul tastes death. The psalm ends in Sheol; the Quran in the reckoning of the Day of Resurrection."
      - with: hb-mal-3-book-of-remembrance
        motif: god-separates-bad-from-good
        refs: ["3:179"]
        with_refs: ["Mal 3:18"]
        relation: echo
        note: "Mal 3:18 wĕ-šabtem û-rĕʾîtem bên ṣaddîq lĕ-rāšāʿ bên ʿōbēd ʾĕlōhîm la-ʾăšer lōʾ ʿăbādô; Q 3:179 mā kāna llāhu li-yadhara l-muʾminīna ʿalā mā antum ʿalayhi ḥattā yamīza l-khabītha mina ṭ-ṭayyib: God will separate the bad from the good. In Malachi on the coming day; in the Quran through present trials."
  - unit: quran-3-closing
