# Chunk 1 of the HB x Quran side-by-side comparison (Q 1 - Q 4:43).
new_motifs:
  people-break-gods-covenant: {label: "The people break the covenant God made with them", cluster: covenant}
  covenant-kept-reciprocally: {label: "If the people keep God's covenant, God keeps his covenant with them", cluster: covenant}
reviewed:
  - unit: quran-1-fatiha
    checked: [hb-ps-1-two-ways, hb-ps-86-none-like-you, hb-prov-4-get-wisdom, hb-prov-2-search-for-wisdom, hb-ps-75-cup, hb-ps-85-righteousness-and-peace, hb-ps-27-my-light, hb-ps-145-ashrei, hb-ps-143-none-righteous]
    matches:
      - with: hb-ps-1-two-ways
        motif: two-ways-righteous-and-wicked
        refs: ["1:6", "1:7"]
        with_refs: ["Ps 1:1", "Ps 1:6"]
        relation: divergence
        note: "Ps 1:6 derek ṣaddîqîm / derek rĕšāʿîm tōʾbēd: two ways, stated as a beatitude (ʾašrê hā-ʾîš); Q 1:7 ṣirāṭa lladhīna anʿamta ʿalayhim ghayri l-maghḍūbi ʿalayhim wa-lā ḍ-ḍāllīn: the way of the favoured set against two failed ways (under wrath, gone astray), and voiced as a petition (ihdinā) rather than a wisdom statement. Two ways become three."
      - with: hb-ps-27-my-light
        motif: prayer-for-straight-path
        refs: ["1:6"]
        with_refs: ["Ps 27:11"]
        relation: echo
        note: "Ps 27:11 hôrēnî YHWH darkekā û-nĕḥēnî bĕ-ʾōraḥ mîšôr 'teach me your way, lead me on a level path' ~ Q 1:6 ihdinā ṣ-ṣirāṭa l-mustaqīm 'guide us on the straight path': imperative petition for guidance on the even/straight road (mîšôr / mustaqīm); singular 'me' vs communal 'us'."
      - with: hb-ps-86-none-like-you
        motif: prayer-for-straight-path
        refs: ["1:6"]
        with_refs: ["Ps 86:11"]
        relation: echo
        note: "Ps 86:11 hôrēnî YHWH darkekā ʾăhallēk baʾămittekā ~ Q 1:6 ihdinā ṣ-ṣirāṭa l-mustaqīm; same petition form (teach/guide + way)."
      - with: hb-ps-86-none-like-you
        motif: divine-names-rahman-rahim
        refs: ["1:1", "1:3"]
        with_refs: ["Ps 86:15"]
        relation: echo
        note: "Ps 86:15 ʾēl raḥûm wĕ-ḥannûn ʾerek ʾappayim: raḥûm is one adjective in the attribute formula; Q 1:1, 1:3 ar-raḥmān ar-raḥīm: two r-ḥ-m forms paired as names, opening the text. Same root, the formula's adjective made into a pair of titles."
      - with: hb-ps-143-none-righteous
        motif: prayer-for-straight-path
        refs: ["1:6"]
        with_refs: ["Ps 143:10"]
        relation: echo
        note: "Ps 143:10 rûḥăkā ṭôbâ tanḥēnî bĕ-ʾereṣ mîšôr 'lead me in a level land' ~ Q 1:6 ihdinā ṣ-ṣirāṭa l-mustaqīm."
      - with: hb-ps-145-ashrei
        motif: praise-to-lord-of-worlds
        refs: ["1:2"]
        with_refs: ["Ps 145:1", "Ps 145:13"]
        relation: echo
        note: "Ps 145:13 malkûtkā malkût kol ʿōlāmîm 'a kingdom of all ages', Ps 145:1 ʾărômimkā ʾĕlôhay ha-melek ~ Q 1:2 al-ḥamdu li-llāhi rabbi l-ʿālamīn. Cognate plural ʿōlāmîm / ʿālamīn, but temporal 'ages' in the psalm vs 'worlds, creatures' in the Quran; king (melek) vs lord (rabb), with the kingship moved to 1:4 māliki yawmi d-dīn."
      - with: hb-ps-145-ashrei
        motif: divine-names-rahman-rahim
        refs: ["1:3"]
        with_refs: ["Ps 145:8", "Ps 145:9"]
        relation: echo
        note: "Ps 145:8-9 ḥannûn wĕ-raḥûm YHWH ... wĕ-raḥămāyw ʿal kol maʿăśāyw ~ Q 1:3 ar-raḥmān ar-raḥīm, in a hymn of praise to the divine king in both."
      - with: hb-ps-75-cup
        motif: master-of-day-of-judgment
        refs: ["1:4"]
        with_refs: ["Ps 75:3", "Ps 75:8"]
        relation: echo
        note: "Ps 75:3 kî ʾeqqaḥ môʿēd ʾănî mêšārîm ʾešpōṭ, 75:8 ʾĕlōhîm šōpēṭ: God fixes the appointed time (môʿēd) of judgment; Q 1:4 māliki yawmi d-dīn: God owns the Day of Judgment. Weak: no eschatological 'day' in the psalm."
      - with: hb-prov-2-search-for-wisdom
        motif: two-ways-righteous-and-wicked
        refs: ["1:7"]
        with_refs: ["Prov 2:13", "Prov 2:20"]
        relation: parallel
        note: "Prov 2:13 ha-ʿōzĕbîm ʾorḥôt yōšer lāleket bĕ-darkê ḥōšek, 2:20 bĕ-derek ṭôbîm ~ Q 1:7 ṣirāṭa lladhīna anʿamta ʿalayhim ... wa-lā ḍ-ḍāllīn: those who leave the straight paths (yōšer) vs those who go astray (ḍāllīn) from the straight path."
      - with: hb-prov-4-get-wisdom
        motif: prayer-for-straight-path
        refs: ["1:6"]
        with_refs: ["Prov 4:11"]
        relation: echo
        note: "Prov 4:11 bĕ-derek ḥokmâ hōrētîkā hidraktîkā bĕ-maʿgĕlê yōšer: the father teaches and leads in straight tracks; Q 1:6 ihdinā ṣ-ṣirāṭa l-mustaqīm asks God for the same guidance. Human teacher vs God as guide."
  - unit: quran-2-three-groups
    checked: [hb-isa-6-throne-vision, hb-isa-43-you-are-my-witnesses, hb-isa-42-servant-and-new-song, hb-isa-29-ariel-and-sealed-book, hb-ps-17-apple-of-eye, hb-deut-31-joshua-torah-song, hb-isa-5-vineyard-and-woes, hb-prov-3-tree-of-life, hb-ps-2-anointed-son]
    matches:
      - with: hb-isa-6-throne-vision
        motif: commission-to-harden-hearts
        refs: ["2:6", "2:7"]
        with_refs: ["Isa 6:9", "Isa 6:10"]
        relation: divergence
        note: "Same triad in the same order: Isa 6:10 hašmēn lēb hā-ʿām ... wĕ-ʾoznāyw hakbēd wĕ-ʿênāyw hāšaʿ (heart, ears, eyes); Q 2:7 khatama llāhu ʿalā qulūbihim wa-ʿalā samʿihim wa-ʿalā abṣārihim ghishāwatun (hearts, hearing, eyes). Who acts changes: in Isaiah the prophet is ordered to do the hardening (imperatives to Isaiah); in the Quran God himself seals, and the prophet's role is only that his warning makes no difference (sawāʾun ʿalayhim a-andhartahum am lam tundhirhum, 2:6)."
      - with: hb-isa-6-throne-vision
        motif: commission-to-harden-hearts
        refs: ["2:10", "2:18"]
        with_refs: ["Isa 6:10"]
        relation: echo
        note: "Isa 6:10 pen ... ûlĕbābô yābîn wā-šāb wĕ-rāpāʾ lô 'lest it understand, turn and be healed'; Q 2:18 fa-hum lā yarjiʿūn 'so they do not turn back' and 2:10 fī qulūbihim maraḍun fa-zādahumu llāhu maraḍan 'disease in their hearts, and God increased it': the turning (šûb / rajaʿa) and the healing (rāpāʾ) of Isaiah reappear as no return and a disease God increases."
      - with: hb-isa-43-you-are-my-witnesses
        motif: blind-and-deaf-servant
        refs: ["2:18"]
        with_refs: ["Isa 43:8"]
        relation: divergence
        note: "Isa 43:8 ʿam ʿiwwēr wĕ-ʿênayim yēš wĕ-ḥērĕšîm wĕ-ʾoznayim lāmô 'a blind people that has eyes, deaf that have ears' (Israel, God's own witnesses); Q 2:18 ṣummun bukmun ʿumyun 'deaf, dumb, blind' of the hypocrites. The target moves from God's people, to be led out, to the unbelievers, who will not return."
      - with: hb-isa-42-servant-and-new-song
        motif: blind-and-deaf-servant
        refs: ["2:18"]
        with_refs: ["Isa 42:18", "Isa 42:19", "Isa 42:20"]
        relation: divergence
        note: "Isa 42:19 mî ʿiwwēr kî ʾim ʿabdî wĕ-ḥērēš kĕ-malʾākî ʾešlāḥ: God's own servant and messenger is blind and deaf; Q 2:18 ṣummun bukmun ʿumyun is said of those who reject the messenger, never of the messenger. The servant's blindness is moved onto his opponents."
      - with: hb-isa-29-ariel-and-sealed-book
        motif: god-seals-hearts-ears-eyes
        refs: ["2:7"]
        with_refs: ["Isa 29:10"]
        relation: parallel
        note: "Isa 29:10 kî nāsak ʿălêkem YHWH rûaḥ tardēmâ wa-yĕʿaṣṣēm ʾet ʿênêkem ... kissâ: God pours a spirit of stupor, shuts their eyes and covers the seers; Q 2:7 ʿalā abṣārihim ghishāwatun 'over their eyes a covering' set by God."
      - with: hb-isa-29-ariel-and-sealed-book
        motif: book-without-doubt
        refs: ["2:2", "2:7"]
        with_refs: ["Isa 29:11"]
        relation: contrast
        note: "The seal changes place: Isa 29:11 ka-dibrê ha-sēper he-ḥātûm ... lōʾ ʾûkal kî ḥātûm hûʾ 'like the words of a sealed book ... I cannot, for it is sealed': the vision is a sealed, unreadable book; Q 2:2 dhālika l-kitābu lā rayba fīhi hudan: the Book is open and without doubt, and it is the unbelievers' hearts that are sealed (khatama, 2:7). Same root ḥ-t-m / kh-t-m."
      - with: hb-isa-29-ariel-and-sealed-book
        motif: lip-service-heart-far
        refs: ["2:8", "2:10"]
        with_refs: ["Isa 29:13"]
        relation: parallel
        note: "Isa 29:13 bĕ-pîw û-bi-śpātāyw kibbĕdûnî wĕ-libbô riḥaq mimmennî: honour with mouth and lips, heart far; Q 2:8 man yaqūlu āmannā bi-llāhi ... wa-mā hum bi-muʾminīn, 2:10 fī qulūbihim maraḍun: faith professed with the tongue, disease in the heart."
      - with: hb-isa-29-ariel-and-sealed-book
        motif: deceivers-deceived-by-god
        refs: ["2:9"]
        with_refs: ["Isa 29:15"]
        relation: echo
        note: "Isa 29:15 hôy ha-maʿămîqîm mē-YHWH lastir ʿēṣâ ... wa-yōʾmĕrû mî rōʾēnû: hiding plans from God; Q 2:9 yukhādiʿūna llāha wa-lladhīna āmanū wa-mā yakhdaʿūna illā anfusahum wa-mā yashʿurūn: trying to deceive God, deceiving only themselves."
      - with: hb-isa-5-vineyard-and-woes
        motif: calling-evil-good
        refs: ["2:11", "2:12", "2:13"]
        with_refs: ["Isa 5:20", "Isa 5:21"]
        relation: echo
        note: "Isa 5:20 hôy hā-ʾōmĕrîm lā-raʿ ṭôb ..., 5:21 hôy ḥăkāmîm bĕ-ʿênêhem: those who call evil good and are wise in their own eyes; Q 2:11-12 lā tufsidū fī l-arḍi qālū innamā naḥnu muṣliḥūn / alā innahum humu l-mufsidūn: the corrupters call themselves reformers, and 2:13 call believers fools (sufahāʾ) and are the fools."
      - with: hb-prov-3-tree-of-life
        motif: god-scorns-scorners-gives-grace-to-humble
        refs: ["2:14", "2:15"]
        with_refs: ["Prov 3:34"]
        relation: parallel
        note: "Measure for measure on the same verb: Prov 3:34 ʾim la-lēṣîm hûʾ yālîṣ 'the scorners he scorns'; Q 2:14-15 innamā naḥnu mustahziʾūn / allāhu yastahziʾu bihim 'we were only mocking / God mocks them'."
      - with: hb-ps-2-anointed-son
        motif: god-laughs-at-enemies
        refs: ["2:15"]
        with_refs: ["Ps 2:4"]
        relation: echo
        note: "Ps 2:4 yôšēb ba-šāmayim yiśḥāq ʾădōnāy yilʿag lāmô 'the Lord mocks them'; Q 2:15 allāhu yastahziʾu bihim wa-yamudduhum fī ṭughyānihim: God mocks the mockers."
  - unit: quran-2-call-to-worship
    checked: [hb-ps-135-hymn-of-election, hb-mal-3-tithes, hb-jer-51-oracle-babylon-2, hb-jer-31-consolation-new-covenant, hb-ps-78-history, hb-ps-104-creation-hymn, hb-isa-43-you-are-my-witnesses, hb-isa-41-trial-of-the-gods, hb-isa-9-child-born-and-outstretched-hand, hb-gen-2-eden-adam-woman]
    matches:
      - with: hb-ps-104-creation-hymn
        motif: god-gives-rain-and-harvest
        refs: ["2:22"]
        with_refs: ["Ps 104:13", "Ps 104:14"]
        relation: parallel
        note: "Ps 104:13-14 mašqeh hārîm mē-ʿăliyyôtāyw ... lĕhôṣîʾ leḥem min hā-ʾāreṣ; Q 2:22 wa-anzala mina s-samāʾi māʾan fa-akhraja bihi mina th-thamarāti rizqan lakum: rain from above brings out food from the earth (hôṣîʾ / akhraja)."
      - with: hb-ps-104-creation-hymn
        motif: heavens-stretched-like-tent
        refs: ["2:22"]
        with_refs: ["Ps 104:2"]
        relation: echo
        note: "Ps 104:2 nôṭeh šāmayim ka-yrîʿâ 'stretches out the heavens like a tent curtain'; Q 2:22 jaʿala lakumu l-arḍa firāshan wa-s-samāʾa bināʾan: earth a spread bed, sky a built canopy. Textile tent vs built structure; in the Quran both are made 'for you' (lakum)."
      - with: hb-ps-104-creation-hymn
        motif: two-deaths-two-lives
        refs: ["2:28"]
        with_refs: ["Ps 104:29", "Ps 104:30"]
        relation: divergence
        note: "Ps 104:29-30 tōsēp rûḥām yigwāʿûn ... tĕšallaḥ rûḥăkā yibbārēʾûn: God takes breath and creatures die, sends his spirit and they are created, a cycle within nature; Q 2:28 kuntum amwātan fa-aḥyākum thumma yumītukum thumma yuḥyīkum thumma ilayhi turjaʿūn: the same give-and-take of life told of each person and closed by resurrection and return to God."
      - with: hb-ps-135-hymn-of-election
        motif: heavenly-storehouse-of-rain
        refs: ["2:22"]
        with_refs: ["Ps 135:7"]
        relation: echo
        note: "Ps 135:7 bĕrāqîm la-māṭār ʿāśâ môṣēʾ rûaḥ mē-ʾôṣĕrôtāyw; Q 2:22 anzala mina s-samāʾi māʾan. In both, God sending rain is set against the idols (Ps 135:15 ʿăṣabbê ha-gôyim; Q 2:22 fa-lā tajʿalū li-llāhi andādan)."
      - with: hb-isa-43-you-are-my-witnesses
        motif: trial-of-nations-and-gods
        refs: ["2:23"]
        with_refs: ["Isa 43:9"]
        relation: echo
        note: "Isa 43:9 mî bāhem yaggîd zōʾt ... yittĕnû ʿēdêhem wĕ-yiṣdāqû 'let them bring their witnesses and be proved right'; Q 2:23 fa-ʾtū bi-sūratin min mithlihi wa-dʿū shuhadāʾakum min dūni llāhi in kuntum ṣādiqīn 'call your witnesses besides God, if you are truthful'. Same court-challenge diction (witnesses + ṣ-d-q). Isaiah challenges the gods to foretell; the Quran challenges the hearers to produce a scripture."
      - with: hb-isa-41-trial-of-the-gods
        motif: challenge-to-produce-a-surah
        refs: ["2:23", "2:24"]
        with_refs: ["Isa 41:21", "Isa 41:22", "Isa 41:23"]
        relation: divergence
        note: "Isa 41:21-23 qārĕbû rîbĕkem ... haggîdû hā-ʾōtiyyôt lĕ-ʾāḥôr wĕ-nēdĕʿâ kî ʾĕlōhîm ʾattem: the gods are challenged to tell what is to come and so prove they are gods; Q 2:23-24 fa-ʾtū bi-sūratin min mithlihi ... fa-in lam tafʿalū wa-lan tafʿalū: the opponents are challenged to produce one surah like it, with the answer given in advance (wa-lan tafʿalū). The proof moves from prediction to the text itself."
      - with: hb-isa-9-child-born-and-outstretched-hand
        motif: hellfire-fueled-by-men-and-stones
        refs: ["2:24"]
        with_refs: ["Isa 9:18"]
        relation: echo
        note: "Isa 9:18 wa-yhî hā-ʿām kĕ-maʾăkōlet ʾēš 'the people became fuel for the fire', in the wrath of YHWH on the land; Q 2:24 an-nāra llatī waqūduhā n-nāsu wa-l-ḥijāratu 'the fire whose fuel is people and stones', in the next world for the unbelievers. A historical burning becomes the eschatological fire."
      - with: hb-gen-2-eden-adam-woman
        motif: gardens-with-rivers-beneath
        refs: ["2:25"]
        with_refs: ["Gen 2:8", "Gen 2:10"]
        relation: echo
        note: "Gen 2:8, 2:10 gan bĕ-ʿēden ... wĕ-nāhār yōṣēʾ mē-ʿēden lĕhašqôt ʾet ha-gān: one garden in Eden watered by one river, at the beginning; Q 2:25 jannātin tajrī min taḥtihā l-anhāru: plural gardens and rivers, the reward at the end."
      - with: hb-jer-31-consolation-new-covenant
        motif: people-break-gods-covenant
        refs: ["2:27"]
        with_refs: ["Jer 31:32"]
        relation: echo
        note: "Jer 31:32 ʾăšer hēmmâ hēpērû ʾet bĕrîtî; Q 2:27 alladhīna yanquḍūna ʿahda llāhi min baʿdi mīthāqihi: those who break God's covenant after its pledge. Jeremiah answers with a new covenant; the Quran with 'they are the losers' (humu l-khāsirūn)."
  - unit: quran-2-adam-iblis
    checked: [hb-gen-3-fall-expulsion, hb-gen-2-eden-adam-woman, hb-gen-11-babel, hb-jer-31-consolation-new-covenant, hb-gen-1-creation-six-days, hb-gen-6-flood, hb-gen-9-noahide-covenant]
    matches:
      - with: hb-gen-1-creation-six-days
        motif: divine-plural-speech
        refs: ["2:30"]
        with_refs: ["Gen 1:26"]
        relation: divergence
        note: "Gen 1:26 wa-yyōʾmer ʾĕlōhîm naʿăśeh ʾādām bĕ-ṣalmēnû: God's plan for man is spoken to an unnamed 'us' who never answer; Q 2:30 wa-idh qāla rabbuka li-l-malāʾikati innī jāʿilun fī l-arḍi khalīfatan: the hearers are named as the angels, the speech is first person singular (innī), and the angels reply."
      - with: hb-gen-1-creation-six-days
        motif: human-as-vicegerent-khalifa
        refs: ["2:30"]
        with_refs: ["Gen 1:26", "Gen 1:28"]
        relation: divergence
        note: "Office of man on earth: Gen 1:26-28 bĕ-ṣalmēnû kidmûtēnû wĕ-yirdû ... wĕ-kibšuhā: made in God's image to rule the animals and subdue the earth; Q 2:30 jāʿilun fī l-arḍi khalīfatan: a successor/deputy on the earth, with no image or likeness."
      - with: hb-gen-6-flood
        motif: angels-object-to-human-creation
        refs: ["2:30"]
        with_refs: ["Gen 6:11", "Gen 6:12"]
        relation: echo
        note: "The angels' objection names what Genesis later reports: Q 2:30 a-tajʿalu fīhā man yufsidu fīhā wa-yasfiku d-dimāʾa 'one who will work corruption there and shed blood'; Gen 6:11-12 wa-ttiššāḥēt hā-ʾāreṣ ... wa-ttimmālēʾ hā-ʾāreṣ ḥāmās ... kî hišḥît kol bāśār ʾet darkô: the earth corrupted and filled with violence. In the Quran this comes before Adam's creation, as a forecast; in Genesis it is the cause of the flood. cf. Gen. Rabbah 8:5 for angels objecting (not a match)."
      - with: hb-gen-9-noahide-covenant
        motif: bloodshed-requires-bloodshed
        refs: ["2:30"]
        with_refs: ["Gen 9:6"]
        relation: echo
        note: "Cognate verb: Gen 9:6 šōpēk dam hā-ʾādām bā-ʾādām dāmô yiššāpēk kî bĕ-ṣelem ʾĕlōhîm ʿāśâ ʾet hā-ʾādām; Q 2:30 wa-yasfiku d-dimāʾa (s-f-k = š-p-k + dam/dimāʾ). In Genesis, man's bearing God's image is the reason his blood may not be shed; in the Quran the shedding of blood is the angels' charge against the new creature."
      - with: hb-gen-2-eden-adam-woman
        motif: adam-names-animals
        refs: ["2:31", "2:32", "2:33"]
        with_refs: ["Gen 2:19", "Gen 2:20"]
        relation: divergence
        note: "Who knows the names is reversed. Gen 2:19 wa-yyābēʾ ʾel hā-ʾādām lirʾôt mah yyiqrāʾ lô ... wa-yyiqrāʾ hā-ʾādām šēmôt: God brings the animals 'to see what he would call them' and the man invents the names; Q 2:31 wa-ʿallama ādama l-asmāʾa kullahā thumma ʿaraḍahum ʿalā l-malāʾikati: God teaches Adam all the names and displays the creatures to the angels as a test, ending innī aʿlamu ghayba s-samāwāti wa-l-arḍ (2:33). Human initiative before an observing God becomes knowledge given by an all-knowing God, and the scene becomes a contest with the angels."
      - with: hb-gen-2-eden-adam-woman
        motif: garden-of-god-in-east
        refs: ["2:35"]
        with_refs: ["Gen 2:8", "Gen 2:16"]
        relation: divergence
        note: "Gen 2:8 gan bĕ-ʿēden miqqedem, 2:16 mi-kkōl ʿēṣ ha-gān ʾākōl tōʾkēl (said to the man alone, before the woman is made); Q 2:35 uskun anta wa-zawjuka l-jannata wa-kulā minhā raghadan ḥaythu shiʾtumā: 'the Garden' with no place in the east, and the permission is given to both (dual) together."
      - with: hb-gen-2-eden-adam-woman
        motif: tree-of-knowledge-forbidden
        refs: ["2:35"]
        with_refs: ["Gen 2:17"]
        relation: divergence
        note: "Gen 2:17 û-mē-ʿēṣ ha-daʿat ṭôb wā-rāʿ lōʾ tōʾkal mimmennû kî bĕ-yôm ʾăkolkā mimmennû môt tāmût; Q 2:35 wa-lā taqrabā hādhihi sh-shajarata fa-takūnā mina ẓ-ẓālimīn. The tree has no name (no 'knowledge of good and evil'); the sanction is to become wrongdoers, not death."
      - with: hb-gen-3-fall-expulsion
        motif: tree-of-knowledge-forbidden
        refs: ["2:35"]
        with_refs: ["Gen 3:3"]
        relation: echo
        note: "Q 2:35 wa-lā taqrabā hādhihi sh-shajarata 'do not come near this tree' is God's own wording; in Genesis the extension is the woman's addition: Gen 3:3 lōʾ tōʾkĕlû mimmennû wĕ-lōʾ tiggĕʿû bô 'nor touch it', which God had not said (2:17)."
      - with: hb-gen-3-fall-expulsion
        motif: serpent-tempter
        refs: ["2:36"]
        with_refs: ["Gen 3:1", "Gen 3:13"]
        relation: divergence
        note: "Gen 3:1, 3:13 ha-nnāḥāš hāyâ ʿārûm ... ha-nnāḥāš hiššîʾanî: a cunning serpent deceives the woman, who eats first and gives to the man (3:6); Q 2:36 fa-azallahumā sh-shayṭānu ʿanhā: Satan makes both slip (dual). No serpent, no woman eating first, no woman as channel of the sin."
      - with: hb-gen-3-fall-expulsion
        motif: expulsion-from-paradise
        refs: ["2:36", "2:38"]
        with_refs: ["Gen 3:23", "Gen 3:24"]
        relation: divergence
        note: "Gen 3:23-24 wa-yšallĕḥēhû YHWH ʾĕlōhîm ... wa-ygāreš ʾet hā-ʾādām, with cherubim and a flaming sword guarding the tree of life: God drives the man out; Q 2:36 fa-akhrajahumā mimmā kānā fīhi: Satan is the subject who 'brought them out', then God's ihbiṭū 'go down' (2:36, 2:38), addressed to a plural. No cherubim, no tree of life."
      - with: hb-gen-3-fall-expulsion
        motif: enmity-serpent-and-woman-seed
        refs: ["2:36"]
        with_refs: ["Gen 3:15"]
        relation: divergence
        note: "Gen 3:15 wĕ-ʾêbâ ʾāšît bênkā û-bên hā-ʾiššâ û-bên zarʿăkā û-bên zarʿāh: enmity between serpent and woman and their offspring; Q 2:36 ihbiṭū baʿḍukum li-baʿḍin ʿaduwwun: 'some of you enemies to others' among those sent down. The same decree of enmity (ʾêbâ / ʿaduww) at the expulsion, with the serpent gone."
      - with: hb-gen-3-fall-expulsion
        motif: ground-cursed-toil
        refs: ["2:36"]
        with_refs: ["Gen 3:17", "Gen 3:19"]
        relation: divergence
        note: "Gen 3:17-19 ʾărûrâ hā-ʾădāmâ baʿăbûrekā bĕ-ʿiṣṣābôn tōʾkălennâ ... ʿad šûbĕkā ʾel hā-ʾădāmâ: cursed ground, toil and death; Q 2:36 wa-lakum fī l-arḍi mustaqarrun wa-matāʿun ilā ḥīn: on earth an abode and provision for a time. The curses on ground, woman and serpent are left out; the earth is a lodging and a time limit, not a curse."
      - with: hb-gen-3-fall-expulsion
        motif: adam-receives-words-of-repentance
        refs: ["2:37"]
        with_refs: ["Gen 3:12"]
        relation: divergence
        note: "The ending changes. Gen 3:12 hā-ʾiššâ ʾăšer nātattâ ʿimmādî hîʾ nātĕnâ-llî min hā-ʿēṣ wā-ʾōkēl: the man blames the woman (and God who gave her), with no repentance or pardon; Q 2:37 fa-talaqqā ādamu min rabbihi kalimātin fa-tāba ʿalayhi innahu huwa t-tawwābu r-raḥīm: Adam receives words and God turns to him in forgiveness before the descent. The Quran adds a reconciliation Genesis does not have."
  - unit: quran-2-israel-favor
    checked: [hb-ps-49-no-ransom, hb-ps-135-hymn-of-election, hb-mal-3-book-of-remembrance, hb-jer-31-consolation-new-covenant, hb-jer-30-time-of-jacobs-trouble, hb-isa-43-you-are-my-witnesses, hb-deut-7-chosen-people, hb-ps-50-divine-lawsuit, hb-mic-3-rulers-and-prophets, hb-neh-9-levites-confession]
    matches:
      - with: hb-deut-7-chosen-people
        motif: covenant-kept-reciprocally
        refs: ["2:40"]
        with_refs: ["Deut 7:9", "Deut 7:12"]
        relation: parallel
        note: "Deut 7:12 wĕ-hāyâ ʿēqeb tišmĕʿûn ... wĕ-šāmar YHWH ʾĕlōhêkā lĕkā ʾet ha-bĕrît, 7:9 šōmēr ha-bĕrît wĕ-ha-ḥesed lĕ-ʾōhăbāyw; Q 2:40 wa-awfū bi-ʿahdī ūfi bi-ʿahdikum 'fulfil my covenant and I will fulfil yours': the covenant kept on both sides, addressed to Israel."
      - with: hb-deut-7-chosen-people
        motif: chosen-treasured-people
        refs: ["2:47"]
        with_refs: ["Deut 7:6"]
        relation: parallel
        note: "Deut 7:6 bĕkā bāḥar YHWH ... lĕ-ʿam sĕgullâ mi-kkōl hā-ʿammîm; Q 2:47 wa-annī faḍḍaltukum ʿalā l-ʿālamīn. The Quran grants the election, but in the past tense, set inside a warning (2:48) rather than as a status."
      - with: hb-ps-135-hymn-of-election
        motif: chosen-treasured-people
        refs: ["2:47"]
        with_refs: ["Ps 135:4"]
        relation: parallel
        note: "Ps 135:4 kî yaʿăqōb bāḥar lô yāh yiśrāʾēl li-sgullātô; Q 2:47 yā banī isrāʾīla dhkurū niʿmatiya ... faḍḍaltukum ʿalā l-ʿālamīn."
      - with: hb-mal-3-book-of-remembrance
        motif: chosen-treasured-people
        refs: ["2:47", "2:48"]
        with_refs: ["Mal 3:17"]
        relation: divergence
        note: "Both tie election to the coming day. Mal 3:17 lay-yôm ʾăšer ʾănî ʿōśeh sĕgullâ wĕ-ḥāmaltî ʿălêhem: on God's day the faithful become his treasure and are spared; Q 2:47-48 faḍḍaltukum ... wa-ttaqū yawman lā tajzī nafsun ʿan nafsin shayʾan: past preference, followed by a day on which no favour, intercession or ransom avails."
      - with: hb-ps-49-no-ransom
        motif: no-ransom-for-a-brother
        refs: ["2:48"]
        with_refs: ["Ps 49:8", "Ps 49:9"]
        relation: parallel
        note: "Ps 49:8 ʾāḥ lōʾ pādōh yipdeh ʾîš lōʾ yittēn lēʾlōhîm kopsrô; Q 2:48 lā tajzī nafsun ʿan nafsin shayʾan ... wa-lā yuʾkhadhu minhā ʿadlun: no one can pay for another; no ransom/equivalent is taken. The psalm still keeps an exception, 49:16 ʾak ʾĕlōhîm yipdeh napšî; the Quran adds that no intercession (shafāʿa) is accepted."
      - with: hb-isa-43-you-are-my-witnesses
        motif: nations-given-as-ransom-for-israel
        refs: ["2:48"]
        with_refs: ["Isa 43:3", "Isa 43:4"]
        relation: contrast
        note: "Isa 43:3 nātattî kopsrĕkā miṣrayim kûš û-sĕbāʾ taḥtêkā: God gives nations as Israel's ransom (kōper) and peoples in exchange for her life; Q 2:48, addressed to the Children of Israel, wa-lā yuʾkhadhu minhā ʿadlun: on the Day no ransom or substitute is taken for any soul. Substitutionary ransom for the chosen vs none for anyone."
      - with: hb-ps-50-divine-lawsuit
        motif: wicked-recites-covenant-hypocrite
        refs: ["2:44"]
        with_refs: ["Ps 50:16", "Ps 50:17"]
        relation: parallel
        note: "Ps 50:16-17 mah lĕkā lĕsappēr ḥuqqāy wa-ttiśśāʾ bĕrîtî ʿălê pîkā wĕ-ʾattâ śānēʾtā mûsār: reciting God's statutes while not doing them; Q 2:44 a-taʾmurūna n-nāsa bi-l-birri wa-tansawna anfusakum wa-antum tatlūna l-kitāb: commanding piety and reciting the Book while forgetting yourselves."
      - with: hb-ps-50-divine-lawsuit
        motif: scripture-cast-behind-backs
        refs: ["2:41", "2:42"]
        with_refs: ["Ps 50:17"]
        relation: echo
        note: "Ps 50:17 wa-ttašlēk dĕbāray ʾaḥărêkā 'you cast my words behind you'; Q 2:41-42 lā tashtarū bi-āyātī thamanan qalīlan ... wa-taktumū l-ḥaqq: selling and concealing God's signs. The Quran's own wording nabadhūhu warāʾa ẓuhūrihim is at 3:187, 2:101."
      - with: hb-neh-9-levites-confession
        motif: scripture-cast-behind-backs
        refs: ["2:41", "2:42"]
        with_refs: ["Neh 9:26"]
        relation: echo
        note: "Neh 9:26 wa-yyašlikû ʾet tôrātĕkā ʾaḥărê gawwām 'they cast your Torah behind their backs' (Israel's own confession); Q 2:41-42 lā tashtarū bi-āyātī thamanan qalīlan ... wa-taktumū l-ḥaqqa, said to the Children of Israel. The exact image 'behind their backs' is the Quran's at 3:187 and 2:101."
  - unit: quran-2-exodus-calf
    checked: [hb-exod-32-tablets-broken-levites, hb-ps-78-history, hb-num-11-taberah-quail, hb-neh-9-levites-confession, hb-ps-105-history, hb-exod-1-oppression-midwives, hb-exod-14-crossing-of-the-sea, hb-exod-15-marah-elim, hb-exod-16-manna-quail-sabbath, hb-exod-13-firstborn-tefillin-pillar, hb-exod-17-water-from-rock, hb-exod-24-covenant-ratification, hb-exod-24-moses-ascends, hb-exod-32-golden-calf, hb-exod-33-tent-and-glory, hb-num-20-meribah]
    matches:
      - with: hb-exod-1-oppression-midwives
        motif: king-kills-male-infants
        refs: ["2:49"]
        with_refs: ["Exod 1:16", "Exod 1:22"]
        relation: divergence
        note: "Exod 1:22 kol ha-bēn ha-yyillôd ha-yĕʾōrâ tašlîkuhû wĕ-kol ha-bat tĕḥayyûn; Q 2:49 yudhabbiḥūna abnāʾakum wa-yastaḥyūna nisāʾakum. Same pair (kill the sons, keep the females alive, ḥ-y-y in both: tĕḥayyûn / yastaḥyūna), but drowning in the Nile becomes slaughter (dhabbaḥa), Pharaoh's order becomes the deed of 'the house of Pharaoh' (āl firʿawn), and the Quran reads it as a trial from God (balāʾun min rabbikum ʿaẓīm)."
      - with: hb-exod-14-crossing-of-the-sea
        motif: sea-split-by-staff-and-east-wind
        refs: ["2:50"]
        with_refs: ["Exod 14:21"]
        relation: divergence
        note: "Exod 14:21 wa-yyēṭ mōšeh ʾet yādô ʿal ha-yyām wa-yyôlek YHWH ʾet ha-yyām bĕ-rûaḥ qādîm ʿazzâ ... wa-yyibbāqĕʿû ha-mmāyim: Moses' hand and a strong east wind all night; Q 2:50 wa-idh faraqnā bikumu l-baḥra: God ('we') parts the sea directly, with no Moses, no wind, no night."
      - with: hb-exod-14-crossing-of-the-sea
        motif: pursuers-drowned-in-sea
        refs: ["2:50"]
        with_refs: ["Exod 14:28", "Exod 14:30"]
        relation: parallel
        note: "Exod 14:28-30 lōʾ nišʾar bāhem ʿad ʾeḥād ... wa-yyarʾ yiśrāʾēl ʾet miṣrayim mēt ʿal śĕpat ha-yyām; Q 2:50 wa-aghraqnā āla firʿawna wa-antum tanẓurūn: the drowning watched by Israel ('while you looked on')."
      - with: hb-exod-14-crossing-of-the-sea
        motif: people-believe-in-god-and-his-servant
        refs: ["2:55"]
        with_refs: ["Exod 14:31"]
        relation: divergence
        note: "Exod 14:31 wa-yyaʾămînû ba-YHWH û-bĕ-mōšeh ʿabdô: after the sea the people believe in God and in Moses; Q 2:55 yā mūsā lan nuʾmina laka ḥattā narā llāha jahratan: the same people say 'we will not believe you (Moses) until we see God openly'. The same verb (ʾ-m-n), reversed."
      - with: hb-exod-24-moses-ascends
        motif: forty-days-and-nights
        refs: ["2:51"]
        with_refs: ["Exod 24:18"]
        relation: parallel
        note: "Exod 24:18 wa-yhî mōšeh bā-hār ʾarbāʿîm yôm wĕ-ʾarbāʿîm lāylâ; Q 2:51 wa-idh wāʿadnā mūsā arbaʿīna laylatan: forty nights only, framed as an appointment made by God (wāʿadnā)."
      - with: hb-exod-32-golden-calf
        motif: golden-calf
        refs: ["2:51"]
        with_refs: ["Exod 32:4", "Exod 32:8"]
        relation: divergence
        note: "Who makes the calf: Exod 32:4 wa-yyiqqaḥ mi-yyādām wa-yyāṣar ʾōtô ba-ḥereṭ wa-yyaʿăśēhû ʿēgel massēkâ: Aaron fashions it, and the people hail it ʾēlleh ʾĕlōhêkā yiśrāʾēl ʾăšer heʿĕlûkā; Q 2:51 thumma ttakhadhtumu l-ʿijla min baʿdihi wa-antum ẓālimūn: 'you took the calf', the whole people, with Aaron unnamed and no acclamation of the calf as the god of the exodus."
      - with: hb-exod-32-golden-calf
        motif: god-relents
        refs: ["2:52"]
        with_refs: ["Exod 32:14"]
        relation: divergence
        note: "Exod 32:14 wa-yyinnāḥem YHWH ʿal hā-rāʿâ: God relents only after Moses' intercession (32:11-13); Q 2:52 thumma ʿafawnā ʿankum min baʿdi dhālika laʿallakum tashkurūn: God pardons with no intercession, so that they might be grateful."
      - with: hb-exod-32-tablets-broken-levites
        motif: levites-kill-idolaters-kin
        refs: ["2:54"]
        with_refs: ["Exod 32:27", "Exod 32:28", "Exod 32:29"]
        relation: divergence
        note: "Exod 32:27 kōh ʾāmar YHWH ʾĕlōhê yiśrāʾēl ... wĕ-hirgû ʾîš ʾet ʾāḥîw: the Levites alone kill about three thousand of their brothers and are ordained for it (32:29 milʾû yedkem ha-yyôm); Q 2:54 fa-tūbū ilā bāriʾikum fa-qtulū anfusakum ... fa-tāba ʿalaykum: the killing is commanded to the whole people as their repentance, and ends in God's forgiveness. The divine title changes too: 'YHWH, God of Israel' becomes bāriʾukum 'your Creator' (cognate of bārāʾ), said twice. No Levites, no ordination, no plague (32:35)."
      - with: hb-neh-9-levites-confession
        motif: golden-calf
        refs: ["2:51", "2:52"]
        with_refs: ["Neh 9:17", "Neh 9:18", "Neh 9:19"]
        relation: parallel
        note: "Neh 9:18-19 ʿāśû lāhem ʿēgel massēkâ ... wĕ-ʾattâ bĕ-raḥămêkā ha-rabbîm lōʾ ʿăzabtām: the people (not Aaron) made the calf and God, ʾĕlôah sĕlîḥôt (9:17), did not abandon them; Q 2:51-52 ittakhadhtumu l-ʿijla ... thumma ʿafawnā ʿankum. The Nehemiah recital and the Quran tell the calf alike, against Exod 32."
      - with: hb-exod-24-covenant-ratification
        motif: seeing-god-without-dying
        refs: ["2:55"]
        with_refs: ["Exod 24:10", "Exod 24:11"]
        relation: contrast
        note: "Exod 24:10-11 wa-yyirʾû ʾēt ʾĕlōhê yiśrāʾēl ... wĕ-ʾel ʾăṣîlê bĕnê yiśrāʾēl lōʾ šālaḥ yādô wa-yyeḥĕzû ʾet hā-ʾĕlōhîm wa-yyōʾkĕlû wa-yyištû: Israel's leaders see the God of Israel and are not harmed; Q 2:55 ḥattā narā llāha jahratan fa-akhadhatkumu ṣ-ṣāʿiqatu wa-antum tanẓurūn: demanding to see God openly is punished by a thunderbolt (and they are raised after death, 2:56)."
      - with: hb-exod-33-tent-and-glory
        motif: no-man-sees-god-and-lives
        refs: ["2:55", "2:56"]
        with_refs: ["Exod 33:20"]
        relation: parallel
        note: "Exod 33:20 lōʾ tûkal lirʾōt ʾet pānāy kî lōʾ yirʾanî hā-ʾādām wā-ḥāy; Q 2:55-56 narā llāha jahratan fa-akhadhatkumu ṣ-ṣāʿiqatu ... thumma baʿathnākum min baʿdi mawtikum: whoever seeks to see God dies; in the Quran the rule is carried out on the people and then undone by resurrection."
      - with: hb-exod-13-firstborn-tefillin-pillar
        motif: pillar-of-cloud-and-fire
        refs: ["2:57"]
        with_refs: ["Exod 13:21"]
        relation: divergence
        note: "Exod 13:21 bĕ-ʿammûd ʿānān lanḥōtām ha-derek wĕ-laylâ bĕ-ʿammûd ʾēš: a pillar that leads the way, by day and night; Q 2:57 wa-ẓallalnā ʿalaykumu l-ghamāma: clouds as shade over them. The guide becomes a shelter; the fire is dropped."
      - with: hb-ps-105-history
        motif: pillar-of-cloud-and-fire
        refs: ["2:57"]
        with_refs: ["Ps 105:39", "Ps 105:40"]
        relation: parallel
        note: "Ps 105:39-40 pāraś ʿānān lĕ-māsāk ... šāʾal wa-yyābēʾ śĕlāw wĕ-leḥem šāmayim yaśbîʿēm: a cloud spread as a covering, then quail and bread from heaven; Q 2:57 wa-ẓallalnā ʿalaykumu l-ghamāma wa-anzalnā ʿalaykumu l-manna wa-s-salwā. Same sequence, with the cloud as a cover as in the Quran, not as a guide as in Exodus."
      - with: hb-exod-16-manna-quail-sabbath
        motif: manna
        refs: ["2:57"]
        with_refs: ["Exod 16:13", "Exod 16:15"]
        relation: parallel
        note: "Exod 16:13-15 wa-ttaʿal ha-śĕlāw ... mān hûʾ ... hûʾ ha-leḥem ʾăšer nātan YHWH lākem lĕ-ʾoklâ; Q 2:57 al-manna wa-s-salwā kulū min ṭayyibāti mā razaqnākum. Cognate names (mān / mann, śĕlāw / salwā). Q drops the murmuring that prompts the gift (Exod 16:2-3) and adds wa-mā ẓalamūnā 'they did not wrong us'."
      - with: hb-ps-78-history
        motif: manna
        refs: ["2:57"]
        with_refs: ["Ps 78:24", "Ps 78:27"]
        relation: parallel
        note: "Ps 78:24, 27 wa-yyamṭēr ʿălêhem mān leʾĕkōl ... wa-yyamṭēr ʿălêhem ka-ʿāpār šĕʾēr: God rains down manna and flesh on them; Q 2:57 wa-anzalnā ʿalaykumu l-manna wa-s-salwā: God as subject sending both down on them (ʿălêhem / ʿalaykum)."
      - with: hb-ps-78-history
        motif: sea-split-by-staff-and-east-wind
        refs: ["2:50"]
        with_refs: ["Ps 78:13"]
        relation: parallel
        note: "Ps 78:13 bāqaʿ yām wa-yyaʿăbîrēm: God himself split the sea and brought them through; Q 2:50 faraqnā bikumu l-baḥra fa-anjaynākum: the same telling with God as sole subject, without the staff and wind of Exod 14."
      - with: hb-num-11-taberah-quail
        motif: quail-miracle
        refs: ["2:57"]
        with_refs: ["Num 11:31", "Num 11:33"]
        relation: divergence
        note: "Num 11:31-33 wĕ-rûaḥ nāsaʿ mēʾēt YHWH wa-yyāgoz śalwîm ... ha-bbāśār ʿôdennû bên šinnêhem ... wa-yyak YHWH bā-ʿām: quail given in anger, and a plague while the meat is in their teeth; Q 2:57 wa-anzalnā ʿalaykumu l-manna wa-s-salwā kulū min ṭayyibāti mā razaqnākum: quail as plain provision ('eat of the good things'), with no craving and no plague."
      - with: hb-num-11-taberah-quail
        motif: egyptian-foods-remembered
        refs: ["2:61"]
        with_refs: ["Num 11:4", "Num 11:5", "Num 11:6"]
        relation: divergence
        note: "Num 11:5 zākarnû ʾet ha-ddāgâ ... ʾēt ha-qqiššuʾîm wĕ-ʾēt hā-ʾăbaṭṭiḥîm wĕ-ʾet he-ḥāṣîr wĕ-ʾet ha-bbĕṣālîm wĕ-ʾet ha-ššûmîm; Q 2:61 baqlihā wa-qiththāʾihā wa-fūmihā wa-ʿadasihā wa-baṣalihā. Three cognates (qiššuʾîm / qiththāʾ, bĕṣālîm / baṣal, šûmîm / fūm). Changed: in Numbers the craving is for meat (mî yaʾăkilēnû bāśār, 11:4) and the food is remembered from Egypt; in the Quran the complaint is 'one food' (lan naṣbira ʿalā ṭaʿāmin wāḥidin), fish and meat are absent, lentils are added. The outcome changes too: plague in Num 11:33; in Q ihbiṭū miṣran fa-inna lakum mā saʾaltum, and humiliation."
      - with: hb-exod-17-water-from-rock
        motif: water-from-struck-rock
        refs: ["2:60"]
        with_refs: ["Exod 17:2", "Exod 17:6"]
        relation: divergence
        note: "Exod 17:6 wĕ-hikkîtā va-ṣṣûr wĕ-yāṣĕʾû mimmennû mayim; Q 2:60 iḍrib bi-ʿaṣāka l-ḥajara fa-nfajarat: the same command to strike. The setting changes: in Exodus the people quarrel and test God (17:2 wa-yyāreb hā-ʿām ... mah tĕnassûn ʾet YHWH; named Massah and Meribah); in the Quran Moses asks water for his people (wa-idhi stasqā mūsā li-qawmihi), with no complaint."
      - with: hb-num-20-meribah
        motif: water-from-rock
        refs: ["2:60"]
        with_refs: ["Num 20:8", "Num 20:11", "Num 20:12"]
        relation: divergence
        note: "Num 20:8 wĕ-dibbartem ʾel ha-selaʿ: Moses is told to speak to the rock; he strikes it with his staff (20:11 wa-yyak ʾet ha-selaʿ bĕ-maṭṭēhû) and is barred from the land for it (20:12 yaʿan lōʾ heʾĕmantem bî). Q 2:60 fa-qulnā ḍrib bi-ʿaṣāka l-ḥajara: God himself orders the striking with the staff, so the act that is Moses' sin in Numbers is obedience in the Quran."
      - with: hb-exod-15-marah-elim
        motif: twelve-springs-seventy-palms
        refs: ["2:60"]
        with_refs: ["Exod 15:27"]
        relation: divergence
        note: "Exod 15:27 wa-yyābōʾû ʾêlimâ wĕ-šām šĕtêm ʿeśrēh ʿênōt mayim wĕ-šibʿîm tĕmārîm: twelve springs at the oasis of Elim; Q 2:60 fa-nfajarat minhu thnatā ʿashrata ʿaynan qad ʿalima kullu unāsin mashrabahum: twelve springs (cognate numeral + ʿayin) burst from the struck rock, one per tribe. The Elim springs are moved into the rock miracle; the seventy palms are dropped."
      - with: hb-neh-9-levites-confession
        motif: prophets-killed-by-israel
        refs: ["2:61"]
        with_refs: ["Neh 9:26"]
        relation: parallel
        note: "Neh 9:26 wĕ-ʾet nĕbîʾêkā hārāgû ʾăšer hēʿîdû bām; Q 2:61 wa-yaqtulūna n-nabiyyīna bi-ghayri l-ḥaqqi: Israel killed the prophets. Neh confesses it in the first person plural; the Quran says it of them in the third person as the cause of humiliation and wrath (ḍuribat ʿalayhimu dh-dhillatu ... wa-bāʾū bi-ghaḍabin)."
      - with: hb-neh-9-levites-confession
        motif: appoint-head-return-egypt
        refs: ["2:61"]
        with_refs: ["Neh 9:17"]
        relation: echo
        note: "Neh 9:17 wa-yyittĕnû rōʾš lāšûb lĕ-ʿabdūtām: the people want to go back to slavery in Egypt; Q 2:61 ihbiṭū miṣran fa-inna lakum mā saʾaltum: Moses retorts 'go down to Egypt (or: a town), you shall have what you asked'. The wish to return is turned into an ironic command."
  - unit: quran-2-sabbath-apes
    checked: [hb-deut-5-decalogue, hb-exod-20-decalogue, hb-ezek-20-history-of-rebellion, hb-exod-19-sinai-theophany, hb-num-15-wood-gatherer-tassels, hb-exod-31-bezalel-sabbath-tablets]
    matches:
      - with: hb-exod-19-sinai-theophany
        motif: mountain-raised-over-israel
        refs: ["2:63"]
        with_refs: ["Exod 19:17"]
        relation: divergence
        note: "Exod 19:17 wa-yyityaṣṣĕbû bĕ-taḥtît hā-hār: the people take their stand at the foot (lit. 'underneath') of the mountain; Q 2:63 wa-idh akhadhnā mīthāqakum wa-rafaʿnā fawqakumu ṭ-ṭūra khudhū mā ātaynākum bi-quwwatin: God raises the mountain above them as he takes the covenant. Standing below becomes the mountain held over them, and the free assent of Exod 19:8 (kōl ʾăšer dibber YHWH naʿăśeh) gives way to a command under the raised mountain. cf. b. Shabbat 88a for the same reading of taḥtît (rabbinic, not biblical)."
      - with: hb-num-15-wood-gatherer-tassels
        motif: sabbath-breakers-cursed-transformed
        refs: ["2:65", "2:66"]
        with_refs: ["Num 15:32", "Num 15:35", "Num 15:36"]
        relation: divergence
        note: "Punishment for breaking the Sabbath: Num 15:35-36 môt yûmat hā-ʾîš rāgôm ʾōtô bā-ʾăbānîm kol hā-ʿēdâ: one man, gathering wood, stoned by the whole community on God's ruling; Q 2:65-66 alladhīna ʿtadaw minkum fī s-sabti fa-qulnā lahum kūnū qiradatan khāsiʾīn: a group who transgressed are turned into despised apes by God's word, made a deterrent (nakālan) for those before and after. Human execution becomes divine transformation."
      - with: hb-exod-31-bezalel-sabbath-tablets
        motif: sabbath-breakers-cursed-transformed
        refs: ["2:65"]
        with_refs: ["Exod 31:14"]
        relation: divergence
        note: "Exod 31:14 mĕḥallĕlêhā môt yûmāt ... wĕ-nikrĕtâ ha-nnepeš ha-hîʾ mi-qqereb ʿammêhā: the Sabbath-profaner is put to death and cut off from his people; Q 2:65 kūnū qiradatan khāsiʾīn: the transgressors of the Sabbath are cast out (khāsiʾīn) as apes. Same sanction of exclusion, different form."
      - with: hb-ezek-20-history-of-rebellion
        motif: sabbath-as-covenant-sign
        refs: ["2:63", "2:64", "2:65"]
        with_refs: ["Ezek 20:12", "Ezek 20:13"]
        relation: parallel
        note: "Ezek 20:12-13 wĕ-gam ʾet šabbĕtôtay nātattî lāhem ... wĕ-ʾet šabbĕtōtay ḥillĕlû mĕʾōd wā-ʾōmar lišpōk ḥămātî ʿălêhem: Sabbath given at the covenant, profaned by the wilderness generation, wrath spared only for God's name (20:14); Q 2:63-65 covenant (mīthāq), turning away (tawallaytum), saved only by God's favour (fa-law-lā faḍlu llāhi ʿalaykum), and the Sabbath-transgressors punished."
      - with: hb-exod-19-sinai-theophany
        motif: people-accept-covenant-we-will-do
        refs: ["2:63", "2:64"]
        with_refs: ["Exod 19:8"]
        relation: divergence
        note: "Exod 19:8 wa-yyaʿănû kol hā-ʿām yaḥdāw wa-yyōʾmĕrû kōl ʾăšer dibber YHWH naʿăśeh: the people agree to the covenant; Q 2:63-64 akhadhnā mīthāqakum ... thumma tawallaytum min baʿdi dhālika: God takes the pledge under the raised mountain, and they then turn away. The Quran leaves out the people's own consent."
  - unit: quran-2-the-cow
    checked: [hb-num-19-red-heifer, hb-deut-21-heifer-captive-son, hb-ezek-36-new-heart-new-spirit, hb-ezek-11-cauldron-new-heart, hb-lev-7-guilt-peace-portions, hb-lev-17-blood-and-slaughter]
    matches:
      - with: hb-num-19-red-heifer
        motif: red-heifer
        refs: ["2:69", "2:71"]
        with_refs: ["Num 19:2"]
        relation: divergence
        note: "Description point by point. Num 19:2 pārâ ʾădummâ tĕmîmâ ʾăšer ʾên bāh mûm ʾăšer lōʾ ʿālâ ʿālêhā ʿōl; Q 2:69, 2:71 baqaratun ṣafrāʾu fāqiʿun lawnuhā ... lā dhalūlun tuthīru l-arḍa wa-lā tasqī l-ḥartha musallamatun lā shiyata fīhā. Whole (tĕmîmâ / musallama), without blemish (ʾên bāh mûm / lā shiyata fīhā), never under the yoke (lōʾ ʿālâ ʿālêhā ʿōl / lā dhalūl): all match. The colour changes, red (ʾădummâ) to bright yellow (ṣafrāʾ fāqiʿ). The legal statute (ḥuqqat ha-ttôrâ) becomes a narrative in which the people haggle over the details (2:68-71)."
      - with: hb-num-19-red-heifer
        motif: corpse-impurity
        refs: ["2:72", "2:73"]
        with_refs: ["Num 19:9", "Num 19:11"]
        relation: contrast
        note: "Num 19:9, 19:11 lĕ-mê niddâ ḥaṭṭāʾt hîʾ ... ha-nnōgēaʿ bĕ-mēt ... wĕ-ṭāmēʾ šibʿat yāmîm: the cow's ash purifies those defiled by touching a corpse; Q 2:73 fa-qulnā ḍribūhu bi-baʿḍihā kadhālika yuḥyī llāhu l-mawtā: the dead man is struck with part of the cow and comes to life. In Numbers touching the dead defiles; in the Quran the cow touched to the dead raises it."
      - with: hb-deut-21-heifer-captive-son
        motif: unsolved-murder-heifer-ritual
        refs: ["2:71", "2:72", "2:73"]
        with_refs: ["Deut 21:1", "Deut 21:3", "Deut 21:4", "Deut 21:7"]
        relation: divergence
        note: "Deut 21:1, 3 kî yimmāṣēʾ ḥālāl ... lōʾ nôdaʿ mî hikkāhû ... ʿeglat bāqār ʾăšer lōʾ ʿubbad bāh ʾăšer lōʾ māšĕkâ bĕ-ʿōl: an unsolved killing and an unworked heifer; Q 2:71-72 lā dhalūlun tuthīru l-arḍa ... wa-idh qataltum nafsan fa-ddāraʾtum fīhā: a heifer not used for ploughing and a killing over which people dispute. The ending is reversed: in Deut the killer stays unknown, the neck is broken (wĕ-ʿārĕpû) and the elders declare yādênû lōʾ šāpĕkû ʾet ha-ddām ha-zzeh, the blood atoned; in the Quran the cow is slaughtered (fa-dhabaḥūhā) and God brings out what was hidden (wa-llāhu mukhrijun mā kuntum taktumūn): the dead man is revived and the killer known."
      - with: hb-ezek-36-new-heart-new-spirit
        motif: heart-of-stone-to-heart-of-flesh
        refs: ["2:74"]
        with_refs: ["Ezek 36:26"]
        relation: divergence
        note: "Ezek 36:26 wa-hăsirōtî ʾet lēb hā-ʾeben mi-bbĕśarkem wĕ-nātattî lākem lēb bāśār: God will take away the heart of stone; Q 2:74 thumma qasat qulūbukum min baʿdi dhālika fa-hiya ka-l-ḥijārati aw ashaddu qaswatan: the hearts became like stone or harder, and stones are said to be better: some gush water, split, or fall in fear of God. Promise of a new heart vs indictment of hearts harder than rock."
      - with: hb-ezek-11-cauldron-new-heart
        motif: heart-of-stone-to-heart-of-flesh
        refs: ["2:74"]
        with_refs: ["Ezek 11:19"]
        relation: divergence
        note: "Ezek 11:19 wa-hăsirōtî lēb hā-ʾeben mi-bbĕśārām wĕ-nātattî lāhem lēb bāśār; Q 2:74 fa-hiya ka-l-ḥijārati aw ashaddu qaswatan: the stony heart as the people's condition, without a promised replacement."
  - unit: quran-2-polemic-israel
    checked: [hb-deut-5-decalogue, hb-exod-24-covenant-ratification, hb-neh-9-levites-confession, hb-ps-106-national-confession, hb-num-35-levitical-cities-refuge, hb-isa-1-indictment-of-judah, hb-exod-32-tablets-broken-levites, hb-deut-4-exhortation, hb-lev-26-curses, hb-deut-10-second-tablets, hb-jer-4-circumcise-hearts, hb-jer-9-let-not-wise-boast, hb-jer-8-stork-and-lying-pen, hb-jer-23-burden-of-yhwh, hb-dan-9-prayer-seventy-weeks, hb-dan-8-ram-and-goat, hb-dan-10-man-in-linen, hb-dan-12-resurrection-end, hb-2chr-36-last-kings-and-fall]
