      - with: hb-prov-20-sayings
        motif: wine-and-gambling-sin-and-benefit
        refs: ["2:219"]
        with_refs: ["Prov 20:1"]
        relation: echo
        note: "Prov 20:1 lēṣ ha-yyayin hōmeh šēkār wĕ-kol šōgeh bô lōʾ yeḥkām; Q 2:219 qul fīhimā ithmun kabīrun wa-manāfiʿu li-n-nāsi wa-ithmuhumā akbaru min nafʿihimā. A wisdom warning in Proverbs; in the Quran a weighing of harm against benefit, the first step toward prohibition."
      - with: hb-prov-23-drunkard
        motif: wine-bites-like-serpent
        refs: ["2:219"]
        with_refs: ["Prov 23:31", "Prov 23:32"]
        relation: echo
        note: "Prov 23:31-32 ʾal tēreʾ yayin kî yitʾaddām ... ʾaḥărîtô kĕ-nāḥāš yiššāk: the pleasant start and bitter end of wine; Q 2:219 manāfiʿu li-n-nāsi wa-ithmuhumā akbaru min nafʿihimā: some benefit, greater harm."
      - with: hb-ps-104-creation-hymn
        motif: worth-of-wine
        refs: ["2:219"]
        with_refs: ["Ps 104:15"]
        relation: contrast
        note: "Ps 104:15 wĕ-yayin yĕśammaḥ lĕbab ʾĕnôš: wine is God's gift to gladden man, listed with oil and bread; Q 2:219 fīhimā ithmun kabīrun ... wa-ithmuhumā akbaru min nafʿihimā: wine is mainly sin. The psalm praises the benefit; the Quran admits it and judges the harm greater."
  - unit: quran-2-oaths-divorce
    checked: [hb-deut-24-divorce-pledges-poor, hb-lev-5-graduated-and-guilt-offerings, hb-jer-3-return-faithless-wife, hb-mal-2-faithless-marriage, hb-num-30-vows, hb-1sam-1-hannah, hb-ps-55-dove-wings]
    matches:
      - with: hb-deut-24-divorce-pledges-poor
        motif: return-to-first-husband-after-remarriage
        refs: ["2:230"]
        with_refs: ["Deut 24:2", "Deut 24:3", "Deut 24:4"]
        relation: contrast
        note: "Opposite rulings on the same case. Deut 24:4 lōʾ yûkal baʿlāh hā-rīšôn ʾăšer šillĕḥāh lāšûb lĕ-qaḥtāh ... ʾaḥărê ʾăšer huṭṭammāʾâ kî tôʿēbâ hîʾ: after she has been another man's wife the first husband may never take her back, it is an abomination; Q 2:230 fa-in ṭallaqahā fa-lā taḥillu lahu min baʿdu ḥattā tankiḥa zawjan ghayrahu fa-in ṭallaqahā fa-lā junāḥa ʿalayhimā an yatarājaʿā: after the third divorce she may return to the first husband only after marrying another. The intervening marriage that bars return in Deut is the condition for return in the Quran."
      - with: hb-deut-24-divorce-pledges-poor
        motif: procedure-of-divorce
        refs: ["2:228", "2:229"]
        with_refs: ["Deut 24:1"]
        relation: divergence
        note: "Deut 24:1 kî māṣāʾ bāh ʿerwat dābār wĕ-kātab lāh sēper kĕrîtut wĕ-nātan bĕ-yādāh wĕ-šillĕḥāh: divorce for 'some indecency', by a written bill handed to her; Q 2:228-229 wa-l-muṭallaqātu yatarabbaṣna bi-anfusihinna thalāthata qurūʾin ... aṭ-ṭalāqu marratāni fa-imsākun bi-maʿrūfin aw tasrīḥun bi-iḥsān: no grounds and no document named; a waiting period of three menstrual cycles, the husband's right to take her back within it, and a limit of two revocable divorces. šillaḥ / sarraḥa, both 'send away'."
      - with: hb-jer-3-return-faithless-wife
        motif: no-remarriage-to-first-husband
        refs: ["2:230"]
        with_refs: ["Jer 3:1"]
        relation: echo
        note: "Jer 3:1 hēn yĕšallaḥ ʾîš ʾet ʾištô wĕ-hālĕkâ mēʾittô wĕ-hāyĕtâ lĕ-ʾîš ʾaḥēr hă-yāšûb ʾēlêhā ʿôd ... wĕ-šôb ʾēlay: Jeremiah cites the Deut 24 bar and then has God call the 'remarried' wife back anyway; Q 2:230 an yatarājaʿā: return after another marriage is lawful. Jeremiah's exceptional divine return is, in the Quran, the general rule."
      - with: hb-mal-2-faithless-marriage
        motif: divine-view-of-divorce
        refs: ["2:227", "2:229", "2:231"]
        with_refs: ["Mal 2:14", "Mal 2:16"]
        relation: contrast
        note: "Mal 2:14, 16 YHWH hēʿîd bênkā û-bên ʾēšet nĕʿûrêkā ... kî śānēʾ šallaḥ ʾāmar YHWH: God, witness to the marriage covenant, hates divorce; Q 2:227, 229 wa-in ʿazamū ṭ-ṭalāqa fa-inna llāha samīʿun ʿalīm ... aw tasrīḥun bi-iḥsān: divorce is permitted, regulated, and to be done with kindness, and keeping a wife only to harm her is the wrong (2:231 wa-lā tumsikūhunna ḍirāran)."
      - with: hb-lev-5-graduated-and-guilt-offerings
        motif: liability-for-thoughtless-oaths
        refs: ["2:225"]
        with_refs: ["Lev 5:4"]
        relation: contrast
        note: "Lev 5:4 ʾô nepeš kî tiššābaʿ lĕ-baṭṭēʾ bi-śpātayim ... wĕ-neʿlam mimmennû wĕ-hûʾ yādaʿ wĕ-ʾāšēm: a rash oath uttered with the lips, even one forgotten, brings guilt and needs an offering; Q 2:225 lā yuʾākhidhukumu llāhu bi-l-laghwi fī aymānikum wa-lākin yuʾākhidhukum bi-mā kasabat qulūbukum: God does not hold you to thoughtless oaths, only to what your hearts intended. Lips vs heart."
      - with: hb-num-30-vows
        motif: binding-force-of-oaths
        refs: ["2:224", "2:225"]
        with_refs: ["Num 30:3"]
        relation: contrast
        note: "Num 30:3 ʾîš kî yiddōr neder ... ʾô hiššābaʿ šĕbûʿâ ... lōʾ yaḥēl dĕbārô kĕ-kol ha-yyōṣēʾ mi-ppîw yaʿăśeh: a man's oath binds exactly as spoken; Q 2:224 wa-lā tajʿalū llāha ʿurḍatan li-aymānikum an tabarrū: do not use oaths by God as a bar to doing good, and 2:225 idle oaths are not held against you."
      - with: hb-1sam-1-hannah
        motif: nursing-two-full-years
        refs: ["2:233"]
        with_refs: ["1Sam 1:22", "1Sam 1:23"]
        relation: echo
        note: "1Sam 1:22-23 ʿad yiggāmēl ha-nnaʿar ... wa-yyōʾmer lāh ʾelqānâ ʾîšāh ʿăśî ha-ṭṭôb bĕ-ʿênayik ... wa-tteneq ʾet bĕnāh ʿad gomlāh ʾōtô: the mother nurses until weaning, with the husband's consent; Q 2:233 wa-l-wālidātu yurḍiʿna awlādahunna ḥawlayni kāmilayni ... fa-in arādā fiṣālan ʿan tarāḍin minhumā wa-tashāwurin: nursing for two full years, weaning by mutual consent and consultation. Narrative custom vs fixed term."
      - with: hb-ps-55-dove-wings
        motif: middle-prayer
        refs: ["2:238"]
        with_refs: ["Ps 55:18"]
        relation: echo
        note: "Ps 55:18 ʿereb wā-bōqer wĕ-ṣohŏrayim ʾāśîḥâ: prayer evening, morning and noon; Q 2:238 ḥāfiẓū ʿalā ṣ-ṣalawāti wa-ṣ-ṣalāti l-wusṭā: keep the prayers and 'the middle prayer'. Weak: fixed daily prayer times with a middle one, which the Quran does not identify."
  - unit: quran-2-thousands-revived
    checked: [hb-ezek-37-dry-bones, hb-prov-19-sayings, hb-jer-7-obedience-not-sacrifice, hb-ps-49-no-ransom]
    matches:
      - with: hb-ezek-37-dry-bones
        motif: mass-revival-of-the-dead
        refs: ["2:243"]
        with_refs: ["Ezek 37:9", "Ezek 37:10", "Ezek 37:11"]
        relation: divergence
        note: "Ezek 37:9-10 ... ûpĕḥî ba-hărûgîm hā-ʾēlleh wĕ-yiḥyû ... wa-yyiḥyû wa-yyaʿamdû ʿal raglêhem ḥayil gādôl mĕʾōd mĕʾōd: the slain are revived by the breath at the prophet's word, a vision interpreted as 'the whole house of Israel' (37:11); Q 2:243 alladhīna kharajū min diyārihim wa-hum ulūfun ḥadhara l-mawti fa-qāla lahumu llāhu mūtū thumma aḥyāhum: thousands who fled their homes for fear of death, killed by God's word 'Die!' and then revived, as a lesson in God's bounty, followed by the command to fight (2:244). Revival by God's word in both (hinnābēʾ / qāla lahumu llāhu); the Quran adds the flight and the killing word, and drops the bones, breath and the prophet."
      - with: hb-prov-19-sayings
        motif: lending-to-yhwh-by-giving-to-poor
        refs: ["2:245"]
        with_refs: ["Prov 19:17"]
        relation: parallel
        note: "Prov 19:17 malwēh YHWH ḥônēn dāl û-gĕmūlô yĕšallem lô: who is kind to the poor lends to YHWH, who repays; Q 2:245 man dhā lladhī yuqriḍu llāha qarḍan ḥasanan fa-yuḍāʿifahu lahu aḍʿāfan kathīratan: lend God a goodly loan and he multiplies it many times. The Quran drops the poor as the go-between (the loan is given to God directly, by context for fighting in his way, 2:244) and raises repayment to manifold increase."
  - unit: quran-2-talut-jalut
    checked: [hb-judg-7-gideons-three-hundred, hb-exod-37-ark-table-lampstand-made, hb-exod-25-offering-ark-table-lampstand, hb-2chr-15-azariah-oracle-and-covenant, hb-neh-9-levites-confession, hb-ps-105-history, hb-1sam-8-demand-for-king, hb-1sam-9-saul-seeks-donkeys, hb-1sam-10-anointing-and-lot, hb-1sam-6-ark-returned, hb-1sam-14-jonathan-michmash, hb-1sam-17-david-goliath, hb-1kgs-8-ark-installed, hb-exod-16-manna-quail-sabbath, hb-num-17-censers-plague-rod]
    matches:
      - with: hb-1sam-8-demand-for-king
        motif: request-for-a-king
        refs: ["2:246"]
        with_refs: ["1Sam 8:5", "1Sam 8:7", "1Sam 8:20"]
        relation: divergence
        note: "1Sam 8:5, 20 śîmâ llānû melek lĕ-šopṭēnû kĕ-kol ha-ggôyim ... wĕ-nilḥam ʾet milḥămōtênû: a king 'like all the nations', to judge and fight our wars, which God reads as rejecting him (8:7 kî ʾōtî māʾăsû mi-mmĕlōk ʿălêhem); Q 2:246 qālū li-nabiyyin lahumu bʿath lanā malikan nuqātil fī sabīli llāh: a king so that 'we may fight in God's way'. The motive changes from imitating the nations to holy war, God's displeasure is left out, and the prophet (Samuel) is unnamed. The Quran adds the prophet's doubt that they will fight, and their turning away (tawallaw illā qalīlan)."
      - with: hb-1sam-9-saul-seeks-donkeys
        motif: tallest-man-chosen-king
        refs: ["2:247"]
        with_refs: ["1Sam 9:2", "1Sam 9:21"]
        relation: divergence
        note: "1Sam 9:2 miššikmô wā-maʿlâ gābōah mi-kkol hā-ʿām: taller than all from the shoulders up, and 9:21 Saul himself pleads low birth (mi-qqaṭannê šibṭê yiśrāʾēl ... ha-ṣṣĕʿîrâ); Q 2:247 wa-zādahu basṭatan fī l-ʿilmi wa-l-jism: God increased him in knowledge and in body. Stature is kept and knowledge is added; the low status is now the people's objection ('he has no wealth'), not Saul's own modesty."
      - with: hb-1sam-10-anointing-and-lot
        motif: objection-to-the-new-king
        refs: ["2:247"]
        with_refs: ["1Sam 10:23", "1Sam 10:27"]
        relation: divergence
        note: "1Sam 10:27 û-bĕnê bĕliyyaʿal ʾāmĕrû mah yōšīʿēnû zeh wa-yyibzuhû wĕ-lōʾ hēbîʾû lô minḥâ: worthless men scorn him, 'how can this one save us?', and Saul keeps silent; Q 2:247 qālū annā yakūnu lahu l-mulku ʿalaynā wa-naḥnu aḥaqqu bi-l-mulki minhu wa-lam yuʾta saʿatan mina l-māl: the people object that he has no wealth and they have more right, and the prophet answers inna llāha ṣṭafāhu ʿalaykum. A doubt about saving power becomes a claim of wealth and rank."
      - with: hb-1sam-6-ark-returned
        motif: return-of-the-ark
        refs: ["2:248"]
        with_refs: ["1Sam 6:7", "1Sam 6:12"]
        relation: divergence
        note: "1Sam 6:7, 12 wa-ʿăśû ʿăgālâ ḥădāšâ ʾeḥāt û-šĕtê pārôt ʿālôt ... wa-yyiššarnâ ha-pparôt ba-derek: the ark comes back on a new cart drawn by two milk cows, a Philistine test, before Saul's time; Q 2:248 inna āyata mulkihi an yaʾtiyakumu t-tābūtu ... taḥmiluhu l-malāʾikatu: the ark comes back carried by angels, as the sign of Talut's kingship. Who carries it (cows vs angels), its purpose (Philistine test vs sign of the king) and its place in the story all change."
      - with: hb-1kgs-8-ark-installed
        motif: contents-of-the-ark
        refs: ["2:248"]
        with_refs: ["1Kgs 8:9"]
        relation: contrast
        note: "1Kgs 8:9 ʾên bā-ʾārôn raq šĕnê luḥôt hā-ʾăbānîm ʾăšer hinnīaḥ šām mōšeh: 'there was nothing in the ark except the two stone tablets'; Q 2:248 fīhi sakīnatun min rabbikum wa-baqiyyatun mimmā taraka ālu mūsā wa-ālu hārūn: in it is tranquility from your Lord and relics left by the families of Moses and Aaron. cf. rabbinic šĕkînâ for sakīna (not a biblical noun) and Heb 9:4 for relics in the ark."
      - with: hb-exod-16-manna-quail-sabbath
        motif: jar-of-manna-kept-before-testimony
        refs: ["2:248"]
        with_refs: ["Exod 16:33"]
        relation: echo
        note: "Exod 16:33 wa-yyōʾmer mōšeh ʾel ʾahărōn qaḥ ṣinṣenet ʾaḥat ... wĕ-hannaḥ ʾōtô lipnê YHWH lĕ-mišmeret lĕ-dōrōtêkem: Moses has Aaron lay up a jar of manna before God for the generations; Q 2:248 baqiyyatun mimmā taraka ālu mūsā wa-ālu hārūn: a remnant left by the families of Moses and Aaron, kept in the ark. The HB keeps such objects 'before' the testimony, not inside the ark."
      - with: hb-num-17-censers-plague-rod
        motif: rod-kept-as-sign
        refs: ["2:248"]
        with_refs: ["Num 17:25"]
        relation: echo
        note: "Num 17:25 hāšēb ʾet maṭṭēh ʾahărōn lipnê hā-ʿēdût lĕ-mišmeret lĕ-ʾôt: Aaron's rod kept before the testimony 'as a sign'; Q 2:248 baqiyyatun mimmā taraka ālu mūsā wa-ālu hārūn ... inna fī dhālika la-āyatan lakum: Moses' and Aaron's relics in the ark as a sign (ʾôt / āya)."
      - with: hb-exod-25-offering-ark-table-lampstand
        motif: ark-of-the-covenant
        refs: ["2:248"]
        with_refs: ["Exod 25:10", "Exod 25:16"]
        relation: divergence
        note: "Exod 25:10, 16 wĕ-ʿāśû ʾărôn ʿăṣê šiṭṭîm ... wĕ-nātattā ʾel hā-ʾārōn ʾēt hā-ʿēdut: the ark made to hold the testimony; Q 2:248 at-tābūt (not ʾārôn; the word is the Aramaic/Hebrew tēbâ-type loan used of Moses' basket in Q 20:39) holding sakīna and relics."
      - with: hb-exod-37-ark-table-lampstand-made
        motif: ark-of-the-covenant
        refs: ["2:248"]
        with_refs: ["Exod 37:1"]
        relation: echo
        note: "Exod 37:1 wa-yyaʿaś bĕṣalʾēl ʾet hā-ʾārōn ʿăṣê šiṭṭîm; Q 2:248 at-tābūtu ... taḥmiluhu l-malāʾikatu: made by a craftsman vs borne by angels."
      - with: hb-judg-7-gideons-three-hundred
        motif: soldiers-chosen-by-way-of-drinking
        refs: ["2:249"]
        with_refs: ["Judg 7:5", "Judg 7:6", "Judg 7:7"]
        relation: divergence
        note: "Judg 7:5-7 kōl ʾăšer yālōq bi-lšônô min ha-mmayim ... wa-yhî mispar ha-mĕlaqqĕqîm bĕ-yādām ʾel pîhem šĕlōš mēʾôt ʾîš: Gideon's army sorted at the water, the three hundred who lapped with hand to mouth kept; Q 2:249 inna llāha mubtalīkum bi-naharin fa-man shariba minhu fa-laysa minnī ... illā mani ghtarafa ghurfatan bi-yadihi: Talut (Saul) tests his army at a river; whoever drinks is not with him, except one who scoops a handful. Leader moved from Gideon to Saul; the hand to the mouth is kept as the exception; the purpose shifts from reducing numbers 'lest Israel boast' (7:2) to a test of obedience (mubtalīkum)."
      - with: hb-1sam-14-jonathan-michmash
        motif: god-saves-by-many-or-few
        refs: ["2:249"]
        with_refs: ["1Sam 14:6"]
        relation: parallel
        note: "1Sam 14:6 kî ʾên la-YHWH maʿṣôr lĕhôšîaʿ bĕ-rab ʾô bi-mʿāṭ, said by Jonathan; Q 2:249 kam min fiʾatin qalīlatin ghalabat fiʾatan kathīratan bi-idhni llāhi wa-llāhu maʿa ṣ-ṣābirīn, said by those of Saul's men who expect to meet God. The same maxim in the same war setting (Saul's army against the Philistines)."
      - with: hb-1sam-17-david-goliath
        motif: david-slays-the-giant
        refs: ["2:250", "2:251"]
        with_refs: ["1Sam 17:47", "1Sam 17:50"]
        relation: divergence
        note: "1Sam 17:50 wa-yyeḥĕzaq dāwid min ha-ppĕlištî ba-qqelaʿ û-bā-ʾeben ... wĕ-ḥereb ʾên bĕ-yad dāwid, 17:47 kî la-YHWH ha-mmilḥāmâ: the shepherd boy with sling and stone; Q 2:251 fa-hazamūhum bi-idhni llāhi wa-qatala dāwūdu jālūta wa-ātāhu llāhu l-mulka wa-l-ḥikmata: David kills Goliath and at once receives kingship and wisdom. Sling, challenge and Saul's reward are gone; kingship follows at once (in Samuel only years later), and 'wisdom' (Solomon's gift in 1Kgs 3) goes to David. 'The battle is YHWH's' is matched by bi-idhni llāh."
  - unit: quran-2-throne-verse
    checked: [hb-isa-40-comfort-my-people, hb-isa-66-heaven-my-throne, hb-ps-121-keeper-of-israel, hb-dan-6-lions-den, hb-isa-45-cyrus-the-anointed, hb-exod-34-thirteen-attributes-covenant-renewal, hb-ps-107-four-rescues, hb-isa-42-servant-and-new-song, hb-num-12-miriam-aaron]
    matches:
      - with: hb-dan-6-lions-den
        motif: living-god-enduring-forever
        refs: ["2:255"]
        with_refs: ["Dan 6:27"]
        relation: parallel
        note: "Cognate pair of titles: Dan 6:27 dî hûʾ ʾĕlāhāʾ ḥayyāʾ wĕ-qayyām lĕ-ʿālmîn 'the living God, enduring forever'; Q 2:255 allāhu lā ilāha illā huwa l-ḥayyu l-qayyūm. Aramaic ḥayyāʾ wĕ-qayyām = Arabic al-ḥayy al-qayyūm. In Daniel the title is spoken by a pagan king's decree; in the Quran it opens the Throne Verse."
      - with: hb-ps-121-keeper-of-israel
        motif: god-never-sleeps
        refs: ["2:255"]
        with_refs: ["Ps 121:3", "Ps 121:4"]
        relation: divergence
        note: "Ps 121:4 hinnēh lōʾ yānûm wĕ-lōʾ yîšān šômēr yiśrāʾēl; Q 2:255 lā taʾkhudhuhu sinatun wa-lā nawmun ... wa-lā yaʾūduhu ḥifẓuhumā. Both verbs have cognates (nûm / nawm, yāšēn / sina) and the guarding returns (šômēr / ḥifẓ). But the psalm's keeper guards Israel; the Quran's God guards 'the heavens and the earth' (ḥifẓuhumā)."
      - with: hb-isa-40-comfort-my-people
        motif: god-never-tires
        refs: ["2:255"]
        with_refs: ["Isa 40:28"]
        relation: parallel
        note: "Isa 40:28 ʾĕlōhê ʿôlām YHWH bôrēʾ qĕṣôt hā-ʾāreṣ lōʾ yîʿap wĕ-lōʾ yîgāʿ ʾên ḥēqer li-tbûnātô; Q 2:255 wa-lā yaʾūduhu ḥifẓuhumā ... wa-lā yuḥīṭūna bi-shayʾin min ʿilmihi illā bi-mā shāʾa: God does not tire, and no one can fathom his knowledge (ḥēqer li-tbûnātô / yuḥīṭūna bi-ʿilmihi)."
      - with: hb-isa-66-heaven-my-throne
        motif: divine-throne-and-cosmos
        refs: ["2:255"]
        with_refs: ["Isa 66:1"]
        relation: divergence
        note: "Isa 66:1 ha-ššāmayim kisʾî wĕ-hā-ʾāreṣ hădōm raglāy: heaven is the throne (kissēʾ), earth the footstool; Q 2:255 wasiʿa kursiyyuhu s-samāwāti wa-l-arḍa: his kursī (cognate of kissēʾ, via Aramaic kursyā) is wider than heaven and earth together. The cosmos is no longer the furniture but is held within it. Isaiah's point (no house can hold God) is kept."
      - with: hb-num-12-miriam-aaron
        motif: prophets-ranked-some-above-others
        refs: ["2:253"]
        with_refs: ["Num 12:6", "Num 12:7", "Num 12:8"]
        relation: parallel
        note: "Num 12:6-8 ʾim yihyeh nĕbîʾăkem ... ba-ḥălôm ʾădabber bô lōʾ kēn ʿabdî mōšeh ... peh ʾel peh ʾădabber bô: other prophets by dreams, Moses mouth to mouth; Q 2:253 tilka r-rusulu faḍḍalnā baʿḍahum ʿalā baʿḍin minhum man kallama llāhu wa-rafaʿa baʿḍahum darajātin: some messengers above others, to some God spoke. The Quran then names Jesus with the holy spirit alongside."
      - with: hb-ps-107-four-rescues
        motif: from-darkness-to-light
        refs: ["2:257"]
        with_refs: ["Ps 107:14"]
        relation: echo
        note: "Ps 107:14 yôṣîʾēm mē-ḥōšek wĕ-ṣalmāwet: God brings the prisoners out of darkness and death-shadow; Q 2:257 allāhu waliyyu lladhīna āmanū yukhrijuhum mina ẓ-ẓulumāti ilā n-nūr: God brings the believers out of darknesses into light. Rescue from prison becomes coming to faith; the Quran adds the reverse, false gods leading from light to darkness."
      - with: hb-isa-42-servant-and-new-song
        motif: from-darkness-to-light
        refs: ["2:257"]
        with_refs: ["Isa 42:16"]
        relation: echo
        note: "Isa 42:16 ʾāśîm maḥšāk lipnêhem lā-ʾôr: God turns darkness into light before the blind; Q 2:257 yukhrijuhum mina ẓ-ẓulumāti ilā n-nūr."
      - with: hb-isa-45-cyrus-the-anointed
        motif: strict-monotheism-none-besides
        refs: ["2:255"]
        with_refs: ["Isa 45:5"]
        relation: echo
        note: "Isa 45:5 ʾănî YHWH wĕ-ʾên ʿôd zûlātî ʾên ʾĕlōhîm; Q 2:255 allāhu lā ilāha illā huwa."
  - unit: quran-2-abraham-king
    checked: [hb-gen-11-shem-to-terah, hb-deut-32-song-of-moses, hb-ps-2-anointed-son, hb-isa-41-trial-of-the-gods, hb-exod-3-burning-bush, hb-2kgs-5-naaman, hb-1sam-2-song-of-hannah, hb-isa-14-helel-ben-shahar]
    matches:
      - with: hb-deut-32-song-of-moses
        motif: power-over-life-and-death
        refs: ["2:258"]
        with_refs: ["Deut 32:39"]
        relation: divergence
        note: "Deut 32:39 rĕʾû ʿattâ kî ʾănî ʾănî hûʾ wĕ-ʾên ʾĕlōhîm ʿimmādî ʾănî ʾāmît wa-ʾăḥayyeh: God's own claim, I kill and make alive; Q 2:258 qāla ibrāhīmu rabbiya lladhī yuḥyī wa-yumītu qāla anā uḥyī wa-umītu: Abraham states it of his Lord and the king takes it for himself, 'I give life and death'. The divine self-predication (ʾănî ... ʾāmît wa-ʾăḥayyeh / anā uḥyī wa-umītu, same first-person form and pair of verbs) is spoken by a human usurper."
      - with: hb-2kgs-5-naaman
        motif: power-over-life-and-death
        refs: ["2:258"]
        with_refs: ["2Kgs 5:7"]
        relation: contrast
        note: "2Kgs 5:7 wa-yyiqraʿ bĕgādāyw wa-yyōʾmer ha-ʾĕlōhîm ʾānî lĕhāmît û-lĕhaḥăyôt: the king of Israel tears his clothes and refuses the power over life and death as God's alone; Q 2:258 anā uḥyī wa-umītu: the king who disputes with Abraham claims it. A king disowns the claim vs a king makes it."
      - with: hb-1sam-2-song-of-hannah
        motif: i-kill-and-make-alive
        refs: ["2:258"]
        with_refs: ["1Sam 2:6"]
        relation: echo
        note: "1Sam 2:6 YHWH mēmît û-mĕḥayyeh môrîd šĕʾôl wa-yyaʿal; Q 2:258 rabbiya lladhī yuḥyī wa-yumītu: the formula of faith Abraham uses."
      - with: hb-isa-14-helel-ben-shahar
        motif: abraham-disputes-with-king-life-death
        refs: ["2:258"]
        with_refs: ["Isa 14:13", "Isa 14:14"]
        relation: echo
        note: "Isa 14:13-14 ʾeʿĕleh ʿal bāmŏtê ʿāb ʾeddammeh lĕ-ʿelyôn: the Babylonian king claims to be like the Most High; Q 2:258 alladhī ḥājja ibrāhīma fī rabbihi an ātāhu llāhu l-mulka ... anā uḥyī wa-umītu: a king given power by God claims divine power and is confounded (fa-buhita). The king who plays God; in the Quran answered by Abraham's sun challenge, in Isaiah brought down to Sheol."
      - with: hb-ps-2-anointed-son
        motif: nations-rage-against-anointed
        refs: ["2:258"]
        with_refs: ["Ps 2:2"]
        relation: echo
        note: "Ps 2:2 yityaṣṣĕbû malkê ʾereṣ ... ʿal YHWH wĕ-ʿal mĕšîḥô: kings take their stand against YHWH; Q 2:258 alladhī ḥājja ibrāhīma fī rabbihi: a king argues with Abraham about his Lord. Weak: a king set against God in both."
  - unit: quran-2-sleeper-hundred-years
    checked: [hb-josh-8-ai-ebal, hb-ezek-37-dry-bones, hb-isa-38-hezekiahs-illness, hb-lam-2-god-as-enemy, hb-deut-13-enticers]
    matches:
      - with: hb-ezek-37-dry-bones
        motif: question-whether-dead-can-live
        refs: ["2:259"]
        with_refs: ["Ezek 37:3"]
        relation: divergence
        note: "Ezek 37:3 ha-tiḥyênâ hā-ʿăṣāmôt hā-ʾēlleh wā-ʾōmar ʾădōnāy YHWH ʾattâ yādāʿtā: God asks if the bones can live and the prophet defers to God's knowledge; Q 2:259 qāla annā yuḥyī hādhihi llāhu baʿda mawtihā: the man himself asks, doubting, how God can revive the dead town, and God answers by making him die for a hundred years and raising him."
      - with: hb-ezek-37-dry-bones
        motif: bones-reassembled-sinews-flesh-skin
        refs: ["2:259"]
        with_refs: ["Ezek 37:7", "Ezek 37:8"]
        relation: parallel
        note: "Ezek 37:7-8 wa-ttiqrĕbû ʿăṣāmôt ʿeṣem ʾel ʿaṣmô ... wĕ-hinnēh ʿălêhem gīdîm û-bāśār ʿālâ wa-yyiqram ʿălêhem ʿôr: bones come together and are covered with sinews, flesh and skin; Q 2:259 wa-nẓur ilā l-ʿiẓāmi kayfa nunshizuhā thumma naksūhā laḥman: see the bones, how we raise them up and then clothe them with flesh. Same order (assemble, then cover with flesh); in the Quran they are the man's donkey's bones and the sign is for one doubter, not a vision of the nation."
      - with: hb-josh-8-ai-ebal
        motif: fate-of-a-ruined-city
        refs: ["2:259"]
        with_refs: ["Josh 8:28"]
        relation: contrast
        note: "Josh 8:28 wa-yĕśîmehā tēl ʿôlām šĕmāmâ ʿad ha-yyôm ha-zzeh: Ai made a ruin mound forever; Q 2:259 ʿalā qaryatin wa-hiya khāwiyatun ʿalā ʿurūshihā qāla annā yuḥyī hādhihi llāhu baʿda mawtihā: a town fallen on its roofs, and the question whether God can revive it. Permanent ruin vs ruin as a test case for resurrection."
      - with: hb-deut-13-enticers
        motif: fate-of-a-ruined-city
        refs: ["2:259"]
        with_refs: ["Deut 13:17"]
        relation: contrast
        note: "Deut 13:17 wĕ-hāyĕtâ tēl ʿôlām lōʾ tibbāneh ʿôd: the apostate city is never to be rebuilt; Q 2:259 annā yuḥyī hādhihi llāhu baʿda mawtihā: a dead town that God can revive."
  - unit: quran-2-four-birds
    checked: [hb-gen-15-covenant-between-pieces, hb-judg-6-jerubbaal-fleece, hb-judg-6-gideon-call, hb-jer-34-zedekiah-and-slave-release, hb-exod-3-burning-bush, hb-ps-78-history]
    matches:
      - with: hb-gen-15-covenant-between-pieces
        motif: request-for-a-sign
        refs: ["2:260"]
        with_refs: ["Gen 15:8"]
        relation: divergence
        note: "Gen 15:8 ʾădōnāy YHWH ba-mmâ ʾēdaʿ kî ʾîrāšennâ: Abraham asks how he will know he will inherit the land; Q 2:260 rabbi arinī kayfa tuḥyī l-mawtā ... wa-lākin li-yaṭmaʾinna qalbī: Abraham asks to be shown how God gives life to the dead, 'so that my heart may be at rest'. Same speaker, same request for assurance, different object (land vs resurrection), and in the Quran God first asks 'do you not believe?' (a-wa-lam tuʾmin)."
      - with: hb-gen-15-covenant-between-pieces
        motif: abrahams-cut-animals-rite
        refs: ["2:260"]
        with_refs: ["Gen 15:9", "Gen 15:10", "Gen 15:11", "Gen 15:17"]
        relation: divergence
        note: "Gen 15:9-11, 17 qĕḥâ lî ʿeglâ mĕšulleševet ... wĕ-tōr wĕ-gôzāl ... wa-yĕbattēr ʾōtām ... wĕ-ʾet ha-ṣṣippōr lōʾ bātār ... wa-yyēred hā-ʿayiṭ ʿal ha-ppĕgārîm: heifer, goat, ram and two birds, the animals halved but the birds not; birds of prey come down and Abraham drives them off; a smoking oven passes between the pieces; Q 2:260 fa-khudh arbaʿatan mina ṭ-ṭayri fa-ṣurhunna ilayka thumma jʿal ʿalā kulli jabalin minhunna juzʾan thumma dʿuhunna yaʾtīnaka saʿyan: 'take four birds' (the command form qaḥ / khudh), cut them up, put a part on each hill, call them and they come running. Only birds, and they are the ones divided; the parts are spread over hills, not set facing each other; and the ending is the birds brought back to life, not a theophany sealing a land covenant."
      - with: hb-jer-34-zedekiah-and-slave-release
        motif: covenant-between-the-pieces
        refs: ["2:260"]
        with_refs: ["Jer 34:18"]
        relation: echo
        note: "Jer 34:18 hā-ʿēgel ʾăšer kārĕtû li-šnayim wa-yyaʿabrû bên bĕtārāyw: the cut-animal oath rite; Q 2:260 thumma jʿal ʿalā kulli jabalin minhunna juzʾan: cut animals used for a sign of resurrection instead of a covenant oath."
      - with: hb-judg-6-jerubbaal-fleece
        motif: request-for-a-sign
        refs: ["2:260"]
        with_refs: ["Judg 6:36", "Judg 6:37"]
        relation: echo
        note: "Judg 6:37 wĕ-yādaʿtî kî tôšîaʿ bĕ-yādî: Gideon asks a physical sign to be sure of God's promise; Q 2:260 wa-lākin li-yaṭmaʾinna qalbī: Abraham, already a believer (balā), asks a sign for heart's rest. The asker's faith is affirmed in the Quran (a-wa-lam tuʾmin qāla balā)."
  - unit: quran-2-charity
    checked: [hb-gen-26-isaac-in-gerar, hb-dan-3-4-tree-dream, hb-prov-11-sayings, hb-prov-28-sayings, hb-job-22-eliphaz-accuses-job, hb-prov-21-sayings, hb-prov-2-search-for-wisdom, hb-job-1-prologue-first-test]
    matches:
      - with: hb-dan-3-4-tree-dream
        motif: atone-sins-by-almsgiving
        refs: ["2:271"]
        with_refs: ["Dan 4:24"]
        relation: parallel
        note: "Cognate key word: Dan 4:24 wa-ḥăṭāyāk bĕ-ṣidqâ pĕruq wa-ʿăwāyātāk bĕ-miḥan ʿănāyin 'break off your sins by ṣidqâ and your iniquities by mercy to the poor'; Q 2:271 in tubdū ṣ-ṣadaqāti ... wa-tuʾtūhā l-fuqarāʾa fa-huwa khayrun lakum wa-yukaffiru ʿankum min sayyiʾātikum: alms (ṣadaqāt) given to the poor expiate sins. Aramaic ṣidqâ ('righteousness', here almsgiving) and Arabic ṣadaqa. Daniel advises a pagan king; the Quran makes it a rule for believers and prefers secret giving."
      - with: hb-prov-21-sayings
        motif: secret-charity-better
        refs: ["2:271", "2:274"]
        with_refs: ["Prov 21:14"]
        relation: echo
        note: "Prov 21:14 mattān ba-sseter yikpeh ʾāp: a gift given in secret averts anger (of a man); Q 2:271 wa-in tukhfūhā wa-tuʾtūhā l-fuqarāʾa fa-huwa khayrun lakum wa-yukaffiru ʿankum: secret alms are better and cover sins before God. Secret giving that averts anger or covers sin; ka-pāh 'avert' and kaffara 'cover/expiate' are close in sense though not cognate."
      - with: hb-gen-26-isaac-in-gerar
        motif: hundredfold-harvest
        refs: ["2:261"]
        with_refs: ["Gen 26:12"]
        relation: echo
        note: "Gen 26:12 wa-yyizraʿ yiṣḥāq ... wa-yyimṣāʾ ba-ššānâ ha-hîʾ mēʾâ šĕʿārîm wa-yĕbārăkēhû YHWH: Isaac sows and reaps a hundredfold, God's blessing; Q 2:261 ka-mathali ḥabbatin anbatat sabʿa sanābila fī kulli sunbulatin miʾatu ḥabbatin: one grain, seven ears, a hundred grains each, as a parable of spending in God's way. Real harvest vs parable; a hundredfold vs seven hundredfold."
      - with: hb-prov-11-sayings
        motif: generous-giver-enriched
        refs: ["2:261", "2:265"]
        with_refs: ["Prov 11:24", "Prov 11:25"]
        relation: parallel
        note: "Prov 11:24-25 yēš mĕpazzēr wĕ-nôsāp ʿôd ... nepeš bĕrākâ tĕduššān û-marweh gam hûʾ yôreʾ: one who scatters gains more; who waters will be watered; Q 2:261, 265 wa-llāhu yuḍāʿifu li-man yashāʾ ... ka-mathali jannatin bi-rabwatin aṣābahā wābilun fa-ātat ukulahā ḍiʿfayn: spending multiplied, the watered garden yields double. Both use watering/rain for the giver's return."
      - with: hb-prov-28-sayings
        motif: giver-to-poor-lacks-nothing
        refs: ["2:268"]
        with_refs: ["Prov 28:27"]
        relation: echo
        note: "Prov 28:27 nôtēn lā-rāš ʾên maḥsôr: whoever gives to the poor will not lack; Q 2:268 ash-shayṭānu yaʿidukumu l-faqra ... wa-llāhu yaʿidukum maghfiratan minhu wa-faḍlan: the fear that giving brings poverty is Satan's promise, God promises bounty. The Quran gives the fear Proverbs denies a source: Satan."
      - with: hb-prov-2-search-for-wisdom
        motif: wisdom-given-to-whom-god-wills
        refs: ["2:269"]
        with_refs: ["Prov 2:6"]
        relation: parallel
        note: "Prov 2:6 kî YHWH yittēn ḥokmâ mi-ppîw daʿat û-tĕbûnâ; Q 2:269 yuʾtī l-ḥikmata man yashāʾu wa-man yuʾta l-ḥikmata fa-qad ūtiya khayran kathīran: God gives wisdom (ḥokmâ / ḥikma, cognate). Proverbs: to those who seek it (2:4); the Quran: to whom he wills."
      - with: hb-job-1-prologue-first-test
        motif: parable-garden-burnt-by-fiery-whirlwind
        refs: ["2:266"]
        with_refs: ["Job 1:16", "Job 1:19"]
        relation: echo
        note: "Job 1:16, 19 ʾēš ʾĕlōhîm nāpĕlâ min ha-ššāmayim wa-ttibʿar ... wĕ-hinnēh rûaḥ gĕdôlâ bāʾâ mē-ʿēber ha-mmidbār: fire from heaven burns the flocks, a great wind kills the children; Q 2:266 wa-aṣābahu l-kibaru wa-lahu dhurriyyatun ḍuʿafāʾu fa-aṣābahā iʿṣārun fīhi nārun fa-ḥtaraqat: an old man with weak children loses his garden to a whirlwind of fire. Fire and storm destroy a lifetime's goods; Job's is a test of the righteous, the Quran's a parable of deeds lost through boasting and hurt."
  - unit: quran-2-usury
    checked: [hb-prov-28-sayings, hb-ps-15-entrance-liturgy, hb-exod-22-apodictic-and-social-laws, hb-neh-5-debt-slavery-reform, hb-eccl-5-wealth-and-oppression, hb-deut-23-assembly-camp, hb-lev-25-redemption-usury-slavery, hb-deut-15-release-year]
    matches:
      - with: hb-prov-28-sayings
        motif: usurers-wealth-goes-to-generous
        refs: ["2:276"]
        with_refs: ["Prov 28:8"]
        relation: parallel
        note: "Same root, same reversal: Prov 28:8 marbeh hônô bĕ-nešek û-ba-tarbît lĕ-ḥônēn dallîm yiqbĕṣennû: wealth increased (marbeh) by interest and increase (tarbît) ends up with the one kind to the poor; Q 2:276 yamḥaqu llāhu r-ribā wa-yurbī ṣ-ṣadaqāti: God wipes out usury (ribā) and makes alms grow (yurbī). r-b-y in both, turned against the usurer."
      - with: hb-lev-25-redemption-usury-slavery
        motif: scope-of-interest-ban
        refs: ["2:275", "2:278"]
        with_refs: ["Lev 25:36", "Lev 25:37"]
        relation: divergence
        note: "Lev 25:36-37 ʾal tiqqaḥ mēʾittô nešek wĕ-tarbît ... wĕ-ḥê ʾāḥîkā ʿimmāk: no interest or increase (tarbît, cognate of ribā) from your brother; Q 2:275, 278 wa-aḥalla llāhu l-bayʿa wa-ḥarrama r-ribā ... wa-dharū mā baqiya mina r-ribā: usury forbidden outright, set against lawful trade, with no limit to a brother."
      - with: hb-deut-23-assembly-camp
        motif: duties-toward-outsiders
        refs: ["2:275", "2:279"]
        with_refs: ["Deut 23:20", "Deut 23:21"]
        relation: contrast
        note: "Deut 23:21 la-nnokrî taššîk û-lĕ-ʾāḥîkā lōʾ taššîk: interest may be charged to the foreigner, not to the brother; Q 2:275, 279 ḥarrama r-ribā ... fa-in lam tafʿalū fa-ʾdhanū bi-ḥarbin mina llāhi wa-rasūlihi: usury forbidden without an in-group/out-group distinction, under threat of war from God."
      - with: hb-exod-22-apodictic-and-social-laws
        motif: scope-of-interest-ban
        refs: ["2:275", "2:279"]
        with_refs: ["Exod 22:24"]
        relation: divergence
        note: "Exod 22:24 ʾim kesep talweh ʾet ʿammî ʾet he-ʿānî ʿimmāk ... lōʾ tĕśîmûn ʿālāyw nešek: loans to the poor of 'my people' without interest; Q 2:279 wa-in tubtum fa-lakum ruʾūsu amwālikum lā taẓlimūna wa-lā tuẓlamūn: the creditor keeps only the principal. The protected class (God's poor) is replaced by a general rule of justice for both sides."
      - with: hb-neh-5-debt-slavery-reform
        motif: interest-forbidden-to-brother
        refs: ["2:278", "2:279"]
        with_refs: ["Neh 5:10", "Neh 5:11"]
        relation: parallel
        note: "Neh 5:10-11 naʿazbâ nāʾ ʾet ha-mmaššāʾ ha-zzeh hāšîbû nāʾ lāhem ... û-mĕʾat ha-kkesep: let us give up this lending, give back the 'hundredth' (interest); Q 2:278-279 wa-dharū mā baqiya mina r-ribā ... fa-lakum ruʾūsu amwālikum: give up what remains of usury, keep your principal. A reformer's call to drop existing interest claims, in both."
      - with: hb-deut-15-release-year
        motif: relief-of-debtors
        refs: ["2:280"]
        with_refs: ["Deut 15:1", "Deut 15:2"]
        relation: divergence
        note: "Deut 15:2 šāmôṭ kol baʿal maššēh yādô ... lōʾ yiggōś ʾet rēʿēhû: a fixed seventh-year remission, do not press your neighbour; Q 2:280 wa-in kāna dhū ʿusratin fa-naẓiratun ilā maysaratin wa-an taṣaddaqū khayrun lakum: for a debtor in hardship, delay until he can pay; to remit it as charity is better. A calendar release becomes respite by need, and full remission becomes a voluntary alms."
      - with: hb-ps-15-entrance-liturgy
        motif: prohibition-of-interest
        refs: ["2:275", "2:277"]
        with_refs: ["Ps 15:5"]
        relation: echo
        note: "Ps 15:5 kaspô lōʾ nātan bĕ-nešek ... ʿōśēh ʾēlleh lōʾ yimmôṭ lĕ-ʿôlām: not lending at interest is a condition for dwelling on God's mountain; Q 2:275-277 ... fa-ulāʾika aṣḥābu n-nāri ... wa-lladhīna āmanū ... lahum ajruhum: usurers to the Fire, the faithful rewarded. Interest decides who stays near God."
  - unit: quran-2-debt-contract
    checked: [hb-jer-32-field-at-anathoth, hb-num-35-levitical-cities-refuge, hb-lev-5-graduated-and-guilt-offerings, hb-deut-19-refuge-witnesses, hb-deut-17-courts-king, hb-num-30-vows, hb-deut-24-divorce-pledges-poor]
    matches:
      - with: hb-jer-32-field-at-anathoth
        motif: sealed-and-open-deed
        refs: ["2:282"]
        with_refs: ["Jer 32:10", "Jer 32:12"]
        relation: parallel
        note: "Jer 32:10, 12 wā-ʾektōb ba-sseper wā-ʾeḥtōm wā-ʾāʿid ʿēdîm ... lĕʿênê hā-ʿēdîm ha-kkōtĕbîm bĕ-sēper ha-mmiqnâ: a written, sealed deed, with witnesses signing, handed to the scribe Baruch; Q 2:282 idhā tadāyantum bi-daynin ilā ajalin musamman fa-ktubūhu wa-l-yaktub baynakum kātibun bi-l-ʿadli ... wa-stashhidū shahīdayni: write a term debt down, by a just scribe, before two witnesses. A land sale in Jeremiah, a loan in the Quran; the writing is a sign of hope in Jeremiah and a protection against doubt in the Quran (adnā allā tartābū)."
      - with: hb-deut-19-refuge-witnesses
        motif: number-of-witnesses
        refs: ["2:282"]
        with_refs: ["Deut 19:15"]
        relation: divergence
        note: "Deut 19:15 lōʾ yāqûm ʿēd ʾeḥād bĕ-ʾîš ... ʿal pî šĕnê ʿēdîm ʾô ʿal pî šĕlōšâ ʿēdîm yāqûm dābār: two or three witnesses, sex not specified, for any charge; Q 2:282 wa-stashhidū shahīdayni min rijālikum fa-in lam yakūnā rajulayni fa-rajulun wa-mraʾatāni ... an taḍilla iḥdāhumā fa-tudhakkira iḥdāhumā l-ukhrā: two men, or one man and two women so that one can remind the other. The two-witness rule kept, applied to contracts, with women admitted at two for one."
      - with: hb-deut-17-courts-king
        motif: two-witnesses-for-capital-case
        refs: ["2:282"]
        with_refs: ["Deut 17:6"]
        relation: echo
        note: "Deut 17:6 ʿal pî šĕnayim ʿēdîm ʾô šĕlōšâ ʿēdîm yûmat ha-mmēt: two witnesses for a capital case; Q 2:282 shahīdayni min rijālikum: two witnesses for a debt contract."
      - with: hb-num-35-levitical-cities-refuge
        motif: two-witnesses-for-capital-case
        refs: ["2:282"]
        with_refs: ["Num 35:30"]
        relation: echo
        note: "Num 35:30 lĕ-pî ʿēdîm ... wĕ-ʿēd ʾeḥād lōʾ yaʿăneh bĕ-nepeš: plural witnesses for homicide; Q 2:282 shahīdayni: two witnesses for a loan."
      - with: hb-lev-5-graduated-and-guilt-offerings
        motif: witness-who-hears-adjuration-must-testify
        refs: ["2:282", "2:283"]
        with_refs: ["Lev 5:1"]
        relation: parallel
