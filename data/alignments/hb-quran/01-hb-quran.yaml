  - unit: quran-2-harut-marut
    checked: [hb-deut-18-levites-prophet, hb-1chr-21-census-and-threshing-floor, hb-ezek-33-watchman-and-fall-news, hb-1kgs-11-solomons-wives, hb-isa-47-fall-of-lady-babylon, hb-dan-2-dream-demand]
