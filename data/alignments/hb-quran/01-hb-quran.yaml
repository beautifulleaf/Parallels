        motif: sorcerers-and-astrologers-cannot-save
        refs: ["2:102"]
        with_refs: ["Isa 47:9", "Isa 47:12"]
        relation: echo
        note: "Babylon as the home of magic, and magic that cannot help. Isa 47:12 ʿimdî nāʾ ba-ḥăbārayik û-bĕ-rōb kĕšāpayik ... ʾûlay tûkĕlî hôʿîl 'perhaps you can profit'; Q 2:102 ... bi-bābila hārūta wa-mārūta ... wa-yataʿallamūna mā yaḍurruhum wa-lā yanfaʿuhum 'what harms them and does not profit them'."
      - with: hb-dan-2-dream-demand
        motif: court-experts-fail
        refs: ["2:102"]
        with_refs: ["Dan 2:2"]
        relation: echo
        note: "Dan 2:2 la-ḥarṭummîm wĕ-la-ʾaššāpîm wĕ-la-mĕkaššĕpîm wĕ-la-kaśdîm: the sorcerers of the Babylonian court; Q 2:102 siḥr taught in Babylon (bi-bābila). Weak: shared setting of Babylonian magic only."
  - unit: quran-2-abrogation-polemic
    checked: [hb-ps-33-creation-by-word, hb-judg-6-jerubbaal-fleece, hb-judg-6-gideon-call, hb-isa-45-cyrus-the-anointed, hb-ps-44-national-lament, hb-gen-1-creation-six-days, hb-ps-139-searched-and-known, hb-mal-1-blemished-offerings, hb-ps-2-anointed-son, hb-deut-5-decalogue]
    matches:
      - with: hb-ps-33-creation-by-word
        motif: he-spoke-and-it-was
        refs: ["2:117"]
        with_refs: ["Ps 33:6", "Ps 33:9"]
        relation: parallel
        note: "Ps 33:9 kî hûʾ ʾāmar wa-yyehî hûʾ ṣiwwâ wa-yyaʿămōd, 33:6 bi-dbar YHWH šāmayim naʿăśû; Q 2:117 badīʿu s-samāwāti wa-l-arḍi wa-idhā qaḍā amran fa-innamā yaqūlu lahu kun fa-yakūn: he says and it is. The Quran makes it a rule for any decree (idhā qaḍā amran), not a past act of creation."
      - with: hb-gen-1-creation-six-days
        motif: creation-by-word
        refs: ["2:117"]
        with_refs: ["Gen 1:3"]
        relation: echo
        note: "Gen 1:3 wa-yyōʾmer ʾĕlōhîm yĕhî ʾôr wa-yĕhî ʾôr; Q 2:117 yaqūlu lahu kun fa-yakūn. Same shape: jussive/imperative of 'to be', then 'and it was/is'. Genesis names what is made (light), the Quran keeps only the formula."
      - with: hb-ps-139-searched-and-known
        motif: wherever-you-turn-face-of-god
        refs: ["2:115"]
        with_refs: ["Ps 139:7", "Ps 139:8", "Ps 139:9", "Ps 139:10"]
        relation: echo
        note: "Ps 139:7-9 ʾānâ mi-ppāneykā ʾebrāḥ ʾim ʾessaq šāmayim šām ʾāttâ ... ʾeśśāʾ kanpê šaḥar ʾeškĕnâ bĕ-ʾaḥărît yām: no place to flee your face, east (wings of dawn) to the far west (end of the sea); Q 2:115 wa-li-llāhi l-mashriqu wa-l-maghribu fa-aynamā tuwallū fa-thamma wajhu llāhi: east and west are God's, wherever you turn there is God's face. In the psalm an inescapable presence; in the Quran a ruling on the direction of prayer."
      - with: hb-mal-1-blemished-offerings
        motif: pure-offering-among-nations-in-every-place
        refs: ["2:114", "2:115"]
        with_refs: ["Mal 1:11"]
        relation: echo
        note: "Mal 1:11 kî mi-mmizraḥ šemeš wĕ-ʿad mĕbôʾô gādôl šĕmî ba-ggôyim û-bĕ-kol māqôm muqṭār muggāš li-šmî: from sunrise to sunset, in every place, God's name honoured; Q 2:114-115 masājida llāhi an yudhkara fīhā smuhu ... wa-li-llāhi l-mashriqu wa-l-maghribu fa-aynamā tuwallū fa-thamma wajhu llāh: God's name remembered in his places of prayer, east and west his. Both widen worship from one sanctuary to every place."
      - with: hb-ps-2-anointed-son
        motif: god-has-no-son
        refs: ["2:116"]
        with_refs: ["Ps 2:7"]
        relation: contrast
        note: "Ps 2:7 YHWH ʾāmar ʾēlay bĕnî ʾattâ ʾănî ha-yyôm yĕlidtîkā: God declares the king his son, 'today I have begotten you'; Q 2:116 wa-qālū ttakhadha llāhu waladan subḥānahu bal lahu mā fī s-samāwāti wa-l-arḍi: God has taken no son, everything is his. The Quran's denial is aimed at Christian claims, but the psalm is the Hebrew Bible's clearest divine-begetting formula."
      - with: hb-isa-45-cyrus-the-anointed
        motif: every-knee-shall-bow
        refs: ["2:116"]
        with_refs: ["Isa 45:23"]
        relation: echo
        note: "Isa 45:23 kî lî tikraʿ kol berek tiššābaʿ kol lāšôn: to me every knee shall bow; Q 2:116 kullun lahu qānitūn: all are obedient to him. Universal submission set against rival claims (idols in Isaiah, a son in the Quran)."
      - with: hb-judg-6-gideon-call
        motif: request-for-a-sign
        refs: ["2:118"]
        with_refs: ["Judg 6:17"]
        relation: divergence
        note: "Judg 6:17 wĕ-ʿāśîtā llî ʾôt šā-ʾattâ mĕdabbēr ʿimmî: the called man asks for a sign that it is God who speaks, and it is granted (fire from the rock, 6:21); Q 2:118 wa-qāla lladhīna lā yaʿlamūna lawlā yukallimunā llāhu aw taʾtīnā āyatun: unbelievers ask why God does not speak to them or give a sign, and the request is refused (qad bayyannā l-āyāt)."
      - with: hb-judg-6-jerubbaal-fleece
        motif: request-for-a-sign
        refs: ["2:118"]
        with_refs: ["Judg 6:36", "Judg 6:37"]
        relation: divergence
        note: "Judg 6:36-37 the fleece test, ʾim ṭal yihyeh ʿal ha-ggizzâ lĕbaddāh ... wĕ-yādaʿtî: Gideon twice dictates a sign and God gives it; Q 2:118 lawlā ... taʾtīnā āyatun ... tashābahat qulūbuhum: asking for a sign marks the hearts of the unbelieving. Asking God for a sign is piety in Judges and unbelief in the Quran."
      - with: hb-deut-5-decalogue
        motif: people-fear-direct-revelation
        refs: ["2:118"]
        with_refs: ["Deut 5:24", "Deut 5:25"]
        relation: contrast
        note: "Deut 5:25 ʾim yōsĕpîm ʾănaḥnû lišmōaʿ ʾet qôl YHWH ʾĕlōhênû ʿôd wā-mētnû: the people, having heard God speak, beg not to hear him again; Q 2:118 lawlā yukallimunā llāhu: those without knowledge demand that God speak to them directly. Fear of direct speech vs demand for it."
  - unit: quran-2-abraham-kaaba
    checked: [hb-gen-21-isaac-born-hagar-expelled, hb-gen-21-beersheba-treaty, hb-zech-14-day-on-mount-of-olives, hb-ps-105-history, hb-jer-1-call, hb-ezek-20-history-of-rebellion, hb-gen-22-aqedah, hb-gen-12-call-of-abram, hb-gen-17-covenant-of-circumcision, hb-gen-49-blessing-of-jacob, hb-exod-3-burning-bush, hb-deut-6-shema, hb-ps-122-peace-of-jerusalem, hb-deut-18-levites-prophet]
    matches:
      - with: hb-gen-22-aqedah
        motif: god-tests-patriarch
        refs: ["2:124"]
        with_refs: ["Gen 22:1", "Gen 22:18"]
        relation: divergence
        note: "Gen 22:1 wĕ-hā-ʾĕlōhîm nissâ ʾet ʾabrāhām, ending 22:18 wĕ-hitbārăkû bĕ-zarʿăkā kōl gôyê hā-ʾāreṣ ʿēqeb ʾăšer šāmaʿtā bĕ-qōlî; Q 2:124 wa-idhi btalā ibrāhīma rabbuhu bi-kalimātin fa-atammahunna qāla innī jāʿiluka li-n-nāsi imāman. God tests Abraham (nissâ / ibtalā) and the reward reaches all peoples (kōl gôyê hā-ʾāreṣ / li-n-nās). But the test is unnamed 'words', not the binding of a son; the reward is to be an imam for mankind; and the blessing on the seed is limited: lā yanālu ʿahdī ẓ-ẓālimīn 'my covenant does not reach the wrongdoers' among his offspring."
      - with: hb-gen-17-covenant-of-circumcision
        motif: abraham-tested-with-words-made-imam
        refs: ["2:124"]
        with_refs: ["Gen 17:7", "Gen 17:19", "Gen 17:21"]
        relation: contrast
        note: "Gen 17:7 wa-hăqimōtî ʾet bĕrîtî bênî û-bênekā û-bên zarʿăkā ʾaḥărêkā ... li-bĕrît ʿôlām, and 17:19, 21 wĕ-ʾet bĕrîtî ʾāqîm ʾet yiṣḥāq: an everlasting covenant with Abraham's seed through Isaac; Q 2:124 qāla wa-min dhurriyyatī qāla lā yanālu ʿahdī ẓ-ẓālimīn: Abraham asks for his offspring and is told the covenant does not pass to the wrongdoers among them. Inherited covenant vs covenant by conduct."
      - with: hb-gen-12-call-of-abram
        motif: altar-at-theophany-site
        refs: ["2:125", "2:127"]
        with_refs: ["Gen 12:7"]
        relation: divergence
        note: "Gen 12:7 wa-yyiben šām mizbēaḥ la-YHWH ha-nnirʾeh ʾēlāyw: Abraham alone builds altars in Canaan (Shechem, Bethel, Hebron); Q 2:127 wa-idh yarfaʿu ibrāhīmu l-qawāʿida mina l-bayti wa-ismāʿīlu: Abraham with Ishmael raises the foundations of 'the House', which God makes a place of return and security for all people (2:125). Altar becomes House, Canaan becomes (by context) Mecca, and Ishmael is his partner."
      - with: hb-gen-21-isaac-born-hagar-expelled
        motif: expulsion-of-slave-and-son
        refs: ["2:125", "2:127", "2:128"]
        with_refs: ["Gen 21:13", "Gen 21:14"]
        relation: contrast
        note: "Gen 21:14 wa-yyiqqaḥ leḥem wĕ-ḥēmat mayim ... wĕ-ʾet ha-yyeled wa-yšallĕḥehā: Abraham sends Ishmael away with his mother, and only God's promise follows him (21:13 gam ʾet ben hā-ʾāmâ lĕ-gôy ʾăśîmennû); Q 2:125-128 ʿahidnā ilā ibrāhīma wa-ismāʿīla an ṭahhirā baytiya ... rabbanā wa-jʿalnā muslimayni laka: Ishmael is with Abraham as co-builder and co-petitioner, under the same covenant charge (ʿahidnā). The son sent away becomes the son at his side."
      - with: hb-gen-17-covenant-of-circumcision
        motif: ishmael-twelve-princes
        refs: ["2:128"]
        with_refs: ["Gen 17:20"]
        relation: divergence
        note: "Gen 17:20 û-lĕ-yišmāʿēʾl šĕmaʿtîkā ... ûnĕtattîw lĕ-gôy gādôl: Ishmael's line will be a great nation, outside the covenant (17:21); Q 2:128 wa-min dhurriyyatinā ummatan muslimatan laka: Abraham and Ishmael ask for a submitting community (umma) from their offspring. Both promise a people from Ishmael; the Quran makes it the people of the covenant faith."
      - with: hb-deut-18-levites-prophet
        motif: prophet-like-moses
        refs: ["2:129"]
        with_refs: ["Deut 18:18"]
        relation: divergence
        note: "Deut 18:18 nābîʾ ʾāqîm lāhem mi-qqereb ʾăḥêhem kāmôkā wĕ-nātattî dĕbāray bĕ-pîw: God promises Moses a prophet 'from among their brothers'; Q 2:129 rabbanā wa-bʿath fīhim rasūlan minhum yatlū ʿalayhim āyātika: Abraham and Ishmael pray for a messenger 'from among them' who will recite God's signs. Promise to Moses about Israel becomes a prayer of Abraham and Ishmael about their own offspring."
      - with: hb-jer-1-call
        motif: prophet-like-moses
        refs: ["2:129"]
        with_refs: ["Jer 1:9"]
        relation: echo
        note: "Jer 1:9 hinnēh nātattî dĕbāray bĕ-pîkā; Q 2:129 rasūlan minhum yatlū ʿalayhim āyātika wa-yuʿallimuhumu l-kitāba: a messenger who carries God's words to the people."
      - with: hb-gen-49-blessing-of-jacob
        motif: jacob-deathbed-what-will-you-worship
        refs: ["2:132", "2:133"]
        with_refs: ["Gen 49:1"]
        relation: divergence
        note: "Gen 49:1 wa-yyiqrāʾ yaʿăqōb ʾel bānāyw wa-yyōʾmer hēʾāsĕpû wĕ-ʾaggîdâ lākem ʾēt ʾăšer yiqrāʾ ʾetkem bĕ-ʾaḥărît ha-yyāmîm: dying Jacob summons his sons to tell them their future; Q 2:133 idh ḥaḍara yaʿqūba l-mawtu idh qāla li-banīhi mā taʿbudūna min baʿdī: dying Jacob asks his sons what they will worship, and they confess. Tribal oracles become a test of faith; the speaker moves from foretelling to questioning. cf. Gen. Rabbah 98:3 (sons answer with the Shema)."
      - with: hb-exod-3-burning-bush
        motif: god-of-abraham-isaac-jacob
        refs: ["2:133"]
        with_refs: ["Exod 3:15"]
        relation: divergence
        note: "Exod 3:15 YHWH ʾĕlōhê ʾăbōtêkem ʾĕlōhê ʾabrāhām ʾĕlōhê yiṣḥāq wē-ʾlōhê yaʿăqōb: the God of the fathers, three names; Q 2:133 naʿbudu ilāhaka wa-ilāha ābāʾika ibrāhīma wa-ismāʿīla wa-isḥāqa ilāhan wāḥidan: the sons' confession counts Ishmael among Jacob's fathers (properly his uncle), before Isaac."
      - with: hb-deut-6-shema
        motif: shema-god-is-one
        refs: ["2:133"]
        with_refs: ["Deut 6:4"]
        relation: echo
        note: "Deut 6:4 šĕmaʿ yiśrāʾēl YHWH ʾĕlōhênû YHWH ʾeḥād; Q 2:133 ilāhan wāḥidan wa-naḥnu lahu muslimūn, confessed by the sons of Israel (Jacob). The Quran gives the confession to Jacob's sons in his lifetime."
      - with: hb-zech-14-day-on-mount-of-olives
        motif: shema-god-is-one
        refs: ["2:133"]
        with_refs: ["Zech 14:9"]
        relation: echo
        note: "Zech 14:9 yihyeh YHWH ʾeḥād û-šĕmô ʾeḥād; Q 2:133 ilāhan wāḥidan."
      - with: hb-zech-14-day-on-mount-of-olives
        motif: house-as-sanctuary-and-place-of-return
        refs: ["2:125"]
        with_refs: ["Zech 14:16"]
        relation: divergence
        note: "Zech 14:16 wĕ-ʿālû middê šānâ bĕ-šānâ lĕ-hištaḥăwōt lĕ-melek YHWH ṣĕbāʾôt: the nations go up every year to Jerusalem to bow down; Q 2:125 jaʿalnā l-bayta mathābatan li-n-nāsi wa-amnan ... li-ṭ-ṭāʾifīna wa-l-ʿākifīna wa-r-rukkaʿi s-sujūd: the House is the place all people return to, for those who circle, stay, bow and prostrate. A future universal pilgrimage to Jerusalem vs a present one to Abraham's House."
      - with: hb-ps-122-peace-of-jerusalem
        motif: abraham-prays-for-secure-city
        refs: ["2:126"]
        with_refs: ["Ps 122:6", "Ps 122:7"]
        relation: divergence
        note: "Ps 122:6-7 šaʾălû šĕlôm yĕrûšālāim ... yĕhî šālôm bĕ-ḥêlēk šalwâ bĕ-ʾarmĕnôtāyik: pilgrims pray for peace and security in Jerusalem; Q 2:126 rabbi jʿal hādhā baladan āminan wa-rzuq ahlahu mina th-thamarāti: Abraham prays that 'this town' be secure and its people fed. The pilgrim city's prayer for safety is transferred to Abraham and to the House's town; Q adds that only believers are to be fed for long (man āmana minhum)."
      - with: hb-ps-105-history
        motif: god-remembers-patriarchal-covenant
        refs: ["2:136", "2:140"]
        with_refs: ["Ps 105:9", "Ps 105:10"]
        relation: divergence
        note: "Ps 105:9-10 ʾăšer kārat ʾet ʾabrāhām û-šĕbûʿātô lĕ-yiśḥāq wa-yyaʿămîdehā lĕ-yaʿăqōb lĕ-ḥōq: one covenant passed Abraham, Isaac, Jacob, i.e. to Israel; Q 2:136, 2:140 ibrāhīma wa-ismāʿīla wa-isḥāqa wa-yaʿqūba wa-l-asbāṭ ... lā nufarriqu bayna aḥadin minhum: the same chain with Ishmael added and Moses, Jesus and all prophets included, none preferred, and none 'Jewish or Christian' (2:140)."
  - unit: quran-2-qibla
    checked: [hb-dan-6-lions-den, hb-neh-5-debt-slavery-reform, hb-neh-13-nehemiahs-final-reforms, hb-2chr-6-solomons-dedication-prayer, hb-ps-85-righteousness-and-peace, hb-deut-31-joshua-torah-song, hb-1kgs-8-dedication-prayer, hb-isa-43-you-are-my-witnesses]
    matches:
      - with: hb-dan-6-lions-den
        motif: prayer-toward-jerusalem
        refs: ["2:142", "2:144"]
        with_refs: ["Dan 6:11"]
        relation: divergence
        note: "Dan 6:11 wĕ-kawwîn pĕtîḥān lēh bĕ-ʿillîtēh neged yĕrûšlem ... mĕṣallēʾ: Daniel prays through windows open toward Jerusalem; Q 2:142-144 mā wallāhum ʿan qiblatihimu llatī kānū ʿalayhā ... fa-walli wajhaka shaṭra l-masjidi l-ḥarām: the believers are turned from their former qibla (by tradition Jerusalem) to the Sacred Mosque. The fixed direction of prayer is kept and its goal changed. Note the cognate prayer verb (Aram. mĕṣallēʾ / Ar. ṣallā, muṣallā)."
      - with: hb-2chr-6-solomons-dedication-prayer
        motif: prayer-in-direction-of-holy-city
        refs: ["2:144", "2:149", "2:150"]
        with_refs: ["2Chr 6:34", "2Chr 6:38"]
        relation: divergence
        note: "2Chr 6:34, 38 wĕ-hitpallĕlû ʾēlêkā derek hā-ʿîr ha-zzōʾt ʾăšer bāḥartā bāh wĕ-ha-bbayit ʾăšer bānîtî li-šmekā: wherever Israel is (at war, in captivity), they pray toward the chosen city and the house Solomon built; Q 2:144, 150 wa-ḥaythu mā kuntum fa-wallū wujūhakum shaṭrahu: wherever you are, turn your faces toward the Sacred Mosque. Same rule (pray toward the house from wherever you are), new house."
      - with: hb-1kgs-8-dedication-prayer
        motif: prayer-toward-the-temple
        refs: ["2:144", "2:150"]
        with_refs: ["1Kgs 8:48"]
        relation: divergence
        note: "1Kgs 8:48 wĕ-hitpallĕlû ʾēlêkā derek ʾarṣām ... hā-ʿîr ʾăšer bāḥartā wĕ-ha-bbayit ʾăšer bānîtî li-šmekā; Q 2:144 fa-walli wajhaka shaṭra l-masjidi l-ḥarām ... wa-ḥaythu mā kuntum fa-wallū wujūhakum shaṭrahu. The Jerusalem temple as prayer direction is replaced by the Sacred Mosque."
      - with: hb-isa-43-you-are-my-witnesses
        motif: israel-as-gods-witnesses
        refs: ["2:143"]
        with_refs: ["Isa 43:10"]
        relation: divergence
        note: "Isa 43:10 ʾattem ʿēday nĕʾum YHWH wĕ-ʿabdî ʾăšer bāḥārtî: Israel, the chosen servant, are God's witnesses before the nations; Q 2:143 jaʿalnākum ummatan wasaṭan li-takūnū shuhadāʾa ʿalā n-nāsi wa-yakūna r-rasūlu ʿalaykum shahīdan: the new 'middle community' are made witnesses over mankind, said just as the qibla turns away from Jerusalem."
      - with: hb-neh-5-debt-slavery-reform
        motif: remember-me-for-good-formula
        refs: ["2:152"]
        with_refs: ["Neh 5:19"]
        relation: echo
        note: "Neh 5:19 zokrâ llî ʾĕlōhay lĕ-ṭôbâ kōl ʾăšer ʿāśîtî: Nehemiah asks God to remember him; Q 2:152 fa-dhkurūnī adhkurkum wa-shkurū lī: God tells the believers to remember him and he will remember them. One-way petition vs mutual remembrance (z-k-r / dh-k-r)."
      - with: hb-neh-13-nehemiahs-final-reforms
        motif: remember-me-for-good-formula
        refs: ["2:152"]
        with_refs: ["Neh 13:14"]
        relation: echo
        note: "Neh 13:14 zokrâ llî ʾĕlōhay ʿal zōʾt wĕ-ʾal temaḥ ḥăsāday; Q 2:152 fa-dhkurūnī adhkurkum."
  - unit: quran-2-patience-signs
    checked: [hb-gen-21-isaac-born-hagar-expelled, hb-zech-14-day-on-mount-of-olives, hb-ps-107-four-rescues, hb-ps-104-creation-hymn, hb-isa-43-you-are-my-witnesses, hb-jer-31-consolation-new-covenant, hb-job-1-prologue-first-test, hb-deut-27-ebal-curses, hb-deut-6-shema]
    matches:
      - with: hb-job-1-prologue-first-test
        motif: lord-gave-lord-has-taken
        refs: ["2:156"]
        with_refs: ["Job 1:21"]
        relation: parallel
        note: "Words of the afflicted at loss: Job 1:21 ʿārōm yāṣāʾtî mi-bbeṭen ʾimmî wĕ-ʿārōm ʾāšûb šāmmâ YHWH nātan wa-YHWH lāqāḥ; Q 2:156 alladhīna idhā aṣābathum muṣībatun qālū innā li-llāhi wa-innā ilayhi rājiʿūn. Both confess that life is God's and return (šûb / rajaʿa). Job returns to the womb/earth ('there'); the Quran's speakers return to God."
      - with: hb-job-1-prologue-first-test
        motif: heavenly-wager-tests-righteous
        refs: ["2:155"]
        with_refs: ["Job 1:12", "Job 1:19"]
        relation: divergence
        note: "Job 1:12-19: God gives the Satan leave (hinnēh kol ʾăšer lô bĕ-yādekā) and Job loses flocks, servants and children; Q 2:155 wa-la-nabluwannakum bi-shayʾin mina l-khawfi wa-l-jūʿi wa-naqṣin mina l-amwāli wa-l-anfusi wa-th-thamarāt wa-bashshiri ṣ-ṣābirīn: God himself announces the test of the believers with loss of goods, lives and crops. No Satan and no wager; the test is announced beforehand to a community, and patience (ṣabr) is promised its reward."
      - with: hb-ps-104-creation-hymn
        motif: signs-in-creation-catalogue
        refs: ["2:164"]
        with_refs: ["Ps 104:3", "Ps 104:13", "Ps 104:19", "Ps 104:20", "Ps 104:24", "Ps 104:26"]
        relation: parallel
        note: "Same inventory in nearly the same order: heavens, waters and clouds (Ps 104:3 ha-śśām ʿābîm rĕkûbô), rain watering the earth (104:13), moon and sun, darkness and night (104:19-20 tāšet ḥōšek wî-hî lāylâ), the many creatures (104:24 mālĕʾâ hā-ʾāreṣ qinyānekā), ships (104:26 šām ʾŏniyyôt yĕhallēkûn); Q 2:164 khalqi s-samāwāti wa-l-arḍi wa-khtilāfi l-layli wa-n-nahāri wa-l-fulki llatī tajrī fī l-baḥri ... min māʾin fa-aḥyā bihi l-arḍa ... wa-baththa fīhā min kulli dābbatin wa-taṣrīfi r-riyāḥi wa-s-saḥāb. The psalm praises (mah rabbû maʿăśêkā); the Quran presents the list as signs for those who reason (la-āyātin li-qawmin yaʿqilūn)."
      - with: hb-ps-104-creation-hymn
        motif: rain-revives-dead-earth
        refs: ["2:164"]
        with_refs: ["Ps 104:30"]
        relation: echo
        note: "Ps 104:30 tĕšallaḥ rûḥăkā yibbārēʾûn û-tĕḥaddēš pĕnê ʾădāmâ; Q 2:164 wa-mā anzala llāhu mina s-samāʾi min māʾin fa-aḥyā bihi l-arḍa baʿda mawtihā: the earth renewed by God's spirit vs revived by rain after its death."
      - with: hb-ps-107-four-rescues
        motif: ships-on-the-sea
        refs: ["2:164"]
        with_refs: ["Ps 107:23"]
        relation: echo
        note: "Ps 107:23 yôrĕdê ha-yyām bā-ʾŏniyyôt ʿōśê mĕlāʾkâ bĕ-mayim rabbîm: seafarers doing business on great waters; Q 2:164 wa-l-fulki llatī tajrī fī l-baḥri bi-mā yanfaʿu n-nās: ships running on the sea with what profits people."
      - with: hb-jer-31-consolation-new-covenant
        motif: cosmic-ordinances-guarantee-covenant
        refs: ["2:164"]
        with_refs: ["Jer 31:35"]
        relation: echo
        note: "Jer 31:35 nōtēn šemeš lĕ-ʾôr yômām ḥuqqōt yārēaḥ wĕ-kôkābîm lĕ-ʾôr laylâ rōgaʿ ha-yyām: the fixed order of day and night and the sea as guarantee of God's covenant; Q 2:164 ikhtilāfi l-layli wa-n-nahāri ... al-baḥr: the alternation of night and day and the sea as signs of God for the reasoning."
      - with: hb-deut-6-shema
        motif: shema-god-is-one
        refs: ["2:163"]
        with_refs: ["Deut 6:4"]
        relation: parallel
        note: "Deut 6:4 šĕmaʿ yiśrāʾēl YHWH ʾĕlōhênû YHWH ʾeḥād; Q 2:163 wa-ilāhukum ilāhun wāḥidun lā ilāha illā huwa r-raḥmānu r-raḥīm: 'your God is one God'. Address to Israel vs address to all hearers; the Quran adds the r-ḥ-m pair of names."
      - with: hb-zech-14-day-on-mount-of-olives
        motif: shema-god-is-one
        refs: ["2:163"]
        with_refs: ["Zech 14:9"]
        relation: echo
        note: "Zech 14:9 yihyeh YHWH ʾeḥād û-šĕmô ʾeḥād (in the future); Q 2:163 ilāhun wāḥidun (already now)."
      - with: hb-isa-43-you-are-my-witnesses
        motif: strict-monotheism-none-besides
        refs: ["2:163"]
        with_refs: ["Isa 43:11"]
        relation: echo
        note: "Isa 43:11 ʾānōkî ʾānōkî YHWH wĕ-ʾên mi-bbalʿāday môšîaʿ; Q 2:163 lā ilāha illā huwa."
      - with: hb-deut-27-ebal-curses
        motif: concealers-cursed-by-cursers
        refs: ["2:159", "2:161"]
        with_refs: ["Deut 27:15"]
        relation: echo
        note: "Deut 27:15 ʾārûr hā-ʾîš ʾăšer yaʿăśeh pesel ... wĕ-śām ba-sāter wĕ-ʿānû kol hā-ʿām wĕ-ʾāmĕrû ʾāmēn: a curse on what is done in secret, confirmed by the whole people; Q 2:159, 161 alladhīna yaktumūna mā anzalnā ... yalʿanuhumu llāhu wa-yalʿanuhumu l-lāʿinūn ... laʿnatu llāhi wa-l-malāʾikati wa-n-nāsi ajmaʿīn: those who conceal the revelation cursed by God and by all who curse. The concealed sin is idolatry in Deut, hiding scripture in the Quran."
  - unit: quran-2-food-piety
    checked: [hb-lev-17-blood-and-slaughter, hb-lev-7-guilt-peace-portions, hb-lev-3-peace-offering, hb-lev-22-holy-food-and-unblemished-victims, hb-deut-14-diet-tithe, hb-lev-11-dietary-laws, hb-1sam-21-nob-and-gath, hb-isa-58-true-fast, hb-jer-16-fishers-and-hunters, hb-mic-6-covenant-lawsuit]
    matches:
      - with: hb-lev-17-blood-and-slaughter
        motif: prohibition-of-eating-blood
        refs: ["2:173"]
        with_refs: ["Lev 17:10", "Lev 17:11", "Lev 17:12"]
        relation: divergence
        note: "Lev 17:11 kî nepeš ha-bbāśār ba-ddām hîʾ wa-ʾănî nĕtattîw lākem ʿal ha-mmizbēaḥ lĕ-kappēr: blood is forbidden because the life is in it and it is given for atonement on the altar; Q 2:173 innamā ḥarrama ʿalaykumu l-maytata wa-d-dama: blood forbidden as one item of a short list, with no reason given and no tie to the altar."
      - with: hb-lev-17-blood-and-slaughter
        motif: eating-carrion-requires-washing
        refs: ["2:173"]
        with_refs: ["Lev 17:15"]
        relation: contrast
        note: "Lev 17:15 wĕ-kol nepeš ʾăšer tōʾkal nĕbēlâ û-ṭĕrēpâ ... wĕ-kibbes bĕgādāyw wĕ-rāḥaṣ ba-mmayim wĕ-ṭāmēʾ ʿad hā-ʿereb wĕ-ṭāhēr: eating carrion makes one impure until evening, curable by washing; Q 2:173 ḥarrama ʿalaykumu l-maytata: carrion is simply forbidden, with an exemption only for necessity."
      - with: hb-lev-17-blood-and-slaughter
        motif: food-offered-to-other-than-god
        refs: ["2:173"]
        with_refs: ["Lev 17:7"]
        relation: parallel
        note: "Lev 17:7 wĕ-lōʾ yizbĕḥû ʿôd ʾet zibḥêhem la-śśĕʿîrim: no more sacrifices to the goat-demons; Q 2:173 wa-mā uhilla bihi li-ghayri llāh: meat over which a name other than God's was invoked. Lev bans the act of sacrifice; the Quran bans the meat."
      - with: hb-lev-3-peace-offering
        motif: prohibition-of-eating-blood
        refs: ["2:173"]
        with_refs: ["Lev 3:17"]
        relation: divergence
        note: "Lev 3:17 kol ḥēleb wĕ-kol dām lōʾ tōʾkēlû: fat and blood paired; Q 2:173 wa-d-dama: blood alone. The fat ban is dropped from the list for believers (the Quran mentions the fat ban only as a law imposed on the Jews, 6:146)."
      - with: hb-lev-7-guilt-peace-portions
        motif: prohibition-of-eating-blood
        refs: ["2:173"]
        with_refs: ["Lev 7:26", "Lev 7:27"]
        relation: parallel
        note: "Lev 7:26 wĕ-kol dām lōʾ tōʾkĕlû bĕ-kōl môšĕbōtêkem lā-ʿôp wĕ-la-bbĕhēmâ; Q 2:173 ḥarrama ʿalaykumu ... d-dama."
      - with: hb-deut-14-diet-tithe
        motif: pork-forbidden
        refs: ["2:173"]
        with_refs: ["Deut 14:8"]
        relation: divergence
        note: "Deut 14:8 wĕ-ʾet ha-ḥăzîr kî mapris parsâ hûʾ wĕ-lōʾ gērâ ṭāmēʾ hûʾ lākem: the pig (ḥăzîr) is unclean because it fails the hoof-and-cud test, one case in a long taxonomy; Q 2:173 wa-laḥma l-khinzīri: pork (cognate khinzīr) is one of four named prohibitions, with no taxonomy."
      - with: hb-deut-14-diet-tithe
        motif: carcass-given-to-stranger
        refs: ["2:173"]
        with_refs: ["Deut 14:21"]
        relation: contrast
        note: "Deut 14:21 lōʾ tōʾkĕlû kol nĕbēlâ la-ggēr ... tittĕnennâ waʾăkālāh ʾô mākōr lĕ-nokrî kî ʿam qādôš ʾattâ: carrion forbidden to Israel as a holy people but may be given to the resident alien or sold to a foreigner; Q 2:173 al-mayta forbidden to all the believers, with no two-tier rule (and 2:168 addresses yā ayyuhā n-nāsu kulū mimmā fī l-arḍi ḥalālan ṭayyiban to all people)."
      - with: hb-lev-11-dietary-laws
        motif: pork-forbidden
        refs: ["2:173"]
        with_refs: ["Lev 11:7"]
        relation: parallel
        note: "Lev 11:7 wĕ-ʾet ha-ḥăzîr ... ṭāmēʾ hûʾ lākem; Q 2:173 laḥma l-khinzīr."
      - with: hb-1sam-21-nob-and-gath
        motif: necessity-permits-forbidden-food
        refs: ["2:173"]
        with_refs: ["1Sam 21:5", "1Sam 21:7"]
        relation: echo
        note: "1Sam 21:7 wa-yyitten lô ha-kkōhēn qōdeš kî lōʾ hāyâ šām leḥem kî ʾim leḥem ha-ppānîm: the hungry fugitive is given holy bread, 'for there was no bread but the showbread'; Q 2:173 fa-mani ḍṭurra ghayra bāghin wa-lā ʿādin fa-lā ithma ʿalayhi: whoever is forced by need may eat forbidden food. A narrative case of need overriding a food rule vs a general legal exemption."
      - with: hb-isa-58-true-fast
        motif: righteousness-not-facing-east-or-west
        refs: ["2:177"]
        with_refs: ["Isa 58:6", "Isa 58:7"]
        relation: parallel
        note: "Isa 58:6-7 hălôʾ zeh ṣôm ʾebḥārēhû pattēaḥ ḥarṣubbôt rešaʿ ... wĕ-šallaḥ rĕṣûṣîm ḥopšîm ... hălôʾ pārōs lā-rāʿēb laḥmekā: the real fast is freeing the oppressed and feeding the hungry; Q 2:177 laysa l-birra an tuwallū wujūhakum qibala l-mashriqi wa-l-maghribi wa-lākinna l-birra man ... ātā l-māla ... wa-fī r-riqāb: real piety is not the ritual direction of prayer but giving to the needy and freeing slaves. 'Not the rite but justice', with fasting in Isaiah and the qibla in the Quran."
      - with: hb-jer-16-fishers-and-hunters
        motif: following-ancestors-blindly
        refs: ["2:170"]
        with_refs: ["Jer 16:19"]
        relation: contrast
        note: "Jer 16:19 ʾēlêkā gôyim yābōʾû mē-ʾapsê ʾāreṣ wĕ-yōʾmĕrû ʾak šeqer nāḥălû ʾăbôtênû hebel: the nations come and renounce their fathers' heritage; Q 2:170 qālū bal nattabiʿu mā alfaynā ʿalayhi ābāʾanā: the hearers cling to their fathers' way. Same appeal to ancestors, opposite answer."
  - unit: quran-2-retaliation-bequest
    checked: [hb-num-35-levitical-cities-refuge, hb-lev-24-lamp-bread-blasphemer, hb-exod-21-bodily-injury, hb-deut-19-refuge-witnesses, hb-job-31-oath-of-innocence, hb-jer-21-zedekiah-inquiry, hb-isa-38-hezekiahs-illness, hb-gen-49-blessing-of-jacob]
    matches:
      - with: hb-num-35-levitical-cities-refuge
        motif: blood-money-pardon-option
        refs: ["2:178"]
        with_refs: ["Num 35:31"]
        relation: contrast
        note: "Num 35:31 wĕ-lōʾ tiqḥû kōper lĕ-nepeš rōṣēaḥ ʾăšer hûʾ rāšāʿ lāmût kî môt yûmāt: no ransom may be taken for a murderer's life; Q 2:178 fa-man ʿufiya lahu min akhīhi shayʾun fa-ttibāʿun bi-l-maʿrūfi wa-adāʾun ilayhi bi-iḥsānin dhālika takhfīfun min rabbikum wa-raḥmatun: if the victim's 'brother' pardons, compensation is paid, called a lightening and mercy from God. Opposite rulings on substituting payment for the killer's life."
      - with: hb-deut-19-refuge-witnesses
        motif: eye-for-eye
        refs: ["2:178", "2:179"]
        with_refs: ["Deut 19:20", "Deut 19:21"]
        relation: divergence
        note: "Deut 19:21 wĕ-lōʾ tāḥôs ʿênekā nepeš bĕ-nepeš ʿayin bĕ-ʿayin: talion with the explicit command 'show no pity'; Q 2:178 kutiba ʿalaykumu l-qiṣāṣu ... fa-man ʿufiya lahu: talion prescribed, but pardon is offered at once. The deterrent purpose is shared: Deut 19:20 wĕ-ha-nnišʾārîm yišmĕʿû wĕ-yirāʾû wĕ-lōʾ yōsipû vs Q 2:179 wa-lakum fī l-qiṣāṣi ḥayātun 'in retaliation there is life for you'."
      - with: hb-exod-21-bodily-injury
        motif: eye-for-eye
        refs: ["2:178"]
        with_refs: ["Exod 21:20", "Exod 21:23"]
        relation: divergence
        note: "Exod 21:23 wĕ-nātattâ nepeš taḥat nāpeš, but a slave killed by his master only 'shall be avenged' (21:20 nāqōm yinnāqēm) and one who survives a day is not (21:21); Q 2:178 al-ḥurru bi-l-ḥurri wa-l-ʿabdu bi-l-ʿabdi wa-l-unthā bi-l-unthā: talion matched by status class, free for free, slave for slave, female for female. Both grade the victim by status, in different ways."
      - with: hb-exod-21-bodily-injury
        motif: ransom-for-life-of-negligent-owner
        refs: ["2:178"]
        with_refs: ["Exod 21:30"]
        relation: echo
        note: "Exod 21:30 ʾim kōper yûšat ʿālāyw wĕ-nātan pidyōn napšô: a payment may redeem the life of the owner of a goring ox; Q 2:178 wa-adāʾun ilayhi bi-iḥsānin: payment in place of retaliation. In Exodus only for indirect killing; in the Quran for any killing, by the kin's choice."
      - with: hb-lev-24-lamp-bread-blasphemer
        motif: eye-for-eye
        refs: ["2:178"]
        with_refs: ["Lev 24:17", "Lev 24:21", "Lev 24:22"]
        relation: divergence
        note: "Lev 24:17, 22 wĕ-ʾîš kî yakkeh kol nepeš ʾādām môt yûmāt ... mišpaṭ ʾeḥād yihyeh lākem ka-ggēr kā-ʾezrāḥ: any killer dies, one law for alien and native; Q 2:178 al-ḥurru bi-l-ḥurri wa-l-ʿabdu bi-l-ʿabdi wa-l-unthā bi-l-unthā: retaliation by class, with pardon possible."
      - with: hb-isa-38-hezekiahs-illness
        motif: bequest-to-parents-and-kin
        refs: ["2:180"]
        with_refs: ["Isa 38:1"]
        relation: echo
        note: "Isa 38:1 ṣaw lĕ-bêtekā kî mēt ʾattâ: 'give charge to your house, for you are dying'; Q 2:180 kutiba ʿalaykum idhā ḥaḍara aḥadakumu l-mawtu in taraka khayrani l-waṣiyyatu li-l-wālidayni wa-l-aqrabīn: a dying person's charge (ṣiwwâ / waṣiyya) to the household, made a duty and given a property content in the Quran."
      - with: hb-gen-49-blessing-of-jacob
        motif: bequest-to-parents-and-kin
        refs: ["2:180", "2:181"]
        with_refs: ["Gen 49:33"]
        relation: echo
        note: "Gen 49:33 wa-ykal yaʿăqōb lĕ-ṣawwōt ʾet bānāyw: the dying patriarch's last charge (ṣawwōt) to his sons; Q 2:180-181 al-waṣiyya ... fa-man baddalahu baʿdamā samiʿahu fa-innamā ithmuhu ʿalā lladhīna yubaddilūnahu: the deathbed charge as a binding bequest whose alteration is a sin."
  - unit: quran-2-fasting
    checked: [hb-ps-145-ashrei, hb-prov-17-sayings, hb-exod-23-justice-sabbatical-festivals, hb-ps-55-dove-wings, hb-joel-2-army-and-repentance, hb-lev-23-festival-calendar, hb-lev-16-day-of-atonement, hb-deut-4-exhortation]
    matches:
      - with: hb-lev-23-festival-calendar
        motif: fast-prescribed-as-for-predecessors
        refs: ["2:183", "2:184", "2:187"]
        with_refs: ["Lev 23:27", "Lev 23:29", "Lev 23:32"]
        relation: divergence
        note: "Lev 23:27-32 wĕ-ʿinnîtem ʾet napšōtêkem ... kî kol ha-nnepeš ʾăšer lōʾ tĕʿunneh ... wĕ-nikrĕtâ ... mē-ʿereb ʿad ʿereb: one day of self-affliction on the tenth of the seventh month, from evening to evening, on pain of being cut off; Q 2:183-187 kutiba ʿalaykumu ṣ-ṣiyāmu ka-mā kutiba ʿalā lladhīna min qablikum ... ayyāman maʿdūdātin ... ḥattā yatabayyana lakumu l-khayṭu l-abyaḍu ... thumma atimmū ṣ-ṣiyāma ilā l-layl: a fast 'as prescribed for those before you', but for a whole month, from dawn to nightfall, with eating at night, and exemptions for the sick and traveller and ransom by feeding the poor (fidya). The day changes to a month, evening-to-evening to dawn-to-night, and karet to God 'wants ease for you' (yurīdu llāhu bikumu l-yusra)."
      - with: hb-lev-16-day-of-atonement
        motif: day-of-atonement-tenth-of-seventh-month
        refs: ["2:183", "2:185"]
        with_refs: ["Lev 16:29", "Lev 16:31"]
        relation: divergence
        note: "Lev 16:29 lĕ-ḥuqqat ʿôlām ... beʿāśôr la-ḥōdeš tĕʿannû ʾet napšōtêkem ... hā-ʾezrāḥ wĕ-ha-ggēr: the fast is tied to atonement and purging of the sanctuary; Q 2:183, 185 shahru ramaḍāna lladhī unzila fīhi l-qurʾānu ... la-ʿallakum tattaqūn: the fast is tied to the month in which scripture was sent down, for piety (taqwā). The fast's occasion moves from atonement to revelation."
      - with: hb-joel-2-army-and-repentance
        motif: marital-relations-permitted-fast-nights
        refs: ["2:187"]
        with_refs: ["Joel 2:15", "Joel 2:16"]
        relation: contrast
        note: "Joel 2:15-16 qaddĕšû ṣôm ... yēṣēʾ ḥātān mē-ḥedrô wĕ-kallâ mē-ḥuppātāh: for the fast even the bridegroom must leave his chamber and the bride her canopy; Q 2:187 uḥilla lakum laylata ṣ-ṣiyāmi r-rafathu ilā nisāʾikum hunna libāsun lakum wa-antum libāsun lahunna: on the nights of the fast intercourse with wives is allowed, spouses being garments for each other."
      - with: hb-ps-145-ashrei
        motif: god-near-to-all-who-call
        refs: ["2:186"]
        with_refs: ["Ps 145:18"]
        relation: parallel
        note: "Ps 145:18 qārôb YHWH lĕ-kol qōrĕʾāyw lĕ-kōl ʾăšer yiqrāʾuhû be-ʾĕmet; Q 2:186 fa-innī qarībun ujību daʿwata d-dāʿi idhā daʿāni: cognate qārôb / qarīb, 'near to those who call'. The psalm speaks of God; in the Quran God speaks in the first person (innī)."
      - with: hb-deut-4-exhortation
        motif: god-near-to-all-who-call
        refs: ["2:186"]
        with_refs: ["Deut 4:7"]
        relation: echo
        note: "Deut 4:7 mî gôy gādôl ʾăšer lô ʾĕlōhîm qĕrōbîm ʾēlāyw ka-YHWH ʾĕlōhênû bĕ-kol qorʾēnû ʾēlāyw: Israel's privilege, a God near whenever we call; Q 2:186 wa-idhā saʾalaka ʿibādī ʿannī fa-innī qarībun: God near to 'my servants' in general."
      - with: hb-prov-17-sayings
        motif: bribe-from-bosom-perverts-justice
        refs: ["2:188"]
        with_refs: ["Prov 17:23"]
        relation: parallel
        note: "Prov 17:23 šōḥad mē-ḥêq rāšāʿ yiqqāḥ lĕhaṭṭôt ʾorḥôt mišpāṭ; Q 2:188 wa-tudlū bihā ilā l-ḥukkāmi li-taʾkulū farīqan min amwāli n-nāsi bi-l-ithm: the bribe that bends judgment. Proverbs blames the taker; the Quran forbids the giver."
      - with: hb-exod-23-justice-sabbatical-festivals
        motif: bribe-blinds-the-wise
        refs: ["2:188"]
        with_refs: ["Exod 23:8"]
        relation: parallel
        note: "Exod 23:8 wĕ-šōḥad lōʾ tiqqāḥ kî ha-ššōḥad yĕʿawwēr piqḥîm: a ban addressed to judges on taking; Q 2:188 wa-tudlū bihā ilā l-ḥukkām: a ban addressed to litigants on offering wealth to judges."
  - unit: quran-2-war-pilgrimage
