  - unit: quran-75-resurrection
    checked: [hb-ezek-37-dry-bones, hb-ezek-37-two-sticks, hb-ps-139-searched-and-known, hb-joel-4-valley-of-jehoshaphat, hb-joel-2-army-and-repentance, hb-isa-26-song-and-resurrection, hb-job-10-why-did-you-make-me]
