  - unit: quran-69-haqqa-books-in-right-and-left-hands
    checked: [hb-deut-18-levites-prophet, hb-ps-87-zion-birthplace, hb-ps-69-deep-waters, hb-ps-56-tears-in-bottle, hb-ezek-21-sword-oracles, hb-isa-65-rebels-and-servants, hb-dan-7-four-beasts-son-of-man, hb-ps-149-two-edged-sword]
    matches:
