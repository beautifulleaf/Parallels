  - unit: quran-68-qalam-shin-and-jonah
    checked: [hb-prov-23-amenemope-sayings, hb-jonah-2-in-the-fish, hb-jonah-4-qiqayon, hb-jonah-3-nineveh-repents, hb-jer-15-confession-words-eaten, hb-ezek-3-watchman-and-muteness, hb-gen-18-abraham-bargains, hb-mal-3-book-of-remembrance]
    matches:
      - with: hb-jonah-2-in-the-fish
        motif: prayer-from-belly-of-fish
        refs: ["68:48"]
        with_refs: ["Jonah 2:2", "Jonah 2:3"]
        relation: divergence
        note: "The cry from the fish is a warning, not a model: Jonah 2:3 qārāʾtî mi-ṣṣārāh lî ʾel YHWH wa-yyaʿănēnî, a psalm of thanksgiving. Q 68:48 fa-ṣbir li-ḥukmi rabbika wa-lā takun ka-ṣāḥibi l-ḥūti idh nādā wa-huwa makẓūm: the call made 'choked with grief/anger' is held up as what the prophet must not imitate. Jonah is unnamed, 'the companion of the fish'."
      - with: hb-jonah-2-in-the-fish
        motif: fish-vomits-prophet-onto-land
        refs: ["68:49"]
        with_refs: ["Jonah 2:11"]
        relation: divergence
        note: "Outcome made counterfactual: Jonah 2:11 wa-yyāqēʾ ʾet Yônāh ʾel ha-yyabbāšāh (he is spat onto dry land). Q 68:49 law-lā an tadārakahu niʿmatun min rabbihi la-nubidha bi-l-ʿarāʾi wa-huwa madhmūm: without his Lord's grace he WOULD have been thrown on the barren shore in disgrace. (Q 37:145 says he was thrown there, sick, outside this unit.)"
      - with: hb-jonah-4-qiqayon
        motif: prophet-angry-at-divine-mercy
        refs: ["68:48", "68:50"]
        with_refs: ["Jonah 4:1", "Jonah 4:9", "Jonah 4:11"]
        relation: divergence
        note: "Ending changed: Jonah ends on the prophet still angry (hêṭēv ḥārāh lî ʿad māwet) and God's unanswered question (wa-ʾănî lōʾ ʾāḥûs ʿal Nînewēh). Q 68:50 closes the story with the prophet restored: fa-jtabāhu rabbuhu fa-jaʿalahu mina ṣ-ṣāliḥīn. makẓūm (choked with suppressed grief) is the Quran's word for his state, not ḥārāh."
      - with: hb-jonah-3-nineveh-repents
        motif: prophet-commissioned-second-time
        refs: ["68:50"]
        with_refs: ["Jonah 3:1"]
        relation: echo
        note: "fa-jtabāhu rabbuhu (his Lord chose him again) ~ wa-yehî devar YHWH ʾel Yônāh šēnît: the prophet taken back into service after the fish."
      - with: hb-gen-18-abraham-bargains
        motif: wicked-not-equal-to-righteous-in-life-and-death
        refs: ["68:35", "68:36"]
        with_refs: ["Gen 18:25"]
        relation: parallel
        note: "a-fa-najʿalu l-muslimīna ka-l-mujrimīn, mā lakum kayfa taḥkumūn ~ ḥālilāh lekā ... le-hāmît ṣaddîq ʿim rāšāʿ we-hāyāh ka-ṣṣaddîq kā-rāšāʿ ... hă-šōfēṭ kol hā-ʾāreṣ lōʾ yaʿăśeh mišpāṭ. The same rhetorical principle; the speaker is reversed: Abraham puts it to God, God puts it to the deniers."
      - with: hb-mal-3-book-of-remembrance
        motif: wicked-not-equal-to-righteous-in-life-and-death
        refs: ["68:35"]
        with_refs: ["Mal 3:18"]
        relation: echo
        note: "a-fa-najʿalu l-muslimīna ka-l-mujrimīn ~ we-šavtem û-reʾîtem bên ṣaddîq le-rāšāʿ bên ʿōvēd ʾĕlōhîm la-ʾăšer lōʾ ʿăvādô."
      - with: hb-prov-23-amenemope-sayings
        motif: good-eye-and-evil-eye
        refs: ["68:51"]
        with_refs: ["Prov 23:6"]
        relation: echo
        note: "weak: la-yuzliqūnaka bi-abṣārihim (they nearly make you slip with their eyes) ~ ʾal tilḥam ʾet leḥem raʿ ʿāyin. Harmful eye in both, but in Proverbs raʿ ʿayin is stinginess, in the Quran a hostile gaze."
  - unit: quran-69-haqqa-destroyed-peoples-and-the-throne
    checked: [hb-ezek-1-chariot-throne, hb-jonah-3-nineveh-repents, hb-jer-16-fishers-and-hunters, hb-gen-19-sodom-destroyed, hb-lam-2-god-as-enemy, hb-jer-49-ammon-edom-damascus-kedar-elam, hb-gen-6-flood]
