  - unit: quran-70-ascending-stairways
    checked: [hb-ps-90-moses-thousand-years, hb-ps-49-no-ransom, hb-gen-28-jacobs-ladder, hb-ezek-18-sour-grapes, hb-eccl-8-king-and-retribution, hb-amos-8-summer-fruit]
    matches:
      - with: hb-ps-90-moses-thousand-years
        motif: thousand-years-as-one-day
        refs: ["70:4"]
        with_refs: ["Ps 90:4"]
        relation: divergence
        note: "fī yawmin kāna miqdāruhu khamsīna alfa sana ~ kî ʾelef šānîm be-ʿênêkā ke-yôm ʾetmôl. Divine time on another scale: the Psalm's thousand (kept in Q 22:47, 32:5) is here fifty thousand, and the day is the day of the angels' ascent and of judgment, not the brevity of human life."
      - with: hb-ps-49-no-ransom
        motif: no-ransom-for-a-brother
        refs: ["70:11", "70:12", "70:13", "70:14"]
        with_refs: ["Ps 49:8", "Ps 49:9"]
        relation: divergence
        note: "The brother changes place: Ps 49:8 ʾāḥ lōʾ fādōh yifdeh ʾîš lōʾ yittēn lēʾlōhîm kofrô (no one can ransom his BROTHER). Q 70:11-14 yawaddu l-mujrimu law yaftadī min ʿadhābi yawmiʾidhin bi-banīhi wa-ṣāḥibatihi wa-akhīhi ... wa-man fī l-arḍi jamīʿan: the sinner would ransom HIMSELF by giving up his sons, wife, brother and clan; both deny that any ransom works (Ps 49:9 we-yēqar pidyôn nafšām; Q 70:15 kallā)."
      - with: hb-gen-28-jacobs-ladder
        motif: angels-and-spirit-ascend-to-god
        refs: ["70:3", "70:4"]
        with_refs: ["Gen 28:12"]
        relation: echo
        note: "mina llāhi dhī l-maʿārij, taʿruju l-malāʾikatu wa-r-rūḥu ilayhi ~ we-hinnēh sullām muṣṣāv ʾarṣāh we-rōʾšô maggîaʿ ha-ššāmāymāh we-hinnēh malʾăkê ʾĕlōhîm ʿōlîm we-yōrdîm bô. Angels ascending by a stair; in the Quran it becomes a divine title (dhū l-maʿārij), with no dream and no descending."
      - with: hb-ezek-18-sour-grapes
        motif: righteous-man-catalogue-of-virtues
        refs: ["70:22", "70:24", "70:25", "70:29", "70:32"]
        with_refs: ["Ezek 18:5", "Ezek 18:6", "Ezek 18:7", "Ezek 18:8"]
        relation: parallel
        note: "Catalogue defining the righteous: Ezekiel lists ʾel he-hārîm lōʾ ʾākāl ... ʾet ʾēšet rēʿēhû lōʾ ṭimmēʾ ... ḥăvōlātô ḥôv yāšîv ... laḥmô le-rāʿēv yittēn; Q 70:22-34 lists alladhīna hum ʿalā ṣalātihim dāʾimūn, fī amwālihim ḥaqqun maʿlūmun li-s-sāʾili wa-l-maḥrūm, li-furūjihim ḥāfiẓūn, li-amānātihim wa-ʿahdihim rāʿūn. Shared: sexual restraint, faithfulness with pledges and trusts, food for the poor. Ezekiel's items are cultic and judicial (mountains, menstruation, interest); the Quran's begin and end with prayer."
  - unit: quran-71-noah
    checked: [hb-job-10-why-did-you-make-me, hb-gen-6-flood, hb-ps-90-moses-thousand-years, hb-ps-78-history, hb-neh-9-levites-confession, hb-ps-104-creation-hymn, hb-gen-1-creation-six-days, hb-ps-136-great-hallel]
    matches:
      - with: hb-gen-6-flood
        motif: hero-preaches-to-people
        refs: ["71:2", "71:3", "71:5", "71:8", "71:9"]
        with_refs: ["Gen 6:13", "Gen 6:22"]
        relation: divergence
        note: "Added role: in Genesis God speaks only to Noah (wa-yyōʾmer ʾĕlōhîm le-Nōaḥ qēṣ kol bāśār bāʾ le-fānay) and Noah never speaks to anyone; he only obeys (wa-yyaʿaś Nōaḥ ke-kōl ʾăšer ṣiwwāh ʾōtô ʾĕlōhîm). In Q 71 Noah is a messenger and warner: yā-qawmi innī lakum nadhīrun mubīn, uʿbudū llāha wa-ttaqūhu wa-aṭīʿūn, preaching laylan wa-nahāran, jihāran, iʿlānan wa-isrāran. cf. 2 Pet 2:5, b. Sanh. 108 (Noah as preacher), not a match."
      - with: hb-gen-6-flood
        motif: reason-human-wickedness
        refs: ["71:21", "71:23", "71:24"]
        with_refs: ["Gen 6:5", "Gen 6:11", "Gen 6:12"]
        relation: divergence
        note: "Motive changed: Genesis gives moral corruption and violence (rabbāh rāʿat hā-ʾādām ... wa-ttimmālēʾ hā-ʾāreṣ ḥāmās; hišḥît kol bāśār ʾet darkô). Q 71 gives rejection of the messenger and idolatry: rabbi innahum ʿaṣawnī ... wa-qālū lā tadharunna ālihatakum wa-lā tadharunna waddan wa-lā suwāʿan wa-lā yaghūtha wa-yaʿūqa wa-nasrā. Five named gods; Genesis names no god but YHWH/Elohim."
      - with: hb-gen-6-flood
        motif: hero-prays-for-judgment
        refs: ["71:26", "71:27"]
        with_refs: ["Gen 6:7", "Gen 6:13"]
        relation: divergence
        note: "Who calls for destruction is reversed: in Genesis God decides alone (wa-yyōʾmer YHWH ʾemḥeh ʾet hā-ʾādām; we-hinnî mašḥîtām ʾet hā-ʾāreṣ) and even regrets creating (wa-yyinnāḥem YHWH). In Q 71:26-27 Noah asks: rabbi lā tadhar ʿalā l-arḍi mina l-kāfirīna dayyāran, innaka in tadharhum yuḍillū ʿibādaka. There is no divine regret in the Quran."
      - with: hb-gen-6-flood
        motif: repentance-brings-abundant-rain
        refs: ["71:10", "71:11"]
        with_refs: ["Gen 7:11", "Gen 7:12"]
        relation: divergence
        note: "Rain reversed: in Genesis rain from opened sky is the destruction (wa-ʾărubbōt ha-ššāmayim niftāḥû, wa-yehî ha-ggešem ʿal hā-ʾāreṣ ʾarbāʿîm yôm). Noah in Q 71:10-11 promises rain as blessing if they repent: istaghfirū rabbakum ... yursili s-samāʾa ʿalaykum midrāran, then (71:25) mimmā khaṭīʾātihim ughriqū: the sky that could have blessed them drowns them."
      - with: hb-gen-6-flood
        motif: family-saved
        refs: ["71:28"]
        with_refs: ["Gen 7:1", "Gen 7:7"]
        relation: divergence
        note: "The saved are defined by faith, not by house: Gen 7:1 bōʾ ʾattāh we-kol bêtkā ʾel ha-ttēvāh kî ʾōtkā rāʾîtî ṣaddîq. Q 71:28 rabbi ghfir lī wa-li-wālidayya wa-li-man dakhala baytiya muʾminan wa-li-l-muʾminīna wa-l-muʾmināt: whoever enters my house as a believer."
      - with: hb-gen-6-flood
        motif: promise-never-again
        refs: ["71:25", "71:28"]
        with_refs: ["Gen 8:20", "Gen 8:21"]
        relation: divergence
        note: "Ending changed: Genesis ends with Noah's sacrifice and God's promise lōʾ ʾōsîf leqallēl ʿôd ʾet hā-ʾădāmāh ... we-lōʾ ʾōsîf ʿôd lehakkôt ʾet kol ḥay. Q 71 ends with the drowned sent on into fire (ughriqū fa-udkhilū nāran) and Noah's prayer of forgiveness and of destruction (wa-lā tazidi ẓ-ẓālimīna illā tabārā). No sacrifice, no covenant, no 'never again'."
      - with: hb-job-10-why-did-you-make-me
        motif: embryo-stages-drop-clot-form
        refs: ["71:14", "71:17", "71:18"]
        with_refs: ["Job 10:8", "Job 10:9", "Job 10:10", "Job 10:11"]
        relation: parallel
        note: "Creation in stages and return to earth: wa-qad khalaqakum aṭwāran ... wa-llāhu anbatakum mina l-arḍi nabātan thumma yuʿīdukum fīhā ~ hă-lōʾ ke-ḥālāv tattîkēnî we-kaggevinnāh taqpîʾēnî, ʿôr û-vāśār talbîšēnî ... kî ka-ḥōmer ʿăśîtānî we-ʾel ʿāfār tešîvēnî. Job turns it into a complaint; Noah into an argument for reverence (mā lakum lā tarjūna li-llāhi waqāran)."
      - with: hb-ps-90-moses-thousand-years
        motif: dust-to-dust
        refs: ["71:18"]
        with_refs: ["Ps 90:3"]
        relation: divergence
        note: "thumma yuʿīdukum fīhā wa-yukhrijukum ikhrājan ~ tāšēv ʾĕnôš ʿad dakkāʾ wa-ttōʾmer šûvû venê ʾādām. Both have God return humans to the earth; the Quran adds a second bringing-out (resurrection), the Psalm's šûvû is the return to dust."
      - with: hb-gen-1-creation-six-days
        motif: great-lights-rule-day-and-night
        refs: ["71:16"]
        with_refs: ["Gen 1:16"]
        relation: parallel
        note: "wa-jaʿala l-qamara fīhinna nūran wa-jaʿala sh-shamsa sirājan ~ wa-yyaʿaś ʾĕlōhîm ʾet šenê ha-mmeʾōrōt ha-ggedōlîm ... ha-mmāʾôr ha-ggādōl ... ha-mmāʾôr ha-qqāṭōn. Genesis avoids naming sun and moon; the Quran names them and distinguishes lamp (sirāj) from light (nūr)."
      - with: hb-ps-136-great-hallel
        motif: earth-spread-out-like-carpet
        refs: ["71:19", "71:20"]
        with_refs: ["Ps 136:6"]
        relation: echo
        note: "wa-llāhu jaʿala lakumu l-arḍa bisāṭan ~ le-rōqaʿ hā-ʾāreṣ ʿal ha-mmāyim. The Quran adds the purpose: li-taslukū minhā subulan fijājan."
  - unit: quran-72-jinn
    checked: [hb-ps-91-shelter-of-most-high, hb-isa-26-song-and-resurrection, hb-dan-12-resurrection-end, hb-isa-63-communal-lament, hb-ps-17-apple-of-eye, hb-job-9-job-cannot-sue-god]
