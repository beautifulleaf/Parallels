      - with: hb-ps-87-zion-birthplace
        motif: heavenly-book-of-life
        refs: ["69:19"]
        with_refs: ["Ps 87:6"]
        relation: echo
        note: "kitābahu ~ YHWH yispōr bi-ktôv ʿammîm zeh yullad šām: God's register of persons."
      - with: hb-dan-7-four-beasts-son-of-man
