        refs: ["75:3", "75:4"]
        with_refs: ["Ezek 37:7", "Ezek 37:8"]
        relation: parallel
        note: "a-yaḥsabu l-insānu allan najmaʿa ʿiẓāmahu, balā qādirīna ʿalā an nusawwiya banānahu ~ wa-ttiqrevû ʿăṣāmôt ʿeṣem ʾel ʿaṣmô ... gīdîm û-vāśār ʿālāh wa-yyiqram ʿălêhem ʿôr. Bones gathered and the body restored in detail (sinews, flesh, skin / fingertips). Ezekiel's vision is a figure for national restoration (37:11), the Quran's is the individual's resurrection argued against a skeptic."
