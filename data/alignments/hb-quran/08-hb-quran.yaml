new_motifs:
  daughter-of-amram-named-miriam: {label: "Miriam / Maryam named as the daughter of Amram / ʿImran", cluster: patriarchs}
reviewed:
  - unit: quran-63-munafiqun-propped-timbers
    checked: [hb-jer-10-idols-scarecrows, hb-ps-135-hymn-of-election, hb-mal-3-tithes, hb-jer-7-queen-of-heaven, hb-exod-20-decalogue, hb-jer-31-consolation-new-covenant, hb-isa-38-hezekiahs-illness, hb-2kgs-20-hezekiah-illness-babylon]
    matches:
      - with: hb-jer-10-idols-scarecrows
        motif: hypocrites-like-propped-up-timbers
        refs: ["63:4"]
        with_refs: ["Jer 10:3", "Jer 10:4", "Jer 10:5"]
        relation: echo
        note: "ka-annahum khushubun musannadatun 'as if they were propped-up timbers' (impressive bodies, tuʿjibuka ajsāmuhum) ~ the idol is ʿēṣ mi-yyaʿar, decorated with silver and gold (yeyappēhû), fastened with nails so it will not totter (be-masmerôt ... yeḥazzeqûm we-lôʾ yāfîq), ke-tōmer miqšāh 'like a scarecrow in a cucumber field'. Same image of handsome but lifeless propped wood; Jeremiah applies it to idols, the Quran to human hypocrites."
      - with: hb-jer-7-queen-of-heaven
        motif: prophet-forbidden-to-intercede
        refs: ["63:6"]
        with_refs: ["Jer 7:16"]
        relation: parallel
        note: "sawāʾun ʿalayhim a-staghfarta lahum am lam tastaghfir lahum lan yaghfira llāhu lahum ~ we-ʾattāh ʾal titpallēl beʿad hā-ʿām ha-zzeh ... kî ʾênennî šōmēaʿ ʾōtāk. In Jeremiah God forbids the prophet to pray because he will not hear; in the Quran the prophet's asking forgiveness is declared useless for the hypocrites."
      - with: hb-ps-135-hymn-of-election
        motif: heavenly-storehouse-of-rain
        refs: ["63:7"]
        with_refs: ["Ps 135:7"]
        relation: echo
        note: "wa-li-llāhi khazāʾinu s-samāwāti wa-l-arḍ ~ môṣēʾ rûaḥ mē-ʾôṣerôtāyw (wind from his storehouses). Shared image of divine treasuries; the Quran uses it against the hypocrites' 'do not spend on those with the messenger'."
      - with: hb-mal-3-tithes
        motif: heavenly-storehouse-of-rain
        refs: ["63:7"]
        with_refs: ["Mal 3:10"]
        relation: echo
        note: "Both tie giving to God's treasuries: lā tunfiqū ... wa-li-llāhi khazāʾinu s-samāwāt (withholding is pointless, the treasuries are God's) ~ hābîʾû ʾet kol ha-maʿaśēr ʾel bêt hā-ʾôṣār ... ʾim lōʾ ʾeftaḥ lākem ʾēt ʾărubbôt ha-šāmayim (bring the tithe to the storehouse and he opens the windows of heaven)."
      - with: hb-isa-38-hezekiahs-illness
        motif: life-extended-fifteen-years
        refs: ["63:10", "63:11"]
        with_refs: ["Isa 38:1", "Isa 38:5"]
        relation: contrast
        note: "Opposite teaching on the plea for more time at death: rabbi law-lā akhkhartanī ilā ajalin qarībin fa-aṣṣaddaqa ... wa-lan yuʾakhkhira llāhu nafsan idhā jāʾa ajaluhā ~ ṣaw le-vêtekā kî mēt ʾattāh ... šāmaʿtî ʾet tefillātekā ... hinenî yôsîf ʿal yāmêkā ḥămēš ʿeśrēh šānāh. Hezekiah's prayer at death wins fifteen years; in the Quran no soul is delayed when its term comes."
      - with: hb-2kgs-20-hezekiah-illness-babylon
        motif: life-extended-fifteen-years
        refs: ["63:11"]
        with_refs: ["2Kgs 20:1", "2Kgs 20:6"]
        relation: contrast
        note: "lan yuʾakhkhira llāhu nafsan idhā jāʾa ajaluhā ~ we-hōsaftî ʿal yāmêkā ḥămēš ʿeśrēh šānāh; same contrast as Isa 38."
  - unit: quran-64-taghabun-day-of-loss-and-household-enemies
    checked: [hb-mic-7-lament-and-hope, hb-jer-16-fishers-and-hunters, hb-gen-9-noahide-covenant, hb-isa-45-cyrus-the-anointed, hb-ps-44-national-lament, hb-isa-63-communal-lament, hb-prov-19-sayings]
    matches:
      - with: hb-mic-7-lament-and-hope
        motif: family-members-become-enemies
        refs: ["64:14"]
        with_refs: ["Mic 7:5", "Mic 7:6"]
        relation: divergence
        note: "inna min azwājikum wa-awlādikum ʿaduwwan lakum fa-ḥdharūhum ~ ʾōyevê ʾîš ʾanšê vêtô, and mi-ššōkevet ḥêqekā šemōr pitḥê fîkā (guard your mouth from her who lies in your bosom). Same warning about wife and children as enemies; Micah ends in distrust, the Quran adds wa-in taʿfū wa-taṣfaḥū wa-taghfirū (pardon them) and turns it into a trial (fitna, 64:15)."
      - with: hb-isa-45-cyrus-the-anointed
        motif: creation-not-in-play
        refs: ["64:3"]
        with_refs: ["Isa 45:18"]
        relation: parallel
        note: "khalaqa s-samāwāti wa-l-arḍa bi-l-ḥaqq ~ bôrēʾ ha-šāmayim ... lōʾ tōhû verāʾāh lā-ševet yeṣārāh: creation was not made in vain/as chaos but with purpose."
      - with: hb-gen-9-noahide-covenant
        motif: human-in-divine-image
        refs: ["64:3"]
        with_refs: ["Gen 9:6"]
        relation: echo
        note: "loose: wa-ṣawwarakum fa-aḥsana ṣuwarakum (he shaped you and made your forms good) ~ kî be-ṣelem ʾĕlōhîm ʿāśāh ʾet hā-ʾādām. The Quran speaks of a good form (ṣūra) given by God, never of God's image."
      - with: hb-ps-44-national-lament
        motif: god-alone-knows-hearts
        refs: ["64:4"]
        with_refs: ["Ps 44:22"]
        relation: echo
        note: "wa-llāhu ʿalīmun bi-dhāti ṣ-ṣudūr ~ kî hûʾ yōdēaʿ taʿălumôt lēv."
      - with: hb-jer-16-fishers-and-hunters
        motif: god-alone-knows-hearts
        refs: ["64:4"]
        with_refs: ["Jer 16:17"]
        relation: echo
        note: "yaʿlamu mā tusirrūna wa-mā tuʿlinūn ~ kî ʿênay ʿal kol darkêhem lōʾ nisterû mi-lpānāy."
      - with: hb-prov-19-sayings
        motif: goodly-loan-to-god-doubled
        refs: ["64:17"]
        with_refs: ["Prov 19:17"]
        relation: parallel
        note: "in tuqriḍū llāha qarḍan ḥasanan yuḍāʿifhu lakum ~ malwēh YHWH ḥônēn dāl û-gemulô yešallem lô: giving is a loan to God that he repays. The Quran says 'doubles it'; Proverbs specifies the loan is mercy to the poor."
  - unit: quran-65-talaq-divorce-and-seven-earths
    checked: [hb-neh-9-levites-confession, hb-mal-2-faithless-marriage, hb-lev-5-graduated-and-guilt-offerings, hb-exod-20-decalogue, hb-jer-3-return-faithless-wife, hb-deut-24-divorce-pledges-poor]
    matches:
      - with: hb-deut-24-divorce-pledges-poor
        motif: bill-of-divorce
        refs: ["65:1"]
        with_refs: ["Deut 24:1", "Deut 24:2"]
        relation: divergence
        note: "Grounds and house reversed. Deut 24:1 kî māṣāʾ vāh ʿerwat dāvār we-kātav lāh sēfer kerîtut ... we-šillḥāh mi-bbêtô (he finds 'some indecency', writes a writ, sends her out of HIS house). Q 65:1 lā tukhrijūhunna min buyūtihinna wa-lā yakhrujna illā an yaʾtīna bi-fāḥishatin mubayyinatin: during the ʿidda the wife may not be put out of HER house, and 'flagrant indecency' is the only ground for eviction, not the ground for divorce. No written writ in the Quran; instead a counted waiting period (aḥṣū l-ʿidda)."
      - with: hb-deut-24-divorce-pledges-poor
        motif: retain-or-part-honorably-with-two-witnesses
        refs: ["65:1", "65:2"]
        with_refs: ["Deut 24:4"]
        relation: divergence
        note: "Return to the wife: Deut 24:4 lōʾ yûkal baʿlāh hā-riʾšôn ... lāšûv le-qaḥtāh (after she has married another, never; tôʿēvāh hîʾ). Q 65:1-2 keeps return open: laʿalla llāha yuḥdithu baʿda dhālika amran ... fa-amsikūhunna bi-maʿrūfin aw fāriqūhunna bi-maʿrūf, with two just witnesses (wa-ashhidū dhaway ʿadlin). The Quran's own rule on remarriage after a third divorce (2:230) is outside this unit."
      - with: hb-mal-2-faithless-marriage
        motif: bill-of-divorce
        refs: ["65:1", "65:2"]
        with_refs: ["Mal 2:14", "Mal 2:16"]
        relation: contrast
        note: "Mal 2:16 kî śānēʾ šallaḥ ʾāmar YHWH (God hates sending away), and YHWH hēʿîd bênkā û-vên ʾēšet neʿûrêkā (God is the witness of the marriage). Q 65 regulates divorce without censure (idhā ṭallaqtumu n-nisāʾa fa-ṭalliqūhunna li-ʿiddatihinna) and the witnesses are two human ʿadl men at the parting, while the warning is ittaqū llāha rabbakum."
      - with: hb-lev-5-graduated-and-guilt-offerings
        motif: offering-scaled-to-means
        refs: ["65:7"]
        with_refs: ["Lev 5:7", "Lev 5:11"]
        relation: echo
        note: "li-yunfiq dhū saʿatin min saʿatihi wa-man qudira ʿalayhi rizquhu fa-l-yunfiq mimmā ātāhu llāh, lā yukallifu llāhu nafsan illā mā ātāhā ~ we-ʾim lōʾ taggîaʿ yādô dê śeh ... šettê tōrîm. Same principle of obligation scaled to means; Leviticus applies it to the sin offering, the Quran to child-support of a divorcee."
      - with: hb-neh-9-levites-confession
        motif: heaven-of-heavens
        refs: ["65:12"]
        with_refs: ["Neh 9:6"]
        relation: echo
        note: "allāhu lladhī khalaqa sabʿa samāwātin wa-mina l-arḍi mithlahunna ~ ʾattāh ʿāśîtā ʾet ha-šāmayim šemê ha-šāmayim we-kol ṣevāʾām hā-ʾāreṣ. Plural heavens made by God; the Quran numbers them seven and adds seven earths, unknown to the Hebrew Bible (cf. rabbinic seven earths, Lev. Rab. 29:11, not a match)."
  - unit: quran-66-tahrim-wives-and-the-four-women
    checked: [hb-exod-6-name-and-levite-genealogy, hb-num-26-second-census, hb-prov-25-hezekiah-collection, hb-prov-20-sayings, hb-prov-11-sayings, hb-jer-44-queen-of-heaven, hb-num-30-vows, hb-gen-19-sodom-destroyed, hb-gen-6-flood, hb-exod-2-moses-birth-flight-midian, hb-dan-9-prayer-seventy-weeks]
    matches:
      - with: hb-num-30-vows
        motif: binding-vows
        refs: ["66:1", "66:2"]
        with_refs: ["Num 30:3", "Num 30:9"]
        relation: contrast
        note: "Self-imposed prohibition by oath: Num 30:3 ʾîš kî yiddōr neder ... ʾô hiššāvaʿševuʿāh leʾsōr ʾissār ʿal nafšô lōʾ yaḥēl devārô (a man's binding prohibition on himself cannot be broken; only a woman's vow can be annulled by father or husband, 30:9 we-hēfēr ʾet nidrāh). Q 66:1-2 lima tuḥarrimu mā aḥalla llāhu laka ... qad faraḍa llāhu lakum taḥillata aymānikum: God rebukes the prophet for forbidding himself what is lawful and prescribes the release of men's oaths."
      - with: hb-num-26-second-census
        motif: daughter-of-amram-named-miriam
        refs: ["66:12"]
        with_refs: ["Num 26:59"]
        relation: echo
        note: "maryama bnata ʿimrāna ~ wa-tēled le-ʿAmrām ʾet ʾAhărōn we-ʾet Mōšeh we-ʾēt Miryām ʾăḥōtām. The Hebrew Bible's only Miriam is the daughter of Amram and sister of Aaron; the Quran gives the mother of Jesus the same name and father. Leads only: the identification question is for the checkers."
      - with: hb-exod-6-name-and-levite-genealogy
        motif: daughter-of-amram-named-miriam
        refs: ["66:12"]
        with_refs: ["Exod 6:20"]
        relation: echo
        note: "ʿimrān ~ wa-yiqqaḥ ʿAmrām ʾet Yôkeved ... wa-tēled lô ʾet ʾAhărōn we-ʾet Mōšeh: Amram as father of the prophets' family (Miriam unnamed here; named in Num 26:59)."
      - with: hb-prov-11-sayings
        motif: talebearer-reveals-secrets
        refs: ["66:3"]
        with_refs: ["Prov 11:13"]
        relation: echo
        note: "wa-idh asarra n-nabiyyu ilā baʿḍi azwājihi ḥadīthan fa-lammā nabbaʾat bihi ~ hôlēk rākîl megalleh sôd we-neʾĕman rûaḥ mekasseh dāvār. The divulged confidence; in the Quran God himself exposes the leak (wa-aẓharahu llāhu ʿalayhi)."
      - with: hb-prov-20-sayings
        motif: talebearer-reveals-secrets
        refs: ["66:3"]
        with_refs: ["Prov 20:19"]
        relation: echo
        note: "nabbaʾat bihi ~ gôleh sôd hôlēk rākîl."
      - with: hb-prov-25-hezekiah-collection
        motif: talebearer-reveals-secrets
        refs: ["66:3"]
        with_refs: ["Prov 25:9"]
        relation: echo
        note: "asarra ... ḥadīthan ~ we-sôd ʾaḥēr ʾal tegal."
      - with: hb-gen-19-sodom-destroyed
        motif: wife-turned-to-pillar-of-salt
        refs: ["66:10"]
        with_refs: ["Gen 19:26"]
        relation: divergence
        note: "Lot's wife's fate and fault changed: Gen 19:26 wattabbēṭ ʾištô mē-ʾaḥărāyw wattehî neṣîv melaḥ (she looks back and becomes a pillar of salt). Q 66:10 imraʾata lūṭin ... fa-khānatāhumā ... wa-qīla dkhulā n-nāra maʿa d-dākhilīn: her sin is betrayal (khiyāna) of a righteous husband and her end is the Fire, not salt."
      - with: hb-gen-6-flood
        motif: family-saved
        refs: ["66:10"]
        with_refs: ["Gen 7:7", "Gen 7:13"]
        relation: divergence
        note: "Noah's wife reversed: in Genesis she is among the saved (wa-yāvōʾ Nōaḥ ... we-ʾištô ... ʾel ha-tēvāh; we-ʾēšet Nōaḥ ... ʾittām ʾel ha-tēvāh). Q 66:10 imraʾata nūḥin ... kānatā taḥta ʿabdayni min ʿibādinā ṣāliḥayni fa-khānatāhumā ... dkhulā n-nār: she betrayed him and is condemned. cf. Gen. Rab. 23:3 on Naamah and Gnostic Norea (not a match)."
      - with: hb-exod-2-moses-birth-flight-midian
        motif: found-by-royal-household
        refs: ["66:11"]
        with_refs: ["Exod 2:5", "Exod 2:6", "Exod 2:10"]
        relation: divergence
        note: "The righteous woman of Pharaoh's house: Exodus has bat parʿōh, who pities the Hebrew child (wattaḥmōl ʿālāyw) and adopts him (wa-yehî lāh le-vēn). The Quran has imraʾata firʿawna, held up as the model believer who prays rabbi bni lī ʿindaka baytan fī l-janna wa-najjinī min firʿawna wa-ʿamalihi: daughter becomes wife, and she is set against Pharaoh himself. Her rescue of Moses is told in Q 28:9, outside this unit."
      - with: hb-dan-9-prayer-seventy-weeks
        motif: angel-gabriel-named
        refs: ["66:4"]
        with_refs: ["Dan 9:21"]
        relation: echo
        note: "wa-jibrīlu wa-ṣāliḥu l-muʾminīna wa-l-malāʾikatu baʿda dhālika ẓahīr ~ we-hā-ʾîš Gavrîʾēl ʾăšer rāʾîtî ve-ḥāzôn. The only named angel shared by both books; in Daniel he comes to explain the vision, in Q 66:4 he is the prophet's ally (ẓahīr) in a household dispute."
  - unit: quran-67-mulk-heavens-lamps-and-hell
    checked: [hb-ps-94-god-of-vengeance, hb-ps-145-ashrei, hb-judg-5-song-of-deborah, hb-isa-45-cyrus-the-anointed, hb-isa-63-communal-lament, hb-ps-18-storm-theophany, hb-ps-33-creation-by-word, hb-deut-30-return-choose-life]
    matches:
      - with: hb-ps-94-god-of-vengeance
        motif: maker-of-eye-and-ear-sees-and-hears
        refs: ["67:13", "67:14"]
        with_refs: ["Ps 94:7", "Ps 94:9", "Ps 94:11"]
        relation: parallel
        note: "a-lā yaʿlamu man khalaqa wa-huwa l-laṭīfu l-khabīr ~ hă-nōṭaʿ ʾōzen hă-lōʾ yišmāʿ ʾim yōṣēr ʿayin hă-lōʾ yabbîṭ ... YHWH yōdēaʿ maḥševôt ʾādām. Same argument from the creator to his knowledge, answering the doubt of Ps 94:7 lōʾ yirʾeh Yāh. 67:13 asirrū qawlakum aw-jharū bihi parallels maḥševôt."
      - with: hb-ps-33-creation-by-word
        motif: god-fashions-all-hearts
        refs: ["67:13", "67:14"]
        with_refs: ["Ps 33:13", "Ps 33:15"]
        relation: parallel
        note: "innahu ʿalīmun bi-dhāti ṣ-ṣudūr, a-lā yaʿlamu man khalaqa ~ ha-yyōṣēr yaḥad libbām ha-mmēvîn ʾel kol maʿăśêhem: he who formed the hearts knows them."
      - with: hb-ps-145-ashrei
        motif: everlasting-kingdom-of-god
        refs: ["67:1"]
        with_refs: ["Ps 145:13"]
        relation: echo
        note: "tabāraka lladhī bi-yadihi l-mulku ~ malkûtekā malkût kol ʿōlāmîm û-memšaltekā be-kol dôr wā-dôr."
      - with: hb-judg-5-song-of-deborah
        motif: stars-fight-from-heaven
        refs: ["67:5"]
        with_refs: ["Judg 5:20"]
        relation: divergence
        note: "Stars as weapons, but against different enemies: wa-jaʿalnāhā rujūman li-sh-shayāṭīn (lamps of the lowest heaven made missiles against devils) ~ min šāmayim nilḥāmû ha-kôkāvîm mi-mmesillôtām nilḥămû ʿim Sîserāʾ (against a human general)."
      - with: hb-deut-30-return-choose-life
        motif: choose-life
        refs: ["67:2"]
        with_refs: ["Deut 30:15", "Deut 30:19"]
        relation: divergence
        note: "Death and life paired as God's doing: Deut 30:19 ha-ḥayyîm we-ha-mmāwet nātattî le-fānêkā ... û-vāḥartā ba-ḥayyîm (set before you to choose). Q 67:2 alladhī khalaqa l-mawta wa-l-ḥayāta li-yabluwakum ayyukum aḥsanu ʿamalan: both are created, and life is the test itself, not one option of a choice."
  - unit: quran-67-mulk-earth-birds-and-water
    checked: [hb-ps-106-national-confession, hb-num-26-second-census, hb-num-16-korah, hb-isa-40-comfort-my-people, hb-job-9-job-cannot-sue-god, hb-job-12-ask-the-beasts, hb-job-38-whirlwind-animals]
    matches:
      - with: hb-num-16-korah
        motif: earth-swallows-rebels
        refs: ["67:16"]
        with_refs: ["Num 16:30", "Num 16:32"]
        relation: echo
        note: "a-amintum man fī s-samāʾi an yakhsifa bikumu l-arḍa fa-idhā hiya tamūr ~ û-fāṣetāh hā-ʾădāmāh ʾet pîhā û-vāleʿāh ʾōtām ... we-yāredû ḥayyîm šeʾōlāh. Korah's punishment becomes a general threat to all deniers."
      - with: hb-ps-106-national-confession
        motif: earth-swallows-rebels
        refs: ["67:16"]
        with_refs: ["Ps 106:17"]
        relation: echo
        note: "yakhsifa bikumu l-arḍ ~ tiftaḥ ʾereṣ wa-tivlaʿ Dātān."
      - with: hb-num-26-second-census
        motif: earth-swallows-rebels
        refs: ["67:16"]
        with_refs: ["Num 26:10"]
        relation: echo
        note: "yakhsifa bikumu l-arḍ ~ wa-tiftaḥ hā-ʾāreṣ ʾet pîhā wa-tivlaʿ ʾōtām ... wa-yihyû le-nēs (they became a sign)."
      - with: hb-job-9-job-cannot-sue-god
        motif: earth-swallows-rebels
        refs: ["67:16"]
        with_refs: ["Job 9:6"]
        relation: echo
        note: "fa-idhā hiya tamūr (the earth heaves) ~ ha-mmargîz ʾereṣ mi-mmeqômāh we-ʿammûdêhā yitpallāṣûn."
      - with: hb-job-38-whirlwind-animals
        motif: birds-held-aloft-by-the-merciful
        refs: ["67:19"]
        with_refs: ["Job 39:26"]
        relation: parallel
        note: "a-wa-lam yaraw ilā ṭ-ṭayri fawqahum ṣāffātin wa-yaqbiḍna mā yumsikuhunna illā r-raḥmān ~ hă-mi-bbînātekā yaʾăver nēṣ yifrōś kenāfāyw le-têmān. The spread wings of the bird in flight held up by God, not by human wisdom; both are rhetorical questions."
      - with: hb-job-12-ask-the-beasts
        motif: birds-held-aloft-by-the-merciful
        refs: ["67:19"]
        with_refs: ["Job 12:7", "Job 12:9"]
        relation: echo
        note: "a-wa-lam yaraw ilā ṭ-ṭayr ~ šeʾal nāʾ ... ʿôf ha-šāmayim we-yagged lāk ... kî yad YHWH ʿāśetāh zōʾt: the birds as witness to God's hand."
      - with: hb-job-12-ask-the-beasts
        motif: water-sinking-into-earth-who-will-bring-it
        refs: ["67:30"]
        with_refs: ["Job 12:15"]
        relation: echo
        note: "in aṣbaḥa māʾukum ghawran fa-man yaʾtīkum bi-māʾin maʿīn ~ hēn yaʿṣōr ba-mmayim we-yivāšû: God can withhold the waters."
  - unit: quran-68-qalam-the-pen-and-the-slanderer
    checked: [hb-ezek-9-mark-on-foreheads, hb-lev-19-holiness-code-a, hb-isa-37-deliverance, hb-isa-30-rahab-who-sits-still, hb-ezek-33-watchman-and-fall-news, hb-ezek-21-sword-oracles, hb-deut-23-assembly-camp, hb-prov-6-surety-ant-scoundrel]
    matches:
      - with: hb-lev-19-holiness-code-a
        motif: talebearing-forbidden
        refs: ["68:10", "68:11"]
        with_refs: ["Lev 19:16"]
        relation: parallel
        note: "wa-lā tuṭiʿ kulla ḥallāfin mahīn, hammāzin mashshāʾin bi-namīm ~ lōʾ tēlēk rākîl be-ʿammêkā: the one who 'goes about' (mashshāʾ / hōlēk) with slander. Law of conduct in Leviticus; in the Quran a portrait of a named opponent who must not be obeyed."
      - with: hb-prov-6-surety-ant-scoundrel
