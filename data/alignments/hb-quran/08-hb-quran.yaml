        with_refs: ["Josh 24:13", "Josh 24:14"]
        relation: echo
        note: "fa-l-yaʿbudū rabba hādhā l-bayti lladhī aṭʿamahum min jūʿin wa-āmanahum min khawf ~ wā-ʾettēn lākem ʾereṣ ... kerāmîm we-zêtîm ʾăšer lōʾ neṭaʿtem ʾattem ʾōkelîm; we-ʿattāh yerʾû ʾet YHWH we-ʿivdû ʾōtô: God's gift of food and settled life is the ground for the call to serve him."
  - unit: quran-109-111-disbelievers-help-flame
    checked: [hb-prov-11-sayings, hb-1sam-25-nabal-abigail, hb-job-1-prologue-first-test, hb-zech-13-fountain-and-shepherd, hb-ezek-3-watchman-and-muteness, hb-josh-24-shechem-covenant, hb-ruth-1-naomi-ruth-return, hb-isa-2-mountain-and-day-of-yhwh]
    matches:
      - with: hb-josh-24-shechem-covenant
        motif: disavowal-of-other-worship-formula
        refs: ["109:2", "109:3", "109:6"]
        with_refs: ["Josh 24:15"]
        relation: parallel
        note: "lā aʿbudu mā taʿbudūna ... lakum dīnukum wa-liya dīn ~ baḥărû lākem ha-yyôm ʾet mî taʿăvōdûn ... we-ʾānōkî û-vêtî naʿăvōd ʾet YHWH: the speaker declares his own worship and leaves the others theirs, with the same verb (ʿabada / ʿāvad)."
      - with: hb-ruth-1-naomi-ruth-return
        motif: loyal-daughter-in-law-oath
        refs: ["109:6"]
        with_refs: ["Ruth 1:16"]
        relation: contrast
        note: "Opposite formulas of religious belonging: lakum dīnukum wa-liya dīn (your religion is yours and mine is mine) ~ ʿammēk ʿammî wē-ʾlōhayik ʾĕlōhāy (your people my people, your God my God). Separation against adoption."
      - with: hb-1sam-25-nabal-abigail
        motif: name-is-destiny
        refs: ["111:1", "111:3"]
        with_refs: ["1Sam 25:25"]
        relation: parallel
        note: "tabbat yadā abī lahabin ... sa-yaṣlā nāran dhāta lahab ~ kî ki-šmô ken hûʾ nāvāl šemô û-nevālāh ʿimmô: the enemy's name foretells his end (Father of Flame burns in flame; Fool and folly)."
      - with: hb-prov-11-sayings
        motif: wealth-useless-on-day-of-wrath
        refs: ["111:2"]
        with_refs: ["Prov 11:4"]
        relation: parallel
        note: "mā aghnā ʿanhu māluhu wa-mā kasab ~ lōʾ yôʿîl hôn be-yôm ʿevrāh."
      - with: hb-isa-2-mountain-and-day-of-yhwh
        motif: people-enter-religion-in-crowds
        refs: ["110:1", "110:2"]
        with_refs: ["Isa 2:2", "Isa 2:3"]
        relation: echo
        note: "idhā jāʾa naṣru llāhi wa-l-fatḥu wa-raʾayta n-nāsa yadkhulūna fī dīni llāhi afwājan ~ we-nāharû ʾēlāyw kol ha-ggôyim we-hālekû ʿammîm rabbîm ... wi-yōrēnû mi-ddrākāyw: peoples streaming in to God's way. Isaiah's is eschatological and centered on Zion, the Quran's is the Prophet's own lifetime."
  - unit: quran-112-114-unity-and-refuge
    checked: [hb-ps-91-shelter-of-most-high, hb-ezek-13-false-prophets-and-prophetesses, hb-deut-6-shema, hb-zech-14-day-on-mount-of-olives, hb-ps-121-keeper-of-israel, hb-nah-1-avenging-god, hb-ps-2-anointed-son, hb-isa-40-comfort-my-people]
    matches:
      - with: hb-deut-6-shema
        motif: shema-god-is-one
        refs: ["112:1"]
        with_refs: ["Deut 6:4"]
        relation: parallel
        note: "qul huwa llāhu aḥad ~ šemaʿ Yiśrāʾēl YHWH ʾĕlōhênû YHWH ʾeḥād: the oneness confession with the cognate numeral aḥad / ʾeḥād. Divergence of address: Israel is called to hear about 'our God'; the Prophet is told 'Say' to all, and no people is named."
      - with: hb-zech-14-day-on-mount-of-olives
        motif: shema-god-is-one
        refs: ["112:1"]
        with_refs: ["Zech 14:9"]
        relation: echo
        note: "huwa llāhu aḥad ~ bayyôm ha-hûʾ yihyeh YHWH ʾeḥād û-šemô ʾeḥād."
      - with: hb-ps-2-anointed-son
        motif: god-neither-begets-nor-begotten
        refs: ["112:3"]
        with_refs: ["Ps 2:7"]
        relation: contrast
        note: "lam yalid wa-lam yūlad ~ beni ʾattāh ʾănî ha-yyôm yelidtîkā: the same root (w-l-d / y-l-d) affirmed of God toward the king in the Psalm, denied of God absolutely in the Quran. The Quran's target is usually read as Christian sonship (Nicene 'begotten'); the link to Ps 2:7 is a lead, not an explicit answer."
      - with: hb-isa-40-comfort-my-people
        motif: to-whom-will-you-liken-god
        refs: ["112:4"]
        with_refs: ["Isa 40:18", "Isa 40:25"]
        relation: parallel
        note: "wa-lam yakun lahu kufuwan aḥad ~ we-ʾel mî tedammeyûn ʾēl ... we-ʾel mî tedammeyûnî we-ʾešweh: nothing equal to God (kufuʾ ~ ʾešweh)."
      - with: hb-ps-91-shelter-of-most-high
        motif: night-terror-and-noonday-demon
        refs: ["113:1", "113:3"]
        with_refs: ["Ps 91:5", "Ps 91:6"]
        relation: parallel
        note: "qul aʿūdhu bi-rabbi l-falaq ... wa-min sharri ghāsiqin idhā waqab ~ lōʾ tîrāʾ mi-ppaḥad lāylāh ... mi-ddever bā-ʾōfel yahălōk mi-qqeṭev yāšûd ṣohŏrāyim: refuge in God from the evils of the dark; both later used apotropaically."
      - with: hb-ps-121-keeper-of-israel
        motif: refuge-formula-a-udhu
        refs: ["113:1", "113:2", "114:1"]
        with_refs: ["Ps 121:7"]
        relation: echo
        note: "aʿūdhu bi-rabbi l-falaq min sharri mā khalaq ~ YHWH yišmorkā mi-kkol rāʿ yišmōr ʾet nafšekā: God guards from every evil. The Quran puts it in the first person as a formula to be said (qul aʿūdhu)."
      - with: hb-ezek-13-false-prophets-and-prophetesses
        motif: women-blowing-on-knots
        refs: ["113:4"]
        with_refs: ["Ezek 13:18", "Ezek 13:20"]
        relation: echo
        note: "wa-min sharri n-naffāthāti fī l-ʿuqad ~ hôy li-mtapperôt kesātôt ʿal kol ʾaṣṣîlê yāday ... leṣôdēd nefāšôt: women's binding magic (knots / sewn bands) that traps souls. The Quran seeks refuge, Ezekiel denounces; both feminine plurals."
