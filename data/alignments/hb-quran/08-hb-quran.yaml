        note: "Throne-bearers: Ezekiel sees ʾarbaʿ ḥayyôt with demût ʾādām, the raqîaʿ over their heads and above it demût kissēʾ with a figure kĕ-marʾēh ʾādām. Q 69:17 wa-l-malaku ʿalā arjāʾihā wa-yaḥmilu ʿarsha rabbika fawqahum yawmaʾidhin thamāniya: EIGHT bear the Throne, at the last day, not in a prophet's vision, and nothing is said of a human likeness on it."
      - with: hb-gen-19-sodom-destroyed
        motif: cities-overturned
        refs: ["69:9", "69:10"]
        with_refs: ["Gen 19:25"]
        relation: parallel
        note: "wa-l-muʾtafikātu bi-l-khāṭiʾa ... fa-ʿaṣaw rasūla rabbihim fa-akhadhahum ~ wa-yyahăfōk ʾet he-ʿārîm hā-ʾēl: the cities named only as 'the overturned ones'. The Quran gives the reason as disobeying 'the messenger of their Lord'; Genesis gives no messenger to Sodom except the visiting angels."
      - with: hb-gen-6-flood
