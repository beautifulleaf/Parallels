  - unit: quran-68-qalam-companions-of-the-garden
    checked: [hb-deut-24-divorce-pledges-poor, hb-prov-27-sayings, hb-jonah-4-qiqayon, hb-joel-1-locust-plague, hb-job-24-oppression-of-poor, hb-gen-3-fall-expulsion, hb-lev-19-holiness-code-a]
