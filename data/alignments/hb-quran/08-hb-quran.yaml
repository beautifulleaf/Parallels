        motif: resurrection-of-the-dead
        refs: ["75:3", "75:40"]
        with_refs: ["Isa 26:19"]
        relation: echo
        note: "a-laysa dhālika bi-qādirin ʿalā an yuḥyiya l-mawtā ~ yiḥyû mētêkā nevēlātî yeqûmûn."
      - with: hb-ps-139-searched-and-known
