        refs: ["69:30", "69:32"]
        with_refs: ["Ps 149:8"]
        relation: echo
        note: "khudhūhu fa-ghullūhu ... fī silsilatin dharʿuhā sabʿūna dhirāʿan fa-slukūh ~ leʾsōr malkêhem be-ziqqîm we-nikbedêhem be-kavlê varzel. In the Psalm the faithful bind the kings on earth; in the Quran angels fetter the damned man in hell, whose lost sulṭān (69:29) recalls the kings."
      - with: hb-ezek-21-sword-oracles
        motif: word-of-noble-messenger-not-poet-or-soothsayer
        refs: ["69:41", "69:42"]
        with_refs: ["Ezek 21:5"]
