  - unit: quran-77-sent-forth
    checked: [hb-ps-136-great-hallel, hb-isa-5-vineyard-and-woes, hb-zech-6-four-chariots, hb-ps-104-creation-hymn, hb-isa-13-oracle-against-babylon, hb-job-38-whirlwind-creation]
