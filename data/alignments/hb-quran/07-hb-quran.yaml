        refs: ["55:66", "55:68"]
        with_refs: ["Deut 8:7", "Deut 8:8"]
        relation: divergence
        note: "Springs and fruit of a land promised. Deuteronomy: ʾereṣ ṭôḇâ ʾereṣ naḥălê māyim ʿăyānōṯ û-ṯəhōmōṯ ... ʾereṣ ḥiṭṭâ û-śəʿōrâ wə-ḡep̄en û-ṯəʾēnâ wə-rimmôn ʾereṣ zêṯ šemen û-ḏəḇāš (the good land of Canaan). Quran: fīhimā ʿaynāni naḍḍākhatān ... fīhimā fākihatun wa-nakhlun wa-rummān (the two lower gardens). Springs (ʿăyānōṯ / ʿaynān) and pomegranates (rimmôn / rummān) carry over from the earthly land to the Garden; grain and oil drop out, and the palm, which Deut 8 lacks, is added."
      - with: hb-gen-6-sons-of-god
