  - unit: quran-55-rahman-creation-and-the-two-seas
    checked: [hb-ps-136-great-hallel, hb-ps-104-creation-hymn, hb-ps-98-rivers-clap, hb-ps-96-new-song, hb-ps-89-ethan-davidic-covenant, hb-isa-44-idol-from-half-a-log, hb-ps-102-afflicted, hb-lev-19-holiness-code-b, hb-prov-11-sayings, hb-isa-63-communal-lament, hb-gen-2-eden-adam-woman, hb-gen-1-creation-six-days]
    matches:
      - with: hb-ps-136-great-hallel
        motif: refrain-which-bounties-of-your-lord-will-you-deny
        refs: ["55:5", "55:13", "55:16", "55:18"]
        with_refs: ["Ps 136:1", "Ps 136:5", "Ps 136:7", "Ps 136:8", "Ps 136:9"]
        relation: divergence
        note: "A creation litany with a refrain after every line. Ps 136: lə-ʿōśēh hā-ʾôrîm gəḏōlîm ... ʾeṯ haš-šemeš lə-memšeleṯ bay-yôm ... kî lə-ʿôlām ḥasdô (26 times). Q 55: ash-shamsu wa-l-qamaru bi-ḥusbān ... fa-bi-ayyi ālāʾi rabbikumā tukadhdhibān (31 times). Same form and the same first works (heavens, earth, sun, moon). Changed refrain: the psalm affirms (his love endures for ever) and calls Israel to give thanks (hôḏû); the Quran asks a challenge in the dual to jinn and humans: which of your Lord's bounties will you deny? The psalm goes on to Egypt and Israel's history; the Quran to heaven and hell."
      - with: hb-ps-104-creation-hymn
        motif: sun-and-moon-by-reckoning
        refs: ["55:5", "55:24"]
        with_refs: ["Ps 104:19", "Ps 104:26"]
