        note: "Supernatural beings with human women: wa-yyirʾû ḇənê hā-ʾĕlōhîm ʾeṯ bənôṯ hā-ʾāḏām ... wa-yyiqḥû lāhem nāšîm vs. lam yaṭmithhunna insun qablahum wa-lā jānn (untouched by man or jinn before them). The Quran's phrase assumes jinn could touch women, as Gen 6 has the sons of God take wives; the beings differ (bənê hā-ʾĕlōhîm, jinn). Lead from the hint only."
      - with: hb-ps-68-rider-of-clouds
