        note: "Lot's warning disbelieved: qûmû ṣəʾû min ham-māqôm haz-zeh kî mašḥîṯ YHWH ʾeṯ hā-ʿîr wa-yhî ḵi-mṣaḥēq bə-ʿênê ḥăṯānâw vs. wa-la-qad andharahum baṭshatanā fa-tamāraw bi-n-nudhur. Genesis: only his sons-in-law, who take it as a joke; Quran: the whole people, who dispute the warnings."
      - with: hb-judg-19-levites-concubine
        motif: mob-demands-guest
        refs: ["54:37"]
        with_refs: ["Judg 19:22"]
