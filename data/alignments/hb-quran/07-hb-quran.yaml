      - with: hb-ps-104-creation-hymn
        motif: human-from-potters-clay-jinn-from-smokeless-fire
        refs: ["55:15"]
        with_refs: ["Ps 104:4"]
        relation: echo
        note: "Created beings of fire: məšārəṯâw ʾēš lōhēṭ (his ministers a flaming fire) vs. wa-khalaqa l-jānna min mārijin min nār (the jinn from a smokeless flame). The psalm's fiery servants are angels or forces of nature; the Quran's are the jinn, who are not angels. Lead only."
      - with: hb-ps-104-creation-hymn
        motif: god-every-day-in-some-work
        refs: ["55:29"]
        with_refs: ["Ps 104:27"]
        relation: echo
        note: "All creatures turn to God for their needs: kullām ʾēleyḵā yəśabbērûn lāṯēṯ ʾoḵlām bə-ʿittô vs. yasʾaluhu man fī s-samāwāti wa-l-arḍi kulla yawmin huwa fī shaʾn."
      - with: hb-ps-102-afflicted
        motif: heavens-wear-out-like-garment
        refs: ["55:26", "55:27"]
        with_refs: ["Ps 102:26", "Ps 102:27", "Ps 102:28"]
