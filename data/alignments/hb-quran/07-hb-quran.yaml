        note: "Creation passes away, God remains: hēmmâ yōʾḇēḏû wə-ʾattâ ṯaʿămōḏ wə-ḵullām kab-beḡeḏ yiḇlû ... wə-ʾattâ hûʾ û-šənôṯêḵā lōʾ yittāmmû vs. kullu man ʿalayhā fānin wa-yabqā wajhu rabbika dhū l-jalāli wa-l-ikrām. The psalm's heavens and earth perish; the Quran's 'all on it' (on the earth) perish. What remains is 'you' (ʾattâ hûʾ) and 'the face of your Lord'."
      - with: hb-ps-96-new-song
        motif: stars-and-trees-prostrate
        refs: ["55:6"]
        with_refs: ["Ps 96:12"]
