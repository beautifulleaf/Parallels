      - with: hb-ps-11-flee-like-bird
        motif: fire-and-brimstone-from-heaven
        refs: ["54:34"]
        with_refs: ["Ps 11:6"]
        relation: echo
        note: "yamṭēr ʿal rəšāʿîm paḥîm ʾēš wə-ḡop̄rîṯ vs. arsalnā ʿalayhim ḥāṣiban: Sodom's punishment raining on the wicked; the psalm keeps fire and sulfur, the Quran has stones."
      - with: hb-eccl-12-epilogue
        motif: every-deed-small-and-great-recorded
        refs: ["54:52", "54:53"]
        with_refs: ["Eccl 12:14"]
        relation: parallel
        note: "Every deed, even hidden or small, comes to judgment: kî ʾeṯ kol maʿăśeh hā-ʾĕlōhîm yāḇîʾ ḇə-mišpāṭ ʿal kol neʿlām ʾim ṭôḇ wə-ʾim rāʿ vs. wa-kullu shayʾin faʿalūhu fī z-zubur, wa-kullu ṣaghīrin wa-kabīrin mustaṭar. Qohelet's epilogue says God judges; the Quran says it is written down (mustaṭar)."
      - with: hb-job-28-hymn-to-wisdom
        motif: everything-created-by-measure
        refs: ["54:49"]
        with_refs: ["Job 28:25"]
        relation: echo
        note: "laʿăśôṯ lā-rûaḥ mišqāl û-mayim tikkēn ḇə-middâ vs. innā kulla shayʾin khalaqnāhu bi-qadar. Job: wind and water given weight and measure at creation; Quran: everything, with qadar meaning both measure and decree."
      - with: hb-num-16-korah
        motif: shall-we-follow-a-single-human
        refs: ["54:24", "54:25"]
        with_refs: ["Num 16:3"]
        relation: echo
        note: "Rejecting one man's claim to speak for God: rab lāḵem kî ḵol hā-ʿēḏâ kullām qəḏōšîm ... û-maddûaʿ tiṯnaśśəʾû ʿal qəhal YHWH vs. a-basharan minnā wāḥidan nattabiʿuhu ... a-ulqiya dh-dhikru ʿalayhi min bayninā. Korah argues that all are holy; Thamud that a mere human from among them cannot have been singled out."
      - with: hb-gen-29-jacob-rachel-leah
        motif: she-camel-of-god
        refs: ["54:28"]
        with_refs: ["Gen 29:3", "Gen 29:8"]
        relation: echo
