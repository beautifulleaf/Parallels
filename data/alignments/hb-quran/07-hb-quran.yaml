        relation: parallel
        note: "Closing doxology on the Name: û-ḇārûḵ šēm kəḇôḏô lə-ʿôlām wə-yimmālēʾ ḵəḇôḏô ʾeṯ kōl hā-ʾāreṣ ʾāmēn wə-ʾāmēn vs. tabāraka smu rabbika dhī l-jalāli wa-l-ikrām. Both end a large unit (Book II of Psalms, the sura) with 'blessed be the name' (bārûḵ šēm / tabāraka sm, the root b-r-k in both); kəḇôḏ ~ jalāl."
  - unit: quran-56-waqia-three-classes-and-the-garden
    checked: [hb-dan-12-resurrection-end, hb-ezek-47-temple-river, hb-ps-75-cup, hb-ps-16-my-portion, hb-ps-107-four-rescues, hb-deut-28-blessings-curses, hb-1sam-2-song-of-hannah, hb-gen-2-eden-adam-woman, hb-num-11-taberah-quail, hb-prov-23-drunkard]
    matches:
      - with: hb-ps-75-cup
        motif: god-humbles-one-exalts-another
        refs: ["56:1", "56:2", "56:3"]
        with_refs: ["Ps 75:8"]
        relation: parallel
        note: "kî ʾĕlōhîm šōp̄ēṭ zeh yašpîl wə-zeh yārîm vs. idhā waqaʿati l-wāqiʿatu ... khāfiḍatun rāfiʿa. The psalm's judge brings low and lifts up (š-p-l / r-w-m); the Quran gives the same pair to the Event itself (kh-f-ḍ / r-f-ʿ)."
      - with: hb-1sam-2-song-of-hannah
        motif: song-reversal-of-fortunes
        refs: ["56:3"]
        with_refs: ["1Sam 2:7"]
        relation: echo
        note: "YHWH ... mašpîl ʾap̄ mərômēm vs. khāfiḍatun rāfiʿa: lowering and raising. Hannah praises reversals in this life; the Quran puts them at the end."
      - with: hb-ps-75-cup
        motif: earth-shaken-mountains-crumbled-to-dust
        refs: ["56:4", "56:5", "56:6"]
        with_refs: ["Ps 75:4"]
        relation: echo
        note: "nəmōḡîm ʾereṣ wə-ḵol yōšəḇêhā ʾānōḵî tikkantî ʿammûdêhā vs. idhā rujjati l-arḍu rajjan wa-bussati l-jibālu bassan. The psalm's melting earth is held up by God's pillars; the Quran's shaken earth and crushed mountains do not hold."
      - with: hb-dan-12-resurrection-end
        motif: three-classes-at-judgment
        refs: ["56:7", "56:8", "56:9", "56:10", "56:11"]
        with_refs: ["Dan 12:2", "Dan 12:3"]
        relation: divergence
        note: "Sorting at the resurrection. Daniel: wə-rabbîm mîšēnê ʾaḏmaṯ ʿāp̄ār yāqîṣû ʾēlleh lə-ḥayyê ʿôlām wə-ʾēlleh la-ḥărāp̄ôṯ ... wə-ham-maśkîlîm yazhirû kə-zōhar hā-rāqîaʿ (two groups, life and shame, with the wise shining as a higher class). Quran: wa-kuntum azwājan thalātha: aṣḥābu l-maymana, aṣḥābu l-mashʾama, wa-s-sābiqūna s-sābiqūn ulāʾika l-muqarrabūn (three classes: right, left, and the foremost brought near). The maśkîlîm and the sābiqūn are both an elite above the saved. cf. b. Rosh Hashanah 16b, three groups at judgment."
      - with: hb-ezek-47-temple-river
        motif: fruit-neither-cut-off-nor-forbidden
        refs: ["56:32", "56:33"]
        with_refs: ["Ezek 47:12"]
        relation: parallel
        note: "Fruit that never fails: kol ʿēṣ maʾăḵāl lōʾ yibbôl ʿālēhû wə-lōʾ yittōm piryô lə-ḥŏḏāšâw yəḇakkēr vs. wa-fākihatin kathīratin lā maqṭūʿatin wa-lā mamnūʿa. Ezekiel's trees grow by the temple river and their leaves heal; the Quran adds that the fruit is not forbidden."
      - with: hb-gen-2-eden-adam-woman
        motif: tree-of-knowledge-forbidden
        refs: ["56:33"]
        with_refs: ["Gen 2:17"]
        relation: contrast
        note: "Eden's prohibition vs. the Garden's freedom: û-mē-ʿēṣ had-daʿaṯ ṭôḇ wā-rāʿ lōʾ ṯōʾḵal mimmennû vs. lā maqṭūʿatin wa-lā mamnūʿa (fruit neither cut off nor forbidden). In the Garden of the end no fruit is forbidden. Lead: the Quran does not mention Eden here."
      - with: hb-num-11-taberah-quail
        motif: quail-miracle
        refs: ["56:21"]
        with_refs: ["Num 11:31", "Num 11:33", "Num 11:34"]
        relation: contrast
        note: "Bird-meat as desired, with opposite outcomes. Numbers: wə-rûaḥ nāsaʿ mē-ʾēṯ YHWH wa-yyāḡoz śalwîm min hay-yām; hab-bāśār ʿôḏennû bên šinnêhem ... wa-yyaḵ YHWH bā-ʿām, and the place is named qiḇrôṯ hat-taʾăwâ (graves of craving). Quran: wa-laḥmi ṭayrin mimmā yashtahūn (bird flesh, whatever they desire). In the wilderness the desire (taʾăwâ) for bird-meat is punished; in the Garden it is granted."
      - with: hb-ps-16-my-portion
        motif: path-of-life-pleasures-at-right-hand
        refs: ["56:8", "56:27"]
        with_refs: ["Ps 16:11"]
        relation: echo
        note: "Joy at the right hand: tôḏîʿēnî ʾōraḥ ḥayyîm śōḇaʿ śəmāḥôṯ ʾeṯ pāneyḵā nəʿimôṯ bî-mînəḵā neṣaḥ vs. fa-aṣḥābu l-maymana mā aṣḥābu l-maymana; wa-aṣḥābu l-yamīni mā aṣḥābu l-yamīn. The psalm's delights are at God's right hand; in the Quran the blessed are the people of the right (yamīn / yāmîn)."
      - with: hb-prov-23-drunkard
        motif: paradise-wine-no-headache-no-intoxication
        refs: ["56:18", "56:19"]
        with_refs: ["Prov 23:29", "Prov 23:30", "Prov 23:35"]
        relation: contrast
        note: "The effects of wine. Proverbs: ləmî ʾôy ... ləmî p̄əṣāʿîm ḥinnām ləmî ḥaḵlilûṯ ʿênāyim; la-məʾaḥărîm ʿal hay-yāyin; hikkûnî bal ḥālîtî ... māṯay ʾāqîṣ (woe, wounds, red eyes, stupor). Quran: bi-akwābin wa-abārīqa wa-kaʾsin min maʿīn, lā yuṣaddaʿūna ʿanhā wa-lā yunzifūn (no headache, no loss of wits). The Quran's paradise wine is described by the absence of the drunkard's woes."
  - unit: quran-56-waqia-left-hand-and-proofs
    checked: [hb-exod-15-marah-elim, hb-2kgs-6-floating-axe, hb-2kgs-2-elisha-first-miracles, hb-isa-26-song-and-resurrection, hb-isa-44-idol-from-half-a-log, hb-ps-139-searched-and-known, hb-job-10-why-did-you-make-me, hb-deut-28-blessings-curses, hb-eccl-8-king-and-retribution]
    matches:
      - with: hb-exod-15-marah-elim
        motif: bitter-water-sweetened-by-wood
        refs: ["56:68", "56:69", "56:70"]
        with_refs: ["Exod 15:23", "Exod 15:25"]
        relation: contrast
        note: "God's power over the taste of water, in the opposite direction. Exodus: lōʾ yāḵəlû lištōṯ mayim mim-mārâ kî mārîm hēm ... wa-yyôrēhû YHWH ʿēṣ ... wa-yyimtəqû ham-māyim (bitter water made sweet). Quran: a-fa-raʾaytumu l-māʾa lladhī tashrabūn ... law nashāʾu jaʿalnāhu ujājan fa-lawlā tashkurūn (we could make your sweet water bitter). The miracle of sweetening becomes a threat of embittering, used as a call to gratitude."
      - with: hb-2kgs-2-elisha-first-miracles
        motif: rain-from-clouds-could-be-made-salt
        refs: ["56:70"]
        with_refs: ["2Kgs 2:21", "2Kgs 2:22"]
        relation: contrast
        note: "wa-yyašleḵ šām melaḥ wa-yyōʾmer kōh ʾāmar YHWH rippēʾṯî lam-mayim hā-ʾēlleh ... wa-yyērāp̄û ham-mayim vs. law nashāʾu jaʿalnāhu ujājan: Elisha heals bad water (with salt); the Quran's God could make good water salt-bitter (ujāj)."
      - with: hb-job-10-why-did-you-make-me
        motif: do-you-create-your-semen
        refs: ["56:58", "56:59"]
        with_refs: ["Job 10:10", "Job 10:11"]
        relation: parallel
        note: "God forms the fetus from emitted fluid: hă-lōʾ ḵe-ḥālāḇ tattîḵēnî wə-ḵag-gəḇinnâ taqpîʾēnî ʿôr û-ḇāśār talbîšēnî vs. a-fa-raʾaytum mā tumnūn a-antum takhluqūnahu am naḥnu l-khāliqūn. Job addresses God as maker in a complaint (why destroy what you made?); the Quran asks men who the creator is, as proof of the resurrection."
      - with: hb-ps-139-searched-and-known
        motif: do-you-create-your-semen
        refs: ["56:59"]
        with_refs: ["Ps 139:13"]
        relation: echo
        note: "kî ʾattâ qānîṯā ḵilyōṯāy tə-sukkēnî bə-ḇeṭen ʾimmî vs. am naḥnu l-khāliqūn: God, not man, forms the child."
      - with: hb-deut-28-blessings-curses
        motif: do-you-sow-or-do-we
        refs: ["56:63", "56:64", "56:65"]
        with_refs: ["Deut 28:38", "Deut 28:39"]
        relation: echo
        note: "Sowing without reaping as God's doing: zeraʿ raḇ tôṣîʾ haś-śāḏeh û-məʿaṭ teʾĕsōp̄ kî yaḥsəlennû hā-ʾarbeh vs. a-fa-raʾaytum mā taḥruthūn, a-antum tazraʿūnahu am naḥnu z-zāriʿūn, law nashāʾu la-jaʿalnāhu ḥuṭāman. Deuteronomy threatens it as a covenant curse; the Quran asks it as a proof that God gives the growth."
      - with: hb-isa-44-idol-from-half-a-log
        motif: fire-from-green-tree
        refs: ["56:71", "56:72", "56:73"]
        with_refs: ["Isa 44:14", "Isa 44:15", "Isa 44:16"]
        relation: divergence
        note: "Fire kindled from a tree God made grow. Isaiah: nāṭaʿ ʾōren wə-ḡešem yəḡaddēl; wə-hāyâ lə-ʾāḏām lə-ḇāʿēr ... ḥeṣyô śārap̄ bəmô ʾēš ... rāʾîṯî ʾûr, and from the other half he makes a god and bows to it (wa-yyisgōḏ lāmô). Quran: a-fa-raʾaytumu n-nāra llatī tūrūn a-antum anshaʾtum shajaratahā am naḥnu l-munshiʾūn, naḥnu jaʿalnāhā tadhkiratan. The same tree and fire; Isaiah mocks the man who also worships the wood, the Quran makes the fire a reminder of the Creator."
      - with: hb-eccl-8-king-and-retribution
        motif: soul-at-the-throat-cannot-be-returned
        refs: ["56:83", "56:86", "56:87"]
        with_refs: ["Eccl 8:8"]
        relation: parallel
        note: "No man can hold back the departing spirit: ʾên ʾāḏām šallîṭ bā-rûaḥ li-ḵlôʾ ʾeṯ hā-rûaḥ wə-ʾên šilṭôn bə-yôm ham-māweṯ vs. fa-lawlā idhā balaghati l-ḥulqūm ... fa-lawlā in kuntum ghayra madīnīna tarjiʿūnahā in kuntum ṣādiqīn. Qohelet states it as a limit of human power; the Quran turns it into a challenge: if you are not to be judged, bring the soul back."
  - unit: quran-57-hadid-first-and-last-and-the-loan
    checked: [hb-prov-19-sayings, hb-jer-16-fishers-and-hunters, hb-isa-48-refined-in-affliction, hb-ps-104-creation-hymn, hb-isa-45-cyrus-the-anointed, hb-ps-89-ethan-davidic-covenant, hb-isa-44-idol-from-half-a-log, hb-gen-1-creation-six-days, hb-ps-139-searched-and-known, hb-ps-107-four-rescues, hb-lev-25-sabbatical-and-jubilee]
    matches:
      - with: hb-prov-19-sayings
        motif: lending-to-yhwh-by-giving-to-poor
        refs: ["57:11"]
        with_refs: ["Prov 19:17"]
        relation: divergence
        note: "Giving as a loan to God, repaid by him. Proverbs: malwēh YHWH ḥônēn dāl û-ḡəmulô yəšallem lô (he who is kind to the poor lends to YHWH, who repays him). Quran: man dhā lladhī yuqriḍu llāha qarḍan ḥasanan fa-yuḍāʿifahu lahu wa-lahu ajrun karīm. Proverbs' loan is kindness to the poor; the Quran's is spending in God's way (57:10, including before the Victory), and repayment becomes multiplication (yuḍāʿifahu)."
      - with: hb-isa-48-refined-in-affliction
        motif: first-and-last
        refs: ["57:3"]
        with_refs: ["Isa 48:12"]
        relation: parallel
        note: "ʾănî hûʾ ʾănî rīšôn ʾap̄ ʾănî ʾaḥărôn vs. huwa l-awwalu wa-l-ākhiru wa-ẓ-ẓāhiru wa-l-bāṭinu. Isaiah's first-person self-declaration becomes a third-person creed, and the Quran adds a second pair, Outward and Inward."
      - with: hb-isa-44-idol-from-half-a-log
        motif: first-and-last
        refs: ["57:3"]
        with_refs: ["Isa 44:6"]
        relation: parallel
        note: "ʾănî rīšôn wa-ʾănî ʾaḥărôn û-mib-baləʿāḏay ʾên ʾĕlōhîm vs. huwa l-awwalu wa-l-ākhir. Isaiah draws the monotheist conclusion in the same verse; the Quran draws omniscience: wa-huwa bi-kulli shayʾin ʿalīm."
      - with: hb-gen-1-creation-six-days
        motif: creation-in-six-days
        refs: ["57:4"]
        with_refs: ["Gen 2:2"]
        relation: divergence
        note: "What God does after the six days. Genesis: wa-yišbōṯ bay-yôm haš-šəḇîʿî mik-kol məlaʾḵtô (he rested). Quran: khalaqa s-samāwāti wa-l-arḍa fī sittati ayyāmin thumma stawā ʿalā l-ʿarsh (then he established himself on the Throne). Rest becomes enthronement, and the seventh day goes unmentioned."
      - with: hb-ps-139-searched-and-known
        motif: god-with-you-wherever-you-are
        refs: ["57:4"]
        with_refs: ["Ps 139:8", "Ps 139:9", "Ps 139:10"]
        relation: parallel
        note: "God present above and below: ʾim ʾessaq šāmayim šām ʾāttâ wə-ʾaṣṣîʿâ šəʾôl hinnekkā ... gam šām yāḏəḵā ṯanḥēnî vs. yaʿlamu mā yaliju fī l-arḍi wa-mā yakhruju minhā wa-mā yanzilu mina s-samāʾi wa-mā yaʿruju fīhā wa-huwa maʿakum ayna mā kuntum. The psalmist goes up and down and finds God there; in the Quran things go up and down and God knows them and is 'with you'."
      - with: hb-ps-107-four-rescues
        motif: from-darkness-to-light
        refs: ["57:9"]
        with_refs: ["Ps 107:14"]
        relation: echo
        note: "Same verb of bringing out of darkness: yôṣîʾēm mē-ḥōšeḵ wə-ṣalmāweṯ û-môsərôṯêhem yənattēq vs. li-yukhrijakum mina ẓ-ẓulumāti ilā n-nūr (y-ṣ-ʾ hiphil ~ ʾakhraja). The psalm's darkness is a prison; the Quran's is unbelief, and the means are the revealed signs."
      - with: hb-lev-25-sabbatical-and-jubilee
        motif: humans-as-stewards-of-wealth
        refs: ["57:7", "57:10"]
        with_refs: ["Lev 25:23"]
        relation: echo
        note: "Humans hold God's property as tenants: kî lî hā-ʾāreṣ kî ḡērîm wə-ṯôšāḇîm ʾattem ʿimmāḏî vs. wa-anfiqū mimmā jaʿalakum mustakhlafīna fīhi ... wa-li-llāhi mīrāthu s-samāwāti wa-l-arḍ. Leviticus draws a land law from it (no permanent sale); the Quran a duty to spend."
      - with: hb-ps-89-ethan-davidic-covenant
        motif: all-in-heavens-and-earth-glorify-god
        refs: ["57:1", "57:2"]
        with_refs: ["Ps 89:12"]
        relation: echo
        note: "ləḵā šāmayim ʾap̄ ləḵā ʾāreṣ tēḇēl û-məlōʾāh ʾattâ yəsaḏtām vs. sabbaḥa li-llāhi mā fī s-samāwāti wa-l-arḍ ... lahu mulku s-samāwāti wa-l-arḍ: heaven and earth belong to God."
  - unit: quran-57-hadid-light-and-the-wall
    checked: [hb-num-35-levitical-cities-refuge, hb-ezek-36-new-heart-new-spirit, hb-ezek-11-cauldron-new-heart, hb-jer-31-consolation-new-covenant, hb-deut-30-return-choose-life, hb-mal-3-book-of-remembrance, hb-exod-13-firstborn-tefillin-pillar]
    matches:
      - with: hb-ezek-36-new-heart-new-spirit
        motif: heart-of-stone-to-heart-of-flesh
        refs: ["57:16"]
        with_refs: ["Ezek 36:26"]
        relation: divergence
        note: "The hardened heart, cured by God or warned against. Ezekiel: wə-nāṯattî lāḵem lēḇ ḥāḏāš ... wa-hăsirōṯî ʾeṯ lēḇ hā-ʾeḇen mib-bəśarḵem wə-nāṯattî lāḵem lēḇ bāśār (God removes the heart of stone from Israel). Quran: a-lam yaʾni li-lladhīna āmanū an takhshaʿa qulūbuhum ... wa-lā yakūnū ka-lladhīna ūtū l-kitāba min qablu fa-ṭāla ʿalayhimu l-amadu fa-qasat qulūbuhum. In Ezekiel God gives the new heart; in the Quran believers are warned not to let their hearts harden like those of the earlier People of the Book."
      - with: hb-ezek-11-cauldron-new-heart
        motif: heart-of-stone-to-heart-of-flesh
        refs: ["57:16"]
        with_refs: ["Ezek 11:19"]
        relation: echo
        note: "wa-hăsirōṯî lēḇ hā-ʾeḇen mib-bəśārām wə-nāṯattî lāhem lēḇ bāśār vs. fa-qasat qulūbuhum (q-s-w, hardness): a hard heart, removed by God in Ezekiel, a danger for believers in the Quran."
      - with: hb-deut-30-return-choose-life
        motif: heart-of-stone-to-heart-of-flesh
        refs: ["57:16", "57:17"]
        with_refs: ["Deut 30:6"]
        relation: echo
        note: "û-māl YHWH ʾĕlōhêḵā ʾeṯ ləḇāḇəḵā ... lə-ʾahăḇâ ʾeṯ YHWH vs. a-lam yaʾni li-lladhīna āmanū an takhshaʿa qulūbuhum li-dhikri llāh ... iʿlamū anna llāha yuḥyī l-arḍa baʿda mawtihā. The circumcised and the humbled heart; Deuteronomy has God do it after the return, the Quran asks believers to do it now, as dead earth revives."
      - with: hb-jer-31-consolation-new-covenant
        motif: law-written-on-heart
        refs: ["57:16"]
        with_refs: ["Jer 31:33"]
        relation: contrast
        note: "Jeremiah promises the house of Israel a Torah written on the heart (nāṯattî ʾeṯ tôrāṯî bə-qirbām wə-ʿal libbām ʾeḵtăḇennâ); the Quran describes 'those given the Book before' whose hearts grew hard over a long time (fa-ṭāla ʿalayhimu l-amadu fa-qasat qulūbuhum wa-kathīrun minhum fāsiqūn). Lead only: no explicit reference."
      - with: hb-num-35-levitical-cities-refuge
        motif: no-ransom-for-murderer
        refs: ["57:15"]
        with_refs: ["Num 35:31", "Num 35:32"]
        relation: echo
        note: "No ransom accepted: wə-lōʾ ṯiqḥû ḵōp̄er lə-nep̄eš rōṣēaḥ ʾăšer hûʾ rāšāʿ lā-mûṯ vs. fa-l-yawma lā yuʾkhadhu minkum fidyatun wa-lā mina lladhīna kafarū. A rule of human justice for the murderer becomes God's verdict on hypocrites and unbelievers at the judgment (kōp̄er ~ fidya)."
      - with: hb-exod-13-firstborn-tefillin-pillar
        motif: believers-light-runs-before-them
        refs: ["57:12", "57:13"]
        with_refs: ["Exod 13:21"]
        relation: echo
        note: "Light going before the faithful on their way: wa-YHWH hōlēḵ lip̄nêhem ... wə-laylâ bə-ʿammûḏ ʾēš lə-hāʾîr lāhem lāleḵeṯ vs. yawma tarā l-muʾminīna wa-l-muʾmināti yasʿā nūruhum bayna aydīhim wa-bi-aymānihim. Israel's pillar of fire leads a whole people through the desert; the Quran's light is each believer's own, on the Day, and cannot be borrowed by the hypocrites (unẓurūnā naqtabis min nūrikum). cf. Matt 25:8-12."
  - unit: quran-57-hadid-iron-and-monasticism
    checked: [hb-gen-4-cainites-lamech, hb-isa-40-comfort-my-people, hb-isa-43-you-are-my-witnesses, hb-isa-63-communal-lament, hb-jer-31-consolation-new-covenant, hb-ps-139-searched-and-known, hb-job-1-prologue-first-test, hb-eccl-5-words-and-vows]
    matches:
      - with: hb-isa-40-comfort-my-people
        motif: all-flesh-is-grass
        refs: ["57:20"]
        with_refs: ["Isa 40:6", "Isa 40:7", "Isa 40:8"]
        relation: divergence
        note: "Life as withering plants, with a different counterweight. Isaiah: kol hab-bāśār ḥāṣîr wə-ḵol ḥasdô kə-ṣîṣ haś-śāḏeh; yāḇēš ḥāṣîr nāḇēl ṣîṣ û-ḏəḇar ʾĕlōhênû yāqûm lə-ʿôlām (against the grass stands God's word). Quran: ka-mathali ghaythin aʿjaba l-kuffāra nabātuhu thumma yahīju fa-tarāhu muṣfarran thumma yakūnu ḥuṭāman, wa-fī l-ākhirati ʿadhābun shadīdun wa-maghfiratun mina llāh (against the withering stands the hereafter, punishment or forgiveness). The Quran adds the farmer's pleasure in the growth and the list of what is passing: play, adornment, boasting, rivalry in wealth and children."
      - with: hb-isa-40-comfort-my-people
        motif: double-portion-of-mercy-for-believers
        refs: ["57:28"]
        with_refs: ["Isa 40:2"]
        relation: divergence
        note: "Cognate 'double' (k-p-l): kî lāqəḥâ miy-yaḏ YHWH kip̄layim bə-ḵol ḥaṭṭōʾṯêhā (Jerusalem received double for all her sins) vs. yuʾtikum kiflayni min raḥmatihi wa-yajʿal lakum nūran tamshūna bihi (he will give you a double portion of his mercy). The double portion of punishment, now complete, becomes a double portion of mercy for believers in the Prophet."
      - with: hb-gen-4-cainites-lamech
        motif: iron-sent-down
        refs: ["57:25"]
        with_refs: ["Gen 4:22"]
        relation: divergence
        note: "Where iron comes from. Genesis: tûḇal qayin lōṭēš kol ḥōrēš nəḥōšeṯ û-ḇarzel (iron-working begins with a descendant of Cain, a human culture hero). Quran: wa-anzalnā l-ḥadīda fīhi baʾsun shadīdun wa-manāfiʿu li-n-nās (God sent iron down, with great might and benefits). A human craft from Cain's line becomes God's gift sent down beside the Book and the Balance. cf. 1 Enoch 8:1 (Asael teaches metalworking)."
      - with: hb-ps-139-searched-and-known
        motif: every-calamity-written-before-creation
        refs: ["57:22"]
        with_refs: ["Ps 139:16"]
        relation: parallel
        note: "Events written in God's book before they happen: wə-ʿal sip̄rəḵā kullām yikkāṯēḇû yāmîm yuṣṣārû wə-lōʾ ʾeḥāḏ bāhem vs. mā aṣāba min muṣībatin fī l-arḍi wa-lā fī anfusikum illā fī kitābin min qabli an nabraʾahā. The psalm's days written before they existed are a comfort; the Quran draws the lesson not to grieve or exult (57:23)."
      - with: hb-job-1-prologue-first-test
        motif: do-not-grieve-loss-nor-exult-gain
        refs: ["57:22", "57:23"]
        with_refs: ["Job 1:21"]
        relation: echo
        note: "Equanimity before gain and loss, both from God: YHWH nāṯan wa-YHWH lāqāḥ yəhî šēm YHWH məḇōrāḵ vs. li-kay-lā taʾsaw ʿalā mā fātakum wa-lā tafraḥū bi-mā ātākum. Job blesses in the moment of loss; the Quran gives the reason: all was written beforehand."
      - with: hb-eccl-5-words-and-vows
        motif: monasticism-invented-not-prescribed
        refs: ["57:27"]
        with_refs: ["Eccl 5:3", "Eccl 5:4"]
        relation: echo
        note: "A self-imposed vow badly kept: kaʾăšer tiddōr neḏer lē-ʾlōhîm ʾal təʾaḥēr lə-šallmô ... ṭôḇ ʾăšer lōʾ ṯiddōr miš-šet-tiddôr wə-lōʾ ṯəšallēm vs. wa-rahbāniyyatan ibtadaʿūhā mā katabnāhā ʿalayhim illā btighāʾa riḍwāni llāhi fa-mā raʿawhā ḥaqqa riʿāyatihā. Qohelet: better not to vow than to vow and not pay; the Quran: monasticism was not prescribed, and those who took it on did not keep it."
  - unit: quran-58-mujadila-zihar-and-secret-counsel
    checked: [hb-lev-5-graduated-and-guilt-offerings, hb-exod-32-tablets-broken-levites, hb-ps-87-zion-birthplace, hb-ps-69-deep-waters, hb-deut-18-levites-prophet, hb-jer-33-branch-and-cosmic-covenant, hb-num-27-zelophehad-joshua, hb-lev-18-forbidden-unions, hb-deut-33-blessing-of-moses, hb-mal-3-book-of-remembrance, hb-jer-31-consolation-new-covenant]
    matches:
      - with: hb-num-27-zelophehad-joshua
        motif: daughters-inherit
        refs: ["58:1"]
        with_refs: ["Num 27:1", "Num 27:4", "Num 27:5", "Num 27:7"]
        relation: echo
        note: "A woman's complaint brought before the prophet becomes divine law: wat-tiqraḇnâ bənôṯ ṣəlop̄ḥāḏ ... lāmmâ yiggāraʿ šēm ʾāḇînû ... wa-yyaqrēḇ mōšeh ʾeṯ mišpāṭān lip̄nê YHWH ... kēn bənôṯ ṣəlop̄ḥāḏ dōḇərōṯ vs. qad samiʿa llāhu qawla llatī tujādiluka fī zawjihā wa-tashtakī ilā llāh. In Numbers Moses takes the case to God and God approves the daughters; in the Quran the woman herself complains to God, God has heard, and the ruling on ẓihār follows. Inheritance there, marriage here."
      - with: hb-lev-18-forbidden-unions
        motif: zihar-repudiation-wife-as-mothers-back
        refs: ["58:2"]
        with_refs: ["Lev 18:7"]
        relation: echo
        note: "The mother as the forbidden woman: ʿerwaṯ ʾimməḵā lōʾ ṯəḡalleh ʾimməḵā hîʾ (your mother, do not uncover her nakedness) vs. alladhīna yuẓāhirūna minkum min nisāʾihim mā hunna ummahātihim in ummahātuhum illā llāʾī waladnahum. The ẓihār formula ('you are to me like my mother's back') uses the incest taboo to repudiate a wife; the Quran voids it: she is not his mother, the words are munkar and false (zūr)."
      - with: hb-lev-5-graduated-and-guilt-offerings
        motif: offering-scaled-to-means
        refs: ["58:3", "58:4"]
        with_refs: ["Lev 5:7", "Lev 5:11"]
        relation: divergence
        note: "Expiation in steps by what one can afford. Leviticus: wə-ʾim lōʾ ṯaggîaʿ yāḏô dê śeh ... šətê ṯōrîm ʾô šənê ḇənê yônâ; wə-ʾim lōʾ ṯaśśîḡ yāḏô ... ʿăśîrīṯ hā-ʾêp̄â sōleṯ (lamb, then two birds, then flour). Quran: fa-taḥrīru raqabatin ... fa-man lam yajid fa-ṣiyāmu shahrayni mutatābiʿayn ... fa-man lam yastaṭiʿ fa-iṭʿāmu sittīna miskīnā (free a slave, then fast two months, then feed sixty poor). The same 'if he cannot' structure (ʾim lōʾ ṯaggîaʿ yāḏô / fa-man lam yajid); sacrifice is replaced by manumission, fasting and feeding the poor."
      - with: hb-exod-32-tablets-broken-levites
        motif: levites-kill-idolaters-kin
        refs: ["58:22"]
        with_refs: ["Exod 32:26", "Exod 32:27", "Exod 32:29"]
        relation: divergence
        note: "Loyalty to God against one's own kin. Exodus: mî la-YHWH ʾēlāy, and the Levites kill ʾîš ʾeṯ ʾāḥîw wə-ʾîš ʾeṯ rēʿēhû ... kî ʾîš bi-ḇnô û-ḇə-ʾāḥîw (killing even sons and brothers). Quran: lā tajidu qawman yuʾminūna bi-llāhi ... yuwāddūna man ḥādda llāha wa-rasūlahu wa-law kānū ābāʾahum aw abnāʾahum aw ikhwānahum aw ʿashīratahum ... ulāʾika ḥizbu llāh. Same kin list (sons, brothers); the Quran asks withdrawal of love, not slaughter. Moses' 'who is for YHWH?' matches the 'party of God' (ḥizb Allāh)."
      - with: hb-deut-33-blessing-of-moses
        motif: no-love-for-enemies-of-god-even-kin
        refs: ["58:22"]
        with_refs: ["Deut 33:9"]
        relation: parallel
        note: "Disowning kin for God's covenant: hā-ʾōmēr lə-ʾāḇîw û-lə-ʾimmô lōʾ rəʾîṯîw wə-ʾeṯ ʾeḥâw lōʾ hikkîr wə-ʾeṯ bānâw lōʾ yāḏāʿ kî šāmərû ʾimrāṯeḵā (Levi) vs. wa-law kānū ābāʾahum aw abnāʾahum aw ikhwānahum. Same three relations: fathers, brothers, sons. Deuteronomy praises a priestly tribe; the Quran makes it the mark of every believer."
      - with: hb-jer-31-consolation-new-covenant
        motif: law-written-on-heart
        refs: ["58:22"]
        with_refs: ["Jer 31:33"]
        relation: parallel
        note: "God writes on the heart: nāṯattî ʾeṯ tôrāṯî bə-qirbām wə-ʿal libbām ʾeḵtăḇennâ vs. ulāʾika kataba fī qulūbihimu l-īmāna wa-ayyadahum bi-rūḥin minhu. Torah written on Israel's heart in the new covenant; faith written on the hearts of those who renounce God's enemies."
      - with: hb-mal-3-book-of-remembrance
        motif: god-fourth-of-three-sixth-of-five
        refs: ["58:6", "58:7"]
        with_refs: ["Mal 3:16"]
        relation: echo
        note: "God listens to private conversations and records them: ʾāz nidbərû yirʾê YHWH ʾîš ʾeṯ rēʿēhû wa-yyaqšēḇ YHWH wa-yyišmāʿ wa-yyikkāṯēḇ sēp̄er zikkārôn vs. mā yakūnu min najwā thalāthatin illā huwa rābiʿuhum ... thumma yunabbiʾuhum bi-mā ʿamilū (and 58:6 aḥṣāhu llāh). Malachi: the God-fearers' talk heard and written for their good; Quran: God present in every secret meeting, good or bad. cf. m. Avot 3:2 (the Shekhinah among two who study)."
  - unit: quran-59-hashr-banu-nadir-and-fay
    checked: [hb-deut-20-rules-of-war, hb-zech-8-zion-restored, hb-zech-7-fasting-question, hb-ps-146-trust-not-princes, hb-isa-1-indictment-of-judah, hb-jer-12-forsaken-heritage, hb-2kgs-3-moab-campaign, hb-num-31-midian-war, hb-deut-14-diet-tithe, hb-deut-28-blessings-curses]
    matches:
      - with: hb-deut-20-rules-of-war
        motif: spare-fruit-trees-in-siege
        refs: ["59:5"]
        with_refs: ["Deut 20:19", "Deut 20:20"]
        relation: contrast
        note: "Cutting the enemy's trees during a siege: opposite rulings. Deuteronomy: kî ṯāṣûr ʾel ʿîr ... lōʾ ṯašḥîṯ ʾeṯ ʿēṣāh ... kî mimmennû ṯōʾḵēl, only non-fruit trees may be cut (raq ʿēṣ ʾăšer tēḏaʿ kî lōʾ ʿēṣ maʾăḵāl hûʾ). Quran: mā qaṭaʿtum min līnatin aw taraktumūhā qāʾimatan ʿalā uṣūlihā fa-bi-idhni llāhi wa-li-yukhziya l-fāsiqīn (whatever palms you cut or left standing was by God's leave). Date palms are fruit trees; the Quran sanctions what Deuteronomy forbids, for a given siege."
      - with: hb-2kgs-3-moab-campaign
        motif: spare-fruit-trees-in-siege
        refs: ["59:5"]
        with_refs: ["2Kgs 3:19", "2Kgs 3:25"]
        relation: parallel
        note: "The biblical exception: a prophet's word authorizes felling good trees: wə-ḵol ʿēṣ ṭôḇ tappîlû wə-ḵol maʿyənê mayim tistōmû (Elisha's oracle, carried out in 3:25) vs. mā qaṭaʿtum min līnatin ... fa-bi-idhni llāh. In both the destruction of the enemy's trees is licensed by a divine word; both run against Deut 20:19."
      - with: hb-num-31-midian-war
        motif: division-of-spoils
        refs: ["59:6", "59:7"]
        with_refs: ["Num 31:27", "Num 31:28", "Num 31:29"]
        relation: divergence
        note: "Sharing out spoil. Numbers: wə-ḥāṣîṯā ʾeṯ ham-malqôaḥ bên tōp̄śê ham-milḥāmâ ... û-ḇên kol hā-ʿēḏâ, wa-hărēmōṯā meḵes la-YHWH, given to Eleazar the priest (half to the fighters, half to the people, a levy for God through the priest). Quran: mā afāʾa llāhu ʿalā rasūlihi ... fa-mā awjaftum ʿalayhi min khaylin wa-lā rikāb ... fa-li-llāhi wa-li-r-rasūli wa-li-dhī l-qurbā wa-l-yatāmā wa-l-masākīni wa-bni s-sabīli kay lā yakūna dūlatan bayna l-aghniyāʾi minkum. Spoil taken without fighting gives the fighters no share: all goes to God, the Prophet, kin and the needy, so that wealth does not circulate among the rich. The priest's levy becomes the Prophet's share."
      - with: hb-deut-14-diet-tithe
        motif: fay-booty-without-fighting-for-prophet-kin-poor
        refs: ["59:7"]
        with_refs: ["Deut 14:29"]
        relation: echo
        note: "The beneficiaries: û-ḇāʾ hal-lēwî kî ʾên lô ḥēleq wə-naḥălâ ʿimmāḵ wə-hag-gēr wə-hay-yāṯôm wə-hā-ʾalmānâ vs. wa-li-dhī l-qurbā wa-l-yatāmā wa-l-masākīni wa-bni s-sabīl. The third-year tithe feeds Levite, stranger, orphan and widow; the fayʾ feeds the Prophet's kin, orphans, the poor and the wayfarer (the Levite's place taken by the Prophet's kin, the stranger by the wayfarer)."
      - with: hb-ps-146-trust-not-princes
        motif: god-loves-stranger-orphan-widow
        refs: ["59:7"]
        with_refs: ["Ps 146:9"]
        relation: echo
        note: "YHWH šōmēr ʾeṯ gērîm yāṯôm wə-ʾalmānâ yəʿôḏēḏ vs. wa-l-yatāmā wa-l-masākīni wa-bni s-sabīl: God's care for orphan and stranger, turned in the Quran into a law for distributing spoil."
      - with: hb-zech-7-fasting-question
        motif: god-loves-stranger-orphan-widow
        refs: ["59:7", "59:9"]
        with_refs: ["Zech 7:10"]
        relation: echo
        note: "wə-ʾalmānâ wə-yāṯôm gēr wə-ʿānî ʾal taʿăšōqû wə-rāʿaṯ ʾîš ʾāḥîw ʾal taḥšəḇû bi-lḇaḇḵem vs. the shares for orphans and the poor (59:7) and wa-lā yajidūna fī ṣudūrihim ḥājatan ... (59:9-10: no rancor in our hearts, wa-lā tajʿal fī qulūbinā ghillan). Zechariah also joins care for the weak with 'devise no evil in your heart'."
      - with: hb-deut-28-blessings-curses
        motif: fortresses-cannot-protect-terror-cast-in-hearts
        refs: ["59:2"]
        with_refs: ["Deut 28:52"]
        relation: echo
        note: "Fortified walls that do not save: ʿaḏ reḏeṯ ḥōmōṯêḵā hag-gəḇōhôṯ wə-hab-bəṣurôṯ ʾăšer ʾattâ bōṭēaḥ bāhēn vs. wa-ẓannū annahum māniʿatuhum ḥuṣūnuhum mina llāhi fa-atāhumu llāhu min ḥaythu lam yaḥtasibū. Deuteronomy's curse is on Israel; the Quran applies the same false trust to the Banū Naḍīr."
  - unit: quran-59-hashr-hypocrites-and-the-names
    checked: [hb-isa-6-throne-vision, hb-exod-34-thirteen-attributes-covenant-renewal, hb-judg-6-gideon-call, hb-isa-46-bel-nebo-carried, hb-exod-19-sinai-theophany, hb-1chr-17-dynastic-oracle, hb-isa-43-you-are-my-witnesses]
    matches:
      - with: hb-exod-19-sinai-theophany
        motif: mountain-smokes-like-furnace-and-quakes
        refs: ["59:21"]
        with_refs: ["Exod 19:18"]
        relation: divergence
        note: "A mountain under the weight of revelation. Exodus: wə-har sînay ʿāšan kullô mip-pənê ʾăšer yāraḏ ʿālâw YHWH bā-ʾēš ... wa-yyeḥĕraḏ kol hā-hār məʾōḏ (Sinai actually smokes and quakes as YHWH descends). Quran: law anzalnā hādhā l-qurʾāna ʿalā jabalin la-raʾaytahu khāshiʿan mutaṣaddiʿan min khashyati llāh (had we sent this Quran down on a mountain, you would see it humbled and split for fear of God). The event at Sinai becomes a counterfactual: what God descends with is the book, and the mountain's fear shames the unmoved hearer."
      - with: hb-isa-6-throne-vision
        motif: litany-of-beautiful-names
        refs: ["59:23"]
        with_refs: ["Isa 6:3", "Isa 6:5"]
        relation: parallel
        note: "King and Holy as divine titles together: qāḏôš qāḏôš qāḏôš YHWH ṣəḇāʾôṯ ... ʾeṯ ham-meleḵ YHWH ṣəḇāʾôṯ rāʾû ʿênāy vs. huwa llāhu lladhī lā ilāha illā huwa l-maliku l-quddūsu s-salām (meleḵ / malik, qāḏôš / quddūs)."
      - with: hb-judg-6-gideon-call
        motif: litany-of-beautiful-names
        refs: ["59:23"]
        with_refs: ["Judg 6:24"]
        relation: echo
        note: "Peace as a name of God: wa-yyiben šām giḏʿôn mizbēaḥ la-YHWH wa-yyiqrāʾ lô YHWH šālôm vs. al-maliku l-quddūsu s-salām. Gideon names an altar 'YHWH is peace'; in the Quran al-Salām is itself a name of God. cf. b. Shabbat 10b (Shalom as a name of God)."
      - with: hb-exod-34-thirteen-attributes-covenant-renewal
        motif: litany-of-beautiful-names
        refs: ["59:22"]
        with_refs: ["Exod 34:6"]
        relation: parallel
        note: "God's self-proclaimed names of mercy: wa-yyiqrāʾ YHWH YHWH ʾēl raḥûm wə-ḥannûn ʾereḵ ʾappayim wə-raḇ ḥeseḏ we-ʾĕmeṯ vs. huwa r-raḥmānu r-raḥīm (r-ḥ-m in both). In Exodus God proclaims them himself to Moses after the calf; in the Quran they open a creed in the third person (huwa llāh)."
      - with: hb-isa-43-you-are-my-witnesses
        motif: litany-of-beautiful-names
        refs: ["59:24"]
        with_refs: ["Isa 43:1"]
        relation: parallel
        note: "Creator names from the same roots: kōh ʾāmar YHWH bōrăʾăḵā yaʿăqōḇ wə-yōṣerḵā yiśrāʾēl vs. huwa llāhu l-khāliqu l-bāriʾu l-muṣawwir (bôrēʾ / bāriʾ, same root b-r-ʾ; yōṣēr 'former' ~ muṣawwir 'fashioner'). Isaiah: creator and former of Jacob-Israel; Quran: of all things, followed by 'to him belong the most beautiful names'."
      - with: hb-1chr-17-dynastic-oracle
        motif: no-god-beside-you-confession
        refs: ["59:22", "59:23"]
        with_refs: ["1Chr 17:20"]
        relation: parallel
        note: "YHWH ʾên kāmôḵā wə-ʾên ʾĕlōhîm zûlāṯeḵā vs. huwa llāhu lladhī lā ilāha illā huwa (twice). David's prayer in the second person; the Quran's creed in the third."
      - with: hb-isa-46-bel-nebo-carried
        motif: no-god-beside-you-confession
        refs: ["59:22"]
        with_refs: ["Isa 46:9"]
        relation: echo
        note: "kî ʾānōḵî ʾēl wə-ʾên ʿôḏ ʾĕlōhîm wə-ʾep̄es kāmônî vs. lā ilāha illā huwa ʿālimu l-ghaybi wa-sh-shahāda. Isaiah adds incomparability; the Quran knowledge of the hidden and the seen."
  - unit: quran-60-mumtahana-abrahams-example-and-the-womens-pledge
    checked: [hb-ezra-10-dismissal-of-foreign-wives, hb-exod-20-decalogue, hb-deut-5-decalogue, hb-zech-5-flying-scroll, hb-ezek-18-sour-grapes, hb-exod-23-justice-sabbatical-festivals, hb-ezek-14-idols-in-heart-noah-daniel-job]
    matches:
      - with: hb-exod-20-decalogue
        motif: prohibition-murder-adultery-theft-false-witness
        refs: ["60:12"]
        with_refs: ["Exod 20:3", "Exod 20:13", "Exod 20:14", "Exod 20:15", "Exod 20:16"]
        relation: divergence
        note: "A short list of apodictic prohibitions, the women's pledge as a small decalogue. Exodus: lōʾ yihyeh ləḵā ʾĕlōhîm ʾăḥērîm ... lōʾ tirṣāḥ lōʾ tinʾāp̄ lōʾ tiḡnōḇ lōʾ ṯaʿăneh ḇə-rēʿăḵā ʿēḏ šāqer. Quran: ʿalā an lā yushrikna bi-llāhi shayʾan wa-lā yasriqna wa-lā yaznīna wa-lā yaqtulna awlādahunna wa-lā yaʾtīna bi-buhtānin yaftarīnahu bayna aydīhinna wa-arjulihinna wa-lā yaʿṣīnaka fī maʿrūf. The same order of other gods, theft, adultery, killing and false speech, but addressed to women as a pledge (bayʿa) to the Prophet: murder narrowed to infanticide, false witness to a slander 'between their hands and feet' (false paternity, in tafsir), obedience to the Prophet added; no Sabbath, parents or coveting."
      - with: hb-deut-5-decalogue
        motif: ten-commandments
        refs: ["60:12"]
        with_refs: ["Deut 5:17", "Deut 5:18", "Deut 5:19", "Deut 5:20"]
        relation: echo
        note: "Deuteronomy's Decalogue joins the prohibitions with wə- (lōʾ tirṣāḥ wə-lōʾ tinʾāp̄ wə-lōʾ tiḡnōḇ ...), like the Quran's chain wa-lā ... wa-lā ...; see the Exodus match for the differences."
      - with: hb-ezra-10-dismissal-of-foreign-wives
        motif: marriage-bonds-with-unbelieving-wives-dissolved
        refs: ["60:10", "60:11"]
        with_refs: ["Ezra 10:3", "Ezra 10:11"]
        relation: divergence
        note: "Dissolving mixed marriages, on a different basis. Ezra: niḵrāṯ bərîṯ lē-ʾlōhênû ləhôṣîʾ ḵol nāšîm wə-han-nôlāḏ mēhem; hibbāḏəlû mē-ʿammê hā-ʾāreṣ û-min han-nāšîm han-noḵriyyôṯ (send away foreign wives and their children; the line is ethnic). Quran: wa-lā tumsikū bi-ʿiṣami l-kawāfir, and believing women who emigrate are examined (fa-mtaḥinūhunna) and not returned to unbelieving husbands, whose dowries are repaid (wa-ātūhum mā anfaqū). The line is faith, it runs both ways (believing women leave unbelieving husbands), children are not expelled, and money is settled."
      - with: hb-zech-5-flying-scroll
        motif: prohibition-murder-adultery-theft-false-witness
        refs: ["60:12"]
        with_refs: ["Zech 5:3"]
        relation: echo
        note: "A curse on the thief and the false swearer: kol hag-gōnēḇ ... wə-ḵol han-nišbāʿ ... niqqâ vs. wa-lā yasriqna ... wa-lā yaʾtīna bi-buhtānin yaftarīnahu: theft and false words picked out of the Decalogue, as a curse in Zechariah and a pledge in the Quran."
      - with: hb-exod-23-justice-sabbatical-festivals
        motif: kindness-to-non-hostile-unbelievers
        refs: ["60:7", "60:8"]
        with_refs: ["Exod 23:4", "Exod 23:5"]
        relation: echo
        note: "Decency toward an enemy: kî ṯip̄gaʿ šôr ʾōyiḇḵā ... hāšēḇ təšîḇennû lô; kî ṯirʾeh ḥămôr śōnaʾăḵā ... ʿāzōḇ taʿăzōḇ ʿimmô vs. lā yanhākumu llāhu ʿani lladhīna lam yuqātilūkum fī d-dīni ... an tabarrūhum wa-tuqsiṭū ilayhim. Exodus commands help even to the enemy; the Quran permits kindness and justice to non-hostile unbelievers but forbids alliance with those who fought and expelled the believers."
      - with: hb-ezek-14-idols-in-heart-noah-daniel-job
        motif: kinship-of-no-avail-at-judgment
        refs: ["60:3"]
        with_refs: ["Ezek 14:14", "Ezek 14:20"]
        relation: parallel
        note: "Family ties do not save on the day of judgment: nōaḥ dāniʾēl wə-ʾiyyôḇ ... ʾim bēn ʾim baṯ yaṣṣîlû hēmmâ ḇə-ṣiḏqāṯām yaṣṣîlû nap̄šām vs. lan tanfaʿakum arḥāmukum wa-lā awlādukum yawma l-qiyāmati yafṣilu baynakum. Ezekiel: the righteous cannot save even their children; Quran: one's kin and children cannot benefit one. The Quran uses it to warn believers who keep secret ties with Meccan kin."
  - unit: quran-61-saff-ranks-moses-jesus-ahmad
    checked: [hb-num-12-miriam-aaron, hb-ps-105-history, hb-exod-9-hail, hb-exod-8-plagues-flies-murrain-boils, hb-deut-31-joshua-torah-song, hb-ps-44-national-lament, hb-exod-17-water-from-rock, hb-isa-63-communal-lament, hb-1sam-3-call-of-samuel, hb-isa-29-ariel-and-sealed-book, hb-joel-2-army-and-repentance, hb-exod-32-tablets-broken-levites]
    matches:
      - with: hb-exod-17-water-from-rock
        motif: moses-asks-why-do-you-hurt-me
        refs: ["61:5"]
        with_refs: ["Exod 17:4"]
        relation: divergence
        note: "Moses ill-treated by his own people, with a different addressee. Exodus: wa-yyiṣʿaq mōšeh ʾel YHWH lēʾmōr māh ʾeʿĕśeh lā-ʿām haz-zeh ʿôḏ məʿaṭ û-səqālūnî (he cries to God: they are about to stone me). Quran: wa-idh qāla mūsā li-qawmihi yā qawmi li-ma tuʾdhūnanī wa-qad taʿlamūna annī rasūlu llāhi ilaykum (he asks his people directly, appealing to his status as God's messenger). The Quran adds the outcome: fa-lammā zāghū azāgha llāhu qulūbahum."
      - with: hb-num-12-miriam-aaron
        motif: moses-asks-why-do-you-hurt-me
        refs: ["61:5"]
        with_refs: ["Num 12:1", "Num 12:2"]
        relation: echo
        note: "wat-təḏabbēr miryām wə-ʾahărōn bə-mōšeh ... ha-raq ʾaḵ bə-mōšeh dibber YHWH vs. li-ma tuʾdhūnanī wa-qad taʿlamūna annī rasūlu llāhi ilaykum. Numbers: his siblings question his unique status and God defends him; the Quran gives no details of the 'hurt' (cf. Q 33:69, where God clears Moses)."
      - with: hb-isa-63-communal-lament
        motif: why-do-you-make-us-stray
        refs: ["61:5"]
        with_refs: ["Isa 63:17"]
        relation: divergence
        note: "God makes Israel's heart swerve. Isaiah, as a lament: lāmmâ ṯaṯʿēnû YHWH mid-dərāḵêḵā taqšîaḥ libbēnû mi-yyirʾāṯeḵā (why do you make us stray and harden our heart?). Quran, as a verdict: fa-lammā zāghū azāgha llāhu qulūbahum wa-llāhu lā yahdī l-qawma l-fāsiqīn (when they swerved, God made their hearts swerve). Isaiah asks why God does it; the Quran answers: because they swerved first."
      - with: hb-exod-9-hail
        motif: hardening-of-pharaohs-heart
        refs: ["61:5"]
        with_refs: ["Exod 9:34", "Exod 9:35"]
        relation: echo
        note: "First human, then divine hardening: wa-yyōsep̄ laḥăṭōʾ wa-yyaḵbēd libbô hûʾ wa-ʿăḇāḏâw; wa-yyeḥĕzaq lēḇ parʿōh (Pharaoh hardens himself, then his heart is hardened) vs. fa-lammā zāghū azāgha llāhu qulūbahum. The sequence Exodus gives Pharaoh the Quran gives Moses' own people."
      - with: hb-ps-105-history
        motif: hardening-of-pharaohs-heart
        refs: ["61:5"]
        with_refs: ["Ps 105:25"]
        relation: echo
        note: "hāp̄aḵ libbām lisnōʾ ʿammô (God turned the Egyptians' hearts to hate his people) vs. azāgha llāhu qulūbahum: God turns hearts. The psalm says it of Egypt, the Quran of Israel."
      - with: hb-exod-32-tablets-broken-levites
        motif: disciples-helpers-of-god
        refs: ["61:14"]
        with_refs: ["Exod 32:26"]
        relation: echo
        note: "A rallying call answered by a loyal group: wa-yyaʿămōḏ mōšeh bə-šaʿar ham-maḥăneh wa-yyōʾmer mî la-YHWH ʾēlāy wa-yyēʾāsp̄û ʾēlâw kol bənê lēwî vs. kamā qāla ʿīsā bnu maryama li-l-ḥawāriyyīna man anṣārī ilā llāh, qāla l-ḥawāriyyūna naḥnu anṣāru llāh. 'Who is for YHWH, to me?' ~ 'Who are my helpers to God?' (ʾēlāy / ilā). The Levites answer with the sword; the disciples by faith, and God then helps the believing party."
      - with: hb-1sam-3-call-of-samuel
        motif: lamp-of-god-not-yet-out
        refs: ["61:8"]
        with_refs: ["1Sam 3:3"]
        relation: echo
        note: "God's light not extinguished: wə-nēr ʾĕlōhîm ṭerem yiḵbeh vs. yurīdūna li-yuṭfiʾū nūra llāhi bi-afwāhihim wa-llāhu mutimmu nūrihi. Samuel's lamp is the sanctuary lamp of a dark time before the call; the Quran's light is God's religion, which the opponents try to blow out."
      - with: hb-isa-29-ariel-and-sealed-book
        motif: why-say-what-you-do-not-do
        refs: ["61:2", "61:3"]
        with_refs: ["Isa 29:13"]
        relation: echo
        note: "Words without the matching deeds or heart: niggaš hā-ʿām haz-zeh bə-p̄îw û-ḇi-śp̄āṯâw kibbəḏûnî wə-libbô riḥaq mimmennî vs. li-ma taqūlūna mā lā tafʿalūn, kabura maqtan ʿinda llāhi an taqūlū mā lā tafʿalūn. Isaiah: lips without heart; Quran: words without deeds."
      - with: hb-joel-2-army-and-repentance
        motif: fighters-in-ranks-like-solid-building
        refs: ["61:4"]
        with_refs: ["Joel 2:7", "Joel 2:8"]
        relation: echo
        note: "An army that keeps its ranks: wə-ʾîš bi-ḏrāḵâw yēlēḵûn wə-lōʾ yəʿabbəṭûn ʾōrḥôṯām wə-ʾîš ʾāḥîw lōʾ yiḏḥāqûn vs. yuqātilūna fī sabīlihi ṣaffan ka-annahum bunyānun marṣūṣ. Joel's is YHWH's locust army against Judah; the Quran's the believers' battle line."
  - unit: quran-62-jumua-unlettered-donkey-and-friday
    checked: [hb-gen-1-creation-six-days, hb-neh-13-nehemiahs-final-reforms, hb-amos-8-summer-fruit, hb-zeph-1-day-of-wrath, hb-isa-28-covenant-with-death, hb-isa-1-indictment-of-judah, hb-amos-5-lament-day-of-yhwh, hb-deut-32-song-of-moses]
    matches:
      - with: hb-neh-13-nehemiahs-final-reforms
        motif: sabbath-labor-and-trade-rebuked
        refs: ["62:9", "62:10"]
        with_refs: ["Neh 13:15", "Neh 13:16", "Neh 13:17", "Neh 13:19"]
        relation: divergence
        note: "Trade and the weekly holy day. Nehemiah: dōrəḵîm gittôṯ baš-šabbāṯ ... û-mōḵərîm baš-šabbāṯ ... mə-ḥalləlîm ʾeṯ yôm haš-šabbāṯ, and the gates are shut from Sabbath eve to its end (wə-lōʾ yip̄tāḥûm ʿaḏ ʾaḥar haš-šabbāṯ). Quran: idhā nūdiya li-ṣ-ṣalāti min yawmi l-jumuʿati fa-sʿaw ilā dhikri llāhi wa-dharū l-bayʿ; fa-idhā quḍiyati ṣ-ṣalātu fa-ntashirū fī l-arḍi wa-btaghū min faḍli llāh. Trade stops only for the prayer, and after it the believers are told to go out and seek God's bounty (trade). A day of rest becomes an hour of assembly."
      - with: hb-gen-1-creation-six-days
        motif: divine-rest-seventh-day
        refs: ["62:9", "62:10"]
        with_refs: ["Gen 2:2", "Gen 2:3"]
        relation: divergence
        note: "The weekly day without the creation rest. Genesis grounds the seventh day in God's rest: wa-yišbōṯ bay-yôm haš-šəḇîʿî ... wa-yəḇāreḵ ʾĕlōhîm ʾeṯ yôm haš-šəḇîʿî wa-yqaddēš ʾōṯô kî ḇô šāḇaṯ. The Quran's Friday (yawm al-jumuʿa, the day of assembly) has no rest and no creation basis: fa-ntashirū fī l-arḍ. This fits the Quran's denial that God rested (50:38)."
      - with: hb-amos-8-summer-fruit
        motif: merchants-impatient-for-sabbath-to-end
        refs: ["62:11"]
        with_refs: ["Amos 8:5"]
        relation: parallel
        note: "Commerce pulling people away from the holy time: mātay yaʿăḇōr ha-ḥōḏeš wə-našbîrâ šeḇer wə-haš-šabbāṯ wə-nip̄təḥâ bār vs. wa-idhā raʾaw tijāratan aw lahwan nfaḍḍū ilayhā wa-tarakūka qāʾiman, qul mā ʿinda llāhi khayrun mina l-lahwi wa-mina t-tijāra. Amos's merchants wait impatiently for the Sabbath to end; the Quran's congregation leaves the Prophet in the middle of the Friday sermon for a caravan."
      - with: hb-isa-1-indictment-of-judah
        motif: donkey-carrying-books
        refs: ["62:5"]
        with_refs: ["Isa 1:3"]
        relation: divergence
        note: "Israel compared to a donkey, in opposite directions. Isaiah: yāḏaʿ šôr qōnēhû wa-ḥămôr ʾēḇûs bəʿālâw yiśrāʾēl lōʾ yāḏaʿ (the donkey knows its master's crib, Israel does not know: the donkey is wiser). Quran: mathalu lladhīna ḥummilū t-tawrāta thumma lam yaḥmilūhā ka-mathali l-ḥimāri yaḥmilu asfārā (those charged with the Torah who did not bear it are like a donkey carrying books: the donkey carries without understanding). ḥămôr / ḥimār; in both Israel fails to 'know' what it has."
      - with: hb-amos-5-lament-day-of-yhwh
        motif: death-you-flee-will-meet-you
        refs: ["62:8"]
        with_refs: ["Amos 5:19"]
        relation: echo
        note: "Fleeing doom only to meet it: kaʾăšer yānûs ʾîš mip-pənê hā-ʾărî û-p̄əḡāʿô had-dōḇ ... û-nəšāḵô han-nāḥāš vs. inna l-mawta lladhī tafirrūna minhu fa-innahu mulāqīkum. Amos's image is the Day of YHWH; the Quran's is death."
      - with: hb-deut-32-song-of-moses
        motif: messenger-among-the-unlettered
        refs: ["62:2", "62:3", "62:4"]
        with_refs: ["Deut 32:21"]
        relation: echo
        note: "God's favor turned to a 'non-people': wa-ʾănî ʾaqnîʾēm bə-lōʾ ʿām bə-ḡôy nāḇāl ʾaḵʿîsēm vs. huwa lladhī baʿatha fī l-ummiyyīna rasūlan minhum ... dhālika faḍlu llāhi yuʾtīhi man yashāʾ, followed by the donkey parable against those given the Torah (62:5). The ummiyyūn (gentiles, non-scriptural people) receive a messenger as Deuteronomy's 'non-people' rouse Israel's jealousy. Lead only."
