        note: "Plants worship their Creator: ʾāz yərannənû kol ʿăṣê yāʿar (all the trees of the forest sing for joy) vs. wa-n-najmu wa-sh-shajaru yasjudān (star or herb, and tree, prostrate). The psalm's trees sing before YHWH's coming to judge; the Quran's bow down."
      - with: hb-ps-98-rivers-clap
        motif: nature-sings-and-rejoices
        refs: ["55:6"]
        with_refs: ["Ps 98:8"]
        relation: echo
        note: "nəhārôṯ yimḥăʾû ḵāp̄ yaḥaḏ hārîm yərannēnû vs. wa-n-najmu wa-sh-shajaru yasjudān. Nature worships in both; joy (clapping, singing) in the psalm, prostration in the Quran."
      - with: hb-lev-19-holiness-code-b
        motif: balance-set-do-not-transgress-in-weighing
        refs: ["55:7", "55:8", "55:9"]
        with_refs: ["Lev 19:35", "Lev 19:36"]
        relation: divergence
        note: "Just weighing commanded. Leviticus: lōʾ ṯaʿăśû ʿāwel ... bam-mišqāl ... mōʾzənê ṣeḏeq ʾaḇnê ṣeḏeq ... ʾănî YHWH ʾĕlōhêḵem ʾăšer hôṣēʾṯî ʾeṯḵem mē-ʾereṣ miṣrāyim (grounded in the exodus). Quran: wa-s-samāʾa rafaʿahā wa-waḍaʿa l-mīzān, allā taṭghaw fī l-mīzān, wa-aqīmū l-wazna bi-l-qisṭi wa-lā tukhsirū l-mīzān (grounded in creation: the same God who raised the sky set the balance). mōʾzənayim / mīzān. Israel's ground in history becomes a cosmic ground."
      - with: hb-prov-11-sayings
        motif: just-weights-and-measures
        refs: ["55:9"]
        with_refs: ["Prov 11:1"]
        relation: parallel
        note: "mōʾzənê mirmâ tôʿăḇaṯ YHWH wə-ʾeḇen šəlēmâ rəṣônô vs. wa-aqīmū l-wazna bi-l-qisṭi wa-lā tukhsirū l-mīzān (balance: mōʾzənayim / mīzān)."
      - with: hb-isa-63-communal-lament
        motif: we-are-clay-you-are-potter
        refs: ["55:14"]
        with_refs: ["Isa 64:7"]
        relation: echo
        note: "Man as potter's clay: ʾănaḥnû ha-ḥōmer wə-ʾattâ yōṣərēnû û-maʿăśēh yāḏəḵā kullānû vs. khalaqa l-insāna min ṣalṣālin ka-l-fakhkhār. Isaiah uses it as a plea to the father-potter for mercy; the Quran as a fact of creation, set beside the jinn's fire."
      - with: hb-gen-2-eden-adam-woman
        motif: human-formed-from-earth
        refs: ["55:14"]
        with_refs: ["Gen 2:7"]
        relation: parallel
        note: "wa-yyîṣer YHWH ʾĕlōhîm ʾeṯ hā-ʾāḏām ʿāp̄ār min hā-ʾăḏāmâ vs. khalaqa l-insāna min ṣalṣālin ka-l-fakhkhār. Dust from the ground (and the potter's verb yāṣar) in Genesis; dry, ringing clay like pottery in the Quran."
      - with: hb-gen-1-creation-six-days
        motif: two-seas-sweet-and-salt-with-barrier
        refs: ["55:19", "55:20"]
        with_refs: ["Gen 1:6", "Gen 1:7"]
        relation: echo
        note: "Two bodies of water kept apart by God: yəhî rāqîaʿ bə-ṯôḵ ham-mayim wî-hî maḇdîl bên mayim lā-māyim vs. maraja l-baḥrayni yaltaqiyān, baynahumā barzakhun lā yabghiyān. Genesis divides upper from lower waters with a firmament; the Quran two seas side by side with a barrier (barzakh). Weak lead: shared idea of separation only."
  - unit: quran-55-rahman-judgment-and-the-four-gardens
    checked: [hb-gen-6-sons-of-god, hb-deut-8-wilderness-lesson, hb-joel-2-army-and-repentance, hb-joel-4-valley-of-jehoshaphat, hb-amos-8-summer-fruit, hb-amos-9-altar-and-booth-of-david, hb-ps-68-rider-of-clouds, hb-ps-72-solomon]
