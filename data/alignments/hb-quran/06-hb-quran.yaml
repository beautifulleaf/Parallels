        note: "YHWH ʾāmar ʾēlay bənî ʾattâ ʾănî ha-yyôm yəliḏtîḵā vs. law arāda llāhu an yattakhidha waladan la-ṣṭafā mimmā yakhluqu mā yashāʾu subḥānahu huwa llāhu l-wāḥidu l-qahhār. The psalm's divine sonship of the king is answered in the Quran's terms: even if God wished it, the 'son' would be a creature God chose, not one he begot, and God is above it altogether."
      - with: hb-2sam-7-dynastic-oracle
        motif: if-god-wanted-a-son-he-would-choose
        refs: ["39:4"]
        with_refs: ["2Sam 7:14"]
        relation: contrast
        note: "ʾănî ʾehyeh-lô lə-ʾāḇ wə-hûʾ yihyeh-lî lə-ḇēn vs. law arāda llāhu an yattakhidha waladan la-ṣṭafā mimmā yakhluq: adoption of a chosen human as God's son. The Quran states this as a hypothetical it rejects (subḥānahu); 2 Samuel states it as a covenant fact."
      - with: hb-ps-78-history
        motif: distress-prayer-then-ingratitude
        refs: ["39:8"]
        with_refs: ["Ps 78:34", "Ps 78:35", "Ps 78:36"]
        relation: parallel
        note: "ʾim-hărāḡām û-ḏərāšûhû wə-šāḇû wə-šiḥărû-ʾēl ... wa-yəp̄attûhû bə-p̄îhem û-ḇi-lšônām yəḵazzəḇû-lô vs. wa-idhā massa l-insāna ḍurrun daʿā rabbahu munīban ilayhi thumma idhā khawwalahu niʿmatan minhu nasiya mā kāna yadʿū ilayhi: they seek God when struck, then are false to him. The psalm's people is Israel; the Quran's is 'man' (al-insān)."
      - with: hb-ps-119-vav-kaf
        motif: sides-forsake-beds-night-prayer
        refs: ["39:9"]
        with_refs: ["Ps 119:62"]
        relation: echo
        note: "ḥăṣôṯ-laylâ ʾāqûm ləhôḏôṯ lāḵ vs. a-man huwa qānitun ānāʾa l-layli sājidan wa-qāʾiman: rising in the night to pray (ʾāqûm / qāʾim)."
      - with: hb-job-26-hymn-to-cosmic-power
        motif: night-wound-around-day
        refs: ["39:5"]
        with_refs: ["Job 26:10"]
        relation: echo
        note: "ḥōq-ḥāḡ ʿal-pənê-māyim ʿaḏ-taḵlîṯ ʾôr ʿim-ḥōšeḵ (he drew a circle on the waters at the boundary of light and darkness) vs. yukawwiru l-layla ʿalā n-nahāri wa-yukawwiru n-nahāra ʿalā l-layl (he wraps night round day): day and night as something curved or circled round."
  - unit: quran-39-sincere-servant
    checked: [hb-ps-90-moses-thousand-years, hb-ps-103-bless-my-soul, hb-ps-102-afflicted, hb-ps-78-history, hb-deut-33-blessing-of-moses, hb-isa-34-edom-and-lilith, hb-job-4-eliphaz-vision, hb-ps-119-alef-he, hb-ps-119-lamed-ayin, hb-1kgs-18-carmel]
    matches:
      - with: hb-ps-90-moses-thousand-years
