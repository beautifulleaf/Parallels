        note: "kōreh-šaḥaṯ bāh yippōl wə-ḡōlēl ʾeḇen ʾēlâw tāšûḇ vs. wa-lā yaḥīqu l-makru s-sayyiʾu illā bi-ahlihi: the same rule as a proverb. In Q it is God's unchanging sunna (fa-lan tajida li-sunnati llāhi tabdīlā)."
      - with: hb-ps-130-de-profundis
        motif: if-god-punished-all-no-creature-left
        refs: ["35:45"]
        with_refs: ["Ps 130:3"]
