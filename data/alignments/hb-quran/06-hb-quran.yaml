  - unit: quran-36-people-of-the-town
    checked: [hb-lev-24-lamp-bread-blasphemer, hb-lev-20-penalties, hb-1kgs-21-naboth, hb-ezek-14-idols-in-heart-noah-daniel-job, hb-ezek-33-watchman-and-fall-news, hb-ezek-20-history-of-rebellion, hb-1kgs-18-carmel, hb-num-14-rebellion-verdict, hb-josh-6-jericho, hb-gen-19-sodom-destroyed]
    matches:
      - with: hb-1kgs-18-carmel
        motif: messengers-called-ill-omen-threatened-stoning
        refs: ["36:18", "36:19"]
        with_refs: ["1Kgs 18:17", "1Kgs 18:18"]
        relation: parallel
        note: "The prophet blamed for the people's misfortune throws the charge back. ha-ʾattâ zeh ʿōḵēr yiśrāʾēl / lōʾ ʿāḵartî ʾeṯ-yiśrāʾēl kî ʾim-ʾattâ û-ḇêṯ ʾāḇîḵā ba-ʿăzāḇəḵem ʾeṯ-miṣwōṯ YHWH vs. innā taṭayyarnā bikum / ṭāʾirukum maʿakum ... bal antum qawmun musrifūn. 'Troubler' (ʿōḵēr) corresponds to the omen-bird (ṭāʾir); in both the bad luck is in the accusers' own sin."
      - with: hb-num-14-rebellion-verdict
        motif: messengers-called-ill-omen-threatened-stoning
        refs: ["36:18", "36:20"]
        with_refs: ["Num 14:6", "Num 14:9", "Num 14:10"]
        relation: echo
        note: "A pair of trustworthy men urge the people to trust God and are threatened with stoning: wa-yyōʾmərû kol-hā-ʿēḏâ lirgôm ʾōṯām bā-ʾăḇānîm vs. la-in lam tantahū la-narjumannakum. r-g-m is the same root on both sides (rāḡam / rajama). In Num the glory of YHWH appears and intervenes; in Q a man from the city's edge supports them and is killed."
      - with: hb-1kgs-21-naboth
        motif: stoning-penalty
        refs: ["36:18"]
        with_refs: ["1Kgs 21:13"]
        relation: echo
        note: "wa-yyōṣiʾuhû mi-ḥûṣ lā-ʿîr wa-yyisqəluhû ḇā-ʾăḇānîm wa-yyāmōṯ vs. la-narjumannakum: the town stones the righteous man. Naboth is stoned on a false charge of cursing God and king; the messengers are threatened for bringing God's message."
      - with: hb-josh-6-jericho
        motif: single-shout-extinguishes-town
        refs: ["36:29"]
        with_refs: ["Josh 6:20"]
        relation: echo
        note: "wa-yyārîʿû hā-ʿām tərûʿâ ḡəḏôlâ wa-ttippōl ha-ḥômâ taḥteyhā vs. in kānat illā ṣayḥatan wāḥidatan fa-idhā hum khāmidūn: a single shout brings a city's end. In Joshua it is the people's war cry, followed by conquest; in the Quran God's own blast, with no army needed (wa-mā anzalnā ... min jundin mina s-samāʾ)."
      - with: hb-gen-19-sodom-destroyed
        motif: messengers-to-the-town-two-then-third
        refs: ["36:13", "36:14", "36:20"]
        with_refs: ["Gen 19:1", "Gen 19:14"]
        relation: echo
        note: "Messengers come to a doomed town. Gen: wa-yyāḇōʾû šənê ham-malʾāḵîm sədōmâ, two messengers (the third of Gen 18 stays behind). Q: idh arsalnā ilayhimu thnayni ... fa-ʿazzaznā bi-thālith, two messengers then a third. Lot alone urges his people (qûmû ṣəʾû min-ha-mmāqôm ha-zze) and is mocked (wa-yəhî ḵi-mṣaḥēq); the Quranic man from the city's edge urges yā-qawmi ttabiʿū l-mursalīn. Structural lead only, the town is unnamed in the Quran."
  - unit: quran-36-cosmic-signs
    checked: [hb-eccl-1-hevel-and-cycles, hb-ps-74-leviathan, hb-ps-19-heavens-and-torah, hb-ps-104-creation-hymn, hb-job-38-whirlwind-creation, hb-gen-1-creation-six-days, hb-jer-33-branch-and-cosmic-covenant]
