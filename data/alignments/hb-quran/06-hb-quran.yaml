        note: "The son's wife. Lev: ʿerwaṯ kallāṯəḵā lōʾ ṯəḡalleh ʾēšeṯ binḵā hîʾ (forbidden as the son's wife). Q: zawwajnākahā li-kay lā yakūna ʿalā l-muʾminīna ḥarajun fī azwāji adʿiyāʾihim. The prohibition stands for a real son (cf. Q 4:23 ḥalāʾilu abnāʾikumu lladhīna min aṣlābikum, sons 'from your loins'), but the adopted son's former wife is declared lawful, because the adoptive tie is not sonship (33:40)."
      - with: hb-2sam-11-bathsheba-uriah
        motif: zayd-and-zaynab-marriage
        refs: ["33:37", "33:38"]
        with_refs: ["2Sam 11:27"]
