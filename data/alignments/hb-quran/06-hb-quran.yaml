        refs: ["34:46"]
        with_refs: ["2Kgs 9:11"]
        relation: parallel
        note: "maddûaʿ bāʾ ha-mməšuggāʿ ha-zzeh ʾēleyḵā vs. mā bi-ṣāḥibikum min jinnatin in huwa illā nadhīrun lakum: the messenger dismissed as mad by his audience. The Quran rebuts it; in Kings Jehu brushes it aside (ʾattem yəḏaʿtem ʾeṯ-hā-ʾîš wə-ʾeṯ-śîḥô)."
      - with: hb-jer-29-letter-to-exiles
