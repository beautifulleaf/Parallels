  - unit: quran-34-intercession-and-judgment
    checked: [hb-ezek-14-idols-in-heart-noah-daniel-job, hb-ps-44-national-lament, hb-isa-59-sins-separate-divine-warrior, hb-jer-15-moses-and-samuel, hb-isa-14-helel-ben-shahar, hb-deut-28-blessings-curses, hb-isa-41-trial-of-the-gods]
    matches:
      - with: hb-jer-15-moses-and-samuel
