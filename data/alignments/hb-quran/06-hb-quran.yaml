  - unit: quran-37-noah
    checked: [hb-ps-78-history, hb-gen-9-noah-drunk-curse, hb-exod-14-crossing-of-the-sea, hb-deut-1-spies-retold, hb-neh-9-levites-confession, hb-ps-105-history, hb-gen-6-flood]
    matches:
      - with: hb-gen-6-flood
        motif: noah-cries-to-god-answered
        refs: ["37:75", "37:76"]
        with_refs: ["Gen 6:13", "Gen 7:1", "Gen 8:1"]
        relation: divergence
        note: "Who speaks first. In Genesis Noah never addresses God: God speaks (wa-yyōʾmer ʾĕlōhîm lə-nōaḥ, 6:13; wa-yyōʾmer YHWH lə-nōaḥ bōʾ-ʾattâ, 7:1), and God 'remembers' him (wa-yyizkōr ʾĕlōhîm ʾeṯ-nōaḥ, 8:1). In Q 37:75 Noah takes the initiative and God answers: wa-la-qad nādānā Nūḥun fa-la-niʿma l-mujībūn, wa-najjaynāhu wa-ahlahu mina l-karbi l-ʿaẓīm. The silent righteous man becomes a praying prophet."
      - with: hb-gen-6-flood
        motif: noahs-progeny-the-survivors
        refs: ["37:77", "37:82"]
        with_refs: ["Gen 7:23"]
        relation: parallel
        note: "wa-yyimaḥ ʾeṯ-kol-ha-yqûm ... wa-yyiššāʾer ʾaḵ-nōaḥ wa-ʾăšer ʾittô ba-ttēḇâ vs. wa-jaʿalnā dhurriyyatahu humu l-bāqīna ... thumma aghraqnā l-ākharīn: only Noah's house remains (nišʾar / al-bāqūn), all others are drowned."
      - with: hb-gen-9-noah-drunk-curse
        motif: three-sons-repopulate-world
        refs: ["37:77"]
        with_refs: ["Gen 9:18", "Gen 9:19"]
        relation: parallel
        note: "šəlōšâ ʾēlleh bənê-nōaḥ û-mē-ʾēlleh nāp̄əṣâ ḵol-hā-ʾāreṣ vs. wa-jaʿalnā dhurriyyatahu humu l-bāqīn: all later humanity comes from Noah's offspring. The Quran does not name the three sons."
      - with: hb-gen-9-noah-drunk-curse
        motif: peace-upon-prophet-refrain
        refs: ["37:78", "37:79", "37:81"]
        with_refs: ["Gen 9:20", "Gen 9:21", "Gen 9:25"]
        relation: divergence
        note: "The end of Noah's story. Gen goes from the flood straight to wa-yyāḥel nōaḥ ʾîš hā-ʾăḏāmâ wa-yyiṭṭaʿ kārem wa-yyēšt min-ha-yyayin wa-yyiškār wa-yyiṯgal, then Noah's curse ʾārûr kənāʿan. The Quran closes with a blessing: wa-taraknā ʿalayhi fī l-ākhirīna salāmun ʿalā Nūḥin fī l-ʿālamīn ... innahu min ʿibādinā l-muʾminīn. It leaves out the drunkenness, the nakedness and the curse, and preserves only praise for later generations."
      - with: hb-gen-6-flood
        motif: hero-righteous
        refs: ["37:80", "37:81"]
        with_refs: ["Gen 6:9", "Gen 7:1"]
        relation: parallel
        note: "nōaḥ ʾîš ṣaddîq tāmîm hāyâ bə-ḏōrōṯâw ... kî-ʾōṯəḵā rāʾîṯî ṣaddîq ləp̄ānay vs. innā ka-dhālika najzī l-muḥsinīna innahu min ʿibādinā l-muʾminīn: Noah saved as righteous (ṣaddîq / muḥsin, muʾmin)."
  - unit: quran-37-abraham-idols-fire
    checked: [hb-judg-6-jerubbaal-fleece, hb-ps-135-hymn-of-election, hb-ps-115-not-to-us, hb-isa-46-bel-nebo-carried, hb-jer-10-idols-scarecrows, hb-deut-4-exhortation, hb-josh-24-shechem-covenant, hb-dan-3-golden-image-furnace, hb-gen-15-covenant-between-pieces, hb-isa-44-idol-from-half-a-log]
    matches:
      - with: hb-judg-6-jerubbaal-fleece
        motif: hero-smashes-idols
        refs: ["37:85", "37:93", "37:97"]
        with_refs: ["Judg 6:25", "Judg 6:28", "Judg 6:30", "Judg 6:31"]
        relation: parallel
        note: "A son destroys the cult objects of his father's house and the townsmen demand his death. Judg: wə-hārastā ʾeṯ-mizbaḥ ha-bbaʿal ʾăšer lə-ʾāḇîḵā ... hôṣēʾ ʾeṯ-binḵā wə-yāmōṯ; Joash answers ʾim-ʾĕlōhîm hûʾ yāreḇ lô (if Baal is a god let him fight for himself). Q: idh qāla li-abīhi wa-qawmihi mādhā taʿbudūn ... fa-rāgha ʿalayhim ḍarban bi-l-yamīn ... qālū bnū lahu bunyānan fa-alqūhu fī l-jaḥīm. In Judges the father defends the son by mocking the god; in the Quran the son mocks (mā lakum lā tanṭiqūn) and the father is the idolater."
      - with: hb-deut-4-exhortation
        motif: idols-cannot-see-hear-eat-smell
        refs: ["37:91", "37:92"]
        with_refs: ["Deut 4:28"]
        relation: parallel
        note: "ʾĕlōhîm maʿăśēh yəḏê ʾāḏām ʿēṣ wā-ʾeḇen ʾăšer lōʾ-yirʾûn wə-lōʾ yišməʿûn wə-lōʾ yōʾḵəlûn wə-lōʾ yərîḥun vs. fa-qāla a-lā taʾkulūna mā lakum lā tanṭiqūn. Deut's list includes 'they do not eat', which is the point of Abraham's taunt."
      - with: hb-ps-135-hymn-of-election
        motif: idols-cannot-see-hear-eat-smell
        refs: ["37:92", "37:95"]
        with_refs: ["Ps 135:15", "Ps 135:16"]
        relation: parallel
        note: "maʿăśēh yəḏê ʾāḏām pe-lāhem wə-lōʾ yəḏabbērû vs. mā lakum lā tanṭiqūn ... a-taʿbudūna mā tanḥitūn: idols that are made by hands and do not speak. The psalm describes them; Abraham speaks to them."
      - with: hb-ps-115-not-to-us
        motif: idols-cannot-see-hear-eat-smell
        refs: ["37:92"]
        with_refs: ["Ps 115:5", "Ps 115:7"]
        relation: parallel
        note: "pe-lāhem wə-lōʾ yəḏabbērû ... lōʾ-yehgû bi-ḡrônām vs. mā lakum lā tanṭiqūn: mouths that make no sound."
      - with: hb-isa-44-idol-from-half-a-log
        motif: god-created-you-and-what-you-make
        refs: ["37:95", "37:96"]
        with_refs: ["Isa 44:13", "Isa 44:15"]
        relation: parallel
        note: "ḥāraš ʿēṣîm nāṭâ qāw ... wa-yyaʿăśēhû kə-ṯaḇnîṯ ʾîš ... ʾap̄-yip̄ʿal-ʾēl wa-yyištāḥû vs. a-taʿbudūna mā tanḥitūna wa-llāhu khalaqakum wa-mā taʿmalūn: worshipping what one carves. The Quran adds the reversal that God created both the carver and his work."
      - with: hb-jer-10-idols-scarecrows
        motif: idols-cannot-see-hear-eat-smell
        refs: ["37:92"]
        with_refs: ["Jer 10:5"]
        relation: echo
        note: "kə-ṯōmer miqšâ hēmmâ wə-lōʾ yəḏabbērû ... kî lōʾ yārēʿû wə-ḡam-hêṭêḇ ʾên ʾôṯām vs. mā lakum lā tanṭiqūn: speechless idols that can do neither harm nor good."
      - with: hb-josh-24-shechem-covenant
        motif: father-serves-idols
        refs: ["37:85", "37:86"]
        with_refs: ["Josh 24:2"]
        relation: parallel
        note: "teraḥ ʾăḇî ʾaḇrāhām ... wa-yyaʿaḇḏû ʾĕlōhîm ʾăḥērîm vs. idh qāla li-abīhi wa-qawmihi mādhā taʿbudūn a-ifkan ālihatan dūna llāhi turīdūn: Abraham's father worshipped other gods. Joshua states it in one line; Genesis does not say it at all; the Quran makes it a confrontation between son and father."
      - with: hb-dan-3-golden-image-furnace
        motif: thrown-into-fire
        refs: ["37:97", "37:98"]
        with_refs: ["Dan 3:20", "Dan 3:26", "Dan 3:27"]
        relation: echo
        note: "ʾămar ləḵappāṯâ ... lə-mirmēʾ lə-ʾattûn nûrāʾ yāqiḏtāʾ ... dî lāʾ šəlēṭ nûrāʾ bə-ḡešmhôn (Aramaic: cast bound into the burning furnace; the fire had no power over them) vs. ibnū lahu bunyānan fa-alqūhu fī l-jaḥīm fa-arādū bihi kaydan fa-jaʿalnāhumu l-asfalīn. Those who refuse the idol are thrown into a built fire and survive. In the HB this happens to Daniel's companions; the Quran tells it of Abraham (Abraham's fire is cf. Gen. Rab. 38:13, outside the HB)."
      - with: hb-gen-15-covenant-between-pieces
        motif: abraham-gazes-at-stars-says-i-am-sick
        refs: ["37:88"]
        with_refs: ["Gen 15:5"]
        relation: divergence
        note: "Abraham looks at the stars. Gen: wa-yyōṣēʾ ʾōṯô ha-ḥûṣâ wa-yyōʾmer habbeṭ-nāʾ ha-ššāmaymâ û-sp̄ōr ha-kkôḵāḇîm ... kōh yihyeh zarʿeḵā, at God's command, as a promise of offspring. Q: fa-naẓara naẓratan fī n-nujūmi fa-qāla innī saqīm, on his own, as a pretext to stay behind and break the idols. The same gesture serves a different purpose. Lead only."
  - unit: quran-37-sacrifice-of-son
    checked: [hb-gen-22-aqedah, hb-judg-11-jephthah-outcast-diplomacy, hb-judg-11-jephthahs-daughter, hb-judg-13-samson-birth, hb-gen-18-visitors-at-mamre, hb-job-1-prologue-first-test, hb-gen-15-covenant-between-pieces]
    matches:
      - with: hb-gen-22-aqedah
        motif: god-tests-patriarch
        refs: ["37:106"]
        with_refs: ["Gen 22:1"]
        relation: divergence
        note: "Placement of the 'test'. Gen opens with it, wə-hā-ʾĕlōhîm nissâ ʾeṯ-ʾaḇrāhām, so the reader knows from the start that it is a trial. Q names it only after the rescue: inna hādhā la-huwa l-balāʾu l-mubīn. Gen's closing reason, kî ʿattâ yāḏaʿtî kî-yərēʾ ʾĕlōhîm ʾattâ (now I know, 22:12), has no counterpart: in Q God does not come to know."
      - with: hb-gen-22-aqedah
        motif: command-to-sacrifice-son
        refs: ["37:102"]
        with_refs: ["Gen 22:2"]
        relation: divergence
        note: "How the command comes. Gen: direct divine speech, qaḥ-nāʾ ʾeṯ-binḵā ... wə-lek-ləḵā ʾel-ʾereṣ ha-mmōriyyâ wə-haʿălēhû šām lə-ʿōlâ (a burnt offering at a named place). Q: a dream reported by the father, innī arā fī l-manāmi annī adhbaḥuka (I see in sleep that I slaughter you), with no place, no mountain and no ʿōlâ. Q's dhabaḥa is cognate with Hebrew zāḇaḥ, while Gen uses ʿōlâ and liš-ḥōṭ (22:10)."
      - with: hb-gen-22-aqedah
        motif: only-beloved-son
        refs: ["37:101", "37:112"]
        with_refs: ["Gen 22:2"]
        relation: divergence
        note: "Who the son is. Gen names him three times over: ʾeṯ-binḵā ʾeṯ-yəḥîḏəḵā ʾăšer-ʾāhaḇtā ʾeṯ-yiṣḥāq. Q has only bi-ghulāmin ḥalīm (a forbearing boy) and announces Isaac only after the episode, wa-basharnāhu bi-Isḥāqa nabiyyan mina ṣ-ṣāliḥīn (37:112). This leaves the victim unnamed, and many exegetes read him as Ishmael. The 'only' (yāḥîḏ) son of Gen is not said."
      - with: hb-gen-22-aqedah
        motif: son-consents-to-be-sacrificed
        refs: ["37:102"]
        with_refs: ["Gen 22:7", "Gen 22:8"]
        relation: divergence
        note: "Who speaks, and what the son knows. Gen: Isaac does not know. He asks hinnēh hā-ʾēš wə-hā-ʿēṣîm wə-ʾayyēh ha-śśeh lə-ʿōlâ, and Abraham gives the veiled answer ʾĕlōhîm yirʾeh-lô ha-śśeh ... bənî. Q: the father tells him openly and asks his view, fa-nẓur mādhā tarā, and the son consents, yā-abati fʿal mā tuʾmaru sa-tajidunī in shāʾa llāhu mina ṣ-ṣābirīn. The address pair ʾāḇî / bənî matches yā-abati / yā-bunayya. Isaac's silence becomes the son's active submission."
      - with: hb-gen-22-aqedah
        motif: binding-of-son-on-altar
        refs: ["37:103"]
        with_refs: ["Gen 22:6", "Gen 22:9", "Gen 22:10"]
        relation: divergence
        note: "The act. Gen: wood laid on Isaac, fire and knife, an altar built, wa-yyaʿăqōḏ ʾeṯ-yiṣḥāq bənô wa-yyāśem ʾōṯô ʿal-ha-mmizbēaḥ mi-mmaʿal lā-ʿēṣîm, knife raised. Q: fa-lammā aslamā wa-tallahu li-l-jabīn, both 'submitted' and he laid him on his brow. No binding (ʿăqēḏâ), no altar, no wood, no fire and no three-day journey. The decisive word is the dual aslamā (both of them submitted)."
      - with: hb-gen-22-aqedah
        motif: angel-stops-sacrifice
        refs: ["37:104", "37:105"]
        with_refs: ["Gen 22:11", "Gen 22:12"]
        relation: divergence
        note: "Who stops it, and why. Gen: wa-yyiqrāʾ ʾēlâw malʾaḵ YHWH min-ha-ššāmayim ... ʾaḇrāhām ʾaḇrāhām wa-yyōʾmer hinnēnî; ʾal-tišlaḥ yāḏəḵā ʾel-ha-nnaʿar, because Abraham fears God. Q: wa-nādaynāhu an yā-Ibrāhīmu qad ṣaddaqta r-ruʾyā. God calls in the first person plural, with no angel and no hinnēnî. The reason is that Abraham has already fulfilled the dream, not a prohibition."
      - with: hb-gen-22-aqedah
        motif: ram-substitute
        refs: ["37:107"]
        with_refs: ["Gen 22:13", "Gen 22:14"]
        relation: divergence
        note: "The substitute. Gen: Abraham looks up, sees ʾayil ʾaḥar neʾĕḥaz ba-ssəḇaḵ bə-qarnâw, and offers it ʿōlâ taḥaṯ bənô; he then names the place YHWH yirʾeh. Q: wa-fadaynāhu bi-dhibḥin ʿaẓīm. God himself ransoms (fadā) with a 'great sacrifice', the animal is unnamed, Abraham does not find it, and there is no place-name or temple-mount aetiology."
      - with: hb-gen-22-aqedah
        motif: all-nations-blessed-through-patriarch
        refs: ["37:108", "37:109", "37:113"]
        with_refs: ["Gen 22:16", "Gen 22:17", "Gen 22:18"]
        relation: divergence
        note: "The reward. Gen: bî nišbaʿtî nəʾum-YHWH ... bārēḵ ʾăḇāreḵḵā wə-harbâ ʾarbeh ʾeṯ-zarʿăḵā ... wə-yiraš zarʿăḵā ʾēṯ šaʿar ʾōyəḇâw wə-hiṯbārăḵû ḇə-zarʿăḵā kōl gôyê hā-ʾāreṣ, an oath and the unconditional blessing of the seed. Q: salāmun ʿalā Ibrāhīm ... wa-bāraknā ʿalayhi wa-ʿalā Isḥāqa wa-min dhurriyyatihimā muḥsinun wa-ẓālimun li-nafsihi mubīn. There is no oath and no conquest of enemy gates, and the offspring are explicitly mixed, some doing good and some wronging themselves."
      - with: hb-judg-11-jephthahs-daughter
        motif: son-consents-to-be-sacrificed
        refs: ["37:102"]
        with_refs: ["Judg 11:34", "Judg 11:36"]
        relation: parallel
        note: "The child's own words of consent to a sacrifice the parent is bound to: ʾāḇî pāṣîṯâ ʾeṯ-pîḵā ʾel-YHWH ʿăśēh lî kaʾăšer yāṣāʾ mip-pîḵā (my father, do to me as you have vowed) vs. yā-abati fʿal mā tuʾmar (my father, do as you are commanded). Jephthah's only child (yəḥîḏâ) is sacrificed because of a human vow, with no ransom; the Quranic son because of a divine command, and he is ransomed."
      - with: hb-gen-18-visitors-at-mamre
        motif: annunciation-of-son-and-name
        refs: ["37:112"]
        with_refs: ["Gen 18:10"]
        relation: echo
        note: "wə-hinnēh-ḇēn lə-śārâ ʾišteḵā vs. wa-basharnāhu bi-Isḥāqa nabiyyan mina ṣ-ṣāliḥīn. The announcement of Isaac's birth. In Gen it comes four chapters before the Aqedah; in Q it comes after the sacrifice, as a further reward, and calls Isaac a prophet."
      - with: hb-gen-15-covenant-between-pieces
        motif: annunciation-of-son-and-name
        refs: ["37:100", "37:101"]
        with_refs: ["Gen 15:2", "Gen 15:3", "Gen 15:4"]
        relation: echo
        note: "The childless patriarch asks and is promised a son: mah-titten-lî wə-ʾānōḵî hôlēḵ ʿărîrî ... kî ʾim-ʾăšer yēṣēʾ mi-mmēʿeyḵā vs. rabbi hab lī mina ṣ-ṣāliḥīna fa-bashsharnāhu bi-ghulāmin ḥalīm. Abram complains; Abraham in Q prays for a righteous son."
  - unit: quran-37-moses-aaron-elias
    checked: [hb-ps-86-none-like-you, hb-ps-78-history, hb-judg-3-othniel, hb-judg-2-bochim-cycle, hb-2kgs-13-jehoahaz-elisha-death, hb-1kgs-18-carmel, hb-exod-14-crossing-of-the-sea, hb-exod-32-golden-calf]
    matches:
      - with: hb-1kgs-18-carmel
        motif: elias-against-baal
        refs: ["37:124", "37:125", "37:126"]
        with_refs: ["1Kgs 18:21", "1Kgs 18:36"]
        relation: divergence
        note: "The challenge to Baal. Kings: ʿaḏ-māṯay ʾattem pōsəḥîm ʿal-šətê ha-ssəʿippîm ʾim-YHWH hā-ʾĕlōhîm ləḵû ʾaḥărâw wə-ʾim-ha-bbaʿal ləḵû ʾaḥărâw, and Elijah prays to YHWH ʾĕlōhê ʾaḇrāhām yiṣḥāq wə-yiśrāʾēl ... ʾattâ ʾĕlōhîm bə-yiśrāʾēl. Q: a-tadʿūna baʿlan wa-tadharūna aḥsana l-khāliqīna llāha rabbakum wa-rabba ābāʾikumu l-awwalīn. The God of the three named patriarchs and 'God in Israel' becomes 'your Lord and the Lord of your first forefathers' and 'the best of creators'. No people or patriarch is named."
      - with: hb-1kgs-18-carmel
        motif: lone-prophet-against-hundreds
        refs: ["37:127", "37:128"]
        with_refs: ["1Kgs 18:22", "1Kgs 18:39", "1Kgs 18:40"]
        relation: divergence
        note: "Outcome reversed and the contest left out. Kings: ʾănî nôṯartî nāḇîʾ la-YHWH ləḇaddî against 450 prophets of Baal, then fire from heaven, the people fall on their faces crying YHWH hûʾ hā-ʾĕlōhîm, and Elijah slaughters the Baal prophets at the Kishon (wa-yyišḥāṭēm šām). Q: fa-kadhdhabūhu fa-innahum la-muḥḍarūna illā ʿibāda llāhi l-mukhlaṣīn. There is no contest, no fire and no massacre; the people reject him, and the punishment is left to God at the judgment."
      - with: hb-judg-2-bochim-cycle
        motif: baal-and-ashtaroth-worship
        refs: ["37:125", "37:126"]
        with_refs: ["Judg 2:11", "Judg 2:12", "Judg 2:13"]
        relation: parallel
        note: "wa-yyaʿazḇû ʾeṯ-YHWH ʾĕlōhê ʾăḇôṯām ... wa-yyaʿaḇḏû la-bbaʿal wə-lā-ʿaštārôṯ vs. a-tadʿūna baʿlan wa-tadharūna ... rabba ābāʾikumu l-awwalīn: forsaking (ʿāzaḇ / wadhara) the God of the fathers for Baal. The Quran names only Baʿl, singular."
      - with: hb-judg-3-othniel
        motif: baal-and-ashtaroth-worship
        refs: ["37:125"]
        with_refs: ["Judg 3:7"]
        relation: echo
        note: "wa-yyiškəḥû ʾeṯ-YHWH ʾĕlōhêhem wa-yyaʿaḇḏû ʾeṯ-ha-bbəʿālîm wə-ʾeṯ-hā-ʾăšērôṯ vs. a-tadʿūna baʿlan wa-tadharūna aḥsana l-khāliqīn."
      - with: hb-ps-86-none-like-you
        motif: elias-against-baal
        refs: ["37:125"]
        with_refs: ["Ps 86:8"]
        relation: echo
        note: "ʾên-kāmôḵā ḇā-ʾĕlōhîm ʾăḏōnāy wə-ʾên kə-maʿăśeyḵā vs. aḥsana l-khāliqīn: God compared with other 'gods' or 'creators' and found beyond them. The comparative idiom allows that other makers or gods exist."
      - with: hb-exod-14-crossing-of-the-sea
        motif: pursuers-drowned-in-sea
        refs: ["37:115", "37:116"]
        with_refs: ["Exod 14:30", "Exod 14:31"]
        relation: divergence
        note: "wa-yyôšaʿ YHWH ba-yyôm ha-hûʾ ʾeṯ-yiśrāʾēl ... wa-yyaʾămînû ba-YHWH û-ḇə-mōšeh ʿaḇdô vs. wa-najjaynāhumā wa-qawmahumā mina l-karbi l-ʿaẓīmi wa-naṣarnāhum fa-kānū humu l-ghālibīn. The deliverance is credited to Moses and Aaron jointly (dual -humā). In Exodus Moses alone is named as God's servant."
      - with: hb-exod-32-golden-calf
        motif: peace-upon-prophet-refrain
        refs: ["37:117", "37:120", "37:122"]
        with_refs: ["Exod 32:4"]
        relation: divergence
        note: "Aaron's standing. Exod: wa-yyiqqaḥ mi-yyāḏām wa-yyāṣar ʾōṯô ba-ḥereṭ wa-yyaʿăśēhû ʿēḡel massēḵâ, Aaron makes the calf. Q: wa-ātaynāhumā l-kitāba l-mustabīn ... salāmun ʿalā Mūsā wa-Hārūna ... innahumā min ʿibādinā l-muʾminīn. Aaron shares the Book and the blessing and is called a believer. Nothing of the calf is attached to him here."
  - unit: quran-37-lot-and-jonah
    checked: [hb-jonah-1-flight-and-storm, hb-jonah-2-in-the-fish, hb-jonah-4-qiqayon, hb-jonah-3-nineveh-repents, hb-jer-15-confession-words-eaten, hb-ezek-3-watchman-and-muteness, hb-gen-19-sodom-destroyed]
    matches:
      - with: hb-gen-19-sodom-destroyed
        motif: wife-turned-to-pillar-of-salt
        refs: ["37:134", "37:135", "37:136"]
        with_refs: ["Gen 19:16", "Gen 19:26"]
        relation: divergence
        note: "Lot's wife. Gen: she leaves with him, looks back against the order, and is turned to salt: wa-ttabbēṭ ʾištô mē-ʾaḥărâw wa-ttəhî nəṣîḇ melaḥ. Q: idh najjaynāhu wa-ahlahu ajmaʿīna illā ʿajūzan fī l-ghābirīn. An unnamed 'old woman' who 'stayed behind' among the doomed: no look back, no salt, and no wife named. Lot is also called min al-mursalīn (a messenger), a title Gen never gives him."
      - with: hb-jonah-1-flight-and-storm
        motif: jonah-runaway-to-laden-ship
        refs: ["37:139", "37:140"]
        with_refs: ["Jonah 1:2", "Jonah 1:3"]
        relation: divergence
        note: "The flight. Jonah: wa-yyāqom yônâ liḇrōaḥ taršîšâ mi-lləp̄nê YHWH ... wa-yyittēn śəḵārāh. A named destination (Tarshish), a fare paid, fleeing 'from before YHWH'. Q: idh abaqa ilā l-fulki l-mashḥūn, a runaway slave (abaqa) fleeing his master. The prophet's title comes first (wa-inna Yūnusa la-mina l-mursalīn), and there is no commission to Nineveh before the flight; the mission comes only after the fish (37:147)."
      - with: hb-jonah-1-flight-and-storm
        motif: lots-cast-to-find-culprit-of-storm
        refs: ["37:141"]
        with_refs: ["Jonah 1:7", "Jonah 1:12"]
        relation: divergence
        note: "wa-yyappilû gôrālôṯ wa-yyippōl ha-ggôrāl ʿal-yônâ ... śāʾûnî wa-haṭîlunî ʾel-ha-yyām vs. fa-sāhama fa-kāna mina l-mudḥaḍīn. In Jonah the sailors cast lots and Jonah volunteers to be thrown in; in the Quran Jonah himself takes part in the lot (sāhama) and loses. The storm, the sailors' prayers and their conversion are left out."
      - with: hb-jonah-2-in-the-fish
        motif: prayer-from-belly-of-fish
        refs: ["37:142", "37:143", "37:144"]
        with_refs: ["Jonah 2:1", "Jonah 2:2", "Jonah 2:3"]
        relation: divergence
        note: "In the fish. Jonah: wa-yman YHWH dāḡ gāḏôl liḇlōaʿ ʾeṯ-yônâ ... šəlōšâ yāmîm û-šəlōšâ lêlôṯ, then a full psalm (qārāʾṯî mi-ṣṣārâ lî ... mi-bbeṭen šəʾôl šiwwaʿtî). Q: fa-ltaqamahu l-ḥūtu wa-huwa mulīm, fa-law-lā annahu kāna mina l-musabbiḥīna la-labitha fī baṭnihi ilā yawmi yubʿathūn. The fish swallows him while blameworthy (mulīm). There is no three-day count, and the psalm is reduced to his being one who glorifies. The counterfactual of staying in the belly until the Resurrection has no Hebrew counterpart."
      - with: hb-jonah-2-in-the-fish
        motif: fish-vomits-prophet-onto-land
        refs: ["37:145"]
        with_refs: ["Jonah 2:11"]
        relation: parallel
        note: "wa-yyōʾmer YHWH la-ddāḡ wa-yyāqēʾ ʾeṯ-yônâ ʾel-ha-yyabbāšâ vs. fa-nabadhnāhu bi-l-ʿarāʾi wa-huwa saqīm: thrown out on land at God's command. The Quran adds that the shore is barren and that Jonah is sick."
      - with: hb-jonah-4-qiqayon
        motif: miraculous-shade-plant
        refs: ["37:146"]
        with_refs: ["Jonah 4:6", "Jonah 4:7", "Jonah 4:10"]
        relation: divergence
        note: "The plant, moved in the story and given a new function. Jonah: after Nineveh is spared, wa-yman YHWH ʾĕlōhîm qîqāyôn ... lihyôṯ ṣēl ʿal-rōʾšô, then a worm destroys it (wa-yman hā-ʾĕlōhîm tôlaʿaṯ), and God draws the lesson, ʾattâ ḥastā ʿal-ha-qqîqāyôn. Q: wa-anbatnā ʿalayhi shajaratan min yaqṭīn, right after the fish, as care for the sick prophet. There is no worm, no wind, no anger and no lesson."
      - with: hb-jonah-4-qiqayon
        motif: city-of-twelve-myriads-who-know-not-right-from-left
        refs: ["37:147"]
        with_refs: ["Jonah 4:11"]
        relation: parallel
        note: "harbēh miššətêm-ʿeśrēh ribbô ʾāḏām vs. ilā miʾati alfin aw yazīdūn: the city's size, with 'more than' on both sides. The Quran rounds 120,000 to 100,000 and does not name Nineveh, its ignorance of right and left, or its animals."
      - with: hb-jonah-3-nineveh-repents
        motif: jonahs-people-believe-and-are-spared
        refs: ["37:147", "37:148"]
        with_refs: ["Jonah 3:5", "Jonah 3:10"]
        relation: divergence
        note: "wa-yyaʾămînû ʾanšê nînəwēh bē-ʾlōhîm (Nineveh believed in God) ... wa-yyinnāḥem hā-ʾĕlōhîm ʿal-hā-rāʿâ vs. fa-āmanū fa-mattaʿnāhum ilā ḥīn. The same verb (heʾĕmîn / āmana). The Quran limits the reprieve (ilā ḥīn, for a while), leaves out the fast, the sackcloth, the king and the animals, and has no prophet resentful of God's mercy (Jonah 4:1-3) at all."
  - unit: quran-37-daughters-and-ranks
    checked: [hb-gen-6-sons-of-god, hb-ezek-20-history-of-rebellion, hb-zeph-1-day-of-wrath, hb-ezek-6-mountains-of-israel, hb-isa-6-throne-vision, hb-2kgs-19-deliverance-of-jerusalem, hb-ps-106-national-confession, hb-ps-41-considers-poor, hb-neh-9-levites-confession]
    matches:
      - with: hb-gen-6-sons-of-god
        motif: kinship-between-god-and-jinn-denied
        refs: ["37:152", "37:158", "37:159"]
        with_refs: ["Gen 6:2", "Gen 6:4"]
        relation: contrast
        note: "Divine offspring. Gen: wa-yyirʾû ḇənê-hā-ʾĕlōhîm ʾeṯ-bənôṯ hā-ʾāḏām ... yāḇōʾû bənê hā-ʾĕlōhîm ʾel-bənôṯ hā-ʾāḏām wə-yāləḏû lāhem. 'Sons of God' exist and beget with human women. Q: a-lā innahum min ifkihim la-yaqūlūna walada llāhu wa-innahum la-kādhibūn ... wa-jaʿalū baynahu wa-bayna l-jinnati nasaban ... subḥāna llāhi ʿammā yaṣifūn. Any begetting by God, or kinship (nasab) between God and the jinn, is denied as a lie. The Quran's target is Arab 'daughters of God', but the language of divine filiation is the point of contact."
      - with: hb-isa-6-throne-vision
        motif: each-angel-has-known-station
        refs: ["37:164", "37:165", "37:166"]
        with_refs: ["Isa 6:2", "Isa 6:3"]
        relation: parallel
        note: "śərāp̄îm ʿōməḏîm mi-mmaʿal lô ... wə-qārāʾ zeh ʾel-zeh wə-ʾāmar qāḏôš qāḏôš qāḏôš vs. wa-mā minnā illā lahu maqāmun maʿlūm wa-innā la-naḥnu ṣ-ṣāffūna wa-innā la-naḥnu l-musabbiḥūn: angels standing in their places and proclaiming God's holiness or glory. In Isaiah the prophet sees them; in the Quran the angels speak for themselves to deny that they are God's daughters."
      - with: hb-2kgs-19-deliverance-of-jerusalem
        motif: evil-morning-of-the-warned
        refs: ["37:176", "37:177"]
        with_refs: ["2Kgs 19:35"]
        relation: echo
        note: "wa-yyaškîmû ḇa-bbōqer wə-hinnēh ḵullām pəḡārîm mēṯîm vs. fa-idhā nazala bi-sāḥatihim fa-sāʾa ṣabāḥu l-mundharīn: the night blow of God's punishment discovered in the morning (bōqer / ṣabāḥ)."
      - with: hb-ps-106-national-confession
        motif: glory-to-lord-of-might-closing
        refs: ["37:180", "37:182"]
        with_refs: ["Ps 106:48"]
        relation: divergence
        note: "Closing doxology, with the divine title changed. Ps: bārûḵ YHWH ʾĕlōhê yiśrāʾēl min-hā-ʿôlām wə-ʿaḏ hā-ʿôlām, closing a book of the Psalter. Q: subḥāna rabbika rabbi l-ʿizzati ʿammā yaṣifūn wa-salāmun ʿalā l-mursalīna wa-l-ḥamdu li-llāhi rabbi l-ʿālamīn, closing a sura. 'God of Israel' becomes 'Lord of the worlds'. The same root ʿ-l-m serves as 'eternity' (ʿôlām) in Hebrew and 'worlds' (ʿālamīn) in Arabic."
      - with: hb-ps-41-considers-poor
        motif: glory-to-lord-of-might-closing
        refs: ["37:182"]
        with_refs: ["Ps 41:14"]
        relation: divergence
        note: "bārûḵ YHWH ʾĕlōhê yiśrāʾēl mē-hā-ʿôlām wə-ʿaḏ hā-ʿôlām ʾāmēn wə-ʾāmēn vs. wa-l-ḥamdu li-llāhi rabbi l-ʿālamīn: a section-closing blessing. The particular title (God of Israel) becomes the universal one (Lord of the worlds), with ʿôlām/ʿālamīn as the shared root."
      - with: hb-neh-9-levites-confession
        motif: glory-to-lord-of-might-closing
        refs: ["37:180"]
        with_refs: ["Neh 9:5"]
        relation: echo
        note: "wî-ḇārəḵû šēm kəḇôḏeḵā û-mərômam ʿal-kol-bərāḵâ û-ṯəhillâ (exalted above every blessing and praise) vs. subḥāna rabbika rabbi l-ʿizzati ʿammā yaṣifūn (exalted above what they ascribe): God is beyond any human description, whether praise or attribution."
  - unit: quran-38-sad-opening
    checked: [hb-zeph-1-day-of-wrath, hb-isa-30-rahab-who-sits-still, hb-deut-18-levites-prophet, hb-prov-30-agur-confession, hb-amos-2-oracle-against-israel, hb-isa-5-vineyard-and-woes, hb-amos-5-lament-day-of-yhwh]
    matches:
      - with: hb-prov-30-agur-confession
        motif: let-them-ascend-by-the-cords
        refs: ["38:10"]
        with_refs: ["Prov 30:4"]
        relation: echo
        note: "mî ʿālâ-šāmayim wa-yyērad ... mî hēqîm kol-ʾap̄sê-ʾāreṣ mah-šəmô vs. am lahum mulku s-samāwāti wa-l-arḍi wa-mā baynahumā fa-l-yartaqū fī l-asbāb: the rhetorical challenge, who rose to heaven and holds the earth? Agur means that no human did; the Quran dares the opponents to climb."
      - with: hb-amos-2-oracle-against-israel
        motif: too-late-for-escape
        refs: ["38:3"]
        with_refs: ["Amos 2:14"]
        relation: echo
        note: "wə-ʾāḇaḏ mānôs mi-qqāl wə-ḥāzāq lōʾ-yəʾammēṣ kōḥô vs. fa-nādaw wa-lāta ḥīna manāṣ: when judgment comes there is no escape. mānôs (n-w-s) and manāṣ (n-w-ṣ) sound alike and mean nearly the same, but the roots are not regular cognates; to be checked."
      - with: hb-isa-5-vineyard-and-woes
        motif: hasten-our-share-before-reckoning
        refs: ["38:16"]
        with_refs: ["Isa 5:19"]
        relation: parallel
        note: "hā-ʾōmərîm yəmahēr yāḥîšâ maʿăśēhû ləmaʿan nirʾeh vs. wa-qālū rabbanā ʿajjil lanā qiṭṭanā qabla yawmi l-ḥisāb: scoffers mockingly ask God to hurry his judgment."
      - with: hb-amos-5-lament-day-of-yhwh
        motif: hasten-our-share-before-reckoning
        refs: ["38:16"]
        with_refs: ["Amos 5:18"]
        relation: echo
        note: "hôy ha-mmiṯʾawwîm ʾeṯ-yôm YHWH ... hûʾ-ḥōšeḵ wə-lōʾ-ʾôr vs. ʿajjil lanā qiṭṭanā qabla yawmi l-ḥisāb: wishing for the Day without knowing it is darkness."
      - with: hb-isa-30-rahab-who-sits-still
        motif: chiefs-amazed-gods-made-one-god
        refs: ["38:6", "38:7"]
        with_refs: ["Isa 30:10", "Isa 30:11"]
        relation: echo
        note: "ʾăšer ʾāmərû lā-rōʾîm lōʾ ṯirʾû ... hašbîṯû mi-pp̄ānênû ʾeṯ-qəḏôš yiśrāʾēl vs. imshū wa-ṣbirū ʿalā ālihatikum ... mā samiʿnā bi-hādhā fī l-millati l-ākhira: leaders tell the people to shut out the message and keep to their own ways. Lead only."
  - unit: quran-38-david-ewe-parable
    checked: [hb-ps-51-miserere, hb-2sam-12-nathans-parable, hb-2sam-14-wise-woman-of-tekoa, hb-jer-33-branch-and-cosmic-covenant, hb-jer-12-why-wicked-prosper, hb-1kgs-22-micaiah, hb-isa-45-cyrus-the-anointed, hb-gen-18-abraham-bargains, hb-ps-148-all-creation-praises]
    matches:
      - with: hb-2sam-12-nathans-parable
        motif: juridical-parable-entraps-king
        refs: ["38:21", "38:22"]
        with_refs: ["2Sam 12:1"]
        relation: divergence
        note: "Who brings the case. Sam: wa-yyišlaḥ YHWH ʾeṯ-nāṯān ʾel-dāwiḏ, a known prophet sent by God tells a story of šənê ʾănāšîm ... ʾeḥāḏ ʿāšîr wə-ʾeḥāḏ rāʾš. Q: idh tasawwarū l-miḥrāba idh dakhalū ʿalā Dāwūda fa-faziʿa minhum, qālū lā takhaf khaṣmāni baghā baʿḍunā ʿalā baʿḍ. Two unnamed litigants climb the wall of his prayer chamber and frighten him, and present the case as their own. The prophet-mediator is gone."
      - with: hb-2sam-12-nathans-parable
        motif: ninety-nine-ewes-and-one
        refs: ["38:23"]
        with_refs: ["2Sam 12:2", "2Sam 12:3", "2Sam 12:4"]
        relation: divergence
        note: "The case itself. Sam: lə-ʿāšîr hāyâ ṣōʾn û-ḇāqār harbēh məʾōḏ wə-lā-rāš ʾên-kōl kî ʾim-kiḇśâ ʾaḥaṯ qəṭannâ ... wa-ttəhî-lô kə-ḇaṯ. The rich man takes the lamb to feed a traveller. Q: inna hādhā akhī lahu tisʿun wa-tisʿūna naʿjatan wa-liya naʿjatun wāḥidatun fa-qāla akfilnīhā wa-ʿazzanī fī l-khiṭāb. The exact number 99 against Samuel's 'very many', 'my brother' against 'two men in one city', and the claim made by force of speech, not by theft for a guest. The pathos of the lamb 'like a daughter' is gone."
      - with: hb-2sam-12-nathans-parable
        motif: royal-confession-and-pardon
        refs: ["38:24", "38:25"]
        with_refs: ["2Sam 12:5", "2Sam 12:7", "2Sam 12:13", "2Sam 12:14"]
        relation: divergence
        note: "Verdict, recognition and outcome. Sam: David burns with anger, ben-māweṯ hā-ʾîš, fourfold restitution; Nathan: ʾattâ hā-ʾîš; David: ḥāṭāʾṯî la-YHWH; pardon with a penalty, gam ha-bbēn ha-yyillôḏ ləḵā môṯ yāmûṯ, and the sword never leaves his house (12:10). Q: a calm verdict, la-qad ẓalamaka bi-suʾāli naʿjatika ilā niʿājihi; no 'you are the man'. David himself perceives (ẓanna Dāwūdu annamā fatannāhu) that it was a test, fa-staghfara rabbahu wa-kharra rākiʿan wa-anāb, and then fa-ghafarnā lahu dhālika wa-inna lahu ʿindanā la-zulfā wa-ḥusna maʾāb. Full forgiveness and honour, with no dead child and no curse on the house. The sin (Uriah, Bathsheba, 2 Sam 12:9) is never named."
      - with: hb-ps-51-miserere
        motif: david-realizes-test-repents-prostrate
        refs: ["38:24", "38:25"]
        with_refs: ["Ps 51:6"]
        relation: echo
        note: "lə-ḵā ləḇaddəḵā ḥāṭāʾṯî wə-hā-raʿ bə-ʿêneyḵā ʿāśîṯî vs. fa-staghfara rabbahu wa-kharra rākiʿan wa-anāb: David's repentance addressed to God alone. The psalm superscription names Bathsheba; the Quran names no sin."
      - with: hb-2sam-14-wise-woman-of-tekoa
        motif: david-wisdom-and-decisive-speech
        refs: ["38:20", "38:22"]
        with_refs: ["2Sam 14:17", "2Sam 14:20"]
        relation: echo
        note: "kə-malʾaḵ hā-ʾĕlōhîm kēn ʾăḏōnî ha-mmeleḵ lišmōaʿ ha-ṭṭôḇ wə-hā-rāʿ ... wa-ʾḏōnî ḥāḵām kə-ḥoḵmaṯ malʾaḵ hā-ʾĕlōhîm vs. wa-ātaynāhu l-ḥikmata wa-faṣla l-khiṭāb ... fa-ḥkum baynanā bi-l-ḥaqq: David's wisdom to hear and decide a case, which a staged lawsuit appeals to. The Tekoite's flattery becomes a divine gift in the Quran."
      - with: hb-gen-18-abraham-bargains
        motif: righteous-not-like-corrupt
        refs: ["38:28"]
        with_refs: ["Gen 18:25"]
        relation: parallel
        note: "ḥālilâ lləḵā ... ləhāmîṯ ṣaddîq ʿim-rāšāʿ wə-hāyâ ḵa-ṣṣaddîq kā-rāšāʿ ... hă-šōp̄ēṭ kol-hā-ʾāreṣ lōʾ yaʿăśeh mišpāṭ vs. am najʿalu lladhīna āmanū wa-ʿamilū ṣ-ṣāliḥāti ka-l-mufsidīna fī l-arḍi am najʿalu l-muttaqīna ka-l-fujjār: God cannot treat the righteous like the wicked. Abraham puts it to God as a challenge; in the Quran God says it himself, as a rhetorical question."
      - with: hb-isa-45-cyrus-the-anointed
        motif: creation-not-in-play
        refs: ["38:27"]
        with_refs: ["Isa 45:18"]
        relation: parallel
        note: "lōʾ-ṯōhû ḇərāʾāh lā-šeḇeṯ yəṣārāh vs. wa-mā khalaqnā s-samāʾa wa-l-arḍa wa-mā baynahumā bāṭilan: creation was not made for nothing (tōhû / bāṭil)."
      - with: hb-jer-33-branch-and-cosmic-covenant
        motif: david-made-khalifa-judge-justly
        refs: ["38:26"]
        with_refs: ["Jer 33:15"]
        relation: echo
        note: "ʾaṣmîaḥ lə-ḏāwiḏ ṣemaḥ ṣəḏāqâ wə-ʿāśâ mišpāṭ û-ṣəḏāqâ bā-ʾāreṣ vs. yā-Dāwūdu innā jaʿalnāka khalīfatan fī l-arḍi fa-ḥkum bayna n-nāsi bi-l-ḥaqq: the Davidic ruler appointed by God to do justice 'in the land/earth' (bā-ʾāreṣ / fī l-arḍ). Jeremiah promises a future Branch; the Quran addresses David himself."
      - with: hb-ps-148-all-creation-praises
        motif: mountains-and-birds-praise-with-david
        refs: ["38:18", "38:19"]
        with_refs: ["Ps 148:9", "Ps 148:10"]
        relation: echo
        note: "he-hārîm ... wə-ṣippôr kānāp̄ vs. innā sakhkharnā l-jibāla maʿahu yusabbiḥna bi-l-ʿashiyyi wa-l-ishrāq wa-ṭ-ṭayra maḥshūratan: mountains and birds join in praise (cf. Q 34:10 above)."
  - unit: quran-38-solomon-horses-throne
    checked: [hb-josh-11-hazor-northern-campaign, hb-2sam-8-davids-wars-officials, hb-1kgs-5-dominion-wisdom, hb-2chr-28-ahaz-and-the-merciful-samarians, hb-2kgs-1-ahaziah-baal-zebub, hb-2chr-18-micaiah-and-ramoth-gilead, hb-1kgs-3-gibeon-dream, hb-2chr-1-solomon-at-gibeon, hb-deut-17-courts-king]
    matches:
      - with: hb-1kgs-3-gibeon-dream
        motif: solomon-asks-unmatched-kingdom
        refs: ["38:35"]
        with_refs: ["1Kgs 3:9", "1Kgs 3:11", "1Kgs 3:12", "1Kgs 3:13"]
        relation: divergence
        note: "What Solomon asks for. Kings: he asks only lēḇ šōmēaʿ lišpōṭ ʾeṯ-ʿamməḵā, and God praises him for not asking (wə-lōʾ šāʾaltā ləḵā ʿōšer), then grants unasked ʿōšer and kāḇôḏ, ʾăšer kāmôḵā lōʾ-hāyâ ... wə-ʾaḥăreyḵā lōʾ-yāqûm kāmôḵā. Q: rabbi ghfir lī wa-hab lī mulkan lā yanbaghī li-aḥadin min baʿdī. He asks forgiveness, then asks directly for the unmatched kingdom. The incomparability 'after you' is God's gift in Kings and Solomon's own request in the Quran."
      - with: hb-2chr-1-solomon-at-gibeon
        motif: solomon-asks-unmatched-kingdom
        refs: ["38:35", "38:39"]
        with_refs: ["2Chr 1:11", "2Chr 1:12"]
        relation: divergence
        note: "wə-lōʾ šāʾaltā ʿōšer nəḵāsîm wə-ḵāḇôḏ ... wə-ʿōšer û-nəḵāsîm wə-ḵāḇôḏ ʾetten-lāḵ ʾăšer lōʾ-hāyâ ḵēn la-mməlāḵîm ʾăšer ləp̄āneyḵā wə-ʾaḥăreyḵā lōʾ yihyeh-kēn vs. wa-hab lī mulkan lā yanbaghī li-aḥadin min baʿdī ... hādhā ʿaṭāʾunā fa-mnun aw amsik bi-ghayri ḥisāb. The same 'none after you' formula; in Chronicles it rewards Solomon for not asking, in the Quran it answers his asking."
      - with: hb-1kgs-5-dominion-wisdom
        motif: royal-stables-chariot-horses
        refs: ["38:31", "38:32"]
        with_refs: ["1Kgs 5:6"]
        relation: divergence
        note: "Solomon's horses. Kings: wa-yəhî li-šlōmōh ʾarbāʿîm ʾelep̄ ʾurəwōṯ sûsîm lə-merkāḇô, listed as royal glory (and, by Deut 17:16, a forbidden multiplication). Q: idh ʿuriḍa ʿalayhi bi-l-ʿashiyyi ṣ-ṣāfinātu l-jiyādu fa-qāla innī aḥbabtu ḥubba l-khayri ʿan dhikri rabbī ḥattā tawārat bi-l-ḥijāb. The horses become a moral episode, a love of wealth that distracted him from remembering God until sunset, followed by his turning back (innahu awwāb)."
      - with: hb-deut-17-courts-king
        motif: king-not-multiply-horses-wives-gold
        refs: ["38:32", "38:33"]
        with_refs: ["Deut 17:16"]
        relation: echo
        note: "raq lōʾ-yarbeh-lô sûsîm vs. innī aḥbabtu ḥubba l-khayri ʿan dhikri rabbī ... ruddūhā ʿalayya fa-ṭafiqa masḥan bi-s-sūqi wa-l-aʿnāq: the king's horses as a danger to his devotion. Deut forbids him to multiply them; the Quranic Solomon, distracted by them, either strokes or slashes them (the sense of masḥ is disputed)."
      - with: hb-josh-11-hazor-northern-campaign
        motif: hamstring-horses-burn-chariots
        refs: ["38:33"]
        with_refs: ["Josh 11:6", "Josh 11:9"]
        relation: echo
        note: "ʾeṯ-sûsêhem təʿaqqēr wə-ʾeṯ-markəḇōṯêhem tiśrōp̄ bā-ʾēš vs. fa-ṭafiqa masḥan bi-s-sūqi wa-l-aʿnāq. Joshua hamstrings the enemy's horses at God's command; if masḥ means cutting, Solomon does it to his own horses as penance. Lead depends on the reading of masḥ."
      - with: hb-2sam-8-davids-wars-officials
        motif: hamstring-horses-burn-chariots
        refs: ["38:33"]
        with_refs: ["2Sam 8:4"]
        relation: echo
        note: "wa-yəʿaqqēr dāwiḏ ʾeṯ-kol-hā-reḵeḇ vs. masḥan bi-s-sūqi wa-l-aʿnāq: the king disabling horses through the legs (sūq). Same caveat on masḥ."
  - unit: quran-38-job
    checked: [hb-job-23-where-can-i-find-him, hb-job-24-oppression-of-poor, hb-zech-3-joshua-and-the-satan, hb-num-30-vows, hb-job-42-epilogue, hb-isa-50-servant-struck, hb-job-2-second-test-and-friends, hb-job-19-my-redeemer-lives, hb-job-1-prologue-first-test]
    matches:
      - with: hb-job-19-my-redeemer-lives
        motif: job-cries-satan-touched-me
        refs: ["38:41"]
        with_refs: ["Job 19:21"]
        relation: divergence
        note: "Who touched Job, with the same verb. Job: ḥonnunî ḥonnunî ʾattem rēʿāy kî yaḏ-ʾĕlôah nāḡəʿâ bî (the hand of God has touched me). Q: idh nādā rabbahu annī massaniya sh-shayṭānu bi-nuṣbin wa-ʿadhāb (Satan has touched me with weariness and torment). nāḡaʿ and massa both mean 'touch'. The Quranic Job puts the cause on Satan and turns to his Lord; the Hebrew Job, who never learns of the satan, puts it on God himself."
      - with: hb-job-2-second-test-and-friends
        motif: satan-as-heavenly-accuser
        refs: ["38:41"]
        with_refs: ["Job 2:7"]
        relation: parallel
        note: "wa-yyēṣēʾ ha-śśāṭān mē-ʾēṯ pənê YHWH wa-yyak ʾeṯ-ʾiyyôḇ bi-šḥîn rāʿ vs. massaniya sh-shayṭānu bi-nuṣbin wa-ʿadhāb: the satan is the agent of Job's bodily affliction. The narrator of Job knows it; in the Quran Job himself says it. There is no heavenly wager."
      - with: hb-job-23-where-can-i-find-him
        motif: job-cries-satan-touched-me
        refs: ["38:41", "38:42"]
        with_refs: ["Job 23:3", "Job 23:8", "Job 23:9"]
        relation: contrast
        note: "Calling on God. Job: mî-yittēn yāḏaʿtî wə-ʾemṣāʾēhû ... hēn qeḏem ʾehĕlōḵ wə-ʾênennû, he cannot find God to plead his case. Q: idh nādā rabbahu ... urkuḍ bi-rijlika hādhā mughtasalun bāridun wa-sharāb, he calls and is answered at once with a healing spring. There is no lawsuit and no divine silence."
      - with: hb-job-42-epilogue
        motif: fortunes-restored-twofold
        refs: ["38:43"]
        with_refs: ["Job 42:10", "Job 42:12", "Job 42:13"]
        relation: divergence
        note: "What is doubled. Job: wa-yyōsep̄ YHWH ʾeṯ-kol-ʾăšer lə-ʾiyyôḇ lə-mišneh, the herds doubled (14,000 sheep etc.), but the children are only replaced, šiḇʿānâ ḇānîm wə-šālôš bānôṯ, the same number as before. Q: wa-wahabnā lahu ahlahu wa-mithlahum maʿahum, his family given back with as many again; no herds mentioned. In Job the restoration follows his intercession for the friends (bə-hiṯpallǝlô bəʿaḏ rēʿēhû); the Quran gives no reason except raḥmatan minnā."
      - with: hb-num-30-vows
        motif: binding-vows
        refs: ["38:44"]
        with_refs: ["Num 30:3"]
        relation: parallel
        note: "ʾô-hiššāḇaʿ šəḇuʿâ ... lōʾ yaḥēl dəḇārô kə-ḵol-ha-yyōṣēʾ mip-pîw yaʿăśeh vs. wa-khudh bi-yadika ḍighthan fa-ḍrib bihi wa-lā taḥnath: an oath must not be broken. Numbers requires literal fulfilment; the Quran lets Job keep the oath through a token fulfilment (one blow with a bundle). The content of the oath is not stated in either text (cf. the exegetes' story of the wife, outside the pair)."
      - with: hb-job-1-prologue-first-test
        motif: hero-righteous
        refs: ["38:44"]
        with_refs: ["Job 1:8", "Job 1:22"]
        relation: echo
        note: "bə-ḵol-zōʾṯ lōʾ-ḥāṭāʾ ʾiyyôḇ wə-lōʾ-nāṯan tip̄lâ lēʾlōhîm vs. innā wajadnāhu ṣābiran niʿma l-ʿabdu innahu awwāb: the verdict on the patient servant. Q's ṣābir matches the prologue's Job, not the protesting Job of the dialogues; the Quran has no counterpart to chapters 3-41."
  - unit: quran-38-patriarchs-and-fates
    checked: [hb-zech-3-joshua-and-the-satan, hb-jer-23-against-prophets, hb-2chr-18-micaiah-and-ramoth-gilead, hb-isa-1-indictment-of-judah, hb-jer-33-branch-and-cosmic-covenant, hb-amos-5-lament-day-of-yhwh, hb-isa-26-song-and-resurrection, hb-deut-10-second-tablets, hb-isa-14-helel-ben-shahar]
    matches:
      - with: hb-jer-23-against-prophets
        motif: dispute-in-high-assembly
        refs: ["38:69", "38:70"]
        with_refs: ["Jer 23:18", "Jer 23:22"]
        relation: contrast
        note: "The prophet and the heavenly council. Jer: kî mî ʿāmaḏ bə-sôḏ YHWH wə-yēreʾ wə-yišmaʿ ʾeṯ-dəḇārô ... wə-ʾim-ʿāmḏû bə-sôḏî, standing in the council is the true prophet's credential. Q: mā kāna liya min ʿilmin bi-l-malaʾi l-aʿlā idh yakhtaṣimūna in yūḥā ilayya illā annamā ana nadhīrun mubīn. The prophet denies any first-hand knowledge of the council; he knows only by waḥy."
      - with: hb-2chr-18-micaiah-and-ramoth-gilead
        motif: divine-council-scene
        refs: ["38:69"]
        with_refs: ["2Chr 18:18", "2Chr 18:19", "2Chr 18:20"]
        relation: echo
        note: "wə-ḵol-ṣəḇāʾ ha-ššāmayim ʿōməḏîm ʿal-yəmînô û-śəmōʾlô ... wa-yyōʾmer zeh ʾōmēr kāḵâ wə-zeh ʾōmēr kāḵâ vs. bi-l-malaʾi l-aʿlā idh yakhtaṣimūn: the heavenly assembly in debate. Micaiah sees it; the Quranic prophet says he did not."
      - with: hb-isa-26-song-and-resurrection
        motif: paradise-gates-open
        refs: ["38:50"]
        with_refs: ["Isa 26:2"]
        relation: parallel
        note: "pitḥû šəʿārîm wə-yāḇōʾ ḡôy-ṣaddîq šōmēr ʾĕmunîm vs. jannāti ʿadnin mufattaḥatan lahumu l-abwāb: gates opened (pāṯaḥ / fattaḥa, cognate) for the righteous. Isaiah's gates are those of the strong city on earth, the Quran's those of the Gardens of Eden."
      - with: hb-deut-10-second-tablets
        motif: patriarchs-of-hands-and-vision
        refs: ["38:45", "38:46", "38:47"]
        with_refs: ["Deut 10:15"]
        relation: divergence
        note: "The chosen fathers. Deut: raq ba-ʾăḇōṯeyḵā ḥāšaq YHWH ... wa-yyiḇḥar bə-zarʿām ʾaḥărêhem bāḵem mi-kkol-hā-ʿammîm. The love of the fathers passes to the choice of their seed, Israel. Q: wa-dhkur ʿibādanā Ibrāhīma wa-Isḥāqa wa-Yaʿqūb ... wa-innahum ʿindanā la-mina l-muṣṭafayna l-akhyār, wa-dhkur Ismāʿīla wa-l-Yasaʿa wa-dhā l-kifl. The patriarchs themselves are chosen, for their 'remembrance of the abode', with no elect seed, and Ishmael stands beside them."
      - with: hb-isa-14-helel-ben-shahar
        motif: damned-groups-no-welcome
        refs: ["38:59", "38:60"]
        with_refs: ["Isa 14:9", "Isa 14:10"]
        relation: echo
        note: "šəʾôl mi-ttaḥaṯ rāḡəzâ ləḵā liqraʾṯ bôʾeḵā ... kullām yaʿănû wə-yōʾmərû ʾēleyḵā gam-ʾattâ ḥullêṯā ḵāmônû vs. hādhā fawjun muqtaḥimun maʿakum lā marḥaban bihim ... qālū bal antum lā marḥaban bikum: those already below greet the newcomers to the underworld with scorn."
  - unit: quran-38-adam-iblis
    checked: [hb-gen-2-eden-adam-woman, hb-job-33-elihu-dreams-and-angel, hb-job-10-why-did-you-make-me, hb-deut-32-song-of-moses, hb-job-34-elihu-defends-gods-justice, hb-ps-8-what-is-man, hb-ezek-28-cherub-in-eden, hb-isa-14-helel-ben-shahar, hb-job-1-prologue-first-test]
    matches:
      - with: hb-gen-2-eden-adam-woman
        motif: breath-of-life-into-nostrils
        refs: ["38:71", "38:72"]
        with_refs: ["Gen 2:7"]
        relation: divergence
        note: "wa-yyîṣer YHWH ʾĕlōhîm ʾeṯ-hā-ʾāḏām ʿāp̄ār min hā-ʾăḏāmâ wa-yyippaḥ bə-ʾappâw nišmaṯ ḥayyîm vs. innī khāliqun basharan min ṭīnin fa-idhā sawwaytuhu wa-nafakhtu fīhi min rūḥī fa-qaʿū lahu sājidīn. The same sequence of forming from earth and breathing (nāp̄aḥ / nafakha). In Gen there is no audience; in Q the act is announced to the angels, and the breath of 'my spirit' is the cue for them to prostrate."
      - with: hb-ps-8-what-is-man
        motif: angels-bow-to-adam-iblis-refuses
        refs: ["38:72", "38:73"]
        with_refs: ["Ps 8:6"]
        relation: contrast
        note: "Man's rank relative to the heavenly beings. Ps: wa-ttəḥassərēhû məʿaṭ mē-ʾĕlōhîm wə-ḵāḇôḏ wə-hāḏār təʿaṭṭərēhû, made a little lower than the ʾĕlōhîm. Q: fa-sajada l-malāʾikatu kulluhum ajmaʿūn, the angels bow down to him. The psalm's slight inferiority becomes angelic prostration."
      - with: hb-job-10-why-did-you-make-me
        motif: adam-made-by-gods-two-hands
        refs: ["38:75"]
        with_refs: ["Job 10:8", "Job 10:9"]
        relation: echo
        note: "yāḏeyḵā ʿiṣṣəḇûnî wa-yyaʿăśûnî ... kî-ḵa-ḥōmer ʿăśîṯānî vs. mā manaʿaka an tasjuda li-mā khalaqtu bi-yadayya ... wa-khalaqtahu min ṭīn: a human shaped by God's two hands (dual yāḏeyḵā / yadayya) out of clay. Job says it as a reproach; God says it as proof of Adam's dignity."
      - with: hb-ezek-28-cherub-in-eden
        motif: iblis-expelled-and-cursed
        refs: ["38:74", "38:76", "38:77"]
        with_refs: ["Ezek 28:14", "Ezek 28:16", "Ezek 28:17"]
        relation: echo
        note: "A heavenly being of fire cast out for pride. Ezek: ʾatt-kərûḇ ... bə-ṯôḵ ʾaḇnê-ʾēš hiṯhallāḵtā ... wā-ʾăḥalleləḵā mē-har ʾĕlōhîm ... gāḇah libbəḵā bə-yop̄yeḵā ... ʿal-ʾereṣ hišlaḵtîḵā. Q: illā Iblīsa stakbara ... anā khayrun minhu khalaqtanī min nārin ... fa-khruj minhā fa-innaka rajīm. Pride (gāḇah libbəḵā / istakbara), fire (ʾaḇnê-ʾēš / nār), expulsion from God's place (mē-har ʾĕlōhîm / ukhruj minhā). Ezekiel's figure is the king of Tyre; the Quran has no human king. Lead."
      - with: hb-isa-14-helel-ben-shahar
        motif: iblis-expelled-and-cursed
        refs: ["38:75", "38:77"]
        with_refs: ["Isa 14:12", "Isa 14:13", "Isa 14:14"]
        relation: echo
        note: "ʾêḵ nāp̄altā miš-šāmayim hêlēl ben-šāḥar ... ʾeʿĕleh ʿal-bāmŏṯê ʿāḇ ʾeddammeh lə-ʿelyôn vs. a-stakbarta am kunta mina l-ʿālīn ... fa-khruj minhā fa-innaka rajīm. The proud being who would be 'high' is thrown down; ʿelyôn and ʿālīn share the root ʿ-l-y. Isaiah's taunt is over the king of Babylon."
      - with: hb-job-1-prologue-first-test
        motif: devil-granted-respite-until-resurrection
        refs: ["38:79", "38:80", "38:82", "38:83"]
        with_refs: ["Job 1:12"]
        relation: echo
        note: "hinnēh ḵol-ʾăšer-lô bə-yāḏeḵā raq ʾēlâw ʾal-tišlaḥ yāḏeḵā vs. fa-innaka mina l-munẓarīn ... la-ughwiyannahum ajmaʿīna illā ʿibādaka minhumu l-mukhlaṣīn: God grants the adversary licence within a limit. In Job the licence is a single test of one man by a member of the court; in the Quran it is respite until the Day for a cursed rebel, limited by the sincere servants."
  - unit: quran-39-pure-religion
    checked: [hb-ps-139-searched-and-known, hb-job-10-why-did-you-make-me, hb-ps-119-vav-kaf, hb-gen-2-eden-adam-woman, hb-ps-104-creation-hymn, hb-exod-34-thirteen-attributes-covenant-renewal, hb-ps-2-anointed-son, hb-2sam-7-dynastic-oracle, hb-ps-78-history, hb-job-26-hymn-to-cosmic-power]
    matches:
      - with: hb-ps-139-searched-and-known
        motif: knit-together-in-mothers-womb
        refs: ["39:6"]
        with_refs: ["Ps 139:13", "Ps 139:15"]
        relation: parallel
        note: "tə-sukkēnî bə-ḇeṭen ʾimmî ... ʾăšer-ʿuśśêṯî ḇa-ssēṯer ruqqamtî bə-taḥtiyyôṯ ʾāreṣ vs. yakhluqukum fī buṭūni ummahātikum khalqan min baʿdi khalqin fī ẓulumātin thalāth: God forms the embryo stage by stage in a hidden place. The psalm's 'in secret' and 'the depths of the earth' match the Quran's 'three darknesses'."
      - with: hb-job-10-why-did-you-make-me
        motif: creation-in-womb-in-three-darknesses
        refs: ["39:6"]
        with_refs: ["Job 10:10", "Job 10:11"]
        relation: echo
        note: "hă-lōʾ ḵe-ḥālāḇ tattîḵēnî wə-ḵa-ggəḇinnâ taqpîʾēnî ʿôr û-ḇāśār talbîšēnî vs. khalqan min baʿdi khalq: the embryo made in successive stages (milk, cheese, skin, flesh, bones). Job lists the stages to protest; the Quran mentions them as a sign of the One God."
      - with: hb-gen-2-eden-adam-woman
        motif: created-from-single-soul-and-its-mate
        refs: ["39:6"]
        with_refs: ["Gen 2:21", "Gen 2:22"]
        relation: divergence
        note: "wa-yyappēl ... tardēmâ ʿal-hā-ʾāḏām ... wa-yyiqqaḥ ʾaḥaṯ mi-ṣṣalʿōṯâw ... wa-yyiḇen ... ʾeṯ-ha-ṣṣēlāʿ ... lə-ʾiššâ vs. khalaqakum min nafsin wāḥidatin thumma jaʿala minhā zawjahā. The mate comes from the one soul with no sleep, no rib and no building. Only 'from it' (minhā) recalls Gen's 'from the man'."
      - with: hb-ps-2-anointed-son
        motif: if-god-wanted-a-son-he-would-choose
        refs: ["39:4"]
        with_refs: ["Ps 2:7"]
