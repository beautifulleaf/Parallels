        note: "yāmay kə-ṣēl nāṭûy wa-ʾănî kā-ʿēśeḇ ʾîḇāš vs. fa-tarāhu muṣfarran: withering grass as a figure for a life fading."
      - with: hb-job-4-eliphaz-vision
