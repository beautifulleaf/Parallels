        note: "A ruler-prophet marries a subordinate's wife. David: wa-yyaʾaspāh ʾel-bêṯô wa-ttəhî-lô lə-ʾiššâ ... wa-yyēraʿ ha-ddāḇār ʾăšer-ʿāśâ ḏāwiḏ bə-ʿênê YHWH, after adultery and murder. Muhammad: fa-lammā qaḍā zaydun minhā waṭaran zawwajnākahā ... mā kāna ʿalā n-nabiyyi min ḥarajin fīmā faraḍa llāhu lahu, after a divorce and by God's decree. The textual contrast is real; that the Quran answers 2 Sam is not shown (polemical pairing per the unit hint)."
      - with: hb-hos-1-gomer-children
        motif: zayd-and-zaynab-marriage
        refs: ["33:37"]
        with_refs: ["Hos 1:2"]
