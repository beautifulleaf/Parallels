      - with: hb-2sam-21-giants-of-gath
        motif: prophet-as-witness-bearer-of-tidings-warner
        refs: ["33:46"]
        with_refs: ["2Sam 21:17"]
        relation: echo
        note: "The leader as lamp: wə-lōʾ ṯəḵabbeh ʾeṯ-nēr yiśrāʾēl (David, the lamp of Israel) vs. wa-dāʿiyan ilā llāhi bi-idhnihi wa-sirājan munīrā (the prophet a shining lamp)."
      - with: hb-ezek-3-watchman-and-muteness
        motif: prophet-as-witness-bearer-of-tidings-warner
        refs: ["33:45"]
        with_refs: ["Ezek 3:17"]
        relation: echo
        note: "ṣōp̄eh nəṯattîḵā lə-ḇêṯ yiśrāʾēl ... wə-hizhartā ʾôṯām mimmennî vs. innā arsalnāka shāhidan wa-mubashshiran wa-nadhīrā: the prophet set as watcher or witness and as warner (hizhîr / nadhīr). Ezekiel is sent to the house of Israel only."
  - unit: quran-33-marriage-rules
    checked: [hb-deut-17-courts-king, hb-2chr-9-queen-of-sheba-and-solomons-glory, hb-2chr-1-solomon-at-gibeon, hb-2kgs-4-shunammite, hb-jer-3-return-faithless-wife, hb-jer-42-43-flight-to-egypt, hb-deut-24-divorce-pledges-poor, hb-2sam-20-sheba-revolt, hb-gen-38-judah-tamar, hb-gen-24-bride-for-isaac, hb-1kgs-11-solomons-wives]
    matches:
      - with: hb-deut-17-courts-king
        motif: king-not-multiply-horses-wives-gold
        refs: ["33:50", "33:52"]
        with_refs: ["Deut 17:17"]
        relation: divergence
        note: "A limit on the leader's wives. Deut: wə-lōʾ yarbeh-lô nāšîm wə-lōʾ yāsûr ləḇāḇô, a general cap on number, for fear his heart turns. Q: first an enumerated permission (innā aḥlalnā laka azwājaka ... khāliṣatan laka min dūni l-muʾminīn), then a freeze: lā yaḥillu laka n-nisāʾu min baʿdu wa-lā an tabaddala bihinna min azwājin wa-law aʿjabaka ḥusnuhunna. Deut does not let the number grow; the Quran grants a special privilege and then closes it."
      - with: hb-1kgs-11-solomons-wives
        motif: king-not-multiply-horses-wives-gold
        refs: ["33:52"]
        with_refs: ["1Kgs 11:3"]
        relation: contrast
        note: "wa-yəhî-lô nāšîm śārôṯ šəḇaʿ mēʾôṯ û-p̄ilaḡšîm šəlōš mēʾôṯ wa-yyaṭṭû nāšâw ʾeṯ-libbô vs. lā yaḥillu laka n-nisāʾu min baʿdu ... wa-law aʿjabaka ḥusnuhunna: the king's unlimited harem that turns his heart, against the prophet's harem closed by decree."
      - with: hb-2sam-20-sheba-revolt
        motif: prophets-wives-mothers-of-believers
        refs: ["33:53"]
        with_refs: ["2Sam 20:3"]
        relation: echo
        note: "wa-yyittənēm bêṯ-mišmereṯ ... wa-ʾălêhem lōʾ-ḇāʾ wa-ttihyênâ ṣərurôṯ ʿaḏ-yôm mutān ʾalmənûṯ ḥayyûṯ (shut up till death in a living widowhood) vs. wa-mā kāna lakum ... an tankiḥū azwājahu min baʿdihi abadā. The leader's women are withdrawn from any other man for life. In Samuel it follows Absalom's violation; in the Quran it is a permanent rule. The rabbinic ban on a king's widow remarrying is later (cf. only)."
      - with: hb-deut-24-divorce-pledges-poor
        motif: divorce-before-consummation-no-waiting
        refs: ["33:49"]
        with_refs: ["Deut 24:1"]
        relation: divergence
        note: "Sending the wife away. Deut: wə-ḵāṯaḇ lāh sēp̄er kərîṯuṯ wə-nāṯan bə-yāḏāh wə-šilləḥāh mi-bbêṯô (a written bill). Q: fa-mattiʿūhunna wa-sarriḥūhunna sarāḥan jamīlā (a gift and a gracious release, with no ʿidda before consummation). šillaḥ and sarraḥa both mean 'send off'; the document of Deut becomes a gift (mutʿa) in Q."
      - with: hb-gen-38-judah-tamar
        motif: women-draw-cloaks-to-be-recognized
        refs: ["33:59"]
        with_refs: ["Gen 38:14", "Gen 38:15"]
        relation: contrast
        note: "What a covering signals. Gen: wa-ttəḵas ba-ṣṣāʿîp̄ ... wa-yyaḥšəḇehā lə-zônâ kî ḵissəṯâ pānêhā. The veiled woman is taken for a harlot. Q: yudnīna ʿalayhinna min jalābībihinna dhālika adnā an yuʿrafna fa-lā yuʾdhayna. The cloak marks the believing (free) woman and protects her. The meaning of the covering is reversed."
      - with: hb-gen-24-bride-for-isaac
        motif: women-draw-cloaks-to-be-recognized
        refs: ["33:59"]
        with_refs: ["Gen 24:65"]
        relation: echo
        note: "wa-ttiqqaḥ ha-ṣṣāʿîp̄ wa-ttiṯkās (Rebekah covers herself before the man) vs. yudnīna ʿalayhinna min jalābībihinna: a woman covering herself before unrelated men as modesty."
  - unit: quran-33-hour-and-trust
    checked: [hb-num-12-miriam-aaron, hb-deut-32-song-of-moses, hb-jer-23-against-prophets, hb-ps-44-national-lament, hb-mic-6-covenant-lawsuit, hb-isa-3-collapse-and-daughters-of-zion]
    matches:
      - with: hb-num-12-miriam-aaron
        motif: moses-cleared-of-slander
        refs: ["33:69"]
        with_refs: ["Num 12:1", "Num 12:7", "Num 12:8"]
        relation: divergence
        note: "Moses spoken against and vindicated by God. Num: wa-ttəḏabbēr miryām wə-ʾahărōn bə-mōšeh ʿal-ʾōḏôṯ hā-ʾiššâ ha-kkušîṯ ... lōʾ-ḵēn ʿaḇdî mōšeh bə-ḵol-bêṯî neʾĕmān hûʾ ... û-maddûaʿ lōʾ yəʾreṯem ləḏabbēr bə-ʿaḇdî. Q: lā takūnū ka-lladhīna ādhaw Mūsā fa-barraʾahu llāhu mimmā qālū wa-kāna ʿinda llāhi wajīhā. The Quran names neither the accusers (in Num, Moses' own siblings Miriam and Aaron) nor the content (the Cushite wife), keeping only the pattern of hurt and divine acquittal, applied as a warning to the believers who hurt Muhammad."
      - with: hb-deut-32-song-of-moses
        motif: trust-offered-to-heavens-earth-mountains
        refs: ["33:72"]
        with_refs: ["Deut 32:1"]
        relation: echo
        note: "haʾăzînû ha-ššāmayim wa-ʾăḏabbērâ wə-ṯišmaʿ hā-ʾāreṣ vs. innā ʿaraḍnā l-amānata ʿalā s-samāwāti wa-l-arḍi wa-l-jibāl. Heaven and earth are addressed about the covenant. In Deut they are witnesses to what Israel accepted; in Q they are offered the burden and refuse it (fa-abayna an yaḥmilnahā), and man takes it on."
      - with: hb-mic-6-covenant-lawsuit
        motif: trust-offered-to-heavens-earth-mountains
        refs: ["33:72"]
        with_refs: ["Mic 6:1", "Mic 6:2"]
        relation: echo
        note: "šimʿû hārîm ʾeṯ-rîḇ YHWH wə-hā-ʾēṯānîm mōsḏê ʾāreṣ vs. ʿalā s-samāwāti wa-l-arḍi wa-l-jibāl: the mountains and the foundations of the earth as parties to God's dealings with humans, as hearers in Micah and as those who refuse the amāna in the Quran."
      - with: hb-isa-3-collapse-and-daughters-of-zion
        motif: followers-blame-leaders-in-hell
        refs: ["33:67"]
        with_refs: ["Isa 3:12"]
        relation: echo
        note: "ʿammî məʾaššəreyḵā matʿîm wə-ḏereḵ ʾōrḥōṯeyḵā billēʿû (your guides mislead you and swallow the way of your paths) vs. rabbanā innā aṭaʿnā sādatanā wa-kubarāʾanā fa-aḍallūnā s-sabīlā. Isaiah accuses the leaders now; in Q the misled followers accuse them in hell and ask a double punishment for them (33:68)."
