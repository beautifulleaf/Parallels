      - with: hb-jer-52-historical-appendix
        motif: bronze-sea-on-twelve-oxen
        refs: ["34:13"]
        with_refs: ["Jer 52:17", "Jer 52:20"]
        relation: echo
        note: "ha-yyām ʾeḥāḏ wə-ha-bbāqār šənêm-ʿāśār nəḥōšeṯ ... ʾăšer ʿāśâ ha-mmeleḵ šəlōmōh ... lōʾ-hāyâ mišqāl li-nḥuštām vs. ʿayna l-qiṭr ... jifānin ka-l-jawāb: Solomon's bronze too much to weigh, and a spring of it in Q."
      - with: hb-1kgs-11-jeroboam-ahijah
        motif: solomons-death-revealed-by-worm-eating-staff
        refs: ["34:14"]
        with_refs: ["1Kgs 11:43"]
        relation: divergence
        note: "Solomon's death. 1 Kgs: wa-yyiškaḇ šəlōmōh ʿim-ʾăḇōṯâw wa-yyiqqāḇēr bə-ʿîr dāwiḏ, a plain death, burial and succession (after his apostasy and the tearing of the kingdom, 11:11). Q: fa-lammā qaḍaynā ʿalayhi l-mawta mā dallahum ʿalā mawtihi illā dābbatu l-arḍi taʾkulu minsaʾatahu. He dies standing on his staff and the jinn go on working, unaware, until a creature gnaws it through. The Quran's ending says nothing of judgment on Solomon and turns the death into a proof that the jinn do not know the unseen."
  - unit: quran-34-sheba
    checked: [hb-gen-2-eden-adam-woman, hb-ezek-47-temple-river, hb-ezek-47-48-land-division, hb-gen-13-abram-lot-separate, hb-ps-78-history, hb-isa-34-edom-and-lilith, hb-ps-107-four-rescues, hb-isa-5-vineyard-and-woes]
