        note: "wā-ʾettənâ ṣəmîḏîm ʿal-yāḏayiḵ ... wa-ttaʿdî zāhāḇ wā-ḵesep̄ û-malbûšēḵ šēš wā-mešî vs. yuḥallawna fīhā min asāwira min dhahabin wa-luʾluʾan wa-libāsuhum fīhā ḥarīr: God adorns his own with bracelets, gold and fine silk. In Ezekiel the adorned bride later prostitutes her finery (16:15-17); in the Quran it is the final reward of the heirs of the Book."
      - with: hb-isa-65-new-heavens-new-earth
