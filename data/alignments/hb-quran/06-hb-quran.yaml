  - unit: quran-35-originator
    checked: [hb-ps-139-searched-and-known, hb-exod-32-tablets-broken-levites, hb-ezek-10-cherubim-and-wheels, hb-ps-104-creation-hymn, hb-job-12-ask-the-beasts, hb-job-38-whirlwind-creation, hb-ezek-47-temple-river, hb-ps-115-not-to-us, hb-exod-32-golden-calf]
    matches:
      - with: hb-ezek-10-cherubim-and-wheels
        motif: four-faced-cherubim
        refs: ["35:1"]
        with_refs: ["Ezek 10:21"]
        relation: divergence
        note: "Winged heavenly beings. Ezek: ʾarbāʿâ ʾarbāʿâ p̄ānîm lə-ʾeḥāḏ wə-ʾarbaʿ kənāp̄ayim lə-ʾeḥāḏ, fixed throne-bearers each with four faces and four wings. Q: jāʿili l-malāʾikati rusulan ulī ajniḥatin mathnā wa-thulātha wa-rubāʿa yazīdu fī l-khalqi mā yashāʾ. The angels are messengers, their wings vary (two, three, four), they have no faces, and God adds as he wills."
      - with: hb-ps-104-creation-hymn
        motif: winds-as-angels-fire-as-ministers
        refs: ["35:1", "35:9"]
        with_refs: ["Ps 104:4"]
        relation: echo
        note: "ʿōśeh malʾāḵâw rûḥôṯ məšārəṯâw ʾēš lōhēṭ vs. jāʿili l-malāʾikati rusulan (35:1) and arsala r-riyāḥa (35:9). Both make (ʿōśeh / jāʿil) heavenly envoys: malʾāḵ and malak are the same word and both mean 'one sent', which the Quran repeats with rusulan."
      - with: hb-job-12-ask-the-beasts
        motif: god-opens-and-none-can-shut
        refs: ["35:2"]
        with_refs: ["Job 12:14", "Job 12:15"]
        relation: parallel
        note: "hēn yahărôs wə-lōʾ yibbāneh yisgōr ʿal-ʾîš wə-lōʾ yippāṯēaḥ / hēn yaʿṣōr ba-mmayim ... wî-šalləḥēm vs. mā yaftaḥi llāhu li-n-nāsi min raḥmatin fa-lā mumsika lahā wa-mā yumsik fa-lā mursila lahu min baʿdihi. Opening and shutting, holding back and sending: God's acts cannot be reversed. pāṯaḥ/fataḥa and šillaḥ/arsala correspond. Job states it of destruction; the Quran of mercy."
      - with: hb-ps-139-searched-and-known
        motif: lifespan-written-in-book
        refs: ["35:11"]
        with_refs: ["Ps 139:13", "Ps 139:15", "Ps 139:16"]
        relation: parallel
        note: "tə-sukkēnî bə-ḇeṭen ʾimmî ... gālmî rāʾû ʿêneyḵā wə-ʿal-sip̄rəḵā kullām yikkāṯēḇû yāmîm yuṣṣārû vs. wa-mā taḥmilu min unthā wa-lā taḍaʿu illā bi-ʿilmihi wa-mā yuʿammaru min muʿammarin wa-lā yunqaṣu min ʿumurihi illā fī kitāb. God knows the gestation and has the days of life written in his book (sēp̄er / kitāb)."
      - with: hb-exod-32-tablets-broken-levites
        motif: lifespan-written-in-book
        refs: ["35:11"]
        with_refs: ["Exod 32:32", "Exod 32:33"]
        relation: echo
        note: "məḥēnî nāʾ mi-ssip̄rəḵā ʾăšer kāṯāḇtā ... mî ʾăšer ḥāṭāʾ-lî ʾemḥennû mi-ssip̄rî vs. illā fī kitāb: God's book of the living. In Exodus a name can be blotted out for sin; in the Quran the length of each life is fixed in the book."
      - with: hb-exod-32-golden-calf
        motif: god-can-replace-humanity-with-new-creation
        refs: ["35:16", "35:17"]
        with_refs: ["Exod 32:10"]
        relation: echo
        note: "wə-yiḥar-ʾappî ḇāhem wa-ʾăḵallēm wə-ʾeʿĕśeh ʾôṯəḵā lə-ḡôy gāḏôl vs. in yashaʾ yudhhibkum wa-yaʾti bi-khalqin jadīdin wa-mā dhālika ʿalā llāhi bi-ʿazīz: God can do away with a people and start again. In Exodus it is a concrete threat to Israel, turned aside by Moses; in the Quran a general statement about humankind (yā-ayyuhā n-nās, 35:15)."
      - with: hb-ezek-47-temple-river
        motif: two-seas-sweet-and-salt-with-barrier
        refs: ["35:12"]
        with_refs: ["Ezek 47:8", "Ezek 47:9", "Ezek 47:11"]
        relation: divergence
        note: "Fresh and salt water. Ezek: the temple river flows into the salt sea wə-nirpûʾ ha-mmayim, the sea is healed and full of fish, only its marshes stay lə-melaḥ nittānû. Q: wa-mā yastawī l-baḥrāni hādhā ʿadhbun furātun ... wa-hādhā milḥun ujāj, the two waters stay different, yet both give fresh meat (laḥman ṭariyyan) and ornaments. Ezekiel's eschatological sweetening is answered by a permanent distinction."
      - with: hb-ps-115-not-to-us
        motif: false-gods-own-not-a-date-skin
        refs: ["35:13", "35:14"]
        with_refs: ["Ps 115:4", "Ps 115:6"]
        relation: parallel
        note: "ʾoznayim lāhem wə-lōʾ yišmāʿû vs. in tadʿūhum lā yasmaʿū duʿāʾakum wa-law samiʿū mā stajābū lakum: the false gods cannot hear their worshippers. The Quran adds that at the Resurrection they will deny the worship (yakfurūna bi-shirkikum)."
  - unit: quran-35-not-equal
    checked: [hb-ezek-18-sour-grapes, hb-deut-24-divorce-pledges-poor, hb-jer-31-consolation-new-covenant, hb-ezek-3-watchman-and-muteness, hb-deut-18-levites-prophet, hb-isa-59-sins-separate-divine-warrior, hb-exod-34-thirteen-attributes-covenant-renewal, hb-eccl-2-one-fate-and-toil, hb-prov-1-prologue, hb-ps-111-acrostic-works]
    matches:
      - with: hb-ezek-18-sour-grapes
        motif: no-bearer-bears-anothers-burden
        refs: ["35:18"]
        with_refs: ["Ezek 18:20"]
        relation: parallel
        note: "ha-nnep̄eš ha-ḥōṭēʾṯ hîʾ ṯāmûṯ bēn lōʾ-yiśśāʾ ba-ʿăwōn hā-ʾāḇ wə-ʾāḇ lōʾ yiśśāʾ ba-ʿăwōn ha-bbēn vs. wa-lā taziru wāziratun wizra ukhrā wa-in tadʿu muthqalatun ilā ḥimlihā lā yuḥmal minhu shayʾun wa-law kāna dhā qurbā. The same image of carrying (nāśāʾ / wazara, ḥamala). Ezekiel speaks of father and son; the Quran of any near relative, even one who is asked."
      - with: hb-deut-24-divorce-pledges-poor
        motif: individual-responsibility-for-sin
        refs: ["35:18"]
        with_refs: ["Deut 24:16"]
        relation: parallel
        note: "lōʾ-yûməṯû ʾāḇôṯ ʿal-bānîm ... ʾîš bə-ḥeṭʾô yûmāṯû vs. lā taziru wāziratun wizra ukhrā. A rule of human courts in Deut becomes a principle of divine judgment in Q."
      - with: hb-jer-31-consolation-new-covenant
        motif: individual-responsibility-for-sin
        refs: ["35:18"]
        with_refs: ["Jer 31:29", "Jer 31:30"]
        relation: parallel
        note: "lōʾ-yōʾmərû ʿôḏ ʾāḇôṯ ʾāḵəlû ḇōser ... kî ʾim-ʾîš ba-ʿăwōnô yāmûṯ vs. lā taziru wāziratun wizra ukhrā. Jeremiah puts it in the days to come (ba-yyāmîm hā-hēm); the Quran states it as always true."
      - with: hb-exod-34-thirteen-attributes-covenant-renewal
        motif: sins-visited-to-third-fourth-generation
        refs: ["35:18"]
        with_refs: ["Exod 34:7"]
        relation: contrast
        note: "pōqēḏ ʿăwōn ʾāḇôṯ ʿal-bānîm wə-ʿal-bənê ḇānîm ʿal-šillēšîm wə-ʿal-ribbēʿîm vs. wa-lā taziru wāziratun wizra ukhrā ... wa-law kāna dhā qurbā. Transgenerational liability in the divine self-description stands against the Quran's flat denial that kin carry any of it (as Ezek 18 and Deut 24:16 already argue within the HB)."
      - with: hb-eccl-2-one-fate-and-toil
        motif: blind-and-seeing-not-equal
        refs: ["35:19", "35:20", "35:22"]
        with_refs: ["Eccl 2:13", "Eccl 2:14"]
        relation: divergence
        note: "Light and darkness, seeing and blind. Qohelet: yeš yiṯrôn la-ḥoḵmâ min-ha-ssiḵlûṯ kîṯrôn hā-ʾôr min-ha-ḥōšeḵ, he-ḥāḵām ʿênâw bə-rōʾšô wə-ha-kkəsîl ba-ḥōšeḵ hôlēḵ, and then wə-yāḏaʿtî ... še-miqreh ʾeḥāḏ yiqreh ʾeṯ-kullām (one fate befalls both). Q: wa-mā yastawī l-aʿmā wa-l-baṣīr wa-lā ẓ-ẓulumātu wa-lā n-nūr ... wa-mā yastawī l-aḥyāʾu wa-lā l-amwāt. The same contrast leads Qohelet to one shared end; the Quran insists the two are never equal."
      - with: hb-prov-1-prologue
        motif: only-the-learned-fear-god
        refs: ["35:28"]
        with_refs: ["Prov 1:7"]
        relation: divergence
        note: "Fear and knowledge in reverse order. Prov: yirʾaṯ YHWH rēʾšîṯ dāʿaṯ (fear is the beginning of knowledge). Q: innamā yakhshā llāha min ʿibādihi l-ʿulamāʾu (only those with knowledge fear God, after observing the colours of creation)."
      - with: hb-ps-111-acrostic-works
        motif: only-the-learned-fear-god
        refs: ["35:28"]
        with_refs: ["Ps 111:10"]
        relation: divergence
        note: "rēʾšîṯ ḥoḵmâ yirʾaṯ YHWH śēḵel ṭôḇ lə-ḵol-ʿōśêhem vs. innamā yakhshā llāha min ʿibādihi l-ʿulamāʾ: in the psalm fear comes first and yields wisdom; in the Quran knowledge of God's works (35:27-28) yields fear."
  - unit: quran-35-heirs-of-book
