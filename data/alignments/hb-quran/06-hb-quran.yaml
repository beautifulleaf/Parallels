        refs: ["34:23"]
        with_refs: ["Jer 15:1"]
        relation: echo
        note: "ʾim-yaʿămōḏ mōšeh û-šəmûʾēl ləp̄ānay ʾên nap̄šî ʾel-hā-ʿām ha-zzeh vs. wa-lā tanfaʿu sh-shafāʿatu ʿindahu illā li-man adhina lah: intercession by even the greatest is limited by God's will. Jeremiah's God refuses it for this people; the Quran allows it only by his leave."
      - with: hb-ezek-14-idols-in-heart-noah-daniel-job
