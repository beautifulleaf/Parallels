        refs: ["36:82"]
        with_refs: ["Ps 33:6", "Ps 33:9"]
        relation: parallel
        note: "kî hûʾ ʾāmar wa-yyehî hûʾ ṣiwwâ wa-yyaʿămōḏ vs. innamā amruhu idhā arāda shayʾan an yaqūla lahu kun fa-yakūn: he spoke and it was. The Quran's amr matches ṣiwwâ (command)."
      - with: hb-gen-1-creation-six-days
        motif: creation-by-word
        refs: ["36:82"]
        with_refs: ["Gen 1:3"]
        relation: parallel
        note: "wa-yyōʾmer ʾĕlōhîm yəhî ʾôr wa-yəhî-ʾôr vs. an yaqūla lahu kun fa-yakūn: the jussive 'let it be' and its fulfilment (yəhî ... wa-yəhî / kun fa-yakūn). Genesis says it of the first creation; the Quran makes it the general mode of creating, and here of re-creation."
      - with: hb-isa-44-idol-from-half-a-log
        motif: fire-from-green-tree
        refs: ["36:74", "36:80"]
        with_refs: ["Isa 44:15", "Isa 44:16", "Isa 44:17"]
        relation: echo
        note: "Wood as fuel set against false gods. Isa: wə-hāyâ lə-ʾāḏām ləḇāʿēr ... ḥeṣyô śārap̄ bəmô-ʾēš ... û-šəʾērîṯô lə-ʾēl ʿāśâ (half burned for fire, the rest made a god). Q: alladhī jaʿala lakum mina sh-shajari l-akhḍari nāran fa-idhā antum minhu tūqidūn, after wa-ttakhadhū min dūni llāhi ālihatan (36:74). Isaiah mocks the idol made from the firewood; the Quran makes the fire from wood a gift of the true God."
      - with: hb-exod-3-burning-bush
        motif: fire-from-green-tree
        refs: ["36:80"]
        with_refs: ["Exod 3:2"]
