  - unit: quran-36-ya-sin-opening
    checked: [hb-isa-6-throne-vision, hb-dan-9-prayer-seventy-weeks, hb-ezek-2-3-commission-eaten-scroll, hb-exod-24-covenant-ratification, hb-job-19-my-redeemer-lives, hb-lam-3-the-man-who-saw-affliction, hb-mal-3-book-of-remembrance, hb-dan-7-four-beasts-son-of-man]
    matches:
