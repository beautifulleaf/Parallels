        refs: ["39:21"]
        with_refs: ["Ps 90:5", "Ps 90:6"]
        relation: parallel
        note: "ba-bbōqer ka-ḥāṣîr yaḥălōp̄ ... lā-ʿereḇ yəmôlēl wə-yāḇēš vs. yukhriju bihi zarʿan mukhtalifan alwānuhu thumma yahīju fa-tarāhu muṣfarran thumma yajʿaluhu ḥuṭāman. Growth, then yellowing and withering. The psalm applies it explicitly to humans; the Quran sets it out as a lesson for 'those with minds' (dhikrā li-ulī l-albāb)."
      - with: hb-ps-103-bless-my-soul
        motif: humans-like-grass-withering
        refs: ["39:21"]
        with_refs: ["Ps 103:15", "Ps 103:16"]
        relation: echo
        note: "ʾĕnôš ke-ḥāṣîr yāmâw kə-ṣîṣ ha-śśāḏeh ken yāṣîṣ kî rûaḥ ʿāḇərâ-bô wə-ʾênennû vs. thumma yahīju fa-tarāhu muṣfarran thumma yajʿaluhu ḥuṭāmā: the life of plants as a figure for short human life."
      - with: hb-ps-102-afflicted
        motif: humans-like-grass-withering
        refs: ["39:21"]
        with_refs: ["Ps 102:12"]
