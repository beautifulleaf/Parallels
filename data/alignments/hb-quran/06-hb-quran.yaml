  - unit: quran-34-affluent-and-angels
    checked: [hb-jer-29-letter-to-exiles, hb-2kgs-9-jehu-anointed, hb-ezek-33-watchman-and-fall-news, hb-amos-5-lament-day-of-yhwh, hb-ezek-14-idols-in-heart-noah-daniel-job, hb-hos-12-jacob, hb-mic-3-rulers-and-prophets, hb-2kgs-5-naaman, hb-amos-6-woe-complacent, hb-isa-41-trial-of-the-gods]
    matches:
