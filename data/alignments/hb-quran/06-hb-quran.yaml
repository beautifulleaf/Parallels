      - with: hb-1kgs-5-hiram-cedars
        motif: demons-work-for-solomon
        refs: ["34:12", "34:14"]
        with_refs: ["1Kgs 5:27", "1Kgs 5:28", "1Kgs 5:29"]
        relation: divergence
        note: "Solomon's labour force. 1 Kgs: wa-yyaʿal ha-mmeleḵ šəlōmōh mas mi-kkol-yiśrāʾēl ... šiḇʿîm ʾelep̄ nōśēʾ sabbāl û-šəmōnîm ʾelep̄ ḥōṣēḇ bā-hār (corvée of Israelites, porters and quarrymen). Q: the labour is done by jinn, kept in al-ʿadhāb al-muhīn (humiliating toil) until his death, under threat of the blaze (nudhiqhu min ʿadhābi s-saʿīr). The human corvée that later splits the kingdom (1 Kgs 12) has no place in the Quran."
