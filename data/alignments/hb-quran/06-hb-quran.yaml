        note: "wə-rabbîm mî-yšēnê ʾaḏmaṯ-ʿāp̄ār yāqîṣû ʾēlleh lə-ḥayyê ʿôlām wə-ʾēlleh la-ḥărāp̄ôṯ lə-ḏirʾôn ʿôlām vs. man baʿathanā min marqadinā ... wa-mtāzū l-yawma ayyuhā l-mujrimūn: the dead as sleepers who wake from their resting place and are split into two groups. Daniel raises 'many'; the Quran gathers all (jamīʿun ladaynā muḥḍarūn, 36:53)."
      - with: hb-isa-26-song-and-resurrection
        motif: resurrection-of-the-dead
        refs: ["36:51", "36:52"]
