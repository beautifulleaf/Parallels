        motif: sun-runs-to-resting-place
        refs: ["36:38"]
        with_refs: ["Eccl 1:5"]
        relation: parallel
        note: "wə-zāraḥ ha-ššemeš û-ḇāʾ ha-ššāmeš wə-ʾel-məqômô šôʾēp̄ zôrēaḥ hûʾ šām vs. wa-sh-shamsu tajrī li-mustaqarrin lahā dhālika taqdīru l-ʿazīzi l-ʿalīm. The sun hurries back to its place (māqôm / mustaqarr). For Qohelet this is the weary round of hevel; for the Quran it is the decree (taqdīr) of the Mighty and is a sign (āya)."
