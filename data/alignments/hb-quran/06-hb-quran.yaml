new_motifs:
  god-opens-and-none-can-shut: {label: "What God opens no one can shut, and what he withholds no one can release", cluster: theology}
  adversary-rebuked-in-heavenly-court: {label: "The satan or the devils are rebuked and driven off in the heavenly realm", cluster: theology}
reviewed:
  - unit: quran-29-spider
    checked: [hb-job-8-bildad-first-speech, hb-isa-59-sins-separate-divine-warrior, hb-job-9-job-cannot-sue-god, hb-job-26-hymn-to-cosmic-power, hb-ps-91-shelter-of-most-high]
    matches:
      - with: hb-job-8-bildad-first-speech
        motif: trust-like-spiders-web
        refs: ["29:41"]
        with_refs: ["Job 8:14", "Job 8:15"]
        relation: parallel
        note: "Same image with cognate words: wa-inna awhana l-buyūti la-baytu l-ʿankabūt vs. ū-ḇêṯ ʿakkāḇîš mibṭaḥô ... yiššāʿēn ʿal-bêtô wə-lōʾ yaʿămōḏ (bayt/bêṯ, ʿankabūt/ʿakkāḇîš). In Job the web is the trust of 'those who forget El' and the ḥānēp̄ (8:13); in Q it is those who take awliyāʾ min dūni llāh, i.e. the frail trust becomes the protectors of polytheists."
      - with: hb-isa-59-sins-separate-divine-warrior
        motif: trust-like-spiders-web
        refs: ["29:41"]
        with_refs: ["Isa 59:5", "Isa 59:6"]
        relation: echo
        note: "qûrê ʿakkāḇîš yeʾĕrōḡû ... qûrêhem lōʾ yihyû lə-ḇeḡeḏ (they weave spider threads that will not become clothing) vs. ka-mathali l-ʿankabūti ttakhadhat baytā: Isaiah's web is the futile deeds (maʿăśêhem) of the wicked, the Quran's a house, as in Job 8:14."
  - unit: quran-29-recite-and-dispute
    checked: [hb-deut-6-shema, hb-1kgs-22-micaiah, hb-ezek-3-watchman-and-muteness, hb-jer-15-confession-words-eaten, hb-isa-29-ariel-and-sealed-book]
    matches:
      - with: hb-deut-6-shema
        motif: shema-god-is-one
        refs: ["29:46"]
        with_refs: ["Deut 6:4"]
        relation: echo
        note: "wa-ilāhunā wa-ilāhukum wāḥidun wa-naḥnu lahu muslimūn vs. šəmaʿ yiśrāʾēl YHWH ʾĕlōhênû YHWH ʾeḥāḏ. The confession of one God is turned outward: Israel's 'our God' (ʾĕlōhênû) becomes 'our God and your God', said to ahl al-kitāb as common ground in a dispute."
      - with: hb-isa-29-ariel-and-sealed-book
        motif: unlettered-prophet-did-not-read-or-write
        refs: ["29:48"]
        with_refs: ["Isa 29:11", "Isa 29:12"]
        relation: echo
        note: "wa-mā kunta tatlū min qablihi min kitābin wa-lā takhuṭṭuhu bi-yamīnika vs. wə-nittan ha-sēp̄er ʿal ʾăšer lōʾ yāḏaʿ sēp̄er ... qərāʾ nāʾ zeh wə-ʾāmar lōʾ yāḏaʿtî sēp̄er. Both speak of one who did not know writing before the book; Isaiah's is a figure of blindness to the vision, the Quran's a proof that the book is not forged (la-rtāba l-mubṭilūn). Lead only; the frequent link of Isa 29:12 to Q 96:1 iqraʾ is later literature."
  - unit: quran-29-emigrate-and-trust
    checked: [hb-ps-147-counts-the-stars, hb-job-38-whirlwind-animals, hb-eccl-6-wealth-unenjoyed, hb-ps-104-creation-hymn, hb-isa-26-song-and-resurrection, hb-job-38-whirlwind-creation, hb-ps-107-four-rescues, hb-jonah-1-flight-and-storm]
    matches:
      - with: hb-ps-147-counts-the-stars
        motif: god-feeds-wild-animals
        refs: ["29:60"]
        with_refs: ["Ps 147:9"]
        relation: parallel
        note: "wa-kaʾayyin min dābbatin lā taḥmilu rizqahā llāhu yarzuquhā wa-iyyākum vs. nôṯēn li-ḇhēmâ laḥmāh li-ḇnê ʿōrēḇ ʾăšer yiqrāʾû. The Quran draws the lesson for the emigrant believers ('and you'), who must trust (yatawakkalūn, 29:59)."
      - with: hb-job-38-whirlwind-animals
        motif: god-feeds-wild-animals
        refs: ["29:60"]
        with_refs: ["Job 38:41"]
        relation: parallel
        note: "mî yāḵîn lā-ʿōrēḇ ṣêḏô kî yəlāḏâw ʾel-ʾēl yəšawwēʿû vs. Allāhu yarzuquhā: Job asks who provides, the Quran answers it."
      - with: hb-ps-104-creation-hymn
        motif: god-feeds-wild-animals
        refs: ["29:60", "29:62"]
        with_refs: ["Ps 104:27", "Ps 104:28"]
        relation: echo
        note: "kullām ʾēleykā yəśabbērûn lāṯēṯ ʾoḵlām bə-ʿittô ... tip̄taḥ yāḏəkā yiśbəʿûn ṭôḇ vs. Allāhu yarzuquhā ... yabsuṭu r-rizqa li-man yashāʾ: the open hand of Ps 104 becomes God 'spreading' provision for whom he wills."
      - with: hb-eccl-6-wealth-unenjoyed
        motif: vanity-of-vanities
        refs: ["29:64"]
        with_refs: ["Eccl 6:12"]
        relation: divergence
        note: "Both call this life empty: wa-mā hādhihi l-ḥayātu d-dunyā illā lahwun wa-laʿib vs. mispar yəmê ḥayyê heḇlô wə-yaʿăśēm ka-ṣṣēl. Qohelet ends agnostic, mî yaggîd lā-ʾāḏām mah-yihyeh ʾaḥărâw (who will tell man what comes after him; cf. Eccl 9:5, 9:10, no reckoning in Sheol). The Quran answers: inna d-dāra l-ākhirata la-hiya l-ḥayawān, the next abode is the real life."
      - with: hb-ps-107-four-rescues
        motif: sea-peril-sincere-prayer-then-ingratitude
        refs: ["29:65", "29:66"]
        with_refs: ["Ps 107:28", "Ps 107:30", "Ps 107:31"]
        relation: divergence
        note: "Same sequence of storm, cry and rescue, with the ending reversed. Ps: wa-yiṣʿăqû ʾel-YHWH ba-ṣṣar lāhem ... wa-yanḥēm ʾel-məḥôz ḥep̄ṣām, yôḏû la-YHWH ḥasdô (they thank). Q: daʿawu llāha mukhliṣīna lahu d-dīna fa-lammā najjāhum ilā l-barri idhā hum yushrikūn (they associate partners). The psalm's thanksgiving becomes the Quran's ingratitude (li-yakfurū bi-mā ātaynāhum)."
      - with: hb-jonah-1-flight-and-storm
        motif: sea-peril-sincere-prayer-then-ingratitude
        refs: ["29:65"]
        with_refs: ["Jonah 1:5", "Jonah 1:14", "Jonah 1:16"]
        relation: contrast
        note: "Heathen sailors in a storm: in Jonah they first cry ʾîš ʾel-ʾĕlōhâw, then to YHWH, and once the sea stands still they fear YHWH, sacrifice and vow (wa-yizbəḥû zeḇaḥ la-YHWH wa-yiddərû nəḏārîm), a lasting conversion. In Q 29:65 they pray mukhliṣīna lahu d-dīn in danger and return to shirk on land. The same scene gives opposite outcomes."
  - unit: quran-30-romans
    checked: [hb-isa-15-16-oracle-on-moab, hb-amos-1-2-oracles-against-nations, hb-jer-48-oracle-moab]
    matches: []
  - unit: quran-30-signs
    checked: [hb-ps-55-dove-wings, hb-dan-6-lions-den, hb-job-33-elihu-dreams-and-angel, hb-job-10-why-did-you-make-me, hb-gen-2-eden-adam-woman, hb-ps-104-creation-hymn, hb-gen-10-table-of-nations, hb-gen-11-babel, hb-isa-26-song-and-resurrection, hb-jer-10-maker-of-all, hb-ps-135-hymn-of-election]
    matches:
      - with: hb-ps-55-dove-wings
        motif: praise-at-set-times-of-day
        refs: ["30:17", "30:18"]
        with_refs: ["Ps 55:18"]
        relation: parallel
        note: "fa-subḥāna llāhi ḥīna tumsūna wa-ḥīna tuṣbiḥūna ... wa-ʿashiyyan wa-ḥīna tuẓhirūn (evening, morning, late afternoon, noon) vs. ʿereḇ wā-ḇōqer wə-ṣohŏrayim ʾāśîḥâ wə-ʾehĕmeh (evening, morning and noon). The same order evening-morning-noon, with the Quran adding ʿashiyy: three times become four."
      - with: hb-dan-6-lions-den
        motif: praise-at-set-times-of-day
        refs: ["30:17", "30:18"]
        with_refs: ["Dan 6:11"]
        relation: echo
        note: "zimnîn təlāṯâ ḇə-yômāʾ hûʾ bāreḵ ʿal birkôhî ū-məṣallēʾ ū-môḏēʾ (Aramaic: three times a day he knelt, prayed and gave thanks) vs. subḥāna llāh at four named times. Note the shared root ṣ-l-y (məṣallēʾ / ṣalāt). Daniel's prayer faces Jerusalem; the Quran names no direction here."
      - with: hb-gen-2-eden-adam-woman
        motif: human-formed-from-earth
        refs: ["30:20"]
        with_refs: ["Gen 2:7"]
        relation: parallel
        note: "an khalaqakum min turābin thumma idhā antum basharun tantashirūn vs. wa-yyîṣer YHWH ʾĕlōhîm ʾeṯ-hā-ʾāḏām ʿāp̄ār min hā-ʾăḏāmâ. turāb = ʿāp̄ār (dust). The Quran addresses all of you (-kum), not the one ʾāḏām, and leaves out the breath of Gen 2:7b."
      - with: hb-gen-2-eden-adam-woman
        motif: spouses-created-from-your-own-selves
        refs: ["30:21"]
        with_refs: ["Gen 2:18", "Gen 2:22", "Gen 2:23", "Gen 2:24"]
        relation: divergence
        note: "Purpose of the mate: Gen ʿēzer kə-neḡdô (a help fit for him), and the woman built from the rib (ha-ṣṣēlāʿ) of the one man. Q khalaqa lakum min anfusikum azwājan li-taskunū ilayhā wa-jaʿala baynakum mawaddatan wa-raḥma. There is no rib, the mates come 'from yourselves' for all humans, and the purpose is rest (sakan) and love and mercy between them. Gen's ʿeṣem mē-ʿăṣāmay / dāḇaq bə-ʾištô is the closest point."
      - with: hb-job-10-why-did-you-make-me
        motif: human-formed-from-earth
        refs: ["30:20"]
        with_refs: ["Job 10:9"]
        relation: echo
        note: "zəḵor-nāʾ kî-ḵa-ḥōmer ʿăśîṯānî wə-ʾel-ʿāp̄ār təšîḇēnî vs. khalaqakum min turāb. Job makes the clay origin a complaint (you will return me to dust); the Quran makes it a sign (min āyātihi)."
      - with: hb-gen-11-babel
        motif: diversity-of-languages-and-colors-as-sign
        refs: ["30:22"]
        with_refs: ["Gen 11:7", "Gen 11:9"]
        relation: divergence
        note: "Origin of many languages. Gen: nāḇəlâ šām śəp̄āṯām ... kî-šām bālal YHWH śəp̄aṯ kol-hā-ʾāreṣ, a confusion imposed to stop the city. Q: wa-min āyātihi khalqu s-samāwāti wa-l-arḍi wa-khtilāfu alsinatikum wa-alwānikum, where difference of tongues (and colours) is a sign of creation set beside heaven and earth, with no hint of punishment."
      - with: hb-gen-10-table-of-nations
        motif: nations-divided-by-language
        refs: ["30:22"]
        with_refs: ["Gen 10:5"]
        relation: echo
        note: "ʾîš li-lšōnô lə-mišpəḥōṯām bə-ḡôyēhem (each by his tongue) vs. ikhtilāfu alsinatikum: Gen 10, like the Quran and unlike Gen 11, presents the many languages as a neutral fact of the spread of peoples. lāšôn/lisān are cognate."
      - with: hb-ps-104-creation-hymn
        motif: night-beasts-day-workers
        refs: ["30:23"]
        with_refs: ["Ps 104:22", "Ps 104:23"]
        relation: echo
        note: "wa-min āyātihi manāmukum bi-l-layli wa-n-nahāri wa-btighāʾukum min faḍlihi vs. yēṣēʾ ʾāḏām lə-p̄āʿŏlô wə-la-ʿăḇōḏāṯô ʿăḏê-ʿāreḇ: rest and work in the rhythm of night and day as God's ordering."
      - with: hb-jer-10-maker-of-all
        motif: lightning-fear-and-hope
        refs: ["30:24"]
        with_refs: ["Jer 10:13"]
        relation: echo
        note: "yurīkumu l-barqa khawfan wa-ṭamaʿan wa-yunazzilu mina s-samāʾi māʾan vs. bərāqîm la-mmāṭār ʿāśâ (he makes lightnings for the rain); the same in Ps 135:7. barq/bārāq are cognate. The Quran adds the human response of fear and hope."
      - with: hb-ps-135-hymn-of-election
        motif: lightning-fear-and-hope
        refs: ["30:24"]
        with_refs: ["Ps 135:7"]
        relation: echo
        note: "maʿăleh nəśiʾîm miqṣēh hā-ʾāreṣ bərāqîm la-mmāṭār ʿāśâ vs. yurīkumu l-barqa ... wa-yunazzilu mina s-samāʾi māʾan: lightning paired with rain."
      - with: hb-isa-26-song-and-resurrection
        motif: rain-revives-dead-earth
        refs: ["30:19"]
        with_refs: ["Isa 26:19"]
        relation: echo
        note: "wa-yuḥyi l-arḍa baʿda mawtihā wa-ka-dhālika tukhrajūn vs. kî ṭal ʾôrōṯ ṭallekā wā-ʾāreṣ rəp̄āʾîm tappîl: in both, water from heaven reviving the earth is the figure of the dead coming out. Isaiah's dew makes the earth give up the shades; the Quran's rain is an analogy (ka-dhālika)."
  - unit: quran-30-fitra
    checked: [hb-gen-1-creation-six-days, hb-prov-28-sayings, hb-neh-5-debt-slavery-reform, hb-ezra-9-ezras-confession, hb-hos-4-lawsuit-priests]
    matches:
      - with: hb-prov-28-sayings
        motif: usurers-wealth-goes-to-generous
        refs: ["30:39"]
        with_refs: ["Prov 28:8"]
        relation: parallel
        note: "marbeh hônô bə-nešeḵ wə-ṯarbîṯ lə-ḥônēn dallîm yiqbəṣennû vs. wa-mā ātaytum min riban li-yarbuwa fī amwāli n-nāsi fa-lā yarbū ʿinda llāh, wa-mā ātaytum min zakātin ... fa-ulāʾika humu l-muḍʿifūn. The same root r-b-y/r-b-h on both sides (tarbîṯ, marbeh / ribā, yarbū): growth by interest is illusory. Proverbs moves the usurer's wealth to the one who is kind to the poor; the Quran moves the real increase to alms given for God's face."
      - with: hb-gen-1-creation-six-days
        motif: fitra-primordial-nature
        refs: ["30:30"]
        with_refs: ["Gen 1:27"]
        relation: divergence
        note: "What God set in humans at creation. Gen: wa-yyiḇrāʾ ʾĕlōhîm ʾeṯ-hā-ʾāḏām bə-ṣalmô, a likeness to God. Q: fiṭrata llāhi llatī faṭara n-nāsa ʿalayhā lā tabdīla li-khalqi llāh, an innate pattern which is the upright religion (ad-dīn al-qayyim, ḥanīfan), with no talk of image or likeness. Lead only: a conceptual pair (as the unit's hint proposes), with no shared wording."
      - with: hb-hos-4-lawsuit-priests
        motif: land-mourns-creatures-perish
        refs: ["30:41"]
        with_refs: ["Hos 4:2", "Hos 4:3"]
        relation: parallel
        note: "ẓahara l-fasādu fī l-barri wa-l-baḥri bi-mā kasabat aydī n-nāsi li-yudhīqahum baʿḍa lladhī ʿamilū vs. ʿal-kēn teʾĕḇal hā-ʾāreṣ ... wə-ḡam dəḡê hay-yām yēʾāsēp̄û after the list of crimes (ʾālōh wə-ḵaḥēš wə-rāṣōaḥ...). Human sin damages land and sea alike. The Quran adds the purpose, laʿallahum yarjiʿūn (that they may return)."
  - unit: quran-30-winds-and-rain
    checked: [hb-isa-6-throne-vision, hb-ps-104-creation-hymn, hb-job-26-hymn-to-cosmic-power, hb-ps-18-storm-theophany, hb-job-36-elihu-storm-hymn, hb-prov-20-sayings]
    matches:
      - with: hb-isa-6-throne-vision
        motif: commission-to-harden-hearts
        refs: ["30:52", "30:53", "30:59"]
        with_refs: ["Isa 6:9", "Isa 6:10"]
        relation: divergence
        note: "Deaf ears, blind eyes, closed hearts. In Isaiah the prophet himself is sent to do it: hašmēn lēḇ hā-ʿām ha-zzeh wə-ʾoznâw hakbēd wə-ʿênâw hāšaʿ pen ... wā-šāḇ wə-rāp̄āʾ lô. In the Quran God does the sealing, ka-dhālika yaṭbaʿu llāhu ʿalā qulūbi lladhīna lā yaʿlamūn, and the prophet is told he cannot overcome it: fa-innaka lā tusmiʿu l-mawtā wa-lā tusmiʿu ṣ-ṣumma d-duʿāʾ ... wa-mā anta bi-hādi l-ʿumyi."
      - with: hb-ps-104-creation-hymn
        motif: winds-herald-mercy-pure-water
        refs: ["30:46", "30:48"]
        with_refs: ["Ps 104:3", "Ps 104:4", "Ps 104:13"]
        relation: echo
        note: "ʿōśeh malʾāḵâw rûḥôṯ (who makes the winds his messengers) ... mašqeh hārîm mē-ʿălîyyôṯâw vs. an yursila r-riyāḥa mubashshirātin ... fa-tuthīru saḥāban fa-yabsuṭuhu fī s-samāʾi: winds sent ahead as heralds, then water from the heights. arsala (sent) parallels malʾāḵ (one sent)."
      - with: hb-job-36-elihu-storm-hymn
        motif: winds-herald-mercy-pure-water
        refs: ["30:48"]
        with_refs: ["Job 37:11", "Job 37:12", "Job 37:13"]
        relation: parallel
        note: "ʾap̄-bərî yaṭrîaḥ ʿāḇ yāp̄îṣ ʿănan ʾôrô ... ʾim-lə-šēḇeṭ ʾim-lə-ʾarṣô ʾim-lə-ḥesed yamṣiʾēhû vs. fa-tuthīru saḥāban fa-yabsuṭuhu fī s-samāʾi kayfa yashāʾu ... fa-idhā aṣāba bihi man yashāʾu min ʿibādihi: God spreads the clouds and makes the rain reach whom he chooses. Job allows either rod or ḥesed; the Quran names it raḥma (30:50)."
      - with: hb-job-26-hymn-to-cosmic-power
        motif: waters-bound-in-clouds
        refs: ["30:48"]
        with_refs: ["Job 26:8"]
        relation: echo
        note: "ṣōrēr mayim bə-ʿāḇāw wə-lōʾ-niḇqaʿ ʿānān taḥtām (the cloud does not burst under the water) vs. wa-yajʿaluhu kisafan fa-tarā l-wadqa yakhruju min khilālihi (rain coming out from within the cloud fragments)."
      - with: hb-prov-20-sayings
        motif: stages-weakness-strength-weakness
        refs: ["30:54"]
        with_refs: ["Prov 20:29"]
        relation: echo
        note: "tip̄ʾereṯ baḥûrîm kōḥām wa-hăḏar zəqēnîm śêḇâ vs. min baʿdi ḍaʿfin quwwatan thumma ... min baʿdi quwwatin ḍaʿfan wa-shaybatan. Strength (kōaḥ/quwwa) belongs to youth and grey hair (śêḇâ/shayba, cognate) to age. Proverbs praises grey hair as glory; the Quran counts it as weakness returned."
  - unit: quran-31-luqman
    checked: [hb-prov-6-adultery-fire, hb-prov-1-gang-of-sinners, hb-isa-6-throne-vision, hb-exod-34-thirteen-attributes-covenant-renewal, hb-isa-40-comfort-my-people, hb-isa-63-communal-lament, hb-deut-13-enticers, hb-job-26-hymn-to-cosmic-power, hb-ps-104-creation-hymn]
    matches:
      - with: hb-prov-1-gang-of-sinners
        motif: fathers-instruction-mothers-torah
        refs: ["31:13", "31:16", "31:17"]
        with_refs: ["Prov 1:8", "Prov 1:10"]
        relation: parallel
        note: "Father-to-son wisdom address: yā-bunayya (31:13, 16, 17) vs. šəmaʿ bənî ... bənî ʾim-yəp̄attûḵā ḥaṭṭāʾîm ʾal-tōḇēʾ. Proverbs' first warning is against a gang of sinners; Luqman's first warning is lā tushrik bi-llāh, inna sh-shirka la-ẓulmun ʿaẓīm."
      - with: hb-prov-6-adultery-fire
        motif: fathers-instruction-mothers-torah
        refs: ["31:14", "31:15"]
        with_refs: ["Prov 6:20", "Prov 6:22"]
        relation: divergence
        note: "Parental authority. Prov: nəṣōr bənî miṣwaṯ ʾāḇîḵā wə-ʾal-tiṭṭōš tôraṯ ʾimmeḵā, binding without condition. Q: wa-waṣṣaynā l-insāna bi-wālidayhi ... wa-in jāhadāka ʿalā an tushrika bī ... fa-lā tuṭiʿhumā wa-ṣāḥibhumā fī d-dunyā maʿrūfan. The duty to parents is commanded by God, not by the father, and it stops where the parents urge shirk. The mother's part is grounded in pregnancy and two years of nursing (waḥnan ʿalā waḥnin wa-fiṣāluhu fī ʿāmayn), not in her tôrâ."
      - with: hb-deut-13-enticers
        motif: obey-parents-except-in-idolatry
        refs: ["31:15"]
        with_refs: ["Deut 13:7", "Deut 13:9", "Deut 13:10"]
        relation: contrast
        note: "Kin who urge other gods. Deut: kî yəsîṯəḵā ʾāḥîḵā ... ʾô-ḇinḵā ʾô-ḇittəḵā ʾô ʾēšeṯ ḥêqeḵā ... nēlḵâ wə-naʿaḇḏâ ʾĕlōhîm ʾăḥērîm: lōʾ ṯōʾḇeh lô ... wə-lōʾ-ṯāḥôs ʿênəḵā ʿālâw ... kî hārōḡ tahargennû. Q: if your parents strive to make you associate, fa-lā tuṭiʿhumā but ṣāḥibhumā fī d-dunyā maʿrūfan. One law demands death without pity, the other refusal with continued kindness. Deut's list leaves out the parents; the Quran's case is exactly the parents."
      - with: hb-isa-6-throne-vision
        motif: commission-to-harden-hearts
        refs: ["31:7"]
        with_refs: ["Isa 6:10"]
        relation: echo
        note: "Heavy ears: ka-anna fī udhunayhi waqran (as if there were heaviness in his ears) vs. wə-ʾoznâw hakbēd (make his ears heavy). In Isaiah God orders the prophet to make them heavy; in Q 31:7 the hearer turns away mustakbiran, the heaviness is only 'as if', and it is his own pride."
      - with: hb-job-26-hymn-to-cosmic-power
        motif: heavens-raised-without-pillars
        refs: ["31:10"]
        with_refs: ["Job 26:11"]
        relation: divergence
        note: "Pillars of heaven, with cognate words: ʿammûḏê šāmayim yərôp̄āp̄û (the pillars of heaven tremble at his rebuke) vs. khalaqa s-samāwāti bi-ghayri ʿamadin tarawnahā (without pillars that you see). ʿamad and ʿammûḏ are the same word. The Quran explicitly denies the visible pillars that Job's cosmos presupposes."
      - with: hb-ps-104-creation-hymn
        motif: mountains-stabilize-earth
        refs: ["31:10"]
        with_refs: ["Ps 104:5"]
        relation: echo
        note: "yāsaḏ-ʾereṣ ʿal-məḵôneyhā bal-timmôṭ ʿôlām wā-ʿeḏ (lest it totter) vs. wa-alqā fī l-arḍi rawāsiya an tamīda bikum (lest it sway with you). The earth must not shake: in Ps it rests on foundations, in Q it is held down by mountains as anchors (rawāsī)."
      - with: hb-isa-40-comfort-my-people
        motif: show-me-what-your-gods-created
        refs: ["31:11"]
        with_refs: ["Isa 40:18", "Isa 40:19", "Isa 40:20", "Isa 40:26"]
        relation: echo
        note: "Creation as the test of deity: śəʾû mārôm ʿênêḵem û-rəʾû mî-ḇārāʾ ʾēlleh, after the satire on the idol a craftsman makes (ha-ppesel nāsaḵ ḥārāš ... pesel lōʾ yimmôṭ) vs. hādhā khalqu llāhi fa-arūnī mādhā khalaqa lladhīna min dūnihi."
  - unit: quran-31-signs-and-unseen
    checked: [hb-ps-104-creation-hymn, hb-job-38-whirlwind-creation, hb-ps-107-four-rescues, hb-ezek-14-idols-in-heart-noah-daniel-job, hb-eccl-11-cast-bread-and-youth, hb-prov-27-sayings, hb-jer-44-queen-of-heaven, hb-jer-16-fishers-and-hunters, hb-job-38-whirlwind-animals]
    matches:
      - with: hb-prov-27-sayings
        motif: five-keys-of-the-unseen
        refs: ["31:34"]
        with_refs: ["Prov 27:1"]
        relation: parallel
        note: "ʾal-tiṯhallēl bə-yôm māḥār kî lōʾ-ṯēḏaʿ mah-yēleḏ yôm vs. wa-mā tadrī nafsun mādhā taksibu ghadan: no one knows what tomorrow will bring. Proverbs draws a moral against boasting; the Quran lists it among the things only God knows (ʿindahu ʿilmu s-sāʿa)."
      - with: hb-eccl-11-cast-bread-and-youth
        motif: five-keys-of-the-unseen
        refs: ["31:34"]
        with_refs: ["Eccl 11:5"]
        relation: parallel
        note: "ka-ʿăṣāmîm bə-ḇeṭen ha-mməlēʾâ kāḵâ lōʾ ṯēḏaʿ ʾeṯ-maʿăśēh hā-ʾĕlōhîm vs. wa-yaʿlamu mā fī l-arḥām: what grows in the womb is hidden from humans and known to God. Qohelet joins it to the way of the wind (ha-rûaḥ), the Quran to the Hour and the rain."
      - with: hb-job-38-whirlwind-animals
        motif: animal-gestation-known-only-to-god
        refs: ["31:34"]
        with_refs: ["Job 39:1", "Job 39:2"]
        relation: echo
        note: "hă-yāḏaʿtā ʿēṯ leḏeṯ yaʿălê-sālaʿ ... tispōr yəraḥîm təmalleʾnâ vs. wa-yaʿlamu mā fī l-arḥām: the time and content of gestation as God's knowledge only. Job uses it as a challenge to man, the Quran as a statement."
      - with: hb-ezek-14-idols-in-heart-noah-daniel-job
        motif: no-parent-avails-child-on-judgment
        refs: ["31:33"]
        with_refs: ["Ezek 14:14", "Ezek 14:16"]
        relation: parallel
        note: "lā yajzī wālidun ʿan waladihi wa-lā mawlūdun huwa jāzin ʿan wālidihi shayʾan vs. ʾim-bānîm wə-ʾim-bānôṯ yaṣṣîlû hēmmâ ləḇaddām yinnāṣēlû: even Noah, Daniel and Job would save only themselves, not sons or daughters. Ezekiel says it of a land under judgment, the Quran of the Last Day (yawm), and in both directions (child for parent too)."
      - with: hb-ps-107-four-rescues
        motif: sea-peril-sincere-prayer-then-ingratitude
        refs: ["31:32"]
        with_refs: ["Ps 107:25", "Ps 107:28", "Ps 107:31"]
        relation: divergence
        note: "wa-idhā ghashiyahum mawjun ka-ẓ-ẓulali daʿawu llāha mukhliṣīna lahu d-dīn vs. wa-ttərômēm gallâw ... wa-yiṣʿăqû ʾel-YHWH ba-ṣṣar lāhem. After the rescue Ps 107:31 has all thank (yôḏû la-YHWH ḥasdô); Q 31:32 has only some keep a middle course (fa-minhum muqtaṣid) while the treacherous (khattār kafūr) deny. Compare Q 29:65 above."
      - with: hb-ps-104-creation-hymn
        motif: sun-and-moon-run-to-appointed-term
        refs: ["31:29"]
        with_refs: ["Ps 104:19"]
        relation: echo
        note: "ʿāśâ yārēaḥ lə-môʿăḏîm šemeš yāḏaʿ məḇôʾô vs. wa-sakhkhara sh-shamsa wa-l-qamara kullun yajrī ilā ajalin musammā: sun and moon are bound to appointed times (môʿăḏîm / ajal musammā). The psalm gives the sun knowledge of its setting; the Quran makes both subjected (sakhkhara)."
      - with: hb-jer-16-fishers-and-hunters
        motif: following-ancestors-blindly
        refs: ["31:21"]
        with_refs: ["Jer 16:19"]
        relation: contrast
        note: "The appeal to ancestors, reversed. Q: bal nattabiʿu mā wajadnā ʿalayhi ābāʾanā, where the rejecters hold to their fathers' way. Jer: ʾēleyḵā gôyim yāḇōʾû ... wə-yōʾmərû ʾaḵ-šeqer nāḥălû ʾăḇôṯênû heḇel, where the nations repent and confess that their fathers inherited only lies."
      - with: hb-jer-44-queen-of-heaven
        motif: following-ancestors-blindly
        refs: ["31:21"]
        with_refs: ["Jer 44:17"]
        relation: parallel
        note: "Answer to the prophet's call: la-qaṭṭēr li-mleḵeṯ ha-ššāmayim ... kaʾăšer ʿāśînû ʾănaḥnû wa-ʾăḇōṯênû vs. bal nattabiʿu mā wajadnā ʿalayhi ābāʾanā: the fathers' cult is the defence against the prophet's word."
  - unit: quran-32-sajda
    checked: [hb-ps-90-moses-thousand-years, hb-isa-63-communal-lament, hb-gen-2-eden-adam-woman, hb-job-33-elihu-dreams-and-angel, hb-neh-9-levites-confession, hb-deut-31-joshua-torah-song, hb-gen-1-creation-six-days, hb-ps-63-thirst]
    matches:
      - with: hb-ps-90-moses-thousand-years
        motif: thousand-years-as-one-day
        refs: ["32:5"]
        with_refs: ["Ps 90:4"]
        relation: parallel
        note: "kî ʾelep̄ šānîm bə-ʿêneyḵā kə-yôm ʾeṯmôl kî yaʿăḇōr vs. fī yawmin kāna miqdāruhu alfa sanatin mimmā taʿuddūn. The psalm uses it as a lament on human brevity (vv. 5-10); the Quran uses it as the measure of the divine administration, the amr going down from heaven and rising to him (yudabbiru l-amra ... thumma yaʿruju ilayhi)."
      - with: hb-gen-1-creation-six-days
        motif: creation-in-six-days
        refs: ["32:4"]
        with_refs: ["Gen 2:1", "Gen 2:2"]
        relation: divergence
        note: "What follows the six days. Gen: wa-yəḵal ʾĕlōhîm ba-yyôm ha-ššəḇîʿî ... wa-yyišbōṯ (he ceased or rested). Q: fī sittati ayyāmin thumma stawā ʿalā l-ʿarsh. The seventh day of rest is replaced by enthronement, and no sabbath follows. Cf. the explicit response in Q 50:38."
      - with: hb-gen-2-eden-adam-woman
        motif: breath-of-life-into-nostrils
        refs: ["32:7", "32:9"]
        with_refs: ["Gen 2:7"]
        relation: parallel
        note: "wa-yyîṣer ... ʿāp̄ār min hā-ʾăḏāmâ wa-yyippaḥ bə-ʾappâw nišmaṯ ḥayyîm vs. wa-badaʾa khalqa l-insāni min ṭīnin ... thumma sawwāhu wa-nafakha fīhi min rūḥihi. nāp̄aḥ/nafakha are cognate. The Quran has clay (ṭīn) for dust, 'of his spirit' (rūḥ) for breath of life (nəšāmâ), and adds a middle stage: the descendants from a despised fluid (māʾin mahīn, 32:8)."
      - with: hb-job-33-elihu-dreams-and-angel
        motif: human-from-clay-then-despised-fluid
        refs: ["32:7", "32:9"]
        with_refs: ["Job 33:4", "Job 33:6"]
        relation: echo
        note: "rûaḥ-ʾēl ʿāśāṯnî wə-nišmaṯ šadday təḥayyēnî ... mē-ḥōmer qōraṣtî gam-ʾānî vs. min ṭīnin ... wa-nafakha fīhi min rūḥihi: clay plus the divine spirit (rûaḥ/rūḥ), said by Elihu of every human, by the Quran of the first man."
      - with: hb-job-33-elihu-dreams-and-angel
        motif: angel-of-death
        refs: ["32:11"]
        with_refs: ["Job 33:22", "Job 33:23"]
        relation: echo
        note: "wa-ttiqraḇ la-ššaḥaṯ nap̄šô wə-ḥayyāṯô la-mməmîṯîm (to the killers, i.e. death-dealing angels), beside a malʾāḵ mēlîṣ who can intercede, vs. yatawaffākum malaku l-mawti lladhī wukkila bikum. Job has unnamed 'bringers of death'; the Quran has one appointed angel of death and, in 32:4, no intercessor (wa-lā shafīʿ)."
      - with: hb-isa-63-communal-lament
        motif: hidden-delight-no-soul-knows
        refs: ["32:17"]
        with_refs: ["Isa 64:3"]
        relation: parallel
        note: "ʿayin lōʾ-rāʾāṯâ ʾĕlōhîm zûlāṯəḵā yaʿăśeh li-mḥakkēh-lô vs. fa-lā taʿlamu nafsun mā ukhfiya lahum min qurrati aʿyunin jazāʾan bi-mā kānū yaʿmalūn. Hidden from every eye, prepared for those who wait (məḥakkeh) or those who do good. In Isaiah what no eye has seen is God himself acting; the Quran makes it the 'delight of the eyes' kept in store for the believers. (cf. hadith qudsi and 1 Cor 2:9, outside this pair)"
      - with: hb-neh-9-levites-confession
        motif: torah-given-to-moses-as-guidance
        refs: ["32:23"]
        with_refs: ["Neh 9:13", "Neh 9:14"]
        relation: parallel
        note: "wa-ttittēn lāhem mišpāṭîm yəšārîm wə-ṯôrôṯ ʾĕmeṯ ... ṣiwwîṯā lāhem bə-yaḏ mōšeh ʿaḇdeḵā vs. wa-la-qad ātaynā Mūsā l-kitāba ... wa-jaʿalnāhu hudan li-banī Isrāʾīl: God gives the law to Israel through Moses."
      - with: hb-deut-31-joshua-torah-song
        motif: moses-writes-torah
        refs: ["32:23"]
        with_refs: ["Deut 31:9", "Deut 31:24"]
        relation: divergence
        note: "Who produces the book. Deut: wa-yyiḵtōḇ mōšeh ʾeṯ-ha-ttôrâ ha-zzōʾṯ ... kə-ḵallôṯ mōšeh liḵtōḇ ʾeṯ-diḇrê ha-ttôrâ ʿal-sēp̄er. Q: wa-la-qad ātaynā Mūsā l-kitāb, where God gives Moses the book and Moses is the receiver, not the writer. This matches the Quran's view of its own revelation (tanzīlu l-kitābi ... min rabbi l-ʿālamīn, 32:2)."
      - with: hb-ps-63-thirst
        motif: sides-forsake-beds-night-prayer
        refs: ["32:16"]
        with_refs: ["Ps 63:7"]
        relation: echo
        note: "ʾim-zəḵartîḵā ʿal-yəṣûʿāy bə-ʾašmurôṯ ʾehgeh-bāḵ vs. tatajāfā junūbuhum ʿani l-maḍājiʿi yadʿūna rabbahum khawfan wa-ṭamaʿan: prayer at night from or on the bed (yāṣûaʿ / maḍjaʿ)."
  - unit: quran-33-adoption-and-zihar
    checked: [hb-gen-48-ephraim-manasseh-blessing, hb-esth-2-esther-chosen, hb-exod-6-name-and-levite-genealogy, hb-jer-3-return-faithless-wife, hb-exod-34-thirteen-attributes-covenant-renewal, hb-ps-12-pure-words, hb-num-27-zelophehad-joshua]
    matches:
      - with: hb-gen-48-ephraim-manasseh-blessing
        motif: adopted-sons-not-real-sons
        refs: ["33:4", "33:5"]
        with_refs: ["Gen 48:5", "Gen 48:6"]
        relation: contrast
        note: "Gen: ʾep̄rayim û-mənaššeh kə-rəʾûḇēn wə-šimʿôn yihyû-lî. Jacob's declaration makes his grandsons into sons with full tribal inheritance, and later sons are called by the name of their brothers (ʿal šēm ʾăḥêhem yiqqārəʾû). Q: wa-mā jaʿala adʿiyāʾakum abnāʾakum dhālikum qawlukum bi-afwāhikum ... udʿūhum li-ābāʾihim. A declared son is not a son, and must be called after his real father."
      - with: hb-esth-2-esther-chosen
        motif: adopted-sons-not-real-sons
        refs: ["33:4", "33:5"]
        with_refs: ["Esth 2:7", "Esth 2:15"]
        relation: contrast
        note: "lə-qāḥāh mordŏḵay lô lə-ḇaṯ (Mordecai took her as his daughter), yet she is still named by her real father: ʾestēr baṯ-ʾăḇîḥayil dōḏ mordŏḵay (2:15). The Quran forbids treating the fosterling as a child (mā jaʿala adʿiyāʾakum abnāʾakum) but requires the same naming practice, udʿūhum li-ābāʾihim. The fosterling as 'daughter' is the point of contrast; 2:15 is the point of agreement."
      - with: hb-ps-12-pure-words
        motif: no-man-has-two-hearts
        refs: ["33:4"]
        with_refs: ["Ps 12:3"]
        relation: echo
        note: "šāwʾ yəḏabbərû ... śəp̄aṯ ḥălāqôṯ bə-lēḇ wā-lēḇ yəḏabbērû (they speak with a heart and a heart, i.e. double-heartedness) vs. mā jaʿala llāhu li-rajulin min qalbayni fī jawfihi, next to dhālikum qawlukum bi-afwāhikum (merely the words of your mouths). The Hebrew idiom of the duplicitous double heart is denied anatomically (cf. bə-lōʾ-lēḇ wā-lēḇ, 1 Chr 12:34)."
      - with: hb-num-27-zelophehad-joshua
        motif: kin-nearer-in-book-of-god
        refs: ["33:6"]
        with_refs: ["Num 27:9", "Num 27:10", "Num 27:11"]
        relation: parallel
        note: "wə-nəṯattem ʾeṯ-naḥălāṯô li-šʾērô ha-qqārōḇ ʾēlâw mi-mmišpaḥtô ... lə-ḥuqqaṯ mišpāṭ vs. wa-ulū l-arḥāmi baʿḍuhum awlā bi-baʿḍin fī kitābi llāh: inheritance goes by nearness of blood as written law. The Quran adds that it comes before the bond of faith and emigration (mina l-muʾminīna wa-l-muhājirīn)."
  - unit: quran-33-trench
    checked: [hb-exod-23-angel-and-conquest, hb-exod-14-crossing-of-the-sea, hb-ezek-7-the-end, hb-2kgs-7-lepers-relief, hb-deut-20-rules-of-war]
    matches:
      - with: hb-exod-23-angel-and-conquest
        motif: divine-terror-precedes-army
        refs: ["33:26"]
        with_refs: ["Exod 23:27"]
        relation: parallel
        note: "ʾeṯ-ʾêmāṯî ʾăšallaḥ ləp̄āneyḵā wə-hammōṯî ʾeṯ-kol-hā-ʿām vs. wa-qadhafa fī qulūbihimu r-ruʿb: God's terror (ʾêmâ / ruʿb) sent against the enemy. In Exodus it goes ahead of Israel into Canaan; in the Quran it is cast into the ahl al-kitāb who had sided with the besiegers."
      - with: hb-2kgs-7-lepers-relief
        motif: wind-and-unseen-hosts-rout-besiegers
        refs: ["33:9", "33:25"]
        with_refs: ["2Kgs 7:6", "2Kgs 7:7"]
        relation: parallel
        note: "Siege broken without battle by an unseen army: wa-ʾḏōnāy hišmîaʿ ʾeṯ-maḥănēh ʾărām qôl reḵeḇ qôl sûs qôl ḥayil gāḏôl ... wa-yyānûsû ḇa-nnešep̄ vs. fa-arsalnā ʿalayhim rīḥan wa-junūdan lam tarawhā ... wa-kafā llāhu l-muʾminīna l-qitāl. Samaria hears a phantom army; Medina's enemies are struck by real hosts that the believers cannot see."
      - with: hb-exod-14-crossing-of-the-sea
        motif: wind-and-unseen-hosts-rout-besiegers
        refs: ["33:9"]
        with_refs: ["Exod 14:21", "Exod 14:24", "Exod 14:25"]
        relation: echo
        note: "bə-rûaḥ qāḏîm ʿazzâ ... wa-yyāhom ʾēṯ maḥănēh miṣrāyim ... kî YHWH nilḥām lāhem vs. fa-arsalnā ʿalayhim rīḥan: God's wind and his own fighting against a superior army. rûaḥ / rīḥ are cognate."
      - with: hb-deut-20-rules-of-war
        motif: hypocrites-desert-saying-houses-exposed
        refs: ["33:13", "33:14"]
        with_refs: ["Deut 20:5", "Deut 20:8"]
        relation: contrast
        note: "Going home from the battle line. Deut grants it as a right: mî-hā-ʾîš ʾăšer bānâ ḇayiṯ-ḥāḏāš ... yēlēḵ wə-yāšōḇ lə-ḇêṯô ... mî-hā-ʾîš ha-yyārēʾ wə-raḵ ha-llēḇāḇ yēlēḵ wə-yāšōḇ lə-ḇêṯô. The Quran condemns the same plea: yastaʾdhinu farīqun minhumu n-nabiyya yaqūlūna inna buyūtanā ʿawratun wa-mā hiya bi-ʿawratin in yurīdūna illā firārā. The exempted house and the fainthearted of Deut are the hypocrites of the Quran."
      - with: hb-deut-20-rules-of-war
        motif: people-of-book-allies-brought-down-from-fortresses
        refs: ["33:26", "33:27"]
        with_refs: ["Deut 20:13", "Deut 20:14"]
        relation: parallel
        note: "Treatment of a defeated walled enemy: wə-hikkîṯā ʾeṯ-kol-zəḵûrāh ... raq ha-nnāšîm wə-ha-ṭṭap̄ ... kol-šəlālāh tāḇōz lāḵ vs. farīqan taqtulūna wa-taʾsirūna farīqan wa-awrathakum arḍahum wa-diyārahum wa-amwālahum. A part killed, a part taken captive, property taken; in both it is God who hands it over (û-nəṯānāh YHWH / awrathakum)."
  - unit: quran-33-prophets-wives
    checked: [hb-jer-31-consolation-new-covenant, hb-ezek-3-watchman-and-muteness, hb-exod-34-thirteen-attributes-covenant-renewal, hb-jer-44-queen-of-heaven, hb-lev-21-priestly-holiness, hb-ps-45-royal-wedding, hb-isa-3-collapse-and-daughters-of-zion, hb-zech-3-joshua-and-the-satan, hb-joel-3-spirit-poured]
    matches:
      - with: hb-lev-21-priestly-holiness
        motif: prophets-wives-double-punishment-double-reward
        refs: ["33:30"]
        with_refs: ["Lev 21:9"]
        relation: echo
        note: "A sacred man's household is held to a harsher standard: û-ḇaṯ ʾîš kōhēn kî ṯēḥēl liznôṯ ʾeṯ-ʾāḇîhā hîʾ məḥalleleṯ bā-ʾēš tiśśārēp̄ vs. yā-nisāʾa n-nabiyyi man yaʾti minkunna bi-fāḥishatin mubayyinatin yuḍāʿaf lahā l-ʿadhābu ḍiʿfayn. The priest's daughter profanes her father and is burned; the prophet's wife gets a doubled punishment and also a doubled reward (ajrahā marratayn, 33:31), which has no counterpart in Lev."
      - with: hb-ps-45-royal-wedding
        motif: prophets-wives-stay-in-houses
        refs: ["33:33"]
        with_refs: ["Ps 45:14"]
        relation: echo
        note: "kol-kəḇûddāh ḇaṯ-meleḵ pənîmâ (all glorious is the king's daughter within) vs. wa-qarna fī buyūtikunna wa-lā tabarrajna: the royal or prophetic woman kept inside. The psalm praises it, the Quran commands it. The rabbinic use of Ps 45:14 as a modesty rule is later and goes under cf. only."
      - with: hb-isa-3-collapse-and-daughters-of-zion
        motif: prophets-wives-stay-in-houses
        refs: ["33:33"]
        with_refs: ["Isa 3:16"]
        relation: echo
        note: "gāḇəhû bənôṯ ṣiyyôn wa-ttēlaḵnâ nəṭûyôṯ gārôn û-məśaqqərôṯ ʿênāyim ... û-ḇə-raḡlêhem təʿakkasnâ vs. wa-lā tabarrajna tabarruja l-jāhiliyyati l-ūlā: women's display of their finery in public, condemned."
      - with: hb-zech-3-joshua-and-the-satan
        motif: people-of-the-house-purified
        refs: ["33:33"]
        with_refs: ["Zech 3:4"]
        relation: echo
        note: "hāsîrû ha-bbəḡāḏîm ha-ṣṣōʾîm mē-ʿālâw ... rəʾēh heʿĕḇartî mē-ʿāleyḵā ʿăwōneḵā vs. innamā yurīdu llāhu li-yudhhiba ʿankumu r-rijsa ahla l-bayti wa-yuṭahhirakum taṭhīrā: God removes defilement from the sacred household (the high priest; the prophet's house). Lead only."
      - with: hb-joel-3-spirit-poured
        motif: male-and-female-believers-equal-reward
        refs: ["33:35"]
        with_refs: ["Joel 3:1", "Joel 3:2"]
        relation: echo
        note: "Paired masculine and feminine lists: wə-nibbəʾû bənêḵem û-ḇənôṯêḵem ... wə-ḡam ʿal-hā-ʿăḇāḏîm wə-ʿal-ha-ššəp̄āḥôṯ vs. inna l-muslimīna wa-l-muslimāti wa-l-muʾminīna wa-l-muʾmināt ... aʿadda llāhu lahum maghfiratan. Joel gives both sexes the spirit, the Quran gives both the same reward."
  - unit: quran-33-zayd-seal-of-prophets
    checked: [hb-jer-1-call, hb-isa-8-maher-shalal-and-stone-of-stumbling, hb-ezek-3-watchman-and-muteness, hb-lev-18-forbidden-unions, hb-2sam-11-bathsheba-uriah, hb-hos-1-gomer-children, hb-dan-9-prayer-seventy-weeks, hb-2sam-21-giants-of-gath]
    matches:
      - with: hb-dan-9-prayer-seventy-weeks
        motif: seal-of-the-prophets
        refs: ["33:40"]
        with_refs: ["Dan 9:24"]
        relation: echo
        note: "Cognate seal of prophecy: wə-laḥtōm ḥāzôn wə-nāḇîʾ (to seal vision and prophet, at the end of the seventy weeks) vs. wa-lākin rasūla llāhi wa-khātama n-nabiyyīn. Both use the root ḥ-t-m / kh-t-m with nāḇîʾ / nabī. In Daniel the sealing closes off prophecy at the end time; in the Quran a person is the seal. Lead for verification only."
      - with: hb-lev-18-forbidden-unions
        motif: zayd-and-zaynab-marriage
        refs: ["33:37"]
        with_refs: ["Lev 18:15"]
