      - with: hb-ps-104-creation-hymn
        motif: moon-stations-for-reckoning
        refs: ["36:39"]
        with_refs: ["Ps 104:19"]
        relation: echo
        note: "ʿāśâ yārēaḥ lə-môʿăḏîm šemeš yāḏaʿ məḇôʾô vs. wa-l-qamara qaddarnāhu manāzila ḥattā ʿāda ka-l-ʿurjūni l-qadīm: the moon set for appointed times and the sun's fixed setting. The Quran adds the image of the old palm stalk for the waning crescent."
  - unit: quran-36-trumpet-and-judgment
    checked: [hb-isa-27-leviathan-and-great-shofar, hb-isa-26-song-and-resurrection, hb-dan-12-resurrection-end, hb-jer-31-consolation-new-covenant, hb-jer-7-obedience-not-sacrifice, hb-ezek-33-watchman-and-fall-news, hb-deut-28-blessings-curses]
