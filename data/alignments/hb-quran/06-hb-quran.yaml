        note: "A horn that gathers. Isa: yittāqaʿ bə-šôp̄ār gāḏôl û-ḇāʾû hā-ʾōḇəḏîm bə-ʾereṣ ʾaššûr ... wə-hištaḥăwû la-YHWH bə-har ha-qqōḏeš, gathering the lost exiles to worship at Jerusalem. Q: wa-nufikha fī ṣ-ṣūri fa-idhā hum mina l-ajdāthi ilā rabbihim yansilūn, gathering the dead from the graves to judgment. The national ingathering becomes the universal resurrection."
      - with: hb-ezek-33-watchman-and-fall-news
        motif: prophet-not-a-poet
        refs: ["36:69"]
        with_refs: ["Ezek 33:32"]
        relation: divergence
        note: "The prophet taken for a performer. Ezek: wə-hinnəḵā lāhem kə-šîr ʿăḡāḇîm yəp̄ēh qôl ... wə-šāməʿû ʾeṯ-dəḇāreyḵā wə-ʿōśîm ʾênām ʾôṯām (to them you are a love song; they hear and do not act). Q: wa-mā ʿallamnāhu sh-shiʿra wa-mā yanbaghī lahu in huwa illā dhikrun wa-qurʾānun mubīn. Ezekiel accepts that he is heard as a singer and condemns the hearers; the Quran denies that the prophet is a poet at all."
      - with: hb-deut-28-blessings-curses
        motif: threat-of-blinding-and-transformation
        refs: ["36:66"]
        with_refs: ["Deut 28:28", "Deut 28:29"]
        relation: echo
        note: "yakkəḵâ YHWH bə-šiggāʿôn û-ḇə-ʿiwwārôn ... wə-hāyîṯā məmaššēš ba-ṣṣohŏrayim ... wə-lōʾ ṯaṣlîaḥ ʾeṯ-dərāḵeḵā vs. wa-law nashāʾu la-ṭamasnā ʿalā aʿyunihim fa-stabaqū ṣ-ṣirāṭa fa-annā yubṣirūn: struck blind and unable to find the way. A covenant curse that will happen in Deut, a possibility God holds back (law nashāʾu) in the Quran."
  - unit: quran-36-bones-and-be
    checked: [hb-exod-3-burning-bush, hb-ps-33-creation-by-word, hb-gen-1-creation-six-days, hb-ezek-37-dry-bones, hb-deut-32-song-of-moses, hb-isa-44-idol-from-half-a-log, hb-ps-8-what-is-man]
