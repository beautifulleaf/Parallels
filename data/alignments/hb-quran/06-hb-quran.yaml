  - unit: quran-39-death-and-sleep
    checked: [hb-ps-13-how-long, hb-deut-30-return-choose-life, hb-job-12-ask-the-beasts, hb-job-34-elihu-defends-gods-justice, hb-ps-49-no-ransom, hb-zeph-1-day-of-wrath, hb-deut-8-wilderness-lesson, hb-deut-31-joshua-torah-song]
    matches:
      - with: hb-ps-13-how-long
        motif: sleep-of-death
        refs: ["39:42"]
        with_refs: ["Ps 13:4"]
        relation: echo
        note: "hāʾîrâ ʿênay pen-ʾîšan ha-mmāweṯ vs. allāhu yatawaffā l-anfusa ḥīna mawtihā wa-llatī lam tamut fī manāmihā: sleep and death set side by side. The psalmist fears that sleep will become death; the Quran makes both a taking of the soul, from which God sends some back (yursilu l-ukhrā ilā ajalin musammā)."
      - with: hb-job-34-elihu-defends-gods-justice
        motif: god-takes-souls-in-sleep-and-death
        refs: ["39:42"]
        with_refs: ["Job 34:14", "Job 34:15"]
        relation: parallel
        note: "ʾim-yāśîm ʾēlâw libbô rûḥô wə-nišmāṯô ʾēlâw yeʾĕsōp̄ yiḡwaʿ kol-bāśār yaḥad vs. allāhu yatawaffā l-anfusa ḥīna mawtihā ... fa-yumsiku llatī qaḍā ʿalayhā l-mawt: God gathers back the breath or soul, and death follows. Elihu states it as a possibility for all flesh; the Quran describes it as happening every night and at each death."
      - with: hb-job-12-ask-the-beasts
        motif: god-takes-souls-in-sleep-and-death
        refs: ["39:42"]
        with_refs: ["Job 12:10"]
        relation: echo
        note: "ʾăšer bə-yāḏô nep̄eš kol-ḥāy wə-rûaḥ kol-bəśar-ʾîš vs. allāhu yatawaffā l-anfus: every soul (nep̄eš / nafs, cognate) is in God's hand."
      - with: hb-ps-49-no-ransom
        motif: earthful-of-gold-no-ransom
        refs: ["39:47"]
        with_refs: ["Ps 49:8", "Ps 49:9"]
        relation: parallel
        note: "ʾāḥ lōʾ-p̄āḏōh yip̄deh ʾîš lōʾ-yittēn lēʾlōhîm kop̄rô wə-yēqar piḏyôn nap̄šām vs. wa-law anna li-lladhīna ẓalamū mā fī l-arḍi jamīʿan wa-mithlahu maʿahu la-ftadaw bihi: no wealth can ransom a life from God. pāḏâ and fadā are cognate. The psalm speaks of death; the Quran of the punishment of the Day of Resurrection."
      - with: hb-zeph-1-day-of-wrath
        motif: earthful-of-gold-no-ransom
        refs: ["39:47"]
        with_refs: ["Zeph 1:18"]
        relation: parallel
        note: "gam-kaspām gam-zəhāḇām lōʾ-yûḵal ləhaṣṣîlām bə-yôm ʿeḇraṯ YHWH vs. mā fī l-arḍi jamīʿan wa-mithlahu maʿahu la-ftadaw bihi min sūʾi l-ʿadhābi yawma l-qiyāma: silver and gold cannot save on the Day of wrath or of Resurrection."
      - with: hb-deut-8-wilderness-lesson
        motif: wealth-gained-through-own-knowledge-claim
        refs: ["39:49", "39:50"]
        with_refs: ["Deut 8:17", "Deut 8:18"]
        relation: parallel
        note: "wə-ʾāmartā bi-lḇāḇeḵā kōḥî wə-ʿōṣem yāḏî ʿāśâ lî ʾeṯ-ha-ḥayil ha-zzeh, wə-zāḵartā ... kî hûʾ ha-nnōṯēn ləḵā kōaḥ vs. thumma idhā khawwalnāhu niʿmatan minnā qāla innamā ūtītuhu ʿalā ʿilm, bal hiya fitna. Taking credit for God's gift: Deut has 'my strength', the Quran 'my knowledge'. Deut answers that God gave the power; the Quran that the gift is a test."
      - with: hb-deut-31-joshua-torah-song
        motif: prophet-is-mortal-will-die
        refs: ["39:30"]
        with_refs: ["Deut 31:14"]
        relation: echo
        note: "hēn qārəḇû yāmeyḵā lāmûṯ vs. innaka mayyitun wa-innahum mayyitūn: God tells his prophet that he will die. For Moses it is near and personal; for Muhammad it is said together with his opponents, who will also die, before the dispute at the judgment (39:31)."
  - unit: quran-39-mercy-and-last-day
    checked: [hb-isa-34-edom-and-lilith, hb-isa-40-comfort-my-people, hb-ps-37-meek-inherit, hb-ezek-43-glory-returns, hb-1kgs-22-micaiah, hb-2chr-6-solomons-dedication-prayer, hb-ezek-33-watchman-and-fall-news, hb-isa-22-valley-of-vision-and-shebna]
    matches:
      - with: hb-ezek-43-glory-returns
        motif: earth-shines-with-gods-glory
        refs: ["39:69"]
        with_refs: ["Ezek 43:2"]
        relation: divergence
        note: "wə-hinnēh kəḇôḏ ʾĕlōhê yiśrāʾēl bāʾ mi-dderek ha-qqāḏîm ... wə-hā-ʾāreṣ hēʾîrâ mik-kəḇōḏô vs. wa-ashraqati l-arḍu bi-nūri rabbihā: the earth lit up by God's radiance. In Ezekiel it is the glory of the God of Israel returning to his temple; in the Quran it is the light of the earth's Lord at the universal judgment."
      - with: hb-isa-34-edom-and-lilith
        motif: heavens-rolled-up-like-scroll
        refs: ["39:67"]
        with_refs: ["Isa 34:4"]
        relation: parallel
        note: "wə-nāgōllû ḵa-sseper ha-ššāmāyim vs. wa-s-samāwātu maṭwiyyātun bi-yamīnihi: the heavens rolled or folded up at the end. Isaiah has a scroll, the Quran God's right hand."
      - with: hb-isa-40-comfort-my-people
        motif: earth-in-gods-grip-heavens-folded-in-right-hand
        refs: ["39:67"]
        with_refs: ["Isa 40:12", "Isa 40:18"]
        relation: parallel
        note: "mî-māḏaḏ bə-šoʿŏlô mayim wə-šāmayim ba-zzereṯ tikkēn wə-ḵāl ba-ššālīš ʿăp̄ar hā-ʾāreṣ ... wə-ʾel-mî təḏamməyûn ʾēl vs. wa-mā qadarū llāha ḥaqqa qadrihi wa-l-arḍu jamīʿan qabḍatuhu ... wa-s-samāwātu maṭwiyyātun bi-yamīnihi: the earth and the heavens held in God's hand-measures, and people have not measured God rightly (qadarū / tikkēn, measuring)."
      - with: hb-ps-37-meek-inherit
        motif: blessed-inherit-the-earth-of-paradise
        refs: ["39:74"]
        with_refs: ["Ps 37:29"]
        relation: divergence
        note: "ṣaddîqîm yîrəšû-ʾāreṣ wə-yiškənû lā-ʿaḏ ʿāleyhā vs. al-ḥamdu li-llāhi lladhī ... awrathanā l-arḍa natabawwaʾu mina l-jannati ḥaythu nashāʾ: the righteous inherit (yāraš / awratha, cognate) the land and dwell in it. The psalm's land is this earth; the Quran's 'land' is the Garden."
      - with: hb-ezek-33-watchman-and-fall-news
        motif: do-not-despair-god-forgives-all-sins
        refs: ["39:53", "39:54"]
        with_refs: ["Ezek 33:10", "Ezek 33:11"]
        relation: parallel
        note: "Answer to despair over sin. Ezek: kî-p̄əšāʿênû wə-ḥaṭṭōʾṯênû ʿālênû û-ḇām ʾănaḥnû nəmaqqîm wə-ʾêḵ niḥyeh ... ʾim-ʾeḥpōṣ bə-môṯ hā-rāšāʿ kî ʾim-bə-šûḇ rāšāʿ mi-ddarkô wə-ḥāyâ šûḇû šûḇû. Q: yā-ʿibādiya lladhīna asrafū ʿalā anfusihim lā taqnaṭū min raḥmati llāhi inna llāha yaghfiru dh-dhunūba jamīʿan ... wa-anībū ilā rabbikum. Do not give up; turn back (šûḇ / anāba)."
      - with: hb-2chr-6-solomons-dedication-prayer
        motif: do-not-despair-god-forgives-all-sins
        refs: ["39:53"]
        with_refs: ["2Chr 6:36", "2Chr 6:39"]
        relation: echo
        note: "kî ʾên ʾāḏām ʾăšer lōʾ-yeḥĕṭāʾ ... wə-sālaḥtā lə-ʿamməḵā ʾăšer ḥāṭəʾû-lāḵ vs. inna llāha yaghfiru dh-dhunūba jamīʿā: all sin and God's forgiveness. Solomon asks it for 'your people' praying toward the temple; the Quran offers it to all God's servants."
      - with: hb-isa-22-valley-of-vision-and-shebna
        motif: keys-of-heavens-and-earth
        refs: ["39:63"]
        with_refs: ["Isa 22:22"]
        relation: divergence
        note: "wə-nāṯattî map̄tēaḥ bêṯ-dāwiḏ ʿal-šiḵmô û-p̄āṯaḥ wə-ʾên sōḡēr vs. lahu maqālīdu s-samāwāti wa-l-arḍ: the key as power to open and close. In Isaiah God hands the key of David's house to a human steward; in the Quran the keys of heaven and earth belong to God alone."
