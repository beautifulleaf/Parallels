        relation: divergence
        note: "The question about bones, with the speakers swapped. Ezek: God asks hă-ṯiḥyênâ hā-ʿăṣāmôṯ hā-ʾēlleh and the prophet defers, ʾăḏōnāy YHWH ʾattâ yāḏāʿtā. The despairing house of Israel says yāḇəšû ʿaṣmôṯênû wə-ʾāḇəḏâ ṯiqwāṯēnû. Q: the sceptic asks man yuḥyi l-ʿiẓāma wa-hiya ramīm and the prophet is given the answer, yuḥyīhā lladhī anshaʾahā awwala marra. Ezekiel's vision is a national restoration; the Quran's argument is about bodily resurrection from first creation."
      - with: hb-ps-33-creation-by-word
