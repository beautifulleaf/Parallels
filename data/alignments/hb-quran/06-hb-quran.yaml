  - unit: quran-34-david-solomon
    checked: [hb-esth-1-vashti-deposed, hb-ps-98-rivers-clap, hb-jer-52-historical-appendix, hb-exod-37-ark-table-lampstand-made, hb-ps-78-history, hb-2chr-5-ark-into-temple-glory-cloud, hb-ps-148-all-creation-praises, hb-1sam-17-david-goliath, hb-1chr-22-david-prepares-temple, hb-1kgs-7-hiram-pillars, hb-1kgs-7-bronze-sea-vessels, hb-1kgs-5-hiram-cedars, hb-1kgs-9-cities-labor-ophir, hb-1kgs-6-temple-interior, hb-1kgs-11-jeroboam-ahijah]
