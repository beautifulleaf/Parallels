        relation: divergence
        note: "A prayer for a child said in a hidden voice: wəḥannâ hîʾ mədabberet ʿal-libbāh raq śəpātêhā nāʿôt wəqôlāh lōʾ yiššāmēaʿ; idh nādā rabbahu nidāʾan khafiyyā. The petitioner changes: the barren wife in Samuel, the aged husband-priest in Q. Hannah is misjudged by the priest Eli, while in Q the praying man is himself the priest."
      - with: hb-gen-18-visitors-at-mamre
        motif: father-doubts-annunciation-due-to-age
        refs: ["19:8", "19:9"]
        with_refs: ["Gen 18:11", "Gen 18:12", "Gen 18:13", "Gen 18:14"]
        relation: divergence
        note: "Gen: the old wife doubts, ʾaḥărê bəlōtî ... waʾdōnî zāqēn, and God answers with a question, hăyippālēʾ mēYHWH dābār. Q: the old husband doubts, annā yakūnu lī ghulāmun ... wa-qad balaghtu mina l-kibari ʿitiyyā, and God answers with a statement, huwa ʿalayya hayyinun wa-qad khalaqtuka min qablu wa-lam taku shayʾā (creation from nothing as the proof)."
      - with: hb-gen-16-hagar
        motif: annunciation-of-son-and-name
        refs: ["19:7"]
        with_refs: ["Gen 16:11"]
        relation: divergence
        note: "Both have the messenger give the name: wəqārāʾt šəmô yišmāʿēʾl kî-šāmaʿ YHWH ʾel-ʿonyēk; innā nubashshiruka bi-ghulāmin smuhu Yaḥyā lam najʿal lahu min qablu samiyyā. The name's grounding differs. Gen explains it by etymology, from the mother's affliction; Q stresses that the name has never been given before."
      - with: hb-judg-13-samson-birth
        motif: barren-matriarch
        refs: ["19:5", "19:7", "19:8"]
        with_refs: ["Judg 13:2", "Judg 13:3", "Judg 13:5"]
        relation: parallel
        note: "wəʾištô ʿăqārâ wəlōʾ yālādâ ... hinnāk hārâ wəyōladt bēn ... kî-nəzîr ʾĕlōhîm yihyeh hannaʿar min-habbeṭen; wa-kānati mraʾatī ʿāqiran ... nubashshiruka bi-ghulām ... wa-ātaynāhu l-ḥukma ṣabiyyā ... wa-kāna taqiyyā: a barren wife, an announced son, consecrated from childhood. In Judg the angel comes to the wife; in Q the announcement goes to the husband."
      - with: hb-2kgs-4-shunammite
        motif: annunciation-of-son-and-name
        refs: ["19:7", "19:8"]
        with_refs: ["2Kgs 4:14", "2Kgs 4:16"]
        relation: echo
        note: "bēn ʾên-lāh wəʾîšāh zāqēn ... lammôʿēd hazzeh kāʿēt ḥayyâ ʾatt ḥōbeqet bēn, and the woman protests ʾal-təkazzēb bəšipḥātekā; nubashshiruka bi-ghulām ... annā yakūnu lī ghulām. A son promised where the husband is old. The disbelief moves from the wife to the husband."
      - with: hb-gen-29-birth-of-jacobs-children
        motif: barren-matriarch
        refs: ["19:5"]
        with_refs: ["Gen 29:31"]
        relation: parallel
        note: "wəraḥēl ʿăqārâ; wa-kānati mraʾatī ʿāqiran (cognate ʿ-q-r): the barren wife of the line of Jacob."
      - with: hb-ezek-3-watchman-and-muteness
        motif: prophet-struck-dumb
        refs: ["19:10", "19:11"]
        with_refs: ["Ezek 3:26", "Ezek 3:27"]
        relation: echo
        note: "ûləšônəkā ʾadbîq ʾel-ḥikkekā wəneʾĕlamtā ... ûbədabbərî ʾôtəkā ʾeptaḥ ʾet-pîkā; āyatuka allā tukallima n-nāsa thalātha layālin sawiyyā, fa-awḥā ilayhim an sabbiḥū: God silences a prophet, who can still signal or speak at God's bidding. Ezek's muteness marks a rebellious house; Zechariah's is a sign of the promised birth."
  - unit: quran-19-mary-and-jesus
    checked: [hb-exod-15-song-of-the-sea, hb-gen-21-isaac-born-hagar-expelled, hb-2kgs-4-shunammite, hb-1sam-1-hannah, hb-gen-16-hagar, hb-isa-7-immanuel, hb-judg-13-samson-birth]
    matches:
      - with: hb-exod-15-song-of-the-sea
        motif: mary-called-sister-of-aaron
        refs: ["19:28"]
        with_refs: ["Exod 15:20"]
        relation: divergence
        note: "miryām hannəbîʾâ ʾăḥôt ʾahărōn; yā ukhta Hārūn: the epithet of Miriam, Moses' sister, given to Maryam the mother of Jesus. Same name (Miryām / Maryam). Exod's Miriam leads the women in song; Q's Maryam is reproached by her people."
      - with: hb-gen-21-isaac-born-hagar-expelled
        motif: mother-wishes-she-had-died-and-been-forgotten
        refs: ["19:22", "19:23", "19:24", "19:25", "19:26"]
        with_refs: ["Gen 21:14", "Gen 21:16", "Gen 21:17", "Gen 21:19"]
