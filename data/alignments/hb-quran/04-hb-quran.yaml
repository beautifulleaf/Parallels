  - unit: quran-15-iblis
    checked: [hb-gen-2-eden-adam-woman, hb-job-33-elihu-dreams-and-angel, hb-job-10-why-did-you-make-me, hb-isa-65-rebels-and-servants, hb-isa-59-sins-separate-divine-warrior, hb-lam-3-the-man-who-saw-affliction, hb-ezek-28-cherub-in-eden, hb-isa-14-helel-ben-shahar]
