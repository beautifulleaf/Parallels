      - with: hb-josh-24-shechem-covenant
        motif: grandson-as-extra-gift
        refs: ["21:52", "21:53", "21:72"]
        with_refs: ["Josh 24:2", "Josh 24:3", "Josh 24:4"]
        relation: divergence
        note: "teraḥ ʾăbî ʾabrāhām ... wayyaʿabdû ʾĕlōhîm ʾăḥērîm ... wāʾetten-lô ʾet-yiṣḥāq wāʾetten ləyiṣḥāq ʾet-yaʿăqōb; qāla li-abīhi wa-qawmihi ... wajadnā ābāʾanā lahā ʿābidīn ... wa-wahabnā lahu Isḥāqa wa-Yaʿqūba nāfilatan. The idolatrous fathers and the gift of descendants are the same. Josh gives Jacob to Isaac; Q gives Jacob to Abraham as an 'extra gift' (nāfila)."
      - with: hb-gen-12-call-of-abram
        motif: abraham-and-lot-saved-to-blessed-land
        refs: ["21:71"]
        with_refs: ["Gen 12:3", "Gen 12:4", "Gen 12:5"]
        relation: divergence
        note: "wəniḇrəkû bəkā kōl mišpəḥōt hāʾădāmâ ... wayyēlek ʾittô lôṭ ... wayyābōʾû ʾarṣâ kənāʿan; wa-najjaynāhu wa-Lūṭan ilā l-arḍi llatī bāraknā fīhā li-l-ʿālamīn: Abraham and Lot go to a land of blessing for all peoples. In Gen the blessing is on Abraham and the move is obedience to a call; in Q the blessing is on the land and the move is a rescue (najjaynāhu) after the fire."
  - unit: quran-21-noah-david-solomon
    checked: [hb-ps-148-all-creation-praises, hb-gen-6-flood, hb-gen-19-sodom-destroyed, hb-exod-22-property-laws, hb-isa-1-indictment-of-judah, hb-ps-78-history, hb-1kgs-3-judgment-of-solomon, hb-1sam-17-david-goliath]
    matches:
      - with: hb-gen-6-flood
        motif: hero-prays-for-judgment
        refs: ["21:76", "21:77"]
        with_refs: ["Gen 6:9", "Gen 6:18", "Gen 7:1", "Gen 7:23"]
        relation: divergence
        note: "Gen: Noah never speaks or prays; God chooses him as righteous (kî-ʾōtəkā rāʾîtî ṣaddîq ləpānay) and tells him to enter with his household, and everything else is wiped out (wayyimaḥ ʾet-kol-hayqûm). Q: Noah calls out and is answered, idh nādā min qablu fa-stajabnā lahu fa-najjaynāhu wa-ahlahu ... fa-aghraqnāhum ajmaʿīn. Rescue by election becomes an answer to prayer, and the drowned are 'a people who denied our signs'."
      - with: hb-exod-22-property-laws
        motif: grazing-and-fire-damage-liability
        refs: ["21:78"]
        with_refs: ["Exod 22:4"]
        relation: parallel
        note: "kî yabʿer-ʾîš śādeh ʾô-kerem wəšillaḥ ʾet-bəʿîrô ûbiʿēr biśdēh ʾaḥēr mêṭab śādēhû ... yəšallēm; idh yaḥkumāni fī l-ḥarthi idh nafashat fīhi ghanamu l-qawm: a flock straying into another's field and the owner's liability. Exod states a general law of compensation; Q tells it as a case judged by David and Solomon."
      - with: hb-1kgs-3-judgment-of-solomon
        motif: divine-wisdom-for-judgment
        refs: ["21:78", "21:79"]
        with_refs: ["1Kgs 3:28"]
        relation: divergence
        note: "kî rāʾû kî-ḥokmat ʾĕlōhîm bəqirbô laʿăśôt mišpāṭ; fa-fahhamnāhā Sulaymāna wa-kullan ātaynā ḥukman wa-ʿilmā: Solomon's judicial wisdom is from God. The case differs (two harlots and a child in 1Kgs, a flock in a field in Q), and Q sets Solomon's insight beside his father David's, both given ḥukm."
      - with: hb-ps-148-all-creation-praises
        motif: mountains-and-birds-praise-with-david
        refs: ["21:79"]
        with_refs: ["Ps 148:9", "Ps 148:10"]
        relation: divergence
        note: "hehārîm wəkol-gəbāʿôt ... wəṣippôr kānāp, called on to praise YHWH; wa-sakhkharnā maʿa Dāwūda l-jibāla yusabbiḥna wa-ṭ-ṭayr: mountains and birds praise. In Ps all creation is summoned; in Q they are made to join one man, David, in his praise (cf. David as psalmist)."
      - with: hb-1sam-17-david-goliath
        motif: david-taught-to-make-mail
        refs: ["21:80"]
        with_refs: ["1Sam 17:38", "1Sam 17:39"]
        relation: contrast
        note: "1Sam: David cannot wear armor, wayyalbēš ʾōtô širyôn ... lōʾ ʾûkal lāleket bāʾēlleh kî lōʾ nissîtî wayəsirēm. Q: God teaches David to make armor, wa-ʿallamnāhu ṣanʿata labūsin lakum li-tuḥṣinakum min baʾsikum. The shepherd who shed armor becomes the armorer."
  - unit: quran-21-prophets-answered
    checked: [hb-jonah-2-in-the-fish, hb-gen-25-jacob-esau-birth, hb-jonah-1-flight-and-storm, hb-job-42-epilogue, hb-ezek-3-watchman-and-muteness, hb-jer-15-confession-words-eaten, hb-jonah-4-qiqayon]
    matches:
      - with: hb-job-42-epilogue
        motif: fortunes-restored-twofold
        refs: ["21:83", "21:84"]
        with_refs: ["Job 42:10"]
        relation: divergence
        note: "wayhwh šāb ʾet-šəbût ʾiyyôb bəhitpalləlô bəʿad rēʿēhû wayyōsep YHWH ʾet-kol-ʾăšer ləʾiyyôb ləmišneh; fa-stajabnā lahu fa-kashafnā mā bihi min ḍurrin wa-ātaynāhu ahlahu wa-mithlahum maʿahum: restoration double. The occasion changes: in Job it follows his intercession for his friends; in Q it answers Job's own short, patient plea, annī massaniya ḍ-ḍurru wa-anta arḥamu r-rāḥimīn, with none of the HB Job's protest."
      - with: hb-jonah-1-flight-and-storm
        motif: prophet-flees-from-gods-commission
        refs: ["21:87"]
        with_refs: ["Jonah 1:3"]
        relation: parallel
        note: "wayyāqom yônâ librōaḥ taršîšâ millipnê YHWH; wa-dha n-nūni idh dhahaba mughāḍiban fa-ẓanna an lan naqdira ʿalayh: the prophet runs from God, thinking he can escape God's reach."
      - with: hb-jonah-4-qiqayon
        motif: prophet-flees-from-gods-commission
        refs: ["21:87"]
        with_refs: ["Jonah 4:1", "Jonah 4:2"]
        relation: divergence
        note: "Jonah's anger comes after Nineveh is spared, and he explains his flight from it: wayyiḥar lô ... ʿal-kēn qiddamtî librōaḥ taršîšâ kî yādaʿtî kî ʾattâ ʾēl-ḥannûn wəraḥûm. Q joins anger and flight at the start, dhahaba mughāḍiban, without the reason that God is too merciful."
      - with: hb-jonah-2-in-the-fish
        motif: jonah-cries-from-darknesses
        refs: ["21:87", "21:88"]
        with_refs: ["Jonah 2:2", "Jonah 2:3", "Jonah 2:4", "Jonah 2:10", "Jonah 2:11"]
        relation: divergence
        note: "Same setting and answer: wayyitpallēl yônâ ... mimməʿê haddāgâ ... qārāʾtî miṣṣārâ lî ʾel-YHWH wayyaʿănēnî ... wayyāqēʾ ʾet-yônâ; fa-nādā fī ẓ-ẓulumāti ... fa-stajabnā lahu wa-najjaynāhu mina l-ghamm. The prayer itself changes: Jonah's psalm is a thanksgiving with a vow (ʾăšer nādartî ʾăšallēmâ) and no confession; Q's is a confession of God's oneness and his own guilt, lā ilāha illā anta subḥānaka innī kuntu mina ẓ-ẓālimīn."
      - with: hb-gen-25-jacob-esau-birth
        motif: husband-prays-for-barren-wife
        refs: ["21:89", "21:90"]
        with_refs: ["Gen 25:21"]
        relation: parallel
        note: "wayyeʿtar yiṣḥāq laYHWH lənōkaḥ ʾištô ... wayyēʿāter lô YHWH wattahar; idh nādā rabbahu rabbi lā tadharnī fardan ... fa-stajabnā lahu wa-wahabnā lahu Yaḥyā wa-aṣlaḥnā lahu zawjah: the husband's prayer answered and the barren wife made able to conceive."
  - unit: quran-21-end-and-inheritance
    checked: [hb-ps-37-meek-inherit, hb-ps-25-acrostic-prayer, hb-isa-34-edom-and-lilith, hb-ezek-38-gog-invasion, hb-isa-13-oracle-against-babylon, hb-ps-78-history]
    matches:
      - with: hb-ps-37-meek-inherit
        motif: meek-inherit-the-land
        refs: ["21:105"]
        with_refs: ["Ps 37:29", "Ps 37:9", "Ps 37:11"]
        relation: parallel
        note: "Explicit citation with source named: wa-la-qad katabnā fī z-Zabūri min baʿdi dh-dhikri anna l-arḍa yarithuhā ʿibādiya ṣ-ṣāliḥūn; ṣaddîqîm yîrəšû-ʾāreṣ wəyiškənû lāʿad ʿālêhā. The words match closely: ʾereṣ / al-arḍ, yîrəšû / yarithu (cognate y-r-š / w-r-th), ṣaddîqîm / ʿibādiya ṣ-ṣāliḥūn. One of the few places where the Quran quotes a Psalm and names the Zabūr as its source. Q makes 'the land' read as 'the earth' in an eschatological frame (after the rolled-up heaven, 21:104)."
      - with: hb-ps-25-acrostic-prayer
        motif: meek-inherit-the-land
        refs: ["21:105"]
        with_refs: ["Ps 25:13"]
        relation: parallel
        note: "wəzarʿô yîraš ʾāreṣ; anna l-arḍa yarithuhā ʿibādiya ṣ-ṣāliḥūn: the God-fearer's offspring inherit the land."
      - with: hb-isa-34-edom-and-lilith
        motif: heavens-rolled-up-like-scroll
        refs: ["21:104"]
        with_refs: ["Isa 34:4"]
        relation: parallel
        note: "wənāgōllû kassēper haššāmāyim wəkol-ṣəbāʾām yibbôl; yawma naṭwī s-samāʾa ka-ṭayyi s-sijilli li-l-kutub: the sky rolled up like a written scroll (sēper / sijill li-l-kutub). Isa's image is part of a judgment on Edom and the nations; Q's is the prelude to recreation, ka-mā badaʾnā awwala khalqin nuʿīduh."
      - with: hb-ezek-38-gog-invasion
        motif: gog-magog-released-at-end
        refs: ["21:96", "21:97"]
        with_refs: ["Ezek 38:15", "Ezek 38:16"]
        relation: divergence
        note: "ûbāʾtā mimməqôməkā miyyarkətê ṣāpôn ... kəʿānān ləkassôt hāʾāreṣ bəʾaḥărît hayyāmîm; ḥattā idhā futiḥat Yaʾjūju wa-Maʾjūju wa-hum min kulli ḥadabin yansilūn wa-qtaraba l-waʿdu l-ḥaqq: Gog's hordes pour in at the end. Ezek's Gog is one prince from the far north, aimed at Israel; Q's Yaʾjūj and Maʾjūj are a pair, 'opened' from a barrier and pouring down from every height, as a sign that the promise (the Hour) is near."
  - unit: quran-22-quake-and-resurrection-proofs
    checked: [hb-job-10-why-did-you-make-me, hb-ps-139-searched-and-known, hb-job-33-elihu-dreams-and-angel, hb-isa-65-new-heavens-new-earth, hb-ps-90-moses-thousand-years, hb-isa-24-world-judgment, hb-ezek-38-gog-invasion, hb-isa-13-oracle-against-babylon, hb-isa-26-song-and-resurrection]
    matches:
      - with: hb-job-10-why-did-you-make-me
        motif: embryo-curdled-like-cheese
        refs: ["22:5"]
        with_refs: ["Job 10:9", "Job 10:10", "Job 10:11"]
        relation: parallel
        note: "kî-kaḥōmer ʿăśîtānî ... hălōʾ keḥālāb tattîkēnî wəkaggəbinnâ taqpîʾēnî ʿôr ûbāśār talbîšēnî ûbaʿăṣāmôt wəgîdîm təsōkəkēnî; khalaqnākum min turābin thumma min nuṭfatin thumma min ʿalaqatin thumma min muḍghatin mukhallaqatin wa-ghayri mukhallaqa: man formed from earth, then curdled and clothed in stages in the womb. Job speaks of himself in a complaint (why destroy what you made?); Q uses the stages as proof of resurrection (in kuntum fī raybin mina l-baʿth)."
      - with: hb-ps-139-searched-and-known
        motif: embryo-stages-dust-drop-clot-lump
        refs: ["22:5"]
        with_refs: ["Ps 139:13", "Ps 139:15", "Ps 139:16"]
        relation: parallel
        note: "təsukkēnî bəbeṭen ʾimmî ... ruqqamtî bətaḥtiyyôt ʾāreṣ golmî rāʾû ʿênêkā; thumma min muḍghatin mukhallaqatin wa-ghayri mukhallaqa ... wa-nuqirru fī l-arḥāmi mā nashāʾ: the unformed embryo (gōlem / muḍgha 'shaped and unshaped') under God's eye, linked with the earth. Ps adds that its days are written in God's book."
      - with: hb-job-33-elihu-dreams-and-angel
        motif: human-formed-from-earth
        refs: ["22:5"]
        with_refs: ["Job 33:6"]
        relation: parallel
        note: "mēḥōmer qōraṣtî gam-ʾānî; khalaqnākum min turāb: man nipped from clay."
      - with: hb-isa-24-world-judgment
        motif: earthquake-of-the-hour
        refs: ["22:1", "22:2"]
        with_refs: ["Isa 24:18", "Isa 24:19", "Isa 24:20"]
        relation: echo
        note: "wayyirʿăšû môsədê ʾāreṣ ... nôaʿ tānûaʿ ʾereṣ kaššikkôr; inna zalzalata s-sāʿati shayʾun ʿaẓīm ... wa-tarā n-nāsa sukārā wa-mā hum bi-sukārā: the end-time quake, with drunkenness as the image. In Isa the earth itself reels like a drunkard; in Q people seem drunk without being drunk."
      - with: hb-ezek-38-gog-invasion
        motif: great-earthquake-all-creatures-quake
        refs: ["22:1", "22:2"]
        with_refs: ["Ezek 38:19", "Ezek 38:20"]
        relation: parallel
        note: "bayyôm hahûʾ yihyeh raʿaš gādôl ... wərāʿăšû mippānay dəgê hayyām wəʿôp haššāmayim ... wəkol-hāʾādām; zalzalata s-sāʿati shayʾun ʿaẓīm yawma tarawnahā tadhhalu kullu murḍiʿatin ʿammā arḍaʿat: a great quake on 'that day' that shakes every living being. Ezek ties it to Gog's invasion of Israel; Q to the Hour."
      - with: hb-isa-13-oracle-against-babylon
        motif: earthquake-of-the-hour
        refs: ["22:2"]
        with_refs: ["Isa 13:8"]
        relation: echo
        note: "ṣîrîm waḥăbālîm yōʾḥēzûn kayyôlēdâ yəḥîlûn ... pənê ləhābîm pənêhem; wa-taḍaʿu kullu dhāti ḥamlin ḥamlahā: terror on the day pictured through childbirth. In Isa men writhe like a woman in labor; in Q pregnant women actually miscarry and nursing mothers forget their infants."
      - with: hb-isa-26-song-and-resurrection
        motif: rain-revives-dead-earth
        refs: ["22:5", "22:6", "22:7"]
        with_refs: ["Isa 26:19"]
        relation: echo
        note: "yiḥyû mētêkā nəbēlātî yəqûmûn hāqîṣû wərannənû šōknê ʿāpār kî ṭal ʾôrōt ṭallekā wāʾāreṣ rəpāʾîm tappîl; wa-tarā l-arḍa hāmidatan fa-idhā anzalnā ʿalayhā l-māʾa htazzat ... wa-anna llāha yabʿathu man fī l-qubūr: moisture from heaven tied to the dead rising from the dust. In Isa a dew of lights directly brings up the shades; in Q rain reviving the earth is the analogy that proves resurrection."
