        motif: breath-of-life-into-nostrils
        refs: ["15:29"]
        with_refs: ["Gen 2:7"]
        relation: divergence
        note: "wayyippaḥ bəʾappāyw nišmat ḥayyîm; fa-idhā sawwaytuhu wa-nafakhtu fīhi min rūḥī fa-qaʿū lahu sājidīn. Same verb (npḥ / nfkh). In Gen, breath of life; in Q, 'of my spirit'. In Q the breathing is the cue for the angels' prostration, which has no counterpart in Gen 2."
      - with: hb-job-33-elihu-dreams-and-angel
        motif: human-formed-from-earth
        refs: ["15:26", "15:29"]
        with_refs: ["Job 33:4", "Job 33:6"]
        relation: parallel
        note: "mēḥōmer qōraṣtî gam-ʾānî ... rûaḥ-ʾēl ʿāśātnî wənišmat šadday təḥayyēnî; min ṣalṣālin min ḥamaʾin masnūn ... wa-nafakhtu fīhi min rūḥī: man pinched off from clay (ḥōmer) and given life by God's spirit."
      - with: hb-job-10-why-did-you-make-me
        motif: human-formed-from-earth
        refs: ["15:26"]
        with_refs: ["Job 10:9"]
        relation: parallel
        note: "zəkār-nāʾ kî-kaḥōmer ʿăśîtānî wəʾel-ʿāpār təšîbēnî; khalaqnā l-insāna min ṣalṣālin min ḥamaʾin masnūn: man made of clay. Job uses it in a complaint against his maker; Q uses it to set up Iblis's contempt for clay."
      - with: hb-ezek-28-cherub-in-eden
