        note: "mî baššaḥaq yaʿărōk laYHWH yidmeh laYHWH bibnê ʾēlîm ʾēl naʿărāṣ bəsôd-qədōšîm; law kāna maʿahu ālihatun ... la-btaghaw ilā dhī l-ʿarshi sabīlā ... yabtaghūna ilā rabbihimu l-wasīlata ... wa-yakhāfūna ʿadhābah: the other heavenly beings are subordinate and in awe of the one God. Ps grants a council of bənê ʾēlîm; Q grants their existence only hypothetically (law kāna) and makes them seekers of nearness."
      - with: hb-ezek-37-dry-bones
        motif: resurrection-from-bones-and-dust-doubted
        refs: ["17:49", "17:51"]
        with_refs: ["Ezek 37:3", "Ezek 37:5", "Ezek 37:11"]
        relation: parallel
        note: "hătiḥyênâ hāʿăṣāmôt hāʾēlleh ... yābəšû ʿaṣmôtênû wəʾābədâ tiqwātēnû; a-idhā kunnā ʿiẓāman wa-rufātan a-innā la-mabʿūthūna khalqan jadīdā: can dry bones (ʿăṣāmôt / ʿiẓām, cognate) live again? Ezek's doubters are the exiles in despair, and the bones are a figure for national restoration. Q's doubters are deniers mocking, and the answer is literal: alladhī faṭarakum awwala marra."
      - with: hb-ps-29-voice-of-yhwh
        motif: david-given-the-psalms
        refs: ["17:55"]
        with_refs: ["Ps 29:1"]
        relation: echo
        note: "mizmôr lədāwid; wa-ātaynā Dāwūda zabūrā: psalmody tied to David. In the HB the attribution is a superscription; in Q David is a scripture-bearer given a book by God."
  - unit: quran-17-iblis-and-adam
    checked: [hb-ps-106-national-confession, hb-num-26-second-census, hb-num-16-korah, hb-isa-59-sins-separate-divine-warrior, hb-job-34-elihu-defends-gods-justice, hb-isa-63-communal-lament, hb-ps-107-four-rescues, hb-jonah-1-flight-and-storm, hb-ps-8-what-is-man]
    matches:
      - with: hb-ps-107-four-rescues
        motif: call-on-god-in-distress-forget-after
        refs: ["17:66", "17:67"]
        with_refs: ["Ps 107:23", "Ps 107:25", "Ps 107:28", "Ps 107:29", "Ps 107:30", "Ps 107:31"]
        relation: divergence
        note: "Same scene, opposite ending. Ps: yôrədê hayyām bāʾŏniyyôt ... wayyiṣʿăqû ʾel-YHWH baṣṣar lāhem ... yāqēm səʿārâ lidmāmâ ... wayyanḥēm ʾel-məḥôz ḥepṣām, followed by thanks, yôdû laYHWH ḥasdô. Q: idhā massakumu ḍ-ḍurru fī l-baḥri ḍalla man tadʿūna illā iyyāhu fa-lammā najjākum ilā l-barri aʿraḍtum wa-kāna l-insānu kafūrā. The rescued give thanks in Ps and turn away in Q."
      - with: hb-jonah-1-flight-and-storm
        motif: call-on-god-in-distress-forget-after
        refs: ["17:67"]
        with_refs: ["Jonah 1:5", "Jonah 1:14", "Jonah 1:16"]
        relation: contrast
        note: "In the storm the sailors first cry each to his own god (wayyizʿăqû ʾîš ʾel-ʾĕlōhāyw), then to YHWH alone (wayyiqrəʾû ʾel-YHWH). Once saved, they sacrifice and vow to YHWH (wayyizbəḥû-zebaḥ laYHWH wayyiddərû nədārîm). Q: in distress the other gods vanish (ḍalla man tadʿūna illā iyyāhu), and on land people return to ingratitude (aʿraḍtum). Jonah's sailors stay converted; Q's turn back."
      - with: hb-ps-8-what-is-man
        motif: children-of-adam-honored
        refs: ["17:70"]
        with_refs: ["Ps 8:5", "Ps 8:6", "Ps 8:7", "Ps 8:8", "Ps 8:9"]
        relation: parallel
        note: "mâ-ʾĕnôš kî-tizkərennû ûben-ʾādām ... wattəḥassərēhû məʿaṭ mēʾĕlōhîm wəkābôd wəhādār təʿaṭṭərēhû tamšîlēhû ... ṣippôr šāmayim ûdəgê hayyām ʿōbēr ʾorḥôt yammîm; wa-la-qad karramnā banī Ādama wa-ḥamalnāhum fī l-barri wa-l-baḥri ... wa-faḍḍalnāhum ʿalā kathīrin mimman khalaqnā: the son of Adam (ben-ʾādām / banī Ādam) honored above creation, over land and sea. Ps crowns him a little lower than ʾĕlōhîm; Q places this right after Iblis's complaint at Adam being honored (karramta ʿalayya, 17:62)."
      - with: hb-num-16-korah
        motif: earth-swallows-rebels
        refs: ["17:68"]
        with_refs: ["Num 16:31", "Num 16:32"]
        relation: parallel
        note: "wattibbāqaʿ hāʾădāmâ ... wattiptaḥ hāʾāreṣ ʾet-pîhā wattiblaʿ ʾōtām; a-fa-amintum an yakhsifa bikum jāniba l-barr: the ground opens under the ungrateful. Q makes it a threat to anyone who forgets God once on dry land."
  - unit: quran-17-prayer-spirit-and-challenge
    checked: [hb-ps-55-dove-wings, hb-prov-30-agur-confession, hb-dan-6-lions-den, hb-ps-17-apple-of-eye, hb-jer-23-against-prophets, hb-ps-44-national-lament]
