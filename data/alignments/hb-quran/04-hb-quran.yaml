  - unit: quran-20-moses-call
    checked: [hb-exod-4-signs-aaron-bridegroom-of-blood, hb-exod-3-burning-bush, hb-exod-7-staff-swallows-staffs, hb-1kgs-19-elijah-horeb, hb-ezek-3-watchman-and-muteness]
    matches:
      - with: hb-exod-3-burning-bush
        motif: prophet-sees-fire-goes-to-fetch-brand
        refs: ["20:9", "20:10", "20:11"]
        with_refs: ["Exod 3:1", "Exod 3:2", "Exod 3:3"]
        relation: divergence
        note: "Setting and motive change. Exod: Moses alone with Jethro's flock at har hāʾĕlōhîm, drawn by a wonder, hassəneh bōʿēr bāʾēš wəhassəneh ʾênennû ʾukkāl ... ʾāsurâ-nnāʾ wəʾerʾeh. Q: Moses traveling with his family (qāla li-ahlihi mkuthū) sees a fire and goes for a practical need, la-ʿallī ātīkum minhā bi-qabasin aw ajidu ʿalā n-nāri hudā. Q 20 does not mention the unconsumed bush."
      - with: hb-exod-3-burning-bush
        motif: remove-sandals-holy-ground
        refs: ["20:12"]
        with_refs: ["Exod 3:5"]
        relation: parallel
        note: "šal-nəʿālêkā mēʿal raglêkā kî hammāqôm ʾăšer ʾattâ ʿômēd ʿālāyw ʾadmat-qōdeš hûʾ; fa-khlaʿ naʿlayka innaka bi-l-wādi l-muqaddasi Ṭuwā: same command, same reason (qōdeš / muqaddas). Q names the place Ṭuwā."
      - with: hb-exod-3-burning-bush
        motif: holy-valley-tuwa
        refs: ["20:12", "20:13", "20:14"]
        with_refs: ["Exod 3:6", "Exod 3:14", "Exod 3:15"]
        relation: divergence
        note: "God's self-introduction. Exod: ancestral God and the revealed name, ʾānōkî ʾĕlōhê ʾābîkā ʾĕlōhê ʾabrāhām ... ʾehyeh ʾăšer ʾehyeh ... YHWH ʾĕlōhê ʾăbōtêkem ... zeh-ššəmî ləʿōlām. Q: universal confession and worship, innī ana rabbuka ... innanī ana llāhu lā ilāha illā ana fa-ʿbudnī wa-aqimi ṣ-ṣalāta li-dhikrī. No patriarchs and no special name, and prayer is commanded. Q adds the Hour (20:15)."
      - with: hb-exod-4-signs-aaron-bridegroom-of-blood
        motif: prophet-describes-staff-uses
        refs: ["20:17", "20:18"]
