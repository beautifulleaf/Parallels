        note: "Same sequence. A lone mother in a remote place despairs over death (ʾal-ʾerʾeh bəmôt hayyāled ... wattēbk / yā laytanī mittu qabla hādhā). A voice calls to her and says do not fear or grieve (wayyiqrāʾ malʾak ʾĕlōhîm ʾel-hāgār ... ʾal-tîrʾî / fa-nādāhā min taḥtihā allā taḥzanī). God provides water (wattēreʾ bəʾēr māyim / jaʿala rabbuki taḥtaki sariyyā). Changes: the voice comes 'from heaven' in Gen and 'from beneath her' in Q; Hagar fears for a living child, Maryam is in labor; Q adds the palm's dates."
      - with: hb-gen-16-hagar
        motif: miraculous-spring
        refs: ["19:22", "19:24"]
        with_refs: ["Gen 16:7", "Gen 16:8", "Gen 16:11"]
