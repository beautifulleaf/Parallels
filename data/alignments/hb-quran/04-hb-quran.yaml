  - unit: quran-14-abraham-prayer
    checked: [hb-gen-21-isaac-born-hagar-expelled, hb-isa-41-trial-of-the-gods, hb-zeph-3-jerusalem-and-restoration, hb-ezek-20-history-of-rebellion]
    matches:
      - with: hb-gen-21-isaac-born-hagar-expelled
        motif: offspring-settled-in-barren-valley-at-sacred-house
        refs: ["14:37"]
        with_refs: ["Gen 21:10", "Gen 21:11", "Gen 21:14", "Gen 21:21"]
        relation: divergence
        note: "Expulsion becomes settlement. Gen: Sarah demands gārēš hāʾāmâ hazzōʾt wəʾet-bənāh kî lōʾ yîraš; Abraham, grieved, sends Hagar off with bread and a skin of water, and she wanders bəmidbar bəʾēr šābaʿ, then Paran. Q: Abraham himself says innī askantu min dhurriyyatī bi-wādin ghayri dhī zarʿin ʿinda baytika l-muḥarram li-yuqīmū ṣ-ṣalāh. Sarah's motive and the inheritance quarrel are gone, and a sanctuary is added."
      - with: hb-gen-21-isaac-born-hagar-expelled
        motif: sons-in-old-age-ishmael-and-isaac
        refs: ["14:39"]
        with_refs: ["Gen 21:2", "Gen 21:5", "Gen 21:7", "Gen 21:13"]
        relation: divergence
        note: "Gen: the son of old age is Isaac alone (bēn lizqunāyw ... ben-məʾat šānâ), and Ishmael is set apart, kî bəyiṣḥāq yiqqārēʾ ləkā zāraʿ / gam ʾet-ben-hāʾāmâ ləgôy ʾăśîmennû. Q: Abraham thanks God for both as one gift of old age, wahaba lī ʿalā l-kibari Ismāʿīla wa-Isḥāq, Ishmael first."
      - with: hb-gen-21-isaac-born-hagar-expelled
        motif: abraham-prays-for-secure-city
        refs: ["14:37"]
        with_refs: ["Gen 21:15", "Gen 21:19"]
        relation: echo
        note: "Provision in the barren place: wayyipqaḥ ʾĕlōhîm ʾet-ʿênêhā wattēreʾ bəʾēr māyim (God answers Hagar's weeping); wa-rzuqhum mina th-thamarāt (Abraham asks for it in advance). Cf. the later Zamzam tradition, which links the two; it is not in either text."
  - unit: quran-14-day-of-reckoning
    checked: [hb-isa-40-comfort-my-people, hb-job-9-job-cannot-sue-god, hb-ps-44-national-lament, hb-ps-102-afflicted, hb-isa-65-new-heavens-new-earth, hb-isa-34-edom-and-lilith]
