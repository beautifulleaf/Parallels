      - with: hb-isa-14-helel-ben-shahar
        motif: iblis-expelled-and-cursed
        refs: ["15:33", "15:34", "15:35"]
        with_refs: ["Isa 14:12", "Isa 14:13", "Isa 14:14", "Isa 14:15"]
        relation: echo
        note: "ʾêk nāpaltā miššāmayim hêlēl ben-šāḥar ... wəʾattâ ʾāmartā bilbābkā haššāmayim ʾeʿĕleh ... ʾeddammeh ləʿelyôn ʾak ʾel-šəʾôl tûrād; lam akun li-asjuda li-basharin ... fa-khruj minhā fa-innaka rajīm. A proud being of heaven is cast down for its own self-exaltation. Isa's taunt is over the king of Babylon; Iblis's pride is against man, not God."
  - unit: quran-15-abraham-guests-lot
    checked: [hb-gen-19-sodom-destroyed, hb-gen-18-visitors-at-mamre, hb-judg-19-levites-concubine, hb-job-1-prologue-first-test, hb-ezek-22-city-of-blood]
