    matches:
      - with: hb-mal-3-book-of-remembrance
        motif: wretched-and-blessed-on-judgment-day
        refs: ["11:105", "11:106", "11:108"]
        with_refs: ["Mal 3:18", "Mal 3:19", "Mal 3:20"]
        relation: parallel
        note: "fa-minhum shaqiyyun wa-saʿīd ... fī n-nār ... fī l-janna; ûrəʾîtem bên ṣaddîq lərāšāʿ bên ʿōbēd ʾĕlōhîm laʾăšer lōʾ ʿăbādô, then the day bōʿēr kattannûr for the zēdîm and šemeš ṣədāqâ for those who fear: the coming day splits humanity into two groups. Mal's criterion is serving God; Q's is decreed (shaqiyy / saʿīd)."
      - with: hb-dan-12-resurrection-end
        motif: wretched-and-blessed-on-judgment-day
        refs: ["11:105", "11:107", "11:108"]
        with_refs: ["Dan 12:2"]
        relation: parallel
        note: "ʾēlleh ləḥayyê ʿôlām wəʾēlleh laḥărāpôt lədirʾôn ʿôlām; fa-minhum shaqiyyun wa-saʿīd ... khālidīna fīhā: two classes after the day, each for an age. Divergence in duration: Dan's ʿôlām is unqualified; Q qualifies both abodes 'mā dāmati s-samāwātu wa-l-arḍu illā mā shāʾa rabbuk'."
  - unit: quran-11-closing
    checked: [hb-ps-55-dove-wings, hb-dan-6-lions-den, hb-dan-3-4-tree-dream, hb-prov-16-sayings, hb-gen-18-abraham-bargains, hb-ezek-14-idols-in-heart-noah-daniel-job]
