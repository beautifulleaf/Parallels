  - unit: quran-18-dhul-qarnayn
    checked: [hb-ezek-38-gog-invasion, hb-ezek-39-gog-defeated-and-buried, hb-isa-24-world-judgment, hb-ezek-7-the-end, hb-dan-8-ram-and-goat]
