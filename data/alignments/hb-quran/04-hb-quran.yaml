  - unit: quran-21-abraham-idols-fire
    checked: [hb-judg-6-jerubbaal-fleece, hb-dan-3-golden-image-furnace, hb-josh-24-shechem-covenant, hb-exod-32-tablets-broken-levites, hb-gen-12-call-of-abram]
