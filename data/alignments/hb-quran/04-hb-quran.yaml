  - unit: quran-14-parables-and-satans-speech
    checked: [hb-ps-1-two-ways, hb-jer-17-two-ways-tree, hb-job-12-ask-the-beasts, hb-ps-85-righteousness-and-peace, hb-mal-3-book-of-remembrance]
