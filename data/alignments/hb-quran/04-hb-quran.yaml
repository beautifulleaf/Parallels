  - unit: quran-20-adam-iblis
    checked: [hb-gen-3-fall-expulsion, hb-gen-2-eden-adam-woman, hb-prov-15-sayings, hb-ps-78-history]
    matches:
      - with: hb-gen-2-eden-adam-woman
        motif: adam-forgot-covenant
        refs: ["20:115"]
        with_refs: ["Gen 2:16", "Gen 2:17"]
        relation: divergence
        note: "wayṣaw YHWH ʾĕlōhîm ʿal-hāʾādām ... ûmēʿēṣ haddaʿat ṭôb wārāʿ lōʾ tōʾkal mimmennû kî bəyôm ʾăkolkā mimmennû môt tāmût; wa-la-qad ʿahidnā ilā Ādama min qablu fa-nasiya wa-lam najid lahu ʿazmā. Gen gives a command with a death sanction; Q gives a covenant that Adam forgets. Q frames the fault as forgetting and lack of resolve, and has no death threat."
      - with: hb-gen-2-eden-adam-woman
        motif: garden-without-hunger-thirst-nakedness-heat
        refs: ["20:118", "20:119"]
        with_refs: ["Gen 2:25"]
        relation: divergence
        note: "Reversal. Gen: in the garden they are naked and unashamed, wayyihyû šənêhem ʿărûmmîm ... wəlōʾ yitbōšāšû. Q: in the garden Adam is promised he will not be naked, inna laka allā tajūʿa fīhā wa-lā taʿrā. Nakedness is innocence in Gen and a deprivation the garden protects from in Q."
      - with: hb-gen-3-fall-expulsion
        motif: serpent-tempter
        refs: ["20:116", "20:117", "20:120"]
        with_refs: ["Gen 3:1", "Gen 3:4"]
        relation: divergence
        note: "Who tempts whom. Gen: wəhannāḥāš hāyâ ʿārûm ... wayyōʾmer ʾel-hāʾiššâ, a clever beast addressing the woman. Q: fa-waswasa ilayhi sh-shayṭānu qāla yā Ādamu, Satan, already marked as enemy after refusing to bow (inna hādhā ʿaduwwun laka wa-li-zawjik), addressing Adam. The serpent and the woman as first addressee drop out."
      - with: hb-gen-3-fall-expulsion
        motif: tree-of-immortality-and-unending-kingdom
        refs: ["20:120"]
        with_refs: ["Gen 3:5", "Gen 3:22"]
        relation: divergence
        note: "What the tree offers. Gen: knowledge, wihyîtem kēʾlōhîm yōdəʿê ṭôb wārāʿ; immortality belongs to a second tree that God guards, pen-yišlaḥ yādô wəlāqaḥ gam mēʿēṣ haḥayyîm wəʾākal wāḥay ləʿōlām. Q: the tempter names the forbidden tree itself shajarati l-khuldi wa-mulkin lā yablā. Gen's two trees merge into one, and the lure becomes eternal life and kingship, not godlike knowledge."
      - with: hb-gen-3-fall-expulsion
        motif: eyes-opened-nakedness-known
        refs: ["20:121"]
        with_refs: ["Gen 3:6", "Gen 3:7"]
        relation: divergence
        note: "wattōʾkal wattittēn gam-ləʾîšāh ... wayyōʾkal wattippāqaḥnâ ʿênê šənêhem wayyēdəʿû kî ʿêrummim hēm wayyitpərû ʿălēh təʾēnâ; fa-akalā minhā fa-badat lahumā sawʾātuhumā wa-ṭafiqā yakhṣifāni ʿalayhimā min waraqi l-janna. Same sequence: eating, exposed nakedness, sewing leaves. Changes: in Gen the woman eats first and hands it on, while Q has both eat and puts the blame on Adam (wa-ʿaṣā Ādamu rabbahu fa-ghawā); fig leaves become just 'leaves of the garden'."
      - with: hb-gen-3-fall-expulsion
        motif: adam-receives-words-of-repentance
        refs: ["20:122"]
        with_refs: ["Gen 3:14", "Gen 3:17", "Gen 3:19"]
        relation: divergence
        note: "Gen goes from the eating straight to curses, ʾărûrâ hāʾădāmâ baʿăbûrekā ... kî-ʿāpār ʾattâ wəʾel-ʿāpār tāšûb, with no repentance and no forgiveness. Q puts election and forgiveness before the descent, thumma jtabāhu rabbuhu fa-tāba ʿalayhi wa-hadā. Adam's sin is forgiven, not cursed, and no death sentence follows."
      - with: hb-gen-3-fall-expulsion
        motif: enmity-serpent-and-woman-seed
        refs: ["20:123"]
        with_refs: ["Gen 3:15", "Gen 3:23", "Gen 3:24"]
        relation: divergence
        note: "wəʾêbâ ʾāšît bênkā ûbên hāʾiššâ ûbên zarʿăkā ûbên zarʿāh ... wayəšalləḥēhû ... waygāreš ʾet-hāʾādām; qāla hbiṭā minhā jamīʿan baʿḍukum li-baʿḍin ʿaduww. Enmity and expulsion. Gen's enmity is between serpent and woman and their seed, and the way back is barred by cherubim. Q's enmity is among those sent down, and Q adds a promise of guidance, fa-immā yaʾtiyannakum minnī hudan fa-mani ttabaʿa hudāya fa-lā yaḍillu wa-lā yashqā."
  - unit: quran-20-closing-exhortation
    checked: [hb-ps-113-raises-the-poor, hb-ps-44-national-lament, hb-exod-20-decalogue, hb-ps-17-apple-of-eye, hb-prov-24-words-of-wise]
