  - unit: quran-21-cosmic-signs-and-scales
    checked: [hb-gen-1-creation-six-days, hb-ps-74-leviathan, hb-ps-104-creation-hymn, hb-isa-40-comfort-my-people, hb-job-38-whirlwind-creation, hb-ps-19-heavens-and-torah, hb-job-31-oath-of-innocence, hb-ps-89-ethan-davidic-covenant]
