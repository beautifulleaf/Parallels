        note: "wayyimṣāʾāh malʾak YHWH ʿal-ʿên hammayim bammidbār ... hinnāk hārâ wəyōladt bēn; fa-ntabadhat bihi makānan qaṣiyyan ... jaʿala rabbuki taḥtaki sariyyā: a pregnant woman alone, away from her people, met by a divine messenger at water."
      - with: hb-isa-7-immanuel
        motif: annunciation-to-virgin
        refs: ["19:19", "19:20", "19:21"]
        with_refs: ["Isa 7:14"]
        relation: divergence
        note: "hinnēh hāʿalmâ hārâ wəyōledet bēn wəqārāʾt šəmô ʿimmānûʾēl, given as an ʾôt to Ahaz; li-ahaba laki ghulāman zakiyyan ... lam yamsasnī basharun wa-lam aku baghiyyā ... wa-li-najʿalahu āyatan li-n-nās. Both call the child a sign (ʾôt / āya). Isa's ʿalmâ ('young woman') is not said to be untouched and the sign is political; Q states virginity outright and makes the child a sign 'for the people'."
      - with: hb-judg-13-samson-birth
        motif: divine-spirit-appears-as-perfect-man
        refs: ["19:17", "19:19"]
        with_refs: ["Judg 13:3", "Judg 13:6"]
        relation: echo
        note: "ʾîš hāʾĕlōhîm bāʾ ʾēlay ûmarʾēhû kəmarʾēh malʾak hāʾĕlōhîm nôrāʾ məʾōd; fa-tamaththala lahā basharan sawiyyā ... innamā ana rasūlu rabbiki li-ahaba laki ghulāmā: God's messenger comes to a woman alone, looking like a man, to announce a son. Manoah's wife does not ask where he is from; Maryam takes refuge from him (aʿūdhu bi-r-Raḥmāni minka)."
      - with: hb-1sam-1-hannah
        motif: vow-of-silence
        refs: ["19:26"]
        with_refs: ["1Sam 1:11"]
        relation: divergence
        note: "wattiddōr neder ... ûnətattîw laYHWH kol-yəmê ḥayyāyw; innī nadhartu li-r-Raḥmāni ṣawman fa-lan ukallima l-yawma insiyyā: a mother's vow (neder / nadhr, cognate) bound up with her child. Hannah vows the child to God; Maryam vows silence and lets the child speak for her."
  - unit: quran-19-abraham-and-his-father
    checked: [hb-ps-135-hymn-of-election, hb-ps-115-not-to-us, hb-judg-6-jerubbaal-fleece, hb-exod-34-thirteen-attributes-covenant-renewal, hb-exod-6-name-and-levite-genealogy, hb-josh-24-shechem-covenant, hb-gen-12-call-of-abram]
    matches:
      - with: hb-josh-24-shechem-covenant
        motif: father-serves-idols
        refs: ["19:42", "19:46"]
        with_refs: ["Josh 24:2"]
        relation: parallel
        note: "bəʿēber hannāhār yāšəbû ʾăbôtêkem mēʿôlām teraḥ ʾăbî ʾabrāhām ... wayyaʿabdû ʾĕlōhîm ʾăḥērîm; yā abati lima taʿbudu mā lā yasmaʿu wa-lā yubṣir ... a-rāghibun anta ʿan ālihatī: Abraham's father worshipped other gods. Josh states it in one line; Q turns it into a dialogue of four pleas and a threat of stoning."
      - with: hb-josh-24-shechem-covenant
        motif: grandson-as-extra-gift
        refs: ["19:49"]
        with_refs: ["Josh 24:3", "Josh 24:4"]
        relation: divergence
        note: "wāʾetten-lô ʾet-yiṣḥāq wāʾetten ləyiṣḥāq ʾet-yaʿăqōb wəʾet-ʿēśāw; wahabnā lahu Isḥāqa wa-Yaʿqūb: the line passes Isaac, then Jacob. Josh gives Jacob (and Esau) to Isaac; Q gives Isaac and Jacob both to Abraham, as a reward for leaving his people, and drops Esau."
      - with: hb-gen-12-call-of-abram
        motif: abraham-separates-from-his-people
        refs: ["19:48", "19:49"]
        with_refs: ["Gen 12:1"]
        relation: divergence
        note: "Gen: God commands the departure, lek-ləkā mēʾarṣəkā ûmimmôladtəkā ûmibbêt ʾābîkā, with no reason given. Q: Abraham withdraws after his father rejects him and threatens to stone him (la-arjumannaka wa-hjurnī maliyyā): wa-aʿtazilukum wa-mā tadʿūna min dūni llāh. A divine call becomes a break over idolatry."
      - with: hb-judg-6-jerubbaal-fleece
        motif: father-threatens-to-stone-son
        refs: ["19:46"]
        with_refs: ["Judg 6:30", "Judg 6:31"]
        relation: contrast
        note: "A son against his father's gods. In Judg the townsmen demand hôṣēʾ ʾet-binkā wəyāmōt, and the idolatrous father Joash protects his son: ʾim-ʾĕlōhîm hûʾ yāreb lô. In Q the father himself threatens the son, la-in lam tantahi la-arjumannaka. The father's role is reversed."
      - with: hb-ps-115-not-to-us
        motif: idols-cannot-see-hear-eat-smell
        refs: ["19:42"]
        with_refs: ["Ps 115:5", "Ps 115:6"]
        relation: parallel
        note: "ʿênayim lāhem wəlōʾ yirʾû ʾoznayim lāhem wəlōʾ yišmāʿû; lima taʿbudu mā lā yasmaʿu wa-lā yubṣiru wa-lā yughnī ʿanka shayʾā."
      - with: hb-ps-135-hymn-of-election
        motif: idols-cannot-see-hear-eat-smell
        refs: ["19:42"]
        with_refs: ["Ps 135:16", "Ps 135:17"]
        relation: parallel
        note: "ʿênayim lāhem wəlōʾ yirʾû ʾoznayim lāhem wəlōʾ yaʾăzînû; mā lā yasmaʿu wa-lā yubṣir."
  - unit: quran-19-prophets-remembered
    checked: [hb-gen-5-adam-to-noah, hb-exod-7-staff-swallows-staffs, hb-exod-4-signs-aaron-bridegroom-of-blood, hb-jer-33-branch-and-cosmic-covenant, hb-exod-3-burning-bush, hb-isa-1-indictment-of-judah, hb-exod-33-tent-and-glory, hb-judg-2-bochim-cycle]
