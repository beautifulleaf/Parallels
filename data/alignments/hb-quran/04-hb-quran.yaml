        refs: ["19:88", "19:89", "19:92", "19:93"]
        with_refs: ["Ps 2:7"]
        relation: response
        note: "bənî ʾattâ ʾănî hayyôm yəlidtîkā, God's decree naming the king his begotten son; wa-qālū ttakhadha r-Raḥmānu waladan la-qad jiʾtum shayʾan iddā ... wa-mā yanbaghī li-r-Raḥmāni an yattakhidha waladā in kullu man fī s-samāwāti wa-l-arḍi illā ātī r-Raḥmāni ʿabdā. Q's direct target is the Christian claim about Jesus (19:34-35), but it rejects the very category the psalm uses. Every being comes to God as ʿabd, never as son."
      - with: hb-ps-89-ethan-davidic-covenant
        motif: claim-that-rahman-took-a-son
        refs: ["19:88", "19:92", "19:93"]
        with_refs: ["Ps 89:27", "Ps 89:28"]
