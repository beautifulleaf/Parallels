        note: "illā qalīlan mimman anjaynā minhum (the few who forbade fasād were rescued); hēmmâ bəṣidqātām yənaṣṣəlû napšām: when the land sins, only the righteous save themselves. Ezek denies they could save others; Q laments there were not more such ūlū baqiyya."
