      - with: hb-dan-3-4-tree-dream
        motif: good-deeds-remove-bad-deeds
        refs: ["11:114"]
        with_refs: ["Dan 4:24"]
        relation: parallel
        note: "inna l-ḥasanāti yudhhibna s-sayyiʾāt; waḥăṭāʾāk bəṣidqâ pərūq waʿăwāyātāk bəmiḥan ʿănāyin: righteousness/almsgiving removes (redeems) sins."
      - with: hb-prov-16-sayings
        motif: good-deeds-remove-bad-deeds
        refs: ["11:114"]
        with_refs: ["Prov 16:6"]
        relation: parallel
        note: "inna l-ḥasanāti yudhhibna s-sayyiʾāt; bəḥesed weʾĕmet yəkuppar ʿāwōn: good conduct expiates iniquity."
