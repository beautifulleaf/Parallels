        motif: all-creation-glorifies-god
        refs: ["17:44"]
        with_refs: ["Ps 148:1", "Ps 148:2", "Ps 148:3", "Ps 148:4", "Ps 148:7", "Ps 148:8", "Ps 148:9", "Ps 148:10"]
        relation: parallel
        note: "tusabbiḥu lahu s-samāwātu s-sabʿu wa-l-arḍu wa-man fīhinna wa-in min shayʾin illā yusabbiḥu bi-ḥamdih; hallûhû ... šəmê haššāmāyim ... min-hāʾāreṣ tannînîm ... ʾēš ûbārād ... hehārîm ... ʿēṣ pərî: heavens, earth and everything in them, living or not, praise God. Ps calls on them to praise; Q states that they already do."
      - with: hb-ps-150-final-hallelujah
        motif: everything-that-breathes-praise
        refs: ["17:44"]
        with_refs: ["Ps 150:6"]
        relation: divergence
        note: "kōl hannəšāmâ təhallēl yāh, limited to what breathes; wa-in min shayʾin illā yusabbiḥu bi-ḥamdih, every thing whatever. Ps ends with a command; Q states a fact."
      - with: hb-ps-19-heavens-and-torah
        motif: all-creation-glorifies-god
        refs: ["17:44"]
        with_refs: ["Ps 19:2", "Ps 19:3", "Ps 19:4"]
        relation: parallel
        note: "haššāmayim məsappərîm kəbôd-ʾēl ... ʾên ʾōmer wəʾên dəbārîm bəlî nišmāʿ qôlām; tusabbiḥu lahu s-samāwātu ... wa-lākin lā tafqahūna tasbīḥahum: the heavens praise God in a speech humans cannot hear. Ps says their voice goes out through all the earth anyway (bəkol-hāʾāreṣ yāṣāʾ qawwām); Q says people do not understand it."
      - with: hb-ps-89-ethan-davidic-covenant
        motif: other-gods-would-seek-way-to-throne
        refs: ["17:42", "17:57"]
