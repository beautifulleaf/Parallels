  - unit: quran-17-moses-nine-signs-and-close
    checked: [hb-ps-78-history, hb-neh-8-ezra-reads-torah, hb-exod-14-crossing-of-the-sea, hb-isa-8-maher-shalal-and-stone-of-stumbling, hb-deut-18-levites-prophet, hb-ezek-13-false-prophets-and-prophetesses, hb-ps-105-history, hb-isa-28-covenant-with-death, hb-1sam-1-hannah]
