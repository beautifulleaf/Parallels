        motif: human-formed-from-earth
        refs: ["15:26", "15:28"]
        with_refs: ["Gen 2:7"]
        relation: parallel
        note: "wayyîṣer YHWH ʾĕlōhîm ʾet-hāʾādām ʿāpār min-hāʾădāmâ; khalaqnā l-insāna min ṣalṣālin min ḥamaʾin masnūn. Gen has dust from the ground; Q has ringing clay of black mud, and God announces the act to the angels beforehand (innī khāliqun basharan), which Gen does not have."
