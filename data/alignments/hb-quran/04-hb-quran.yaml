        note: "Abraham asks hăšōpēṭ kol-hāʾāreṣ lōʾ yaʿăśeh mišpāṭ, ḥālilâ ... ləhāmît ṣaddîq ʿim-rāšāʿ; Q states it as settled divine principle: wa-mā kāna rabbuka li-yuhlika l-qurā bi-ẓulmin wa-ahluhā muṣliḥūn. Abraham's question becomes God's own axiom, without bargaining."
      - with: hb-ezek-14-idols-in-heart-noah-daniel-job
        motif: righteous-few-alone-saved
        refs: ["11:116"]
        with_refs: ["Ezek 14:13", "Ezek 14:14"]
