      - with: hb-lev-19-holiness-code-a
        motif: retaliation-in-kind-but-patience-better
        refs: ["16:126", "16:127"]
        with_refs: ["Lev 19:18"]
        relation: echo
        note: "lōʾ-tiqqōm wəlōʾ-tiṭṭōr ʾet-bənê ʿammekā; wa-la-in ṣabartum la-huwa khayr ... wa-ṣbir: restraint from revenge is better. Lev limits it to 'the sons of your people' and grounds it in love of neighbor; Q states it in general and grounds it in patience 'by God'."
