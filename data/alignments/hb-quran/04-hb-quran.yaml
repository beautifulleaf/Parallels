        note: "hārəpāʾîm yəḥôlālû mittaḥat mayim ... ʿārôm šəʾôl negdô wəʾên kəsût lāʾăbaddôn; lahu mā fī s-samāwāti ... wa-mā taḥta th-tharā: even what lies under the ground lies open to God. Job names the shades and Sheol; Q says only 'beneath the moist soil'."
