  - unit: quran-12-joseph-full
    checked: [hb-gen-31-flight-from-laban, hb-gen-6-flood, hb-gen-37-joseph-dreams-sold, hb-gen-39-joseph-potiphar-wife, hb-gen-42-brothers-first-journey, hb-gen-45-joseph-reveals-himself, hb-gen-40-prisoners-dreams, hb-gen-41-pharaoh-dreams-joseph-viceroy, hb-gen-43-second-journey-feast, hb-gen-44-silver-cup-judah-plea, hb-gen-46-descent-seventy-souls, hb-gen-48-ephraim-manasseh-blessing, hb-gen-50-jacob-burial-joseph-death, hb-gen-27-stolen-blessing]
    matches:
      - with: hb-gen-37-joseph-dreams-sold
        motif: dream-heavenly-bodies-bow
        refs: ["12:4"]
        with_refs: ["Gen 37:9"]
        relation: parallel
        note: "aḥada ʿashara kawkaban wa-sh-shamsa wa-l-qamara raʾaytuhum lī sājidīn; haššemeš wəhayyārēaḥ wəʾaḥad ʿāśār kôkābîm mištaḥăwîm lî: same eleven stars, sun and moon bowing. Q omits the first dream of the sheaves (Gen 37:7)."
      - with: hb-gen-37-joseph-dreams-sold
        motif: father-rebukes-dream
        refs: ["12:5", "12:6"]
        with_refs: ["Gen 37:10", "Gen 37:11"]
        relation: divergence
        note: "Reversal of the father's response. Gen: Joseph tells father and brothers (wayəsappēr ʾel-ʾābîw wəʾel-ʾeḥāyw), and the father rebukes him (wayyigʿar-bô ʾābîw: hăbôʾ nābôʾ ʾănî wəʾimməkā ...?). Q: Joseph tells only his father, who warns 'lā taqṣuṣ ruʾyāka ʿalā ikhwatika fa-yakīdū laka kaydā' and interprets the dream as election: yajtabīka rabbuka wa-yuʿallimuka min taʾwīli l-aḥādīth."
      - with: hb-gen-37-joseph-dreams-sold
        motif: father-favors-son
        refs: ["12:8"]
        with_refs: ["Gen 37:3", "Gen 37:4"]
        relation: divergence
        note: "Gen: the narrator states it, wəyiśrāʾēl ʾāhab ʾet-yôsēp mikkol-bānāyw kî ben-zəqunîm, and gives the kətōnet passîm as its sign. Q: only the brothers say it, and of two sons: la-Yūsufu wa-akhūhu aḥabbu ilā abīnā minnā ... inna abānā la-fī ḍalālin mubīn. The coat as token of favoritism is dropped; the shirt (qamīṣ) returns only as evidence."
      - with: hb-gen-37-joseph-dreams-sold
        motif: brothers-plot-death
        refs: ["12:9"]
        with_refs: ["Gen 37:18", "Gen 37:20"]
        relation: divergence
        note: "Gen: ləkû wənahargēhû wənašlikēhû bəʾaḥad habbōrôt ... wənirʾeh mah-yyihyû ḥălōmōtāyw (to defeat the dreams). Q: uqtulū Yūsufa awi ṭraḥūhu arḍan yakhlu lakum wajhu abīkum wa-takūnū min baʿdihi qawman ṣāliḥīn: the motive is the father's face, and the plotters plan to become righteous afterwards."
      - with: hb-gen-37-joseph-dreams-sold
        motif: one-brother-dissuades-killing
        refs: ["12:10"]
        with_refs: ["Gen 37:21", "Gen 37:22", "Gen 37:26", "Gen 37:27"]
        relation: divergence
        note: "Gen names two brothers: Reuben (ʾal-tišpəkû-dām, hašlîkû ʾōtô ʾel-habbôr hazzeh, meaning to restore him) and Judah (mah-beṣaʿ ... ləkû wənimkərennû layyišməʿēʾlîm). Q leaves one speaker unnamed, qāʾilun minhum, and merges both: throw him into ghayābati l-jubb so that baʿḍu s-sayyāra will pick him up."
      - with: hb-gen-37-joseph-dreams-sold
        motif: father-sends-son-to-brothers
        refs: ["12:11", "12:12", "12:13"]
        with_refs: ["Gen 37:13", "Gen 37:14"]
        relation: divergence
        note: "Reversal of initiative. Gen: Israel himself sends Joseph, ləkâ wəʾešlāḥăkā ʾălêhem ... rəʾēh ʾet-šəlôm ʾaḥêkā. Q: the brothers ask (arsilhu maʿanā ghadan yartaʿ wa-yalʿab) and the father is reluctant: innī la-yaḥzununī an tadhhabū bihi."
      - with: hb-gen-37-joseph-dreams-sold
        motif: wild-animal-blamed
        refs: ["12:13", "12:14", "12:17"]
        with_refs: ["Gen 37:20", "Gen 37:33"]
        relation: divergence
        note: "Gen: the brothers invent the beast, wəʾāmarnû ḥayyâ rāʿâ ʾăkālātəhû, and Jacob draws the conclusion himself, ṭārōp ṭōrap yôsēp. Q: Jacob voices the fear first, akhāfu an yaʾkulahu dh-dhiʾbu, and the brothers take up his words: fa-akalahu dh-dhiʾb. The vague ḥayyâ rāʿâ becomes the wolf."
      - with: hb-gen-37-joseph-dreams-sold
        motif: cast-into-pit
        refs: ["12:15", "12:19"]
        with_refs: ["Gen 37:24"]
        relation: divergence
        note: "Gen: wəhabbôr rēq ʾên bô māyim, a dry pit. Q: a well with water, ghayābati l-jubb, where the caravan's water-drawer lowers his bucket (fa-adlā dalwah). Q also adds a revelation to Joseph in the pit, wa-awḥaynā ilayhi la-tunabbiʾannahum bi-amrihim hādhā; God is not mentioned in Gen 37."
      - with: hb-gen-37-joseph-dreams-sold
        motif: bloodied-garment-deception
        refs: ["12:18"]
        with_refs: ["Gen 37:31", "Gen 37:32"]
        relation: parallel
        note: "wa-jāʾū ʿalā qamīṣihi bi-damin kadhib; wayyišḥăṭû śəʿîr ʿizzîm wayyiṭbəlû ʾet-hakkuttōnet baddām: the garment in false blood brought to the father."
      - with: hb-gen-37-joseph-dreams-sold
        motif: father-believes-and-mourns
        refs: ["12:18"]
        with_refs: ["Gen 37:33", "Gen 37:34", "Gen 37:35"]
        relation: divergence
        note: "Reversal. Gen: Jacob recognizes the coat and believes, ṭārōp ṭōrap yôsēp, rends his clothes and refuses comfort, wayəmāʾēn ləhitnaḥēm ... ʾērēd ʾel-bənî ʾābēl šəʾōlâ. Q: Jacob sees through the lie, bal sawwalat lakum anfusukum amran, and answers with fa-ṣabrun jamīlun wa-llāhu l-mustaʿān."
      - with: hb-gen-37-joseph-dreams-sold
        motif: sold-for-paltry-price
        refs: ["12:19", "12:20"]
        with_refs: ["Gen 37:25", "Gen 37:28"]
        relation: divergence
        note: "Gen: the brothers sell him, wayyimkərû ʾet-yôsēp layyišməʿēʾlîm bəʿeśrîm kāsep. Q: a passing sayyāra finds him (yā bushrā hādhā ghulām), hides him as merchandise (asarrūhu biḍāʿa) and sells him bi-thamanin bakhsin darāhima maʿdūda. The brothers are not the sellers."
      - with: hb-gen-37-joseph-dreams-sold
        motif: bought-by-egyptian-official
        refs: ["12:21"]
        with_refs: ["Gen 37:36"]
        relation: divergence
        note: "Gen names him, pôṭîpar sərîs parʿōh śar haṭṭabbāḥîm. Q leaves him unnamed, alladhī shtarāhu min Miṣr, later al-ʿAzīz (12:30), and has him plan adoption: ʿasā an yanfaʿanā aw nattakhidhahu waladā."
      - with: hb-gen-39-joseph-potiphar-wife
        motif: divine-favor-in-servitude
        refs: ["12:21", "12:22"]
        with_refs: ["Gen 39:2", "Gen 39:3", "Gen 39:21"]
        relation: parallel
        note: "wayhî YHWH ʾet-yôsēp wayhî ʾîš maṣlîaḥ; wa-ka-dhālika makkannā li-Yūsufa fī l-arḍ ... ātaynāhu ḥukman wa-ʿilmā: God's favor rests on the slave."
      - with: hb-gen-39-joseph-potiphar-wife
        motif: masters-wife-seduces
        refs: ["12:23"]
        with_refs: ["Gen 39:7", "Gen 39:10", "Gen 39:11"]
        relation: parallel
        note: "wa-rāwadathu llatī huwa fī baytihā ʿan nafsihi wa-ghallaqati l-abwāba wa-qālat hayta lak; wattiśśāʾ ʾēšet-ʾădōnāyw ʾet-ʿênêhā ... šikbâ ʿimmî, wəʾên ʾîš mēʾanšê habbayit šām: the master's wife, alone with him in the house."
      - with: hb-gen-39-joseph-potiphar-wife
        motif: hero-refuses-citing-master-and-god
        refs: ["12:23"]
        with_refs: ["Gen 39:8", "Gen 39:9"]
        relation: parallel
        note: "maʿādha llāhi innahu rabbī aḥsana mathwāy; hēn ʾădōnî lōʾ-yādaʿ ʾittî ... wəḥāṭāʾtî lēʾlōhîm: loyalty to the master and to God. Q's rabbī can mean either."
      - with: hb-gen-39-joseph-potiphar-wife
        motif: hero-nearly-yields-sign-intervenes
        refs: ["12:24"]
        with_refs: ["Gen 39:8", "Gen 39:10"]
        relation: divergence
        note: "Addition. Gen: Joseph refuses at once and every day, wayəmāʾēn ... wəlōʾ-šāmaʿ ʾēlêhā. Q: wa-la-qad hammat bihi wa-hamma bihā lawlā an raʾā burhāna rabbih: he was on the point of yielding, and only God's sign stops him."
      - with: hb-gen-39-joseph-potiphar-wife
        motif: garment-evidence-in-seduction
        refs: ["12:25", "12:26", "12:27", "12:28"]
        with_refs: ["Gen 39:12", "Gen 39:13", "Gen 39:16", "Gen 39:18"]
        relation: divergence
        note: "Reversal of what the garment proves. Gen: she seizes his garment (wattitpəśēhû bəbigdô), he leaves it in her hand, and she keeps it to accuse him (wattannaḥ bigdô ʾeṣlāh). Q: she tears his shirt from behind (qaddat qamīṣahu min dubur), and the tear clears him: in kāna qamīṣuhu qudda min dubur fa-kadhabat."
      - with: hb-gen-39-joseph-potiphar-wife
        motif: false-accusation-by-wife
        refs: ["12:25", "12:28", "12:29"]
        with_refs: ["Gen 39:14", "Gen 39:17", "Gen 39:19", "Gen 39:20"]
        relation: divergence
        note: "Gen: the master believes his wife, wayyiḥar ʾappô, and jails Joseph at once. Q: the master finds both at the door (wa-alfayā sayyidahā ladā l-bāb), accepts the shirt-test of a witness min ahlihā, and blames her: innahu min kaydikunna inna kaydakunna ʿaẓīm ... wa-staghfirī li-dhanbiki. Gen's ʾîš ʿibrî ... ləṣaḥeq bānû (the foreign slave) is absent."
      - with: hb-gen-39-joseph-potiphar-wife
        motif: hero-beautiful
        refs: ["12:31"]
        with_refs: ["Gen 39:6"]
        relation: parallel
        note: "wayhî yôsēp yəpēh-tōʾar wîpēh marʾeh; mā hādhā basharan in hādhā illā malakun karīm. Q adds the women's banquet where they cut their hands."
      - with: hb-gen-39-joseph-potiphar-wife
        motif: hero-imprisoned
        refs: ["12:32", "12:33", "12:35"]
        with_refs: ["Gen 39:20"]
        relation: divergence
        note: "Gen: the master's anger puts him in bêt hassōhar. Q: Joseph chooses prison himself, rabbi s-sijnu aḥabbu ilayya mimmā yadʿūnanī ilayh, and they jail him later, min baʿdi mā raʾawu l-āyāt, ḥattā ḥīn: prison is his choice and a cover-up, not a punishment."
      - with: hb-gen-40-prisoners-dreams
        motif: prisoners-dreams-wine-bread
        refs: ["12:36"]
        with_refs: ["Gen 40:9", "Gen 40:11", "Gen 40:16", "Gen 40:17"]
        relation: parallel
        note: "aʿṣiru khamran / aḥmilu fawqa raʾsī khubzan taʾkulu ṭ-ṭayru minh; wāʾeśḥaṭ ʾōtām ʾel-kôs parʿōh / šəlōšâ sallê ḥōrî ʿal-rōʾšî ... wəhāʿôp ʾōkēl ʾōtām. Q makes them two fatayān and drops their offices (śar hammašqîm, śar hāʾôpîm) and the three branches and baskets."
      - with: hb-gen-40-prisoners-dreams
        motif: interpretation-from-god
        refs: ["12:37", "12:38", "12:39", "12:40"]
        with_refs: ["Gen 40:8"]
        relation: divergence
        note: "Gen: one sentence, hălôʾ lēʾlōhîm pitrōnîm. Q: dhālikumā mimmā ʿallamanī rabbī, followed by a sermon added before the interpretation: millata ābāʾī Ibrāhīma wa-Isḥāqa wa-Yaʿqūb ... a-arbābun mutafarriqūna khayrun ami llāhu l-wāḥidu l-qahhār. The dream scene becomes a call to monotheism."
      - with: hb-gen-40-prisoners-dreams
        motif: one-executed-one-restored
        refs: ["12:41"]
        with_refs: ["Gen 40:13", "Gen 40:19", "Gen 40:21", "Gen 40:22"]
        relation: parallel
        note: "fa-yasqī rabbahu khamran wa-ammā l-ākharu fa-yuṣlabu fa-taʾkulu ṭ-ṭayru min raʾsih; wətālâ ʾôtəkā ʿal-ʿēṣ wəʾākal hāʿôp ʾet-bəśārəkā. Q drops the three-day term and the pun yiśśāʾ parʿōh ʾet-rōʾšəkā."
      - with: hb-gen-40-prisoners-dreams
        motif: freed-prisoner-forgets
        refs: ["12:42"]
        with_refs: ["Gen 40:14", "Gen 40:23"]
        relation: divergence
        note: "Gen: the cupbearer simply forgets, wəlōʾ-zākar ... wayyiškāḥēhû. Q names an agent, fa-ansāhu sh-shayṭānu dhikra rabbih (ambiguous: he forgot to mention Joseph to his master, or Joseph forgot his Lord). Gen's šənātayim yāmîm (41:1) becomes biḍʿa sinīn."
      - with: hb-gen-41-pharaoh-dreams-joseph-viceroy
        motif: king-dream-cows-and-ears
        refs: ["12:43"]
        with_refs: ["Gen 41:2", "Gen 41:3", "Gen 41:4", "Gen 41:5", "Gen 41:6", "Gen 41:7"]
        relation: parallel
        note: "sabʿa baqarātin simānin yaʾkuluhunna sabʿun ʿijāfun wa-sabʿa sunbulātin khuḍrin wa-ukhara yābisāt; šebaʿ pārôt ... bərîʾōt bāśār / daqqôt bāśār; šebaʿ šibbŏlîm. The dreamer is al-malik in Q, not Pharaoh, although the Moses story in Q has Firʿawn."
      - with: hb-gen-41-pharaoh-dreams-joseph-viceroy
        motif: court-experts-fail
        refs: ["12:44"]
        with_refs: ["Gen 41:8"]
        relation: divergence
        note: "Gen: kol-ḥarṭummê miṣrayim ... wəʾên-pôtēr ʾôtām: they cannot interpret. Q: they dismiss the dream, aḍghāthu aḥlāmin wa-mā naḥnu bi-taʾwīli l-aḥlāmi bi-ʿālimīn."
      - with: hb-gen-41-pharaoh-dreams-joseph-viceroy
        motif: cupbearer-recalls-hero
        refs: ["12:45", "12:46"]
        with_refs: ["Gen 41:9", "Gen 41:12", "Gen 41:14"]
        relation: divergence
        note: "Gen: Joseph is rushed out at once (wayərîṣuhû min-habbôr waygallaḥ) and interprets before Pharaoh. Q: the freed man (wa-ddakara baʿda umma) goes to Joseph in prison, yā Yūsufu ayyuhā ṣ-ṣiddīq, and Joseph interprets from inside it."
      - with: hb-gen-41-pharaoh-dreams-joseph-viceroy
        motif: famine-grain-storage-plan
        refs: ["12:47", "12:48", "12:49"]
        with_refs: ["Gen 41:34", "Gen 41:35", "Gen 41:36"]
        relation: divergence
        note: "Gen: officers collect a fifth (wəḥimmēš ʾet-ʾereṣ miṣrayim) and store bār in the cities. Q: leave the harvest in its ears, fa-dharūhu fī sunbulihi, and Q adds a year of relief that Gen does not have, ʿāmun fīhi yughāthu n-nāsu wa-fīhi yaʿṣirūn."
      - with: hb-gen-41-pharaoh-dreams-joseph-viceroy
        motif: hero-demands-vindication
        refs: ["12:50", "12:51", "12:52"]
        with_refs: ["Gen 41:14"]
        relation: divergence
        note: "Reversal. Gen: Joseph is hurried from the pit, shaved and changed (wayərîṣuhû ... waygallaḥ wayḥallēp śimlōtāyw). Q: summoned (iʾtūnī bihi), he refuses to leave, irjiʿ ilā rabbika fa-sʾalhu mā bālu n-niswati llātī qaṭṭaʿna aydiyahunn, until the wife confesses, al-āna ḥaṣḥaṣa l-ḥaqq."
      - with: hb-gen-41-pharaoh-dreams-joseph-viceroy
        motif: hero-appointed-over-storehouses
        refs: ["12:54", "12:55", "12:56"]
        with_refs: ["Gen 41:33", "Gen 41:39", "Gen 41:40", "Gen 41:41", "Gen 41:42"]
        relation: divergence
        note: "Gen: Pharaoh appoints him after Joseph advises seeking ʾîš nābôn wəḥākām (ʾattâ tihyeh ʿal-bêtî ... rəʾēh nātattî ʾōtəkā ʿal kol-ʾereṣ miṣrayim), with ring, linen and chariot. Q: Joseph asks for the post himself, ijʿalnī ʿalā khazāʾini l-arḍi innī ḥafīẓun ʿalīm. The king's investiture, the name ṣāpnat paʿnēaḥ and the wife ʾāsnat bat-pôṭî peraʿ (41:45) are left out."
      - with: hb-gen-42-brothers-first-journey
        motif: brothers-come-unrecognizing
        refs: ["12:58"]
        with_refs: ["Gen 42:7", "Gen 42:8"]
        relation: echo
        note: "fa-ʿarafahum wa-hum lahu munkirūn; wayyakkirēm wayyitnakkēr ʾălêhem ... wəhēm lōʾ hikkiruhû. Same root n-k-r on both sides, in opposite senses: in Gen Joseph makes himself strange (wayyitnakkēr), in Q the brothers fail to recognize him (munkirūn)."
      - with: hb-gen-42-brothers-first-journey
        motif: spy-accusation
        refs: ["12:59", "12:60"]
        with_refs: ["Gen 42:9", "Gen 42:14", "Gen 42:17", "Gen 42:19"]
        relation: divergence
        note: "Omission of the harshness. Gen: wayədabbēr ʾittām qāšôt, məraggəlîm ʾattem, three days in custody, one brother bound. Q: no spy charge. Joseph is a generous host, a-lā tarawna annī ūfī l-kayla wa-ana khayru l-munzilīn, and the only threat is fa-lā kayla lakum ʿindī."
      - with: hb-gen-42-brothers-first-journey
        motif: money-returned-in-sacks
        refs: ["12:62", "12:65"]
        with_refs: ["Gen 42:25", "Gen 42:28", "Gen 42:35"]
        relation: divergence
        note: "Reversed reaction. Gen: on finding the silver they are terrified, wayyēṣēʾ libbām wayyeḥerdû ... mah-zzōʾt ʿāśâ ʾĕlōhîm lānû. Q: they are glad, yā abānā mā nabghī hādhihi biḍāʿatunā ruddat ilaynā. Q also gives Joseph's motive, laʿallahum yarjiʿūn."
      - with: hb-gen-42-brothers-first-journey
        motif: father-reluctant-youngest
        refs: ["12:63", "12:64"]
        with_refs: ["Gen 42:36", "Gen 42:38"]
        relation: divergence
        note: "Gen: grief and blame, ʾōtî šikkaltem ... lōʾ-yērēd bənî ʿimmākem ... wəhôradtem ʾet-śêbātî bəyāgôn šəʾôlâ. Q: hal āmanukum ʿalayhi illā ka-mā amintukum ʿalā akhīhi min qabl, fa-llāhu khayrun ḥāfiẓan: the father turns to trust in God."
      - with: hb-gen-42-brothers-first-journey
        motif: one-brother-left-in-egypt
        refs: ["12:80"]
        with_refs: ["Gen 42:19", "Gen 42:24"]
        relation: divergence
        note: "Gen: Joseph takes Simeon as hostage on the first journey, wayyiqqaḥ mēʾittām ʾet-šimʿôn wayyeʾĕsōr ʾōtô. Q: on the second journey the eldest stays of his own will after the cup affair, qāla kabīruhum ... fa-lan abraḥa l-arḍa ḥattā yaʾdhana lī abī."
      - with: hb-gen-43-second-journey-feast
        motif: pledge-to-father
        refs: ["12:66"]
        with_refs: ["Gen 43:9"]
        relation: divergence
        note: "Gen: Judah alone stands surety, ʾānōkî ʾeʿerbennû miyyādî təbaqšennû (Reuben's offer of his two sons, Gen 42:37, comes before). Q: all the brothers give a God-sworn compact, ḥattā tuʾtūni mawthiqan mina llāh ... allāhu ʿalā mā naqūlu wakīl."
      - with: hb-gen-43-second-journey-feast
        motif: early-reveal-to-youngest
        refs: ["12:69"]
        with_refs: ["Gen 43:29", "Gen 43:30"]
        relation: divergence
        note: "Gen: Joseph sees Benjamin, blesses him (ʾĕlōhîm yoḥnəkā bənî), and hides his tears (nikmərû raḥămāyw ... wayyēbk šāmmâ), but stays unknown to him. Q: āwā ilayhi akhāhu qāla innī ana akhūka fa-lā tabtaʾis: Benjamin is told first and secretly, which makes the cup ruse a plan the two share."
      - with: hb-gen-44-silver-cup-judah-plea
        motif: planted-cup
        refs: ["12:70", "12:72"]
        with_refs: ["Gen 44:2", "Gen 44:5", "Gen 44:15"]
        relation: divergence
        note: "Gen: gəbîaʿ hakkesep, the cup in which my lord drinks and wəhûʾ naḥēš yənaḥēš bô (divination), and naḥēš yənaḥēš ʾîš ʾăšer kāmōnî. Q: as-siqāya / ṣuwāʿ al-malik, the king's drinking or measuring vessel, with no divination. Q adds a reward, ḥimlu baʿīrin wa-ana bihi zaʿīm."
      - with: hb-gen-44-silver-cup-judah-plea
        motif: theft-accusation-pursuit
        refs: ["12:70", "12:71", "12:73"]
        with_refs: ["Gen 44:4", "Gen 44:7", "Gen 44:8"]
        relation: parallel
        note: "adhdhana muʾadhdhinun ayyatuhā l-ʿīru innakum la-sāriqūn ... mā kunnā sāriqīn; lāmmâ šillamtem rāʿâ taḥat ṭôbâ ... ḥālîlâ laʿăbādêkā ... wəʾêk nignōb: the pursuit, the charge and the protest of innocence."
      - with: hb-gen-44-silver-cup-judah-plea
        motif: thief-penalty-set-by-brothers
        refs: ["12:74", "12:75"]
        with_refs: ["Gen 44:9", "Gen 44:10", "Gen 44:17"]
        relation: parallel
        note: "jazāʾuhu man wujida fī raḥlihi fa-huwa jazāʾuh; ʾăšer yimmāṣēʾ ʾittô ... wāmēt wəgam-ʾănaḥnû nihyeh laʾdōnî laʿăbādîm, reduced to hûʾ yihyeh-llî ʿābed: the brothers pronounce the penalty, the one found with it becomes the slave."
      - with: hb-gen-44-silver-cup-judah-plea
        motif: search-eldest-to-youngest
        refs: ["12:76"]
        with_refs: ["Gen 44:12"]
        relation: parallel
        note: "fa-badaʾa bi-awʿiyatihim qabla wiʿāʾi akhīhi thumma stakhrajahā min wiʿāʾi akhīh; baggādôl hēḥēl ûbaqqāṭōn killâ wayyimmāṣēʾ haggābîaʿ bəʾamtaḥat binyāmin. Q adds a theological comment: ka-dhālika kidnā li-Yūsuf."
      - with: hb-gen-44-silver-cup-judah-plea
        motif: offer-substitute
        refs: ["12:78", "12:79", "12:80"]
        with_refs: ["Gen 44:16", "Gen 44:18", "Gen 44:33"]
        relation: divergence
        note: "Gen: Judah's long plea ends with yēšeb-nāʾ ʿabdəkā taḥat hannaʿar, and it breaks Joseph, wəlōʾ-yākōl yôsēp ləhitʾappēq (45:1), who reveals himself at once. Q: an unnamed fa-khudh aḥadanā makānahu is refused (maʿādha llāhi an naʾkhudha illā man wajadnā matāʿanā ʿindah), and the brothers go home. The revelation comes only on a third journey (12:88-90)."
      - with: hb-gen-45-joseph-reveals-himself
        motif: hero-reveals-identity
        refs: ["12:89", "12:90"]
        with_refs: ["Gen 45:3", "Gen 45:4"]
        relation: divergence
        note: "Gen: Joseph declares himself unprompted, ʾănî yôsēp hăʿôd ʾābî ḥāy, and the brothers are struck dumb, nibhălû mippānāyw. Q: Joseph asks a leading question, hal ʿalimtum mā faʿaltum bi-Yūsufa wa-akhīh, and they guess, a-innaka la-anta Yūsuf? Then: ana Yūsufu wa-hādhā akhī qad manna llāhu ʿalaynā."
      - with: hb-gen-45-joseph-reveals-himself
        motif: hero-sees-divine-plan
        refs: ["12:100"]
        with_refs: ["Gen 45:5", "Gen 45:7", "Gen 45:8"]
        relation: divergence
        note: "Who caused the crime. Gen: God did it, lōʾ-ʾattem šəlaḥtem ʾōtî hēnnâ kî hāʾĕlōhîm, ləmiḥyâ šəlāḥanî ʾĕlōhîm. Q: Satan did it, min baʿdi an nazagha sh-shayṭānu baynī wa-bayna ikhwatī, and God's role is gentle steering, inna rabbī laṭīfun limā yashāʾ."
      - with: hb-gen-45-joseph-reveals-himself
        motif: hero-forgives-brothers
        refs: ["12:91", "12:92"]
        with_refs: ["Gen 45:5", "Gen 45:15"]
        relation: divergence
        note: "Gen: no confession and no word of forgiveness here, only wəʿattâ ʾal-tēʿāṣəbû and kisses and tears. Q: the brothers confess, wa-in kunnā la-khāṭiʾīn, and Joseph pardons them at once, lā tathrība ʿalaykumu l-yawma yaghfiru llāhu lakum. Gen postpones the request for forgiveness to Gen 50:17."
      - with: hb-gen-45-joseph-reveals-himself
        motif: father-revived-by-news
        refs: ["12:93", "12:94", "12:96"]
        with_refs: ["Gen 45:26", "Gen 45:27"]
        relation: divergence
        note: "The token changes. Gen: Jacob disbelieves (wayyāpog libbô kî lōʾ-heʾĕmîn lāhem) until he sees the ʿăgālôt, wattəḥî rûaḥ yaʿăqōb. Q: Jacob already knows (innī la-ajidu rīḥa Yūsuf), and the shirt thrown on his face restores his sight, fa-rtadda baṣīran ... a-lam aqul lakum innī aʿlamu mina llāhi mā lā taʿlamūn."
      - with: hb-gen-46-descent-seventy-souls
        motif: reunion-with-father
        refs: ["12:99"]
        with_refs: ["Gen 46:29", "Gen 46:30"]
        relation: divergence
        note: "Gen: Joseph meets Israel in Goshen, wayyippōl ʿal-ṣawwāʾrāyw, and Jacob says ʾāmûtâ happaʿam. Q: āwā ilayhi abawayhi, both parents, although Gen has Rachel dead (Gen 35:19), and the welcome is udkhulū Miṣra in shāʾa llāhu āminīn."
      - with: hb-gen-37-joseph-dreams-sold
        motif: parents-honored-dream-fulfilled
        refs: ["12:100"]
        with_refs: ["Gen 37:10"]
        relation: divergence
        note: "Gen: Jacob's rebuke, hăbôʾ nābôʾ ʾănî wəʾimməkā wəʾaḥêkā ləhištaḥăwōt ləkā ʾārṣâ, is never literally fulfilled for the parents; only the brothers bow (Gen 42:6; 50:18). Q: wa-rafaʿa abawayhi ʿalā l-ʿarshi wa-kharrū lahu sujjadā, hādhā taʾwīlu ruʾyāya min qabl: the dream is fulfilled to the letter, with father and mother."
      - with: hb-gen-48-ephraim-manasseh-blessing
        motif: father-eyesight-fails
        refs: ["12:84"]
        with_refs: ["Gen 48:10"]
        relation: divergence
        note: "Gen: wəʿênê yiśrāʾēl kābədû mizzōqen lōʾ yûkal lirʾôt, from old age, never healed. Q: wa-byaḍḍat ʿaynāhu mina l-ḥuzni fa-huwa kaẓīm, from grief over Joseph, and healed by Joseph's shirt (12:96)."
      - with: hb-gen-27-stolen-blessing
        motif: father-smells-son
        refs: ["12:94"]
        with_refs: ["Gen 27:27"]
        relation: echo
        note: "innī la-ajidu rīḥa Yūsuf; wayyāraḥ ʾet-rêaḥ bəgādāyw ... rəʾēh rêaḥ bənî: a father knows a son by his scent and garment. Gen 27 is deceit (Jacob in Esau's clothes); Q's scent is true knowledge from God, and Jacob is the one smelling."
      - with: hb-gen-50-jacob-burial-joseph-death
        motif: hero-forgives-brothers
        refs: ["12:92", "12:98"]
        with_refs: ["Gen 50:17", "Gen 50:19", "Gen 50:20"]
        relation: divergence
        note: "Gen: the request for forgiveness comes after Jacob's death and in his name, śāʾ nāʾ ləpešaʿ ʿabdê ʾĕlōhê ʾābîkā, and Joseph answers hătaḥat ʾĕlōhîm ʾānî ... ʾĕlōhîm ḥăšābāh ləṭōbâ. Q: forgiveness comes while Jacob lives, and Jacob himself promises to intercede, sawfa astaghfiru lakum rabbī."
      - with: hb-gen-31-flight-from-laban
        motif: search-eldest-to-youngest
        refs: ["12:75", "12:76"]
        with_refs: ["Gen 31:32", "Gen 31:33", "Gen 31:35"]
        relation: echo
        note: "Same pattern with roles reversed: the accused patriarch rashly names the penalty, ʿim ʾăšer timṣāʾ ʾet-ʾĕlōhêkā lōʾ yiḥyeh, and the search goes tent by tent and ends with Rachel; jazāʾuhu man wujida fī raḥlihi ... fa-badaʾa bi-awʿiyatihim. Rachel, mother of Joseph and Benjamin, really did steal (wattignōb rāḥēl, 31:19). Q 12:77, in saraqa fa-qad saraqa akhun lahu min qabl, fixes an earlier theft on the same maternal line; cf. later haggadic explanations, not in either text."
      - with: hb-gen-6-flood
        motif: evil-inclination-of-heart
        refs: ["12:53"]
        with_refs: ["Gen 6:5", "Gen 8:21"]
        relation: parallel
        note: "inna n-nafsa la-ammāratun bi-s-sūʾi illā mā raḥima rabbī; kol-yēṣer maḥšəbōt libbô raq raʿ kol-hayyôm / yēṣer lēb hāʾādām raʿ minnəʿurāyw: human inwardness drives to evil. Q makes an exception for divine mercy; Gen 8:21 makes it a reason not to curse the ground again."
  - unit: quran-12-epilogue
    checked: [hb-deut-31-joshua-torah-song, hb-isa-8-maher-shalal-and-stone-of-stumbling, hb-deut-18-levites-prophet]
