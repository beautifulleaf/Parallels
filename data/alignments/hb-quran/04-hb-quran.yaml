  - unit: quran-21-against-other-gods
    checked: [hb-neh-9-levites-confession, hb-gen-6-sons-of-god, hb-job-9-job-cannot-sue-god, hb-deut-4-exhortation, hb-isa-45-cyrus-the-anointed]
