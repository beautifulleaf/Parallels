        motif: idris-raised-to-high-place
        refs: ["19:56", "19:57"]
        with_refs: ["Gen 5:22", "Gen 5:24"]
        relation: echo
        note: "wayyithallēk ḥănôk ʾet-hāʾĕlōhîm wəʾênennû kî-lāqaḥ ʾōtô ʾĕlōhîm; wa-dhkur fī l-kitābi Idrīsa innahu kāna ṣiddīqan nabiyyā wa-rafaʿnāhu makānan ʿaliyyā: a righteous man of the earliest generations whom God took up. Gen's 'God took him' becomes Q's 'raised him to a high place'. The identification of Idrīs with Enoch is exegetical, not in either text."
      - with: hb-exod-7-staff-swallows-staffs
        motif: brother-as-spokesman
        refs: ["19:53"]
        with_refs: ["Exod 7:1", "Exod 7:2"]
        relation: divergence
        note: "nətattîkā ʾĕlōhîm ləparʿōh wəʾahărōn ʾāḥîkā yihyeh nəbîʾekā; wa-wahabnā lahu min raḥmatinā akhāhu Hārūna nabiyyā: Aaron the brother as prophet (nābîʾ / nabiyy). In Exod Aaron is Moses' prophet, with Moses 'as God' to Pharaoh; in Q God makes him a prophet in his own right, as a gift of mercy to Moses."
      - with: hb-exod-4-signs-aaron-bridegroom-of-blood
        motif: brother-as-spokesman
        refs: ["19:53"]
        with_refs: ["Exod 4:14", "Exod 4:15", "Exod 4:16"]
        relation: divergence
        note: "Exod: Aaron is given in God's anger at Moses' reluctance, wayyiḥar-ʾap YHWH bəmōšeh wayyōʾmer hălōʾ ʾahărōn ʾāḥîkā ... wəhāyâ-hûʾ yihyeh-ləkā ləpeh wəʾattâ tihyeh-lô lēʾlōhîm. Q: Aaron is given 'from our mercy' (min raḥmatinā). Anger becomes grace, and the 'as God' formula is dropped."
      - with: hb-exod-3-burning-bush
        motif: moses-drawn-near-in-confidential-speech
        refs: ["19:52"]
        with_refs: ["Exod 3:4", "Exod 3:5"]
        relation: divergence
        note: "wayyiqrāʾ ʾēlāyw ʾĕlōhîm mittôk hassəneh ... ʾal-tiqrab hălōm; wa-nādaynāhu min jānibi ṭ-ṭūri l-aymani wa-qarrabnāhu najiyyā. God calls Moses at the mountain, but the approach is reversed: Exod has 'do not come near' (ʾal-tiqrab), Q has 'we brought him near' (qarrabnāhu, the same root q-r-b)."
      - with: hb-exod-33-tent-and-glory
        motif: moses-drawn-near-in-confidential-speech
        refs: ["19:52"]
        with_refs: ["Exod 33:11"]
        relation: parallel
        note: "wədibber YHWH ʾel-mōšeh pānîm ʾel-pānîm kaʾăšer yədabbēr ʾîš ʾel-rēʿēhû; wa-qarrabnāhu najiyyā: God speaks to Moses in intimate converse, as with a friend."
      - with: hb-judg-2-bochim-cycle
        motif: later-generation-neglects-prayer-follows-lusts
        refs: ["19:59"]
        with_refs: ["Judg 2:10"]
        relation: parallel
        note: "wayyāqom dôr ʾaḥēr ʾaḥărêhem ʾăšer lōʾ-yādəʿû ʾet-YHWH; fa-khalafa min baʿdihim khalfun aḍāʿū ṣ-ṣalāta wa-ttabaʿū sh-shahawāt: after the founding generation comes one that forgets God. Judg's generation does not know YHWH; Q's neglects prayer and follows its lusts, and Q leaves an exception for those who repent (illā man tāba)."
  - unit: quran-19-resurrection-and-the-son
    checked: [hb-isa-65-rebels-and-servants, hb-jer-31-consolation-new-covenant, hb-mal-3-book-of-remembrance, hb-ps-44-national-lament, hb-ps-2-anointed-son, hb-ps-89-ethan-davidic-covenant, hb-isa-43-you-are-my-witnesses]
    matches:
      - with: hb-ps-2-anointed-son
