        relation: parallel
        note: "Same sequence: the young man destroys his father's people's cult objects unseen (wayyaʿaś lāylâ / baʿda an tuwallū mudbirīn), and the townsmen ask who did it, mî ʿāśâ haddābār hazzeh ... gidʿôn ben-yôʾāš ʿāśâ / man faʿala hādhā bi-ālihatinā ... samiʿnā fatan yadhkuruhum yuqālu lahu Ibrāhīm. Gideon acts on God's command (wayyōʾmer lô YHWH); Abraham on his own oath (ta-llāhi la-akīdanna aṣnāmakum)."
      - with: hb-judg-6-jerubbaal-fleece
