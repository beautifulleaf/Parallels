  - unit: quran-15-prologue-and-heavens
    checked: [hb-2chr-36-last-kings-and-fall, hb-job-9-job-cannot-sue-god, hb-isa-40-comfort-my-people, hb-isa-45-cyrus-the-anointed, hb-ps-135-hymn-of-election, hb-job-38-whirlwind-creation, hb-deut-32-song-of-moses]
