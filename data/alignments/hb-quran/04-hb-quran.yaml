      - with: hb-dan-7-four-beasts-son-of-man
        motif: court-sits-books-opened
        refs: ["17:13"]
        with_refs: ["Dan 7:10"]
        relation: parallel
        note: "dînāʾ yətib wəsiprîn pətîḥû; wa-nukhriju lahu yawma l-qiyāmati kitāban yalqāhu manshūrā: at the judgment books are brought out and opened (pətîḥû / manshūr). Dan's court judges empires; Q's book belongs to each person."
  - unit: quran-17-commandments
    checked: [hb-exod-20-decalogue, hb-ps-81-new-moon-shofar, hb-deut-5-decalogue, hb-lev-19-holiness-code-a, hb-prov-24-words-of-wise, hb-prov-23-amenemope-sayings, hb-prov-16-sayings]
    matches:
      - with: hb-exod-20-decalogue
        motif: prohibition-of-other-gods
        refs: ["17:22", "17:23", "17:39"]
        with_refs: ["Exod 20:2", "Exod 20:3"]
        relation: divergence
        note: "lōʾ yihyeh-ləkā ʾĕlōhîm ʾăḥērîm ʿal-pānāy; lā tajʿal maʿa llāhi ilāhan ākhar: same first commandment ('other gods' / 'another god'). The frame changes: Exod opens with the exodus, ʾăšer hôṣēʾtîkā mēʾereṣ miṣrayim; Q frames the code with the command at both ends (17:22, 17:39) and with no history of Israel, wa-qaḍā rabbuka. Q's code also has no Sabbath, no images clause and no coveting."
      - with: hb-exod-20-decalogue
        motif: honor-parents-long-life
        refs: ["17:23", "17:24"]
        with_refs: ["Exod 20:12"]
        relation: divergence
        note: "kabbēd ʾet-ʾābîkā wəʾet-ʾimmekā ləmaʿan yaʾărikûn yāmêkā; wa-bi-l-wālidayni iḥsānan immā yablughanna ʿindaka l-kibara ... fa-lā taqul lahumā uffin ... wa-qul rabbi rḥamhumā ka-mā rabbayānī ṣaghīrā. Q drops the promise of long life and puts in its place care for parents in old age and a prayer for them. Duty to parents comes second, right after God, in both."
      - with: hb-exod-20-decalogue
        motif: killing-forbidden-except-by-right
        refs: ["17:33"]
        with_refs: ["Exod 20:13"]
        relation: divergence
        note: "lōʾ tirṣāḥ, unqualified; wa-lā taqtulu n-nafsa llatī ḥarrama llāhu illā bi-l-ḥaqq: Q adds 'except by right' and gives the victim's walī authority, fa-lā yusrif fī l-qatl, folding the blood-avenger law into the commandment."
      - with: hb-exod-20-decalogue
        motif: adultery-prohibited
        refs: ["17:32"]
        with_refs: ["Exod 20:14"]
        relation: divergence
        note: "lōʾ tinʾāp; wa-lā taqrabū z-zinā innahu kāna fāḥishatan: Q forbids even approaching it, and its zinā covers any illicit intercourse, not only with a married woman."
      - with: hb-deut-5-decalogue
        motif: honor-parents-long-life
        refs: ["17:23", "17:24"]
        with_refs: ["Deut 5:16"]
        relation: divergence
        note: "kabbēd ... ləmaʿan yaʾărîkun yāmêkā ûləmaʿan yîṭab lāk; Q's iḥsān to parents has no promise attached and adds the prayer rabbi rḥamhumā. The reward motive of Deut is gone."
      - with: hb-deut-5-decalogue
        motif: ten-commandments
        refs: ["17:31", "17:32", "17:33"]
        with_refs: ["Deut 5:17", "Deut 5:18"]
        relation: parallel
        note: "lōʾ tirṣāḥ wəlōʾ tinʾāp; lā taqtulū awlādakum ... lā taqrabū z-zinā ... lā taqtulu n-nafs: killing and adultery prohibitions in close sequence, as in the Decalogue."
      - with: hb-lev-19-holiness-code-a
        motif: give-kin-poor-and-wayfarer-their-due
        refs: ["17:26"]
        with_refs: ["Lev 19:9", "Lev 19:10"]
        relation: parallel
        note: "wa-āti dhā l-qurbā ḥaqqahu wa-l-miskīna wa-bna s-sabīl; leʿānî wəlaggēr taʿăzōb ʾōtām: the poor and the traveler or stranger have a claim on one's produce. Lev gives it as gleanings; Q as a due (ḥaqq) and adds a warning against squandering."
      - with: hb-lev-19-holiness-code-a
        motif: decalogue-like-code-in-quran
        refs: ["17:22", "17:23"]
        with_refs: ["Lev 19:3", "Lev 19:4"]
        relation: divergence
        note: "Lev pairs parents with Sabbath: ʾîš ʾimmô wəʾābîw tîrāʾû wəʾet-šabbətōtay tišmōrû, then ʾal-tipnû ʾel-hāʾĕlîlîm. Q pairs parents with God's sole worship: allā taʿbudū illā iyyāhu wa-bi-l-wālidayni iḥsānā. The Sabbath slot is taken by tawḥīd."
      - with: hb-ps-81-new-moon-shofar
        motif: prohibition-of-other-gods
        refs: ["17:22", "17:39"]
        with_refs: ["Ps 81:10"]
        relation: parallel
        note: "lōʾ-yihyeh bəkā ʾēl zār wəlōʾ tištaḥăweh ləʾēl nēkār; lā tajʿal maʿa llāhi ilāhan ākhar: no foreign god."
      - with: hb-prov-23-amenemope-sayings
        motif: orphan-property-guardianship
        refs: ["17:34"]
        with_refs: ["Prov 23:10", "Prov 23:11"]
        relation: parallel
        note: "ʾal-tassēg gəbûl ʿôlām ûbiśdê yətômîm ʾal-tābōʾ kî-gōʾălām ḥāzāq; wa-lā taqrabū māla l-yatīmi illā bi-llatī hiya aḥsan: 'do not enter / approach' the orphan's property. Prov names God as the orphans' gōʾēl; Q sets a term (ḥattā yablugha ashuddah)."
      - with: hb-prov-16-sayings
        motif: just-weights-and-measures
        refs: ["17:35"]
        with_refs: ["Prov 16:11"]
        relation: parallel
        note: "peles ûmōʾzənê mišpāṭ laYHWH maʿăśēhû kol-ʾabnê-kîs; wa-awfū l-kayla idhā kiltum wa-zinū bi-l-qisṭāsi l-mustaqīm: honest balances (cognate root for weighing, ʾ-z-n / w-z-n). Prov says the scales belong to God; Q commands their use."
      - with: hb-prov-24-words-of-wise
        motif: do-not-follow-what-you-do-not-know
        refs: ["17:25", "17:36"]
        with_refs: ["Prov 24:12"]
        relation: echo
        note: "kî-tōʾmar hēn lōʾ-yādaʿnû zeh hălōʾ-tōkēn libbôt hûʾ-yābîn ... wəhēšîb ləʾādām kəpāʿŏlô; rabbukum aʿlamu bi-mā fī nufūsikum ... inna s-samʿa wa-l-baṣara wa-l-fuʾāda kullu ulāʾika kāna ʿanhu masʾūlā: a claim of ignorance does not help, since God weighs the heart and holds each faculty to account."
  - unit: quran-17-polemic-and-resurrection
    checked: [hb-ps-150-final-hallelujah, hb-exod-34-thirteen-attributes-covenant-renewal, hb-exod-20-decalogue, hb-ps-89-ethan-davidic-covenant, hb-ps-148-all-creation-praises, hb-ps-19-heavens-and-torah, hb-ezek-37-dry-bones, hb-ps-29-voice-of-yhwh]
    matches:
