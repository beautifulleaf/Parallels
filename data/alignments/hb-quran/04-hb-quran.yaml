        refs: ["12:109"]
        with_refs: ["Deut 18:15", "Deut 18:18"]
        relation: parallel
        note: "wa-mā arsalnā min qablika illā rijālan nūḥī ilayhim min ahli l-qurā; nābîʾ ʾāqîm lāhem miqqereb ʾăḥêhem kāmôkā wənātattî dəbāray bəpîw: the prophet is a man raised from among his own people and given the divine word. Deut promises one prophet like Moses for Israel; Q makes it the rule for all messengers before Muhammad."
  - unit: quran-13-signs-of-creation
    checked: [hb-prov-25-hezekiah-collection, hb-ps-104-creation-hymn, hb-job-9-job-cannot-sue-god, hb-job-38-whirlwind-creation, hb-ps-29-voice-of-yhwh, hb-job-26-hymn-to-cosmic-power, hb-ezek-22-city-of-blood]
    matches:
      - with: hb-prov-25-hezekiah-collection
        motif: dross-removed-from-silver
        refs: ["13:17"]
        with_refs: ["Prov 25:4", "Prov 25:5"]
        relation: parallel
        note: "wa-mimmā yūqidūna ʿalayhi fī n-nāri btighāʾa ḥilyatin ... zabadun mithluh ... fa-ammā z-zabadu fa-yadhhabu jufāʾan; hāgô sîgîm mikkāsep wayyēṣēʾ laṣṣōrēp kelî / hāgô rāšāʿ lipnê-melek: dross is driven off the smelted silver, and the image stands for removing the wicked. Prov applies it to the king's court; Q to truth and falsehood (al-ḥaqq wa-l-bāṭil)."
      - with: hb-ps-29-voice-of-yhwh
        motif: thunder-glorifies-god
        refs: ["13:13"]
        with_refs: ["Ps 29:3", "Ps 29:9"]
        relation: divergence
        note: "Ps: the thunder is God's own voice, qôl YHWH ʿal-hammāyim ʾēl-hakkābôd hirʿîm, and in his temple kullô ʾōmēr kābôd. Q: the thunder is a creature that praises him, wa-yusabbiḥu r-raʿdu bi-ḥamdihi. The angels' awe (wa-l-malāʾikatu min khīfatih) matches Ps 29:1-2 bənê ʾēlîm ascribing kābôd."
      - with: hb-ps-104-creation-hymn
        motif: thunder-as-voice-of-god
        refs: ["13:12", "13:13"]
        with_refs: ["Ps 104:7"]
        relation: divergence
        note: "min-gaʿărātəkā yənûsûn min-qôl raʿamkā yēḥāpēzûn: God's thunder is his rebuke that drives back the waters; Q: lightning khawfan wa-ṭamaʿan, and thunder that glorifies him (yusabbiḥu r-raʿdu bi-ḥamdih). The same raʿam/raʿd is God's voice in Ps and a worshipper in Q."
      - with: hb-ps-104-creation-hymn
        motif: sun-and-moon-run-to-appointed-term
        refs: ["13:2"]
        with_refs: ["Ps 104:19"]
        relation: parallel
        note: "wa-sakhkhara sh-shamsa wa-l-qamara kullun yajrī li-ajalin musammā; ʿāśâ yārēaḥ ləmôʿădîm šemeš yādaʿ məbôʾô: sun and moon made subject to fixed times."
      - with: hb-ps-104-creation-hymn
        motif: night-covers-day
        refs: ["13:3"]
        with_refs: ["Ps 104:20"]
        relation: parallel
        note: "yughshī l-layla n-nahār; tāšet-ḥōšek wîhî lāylâ: God brings the night down over the day."
      - with: hb-job-26-hymn-to-cosmic-power
        motif: heavens-raised-without-pillars
        refs: ["13:2"]
        with_refs: ["Job 26:7", "Job 26:11"]
        relation: divergence
        note: "Job: the earth hangs on nothing (tōleh ʾereṣ ʿal-bəlî-māh), but the heavens have pillars, ʿammûdê šāmayim yərôpāpû. Q: rafaʿa s-samāwāti bi-ghayri ʿamadin tarawnahā, the heavens raised without (visible) pillars. Q denies to the sky what Job grants it."
      - with: hb-job-9-job-cannot-sue-god
        motif: heavens-raised-without-pillars
        refs: ["13:2", "13:3"]
        with_refs: ["Job 9:6", "Job 9:8"]
        relation: echo
        note: "nōṭeh šāmayim ləbaddô ... hammargîz ʾereṣ mimməqômāh wəʿammûdêhā yitpallāṣûn; rafaʿa s-samāwāti bi-ghayri ʿamad ... madda l-arḍ: God alone spreads out heaven and earth. The verb is cognate (nṭh/madda, 'stretch out') but applied to heaven in Job and to earth in Q. Job gives the earth pillars."
      - with: hb-job-38-whirlwind-creation
        motif: thunderbolts-strike-whom-god-wills
        refs: ["13:12", "13:13"]
        with_refs: ["Job 38:25", "Job 38:34", "Job 38:35"]
        relation: echo
        note: "hătəšallaḥ bərāqîm wəyēlēkû wəyōʾmərû ləkā hinnēnû ... derek laḥăzîz qōlôt; huwa lladhī yurīkumu l-barqa ... wa-yursilu ṣ-ṣawāʿiqa fa-yuṣību bihā man yashāʾ: God alone sends lightning and thunderbolts. Job turns it into a challenge to man; Q into a sign."
      - with: hb-ezek-22-city-of-blood
        motif: dross-removed-from-silver
        refs: ["13:17"]
        with_refs: ["Ezek 22:18", "Ezek 22:20", "Ezek 22:22"]
        relation: echo
        note: "bêt-yiśrāʾēl ... kullām nəḥōšet ûbədîl ûbarzel wəʿôperet bətôk kûr sigîm kesep hāyû ... lāpaḥat-ʿālāyw ʾēš ləhantîk; wa-mimmā yūqidūna ʿalayhi fī n-nāri btighāʾa ḥilyatin aw matāʿin zabadun mithluh: metals melted in the furnace throw off dross. In Ezek all Israel has become dross, to be melted in God's wrath; in Q the scum is falsehood that vanishes, while what is useful to people remains."
  - unit: quran-13-covenant-and-paradise
    checked: [hb-ps-49-no-ransom, hb-deut-30-return-choose-life, hb-jer-31-consolation-new-covenant, hb-mal-3-book-of-remembrance]
    matches:
      - with: hb-ps-49-no-ransom
        motif: no-ransom-for-a-brother
        refs: ["13:18"]
        with_refs: ["Ps 49:8", "Ps 49:9"]
        relation: parallel
        note: "law anna lahum mā fī l-arḍi jamīʿan wa-mithlahu maʿahu la-ftadaw bihi; ʾāḥ lōʾ-pādōh yipdeh ʾîš lōʾ-yittēn lēʾlōhîm kopərô wəyēqar pidyôn napšām. Cognate root f-d-y / p-d-h: no wealth can buy a soul free. Ps speaks of death; Q of the reckoning (sūʾu l-ḥisāb)."
      - with: hb-ps-49-no-ransom
        motif: god-enlarges-and-straitens-provision
        refs: ["13:26"]
        with_refs: ["Ps 49:17", "Ps 49:18"]
        relation: echo
        note: "wa-fariḥū bi-l-ḥayāti d-dunyā wa-mā l-ḥayātu d-dunyā fī l-ākhirati illā matāʿ; ʾal-tîrāʾ kî-yaʿăšir ʾîš ... kî lōʾ bəmôtô yiqqaḥ hakkōl: the wealth of this life is worthless at the end. Ps sees it from death, Q from the hereafter."
      - with: hb-deut-30-return-choose-life
        motif: curse-on-covenant-breakers
        refs: ["13:20", "13:22", "13:25"]
        with_refs: ["Deut 30:15", "Deut 30:16", "Deut 30:17", "Deut 30:18", "Deut 30:19"]
        relation: parallel
        note: "yūfūna bi-ʿahdi llāh ... ulāʾika lahum ʿuqbā d-dār / yanquḍūna ʿahda llāh ... lahumu l-laʿnatu wa-lahum sūʾu d-dār; habbərākâ wəhaqqəlālâ ... haḥayyîm wəhammāwet nātattî ləpānêkā: keeping the covenant leads to blessing and a good outcome, breaking it to the curse. Deut puts it in the land (taʾărîkun yāmîm ʿal-hāʾădāmâ); Q in the final abode (ad-dār)."
      - with: hb-jer-31-consolation-new-covenant
        motif: keep-covenant-and-join-ties
        refs: ["13:20", "13:25"]
        with_refs: ["Jer 31:32"]
        relation: echo
        note: "alladhīna yanquḍūna ʿahda llāhi min baʿdi mīthāqih; ʾăšer-hēmmâ hēpērû ʾet-bərîtî: breaking a covenant God made. Jer answers with a new covenant written on the heart; Q with the curse and the evil abode."
  - unit: quran-13-messengers-and-mother-of-book
    checked: [hb-isa-8-maher-shalal-and-stone-of-stumbling, hb-isa-43-you-are-my-witnesses, hb-ezek-20-history-of-rebellion, hb-exod-32-tablets-broken-levites]
