        note: "hûʾ yiqrāʾēnî ʾābî ʾāttâ ... ʾap-ʾānî bəkôr ʾettənēhû, the Davidic king as God's firstborn; mā yanbaghī li-r-Raḥmāni an yattakhidha waladā ... illā ātī r-Raḥmāni ʿabdā. Ps 89 itself calls David God's servant (dāwid ʿabdî, 89:4, 89:21) next to the sonship language; Q keeps 'servant' and drops 'son'."
      - with: hb-isa-43-you-are-my-witnesses
