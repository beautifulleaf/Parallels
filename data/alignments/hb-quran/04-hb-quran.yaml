        note: "wəʾel-nəbûkadreʾṣṣar melek-bābel ʿabdî wahăbiʾōtîm ʿal-hāʾāreṣ hazzōʾt; baʿathnā ʿalaykum ʿibādan lanā ulī baʾsin shadīd: the conqueror is God's own servant (ʿabdî / ʿibādan lanā), sent to punish Israel. Jer names Nebuchadnezzar; Q names no one."
      - with: hb-2chr-36-last-kings-and-fall
        motif: temple-entered-and-destroyed-twice
        refs: ["17:5", "17:7"]
        with_refs: ["2Chr 36:17", "2Chr 36:19"]
        relation: parallel
        note: "wayyaʿal ʿălêhem ʾet-melek kaśdîm wayyahărōg baḥûrêhem baḥereb bəbêt miqdāšām ... wayyiśrəpû ʾet-bêt hāʾĕlōhîm; wa-li-yadkhulū l-masjida ka-mā dakhalūhu awwala marratin wa-li-yutabbirū mā ʿalaw tatbīrā: God brings the foe, who kills in the sanctuary and destroys it. Chr tells one destruction; Q speaks of two (marratayn), the second like the first."
      - with: hb-ps-74-leviathan
        motif: temple-destroyed-by-enemies
        refs: ["17:7"]
        with_refs: ["Ps 74:3", "Ps 74:4", "Ps 74:7"]
        relation: divergence
        note: "Same event, opposite framing. Ps: kol-hēraʿ ʾôyēb baqqōdeš ... šiləḥû bāʾēš miqdāšekā, and a lament asking God to act against the enemy. Q: the destroyers are God's agents and the cause is Israel's own corruption, la-tufsidunna fī l-arḍi marratayn ... wa-in asaʾtum fa-lahā."
      - with: hb-ps-79-nations-in-inheritance
        motif: temple-destroyed-by-enemies
        refs: ["17:5", "17:7"]
        with_refs: ["Ps 79:1"]
        relation: divergence
        note: "bāʾû gôyim bənaḥălātekā ṭimməʾû ʾet-hêkal qodšekā; fa-jāsū khilāla d-diyār ... wa-li-yadkhulū l-masjid. In Ps the nations are intruders to be punished (šəpōk ḥămātəkā ʾel-haggôyim, 79:6); in Q they are sent by God (baʿathnā)."
      - with: hb-isa-63-communal-lament
        motif: temple-destroyed-by-enemies
        refs: ["17:7"]
        with_refs: ["Isa 63:18"]
        relation: echo
        note: "ṣārênû bôsəsû miqdāšekā; wa-li-yadkhulū l-masjida ... wa-li-yutabbirū: enemies trample the sanctuary."
      - with: hb-ezek-39-gog-defeated-and-buried
        motif: restoration-after-first-punishment
        refs: ["17:6", "17:8"]
        with_refs: ["Ezek 39:25"]
        relation: parallel
        note: "ʿattâ ʾāšîb ʾet-šəbût yaʿăqōb wəriḥamtî kol-bêt yiśrāʾēl; thumma radadnā lakumu l-karrata ʿalayhim ... ʿasā rabbukum an yarḥamakum: after the punishment God reverses Israel's fortune and shows mercy (cognate r-ḥ-m). Q adds a condition, wa-in ʿudtum ʿudnā."
  - unit: quran-17-book-of-deeds
    checked: [hb-ps-74-leviathan, hb-ps-104-creation-hymn, hb-jer-31-consolation-new-covenant, hb-eccl-8-king-and-retribution, hb-dan-12-resurrection-end, hb-job-12-ask-the-beasts, hb-gen-1-creation-six-days, hb-dan-7-four-beasts-son-of-man]
    matches:
      - with: hb-gen-1-creation-six-days
        motif: night-and-day-as-two-signs
        refs: ["17:12"]
        with_refs: ["Gen 1:14"]
        relation: parallel
        note: "wa-jaʿalnā l-layla wa-n-nahāra āyatayn ... li-taʿlamū ʿadada s-sinīna wa-l-ḥisāb; ləhabdîl bên hayyôm ûbên hallāylâ wəhāyû ləʾōtōt ûləmôʿădîm ûləyāmîm wəšānîm. Cognate sign words (āya / ʾôt): the day-and-night lights are signs for counting years. Gen's signs are the luminaries; Q's are night and day themselves, with the night's sign 'effaced' (maḥawnā)."
      - with: hb-ps-74-leviathan
        motif: luminaries-rule-day-night
        refs: ["17:12"]
        with_refs: ["Ps 74:16"]
        relation: parallel
        note: "ləkā yôm ʾap-ləkā lāylâ ʾattâ hăkînôtā māʾôr wāšāmeš; wa-jaʿalnā l-layla wa-n-nahāra āyatayn: day and night and their lights belong to God, who set them up."
      - with: hb-ps-104-creation-hymn
        motif: luminaries-rule-day-night
        refs: ["17:12"]
        with_refs: ["Ps 104:19", "Ps 104:20", "Ps 104:23"]
        relation: parallel
        note: "ʿāśâ yārēaḥ ləmôʿădîm ... tāšet-ḥōšek wîhî lāylâ ... yēṣēʾ ʾādām ləpāʿŏlô; wa-jaʿalnā āyata n-nahāri mubṣiratan li-tabtaghū faḍlan min rabbikum: night for rest and the bright day for human work."
      - with: hb-jer-31-consolation-new-covenant
        motif: individual-responsibility-for-sin
        refs: ["17:15"]
        with_refs: ["Jer 31:29", "Jer 31:30"]
        relation: parallel
        note: "lōʾ-yōʾmərû ʿôd ʾābôt ʾākəlû bōser ... kî ʾim-ʾîš baʿăwōnô yāmût; wa-lā taziru wāziratun wizra ukhrā: no one bears another's guilt. In Jer it is a promise for the coming days that ends inherited guilt; in Q it is a rule that has always held."
      - with: hb-dan-12-resurrection-end
        motif: book-of-deeds-spread-open
        refs: ["17:13", "17:14"]
