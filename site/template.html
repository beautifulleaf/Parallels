<title>Parallels Ledger</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&family=Noto+Naskh+Arabic:wght@400;600&display=swap">
<style>
/* Layout: a ledger. Filter rail on the left, lead entries as a single reading column; entries open in place. */
:root {
  --bg: #f4f5f9;
  --surface: #ffffff;
  --fg: #1a1e30;
  --muted: #5b6078;
  --rule: #d9dceb;
  --lapis: #2741a3;
  --lapis-soft: #e3e8fb;
  --gold: #946f12;
  --gold-soft: #f6edd3;
  --est: #2f7a55;
  --prop: #2741a3;
  --cont: #b06a12;
  --fringe: #a33a3a;
  --font-display: "Marcellus", "Trajan Pro", Georgia, serif;
  --font-body: "Source Serif 4", "Noto Naskh Arabic", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --font-arabic: "Noto Naskh Arabic", "Geeza Pro", "Traditional Arabic", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1220; --surface: #171b2c; --fg: #e5e8f3; --muted: #9aa0bd; --rule: #2a3049;
    --lapis: #93a8ff; --lapis-soft: #232c52; --gold: #d8b456; --gold-soft: #3a3120;
    --est: #6fc79a; --prop: #93a8ff; --cont: #e3a457; --fringe: #ec8a8a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1220; --surface: #171b2c; --fg: #e5e8f3; --muted: #9aa0bd; --rule: #2a3049;
  --lapis: #93a8ff; --lapis-soft: #232c52; --gold: #d8b456; --gold-soft: #3a3120;
  --est: #6fc79a; --prop: #93a8ff; --cont: #e3a457; --fringe: #ec8a8a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.55;
}
.wrap {
  max-width: 1180px; margin: 0 auto;
  padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header.top { display: grid; gap: 6px; margin-bottom: 24px; }
h1 {
  font-family: var(--font-display); font-weight: 400; font-size: clamp(30px, 5vw, 44px);
  letter-spacing: 0.04em; margin: 0; text-wrap: balance;
}
.lede { color: var(--muted); margin: 0; max-width: 65ch; }
.layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 32px; align-items: start; }
@media (max-width: 820px) { .layout { grid-template-columns: minmax(0, 1fr); gap: 20px; } }

/* Filter rail */
aside.rail { display: grid; gap: 22px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
@media (max-width: 820px) { aside.rail { position: static; } }
.rail h2 {
  font-family: var(--font-mono); font-size: 11px; font-weight: 500; text-transform: uppercase;
  letter-spacing: 0.12em; color: var(--muted); margin: 0 0 8px;
}
.search {
  width: 100%; font: inherit; font-size: 15px; padding: 10px 12px; border-radius: 6px;
  border: 1px solid var(--rule); background: var(--surface); color: var(--fg);
}
.search:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--lapis); outline-offset: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font-family: var(--font-mono); font-size: 12px; padding: 4px 9px; border-radius: 999px;
  border: 1px solid var(--rule); background: transparent; color: var(--fg); cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--lapis); border-color: var(--lapis); color: var(--surface); }
.chip .n { color: var(--muted); margin-left: 4px; }
.chip[aria-pressed="true"] .n { color: inherit; opacity: 0.75; }
.tgroup { display: grid; gap: 4px; }
.tgroup + .tgroup { margin-top: 10px; }
.tgroup-name { font-family: var(--font-display); font-size: 15px; letter-spacing: 0.03em; }
.tfamily { font-size: 12px; color: var(--muted); margin-top: 4px; }
.tlist { display: flex; flex-wrap: wrap; gap: 4px; }
.reset { font: inherit; font-size: 14px; color: var(--lapis); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }

/* Results */
.resultbar { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: baseline; margin-bottom: 12px; }
.count { font-family: var(--font-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.sort { display: flex; gap: 6px; }
ol.leads { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.lead {
  background: var(--surface); border: 1px solid var(--rule); border-radius: 8px;
  border-left: 4px solid var(--standing, var(--rule));
}
.lead[data-standing="established"] { --standing: var(--est); }
.lead[data-standing="proposed"] { --standing: var(--prop); }
.lead[data-standing="contested"] { --standing: var(--cont); }
.lead[data-standing="fringe"] { --standing: var(--fringe); }
.lead > details > summary { list-style: none; cursor: pointer; padding: 14px 16px; display: grid; gap: 6px; }
.lead > details > summary::-webkit-details-marker { display: none; }
.lead-title { font-size: 18px; font-weight: 600; line-height: 1.3; margin: 0; text-wrap: balance; }
.lead-summary { margin: 0; color: var(--muted); font-size: 15px; max-width: 72ch; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tag {
  font-family: var(--font-mono); font-size: 11px; padding: 2px 7px; border-radius: 4px;
  background: var(--lapis-soft); color: var(--fg); letter-spacing: 0.02em;
}
.tag.standing { background: transparent; border: 1px solid var(--standing); color: var(--standing); }
.tag.status { background: transparent; border: 1px dashed var(--muted); color: var(--muted); }
.tag.status[data-status="investigating"] { border-style: solid; color: var(--lapis); border-color: var(--lapis); }
.tag.status[data-status="promising"] { border-style: solid; color: var(--est); border-color: var(--est); }
.tag.status[data-status="rejected"] { text-decoration: line-through; }
.tag.bench { background: var(--gold-soft); color: var(--gold); }
.trads { font-size: 13px; color: var(--muted); }

.body { padding: 0 16px 16px; display: grid; gap: 16px; border-top: 1px solid var(--rule); padding-top: 14px; }
.body h3 {
  font-family: var(--font-mono); font-size: 11px; font-weight: 500; text-transform: uppercase;
  letter-spacing: 0.12em; color: var(--muted); margin: 0 0 6px;
}
.body ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.table-scroll { overflow-x: auto; }
table { border-collapse: collapse; font-size: 14px; min-width: 100%; }
th, td { text-align: left; padding: 5px 10px 5px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-family: var(--font-mono); font-size: 11px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
.form { font-size: 18px; }
[lang="ar"], [lang="he"], [lang="arc"], [lang="myz"] { font-family: var(--font-arabic); }
.passage { display: grid; gap: 2px; padding: 8px 0; border-bottom: 1px solid var(--rule); }
.passage:last-child { border-bottom: 0; }
.passage .ref { font-family: var(--font-mono); font-size: 12px; color: var(--lapis); }
.passage .trad { color: var(--muted); }
.passage .text { font-family: var(--font-arabic); font-size: 20px; line-height: 1.9; direction: rtl; text-align: right; }
.passage .note { font-size: 14px; color: var(--muted); }
.notes { font-size: 15px; }
.notes p { margin: 0 0 6px; }
.notes h4 { font-family: var(--font-display); font-weight: 400; font-size: 16px; margin: 8px 0 4px; }
.notes .empty { color: var(--muted); font-style: italic; }
.path { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.body a { color: var(--lapis); }
.legend { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; background: var(--c); }
.empty-state { padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--rule); border-radius: 8px; }
@media (prefers-reduced-motion: no-preference) { .lead { transition: border-color 0.15s; } }
</style>

<div class="wrap">
  <header class="top">
    <h1>Parallels Ledger</h1>
    <p class="lede">Leads on parallels, convergences, and responses between traditions. Each lead is one file in <code>leads/</code>; review status and notes come from the repo.</p>
  </header>

  <div class="layout">
    <aside class="rail" aria-label="Filters">
      <div>
        <label for="q"><h2>Search</h2></label>
        <input id="q" class="search" type="search" placeholder="yamm, flood, Mani, 20:39…" autocomplete="off">
      </div>
      <div><h2>Relation</h2><div class="chips" id="f-relations"></div></div>
      <div><h2>Standing</h2><div class="chips" id="f-standing"></div></div>
      <div><h2>Review status</h2><div class="chips" id="f-status"></div></div>
      <div><h2>Layer</h2><div class="chips" id="f-layers"></div></div>
      <div><h2>Traditions</h2><div id="f-traditions"></div></div>
      <div class="legend" aria-label="Standing colors">
        <span style="--c: var(--est)">established in scholarship</span>
        <span style="--c: var(--prop)">proposed</span>
        <span style="--c: var(--cont)">contested</span>
        <span style="--c: var(--fringe)">fringe</span>
      </div>
      <button class="reset" id="reset" type="button">Clear all filters</button>
    </aside>

    <main>
      <div class="resultbar">
        <span class="count" id="count"></span>
        <div class="sort chips" id="sort"></div>
      </div>
      <ol class="leads" id="leads"></ol>
    </main>
  </div>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
(function () {
  const DATA = JSON.parse(document.getElementById("data").textContent);
  const TRAD = Object.fromEntries(DATA.traditions.map(t => [t.id, t]));
  const ORDER = {
    relations: ["inheritance", "transmission", "convergence", "response"],
    standing: ["established", "proposed", "contested", "fringe"],
    status: ["new", "investigating", "promising", "rejected"],
    layers: ["lexical", "motif", "concept"],
  };
  const state = { q: "", relations: new Set(), standing: new Set(), status: new Set(), layers: new Set(), traditions: new Set(), sort: "title" };

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const leadValue = (lead, key) => key === "standing" || key === "status" ? [lead[key]] : (lead[key] || []);

  function haystack(lead) {
    if (lead._hay) return lead._hay;
    const parts = [lead.title, lead.summary, lead.notes, lead.direction, ...(lead.motifs || []), ...(lead.concepts || []), ...(lead.evidence || []),
      ...(lead.traditions || []).map(t => TRAD[t]?.name),
      ...(lead.lexical || []).flatMap(x => [x.form, x.translit, x.gloss]),
      ...(lead.passages || []).flatMap(p => [p.ref, p.text, p.note])];
    lead._hay = parts.filter(Boolean).join(" ").toLowerCase().normalize("NFD").replace(/[̀-ًͯ-ٰٟۖ-ۭ]/g, "");
    return lead._hay;
  }
  const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ًͯ-ٰٟۖ-ۭ]/g, "");

  function matches(lead, skip) {
    if (state.q && !norm(state.q).split(/\s+/).filter(Boolean).every(w => haystack(lead).includes(w))) return false;
    for (const key of ["relations", "standing", "status", "layers"]) {
      if (key === skip || !state[key].size) continue;
      if (!leadValue(lead, key).some(v => state[key].has(v))) return false;
    }
    if (skip !== "traditions" && state.traditions.size) {
      for (const t of state.traditions) if (!lead.traditions.includes(t)) return false;
    }
    return true;
  }

  function chip(label, value, key, count) {
    const pressed = state[key].has(value);
    return `<button type="button" class="chip" data-key="${key}" data-value="${esc(value)}" aria-pressed="${pressed}">${esc(label)}<span class="n">${count}</span></button>`;
  }

  function renderFilters() {
    for (const key of ["relations", "standing", "status", "layers"]) {
      const pool = DATA.leads.filter(l => matches(l, key));
      document.getElementById("f-" + key).innerHTML = ORDER[key]
        .map(v => chip(v, v, key, pool.filter(l => leadValue(l, key).includes(v)).length)).join("");
    }
    const pool = DATA.leads.filter(l => matches(l, "traditions"));
    const html = DATA.groups.map(g => {
      const trads = DATA.traditions.filter(t => t.group === g.id);
      const families = [...new Set(trads.map(t => t.family))];
      const body = families.map(f => {
        const items = trads.filter(t => t.family === f)
          .map(t => chip(t.name, t.id, "traditions", pool.filter(l => l.traditions.includes(t.id)).length)).join("");
        return (families.length > 1 || f !== g.name ? `<div class="tfamily">${esc(f)}</div>` : "") + `<div class="tlist">${items}</div>`;
      }).join("");
      return `<div class="tgroup"><div class="tgroup-name">${esc(g.name)}</div>${body}</div>`;
    }).join("");
    document.getElementById("f-traditions").innerHTML = html;
    document.getElementById("sort").innerHTML = [["title", "A–Z"], ["standing", "Standing"], ["traditions", "Most traditions"]]
      .map(([v, l]) => `<button type="button" class="chip" data-sort="${v}" aria-pressed="${state.sort === v}">${l}</button>`).join("");
  }

  function notesHtml(md) {
    const lines = (md || "").split("\n");
    let out = "", list = false, content = false;
    for (const raw of lines) {
      const line = raw.trimEnd();
      const h = line.match(/^#{1,6}\s+(.*)$/);
      const li = line.match(/^\s*[-*]\s+(.*)$/);
      if (list && !li) { out += "</ul>"; list = false; }
      if (h) out += `<h4>${esc(h[1])}</h4>`;
      else if (li) { if (!list) { out += "<ul>"; list = true; } out += `<li>${esc(li[1])}</li>`; content = true; }
      else if (line.trim()) { out += `<p>${esc(line)}</p>`; content = true; }
    }
    if (list) out += "</ul>";
    return content ? out : `<p class="empty">No review notes yet. Add them under the headings in the lead file.</p>`;
  }

  function leadHtml(lead, open) {
    const trads = lead.traditions.map(t => TRAD[t]?.name || t).join(" · ");
    const tags = [
      `<span class="tag standing">${esc(lead.standing)}</span>`,
      `<span class="tag status" data-status="${esc(lead.status)}">${esc(lead.status)}</span>`,
      ...lead.relations.map(r => `<span class="tag">${esc(r)}</span>`),
      lead.benchmark ? `<span class="tag bench">benchmark</span>` : "",
    ].join("");
    const lexical = lead.lexical?.length ? `<section><h3>Words</h3><div class="table-scroll"><table>
        <thead><tr><th>Lang</th><th>Form</th><th>Translit.</th><th>Gloss</th></tr></thead><tbody>
        ${lead.lexical.map(x => `<tr><td>${esc(x.lang)}</td><td class="form" lang="${esc(x.lang)}">${esc(x.form)}</td><td><i>${esc(x.translit)}</i></td><td>${esc(x.gloss)}</td></tr>`).join("")}
        </tbody></table></div></section>` : "";
    const passages = lead.passages?.length ? `<section><h3>Passages</h3>${lead.passages.map(p => `<div class="passage">
        <div><span class="ref">${esc(p.ref)}</span> <span class="trad">${esc(TRAD[p.tradition]?.name || p.tradition)}</span></div>
        ${p.text ? `<div class="text" lang="ar">${esc(p.text)}</div>` : ""}
        ${p.note ? `<div class="note">${esc(p.note)}</div>` : ""}</div>`).join("")}</section>` : "";
    const evidence = lead.evidence?.length ? `<section><h3>Evidence</h3><ul>${lead.evidence.map(e => `<li>${esc(e)}</li>`).join("")}</ul></section>` : "";
    const tagsList = [...(lead.motifs || []), ...(lead.concepts || [])];
    const motifs = tagsList.length ? `<section><h3>Motifs &amp; concepts</h3><div class="meta">${tagsList.map(m => `<span class="tag">${esc(m)}</span>`).join("")}</div></section>` : "";
    const sources = lead.sources?.length ? `<section><h3>Sources</h3><ul>${lead.sources.map(s => `<li>${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a>` : esc(s.label)}</li>`).join("")}</ul></section>` : "";
    const direction = lead.direction ? `<section><h3>Direction</h3><div class="path">${esc(lead.direction)}</div></section>` : "";
    return `<li class="lead" id="${esc(lead.id)}" data-standing="${esc(lead.standing)}"><details${open ? " open" : ""}>
      <summary><div class="meta">${tags}</div><p class="lead-title">${esc(lead.title)}</p><p class="lead-summary">${esc(lead.summary)}</p><div class="trads">${esc(trads)}</div></summary>
      <div class="body">${lexical}${passages}${evidence}${direction}${motifs}${sources}
        <section><h3>Review notes</h3><div class="notes">${notesHtml(lead.notes)}</div></section>
        <div class="path">leads/${esc(lead.id)}.md · added ${esc(lead.added)} · ${esc(lead.origin)}</div>
      </div></details></li>`;
  }

  function renderLeads() {
    const rank = s => ORDER.standing.indexOf(s);
    const list = DATA.leads.filter(l => matches(l)).sort((a, b) =>
      state.sort === "standing" ? rank(a.standing) - rank(b.standing) || a.title.localeCompare(b.title)
      : state.sort === "traditions" ? b.traditions.length - a.traditions.length || a.title.localeCompare(b.title)
      : a.title.localeCompare(b.title));
    const openId = decodeURIComponent(location.hash.slice(1));
    document.getElementById("count").textContent = `${list.length} of ${DATA.leads.length} leads`;
    document.getElementById("leads").innerHTML = list.length
      ? list.map(l => leadHtml(l, l.id === openId)).join("")
      : `<li class="empty-state">No leads match these filters. Clear a filter or change the search.</li>`;
  }

  function render() { renderFilters(); renderLeads(); }

  document.addEventListener("click", e => {
    const c = e.target.closest("[data-key]");
    if (c) {
      const set = state[c.dataset.key];
      set.has(c.dataset.value) ? set.delete(c.dataset.value) : set.add(c.dataset.value);
      render(); return;
    }
    const s = e.target.closest("[data-sort]");
    if (s) { state.sort = s.dataset.sort; render(); }
  });
  document.getElementById("leads").addEventListener("toggle", e => {
    const li = e.target.closest(".lead");
    if (li && e.target.open) history.replaceState(null, "", "#" + li.id);
  }, true);
  document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; render(); });
  document.getElementById("reset").addEventListener("click", () => {
    state.q = ""; document.getElementById("q").value = "";
    for (const k of ["relations", "standing", "status", "layers", "traditions"]) state[k].clear();
    render();
  });
  window.addEventListener("hashchange", () => {
    renderLeads();
    const el = document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if (el) el.scrollIntoView({ block: "start" });
  });

  render();
  const first = document.getElementById(decodeURIComponent(location.hash.slice(1)));
  if (first) first.scrollIntoView({ block: "start" });
})();
</script>
