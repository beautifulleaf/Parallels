<style>
/* Layout: a ledger. Filter rail on the left, lead entries as a single reading column; entries open in place. */
:root {
  --bg: #f4f5f9;
  --surface: #ffffff;
  --fg: #1a1e30;
  --muted: #5b6078;
  --rule: #d9dceb;
  --lapis: #2741a3;
  --lapis-soft: #e3e8fb;
  --gold: #946f12;
  --gold-soft: #f6edd3;
  --est: #2f7a55;
  --prop: #2741a3;
  --cont: #b06a12;
  --fringe: #a33a3a;
  --font-display: "Marcellus", "Trajan Pro", Georgia, serif;
  --font-body: "Source Serif 4", "Noto Naskh Arabic", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --font-arabic: "Noto Naskh Arabic", "Geeza Pro", "Traditional Arabic", serif;
  --font-hebrew: "Noto Serif Hebrew", "SBL Hebrew", "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1220; --surface: #171b2c; --fg: #e5e8f3; --muted: #9aa0bd; --rule: #2a3049;
    --lapis: #93a8ff; --lapis-soft: #232c52; --gold: #d8b456; --gold-soft: #3a3120;
    --est: #6fc79a; --prop: #93a8ff; --cont: #e3a457; --fringe: #ec8a8a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1220; --surface: #171b2c; --fg: #e5e8f3; --muted: #9aa0bd; --rule: #2a3049;
  --lapis: #93a8ff; --lapis-soft: #232c52; --gold: #d8b456; --gold-soft: #3a3120;
  --est: #6fc79a; --prop: #93a8ff; --cont: #e3a457; --fringe: #ec8a8a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.55;
}
.wrap {
  max-width: 1180px; margin: 0 auto;
  padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header.top { display: grid; gap: 6px; margin-bottom: 24px; }
h1 {
  font-family: var(--font-display); font-weight: 400; font-size: clamp(30px, 5vw, 44px);
  letter-spacing: 0.04em; margin: 0; text-wrap: balance;
}
.lede { color: var(--muted); margin: 0; max-width: 65ch; }
.layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 32px; align-items: start; }
@media (max-width: 820px) { .layout { grid-template-columns: minmax(0, 1fr); gap: 20px; } }

/* Filter rail */
aside.rail { display: grid; gap: 22px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
@media (max-width: 820px) { aside.rail { position: static; } }
.rail h2 {
  font-family: var(--font-mono); font-size: 11px; font-weight: 500; text-transform: uppercase;
  letter-spacing: 0.12em; color: var(--muted); margin: 0 0 8px;
}
.search {
  width: 100%; font: inherit; font-size: 15px; padding: 10px 12px; border-radius: 6px;
  border: 1px solid var(--rule); background: var(--surface); color: var(--fg);
}
.search:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--lapis); outline-offset: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font-family: var(--font-mono); font-size: 12px; padding: 4px 9px; border-radius: 999px;
  border: 1px solid var(--rule); background: transparent; color: var(--fg); cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--lapis); border-color: var(--lapis); color: var(--surface); }
.chip .n { color: var(--muted); margin-left: 4px; }
.chip[aria-pressed="true"] .n { color: inherit; opacity: 0.75; }
.tgroup { display: grid; gap: 4px; }
.tgroup + .tgroup { margin-top: 10px; }
.tgroup-name { font-family: var(--font-display); font-size: 15px; letter-spacing: 0.03em; }
.tfamily { font-size: 12px; color: var(--muted); margin-top: 4px; }
.tlist { display: flex; flex-wrap: wrap; gap: 4px; }
.reset { font: inherit; font-size: 14px; color: var(--lapis); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }

/* Results */
.resultbar { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: baseline; margin-bottom: 12px; }
.count { font-family: var(--font-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.sort { display: flex; gap: 6px; }
ol.leads { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.lead {
  background: var(--surface); border: 1px solid var(--rule); border-radius: 8px;
  border-left: 4px solid var(--standing, var(--rule));
}
.lead[data-standing="established"] { --standing: var(--est); }
.lead[data-standing="proposed"] { --standing: var(--prop); }
.lead[data-standing="contested"] { --standing: var(--cont); }
.lead[data-standing="fringe"] { --standing: var(--fringe); }
.lead > details > summary { list-style: none; cursor: pointer; padding: 14px 16px; display: grid; gap: 6px; }
.lead > details > summary::-webkit-details-marker { display: none; }
.lead-title { font-size: 18px; font-weight: 600; line-height: 1.3; margin: 0; text-wrap: balance; }
.lead-summary { margin: 0; color: var(--muted); font-size: 15px; max-width: 72ch; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tag {
  font-family: var(--font-mono); font-size: 11px; padding: 2px 7px; border-radius: 4px;
  background: var(--lapis-soft); color: var(--fg); letter-spacing: 0.02em;
}
.tag.standing { background: transparent; border: 1px solid var(--standing); color: var(--standing); }
.tag.status { background: transparent; border: 1px dashed var(--muted); color: var(--muted); }
.tag.status[data-status="investigating"] { border-style: solid; color: var(--lapis); border-color: var(--lapis); }
.tag.status[data-status="promising"] { border-style: solid; color: var(--est); border-color: var(--est); }
.tag.status[data-status="rejected"] { text-decoration: line-through; }
.tag.bench { background: var(--gold-soft); color: var(--gold); }
.trads { font-size: 13px; color: var(--muted); }

.body { padding: 0 16px 16px; display: grid; gap: 16px; border-top: 1px solid var(--rule); padding-top: 14px; }
.body h3 {
  font-family: var(--font-mono); font-size: 11px; font-weight: 500; text-transform: uppercase;
  letter-spacing: 0.12em; color: var(--muted); margin: 0 0 6px;
}
.body ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.table-scroll { overflow-x: auto; }
table { border-collapse: collapse; font-size: 14px; min-width: 100%; }
th, td { text-align: left; padding: 5px 10px 5px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-family: var(--font-mono); font-size: 11px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
.form { font-size: 18px; }
[lang="ar"], [lang="arc"], [lang="myz"] { font-family: var(--font-arabic); }
[lang="he"] { font-family: var(--font-hebrew); }
.passage { display: grid; gap: 2px; padding: 8px 0; border-bottom: 1px solid var(--rule); }
.passage:last-child { border-bottom: 0; }
.passage .ref { font-family: var(--font-mono); font-size: 12px; color: var(--lapis); }
.passage .trad { color: var(--muted); }
.passage .text { font-size: 20px; line-height: 1.9; }
.passage .text[dir="rtl"] { text-align: right; }
.passage .translation { font-size: 14px; color: var(--muted); font-style: italic; }
.passage .src { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.basis { font-family: var(--font-mono); font-size: 10px; padding: 1px 6px; border-radius: 4px; margin-right: 6px; border: 1px solid var(--rule); color: var(--muted); white-space: nowrap; }
.basis[data-basis="original"] { border-color: var(--est); color: var(--est); }
.basis[data-basis="gloss"] { border-color: var(--cont); color: var(--cont); }
.basis[data-basis="scholarship"] { border-color: var(--prop); color: var(--prop); }
.tag.review { background: transparent; border: 1px dashed var(--cont); color: var(--cont); }
.tag.review[data-checked="true"] { border-style: solid; border-color: var(--est); color: var(--est); }
.review-item { font-size: 14px; }
.hint { font-size: 13px; color: var(--muted); }
.passage .note { font-size: 14px; color: var(--muted); }
.notes { font-size: 15px; }
.notes p { margin: 0 0 6px; }
.notes h4 { font-family: var(--font-display); font-weight: 400; font-size: 16px; margin: 8px 0 4px; }
.notes .empty { color: var(--muted); font-style: italic; }
.path { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.body a { color: var(--lapis); }
.legend { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; background: var(--c); }
.empty-state { padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--rule); border-radius: 8px; }
@media (prefers-reduced-motion: no-preference) { .lead { transition: border-color 0.15s; } }
</style>

<div class="wrap">
  <header class="top">
    <h1>Parallels Ledger</h1>
    <p class="lede">Leads on parallels, convergences, and responses between traditions. Each lead is one file in <code>leads/</code>; review status and notes come from the repo.</p>
  </header>

  <div class="layout">
    <aside class="rail" aria-label="Filters">
      <div>
        <label for="q"><h2>Search</h2></label>
        <input id="q" class="search" type="search" placeholder="yamm, flood, Mani, 20:39…" autocomplete="off">
      </div>
      <div><h2>Relation</h2><div class="chips" id="f-relations"></div></div>
      <div><h2>Standing</h2><div class="chips" id="f-standing"></div></div>
      <div><h2>Review status</h2><div class="chips" id="f-status"></div></div>
      <div><h2>Layer</h2><div class="chips" id="f-layers"></div></div>
      <div><h2>Checked in the original</h2><div class="chips" id="f-review"></div></div>
      <div><h2>Traditions</h2><div id="f-traditions"></div></div>
      <div class="legend" aria-label="Standing colors">
        <span style="--c: var(--est)">established in scholarship</span>
        <span style="--c: var(--prop)">proposed</span>
        <span style="--c: var(--cont)">contested</span>
        <span style="--c: var(--fringe)">fringe</span>
      </div>
      <button class="reset" id="reset" type="button">Clear all filters</button>
    </aside>

    <main>
      <div class="resultbar">
        <span class="count" id="count"></span>
        <div class="sort chips" id="sort"></div>
      </div>
      <ol class="leads" id="leads"></ol>
    </main>
  </div>
</div>

لِّ شَىْءٍ شَهِيدٌ"}], "evidence": [{"text": "A proposed etymology links the name to Aramaic/Mandaic ṣbaʿ 'immerse', which would fit a baptist group.", "basis": "scholarship"}], "sources": [{"label": "Quran 2:62 (quran.com)", "url": "https://quran.com/2/62"}], "benchmark": true, "origin": "human", "added": "2026-10-29", "notes": "## Questions\n\n## Notes"}, {"id": "sargon-moses-basket", "title": "Sargon and Moses: the infant in the sealed basket", "summary": "The Neo-Assyrian Sargon Birth Legend has a baby placed in a reed basket sealed with bitumen, set on the river, and raised by a water-drawer. Exodus 2 and the Quran's Moses (into al-yamm) share the motif.", "status": "new", "relations": ["transmission", "convergence"], "standing": "proposed", "traditions": ["ane-akkadian", "judaism", "islam"], "layers": ["motif"], "motifs": ["infant-set-adrift", "reed-basket", "sealed-with-bitumen", "raised-by-strangers"], "passages": [{"tradition": "ane-akkadian", "ref": "Sargon Birth Legend"}, {"tradition": "judaism", "ref": "Exodus 2:1–10", "note": "papyrus basket daubed with bitumen and pitch", "lang": "he", "source": "Westminster Leningrad Codex (OSHB)", "text": "(2:1) וַיֵּ֥לֶךְ אִ֖ישׁ מִבֵּ֣ית לֵוִ֑י וַיִּקַּ֖ח אֶת בַּת לֵוִֽי (2:2) וַתַּ֥הַר הָאִשָּׁ֖ה וַתֵּ֣לֶד בֵּ֑ן וַתֵּ֤רֶא אֹתוֹ֙ כִּי ט֣וֹב ה֔וּא וַֽתִּצְפְּנֵ֖הוּ שְׁלֹשָׁ֥ה יְרָחִֽים (2:3) וְלֹא יָכְלָ֣ה עוֹד֮ הַצְּפִינוֹ֒ וַתִּֽקַּֽח לוֹ֙ תֵּ֣בַת גֹּ֔מֶא וַתַּחְמְרָ֥ה בַחֵמָ֖ר וּבַזָּ֑פֶת וַתָּ֤שֶׂם בָּהּ֙ אֶת הַיֶּ֔לֶד וַתָּ֥שֶׂם בַּסּ֖וּף עַל שְׂפַ֥ת הַיְאֹֽר (2:4) וַתֵּתַצַּ֥ב אֲחֹת֖וֹ מֵרָחֹ֑ק לְדֵעָ֕ה מַה יֵּעָשֶׂ֖ה לֽוֹ (2:5) וַתֵּ֤רֶד בַּת פַּרְעֹה֙ לִרְחֹ֣ץ עַל הַיְאֹ֔ר וְנַעֲרֹתֶ֥יהָ הֹלְכֹ֖ת עַל יַ֣ד הַיְאֹ֑ר וַתֵּ֤רֶא אֶת הַתֵּבָה֙ בְּת֣וֹךְ הַסּ֔וּף וַתִּשְׁלַ֥ח אֶת אֲמָתָ֖הּ וַתִּקָּחֶֽהָ (2:6) וַתִּפְתַּח֙ וַתִּרְאֵ֣הוּ אֶת הַיֶּ֔לֶד וְהִנֵּה נַ֖עַר בֹּכֶ֑ה וַתַּחְמֹ֣ל עָלָ֔יו וַתֹּ֕אמֶר מִיַּלְדֵ֥י הָֽעִבְרִ֖ים זֶֽה (2:7) וַתֹּ֣אמֶר אֲחֹתוֹ֮ אֶל בַּת פַּרְעֹה֒ הַאֵלֵ֗ךְ וְקָרָ֤אתִי לָךְ֙ אִשָּׁ֣ה מֵ  the yamm passages with lead yamm-sea.", "basis": "scholarship"}, {"text": "The bitumen sealing is a specific shared detail between Sargon and Exodus.", "basis": "scholarship"}], "sources": [{"label": "Quran 28:7 (quran.com)", "url": "https://quran.com/28/7"}], "benchmark": true, "origin": "human", "added": "2026-10-29", "notes": "## Questions\n\n## Notes"}, {"id": "saving-one-life", "title": "Whoever saves one life", "summary": "Mishnah Sanhedrin 4:5 teaches that destroying one life is like destroying a world, and saving one is like saving a world. Quran 5:32 states the same principle as decreed for the Children of Israel.", "status": "new", "relations": ["transmission"], "direction": "judaism -> islam", "standing": "established", "traditions": ["judaism", "islam"], "layers": ["concept"], "concepts": ["sanctity-of-life"], "passages": [{"tradition": "judaism", "ref": "Mishnah Sanhedrin 4:5"}, {"tradition": "islam", "ref": "Quran 5:32", "lang": "ar", "source": "Quranic Arabic Corpus (Uthmani script)", "text": "مِنْ أَجْلِ ذَٰلِكَ كَتَبْنَا عَلَىٰ بَنِىٓ إِسْرَٰٓءِيلَ أَنَّهُۥ مَن قَتَلَ نَفْسًۢا بِغَيْرِ نَفْسٍ أَوْ فَسَادٍ فِى ٱلْأَرْضِ فَكَأَنَّمَا قَتَلَ ٱلنَّاسَ جَمِيعًا وَمَنْ أَحْيَاهَا فَكَأَنَّمَآ أَحْيَا ٱلنَّاسَ جَمِيعًا وَلَقَدْ جَآءَتْهُمْ رُسُلُنَا بِٱلْبَيِّنَٰتِ ثُمَّ إِنَّ كَثِيرًا مِّنْهُم بَعْدَ ذَٰلِكَ فِى ٱلْأَرْضِ لَمُسْرِفُونَ"}], "evidence": [{"text": "The Quran explicitly frames it as a precept for the Children of Israel.", "basis": "scholarship"}, {"text": "Mishnah manuscripts differ: some read 'a single life', others 'a single life of Israel'. Compare which reading the Quran matches.", "basis": "scholarship"}], "sources": [{"label": "Mishnah Sanhedrin 4:5 (Sefaria)", "url": "https://www.sefaria.org/Mishnah_Sanhedrin.4.5"}, {"label": "Quran 5:32 (quran.com)", "url": "https://quran.com/5/32"}], "benchmark": true, "origin": "human", "added": "2026-10-29", "notes": "## Questions\n\n## Notes"}, {"id": "sirr-i-akbar", "title": "Dara Shikoh's Upanishads reach Schopenhauer", "summary": "Dara Shikoh translated 50 Upanishads into Persian as the Sirr-i Akbar (1657). Anquetil-Duperron's Latin version (Oupnek'hat, 1801–02) is how Schopenhauer read them.", "status": "new", "relations": ["response", "transmission"], "direction": "hinduism -> islam -> western-philosophy", "standing": "established", "traditions": ["hinduism", "islam", "western-philosophy"], "layers": ["concept"], "concepts": ["unity-of-being", "self-and-absolute"], "passages": [{"tradition": "islam", "ref": "Dara Shikoh, Sirr-i Akbar (1657); Majmaʿ al-Baḥrayn (1655)"}, {"tradition": "western-philosophy", "ref": "Anquetil-Duperron, Oupnek'hat; Schopenhauer"}], "evidence": [{"text": "Majmaʿ al-Baḥrayn ('the meeting of the two seas') takes its title from Quran 18:60.", "basis": "scholarship"}], "benchmark": true, "origin": "human", "added": "2026-10-29", "notes": "## Questions\n\n## Notes"}, {"id": "sleepers-cave", "title": "Seven Sleepers and the People of the Cave", "summary": "Youths fleeing persecution sleep in a cave for centuries and wake to a changed world. Told in Syriac (Jacob of Serugh), Greek, and Latin sources, and in Quran 18:9–26.", "status": "new", "relations": ["transmission"], "standing": "established", "traditions": ["christianity-eastern", "christianity-western", "islam"], "layers": ["motif"], "motifs": ["sleepers-in-cave", "miraculous-sleep", "persecution", "dog-companion"], "passages": [{"tradition": "christianity-eastern", "ref": "Jacob of Serugh, homily on the Sleepers of Ephesus"}, {"tradition": "christianity-western", "ref": "Gregory of Tours, Passio septem dormientium"}, {"tradition": "islam", "ref": "Quran 18:9–26", "lang": "ar", "source": "Quranic Arabic Corpus (Uthmani script)", "text_omitted": "longer than 12 verses; read it in the source"}], "evidence": [{"text": "The Quran's debate over how many sleepers there were (18:22) suggests the audience knew competing versions.", "basis": "scholarship"}], "sources": [{"label": "Quran 18:9 (quran.com)", "url": "https://quran.com/18/9"}], "benchmark": true, "origin": "human", "added": "2026-10-29", "notes": "## Questions\n\n## Notes"}, {"id": "tannur-loan-chain", "title": "tannūr: the oven that boiled at the Flood", "summary": "Akkadian tinūru (oven) reached Aramaic, Hebrew, and Arabic. In the Quran's Noah narrative the sign of the Flood is that the tannūr boiled over.", "status": "new", "relations": ["transmission"], "direction": "ane-akkadian -> aramaic/hebrew -> islam", "standing": "established", "traditions": ["ane-akkadian", "judaism", "islam"], "layers": ["lexical", "motif"], "motifs": ["flood", "boiling-flood-waters"], "lexical": [{"lang": "akk", "form": "tinūru", "translit": "tinūru", "gloss": "oven"}, {"lang": "he", "form": "תַּנּוּר", "translit": "tannûr", "gloss": "oven"}, {"lang": "ar", "form": "تنّور", "translit": "tannūr", "gloss": "oven"}], "passages": [{"tradition": "islam", "ref": "Quran 11:40", "note": "and the oven boiled (fāra al-tannūr)", "lang": "ar", "source": "Quranic Arabic Corpus (Uthmani script)", "text": "حَتَّىٰٓ إِذَا جَآءَ أَمْرُنَا وَفَارَ ٱلتَّنُّورُ قُلْنَا ٱحْمِلْ فِيهَا مِن كُلٍّ زَوْجَيْنِ ٱثْنَيْنِ وَأَهْلَكَ إِلَّا مَن سَبَقَ عَلَيْهِ ٱلْقَوْلُ وَمَنْ ءَامَنَ وَمَآ ءَامَنَ مَعَهُۥٓ إِلَّا قَلِيلٌ"}, {"tradition": "islam", "ref": "Quran 23:27", "lang": "ar", "source": "Quranic Arabic Corpus (Uthmani script)", "text": "فَأَوْحَيْنَآ إِلَيْهِ أَنِ ٱصْنَعِ ٱلْفُلْكَ بِأَعْيُنِنَا وَوَحْيِنَا فَإِذَا جَآءَ أَمْرُنَا وَفَارَ ٱلتَّنُّورُ فَٱسْلُكْ فِيهَا مِن كُلٍّ زَوْجَيْنِ ٱثْنَيْنِ وَأَهْلَكَ إِلَّا مَن سَبَقَ عَلَيْهِ ٱلْقَوْلُ مِنْهُمْ وَلَا تُخَٰطِبْنِى فِى ٱلَّذِينَ ظَلَمُوٓا۟ إِنَّهُم مُّغْرَقُونَ"}], "evidence": [{"text": "The loan chain is established. The motif link (a hot or boiling flood) is the lead to investigate.", "basis": "scholarship"}], "sources": [{"label": "Quran 11:40 (quran.com)", "url": "https://quran.com/11/40"}, {"label": "Quran 23:27 (quran.com)", "url": "https://quran.com/23/27"}], "benchmark": true, "origin": "human", "added": "2026-10-29", "notes": "## Questions\n\n## Notes"}, {"id": "theology-of-aristotle", "title": "Plotinus as the 'Theology of Aristotle'", "summary": "An Arabic paraphrase of Plotinus' Enneads IV–VI circulated as the 'Theology of Aristotle' (al-Kindi's circle, 9th c.) and shaped Islamic Neoplatonism.", "status": "new", "relations": ["transmission"], "direction": "greco-roman -> islam", "standing": "established", "traditions": ["greco-roman", "islam"], "layers": ["concept"], "concepts": ["the-one", "emanation", "intellect"], "passages": [{"tradition": "greco-roman", "ref": "Plotinus, Enneads IV–VI"}, {"tradition": "islam", "ref": "Uthūlūjiyā Arisṭāṭālīs"}], "benchmark": true, "origin": "human", "added": "2026-10-29", "notes": "## Questions\n\n## Notes"}, {"id": "treaty-form-deuteronomy", "title": "Ancient treaty form and Deuteronomy's covenant", "summary": "Deuteronomy follows the structure of ancient Near Eastern vassal treaties: preamble, history, stipulations, deposit, witnesses, curses and blessings.", "status": "new", "relations": ["transmission"], "standing": "established", "traditions": ["ane-hittite", "ane-akkadian", "judaism"], "layers": ["concept"], "concepts": ["covenant", "treaty-form"], "passages": [{"tradition": "ane-hittite", "ref": "Hittite vassal treaties (14th–13th c. BCE)"}, {"tradition": "ane-akkadian", "ref": "Esarhaddon's Succession Treaty (672 BCE)"}, {"tradition": "judaism", "ref": "Deuteronomy"}], "evidence": [{"text": "Mendenhall (1954) argued for the Hittite model. Many scholars now consider Neo-Assyrian treaties the closer parallel. Which source is closer is the open question.", "basis": "scholarship"}], "benchmark": true, "origin": "human", "added": "2026-10-29", "notes": "## Questions\n\n## Notes"}, {"id": "yamm-sea", "title": "al-yamm: the sea word reserved for Moses", "summary": "The Quran's usual word for sea is bahr, but al-yamm appears 8 times across 4 surahs, always in the Moses/Pharaoh narrative. It is the Semitic sea word shared with Hebrew yam, Ugaritic Yam, and Mandaic yama, and borrowed into New Kingdom Egyptian.", "status": "new", "relations": ["inheritance"], "standing": "established", "traditions": ["islam", "judaism", "ane-ugaritic", "ane-egyptian", "mandaeism"], "layers": ["lexical", "motif"], "motifs": ["sea", "infant-set-adrift", "crossing-the-sea", "chaos-waters"], "lexical": [{"lang": "ar", "form": "اليمّ", "translit": "al-yamm", "gloss": "the sea"}, {"lang": "he", "form": "יָם", "translit": "yam", "gloss": "sea (yam suf, Exodus 15:4)"}, {"lang": "uga", "form": "ym", "translit": "Yam", "gloss": "Sea, the sea god opposed to Baal"}, {"lang": "egy", "form": "ym", "translit": "ym", "gloss": "sea (Semitic loan)"}, {"lang": "myz", "form": "yama", "translit": "yama", "gloss": "sea"}], "passages": [{"tradition": "islam", "ref": "Quran 7:136", "note": "Pharaoh's people drowned in the yamm", "lang": "ar", "source": "Quranic Arabic Corpus (Uthmani script)", "text": "فَٱنتَقَمْنَا مِنْهُمْ فَأَغْرَقْنَٰهُمْ فِى ٱلْيَمِّ بِأَنَّهُمْ كَذَّبُوا۟ بِـَٔايَٰتِنَا وَكَانُوا۟ عَنْهَا غَٰفِلِينَ"}, {"tradition": "islam", "ref": "Quran 20:39", "note": "Infant Moses cast into the yamm (two occurrences)", "lang": "ar", "source": "Quranic Arabic Corpus (Uthmani script)", "text": "أَنِ ٱقْذِفِيهِ فِى ٱلتَّابُوتِ فَٱقْذِفِيهِ فِى ٱلْيَمِّ فَلْيُلْقِهِ ٱلْيَمُّ بِٱلسَّاحِلِ يَأْخُذْهُ عَدُوٌّ لِّى وَعَدُوٌّ لَّهُۥ وَأَلْقَيْتُ عَلَيْكَ مَحَبَّةً مِّنِّى وَلِتُصْنَعَ عَلَىٰ عَيْنِىٓ"}, {"tradition": "islam", "ref": "Quran 20:78", "note": "Pharaoh's army overwhelmed", "lang": "ar", "source": "Quranic Arabic Corpus (Uthmani script)", "text": "فَأَتْبَعَهُمْ فِرْعَوْنُ بِجُنُودِهِۦ فَغَشِيَهُم مِّنَ ٱلْيَمِّ مَا غَشِيَهُمْ"}, {"tradition": "islam", "ref": "Quran 20:97", "note": "The golden calf scattered into the yamm", "lang": "ar", "source": "Quranic Arabic Corpus (Uthmani script)", "text": "قَالَ فَٱذْهَبْ فَإِنَّ لَكَ فِى ٱلْحَيَوٰةِ أَن تَقُولَ لَا مِسَاسَ وَإِنَّ لَكَ مَوْعِدًا لَّن تُخْلَفَهُۥ وَٱنظُرْ إِلَىٰٓ إِلَٰهِكَ ٱلَّذِى ظَلْتَ عَلَيْهِ عَاكِفًا لَّنُحَرِّقَنَّهُۥ ثُمَّ لَنَنسِفَنَّهُۥ فِى ٱلْيَمِّ نَسْفًا"}, {"tradition": "islam", "ref": "Quran 28:7", "note": "Moses' mother told to cast him into the yamm", "lang": "ar", "source": "Quranic Arabic Corpus (Uthmani script)", "text": "وَأَوْحَيْنَآ إِلَىٰٓ أُمِّ مُوسَىٰٓ أَنْ أَرْضِعِيهِ فَإِذَا خِفْتِ عَلَيْهِ فَأَلْقِيهِ فِى ٱلْيَمِّ وَلَا تَخَافِى وَلَا تَحْزَنِىٓ إِنَّا رَآدُّوهُ إِلَيْكِ وَجَاعِلُوهُ مِنَ ٱلْمُرْسَلِينَ"}, {"tradition": "islam", "ref": "Quran 28:40", "note": "Pharaoh and his army cast into the yamm", "lang": "ar", "source": "Quranic Arabic Corpus (Uthmani script)", "text": "فَأَخَذْنَٰهُ وَجُنُودَهُۥ فَنَبَذْنَٰهُمْ فِى ٱلْيَمِّ فَٱنظُرْ كَيْفَ كَانَ عَٰقِبَةُ ٱلظَّٰلِمِينَ"}, {"tradition": "islam", "ref": "Quran 51:40", "note": "Pharaoh and his army cast into the yamm", "lang": "ar", "source": "Quranic Arabic Corpus (Uthmani script)", "text": "فَأَخَذْنَٰهُ وَجُنُودَهُۥ فَنَبَذْنَٰهُمْ فِى ٱلْيَمِّ وَهُوَ مُلِيمٌ"}, {"tradition": "judaism", "ref": "Exodus 15:4", "note": "Pharaoh's officers drowned in yam suf", "lang": "he", "source": "Westminster Leningrad Codex (OSHB)", "text": "מַרְכְּבֹ֥ת פַּרְעֹ֛ה וְחֵיל֖וֹ יָרָ֣ה בַיָּ֑ם וּמִבְחַ֥ר שָֽׁלִשָׁ֖יו טֻבְּע֥וּ בְיַם סֽוּף"}], "evidence": [{"text": "8 occurrences of the lemma, verified with the Quran word concordance (root ي م م); the other root hits are the unrelated verb tayammum (2:267, 4:43, 5:6).", "basis": "original"}, {"text": "Dispersion: 4 surahs (7, 20, 28, 51), 1 narrative. Concentrated in one story while spread across the text.", "basis": "original"}, {"text": "Synonym-choice skew: bahr is the general word for sea elsewhere in the Quran.", "basis": "original"}, {"text": "Egyptian ym is a Semitic loanword, so this is shared Semitic vocabulary fitting the Egyptian setting, not an Egyptian borrowing into Arabic.", "basis": "scholarship"}], "sources": [{"label": "Quran 20:39 (quran.com)", "url": "https://quran.com/20/39"}, {"label": "Quran 28:7 (quran.com)", "url": "https://quran.com/28/7"}], "benchmark": true, "origin": "human", "added": "2026-10-29", "notes": "## Questions\n\n## Notes"}]}</script>
<script>
(function () {
  const DATA = JSON.parse(document.getElementById("data").textContent);
  const TRAD = Object.fromEntries(DATA.traditions.map(t => [t.id, t]));
  const ORDER = {
    relations: ["internal", "inheritance", "transmission", "convergence", "response"],
    standing: ["established", "proposed", "contested", "fringe"],
    status: ["new", "investigating", "promising", "rejected"],
    layers: ["lexical", "motif", "concept"],
    review: ["checked", "unchecked"],
  };
  const RTL = new Set(["ar", "he", "arc", "syc", "myz"]);
  const BASIS = { original: "from the original", lexicon: "from a lexicon", gloss: "relies on English glosses", scholarship: "secondary scholarship" };
  const state = { q: "", relations: new Set(), standing: new Set(), status: new Set(), layers: new Set(), review: new Set(), traditions: new Set(), sort: "title" };

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const leadValue = (lead, key) => key === "standing" || key === "status" ? [lead[key]]
    : key === "review" ? [(lead.reviews || []).length ? "checked" : "unchecked"] : (lead[key] || []);

  function haystack(lead) {
    if (lead._hay) return lead._hay;
    const parts = [lead.title, lead.summary, lead.notes, lead.direction, ...(lead.motifs || []), ...(lead.concepts || []), ...(lead.evidence || []).map(e => e.text || e),
      ...(lead.traditions || []).map(t => TRAD[t]?.name),
      ...(lead.lexical || []).flatMap(x => [x.form, x.translit, x.gloss]),
      ...(lead.passages || []).flatMap(p => [p.ref, p.text, p.note])];
    lead._hay = parts.filter(Boolean).join(" ").toLowerCase().normalize("NFD").replace(/[̀-ًͯ-ٰٟۖ-ۭ]/g, "");
    return lead._hay;
  }
  const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ًͯ-ٰٟۖ-ۭ]/g, "");

  function matches(lead, skip) {
    if (state.q && !norm(state.q).split(/\s+/).filter(Boolean).every(w => haystack(lead).includes(w))) return false;
    for (const key of ["relations", "standing", "status", "layers", "review"]) {
      if (key === skip || !state[key].size) continue;
      if (!leadValue(lead, key).some(v => state[key].has(v))) return false;
    }
    if (skip !== "traditions" && state.traditions.size) {
      for (const t of state.traditions) if (!lead.traditions.includes(t)) return false;
    }
    return true;
  }

  function chip(label, value, key, count) {
    const pressed = state[key].has(value);
    return `<button type="button" class="chip" data-key="${key}" data-value="${esc(value)}" aria-pressed="${pressed}">${esc(label)}<span class="n">${count}</span></button>`;
  }

  function renderFilters() {
    for (const key of ["relations", "standing", "status", "layers", "review"]) {
      const pool = DATA.leads.filter(l => matches(l, key));
      document.getElementById("f-" + key).innerHTML = ORDER[key]
        .map(v => chip(v, v, key, pool.filter(l => leadValue(l, key).includes(v)).length)).join("");
    }
    const pool = DATA.leads.filter(l => matches(l, "traditions"));
    const html = DATA.groups.map(g => {
      const trads = DATA.traditions.filter(t => t.group === g.id);
      const families = [...new Set(trads.map(t => t.family))];
      const body = families.map(f => {
        const items = trads.filter(t => t.family === f)
          .map(t => chip(t.name, t.id, "traditions", pool.filter(l => l.traditions.includes(t.id)).length)).join("");
        return (families.length > 1 || f !== g.name ? `<div class="tfamily">${esc(f)}</div>` : "") + `<div class="tlist">${items}</div>`;
      }).join("");
      return `<div class="tgroup"><div class="tgroup-name">${esc(g.name)}</div>${body}</div>`;
    }).join("");
    document.getElementById("f-traditions").innerHTML = html;
    document.getElementById("sort").innerHTML = [["title", "A–Z"], ["standing", "Standing"], ["traditions", "Most traditions"]]
      .map(([v, l]) => `<button type="button" class="chip" data-sort="${v}" aria-pressed="${state.sort === v}">${l}</button>`).join("");
  }

  function notesHtml(md) {
    const lines = (md || "").split("\n");
    let out = "", list = false, content = false;
    for (const raw of lines) {
      const line = raw.trimEnd();
      const h = line.match(/^#{1,6}\s+(.*)$/);
      const li = line.match(/^\s*[-*]\s+(.*)$/);
      if (list && !li) { out += "</ul>"; list = false; }
      if (h) out += `<h4>${esc(h[1])}</h4>`;
      else if (li) { if (!list) { out += "<ul>"; list = true; } out += `<li>${esc(li[1])}</li>`; content = true; }
      else if (line.trim()) { out += `<p>${esc(line)}</p>`; content = true; }
    }
    if (list) out += "</ul>";
    return content ? out : `<p class="empty">No review notes yet. Add them under the headings in the lead file.</p>`;
  }

  function leadHtml(lead, open) {
    const trads = lead.traditions.map(t => TRAD[t]?.name || t).join(" · ");
    const tags = [
      `<span class="tag standing">${esc(lead.standing)}</span>`,
      `<span class="tag status" data-status="${esc(lead.status)}">${esc(lead.status)}</span>`,
      ...lead.relations.map(r => `<span class="tag">${esc(r)}</span>`),
      lead.benchmark ? `<span class="tag bench">benchmark</span>` : "",
      `<span class="tag review" data-checked="${(lead.reviews || []).length > 0}">${(lead.reviews || []).length ? "checked in original" : "not yet checked"}</span>`,
    ].join("");
    const lexical = lead.lexical?.length ? `<section><h3>Words</h3><div class="table-scroll"><table>
        <thead><tr><th>Lang</th><th>Original</th><th>Translit.</th><th>English gloss (aid only)</th></tr></thead><tbody>
        ${lead.lexical.map(x => `<tr><td>${esc(x.lang)}</td><td class="form" lang="${esc(x.lang)}">${esc(x.form)}</td><td><i>${esc(x.translit)}</i></td><td>${esc(x.gloss)}</td></tr>`).join("")}
        </tbody></table></div></section>` : "";
    const passages = lead.passages?.length ? `<section><h3>Passages</h3>${lead.passages.map(p => `<div class="passage">
        <div><span class="ref">${esc(p.ref)}</span> <span class="trad">${esc(TRAD[p.tradition]?.name || p.tradition)}</span></div>
        ${p.text ? `<div class="text" lang="${esc(p.lang || "")}"${RTL.has(p.lang) ? ' dir="rtl"' : ""}>${esc(p.text)}</div>` : ""}
        ${p.text_omitted ? `<div class="hint">Original not shown: ${esc(p.text_omitted)}.</div>` : ""}
        ${p.translation ? `<div class="translation">${esc(p.translation)}</div>` : ""}
        ${p.note ? `<div class="note">${esc(p.note)}</div>` : ""}
        ${p.source ? `<div class="src">${esc(p.source)}</div>` : ""}</div>`).join("")}</section>` : "";
    const evidence = lead.evidence?.length ? `<section><h3>Evidence</h3><ul>${lead.evidence.map(e => typeof e === "string"
      ? `<li>${esc(e)}</li>`
      : `<li><span class="basis" data-basis="${esc(e.basis)}" title="${esc(BASIS[e.basis] || e.basis)}">${esc(e.basis)}</span>${esc(e.text)}</li>`).join("")}</ul></section>` : "";
    const reviews = `<section><h3>Checked in the original</h3>${(lead.reviews || []).length
      ? lead.reviews.map(r => `<div class="review-item"><b>${esc(r.verdict)}</b> by ${esc(r.by)}${r.date ? ` · ${esc(r.date)}` : ""}${r.scope ? ` · ${esc(r.scope)}` : ""}${r.note ? `<div class="hint">${esc(r.note)}</div>` : ""}</div>`).join("")
      : `<p class="hint">No reviewer has checked this lead against the original texts yet. Add an entry under <code>reviews</code> in the lead file.</p>`}</section>`;
    const tagsList = [...(lead.motifs || []), ...(lead.concepts || [])];
    const motifs = tagsList.length ? `<section><h3>Motifs &amp; concepts</h3><div class="meta">${tagsList.map(m => `<span class="tag">${esc(m)}</span>`).join("")}</div></section>` : "";
    const sources = lead.sources?.length ? `<section><h3>Sources</h3><ul>${lead.sources.map(s => `<li>${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a>` : esc(s.label)}</li>`).join("")}</ul></section>` : "";
    const direction = lead.direction ? `<section><h3>Direction</h3><div class="path">${esc(lead.direction)}</div></section>` : "";
    return `<li class="lead" id="${esc(lead.id)}" data-standing="${esc(lead.standing)}"><details${open ? " open" : ""}>
      <summary><div class="meta">${tags}</div><p class="lead-title">${esc(lead.title)}</p><p class="lead-summary">${esc(lead.summary)}</p><div class="trads">${esc(trads)}</div></summary>
      <div class="body">${lexical}${passages}${evidence}${direction}${motifs}${sources}
        ${reviews}
        <section><h3>Review notes</h3><div class="notes">${notesHtml(lead.notes)}</div></section>
        <div class="path">leads/${esc(lead.id)}.md · added ${esc(lead.added)} · ${esc(lead.origin)}</div>
      </div></details></li>`;
  }

  function renderLeads() {
    const rank = s => ORDER.standing.indexOf(s);
    const list = DATA.leads.filter(l => matches(l)).sort((a, b) =>
      state.sort === "standing" ? rank(a.standing) - rank(b.standing) || a.title.localeCompare(b.title)
      : state.sort === "traditions" ? b.traditions.length - a.traditions.length || a.title.localeCompare(b.title)
      : a.title.localeCompare(b.title));
    const openId = decodeURIComponent(location.hash.slice(1));
    document.getElementById("count").textContent = `${list.length} of ${DATA.leads.length} leads`;
    document.getElementById("leads").innerHTML = list.length
      ? list.map(l => leadHtml(l, l.id === openId)).join("")
      : `<li class="empty-state">No leads match these filters. Clear a filter or change the search.</li>`;
  }

  function render() { renderFilters(); renderLeads(); }

  document.addEventListener("click", e => {
    const c = e.target.closest("[data-key]");
    if (c) {
      const set = state[c.dataset.key];
      set.has(c.dataset.value) ? set.delete(c.dataset.value) : set.add(c.dataset.value);
      render(); return;
    }
    const s = e.target.closest("[data-sort]");
    if (s) { state.sort = s.dataset.sort; render(); }
  });
  document.getElementById("leads").addEventListener("toggle", e => {
    const li = e.target.closest(".lead");
    if (li && e.target.open) history.replaceState(null, "", "#" + li.id);
  }, true);
  document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; render(); });
  document.getElementById("reset").addEventListener("click", () => {
    state.q = ""; document.getElementById("q").value = "";
    for (const k of ["relations", "standing", "status", "layers", "review", "traditions"]) state[k].clear();
    render();
  });
  window.addEventListener("hashchange", () => {
    renderLeads();
    const el = document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if (el) el.scrollIntoView({ block: "start" });
  });

  render();
  const first = document.getElementById(decodeURIComponent(location.hash.slice(1)));
  if (first) first.scrollIntoView({ block: "start" });
})();
</script>
